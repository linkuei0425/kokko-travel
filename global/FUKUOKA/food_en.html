moky charred flavor. Paired with house-made dairy/egg-free sauce and crisp lettuce, it\u0027s a great vegetarian choice to enjoy a lively American atmosphere.", "name": "Hard Rock Cafe Fukuoka", "transport": "Directly connected from JR Hakata Station Hakata Exit to 2F JR JP Hakata Building"}, {"address": "6F Hakata Marui, 9-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 | A famous local specialty coffee shop in Hakata offering custom oat milk specialty coffee and vegan plant-based pastries. The plant-milk lattes are silky and smooth with a deep nutty aroma, pairing perfectly with plant-based scones that are crispy outside and soft inside. Sitting by the high-floor window overlooking the Hakata Station plaza makes it the top choice for an elegant afternoon tea.", "name": "REC COFFEE Hakata Marui", "transport": "Directly connected from JR Hakata Station Hakata Exit to 6F Hakata Marui"}, {"address": "Hakata Noodle Street, 2F Hakata DEITOS, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | A prestigious classic Japanese restaurant carrying on the tradition of handcrafted soba noodles, offering vegetarian-friendly options. The signature seiro (bamboo tray) soba is made from 100% pure buckwheat, delivering springy, chilled, and smooth noodles with a rich buckwheat aroma. Enjoyed with pure salt or a plant-based dipping sauce, it offers a fragrant and light taste for a genuine taste of traditional Japanese vegetarian noodle culture.", "name": "Shinshu Soba Murata Hakata DEITOS", "transport": "Direct access from JR Hakata Station Chikushi Exit to Hakata Noodle Street on 2F Hakata DEITOS"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "JR Hakata Station Concourse, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.3 stars | An insanely popular grab-and-go sweet treat inside Hakata Station that always draws a line! Their mini croissants are coated with a thin syrup glaze before baking, yielding an extraordinarily crispy crust with a delightful crunch, while remaining incredibly soft, fluffy, and buttery inside. Available in original, chocolate, and sweet potato flavors, they are sold by weight. The blend of sweetness and savory butteriness makes this a must-buy snack for both tourists and daily commuters.", "name": "Forno del Mignon - Hakata Station (il FORNO del MIGNON)", "transport": "Inside JR Hakata Station (near Central Gate)"}, {"address": "JR Hakata Station Concourse, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.2 stars | A takeout shop created by Yamaya, the famous Hakata spicy cod roe brand, specializing in freshly baked mentaiko baguettes. This street-food favorite features a crispy, delightfully chewy crust that gives way to a soft interior stuffed with rich signature mentaiko spread and butter. The savory, mild kick of the cod roe harmonizes effortlessly with smooth, rich butter, creating an irresistible treat for a warm breakfast or an afternoon snack.", "name": "YAMAYA BASE - Hakata Station (YAMAYA BASE HAKATA STA.)", "transport": "About a 1-minute walk outside the Tsukushi Gate ticket barriers at JR Hakata Station"}, {"address": "B1F KITTE Hakata, 9-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.1 stars | Hailing from Fukuoka\u0027s fashionable Daimyo district, this ultra-popular soft serve shop is famous for its dense, velvety texture. Exceptionally smooth and firm with zero ice crystals, it feels almost like an ultra-rich fresh milk mousse. Made with premium local Kyushu milk, it boasts a deeply rich dairy flavor paired with a striking black bamboo charcoal cone\u2014making it both a visual treat and an irresistible dessert while shopping.", "name": "Daimyo Softcream - KITTE Hakata (DAIMYO SOFTCREAM KITTE HAKATA)", "transport": "Directly connected to B1F of KITTE Hakata from JR Hakata Station (Hakata Exit)"}, {"address": "1F Miyagemon Market, Hakata DEITOS, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.4 stars | Famous for its iconic Hakata mentaiko (spicy cod roe), Fukutaro serves a must-try market-style snack: freshly made grilled mentaiko rice balls (yaki onigiri). Glazed with special sauce and grilled over high heat, the outer layer turns golden and delightfully crispy like toasted rice crust, while the inside is generously filled with savory, mildly spicy mentaiko. The aroma of toasted rice combined with savory cod roe makes it a favorite among foodies worldwide.", "name": "Fukutaro - Hakata DEITOS (Fukutaro Hakata DEITOS)", "transport": "Inside \u0027Miyagemon Market\u0027 on 1F Hakata DEITOS, Tsukushi Exit of JR Hakata Station"}, {"address": "JR Hakata Station Concourse, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.0 stars | A beloved bakery inside Hakata Station, best known for its soft-boiled egg curry bread. Coated in breadcrumbs and deep-fried to golden perfection, the exterior yields a satisfying crunch. Inside, hearty Japanese curry envelops a runny soft-boiled egg. As the warm yolk bursts and mixes with the rich, mildly spicy curry, it creates an amazingly smooth, luxurious bite\u2014a hugely popular snack among commuting locals.", "name": "TRANDOR - Hakata Station (TRANDOR Hakata Station)", "transport": "Outside ticket gates at JR Hakata Station (inside the concourse on the Hakata Exit side)"}, {"address": "Ming Shopping Arcade, JR Hakata Station Underground Mall, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.5 stars | Home to the gold-award-winning premium traditional Japanese confectionery \u0027Hakata Torimon\u0027. Featuring an ultra-thin, soft skin filled with a silky mixture of high-quality white bean paste, butter, and condensed milk, it melts effortlessly in your mouth. Richly creamy yet delicately balanced without being overly sweet, it is the most popular traditional street snack and souvenir inside Hakata Station.", "name": "Meigetsudo - Hakata Station Ming (Meigetsudo Hakata Station Ming)", "transport": "Inside Ming Shopping Arcade, Underground Mall of JR Hakata Station"}, {"address": "1F Hakata DEITOS, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka", "feature": "\u2b50 4.2 stars | A take-out stall specializing in Japanese fried chicken (karaage) made with Kyushu\u0027s renowned brand chicken, Hanamidori. Fried to a light, crispy golden finish without being greasy, the meat remains tender, juicy, and packed with flavor. Coupled with signature fried chicken wings (tebasaki) and black-vinegar chicken, the sweet, savory, and slightly tangy glazes add flavorful depth\u2014perfect as a hot street snack while exploring around the station or traveling.", "name": "Hakata Hanamidori Karaage - Hakata DEITOS (Hakata Hanamidori Hakata DEITOS)", "transport": "Direct access from Tsukushi Exit of JR Hakata Station to 1F Hakata DEITOS"}, {"address": "2-1 Hakataekimae, Hakata Ward, Fukuoka", "feature": "\u2b50 4.1 stars | One of the few authentic traditional yatai (food stalls) remaining near Hakata Station. Brimming with classic Hakata street market charm, its signature oden is simmered to perfection, with daikon radish absorbing the savory dashi broth until tender and melting. They also serve freshly grilled mentaiko-stuffed chicken wings and aromatic yakitori with a crispy bite and tender center. Sitting shoulder-to-shoulder around this cozy cart to enjoy late-night food culture is an authentic, soul-soothing local experience.", "name": "Yatai Ebisu (Hakata Ekimae Yatai)", "transport": "About a 3-minute walk from the Hakata Exit of JR Hakata Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Hakata Station Area"}, "itoshima": {"categories": {"cat_1": {"items": [{"address": "1334-1 Kamiazai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | The birthplace of Fukuoka Hakata soft udon! This legendary traditional noodle shop is famous for its \u0027endless udon\u0027 that continuously absorbs soup and swells as you eat. Served piping hot, the noodles soak up a golden dashi broth brewed from Rishiri kelp and bonito, delivering an extraordinarily soft, smooth texture rich with oceanic flavor. Because the noodles keep absorbing liquid, a kettle of hot soup is provided on the side for refills. Paired with crispy deep-fried burdock root and savory-sweet stewed beef, every bowl offers rich layers of flavor that captivate locals and traveling foodies alike.", "name": "Makino Udon - Maebara Main Store (\u7267\u306e\u3046\u3069\u3093 \u524d\u539f\u672c\u5e97)", "transport": "Take the JR Chikuhi Line to \u0027Gafuri Station\u0027, then walk for about 10 minutes."}, {"address": "336-14 Shimahatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A wildly popular oceanfront seafood bowl institution boasting stunning blue views of Itoshima! Featuring carefully selected fresh catches from the Genkai Sea, their signature \u0027Special Seafood Rice Bowl\u0027 is generously topped with luscious bluefin fatty tuna, salmon roe, sweet scallops, and sea urchin. Thickly sliced sashimi melts in your mouth with an explosion of rich umami, beautifully balanced by Kyushu\u0027s signature sweet soy sauce and seasoned vinegared rice. With mesmerizing ocean views and a gentle sea breeze, it offers an unforgettable visual and culinary feast that is an absolute must-visit in Itoshima.", "name": "Itoshima Shokudo Main Store (\u7cf8\u5cf6\u98df\u5802 \u672c\u5e97)", "transport": "From JR \u0027Chikuzen-Maebara Station\u0027, take the Showa Bus to \u0027Hatsu\u0027 stop, then walk for about 5 minutes."}, {"address": "1-7-1 Hataekaminami, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A renowned local fishmonger eatery that won Gold at the All-Japan Seafood Bowl Awards! Expertly curated by seasoned seafood specialists, seasonal catches from the Genkai Sea shine in their signature \u0027Premium Seafood Bowl\u0027\u2014a jewel box packed with ultra-fresh red sea bream, sweet shrimp, yellowtail, and deep-sea tuna. The sashimi is firm and springy with a subtle natural sweetness, paired wonderfully with rich sesame sauce or sweet soy sauce over warm rice. Radiating a traditional Japanese Kappo dining vibe, long queues form every day even before opening.", "name": "Tsukamoto Sengyoten (\u585a\u672c\u9bae\u9b5a\u5e97)", "transport": "Take the JR Chikuhi Line to \u0027Hatae Station\u0027, exit and walk for about 3 minutes."}, {"address": "1384-2 Kamiazai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A household-name charcoal yakitori institution located on the border between Saga and Fukuoka! This classic roadside restaurant is famous for tender local poultry and a secret traditional sauce. Their signature charcoal-grilled chicken uses premium Saga brand chicken, grilled over open hearth coals until the skin turns golden crisp while locking in savory juices. Don\u0027t miss their iconic \u0027Chicken Fried Rice\u0027, infused with chicken fat and shiitake mushrooms\u2014fragrant, comforting, and loved across generations of families and food enthusiasts.", "name": "Drive-In Tori Itoshima (\u30c9\u30e9\u30a4\u30d6\u30a4\u30f3\u9ce5 \u7cf8\u5cf6\u5e97)", "transport": "Take the JR Chikuhi Line to \u0027Gafuri Station\u0027, then walk for about 12 minutes."}, {"address": "711-3 Shimakishi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | The ultimate traditional fishing port culinary experience during winter in Itoshima! Located right by Kishi Port, Fujimaru serves fresh, plump \u0027Itoshima Milk Oysters\u0027 grilled straight from the water. As the shells pop open over charcoal or gas grills, juicy broth simmers inside, revealing extraordinarily tender oysters packed with creamy oceanic umami. Delicious on their own, they are also delightful drizzled with citrus ponzu sauce or topped with melted cheese you bring along. An addictive feast where you can\u0027t stop at just one!", "name": "Kishi Port Oyster Hut Fujimaru (\u5c90\u5fd7\u6f01\u6e2f \u30ab\u30ad\u5c0f\u5c4b \u5bcc\u58eb\u4e38)", "transport": "From the North Exit of JR \u0027Chikuzen-Maebara Station\u0027, take the Showa Bus (Keya Line) to \u0027Kishi\u0027 stop, then walk for about 3 minutes."}, {"address": "460-6 Shiraito, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A classic summer retreat nestled in the scenic mountain forests! Situated next to the famous Shiraito Falls, this spot offers traditional Japanese bamboo flume \u0027Nagashi Somen\u0027 (flowing thin noodles). Chilled mountain spring water carries delicate somen noodles down split bamboo logs right to your chopsticks. Dipped in sweet tsuyu sauce, the noodles are refreshingly cool and springy. Combined with the sound of the cascading waterfall and cool breeze, it\u0027s a sensory delight. Don\u0027t forget to try the charcoal-grilled yamame trout, crispy on the outside and tender within!", "name": "Shiraito Falls Nagashi Somen (\u767d\u7cf8\u306e\u6edd \u6d41\u3057\u305d\u3046\u3081\u3093)", "transport": "From JR \u0027Chikuzen-Maebara Station\u0027, take the Showa Bus (Shiraito Line) to \u0027Shiraito no Taki\u0027 stop, located right by the site."}, {"address": "3-35-1 Yokohama, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A beloved traditional eatery near the Itoshima area that consistently tops the Hakata Tonkotsu Ramen rankings! Decades of unwavering tradition yield a rich, milky pork bone broth slow-simmered to perfection\u2014velvety smooth with zero gaminess and a gentle natural sweetness. Ultra-thin, al dente noodles cling beautifully to the broth. Their fried rice is legendary\u2014a smoky, wok-hei-infused masterpiece with fluffy individual grains that pairs flawlessly with a bowl of ramen for an iconic double feast.", "name": "Anzen Shokudo (\u5b89\u5168\u98df\u5802)", "transport": "Take the JR Chikuhi Line to \u0027Kyudaimae Gakken-toshi Station\u0027, exit and walk for about 5 minutes."}, {"address": "256-10 Shimamatsukuma, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | The homeland and production heartland of world-famous Ichiran Ramen! Nestled in the lush greenery of Itoshima, this facility houses a factory alongside a classic ramen restaurant. Here, you can savor the exclusive \u0027Jubako Tonkotsu Ramen\u0027, served in a square Arita-ware lacquered box that retains heat beautifully. Rich broth spiked with Ichiran\u0027s spicy red secret sauce delivers an incredible depth of flavor alongside firm, homemade thin noodles. After dining, explore the on-site Ramen Museum and tranquil bamboo garden to immerse yourself in Ichiran\u0027s craftsmanship and heritage.", "name": "Ichiran no Mori Itoshima (\u4e00\u862d\u306e\u68ee \u7cf8\u5cf6\u5e97)", "transport": "Take a taxi for about 15 minutes from JR \u0027Chikuzen-Maebara Station\u0027, or take the Showa Bus to \u0027Matsukuma\u0027 stop and walk from there."}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "284 Nishiura, Nishi Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | As the pioneer of cafes along the Itoshima coastline, Beach Cafe SUNSET boasts spectacular panoramic ocean view seating and a rich Hawaiian resort vibe. Popular brunch options here include their special Loco Moco and freshly squeezed juices. The burger patty is seared to perfection\u2014crispy on the outside, tender on the inside, and bursting with savory juices\u2014paired with a house-made sauce and a sunny-side-up egg. Rich, flavorful, and remarkably satisfying, it is a massive favorite among both tourists and local youth.", "name": "Beach Cafe SUNSET", "transport": "Take the Showa Bus \u0027Nishiura Line\u0027 from JR Kyudaimae-Gakkentoshi Station to \u0027PALM BEACH\u0027 stop, then walk for about 3 minutes."}, {"address": "2290 Shimanogita, Itoshima, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Perched on a hillside overlooking the Nogita Coast, this white European-style restaurant serves freshly baked artisanal bread brunch platters every morning. The platter is wonderfully generous: crusty yet soft European bread paired with rich handmade butter, accompanied by a fresh local organic salad and silky scrambled eggs. Enjoying a multi-layered meal on the open-air terrace while feeling the sea breeze is an immensely soothing experience.", "name": "Cafe Restaurant CURRENT", "transport": "About a 20-minute drive from JR Chikuzen-Maebaru Station, or take the Showa Bus Keya Line to \u0027Nogita\u0027 stop and walk for about 10 minutes."}, {"address": "2289-6 Shimanogita, Itoshima, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A wildly popular coastal cafe housed in a bright red double-decker vintage London bus, directly facing the magnificent Genkai Sea. The second-floor seating allows guests to sip coffee while gazing out at the azure ocean views. Their signature artisanal gelato and freshly brewed espresso are must-tries. The gelato is remarkably smooth and velvety, with local fresh milk and rich matcha flavors offering a balanced sweetness that pairs perfectly with a creamy latte.", "name": "London Bus Cafe", "transport": "About a 20-minute drive from JR Chikuzen-Maebaru Station, or take the Showa Bus to \u0027Nogita\u0027 bus stop and walk for about 5 minutes."}, {"address": "4420 Shimasakurai, Itoshima, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Located right on the front line of Okuchi Beach, this charming seaside wooden cafe serves exquisite French-style brunch and homemade desserts. The classic French toast comes highly recommended\u2014soaked thoroughly in rich egg and milk, seared until golden and caramelized on the outside while staying tender and custard-like inside. Drizzled with pure maple syrup and fresh tangy berries, its multi-layered sweet flavor draws food lovers from near and far.", "name": "Bistro \u0026 Cafe TIME", "transport": "About a 20-minute taxi ride from JR Chikuzen-Maebaru Station, or drive along the coastal highway (private parking available)."}, {"address": "219-1 Nishiura, Nishi Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A Japanese-Western fusion oceanfront cafe near Futamigaura Couple Stones, renowned for its delicate Japanese souffl\u00e9 pancakes and in-house roasted coffee. Made fresh to order, the pancakes are light and airy as clouds, melting instantly in your mouth with rich egg and pure milk aromas. Paired with special matcha sauce or brown sugar syrup, they offer a refined, non-greasy sweetness. The minimalist elegant decor seamlessly blends with breathtaking ocean views, making it a hotspot for a high-quality brunch.", "name": "Itoshima Sabo", "transport": "Take the Showa Bus \u0027Nishiura Line\u0027 from JR Kyudaimae-Gakkentoshi Station and get off at \u0027PALM BEACH\u0027 stop."}, {"address": "285-B Nishiura, Nishi Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Situated next to the famous Instagram spot \u0027Angel Wings\u0027 mural, this restaurant features a spacious ocean-view terrace and a tropical resort atmosphere. During brunch, they serve an array of Italian pizzas and seafood pastas. The garlic chili seafood pasta made with fresh local catches is a highlight\u2014al dente noodles infused with rich seafood flavors and aromas, perfectly paired with a cold signature sparkling drink for a true vacation vibe.", "name": "PALM BEACH Restaurant", "transport": "Take the Showa Bus \u0027Nishiura Line\u0027 from JR Kyudaimae-Gakkentoshi Station and get off at \u0027PALM BEACH\u0027 bus stop."}, {"address": "1155-1 Moto, Itoshima, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away inside the traditional house complex \u0027Shinsaburo Shoten\u0027, this rustic cafe was converted from an old Meiji-era granary. It is most famous for its handmade salted caramel pudding featuring Itoshima\u0027s renowned \u0027Mataichi Salt\u0027, alongside pour-over coffee. The pudding is exceptionally smooth and velvety, with the subtle bitterness of caramel and rich dairy enhanced by the savory hint of natural sea salt\u2014a masterclass in sweet-and-salty balance loved by locals and food connoisseurs alike.", "name": "Sumi Cafe", "transport": "About a 10-minute taxi ride from JR Chikuzen-Maebaru Station, or drive via Route 85."}, {"address": "2461-2 Shimanogita, Itoshima, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A hidden wooden cafe nestled at the intersection of Itoshima\u0027s forest and coast, overflowing with lush greenery and cozy, rustic charm. Their hot-pressed sandwich brunch platter receives rave reviews\u2014made with whole wheat bread from a local bakery, toasted to a crispy finish and stuffed with thick-cut bacon, fresh tomatoes, and rich melted cheese. Every crunchy, flavorful bite paired with the calm, tranquil atmosphere makes it the ultimate spot to enjoy a relaxed morning.", "name": "RUSTIC BARN", "transport": "About a 20-minute drive from JR Chikuzen-Maebaru Station, or take the Showa Bus to \u0027Nogita\u0027 stop and walk for about 15 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "33-1 Shimatsuwasaki, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A legendary seafood spot known to everyone in Itoshima, famous for its ultra-fresh seafood bowls and set meals. The house special bowl features prime sashimi caught fresh from the Genkai Sea\u2014thickly sliced tuna, salmon, and red sea bream with an extraordinarily firm and rich texture. Served with custom sweet soy sauce and seasoned rice, every bite bursts with natural ocean sweetness, drawing crowds willing to wait hours in line.", "name": "Tsukamoto Sengyoten", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus to \u0027Tsuwasaki\u0027 stop, then walk about 3 minutes."}, {"address": "284 Nishiura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1990, SUNSET is the pioneer scenic bistro that kicked off Itoshima\u0027s coastal tourism boom. The menu features tropical-style dishes highlighting local Fukuoka ingredients. The popular \u0027Itoshima Pork Hamburg Steak\u0027 is juicy, dense, and full of rich flavor. Paired with tropical cocktails or aromatic coffee while taking in the stunning sunset over the Futamigaura coast, it offers a laid-back resort vibe that attracts young couples and travelers alike.", "name": "Beach Cafe SUNSET", "transport": "From JR Kyudai-gakuentoshi Station, take the Showa Bus (Nishiura Line) to \u0027PALM BEACH\u0027 stop, then walk about 5 minutes."}, {"address": "285-B Nishiura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A stylish bistro sitting prime on the front line of the Futamigaura coast, specializing in pasta and refined local cuisine. The signature \u0027Itoshima Vegetable \u0026 Fresh Seafood Pasta\u0027 uses morning-harvested vegetables from local farms and fresh shellfish. The springy pasta absorbs the rich, flavorful broth, enhanced with subtle garlic and olive oil for a light, refreshing meal. Ocean views paired with warm wooden decor make this a top choice for a relaxing lunch.", "name": "Itoshima Sabo", "transport": "From JR Kyudai-gakuentoshi Station, take the Showa Bus (Nishiura Line) to \u0027Futamigaura (Meotoiwa-mae)\u0027 stop, right outside."}, {"address": "4414 Shimasakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A French-style wooden bistro located right by Oguchi Beach, just steps from the sand. The chef utilizes farm-direct meats and seasonal vegetables from Itoshima to craft exquisite dishes like the \u0027Pan-Seared Itoshima Pork with Seasonal Vegetables.\u0027 The pork features a crispy skin with tender, juicy meat inside, paired with a secret herb sauce for rich layers of flavor. Dining on high-quality local French cuisine while listening to the ocean waves creates an exquisitely romantic atmosphere.", "name": "Bistro \u0026 Cafe TIME", "transport": "About 20 minutes by taxi from JR Chikuzen-Maebaru Station, or take the Showa Bus to \u0027Sakurai\u0027 stop and walk about 15 minutes."}, {"address": "778-5 Shimakishi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A quintessential winter seafood hut in Itoshima run directly by fishermen, offering fresh \u0027Itoshima Oysters\u0027 straight from the source. The grilled oysters are plump and succulent; once charcoal-grilled, the shells hold a rich, savory ocean broth. Each bite is unbelievably smooth, melting in your mouth with a creamy flavor profile. Paired with local sparkling wine or sake, it\u0027s the ultimate spot to soak in the warmth and flavor of a local fishing port.", "name": "Tokueimaru Oyster House (Kishi Fishing Port)", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus (Keya Line) to \u0027Kishi\u0027 stop, then walk about 5 minutes."}, {"address": "285-A Nishiura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | An ocean-view restaurant specializing in premium seafood and handcrafted local dishes. Most famous for its \u0027Special Sea Urchin \u0026 Salmon Roe Rice Bowl\u0027 and \u0027Bluefin Tuna Combo Bowl.\u0027 Using carefully selected sea treasures caught in the Genkai Sea, the sea urchin is smooth and rich without any bitterness, while the salmon roe bursts with savory-sweet flavor. Combined with warm rice, it\u0027s a top-tier delicacy. Magnificent floor-to-ceiling windows overlooking Futamigaura\u0027s Married Couple Rocks complete the luxurious experience.", "name": "Itoshima Kaisendo", "transport": "From JR Kyudai-gakuentoshi Station, take the Showa Bus (Nishiura Line) to \u0027Futamigaura (Meotoiwa-mae)\u0027 stop, then walk about 1 minute."}, {"address": "286-1 Nishiura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A casual Italian bistro located inside the PALM BEACH THE GARDENS complex, highlighting wood-fired pizzas and Italian seafood made with local Itoshima ingredients. The signature \u0027Itoshima Saga Beef Pizza\u0027 is baked fresh in a high-temperature stone oven, giving it a crispy crust with a chewy, fragrant center. Topped with seared local Wagyu beef and rich melted cheese, it offers a savory, delightful flavor highly praised by families and tourists alike.", "name": "PALM BEACH Restaurant", "transport": "From JR Kyudai-gakuentoshi Station, take the Showa Bus (Nishiura Line) to \u0027PALM BEACH\u0027 stop, right outside."}, {"address": "1155-1 Moto, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A charming traditional house cafe operated by Itoshima\u0027s famous artisan salt producer, \u0027Mataichi no Shio.\u0027 A century-old folk house renovated into an atmospheric dining area, its local dishes and desserts cleverly incorporate handcrafted sea salt. The standout \u0027Sea Salt Caramel Pudding\u0027 is silky smooth, perfectly balancing the subtle bitterness of caramel with the delicate savoriness of sea salt to enhance the flavor without being overly sweet\u2014a legendary local treat sweeping Fukuoka.", "name": "Shinsaburo Shoten / Sumi Cafe", "transport": "About a 10-minute taxi ride from JR Chikuzen-Maebaru Station."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "32-1 Shima Hatsushimo, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A vegetarian-friendly cafe dedicated to local, pesticide-free organic vegetables from Itoshima. Highlights include meat-free vegetable curry and seasonal veggie platters. Crisp, fresh, and sweet, the dishes capture the pure flavor of Itoshima\u0027s soil, making it a favorite among health-conscious tourists and local vegetarians.", "name": "Itoshima Slow Cafe", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station, get off at \u0027Hatsu\u0027 bus stop, and walk for about 3 minutes."}, {"address": "2195-1 Oda, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An oceanfront restaurant with breathtaking sea views, offering signature large local Itoshima salad platters and vegan natural smoothies. High-fiber, sweet, pesticide-free greens paired with special plant-based dressings provide a light, refreshing boost\u2014ideal for recharging after a stroll along the beach.", "name": "Itoshima Sabo", "transport": "Take the Showa Bus (Nishinoura Line) from JR Kyudaimaerukentoshi Station and get off at \u0027PALM BEACH\u0027 stop."}, {"address": "3-18-18 Maebaru Chuo, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A cozy health cafe focusing on plant-based and raw food desserts. Highly recommended are the vegan nut cheese tart and organic brown rice vegetable plate. Smooth and delicately textured, the desserts rival conventional dairy-and-egg treats, earning glowing reviews from vegans and female travelers alike.", "name": "Organic \u0026 Vegan Cafe Hachidori", "transport": "About a 7-minute walk from JR Chikuzen-Maebaru Station."}, {"address": "786-1 Shima Moriyoshi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Based on authentic macrobiotic principles, this eatery carefully selects organic Itoshima brown rice and naturally grown seasonal vegetables. The signature organic tofu burger patty is crispy on the outside and tender on the inside, topped with a special organic soy sauce vinaigrette for a deeply satisfying flavor.", "name": "Gohanya Inori (Itoshima Vegetarian Eatery)", "transport": "About a 10-minute taxi ride from JR Chikuzen-Maebaru Station."}, {"address": "2708-17 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A wooden ship-shaped building set along the Itoshima coastline, oozing reggae vibes. Serving classic Jamaican vegetarian fare and veggie patties made fresh to order. The crust is crispy yet soft inside, packed with rich spices and natural vegetable sweetness for a truly unique coastal dining experience.", "name": "Natty Dread Cafe", "transport": "About a 20-minute taxi ride from JR Chikuzen-Maebaru Station or accessible by car."}, {"address": "4420-1 Imazu, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located right by Itoshima\u0027s beautiful beach, offering a variety of plant-based pasta and multi-grain rice sets. The signature tomato basil vegetarian pasta features al dente noodles paired with rich, juicy local cherry tomatoes for a guilt-free, delicious meal.", "name": "Sun Flower Ocean View Cafe", "transport": "About a 15-minute drive from JR Kyudaimaerukentoshi Station."}, {"address": "5533 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Dedicated to crafting dairy-and-egg-free vegan bread using Fukuoka wheat and additive-free plant-based ingredients. The signature natural yeast organic veggie bread has a crispy crust and a fluffy, chewy interior that releases the natural sweetness of wheat and vegetables with every bite.", "name": "Bakery \u0026 Cafe Loiter", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station, get off at \u0027Sakurai\u0027 bus stop, and walk for about 5 minutes."}, {"address": "2589 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Nestled along the Itoshima coastline with a charming French country vibe. Offers rich vegan French quiches and seasonal warm vegetable salads. The quiche filling is fluffy and flavorful with a flaky, non-greasy crust\u2014hugely popular among health-conscious foodies.", "name": "Cafe Du Bateau", "transport": "Take the Showa Bus (Keya Line) from JR Chikuzen-Maebaru Station, get off at \u0027Keya\u0027 bus stop, and walk for about 8 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "3757 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Tucked away next to a salt refinery at the westernmost tip of Itoshima, this stroll-friendly dessert, the \u0027Flower Salt Caramel Pudding\u0027, is acclaimed as a must-try dream snack when visiting Itoshima! Made with specially extracted flower salt from the local Genkai Sea, paired with rich, silky high-grade egg pudding, drizzled with fragrant caramel sauce, and topped with crunchy, lightly salted crystal salt grains. Taking a bite, the silky-smooth pudding melts in your mouth, where the subtle saltiness perfectly elevates the sweet caramel and creamy flavors. The sweet-and-savory harmony is utterly light and layered, making it unforgettable. Both tourists and locals highly recommend sitting on the seaside wooden benches to savor this limited edition delicacy accompanied by the ocean breeze and sound of waves.", "name": "Kobo Tottan - Mataichi no Shio Pudding", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station to \u0027Keya\u0027 stop, then walk for about 30 minutes; or drive for about 25 minutes."}, {"address": "2234 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Parked along the Nogita coast, this vintage silver Airstream food truck is an iconic, photo-worthy snack stop along the coastline. It specializes in handcrafted gelato made with zero artificial flavors or colors, featuring a dense, extraordinarily smooth texture. Popular flavors include \u0027Itoshima Pure Milk\u0027 and \u0027Itoshima Amanatsu Citrus\u0027. The pure milk flavor offers a rich milky aroma with a refreshing finish, while the citrus flavor balances sweet and sour notes with real fruit pulp texture. Holding a cup of colorful gelato for photos in the sea breeze is delightfully refreshing and not overly sweet\u2014a must-have summer treat during a beachside stroll.", "name": "Loiter Market Gelato Truck", "transport": "About 20 minutes by car from JR Chikuzen-Maebaru Station; or take the Showa Bus (Keya Line) to near Nogita and walk."}, {"address": "2-2 Shima Hatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Nestled halfway up the hills of Itoshima, this independent artisan workshop features a takeaway snack stand serving incredible custom hot dogs. Using premium local Itoshima pork, the sausages are smoked following traditional German techniques. The moment you bite into the freshly grilled sausage, the casing snaps crisp, bursting with savory juices, complemented by rye bread toasted to a crisp-outside, soft-inside texture and custom sauerkraut. Hearty, savory, and richly layered, this takeaway hot dog is a classic street snack highly sought after by cyclists and road-trippers visiting Itoshima.", "name": "Itoshima Tezukuri Ham Hot Dog \u0026 Sausage Stand", "transport": "About 15 minutes by car from JR Chikuzen-Maebaru Station."}, {"address": "2129-21 Miyaura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located at the takeaway window of an American-style oceanfront restaurant right in front of Meoto Iwa (Couples Stones), its takeout handcrafted American burgers and garlic butter shrimp boxes are wildly popular. The burgers feature thick, juicy all-beef patties seared on a hot griddle until lightly charred on the outside and packed with juice inside, layered with cheddar cheese and fresh lettuce inside a soft, buttery bun. The garlic shrimp bursts with rich garlic and butter aromas, featuring firm and bouncy shrimp meat. Grabbing a box to enjoy on the beach while gazing at the sea offers a bold, juicy tropical food experience that is hugely popular among youth and couples.", "name": "SURF SIDE CAFE Beach Burger \u0026 Garlic Shrimp", "transport": "Take the Showa Bus (Nishinoura Line) from JR Kyudai-gakentoshi Station and get off at \u0027Futamigaura-mae\u0027 stop."}, {"address": "2290 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Perched on a hill along the Nogita coast, this gorgeous bakery restaurant bakes a daily variety of stroll-friendly pastries made with high-quality local ingredients in its takeout section. The top recommendation is the \u0027Itoshima Sea Salt Croissant\u0027, which shatters with a satisfying crunch as you bite into its golden crust, revealing a soft, buttery interior sprinkled with distinct sea salt crystals from the Genkai Sea that perfectly strike a sweet and savory balance. Another favorite is the freshly fried curry bread filled with rich curry and chunky minced meat\u2014crispy outside and chewy inside\u2014making it an essential snack to enjoy in the car or by the shore during a coastal tour.", "name": "CURRENT Bakery Takeout", "transport": "About 20 minutes by car from JR Chikuzen-Maebaru Station; or take the Showa Bus and get off near Nogita Coast, then walk for about 10 minutes."}, {"address": "778-5 Shima Kishi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | From autumn to spring each year, the oyster huts gathered along Kishi Fishing Port become Itoshima\u0027s most iconic seasonal market. Freshly charcoal-grilled oysters are plump and juicy, sliding into your mouth tender and bouncy, infused with the ultimate fresh sweetness of the sea. The \u0027Special Seafood Grilled Rice Balls\u0027 sold at the stalls are brushed with sweet soy sauce and grilled until the exterior is fragrant and crispy; the rice soaks up rich seafood broth, yielding a crunch outside and softness inside with bursting aroma. Locals and tourists alike love grilling and eating on the spot, immersing themselves in the heartwarming market vibe and seaside fishing port charm.", "name": "Kishi Fishing Port Seafood Snacks", "transport": "Take the Showa Bus (Keya Line) from JR Chikuzen-Maebaru Station to \u0027Kishi\u0027 stop, then walk about 5 minutes."}, {"address": "33-1 Shima Tsuwazaki, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | As the most famous direct-sales agricultural and seafood market in the Shima area of Itoshima, the ready-to-eat section\u0027s handmade \u0027Itoshima Freshly Fried Fish Cakes (Satsuma-age)\u0027 come highly recommended by locals as a strolling snack. Made from white fish paste freshly caught from the Genkai Sea that day, mixed with diced local onions and burdock root, and fried to order. The fish cake boasts a lightly crispy golden exterior and a bouncy, elastic interior filled with natural fish sweetness and vegetable fragrance. Holding it hot in hand as you walk and snack, its savory, sweet, and hearty taste makes it a must-try everyday delicacy for experiencing local farm-to-table market culture.", "name": "Shima no Shiki Market Fish Cakes", "transport": "Take the Showa Bus (Hatsu Line) from JR Chikuzen-Maebaru Station to \u0027Shima Hatsu\u0027 stop, then walk about 3 minutes."}, {"address": "567-1 Hatae, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | As the number one farmer\u0027s market in Japan by sales, Ito Saisai\u0027s food counter serves the \u0027Ito Monogatari Rich Milk Soft Serve\u0027, a must-try treat that countless tourists visit specifically for. Made directly from Ito Monogatari fresh milk supplied by contracted local Itoshima farms, the soft serve is incredibly dense, rich, and melts instantly on the tongue. It delivers an astonishing explosion of intense dairy creaminess as if drinking pure, concentrated milk, perfectly balanced in sweetness with a clean finish. Paired with a crispy waffle cone, every bite is filled with the bounty of Itoshima\u0027s land\u2014a blockbuster dessert loved by all ages.", "name": "Ito Saisai Milk Soft Serve", "transport": "About 15 minutes on foot from JR Hatae Station; or about 30 minutes by car from Fukuoka City."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Itoshima Coastal Scenic Area"}, "momochi": {"categories": {"cat_1": {"items": [{"address": "4-9-17 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Yanagawaya is a highly renowned, decades-old unagi (eel) institution in Fukuoka, located in the Nishijin shopping district near Momodihama Beach. Their signature dish is Fukuoka\u0027s traditional \u0027Seiro Mushi\u0027 (steamed eel rice), where kabayaki grilled eel and sauce-infused rice are steamed together in a bamboo basket. The eel flesh is tender, delicate, and packed with aroma, while the rice absorbs the savory eel sauce, achieving a moist, delightfully chewy texture with a subtle woody scent. Highly praised by locals and tourists alike for its traditional tare sauce and melt-in-your-mouth richness, this classic spot is an absolute must-visit near Fukuoka Tower and Mizuho PayPay Dome.", "name": "Yanagawaya Nishijin", "transport": "Approx. 3-min walk from Exit 4 of Nishijin Station on the Subway Kuko Line"}, {"address": "4-9-18 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Founded in 1953, Houraku Manju is one of the most iconic traditional dessert shops in Fukuoka\u0027s Nishijin Shopping Street. A beloved local street snack, these steamed cakes feature a golden, pillowy skin with filling sweetened using pure natural honey, available in red bean and white bean paste options. Taking a bite reveals a smooth, silky texture that is pleasantly sweet, blending honey notes with rich bean flavors. Affordable and made fresh on the spot, you\u0027ll often see lines of locals and tourists waiting for freshly made manju\u2014making this the top choice to sample Fukuoka\u0027s traditional everyday sweets.", "name": "Houraku Manju Fukuoka Main Store", "transport": "Approx. 2-min walk from Exit 2 of Nishijin Station on the Subway Kuko Line"}, {"address": "4-9-3 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Mucchan Manju is a legendary street snack stall in Fukuoka, famous for its mudskipper-shaped waffle cakes. The most popular flavor, \u0027Ham \u0026 Egg\u0027, features a light, soft-chewy golden exterior stuffed with a whole soft-boiled egg, creamy Japanese mayonnaise, and ham. Biting into it releases a rich explosion of egg yolk and mayo, creating a uniquely addictive savory-sweet delight. In addition to savory options, sweet fillings like red bean and custard are available, making it a nostalgic soul food that locals have loved since childhood.", "name": "Mucchan Manju Nishijin", "transport": "Approx. 2-min walk from Exit 2 of Nishijin Station on the Subway Kuko Line"}, {"address": "3-12-31 Josei, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Established in 1953, Shibaraku is a historic and traditional Tonkotsu ramen shop in Fukuoka. The pork bone broth is simmered using traditional methods refined over decades, delivering a light yet deeply satisfying classic Tonkotsu aroma without any overpowering gaminess. Thin, straight noodles cling to the broth perfectly, complemented by thick-cut chashu pork and wood ear mushrooms for a pure and outstanding bowl. Located close to the Mizuho PayPay Dome, many baseball fans and tourists come here after games to enjoy a comforting bowl of ramen rich in nostalgic history.", "name": "Hakata Ramen Shibaraku Nishijin Main Store", "transport": "Approx. 4-min walk from Exit 4 of Nishijin Station on the Subway Kuko Line"}, {"address": "3F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Tempura Hirao is Fukuoka\u0027s most famous wallet-friendly, long-standing tempura chain, featuring a branch inside the MARK IS shopping center right next to the Dome. The shop strictly avoids pre-frying; chefs serve freshly fried seafood and vegetables directly onto a wire tray in front of guests piece by piece. The batter is feather-light and crispy, locking in the natural sweetness and juices of the ingredients. A major highlight for both locals and visitors is the complimentary, unlimited \u0027Yuzu Salted Squid\u0027 (Ika no Shiokara) at every table\u2014its crunchy texture and savory taste pair perfectly with steaming hot rice.", "name": "Tempura Hirao MARK IS Fukuoka Momochi", "transport": "Approx. 12-min walk from Exit 3 of Tojinmachi Station on the Subway Kuko Line (near Mizuho PayPay Dome)"}, {"address": "1-2-15 Tojinmachi, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Located along the Tojinmachi Shopping Street on the route to the Dome, Kusano Wagashiten is a traditional handmade Japanese confectionery shop with decades of history. Signature treats like Kusa Mochi, Daifuku, and Mitarashi Dango are handcrafted daily using premium domestic sticky rice and red beans. The rice cakes offer a delightfully springy bite, while the red bean filling is smooth and balanced with subtle sweetness, exuding nostalgic vintage charm. A favorite afternoon treat for locals and a perfect snack for a stroll toward Momodihama Beach.", "name": "Kusano Wagashiten", "transport": "Approx. 3-min walk from Exit 4 of Tojinmachi Station on the Subway Kuko Line"}, {"address": "4-4-4 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Ramen Ajiichi is a traditional classic noodle shop beloved by Fukuoka locals and visiting baseball stars. While famous for its rich, smooth Tonkotsu ramen, its fried rice (\u0027Chahan\u0027) is hailed locally as a legendary item and one of the best in Fukuoka. Each grain of rice is perfectly distinct and infused with robust wok hei aroma, cooked with savory minced chashu pork and fragrant eggs to maintain a moist, delicious texture right to the last bite. The cozy, nostalgic neighborhood Chinese diner atmosphere and decades of unchanged quality keep loyal patrons coming back time and again.", "name": "Ramen Ajiichi", "transport": "Approx. 3-min walk from Exit 4 of Nishijin Station on the Subway Kuko Line"}, {"address": "5-1-18 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Yousikou Butaman is an iconic traditional handmade pork bun establishment in Kyushu, with its Nishijin branch conveniently situated along the main path to Momodihama and the Dome. Their signature \u0027Jumbo Pork Bun\u0027 boasts an impressive size; the fluffy steamed bun skin absorbs the savory juices of the filling, remaining pillowy yet chewy. Inside, a generous mix of sweet onions and juicy pork creates an explosion of flavor and rich juices with every bite. The natural sweetness of the onions perfectly balances the savory pork fat, making it an extraordinarily satisfying and juicy snack enjoyed by locals and visitors on the go.", "name": "Yousikou Butaman Nishijin", "transport": "Approx. 4-min walk from Exit 2 of Nishijin Station on the Subway Kuko Line"}], "name": "Classic Local Favorites"}, "cat_2": {"items": [{"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A highly popular American pancake specialty shop located inside MARK IS shopping center, carefully baked with \u0027100% Japanese wheat.\u0027 The signature souffl\u00e9 pancakes are light and airy like clouds, melting instantly in your mouth with rich fermented butter aroma and maple sweetness. Savory options like the Eggs Benedict pancakes feature poached eggs that ooze rich golden yolk when sliced open, perfectly paired with rich Hollandaise sauce and fluffy pancakes to create rich, layered flavors. It\u0027s the top choice for recharging before shopping or enjoying a leisurely brunch.", "name": "J.S. PANCAKE CAFE MARK IS Fukuoka Momochi", "transport": "Nishitetsu Bus to \u0027PayPay Dome-mae\u0027 or \u0027MARK IS Fukuoka Momochi-mae\u0027 bus stop; about a 12-minute walk from Exit 3 of Tojinmachi Station on the Subway Kuko Line."}, {"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A classic Hawaiian brunch chain famous among tourists for its towering hills of whipped cream on pancakes. The pancakes themselves are slightly savory and chewy, matching delightfully with light, non-greasy whipped cream and topped with signature macadamia nut sauce or strawberry syrup for an addictive sweet flavor. For savory lovers, the classic Eggs Benedict is highly recommended, featuring crispy fried potato bites and fragrant seared bacon over crisp-yet-soft English muffins soaked in golden yolk\u2014a satisfyingly tropical resort treat in every bite.", "name": "Eggs \u0027n Things MARK IS Fukuoka Momochi", "transport": "Nishitetsu Bus to \u0027MARK IS Fukuoka Momochi-mae\u0027 bus stop; about a 12-minute walk from Tojinmachi Station on the Subway Kuko Line."}, {"address": "1F, Fukuoka Tower, 2-3-26 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located on the 1st floor of the iconic Fukuoka Tower, this store boasts bright floor-to-ceiling windows and high ceilings, making it the perfect rest stop before or after strolling along Momochihama Beach. Alongside familiar espresso drinks and seasonal Frappuccinos, it offers freshly grilled paninis and warm handmade scones. Crispy on the outside and soft inside, the scones paired with rich whipped cream and a hot, creamy latte offer a delightfully relaxed seaside moment by the sunlit windows, loved by locals and travelers alike.", "name": "Starbucks Coffee Fukuoka Tower", "transport": "Nishitetsu Bus to \u0027Fukuoka Tower Minamiguchi\u0027 or \u0027Fukuoka Tower\u0027 bus stop; about a 20-minute walk from Exit 1 of Nishijin Station on the Subway Kuko Line."}, {"address": "Inside Marizon, Seaside Momochi Seaside Park, 2-902-1 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | An open-air oceanfront cafe located on the Marizon pier at Momochihama Seaside Park, offering panoramic blue views of Hakata Bay. The brunch menu centers around handmade American burgers and French toast. Soaked thoroughly in egg batter and fried to golden perfection, the French toast is crisp and sweet on the outside and pudding-soft inside, dusted with powdered sugar and drizzled with maple syrup. Paired with ocean breezes and waves, it feels like an overseas resort vacation, making it a popular spot for photos and dates.", "name": "THE BEACH Marizon", "transport": "Nishitetsu Bus to \u0027Fukuoka Tower\u0027 bus stop, then walk toward the beach for about 3 minutes to enter the Marizon complex."}, {"address": "Marizon, 2-902-1 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 3.9 stars | A romantic Italian cafe tucked away in the boardwalk buildings of Marizon on Momochihama Beach, serving refined espresso, pressed paninis, and artisanal gelato. The crispy pressed paninis are packed with melted cheese and savory Italian prosciutto, while the gelato is dense and rich\u2014with pistachio and espresso being standout flavors. Sipping an iced latte at an outdoor table while watching the sunset dip below the horizon offers a wonderfully exotic seaside ambiance.", "name": "Caf\u00e9 POSITANO", "transport": "Nishitetsu Bus to \u0027Fukuoka Tower\u0027 bus stop, about a 4-minute walk directly to the Marizon pier waterfront."}, {"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A famous chain honoring Nagoya\u0027s retro Kissaten cafe culture, renowned for its \u0027Morning Service\u0027 offering free toast with any drink ordered before 11:00 AM. The thick-cut toast is crispy on the outside and remarkably soft inside, topped with rich butter or sweet red bean paste\u2014simple yet memorable. Their signature dessert \u0027Shiro-Noir\u0027 combines warm, flaky Danish pastry with cold, rich soft-serve milk ice cream and maple syrup, delivering an irresistible hot-and-cold sensation perfect for a shopping break or brunch.", "name": "Komeda\u0027s Coffee MARK IS Fukuoka Momochi", "transport": "Nishitetsu Bus to \u0027PayPay Dome-mae\u0027 or \u0027MARK IS Fukuoka Momochi-mae\u0027 bus stop."}, {"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | MUJI\u0027s natural-style light dining cafe embodies a clean, healthy dining philosophy, making it a favorite for health-conscious diners looking for a light brunch. Using seasonal ingredients sourced across Japan, it offers 3-item or 4-item healthy meal plates. Hot dishes like roasted juicy chicken with 15-grain rice contrast beautifully with cold dishes like seasonal vegetables dressed in sesame sauce. Finish with a cup of selected organic drip coffee and smooth Honwakata sugar soft-serve for a gentle, wholesome, and guilt-free experience.", "name": "Caf\u00e9 \u0026 Meal MUJI MARK IS Fukuoka Momochi", "transport": "Nishitetsu Bus to \u0027MARK IS Fukuoka Momochi-mae\u0027 bus stop; about a 12-minute walk from Tojinmachi Station on the Subway Kuko Line."}, {"address": "1F, Fukuoka Tower, 2-3-26 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 3.8 stars | A cozy, popular light-bites cafe inside the Fukuoka Tower shopping concourse, famous for flavored milk soft-serve ice cream and pour-over special coffees. The Yame matcha latte is highly recommended, delivering a smooth, pleasantly sweet balance of slightly bitter matcha and rich milk. Paired with freshly baked mini pancake balls\u2014crisp on the outside and fluffy-chewy inside\u2014it offers an addictive treat and a fantastic pit stop to relax and recharge before or after visiting the Fukuoka Tower observation deck.", "name": "M3 CAFE Fukuoka Tower", "transport": "Nishitetsu Bus to \u0027Fukuoka Tower\u0027 or \u0027Fukuoka Tower Minamiguchi\u0027 bus stop."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Inside Momochihama Marizon, 2-902-1 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A stunning ocean-view bistro located in Marizon at Momochihama Seaside Park, offering unmatched beach views of Hakata Bay. The restaurant specializes in refined Italian cuisine and tropical cocktails. Popular dishes include fresh wood-fired pizzas, fresh seafood pasta, and tender, juicy herb-roasted chicken. The pizza crust\u2014crispy on the outside and chewy inside\u2014boasts a rich wheat aroma topped with rich cheese and sweet seafood, delivering a multi-layered texture. Enjoying a cocktail on the outdoor terrace at sunset while listening to the waves makes it a romantic hotspot for tourists and local couples.", "name": "The Beach Marizon", "transport": "Take the Fukuoka City Subway to Nishijin Station and walk about 15 minutes, or take the Nishitetsu Bus to Fukuoka Tower Minamiguchi Stop and walk 3 minutes."}, {"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A popular spot blending traditional Hakata izakaya vibes with a stylish modern bistro atmosphere, famous for its high-quality local Kyushu ingredients and creative cooking. A must-try is the Hakata Motsunabe (beef offal hotpot), featuring a sweet, rich broth and melt-in-your-mouth offal that is tender with no odor. Additionally, straw-seared bonito and freshly prepared sashimi offer ultimate tenderness with a smoky touch. The minimalist modern Japanese decor paired with curated Kyushu sake lets foodies savor authentic local specialties in a top-tier setting.", "name": "Hakata Hotaru MARK IS Fukuoka Momochi", "transport": "Take the Fukuoka City Subway to Tojinmachi Station (Exit 3) and walk about 12 minutes, or take the Nishitetsu Bus to Yahoo-ku Dome-mae Stop."}, {"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | An iconic Hakata yakitori and regional dining bar in Fukuoka, famous across Japan for its signature Hakata Torikawa (crispy chicken skin skewers). The chicken skin is repeatedly skewered, grilled, and dipped in a secret sauce over several days to remove excess fat, resulting in a crispy exterior with a deliciously chewy and juicy bite. Paired with Hakata mentaiko tamagoyaki (spicy cod roe rolled omelet) and local Kyushu sake, its vibrant atmosphere and excellent value draw baseball fans and travelers alike.", "name": "Takenoya MARK IS Fukuoka Momochi", "transport": "Take the Fukuoka City Subway to Tojinmachi Station and walk about 12 minutes, or take the Nishitetsu Bus to PayPay Dome-mae Stop and walk 2 minutes."}, {"address": "3F BOSS E\u30fbZO FUKUOKA, 2-2-6 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | The world\u0027s first sports-themed bistro officially licensed by Major League Baseball, located on the dining floor of BOSS E\u00b7ZO FUKUOKA next to PayPay Dome. It serves classic American burgers, hearty steaks, and fusion pub fare combined with local Kyushu ingredients. The signature burger features a handmade 100% American Black Angus patty that is rich, juicy, and satisfying, served with toasted golden buns and melted cheese. With giant LED screens broadcasting sports events, its high-energy atmosphere makes it the top choice for pre/post-game dining.", "name": "MLB Cafe FUKUOKA", "transport": "Take the Fukuoka City Subway to Tojinmachi Station and walk about 15 minutes, or take the Nishitetsu Bus directly to Fukuoka PayPay Dome-mae Stop."}, {"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A renowned local tempura dining bar in Fukuoka, specializing in made-to-order high-end tempura and Kyushu regional specialties. Chefs select fresh seafood from the Genkai Sea and local seasonal vegetables. The batter is feather-light, golden, and crispy with a satisfying crunch, locking in juicy sweet flavors without feeling greasy. Free unlimited light-pickled kelp mentaiko and yuzu pickles are fantastic highlights. Paired with a cold local Hakata craft beer, it\u0027s a perpetually popular spot near the dome.", "name": "Hakata Tempura Takao MARK IS Fukuoka Momochi", "transport": "Take the Subway Kuko Line to Tojinmachi Station and walk about 12 minutes, or take the Nishitetsu Bus to PayPay Dome-mae Stop and walk 3 minutes."}, {"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A signature Fukuoka teppanyaki dining bar famous for sizzling selected beef offal and premium Kuroge Wagyu right before guests. The signature combo features small intestines and steak\u2014sizzling high-temperature offal bursting with savory fat, a chewy texture, and a caramelized crust. Paired with a sweet garlic sauce, it\u0027s perfect with rice or drinks. Offering Kyushu shochu and refreshing highballs, the modern counter setting creates a sensational feast for both eyes and tastebuds.", "name": "Hakata Tenjin Hormon MARK IS Fukuoka Momochi", "transport": "Take the Subway Kuko Line to Tojinmachi Station (Exit 3) and walk 12 minutes, or take the Nishitetsu Bus directly to PayPay Dome-mae Stop."}, {"address": "1F Fukuoka Tower, 2-3-26 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.9 stars | A casual scenic bistro located on the 1st floor of Fukuoka Tower, featuring floor-to-ceiling glass windows and a bright, modern decor. It combines local Kyushu produce with Italian light bites, serving options like Hakata mentaiko cream pasta, wood-fired pizza with freshly shaved cheese, craft beers, and specialty coffees. The al dente mentaiko pasta boasts a rich cream sauce with spicy cod roe. It\u0027s an ideal spot to unwind after sightseeing, enjoying tea or a quick drink.", "name": "MAMMA MIA Fukuoka Tower", "transport": "Take the Nishitetsu Bus directly to Fukuoka Tower (TNC Broadcast Hall) Stop, or walk about 20 minutes from Nishijin Subway Station."}, {"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A themed regional dining bar bringing together local specialties from across Kyushu\u0027s seven prefectures, allowing food lovers to taste the best of Kyushu in one spot. The menu includes Miyazaki chicken nanban, Kumamoto horse meat sashimi, Kagoshima Kurobuta pork, and Hakata Mizutaki (chicken hot pot). The signature Chicken Nanban features crispy, juicy chicken topped with sweet-and-sour tartar sauce, while the fresh horse sashimi is tender and sweet. Paired with nearly 100 varieties of exclusive Kyushu shochu, the lively vibe makes it perfect for family meals or late-night drinks.", "name": "Kyushu Kishitsu MARK IS Fukuoka Momochi", "transport": "Take the Subway Kuko Line to Tojinmachi Station and walk about 12 minutes, or take the Nishitetsu Bus directly to PayPay Dome-mae Stop."}], "name": "Specialty Dining Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "3F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A popular Indian restaurant located inside MARK IS shopping mall, offering a rich selection of plant-based and vegan curries. The signature \u0027Rich Soy Sprout \u0026 Lentil Curry\u0027 is slow-simmered with aromatic Indian spices and fresh vegetables, featuring a smooth, rich texture with layered spice notes. Pair it with freshly baked, chewy naan (vegan, dairy-free/egg-free options available) for a deeply satisfying meal. Bright and spacious, it\u0027s a favorite among local plant-based food lovers and foreign tourists visiting the Momochihama area.", "name": "Bishnu Indian Curry - MARK IS Fukuoka Momochi", "transport": "Approx. 10-min walk from Tojinmachi Station on the Subway Kuko Line, or take a bus to \u0027PayPay Dome-mae\u0027 stop."}, {"address": "4-1-1 Nishijin, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Fukuoka\u0027s iconic macrobiotic and vegan dining brand. Strictly avoiding meat, fish, eggs, dairy, and chemical seasonings, it focuses on local Kyushu organic brown rice and seasonal pesticide-free vegetables. Highly recommended are the \u0027Rainbow Veggie Bento\u0027 and the \u0027Plant-Based Tofu Steak Patty\u0027. The tofu steak is firm yet juicy, served with a signature sweet-and-sour brown rice vinegar sauce that is refreshing, guilt-free, and delightfully flavor-layered\u2014the ultimate choice for a healthy boost before or after exploring Momochihama.", "name": "Evah Dining Macrobiotic - Nishijin Momochi", "transport": "Directly accessible from Exit 4 of Nishijin Station on the Subway Kuko Line."}, {"address": "1F MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Specially created for vegetarians and health-conscious diners, the \u0027Green Burger\u0027 features a 100% plant-based soy protein patty paired with a special konjac and burdock sauce, served in a green spinach-infused bun. Tender, juicy, and satisfyingly chewy, it delivers subtle vegetable aromas balanced with rich grain notes, completely redefining plant-based burgers. A popular, guilt-free quick bite for tourists strolling around the Dome and Fukuoka Tower.", "name": "MOS BURGER MARK IS Fukuoka Momochi (Green Burger)", "transport": "Get off at Nishitetsu Bus \u0027PayPay Dome-mae\u0027 stop, immediately adjacent."}, {"address": "Inside Marizon, 2-902-1 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A popular ocean-view restaurant located inside Marizon at Momochihama Seaside Park, featuring a light-bites menu clearly highlighting vegan and plant-based options. The highly popular \u0027Avocado \u0026 Roasted Veggie Salad Bowl\u0027 combines fresh local Kyushu vegetables with rich, creamy avocado dressed in a zesty lemon olive oil vinaigrette. Paired with dairy-free, egg-free artisan sea salt baguette, it lets you indulge in a guilt-free coastal vegan feast while taking in panoramic views of Hakata Bay and Fukuoka Tower.", "name": "THE BEACH SHIN-CHI Momochihama", "transport": "Approx. 3-min walk from Nishitetsu Bus \u0027Fukuoka Tower Minamiguchi\u0027 stop."}, {"address": "4F Hilton Fukuoka Sea Hawk, 2-2-3 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Located inside Hilton Fukuoka Sea Hawk right next to the Dome, this restaurant features a grand 40-meter-high glass atrium and a thoughtfully curated plant-based and vegan section. Its signature \u0027Kyushu Veggie Vegan Red Curry\u0027 and \u0027Organic Mixed Grain Salad Bar\u0027 are highly praised. The red curry is rich, smooth, and laced with mildly spicy coconut flavors, pairing wonderfully with fluffy brown rice. Crisp greens and mixed nuts tossed with house-made plant-based dressing offer rich, refreshing textures\u2014a truly luxurious vegetarian dining experience.", "name": "Seala Brasserie and Lounge - Hilton Fukuoka Sea Hawk", "transport": "Approx. 15-min walk from Exit 3 of Tojinmachi Subway Station, or take the hotel shuttle bus."}, {"address": "2-4-27 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A trendy beachside cafe on Momochihama Beach championing healthy plant-based eats, loved by young travelers and international visitors alike. The must-try \u0027Vegan Acai Bowl\u0027 blends plant-based oat milk with rich acai puree, topped with fresh bananas, blueberries, and crunchy organic granola. Refreshingly chilled, velvety, perfectly sweet-and-sour, and very satisfying\u2014enjoying it on the outdoor terrace with a cool sea breeze makes it the perfect teatime treat after exploring Fukuoka Tower.", "name": "BLUE x BLUE Momochi Beach Cafe", "transport": "Approx. 5-min walk from Nishitetsu Bus \u0027Fukuoka Tower\u0027 stop."}, {"address": "3-21-27 Josei, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | A hidden gem for spice curry near Momochihama, offering a daily \u0027100% Vegan Organic Veggie Spice Curry\u0027. Made with over 15 custom-roasted spices without any animal fat or meat broth, it features seared seasonal Kyushu root vegetables and pan-fried tofu. The sauce is intensely rich and savory with an enticing roasted and spicy kick, paired with fragrant, fluffy turmeric rice. Highly acclaimed by local vegans and foodies alike.", "name": "Spice Curry Kuma to Shika - Nishijin Momochi", "transport": "Approx. 6-min walk from Nishijin Station on the Subway Kuko Line."}, {"address": "5-15-28 Nishijin, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A traditional 100% buckwheat (juwari) soba noodle specialty shop serving plant-based \u0027Vegan Seasonal Veggie Soba\u0027. Freshly made daily from 100% pure buckwheat flour, the noodles are smooth with a subtle nutty aroma and delightful firmness. Served with a special plant-based kombu and shiitake mushroom broth (no fish broth used) alongside freshly fried Kyushu seasonal vegetable tempura (such as pumpkin, shiso, and lotus root) that is crispy, non-greasy, and juicy inside. An excellent choice for authentic traditional Japanese vegan dining.", "name": "Sozan Juwari Soba - Nishijin Momochi", "transport": "Approx. 5-min walk from Nishijin Station on the Subway Kuko Line."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture (MARK IS Fukuoka Momochi 1F)", "feature": "\u2b50 4.2 stars | Mucchan Manju is a classic soul street food that Fukuoka locals have loved since childhood, shaped into cute mudskipper fish. Freshly baked to order, the crust is slightly crispy, soft, and rich with egg and milk aromas. The most popular signature flavor, \u0027Ham \u0026 Egg\u0027 (\u30cf\u30e0\u30a8\u30c3\u30b0), is stuffed with a whole soft-boiled egg, special Japanese mayonnaise, and savory ham. The soft-boiled yolk bursts with every bite, creating an ultra-smooth, creamy texture with a perfect sweet and savory balance. Sweet options like custard cream and red bean paste are also available. Whether you are a tourist on a food pilgrimage or a sports fan heading to the dome, it is a must-buy snack on the go.", "name": "Mucchan Manju Mark Is Fukuoka Momochi (\u3080\u3063\u3061\u3083\u3093\u842c\u5341 MARK IS \u798f\u5ca1\u3082\u3082\u3061\u5e97)", "transport": "About a 10-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway Airport Line"}, {"address": "2-3-26 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture (Fukuoka Tower 1F)", "feature": "\u2b50 4.1 stars | A famous ice cream shop located on the 1st floor of Fukuoka Tower, offering a wide variety of walk-and-eat desserts and Japanese crepes. Its signature ice cream is smooth and creamy; the \u0027Okinawan Purple Yam \u0026 Sea Salt\u0027 and \u0027Fukuoka Amaou Strawberry\u0027 flavors\u2014combining Kyushu and Okinawa specialties\u2014are highly recommended. Thin crepes are cooked fresh to order, featuring crisp edges and a chewy center wrapped around generous whipped cream and fresh fruit, sweet without being overwhelming. Grabbing a colorful ice cream before strolling along breeze-swept Momochihama Beach makes for a perfect photo op and refreshing treat.", "name": "Blue Seal Ice Cream Fukuoka Tower (BLUE SEAL \u798f\u5ca1\u30bf\u30ef\u30fc\u5e97)", "transport": "Take the Nishitetsu Bus and get off at \u0027Fukuoka Tower (TNC Broadcast Center)\u0027 station"}, {"address": "2-902-1 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture (Inside Marizon)", "feature": "\u2b50 4.0 stars | Located next to the oceanic plaza at \u0027Marizon\u0027 in the center of Momochihama Beach, this outdoor snack stand radiates a vibrant summer resort vibe. It specializes in portable street snacks bursting with Japanese festival and beach flair, including golden, crispy, and juicy fried chicken (Karaage), as well as chewy Japanese yakisoba tossed in rich, fragrant sauce. In summer, they also serve giant rainbow shaved ice and rich Hokkaido milk soft-serve ice cream. Enjoying hot street food while taking in the views of Hakata Bay makes this spot extremely popular among couples and tourists.", "name": "Marizon Beach Kiosk Mamaison (\u6d77\u4e4b\u68e7\u6a4b MARIZON \u6d77\u908a\u5c0f\u5403\u6524)", "transport": "Take the Nishitetsu Bus to \u0027Fukuoka Tower Minamiguchi\u0027 station, then walk about 3 minutes to the beach"}, {"address": "2-2-6 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture (BOSS E-ZO FUKUOKA 3F)", "feature": "\u2b50 4.0 stars | Located on the 3rd floor of BOSS E-ZO FUKUOKA, this takeout window of the official Major League Baseball licensed restaurant channels a cool American sports vibe. The most popular item is the \u0027Jumbo American Cheese Hot Dog\u0027, featuring a soft, lightly toasted bun loaded with a juicy, snappy hot dog, smothered in rich cheese sauce and yellow mustard for a deeply flavorful bite. They also serve piping-hot churros that are crispy outside, soft inside, and dusted generously with cinnamon sugar\u2014an ideal high-energy street snack before catching a baseball game at the dome or enjoying the entertainment facilities.", "name": "MLB Caf\u00e9 FUKUOKA Takeout Window (MLB \u30ab\u30d5\u30a7 \u798f\u5ca1 \u30c6\u30a4\u30af\u30a2\u30a6\u30c8)", "transport": "About a 12-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway Airport Line"}, {"address": "2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture (MARK IS Fukuoka Momochi 3F)", "feature": "\u2b50 3.9 stars | A popular Japanese crepe chain inside the MARK IS shopping center, famous for soft crepes made fresh to order. Using a signature proprietary batter, their cooked crepes have a light milky aroma and a soft, chewy texture. The insanely popular \u0027Hakata Strawberry \u0026 Whipped Cream Crepe\u0027 features fresh local Fukuoka strawberries paired with sweet, velvety whipped cream and tangy strawberry sauce\u2014a sweet-and-sour combination reminiscent of first love. Savory crepes like tuna cheese and teriyaki chicken are crispy outside and soft inside with irresistible aromas. Grab one to enjoy while walking to the nearby dome or Momochihama Beach.", "name": "Dipper Dan Crepe Mark Is Fukuoka Momochi (\u30c7\u30a3\u30c3\u30d1\u30fc\u30c0\u30f3 MARK IS \u798f\u5ca1\u3082\u3082\u3061\u5e97)", "transport": "About a 10-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway Airport Line"}, {"address": "2-2-2 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture (Mizuho PayPay Dome Fukuoka Outer Grounds)", "feature": "\u2b50 4.3 stars | A delicious gathering of food trucks surrounding the Mizuho PayPay Dome Fukuoka, bustling with lively energy on game days and major event days. Bringing together high-popularity yatai-style street food, the top recommendation is the freshly grilled \u0027Hakata Sauce Beef Skewer\u0027, tender and slightly charred with rich savory fat. Don\u0027t miss the ultra-crispy takoyaki with piping-hot, soft interiors loaded with tender octopus chunks, topped with rich sauce and bonito flakes dancing in the steam. This diverse array of fresh, hot food lets baseball fans and tourists fully immerse themselves in Hakata\u0027s warm and energetic food culture.", "name": "PayPay Dome Outside Street Food Food Trucks (PayPay\u30c9\u30fc\u30e0 \u5916\u5468\u7f8e\u98df\u9910\u8eca\u805a\u843d)", "transport": "About a 12-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway Airport Line"}, {"address": "2-2-1 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture (MARK IS Fukuoka Momochi 1F)", "feature": "\u2b50 4.1 stars | A popular takeout shop specializing in Japanese boneless fried chicken (karaage), located in the 1st floor food court of MARK IS Fukuoka Momochi. Made with carefully selected local Kyushu chicken thighs, marinated in garlic soy sauce, light-coated, and freshly fried to order. The skin forms a golden, super-crispy texture that crunches with every bite, locking in rich, succulent meat juices without being greasy. Served in convenient handheld paper cups with choices of signature sauces like secret house sauce or mentaiko mayo, it is the ultimate savory, protein-packed grab-and-go snack before a beach walk or dome game.", "name": "Tsururyu Mark Is Fukuoka Momochi (\u9db4\u9f8d \u5510\u63da\u70b8\u96de MARK IS \u798f\u5ca1\u3082\u3082\u3061\u5e97)", "transport": "About a 10-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway Airport Line"}, {"address": "2-3-26 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture (Fukuoka Tower 1F)", "feature": "\u2b50 4.2 stars | A dessert takeout kiosk located inside the Meihinkan souvenir hall on the 1st floor of Fukuoka Tower\u2014a must-visit pitstop before or after taking in the observatory views. The headline attraction here is the \u0027Amaou Strawberry Soft Serve\u0027, made with 100% Fukuoka-grown Amaou strawberries. It boasts an exceptionally smooth and creamy texture, bursting with sweet strawberry aroma and perfectly balanced tartness. They also offer freshly prepared strawberry daifuku with crisp-yet-chewy skin and warm sweet rice dumplings. Paired with an iced coffee, visitors can elegantly savor premium Hakata fruit desserts while admiring the majestic exterior of Fukuoka Tower.", "name": "Fukuoka Tower Meihinkan Sweet Kiosk (\u798f\u5ca1\u30bf\u30ef\u30fc \u9298\u54c1\u9928 \u6563\u6b65\u751c\u9ede\u8655)", "transport": "About a 1-minute walk from \u0027Fukuoka Tower\u0027 bus stop on the Nishitetsu Bus Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Momochihama, Fukuoka Tower and Fukuoka Dome Area"}, "nakasu_canal": {"categories": {"cat_1": {"items": [{"address": "2-8-27 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Founded in 1873, this century-old unagi (eel) restaurant sits near the Naka River. Its signature \u0027Kabayaki\u0027 grilling technique creates a crispy, caramelized skin and meltingly soft flesh, releasing a rich, sweet fat on the palate. Paired with a secret hundred-year-old sauce recipe and fluffy white rice, its ultimate crispy-on-the-outside, tender-on-the-inside texture draws foodies from around the globe to stand in line.", "name": "Hakata Nadai Yoshizuka Unagiya", "transport": "Approx. 5-min walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "5-3-2 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | The iconic 18-story headquarters of Ichiran Ramen, world-famous for its Hakata-style tonkotsu broth. The pork bone soup is rich without being gamey, perfectly paired with their secret original red spicy sauce and springy thin noodles that coat every bite. Its unique individual \u0027Flavor Concentration Booths\u0027 allow diners to focus completely on savoring the purest Hakata tonkotsu ramen.", "name": "Ichiran Main Store", "transport": "Approx. 1-min walk from Exit 2 of Nakasu-Kawabata Subway Station"}, {"address": "6-15 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Japan\u0027s first specialty mentaiko (seasoned cod roe) restaurant, serving whole seasoned cod roe over steaming rice in wooden bento boxes drizzled with a secret kelp sauce. Offered raw or seared, the popping texture, savory-spicy umami, shredded seaweed, and fluffy rice blend in delightful harmony. An unforgettable classic dish you must try in Hakata.", "name": "Gansu Hakata Mentaiju", "transport": "Approx. 5-min walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "3-4-6 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | A premier venue for Mizutaki (chicken hot pot), Hakata\u0027s signature traditional stew. Made using locally raised \u0027Hanamidori\u0027 chicken simmered into a rich, milky-white broth. Enjoy the pure, sweet broth first, then dip the firm yet springy chicken and tender handmade chicken meatballs into custom ponzu sauce. Packed with collagen, it\u0027s a favorite among foodies and locals alike.", "name": "Hakata Mizutaki Hanamidori Nakasu Honten", "transport": "Approx. 3-min walk from Exit 4 of Nakasu-Kawabata Subway Station"}, {"address": "12-20 Kamikawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Founded in 1923, this century-old traditional Japanese confectionery shop seamlessly blends time-honored craftsmanship with modern aesthetics. Popular bite-sized \u0027Suzu no Enmochi\u0027 features a delightfully chewy texture filled with subtly sweet red bean paste. Their tearoom serves juicy strawberry daifuku with paper-thin mochi skin and smooth red bean paste, making it a top choice for afternoon tea among locals and visitors.", "name": "Suzakake Honten", "transport": "Directly connected to Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "2-4-20 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Established in 1949, this iconic spot is the birthplace of Hakata\u0027s bite-sized pan-fried gyoza served on iron skillets. These mini dumplings feature a thin, golden-crisp wrapper holding a juicy filling of local pork, cabbage, and onions. Each bite bursts with sweet savory juices, creating an addictive crunchy treat that\u0027s a staple snack for Nakasu nightlife.", "name": "Hountei Honten", "transport": "Approx. 6-min walk from Exit 4 of Nakasu-Kawabata Subway Station"}, {"address": "10-256 Kamikawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | A historic dessert shop inside Kawabata-dori Shopping Street that preserves the vibrant atmosphere of traditional Hakata Gion Yamakasa festivals. Serving classic Zenzai (sweet red bean soup), simmered until thick and velvety, paired with freshly toasted mochi that is crisp outside and gooey inside. Served with salted kelp to balance the sweetness, it offers a heartw
