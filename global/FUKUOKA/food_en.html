eir special vinegar soy sauce and yuzu kosho (citrus chili paste), it makes the ultimate midnight snack for experiencing Hakata\u0027s classic izakaya culture.", "name": "Gyoza Temujin Daimyo Main Store", "transport": "Approx. 7-minute walk from Akasaka Station on the Subway Kuko Line or 8-minute walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "2-5-25 Nagahama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located near Ohori Park and Akasaka, this birthplace of Nagahama ramen evolved from a legendary food stall with deep roots in Fukuoka history. It is renowned for its affordable prices, lightning-fast service, and clean-tasting tonkotsu broth. Featuring firm thin noodles, a light savory soup with hints of lard, and topped generously with chopped green onions and pickled red ginger, it offers a pure and light flavor profile. A must-visit shrine to experience authentic Hakata \u0027Kaedama\u0027 (noodle refill) culture and fish market breakfast traditions.", "name": "Ganso Nagahamaya", "transport": "Approx. 10-minute walk from Exit 1 of Akasaka Station on the Subway Kuko Line"}, {"address": "1-14-13 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A signature establishment for Hakata\u0027s traditional chicken hot pot (Mizutaki), using premium Hanamidori brand chicken raised on their own farms in Kyushu. The special white chicken broth is simmered for hours\u2014rich yet remarkably clean and comforting. The tender, juicy chicken pieces pair delightfully with house-made ponzu sauce to elevate the sweetness. Finishing the meal with a rice porridge (Zousui) that absorbs every drop of flavor creates a deeply satisfying, multi-layered experience.", "name": "Hakata Mizutaki Hanamidori Daimyo Shop", "transport": "Approx. 6-minute walk from Akasaka Station on the Subway Kuko Line"}, {"address": "1-12-28 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A hugely popular classic beef offal hot pot (Motsunabe) restaurant in the Daimyo shopping district, featuring top-quality domestic Wagyu beef small intestines. Offered with a rich miso or light soy sauce broth, the offal is delightfully chewy, juicy, and rich in sweet savory fat. Plentiful chives and cabbage soak up the rich broth, making it hearty and completely odor-free. Pairing it with fresh live squid sashimi sourced directly from Yobuko delivers the ultimate traditional Fukuoka dining experience.", "name": "Hakata Motsunabe Maeda-ya Daimyo", "transport": "Approx. 5-minute walk from Exit 5 of Akasaka Station on the Subway Kuko Line"}, {"address": "1-14-14 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Tucked away in the alleys of Daimyo, this half-century-old classic soba shop is a beloved late-night haven for locals after drinking. Its signature soba noodles are smooth and tender, served in a rich broth brewed from carefully selected bonito flakes and kombu kelp. The pork cutlet bowl (Katsudon) is also wildly popular, featuring a crispy yet tender pork cutlet coated in creamy semi-cooked egg and sweet-savory sauce. The nostalgic Showa-era atmosphere completes a deeply satisfying meal.", "name": "Hakata Daimyo Yabu", "transport": "Approx. 6-minute walk from Akasaka Station on the Subway Kuko Line"}, {"address": "1-11-17 Akasaka, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located on the border of Daimyo and Akasaka, this classic Japanese fish set-meal (Teishoku) restaurant sources fresh seafood daily from Nagahama Fish Market. Its famous \u0027Eggplant Miso\u0027 and various grilled/fried fish set meals come highly recommended by local office workers and foodies alike. The fish is tender and juicy, while the pan-fried eggplant drizzled with rich, sweet-savory miso sauce goes perfectly with rice. Accompanied by soothing authentic miso soup and pickles, it showcases the finest in Kyushu home-style cooking.", "name": "Ajino Shofuku Akasaka Main Store", "transport": "Approx. 2-minute walk from Exit 2 of Akasaka Station on the Subway Kuko Line"}], "name": "Famous Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "1-4-2 Arato, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular aviation-themed caf\u00e9 located near Ohori Park. The signature pudding is rich and firm, topped with a scoop of vanilla ice cream and bittersweet caramel sauce, offering a smooth and layered texture. Tourists especially love ordering a beautifully latte-art-topped coffee with pudding to take away for a lakeside picnic at Ohori Park, enjoying a relaxing afternoon sun.", "name": "FUK COFFEE Parks", "transport": "Approx. 3 mins walk from Exit 2 of Ohori Park Station on the Subway Kuko Line"}, {"address": "1F Daiichi Matsumura Bldg., 1-14-28 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A legendary pioneer shop that sparked the souffl\u00e9 pancake craze in the Daimyo shopping district. Made to order, the pancakes are as light and fluffy as clouds, melting in your mouth with rich milky and eggy aromas. Served with fresh seasonal fruit and specialty whipped cream, it is a delight for both the eyes and taste buds, attracting countless dessert lovers and Instagrammers.", "name": "Caf\u00e9 del SOL", "transport": "Approx. 7 mins walk from Tenjin Station on the Subway Kuko Line, or 5 mins walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "1F Ishii Bldg., 1-1-3 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A classic local independent caf\u00e9 brimming with American street style and vintage artistic vibes. The bright yellow exterior is highly recognizable, and the shop offers a variety of self-roasted specialty coffee beans and rich lattes. Smooth with a lingering aftertaste, paired with daily limited handmade desserts, it\u0027s a top gathering spot for local trendy youth and coffee lovers.", "name": "manucoffee Daimyo", "transport": "Approx. 8 mins walk from Nishitetsu Yakuin Station or Fukuoka (Tenjin) Station"}, {"address": "1-2 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A prime scenic restaurant and caf\u00e9 situated right along the waterfront of Ohori Park. Guests can enjoy an exquisite brunch while admiring the tranquil lake views. The signature American pancakes and fresh made-to-order sandwiches are hearty and delicious. Sitting on the outdoor patio terrace with a gentle breeze is exceptionally pleasant, making it popular for both locals taking a stroll and visiting tourists.", "name": "Royal Garden Cafe Ohori Park", "transport": "Approx. 4 mins walk from Exit 3 of Ohori Park Station on the Subway Kuko Line"}, {"address": "1-2-15 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A minimalist specialty coffee shop tucked away in a quiet alley near Ohori Park. Focusing on single-origin pour-over coffee, it carefully selects high-quality beans from around the world, presenting distinct flavor profiles with elegant fruity acidity and floral notes. Paired with crispy, delicious cinnamon rolls or scones in a peaceful ambiance, it is highly favored by locals who appreciate pure coffee aromas and high-quality living.", "name": "Basking Coffee Ohori", "transport": "Approx. 5 mins walk from Exit 1 of Ohori Park Station on the Subway Kuko Line"}, {"address": "4F PBOWW Bldg., 1-10-15 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A cozy, wooden-accented terrace caf\u00e9 located on an upper floor in the vibrant Daimyo district. Besides rich lattes and fluffy French toast, its Japanese-style brunch and special curry set meals are highly acclaimed. Warm sunlight streams through floor-to-ceiling windows during the day, while at night it transforms into a cozy bar atmosphere\u2014making it a perfect spot to rest after shopping.", "name": "Corduroy Cafe Daimyo", "transport": "Approx. 5 mins walk from Exit 5 of Akasaka Station on the Subway Kuko Line"}, {"address": "2-2-22 Akasaka, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A hidden hipster caf\u00e9 renovated from a traditional Japanese house (kominka), featuring a lush garden and warm wooden interior that uplifts the soul. Famous for its brunch plates of fresh seasonal vegetable salad served with artisanal bread, the flavors are refreshing and well-layered. Paired with meticulously brewed single-origin coffee, it offers visitors a slow-paced culinary escape from the hustle and bustle.", "name": "papparayray", "transport": "Approx. 8 mins walk from Exit 2 of Akasaka Station on the Subway Kuko Line"}, {"address": "2-1-14 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A stylish, eye-catching brunch spot incorporating a trendy Hiroshima coffee brand. It specializes in gourmet deli sandwiches and masterfully brewed hand-drip coffee; the sandwiches feature crispy exteriors with juicy, rich fillings. The spacious outdoor seating area exudes an urban oasis vibe, drawing fashionable youth and tourists to enjoy a relaxed morning.", "name": "Park South Coast FUK", "transport": "Approx. 4 mins walk from Exit 2 of Tenjin Station on the Subway Kuko Line"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "1-4-23 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A stylish, modern seafood gastropub located in the trendy Daimyo area, blending traditional Japanese izakaya style with modern Western bistro decor. Their signature \u0027Fish Man Seafood Don\u0027 and \u0027Box Sushi\u0027 feature fresh fish delivered daily directly from Nagahama Fish Market. The sashimi is incredibly springy, sweet, and melts in your mouth. Extremely popular among young tourists and local trendsetters, it offers visually stunning food presentations alongside a variety of custom seafood-pairing sours and local Fukuoka sake, all in a lively and energetic atmosphere.", "name": "Hakata Fish Man", "transport": "About a 7-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 5-minute walk from Subway Akasaka Station"}, {"address": "1-12-28 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A highly popular Kyushu regional cuisine gastropub tucked in the alleys of Daimyo, famous for its mouthwatering motsunabe (beef offal hot pot). Using carefully selected top-grade Wagyu beef small intestine, the offal is silky smooth with a rich, savory fat aroma, paired with a meticulously brewed miso or soy sauce broth that is deep yet not overwhelming. Foodies also rave about the \u0027Yobuko Squid Sashimi delivered directly from the Genkai Sea in Nagasaki\u0027; the squid arrives translucent, crisp, and sweet, with the tentacles fried into tempura afterward. Its refined, modern interior completely redefines the traditional motsunabe eatery, making it a top choice for enjoying authentic Kyushu cuisine and fine drinks.", "name": "Motsunabe Maedaya Daimyo", "transport": "About a 6-minute walk from Exit 5 of Subway Akasaka Station"}, {"address": "1F PP Building, 1-10-15 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A specialty restaurant specializing in Fukuoka\u0027s iconic regional dish, \u0027Mizutaki\u0027 (chicken hot pot). The Daimyo branch features an elegant, modern wooden aesthetic. Using premium local Kyushu brand chicken, guests first enjoy a cup of milky-white rich chicken broth\u2014smooth, sweet, and collagen-rich. The tender chicken is then enjoyed with a custom ponzu sauce, offering a tender yet springy texture with a refreshing citrus kick. Paired with selected local Fukuoka sake and full table-side service, it perfectly showcases Hakata\u0027s culinary tradition with an upscale dining touch, highly praised by travelers seeking a premium gastronomic experience.", "name": "Mizutaki Hamadaya Daimyo", "transport": "About a 5-minute walk from Exit 4 of Subway Akasaka Station"}, {"address": "1-15-33 Kego, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A hugely popular, trendy robatayaki gastropub adjacent to the Daimyo district, reinventing traditional Hakata charcoal grilling with an innovative flair. The central open grill allows guests to watch ingredients grilled to golden, crispy perfection over Binchotan charcoal. A must-order is the \u0027Sea Urchin \u0026 Wagyu Roll\u0027, pairing sweet sea urchin with seared Wagyu for a luscious, melt-in-your-mouth flavor. Grilled Kuroge Wagyu and seasonal vegetables are crispy on the outside and juicy on the inside. Guests can even pick their own wine or sake directly from the display cellar, making the self-pour experience a fun addition to Fukuoka\u0027s vibrant nightlife and dining scene.", "name": "Robata Hyakushiki", "transport": "About an 8-minute walk from Subway Akasaka Station, or a 10-minute walk from Nishitetsu Yakuin Station"}, {"address": "1-12-8 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A casual Daimyo tavern blending retro Showa charm with modern vibes, wildly popular among young adults and office workers. Their signature dish, \u0027Stewed Beef Tendon,\u0027 is slow-cooked for hours until incredibly tender and collagen-rich, served in a deeply savory sauce that pairs perfectly with alcohol. The \u0027Steak \u0026 Sashimi Platter\u0027 is also fresh and budget-friendly. With a lively, relaxed atmosphere and an extensive selection of Highballs and craft fruit liquors, it\u2019s an ideal spot to experience Hakata\u0027s authentic drink and bar-snack culture.", "name": "Sakaba Kado no Uguisu Daimyo", "transport": "About a 5-minute walk from Subway Akasaka Station, or an 8-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "1F Be Life Daimyo, 1-12-26 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Tucked away in the fashionable backstreets of Daimyo, this Italian-Japanese fusion gastropub uses dark tones and chic industrial design to create a cozy, mysterious ambiance. The kitchen fuses Kyushu ingredients with Italian culinary techniques, highlighting dishes like \u0027Hakata Mentaiko Cream Pasta\u0027\u2014al dente noodles tossed in rich sauce with bursts of savory, spicy cod roe\u2014and \u0027Slow-Roasted Akaushi Beef Steak\u0027 made with Aso red beef, succulent and full of beefy flavor. An extensive list of natural wines and cocktails makes it a top haunt for stylish locals and visitors alike.", "name": "Daimyo 101", "transport": "About a 6-minute walk from Subway Akasaka Station"}, {"address": "2-1-42 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A stylish yakitori and Hakata regional dish gastropub located at the border of Daimyo and Akasaka. They insist on using Hakata local chicken and seasonal vegetables, charcoal-grilled to perfection. The signature handmade \u0027Tsukune\u0027 (chicken meatballs) features a lightly charred skin bursting with savory juices, best enjoyed dipped in raw egg yolk. Their simmered dishes like \u0027Miso-Stewed Pork Cartilage\u0027 are exceptional, with cartilage that melts on the tongue. A sleek wooden bar aesthetic combined with curated Kyushu shochu and craft beers offers a refined izakaya experience for both the eyes and palate.", "name": "Kushiyaki Nikomi Donguri", "transport": "About a 3-minute walk from Exit 5 of Subway Akasaka Station"}, {"address": "1-2 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A scenic bistro set on the shores of Ohori Park, boasting panoramic lake views and lush seasonal greenery. The menu highlights Western-style bistro fare infused with local Kyushu ingredients. The signature \u0027Kyushu Kuroge Wagyu Hamburg Steak\u0027 is tender, e\u0027s \"Oat Milk Vegan Soft Serve\" is smooth, rich, and perfectly sweet, making it a trendy vegan hotspot for stylish youths and foreign visitors exploring the shopping district.", "name": "Sonu Sonu Vegan Cafe", "transport": "Approx. 6 mins walk from Exit 5 of Subway Akasaka Station"}, {"address": "1-11-11 Akasaka, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A classic vegetarian establishment focused on the macrobiotic lifestyle, dedicated to serving pure natural dishes free of eggs, dairy, refined sugar, and chemical additives. The restaurant\u0027s most popular offerings, the \"Natural Organic Bento\" and \"Vegetable Curry Rice,\" utilize pesticide-free organic vegetables contract-farmed in Kyushu, paired with special spices and a sweet, aged brown rice sauce. The curry sauce is rich and creamy, highlighting the natural sweetness of the vegetables and tender potatoes. Served alongside chewy and fragrant ten-grain brown rice, it is satisfying yet light on the stomach, making it the top lunch choice for local office workers and health enthusiasts.", "name": "Evah Dining Macrobiotic Cafe", "transport": "Approx. 3 mins walk from Exit 2 of Subway Akasaka Station"}, {"address": "1-8-25 Akasaka, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A cozy artisanal bakery cafe near the border of Daimyo and Akasaka, famous for its daily freshly baked egg-free, dairy-free, and gluten-free vegan muffins. Popular choices like the \"Matcha Red Bean Vegan Muffin\" and \"Banana Nut Muffin\" swap milk and flour for soy milk and rice flour, resulting in a slightly crisp exterior and a moist, dense interior. Enhanced by natural banana sweetness and crunch from crushed nuts, they are never dry. Paired with a custom oat milk latte in an elegant and comfortable atmosphere, it offers a delightful vegan afternoon tea experience that draws endless gluten-free and vegan lifestyle lovers.", "name": "Lily Valley Muffin \u0026 Coffee", "transport": "Approx. 4 mins walk from Exit 1 of Subway Akasaka Station"}, {"address": "Tenjin Bldg B1F, 2-12-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A celebrated tofu Kaiseki restaurant located on the border between Daimyo and Tenjin, making it the premier choice for fine dining among vegetarians and lacto-ovo vegetarians. The restaurant showcases high-quality soy fermentation and preparation techniques at their finest. The signature \"Mineoka Tofu\" features a velvety, smooth texture that melts in your mouth with a rich soy aroma, while the \"Fried Silken Tofu\" has a delicate crispy coating and a tender, warm interior, served with a special sweet kelp soy sauce for an exquisite taste profile. The tranquil Japanese Zen garden setting makes it a favorite for global travelers seeking refined Japanese culture and healthy vegetarian cuisine.", "name": "Ume no Hana Tenjin", "transport": "Approx. 2 mins walk (directly connected) from Subway Tenjin Station, or approx. 5 mins walk from Daimyo shopping district"}, {"address": "2-2-24 Yakuin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A vegan soy milk concept shop adjacent to the Daimyo shopping district, focusing on desserts and light meals made from rich, freshly pressed soy milk using local organic Kyushu soybeans. Its signature \"Vegan Soy Milk Tiramisu\" and \"Soy Milk Latte\" are Instagram-famous treats. The tiramisu replaces mascarpone with vegan soy cheese, creating a silky and light texture balanced with mild espresso bitterness and subtle soy sweetness, completely free of animal fat\u0027s heaviness. Its light, healthy taste impresses tourists and dessert lovers alike.", "name": "Soy Stories Yakuin", "transport": "Approx. 5 mins walk from Subway Yakuin-odori Station, or approx. 8 mins walk from Daimyo shopping district"}, {"address": "1-2 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A a rich interplay of a crispy exterior, soft interior, and bursting filling, making it the top street snack choice for locals and tourists alike.", "name": "Hakata Hiiragi", "transport": "Approx. 3-minute walk from Exit 5 of Akasaka Station on the Subway Kuko Line"}, {"address": "1-11-4 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An iconic, Instagram-worthy soft-serve shop in Fukuoka\u0027s trendy Daimyo district. Known for its instantly recognizable, chubby cloud-like shape, it is made with premium local raw milk from Kyushu. The soft serve is incredibly smooth, dense, and rich in milk flavor without being cloying. Paired with a custom black bamboo charcoal waffle cone, the subtle bitterness perfectly blends with the creamy sweetness, making it a must-try photo-worthy street dessert when exploring Daimyo.", "name": "DAIMYO SOFT SERVE Daimyo Main Store", "transport": "Approx. 6-minute walk from Akasaka Station, or an 8-minute walk from Tenjin Station on the Subway Kuko Line"}, {"address": "4-9-18 Watanabe-dori, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | A wildly popular \u0027namadonut\u0027 (raw donut) specialty store located at the edge of the Daimyo shopping area, constantly drawing long lines. Featuring an original pumpkin dough crafted through high-hydration fermentation, it is fried to a light golden crisp on the outside while remaining cloud-soft, melt-in-your-mouth moist on the inside. Generously filled with rich hazelnut or fresh cream, its subtle sweetness and heavenly texture attract foodies from all over the world.", "name": "I\u0027m donut? Fukuoka", "transport": "Approx. 2-minute walk from the South Exit of Fukuoka (Tenjin) Station on the Nishitetsu Tenjin-Omuta Line"}, {"address": "1-4-20 Arato, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A walk-up coffee and takeout dessert spot located near Ohori Park. Famous for fresh, piping-hot churros made to order\u2014boasting an ultra-crispy exterior dusted with aromatic cinnamon sugar\u2014and melt-in-your-mouth handmade firm pudding with a bittersweet caramel twist. It\u0027s the perfect light, delicate street treat to enjoy while strolling along the lakeside.", "name": "FUK COFFEE Parks Ohori Park", "transport": "Approx. 3-minute walk from Exit 2 of Ohori Park Station on the Subway Kuko Line"}, {"address": "1-12-57 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A refined takeout dessert shop specializing in Fukuoka\u0027s famed Amaou strawberries. The signature \u0027Doraking Nama\u0027 strawberry dorayaki features a chewy, mildly sweet pancake shell wrapped around a whole, freshly picked Amaou strawberry\u2014plump, sweet, and juicy\u2014and smooth whip cream. Every bite bursts with refreshing fruit juice, offering a perfectly balanced sweet and tart flavor highly beloved by tourists and locals alike.", "name": "Itoking Tenjin Daimyo", "transport": "Approx. 6-minute walk from Nishitetsu Fukuoka (Tenjin) Station or Subway Tenjin Station"}, {"address": "1-3-52 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A popular croffle takeout shop tucked into the trendy alleys of Daimyo. High-quality French butter croissant dough is waffle-pressed and caramelized to create a crisp, crackly shell with a rich buttery fragrance. With a crunchy exterior and flaky, soft layers inside, this portable treat is a fantastic energy booster while shopping.", "name": "Sippo Croffle Daimyo", "transport": "Approx. 7-minute walk from Akasaka Station on the Subway Kuko Line"}, {"address": "1-3 Ohori Park, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A scenic takeout counter right along the waterfront of Ohori Park. Offering made-to-order hot-pressed grilled cheese sandwiches and rich soft-serve made with local Kyushu fresh milk. The golden, toasted bread hides gooey, melty cheese, perfectly paired with an iced Americano or creamy ice cream\u2014allowing visitors to enjoy a relaxing local stroll while taking in the stunning park views.", "name": "Royal Garden Cafe Ohori Park Takeout Window", "transport": "Approx. 5-minute walk from Exit 3 of Ohori Park Station on the Subway Kuko Line"}, {"address": "1-14-13 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A piping-hot takeaway window serving freshly fried karaage made from Kyushu\u0027s premium branded chicken, \u0027Hanamidori\u0027. Coated in a special batter and fried to golden crispiness, the chicken remains juicy, tender, and flavorful inside. Dusted with house-blend seasoned salt, every savory bite releases bursts of delicious juices\u2014a wildly popular savory snack to grab while wandering around Daimyo.", "name": "Hakata Hanamidori Daimyo Takeout Karaage", "transport": "Approx. 6-minute walk from Tenjin Station or Akasaka Station on the Subway Kuko Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Daimyo Trendy District and Ohori Park"}, "dazaifu": {"categories": {"cat_1": {"items": [{"address": "2-7-24 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1922 (Taisho 11), this century-old establishment is the most iconic Umegae Mochi shop along the Dazaifu Sando approach. The freshly baked Umegae Mochi is pressed and grilled on high-heat iron plates, creating a golden, crispy outer shell with a subtle aroma of toasted glutinous rice. Inside, it is filled with piping-hot, moderately sweet, full-grained red bean paste from Tokachi, Hokkaido. Crispy on the outside and soft, chewy, and rich on the inside, each bite releases a burst of steam and rich red bean fragrance. Behind the shop lies a charming Japanese-style garden tea house, where tourists and locals alike love to pair warm Umegae Mochi with rich matcha while enjoying a quiet moment steeped in history.", "name": "Kasanoya", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Line Dazaifu Station; walk straight along the Sando approach."}, {"address": "2-7-16 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A traditional Dazaifu establishment with decades of heritage, Yasutake is famous not only for its freshly baked Umegae Mochi but also for its adjoining Japanese eatery, a fantastic spot for handmade traditional buckwheat (soba) and udon noodles. Their Umegae Mochi uses a premium blend of glutinous rice from Kumamoto and Sagabiyori rice from Saga, giving the crust a remarkably smooth, dense texture with a faint roasted aroma after high-temperature pressing. The red bean paste filling is filtered multiple times for an exceptionally silky texture that is pleasantly sweet without being cloying. The insistence on quality ingredients and elegant, understated store design make this classic long-standing shop a local recommendation and a must-visit for travelers.", "name": "Yasutake", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, located near the start of the Sando approach."}, {"address": "3-2-47 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | As the pioneer and creator of Hakata Mentaiko (spicy cod roe), Fukuya features a unique concept store in Dazaifu offering an exclusive \u0027Mentaiko Chazuke\u0027 (spicy cod roe over rice with tea broth). Featuring their carefully marinated signature mentaiko\u2014slightly spicy, savory, and plump\u2014served over fragrant steamed rice and drizzled with a rich house-made broth, it offers a wonderful interplay of umami and subtle heat that builds layers of flavor and whets the appetite. The store also sells various exclusive mentaiko souvenirs; its high quality and authentic local legacy draw foodies seeking classic Hakata specialties.", "name": "Fukuya Dazaifu", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, located along the Dazaifu Sando approach."}, {"address": "1-14-24 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Voted #1 in the Kyushu Ramen General Election, this famous Hakata tonkotsu ramen shop\u0027s Dazaifu branch sits right outside the station exit, making it the perfect pit stop before or after visiting Dazaifu Tenmangu. The intensely rich tonkotsu broth is simmered over high heat for hours to remove gaminess, resulting in a thick, velvety broth with a creamy flavor. Paired with house-made ultra-thin straight noodles that cling perfectly to the soup, every bite is springy and satisfying. Topped with a dollop of signature spicy miso red sauce for a kick of flavor and served with melt-in-your-mouth chashu pork, it\u0027s a must-try local spot for lovers of authentic Kyushu ramen.", "name": "Danbo Ramen Dazaifu Station", "transport": "Turn right after exiting the ticket gates at Nishitetsu Dazaifu Line Dazaifu Station; just a 30-second walk."}, {"address": "2-6-12 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A historic tea house along the Sando approach, featuring a tranquil and gorgeous century-old Japanese garden hidden in the back\u2014once a gathering place for historic figures like Ryoma Sakamoto during the Bakumatsu period. The Umegae Mochi here is handcrafted according to traditional methods; freshly grilled, the crust is crispy on the outside and chewy inside with a rich glutinous rice aroma, while the red bean filling offers a delicate sweetness and subtle bean aroma. Sitting on the garden veranda, enjoying warm, soft Umegae Mochi paired with rich hot matcha featuring a pleasing bittersweet finish, feels like traveling back in time to absorb Dazaifu\u0027s rich history and culture.", "name": "Matsuya", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, located halfway along the Sando approach."}, {"address": "1-15-10 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located near the Torii gate of Dazaifu Tenmangu Shrine, this traditional handmade soba restaurant has decades of history and is beloved by local foodies and pilgrims alike. The restaurant features freshly handmade soba noodles made daily, exhibiting an elegant natural buckwheat tone, smooth texture, excellent chewiness, and delicate aroma. The signature \u0027Tempura Soba\u0027 is highly recommended: freshly fried, golden, crispy tempura wraps sweet, plump shrimp and local seasonal vegetables, served in a light, refreshing bonito and kelp broth. Rich in texture without being oily, it delivers a nostalgic taste of classic Kyushu flavor.", "name": "Yamaga Soba", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, near the entrance to the Dazaifu Tenmangu Sando approach."}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Nestled near Shinji-ike Pond within the spacious grounds of Dazaifu Tenmangu, this traditional rest tea house boasts over a century of history. The menu offers traditional \u0027Chanmen\u0027 (Japanese mixed noodle soup) and various comforting udon dishes, featuring sweet, savory broths and smooth, springy noodles\u2014an ideal energy boost during a shrine visit. Additionally, freshly grilled Umegae Mochi is made right at the entrance, with a slightly charred, crispy crust, chewy bite, and smooth red bean filling. Enjoying it with hot sencha while sitting on red-felt covered outdoor benches under tree shade lets you fully savor the relaxed, charming atmosphere of a traditional Kyushu tea house.", "name": "Shoseikan", "transport": "Approx. 6-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, located next to Shinji-ike Pond inside Tenmangu Shrine grounds."}, {"address": "2-7-12 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A long-established chain specializing in traditional handmade senbei (rice crackers), the Dazaifu branch is situated along the lively Sando approach, enticing visitors from afar with the aroma of roasted soy sauce crackers. Using 100% domestic glutinous rice slowly roasted over traditional fires, their most popular offering among tourists is the \u0027Freshly Grilled Skewered Senbei.\u0027 Brushed with house sweet soy sauce or wrapped in crisp nori, each bite offers an incredibly crisp crunch, leaving lingering notes of roasted rice and soy sauce. With a variety of savory and sweet flavors loved by adults and children alike, it\u0027s the top choice for street food while strolling down the shrine approach.", "name": "Terakoya Honpo Dazaifu", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Line Dazaifu Station, located on the Dazaifu Sando approach."}], "name": "Famous Local Classics"}, "cat_2": {"items": [{"address": "3-2-43 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Masterfully designed by world-renowned architect Kengo Kuma, this unique and warm space is constructed with thousands of interlocking wooden beams. Not only is it an iconic photo spot, but it is also a fantastic place to savor rich dark coffee and freshly baked scones. Pair a warm latte with a crisp-on-the-outside, soft-on-the-inside waffle, and let the rich milkiness intertwined with roasted coffee aromas melt on your tongue. Sitting in this wooden passageway offers a perfect collision of modern aesthetics and Dazaifu\u0027s historic charm.", "name": "Starbucks Coffee Dazaifu Tenmangu Omotesando Store", "transport": "Approx. 3 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "1-15-10 Gojo, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A classic cafe steeped in Showa-era charm, having won awards at the Japan Siphon Coffee Championship. The signature house hand-drip coffee is deep and full-bodied with a captivating dark chocolate finish. Highly recommended is their classic egg salad sandwich: golden and crispy toasted bread filled with smooth, creamy, egg-rich salad that offers a satisfying crunch and warm buttery aroma with every bite. Paired with dark roast coffee, it\u0027s the ultimate relaxing indulgence.", "name": "Rankan Coffee Speciality Shop", "transport": "Approx. 5 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "2-6-11 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A cozy, stylish cafe renovated from a decades-old house, preserving original wooden beams and vintage antique furniture. It serves amazing brunch platters and homemade French toast. The toast is soaked in a special egg wash for hours before being pan-fried to a golden brown; lightly caramelized on the surface, its inside is as soft, tender, and melt-in-your-mouth as pudding. Paired with house-roasted coffee with balanced sweetness and acidity, it\u0027s the ideal choice for a leisurely morning after visiting the shrine.", "name": "cobaco dazaifu European Retro Cafe", "transport": "Approx. 4 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "1-14-27 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A hidden home-roasted coffee sanctuary located in an alley off the approach, filled with a serene Japanese Machiya atmosphere. The owner is extremely meticulous about coffee bean quality; the single-origin pour-overs are clean and crisp, featuring fresh citrusy notes and a delicate sweet finish. The signature thick-cut wheat butter toast is toasted to crispy perfection on the outside while remaining fluffy inside, topped with a generous layer of Hokkaido butter and house-made sweet red bean paste. The savory-sweet combination melts in your mouth and pairs impeccably with a slightly bitter black coffee.", "name": "Coffee Kazanami", "transport": "Approx. 2 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "2-7-24 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A stylish space blending Italian light eats, coffee, and popular artisanal gelato, featuring great natural light and modern design. The brunch menu focuses on freshly pressed croissant paninis and espresso. The panini has an extraordinarily crispy crust, filled with savory ham and melted cheese that bursts with rich milk and herb aromas. Follow up with a double-flavor artisanal gelato pairing passionfruit and pistachio\u2014its smooth, delicate texture glides seamlessly across the palate, creating rich layers of flavor.", "name": "ViTO Dazaifu Tenmangu Omotesando Store", "transport": "Approx. 2 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "4-7-19 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A traditional Japanese house cafe featuring a lush green garden view, situated next to a magnificent, leafy ancient tree near Tenmangu Shrine. It serves delightful daily Japanese-style brunch specials and homemade brown sugar chiffon cake. The chiffon cake is cloud-like, fluffy, moist, and springy, served with light, non-cloying whipped cream and aromatic hot lattes. Sitting by the window watching the green leaves sway offers ultimate relaxation and healing for both mind and palate.", "name": "Kusunoki Cafe", "transport": "Approx. 6 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "3-3-33 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | An exquisite tea and coffee experience hall hidden in the back alleys of Dazaifu\u0027s old street, seamlessly fusing traditional Japanese tea ceremony with Western coffee craftsmanship. The interior is refined and elegant; its signature sencha-infused drip coffee emits a unique aroma of fresh green tea combined with roasted coffee beans. Paired with house-made Matcha Basque Cheesecake\u2014which is delightfully rich, smooth, and melt-in-your-mouth with a bit of pleasant matcha bitterness and cheese tang\u2014this is the ultimate afternoon tea to immerse yourself in the historical and cultural atmosphere.", "name": "Caf\u00e9 Yorozu", "transport": "Approx. 5 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}, {"address": "3-2-37 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A hipster Japanese cafe tea room rich in history and set in a tranquil, quiet environment. Beyond offering high-quality hot-pressed toast light meals for brunch, it also features highly distinctive house-made amazake lattes and brown sugar warabi mochi. The hot-pressed toast delivers a crunchy bite packed with savory cheese and smoked chicken; wrap up your meal with a rich, velvety brown sugar latte whose sweet aroma lingers delightfully on the tongue, creating the perfect ending to your Dazaifu excursion.", "name": "Sabou Aun", "transport": "Approx. 3 mins walk from Nishitetsu Dazaifu Line \u0027Dazaifu Station\u0027"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-6-10 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A charming local eatery tucked away in an alley off the Dazaifu Approach, famous for incorporating local Fukuoka ingredients into burgers and fried chicken. The signature \"Dazaifu Burger\" features freshly fried, ultra-crispy, juicy Japanese karaage chicken paired with a special sweet-and-sour plum sauce made from local plums and crisp lettuce. Every bite offers a perfect balance of tender chicken and refreshing plum aroma. Both tourists and young locals highly praise this unique twist on regional specialties served in a stylish street-food style.", "name": "Chikushian Honten", "transport": "Approx. 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-7-29 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A special Dazaifu branch of the historic shop that originated Hakata mentaiko (spicy cod roe). The exclusive \"Mentaiko Chazuke Set\" is a must-try local specialty when visiting Dazaifu. Rich, marinated, flavor-packed mentaiko with distinct plump grains sits atop steaming aromatic white rice, finished with carefully simmered dashi broth. The savory, slightly spicy mentaiko melts seamlessly with the sweet savory dashi, creating a smooth and layered taste. The store\u0027s cozy, minimalist Japanese atmosphere allows shrine visitors to elegantly savor an authentic Hakata mentaiko feast.", "name": "Fukuya Dazaifu", "transport": "Approx. 2-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "1-15-10 Gojo, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Founded in 1977, this Showa-style specialty cafe/bistro won the Japan Siphon Coffee Championship. Beyond top-quality in-house roasted coffee, its regional light meals are highly acclaimed. The signature \"Thick-Cut Egg Sandwich\" uses carefully selected fresh local eggs to make a piping-hot, cloud-soft fluffy omelet paired with premium toast spread with slightly tangy mayonnaise, melting in your mouth with rich egg flavor. The nostalgic, warm wooden decor and soft lighting make it a favorite for locals and foodies seeking a relaxed, retro atmosphere.", "name": "Rankan Coffee House", "transport": "Approx. 2-minute walk from Nishitetsu-Gojo Station, or 12-minute walk from Dazaifu Station"}, {"address": "1-1-41 Kokubu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A long-standing tonkotsu ramen institution deeply rooted in the community, doubling as a cozy local izakaya at night. The tonkotsu broth is incredibly rich, thick, and collagen-packed with a robust pork bone aroma. Paired with extra-thin firm noodles, every strand clings perfectly to the rich broth, topped with tender, fragrant seared chashu pork. Pair it with a cold beer and crisp, freshly fried bite-sized handmade gyoza (boasting paper-thin, crunchy skins and juicy fillings)\u2014the ultimate spot for locals after work and tourists seeking an authentic Fukuoka ramen-pub experience.", "name": "Dazaifu Hatchan Ramen", "transport": "Approx. 10-minute walk from Nishitetsu-Tofuromae Station"}, {"address": "2-6-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A local specialty restaurant featuring a beautiful Japanese garden, specializing in traditional Kyushu chicken dishes and handmade soba. The signature \"Hanamidori Chicken Mizutaki \u0026 Soba Set\" features Fukuoka\u0027s premium Hanamidori chicken\u2014firm, springy, and completely odor-free. The boiling broth is wonderfully flavorful, taking on a refreshing and sweet finish when dipped in ponzu sauce. Accompanied by chewy handmade soba noodles with a subtle buckwheat aroma, its elegant, tranquil environment and refined regional cuisine make it a favorite for cultural travelers visiting Dazaifu.", "name": "Ju-an Dazaifu", "transport": "Approx. 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-7-40 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A historic Japanese regional cuisine restaurant located right next to the Dazaifu Tenmangu Approach, serving authentic Fukuoka set meals and noodle dishes. The classic \"Duck Soba with Local Chicken Seasoned Rice\" is a huge favorite: tender duck slices bursting with rich savory oil paired with charred sweet green onions and piping hot broth, allowing the smooth noodles to absorb every bit of flavor. It is complemented by \"Jidori Meshi\" (seasoned local chicken rice), where distinct, fragrant rice grains absorb the rich essence of chicken and shiitake mushrooms. Preserving warm hospitality and rustic charm, it\u0027s a wonderful spot to experience Dazaifu\u0027s traditional culinary culture.", "name": "Yamaga", "transport": "Approx. 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-6-2 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | The world\u0027s only Ichiran branch themed around \u0027Passing Exams\u0027 (Gokaku), giving local tonkotsu ramen a deep connection to Dazaifu\u0027s scholarly heritage. Ramen is served in special pentagonal \"Gokaku Bowls\"\u2014a play on the Japanese homophones for \u0027pentagon\u0027 (gokaku) and \u0027success in exams\u0027 (gokaku). The signature tonkotsu broth is simmered for hours, offering a silky, rich flavor without being greasy, paired with their secret red sauce for an appetizing spicy kick. The extra-long 59 cm \"Gokaku Noodles\" symbolize smooth success and longevity, making this landmark a must-visit spot for students and tourists praying for academic success in Dazaifu.", "name": "Ichiran Dazaifu Sando Branch", "transport": "Right outside Nishitetsu-Dazaifu Station (along the approach in front of the station)"}, {"address": "2-4-7 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away near the Dazaifu Approach, this restaurant converted from a traditional residence is renowned for healthy, delicate Japanese small-plate sets featuring local Fukuoka cuisine. The signature \"Seasonal Local Feast\" includes various side dishes crafted from seasonal Kyushu vegetables and fresh fish. The fish is tender and fine-textured, accompanied by local vegetables simmered in sweet soy sauce for a gentle, savory-sweet flavor. Served with sweet, perfectly cooked fluffy rice and a carefully brewed red miso soup, the meal is rich in flavor yet light and wholesome. The tranquil Japanese garden view allows diners to enjoy a quiet moment away from the bustling tourist area.", "name": "Wafusabo Inoue", "transport": "Approx. 4-minute walk from Nishitetsu-Dazaifu Station"}], "name": "Specialty Dining Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "3-3-33 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A renowned Japanese multi-course Shojin-style kaiseki restaurant famous for its delicate yuba (tofu skin) and tofu dishes. The restaurant offers several plant-based Kaiseki set menus, featuring freshly made tender yuba, rich sesame tofu, and deep-fried tofu dumplings. Every dish showcases the ultimate rich soybean flavor and layered textures. The smooth, melting texture and natural soy aroma have earned rave reviews from health-conscious diners and vegetarian tourists alike.", "name": "Umenohana Dazaifu", "transport": "About a 5-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-7-24 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | The most iconic traditional tea house and snack shop on the Dazaifu approach. Its signature Umegae Mochi is a vegan (egg-free, dairy-free) plant-based Japanese dessert. Made with glutinous rice flour and rice flour dough wrapped around sweet, smooth Hokkaido red bean paste, it is grilled in iron molds until golden and crispy outside while chewy inside. Piping hot with a delightful contrast of crispy shell and sweet bean filling, it\u0027s an essential classic treat when visiting Tenmangu Shrine.", "name": "Kasanoya", "transport": "About a 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-7-16 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A famous historic restaurant dedicated to serving 100% domestic buckwheat \u0027Towari Soba\u0027 (pure buckwheat noodles) with great friendliness toward vegetarians. The pure buckwheat noodles are bouncy and chewy, delivering a rich nutty buckwheat aroma with every bite. In addition to dipping noodles, they also offer vegan Umegae Mochi and plant-based sweets with slightly toasted crispy crusts and smooth red bean fillings\u2014a perfect stop for both main meals and snacks.", "name": "Yasutake", "transport": "About a 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "3-3-31 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in an alleyway of Dazaifu\u0027s historic district, this traditional soba shop offers a cozy, historic folk-house atmosphere. They serve pure vegan soba paired with freshly fried vegetable tempura (which can be served with vegetarian sauce or salt upon request). Made with local seasonal vegetables, the tempura has a light, crispy batter revealing sweet, juicy vegetables inside. Paired with chilled, chewy soba noodles, it\u0027s a delightfully refreshing, guilt-free meal popular among plant-based food lovers.", "name": "Soba-dokoro Asono", "transport": "About a 4-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "2-6-12 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A historic Japanese teahouse boasting a tranquil garden view, offering traditional vegan sweets and Uji matcha. Signature items like \u0027Kuzumochi\u0027 (kudzu starch cakes) and \u0027Shiratama Zenzai\u0027 (mochi balls in red bean soup) are completely free of animal products. The kuzumochi is deliciously bouncy, silky, and cool, served with rich roasted soybean flour (kinako) and black sugar syrup for a perfectly balanced sweetness. Sitting before the tranquil classic Japanese garden allows you to fully absorb Dazaifu\u0027s unique Zen-like ambiance.", "name": "Matsuya Teahouse", "transport": "About a 3-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "3-2-10 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A stylish independent caf\u00e9 near Dazaifu Tenmangu Shrine offering a rich \u0027Vegan Vegetable Curry\u0027 simmered with abundant vegetables and special spices. The sauce is aromatic and savory, paired with colorful roasted seasonal vegetables that blend juicy sweetness with deep curry flavors, breaking the mold of sweet traditional Japanese curries. They also offer plant-based oat milk lattes, making it one of the few modern, vegan-friendly cafes in the Dazaifu area.", "name": "MIDLE.", "transport": "About a 4-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A Zen teahouse nestled halfway up the hill behind Dazaifu Tenmangu Shrine, offering Shojin-style teatime and matcha experiences in a quiet, serene atmosphere. Their famous vegan matcha set comes with handmade Japanese wagashi that melts in your mouth with delicate natural sweet bean aromas, perfectly balanced by premium, slightly bitter matcha tea. This hidden gem is a wonderful sanctuary to escape the bustling approach and enjoy mindful plant-based treats.", "name": "A-un Sabo", "transport": "About a 7-minute walk from Nishitetsu-Dazaifu Station"}, {"address": "4-6-15 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A historic sweet shop located at the end of the shrine approach featuring a charming Japanese inner courtyard, famous for its freshly grilled vegan Umegae Mochi and traditional shaved ice. Grilled to order, the mochi has a lightly toasted crispy exterior, a deliciously chewy center, and a rich, subtle sweet red bean filling. In summer, they also serve plant-based matcha red bean shaved ice\u2014a refreshingly fine and fluffy dessert not to be missed in Dazaifu\u0027s historic district.", "name": "Teradaya", "transport": "About a 5-minute walk from Nishitetsu-Dazaifu Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-7-24 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | As the most iconic Umegae Mochi shop on the Dazaifu Tenmangu approach, Kasanoya is famous for serving freshly grilled rice cakes. The piping-hot Umegae Mochi features a slightly charred, ultra-crispy outer crust pressed on an iron griddle, while the inner layer retains a delightfully chewy and dense mochi texture. Wrapped inside is a velvety Hokkaido Tokachi red bean paste that is perfectly sweet without being cloying, striking a flawless balance with the subtly salty, aromatic rice crust. Whether grabbed on the go by strolling tourists or paired with a bowl of rich matcha inside the shop, this is an indispensable classic snack when visiting Dazaifu Tenmangu Shrine.", "name": "Kasanoya Umegae Mochi", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "2-7-16 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Yasutake\u0027s Umegae Mochi focuses on pristine, pure ingredients paired with a stylishly modern storefront design. The shop insists on using high-quality glutinous rice from Saga Prefecture and red beans from Hokkaido. Grilling the cakes to a precise golden brown gives the paper-thin outer shell an extraordinarily crispy bite, followed by warm, soft mochi. The red bean filling is intensely flavorful with rich textured whole beans, balanced with ideal sweetness. For foodies who appreciate a paper-thin crust and pure bean aroma, Yasutake offers refined, distinct textures that make it an extraordinarily popular spot along the approach.", "name": "Yasutake Umegae Mochi", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "2-7-12 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Tenzan Main Shop has taken social media by storm with its eye-catching Strawberry Daifuku Skewers and Onigawara Monaka. The crowd-favorite \u0027Fukuoka Hakata Amaou Strawberry Daifuku Skewer\u0027 features massive, juicy Amaou strawberries with a perfect sweet-tart balance, paired with soft, chewy mochi skin and sweet red bean paste\u2014or encased in a crispy, demon-tile-shaped waffle shell. One bite unleashes a burst of refreshing strawberry juice blending seamlessly with the sweet bean paste, creating a sensational dynamic between crispy and tender textures. It\u0027s the ultimate street treat for photos and sweet cravings alike.", "name": "Dazaifu Tenzan Honten", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "3-2-2 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Tucked away in a side alley off the approach, Chikushian is famous for its original \u0027Dazaifu Burger\u0027, a savory street food highly recommended by local youth and students. This burger features freshly fried Hakata Hanamidori chicken karaage\u2014crispy on the outside, succulent on the inside\u2014drizzled with a specialty Dazaifu plum sauce and tartar sauce. The tartness of the plum wonderfully cuts through the richness of the fried chicken, delivering a complex sweet-and-sour flavor profile. It\u2019s an irresistible savory snack while exploring the area.", "name": "Chikushian Honten", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "1-14-28 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Renowned for its iconic mentaiko rice crackers (\u0027Menbei\u0027), Fukutaro\u2019s Dazaifu branch serves an exclusive hit item: freshly grilled Mentaiko Onigiri. Rice coated generously with signature mentaiko sauce is griddled to crisp perfection, creating a scorched, crunchy outer layer while keeping the rice inside soft and springy. Topped with a thick layer of spicy cod roe and fresh shiso leaves, each bite explodes with savory, spicy flavors balanced by herbal brightness\u2014an addictive treat that leaves you wanting more.", "name": "Fukutaro Dazaifu Branch", "transport": "Approx. 1-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "2-7-21 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Specializing in traditional hand-grilled senbei (rice crackers), Terakoya Honpo\u2019s storefront constantly wafts with the rich aroma of toasted soy sauce. Serving freshly brushed, piping-hot crackers that offer a satisfying crunch and a rich burst of smoky soy sauce flavor, they offer classic seaweed options alongside spicy shichimi and mentaiko flavors. They even feature soft, chewy \u0027Nure-Senbei\u0027 (moist crackers). It\u2019s an authentic, traditional Japanese snack to munch on while strolling down historic streets.", "name": "Terakoya Honpo Dazaifu Branch", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "3-2-47 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Fukuya, the historic pioneer of spicy cod roe (mentaiko), offers an innovative stroll-friendly snack exclusive to its Dazaifu shop: the Mentai Quiche. Combining Fukuoka\u2019s signature mentaiko with rich cheese, potatoes, and red bell peppers inside a flaky French pastry crust, this savory pastry shatters delicately with every bite. The fluffy, savory filling fuses gently spicy cod roe with rich creaminess, serving up pure comfort in a warm bite\u2014extremely popular among local women and international tourists alike.", "name": "Aji no Mentaiko Fukuya Dazaifu Branch", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "3-2-43 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located along the shrine approach, Sugi Bee Garden serves a variety of specialty desserts and beverages crafted from premium natural honey. Their top walking dessert is the Honeycomb Soft Serve Ice Cream\u2014smooth, creamy milk ice cream drizzled with floral honey, with an option to top it with a real chunk of delightfully chewy, nutrient-rich raw honeycomb. The refreshing chill paired with rich honey sweetness makes it an exceptionally invigorating treat after a walk along the shrine approach.", "name": "Sugi Bee Garden Dazaifu Branch", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Station on the Nishitetsu Dazaifu Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dazaifu Historic Cultural and Educational District"}, "hakata": {"categories": {"cat_1": {"items": [{"address": "3-1-6 Hakataekihigashi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | An iconic Hakata ramen institution renowned as the \u0027Cappuccino of Tonkotsu\u0027. The broth is extraordinarily rich, topped with a fine, velvety layer of pork-bone foam that coats your mouth with rich umami and luscious collagen in every bite. Perfectly paired with ultra-thin straight noodles that soak up the flavorful soup, its intense yet smooth taste draws endless queues of foodies and tourists alike.", "name": "Hakata Issou Hakataekihigashi Main Store", "transport": "Approx. 6-min walk from JR Hakata Station (Chikushi Exit)"}, {"address": "3-23-17 Hakataekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A classic Hakata establishment iconic for Mizutaki (chicken hot pot). Using farm-raised \u0027Hanamidori\u0027 chicken from Kyushu simmered slowly in a signature broth, the chicken is tender and juicy, while the soup remains clean, sweet, and smooth. Savor the pure broth first, then dip the tender chicken and handmade meatballs into refreshing ponzu sauce\u2014a rich multi-layered culinary experience beloved by locals and tourists.", "name": "Hakata Hanamidori Hakata Ekimae", "transport": "Approx. 4-min walk from JR Hakata Station (Hakata Exit)"}, {"address": "10F JR Hakata City, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A celebrated Motsunabe (beef offal hot pot) restaurant with over half a century of history. Featuring fresh, springy, and rich Kyushu beef offal simmered with sweet cabbage and garlic chives in a secret soy sauce or white miso broth that grows richer as it cooks. Finish by cooking champon noodles or making rice porridge in the flavor-soaked broth\u2014an absolute classic Fukuoka dining experience.", "name": "Motsunabe Shouraku Hakata Station", "transport": "Directly connected to JR Hakata Station (10F JR Hakata City)"}, {"address": "B1F Hakata Deitos, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Founded in 1951 (Showa 26), this staple represents traditional soft Hakata udon. Unlike chewy Sanuki udon, Hakata udon is famous for its melt-in-your-mouth, silky-smooth texture. The clear, subtly sweet dashi broth brewed from natural kombu kelp and dried sardines pairs delightfully with crispy burdock root tempura (Gobo-ten) for a comforting, soul-soothing bowl.", "name": "Inaba Udon Hakata Deitos", "transport": "Inside JR Hakata Station (B1F Hakata Deitos)"}, {"address": "2-3-32 Hakataekiminami, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A traditional Hakata udon hot spot awarded Michelin Bib Gourmand. Their homemade noodles are slightly flat\u2014soft and silky on the outside with a subtle springy core that gives a delightful mouthfeel. The must-order burdock tempura is fried paper-thin and crispy, releasing savory aromas as it soaks in the savory broth. Incredible quality at an affordable price that draws endless food lovers.", "name": "Hagakure Udon", "transport": "Approx. 11-min walk from JR Hakata Station (Chikushi Exit)"}, {"address": "3-23-12 Hakataekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | The birthplace of the globally famous authentic tonkotsu ramen brand. Sticking to the traditional method of blending broth from two pots, they extract an intensely rich, smooth, and foamy pure pork-bone soup. Served with custom ultra-thin flat noodles, signature black pepper sauce, and specially crafted chashu pork, every flavorful bite embodies the true spirit of traditional Hakata ramen.", "name": "Hakata Ikkousha Hakata Main Store", "transport": "Approx. 4-min walk from JR Hakata Station (Hakata Exit)"}, {"address": "2-20 Gionmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A legendary Hakata bite-sized iron-skillet gyoza joint serving since the Showa era. Lined up and seared to golden perfection in sizzling iron pans, the dumplings have a satisfyingly crispy skin filled with juicy pork and sweet cabbage. One bite per piece, paired with citrusy yuzu kosho dipping sauce for a refreshing balance\u2014a vibrant local comfort food full of nostalgic charm.", "name": "Hakata Gion Tetsunabe", "transport": "Approx. 3-min walk from Subway Gion Station / Approx. 10-min walk from JR Hakata Station (Hakata Exit)"}, {"address": "B1F Hakata Bus Terminal, 2-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A Fukuoka childhood comfort classic known as the \u0027magical soup-absorbing udon.\u0027 The noodles are ultra-soft and continuously absorb broth, so each serving comes with a small kettle of extra soup for refilling. With its savory-sweet broth, generous free scallions, and crisp-yet-tender fishcake tempura, it offers a hearty and truly authentic local dining experience.", "name": "Maki no Udon Hakata Bus Terminal", "transport": "Directly connected to JR Hakata Station Hakata Exit (B1F Hakata Bus Terminal)"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "1F The Blossom Hakata Premier, 2-8-12 Hakata Ekimae, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Famous Tokyo brand\u0027s exclusive Hakata flagship store, specializing in ultra-soft cube toast \u0027Mu\u0027 and local fusion mentaiko French toast. Always packed during morning peak hours, the signature French toast features a golden, crispy, caramelized crust with a dense, moist interior like custard pudding. Paired with rich, savory Hakata mentaiko butter, it delivers rich layers of sweet and savory flavors\u2014an iconic top choice for brunch in Hakata.", "name": "Bread, Espresso \u0026 Hakata\u0026", "transport": "About a 7-minute walk from JR Hakata Station (Hakata Exit)"}, {"address": "1F, 4-14-1 Hakata Ekimae, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A Hakata-exclusive flagship store created by the ultra-popular bakery AMAM DACOTAN, famous for its primeval forest-style decor and open charcoal-grilling aroma. The bakery displays dozens of gorgeously styled, generously filled charcoal-grilled sausage buns, fruit sandwiches, and hard European breads. Crispy on the outside and chewy inside with a wheat sweetness, the juicy sausages explode with flavor when combined with the special sweet-and-sour sauce, offering an amazing taste experience beloved by youth and tourists alike.", "name": "DACOMECCA", "transport": "About a 3-minute walk from JR Hakata Station (Hakata Exit)"}, {"address": "5F AMU PLAZA Hakata, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located on the 5th floor of AMU Plaza Hakata, this high-rise view cafe specializes in house-baked premium square toast. A must-try is the \u0027Hakata Mentaiko Cheese Toast\u0027, using ultra-moist soft toast toasted to a crispy crust with a soft, slightly moist center, topped with a thick layer of savory, slightly spicy mentaiko paste and gooey melted cheese. The whipped cream fruit sandwich is also wildly popular, with light cream accentuating the sweet-and-sour fruit flavors, complemented by healing views overlooking Hakata Station Square.", "name": "Painya Mutsukado Cafe (AMU Plaza Hakata Branch)", "transport": "Directly connected to JR Hakata Station, 5th Floor of AMU PLAZA Hakata"}, {"address": "6F KITTE Hakata, 9-1 Hakataeki Chuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A top specialty coffee representative that started from a Fukuoka coffee truck and earned runner-up at the World Barista Championship. Located on the 6th floor of KITTE Hakata, it boasts full-wall floor-to-ceiling views of Hakata Station Square. The cafe carefully selects single-origin beans worldwide, poured over by professional baristas to craft fruity, smooth coffee with a pleasant aftertaste. Paired with house-made classic cheesecake or seasonal fruit tarts, it is an ideal spot for a stylish brunch or sophisticated afternoon tea.", "name": "REC COFFEE (KITTE Hakata Branch)", "transport": "Directly connected to JR Hakata Station (Hakata Exit), 6th Floor of KITTE Hakata"}, {"address": "4-11-18 Hakata Ekimae, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in an alley near Hakata Station, this minimalist Korean-style cafe gets its name from the Japanese word for \u0027vague/ambiguous\u0027 (aimai). It took social media by storm with visually stunning, uniquely styled desserts and specialty drinks. A must-order is the black sesame matcha latte paired with Morandi-toned seasonal desserts, offering a dense texture and rich aroma without being overly sweet. The concrete industrial-style space is filled with modern texture, paired with friendly service, offering travelers a relaxing secret sanctuary away from station bustle.", "name": "AIMAI Cafe", "transport": "About a 7-minute walk from JR Hakata Station (Hakata Exit)"}, {"address": "6F Hakata Hankyu, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1966, this venerable Fukuoka Showa-style siphon cafe is located inside Hakata Hankyu Department Store. The shop insists on siphon brewing to craft classic coffee with intensely rich aroma, smooth full body, and deep layers. Accompanied by classic mille-feuille or fresh cream cake, the sponge is delicate and moist while the fresh cream is smooth and light. Elegant vintage mahogany decor and thoughtful Japanese table service transport guests back in time for an authentic Japanese kissaten brunch experience.", "name": "Coffee Sha Noda (Hakata Hankyu Branch)", "transport": "Directly connected to JR Hakata Station, 6th Floor of Hakata Hankyu Department Store"}, {"address": "4F Hakata Hankyu, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A historic Showa retro kissaten with nearly a century of history, renowned for its intensely dark coffee brewed using signature home-roasted techniques. Brunch offerings include classic thick copper-grilled pancakes and hot-pressed cheese sandwiches. Made fresh to order, the mini pancakes have a lightly caramelized crispy exterior and a dense yet soft interior rich in egg and butter aromas, drizzled with special brown sugar syrup or maple syrup to balance the coffee\u0027s subtle bitterness. Old-school opulent seating and a quiet atmosphere make it a favorite for lovers of traditional kissaten style.", "name": "Marufuku Coffee (Hakata Hankyu Branch)", "transport": "Directly connected to JR Hakata Station, 4th Floor of Hakata Hankyu Department Store"}, {"address": "8F AMU PLAZA Hakata, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | An American pancake specialty shop created by famous Japanese apparel group JOURNAL STANDARD. Highlights include classic American pancakes made with 100% Japanese wheat and fragrant fermented butter, offering a fluffy, soft texture and a lightly sweet milky aroma. Top brunch recommendation is the sweet-and-savory \u0027Bacon \u0026 Sunny-Side Up Egg Eggs Benedict Pancake\u0027, pairing savory thick-cut bacon with rich soft-boiled yolk and custom hollandaise sauce\u2014the runny yolk infuses into the pancake for a smooth, thoroughly satisfying bite.", "name": "J.S. PANCAKE CAFE (AMU Plaza Hakata Branch)", "transport": "Directly connected to JR Hakata Station, 8th Floor of AMU PLAZA Hakata"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "3-23-17 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An iconic Mizutaki (chicken hot pot) specialty restaurant in Fukuoka, using signature \u0027Hanamidori\u0027 chicken raised on their private farm. The broth is simmered for hours into a rich, creamy white soup packed with collagen. The chicken is tender, springy, and completely odor-free. Start with a sip of the pure, flavorful chicken broth, then dip the chicken into house-made ponzu sauce\u2014the citrusy tang perfectly enhances the natural sweetness of the meat. A must-try local hot pot dining experience when visiting Hakata.", "name": "Hakata Hanamidori - Hakata Ekimae Branch", "transport": "Approx. 5-minute walk from JR Hakata Station (Hakata Exit)"}, {"address": "3-26-5 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A hugely popular local Hakata izakaya famous for its fresh, game-free Motsunabe (beef offal hot pot). It strictly selects premium domestic Wagyu small intestines, which burst with rich sweetness in every bite. Paired with generous amounts of chives and cabbage, the soup can be chosen in classic miso or refreshing soy sauce flavors, while the offal absorbs the rich broth to become incredibly tender and chewy. The shop also serves live squid sashimi delivered directly from Yobuko, offering a crisp, sweet texture that pairs perfectly with chilled sake.", "name": "Hakata Motsunabe Maedaya - Hakata Branch", "transport": "Approx. 4-minute walk from JR Hakata Station (Hakata Exit)"}, {"address": "B2F Fukuoka Asahi Building, 2-1-1 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A long-standing local restaurant directly connected underground to Hakata Station, specializing in light and comforting chicken Mizutaki hot pot simmered from fresh chicken bones. The homemade chicken meatballs (tsukune) are hand-formed, offering a firm texture infused with ginger aroma and crunchy cartilage pieces. As fresh chicken and seasonal vegetables simmer in the secret broth, the soup transforms from clean and sweet to rich and savory. Dipped in house-made ponzu sauce, it remains refreshing and never heavy, making it a favorite among both local professionals and tourists.", "name": "Hakata Mizutaki Hamadaya - Asahi Building Branch", "transport": "Approx. 2-minute walk, directly connected to JR Hakata Station Underground Shopping Mall"}, {"address": "2F Miyako Hotel Hakata, 2-1-1 Hakataekihigashi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | An upscale modern seafood robatayaki gastropub located inside Miyako Hotel, offering an elegant and spacious ambiance. It features daily fresh seafood and live sashimi directly shipped from Kyushu\u0027s coastal waters, especially live Tsushima Akamutsu (blackthroat seaperch) and spear squid, which boast translucent, sweet, and firm flesh. Slow-grilled over charcoal, the fish dishes feature crispy skin, juicy tender meat, and a captivating smoky aroma. Paired with a rich selection of local Kyushu sake, it delivers a refined and luxurious Hakata dining experience.", "name": "Hakata Robata Kagura", "transport": "Approx. 1-minute walk, directly connected to JR Hakata Station (Chikushi Exit)"}, {"address": "1F 6th Okabe Building, 2-4-17 Hakataekihigashi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A lively, vibrant neighborhood izakaya in Hakata, famous locally for its signature \u0027Legendary Fried Chicken Wings\u0027 and \u0027Iron Plate Bite-Sized Gyoza\u0027. The chicken wings are fried to golden perfection, coated in a sweet and spicy secret sauce, and sprinkled with fragrant sesame seeds\u2014juicy and irresistibly delicious. The bite-sized gyoza are pan-fried to a crisp crunch with juicy, flavorful fillings. Serving an array of regional Hakata specialties alongside draft beer, it is an awesome spot to soak in Hakata\u0027s energetic nightlife.", "name": "Hakata Fudo Main Store", "transport": "Approx. 5-minute walk from JR Hakata Station (Chikushi Exit)"}, {"address": "9F JR Hakata City, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1937, this Kyushu regional cuisine gastropub is located in the top-floor dining area of AMU PLAZA. Specializing in Miyazaki Kirishima local chicken (jidori) dishes and Hakata local fare, its signature \u0027Charcoal-Grilled Jidori\u0027 is delightfully firm and chewy, packed with smoky charcoal aroma and savory juices. The Chicken Nanban is crispy outside and juicy inside, served with plenty of creamy homemade tartar sauce for a savory-sweet, mouthwatering bite. Featuring an extensive collection of authentic Kyushu shochu, it\u0027s a popular choice for enjoying genuine Kyushu flavors near Hakata Station.", "name": "Miyazaki Jidori Mansaku - JR Hakata City Branch", "transport": "Directly connected to JR Hakata Station, 9F AMU PLAZA"}, {"address": "10F JR Hakata City, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Supervised by renowned Kabuki actor Ennosuke Ichikawa, this elegant and sophisticated gastropub offers authentic Kyushu regional cuisine. It selects premium Saga chicken from Saga Prefecture for its yakitori and chicken dishes, yielding delicate, tender meat with a subtle charcoal char aroma. The signature thick-cut beef tongue set and motsunabe are also exceptional\u2014the beef tongue is thick yet melt-in-your-mouth tender and juicy. Accompanied by fine Kyushu sakes and exquisite small dishes, guests can enjoy high-quality local cuisine while taking in night views from the high floors of Hakata Station.", "name": "Hakata Umaya - JR Hakata City Branch", "transport": "Directly connected to JR Hakata Station, 10F AMU PLAZA"}, {"address": "2-4-8 Hakataekihigashi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A stylish bistro blending local Hakata ingredients with Western gastropub fare, highly favored by local youth and office workers. It features creative Italian-French fusion dishes combining Hakata mentaiko (spiced cod roe), Kyushu Wagyu beef, and fresh local vegetables. Highlights include \u0027Mentaiko Cream Pasta\u0027 with al dente noodles coated in a rich sauce where spicy, savory cod roe blends seamlessly with fresh cream, and charcoal-grilled Kyushu Wagyu sliced to reveal an enticing pink hue that is tender and succulent. Offering dozens of affordable yet high-quality wines in a relaxed atmosphere.", "name": "Hakata Wine Sakaba Baccano", "transport": "Approx. 4-minute walk from JR Hakata Station (Chikushi Exit)"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "B1F Hakata Hankyu, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | Specializing in macrobiotic and vegan take-out bento boxes and desserts. Made entirely with plant-based ingredients without eggs, dairy, or chemical additives. Popular vegetarian bentos feature chewy brown rice, crispy vegetable tempura, and hearty tofu burger patties. Rich in texture, refreshing, and non-greasy, it\u0027s a huge hit among health-conscious office workers and tourists.", "name": "EVA DINING Hakata Hankyu", "transport": "Direct access from JR Hakata Station, located in the B1 food hall of Hakata Hankyu Department Store"}, {"address": "JR Hakata Station Underground Shopping Mall, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 | Features a dedicated \"Vegan/Vegetarian Curry\" section with no animal ingredients or meat broths. The rich, flavorful Japanese curry sauce coats sweet stewed vegetables, eggplant, and potatoes, creating a smooth, appetizing, slightly spicy bite. It\u0027s the top choice for vegetarian travelers looking for a quick, authentic local meal at Hakata Station.", "name": "CoCo Ichibanya JR Hakata Station Underground", "transport": "Located inside JR Hakata Station Underground Shopping Mall, about a 2-minute walk"}, {"address": "1F Annex, Hakata DEITOS, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 | A famous Japanese soup specialty chain that regularly offers exquisite vegan and vegetarian-friendly soups. Options like classic Hokkaido pumpkin soup and various vegetable curry soups feature a silky, smooth texture that highlights the natural sweetness and deep aroma of fresh vegetables. Warming and satisfying, it is a favorite spot for vegetarians to refuel before or after a train ride.", "name": "Soup Stock Tokyo Hakata DEITOS", "transport": "Directly connected from JR Hakata Station Chikushi Exit to 1F Hakata DEITOS"}, {"address": "6F AMU PLAZA Hakata, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 | Embracing the concept of \"deliciousness in its natural state,\" MUJI offers clearly labeled hot and cold plant-based side dishes. Featuring fresh local Japanese vegetables and tofu\u2014such as sesame lotus root, roasted pumpkin, and tofu salad\u2014the meals are light, refreshing, and preserve natural flavors. Served with multi-grain rice, it\u0027s juicy, refined, and highly favored by health-conscious diners.", "name": "Cafe \u0026 Meal MUJI AMU PLAZA Hakata", "transport": "Directly connected from JR Hakata Station Hakata Exit to 6F AMU PLAZA"}, {"address": "B2F Fukuoka Asahi Building, 2-2-1 Hakataekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 | An authentic Indian restaurant near Hakata Station offering an extensive traditional vegetarian menu. Signature dishes like rich spinach tofu curry and mildly spicy chickpea curry are served alongside freshly baked, egg-free whole wheat roti. Chewy, aromatic, and deeply satisfying, it is praised by plant-based travelers from around the world.", "name": "Moti Indian Restaurant Hakata", "transport": "Directly connected to Fukuoka Asahi Building B2F via the underground street from JR Hakata Station Hakata Exit, about a 3-minute walk"}, {"address": "2F JR JP Hakata Building, 8-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | Offers the \"Moving Mountains Plant-Based Burger\" and a variety of vegan salads specifically tailored for vegetarian diners. The plant-based patty is flame-grilled American-style to lock in juices, offering a realistic, satisfying texture with a subtle s
