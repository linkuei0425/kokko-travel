arming, authentic taste of old Hakata.", "name": "Kawabata Zenzai Hiroba", "transport": "Approx. 4-min walk from Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "2-20 Gionmachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | A popular vintage gyoza eatery located on the edge of Kawabata shopping district and Canal City. Served sizzling hot straight in a round iron skillet, these dumplings feature an ultra-crispy bottom crust filled with fragrant pork and chives. Dipped in house yuzu kosho (citrus chili paste) and ponzu sauce, the irresistible crunch and savory flavor draw endless crowds.", "name": "Hakata Gion Tetsunabe", "transport": "Approx. 3-min walk from Exit 5 of Gion Subway Station, or a 4-min walk from Canal City Hakata"}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "1-1-1 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A trendy, colorful coffee shop filled with artistic vibes located on the banks of the Naka River. They carefully select house-roasted specialty beans. The signature latte is smooth and velvety, perfectly blending espresso and frothed milk with rich notes of nuts and caramel. Their brunch cheese toast is crispy on the outside and soft inside. Paired with flowing waterfront views, it attracts many hipsters and tourists looking for a relaxed morning.", "name": "manu coffee Nakasu River Front", "transport": "Approx. 6 min walk from Subway Nakasu-Kawabata Station"}, {"address": "SHIP\u0027S GARDEN 1F, 13-1 Nishi-Nakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A waterfront flagship store dubbed \u0027the world\u0027s best breakfast\u0027, designed to look like a ship floating on water. The must-order classic Ricotta Pancakes are as light and fluffy as clouds, melting in your mouth alongside rich honeycomb butter and fresh bananas. Sun pours through the glasshouse space, making it a favorite spot for both tourists and locals to enjoy a romantic and luxurious brunch.", "name": "Bills Fukuoka", "transport": "Approx. 3 min walk from Nakasu Exit of Subway Nakasu-Kawabata Station"}, {"address": "6-17 Nishi-Nakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A powerful collaboration between Fukuoka\u0027s premier bakery \u0027pain stock\u0027 and renowned specialty coffee roaster \u0027COFFEE COUNTY\u0027. The signature Mentaiko baguette features a crispy crust and chewy center, releasing a satisfying crunch followed by an explosion of savory mentaiko spread. Paired with a floral and fruity single-origin pour-over coffee, it offers an exquisite balance of flavors, making it an unmissable top breakfast choice at the junction of Kawabata and Nakasu.", "name": "stock (pain stock \u00d7 COFFEE COUNTY)", "transport": "Approx. 4 min walk from Subway Nakasu-Kawabata Station"}, {"address": "Hakata Riverain Mall 1F, 3-1 Shimokawabata-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located inside Hakata Riverain, this American retro-style cafe combines music, books, and delicious dining. The juicy hand-crafted beef burger features a delightfully toasted bun, while rich specialty espresso and fresh French toast provide multi-layered flavors. Its spacious, stylish interior is ideal for gatherings, making it an iconic spot for a relaxing brunch in the Kawabata shopping district.", "name": "Brooklyn Parlor Hakata", "transport": "Directly connected to Hakata Riverain Mall from Subway Nakasu-Kawabata Station"}, {"address": "12-20 Kamikawabata-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A century-old Japanese confectionery shop located at the entrance of Kawabata Shopping Street, featuring an elegant and serene tearoom. Beyond exquisite traditional wagashi, their seasonal strawberry daifuku and parfaits served during brunch and tea time are absolute heavenly treats. The signature \u0027Suzu no Monaka\u0027 features a crisp, paper-thin wafer shell filled with smooth, perfectly sweetened red bean paste. Enjoyed with dark roast black coffee or Japanese green tea, it offers an exceptional blend of Eastern and Western flavors loved by generations of foodies.", "name": "Suzukake Main Store (Suzukake Honten)", "transport": "Right outside Exit 5 of Subway Nakasu-Kawabata Station"}, {"address": "Canal City Hakata 4F, 1-2-22 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located inside Canal City Hakata, offering magnificent waterfront terrace seating with up-close views of the fountain show. Brunch features a variety of satisfying plate meals, such as crispy and juicy pan-seared chicken thigh, paired with special hot-pressed toast and house-roasted coffee. The relaxed, romantic vibe makes it the ultimate coffee pitstop during a shopping spree at Canal City.", "name": "CAFE OTTO.Cyclo", "transport": "Approx. 3 min walk from Subway Kushida Jinja-mae Station"}, {"address": "No. 60 Line Bldg 1F, 5-6-24 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A Mediterranean-style eatery near Nakasu-Kawabata Station serving exquisite Italian brunch and coffee during the day. Highly recommended are the freshly baked artisan bread and rich grilled cheese sandwiches\u2014featuring gooey, stretchy cheese and perfectly toasted bread. The outdoor terrace offers sweeping views of the Nakasu waterfront, attracting travelers who love European-style leisure to enjoy morning coffee and savory light meals.", "name": "Bar Vita Nakasu", "transport": "Approx. 2 min walk from Exit 2 of Subway Nakasu-Kawabata Station"}, {"address": "5-108 Kamikawabata-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in Kawabata-dori Shopping Street, this Showa retro-style kissaten radiates nostalgic warmth and hospitality. The signature siphon-brewed coffee is delightfully aromatic, offering a rich, smooth flavor without harsh bitterness. Pair it with their classic thick-cut pizza toast, featuring fluffy bread with crispy crusts loaded with rich cheese and bacon. This traditional recipe passed down for decades deeply appeals to locals and tourists fond of old-school cafe culture.", "name": "Coffee Shop Casa", "transport": "Approx. 3 min walk from Subway Nakasu-Kawabata Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1-8-20 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Hanamidori is an iconic Hakata mizutaki (chicken hot pot) restaurant located along the Nakasu Canal. The restaurant uses its own Kyushu farm-raised \u0027Hanamidori\u0027 chicken. The soul of the dish\u2014a milky-white broth simmered for hours\u2014is rich, aromatic, and packed with collagen. Tender, juicy chicken cuts are enhanced by a special yuzu ponzu sauce that highlights the meat\u0027s natural sweetness. Next come hand-made chicken meatballs and fresh vegetables with a delightfully springy texture, finishing off with a rich chicken soup zosui (rice porridge). It is a must-visit dining spot for tourists and locals alike to savor traditional Kyushu cuisine in Nakasu.", "name": "Hakata Mizutaki Hanamidori Nakasu Main Store", "transport": "Approx. 5-minute walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "6-15 Nishi-Nakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Japan\u0027s first mentaiko (spicy cod roe) specialty restaurant, located in Nishi-Nakasu near Nakasu-Kawabata. The signature Mentaiju features a whole kelp-cured mentaiko placed over hot rice sprinkled with shredded nori, drizzled with a rich sweet-and-spicy sauce. Every bite bursts with savory, subtly spicy flavors and a delightfully popping texture. Combined with its luxurious, dark-toned interior and refined atmosphere, it attracts countless food lovers to make a pilgrimage for this classic Hakata delicacy.", "name": "Ganso Hakata Mentaiju", "transport": "Approx. 5-minute walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "2-20 Gionmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A classic izakaya near Kawabata Shopping Street and Gion, famous for its sizzling iron skillet gyoza. Arranged in a circle and served piping hot right in the cast-iron pan, the dumplings arrive with an enticing sizzle. The crispy golden crust carries a mouthwatering charred aroma, bursting with juicy pork and chive filling in every bite. Ordering a skillet of crispy gyoza alongside an ice-cold draft beer is the ultimate way to experience Fukuoka\u0027s vibrant nightlife and midnight snack culture.", "name": "Hakata Gion Tetsunabe", "transport": "Approx. 3-minute walk from Exit 2 of Gion Subway Station, or approx. 7-minute walk from Nakasu-Kawabata Subway Station"}, {"address": "5-14 Narayamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An immensely popular restaurant that elevates traditional yatai (street food stall) culture into a comfortable indoor izakaya experience. Trading cramped outdoor stalls for spacious, comfortable seating, it serves top signatures like Hakata vegetable yakitori skewers, freshly shucked seafood, and homemade Kyushu regional specialties. The skewers feature crispy charred exteriors with juicy, sweet vegetables inside, combining traditional yatai warmth with refined izakaya craftsmanship. Highly favored by tourists and young diners alike.", "name": "Susaki Yatai Kajishika", "transport": "Approx. 5-minute walk from Exit 7 of Nakasu-Kawabata Subway Station"}, {"address": "2-6-7 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located in the bustling district of Nakasu, this refined motsunabe (beef offal hot pot) and regional dining spot boasts a warm, modern Japanese aesthetic. The soul of their signature motsunabe is high-quality Kyushu Wagyu offal, simmered in a proprietary soy sauce broth loaded with chives and cabbage. The offal is tender, flavorful, and melts in your mouth without feeling overly greasy, while the vegetables absorb the savory broth to perfection. They also serve horse meat sashimi and various small dishes, ideal for pairing with Japanese sake.", "name": "Hakata Motsunabe Keishu Nakasu", "transport": "Approx. 4-minute walk from Nakasu-Kawabata Subway Station"}, {"address": "1F JPARK Nakasu Bldg., 5-2-1 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | An elegant Japanese izakaya in the Nakasu-Kawabata area featuring private dining rooms exclusively. Its crowning glory is live squid sashimi delivered fresh from Yobuko, Saga; when served, the squid remains translucent, delivering an intensely sweet, crisp, and springy texture. The remaining squid parts can be fried into delicious tempura afterward. Alongside live squid, they offer premium Kyushu ingredients like Hakata local chicken and Saga beef, making it a stellar choice to enjoy exquisite Kyushu cuisine in a luxurious setting.", "name": "Hakata Hotei", "transport": "Approx. 1-minute walk from Exit 2 of Nakasu-Kawabata Subway Station"}, {"address": "2F GION POP-OFF Bldg., 2-3-8 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | An upscale regional izakaya overlooking the night view of the Nakasu Canal, highly popular for business entertaining and discerning travelers. Live fish tanks showcase seafood flown in daily, with signature dishes featuring Kyushu pufferfish (fugu) sashimi and longtooth grouper (kue). The pufferfish meat is firm and springy with a delicate aroma, paired exquisitely with ponzu dipping sauce. Enjoying Hakata specialties alongside select sakes in elegant private rooms facing the riverfront lights offers an unmatched Hakata nightlife dining experience.", "name": "Nakasu Takasho", "transport": "Approx. 6-minute walk from Nakasu-Kawabata Subway Station"}, {"address": "3-33 Tenyamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A renowned mizutaki restaurant near Kawabata Shopping Street, celebrated for its pure and intensely flavorful signature broth. Simmered for hours with fresh chicken bones, the clear broth boasts a rich amber color. Fresh chicken pieces are cooked until tender enough to fall off the bone, while house-made chicken meatballs blended with cartilage deliver a satisfying crunch and springy texture. Paired with house-made ponzu made from choice citrus fruits, it brilliantly elevates the natural sweetness of the chicken, making it a favorite among food connoisseurs.", "name": "Hakata Mizutaki Hamadaya Tenyamachi", "transport": "Approx. 3-minute walk from Gofukumachi Subway Station, or approx. 5-minute walk from Nakasu-Kawabata Subway Station"}], "name": "Specialty Izakayas \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "B2F Hakata Riverain Mall, 3-1 Shimokawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A top-tier macrobiotic and vegan specialty store located inside the Hakata Riverain Mall. Free from meat, fish, eggs, dairy, and refined white sugar, it focuses on healthy bento boxes and set meals made with fresh local vegetables, brown rice, and soy protein. The soy cutlet features a surprisingly juicy texture with a crispy exterior, firm bite, and rich soy flavor. Paired with fragrant, delightfully chewy brown rice and light, guilt-free seasoning, it is extremely popular among health-conscious tourists and local office workers alike.", "name": "Evah Dining Hakata Riverain Store", "transport": "Directly connected to B2F of Hakata Riverain from Nakasu-Kawabata Station on the Fukuoka City Subway Kuko Line."}, {"address": "1F Hakata Riverain Mall, 3-1 Shimokawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A highly renowned traditional Japanese restaurant specializing in tofu and yuba (tofu skin), offering a rich and delicate plant-based tofu Kaiseki course. The freshly made, piping-hot \u0027Mineoka Tofu\u0027 has a creamy, panna cotta-like texture that melts in your mouth. Freshly scooped yuba offers a mild sweetness and warm soy aroma, perfectly accompanied by exquisite seasonal boiled vegetables. Private dining rooms styled like elegant Japanese gardens elevate the atmosphere, making it a top choice for premium plant-based dining favored by vegetarians and family travelers.", "name": "Ume no Hana Hakata Riverain Store", "transport": "Take the Fukuoka City Subway Kuko Line to Nakasu-Kawabata Station, Exit 7 is immediately adjacent."}, {"address": "10-256 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A century-old, traditional 100% vegan dessert shop located in the Kawabata-dori Shopping Street. Its classic red bean soup (zenzai) is simmered using premium Hokkaido red beans, resulting in plump, velvety beans with a rich sweetness that isn\u0027t cloying. It is served steaming hot alongside freshly grilled mochi that is toasted until puffed and slightly charred, offering a wonderfully chewy and fragrant texture. The shop also displays a magnificent Hakata Gion Yamakasa festival float, allowing visitors to deeply immerse themselves in local culture while savoring traditional plant-based Japanese sweets.", "name": "Kawabata Zenzai Hiroba", "transport": "Take the Fukuoka City Subway Kuko Line to Nakasu-Kawabata Station, Exit 5, then walk for about 3 minutes."}, {"address": "1F SHIP\u0027S GARDEN, 13-1 Nishinakasu, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A stylish waterfront restaurant located by Nakasu Tenjin Central Park (Ship\u0027s Garden), offering a diverse selection of lacto-ovo vegetarian and plant-based dishes. Their popular Avocado Sourdough Toast features buttery-smooth sliced ripe avocado paired with fresh herbs and lemon juice for a refreshing, well-layered bite. They also offer vegetarian power bowls and grain-free salads. With scenic canal views right outside the window, it is a favorite spot for international travelers seeking light, healthy dining.", "name": "Bills Fukuoka", "transport": "Take the Fukuoka City Subway Kuko Line to Nakasu-Kawabata Station, Exit 1, then walk for about 3 minutes."}, {"address": "12-20 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A famous curry chain restaurant that thoughtfully provides a dedicated vegan curry menu. The signature curry sauce is made entirely without animal fats or meat broth, using a rich base of vegetables simmered to achieve a perfect balance of sweetness and spice. You can customize your dish with crispy-on-the-outside vegetable croquettes, spinach, eggplant, or soy meat bits. It offers a satisfying and flavorful dining option for vegetarians looking for a quick, delicious meal in the Nakasu area.", "name": "CoCo Ichibanya Subway Nakasu-Kawabata Station", "transport": "Take the Fukuoka City Subway Kuko Line to Nakasu-Kawabata Station, Exit 4, then walk for about 1 minute."}, {"address": "2-3 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A famous traditional Wagashi (Japanese sweet) shop located in Kawabata-dori Shopping Street, well-known for its impressive giant Strawberry Daifuku. It features a whole sweet, juicy Fukuoka Amaou strawberry wrapped in delicate red bean paste and soft, non-sticky gy\u016bhi mochi. Taking a bite releases an explosion of sweet and tart juice. They also serve freshly grilled Mitarashi Dango (sweet soy glaze rice dumplings) that are crispy outside, soft inside, and perfectly balanced\u2014a must-try traditional vegan street food while strolling through the arcade.", "name": "Hakata Tenzan Kawabata Main Store", "transport": "Take the Fukuoka City Subway Hakozaki Line to Gofukumachi Station and walk about 5 minutes, or walk about 6 minutes from Nakasu-Kawabata Station."}, {"address": "B1F Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A Japanese tea house directly operated by the renowned tea company Ito En, located inside Canal City Hakata. It offers a variety of vegetarian-friendly matcha desserts and pure plant-based tea drinks. The signature Matcha Red Bean Shiratama Soup uses rich, bittersweet premium Uji matcha paired with sweet red bean paste and delightfully chewy shiratama mochi balls. With its smooth texture and lingering tea aroma, it is the perfect spot to take a relaxing break and enjoy plant-based desserts while shopping.", "name": "Saryo Itoen Canal City Hakata", "transport": "Take the Fukuoka City Subway Nanakuma Line to Kushida Shrine-mae Station, Exit 2, then walk about 3 minutes to reach Canal City."}, {"address": "7-10 Reisen-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A famous udon restaurant located near Kushida Shrine and Kawabata Shopping Street, renowned for its unique \u0027Teapot Udon\u0027. Thoughtful toward plant-based diners, they offer a clear vegetarian broth brewed entirely from kelp and shiitake mushrooms. The noodles are made with wheat germ, giving them a delightful chewiness and a subtle nutty flavor. The signature Kombu Udon is generously topped with delicious, tender Hokkaido Rausu kelp in a naturally sweet and savory broth, delivering an authentic, comforting Hakata noodle experience without the weight.", "name": "Hakata Akachokobe", "transport": "Take the Fukuoka City Subway Nanakuma Line to Kushida Shrine-mae Station, Exit 2, then walk about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-6-10 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Created by the legendary originator of Hakata mentaiko, the popular grab-and-go \u0027Mentai Quiche\u0027 features a golden, crispy pastry shell filled with rich, smooth cream cheese and spicy, savory mentaiko. Melting softly in your mouth with a perfect savory-sweet balance, it\u0027s refreshing rather than greasy\u2014a piping-hot street snack you can\u0027t miss when passing through Nakasu.", "name": "Ajino Mentaiko Fukuya Nakasu Main Store", "transport": "Approx. 3-minute walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "10-256 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located inside Kawabata-dori Shopping Street, this legendary dessert spot is famous for serving what is known as Japan\u0027s \u0027sweetest red bean soup.\u0027 The soup is cooked down until smooth and velvety, bursting with aroma despite its intense sweetness. It\u0027s served with freshly toasted mochi\u2014golden-crisp on the outside, stretchy and chewy on the inside. Soaking up the rich soup, each bite offers a delightful warmth that perfectly captures the nostalgia and heartwarming charm of Hakata\u0027s traditional shopping arcades.", "name": "Kawabata Zenzai Hiroba", "transport": "Approx. 4-minute walk from Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "Around Haruyoshi Bridge, 1-8 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A hugely popular yatai (food stall) situated beside Haruyoshi Bridge in Nakasu-Kawabata. Its signature dish, \u0027Mochimochi Gyoza\u0027, wraps custom gyoza skins with rice cake, pan-fried to produce a crispy crust with a deliciously chewy center. Packed with juicy pork and accented with plum and shiso leaf, it offers a rich, layered flavor profile that makes it a favorite among both local drinkers and international tourists.", "name": "Yatai Kiryu", "transport": "Approx. 7-minute walk from Nakasu-Kawabata Subway Station, or a 6-minute walk from Tenjin-minami Station"}, {"address": "Inside Seiryu Park, 1 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A classic yatai spot next to Seiryu Park in Nakasu-Kawabata specializing in bite-sized \u0027Hakata Hitokuchi Gyoza.\u0027 Featuring an ultra-thin wrapper pan-fried to a golden crisp, the filling is packed with Berkshire pork (Kurobuta) and plenty of sweet onions. Perfectly bite-sized, crispy on the outside and bursting with sweet juices on the inside, dipped in tangy yuzu kosho sauce, they are completely addictive.", "name": "Yatai Takechan", "transport": "Approx. 8-minute walk from Nakasu-Kawabata Subway Station, or a 3-minute walk from Canal City Hakata"}, {"address": "Inside Seiryu Park, 1 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A lively riverside food stall in Nakasu famous for street food classics like \u0027Mentaiko Gyoza\u0027 and \u0027Grilled Mentaiko\u0027. The gyoza is stuffed with a whole row of spicy mentaiko wrapped in a paper-thin, crispy skin. Every bite pops with spicy fish roe and savory juices\u2014slightly spicy, delightfully salty, and perfect with a cold drink, making it a hot favorite during late-night canal strolls.", "name": "Yatai Pyonkichi", "transport": "Approx. 8-minute walk from Nakasu-Kawabata Subway Station"}, {"address": "12-20 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A century-old traditional Japanese confectionery shop at the entrance of Kawabata Shopping Street, famous nationwide for street sweets like \u0027Suzu no Monaka\u0027 (bell-shaped monaka) and \u0027Strawberry Daifuku\u0027. The monaka wafer is crisp and light as a cloud, filled with silky smooth Hokkaido red bean paste. The strawberry daifuku features a whole sweet-and-tangy fresh strawberry wrapped in delicate, chewy gyuhi (mochi) dough\u2014expertly balanced, beautifully layered, and delightfully refreshing.", "name": "Suzakake Main Store", "transport": "Direct access from Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "Inside Seiryu Park, 1 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A highly rated historic food stall along the Nakasu Canal. Its standout street foods are the \u0027Mentai Tamagoyaki\u0027 (rolled omelet with mentaiko) and \u0027Hakata Beef Tendon Skewers\u0027. Made fresh to order, the hot tamagoyaki is silky-smooth, wrapped around rich, molten mentaiko that bursts with savory flavor and subtle egg sweetness. The skewers are charred on the outside and tender inside, offering a quintessential night-market dining experience while enjoying Nakasu\u0027s night views.", "name": "Yatai Tsukasa", "transport": "Approx. 8-minute walk from Nakasu-Kawabata Subway Station, right next to Canal City Hakata"}, {"address": "2-1 Susakimachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A century-old confectionery shop located at the edge of the Nakasu-Kawabata shopping district, known as the birthplace of White Day. Its signature sweet \u0027Tsurunoko\u0027 features a unique exterior as fluffy and soft as a marshmallow, giving way to a smooth, fragrant egg-yolk-flavored cream filling. Melting effortlessly on the tongue with a gentle sweetness, it is an iconic traditional Hakata treat perfect for taking home.", "name": "Ishimura Manseido Main Store", "transport": "Approx. 3-minute walk from Exit 7 of Nakasu-Kawabata Subway Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Nakasu, Kawabata, and Canal City Hakata"}, "tenjin": {"categories": {"cat_1": {"items": [{"address": "6-15 Nishinakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | As Japan\u0027s first specialized mentaiko (seasoned cod roe) restaurant, their signature \u0027Mentaiju\u0027 is an absolute classic you cannot miss when visiting Fukuoka. Premium whole mentaiko wrapped in kelp and marinated in a secret house sauce is served over warm, fluffy rice and drizzled with a special sweet and spicy sauce. Each bite pops with rich savory flavor and a hint of spice, creating a beautifully layered texture. Paired with shredded seaweed and warm rice, it bursts with umami, making it immensely popular among tourists and local foodies alike.", "name": "Gansu Hakata Mentaiju", "transport": "Approx. 5-minute walk from Exit 16 of Tenjin Subway Station"}, {"address": "2-2-17 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Established in 1969, this renowned Ryotei (traditional fine dining restaurant) features a massive live fish tank and serves top-tier Hakata seafood cuisine. Famous for its mentaiko and fresh live fish sashimi, its lunch sets offer an amazingly luxurious value. The sashimi is tender yet firm and naturally sweet, while the classic mentaiko is plump, slightly spicy, and deeply flavorful. Paired with rich Mizutaki chicken hot pot or freshly fried tempura, it embodies the true essence of traditional Japanese dining and is the ultimate spot to experience Fukuoka\u0027s authentic culinary elegance.", "name": "Chikae Fukuoka Honten", "transport": "Approx. 5-minute walk from Exit 4 of Akasaka Subway Station"}, {"address": "2F Tenjin 27 Bldg, 2-7-6 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A classic flagship restaurant for Hakata\u0027s traditional signature dish \u0027Mizutaki\u0027 (chicken hot pot), using exclusively raised Kyushu \u0027Hanamidori\u0027 chicken. The milky white broth is simmered for hours, offering a rich, comforting, and non-greasy taste. Tender and juicy chicken pieces melt in your mouth, perfectly complemented when dipped in refreshing yuzu ponzu sauce. To end the meal, rice is added to the remaining rich soup to create a flavorful chicken porridge (Zosui)\u2014a comforting final touch that makes this an absolute must-visit for traditional Hakata hot pot culture.", "name": "Hakata Hanamidori Tenjin", "transport": "Approx. 2-minute walk from Exit 2 of Tenjin Subway Station"}, {"address": "2F Shintencho Shopping Street, 2-10-20 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular legacy sushi joint in the Tenjin shopping district, sourcing fresh catches daily from the Genkai Sea and local Kyushu ports. The subtle sushi rice highlights the natural sweetness and rich oiliness of the fresh seafood. Their signature \u0027Seasonal Nigiri Set\u0027 features botan shrimp, sea urchin, and bluefin otoro (fatty tuna) that melt smoothly in your mouth. Offering top-notch quality at reasonable prices, it draws constant queues and is widely acclaimed as the best-value traditional sushi shop in Tenjin.", "name": "Hyoutan Sushi Honten", "transport": "Approx. 3-minute walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-12-38 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1946 as one of the pioneers of Hakata ramen, this legendary spot preserves the original, old-school tonkotsu flavor. The broth is simmered with pork bones for extended hours, yielding a deep brownish, rich, and creamy texture infused with a subtle soy sauce aroma. Served with rare ultra-thin flat noodles that soak up the savory broth perfectly while maintaining a smooth and chewy bite. The chashu pork is tender and flavorful, exuding nostalgic Showa-era charm in every bite\u2014a true holy grail for ramen enthusiasts.", "name": "Ganso Akanoren Setsuchan Ramen Tenjin Honten", "transport": "Approx. 6-minute walk from Exit 2 of Tenjin Subway Station"}, {"address": "B2F Solaria Stage Bldg, 2-11-3 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Established in 1951, this legacy udon shop perfectly embodies the distinct, soft, and comforting texture traditional to Hakata udon. The clear broth is brewed from natural kelp, dried sardines, and bonito flakes, rendering a pure, umami-rich taste. The noodles absorb the savory soup, becoming tender and effortless to eat. Topped with crispy burdock root tempura (Gobo Ten) that melts slightly into the soup for added rich aroma, it is a beloved soul food that locals have cherished since childhood.", "name": "Inaba Udon Solaria Stage", "transport": "Directly connected to B2F of Solaria Stage from Tenjin Subway Station"}, {"address": "2-1-57 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | One of only two Ichiran locations in Japan serving the exclusive \u0027Kama-dare Tonkotsu Ramen\u0027, served in impressive, elegant rectangular boxes. The proprietary braised seasoning sauce gives the tonkotsu broth a deeper, richer savory depth, perfectly coating the springy thin noodles. The special chashu uses premium pork belly, braised to savory perfection with a melt-in-your-mouth tender texture. Combined with their famous solo tasting booths and unmatched quality control, this is an essential pilgrimage site for Hakata ramen culture.", "name": "Ichiran Tenjin Nishi-dori", "transport": "Approx. 5-minute walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "Street front of Tenjin Bldg, 2-14 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture (Yatai Stall)", "feature": "\u2b50 4.2 stars | Founded in 1968, this iconic historic yatai (street food stall) is the legendary birthplace of Hakata\u0027s famous \u0027Yaki-Ramen\u0027 (stir-fried ramen). The chef stir-fries thin ramen noodles on an iron griddle with rich tonkotsu broth, signature Worcestershire sauce, vegetables, and chashu pork. The noodles soak up the intense savory flavors, resulting in a moist, slightly charred, and aromatic stir-fry. With its lively, welcoming street-side vibe and heartfelt hospitality, it attracts endless foodies to experience Fukuoka\u0027s authentic nightlife culture.", "name": "Tenjin Yatai Koganchan", "transport": "Approx. 1-minute walk from Exit 1 of Tenjin Subway Station"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "SHIP\u0027S GARDEN 1F, 13-1 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Renowned for serving the \u0027World\u0027s Best Breakfast,\u0027 bills is located inside the unique architecture of SHIP\u0027S GARDEN in Suisui Park. Its signature Ricotta Pancakes are remarkably fluffy and melt in your mouth, infused with rich milk aroma, fresh bananas, and topped with maple syrup for a perfectly balanced sweetness. Tourists and locals love enjoying a delightful brunch here while soaking in the cozy sunlight streaming through the floor-to-ceiling windows.", "name": "bills Fukuoka", "transport": "About a 5-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 3-minute walk from Tenjin-Minami Subway Station"}, {"address": "1-14-45 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A hugely popular souffl\u00e9 pancake specialty shop in the Tenjin Daimyo area. Their signature thick pancakes are made fresh to order, delivering an amazingly fluffy, cloud-like texture that gently bounces at the touch of a fork. Dense, moist, and rich with egg flavor, they are served alongside fresh fruit and cute, detailed latte art for a dual feast of sights and flavors. It\u0027s a top pick for brunch and afternoon tea for influencers and dessert lovers.", "name": "Caf\u00e9 del SOL", "transport": "About a 7-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "2-1-44 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | The original birthplace of this French toast specialty chain. Using specially developed bread soaked thoroughly in a signature egg mixture, it is pan-fried in butter until golden and crisp on the outside and smooth as custard pudding inside. Savory brunch options feature bacon, lettuce, and cheese for a layered sweet-and-savory flavor, while sweet options are stacked high with fresh berries and whipped cream\u2014a huge hit with brunch enthusiasts.", "name": "Ivorish Fukuoka Main Store", "transport": "3-minute walk from Akasaka Subway Station (Kuko Line) or 6-minute walk from Tenjin Station"}, {"address": "Fukuoka PARCO New Wing 8F, 2-11-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An iconic local specialty coffee brand co-founded by a World Barista Championship runner-up. The Tenjin branch is located on an upper floor of a department store, offering panoramic city views of Tenjin. Their single-origin pour-overs boast a rich aroma with an excellent sweet-and-sour balance, perfectly paired with classic homemade dense cheesecake or fresh daily sandwiches. Highly recommended by local professionals and coffee lovers for a peaceful morning break.", "name": "REC COFFEE Tenjin", "transport": "Directly connected to Tenjin Subway Station (Kuko Line) / Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "Ishii Building 1F, 1-1-3 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A pioneer of Fukuoka\u0027s bohemian street hipness and coffee culture. Tucked in an alley in Daimyo, its vibrant yellow exterior and artistic decor are instantly eye-catching. The signature latte pairs dark roast beans with rich local milk, whipped into micro-foam with nutty and chocolaty notes. Served with simple butter toast or handmade cookies, it\u0027s popular among youth and trendy crowds as a great spot to experience Tenjin\u0027s laid-back local vibe.", "name": "manu coffee Daimyo", "transport": "About an 8-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "6-17 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | The ultimate brunch destination born from a dream collaboration between Fukuoka\u0027s premier bakery Pain Stock and specialty coffee brand COFFEE COUNTY. Their signature Mentaiko Baguette features an ultra-crispy crust bursting with rich, mildly spicy mentaiko spread inside. Paired with a fruity, light-roast pour-over coffee whose refreshing acidity perfectly cuts through the rich bread, it draws long daily queues every morning.", "name": "stock (Pain Stock x COFFEE COUNTY)", "transport": "About a 3-minute walk from Tenjin-Minami Subway Station (Tenjin Central Park Waterfront Area)"}, {"address": "1-11-11 Imaizumi, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A popular airport-and-travel themed Instagrammable cafe, and a must-visit spot near Tenjin. Their iconic caramel pudding is remarkably dense and smooth, offering a deep egg flavor balanced by bittersweet caramel sauce\u2014topping it with a scoop of vanilla ice cream makes it complete. Bold espressos and lattes served with adorable airplane boarding pass stickers attract endless tourists taking photos and enjoying a relaxed coffee brunch.", "name": "FUK COFFEE Parks", "transport": "About a 3-minute walk from the South Exit of Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "5-3-22 Watanabedori, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A stylish cafe combining vinyl record music with a standing coffee culture. Located on the south side of Tenjin, the ground floor features a standing bar filled with warm sound from vintage JBL speakers. Their signature hot-pressed sandwich toast is grilled until delightfully crispy, stuffed with gooey melted cheese and juicy herb chicken. Paired with a single-origin pour-over or rich latte, it attracts trendsetters and tourists who love music and light brunch options.", "name": "STEREO COFFEE", "transport": "About a 3-minute walk from Tenjin-Minami Subway Station (Nanakuma Line)"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2F, Tenjin 27 Bldg, 2-7-9 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A famous Mizutaki (chicken hot pot) restaurant located in the heart of Tenjin, specializing in Kyushu local cuisine. Its rich, amber broth is simmered using the proprietary \u0027Hanamidori\u0027 branded chicken. Savor a sip of the pure, sweet broth first before diving into tender, springy chicken pieces served with house-made ponzu sauce. End the meal with a classic rice porridge cooked in the nutrient-rich broth\u2014a favorite among both local professionals and tourists.", "name": "Hakata Hanamidori Tenjin", "transport": "Approx. 3-minute walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-10-14 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A legendary Motsunabe (beef offal hot pot) bistro operating in Tenjin for over 40 years. Famous for its towering mound of fresh chives that sink into a rich, savory soy sauce broth. The beef offal is tender yet chewy, releasing a mouthwatering sweetness. Paired with refreshing Kyushu shochu, the slightly spicy broth is addictive. Be sure to add their special champon noodles at the end to soak up the savory broth\u2014a must-visit spot for authentic Hakata nightlife dining.", "name": "Hakata Motsunabe Rakutenchi Tenjin Main Store", "transport": "Approx. 1-minute walk from Exit 13 of Tenjin Subway Station"}, {"address": "1-4-23 Imaizumi, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A vibrant bistro blending innovative style with traditional Hakata seafood. The signature dish, Sesame Mackerel (Goma Saba), features ultra-fresh mackerel slices drizzled with a rich secret sesame sauce and fresh ground sesame seeds. The fish is firm, sweet, and perfectly free of any fishiness, pairing wonderfully with cold beer. Don\u0027t miss their extravagant sashimi platters and seared seafood hand rolls in this lively, modern izakaya setting.", "name": "Hakata Fishboy", "transport": "Approx. 5-minute walk from the South Exit of Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-13-12 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | The pioneer bistro famed for live squid dishes directly shipped from Yobuko. Its top specialty is \u0027Live Spear Squid Sashimi\u0027\u2014translucent upon serving, delightfully crisp, sweet, and wonderfully fresh. After enjoying the sashimi, the remaining tentacles and fins can be salt-grilled or fried into tempura for a crispy exterior and tender inside. Paired with local Kyushu sake, it\u0027s a premier choice for high-end local Hakata dining.", "name": "Kawataro Daimyo", "transport": "Approx. 5-minute walk from Akasaka Subway Station / 8-minute walk from Tenjin Station"}, {"address": "6-15 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Japan\u0027s first specialty restaurant dedicated to Mentai (spiced cod roe) dishes. The famous \u0027Mentaiju\u0027 features a whole kelp-wrapped, aged cod roe served over fluffy rice dusted with nori, finished with a special sweet and spicy sauce. Rich, savory, and slightly spicy, each bite bursts with rich ocean flavor. Enjoying a hot bowl of Mentai porridge alongside warm shochu in the evening offers a soul-soothing taste of local culture highly revered by food lovers.", "name": "Ganso Hakata Mentaiju", "transport": "Approx. 5-minute walk from Exit 16 of Tenjin Subway Station"}, {"address": "1-15-33 Kego, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A hugely popular modern robatayaki bistro located on the border of Tenjin and Akasaka. Guests gather around an open charcoal grill to select seasonal vegetables, Kuroge Wagyu beef, and local Hakata fish. The signature \u0027Wagyu Urchin Roll\u0027 melts in your mouth with rich, savory wagyu fat and sweet sea urchin. Their charcoal-grilled Kuro-Satsuma chicken is crispy on the outside and tender within. Complete with a fun self-pour drink system, it\u0027s a top-tier culinary experience well worth the queue.", "name": "Robata Hyakushiki", "transport": "Approx. 8-minute walk from Akasaka Subway Station or Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "2-7-22 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Founded in 1954, this legendary izakaya specializes in bite-sized Hakata gyoza. Made primarily with beef, cabbage, and onions, these perfectly portioned dumplings feature a golden crispy skin and a juicy, naturally sweet vegetable filling that is light and refreshing. Dipped in vinegar soy sauce and yuzu kosho, then paired with a draught beer, it encapsulates the relaxed, authentic charm of local Fukuoka casual dining.", "name": "Hitokuchi Gyoza Temujin Tenjin Main Store", "transport": "Approx. 3-minute walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-4-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A famous yatai (food stall) positioned right outside Tenjin Daimaru Department Store. Hosted by friendly staff, its standout local dishes include \u0027Mentai Pan-Fried Gyoza\u0027 and \u0027Hakata Mentai Fried Ramen\u0027. The gyoza has a crispy bottom and a juicy, savory mentaiko filling, while the fried ramen absorbs every bit of the savory sauce and pops of cod roe. Toasting with fellow travelers under the open-air yatai atmosphere offers an authentic taste of Fukuoka\u0027s vibrant nightlife.", "name": "Tenjin Yatai Pyonkichi", "transport": "Right outside Exit 3 of Tenjin-Minami Subway Station"}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2-12-3 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Located in the heart of the Tenjin Daimyo shopping district, this cafe advocates an organic and macrobiotic lifestyle. The menu is completely free of meat, fish, eggs, dairy, and refined white sugar, featuring fresh local pesticide-free vegetables from Fukuoka and organic brown rice. Tourists highly recommend the \u0027Seasonal Vegan Lunch Plate\u0027, which includes a crispy plant-based cutlet, a vibrant array of warm roasted organic vegetables, and a rich dairy-free miso soup. Layered with delicious flavors and light on the stomach, it leaves you feeling thoroughly refreshed and healthy\u2014a quintessential plant-based sanctuary in Tenjin.", "name": "Rota Cafe (Vegan \u0026 Macrobiotic Cafe Tenjin Daimyo)", "transport": "About a 2-minute walk from Exit 5 of Akasaka Station on the Subway Kuko Line, or an 8-minute walk from the West Exit of Tenjin Station."}, {"address": "Solaria Stage M2F, 2-11-3 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Located directly below Solaria Stage connected to Tenjin Station, Evah Dining is a renowned macrobiotic vegan brand in Fukuoka. The shop uses 100% plant-based ingredients with zero eggs or dairy. The most popular choice is the \u0027Vegan Brown Rice 9-Grid Bento\u0027 alongside handmade vegan desserts. The plant-based fried chicken is crispy outside and tender inside, the fried tofu pouch and pickles offer a perfect sweet-savory balance, and the brown rice is wonderfully chewy and fragrant. It is the most convenient and high-quality vegetarian option for shoppers in Tenjin looking for a quick, healthy, and guilt-free meal.", "name": "Evah Dining Solaria Stage Branch", "transport": "Directly accessible from the North Exit of Nishitetsu Fukuoka (Tenjin) Station via the Solaria Stage underground connecting level."}, {"address": "1-3-18 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Located in the lively Daimyo district, this New York street-style pizzeria serves fantastic 100% vegan pizzas. Crafted with premium plant-based cheese and fresh vegetables, the melt-in-your-mouth melted vegan cheese strings beautifully over a crispy crust and rich house-made tomato sauce\u2014tasting every bit as delicious as traditional pizza! With its relaxed vibe, it\u0027s a huge favorite among international travelers and local young plant-based foodies.", "name": "Slices American Vegan Pizza (Slices Pizza Daimyo)", "transport": "About a 10-minute walk from Tenjin Station on the Subway Kuko Line, or an 8-minute walk from Nishitetsu Fukuoka (Tenjin) Station."}, {"address": "2F, 1-1-5 Akasaka, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | A storied spice curry establishment in the Tenjin area, offering highly acclaimed 100% vegan Sri Lankan curry options. Its vegan vegetable curry plate blends rich coconut milk with over ten unique spices, featuring soft-simmered soybeans, chickpeas, and seasonal vegetables. Rich, smooth, and gently spicy, mixing the diverse side dishes into turmeric rice creates a dynamic interplay of flavors. A legendary hot spot that flavorful plant-based curry lovers shouldn\u0027t miss.", "name": "Nuwara Eliya Sri Lankan Vegan Spice Curry", "transport": "About a 5-minute walk from Exit 2 of Akasaka Station on the Subway Kuko Line, or a 6-minute walk from Tenjin Nishi-dori."}, {"address": "1-11-4 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | A trendy restaurant in Tenjin Daimyo combining craft beer and Mexican cuisine. The menu thoughtfully features dedicated \u0027Vegan Tacos\u0027 filled with seasoned plant-based meat, fresh salsa, guacamole, and cilantro, all wrapped in a freshly pressed warm corn tortilla. Tangy, zesty, and satisfyingly chewy, pairing these tacos with a fresh locally brewed craft beer makes it a fantastic night spot to enjoy a relaxed, exotic plant-based dining atmosphere.", "name": "FUKUOKA CRAFT Mexican Vegan Tacos (FUKUOKA CRAFT by El Borracho)", "transport": "About a 6-minute walk from Akasaka Station on the Subway Kuko Line, or an 8-minute walk from Tenjin Station."}, {"address": "B2F Fukuoka Mitsukoshi, 1-7-11 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 Stars | Located in the basement food hall of Fukuoka Mitsukoshi Department Store right in the heart of Tenjin, this vegan counter specializes in gourmet plant-based takeout free of eggs and dairy. The \u0027Vegan Vegetable Tempura Bento\u0027 and \u0027Organic Brown Rice Hand-pressed Onigiri\u0027 are immensely popular. The vegetable tempura coating is light and non-greasy, bursting with natural sweetness from sweet potato and burdock root, beautifully paired with a vegetarian kelp dipping sauce. Perfect for grabbing a bite to enjoy back at your hotel or for a picnic at Tenjin Central Park.", "name": "Evah Express Fukuoka Mitsukoshi Branch", "transport": "Directly connected to Nishitetsu Fukuoka (Tenjin) Station and Subway Tenjin Station, located on B2F of Fukuoka Mitsukoshi."}, {"address": "1-12-52 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Tucked away in a quiet alley of Tenjin Daimyo, this stylish organic cafe offers a fresh and cozy ambiance. Specializing in vegan and gluten-free dishes, its \u0027Vegan Green Curry Rice\u0027 and \u0027Oat Milk Vegan Pancakes\u0027 are crowd favorites. The green curry features rich coconut milk infused with fresh basil and a mild kick, while the pancakes are crafted from rice flour and banana for a fluffy, naturally sweet texture. Paired with an organic oat milk latte, it\u0027s a delicious and healthy spot that draws many travelers.", "name": "Sonoma Organic \u0026 Vegan Cafe", "transport": "About a 7-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 6-minute walk from Exit 2 of Subway Tenjin Station."}, {"address": "3-4-15 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Reimagining the traditional izakaya experience, this vegetarian-friendly restaurant north of Tenjin focuses on organic vegetable dishes harvested locally in Fukuoka. Highly recommended are the \u0027Vegan Organic Skewers\u0027 and \u0027Vegan Sesame Tantanmen\u0027. The skewers feature juicy shiitake mushrooms and sweet bell peppers grilled to aromatic perfection and seasoned with rock salt, while the creamy tantanmen soup combines rich sesame paste with soy milk, topped with seasoned plant-based minced meat. A thoroughly satisfying modern Japanese izakaya experience for vegetarians.", "name": "Vege-Style Tenjin Organic Vegetarian Izakaya", "transport": "About a 4-minute walk from Exit 1 of Tenjin Station on the Subway Kuko Line."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-14 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (In front of Tenjin 2-Chome Building)", "feature": "\u2b50 4.3 Stars | As one of the most legendary yatai (food stalls) in Tenjin, Fukuoka, Kokin-chan is the birthplace of \u0027Yaki Ramen\u0027 (stir-fried ramen). Rich tonkotsu broth and a special sauce tightly coat springy thin noodles, stir-fried on a high-heat iron griddle until tantalizingly aromatic. Packed with plenty of cabbage, onions, and red pickled ginger, every bite is savory, rich, lightly charred, silky smooth, and full of complex layers. Combining street food warmth with regional character, locals after work and international tourists alike gladly queue for over half an hour late at night just to experience the most authentic taste of Hakata nightlife at an open-air stall.", "name": "Tenjin Yatai Kokin-chan", "transport": "Approx. 1-min walk from Exit 1 of Subway Tenjin Station"}, {"address": "1-4-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (In front of Bank of Fukuoka Main Office)", "feature": "\u2b50 4.2 Stars | Located in front of the Bank of Fukuoka, the popular yatai \u0027Pyon-kichi\u0027 is renowned for its signature \u0027Mentaiko One-Bite Gyoza\u0027. Crispy golden-brown thin skins wrap around juicy pork filling mixed with zesty, flavorful Hakata mentaiko (spicy cod roe). Taking a bite delivers a crunchy sound followed by the bursting texture and gentle kick of mentaiko, harmonizing perfectly with juicy, savory pork. Blending local Fukuoka specialties into traditional street food, this innovative dish is beloved by young adults and tourists\u2014and pairs fantastically with an ice-cold beer.", "name": "Tenjin Yatai Pyon-kichi", "transport": "Approx. 2-min walk from Exit 4 of Subway Tenjin Station"}, {"address": "1-4-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (Along Watanabe-dori)", "feature": "\u2b50 4.5 Stars | Breaking the traditional Japanese yatai mold, this French-style street stall run by Chef R\u00e9my is the most romantic and unique street food spot in Tenjin. Its signature \u0027Garlic Baguette\u0027 boasts an ultra-crispy toasted crust while remaining fluffy inside, thoroughly infused with rich garlic butter that bursts with flavor in every bite. Additionally, freshly baked French quiches feature crispy crusts and soft, silky egg filling, seamlessly blending fine French culinary art with the cozy atmosphere of a Japanese yatai\u2014making it a must-visit spot for countless travelers.", "name": "French Yatai Chez R\u00e9my", "transport": "Approx. 2-min walk from Exit 3 of Subway Tenjin-minami Station"}, {"address": "6-2 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture (Suisai Garden SHIP\u0027S GARDEN 1F)", "feature": "\u2b50 4.6 Stars | Located inside Tenjin Central Park Suisai Garden, this insanely popular bakery\u0027s flagship item, the \u0027Mentaiko Baguette\u0027, is hailed as a must-try street food treat in Fukuoka. Using long-fermented sourdough made with house-cultured yeast, the baguettes have a wonderfully chewy texture and rich wheat aroma, filled generously with a blend of homemade mayonnaise and premium mentaiko. Served fresh out of the oven, the crust is crunchy while the interior remains dense and moist. The umami of mentaiko and creaminess of butter blossom on your palate\u2014richly savory yet never greasy\u2014making it the perfect grab-and-go snack while strolling through Tenjin Park.", "name": "stock Tenjin (Pain Stock x Coffee County)", "transport": "Approx. 3-min walk from Exit 5 of Subway Tenjin-minami Station"}, {"address": "1-11-11 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | A famous dessert shop dedicated to using Fukuoka\u0027s premium \u0027Hakata Amaou Strawberries\u0027, its signature street snack \u0027Amaou Strawberry Dorayaki Daifuku\u0027 is one of Tenjin\u0027s most sought-after walking snacks. A delicate, cloud-like soft mochi wrapper encases smooth, lightly sweet white bean paste and fresh cream, centered around a whole juicy, vibrant red Amaou strawberry. With every bite, fresh strawberry juice bursts through to create a perfect harmony of sweet and tart flavors alongside rich creaminess\u2014delightfully layered and refreshing. A dream dessert you shouldn\u0027t miss while exploring Tenjin.", "name": "Ito King Tenjin Store", "transport": "Approx. 1-min walk from Exit 12 of Subway Tenjin Station"}, {"address": "Underground 2, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (Tenjin Underground Mall West 4th Ave)", "feature": "\u2b50 4.3 Stars | A famous baked apple pie specialty shop in Tenjin Underground Shopping Mall, where the rich aroma of butter greets you before you even reach the counter. This iconic street snack features an astounding 144 layers of pastry, baked to a shatteringly crisp perfection. Filled with sweet-tart diced apples sourced from Aomori Prefecture, it is injected with rich, smooth custard cream. Biting into a hot pie unleashes a buttery aroma, fruity apple notes, and creamy custard all at once\u2014crispy outside, soft inside, perfectly sweet without being cloying, and endlessly popular.", "name": "RINGO Apple Pie Tenjin Chikagai Store", "transport": "Direct connection from Subway Tenjin Station to Tenjin Underground Mall, approx. 2-min walk"}, {"address": "Underground 2, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (Tenjin Underground Mall East 4th Ave)", "feature": "\u2b50 4.4 Stars | Hailing from Hokkaido, this classic freshly baked cheese tart shop in Tenjin Underground Mall always draws long queues. The tart shell is double-baked for a crunchy, butter-cookie texture, while the filling blends three carefully selected cheeses into a fluffy mousse consistency. Taking a bite straight out of the oven lets steaming, molten cheese lava flow out, blending subtle savory and tangy cheese notes with the sweet crust for a delightful contrast of \u0027super crispy crust, ultra-creamy core\u0027. A truly representative Tenjin street food experience.", "name": "BAKE Cheese Tart Tenjin Chikagai Store", "transport": "Direct connection from Subway Tenjin Station to Tenjin Underground Mall, approx. 3-min walk"}, {"address": "2-14-13 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture (Along Showa-dori)", "feature": "\u2b50 4.1 Stars | Brimming with warm Hakata hospitality, this classic Tenjin yatai is beloved by locals and tourists alike for its authentic Hakata oden and teppanyaki delights. The large pot of oden simmers steadily at the front, featuring tender, melt-in-your-mouth daikon radish soaked in rich bonito and kelp broth. Additionally, their signature grilled pig trotter features crisp, lightly charred skin and collagen-rich, tender meat, savory and addictively flavorful. Sitting outdoors in the cool night breeze enjoying piping hot street eats offers a genuine taste of Fukuoka\u0027s unique night market vibe.", "name": "Tenjin Yatai Mami-chan", "transport": "Approx. 2-min walk from Exit 1 of Subway Tenjin Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Tenjin Core Commercial District"}};
        const themeHex = "#db2777";
        const cityName = "Fukuoka";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
