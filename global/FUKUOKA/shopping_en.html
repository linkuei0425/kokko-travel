aimyo.", "name": "Aesop Fukuoka Daimyo", "transport": "About a 6-minute walk from Subway Akasaka Station"}, {"address": "1-11-15 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Dead Sea Body Scrub, 3-in-1 Essential Hair Scrub, Rose Water Silk Body Milk. A standalone flagship store located in the trendy Daimyo district, featuring SABON\u0027s signature stone wishing well sink where customers can try out various scented body scrubs and cleansers. The elegant atmosphere and rich variety of gift sets make it a popular spot for souvenirs.", "name": "SABON Fukuoka Daimyo", "transport": "About a 5-minute walk from Subway Akasaka Station"}, {"address": "Tenjin Chikagai West Avenue 9, Underground No. 1, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: White Tea Eau de Parfum, Sake Kasu Facial Essence, Kombu Serum Lotion. A wildly popular Japanese natural skincare brand that crafts products using native natural ingredients like sake kasu (sake lees), kombu (kelp), and ginger. Located in Tenjin Chikagai connecting to Daimyo, its minimalist packaging and soothing natural scents have made it a hit among younger generations.", "name": "SHIRO Tenjin Chikagai", "transport": "Directly connected to Subway Tenjin Station, only a 3-minute walk to the Daimyo trendy shopping area"}, {"address": "2-6-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: ARGELAN Organic Lip Balm, Matsukiyo Exclusive Body Cream, Santen Cooling Eye Drops. Situated on bustling Nishi-dori at the intersection of Daimyo and Tenjin, this store boasts an amazingly comprehensive selection\u2014from department store makeup to drugstore items and trending Japanese medicines. Offering quick duty-free processing and long operating hours, it\u0027s the top choice for restocking near the trendy shopping strip.", "name": "Matsumoto Kiyoshi Tenjin Nishi-dori", "transport": "About a 3-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "2-7-14 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Shiseido Anessa Perfect UV Sunscreen Skincare Milk, EVE Quick Pain Relief, Kyusoku Jikan Cooling Foot Sheets. Famous for its highly competitive discounted prices, located right near the entrance to the trendy Daimyo shopping district. Chinese-speaking staff are regularly available on-site, and stock is replenished rapidly, making it an excellent stop for tourists to pick up popular beauty and medicinal items in one go.", "name": "Sundrug Tenjin Nishi-dori", "transport": "About a 3-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "Tenjin Chikagai East Avenue 4, Underground No. 1, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: CBD Sleep Balm, Organic Herbal Warming Eye Masks, Natural Organic Herbal Tea Bags. An inner-and-outer wellness organic select shop under Cosme Kitchen, focusing on natural cosmetics and health supplements. Many items are Kyushu exclusives, advocating beauty from the inside out\u2014making it a favorite hidden gem for fans of organic living and natural skincare.", "name": "Biople Tenjin Chikagai", "transport": "Directly connected to Subway Tenjin Station, near the exit for the Daimyo shopping area"}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2-1-4 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: AURALEE wool sweaters, Graphpaper oversized shirts, Hender Scheme leather pouches. Tucked away in the alleys of Daimyo, this minimalist select shop is a mecca for Fukuoka trendsetters and fashion lovers. It brings together top-tier Japanese quality brands and carefully curated international designer pieces, with an atmosphere featuring a sleek, modern architectural aesthetic.", "name": "Dice \u0026 Dice (Dice \u0026 Dice)", "transport": "About a 7-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 5-minute walk from Akasaka Subway Station"}, {"address": "1F, 1-1-9 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: CHERRY exclusive printed T-shirts, Off-White streetwear accessories, Fear of God hoodies. The premier high-end streetwear select shop in Fukuoka\u0027s Daimyo district, carrying the world\u0027s hottest limited-edition sneakers and designer streetwear. Its avant-garde interior attracts numerous creators and streetwear enthusiasts.", "name": "CHERRY Fukuoka (CHERRY FUKUOKA)", "transport": "About a 6-minute walk from Akasaka Subway Station, or an 8-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "1-11-27 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Fukuoka-exclusive camo zip hoodies, classic Ape Head printed T-shirts, BAPE STA retro skate sneakers. The Kyushu flagship store of A BATHING APE, Japan\u0027s iconic streetwear brand. Offering exclusive camo gear with Fukuoka-limited colorways, it\u0027s a must-visit spot for photo ops and shopping for streetwear lovers visiting Daimyo.", "name": "BAPE STORE Fukuoka (A BATHING APE STORE FUKUOKA)", "transport": "About a 5-minute walk from Akasaka Subway Station"}, {"address": "1-13-19 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Pre-owned Supreme hoodies, limited-edition Nike collaboration sneakers, vintage trendy tote bags. A highly famous local Fukuoka second-hand streetwear select and vintage shop. Curated with an expert eye, it stocks rare out-of-print streetwear, limited sneakers, and classic luxury accessories in excellent condition at great value.", "name": "UNION3 Daimyo Store (UNION3 Daimyo)", "transport": "About a 4-minute walk from Akasaka Subway Station"}, {"address": "2F, 1-15-28 Kego, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Maison Margiela Tabi shoes, DRIES VAN NOTEN printed jackets, silver jewelry by local Fukuoka designers. A premier independent fashion select shop located on the border of Daimyo and Kego, beloved by local fashionistas. Showcasing an array of avant-garde, artistic high fashion, premium footwear, and bags, it\u0027s the top choice for finding unique personal style.", "name": "MOGGIE CO-OP (MOGGIE CO-OP)", "transport": "About an 8-minute walk from Akasaka Subway Station, or a 9-minute walk from Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "1-10-16 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: 1980s vintage military jackets, antique French workwear pants, handcrafted vintage leather boots. A specialty clothing store specializing in European vintage, military, and workwear clothing. Established in Daimyo for many years, all items are personally handpicked and sourced from Europe by the owner, blending quality with history\u2014highly praised by vintage enthusiasts.", "name": "SQUAT Fukuoka Daimyo Store (SQUAT FUKUOKA)", "transport": "About a 5-minute walk from Akasaka Subway Station"}, {"address": "1-11-29 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Classic Supreme Box Logo T-shirts, embroidered baseball caps, collaboration crossbody bags. The standalone flagship store of New York\u0027s iconic skate/streetwear brand in Daimyo, Fukuoka. Its minimalist industrial interior exudes a strong brand attitude, drawing huge crowds on drop days. A landmark shop in the Tenjin-Daimyo shopping district.", "name": "Supreme Fukuoka (Supreme FUKUOKA)", "transport": "About a 5-minute walk from Akasaka Subway Station"}, {"address": "1-2-39 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Patchwork jackets by emerging Japanese designers, jacquard knitwear, custom-style canvas bags. An independent boutique tucked away in Daimyo\u0027s backstreets, highlighting emerging domestic Japanese designer brands and niche original clothing. Featuring unique cuts that stand out, it embodies Fukuoka\u0027s unique and free-spirited fashion scene.", "name": "UP THE BRACKET (UP THE BRACKET)", "transport": "About a 6-minute walk from Akasaka Subway Station"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "3-16-19 Haruyoshi, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Hakata Spicy Mentaiko Rice Crackers (Menbei), Freshly Grilled Mentaiko Rice Balls, Rich Canned Mentaiko Spread. Located just steps away from the Daimyo shopping district, this legendary mentaiko (spicy cod roe) brand took Japan by storm with its innovative mentaiko rice crackers, \u0027Menbei.\u0027 Extremely crispy and packed with rich seafood essence and mentaiko flavor, these savory, slightly spicy crackers are irresistibly addictive. The shop also features a freshly prepared food section serving hot, substantial grilled mentaiko rice balls\u2014a perfect spot to fuel up before shopping in Daimyo or to pick up iconic souvenirs.", "name": "Fukutaro Tenjin Kokutai-dori Store", "transport": "Approx. 3-min walk from Nanakuma Line \u0027Tenjin-Minami Station\u0027 / Approx. 7-min walk from Daimyo Shopping District"}, {"address": "1-9 Ohorikoen, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Yame Tea Gift Sets, Unzen Cheese Crackers, Kyushu Local Rice Cracker Souvenirs. Situated right on the scenic front line of Ohori Park, this stylish lifestyle shop and tearoom carefully selects local agricultural products and traditional snacks from across Kyushu. Passionate about promoting local food culture, their signature Yame tea features a rich aroma and minimalist, stylish packaging\u2014ideal for high-end gifting. Enjoy the peaceful lake view inside, and grab some artisanal Kyushu crackers and rice snacks on your way out to take home the authentic warmth of Kyushu\u0027s terroir.", "name": "\u0026 LOCALS Ohori Park", "transport": "Approx. 5-min walk from Exit 3 of Kuko Line \u0027Ohorikoen Station\u0027"}, {"address": "3-2-1 Arato, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Signature Caramel Apple Tart (Jacques), French Madeleines, Exquisite Financier Gift Boxes. Located near Ohori Park, Jacques is a prestigious French pastry shop in Fukuoka whose head chef trained in France and earned international culinary accreditations. Its signature eponymous dessert \u0027Jacques\u0027 masterfully pairs caramel mousse with fragrant apple filling for exquisite texturing and flavor. Meanwhile, shelf-stable baked goods like madeleines and financiers are hugely popular souvenirs among tourists and locals alike, featuring elegant, high-end packaging.", "name": "Jacques Ohori", "transport": "Approx. 6-min walk from Exit 2 of Kuko Line \u0027Ohorikoen Station\u0027"}, {"address": "2-1-44 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: French Toast Sandwich Cookies, Maple Butter Financiers, Premium Honey Pies. Tucked in the backstreets of Daimyo, Ivorish is the legendary bakery that sparked Japan\u0027s French toast craze. Beyond serving freshly cooked hot toast for dine-in, their packaged souvenir line is wildly popular. Their patented \u0027French Toast Sandwich Cookie\u0027 perfectly captures the buttery, maple sweetness of French toast in a crisp, sweet biscuit; their rich financiers offer a deep browned-butter aroma, making these dessert gift boxes an absolute must-grab when exploring Daimyo\u0027s trendy streets.", "name": "Ivorish Fukuoka Main Store", "transport": "Approx. 3-min walk from Exit 5 of Kuko Line \u0027Akasaka Station\u0027 / Approx. 6-min walk from \u0027Tenjin Station\u0027"}, {"address": "3-7-6 Otemon, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Tsukushi Mochi, Seasonal Fruit Daifuku, Hakata Unsensei Wagashi. Josuian is a historic traditional Japanese confectionery (wagashi) shop in Fukuoka, with its Ohori Park store situated right by the lake. The flagship product \u0027Tsukushi Mochi\u0027 features soft, chewy rice cake coated in fragrant roasted soybean powder (kinako) and paired with premium black sugar syrup, offering an elegant, traditional flair. Additionally, their seasonal Fruit Daifuku (featuring fruits like kiwi, tomato, or strawberry) uses fresh local Kyushu fruits wrapped in soft mochi\u2014sweet without being heavy, making it a top choice for experiencing authentic Hakata dessert culture.", "name": "Josuian Ohori Park Store", "transport": "Approx. 2-min walk from Exit 4 of Kuko Line \u0027Ohorikoen Station\u0027"}, {"address": "1-4-20 Arato, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Aviation-Themed Coffee Bean Gift Boxes, FUK Original Canvas Tote Bags, House Drip Coffee Bags. Located right next to Ohori Park, FUK COFFEE Parks incorporates airport and aviation elements into a wildly popular trendy coffee lifestyle store. Their house-roasted coffee beans are named after different airport codes, combining great conversation starters with exceptional flavor. Merchandise such as canvas totes printed with flight tickets/planes, mugs, and drip coffee gift sets feature sleek designs highly favored by young travelers, making them stylish yet practical lifestyle gifts.", "name": "FUK COFFEE Parks", "transport": "Approx. 3-min walk from Exit 2 of Kuko Line \u0027Ohorikoen Station\u0027"}, {"address": "2-1-58 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Must-Buy List: Traditional Chidori Manju, Tirolian Cream Roll Cookies, Uji Matcha Sandwich Biscuits. With centuries of history, Chidoriya is an iconic representative of famous Kyushu sweets, located right at the entrance of the Daimyo shopping area. Their signature \u0027Chidori Manju\u0027 features a thin egg-yolk pastry filled with fragrant white bean paste. Meanwhile, the immensely popular \u0027Tirolian\u0027 roll cookies combine European-style rolled wafers with rich cream fillings in vanilla, strawberry, coffee, and matcha flavors. Packed in retro, adorable tin cans, these are classic, legendary Fukuoka souvenirs.", "name": "Chidoriya Tenjin Daimyo", "transport": "Approx. 2-min walk from Exit 5 of Kuko Line \u0027Akasaka Station\u0027 / Approx. 5-min walk from \u0027Tenjin Station\u0027"}, {"address": "1-12-56 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: Hakata Amaou Strawberry Sandwich Cookies, Mentaiko Cheese Crackers, Strawberry Chocolate Crunch. Hakata Fubian is a renowned dessert shop in the Daimyo area specializing in Fukuoka specialties, particularly adept at turning Fukuoka\u0027s two iconic ingredients\u2014Amaou strawberries and mentaiko\u2014into exquisite snacks. Their \u0027Amaou Strawberry Sandwich Cookies\u0027 use 100% Hakata Amaou strawberry pulp for a rich, sweet, and tangy filling, while the Mentaiko Cheese Crackers expertly blend rich savory cheese with spicy cod roe flavor, making them top-tier office snacks perfect for sharing.", "name": "Hakata Fubian Daimyo", "transport": "Approx. 5-min walk from Exit 2 of Kuko Line \u0027Tenjin Station\u0027 / Approx. 2-min walk from Daimyo Chuo-dori"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "8-1 Yayoigaoka, Tosu City, Saga Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted BEAMS trench coats, adidas retro running shoes, Le Creuset enameled cast iron pots. As Kyushu\u0027s most iconic outlet mall, it\u0027s easily accessible via direct highway bus from central Fukuoka. Designed in an American California-Spanish architectural style, the complex features over 170 international luxury labels and popular Japanese brands. Its biggest highlight is the high concentration of outlet stores from premium Japanese select shops like BEAMS, UNITED ARROWS, and JOURNAL STANDARD, allowing you to score top-quality Japanese fashion and home goods at incredible discounts. A paradise for bargain hunters visiting Fukuoka!", "name": "Tosu Premium Outlets", "transport": "Approx. 45 mins by direct bus from Nishitetsu Tenjin Expressway Bus Terminal"}, {"address": "2-2-1 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Stylish 3COINS home decor, Kuze Fuku \u0026 Co. artisanal dashi broth packs, Rofu lifestyle goods. Located adjacent to Ohori Park and the Mizuho PayPay Dome, this is the largest commercial complex in Western Fukuoka. Bright and spacious, it houses over 160 shops offering affordable youth fashion, trendy cosmetics, lifestyle goods, and local delicacies. Free from the hustle and bustle of downtown department stores, it\u0027s the perfect spot to enjoy relaxed shopping and dining after a stroll around Ohori Park.", "name": "MARK IS Fukuoka Momochi", "transport": "Approx. 10-min walk from Tojinmachi Subway Station, or a 7-min bus ride from Ohori Park"}, {"address": "2-6-50 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: The Ritz-Carlton exclusive home fragrances, local art gallery collaboration postcards, artisan handmade leather accessories. As a flagship luxury complex in the Daimyo area, it blends a lush central green plaza with sleek minimalist architecture. Featuring a curated selection of boutique stores and upscale dining establishments making their Kyushu debut, it elevates Daimyo\u0027s traditional street fashion culture to new heights. Beyond offering an elegant shopping atmosphere, the outdoor plaza frequently hosts creator markets and cultural exhibitions, attracting stylish locals and tourists alike.", "name": "Fukuoka Daimyo Garden City", "transport": "Approx. 5-min walk from Subway Tenjin Station Exit 2, or 7-min walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "2-1-4 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: N.HOOLYWOOD collaboration tees, Graphpaper oversized minimalist shirts, NEIGHBORHOOD room sprays. Established in 1989, Dice \u0026 Dice is a legendary boutique and the birthplace of Daimyo\u0027s streetwear culture. Tucked away in a quiet alley, its two-story underground space delivers an immersive industrial and artistic vibe. Carefully curating top-tier and emerging Japanese designer labels with an emphasis on tailored cuts, luxury fabrics, and uniqueness, it\u0027s a premier pilgrimage site for enthusiasts of minimalist high-end street fashion.", "name": "Dice \u0026 Dice Daimyo", "transport": "Approx. 4-min walk from Subway Akasaka Station, or 8-min walk from Subway Tenjin Station"}, {"address": "1-13-19 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Out-of-print Supreme accessories, St\u00fcssy vintage-style embroidered varsity jackets, Japan-exclusive trendy sneakers. Union3 is a highly influential local streetwear and vintage boutique deeply rooted in Daimyo. Renowned for its vast collection of rare Supreme archive pieces, limited-edition Nike sneakers, and sought-after Japanese streetwear. Every second-hand or deadstock item undergoes strict authentication and is kept in pristine condition\u2014a true treasure trove for streetwear hunters seeking rare collabs and statement pieces.", "name": "Union3 Daimyo", "transport": "Approx. 7-min walk from Subway Tenjin Station, or 6-min walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-1-9 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Off-White city-exclusive hoodies, Readymade vintage military surplus totes, AMBUSH sculpted silver jewelry. Situated in the heart of Daimyo, Cherry is Fukuoka\u0027s premier luxury streetwear boutique. Featuring a sleek two-story all-white minimalist interior with art installations, it showcases limited-edition masterpieces from global luxury street brands and top Japanese designers. Introducing cutting-edge Fashion Week runway items each season, it is a favorite haunt for Japanese celebrities and trendsetters, bringing Tokyo-level high fashion to Fukuoka.", "name": "Cherry Fukuoka", "transport": "Approx. 6-min walk from Nishitetsu-Fukuoka (Tenjin) Station, or 7-min walk from Subway Tenjin-Minami Station"}, {"address": "1-11-10 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: F.C.Real Bristol functional athletic jackets, SOPHNET. printed casual shirts, uniform experiment collab accessories. SOPH. is an iconic Japanese high-end streetwear brand. Designed by renowned architect Nobuo Araki, its Daimyo flagship store exudes extreme modern minimalism. The space completely displays SOPH.\u0027s three flagship lines\u2014SOPHNET., F.C.R.B., and uniform experiment\u2014seamlessly blending techwear functionality, football subculture, and urban aesthetics. A essential stop to experience Kyushu\u0027s street culture history and grab premium streetwear.", "name": "SOPH. Fukuoka", "transport": "Approx. 6-min walk from Subway Akasaka Station, or 8-min walk from Nishitetsu-Fukuoka (Tenjin) Station"}, {"address": "1-15-33 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Issey Miyake geometric pleated bags, Comme des Gar\u00e7ons avant-garde outerwear, Sacai hybrid tailored skirts. RAGTAG is Japan\u0027s premier second-hand designer fashion boutique. Spanning three floors, its Daimyo location is the largest resale fashion hub in Kyushu. Offering rigorously authenticated, high-quality pre-owned pieces from top Japanese and international luxury houses like Comme des Gar\u00e7ons and Yohji Yamamoto at 50% to 70% off retail prices. With a bright, clean boutique environment, it\u0027s a top destination for bargain-hunting high-end designer gems.", "name": "RAGTAG Fukuoka Daimyo", "transport": "Approx. 6-min walk from Subway Tenjin Station, or 5-min walk from Nishitetsu-Fukuoka (Tenjin) Station"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Daimyo Trendy District and Ohori Park"}, "dazaifu": {"categories": {"cat_1": {"items": [{"address": "3-2-42 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Dazaifu-exclusive Plum Blossom Konjac Facial Soap, Cherry Blossom Moisturizing Konjac Soap, Gold Leaf Pearl Beauty Soap. Located along the Tenmangu approach (Sando), this specialty beauty boutique transforms natural konjac into incredibly bouncy, soft facial soaps. The store\u0027s top bestseller is the Dazaifu-exclusive Plum Blossom Facial Soap, infused with local plum blossom extract and natural plant moisturizing factors. It leaves skin smooth, supple, and non-tight after washing. With its soothing, jelly-like texture, it\u0027s a unique beauty souvenir you shouldn\u0027t miss when visiting Dazaifu.", "name": "Dazaifu Konnyaku Shabon", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "1-14-28 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Fukuoka-exclusive Collagen Beauty Drink, Dazaifu Plum Blossom Extract Repairing Hand Cream, Department-store-grade High-moisture Facial Masks. Born in Fukuoka, Ooga Pharmacy is a century-old drugstore chain deeply rooted in Kyushu. The Sando branch combines a traditional Japanese architectural exterior with modern cosmetics displays. In addition to carrying a full range of popular Japanese drugstore products, it exclusively features cosmetics, skincare, and Kampo (traditional herbal) wellness products developed locally in Kyushu. Friendly service and a deep local legacy give travelers peace of mind while shopping.", "name": "Ooga Pharmacy Dazaifu Sando Branch", "transport": "Right outside Nishitetsu Dazaifu Station"}, {"address": "2-7-20 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.6 Stars | Must-Buy List: Dazaifu Plum Blossom Solid Perfume, Camellia Oil High-Moisture Facial Oil, Natural Herbal Bath Salts. This is a refined fragrance and natural beauty select shop brimming with traditional Japanese elegance. Inspired by the emblem of Tenmangu Shrine\u2014the plum blossom\u2014the shop formulates natural solid perfumes and moisturizing oils. Applied to the wrists and neck, the plum blossom solid perfume exudes a subtle, elegant fragrance. Combined with pure plant-extracted camellia oil skincare products featuring gentle, high-quality ingredients, it is immensely popular among female shoppers who love traditional Japanese aesthetics.", "name": "Dazaifu Kaonokura Fragrance \u0026 Skincare", "transport": "About a 4-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-22-1 Gojo, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: Kyushu-exclusive LuLuLun Amaou Strawberry Hydrating Mask, Sonbahyu Pure Natural High-Moisture Horse Oil Cream, Curel Sensitive Skin Body Cream. Drug Eleven is a leading local drugstore chain originating from Kyushu, and its Dazaifu branch boasts a spacious store layout and an extensive range of items. Most popular among tourists are various Kyushu-exclusive beauty products, especially the limited-edition facial mask crafted with extract from Fukuoka\u0027s famous Amaou strawberries, which offers superior moisturizing and brightening effects for dry skin.", "name": "Drug Eleven Dazaifu Branch", "transport": "About a 5-minute walk from Nishitetsu Gojo Station"}, {"address": "485-1 Oaza Shoryo, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: COSMOS Exclusive Shiseido Collaboration Serum, Kanebo Enzyme Powder Wash, Exclusive High-SPF Sunscreen Gel. Headquartered in Kyushu, Cosmos is a mega discount drugstore famous for competitive prices and massive retail spaces. The Dazaifu store offers numerous exclusive skincare items co-developed with top Japanese cosmetic brands, along with a smooth, hassle-free tax-free service. With transparent, wallet-friendly pricing in its beauty section, it is the top pick for locals and tourists looking to stock up on everyday Japanese cosmetics and pharmacy goods in one go.", "name": "Discount Drug COSMOS Dazaifu Branch", "transport": "About 7 minutes by community bus or 5 minutes by taxi from Nishitetsu Dazaifu Station"}, {"address": "2-6-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Must-Buy List: EXCEL Real Clothes Shadow Quad, Canmake Marshmallow Finish Powder, Melano CC Medicated Brightening Essence. Located right across from the exit of Dazaifu Station, Matsumoto Kiyoshi has a prime location, making it the perfect final spot for tourists to restock popular cosmetics before leaving Dazaifu. The store curates the season\u0027s hottest Japanese makeup and skincare, from trending medicated whitening serums to hit Japanese drugstore cosmetics. Bilingual shopping staff are also available year-round to assist with checkout and tax-free processing.", "name": "Matsumoto Kiyoshi Dazaifu Station Branch", "transport": "1-minute walk, directly opposite Nishitetsu Dazaifu Station"}, {"address": "4-3-45 Suzaku, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: SANA Isoflavone Moisturizing Emulsion, ANESSA Perfect UV Sunscreen Skincare Milk, Shiseido Hydrating Lip Balm. Sun Drug is famous for frequent discounts and a comprehensive stock of health and beauty products. Located not far from the historical district, the Dazaifu store features neatly organized cosmetics displays and frequently promotes major skincare brands at discounted prices. For budget-conscious travelers wanting to buy Japanese everyday skincare and medicated sunscreens in bulk, this is an unmissable treasure hunt spot.", "name": "Sun Drug Dazaifu Branch", "transport": "About an 8-minute walk from Nishitetsu Futsukaichi Station"}, {"address": "2-1-35 Gojo, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Kyushu Local Kampo Herbal Anti-Acne Cream, Yokohama Horse Oil Ultimate Moisturizing Cream, Dazaifu Plum Fragrance Lip Balm. Having served Dazaifu residents for years, Ooga Pharmacy Gojo Branch offers a more authentic local community vibe compared to tourist-heavy branches. Its cosmetics section focuses on sensitive skin care and local natural beauty brands. The knowledgeable staff have a deep understanding of medicated skincare and Kampo ingredients, offering highly professional recommendations\u2014ideal for visitors seeking natural and gentle beauty products.", "name": "Ooga Pharmacy Gojo Branch", "transport": "About a 2-minute walk from Nishitetsu Gojo Station"}], "name": "Representative Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "3-2-62 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Japanese pattern canvas tote bags, tabi-style socks, modern modified haori jackets. Located on the Dazaifu approach (Sando), this store embraces the concept of \u0027integrating traditional Japanese patterns into modern life\u0027 and is loved by both locals and tourists. It showcases printed clothing and handmade bags rich in Kyushu flavor, with excellent fabric texture and a strong Japanese flair\u2014perfect for travelers looking for a unique, hipster style.", "name": "Yamatomono Kaya Dazaifu Store", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-7-31 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Handwoven Kurume Kasuri clothing, indigo-dyed embroidered crossbody bags, traditional geometric pattern scarves. Specializing in Fukuoka\u0027s national treasure-level traditional craft \u0027Kurume Kasuri\u0027 indigo-dyed textiles, this shop transforms century-old traditional fabrics into stylish modern dresses, wide-leg pants, and everyday bags. Renowned for becoming softer with every wash while remaining breathable and durable, Kurume Kasuri is a representative boutique showcasing local Fukuoka craftsmanship.", "name": "Kyushu Kurume Kasuri Kasuriya Dazaifu Store", "transport": "About a 4-minute walk from Nishitetsu Dazaifu Station"}, {"address": "1-14-28 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Plum blossom embroidered canvas totes, waterproof heavy-duty canvas backpacks, lightweight crossbody bags. Featuring locally hand-stitched thick canvas bags, the fabrics undergo strict waterproofing and durable stitching. Incorporating Dazaifu\u0027s symbolic plum blossom motifs and cultural heritage imagery, these bags are sleek, sturdy, and heavy-duty, making them a favorite brand among local youths and students.", "name": "Dazaifu Canvas Workshop Nunonoan", "transport": "About a 2-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-2-43 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Japanese-style linen wide-leg pants, woven bamboo and leather combination handbags, geta-style handmade sandals. Carefully selecting clothing, shoes, and bags from independent local designers in Kyushu, this shop emphasizes natural materials like cotton, linen, and plant-dyed fabrics with comfortable tailoring. The bamboo woven combo bags and handmade sandals exude elegance, matching the historic charm of Dazaifu\u0027s streets perfectly.", "name": "Japanese Select Shop Tsubame Dazaifu Store", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-6-15 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Natural plant indigo-dyed dresses, handmade vegetable-tanned leather briefcases, vintage handmade leather shoes. This studio-style independent shop combines traditional Japanese plant indigo dyeing with exquisite handcrafted leather craftsmanship. Every bag and garment is a unique masterpiece by master artisans. The leather items acquire a warm sheen over time, exuding a remarkably elegant and high-end feel.", "name": "Indigo Dye \u0026 Leather Goods Takumi Koubou Dazaifu", "transport": "About a 5-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-1-19 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Japanese pattern canvas sneakers, traditional tabi shoes, woven Japanese paper drawstring pouches. Renowned for applying traditional Japanese patterns (Wagara) to modern footwear and small pouches, this shop excels in custom canvas sneakers and split-toe tabi shoes. They are comfortable, breathable, and guarantee a truly unique look on the street.", "name": "Wa-Bijin Dazaifu Sando", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-8-2 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Organic cotton coats, hand-woven straw bags, vintage leather square bags. Tucked away in an alley within the historic cultural district, this elegant boutique focuses on natural-style apparel and quality handmade bags that mirror Dazaifu\u0027s quaint atmosphere. The clothing mostly features earth tones and understated cuts with a warm, comfortable texture, making it a favorite among women who love the slow-life aesthetic.", "name": "Dazaifu Fuga Apparel \u0026 Goods (Fuga Dazaifu Select)", "transport": "About a 6-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-2-55 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Plum blossom print silk scarves, stylish leather backpacks, handmade printed leather wallets. Situated along the main path to Dazaifu Tenmangu Shrine, this shop takes inspiration from plum blossoms and cultural heritage to create elegant fashion accessories and high-quality leather bags. Their items combine practicality with sentimental value, making them immensely popular among discerning travelers.", "name": "Kitcho Dazaifu Sando Kimono \u0026 Leather Studio", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station"}], "name": "Popular Local Clothing, Shoe, \u0026 Bag Boutiques"}, "cat_3": {"items": [{"address": "2-7-24 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Freshly baked Umegae Mochi, seasonal Mugwort Umegae Mochi. The most iconic century-old Umegae Mochi shop along the Dazaifu approach. The outer skin is grilled golden and crispy, filled with smooth, delicately sweet red bean paste\u2014unforgettable when enjoyed hot on the spot! Beautifully boxed and frozen sets are also available, making it the top souvenir choice for travelers visiting Dazaifu.", "name": "Kasanoya", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-2-47 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Mentaiko Chazuke \u0027Chiyo\u0027, squeezable mentaiko paste (tubu tube). A branch of Fukuoka\u0027s original mentaiko pioneer. In addition to classic spicy mentaiko, they offer convenient squeezable mentaiko tubes\u2014perfect for toast or seasoning dishes. The store also features Dazaifu-exclusive gift boxes of mentaiko chazuke.", "name": "Fukuya Dazaifu", "transport": "Approx. 4-minute walk from Nishitetsu Dazaifu Station"}, {"address": "1-14-28 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Mentaiko Rice Crackers (Menbei), freshly grilled mentaiko rice balls. A popular store along the approach run by famous mentaiko brand Fukutaro. Their signature Menbei crackers are crunchy with a rich, subtly spicy seafood flavor\u2014one of Kyushu\u0027s most iconic souvenirs. You can also buy freshly grilled rice balls brushed with generous mentaiko right at the store.", "name": "Fukutaro Dazaifu", "transport": "Approx. 2-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-7-12 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Onigawara Monaka, Fukuoka Amaou Strawberry Daifuku skewers. Inspired by the imposing shape of \u0027Onigawara\u0027 roof tiles excavated from historical Dazaifu ruins, this shop creates eye-catching Onigawara Monaka with crispy shells filled to the brim. Their seasonal giant Amaou Strawberry Daifuku skewers are also an extremely popular Instagrammable treat along the approach.", "name": "Tenzan Dazaifu", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-6-16 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Houmanzan Wagashi, Uso Mochi. A traditional local Japanese confectionery shop founded in 1948 with rich cultural depth. Their signature \u0027Uso Mochi\u0027, inspired by the sacred bullfinch bird of Dazaifu Tenmangu, is dusted with green perilla powder and offers a soft, chewy, sweet-and-sour taste; \u0027Houmanzan\u0027 features an elegant, unique texture between cake and yokan.", "name": "Baien Confectionery", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-2-2 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Dazaifu Burger, Plum-flavored Fried Chicken. A hugely popular local snack shop known for blending Dazaifu\u0027s specialty plum into a signature sauce paired with crispy fried chicken and juicy meat patties. The refreshingly sweet-and-sour flavor makes this unique local burger a must-buy specialty treat for travelers.", "name": "Chikusian Main Store", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "2-7-21 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Must-buy list: Special soy sauce freshly grilled senbei, Pickled plum \u0026 shiso senbei. A historic store specializing in handmade rice crackers where the rich aroma of freshly toasted soy sauce greets you from afar. They offer over ten flavors ranging from hard-baked to soft-textured crackers. The plum \u0026 shiso flavor featuring Dazaifu\u0027s signature taste is especially beloved, and individually wrapped crackers make perfect souvenirs.", "name": "Terakoya Honpo Dazaifu", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "3-2-41 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Cheese Castella, Classic Honey Castella. A directly operated store of the famous Nagasaki castella bakery on the Dazaifu approach, celebrated for moist, dense cake with coarse sugar crystals at the bottom. Beyond classic honey, the top-selling cheese flavor offers a rich, slightly savory milk aroma, making it a favorite boxed pastry among travelers.", "name": "Seifudo Nagasaki Castella Dazaifu", "transport": "Approx. 4-minute walk from Nishitetsu Dazaifu Station"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "8-1 Yayoigaoka, Tosu, Saga Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Beams Outlet Japanese apparel, Asics professional running shoes, Le Creuset cast iron cookware. Located near Dazaifu, this representative major outlet center in Western Japan features Southern California-style architecture and houses over 170 popular domestic and international brands. Offering attractive discounts and complete tax-free services, it is a shopping paradise for Japanese fashion brands and sportswear.", "name": "Tosu Premium Outlets", "transport": "About a 20-minute ride via direct shuttle bus from Nishitetsu Dazaifu Station or by car via the Kyushu Expressway."}, {"address": "434-1 Ryumyoji, Chikushino, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: KALDI premium selected coffee beans, 3COINS affordable Japanese lifestyle goods, MUJI limited snack packs. A large comprehensive shopping mall adjacent to downtown Dazaifu, housing hundreds of shops and a massive supermarket. Bringing together various Japanese apparel brands, lifestyle items, and a food court, it is a fantastic venue to experience local Fukuoka daily shopping or serve as a rainy-day itinerary fallback.", "name": "AEON MALL Chikushino", "transport": "About a 5-minute walk from JR Tenyama Station, or a 15-minute bus ride from Nishitetsu Dazaifu Station."}, {"address": "3-2-3 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Dazaifu handmade plum rice crackers, carved wooden lucky Bullfinch (Usui), Kyushu-brewed shiso plum wine. Operated by the local tourism association, this comprehensive regional specialty showroom acts like a mini local department store. It features quality agricultural produce, local confectionery, and traditional handicrafts from Dazaifu and the surrounding Chikushi region, offering visitors authentic, culturally rich local gift choices.", "name": "Dazaifu Saifukan Goods Center", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station."}, {"address": "2-7-24 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Freshly baked hot Umegae Mochi, Dazaifu plum-scented green tea, Hakata mentaiko rice crackers. A prominent local multi-concept souvenir department store on Dazaifu\u0027s Omotesando approach. The first floor houses a massive regional specialty market and live Umegae Mochi cooking area, while the second floor offers a spacious dining area. It provides an extensive selection of local Fukuoka specialties and exquisite Kyushu gift sets.", "name": "Dazaifu Baifudo", "transport": "About a 2-minute walk from Nishitetsu Dazaifu Station."}, {"address": "1-14-27 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Hakata wood carvings, Dazaifu Tenmangu limited edition stationery set, Kyushu handmade black soybean soy sauce. Located at the entrance of the Omotesando approach, this large specialty center brings together independent artisans and local ingredients across Kyushu. The bright and spacious interior features cultural Dazaifu souvenirs alongside carefully selected local Fukuoka condiments and handcrafted creative items.", "name": "Dazaifu Monzen Bussankan", "transport": "About a 1-minute walk from Nishitetsu Dazaifu Station."}, {"address": "3-2-47 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Totoro Dazaifu limited embroidered towel, Totoro plum blossom motif figurine, Studio Ghibli character stationery. An official Studio Ghibli store on the Dazaifu Omotesando approach, set in a charming traditional machiya building. Beyond popular anime merchandise, its main highlight is exclusive limited-edition items featuring Dazaifu\u0027s signature plum blossom motifs.", "name": "Donguri Republic Dazaifu Store", "transport": "About a 4-minute walk from Nishitetsu Dazaifu Station."}, {"address": "2-7-31 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Hakata Torimon, Amaou strawberry sandwich cookies, Ise-imo western-style wagashi. The flagship showroom on Dazaifu Omotesando by Fukuoka\u0027s most iconic local confectionery brand. Its flagship signature treat, \u0027Hakata Torimon\u0027, combines Japanese white bean paste with rich butter aromas and has won consecutive Monde Selection Grand Gold Quality Awards, making it an absolute must-buy souvenir when visiting Dazaifu.", "name": "Meigetsudo Dazaifu Omotesando", "transport": "About a 3-minute walk from Nishitetsu Dazaifu Station."}, {"address": "4-7-1 Saifu, Dazaifu, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Exquisite Hakata doll statues, Hakata-ori silk wallets, handcrafted plum wood chopsticks. Located inside Tenmangu Shrine, this cultural and traditional craft exhibition and retail center functions like a refined craft department gallery. It displays and sells authentic handmade traditional crafts and Hakata-ori textiles by top master artisans in Kyushu, with descriptions provided for each piece, offering high collectible and educational value.", "name": "Dazaifu Traditional Craft Center", "transport": "About a 6-minute walk from Nishitetsu Dazaifu Station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dazaifu Historic, Cultural, and Educational District"}, "hakata": {"categories": {"cat_1": {"items": [{"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture (Inside JR Hakata Station)", "feature": "\u2b50 4.2 stars | Must-Buy List: Kyushu-exclusive Sonbahyu Horse Oil Cream, Suncut Super Waterproof Sunscreen Spray, EVE Quick Pain Reliever. Drug Eleven is a leading local drugstore brand deeply rooted in Kyushu, with a conveniently located store inside Hakata Station. The products are curated specifically to meet local needs\u2014besides popular Japanese pharmaceuticals, it features a rich dedicated section for Kyushu local skincare products, including Kumamoto horse oil and regional botanical skincare. With clear price tags and frequent exclusive discounts, it is the top choice for travelers looking to buy authentic Kyushu drugstore items and restock supplies.", "name": "Drug Eleven JR Hakata Station", "transport": "Directly accessible right outside JR Hakata Station ticket gate"}, {"address": "5F, AMU PLAZA Hakata, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: OPERA Lip Tint, VT Cica Daily Soothing Mask, Canmake Perfect Stylist Eyes. As the physical store of Japan\u0027s most authoritative beauty ranking platform, this AMU PLAZA Hakata location is a beauty sanctuary for local young women. Bringing online best-seller rankings into physical displays, the store offers free testing for most products, helping customers effortlessly find skincare and makeup tailored to their needs. It also highlights limited-edition items beloved by local Fukuoka beauty enthusiasts, making it perfect for anyone wanting to stay on top of the latest Japanese beauty trends.", "name": "@cosme STORE AMU PLAZA Hakata", "transport": "Directly connected to JR Hakata Station; take the elevator to the 5th floor of AMU PLAZA"}, {"address": "2F, KITTE Hakata, 9-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: D-UP Silky Liquid Eyeliner, DUO Cleansing Balm Deep, LDK Beauty Award #1 Hand Cream. Located inside the KITTE Hakata department store, this spacious, brightly lit cosmetics shop offers an excellent shopping layout. It focuses heavily on exclusive niche Japanese beauty brands and high-quality personal care products, arranged like a boutique beauty gallery. Alongside an abundance of makeup and skincare, there are plenty of tester counters with comfortable mirrors, making it a favorite spot for local girls picking out the latest delicate cosmetics and fragrance items.", "name": "Ainz \u0026 Tulpe KITTE Hakata", "transport": "About a 1-minute walk from JR Hakata Station Hakata Exit, 2F of KITTE Hakata"}, {"address": "1F, AMU PLAZA Hakata, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: To/one Petal Shadow, The Product Organic Hair Wax, SHIRO Body Mist. This flagship select shop for organic and natural beauty products in Japan curates organic skincare and cosmetics brands from around the world and Japan. The AMU PLAZA Hakata store features a warm, natural ambiance, making it immensely popular among sensitive skin sufferers and those seeking gentle skincare. Staff members are knowledgeable about botanical care and carefully recommend suitable natural products based on individual skin types, making it the premier destination for distinctive natural beauty items.", "name": "Cosme Kitchen AMU PLAZA Hakata", "transport": "Directly connected to JR Hakata Station, 1F of AMU PLAZA"}, {"address": "1F, AMU PLAZA Hakata, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Fleur Eau de Parfum (Osmanthus), Donkey Milk High-Moisture Hand Cream, Organic Nail Care Oil. AUX PARADIS is a niche natural fragrance and cosmetics brand beloved by Japanese locals, with all products 100% made in Japan. Emphasizing natural fragrances and premium donkey milk ingredients, its designs feature a sleek Japanese minimalist aesthetic. Its signature Osmanthus and soap scents are subtle and elegant, paired with highly effective hand creams that have become a highly recommended secret beauty souvenir among local young women in Fukuoka.", "name": "AUX PARADIS AMU PLAZA Hakata", "transport": "Directly connected to JR Hakata Station, 1F of AMU PLAZA"}, {"address": "B1F, Hakata DEITOS, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Blanc White Whitening Essence, Rilakkuma Steam Eye Mask (Kyushu Limited Edition), Chocola BB Collagen Tablets. Located in the Hakata DEITOS underground shopping street inside Hakata Station, this Matsumoto Kiyoshi branch is one of the most convenient drugstore spots. In addition to products from major brands, its biggest feature is a complete lineup of Matsumoto Kiyoshi\u0027s exclusive house brand \u0027matsukiyo\u0027 alongside premium skincare lines, offering fantastic value and quality. Its proximity to the Shinkansen ticket gates makes it an ideal stop for tourists and commuters looking to quickly grab popular health supplements and limited-edition beauty products before boarding.", "name": "Matsumoto Kiyoshi Hakata DEITOS", "transport": "Directly connected to JR Hakata Station Chikushi Exit, Hakata DEITOS Underground Shopping Street"}, {"address": "1F, Hakata Hankyu, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature Color Eyes Palette, The Liquid Foundation, Vibrant Rich Lipstick. Located on the 1st floor of Hakata Hankyu Department Store, SUQQU stands as a benchmark for high-end Japanese luxury beauty. Renowned for creating delicate and elegant Japanese charm, its eyeshadow palettes and liquid foundations are immensely popular in both Japan and Taiwan. The counter provides exceptionally professional and attentive makeup consultation services, where beauty advisors recommend tailored color palettes based on your facial contours and skin tone\u2014a must-visit destination for luxury Japanese beauty seekers.", "name": "SUQQU Hakata Hankyu", "transport": "Directly connected to JR Hakata Station, 1F Cosmetics Area inside Hakata Hankyu Department Store"}, {"address": "2-3-14 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: LION Kyusoku Jikan Cooling Foot Sheets, DHC Lip Cream, Ryukakusan Throat Lozenges. A budget drugstore haven located just a few minutes\u0027 walk from JR Hakata Station\u0027s Hakata Exit, famous for its incredible cost-performance ratio and deep discounts. The store is compactly packed with a huge variety of products, especially everyday beauty consumables, facial sheet masks, and essential household medicines, often priced more competitively than standard drugstores. It is a true sanctuary for budget-conscious travelers looking to bulk-buy daily beauty supplies and OTC pharmaceuticals.", "name": "Daikoku Drug Hakata Ekimae", "transport": "About a 3-minute walk from JR Hakata Station Hakata Exit"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "KITTE Hakata 1F, 9-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Genuine leather long wallets, cowhide business card holders, classic business briefcases. Originating right here in Fukuoka, this high-quality leather brand is renowned for its exceptional value on natural cowhide products. The store offers over 13 vibrant color options, ranging from sleek business accessories to lightweight everyday bags. Highly popular among local office workers and tourists looking for gifts, they also offer on-site custom engraving services\u2014perfect for creating a truly unique leather piece.", "name": "Business Leather Factory KITTE Hakata", "transport": "About a 1-minute walk from the Hakata Exit of JR Hakata Station (Direct connection to KITTE Hakata)"}, {"address": "AMU PLAZA Hakata 3F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: BEAMS exclusive collaboration canvas bags, Japanese-fit tailored shirts, collaboration sneakers. As one of Japan\u0027s premier iconic fashion select shops, the Hakata branch inside AMU PLAZA showcases the cutting edge of Japanese street style and fashion culture. Housing both men\u0027s and women\u0027s apparel alongside a rich selection of shoes and accessories, it frequently drops exclusive items created with major international brands and local Japanese creators, making it a favorite among stylish locals and youth.", "name": "BEAMS HAKATA", "transport": "Direct connection from JR Hakata Station (AMU PLAZA Hakata 3F)"}, {"address": "AMU PLAZA Hakata 2F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: TANKER series crossbody bags, classic PORTER tri-fold short wallets, nylon backpacks. This is a directly managed flagship store for Yoshida Porter, Japan\u2019s national treasure bag brand. The lineup is incredibly comprehensive, featuring everything from lightweight, abrasion-resistant classic flight nylon series to beautifully textured minimalist leather bags. The staff provides highly professional service with thoughtful recommendations on materials and functionality, making it the top destination to pick up a durable, iconic Japanese bag.", "name": "KURA CHIKA by PORTER Hakata", "transport": "Direct connection from JR Hakata Station (AMU PLAZA Hakata 2F)"}, {"address": "AMU EST 1F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: Custom embroidered socks, Japanese retro cable-knit socks, cooling no-show socks. Japan\u0027s premier specialty sock brand, renowned for its 100% Made-in-Japan, high-quality textiles. Located in the underground shopping mall, the Hakata City branch offers an incredible variety\u2014from trendy cable-knit designs to comfortable, non-slip no-show socks. They even offer exclusive on-site letter embroidery, adding a thoughtful Japanese touch and great souvenir value.", "name": "Kutsushitaya JR Hakata City", "transport": "Direct access from the underground mall on the Chikushi Exit side of JR Hakata Station (AMU EST 1F)"}, {"address": "AMU PLAZA Hakata 4F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buys: Heavyweight American tees, loose vintage-style jackets, small leather shoulder bags. A wildly popular Japanese select shop focusing on American casual retro style, hugely popular among local youth. The store showcases a vast collection of unique apparel that blends American workwear and military vibes with Japanese tailoring. Offering excellent quality at accessible prices alongside exclusive Japanese collaboration shoes and bags, it is a must-visit for shoppers who love edgy, personalized style.", "name": "FREAK\u0027S STORE AMU Plaza Hakata", "transport": "Direct connection from JR Hakata Station (AMU PLAZA Hakata 4F)"}, {"address": "AMU PLAZA Hakata 4F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Premium Japanese-made suit jackets, minimalist genuine leather shoes, designer collaboration print shirts. Championing the concept \u0027From JAPAN to the WORLD,\u0027 this high-end Japanese fashion select shop carefully curates 100% domestic designer and Made-in-Japan clothing and accessories. It is a sanctuary for fashion lovers seeking elegant cuts, premium fabrics, and meticulous attention to detail, perfectly capturing Hakata\u0027s cutting-edge high-end Japanese style.", "name": "STUDIOUS Hakata", "transport": "Direct connection from JR Hakata Station (AMU PLAZA Hakata 4F)"}, {"address": "KITTE Hakata 2F, 9-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Hanabi gradient-dyed leather bags, Sou 2-Way two-tone leather backpacks, natural gemstone jewelry. Founded in Japan as a pioneering social enterprise leather brand, MOTHERHOUSE creates minimalist, elegant bags, shoes, and accessories using premium natural leather and masterful craft skills from developing nations. Bright and welcoming, the Hakata store features uniquely designed two-way backpacks and plant-dyed gradient leather bags that are immensely popular among local commuters and women for blending functionality with sustainable aesthetics.", "name": "MOTHERHOUSE KITTE Hakata", "transport": "About a 1-minute walk from the Hakata Exit of JR Hakata Station (Direct connection to KITTE Hakata)"}, {"address": "AMU PLAZA Hakata 4F, 1-1 Hakataekichuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: Relaxed linen wide-leg pants, collaboration backpacks, organic cotton striped shirts. A clothing and lifestyle boutique under the famous URBAN RESEARCH group centered around the theme of \u0027comfortable and natural living.\u0027 Most apparel uses natural and organic materials, tailored in loose, airy fits that express a relaxed, sophisticated Japanese casual style. Their canvas bags and shoes also emphasize practical function, making them a favorite among local office workers.", "name": "URBAN RESEARCH DOORS AMU Plaza Hakata", "transport": "Direct connection from JR Hakata Station (AMU PLAZA Hakata 4F)"}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata DEITOS 1F)", "feature": "\u2b50 4.4 stars | Must-buy list: \u0027Hakata Torimon\u0027 Western-style Japanese confection, Hakata Sweet Potato. A signature Hakata souvenir that has won the Grand Gold Quality Award at Monde Selection for consecutive years! Hakata Torimon perfectly blends fresh cream with premium white bean paste into a soft, velvety filling, wrapped in a rich, milky crust that melts in your mouth. It is an exquisite treat to pair with hot tea or coffee.", "name": "Meigetsudo Hakata DEITOS", "transport": "Directly connected to JR Hakata Station, located inside \u0027Miyagemon Market\u0027 on the 1st floor of Hakata DEITOS"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata DEITOS 1F)", "feature": "\u2b50 4.3 stars | Must-buy list: Original Mentaiko Rice Crackers (Menbei), Mayonnaise Flavor Mentaiko Rice Crackers. A super popular seafood rice cracker specialty shop in Fukuoka. Blending delicious ocean flavors like mentaiko (spiced cod roe), squid, and octopus into crispy crackers with a mild spicy kick, they are irresistibly addictive\u2014a top local choice for snack time or pairing with drinks.", "name": "Fukutaro Hakata DEITOS", "transport": "Directly connected to JR Hakata Station, inside the souvenir area on the 1st floor of Hakata DEITOS"}, {"address": "2-19-24 Hakataekimae, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Tsukushi Mochi, Seasonal Fruit Daifuku (such as Strawberry Daifuku). The signature creation of Josuian, a century-old confectionery in Fukuoka. \u0027Tsukushi Mochi\u0027 features soft, chewy mochi dusted with premium roasted soybean powder (kinako) and drizzled with kuromitsu (black sugar syrup), packed with traditional Japanese flavor. Beautifully wrapped like an elegant Japanese drawstring pouch, it makes a classy and thoughtful gift.", "name": "Josuian Hakata Ekimae Main Store", "transport": "About a 2-minute walk from the Hakata Exit of JR Hakata Station"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata DEITOS 1F)", "feature": "\u2b50 4.2 stars | Must-buy list: Tsurunoko, Mentai Rice Crackers. A renowned store with over a century of history in Fukuoka, famous across Japan for \u0027Tsurunoko\u0027\u2014a soft, snow-like marshmallow filled with rich, creamy egg yolk paste. It is also the legendary shop where White Day originated. Its delicately sweet, unique flavor makes it a classic Kyushu confection beloved by gourmets.", "name": "Ishimura Manseido Hakata DEITOS", "transport": "Directly connected to JR Hakata Station, inside the souvenir street on the 1st floor of Hakata DEITOS"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Inside JR Hakata Station)", "feature": "\u2b50 4.3 stars | Must-buy list: Tube Mentaiko Paste (Hakata Mentai Paste), Dried Mentaiko. The flagship counter of Fukuoka\u0027s mentaiko giant \u0027Yamaya\u0027. Marinated in their signature \u0027Takumi Sauce\u0027, their mentaiko is delightfully savory with no fishy odor. The extremely popular tube paste comes in garlic, butter, original, and other flavors\u2014making it ultra-convenient and delicious to spread on bread or mix into warm rice.", "name": "Hakata Yamaya JR Hakata Station", "transport": "Inside the commercial facility outside the ticket gates of JR Hakata Station"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata Ming Shopping Street)", "feature": "\u2b50 4.2 stars | Must-buy list: Niwaka Senbei, Doraemon Limited Edition Niwaka Senbei. Inspired by the half-face mask of \u0027Hakata Niwaka\u0027, a traditional performing art in Fukuoka. These fun and cute crackers offer a rich egg aroma and a delightfully crisp crunch. Coming with a paper mask inside, it\u0027s an iconic traditional cracker that combines local humor with great taste.", "name": "Toundo Hakata Ming", "transport": "Directly connected to JR Hakata Station, located in the Ming Souvenir Section"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata Ming Shopping Street)", "feature": "\u2b50 4.5 stars | Must-buy list: Suzu no Monaka (Bell-shaped Monaka), Strawberry Daifuku (Seasonal). A high-end Japanese confectionery shop founded over 90 years ago in Fukuoka. Delicate bell-shaped wafer shells filled with sweet, high-quality Hokkaido red bean paste offer a rich aroma and exceptionally crisp texture. Elegant bamboo basket packaging paired with premium ingredients makes it the top choice for an upscale gift.", "name": "Suzukake Hakata Ming", "transport": "Directly connected to JR Hakata Station, inside the Ming Wagashi section"}, {"address": "1-1 Hakataekichuogai, Hakata Ward, Fukuoka City, Fukuoka Prefecture (Hakata Ming Shopping Street)", "feature": "\u2b50 4.3 stars | Must-buy list: Meika Hiyoko (Chick Manju), Hakata Amaou Strawberry Hiyoko Sabl\u00e9. A century-old cute confectionery born in Iizuka, Fukuoka. The adorable 3D chick-shaped pastry is filled with a rich, specially made egg yolk paste, sweet and delicious. The limited-edition strawberry flavor uses top-tier Fukuoka \u0027Amaou\u0027 strawberries, making it immensely popular among women and children.", "name": "Hiyoko Honpo Yoshinodo Hakata Ming", "transport": "Directly connected to JR Hakata Station, inside Ming Souvenir Street"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Nakagawa Masashichi Shoten Hakata-exclusive linen bag, Kayanoya special premium dashi packs, D\u0026DEPARTMENT Kyushu craft lifestyle goods. A 10-story large shopping mall directly connected to JR Hakata Station, gathering numerous high-quality Japanese design brands and lifestyle products. Beyond a rich variety of Japanese fashion select shops, it features special counters promoting local Kyushu craftsmanship and food culture. It is the top choice for buying quality lifestyle goods and local Fukuoka souvenirs all in one place.", "name": "AMU PLAZA Hakata", "transport": "Directly connected to JR Hakata Station"}, {"address": "8-1 Yayoigaoka, Tosu, Saga Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Asics running shoes, Coach classic leather bags, Le Creuset enameled cast iron cookware. Kyushu\u0027s most iconic mega outlet shopping center, designed in a Spanish Colonial architectural style reminiscent of Southern California. Featuring over 170 famous international and Japanese brands offering highly attractive discounts. A daily direct bus operates straight to the entrance from Hakata Bus Terminal, making it perfect for a dedicated half-day shopping spree.", "name": "Tosu Premium Outlets", "transport": "Approx. 45 minutes by direct highway bus from Hakata Bus Terminal"}, {"address": "1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: BOTEJYU Hakata-exclusive sandwich cookies, CLUB HARIE freshly baked Baumkuchen, Hakata Mentaiko special gift boxes. A classic department store inside the Hakata Station building. Its B1 food hall and souvenir hall gather the most comprehensive selection of local specialties and exquisite desserts from across Kyushu. The basement floor also features a tax-refund counter convenient for foreign tourists. Offering everything from luxury designer labels to popular Japanese fashion brands, it delivers excellent service steeped in local flavor.", "name": "Hakata Hankyu Department Store", "transport": "Directly connected to the Hakata Exit of JR Hakata Station"}, {"address": "1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Yamaguchi Aburaya Fukutaro Mentaiko Crackers (Menbei), Shoboyan special Mentaiko sauce, Hakata Torimon. A local specialty shopping area on the 1st floor of Hakata Station, featuring the highest density of Fukuoka souvenirs. It brings together dozens of long-established Fukuoka shops and local brands, offering freshly made mentaiko products, traditional Hakata dolls, and Japanese sweets (wagashi). Both locals and tourists love shopping here for authentic Hakata specialties.", "name": "Ming Hakata Station Shopping Mall", "transport": "Directly connected on the 1st floor inside JR Hakata Station"}, {"address": "9-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Surugaya exclusive anime figures, Rilakkuma Store Hakata-limited plushies, Uniqlo flagship store exclusive apparel. A shopping complex developed by Japan Post, directly connected to the Hakata Exit of Hakata Station. Floors house large-scale anime merch store Surugaya, affordable fashion brands, and trendy lifestyle goods rich in local charm. The basement food street and upper-floor dining halls feature many famous local Fukuoka restaurants, offering an exceptional shopping and dining experience.", "name": "KITTE Hakata", "transport": "About a 1-minute walk from the Hakata Exit of JR Hakata Station"}, {"address": "6-23-1 Takeshita, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: GUNDAM SIDE-F limited 1/144 Gundam models, WORKMAN Plus extreme functional jackets, JINS collaboration eyewear. A large commercial complex opened in 2022, just a short ride from Hakata Station. Standing at the entrance is a life-sized 1:1 scale RX-93\u03bd Gundam statue. Inside features Kyushu\u0027s largest toy and anime section, alongside numerous affordable Japanese fashion and outdoor gear brands, combining great entertainment with incredible shopping value.", "name": "Mitsui Shopping Park LaLaport Fukuoka", "transport": "Take the JR Kagoshima Main Line from JR Hakata Station to \u0027Takeshita Station\u0027 and walk about 9 minutes, or take a direct bus from Hakata Station for about 20 minutes"}, {"address": "JR Hakata City 1F-5F, 1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Kyushu local Hasami-yaki exquisite tableware, Kyushu-exclusive planner stickers and stationery, artisan handcrafted skincare products. Occupying multiple floors of AMU PLAZA Hakata, it places a strong emphasis on showcasing local Kyushu crafts and lifestyles. In addition to a rich array of Japanese stationery and cosmetics, it features exclusive sections highlighting handmade creative products and stylish goods by local Kyushu artisans\u2014making it a fantastic spot to discover culturally authentic, high-quality lifestyle items.", "name": "Hands Hakata", "transport": "Directly connected to JR Hakata Station (located inside AMU PLAZA)"}, {"address": "1-2 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Francfranc stylish home goods, JUMP SHOP Shonen anime merchandise, Matsumotokiyo Canal City-exclusive cosmetics sets. A massive, comprehensive shopping complex about a 10-minute walk from Hakata Station, featuring a canal running through the complex with regular dancing water fountain shows. With over 200 brand stores\u2014including affordable Japanese lifestyle items, trendy fashion, and Kyushu\u0027s largest themed anime merchandise section\u2014it is one of the most iconic and versatile shopping paradises around Hakata Station.", "name": "Canal City Hakata", "transport": "About a 10-12 minute walk from JR Hakata Station Hakata Exit, or a 2-minute walk from \u0027Kushida Shrine Station\u0027 on the Nanakuma Subway Line"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Hakata Station Area"}, "itoshima": {"categories": {"cat_1": {"items": [{"address": "3757 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Natural Sea Salt Hydration Facial Soap, Coarse Sea Salt Body Scrub. Located by the Itoshima coast, this famous salt workshop extracts salt from crystal-clear local seawater using traditional vertical salt field methods, creating a line of all-natural sea salt skincare products. Rich in minerals, their sea salt facial soap leaves skin smooth and supple without feeling tight, making it a favorite among natural and organic beauty lovers.", "name": "Mataichi no Shio Handmade Sea Salt Beauty Products", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station to \u0027Keya\u0027 stop, then walk about 20 minutes or take a taxi."}, {"address": "567-1 Hatae, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Pure Itoshima Camellia Seed Oil, Natural Bamboo Charcoal Oil-Control Facial Soap. Ito Saisai boasts the highest sales volume among direct farm-to-table markets in Japan. Its local cosmetics corner brings together natural beauty products made by local Itoshima farmers and workshops. The pure, additive-free natural camellia hair and skin oils are highly recommended\u2014a representative hidden gem of Kyushu beauty products.", "name": "Ito Saisai Local Botanical Cosmetics Corner", "transport": "About a 15-minute walk from JR Hatae Station, or a 10-minute bus ride from JR Chikuzen-Maebaru Station."}, {"address": "12-1 Shima Hatsusu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: KANEBO Milano Collection Limited Face Powder, Shiseido ELIXIR Superieur Sleeping Gel Pack. Originating in Kyushu, COSMOS is a popular discount drugstore chain known for affordable prices and a vast selection. Conveniently located on the main route to the Itoshima coast, the Shima store offers a wide variety of hit Japanese cosmetics and drugstore items along with tax-free shopping, making it a hit with tourists.", "name": "Drug Cosmos Shima Store", "transport": "Drive from JR Chikuzen-Maebaru Station, or take the Showa Bus to \u0027Shima Chosha-mae\u0027 stop and walk about 3 minutes."}, {"address": "1415-1 Shima Kishi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-buy list: 100% Pure Wild Camellia Hair Oil, Camellia Moisturizing Lip Balm. Surrounded by Itoshima\u0027s rich coastal ecosystem, this independent workshop specializes in beauty products made from locally pressed wild camellia oil. The oil is easily absorbed by skin and hair, offering deep nourishment without synthetic fragrances. They also offer hands-on lip balm making workshops.", "name": "Itoshima Camellia Beauty Workshop", "transport": "Take the Showa Bus Keya Line from JR Chikuzen-Maebaru Station to \u0027Kishi\u0027 stop, then walk about 8 minutes."}, {"address": "1-1-1 Hataestation Minami, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Minon Amino Moist Mask, SANA Nameraka Honpo Soy Milk Whitening Emulsion. Drug Eleven is one of Kyushu\u0027s premier local drugstore chains, carrying major Japanese cosmetics brands and pharmaceuticals. Bright and spacious, the Hatae branch features many Kyushu-exclusive skincare items and popular Japanese cosmetics, making it a top choice for stocking up on beauty supplies during your trip to Itoshima.", "name": "Drug Eleven Hatae Store", "transport": "Located right outside the South Exit of JR Hatae Station."}, {"address": "5437 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Organic Lavender Essential Oil Handmade Soap, Chamomile Repairing Hand Cream. Nestled near the scenic coast of Itoshima, this herbal cosmetics boutique grows its own organic herbs to distill hydrosols and essential oils, handcrafted together with natural botanical oils into skincare. Emitting gentle, natural herbal aromas with mild, clean ingredients, it is a highly sought-after artisanal beauty brand among female travelers visiting Itoshima.", "name": "Itoshima Herb \u0026 Botanical Cosmetics Herba", "transport": "About a 20-minute drive from JR Chikuzen-Maebaru Station, or take the Nogita Line bus to \u0027Sakurai\u0027 stop and walk about 10 minutes."}, {"address": "1-1-5 Urashi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Curel Intensive Moisture Facial Cream, Canmake Marshmallow Finish Powder. Drugstore Mori is a well-established chain drugstore and supermarket in Kyushu, famous for its great value and comprehensive selection. Situated between downtown Maebaru and the coastline, this branch offers popular cosmetics brands alongside dermo-cosmetic products and trusted local items in a very convenient shopping environment.", "name": "Drugstore Mori Itoshima Maebaru Store", "transport": "About a 10-minute walk from JR Hatae Station, or a 5-minute drive from JR Chikuzen-Maebaru Station."}, {"address": "2461 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.8 stars | Must-buy list: Natural Beeswax Lip Balm, Wildflower Honey Moisturizing Handmade Soap. Tucked away between the hills and coast of Itoshima, this honey workshop uses pesticide-free wildflower honey and pure beeswax to craft all-natural skincare products. The beeswax lip balm offers incredible nourishment and moisture retention, while the handmade soap leaves skin deeply hydrated. A must-buy local specialty souvenir when visiting Itoshima.", "name": "Itoshima Honey \u0026 Beeswax Beauty Workshop", "transport": "Take the Showa Bus Nogita Line from JR Chikuzen-Maebaru Station to \u0027Nogita\u0027 stop, then walk about 12 minutes."}], "name": "Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1037-1 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: HIGHTIDE outdoor waterproof canvas tote bag, Itoshima limited edition graphic T-shirt, lightweight multifunctional pouch. A minimalist select shop located near Keya Beach in Itoshima, created by the famous Fukuoka stationery and lifestyle brand HIGHTIDE. The store brings together clothing, shoes, bags, and outdoor gear infused with coastal lifestyle aesthetics, featuring a scenic outdoor coffee deck outside. Its classic canvas bags and storage accessories combine water-repellent functionality with Japanese aesthetic texture, making it a favorite among hipsters and outdoor enthusiasts visiting Itoshima.", "name": "HIGHTIDE STORE ITOSHIMA", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station to \u0027Keya\u0027 stop, then walk about 5 minutes."}, {"address": "5456 Shima Sakurai, Itoshima City, Fukuoka Prefecture (Inside PALM BEACH THE GARDENS)", "feature": "\u2b50 4.4 stars | Must-Buy List: Hey\u0026Ho original graphic ocean T-shirt, Hasami ware pattern canvas bag, coastal woven sun hat. Located within the popular PALM BEACH THE GARDENS in Itoshima, this select shop is known for its vibrant and colorful beach casual style. Alongside famous Hasami ceramics, the store exclusively sells cotton T-shirts, canvas shoes, and bags infused with Itoshima\u0027s wave and sunshine motifs. Comfortable and breathable, it\u0027s a stylish clothing and accessory shop you shouldn\u0027t miss during your coastal trip.", "name": "Hey\u0026Ho! Itoshima", "transport": "Take the Showa Bus (Nishinoura Line) from JR Kyudaimaeragakuentoshi Station to \u0027PALM BEACH\u0027 stop, right at the destination."}, {"address": "708-1 Tomari, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: DURAM handmade vegetable-tanned leather crossbody bag, minimalist genuine leather long wallet, handcrafted leather key pouch. Tucked away amidst the lush greenery of Itoshima, this is a workshop and direct store of a renowned handmade leather brand. The brand insists on using natural vegetable-tanned leather, hand-stitched by local artisans. Designed with warmth and practicality in mind, the leather develops a unique, rich patina over time. Their textured leather bags, footwear, and accessories are highly favored by quality-conscious shoppers.", "name": "DURAM FACTORY Itoshima", "transport": "About an 8-minute taxi ride from JR Hatae Station, or drive directly."}, {"address": "6-1 Shima Hatsusu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural pure linen loose dress, hand-woven hemp crossbody bag, cotton-linen blend bucket hat. A natural-style clothing and lifestyle accessory store nestled in the peaceful countryside of Itoshima. Focusing on comfortable apparel crafted from natural linen and pure cotton, its elegant and breezy style perfectly complements Itoshima\u0027s relaxed pace. Additionally, the woven straw bags, handmade linen totes, and wooden accessories on display showcase exceptional craftsmanship, making it a shopping paradise for fans of forest-style fashion.", "name": "Asa to Ki to... Itoshima", "transport": "Take the Showa Bus (Hatsu Line) from JR Chikuzen-Maebaru Station to \u0027Hatsu\u0027 stop, then walk about 3 minutes."}, {"address": "2196 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: SUNSET classic print surf windbreaker, Itoshima Sunset collaboration boardshorts, vintage American canvas beach bag. Attached to the famous Sunset Cafe near Futamigaura Couple Stones, this apparel select store is filled with American West Coast surf and resort vibes. Featuring its house-brand casual surfwear, sun-protective beach shoes, and versatile waterproof bags, all designs radiate sunshine and ocean energy, making it a must-visit coastal boutique for surfers and travelers.", "name": "Beach Store SUNSET", "transport": "Take the Showa Bus from JR Kyudaimaeragakuentoshi Station to \u0027PALM BEACH\u0027 stop, then walk about 10 minutes."}, {"address": "2241-1 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: RUSTIC vintage handmade full-grain leather handbag, hand-stitched leather shoes, stylish leather cardholder. A private l
