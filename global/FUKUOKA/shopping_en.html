eather workshop located near the Nogita coastline. Driven by a passion for leathercraft, the artisan carefully handcrafts each leather bag and pair of shoes to order or in small batches. The leather is sturdy and ages beautifully over time. Blending vintage workwear aesthetics with clean modern lines, it attracts many visitors to Itoshima looking to order custom, one-of-a-kind leather footwear and bags.", "name": "Itoshima Leather Workshop RUSTIC", "transport": "About a 20-minute taxi ride from JR Chikuzen-Maebaru Station, or drive via Prefectural Route 260."}, {"address": "882 Kawatsuki, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Itoshima natural indigo-dyed cotton scarf, organic cotton handmade tote bag, traditional woven straw slip-ons. Renovated from a historic kominka (traditional Japanese house), Ito Aguri features not only a famous traditional restaurant but also a curated select corner showcasing textiles and fashion accessories made by local Itoshima artisans. Highlighting indigo-dyed shawls colored with local botanical dyes, pure cotton apparel, and handwoven bags, its natural materials and artisanal warmth make it a fantastic spot to find unique, high-quality local accessories.", "name": "Ito Aguri Select Corner", "transport": "About a 10-minute taxi ride from JR Misakigaoka Station, or drive directly (free parking available)."}, {"address": "3-18-18 Maebaru Chuo, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Cocon handmade patchwork crossbody bag, Nordic print cotton-linen tote, handcrafted fabric clasp pouch. A charming workshop shop located near the Maebaru district in Itoshima, specializing in handcrafted fabric shoes, bags, and lifestyle items. The owner carefully selects high-quality Japanese cotton and linen fabrics, crafting visually appealing and durable totes and fabric shoes with unique patchwork designs. Each fabric bag is produced in limited quantities, making them unique and rare to see elsewhere. The cozy atmosphere of the store allows visitors to feel the genuine warmth of handmade craftsmanship and Itoshima charm.", "name": "Kobo Cocon Itoshima", "transport": "About a 7-minute walk from the North Exit of JR Chikuzen-Maebaru Station."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "3757 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Flower Salt Caramel Pudding, Special Herb Salt, Pyramid Sea Salt. Located at the westernmost tip of the Itoshima Peninsula on Mount Tateishi Cape, this workshop boasts breathtaking ocean views and traditional salt pans. The star attraction is their Kyushu-famous \u0027Flower Salt Caramel Pudding\u0027, combining crunchy salt flakes skimmed during the salt-making process with rich caramel\u2014creating an unforgettable sweet-and-salty flavor. Visitors can also purchase pure hand-extracted sea salt and flavored seasonings, making it a top Itoshima landmark combining stunning scenery and culinary delights.", "name": "Mataichi no Shio Koubou Tottan (Salt Workshop Tottan)", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus to \u0027Keya\u0027 stop, then transfer to a taxi or walk for about 30 minutes. Driving is recommended."}, {"address": "567-1 Hatae, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Dried Hakata Amaou Strawberries, Himeshima Sea Urchin Paste, Ito Monogatari Fresh Milk Yogurt. Ranking #1 in sales among all farmers\u0027 markets in Japan, this center brings together the finest products from hundreds of local farmers and artisans across Itoshima. The market offers an overwhelming variety of fresh local ingredients and unique snacks. Highlights include dried strawberries and sea urchin paste made from premium local ingredients, as well as rich, smooth Ito Monogatari dairy products. It\u0027s not only the go-to spot for locals but also the ultimate shopping haven for tourists looking for authentic Itoshima souvenirs and snacks.", "name": "Ito Saisai Farmers Market", "transport": "About a 15-minute walk from JR Hatae Station, or drive (large dedicated parking lot available)."}, {"address": "1442 Motooka, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Sake Lees Steamed Buns (Sake Manju), Craft Amazake Drinks, Ginjo Sake Lees Black Curry Packs. Established in the Meiji era, this century-old brewery seamlessly blends traditional sake brewing with modern craft beer techniques. Beyond its acclaimed local sakes, the onsite confectionery workshop infuses sake lees into various specialty foods. The piping hot \u0027Sake Lees Steamed Buns\u0027 are soft, fluffy, and richly aromatic\u2014a must-buy signature snack. Non-alcoholic healthy amazake and unique curry packets are also top choices for gifts or personal enjoyment.", "name": "Suginoya Brewery (Hamachi Sake Brewery)", "transport": "From JR Kyudai-Gakkentoshi Station, take the Showa Bus to \u0027Motooka\u0027 stop, then walk for about 5 minutes."}, {"address": "1986 Hon, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Tanaka Rokugo Junmai Sake, Shiraito Special Sake Lees Crackers, Yamada Nishiki Rice Crackers. With a history spanning over a century, this iconic Fukuoka brewery still insists on using the traditional wooden beam press method (Hanegi-shibori). Their signature sake, \u0027Tanaka Rokugo\u0027, is brewed from high-quality local Yamada Nishiki rice, delivering a crisp and smooth flavor profile. Their sake lees crackers and rice crisps\u2014crafted from premium brewing rice and lees\u2014are crispy, delicious, and subtly infused with rice and sake aromas, making for truly unique local gifts.", "name": "Shiraito Sake Brewery", "transport": "About a 15-minute taxi ride from JR Chikuzen-Maebaru Station; driving is recommended."}, {"address": "2241-6 Shima Hatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: German-style Handmade Sausages, Smoked Pork Ribs, Specialty Pork Rillettes/Spread. Tucked away in the lush greenery of Itoshima\u0027s countryside, this artisanal ham shop adheres to authentic German recipes, using carefully selected fresh local pork for curing and smoking. Free from unnecessary chemical additives, their sausages and hams are firm, juicy, and rich in flavor, having won numerous international gold medals. Beautifully packaged frozen boxes and vacuum packs are perfect to enjoy back at your hotel or as gourmet snacks paired with drinks during your trip.", "name": "Itoshima Tezukuri Ham (Handmade Ham)", "transport": "About a 10-minute taxi ride from JR Chikuzen-Maebaru Station."}, {"address": "372-1 Shima Funakoshi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Naturally Brewed Barrel-Aged Soy Sauce, Premium Ponzu Soy Sauce, Soy Sauce Rice Crackers. Located near the Itoshima coastline, Hokui Shoyu continues to preserve the traditional method of natural fermentation using century-old cedar barrels. The resulting soy sauce is rich, mellow, subtly sweet, and smooth, perfectly enhancing the flavors of seafood and local ingredients. Their uniquely developed soy sauce rice crackers and seasoned sauces are highly praised by Japanese foodies, making them exceptional gifts for cooking enthusiasts and lovers of traditional artisanal flavors.", "name": "Hokui Shoyu (Hokui Soy Sauce)", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus (Funakoshi Line) to \u0027Funakoshi\u0027 stop, then walk for about 3 minutes."}, {"address": "7-2 Shima Kishi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Aged Gouda \u0027COCCO\u0027, Itoshima Fresh Marinated Cheese, Cheese Biscuits. Founded by a cheesemaker who honed his craft in Denmark, TAK uses only fresh, high-quality local milk from Itoshima. Their cheeses feature delicate textures and rich dairy aromas, artfully combining Nordic cheesemaking techniques with local ingredients. In addition to various freshly sliced aged cheeses, their signature savory-sweet cheese biscuits are a wildly popular souvenir\u2014crispy, rich, and sophisticated.", "name": "TAK Itoshima Natural Cheese", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus to \u0027Kishi\u0027 stop, then walk for about 5 minutes."}, {"address": "30-1 Shima Hatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Itoshima Coast Special Blend Drip Bags, House-Roasted Single-Origin Coffee Beans, Dark Roast Coffee Artisanal Cookies. Tucked away in the quiet countryside of Itoshima, this renowned specialty coffee roaster features vintage roasters and warm, sunlit interiors. The owner carefully selects premium green beans from around the world to roast in-house. Their exclusive \u0027Itoshima Blend\u0027 delivers gentle fruity notes and a smooth sweet finish. Beautifully packaged drip coffee bags and homemade cookies crafted to pair with coffee make delightful gifts for coffee lovers.", "name": "Petani Coffee", "transport": "About a 10-minute taxi ride from JR Chikuzen-Maebaru Station."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "1-2-1 Kitahara, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Fukuoka Mentaiko Crackers, Ito Monogatari Fresh Milk Yogurt, Can Do 100-yen lifestyle goods. Located at the main gateway to the Itoshima coastline, this is the largest comprehensive shopping mall in the Itoshima area. It features a large supermarket, Japanese drugstores, brand apparel, and local specialty zones, making it the best spot to stock up on supplies and buy local Fukuoka souvenirs before heading to the scenic coastal area.", "name": "AEON MALL Fukuoka Ito", "transport": "Directly connected to JR Chikuhi Line \u0027Kyudai-Gakkentoshi Station\u0027, about 1 minute walk"}, {"address": "2805-1 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Itoshima wave leather bracelets, seaside handmade woven bags, SURF SIDE original pattern mugs. Situated right on the front line of Futamigaura Couple Stones coast in Itoshima, this signature coastal commercial complex features several boutique shops showcasing local beach style, apparel, handicrafts, and lifestyle goods. Built in a Mediterranean white aesthetic, it offers breathtaking blue ocean views while you shop.", "name": "PALM BEACH THE GARDENS Coastal Shopping Plaza", "transport": "Take the Showa Bus \u0027Itoshima Sunset Line\u0027 and get off at \u0027PALM BEACH\u0027 station"}, {"address": "2-12-30 Odo, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Mont-bell outdoor windbreakers, BEAMS discounted men\u0027s fashion, adidas sneakers. As Kyushu\u0027s most iconic waterfront outlet center, it is just a short drive from the Itoshima coastal area. Hosting over a hundred famous international and domestic Japanese brands, it attracts numerous shoppers with unbeatable discounts on outdoor gear and casual wear.", "name": "Marinoa City Fukuoka Outlet", "transport": "Take the Showa Bus towards \u0027Marinoa City\u0027 from the South Exit of JR Meinohama Station (approx. 15 minutes)"}, {"address": "882 Kawatsuki, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Itoshima Amazake specialty sauce, Ito handmade egg pudding, local culture ceramic ware. Housed in a renovated century-old former agricultural association building, this local independent lifestyle and craft select shop exudes a charming Showa retro vibe. Bringing together local farm produce, artisan handicrafts, and exclusive gourmet treats, it is a hidden gem for experiencing local Itoshima culture and finding quality gifts.", "name": "Ito Aguri (Historic Agricultural Association Select Shop)", "transport": "About a 10-minute drive from JR Hatae Station, or take the Itoshima City Community Bus to \u0027Kawatsuki\u0027 station"}, {"address": "284 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: SUNSET original sunset print T-shirts, Itoshima sea salt scented candles, surf-style sterling silver jewelry. Located along the famous Itoshima Sunset Road, this is an iconic local beach-style select shop featuring apparel and home goods. Offering coastal clothing and tasteful home decor designed by local artists, it is a favorite among travelers who love the ocean and laid-back lifestyle.", "name": "SUNSET SHOP Coastal Lifestyle \u0026 Select Shop", "transport": "About a 20-minute drive from JR Chikuzen-Maebaru Station, or take the coastal sightseeing bus to \u0027Futamigaura\u0027 station"}, {"address": "3-18-18 Maebaru Chuo, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Itoshima-yaki ceramic tableware, natural indigo-dyed linen scarves, handcrafted wooden butter knives. This highly representative local independent lifestyle store brings together creations from dozens of local Itoshima artists and craftsmen. From refined ceramics and woodwork to naturally dyed textiles, it perfectly captures Itoshima\u0027s unique slow-life aesthetic.", "name": "Itoshima Kurashi no Kura (Artisan Lifestyle Store)", "transport": "About a 6-minute walk from the North Exit of JR Chikuhi Line \u0027Chikuzen-Maebaru Station\u0027"}, {"address": "30 Shima Hatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Durable Itoshima cedar cutting boards, local wooden fragrance essential oils, exquisite handmade wooden coasters. Utilizing locally sourced Itoshima cedar and natural materials, this independent store displays and sells warm, rustic wooden furniture and daily homeware. Crafted by local wood artisans, these pieces radiate a subtle woody aroma, making them unforgettable quality souvenirs from the Itoshima coast.", "name": "Heya no Kura Itoshima (Woodcraft \u0026 Local Specialties)", "transport": "Take the Showa Bus from JR Chikuzen-Maebaru Station to \u0027Hatsu\u0027 bus stop, about 3 minutes walk"}, {"address": "8-1 Yayoigaoka, Tosu City, Saga Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Le Creuset enamelled cast iron cookware, Asics running shoes, Coach classic leather wallets. Located about a one-hour drive from the Itoshima coast, this popular regional outlet center is designed in a Southern Californian Spanish Colonial style. Housing over 170 top international luxury brands and popular Japanese labels with steep discounts, it is a highly recommended shopping paradise for visitors on a self-drive trip around the Itoshima area.", "name": "Tosu Premium Outlets", "transport": "Take a direct route bus from JR Tosu Station (approx. 15 minutes), or drive via Nishi-Kyushu Expressway and Nagasaki Expressway"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Itoshima Vicinity Coastal Scenic Area"}, "momochi": {"categories": {"cat_1": {"items": [{"address": "1F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.5 stars | Must-Buy List: Fukuoka-exclusive strawberry extract hydrating mask, Kyushu natural horse oil repair balm, Oga exclusive Kanpo warm health patch. Oga Pharmacy is a leading local drugstore chain founded in Fukuoka over half a century ago, deeply trusted by Kyushu residents. Located in the large shopping center next to the Dome, this branch features a special zone for Kyushu local skincare products, turning local specialties like Fukuoka Amaou strawberries and citrus into hydrating cosmetics. It\u0027s the premier spot to pick up skincare items packed with local memories.", "name": "Oga Pharmacy MARK IS Fukuoka Momochi", "transport": "About a 3-minute walk from Nishitetsu Bus \u0027PayPay Dome-mae\u0027 stop"}, {"address": "2-1-22 Momochi, Sawara-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.4 stars | Must-Buy List: ON365 high-potency watery sunscreen lotion, Kyushu camellia deep nourishing hair oil, Shiseido exclusive collaboration anti-aging serum. Cosmos Drug is a mega-discount drugstore giant born in Kyushu, famed for its exceptional value and extensive product selection. Located near the Momochihama coastal area, the Momochi branch offers a spacious shopping environment reminiscent of a large supermarket. It stocks a wide array of Kyushu-exclusive skincare brands and its own high-quality private-label products, making it a secret sanctuary for locals and savvy travelers to stock up on cosmetics and medicines.", "name": "Cosmos Drug Momochi", "transport": "About a 2-minute walk from Nishitetsu Bus \u0027Momochi Junior High School-mae\u0027 stop"}, {"address": "4-8-32 Nishijin, Sawara-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.3 stars | Must-Buy List: Kyushu-exclusive Kumamoto horse oil hand cream, ultra-hydrating soy milk skin mask, Elegance department store tier makeup samples. Drug Eleven is an iconic powerhouse drugstore chain in Kyushu. The Nishijin branch is located right next to the Momochihama shopping district, offering a rich selection of domestic Japanese cosmetics, pharmaceuticals, and high-end beauty brands. The store frequently runs exclusive promotions for local customers, with clearly labeled skincare sections and fast product turn-overs, making it perfect for travelers looking to discover trending seasonal items and local bestsellers.", "name": "Drug Eleven Nishijin", "transport": "About a 2-minute walk from Exit 2 of Subway Kuko Line \u0027Nishijin Station\u0027, or a 7-minute bus ride from Fukuoka Tower"}, {"address": "1F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.2 stars | Must-Buy List: matsukiyo gentle high-moisture sunscreen spray, ARGELAN organic botanical lip balm, EXUSIA ultimate anti-wrinkle whitening essence. This large branch of Matsumoto Kiyoshi, Japan\u0027s leading drugstore chain, is located in MARK IS next to the Dome. Bright, spacious, and well-stocked, it features major beauty brands and pharmaceuticals, as well as its top-selling exclusive private label matsukiyo and organic skincare series. It also offers convenient duty-free services and Chinese-language assistance tailored for overseas tourists.", "name": "Matsumoto Kiyoshi MARK IS Fukuoka Momochi", "transport": "Get off at Nishitetsu Bus \u0027PayPay Dome-mae\u0027 or \u0027Kyushu Medical Center\u0027 stop"}, {"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.4 stars | Must-Buy List: LIPS \u0026 HIPS sakura fragrance hand cream, DAZZSHOP watery shimmer eyeshadow jelly, DUO deep cleansing balm. Highly popular among Japanese women, this chic beauty select shop boasts a romantic and elegant interior decor. Unlike standard drugstores, it focuses on cosmetics recommended by trendy Japanese magazines, niche indie beauty products, and luxury fragrances. Fully equipped with testers, it allows you to gracefully explore the latest beauty trends after watching a Dome game or visiting Fukuoka Tower.", "name": "Ainz \u0026 Tulpe MARK IS Fukuoka Momochi", "transport": "About a 12-minute walk from Exit 3 of Subway Kuko Line \u0027Tojinmachi Station\u0027"}, {"address": "2F, MARK IS Fukuoka Momochi, 2-2-1 Jigyohama, Chuo-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.3 stars | Must-Buy List: Excel earth tone quad eyeshadow palette, Canmake Glow Fleur Cheeks, Rosette sea clay pore cleansing facial wash. Shop in is an iconic Japanese shop for trendy cosmetics and accessories, acting as a bellwether for Japanese makeup trends. The counter in MARK IS curates newly launched Japanese drugstore cosmetics and trending Korean skincare products. The energetic display layout features detailed and thoughtful review notes next to each product, making it a fantastic spot to ures of body scrubs and body lotions in person.", "name": "\u30b6\u30dc\u30c7\u30a3\u30b7\u30e7\u30c3\u30d7 \u30ad\u30e3\u30ca\u30eb\u30b7\u30c6\u30a3\u535a\u591a\u5e97 (THE BODY SHOP Canal City Hakata)", "transport": "Approx. 3-minute walk from Kushida Shrine Station on the Fukuoka City Subway Nanakuma Line"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2F South Building, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Embroidered Sukajan (Souvenir jacket), Japanese-pattern denim pants, Ukiyo-e graphic tees. A must-visit specialty clothing store for Japanese trendsetters and vintage lovers, specializing in seamlessly blending traditional Japanese motifs with street fashion. The store is filled with exquisitely embroidered dragon, phoenix, and cherry blossom Sukajan jackets that offer stylish cuts with rich Oriental charm\u2014a huge hit among local youth and international tourists alike.", "name": "METHOD Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}, {"address": "2F Center Walk, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: TANKER Nylon Crossbody Bag, 3WAY Business Backpack, FREESTYLE Long Wallet. The official store of Japan\u0027s legendary Yoshida Porter, specializing in Japanese-made bags known for exceptional durability and practical storage. The Canal City Hakata branch carries an extensive lineup\u2014from the iconic sage green TANKER series to premium leather bags\u2014making it a go-to spot for Japanese bag enthusiasts.", "name": "KURA CHIKA by PORTER Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}, {"address": "2F Center Walk, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: American Heavyweight Oversized Tee, Collaboration Military Jacket, Japanese-cut Wide-leg Trousers. A quintessential Japanese select shop featuring a seamless blend of American vintage and Japanese casual style. Local youth love coming here for limited-edition collaboration pieces and sleek relaxed-fit items. With its tasteful selection, you can effortlessly create stylish, casual layered looks.", "name": "FREAK\u0027S STORE Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}, {"address": "B1F, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Chunky-heeled Loafers, Cushioned Flat Shoes, Patchwork Ankle Boots. An immensely popular local women\u0027s footwear brand known for affordability, high comfort, and a wide range of sizes (22cm to 26cm). Designed with extra plush memory foam insoles that prevent tired feet during long days of walking around Japan, it\u0027s a top choice for local Fukuoka office workers and students alike.", "name": "ORiental TRaffic Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}, {"address": "10-241 Kamikawabatamachi, Hakata-ku, Fukuoka City, Fukuoka Prefecture (inside Kamikawabata Shopping Street)", "feature": "\u2b50 4.6 stars | Must-Buy List: Hakata-ori Silk Ties, Hakata-ori Business Card Holders, Japanese-style Tote Bags. A specialty boutique preserving Fukuoka\u0027s century-old traditional craft of \u0027Hakata-ori\u0027 silk weaving, reimagined as modern fashion accessories. The silk ties feature a unique luster and firm knotting, while card cases and totes showcase master craftsman spirit\u2014making this Fukuoka\u0027s premier destination for iconic local luxury accessories.", "name": "Hakata-ori Sanui Textile Kawabata Store", "transport": "Approx. 2-minute walk from Exit 5 of Nakasu-Kawabata Station on the Kuko Subway Line"}, {"address": "5-112 Kamikawabatamachi, Hakata-ku, Fukuoka City, Fukuoka Prefecture (inside Kawabata-dori Shopping Street)", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Paulownia Geta, Traditional Zori Sandals, Furoshiki Fabric Tote Bags. A historic traditional footwear and bag shop located inside Kawabata-dori Shopping Street. To this day, master artisans fit and adjust the hanao (straps) of Geta wooden clogs on the spot for a perfectly comfortable fit. Alongside traditional kimono footwear, modern wooden clogs and embroidered fabric bags are also hugely popular.", "name": "Masuya Footwear Store", "transport": "Approx. 3-minute walk from Exit 5 of Nakasu-Kawabata Station on the Kuko Subway Line"}, {"address": "2F Center Walk, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Linen Blend Casual Shirts, Japanese Embroidered Baseball Caps, Multi-pocket Cargo Skirts. A popular apparel store emphasizing cozy Japanese family aesthetics and effortless casual style. Featuring soft natural cotton and linen fabrics with gentle colors and relaxed cuts, it offers versatile options for adults alongside matching family outfits\u2014a highly recommended go-to for local families and hipster shoppers.", "name": "CIAOPANIC TYPY Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}, {"address": "B1F Center Walk, Canal City Hakata, 1-2 Sumiyoshi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Control Bear Graphic Tee, Embroidered Casual Hoodie, Patterned Canvas Tote Bag. A renowned Japanese graphic apparel brand celebrated for its playful, artistic illustration designs. The spacious Canal City location carries a wide variety of clothes and bags featuring collaborations with Japanese picture books, anime, and artists. Vibrant and unique, it\u0027s a favorite among trendsetters looking to avoid cookie-cutter styles.", "name": "Design Tshirts Store graniph Canal City Hakata", "transport": "Approx. 3-minute walk from Kushida Jinja-mae Station on the Nanakuma Subway Line"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "2-6-10 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy: Classic Original Seasoned Mentaiko, Canned Oil-Marinated Mentaiko (Tubu Tubu Mentai), Mentaiko Rice Crackers. This is the birthplace of Japanese mentaiko! Founder Toshio Kawahara developed the very first mentaiko here. The Nakasu main store offers the most complete selection of marinated mentaiko products, ranging from various spice levels to canned mentaiko perfect for pairing with rice. It is one of Hakata\u0027s most iconic and top-tier souvenir choices.", "name": "Fukuya Nakasu Main Store", "transport": "Approx. 4-minute walk from Exit 1 of Nakasu-Kawabata Subway Station"}, {"address": "12-20 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy: Suzuno Monaka (bell-shaped monaka wafer), Suzuno Kusamochi, Amaou Strawberry Daifuku (Winter limited). Founded in 1923, this top-tier Kyushu traditional confectioner (wagashi) has its flagship store in Nakasu-Kawabata. Their signature bell-shaped mini \u0027Suzuno Monaka\u0027 features a crispy, aromatic wafer filled with smooth, perfectly balanced red bean paste. Wrapped in elegant bamboo baskets, it\u0027s considered by Hakata locals as the ultimate prestigious gift.", "name": "Suzukake Main Store", "transport": "Directly connected to Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "2-1 Suzakimachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy: Tsurunoko (marshmallow filled with egg yolk paste), Kenjo Tsurunoko, Iwai Mochi. A century-old Hakata confectionery shop and the birthplace of Japan\u0027s \u0027White Day\u0027. Their signature product \u0027Tsurunoko\u0027 features a snowy-soft marshmallow exterior filled with rich, sweet egg yolk paste, delivering a unique texture steeped in history. The newly renovated main store beautifully blends traditional Japanese aesthetic with modern elegance.", "name": "Ishimura Manseido Main Store", "transport": "Approx. 3-minute walk from Exit 7 of Nakasu-Kawabata Subway Station"}, {"address": "6-134 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy: Hakata Mentaiko Rice Crackers (Menbei Original/Spicy), Mentaiko Mayonnaise, Mentaiko Spreads. The specialty shop for \u0027Menbei\u0027, the famous spicy mentaiko crackers popular all across Japan. Made by kneading seafood ingredients and fresh mentaiko into dough before frying, they are intensely crispy and rich in flavor with every bite. Beyond various limited-edition cracker flavors, it\u0027s also a great spot to pick up various mentaiko sauces and seasonings.", "name": "Yamaguchi Aburaya Fukutaro Kawabata Store", "transport": "Approx. 2-minute walk from Exit 5 of Nakasu-Kawabata Subway Station (Inside Kawabata Shopping Street)"}, {"address": "5-104 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy: Hakata Torimon (sweet butter-bean cake), Hakata Yanagimachi Hagakure, Gyokuro Manju. The undisputed king of Fukuoka sweets! Their famous \u0027Hakata Torimon\u0027 fuses buttery Western aromas with traditional Japanese white bean paste, creating a moist, velvety filling that melts in your mouth. A multi-year Monde Selection Gold Award winner, it\u0027s an iconic gift snack every traveler grabs before heading home.", "name": "Meigetsudo Kawabata Store", "transport": "Approx. 3-minute walk from Nakasu-Kawabata Subway Station (Inside Kawabata Shopping Street)"}, {"address": "1F Hakata Riverain Mall, 3-1 Shimokawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-buy: Kayanoya Vegetable Dashi Pouches, Roasted Flying Fish (Ago) Dashi Pouches, Hakata-limited Mentaiko Furikake. Originating from Hisayama Town in Fukuoka, this high-end brand is famous for premium, additive-free seasonings. Their dashi broth packets are immensely popular among Japanese homemakers and tourists alike\u2014simmer for just a few minutes in hot water to create authentic Japanese broth. The spacious Hakata Riverain flagship store also offers a wide array of Kyushu-exclusive seasonings and rice seasonings (furikake).", "name": "Kayanoya Hakata Riverain Store", "transport": "Directly connected to Exit 6 of Nakasu-Kawabata Subway Station (Inside Hakata Riverain Mall)"}, {"address": "11-201 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy: Tsukushi Mochi (mochi with roasted soybean powder \u0026 black honey), Hakata Four Seasons Daifuku, Kuromitsu Kinako Mochi. Josuian is one of Hakata\u0027s most legendary traditional confectionery shops. Their signature \u0027Tsukushi Mochi\u0027 features chewy, soft mochi dusted with fragrant kinako (roasted soybean powder) and drizzled with rich brown sugar syrup. Wrapped in charming little traditional cloth packs, it offers delightful flavors adored by food lovers.", "name": "Josuian Kawabata Store", "transport": "Approx. 2-minute walk from Nakasu-Kawabata Subway Station (Inside Kawabata Shopping Street)"}, {"address": "B1F Canal City Hakata, 1-2 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-buy: Famous Hakata Ramen Gift Boxes (Ichiran / Ikkousha meal kits), Amaou Strawberry Sandwich Cookies, Hakata Mentaiko Potato Chips. A one-stop souvenir shop located inside Canal City Hakata, offering a vast array of packaged foods and snacks from renowned stores across Fukuoka and Kyushu. If you don\u0027t want to visit multiple separate shops, you can get famous ramen kits, strawberry treats, and various mentaiko snacks all in one place here.", "name": "The Hakata Gift Shop (Canal City Store)", "transport": "Approx. 3-minute walk from Kushida Shrine-mae Subway Station (Inside Canal City)"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-2 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Studio Ghibli official merchandise, Sanrio Hakata-exclusive Mentaiko plushies, JUMP SHOP anime-exclusive goods. Fukuoka\u0027s most iconic large-scale shopping and entertainment complex is built around a central canal, featuring hundreds of shops and a spectacular dancing water fountain show. Alongside international fashion brands, it houses the legendary \u0027Ramen Stadium\u0027 with eight famous ramen shops from across Japan\u2014making it an all-in-one destination for shopping, local food, and leisure.", "name": "Canal City Hakata", "transport": "About a 3-minute walk from Kushida Shrine Station on the Nanakuma Subway Line"}, {"address": "8-1 Yayoigaoka, Tosu, Saga Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Classic Coach leather bags, Adidas performance running shoes, Tefal durable non-stick cookware sets. As the largest outlet shopping center in Kyushu, it features sunny, West Coast California-inspired architecture housing over 170 renowned domestic and international brands. With daily direct express buses operating from Hakata and Nakasu, and discounts often reaching up to 70% off, it\u0027s a budget-shopping paradise you can\u0027t miss when visiting Fukuoka.", "name": "Tosu Premium Outlets", "transport": "About a 45-minute ride on the Nishitetsu Direct Express Bus from Hakata Bus Terminal"}, {"address": "3-1 Shimokawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Classic Hakata-ori business card holders, traditional Hakata clay dolls (Hakata Ningyo), local organic handmade skincare products from Kyushu. Situated next to the Kawabata-dori Shopping Street, this upscale cultural and commercial complex blends the Fukuoka Asian Art Museum with refined shopping space. Home to numerous high-end domestic designer brands and artisan craft shops, its quiet, elegant atmosphere makes it the premier choice for sophisticated, culturally rich shopping.", "name": "Hakata Riverain Mall", "transport": "Directly connected to Exit 6 of Nakasu-Kawabata Station on the Subway Kuko and Hakozaki Lines"}, {"address": "Center Walk 2F, Canal City Hakata, 1-2 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade wooden iPhone cases, minimalist walnut fountain pens, customized laser-engraved wooden coasters. Hailing from the Echizen lacquerware region of Japan, this artisan wooden lifestyle brand integrates natural wood into modern everyday items with exquisite craftsmanship. On-site laser engraving service allows customers to pick their favorite wood grain and engrave custom names, creating a truly one-of-a-kind, elegant gift.", "name": "Hacoa DIRECT STORE Canal City Hakata", "transport": "About a 3-minute walk from Kushida Shrine Station on the Nanakuma Subway Line"}, {"address": "6-11 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade Hakata-ori silk scarves, Hakata doll ornaments, traditional Hariko Tiger (papier-m\u00e2ch\u00e9 tiger) good luck charms. An independent shop dedicated to promoting Hakata\u0027s 700-year-old traditional crafts, displaying and selling silk textiles, clay dolls, and artisan crafts made by local master craftsmen. Not only can you purchase top-quality craftsmanship here, but it\u0027s also the best spot to immerse yourself in the essence of authentic Fukuoka tradition.", "name": "Hakata Traditional Craft and Design Museum Shop", "transport": "About a 5-minute walk from Exit 5 of Nakasu-Kawabata Subway Station"}, {"address": "11-8 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-buy list: Hand-painted custom-named mini lanterns, Hakata Gion Yamakasa festival limited decorative lanterns, Japanese washi paper table lamps. Founded in the Meiji era, this century-old traditional lantern shop located in historic Kawabata-dori Shopping Street specializes in making traditional paper lanterns used in the Hakata Gion Yamakasa festival. Preserving precious hand-painting techniques, visitors can purchase exquisite mini washi lanterns as iconic Hakata souvenirs.", "name": "Monden Lantern Shop (Monden Chochin)", "transport": "About a 2-minute walk from Nakasu-Kawabata Subway Station (inside Kawabata-dori Shopping Street)"}, {"address": "12-201 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Premium Hakata-ori men\u0027s ties, silk coin purses, Hakata-ori obi-style tissue covers. A specialty store under \u0027Sanui Orimono\u0027, a historic Hakata-ori weaver with over a century of heritage, specializing in Japan\u0027s nationally designated traditional craft \u0027Hakata-ori\u0027. The fabric is known for its dense warp, springy resilience, firm texture, and subtle sheen. Offering a variety of compact lifestyle goods blending traditional textiles into daily modern use, it\u0027s a favorite among quality-conscious travelers.", "name": "Hakata Ori Kinjin Honpo Sanui", "transport": "About a 3-minute walk from Nakasu-Kawabata Subway Station (inside Kawabata-dori Shopping Street)"}, {"address": "B2F Hakata Riverain, 3-1 Shimokawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Kyushu-exclusive mentaiko lip balm, Taiga Pharmacy collaboration skincare masks, Japanese local herbal wellness remedy packs. Founded in Fukuoka, Taiga Pharmacy is a major local pharmacy chain with nearly a century of deep roots in Kyushu. This Riverain branch boasts a bright, exquisite interior, offering popular Japanese cosmetics as well as locally developed plant-extract skincare and exclusive health products for a warm, locally distinct shopping experience.", "name": "Taiga Pharmacy Hakata Riverain", "transport": "Directly connected to Exit 6 of Nakasu-Kawabata Station on the Subway Kuko Line"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Nakasu, Kawabata and Canal City Hakata"}, "tenjin": {"categories": {"cat_1": {"items": [{"address": "5F Main Building, Fukuoka PARCO, 2-11-1 Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.5 stars | Must-Buy List: Keana Nadeshiko Rice Mask, VT CICA Daily Soothing Mask, FANCL Deep Cleansing Oil. As the physical retail store for Japan\u0027s most authoritative beauty ranking platform, the Fukuoka Tenjin store features an extensive testing area where top-ranked bestseller items are clearly displayed. Here you can find the most complete selection of seasonal trending cosmetics and skincare products, making it an absolute must-visit shopping spot for beauty lovers in Tenjin.", "name": "@cosme STORE Fukuoka PARCO", "transport": "Directly connected to Fukuoka PARCO Main Building 5F via Exit 7 of Tenjin Subway Station"}, {"address": "1F Main Building, Fukuoka PARCO, 2-11-1 Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.4 stars | Must-Buy List: To/one Petal Glow Eyeshadow, F Organics Moisture Lotion, Celvoke Dignified Lips. A specialized Japanese beauty shop focusing on natural, organic cosmetics and botanical skincare, highly loved by ingredient-conscious shoppers and those with sensitive skin. The Tenjin branch brings together top-tier domestic and global organic bath products, makeup, and essential oils in an exquisite environment with professional skin consultations.", "name": "Cosme Kitchen Fukuoka PARCO", "transport": "Directly connected to Fukuoka PARCO Main Building 1F via Exit 7 of Tenjin Subway Station"}, {"address": "East Avenue 4, No. 039, Tenjin Chikagai, Underground 1, 2-Chome Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.6 stars | Must-Buy List: White Tea Eau de Parfum, Sake Lees Essence Serum, Gagome Kombu Mascara. An iconic minimalist, cruelty-free natural beauty brand from Japan. Located in the elegant Tenjin Chikagai (underground shopping mall), its products feature local Japanese ingredients like sake lees, ginger, and kombu. Highly recommended are its White Tea and Soap fragrance lines, offering natural, elegant scents that make it a flagship beauty brand for visitors to Japan.", "name": "SHIRO Tenjin Chikagai", "transport": "Direct access from East Avenue 4, Tenjin Underground Shopping Mall (Tenjin Chikagai)"}, {"address": "East Avenue 2, No. 083, Tenjin Chikagai, Underground 1, 2-Chome Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.5 stars | Must-Buy List: Osmanthus Eau de Parfum, Donkey Milk Hand Cream, Organic Argan Hair Oil. A refined Japanese fragrance and natural skincare brand featuring Japanese aesthetic quality and gentle, natural aromas. The store boasts a warm, retro interior. With extremely mild formulas, their hand creams and perfumes\u2014especially seasonal scents like Osmanthus\u2014are dream items that sell out almost immediately upon release.", "name": "AUX PARADIS Tenjin Chikagai", "transport": "Direct access from East Avenue 2, Tenjin Underground Shopping Mall (Tenjin Chikagai)"}, {"address": "West Avenue 11, Tenjin Chikagai, Underground 3, 2-Chome Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.2 stars | Must-Buy List: Kyushu Limited Horse Oil Ultra-Moisturizing Cream, Shiseido ELIXIR Capsules, DHC Lip Cream. A time-honored local drugstore chain deeply rooted in Western Japan, centrally located in Tenjin Chikagai. Compared to mega-chains, here you can often discover local Kyushu horse oil skincare items and exclusive discount sets. Friendly staff and tax-free services make it highly trusted by locals and tourists alike.", "name": "Drug Segami Tenjin Chikagai", "transport": "Direct access from West Avenue 11, Tenjin Underground Shopping Mall (Tenjin Chikagai)"}, {"address": "5F Main Building, Fukuoka PARCO, 2-11-1 Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.3 stars | Must-Buy List: Canmake Powder Cheeks Limited Edition, Excel Skinny Rich Shadow SR11, WHOMEE Tone-Up Skin Shade. A Japanese select beauty boutique chain focusing on cutting-edge drugstore makeup, trendy niche brands, and popular Korean cosmetics. With rapid stock updates and an extensive inventory, a single visit lets you pick up all the trending cosmetics recommended in Japanese fashion magazines.", "name": "ROSEMARY Fukuoka PARCO", "transport": "Directly connected to Fukuoka PARCO Main Building 5F from Subway Tenjin Station"}, {"address": "B1F Tenjin Building, 2-12-1 Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.1 stars | Must-Buy List: Kyusoku Jikan Cooling Foot Sheets, Santen FX Neo Eye Drops, Protector Hydrating Concealer. A discount drugstore famous for highly competitive prices and bargain deals, located on B1F of the Tenjin Building. Offering extremely affordable pharmaceuticals, daily cosmetics, and health supplements, it is a premier battlefield for tourists buying cosmetics and snacks in bulk.", "name": "Daikoku Drug Tenjin Building Store", "transport": "1-minute walk from Exit 4 of Tenjin Subway Station to B1F Tenjin Building"}, {"address": "2-7-14 Tenjin, Chuo Ward, Fukuoka", "feature": "\u2b50 4.2 stars | Must-Buy List: Kanebo Suisai Beauty Clear Powder, SK-II Facial Treatment Essence Value Sets, SANA Nameraka Honpo Soy Milk Moisture Lotion. A large comprehensive drugstore spanning multiple spacious and well-lit floors in Tenjin, offering everything from high-end counter skincare to affordable drugstore cosmetics and health supplements. With several Chinese-speaking staff available, it is exceptionally convenient for travelers looking for a one-stop shop for cosmetics and medicine.", "name": "Cocokarafine Fukuoka Tenjin Store", "transport": "3-minute walk from the North Exit of Nishitetsu Fukuoka (Tenjin) Station"}], "name": "Iconic Local Beauty Stores \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2-1-35 Imaizumi, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 Stars | Must-Buy List: Fukuoka local designer collab jackets, vegetable-tanned leather short wallets, minimal wide-leg trousers. As a premier select shop rooted in Fukuoka for over 20 years, Dice \u0026 Dice is tucked away in the trendy alleys of Imaizumi. It curates a mix of up-and-coming and top-tier high-street brands from Japan and abroad. Designed in a minimalist industrial style, the store is a favorite among local trendsetters and fashion lovers alike. It frequently drops exclusive apparel and footwear collaborations with local artists, making it a must-visit haven for unique, high-quality pieces.", "name": "Dice \u0026 Dice Select Shop Fukuoka", "transport": "Approx. 7-minute walk from the South Exit of Nishitetsu Fukuoka (Tenjin) Station on the Nishitetsu Tenjin Omuta Line"}, {"address": "2-14-18 Yakuin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.7 Stars | Must-Buy List: KYNE illustration figure tees, ON AIR canvas tote bags, collaboration hoodies. Directed jointly by renowned contemporary Fukuoka artists KYNE and Noncheleee, ON AIR is one of Fukuoka\u0027s most iconic cultural and fashion landmarks. The store features apparel and merchandise adorned with classic 1980s City Pop-style female illustrations, with each release often sparking a buying frenzy. More than just a clothing store, it serves as a central hub where contemporary trends meet street art in Fukuoka.", "name": "ON AIR Streetwear Select Shop (ON AIR Fukuoka)", "transport": "Approx. 5-minute walk from Exit 1 of Yakuin-odori Station on the Nanakuma Subway Line"}, {"address": "1-14-5 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Classic leather doctor bags, minimal genuine leather square bags, handcrafted leather coin purses. Hailing from Tokyo and highly acclaimed in Tenjin\u0027s vibrant shopping district, TIDEWAY is a handcrafted leather bag brand known for its high-grade genuine leather and warm artisanal touch. The brand insists on using premium raw hides sourced locally and internationally, which develop a unique luster and patina over time. Featuring sleek lines and great practicality, its designs are wildly popular among local women who love a chic, retro, or subtle Japanese aesthetic.", "name": "TIDEWAY Fukuoka Tenjin Store", "transport": "Approx. 8-minute walk from Exit 2 of Tenjin Station on the Kuko Subway Line"}, {"address": "1-11-27 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Colorful sheer mock-neck tops, structured oversized knits, high-waisted wide-leg trousers. A viral sensation originating in Tokyo and taking Fukuoka by storm, Maison SPECIAL is located in the vibrant Tenjin Daimyo area. Championing the concept of \u0027High Fashion x High Factotum,\u0027 the brand focuses on premium fabrics paired with dramatic, vibrant colors and relaxed silhouettes. Whether it\u0027s clothing, statement leather shoes, or stylish accessories, everything exudes modern sophistication, making it the top choice for Tenjin fashion enthusiasts crafting a distinct personal style.", "name": "Maison SPECIAL Fukuoka Store", "transport": "Approx. 6-minute walk from Exit 5 of Akasaka Station on the Kuko Subway Line"}, {"address": "3F Solaria Plaza, 2-2-43 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: ORCIVAL French striped tees, Brady classic canvas messenger bags, DANTON lightweight down jackets. Embodying the philosophy of \u0027EVERYDAY CLASSIC,\u0027 Bshop selects practical, timeless apparel, footwear, and bags built to last. The Tenjin store boasts a bright, well-organized layout featuring top-quality workwear and casual clothing from France, the UK, and Japan. Carefully choosing shoes and classic canvas bags that blend functionality with beauty, it is a go-to spot for locals who appreciate quality living, minimalist style, or workwear aesthetics.", "name": "Bshop Fukuoka Tenjin Store", "transport": "Directly connected to Nishitetsu Fukuoka (Tenjin) Station, approx. 1-minute walk"}, {"address": "1-12-49 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 Stars | Must-Buy List: MEXICO 66 classic yellow \u0026 black sneakers, NIPPON MADE handcrafted Japanese leather shoes, logo heavy-duty tote bags. As an iconic Japanese sports-fashion brand, Onitsuka Tiger\u0027s flagship store on Tenjin Daimyo-dori boasts an exceptionally complete line of footwear and apparel. The spacious and stylish interior features a dedicated \u0027NIPPON MADE\u0027 section showcasing premium leather shoes hand-dyed and stitched by Japanese artisans, attracting countless visitors hunting for vintage Japanese street style and ultimate walking comfort.", "name": "Onitsuka Tiger Fukuoka Tenjin Store", "transport": "Approx. 6-minute walk from Exit 2 of Tenjin Station on the Kuko Subway Line"}, {"address": "3F Main Building, Fukuoka PARCO, 2-11-1 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: American heavyweight cotton graphic tees, collaborative functional windbreakers, spacious outdoor crossbody bags. Located on the 3rd floor of the Fukuoka PARCO department store in Tenjin, FREAK\u0027S STORE is a landmark select shop for American casual style in Japan. Alongside its high-value in-house designs, the shop curates a wide selection of outdoor brands and popular footwear. With its strong Native American vintage and Gorpcore outdoor aesthetic combined with relaxed, comfy silhouettes, it has become a staple shopping destination for young locals seeking everyday casual wear and versatile bags.", "name": "FREAK\u0027S STORE Fukuoka PARCO Store", "transport": "Directly connected to Exit 7 of Tenjin Station on the Kuko Subway Line"}, {"address": "1-12-61 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Boston suede clogs, Arizona classic double-strap sandals, signature leather care balm. Located in the fashionable Daimyo district, this BIRKENSTOCK specialty store offers an extensive collection of German-engineered ergonomic footwear and Japan-exclusive colorways. The warm, inviting store provides professional foot measuring and fitting consultations. Many local walkers, fashion enthusiasts, and casual dressers who love pairing shoes with socks adore coming here to pick up classic suede clogs and specialized footwear care products suitable for all seasons.", "name": "BIRKENSTOCK Fukuoka Tenjin Store", "transport": "Approx. 6-minute walk from Exit 2 of Tenjin Station on the Kuko Subway Line"}], "name": "Popular Local Apparel, Footwear \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B2F Main Building, Daimaru Fukuoka Tenjin, 1-4-1 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Original Hakata Mentaiko Rice Crackers (Menbei), Katsuo Samurai Mentaiko Crackers, Mentaiko Mayonnaise. Fukutaro is Fukuoka\u0027s most iconic mentaiko (spicy cod roe) and rice cracker shop. Their flagship souvenir, \u0027Menbei\u0027, infuses savory seafood flavor and spicy mentaiko into a crunchy cracker that is addictively delicious. The Daimaru Tenjin counter offers a complete selection of limited-edition flavors and packaging, making it a top choice for gifts.", "name": "Fukutaro Daimaru Fukuoka Tenjin Store", "transport": "About a 2-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or directly connected to Tenjin-Minami Subway Station."}, {"address": "B2F Main Building, Iwataya Main Store, 2-5-35 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Hakata Western-style Manju \u0027Hakata Torimon\u0027, Hakata Bay Nocturne Cookies. Winning gold awards for consecutive years, \u0027Hakata Torimon\u0027 is Fukuoka\u0027s top-selling souvenir! Made with high-quality white bean paste and carefully selected butter, the filling is smooth, rich, milky, and sweet, seamlessly blending Japanese and Western confectionery styles. It pairs perfectly with hot tea or coffee.", "name": "Meigetsudo Iwataya Main Store", "transport": "About a 3-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 5-minute walk from Tenjin Subway Station."}, {"address": "B2F Main Building, Iwataya Main Store, 2-5-35 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Bell-shaped Monaka (Suzu no Monaka), Amaou Strawberry Daifuku (Seasonal), Shin-you. Operating for over a century, this premier Fukuoka wagashi shop is famous for exquisite packaging and master craftsmanship, making it a dream souvenir for locals. The iconic, adorable bell-shaped \u0027Suzu no Monaka\u0027 features a crispy outer shell filled with smooth, perfectly sweetened red bean paste\u2014a feast for both the eyes and palate.", "name": "Suzukake Iwataya Main Store", "transport": "About a 5-minute walk from Tenjin Subway Station, directly connected to the Iwataya underground shopping street."}, {"address": "East 2nd Avenue, Tenjin Underground Shopping Center, B3, 2-Chome Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Hakata Hiyoko Chick Cake, Fukuoka-exclusive Amaou Strawberry Hiyoko Cookies, Hiyoko Financiers. Created in Hakata, the iconic chick-shaped \u0027Hiyoko Cake\u0027 is famous across Japan. Almost too cute to eat, it features a thin crust wrapping a delicate, sweet white bean filling. The direct-sale store in Tenjin Underground Shopping Center offers Fukuoka-exclusive Amaou strawberry flavors and special gift boxes.", "name": "Yoshinodo Meika Hiyoko Tenjin Underground Shopping Center Store", "transport": "Directly connected to Tenjin Subway Station inside the Tenjin Underground Shopping Center."}, {"address": "1F Solaria Stage, 2-11-1 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Hakata no Ishitami Raw Chocolate, Hakata 1942 Vintage Confectionery, Ultimate Chocolate Baumkuchen. Founded in Hakata in 1942, \u0027Chocolate Shop\u0027 is an iconic bakery recognized as the pioneer of Hakata chocolate. Its signature \u0027Hakata no Ishitami\u0027 melts instantly in your mouth, combining rich layers of raw chocolate and fresh cream for a luxurious taste. It\u0027s a must-buy local treat for discerning travelers.", "name": "Chocolate Shop Tenjin Solaria Stage Store", "transport": "Directly connected to Nishitetsu Fukuoka (Tenjin) Station, 1st floor of Solaria Stage."}, {"address": "M2F Solaria Stage, 2-11-3 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Tsurunoko Marshmallows, Hakata Amaou Strawberry Sandwich Cookies, Iwai Mochi. A historic Hakata confectionery with over 100 years of history, famous as the originator of Japan\u0027s White Day! The signature \u0027Tsurunoko\u0027 features a unique soft, chewy marshmallow casing wrapped around a rich egg yolk filling. Located in a major transit hub, the Tenjin branch makes gift shopping extremely convenient.", "name": "Ishimuramanseido Solaria Stage Store", "transport": "Direct access to M2 floor from the Nishitetsu Fukuoka (Tenjin) Station ticket gate."}, {"address": "B2F Main Building, Iwataya Main Store, 2-5-35 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Hakata Niwaka Senbei, Character Collaboration Niwaka Senbei, Black Bamboo Charcoal Niwaka Senbei. Shaped like the humorous masks used in traditional \u0027Hakata Niwaka\u0027 comedic theater, this classic cracker is Fukuoka\u0027s most playful treat! Crisp and crunchy with pure egg and wheat flavors, each box includes a fun paper mask card\u2014perfect for photo ops and a memorable gift for friends and family.", "name": "Touondou Iwataya Main Store", "transport": "5-minute walk from Tenjin Subway Station, B2 floor of Iwataya Main Store."}, {"address": "B2F Main Building, Iwataya Main Store, 2-5-35 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Kayanoya Special Vegetable Dashi Pack, Hakata-exclusive Mentaiko Dashi Powder, Natural Seafood Dashi Pack. Originating from Hisayama Town near Fukuoka, this shop specializes in additive-free natural dashi broth, enhanced with premium grilled flying fish and bonito flakes. It\u0027s an indispensable kitchen staple for Japanese home cooks and food connoisseurs. The Iwataya store carries their full broth lineup plus Hakata-exclusive dashi and sauce gift sets that make highly refined presents.", "name": "Kubara Honke Kayanoya Iwataya Main Store", "transport": "About a 5-minute walk from Tenjin Subway Station, B2F of Iwataya Main Store."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "2-5-35 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Fukuoka-exclusive Hiyoko Chick Cakes by Yoshinodo, Kayanoya\u0027s \u0027Ultimate Dashi Packs\u0027, and Shiseido luxury skincare. Founded in 1935, Iwataya is Kyushu\u0027s most iconic and historic premier department store. Divided into the Main Building and New Building, it brings together world-class luxury brands, top Japanese cosmetics, and exclusive regional gourmet gifts. The B2 food hall is a holy grail for locals and tourists alike to pick up limited-edition desserts and premium soup stocks. The impeccable, attentive traditional Japanese service will leave a lasting impression.", "name": "Iwataya Main Store", "transport": "Approx. 3-min walk from Nishitetsu Tenjin-Omuta Line \u0027Fukuoka (Tenjin) Station\u0027 / Approx. 5-min walk from Subway Kuko Line \u0027Tenjin Station\u0027 Exit 2"}, {"address": "2-11-1 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Classic Onitsuka Tiger sneakers, BAKE CHEESE TART half-baked cheese tarts, and exclusive ONE PIECE Mugiwara Store merchandise. Directly connected to Tenjin Subway Station, Fukuoka PARCO is the most popular trendsetting shopping complex among youth in Tenjin. Split into Main and New buildings, it gathers local Japanese fashion brands, anime merchandise, and creative lifestyle items. \u0027Kiwamiya\u0027 on B1 serves legendary hamburg steaks with daily long queues. Hosting regular pop-up stores celebrating Japanese pop culture, it is the beating heart of Kyushu\u0027s latest trends.", "name": "Fukuoka PARCO", "transport": "Directly connected to Subway Kuko Line \u0027Tenjin Station\u0027 Exit 7 / Right outside Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 North Exit"}, {"address": "2-2-43 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Urban Research Japanese fashion, Aux Paradises scented hand cream, and Dean \u0026 Deluca Kyushu-exclusive canvas tote bags. Created by the local Nishi-Nippon Railroad (Nishitetsu), this iconic multi-story commercial complex features bright lighting and a spacious, comfortable layout. It curates a range of high-end Japanese select shops, cosmetics, and fragrance boutiques, exuding a stylish vibe beloved by local women and office workers. The 6th and 7th-floor restaurant dining halls feature popular local eateries, making it an elegant haven for both shopping and dining.", "name": "Solaria Plaza", "transport": "Directly connected to Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 Central or South Exit / Approx. 3-min walk from Subway Nanakuma Line \u0027Tenjin-minami Station\u0027"}, {"address": "2-1-35 Imaizumi, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Graphpaper high-end casual shirts, Comme des Gar\u00e7ons independent designer accessories, and Salomon limited collaboration sneakers. Tucked away in an alley south of Tenjin, Dice \u0026 Dice is a longstanding, iconic independent luxury select shop highly revered by Japanese tastemakers and streetwear connoisseurs. Offering a curated blend of Japanese designer labels and international high-end streetwear, the store boasts impeccable garment quality and a unique aesthetic taste, alongside personalized styling advice. A true local fashion landmark you cannot miss in Tenjin.", "name": "Dice \u0026 Dice", "transport": "Approx. 6-min walk from Subway Nanakuma Line \u0027Tenjin-minami Station\u0027 / Approx. 5-min walk from Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 South Exit"}, {"address": "1-8-28 Shirogane, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: penco retro metal scissors \u0026 clipboards, n\u00e4he multi-functional transparent waterproof pouches, and HIGHTIDE Fukuoka-exclusive leather keychains. HIGHTIDE, a stationery and lifestyle brand born in Fukuoka, has its flagship store combining minimalist industrial decor with a specialty coffee bar. Embracing \u0027functional yet aesthetic everyday goods\u0027, it carries everything from vintage stationery and desk organizers to travel trinkets. Packed with Fukuoka\u0027s design soul, visiting this stylish shop allows you to hunt for high-quality unique stationery while enjoying handcrafted coffee and exclusive store goods.", "name": "HIGHTIDE STORE TENJIN", "transport": "Approx. 6-min walk from Subway Nanakuma Line \u0027Yakuin Station\u0027 or \u0027Watanabe-dori Station\u0027 / Approx. 12-min walk from central Tenjin"}, {"address": "2-10-3 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: UNITED ARROWS stylish leather bags, JOURNAL STANDARD FURNITURE home goods, and shopping-exclusive designer tote bags. ViORO is a sophisticated commercial venue tailored for adults in prime Tenjin, themed around art, design, and high-quality lifestyle concepts. It features top Japanese select shops, lifestyle goods, trendy cafes, and original designer brands. Compared to larger department stores, ViORO offers a less crowded, delightfully relaxed shopping atmosphere\u2014a secret aesthetic shopping hideaway preferred by discerning locals.", "name": "ViORO", "transport": "Approx. 1-min walk from Subway Kuko Line \u0027Tenjin Station\u0027 Exit 5 / Approx. 1-min walk from Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 North Exit"}, {"address": "8-1 Yayoigaoka, Tosu City, Saga Prefecture (Direct bus available from Tenjin Bus Terminal)", "feature": "\u2b50 4.2 stars | Must-Buy List: Discounted Beams coats, Coach outlet wallets, and Adidas bargain sneakers. This is Kyushu\u0027s largest and most iconic recommended outlet mall! Designed with Southern California-style Spanish architecture, it houses roughly 170 famous domestic and international brands\u2014including Beams, United Arrows, Champion, Nike, Mikimoto, and more\u2014offering deep discounts (30% to 70% off) year-round. Direct express buses depart daily from Nishitetsu Tenjin Bus Terminal, reaching the outlet in about 45 minutes, making it an indispensable shopping paradise when visiting Fukuoka.", "name": "Tosu Premium Outlets", "transport": "Approx. 45 mins via direct highway bus from \u0027Nishitetsu Tenjin Expressway Bus Terminal\u0027 / or approx. 15 mins by local bus from JR Tosu Station"}, {"address": "4-3-8 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Loft Tenjin-exclusive masking tape, UNIQLO Kyushu flagship store limited UT T-shirts, and GU collaboration trendy apparel. Reopened after extensive renovations, mina Tenjin is the most talked-about mega lifestyle shopping complex in North Tenjin. It houses Kyushu\u0027s largest \u0027UNIQLO\u0027 and \u0027GU\u0027 flagship stores, along with \u0027Tenjin Loft\u0027 spanning two full floors packed with trendy Japanese lifestyle goods, cosmetics, and creative stationery. Combining budget-friendly practical shopping with local everyday flair, it\u0027s the ultimate one-stop shop for daily essentials and trendy apparel in the Tenjin shopping district.", "name": "mina Tenjin", "transport": "Directly connected to Subway Kuko Line \u0027Tenjin Station\u0027 Underground Mall Exit 1a / Approx. 5-min walk from Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 North Exit"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Tenjin Core Commercial District"}};
        const cityName = "Fukuoka";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
