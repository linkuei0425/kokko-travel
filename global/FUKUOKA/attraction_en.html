          "description": "⭐ 4.4 stars | Kushida Shrine is the grand tutelary shrine of Hakata. Founded in AD 757, it is deeply cherished by local citizens. It is best known for the annual Hakata Gion Yamakasa Festival held every July. On display year-round within the shrine grounds is a magnificent 'Kazari Yamakasa'—a towering, exquisitely carved decorative float several meters high that offers a visually stunning experience. The grounds also feature a massive ginkgo tree over a thousand years old and the sacred Crane Well (Tsuru no Ido), where visitors pray for longevity and eternal youth. Attracting countless visitors praying for blessings every year, it stands as an iconic historical landmark to explore Hakata's traditional beliefs and festival culture.",

          "address": {

        }

        "@type": "ListItem",

          "address": {
            "@type": "PostalAddress",

            "@type": "PostalAddress",

          "address": {

    <script>
        const dbData = {"daimyo_ohori": {"categories": {"cat_1": {"items": [{"address": "1-4 Jonai, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 | Built in the early 17th century by Kuroda Nagamasa, the first lord of the Fukuoka Domain, Fukuoka Castle took seven years to complete and was also known as \u0027Maizuru Castle.\u0027 Although the original main keep no longer stands, the site preserves grand stone walls, moats, and several ancient turrets and gates. Beautiful in all four seasons, it becomes Fukuoka\u0027s premier cherry blossom spot in spring when thousands of cherry trees bloom. Strolling through the ruins offers a deep sense of Edo-period history, while climbing the base of the former main keep provides sweeping panoramic views of Ohori Park and downtown Fukuoka.", "name": "Fukuoka Castle Ruins", "transport": "Approx. 8-minute walk from Akasaka Station or Ohori Park Station on the Subway Airport Line"}, {"address": "1-7 Ohori Park, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 | Opened in 1984 to mark the 50th anniversary of Ohori Park, this traditional strolling garden features artificial hills and ponds across a spacious 12,000-square-meter grounds. It meticulously showcases large ponds, waterfalls, dry landscape gardens (karesansui), and a classic teahouse. Embodying the essence of traditional Japanese landscape art, the scenery beautifully shifts with the seasons, from spring blossoms to vibrant autumn maples. Visitors can immerse themselves in serene Zen aesthetics and savor authentic matcha and traditional wagashi at the teahouse.", "name": "Ohori Park Japanese Garden", "transport": "Approx. 10-minute walk from Exit 3 of Ohori Park Station on the Subway Airport Line"}, {"address": "1-4 Jonai, Chuo Ward, Fukuoka, Fukuoka Prefecture (Inside Maizuru Park)", "feature": "\u2b50 4.1 | Korokan was an official state guesthouse during the Heian period, designed to receive foreign envoys and merchants from Tang Dynasty China and Silla. Of the only three Korokan sites discovered across Japan, this one within the Fukuoka Castle Ruins is the only one with an exact identified location open to the public. Built directly over the archaeological excavation site, the museum displays ancient ceramics, foundation stones, and restored historical models, vividly highlighting Fukuoka\u0027s historic role as Japan\u0027s gateway for ancient diplomacy.", "name": "Korokan Historical Museum", "transport": "Approx. 8-minute walk from Exit 2 of Akasaka Station on the Subway Airport Line"}, {"address": "1 Jonai, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | Tamon Yagura is one of the few original Edo-period structures remaining in Fukuoka Castle and is designated an Important Cultural Property. Extending over 30 meters atop formidable stone walls, this two-story defense turret served crucial military and surveillance roles. Featuring classic white plaster walls and dark roof tiles, it displays the fine craftsmanship of ancient Japanese castle defenses. During the spring cherry blossom festival and special cultural events, the interior opens to the public, allowing visitors to explore inside this historic military structure.", "name": "Fukuoka Castle Tamon Yagura", "transport": "Approx. 10-minute walk from Akasaka Station on the Subway Airport Line"}, {"address": "2-6-11 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | Built in 1929 during the early Showa period, this former elementary school is one of Fukuoka\u0027s oldest modern concrete schoolhouses, carrying rich memories for generations of locals. Following its closure, this historic building\u2014filled with retro geometric charm\u2014was revitalized into \u0027Fukuoka Growth Next,\u0027 a vibrant startup incubation center featuring stylish cafes. Blending classic architecture with modern innovation, it stands as a unique landmark where past meets present in the trendy Daimyo district.", "name": "Old Daimyo Elementary School - Fukuoka Growth Next", "transport": "Approx. 5-minute walk from Tenjin Station or 4-minute walk from Akasaka Station on the Subway Airport Line"}, {"address": "1-5 Ohori Park, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 | Located on the eastern side of Ohori Park, this venue is one of western Japan\u0027s most prominent dedicated traditional Noh theaters. Its architecture smoothly combines traditional Japanese wooden aesthetics with modern performance technology. Inside, a magnificent Noh stage crafted from premium cypress hosts regular classical arts performances, including Noh and Kyogen. Even when no performances are scheduled, its elegant traditional exterior nestled among lush trees serves as a landmark cultural spot in Ohori Park.", "name": "Ohori Park Noh Theater", "transport": "Approx. 5-minute walk from Ohori Park Station on the Subway Airport Line"}, {"address": "1-1-1 Ropponmatsu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 | Adjacent to Ohori Park and Maizuru Park, Fukuoka Gokoku Shrine features vast, peaceful, and solemn grounds. A towering wooden torii gate stands grandly at the main entrance. The shrine honors the spirits of those from Fukuoka Prefecture who served and sacrificed for their country since the Meiji Restoration. Surrounded by towering ancient trees, it offers an urban oasis for reflection and quiet. During the annual summer \u0027Mando Matsuri\u0027 (Lantern Festival), thousands of glowing lanterns illuminate the night sky in a mystical, majestic tradition.", "name": "Fukuoka Gokoku Shrine", "transport": "Approx. 8-minute walk from Ropponmatsu Station on the Nanakuma Line or 10-minute walk from Ohori Park Station on the Subway Airport Line"}, {"address": "13-1 Nishi Park, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 | Perched atop Nishi Park on the western side of Ohori Park, Terumo Shrine honors Kuroda Kanbei and his son Kuroda Nagamasa, the founding lords of the Fukuoka Domain. The shrine\u0027s name derives from Kanbei\u0027s Buddhist name, \u0027Koun-in.\u0027 It houses historic artifacts and traditional portable shrines (mikoshi) related to the Kuroda clan. The worship hall features an intricate ink-dragon painting on its ceiling; clapping directly beneath it is said to create a unique acoustic echo. Beyond its history, the hilltop shrine offers fantastic views of Fukuoka Bay and the city landscape.", "name": "Terumo Shrine", "transport": "Approx. 15-minute walk from Exit 1 of Ohori Park Station on the Subway Airport Line"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-6 Ohori Park, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Situated on the picturesque shores of Ohori Park lake, the Fukuoka Art Museum is one of Kyushu\u0027s most iconic halls of modern and classical art. Its collection includes masterpieces by world-renowned masters such as Salvador Dal\u00ed and Joan Mir\u00f3, alongside a rich display of traditional Kyushu tea utensils and Buddhist art. The outdoor plaza features Yayoi Kusama\u0027s signature Yellow Pumpkin sculpture, creating a delightful harmony with the lake and lush surroundings. Following extensive renovations, the museum boasts bright, spacious galleries, as well as a scenic caf\u00e9 and art shop where visitors can relax in a rich cultural atmosphere.", "name": "Fukuoka Art Museum", "transport": "About a 10-minute walk from Exit 3 of Ohori Park Station on the Subway Kuko Line"}, {"address": "2-7-7 Daimyo, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located in the heart of the bustling and trendy Daimyo district, Daimyo Catholic Church serves as the Cathedral of the Catholic Diocese of Fukuoka, holding great historical and symbolic significance. Blending solemn modern architecture with classic Gothic elements, its soaring cross and serene sanctuary stand as a peaceful oasis amid nearby fashion boutiques and caf\u00e9s. Featuring stunning stained-glass windows and a pipe organ, the church holds regular Sunday masses and special holiday services, making it a wonderful spot for spiritual rest and architectural appreciation in the center of the city.", "name": "Catholic Daimyo Church", "transport": "About a 3-minute walk from Exit 5 of Akasaka Station, or a 7-minute walk from Tenjin Station on the Subway Kuko Line"}, {"address": "1-4 Jonai, Chuo-ku, Fukuoka City, Fukuoka Prefecture (inside Maizuru Park)", "feature": "\u2b50 4.2 stars | Korokan was an official state guesthouse used during the Asuka to Heian periods to welcome foreign envoys and Tang Dynasty merchants; this valuable site in Fukuoka Castle Ruins is the only one discovered in all of Japan. Built within Maizuru Park directly over the ancient ruins, the exhibition hall displays the excavation site in situ, along with unearthed Yue ware celadon from China, Silla pottery, restored models, and precious historical documents. Here, travelers can immerse themselves in Fukuoka\u0027s vibrant history as Japan\u0027s ancient gateway to international exchange\u2014a must-visit spot for history and archaeology enthusiasts.", "name": "Korokan Historical Museum", "transport": "About an 8-minute walk from Akasaka Station or Ohori Park Station on the Subway Kuko Line"}, {"address": "1-5 Ohori Park, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Tucked away in the lush greenery of Ohori Park, the Ohori Park Noh Theater is Kyushu\u0027s premiere traditional Noh performing arts venue. Built with elegant wooden structures, it houses a historic cypress (hinoki) stage that embodies the pure aesthetics of traditional Japanese \u0027Noh\u0027 and \u0027Kyogen\u0027 theater. In addition to regular professional Noh performances, the venue offers cultural lectures and workshops, allowing visitors to deeply explore the essence of classical Japanese performing arts in a serene setting.", "name": "Ohori Park Noh Theater", "transport": "About a 5-minute walk from Exit 3 of Ohori Park Station on the Subway Kuko Line"}, {"address": "1-4 Jonai, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located inside Maizuru Park, the Fukuoka Castle Information Center is an essential cultural hall for understanding the history of Fukuoka Castle, built by Kuroda Kanbei and his son Nagamasa. Through high-definition 3D CG restoration videos, a massive 3D castle model, and historical artifacts, the center recreates the grandeur of Kyushu\u0027s largest castle during the Edo period. Offering free admission and detailed multilingual guide materials, it serves as the ideal first cultural stop when exploring the historical ruins of Ohori and Maizuru Parks.", "name": "Fukuoka Castle Information Center", "transport": "About a 6-minute walk from Exit 2 of Akasaka Station on the Subway Kuko Line"}, {"address": "1-7 Ohori Park, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Built to commemorate the 50th anniversary of Ohori Park, this traditional 12,000-square-meter Japanese stroll garden features ponds, hills, dry landscape gardens (karesansui), a grand waterfall, and the \u0027Shogetsuan\u0027 teahouse. Meticulously designed, the garden changes beautifully with the seasons\u2014spring cherry blossoms, early summer azaleas, wisteria, and vibrant autumn maples combine to create poetic landscapes. Strolling through allows you to appreciate classic Japanese garden aesthetics and book a traditional tea ceremony to enjoy a tranquil moment of mental refreshment.", "name": "Ohori Park Japanese Garden", "transport": "About a 10-minute walk from Exit 3 of Ohori Park Station on the Subway Kuko Line"}, {"address": "2-6-11 Daimyo, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Repurposed from the nearly century-old wooden building of the former Daimyo Elementary School, this complex skillfully combines historical preservation with contemporary creative spaces. Retaining the retro Showa-era corridors and classroom layouts, the old schoolhouse has transformed into a multifaceted creative hub featuring art exhibitions, stylish caf\u00e9s, startup workshops, and cultural communities. Walking through, you\u0027ll experience a dynamic clash between traditional history and trendy ideas, making it a unique cultural landmark in the stylish Daimyo area.", "name": "Fukuoka Growth Next / Old Daimyo Elementary School", "transport": "About a 3-minute walk from Exit 5 of Akasaka Station, or a 5-minute walk from Tenjin Station on the Subway Kuko Line"}, {"address": "5-29 Susakimachi, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Situated next to Suzaki Park on the northern border of the Daimyo and Tenjin areas, the Fukuoka Prefectural Museum of Art focuses on collecting and showcasing works by artists closely tied to Kyushu and Fukuoka. Holding thousands of art pieces spanning Western paintings, Japanese paintings, sculptures, and crafts, the museum frequently hosts high-quality special exhibitions and cultural lectures. With a rich art library and lecture spaces, it is a vital cultural hub for understanding Fukuoka\u0027s local modern art development and contemporary artistic aesthetics.", "name": "Fukuoka Prefectural Museum of Art", "transport": "About a 10-minute walk from Tenjin Station on the Subway Kuko Line"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-2 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Fukuoka\u0027s most iconic downtown waterfront park, featuring a 2-kilometer circular trail around the lake that is perfect for jogging, strolling, and boating. Three small islands in the center of the lake are connected by bridges, shaded by willow trees and offering delightful scenery year-round.", "name": "Ohori Park", "transport": "Approx. 3-min walk from Ohori Park Station or Akasaka Station on the Fukuoka City Subway Kuko Line"}, {"address": "1-5 Ohori Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A traditional Japanese garden spanning 1.2 hectares, built to commemorate the 50th anniversary of Ohori Park. It features a hill-and-pond stroll garden, a dry landscape (Karesansui) garden, and a tea house. Elegant waterfalls, ponds, and seasonal flora create a serene atmosphere perfect for quiet contemplation.", "name": "Ohori Park Japanese Garden", "transport": "Approx. 8-min walk from Ohori Park Station on the Fukuoka City Subway Kuko Line"}, {"address": "1-4 Jonai, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A historic green space adjacent to Ohori Park, centered around the Fukuoka Castle ruins. It is one of Fukuoka\u0027s premier cherry blossom viewing spots, where over a thousand cherry trees bloom in spring against majestic ancient stone walls, accompanied by romantic nighttime light-up events.", "name": "Maizuru Park", "transport": "Approx. 8-min walk from Akasaka Station or Ohori Park Station on the Fukuoka City Subway Kuko Line"}, {"address": "1 Jonai, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Built by the famous Edo-period warlord Kuroda Kanbei and his son, these historic castle ruins feature grand, remarkably well-preserved stone walls. The observation deck at the main keep (Tenshudai) offers a stunning 360-degree panoramic view of Ohori Park and downtown Fukuoka.", "name": "Fukuoka Castle Ruins \u0026 Tenshudai", "transport": "Approx. 10-min walk from Akasaka Station on the Fukuoka City Subway Kuko Line"}, {"address": "2-2 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | An urban oasis situated right next to the trendy Daimyo neighborhood and the Tenjin shopping district. Lush with trees and featuring a spacious central plaza with comfortable seating, it is an ideal spot to relax while shopping. It also hosts a brilliant Christmas illumination festival in winter.", "name": "Kego Park", "transport": "Directly accessible from Nishitetsu-Fukuoka (Tenjin) Station on the Nishitetsu Tenjin Omuta Line; approx. 3-min walk to Daimyo area"}, {"address": "1 Jonai, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A historical plaza inside Maizuru Park containing the only confirmed ruins of an ancient guest house for foreign envoys from the Asuka to Heian periods in Japan. Expansive green lawns blend seamlessly with ancient heritage, providing a peaceful walking area filled with history and nature.", "name": "Korokan Ruins Plaza", "transport": "Approx. 7-min walk from Exit 2 of Akasaka Station on the Fukuoka City Subway Kuko Line"}, {"address": "13 Nishi Park, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A hilltop natural park located just north of Ohori Park, recognized as one of \u0027Japan\u0027s Top 100 Cherry Blossom Spots.\u0027 Covered in dense woodland, its elevated observation deck offers sweeping views of Hakata Bay, Shikanoshima, Fukuoka Tower, and gorgeous sunsets.", "name": "Nishi Park", "transport": "Approx. 15-min walk from Ohori Park Station on the Fukuoka City Subway Kuko Line"}, {"address": "2 Jonai, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away near the castle walls of Maizuru Park, this seasonal flower garden blooms vibrant peonies and tree peonies in spring, followed by romantic wisteria and hydrangeas. A peaceful, hidden sanctuary for flower enthusiasts.", "name": "Maizuru Park Flower Gardens", "transport": "Approx. 10-min walk from Akasaka Station on the Fukuoka City Subway Kuko Line"}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "1-2 Ohoripark, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Located in the center of Ohori Park\u0027s pond, Ukimi-do Pavilion is one of the park\u0027s most iconic photogenic spots. Its vermilion pillars, crisp white walls, and traditional tiled roof create a strikingly elegant picture against the deep blue lake. Whether capturing reflections in the morning sun or silhouettes at sunset, every angle offers a breathtaking classic Japanese scene. Connected to the shore by a long bridge, walking across gives you a 360-degree panoramic view of the lake and surrounding greenery. It\u0027s a must-visit photo spot for travelers and influencers in Fukuoka.", "name": "Ohori Park Ukimi-do Pavilion", "transport": "Approx. 7-minute walk from Ohorikoen Station on the Subway Kuko Line"}, {"address": "1-7 Ohoripark, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Built to commemorate the 50th anniversary of Ohori Park, this traditional Japanese garden spans 12,000 square meters. The exquisitely designed landscape features a large pond, artificial hills, dry landscape gardens (karesansui), and a dramatic four-meter waterfall. Autumn brings a stunning scene of vibrant red maple leaves interwoven with black pines, while spring offers fresh greenery and beautiful blooms. It is a dream destination for photographers to capture traditional Japanese aesthetics. Every step along its stone paths yields a poetic, Instagram-worthy shot.", "name": "Ohori Park Japanese Garden", "transport": "Approx. 10-minute walk from Ohorikoen Station or Tojinmachi Station on the Subway Kuko Line"}, {"address": "1-4 Jonai, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located in Maizuru Park adjacent to Ohori Park, the ruins of Fukuoka Castle host the Tenshudai Lookout\u2014the best viewpoint to overlook downtown Fukuoka and Ohori Park lake. During spring, over a thousand cherry trees bloom around the ancient stone walls, creating a breathtaking contrast of pink blossoms and historical ruins. The evening illuminations are mesmerizing, attracting photographers and tourists alike. Standing at the lookout, the seamless blend of history and modern city views will leave you enchanted.", "name": "Maizuru Park Tenshudai Lookout", "transport": "Approx. 8-minute walk from Akasaka Station or Ohorikoen Station on the Subway Kuko Line"}, {"address": "1-3 Ohoripark, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Perched along the shores of Ohori Park, this waterfront complex features sleek white architecture and expansive floor-to-ceiling windows. It houses open-air cafes, restaurants, and a pedal-boat rental station. Many visitors rent cute swan boats to glide across the lake while taking relaxing vacation-style photos. Alternatively, sitting on the outdoor terrace with a cup of coffee while taking in the lakeside breeze offers the perfect lifestyle photo-op. It\u2019s one of the most popular stylish hangouts in the Daimyo and Ohori Park area.", "name": "Ohori Park Boathouse", "transport": "Approx. 3-minute walk from Exit 3 of Ohorikoen Station on the Subway Kuko Line"}, {"address": "1-11-4 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in the trendy alleys of Daimyo, this wildly popular dessert shop took social media by storm with its rich, velvety soft-serve that boasts a perfectly smooth, toy-like appearance. The signature crisp black charcoal cone paired with thick, pure white milk ice cream against the shop\u0027s minimalist graffiti wall creates an eye-catching photo. Holding one of these soft-serves has become the ultimate signature photo pose for visitors exploring Daimyo.", "name": "DAIMYO SOFTCREAM Daimyo Main Store", "transport": "Approx. 5-minute walk from Akasaka Station or 8-minute walk from Tenjin Station on the Subway Kuko Line"}, {"address": "1F NEO Daimyo Bldg., 1-3-3 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A fairytale-themed concept store based on \u0027Alice in Wonderland,\u0027 famous for its tiny entrance door that forces shoppers to bend down to enter\u2014making you feel as if you\u0027ve truly fallen down the rabbit hole. Divided into whimsical themed rooms like the Queen of Hearts Room, the White Queen Room, and the Mad Hatter Room, the shop is packed with magical retro decor and cute merchandise. Every corner provides an enchanting, narrative-rich backdrop for magical photos.", "name": "Alice on Wednesday Fukuoka", "transport": "Approx. 5-minute walk from Exit 4 of Akasaka Station on the Subway Kuko Line"}, {"address": "1F Ishii Bldg., 1-1-3 Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A flagship cafe of Fukuoka\u2019s local bohemian and street culture scene, manu coffee Daimyo stands out with its bold, bright yellow exterior and artistic, graffiti-filled interior. A popular hub for local trendsetters and artists, every angle radiates a cool Kyushu street vibe. Ordering a beautifully poured latte and snapping a picture against the yellow wall or the distinctive bench outside perfectly captures Daimyo\u0027s unique hipster aesthetic.", "name": "manu coffee Daimyo", "transport": "Approx. 7-minute walk from Nishitetsu-Fukuoka (Tenjin) Station on the Nishitetsu Tenjin Omuta Line"}, {"address": "1-chome to 2-chome Daimyo, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Daimyo is the birthplace of street culture and fashion in Fukuoka and all of Kyushu. Wandering through its narrow alleys filled with vintage thrift shops, independent designer boutiques, street murals, and retro buildings, you\u0027ll discover countless instagrammable surprises. From quirky shop signs to vibrant mural art, the entire neighborhood feels like an open-air street art museum. Taking an OOTD (Outfit Of The Day) photo here in your stylish streetwear is an essential ritual for fashion enthusiasts visiting Fukuoka.", "name": "Daimyo Street Art \u0026 Fashion Alley", "transport": "Approx. 5 to 8-minute walk from Akasaka Station or Tenjin Station on the Subway Kuko Line"}], "name": "Popular Instagrammable Hotspots"}}, "name": "Daimyo Trendy District and Ohori Park"}, "dazaifu": {"categories": {"cat_1": {"items": [{"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Dazaifu Tenmangu Shrine is the head shrine among approximately 12,000 Tenmangu shrines across Japan, dedicated to Sugawara no Michizane, the deity of learning and culture. The shrine showcases exquisite Momoyama-period wooden craftsmanship, and its main hall is designated as an Important Cultural Property of Japan. The grounds feature nearly 6,000 plum trees, the most famous being the legendary \u0027Tobiume\u0027 (Flying Plum Tree), which reputedly flew from Kyoto to Dazaifu overnight out of longing for Michizane. A sacred destination to pray for academic success and exam luck, its Momoyama-style architecture along the approach and rich historical charm attract visitors from around the world.", "name": "Dazaifu Tenmangu Shrine", "transport": "About a 5-minute walk from Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "5-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Founded in the late 7th century by Emperor Tenji to pray for the soul of his mother, Empress Saimei, Kanzeon-ji was one of the grandest imperial-charter temples in western Japan during the Nara period. It houses one of Japan\u0027s oldest temple bells (a National Treasure) and numerous massive wooden Buddhist statues from the Heian to Kamakura periods (all designated Important Cultural Properties). Stepping into this serene and rustic temple offers a profound connection to the grand historical legacy and Buddhist art of the Nara and Heian eras.", "name": "Kanzeon-ji Temple", "transport": "About a 15-minute walk from Tofuro-mae Station on the Nishitetsu Line, or take the Dazaifu City Community Bus \u0027Mahoroba-go\u0027 and get off at Kanzeonji Station"}, {"address": "5-7-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Originally part of Kanzeon-ji, Kaidan-in was one of Japan\u0027s three official ordination platforms during the Nara period (alongside Todai-ji in Nara and Yakushi-ji in Shimotsuke), built specifically for ordaining Buddhist monks and strict religious training. The current main hall was rebuilt in the Edo period and houses a seated statue of Rushana Buddha, an Important Cultural Property. Though understated and modest in appearance, it holds a sacred status and profound cultural heritage in the history of Kyushu Buddhism.", "name": "Kaidan-in Temple", "transport": "About a 15-minute walk from Tofuro-mae Station on the Nishitetsu Dazaifu Line"}, {"address": "4-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | This site marks the ruins of Dazaifu, the supreme authority governing politics, military affairs, and diplomacy across Kyushu from the Nara to Heian periods, historically known as the \u0027Distant Imperial Court.\u0027 Designated a Special National Historic Site, only foundation stones remain today, but the vast lawns and grand building bases vividly outline its past scale. Beautiful year-round with spring cherry blossoms and autumn foliage, it is a wonderful spot to stroll along ancient footprints and immerse yourself in memories of an ancient imperial gateway.", "name": "Dazaifu Government Office Ruins", "transport": "About a 12-minute walk from Tofuro-mae Station on the Nishitetsu Tenjin Omuta Line"}, {"address": "2-16-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1273 during the Kamakura period by the monk Tetsugyu Enshin, Komyozen-ji is a renowned Zen temple of the Rinzai sect\u0027s Myoshin-ji school in Kyushu. The temple is famous for two dry landscape (karesansui) gardens: the front garden features stones arranged to spell the character for \u0027Light\u0027 (Bukko Rock Garden), while the rear garden weaves moss and pebbles into \u0027Land Garden\u0027 and \u0027Sea Garden\u0027, earning it the nickname \u0027Moss Temple.\u0027 Its elegant wooden architecture paired with autumn leaves and vibrant moss creates an atmosphere of deep Zen tranquility.", "name": "Komyozen-ji Temple", "transport": "About a 5-minute walk from Dazaifu Station on the Nishitetsu Dazaifu Line"}, {"address": "88 Uchiyama, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Located at the foot of sacred Mount Homan, Kamado Shrine has over 1,300 years of history. Historically revered as a guardian shrine protecting Dazaifu\u0027s unlucky northeast direction, it is now famous across Japan for blessing matchmaking and good relationships. The shrine seamlessly blends traditional wooden sanctuary aesthetics with modern minimalist design, featuring a talisman reception office designed by renowned architect Masamichi Katayama. In recent years, it has also become a popular pilgrimage site for anime fans due to its connection with \u0027Demon Slayer\u0027.", "name": "Kamado Jinja Shrine", "transport": "Take the \u0027Mahoroba-go\u0027 community bus from Nishitetsu Dazaifu Station and get off at Uchiyama (Kamado Shrine) Station"}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture (Behind the Main Hall of Tenmangu Shrine)", "feature": "\u2b50 4.3 stars | Tucked away on a steep wooded slope behind the main hall of Dazaifu Tenmangu Shrine, Tenkai Inari Shrine is known locally as one of Kyushu\u0027s most powerful spiritual \u0027power spots.\u0027 Dedicated to Ukanomitama-no-Kami, it attracts worshippers praying for good fortune and business prosperity. Ascending winding stairs framed by vibrant vermilion torii gates leads to the inner shrine nestled among rocks and dense forest. Exuding a mystical, peaceful atmosphere, it is a wonderful hidden gem to experience Dazaifu\u0027s deep historical ambiance.", "name": "Tenkai Inari Shrine", "transport": "About a 15-minute walk up the steps from behind Dazaifu Tenmangu Main Hall, which is a short walk from Nishitetsu Dazaifu Station"}, {"address": "4-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Built directly over the excavation site of the Dazaifu Government Office Ruins, this hall displays original foundation remains of ancient schools and government structures, preserved in their excavated state. The museum features a full-scale model of ancient Dazaifu and rich archaeological artifacts, highlighting the historical context of the \u0027Plum Blossom Banquet\u0027\u2014the origin of Japan\u0027s era name \u0027Reiwa.\u0027 This exhibition hall serves as an engaging gateway to understanding the glorious past and architectural heritage of ancient Dazaifu.", "name": "Dazaifu Exhibition Hall", "transport": "About a 12-minute walk from Nishitetsu Tofuro-mae Station"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "4-7-2 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Opened in 2005, the Kyushu National Museum is one of Japan\u0027s four national museums, centered on the theme of \"Understanding Japanese Culture from an Asian Historical Perspective.\" The modern building features a striking, curved blue glass fa\u00e7ade that blends seamlessly into the surrounding lush greenery. Inside, it boasts extensive permanent and special exhibition galleries that utilize state-of-the-art interactive digital technology to display the history of cultural exchange between Japan and other parts of Asia. The third-floor permanent exhibition room houses numerous precious National Treasures and Important Cultural Properties, offering a comprehensive view of historical evolution from the Jomon period through the Edo period with immense educational and artistic value.", "name": "Kyushu National Museum", "transport": "About a 10-minute walk from Nishitetsu Dazaifu Station, or accessible via the inclined escalator and moving walkway behind the main hall of Dazaifu Tenmangu Shrine."}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located within the grounds of Dazaifu Tenmangu Shrine, the Treasure Museum houses a vast collection of sacred artifacts and ancient artworks related to Sugawara no Michizane, the deity of learning. The collection includes the \"Dazaifu Tenmangu Documents\" designated as an Important Cultural Property, ancient sacred swords, exquisite Heian-period crafts, picture scrolls, and classical calligraphy and paintings dedicated by historical scholars and poets. The meticulously designed exhibition space combines an ancient historical atmosphere with modern lighting, allowing visitors to delve deep into the millennium-old faith, culture, and artistic heritage of Dazaifu Tenmangu.", "name": "Dazaifu Tenmangu Treasure Museum", "transport": "About a 6-minute walk from Nishitetsu Dazaifu Station to the Treasure Museum inside the shrine grounds."}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Situated next to Shiga Shrine within the grounds of Dazaifu Tenmangu, the Kanko History Museum is dedicated to depicting the eventful life of Sugawara no Michizane (Kanko), the deity of learning. The museum\u0027s highlight is its use of hundreds of exquisitely crafted Hakata dolls arranged in realistic dioramas representing key historical milestones\u2014from his birth and early rise as a brilliant young scholar to reaching peak status, being demoted to Dazaifu due to slander, and his eventual passing here. The vivid facial expressions and detailed historical backdrops, paired with informative explanations, make this an excellent spot to quickly understand Sugawara no Michizane\u0027s legendary story and the history of Japan\u0027s Heian period.", "name": "Kanko History Museum", "transport": "About a 7-minute walk from Nishitetsu Dazaifu Station into the shrine grounds."}, {"address": "5-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Kanzeonji Temple was a renowned Asuka-period temple commissioned by Emperor Tenji to pray for his late mother, making its history even older than Dazaifu Tenmangu\u0027s. The temple\u0027s Treasure Hall concentrates and displays a magnificent collection of Buddhist statues created between the Heian and Kamakura periods, including 5-meter-tall designated Important Cultural Properties such as the standing statues of Horse-headed Avalokiteshvara, Amoghapasa Avalokiteshvara, and Eleven-headed Avalokiteshvara. The solemn and elegant gallery, with its awe-inspiring giant wooden Buddhist statues, offers a deeply impactful artistic experience\u2014an indispensable destination for lovers of ancient Buddhist art and religious history.", "name": "Kanzeonji Temple Treasure Hall", "transport": "About a 20-minute walk from Nishitetsu Tofuro-mae Station, or take the \"Mahoroba\" community bus and get off at \"Kanzeonji\" stop."}, {"address": "4-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Built directly on the grounds of the ancient \"Dazaifu Government Office Ruins\", the Dazaifu Exhibition Hall is a historical museum dedicated to preserving and exhibiting artifacts excavated from Dazaifu ruins. Its most impressive feature is the protective facility constructed right above the excavation site, preserving the ruins of stone foundations and ditches dating from the Asuka to Heian periods. Additionally, the hall displays excavated pottery, roof tiles, wooden tablets (mokkan), and a miniature diorama of the Plum Blossom Banquet associated with the origin of Japan\u0027s era name \"Reiwa\". It transports visitors back in time to experience the glory of western Japan\u0027s political and cultural center a thousand years ago.", "name": "Dazaifu Exhibition Hall", "transport": "About a 15-minute walk from Nishitetsu Tofuro-mae Station, or take the \"Mahoroba\" bus and get off at \"Dazaifu Seicho-ato\" stop."}, {"address": "2-3-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Nestled in a quiet residential area steeped in history, Dazaifu Catholic Church showcases a unique architectural style blending Eastern and Western influences. The church features a chapel with a warm, locally distinct design, utilizing soft natural light and wooden accents inside to create a peaceful atmosphere for prayer and contemplation. Although Dazaifu is famous for its traditional shrines and temples, this church\u0027s elegant architecture and religious decorations highlight the harmonious coexistence of diverse religious cultures in modern Dazaifu, attracting travelers interested in architecture and religious history.", "name": "Dazaifu Catholic Church", "transport": "About a 5-minute walk from Nishitetsu Dazaifu Station."}, {"address": "5-7-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Originally part of Kanzeonji Temple, Kaidan-in Temple was established during the Nara period by the renowned monk Ganjin as one of Japan\u0027s three official ordination platforms (alongside Todaiji in Nara and Yakushiji in Shimotsuke), holding immense prestige in ancient Japanese Buddhist history. The temple preserves the highly historically valuable seated wooden statue of Vairocana Buddha (an Important Cultural Property) from the Heian period, as well as artifacts related to Monk Ganjin. The tranquil grounds, rustic hall, and courtyard reflect deep Esoteric Buddhist artistic heritage, making it a hidden gem for exploring history and Buddhist craftsmanship.", "name": "Kaidan-in Temple", "transport": "About an 18-minute walk from Nishitetsu Tofuro-mae Station, or take the community bus to \"Kanzeonji\" and walk for 2 minutes."}, {"address": "2-16-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Founded in the Kamakura period by the monk Tetsugyu Enshin, Komyozen-ji is a Rinzai Myoshinji-school Zen temple famous for its artistic Karesansui (dry landscape) gardens, earning it the reputation as \"Kyushu\u0027s No. 1 Rock Garden\". The temple features a front garden named \"Bukko Sekitei\" and a rear garden named \"Issei-tei\". The rear garden is especially renowned for using moss and white sand to artistically abstract land and ocean. The vibrant spring greenery and vivid autumn leaves contrasting against the white sand and stones present the pinnacle of Zen aesthetics and natural landscape design, offering visitors an exquisite space for quiet reflection and appreciation of Japanese garden art.", "name": "Komyozen-ji Temple", "transport": "About a 5-minute walk from Nishitetsu Dazaifu Station (located in an alley off the main approach to Tenmangu Shrine)."}], "name": "Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | Home to around 6,000 plum trees across nearly 200 varieties, Dazaifu Tenmangu is a premier plum-viewing spot in Fukuoka Prefecture. The most famous is the sacred \u0027Tobiume\u0027 (Flying Plum Tree), which legend says flew overnight from Kyoto out of longing for Sugawara no Michizane. From early February to early March, the garden comes alive with vibrant pink and white blossoms, filling the air with an elegant floral fragrance and attracting countless visitors to experience its rich historical and cultural charm.", "name": "Dazaifu Tenmangu Plum Garden", "transport": "About a 5-minute walk from \u0027Dazaifu Station\u0027 on the Nishitetsu Dazaifu Line"}, {"address": "4-6-1 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | The Dazaifu Government Office Ruins mark the ancient political center of Kyushu, known as the \u0027Distant Imperial Court.\u0027 Today, it has been transformed into a spacious, open green park. Massive stone pillar bases remain scattered across lush lawns, exuding a rustic historical nostalgia. In spring, hundreds of cherry trees bloom into a sea of pink blossoms, while pink cosmos flowers bloom in autumn. It is a perfect spot for picnics, strolls, and reflecting on the glory of the Asuka and Nara periods.", "name": "Dazaifu Government Office Ruins Park", "transport": "About a 15-minute walk from \u0027Tofuro-mae Station\u0027 on the Nishitetsu Tenjin-Omuta Line, or take the Mahoroba Community Bus to \u0027Dazaifu Seicho-ato\u0027 stop."}, {"address": "883 Uchiyama, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Revered as a sacred mountain since ancient times, Mount Homan is an excellent destination for hiking and forest bathing. At its base lies Kamado Shrine, famous for match-making and warding off evil spirits. Its gardens feature abundant maple and ginkgo trees. In autumn, vibrant red and golden leaves envelope the shrine grounds, creating a magical atmosphere during evening illuminations. In summer, lush green forests and cool streams offer serene natural beauty year-round.", "name": "Mount Homan \u0026 Kamado Shrine Autumn Garden", "transport": "Take the Mahoroba Community Bus (Uchiyama Line) from Nishitetsu Dazaifu Station to the \u0027Kamado Shrine\u0027 stop."}, {"address": "3-8 Yoshimatsu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Built in 664 AD as a massive defensive embankment against foreign invasions, the Mizuki Ruins have been transformed into a natural park and green corridor. Stretching 1.2 km, the embankment features neatly planted trees and seasonal flowers. Every autumn, a spectacular field of pink cosmos blooms around the ruins, creating a picturesque pastoral view alongside the ancient earthworks\u2014a hidden gem for photographers and strollers.", "name": "Mizuki Ruins Park", "transport": "About a 10-minute walk from \u0027Mizuki Station\u0027 on the JR Kagoshima Main Line, or a 12-minute walk from Nishitetsu \u0027Mizuki Station\u0027."}, {"address": "Kanzeonji (Mount Shioji Summit Area), Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Spanning Dazaifu City and neighboring towns, Mount Shioji features the ruins of Iwaya Castle\u2014a historic Sengoku-period battlefield\u2014near its peak. Offering well-maintained hiking trails and observation decks, it commands a sweeping 360-degree panoramic view of Dazaifu, the Tsukushi Plain, and even downtown Fukuoka. The mountain retains pristine forests that change with the seasons, blazing with fiery autumn foliage. It is an ideal park for escaping the city hustle, enjoying outdoor hikes, and admiring stunning night views.", "name": "Mount Shioji \u0026 Iwaya Castle Ruins Park", "transport": "About a 15-minute taxi ride from Nishitetsu Dazaifu Station to the trailhead, or hike up along the Mount Shioji trail."}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Located near the entrance of Dazaifu Tenmangu, Shinji Pond is named for its shape resembling the kanji character for \u0027heart\u0027 (\u5fc3). Arched Taiko bridges representing the past, present, and future span the pond amidst lush greenery and swimming carp. Adjacent to it lies the Iris Garden, where roughly 30,000 iris plants across 55 varieties burst into purple and white blooms in early June, creating an elegant, romantic reflection on the water.", "name": "Dazaifu Tenmangu Shinji Pond \u0026 Iris Garden", "transport": "About a 3-minute walk from \u0027Dazaifu Station\u0027 on the Nishitetsu Dazaifu Line"}, {"address": "Uchiyama Area (Around Mount Homan Trailhead), Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Situated at the foot of Mount Homan, Dazaifu Citizen\u0027s Forest is a natural woodland park away from busy commercial streets. Rich in wild plants and mountain stream ecosystems, it features forest-bathing trails, camping areas, and rest pavilions. Distinct seasonal highlights include wild cherry blossoms in spring, fresh foliage and fireflies in summer, and rich autumn leaves. It is a wonderful destination for families to hike and enjoy a peaceful forest retreat.", "name": "Dazaifu Citizen\u0027s Forest Park", "transport": "Take the Mahoroba Community Bus from Nishitetsu Dazaifu Station to the \u0027Uchiyama\u0027 terminal, then walk about 10 minutes."}, {"address": "4-6 Kanzeonji, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Tofuro Ruins is an alternate name for the Dazaifu Government Office Ruins area. Surrounding the ancient palace remains, this square features expansive lawns and hundreds of tall cherry trees. From late March to early April, blooming cherry blossoms form a breathtaking floral tunnel, blanketing the ground in soft pink petals against the backdrop of Mount Shioji. Locals and tourists alike gather for picnics under the trees, taking in the unique harmony of ancient history and romantic nature.", "name": "Tofuro Ruins Cherry Blossom Square", "transport": "About a 12-minute walk from \u0027Tofuro-mae Station\u0027 on the Nishitetsu Tenjin-Omuta Line"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "3-2-43 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Masterfully designed by renowned Japanese architect Kengo Kuma, this store uses around 2,000 cedar wood beams woven together using traditional mortise-and-tenon joinery without a single screw. The result is a visually stunning geometric space with natural texture and transparency. Stepping inside feels like walking through a wooden tunnel filled with rich coffee aromas and warm lighting. As one of Japan\u0027s most iconic and must-visit concept stores, it is undoubtedly the top photo spot on Omotesando.", "name": "Starbucks Coffee Dazaifu Tenmangu Omotesando", "transport": "Approx. 3-minute walk from Nishitetsu Dazaifu Station"}, {"address": "4-7-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.6 Stars | In preparation for the 1,125th anniversary of Sugawara no Michizane\u0027s death in 2027, the main hall is undergoing a 3-year major renovation. Famous architect Sou Fujimoto designed this temporary hall based on the concept of a \u0027floating forest.\u0027 The roof is planted with seasonal greenery and flowers from the shrine grounds, showcasing a stunning modern aesthetic in harmony with nature. It attracts countless photography enthusiasts and tourists eager to capture this limited-time architectural wonder.", "name": "Dazaifu Tenmangu Temporary Hall", "transport": "Approx. 5-minute walk from Nishitetsu Dazaifu Station"}, {"address": "883 Uchiyama, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Nestled at the foot of Mount Homan, this thousand-year-old shrine is renowned for blessings in love and relationships, and blew up in popularity due to sharing its name with the main character of the hit anime \u0027Demon Slayer\u0027. The shrine office was redesigned by world-renowned interior designer Masamichi Katayama, blending minimalist modern luxury with pink marble and glass. Featuring a boutique-like amulet shop alongside breathtaking spring cherry blossoms and autumn foliage, it is the ultimate dreamy photo spot.", "name": "Homangu Kamado Shrine", "transport": "Take the \u0027Mahoroba\u0027 community bus from Nishitetsu Dazaifu Station and get off at Kamado-jinja-mae stop."}, {"address": "4-7-2 Ishizaka, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Japan\u0027s fourth national museum features a massive, curved blue glass curtain wall that blends seamlessly into the surrounding lush mountains. On clear days, the sky and hills reflect off the glass surface, creating a scene like a modern work of art. Inside, a futuristic, illuminated long-escalator tunnel connects the museum to Dazaifu Tenmangu. Both its sleek exterior and dramatic interior lighting make it a prime spot for capturing sophisticated modern aesthetics.", "name": "Kyushu National Museum", "transport": "Approx. 5-minute walk from the side of Dazaifu Tenmangu Main Hall via the moving walkway and escalator tunnel."}, {"address": "1-chome to 4-chome Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | A charming, traditional Japanese approach lined with stone torii gates and filled with traditional and creative shops. The quintessential photo here is holding a freshly baked Umegae Mochi\u2014crispy on the outside, soft inside, stamped with a plum blossom emblem\u2014framed against quaint street views or the massive stone torii gate. Lined with stylish gift shops and local snacks, strolling here offers fantastic travel photo opportunities at every turn.", "name": "Dazaifu Tenmangu Omotesando", "transport": "Located right outside Nishitetsu Dazaifu Station"}, {"address": "3-6-1 Sakamoto, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | The origin of Japan\u0027s era name \u0027Reiwa,\u0027 this shrine catapulted into national fame due to its connection to the Plum Blossom Banquet in the Man\u0027yoshu poetry anthology. This serene and charming shrine retains a tranquil, classical ambiance. Visitors can snap photos with a large \u0027Reiwa\u0027 ema (votive tablet) and stone monument. Its peaceful setting and rich literary heritage make it a must-visit spot for history lovers and travelers seeking hidden gems.", "name": "Sakamoto Hachimangu Shrine", "transport": "Approx. 15-minute walk from Nishitetsu Tofuro-mae Station, or take the community bus to Sakamoto Hachimangu-mae stop."}, {"address": "2-16-1 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Affectionately known as \u0027Kokedera\u0027 (Moss Temple), this is one of Kyushu\u0027s rare Zen temples famous for its Karesansui (dry landscape) gardens. The front garden features stone arrangements forming the character for \u0027Light\u0027, while the rear garden uses lush green moss for land and white sand for the sea to create a serene \u0027Drop of the Sea\u0027 garden. In autumn, vibrant red leaves scatter across the green moss, creating a breathtaking contrast that draws photographers to capture picture-perfect Japanese Zen moments.", "name": "Komyozenji Temple", "transport": "Approx. 5-minute walk from Nishitetsu Dazaifu Station"}, {"address": "4-7-8 Saifu, Dazaifu City, Fukuoka Prefecture", "feature": "\u2b50 4.0 Stars | Tucked away behind Dazaifu Tenmangu Shrine, this retro Showa-era amusement park boasts over 60 years of history. It preserves whimsical, nostalgic rides such as colorful mini trains, vintage carousels, and forest swing rides. The colorful attractions set against lush greenery make it easy to shoot retro, film-style aesthetic photos, making it a delightful surprise photo spot for influencers and families alike.", "name": "Dazaifu Yuenchi Amusement Park", "transport": "Approx. 8-minute walk from Nishitetsu Dazaifu Station"}], "name": "Popular Photo-Worthy Spots"}}, "name": "Dazaifu Historic and Cultural District"}, "hakata": {"categories": {"cat_1": {"items": [{"address": "1-41 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Kushida Shrine is the grand tutelary shrine of Hakata. Founded in AD 757, it is deeply cherished by local citizens. It is best known for the annual Hakata Gion Yamakasa Festival held every July. On display year-round within the shrine grounds is a magnificent \u0027Kazari Yamakasa\u0027\u2014a towering, exquisitely carved decorative float several meters high that offers a visually stunning experience. The grounds also feature a massive ginkgo tree over a thousand years old and the sacred Crane Well (Tsuru no Ido), where visitors pray for longevity and eternal youth. Attracting countless visitors praying for blessings every year, it stands as an iconic historical landmark to explore Hakata\u0027s traditional beliefs and festival culture.", "name": "Kushida Shrine", "transport": "About a 1-minute walk from Kushida-jinga-mae Station on the Nanakuma Subway Line, or about a 15-minute walk from JR Hakata Station."}, {"address": "2-4 Gokusho-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Founded in AD 806 by Kobo Daishi (Kukai), Tochoji Temple is one of Japan\u0027s oldest Shingon Esoteric Buddhist temples. Its grandest highlight is the Great Buddha of Fukuoka, standing 10.8 meters tall as the largest wooden seated Buddha in Japan, radiating a solemn and majestic aura. Beneath the statue lies the \u0027Hell and Paradise Pilgrimage\u0027 passage, where visitors walk through total darkness to find the light of paradise. Additionally, the temple grounds house a striking vermilion five-story pagoda exemplifying traditional craftsmanship and the Rokkakudo (Hexagonal Hall), a designated Cultural Property of Fukuoka City. The grounds are picturesque year-round, especially in spring when blooming cherry blossoms and the ancient pagoda weave a breathtaking ancient-capital atmosphere.", "name": "Tochoji Temple", "transport": "Directly accessible from Exit 1 of Gion Station on the Kuko Subway Line, or about a 10-minute walk from JR Hakata Station."}, {"address": "3-1-51 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Fukuoka\u0027s Sumiyoshi Shrine, alongside those in Osaka and Shimonoseki, is renowned as one of the \u0027Three Great Sumiyoshi Shrines of Japan\u0027 and boasts an ancient history. The main hall features the classic \u0027Sumiyoshi-zukuri\u0027 architectural style and is designated an Important Cultural Property of Japan, showcasing simple yet noble wooden structural art. The lush, serene grounds house a rare \u0027Ancient Sumo Wrestler Statue\u0027\u2014touching its palm is said to bring strength and good fortune. It is a popular sacred site for praying for maritime safety, good luck, warding off evil, and sumo success, offering a peaceful escape from urban hustle to deeply experience traditional Shinto culture.", "name": "Sumiyoshi Shrine", "transport": "About a 10-minute walk from the West Exit of JR Hakata Station, or take a Nishitetsu Bus to the \u0027Sumiyoshi\u0027 stop."}, {"address": "6-1 Gokusho-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Founded in AD 1195 by Master Eisai with patronage from Minamoto no Yoritomo, Shofukuji is Japan\u0027s first full-fledged Zen Buddhist temple. Designated a National Historic Site, it preserves the complete traditional Zen \u0027Garan\u0027 architectural layout, including the Sanmon gate, Buddha Hall, and Main Hall. Although the interior of the Main Hall is generally closed to the public, the temple grounds feature lush ancient trees, vibrant moss, and quiet stone pathways that create a tranquil, transcendent Zen atmosphere\u2014it is also famous as a haven for local cats. Visitors interested in history, architecture, and Zen philosophy should definitely not miss this historic temple.", "name": "Shofukuji Temple", "transport": "About a 5-minute walk from Gion Station on the Kuko Subway Line, or about a 12-minute walk from JR Hakata Station."}, {"address": "1-29-9 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1242 by Shoichi Kokushi, Jotenji Temple is one of the birthplaces of Hakata culture. It is said that Japan\u0027s production techniques for udon, soba, and yokan were brought back from Song Dynasty China by Shoichi Kokushi and handed down here, commemorated by a stone monument on-site marking the birthplace of udon and soba. Inside, the temple boasts the exquisite \u0027Shito-tei\u0027 dry landscape (Karesansui) garden, where white sand and blue stones interweave to recreate majestic waves. During the annual Hakata Light Up Festival in autumn, the temple is specially illuminated, showcasing an unparalleled classic beauty of night light and shadow.", "name": "Jotenji Temple", "transport": "About a 3-minute walk from Exit 4 of Gion Station on the Kuko Subway Line, or about an 8-minute walk from JR Hakata Station."}, {"address": "6-10 Reizenmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | The Hakata Machiya Folk Museum faithfully recreates the architecture and everyday scene of a traditional Meiji-era Hakata merchant house (machiya). The main structure was relocated and restored from authentic wooden townhouses of the period. The exhibition hall displays the craft processes of Hakata textiles (Hakata-ori) and Hakata dolls (Hakata ningyo), with veteran artisans demonstrating their masterful craft live. Here, visitors can not only appreciate traditional timber framing and space layouts up close, but also gain deep insights into Hakata dialect, festival culture, and traditional events, making it the finest venue to experience local history and architectural heritage.", "name": "Hakata Machiya Folk Museum (Hakata Machiya Furusatokan)", "transport": "About a 2-minute walk from Kushida-jinga-mae Station on the Nanakuma Subway Line, or about a 12-minute walk from JR Hakata Station."}, {"address": "13-6 Gokusho-machi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Myorakuji is a historic Rinzai Zen temple originally founded in 1316 that served as a pivotal base for trade and diplomacy between Japan, Song, and Ming China. Its most unique historical relic is the \u0027Hakata-bei\u0027 (Hakata earthen wall), constructed using recycled roof tiles destroyed in Sengoku-era war fires mixed with clay\u2014a testament to the resilience and resourcefulness of Hakata\u0027s people. The tranquil, lush grounds radiate a dignified and rustic aura, making it a hidden cultural jewel for exploring Hakata\u0027s trade history and ancient urban defensive architecture.", "name": "Myorakuji Temple", "transport": "About a 5-minute walk from Exit 1 of Gion Station on the Kuko Subway Line, or about a 12-minute walk from JR Hakata Station."}, {"address": "1-25-15 Katakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Hakata Hyakukura (Ishikura Brewery) is the only remaining sake brewery in Hakata, housed in a century-old building registered as a National Tangible Cultural Property of Japan. Built in the Meiji era, this old red-brick and traditional earthen storehouse (kura) structure impeccably preserves the historic appearance of traditional sake brewing facilities. Today, it not only continues to brew classic century-old sake and plum wine, but also repurposes the historic space into a tasting room, shop, and event venue. The red brick walls paired with white plaster earthen facades exude a rich Meiji and Showa nostalgic charm, offering a unique destination that blends heritage architecture with local food and drink culture.", "name": "Hakata Hyakukura (Ishikura Brewery)", "transport": "About a 7-minute walk from Chiyo-Kentcho-guchi Station on the Hakozaki Subway Line, or about a 5-minute taxi ride from JR Hakata Station."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "6-10 Reisenmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | The Hakata Machiya Folk Museum vividly recreates traditional Hakata townhouse architecture and lifestyles from the Meiji era. Inside, you\u0027ll find a rich collection of historical artifacts and videos detailing the famous Hakata Gion Yamakasa festival, along with live demonstrations by master artisans crafting traditional Hakata Ori textiles and Hakata Dolls. Visitors can observe the incredible craftsmanship up close or even join a hands-on workshop, making it one of the best cultural venues to deeply explore local history and heritage.", "name": "Hakata Machiya Folk Museum", "transport": "Approx. 15-minute walk from JR Hakata Station, or a 5-minute walk from Exit 2 of Gion Station on the Subway Kuko Line."}, {"address": "7th-8th Floor, Hakata Riverain, 3-1 Shimokawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located inside the Hakata Riverain building near Hakata Station, this is the world\u0027s only public museum dedicated exclusively to collecting and exhibiting modern and contemporary Asian art. Its rich and diverse collection features paintings, sculptures, and installation art from across Asia, displayed in spacious, modern galleries. Complete with a relaxed Art Cafe \u0026 Bookshop, it\u0027s a fantastic spot for art enthusiasts to feel the vibrant pulse of Asian creative culture.", "name": "Fukuoka Asian Art Museum", "transport": "Directly connected to Nakasu-Kawabata Station via the Subway Hakozaki or Kuko Line from JR Hakata Station, or about an 18-minute walk from Hakata Station."}, {"address": "13-6 Chikkohonmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A specialized museum dedicated to showcasing Hakata\u0027s iconic traditional crafts, focusing on historically rich \u0027Hakata Ori\u0027 woven textiles and lifelike \u0027Hakata Dolls\u0027 made of clay. The exhibits offer detailed insights into the complex crafting techniques and history of these national treasures. Regular special exhibitions feature contemporary artisans, creating an inspiring showcase of traditional craft fused with modern design\u2014perfect for lovers of fine Japanese handiwork.", "name": "Hakata Traditional Craft and Design Museum", "transport": "Take the Nishitetsu Bus from JR Hakata Station to \u0027Hakata Futo\u0027 bus stop, or take a taxi for about 10 minutes from Hakata Station."}, {"address": "2-4 Gokushomach\u014d, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Founded in 806 AD by Kobo Daishi (Kukai), this grand Shingon Buddhist temple houses the impressive 10.8-meter-tall wooden \u0027Fukuoka Great Buddha\u0027\u2014one of the largest seated wooden Buddha statues in Japan. Beneath the statue\u0027s base lies the famous \u0027Hell to Paradise\u0027 walkthrough, where visitors navigate a pitch-black corridor representing a philosophical journey from darkness into heavenly light. The stunning five-story pagoda and precious Buddhist artifacts make this a deeply moving visual and spiritual experience.", "name": "Tochoji Temple \u0026 Fukuoka Great Buddha", "transport": "Approx. 10-minute walk from JR Hakata Station, or a 1-minute walk from Exit 1 of Gion Station on the Subway Kuko Line."}, {"address": "1-29-9 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Jotenji is a historic Rinzai Zen temple famed as the birthplace of Japanese udon, soba noodles, and Hakata Ori weaving. The temple\u0027s \u0027Shito-tei\u0027 garden is a sublime dry landscape (karesansui) featuring white sand and giant stones symbolizing waves and mountains, expressing the pinnacle of Zen aesthetics. During the annual autumn \u0027Hakata Old Town Light-up\u0027, night illuminations transform the tranquil grounds into a breathtaking, mystical light spectacle.", "name": "Jotenji Temple (Dry Landscape Garden)", "transport": "Approx. 8-minute walk from the Hakata Exit of JR Hakata Station."}, {"address": "3-1-51 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located within the peaceful grounds of the ancient Sumiyoshi Shrine, this treasure house displays a valuable collection of designated Important Cultural Properties, including ancient Heian-period swords, ceremonial Kagura masks, historic manuscripts, and sacred festival documents. Though compact, the exhibits offer fascinating insights into Hakata\u0027s rich historical roots and religious heritage, serving as a cultural treasury for Kyushu history.", "name": "Sumiyoshi Shrine Treasure House", "transport": "Approx. 10-12 minute walk from the Hakata Exit of JR Hakata Station."}, {"address": "4-15 Tenyamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Tucked into a historic Hakata neighborhood, Catholic Hakata Church is a serene, historic Western-style church. Its Gothic-inspired structure features colorful stained-glass windows that cast mesmerizing, peaceful light patterns into the sanctuary when bathed in sunshine. Serving as an active place of worship, its elegant Western architecture stands out as a unique aesthetic highlight amid Hakata\u0027s traditional streets.", "name": "Catholic Hakata Church", "transport": "Approx. 15-minute walk from JR Hakata Station, or a 3-minute walk from Gofukumachi Station on the subway."}, {"address": "6-1 Gokushomach\u014d, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1195 by the priest Eisai, Shofukuji holds the distinction of being Japan\u0027s very first Zen temple and is designated a National Historic Site. Its classic Song-dynasty Zen architecture and tranquil, tree-filled grounds offer extraordinary peace and quiet. While the main hall interior is usually closed to the public, strolling through the expansive outdoor grounds feels like visiting an open-air museum of ancient architecture and nature.", "name": "Shofukuji Temple", "transport": "Approx. 12-minute walk from JR Hakata Station, or a 3-minute walk from Gion Station on the subway."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-1 Hakataeki Chuogai, Hakata Ward, Fukuoka, Fukuoka Prefecture (JR Hakata City Rooftop RF Floor)", "feature": "\u2b50 4.3 stars | An oasis in the sky located on the RF (rooftop) floor of JR Hakata City, offering breathtaking views overlooking Fukuoka City. The garden features the small \u0027Tsubame Shrine\u0027 (praying for maritime and traffic safety), a free mini train for children, vibrant seasonal flower beds, and lush green arcades. Visitors can gaze out at Fukuoka Tower, Hakata Bay, and even planes landing and taking off at the airport. It\u0027s an ideal spot to escape the station crowds, enjoy the cool breeze, and immerse yourself in seasonal greenery.", "name": "JR Hakata City Rooftop Garden (Tsubame-no-Mori Hiroba)", "transport": "Directly connected to JR Hakata Station; take the elevator to the rooftop RF floor."}, {"address": "2-10-7 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located near Sumiyoshi Shrine, Rakusuien is a classic Japanese stroll garden featuring a central pond, originally built as a villa for a Hakata merchant during the Meiji period. The garden boasts serene ponds, flowing waterfalls, unique rocks, moss, and seasonal foliage, with stunning autumn colors. Visitors can experience authentic matcha tea and seasonal Japanese sweets (wagashi) for a small fee at the traditional tea house \u0027Rakusuian\u0027, enjoying a tranquil Japanese garden aesthetic and tea culture.", "name": "Rakusuien Garden", "transport": "About a 12-minute walk from the Hakata Exit of JR Hakata Station; or take a Nishitetsu Bus to \u0027Sumiyoshi\u0027 stop and walk for 3 minutes."}, {"address": "1-9 Sanno, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A sizeable multi-purpose green park near Hakata Station, featuring spacious lawns, children\u0027s playground equipment, and a magnificent cherry blossom path. In spring, around 300 Yoshino cherry trees bloom, drawing crowds of locals and tourists for hanami (cherry blossom viewing) picnics. The park also houses the historical \u0027Hyugaoka Kofun\u0027 burial mound and Sanno Hiyoshi Shrine, adding a rich sense of history. It\u0027s a wonderful place to walk, exercise, and experience local laid-back city life.", "name": "Sanno Park", "transport": "About a 15-minute walk from the Chikushi Exit of JR Hakata Station; or take a Nishitetsu Bus to \u0027Sanno Koen-mae\u0027 stop."}, {"address": "7 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.9 stars | Nestled between Old Town Hakata and Nakasu, Reisen Park is an urban green space blending historical charm with vibrant local life. Shaded by trees, it offers wide walking paths and comfortable benches, becoming especially picturesque when cherry blossoms bloom in spring. The park serves as a key preparation and resting hub for major local festivals like the Hakata Gion Yamakasa. Surrounded by delicious, popular yatai (food stalls), it is a beloved spot for both locals and visitors.", "name": "Reisen Park", "transport": "About a 12-minute walk from the Hakata Exit of JR Hakata Station, or a 3-minute walk from Exit 5 of Nakasukawabata Station on the Subway Kuko Line."}, {"address": "1-7 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.8 stars | Situated at the confluence of the Naka and Hakata Rivers, Seiryu Park features beautiful waterfront views and broad riverside promenades. In the evening, cool breezes blow as the dazzling neon lights of Nakasu reflect off the water\u0027s surface. The park frequently hosts craft markets, music performances, and beer festivals. At night, the surrounding area turns into a famous hub for Hakata yatai (food stalls), making it the perfect spot to experience Hakata\u0027s nightlife, waterfront charm, and local culinary culture.", "name": "Seiryu Park", "transport": "About a 15-minute walk from the Hakata Exit of JR Hakata Station; or a 5-minute walk from Kushida Shrine-mae Station on the Subway Nanakuma Line."}, {"address": "1-13 Hakataekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.6 stars | Located near the Hakata Exit of Hakata Station next to Jotenji Temple, Dekimachi Park is a corner green space rich in historical heritage. Shaded by lush trees, it features monuments commemorating the birthplace of the Hakata Gion Yamakasa festival and the founder of Hakata-ori weaving. During the annual Yamakasa festival, it becomes an important practice ground for the float trial runs. On regular days, it acts as a tranquil oasis for local office workers on lunch breaks and travelers looking to rest while soaking in Hakata\u0027s traditional culture.", "name": "Dekimachi Park", "transport": "About a 6-minute walk from the Hakata Exit of JR Hakata Station, adjacent to Jotenji Temple."}, {"address": "1 Higashikoen, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Higashi Park is a spacious, historic prefectural park just one train stop away from Hakata Station. The park features lush pine groves, expansive lawns, and a beautiful lotus pond, making it a highly popular cherry blossom viewing spot in spring. At its center stand impressive statues of Emperor Kameyama (commemorating the Mongol invasions) and Nichiren Shonin, blending scenic nature with profound historical significance. It is a fantastic destination for a relaxing green stroll.", "name": "Higashi Park", "transport": "Take the JR Kagoshima Main Line for 1 stop from JR Hakata Station to Yoshizuka Station, then walk about 3 minutes."}, {"address": "3-2 Minoshima, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.7 stars | Located in the residential neighborhood of Minoshima south of Hakata Station, Minoshima Park extends along the Naka River. It features abundant foliage and flora, children\u0027s play facilities, and comfortable waterfront trails. A great spot to escape the bustling station area, it offers a slice of local daily life. Strolling through the park allows visitors to enjoy clear river streams and seasonal greenery, with the added bonus of visiting the nearby Minoshima Shopping Street, known for its charming Showa-retro vibe.", "name": "Minoshima Park", "transport": "About an 18-minute walk from the Hakata Exit of JR Hakata Station; or take a Nishitetsu Bus to \u0027Minoshima 3-chome\u0027 stop and walk for 2 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "JR Hakata City Rooftop, 1-1 Hakataekichuogai, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.3 stars | Located on the rooftop of the massive JR Hakata City commercial complex, this sky garden is a fantastic, free spot for panoramic photos overlooking Fukuoka city and Hakata Bay. The plaza features the Railway Shrine\u2014dedicated to safe maritime and land travel\u2014and the popular \u0027Tsubame\u0027 mini steam train that kids love riding. The highlight for photo enthusiasts is the multi-meter-high observation deck, offering a close-up view of Shinkansen and limited express trains coming and going from the station. Decorated with seasonal greenery and art installations, it offers a visual treat day and night.", "name": "JR Hakata City Rooftop Garden - Tsubame-no-Mori Hiroba", "transport": "Directly connected to JR Hakata Station. Take the AMU PLAZA elevator straight to the RF rooftop."}, {"address": "JR Hakata Station Square, 1-1 Hakataekichuogai, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.5 stars | Every autumn and winter, the plaza in front of Hakata Station lights up with hundreds of thousands of blue and white LED lights, transforming into a magical \u0027City of Light.\u0027 At the center stands a glittering, multi-meter Christmas tree, framed by sleek light corridors and a starry canopy, making it Fukuoka\u2019s hottest winter photo destination on social media. A European-style Christmas market is held simultaneously, offering mulled wine, German sausages, and handcrafted items, drawing thousands of visitors eager to capture the romantic festival atmosphere.", "name": "Hikari no Machi Hakata Winter Illuminations", "transport": "Located right outside the Hakata Exit of JR Hakata Station."}, {"address": "1F Entrance, KITTE Hakata, 9-1 Hakataekichuogai, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.1 stars | Standing right outside the 1st-floor entrance of the KITTE Hakata shopping center, this giant red-and-white 3D heart postbox is an iconic and adorable photo landmark around Hakata Station. Perched on top is the cute Hakata-exclusive mascot, \u0027Angel Post.\u0027 The pink and bright-red heart design symbolizes sending love and well wishes. Couples and influencers love taking photos here, and many visitors even post postcards to loved ones from this spot to send a token of love and blessings.", "name": "KITTE Hakata Heart Postbox", "transport": "About a 1-minute walk from the Hakata Exit of JR Hakata Station, right in front of the KITTE Hakata building."}, {"address": "Hakata Sennen-no-Mon, 1-chome Hakataekimae, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.2 stars | Completed in 2014, the \u0027Hakata Sennen-no-Mon\u0027 serves as a welcome gate to Hakata\u0027s historic temple district. Its architecture pays homage to the traditional wooden style of the ancient Tsujidoguchi-mon gate. Crafted from centuries-old Kyushu cypress, the balustrades and beams are intricately carved with traditional \u0027Hakata-ori\u0027 textile patterns, exuding timeless dignity. Blending ancient capital elegance with modern street views, it is the perfect starting point for photos and experiencing Hakata\u2019s rich history.", "name": "Hakata Sennen-no-Mon Gate", "transport": "About an 8-minute walk from the Hakata Exit of JR Hakata Station, or a 5-minute walk from Gion Station on the Subway Kuko Line."}, {"address": "2-4 Gokusho-machi, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.4 stars | Founded in 806 by Kukai (Kobo Daishi), this historic Shingon sect temple is one of Japan\u2019s oldest esoteric Buddhist sites. The main highlight for visitors is the 10.8-meter-tall \u0027Fukuoka Great Buddha,\u0027 carved from a single piece of cypress, flanked by over a thousand smaller Buddha statues in a solemn and awe-inspiring display. The temple grounds also feature a striking vermilion five-story pagoda and a unique \u0027Hell and Paradise\u0027 walkthrough corridor. During cherry blossom and autumn foliage seasons, the traditional pagoda framed by vibrant natural scenery makes it a dream spot for photographers.", "name": "Tochoji Temple \u0026 Fukuoka Great Buddha", "transport": "About a 1-minute walk from Exit 1 of Gion Station on the Subway Kuko Line, or a 10-minute walk from JR Hakata Station."}, {"address": "1-41 Kamikawabata-machi, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.4 stars | Affectionately known as \u0027Kushida-san\u0027 by Hakata locals, this grand guardian shrine serves as the main stage for the thrilling annual Hakata Gion Yamakasa Festival. Its standout attraction is the towering, intricately carved \u0027Kazariyamakasa\u0027 float on display year-round. Featuring detailed carvings of heroic warriors and legendary figures, it is an unmissable photo landmark in Hakata. The shrine grounds also house a well of longevity, strength-testing stones, and a 1,000-year-old ginkgo tree, immersing visitors in rich festival heritage.", "name": "Kushida Shrine \u0026 Giant Kazariyamakasa Float", "transport": "About a 1-minute walk from Kushida Shrine-mae Station on the Subway Nanakuma Line, or a 5-minute walk from Gion Station on the Subway Kuko Line."}, {"address": "1-1-29 Sumiyoshi, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.3 stars | As the oldest origin shrine among the more than 3,000 Sumiyoshi Shrines across Japan, it is designated as a National Important Cultural Property. The main hall features the rare and ancient \u0027Sumiyoshi-zukuri\u0027 architectural style, defined by sleek, elegant lines. A popular spot for visitors is the \u0027Ancient Rikishi (Sumo Wrestler) Statue\u0027 on the grounds\u2014touching its open palm is said to bestow power and courage. Surrounded by lush greenery, its serene atmosphere offers a peaceful glimpse into ancient Shinto culture.", "name": "Sumiyoshi Shrine (Chikuzen-no-Kuni Ichinomiya)", "transport": "About a 10-minute walk from the Hakata Exit of JR Hakata Station, or take a Nishitetsu Bus and get off at the Sumiyoshi stop."}, {"address": "JR Hakata City Rooftop, 1-1 Hakataekichuogai, Hakata-ku, Fukuoka-shi, Fukuoka", "feature": "\u2b50 4.2 stars | Tucked away in the \u0027Tsubame-no-Mori Hiroba\u0027 rooftop garden on top of JR Hakata City, this unique shrine is a popular hidden photo spot for travelers pray
