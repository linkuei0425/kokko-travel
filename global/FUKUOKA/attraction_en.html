: "\u2b50 4.0 stars | Located near the border of Kawabata and Nakasu, this urban oasis park is a beloved spot for locals and tourists alike. In spring, cherry blossoms bloom fully to form a romantic floral tunnel, making it a famous cherry blossom viewing spot in central Hakata. The park regularly hosts food festivals, beer festivals, and craft markets, offering a fresh, Japanese-style backdrop for lifestyle photos alongside nearby nostalgic streets.", "name": "Reisen Park", "transport": "About a 3-minute walk from Nakasu-Kawabata Station on the Airport Subway Line, or a 3-minute walk from Kushida Shrine Station on the Nanakuma Subway Line."}], "name": "Popular Photo Spots"}}, "name": "Nakasu, Kawabata, and Canal City Hakata"}, "tenjin": {"categories": {"cat_1": {"items": [{"address": "6-29 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Built in 1910 (Meiji 43), this French Renaissance-style wooden building is one of the few precious public structures surviving from Japan\u0027s Meiji era. Originally constructed as a guesthouse for the Kyushu-Okinawa Joint Exhibition, it once hosted the Crown Prince (later Emperor Taisho). The exterior features an elegant octagonal tower and romantic grayish-green wooden walls, while the interior preserves exquisite fireplaces, crystal chandeliers, and vintage wooden staircases. There is a classic caf\u00e9 inside where visitors can rent retro costumes for photos and enjoy a rich sense of Meiji-era romance.", "name": "Former Fukuoka Prefectural Public Hall Kihinkan", "transport": "About a 5-minute walk from Exit 16 of Subway Tenjin Station, or a 5-minute walk from Tenjin-Minami Station."}, {"address": "1-15-4 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Tucked away among the skyscrapers of Tenjin\u0027s bustling commercial district, this ancient shrine is the historic origin of the place name \u0027Tenjin\u0027. Dedicated to Sugawara no Michizane, the deity of learning, legend has it that while being exiled to Dazaifu, Michizane saw his own haggard reflection in the river water here, giving rise to the name \u0027Suikyo\u0027 (Water Mirror). The current main hall was built in the early Edo period (1612) when Nagamasa Kuroda, the first lord of the Fukuoka Domain, relocated it to its present site as an eastern guardian shrine for Fukuoka Castle. The vermilion main hall offers a tranquil and elegant contrast to the bustling surroundings, making it a sacred historic site for praying for academic success and peace of mind.", "name": "Suikyo Tenmangu Shrine", "transport": "About a 3-minute walk from Exit 12 of Subway Tenjin Station."}, {"address": "1-15-30 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Completed in 1909 (Meiji 42), this National Important Cultural Property was co-designed by Kingo Tatsuno\u2014a master of modern Japanese architecture who also designed Tokyo Station\u2014and Yasushi Kataoka. Featuring the iconic \u0027Tatsuno style\u0027, the building weaves red brick and white granite into vibrant stripe patterns, complemented by an elegant dome and spires for a rich English Neoclassical aesthetic. Originally used as the Kyushu branch of the Nippon Life Insurance Company, it has now been transformed into the Fukuoka City Literature Museum, open to the public for free. Its exquisite cast-iron staircases, marble fireplaces, and classic window frames beautifully showcase the brilliant charm of Meiji-era Western architecture.", "name": "Fukuoka City Red Brick Culture Center", "transport": "About a 1-minute walk from Exit 12 of Subway Tenjin Station."}, {"address": "2-2-20 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located adjacent to Nishitetsu Fukuoka (Tenjin) Station and Mitsukoshi Department Store, this shrine with over 400 years of history is celebrated as a sacred green oasis in the vibrant heart of Tenjin. Tracing its origins back to the era of Empress Jingu, it was relocated to its current site in 1608 by Nagamasa Kuroda, lord of the Fukuoka Domain, to serve as a guardian deity for warding off evil, granting victory, and dispelling misfortune. A unique feature within the grounds is a free footbath facility fed by an underground natural hot spring, allowing visiting citizens and tourists to relax their feet\u2014a perfect blend of ancient religious faith and modern urban relaxation needs.", "name": "Kego Shrine", "transport": "About a 1-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or a 3-minute walk from Subway Tenjin-Minami Station."}, {"address": "1-4 Jonai, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located in Maizuru Park just west of the Tenjin shopping district, this famous hilltop castle was built over seven years starting in 1601 by Kanbei Kuroda and his son Nagamasa Kuroda. It was once one of the largest castles in Kyushu, named after Fukuoka in Bizen Province, the ancestral home of the Kuroda clan. Although the main keep (Tenshukaku) is not fully preserved, impressive stone walls, moats, and several defensive turrets (yagura) designated as Important Cultural Properties\u2014such as Shiomi Yagura and Tamon Yagura\u2014still remain today. Ascending the keep\u0027s observation platform offers breathtaking panoramic views of the Tenjin shopping district and Ohori Park. In spring, over a thousand cherry trees bloom, making it a top choice for experiencing Fukuoka\u0027s Edo-period history and elegance.", "name": "Fukuoka Castle Ruins", "transport": "About an 8-minute walk from Subway Akasaka Station or Ohori Park Station."}, {"address": "1-15-24 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Tucked away in a corner of the Daimyo district\u2014the birthplace of Tenjin\u0027s fashion trends\u2014this ancient head temple of the Soto Zen sect was founded in the Muromachi period and later relocated to its present site when Nagamasa Kuroda built Fukuoka Castle. The temple grounds are exceptionally peaceful, creating a striking contrast with the trendy vintage clothing shops and caf\u00e9s of the surrounding Daimyo shopping area. Preserving a dignified Sanmon gate and a rustic main hall, the lush green grounds also house graves of notable figures connected to the history of the Fukuoka Domain, making it a unique historic spot to experience Zen serenity alongside the blend of past and present.", "name": "Ankokuji Temple", "transport": "About a 5-minute walk from Subway Akasaka Station, or an 8-minute walk from Subway Tenjin Station."}, {"address": "2-13-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Completed in 1975, this masterpiece of contemporary architecture was meticulously designed by Kisho Kurokawa, a master of modern Japanese architecture, and stands as one of Tenjin\u0027s most iconic Showa-era modernist landmarks. The building\u0027s defining feature is its avant-garde, massive cut-away semi-outdoor covered plaza (piloti), which generously opens up a large private portion of the commercial property to citizens as a public green space for relaxation. The exterior walls utilize distinctive, refined granite alongside bold geometric structures, seamlessly blending modern functionalism with the spatial philosophy of traditional Japanese \u0027intermediate space\u0027 (ma). It has won numerous honors, including the Architectural Institute of Japan Award.", "name": "Bank of Fukuoka Head Office Building", "transport": "Direct access from Exit 4 of Subway Tenjin Station."}, {"address": "1-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tenjin Central Park occupies the former site of the Fukuoka Prefectural Government, which served as the political and economic heart of Fukuoka Prefecture for a century from 1881 to 1981. After the government office was relocated in 1981, this area was redeveloped into an urban park combining historical commemoration with green leisure space. The park retains stone pillar ruins of the old prefectural office main entrance along with historical inscriptions, beautifully complementing the famous modern stepped green building \u0027ACROS Fukuoka\u0027 and the Meiji-era \u0027Kihinkan Guest House\u0027. Strolling through its lawns and groves offers a deep sense of Tenjin\u0027s historical journey from a political center to a modern, thriving commercial hub.", "name": "Tenjin Central Park \u0026 Former Prefectural Office Site", "transport": "About a 3-minute walk from Exit 16 of Subway Tenjin Station, or a 3-minute walk from Subway Tenjin-Minami Station."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "5-2-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located on the north side of Tenjin Central Park, this is Fukuoka\u0027s iconic public art museum. The collection features a rich array of modern works by artists closely tied to Fukuoka and Kyushu, including classic paintings by Yajuro Takashima. Beyond permanent exhibits, it frequently hosts special exhibitions and curated shows by local artists. With a quiet, elegant atmosphere, a comfortable library, and a cozy caf\u00e9, it\u0027s the perfect spot to slow down and immerse yourself in art right in the Tenjin shopping district.", "name": "Fukuoka Prefectural Museum of Art", "transport": "About a 10-minute walk from Exit East 1b of Tenjin Subway Station"}, {"address": "1-15-30 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Completed in 1909 (Meiji 42), this beautiful red-brick building was co-designed by Kingo Tatsuno\u2014the famous architect behind Tokyo Station\u2014and Yasushi Kataoka. Originally the Kyushu branch of Nippon Life Insurance, its style blends 19th-century British architectural elements with spires, pairing red bricks and white granite into a striking historical facade. Today, it houses the Fukuoka City Literature Hall, displaying local literary archives with free entry. The evening illumination makes it exceptionally romantic.", "name": "Fukuoka Akarenga Cultural Center", "transport": "About a 3-minute walk from Exit 16 of Tenjin Subway Station"}, {"address": "1-15-4 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Tucked away among the bustling skyscrapers of Tenjin, this ancient shrine is the very origin of the place name \u0027Tenjin.\u0027 Dedicated primarily to Sugawara no Michizane, the deity of learning, legend says that when Michizane was exiled to Kyushu, he gazed at his own weary reflection in a nearby river, giving rise to the name \u0027Suikyo\u0027 (water mirror). The vermilion torii gate and main hall stand out beautifully against modern buildings, offering a tranquil, solemn haven revered by students and locals alike.", "name": "Suikyo Tenmangu Shrine", "transport": "About a 3-minute walk from Exit 16 of Tenjin Subway Station"}, {"address": "2-2-20 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Situated in the heart of Tenjin next to Nishitetsu Fukuoka (Tenjin) Station and Kego Park, this millennium-old shrine dates back to Empress Jingu\u0027s era. It is dedicated to warding off evil, granting victory, and ensuring good health and safety. The shrine grounds feature a rare and popular public footbath (ashiyu) where visitors can soak their feet for free, seamlessly blending traditional worship with urban relaxation. Its beautifully designed Goshuin stamps and ema wooden plaques are also popular keepsakes for tourists.", "name": "Kego Shrine", "transport": "About a 1-minute walk from the South Exit of Nishitetsu Fukuoka (Tenjin) Station"}, {"address": "2-7-7 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Located in the trendy Daimyo district right next to the Tenjin shopping hub, this church serves as the cathedral of the Roman Catholic Diocese of Fukuoka. Originally established in 1896, the present modern Gothic-style sanctuary was completed in 1986. Featuring a soaring cross tower, serene interior, and exquisite stained-glass windows, it radiates a refined and pure religious artistic ambiance. Visitors are welcome to enter for quiet prayer or contemplation during weekdays\u2014a peaceful sanctuary amidst a busy commercial area.", "name": "Catholic Daimyomachi Church", "transport": "About a 5-minute walk from Exit 1 of Tenjin Subway Station"}, {"address": "1-1-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located inside ACROS Fukuoka\u2014Tenjin\u0027s iconic green landmark\u2014this comprehensive cultural hub combines art, traditional crafts, and travel information. The gallery regularly showcases traditional crafts from Fukuoka Prefecture and the broader Kyushu region, including exquisite Hakata dolls, Hakata-ori textiles, and Imari porcelain. Featuring hands-on craft areas and exhibition galleries, it also hosts special curated events that allow visitors to appreciate master craftworks up close. A must-visit destination for diving deep into Kyushu\u0027s rich heritage and aesthetics.", "name": "ACROS Fukuoka Cultural and Craft Gallery", "transport": "Directly connected to Exit 16 of Tenjin Subway Station"}, {"address": "7-8F Hakata Riverain, 3-1 Shimokawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located in the Hakata Riverain area within walking distance east of Tenjin, this is the world\u0027s only municipal museum exclusively dedicated to collecting and displaying modern and contemporary Asian art. Its collection features thousands of artworks from 23 Asian countries and regions, showcasing innovative styles and vibrant contemporary ideas. Alongside rich permanent and special exhibitions, the museum features a stylish Art Book Cafe offering tens of thousands of art books for free reading alongside scenic views of the streetscape, creating an intensely artistic atmosphere.", "name": "Fukuoka Asian Art Museum", "transport": "Directly connected to Exit 6 of Nakasu-Kawabata Subway Station (1 stop from Tenjin Station, or about a 10-minute walk)"}, {"address": "1-12-16 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Tucked in a corner of the trendy Daimyo shopping area in Tenjin, this ancient Soto Zen temple presents a striking contrast between past and present alongside stylish cafes and boutiques. Tracing its history back to the castle-building era of Kuroda Kanbei and Kuroda Nagamasa, the grounds house a historic Jizo Bodhisattva statue and a serene Japanese garden. Despite its proximity to the bustling shopping streets, stepping through the temple gates surrounds you with peace and tranquil harmony. The changing seasons bring different beauty to its gardens, making it a wonderful historical nook to discover while strolling through Tenjin.", "name": "Ankokuji Temple", "transport": "About a 7-minute walk from Exit 2 of Tenjin Subway Station"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-1 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | An urban oasis located in the heart of Fukuoka\u0027s Tenjin district, featuring expansive lawns and the famous step garden of \u0027ACROS Fukuoka.\u0027 Designed like a lush green hill covered in vegetation, this iconic building invites visitors to climb up for a sweeping panoramic view of the Tenjin skyline. Blooming with seasonal flowers year-round, it is one of Tenjin\u0027s premier cherry blossom spots in spring. Office workers and locals frequently gather here to picnic and relax, making it the most vibrant and refreshing city park in the area.", "name": "Tenjin Central Park", "transport": "About a 3-minute walk from Nishitetsu Fukuoka (Tenjin) Station, or direct access from Exit 16 of Subway Tenjin Station"}, {"address": "2-2 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located right next to Nishitetsu Fukuoka (Tenjin) Station and Mitsukoshi Department Store, this bustling plaza-style park lies at the very center of the Tenjin shopping district. Surrounded by major department stores and shopping centers, the park features relaxing seating, artistic sculptures, and lush greenery. In winter, it hosts a magical Christmas illumination festival, lighting up the entire park with tens of thousands of sparkling lights and transforming it into one of Tenjin\u0027s most romantic night spots.", "name": "Kego Park", "transport": "Located directly outside Nishitetsu Fukuoka (Tenjin) Station; about a 1-minute walk from Exit 6 of Subway Tenjin Station"}, {"address": "13-1 Nishinakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Situated on a triangular waterfront strip where the Yakuin Shinkawa and Naka Rivers meet, this scenic spot serves as an extension of Tenjin Central Park. It features \u0027SHIP\u0027S GARDEN,\u0027 a striking modern building shaped like a ship, complete with an open-air rooftop observation deck overlooking the beautiful Naka River. Offering an elegant and refreshing atmosphere with waterfront views, lush green amenities, and refined eateries, it is a wonderful place to catch a gentle breeze and enjoy the riverfront in Tenjin.", "name": "Tenjin Central Park - Suijo Park", "transport": "About a 5-minute walk from Exit 16 of Subway Tenjin Station, or a 4-minute walk from Subway Nakasu-Kawabata Station"}, {"address": "1-4 Jonai, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | A historic natural park centered around the ruins of Fukuoka Castle, located just a short subway ride or pleasant stroll from the Tenjin area. Preserving ancient castle walls and historic moats, the park is home to over 1,000 cherry blossom trees, making it Fukuoka\u0027s most famous spring blossom destination. Ascending the Tenshudai Lookout offers panoramic views of the lush greenery stretching across Tenjin and Ohori Park. With golden ginkgo and vibrant maple leaves adding rich historic charm in autumn, it is a must-visit landmark.", "name": "Maizuru Park", "transport": "About an 8-minute walk from Subway Akasaka Station or Ohorikoen Station"}, {"address": "1-2 Ohorikoen, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | A nationally renowned water park featuring a vast lake, located just west of the Tenjin commercial center. Centered around a massive pond with three small islands connected by elegant classical bridges, it offers a lakeside running track, swan boat rentals, and scenic waterfront walkways. The park also houses a traditional Japanese garden and a stylish caf\u00e9 designed by a famous Japanese architect. Whether enjoying a morning stroll, afternoon boating, or watching the sunset cast reflections on the water, it is the top choice for experiencing nature near Tenjin.", "name": "Ohori Park", "transport": "About a 3-minute walk from Exit 3 of Subway Ohorikoen Station"}, {"address": "5-2 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.8 stars | An urban green space situated on the northern side of Tenjin\u0027s core district, adjacent to the Fukuoka Prefectural Museum of Art. Shaded by tall trees and covered with open grass, the park features a fountain, an outdoor music hall, and peaceful walking paths. Far removed from the hustle and bustle of downtown Tenjin, it serves as a quiet hidden haven for locals to exercise and soak up the sun\u2014perfect for taking a relaxing green break after shopping.", "name": "Suzaki Park", "transport": "About a 10-minute walk from Exit 1 of Subway Tenjin Station"}, {"address": "1-7 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 3.9 stars | A narrow waterfront park stretching along the Naka River on Tenjin\u0027s eastern border, right next to Canal City Hakata and the Nakasu district. Stone-paved paths and manicured greenery line the riverbank. At night, it offers stunning views of the vibrant yatai food stalls and sparkling city lights across the river. Frequently hosting outdoor music markets and seasonal events, it is an ideal spot to experience Fukuoka\u0027s unique riverside charm and urban greenery.", "name": "Seiryu Park", "transport": "About a 7-minute walk from Subway Nakasu-Kawabata Station, or a 10-minute walk from the core Tenjin area"}, {"address": "7 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | A classic urban park located between Tenjin and Hakata, just steps away from eastern Tenjin. Shaded by leafy trees, it features a spacious central plaza and recreational facilities, serving as a beloved hidden cherry blossom spot for locals in spring. Every summer, it acts as a key venue for the famous \u0027Hakata Gion Yamakasa\u0027 festival, seamlessly blending lush greenery with the rich cultural tradition of Hakata.", "name": "Reisen Park", "transport": "About a 3-minute walk from Subway Nakasu-Kawabata Station, or a 12-minute walk from the Tenjin Underground Shopping Mall exits"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Underground 1-3, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Modeled after 19th-century European architecture, the Tenjin Underground Shopping Mall spans about 600 meters directly through the heart of Tenjin. Featuring cobble-paved walkways, classical ornate iron archways, elegant stained glass skylights, and dark-toned murals, it exudes a strong retro European vibe. Here, even the restrooms and manhole covers are designed with exquisite aesthetics, making it an unmissable photo backdrop for hipsters and fashion lovers visiting Tenjin\u2014offering shots with both exotic flair and modern urban charm.", "name": "Tenjin Underground Shopping Mall (Tenjin Chikagai)", "transport": "Direct access upon exiting Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027 or Fukuoka City Subway \u0027Tenjin Station\u0027"}, {"address": "6-29 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located next to Tenjin Central Park, this French Renaissance-style wooden building built in 1909 is designated as an Important Cultural Property of Japan. Its gorgeous wooden octagonal tower, romantic veranda, and striking green and yellow exterior walls radiate a rich Meiji-era retro exotic charm. The hall also offers French retro costume try-ons and an exquisite cafe, attracting countless visitors to take photos in elegant gowns and capture timeless, picturesque moments.", "name": "Former Fukuoka Prefectural Hall Public Hall Kihinkan", "transport": "Approx. 5-minute walk from Subway Hakozaki Line \u0027Nakasu-Kawabata Station\u0027, or 8-minute walk from \u0027Tenjin Station\u0027"}, {"address": "1-1-1 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Hailed as the \u0027Green Pyramid\u0027 in the heart of downtown Tenjin, ACROS Fukuoka seamlessly blends modern architecture with natural ecology. The south side is covered with over 37,000 plants, extending from the ground up to the rooftop to form a massive stepped hill. Climbing the walkway to the rooftop observation deck allows you to capture striking views where architecture meets lush greenery, as well as panoramic views of Hakata Bay and Fukuoka City. Whether shooting up at the massive green architectural facade or snapping high-angle views of the cityscape, it\u0027s a popular social media photo spot.", "name": "ACROS Fukuoka Step Garden", "transport": "Direct access from Exit 16 of Subway Kuko Line \u0027Tenjin Station\u0027"}, {"address": "1-15-30 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Designed in 1909 by renowned architect Kingo Tatsuno (designer of Tokyo Station), this Meiji-era building formerly served as the Kyushu Branch of Nippon Life Insurance. Its red brick exterior interwoven with white granite, domed towers, and fine classical lines showcase top-tier British Neo-Renaissance architectural beauty. When illuminated at night, the red bricks glow brilliantly and romantically under warm lights, making it one of the most eye-catching vintage cultural landmarks in the Tenjin shopping district.", "name": "Fukuoka City Red Brick Culture Museum", "transport": "Approx. 5-minute walk from Subway Kuko Line \u0027Tenjin Station\u0027"}, {"address": "2-2-20 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away right in the vibrant core of Tenjin\u0027s commercial district, this ancient shrine creates a striking contrast between modern high-rises and traditional torii gates. Dedicated to deities for warding off evil and securing victory, its elegant wooden main hall and verdant grounds are perfect for capturing atmospheric shrine photos. Most unique is the free natural footbath on the grounds, allowing tired shoppers to soak their feet while taking photos\u2014a popular spot combining traditional culture with relaxation.", "name": "Kego Shrine and Footbath", "transport": "Approx. 1-minute walk from the South Exit of Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027"}, {"address": "2-2 Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located adjacent to Kego Shrine and Solaria Plaza, this open plaza park is a favorite among local youth and tourists in Tenjin. The center features a spacious green lawn and geometrically designed walkways, offering the best perspective to admire Tenjin\u0027s urban cityscape. Every winter, a grand and dazzling Christmas light display (Illumination) takes place here, with tens of thousands of neon lights turning the park into a dreamlike world of light and shadow, attracting lovers and influencers alike for night photos.", "name": "Kego Park", "transport": "Direct access upon exiting Nishitetsu \u0027Fukuoka (Tenjin) Station\u0027"}, {"address": "Around the intersection of Watanabe-dori and Showa-dori, 2-Chome Tenjin, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A signature photo spot demonstrating Fukuoka\u0027s unique nightlife culture. As dusk falls, rows of lively wooden food stalls (Yatai) pop up along Watanabe-dori and Showa-dori in Tenjin. Warm cloth noren curtains, steaming bowls of ramen, and merry crowds weave a nostalgic Showa-era atmosphere reminiscent of a Japanese TV drama scene. Snapping a photo of steaming tonkotsu ramen or posing with the Yatai owner is a dream item for experiencing local Fukuoka culture.", "name": "Tenjin Yatai Street", "transport": "Approx. 1-3 minute walk from Subway Kuko Line \u0027Tenjin Station\u0027"}, {"address": "2-6-11 Daimyo, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Adjoining the core area of Tenjin, the Daimyo shopping district is the birthplace of Fukuoka\u0027s youth trend culture. It\u0027s packed with graffiti walls, independent boutique stores, vintage American clothing shops, and Instagrammable cafes, making every corner a perfect street style backdrop. Among them, \u0027Fukuoka Growth Next\u0027\u2014repurposed from a century-old elementary school\u2014is a must-visit for vintage enthusiasts, preserving Showa-style wooden school buildings and stairs while incorporating modern startup cafes, radiating a unique fusion of old and new charm.", "name": "Daimyo Trendy Alleyways \u0026 Former Daimyo Elementary School (Fukuoka Growth Next)", "transport": "Approx. 5-7 minute walk from Subway Kuko Line \u0027Akasaka Station\u0027 or \u0027Tenjin Station\u0027"}], "name": "Popular Photo Spots"}}, "name": "Tenjin Core Commercial District"}};

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;

            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';

            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
