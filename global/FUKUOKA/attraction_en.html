ing for safe journeys and smooth transit. Designed by famed designer Eiji Mitooka, the shrine features three lined-up wooden torii gates alongside charming statues of children with hands folded in prayer. The approach is decorated with train track elements, perfectly blending modern railway culture with traditional Shinto faith.", "name": "Railway Shrine (Tetsudo Shrine)", "transport": "Directly connected to JR Hakata Station. Take the AMU PLAZA elevator to the RF rooftop garden (Tsubame-no-Mori Hiroba)."}], "name": "Popular Photo Spots"}}, "name": "Hakata Station Area"}, "itoshima": {"categories": {"cat_1": {"items": [{"address": "4227 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Built in Keicho 15 (1610) by order of Kuroda Nagamasa, the first feudal lord of the Fukuoka Domain, Sakurai Shrine is an ancient shrine with profound historical significance and spiritual importance in the Itoshima region. The shrine\u0027s architectural style is elegant and solemn, designated as an Important Cultural Property of Japan. Behind the shrine, Sakurai Daijingu was constructed using the same architectural techniques as the Ise Grand Shrine, emanating a deeply sacred and solemn atmosphere. It is not only a sacred place to pray for good matches and warding off evil, but also a top choice for travelers visiting Itoshima to experience its rich historical and cultural heritage.", "name": "Sakurai Shrine", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus \u0027Shima Line\u0027 to \u0027Sakurai\u0027 stop, then walk about 10 minutes."}, {"address": "102 Raizan, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Boasting a long history of over 1,700 years, Raizan Sennyoji Daihioin Temple was founded by the high Indian monk Seiga Shonin. The temple houses a 4.6-meter-tall standing wooden statue of the Thousand-Armed Kannon, an Important Cultural Property designated by Japan, carved with magnificent detail that inspires awe. In the center of the temple garden stands a giant maple tree over 400 years old (a designated Natural Monument of Fukuoka Prefecture). Every autumn when the leaves turn vivid red, the entire garden resembles a carpet of crimson silk, creating extraordinary, breathtaking scenery. It is the most famous ancient historical temple and autumn foliage spot in the Itoshima area.", "name": "Raizan Sennyoji Daihioin Temple", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus \u0027Raizan Line\u0027 to \u0027Raizan Kannon-mae\u0027 stop."}, {"address": "2143-1 Nijofukae, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Perched on a small hill along the Fukae coast of Itoshima, Chinkaiseki Hachimangu Shrine traces its history back to ancient legends of Empress Jingu\u0027s eastern expedition. Legend has it that Empress Jingu placed calming stones (Chinkaiseki) here to pray for safe childbirth and victory in battle, prompting later generations to build a shrine in her honor. From the observation deck beside the shrine, you can look out over the vast Genkai Sea and coastline, perfectly combining blue ocean views with historic relics. It is not only a famous shrine for praying for fertility and safe delivery, but also a fantastic hidden spot to enjoy breathtaking sunsets.", "name": "Chinkaiseki Hachimangu Shrine", "transport": "About a 15-minute walk from JR Chikuzen-Fukae Station."}, {"address": "916 Ihara, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Itokoku Historical Museum is an important landmark for delving into the history of ancient \u0027Itokoku\u0027 as documented in the Gishiwajinden (Records of Wei). The museum houses and displays a vast array of precious artifacts excavated from surrounding burial mounds such as the Hirabaru Ruins, including the largest Naikokawamon Mirror (a National Treasure) in Japan. The museum building features sleek, modern lines, while the top-floor observation deck offers sweeping views of the entire Mikumo and Ihara ruins complex as well as the Itoshima plain, seamlessly bridging ancient civilization with the contemporary landscape.", "name": "Itokoku Historical Museum", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus \u0027Iharayama Line\u0027 to \u0027Itokoku Historical Museum\u0027 stop."}, {"address": "1-1 Arita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | The Hirabaru Ruins are the royal tomb site dating from the late Yayoi period to the early Kofun period, widely believed to be the tomb of the queen of ancient Itokoku. As many as 40 bronze mirrors were excavated here, including the Naikokawamon Mirror\u2014reputed to be the largest in Japan\u2014making it of immense value for studying Yamatai Kingdom and ancient Japanese history. Today, the site has been converted into a lush historical park, framed by vibrant rape blossoms in spring and cosmos flowers in autumn, blending ancient history with natural floral beauty into an incomparably tranquil landscape.", "name": "Hirabaru Historical Park", "transport": "About a 10-minute ride by community bus or taxi from JR Hatae Station."}, {"address": "1578 Takaso, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Nestled at the foot of Mount Takaso, Takaso Shrine has a long history as the ancestral shrine of the ancient Ito District. The shrine area was once the site of Takaso Castle, built by the Harada clan during the Kamakura period, exuding a rich historical fortress atmosphere. The \u0027Takaso Kagura\u0027 dance held every April and October has been designated an Intangible Folk Cultural Property of Itoshima City, preserved for hundreds of years. The shrine pavilion is remarkably well-preserved, surrounded by towering trees that create a serene, solemn ambience, making visitors feel as though they\u0027ve stepped back in time into medieval Japan.", "name": "Takaso Shrine", "transport": "About a 10-minute taxi ride from JR Susenji Station."}, {"address": "1232 Shima Moroyoshi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located at the base of Mount Keya, known as the \u0027Itoshima Fuji\u0027, Keya Shrine is an ancient shrine with a thousand-year history. Primarily dedicated to the deity of pioneering, its sanctuary stands quietly amidst a lush green forest, radiating a deep, serene, and sacred atmosphere. The large torii gate at the shrine\u0027s entrance contrasts beautifully with the majestic mountain peak behind it, making it a key starting point and historic landmark along the Mount Keya hiking trail, drawing travelers who enjoy deep cultural heritage and scenic nature trails.", "name": "Keya Shrine", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus \u0027Keya Line\u0027 to \u0027Keya Tozanguchi\u0027 stop, then walk about 5 minutes."}, {"address": "432 Mikumo, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Sazareishi Shrine is an ancient shrine recorded in the Engishiki Jinmyocho, boasting a very long history. It enshrines Konohanasakuya-hime and Ninigi-no-Mikoto, and is revered as a sacred spot for praying for romance, marital harmony, and prosperous descendants. Within the grounds stand two massive, ancient camphor trees whose trunks are interconnected, known as the \u0027Husband and Wife Camphors\u0027. Their resilient vitality and magnificent posture leave visitors in awe. Though modest in size, its tranquil, rustic charm and rich historical origins make it an unmissable cultural stop in the Itoshima area.", "name": "Sazareishi Shrine", "transport": "From JR Hatae Station, take the community bus to \u0027Mikumo\u0027 stop, then walk about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "916 Ihara, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A specialized history museum displaying rich archaeological artifacts and national treasure-class large bronze mirrors from ancient Itokoku. The museum features interactive multimedia exhibit areas and an observation platform offering magnificent views of the Itoshima Plain and distant coastline.", "name": "Itokoku Historical Museum of Itoshima City", "transport": "Take the JR Chikuhi Line to Hatae Station, transfer to the Itoshima City Community Bus, and get off at \u0027Itokoku Historical Museum\u0027 station."}, {"address": "2691 Imazu, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Built in 1927, this red-brick Gothic church is a historically significant religious building in the Fukuoka suburbs. Its elegant pointed arch windows and vintage sanctuary convey a solemn and peaceful artistic atmosphere.", "name": "Imazu Catholic Church", "transport": "Take the JR Chikuhi Line to Kyudai-Gakkentoshi Station, transfer to the Showa Bus Imazu Line to \u0027Imazu\u0027 station, and walk about 5 minutes."}, {"address": "357 Noko, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | A private history and art museum set against the ocean views of Nokonoshima Island. It displays historical artifacts, literary paintings, and folk arts related to Hakata Bay, rich in coastal artistic and cultural charm.", "name": "Noko Museum", "transport": "Take the ferry from Meinohama Ferry Terminal to Nokonoshima Ferry Terminal, then transfer to the Nishitetsu Bus and get off at \u0027Noko Museum-mae\u0027 station."}, {"address": "4227 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Designated as an Important Cultural Property, this classical shrine complex was founded by Tadayuki Kuroda in 1632. Combining Momoyama-style intricate carvings with sacred architecture, it showcases high aesthetic craftsmanship and rich historical legacy.", "name": "Sakurai Shrine Cultural Architecture", "transport": "Take the JR Chikuhi Line to Chikuzen-Maebaru Station, transfer to the Showa Bus Sakurai Line to \u0027Sakurai Jinja-mae\u0027 station, and walk about 3 minutes."}, {"address": "615 Raizan, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 stars | A temple cultural space housing a 4.6-meter-tall wooden standing statue of the Thousand-Armed Kannon (an Important Cultural Property) and numerous ancient Buddhist statues. The grounds offer pleasant seasonal views, where brilliant autumn foliage creates a stunning contrast with ancient Buddhist sculptures.", "name": "Sennyoji Daihioin Temple Art \u0026 Artifacts", "transport": "Take the JR Chikuhi Line to Chikuzen-Maebaru Station, transfer to the Showa Bus Raizan Line to \u0027Raizan Kannon-mae\u0027 station, and walk about 5 minutes."}, {"address": "30 Shima Hatsu, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | An artistic space bringing together works from dozens of local Itoshima artists and artisans. Featuring exquisite ceramics, wood carvings, and textured textiles, it vividly conveys the creative vitality of this coastal countryside.", "name": "Itoshima Arts and Crafts Gallery", "transport": "Take the JR Chikuhi Line to Chikuzen-Maebaru Station, transfer to the Showa Bus Shima Line to \u0027Hatsu\u0027 station, and walk about 8 minutes."}, {"address": "561 Shiraito, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | A cozy art gallery situated at the boundary between Itoshima\u0027s forests and coastline. It showcases furniture, everyday utensils, and artistic carvings crafted from high-quality local timber, filled with a rich woody aroma and handcrafted natural aesthetics.", "name": "Kinoka Woodcraft Gallery", "transport": "Take the JR Chikuhi Line to Chikuzen-Maebaru Station; taking a taxi or driving (approx. 15 minutes) is recommended."}, {"address": "744 Motooka, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | An academic museum located on Kyushu University\u0027s Ito Campus, exhibiting rich geological fossils, archaeological relics, and academic specimens. It offers an in-depth exhibition experience for visitors interested in knowledge and historical artifacts.", "name": "Kyushu University Museum - Ito Campus", "transport": "Take the JR Chikuhi Line to Kyudai-Gakkentoshi Station, transfer to the Showa Bus, and get off at \u0027Kyudai Sogo Kenkyu Hakubutsukan-mae\u0027 station."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Sakurai Futamigaura is one of Itoshima\u0027s most iconic landmarks, famous for its \u0027Meoto Iwa\u0027 (Couple Stones) and a pristine white torii gate standing in the sea. Framed by the deep blue ocean and sky, the torii exudes a sacred presence. At sunset, watching the sun sink precisely between the two giant rocks offers a breathtaking view recognized as one of Japan\u0027s Top 100 Sunsets. With well-paved coastal walkways and stylish ocean-view cafes along the shore, it is an absolute must-visit natural wonder when exploring Itoshima.", "name": "Sakurai Futamigaura Couple Stones (Meoto Iwa)", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus Nogita Line to \u0027Imuta\u0027 or \u0027Sakurai Futamigaura\u0027 bus stop."}, {"address": "Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Keya no Oto is one of Japan\u0027s three major basaltic sea caves, featuring dramatic basalt sea erosion formations. Following the tree-covered path within Keya no Oto Park, dense branches arch overhead to create a lush green tunnel reminiscent of iconic scenes from Hayao Miyazaki\u0027s My Neighbor Totoro\u2014earning it the affectionate nickname \u0027Totoro Forest.\u0027 Reaching the observation deck rewards visitors with sweeping, panoramic views of the Genkai Sea, combining mystery and natural grandeur.", "name": "Keya no Oto \u0026 Totoro Forest Trail", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus Keya Line to the \u0027Keya\u0027 terminal, then walk for about 10 minutes."}, {"address": "Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.6 Stars | Standing at roughly 210 meters above sea level, Mount Tateishi is a popular and easy low-altitude hiking spot in Itoshima. A short 15-to-20-minute hike brings you to the giant boulder area at the peak. From the summit, enjoy a stunning 270-degree panoramic view of the coastline, capturing Keya no Oto, Niginohama Coast, and crescent-shaped bays. The photo perspectives from atop the giant rocks are incredibly dramatic, making this a hidden paradise for photographers and outdoor enthusiasts.", "name": "Mount Tateishi", "transport": "Driving is recommended (approx. 1 hour from downtown Fukuoka); alternatively, take a bus to Keya Station and walk to the trailhead."}, {"address": "460-6 Shiraito, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located halfway up Mount Hagane, Shiraito Falls boasts a 24-meter drop, with water trickling down the cliff like delicate white silk threads, offering distinct charm across all seasons. In summer, it becomes a cool, refreshing retreat adorned with vibrant blooming hydrangeas, where visitors can enjoy fun activities like flowing somen noodles and rainbow trout fishing. In autumn, the area is enveloped in rich red foliage, creating a peaceful atmosphere ideal for family outings and nature immersion.", "name": "Shiraito Falls", "transport": "From JR Chikuzen-Maebaru Station, take the Showa Bus Shiraito Line and get off at \u0027Shiraito Falls\u0027 stop."}, {"address": "Coastline from Shima Nogita to Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Stretching approximately 6 kilometers, Niginohama is a beautiful crescent-shaped white sand beach connecting Keya no Oto and Nogita Coast, recognized among Japan\u0027s Top 100 White Sands and Green Pines. Known for its strong waves, it is a renowned surfing hot spot in Fukuoka. Minimal light pollution and sweeping views also make it an ideal location for watching golden sunsets and starry night skies. Walking along the soft sand while listening to the crashing waves allows you to experience Itoshima\u0027s raw, unadulterated nature.", "name": "Niginohama Coast", "transport": "Driving is recommended; drive along Prefectural Route 54 coastal highway to reach points along the shore."}, {"address": "Nijo Shikaka, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Anegohama is an exceptionally rare \u0027singing sand\u0027 beach in Kyushu. As visitors walk across its white shore, friction causes the sand to emit a musical squeaking or rustling sound. This phenomenon only occurs when the seawater and sand are exceptionally clean and unpolluted. Facing the Genkai Sea, it is also a romantic destination for watching the sun sink into the ocean horizon, filled with poetic charm and natural wonder.", "name": "Anegohama Beach", "transport": "Take the JR Chikuhi Line to \u0027Shikaka Station\u0027, then walk about 20 minutes."}, {"address": "Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Located in the center of the Itoshima Peninsula at an elevation of about 244 meters, Mount Hizan is a hidden viewpoint offering sweeping vantage points over the entire Itoshima coastline and bays. Near the summit lies a paragliding launch pad providing unobstructed panoramas of the arc-shaped shore where blue skies, turquoise sea, and lush greenery meet. Since vehicles can drive close to the top, it has recently emerged as a viral, hidden-gem spot for ocean-view photography on social media.", "name": "Mount Hizan Observatory", "transport": "Driving is recommended; follow the mountain road to near the radio tower at the peak, then walk about 5 minutes to reach the open viewpoint."}, {"address": "Kaburi, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.0 Stars | Perched on a hill overlooking Kaburi Bay, Kaburi Park is home to numerous azalea bushes and cherry trees that burst into vibrant pinks and deep reds every spring. An observation deck on the high ground offers distant views of calm Kaburi Bay and Himeshima Island off in the distance. The shifting light over the ocean during early morning and dusk is enchanting. With its tranquil surroundings, the park is a quiet retreat for locals and in-the-know travelers seeking a peaceful stroll.", "name": "Kaburi Park", "transport": "Take the JR Chikuhi Line to \u0027Kaburi Station\u0027, then walk about 15 minutes."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "4448 Shima Sakurai, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Sakurai Futamigaura is Itoshima\u0027s most iconic landmark, selected as one of \u0027Japan\u0027s Top 100 Beaches\u0027 and \u0027Japan\u0027s Top 100 Sunsets\u0027. A pure white torii gate stands gracefully in the azure ocean, with the sacred Married Couple Rocks tightly linked by a giant shimenawa rope behind it. As dusk falls, the setting sun aligns perfectly between the two rocks, casting a sacred glow of golden and purple hues that draws countless photography enthusiasts and couples. With several ocean-view cafes along the surrounding coast, this is an absolute must-visit spot when traveling to Itoshima.", "name": "Sakurai Futamigaura Couple Rocks", "transport": "Take the Showa Bus \u0027Nogita Line\u0027 from JR Chikuzen-Maebaru Station, get off at \u0027Imuta\u0027 stop, and walk for about 30 minutes; or driving / renting a car is recommended."}, {"address": "2195-3 Oda, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located on the sandy beach next to the seafood restaurant \u0027Uosho\u0027, this double wooden swing strung between two naturally leaning palm trees exudes tropical resort vibes. Swinging gently against the backdrop of the blue Genkai Sea allows you to capture dreamy photos that look as if you are floating over the ocean\u2014making it a wildly popular spot on Instagram. In addition to the double swing, there are uniquely shaped rocks and other fun wooden play equipment, perfect for families and friends to take memorable photos together.", "name": "Palm Tree Swing", "transport": "Take the Showa Bus \u0027Noshinoura Line\u0027 from JR Kyudai-gakuentoshi Station, get off at \u0027PALM BEACH\u0027 or \u0027Miyanoura\u0027 stop, and walk for about 5 minutes."}, {"address": "641-20 Noshinoura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | JIHANGUN is an outdoor art park along the Itoshima coast themed around \u0027giant objects\u0027, deriving its name from the Japanese word for vending machine (\u0027Jihanki\u0027). The park features a giant yellow swing, an oversized vending-machine-shaped frame, a pink Anywhere Door, and geometric frame installations, transforming an ordinary coastline into a magical photo studio. Each installation perfectly frames the sky and ocean, allowing anyone to effortlessly snap trendy, stylish photos with a modern design feel.", "name": "JIHANGUN Art Installation Park", "transport": "Take the Showa Bus \u0027Noshinoura Line\u0027 from JR Kyudai-gakuentoshi Station, get off at \u0027Noshinoura\u0027 stop, and walk for about 3 minutes."}, {"address": "285-b Noshinoura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located on the seawall below the PALM BEACH The Gardens complex, these colorful angel wings were custom-painted by a famous Japanese mural artist. Standing in front of the wall with open arms against the backdrop of the blue sea and white sand lets you capture photos that look as if you\u0027ve grown wings to soar over the ocean. The complex also gathers gelato shops, an ocean-view Italian restaurant, and a Boston lobster eatery\u2014perfect for enjoying the sea breeze and delicious food on the open terrace after taking your photos.", "name": "PALM BEACH Angel Wings", "transport": "Take the Showa Bus \u0027Noshinoura Line\u0027 from JR Kyudai-gakuentoshi Station and get off at \u0027PALM BEACH\u0027 stop."}, {"address": "698 Shima Keya, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Located next to the National Natural Monument \u0027Keya no Oto\u0027, this mysterious tree tunnel features low, intertwining holly branches that form a natural green archway. Walking through feels like stepping into the secret path to Totoro\u0027s home in the Ghibli animated movie. Emerging from the green tunnel via stairs brings you to an observatory overlooking the vast blue Genkai Sea and magnificent sea caves. Blending a magical atmosphere with breathtaking natural scenery, it is a highly famous hidden photo gem in Itoshima.", "name": "Keya no Oto Totoro Forest Observatory", "transport": "Take the Showa Bus \u0027Keya Line\u0027 from JR Chikuzen-Maebaru Station to the last stop \u0027Keya\u0027, and walk for about 10 minutes to reach the trail entrance."}, {"address": "2289-6 Shima Nogita, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.0 Stars | A vibrant red vintage double-decker London bus parked along the Shima coastline in Itoshima, set against an unbeatable ocean view and clear blue skies, offering striking color contrast and exotic charm. Visitors can buy delicious espresso and handcrafted gelato, then head up to the seating area on the first or second floor of the bus to gaze out at the vast sea through the windows. The bus exterior and the adjacent small lawn are popular photo backdrops, making this the prettiest rest stop on an Itoshima coastal road trip.", "name": "London Bus Cafe", "transport": "Driving or renting a car is recommended (go straight along Fukuoka Prefectural Route 54); or take a taxi for about 20 minutes from JR Chikuzen-Maebaru Station."}, {"address": "284 Noshinoura, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Founded in 1990, Beach Cafe SUNSET is a pioneer among Itoshima\u0027s ocean-view cafes. On the beach across from the cafe stands an exquisite, giant wooden picture frame. The frame perfectly captures the distant Sakurai Futamigaura Couple Rocks, blue sky, and sea, creating a natural painting. At sunset, the wooden frame turns into a black silhouette while the background is painted in brilliant orange and red, evoking a poetic and romantic atmosphere. The cafe itself offers rich Southeast Asian-inspired dishes and refreshing drinks, with outdoor patio seating providing the best vantage point to enjoy the sunset.", "name": "Beach Cafe SUNSET Wooden Photo Frame", "transport": "Take the Showa Bus \u0027Noshinoura Line\u0027 from JR Kyudai-gakuentoshi Station, get off at \u0027PALM BEACH\u0027 stop, and walk for about 3 minutes."}, {"address": "460-6 Shiraito, Itoshima City, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located halfway up Mount Hagane, Shiraito Waterfall features a 24-meter drop where water cascades down like countless fine white silk threads, surrounded by lush forests and crystal-clear streams rich in negative ions. In summer, this is a wildly popular summer retreat where you can experience refreshing nagashi somen (flowing bamboo noodles), fish for yamame (cherry salmon), and take cool, refreshing photos amidst green foliage and splashing waterfalls. In autumn, the surrounding forest turns brilliant shades of red, offering another poetic and colorful landscape.", "name": "Shiraito Waterfall", "transport": "Take the Showa Bus \u0027Shiraito Line\u0027 from JR Chikuzen-Maebaru Station and get off at \u0027Shiraito no Taki\u0027 stop (check seasonal timetables), or driving is recommended."}], "name": "Top Instagrammable Spots"}}, "name": "Itoshima Coastal Scenic Area"}, "momochi": {"categories": {"cat_1": {"items": [{"address": "2-3-26 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Built in 1989 to commemorate the Asia-Pacific Exposition, Fukuoka Tower stands tall on the Momochihama waterfront. Reaching a total height of 234 meters, it is the tallest seaside tower in Japan. Covered with over 8,000 half-mirror glass sheets, its futuristic triangular prism design has earned it the nickname \u0027Tower of Mirrors.\u0027 The building perfectly blends late 20th-century modernist engineering with urban landscape design. At night, themed light illuminations change with seasons and festivals, making it the most eye-catching modern architectural landmark along the Momochihama coastline.", "name": "Fukuoka Tower", "transport": "Take the Nishitetsu Bus from JR \u0027Hakata Station\u0027 or \u0027Tenjin Station\u0027 and get off at \u0027Fukuoka Tower Minamiguchi\u0027 station."}, {"address": "2-2-2 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Opened in 1993, Fukuoka Dome is Japan\u0027s first and currently only multi-purpose stadium featuring a retractable roof, serving as the home stadium for the Fukuoka SoftBank Hawks. This massive modern dome structure has a diameter of 222 meters and a height of 84 meters. Its unique metallic dome design creates an impressive presence along the Momochihama Bay. The surrounding area features the \u0027Warm Hands Plaza\u0027 and various commemorative sculptures. The roof can be opened when weather permits, marking a milestone in the history of modern mega sports architecture in Japan.", "name": "Mizuho PayPay Dome Fukuoka", "transport": "About a 15-minute walk from Exit 3 of Tojinmachi Station on the Subway Airport Line, or take the Nishitetsu Bus and get off at \u0027PayPay Dome\u0027 station."}, {"address": "3-1-1 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Like Fukuoka Tower, Fukuoka City Museum was created for the 1989 Asia-Pacific Exposition, originally serving as the expo\u0027s main pavilion before officially transitioning into a museum in 1990. The grand building is known for its impressive water features and majestic modern-classical architecture. Inside, it houses the National Treasure \u0027King of Na Gold Seal,\u0027 highlighting Fukuoka\u0027s illustrious history as Japan\u0027s gateway to continental Asia. The spacious stone courtyard reflecting off the water makes it an elegant architectural representative of the Momochi area\u0027s rich cultural heritage.", "name": "Fukuoka City Museum", "transport": "About a 15-minute walk from Exit 1 of Nishijin Station on the Subway Airport Line, or take a bus to \u0027Fukuoka City Museum Disaster Prevention Center\u0027 station."}, {"address": "2-1-17 Imagawa, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Torikai Hachimangu Shrine boasts a history of over 1,700 years and has long been revered as a sacred site for matchmaking and warding off evil. Recently, its main hall underwent a buzzworthy modern rebuilding project. Renowned architects combined traditional woodworking with contemporary minimalist aesthetics, utilizing abundant natural Kyushu cedar to create a brand-new main shrine full of modern flair and playful light and shadows. This fusion of old and new breaks away from the heaviness of traditional shrines, preserving ancient stone railings and sacred trees while breathing new architectural vitality into this historic shrine.", "name": "Torikai Hachimangu Shrine", "transport": "About a 7-minute walk from Tojinmachi Station or Nishijin Station on the Subway Airport Line."}, {"address": "2-902-1 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Built in 1989 directly in the center of Momochihama Beach, Marizon is Japan\u0027s first commercial complex constructed over the water on a pier. Designed in a romantic Southern European Mediterranean village style, its pale yellow exterior walls and spired chapel stand proudly between the blue sky and ocean, creating a distinctive European-style coastal view. This iconic landmark features ocean-view restaurants and a waterfront wedding chapel, and also serves as the ferry pier connecting Momochihama to Uminonakamichi Seaside Park, seamlessly integrating into Momochihama\u0027s coastal landscape design.", "name": "Marizon (Sea Wedding \u0026 Commercial Complex at Momochi Seaside Park)", "transport": "About a 3-minute walk from Fukuoka Tower to the central pier on the beach."}, {"address": "6-2-92 Nishijin, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located in the Nishijin area adjacent to Momochihama, this red-brick building was constructed in 1921 (Taisho 10) and designed by the renowned American architect W.M. Vories, originally serving as the main building for Seinan Gakuin. The edifice showcases a classic Taisho-era Western retro style, featuring red-brick walls, arched window frames, and an elegant tower, and is designated as a Tangible Cultural Property of Fukuoka City. Admission is free, presenting Christian cultural history and university heritage. It stands as the most remarkably preserved century-old Western-style building in the Momochi-Nishijin area.", "name": "Seinan Gakuin University Museum [Main Building / Old Main Hall]", "transport": "About a 5-minute walk from Exit 1 of Nishijin Station on the Subway Airport Line."}, {"address": "6-2-92 Nishijin, Sawara Ward, Fukuoka City, Fukuoka Prefecture (Inside Seinan Gakuin University Stadium)", "feature": "\u2b50 4.0 stars | The Genko Boryui are stone defense wall ruins built over a 20-kilometer stretch along Hakata Bay by the Kamakura Shogunate in the 13th century to defend against the second Mongol invasion. The defense wall ruins in the Nishijin area, located on the campus of Seinan Gakuin University, are among the best-preserved sections and have been designated a National Historic Site of Japan. Visitors can witness the original high stone walls built over 700 years ago and their cross-sectional structure, authentically showcasing the military architectural wisdom of Kamakura-era Japan and the strategic historical value of Hakata Bay.", "name": "Genko Boryui Ruins (Nishijin Area)", "transport": "About a 10-minute walk from Exit 1 of Nishijin Station on the Subway Airport Line."}, {"address": "Around 2-chome to 4-chome Nishijin, Sawara Ward, Fukuoka City, Fukuoka Prefecture (Along Nishijin Shopping Street)", "feature": "\u2b50 3.8 stars | The Karatsu Kaido was a key overland highway during the Edo period connecting Hakata with Saga\u0027s Karatsu Domain, and Nishijin-shuku was the first post town (inn station) on this route adjacent to the Hakata castle town. Although Nishijin has now developed into a bustling commercial and academic district, traces of old merchant buildings, commemorative stone monuments, and the old Nishijin Shopping Street arcade remain along the old highway. Preserving the bustling prosperity of travelers and merchants from the Edo period, it serves as an important cultural landmark connecting Momochihama\u0027s modern architecture with ancient Hakata history.", "name": "Karatsu Kaido Nishijin-shuku Historic Site", "transport": "Located right outside Nishijin Station on the Subway Airport Line."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "3-1-1 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Fukuoka City Museum is the most iconic cultural landmark in the Momochihama area. Its permanent exhibition, themed \u0027Encounters and Exchanges,\u0027 systematically showcases Fukuoka\u0027s long history as Japan\u0027s hub for international communication. The museum\u0027s most notable National Treasure is the Gold Seal of \u0027King of Na of Wa, Han Dynasty\u0027, a valuable artifact verifying ancient diplomatic ties between China and Japan. Additionally, a massive Kakiyama float used in Fukuoka\u0027s famous Hakata Gion Yamakasa festival is on display, allowing visitors to experience the vibrant festival spirit up close. The majestic building features an expansive outdoor pond and walking paths, alongside multilingual audio guides\u2014making it perfect for a half-day deep dive into Hakata\u0027s rich history and culture.", "name": "Fukuoka City Museum", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station (Exit 1) and walk for about 15 minutes, or take a Nishitetsu Bus to \u0027Fukuoka City Museum\u0027 stop."}, {"address": "4F BOSS E\u30fbZO FUKUOKA, 2-2-6 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 Stars | Located on the 4th floor of BOSS E\u30fbZO FUKUOKA next to the Fukuoka PayPay Dome, the Sadaharu Oh Baseball Museum is a must-visit sanctuary for baseball fans. It features two main zones: the \u0027Sadaharu Oh History Museum\u0027, which meticulously documents the legendary life of the world\u0027s home run king with rare gear, medals, and personal photographs; and \u002789 Park\u0027, an interactive area with simulated pitching mounds, speed guns, catching simulators, and fun baseball challenges. Seamlessly blending historical artifacts with modern digital tech, the museum highlights the glory of the Fukuoka SoftBank Hawks and the timeless charm of baseball.", "name": "Sadaharu Oh Baseball Museum", "transport": "Take the Fukuoka City Subway Kuko Line to Tojinmachi Station (Exit 3) and walk for about 15 minutes, or take a Nishitetsu Bus to \u0027PayPay Dome-mae\u0027 stop and walk for about 3 minutes."}, {"address": "5F BOSS E\u30fbZO FUKUOKA, 2-2-6 Jigyohama, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 Stars | Created by the renowned art collective teamLab, \u0027teamLab Forest Fukuoka\u0027 on the 5th floor of BOSS E\u30fbZO FUKUOKA is an immersive light museum combining digital tech with natural ecology. The exhibition is divided into two areas: \u0027Catching and Collecting Forest\u0027 and \u0027Athletics Forest\u0027. In the former, visitors use a smartphone app to catch and collect digital light-created animals to build their own encyclopedia. The Athletics Forest encourages spatial perception through 3D terrain, bouncing mats, and mesmerizing light effects. Beyond being a photogenic hot spot, it delivers a truly awe-inspiring sensory experience.", "name": "teamLab Forest Fukuoka", "transport": "Take the Fukuoka City Subway Kuko Line to Tojinmachi Station and walk for about 15 minutes, or take a Nishitetsu Bus to \u0027PayPay Dome-mae\u0027 stop and walk for about 3 minutes."}, {"address": "6-2-92 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Located in the academic district of Nishijin near Momochihama, the Seinan Gakuin University Museum is housed in a historic 1921 Tudor Revival red-brick building, designated as a Tangible Cultural Property of Fukuoka City. Dedicated to the theme of \u0027Judaism and Christian Culture\u0027, it houses ancient Bible manuscripts, religious paintings, historical maps, and artifacts related to Christianity in Japan (including fumi-e and Hidden Christian history). With free entry and a serene, elegant atmosphere, it is a wonderful spot to immerse yourself in academic heritage and religious art.", "name": "Seinan Gakuin University Museum", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station (Exit 1) and walk for about 5 minutes."}, {"address": "6-2-92 Nishijin, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | The Seinan Gakuin University Chapel is an iconic piece of modern Christian architectural art in the Nishijin-Momochihama area. Featuring a grand hall with beautiful architectural lines, it houses a magnificent pipe organ with outstanding acoustics, frequently hosting high-caliber organ recitals and classical music concerts. Its elegant red-brick exterior and geometric lines make it a distinctive urban landmark. Visitors during open hours can experience its solemn religious atmosphere and enjoy a peaceful, soul-soothing cultural experience.", "name": "Seinan Gakuin University Chapel", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station (Exit 1) and walk for about 5 minutes."}, {"address": "3-7-1 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 Stars | Situated next to Fukuoka Tower and Fukuoka City Museum, the Fukuoka City Public Library is not only a well-stocked public library but also an essential archive for Asian cinema. It features a specialized theater called \u0027Cine-la,\u0027 which regularly screens classics by renowned directors, independent films, and restored historical movies from Asia and around the world. The bright, spacious interior includes thematic exhibitions and audio-visual zones, making it a peaceful sanctuary for art lovers and cinema enthusiasts.", "name": "Fukuoka City Public Library Cine-la", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station and walk for about 15 minutes, or take a Nishitetsu Bus to \u0027Fukuoka City Museum\u0027 or \u0027Fukuoka Tower\u0027 stop and walk for about 3 minutes."}, {"address": "1-5-15 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 Stars | Located in the scenic, modern residential area of Momochihama, Fukuoka Momochihama Gospel Christ Church is a warm, modern community church. Featuring a clean, minimalist exterior and a cozy sanctuary hall, it serves as a peaceful retreat for both locals and visitors. Alongside regular Sunday services, the church hosts community concerts, cultural lectures, and exchange events, reflecting the diverse and inclusive community spirit of the Momochihama district.", "name": "Fukuoka Momochihama Gospel Christ Church", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station and walk for about 12 minutes, or take a Nishitetsu Bus to \u0027Momochihama 1-chome\u0027 stop and walk for about 3 minutes."}, {"address": "1-3-3 Momochihama, Sawara Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 Stars | Located in the Momochihama district, the Fukuoka City Disaster Prevention Center is an educational center combining disaster-prevention technology with fun interactive learning. Free to enter, it offers realistic simulation facilities, including an earthquake simulator, a storm experience room, a smoke maze, and hands-on fire extinguisher practice. Guided by professional staff and interactive exhibits, visitors gain practical knowledge about disaster preparedness. Great for families, it offers a uniquely educational and valuable public experience.", "name": "Fukuoka City Disaster Prevention Center", "transport": "Take the Fukuoka City Subway Kuko Line to Nishijin Station (Exit 1) and walk for about 10 minutes, or take a Nishitetsu Bus to \u0027Momochihama 1-chome\u0027 stop and walk for about 2 minutes."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "2-902-1 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Seaside Momochi Seaside Park is Fukuoka City\u0027s most iconic urban beach park, located just north of Fukuoka Tower. Featuring a vast artificial sand beach and clear blue ocean views, its center houses \"Marizon,\" a resort-style floating facility with European architecture that exudes a romantic holiday atmosphere. Loved by locals and tourists alike, it\u0027s a fantastic spot for enjoying the seamless blue skies and sea by day, or watching a golden sunset in the evening.", "name": "Seaside Momochi Seaside Park", "transport": "Take a Nishitetsu Bus from JR Hakata Station or Tenjin Station to \u0027Fukuoka Tower (TNC TV Building)\u0027 stop, then walk about 3 minutes."}, {"address": "2 Jigyohama, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Adjacent to the Fukuoka PayPay Dome and the large MARK IS shopping center, Jigyohama Beach is a sandy green expanse stretching along the east side of Momochihama. Quieter than the main Momochihama area, it offers an elegant environment for walking, jogging, and taking in panoramic bay views. Well-maintained wooden boardwalks and benches line the coast, where visitors can gaze out at the dazzling night view of Hakata Bay and the majestic dome building in the evening.", "name": "Jigyohama Beach", "transport": "About a 15-minute walk from Exit 3 of Tojinmachi Subway Station, or take a bus and get off at \u0027PayPay Dome-mae\u0027."}, {"address": "3-2 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Located in the heart of the Momochihama residential and academic district, Momochi Central Park sits adjacent to the Fukuoka City Public Library and Fukuoka City Museum. The park features a spacious lawn plaza, tree-lined walkways, and children\u0027s playground equipment, with seasonal foliage displaying vibrant colors year-round. It is a popular green oasis for locals to walk dogs, exercise, or picnic, exemplifying a high-quality natural escape within modern Fukuoka.", "name": "Momochi Central Park", "transport": "Take a Nishitetsu Bus to \u0027Fukuoka City Museum\u0027 or \u0027Consulate-General of the Republic of Korea\u0027 stop, then walk about 2 minutes."}, {"address": "Riverbanks spanning from Muromi 5-chome to Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Extending along the estuary where the Muromi River meets Hakata Bay, Muromi River Park sits just west of Momochihama. The riverbanks feature excellent cycling and jogging paths. In spring, cherry blossoms bloom along the river, while early summer brings traditional icefish fishing scenes and rich birdwatching opportunities. It is a fantastic riverside sanctuary to feel gentle breezes and watch the sun set over distant mountains.", "name": "Muromi River Park", "transport": "About an 8-minute walk from Muromi Subway Station, or a 15-minute walk from Fukuoka Tower."}, {"address": "2-7-1 Atago, Nishi Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Perched atop the hill of Atago Shrine southwest of Momochihama, Mount Atago Park is a natural hilltop park offering stunning elevated views of the Momochihama coast, Fukuoka Tower, and the Hakata Bay nightscape. The summit is densely wooded and blooms with around 2,000 cherry trees and azaleas in spring, making it a historic and popular spot in Fukuoka for viewing blossoms and night vistas. The panorama of modern Fukuoka Tower alongside the sea creates an astonishing view.", "name": "Mount Atago Park", "transport": "About a 20-minute walk from Exit 1 of Muromi Subway Station, or take a bus and get off at \u0027Atago Jinja-mae\u0027."}, {"address": "Boundary of Jigyohama 1-chome, Chuo Ward and Momochihama 1-chome, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Situated at the border of Momochihama and Jigyohama, Hiikawa River Estuary Park is a waterfront area formed where the Hii River flows into Hakata Bay. Featuring walking paths and observation decks along the riverbanks, the estuary is rich in wildlife and frequently hosts resting and soaring waterfowl. Connecting two major landmarks\u2014Fukuoka Tower and PayPay Dome\u2014it is a hidden gem for photography enthusiasts looking to capture sunset over the bay and the city skyline.", "name": "Hiikawa River Estuary Park", "transport": "Take a Nishitetsu Bus to \u0027Iryo Center-mae (Medical Center)\u0027 stop, then walk about 5 minutes."}, {"address": "1-3 Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located near Seinan Gakuin University and Momochihama coast, Seinan Seaside Park is a belt-shaped green park combining an academic atmosphere with natural scenery. Planted with extensive windbreak forests and coastal flora, it offers pavilions and pleasant grassy lawns. Students and nearby residents often come here to read, exercise, or relax; its peaceful environment provides a quiet green sanctuary within the bustling coastal district.", "name": "Seinan Seaside Park", "transport": "About a 12-minute walk from Exit 1 of Nishijin Subway Station, or take a bus and get off at \u0027Seinan Chuko-mae\u0027."}, {"address": "2-chome Momochihama, Sawara Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Momochi Greenway Park is a tree-lined avenue weaving between high-rises, museums, and seaside parks in Momochihama. Lined with neat rows of trees that change colors with the seasons, it seamlessly connects urban architecture with coastal nature. Strolling along the greenway allows visitors to appreciate contemporary Fukuoka\u0027s refined urban planning while having easy access to the nearby beach, making it a delightfully pleasant walking route.", "name": "Momochi Greenway Park", "transport": "About a 2-minute walk from Fukuoka Tower, or take a Nishitetsu Bus directly to \u0027Fukuoka Tower\u0027 stop."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2-3-26 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Standing at 234 meters, this is Japan\u0027s tallest seaside tower. Its exterior is covered with over 8,000 half-mirrors, creating a unique triangular prism structure that earned it the nickname \u0027Tower of Mirrors\u0027. The illumination at night changes according to seasons and holidays, making it Fukuoka\u0027s most iconic photo landmark. The observation deck features a designated \u0027Lover\u0027s Sanctuary\u0027 with heart lock walls and arch decorations, offering a 360-degree panoramic view of Hakata Bay and Fukuoka city\u2014a highly popular romantic spot.", "name": "Fukuoka Tower", "transport": "Take the Nishitetsu Bus to \u0027Fukuoka Tower (TNC TV Building)\u0027 stop; located right outside"}, {"address": "2-2 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | An artificial beach park located north of Fukuoka Tower, featuring a spacious sandy shore extending along Hakata Bay. It combines water sports facilities, stylish seaside restaurants, and open-air cafes. The view at sunset, where the sea meets the sky, is dreamy and magical. Strolling along the beach or posing against the coastal embankment makes it easy to capture stylish, Instagram-worthy photos.", "name": "Seaside Momochi Seaside Park", "transport": "About a 3-minute walk from the Nishitetsu Bus \u0027Fukuoka Tower Minamiguchi\u0027 stop"}, {"address": "2-902-1 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located in the center of Seaside Momochi Seaside Park, Marizon is Japan\u0027s first commercial complex built over the water. Its Mediterranean-style European architecture paired with the blue sky and sea feels like a European coastal town. The floating wedding chapel at the end of the pier exudes romance, capturing stunning photos whether drenched in daytime sunlight or glowing under evening sunset lights.", "name": "Marizon", "transport": "About a 5-minute walk from the Nishitetsu Bus \u0027Fukuoka Tower\u0027 stop"}, {"address": "2-2-2 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Japan\u0027s first retractable-roof multi-purpose stadium and home to the Fukuoka SoftBank Hawks professional baseball team. The dome\u0027s grand architecture is impressive, and the \u0027Warm Hand Plaza\u0027 near the entrance features handprint sculptures of world-renowned celebrities and athletes, attracting countless sports fans and tourists to take photos shaking hands with their icons.", "name": "Mizuho PayPay Dome Fukuoka", "transport": "About a 15-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway"}, {"address": "2-2-6 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | A high-tech entertainment landmark adjacent to the PayPay Dome. The rooftop features thrilling attraction experiences called \u0027Zekkei 3 Brothers\u0027, including an open-air zip line and rail slide. The building also houses the immersive digital light art exhibition \u0027teamLab Forest Fukuoka\u0027, whose vibrant light shows and interactive installations make it one of Fukuoka\u0027s hottest visual hotspots.", "name": "BOSS E\u30fbZO FUKUOKA", "transport": "About a 15-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway"}, {"address": "2-2-1 Jigyohama, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | The largest shopping complex in the Momochihama area, featuring over 160 specialty shops. Built with a bright and airy modern green architectural design, its atrium and rooftop gardens feature photogenic seating areas and trendy cafes, making it a great spot for both shopping and stylish street-style photography near the dome.", "name": "MARK IS Fukuoka Momochi", "transport": "About a 10-minute walk from Exit 3 of Tojinmachi Station on the Fukuoka City Subway"}, {"address": "3-1-1 Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Featuring a modern architectural design with reflective water features, its grand marble pillars complement the expansive plaza fountain out front, attracting many architecture and photography enthusiasts. The museum houses Japan\u0027s National Treasure\u2014the Gold Seal of the King of Na\u2014as well as cultural artifacts like the Hakata Gion Yamakasa, offering a rich atmosphere of history, culture, and aesthetics.", "name": "Fukuoka City Museum", "transport": "About a 2-minute walk after taking the Nishitetsu Bus to \u0027Fukuoka City Museum Disaster Prevention Center\u0027 stop"}, {"address": "Area from Nishijin to Momochihama, Sawara-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | The birthplace of inspiration for Machiko Hasegawa, author of Japan\u0027s beloved national manga \u0027Sazae-san\u0027. This 1.6-kilometer tree-lined pedestrian street connects Nishijin Station to the Momochihama coast. Along the way, cute bronze statues of Sazae-san and her family, monuments, and playful street signs can be found, making it a delightful hidden spot for a stroll and fun photos.", "name": "Sazae-san Street", "transport": "The street begins right outside Exit 1 of Nishijin Station on the Fukuoka City Subway"}], "name": "Popular Photo Spots"}}, "name": "Momochihama, Fukuoka Tower, and Dome Area"}, "nakasu_canal": {"categories": {"cat_1": {"items": [{"address": "1-41 Kamikawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Serving as the grand guardian shrine of Hakata, Kushida Shrine boasts a long history and deep reverence among locals. It enshrines Amaterasu Omikami, Ohatamushi no Omikami, and Masaaka Agatsu Kachihayahi Amenooshihomimi no Mikoto. The shrine is most famous for hosting the annual Hakata Gion Yamakasa festival every July. Elaborately carved \u0027Kazariyamakasa\u0027 floats standing several meters high are displayed on the grounds year-round for visitors to admire up close. Additionally, it features the \u0027Reisen Tsuru no Ido\u0027 (Well of Longevity) and the historical Hakata Museum, making it the top choice for experiencing Hakata\u0027s traditional spiritual heritage and architectural beauty.", "name": "Kushida Shrine", "transport": "About a 5-minute walk from Exit 2 of Gion Station on the Subway Kuko Line, or a 1-minute walk from Kushida-jinja-mae Station on the Nanakuma Line."}, {"address": "6-10 Reisenmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Reconstructed from traditional Meiji-era merchant houses (machiya), this museum perfectly preserves the original wooden architecture and charm of historic Hakata. The exhibition halls document the daily life, traditional crafts, and historical changes of Hakata residents during the Meiji and Taisho periods. Live demonstrations by artisans crafting traditional items like Hakata Hariko (paper-m\u00e2ch\u00e9) and Hakata Dolls are held regularly. Visitors can immerse themselves in the merchant prosperity and folklore of old Hakata, with a gift shop selling authentic local handicrafts\u2014making it an essential cultural landmark for exploring the city\u0027s heritage.", "name": "Hakata Machiya Folk Museum", "transport": "About a 5-minute walk from Exit 2 of Gion Station on the Subway Kuko Line, or a 2-minute walk from Kushida-jinja-mae Station on the Nanakuma Line."}, {"address": "1-15-30 Tenjin, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Completed in 1909 (Meiji 42), this grand red-brick building was designed by Kingo Tatsuno\u2014the renowned architect behind Tokyo Station\u2014alongside Yasushi Kataoka as the former Kyushu Branch of Nippon Life Insurance. Featuring the iconic \u0027Tatsuno Style\u0027 with red brick walls, white granite striping, and a classic dome, it exudes a strong Meiji-era European retro charm and is designated an Important Cultural Property of Japan. Free to enter, it preserves elegant wooden staircases, Western-style interiors, and exhibition spaces. Beautifully illuminated at night, it serves as a romantic historic landmark along the Naka River in Nakasu.", "name": "Fukuoka City Red Brick Cultural Hall", "transport": "About a 3-minute walk from Exit East 12b of Tenjin Station on the Subway Kuko Line, or a 5-minute walk from Nakasu-Kawabata Station."}, {"address": "6-29 Nishinakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Built in 1910 (Meiji 43), this structure is one of the rare surviving wooden French Renaissance-style public buildings in Japan. Formerly used to host imperial family members and distinguished guests, its exterior boasts impressive octagonal towers, wooden balconies, and elegant ornamental moldings. The interior restores luxurious Meiji-era reception rooms, bedrooms, and VIP halls. Visitors can try on vintage costumes for photos inside the historic setting and unwind at the cozy cafe offering light meals and pastries.", "name": "Former Fukuoka Prefecture Guest House", "transport": "About a 5-minute walk from Exit 1 of Nakasu-Kawabata Station on the Subway Kuko Line, or an 8-minute walk from Tenjin Station."}, {"address": "1-29-9 Hakata Ekimae, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1242 (Ninji 3) by Shoichi Kokushi, Jotenji Temple is an ancient temple of the Rinzai sect\u0027s Tofuku-ji branch. Rich in history, it is celebrated as the birthplace of several iconic Hakata traditions and culinary items, featuring stone monuments marking it as the birth site of Udon and Soba noodles, Yokan (sweet bean jelly), and Hakata-ori textiles. It is also the birthplace of the Hakata Gion Yamakasa festival. The temple grounds house a serene Zen rock garden (\u0027Saito-tei\u0027) and feature understated, dignified architecture, which radiates a deep, tranquil traditional Japanese aesthetic during special autumn night illuminations.", "name": "Jotenji Temple", "transport": "About a 3-minute walk from Exit 4 of Gion Station on the Subway Kuko Line."}, {"address": "4-21 Reisenmachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Steeped in legend, Ryuguji Temple is an ancient Jodo sect temple reportedly founded in 1222 during the Kamakura period. According to legend, a mermaid was captured nearby and buried on the grounds, leading to the temple being renamed Ryuguji (\u0027Dragon Palace Temple\u0027). To this day, it preserves legendary mermaid bones and a painted scroll, attracting visitors interested in folklore and mythical history. Despite its proximity to the bustling Kawabata Shopping Street, the grounds remain quiet and secluded. With its dark-lacquered gates and rustic halls, it is a uniquely charming off-the-beaten-path historical spot in Hakata.", "name": "Ryuguji Temple", "transport": "About a 3-minute walk from Exit 2 of Gion Station on the Subway Kuko Line, or a 3-minute walk from Kushida-jinja-mae Station on the Nanakuma Line."}, {"address": "2-1 Shimokawabatamachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Hakataza Theatre is Kyushu\u0027s premier performing arts venue, combining modern architectural standards with the charm of a traditional Kabuki theater. Featuring a grand facade, multi-tiered seating, and a classic \u0027hanamichi\u0027 walkway extending into the audience, it hosts national-treasure Kabuki performances, Broadway musicals, Takarazuka Revue shows, and major historical dramas. Perfectly integrating traditional theater culture with modern stage technology, its grand entrance with massive crimson pillars and traditional banners forms an iconic landmark in the heart of Nakasu-Kawabata.", "name": "Hakataza Theatre", "transport": "Directly connected to Exit 7 of Nakasu-Kawabata Station on the Subway Kuko/Hakozaki Line."}, {"address": "Between Nishinakasu, Chuo Ward and Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture (spanning the Naka River)", "feature": "\u2b50 4.1 stars | Spanning the Naka River, Fukuhaku Deai Bridge is a historic pedestrian bridge symbolically connecting the former samurai district of Fukuoka with the merchant hub of Hakata. Designed around the theme of cultural exchange between the two towns, it features unique seating benches and historical plaques. By day, it offers panoramic views of Nakasu\u0027s mix of traditional and modern architecture; by night, it provides the best vantage point for taking in the neon glow along the riverbanks and the vibrant Yatai food stall scenes. Often featuring street performers at its entrances, it is a beloved architectural landmark combining historical significance with modern urban vitality.", "name": "Fukuhaku Deai Bridge", "transport": "About a 3-minute walk from Exit 1 of Nakasu-Kawabata Station on the Subway Kuko Line."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "7th \u0026 8th Floors, Hakata Riverain, 3-1 Shimokawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located on the 7th and 8th floors of Hakata Riverain, this is the world\u0027s only public art museum dedicated exclusively to collecting and exhibiting modern and contemporary Asian art. Its collection features diverse and creative paintings, sculptures, and installation art from across Asia, alongside regular high-caliber special exhibitions and workshops. Facilities include a spacious and cozy art library, a stylish caf\u00e9, and a curated souvenir shop\u2014making it a wonderful cultural spot to experience the pulse of contemporary Asian art and unwind.", "name": "Fukuoka Asian Art Museum", "transport": "Take the Fukuoka City Subway Kuko Line or Hakozaki Line to \u0027Nakasu-Kawabata Station\u0027. Exit 6 directly connects to Hakata Riverain."}, {"address": "6-10 Reisen-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located diagonally opposite Kushida Shrine, this museum is reconstructed from traditional Meiji-era machiya townhouse architecture. It comprises three sections: the Exhibition Hall, the Machiya Hall, and the Souvenir Shop. It faithfully recreates the lifestyle and traditional commerce of Hakata residents during the Meiji and Taisho periods. Visitors can watch live demonstrations of Hakata-ori weaving and Hakata doll painting, and even try hands-on doll painting\u2014an ideal cultural spot to dive into Hakata\u0027s century-old history and artisan spirit.", "name": "Hakata Machiya Folk Museum", "transport": "Take the Subway Nanakuma Line to \u0027Kushida Shrine Station\u0027 (3-min walk); or take the Subway Kuko Line to \u0027Gion Station\u0027 (5-min walk)."}, {"address": "8-1 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture (inside Hakata Riverain)", "feature": "\u2b50 4.2 stars | Dedicated to promoting Hakata\u0027s iconic traditional crafts, this museum displays centuries-old Hakata-ori textiles, lifelike Hakata dolls, exquisite Hakata-magemono bentwood crafts, and unique local papercutting art. Featuring masterpieces crafted by master artisans, the museum uses multimedia displays and curated exhibitions to showcase how traditional crafts adapt into modern living. An on-site gift shop offers high-quality crafts for collectors and souvenirs.", "name": "Hakata Traditional Craft and Design Museum", "transport": "Take the Subway Kuko Line or Hakozaki Line to \u0027Nakasu-Kawabata Station\u0027, about a 2-minute walk."}, {"address": "6-29 Nishi-Nakasu, Chuo-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Situated beside Tenjin Central Park in Nishi-Nakasu right next to the Naka River, this rare 1909 wooden Western-style building features French Renaissance architecture from the Meiji period. Designated an Important Cultural Property of Japan, it boasts an elegant exterior, an iconic octagonal tower, and exquisite geometric woodwork details. Visitors can explore former VIP rooms, drawing rooms, and dining halls, or try on elegant vintage royal costumes for an immersive blast to the past. Beautifully illuminated at night, it creates a romantic backdrop alongside the Nakasu riverside.", "name": "Former Fukuoka Prefectural Hall Kihinkan", "transport": "Take the Subway Kuko Line to \u0027Nakasu-Kawabata Station\u0027 or \u0027Tenjin Station\u0027, about a 5-minute walk."}, {"address": "1-15-30 Tenjin, Chuo-ku, Fukuoka City, Fukuoka Prefecture (by the Nakasu Naka River Bridge)", "feature": "\u2b50 4.1 stars | Built in 1909, this British-style red brick building originally served as the Kyushu Branch of Nippon Life Insurance. Designed by Kingo Tatsuno\u2014the renowned architect behind Tokyo Station\u2014and Yasushi Kataoka, it combines Queen Anne revival style with striking red brick and white granite stripes. Designated an Important Cultural Property of Japan, it currently houses the Fukuoka City Literature Hall, exhibiting historical archives of literary figures tied to Fukuoka while hosting cultural salons and history exhibitions.", "name": "Fukuoka City Red Brick Culture Hall", "transport": "Take the Subway Kuko Line to \u0027Nakasu-Kawabata Station\u0027 (Nakasu exit), about a 3-minute walk."}, {"address": "2-1 Shimokawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.5 stars | Located directly above Nakasu-Kawabata Station, Hakataza Theatre is Kyushu\u0027s largest and best-equipped dedicated theater venue. It hosts top-tier performing arts ranging from Kabuki and Broadway musicals to Takarazuka Revue shows and historical jidaigeki dramas. The auditorium features luxurious d\u00e9cor, superb acoustics, and state-of-the-art stage visuals for an exceptional audio-visual experience. The venue also offers merchandise shops and upscale bento stalls rich in Hakata flavor, making it a premier shrine for theatrical art culture.", "name": "Hakataza Theatre", "transport": "Direct connection from Exit 7 of \u0027Nakasu-Kawabata Station\u0027 (Subway Kuko / Hakozaki Line)."}, {"address": "1-41 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture (inside Kushida Shrine grounds)", "feature": "\u2b50 4.2 stars | Kushida Shrine is the grand guardian shrine of Hakata. Its Treasure Hall displays historical artifacts, ancient documents, portable shrines (mikoshi), and antique crafts spanning centuries of history. A key highlight is the collection of historical records and scale float models from the famous \u0027Hakata Gion Yamakasa\u0027 festival, offering deep insights into this UNESCO Intangible Cultural Heritage event. It\u0027s a fantastic spot to immerse in Hakata\u0027s rich spiritual heritage and local festival traditions.", "name": "Kushida Shrine Museum \u0026 Treasure Hall", "transport": "Take the Subway Nanakuma Line to \u0027Kushida Shrine Station\u0027 (1-min walk); or walk about 5 minutes from Subway \u0027Nakasu-Kawabata Station\u0027."}, {"address": "14-25 Kamikawabata-machi, Hakata-ku, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Situated near the Kamikawabata-machi shopping street and Hakata River, the United Church of Christ in Japan Hakata Church dates back to the Meiji era and stands as a key Christian heritage landmark in Hakata. Featuring warm yet solemn Gothic architectural elements, its delicate spires and stained-glass windows offer a serene oasis amidst the bustling Nakasu-Kawabata commercial district. Beyond Sunday services, the church actively supports local historical preservation, occasionally hosting pipe organ concerts and cultural lectures for spiritual reflection and arts appreciation.", "name": "Japan Christian Church Hakata Church", "transport": "Take the Subway Kuko Line to \u0027Nakasu-Kawabata Station\u0027, Exit 5, about a 3-minute walk."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-7 Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Located at the southernmost tip of Nakasu Island, Seiryu Park is adjacent to Canal City Hakata and the Naka River. It is not only a fantastic green space for locals and tourists to stroll and relax, but also one of the famous spots where Nakasu Yatai (food stalls) gather. Every spring, the cherry blossoms bloom in full glory, creating a stunning contrast with the riverbank scenery. At night, it transforms into a bustling, brilliantly lit night spot filled with lively energy. Sitting on a riverside bench, enjoying the soothing sound of flowing water and the city night views allows you to experience Hakata\u0027s unique laid-back vibe and vitality.", "name": "Seiryu Park", "transport": "About a 3-minute walk from Kushida Shrine Station on the Nanakuma Subway Line, or about an 8-minute walk from Nakasu-Kawabata Station."}, {"address": "7 Kamikawabatomachi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.0 stars | Located right next to Kawabata Shopping Arcade and Kushida Shrine, Reisen Park is an iconic urban park in Hakata\u0027s old district. Shaded by trees, it features spacious lawns, relaxation pavilions, and children\u0027s playground equipment, serving as a daily oasis for local residents. It is also one of Fukuoka\u0027s famous cherry blossom viewing spots. Every spring during cherry blossom season, crowds gather under the blooming trees for picnics and parties. Additionally, Reisen Park frequently hosts various beer festivals, food markets, and cultural events, making for a very lively atmosphere.", "name": "Reisen Park", "transport": "About a 3-minute walk from Exit 5 of Nakasu-Kawabata Station on the Subway Kuko Line/Hakozaki Line."}, {"address": "3-1-51 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Just a few minutes\u0027 walk from Canal City Hakata, Sumiyoshi Shrine is known as one of Japan\u0027s Three Great Sumiyoshi Shrines and boasts a rich history. The shrine grounds are lush and filled with towering ancient trees, feeling like a forest park hidden in the bustling city. The \u0027Shinchi\u0027 (Sacred Pond) and the adjacent \u0027Kudokuten Garden\u0027 showcase elegant, traditional Japanese garden aesthetics, complete with small bridges, flowing water, and swimming koi. Beautiful in every season, it is especially breathtaking during autumn when the red maple leaves reflect on the water. With its serene environment, it is the perfect spot to seek tranquility and feel close to nature after shopping at Canal City.", "name": "Sumiyoshi Shrine Sacred Pond \u0026 Japanese Garden", "transport": "About a 5-minute walk from Canal City Hakata, or about a 7-minute walk from Kushida Shrine Station on the subway."}, {"address": "Along the Naka River banks, Nakasu, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Flowing along the west side of Nakasu, the Naka River waterfront promenade is the most romantic natural corridor connecting the Tenjin and Nakasu areas. Lined with lush greenery and colorful flowers, the path features comfortable wooden boardwalks and water-friendly platforms, making it ideal for a relaxing afternoon or morning stroll. At sunset, the golden light casts a captivating glow over the water; by night, Nakasu\u0027s vibrant neon lights reflect on the river, swaying with the gentle waves to create Hakata\u0027s iconic cityscape night view. Visitors can also board a water bus (Hakata Bay Cruise) along the promenade to admire the waterfront views from a different perspective.", "name": "Naka River Waterfront Promenade", "transport": "About a 2 to 5-minute walk to the riverbank from Nakasu-Kawabata Station or Tenjin-Minami Station on the subway."}, {"address": "Along the riverbank from Shimokawabatamachi to Nakasu-Nakajimacho, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | The Hakata River cuts through the eastern side of Nakasu, running parallel to the Kawabata Shopping Arcade. Compared to the bustling Naka River, the Hakata River Promenade offers a quieter, more elegant atmosphere. Beautifully landscaped with lush flowerbeds, stone-paved walkways, and resting benches, it features wooden and stone bridges spanning the river, exuding the rich charm of a historical water town. During the Hakata Gion Yamakasa festival, the riverbank is decorated with colorful lanterns, adding to the festive traditional vibe. Visitors can enjoy a peaceful stroll here to savor the waterfront charm of old Hakata.", "name": "Hakata River Waterfront Promenade", "transport": "Located right outside Nakasu-Kawabata Station on the Subway Kuko Line."}, {"address": "Border of Nakasu-Nakajimacho, Hakata Ward and Nishinakasu, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Spanning the Naka River at the northern tip of Nakasu, the Fukuhaku Deai Bridge connects historic Hakata (town of merchants) with historic Fukuoka (town of samurai), symbolizing the blending of the two cultures. The bridge is wide and architecturally sleek, surrounded by waterfront green spaces and Suijo Park. Offering expansive views, it overlooks the urban skyline and lush trees along the riverbanks, making it a popular spot for photos. In spring, cherry blossoms bloom along the bridge, creating a picture-perfect scene with cruise boats passing beneath. At night, illuminated bridge structures and nearby buildings create a romantic ambience.", "name": "Fukuhaku Deai Bridge \u0026 Suijo Park Area", "transport": "About a 3-minute walk from Exit 2 of Nakasu-Kawabata Station on the subway."}, {"address": "Border of Nakasu 6-Chome, Hakata Ward and Haruyoshi, Chuo Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Spanning the Naka River to connect Nakasu and the Haruyoshi area, Haruyoshi Bridge was recently revamped to transform the old bridge structure into a spacious, open \u0027Riverside Plaza.\u0027 The plaza features high-quality wooden decking, lush landscaping, and stylish seating, providing a delightful waterfront spot to relax. Free from traffic noise, it serves as an open-air deck to take in Nakasu\u0027s dazzling neon lights and river views. With buskers often performing in the evening, it is a modern landmark blending vibrant urban energy with natural riverfront views.", "name": "Haruyoshi Bridge Riverside Plaza", "transport": "About a 5-minute walk from Kushida Shrine Station or Tenjin-Minami Station on the Nanakuma Subway Line."}, {"address": "1-2 Sumiyoshi, Hakata Ward, Fukuoka, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Canal City Hakata is not only a massive shopping and entertainment complex, but its core design concept seamlessly integrates nature and canals into its architecture. A 180-meter-long artificial canal runs through the center of the complex, surrounded by multi-layered outdoor greenery and water platforms that evoke a canyon-like natural waterscape. At the central Sun Plaza, grand fountain shows synchronized to music take place regularly every day, while nighttime brings the spectacular \u0027Canal Aqua Panorama\u0027 featuring light projections and music. It harmoniously weaves together flowing water, flora, and modern architecture for a unique outdoor waterfront experience.", "name": "Canal City Hakata Canal \u0026 Sun Plaza Greenery", "transport": "About a 2-minute walk from Kushida Shrine Station on the Nanakuma Subway Line."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-2 Sumiyoshi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | The highlight of Canal City Hakata is the dynamic fountain show located at the B1 Sun Plaza, combining music, lights, and high-tech water screen projections to deliver stunning visual effects. Special projection shows featuring popular anime and festive themes are held regularly. Whether watching the water jets dance to music during the day or admiring the brilliant 3D projections at night, this is an unmissable visual feast and top photo spot when visiting Canal City Hakata.", "name": "Canal City Hakata Sun Plaza Aqua Panorama", "transport": "About a 1-minute walk from Kushida Shrine Station on the Nanakuma Subway Line, or a 7-minute walk from Nakasu-Kawabata Station on the Airport Subway Line."}, {"address": "Near 8 Nakasu, Hakata Ward, Fukuoka City, Fukuoka Prefecture (along Naka River)", "feature": "\u2b50 4.2 stars | The Yatai (Japanese food stalls) lined up along the Naka River form Fukuoka\u0027s most iconic and world-famous evening cultural landscape. As night falls, the glowing red lanterns reflect brilliantly on the river surface, complemented by steam from hot tonkotsu ramen and sizzling yakitori, creating a lively retro Showa-era atmosphere. It\u0027s the top choice for photography enthusiasts looking to capture Hakata\u0027s charming nightlife.", "name": "Nakasu Yatai Street Riverfront View", "transport": "About a 5-minute walk from Nakasu-Kawabata Station on the Airport/Hakozaki Subway Lines, or a 3-minute walk from Kushida Shrine Station on the Nanakuma Subway Line."}, {"address": "6-135 Kamikawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.1 stars | Spanning about 400 meters, Kawabata Shopping Arcade is Hakata\u0027s oldest commercial street. Its biggest photo attraction is the magnificent year-round display of a giant \u0027Kazariyamakasa\u0027 float used in the Hakata Gion Yamakasa Festival. Standing several meters tall, the intricate float depicts traditional Japanese historical heroes and legendary figures in vibrant colors, allowing visitors to experience the grand scale of Hakata festival culture even outside the festival period in July.", "name": "Kawabata Shopping Arcade Kazariyamakasa", "transport": "Directly connected to Exit 5 of Nakasu-Kawabata Station on the Airport Subway Line, or about a 2-minute walk from Kushida Shrine Station on the Nanakuma Subway Line."}, {"address": "10-256 Kamikawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.3 stars | Located inside Kawabata Shopping Arcade, this unique venue blends local cuisine with festival culture. It houses an authentic, grand year-round \u0027Kazariyamakasa\u0027 festival float, making it a famous landmark for photo opportunities. Here, you can get stunning close-up shots of the massive float while enjoying traditional, rich Hakata red bean soup (zenzai) served with grilled mochi\u2014a delightful nostalgic stop for photos and rest.", "name": "Hakata Kawabata Zenzai Hiroba", "transport": "About a 3-minute walk from Nakasu-Kawabata Station on the Airport Subway Line."}, {"address": "Between Nakasu 3-Chome, Hakata Ward and Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Spanning the Naka River, Fukuhaku Deai Bridge is a symbolic landmark connecting the bustling commercial hub Tenjin with the nightlife district of Nakasu. Featuring a spacious deck with stylish wooden benches, it offers the perfect angle for photographing Nakasu Yatai riverfront views and water buses. At night, its artistic lighting blends with vibrant neon reflections across the river, creating a romantic vibe perfect for couples and night photography.", "name": "Fukuhaku Deai Bridge", "transport": "About a 4-minute walk from Nakasu-Kawabata Station on the Airport Subway Line, or a 6-minute walk from Tenjin-Minami Station on the Nanakuma Subway Line."}, {"address": "6-29 Nishinakasu, Chuo Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.2 stars | Built in 1909, this rare French Flemish-style wooden building stands near the Nakasu side of Tenjin Central Park. Its elegant yellow-green exterior and exquisite retro window frames make it stand out romantically among modern skyscrapers. Inside, visitors can rent vintage aristocrat costumes to pose on grand staircases and in court-style rooms, transporting them back to the Meiji era\u2014a favorite activity for female travelers.", "name": "Former Fukuoka Prefectural Hall Guest House", "transport": "About a 5-minute walk from Nakasu-Kawabata Station on the Airport Subway Line, or a 5-minute walk from Tenjin-Minami Station on the Nanakuma Subway Line."}, {"address": "2-1 Shimokawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature": "\u2b50 4.4 stars | Hakataza Theater is Kyushu\u0027s premier performing arts center, hosting Kabuki, Broadway musicals, and Japanese historical plays. Its grand entrance features red-carpeted steps and an impressive porch with giant Japanese lanterns, radiating a luxurious artistic aura. With every new show season, grand performance posters and elegant decorations draw theater fans and tourists alike for commemorative photos.", "name": "Hakataza Theater Grand Entrance", "transport": "Directly connected to Exit 7 of Nakasu-Kawabata Station on the Airport/Hakozaki Subway Lines."}, {"address": "7 Kamikawabatamachi, Hakata Ward, Fukuoka City, Fukuoka Prefecture", "feature"
