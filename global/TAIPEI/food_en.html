e 150, Sec. 5, Xinyi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.0 Stars | The famous Kyoto coffee brand\u0027s minimalist, pure-white hub located at the foot of Xiangshan (Elephant Mountain). Their signature \"Kyoto Latte\" incorporates a touch of condensed milk for a rich, silky texture with a subtle sweet aroma, balancing perfectly with dark roast espresso. Many visitors grab a takeout coffee here before or after hiking up Elephant Mountain to enjoy views of Taipei 101.", "name": "% Arabica (Taipei Elephant Mountain)", "transport": "MRT Xiangshan Station Exit 2, approx. 8 mins walk to the Xiangshan Trail entrance"}, {"address": "No. 26, Lane 553, Sec. 4, Zhongxiao E. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 Stars | A popular cafe near Songshan Cultural and Creative Park, famous for its unique signature dessert, the \"Cronut.\" Combining croissants and donuts, it\u0027s fried to crispy perfection on the outside and soft inside, layered with whipped cream and fresh strawberries for a delightful sweet-and-sour taste. Savory dishes like the Beef Cronut Burger and Kimchi Pasta are also highlights, making it a great rest stop for hipsters and tourists.", "name": "Drip Cafe (Songshan Cultural Park Branch)", "transport": "MRT Taipei City Hall Station Exit 1, approx. 8 mins walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 38, Alley 11, Lane 473, Guangfu S. Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.4 stars | A wildly popular Taiwanese-American fusion gastropub next to a park in Xinyi District, famous for over a dozen unique fried chicken wing flavors. The signature \u0027Salty Tears Wings\u0027 feature a crispy, juicy exterior with a savory and aromatic seasoning, complemented by a sweet and tangy secret sauce that creates rich layers of flavor. The industrial decor combined with a spacious, green glasshouse design offers a relaxed and lively vibe, making it immensely popular among young professionals and tourists alike\u2014a top choice for gatherings and drinks.", "name": "Gumgum Beer \u0026 Wings Xinyi", "transport": "Approx. 8-min walk from Exit 1 of MRT Taipei 101/World Trade Center Station"}, {"address": "4F, No. 9, Songshou Rd., Xinyi District, Taipei City (Shin Kong Mitsukoshi Xinyi Place A9)", "feature": "\u2b50 4.2 stars | A refined wood-fired grill bistro helmed by a Michelin-starred chef, located inside Shin Kong Mitsukoshi A9. It specializes in charcoal-grilling premium meats and fresh seafood over longan wood, such as the signature Prime Ribeye, which features a rich smoky char while keeping the meat tender, juicy, and naturally sweet. The outdoor terrace offers direct, stunning night views of Taipei 101. With exquisite cocktails and masterfully controlled charcoal-grilled flavors, it is a top luxurious choice for dates and birthday celebrations in Xinyi.", "name": "WILDWOOD Live Grill \u0026 Bar", "transport": "Approx. 6-min walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "1F, No. 11, Songshou Rd., Xinyi District, Taipei City (Shin Kong Mitsukoshi Xinyi Place A11)", "feature": "\u2b50 4.3 stars | A tap cocktail bar created by the founder of one of Asia\u0027s 50 Best Bars, located in the outdoor hallway of Shin Kong Mitsukoshi A11. Breaking traditional bar boundaries, it serves high-quality cocktails on tap. Signature drinks are refreshing with fine effervescence, achieving a perfect balance between fruity notes and base spirits. The outdoor standing-drinking area creates a laid-back, London-street-style atmosphere where tourists and locals alike love to grab a casual drink and enjoy the buzzy, neon-lit night of the Xinyi shopping district.", "name": "Draft Land Xinyi", "transport": "Approx. 5-min walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "46F, No. 17, Songzhi Rd., Xinyi District, Taipei City (Breeze Nanshan)", "feature": "\u2b50 4.4 stars | A high-altitude fine Indian gastropub on the 46th floor of Breeze Nanshan, combining authentic regional Indian dishes with world-class mixology. The classic Tandoori Chicken Skewers are marinated in yogurt and spices before being baked in a high-temperature clay oven, resulting in tender, juicy meat with a rich spice aroma, paired perfectly with crispy, chewy Naan. Massive floor-to-ceiling windows offer an up-close view of Taipei 101, delivering a gorgeous, romantic dual feast for eyes and palate, highly acclaimed by gourmets and international travelers.", "name": "Saffron 46 Indian Cuisine \u0026 Bar", "transport": "Approx. 4-min walk from Exit 4 of MRT Taipei 101/World Trade Center Station"}, {"address": "47F, No. 68, Sec. 5, Zhongxiao E. Rd., Xinyi District, Taipei City (Breeze Xinyi)", "feature": "\u2b50 4.3 stars | Perched on the 47th floor of Breeze Xinyi, this high-sky seafood gastropub offers stunning skyline views alongside a top-tier land-and-sea feast. The signature Rainbow Seafood Tower features lobster, oysters, and freshly sliced fish; the seafood boasts an exquisitely sweet and springy texture that tastes even better dipped in secret scallop sauce. The interior sports an ocean-blue palette, while the outdoor bar area provides an unobstructed panoramic view of Xinyi\u0027s vibrant nightscape. Exclusive cocktails paired with refined seafood attract countless guests celebrating special occasions or seeking a touch of luxury.", "name": "Sea To Sky - Seafood \u0026 Bar", "transport": "Directly connected to Breeze Xinyi from Exit 3 of MRT Taipei City Hall Station"}, {"address": "14F, No. 58, Songren Rd., Xinyi District, Taipei City (Far Eastern Department Store A13)", "feature": "\u2b50 4.5 stars | A renowned, lively American restaurant \u0026 bar on a high floor of Far Eastern A13, boasting a fantastic outdoor terrace looking out toward Taipei 101. The signature Buffalo Chicken Wings feature a crispy skin tossed in a zesty, tangy secret sauce that will leave you licking your fingers, paired with golden crispy onion rings and draft craft beer for bold, authentic flavor. Complete with signature hula-hoop dance performances, its fun, enthusiastic vibe paired with stunning night views makes it the ultimate party spot for domestic and international visitors.", "name": "HOOTERS Xinyi", "transport": "Approx. 8-min walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "No. 379, Sec. 4, Xinyi Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.1 stars | A classic establishment blending Australian food culture with a bistro vibe, offering a relaxed, spacious industrial-style venue. The signature Aussie Meat Pie boasts a golden, flaky crust filled with rich, juicy beef, enhanced by a sweet-and-savory gravy for a hearty, multi-layered bite. In addition to classic pour-over coffee, the evening menu features independent Aussie craft beers and specialty local dishes. Its warm, vibrant neighborhood-bistro vibe is hugely popular with expatriates and local hipsters alike.", "name": "Woolloomooloo Xinyi", "transport": "Approx. 5-min walk from Exit 1 of MRT Taipei 101/World Trade Center Station"}, {"address": "4F, No. 16, Songgao Rd., Xinyi District, Taipei City (Breeze Songgao)", "feature": "\u2b50 4.4 stars | An open-air rooftop gastropub by a top Taiwanese craft beer brand, located in the sky garden of Breeze Songgao. Serving dozens of fresh Taiwanese craft brews on tap, its signature \u0027No. 73 IPA\u0027 delivers rich tropical fruit aromas and a pleasantly bitter finish with distinct layers. Paired with crispy-on-the-outside, tender-on-the-inside Taiwanese fried snack platters and skewers that are savory and irresistible. Sipping local craft beer while enjoying an up-close night view of Taipei 101 makes it a favorite among late-night cocktail lovers.", "name": "Zhangmen Craft Brewery Xinyi", "transport": "Approx. 4-min walk from Exit 3 of MRT Taipei City Hall Station"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "2F, No. 11, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.5 stars | Michelin Green Star-recommended stylish plant-based cuisine! The highly acclaimed \u0027Chili Oil Preserved Egg Tofu Steamed Bun\u0027 and \u0027Pink Sauce Pasta\u0027 transform traditional vegetarian dishes into modern culinary masterpieces. The golden-crispy preserved egg tofu bun features a tender, savory, and spicy filling with rich layers, making it a favorite among young crowds and tourists.", "name": "Little Tree Food Xinyi A11 Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 4 or Taipei City Hall Station Exit 3, about an 8-minute walk"}, {"address": "2F, No. 11, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.3 stars | Top choice for American meatless fusion cuisine! The signature \u0027Three-Cheese Panini\u0027 and \u0027Farmer\u0027s Salad\u0027 are beloved by foodies. The panini crust is toasted golden and crispy, bursting with rich melted gooey cheese in every bite. Paired with juicy, fresh fruits and vegetables, it\u0027s satisfying yet light\u2014a popular dining spot after shopping in the Xinyi district.", "name": "Miacucina Xinyi A11 Store", "transport": "MRT Taipei City Hall Station Exit 3, about a 6-minute walk"}, {"address": "No. 11, Alley 46, Lane 553, Sec. 4, Zhongxiao E. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.4 stars | A bistro-style vegan restaurant near Songshan Cultural and Creative Park! Featuring Beyond Meat burgers and plant-based milkshakes. The classic \u0027Spicy Beyond Meat Burger\u0027 features aromatic buns and a patty seared crispy on the outside and tender juicy on the inside. Paired with special spicy Sichuan pepper sauce, its taste easily rivals real meat, completely redefining traditional vegetarian expectations.", "name": "BaganHood Vegan Bistro", "transport": "MRT Taipei City Hall Station Exit 1, about an 8-minute walk"}, {"address": "No. 9, Lane 452, Sec. 4, Ren\u0027ai Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 stars | A cozy Western-style vegetarian restaurant tucked away in the alleys of Xinyi District! Crafting exquisite Japanese-Western fusion dishes using whole, unprocessed foods. The signature \u0027Porcini Wild Mushroom Risotto\u0027 features perfectly al dente rice soaked in rich mushroom aroma and vegetable broth, served with crispy roasted seasonal veggies for a velvety, layered texture. Highly popular among health-conscious diners and locals seeking quality food.", "name": "Vege Table", "transport": "MRT Sun Yat-sen Memorial Hall Station Exit 3, about a 7-minute walk"}, {"address": "No. 14, Lane 419, Guangfu S. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 stars | Internationally renowned vegan brand! Specializing in global vegan cuisines free of eggs and dairy. The recommended \u0027Golden Seafood Pot\u0027 and \u0027Sichuan Braised Noodle Soup\u0027 feature chewy, springy noodles served in a richly spiced, spicy, and savory broth simmered with natural veggies and herbs. A must-visit destination for plant-based travelers worldwide.", "name": "Loving Hut Light House Guangfu Store", "transport": "MRT Sun Yat-sen Memorial Hall Station Exit 3, about a 6-minute walk"}, {"address": "No. 208, Zhuangjing Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 stars | An affordable and delicate vegetarian eatery near Taipei 101! Known for healthy vegetarian bento boxes and handmade dry noodles. Must-try \u0027Fragrant Sesame Paste Noodles\u0027 served with house-special \u0027Crispy Vegetarian Bits\u0027\u2014smooth noodles coated in rich sesame paste with a crunchy contrast. Great value, generous portions, and a favorite among local office workers and budget-conscious travelers.", "name": "San Shi Wu Vegetarian Zhuangjing Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 2, about a 5-minute walk"}, {"address": "No. 13, Lane 215, Sec. 5, Zhongxiao E. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.0 stars | Highly popular Taiwanese vegetarian teppanyaki and hot pot in Xinyi commercial district! The hot seller \u0027Sizzling Vegetarian Steak\u0027 arrives sizzling at the table, overflowing with black pepper sauce aroma. The steak is firm and juicy, perfectly paired with a hearty fresh vegetable hot pot boasting a sweet, clean broth\u2014a top pick for foodies who love traditional Taiwanese stir-fry and sizzler flavors.", "name": "Chuan Zhen Vegetarian Zhongxiao Store", "transport": "MRT Taipei City Hall Station Exit 4, about a 4-minute walk"}, {"address": "1F, No. 2, Lane 156, Wuxing St., Xinyi Dist., Taipei City", "feature": "\u2b50 4.3 stars | A trendy hipster-style handmade vegetarian restaurant in the Wuxing Street business district! Highly recommended are the \u0027Truffle Wild Mushroom Risotto\u0027 and \u0027Korean Spicy Rice Cake Vegetarian Meal\u0027. The chewy rice cakes coated in sweet and mildly spicy Korean sauce, combined with fresh seasonal vegetables, offer a refreshing and appetizing meal\u2014a cozy, affordable hidden gem near Taipei 101.", "name": "Herbal Mia Vegetarian", "transport": "MRT Taipei 101/World Trade Center Station Exit 2, about a 7-minute walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "5F, No. 12, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 stars | Iconic Taiwanese street-style fried chicken bursting with garlicky goodness! Deep-fried to a golden crisp, the chicken is crispy on the outside and tenderly juicy on the inside without being greasy. Generously tossed with freshly minced garlic and aromatic Thai basil, the bold garlic flavor and savory layers make it a must-try classic snack for tourists exploring night market culture or locals grabbing a bite before a movie.", "name": "Shi Yuan Salted Crispy Chicken - ATT4FUN Branch", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, approx. 5 minutes walk"}, {"address": "No. 7, Lane 391, Zhuangjing Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.0 stars | A legendary staple in Taipei\u0027s breakfast and street food scene! Their signature Cheese \u0026 Pork Patty Danbing (Taiwanese egg crepe) is pan-fried to golden perfection with a delightfully light crunch. Filled with rich, gooey melted cheese and a savory, juicy pork patty, the incredible contrast of crispy exterior and tender interior draws lines of both locals and international foodies.", "name": "Chen Gen Zhao Cha", "transport": "MRT Taipei 101/World Trade Center Station Exit 2, approx. 8 minutes walk"}, {"address": "No. 2, Alley 5, Lane 147, Sec. 1, Keelung Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.5 stars | A highly popular traditional vermicelli stall near the Xinyi Shopping District! The rich, perfectly thickened broth infuses deep bonito and garlic aromas. The combo bowl comes loaded with plump, tender braised pork intestines, fresh sweet oysters, and chewy pork cubes. Drizzle on their specialty chili sauce and black vinegar for an irresistible, flavor-packed bowl.", "name": "Golden Vermicelli", "transport": "MRT Taipei City Hall Station Exit 1, approx. 4 minutes walk"}, {"address": "No. 239, Wuxing St., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 stars | A Michelin Bib Gourmand-recommended classic eatery near Taipei 101, famous for its freshly made Beef Scallion Rolls\u2014a local foodie favorite! Chefs roll out and pan-fry the flatbread on-demand to achieve a flaky, crispy, yet delightfully chewy texture. Stuffed with tender slices of beef coated in sweet bean sauce and crisp scallions, every bite offers a harmonious balance of flavors.", "name": "Mu Ji Beef Noodles - Scallion Pancake Roll", "transport": "MRT Taipei 101/World Trade Center Station Exit 2, approx. 10 minutes walk"}, {"address": "No. 12, Lane 216, Jiaxing St., Xinyi Dist., Taipei City", "feature": "\u2b50 4.4 stars | A trendy spot famous for traditional handmade batter-style Taiwanese egg crepes (danbing). Pan-fried to a light golden crisp on the outside, the inner layer offers a unique, bouncy, mochi-like texture. Filled with savory basil pork chop or traditional fried broth cakes (Gao Zha), and dipped in sweet thick soy paste, its chewy retro taste attracts food lovers from all over.", "name": "Soft Power Taiwanese Breakfast \u0026 Snacks", "transport": "MRT Liuzhangli Station Exit, approx. 6 minutes walk"}, {"address": "B1, No. 45, Shifu Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 3.9 stars | A classic Taiwanese tofu pudding spot located in the Taipei 101 food court. The Douhua is remarkably smooth, velvety, and melts in your mouth, releasing a subtle, clean soybean aroma. Paired with slow-cooked tender peanuts, chewy boba pearls, and refreshing brown sugar syrup, it makes for the perfect comforting dessert before or after visiting the observatory.", "name": "Xiaonanmen Traditional Douhua - Taipei 101 Branch", "transport": "Directly connected to MRT Taipei 101/World Trade Center Station Exit 4"}, {"address": "No. 95, Lane 419, Guangfu S. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.3 stars | A hugely popular handmade steamed bun shop near Guangfu Market! Fresh out of the steamer, the bun dough is soft, chewy, and smells subtly of sweet wheat. Their signature cabbage bun is bursting with crunchy, sweet, and juicy cabbage filling. Steaming hot and incredibly satisfying, it offers amazing value loved by locals and food enthusiasts alike.", "name": "Guangfu Steamed Bun", "transport": "MRT Sun Yat-Sen Memorial Hall Station Exit 3, approx. 7 minutes walk"}, {"address": "B1, No. 45, Shifu Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 stars | A classic Taiwanese old-school sponge cake that epitomizes simple perfection! While simple on the outside, its texture is impossibly soft, airy, and cloud-like. It dissolves delightfully with rich aromas of fresh eggs and milk, staying moist without being dry. Lightly sweet and addictive, it is a beloved treat and popular souvenir in the Xinyi district.", "name": "Chun Shang Pudding Cake - Taipei 101 Store", "transport": "Directly connected to MRT Taipei 101/World Trade Center Station Exit 4"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Xinyi Shopping District and Taipei 101"}, "yongkang": {"categories": {"cat_1": {"items": [{"address": "No. 194, Sec. 2, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | An internationally renowned birthplace of legendary Taiwanese cuisine, famous for its handcrafted xiaolongbao with \u002718 golden folds\u0027. Fresh out of the steamer, the dumplings have paper-thin yet resilient skin. A single bite releases piping hot, rich, and savory soup. The pork filling is tender without any gaminess, pairing perfectly with fine ginger strips and special vinegar sauce for a rich, multi-layered flavor. Besides classic xiaolongbao, the pork chop fried rice is a must-order signature dish\u2014each grain of rice coated in fragrant egg, served with thick, tender, classic-style pork chops, highly praised by both international tourists and locals alike.", "name": "Din Tai Fung (Xinyi Original Branch)", "transport": "About a 1-minute walk from MRT Dongmen Station Exit 5"}, {"address": "No. 17, Ln. 31, Sec. 2, Jinshan S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.1 stars | Founded in 1963, this half-century-old institution is a benchmark for Taipei\u0027s Sichuan-style beef noodles. The signature braised half-tendon half-meat soup is simmered for hours, offering a deep, rich bean paste aroma with a subtle spicy sweetness. Generous beef chunks are stewed until tender and juicy, while the tendons have a silky, jelly-like springy texture that melts in your mouth. The chewy noodles absorb the rich broth completely, and adding free sauerkraut makes it even more refreshing\u2014a classic dish food lovers visiting Yongkang Commercial District must not miss.", "name": "Yongkang Beef Noodles", "transport": "About a 3-minute walk from MRT Dongmen Station Exit 4"}, {"address": "No. 1, Ln. 6, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.2 stars | A super popular street food stall at the corner of Yongkang Street that always draws long queues. Made-to-order scallion pancakes are fluffed and slapped while frying to create a light, flaky, multi-layered crispy crust, while keeping a chewy interior filled with natural scallion aroma. The \u0027Basil with Egg\u0027 or \u0027Basil Egg with Cheese\u0027 combinations are highly recommended; melted cheese blends perfectly with the strong herbal scent of Thai basil. Crispy on the outside, soft on the inside, savory, and not greasy, it is the most popular walk-and-eat snack in the area.", "name": "Tianjin Scallion Pancake", "transport": "About a 2-minute walk from MRT Dongmen Station Exit 5"}, {"address": "No. 28-1, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.0 stars | A Michelin Bib Gourmand-recommended affordable Jiangzhe dim sum eatery preserving decades of simple, authentic flavors. The crab roe xiaolongbao features thin skin and abundant juice\u2014one bite delivers sweet crab roe and rich meat broth. Fried tofu fine vermicelli noodles and crispy scallion pastries are also popular picks. Hot Eight-Treasure Rice and steamed red bean rice cakes are rare vintage desserts; the rice cake is soft, dense, and delicately sweet, loved by both old Taipei locals and traveling visitors.", "name": "King Chien Yuan (Hao Gong Dao)", "transport": "About a 6-minute walk from MRT Dongmen Station Exit 5"}, {"address": "No. 105, Aiguo E. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.0 stars | A decades-old champion of the Taipei Beef Noodle Festival, renowned for its unique tomato beef noodles. The broth is slow-simmered for hours with fresh tomatoes and beef bones, tasting sweet, tangy, and refreshing with a rich beef aroma without any greasiness. Premium beef shank is cut into thick slices and stewed until exceptionally tender and savory. Combined with smooth noodles, it\u0027s irresistible\u2014a top choice for food lovers who enjoy a double hit of freshness and richness.", "name": "Lao Zhang Beef Noodles", "transport": "About a 5-minute walk from MRT Dongmen Station Exit 3"}, {"address": "No. 11-1, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.1 stars | Hidden in Yongkang Commercial District, this authentic old-school Tainan establishment insists on traditional steaming methods. The translucent outer skin is made from pure rice paste, giving it a soft, bouncy texture with a gentle rice aroma. It encloses whole fresh shrimp and flavorful, hearty pork filling. Drizzled with house-made sweet-and-savory sauce and minced garlic, it\u0027s light and refreshing\u2014a perfect showcase of refined Southern Taiwanese street food heritage.", "name": "Fucheng Tainan Steamed Shrimp Pork Dumplings", "transport": "About a 3-minute walk from MRT Dongmen Station Exit 5"}, {"address": "No. 56, Linyi St., Zhongzheng Dist., Taipei City", "feature": "\u2b50 4.3 stars | A famous queue-worthy stall next to Dongmen Market, sticking to traditional preparation methods for over 30 years. The signature thick pork soup uses fresh pork hind leg strips lightly coated in starch, delivering a firm, springy, and meaty texture rather than a heavy floury taste. The broth is stewed with plenty of cabbage and bonito flakes, resulting in a perfectly thickened, sweet broth. Enhanced with special chili sauce or black vinegar, it offers a satisfying bowl full of nostalgic Taiwanese street market charm.", "name": "Dongmen Thick Pork Meat Soup", "transport": "About a 2-minute walk from MRT Dongmen Station Exit 1"}, {"address": "No. 8-2, Ln. 198, Sec. 2, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.1 stars | Tucked away in the alleys of Xinyi Road, this classic Jiangzhe establishment has deep roots in Yongkang for decades, acting as a private dining room for politicians, celebrities, and gourmets. Highlights include exquisite cold starters and classic Jiangzhe stir-fries like marinated baked wheat gluten, stuffed chili peppers with pork, vegetable rice, and claypot lion\u0027s head meatballs. The dishes are deeply flavorful without being greasy, beautifully layered, retaining the ingredients\u0027 natural taste. With an elegant and unpretentious environment, it embodies the ultimate culinary heritage and charm of classic Taipei establishments.", "name": "Xiulan Restaurant", "transport": "About a 2-minute walk from MRT Dongmen Station Exit 5"}], "name": "Famous Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "No. 200, Sec. 2, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | A landmark Mediterranean restaurant right next to Dongmen Station, housed in a stylish multi-story building. Famous for pressed paninis, toasted sandwiches, and signature Shakshuka (poached eggs in spicy tomato sauce). The toasts are grilled to absolute crispiness, filled with gooey rich cheese and aromatic fillings that burst with flavor at first bite. Its diverse menu and relaxed, exotic atmosphere make it a favorite for locals and international tourists alike.", "name": "TOASTERiA caf\u00e9 Yongkang Branch", "transport": "About a 1-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 217, Jinhua St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | A Korean-style, photo-worthy brunch spot on Jinhua Street featuring large floor-to-ceiling windows bathed in natural sunlight. The popular souffl\u00e9 pancakes are cloud-like, airy, soft, and melt in your mouth with rich egg and milk aromas. The Eggs Benedict reveals golden yolk cascading over rich avocado and toast\u2014a feast for both eyes and taste buds. Beautiful food presentation and an elegant, light-filled space draw crowds of foodies and photography lovers.", "name": "Muko Brunch", "transport": "About a 6-minute walk from Exit 3 of MRT Dongmen Station"}, {"address": "No. 6, Lane 37, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.3 stars | Created by champion barista talent, this popular cafe is tucked away in a quiet alley of the Yongkang Shopping District. Renowned for made-to-order souffl\u00e9 thick pancakes with light, fluffy textures paired with special house spreads that taste as smooth and soft as marshmallows. They also serve theatrical smoking pour-over coffee and exquisite signature drinks, combining stunning visual presentation with rich coffee aromas for a tranquil afternoon tea.", "name": "Come True Coffee Taipei Yongkang", "transport": "About a 7-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 14, Lane 31, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | Hailed as one of Taipei\u0027s best scone bakeries, this cozy alley store constantly fills the air with the rich aroma of freshly baked buttery goods. Their scones are golden-crisp on the outside and moist on the inside, never dry. Topped with signature clotted cream and handmade jam, every bite offers an amazingly smooth and delightful flavor. Popular flavors include original milk, matcha, and Earl Grey\u2014making it an unmissable grab-and-go dessert and brunch spot in Yongkang Street.", "name": "Ciao Ciao Scone Yongkang Branch", "transport": "About a 6-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 320, Sec. 1, Dunhua S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | Bringing authentic Australian cafe culture to the Da\u0027an District, featuring a vibrant kangaroo mural and lively bright yellow tones. Famous for the luxurious \u0027Queen\u0027s Breakfast\u0027, packed with whole foods like smoked salmon, avocado, sunny-side-up eggs, sourdough, and more for a wholesome, guilt-free feast. Pair it with a silky Australian Flat White where rich espresso blends seamlessly with steamed milk\u2014a favorite spot for those embracing a healthy, quality lifestyle.", "name": "The Antipodean Da\u0027an", "transport": "About a 7-minute walk from Exit 1 of MRT Xinyi Anhe Station"}, {"address": "No. 245, Jiaxing St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | Tucked away in a quiet alley of Da\u0027an District, this vintage industrial-style independent cafe boasts a charming green garden and nostalgic old-house vibes. Their hand-drip coffees feature clean, distinct layers of flavor, paired perfectly with freshly baked daily chiffon cakes and aromatic cinnamon rolls. Its cozy, peaceful setting without time limits serves as a secret haven for creators and coffee lovers to spend a relaxing afternoon.", "name": "Taimo Cafe", "transport": "About a 6-minute walk from Exit of MRT Liuzhangli Station"}, {"address": "No. 16, Lane 208, Ruian St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | An iconic brand for classic Geisha pour-overs and specialty coffee in Taipei, the Ruian branch exudes a sophisticated, classic cafe charm. Its highlight feature is table-side hand-drip service, where baristas personally brew coffee right at your table while explaining the bean\u0027s flavor profile. Accompanied by delicate Japanese handmade desserts and light brunch options, the harmonious blend of rich coffee notes and velvety cake delivers a truly premium coffee experience.", "name": "Zhanlu Coffee Ruian Branch", "transport": "About a 7-minute walk from Exit of MRT Technology Building Station"}, {"address": "No. 24, Shida Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | A hugely popular aesthetic American brunch restaurant near the Shida Commercial District, occupying a spacious and cozy green standalone building. Classic Boston brunch sets and Eggs Benedict options are extraordinarily generous, served with bottomless select drinks for fantastic value. Featuring golden crispy fries and creamy soft omelets, its vibrant, comfortable dining vibe makes it perfect for family gatherings or hanging out with friends.", "name": "Second Floor Cafe Shida Branch", "transport": "About a 5-minute walk from Exit 3 of MRT Taipower Building Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 200, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.4 stars | A landmark Mediterranean bistro located at the entrance of the Yongkang Shopping District, serving classic regional dishes infused with Middle Eastern and Mediterranean flavors all day long. Their signature \u0027Panini\u0027 is pressed to crispy perfection on the outside while remaining soft inside, bursting with oozing cheese and aromatic herb filling for a rich, layered texture. The rich and fragrant \u0027Shakshuka\u0027 features a runny soft-boiled egg yolk blending seamlessly into a mildly spicy tomato sauce\u2014absolutely irresistible when dipped with toasted crispy bread. Whether for a tourist break or a local gathering, its comfortable multi-story space and vibrant, relaxing bistro atmosphere make it immensely popular.", "name": "Toasteria Cafe Yongkang", "transport": "About a 1-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 6, Lane 198, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Tucked away in the alleys of Yongkang Street, this classic Taiwanese restaurant meticulously selects local seasonal ingredients to present pure, nostalgic traditional dishes. The signature \u0027Farmhouse Black Pork\u0027 boasts a springy skin and tender meat, rich in savory fat without feeling greasy. The \u0027Blanched Chicken\u0027 features firm and juicy meat that pairs perfectly with special chili soy sauce to highlight its natural sweetness. The \u0027Braised Pork with Cabbage\u0027 absorbs sweet stew gravy and melts in your mouth. While appearing simple, the dishes offer profound flavors; together with cozy nostalgic wooden decor and warm service, it attracts countless foodies and international travelers seeking authentic Taiwanese taste.", "name": "Feng Sheng Restaurant", "transport": "About a 3-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 11, Lane 219, Sec. 1, Fuxing S. Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A landmark bistro listed among Asia\u0027s 50 Best Bars and recommended by the Michelin Guide, seamlessly integrating local Taiwanese tea leaves and specialty agricultural products into modern cocktails and exquisite dishes. The signature \u0027Tea-Infused Cocktails\u0027 infuse the delicate aromas of High Mountain Oolong and Baozhong tea into refreshing spirits, delivering a smooth palate with a lingering sweet finish. Pair them with local-ingredient dishes like \u0027Seared Scarlet Shrimp \u0026 Tea-Smoked Duck Breast\u0027, offering crispy-on-the-outside, tender-on-the-inside meat imbued with subtle smoke and juicy sweetness. A top-tier sanctuary of creativity and refinement, it is a must-visit in Taipei for cocktail enthusiasts and gourmands worldwide.", "name": "Indulge Experimental Bistro", "transport": "About a 5-minute walk from Exit 3 of MRT Zhongxiao Fuxing Station"}, {"address": "No. 29, Lane 240, Guangfu S. Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.7 stars | A high-end Kung Fu Chinese bistro inspired by the philosophy \u0027a mountain needn\u0027t be high, as long as a deity is present,\u0027 reinterpreting Taiwanese and regional cuisine in a sophisticated bar style. The signature \u0027Mountain \u0026 Sea Steamed Egg\u0027 generously tops silky steamed egg with sea urchin, scallops, and caviar, exploding with umami in every bite. The \u0027Ultimate Taiwanese Crispy Duck\u0027 features an irresistibly crackling skin and tender, juicy duck meat. Elevating traditional banquet fare and refined Chinese stir-fries to new heights paired with creative signature cocktails, it is a top-rated choice for nightlife and gatherings in Taipei\u0027s Daan District.", "name": "The Hermit Bistro (Taipei Sun Yat-sen Memorial Hall Branch)", "transport": "About a 3-minute walk from Exit 2 of MRT Sun Yat-sen Memorial Hall Station"}, {"address": "No. 6, Lane 11, Sec. 2, Dunhua S. Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.4 stars | A distinctive European seafood bistro in Daan District, showcasing regional ocean cuisine made from flash-frozen daily catches and exquisite cooking techniques. The signature \u0027Seared Scallop Seafood Risotto\u0027 retains an authentic al dente bite in every grain of rice, rich with concentrated shrimp stock broth, complemented by scallops that are caramelized on the outside and tender inside. The \u0027Charcoal-Grilled Fresh Catch\u0027 offers crispy skin, fine meat, and pure oceanic saltiness with juicy flavors. Paired with curated white wines and a sleek dark industrial ambiance, it delivers a dual visual and culinary feast.", "name": "VG The Seafood Bar Taipei", "transport": "About a 7-minute walk from Exit 2 of MRT Xinyi Anhe Station"}, {"address": "No. 18, Sec. 3, Jinan Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Discreetly tucked away in a leafy alley off Jinan Road, this omakase-style private Taiwanese bistro is renowned for its warm wooden aesthetic and creative local dishes. The signature \u0027Steamed Fish with Homemade Sauce\u0027 features tender, silky fish perfectly paired with sweet juices and custom fermented black bean or herb sauces. The \u0027Handcrafted Pork \u0026 Vegetables with Egg Crepe\u0027 and \u0027Slow-Simmered Broth\u0027 offer rich, smooth soups bursting with the concentrated essence of fresh ingredients. Free from extravagant plating, it touches hearts purely through fresh ingredients and supreme craftsmanship, making it a favorite among dignitaries, business elites, and cultural figures.", "name": "Sizhitang", "transport": "About a 5-minute walk from Exit 6 of MRT Zhongxiao Xinsheng Station"}, {"address": "No. 67, Dongfeng St., Daan Dist., Taipei City", "feature": "\u2b50 4.4 stars | A renowned menu-less custom cocktail bistro in Daan District, captivating guests with innovative tailor-made drinks and high-caliber international regional cuisine. The signature \u0027Truffle Fries\u0027 are crispy outside, fluffy inside, and rich with luxurious truffle aroma. The \u0027Italian Herb Grilled Short Ribs\u0027 are seared to a slight crisp, opening to reveal tender, juicy pink meat cooked to perfection. Bartenders craft one-of-a-kind drinks tailored precisely to guests\u0027 tastes, while the lively and open bar atmosphere lets everyone immerse in a delightful, tipsy evening.", "name": "Fourplay Cuisine", "transport": "About an 8-minute walk from Exit 6 of MRT Daan Station"}, {"address": "No. 11, Aly. 2, Lane 345, Sec. 4, Ren\u0027ai Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Located in an alley off Ren\u0027ai Road, this dreamy fairy-tale themed bistro is famous for its visually dramatic signature cocktails and exquisite Euro-Asian regional dishes. The signature \u0027Tomahawk Pork Chop with Special Sauce\u0027 is thick and hearty without being dry, featuring evenly distributed marbling that bursts with grilled aroma and sweet juices in every bite. The \u0027Creamy Mentaiko Seafood Pasta\u0027 offers al dente noodles coated in rich, velvety sauce with popping mentaiko in every mouthful. Featuring eye-popping cocktail presentations, it\u0027s a popular check-in spot for friend gatherings and romantic dates.", "name": "Chinese Whispers Bistro", "transport": "About a 6-minute walk from Exit 3 of MRT Zhongxiao Dunhua Station"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 17, Lane 116, Sec. 1, Da\u0027an Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | A wildly popular American-style vegetarian restaurant awarded the Michelin Bib Gourmand, elevating plant-based dining to a sophisticated and stylish level. Signature dishes include the rich and smooth \u0027Pink Sauce Pasta\u0027, as well as crowd favorites like \u0027Mexican Grilled Corn with Red Sauce\u0027 and \u0027Korean Spicy Fried Mountain Yam\u0027\u2014crispy on the outside, tender and velvety on the inside. It shatters traditional views on vegetarian food and is beloved by foodies and young crowds alike.", "name": "Little Tree Food Daan", "transport": "MRT Zhongxiao Fuxing Station Exit 3, about a 5-minute walk"}, {"address": "No. 16, Lane 107, Sec. 1, Fuxing S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.3 stars | A top-tier soy-focused vegetarian restaurant renowned for carefully selected organic soybeans and handmade tofu skin. Highlights include the signature \u0027Freshly Made Organic Tofu Pudding\u0027 and \u0027Lace-Crust Pan-Fried Dumplings\u0027, which feature a crispy bottom and sweet, juicy vegetable filling. The \u0027Handmade Nigari Tofu\u0027 is silky and dense, rich with pure bean aroma. With an elegant, comfortable Japanese wooden interior and clear dietary labeling (vegan/ovo-lacto vegetarian), it\u0027s a top choice for health-conscious diners and gatherings.", "name": "Delisoys", "transport": "MRT Zhongxiao Fuxing Station Exit 4, about a 3-minute walk"}, {"address": "No. 9, Lane 31, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.2 stars | A long-standing cultural teahouse and vegetarian restaurant located next to Yongkang Park, steeped in serene Oriental Zen vibes. Combining organic local Taiwanese ingredients into refined vegetarian creations, signature items include the fragrant \u0027Wild Mushroom Rice\u0027, cooked to chewy perfection in mushroom broth, and \u0027Organic Handmade Tofu\u0027 served with a special sauce that melts in your mouth. Enjoying premium organic Oolong tea and vegetarian set meals by the lush window makes it a favorite destination for international tourists.", "name": "Hui Liu Tea House", "transport": "MRT Dongmen Station Exit 5, about a 6-minute walk"}, {"address": "No. 21, Lane 52, Sec. 1, Da\u0027an Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | A rare find in Taiwan\u2014a 100% plant-based stir-fry bistro (Taiwanese \u0027Re Chao\u0027) that redefines traditional stir-fry with a healthier, less oily approach while keeping a lively atmosphere. The signature \u0027Special Kung Pao Chicken\u0027 uses plant-based meat and fresh king oyster mushrooms stir-fried over high heat for that perfect wok hei, yielding a crispy exterior and tender bite packed with spicy, savory flavor. The \u0027Salted Egg Yolk Bitter Gourd\u0027 is coated in a rich vegan salted egg yolk sauce, delightfully crispy and non-greasy. Ideal for gatherings and drinks with friends.", "name": "Chao Chao Vegan", "transport": "MRT Zhongxiao Fuxing Station Exit 4, about a 5-minute walk"}, {"address": "No. 40, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | A highly popular vegan handmade baozi shop in the Yongkang Shopping District, insisting on fresh dough rolling and stuffing every day. The signature \u0027Potherb Mustard Bun\u0027 features a chewy, aromatic dough filled with crunchy potherb mustard and savory dried tofu. The \u0027Mushroom \u0026 Bamboo Shoot Bun\u0027 boasts a soft sourdough dough bursting with juicy bamboo shoots and mushrooms. Preservative-free and affordable, this street food delight constantly draws eager crowds.", "name": "Element Vegetarian Baozi", "transport": "MRT Dongmen Station Exit 5, about a 7-minute walk"}, {"address": "No. 15, Lane 147, Sec. 3, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | A uniquely flavorful meatless Sichuan dry pot restaurant in Da\u0027an District, tailor-made for spicy food enthusiasts. Diners can pick their own fresh vegetables, custom tofu skin, and various plant-based meats, all stir-fried over high heat. Infused with aromatic Sichuan peppercorns, it offers a tingling yet smooth spiciness while keeping ingredients crisp and packed with flavor. With customizable spice levels and ingredients, it\u0027s a hotspot for both trendy foodies and loyal regulars.", "name": "Spicy Veggie Dry Pot", "transport": "MRT Daan Station Exit 1, about a 3-minute walk"}, {"address": "No. 19, Lane 233, Sec. 1, Dunhua S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | A highly praised vegan Italian restaurant in the Eastern Shopping District that uses no pungent roots (alliums) or dairy/eggs, showcasing the pure deliciousness of plant-based ingredients. The signature \u0027Truffle \u0026 Wild Mushroom Risotto\u0027 features al dente rice coated in rich truffle aroma and velvety plant-based cream. The \u0027Vegan Cheese Pizza\u0027 comes with a crispy crust topped with luscious, stretchy dairy-free cheese that recreates authentic Italian flavors. A favorite among strict vegans and travelers alike.", "name": "Mani Mani Vegan Restaurant", "transport": "MRT Zhongxiao Dunhua Station Exit 4, about a 4-minute walk"}, {"address": "No. 7, Alley 26, Lane 300, Sec. 4, Ren\u0027ai Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | Founded by a South African female chef, this international vegan restaurant serves healthy, zero-allium dishes free of chemical additives. The signature \u0027South African BBQ Skewers\u0027 use natural ingredients to achieve an amazingly hearty texture and authentic smoky flavor. The \u0027Italian Mac \u0026 Cheese\u0027 is rich, creamy, and lets vegan cheese shine to its fullest. With its warm, elegant ambiance and delightful global flavors, it stands out as a hidden paradise for plant-based food lovers.", "name": "Mianto Vegan Restaurant", "transport": "MRT Xinyi Anhe Station Exit 1, about a 6-minute walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 1, Lane 6, Yongkang St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.1 Stars | A classic budget-friendly treat located in the heart of Yongkang Street, where the irresistible aroma of fried dough and fresh scallions fills the air from afar. Hot off the griddle, these golden pancakes are skillfully fluffed and patted by the vendor to create distinct, flaky layers. Crispy and crunchy on the outside while delightfully chewy and sweet from scallions inside. Adding an egg and Thai basil elevates the flavor to a whole new level! Drizzle with special chili sauce and sweet chili sauce for a rich, vibrant taste. It\u0027s an absolute must-try grab-and-go snack when visiting the Yongkang Shopping District.", "name": "Tianjin Scallion Pancake", "transport": "Approx. 3-min walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 186, Sec. 1, Heping E. Rd., Da\u2019an District, Taipei City", "feature": "\u2b50 4.3 Stars | A super popular local favorite near Shida and Da\u0027an District that consistently draws long queues. Made to order, these deep-fried shredded radish pancakes feature a golden, ultra-crispy crust that gives off an audible crunch with every bite. The inside is bursting with juicy, freshly shredded radish that maintains a sweet yet subtly peppery kick. The contrast between the moist filling and crispy shell is delightfully non-greasy. Highly praised by local students and visiting foodies alike for its great value and satisfying taste.", "name": "Wenzhou Street Radish Pancake Master", "transport": "Approx. 10-min walk from Exit 5 of MRT Guting Station"}, {"address": "No. 15, Yongkang St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.0 Stars | A famous old-school dessert spot tucked away in the alleyways of Yongkang Street, drawing taro lovers from all over. The signature candied taro is slow-simmered until extraordinarily soft, velvety, and melt-in-your-mouth, yet retains a subtle chewiness. Rich taro aroma spreads across your palate with a perfectly balanced sweetness. Served over finely shaved ice drenched in fragrant brown sugar syrup, and topped with chewy taro and sweet potato balls, this refreshing dessert is the ultimate traditional Taiwanese summer treat.", "name": "Yongkang Taro King", "transport": "Approx. 4-min walk from Exit 5 of MRT Dongmen Station"}, {"address": "1F, No. 9, Lane 31, Yongkang St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.2 Stars | Hailing from Yilan, this gourmet handmade tofu pudding (douhua) is crafted using Yilan Snow Mountain spring water and natural nigari. The result is a silky, smooth texture accented by a subtle natural soy flavor and signature smoky undertones. What makes it famous is the unique addition of freshly shaved maltose peanut candy and cilantro\u2014bringing elements of Yilan\u0027s traditional peanut ice cream roll into a bowl of douhua. The interplay of soft pudding, crunchy sweet peanuts, and aromatic herbs creates a stunning visual and taste sensation that tourists flock to try.", "name": "Baishui Douhua (Taipei Yongkang Branch)", "transport": "Approx. 5-min walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 31, Alley 50, Lane 39, Tonghua St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.3 Stars | A Michelin Bib Gourmand-recommended staple at Tonghua Night Market! Hot, freshly boiled handmade sticky rice balls (tangyuan) are served over a bed of finely shaved ice, creating a unique fire-and-ice sensation. Biting into the tangyuan releases a rich, molten filling of sesame or peanut lava, while the outer skin contracts on the ice to become delightfully chewy. Finished with homemade sweet osmanthus syrup and a spritz of fresh lemon juice, the subtle floral sweetness and tangy kick complement the warm, sweet dumplings wonderfully.", "name": "Yu Pin Yuan Iced and Hot Tangyuan", "transport": "Approx. 5-min walk from Exit 3 of MRT Xinyi Anhe Station"}, {"address": "No. 19-1, Linjiang St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.1 Stars | Another Michelin Bib Gourmand recommendation at Tonghua Night Market, famous for its uniquely aromatic deep-fried stinky tofu and spicy duck blood tofu. The deep-fried stinky tofu is fried to order until golden and extra crispy on the outside while staying tender and juicy inside. Stuffed with savory garlic sauce and tangy Taiwanese pickled cabbage, every bite bursts with flavor. Their spicy tofu features a rich, numbing broth that thoroughly infuses the soft tofu pores, making it a late-night feast highly recommended by locals and gourmets.", "name": "Yakou Spicy Tofu", "transport": "Approx. 6-min walk from Exit 3 of MRT Xinyi Anhe Station"}, {"address": "No. 24, Lane 39, Shida Rd, Da\u2019an District, Taipei City", "feature": "\u2b50 3.9 Stars | The most iconic hot braised food (lu wei) stall in Shida Night Market, offering dozens of fresh ingredients displayed for custom picking. Their proprietary herbal braising broth is intensely fragrant, infusing meats, tofu products, and fresh vegetables deeply without being overly salty. Served steaming hot with a generous heap of scallions and pickled mustard greens, the juicy morsels burst with layered aromas. Add their signature chili sauce for an extra kick! Excellent value and generous portions make this an unforgettable late-night memory for students and travelers.", "name": "Lantern Lu Wei (Shida Main Store)", "transport": "Approx. 5-min walk from Exit 3 of MRT Taipower Building Station"}, {"address": "No. 33, Alley 50, Lane 39, Tonghua St, Da\u2019an District, Taipei City", "feature": "\u2b50 4.0 Stars | A legendary cold braised food stall in Tonghua Night Market with multiple years of Michelin Bib Gourmand recognition. Ingredients are carefully steeped in a secret recipe master broth before being cooled to lock in rich, savory flavors. Signature items like duck wings, dried tofu, seaweed, and chicken feet are delightfully chewy and flavorful with every bite. Drizzled with fragrant specialty chili oil and garnished with pickled mustard greens, it offers a savory, spicy crunch\u2014perfect as a late-night snack or street bite while exploring.", "name": "Liang Ji Cold Braised Food (Liang Ji Lu Wei)", "transport": "Approx. 5-min walk from Exit 3 of MRT Xinyi Anhe Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dongmen, Yongkang Street and Da\u0027an"}, "zhongshan": {"categories": {"cat_1": {"items": [{"address": "No. 11, Lane 140, Section 1, Zhongshan N Rd, Zhongshan District, Taipei City", "feature": "\u2b50 4.1 stars | Tucked away in a bustling alley near Zhongshan Station, this decades-old establishment is a must-visit traditional noodle and dumpling house recommended by local office workers and Japanese tourists alike. Their signature Pork Steamed Dumplings are steamed fresh to order; the handmade wrappers are springy and fragrant, bursting with rich, hot pork broth and a savory, juicy filling at first bite. Paired with a bold hot and sour soup and special garlic sauce, every bite offers an authentic taste of nostalgic old Taipei.", "name": "Fu Da Shandong Steamed Dumpling (Fu Da Dumpling)", "transport": "About a 2-minute walk from Exit 2 of MRT Zhongshan Station"}, {"address": "No. 4-1, Chifeng St, Datong District, Taipei City", "feature": "\u2b50 3.9 stars | A low-key old shop standing at the corner of Chifeng Street, without a big signboard yet always drawing endless queues. Its soul, the \u0027Traditional Pork Chop,\u0027 is marinated in a secret sauce and deep-fried to golden perfection. Crisp on the outside and tender on the inside, it is infused with inviting five-spice and garlic aromas. Served over rice drizzled with savory braised sauce and topped with a runny soft-boiled fried egg, mixing the egg yolk into the rice and savory meat creates a legendary comfort food loved by hipsters and locals alike.", "name": "Chifeng Street Nameless Pork Chop Rice", "transport": "About a 3-minute walk from Exit 5 of MRT Zhongshan Station"}, {"address": "No. 1, Lane 44, Chifeng St, Datong District, Taipei City", "feature": "\u2b50 4.2 stars | Boasting over half a century of history, this traditional noodle shop on Chifeng Street insists on preserving the most authentic classic Taiwanese flavors. The signature \u0027Full Set Noodles\u0027 includes tender sliced lean pork and a perfectly braised egg. The broth, slow-simmered with pure pork bones over hours, is clear yet rich and sweet. The handmade oil noodles absorb the aromatic broth and crispy fried shallots, offering a perfectly chewy texture that showcases the simple yet deep culinary charm of Dadaocheng and Chifeng Street.", "name": "A-Tian Noodles", "transport": "About a 4-minute walk from Exit 1 of MRT Shuanglian Station"}, {"address": "No. 136, Minsheng W Rd, Datong District, Taipei City", "feature": "\u2b50 4.2 stars | Founded in 1951, this famous long-standing dessert shop in Shuanglian is renowned for its traditional Taiwanese sweet soups and hot fried mochi made according to ancient recipes. The signature \u0027Hot Mochi\u0027 features an extraordinarily soft, chewy texture that doesn\u0027t stick to your teeth; slow-fried at low temperatures in warm oil and coated generously with aromatic peanut and sesame powder, it is delightfully warm, chewy, and aromatic. In summer, a bowl of traditional shaved ice topped with handmade taro paste, red beans, and soft rice balls offers rich textural layers, making it an unmissable sweet treat when exploring Zhongshan and Shuanglian.", "name": "Shuang Lian Rice Ball", "transport": "About a 3-minute walk from Exit 1 of MRT Shuanglian Station"}, {"address": "No. 31, Lane 1, Section 2, Chengde Rd, Datong District, Taipei City", "feature": "\u2b50 4.3 stars | A Michelin Bib Gourmand-recommended affordable traditional eatery tucked away in the alleys of the Chifeng Street area. The signature Beef Wrap features a flaky, golden-crisp pastry shell that crackles with every bite, wrapped around thick braised beef, fresh scallions, and sweet bean sauce\u2014delivering a divine balance of savory, sweet, crunchy, and tender textures. The Xiaolongbao soup dumplings have paper-thin skins brimming with rich broth, while the silky steamed dumplings and Moo Shu fried noodles all demonstrate superb craftsmanship and amazing value.", "name": "Chuan Mu Yuan Noodle Restaurant", "transport": "About a 4-minute walk from Exit 5 of MRT Zhongshan Station"}, {"address": "No. 12, Alley 9, Lane 45, Minsheng W Rd, Zhongshan District, Taipei City", "feature": "\u2b50 4.1 stars | Hidden in an alley of Shuanglian Market, this traditional Hakka savory tangyuan shop remains immensely popular after several decades. The signature Pork Liver Savory Tangyuan uses pure ground glutinous rice; the dumpling skin is silky, delightfully chewy, and subtly aromatic, filled with savory, seasoned pork. Its unique highlight is fresh blanched pork liver added to the broth\u2014tender, crisp, and clean-tasting. Combined with crown daisy and shallot-infused broth, it offers a rich, unique flavor loved by local foodies.", "name": "Yanshan Tangyuan", "transport": "About a 2-minute walk from Exit 2 of MRT Shuanglian Station"}, {"address": "No. 279, Linsen N Rd, Zhongshan District, Taipei City", "feature": "\u2b50 3.8 stars | A legendary late-night food spot in the Linsen North Road area, famous across Taipei for its thick rice noodles made from pure rice flour. The signature rice noodle soup features a milky white broth slow-boiled with pork bones and offal, yielding a sweet, rich, and fragrant broth. The thick rice noodles are pleasantly springy, absorbing the essence of the flavorful soup. Pairing it with traditional side dishes like tender red-grain fried pork, braised dishes, and mustard squid makes it the quintessential Taipei late-night dining experience.", "name": "Gao Jia Zhuang Rice Noodle Soup", "transport": "About a 10-minute walk from Exit 2 of MRT Zhongshan Station"}, {"address": "No. 226, Minsheng W Rd, Datong District, Taipei City", "feature": "\u2b50 4.0 stars | A Michelin Bib Gourmand-recommended establishment carrying on decades of traditional Qiezai noodle craftsmanship. The oil noodles are blanched to bouncy, translucent perfection, while the broth is meticulously simmered with pork bones and whole chickens, tasting sweet, clean, and un-greasy. A drizzle of crispy fried shallots adds the perfect finishing touch. Traditional side dishes such as small intestines, fried tofu, and deep-fried pork are meticulously prepared, fresh, and juicy, perfectly representing the purest nostalgic Taiwanese flavors.", "name": "A-Guo Cut Noodle", "transport": "About a 5-minute walk from Exit 1 of MRT Shuanglian Station"}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "No. 23, Lane 16, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Synonymous with classic Taipei waffles and brunch, this iconic cafe consistently draws long queues of locals and foreign tourists alike. The signature \u0027Strawberry Waffle\u0027 features a crispy exterior and soft, tender interior, served with rich custard, fresh strawberries, and a giant scoop of strawberry ice cream\u2014a sweet and tangy delight that keeps people coming back. Pair it with their \u0027Ice Drip Coffee,\u0027 slow-extracted over several hours for a rich, smooth flavor profile with hints of wine and nutty undertones. It\u2019s a timeless, top-tier afternoon tea experience in the Zhongshan shopping district.", "name": "Melange Cafe", "transport": "Approx. 3-minute walk from MRT Zhongshan Station Exit 4"}, {"address": "No. 19, Alley 9, Lane 64, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Famous across Taiwan for its bite-sized, plump, and adorable traditional Dutch poffertjes. Served hot off the griddle, these mini pancakes are wonderfully bouncy with a rich, buttery aroma. The \u0027Torched Lemon Butter\u0027 flavor comes highly recommended, featuring a bright, tangy lemon sauce drizzled over slightly caramelized pancakes for a multi-layered taste profile. Beyond desserts, they also offer hearty brunch platters and pasta, all set within a cozy, warm wooden interior that makes you feel instantly relaxed.", "name": "Dutch Poffertjes House (Nanxi Zhongshan Branch)", "transport": "Approx. 2-minute walk from MRT Zhongshan Station Exit 6"}, {"address": "2F, No. 2, Lane 49, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.1 stars | Opened on the second floor of a vintage building on Chifeng Street by a famous Tainan boba milk tea shop, this caf\u00e9 seamlessly blends Japanese select tableware with a plant-filled sanctuary ambiance. Popular items like the \u0027Waffle Cup\u0027 and \u0027Boba Milk Tea Cake\u0027 pair chewy boba pearls with rich, creamy flavors for a deliciously tactile treat. Beyond fine desserts and aromatic specialty coffees, guests can browse exquisitely crafted ceramics in a lush, rustic setting, making it one of the most stylish hipster spots along Chifeng Street.", "name": "Bu Bu Store", "transport": "Approx. 4-minute walk from MRT Zhongshan Station Exit R10 or Exit 4"}, {"address": "No. 25, Lane 49, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Tucked into a Chifeng Street alleyway, this iconic caf\u00e9 stands out with its striking bright orange retro American facade contrasted against traditional Taiwanese iron window grilles. The signature \u0027Cinnamon Roll\u0027 boasts a slightly crisp crust with a moist, soft interior, offering a rich cinnamon aroma without being overly spicy, topped with a smooth caramel frosting for maximum delight. Paired with a house-roasted pour-over coffee or a medium-dark Americano, the bittersweet balance is spot on, drawing endless streams of coffee lovers and sightseers.", "name": "Coffee Dumbo", "transport": "Approx. 3-minute walk from MRT Shuanglian Station Exit 1"}, {"address": "No. 18, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Located inside the historic SPOT-Taipei Film House compound, this caf\u00e9 features spectacular floor-to-ceiling glass house views overlooking a lush green garden. It serves a delightful selection of handmade French tarts and chiffon cakes; the \u0027Matcha Chiffon Cake\u0027 stands out with its cloud-light texture and perfectly balanced sweet-and-bitter matcha cream. During brunch, enjoy freshly pressed paninis and savory quiches while bathed in sunlight, soaking up a rare moment of urban tranquility and artistic charm.", "name": "Wool \u0026 Flower Spot", "transport": "Approx. 2-minute walk from MRT Zhongshan Station Exit 3"}, {"address": "2F, No. 22, Lane 49, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | Tucked away on the second floor of a vintage building on Chifeng Street, this caf\u00e9 rocks a Japanese Showa-era retro aesthetic filled with antique knick-knacks and cute illustrations. The signature \u0027Ice Cream Soda\u0027 features dreamy colors, combining rich vanilla ice cream with fizzy soda for a refreshing treat. For desserts, the \u0027Red Velvet Cake\u0027 and \u0027Matcha Red Bean Chiffon\u0027 are top choices\u2014moist, velvety, and balanced in sweetness. A must-visit retro afternoon tea spot while exploring Chifeng Street\u0027s alleys.", "name": "Tella Tella Cafe", "transport": "Approx. 4-minute walk from MRT Shuanglian Station Exit 1"}, {"address": "5F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Perched on the top floor of Eslite Spectrum Nanxi, this Japanese-style hipster burger and brunch cafe features soft wooden tones and a cozy wabi-sabi vibe. The signature \u0027Fried Onion Mount Fuji Beef Burger\u0027 features a crispy stack of fried onion rings piled atop a thick, juicy beef patty with proprietary Japanese sauce, creating an impressive look and delicious flavor complexity. Their brunch platters come with fluffy toast and generous salads, pleasing both the eyes and the palate.", "name": "Waku Waku Burger (Zhongshan Branch)", "transport": "Direct access from MRT Zhongshan Station Exit 1 via Eslite Spectrum Nanxi"}, {"address": "No. 1-4, Lane 20, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Located near the Zhongshan Station shopping district, this renovated historic glasshouse caf\u00e9 boasts fantastic natural light and lush greenery. Their brunch platters are exquisitely prepared; the \u0027Smoked Salmon Eggs Benedict on Bamboo Charcoal Toast\u0027 comes highly recommended. Cutting into the soft-poached egg releases a golden yolk that coats tender smoked salmon and crisp toast in rich, velvety goodness. Pair it with a smooth, flavorful latte\u2014perfect for catching up with friends or enjoying a quiet morning on your own.", "name": "Guang Yi Cafe", "transport": "Approx. 3-minute walk from MRT Zhongshan Station Exit 4"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 55, Changchun Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A decades-old Taiwanese restaurant in Zhongshan District, famous for its whole-chicken dishes. The signature Three-Style Chicken lets you taste black-feathered chicken, poached chicken, and smoked chicken all at once, featuring tender and juicy meat with a delicious secret dipping sauce. The classic chicken rice is simmered in rich chicken broth, absorbing all the aromatic essence. The complimentary handmade egg pudding served after the meal is silky smooth and rich\u2014an iconic local Taiwanese cuisine representative that tourists and foodies visiting the Zhongshan Shopping District must not miss.", "name": "Chicken House", "transport": "MRT Zhongshan Station Exit 3, about an 8-minute walk"}, {"address": "No. 38, Lane 132, Sec. 1, Nanking E. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | A contemporary Italian-French bistro hidden in a quiet alley of Zhongshan Shopping District, recommended by the Michelin Bib Gourmand for consecutive years. It specializes in creative fusion cuisine combining local Taiwanese ingredients with Western culinary techniques, such as Barrel-Roasted Chicken Risotto and Peeled Chili Pepper Pasta, offering rich layers and unique flavors. The warm and elegant ambiance paired with a selection of craft beers and natural wines makes it ideal for gatherings with close friends or romantic dates.", "name": "Page Light Bistro", "transport": "MRT Zhongshan Station Exit 2, about a 5-minute walk"}, {"address": "No. 11, Lane 49, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A vintage French bistro located in an old house on Chifeng Street, preserving a strong antique charm and traces of the blacksmith street\u0027s history. It serves exquisite French light bites, handmade pies, specialty cocktails, and specialty coffee. The signature French duck breast and red wine beef stew are tender and flavorful, perfectly paired with rich sauces and fine red wine, making it a favorite among hipsters, vintage lovers, tourists, and local youth.", "name": "Modern Mode Caf\u00e9 \u0026 Bistro", "transport": "MRT Zhongshan Station Exit R10 or Shuanglian Station Exit 1, about a 3-minute walk"}, {"address": "No. 5, Lane 133, Linsen N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | A traditional Japanese robatayaki izakaya full of authentic ambiance located in Zhongshan\u0027s Tiao-Tong district. Chefs use long wooden paddles to serve freshly grilled ingredients to customers, creating an immersive experience. Daily fresh seafood and charcoal skewers are grilled to a light, crispy char while locking in juicy perfection. Paired with an extensive selection of Japanese sake and draft beer, it recreates the lively vibe of a Showa-era izakaya\u2014a top choice for experiencing Zhongshan District\u0027s nightlife.", "name": "Tanuki Robata Izakaya", "transport": "MRT Zhongshan Station Exit 2, about an 8-minute walk"}, {"address": "No. 10, Lane 105, Sec. 1, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Founded in 1964 as Taiwan\u0027s first Taiwanese banquet restaurant, AoBa has been deeply rooted in Zhongshan District for decades, promoting refined traditional craft dishes. Must-orders include braised pork, pan-fried pork liver, and stir-fried squid; the pork liver is tender, odor-free, and melts in your mouth, while the traditional sweet potato porridge with various side dishes is truly heart-warming. The classical and grand dining atmosphere perfectly showcases the delicate flavors and hospitality of classic Taiwanese cuisine, making it immensely popular with Japanese and Korean tourists as well as family gatherings.", "name": "AoBa Taiwanese Cuisine", "transport": "MRT Zhongshan Station Exit 2, about a 6-minute walk"}, {"address": "No. 25, Lane 49, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | A Taiwanese-Japanese fusion izakaya housed in a converted iron foundry on Chifeng Street, preserving metallic industrial style with old-street cultural flair. They serve seared mentaiko chicken skewers, crispy pork belly, as well as various house special sours and craft beers. Skewers are crispy on the outside, tender on the inside, with a perfectly balanced sweet-and-savory sauce that bursts with juice in every bite. With dim lighting and a relaxing, lively vibe at night, it\u0027s a popular landmark for late-night snacks and drinks after strolling along Chifeng Street.", "name": "Tatie Ding 49 Izakaya \u0026 Bistro", "transport": "MRT Zhongshan Station Exit R10, about a 3-minute walk"}, {"address": "No. 9, Alley 13, Lane 12, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | An iconic budget-friendly Italian bistro in the Zhongshan Shopping District that has topped food queue lists for years. It features made-to-order pasta and risotto; the Pink Sauce Shrimp and Chicken Pasta is rich and smooth, with fresh, bouncy shrimp. The complimentary handmade desserts served after meals, such as Almond Parfait and Cr\u00e8me Caramel, are highly rated. Bright, spacious, and offering unbeatable value, it is favored by students, office workers, and shoppers alike.", "name": "RoseMary Bistro", "transport": "MRT Zhongshan Station Exit 3, about a 2-minute walk"}, {"address": "No. 1, Alley 6, Lane 13, Sec. 1, Nanjing E. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | An exquisite European bistro located in a quiet alley off Zhongshan North Road, helmed by a veteran chef team emphasizing natural flavors and superb cooking techniques. Signature dishes include Spanish Seafood Paella and Aged Steak; the paella absorbs rich seafood broth with al dente rice and incredible aroma. Featuring a low-key luxury ambiance and an extensive wine list, it is the top choice in Zhongshan District for fine dining and wine pairing experiences.", "name": "POPINA Bistro", "transport": "MRT Zhongshan Station Exit 2, about a 4-minute walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2F, No. 128, Songjiang Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.4 stars | A highly iconic vegetarian Dim Sum restaurant in Taipei, seamlessly combining traditional Cantonese dim sum techniques with refined plant-based culinary craftsmanship. Their signature \u0027Shredded Radish Pastry\u0027 features flaky, paper-thin, crispy outer layers filled with piping hot, sweet, and juicy shredded radish that melts in your mouth. The \u0027Truffle Vegetable Dumplings\u0027 boast a rich truffle aroma, surprising you with juicy, springy mushrooms with every bite. The exquisite artisanal craft and rich flavors shatter traditional stereotypes about vegetarian food, making it a premier choice for domestic and international tourists as well as family gatherings.", "name": "\u990a\u5fc3\u8336\u6a13 (Yang Shin Vegetarian Restaurant)", "transport": "About a 1-minute walk from Exit 8 of MRT Songjiang Nanjing Station"}, {"address": "No. 9, Alley 13, Lane 12, Nanjing W. Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.2 stars | Tucked away in a quiet alley of the Zhongshan Shopping District, this refreshing Japanese vegetarian restaurant specializes in egg-free, dairy-free, and fully vegan Japanese ramen, curry rice, and crispy tempura/fried delights. Their signature \u0027Nabeyaki Udon\u0027 features a broth simmered from a variety of vegetables, delivering a rich, smooth, warm, and sweet flavor paired with delightfully chewy udon noodles. The \u0027Crispy Egg-Free Tofu\u0027 is crispy on the outside and tender on the inside, tasting extraordinarily flavorful when dipped in their special sweet and savory sauce. Its clean, minimalistic hipster Japanese style combined with carefully selected natural ingredients makes it a favorite among young office workers and plant-based foodies.", "name": "\u4e95\u753a\u65e5\u5f0f\u852c\u98df\u6599\u7406 (Jing Machi Japanese Vegetarian)", "transport": "About a 3-minute walk from Exit 2 of MRT Zhongshan Station"}, {"address": "2F, No. 107, Sec. 2, Zhongshan N. Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.5 stars | Located near the Zhongshan Shopping District, this high-end Jiangzhe-style vegetarian tea house offers a classical, elegant atmosphere steeped in cultural refinement. Their signature \u0027Zen Style Dongpo Pork\u0027 ingeniously uses winter melon and select mushrooms to recreate the layered texture of lean and fatty meat. Braised over a low flame for hours, it is tender, deeply savory, sweet, velvety, and completely non-greasy. Paired with meticulously brewed Taiwanese high-mountain teas, the complex flavors elevate the dining experience, making it a must-visit for guests who appreciate refined, healthy dining and an elegant ambiance.", "name": "\u79aa\u98a8\u8336\u6a13 (Zen Tea Restaurant)", "transport": "About a 5-minute walk from Exit 2 of MRT Shuanglian Station"}, {"address": "No. 13, Lane 159, Linsen N. Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.1 stars | A long-standing, affordable traditional vegetarian eatery deeply rooted in Zhongshan District, serving the most authentic local Taiwanese plant-based street food. Their signature \u0027Vegetarian Braised Beef Noodles\u0027 features a broth simmered with natural Chinese herbs and nourishing ingredients, offering a warm, sweet, and aromatic taste. The noodles absorb the rich broth while remaining smooth and chewy. Complemented by deeply marinated, chewy vegetarian dried tofu and braised vegetarian beef chunks, the generous portions provide incredible value for money, making it a comforting daily staple for nearby residents and office workers.", "name": "\u842c\u58fd\u7d20\u98df\u5c0f\u5403 (Wan Shou Vegetarian Restaurant)", "transport": "About an 8-minute walk from Exit 2 of MRT Zhongshan Station"}, {"address": "Ningxia Rd., Datong District, Taipei City (Inside Ningxia Night Market, adjacent to Chifeng Street shopping district)", "feature": "\u2b50 4.3 stars | An immensely popular vegetarian stall located at the intersection of Ningxia Night Market and the Chifeng Street shopping district, known for high-quality, made-to-order Taiwanese local snacks. The signature \u0027Freshly Fried Vegetarian Pork Chop\u0027 boasts a golden, crispy exterior that crunches with every bite, revealing a chewy, hearty texture infused with subtle five-spice aromas. The \u0027Rich Vegetarian Thick Soup Noodles\u0027 features a perfectly thickened broth with the tangy sweetness of black vinegar and the umami of shiitake mushrooms, making it smooth and refreshing. It draws long lines of domestic and international vegetarian tourists eager for a taste.", "name": "\u6148\u97f3\u7d20\u98df (Ci Yin Vegetarian Food)", "transport": "About an 8-minute walk from Exit 1 of MRT Shuanglian Station"}, {"address": "No. 198-23, Minsheng W. Rd., Datong District, Taipei City", "feature": "\u2b50 4.2 stars | A traditional, humble vegetarian eatery nestled near the historic alleys of Chifeng Street, preserving authentic nostalgic flavors. The shop\u0027s \u0027Vegetarian Angelica Soup\u0027 is stewed with pure natural Chinese medicinal herbs, producing a deep amber broth that is sweet, rich, warming, and easy on the stomach. The \u0027Special Vegetarian Sesame Sauce Noodles\u0027 coats chewy noodles in a rich, non-greasy sesame paste and custom soy paste, topped with fresh blanched greens. This simple yet wonderfully pure flavor turns many stroll-by visitors on Chifeng Street into lifelong regulars.", "name": "\u963f\u83ef\u7d20\u98df (A-Hua Vegetarian Snack)", "transport": "About a 3-minute walk from Exit 1 of MRT Shuanglian Station"}, {"address": "2F, No. 27, Sec. 3, Zhongshan N. Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.6 stars | A stylish bistro specializing in 100% plant-based (Vegan) international cuisine and exquisite egg-free, dairy-free handmade desserts. The signature \u0027Plant-Based American Burger\u0027 features a patty seared to perfection\u2014crispy on the outside, juicy and hearty on the inside\u2014paired with custom vegan cheese sauce and crisp lettuce, delivering rich layers and refreshing textures with every bite. The artisanal \u0027Vegan Tiramisu\u0027 is silky, moist, and delightfully bittersweet, making this stylish and refined establishment a top destination for tourists and vegan enthusiasts alike.", "name": "\u8c9d\u591a\u857e\u7d0d (Bardo Vegan Bistro)", "transport": "About a 6-minute walk from Exit 9 of MRT Minquan W. Rd. Station"}, {"address": "No. 25-1, Lane 77, Sec. 2, Zhongshan N. Rd., Zhongshan District, Taipei City", "feature": "\u2b50 4.5 stars | A specialty noodle shop focusing on additive-free, handmade vegetarian dry-braised noodles and hipster-style braised side dishes. Their \u0027Sichuan Spicy Dry Noodles\u0027 use natural handmade noodles with superior springiness and chewiness. Tossed with special aromatic chili oil and rich sesame paste, it bursts with enticing aroma and a subtle numb spice without being overly fiery. Paired with \u0027Vegetarian Tofu Skin\u0027 and \u0027Pressed Tofu (Baiye Tofu)\u0027 that absorb the spicy broth until soft and velvety, alternating bites of noodles and braised snacks are pure bliss, earning top praise from young crowds in the Zhongshan district.", "name": "\u4e09\u6d25\u88fd\u9eb5 (San Jin Vegetarian Noodles)", "transport": "About a 4-minute walk from Exit 1 of MRT Shuanglian Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 25, Lane 49, Chifeng St, Datong District, Taipei City", "feature": "\u2b50 4.3 Stars | Tucked away in the alleys of Chifeng Street, this Japanese hipster-style food stall elevates traditional Taiwanese vermicelli into a luxurious seafood feast. The signature \u0027Luxurious Ocean Prince Vermicelli\u0027 features a whole fresh baby squid, plump oysters, pork intestines, and squid balls. The rich broth boasts sweet dried bonito and garlic undertones; the squid is delightfully bouncy, the oysters burst with freshness, and the grilled squid balls\u2014crispy on the outside, tender inside\u2014create a beautifully layered texture. With its retro vintage decor and lavish toppings, it\u0027s a must-visit check-in spot for tourists exploring Chifeng Street.", "name": "Mian Xian Ding", "transport": "MRT Zhongshan Station Exit R10, approx. 3 mins walk"}, {"address": "No. 15, Lane 49, Chifeng St, Datong District, Taipei City", "feature": "\u2b50 4.2 Stars | Evolving from a humble Taichung food cart into a famous concept store housed in an old building on Chifeng Street, Yuciren elevates the classic street snack of egg cakes into something refined and creative. Loved for classic flavors like \u0027Rich Milk\u0027 and \u0027Assam Black Tea,\u0027 these egg cakes feature a slightly crispy exterior and a fluffy, aromatic interior filled with milky or tea notes, yielding a warm, silky custard texture upon biting. The hipster vintage atmosphere and cute Yuciren mascot make this sweet street treat an irresistible handheld snack for shoppers.", "name": "Yuciren Egg Cake Taipei Concept Store", "transport": "MRT Zhongshan Station Exit R10, approx. 3 mins walk"}, {"address": "No. 136, Minsheng W Rd, Datong District, Taipei City", "feature": "\u2b50 4.1 Stars | Founded in 1951, this 70-year-old historic shop is an iconic traditional dessert spot in the Shuanglian and Chifeng Street neighborhoods. Its signature hot fried mochi (Shao Mochi) comes in sweet or savory variations; gently fried in low-temperature oil, it achieves an amazingly soft, chewy texture that never sticks to your teeth. Generously coated in fragrant peanut powder and sesame seeds, every bite bursts with rich nutty flavors. They also serve popular shaved ice in summer and hot tofu pudding in winter. The authentic traditional craftsmanship makes this a pilgrimage site for locals and travelers alike.", "name": "Shuanglian Rice Ball", "transport": "MRT Shuanglian Station Exit 1, approx. 3 mins walk"}, {"address": "No. 151, Minsheng W Rd, Datong District, Taipei City", "feature": "\u2b50 4.1 Stars | A landmark midnight food stall near Chifeng Street open late into the night. The signature Four Herbs Soup (Si Shen Soup) is slow-cooked with Chinese medicinal herbs like pearl barley and Chinese yam, producing a soothing, rich broth. Tables are equipped with free-flow Angelica medicinal wine for guests to add an extra splash of aroma. The pork intestines are meticulously cleaned, deliciously chewy, and full of flavor. Paired with a juicy, savory meat bun, it makes the ultimate combination\u2014a top choice for night owls and travelers seeking authentic Taipei late-night dining culture.", "name": "A-Tong A-Bao Four Herbs Soup", "transport": "MRT Shuanglian Station Exit 2, approx. 5 mins walk"}, {"address": "No. 20, Lane 25, Nanjing W Rd, Datong District, Taipei City", "feature": "\u2b50 4.2 Stars | Hidden in a narrow alley between Nanjing West Road and Chifeng Street, this authentic street stall insists on using real pork casing stuffed by hand wi
