        const db = {"beitou_yangmingshan": {"categories": {"cat_1": {"items": [{"address": "Stall 61, 2F, Beitou Market, No. 30, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 Stars | Acclaimed as one of Taipei\u0027s top three must-try braised pork rice spots! They select rich, marbled black pork slow-simmered for hours until the braising sauce turns a deep, enticing caramel color. Drizzled over distinct, perfectly cooked rice, every bite is silky, gelatinous, and delightfully sweet-savory. Paired with a bowl of sweet pork rib soup and flavorful braised tofu, it is an irresistible traditional feast that locals and tourists gladly queue up for.", "name": "A-Tsai Lu Rou Fan (\u77ee\u4ed4\u8ca1\u6ef7\u8089\u98ef)", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}, {"address": "No. 9, Zhongzheng Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 Stars | A legendary Taiwanese restaurant with decades of history recognized by Michelin Bib Gourmand. Their world-famous Crispy Fried Pork Ribs feature a golden, crunchy coating with juicy, well-marinated meat infused with aromatic five-spice and garlic\u2014remaining crispy even after cooling! The Tender Pan-Fried Pork Slices balance sweet and savory flavors perfectly, embodying the essence of classic banquet cuisine. Ideal for family gatherings or a satisfying feast after a hot spring soak.", "name": "Penglai Restaurant (\u84ec\u840a\u7cbe\u7dfb\u53f0\u83dc)", "transport": "MRT Beitou Station Exit 1, about a 3-minute walk"}, {"address": "No. 110, Wenquan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 3.9 Stars | A staple eatery in the Xinbeitou hot spring district for decades, making it a must-visit for travelers after a relaxing soak. The signature White Broth Chashu Ramen features a rich, creamy broth that remains light and non-greasy, paired with springy noodles, thick tender chashu pork, and a classic soft-boiled hot spring egg. Don\u0027t miss ordering the Hot Spring Tofu\u2014silky smooth with a pudding-like texture, topped with house sauce and bonito flakes that melt in your mouth.", "name": "Man Ke Wu Ramen (\u6eff\u5ba2\u5c4b\u6eab\u6cc9\u62c9\u9eb5)", "transport": "MRT Xinbeitou Station, about a 15-minute walk"}, {"address": "No. 129, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 Stars | An iconic local tea shop serving nostalgic drinks in Beitou for decades, consistently drawing long queues. The signature Black Tea is brewed from traditional roasted barley-infused tea leaves, delivering a smooth, gently sweet flavor without any astringency. Another crowd favorite is the Grass Jelly Milk Tea, featuring handmade silky grass jelly suspended in rich milk tea\u2014refreshing, satisfying, and the ultimate handheld drink while strolling through Beitou.", "name": "Mingquan Black Tea (\u660e\u6cc9\u7d05\u8336)", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}, {"address": "No. 48, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A popular local food stall near Beitou MRT Station, famous for its freshly handmade pork thick soup. The meat dumplings are crafted from premium pork ham, offering a springy, meaty texture with natural sweetness rather than excessive starch filler. The soup is slow-simmered with pork bones and daikon radish, producing a light, naturally sweet broth without overly heavy starch thickening. Add a dash of black vinegar and house-made chili sauce for an incredible flavor boost!", "name": "Han Qi Pork Soup (\u6f22\u5947\u8089\u7fb9)", "transport": "MRT Beitou Station Exit 1, about a 2-minute walk"}, {"address": "No. 55-11, Zhuzihu Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 Stars | The most popular traditional mountain chicken restaurant in Yangmingshan\u0027s Zhuzihu area, packed at every mealtime. Their signature Poached Chicken features golden skin, juicy tender meat, and a sweet natural flavor\u2014tasting divine when dipped in garlic-chili soy sauce. Additionally, the complimentary bottomless Sweet Potato Soup infused with aromatic ginger and fluffy sweet potatoes, alongside stir-fried high-altitude vegetables, makes for the ultimate feast after hiking or viewing calla lilies.", "name": "Qing Cai Yuan (\u9752\u83dc\u5712)", "transport": "Take the MRT to Shipai Station, transfer to Bus Small 8 to \u0027Zhuzihu Station\u0027, then walk"}, {"address": "No. 546, Yonggong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A renowned Taiwanese restaurant on Yangmingshan with over 30 years of history, honored with a Michelin Bib Gourmand recommendation. Raising their own free-range chickens, their Poached Heritage Chicken and Crispy Fried Bamboo Shoots are must-order signature dishes. Don\u0027t miss the Golden Mini Steamed Buns\u2014deep-fried to a golden crispy exterior with a soft fluffy interior, served with condensed milk for a delightful sweet dip. The lush green, antique setting makes it ideal for family dining.", "name": "Songzhu Yuan (\u677e\u7af9\u5712)", "transport": "Take the MRT to Jiantan Station, transfer to Bus Small 15, and get off near \u0027No. 546 Yonggong Rd.\u0027"}, {"address": "No. 517-4, Daye Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 Stars | Highly recommended by locals, this artisan tofu pudding shop crafts its desserts traditionally using pure soybeans. The tofu pudding is exquisitely silky, melt-in-your-mouth tender, and rich with authentic soy aroma. The sweet syrup is perfectly balanced, while toppings like soft peanuts, creamy red beans, and chewy boba pearls add delightful textures. Whether enjoying warm ginger syrup tofu pudding in winter or an ice-cold version in summer, every bowl offers pure traditional comfort.", "name": "Chuan Tong Zhi Zui Douhua (\u50b3\u7d71\u4e4b\u6700\u8c46\u82b1\u5802)", "transport": "MRT Beitou Station Exit 1, about a 3-minute walk"}], "name": "Famous Local Heritage Eateries"}, "cat_2": {"items": [{"address": "No. 70, Gezhi Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Located halfway up Yangmingshan, \u0027Camabang\u0027 is housed in a renovated 1960s Showa-style Japanese residence surrounded by a stunning, hidden bamboo forest. It specializes in exquisite specialty pour-over coffee and hearty Japanese-Western brunch platters. The signature brunch features freshly toasted, crispy French toast, silky scrambled eggs, and thick-cut bacon, offering remarkably rich layers of texture. Sitting on the traditional Japanese veranda, sipping freshly roasted single-origin coffee to the gentle rustle of the bamboo leaves, both tourists and locals are captivated by this tranquil Zen ambiance so rare in the city.", "name": "Cama Coffee Roasters Camabang", "transport": "Take bus 260 or R5 to \u0027Chinese Culture University Station\u0027, then walk about 3 minutes."}, {"address": "No. 4, Aifu 2nd St., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | Converted from a former US military housing unit on Yangmingshan, the White House preserves an American country-style white cottage feel complete with a cozy wooden fireplace. The coffee is brewed on-site using siphon and pour-over methods, yielding an intensely rich aroma. Top brunch recommendations include the \u0027Classic American Special\u0027 and \u0027Handmade Sandwiches\u0027. The toast is light and fluffy, paired with aromatic smoked ham and juicy Frankfurt sausages, showcasing thoughtful preparation in every bite. Its unique historical vibe and cozy photogenic setting make it a perfect spot for family gatherings and relaxing mornings on Yangmingshan.", "name": "BY33 White House (Yang Ming Mountain)", "transport": "Take bus 260, 303, or R5 to \u0027Sanzihou Police Station\u0027, then walk about 5 minutes."}, {"address": "No. 136-1, Jingshan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 stars | Tucked deep in the lush forests of Yangmingshan, this pure white glasshouse conservatory is completely surrounded by thriving greenery. The brunch menu exudes romantic French flair; popular items like the \u0027Warm Mushroom Truffle Salad\u0027 and \u0027Prosciutto \u0026 Cheese Sandwich\u0027 offer delicate textures, featuring crusty bread loaded with smooth cheese and savory ham that delivers a rich wheat and milky flavor. Enjoying a meal here accompanied by a fruity signature cold brew amidst dreamy sunlight filtering through the glass draws countless influencers and international travelers alike.", "name": "VVG Hideaway", "transport": "Take bus 303 to \u0027Lingtou Station\u0027 or \u0027Jingshan Town Station\u0027, then walk about 3 minutes."}, {"address": "Warehouse 1, No. 153, Datong St., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | Transformed from an old rice barn in Beitou, Sheme House is an industrial-style cafe brimming with historical charm through its aged brick walls and soaring wooden ceilings. Beyond high-quality house-roasted single-origin pour-overs, its homemade desserts and brunch light meals are equally impressive. The \u0027Pan-Seared Tender Chicken \u0026 Cheese Panini\u0027 is highly recommended\u2014crispy on the outside with molten cheese and succulent chicken on the inside, creating an addictive savory flavor. Whether you are relaxing after a hot spring soak or a local foodie, it is a beloved haven for a tranquil afternoon coffee.", "name": "Sheme House", "transport": "Take the MRT Tamsui-Xinyi Line to \u0027Xinbeitou Station\u0027 or \u0027Beitou Station\u0027, then walk about 8 minutes."}, {"address": "No. 133-15, Jingshan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Perched halfway up Yangmingshan, SAVAGE GARDEN is a semi-open scenic cafe styled like a vintage botanical garden, offering breathtaking vistas of the Guandu Plain and surrounding valley. Filled with foliage plants and antique furniture, the entry ticket can be redeemed for drinks and snacks. Popular brunch options include the \u0027Freshly Baked Cheese Croissant\u0027 and \u0027Quiche Lorraine\u0027. The flaky croissant delivers buttery goodness and gooey cheese in every bite. Paired with a rich caf\u00e9 latte, it\u0027s a sublime sanctuary to escape city bustle and rejuvenate.", "name": "SAVAGE GARDEN", "transport": "Take bus 303 Shuttle to \u0027International Radio Station\u0027, then walk about 5 minutes."}, {"address": "No. 49, Sec. 1, Fengnian Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.6 stars | Tucked away in Beitou\u0027s historic neighborhood, Beancoffee is a cozy independent cafe renowned for its exceptional house-roasted specialty beans and warm, friendly service. The owner is passionate about coffee brewing, offering unique house blends and signature drinks. For brunch, try the \u0027House-Baked Handmade Bagel Set\u0027\u2014chewy and dense bagels slathered with a thick layer of house-made garlic cheese or blueberry spread. The welcoming neighborhood vibe and top-tier coffee make it a daily go-to spot for Beitou locals.", "name": "Beancoffee Beitou", "transport": "Take the MRT Tamsui-Xinyi Line to \u0027Beitou Station\u0027, Exit 1, then walk about 5 minutes."}, {"address": "No. 42, Changchun St., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Set within the former US military quarters on Yangmingshan, Yannick Dream Village oozes vintage American suburban charm and a relaxed garden vibe. Beyond its famous raw milk rolls and pies, it serves refined American-style brunch and quiche sets. The \u0027German Sausage Quiche\u0027 features a buttery, flaky crust filled with savory egg custard and juicy sausage. Enjoying it with a signature iced coffee or English tea under lush shade trees makes you feel transported to a foreign town, making it a favorite for families and tourists.", "name": "Yannick Dream Village", "transport": "Take bus 260 or 303 to \u0027Sanzihou Police Station\u0027, then walk about 6 minutes."}, {"address": "No. 103, Wenquan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Nestled in an alley of the Xinbeitou hot spring district near Thermal Valley and the Beitou Hot Spring Museum, Cine Cafe is a hip, indie spot blending cinema culture with artistic vibes. The top brunch choice is the \u0027Special Thick-Cut Toast Brunch Platter\u0027, featuring toast that is crispy outside and soft inside, paired with a sunny-side-up egg, Mediterranean roasted vegetables, and a juicy herb chicken thigh. Sitting by the window watching the rising hot spring steam while sipping floral and fruity pour-over coffee offers the ultimate slow-living experience in Xinbeitou.", "name": "Cine Cafe", "transport": "Take the MRT Tamsui-Xinyi Line to \u0027Xinbeitou Station\u0027, then walk about 10 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 238, Zhonghe St, Beitou District, Taipei City", "feature": "\u2b50 4.3 stars | A decades-old legendary representative of Beitou\u0027s famous \u0027Banquet Cuisine\u0027 (Jiu Jia Cai). The must-try signature dish is the Crispy Fried Pork Ribs\u2014crispy and golden on the outside, aromatic, juicy, and well-marinated on the inside. The Pan-fried Pork in Sweet and Sour Sauce is tender and juicy, while the Poached Chicken is crisp-skinned and smooth, perfectly showcasing the glamorous food culture of this historic hot spring town. Highly loved by local foodies and tourists alike.", "name": "Penglai Taiwanese Cuisine (Beitou)", "transport": "About a 7-minute walk from MRT Xinbeitou Station"}, {"address": "No. 546, Yonggong Rd, Shilin District, Taipei City", "feature": "\u2b50 4.4 stars | A 30-year-old classic local restaurant on Yangmingshan honored with a Michelin Bib Gourmand recommendation. The signature Free-Range Yellow Chicken features thin skin, tender meat, and irresistible sweetness, perfectly paired with home-grown organic wild greens for a crisp, sweet finish. Their handmade steamed mini buns are soft, fluffy, and fragrant with wheat\u2014a quintessential delight you shouldn\u0027t miss when visiting Yangmingshan.", "name": "Songzhu Yuan Restaurant", "transport": "Take Bus 303 to \u0027Yonggong Rd. No. 546\u0027 stop"}, {"address": "No. 55-11, Zhuzihu Rd, Beitou District, Taipei City", "feature": "\u2b50 4.3 stars | The most popular local free-range chicken spot located in Zhuzihu. The signature Poached Cut Chicken is silky-skinned, delightfully tender, chewy, and bursting with rich juices\u2014dipped in their signature garlic soy sauce, it\u0027s pure perfection. Paired with steaming-hot sweet potato soup and stir-fried bird\u0027s-nest fern, it delivers a rich, sweet, and layered flavor profile, making it a must-visit eatery after flower viewing on Yangmingshan.", "name": "Qing Cai Yuan", "transport": "Take Bus S8 or S9 to \u0027Zhuzihu\u0027 stop and walk for about 5 minutes"}, {"address": "No. 33, Alley 4, Lane 61, Kaixuan Rd, Shilin District, Taipei City", "feature": "\u2b50 4.2 stars | A Bali-style scenic bistro offering romantic vibes and breathtaking panoramic night views of the Taipei Basin. Serving exquisite Taiwanese cuisine, BBQ, and specialty cocktails. The grilled skewers are crispy on the outside and tenderly juicy on the inside, complemented by smooth, pleasantly sweet and sour craft cocktails. The dreamy private cabanas and terraced lighting ambience make this the top choice for romantic dates and tourist visits.", "name": "The Top Resort \u0026 Bistro", "transport": "Take Bus 260 or R5 to \u0027Chinese Culture University\u0027 stop and walk for about 15 minutes"}, {"address": "No. 33, Alley 4, Lane 61, Guanghua Rd, Shilin District, Taipei City", "feature": "\u2b50 4.4 stars | A unique scenic bistro on Yangmingshan featuring birdcage-style private seating and a heart-shaped observation deck. The menu blends the essence of Sichuan and Taiwanese cuisines\u2014highlights include Typhoon Shelter Fried Shrimp, crisp and spicy, and Sour Cabbage Pork Pot with a tangy, appetite-whetting broth and silky meat slices. Enjoying craft beer while admiring the night view with a gentle breeze creates an incredible atmosphere.", "name": "Cao Shan Ye Wei Mian Bistro", "transport": "Take Bus 260 to \u0027Culture University\u0027 stop, then transfer to a taxi for about 5 minutes"}, {"address": "No. 224, Guangming Rd, Beitou District, Taipei City", "feature": "\u2b50 4.1 stars | An exquisite Taiwanese restaurant inside the SweetMe Hot Spring Resort, carrying on the legacy of Beitou\u0027s classic banquet cuisine. The iconic Squid and Snail with Garlic Sprouts Soup boasts a rich, sweet broth with chewy squid and sweet snail meat. Complemented by braised pork ribs and handmade banquet snacks, it offers rich layers of flavor, making it the perfect choice for high-quality local cuisine after a relaxing hot spring bath.", "name": "SweetMe Restaurant", "transport": "About a 3-minute walk from MRT Xinbeitou Station"}, {"address": "Next to No. 55-12, Zhuzihu Rd, Beitou District, Taipei City", "feature": "\u2b50 4.2 stars | A unique local restaurant tucked away next to a mountain forest stream, offering a dining environment that feels like being in the wild forest. They serve fresh, made-to-order stir-fried mountain vegetables like bird\u0027s-nest fern and Brazilian spinach, crisp and naturally sweet. Dine-in guests enjoy free piping-hot, mildly spicy, sweet ginger sweet potato soup, with sweet potatoes so tender they melt in your mouth\u2014brimming with rustic charm and outdoor fun.", "name": "Shan Yuan Wild Vegetables", "transport": "Take Bus S8 or S9 to \u0027Fengjiakou\u0027 stop and walk for about 3 minutes"}, {"address": "No. 11, Pingjing St, Shilin District, Taipei City", "feature": "\u2b50 4.5 stars | A green greenhouse botanical bistro on the mountainside of Yangmingshan, filled with vibrant green plants and vintage furniture. Offering light bites, craft beer, and exquisite cocktails; the fried platter is crispy on the outside, soft inside, and non-greasy, while special coffee and alcoholic drinks are rich in aroma. Immersing oneself in the lush mountain scenery and surrounding greenery is deeply refreshing.", "name": "Savage Garden Cafe \u0026 Bistro", "transport": "Take Bus 303 to \u0027Lingjiao\u0027 stop and walk for about 2 minutes"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 7, Lane 25, Sec. 1, Zhongyang S. Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | An immensely popular local traditional vegetarian noodle shop. The signature sesame noodles are rich and aromatic, paired perfectly with fresh-boiled carrot soup or vegetarian braised soup broth. The chewy noodles soak up all the flavorful broth, and adding their homemade chili sauce makes it exceptionally refreshing and appetizing\u2014a true favorite among vegetarians and locals alike.", "name": "Beitou Qing Xiang Vegetarian Noodle Restaurant", "transport": "About a 5-minute walk from MRT Beitou Station"}, {"address": "No. 13, Lane 2, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | A cozy vegetarian eatery near Beitou Station offering a wide variety of vegetarian fried rice, stewed rice, and freshly cooked combination noodle soups. Fresh ingredients with balanced seasoning\u2014neither greasy nor heavy\u2014and generous portions make this a fantastic spot to recharge before a hot spring tour.", "name": "Beitou Shang Pin Vegetarian Restaurant", "transport": "About a 3-minute walk from Exit 1 of MRT Beitou Station"}, {"address": "No. 56-7, Zhuzihu Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.1 stars | Situated next to the calla lily fields of Zhuzihu, this wild vegetable restaurant is famous for fresh mountain greens, sweet bamboo shoots, and hot ginger sweet potato soup. The crispy wild greens and dense, sweet potatoes provide a comforting dining experience that warms both body and soul amid the misty mountain air.", "name": "Yangmingshan Zhuzihu Miao Bang Vegetable Restaurant", "transport": "Take Bus S9 to \u0027Zhuzihu Station\u0027, then walk for about 3 minutes"}, {"address": "No. 30, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | A hugely popular vegetarian stall tucked away in Beitou Market, best known for its freshly fried vegetarian rolls and fragrant Angelica root soup. Golden and crispy on the outside, juicy and full on the inside, each bite offers a delightful crunch. An affordable traditional delicacy you shouldn\u0027t miss when visiting Beitou Market.", "name": "Beitou A-Cheng Vegetarian", "transport": "About an 8-minute walk from MRT Beitou Station to Beitou Market"}, {"address": "No. 11, Pingjing St., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | A scenic Yangmingshan caf\u00e9 combining lush greenery with plant-based light meals. It serves vegan desserts, oat milk lattes, and healthy plant meal boxes. With nuanced, layered flavors, stunning mountain views, and a greenhouse-like interior, it attracts countless plant-based food lovers and Instagrammers.", "name": "Yangmingshan Savage Garden", "transport": "Take Bus 303 to \u0027Lingtou Station\u0027, then walk a short distance"}, {"address": "No. 512, Daye Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.0 stars | A long-established, budget-friendly vegetarian buffet restaurant offering dozens of dish choices, ranging from side dishes and stir-fried seasonal vegetables to vegetarian stew pots. Lightly seasoned with low oil and salt, it perfectly preserves the natural sweetness of vegetables, making it a top daily dining choice for locals.", "name": "Beitou Ci Hang Vegetarian", "transport": "About a 4-minute walk from Exit 2 of MRT Beitou Station"}, {"address": "No. 546, Yonggong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | A Michelin Bib Gourmand-recommended mountain wellness restaurant offering a rich selection of wild vegetarian dishes such as steamed stinky tofu, stir-fried high-mountain cabbage, and handmade steamed buns. The spicy and savory stinky tofu absorbs the full flavor of the broth, which pairs unforgettably with soft, lightly sweet handmade buns.", "name": "Yangmingshan Songzhu Yuan Restaurant", "transport": "Take Bus S15 to \u0027Lingtou Station\u0027, then transfer to a taxi or walk"}, {"address": "No. 145, Sec. 1, Zhongyang N. Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | A traditional snack shop famous for handmade vegetarian dumplings and freshly steamed buns. The thin-skinned dumplings are packed with savory mushrooms, cabbage, and dried tofu\u2014juicy, chewy, and naturally sweet. Pairing them with the house-special vegetarian Shacha sauce elevates the flavor even further, keeping you coming back for more.", "name": "Beitou Yi Xin Vegetarian", "transport": "About a 6-minute walk from MRT Beitou Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Stall D433, Beitou Market, No. 30, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | A legendary queue-worthy stall hidden on the second floor of Beitou Market, famed for its deep, dark-gold braised pork rice. Finely chopped pork skin and fatty pork are slow-simmered for hours to release pure gelatin, leaving a sticky, lips-smackingly rich sensation with an explosion of savory-sweet aromas. The rice absorbs the flavorful dark gravy while staying perfectly distinct. Paired with a shiny braised hot spring egg whose silky yolk melts seamlessly into the sauce, this is the ultimate post-soak street food indulgence for foodies.", "name": "Ai Zai Cai Braised Pork Rice", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}, {"address": "Stall 7, 1F, Beitou Market, No. 30, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | A traditional tea stall beloved by Beitou locals since childhood. Their most popular signature brew, \u0027Wuyou Tea\u0027 (Carefree Tea), is a golden-ratio blend of oolong and green tea. Refreshingly crisp and floral with no bitterness, it leaves a delicate sweet aftertaste that cuts through greasiness instantly. Known for its generous bag-packaged black tea with rich malt aroma at affordable prices, drinking it from a retro bagged straw while strolling through Beitou\u0027s hot spring district is a quintessential local experience.", "name": "Gao Ji Tea House", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}, {"address": "No. 561, Daye Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | A renowned handmade tofu pudding shop on Daye Road in Beitou. The douhua (tofu pudding) is silky, velvety, and melts in your mouth, bursting with rich traditional soybean fragrance. The syrup is lightly sweet without being cloying, and the tender, cooked-to-perfection peanuts maintain their shape while melting into creamy goodness. Served warm or iced, it is a comforting, satisfying walking dessert favored by both hot spring bathers and locals.", "name": "Chuan Tong Zhi Zui Douhua (Best Traditional Tofu Pudding)", "transport": "MRT Beitou Station Exit 1, about a 3-minute walk"}, {"address": "No. 110, Wenquan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.0 stars | A classic food stall situated halfway up the New Beitou hot spring area. Their signature hot spring eggs are slow-cooked in high-temperature thermal waters until the whites achieve a velvety, soft-set texture and the yolk becomes rich and creamy. Topped with bonito flakes and custom Japanese soy sauce, it slides smoothly down your throat with a sweet, umami finish. Combined with crispy-outside, silky-inside hot spring tofu, it offers a distinct Japanese-style spa town vibe\u2014a must-try treat on the way to Thermal Valley.", "name": "Man Ke Wu Hot Spring Egg", "transport": "MRT Xinbeitou Station, about a 15-minute walk along Zhongshan Rd."}, {"address": "Stalls along Calla Lily Avenue, Zhuzihu Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.1 stars | Iconic roadside snacks in Yangmingshan\u2019s Zhuzihu area. Locally grown red-heart sweet potatoes are slow-cooked with brown sugar and maltose until golden and glossy, delivering a soft, chewy, and naturally sweet indulgence. Freshly charcoal-grilled pearl corn is brushed with a thick layer of classic satay sauce, giving it a smoky, crispy skin and juicy, bouncy kernels bursting with savory flavor. Enjoying these warm treats in the chilly mountain air is a delightful highlight during calla lily and hydrangea season.", "name": "Zhuzihu Honey Sweet Potato \u0026 Roasted Corn", "transport": "Take Bus Small 9 or 128 to \u0027Zhuzihu\u0027 Stop"}, {"address": "No. 47, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.1 stars | A long-standing iconic food stall in Beitou Market with decades of history. The pork ribs are marinated in a secret recipe, deep-fried to a golden crisp, and then steamed in small ceramic pots until the tender meat falls off the bone. The soup combines the subtle sweetness of winter melon with fragrant fried shallots, yielding a rich yet refreshing broth. Paired with springy oil noodles, the juicy, broth-soaked pork ribs offer a delightful interplay of textures that captures classic Taiwanese street flavors.", "name": "Jian Ji Pork Rib Noodles", "transport": "MRT Beitou Station Exit 1, about a 6-minute walk"}, {"address": "Lane 26, Guanghua Rd., Shilin Dist., Taipei City (Food Alley next to CCU)", "feature": "\u2b50 4.3 stars | A legendary food alley next to Chinese Culture University on Yangmingshan. The irresistible aroma of charcoal-roasted sausages entices visitors from afar. The sausage features a crispy, caramelized skin that bursts with juicy meat and rich rice wine aroma; paired with raw garlic, it delivers a thrilling kick of heat and savory flavor. Nearby beef dry noodles feature chewy noodles tossed in rich minced garlic and concentrated beef gravy\u2014spicy, bold, and served in massive portions, making it a beloved energy fuel for students and hikers.", "name": "CCU Roasted Sausage \u0026 Beef Noodles", "transport": "Take Bus 260 or Red 5 to \u0027Chinese Culture University\u0027 Stop, about a 3-minute walk"}, {"address": "1F, No. 22, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Operating in Beitou for over 30 years, this traditional shaved ice stall is famous for its generous toppings and freshly made ingredients. The fragrant brown sugar syrup is poured over finely shaved ice for a cooling, refreshing treat. Popular toppings like taro balls and sweet potato balls are bouncy and chewy with real vegetable bits, while the handmade taro chunks are stewed until silky and soft. Enjoying a large bowl of retro shaved ice after a warm soak is a favorite cool-down routine for visitors.", "name": "Chen Family Shaved Ice", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Beitou Hot Springs and Yangmingshan"}, "dadaocheng": {"categories": {"cat_1": {"items": [{"address": "No. 17, Lane 49, Bao\u0027an St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | Tucked under the massive banyan trees in front of Cisheng Temple, this decades-old shop serves what many locals consider the most authentic Taiwanese breakfast. The pork porridge features a light, naturally sweet broth simmered with dried shrimp and shredded bamboo shoots. The rice grains are tender yet hold their structure beautifully. The must-order side dish, deep-fried crispy pork, is crunchy on the outside and incredibly juicy inside, served with pickled cucumber slices to cut through the richness. It attracts countless domestic and international tourists looking to experience the nostalgic atmosphere of dining under big trees in a temple courtyard.", "name": "Ye\u0027s Pork Porridge (Cisheng Temple)", "transport": "MRT Daqiaotou Station, Exit 2, about a 5-minute walk"}, {"address": "No. 17, Lane 49, Bao\u0027an St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Also located in the Cisheng Temple courtyard, this decades-old stall is famous for its clear-stewed pork trotters. The pork trotters are simmered until delightfully chewy, rich in collagen, and completely free of gaminess. The skin is springy while the meat is meltingly tender. The milky-white broth is rich and sweet without feeling greasy, subtly infused with ginger and rice wine aromas. Dipped in their special garlic soy sauce, the flavors soar to another level. Paired with silky wheat vermicelli, it is a traditional masterpiece highly recommended by locals and foodies alike.", "name": "Xu\u0027s Pork Trotter Noodles Soup", "transport": "MRT Daqiaotou Station, Exit 2, about a 5-minute walk"}, {"address": "No. 106, Anxi St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A century-old noodle shop recommended by the Michelin Bib Gourmand, attracting long queues from the moment it opens every morning. The soul of the shop\u2014its Qiezai noodle soup\u2014boasts a rich, sweet broth and springy noodles. The crowd-favorite fried crispy pork (Hong Shao Rou) uses pork belly or lean meat fried to a golden crunch. Every crunchy bite bursts with juice, perfect when paired with their signature sweet and spicy sauce. It perfectly showcases the deep heritage of Dadaocheng\u0027s traditional street food.", "name": "Mai Mian Yan Zai (Jinquan Eatery)", "transport": "MRT Daqiaotou Station, Exit 1, about a 7-minute walk"}, {"address": "No. 2, Lane 247, Sec. 2, Yanping N. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Hailed by food connoisseurs as serving one of the absolute best fried pork belly dishes in Taipei. This traditional eatery insists on using fresh, non-frozen pork, offering six different cuts to choose from, including pork jowl, shoulder, and pork belly. Fresh out of the fryer, the skin is exceptionally crispy while the meat remains tender, pink, and remarkably juicy. The savory aromas blend seamlessly in your mouth. Paired with a bowl of traditional soup or dry noodles, it offers an unmatched, pure taste of Taiwanese culinary heritage.", "name": "Ah Jiao Crispy Pork (Liu Mei-Li)", "transport": "MRT Daqiaotou Station, Exit 1, about a 5-minute walk"}, {"address": "Stall 1428, 1F, Yongle Market, No. 21, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A century-old savory sticky rice legend inside Yongle Market, famous as the top choice for celebrities\u0027 baby full-month gift boxes and an iconic Dadaocheng delicacy. Made from a blend of premium rice and glutinous rice, stir-fried with fragrant mushrooms, dried shrimp, and shredded pork, the rice grains are perfectly distinct, chewy, and rich with soy sauce and fried shallot aromas. Topped with a glossy braised chicken leg and a braised egg, it\u0027s a famous classic that draws endless queues of tourists.", "name": "Lin He Fa Oil Rice", "transport": "MRT Beimen Station, Exit 3, about an 8-minute walk"}, {"address": "No. 21, Lane 233, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.1 stars | A traditional Fuzhou fish ball shop boasting over half a century of heritage, famous for its large, handmade fish balls. The outer paste is whipped from fresh shark meat, giving it a delicate, bouncy texture. Inside lies a rich, juicy, well-seasoned minced pork filling. Be careful when taking a bite, as the hot juice inside may burst out! The sweet fish paste and savory meat filling harmonize on the tongue, served in a refreshing pork bone broth with preserved cabbage. A classic flavor you can\u0027t miss when visiting Dihua Street.", "name": "Jia Xing Fish Ball", "transport": "MRT Beimen Station, Exit 3, about a 10-minute walk"}, {"address": "No. 34, Ganzhou St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | Founded in 1954, this heritage snack shop is famous for its seasonal menu shift: shaved ice with rice noodles (mitaimu) in the summer, and hot savory rice noodle soup with side dishes in the winter. Their handmade rice noodles are delightfully bouncy and smooth. In summer, served with brown sugar syrup and tapioca jelly, it offers a refreshing sweet treat to beat the heat; in winter, served in a rich pork broth topped with fried shallots, it delivers a warming, hearty meal. A true essence of traditional Taiwanese snacks and desserts.", "name": "Jia Er Zui", "transport": "MRT Daqiaotou Station, Exit 2, about a 7-minute walk"}, {"address": "No. 3, Minle St., Datong Dist., Taipei City", "feature": "\u2b50 4.0 stars | A famous decades-old traditional breakfast spot near Yongle Market, opening early in the morning. Their signature sailfish rice vermicelli features a broth slow-cooked with fresh sailfish chunks and pork bones, resulting in a rich, flavorful soup dotted with tender fish bits. The fine rice vermicelli absorbs the delicious broth while keeping its springy texture. Savvy foodies always order side dishes like deep-fried tofu, crispy oysters, or fried shrimp to go with it, creating an authentic memory of everyday street eats in Dadaocheng.", "name": "Minle Sailfish Rice Vermicelli", "transport": "MRT Beimen Station, Exit 3, about an 8-minute walk"}], "name": "Famous Local Traditional Shops"}, "cat_2": {"items": [{"address": "No. 197, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | A charming brunch spot tucked inside a historic heritage house with a leafy courtyard on Dihua Street. It is best known for its signature handmade cinnamon rolls and salted peanut rich cheesecake. The cinnamon roll boasts a crispy exterior and soft interior, drizzled with custom caramel sauce and infused with rich cinnamon aroma\u2014perfect when paired with a pour-over specialty coffee. The lush green courtyard allows tourists and locals alike to escape the urban hustle and enjoy a peaceful, sunny brunch.", "name": "Salt Peanuts Cafe", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "2F, No. 1, Ln. 32, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A classic old-house cafe hidden on the second floor of \u0027ArtYard\u0027 in Dadaocheng, brimming with a romantic, nostalgic artistic vibe. They specialize in self-roasted specialty single-origin pour-over coffees served strictly without milk or sugar, allowing guests to savor the purest coffee aromas and fruity acidity. Paired with lightly sweetened homemade cookies or scones, it offers a smooth, exquisite coffee experience highly praised by both local and international travelers who love Taiwanese historic architecture.", "name": "Luguo Cafe at ArtYard", "transport": "MRT Beimen Station Exit 3, about an 8-minute walk"}, {"address": "No. 14, Ln. 14, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | A stylish cafe hidden in a quiet lane inside a heritage home, famous for its exquisite caramel vanilla baked pudding and rich spiced dark curry rice. The pudding is exceptionally dense and velvety with a delightfully bittersweet caramel sauce, while their house-recipe dark curry offers deep, complex flavors. The retro green walls and vintage furniture create a cozy nostalgia, making it a must-visit spot for foodies and coffee enthusiasts visiting Dadaocheng.", "name": "Pallas Cafe", "transport": "MRT Beimen Station Exit 3, about a 6-minute walk"}, {"address": "No. 1, Sec. 2, Yanping N. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A flagship cafe dedicated to promoting Taiwanese locally grown specialty coffee beans, housed in the historic \u0027All Beauty Restaurant\u0027 building. It features a unique tasting format offering both cold-brew and hot pour-over servings for each order, allowing guests to savor the distinct fruity acidity and tea-like sweet finish of Taiwan\u0027s coffee regions. Served alongside delicate Taiwanese pastries and light snacks, it offers both visual elegance and a deep taste journey into Taiwan\u0027s premium coffee culture.", "name": "San Kosa Coffee", "transport": "MRT Beimen Station Exit 3, about a 7-minute walk"}, {"address": "No. 404, Minsheng W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A crossover brunch cafe blending Hong Kong Cha Chaan Teng elements with retro Taiwanese iron window grilles. Signature items include Hong Kong-style French toast, milk tea, and hot-pressed sandwiches. The French toast is crispy outside and soft inside, pan-fried to a golden brown with rich egg wash, topped with syrup and butter. Decorated with vintage record players and antique medicine cabinets, its charming nostalgic aesthetic is hugely popular among young crowds and tourists.", "name": "Wooo Cafe", "transport": "MRT Daqiaotou Station Exit 1, about a 10-minute walk"}, {"address": "No. 218-1, Guisui St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | A retro coffee shop imbued with Japanese Showa-era Kissaten nostalgia, playing vinyl records and old classics in a romantic, timeless atmosphere. It is acclaimed for its dark-roast pour-over coffees, homemade pound cakes, and tiramisu. The coffee is rich and bittersweet with a lingering aroma, while the tiramisu is moist, flavorful, and subtly infused with liqueur. The tasteful Showa space and delicate desserts make it a place of pilgrimage for vintage coffee lovers.", "name": "Fu Coffee Studio", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 280, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | A French vintage-style cafe located in the northern section of Dihua Street, bringing Paris Left Bank romance into a traditional Taiwanese heritage house. It serves specialty coffee blends, French toast, savory quiches, and light bites. The French toast is pan-fried to a golden, cloud-like tenderness with a rich milky flavor; paired with an aromatic French press coffee, it offers an exotic vibe\u2014making it a wonderful place to experience the east-meets-west charm of Dadaocheng.", "name": "Modern Mode Caf\u00e9", "transport": "MRT Daqiaotou Station Exit 1, about a 5-minute walk"}, {"address": "No. 161, Sec. 1, Huanhe N. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | An industrial-ruin style cafe housed in an old building near Dadaocheng Wharf, crafted from reclaimed wood and vintage materials to create a unique, cozy ambiance. Signature offerings include house-roasted pour-overs, Japanese caramel pudding, and special sourdough brunch sets. The pudding is smooth with a rich egg flavor and perfectly balanced caramel; the sourdough is crusty outside and soft inside, paired with melted cheese and smoked chicken for an addictive savory bite\u2014a great place to unwind after a walk along the riverbanks.", "name": "Erbianfeng Cafe", "transport": "MRT Beimen Station Exit 3, about a 10-minute walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 329, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Housed in a historic Taisho-era red-brick rice mill in northern Dihua Street, Rice \u0026 Shine serves set meals featuring freshly milled premium Taiwanese rice paired with exquisite local dishes. Highly recommended items include the \u0027Salted Pork with Salted Egg Yolk\u0027\u2014crisp on the outside, bursting with aroma, and coated in rich salted egg yolk\u2014and the \u0027Braised Taro Beef\u0027, which is melt-in-your-mouth tender, perfectly blending taro aroma with juicy beef. Both tourists and locals praise how it combines traditional rice culture with healthy modern cooking. Enjoying a steaming bowl of fragrant rice beneath century-old brick walls offers a deeply nostalgic and cultural experience.", "name": "Rice \u0026 Shine (Dadaocheng Branch)", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 169, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Founded by descendants of a decades-old Dihua Street dry goods store, Leeyu is an exquisite Taiwanese bistro that cleverly infuses traditional dried goods\u2014such as mullet roe, scallops, and ginseng\u2014into its cuisine. The must-try \u0027Mullet Roe Fried Rice\u0027 features distinct, wok-hei-infused grains topped with rich, slightly chewy seared mullet roe and crispy dried scallop threads for an unmatched texture. The \u0027Raw Scallop \u0026 Mullet Roe Lollipop\u0027 offers a wildly creative visual and taste experience. With a fresh and elegant ambiance, it elevates traditional ingredients into stylish delicacies, making it a favorite among young foodies and international visitors.", "name": "Leeyu", "transport": "MRT Daqiaotou Station Exit 1, about a 9-minute walk"}, {"address": "No. 242, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | Tucked away in a historic house, Tong An Le recreates the private banquet dishes of wealthy families from old Dadaocheng. The signature \u0027Braised Pork Trotters with Soybeans\u0027 is stewed to collagen-rich perfection\u2014tender, springy, and non-greasy\u2014absorbing the sweet flavor of soybeans and broth. The \u0027Stir-fried Shredded Dried Tofu and Pork\u0027 alongside traditional pastries served with High Mountain Oolong Tea offers timeless elegance. Visitors come to immerse themselves in a time-traveling nostalgic atmosphere, savoring refined traditional Taiwanese dishes surrounded by antique wooden furniture and vintage attire displays.", "name": "Tong An Le", "transport": "MRT Daqiaotou Station Exit 1, about a 7-minute walk"}, {"address": "3F, No. 76, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Tucked away on the 3rd floor of an old house on Dihua Street, this speakeasy gin bar and bistro boasts hundreds of gins from around the world alongside bespoke cocktails. Food options like the \u0027Spicy Braised Platter\u0027 and dried-goods-infused bar bites cleverly incorporate local Chinese herbs and specialty dried goods. The tender, springy braised beef shank infused with numbing spice pairs wonderfully with herbal gin cocktails. High ceilings and a vintage wooden bar create a dreamy, romantic vibe, making it the ultimate destination for a sophisticated night out in Dadaocheng.", "name": "Ginspiration", "transport": "MRT Beimen Station Exit 3, about an 8-minute walk"}, {"address": "No. 173, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.1 stars | Housed in a converted century-old leather shoe store with a deep courtyard, this Italian bistro features a stunning glasshouse private room in the back. Known for handmade pasta and wood-fired pizzas, signature dishes include the \u0027Handmade Fettuccine with White Wine, Clams, and Chili\u0027\u2014perfectly al dente and packed with sweet clam juices and garlic-chili aromas\u2014and the \u0027Parma Ham \u0026 Arugula Pizza\u0027 with a crispy, chewy crust balancing salty ham and peppery arugula. Its classic, romantic atmosphere makes it a favorite spot for dates and gatherings.", "name": "Mu Hill", "transport": "MRT Daqiaotou Station Exit 1, about a 9-minute walk"}, {"address": "No. 404, Minsheng W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | A unique fusion bistro combining a Hong Kong-style Cha Chaan Teng and a retro Taiwanese bar. The interior is decorated with antique Chinese medicine cabinets, Mount Fuji patterned glass windows, and vintage chairs. Food items include classic \u0027Hong Kong French Toast\u0027\u2014golden and crispy on the outside with rich peanut butter inside, drizzled with condensed milk for a sinfully delicious treat. At night, local craft beers and Taiwanese-Hong Kong fusion cocktails are served. Its nostalgic decor attracts countless photography lovers and foodies.", "name": "wooo", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 76, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.1 stars | Located opposite the Xia-Hai City God Temple, this classic bistro effortlessly blends local Dadaocheng Chinese herbal medicines, herbal teas, and Western cuisine. Recommended dish: \u0027Red Wine Braised Beef with Herbal Rice\u0027, featuring beef stewed until melt-in-your-mouth tender in a rich wine sauce with subtle herbal sweetness. Pairing it with fruit tea or Taiwanese-style cocktails adds to the unique experience. Its elegant, retro atmosphere makes it a wonderful place to unwind and savor fusion food after strolling through Dihua Street.", "name": "Fleisch Bistro", "transport": "MRT Beimen Station Exit 3, about an 8-minute walk"}, {"address": "No. 28, Sec. 2, Yanping N. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Located near the Dadaocheng shopping district, this trendy hip bistro specializes in American sourdough pizza and craft beer, featuring a sleek design that blends industrial and retro aesthetics. Their pizzas are made with naturally fermented sourdough\u2014such as the \u0027Pepperoni Cheese Pizza\u0027 with a crust baked to crispy, charred perfection that is airy, slightly tangy, and wonderfully chewy, topped with gooey cheese and savory pepperoni. Paired with selected craft beers, it\u2019s immensely satisfying. Its youthful, creative vibe makes it a highly popular gathering spot.", "name": "Pizza Has a Face", "transport": "MRT Beimen Station Exit 3, about a 7-minute walk"}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "In the alley beside No. 21, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | A long-standing local favorite serving traditional vegetarian snacks. Its braised vegetarian noodle soup features a rich, savory broth brimming with warm herbal and angelica root notes, served with chewy vegetarian meat chunks and springy noodles. The dry yi noodles tossed with special vegetarian minced pork sauce offer a sweet and savory harmony, garnished with crisp bean sprouts, attracting countless vegetarians and tourists seeking an authentic taste of old Taipei.", "name": "Dihua Street Vegetarian Noodles (\u8fea\u5316\u8857\u7d20\u98df\u9eb5)", "transport": "MRT Beimen Station Exit 3, about a 10-minute walk."}, {"address": "No. 17, Lane 49, Bao\u0027an St., Datong Dist., Taipei City (Food Street in front of Ci Sheng Temple)", "feature": "\u2b50 4.2 stars | A classic stall tucked away in the food street in front of Dadaocheng Ci Sheng Temple, famous for made-to-order broth noodles and crispy vegetarian rolls. The vegetarian rolls are fried to a golden crunch, stuffed with water chestnuts, tofu skin, and cabbage that burst with flavor in every bite. Paired with savory vegetarian rice drizzled with sweet chili sauce, dining under the ancient banyan trees adds a delightful touch of nostalgic charm.", "name": "Ci Sheng Temple Vegetarian Food (\u5927\u7a3b\u57d5\u6148\u8056\u5bae\u7d20\u98df\u5c0f\u5403)", "transport": "MRT Daqiaotou Station Exit 2, about an 8-minute walk."}, {"address": "No. 274, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Located inside a century-old red-brick historical building on Dihua Street, this vegan cultural teahouse offers an elegant and peaceful setting along with vegetarian light meals and healthy herbal teas. Popular options include vegan nut pastries and handmade grain cookies\u2014crumbly, sweet, rich in nut aroma, and completely free of chemical additives. Guests can sip fragrant tea while savoring the blend of history and healthy food, making it an ideal escape from urban bustle.", "name": "Jing Si Books \u0026 Cafe Dadaocheng (\u975c\u601d\u66f8\u8ed2 \u5927\u7a3b\u57d5\u5e97)", "transport": "MRT Daqiaotou Station Exit 1, about a 6-minute walk."}, {"address": "No. 223, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A traditional steamed rice cake shop with over 70 years of heritage, persisting in handcrafting 100% vegan, egg-free, and dairy-free treats. The fresh sweet osmanthus red bean cake is soft and pillowy, melting effortlessly on the tongue with subtle osmanthus floral aromas and fine, moderately sweet red bean paste. Its artistic presentation and commitment to traditional plant-based craftsmanship make it a top pick for local foodies and international travelers.", "name": "Shanghai Hoshing 1947 (\u5408\u8208\u58f9\u7396\u8086\u67d2)", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk."}, {"address": "Stall 1429, 1F, Yongle Market, No. 21, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A highly popular classic pastry shop located inside Yongle Market, famous for its variety of vegan and lacto-vegetarian steamed buns and mantou. The signature Cabbage Vegetarian Bun features a soft, springy dough made from sourdough starter, stuffed with sweet cabbage, shredded mushrooms, and tofu skin in perfect dough-to-filling ratio. The Layered Taro Bun offers a smooth, delicate taro flavor with clear layers and balanced sweetness\u2014a must-try vegetarian walk-around snack in Dadaocheng.", "name": "San Fa Baozi (\u4e09\u767c\u5305\u5b50\u5c08\u8ce3\u5e97)", "transport": "MRT Beimen Station Exit 3, about a 9-minute walk."}, {"address": "No. 247, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Founded in 1953, this is Dihua Street\u0027s iconic Japanese vegan confectionery shop. The signature Strawberry Daifuku features an ultra-chewy mochi skin wrapped around smooth red bean paste and a fresh, juicy sweet-and-sour whole strawberry, delivering a delightful burst of flavor in every bite. Free of artificial preservatives, its top-tier vegan sweets draw endless queues of happy customers.", "name": "Ziyang Wagashi (\u6ecb\u990a\u548c\u83d3\u5b50)", "transport": "MRT Daqiaotou Station Exit 1, about a 5-minute walk."}, {"address": "No. 136, Minsheng W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | An 80-year-old vegetarian dessert shop adjacent to the Dadaocheng commercial district, renowned for its low-temperature fried hot mochi (Shao Mochi). Freshly scooped hot mochi is tossed in rich peanut or sesame powder, offering a chewy, non-sticky texture where nut aromas and sweet rice flavors harmonize beautifully. All shaved ice and hot dessert soups are strictly vegan or lacto-vegetarian, making it a must-visit spot for traditional local sweets.", "name": "Shuang Lian Rice Ball (\u96d9\u9023\u5713\u4ed4\u6e6f)", "transport": "MRT Shuanglian Station Exit 1, about a 3-minute walk."}, {"address": "No. 15, Lane 247, Sec. 2, Yanping N. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | A highly recommended hidden-gem vegetarian spot in Dadaocheng, specializing in traditional vegetarian noodle thick soup (vermicelli) and vegetarian thick soup (geng). The vermicelli soup base is slow-cooked with fresh fruits, vegetables, and mushrooms, yielding a smooth, perfectly thickened texture filled with tender wood ear mushrooms, Thai basil, and savory custom vegetarian meat substitute. Add a spoonful of house-made chili oil for a spicy, fragrant kick\u2014an authentic, budget-friendly meal loved by locals.", "name": "Qing He Vegetarian Vermicelli (\u6176\u548c\u7cbe\u820d\u7d20\u98df\u9eb5\u7dda)", "transport": "MRT Daqiaotou Station Exit 1, about a 7-minute walk."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Stall 1438, 1F, Yongle Market, No. 21, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Tucked inside Yongle Market, this century-old sticky rice shop is a top choice for Taipeiers celebrating a baby\u0027s first-month milestone. Made with high-quality Ponlai rice stir-fried with fragrant shiitake mushrooms, dried shrimps, and shredded black pork, the sticky rice offers a savory, chewy, yet non-greasy texture filled with sesame oil and soy aromas. Topped with a thick, tender braised chicken leg and a braised egg, it\u0027s a classic market delicacy loved by both locals queuing up and tourists visiting Dadaocheng.", "name": "Lin He Fa Sticky Rice (\u6797\u5408\u767c\u6cb9\u98ef\u5e97)", "transport": "MRT Beimen Station Exit 3, about an 8-minute walk"}, {"address": "Lane 49, Bao\u0027an St., Datong Dist., Taipei City (In front of Dadaocheng Cisheng Temple)", "feature": "\u2b50 4.5 stars | A popular stall on the food street in front of Cisheng Temple, even featured on international food shows. Unlike traditional red-braised versions, their clear broth pig\u0027s knuckle soup is rich in collagen and surprisingly refreshing. The pork skin is chewy and the meat is tender with zero gaminess. Dipping it into the special chili soy sauce and garlic paste adds delightful layers of flavor. Paired with silky handmade vermicelli and enjoyed under the massive banyan trees, it offers a rich nostalgic vibe of old Taipei.", "name": "Xu\u0027s Pig\u0027s Knuckle Noodles (\u8a31\u4ed4\u8c6c\u8173\u9eb5\u7dda)", "transport": "MRT Daqiaotou Station Exit 2, about a 5-minute walk"}, {"address": "Lane 49, Bao\u0027an St., Datong Dist., Taipei City (In front of Dadaocheng Cisheng Temple)", "feature": "\u2b50 4.3 stars | A three-generation classic street food stall at Cisheng Temple that was featured on the Japanese TV show \u0027Solitary Gourmet\u0027. The pork porridge is made by simmering raw rice grains in rich bone broth with shiitake mushrooms and dried shrimps, resulting in a refreshing, soup-rice texture unique to northern Taiwan. Must-order pairings include crispy fried red-fermented pork and fried squid. The pork is crispy on the outside, juicy with balanced fat and lean meat on the inside\u2014dipped in sweet chili sauce, it makes the ultimate local Taiwanese breakfast combination.", "name": "Ye Family Pork Porridge (\u8449\u5bb6\u8089\u7ca5)", "transport": "MRT Daqiaotou Station Exit 2, about a 5-minute walk"}, {"address": "No. 388, Minsheng W. Rd., Datong Dist., Taipei City (Arcade at Dihua St. Intersection)", "feature": "\u2b50 4.4 stars | Located under the arcade at the intersection of Dihua Street and Minsheng West Road, you can smell the rich herbal aroma from afar. Their Four Herbs Soup features coix seed, lotus seed, and a splash of Angelica wine, giving the dark broth a subtle herbal sweetness while the pork intestines are cooked until extremely tender. Paired with a freshly steamed large meat bun featuring soft, fluffy dough and a juicy, black-pepper-seasoned pork filling, it\u0027s a perfect piping-hot street snack while strolling around Dihua Street.", "name": "Miao Kou Four Herbs Soup \u0026 Meat Bun (\u5999\u53e3\u56db\u795e\u6e6f\u8089\u5305\u5c08\u8ce3\u5e97)", "transport": "MRT Shuanglian Station Exit 2, about a 12-minute walk or take a bus to Dihua St. Entrance"}, {"address": "Outdoor stall, No. 186, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A sensationally popular street dessert in Dihua Street that draws massive crowds during strawberry season. Freshly made on the spot, each Daifuku wraps a giant, vibrant red strawberry with a choice of smooth red bean paste or taro paste inside a chewy mochi skin. Taking a bite releases a burst of juicy, sweet and sour strawberry flavor that balances perfectly with the sweet filling and soft mochi. Visually adorable and delicious, it is an absolute must-try photo-worthy treat for tourists.", "name": "Dihua Street Strawberry Daifuku (\u8fea\u5316\u8857\u8349\u8393\u5927\u798f)", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "Stall 1508, 1F, Yongle Market, No. 21, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A century-old handmade popiah (fresh spring roll) stall inside Yongle Market, famous for its paper-thin, elastic handmade skins made live on site. Filled with freshly blanched cabbage, bean sprouts, red-fermented pork, dried tofu, crispy egg shreds, and fragrant peanut powder, it offers rich textural layers. The cabbage is sweet and juicy, egg shreds add crunch, and the slightly sweet peanut powder makes it super refreshing. Easy to hold and eat, it is a beloved traditional grab-and-go snack while exploring Yongle Market.", "name": "Lin Liang Hao Popiah (\u6797\u826f\u865f\u6f64\u9905)", "transport": "MRT Beimen Station Exit 3, about an 8-minute walk"}, {"address": "No. 106, Anxi St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 stars | A Michelin Bib Gourmand-recommended noodle shop with over 80 years of history, drawing long queues from early morning. The signature Qiezai noodles feature a sweet, rich broth and chewy noodles. However, the true star adored by foodies is their freshly deep-fried red-fermented pork belly\u2014ultra-crispy on the outside, succulent and juicy on the inside, dipped in nostalgic sweet chili sauce. Accompanied by side dishes like pork belly, offal cuts, and poached chicken, it presents authentic old-school Taipei market dining.", "name": "Mai Mian Yan Zai (\u8ce3\u9eb5\u708e\u4ed4 \u91d1\u6cc9\u5c0f\u5403\u5e97)", "transport": "MRT Daqiaotou Station Exit 1, about a 6-minute walk"}, {"address": "Lane 49, Bao\u0027an St., Datong Dist., Taipei City (In front of Dadaocheng Cisheng Temple)", "feature": "\u2b50 4.1 stars | A must-try old-school handmade glutinous rice sausage stall in front of Cisheng Temple, using real pork intestine casing stuffed with peanut-infused sticky rice. The sticky rice is soft and dense with subtle peanut and savory aromas, while the casing is chewy with no odor. Freshly sliced to order and topped with thick garlic soy paste, sweet chili sauce, and crisp pickled cucumber slices, it offers a rich yet non-greasy taste. Eating it under the big tree in front of the temple delivers a truly nostalgic Taipei street food experience.", "name": "A-Lan Glutinous Rice Sausage (\u963f\u862d\u5927\u8178\u714e)", "transport": "MRT Daqiaotou Station Exit 2, about a 5-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dadaocheng and Dihua Street"}, "maokong": {"categories": {"cat_1": {"items": [{"address": "No. 16-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | An iconic long-established tea cuisine landmark in Maokong, Master A-Yi skillfully infuses local Tieguanyin and Baozhong teas into Taiwanese and Hakka dishes. The signature Tea-Smoked Chicken features crispy skin and tender meat with a smoky, rich tea aroma; the Tieguanyin Shrimp Balls are crispy on the outside, bouncy on the inside, coated in a special sweet-and-sour tea sauce. The nostalgic ambiance paired with panoramic night views of the Taipei Basin makes it a favorite among international tourists and local foodies alike.", "name": "Master A-Yi\u0027s Big Tree Tea Restaurant", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 5 minutes."}, {"address": "No. 6, Lane 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | One of Maokong\u0027s oldest 24-hour teahouses, hidden away in a lush green valley. It offers a wide variety of traditional Kung Fu teas, handmade dim sum, and Taiwanese snacks. The soup dumplings (Xiao Long Bao) are juicy and bursting with flavor, while tea-flavored pastries are flaky, light, and sweet\u2014perfect alongside freshly brewed Muzha Tieguanyin. With its charming vintage vibe, this has been a go-to spot for generations of Taipei residents to brew tea and take in the night scenery.", "name": "Yaoyue Teahouse", "transport": "Take the Maokong Gondola to Maokong Station, then transfer to the Maokong Left Line bus and get off at Yaoyue Teahouse Stop."}, {"address": "No. 22-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | An iconic classic restaurant in Maokong specializing in mountain delicacies and tea-infused cuisine, renowned for its signature roasted barrel chicken. The barrel chicken boasts golden, crispy skin and succulent meat infused with subtle hints of charcoal and tea leaves; the tea-infused fried rice is fragrant with distinct, flavorful grains. The spacious outdoor dining area offers expansive views, drawing countless family gatherings and international travelers.", "name": "Longmen Restaurant", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 8 minutes."}, {"address": "No. 33-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Located at the highest point of Maokong, this venerable scenic restaurant specializes in refined traditional Taiwanese cuisine infused with tea. The must-try Tieguanyin Clam and Chicken Soup features a sweet, savory broth with a delicate tea note and tender chicken; the Tea-Fragrant Pan-Fried Tofu is crispy outside, silky inside, and smothered in a rich savory sauce. Perched high with stunning sightlines toward Taipei 101, it is an extraordinary institution for authentic tea dining and spectacular panoramas.", "name": "Maokong Qingquan Villa", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 10 minutes."}, {"address": "No. 33-5, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Passed down through generations, this traditional tea plantation restaurant produces and sells its own premium Muzha Tieguanyin tea. Serving hearty, authentic dishes, their Tea-Fragrant River Shrimp are deep-fried to golden perfection and wonderfully crunchy; the Tieguanyin Camphor Tea Duck is crispy-skinned and aromatic with a signature smoky flair. Warm hospitality and genuine human warmth keep food lovers returning year after year.", "name": "Zheng Da Tea Garden", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 12 minutes."}, {"address": "No. 33, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | A classic wooden-style teahouse in Maokong combining traditional tea arts with local specialty dishes. The Tea-Fragrant Matsusaka Pork is highly recommended, featuring a crisp, springy texture accented by delicate Baozhong tea notes. Handmade Tieguanyin cookies and handmade soup dumplings are also signature snacks. Cozy and elegant inside, its large floor-to-ceiling windows look out onto lush tea gardens, making it a favorite among hipsters and international visitors.", "name": "Maokong Red Wood Tea House", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 7 minutes."}, {"address": "No. 19, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A 9th-generation historic tea farm and pioneer of tea-infused culinary arts in Maokong, bringing out the absolute best in organic Tieguanyin tea-infused creations. The signature Tea-Smoked Chicken is firm, sweet, and juicy; the Tea Oil Noodle Threads are aromatic without being greasy; and the Tea-Fragrant Dongpo Pork melts in your mouth without feeling overly fatty. Guests can savor nostalgic tea meals while immersing themselves in rich tea culture heritage.", "name": "Mei Jia Tea Garden", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 6 minutes."}, {"address": "No. 13, Lane 102, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A classic institution near Taipei Zoo and the foot of the Muzha hills. Operating for decades, it is one of Muzha\u0027s most iconic culinary destinations. The signature Smoked Goose features thin skin, tender meat, and bursting savory sweetness with a rich smoky flavor. Paired with nostalgic goose fat rice or traditional Qiezai noodles, every bite offers a memorable taste of local heritage beloved by locals and tourists alike.", "name": "Muzha Goose Specialist", "transport": "Take the MRT Wenhu Line to Muzha Station, transfer to Bus 236 Shuttle to Muzha Market Stop, then walk for about 3 minutes."}], "name": "Famous Local Institutions"}, "cat_2": {"items": [{"address": "No. 33, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 Stars | A super popular late-night scenic cafe located halfway up Maokong, famous for its exquisite mille-feuille cakes and hip, picture-book aesthetic. The signature \u0027Koyamaen Matcha Mille-Feuille\u0027 features paper-thin layers and a rich, silky matcha filling with a perfect balance of bitter and sweet. Paired with a fresh Tieguanyin fresh milk tea, it offers a sublime taste. The outdoor seating area overlooks the dazzling night views of Taipei 101 and the Taipei Basin, making it a top mountain retreat highly recommended for tourists and night owls alike.", "name": "Elsewhere Cafe Night", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 10-15 minutes after exiting."}, {"address": "Next to No. 33, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 Stars | An iconic outdoor scenic cafe in the Maokong area, featuring open-air panoramic views. Their handmade American pancakes are crispy on the outside and soft on the inside, releasing a rich aroma of eggs and wheat when fresh out of the iron. Drizzled with quality honey or custom caramel sauce and paired with a fresh espresso coffee, every bite is smooth and flavorful. Relaxing under colorful umbrellas while enjoying the gentle mountain breeze, lush green valleys, and glowing sunset, its laid-back atmosphere attracts countless visitors.", "name": "Maokong Xian Cafe", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk for about 12 minutes."}, {"address": "No. 304, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 Stars | A stunning industrial-style cafe converted from an old granary and abandoned factory, winner of the Taipei Old House Renovation Award. The cafe specializes in self-roasted specialty coffee and handmade desserts. The signature \u0027Lemon Tart\u0027 features a buttery, crispy crust with a sweet-and-sour filling bursting with aroma, which creates amazing layers of flavor when paired with a fruity pour-over coffee. The high-ceiling space with unadorned red bricks and wooden beams exudes artistic flair, making it a stylish must-visit spot before heading to Taipei Zoo or Maokong.", "name": "Ruins Coffee Roasters", "transport": "Take the MRT to \u0027Muzha Station\u0027, transfer to Bus 236 or 660, get off at \u0027Muzha Market Station\u0027, and walk for about 3 minutes."}, {"address": "No. 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A specialty themed cafe that cleverly blends local Muzha Tieguanyin tea culture with Western baked goods and desserts. The signature \u0027Tieguanyin Soft Serve Ice Cream\u0027 bursts with rich tea aroma, delivering a bold tea flavor with a pleasantly bitter-sweet finish. They also offer exquisite Tieguanyin cream puffs and tea-flavored tarts with rich layers that aren\u0027t overly sweet. The comfortable indoor seating offers a variety of tea and dessert sets, making it the perfect spot to experience local tea culture after visiting Taipei Zoo and Maokong.", "name": "TDH Cat Tea Town (Founding Store)", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, transfer to the Maokong Left Line Bus (Zoo Line), and get off at \u0027Zhangshan Temple / Cat Tea Town Station\u0027."}, {"address": "No. 217, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.7 Stars | A professional self-roasting specialty cafe with a warm and cozy atmosphere, located near NCCU and the foot of Maokong. The signature brunch platter is hearty and great value, featuring freshly toasted crispy bread paired with a fresh fruit-and-veg salad and pan-fried bacon. Order a hot latte made with house-roasted beans, offering silky smooth foam and a lingering coffee aroma. Excellent coffee quality and friendly service make it a favorite among locals, students, and hikers.", "name": "Melody Coffee Roasters", "transport": "Take the MRT to \u0027Taipei Zoo Station\u0027, transfer to Bus 236 or 282, get off at \u0027NCCU 1st Station\u0027, and walk for about 2 minutes."}, {"address": "No. 22, Lane 103, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 Stars | A hidden wooden cafe tucked away in an old lane of Muzha, featuring a spacious green lawn garden. It serves high-quality pour-over specialty coffee, chiffon cakes, and hearty signature brunch platters. Made-to-order, the toast is crispy on the outside and soft inside, with fresh and healthy ingredients. The serene and natural environment offers a sanctuary from the bustling city, making it a top choice for minimalist and retro aesthetic lovers visiting the foot of Maokong.", "name": "Liberty Hill CCIP \u0026 Cafe", "transport": "Take the MRT to \u0027Muzha Station\u0027, transfer to Bus 236 or 660, get off at \u0027Muzha Elementary School Station\u0027, and walk for about 3 minutes."}, {"address": "No. 115, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 Stars | A highly popular American-style brunch spot at the foot of Maokong, famous for its generous and hearty portions. The must-try \u0027Black Burger Series\u0027 features chewy black buns and thick, juicy handmade patties. Paired with freshly toasted paninis and crispy fries, it guarantees total satisfaction. Accompanied by a rich iced latte or fresh milk tea, it is the ultimate choice whether refueling before a hike or relaxing with friends after coming down the mountain.", "name": "Block Brunt", "transport": "Take the MRT to \u0027Taipei Zoo Station\u0027, transfer to Bus 236 or 282, get off at \u0027NCCU Station\u0027, and walk for about 4 minutes."}, {"address": "No. 215, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.8 Stars | A cozy, Japanese-style wooden indie coffee workshop focusing on exquisite pour-overs and homemade desserts. The popular \u0027Basque Cheesecake\u0027 is dense and smooth, melting in your mouth with rich cheesy goodness. Paired with a pour-over made from carefully selected light-roast single-origin beans, it offers rich floral layers and sweet-and-sour fruity notes. Outstanding customer reviews and heartwarming service make it a top-rated hidden coffee gem at the foot of Maokong.", "name": "Bean Light Coffee", "transport": "Take the MRT to \u0027Taipei Zoo Station\u0027, transfer to Bus 236 or 282, get off at \u0027NCCU 1st Station\u0027, and walk for about 2 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2F, No. 33-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A highly popular tea-infused cuisine restaurant near Maokong Gondola Station, famous for incorporating local Tieguanyin tea into its dishes. The signature \u0027Tea Oil Thin Noodles\u0027 are rich and silky, paired wonderfully with crispy \u0027Tea-Scented Roasted Chicken\u0027 and refreshing \u0027Green Tea Fried Rice\u0027. Every bite bursts with elegant tea aromas that unfold on the palate\u2014richly layered yet non-greasy, making it a favorite for tourists and family gatherings.", "name": "Maokong Four Brothers Tea Restaurant", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 3 minutes after exiting."}, {"address": "1F, No. 37-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | An iconic creative tea restaurant in Maokong, where Chef A-Yi expertly blends tea leaves with various Taiwanese culinary techniques. The \u0027Tieguanyin Tea Chicken Soup\u0027 comes highly recommended, offering a sweet, warm broth with subtle tea undertones and tender, juicy chicken. Another highlight is the unique \u0027Tea-Steamed Shrimp\u0027, where sweet white shrimp absorb rich tea flavors. Enjoying these alongside stunning night views of the Taipei Basin delivers an ultimate double delight for both sight and taste.", "name": "Master A-Yi\u0027s Big Tree Tea Restaurant", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 5 minutes after exiting."}, {"address": "No. 22-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | A famous scenic restaurant in Maokong with an atmosphere full of traditional charm and relaxed vibes. The signature \u0027Barrel-Roasted Chicken\u0027 features golden, crispy skin and juicy, tender meat, paired addictively with special tea-infused chicken dripping oil. Accompanied by \u0027Tea Oil Stir-Fried Cabbage\u0027 and \u0027Oriental Beauty Tea-Smoked Chicken\u0027, it offers fresh, sweet, and crisp flavors, making it a top choice for foodies enjoying night views and local specialties.", "name": "Longmen Restaurant", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, transfer to Bus S10 or BR15 to \u0027Tian\u0027en Temple Station\u0027, and walk a short distance."}, {"address": "3F, No. 33-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | An authentic mountain-produce tea-cuisine restaurant located on the high slopes of Maokong, offering a spectacular view overlooking Taipei 101. A must-try is the \u0027Pouchong Tea Soup Dumplings\u0027 (Xiaolongbao) with thin skin, juicy filling, and a fresh tea aroma that bursts in your mouth. The \u0027Tea Oil Bamboo Shoot Chicken Soup\u0027, made with high-quality local green bamboo shoots and free-range chicken, features a sweet, clear broth and firm, bouncy meat, drawing countless hikers and food lovers alike.", "name": "Maokong Ching Chuan Villa", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 5 minutes after exiting."}, {"address": "No. 6, Lane 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | A classic 24-hour teahouse hidden in a lush green valley, offering a serene and pleasant atmosphere. Beyond traditional tea brewing, its local specialties like \u0027Tieguanyin Soup Dumplings\u0027 and \u0027Tea-Scented Braised Beef Noodle Soup\u0027 are immensely popular. The springy noodles soak up the rich broth, while the tender beef is infused with a subtle tea sweetness\u2014the perfect culinary spot after late nights or mountain strolls.", "name": "Yaoyue Teahouse", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then transfer to the Maokong Left Line Bus and get off at \u0027Yaoyue Teahouse Station\u0027."}, {"address": "No. 19, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A tea restaurant run directly by local Maokong tea farmers, featuring dishes infused with self-produced Tieguanyin and Pouchong teas. The signature \u0027Tea-Smoked Pork Ribs\u0027 are crispy on the outside, tender on the inside, coated in a light tea aroma and sweet sauce. For dessert, the \u0027Tieguanyin Tea Jelly\u0027 offers a bouncy, smooth texture with rich tea flavor that isn\u0027t overly sweet\u2014a perfect display of authentic local tea-country home cooking.", "name": "Mei Jia Tea Garden", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 8 minutes after exiting."}, {"address": "No. 33-5, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | A long-standing local tea restaurant offering classic tea-infused dishes and traditional Taiwanese cuisine. The signature \u0027Tea Leaf Shrimp Balls\u0027 are wrapped in fragrant crispy tea leaves, with plump, springy shrimp that aren\u0027t greasy at all. The \u0027Handmade Noodles with Camellia Oil\u0027 carries a rich camellia oil and garlic aroma, offering a smooth texture packed with nostalgia, full of local character and a cozy vibe.", "name": "Zheng Da Tea Garden", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027, then walk for about 4 minutes after exiting."}, {"address": "No. 33, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Located right next to the Zhangshu Trail, this wooden scenic restaurant combines local Taiwanese dishes with a relaxed bistro atmosphere. Featured items like the \u0027Tieguanyin Roasted Chicken\u0027 are packed with flavor, boasting crispy skin and tender meat, along with various tea-infused specialty drinks and exquisite side dishes. Sitting in the outdoor seating area while savoring delicious food and taking in the panoramic views of the Taipei Basin makes it a favorite among young adults and foreign tourists.", "name": "Red Wood House Waffles \u0026 Tea", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk for about 3 minutes to reach near the Zhangshu Trail entrance."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 11, Lane 26, Laoquan St., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Nestled on the hilltop of Laoquan Street in Maokong, this vegan scenic restaurant serves exquisite, healthy vegetarian cuisine. Highly recommended is the \u0027Tieguanyin Tea-Scented Vegetable Hot Pot\u0027\u2014the broth is sweet and infused with a rich tea aroma, paired with fresh organic high-mountain wild vegetables and handmade tofu for a delightfully layered, light, and non-greasy taste. The tranquil outdoor garden features blooming flowers all year round, making it a favorite among vegetarian enthusiasts and visitors looking to escape the hustle and bustle.", "name": "Ciyin Villa Vegetarian Restaurant", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, transfer to the Maokong Gondola to Maokong Station, then take the Maokong Tour Bus Left Line (Zhinan Temple Line) and get off at Ciyin Villa Station."}, {"address": "1F, No. 37-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A long-standing tea cuisine restaurant
