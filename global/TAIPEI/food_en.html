 in Maokong, offering specially curated vegan and lacto-ovo vegetarian tea-infused dishes. The signature \u0027Handmade Tea-Flavored Vegetarian Steamed Dumplings\u0027 feature thin skins with generous fillings of fresh chopped cabbage, mushrooms, and special tea powder, bursting with flavorful juice and subtle Tieguanyin aroma in every bite. The \u0027Camellia Oil Vermicelli\u0027, crispy on the outside and soft inside, is another must-try snack, highly praised by tourists for its refreshing tea oil fragrance.", "name": "Big Teapot Tea Restaurant", "transport": "Take the Maokong Gondola to Maokong Station, exit and walk along Section 3, Zhinan Road for about 10 minutes."}, {"address": "No. 6, Lane 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Hidden in a lush green valley, this classic 24-hour teahouse serves a variety of vegetarian dim sum and health-conscious set meals. The must-try \u0027Tea-Flavored Vegetarian Siu Mai\u0027 features a chewy skin wrapped around shiitake mushrooms, wood ear, and yam, pairing wonderfully with freshly brewed Baozhong tea. Their \u0027Vegetarian Camellia Oil Fried Rice\u0027 boasts distinct, non-greasy grains infused with the delicate aroma of high-mountain tea oil, making it immensely popular among night-view seekers and slow-travel tea enthusiasts.", "name": "Yao Yue Teahouse", "transport": "Take the Maokong Gondola to Maokong Station, transfer to the Maokong Tour Bus Right Line, and get off at Yao Yue Teahouse Station."}, {"address": "No. 16-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | A teahouse brimming with classical Chinese garden charm, carefully preparing rich vegetarian tea set meals and exquisite tea snacks. The popular \u0027Vegetarian Tieguanyin Tea Hot Pot\u0027 brews a soup base with various herbs and selected Tieguanyin tea leaves, resulting in a smooth, rich flavor. Paired with silky wild wood ear mushrooms and handmade tofu, it offers wonderful depth. Enjoying delicious food while overlooking the night view of the Taipei Basin makes it a top choice for vegetarian gatherings.", "name": "Yuan Xu Yuan Tea House", "transport": "Take the Maokong Gondola to Maokong Station and walk for about 5 minutes after exiting."}, {"address": "No. 28, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | A popular scenic restaurant serving fusion vegetarian cuisine, famed for its romantic wooden cabin and unbeatable views. The \u0027Vegetarian Tea-Infused Wild Mushroom Pizza\u0027 features a freshly baked thin, crispy crust topped with assorted mushrooms, rich cheese, and a sprinkle of special Tieguanyin tea powder, offering an amazingly savory, crispy taste with subtle tea notes. Young travelers and foreign tourists highly acclaim this Western-style vegetarian dish infused with local tea culture.", "name": "Maokong Bistro", "transport": "Take the Maokong Gondola to Maokong Station and walk for about 6 minutes after exiting."}, {"address": "Above No. 33-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.0 stars | A highly-rated tea restaurant located high up in Maokong, offering fantastic panoramic views alongside a rich selection of vegetarian tea cuisine. A must-try dish is the \u0027Pan-Fried Vegetarian Camellia Oil Vermicelli\u0027\u2014crispy and golden on the outside while soft and chewy inside, bursting with intense tea oil and aged ginger aromas. Paired with the \u0027Steamed Vegetarian Cabbage Rolls\u0027 filled with sweet vegetables, mushrooms, and tofu, it\u0027s a refreshing, light choice perfect for recharging after a hike in Maokong.", "name": "Ching Chuen Plaza", "transport": "Take the Maokong Gondola to Maokong Station, transfer to the Maokong Tour Bus Left Line, and get off at Ching Chuen Plaza Station."}, {"address": "No. 33, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | A scenic teahouse featuring quaint wooden decor and large floor-to-ceiling windows, serving high-quality vegetarian tea set meals and handmade desserts. The \u0027Handmade Vegetarian Tea-Flavored Waffles\u0027 are especially recommended\u2014crispy on the outside, fluffy inside, and paired with a custom Tieguanyin tea sauce for a balanced sweetness with a lingering tea aftertaste. Also try the \u0027Vegetarian Yam \u0026 Wild Mushroom Stew\u0027, featuring a rich and smooth broth\u2014a delicious health-conscious option when visiting Maokong.", "name": "Red Wood Tea House", "transport": "Take the Maokong Gondola to Maokong Station and walk for about 8 minutes after exiting."}, {"address": "No. 161, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | A premium vegetarian restaurant located near the NCCU commercial area and Taipei Zoo at the foot of Maokong, renowned for its refined health concepts and whole-food ingredients. The signature \u0027Lion\u0027s Mane Mushroom Health Hot Pot\u0027 features tender, flavorful lion\u0027s mane mushrooms simmered in a rich broth infused with Chinese herbs and kombu, yielding a juicy and satisfying taste. Served with fresh purple rice and non-toxic seasonal wild greens, its pure flavor is beloved by locals and tourists looking for a healthy vegetarian meal after visiting the zoo.", "name": "Shui Yue Zhai Vegetarian Restaurant", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, transfer to Bus 236, 282, or Brown 3 to NCCU Station, then walk for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 16-8, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 Stars | A quintessential walk-and-eat dessert you simply can\u0027t miss in Maokong! Made with concentrated local Muzha Tieguanyin tea powder, it opens with a cool, smooth milky flavor followed by a rich, deep roasted tea aroma. Sweet without being cloying, it leaves a wonderfully mellow tea aftertaste. Topped with an adorable cat-shaped cookie, the crisp texture contrasts perfectly with the smooth soft serve\u2014a must-buy popular treat right after taking the gondola to Maokong.", "name": "Maokong Tea House Tieguanyin Soft Serve Ice Cream", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk for about 2 minutes after exiting."}, {"address": "Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City (Food stall cluster near Maokong Gondola Station)", "feature": "\u2b50 4.2 Stars | A popular street food stall located just a short walk from the Maokong Gondola Station exit. Premium black pork is marinated in a special Tieguanyin tea liquor before being slow-roasted over charcoal until the casing becomes golden, fragrant, and snappy. Every bite bursts with rich juices, followed by subtle tea notes and a hint of alcohol\u2014never greasy. It\u0027s a favorite treat for hikers and visitors after finishing the trails; pairing it with fresh garlic offers an authentically satisfying local experience.", "name": "Maokong Mountain Top Tea-Flavored Sausage", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk for about 1 minute."}, {"address": "No. 30, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City (Snack area next to the Giant Panda House)", "feature": "\u2b50 4.1 Stars | A themed snack kiosk located near the Giant Panda House inside Taipei Zoo. The most popular treat among kids and visitors is the super cute Yuan Yuan panda steamed bun, featuring a fluffy, chewy skin stuffed with rich, sweet sesame or red bean filling. The kiosk also serves classic hot dogs and juicy black pork sausages\u2014perfect walk-around snacks to quickly recharge while exploring the zoo. Plus, they look super eye-catching in photos!", "name": "Taipei Zoo Panda Buns \u0026 Hot Dog Kiosk", "transport": "Take the MRT Wenhu Line to \u0027Taipei Zoo Station\u0027, enter the zoo, and walk to the Giant Panda House."}, {"address": "No. 115, Wanshou Rd., Wenshan Dist., Taipei City (Shopping street near Zhinan Temple Gondola Station)", "feature": "\u2b50 4.4 Stars | A traditional handmade snack stall located along the Zhinan Temple approach trail, preserving classic flavors for decades. Made with natural cudweed grass, the dough is deliciously chewy and soft with a subtle herbal fragrance. The savory version is generously stuffed with fragrant shredded radish, mushrooms, and dried shrimps, offering a layered, savory flavor. Sweet red bean and taro fillings are also available, making it a must-buy traditional takeaway snack for pilgrims and hikers.", "name": "Zhinan Temple Trail Hakka Herbal Rice Cake", "transport": "Take the Maokong Gondola to \u0027Zhinan Temple Station\u0027 and walk for about 3 minutes after exiting."}, {"address": "Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City (Market around Maokong Gondola Station)", "feature": "\u2b50 4.3 Stars | A distinctive old-school grilled mochi stall located on Maokong Old Street. Pure handmade steamed glutinous rice mochi is grilled on a flat top until slightly crisp on the outside and gooey and stretchy on the inside, then coated in a choice of special Tieguanyin tea peanut powder or sesame powder. Piping hot, crispy on the outside, soft on the inside, and wonderfully chewy, each bite bursts with rich rice aroma and sweet tea notes\u2014a truly iconic Maokong mountain walk-and-eat dessert.", "name": "Chef Ah-Yi\u0027s Handmade Tea Mochi", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk for about 2 minutes after exiting."}, {"address": "Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City (Stalls near NCCU Main Gate)", "feature": "\u2b50 4.6 Stars | An immensely popular street food stall with constant queues in the NCCU shopping district at the foot of Mount Maokong. It\u0027s a must-eat before heading up Maokong or after visiting the zoo! Dough is freshly rolled per order and pan-fried to a golden crispiness\u2014delivering an audible crunch with every bite while keeping a tender, layered interior. Stuffed with abundant green scallions and a freshly cracked egg, brushed with special garlic soy paste and chili sauce, it\u0027s piping hot, savory, delicious, and incredibly high-value, loved by both students and tourists.", "name": "NCCU Main Gate Traditional Scallion Pancake with Egg", "transport": "Take Bus 236, 282, or Green 1 to \u0027National Chengchi University\u0027 stop, then walk about 1 minute."}, {"address": "Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City (Near the entrance of Maokong Observation Trail)", "feature": "\u2b50 4.0 Stars | A classic charcoal grill stall wafting delicious aromas across the Maokong mountain peak. Daily fresh glutinous corn is slow-roasted over charcoal and brushed with secret satay sauce and concentrated Tieguanyin tea-infused sauce. The corn kernels are pleasantly chewy, infusing smoky charcoal flavor with a uniquely sweet and fragrant tea glaze. The sweet-and-savory mix lingers wonderfully, making it a perfect snack to munch on while admiring the Maokong night view.", "name": "Maokong Specialty Charcoal-Grilled Tea Corn", "transport": "Take the Maokong Gondola to \u0027Maokong Station\u0027 and walk along Sec. 3, Zhinan Rd. for about 5 minutes."}, {"address": "No. 30, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City (Service hut in African Animal Area)", "feature": "\u2b50 4.2 Stars | A popular refueling snack kiosk located next to the African Animal Area in Taipei Zoo. Freshly fried churros feature an ultra-crispy crust and a fluffy interior, generously dusted with irresistible cinnamon sugar. Paired with rich Hokkaido milk sundaes or fruit popsicles, the contrast of warm, crispy churros and smooth, cold ice cream creates a delightful hot-and-cold sensation that delights kids and adults alike.", "name": "Taipei Zoo Churros \u0026 Ice Cream Kiosk", "transport": "Take the MRT Wenhu Line to \u0027Taipei Zoo Station\u0027, enter the zoo, take the park train to Bird World Station, and walk for about 3 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Maokong and Taipei Zoo"}, "shilin": {"categories": {"cat_1": {"items": [{"address": "No. 84, Danan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 Stars | A Michelin Bib Gourmand recommended spot located right in front of Shilin Cixian Temple. The vermicelli broth is meticulously simmered with bonito stock, creating a smooth and rich flavor base. Paired with tender, flavorful braised pork intestines and plump, fresh oysters, every bite bursts with rich ocean savory goodness. Adding their special garlic juice and chili oil makes it even more appetizing. It\u0027s an iconic traditional street food experience that locals and tourists alike enjoy while holding a bowl sitting on the temple steps.", "name": "Ah Hui Vermicelli", "transport": "MRT Jiantan Station Exit 1, about a 6-minute walk"}, {"address": "No. 49, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 Stars | A famous time-honored medicinal rib soup shop with a history spanning over 40 years, also repeatedly recommended by the Michelin Bib Gourmand. The soup is slow-cooked for hours with more than 15 traditional Chinese medicinal herbs, resulting in a rich, aromatic, and pleasantly sweet broth without bitterness. The pork ribs are stewed until tender enough to fall off the bone. Dipped in the signature soybean paste, the nourishing broth offers a comforting flavor that keeps you coming back\u2014a classic must-try when visiting Shilin Night Market.", "name": "Hai You Pork Ribs", "transport": "MRT Shilin Station Exit 2, about a 5-minute walk"}, {"address": "No. 38, Xiaodong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 Stars | A traditional dim sum stall awarded the Michelin Bib Gourmand. They insist on making and pan-frying the buns fresh on-site, producing a golden, crispy, and shiny bottom sprinkled with fragrant sesame seeds. The cabbage bun offers a sweet, crisp, and juicy filling, while the pork bun bursts with rich, savory broth\u2014take care not to burn yourself on the juicy first bite! The ultimate contrast between crispy bottom and soft top keeps lines forming constantly.", "name": "Chung Chia Sheng Jian Bao", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk"}, {"address": "No. 66, Danan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 3.9 Stars | One of the most iconic traditional old shops in Shilin Night Market. Generous with their fresh ingredients, every plump oyster is paired with custom tapioca batter and fresh eggs, fried until the edges are slightly charred and crispy while the center remains delightfully chewy. Drizzled with a sweet and savory special red sauce alongside plenty of greens, it delivers rich layers and a captivating aroma\u2014a landmark destination to experience Taiwanese night market omelet culture.", "name": "Zhong Cheng Hao Oyster Omelet", "transport": "MRT Jiantan Station Exit 1, about a 6-minute walk"}, {"address": "No. 1, Anping St., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 Stars | A legendary ice shop with over 50 years of history, known as the pioneer of Taiwanese snow ice. Their custom-crafted snow ice blocks produce silky, melt-in-your-mouth ribbons infused with rich milky aroma and distinctive flavors. The classic \u0027Snow Mountain Transformation\u0027 peanut snow ice topped with rich sesame paste offers layered aromatic notes; the fresh mango snow ice is a summer must-order, blending sweet-and-sour fruity aroma with delicate ice flakes, making it the top choice for a refreshing traditional dessert.", "name": "Xin Fa Ting Snow Ice", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk"}, {"address": "No. 75-1, Sec. 4, Chengde Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A wildly popular local favorite Taiwanese hot pot restaurant strongly recommended by Shilin residents. Its hallmark feature is the broth meticulously simmered with white sugarcane, delivering a naturally sweet, clean flavor without excessive artificial seasonings. Meat portions are extremely generous with balanced marbling, accompanied by fresh, diverse vegetable platters. The complimentary Taiwanese braised pork rice and all-you-can-eat ice cream dessert are fantastic highlights, showcasing warm Taiwanese hospitality and authentic flavors.", "name": "Fu Le Shabu Shabu", "transport": "MRT Jiantan Station Exit 3, about a 5-minute walk"}, {"address": "No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A state-banquet-level traditional dining destination right next to the National Palace Museum, masterfully transforming precious cultural relics into culinary art. The eye-catching \u0027Jadeite Cabbage\u0027 is intricately carved from Chinese cabbage, delivering a crisp, refined taste; the \u0027Meat-Shaped Stone\u0027 features Dongpo pork slow-cooked until melt-in-your-mouth tender without being greasy. Offering classic Cantonese cuisine, exquisite dim sum, and authentic Taiwanese dishes, it allows visitors to deeply savor the essence of traditional Chinese culinary culture after admiring national treasures.", "name": "Silks Palace at National Palace Museum", "transport": "Take the MRT to Shilin Station Exit 1, transfer to Bus Red 30 and get off at the National Palace Museum Stop"}, {"address": "No. 21-1, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 Stars | A famed late-night eatery that has been serving delectable food for decades, specializing in stir-fried mutton with custom dipping sauce. Fresh mutton slices without gamey flavor are stir-fried over high heat with abundant water spinach and a signature shacha (satay) sauce. The mutton is tender and juicy, the water spinach remains pleasantly crisp, and the savory, slightly spicy shacha sauce boosts your appetite. Paired with a bowl of hot steamed rice, it\u0027s an indispensable traditional late-night delicacy in the Shilin commercial district.", "name": "Shilin Stir-Fried Mutton", "transport": "MRT Shilin Station Exit 2, about a 6-minute walk"}], "name": "Famous Local Traditional Shops"}, "cat_2": {"items": [{"address": "No. 10, Lane 404, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | A Japanese minimalist cafe located right next to the MRT station exit. Their cinnamon rolls\u2014crispy on the outside, soft, rich, and dense on the inside\u2014pair perfectly with freshly brewed single-origin pour-over coffee. The subtle bitterness of the coffee combined with rich caramel and cinnamon aromas creates a moist, flavorful bite that draws both international tourists and hipsters alike.", "name": "Coffee and Couple", "transport": "About a 1-minute walk from Exit 1 of MRT Shilin Station"}, {"address": "No. 7, Lane 38, Sec. 7, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | A hipster brunch spot focused on natural, healthy food, featuring homemade yeast-free bread and organic egg dishes. The classic Pan-Fried Chicken Leg Brunch features golden-crispy skin and juicy, tender chicken, perfectly complemented by a refreshing, slightly tangy vinaigrette salad and fragrant homemade spread toast. Its rich layers of flavor make it a favorite among locals and health-conscious foodies.", "name": "Topo+ Cafe \u0026 Topo", "transport": "Take Bus 220 or 267 from MRT Shilin Station to Tianmu Square Stop, then walk for about 3 minutes"}, {"address": "No. 21, Lane 505, Sec. 5, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | A standalone American brunch haven surrounded by lush greenery. The classic Eggs Benedict Brunch features poached eggs that burst with rich yolk when sliced, paired with creamy hollandaise sauce and savory bacon for a silky, deeply satisfying flavor. Pet-friendly with generous portions, it\u0027s a top choice for tourists looking to relax and dine after exploring the Shilin Official Residence.", "name": "Second Floor Cafe Shilin Branch", "transport": "About a 3-minute walk from Exit 2 of MRT Shilin Station"}, {"address": "No. 29, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | A hugely popular Taiwanese brunch spot near Shilin Night Market. Their signature French Toast is dipped in egg batter and fried to a golden crisp, offering a soft, fluffy texture with subtle milky notes that taste even better drizzled with condensed milk or sauce. Their cheese egg pancake (Danbing) is pan-fried to a golden crisp, stuffed with luscious oozing cheese\u2014an affordable delicious treat adored by locals and tourists alike.", "name": "Man Jia Xiang Breakfast Cafe", "transport": "About a 5-minute walk from Exit 2 of MRT Shilin Station"}, {"address": "4F, Exhibition Area 1, National Palace Museum, No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | A classical tea house tucked away on the top floor of the National Palace Museum, seamlessly combining national treasure art with delicate Taiwanese tea snacks and brunch. Their signature Beef Noodle Soup and Handmade Beef Pie feature rich, sweet broth and tender, flavorful beef. Paired with freshly brewed High Mountain Oolong tea and delicate pastries, dining in this antique-style scenic area offers an ultimate feast for both taste buds and eyes.", "name": "San Xi Tang Tea House", "transport": "Take Bus Red 30 or 255 from Exit 1 of MRT Shilin Station and get off at National Palace Museum Stop"}, {"address": "No. 60, Fulin Rd., Shilin Dist., Taipei City (Inside Shilin Official Residence Main Park)", "feature": "\u2b50 4.0 stars | A historic cafe located inside the lush gardens of Shilin Official Residence, specializing in various pour-over coffees and freshly baked custom waffles. Hot, crispy-on-the-outside and soft-on-the-inside waffles paired with rich, fragrant latte coffee deliver a delightful blend of egg and milk flavors with every bite. Enjoying them while strolling through the garden scenery rich in history and natural phytoncides is exceptionally relaxing and soothing.", "name": "Shihlin Official Residence Cafe", "transport": "About a 7-minute walk from Exit 2 of MRT Shilin Station"}, {"address": "2F, No. 253, Zhongzheng Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | One of Taipei\u0027s iconic classic spots for waffles, light meals, and brunch. The must-order Strawberry Ice Cream Waffle boasts an ultra-crispy exterior and a dense, cake-like interior. Topped with sweet and sour fresh strawberries and rich strawberry ice cream, it delivers rich layers of flavor without being overly sweet\u2014a famous classic for tourists visiting the Shilin shopping district.", "name": "Coffee Alley Shilin Branch", "transport": "About a 2-minute walk from Exit 1 of MRT Shilin Station"}, {"address": "No. 182, Jihe Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | A creative, artisanal hipster brunch spot near Shilin Night Market. The signature Super Thick Cut Cheese Beef Burger features a juicy, thick beef patty paired with melted gooey cheese and house-made special sauce\u2014bursting with flavor in every bite. Lightly toasted bread that is crispy outside and soft inside, combined with crisp fresh lettuce, makes it a huge hit among students and foreign visitors.", "name": "Breakfast Lab", "transport": "About an 8-minute walk from Exit 1 of MRT Jiantan Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Located right next to the National Palace Museum, Silks Palace incorporates iconic national treasures into classic Cantonese and traditional Taiwanese cuisine. The must-order \u0027Jadeite Cabbage\u0027 uses finely carved bok choy hearts for a crisp, subtle sweetness; the \u0027Meat-Shaped Stone\u0027 Dongpo pork melts in your mouth, rich without being greasy, paired with savory braised sauce perfect with rice. The exterior resembles a glass crystal palace, glowing with elegant antique charm when lit up at night, making it the top choice for foreign tourists to experience Chinese culinary culture and local banquets.", "name": "Silks Palace", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station, transfer to Bus Red 30 or 255, and get off at National Palace Museum Station."}, {"address": "No. 54, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 stars | Tucked in an alley of Shilin Night Market, this bistro is renovated from a 100-year-old Qing Dynasty courtyard house. It preserves red brick walls and an open-air courtyard, creating an exotic atmosphere blending past and present. Specializing in local Thai dishes and creative cocktails, the must-try \u0027Moon Shrimp Cake\u0027 is thick and springy, golden-crisp on the outside and packed with fresh shrimp inside; the \u0027Tom Yum Seafood Soup\u0027 is aromatic, layered, delightfully zesty, and spicy. Enjoying fine drinks and food under the courtyard breeze at night makes it a favorite spot for young crowds and tourists.", "name": "FB Fashion Bangkok", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 5 minutes."}, {"address": "No. 101, Tianmu E. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | A Michelin-starred classic Taiwanese restaurant inheriting decades of Beitou banquet culinary heritage. The signature \u0027Deep-Fried Pork Ribs\u0027 uses premium ribs marinated in special spices and fried to ultimate golden crispness\u2014juicy, hot, tender, and intensely flavorful with every bite. The \u0027Buddha Jumps Over the Wall\u0027 features a rich, velvety broth stewed to perfection with ingredients like taro, chestnuts, and abalone. The warm, rustic dining environment radiates authentic Taiwanese hospitality, making it an extraordinary choice for gatherings featuring authentic local cuisine.", "name": "Golden Formosa Taiwanese Cuisine", "transport": "Take the MRT Tamsui-Xinyi Line to Zhishan Station, transfer to Bus 616 or 285 (Chongqing Main Line), and get off at Tianmu E. Rd. Station."}, {"address": "No. 8, Ln. 470, Sec. 5, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | Located next to the Shilin Official Residence with panoramic lush green views, ShiLin Kitchen offers modern bistro cuisine combining fresh local Taiwanese ingredients with Western cooking techniques. The chef selects local fresh beef and hand-picked wild vegetables, paired with freshly baked, aromatic French handmade bread, creating layered and refined flavors. The interior design is filled with artistic flair and soft lighting, allowing guests to relax and enjoy the verdant garden views outside while dining.", "name": "ShiLin Kitchen - Renaissance Taipei Shihlin Hotel", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 3 minutes."}, {"address": "No. 31, Xiaobei St., Shilin Dist., Taipei City", "feature": "\u2b50 4.8 stars | A highly popular budget-friendly yakitori bistro near Shilin Night Market, famous for its secret signature BBQ sauce. Meat skewers and fresh vegetables are brushed with a savory-sweet glaze and slow-grilled over charcoal, yielding rich smoky flavors and juicy bites. Highly recommended are the \u0027Angel Red Shrimp\u0027 and \u0027Pig Blood Cake\u0027, featuring crisp exteriors and soft interiors for an authentic local bite. With a lively and welcoming vibe, paired with cold draft beer and Japanese sake, it\u0027s a great late-night spot to drink, chat, and experience local nightlife with friends.", "name": "Qi Xi Di Yakitori Bistro Shilin", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 4 minutes."}, {"address": "No. 35, Daxi Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Hidden in an alley near Shilin Night Market, this Japanese kushikatsu (fried skewer) bistro overflows with retro Showa-era izakaya charm. Featuring made-to-order kushikatsu, light and non-greasy batter coats tender pork, beef, juicy lotus root, and shiitake mushrooms. Paired with a sweet-and-sour dipping sauce, each bite is delightfully crisp and tender. Enjoying these with a chilled Highball or craft beer offers immense satisfaction, making it a hit among local youth and bistro enthusiasts.", "name": "Katsuriki Bistro", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 5 minutes."}, {"address": "No. 149, Fuhua Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Located near Zhishan MRT Station and Shilin Shopping District, this Korean specialty bistro is run by an authentic Korean chef-owner. The signature \u0027Seafood Pancake\u0027 features an extra golden-crisp crust stuffed with generous squid and shrimp, offering rich savory flavor with every bite. The \u0027Samgyetang\u0027 (Ginseng Chicken Soup) is simmered until tender meat falls off the bone, delivering a rich, nourishing broth. Serving Korean Soju and Makgeolli, it draws foodies seeking authentic Korean flavors and a relaxed, tipsy vibe.", "name": "Korean Village Bistro", "transport": "Take the MRT Tamsui-Xinyi Line to Zhishan Station (Exit 2) and walk for about 1 minute."}, {"address": "No. 55, Sec. 7, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | A famous classic Taiwanese restaurant passing down traditional flavors for decades, highly praised by celebrities and food connoisseurs. The must-try \u0027Signature Deep-Fried Pork Ribs\u0027 are crispy on the outside and juicy on the inside; the \u0027Free-Range Boiled Chicken\u0027 features thin skin, springy meat, and abundant juices, tasting even better dipped in custom chili soy sauce. The traditional banquet atmosphere takes diners back in time to experience the heartiness and enthusiasm of classic Taiwanese banquets, making it a fantastic destination to explore traditional local cuisine.", "name": "Shin Hou Lai Taiwanese Restaurant", "transport": "Take the MRT Tamsui-Xinyi Line to Shipai Station, transfer to Bus Red 19 or 224, get off at Tianmu Square Station, and walk for about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 29, Datong St., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | A stylish, hipster-favorite spot specializing in vegan and vegetarian steamed buns and mantou, boasting elastic dough and generous fillings. Biting into a piping-hot bun\u2014like the spicy tofu or fresh bamboo shoot bun filled with savory broth\u2014delivers a burst of juicy flavor. The dough carries a natural wheat sweetness with excellent elasticity, offering a refreshing, non-greasy taste beloved by young vegetarians and international tourists alike.", "name": "Cao Shan Baozi Shilin Branch", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 1), and walk for about 3 minutes."}, {"address": "No. 84, Danan Rd., Shilin Dist., Taipei City (In front of Shilin Cixing Temple)", "feature": "\u2b50 4.1 stars | A historic stand in front of Cixing Temple once recommended by the Michelin Bib Gourmand, specially serving 100% vegetarian noodle soup made with a fruit, vegetable, and Angelica (Danggui) herbal broth. The delicate red vermicelli absorbs the sweet and rich herbal soup, paired with shiitake and enoki mushrooms for a delightful crunchy texture. Grab a bowl to enjoy as you stroll\u2014it\u0027s packed with authentic local flavor.", "name": "Ah-Hui Veggie Vermicelli", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 8 minutes."}, {"address": "No. 101, Jihe Rd., Shilin Dist., Taipei City (Around Shilin Night Market Food Court)", "feature": "\u2b50 4.3 stars | A creative stall that perfectly converts classic Japanese street food into a vegetarian delight. Pan-fried to golden perfection, the crispy outer shell gives way to a soft interior, replacing octopus with chewy konjac and king oyster mushrooms. Drizzled with custom teriyaki sauce, vegan mayonnaise, and shredded seaweed, its rich layers of texture make it irresistible.", "name": "Ci Yuan Vegetarian Takoyaki", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 5 minutes."}, {"address": "No. 167, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | A popular night market street food spot with long queues. These freshly wrapped and fried vegetarian buns feature an irresistibly crispy, golden-brown bottom. Filled generously with crunchy cabbage, glass noodles, and minced shiitake mushrooms, they offer a sweet, juicy taste. Sprinkled with white sesame seeds and paired with custom chili sauce, they are both delicious and super satisfying.", "name": "Yi Pin Vegetarian Pan-Fried Buns", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 4 minutes."}, {"address": "No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City (Inside National Palace Museum Grounds)", "feature": "\u2b50 4.4 stars | A top-tier, state-banquet-style vegetarian dining experience located inside the National Palace Museum complex. It reimagines national treasures into gourmet vegetarian dishes, such as plant-based interpretations of the Jadeite Cabbage and Meat-Shaped Stone. Featuring fresh, juicy ingredients, a sweet and rich broth, and exquisite presentation, it is the top choice for an elegant and luxurious vegetarian feast after visiting the museum.", "name": "Silks Palace Vegetarian Cuisine", "transport": "Take the MRT to Shilin Station, transfer to Bus Red 30, 255, or 304, and get off at \u0027National Palace Museum\u0027 stop."}, {"address": "No. 15-3, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 stars | A beloved local long-standing vegetarian buffet and noodle shop in Shilin, renowned for its affordable prices and wide variety of dishes. Its signature vegetarian braised noodle soup features a rich, sweet broth accompanied by carrots, daikon radish, and tender king oyster mushroom chunks. The noodles absorb the savory broth for a smooth, refreshing bite, making it a daily favorite for locals and vegetarian foodies.", "name": "Zhongcheng Vegetarian Food", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2), and walk for about 5 minutes."}, {"address": "No. 16-8, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | A budget-friendly vegetarian gem tucked away in the alleyways of Shilin Night Market, featuring made-to-order vegetarian thick noodle soup, Angelica broth, and various vegetarian braised dishes (lu wei). The thick soup is smooth and rich, filled with shredded bamboo shoots and shiitake mushrooms for a fresh, sweet taste. Paired with aromatic special vegetarian minced meat rice, it offers an authentic vintage Taiwanese flavor.", "name": "Hui Wei Vegetarian Snack", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2), and walk for about 6 minutes."}, {"address": "Intersection of Alley 101, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.6 stars | A must-try vegan hand-crafted walking snack at the night market. Carefully selected Tainong sweet potatoes are pressed by hand and repeatedly deep-fried until each sweet potato ball inflates into a large, round sphere. Crispy on the outside and hollow inside with a soft, springy chew, they release a rich sweet potato aroma with every bite, making them addictive to snack on.", "name": "Taiwan Sweet Potato Balls - Shilin", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 113, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | Larger than your face, this iconic fried chicken cutlet is the ultimate Shilin Night Market street food! Coated in a thin, golden-crisp batter that\u0027s delightfully crispy without being greasy, every crunch reveals tender, juicy chicken inside seasoned with signature pepper salt. Both tourists and locals love it for its massive size and satisfying crunch\u2014a top choice for eating on the go.", "name": "Hot-Star Large Fried Chicken (Shilin)", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 3 minutes."}, {"address": "No. 84, Danan Rd., Shilin Dist., Taipei City (In front of Cixian Temple)", "feature": "\u2b50 4.2 stars | A Michelin Bib Gourmand-recommended classic located right in front of Cixian Temple! The savory broth is simmered with abundant bonito flakes, offering a naturally sweet seafood flavor. The braised intestines are thoroughly seasoned and delightfully chewy, while the squid balls are springy and fresh. Silky noodles combined with a spoonful of garlic paste and chili oil elevate the dish to a whole new level, captivating foodies and international travelers alike.", "name": "Ah Hui Vermicelli", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 6 minutes."}, {"address": "No. 49, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | A renowned herbal pork ribs eatery with consecutive Michelin Bib Gourmand recognitions! Slow-cooked with over 15 Chinese medicinal herbs, the deep-colored broth is smooth, sweet, and remarkably free of bitter medicinal taste. The tender ribs fall off the bone effortlessly, infused with the rich broth. Having a piping-hot bowl in winter warms you up entirely\u2014a cherished traditional health soup.", "name": "Hai You Pork Ribs", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 15-32, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.0 stars | A long-standing oyster omelet stall in Shilin Night Market featuring plump, fresh oysters sourced from Budai, Chiayi. The pan-fried batter achieves crispy, golden edges while retaining a delightfully chewy center. Paired with fresh bok choy and a savory-sweet house sauce, every bite delivers a perfect harmony of ocean flavors and rich sauce.", "name": "Zhong Cheng Hao Oyster Omelet", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 1, Jihe Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | A legendary chicken cutlet famous for its deep-fry then charcoal-grill technique! First fried to a golden crisp to seal in the juices, it is then brushed with a signature savory-sweet barbecue sauce and grilled over charcoal until caramelized. Each bite offers smoky aromas, savory sauce flavors, and tender, juicy chicken\u2014drawing long queues every evening.", "name": "Jia Xiang Charcoal Grilled Chicken Chop", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 2 minutes."}, {"address": "No. 38, Xiaodong St., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Michelin Bib Gourmand-recommended pan-fried buns at their finest! Available in juicy pork or sweet cabbage fillings, these buns feature a crispy golden bottom crust and a fluffy, chewy top. The pork buns burst with rich savory broth, while the cabbage version offers a crisp, sweet bite infused with sesame oil. Thin skin and generous fillings make this a must-try grab-and-go snack.", "name": "Chong\u0027s Shanghai Pan-fried Stuffed Bun", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 5 minutes."}, {"address": "No. 181, Jihe Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Traditional flatbreads baked against the inner walls of a charcoal-fired drum kiln! The signature pepper bun boasts a crispy, fragrant sesame-crusted pastry shell wrapped around a savory, juicy pork filling loaded with fresh scallions. One bite unleashes a burst of peppery aroma and flavorful juice\u2014crispy outside, soft inside, and rich with smoky charcoal flavor.", "name": "Lao Zhang Pepper Bun", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 7 minutes."}, {"address": "No. 56, 58, Anping St., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | The legendary pioneer of snow ice in Shilin Night Market! Flavored ice blocks are shaved into delicate, ribbon-like layers that melt instantly on your tongue with a silky-soft texture. The signature peanut snow ice and fresh mango snow ice are rich and fragrant without being overly sweet\u2014the ultimate refreshing dessert after savoring savory night market treats.", "name": "Shin Fan Ting Snow Ice", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Shilin Night Market and the National Palace Museum"}, "ximending": {"categories": {"cat_1": {"items": [{"address": "No. 8-1, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 Stars | An iconic traditional delicacy you simply cannot miss when visiting Ximending. Despite having no seats, it is always packed with crowds standing and enjoying their bowls. The red rice noodles are silky smooth, paired with a rich, savory broth simmered for hours with bonito flakes and tender pork intestines. The braised intestines are meticulously cleaned, delightfully chewy, and packed with flavor. Fresh basil is added right before serving for fragrance, along with optional special garlic paste, chili sauce, and black vinegar to taste. The delicious blend of tangy and spicy flavors keeps customers coming back, making it the top choice for foreign tourists to experience Taiwan\u0027s standing street-food culture.", "name": "Ay-Chung Flour-Rice Noodle", "transport": "MRT Ximen Station Exit 6, about a 2-minute walk."}, {"address": "No. 1, Lane 32, Hanzhong St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A popular time-honored eatery located in the heart of the Ximending shopping district, famous for its affordable yet extremely delicious traditional Taiwanese home-style flavors. Its signature braised pork rice (Lu Rou Fan) is drizzled with a perfectly balanced sweet and savory pork gravy. The minced pork has a balanced lean-to-fat ratio and a rich aroma. The ultimate way to eat it is by adding a soft-boiled fried egg\u2014gently break the egg yolk to let the rich liquid coat the rice and meat sauce for a silky, rich, and deeply textured bite. Furthermore, the oyster omelet features a thin, crispy crust and a unique sauce, highly praised by both locals and tourists from Japan and Korea.", "name": "Tiantianli Restaurant", "transport": "MRT Ximen Station Exit 6, about a 3-minute walk."}, {"address": "B1, No. 70, Xining S. Rd., Wanhua Dist., Taipei City (Wannian Commercial Building)", "feature": "\u2b50 4.1 Stars | A decades-old noodle shop awarded the Michelin Bib Gourmand, hidden in the basement of the Wannian Commercial Building. The shop insists on making its home-style wide noodles fresh by hand every day; they are firm, springy, and delightfully chewy, perfectly absorbing the rich beef broth. The beef shank and tendinous cuts are braised until incredibly tender, melting in your mouth, while the soup carries subtle herbal notes and the sweet aroma of simmered beef bones. Paired with complimentary, unlimited house-made pickled mustard greens and beef tallow, a full bowl delivers the most authentic and hearty Northern Chinese noodle flavor.", "name": "Lao Shandong Homemade Noodles", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk to B1 of Wannian Commercial Building."}, {"address": "No. 104, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.0 Stars | A century-old establishment near the Bopiliao Historical Block, passing down beloved traditional Taiwanese breakfast flavors through generations. The signature meat porridge uses a rich pork-bone broth simmered with raw rice grains and fried shallots. The rice retains a nice texture rather than turning mushy, producing a sweet, comforting soup with nostalgic aromas. The true hero of the shop is the freshly fried crispy pork (Hong Shao Rou)\u2014golden and crispy on the outside, juicy and tender with balanced lean and fat on the inside. Dipped in special sweet chili sauce, it is crispy, tender, savory, and aromatic\u2014the most unforgettable classic morning taste for long-time Wanhua locals.", "name": "Zhouji Meat Porridge", "transport": "MRT Longshan Temple Station Exit 3, about a 3-minute walk."}, {"address": "No. 17-4, Huaxi St., Wanhua Dist., Taipei City (Stall 153, Huaxi Street Tourist Night Market)", "feature": "\u2b50 4.2 Stars | A Taiwanese snack legend recommended by Michelin Bib Gourmand, located inside the Huaxi Street Tourist Night Market. Their famous \u0027black gold\u0027 braised pork rice gains a deep, glossy dark shine from hours of slow simmering; it is rich in collagen yet not greasy at all. When mixed into white rice, every single grain is coated in savory-sweet broth. Paired with the signature Mushroom and Pickled Cucumber Pork Soup\u2014simmered with premium pickled cucumbers and tender minced pork rolls\u2014the soup is sweet, refreshing, and deeply satisfying, providing a perfect counterpoint to the rich braised pork rice.", "name": "Xiao Wang Pork Belly Soup \u0026 Broth", "transport": "MRT Longshan Temple Station Exit 1, about a 6-minute walk into Huaxi Street Night Market."}, {"address": "No. 245, Sec. 1, Xiyuan Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 Stars | Founded in 1921, this century-old traditional thick soup shop in Bangka remains wildly popular through four generations. The signature squid soup uses fresh dried squid rehydrated through a special process, creating an exceptionally crisp, snappy texture infused with natural seafood sweetness. It is served in a warm, rich broth with subtle hints of bonito and garlic, thickened to perfection. The fish paste soup and stir-fried rice noodles are also must-order items; the rice noodles are drizzled with special garlic pork gravy, light yet fragrant, demonstrating authentic traditional Taiwanese thick-soup culture.", "name": "Liang Xi Hao Squid Soup", "transport": "MRT Longshan Temple Station Exit 1, about a 2-minute walk."}, {"address": "B1, No. 70, Xining S. Rd., Wanhua Dist., Taipei City (Wannian Commercial Building)", "feature": "\u2b50 4.0 Stars | A Ximending pork chop rice legend with a fragrance spanning over half a century, hidden in the B1 food court of Wannian Commercial Building. Made-to-order fried pork chops are thick and substantial, marinated before frying to lock in juices. Lightly battered and fried to golden perfection, then dusted with black pepper, every bite is tender, juicy, and infused with black pepper spice and house marinade aromatics. Served with white rice drizzled with traditional minced pork gravy and tangy sweet-and-sour cucumber slices, it is a nostalgic classic that many Taipei locals have loved since childhood.", "name": "Jinyuan Pork Chop Wannian Branch", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk to B1 of Wannian Commercial Building."}, {"address": "No. 1, Lane 46, Wuzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 Stars | A classic pork rib soup establishment near Longshan Temple that wins over foodies with pure, unadulterated flavors. The signature original pork rib soup uses only large, premium pork ribs and sweet white radish, slow-simmered over low heat for hours. The broth is crystal-clear, refreshing, naturally sweet, and free of gameiness. The massive pork ribs are tender enough to pull off the bone easily without falling apart. Dipped in the house special chili soy sauce, the flavors elevate even further. Paired with a bowl of traditional cabbage rice, it offers a light, comforting, and wonderfully nostalgic meal.", "name": "Monga Original Pork Rib Soup", "transport": "MRT Longshan Temple Station Exit 1, about a 5-minute walk."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "No. 42, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | A half-century-old classic cafe established in 1956, deeply loved by local old-school Taipei residents as well as Japanese and Korean tourists. It preserves traditional siphon coffee brewing methods, offering a rich, bittersweet flavor with a unique smoky aroma. Large glass jars at the entrance are filled with walnut pastries, abalone pastries, and chicken biscuits\u2014crispy, sweet, and delicious, making them the absolute perfect match for a sip of black coffee.", "name": "Fong Da Coffee", "transport": "MRT Ximen Station Exit 6, about a 3-minute walk"}, {"address": "No. 214-1, Kunming St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | A wildly popular American brunch spot in Ximending offering fantastic value, constantly bustling with students and tourists on both weekdays and weekends. The \u0027Sicilian Chicken Thigh Breakfast Platter\u0027 comes highly recommended\u2014crispy skin, tender, juicy meat, paired with generous scrambled eggs, hash browns, and French toast for a hearty, satisfying meal. Their house milk tea is smooth and flavorful, making its budget-friendly prices irresistible for repeat visits.", "name": "What Day Kitchen", "transport": "MRT Ximen Station Exit 1, about an 8-minute walk"}, {"address": "2F, No. 65, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Tucked away on the second floor of an old building in Ximending, this illustration art cafe features lush indoor greenery and hand-drawn artwork, creating a cozy and relaxing atmosphere. The signature baked egg brunch is rich, fluffy, and full of savory egg flavor, paired wonderfully with freshly baked crispy waffles and hand-poured specialty coffee\u2014a perfect spot for a slow-paced hipster afternoon and aesthetic photos.", "name": "Somebody Cafe", "transport": "MRT Ximen Station Exit 6, about a 4-minute walk"}, {"address": "No. 79, Yongfu St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Tucked in the alleyways of Wanhua, this famed coffee shop took the local coffee scene by storm with its legendary \u0027Hojicha Pudding.\u0027 The limited-edition hojicha pudding has an insanely velvety texture, unleashing rich roasted tea aroma and slightly bitter caramel on your tongue. Paired with house-roasted single-origin pour-over coffee, the fruity acidity balances the pudding\u0027s sweetness perfectly, drawing dessert lovers from near and far.", "name": "Maruha Coffee", "transport": "MRT Longshan Temple Station Exit 3, about an 8-minute walk"}, {"address": "3F, No. 10, Ln. 27, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | A popular brunch spot blending minimalist Nordic style with industrial elements, highly favored by young women and influencers. The signature French Toast features a slightly caramelized, crispy exterior and a silky, mousse-like tender center; the subtle sweetness of maple syrup combined with rich cheese is surprisingly delicious. Paired with a smooth oat milk latte, it offers a delightful feast for both the eyes and taste buds.", "name": "ACME Cafe Bar Restaurant Ximen", "transport": "MRT Ximen Station Exit 6, about a 3-minute walk"}, {"address": "No. 42, Dali St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.8 stars | A small, cozy independent cafe near Wanhua\u0027s Dali Street garment district, run by an owner deeply passionate about local Wanhua culture. It serves high-quality single-origin coffees with clean, refreshing, and multi-layered flavors. Pair your coffee with house-made scones that are crispy outside and soft inside, or a silky Basque cheesecake, reflecting the unique warm hospitality and cultural charm of Wanhua.", "name": "DD Coffee", "transport": "MRT Longshan Temple Station Exit 2, about a 3-minute walk"}, {"address": "No. 44, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | A pioneering local roastery standing alongside Fong Da Coffee as one of Taiwan\u0027s early coffee legends, filled with Showa-era nostalgia. The signature \u0027Mamba Coffee\u0027 (Mandheling \u0026 Santos blend) delivers a balanced bittersweet taste that is full-bodied, smooth, and nutty. Paired with freshly toasted thick bread slathered in rich butter\u2014crispy outside and soft inside\u2014it delivers an authentic vintage coffee morning experience.", "name": "Nammei Coffee", "transport": "MRT Ximen Station Exit 6, about a 3-minute walk"}, {"address": "2F, No. 155, Xining S. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.6 stars | A retro Japanese Showa-style kissaten hidden inside an old building in Ximending, where neon lighting and vintage furniture create a romantic vibe. The signature \u0027Cream Soda\u0027 boasts a dreamy color, combining sparkling tangy sweetness with rich vanilla ice cream for an authentically refreshing taste. Paired with a smooth, firm retro pudding, it serves as a mysterious nighttime sanctuary for unwinding in Ximending.", "name": "Kissa Galaxy", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "4F., No. 92-2, Kunming St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.7 stars | Hidden inside an old building in Ximending, this exquisite omakase cocktail bistro incorporates local Taiwanese fruits, high-mountain teas, and regional specialties into its drinks and cuisine. The cocktails are rich with storytelling and visual surprises, paired perfectly with pan-seared Matsusaka pork (crispy outside, tender inside) and savory house-made Taiwanese fried chicken. Highly layered and uniquely local, it is a favorite among foodies and night owls alike.", "name": "Geography Bar", "transport": "About a 6-minute walk from MRT Ximen Station Exit 6"}, {"address": "No. 60, Sec. 2, Hankou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | A retro speakeasy bistro disguised as an old Ximending cinema ticket booth. Knock on the vintage iron door to enter a dazzling, psychedelic retro space. The bar creatively fuses traditional winter melon tea, red beans, and Taiwanese Kaoliang liquor into cocktails, served alongside signature spicy Mapo Tofu fries and a Taiwanese braised platter. With its creative blend of salty and spicy flavors, it is a must-visit landmark for international tourists experiencing Ximending nightlife.", "name": "HANKO 60", "transport": "About an 8-minute walk from MRT Ximen Station Exit 6"}, {"address": "1F., No. 46, Ln. 96, Kunming St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Created by Taihu Brewing, this Hawaiian beach-style craft beer bistro uses abundant driftwood and thatch decor to create a relaxed, laid-back vacation vibe. Offering dozens of craft beers on tap and fusion Taiwanese-American fried bites, their must-order Fish \u0026 Chips features an ultra-crispy batter and juicy fish, served with special tartar sauce for a refreshing tang. Perfect for a fun evening hangout with friends.", "name": "Driftwood Ximen", "transport": "About a 7-minute walk from MRT Ximen Station Exit 6"}, {"address": "No. 79, Kangding Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | A Michelin Bib Gourmand-recommended local eatery in Bangka with decades of history. The signature braised pork belly rice features carefully selected, beautifully layered pork belly slow-cooked for hours in a master brine. It melts in your mouth, bursting with rich aroma and collagen, accompanied by crisp cucumber slices and dried tofu. Their Gua Bao (steamed pork belly bun) is equally incredible, featuring a pillowy soft bun filled with rich peanut powder and cilantro\u2014a must-try classic reflecting Wanhua\u0027s historic culinary charm.", "name": "Yi Jia Zi Pork Belly Rice", "transport": "About an 8-minute walk from MRT Longshan Temple Station Exit 3"}, {"address": "No. 68-4, Dongyuan St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.6 stars | Located in Kaa-naa-a (South Wanhua), this cozy and stylish Taiwanese izakaya seamlessly blends traditional artisanal dishes with refined drinks. Signature offerings include Oden and vintage-style fried squid, crisp on the outside and springy inside with a savory flavor punch. Paired with selected craft pairings and custom cocktails, diners can savor the authentic local warmth and deep culinary heritage of Wanhua in a nostalgic, welcoming atmosphere.", "name": "Ka-Na-Tshu Taiwanese Bistro", "transport": "Take Bus 265 from MRT Longshan Temple Station to \u0027Dongyuan St.\u0027 stop, then walk about 2 minutes"}, {"address": "No. 245, Sec. 1, Xiyuan Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | A century-old classic squid thick soup shop in Bangka. Featuring a dual delight of rehydrated dried squid and fresh fish paste, the rich broth is infused with garlic and black vinegar aromas. The squid offers a delightfully snappy bite, while the fish paste is dense and tender. Pair it with their special mushroom pork soup and freshly fried burdock tempura (crispy outside, soft inside) to experience the authentic charm of traditional Wanhua cuisine.", "name": "Liang Xi Hao", "transport": "About a 3-minute walk from MRT Longshan Temple Station Exit 1"}, {"address": "No. 25, Ln. 25, Kangding Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Tucked away on Kangding Road in Wanhua, this top-tier Binchotan charcoal Japanese yakitori bistro showcases exquisite craftsmanship in every chicken cut. Signature chicken skewers and shiso plum chicken breast are grilled to perfection, boasting an inviting charcoal aroma and juicy tenderness in every bite. Complemented by chilled sake and Japanese side dishes, it draws food lovers from all over to savor its supreme artistry.", "name": "Ryujiro Yakitori", "transport": "About an 8-minute walk from MRT Ximen Station Exit 1"}, {"address": "No. 5, Ln. 120, Sec. 2, Wuchang St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.7 stars | Hidden in the alleys of Ximending, this stylish bistro combines minimalist industrial design with cozy, relaxing lighting. The menu features creative Taiwanese-French fusion dishes, such as Taiwanese pickled chili chicken pasta, where the noodles soak up a rich, spicy broth paired with tender, flavorful chicken. Matched with unique tea-infused cocktails that go down smooth and warm, it\u0027s a prime destination for late-night dates and fine dining in Ximending.", "name": "Wubian Bistro", "transport": "About a 9-minute walk from MRT Ximen Station Exit 6"}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 209, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Located near Guangzhou Street Night Market, this classic vegetarian eatery transforms a traditional Taiwanese night market staple into a stunning vegan version. Using mushrooms and seaweed, the kitchen perfectly simulates the briny, smooth texture of fresh oysters. Fried to a golden crisp on the outside with a delightfully chewy inside, and topped with a special sweet-and-sour red sauce, it offers rich layers of flavor without feeling greasy. Long-term vegetarians and curious tourists alike are captivated by this innovative yet authentic night market treat.", "name": "Wanhua Vegetarian Oyster Omelet", "transport": "MRT Longshan Temple Station Exit 1, about a 5-minute walk"}, {"address": "No. 10, Lane 109, Sec. 3, Heping W. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | Tucked away in an alley near Longshan Temple MRT Station, this popular vegetarian restaurant is famous for its affordable, authentic Taiwanese vegetarian classics. The signature vegetarian minced pork rice features fragrant shiitake mushroom sauce poured over distinct grains of rice, delivering a rich, savory-sweet flavor profile. The vegetarian Angelica (Dang Gui) soup is slow-simmered with traditional Chinese herbs, yielding a naturally sweet, stomach-warming, and healthy broth. Generous portions and wholesome ingredients make it a favorite among locals and nostalgic foodies.", "name": "Ji Yuan Vegetarian", "transport": "MRT Longshan Temple Station Exit 3, about a 2-minute walk"}, {"address": "No. 8, Lane 147, Hanzhong St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | Situated in the vibrant Ximending shopping district, this spot is a top choice for those craving refined individual vegetarian hot pots and sizzling teppan dishes. The signature sizzling teppan noodles and plant-based cutlet arrive at your table crackling hot, smothered in aromatic black pepper sauce. The cutlet is wonderfully hearty and chewy, capturing the fun, nostalgic spirit of traditional teppan meals. Hot pot broths are simmered from fresh vegetables for a light, comforting sweetness. Young locals and international vegetarian travelers highly praise its diverse menu and steaming, satisfying meals.", "name": "Quan Zhen Vegetarian Hot Pot", "transport": "MRT Ximen Station Exit 1, about a 3-minute walk"}, {"address": "No. 1, Lane 152, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | A long-established vegetarian eatery right next to the Bangka Longshan Temple area, attracting steady crowds with its extensive self-serve buffet and freshly cooked noodles. The savory vegetarian thick soup is smooth and satisfying, packed with mushrooms and bamboo shoots. Other must-try signatures include freshly fried plant-based pork chops and braised vegetarian beef noodle soup, featuring chewy noodles and a rich broth infused with subtle herbal notes. High value for money and warm, old-school hospitality make this a go-to spot for temple visitors and sightseers alike.", "name": "Zhong Yi Vegetarian", "transport": "MRT Longshan Temple Station Exit 1, about a 4-minute walk"}, {"address": "No. 175, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.0 stars | Located on Guangzhou Street in Wanhua, this traditional vegetarian eatery focuses on refreshing, guilt-free plant-based meals. The signature sesame paste noodles feature rich, fragrant sesame sauce tossed with chewy noodles for a smooth, non-sticky texture. Paired with a bowl of vegetable and tofu soup, the naturally sweet broth balances the rich sesame flavor perfectly. Emphasizing healthy, low-oil, and low-sodium cooking with fresh, natural ingredients, it is a favorite among health-conscious diners and seniors.", "name": "Mei Yuan Vegetarian", "transport": "MRT Longshan Temple Station Exit 1, about a 4-minute walk"}, {"address": "No. 274, Kangding Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | A budget-friendly vegetarian buffet that has served Wanhua for years, offering dozens of fresh, daily stir-fried seasonal vegetables and plant-based dishes. Their deep-fried vegetarian rolls feature a crispy golden exterior wrapped around flavorful veggies and soy ingredients, delivering a delightful crunch. The braised tofu and mushrooms with winter melon are savory, tender, and pair perfectly with rice. Its customizable choices and balanced nutrition make it a daily dining staple for local workers and residents.", "name": "Chong De Vegetarian", "transport": "MRT Longshan Temple Station Exit 2, about a 5-minute walk"}, {"address": "No. 160, Guilin Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | A cozy vegetarian diner on Guilin Road that warms diners\u0027 hearts with comforting, homemade-style meals. Highly recommended are the vegetarian dry minced noodles and the herbal plant-based rib soup. The dry noodles, tossed in a special savory-sweet sauce, are wonderfully chewy, while the comforting herbal soup features tender plant-based ribs that absorb every drop of the sweet, soothing broth. Using high-quality, natural ingredients, every bite delivers genuine flavors and homely warmth.", "name": "Ci En Vegetarian", "transport": "MRT Longshan Temple Station Exit 1, about a 7-minute walk"}, {"address": "No. 2, Lane 34, Sec. 2, Hankou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | Tucked into a bustling alley in Ximending, this unnamed traditional noodle stall is a hidden gem highly praised by young locals and budget diners. The signature spicy vegetarian dry noodles pack a fiery punch with rich Sichuan peppercorn aroma, served with springy noodles, crisp bean sprouts, and savory plant-based minced meat. Pair it with a light seaweed tofu soup to perfectly balance spicy and sweet notes. Friendly service and unbeatable prices make it a must-try budget vegetarian spot when shopping in Ximending.", "name": "Hankou Street Vegetarian Noodles", "transport": "MRT Ximen Station Exit 6, about a 6-minute walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 8-1, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | The most iconic stand-and-eat street food in Ximending! The bonito fish broth is rich and sweet, paired with smooth, chewy pork intestine and delicate rice noodles, cooked to a perfect, non-sticky consistency. Garlic paste, chili sauce, and black vinegar are available for customization. Enjoying a hot bowl standing on the street while taking in Ximending\u0027s bustling atmosphere is a classic must-try experience cherished by both tourists and locals alike.", "name": "Ay-Chung Flour-Rice Noodle", "transport": "About a 2-minute walk from Exit 6 of MRT Ximen Station"}, {"address": "No. 218, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | A traditional grab-and-go dessert in Guangzhou Street Night Market with decades of history! Handcrafted from natural fig seeds using traditional methods, the Aiyu jelly is silky smooth and naturally springy. Served with perfectly balanced syrup and crushed ice, it offers a cool, sweet, and refreshing treat. Its most unique feature is the nostalgic bag-and-straw takeaway style, taking you right back in time to classic Bangka.", "name": "Huainian Aiyu Ice", "transport": "About a 5-minute walk from Exit 1 of MRT Longshan Temple Station"}, {"address": "No. 1, Lane 32, Hanzhong St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | A famous street food spot tucked in Ximending\u0027s alleyways, always drawing long queues! The star dish is the braised pork rice topped with a soft-boiled egg. Breaking the creamy yolk lets it coat the savory-sweet minced pork and fragrant rice grains for a rich, velvety bite. Their crispy-on-the-outside, soft-on-the-inside oyster omelet with sweet \u0026 spicy sauce is another market staple loved by travelers worldwide.", "name": "Tiantianli Restaurant", "transport": "About a 4-minute walk from Exit 6 of MRT Ximen Station"}, {"address": "Guangzhou St., Wanhua Dist., Taipei City (Monga Night Market Stall)", "feature": "\u2b50 4.3 stars | A hugely popular pocket-friendly street snack in Guangzhou Street Night Market! Fresh swordfish paste is wrapped around a quarter slice of hard-boiled egg and deep-fried on the spot. Piping hot with a golden crispy exterior and a springy, juicy interior, it bursts with savory fish and egg flavors. At just a fraction of a dollar per skewer, brushed with sweet chili or mustard sauce, it\u0027s the ultimate night market stroll snack.", "name": "Monga Night Market Swordfish Oden", "transport": "About a 4-minute walk from Exit 1 of MRT Longshan Temple Station"}, {"address": "No. 56, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 3.9 stars | A legendary street braised food shop in Ximending, famous across Taiwan and Hong Kong for decades! Braised with dozens of Chinese herbs and master stock until thoroughly seasoned, duck tongues, duck wings, and gizzards are the must-order items. Chewy, firm, and infused with explosive savory aroma and a gentle kick of spice, it\u0027s the perfect snack while shopping or watching a movie, and a top Taipei souvenir favored by celebrities and tourists.", "name": "Shanghai Lao Tian Lu Braised Food", "transport": "About a 3-minute walk from Exit 1 of MRT Ximen Station"}, {"address": "No. 166, Sec. 3, Heping W. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Widely acclaimed as one of the best oyster noodle stalls in the Longshan Temple area! The broth is savory and light, loaded with plump, juicy oysters from Dongshi, Chiayi, lightly coated for a silky bite, along with deeply braised, chewy pork braised intestines. A generous bowl packed with ingredients, offering rich layers of flavor in every bite\u2014a market classic that foodies visiting Wanhua cannot miss.", "name": "Chen\u0027s Specialty Oyster Noodle", "transport": "About a 2-minute walk from Exit 2 of MRT Longshan Temple Station"}, {"address": "No. 38, Sec. 2, Hankou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.0 stars | A traditional shaved ice shop on Hankou Street with over 60 years of history! Sweet corn kernels (traditionally a savory ingredient) are slow-cooked until gooey and tender, topped over fine shaved ice along with silky, melt-in-your-mouth braised peanuts. The unexpected sweet-and-savory combination creates amazing depth. This unique, nostalgic Taiwanese creation has drawn foodies from near and far for decades.", "name": "Yang\u0027s Peanut \u0026 Corn Ice", "transport": "About a 7-minute walk from Exit 6 of MRT Ximen Station"}, {"address": "No. 200, Sec. 1, Xiyuan Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | A century-old local iconic eatery in Bangka, Wanhua! The signature squid thick soup uses reconstituted dried squid for an exceptionally crunchy and firm texture, set in a deliciously sweet broth with a touch of garlic and light starch. Offering clean, classic flavors alongside freshly fried burdock tempura and stir-fried rice vermicelli, it embodies authentic Bangka market food culture highly praised by locals and tourists alike.", "name": "Liang Xi Hao Squid Soup", "transport": "About a 2-minute walk from Exit 1 of MRT Longshan Temple Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Ximending and Wanhua Monga"}, "xinyi": {"categories": {"cat_1": {"items": [{"address": "B1, No. 45, Shifu Rd., Xinyi Dist., Taipei City (Taipei 101 Shopping Center)", "feature": "\u2b50 4.5 Stars | Internationally acclaimed representative of traditional Taiwanese xiao long bao (soup dumplings). Renowned for paper-thin skin and exquisite craftsmanship featuring the golden 18 folds. Biting into a dumpling releases a burst of rich, savory pork broth, perfectly balanced with tender filling. Paired with ginger threads and fragrant vinegar, it is an absolute delight. Both foreign tourists and locals willingly queue up for this classic delicacy.", "name": "Din Tai Fung Taipei 101 Branch", "transport": "Directly connected via Exit 4 underground passage of MRT Taipei 101/World Trade Center Station"}, {"address": "8F, No. 9, Songshou Rd., Xinyi Dist., Taipei City (Shin Kong Mitsukoshi A9)", "feature": "\u2b50 4.4 Stars | A decades-old staple of traditional Taiwanese cuisine, elevating authentic old-school banqueting and home-style dishes into refined culinary experiences. The signature pan-fried pork liver is crispy on the outside, tender inside, smooth, and devoid of gameyness; the dried radish omelet is thick, fluffy, and bursting with scallion aroma and savory radish crunch. The top choice for experiencing authentic Taiwanese feasts and homestyle flavors.", "name": "Shin Yeh Taiwanese Cuisine Shin Yi A9 Branch", "transport": "About a 6-minute walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "No. 1, Lane 281, Wuxing St., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 Stars | An iconic beef noodle institution near Taipei 101 and Taipei Medical University, recognized by the Michelin Bib Gourmand. Its braised beef noodle broth is simmered with beef bones and secret Chinese medicinal herbs, creating a rich, deeply satisfying flavor with a subtle kick of spice. Thick slices of beef shank are braised until melt-in-your-mouth tender. Paired with freshly made, crispy layered beef rolls wrapped with sweet bean sauce, it leaves an unforgettable impression.", "name": "Mu Ji Beef Noodles", "transport": "About a 10-minute walk from Exit 2 of MRT Taipei 101/World Trade Center Station"}, {"address": "B1, No. 45, Shifu Rd., Xinyi Dist., Taipei City (Taipei 101 Food Court)", "feature": "\u2b50 4.0 Stars | A century-old noodle eatery originating from Tainan, world-famous for its ancestral minced pork recipe. A delicate bowl of Danzai noodles combines sweet shrimp broth, springy oil noodles, and a topping of savory, slow-cooked ancestral minced pork sauce, garnished with fresh shrimp and minced garlic. Layered with nostalgic, aromatic flavors, it preserves the most authentic Taiwanese food culture.", "name": "Du Hsiao Yueh Taipei 101 Branch", "transport": "Direct access from Exit 4 of MRT Taipei 101/World Trade Center Station"}, {"address": "B2, No. 11, Songshou Rd., Xinyi Dist., Taipei City (Shin Kong Mitsukoshi A11)", "feature": "\u2b50 4.1 Stars | Established in 1973, this classic Northern Chinese noodle and pie establishment built its legendary status on golden juicy beef pies and millet porridge. The meat pies are pan-fried to a crisp golden finish, bursting with rich savory meat juice and green scallion aroma upon first bite. Paired with smooth, fragrant millet porridge and authentic side dishes, it offers a warm taste of classic Northern comfort food.", "name": "Zhu Ji Pie \u0026 Porridge Shin Kong Mitsukoshi A11 Branch", "transport": "About a 5-minute walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "B1, No. 9, Songshou Rd., Xinyi Dist., Taipei City (Shin Kong Mitsukoshi A9)", "feature": "\u2b50 4.3 Stars | A legendary traditional tea house that pioneered bubble tea culture, seamlessly blending authentic Taiwanese tea culture with traditional dim sum and snacks. Its signature boba milk tea blends premium black tea with chewy mini tapioca pearls, creating a silky blend of tea and milk aromas. Paired with savory spicy Kung Fu noodles, braised blood rice cakes, and dried tofu, it is a top choice for foodies and travelers looking to relax and enjoy classic Taiwanese tea time.", "name": "Chun Shui Tang Cultural Tea House Shin Kong Mitsukoshi A9 Branch", "transport": "About a 6-minute walk from Exit 3 of MRT Taipei City Hall Station"}, {"address": "5F, No. 297, Sec. 5, Zhongxiao E. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A state-banquet level classic Hunanese restaurant, and the birthplace of iconic dishes like \u0027General Tso\u0027s Chicken\u0027 and \u0027Honey Ham with Crisp Pastry\u0027. The signature Honey Ham is served sandwiched between crisp pastry inside a soft steamed bun\u2014offering a rich interplay of sweet, savory, crunchy, and soft textures. Upholding meticulous hand-craftsmanship for decades, it allows diners to enjoy classic state banquet-grade master dishes right in the heart of Xinyi District.", "name": "Peng\u0027s Gourmet \u0026 Banquet Hall Taipei Branch", "transport": "About a 3-minute walk from Exit 1 of MRT Yongchun Station"}, {"address": "No. 158, Lane 30, Yongji Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 Stars | A beloved local heritage cold noodle shop tucked away in Alley 30, Yongji Road, highly favored by local office workers and residents. Freshly boiled then chilled noodles offer a delightful chewy texture, drenched in rich sesame sauce, garlic juice, and special chili oil for a smooth, refreshing dish infused with gentle garlic and sesame aromas. Pair it with a piping hot \u00273-in-1\u0027 miso soup (with pork meatballs and egg drop) for the most authentic Taipei cold noodle experience.", "name": "Liang Ji Cold Noodles", "transport": "About a 5-minute walk from Exit 4 of MRT Taipei City Hall Station"}], "name": "Local Traditional Famous Restaurants"}, "cat_2": {"items": [{"address": "88F, No. 7, Sec. 5, Xinyi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.5 Stars | Located on the 88th floor of Taipei 101, created by World Barista Champion Berg Wu. The signature combination of the \"Wrinkled\" soft-baked honey cake and Taiwanese Tea Latte is a must-try. Velvety smooth milk foam merges seamlessly with deep coffee notes, paired with an unbeatable panoramic view of the Taipei Basin, making it a top-tier coffee sanctuary for travelers worldwide.", "name": "Simple Kaffa Sola", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, approx. 2 mins walk inside the Taipei 101 building"}, {"address": "2F, No. 17, Songzhi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.2 Stars | A popular New York minimal black-and-white styled cafe that took Xinyi District by storm with its sensational Einsp\u00e4nner coffee and stuffed croissants. The Einsp\u00e4nner is topped with rich whipped cream and sprinkled cocoa powder, offering a smooth, layered texture that isn\u0027t overly sweet. The buttery, crispy cream croissants are packed with luscious filling, making this a top afternoon tea choice for youth and professionals.", "name": "10000 Ten Thousand Coffee (Breeze Nanshan)", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, approx. 3 mins walk"}, {"address": "2F, No. 103, Sec. 4, Xinyi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.3 Stars | An all-day brunch spot featuring a stunning sky garden setup. Highly recommended is the French Toast\u2014made with pure milk bread soaked in egg wash, pan-fried to crisp perfection on the outside while remaining tender and custard-like inside. Served with caramelized bananas and maple syrup, it melts in your mouth. The elegant ambiance and high-quality food make it a magnet for influencers and foodies.", "name": "BRUN Brunch (Xinyi Branch)", "transport": "MRT Xinyi Anhe Station Exit 5, approx. 3 mins walk"}, {"address": "B1, No. 91, Songren Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.4 Stars | Specializing in healthy, nutritionist-designed balanced brunches, this cafe combines American relaxed vibes with a pet-friendly environment. The signature Avocado \u0026 Smoked Salmon Sourdough Toast is refreshing, featuring generous fresh avocado slices paired with savory salmon on tangy sourdough that whets the appetite. With beautiful latte art and smooth drinks, it\u0027s a hot spot for health-conscious foodies.", "name": "TAMED FOX (Xinyi Branch)", "transport": "MRT Xiangshan Station Exit 1, approx. 6 mins walk"}, {"address": "No. 379, Sec. 4, Xinyi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 Stars | A classic Australian-style cafe and brunch house in Taipei, featuring a bold industrial chic aesthetic and communal long table dining. Their Flat White boasts silky fine microfoam and rich, aromatic espresso with a sweet aftertaste. The popular Classic Aussie Big Breakfast includes sunny-side-up eggs, bacon, handmade sausage, and roasted tomatoes\u2014hearty, authentic, and beloved by both tourists and locals.", "name": "Woolloomooloo (Xinyi Branch)", "transport": "MRT Taipei 101/World Trade Center Station Exit 1, approx. 5 mins walk"}, {"address": "3F, Hall A11, No. 11, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.4 Stars | Took the food scene by storm with its cloud-like, fluffy \"Cloud Souffle Pancakes.\" Melting in your mouth with rich egg and milk flavors, they are drizzled with signature Anglaise cream sauce for a balanced sweetness. Their Cheese Waterfall Wagyu Burger offered during brunch hours is a visual and culinary treat, hugely popular among families and young women.", "name": "Woosa Pancake (Taipei Xinyi A11 Branch)", "transport": "MRT Taipei City Hall Station Exit 3, approx. 6 mins walk"}, {"address": "No. 65, Alley 22, Lan
