 them immensely popular among Japanese and Korean tourists. It\u0027s the top choice for high-quality skincare souvenirs in the Zhongshan shopping district.", "name": "Cha Tzu Tang Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "1F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 1F)", "feature": "\u2b50 4.8 stars | Must-buy list: Miracle Moringa Oil, Pure Hydrating Serum, Bare Vegan Lip Balm. As a pioneer of Clean Beauty in Taiwan, Greenvines emphasizes minimal skincare and eco-friendly philosophy. The counter features a sustainable green design and offers professional skin consultations. Its flagship Miracle Moringa Oil is a best-selling hydrating essential with hundreds of thousands of bottles sold. The natural, burden-free ingredients are loved by beauty enthusiasts who prioritize ingredient safety.", "name": "Greenvines Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "1F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 1F)", "feature": "\u2b50 4.5 stars | Must-buy list: Mugwort Soap, Liquid Shampoo, Mugwort Repair Cream. YUAN is a leading Taiwanese brand for handcrafted herbal care products, insisting on using hand-picked herbs from contracted farms inside Yangmingshan National Park. The signature Mugwort Soap offers exceptional soothing and calming benefits with a pure, comforting traditional herbal aroma. Packaged with Oriental Zen and creative aesthetic flair, it\u0027s a must-buy local skin cleansing staple when visiting Chifeng Street and the Zhongshan shopping area.", "name": "YUAN Soap Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "1F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 1F)", "feature": "\u2b50 4.4 stars | Must-buy list: Ginger Hand Cream, Mature Ginger \u0026 Bamboo Ginger Body Wash, Turmeric Repairing Sheet Mask. Ginger 80 artfully infuses extracts of local Taiwanese mature ginger and bamboo ginger into beauty products. The unique warming ginger scent helps boost circulation and relax the body and mind. Their rich, non-greasy hand creams are skincare saviors during cold winters or long stays in air-conditioned rooms. Featuring elegant packaging brimming with authentic Taiwanese charm, it makes a wonderful local beauty souvenir for family and friends.", "name": "Ginger 80 Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "1F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 1F)", "feature": "\u2b50 4.7 stars | Must-buy list: Snow Algae Bio-Cellulose Mask, Black Mask Series, Skin Revitalizing Serum. A pride of Taiwan, this sheet mask brand conquered Galeries Lafayette in Paris and is internationally renowned for advanced bio-cellulose technology and superior post-use hydration. The counter showcases a full range of targeted facial masks. Tourists can shop for photo-worthy masks catering to every skin need while receiving detailed application advice from staff\u2014a holy-grail domestic beauty brand to stock up on in Zhongshan.", "name": "TTM Mask Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "No. 22, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: 1028 Oil-Control Loose Powder, Solone Long-Wear Liquid Eyeliner, heme Pure Cheek Color. POYA is Taiwan\u0027s premier drugstore and lifestyle destination. The Nanjing West Road branch is spacious, bright, and fully stocked. It brings together popular budget-friendly yet high-quality Taiwanese drugstore makeup brands (such as Solone, heme, and 1028). A treasure-hunting paradise for foreign tourists looking for local cosmetics and daily novelties, it offers frequent sales and super attractive prices.", "name": "POYA Taipei Nanjing W. Rd. Store", "transport": "About a 2-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "2F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 2F)", "feature": "\u2b50 4.6 stars | Must-buy list: GROWN ALCHEMIST Hand Cream, Neal\u0027s Yard Remedies Essential Oils, L\u0027A narrow Rollerball Fragrance. A boutique multi-brand beauty apothecary located in the heart of Zhongshan district, carefully selecting healthy, organic, and clean cosmetics, skincare, and aromatherapy products from around the world and Taiwan. The ambiance is peaceful and refined, offering a delightful testing experience. Staffed with knowledgeable aromatherapy advisors, it is perfect for discerning women seeking mindful living rituals and natural plant-based skincare.", "name": "10/10 HOPE Eslite Nanxi Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "No. 207, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Senka Perfect Whip Facial Wash, Kao Steam Eye Mask, local Taiwanese co-branded herbal patches. Located near the Zhongshan shopping area, this flagship store not only carries a wide selection of cosmetics, skincare, and health medicines, but also features a free-entry \u0027Showa Museum\u0027 on the 4th floor recreating nostalgic streets of Japan\u0027s Showa era. Alongside popular Japanese beauty items, it features dedicated sections for unique Taiwanese drugstores and best-selling hydration products, making it a hotspot for both shopping fun and photo-ops.", "name": "Japan Medical Nanjing W. Rd. Store", "transport": "About a 6-minute walk along Nanjing W. Rd. from MRT Zhongshan Station Exit 6"}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 22, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Moccasin cork loafers, vintage Mary Janes, plain Chelsea ankle boots. The flagship store of Taiwan\u0027s immensely popular local women\u0027s footwear brand. The entire building features a chic Korean milk-tea-toned design that attracts countless young women and tourists. Spacious and bright, the store offers hundreds of stylish yet affordable shoes\u2014from comfortable work pumps to trendy Korean boots. Loved by customers for its great fitting experience and high quality.", "name": "D+AF Shoes Zhongshan Flagship", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "No. 5, Ln. 23, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: COP brand travel crossbody bag, Anti-UV Barber short-sleeve shirt, 1616 versatile proportion trousers. One of Taiwan\u0027s most iconic local street style and minimalist select shops, deeply rooted in local fashion culture. Located in a hip hipster alley, the Zhongshan store offers high-quality daily apparel and accessories for men and women. Their signature in-house travel crossbody bag is a smash-hit item almost every tourist carries. With friendly styling advice from the staff, it\u0027s a trendsetting spot you shouldn\u0027t miss in the Zhongshan shopping area.", "name": "plain-me Select Shop Zhongshan", "transport": "About a 2-minute walk from MRT Zhongshan Station Exit 4"}, {"address": "No. 8, Ln. 18, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-buy list: Genuine leather dual-layer crossbody bag, multi-card anti-theft leather short wallet, lightweight textured tote bag. A high-CP-value local Taiwanese women\u0027s bag brand known for affordable yet premium genuine leather craftsmanship and ultra-functional storage spaces. The Zhongshan concept store offers a warm, cozy setting filled with commuter totes, wallets, crossbodies, and more. Featuring refined details and rich color options, it\u0027s perfect for women who appreciate minimalist style and practical design.", "name": "S\u0027AIME Bag Zhongshan Concept Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "No. 9, Ln. 49, Chifeng St., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Comfortable cotton-linen dresses, Japanese-cut wide-leg pants, handmade leather shoes. Tucked away in the alleys of Chifeng Street, this independent Taiwanese original women\u0027s wear brand insists on skin-friendly natural fabrics and exquisite tailoring. Exuding a natural, fresh, soft, and elegant Japanese minimalist style, it is beloved by local women who embrace slow living and hipster aesthetics. Produced in limited quantities with superb quality, fitting here feels as relaxing as being home.", "name": "XUXUWEAR Zhongshan Concept Store", "transport": "About a 3-minute walk from MRT Shuanglian Station Exit 1 or MRT Zhongshan Station Exit R10"}, {"address": "No. 11, Ln. 23, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Mori-style embroidered loose-fit shirt, Japanese high-waisted padded overalls, canvas hipster tote bag. A super popular local Taiwanese women\u0027s clothing brand with a long history, its Zhongshan flagship store boasts vast shopping space and thoughtfully curated decor. Focusing on practical, fresh, natural, and affordable daily apparel in diverse styles\u2014from casual wear to Japanese Mori girl aesthetic\u2014it\u0027s a shopping paradise for students and budget-conscious fashion lovers visiting Zhongshan.", "name": "QUEEN SHOP Zhongshan Concept Store", "transport": "About a 2-minute walk from MRT Zhongshan Station Exit 4"}, {"address": "No. 15, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Figure-flattering slimming pants, brand collaboration logo tees, chic knit cardigans. The brick-and-mortar concept flagship store of PAZZO, Taiwan\u0027s famous online trendy women\u0027s wear brand. Spanning three floors, it combines fashion, lifestyle goods, and a caf\u00e9. The store\u0027s interior boasts a highly photogenic contemporary minimalist design, selling flattering cuts and stylish clothing. It\u0027s a hugely popular shopping and check-in hotspot for young women.", "name": "PAZZO Zhongshan Flagship Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 3"}, {"address": "1F, No. 14, W. Nanjing Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Disney collaboration chunky sneakers, leg-slimming knee-high boots, Korean-style slip-on loafers. A renowned Taiwanese women\u0027s shoe and bag brand famous for its keen fashion sense and extensive IP collaborations (such as Disney, Sailor Moon, etc.). The Zhongshan concept store decor is filled with dreamy, sweet charm. Shoes combine gorgeous designs with superb comfort, prompting many female tourists to make a special trip here for limited collaboration footwear and accessories.", "name": "Gracegift Concept Store Zhongshan", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "2F, No. 25, Ln. 20, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Authentic US military vintage jackets, designer collaboration canvas bags, outdoor functional lightweight crossbody bags. Located on the second floor of an old apartment on Zhongshan North Road, this well-known independent select shop exudes a strong vintage Americana and lifestyle aesthetic. Featuring curated apparel, military vintage gear, quality canvas bags, and stylish accessories from around the world, it is packed with unique personality and intriguing details\u2014a hidden gem for those seeking understated, non-mainstream style.", "name": "Everydayware \u0026 Co", "transport": "About a 4-minute walk from MRT Zhongshan Station Exit 4"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 67, Sec. 2, Chang\u0027an E. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature Mung Bean Pastry, Pork Floss Pineapple Cake, Egg Yolk Pastry. As an iconic century-old pastry shop in Taipei, Taipei Lee Chi has long been the top choice for holiday gifts among domestic and international travelers as well as locals. Its mung bean pastry features carefully selected mung bean paste paired with rich, savory pork filling, with thin pastry skin and melt-in-your-mouth richness. The Pork Floss Pineapple Cake uniquely combines savory pork floss with pleasantly sweet pineapple filling, creating an addictive sweet-and-savory flavor profile.", "name": "Taipei Lee Chi Bakery", "transport": "MRT Songjiang Nanjing Station Exit 4, approx. 5 minutes walk"}, {"address": "1F, No. 37-1, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Macadamia Nut Nougat, Royal Pineapple Cake, Matcha Nougat. Located along the tree-lined boulevard of Zhongshan North Road, Royal Bakery\u0027s handmade nougat is hugely popular among Japanese and Korean tourists. Made with imported Australian macadamia nuts and French butter, it offers the perfect texture\u2014neither too hard nor too soft, and completely non-stick to your teeth. Rich in pure milky aroma and beautifully packaged, it is one of the most sought-after premium gifts in the Zhongshan shopping district.", "name": "Royal Bakery (Hotel Royal-Nikko Taipei)", "transport": "MRT Zhongshan Station Exit 3, walk along Zhongshan North Road for about 6 minutes"}, {"address": "4F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi)", "feature": "\u2b50 4.5 stars | Must-Buy List: Local Taiwanese dried fruits, retro hand-brewed soy sauce, selected Taiwanese high-mountain tea bags. Located on the 4th floor of Eslite Spectrum Nanxi, Shen Nong Life embodies the concept of \u0027LOHAS and Taiwanese aesthetics,\u0027 carefully selecting premium products from independent local farmers across Taiwan. Their Irwin dried mangoes and dried pineapples contain no artificial preservatives, retaining the fruits\u0027 natural sweetness. Featuring stylish, hip packaging design, it is ideal for travelers looking for refined Taiwanese snacks and ingredients.", "name": "MAJI TREATS / Shen Nong Life (Nanxi Store)", "transport": "MRT Zhongshan Station Exit 1, right outside the exit"}, {"address": "No. 22, Sec. 1, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Ice Mung Bean Pastry, Bubble Tea Pineapple Cake, OhBear Cookies. Founded in 1867, this famous traditional Taiwanese bakery features a bright, modern store in Zhongshan. Its highly creative Bubble Tea Pineapple Cake seamlessly blends the chewy texture of Taiwanese boba with sweet pineapple filling, captivating young tourists. Meanwhile, the classic Ice Mung Bean Pastry showcases a century-old white bean paste craft, offering a silky, melt-in-your-mouth texture.", "name": "Kuo Yuan Ye (Zhongshan Store)", "transport": "MRT Taipei Main Station Exit M1 or MRT Zhongshan Station Exit R2, approx. 7 minutes walk"}, {"address": "No. 78, Sec. 1, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Jade Mung Bean Cake, New Zealand Cheese Pineapple Cake, 3D Heart Pineapple Cake. Highly praised by tourists from Hong Kong and South Korea, this renowned souvenir shop\u0027s signature \u0027Jade Mung Bean Cake\u0027 is made with pure vegetable oil and premium mung bean kernels. It has a velvety, ice-cream-like texture that melts in your mouth and tastes even better chilled. Adhering strictly to a preservative-free policy, it is a must-visit for health-conscious foodies.", "name": "Kong Kee Bakery (Zhongshan Store)", "transport": "MRT Zhongshan Station Exit R2, approx. 3 minutes walk"}, {"address": "B2, No. 3, Ln. 39, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Regent Braised Beef Noodle Gift Box (Shelf-Stable), Pineapple Custard Lava Cake, Peeled Chili Pepper Chicken Soup Pack. Offering exquisite gifts from the 5-star Regent Taipei, its braised beef noodle box has won multiple Beef Noodle Festival championships, featuring room-temperature packaging convenient for overseas travel. The Pineapple Custard Lava Cake combines tangy-sweet Taiwanese pineapple filling with rich molten custard, making it a supreme choice for prestigious gift-giving.", "name": "Regent Taipei Gift Shop", "transport": "MRT Zhongshan Station Exit 3, walk along Zhongshan North Road Sec. 2 for about 7 minutes"}, {"address": "No. 22, Chifeng St., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Taiwanese Blended Tea Bags, Retro Specialty Snack Packs, Hipster Designed Tumblers. Tucked away in the alleys of Chifeng Street, this trendy lifestyle select shop offers lifestyle goods and original stationery, alongside a line of locally flavored tea bags and traditional snacks. With a cozy ambiance and heartwarming quotes printed on the packaging, it is one of the most iconic creative souvenir shops on Chifeng Street.", "name": "One Day Co. (Chifeng Store)", "transport": "MRT Zhongshan Station Exit R7 or Exit 4, approx. 3 minutes walk"}, {"address": "No. 136, Minsheng W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Hot Mochi Gift Box, Special Taro Paste Dessert Set, Traditional Crispy Rice Souvenir. Established in 1951, this famous traditional dessert shop is located right next to the Chifeng Street area. Its signature \u0027Hot Mochi\u0027 is gently simmered in oil, resulting in a soft, chewy texture coated with fragrant peanut and sesame powder. They offer convenient vacuum-sealed packs and gift boxes so tourists can bring home and share the classic taste of traditional Taiwanese desserts.", "name": "Shuang Lian O-Tia-Nyi", "transport": "MRT Shuanglian Station Exit 1, approx. 3 minutes walk"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 12, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: JO MALONE luxury fragrances, Taiwan-exclusive gift sets, Shiseido star skincare sets. Located in the heart of the Zhongshan Shopping District, this is an iconic flagship department store in Taipei. It houses international luxury brands, trendy Japanese cosmetics, and themed restaurants. The gourmet supermarket and famous souvenir section on B1 make it an unmissable shopping paradise for tourists.", "name": "Shin Kong Mitsukoshi Taipei Nanxi Store Hall 1", "transport": "Directly accessible from MRT Zhongshan Station Exit 2"}, {"address": "No. 14, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Shen Nong Life specialty Taiwanese sauce gift boxes, Sarutahiko Coffee roasted beans, Eslite cultural and creative notebooks. A large lifestyle department store combining humanities reading, Japanese-style selections, and rising local Taiwanese creative brands. The entire building is designed as a bright, curated lifestyle space, making it extremely popular among young people and foreign tourists.", "name": "Eslite Spectrum Nanxi", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit 1"}, {"address": "No. 356, Sec. 1, Wenhua 3rd Rd., Linkou Dist., New Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Discounted limited-edition NIKE sneakers, classic COACH signature bags, BEAMS trendy Japanese apparel. The premier international outlet mall in Greater Taipei, offering amazing discounts starting from 80% off on major international and Japanese brands. Featuring resort-style greenery and popular dining options, it\u0027s an excellent destination for bargain hunting.", "name": "MITSUI OUTLET PARK Linkou", "transport": "Take the MRT from Zhongshan Station to Taipei Main Station, transfer to Taoyuan Airport MRT to A9 Linkou Station, then walk about 10 minutes"}, {"address": "No. 1, Sec. 1, Chengde Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Local Taiwanese designer womenswear, Yuan Soap natural handmade herbal soaps, specialty dessert gift boxes. Located right next to Zhongshan Shopping District and Taipei Main Station, Q Square focuses on fashion, trendiness, and youth convenience. It features a rich variety of local Taiwanese apparel brands and quality lifestyle goods, while its basement food court gathers numerous popular local Taiwanese snacks.", "name": "Q Square", "transport": "About an 8-minute walk from MRT Zhongshan Station via Zhongshan Metro Mall, or direct access from MRT Taipei Main Station"}, {"address": "No. 18-1, Lane 25, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Washed organic cotton canvas bags, natural botanical dye casual shirts, original hand-drawn paper notebooks. An iconic local independent design brand store in the Zhongshan area, committed to using natural organic cotton and botanical dyes. Presenting pure and natural original Taiwanese design quality, it\u0027s a must-visit local brand for hipsters exploring Zhongshan District.", "name": "Booday Design Store", "transport": "About a 3-minute walk from MRT Zhongshan Station Exit 4"}, {"address": "B1, No. 1, Lane 3, Chifeng St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: PAR original graphic t-shirts, Taiwanese indie band vinyl records, artist collaboration sticker sets. Hidden in a basement along the alleys of Chifeng Street, this independent select shop brings together underground music, subculture streetwear, and local artist merchandise, perfectly representing Taipei\u0027s unique indie creative scene.", "name": "PAR Store", "transport": "About a 1-minute walk from MRT Zhongshan Station Exit R4"}, {"address": "No. 6, Alley 10, Lane 64, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade flannel pour-over coffee filters, local Taiwanese craft sundries, curated Taiwanese craft beers. An exquisite independent select shop rooted in Chifeng Street for years. The owner carefully curates high-quality home goods, apparel, and lifestyle items from Taiwan and Japan, showcasing a minimalist and practical aesthetic.", "name": "61NOTE Select Shop", "transport": "About a 4-minute walk from MRT Zhongshan Station Exit 6"}, {"address": "No. 18, Sec. 2, Zhongshan N. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Original Taiwanese metalwork jewelry, movie-themed souvenir bookmarks, handcrafted quality lifestyle items. Located inside SPOT-Taipei Film House (a historic Grade-3 historic mansion), this independent arts shop focuses on promoting local Taiwanese original designs, offering products filled with artistic charm and refined craftsmanship.", "name": "SPOT Design Shop", "transport": "About a 3-minute walk from MRT Zhongshan Station Exit 3"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Zhongshan Shopping District and Chifeng Street"}};

            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
