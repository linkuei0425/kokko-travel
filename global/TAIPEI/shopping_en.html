ict. Its signature \u0027Puff Pastry Cake\u0027 features a golden, crispy, savory outer shell wrapping a soft, moist sponge cake. The perfect balance of sweet and savory leaves a lasting impression, often selling out as soon as it leaves the oven.", "name": "\u767e\u5408\u9eb5\u5305\u5712 \u58eb\u6797\u5e97 (Lily Bakery Shilin Branch)", "transport": "MRT Shilin Station Exit 1, about a 3-minute walk."}, {"address": "No. 19, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: Honey Pork Jerky, Kaoliang Liquor Beef Jerky, Crispy Pork Floss. A well-established jerky shop in Shilin Night Market, insisting on daily on-site roasting. Carefully selecting premium Taiwanese pork and beef marinated in exclusive sauces, the jerky is juicy, tender, and rich with savory flavor. Packaged in convenient ziplock bags, it\u0027s the perfect snack to enjoy while exploring the night market or to take home as a snack with drinks.", "name": "\u5ee3\u73cd\u9999\u8089\u4e7e (Guang Zhen Xiang Meat Jerky)", "transport": "MRT Jiantan Station Exit 1, about a 6-minute walk."}, {"address": "No. 74-1, Qiangang St., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-buy list: Double-Layer Strawberry Cake, Snow Fresh Cream Roll, Rich Chocolate Strawberry Cake. A famous bakery in Taipei renowned for long queues, celebrated for its generous fresh large strawberries and rich, non-greasy custard cream. The seasonal Double-Layer Strawberry Cake is packed with fresh berries, delivering a perfectly balanced sweet-and-sour taste that sparks a buying frenzy across Taiwan\u2014a dessert gift box you cannot miss when visiting Shilin.", "name": "\u58eb\u6797\u5ba3\u539f\u86cb\u7cd5 (Xuanyuan Bakery)", "transport": "MRT Jiantan Station Exit 3, about an 8-minute walk."}, {"address": "No. 126, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Crispy Almond Pork Paper, Extra Thick Honey Pork Jerky, Energy Pork Paper Sticks. A well-known local Taiwanese jerky brand, its Shilin branch is located on the main street of the night market, offering generous tasting samples and exquisite gift boxes. The famous \u0027Crispy Almond Pork Paper\u0027 is paper-thin and incredibly crispy, while the extra-thick honey pork jerky is juicy and chewy, making it a classic souvenir box essential for tourists.", "name": "\u5feb\u8eca\u8089\u4e7e \u58eb\u6797\u9580\u5e02 (Kuai Che Meat Jerky Shilin Branch)", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 205, Minshan St., Neihu Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: ROOTS classic casual hoodies, Timberland waterproof yellow boots, Samsonite anti-theft luggage. The most representative urban outlet center in downtown Taipei, located very close to the Shilin and Dazhi commercial districts. Bringing together hundreds of international luxury, sports, and casual brands, it offers amazing discounts from 50% to 80% off (2 to 5\u6298), making it a top shopping haven for locals and tourists hunting for bargain luxuries.", "name": "LEECO Outlet Neihu Store", "transport": "Take the MRT Bannan Line to Kunyang Station, transfer to Bus Blue 50 to \u0027Xinhu 1st Rd. Intersection\u0027 stop, and walk for about 3 minutes."}, {"address": "No. 77, Sec. 6, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Din Tai Fung frozen pineapple cakes and xiaolongbao, premium Taiwan Oolong tea gift boxes, imported Japanese organic skincare products. A green building landmark department store in the Shilin-Tianmu area, featuring a bright, spacious environment with a relaxed, exotic Tianmu vibe. Housing a top-tier food court and internationally renowned brands, it is a fantastic spot to enjoy comfortable shopping and delicious food after visiting Shilin or the National Palace Museum.", "name": "Far Eastern SOGO Department Store Tianmu Store", "transport": "Take the MRT Tamsui-Xinyi Line to Zhishan Station (Exit 2), and walk for about 3 minutes."}, {"address": "No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City (1F, Exhibition Area 1, National Palace Museum)", "feature": "\u2b50 4.6 stars | Must-buy list: Jadeite Cabbage folding umbrella, Meat-Shaped Stone paperweight, classic \u0027I Have Received Your Memorial\u0027 (\u6715\u77e5\u9053\u4e86) creative masking tape. The ultimate cultural and creative flagship shop located inside the National Palace Museum, skillfully blending thousand-year-old national treasures into everyday lifestyle goods and modern design. The merchandise combines rich historical heritage with playful style, making it a national-level souvenir shopping paradise you cannot miss when visiting the museum.", "name": "National Palace Museum Gift Shop", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 1), transfer to Bus R30, 255, or 304, and get off at \u0027National Palace Museum\u0027 stop."}, {"address": "No. 546, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Century-old classic mung bean ice-crust pastries, DIY pineapple cake experience gift box, signature Jinghua egg yolk pastry. The flagship headquarters of a century-old Taiwanese pastry brand founded in 1867, located right next to MRT Shilin Station. Besides purchasing authentic traditional Taiwanese pastries and souvenirs, visitors can explore the bakery culture exhibition area and participate in hands-on DIY baking sessions to deeply experience local culinary culture.", "name": "Kuo Yuan Ye Bakery Shilin Headquarters", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station (Exit 1), and walk for about 2 minutes."}, {"address": "No. 68, Tianmu E. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: Chun Shui Tang boba milk tea specialty tea bags, Mia C\u0027bon select local agricultural gift sets, Taiwanese original creative design novelties. A comprehensive large department store deeply rooted in Shilin and Tianmu for years, combining exquisite shopping, Vie Show Cinemas, and a wide variety of restaurants. Featuring a warm, neighborhood-friendly atmosphere, it delivers a welcoming shopping experience and stands as one of Tianmu\u0027s iconic landmarks.", "name": "Shin Kong Mitsukoshi Taipei Tianmu Store", "transport": "Take the MRT Tamsui-Xinyi Line to Shipai Station, transfer to Bus R12 or R15 to \u0027Tianmu Junior High School\u0027 stop."}, {"address": "No. 16-7, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Hypoallergenic surgical steel post earrings, minimalist sterling silver bracelets, scented decorative jewelry trays. A highly representative affordable fast-fashion accessory brand in Taiwan, featuring a stylish physical store in the Shilin Night Market district. Offering an extensive variety of styles with new arrivals every week, it combines high-quality design with incredible value, making it immensely popular among young travelers and locals alike.", "name": "Bonny \u0026 Read Accessories Shilin Store", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 5 minutes into the Shilin Night Market district."}, {"address": "1F, Far Eastern SOGO Tianmu Store, No. 77, Sec. 6, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Moringa Oil, Scalp Purifying Shampoo, Pure Hydrating Serum. A benchmark for Taiwanese clean skincare brands, advocating minimalist skincare and sustainable eco-friendly principles. The counter provides professional skin consultations and thoughtful product testing. Its natural, burden-free products are hugely popular across Taiwan, making it a highly recommended Taiwanese beauty must-buy for quality-minded and eco-conscious shoppers.", "name": "Greenvines Tianmu SOGO Store", "transport": "Take the MRT Tamsui-Xinyi Line to Zhishan Station (Exit 2), and walk for about 3 minutes."}, {"address": "No. 130, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: UPF50+ cooling anti-UV functional jackets, Taiwan limited-edition printed cotton T-shirts, high-stretch comfortable casual pants. The flagship store of Taiwan\u0027s largest local fast-fashion apparel brand, located at the main entrance of Shilin Night Market. Bright, spacious, and stocked with an impressive range of products, it is famous for high-quality, affordable clothing and excellent functional wear, making it a great local choice for everyday wardrobe staples.", "name": "NET Fashion Shilin Flagship Store", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1), and walk for about 3 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Shilin Night Market and the National Palace Museum"}, "ximending": {"categories": {"cat_1": {"items": [{"address": "1F, No. 52, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Mugwort Shampoo, Bitter Melon Cleansing Cream, Chinese Clover Handmade Soap. As a top-tier representative of Taiwan\u0027s native herbal handmade soaps, YUAN insists on using non-toxic, organically grown herbs from Yangmingshan National Park, blending traditional cold-process methods to create cleansing products that are exceptionally gentle on both skin and environment. The counter at Eslite Ximen Store displays a full range of herbal essential oils, skincare, and bath products, with friendly staff offering trial wash services. The mugwort series gently soothes sensitive skin, leaving a naturally healing herbal scent after washing, making it a top choice for tourists looking for high-quality souvenirs to take home.", "name": "YUAN Soap - Eslite Ximen Store", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}, {"address": "No. 84, Xichang St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Immortal Fresh Herbal Tea Bags, Herbal Hanfang Bath Packs, Herbal Moisture Repair Balm. Located near the traditional Herbal Lane in Bangka (Wanhua), this long-established herbal shop transformed into a modern, hipster-chic herbal wellness experience center. Blending decades of traditional Chinese herbal wisdom into daily beauty and body care, their specially formulated herbal bath packs help dispel body dampness, soothe muscle fatigue, and nourish the skin. The store offers professional herbal tea consultations and body constitution advice, perfectly bridging Bangka\u0027s local historical culture with modern herbal beauty concepts.", "name": "Healing Herbar", "transport": "MRT Longshan Temple Station Exit 3, about a 3-minute walk"}, {"address": "No. 43, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Taiwan Indigenous Totem Facial Mask Set, Organic Botanical Hand Cream, Green Tea Antioxidant Cleansing Powder. MaskingDOM is Taiwan\u0027s most creative and exquisite local facial mask brand; its Ximending store exterior and product packaging artfully incorporate Taiwanese Indigenous cultural totems and artistic designs, making them highly collectible. Its facial masks feature highly concentrated patented botanical extracts and patented bio-cellulose material, delivering significantly boosted hydration and superior fit. Besides masks, the botanical hand creams and facial wash powders are popular souvenirs among tourists from Korea, Japan, Singapore, and Malaysia. The exquisite ethnic-style boxes make them perfect for gifting.", "name": "MaskingDOM Ximending Store", "transport": "MRT Ximen Station Exit 6, about a 4-minute walk"}, {"address": "2F, No. 52, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Rice Soothing Gel Mask, Red Bean Refreshing Gel Mask, Bamboo Ultra-Hydrating Serum. 23.5\u00b0N is a signature Taiwanese botanical skincare brand advocating formulations free from synthetic fragrances, artificial colors, and alcohol. It meticulously selects local Taiwanese agricultural produce\u2014such as Yunlin rice, Nantou red beans, and Chiayi bamboo\u2014as primary ingredients. Its iconic gel masks enjoy an outstanding reputation in Asian beauty circles; applied thick, they rapidly soothe sun-exposed or dehydrated skin with a refreshing, non-sticky texture. This counter is a must-visit spot in Ximending for skincare enthusiasts seeking Clean Beauty.", "name": "23.5\u00b0N Natural Skincare - Eslite Ximen", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}, {"address": "1-3F, No. 123, Xining S. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Tofuman Facial Cleanser, Steam Eye Mask Ximen Limited Set, Hada Labo Gokujyun Moisturizing Lotion. Spanning three spacious floors, this flagship store for Japanese beauty products and household goods is a 24-hour shopping landmark in Ximending. The beauty zone on the third floor brings together countless top-trending Japanese drugstore makeup, bestselling skincare items, and exclusive beauty devices. With smooth shopping aisles and a vibrant Japanese store atmosphere, whether you want to restock late-night sheet masks or search for trending Japanese makeup releases, this spot fulfills every shopping urge with competitive prices and incredible variety.", "name": "DON DON DONKI Ximen Store", "transport": "MRT Ximen Station Exit 6, about a 6-minute walk"}, {"address": "No. 37, Sec. 2, Wuchang St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Dr. Morita Hyaluronic Acid Essence Facial Mask, 1028 Extension Mascara, My Scheming Black Facial Mask. Situated at the heart of Ximending\u0027s pedestrian precinct, this flagship Watsons store features a spacious retail layout and an extensive local Taiwanese beauty area. The store specifically features a \u0027Must-Buy Taiwanese Local Beauty\u0027 zone, making it easy for international travelers to shop popular Taiwanese makeup and mask brands like Dr. Morita, 1028, and Solone all in one go. Frequently running buy-one-get-one-free deals and discount promotions, it\u0027s the best destination to experience the high-value charm of Taiwanese drugstore beauty.", "name": "Watsons Wuchang Store", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}, {"address": "No. 107, Hanzhong St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: DR.WU Intensive Renewal Serum with Mandelic Acid, For Beloved One Melasleep Brightening Bio-Cellulose Mask, Solone Custom Single Eyeshadow. Located on bustling Hanzhong Street in Ximending, this Cosmed store is famed for professional dermo-cosmetic skincare and acclaimed local Taiwanese makeup brands. On-site professional beauty advisors offer consultations to recommend the best cosmeceutical products tailored to individual skin types. Taiwanese skincare giants DR.WU and For Beloved One feature comprehensive product lineups here with frequent sales promotions, drawing crowds of shoppers seeking high-efficiency cosmeceutical care.", "name": "Cosmed Hanzhong Store", "transport": "MRT Ximen Station Exit 6, about a 2-minute walk"}, {"address": "No. 83, Xining S. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Sonbahyu Horse Oil Cream, Kao Steam Warm Sheets, Senka Perfect Whip Cleansing Foam. More than just a haven for purchasing Japanese cosmetics, skincare, and health supplements, this flagship store features a free \u0027Japan Medical Museum\u0027 on the 4th floor, recreating nostalgic 1960s Japanese Showa-era streetscapes. After shopping for Japan-exclusive beauty items, skincare, and enzyme supplements, visitors can head upstairs to snap retro photos. Fully stocked and offering tax-free shopping plus threshold discount promotions from time to time, it uniquely combines retail therapy with cultural sightseeing.", "name": "Japan Medical Ximen Flagship Store", "transport": "MRT Ximen Station Exit 6, about a 4-minute walk"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 26, Lane 96, Kunming St, Wanhua District, Taipei City", "feature": "\u2b50 4.5 stars | Must-Buys: COP Paisley Heavyweight Cotton T-shirt, PM Travel Hooded Jacket, PM3000 Multifunctional Pouch. plain-me is one of Taiwan\u0027s iconic local select shops and design brands, guided by the philosophy \u0027Mix \u0026 Match Every Day\u0027. Tucked away in the alleys of America Street in Ximen, the store features original designs alongside curated international streetwear brands. Tailored specifically for Asian body shapes with a minimalist yet detail-oriented aesthetic, it\u0027s a must-visit shopping spot for fans of Japanese streetwear and workwear styling.", "name": "plain-me Ximen Flagship Store", "transport": "Approx. 6 min walk from MRT Ximen Station Exit 6"}, {"address": "No. 10, Emei St, Wanhua District, Taipei City", "feature": "\u2b50 4.3 stars | Must-Buys: Classic Vintage Canvas Shoes, Ultra-soft Cushion Women\u0027s Flats, Handmade Casual Men\u0027s Shoes Made in Taiwan. Fufa Shoes is a local footwear brand committed to 100% Taiwan manufacturing, handcrafted by veteran local shoemakers. Famous for exceptional footbed cushioning and great value, their designs blend classic and modern styles with nostalgic Taiwanese-inspired prints. Excellently located in Ximen, it\u0027s a prime destination for tourists seeking practical, souvenir-worthy footwear.", "name": "Fufa Shoes Ximen Branch", "transport": "Approx. 3 min walk from MRT Ximen Station Exit 6"}, {"address": "No. 19, Lane 96, Kunming St, Wanhua District, Taipei City", "feature": "\u2b50 4.4 stars | Must-Buys: American Streetwear Oversized Hoodies, Brand Collaboration Cargo Pants, Trendy Metal Accessories. Deeply rooted in Ximending\u0027s American street culture, this local independent select shop specializes in high-end domestic and international streetwear alongside emerging designer labels. Featuring bold styles, relaxed silhouettes, and effortless attitude, it is highly favored by Taiwan\u0027s street dance, skateboarding, and fashion communities. Friendly staff also offer expert styling tips.", "name": "LAB Select Shop Ximen", "transport": "Approx. 6 min walk from MRT Ximen Station Exit 6"}, {"address": "No. 20, Lane 96, Kunming St, Wanhua District, Taipei City", "feature": "\u2b50 4.2 stars | Must-Buys: Classic Logo Graphic Tees, Trendy Baseball Caps, Functional Crossbody Bags. Born in Ximending and popular across Asia, STAGE is an original Taiwanese street fashion brand short for \u0027Trendstage\u0027. Its designs blend American street culture, graffiti, and pop trends, featuring bold color palettes and durable, high-quality fabrics. With futuristic interior decor, this flagship store is an iconic landmark of Ximen street fashion culture.", "name": "STAGE Ximen Flagship Store", "transport": "Approx. 6 min walk from MRT Ximen Station Exit 6"}, {"address": "1F, No. 9, Lane 96, Kunming St, Wanhua District, Taipei City", "feature": "\u2b50 4.6 stars | Must-Buys: SMG Camo Military Jacket, Vintage Cyber-Graphic Tees, Tactical Military Backpack. Founded by pop star JJ Lin, SMG stands for \u0027Still Moving Under Gunfire\u0027. The brand\u0027s aesthetic focuses on military attire, workwear, and modern streetwear, emphasizing intricate details and technical performance fabrics. The Ximen flagship carries an extensive line of seasonal apparel and limited-edition merchandise, loved by local and international fashion fans alike.", "name": "SMG Ximen Flagship Store", "transport": "Approx. 6 min walk from MRT Ximen Station Exit 6"}, {"address": "No. 109, Kunming St, Wanhua District, Taipei City", "feature": "\u2b50 4.3 stars | Must-Buys: \u002780s Vintage Patterned Shirts, Classic American Denim Jackets, Showa-era Printed Dresses. A well-known vintage clothing chain in Taiwan, this Ximen shop hides in an alleyway and basement space, feeling just like a treasure trove. It houses tens of thousands of second-hand American and Japanese vintage pieces, leather jackets, bags, and accessories. Offering great quality and fair prices, it is a local favorite for vintage enthusiasts and thrift hunters.", "name": "Monday Vintage Ximen", "transport": "Approx. 5 min walk from MRT Ximen Station Exit 6"}, {"address": "No. 42, Dali St, Wanhua District, Taipei City", "feature": "\u2b50 4.1 stars | Must-Buys: Taiwanese Designer Printed Dresses, Knit Styling Shawls, Artisan Tailored Blazers. Located in the historic Dali Street Garment Wholesale District in Monga, Wanhua, Solo Fashion is a long-standing local boutique. It focuses on high-quality women\u0027s clothing designed and tailored by Taiwanese master tailors. Offering comfortable fabrics, affordable prices, and refined style, it embodies the solid craftsmanship and heartwarming hospitality of old Wanhua\u0027s garment industry.", "name": "Solo Fashion - Monga Dali Apparel Shopping District", "transport": "Approx. 3 min walk from MRT Longshan Temple Station Exit 2"}, {"address": "No. 158, Sec. 1, Zhonghua Rd, Wanhua District, Taipei City", "feature": "\u2b50 4.7 stars | Must-Buys: Slimming Best-seller Loafers, Korean-style Soft Leather Ankle Boots, Cloud Ruched Square Bags. One of Taiwan\u0027s most popular women\u0027s shoe and bag brands, its Ximen Concept Store features a minimalist aesthetic with warm milk-tea tones, earning it the reputation as \u0027Taiwan\u0027s most beautiful shoe store\u0027. Offering a huge variety of stylish footwear\u2014including loafers, Mary Janes, and ankle boots\u2014at accessible prices and excellent quality, the store even features Instagrammable photo spots for a fantastic shopping experience.", "name": "D+AF Shoes Ximen Concept Store", "transport": "Approx. 1 min walk from MRT Ximen Station Exit 1"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 55, Sec. 2, Wuchang St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Secret-recipe duck tongues, flavorful braised duck wings, crispy duck intestines. Lao Tian Lu is Ximending\u0027s most iconic decades-old braised food shop, a top souvenir choice for celebrities across Hong Kong and Taiwan as well as overseas tourists. Slow-cooked for hours using Chinese herbal medicines and a signature master stock, the braised dishes are deeply infused with savory, fragrant, and slightly numbing flavors. The signature duck tongue is delightfully springy and chewy, making it addictive to snack on.", "name": "Lao Tian Lu Braised Food", "transport": "About a 5-minute walk from MRT Ximen Station Exit 6"}, {"address": "No. 42, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Handmade walnut cookies, nostalgic chicken biscuits, traditional mung bean cakes. Established in 1956, Fong Da Coffee is a cultural landmark in Ximending. Beyond its classic iced drip coffee, the glass jars of traditional Taiwanese and Hong Kong-style pastries lining the storefront are coveted souvenirs for tourists. The signature walnut cookies are rich, crumbly, and melt-in-your-mouth, brimming with a deep nostalgic charm and local heritage.", "name": "Fong Da Coffee", "transport": "About a 1-minute walk from MRT Ximen Station Exit 1"}, {"address": "1F, No. 6, Hanzhong St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Jade Mandarin Duck Cake (Mung Bean \u0026 Red Bean Cake), handmade pineapple cakes, New York cheese bars. Kong Kee Bakery is a high-end pastry shop highly praised by travelers from Hong Kong and Southeast Asia. The most popular item, the \u0027Jade Mandarin Duck Cake,\u0027 features pure mung bean flour paired with red bean paste, delivering a delicate, cool, silky-smooth texture that is delightfully sweet without being cloying. The pineapple cakes use carefully selected local ingredients with a crispy crust and fragrant filling, making them an exquisite gift option.", "name": "Kong Kee Bakery", "transport": "About a 3-minute walk from MRT Ximen Station Exit 6"}, {"address": "No. 300, Kangding Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional winter melon meat pastry, fragrant salted egg yolk pineapple pastry (Phoenix Cake), handmade mochi pastry. Located in the historic Bangka district of Wanhua, Tai Ho Bakery was founded over 60 years ago, preserving the ultimate craftsmanship of traditional Taiwanese pastries. Their handmade winter melon pork pastry combines sweet and savory layers masterfully, while the Phoenix Cake blends salted egg yolk with fragrant pineapple filling. It is a favorite among local gourmets and visitors seeking authentic old-time flavors.", "name": "Tai Ho Bakery", "transport": "About a 3-minute walk from MRT Longshan Temple Station Exit 3"}, {"address": "No. 78, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Assorted Taiwanese braised snacks, nostalgic Taiwanese cream puffs, traditional pineapple cakes. Founded in 1950, Olympia Bakery was one of the earliest shops in Taiwan to combine a bakery with a Taiwanese braised food stand. The selection of braised snacks is immensely rich\u2014dried tofu, kelp, and chicken wings are savory and flavorful. Pairing them with a box of soft Taiwanese cream puffs stuffed with smooth custard is a wonderful way to experience Ximending\u0027s local food culture.", "name": "Olympia Bakery (Ximen Main Store)", "transport": "About a 4-minute walk from MRT Ximen Station Exit 1"}, {"address": "No. 25, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Super popular French Nougat, original pineapple cakes, rich cheese pineapple cakes. Sugar \u0026 Spice is an internationally renowned Taiwanese souvenir brand. Its \u0027French Nougat\u0027 has won top global snack awards, crafted with premium French butter and crunchy California almonds for a rich, milky flavor that never sticks to your teeth. With a chic and modern store design in Ximen, it is a top choice for domestic and international travelers seeking hot-selling desserts.", "name": "Sugar \u0026 Spice Ximen Branch", "transport": "About a 2-minute walk from MRT Ximen Station Exit 6"}, {"address": "No. 56, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.0 stars | Must-Buy List: Signature mung bean cake, secret-recipe braised duck tongue, nostalgic traditional pastry. Located on Chengdu Road, Shanghai Lao Tian Lu is another historic, famous store in Ximending known for both braised delicacies and Jiangzhe-style pastries. In addition to popular braised items like duck tongues and wings, their handmade mung bean cakes are delicate, aromatic, and melt-in-your-mouth, showcasing the authentic flavor profile of traditional Jiangzhe baked goods.", "name": "Shanghai Lao Tian Lu Bakery", "transport": "About a 3-minute walk from MRT Ximen Station Exit 1"}, {"address": "No. 243, Guangzhou St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional Pingxi cake (White Bean Paste Cake), signature curry meat pastry, festival handmade longevity peaches. Situated near Longshan Temple and Sanshui Street Market, Monga Sanshui Bakery is one of the most historically representative old-school pastry shops in Wanhua. The shop adheres to traditional techniques to craft various Taiwanese pastries; the Pingxi cake features a silky, subtly sweet white bean paste, while the curry meat pastry is rich and aromatic, fully embodying Wanhua\u0027s vibrant local folklore and heritage.", "name": "Monga Sanshui Bakery", "transport": "About a 3-minute walk from MRT Longshan Temple Station Exit 1"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 52, Emei St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Taiwanese designer womenswear, Eslite curated stationery gift sets, High-mountain Taiwanese tea gift boxes. Located in the heart of Ximending, this multi-concept store seamlessly combines reading, fashion, and lifestyle aesthetics. Featuring numerous local Taiwanese original designer brands and unique handcrafted counters, it is the top department store choice for tourists wanting to experience Taiwan\u0027s creative culture and pick up high-quality souvenirs.", "name": "Eslite Spectrum Ximen Store", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}, {"address": "No. 70, Xining S. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: Japan-exclusive Gundam models, limited-edition trendy sneakers, Taiwanese retro gachapon figures. The most iconic classic youth shopping landmark in Ximending, it has accompanied generations of Taipei locals. Packed with dozens of independent toy model shops, trendy shoe stores, and video game booths, it showcases a distinct local subculture with a charmingly nostalgic retro vibe.", "name": "Wan Nien Commercial Building", "transport": "MRT Ximen Station Exit 6, about a 5-minute walk"}, {"address": "No. 10, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Taiwanese handmade retro canvas bags, floral tile motif badges, original wooden lifestyle goods. Located inside the century-old historic Red House, this is Taipei\u0027s premier incubator for local creative brands. Bringing together over ten independent Taiwanese designer brands, it offers unique hand-painted creations, accessories, and home decor that you won\u0027t find anywhere else\u2014a favorite among international tourists.", "name": "The Red House Creative Boutique 16", "transport": "MRT Ximen Station Exit 1, about a 1-minute walk"}, {"address": "No. 77, Sec. 2, Wuchang St., Wanhua Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: American street style t-shirts, Taiwanese essential oil skincare, artist-collaboration designer art toys. Focusing on youth trends and subcultures, this department store gathers the latest domestic and international street brands, sneakers, and lifestyle goods. It frequently collaborates with local creators to host exhibitions, serving as a keen trendsetter for Ximending\u0027s pop culture.", "name": "Eslite Spectrum Wuchang Store", "transport": "MRT Ximen Station Exit 6, about a 7-minute walk"}, {"address": "No. 1, Guilin Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: 3:15pm Milk Tea bags, Snuggle Scent Sachet, Taiwanese I-Mei Pineapple Cakes. This 24-hour hypermarket located in Wanhua has become a must-visit shopping paradise for foreign tourists in Taipei. It features a well-stocked \"Taiwan Must-Buy Souvenir Zone\" with a comprehensive selection at affordable prices, highly recommended by both locals and travelers.", "name": "Carrefour Guilin Store", "transport": "MRT Ximen Station Exit 2, about an 8-minute walk"}, {"address": "No. 356, Sec. 1, Wenhua 3rd Rd., Linkou Dist., New Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Past-season Nike sneakers up to 80% off, clearance UNITED ARROWS Japanese apparel, BEAMS classic street fashion pieces. The largest and most recommended international outlet center in the Taipei suburbs. Easily accessible from Ximending via MRT connecting to the Airport MRT, it houses hundreds of international luxury and Japanese streetwear brands offering great discounts in a comfortable shopping environment.", "name": "Mitsui Outlet Park Linkou", "transport": "From MRT Ximen Station, ride to Taipei Main Station, transfer to Taoyuan Airport MRT to A9 Linkou Station, then walk for about 5 minutes"}, {"address": "No. 36, Xining S. Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 3.8 stars | Must-buy list: Custom-tailored Taiwanese Qipao dresses, affordable mobile accessories, traditional men\u0027s suits. A historic and distinctive commercial building in Ximending, famous across Taiwan for its internal \"Custom Dress Street.\" Bringing together veteran tailors with decades of experience and independent clothing shops, it\u0027s a hidden gem for those seeking unique traditional craftsmanship and affordable clothing.", "name": "Shih Tzu Lin Commercial Building", "transport": "MRT Ximen Station Exit 6, about a 6-minute walk"}, {"address": "No. 21, Chengdu Rd., Wanhua Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: NET minimalist organic cotton t-shirts, Taiwanese-style creative canvas bags, high-value lightweight windbreakers. The flagship store of Taiwan\u0027s iconic domestic casual fashion brand, offering a spacious multi-story shopping environment. Featuring clothes that are both stylish and practical at very reasonable prices, it\u0027s the top choice for locals and tourists looking for budget-friendly, high-quality clothing.", "name": "NET Ximending Store No. 1", "transport": "MRT Ximen Station Exit 6, about a 2-minute walk"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Ximending and Wanhua Bangka"}, "xinyi": {"categories": {"cat_1": {"items": [{"address": "B1, Shin Kong Mitsukoshi A11, No. 11, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-buy list: Miracle Moringa Oil, Pure Hydrating Serum, Green Marine Facial Oil. Greenvines is Taiwan\u0027s most representative Clean Beauty brand, advocating for \u0027subtractive skincare\u0027 and sustainable eco-friendly concepts. The counter in Xinyi A11 offers professional skin consultations in an aesthetically pleasing, nature-inspired setting. Tourists love purchasing their signature Miracle Moringa Oil\u2014lightweight yet deeply moisturizing, making it suitable for all climates and a prime example of Taiwan\u0027s local beauty R\u0026D prowess.", "name": "Greenvines (Shin Kong Mitsukoshi Xinyi Place A11)", "transport": "MRT Taipei City Hall Station Exit 3, approx. 5 mins walk"}, {"address": "2F, No. 88, Yanchang Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Camellia Citrus Hand Cream, Taiwan Incense Cedar Body Care Series, Lotus Leaf Hydrating Body Wash. Cha Tzu Tang is a pioneer in local Taiwanese camellia seed oil beauty products, combining local agriculture with artistic illustration design to infuse traditional camellia oil, citrus, and forest aromas into bath and skincare items. The Eslite Songyan store features beautiful packaging and a handcrafted testing area. Their \u0027Taiwan Incense Cedar\u0027 and \u0027Camellia Oil\u0027 hand creams absorb quickly and emit healing herbal scents, making them premium Taiwanese souvenirs perfect for gifting or personal use.", "name": "Cha Tzu Tang (Eslite Spectrum Songyan Store)", "transport": "MRT Sun Yat-sen Memorial Hall Station Exit 5, approx. 8 mins walk"}, {"address": "2F, No. 88, Yanchang Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Bamboo Ginger Warming Hand Cream, Ginger Body Massage Oil, Ginger Extract Lip Balm. Ginger 800 is a unique Taiwanese beauty and skincare brand featuring warming ginger extracts from locally grown high-mountain bamboo ginger. It incorporates the warming power of ginger into daily body care and home fragrances. The counter exudes a relaxing herbal ginger aroma; its hand creams and massage oils promote circulation and relieve fatigue, making them ideal to carry on the go or give to elders and close friends as a token of local Taiwanese warmth and traditional herbal wellness philosophy.", "name": "Ginger 800 (Eslite Spectrum Songyan Store)", "transport": "MRT Taipei City Hall Station Exit 1, approx. 10 mins walk"}, {"address": "B1, Taipei 101 Mall, No. 45, Shifu Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Mugwort Handmade Soap, Desmodium Shampoo, Mugwort Repair Cream. Founded in Taiwan\u0027s Yangmingshan, YUAN Soap is renowned for its herbal handmade soaps and stands as a pioneer in Taiwanese botanical skincare. The Taipei 101 flagship counter emanates a rich, natural aroma of mugwort and herbs, displaying a full range of chemical-free handmade soaps and bath products. Their signature \u0027Mugwort Soap\u0027 purifies skin and calms the mind\u2014a top favorite among Japanese, Korean, and Western tourists, making it a must-visit local flagship in Xinyi District.", "name": "YUAN Soap (Taipei 101 Store)", "transport": "Direct access from MRT Taipei 101/World Trade Center Station Exit 4"}, {"address": "1F, Breeze Songgao, No. 16, Songgao Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Mandelic Acid Renewal Serum 18%, Intensive Repairing Serum with Squalane, Hyalucomplex Hydrating Serum. DR.WU is Taiwan\u0027s premier dermo-cosmetic skincare brand, founded by a renowned dermatologist and immensely popular across Asia. The counter at Breeze Songgao offers a complete product lineup and hands-on testing. Star products like the \u0027Mandelic Acid 18%\u0027 and \u0027Squalane Serum\u0027 are gentle yet highly effective, offering high performance at prices much more accessible than international luxury brands. It is an essential stop for professional medical-grade skincare shopping in Xinyi.", "name": "DR.WU (Breeze Songgao Flagship Counter)", "transport": "MRT Taipei City Hall Station Exit 2, approx. 3 mins walk"}, {"address": "B1, ATT 4 FUN, No. 12, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: 1028 Oil Control Powder, Solone Eyebrow Pencil, MEKO Beauty Blender. POYA is Taiwan\u0027s largest homegrown lifestyle and beauty chain. Located in ATT 4 FUN, Xinyi District, this branch brings together the most complete range of affordable Taiwanese cosmetic brands (such as 1028, Solone, and heme) alongside popular international makeup. The spacious and bright shopping environment lets you try out and pick up all the latest Taiwanese beauty trends under one roof. Affordable and diverse, it\u0027s the best spot to experience authentic local beauty shopping fun.", "name": "POYA (Taipei Xinyi ATT Store)", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, approx. 5 mins walk"}, {"address": "B1, Breeze Nanshan, No. 17, Songzhi Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: MK Customer Facial Foam, ARGELAN Organic Lip Balm, Taiwan-exclusive Beauty Gift Sets. Located in Breeze Nanshan, this flagship store of the immensely popular Japanese drugstore Matsumoto Kiyoshi offers an extensive selection of exclusive skincare, beauty imports, and Taiwan/Japan limited items. Professional beauty consultants offer makeup advice, accompanied by hands-on trial zones. Alongside popular Japanese makeup synced in real-time, the store also curates several Taiwan-exclusive gift sets targeting international travelers in Xinyi, making it a hotspot for beauty lovers to restock and discover hidden gems.", "name": "Matsumoto Kiyoshi (Breeze Nanshan Flagship Store)", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, approx. 3 mins walk"}, {"address": "2F, Shin Kong Mitsukoshi A11, No. 11, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Bondi Wash Botanical Cleaners, Neal\u0027s Yard Remedies Essential Oils, Grown Alchemist Hand Cream. Founded in Taiwan, 10/10 HOPE is a multi-brand green beauty store specializing in curating high-quality organic, vegan, and natural skincare brands globally and locally. The Xinyi A11 counter creates a serene urban oasis ambiance, offering essential oils, botanical skincare, and room fragrances. With extremely high curation standards, it is highly favored by lifestyle enthusiasts and skincare experts seeking refinement, making it the top choice for health-conscious and sustainable beauty consumers.", "name": "10/10 HOPE (Shin Kong Mitsukoshi Xinyi Place A11 Store)", "transport": "MRT Taipei City Hall Station Exit 3, approx. 5 mins walk"}], "name": "Local Iconic Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "1F, No. 20, Songshou Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Cloud Ruched Low-Heel Shoes, Block Square-Toe Loafers, Vintage Mary Janes. Taiwan\u0027s ultra-popular local women\u0027s shoe brand, famous for its Korean-style fashion designs and exceptional comfort. The Xinyi Vieshow store features stunning, modern Korean-inspired decor and a spacious shoe-fitting area. Offering a complete size range from small to large, it is the top destination for young Taipei women and tourists looking for versatile footwear.", "name": "D+AF Shoes Xinyi Vieshow Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, about a 5-minute walk."}, {"address": "2F, No. 12, Songshou Rd., Xinyi Dist., Taipei City (ATT 4 FUN)", "feature": "\u2b50 4.5 stars | Must-buy list: Monte Chest Bag, Artsy Crossbody Bag, Milk Tea Color-Blocked Short Wallet. A well-known original Taiwanese accessory and bag brand, featuring high-quality bags with luxury design aesthetics at affordable prices. Its versatile styles range from cool street style to gentle sweetness. Highly cost-effective with exquisite metallic details, it is deeply loved by local university students and stylish young professionals.", "name": "ROBINMAY Xinyi ATT Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, about a 3-minute walk."}, {"address": "3F, No. 28, Songren Rd., Xinyi Dist., Taipei City (BELLAVITA)", "feature": "\u2b50 4.7 stars | Must-buy list: Taiwan Designer Collaboration Dresses, Hand-Dyed Botanical Fragrant Silk Scarves, Exclusive Select Leather Goods. Taiwan\u0027s premier luxury multi-brand fashion boutique, dedicated to promoting top local independent designer brands and emerging international works. Blending lush greenery with avant-garde fashion aesthetics, the store offers highly unique and handcrafted apparel and bags, making it an unmissable luxury shopping destination for discerning tastemakers.", "name": "onefifteen BELLAVITA Store", "transport": "MRT Taipei City Hall Station Exit 3, about a 2-minute walk."}, {"address": "3F, No. 12, Songshou Rd., Xinyi Dist., Taipei City (ATT 4 FUN)", "feature": "\u2b50 4.4 stars | Must-buy list: Multi-Compartment Genuine Leather Long Wallet, Lightweight Textured Square Bag, Multifunctional ID Holder. The brand name \u0027S\u0027AIME\u0027 comes from the French phrase for \u0027love yourself\u0027, representing a long-established Taiwanese original leather goods and bag brand. Renowned for high-quality genuine leather and highly practical multi-card slot designs, its products combine stylish aesthetics with functional storage. Affordable and durable, it is a favorite among Taipei office workers.", "name": "S\u0027AIME Xinyi ATT Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, about a 3-minute walk."}, {"address": "1F, No. 103, Sec. 4, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Miracle Slimming Pants, Cream-Tone Casual Sets, Collaboration Graphic Tees. An iconic online-native everyday women\u0027s wear brand in Taiwan, known for its minimal, wearable designs, soft milk-tea color palettes, and high-quality fabrics. The Xinyi flagship store integrates lifestyle aesthetics into an elegant shopping atmosphere. Its signature custom-cut pants are absolute dream everyday pieces to hunt for when visiting Taipei.", "name": "PAZZO Xinyi Concept Store", "transport": "MRT Xinyi Anhe Station Exit 2, about a 1-minute walk."}, {"address": "3F, No. 11, Songshou Rd., Xinyi Dist., Taipei City (Shin Kong Mitsukoshi Xinyi Place A11)", "feature": "\u2b50 4.5 stars | Must-buy list: NEW HEAT Series Crossbody Bag, LUX Bifold Short Wallet, Waterproof Nylon Backpack. A classic Taiwanese bag brand with decades of history, famous for its highly recognizable embroidered figure logo and durable, high-density nylon fabric. Featuring multi-pocket storage and excellent water-repellent qualities, it is a local staple offering understated style and supreme practicality.", "name": "PORTER INTERNATIONAL Shin Kong Mitsukoshi A11 Store", "transport": "MRT Taipei City Hall Station Exit 3, about a 5-minute walk."}, {"address": "3F, No. 12, Songshou Rd., Xinyi Dist., Taipei City (ATT 4 FUN)", "feature": "\u2b50 4.2 stars | Must-buy list: Japanese-Style Loose Cotton-Linen Shirt, High-Waist Versatile Straight-Leg Pants, Artsy Canvas Tote Bag. A homegrown Taiwanese casual wear brand with years of heritage, featuring a comfortable, natural, and fresh Japanese aesthetic with great styling freedom. The store updates styles quickly with skin-friendly, comfy fabrics, offering stress-free shopping for girls who love minimalist textures and artsy layered looks.", "name": "QUEEN SHOP Xinyi ATT Store", "transport": "MRT Taipei 101/World Trade Center Station Exit 4, about a 3-minute walk."}, {"address": "No. 55, Sec. 5, Zhongxiao E. Rd., Xinyi Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-buy list: High-CP Value Business Shirts, Stretch Slim-Fit Jeans, UV-Protection Lightweight Windbreaker. Taiwan\u0027s most iconic domestic value clothing brand, deeply trusted for decades for its affordable prices and good quality. The store offers a comprehensive range of men\u0027s and women\u0027s wear, shoes, and accessories\u2014from everyday casual and athletic wear to formal office attire\u2014making it a must-visit for locals seeking high-value basics.", "name": "NET Xinyi Store 2", "transport": "MRT Taipei City Hall Station Exit 4, about a 1-minute walk."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B1, No. 45, Shifu Rd., Xinyi District, Taipei City (Taipei 101 Shopping Center)", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Pineapple Cakes, Apple Cakes, Banana Waffle Cookies. An iconic home-grown Taiwanese brand originating from Fengshan Temple in Nantou, renowned for its pure native pineapple filling and buttery pastry crust. The Taipei 101 counter offers elegant souvenir packaging, making its sweet-and-sour pineapple cakes a top-requested local Taiwanese treat for international tourists.", "name": "SunnyHills Taipei 101 Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, directly connected to Taipei 101 B1"}, {"address": "B2, No. 17, Songzhi Rd., Xinyi District, Taipei City (Breeze Nanshan)", "feature": "\u2b50 4.3 stars | Must-Buy List: Ultra-thin Almond Crispy Pork Paper, Extra-thick Honey Pork Jerky, Signature Thai Spicy Pork Strips. A famous decades-old jerky brand in Taipei, famous across Taiwan for its crispy pork paper that is just 0.01 cm thin and extraordinarily crunchy. Its extra-thick honey pork jerky reaches 1 cm in thickness, offering a juicy and satisfying chew\u2014making it a perfect choice for traditional addictive snacks in the Xinyi shopping district.", "name": "Kuai Che Dried Meat Breeze Nanshan Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, about a 3-minute walk"}, {"address": "B1, No. 45, Shifu Rd., Xinyi District, Taipei City (Taipei 101 Shopping Center)", "feature": "\u2b50 4.5 stars | Must-Buy List: French Nougat, Cheese Pineapple Cakes, Scallion Nougat Crackers. An award-winning local Taiwanese bakery brand recognized globally for its confections. Its signature French Nougat contains no artificial hardening agents or preservatives, crafted with imported French butter and California almonds for a delightfully chewy, non-sticky texture and rich milky aroma. An essential sweet souvenir for travelers.", "name": "SUGAR \u0026 SPICE Taipei 101 Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, directly connected to Taipei 101 B1"}, {"address": "B2, No. 17, Songzhi Rd., Xinyi District, Taipei City (Breeze Nanshan)", "feature": "\u2b50 4.3 stars | Must-Buy List: Peanut-Filled Egg Rolls, Pork Floss-Filled Egg Rolls, Dark Chocolate-Filled Egg Rolls. A flagship artisanal Taiwanese brand famous for being Taiwan\u0027s only handmade egg rolls with rich, solid fillings. Featuring premium local Beigang peanut butter and savory pork floss wrapped in a crispy outer shell, these burst with flavor. Packaged in a chic, hip blue design, they are immensely popular among young travelers.", "name": "HiWalk Breeze Nanshan Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, about a 3-minute walk"}, {"address": "B1, No. 45, Shifu Rd., Xinyi District, Taipei City (Taipei 101 Shopping Center)", "feature": "\u2b50 4.2 stars | Must-Buy List: Taro Pastries, Crunchy Taro Strips, Crystal Sand Cakes. Founded by Master Tsung, the pioneer of Taiwan\u0027s taro pastry, this craft bakery selects premium betel nut taro from Dajia, Taichung. The pastry layers bloom beautifully like a rose, encasing a silky, rich, perfectly balanced taro paste. The crispy taro strips make an addictive local snack that taro lovers simply cannot miss.", "name": "O-Nong Taipei 101 Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, directly connected to Taipei 101 B1"}, {"address": "B1, No. 45, Shifu Rd., Xinyi District, Taipei City (Taipei 101 Shopping Center)", "feature": "\u2b50 4.4 stars | Must-Buy List: OhBear Ice Bean Mung Pastries, Golden Salted Egg Yolk Pineapple Cakes, Jing Wan Xiang Pastries. A century-old heritage bakery brand in Taiwan blending traditional pastry arts with modern design. Created specifically for visitors, the cute OhBear-shaped mung bean pastry combines adorable looks with exquisite taste, featuring melt-in-your-mouth mung bean paste that showcases Taiwan\u0027s rich pastry heritage and creative vitality.", "name": "Kuo Yuan Ye Taipei 101 Store", "transport": "MRT Taipei 101/World Trade Center Station, Exit 4, directly connected to Taipei 101 B1"}, {"address": "B2, No. 19, Songgao Rd., Xinyi District, Taipei City (Shin Kong Mitsukoshi Xinyi Place A4)", "feature": "\u2b50 4.6 stars | Must-Buy List: Signature Mung Bean Pastries, Pineapple Cakes, Salted Yolk Pineapple Cakes. Established in 1889, this century-old handmade pastry brand adheres to low sugar, low fat, and zero preservatives. The mung bean pastries are crafted through seven meticulous steps to achieve a delicate, soft texture, while the golden pineapple cakes feature Guanmiao pineapples from Tainan for a perfectly balanced sweet-and-sour flavor. Elegant red-and-gold gift boxes convey a touch of traditional Taiwanese prestige.", "name": "Jiu Zhen Nan Shin Kong Mitsukoshi A4 Store", "transport": "MRT Taipei City Hall Station, Exit 3, about a 3-minute walk"}, {"address": "No. 16, Lane 15, Sec. 5, Zhongxiao E. Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Gokunama Butter Milk Shokupan, Gokumi Natural Shokupan, Jewel Jams (Pistachio/Strawberry). Tucked away in an alley in Xinyi District, this premium raw Shokupan bakery originates from Japan but frequently offers Taiwan-exclusive souvenir flavors and exquisite jam sets at its Taipei flagship store. The bread is luxuriously moist, soft, and aromatically refined, making it paired with their signature jewel jam gift boxes a highly sought-after luxury bakery gift in Xinyi.", "name": "SAKImoto Bakery Taipei Flagship Store", "transport": "MRT Taipei City Hall Station, Exit 1, about a 2-minute walk"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 45, Shifu Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Taipei 101 shaped souvenir gift boxes, TWG Tea 101 exclusive co-branded tea bags, SunnyHills pineapple cakes. As Taipei\u0027s most dazzling landmark building, this mall features multiple floors of top international luxury brands and dedicated Taiwanese local souvenir areas. The food court and souvenir section on B1 bring together top specialties from across Taiwan, while the 5th floor features a Taiwanese cultural, creative, and handcrafted crafts exhibition area. It is a must-visit sanctuary for international tourists to shop for flagship luxury goods and authentic local souvenirs all in one place.", "name": "Taipei 101 Shopping Center", "transport": "Direct access from MRT Taipei 101/World Trade Center Station, Exit 4"}, {"address": "No. 88, Yanchang Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Grass Hill Jewelry handmade silver accessories, Greenvines eco-friendly skincare, quality stationery from independent Taiwanese brands. As Taipei\u0027s most iconic local cultural and creative department store, it gathers hundreds of local Taiwanese designer brands and artisan craft workshops. Visitors can experience hands-on metalworking, glassblowing, and leathercrafts, as well as purchase unique locally designed apparel and lifestyle goods, perfectly showcasing Taiwan\u0027s rich cultural and creative heritage.", "name": "Eslite Spectrum Songyan", "transport": "About an 8-minute walk from MRT Sun Yat-sen Memorial Hall Station, Exit 5"}, {"address": "No. 58, Songren Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Chun Shui Tang boba milk tea gift boxes, Taiwanese local cultural \u0026 creative goods, souvenirs from famous pineapple cake bakeries. This new-style department store blends technology with traditional Taiwanese culture. The 4th floor specifically recreates a nostalgic Dadaocheng old street scene under red-brick arcades, featuring classic local culinary brands and iconic local labels. Visitors can shop for curated Taiwanese apparel and lifestyle products while immersing themselves in a rich, nostalgic Taiwanese retro vibe.", "name": "Far Eastern Department Store Xinyi A13", "transport": "About a 5-minute walk from MRT Taipei City Hall Station, Exit 3"}, {"address": "B1, No. 45, Shifu Rd., Xinyi District, Taipei City (Inside Taipei 101 Mall)", "feature": "\u2b50 4.7 stars | Must-Buy List: Mugwort handmade herbal soap, Bitter Tea \u0026 Citrus shampoo, pet grooming herbal soap. YUAN is Taiwan\u0027s most iconic homegrown herbal skincare brand, committed to handcrafted products made with organic farm plants from Yangmingshan and local Taiwanese herbs. Featuring soothing and calming natural herbal scents, these products radiate the natural energy of Taiwanese land, making them a top-choice local skincare souvenir for international travelers.", "name": "YUAN Soap Taipei 101 Counter", "transport": "Direct access from MRT Taipei 101/World Trade Center Station, Exit 4"}, {"address": "B1, No. 11, Songshou Rd., Xinyi District, Taipei City (Inside Shin Kong Mitsukoshi A11)", "feature": "\u2b50 4.8 stars | Must-Buy List: Miracle Moringa Oil, Pure Hydrating Serum, Scalp Clarifying Shampoo. Greenvines is a well-known Taiwanese B Corp clean beauty brand advocating minimal skincare routines and eco-sustainability. Its counter features a clean, natural design where knowledgeable staff offer professional skin consultations. With pure yet highly effective ingredients, its products are beloved by health-conscious women and eco-minded international travelers alike.", "name": "Greenvines Shin Kong Mitsukoshi Xinyi A11 Store", "transport": "About a 5-minute walk from MRT Taipei City Hall Station, Exit 3"}, {"address": "No. 205, Minshan St., Neihu District, Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: ROOTS casual hoodies, discounted Nike running shoes, Samsonite lightweight suitcases. As the largest and longest-running urban fashion outlet in Taipei City, it is just a short drive from the Xinyi Shopping District. Housing hundreds of famous international and local chain brands, it offers city-wide low discounts starting from 90% off all year round. It is an ideal haven for locals and savvy tourists seeking high-quality designer apparel and sportswear on a budget.", "name": "LEECO Outlet Neihu Store", "transport": "Take Bus 552 or Blue 26 from MRT Taipei City Hall Station to \u0027Xinhu 3rd Rd. Intersection\u0027 Stop, then walk for about 3 minutes"}, {"address": "No. 181, Chunde Rd., Zhongli District, Taoyuan City (Top recommended Outlet in Northern Taiwan)", "feature": "\u2b50 4.5 stars | Must-Buy List: COACH classic handbags, Michael Kors crossbody bags, limited-time discounted Adidas sneakers. This is Northern Taiwan\u0027s most popular American-style open-air outlet village, quickly accessible from Taipei via High Speed Rail (THSR) or Taoyuan Airport MRT. Featuring over 280 luxury fashion brands and popular labels, it offers off-season bargain discounts year-round. With beautifully landscaped grounds that feel like an overseas outlet village, it is an absolute must-visit destination for luxury bargain shopping when visiting Taipei.", "name": "Gloria Outlets", "transport": "Take THSR to Taoyuan Station or Taoyuan Airport MRT to A18 Taoyuan HSR Station, about a 1-minute walk via the connecting walkway"}, {"address": "No. 11, Songshou Rd., Xinyi District, Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Taiwanese craft beer sampler sets, local designer collaboration T-shirts, Majisun selected Taiwanese sauces. As a trendy, youthful hallmark department store in the Xinyi district, A11 highlights the fusion of local youth creativity and pop culture. It houses numerous original local streetwear counters and curated lifestyle select shops, while the B1 food court features many quality homegrown Taiwanese brands, showcasing energetic local shopping charm.", "name": "Shin Kong Mitsukoshi Taipei Xinyi Place A11", "transport": "About a 5-minute walk from MRT Taipei City Hall Station, Exit 3"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Xinyi Shopping District and Taipei 101"}, "yongkang": {"categories": {"cat_1": {"items": [{"address": "No. 11-1, Yongkang St., Daan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Camellia Oil Hand Cream, Taiwan Incense Cedar Repairing Shampoo, Pear Valley Body Wash. Cha Tzu Tang is a local Taiwanese botanical skincare brand deeply rooted in camellia seed oil culture. The Yongkang Concept Store creates a sophisticated space with warm wooden tones and greenery, conveying the gentle aesthetics of Taiwan\u0027s land. Tourists especially love its bath and body products infused with Taiwanese high-mountain and forest aromas, offering a natural sense of relaxation upon application. The modern, hipster-chic packaging makes it a top choice for iconic local gifts.", "name": "Cha Tzu Tang Yongkang Shop", "transport": "MRT Dongmen Station Exit 5, about a 3-minute walk"}, {"address": "No. 8, Yongkang St., Daan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Mugwort Handmade Soap, Kuding Tea Shampoo, Body Wash series. Founded on a herbal farm in Yangmingshan, Taiwan, Yuan Soap is the pioneer of Taiwanese handmade herbal soaps. The Yongkang store exudes a rich, natural herbal fragrance. The brand insists on cold-process handmade soaps infused with local herbal formulas. The Mugwort Soap effectively soothes the skin and is immensely popular among Japanese and Korean tourists.", "name": "Yuan Soap Yongkang Shop", "transport": "MRT Dongmen Station Exit 5, about a 2-minute walk"}, {"address": "No. 28, Yongkang St., Daan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Ginger Hand Cream, Bamboo Ginger Warm Body Massage Oil, Ginger Lily Soothing Body Wash. A vegan skincare brand centered around local Taiwanese aged ginger, this shop is filled with warm, soothing aromas of ginger and botanicals. Blending the warming essence of ginger with essential oils, their products are perfect for soothing skin and warming hands and feet in autumn and winter. Exquisitely packaged and uniquely Taiwanese, it\u0027s a local skincare brand you shouldn\u0027t miss when visiting Yongkang Street.", "name": "Ginger 80 Yongkang Store", "transport": "MRT Dongmen Station Exit 5, about a 5-minute walk"}, {"address": "No. 341, Sec. 2, Fuxing S. Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Miracle Moringa Oil, Pure Hydrating Serum, Scalp Clarifying Shampoo. Greenvines is a well-known Taiwanese minimalist skincare brand emphasizing clean formulas, plastic reduction, and natural sustainability. The \u0027Sprout\u0027 concept store in Daan District combines a green sustainable lifestyle experience with specially blended organic sprout drinks. Staff provide professional, non-pushy skin consultations, and their Moringa Oil is praised by Japanese and Korean tourists as a holy grail moisturizer.", "name": "Greenvines Concept Store", "transport": "MRT Technology Building Station Exit, about a 5-minute walk"}, {"address": "No. 230, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: 1028 Extend Curl Waterproof Mascara, Timeless Truth Mask (TTM) Bee Venom Mask, Solone Beauty Sponge. POYA is one of Taiwan\u0027s largest local beauty and lifestyle department stores. The Dongmen branch is spacious and brightly lit, offering the most comprehensive collection of domestic makeup and skincare brands. Tourists can hunt for treasures at very affordable prices, grabbing all the trendiest budget-friendly Taiwanese cosmetics and exclusive mask sets in one stop.", "name": "POYA Dongmen Branch", "transport": "MRT Dongmen Station Exit 5, about a 1-minute walk"}, {"address": "No. 1, Ln. 198, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy list: DR.WU Daily Renewal Serum with Mandelic Acid, My Beauty Diary Bird\u0027s Nest Mask, Neogence Hyaluronic Acid Hydrating Essence. As Taiwan\u0027s most iconic local drugstore chain, the Yongkang branch features a dedicated zone for popular Taiwanese cosmeceuticals. It offers consultations with professional pharmacists and cosmeticians, along with frequent tax refund and discount promotions for foreign travelers, making it a must-visit spot to stock up on high value-for-money dermatological skincare products.", "name": "COSMED Yongkang Branch", "transport": "MRT Dongmen Station Exit 5, about a 1-minute walk"}, {"address": "No. 180, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-buy list: For Beloved One Melasleep Brightening Bio-Cellulose Mask, Sunpre High Protection Aqua Gel, 1028 Oil Control Primer. Located at the bustling entrance of the Yongkang Commercial District, this prime drugstore spot features 24-hour or extended operating hours for convenient shopping. It carries a rich selection of Taiwanese skincare and sunscreen brand counters, making it the first stop for many international tourists looking to buy high-quality Taiwanese sheet masks and beauty supplies.", "name": "Watsons Yongkang Branch", "transport": "MRT Dongmen Station Exit 5, right outside the station"}, {"address": "No. 184, Sec. 2, Xinyi Rd., Daan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Kuang Yuan Liang Cucumber Water Spray, Biomedical-grade Centella Repairing Mask, Taiwanese High-Purity Fish Oil Supplements. Great Tree Pharmacy is a major professional pharmacy chain in Taiwan. Beyond prescription medications and health supplements, the Dongmen branch carefully curates traditional Made-In-Taiwan (MIT) natural skincare products (such as Kuang Yuan Liang Luffa Water) and premium dermatological repair products, renowned for high quality and trust.", "name": "Great Tree Pharmacy Dongmen Branch", "transport": "MRT Dongmen Station Exit 5, about a 1-minute walk"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 60, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buys: Organic cotton graphic T-shirts, washed canvas tote bags, handcrafted fabric pencil cases. MOGU is one of Taiwan\u0027s iconic original lifestyle design brands, focusing on natural materials and eco-friendly dyes. The Yongkang store offers a warm, cozy everyday vibe. Its hugely popular washed canvas bags are rustic, durable, and adorned with unique original motifs\u2014making them a perfect choice for embracing Taiwanese hipster chic.", "name": "MOGU Yongkang Store", "transport": "MRT Dongmen Station Exit 5, about an 8-minute walk"}, {"address": "No. 6, Lane 31, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buys: Crested Myna print tote bags, embossed glass pattern laptop sleeves, retro print tissue covers. inBlooom is a renowned local brand known for its printed fabric designs inspired by native Taiwanese animals and traditional architectural patterns. The Yongkang store gathers a variety of textile goods, shoes, and bag accessories full of Taiwanese aesthetic. Vibrant and steeped in cultural stories, these items make wonderful, uniquely Taiwanese souvenirs.", "name": "inBlooom Yongkang Store", "transport": "MRT Dongmen Station Exit 5, about a 5-minute walk"}, {"address": "No. 28, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buys: Comfy cotton-linen tailored dresses, handmade genuine leather flats, lightweight everyday sun-protection jackets. XUXUWEAR is an independent Taiwanese womenswear brand catering to modern women, emphasizing skin-friendly natural fabrics and elegant cuts tailored to Asian body types. The store is filled with lush greenery and natural light. Its clothes and footwear blend aesthetic elegance with supreme comfort, making it a favorite among local women who value quality and comfort.", "name": "XUXUWEAR Yongkang Store", "transport": "MRT Dongmen Station Exit 5, about a 5-minute walk"}, {"address": "No. 20, Lane 23, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-buys: Structured trench coats, asymmetric midi skirts, soft skin-friendly wool knits. SUMI is a local womenswear brand that insists on 100% independent design and manufacturing in Taiwan. Featuring sleek silhouettes, crisp line aesthetics, and a poetic vibe, the Yongkang Concept Store offers an elegant, tranquil shopping environment. Its designer garments are distinct, meticulously sourced, and hard to duplicate\u2014perfect for women who love a unique, refined style.", "name": "SUMI Said Yongkang Concept Store", "transport": "MRT Dongmen Station Exit 5, about a 4-minute walk"}, {"address": "No. 18, Lane 161, Sec. 1, Dunhua S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buys: COP water-repellent travel pouches, elastic-waist wide-leg trousers, heavy-weight oversized cotton T-shirts. plain-me is an immensely popular Taiwanese Select Shop and house brand built around the core philosophy of \u0027Mix and match for a beautiful day.\u0027 The spacious, well-lit Dunnan store carries their exclusive COP functional bags and flattering apparel alongside select international trendy brands\u2014a must-visit hub for fans of streetwear and Japanese minimal style.", "name": "plain-me Dunnan Store", "transport": "MRT Zhongxiao Dunhua Station Exit 2, about a 3-minute walk"}, {"address": "No. 61, Lane 161, Sec. 1, Dunhua S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buys: Retro square-toe loafers, minimalist chunky ankle boots, strappy Korean-style sandals. D+AF is a hit Taiwanese women\u0027s footwear brand whose Dunnan flagship boasts a gorgeous, resort-inspired aesthetic. Offering a wide range of sizes, affordable prices, and versatile stylish footwear\u2014from essential work loafers to silhouette-flattering boots\u2014it\u0027s a high-CP-value shopping paradise for women\u0027s shoes in Da\u0027an.", "name": "D+AF Dunnan Flagship Store", "transport": "MRT Zhongxiao Dunhua Station Exit 2, about a 4-minute walk"}, {"address": "No. 19, Alley 35, Lane 181, Sec. 4, Zhongxiao E. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buys: IP collaboration Mary Janes, French-style leather crossbody bags, lightweight chunky mules. Grace Gift is a leading Taiwanese brand for trendy footwear and bags. Its Dunnan concept store frequently launches collaboration projects with popular IPs and fashion influencers. Blending sweet aesthetics with runway trends, picture-perfect decor, and accessible pricing, it is a go-to spot for young women looking for chic shoes and bags.", "name": "Grace Gift Dunnan Concept Store", "transport": "MRT Zhongxiao Dunhua Station Exit 1, about a 3-minute walk"}, {"address": "No. 11, Lane 4, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buys: Sou layer backpack, Kazematou feather leather shoulder bag, gradient full-leather short wallet. Motherhouse has been a fixture in the Yongkang shopping district for years, operating under the philosophy \u0027Making world-class brands in developing countries.\u0027 Crafted by local artisans using high-quality natural leather, their Yongkang store offers a warm ambiance. Their leather goods showcase organic curves and rich hues, combining light practicality with elegant aesthetics, making them a favorite among creatives and business professionals alike.", "name": "Motherhouse Yongkang Store", "transport": "MRT Dongmen Station Exit 5, about a 2-minute walk"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 21, Sec. 2, Jinshan S. Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Scallion Nougat Crackers, Classic Original Nougat Crackers. A legendary souvenir shop in the Yongkang Commercial District famous for its long queues. Known for its crispy, savory scallion soda crackers sandwiched with a soft, chewy, non-stick nougat filling rich in milky aroma. The perfect balance of sweet and savory makes it a top-tier local snack requested by Japanese and Korean tourists visiting Taiwan.", "name": "Mimi Crackers", "transport": "Approx. 3-minute walk from Exit 3 of MRT Dongmen Station"}, {"address": "No. 199, Sec. 2, Xinyi Rd., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Bite-Sized Coffee Nougat Crackers, Bite-Sized Pineapple Cakes, Brown Sugar \u0026 Black Sesame Nougat Crackers. Made a huge splash in Japanese and Korean tourist circles with its exclusive, innovative \u0027Bite-Sized Coffee Nougat Crackers.\u0027 The delicate mini size allows for graceful snacking, blending rich coffee aromas with milky filling and slightly salty crackers. Featuring Taiwan cultural and creative illustration style packaging, it is an excellent snack for both gifting and personal enjoyment.", "name": "Saint Peter (Yongkang Store)", "transport": "Approx. 1-minute walk from Exit 8 of MRT Dongmen Station"}, {"address": "No. 12-1, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Macadamia Nut Tarts, Toffee, Golden Diamond Pineapple Cakes. A premium Taiwanese healthy nut snack brand committed to using no preservatives or artificial flavors. Strictly selects French Isigny butter and high-quality macadamia nuts. Their macadamia nut tarts feature a buttery, crispy crust packed with generous ingredients and moderate sweetness, representing Da\u0027an District\u0027s exquisite souvenir brands combining high quality with healthy deliciousness.", "name": "Shangxin Zhuanyu (Yongkang Store)", "transport": "Approx. 4-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 188-1, Chaozhou St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Original Pineapple Cakes, Cheese Biscotti, Green Tea Chocolate Cookies. An independent artisan bakery hidden in the alleys of Chaozhou Street, advocating all-natural, additive-free organic ingredients and premium butter. Their pineapple cakes are made with local Taiwanese pineapples, featuring a thin, buttery crust and a filling with a natural, delightfully tangy fruit aroma\u2014showcasing the ultimate warm, handmade touch of local Taiwanese independent shops.", "name": "Handmade Tianpin Bakery", "transport": "Approx. 8-minute walk from Exit 5 of MRT Guting Station or a 10-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 84, Jinhua St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Gold Leaf Golden Diamond Pineapple Cakes, Gold Leaf Honey Cake \u0027Jin Dian\u0027, Amber Kohakutou Candy. Located in a cultural space restored from an old Japanese-style building, this shop infuses traditional pastries with modern geometric aesthetics and luxurious gold leaf decorations. The gold leaf pineapple cakes offer a striking visual effect with a perfectly balanced sweet-and-sour taste, while the amber candy glimmers like precious gems\u2014making these gift sets both buzzworthy and exquisitely luxurious.", "name": "Jin Jin Ding (Yongkang Flagship Store)", "transport": "Approx. 8-minute walk from Exit 3 of MRT Dongmen Station"}, {"address": "No. 11-1, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Camellia Oil Hand Cream, Camellia Seed Gentle Shampoo, Taiwanese Camellia Oil. A premier Taiwanese brand specializing in high-grade camellia oil and botanical skincare, dedicated to restoring local camellia tree contract farms. The product packaging harmoniously blends traditional Taiwanese print art with modern design. Its top-tier edible camellia oil and natural bath and body products are highly favored by international travelers, serving as Taiwan\u0027s most representative non-food elegant gift.", "name": "Cha Tzu Tang (Yongkang Concept Store)", "transport": "Approx. 3-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 9, Lane 6, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Dong Ding Oolong Tea, Alishan High Mountain Tea Gift Set, Tea-Flavored Mini Shortbread. A deep-rooted brand specializing in premium Taiwanese high-mountain teas, offering an exceptionally professional and refined tea-tasting cultural experience in-store. Perfectly combining traditional Taiwanese tea-making craft with elegant modern packaging, its lingering high-mountain oolong tea is the ideal pairing for any tea snack gift.", "name": "Yoshan Tea (Yongkang Store)", "transport": "Approx. 2-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 9, Yongkang St., Da\u0027an Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Oh Bear Cookies, Ice Bean Paste Pastry, 100% Pure Pineapple Cakes. A cultural-creative concept store set up in the Yongkang district by a century-old Taiwanese bakery brand. Blending traditional Chinese pastries with modern aesthetics, their eye-catching, cute Oh Bear shaped cookies created in collaboration with the Taiwan Tourism Administration make this a classic Taiwanese gift brand that bridges rich heritage with innovative energy.", "name": "Kuo Yuan Ye (Yongkang Store)", "transport": "Approx. 3-minute walk from Exit 5 of MRT Dongmen Station"}], "name": "Must-Buy Special Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 45, Sec. 4, Zhongxiao E. Rd., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Amo Cake Gift Boxes, Chia Te Pineapple Cake Pop-up Sets, Limited-Edition Japanese Cosmetics. As one of the most historic and iconic department stores in Taipei\u0027s East District, its B1 food court and souvenir area are top choices for tourists on a shopping spree. Features a comprehensive selection of international luxury labels and Japanese cosmetics.", "name": "Far Eastern SOGO Department Store Zhongxiao Branch", "transport": "Direct underground connection from Exit 4 of MRT Zhongxiao Fuxing Station"}, {"address": "No. 39, Sec. 1, Fuxing S. Rd., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Imported fruits at Breeze Super, luxury brand fragrances, premium French breads at Maison Kayser. A prime representative of high-end luxury shopping in Da\u0027an District, featuring a top-tier gourmet supermarket and international flagship boutiques in a spacious, stylish environment.", "name": "Breeze Center", "transport": "About an 8-minute walk from Exit 5 of MRT Zhongxiao Fuxing Station"}, {"address": "No. 16, Siyuan St., Zhongzheng Dist., Taipei City", "feature": "\u2b50 4.1 Stars | Must-Buy List: Discounted Nike sneakers, The North Face technical windbreakers, Roots casual wear. A rare urban outlet mall located right in Taipei City near the Gongguan commercial district. It hosts popular activewear and casual brands offering great deals with discounts starting from 70% off year-round.", "name": "LEECO Outlet Gongguan", "transport": "About a 7-minute walk from Exit 4 of MRT Gongguan Station"}, {"address": "No. 6, Lane 31, Yongkang St., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.8 Stars | Must-Buy List: Miracle Moringa Oil, Scalp Clarifying Shampoo, Pure Hydrating Serum. A leading Taiwanese clean skincare brand championing minimalist skincare and eco-friendly principles. The Yongkang store features a simple, natural aesthetic that attracts visitors looking for healthy, high-quality care products.", "name": "Greenvines Yongkang Concept Store", "transport": "About a 5-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 4, Lane 14, Yongkang St., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Organic cotton canvas tote bags, natural botanical dye T-shirts, original hand-drawn notebooks. An independent Taiwanese lifestyle design brand committed to natural organic materials and local dyeing techniques. Warm, artistic, and minimalist, it\u0027s a must-visit spot to experience local Taipei creativity.", "name": "Mogu Yongkang Store", "transport": "About a 4-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 28, Yongkang St., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Bamboo Ginger Hand Cream, Ginger Warming Massage Oil, Ginger Soothing Body Wash. A homegrown Taiwanese fragrance and body care brand that creatively blends local bamboo ginger extract with essential oils, crafting unique Oriental-style pampering products perfect for gifts.", "name": "Ginger Garden Yongkang Store", "transport": "About a 5-minute walk from Exit 5 of MRT Dongmen Station"}, {"address": "No. 56, Lane 161, Sec. 1, Dunhua S. Rd., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Danish designer mugs, artisanal scented candles, curated herbal tea gift sets. A charming independent home goods select store in Da\u0027an District, bringing together exquisite tableware, home decor, and lifestyle goods from around the world and Taiwan.", "name": "Marais Select Shop Dunnan", "transport": "About a 3-minute walk from Exit 2 of MRT Zhongxiao Dunhua Station"}, {"address": "No. 200, Sec. 4, Zhongxiao E. Rd., Da\u2019an Dist., Taipei City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Taipei-exclusive UTs at Uniqlo Global Flagship, GU trendy apparel, Daiso lifestyle goods. A major department store in the heart of Zhongxiao East Road shopping district. Focused on affordable fashion and lifestyle brands, it\u2019s a popular spot for young shoppers looking to catch the latest trends all in one place.", "name": "Ming Yao Department Store", "transport": "Directly accessible from Exit 3 of MRT Zhongxiao Dunhua Station"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dongmen, Yongkang Street and Da\u0027an"}, "zhongshan": {"categories": {"cat_1": {"items": [{"address": "1F, No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City (Eslite Spectrum Nanxi 1F)", "feature": "\u2b50 4.6 stars | Must-buy list: Lotus Leaf Body Wash, Taiwan Incense Cedar Repairing Shampoo, Camellia Oil Hand Cream. Cha Tzu Tang is a premier local Taiwanese botanical skincare brand rooted in contract farming of local camellia trees. The counter design is infused with Taiwanese earthy elements and cultural texture. Products feature Taiwanese botanical extracts and camellia oil with calming, healing woody scents, making
