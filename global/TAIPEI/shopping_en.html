e Bus S9 to \u0027Zhuzihu Station\u0027, then walk approx. 3 mins"}, {"address": "No. 220, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy items: Beitou Sulfur Bath Powder, Deep Cleansing Spring Mud Mask, Herbal Hand Cream. Located near MRT Xinbeitou Station, this shop specializes in skincare products derived from Beitou\u2019s famous hot springs. Their thermal mud mask, rich in essential trace minerals, offers exceptional skin repair and deep cleansing benefits, making it a top choice for visiting Japanese and Korean travelers.", "name": "Grand New Beitou Hot Spring Gift Shop", "transport": "Approx. 3 mins walk from MRT Xinbeitou Station"}, {"address": "No. 248, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy items: White Sulfur Repair Serum, Natural Tanghua Mineral Scrub, Soothing Botanical Body Lotion. Situated on picturesque Guangming Road, Water House developed a high-end SPA skincare line formulated with local white sulfur spring extract. Celebrated for nourishing formulas that harness spring minerals, these products leave skin instantly hydrated, smooth, and supple.", "name": "Water House Beitou - Tanghua Beauty Boutique", "transport": "Approx. 8 mins walk from MRT Xinbeitou Station"}, {"address": "No. 228, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy items: DR.WU Mandelik Intensive Renewal Serum, My Beauty Diary Taiwan Limited Edition Masks, For Beloved One Brightening Bio-Cellulose Mask. Located right near the Xinbeitou Station exit, this store features dedicated sections for popular Taiwanese cosmeceuticals and best-selling sheet masks. Catering to tourists, it also stocks soothing foot patches and local spring-infused skincare, offering a convenient and well-stocked pharmacy shopping experience.", "name": "COSMED New Beitou Branch", "transport": "Opposite MRT Xinbeitou Station exit"}, {"address": "No. 10, Zhongzheng St., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy items: Dr. Morita Hyaluronic Acid Complex Moisturizing Mask, Shang Guan Cosmeceutical Repair Cream, Yuan Soap Liquid Shampoo. Catering directly to Beitou hot spring tourists, this branch features a rich selection of local Taiwanese cosmetics and botanical bath brands, allowing visitors to easily pick up moisturizing skincare and hair remedies right after a relaxing soak.", "name": "Watsons New Beitou Branch", "transport": "Approx. 2 mins walk from MRT Xinbeitou Station"}, {"address": "No. 218, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy items: Japanese Hot Spring Bath Salts, Lion Rest-Time Foot Sheets, Horse Oil Intensive Moisturizing Cream. Specializing in Japanese drugstore items that complement Beitou\u0027s classic Japanese hot spring atmosphere, this store offers plenty of muscle-relieving patches for post-soak care, famous Japanese bath powders, and rich moisturizers, attracting many fans of Japanese cosmetics.", "name": "Japan Medical New Beitou Branch", "transport": "Approx. 2 mins walk from MRT Xinbeitou Station"}], "name": "Local Signature Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 157, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buys: Loose linen dresses, handmade plant-dyed canvas bags, Japanese-style wool scarves. An independent local select shop embodying Beitou\u0027s slow-living vibe. Specializing in comfortable, natural-material clothing and daily bags for men and women, it is a beloved favorite among local residents and hot spring tourists alike.", "name": "Beitou Select Boutique (\u5317\u6295\u5c0f\u5bb6\u6709\u9078)", "transport": "About a 3-minute walk from MRT Xinbeitou Station"}, {"address": "No. 66, Sec. 2, Shipai Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buys: Multi-compartment genuine leather long wallets, minimalist leather crossbody bags, high-capacity lightweight tote bags. A popular Taiwanese brand for high-quality women\u0027s bags and leather goods. Offering a wide variety of stylish, high-value wallets and accessories, it\u0027s a go-to shop for women in the Shipai commercial area.", "name": "S\u0027AIME (Shipai Store)", "transport": "About a 3-minute walk from Exit 1 of MRT Shipai Station"}, {"address": "No. 138, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buys: Air-cushioned walking shoes, handmade leather dress shoes for men, lightweight shock-absorbing women\u0027s air-cushioned shoes. A renowned home-grown Taiwanese shoe brand with a long history. Known for comfortable air-cushioned footwear tailored to Asian feet as well as refined leather bags, it\u0027s a popular spot for hot spring visitors and hikers looking for supportive walking shoes.", "name": "A.S.O Shoes (Beitou Guangming Store)", "transport": "About a 2-minute walk from MRT Xinbeitou Station"}, {"address": "No. 148, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buys: Minimalist pure cotton T-shirts, windproof warm hooded jackets, lightweight casual crossbody bags. Taiwan\u0027s iconic budget-friendly clothing brand offering highly functional, practical apparel and casual accessories for men and women. Loved by local families and travelers of all ages.", "name": "NET (Beitou Guangming Store)", "transport": "About a 3-minute walk from MRT Xinbeitou Station"}, {"address": "No. 24, Wenquan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buys: Hand-painted Yangmingshan calla lily tote bags, hand-stitched vegetable-tanned leather coin purses, natural woven straw hats. An independent craft workshop located near the Beitou Hot Spring area. Combining natural elements of Yangmingshan into original canvas bags and handmade leather goods, every item is infused with a unique local artistic touch.", "name": "Shanlan Handmade Leather \u0026 Canvas Shop", "transport": "About a 6-minute walk from MRT Xinbeitou Station"}, {"address": "No. 37, Sec. 2, Shipai Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buys: DCS health air-cushioned shoes, waterproof and breathable hiking shoes, pressure-relieving flip-flops. A famous home-grown Taiwanese footwear brand focused on ergonomic support and comfort. Perfect for travelers planning to hike Yangmingshan trails or enjoy leisurely strolls around the Beitou Hot Spring area.", "name": "La New (Shipai Store)", "transport": "About a 2-minute walk from Exit 1 of MRT Shipai Station"}, {"address": "No. 20, Yumin 1st Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buys: Korean-style knit cardigans, patterned cotton-linen wide-leg pants, vintage leather backpacks. A long-established women\u0027s boutique located on the border of Shipai and Beitou. The owner personally handpicks high-quality, flattering apparel, shoes, and bags\u2014making it a hidden gem for local fashion lovers.", "name": "Sunny Boutique Beitou", "transport": "About a 4-minute walk from Exit 1 of MRT Shipai Station"}, {"address": "No. 25, Sec. 1, Zhongyang S. Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buys: Bamboo charcoal antibacterial warm socks, comfortable loungewear, lightweight water-resistant backpacks. A trusted Taiwanese casual wear and textile store known for budget-friendly prices and cozy loungewear. A popular local shop frequently visited by Beitou residents.", "name": "DA TUNG TREE (Beitou Store)", "transport": "About a 4-minute walk from Exit 1 of MRT Beitou Station"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Boutiques"}, "cat_3": {"items": [{"address": "No. 30, Xinshi St., Beitou Dist., Taipei City (Stall 70, 1F, Beitou Market)", "feature": "\u2b50 4.5 stars | Must-buy: Carefree Tea (Wuyou Tea), Gao Ji Black Tea, Grass Jelly Tea. Hidden inside Beitou Market, this half-century-old tea house is a must-visit spot for locals and tourists alike. Their signature \u0027Carefree Tea\u0027 is a golden-ratio blend of Oolong and Black tea, delivering a sweet aftertaste that is refreshing and never bitter. Adhering to traditional slow-brewing methods, their iconic bagged tea drinks are packed with nostalgic old-school charm.", "name": "Gao Ji Tea House", "transport": "MRT Beitou Station Exit 2, about a 5-minute walk to Beitou Market"}, {"address": "No. 15, Xinshi St., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy: Traditional Black Tea, Sour Plum Drink, Peanut Soup. Established in 1966 as the pioneer of traditional black tea in Beitou, this shop has insisted on slow-simmering high-quality tea leaves with pure natural cane sugar for decades. The tea boasts a rich aroma with a unique charcoal-roasted sweetness. Their large bagged black tea offers incredible value for money, making it an unmissable nostalgic refresher when visiting the Beitou Hot Springs area.", "name": "Tsai Yuan Yi Black Tea", "transport": "MRT Beitou Station Exit 2, about a 6-minute walk"}, {"address": "No. 2, Zhongshan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy: Natural Hot Spring Powder (Yunohana), Hokutolite souvenirs, Handmade hot spring soap. Located inside the historic Beitou Hot Spring Museum (a designated municipal monument), this shop carefully selects authentic local hot spring-themed souvenirs. The most popular item is the natural \u0027Yunohana\u0027 hot spring powder crystallized from local hot springs, allowing you to enjoy a soothing Beitou hot spring bath at home. It makes a truly iconic cultural gift.", "name": "Beitou Hot Spring Museum Gift Shop", "transport": "MRT Xinbeitou Station Exit, about a 5-minute walk"}, {"address": "No. 61, Datong St., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy: Traditional Mung Bean Pastry, Curry Pork Floss Pastry, Sesame Egg Yolk Pastry. A traditional bakery that has been filling Beitou with mouthwatering aromas for decades, preserving time-honored handcrafted baking techniques. The signature mung bean pastry features flaky, delicate layers and a dense, sweet, non-greasy filling, while the curry pastry offers a rich savory aroma that keeps you reaching for more. Many visitors stop by after soaking in the hot springs to buy gifts for family and friends.", "name": "Han Fa Traditional Bakery", "transport": "MRT Beitou Station Exit 1, about a 4-minute walk"}, {"address": "No. 8, Lane 75, Sec. 2, Shipai Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy: Brown Sugar Hot Mochi, Double-topping Tofu Pudding, Old-school Shaved Ice. A highly famous traditional dessert shop in the Shipai commercial area, decorated with nostalgic farm tools and retro toys. Made-to-order hot brown sugar mochi is generously dusted with fragrant peanut powder and sesame seeds, offering a soft, chewy texture that delights every visitor. With various old-school cookies and cold drinks, it\u0027s a signature dessert landmark in Beitou.", "name": "Water Turtle Bo Traditional Desserts", "transport": "MRT Shipai Station Exit 1, about a 5-minute walk"}, {"address": "No. 89, Hudi Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy: Grass Mountain Handcrafted Tea Bags, Chiang Kai-shek\u0027s Private Recipe Grass Mountain Cakes, Yangmingshan Camellia cultural products. Located on Yangmingshan, the Grass Mountain Chateau was once a presidential residence and now seamlessly blends historical heritage with art and culture. The gift shop features curated goods inspired by local Yangmingshan flora and tea culture. The exquisite handcrafted gift sets and delicate tea pastries are top picks for an elegant and culturally rich gift from Yangmingshan.", "name": "Grass Mountain Chateau Gift Shop", "transport": "Take MRT to Shipai Station and transfer to Bus S8, or to Jiantan Station and transfer to Bus R5 to Yangmingshan Bus Terminal, then walk"}, {"address": "Around No. 55, Zhuzihu Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-buy: Yangmingshan Colorful Mini Steamed Buns, Zhuzihu Handcrafted Pickled Cabbage, Calla Lily-themed Handicrafts. Located in the heart of Zhuzihu on Yangmingshan, this market gathers high-quality agricultural products harvested daily by local farmers. The most popular items are the multi-flavored mini rainbow steamed buns and sweet local sweet potatoes, offering dense textures and rich aromas. Seasonally limited handcrafted pickles are also insider-favorite local delicacies.", "name": "Zhuzihu Farmers\u0027 Market \u0026 Local Produce Center", "transport": "Take Bus S8 from MRT Shipai Station, or Bus S9 from MRT Beitou Station to Zhuzihu Stop"}, {"address": "1F, No. 153, Datong St., Beitou Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy: Beitou-flavored Artisanal Chocolates, Specialty Coffee Beans, Signature Fruit Pies. Converted from an old rice barn, this distinctive independent shop combines specialty coffee with world-class artisanal chocolates. The shop cleverly incorporates local Beitou ingredients\u2014such as Ponkan (mandarin oranges), Wenshan Baozhong tea, and regional fruits\u2014into their chocolates, earning multiple awards at the International Chocolate Awards (ICA). It makes a premium gift filled with local character and craftsmanship.", "name": "Sheme House Chocolates \u0026 Coffee", "transport": "MRT Beitou Station Exit 1, about a 5-minute walk"}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "No. 77, Sec. 6, Zhongshan N. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Din Tai Fung Pineapple Cake Gift Set, Japanese Cosmetics \u0026 Skincare, Imported Fine Handmade Chocolates. Located near Zhishan Station (the gateway to Beitou), this is a top dining and shopping destination beloved by residents of Beitou and Yangmingshan. Brightly lit and built with sustainable green design, it houses a wide array of popular restaurants and Japanese brand counters.", "name": "Far Eastern SOGO Taipei Tianmu Store", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Zhishan Station (Exit 2), then walk for about 3 minutes."}, {"address": "No. 55, Sec. 2, Zhongcheng Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Mia C\u0027bon Imported Japanese Fruit, Aquarium-Themed Creative Souvenirs, Hokkaido Fresh Cream Rolls. A classic Japanese-style department store deeply rooted in Tianmu and Beitou, it features an iconic giant central aquarium that delights families daily. Inside, you\u0027ll find numerous exclusive Japanese brands and curated local products.", "name": "Dayeh Takashimaya", "transport": "Take the Taipei MRT to Zhishan Station, then transfer to the free Dayeh Takashimaya Shuttle Bus."}, {"address": "No. 68, Tianmu E. Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Fnac 3C Digital Accessories, Chun Shui Tang Specialty Tea Bag Gift Sets, Quality Japanese Home Goods. Nestled at the foot of Yangmingshan, this upscale department store comprises Buildings A and B. Offering a comfortable and modern shopping environment, it\u0027s the premier retail destination for residents coming down the mountain as well as Tianmu locals.", "name": "Shin Kong Mitsukoshi Taipei Tianmu Store", "transport": "Take the Taipei MRT to Shipai Station, then transfer to Bus Red 12 or Red 15 and get off at Tianmu Baseball Stadium Stop."}, {"address": "No. 205, Minshan St., Neihu Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: ROOTS Classic Casual Sweatshirts, Nike Clearance Sneakers, Discounted Coach Leather Bags. Taipei\u0027s premier dedicated outlet center, easily accessible by car from Beitou and Yangmingshan. Housing top international sports, casual, and luxury brands with year-round discounts starting as low as 70% off (30% of original price), it\u0027s a bargain hunter\u0027s paradise.", "name": "LEECO Outlet Neihu Branch", "transport": "Take the Taipei MRT to Songshan or Kunyang Station, transfer to Bus 204 or 63, get off at Xinhu 3rd Rd. Intersection Stop, and walk a short distance."}, {"address": "No. 2, Zhongshan Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Beitou Hot Spring Crystal Soaps, Retro Beitou Yukata Tote Bags, Historic Hot Spring Illustrated Postcards. An independent specialty store representing local Beitou hot spring culture. Housed inside a century-old historic monument museum, it sells exclusive cultural and creative goods blending local hot spring elements with Japanese bathhouse aesthetics, popular among domestic and international tourists alike.", "name": "Beitou Hot Spring Museum Shop", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Xinbeitou Station, then walk for about 5 minutes."}, {"address": "No. 89, Hudi Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Grass Mountain Organic Herbal Tea Bags, Handcrafted Taiwanese Ceramic Tea Sets, Vintage Woodcut Cultural Commemorative Stamps. Located within the historic Grass Mountain Chateau in Yangmingshan National Park, this craft shop offers selected Taiwanese designer crafts and Yangmingshan-themed gifts. Blending historical charm with mountain nature, these souvenirs carry high artistic and collectible value.", "name": "Grass Mountain Chateau Craft Shop", "transport": "Take the Taipei MRT to Jiantan Station, transfer to Bus Red 5 to Yangmingshan Main Station, then walk for about 10 minutes."}, {"address": "No. 226, Guangming Rd., Beitou Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Officially Certified Hokutolite Hot Spring Powder, Hinoki Bucket Handmade Wooden Coasters, Beitou Hot Spring Moisturizing Sheet Masks. A landmark local specialty shop in the Xinbeitou area, showcasing hot spring mineral crystal powder extracted naturally from Thermal Valley. It allows visitors to take an authentic Beitou hot spring experience home, making it an iconic destination for unique local souvenirs.", "name": "Beitou Hot Spring Powder \u0026 Gift Shop", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Xinbeitou Station, then walk for about 3 minutes after exiting."}, {"address": "No. 49, Kaixuan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Retro American Vinyl Records, Yangmingshan Volcanic Mud Essential Oil Handmade Soaps, American Cosmetics \u0026 Fragrances. Housed in a renovated Cold War-era military club in the Yangmingshan American Military Remnants housing area, this shop features an American retro industrial decor. It offers a curated collection of American lifestyle goods, ambient fragrances, and local handmade creations, standing out as the most unique boutique shop at the mountain top.", "name": "BY33 Club Boutique Shop", "transport": "Take the Taipei MRT to Jiantan Station, transfer to Bus Red 5, get off at Shanzihou Police Station Stop, and walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Beitou Hot Springs and Yangmingshan"}, "dadaocheng": {"categories": {"cat_1": {"items": [{"address": "No. 190, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-buy list: Cucumber Facial Soap, Dadaocheng Rice Extract Soap, Classic Tea Scented Handmade Soap. Dachun\u0027s Soap is a local brand spanning three generations in Dadaocheng, famous for its bath and body products. The shop infuses local Taiwanese tea, rice, and Chinese herbs into oils to craft its soaps, featuring vintage retro packaging that captures old Taipei charm. The store offers a friendly hand-washing trial area; hands feel moisturized and smooth after washing, making it a top choice for iconic souvenirs among tourists.", "name": "Dachun\u0027s Soap Dihua Flagship Store", "transport": "MRT Daqiaotou Station, Exit 1, about an 8-minute walk."}, {"address": "No. 181, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Empress Cixi Brightening Mask, Empress Cixi Whitening Mask, Selected Herbal Cleansing Soap. Originating from Sheng Yuan Pharmacy established in 1946, Sheng Yuan Herbs converts traditional Chinese medicine wisdom into modern natural skincare products. The iconic Yu Rong San series is based on a Qing Dynasty imperial court secret recipe, crafted with natural ingredients free from artificial chemical additives. Highly popular among Japanese and Korean tourists, it is Dihua Street\u0027s premier signature herbal beauty brand.", "name": "Sheng Yuan Herbs", "transport": "MRT Beimen Station, Exit 3, about a 7-minute walk."}, {"address": "No. 134, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.9 stars | Must-buy list: Customized Herbal Foot Bath Packs, Natural Mosquito Repellent Sachets, Chinese Herbal Pearl Powder for Beauty. Boasting decades of history, Huang Chang Sheng Pharmacy preserves the authentic charm of a traditional Chinese pharmacy. Beyond traditional raw herbs, they have developed herbal bath packs and skincare ingredients tailored to modern wellness and beauty needs. Hand-blended herbal foot bath packs boost circulation and release natural botanical aromas, offering a truly local experience.", "name": "Huang Chang Sheng Pharmacy", "transport": "MRT Daqiaotou Station, Exit 1, about a 9-minute walk."}, {"address": "No. 282, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Mugwort Repairing Soap, Chinese Turpentine Bath \u0026 Body Set, Mugwort Essence Repairing Cream. Yuan Soap is a pioneer brand of handmade herbal soaps in Taiwan. Its store on Dihua Street combines classic red-brick architecture with botanical aesthetics. Products carefully select ingredients from organic herbal farms on Yangmingshan, emphasizing harmony between nature and skin. The Mugwort series offers excellent moisturizing and soothing properties, making it a favorite among natural and organic skincare lovers.", "name": "Yuan Soap Dihua Store", "transport": "MRT Daqiaotou Station, Exit 1, about a 5-minute walk."}, {"address": "No. 62, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-buy list: Herbal Bath Soaking Packs, Radiance Herbal Foot Bath Packs, Grass Jelly Moisturizing Lip Balm. DENGYI Chinese Herbal Medicine transformed a traditional pharmacy into a modern herbal lifestyle concept store, integrating traditional herbs into daily beauty and personal care routines. The store layout is beautifully designed. Its natural herbal bath packs use finely ground botanical ingredients, leaving skin silky smooth and delicate with an elegant herbal scent, showcasing Dihua Street\u0027s seamless blend of tradition and innovation in beauty.", "name": "DENGYI Chinese Herbal Medicine Dihua Store", "transport": "MRT Beimen Station, Exit 3, about an 8-minute walk."}, {"address": "No. 92, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Rose Herbal Facial Steam/Bath Packs, Chinese Herbal Moisturizing Bath Packs, Natural Herbal Hand Cream. Lian Tong Chinese Herbal Medicine specializes in combining traditional Chinese herbs with modern aromatherapy and beauty. The store offers a variety of herbal-based personal care and skincare products. Their carefully crafted botanical bath packs not only beautify skin but also relieve fatigue, attracting many female travelers seeking natural skincare solutions.", "name": "Lian Tong Chinese Herbal Medicine", "transport": "MRT Beimen Station, Exit 3, about a 9-minute walk."}, {"address": "No. 26, Gangu St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Pearl Hydrating Powder, Herbal Stress-Relief Foot Soaking Packs, Chinese Herbal Essential Oils. Daily Health Herbal Experience Center turns traditional Chinese medicine into an interactive beauty and wellness space, where visitors can try grinding and blending natural herbal ingredients. Their herbal essential oils and pearl powder skincare series emphasize pure, additive-free formulas, delivering a unique botanical beauty experience in Dadaocheng.", "name": "Daily Health Herbal Experience Center", "transport": "MRT Beimen Station, Exit 3, about a 6-minute walk."}, {"address": "No. 34, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Taiwan-Exclusive Herbal Face Cream, Specialty Hand Cream Gift Sets, Dermocosmetic Repairing Face Masks. Built in 1917, this Tier-3 historic monument building was the birthplace of early Western pharmacies in Taiwan. Today, it preserves its historic architectural facade while operating as a cosmetics and drugstore. Alongside a variety of Taiwanese-made dermo-cosmetics and skincare products, the store offers exclusive Dadaocheng commemorative packaging beauty gift sets, making it a great spot for combining historical sightseeing with cosmetics shopping.", "name": "AS Watson Building Heritage Store", "transport": "MRT Beimen Station, Exit 3, about a 6-minute walk."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 192, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic printed tote bags, retro tissue box covers, Taiwan Crested Myna pouch. A famous local Taiwanese printed fabric brand that blends Taiwan\u0027s ecology and vintage cement tile elements. Offering a variety of artsy canvas bags, apparel, and accessories, it is a big favorite among Japanese, European, and American tourists.", "name": "InBlooom Dihua Store", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 237, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Peony hand-embroidered shoes, silk embroidered mules, classic handmade embroidered small bags. An 80-year-old historic shoe store that transforms traditional embroidery craft into modern fashion shoes and bags. Featuring exquisite embroidery and exceptional comfort, it\u0027s a must-visit spot to experience retro oriental glamour.", "name": "Little Garden Embroidered Shoes", "transport": "MRT Beimen Station Exit 3, about a 6-minute walk"}, {"address": "No. 195, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Organic hand-spun cotton dresses, fair trade woven hemp bags, hand-painted brass jewelry. An independent design brand featuring fair trade and eco-friendly materials. Combining tribal handcrafts from around the world, it creates comfortable clothing and durable handmade bags with a natural bohemian style that is unique and eco-friendly.", "name": "Twine Fair Trade Dihua Store", "transport": "MRT Daqiaotou Station Exit 1, about a 9-minute walk"}, {"address": "No. 204, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Retro Taiwanese 3-color market bags (Gaji bags), hand-woven rattan bags, bamboo picnic baskets. Originally a traditional wooden bucket and bamboo utensil shop, it went viral for selling iconic red-blue-green Taiwanese market bags. Now offering various stylish bucket bags and woven totes, it is a hugely popular stop for iconic Taiwanese fashion accessories.", "name": "Gao Jian Bucket \u0026 Woven Bags", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 34, Minle St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade plant-dyed linen shirts, artisan leather crossbody bags, handmade brass earrings. Tucked away in the alleys of Dadaocheng, this lifestyle select shop focuses on rustic clothing and artisan shoes and bags. The items radiate Zen simplicity and raw aesthetic beauty, beloved by minimalists and quality-lifestyle enthusiasts.", "name": "Earthing Way", "transport": "MRT Beimen Station Exit 3, about a 7-minute walk"}, {"address": "No. 214, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade bamboo woven handbags, retro mesh bags, straw sun hats. A century-old bamboo general store filled with natural woven bags, vintage string bags, and straw hats. With affordable prices and sturdy hand-woven craftsmanship, it is a fantastic treasure trove for breezy summer woven accessories.", "name": "Lin Feng Yi Bamboo Crafts \u0026 Bags", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 237, Nanjing W. Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Structured tailored knitwear, designer printed silk scarves, genuine leather geometric handbags. One of Taiwan\u0027s premier independent designer brands, transforming a historic mansion into a fashion space where modern design meets heritage. Offers high-end men\u0027s and women\u0027s apparel and accessories with sharp cuts and sophisticated style.", "name": "DOUCHANGLEE Dihua Concept Store", "transport": "MRT Beimen Station Exit 3, about a 5-minute walk"}, {"address": "No. 38, Ln. 14, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Modernized vintage cheongsams (qipao), frog-button linen tops, retro kiss-lock bags. Specializing in oriental clothing and cheongsams that blend tradition with modernity, offering fitting and try-on services. Delicate frog-button craft and elegant tailoring perfectly recreate the glamorous 1930s golden era of Dadaocheng.", "name": "Vapor Flower Cheongsam \u0026 Traditional Wear", "transport": "MRT Beimen Station Exit 3, about a 7-minute walk"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 311, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Signature Crispy Almond Pork Paper, Black Pepper Pork Jerky, Tenderloin Pork Jerky. Located in the northern section of Dihua Street, this 30-year-old shop is one of Taipei\u0027s most famous souvenir stores. The founder insists on fresh daily baking. The most impressive item is their signature paper-thin, translucent crispy almond pork paper. It delivers an amazingly crunchy texture packed with rich pork aroma and sliced almonds\u2014an absolute must-buy traditional culinary gift for local and international visitors to Dadaocheng.", "name": "Jiang Ji Hua Long Pork Paper", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 309, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Golden Turtle Cakes, Ping An Turtle Peanut Candy, Taiwanese Puff Pastries. Founded in 1895, this century-old bakery infuses traditional Taiwanese pastries with modern creative design. The classic Golden Turtle cake is carefully kneaded from premium peanut butter and brown sugar, shaped delightfully to bring good fortune. The Ping An Turtle candy is rich, aromatic, and non-sticky. With nostalgic historic packaging and authentic handmade flavors, visitors can truly feel the warm cultural charm of Dadaocheng\u0027s legendary bakery.", "name": "Lee Ting Xiang", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 134, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.8 Stars | Must-Buy List: Herbal Health Tea Bags, Soothing Herbal Foot Bath Packs, Sulfur-Free Dried Red Dates. A classic Chinese medicine shop on Dihua Street with decades of heritage, transformed into an aesthetically pleasing modern wellness space. Selecting premium herbs without chemical additives, they offer smooth health tea blends, soothing herbal foot bath remedies, and natural sulfur-free dried fruits, attracting wellness enthusiasts and hipsters alike.", "name": "Huang Chang Sheng Pharmacy", "transport": "MRT Beimen Station Exit 3, about a 10-minute walk"}, {"address": "No. 247, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Winter-Exclusive Strawberry Daifuku, Classic Dorayaki, Crispy Monaka. Established in 1953, this authentic Japanese confectionery shop blends exquisite Japanese craftsmanship with high-quality Taiwanese ingredients. The hugely popular winter Strawberry Daifuku wraps a whole fresh strawberry in smooth red bean paste and chewy mochi for a perfect sweet and sour balance. Don\u0027t miss their strolling combo set featuring fresh monaka paired with freshly brewed sencha tea.", "name": "Dihua Ziyang Wagashi", "transport": "MRT Daqiaotou Station Exit 1, about a 6-minute walk"}, {"address": "No. 159, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Crispy Chili Snacks, DoChia Aromatic Sesame Chili Paste, Star Anise Spicy Sauce. Taiwan\u0027s first spice-themed concept store elevates classic chili peppers into irresistible crispy snacks and premium sauces. Styled like an upscale perfume boutique, their signature Crispy Chili snack features deseeded peppers stuffed with white sesame and roasted spices\u2014mildly spicy, wildly aromatic, and perfect for gifting.", "name": "DoChia A-Ma Spice Specialist", "transport": "MRT Daqiaotou Station Exit 1, about an 8-minute walk"}, {"address": "No. 223, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Traditional Sweet Osmanthus Rice Cake, Signature Sesame Sponge Cake, Handmade Purple Sweet Potato Cake. A legendary Shanghainese steamed cake brand with over 70 years of history, refined for modern tastes. Preserving the traditional wooden mold craftsmanship, they create delicate mini-sized cakes that are soft, pillowy, and infused with subtle rice and osmanthus aromas. Served warm straight from the steamer in a retro setting, it\u0027s a top choice for souvenirs and walking snacks.", "name": "Hohsing 1947", "transport": "MRT Daqiaotou Station Exit 1, about a 7-minute walk"}, {"address": "No. 220, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Sugar-Free Irwin Dried Mango, Low-Temperature Roasted Mixed Nuts, Refreshing Dried Hawthorn. Transformed from a traditional dry-goods store on Dihua Street, this minimalist grocery shop specializes in premium dried fruits, nuts, and local mountain goods. Made from top-grade Taiwanese local mangoes without additives, their dried fruits retain rich natural sweetness. Beautifully packaged and health-conscious, it\u0027s hugely popular among international tourists.", "name": "Fu Zi Shan Zhong", "transport": "MRT Daqiaotou Station Exit 1, about a 7-minute walk"}, {"address": "No. 45, Liangzhou St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Hualien Peanut Butter, Taiwanese Specialty Tea Gift Box, Handmade Nougat. Curated by veteran Japanese media personality Yuka Aoki, this select shop offers a unique Japanese perspective on Taiwan\u0027s finest local foods and snacks. Featuring limited-edition artisanal sauces, traditional teas, and delicious treats crafted by local small farmers, it combines nostalgic Taiwanese flavor with refined Japanese aesthetics\u2014the perfect place for unique Taiwanese gifts.", "name": "Nihao Wohao", "transport": "MRT Daqiaotou Station Exit 1, about a 5-minute walk"}], "name": "Must-Buy Signature Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1, Sec. 1, Chengde Rd., Datong Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Sunmai craft beer gift boxes, Nike sneakers, L\u0027ERBOLARIO hand cream. Located at the intersection of Taipei Rear Station and Dadaocheng, this large complex shopping center features numerous international fashion brands, trendy apparel, and a vibrant food court. It is the top choice for shopping, relaxing, or transferring before heading to Dadaocheng.", "name": "Q Square", "transport": "Get off at MRT Taipei Main Station and walk for about 2 minutes via Taipei City Mall Exit Y3."}, {"address": "No. 356, Sec. 1, Wenhua 3rd Rd., Linkou Dist., New Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted BEAMS clothing, PORTER INTERNATIONAL bags, Adidas classic sneakers. The most recommended world-class outlet mall near Taipei, bringing together hundreds of international luxury brands and Japanese fashion labels. It offers great discounts of 30% to 70% off year-round, along with a rich Japanese dining section\u2014perfect for a half-day shopping trip.", "name": "MITSUI OUTLET PARK Linkou", "transport": "Take the Taoyuan Airport MRT from Taipei Main Station to A9 Linkou Station; it\u0027s about a 10-minute walk or a short free shuttle bus ride from the station."}, {"address": "No. 67, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-buy list: Xiao Long Bao shaped tea sets, Hakka floral print tea cups, handmade ceramic dinner plates. A creative mini craft department store set inside a century-old shophouse on Dihua Street, preserving the traditional three-courtyard shophouse layout. Curating top local Taiwanese ceramic and teaware design brands, it breathes contemporary life aesthetics into traditional crafts, making it a treasure-hunting haven for tourists.", "name": "ArtYard - Min Yi Cheng", "transport": "Take MRT Beimen Station Exit 3, walk straight along Tacheng Street into Sec. 1 of Dihua Street for about 8 minutes."}, {"address": "No. 14, Nanjing W. Rd., Zhongshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Sarutahiko Coffee beans, Taiwanese independent designer clothing, Eslite-exclusive journals. A trendy lifestyle department store near the Dadaocheng shopping area, blending Taiwanese and Japanese curated goods, independent design brands, and popular dining spots. Its open high-ceiling layout and tasteful lifestyle curation create a refined cultural shopping atmosphere.", "name": "Eslite Spectrum Nanxi", "transport": "Located right outside MRT Zhongshan Station Exit 1."}, {"address": "No. 248, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Taiwan Crested Myna placemats, vintage tile print tote bags, handmade printed kiss-lock pouches. The flagship store of a renowned local Taiwanese fabric design brand, inspired by native Taiwanese birds, vintage floor tiles, and patterned window glass. It transforms Dadaocheng\u0027s traditional fabric culture into stylish lifestyle goods and textiles, offering heartwarming and unique Taiwanese souvenirs.", "name": "InBlooom Dadaocheng Main Store", "transport": "Take MRT Daqiaotou Station Exit 1, walk along Minquan W. Rd. and turn onto Sec. 1 of Dihua Street for about 9 minutes."}, {"address": "No. 22, Minle St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Independent designer handmade jewelry, original leather wallets, local small-farmer dried fruits. A mini creative hub connecting two century-old traditional shophouses, housing multiple Taiwanese independent designer brands, artisan jewelry shops, and stylish cafes, showcasing Dadaocheng\u0027s local charm where old meets new.", "name": "ArtYard - Zhong Yi Cheng", "transport": "Take MRT Beimen Station Exit 3, walk for about 9 minutes to Minle Street."}, {"address": "No. 204, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Rainbow Taiwanese grocery bags (Gaji bags), handmade woven picnic bags, Hinoki cypress steamers, and wooden tableware. Founded in the 1940s, this historic grocery shop became hugely popular among international tourists for its colorful, durable traditional Taiwanese woven bags and refined basketry. It is one of Dihua Street\u0027s most iconic retro lifestyle shops.", "name": "Kao Chien Bucket Shop", "transport": "Take MRT Daqiaotou Station Exit 1, walk along Sec. 1 of Dihua Street for about 8 minutes."}, {"address": "No. 159, Sec. 1, Dihua St., Datong Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-buy list: Traditionally extracted fragrant sesame chili oil, star anise spicy crisp oil, crispy chili crackers. Asia\u0027s first spice-themed local boutique shop, modernizing Dadaocheng\u0027s traditional dry-goods and spice culture. Featuring a chic, luxury-boutique interior, it offers various exclusively crafted aromatic spicy sauces and specialty chili snacks, drawing foodies from all over.", "name": "DoGa A-Ma Spice Store", "transport": "Take MRT Daqiaotou Station Exit 1, walk along Sec. 1 of Dihua Street for about 7 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dadaocheng and Dihua Street"}, "maokong": {"categories": {"cat_1": {"items": [{"address": "No. 16-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Mucha Tieguanyin Purifying Handmade Soap, Wenshan Baozhong Tea Antioxidant Hand Cream, High Mountain Tea Polyphenol Hydrating Mask. A charming local boutique nestled in the Maokong mountains, exclusively infusing the essence of Mucha\u0027s famous Tieguanyin and Wenshan Baozhong tea into skincare products. Emitting an elegant, soothing natural tea fragrance, it is a must-visit local brand after enjoying tea and a cable car ride in Maokong.", "name": "Maokong Tea Essence Handcrafted Cosmetics (\u8c93\u7a7a\u8336\u9999\u624b\u4f5c\u7f8e\u599d\u9928)", "transport": "Take the Maokong Gondola to Maokong Station; it is about a 5-minute walk from the exit."}, {"address": "No. 20, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Mugwort Shampoo, Mugwort Repairing Cream, Bitter Melon Purifying Herbal Soap. An iconic Taiwanese herbal skincare brand specializing in handcrafted products made from local herbs and cold-pressed plant oils. Its mild, non-irritating natural ingredients are highly favored by tourists seeking natural skincare and herbal aromas.", "name": "YUAN Soap Maokong Partner Shop (\u963f\u539fYUAN \u8c93\u7a7a\u7279\u7d04\u5408\u4f5c\u5e97)", "transport": "Take the Maokong Gondola to Maokong Station; it is about a 6-minute walk from the exit."}, {"address": "No. 75, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Moringa Passion Oil, Pure Hydration Serum, Scalp Clarifying Shampoo. A pioneer Taiwanese Clean Beauty brand advocating minimal skincare and ingredient transparency. Its natural, organic, pure formulas deeply nourish the skin, making it a must-buy homegrown brand for eco-conscious shoppers and healthy skin enthusiasts.", "name": "Greenvines Wenshan Stockist (\u7da0\u85e4\u751f\u6a5f Greenvines \u5c08\u6ac3\u9580\u5e02)", "transport": "Take bus 236, 282, or 660 to Muzha Market Station, then walk for about 2 minutes."}, {"address": "No. 56, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Dr. Morita Hyaluronic Acid Moisture Mask, For Beloved One Melasleep Brightening Bio-Cellulose Mask, NARUKO Tea Tree Shine Control \u0026 Blemish Clear Serum. Located in the heart of the NCCU shopping area near Taipei Zoo, this go-to chain drugstore offers an extensive selection of local dermo-cosmetics and trending sheet masks, complete with frequent promotional discounts.", "name": "COSMED NCCU Branch (\u5eb7\u662f\u7f8e \u653f\u5927\u9580\u5e02)", "transport": "Take bus 236, 282, or GR1 to NCCU Station, then walk for about 1 minute."}, {"address": "No. 102, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: DR.WU Intensive Renewing Serum With Mandelic Acid, Neogence Hyaluronic Acid Hydrating Essence, Solone Long Lasting Eyewear Liquid Eyeliner. Situated in the bustling Muzha area of Wenshan, this branch brings together popular Taiwanese makeup and dermo-cosmetic skincare brands. Convenient and comfortable to shop, it\u0027s a great one-stop destination for Taiwan\u0027s hottest beauty picks.", "name": "Watsons Muzha Branch (\u5c48\u81e3\u6c0f \u6728\u67f5\u9580\u5e02)", "transport": "Take bus 236, 660, or 251 to Muzha Market Station, then walk for about 2 minutes."}, {"address": "No. 1, Lane 48, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: 1028 Extend Curl Waterproof Mascara, heme Eyeshadow Palette 6-Colors, My Beauty Diary Black Pearl Mask. A spacious, large-scale Taiwanese beauty and lifestyle departmental store featuring a comprehensive dedicated section for budget-friendly local makeup and skincare. It\u0027s the best spot to experience everyday beauty shopping like a local Taiwanese girl.", "name": "POYA Taipei Muzha Branch (\u5bf6\u96c5 \u53f0\u5317\u6728\u67f5\u5e97)", "transport": "Take bus 236, 251, or 282 to Muzha Market Station, then walk for about 3 minutes."}, {"address": "No. 152, Sec. 3, Muxin Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Kuang Yuan Liang Natural Luffa Water, Herbal Soothing Steam Eye Mask, Taiwan Limited Edition Herbal Mosquito Repellent Spray. A featured drugstore in Wenshan District that, besides importing quality Japanese skincare, specifically showcases local Chinese herbal skincare products tailored to Taiwan\u0027s warm and humid climate\u2014trusted by locals and tourists alike.", "name": "Japan Medical Muzha Branch (\u65e5\u85e5\u672c\u8216 \u6728\u67f5\u9580\u5e02)", "transport": "Take bus 251, 282, or Green 1 to Zhongshun St. Intersection Station, then walk for about 2 minutes."}, {"address": "No. 23, Sec. 1, Xinguang Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: TKLAB Placenta Anti-Aging Serum, Bio-essence Bio-Gold Rose Gold Water, Shang Xin Herbal Repairing Ointment. A large, composite pharmacy near the Taipei Zoo MRT Line station. Beyond professional prescription services, it houses a substantial section dedicated to local sensitive-skin care and traditional Chinese herbal cosmetics, offering high quality at fair prices.", "name": "Great Tree Pharmacy Muzha Shinguang Branch (\u5927\u6a39\u85e5\u5c40 \u6728\u67f5\u65b0\u5149\u5e97)", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, transfer to bus 236 or 282, get off at Xinguang Rd. Sec. 1 Station, and walk for about 1 minute."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 30, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Giant panda print cotton T-shirts, leopard cat-shaped canvas tote bags, animal pattern children\u0027s sun hats. A must-visit official themed shop at the Taipei Zoo, offering a variety of clothing, shoes, and bag accessories inspired by the zoo\u0027s star animals. Highlighting high-quality pure cotton T-shirts and super cute animal-pattern canvas bags, it is deeply loved by families and young tourists, brimming with local playful charm and ecological conservation values.", "name": "Taipei Zoo Gift Shop", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, then walk for about 3 minutes."}, {"address": "No. 8, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Maokong Gondola commemorative cotton cable car T-shirts, tea leaf embroidered canvas bags, cat motif cozy cotton socks. Located inside the Maokong Gondola Station, this official cultural and apparel shop blends Maokong\u0027s signature cat motifs with tea culture elements. Offering exclusive leisure apparel and sun-protection accessories, it\u0027s the ideal spot to pick up light clothing and souvenir totes before riding the gondola up the mountain.", "name": "Maokong Gondola Gift Shop", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, then transfer to the starting station of Maokong Gondola."}, {"address": "No. 64, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: NCCU logo hoodies, academic-style heavyweight embroidered canvas bags, windproof baseball caps. Located near National Chengchi University at the foot of Maokong, this university-style apparel store features casual wear and bags imbued with an academic aesthetic. Its classic hoodies and high-quality heavy canvas totes attract students and visitors to Wenshan District, capturing a strong local scholarly vibe.", "name": "Coolnet NCCU Campus Wear \u0026 Bags", "transport": "Take the MRT to Taipei Zoo Station, then transfer to Bus Green 1, Brown 3, or Brown 6 to NCCU Station."}, {"address": "No. 38, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Tieguanyin plant-dyed linen shirts, handcrafted tea bag-shaped backpacks, minimalist straw sun hats. Tucked away among the hillside tea plantations of Maokong, this unique clothing boutique draws color inspiration from Wenshan Baozhong tea and Tieguanyin, offering natural plant-dyed cotton/linen apparel and artisan handcrafted bags. Light and comfortable to wear, these pieces radiate a natural tea-country cultural elegance, representing Maokong\u0027s signature local fashion.", "name": "Maokong Tea Country Apparel \u0026 Handbags", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 8 minutes."}, {"address": "No. 15, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted natural indigo dyed scarves, traditional plant-dyed crossbody bags, Wenshan-patterned tote bags. Located near Muzha Old Street, this independent craft studio utilizes natural indigo dye and local plant-dyeing techniques to create one-of-a-kind clothing accessories and cloth bags. Every item features a unique pattern filled with warm handcrafted texture and local artistic flavor\u2014perfect for hipsters and indie fashion lovers.", "name": "Muzha Craft \u0026 Indigo Dye Studio", "transport": "Take the MRT to Muzha Station, then transfer to Bus 236 or 660 to Muzha Market Station."}, {"address": "No. 12, Sec. 1, Xinguang Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Ultra-lightweight anti-UV sun protection jackets, breathable waterproof hiking shoes, large-capacity outdoor travel backpacks. Situated near Maokong\u0027s trail network and the zoo, this outdoor leisure apparel store provides professional gear tailored for hikers tackling the Zhangshu or Zhanghu trails. Featuring selected high-quality local and imported functional apparel and hiking footwear, it is a go-to shop for locals and hikers before setting off.", "name": "Green Field Outdoor Gear \u0026 Apparel", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, then walk for about 5 minutes."}, {"address": "No. 45, Sec. 1, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Handcrafted custom genuine leather casual shoes, Tieguanyin tea-colored genuine leather coin purses, retro leather shoulder bags. Operating for decades, this established local studio specializes in custom comfortable shoes made from premium leather tailored to local foot shapes. Its uniquely introduced tea-brown leather goods and durable handmade shoes are beloved by local residents and customers who appreciate artisanal craftsmanship.", "name": "Muzha Leather Shoes \u0026 Bags Studio", "transport": "Take the MRT to Jingmei Station, then transfer to Bus Brown 6 or Brown 12 to Examination Yuan Station, and walk for 2 minutes."}, {"address": "No. 120, Sec. 2, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Japanese urban outdoor multi-pocket fishing vests, waterproof functional waist bags, wide-brimmed countryside sun hats. Combining urban outdoor fashion with functional gear, this independent boutique specializes in outdoorsy styling and practical equipment. Whether you\u0027re hiking the Zhangshu Trail in Maokong or visiting the zoo on weekends, its trendy functional jackets and durable bags meet all your stylish yet practical outdoor needs.", "name": "Mountain Style Outdoor Clothing \u0026 Bags", "transport": "Take the MRT to Taipei Zoo Station, then transfer to Bus Green 1 or Brown 15 to NCCU 2nd Gate Station."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 121, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Authentic Muzha Tieguanyin Oolong Tea, Handmade Tieguanyin Tea Candy, Tieguanyin Tea Nougat Crackers. A 70-year-old tea shop located in the historic Muzha Old Street district, this is the ultimate destination for tasting and purchasing authentic Muzha Tieguanyin. The shop strictly adheres to traditional heavy fermentation and roasting processes, creating a tea broth with a lingering finish, subtle fruity acidity, and caramel notes. Their in-house Tieguanyin tea candy and nougat crackers seamlessly infuse rich tea aromas into tasty treats, making them top-tier souvenirs for tourists and local tea lovers alike.", "name": "Chang Hsieh Hsing Tea Shop", "transport": "Take the MRT to Muzha Station, transfer to Bus 236 or 282 to Muzha Market Stop, then walk for about 2 minutes."}, {"address": "No. 30, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Formosan Black Bear \u0026 Leopard Cat plush toys, Zoo-exclusive Tieguanyin tea cookie gift boxes, Dark wood frame animal souvenir keychains. Located near the Visitor Center and various park exits, these official souvenir shops are a must-visit shopping spot when visiting Taipei Zoo. They offer a vast array of exclusive original animal-themed merchandise. Highly recommended are the limited-edition cookie gift boxes infused with local Wenshan tea fragrance, as well as adorable themed goods highlighting Taiwan\u0027s native endangered species like the Leopard Cat and Formosan Black Bear\u2014combining educational value with collectible charm.", "name": "Taipei Zoo Official Souvenir Shop", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station (Exit 1) and walk about 3 minutes to the main entrance."}, {"address": "1F, No. 37-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Tieguanyin steamed buns, Tea-infused shortbread cookies, Special tea oil peeled chili peppers. Chef Ah-Yi\u0027s Big Tea Pot is famous not only for creative tea cuisine, but also for its souvenir section, a must-visit for Maokong visitors. The shop makes brilliant use of local Tieguanyin and Baozhong teas; its signature tea steamed buns have a satisfying, firm texture with an elegant tea fragrance, while the special tea oil peeled chili peppers serve as a perfect condiment or cooking ingredient. Many foodies stock up heavily on these specialty gifts after their meal.", "name": "Big Tea Pot Souvenir Counter", "transport": "Take the Maokong Gondola to Maokong Station, then walk about 10 minutes or transfer to the Maokong Bus Left Line."}, {"address": "No. 53-2, Lane 34, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Museum-exclusive Authentic Tieguanyin gift boxes, Tea-infused handmade soap, Traditionally roasted Baozhong tea bags. Built to honor Master Chang Nai-Miao, who introduced Tieguanyin tea plants to Muzha, this museum\u0027s gift shop is rich in tea cultural heritage. The Tieguanyin teas sold here are top-tier selections roasted using traditional methods and feature elegant packaging, making them extremely popular among Japanese and Western tourists. Additionally, the handmade tea soaps enriched with natural tea polyphenols are irresistible cultural craft items for shoppers.", "name": "Chang Nai-Miao Tea Memorial Museum Gift Shop", "transport": "Take the Maokong Gondola to Maokong Station, then transfer to the Maokong Left Line Bus to Chang Nai-Miao Tea Memorial Museum Stop."}, {"address": "No. 6, Lane 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Maokong High-Mountain Tieguanyin cold brew tea bags, Handmade tea egg rolls, Premium light-aroma Baozhong tea. Han She Tea House is the first traditionally licensed tea house in Maokong, showcasing pure tea products from the mountain region. Its cold brew tea bags\u2014tailored for younger visitors and tourists\u2014are easy to brew, delivering a crisp, refreshing sweetness. Paired with house-made Tieguanyin tea egg rolls that burst with rich tea flavor in every bite, it is the perfect snack to accompany a tea session.", "name": "Han She Tea House Souvenirs", "transport": "Take the Maokong Gondola to Maokong Station and walk about 5 minutes."}, {"address": "No. 53-1, Lane 34, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: House special Tieguanyin tea, Tieguanyin pumpkin seed crisp, Handmade tea plums. Situated halfway up Maokong, Liu Ji Xiang Tea Shop owns its tea gardens and directly produces and sells its products. A top-rated souvenir here is the special Tieguanyin pumpkin seed crisp\u2014crispy and delightful with a unique roasted tea aroma and just the right amount of sweetness. Their handmade pickled tea plums are appetizingly sweet and sour with a subtle high-mountain tea note, making them a popular treat to enjoy alongside a cup of tea.", "name": "Liu Ji Xiang Tea Shop", "transport": "Take the Maokong Gondola to Maokong Station, transfer to Bus S10 or Maokong Left Line to Zhangshan Temple Stop, then walk for about 3 minutes."}, {"address": "No. 16-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional handmade Muzha Tieguanyin, Tea nougat gift boxes, Premium high-mountain Wenshan Baozhong tea. Renowned for its classic Chinese-style architecture and serene garden landscape, Yuan Xu Yuan offers a wide variety of local specialty tea products. The shop\u0027s signature tea nougat blends fine Tieguanyin tea powder with nuts for a chewy, non-sticky delight where rich tea fragrance blends harmoniously with creamy sweetness\u2014making it a perfect sweet souvenir when visiting Maokong.", "name": "Yuan Xu Yuan Tea House", "transport": "Take the Maokong Gondola to Maokong Station and walk about 8 minutes."}, {"address": "No. 14-1, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Charcoal-roasted Tieguanyin tea gift box, Tieguanyin tea mochi, Handmade tea sun cakes. Chou Yuan Tea Shop is a long-standing local tea estate in Maokong with generations of tea-making heritage. Alongside its highly acclaimed charcoal-roasted Tieguanyin tea, the shop creatively incorporates tea into traditional pastries, offering chewy tea-flavored mochi and flaky, fragrant tea sun cakes. Combining local character with delicate flavors, these are must-buy gifts before departing Maokong.", "name": "Chou Yuan Tea Shop", "transport": "Take the Maokong Gondola to Maokong Station and walk about 6 minutes."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "No. 188, Jingxing Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Japanese chain clothing, local handmade lifestyle goods, Nitori home accessories. Located at the heart of Wenshan District, this core department store combines major Japanese brands with a shopping space loved by locals. Featuring many Taiwanese independent brand counters and exquisite lifestyle goods, it\u0027s the perfect spot for shopping and gearing up before heading to Maokong.", "name": "Jingmei Han-Shin Department Store", "transport": "Take the MRT Songshan-Xindian Line to Jingmei Station, then walk for about 5 minutes."}, {"address": "No. 356, Sec. 1, Wenhua 3rd Rd., Linkou Dist., New Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted Nike past-season sneakers, Coach classic leather bags, Mont-bell outdoor hiking technical jackets. The most powerful and highly recommended international outlet center in the Taipei suburbs. Featuring hundreds of famous international and local Taiwanese outdoor sports brands, it attracts countless tourists for shopping sprees with incredible discounts starting at up to 80% off.", "name": "MITSUI OUTLET PARK Linkou", "transport": "Take the MRT from Taipei Zoo Station to Taipei Main Station, transfer to the Taoyuan Airport MRT to A9 Linkou Station, and walk for about 6 minutes."}, {"address": "No. 30, Sec. 2, Xinguang Rd., Wenshan Dist., Taipei City (Next to the Zoo Visitor Center)", "feature": "\u2b50 4.5 stars | Must-Buy List: Leopard cat plush toys, Muzha Tieguanyin co-branded tea gift sets, limited edition Giant Panda canvas bags. The richest shop for exclusive original items inside the zoo, combining Taiwanese wildlife conservation themes. It sells a wide array of Taipei-exclusive cultural-creative items and unique souvenirs, making it an unmissable top shopping spot when visiting the zoo.", "name": "Taipei Zoo Main Gift Shop", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, then walk about 3 minutes to enter the park."}, {"address": "No. 40, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Traditional authentic Tieguanyin tea leaves, handmade Tieguanyin tea-flavored cookies, Maokong cold brew tea bag gift boxes. The most iconic century-old independent tea shop in Maokong, insisting on traditional charcoal roasting craft. Its homemade tea cookies and rich Tieguanyin tea are top local specialties that every tourist in Wenshan District must buy.", "name": "Maokong Chang Shieh Hing Tea Store", "transport": "Take the Maokong Gondola to Maokong Station, then transfer to the Maokong Shuttle Bus or walk for about 8 minutes."}, {"address": "No. 16-2, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade ceramic tea sets, natural tea-scented bath gift sets, local Wenshan Baozhong tea candies. An independent style boutique shop next to Maokong Gondola Station. It gathers exclusive creations from local young farmers and artists, integrating Maokong tea culture into lifestyle items and bath products, making it very popular among young travelers.", "name": "Maokong Tea Craft \u0026 Gift Shop", "transport": "Take the Maokong Gondola to Maokong Station and walk about 2 minutes after exiting."}, {"address": "No. 22, Lane 38, Sec. 3, Zhinan Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade specialty Tieguanyin nougat, camellia-shaped solid perfume, Maokong Farmers\u0027 Association organic tea bags. A specialty store operated directly by local organic tea farmers who have been rooted in Maokong for years. Offering authentic Muzha tea treats and handmade specialty gifts, the shop radiates a rich Taiwanese tea culture atmosphere, making it a top pick for purchasing tea-themed souvenirs.", "name": "Han She Tea House Souvenir Shop", "transport": "Take the Maokong Gondola to Maokong Station, then walk for about 5 minutes."}, {"address": "No. 112, Sec. 3, Xinglong Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Adidas classic running shoes, Puma professional technical sportswear, Under Armour breathable sports caps. A famous sports brand discount outlet located near the Wanfang commercial district in Wenshan District. Offering year-round clearance discounts of 50% to 70% off, it is a popular spot for locals and hikers heading to Maokong to snap up affordable, high-quality sports gear.", "name": "Wanfang Sports Outlet", "transport": "Take the MRT Wenhu Line to Wanfang Hospital Station, then walk for about 4 minutes."}, {"address": "No. 189, Sec. 3, Muzha Rd., Wenshan Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Vacuum-packed green bamboo shoot gift boxes, Muzha Tieguanyin tea bags, Maokong limited tea-flavored candied fruits. A local agricultural specialty showcase center established under the guidance of the Taipei Wenshan District Farmers\u0027 Association. Specializing in authentic bamboo shoot products and aged teas from the Maokong mountains, it perfectly represents the most authentic local specialties around Maokong and Taipei Zoo.", "name": "Wenshan Tea \u0026 Bamboo Shoots Gift Shop", "transport": "Take the MRT Wenhu Line to Muzha Station, transfer to Bus 236 to Wenshan District Administration Center Station, and walk to arrive."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Maokong and Taipei Zoo"}, "shilin": {"categories": {"cat_1": {"items": [{"address": "No. 142, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: 1028 Extend Curl Waterproof Mascara, My Scheming Ultra Hydrating Mask, Solone Perfect Fit Powder Puff. POYA is Taiwan\u0027s most iconic domestic large-scale beauty and lifestyle department store, and the Wenlin branch offers spacious floors with an extremely comprehensive inventory. It brings together many affordable local Taiwanese makeup and skincare brands. With reasonable prices and frequent exclusive promotional deals, it is the top treasure-hunting destination for foreign tourists and local youth seeking Taiwanese beauty products.", "name": "POYA Taipei Shilin Wenlin Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 50, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: YUAN Mugwort Soap, Oat Soothing Handmade Soap, Patchouli Nourishing Hand Cream. YUAN is an iconic Taiwanese brand specializing in herbal plant skincare, insisting on using Yangmingshan herbs and cold-process methods to craft handmade soaps. The shop exudes a tranquil Eastern Zen ambiance and rich herbal aromas. Its gentle, non-irritating formulas are highly favored by customers who value natural, organic ingredients and sensitive skin care, making it an elegant Taiwanese souvenir for friends and family.", "name": "YUAN Soap Shilin Concept Shop", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 3 minutes."}, {"address": "No. 19, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade Pearl Powder Whitening Soap, Chinese Herbal Stress-Relief Foot Bath Packs, All-Natural Zi Yun Ointment. A long-standing traditional Chinese pharmacy rooted in Shilin for decades, blending ancient herbal wisdom into modern daily skincare. Using pure pearl powder and natural Chinese herbs, they formulate various creams and handmade soaps with clean, additive-free ingredients. It receives high acclaim from locals and wellness enthusiasts who love traditional herbal cosmetics.", "name": "Sheng Chang Tang Chinese Herbal Medicine \u0026 Beauty", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Shilin Station (Exit 2) and walk for about 6 minutes."}, {"address": "No. 110, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Neogence Hyaluronic Acid Hydration Mask, DR.WU Intensive Renewal Serum with Mandelic Acid, Sexylook Black Facial Mask. A well-known Taiwanese chain drugstore focusing on cosmeceutical-grade skincare products and high-value local facial masks. Professional pharmacists and beauty consultants are stationed in-store to provide attentive skin consultations. Here, you can shop all major Taiwanese dermacosmetic brands under one roof, making it a must-visit drugstore for Japanese and Korean tourists stocking up on top-quality Taiwanese facial masks.", "name": "COSMED Shilin Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 4 minutes."}, {"address": "No. 80, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-Buy List: Taiwanese Medical-Grade Deep Hydration Serum, Bioderma Sensibio H2O Micellar Water, La Roche-Posay Cicaplast Baume B5. A professional compound pharmacy operating in Shilin for many years. Beyond prescription services, it carefully selects high-quality skincare products used by local Taiwanese dermatological clinics alongside international sensitive-skin brands. With transparent, accessible pricing and detailed, courteous explanations from pharmacists, local residents frequently visit to choose suitable skin repair products.", "name": "Sheng Kang Pharmacy Shilin Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 3 minutes."}, {"address": "No. 132, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: NARUKO Tea Tree Shine Control \u0026 Anti-Acne Mask, KATE Designing Eyebrow 3D Palette, Premium Double-Sided Soft Cotton Pads. Located at a bustling landmark intersection of Shilin Night Market, its 24-hour or late-night operating hours make it the top choice for night market visitors to replenish supplies. The store offers an extremely rich selection of Taiwanese, Japanese, and Korean beauty products, ranging from affordable domestic skincare to renowned international drugstore makeup, complete with frequent discount promotions.", "name": "Watsons Shilin Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 130, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: ARGELAN Organic Plant Lip Balm, LuLuLun Taiwan Limited Edition Facial Mask, EXCEL Powder \u0026 Pencil Eyebrow EX. A flagship store of the famous Japanese drugstore chain, conveniently situated adjacent to the Shilin Night Market commercial area. It stays in sync with the latest Japanese beauty trends while featuring dedicated sections for Taiwanese specialty beauty items and limited-edition facial masks. Bright, neat, and well-organized, it is a shopping paradise for fans of Taiwanese and Japanese trendy makeup and skincare.", "name": "Matsumoto Kiyoshi Taipei Shilin Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Jiantan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 247, Zhongzheng Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: DHC Lip Cream, KissMe Heroine Make Mascara, OGUMA AquaKey Hydrating Facial Spray. A Japanese-style drugstore located right near the exit of Shilin MRT Station, combining top-selling Taiwanese beauty care products with trendy Japanese cosmetics. Boasting an ultra-convenient location, the store frequently offers amazing promotions like Buy 1 Get 1 Free or 50% off the second item, making it an excellent stop for commuters and tourists to pick up everyday beauty essentials on the go.", "name": "Tomod\u0027s Shilin MRT Branch", "transport": "Take the Taipei MRT Tamsui-Xinyi Line to Shilin Station (Exit 1) and walk for about 1 minute."}], "name": "Local Iconic Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 16, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.5 stars | Must-Buy List: Japanese-style loose dresses, high-quality knit cardigans, retro canvas mini bags. A highly iconic local Taiwanese women\u0027s clothing brand known for its fresh, comfortable, and minimalist Japanese artsy/hipster aesthetic. The Shilin store is bright and spacious, offering a wide array of daily outfit choices. Hugely popular among students and young women, featuring affordable prices and weekly new arrivals\u2014a budget-friendly fashion spot you can\u0027t miss when shopping in Shilin!", "name": "QUEENSHOP Shilin Dadong Store", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk to the Dadong Road Shopping District."}, {"address": "No. 24, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Slimming push-up bikinis, Western-style fitted jeans, trendy platform sandals. A well-known homegrown Taiwanese women\u0027s fashion and footwear brand focusing on sexy Western styles and trendy Korean-inspired outfits. It went viral particularly for its patented push-up swimwear and flattering women\u0027s shoes. Located on bustling Dadong Road, the store carries a complete shoe line specifically tailored for Asian women\u0027s body types\u2014a top destination for young women looking for stylish footwear and party outfits.", "name": "AIR SPACE Shilin Dadong Store", "transport": "MRT Jiantan Station Exit 1, about a 6-minute walk."}, {"address": "No. 18, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.7 stars | Must-Buy List: Genuine leather multi-card long wallets, lightweight genuine leather crossbody square bags, stylish multifunctional backpacks. A high-quality local Taiwanese bag brand offering affordable genuine leather goods and trendy handbags crafted with luxury-level precision. The Shilin store features exquisite displays with a wide variety of designs and colors. Loved by young professionals and overseas tourists for its durable yet fashionable designs.", "name": "S\u0027AIME Shilin Dadong Store", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk."}, {"address": "No. 14, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Disney collaboration graphic tees, American retro baseball jackets, branded embroidered dad caps. Taiwan\u0027s largest licensed IP streetwear brand, bringing together Disney, American comics, and popular anime themes to create American casual-style clothing and accessories for men and women. Featuring great textures and trendy cuts, it is hugely popular among fashionable youth and couples shopping for matching outfits.", "name": "CACO Shilin Dadong Store", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk."}, {"address": "No. 77, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.2 stars | Must-Buy List: Men\u0027s genuine leather white sneakers, minimalist slim-fit cropped trousers, water-repellent functional trench coats. A popular original Taiwanese men\u0027s fashion and shoe/bag brand, specializing in minimalist yet stylish effortless outfits. From everyday sneakers and bags to trendy outerwear, their tailored fits suit Asian men\u0027s body frames exceptionally well, making it the top brick-and-mortar spot for men shopping for trendy looks in Shilin Night Market.", "name": "Life8 Shilin Dadong Store", "transport": "MRT Shilin Station Exit 2 or MRT Jiantan Station Exit 1, about a 6-minute walk."}, {"address": "No. 80, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.1 stars | Must-Buy List: Korean-style drop-shoulder graphic hoodies, stretch slim cargo pants, versatile canvas tote bags. A local Taiwanese fast-fashion chain brand known for high value-for-money, trendy apparel and accessories for both men and women. The Wenlin Road store is spacious with an extensive selection ranging from casual wear to quality shoes and bags\u2014an iconic shopping destination in the night market district.", "name": "50% Fifty Percent Shilin Wenlin Store", "transport": "MRT Jiantan Station Exit 1, about a 4-minute walk."}, {"address": "No. 102, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-Buy List: Business casual lightweight suit jackets, 100% cotton printed tees, spacious versatile leather totes. Taiwan\u0027s classic staple clothing brand famous for its incredible cost-performance ratio, quality fabrics, and comfortable tailoring. The Shilin store provides head-to-toe clothing, shoes, bags, and accessories for the entire family at highly competitive prices.", "name": "NET Taipei Shilin Store 1", "transport": "MRT Jiantan Station Exit 1, about a 5-minute walk."}, {"address": "No. 38, Dadong Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-Buy List: Limited-edition casual running shoes, trendy crossbody mini bags, moisture-wicking sports caps. Originating in Shilin Night Market, this is one of Taiwan\u0027s largest flagship sportswear retail stores. Bringing together top international sports brands and local streetwear items, it offers everything from the latest limited-edition sneakers to trendy activewear and bags\u2014a landmark shoe and bag shopping paradise in Shilin Night Market.", "name": "Momentum Shilin Dadong Store 1", "transport": "MRT Jiantan Station Exit 1, about a 6-minute walk."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1F \u0026 2F, Main Exhibition Hall 1, No. 221, Sec. 2, Zhishan Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.6 stars | Must-buy list: Jadeite Cabbage Washi Tape, Meat-shaped Stone Four Treasures of the Study Set, \u0027Imperial Edict (I Have Decreed)\u0027 Creative Stamp. Located inside the National Palace Museum, this flagship souvenir shop transforms thousand-year-old national treasures into stylish creative products and specially packaged snacks with modern ingenuity. From the classic Jadeite Cabbage merchandise to the bold and fun \u0027I Have Decreed\u0027 series, it is a top-choice, exclusive souvenir for foreign tourists and locals visiting the Palace Museum area in Shilin.", "name": "\u6545\u5bae\u535a\u7269\u9662\u7cbe\u54c1\u5e97 (National Palace Museum Gift Shop)", "transport": "From MRT Shilin Station Exit 1, transfer to Bus Red 30, 255, or 304 and get off at \u0027National Palace Museum Stop\u0027."}, {"address": "No. 546, Wenlin Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.4 stars | Must-buy list: Signature Ice Paste Pastry, Traditional Pineapple Cake, Handcrafted Egg Yolk Pastry Gift Box. Founded in 1867, this centuries-old Taiwanese bakery flagship store in Shilin is both the brand\u0027s birthplace and a pastry museum. Its signature \u0027Ice Paste Pastry\u0027 is carefully crafted with white kidney beans and mung beans, delivering a delicate, melt-in-your-mouth texture. Perfectly showcasing the craftsmanship of traditional Taiwanese pastries, it is the ultimate souvenir representing Shilin\u0027s local heritage.", "name": "\u90ed\u5143\u76ca\u7cd5\u9905\u535a\u7269\u9928\u8207\u58eb\u6797\u7e3d\u5e97 (Kuo Yuan Ye Bakery Shilin Flagship Store)", "transport": "MRT Shilin Station Exit 1, about a 5-minute walk."}, {"address": "No. 101, Jihe Rd., Shilin Dist., Taipei City (1F Shilin Market and surrounding stores)", "feature": "\u2b50 4.5 stars | Must-buy list: Handcrafted Almond Crisp, High-Fiber Pumpkin Seed Crisp, Traditional Peanut Candy. Located in the heart of Shilin Night Market, this famous handcrafted nut candy store emphasizes fresh roasting, low sugar, and non-sticky textures. Using premium nuts and high-quality maltose, the rich aroma of roasted nuts fills the air. The crispy texture and perfect level of sweetness make it addictive, making it a must-buy popular snack gift for night market visitors.", "name": "\u7235\u6797\u5805\u679c\u624b\u4f5c\u574a (Juelin Nuts Handcrafted Bakery)", "transport": "MRT Jiantan Station Exit 1, about a 4-minute walk."}, {"address": "No. 16-2, Dadong Rd., Shilin Dist., Taipei City (Opposite Cixing Temple)", "feature": "\u2b50 4.3 stars | Must-buy list: Fragrant Peanut Ma Lao, Black Sesame Ma Lao, Pure Seaweed Ma Lao. Tucked away beside Cixing Temple in Shilin Night Market, this traditional bakery stall preserves decades of classic handcrafting techniques. Made with high-quality maltose and selected puffed rice, the outer layer is coated with aromatic peanut powder or sesame. It bites into a fluffy, light, and crispy texture that doesn\u0027t stick to your teeth, overflowing with nostalgic traditional Taiwanese flavor.", "name": "\u91d1\u8208\u8534\u7ca9 (Jin Xing Ma Lao)", "transport": "MRT Jiantan Station Exit 1, about a 7-minute walk."}, {"address": "No. 218, Zhongzheng Rd., Shilin Dist., Taipei City", "feature": "\u2b50 4.3 stars | Must-buy list: Signature Puff Pastry Cake, Napoleon Pie, Traditional Egg Yolk Pastry. A classic, beloved local Taipei bakery that locals grew up with, and one of the most famous cake souvenir shops in Shilin Distr
