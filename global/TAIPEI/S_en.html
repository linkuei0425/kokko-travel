        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Housing nearly 700,000 rare imperial treasures and artifacts spanning centuries, this is a world-renowned treasure house of Chinese culture.", "duration": "2-3 hours", "title": "National Palace Museum", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station, then transfer to Bus Red 30 to National Palace Museum Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | An iconic Taipei landmark featuring grand blue-and-white architecture and a spacious plaza, where the hourly changing of the guard ceremony draws crowds of visitors.", "duration": "1-2 hours", "title": "Chiang Kai-shek Memorial Hall", "transport": "Take the MRT Songshan-Xindian Line or Tamsui-Xinyi Line to C.K.S. Memorial Hall Station, Exit 5."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | The top landmark for breathtaking panoramic views across the Taipei Basin, offering a close-up look at the massive tuned mass damper.", "duration": "1.5-2 hours", "title": "Taipei 101 Observatory", "transport": "Take the MRT Tamsui-Xinyi Line to Taipei 101/World Trade Center Station, Exit 4."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A centuries-old iconic historic temple in Taipei with a vibrant worship atmosphere and exquisite artistic wood and stone carvings.", "duration": "1 hour", "title": "Bangka Lungshan Temple", "transport": "Take the MRT Bannan Line to Longshan Temple Station, Exit 1, and walk for about 3 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Boasting volcanic geology and rich ecosystems with year-round seasonal blooms, featured popular spots include Qingtiangang and Xiaoyoukeng.", "duration": "3-4 hours", "title": "Yangmingshan National Park", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station, then transfer to Bus Red 5 or 260 to Yangmingshan Bus Terminal."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A vibrant arts and cultural hub converted from a former tobacco factory, combining creative exhibitions, an ecological pond, and Eslite Spectrum Songyan.", "duration": "2-3 hours", "title": "Songshan Cultural and Creative Park", "transport": "Take the MRT Bannan Line to Sun Yat-sen Memorial Hall Station or Taipei City Hall Station, then walk for about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A charming red-brick historic complex formerly serving as a winery, now home to diverse exhibitions, specialty boutique shops, and trendy indie cafes.", "duration": "2-3 hours", "title": "Huashan 1914 Creative Park", "transport": "Take the MRT Bannan Line or Zhonghe-Xinlu Line to Zhongxiao Xinsheng Station, Exit 1, and walk for about 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Beautifully preserved Baroque-style heritage streets filled with the fragrant aromas of traditional dried goods, herbal medicines, and modern lifestyle shops.", "duration": "2-3 hours", "title": "Dadaocheng Dihua Street Historic District", "transport": "Take the MRT Songshan-Xindian Line to Beimen Station, Exit 3, and walk for about 8 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | One of the largest zoos in Asia, featuring spacious natural habitats and beloved exhibits such as the Giant Panda House and Koala House.", "duration": "3-5 hours", "title": "Taipei Zoo", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, Exit 1."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Glide over lush mountain canopies in glass-bottomed crystal cabins, combined with tea tasting and stunning night views in Maokong.", "duration": "2-3 hours", "title": "Maokong Gondola", "transport": "Take the MRT Wenhu Line to Taipei Zoo Station, then transfer to the Maokong Gondola Taipei Zoo Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Former presidential residence and gardens featuring vibrant themed floral exhibitions throughout the year, such as chrysanthemum and tulip shows.", "duration": "1-2 hours", "title": "Shilin Official Residence Park", "transport": "Take the MRT Tamsui-Xinyi Line to Shilin Station, Exit 2, and walk for about 7 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A municipal historic monument blending Japanese and English architectural styles, showcasing the rich history and culture of Beitou\u0027s hot springs.", "duration": "1 hour", "title": "Beitou Hot Spring Museum", "transport": "Take the MRT Xinbeitou Branch Line to Xinbeitou Station, and walk for about 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Taiwan\u0027s first modern art museum, featuring sleek contemporary architecture and regularly hosting premier local and international art exhibitions.", "duration": "2 hours", "title": "Taipei Fine Arts Museum", "transport": "Take the MRT Tamsui-Xinyi Line to Yuanshan Station, Exit 1, and walk for about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | The oldest museum in Taiwan, housed in an elegant Western Classical style building featuring captivating natural history exhibitions.", "duration": "1-2 hours", "title": "National Taiwan Museum Main Hall", "transport": "Take the MRT Tamsui-Xinyi Line to NTU Hospital Station, Exit 4, and walk for about 3 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | A hillside historical settlement seamlessly blending local residents\u0027 daily lives with creative art installations by resident artists.", "duration": "1.5-2 hours", "title": "Treasure Hill Artist Village", "transport": "Take the MRT Songshan-Xindian Line to Gongguan Station, Exit 1, and walk for about 12 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | An urban amusement park specially designed for families, featuring a Ferris wheel, carousel, and a wide variety of fun rides.", "duration": "3-4 hours", "title": "Taipei Children\u0027s Amusement Park", "transport": "Take the MRT Tamsui-Xinyi Line to Jiantan Station, then transfer to the Children\u0027s Amusement Park Shuttle Bus for about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A majestic palace-style building featuring exhibition halls and Zhongshan Park, offering clear, unobstructed panoramic views of Taipei 101.", "duration": "1-2 hours", "title": "National Sun Yat-sen Memorial Hall", "transport": "Take the MRT Bannan Line to Sun Yat-sen Memorial Hall Station; Exit 4 provides direct access."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | Preserves red-brick streetscapes blending Qing Dynasty and Japanese colonial architecture, filled with a nostalgic retro vibe and fascinating historical displays.", "duration": "1 hour", "title": "Bopiliao Historical Block", "transport": "Take the MRT Bannan Line to Longshan Temple Station, Exit 3, and walk for about 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Dedicated to Guan Sheng Di Jun (Guan Yu), this temple offers a solemn, serene atmosphere and is famous for its soul-calming rituals and eco-friendly practice of not burning incense or paper money.", "duration": "1 hour", "title": "Xingtian Temple", "transport": "Take the MRT Zhonghe-Xinlu Line to Xingtian Temple Station, Exit 3, and walk for about 3 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | A traditional Southern Fujianese-style temple rich in Confucian culture, offering a quiet, peaceful atmosphere with deep educational significance.", "duration": "1 hour", "title": "Taipei Confucius Temple", "transport": "Take the MRT Tamsui-Xinyi Line to Yuanshan Station, Exit 2, and walk for about 8 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A rare wooden Japanese-style Buddhist temple preserved from the Japanese colonial period. Its Main Hall features an elegant, solemn architectural style, making it a highly valuable historical asset in Taipei.", "duration": "1 hour", "title": "Linji Huguo Chan Temple", "transport": "Walk for about 3 minutes from Exit 2 of MRT Yuanshan Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Home to the rich natural ecology and archaeological ruins of the Taipei Basin, featuring the Zhishan Rock Huiji Temple and prehistoric cultural sites\u2014perfect for in-depth exploration of history and nature.", "duration": "2-3 hours", "title": "Zhishan Cultural and Ecological Garden", "transport": "From Exit 1 of MRT Zhishan Station, take a bus or walk for about 15 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Established during the Japanese colonial period, this historic botanical garden houses the heritage Imperial Minister\u0027s Guest House and lush vegetation. Its lotus pond is a must-visit spot for photography enthusiasts.", "duration": "2 hours", "title": "Taipei Botanical Garden", "transport": "Walk for about 5 minutes from Exit 3 of MRT Xiaonanmen Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Formerl         let myTrip = { 1: [] };

        // Toggle Mobile Cart Drawer
        function toggleMobileCart() {
            if (cartDrawer.classList.contains('drawer-closed')) {
                cartDrawer.classList.remove('drawer-closed');
                cartDrawer.classList.add('drawer-open');
                mobileOverlay.classList.remove('hidden');

                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }
        }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {

            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function switchTab(tab) {

        function filterCategory(category) {

            ['All', '🏛️ Attractions', '🛍️ Shopping', '🍜 Dining', ...dynamicCats].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>

                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');

            daySelector.appendChild(option);
            daySelector.value = totalDays;

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
