    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 5 Stars | Myanmar\u0027s most sacred Buddhist site. The top of the pagoda is adorned with thousands of diamonds and precious gems, offering a breathtaking, dazzling view as the sun sets.", "duration": "2-3 hours", "title": "Shwedagon Pagoda", "transport": "About a 15-minute taxi ride from downtown Yangon"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | An octagonal golden pagoda with over 2,000 years of history. Situated in a central traffic circle, it serves as an iconic landmark and the focal point of Yangon\u0027s urban planning.", "duration": "1-2 hours", "title": "Sule Pagoda", "transport": "Located at the transportation hub of downtown Yangon, easily reachable on foot or by city bus"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Houses one of Myanmar\u0027s largest indoor reclining Buddha statues, measuring 65 meters long. The soles of its feet are carved with 108 intricate symbols representing the Buddha\u0027s worldview.", "duration": "1-2 hours", "title": "Chaukhtatgyi Buddha Temple", "transport": "About a 20-minute taxi ride from downtown"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Features a colossal seated Buddha statue set against an intricately carved wooden backdrop, exuding solemnity and immense cultural art value.", "duration": "1 hour", "title": "Nga Htat Gyi Buddha Temple", "transport": "Located opposite Chaukhtatgyi Buddha Temple, about a 5-minute walk away"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Renowned for its unique hollow pagoda design, allowing visitors to walk through inner passageways to view precious sacred Buddha relics and ancient artifacts up close.", "duration": "1-2 hours", "title": "Botataung Pagoda", "transport": "Located on the banks of the Yangon River, about a 10-minute taxi ride from Sule Pagoda"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A classic historic market built during the British colonial era. With thousands of stalls, it is the top destination for browsing Burmese jade, handcrafts, and souvenirs.", "duration": "2-3 hours", "title": "Bogyoke Aung San Market", "transport": "About a 10-minute walk from downtown, or accessible by taxi"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A scenic lakeside park featuring wooden boardwalks. It is a marvelous spot to admire the reflection of Shwedagon Pagoda on the water and enjoy a relaxing walk.", "duration": "1-2 hours", "title": "Kandawgyi Park", "transport": "About a 10-minute taxi ride from Shwedagon Pagoda"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A colossal structure modeled after the mythical Burmese golden royal barge. Extraordinarily magnificent at sunset, its interior frequently hosts traditional dance performances.", "duration": "1-2 hours", "title": "Karaweik Palace", "transport": "Located on the eastern side of Kandawgyi Park, accessible directly by taxi to the entrance"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | The largest artificial lake in Yangon, surrounded by lush greenery and a tranquil atmosphere. It is a popular spot for locals and couples to enjoy romantic strolls.", "duration": "1-2 hours", "title": "Inya Lake", "transport": "About a 25-minute taxi ride north from downtown"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Displays a rich collection of Burmese historical artifacts and artwork, highlighted by relics of General Aung San and the splendid Lion Throne of the Konbaung Dynasty.", "duration": "2-3 hours", "title": "National Museum of Myanmar", "transport": "About a 15-minute taxi ride from downtown"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | The largest Catholic church in Myanmar, featuring an elegant red-brick Neo-Gothic architectural design adorned with beautiful stained glass windows inside.", "duration": "1 hour", "title": "St. Mary\u0027s Cathedral", "transport": "About a 10-minute walk from Yangon Central Railway Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A landmark building blending Western architectural structures with traditional Burmese peacock motifs, serving as one of Yangon\u0027s iconic colonial-era heritage sites.", "duration": "0.5-1 hour", "title": "Yangon City Hall", "transport": "Located next to Sule Pagoda, easily accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A downtown green oasis featuring the Independence Monument at its center, surrounded by numerous historic colonial-era government buildings.", "duration": "1 hour", "title": "Maha Bandula Park", "transport": "Located opposite Sule Pagoda and City Hall, within walking distance"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | The former residence of General Aung San, the father of modern Myanmar. Preserving his original furniture, books, and daily items, it is an excellent place to learn about modern Burmese history.", "duration": "1-2 hours", "title": "Bogyoke Aung San Museum", "transport": "About a 10-minute taxi ride from Kandawgyi Park"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A historic British-style building constructed in 1908. Its vibrant red-brick walls exude classic charm, and it remains an operational post office selling commemorative stamps today.", "duration": "0.5-1 hour", "title": "Yangon General Post Office", "tran e tourist market at the foot of Kyaikhto mountain, within walking distance."}];

            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;

                    } else {

                    const filterLower = currentFilter.toLowerCase();

                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added

                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
