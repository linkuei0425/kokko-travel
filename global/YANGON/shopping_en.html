yin Myoma Market, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | Must-Buys: Hand-printed Longyis, traditional Myanmar silk scarves, handmade cotton/linen bags. This long-standing fabric and apparel shop inside Thanlyin Central Market is a local favorite. It offers a comprehensive collection of traditional Myanmar Longyis, ranging from affordable everyday cotton options to luxurious hand-woven silk styles for festive occasions. They also provide on-site custom tailoring, attracting many travelers looking to try traditional attire before visiting the Kyauktan Yele Pagoda.", "name": "Thanlyin Myoma Market Silk \u0026 Fabrics", "transport": "About a 45-minute taxi ride from downtown Yangon across the Thanlyin Bridge to Thanlyin Myoma Market."}, {"address": "Station Road, Near Thanlyin Market, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Gold-embroidered handwoven Longyis, royal-style Pasos, handmade fabric tote bags. This independent local shop is famous for its exquisite gold thread embroidery and high-quality Myanmar sarongs, making it a go-to spot for locals dressing up for weddings or temple festivals. The owner insists on using fabrics woven by local artisans featuring traditional patterns from the Bago Dynasty and Southern Myanmar. Lightweight and breathable, these pieces make iconic souvenirs.", "name": "Thanlyin Star Silk \u0026 Longyi House", "transport": "Located on Station Road near Thanlyin Market, about a 5-minute walk from the main market."}, {"address": "Pagoda Landing Road, Kyauktan Township, Thanlyin Suburb, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Traditional Myanmar velvet slippers, woven water reed bags, embroidered ethnic crossbody bags. Located near the Kyauktan Yele Pagoda jetty, this shop specializes in authentic Myanmar-style footwear and woven bags. Its most popular items are traditional velvet slippers\u2014soft, comfortable, and elegantly colored footwear loved by people of all ages across Myanmar. They also combine local reed-weaving craft to create beautiful, breathable tote and crossbody bags highly praised by tourists.", "name": "Kyauktan Yele Pagoda Craft Shoes \u0026 Bags", "transport": "Drive from Thanlyin town to the Kyauktan Yele Pagoda jetty; the shop is located right along the pier walkway."}, {"address": "Main Street, Thanlyin Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buys: Karen traditional pattern crossbody bags, handwoven tassel bags, ethnic clutches. Tucked away in the outskirts of Thanlyin, this artisan studio sells clothing and bags entirely handwoven by women from the local Karen ethnic minority. Each piece features vibrant geometric patterns dyed with natural plant extracts, oozing artisanal warmth. Shopping here supports local women\u0027s employment, making it a meaningful visit for high-quality cultural crafts.", "name": "Karen Handwoven Bag \u0026 Fashion Studio Thanlyin", "transport": "About an 8-minute ride by tuk-tuk or taxi from Thanlyin town center."}, {"address": "Yangon-Thanlyin Bridge Road, Thanlyin Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Classic black velvet handmade slippers, handcrafted men\u0027s leather sandals, embroidered women\u0027s flats. Boasting decades of history, this artisan footwear workshop focuses on creating durable and comfortable traditional Myanmar footwear. Their signature leather sandals are crafted by hand from high-quality local leather, offering great support. Their traditional velvet slippers feature gold thread piping, giving them a royal, exotic charm rooted in local culture.", "name": "Thanlyin Traditional Velvet Slippers \u0026 Leather Workshop", "transport": "Located near the off-ramp of the Yangon-Thanlyin Bridge; convenient to pull over for shopping when traveling by taxi."}, {"address": "University Road, Near Thanlyin Technological University, Thanlyin, Yangon", "feature": "\u2b50 4.1 stars | Must-Buys: Canvas bags printed with Myanmar script, lightweight waterproof canvas backpacks, affordable casual footwear. Situated near Thanlyin Technological University, this boutique is a trendy favorite among local students. Alongside affordable casual wear, its main attraction for tourists is the exclusive collection of indie canvas bags printed with Burmese script and shoes/bags featuring Yangon landmark graphics\u2014practical souvenirs with a modern local vibe.", "name": "Thanlyin Youth Fashion \u0026 Bag Shop", "transport": "About a 10-minute Grab or local tricycle ride from Thanlyin town center to the university area."}, {"address": "Aung San Market Street, Thanlyin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Handwoven Myanmar shoulder bags, hand-embroidered short-sleeve tops, printed linen tote bags. This cozy boutique specializes in everyday clothing and bags made from locally sourced cotton and linen fabrics. The designs blend modern minimalist cuts with traditional Myanmar embroidery, making them breathable and perfect for the tropical Southeast Asian climate. Their handmade fabric bags are lightweight, easy to pack, and feature unique patterns\u2014making them ideal gifts.", "name": "Jade Land Handmade Fabric Bags \u0026 Apparel", "transport": "Located in the Thanlyin Aung San Market area, about a 6-minute walk from the Thanlyin Bus Station."}, {"address": "Pagoda Street, Near Shwe Maw Daw Pagoda, Thanlyin, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Vintage handmade genuine leather briefcases, leather bifold wallets, handcrafted leather tote bags. This independent leather workshop and retail shop in Thanlyin specializes in 100% hand-stitched leather bags and accessories. The owner carefully selects high-quality local leather processed using traditional techniques, highlighting natural textures and durable craftsmanship. Prices are more affordable than in downtown Yangon, and custom engraving services are available, making it popular with quality seekers and tourists alike.", "name": "Thanlyin Artisan Leather Bags \u0026 Accessories", "transport": "About a 5-minute drive from Thanlyin Central Market."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Main Road, Kyauktan Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Must-Buy List: Kyauktan specialty pickled cucumbers, traditional handmade Burmese pickled tea leaf salad kits (Lahpet), and local wild cashews. Located en route to the Ye Le Pagoda (Water Pagoda), this vibrant traditional market offers an authentic slice of local daily life. Vendors sell genuine Burmese snacks and specialty agricultural produce at prices noticeably cheaper than downtown Yangon. Locals highly recommend purchasing freshly ground Thanaka powder and ancient-style roasted nuts.", "name": "Kyauktan Myoma Market", "transport": "Take a taxi from downtown Yangon across the Thanlyin Bridge (approx. 1 hour); or take YBS Bus No. 31 to the Kyauktan terminal station."}, {"address": "Ye Le Paya Road, Kyauktan, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-carved wooden small Buddha statues, traditional Burmese marionettes (Yoke th\u00e9), and auspicious brass bells. Gathered around the jetty area before and after crossing the river to Kyauktan Ye Le Pagoda are dozens of unique handicraft stalls. They sell items rich in local religious color and water-village charm; exquisite handmade puppets and peace-symbolizing brass bells make the most iconic and highly collectible souvenirs.", "name": "Kyauktan Ye Le Pagoda Jetty Souvenir Stalls", "transport": "Stalls are visible on both sides of the jetty before taking the ferry to the Ye Le Pagoda."}, {"address": "Station Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Must-Buy List: Handwoven Longyi, Burmese tamarind candy, and seasoned fried bean crackers. The busiest central traditional market in Thanlyin Township, boasting decades of history. It houses many long-standing independent shops selling textiles and dry goods, making it the best place to purchase traditional Longyi garments and nostalgic Burmese snacks. Most shopkeepers are local residents offering friendly service and heartwarming hospitality.", "name": "Thanlyin Myoma Market", "transport": "Take a taxi from downtown Yangon across the Thanlyin Bridge and drive straight for about 10 minutes."}, {"address": "Star City, Kyaikkauk Pagoda Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Must-Buy List: Royal Myanmar Teamix instant milk tea, Grand Royal Whisky, and local Burmese coconut candy. A premium supermarket located within the large Star City residential complex in Thanlyin, offering a clean and comfortable shopping environment. It gathers Myanmar\u0027s most popular local snack brands and souvenirs, ideal for travelers wanting a one-stop shop for safely packaged food items and popular milk tea mixes.", "name": "City Mart Supermarket - Star City Branch", "transport": "Take a taxi for about 8 minutes from Technological University (Thanlyin), or take a taxi directly from downtown Yangon into the Star City compound."}, {"address": "Kyaikkauk Pagoda Road, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Must-Buy List: Teakwood carved mini elephants, Burmese lacquerware teabowls, and natural Thanaka stone grinding slabs. An independent local craft studio located on the outskirts of Thanlyin, where local artisans handcraft woodcarvings and traditional lacquerware. Every piece here is a unique work of art rich in Burmese cultural heritage\u2014perfect for visitors who appreciate tasteful home goods and high-quality craftwork.", "name": "Mustard Seed Crafts \u0026 Woodcarving Studio", "transport": "About a 5-minute taxi ride from Kyaikkauk Pagoda."}, {"address": "Kyaikkauk Pagoda Street, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Must-Buy List: Woven bamboo picnic bags, raw Thanaka wood logs, and specialty Burmese dried spices. Surrounding Thanlyin\u0027s most famous Kyaikkauk Pagoda is a vibrant shopping street filled with religious and traditional charm. Besides Buddhist offerings, there are numerous local folk handicraft shops; the woven bamboo bags and authentic Thanaka wood logs are especially popular among foreign tourists.", "name": "Kyaikkauk Pagoda Souvenir Street", "transport": "Take YBS Bus No. 31 and get off at the Kyaikkauk Pagoda stop."}, {"address": "Riverfront Road, Near Thanlyin Bridge, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Must-Buy List: Traditional Burmese shrimp paste (Ngapi), spicy dried anchovies, and crispy fried garlic chips. A long-established local dried goods shop located near the riverbank, specializing in dried seafood and coastal/river specialties. The shop adheres to traditional methods to craft essential Burmese soul seasonings and crispy side snacks. Featuring bold, authentic flavors, these make excellent culinary souvenirs for experiencing Burmese traditional food culture.", "name": "Syriam Riverside Dried Seafood \u0026 Spice Shop", "transport": "Located along the riverfront road near the exit of the Thanlyin Bridge; taking a taxi is recommended."}, {"address": "Bogyoke Street, Kyauktan, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Must-Buy List: Fermented tea leaf salad kit (Lahpet Thoke kit), crispy cashew brittle, and premium Burmese high-mountain green tea. A long-standing traditional dry goods store in Kyauktan town specializing in high-quality highland Burmese teas and nut snacks. Their signature tea leaf salad kit comes paired with specially seasoned fried beans, allowing you to easily recreate Myanmar\u0027s authentic national dish, \u0027Lahpet Thoke\u0027 (Tea Leaf Salad), right at home.", "name": "Kyauktan Traditional Tea \u0026 Nut Specialty Store", "transport": "About a 3-minute walk from Kyauktan Market."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "Thilawa Special Economic Zone, Thanlyin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Export-grade sportswear and running shoes, high-quality Myanmar export cotton clothing, imported duty-free skincare gift sets. Located in the Thilawa Special Economic Zone near Thanlyin, this is the most iconic outlet shopping center in the Yangon region. Bringing together numerous export factories and brand-direct stores, past-season international apparel and sporting goods are often sold at incredible discounts of 50% to 70% off retail price, making it the top treasure-hunting spot for locals and savvy travelers alike.", "name": "Thilawa SEZ Brand \u0026 Factory Outlet", "transport": "Take a taxi from downtown Thanlyin and head south along Thilawa Development Road for about 20 minutes."}, {"address": "Star City, Kyaikkasan Road, Thanlyin Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Star City exclusive Myanmar highland Arabica coffee beans, premium Thanaka skincare sets, local Myanmar tamarind soft candies. Nestled inside Star City, a large high-end community in Thanlyin, this complex shopping center blends a modern hypermarket supermarket with several iconic local boutique shops. Here you\u0027ll find exquisite local designer apparel stores alongside high-quality local organic food counters. The clean, comfortable shopping environment makes it extremely popular with local middle-class residents and expats.", "name": "Star City Retail Center \u0026 Marketplace", "transport": "After crossing the Thanlyin Bridge, turn right into the Star City community; it is about a 10-minute drive."}, {"address": "Bogyoke Street, Thanlyin Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buy List: Thanlyin hand-woven bamboo baskets, traditional printed handmade Longyis, handmade brown sugar coconut crackers. This multi-story shopping complex is Thanlyin\u0027s most historically representative local department store. The basement and first floor house dry goods and specialty products, while upper floors feature local clothing stores and traditional fabric wholesale shops beloved by locals. If you want to experience an authentic traditional shopping atmosphere and buy handicrafts at highly affordable prices, don\u0027t miss this place.", "name": "Thanlyin Myoma Market Shopping Complex", "transport": "Take Yangon YBS Bus No. 31, get off at Thanlyin Market station, and walk for 2 minutes."}, {"address": "Station Road, Thanlyin Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Amarapura-style pure silk Longyis, hand-embroidered motif tote bags, traditional plant-dyed cotton and linen scarves. A factory outlet established directly by a major local textile manufacturer on the outskirts of Thanlyin, specializing in clearing exquisite traditional Myanmar silk and cotton clothing at wholesale discount prices. Featuring delicate patterns and breathable fabrics suited for tropical climates, it is the premier spot to buy traditional attire and fabric souvenirs.", "name": "Myanmar Silk \u0026 Longyi Factory Outlet Thanlyin", "transport": "Take a taxi directly to the edge of the industrial zone on Thanlyin Station Road to see the factory outlet storefront."}, {"address": "Min Nandar Road, Thaketa Township, Yangon (Near Thanlyin Bridge)", "feature": "\u2b50 4.4 stars | Must-Buy List: Royal Myanmar 3-in-1 Tea Mix, premium Myanmar cashew nut gift boxes, local herbal balm. Located near the western gateway of the Thanlyin Bridge, this massive hypermarket is the preferred destination for Thanlyin residents crossing the bridge to shop for daily necessities and local specialties. The store features a huge display area for local food and daily items with an exceptionally comprehensive selection, frequently hosting various promotional discounts for local brands.", "name": "Capital Hypermarket Thaketa", "transport": "From downtown Thanlyin, cross the Thanlyin Bridge and drive along Min Nandar Road for about 5 minutes."}, {"address": "Yangon-Thanlyin Main Road, Thanlyin Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Natural Myanmar jade small pendants, handmade lacquerware tea sets, finely carved teakwood Buddha ornaments. Situated alongside Thanlyin\u0027s main road, this flagship local specialty center brings together exquisite works from artisans in the Yangon suburbs, selling them at discounted prices lower than downtown counters. Offering strict quality certification, it is a popular spot for purchasing natural jade jewelry and fine lacquerware crafts.", "name": "Thanlyin Gems \u0026 Local Craft Center", "transport": "Take a taxi from downtown Thanlyin along the Yangon-Thanlyin Main Road for about 8 minutes."}, {"address": "Corner of Myanmar Plaza Avenue \u0026 East Dagon Main Rd, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar jasmine rice gift boxes, Shwe Pyi Nann Thanaka lotion, traditional canned spicy shrimp paste. A major chain hypermarket serving Yangon\u0027s eastern suburbs and the Thanlyin gateway commercial area. In addition to a heavily stocked supermarket, it houses large budget clothing outlets and local grocery chain stores. Bright and spacious, it is an ideal place to shop for food souvenirs and affordable everyday apparel.", "name": "Ocean Supercenter East Dagon", "transport": "Head north by taxi from Thanlyin Bridge for about 10 to 12 minutes."}, {"address": "Pagoda Road, Kyauktan Township, Thanlyin District, Yangon", "feature": "\u2b50 4.0 stars | Must-Buy List: Kyauktan mini carved wooden boat ornaments, handmade fried fish cracker packs, local woven straw sun hats. Located next to the ferry pier of Thanlyin\u0027s most famous landmark, the Ye Le Pagoda (Kyauktan Water Pagoda), this vibrant shopping complex comprises dozens of local independent vendors and specialty shops. It offers a rich variety of local Thanlyin handicrafts and traditional old-school snacks with a charming, rustic water-town vibe at very friendly prices.", "name": "Kyauktan Water Pagoda Riverfront Shopping Arcade", "transport": "Take a Songthaew or taxi from downtown Thanlyin directly to the entrance of the Kyauktan Water Pagoda pier."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Thanlyin and Ye Le Pagoda Suburbs"}, "yankin_kabaraye": {"categories": {"cat_1": {"items": [{"address": "Ground Floor, Myanmar Plaza, Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Thanaka Sunscreen Compact Powder, Long-Lasting Bright Lipstick, Thanaka Hydrating Mist. Bella is a highly iconic homegrown cosmetics brand in Myanmar, beloved by local young women. It blends traditional Myanmar Thanaka with modern cosmetics technology, offering excellent quality at extremely affordable prices. Their makeup shades are tailored perfectly for Asian skin tones.", "name": "Bella Cosmetics - Myanmar Plaza", "transport": "Take Bus 36 or 37 and get off at Myanmar Plaza Station."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buys: Natural Thanaka Log Powder Blocks, Thanaka Skincare Ointment, Thanaka Lemon Facial Cleanser. Shwe Pyi Nann is Myanmar\u0027s most famous natural Thanaka brand, specializing in beauty products that blend traditional roots with innovation. For centuries, Myanmar women have used Thanaka as a natural sunscreen and skincare holy grail; this shop offers the purest, additive-free skincare products.", "name": "Shwe Pyi Nann Thanaka Shop - Kabar Aye", "transport": "Take a taxi toward Kabar Aye Pagoda; the specialty store is visible along Kabar Aye Pagoda Road."}, {"address": "Market Place by City Mart, Myanmar Plaza, Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Myanmar Herbal Hair Oil, Taunggyi Thanaka Balm, Coconut Oil Repair Lip Balm. Located inside the upscale Market Place supermarket, this comprehensive health and beauty section brings together many high-quality local herbal skincare products and cosmetics. Strict quality control makes it a trusted, one-stop shop for foreign tourists to buy local beauty products and souvenirs.", "name": "City Mart Pharmacy \u0026 Beauty Corner - Myanmar Plaza", "transport": "Take a taxi or bus to Myanmar Plaza and enter Market Place on the lower level."}, {"address": "Yankin Road, near Yankin Centre, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Natural Thanaka Mask Cream, Wild Ginger Herbal Shampoo, Myanmar Sandalwood Body Lotion. A neighborhood herbal cosmetics shop frequented by Yankin locals, offering a variety of small-batch organic skincare products from local workshops. Featuring all-natural, lightweight ingredients infused with rich Myanmar botanical scents, the prices are very budget-friendly.", "name": "May Beauty \u0026 Herbal Shop - Yankin", "transport": "About a 5-minute walk from Yankin Centre."}, {"address": "Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buys: Secret Thanaka Anti-Acne Gel, Coconut Hydrating Body Lotion, Organic Herbal Handmade Soap. This specialty shop belongs to a local skincare brand emphasizing natural and organic products. Combining traditional Myanmar herbs with modern dermatology, its gentle, non-irritating formulas and elegant packaging make it wildly popular among quality-conscious skincare enthusiasts.", "name": "Nature\u0027s Secret Cosmetics - Kabar Aye Branch", "transport": "Take a taxi along Kabar Aye Pagoda Road; located about 500 meters north of Myanmar Plaza."}, {"address": "Kanbe Road, Yankin Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buys: Traditional Herbal Healing Balm, Refreshing Thanaka Sunscreen, Myanmar Rose Hydrosol. A large local pharmacy located in the Yankin commercial district. Beyond standard pharmaceuticals, it features a spacious local cosmetics section where neighborhood women shop for affordable, effective local sunscreens and natural botanical beauty items.", "name": "Yangon Health \u0026 Beauty Care - Yankin", "transport": "Take a taxi and get off at the intersection of Kanbe Road and Yankin Road."}, {"address": "Opposite Kabar Aye Pagoda, Kabar Aye Pagoda Rd, Yankin Area, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Traditional Myanmar Thanaka Setting Powder, Wild Camellia Seed Facial Oil, Herbal Mosquito Repellent \u0026 Skin Mist. Located near Kabar Aye Pagoda, this long-standing shop is popular with locals and tourists alike. It showcases a wide array of pure natural plant beauty products from Myanmar, with its ancient-formula setting powder remaining a best-seller for years.", "name": "Myanmar Herbal Pharmacy \u0026 Beauty - Kabar Aye", "transport": "Take Bus 43 to Kabar Aye Pagoda Station and cross the street."}, {"address": "Pearl Centre, Kabar Aye Pagoda Rd, Yankin Area, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Herbal Essential Oil Anti-Wrinkle Cream, Thanaka Deep Cleansing Mask, Myanmar Jasmine Fragrance Mist. A charming boutique inside the Pearl Centre shopping gallery in Yankin, featuring fragrances and skincare made from local Myanmar plant extracts. The friendly staff warmly explain the traditional benefits of each herb, and generous free gifts are offered with larger purchases.", "name": "Oriental Herbal Beauty - Pearl Centre Branch", "transport": "Take a taxi to Pearl Centre; it is located on the ground floor inside the mall."}], "name": "Iconic Local Beauty \u0026 Cosmetics Shops"}, "cat_2": {"items": [{"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Men\u0027s plaid longyi (Pasoe), women\u0027s printed tubular skirt (Ahmay Htain), pure cotton handmade belt. This shop is a highly iconic traditional clothing store in Yankin Township, offering hundreds of traditional Myanmar longyis in various fabrics and patterns. Friendly staff will demonstrate on-site how to tie and wear them. The fabric is breathable and comfortable, perfect for the local hot climate.", "name": "Dagon Longyi Yankin", "transport": "Take a taxi to near Myanmar Plaza, then walk about 3 minutes to arrive."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Modernized Myanmar silk blouse, handwoven linen blouse, independent designer styled silk scarf. A local independent fashion brand that combines traditional Myanmar weaving craftsmanship with modern fashion cuts. Partnering with local tribal women, they use naturally plant-dyed fabrics that are lightweight, breathable, and uniquely aesthetically pleasing, making them popular among local white-collar workers and foreign tourists.", "name": "Rangoon Design House Yankin", "transport": "About a 5-minute walk from Yankin Centre."}, {"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade cowhide tote bag, Myanmar-style flip-flops, genuine leather business card holder. Located along the main tourist thoroughfare of Kaba Aye Pagoda Road, it specializes in handcrafted leather goods by local artisans. The leather is soft yet durable with fine stitching, and the prices are very affordable. Among them, handbags incorporating Myanmar woven elements are the store\u0027s top bestseller.", "name": "Bella Myanmar Leather \u0026 Shoes", "transport": "Take Bus No. 36 to Myanmar Plaza Station and walk for 2 minutes."}, {"address": "Kanbe Road, Yankin Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Mandalay handmade silk shawl, premium gold thread embroidered longyi, traditional cotton-linen short-sleeved top. This is a highly prestigious luxury traditional clothing store in Yankin Township, where many locals custom-make attire for celebrations or weddings. The shop displays a wide variety of elegant silk creations featuring vibrant colors and a fantastic touch.", "name": "Shwe Htee Silk \u0026 Longyi", "transport": "Located near Kanbe Station, easily accessible by taking the Circle Line train or a taxi."}, {"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Kachin tribal pattern crossbody bag, handwoven ethnic-style handbag, handmade embroidered flats. This shop specializes in distinctive textiles and bags from Myanmar\u0027s ethnic minorities (especially Kachin and Shan tribes). The classic geometric pattern crossbody bags are spacious and durable, showcasing rich Myanmar indigenous cultural characteristics, making them high-quality souvenirs full of commemorative value.", "name": "Kachin Tribal Weaving \u0026 Bags", "transport": "Take a taxi and get off near Kaba Aye Pagoda, then walk for about 6 minutes."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Handmade velvet flip-flops (Hnyat-phanat), embroidered royal-style flats, pearl-decorated women\u0027s sandals. Traditional Myanmar velvet slippers are an everyday and formal essential for locals. This shop specializes in high-end velvet footwear; the uppers are soft to the touch with elegant patterns, offering great comfort underfoot. It is an iconic footwear option that combines practicality with local culture.", "name": "Royal Velvet Sandals Yangon", "transport": "Take a taxi to the vicinity of Yankin Centre shopping mall, then walk for 3 minutes."}, {"address": "Sayar San Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade bamboo picnic basket, seagrass woven tote bag, printed linen sun hat. This cozy local boutique features rattan and bamboo woven bags handmade by rural Myanmar women. Stylish in design and sturdy in structure, paired with colorful fabric linings, they exude a lovely resort vibe and are deeply loved by female tourists.", "name": "Golden Lotus Handwoven Bags \u0026 Crafts", "transport": "Located on the Sayar San Road commercial street; taking a direct taxi is most convenient."}, {"address": "Universal Street, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Plant-dyed cotton-linen wide-leg pants, handmade cotton dress, ethnic embroidered scarf. A local independent clothing brand emphasizing eco-friendly and organic materials, located in a quiet lane in Yankin Township. The designs are simple and relaxed, perfect for Southeast Asian island and urban travel, with every garment individually tailored and crafted by local artisans.", "name": "Yankin Green Linen \u0026 Cotton Studio", "transport": "Take a taxi to near Yankin Township Hall, turn onto Universal Street, and walk to arrive."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "1st Floor, Myanmar Plaza, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Royal Myanmar Teamix 3-in-1 Milk Tea, Myanmar Spicy Crispy Shrimp Paste, Fermented Tea Leaf Salad Kit (Lahpet Mix). Located inside Myanmar Plaza, the premier high-end shopping center in Yankin Township, this is the top choice for purchasing high-quality local souvenirs. The supermarket features a dedicated section for Myanmar local specialties with beautifully packaged, hygienic, and guaranteed quality products. The Royal Myanmar Milk Tea is highly recommended for its rich, aromatic flavor and is a favorite among tourists stocking up on goodies.", "name": "Marketplace by City Mart - Myanmar Plaza", "transport": "Take a taxi to Myanmar Plaza Shopping Center; Marketplace supermarket is visible right upon entering the 1st-floor lobby."}, {"address": "Corner of Kabar Aye Pagoda Road and Set Hmu 1 Street, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Tamarind Candy, Shan State Highland Dried Nuts, Traditional Crispy Fried Bean Cake Snack Packs. This hypermarket is a major hub for Yankin locals\u0027 daily shopping and wholesale souvenir buys, offering very affordable prices. Here you can find authentic local snacks, especially the sweet and sour tamarind candy and crunchy Shan State nuts. They come in large, budget-friendly packages, making them perfect for sharing with colleagues and friends back home.", "name": "Ocean Supercenter - Yankin", "transport": "Take a taxi heading north along Kabar Aye Pagoda Road to the intersection of Set Hmu 1 Street."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.7 stars | Must-Buy List: Myanmar Organic Wild Honey, Handcrafted Artisanal Cheese, All-Natural Peanut Butter. Sharky\u0027s is Myanmar\u0027s most iconic local organic gourmet brand, helmed by a native founder who carefully selects high-quality local agricultural produce. This location on Kabar Aye Pagoda Road combines European style with local touches. Its organic wild honey and rich, natural peanut butter are widely loved by foreign tourists and affluent locals alike, making them premium souvenirs that combine quality with local charm.", "name": "Sharky\u0027s Artisanal Foods - Kabar Aye Pagoda Rd", "transport": "Take a taxi along Kabar Aye Pagoda Road; it is located a short distance east of the Inya Lake waterfront."}, {"address": "Kiosk Level 2, Myanmar Plaza, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Shan State Highland Arabica Coffee Beans, Single-Origin Drip Coffee Bags, Cascara (Coffee Cherry) Tea. Genius Coffee is a well-known local social enterprise and specialty coffee brand in Myanmar, carefully selecting high-quality organic Arabica coffee beans grown by ethnic minorities in the Shan State highlands. The kiosk inside Myanmar Plaza offers beans across various roast profiles and flavors with unique fruity and nutty notes. Packaged in designs rich with Myanmar ethnic heritage, it is an unmissable gift for coffee lovers.", "name": "Genius Coffee - Myanmar Plaza", "transport": "Enter Myanmar Plaza Shopping Center and take the escalator to the 2nd floor to find the kiosk."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Myanmar Cashew Cookies, Meringue Cookies, Condensed Milk Tea Powder Packs. Shwe Pu Zun is a prestigious vintage bakery brand in Yangon, cherished across generations. The Yankin branch retains a warm, nostalgic atmosphere, crafting handmade cashew cookies that are buttery, melt-in-your-mouth, aromatic, and distinctly local. The packaged classic cookie gift boxes are an ideal choice for tourists seeking a taste of Yangon\u0027s nostalgic flavors.", "name": "Shwe Pu Zun Cake \u0026 Tea Shop - Yankin", "transport": "Take a taxi to the Yankin Road commercial district to arrive."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Natural Thanaka Beauty Paste, Traditional Wooden Marionettes, Handwoven Bamboo \u0026 Rattan Bags. Located around the Kabar Aye Pagoda complex, this charming market gathers many local artisans and small vendors. Here, you can buy authentic Thanaka, Myanmar\u0027s iconic natural sun protection and cosmetic powder, available in packaged pastes or natural wood logs. You\u0027ll also find delicate traditional puppets and woven accessories. Prices are bargainable, making it a great spot to experience local street culture and pick up handmade souvenirs.", "name": "Kabar Aye Pagoda Souvenir Market", "transport": "Take a taxi directly to the market area near the entrance of Kabar Aye Pagoda."}, {"address": "Kanbe Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Fermented Tea Leaves Gift Sets, Mixed Crunchy Fried Bean \u0026 Nut Packs, Specialty Tea Salad Dressing. Myanmar\u0027s national dish, \u0027Lahpet Thoke\u0027 (Fermented Tea Leaf Salad), is a traditional delicacy that every visitor must try and buy. This specialty shop in Yankin offers hygienically packaged fermented tea leaves, separately pairing sour and savory tea leaves with crunchy garlic chips, peanuts, and fava beans. Easy to mix and enjoy at home, its rich and layered texture makes it a truly unique, conversation-starting gift.", "name": "Lahpet \u0026 Co. Specialty Shop - Yankin", "transport": "Take a taxi to Kanbe Road, located near the Yankin residential and commercial complex."}, {"address": "Yankin Center, Corner of Yankin Road and Sayasan Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Thanaka Essential Oil Handmade Soap, Traditional Myanmar Lacquerware Jewelry Boxes, Handcrafted Herbal Tea Bags. A cozy independent boutique in the Yankin commercial area dedicated to integrating traditional Myanmar culture into modern lifestyle gifts. The best-selling Thanaka essential oil handmade soap features a natural herbal formula with a delicate fragrance that gently moisturizes. Exquisite handcrafted lacquerware boxes showcase ancient Burmese artistry, perfect as gifts for friends or desktop keepsakes.", "name": "Myanmar Craft \u0026 Thanaka Experience Shop - Yankin Center", "transport": "Take a taxi to inside Yankin Center Shopping Mall."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "192 Kabar Aye Pagoda Rd, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: City Mart specialty Myanmar tea leaf crisps/salad, local designer brand apparel, classic Myanmar highland coffee beans. A large international modern shopping center located on Kabar Aye Pagoda Road, bringing together many international and top local brands. The supermarket on the B1 floor offers Yangon\u0027s most complete selection of local souvenirs, such as famous Thanaka skincare products and premium Myanmar coffee, making it the top choice for experiencing Yangon\u0027s modern consumer culture and shopping for quality souvenirs.", "name": "Myanmar Plaza", "transport": "Take a taxi along Kabar Aye Pagoda Road, or take YBS Bus 36 or 37 and get off at Myanmar Plaza Station."}, {"address": "Kabar Aye Pagoda Rd, near Yankin Rd junction, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Must-Buy List: Out-of-season discounted Giordano cooling tees, bargain brand sneakers, clearance Myanmar traditional Longyi. Located in Yankin Township, this outlet center is a top spot for locals hunting for discounted brand names. It brings together overstock items from numerous Southeast Asian and international casual brands, often hosting clearance sales up to 70% off. It is an unmissable shopping gem for tourists looking to buy quality clothes and footwear at affordable prices.", "name": "Yankin Brand Outlet Center", "transport": "About a 5-minute taxi ride from Myanmar Plaza, or about a 10-minute walk along Kabar Aye Pagoda Road."}, {"address": "Corner of Kabar Aye Pagoda Rd and University Avenue Rd, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Must-Buy List: Royal Myanmar Teamix packets, local Myanmar cashews, Shwe Pyi Nann Thanaka skincare powder. As an iconic local hypermarket in Yangon, the Yankin branch offers an extremely wide variety of goods. Upper floors feature clothing and household items, while the first floor is a large-scale supermarket. Local snacks, Southeast Asian spices, and traditional beauty products here are competitively priced, making it very popular among the local middle class and tourists.", "name": "Ocean Supercenter Yankin", "transport": "Take YBS Bus 11 and get off at Ocean Supercenter Station, or take a 3-minute taxi ride from Sedona Hotel."}, {"address": "Yankin Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Must-Buy List: Traditional hand-embroidered long skirts, local Myanmar jade accessories, hand-woven bamboo bags. This historic community shopping center boasts rich local character, filled with small independent shops. Visitors can discover traditional Myanmar handicrafts, gold jewelry, and woven Longyis here at prices more affordable than tourist markets, with room for bargaining.", "name": "Yankin Center", "transport": "Take a taxi to Yankin Road near Yankin Center, or about a 5-minute drive from Myanmar Plaza."}, {"address": "Kabar Aye Pagoda Rd, near Sedona Hotel, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Must-Buy List: Natural Thanaka oil-control loose powder, Thanaka hydrating face masks, Myanmar-style limited edition lipsticks. Bella is Myanmar\u0027s most iconic domestic cosmetics brand, specially designed for Southeast Asian climate and skin types. This flagship store showcases products incorporating traditional Thanaka skincare ingredients into modern makeup. Affordable and beautifully packaged, they make highly appreciated local gifts for female friends and relatives.", "name": "Bella Cosmetics Yankin Flagship Store", "transport": "Located on Kabar Aye Pagoda Road near Sedona Hotel; walkable or accessible via a quick taxi ride."}, {"address": "117 Kabar Aye Pagoda Rd, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Myanmar wild honey, artisanal rare sea salt, local farm cheeses, and artisanal jams. Founded by a famous Myanmar foodie, Sharky\u0027s is synonymous with Yangon\u0027s top-tier local produce and lifestyle groceries. This store curates fine organic produce and homemade delicacies from various states across Myanmar, packed with authentic local charm and beloved by expats and food enthusiasts.", "name": "Sharky\u0027s Yankin", "transport": "Take a taxi straight along Kabar Aye Pagoda Road; located a short distance opposite Sedona Hotel."}, {"address": "Pearl Street, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Must-Buy List: Pure handmade Amarapura silk Longyis, traditional Myanmar men\u0027s jackets (Taungshay), hand-woven patterned scarves. This independent local clothing boutique specializes in fine Burmese handmade silk and traditional Longyis, with all fabrics sourced from local Burmese weavers. The store offers on-site custom tailoring, allowing customers to select premium printed fabrics to craft bespoke traditional attire, showcasing Myanmar\u0027s rich textile heritage.", "name": "Prome Silk \u0026 Longyi Store Yankin", "transport": "About a 6-minute taxi ride from Myanmar Plaza."}, {"address": "Kabar Aye Pagoda Rd, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: Rare Inle Lake lotus silk shawls, handmade lacquerware tea sets, Myanmar teakwood carvings. Specializing in high-end Myanmar specialties, this craft boutique highlights exquisite lotus silk textiles from the Inle Lake region and traditional black-and-gold lacquerware. Working directly with local artisans to ensure fair trade and quality, its items are far more refined than typical market goods, making it an excellent spot for collecting national-treasure level Burmese handicrafts.", "name": "Yangon Craft \u0026 Lotus Silk Boutique - Kabar Aye", "transport": "Take a taxi to the intersection of Kabar Aye Pagoda Rd and Yankin Rd, then follow the signs and walk for about 3 minutes."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "Yankin and Kabar Aye Commercial District"}};
        const cityName = "Yangon";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
