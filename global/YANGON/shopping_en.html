rience elegant Royal Burmese flair, this is the go-to destination for local elites and tourists alike.", "name": "Khaing Khaing Traditional Attire", "transport": "Take a taxi along Shin Saw Pu Road; it is adjacent to the Royal Valley shopping area."}, {"address": "Bo Gyoke Aung San Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Lightweight breathable linen wide-leg pants, Myanmar ethnic motif dresses, handmade woven bamboo crossbody bags. Situated in the artsy quarter of Dagon Township, this independent designer boutique creates original clothing for women seeking comfort and local aesthetics. Utilizing natural local Myanmar linen and pure cotton, the store designs tropical resort-style dresses and pants fused with traditional ethnic motifs. Their featured bamboo and rattan woven handbags are rich in artisanal details, perfect for strolling around Yangon.", "name": "Rangoon Design Store", "transport": "About a 6-minute taxi ride from the National Museum of Yangon."}, {"address": "Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | Must-buy list: Mandalay handwoven double-sided silk longyis, Myanmar-patterned handbags, cotton-linen blend traditional scarves. Golden Butterfly is a long-standing traditional clothing and textile shop located along the main avenue of Dagon Township. Partnering directly with artisanal weaving workshops across Myanmar\u0027s provinces, it offers an extensive collection of traditional skirts and handmade cloth bags. The fabrics boast rich colors that resist fading; locals and government officials frequently shop here for daily wear and gift bags thanks to transparent pricing and superior quality.", "name": "Golden Butterfly Silk \u0026 Bags", "transport": "Located on main Pyay Road; take a bus or taxi and get off in the Dagon section."}, {"address": "Nawaday Street, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Traditional velvet gold-thread embroidered slippers, royal-style beaded clutches, traditional Burmese ceremonial accessories. Burmese embroidered velvet slippers are the most famous traditional footwear in the country, and Royal Rose is the premier boutique in Dagon Township specializing in this fine craft. Footwear and bags are made from luxurious velvet fabrics, intricately hand-embroidered by veteran artisans with gold thread and colorful beads featuring auspicious peacocks and floral patterns. Comfortable yet lavishly beautiful, these pieces are iconic Burmese wearable art.", "name": "Royal Rose Velvet Slippers \u0026 Bags", "transport": "About a 5-minute taxi ride from the National Museum of Yangon, located within the Nawaday Street shopping area."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "89 Yaw Min Gyi St, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Myanmar organic herbal tea bags, handmade bamboo tableware, handcrafted cotton and linen storage bags. Located on Yaw Min Gyi Street, this renowned fair-trade social enterprise souvenir shop features items entirely handmade by vulnerable local women and small-scale artisans across Myanmar. The shop offers a warm, indie aesthetic. Aside from cultural and creative lifestyle goods, its specially crafted organic herbal teas and beautifully packaged local dried fruits make for high-quality, deeply meaningful souvenirs.", "name": "Pomelo for Myanmar (Independent Handmade \u0026 Souvenir Shop)", "transport": "Take a taxi to Yaw Min Gyi Street; about a 5-minute drive from the east side of the National Museum."}, {"address": "Dagon Center 1, Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage-style tea tin gift boxes, Burmese-style tote bags, traditional motif leather coin purses. Yangoods is Myanmar\u0027s most popular emerging local design brand, blending traditional Burmese elements\u2014such as vintage ad graphics, images of Burmese maidens, and classic patterns\u2014into modern fashion items. Their retro tin tea boxes and specialty snack sets are bestsellers, combining rich cultural storytelling with captivating visual charm.", "name": "Yangoods - Dagon Center Branch", "transport": "Take a bus or taxi to Dagon Center Shopping Mall."}, {"address": "117 Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.7 stars | Must-Buy List: Myanmar wild raw honey, premium roasted cashew snacks, Inle Lake artisanal organic sea salt. Sharky\u0027s is a legendary gourmet organic food market in Myanmar, dedicated to sourcing unique local produce and refining it into high-end products. Offering top-quality local cashews, spiced dried fruits, and additive-free pure honey, it is the top choice for travelers looking for high-quality, healthy gifts.", "name": "Sharky\u0027s Flagship Store (Sharky\u0027s Pyay Road)", "transport": "Located on Pyay Road near the National Museum; about a 10-minute walk away."}, {"address": "Pyay Road Corridor, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar milk tea gift sets, signature coconut milk egg yolk cake, traditional baked cashew cookies. Shwe Pu Zun is a classic local bakery and beverage institution in Yangon, beloved by local families. Their house-blend 3-in-1 Myanmar milk tea packets are rich, sweet, and packed with authentic flavor. Additionally, a wide array of Southeast Asian pastries and nut cookies are popular local treats that savvy foodies buy by the box.", "name": "Shwe Pu Zun Bakery \u0026 Cafeteria", "transport": "Take a taxi to the Dagon segment of Pyay Road."}, {"address": "Dagon Center 1, Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Royal Myanmar milk tea packets, Ah Ma Tea pickled tea leaves with fried beans kit, Grand Royal Myanmar whisky. Located inside Dagon Center, City Mart is one of the largest supermarket chains in the area and features a comprehensive local souvenir section. Travelers can shop for a wide range of local snacks under one roof, especially convenient kits for \u0027Lahpet\u0027 (pickled tea leaf salad)\u2014an iconic Myanmar national dish that makes a truly unique gift.", "name": "City Mart Supermarket - Dagon Center Branch", "transport": "Take a taxi or bus directly to Dagon Center."}, {"address": "West Gate of Shwedagon Pagoda, U Wisara Rd, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Thanaka log and grinding stone sets, Burmese lacquerware trinket boxes, handcrafted traditional wooden puppets. Located along the West Gate approach of Shwedagon Pagoda in Dagon Township, this market gathers numerous shops selling traditional crafts and local goods. A must-buy here is Thanaka\u2014a natural beauty paste loved by Burmese women\u2014sold in sets containing raw bark logs and grinding stones. Exquisite lacquerware boxes and traditional Burmese puppets also make fantastic, exotic keepsakes.", "name": "Shwedagon Pagoda West Gate Souvenir Arcade", "transport": "Take a taxi to the West Gate entrance of Shwedagon Pagoda (U Wisara Road side)."}, {"address": "45 Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Burmese tamarind candy, Shan State highland coffee beans, specialty dried banana chips. Taw Win Centre is a major local shopping mall in Dagon Township. The ground floor and supermarket perimeter feature stalls selling authentic local agricultural products. Recommended buys include sweet and tangy tamarind candies from the Bagan region and rich, aromatic coffee beans from the Shan Plateau\u2014both offer great value with authentic local flavor.", "name": "Taw Win Centre Souvenir Market", "transport": "Take a taxi or bus directly to the entrance of Taw Win Centre."}, {"address": "Pyay Road (Near National Museum), Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional handwoven Burmese shawls, artisanal herbal balms, Burmese peanut brittle. Situated near the National Museum, this specialty craft and food shop curates hand-crafted goods and traditional artisan foods from Myanmar\u0027s various ethnic groups. Highlights include crunchy, non-sticky peanut brittle, herbal healing balms made from pure botanicals, and beautiful handwoven textiles\u2014making it a favorite stop for international museum visitors.", "name": "Royal Thazin Souvenir \u0026 Craft Shop", "transport": "About a 3-minute walk from the National Museum of Myanmar."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "45 Pyay Rd, Dagon Township, Yangon", "feature": "\u2b50 4.1 stars | Must-buy list: Royal Myanmar Milk Tea sachets, traditional Myanmar Longyi, and Yangon tamarind candy. Located on Pyay Road, the main thoroughfare of Dagon Township, Taw Win Center is an iconic local shopping mall. It houses numerous Myanmar fashion brands, traditional craft boutiques, and multi-brand electronics stores, making it a top shopping choice for local middle-class residents and tourists alike.", "name": "Taw Win Center", "transport": "Take Bus 37 or 61 to Taw Win Center Station, or take a Grab taxi from the National Museum of Myanmar (approx. 5 minutes)."}, {"address": "268 Pyay Rd, Dagon Township, Yangon", "feature": "\u2b50 4.0 stars | Must-buy list: Bella local cosmetics/skincare products, hand-woven rattan bags, and Thanaka natural sun protection products. Situated at the junction of Dagon and Sanchaung townships, this long-standing and highly popular department store is a favorite among local youth. Packed with local brand counters and beauty shops, it\u2019s a great spot to pick up authentic Myanmar everyday essentials and traditional skincare at very affordable prices.", "name": "Dagon Center 2", "transport": "About a 10-minute walk from the West Gate of Shwedagon Pagoda, or a 3-minute taxi ride."}, {"address": "Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Discounted Giordano T-shirts, classic Adidas sneakers, and end-of-season Esprit womenswear. Located along Pyay Road in Dagon Township, this well-known outlet store offers past-season items from international apparel and sportswear brands at generous 30%\u201370% discounts. Spacious with a wide variety of goods, it\u0027s a prime destination for locals and travelers hunting for bargain brand-name clothes and shoes.", "name": "Brand Outlet Yangon (Pyay Road)", "transport": "About a 5-minute Grab ride heading north from Taw Win Center in Dagon Township."}, {"address": "No. 25, Attiya Road, Dagon Area, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Hand-carved teak Buddha statues, traditional lacquerware tea sets, and vintage Burmese puppets. Located near the National Museum in Dagon Township, this independent antique and craft shop has a history spanning several decades and is one of Yangon\u0027s premier cultural galleries. It is filled with traditional crafts and antiques meticulously handcrafted by veteran artisans, with detailed historical descriptions for each piece, making them highly collectible.", "name": "Augustine\u0027s Souvenir \u0026 Antique Shop", "transport": "About an 8-minute walk or a 3-minute taxi ride from the National Museum of Myanmar."}, {"address": "Pyay Road Junction, Near Dagon Area, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Handwoven Chin brocade scarves, colorful geometric Naga shawls, and naturally plant-dyed silk scarves. Situated near the Dagon district, this independent boutique specializes in promoting traditional handwoven textiles from Myanmar\u0027s ethnic minorities. The owner personally travels to indigenous villages to source products, ensuring every piece is 100% handwoven. Featuring striking colors, captivating patterns, and exceptional texture, these textiles make memorable souvenirs with high cultural value.", "name": "Yoya May Ethnic Textiles", "transport": "About a 7-minute taxi ride from the National Museum of Myanmar."}, {"address": "Near Dagon border, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Eco-friendly recycled plastic woven tote bags, handmade brass geometric jewelry, and traditional Burmese handwoven cushion covers. This highly iconic fair-trade creative design shop is located just a few minutes\u0027 drive from Dagon Township. Partnering with vulnerable local communities and emerging Burmese designers, Pomelo combines traditional crafts with modern aesthetics to produce stylish lifestyle goods and accessories\u2014highly recommended by local expats and hip travelers.", "name": "Pomelo for Myanmar", "transport": "About a 6-minute Grab ride from the National Museum of Myanmar."}, {"address": "Taw Win Center, Pyay Rd, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Grand Royal Myanmar Whiskey, local cashew nuts, and dried local wild mushrooms. Located in the heart of Dagon Township, this upscale supermarket chain is the best place to shop for local specialty foods and premium goods. Compared to traditional markets, it offers a bright, clean, and modern environment with a dedicated Myanmar souvenir section featuring a comprehensive selection of local tea bags, specialty snacks, and fine spirits.", "name": "Market Place by City Mart - Dagon", "transport": "Located inside Taw Win Center; simply take a bus or taxi to Taw Win Center to enter."}, {"address": "Dagon District Border, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Handwoven Shan shoulder bags, handcrafted wooden animal figurines, and natural herbal handmade soaps. This independent social enterprise craft shop showcases the creative ingenuity of numerous Burmese artisans. Dedicated to using local sustainable materials, every product comes with a backstory about its creator. Delicately made and rich in local flavor, it\u2019s an ideal choice for unique gifts that directly support local communities.", "name": "Hla Day", "transport": "About a 5-minute Grab ride from the National Museum of Myanmar."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dagon District and National Museum"}, "dala_township": {"categories": {"cat_1": {"items": [{"address": "Dala Ferry Terminal Market Zone, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Shwe Pyi Nann Pure Natural Thanaka Paste, Handmade Thanaka Hand Cream, Thanaka Sunscreen Powder Compact. A renowned long-standing shop located right at the exit of Dala Ferry Terminal, making it the top choice for local women and tourists looking to purchase pure, natural Myanmar Thanaka paste. The store offers freshly ground Thanaka tree logs and specialized grinding stones, guaranteed to be free of added artificial chemicals\u2014the perfect gateway to experiencing centuries of Myanmar\u0027s natural beauty wisdom.", "name": "Dala Jetty Native Thanaka \u0026 Cosmetics", "transport": "Take the ferry from Pansodan Jetty in Yangon to Dala Jetty; walk about 2 minutes from the exit."}, {"address": "Central Market Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Fame Brand Reishi Anti-Aging Essence, Myanmar Herbal Universal Oil, Coconut Hair Nourishing Oil. Situated inside the traditional market in central Dala Township, this pharmacy is highly trusted by local residents. It mainly features products from Fame Pharmaceuticals, a well-known native Myanmar herbal biotech brand. Combining traditional herbalism with modern biotechnology, their natural skincare products and therapeutic ointments are specifically developed for Southeast Asia\u0027s hot and humid climate, offering incredible value for money.", "name": "Dala Central Market Herbal Pharmacy", "transport": "Take a cycle rickshaw from Dala Jetty for about 5 minutes to reach the inside of Dala Central Market."}, {"address": "Bogyoke Street, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Taing Yin Say Herbal Acne Ointment, Jasmine Fragrance Body Lotion, Thanaka Whitening Face Mask. A cozy boutique pharmacy specializing in traditional Myanmar beauty and wellness products. The owner personally selects skincare items made from high-quality herbal raw materials sourced across Myanmar. Its signature herbal acne cream and gentle whitening mask are especially popular among local young women, making it a hidden gem for tourists crossing the river in search of local treasures.", "name": "Dala Royal Beauty \u0026 Thanaka Shop", "transport": "Take a trishaw or taxi from Dala Jetty and ride along Bogyoke Street for about 3 minutes."}, {"address": "Strand Road, Near Dala Riverbank, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buy List: Kokka Herbal Facial Soap, Myanmar Rose Hydrosol, Lemongrass Sunscreen Spray. One of the few larger comprehensive cosmetics pharmacies in Dala Township, this store offers everyday pharmaceuticals alongside its highlight: natural botanical bath and body products from the premium local Myanmar brand Kokka. Its rose hydrosol, distilled from roses grown in the Myanmar highlands, delivers remarkable moisturizing effects at an affordable price.", "name": "Mingalar Beauty \u0026 Pharmacy Dala", "transport": "Walk east along Strand Road along the riverbank from Dala Ferry Terminal for about 8 minutes."}, {"address": "Riverfront Road, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Myanmar Lemongrass Balm, Extra Virgin Cold-Pressed Coconut Oil, Natural Thanaka Soap. Located in the heart of the riverside district, this specialty pharmacy combines traditional Myanmar medicine with modern cosmetics. The signature lemongrass balm works wonders for repelling mosquitoes and soothing bites, making it a must-have for exploring the riverside area. It also sells pure coconut oil produced by local smallholder farmers, ideal for deeply nourishing hair and skin.", "name": "Dala Riverside Herbal \u0026 Pharmacy Corner", "transport": "About a 6-minute walk from Dala Ferry Terminal, adjacent to the riverside promenade."}, {"address": "Market Street, Dala Township, Yangon", "feature": "\u2b50 4.0 stars | Must-Buy List: Thanaka Gold Leaf Repair Cream, Myanmar Tuberose Roll-on Essential Oil, Beeswax Moisturizing Lip Balm. Rooted in Dala for many years, this local independent cosmetics shop uniquely formulates repair creams containing natural Thanaka and trace amounts of gold leaf, offering fantastic sun relief and skin-soothing benefits. The shop also extracts essential oils from native tropical Myanmar flowers, making for high-quality cosmetic souvenirs rich in local charm.", "name": "Flower of Myanmar Herbal Cosmetics Dala", "transport": "Take a local trishaw from Dala Ferry Terminal for about 4 minutes."}, {"address": "Pyidawaye Road, Dala Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Mandalay Thanaka Tree Logs, Circular Grinding Stone Tablets, Freshly Mixed Thanaka Hydrating Sleeping Mask. A specialty cosmetics shop dedicated to offering the most authentic \u0027DIY Thanaka Experience\u0027. Here, you can not only purchase ready-made Thanaka skincare products but also buy top-quality Mandalay Thanaka logs and traditional grinding stones. The staff will enthusiastically teach you how to add water and grind out the purest skincare paste, allowing you to enjoy Myanmar\u0027s most authentic beauty ritual.", "name": "Dala Thanaka Wood \u0026 Beauty Hub", "transport": "Take a taxi from Dala Jetty for about 5 minutes to reach the Pyidawaye Road commercial area."}, {"address": "New Town Main Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar Reishi Whitening \u0026 Moisturizing Cream, Anti-Sensitive Thanaka Cleanser, Turmeric Repair Shampoo. Located in the Dala New Town development zone, this specialty herbal store focuses on modern high-tech skincare infused with native Myanmar medicinal herbs like turmeric, reishi, and Thanaka. Its anti-sensitive Thanaka facial cleanser is gentle, non-stripping, and effectively controls oil and acne, earning high praise from sensitive skin users and tourists alike.", "name": "Dala New Town Bio-Herbal Store", "transport": "Take a motorbike taxi or trishaw from Dala Jetty for about 10 minutes to reach the main street of New Town."}], "name": "Iconic Local Beauty \u0026 Cosmetics Shops"}, "cat_2": {"items": [{"address": "Dala Market Road, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Handwoven Kadan Longyi, Myanmar Silk Shawl. Located just a short distance from Dala Jetty, this traditional fabric shop is the top choice for locals buying everyday apparel and ceremonial traditional wear. The shop showcases unique textiles from all over Myanmar, with extremely affordable prices and durable, breathable fabrics perfectly suited for Southeast Asia\u0027s warm and humid climate.", "name": "Dala Central Market Longyi \u0026 Fabric Stall", "transport": "Take a ferry from Yangon Jetty to Dala Jetty, then walk for about 5 minutes."}, {"address": "Strand Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Burmese Velvet Flip-Flops, Embroidered Flat Sandals. Situated right on Dala\u0027s main riverfront road, this well-established shoe store specializes in velvet footwear rich in traditional Myanmar colors. Featuring soft, vibrant uppers and non-slip, durable soles, these shoes are everyday favorites among locals crossing the river or visiting pagodas.", "name": "Dala Riverfront Handmade Velvet Slippers", "transport": "After arriving at Dala Jetty by ferry, walk along the main road for about 3 minutes."}, {"address": "Pyidawtha Road, Dala Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage Handmade Rattan Tote Bag, Waterfront-style Round Bamboo Shoulder Bag. The waterfront district of Dala is famous for its exquisite bamboo and rattan weaving. Bringing together seasoned local artisans, this workshop crafts woven bags that blend practicality with chic style. Every piece is entirely handmade, lightweight, and highly breathable\u2014a huge hit with trendy travelers.", "name": "Dala Rattan \u0026 Bamboo Craft Bags", "transport": "Take a trishaw from Dala Jetty for about 5 minutes."}, {"address": "Bogyoke Street, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Must-buy list: Traditional Women\u0027s Taingmathein Top, Men\u0027s Plaid Pasu Longyi. A well-known shop in Dala Township, this boutique specializes in traditional Myanmar festival attire alongside budget-friendly everyday wear. The friendly owner warmly explains the regional cultures represented by different patterns and even offers on-the-spot lessons on how to properly tie and wear a longyi.", "name": "Shwe Dala Traditional Apparel Shop", "transport": "Take a trishaw or taxi from Dala Jetty for about 7 minutes."}, {"address": "Riverview Road, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Shan Traditional Fringe Crossbody Bag, Plant-Dyed Cool Cotton-Linen Shirt. The owner introduced traditional weaving techniques from the Shan State in northern Myanmar to open this stylish riverfront shop in Dala. The ethnic bags featured here are rich in color with classic tassels and geometric patterns, while the lightweight cotton-linen shirts are absolute essentials for beating the heat.", "name": "River Side Shan Bags \u0026 Cotton Apparel", "transport": "Walk along the riverside promenade from Dala Ferry Jetty for about 8 minutes."}, {"address": "Nawarat Road, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | Must-buy list: Handmade Real Leather Sandals, Minimalist Retro Leather Shoulder Bag. Tucked away in the alleys of Dala, this independent leather workshop specializes in 100% hand-stitched real leather footwear and bags. The leather grows softer with wear, yet prices are half of those in downtown Yangon\u2014a true hidden gem for savvy locals looking for affordable quality.", "name": "Dala Handcrafted Leather Footwear", "transport": "After taking the ferry to Dala Jetty, transfer to a motorbike taxi for about 4 minutes."}, {"address": "Min Ye Kyaw Swar Road, Dala Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Naturally-Dyed Handmade Scarf, Hand-Embroidered Large Canvas Tote. Founded by veteran local weaver Daw Yee, this workshop upholds ancient hand-dyeing and weaving methods. Using carefully selected natural botanical dyes, the products offer warm, organic colors and a soft feel. The embroidered canvas bags featuring countryside scenes of the Dala riverfront make wonderful souvenirs.", "name": "Daw Yee Handwoven Textiles \u0026 Accessories", "transport": "Take a trishaw from Dala Jetty for about 6 minutes."}, {"address": "Kyansittha Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Waterfront Tropical Print Shirt, Tailored Myanmar Longyi Skirt. This charming boutique offers both off-the-rack clothing and custom tailoring services, with walls lined with printed fabrics featuring tropical Southeast Asian motifs and Burmese patterns. Visitors can select their favorite fabric and pick up a custom-tailored traditional skirt or casual shirt as fast as the same day.", "name": "Waterfront Tailor \u0026 Print Apparel", "transport": "Walk for about 10 minutes from Dala Ferry Jetty."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Dala Ferry Terminal, Strand Road Side, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Handcrafted bamboo woven handbags, hand-milled Thanaka wood logs, traditional carved wooden elephants. Located right next to the Dala Ferry Terminal along the Yangon River, this bustling market is the very first delight visitors encounter upon stepping onto Dala soil. Gathering numerous local artisans and street vendors, it offers the most authentic Burmese souvenirs. The durable, exotic bamboo bags handwoven by local women are the perfect alternative to commercial big-brand products. You can even watch live demonstrations of grinding Thanaka logs into natural sun-protecting cosmetic powder, offering a truly deep cultural experience.", "name": "Dala Jetty Souvenir Market", "transport": "Take the ferry from Pansodan Ferry Terminal in downtown Yangon across to Dala Jetty; the market is right outside the exit after disembarking."}, {"address": "No. 12, Strand Road, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Exquisite woven bamboo coasters, handmade bamboo storage boxes, handwoven rattan trivets. Dala\u0027s riverfront area is renowned for traditional handicrafts, and this independent workshop preserves centuries-old Myanmar bamboo and rattan weaving techniques. The workshop employs local residents, showcasing a fully transparent process from bamboo selection and cutting to handweaving. The daily bamboo items sold here are of exceptionally high quality yet extremely budget-friendly. Infused with a subtle bamboo aroma and featuring elegant weave patterns, they make sophisticated home decor and highly representative local souvenirs.", "name": "Dala Bamboo Craft \u0026 Workshop", "transport": "About an 8-minute walk from Dala Ferry Terminal, or a 3-minute ride on a local trishaw."}, {"address": "Bogyoke Street, Near Central Market, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buys: Pure Natural Thanaka Paste, handmade herbal Thanaka soap, natural coconut oil skincare cream. Thanaka is a staple traditional cosmetic and natural sunscreen used daily by locals across Myanmar. Yamana is a highly reputable local beauty shop in Dala that insists on using premium Thanaka bark refined with natural herbs. The shop thoughtfully packages traditional Thanaka\u2014which usually requires manual grinding\u2014into convenient travel-ready jars of sunscreen paste and essential oil soaps, allowing foreign tourists to easily take home Myanmar\u0027s centuries-old natural beauty secret.", "name": "Yamana Thanaka \u0026 Herbal Shop", "transport": "About a 5-minute motorbike taxi or trishaw ride from Dala Jetty to near the Dala Central Market."}, {"address": "Min Ye Kyaw Swar Road, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Fermented tea leaf paste (Lahpet), crispy mixed beans \u0026 nuts pack, Royal Myanmar Instant Milk Tea Mix. Myanmar\u0027s pickled tea leaf salad (Lahpet Thoke) is a legendary national culinary treasure. Located on an old street in Dala, this specialty shop individually vacuum-seals slightly tangy, savory fermented tea leaves alongside crunchy roasted soybeans, peanuts, and sunflower seeds. Travelers can simply mix them at home to recreate authentic Burmese flavors. Additionally, they sell rich and sweet Royal Myanmar instant milk tea packets\u2014an ideal office snack to share with friends and family.", "name": "Dala Lahpet \u0026 Nut Shop", "transport": "About a 6-minute trishaw ride from Dala Ferry Terminal to the shopping street area."}, {"address": "Pyidawaye Road, Dala Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buys: Handcrafted Jaggery Drops, coconut jaggery candies, sweet \u0026 sour tamarind candies. The outskirts of Dala and Yangon are rich in palm trees, and this shop specializes in handcrafted palm sugar (jaggery) products. Pure palm sugar features a distinctive caramel aroma and sophisticated natural sweetness without chemical additives, serving as the soul of traditional local tea treats. The shop molds jaggery into bite-sized drops or combines it with shredded coconut and sesame seeds to make non-greasy traditional candies. Their sweet-and-sour dried tamarind candy is also a wildly popular retro snack that whets the appetite.", "name": "Dala Jaggery \u0026 Palm Fruit House", "transport": "About a 4-minute motorbike ride from Dala Jetty."}, {"address": "No. 45, Kyaik Khauk Pagoda Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Traditional cotton longyi (Paso for men / Htamein for women), patterned handcrafted fabric tote bags, Burmese ethnic embroidered scarves. The Longyi is the traditional tube-skirt garment worn by men and women in Myanmar, prized not only for its airy comfort but also for its rich cultural patterns. This boutique textile shop carefully selects handwoven fabrics from across Myanmar, offering a wide array of gracefully printed and hand-loomed longyis. Artisans also utilize high-quality fabric remnants to create stylish tote bags and woven scarves that radiate exotic charm, making this a wonderful spot to collect authentic Burmese flair.", "name": "Myanmar Longyi \u0026 Fabric Crafts Shop", "transport": "About a 7-minute local trishaw ride from Dala Ferry Terminal."}, {"address": "Near Dala Riverfront Market, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buys: Hand-carved coconut shell bowls, handmade teakwood spoons, lacquerware jewelry boxes. Harnessing Myanmar\u0027s rich natural resources, this charming store transforms discarded coconut shells and eco-friendly teakwood into stunning handicrafts. Each coconut shell bowl is meticulously ground and polished, with some inlaid with mother-of-pearl or finished with lacquer coatings, perfectly balancing utility and artistry. The natural teakwood spoons and utensils emit a warm woody aroma, featuring solid durability at reasonable prices\u2014making them sustainable, eco-conscious souvenirs beloved by international travelers.", "name": "Dala Coconut Shell \u0026 Woodcraft Shop", "transport": "About a 10-minute walk along Strand Road from Dala Jetty."}, {"address": "No. 88, Market Street, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Myanmar mixed curry spice powder, handmade crispy sesame biscuits, savory crispy fish floss snacks. Burmese cuisine beautifully blends the spice traditions of Southeast and South Asia. Tucked away in Dala\u0027s old neighborhood, this spice and specialty shop displays bags of vibrantly colored, highly aromatic local spices. Their custom Burmese curry powder lets you effortlessly recreate authentic curry dishes at home. The shop also sells crunchy sesame biscuits and savory fish floss snacks enjoyed by locals since childhood, offering a delicious crunch packed with rustic local charm and making it a great destination for discovering hidden local snacks.", "name": "Yangon River Spices \u0026 Local Biscuit Shop", "transport": "About a 5-minute motorbike taxi ride from Dala Ferry Terminal to the Old Market Street area."}], "name": "Must-Buy Specialties \u0026 Snacks"}, "cat_4": {"items": [{"address": "Pyidawtha Street, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Traditional Myanmar Longyi, hand-woven straw hats, Myanmar instant milk tea packets. Located in the heart of the Dala waterfront commercial district, this localized shopping center brings together many local clothing brands and daily sundries. It\u0027s a must-visit mall for Dala locals\u0027 daily shopping and tourists looking to experience local life.", "name": "Dala Central Shopping Complex", "transport": "About an 8-minute walk or a 3-minute trishaw ride from Dala Ferry Jetty."}, {"address": "Strand Road Waterfront Zone, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted export apparel, sale pure cotton T-shirts, branded casual shoes. Located near the waterfront, this outlet center offers steep discounts on export overstock from Southeast Asian OEM factories and local chain brands. Prices are highly competitive with discounts ranging from 50% to 70% off.", "name": "Dala Waterfront Factory Outlet", "transport": "About a 5-minute motorbike taxi ride from Dala Ferry Jetty."}, {"address": "Khanaung Village Road, Dala Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade rattan bags, bamboo trivets, lacquerware teacups. Co-founded by local Dala artisans, this charming specialty store displays and sells handcrafted rattan bags and home goods. Direct from origin with exceptional quality, it is a huge favorite among international visitors.", "name": "Dala Cane \u0026 Bamboo Handicraft Center", "transport": "About a 10-minute trishaw ride from Dala Ferry Jetty."}, {"address": "Bogyoke Street, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Thanaka powder, Thanaka whitening soap, herbal moisturizing facial masks. This independent local beauty shop focuses on modern skincare products derived from Thanaka, Myanmar\u0027s traditional sun protection and skincare secret. The products are natural, organic, and beautifully packaged, making them iconic souvenirs from Yangon\u0027s waterfront region.", "name": "Myanmar Thanaka \u0026 Herbal Beauty Store", "transport": "Just a 5-minute walk from Dala Central Market."}, {"address": "River View Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar-style spicy dried fish, fried cashews, traditional palm sugar. This specialty outlet gathers a wide array of local delicacies from Dala and the Yangon Delta region. Partnering directly with local agricultural and fishing cooperatives, it offers wholesale discounts\u2014making it the ultimate one-stop spot for authentic snacks.", "name": "Dala Local Specialty \u0026 Snacks Outlet", "transport": "Walk east for about 6 minutes after exiting the ferry jetty."}, {"address": "Setse Street, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buy List: Myanmar jade trinkets, artisanal Myanmar coffee beans, traditional printed cotton fabrics. A regional department store combining modern air conditioning with local boutiques, it offers a clean and comfortable shopping environment away from the heat of traditional markets. It\u0027s a great place to pick up locally designed apparel and daily essentials.", "name": "Dala Oasis Living Department Store", "transport": "About a 7-minute tuk-tuk ride from the ferry jetty."}, {"address": "Yaza Dirit Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Affordable pure cotton light shirts, unique pattern scarves, discounted linen-cotton trousers. Direct from local Myanmar textile mills, this outlet offers high-value cotton and linen clothing perfectly suited for Southeast Asia\u0027s tropical climate. The store continuously features selected past-season and export discount items.", "name": "Yangon South Bank Textile Outlet", "transport": "About a 6-minute motorbike taxi ride from Dala Ferry Jetty."}, {"address": "Kamakasit Ward, Dala Township, Yangon", "feature": "\u2b50 4.7 stars | Must-Buy List: Teak carved elephant ornaments, Myanmar jade lucky bracelets, handmade wooden tableware. Jointly run by local master woodcarvers and jewelry artisans, this independent shop sells reasonably priced teak crafts and entry-level jade jewelry rich in Myanmar cultural heritage, with every piece being unique.", "name": "Dala Gem \u0026 Teak Wood Craft Center", "transport": "About a 12-minute trishaw ride from Dala Ferry Jetty."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "Dala Riverside Water Town District"}, "downtown_sule": {"categories": {"cat_1": {"items": [{"address": "No. 182, Sule Pagoda Road, Pabedan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: All-natural premium Thanaka wood powder blocks, Thanaka scented balm, Premium lemon-scented Thanaka powder. This shop is the flagship outlet for Myanmar\u0027s most famous leading local Thanaka brand, located in the heart of the downtown commercial district. Local women have used Thanaka as a sunblock and skincare staple since childhood. Made from 100% natural ingredients without chemical additives, applying it to the face offers a cooling, refreshing sensation and oil control. It is an iconic, must-buy local cosmetic souvenir in Yangon.", "name": "Shwe Pyi Nann Thanaka Specialist Shop", "transport": "Take a bus to Sule Pagoda Station, then walk for about 3 minutes."}, {"address": "Level 1, Junction City, Corner of Bogyoke Aung San Road \u0026 Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Bella Long-Lasting Matte Lipstick, Myanmar Vibe 9-Color Eyeshadow Palette, Sweatproof \u0026 Heat-Resistant Pressed Powder. Bella is a rapidly rising home-grown makeup brand in Myanmar, specifically formulating products for Southeast Asia\u0027s hot and humid climate. Affordable yet packaged with a chic modern flair, it is beloved by young women and office workers in Yangon. Their sweatproof compact powder and lip colors are especially recommended for tropical weather.", "name": "Bella Cosmetics Downtown Flagship", "transport": "Take a taxi to Level 1 of Junction City Shopping Mall."}, {"address": "Lower Ground Floor, Junction City, Bogyoke Aung San Road, Pabedan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Myanmar Herbal Acne Repair Balm, Natural Coconut Oil Body Cream, Royal Pearl Brightening Face Cream. As one of downtown Yangon\u0027s largest health and beauty drugstores, this venue offers a bright, clean environment and a comprehensive product selection. Alongside international skincare brands, it features a dedicated section for high-quality Burmese cosmetics, offering excellent botanical skincare products developed by local pharmaceutical companies and research institutes.", "name": "City Care Pharmacy \u0026 Beauty - Junction City Branch", "transport": "Take a bus or taxi to the Lower Ground Floor of Junction City."}, {"address": "No. 248, Sule Pagoda Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar Herbal Mint Universal Oil, Heritage Thanaka Skincare Balm, Local Wild Honey Lip Balm. Located right next to Sule Pagoda, this historic pharmacy is deeply trusted by older local residents. Beyond carrying standard medications, it\u0027s a fantastic spot to discover traditional Burmese herbal skincare products. The pharmacists can explain the benefits of various herbal items in simple English, and the prices are exceptionally budget-friendly.", "name": "Sule Medical Hall", "transport": "Located on the east side of the Sule Pagoda roundabout, about a 2-minute walk."}, {"address": "No. 125, 29th Street (Middle Block), Pabedan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Taunggyi Mountain Herbal Handmade Soap, Turmeric Antioxidant Face Cream, Natural Jasmine Hair Oil. Specializing in natural herbal skincare from the Shan State plateau of Myanmar, this shop emphasizes organic, additive-free products. Although the downtown shop is cozy, it is filled with soothingly scented handmade soaps and herbal treatments. Locals love buying their natural plant-based hair oil to nourish their hair.", "name": "Taunggyi Myaing Herbal Beauty \u0026 Health", "transport": "Walk south along 29th Street from Sule Pagoda for about 5 minutes."}, {"address": "Shop No. 108, Main Building, Bogyoke Aung San Market, Pabedan Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Hand-carved Wooden Thanaka Grinding Stone Set, Pure Natural Rose Water Spray, Traditional Myanmar Herbal Bath Powder. Situated inside the famous Bogyoke Aung San Market, this traditional shop has been serving locals for decades. Here you can find authentic raw Thanaka wood logs and specialized grinding stones, allowing you to experience the fun of grinding pure Thanaka yourself. The friendly staff will also happily guide you on application techniques.", "name": "Bogyoke Market Traditional Beauty Shop (Shop #108)", "transport": "Take a bus to Bogyoke Market Station and enter the main building."}, {"address": "No. 513, Maha Bandula Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Myanmar Vitamin E Moisturizing Cream, Royal Jelly Anti-Wrinkle Essence, Aloe Vera Soothing Gel. This reputable downtown chain pharmacy branch features a skincare section focused on dermacosmetic and clinical-grade products alongside pharmaceuticals. Many local women come here for after-sun repair and skin-soothing products tailored to the Southeast Asian climate, enjoying reliable quality and transparent pricing.", "name": "Medialink Pharmacy - Downtown Branch", "transport": "Located at the intersection of Maha Bandula Road and 37th Street, within walking distance."}, {"address": "No. 88, 38th Street (Lower Block), Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Natural Thanaka Body Scrub, Myanmar Wild Honey Exfoliating Scrub, Burmese Vanilla Hand Cream. This cozy local boutique beauty shop caters to customers seeking natural and organic skincare. Many products utilize locally sourced Burmese ingredients like Thanaka, turmeric, honey, and vanilla. Beautifully packaged, these items make tasteful cosmetics gifts for friends and family.", "name": "Cherry Herbal \u0026 Beauty Shop", "transport": "Turn onto 38th Street from Maha Bandula Road near Sule Pagoda and walk for about 4 minutes."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Bogyoke Aung San Market, Kyauktada Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buys: Handwoven silk Acheik Longyi, men\u0027s cotton plaid Pasu, and traditional hand-embroidered women\u0027s blouses. Located inside the historic Bogyoke Aung San Market in downtown, this is the top choice for locals shopping for traditional formal attire. On-site alterations for length are provided, and the cool, breathable fabrics are perfect for Southeast Asia\u0027s climate.", "name": "Golden Dragon Longyi \u0026 Textiles (Bogyoke Market)", "transport": "About a 7-minute walk to Sule Pagoda, or take a city bus to the Bogyoke Market stop."}, {"address": "No. 62, Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.8 stars | Must-buys: Vintage Burmese lady print canvas bags, classic Burmese motif wallets, and retro silk scarves. Yangon\u0027s premier local independent designer brand perfectly fuses traditional Myanmar culture and vintage photos with modern pop-art visuals. The trendy accessories and clothing boast high collectible value and are huge hits with foreign tourists and local youth alike.", "name": "Yangoods (Sule \u0026 Pansodan Branch)", "transport": "About a 5-minute walk from Sule Pagoda."}, {"address": "1st Floor, 81 Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buys: Woven tote bags, hand-embroidered cotton slip-ons, and handcrafted ethnic accessories. Located on Pansodan Street in the Old Town, this non-profit social enterprise boutique collaborates with local disadvantaged women and traditional artisans. Products feature modern design aesthetics with exceptional quality and character, with profits reinvested directly into the local community.", "name": "Hla Day Craft \u0026 Fashion Store", "transport": "About a 6-minute walk to Sule Pagoda, close to Pansodan Jetty."}, {"address": "Main Front Building, Bogyoke Aung San Market, Yangon", "feature": "\u2b50 4.5 stars | Must-buys: Handwoven Chin tote bags, Naga geometric crossbody bags, and hand-loomed pattern shawls. Specializing in traditional handwoven textiles, bags, and accessories from Myanmar\u0027s ethnic minorities (such as Chin, Karen, and Naga). The owner personally travels to remote villages to curate and custom-order pieces, ensuring every woven bag tells a unique story through its colors and patterns.", "name": "Yoya May Ethnic Textiles", "transport": "Located on the 2nd floor of the main front building in Bogyoke Market, about an 8-minute walk from Sule Pagoda."}, {"address": "Anawrahta Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buys: Gold-thread peacock embroidered velvet slippers, pearl-embellished women\u0027s flip-flop sandals, and traditional men\u0027s velvet flip-flops. Velvet slippers are an essential footwear match for traditional Myanmar attire. This heritage shop offers fine craftsmanship with luxurious, detailed embroidery that feels soft and comfortable\u2014a perfect local souvenir.", "name": "Shwe Daw Velvet Slippers \u0026 Shoes", "transport": "About a 4-minute walk along Anawrahta Road from Sule Pagoda."}, {"address": "Maha Bandula Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buys: Handwoven Mandalay pure silk tops, lightweight naturally dyed shawls, and modern tailored Myanmar-style dresses. Specializing in high-end pure silk and linen/cotton apparel, bringing traditional Mandalay weaving craftsmanship to Yangon\u0027s Old Town. The lightweight fabrics and sleek tailoring make them ideal for both modern daily wear and business occasions.", "name": "Mandalay Silk \u0026 Fashion Center", "transport": "About a 3-minute walk from Sule Pagoda."}, {"address": "37th Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buys: Hand-stitched cowhide sandals, vintage genuine leather briefcases, and British-style woven leather belts. Tucked away in a colonial alleyway in the Old Town, this independent leather workshop inherits shoemaking traditions from the colonial era. Featuring 100% genuine handcrafted leather, their sandals are comfortable, breathable, remarkably durable, and very affordably priced.", "name": "Craftsmans Leather Shoes \u0026 Bags", "transport": "Turn onto 37th Street from Maha Bandula Road near Sule Pagoda, about a 5-minute walk."}, {"address": "Merchant Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buys: Breathable bamboo fiber short-sleeve shirts, block-printed cotton-linen wide-leg pants, and ethnic woven rattan totes. This local boutique focuses on natural fabrics and effortless casual wear tailored for tropical weather. Blending traditional Myanmar print motifs with sleek, minimalistic modern cuts, their pieces offer fantastic quality and comfort.", "name": "Bamboo \u0026 Cotton Local Boutique", "transport": "About a 6-minute walk along Merchant Road from Sule Pagoda."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Bogyoke Aung San Road, Pabedan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Royal Myanmar Milk Tea, Myanmar Lacquerware Set, Jade Accessories. Bogyoke Aung San Market is a century-old traditional covered arcade market in downtown Yangon, bringing together handicrafts and traditional delicacies from all over Myanmar. The exquisite lacquerware and globally famous Royal Myanmar Milk Tea here are quintessential souvenirs that every traveler must buy.", "name": "Bogyoke Aung San Market Specialty Shops", "transport": "Take a city bus to Bogyoke Market Station, or walk north from Sule Pagoda for about 10 minutes."}, {"address": "1st Floor, 81 Pansodan Street, Lower Block, Kyauktada Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Shan Woven Scarf, Handmade Marionette Ornament, Yangon Heritage Postcard. An independent lifestyle design brand located on Pansodan Street, collaborating with local disadvantaged artisans and ethnic minorities to transform traditional Myanmar textiles into modern home decor and accessories. All profits are reinvested into local communities, making it a truly heartwarming gift shop.", "name": "Hla Day Crafts \u0026 Social Enterprise Souvenir Shop", "transport": "Walk south along Pansodan St from Sule Pagoda for about 6 minutes."}, {"address": "89 Thein Pyu Road, Botataung Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Recycled Plastic Woven Bag, Myanmar Pattern Cushion Cover, Handcrafted Bamboo Basket. A non-profit fair trade boutique located in the old town area dedicated to empowering people with disabilities and underprivileged women. Combining traditional crafts with innovative design, their products are colorful and durable, highly favored by expats and travelers alike.", "name": "Pomelo for Myanmar Fair Trade Lifestyle Shop", "transport": "Take a taxi from Sule Pagoda for about 5 minutes, or walk east for about 15 minutes."}, {"address": "Level 2, Junction City, Corner of Bogyoke Aung San Road and Dagone Center Street, Pabedan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Lahpet Thoke Kit (Fermented Tea Leaf Salad Kit), Tamarind Flakes Candy, Teamix Instant Milk Tea. A modern supermarket located inside a flagship downtown shopping mall, serving as the most convenient place to buy packaged Myanmar snacks. The tea leaf salad kit is highly recommended, complete with crunchy nuts and special sauce to bring authentic Myanmar flavor back home.", "name": "Marketplace by City Mart - Junction City", "transport": "Located directly opposite Bogyoke Aung San Market, about an 8-minute walk from Sule Pagoda."}, {"address": "130 Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Myanmar Organic Wild Honey, Fleur de Sel (Ayeyarwady Sea Salt), Artisanal Roasted Coffee Beans (Shan State Highlands). The founder insists on using high-quality local agricultural produce to create premium ingredients on par with European standards. The wild honey here is rich and pure, while the locally roasted Shan Highland coffee beans are an absolute must for coffee lovers.", "name": "Sharky\u0027s Pansodan Specialty Local Produce Store", "transport": "Located in the historical Pansodan area of the downtown old town, about a 5-minute walk from Sule Pagoda."}, {"address": "36 Ground Floor, Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: RTH Custom Blend Tea, Spiced Roasted Nuts, Traditional Butter Cookies. A gourmet gift section inside the famous Rangoon Tea House, featuring packaging that combines vintage British style with Burmese elements. Turning local tea culture into elegant gift sets, it is the top choice for souvenirs.", "name": "Rangoon Tea House Specialty Corner", "transport": "About a 6-minute walk from Sule Pagoda."}, {"address": "20th Street, Latha Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Natural Thanaka Wood Log, Thanaka Paste Jar, Herbal Essential Oil Soap. Located in downtown Chinatown, specializing in Thanaka, Myanmar\u0027s thousand-year-old skincare secret. The shop offers pure raw wood logs with grinding stones, as well as ready-to-use skincare pastes that provide natural cooling and sun protection\u2014one of the most authentic local specialties.", "name": "Chinatown Traditional Thanaka \u0026 Herbal Shop", "transport": "Walk west from Sule Pagoda for about 10 minutes into the 20th Street Chinatown area."}, {"address": "Lower Ground Floor, Sule Square, 221 Sule Pagoda Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Grand Royal Whiskey, Crispy Fried Chickpeas/Beans, Coconut Sugar Candy. A modern shopping plaza supermarket right next to Sule Pagoda, convenient for picking up classic local spirits and local snacks. Highly recommended are the internationally award-winning Grand Royal Whiskey and addictively crunchy fried beans, both affordable and packed with Myanmar flavor.", "name": "Marketplace by City Mart - Sule Square", "transport": "Adjacent to Sule Pagoda; a 1-minute walk from Sule Pagoda."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Corner of Bogyoke Aung San Road and Dagon Center Street, Pabedan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Bella cosmetics, Sharky\u0027s artisanal cheese and spreads, Yangon-themed souvenir T-shirts. Junction City is the trendy, premier modern shopping mall in downtown Yangon, located right next to Bogyoke Aung San Market. It houses emerging local designer brands alongside international retailers. For travelers, the basement supermarket and specialty counters are the best spots to pick up high-quality souvenirs, especially affordable local cosmetics like Bella that carry a distinctive regional charm.", "name": "Junction City Shopping Centre", "transport": "About a 10-minute walk from Sule Pagoda"}, {"address": "221 Sule Pagoda Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Myanmar Premium Tea bags, natural Thanaka skincare creams, Spiceworks Myanmar mixed spice jars. Located right next to Sule Pagoda, Sule Square is a modern downtown business and shopping landmark. Beyond fine dining restaurants, it features a premium lifestyle supermarket and dedicated local souvenir sections. The Thanaka skincare products here come in sleek, modern packaging\u2014perfect for gifts\u2014attracting travelers looking for high-quality local goods.", "name": "Sule Square Shopping Mall", "transport": "Located directly opposite Sule Pagoda, just a 1-minute walk"}, {"address": "No. 119/120, Anawrahta Road, Pazundaung Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buy List: Royal Myanmar Teamix instant tea, Grand Royal Whisky, traditional handmade Longyi (sarongs). Sein Gay Par is a classic, established local department store chain in Myanmar, and its branch on Anawrahta Road in Old Town is a beloved favorite among locals. While it lacks the flashy luxury of high-end international malls, its products are remarkably affordable and comprehensive. From clothing and daily necessities to Myanmar\u0027s popular Royal Milk Tea and famous spirits, it is an authentic hub to experience local life and buy bulk snacks.", "name": "Sein Gay Par Super Center (Anawrahta)", "transport": "About a 5-minute taxi ride or a 12-minute walk along Anawrahta Road from Sule Pagoda"}, {"address": "No. 1/7, Sule Pagoda Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.0 stars | Must-Buy List: Shwe Pyi Nann Thanaka sun protection powder cakes, Yoma Myanmar highland coffee beans, lacquerware coasters. Ruby Mart is a well-established local department store in downtown Yangon spanning multiple floors, offering apparel, cosmetics, daily goods, and a fresh supermarket. Since most shoppers here are locals, prices are exceptionally reasonable. If you\u0027re looking to purchase authentic, fairly priced natural Thanaka skincare items or Myanmar-grown highland coffee beans, this is a local retail gem you shouldn\u0027t miss.", "name": "Ruby Mart Department Store", "transport": "About a 6-minute walk south along Sule Pagoda Road"}, {"address": "1st Floor, No. 81, Pansodan Street (Lower Block), Kyauktada Township, Yangon", "feature": "\u2b50 4.8 stars | Must-Buy List: Shan hand-woven shoulder straps, recycled paper elephant ornaments, traditional handloom cotton scarves. Located on an upper floor in Downtown Old Town, Hla Day is an extraordinary lifestyle craft boutique operating as a social enterprise. They collaborate with disadvantaged local artisans and ethnic minority tribes to transform traditional Myanmar crafts into contemporary, stylish design items. Every piece in the shop comes with a story; buying here provides not only exquisite gifts but also direct support for local craftspeople\u0027s livelihoods.", "name": "Hla Day Craft Shop \u0026 Department", "transport": "About a 7-minute walk from Sule Pagoda via Anawrahta Road turning onto Pansodan Street"}, {"address": "Bogyoke Aung San Road, Pabedan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Myanmar jade bangles, exquisite handmade lacquerware jewelry boxes, traditional Myanmar silk fabrics. Though named a market, this massive domed colonial-era complex serves as Yangon\u0027s most historically iconic traditional department hub. Housing hundreds of shops, it is world-famous for raw jade and gemstones, traditional silk fabrics (Longyi), lacquerware, and handicrafts. It is an unmissable cultural shopping destination in downtown Yangon.", "name": "Bogyoke Aung San Market", "transport": "About an 8-minute walk from Sule Pagoda via the pedestrian overpass"}, {"address": "No. 240, Merchant Road, Botahtaung Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Discounted Adidas sneakers, bargain silk Longyis, Myanmar teak woodcarving trinkets. Located downtown, this outlet center is a great spot to hunt for affordable, high-quality apparel and sportswear. Year-round, it offers 30% to 70% off off-season items from international sportswear brands (like Adidas and Puma) as well as premium local silk apparel brands, making it a hit among tourists and local youth alike.", "name": "Yangon Brand Outlet (Downtown Branch)", "transport": "About a 10-minute walk along Merchant Road from Sule Pagoda"}, {"address": "Corner of Maw Waddy Street and Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.0 stars | Must-Buy List: Peacock brand black tea, local roasted peanuts and peanut candy, Myanmar handmade herbal soaps. Situated on the edge of the downtown Old Town area, Point Shopping Centre is a hybrid retail space blending traditional and modern styles. It houses local boutique clothing shops and traditional food stalls rich in local flavor. The supermarket section boasts a wide array of products, especially traditional Myanmar teas and nut snacks, offered at authentic local prices with excellent quality.", "name": "Point Shopping Centre", "transport": "About a 6-minute taxi ride from Sule Pagoda"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Downtown Old Town and Sule Pagoda District"}, "inya_kamayut": {"categories": {"cat_1": {"items": [{"address": "Hledan Centre, Corner of Pyay Road and Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Bella dual-ended cushion compact, Myanmar-exclusive sunscreen primer, herbal repair lip balm. This is Myanmar\u0027s top local cosmetics brand and a favorite among young Burmese women. Offering extremely affordable prices, its high-SPF and oil-control formulas are specially developed for Southeast Asia\u0027s hot and humid climate. The counter located in the Hledan shopping district is always bustling with crowds trying shades and shopping.", "name": "Bella Cosmetics - Hledan Centre Branch", "transport": "Take the Yangon city bus and get off at Hledan Bus Stop, then walk for about 2 minutes."}, {"address": "2nd Floor, Junction Square Shopping Centre, Pyay Road, Kamayut Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Natural Thanaka Pudding face mask, Lemon Thanaka sunscreen powder compact, raw Thanaka wood and grinding stone set. Shwe Pyi Nann is the premier brand representing Myanmar\u0027s Thanaka skincare products. It transforms traditional cooling and sun-protecting powder into modern, convenient moisturizing masks and skincare items, making it a must-try local beauty essential when visiting Yangon.", "name": "Shwe Pyi Nann Thanaka Flagship Counter - Junction Square", "transport": "About a 5-minute drive south along Pyay Road from the west bank of Inya Lake, or take a taxi directly to Junction Square Shopping Centre."}, {"address": "Pyay Road, near Hledan Junction, Kamayut Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Spirulina anti-aging face cream, organic turmeric brightening mask powder, natural neem anti-acne essence. Fame is Myanmar\u0027s most authoritative local organic herbal cosmetics and health brand. All products use botanical extracts cultivated on local organic farms in Myanmar, offering excellent quality and natural ingredients that are highly favored by local middle-class consumers and foreign tourists.", "name": "Fame Organic Herbal Shop - Pyay Road", "transport": "Take a bus to under the Hledan Flyover, then walk north along Pyay Road for about 5 minutes."}, {"address": "Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Taunggyi Myaing pure Thanaka wood block, Jasmine-scented Thanaka moisturizing lotion, traditional herbal mosquito-repellent beauty balm. Located in the Hledan commercial area, this trusted time-honored natural beauty store specializes in high-quality raw Thanaka wood from Taunggyi and various traditional skincare products, preserving authentic Burmese beauty wisdom.", "name": "Taunggyi Myaing Thanaka Store - Hledan", "transport": "Located around Hledan Traditional Market, about a 4- otton and linen clothing tailored for tropical weather, complemented by handcrafted local accessories with a chic, artistic vibe.", "name": "Sprout Local Independent Womenswear Boutique (Hledan)", "transport": "Take a YBS bus to Hledan Bus Stop and walk for about 5 minutes."}, {"address": "Inwa Street, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Signature Myanmar woven leather sandals, vintage leather briefcases, and handmade leather coin purses. A long-standing local leather staple in the Hledan commercial area, specializing in genuine leather footwear and bags handcrafted by local Myanmar artisans. The soles are ergonomically designed and highly durable, making this an amazing choice for high-value, quality leather goods.", "name": "Pwar Pwar Handmade Leather Shoes \u0026 Bags", "transport": "Walk along Inwa Street from under the Hledan Flyover for about 6 minutes."}, {"address": "Pyay Road, Opposite Inya Lake, Kamayut Township, Yangon", "feature": "\u2b50 4.7 stars | Must-Buys: Lotus fiber silk scarves, handwoven Shan cotton-linen shirts, and ethnic-patterned backpacks. Located right next to Inya Lake, this shop features high-end Burmese handmade silk and traditional Shan textiles. All clothing and accessories use natural botanical dyes and handloom weaving techniques, yielding exquisite textures that offer high value for both wearability and collection.", "name": "Inya Silk \u0026 Crafts", "transport": "Take a taxi to the Pyay Road side of Inya Lake, then walk along the lakeside for about 3 minutes."}, {"address": "University Avenue Road, Kamayut Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Organic cotton hand-screenprinted graphic tees, indie handmade canvas tote bags, and Burmese script baseball caps. Located near the intersection of Yangon University and the Hledan shopping district, this independent boutique is a favorite among local hipsters and creators. It gathers works from several emerging Myanmar designers, bursting with street energy and a unique local cultural vibe.", "name": "Rough Cut Artisan Boutique (Myanmar Independent Designer Select Store)", "transport": "Take a taxi to University Avenue and walk for about 4 minutes."}, {"address": "Hledan Street, Kamayut Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Lightweight linen shirts for men, lightweight leather casual shoes, and casual canvas backpacks. A slim-fit clothing store catered specifically to young local men. Combining Southeast Asia\u0027s climate needs with lightweight, breathable shirts and minimalist leather footwear, it is a rare find for quality men\u0027s fashion in the Hledan area.", "name": "Kudos Men\u0027s Wear \u0026 Leather Boutique (Hledan)", "transport": "Take a YBS bus to Hledan Center Stop and walk for about 2 minutes."}, {"address": "Hledan Market Complex, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buys: Handmade Mandalay woven longyis, tailor-made cotton short-sleeve tops, and traditional pattern waist bags. Located around Hledan Market, this store specializes in various local Myanmar fabrics and ready-made longyis. On-site custom tailoring and alteration services are available, making it highly popular among local women and travelers looking to try traditional attire.", "name": "May Wun Handmade Traditional Fabric \u0026 Tailoring (May Wun Fabric \u0026 Longyi Store)", "transport": "Walk from the Hledan Flyover into the Hledan Market area for about 2 minutes."}, {"address": "Pyay Road, Near Dagon Center 2, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Soft-soled genuine leather flip-flops, pearl-embellished flats, and handwoven picnic totes. This women\u0027s shoe shop is a hit among nearby university students and office workers. Footwear is tailored for Southeast Asia\u0027s hot and humid climate, balancing breathability with exceptional comfort. Their exclusively designed handwoven bags are also bestsellers.", "name": "Bella Handmade ents.", "name": "Dagon Centre 1 \u0026 2", "transport": "About an 8-minute walk from Hledan Junction, or take a bus passing Pyay Road to Dagon Centre Stop."}, {"address": "Pyay Road, Kamayut Township, Yangon", "feature": "\u2b50 4.0 stars | Must-buy list: Discounted off-season denim jackets, promotional printed cotton T-shirts, handwoven ethnic-style tote bags. An outlet store in the Pyay Road commercial area specializing in clearance deals on export overstock, odd-size international budget apparel, and factory-direct local ethnic clothing with discounts as low as 70% off.", "name": "Pyay Road Factory Outlet", "transport": "About a 6-minute walk from Hledan Center."}, {"address": "Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Thanaka sun protection cushion foundation, premium brightening facial cleanser, herbal repair hand cream. The flagship store of Myanmar\u0027s most iconic local cosmetics brand, combining Myanmar\u0027s traditional sun-protection remedy \u0027Thanaka\u0027 with modern beauty technology. A must-visit local souvenir spot for tourists.", "name": "Bella Beauty Shop Hledan", "transport": "Located on the 1st floor of Hledan Center; take the bus to Hledan Stop to arrive."}, {"address": "Corner of Pyay Road and Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Royal Myanmar 3-in-1 milk tea packets, Grand Royal Myanmar Whisky, Myanmar wild honey. A large hypermarket in the Hledan area featuring a dedicated specialty section for local Myanmar products. With transparent pricing, it is the best spot to purchase packaged foods and local drinks.", "name": "Ocean Supercenter Hledan", "transport": "Located on B1 of Hledan Center; take the bus to Hledan Stop for direct access."}, {"address": "University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Handcrafted rattan picnic bags, custom Thanaka scented candles, hand-painted lacquerware jewelry boxes. An independent creative craft boutique counter near Inya Lake, bringing together handmade creations from young local Myanmar designers. Excellent quality with a strong Southeast Asian vibe.", "name": "Inya Craft \u0026 Design Center", "transport": "About a 7-minute walk from Inya Lake Park, or about an 8-minute taxi ride from Hledan Commercial Area."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Inya Lake and Hledan Commercial District"}, "thanlyin_kyauktan": {"categories": {"cat_1": {"items": [{"address": "Thanlyin Market, Bogyoke Road, Thanlyin, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Raw Thanaka log, Shwe Pyi Nann natural Thanaka paste, traditional grinding stone (Kyat Pyin). Located in the heart of Thanlyin\u0027s main traditional market, this is the top choice for local women shopping for daily skincare products. Here, you can buy the purest, rawest Thanaka logs\u2014grind and apply anytime for sun protection and mosquito repellent. You can also discover many traditional Myanmar herbal beauty gems.", "name": "Thanlyin Zay Thanaka \u0026 Cosmetics Stalls", "transport": "Take a taxi or local bus to Thanlyin Market Stop; it\u0027s about a 1-minute walk into the market."}, {"address": "Star City, Kyaikkauk Pagoda Road, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Tayaw Kinbun traditional herbal shampoo, Bella local Myanmar lipstick, natural Thanaka handmade soap. Located within the upscale Star City complex in Thanlyin, this clean and bright shop specializes in high-quality Myanmar local beauty products and pharmaceuticals. Popular among local middle-class residents and expats, all items pass strict quality certifications.", "name": "Star City Pharmacy \u0026 Beauty", "transport": "Drive about 10 minutes after crossing the Thanlyin Bridge from downtown Yangon, then enter the Star City complex."}, {"address": "Near Yele Pagoda Ferry Terminal, Kyauktan, Yangon Suburbs", "feature": "\u2b50 4.1 stars |
