 the professional pharmacy and healthcare brand under City Mart, Myanmar\u0027s premier supermarket chain. The branch on Dhammazedi Road is bright and clean. In addition to common international brands, it features a comprehensive section dedicated to local Burmese cosmetics and herbal wellness products. It\u0027s a great place to pick up all popular local Thanaka skincare items at once, backed by reliable quality control and a very comfortable shopping experience.", "name": "City Care Pharmacy - Dhammazedi", "transport": "Take a taxi to Dhammazedi Road, near the Golden Valley area."}, {"address": "East Stairway Market of Shwedagon Pagoda, Shwedagon Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.7 Stars | Must-Buy List: All-Natural Thanaka Log \u0026 Grinding Stone Set, Traditionally Blended Thanaka Balm, Jasmine-Scented Thanaka Water. Located along the eastern approach walkway of the Shwedagon Pagoda (Bahan side), this traditional cosmetics market is the best place to experience centuries-old Burmese skincare culture. Vendors sell authentic Thanaka log segments and stone slabs, and shopkeepers will personally demonstrate how to grind the bark with water into a fine paste. It is a must-visit destination for travelers looking to experience Myanmar\u0027s purest natural sunblock and moisturizing treasure.", "name": "Shwedagon East Gate Thanaka \u0026 Cosmetics Market", "transport": "Take a taxi to the East Gate of Shwedagon Pagoda; it is just a short walk away."}, {"address": "No. 12, Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 Stars | Must-Buy List: Shwe Pyi Nann Jarred Natural Thanaka Paste, Thanaka Firming Clay Mask, Lemon-Scented Thanaka Pressed Powder. Shwe Pyi Nann is Myanmar\u0027s largest exporter and internationally renowned Thanaka cosmetics brand. This store near Bahan Township showcases modern technology applied to traditional Thanaka, transforming bark extracts into easy-to-carry, ready-to-apply pastes and powder products. It eliminates the hassle of grinding the wood yourself, making it a classic Burmese cosmetic souvenir every tourist should buy.", "name": "Shwe Pyi Nann Thanaka Specialty Shop", "transport": "Take a bus or taxi along Kabar Aye Pagoda Road to the Bahan section."}, {"address": "No. 45, Golden Valley Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 Stars | Must-Buy List: Lemongrass Essential Oil Handmade Soap, Thanaka Honey Body Scrub, Cold-Pressed Coconut Lip Balm. Nature\u0027s Care is an independent organic beauty brand rooted in Myanmar, emphasizing pure botanical extracts and eco-friendliness. Tucked away in a quiet, leafy neighborhood of Bahan, this boutique shop exudes a relaxing aroma of natural essential oils. Their handmade soaps are crafted from high-quality local vegetable oils and natural herbs, highly moisturizing and completely free of chemical additives\u2014a hit among quality-conscious women.", "name": "Nature\u0027s Care Organic Skincare - Bahan", "transport": "Take a taxi to Golden Valley Road and walk a short distance inside."}, {"address": "No. 88, West Shwe Gon Daing Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 Stars | Must-Buy List: Taunggyi Shan Plateau Herbal Thanaka Balm, Wild Honey Radiance Cleanser, Traditional Herbal Hair Oil. This unique beauty apothecary incorporates traditional mountain herbs from the Taunggyi highlands of Shan State, Myanmar, into beauty products. The store\u0027s exclusive herbal Thanaka balm blended with highland essential oils offers excellent soothing and anti-inflammatory properties. Though the shop looks modest, it is favored by savvy Yangon locals and is a wonderful spot to uncover unique local skincare remedies.", "name": "Taunggyi Myaing Herbal \u0026 Beauty Shop", "transport": "Take a taxi to West Shwe Gon Daing Road; the shop will be visible right upon getting off."}, {"address": "No. 102, Kinkun Street, Bahan Township, Yangon", "feature": "\u2b50 4.4 Stars | Must-Buy List: Myanmar-Exclusive Thanaka Hydrating Sheet Mask, Aloe Vera Soothing Gel, Local Herbal Fragrance Bath Salts. Beauty Palace is a highly popular multi-brand beauty and cosmetics boutique in Bahan Township, specializing in curated high-quality beauty brands from across Southeast Asia and local Myanmar products. The store features a dedicated \u0027Myanmar Natural Beauty Corner\u0027 offering a wide range of modern sheet masks and skincare infused with Thanaka, aloe vera, and herbal ingredients. Staff members are warm and friendly, and local discount promotions are often available.", "name": "Beauty Palace Myanmar - Bahan", "transport": "Take a taxi to Kinkun Street, near its intersection with Kabar Aye Pagoda Road."}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "Pearl Condo, Building C, Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage Myanmar poster tote bag, vintage-printed Myanmar silk scarf, Burmese pattern clutch. This is one of Yangon\u0027s most iconic local creative design brands, seamlessly blending traditional Myanmar culture, historic vintage photos, and modern fashion aesthetics. The canvas bags and real silk scarves feature unique old-era Yangon motifs and British colonial-style artwork. High quality with a hipster vibe, it is the top choice for local youth and tourists looking for stylish accessories.", "name": "Yangoods - Pearl Condo", "transport": "Take a taxi to Pearl Condo, get off, and walk for about 2 minutes."}, {"address": "Near Kandawgyi Lake, Bahan Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Ethnic hand-woven cotton-linen tote bag, hand-embroidered crossbody bag, boldly colored woven handbag. Pomelo is an independent fair-trade boutique dedicated to supporting vulnerable groups and local artisans in Myanmar. All shoes, bags, clothing, and accessories are handcrafted by local disadvantaged women and ethnic minorities, bursting with vibrant colors and rich ethnic motifs. The handmade cotton-linen bags are durable, stylish, and carry humanitarian spirit, making them hugely popular with Western travelers and local expats.", "name": "Pomelo for Myanmar (Fair Trade Artisanal Boutique)", "transport": "About a 7-minute taxi ride from the East Gate of Shwedagon Pagoda, located near Kandawgyi Lake."}, {"address": "Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Amarapura handwoven silk longyi, Burmese hand-embroidered women\u0027s top, traditional pattern woven scarf. This highly popular local shop specializes in the traditional Burmese attire \u0027Longyi\u0027 and premium silks. The store boasts hundreds of pattern fabrics handwoven by local artisans, lightweight, breathable, and colorfully gorgeous. Customers can pick ready-made longyis or get tailor-made traditional attire on the spot, making it a must-visit to experience traditional Burmese fashion culture.", "name": "Shwe Zin Longyi \u0026 Silk Boutique", "transport": "Take a taxi to near the intersection of Sayar San Road and Universal Gas Station."}, {"address": "Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Royal-style handcrafted velvet flip-flops, fine beaded evening clutch, traditional handwoven straw slippers. This independent shop is famous for crafting Yangon\u0027s traditional velvet shoes (Ah-Pya-Kye). Made with high-end velvet fabrics, the upper features exquisite patterns hand-embroidered with gold/silver threads and delicate beadwork, exuding royal flair while offering incredible comfort. The store also sells matching traditional beaded clutches and folk-style woven bags, perfect for wearing with traditional outfits or taking home as refined gifts.", "name": "Phyu Myanmar Velvet Shoes \u0026 Handcrafted Bags", "transport": "Walk for about 12 minutes along Dhammazedi Road from the North Gate of Shwedagon Pagoda, or take a taxi for about 3 minutes."}, {"address": "De Wun Road, Golden Valley, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Chin ethnic hand-woven crossbody bag, handcrafted leather patchwork bag, plant-dyed traditional cotton dress. Tucked away in an alley in Bahan Township, Augustine\u0027s is a historic and stylish boutique for traditional handicrafts and clothing. The owner collaborates with ethnic tribes across Myanmar to directly source handwoven bags and traditional apparel from the Chin and Shan peoples. Each fabric motif represents a unique tribal story, featuring rich textures and one-of-a-kind designs that stand out.", "name": "Augustine\u0027s Souvenir \u0026 Textile Boutique", "transport": "Take a taxi into the Golden Valley residential area and get off at the entrance of De Wun Road."}, {"address": "Golden Valley Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | Must-buy list: Mandalay hand-jacquard silk scarf, herbal plant-dyed cotton-linen midi dress, Burmese jacquard casual men\u0027s shirt. This local workshop insists on using traditional wooden looms and natural plant dyes to make clothing and accessories. Filled with a simple, natural cotton and linen aroma, the shop offers highly breathable dresses, uniquely tailored casual shirts, and handmade silk scarves\u2014ideal for tropical climates. Locals frequently visit to buy high-quality everyday wear and accessories.", "name": "Bahan Handloom Silk \u0026 Cotton House", "transport": "Take a taxi to near Golden Valley Road and Inya Road to reach."}, {"address": "University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Kachin geometric motif hand-woven crossbody bag, Kachin-style woven women\u0027s shoes, handmade pattern pure cotton belt. This boutique specializes in promoting traditional Kachin textile crafts. Kachin woven fabrics are famed for vibrant red-and-black geometric patterns. The shop incorporates these unique traditional textiles into modern bag and shoe designs, creating items that are both fashionable and rich in ethnic charm. A hidden gem for those seeking distinct, sophisticated taste.", "name": "Kachin Native Crafts \u0026 Attire", "transport": "Take a taxi along University Avenue Road; it is located near the corner of Pearl Condo."}, {"address": "Pearl Street, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Luxurious gold-thread jacquard longyi, hand-embroidered silk shoulder shawl, vintage satin handbag. Seinn Wutt Hmon is a well-known brand for high-end traditional apparel, shoes, and bags in Bahan Township, specializing in attire for major banquets and traditional festivals. The store displays a fine array of intricate gold-thread jacquard fabrics, exquisite embroidered shawls, and handmade satin bags. While prices are slightly higher than general markets, its superior materials and exquisite craftsmanship make it the top choice for local high society and travelers seeking high-quality Burmese traditional wear and fashion accessories.", "name": "Seinn Wutt Hmon Silk \u0026 Longyi Boutique", "transport": "Take a taxi to the intersection of Pearl Street and Kabar Aye Pagoda Road; you will see the prominent signboard."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "East Entrance, Shwedagon Pagoda, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional wooden Buddha statues, specialty lacquerware tea sets, and Thanaka blocks. Located in the east corridor of Shwedagon Pagoda, this spot brings together numerous local artisan stalls, making it the top choice for finding authentic Myanmar cultural souvenirs. The lacquerware here is exquisitely crafted and reasonably priced, while Thanaka blocks are a beloved natural skincare and sun protection staple for local women and children.", "name": "Shwedagon Pagoda East Entrance Souvenir Stalls", "transport": "Take a taxi to the East Gate of Shwedagon Pagoda; walk into the covered walkway corridor to arrive."}, {"address": "117 Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Myanmar wild honey, local artisan organic cheese, and Naypyidaw rock salt. Founded by a legendary Myanmar chef, this premium local brand focuses on gourmet foods crafted from local ingredients. The founder champions local agriculture, transforming high-altitude Myanmar honey and specialty salts into sophisticated souvenir gifts, highly popular among foreign tourists and local elites.", "name": "Sharky\u0027s Gourmet \u0026 Organic Souvenirs (Dhammazedi)", "transport": "Take a taxi to Dhammazedi Road, located near the Golden Valley area."}, {"address": "405 Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Royal Myanmar Tea Mix, pickled tea leaf salad kits (Lahpet Set), and tamarind candies. The most famous upscale supermarket in Bahan Township, featuring a comprehensive local Myanmar souvenir section. From the internationally acclaimed Royal 3-in-1 milk tea to rich Southeast Asian-style tamarind candies and pickled tea kits, you can easily shop for everything in one stop.", "name": "Marketplace by City Mart (Dhammazedi Branch)", "transport": "Take a bus to Dhammazedi Stop, or take a 5-minute taxi ride from Shwedagon Pagoda."}, {"address": "14/A Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.7 stars | Must-Buy List: Shan Plateau Arabica coffee beans, Myanmar drip coffee gift sets, and coffee blossom honey. This is Myanmar\u0027s most iconic local social enterprise coffee brand, carefully selecting Arabica beans grown by ethnic minorities in the high-altitude Shan State. Featuring elegant, Oriental-inspired packaging, rich aromas, and fruity notes, it makes a wonderful souvenir for coffee lovers.", "name": "Genius Specialty Coffee (Bahan)", "transport": "Take a taxi along Dhammazedi Road, near the intersection with Inya Road."}, {"address": "25 Attia Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional hand-woven sarongs (Longyi), classic Burmese wooden puppets, and vintage brass tea caddies. Tucked away in a quiet alley in Bahan Township, this decades-old shop is highly recommended by diplomats and seasoned travelers. Resembling a mini-museum, it houses an extraordinarily rich collection of traditional handicrafts and antiques, with each exquisite item reflecting Myanmar\u0027s deep cultural heritage.", "name": "Augustine\u0027s Souvenir \u0026 Antiques", "transport": "Take a taxi to Attia Road, located near the border between Kamayut and Bahan Townships."}, {"address": "Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buy List: Burmese cashew nut cookies, coconut milk cake gift boxes, and condensed milk tea powder. A time-honored bakery with decades of history in Yangon, this is a go-to souvenir shop for locals during festive seasons. Their handmade cashew cookies are rich, crispy, and generously packed with ingredients\u2014combining traditional Burmese dessert craftsmanship with modern hygienic packaging.", "name": "Shwe Pu Zun Bakery \u0026 Snacks (Bahan Branch)", "transport": "Take a taxi to Sayar San Road, about an 8-minute drive southeast from Shwedagon Pagoda."}, {"address": "Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buy List: Handwoven Shan tote bags, Myanmar natural jade accessories, and handcrafted woven bamboo boxes. Specializing in handcrafted artisan goods from Myanmar\u0027s ethnic minority groups, this workshop supports employment for local tribal women. The woven bags and bamboo boxes are uniquely styled and highly practical, complete with beautifully designed story cards that add warmth and narrative to your souvenirs.", "name": "Crafts of Myanmar (Bahan Store)", "transport": "Take a taxi along Kabar Aye Pagoda Road toward Myanmar Plaza, and the store will be visible along the way."}, {"address": "Near Bahan Local Market, Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buy List: Premium fermented tea leaves (Lahpet), mixed roasted nut crunch, and specially blended black tea leaves. This traditional neighborhood shop is the top choice for locals buying everyday tea leaves and pickled tea salad mixes. Authentic fermented tea leaves paired with crunchy fried beans and nuts perfectly recreate the iconic flavors of Myanmar\u0027s national dish, tea leaf salad.", "name": "Bahan Traditional Tea \u0026 Spice Market", "transport": "Take a taxi to the vicinity of Bahan Market; it\u0027s about a 2-minute walk from there."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Kabar Aye Pagoda Rd, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: Premium Myanmar specialty coffee beans, Bella custom makeup, handcrafted jade charms. Yangon\u0027s largest international shopping mall, located on the east side of Bahan Township, adjacent to Kandawgyi Lake and Inya Lake. Bringing together top local brands and trendy international names, it boasts modern facilities and powerful air conditioning, making it the top shopping choice for local youth and business professionals.", "name": "Myanmar Plaza", "transport": "Take a Grab taxi to the intersection of Kabar Aye Pagoda Road and Parami Road."}, {"address": "Dhammazedi Rd, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Must-Buy List: Royal Myanmar milk tea packets, Grand Royal whisky, Burmese artisanal dark chocolate. Located at the heart of the affluent Golden Valley neighborhood in Bahan, this shopping center focuses on high-quality local specialties and imported goods. It houses several local lifestyle concepts and chic, graffiti-style gift shops, making it the perfect place to buy high-end souvenirs.", "name": "Marketplace by City Mart - Golden Valley", "transport": "Take Bus 21 or 37 to Dhammazedi Road Stop, then walk for about 3 minutes."}, {"address": "Shwegondaing Rd, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Must-Buy List: Giordano past-season sweatshirts, Puma printed T-shirts, discounted Adidas running shoes. Located on Shwegondaing Road in Bahan Township, this outlet store is one of the few in Yangon specializing in discounted international brands, offering sweet deals from 30% to 70% off. Featuring a wide range of export overstocks and off-season sportswear from global brands, it\u0027s a treasure hunt paradise for value-seeking travelers.", "name": "Brand Outlet Store Shwegondaing", "transport": "Take a taxi from the East Gate of Shwedagon Pagoda; it takes about 5 minutes to reach Shwegondaing Road."}, {"address": "Kabar Aye Pagoda Rd, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Must-Buy List: Handcrafted Myanmar jade bracelets, traditional Longyi fabrics, sandalwood combs. A long-standing multi-purpose shopping complex on Kabar Aye Pagoda Road in Bahan, loved by local residents. It gathers numerous independent local jewellers, traditional textile shops, and unique beauty salons, allowing you to buy locally handmade traditional attire and exquisite jade at very affordable prices.", "name": "Pearl Centre Shopping Mall", "transport": "Take Bus 36 to Pearl Condo Stop to arrive."}, {"address": "Pyay Rd, Sanchaung/Bahan Border, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Must-Buy List: Burmese Thanaka beauty powder, local brand sandals, unique printed canvas bags. Adjacent to the border of Bahan Township, this is an iconic local fashion department store in Yangon. Not only does it feature fashion from various local Myanmar designers, but it also boasts a rich array of beauty counters. Highly popular among local students and young professionals, it is ideal for experiencing the most authentic Yangon fashion shopping vibe.", "name": "Dagon Centre II", "transport": "Take a taxi from the West Gate of Shwedagon Pagoda; it takes about 7 minutes to reach Pyay Road."}, {"address": "Near Kandawgyi Lake, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.7 stars | Must-Buy List: Handwoven bamboo and rattan bags, recycled plastic woven placemats, hand-painted Pa-O motif wood carvings. An independent fair-trade craft boutique located near the lakeside in Bahan Township, offering carefully selected handmade cultural products created by disadvantaged communities and ethnic minorities across Myanmar. Each piece carries a unique local story and superb craftsmanship, making them highly collectible and truly one-of-a-kind.", "name": "Pomelo for Myanmar", "transport": "Take a taxi from the South Gate of Shwedagon Pagoda; it takes about 6 minutes to reach the lakeside store."}, {"address": "117 Dhammazedi Rd, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Burmese sea salt, locally roasted organic nuts, house-brewed tropical fruit jams. Founded by a legendary local Burmese chef, this boutique lifestyle eatery and grocery store is nestled in a quiet, leafy neighborhood of Bahan. Specializing in premium artisanal food items and lifestyle goods made from high-quality local produce, it is a must-visit independent shop for tasteful locals and foreign travelers alike.", "name": "Sharky\u0027s Golden Valley", "transport": "Take a taxi to Dhammazedi Road near the Golden Valley area."}, {"address": "Golden Valley Ward 2, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: Handwoven raw silk shawls, hand-woven Chin motif wall hangings, natural herbal plant-dyed cloths. An independent gallery-style boutique specializing in traditional handloom textiles and ancient dye crafts from Myanmar\u0027s ethnic minorities. The shop showcases precious handcrafted textiles from various states across Myanmar, each lovingly created by tribal women. Exquisite and detailed, these make top-tier souvenirs of immense cultural value.", "name": "Bahan Heritage Craft \u0026 Textile Gallery", "transport": "Take a taxi from the North Gate of Shwedagon Pagoda; it takes about 5 minutes to arrive inside the Golden Valley community."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "Bahan and Shwedagon Pagoda Area"}, "botahtaung_waterfront": {"categories": {"cat_1": {"items": [{"address": "No. 120, Strand Road, Botataung Township, Yangon", "feature": "\u2b50 4.6 stars | Must-Buys: Shwe Pyi Nann Pure Thanaka Paste, Thanaka Whitening \u0026 Moisturizing Sheet Masks, Thanaka Herbal Handmade Soap. Located along Strand Road, this is the flagship store of Myanmar\u0027s most iconic Thanaka brand. Myanmar locals traditionally grind Thanaka bark to apply on their faces for sun protection and skincare. This store has converted this traditional holy grail of sun protection into convenient modern cosmetics, making it hugely popular among both local women and foreign tourists.", "name": "Shwe Pyi Nann Thanaka Specialty Shop (Strand Road Branch)", "transport": "Take a taxi to Strand Road, then walk east from the Strand Hotel for about 5 minutes."}, {"address": "Merchant Road, Botataung Township, Yangon", "feature": "\u2b50 4.4 stars | Must-Buys: Bella Thanaka Cushion Foundation, Tropical Long-Lasting Lipstick, Waterproof \u0026 Sweatproof Eyeliner. Bella is Myanmar\u0027s leading domestic makeup brand, hugely popular among young women, specializing in products formulated for Southeast Asia\u0027s hot and humid climate. Their best-selling cushion foundation combines traditional Thanaka\u0027s oil-control properties to keep makeup fresh for hours in the heat, offering great quality at an affordable price.", "name": "Bella Local Cosmetics Shop (Merchant Road)", "transport": "Walk about 8 minutes from Botataung Pagoda, or take a taxi directly to Merchant Road."}, {"address": "Anawrahta Road, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Traditional Myanmar Black Hair Herbal Tonic, Natural Lemongrass Insect Repellent Beauty Spray, Thanaka Firming Cream. May Shan is a historic local pharmacy in Yangon\u0027s port area, specializing in herbal skincare that combines traditional Burmese medical principles with modern technology. Their natural mosquito repellent spray has a soft, non-sticky fragrance, making it a hot-weather essential for locals.", "name": "May Shan Herbal \u0026 Cosmetics (Botataung Branch)", "transport": "Take Bus No. 57 to Botataung Station, then walk about 3 minutes."}, {"address": "Strand Road, near Jetty 4, Botataung Township, Yangon", "feature": "\u2b50 4.5 stars | Must-Buys: Cold-Pressed Virgin Coconut Hair Oil, Organic Thanaka Face Cream, Jasmine Hydrating Facial Mist. This independent local beauty workshop focuses on all-natural, organic, additive-free products using premium Thanaka logs from Central Myanmar and local plant extracts. They demonstrate the traditional Thanaka grinding process on-site, offering customers a pure skincare experience with luxuriously textured products.", "name": "Strand Organic Thanaka \u0026 Beauty Workshop", "transport": "Located opposite Botataung Jetty No. 4; take a taxi directly to Botataung Jetty."}, {"address": "Botataung Pagoda Road, Botataung Township, Yangon", "feature": "\u2b50 4.2 stars | Must-Buys: Travel-Squeeze-Pack Ready-to-Use Thanaka Paste, Royal Herbal Soothing Balm, Natural Turmeric Anti-Acne Cream. Although inside a supermarket, its beauty and pharmacy section boasts one of the most complete collections of famous local Burmese skincare brands and herbal balms. Locals love buying portable pouch packs of Thanaka paste and traditional soothing balms here for guaranteed quality and convenient shopping.", "name": "City Mart Beauty Section (Botataung Tower Branch)", "transport": "Located inside the Botataung Pagoda Road building; walk about 3 minutes from Botataung Pagoda."}, {"address": "Merchant Road, Botataung Township, Yangon", "feature": "\u2b50 4.1 stars | Must-Buys: Traditional Burmese Herbal Massage Oil, Reishi Mushroom Repair Face Cream, Thanaka Facial Cleanser. A long-established herbal drugstore on Merchant Road offering skincare products formulated with unique Myanmar herbs. Its herbal massage oil offers excellent muscle-soothing benefits, while the Thanaka facial cleanser provides deep cleansing, making this store a favorite among local elders and health-conscious shoppers.", "name": "Myanmar Royal Herbal Pharmacy (Merchant Road Branch)", "transport": "Take a taxi for about 7 minutes from Yangon Central Railway Station."}, {"address": "Kannar Road (Strand Road), Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Must-Buys: Handcrafted Thanaka Deodorant Balm, Turmeric \u0026 Thanaka Exfoliating Scrub, Rose Herbal Lip Balm. Located along the waterfront avenue, this charming beauty shop specializes in handmade natural skincare, blending traditional Thanaka with modern fragrances. The body scrub uses natural turmeric and Thanaka granules to leave skin silky smooth, making it a popular souvenir for female travelers visiting the waterfront.", "name": "Sunshine Waterfront Herbal \u0026 Beauty Salon", "transport": "Walk along Kannar Road (Strand Road) in the Botataung Jetty area to arrive."}, {"address": "55th Street, Botataung Township, Yangon", "feature": "\u2b50 4.0 stars | Must-Buys: Burmese Jade Balm, Natural Agarwood Skin Repair Oil, Traditional Thanaka Loose Powder. Hidden deep in the Botataung neighborhood, this traditional herbal and beauty store retains its decades-old pharmacy aesthetic. The agarwood repair oil and jade balm sold here use precious local Burmese ingredients\u2014affordable yet effective\u2014making it the best spot to experience traditional local beauty culture.", "name": "Botataung Traditional Herbal \u0026 Beauty Center", "transport": "Take a taxi to the intersection of 55th Street in Botataung Township and walk about 2 minutes."}], "name": "Iconic Local Beauty \u0026 Cosmetics Shops"}, "cat_2": {"items": [{"address": "Botataung Pagoda Road, Botataung Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Traditional Achik Silk Longyi, Hand-embroidered women\u0027s blouses. This shop is the top choice for Botataung locals and savvy travelers looking for traditional Myanmar ceremonial wear. Handcrafted using premium silk from Mandalay, the fabrics feature rich colors and luxurious comfort. They also offer professional custom tailoring services, highly favored by local celebrities.", "name": "Botataung Silk \u0026 Longyi House", "transport": "Take a taxi to Botataung Pagoda Road; it\u0027s about a 3-minute walk from where you drop off."}, {"address": "Strand Road, Botataung Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Handwoven shoulder bags, Cotton \u0026 linen everyday totes. A stylish boutique located in the waterfront pier area, carefully selecting handwoven fabrics from Myanmar\u0027s ethnic minorities to craft modern, spacious totes and crossbody bags. Featuring unique patterns and exceptional durability, this popular shop perfectly blends local charm with everyday functionality.", "name": "Waterfront Handwoven Textiles \u0026 Bags", "transport": "Take Bus No. 57 to the Strand Road stop, then walk for about 2 minutes."}, {"address": "Merchant Road, Botataung Township, Yangon", "feature": "\u2b50 4.4 stars | Must-buy list: Peacock embroidered velvet slippers, Handmade genuine leather sandals. Preserving decades of shoemaking craftsmanship, this store is famous for its traditional Burmese peacock-pattern velvet slippers, offering ultimate comfort and an elegant royal touch. Their handmade genuine leather sandals are immensely popular and ideal for Yangon\u0027s warm weather.", "name": "Yangon Heritage Leather \u0026 Velvet Slippers", "transport": "Walk for about 5 minutes along Merchant Road from Botataung Jetty."}, {"address": "Bo Aung Kyaw Street, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Must-buy list: Patterned handmade canvas shoes, Traditional floral drawstring backpacks. Founded by young local designers in Yangon, this boutique fuses traditional Burmese longyi patterns into modern canvas sneakers and backpacks. Stylish yet rich in local heritage, it\u0027s a favorite original accessory shop among young backpackers and local trendsetters.", "name": "Burmese Vibe Canvas Shoes \u0026 Bag Studio", "transport": "Take a taxi to Bo Aung Kyaw Street and get off near the waterfront pier area; the shop is right there."}, {"address": "Anawrahta Road, Botataung Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Royal peacock-pattern cotton longyi, Handmade silk scarves. Specializing in high-end traditional Myanmar attire and accessories, this shop is renowned for its royal-grade peacock feather motif longyis. Lightweight, breathable, and vibrant with non-fading colors, it is highly praised by local shoppers visiting Botataung for fine clothing.", "name": "Royal Peacock Longyi \u0026 Fashion Shop", "transport": "Take a taxi to the intersection of Anawrahta Road and Botataung Pagoda Road."}, {"address": "Maha Bandula Road, Botataung Township, Yangon", "feature": "\u2b50 4.2 stars | Must-buy list: Everyday handmade cotton longyi, Traditional fabric pouches \u0026 coin purses. Offering high-quality daily longyis at budget-friendly prices, this cozy local store also sells various handmade fabric pouches sewn by local women. It\u0027s a wonderful place to experience Myanmar\u0027s daily outfit culture and pick up charming souvenirs.", "name": "Yangon Impression Handwoven Longyi \u0026 Accessories", "transport": "Take Bus No. 36 to the Maha Bandula Road stop, then walk about 4 minutes."}, {"address": "Pansodan Jetty Area, Botataung Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Handcrafted rattan picnic bags, Beach-style woven sandals. Located right next to Botataung Jetty, this popular waterfront shop specializes in handmade rattan bags and natural fiber woven sandals. Each piece is intricately han Yaw Min Gyi Street, about a 5-minute drive from the National Museum of Myanmar."}, {"address": "Dagon Centre 1, Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: Opal Herbal Shampoo, Myanmar Thanaka Repairing Lotion, Herbal Essential Oil Acne Paste. City Mart is a high-quality supermarket chain in Yangon, featuring a beautifully curated pharmacy/beauty section. This branch carries Myanmar\u0027s best-selling local skincare and pharmaceutical beauty products. With a bright, comfortable environment and clearly marked prices, it\u0027s a great one-stop shop for popular Thanaka skincare and natural botanical toiletries from top local brands.", "name": "City Mart Pharmacy (Dagon Branch)", "transport": "Take a bus to Dagon Centre Stop, or take a taxi directly to the main entrance of the shopping center."}, {"address": "Nawaday Street, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Must-Buy List: All-Natural Handmade Cold-Process Soap, Extra Virgin Cold-Pressed Coconut Oil Cream, Thanaka Tinted Lip Balm. Located in the stylish Nawaday neighborhood of Dagon Township, this independent boutique collaborates with local organic small farmers to offer clean beauty products. All items emphasize natural handcrafted methods, utilizing locally produced cold-pressed coconut oil, sesame oil, and Thanaka extracts. Soothing and naturally scented, it is a prime spot for non-toxic skincare seekers and high-quality souvenirs.", "name": "Nawaday Organic \u0026 Beauty House", "transport": "About a 12-minute walk or a 3-minute taxi ride from the National Museum of Myanmar to Nawaday Street."}, {"address": "Pyidaungsu Yeiktha Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Thanaka Wood Log \u0026 Grinding Stone Set, Thanaka Cooling Setting Powder, Jasmine Thanaka Sleeping Mask. This specialty store is dedicated to promoting and selling Thanaka, Myanmar\u0027s iconic traditional beauty holy  Signature Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 23, Yaw Min Gyi Street, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage Myanmar pattern T-shirts, Yangon city icon tote bags, Burmese text printed baseball caps. This store is a favorite original brand among young local creators and fashion-forward crowds in Yangon, specializing in blending traditional Myanmar cultural elements\u2014such as Yangon buses, longyi patterns, and historic architecture\u2014into modern streetwear. The apparel boasts top-notch quality and exceptional design, making it not only a hit with local trendsetters but also a top pick for savvy travelers seeking unique, original Myanmar clothing and bags.", "name": "Yangods - Yaw Min Gyi", "transport": "Take a taxi to Yaw Min Gyi Street; it\u0027s about a 2-minute walk from there."}, {"address": "1st Floor, No. 81, Nawaday Street, Dagon Township, Yangon", "feature": "\u2b50 4.7 stars | Must-buy list: Handwoven rainbow tote bags, printed Myanmar cotton casual shirts, handmade fabric coin purses. Located on Nawaday Street in Dagon Township, Hla Day is a social enterprise design shop dedicated to supporting disadvantaged local artisans and designers. The clothing, shoes, and bags sold here are entirely handmade by local communities in Myanmar, fusing traditional ethnic textile crafts with modern fashion cuts. Vibrant and durable, every item carries a warm local story, making it a high-quality shopping landmark with meaningful social impact.", "name": "Hla Day Crafts \u0026 Creative Apparel/Bags Store (Hla Day)", "transport": "About a 5-minute taxi ride from the National Museum; walk down Nawaday Street upon arrival."}, {"address": "Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Must-buy list: Premium handwoven silk longyis, pure cotton patterned skirts, traditional women\u0027s cropped tops. Located in Dagon Township, Pann Cherry is a famous store where locals shop for s
