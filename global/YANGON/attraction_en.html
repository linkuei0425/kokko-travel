mns still exude the grand stature of imperial administrative buildings, making it a key landmark for exploring the industrial and trade history of Yangon\u0027s periphery.", "name": "Old Colonial Port Authority Building", "transport": "Located near the old port area of Thanlyin, accessible by taxi in about 10 minutes from Thanlyin town center."}, {"address": "Mahawaddy Area, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 3.9 stars | The Mahawaddy Ancient Wall Ruins are important archaeological remains left by the classical Mon civilization in the Thanlyin area. Dating back several centuries, this ancient wall served as a crucial defensive rampart against invaders. Today, hidden amidst dense foliage and countryside fields, the surviving earthen ramparts and stonework reveal ancient craftsmanship and defensive ingenuity. Strolling around the ruins evokes a deep sense of historical nostalgia for a once-thriving ancient kingdom.", "name": "Mahawaddy Ancient Wall Ruins", "transport": "Located in the rural outskirts of Thanlyin town; it is recommended to hire a private driver familiar with the local area to reach the site."}, {"address": "Thanlyin-Kyauktan Highway, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | The Kyaik De-Wet Pagoda Complex is a set of pre-colonial historical structures located along the Thanlyin-Kyauktan Highway. Renowned for its unique Mon-style brickwork and multi-tiered bases, the pagodas feature detailed carvings of mythical Buddhist beasts and floral motifs. While smaller than Kyaik Khauk Pagoda, it retains an unvarnished, rustic charm filled with a tranquil and solemn religious aura, making it a great spot to appreciate ancient local architectural art and traditional Buddhist faith.", "name": "Kyaik De-Wet Pagoda Complex", "transport": "Located along the highway en route to Kyauktan Ye Le Pagoda; accessible by taxi or chartered car as a quick stop on the way to Kyauktan."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Thanlyin Main Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located in Thanlyin Township on the outskirts of Yangon, the Old Portuguese Church Ruins are the remains of a Catholic church established in the 17th century during the reign of the Portuguese adventurer Filipe de Brito e Nicote. Although this ancient brick structure has weathered centuries of elements and natural encroachment, it still features grand arched doorways and thick walls, showcasing a unique European colonial style and rustic charm. Strolling through the site, visitors can feel a deep sense of historical serenity, making it a must-visit cultural spot for history enthusiasts and photographers exploring Thanlyin.", "name": "Old Portuguese Church Ruins", "transport": "Takes about 45 minutes to 1 hour by taxi from downtown Yangon via Thanlyin Bridge."}, {"address": "Catholic Church Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Immaculate Conception Catholic Church is one of the most iconic Gothic religious buildings in the area. The exterior features soaring spires and elegant Gothic arches, while the stained glass and intricately carved wooden altar inside emit a solemn and serene glow in the sunlight. Beyond being a spiritual center for local Catholics, it houses artifacts and records left by colonial-era missionaries, perfectly blending Western religious art with local community history.", "name": "Immaculate Conception Catholic Church Thanlyin", "transport": "About a 10-minute drive from the Old Portuguese Church Ruins; reachable by tuk-tuk or taxi from downtown Thanlyin."}, {"address": "Kyauktan Township, South of Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Attached to the famous Kyauktan Ye Le Pagoda, this heritage gallery displays precious historical artifacts, ancient Buddha carvings, and traditional Burmese handicrafts related to the pagoda\u0027s founding. It offers an accessible look at the miracle legends and craftsmanship behind building this mid-river sanctuary in the 18th century, showcasing exquisite religious offerings and historical documentation. Visitors can gain a deeper understanding of local faith and culture alongside their boat journey to the shrine.", "name": "Kyauktan Ye Le Pagoda Heritage Gallery", "transport": "Drive from downtown Yangon to Kyauktan Jetty, then take a local wooden boat across the river to visit both the gallery and the pagoda."}, {"address": "Station Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | St. Joseph\u0027s Catholic Church is a peaceful landmark rich in history and community spirit, carrying on Thanlyin\u0027s Catholic traditions that date back to the 17th century. Featuring an elegant, refined exterior surrounded by lush gardens, the church has a solemn interior displaying statue sculptures and religious artwork brought by early missionaries, offering a quiet sanctuary to explore Thanlyin\u0027s diverse religious heritage.", "name": "St. Joseph\u0027s Catholic Church Thanlyin", "transport": "About a 5-minute ride by taxi or motorbike taxi from Thanlyin Market."}, {"address": "Near Old Port Area, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | The Thanlyin Local Heritage Center documents the historical transformation of Thanlyin (formerly Syriam) from an ancient maritime trade hub through the Portuguese occupation, the Mon Kingdom era, and British colonial rule. The museum displays historical harbor maps, porcelain fragments from maritime trade, colonial-era photographs and documents, as well as traditional Burmese textiles and crafts. This small museum captures Thanlyin\u0027s rich multicultural tapestry, making it an essential cultural stop for understanding this historic town.", "name": "Thanlyin Local Heritage Center", "transport": "Drive along the main road for about 15 minutes after getting off Thanlyin Bridge; located near the Old Port area."}, {"address": "Main Street, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Built in the early 20th century, Thanlyin Methodist Church exhibits a simple yet elegant neoclassical architectural style, bearing witness to the development of Western Protestantism on the outskirts of Yangon. The church features clean white walls and refined wooden interior structures, housing historic pipe organs and ancient Bible manuscripts. Regular musical worships and community cultural events are hosted here, adding a warm and tranquil spiritual ambiance to the local atmosphere.", "name": "Thanlyin Methodist Church", "transport": "Located in central Thanlyin; about an 8-minute walk from Thanlyin Roundabout after arriving by bus or taxi."}, {"address": "Riverfront Zone, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | The Thanlyin Old Customs House Site stands as historical testimony to Yangon\u0027s key gateway for foreign trade during the British colonial era. This masonry building features arched corridors and a grand Western-style layout, showcasing late 19th-century colonial architecture and design aesthetics. Although now repurposed as a heritage display area, its textured walls and antique architectural details remain well-preserved, attracting visitors interested in historical architecture, colonial culture, and photography.", "name": "Thanlyin Old Customs House Site", "transport": "About a 5-minute walk from the Old Jetty area in Thanlyin."}, {"address": "Bogyoke Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | The Thanlyin Seventh-day Adventist Church is a distinctive modern religious and cultural landmark in Thanlyin. Combining sleek modern lines with local Burmese woodwork, the serene interior features a community library and a heritage corner preserving precious documents and photos from early missionary history. Its adjacent green park offers residents and visitors a pleasant space for quiet reflection and cultural connection.", "name": "Thanlyin Seventh-day Adventist Church", "transport": "Drive along Bogyoke Road; directly accessible by taxi or ride-hailing services."}], "name": "Arts \u0026 Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kyauktan Township, Yangon Region, Myanmar", "feature": "\u2b50 4.5 stars | Kyauktan Ye Le Pagoda Riverfront boasts a highly unique island-in-the-river ecosystem and natural scenery. Visitors can board wooden ferries to cross the wide Kanakaung River, admiring mangroves and aquatic birds that rise and fall with the tide along the way. The riverfront area features viewing platforms where fiddler crabs and mudskippers can be seen active on the mudflats during low tide. At dusk, the golden sunset glows across the water, reflecting off the glittering pagoda, making it an excellent summer retreat blending natural waterfront charm with spiritual ambiance.", "name": "Kyauktan Ye Le Pagoda Riverfront Scenic Area", "transport": "It takes about 1.5 hours by taxi from downtown Yangon to reach Kyauktan Jetty, after which you can walk to the riverside park area or take a ferry."}, {"address": "Kyaikkauk Pagoda Road, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located on the highest hill in Thanlyin, Kyaikkauk Pagoda is surrounded by dense tropical secondary forests and ancient trees. This forest reserve preserves numerous centuries-old camphor and Bodhi trees with rich canopies, attracting various tropical birds and wild squirrels. Strolling through the lush green hills along stone steps offers a cool, peaceful escape from the hustle and bustle. Reaching the summit rewards you with an exceptionally open, natural vista overlooking Thanlyin Township and the distant confluence of the Bago River.", "name": "Kyaikkauk Pagoda Forest Park", "transport": "After crossing the Thanlyin Bridge from downtown Yangon, drive along Main Road for about 20 minutes to reach the foot of Kyaikkauk Pagoda Hill."}, {"address": "Star City, Kyaikkauk Pagoda Road, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located along the banks of the Bago River in Thanlyin, Star City Central Park is the largest and best-maintained contemporary landscape park in the area. The park features vast, manicured lawns, winding lakeside jogging paths, and extensive tropical botanical gardens. The riverside promenade stretching along the Bago River offers open river views and refreshing breezes. With large artificial lakes and ecological wetland ponds, it is a popular natural retreat for locals and tourists to picnic, exercise, and watch the sunset.", "name": "Star City Central Park \u0026 Riverside Promenade", "transport": "From downtown Yangon, cross the Thanlyin Bridge and turn left into the Star City community entrance. The drive takes about 45 minutes."}, {"address": "Kandawgyi Lake Area, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Thanlyin Kandawgyi Lake is a historic natural reservoir and greenbelt reserve. Sharing its name with downtown Yangon\u0027s Kandawgyi, it offers a more rustic and pristine countryside feel. Surrounded by tall rubber trees and wildflowers, the lake\u0027s water is clear as a mirror, where egrets and waterfowl frequently forage among the aquatic plants. Quiet and sparse in crowds, a walk along the lakeside paths lets you experience authentic Myanmar rural nature\u2014a hidden spot for photography enthusiasts to capture water reflections and birdlife.", "name": "Thanlyin Kandawgyi Lake \u0026 Park", "transport": "Located on the east side of Thanlyin Township. Chartering a car or taking a taxi from downtown Yangon is recommended, taking about 1 hour."}, {"address": "Thilawa Port Area, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Situated in southern Thanlyin near the mouth of the Yangon River, the Thilawa Mangrove Reserve is one of the few well-preserved estuarine wetland ecosystems near Yangon. Dense mangrove vegetation provides an ideal habitat and breeding ground for young fish, crabs, and numerous migratory birds. Visitors can venture deep into the mangroves along wooden boardwalks to observe rich aquatic wildlife and experience the vibrant life of estuarine wetlands at low tide, making it a great destination for eco-education and birdwatching.", "name": "Thilawa Mangrove \u0026 Wetland Reserve", "transport": "Drive from downtown Yangon via Highway No. 3 towards the Thilawa Special Economic Zone; the journey takes about 1 hour and 15 minutes."}, {"address": "Near Thanlyin Bridge East End, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Located at the eastern foot of the Thanlyin Bridge crossing the Bago River, this area features magnificent waterfront views. Natural sandbars and mudflats form along the bank, presenting dynamic riverfront landscapes that shift with the tides. Many locals love coming here in the early morning or evening to stroll, enjoy the breeze, and admire the grand structure of the bridge alongside busy fishing boats. In autumn, flocks of migratory birds flying across the Bago River add to the refreshing atmosphere.", "name": "Thanlyin Bridge Bago Riverfront", "transport": "After crossing the Thanlyin Bridge from downtown Yangon, immediately pull into the riverside side road to arrive. The drive takes about 35 minutes."}, {"address": "East Yangon University, Thanlyin Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | The East Yangon University campus boasts remarkably high green coverage, resembling an open-air botanical garden. Lined with mature trees and tropical shrubs, the campus features several natural ponds and lush green lawns, creating a tranquil and peaceful academic and natural atmosphere. Walking down the tree-lined avenues accompanied by chirping birds is wonderfully refreshing. It is also an excellent place to observe native Myanmar plant species and experience a suburban academic green oasis.", "name": "East Yangon University Green Campus", "transport": "Located along the main road in Thanlyin Township, it takes about 50 minutes by taxi from downtown Yangon to reach the university main gate."}, {"address": "Southern Coastal Road, Kyauktan Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Located in the southernmost coastal area of Kyauktan Township, this natural coastal greenbelt sits at the confluence of the Yangon River and the Gulf of Martaban. It offers panoramic, unobstructed views of the expansive waters where the river meets the sea. Wild coastal vegetation and meadows grow along the shoreline, making it a secret sanctuary for watching ocean sunsets and feeling the soothing sea breeze. Far from urban noise, gentle rolling waves and calling seabirds provide ultimate relaxation.", "name": "Kyauktan Coastal Greenbelt \u0026 Sunset Point", "transport": "Continue driving south from Kyauktan town center for about 15 minutes to reach the coastal greenbelt."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Kyauktan Township, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.6 Stars | Situated in the middle of a tributary of the Bago River in Kyauktan, this floating pagoda is Thanlyin\u0027s most famous landmark, legendarily never submerged no matter how high the tide rises. Take a traditional wooden boat to this sacred golden pagoda, feed giant catfish from the floating boardwalk, and admire the sacred architecture surrounded by shimmering waters. It is an absolute must-visit and uniquely scenic photo spot.", "name": "Kyaik Hti Yele Pagoda (Kyauktan Ye Le Pagoda)", "transport": "Take a taxi from downtown Yangon for about 1.5 hours to Kyauktan Jetty, then take a 5-minute ride on a traditional ferry boat to reach the pagoda."}, {"address": "Kyaik Khauk Pagoda Road, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.5 Stars | Standing atop a hill in Thanlyin, the centuries-old Kyaik Khauk Pagoda resembles Yangon\u0027s Shwedagon Pagoda but offers a quieter, more tranquil atmosphere. The glittering main golden stupa is surrounded by intricate smaller pagodas and stone carvings. Ascend to the hill platform for panoramic views of Thanlyin\u0027s lush greenery and winding rivers. At sunset, it glows radiantly in golden light, making it a spectacular location to capture sunset and pagoda photography.", "name": "Kyaik Khauk Pagoda", "transport": "Take a taxi from downtown Yangon across the Thanlyin Bridge, then drive along the main road for about 10 minutes to arrive."}, {"address": "Near Kyaik Khauk Pagoda Road, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.1 Stars | Built in the mid-18th century by Portuguese explorers and missionaries, these Catholic church ruins now consist of weathered red-brick walls and arches. Covered in green vines and the marks of time, the old red bricks exude a serene, mystical aesthetic of ruin romanticism that attracts photography enthusiasts and influencers looking for vintage-style photos.", "name": "Thanlyin Old Portuguese Church", "transport": "Take a taxi or a local tuk-tuk from Kyaik Khauk Pagoda for about 5 minutes."}, {"address": "Near Kyauktan Jetty, Kyauktan Township, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.0 Stars | Located next to the boat jetty heading to Kyaik Hti Yele Pagoda, this lively traditional market overflows with local Burmese life. Packed with vendors selling fresh fruit, local snacks, handicrafts, and traditional Thanaka powder, strolling here lets you experience authentic local culture while capturing vibrant, colorful lifestyle photos set against the bustling waterfront.", "name": "Kyauktan Riverside Market", "transport": "Located directly in front of the floating pagoda ferry jetty, easily accessible on foot."}, {"address": "Kyaik Khauk Pagoda Road, StarCity, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.4 Stars | StarCity Thanlyin is a modern eco-community in the suburbs of Yangon, boasting high greenery coverage, beautiful scenic lakes, and a standard golf course. Providing a striking contrast to the ancient pagodas, its fresh European-style streets, sprawling manicured lawns, and stylish cafes make it an emerging hotspot for young locals and expats to stroll, play sports, and take photos over the weekend.", "name": "StarCity Thanlyin \u0026 Golf Club", "transport": "Drive from downtown Yangon across the Thanlyin Bridge, turn right, and arrive at the main StarCity entrance in about 5 minutes."}, {"address": "Bago Riverbank near Thanlyin Bridge, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Connecting downtown Yangon with Thanlyin, the Thanlyin Bridge is a major transport hub, while the Bago Riverbank beneath it is a hidden gem for admiring sunsets and panoramic views of the bridge. At dusk, the setting sun paints the river in shades of gold and crimson, with distant boats floating past the majestic steel bridge\u2014a romantic and grand backdrop that draws photographers and couples alike.", "name": "Thanlyin Bridge Bago Riverfront Sunset Spot", "transport": "Take a taxi from downtown Yangon to the riverbank just under the eastern bridgehead of Thanlyin Bridge."}, {"address": "Thanlyin Main Road, Thanlyin, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | Meaning \u0027Wish-Fulfilling Pagoda,\u0027 this holy place is a cherished site for locals to pray and seek blessings. Shaded by trees, the grounds exude a peaceful, solemn ambiance, with the grand gold-and-white stupa shining brilliantly against the blue sky. Free from downtown crowds, it offers a tranquil atmosphere to experience authentic Burmese Buddhist culture and capture serene moments on camera.", "name": "Maha Suthaung Pyi Pagoda Thanlyin", "transport": "Take a tuk-tuk or taxi from Thanlyin town center; reachable in about 8 minutes."}, {"address": "Riverfront Road, Kyauktan-Thanlyin Coastal Area, Yangon, Myanmar", "feature": "\u2b50 4.1 Stars | Situated along the mouth where Thanlyin meets the Bago River, a collection of scenic waterfront and stilt pavilion restaurants serves fresh seafood and traditional Myanmar cuisine. Guests can dine comfortably in cool bamboo stilt huts while taking in sweeping views of the open estuary and lush greenery\u2014a perfect spot to unwind, feast, and photograph the riverside landscape after visiting the floating pagoda.", "name": "Bago Estuary Riverside Restaurants", "transport": "Take a taxi or motorbike taxi from the Kyauktan Ye Le Pagoda jetty; about a 10-minute drive to the waterfront dining area."}], "name": "Popular Photo Spots"}}, "name": "Thanlyin and Ye Le Pagoda Outskirts"}, "yankin_kabaraye": {"categories": {"cat_1": {"items": [{"address": "Kaba Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Completed in 1952, Kaba Aye Pagoda was commissioned by Myanmar\u0027s first Prime Minister, U Nu, to pray for world peace and prepare for the 6th World Buddhist Synod. Standing approximately 34 meters high, the pagoda is surrounded by colorful Buddhist light rays symbolizing peace and numerous exquisite Buddha statues. Sacred relics of the Buddha and Venerable Maha Moggallana are enshrined inside, making it the central and most historically significant Buddhist sanctuary and landmark in the Kaba Aye commercial district.", "name": "Kaba Aye Pagoda", "transport": "Take a bus or taxi straight along Kaba Aye Pagoda Road to reach the main entrance."}, {"address": "Kaba Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Modeled after the Sattapanni Cave in Rajgir, India, Maha Pasana Cave was completed in 1954. Measuring 139 meters long and 110 meters wide, this grand cave-like structure features a massive column-free interior hall. It hosted the Sixth Buddhist Synod from 1954 to 1956, accommodating thousands of monks chanting simultaneously, making it one of the most important architectural wonders in Myanmar\u0027s modern Buddhist history.", "name": "Maha Pasana Cave", "transport": "Located inside the Kaba Aye Pagoda complex, about a 3-minute walk from the main pagoda entrance."}, {"address": "Dhammapala Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Located near the northern section of Kaba Aye Pagoda Road and built in the 1990s, Swe Taw Myin Pagoda features a grand architectural style inspired by ancient Bagan-era stepped towers and classic polygonal symmetry. In the center, a resplendent gilded shrine houses a sacred replica of the Buddha\u0027s tooth relic brought from China. The elaborate spire and wall decorations showcase the pinnacle of modern traditional Burmese Buddhist craftsmanship.", "name": "Swe Taw Myin Pagoda (Yangon Tooth Relic Pagoda)", "transport": "Turn off Kaba Aye Pagoda Road onto Dhammapala Road; it takes about a 5-minute taxi ride to arrive."}, {"address": "Kaba Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Situated along Kaba Aye Pagoda Road, this multi-story landmark building was constructed in the late 20th century as a key official location in Yangon showcasing Myanmar\u0027s national treasures\u2014jade, rubies, sapphires, and pearls. Combining modern and traditional Burmese elements, the building features an official gem mart on its top floor, standing witness to decades of prosperity in Myanmar\u0027s gem industry.", "name": "Myanma Gems Museum Building", "transport": "Located along Kaba Aye Pagoda Road; get off at the Gems Museum bus stop."}, {"address": "37 Kaba Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Completed in 1961, the Inya Lake Hotel is a modernist landmark gifted to Myanmar by the former Soviet Union. Situated on the shores of Inya Lake right off Kaba Aye Pagoda Road, this historic luxury hotel blends grand Soviet architecture with lush tropical gardens. Having hosted numerous foreign heads of state and dignitaries, it remains one of the most iconic 20th-century architectural heritage sites in the Kaba Aye area.", "name": "Inya Lake Hotel Historic Building", "transport": "Drive along Kaba Aye Pagoda Road; located on the eastern shore of Inya Lake, about a 15-minute drive from downtown Yangon."}, {"address": "Kaba Aye Pagoda Compound, Kaba Aye Pagoda Road, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Located within the cultural complex of the Kaba Aye Pagoda grounds, the National Religious Museum was established in the late 20th century to collect and preserve Buddhist artifacts, ancient monastic manuscripts, carvings, and ceremonial items from various eras of Myanmar. Featuring traditional Burmese palace-style roofs (Pyatthat), it is a key site for exploring Myanmar\u0027s religious history and architectural aesthetics.", "name": "National Religious Museum", "transport": "Located inside the Kaba Aye Pagoda complex; take a taxi directly to the main gate and walk inside."}, {"address": "Thanthumar Road, North Okkalapa Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Situated in the extended Kaba Aye commercial area, Melamu Pagoda is a historic Buddhist site with a whimsical, fairy-tale vibe. According to legend, its origins date back to the founding of Yangon. The grounds are filled with large, vivid concrete statues illustrating scenes from the Buddha\u0027s previous lives (Jataka tales). Its colorful and folk-art architectural style draws countless devotees and culture enthusiasts.", "name": "Melamu Pagoda", "transport": "Turn northeast from Kaba Aye Pagoda Road onto Thanthumar Road; it takes about 10 minutes by taxi."}, {"address": "Yankin Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Built during the mid-20th-century development of Yankin Myothit (New Town), Yankin Baptist Church is one of the most prominent Christian historic buildings in the area. Combining simple Western modern Gothic revival with tropical architectural design, its towering cross spire and classic wooden pews evoke a strong sense of community history, reflecting the harmonious co-existence of diverse faiths and ethnic groups in Yankin.", "name": "Yankin Baptist Church", "transport": "Take a taxi to the junction near Yankin Road and Kaba Aye Pagoda Road."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Kaba Aye Pagoda Road, Mayangone / Yankin Area, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Located next to the famous Kaba Aye Pagoda (World Peace Pagoda), this museum houses a vast collection of historical and artistic Buddhist artifacts, including precious gold and silver Buddha statues, ancient palm-leaf manuscripts, Buddhist art gifts from around the world, and exquisite stone carvings. The quiet and elegant display spaces make it an excellent spot to delve deep into the evolution of Myanmar\u0027s Buddhist art and religious culture.", "name": "Kaba Aye Buddhist Art Museum", "transport": "Take a taxi along Kaba Aye Pagoda Road and get off inside the Kaba Aye Pagoda compound."}, {"address": "Kaba Aye Pagoda Road, Mayangone / Yankin Area, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Situated on Kaba Aye Pagoda Road, this specialized museum showcases Myanmar\u0027s national treasure-grade gemstones and mineral art. The third floor features an exhibition hall displaying world-famous Burmese rubies, sapphires, jade, and massive natural quartz crystals, creating a visually stunning experience. The first and second floors serve as a licensed gem mart, allowing visitors to not only admire mineral art but also experience gemstone culture firsthand.", "name": "Myanmar Gems Museum", "transport": "Take a bus or taxi to the intersection of Kaba Aye Pagoda Road and the Gem Museum."}, {"address": "Inya Road / Near Yankin Border, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Nestled near a lush green residential area away from the bustling city center, this historic Catholic church features elegant Gothic and European architectural charm. The building boasts graceful spires and beautiful stained-glass windows, creating a solemn and serene atmosphere inside. Attracting numerous local worshipers every Sunday Mass, it is a vital center for local Catholic faith and culture.", "name": "St. Augustine\u0027s Catholic Church", "transport": "About an 8-minute taxi ride from Yankin Center."}, {"address": "Kaba Aye Pagoda Campus, Kaba Aye Pagoda Road, Yangon, Myanmar", "feature": "\u2b50 4.7 stars | Built to host the Sixth Buddhist Synod, this massive man-made cave was modeled after the famous Saptaparni Cave in India. Capable of holding over ten thousand people, it holds immense architectural and religious history value. The adjoining Buddhist Library preserves a vast collection of Pali scriptures and religious arts literature gifted from various nations, making it a grand sanctuary to experience the depth of Buddhist heritage.", "name": "Maha Pasana Cave \u0026 Buddhist Library", "transport": "Take a taxi to the Kaba Aye Pagoda compound and walk directly into the Maha Pasana Cave area."}, {"address": "Yankin Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located in the heart of Yankin Township, this community Catholic church features a simple yet elegant architectural style that blends modern and traditional religious elements. Set in graceful surroundings with a statue of the Sacred Heart inside, it serves as a spiritual sanctuary for local Catholics and highlights Yangon\u0027s unique cultural landscape of peaceful religious co-existence.", "name": "Sacred Heart Church Yankin", "transport": "Take a taxi to the central area of Yankin Township and walk for about 3 minutes."}, {"address": "Near Kaba Aye Pagoda Road / Inya Lake vicinity, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | This modern arts space regularly hosts high-quality exhibitions featuring contemporary Myanmar artists, photographers, and sculptors. Exhibits range from oil paintings, watercolors, and installation art to visual photography, capturing the collision and fusion of traditional Burmese culture with modern visual arts. It is a premier gallery for exploring Yangon\u0027s contemporary art scene.", "name": "The Yangon Gallery", "transport": "Take a taxi along Kaba Aye Pagoda Road and turn into the dedicated access road near the gallery."}, {"address": "Kaba Aye Pagoda Compound, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located around the main stupa of Kaba Aye Pagoda, this museum is dedicated to exhibiting historical records from the pagoda\u0027s construction, sacred relic treasures, and fine craft gifts presented by heads of state and Buddhist leaders from around the world. Displays include metal carvings, jade Buddha sculptures, and distinct ethnic crafts, showcasing a rich history of cultural exchange.", "name": "Kaba Aye Pagoda Heritage Museum", "transport": "After entering the main gate of Kaba Aye Pagoda, follow the signage on foot to the museum area."}, {"address": "Kaba Aye Pagoda Road, Yankin / Mayangone border, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Located along Kaba Aye Pagoda Road, this cultural exhibition and retail space is dedicated to promoting and preserving traditional Myanmar craft heritage. The facility displays and sells art items including lacquerware, wood carvings, handwoven textiles, marionettes, and traditional paintings. Local artisans frequently perform live crafting demonstrations, making it a versatile art center combining exhibition with authentic cultural experience.", "name": "Myanmar Handicraft \u0026 Culture Centre - Kaba Aye", "transport": "Take a bus to Kaba Aye Station and walk for about 2 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Inya Lake is the largest lake in Yangon, with its east bank running right along Kaba Aye Pagoda Road. It is one of the most popular green recreational spots for both locals in the Yankin commercial area and visitors. The lakefront is lined with tall trees and lush green lawns, offering stunning views of the surrounding lake scenery. In the early morning and at dusk, many locals come here to jog, stroll, or admire the breathtaking sunset. Cool breezes blow off the water, making it a peaceful escape from the hustle and bustle of the city and a wonderful place to unwind.", "name": "Inya Lake Park - East Bank", "transport": "Take a bus to Inya Lake Bus Stop, or walk about 5 minutes from Myanmar Plaza."}, {"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Kaba Aye Pagoda means \u0027World Peace Pagoda.\u0027 Beyond its golden stupa of profound religious and historical significance, the expansive surrounding green grounds and manicured landscapes are key natural highlights of the area. The grounds are shaded by lush trees, featuring tranquil ponds and elegant decorative bridges in an exceptionally serene setting. While visiting the World Peace Pagoda and the Maha Pasana Guha (Great Cave), visitors can rest on stone benches beneath the shady canopy, soaking in the unique harmony of sacred heritage and natural beauty.", "name": "Kaba Aye Pagoda Compound \u0026 Grounds", "transport": "Take a city bus and get off at Kaba Aye Pagoda Station."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.1 stars | Located in the heart of Yankin Township, Yankin Children\u0027s Park is a vibrant, green neighborhood park. The park features a variety of children\u0027s playground facilities, comfortable grassy lawns, and dense surrounding trees and flower beds. Every afternoon, families gather here with their kids, while locals use the space for morning exercises and friendly chats, perfectly reflecting the warm, relaxed pace of daily life in a traditional Yangon community.", "name": "Yankin Children\u0027s Park", "transport": "Take a city bus to Yankin Center Station, then walk about 3 minutes."}, {"address": "Kanbae Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | Situated near the intersection of Kanbae Road and Kaba Aye Pagoda Road, Kanbae Lake \u0026 Garden is a tranquil waterfront green space tucked away next to a bustling commercial area. Built along a scenic small lake, the water sparkles under the sun, bordered by a rich array of tropical plants and flowers. The garden offers winding lakeside walking trails and several viewing pavilions, making it a highly rated natural haven for local office workers and residents seeking an afternoon stroll to de-stress.", "name": "Kanbae Lake \u0026 Garden", "transport": "Walk about 8 minutes from Kanbae Train Station or take a taxi."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | The Yankin Campus of Yangon University of Education boasts lush greenery, with century-old trees, sprawling lawns, and classic British-style architecture across its expansive campus. The open green walkways exude a rich academic and natural atmosphere, making it a delightful spot for travelers who enjoy quiet strolls. The dense canopy blocks out the fierce tropical sun, offering a wonderfully cool and tranquil retreat as you wander through.", "name": "Yangon University of Education Yankin Campus Green Space", "transport": "Take a bus and get off at Yankin College Station."}, {"address": "No. 1, Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | Situated at the junction of Kaba Aye Pagoda Road and the shores of Inya Lake, this destination features exceptional, top-tier tropical landscape gardens. The gardens seamlessly blend rainforest vegetation, landscaped swimming pools, artificial waterfalls, and elegant Southeast Asian-style scenic pathways. Strolling through the grounds, guests can appreciate both the refined landscape design of a luxury resort and sweeping distant views of Inya Lake, making it a popular landmark combining luxury and natural beauty in the district.", "name": "Sedona Hotel Tropical Gardens", "transport": "Located directly opposite Myanmar Plaza; take a bus to Myanmar Plaza Station and cross the street."}, {"address": "Inya Lake Road / Kaba Aye Pagoda Rd junction, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Located along the southeastern shore of Inya Lake, this area offers expansive open-water views and neat waterfront green belts. It is a popular gathering spot for water sports enthusiasts, featuring spacious viewing platforms and lush grassy lawns. Visitors can sit on the grass by the water, watching sailboats gracefully glide across the lake while enjoying gentle breezes and lapping waves\u2014an authentic Yangon lakeside natural experience.", "name": "Inya Waterside Park", "transport": "Take a taxi to Inya Day Club or the entrance of the nearby lakeside boardwalk."}, {"address": "Near Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.0 stars | Located along Kaba Aye Pagoda Road, this eco-garden is themed around promoting native tropical plants and environmental conservation. The garden preserves much of its wild, natural landscape, featuring wooden boardwalks winding through woods and small streams. Rich in wildlife, it is frequently visited by various birds and butterflies, serving as an educational natural oxygen bar and ideal outdoor hiking spot near the Yankin and Kaba Aye commercial areas.", "name": "Kaba Aye Nature Eco Garden", "transport": "Take a bus to Kaba Aye Station, then walk about 6 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Kabar Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Kabar Aye Pagoda, meaning \u0027World Peace Pagoda,\u0027 was built in 1952 and is one of Yangon\u0027s iconic historical landmarks. Standing about 34 meters high, it is surrounded by lush green gardens and exquisite Buddha statues. The resplendent golden pagoda shines brilliantly under the blue sky, offering spectacular views whether up close or in panoramic photos. It is a must-visit photo spot when traveling to the Yankin and Kabar Aye commercial area.", "name": "Kabar Aye Pagoda", "transport": "Take a taxi straight along Kabar Aye Pagoda Road; or take bus No. 36 or 38 and get off at Kabar Aye Pagoda stop."}, {"address": "Kabar Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Adjacent to Kabar Aye Pagoda, Maha Pasana Guha is a massive artificial cave built specifically for the Sixth Buddhist Council. Modeled after the Saptaparni Cave in Rajgir, India, its exterior resembles a giant rock formation, while its interior features a vast pillarless hall capable of accommodating thousands of chanting monks. Its solemn, magnificent ambiance and unique architecture draw many photography enthusiasts to capture its beauty.", "name": "Maha Pasana Guha (Great Cave)", "transport": "Located within the Kabar Aye Pagoda complex, about a 5-minute walk from the main pagoda hall."}, {"address": "192 Kabar Aye Pagoda Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Located at the intersection of Kabar Aye Pagoda Road and Sedona Hotel, Myanmar Plaza is Yangon\u0027s premier modern shopping mall. The outdoor fountain plaza and geometric architecture, combined with an open-air rooftop garden terrace, offer panoramic views of Inya Lake in the distance. Dazzlingly illuminated at night with a vibrant urban atmosphere, it is a trendy hotspot favored by Yangon\u0027s youth and influencers.", "name": "Myanmar Plaza Outdoor Plaza", "transport": "Take a taxi to near the junction of Kabar Aye Pagoda Rd and Parami Rd; or take bus No. 11 or 36 to Myanmar Plaza stop."}, {"address": "192 Kabar Aye Pagoda Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Situated on a high floor of Meli\u00e1 Yangon connected to Myanmar Plaza, Elyx Bar boasts superb panoramic views. It offers exquisite cocktails alongside a chic, upscale dining atmosphere, with its biggest draw being unobstructed sunset views over Inya Lake. The glow of the setting sun over the lake and city skyline creates a breathtaking backdrop, perfect for stylish photo shoots.", "name": "Elyx Bar at Melia Yangon", "transport": "Located inside Meli\u00e1 Yangon hotel; walk through the connected walkway from Myanmar Plaza and take the elevator to the upper floors."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located on the east side of Kabar Aye Pagoda Road, this section of Inya Lake features tree-lined lakeside park trails and expansive water views. Tucked away from traffic noise, the glistening lake surface creates enchanting light reflections at dawn and dusk. Couples and photography lovers frequently visit to capture romantic lakeside reflections, making it a soothing natural photo spot.", "name": "Inya Lake Park (East Kabar Aye Side)", "transport": "Take a taxi to the lakeside park entrance along Kabar Aye Pagoda Road; or walk about 8 minutes from Myanmar Plaza."}, {"address": "1 Kabar Aye Pagoda Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Sedona Hotel Yangon is a classic luxury landmark on Kabar Aye Pagoda Road. Its famous outdoor swimming pool and meticulously landscaped tropical gardens radiate a rich Southeast Asian resort vibe. The high-ceiling lobby combines traditional Myanmar woodcarvings with modern luxury. Whether in the courtyard garden or the elegant lobby corridors, every snapshot captures an exotic resort feel.", "name": "Sedona Hotel Yangon Garden", "transport": "Located at the intersection of Kabar Aye Pagoda Road and Parami Road, directly opposite Myanmar Plaza. Easily accessible by taxi."}, {"address": "Kabar Aye Pagoda Road, Mayangone Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Situated within the Kabar Aye Pagoda complex, this Buddhist museum displays ancient Buddha statues, relics of revered monks, and traditional Buddhist ritual artifacts from across Myanmar and Southeast Asia. Combining traditional Myanmar palace architecture with modern geometric forms, the museum offers a rich cultural experience, making it a unique photography spot for history and artifact lovers.", "name": "Kabar Aye Buddhist Museum", "transport": "Located on the east side of the Kabar Aye Pagoda complex; follow signs and walk 3 minutes from the main pagoda walkway."}, {"address": "Corner of Kabar Aye Pagoda Road and Sayar San Road, Yankin Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Yankin Center is a landmark local commercial complex in the Yankin Township, surrounded by specialty cafes, restaurants, and modern artistic wall murals. It reflects the lively daily life of local Yangon residents, making it an ideal location for travelers looking to photograph Yangon\u0027s hip, modern lifestyle and urban pulse.", "name": "Yankin Center Plaza", "transport": "Take a taxi to the corner of Kabar Aye Pagoda Rd and Sayar San Rd to reach Yankin Center."}], "name": "Popular Photo Spots"}}, "name": "Yankin and Kaba Aye Commercial District"}};
        const cityName = "Yangon";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
