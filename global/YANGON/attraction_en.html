        const dbData = {"bahan_shwedagon": {"categories": {"cat_1": {"items": [{"address": "Arzanegone, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.8 stars | As the most sacred Buddhist site in Myanmar, the Shwedagon Pagoda is also the most brilliant landmark on the Yangon skyline. Built over 2,500 years ago, this 99-meter-tall pagoda enshrines eight hair relics of Gautama Buddha. Covered in pure gold leaf, the stupa\u0027s crown is embellished with thousands of diamonds and precious gemstones, including a magnificent 76-carat diamond at its peak. Illuminated at night, the pagoda emits a breathtaking glow. The surrounding complex houses dozens of smaller stupas and prayer halls, showcasing exquisite traditional Burmese craftsmanship and a profound atmosphere of religious devotion.", "name": "Shwedagon Pagoda", "transport": "Take a taxi directly to any of the four entrances (East, South, West, or North Gates), or take a city bus to the Shwedagon Pagoda stop and walk."}, {"address": "Shwegondine Road, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Chaukhtatgyi Buddha Temple houses one of the largest reclining Buddha statues in Myanmar, measuring 65 meters long and 16 meters high. The Buddha\u0027s serene expression features lifelike, custom-made glass eyes. A highlight is the intricate carving on the soles of its feet, depicting 108 auspicious symbols that represent the cosmic order and realms of reincarnation. The open-air, steel-framed shelter provides good ventilation, making it an unmissable landmark in Bahan Township to appreciate Burmese Buddhist sculpture and deep devotion.", "name": "Chaukhtatgyi Buddha Temple", "transport": "Take a 5 to 10-minute taxi ride from Shwedagon Pagoda, or take a bus along Shwegondine Road and alight at the Chauk Htat Gyi stop."}, {"address": "Ashay Shwe Gon Taing Road, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Located across from Chaukhtatgyi Buddha Temple, Nga Htat Gyi Pagoda was built in 1900 and enshrines a massive 14-meter-tall (five-story high) seated Buddha made of white marble. Behind the image stands an exquisitely carved wooden backdrop showcasing detailed Konbaung-style craftsmanship. Supported by majestic teak pillars and topped with a traditional multi-tiered Burmese roof, this grand temple offers a peaceful, rustic sanctuary in contrast to the bustling Shwedagon.", "name": "Nga Htat Gyi Pagoda", "transport": "Located in the alley directly opposite Chaukhtatgyi Buddha Temple, about a 3-minute walk away, or take a taxi from downtown."}, {"address": "15 Bogyoke Museum Lane, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Built in the 1920s, this two-story colonial-style mansion was the final residence of Myanmar\u0027s founding father, General Aung San, and his family (including Aung San Suu Kyi) before his assassination in 1947. The museum preserves General Aung San\u0027s original furniture, books, family photos, personal car, and even the small vegetable patch he personally tended. Stepping into this elegant yet humble historical building offers a poignant glimpse into the heroic struggle for independence and his personal life.", "name": "Bogyoke Aung San Museum", "transport": "Take a taxi to the end of Bogyoke Museum Lane, about a 5-minute drive northeast of Shwedagon Pagoda."}, {"address": "Shwedagon Pagoda Road, Dagon/Bahan Boundary, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Situated opposite the South Gate of Shwedagon Pagoda, Maha Wizaya Pagoda was built in 1980 to commemorate the unification of Theravada Buddhism sects in Myanmar. Combining traditional and modern architectural features, it is renowned for its open dome interior, where the ceiling is beautifully painted with the twelve zodiac signs and celestial maps. At its center lies a Buddha relic gifted by the King of Nepal. Murals and reliefs depicting sacred Buddhist sites line the inner walls, creating a serene and solemn atmosphere that stands in elegant contrast to the neighbouring Shwedagon.", "name": "Maha Wizaya Pagoda", "transport": "Located across the pedestrian overpass from Shwedagon Pagoda\u0027s South Gate, about a 2-minute walk away."}, {"address": "No. 31, Pan Tra Street, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | U Thant House was the residence of former UN Secretary-General U Thant during his time as a senior Myanmar government official in the 1950s. Tucked away amid lush greenery in Bahan Township, this beautifully restored two-story colonial-era villa now serves as a museum and cultural center. The exhibits showcase photos, documents, and personal belongings recounting his immense contributions to world peace and international diplomacy. Surrounded by tranquil, elegant gardens, it is a vital cultural landmark for exploring Myanmar\u0027s modern diplomatic history.", "name": "U Thant House", "transport": "Take a taxi to Pan Tra Street in Bahan Township, located near the Institut Fran\u00e7ais."}, {"address": "Kandawgyi Compound, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located on the eastern shore of Kandawgyi Lake, Karaweik Palace was built in 1972 as a magnificent golden replica of an ancient Burmese royal barge, shaped like the mythical Karaweik bird. Adorned with lavish traditional lacquerware and gilded woodcarvings, the structure floats gracefully on the lake, gazing toward Shwedagon Pagoda in the distance. Beyond being one of Yangon\u0027s most iconic landmarks, it is also the premier spot for capturing stunning sunsets and reflections of the grand pagoda.", "name": "Karaweik Palace", "transport": "Take a taxi to the eastern entrance of Kandawgyi Nature Park to reach Karaweik Palace."}, {"address": "Arzanegone, Near West Gate of Shwedagon Pagoda, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Perched on a hill near the North Gate of Shwedagon Pagoda, the Martyrs\u0027 Mausoleum is a national memorial honoring General Aung San and eight other leaders and cabinet ministers assassinated in 1947 during the fight for independence. Featuring a striking, minimalist modern architectural style, its bright red main structure symbolizes the blood shed for the nation. Offering panoramic views over Yangon, the site hosts grand official ceremonies every year on Martyrs\u0027 Day (July 19).", "name": "Martyrs\u0027 Mausoleum", "transport": "Walk about 5 to 10 minutes from the North or West Gate of Shwedagon Pagoda, or take a taxi directly to the mausoleum entrance."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Shwedagon Pagoda Northern Corner, Bahan Township, Yangon", "feature": "\u2b50 4.7 stars | Located in the northwestern corner of the Shwedagon Pagoda\u0027s main platform, the Shwedagon Pagoda Museum is a premier art sanctuary dedicated to displaying Myanmar\u0027s Buddhist culture and historical treasures of the pagoda. The museum houses countless priceless treasures donated by past kings, nobles, and devout believers, including dazzling gold and silver Buddha statues, religious paraphernalia encrusted with precious gems, exquisite ancient wood carvings, and golden ornaments weighing hundreds of kilograms. Spread across multiple floors, the museum offers an in-depth look into the pagoda\u0027s construction history and architectural craftsmanship from ancient times to the present. A major highlight is the display of replicas and detailed high-resolution photos of the pagoda\u0027s umbrella crown (Hti), allowing visitors to admire up close the massive diamonds and rubies normally invisible to the naked eye. For travelers wishing to fully grasp the core of Myanmar\u0027s faith and top-tier craftsmanship, this is an unmissable cultural holy site.", "name": "Shwedagon Pagoda Museum", "transport": "Take a taxi to the North or East Gate entrance of Shwedagon Pagoda, enter the main platform via the elevator or corridor, and walk to the museum."}, {"address": "No. 15, Bogyoke Museum Lane, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | The Bogyoke Aung San Museum is a two-story colonial residential building rich in historical depth and commemorative significance, nestled among the quiet, lush green hills of Bahan Township. This was the final residence of General Aung San, the founding father of Myanmar, and his family (including Aung San Suu Kyi) before his assassination in 1947. The museum preserves the original living setup of General Aung San, showcasing his private study, meeting room, bedroom, original British-style furniture, books, manuscripts, and historical photographs. Even the old car in the garden that he personally repaired and the family pond have been restored to their original state. Stepping inside feels like stepping back into the pivotal mid-20th-century era of Myanmar\u0027s struggle for independence, allowing visitors to deeply feel the great leader\u0027s simple lifestyle and resolute political convictions.", "name": "Bogyoke Aung San Museum", "transport": "Take a taxi to Bogyoke Museum Lane in Bahan Township, located near the north side of Kandawgyi Lake."}, {"address": "People\u0027s Park Compound, Near West Gate of Shwedagon Pagoda, Dagon/Bahan Border, Yangon", "feature": "\u2b50 4.5 stars | Tucked deep inside People\u0027s Park near the western gate of Shwedagon Pagoda, The Yangon Gallery is an iconic modern and contemporary art and cultural exhibition center in Yangon. The gallery features a spacious, bright interior with exceptional natural lighting, surrounded by vast green lawns and ancient trees, creating a deeply poetic ambiance. It regularly hosts painting, photography, sculpture, and contemporary installation exhibitions showcasing prominent local artists as well as emerging talents. Themes range from traditional Myanmar customs to contemporary social currents and abstract art experiences. A refined cafe area inside allows visitors to savor high-quality coffee surrounded by a rich artistic vibe. It is a premier venue to feel the pulse of contemporary Myanmar art and experience modern Southeast Asian aesthetics.", "name": "The Yangon Gallery", "transport": "Take a taxi to the People\u0027s Park overpass entrance, enter the park, and walk for about 3 minutes."}, {"address": "No. 64, Inya Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Situated in a quiet neighborhood along Inya Road in Bahan Township, St. Augustine\u0027s Catholic Church is a Gothic Revival Catholic church combining historical depth with architectural beauty. Built during the colonial era, the church features a classic off-white exterior with soaring arched portals. Inside, solemn wooden pews and intricate stained-glass windows create an incomparably sacred atmosphere as sunlight filters through. In addition to regular Sunday Masses, it serves as an important spiritual sanctuary for local Catholics and expats in Bahan. Surrounded by lush foliage away from the urban bustle, it showcases Yangon\u0027s unique landscape of harmonious interfaith coexistence.", "name": "St. Augustine\u0027s Catholic Church", "transport": "Drive north from Shwedagon Pagoda along Pyay Road or Inya Road for about 8 minutes."}, {"address": "No. 91, Bogyoke Aung San Museum Street, Bahan Township, Yangon", "feature": "\u2b50 4.7 stars | Tucked away in an elegant residential alley in Bahan Township, Kalasa Art Space is an independent exhibition space and studio founded by a renowned modern artist from Myanmar. It specializes in local modern paintings, traditional wood carvings, and mixed-media creations blending Eastern Zen philosophy with contemporary visual language. The space exudes a warm, personal studio atmosphere, where visitors often get the chance to interact directly with resident artists and hear firsthand about the cultural meanings and social transformations behind their work. For art lovers seeking independent art, deep cultural dialogue, and unique visual collectibles, Kalasa Art Space is undeniably a delightful hidden gem.", "name": "Kalasa Art Space", "transport": "Located on Bogyoke Aung San Museum Street in Bahan Township, about a 3-minute walk from the entrance of the Bogyoke Aung San Museum."}, {"address": "No. 20B, Nawaday Street, Dagon Township (Near Shwedagon South Gate), Yangon", "feature": "\u2b50 4.6 stars | Located near the South Gate of Shwedagon Pagoda, Nawaday Tharlar Art Gallery is a vibrant and inclusive contemporary art hub in Yangon. With a core mission to promote human rights, freedom of speech, social concern, and multiculturalism, the gallery exhibits bold, non-traditional contemporary visual art, political cartoons, photography, and poetry installations. The passionate gallery owner is dedicated to making this space an interactive platform where artists, scholars, and travelers can collide with free thoughts. The artworks inside overflow with intense colors and deep emotions, offering every visitor a new perspective on the inner world and artistic resilience of the Myanmar people.", "name": "Nawaday Tharlar Art Gallery", "transport": "Walk for about 8 minutes from the South Gate exit of Shwedagon Pagoda, or take a taxi to Nawaday Street."}, {"address": "Chaukhtatgyi Pagoda Road / Golden Valley Area, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | River Gallery is one of Yangon\u0027s premier internationally renowned contemporary art galleries. Although originally based downtown, it maintains important exhibition spaces and collaborative venues in Bahan\u0027s Golden Valley and surrounding areas. The gallery focuses on discovering and promoting Myanmar\u0027s finest contemporary artists, whose works have frequently appeared at international auction houses and prestigious art fairs worldwide. The artworks on display span a wide range of styles, from Impressionist oil paintings depicting the light and shadow on monks to poignant, critical contemporary mixed-media pieces. With a minimalist, elegant space and clear labels, it is the top choice for foreign collectors and art enthusiasts to experience the peak level of modern Myanmar art.", "name": "River Gallery", "transport": "Take a taxi to the Golden Valley area or around Chaukhtatgyi Pagoda in Bahan Township."}, {"address": "No. 340, Pyay Road, Bahan District, Yangon", "feature": "\u2b50 4.6 stars | Located on Pyay Road at the border of Bahan and Sanchaung Townships, Institut Fran\u00e7ais de Birmanie is a comprehensive cultural salon blending French romance with local Myanmar culture. The compound features an elegant colonial-style villa set amidst expansive green gardens, complete with a large art gallery, an open-air theater, a French library, and an outdoor cafe. Throughout the year, it hosts contemporary art exhibitions, Franco-Myanmar joint photography shows, open-air movie screenings, live music concerts, and theatrical performances. Its exotic and culturally rich atmosphere makes it a favorite gathering place for local hipsters, artists, and the expatriate community seeking cultural enrichment.", "name": "Institut Fran\u00e7ais de Birmanie", "transport": "Located on Pyay Road, a main thoroughfare northwest of Shwedagon Pagoda; take a taxi directly to \u0027Institut Fran\u00e7ais\u0027."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kandawgyi Lake, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Kandawgyi Park is one of the most famous natural landmarks in central Yangon, located just southeast of Shwedagon Pagoda. This artificial lake was built during the British colonial era, featuring clear waters that reflect both Shwedagon Pagoda and the iconic Karaweik Palace barge. A multi-kilometer wooden boardwalk winds along the lakeside, making it a favorite spot for locals and tourists to jog, stroll, and enjoy sunsets. The park is lush with green trees and tropical foliage, offering a romantic and exotic atmosphere at night as you gaze upon the illuminated, golden Shwedagon Pagoda.", "name": "Kandawgyi Park", "transport": "About a 5-minute taxi ride from the East Gate of Shwedagon Pagoda, or a 15-minute walk from the Pagoda."}, {"address": "Pyay Road, Dagon/Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Located on the west side of Shwedagon Pagoda, People\u0027s Park spans over 130 acres and is the largest comprehensive green space in downtown Yangon. It features expansive lawns, manicured flowerbeds, fountains, and classic tree-lined avenues. Its highlight is the close-up, multi-angle views of the towering Shwedagon Pagoda, making it a popular hotspot for photographers looking to capture stunning panoramas. The park also features a children\u0027s play area and botanical display zones, making it ideal for family picnics and relaxation.", "name": "People\u0027s Park and Square", "transport": "Located opposite the West Gate of Shwedagon Pagoda; easily accessible on foot."}, {"address": "Nat Mauk Street, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | Situated on the northern shore of Kandawgyi Lake in Bahan Township, Bogyoke Aung San Park is a memorial park dedicated to General Aung San, the founding father of Myanmar. The park boasts an elegant, tranquil environment with towering trees and a bronze statue of General Aung San standing at its center. Set on undulating terrain overlooking the lake, it offers great lake views and cool breezes. Quieter than the bustling main Kandawgyi Park, it\u0027s an ideal retreat to escape urban noise, read peacefully, or soak in the local vibe.", "name": "Bogyoke Aung San Park", "transport": "Take a bus or taxi to Nat Mauk Road near the Bogyoke Aung San Museum."}, {"address": "Kaba Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Inya Lake is Yangon\u0027s largest lake, with its southern tip extending into Bahan Township. Inya Lake Park is renowned for its vast water views, breezy waterfront trails, and romantic sunsets. A favorite hangout for Yangon University students and couples, the lakeside is lined with grand royal poinciana and camphor trees that put on a vibrant red floral display during bloom season. A walk along the shore offers serene water views and a peaceful escape from the bustling city.", "name": "Inya Lake Park - Bahan Side", "transport": "Drive north along Kaba Aye Pagoda Road for about 10 minutes to reach the southern shore of Inya Lake."}, {"address": "Kan Yeik Tha Road, Mingalar Taungnyunt / Near Bahan, Yangon", "feature": "\u2b50 4.1 stars | Established in 1906, Yangon Zoological Gardens is one of the oldest zoos in Southeast Asia, adjacent to Bahan Township and the southwest side of Kandawgyi Lake. It houses a rich variety of Myanmar\u0027s native wildlife\u2014such as Asian elephants, Bengal tigers, and rare bird species\u2014while also functioning as a vast botanical garden home to hundreds of century-old tropical trees and rare flowers. Shaded by ancient, lush canopy trees, it is a delightful green oasis rich in both natural eco-observation and historical heritage.", "name": "Yangon Zoological Gardens", "transport": "About a 5-minute taxi ride from Shwedagon Pagoda\u0027s South Gate, or walk along Kandawgyi Lake\u0027s southern road."}, {"address": "Kandawgyi Lake, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Located inside Kandawgyi Park, the wooden boardwalk surrounding the lake is a thoughtfully designed nature trail. Built over the water and wetland edges, it allows visitors to get up close to lake ecology and aquatic flora. Along the path, you can spot water birds, blooming lotuses, and magnificent reflections of the Karaweik Palace across the water. At dawn and dusk, the boardwalk is a premier photography spot for capturing the golden glow of Shwedagon Pagoda reflecting on shimmering waters, offering a relaxing and therapeutic experience.", "name": "Kandawgyi Lake Wooden Boardwalk", "transport": "Located inside Kandawgyi Park; enter via the main entrances of Kandawgyi Park."}, {"address": "Singuttara Hill, Dagon/Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Singuttara Hill is the sacred hill upon which Shwedagon Pagoda stands, surrounded by lush garden hillsides and natural woodlands. This green reserve seamlessly blends sacred Buddhist architecture with natural mountain forest landscapes. As you walk along the hill\u0027s pilgrimage paths, you\u0027ll be surrounded by century-old trees, tropical plants, and nesting birds. Not only part of a sacred religious site, it is also a serene green oasis to feel the spiritual energy and tranquil atmosphere around Shwedagon Pagoda.", "name": "Singuttara Hill Park Grounds", "transport": "Located in the hill area surrounding the Shwedagon Pagoda complex; easily explored on foot."}, {"address": "131 Pan Tra Street, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | The former residence of U Thant, the former UN Secretary-General, is tucked away in a quiet residential area of Bahan Township, surrounded by a well-preserved, tranquil tropical garden. Planted with elegant flowers and tall fruit trees, the serene garden showcases mid-20th-century Myanmar diplomatic estate landscaping. Featuring quiet seating areas, it allows visitors exploring the historical exhibits to also enjoy rich heritage and peaceful nature inside a hidden green oasis.", "name": "U Thant House Gardens", "transport": "Easily accessible by taxi to Pan Tra Street in Bahan Township."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Arzanegoin St, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.8 stars | Yangon\u0027s most iconic spiritual landmark and top check-in spot, standing at an impressive 99 meters tall. The entire stupa is plated in gold and encrusted with thousands of diamonds and gems. As the sun sets and the evening lights illuminate the pagoda, it radiates a brilliant golden glow, making it a dream spot for photographers capturing stunning reflections and sunsets. Bustling with tourists and local pilgrims, it showcases deep Myanmar Buddhist culture and architectural beauty.", "name": "Shwedagon Pagoda", "transport": "Take a taxi to the South or East entrance of Shwedagon Pagoda, or take a bus to Shwedagon Pagoda Station and walk directly there."}, {"address": "Kandawgyi Lake Compound, Mingalar Taung Nyunt Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | An iconic landmark on the eastern shore of Kandawgyi Lake, designed after the mythical bird golden barge, floating gracefully on the water. It offers a striking visual impact and is a prime photography spot for capturing views of Kandawgyi Lake and distant shots of Shwedagon Pagoda. At night, its glowing golden silhouette reflects beautifully on the water\u0027s surface, creating a breathtaking sight.", "name": "Karaweik Palace", "transport": "Take a 5- to 10-minute taxi ride from Shwedagon Pagoda to Kandawgyi Park."}, {"address": "Kandawgyi Lake, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | A sprawling green park surrounding the artificial Kandawgyi Lake, featuring lush trees and lakeside wooden boardwalks. It is a famous photo spot for capturing the golden spire of Shwedagon Pagoda reflected in the tranquil lake waters, attracting influencers and photographers alike. A twilight stroll along the shore offers poetic sunset hues and romantic scenery.", "name": "Kandawgyi Park", "transport": "Take a taxi to the Kandawgyi Park entrance, or walk about 15 minutes from the East Gate of Shwedagon Pagoda."}, {"address": "Shwedagon Pagoda Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | A modern pagoda located right near the South Gate of Shwedagon Pagoda. Built in the 20th century, it combines traditional and contemporary Burmese craftsmanship. The interior ceiling features a dreamlike, star-filled blue night sky mural and a beautiful glass shrine at its center. Unlike traditional golden pagodas, it exudes a unique artistic charm, making it a hidden gem for art lovers and Instagrammers visiting Bahan Township.", "name": "Maha Wizaya Pagoda", "transport": "Located directly opposite the South Gate of Shwedagon Pagoda; about a 3-minute walk via the pedestrian bridge."}, {"address": "Shwegondine Road, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Housing a massive 65-meter indoor reclining Buddha, this temple features one of the most exquisite Buddha statues in Myanmar. The soles of the feet are inscribed with 108 sacred symbols representing the realms of reincarnation, while the lifelike glass eyes radiate serene compassion. Its impressive size and intricate details make it a popular cultural photo landmark in Bahan with diverse photography angles.", "name": "Chaukhtatgyi Reclining Buddha Temple", "transport": "Take a taxi to Shwegondine Road near the center of Bahan Township; approximately an 8-minute drive from Shwedagon Pagoda."}, {"address": "Ashay Shwe Gon Taing Road, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | A historic temple located directly opposite the Chaukhtatgyi Reclining Buddha Temple, enshrining a magnificent five-story-tall white seated Buddha. Behind the statue stands a beautifully carved wooden screen of extraordinary craftsmanship. The serene atmosphere paired with the sheer scale of the seated Buddha and classical woodcarvings offers incredible visual contrast for photos.", "name": "Nga Htat Gyi Pagoda", "transport": "Located across from Chaukhtatgyi Reclining Buddha Temple; about a 3-minute walk across the street."}, {"address": "Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | A sprawling urban green park located west of Shwedagon Pagoda, featuring manicured gardens, musical fountains, and lush lawns. It is one of the premier viewpoints for photographing panoramic and low-angle shots of the majestic Shwedagon Pagoda. Many visitors and local youth gather here to picnic, take photos, and enjoy a relaxing afternoon.", "name": "People\u0027s Square and Park", "transport": "Take a taxi to the park\u0027s West Gate on Pyay Road, or walk directly from the West Gate bridge of Shwedagon Pagoda."}, {"address": "15 Bogyoke Museum Lane, Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | A two-story colonial villa that served as the former home of General Aung San, the founding father of modern Myanmar, and his daughter Aung San Suu Kyi. Well-preserved and surrounded by lush foliage, the building exudes historical tranquility and retro British charm. The beautiful architecture and landscaped gardens draw visitors seeking nostalgic and vintage-style photo backdrops.", "name": "Bogyoke Aung San Museum", "transport": "Take a taxi to Bogyoke Museum Lane in Bahan Township; about a 7-minute drive from Shwedagon Pagoda."}], "name": "Popular Check-in Hotspots"}}, "name": "Bahan and Shwedagon Pagoda District"}, "botahtaung_waterfront": {"categories": {"cat_1": {"items": [{"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Also known as the \u0027Eight Hundred Generals Pagoda\u0027, Botataung Pagoda sits on the banks of the Yangon River and is one of Yangon\u0027s most important Buddhist sacred sites. Built over 2,000 years ago, legend says 800 military leaders escorted sacred Buddha relics sent by King Ashoka of India to this site and established the pagoda. Unlike most solid Burmese pagodas, Botataung\u0027s unique feature is its hollow interior lined with gold leaf along the walkways, displaying ancient Buddhist artifacts, gold and silver ceremonial objects, and sacred Buddha relics. Destroyed by Allied bombing during WWII, the current magnificent structure was rebuilt according to its original design after Myanmar gained independence in 1948. Stepping inside feels like entering a sacred maze gleaming with golden light, drawing countless devotees and tourists to pray and pay homage.", "name": "Botataung Pagoda", "transport": "Take a bus to the Botataung Pagoda stop, or take a 10-minute taxi ride from downtown Yangon (around Sule Pagoda)."}, {"address": "92 Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Established in 1901 by the famous Sarkies Brothers\u2014who also founded Raffles Hotel in Singapore and the Eastern \u0026 Oriental Hotel in Penang\u2014The Strand Hotel is a Victorian colonial 5-star luxury hotel towering over the Yangon River. It has hosted literary giants like Rudyard Kipling, W. Somerset Maugham, and John Steinbeck, as well as international dignitaries. The exterior features grand white stone pillars and classical arches, while the interior retains rich teak floors, high ceilings, and vintage chandeliers. Even if you don\u0027t stay overnight, visiting for traditional English afternoon tea in its classic, elegant setting offers a vivid taste of Yangon\u0027s glory days as a British Empire trading hub a century ago.", "name": "The Strand Hotel", "transport": "Located on Strand Road, about a 12-minute walk from Sule Pagoda or a 5-minute taxi ride."}, {"address": "Corner of Strand Road and Pansodan Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Built in the 1920s at the prime intersection of the Yangon River and Strand Road, the Myanma Port Authority Building is an outstanding example of Yangon\u0027s colonial-era commercial architecture. This impressive three-story grand building showcases classical Neoclassical style, combining warm red brick with white stone trim. Its most striking feature is an iconic octagonal clock tower topped with a dome on the corner. During British rule, this building controlled the lifeline of all maritime trade and port shipping across Myanmar. Today, it still functions as the port authority headquarters. Its beautifully preserved exterior makes it a must-see historical landmark for walking tours and photography enthusiasts along the Yangon riverfront.", "name": "Myanma Port Authority Building", "transport": "Located near Pansodan Ferry Terminal, about a 10-minute walk south along Pansodan Road from Sule Pagoda."}, {"address": "Theinbyu Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | The Secretariat (also known as the Ministers\u0027 Building) is a grand Victorian red-brick building complex covering over 16 acres, completed in 1902. It served as the administrative headquarters of British Burma and holds a pivotal place in Myanmar\u0027s modern history. On July 19, 1947, General Aung San, the father of modern Myanmar, along with several cabinet ministers, was assassinated inside this building, making it the most solemn memorial site in the nation\u0027s fight for independence. The complex features grand Victorian-Gothic arches, a central dome, and exquisite wrought-iron staircases. Following extensive historic restoration in recent years, sections are now open for public tours and art exhibitions, including a memorial hall dedicated to General Aung San, making it an essential visit for understanding Myanmar\u0027s modern political history.", "name": "The Secretariat / Ministers\u0027 Building", "transport": "Take a taxi to the intersection of Theinbyu Road and Anawrahta Road, or walk about 15 minutes from Botataung Pagoda."}, {"address": "Bo Aung Kyaw Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Construction of St. Mary\u0027s Cathedral began in 1895 and took nearly 15 years until its completion in 1911. Designed by a Dutch architect, it is the largest Catholic cathedral in Myanmar. This majestic Gothic Revival building is built of red brick, with twin spires soaring into the sky creating a breathtaking contrast with its magnificent stained-glass windows inside. Though damaged during WWII, these exquisite stained glasses were meticulously restored to their former glory. The interior boasts soaring vaulted ceilings, intricately carved wooden altars, and solemn stone pillars, remaining steadfast even after surviving a major earthquake in 1970 and Cyclone Nargis in 2008. When sunlight filters through the stained glass onto the pews, the entire cathedral radiates a warm, sacred play of light and color, bringing visitors immense inner peace and wonder.", "name": "St. Mary\u0027s Cathedral", "transport": "Located on Bo Aung Kyaw Street near The Secretariat, about a 5-minute taxi ride from Botataung Jetty."}, {"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Completed in 1915, Custom House Yangon is one of the most refined and elegant landmarks along the Yangon riverfront colonial corridor. Designed by a British architect, it blends British Classical and Baroque styles, featuring deep red brickwork contrasting with white stone stripes for rich visual texture. Its most distinctive features include a delicate clock tower and symmetrical arched porticoes flanking the main entrance, with capitals and carved details showcasing remarkable craftsmanship of that era. During Yangon\u0027s golden age as a bustling international port in the early 20th century, all maritime cargo entering or leaving Myanmar required custom declarations and inspections here. Today, it still functions as custom administrative offices, and its well-preserved historical facade adds a touch of Neoclassical romance to Strand Road.", "name": "Custom House Yangon", "transport": "Located on Strand Road diagonally opposite The Strand Hotel, about a 10-minute walk from Sule Pagoda."}, {"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Situated on the Yangon River opposite Botataung Pagoda, Botataung Jetty is one of Yangon\u0027s oldest active ferry piers. Since British colonial times, it has been a key waterway hub connecting downtown Yangon with Dala Township across the river and coastal towns. The jetty area bustles year-round, with traditional wooden ferries, cargo ships, and fishing boats shuttling back and forth. From late afternoon to dusk, locals and visitors gather to stroll along the pier, enjoy cool river breezes, marvel at stunning sunsets over the Yangon River, and watch flocks of seagulls swooping over the water. The surrounding area hums with local life, featuring street stalls serving steaming Burmese snacks and fresh fruit\u2014making it a fantastic spot to experience Yangon\u0027s local ferry culture and waterfront scenery.", "name": "Botataung Jetty", "transport": "Adjacent to Botataung Pagoda, just a 2-minute walk away, or about a 10-minute taxi ride from downtown Yangon."}, {"address": "Corner of Bo Aung Kyaw Street and Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Built during the early 20th-century colonial period, the Central Press Building (Government Printing Press Building) is a distinctive structure combining classical style with industrial heritage value. Located near the intersection of Bo Aung Kyaw Street and Strand Road, it features classic red-brick masonry, arched windows, and simple stone accents, reflecting the rigorous, understated aesthetic of British official architecture at the time. For over a century, this printing plant produced government gazettes, official documents, law books, and historical archives, witnessing Myanmar\u0027s educational, cultural, and political evolution from colonial rule to independence and beyond. Though showing marks of time, its unique red-brick charm continues to attract architecture and history enthusiasts for photography and observation.", "name": "Central Press Building", "transport": "Located at the corner of Strand Road and Bo Aung Kyaw Street, about an 8-minute walk from Botataung Pagoda."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Botataung Pagoda is one of the most significant landmarks along the Yangon waterfront pier area. Its key highlight is the rare golden maze-like passageway inside the pagoda structure. Unlike other solid pagodas in Myanmar, visitors can walk inside to admire ancient Buddha statues, golden sacred vessels, and the Buddha teeth and relics said to be sealed in golden caskets. The interior walls are covered in gold leaf with glass display cases, creating an underground golden museum right by the waterfront. Bombarded during World War II, its 1948 reconstruction unearthed numerous precious ancient chamber artifacts now fully displayed here, making it a fantastic destination to explore Yangon\u0027s Buddhist art and history.", "name": "Botataung Pagoda \u0026 Relic Chamber", "transport": "Take the Yangon city bus to Botataung Pagoda stop, or take a taxi from Yangon Central Railway Station for about 10 minutes."}, {"address": "Corner of Bo Aung Kyaw Street and Bogyoke Aung San Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | Located in Botataung Township, St. Mary\u0027s Cathedral is the largest Catholic cathedral in Myanmar. Designed by Dutch architect Paul Steinmetz, construction began in 1895 and was completed in 1911, featuring a grand Neo-Gothic red-brick exterior and twin soaring bell towers. The interior is spacious and brightly lit, showcased by vibrant stained-glass windows, intricate timber vaults, and carved holy statues that perfectly blend colonial European craftsmanship with local Burmese artistry. Having survived multiple earthquakes and historical upheavals, it remains remarkably well-preserved\u2014not only serving as the spiritual heart for local Catholics but also a must-visit cultural attraction for lovers of colonial architecture and church art.", "name": "Saint Mary\u0027s Cathedral", "transport": "Take a taxi to Bo Aung Kyaw Street; it is approximately a 12-minute walk from Yangon Central Railway Station."}, {"address": "40 Bo Aung Kyaw Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Built in 1862 at the junction of Botataung Township and the commercial district, the Armenian Apostolic Church of St. John the Baptist is the oldest surviving church in Yangon. Historically, Armenian merchants arrived in Yangon as early as the 17th century for coastal trade and port affairs, making this church the spiritual symbol of a once-thriving Armenian community. The building features an elegant white Classical style with a delicate, lofty bell tower and a spacious courtyard. The simple yet solemn interior houses traditional Armenian cross-stones (Khachkars), an ancient altar, and valuable historical photos, taking visitors back in time to witness the glorious days of Yangon port\u0027s multicultural fusion.", "name": "Armenian Apostolic Church of St. John the Baptist", "transport": "Turn onto Bo Aung Kyaw Street from Strand Road along the Yangon waterfront, and walk for about 3 minutes."}, {"address": "Chien Myae Si Building, 38th Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Established in 2005, River Gallery is one of the most prominent and internationally renowned contemporary art galleries along the Yangon waterfront. The gallery is dedicated to promoting works by top local and emerging Burmese artists, spanning oil paintings, sculptures, watercolors, and modern installation art. Many displayed pieces blend traditional Burmese Buddhist culture and rural scenery with modern abstract trends, demonstrating high artistic value and deep social commentary. With its modern, elegant layout and tranquil atmosphere, it stands as a premier destination for international collectors and art enthusiasts seeking contemporary Burmese visual art.", "name": "River Gallery", "transport": "Take a taxi to the intersection of Strand Road and 38th Street; it is a 1-minute walk from there."}, {"address": "1st Floor, 62 Pansodan Street, Botataung Waterfront Area, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Founded in 1971, Lokanat Galleries is one of Yangon\u0027s oldest non-profit art exhibition spaces, located on the first floor of the century-old colonial Sofaer Building near the Botataung jetty area. Named after \u0027Lokanat\u0027, the guardian deity of peace in Burmese mythology, the gallery has long served as a free exchange platform for avant-garde Burmese artists and contemporary creators. It regularly hosts various art exhibitions, photography shows, and cultural lectures, featuring diverse styles from traditional Burmese genre paintings to cutting-edge abstract contemporary art. Soaring colonial ceilings and antique classic flooring add an unparalleled artistic retro charm.", "name": "Lokanat Galleries", "transport": "Located near the intersection of Pansodan Street and Strand Road, about an 8-minute walk from Botataung Jetty."}, {"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Situated inside a historic building along Strand Road, the Inland Water Transport Museum is dedicated to displaying the history of water transport along the Irrawaddy and Yangon Rivers. Formerly the operational headquarters of the famous Irrawaddy Flotilla Company during the British colonial era, the exhibits feature vintage ship models, nautical instruments, black-and-white historic photos, and rare documents from past port operations. Visitors can gain a deep understanding of how Yangon transformed from a small fishing village into a major hub port in Southeast Asia, making it a great cultural spot to explore Myanmar\u0027s maritime and river transportation history.", "name": "Inland Water Transport Museum", "transport": "Take the coastal bus to Botataung Jetty stop, then walk for about 3 minutes."}, {"address": "Merchant Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located on Merchant Street in Botataung Township, the Swami Vivekananda Cultural Centre (SVCC) is a cultural institution and exhibition space established by the Embassy of India in Myanmar. The center regularly hosts traditional Indian painting and sculpture exhibitions, yoga and dance workshops, as well as special exhibitions on historical artifacts, highlighting centuries of deep cultural and religious exchanges between India and Myanmar. Featuring a rich library and cultural salon, it also offers free public lectures and film screenings, making it a key venue to appreciate South Asian art and the historical connections between India and Myanmar.", "name": "Swami Vivekananda Cultural Centre", "transport": "Walk along Merchant Street from St. Mary\u0027s Cathedral for about 5 minutes."}, {"address": "92 Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | The Strand Art Collection is housed inside The Strand Hotel, Yangon\u0027s most famous luxury historic waterfront hotel. Built in 1901, this Victorian building is a living museum in itself. The gallery space features a curated collection of rare oil paintings depicting Yangon port from the late 19th to early 20th centuries, vintage maps, and modern creations by top Burmese artists. Stepping into the gallery, guests can savor the evolution of Burmese visual art amidst a sophisticated British colonial ambiance, and even enjoy an elegant English afternoon tea for a truly tasteful cultural journey.", "name": "The Strand Art Collection", "transport": "Take a taxi directly to The Strand Hotel on Strand Road."}], "name": "Arts Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Strand Rd, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located right next to Botataung Pagoda, the Botataung Jetty \u0026 Waterfront Promenade is one of the most iconic riverside green spaces in downtown Yangon. Situated beside the wide Yangon River, it features scenic platforms extending toward the water and long benches, making it a prime spot to admire magnificent river views and bustling boat traffic. In the evening, accompanied by a refreshing gentle breeze, locals and tourists gather here to watch the breathtaking sunset over the Yangon River, as the sky transforms into shades of brilliant gold and violet. Shaded trees and greenery line the path, offering a rare sense of natural tranquility amid the busy city.", "name": "Botataung Jetty \u0026 Waterfront Promenade", "transport": "Take a taxi and drop off at Botataung Jetty; or take a bus to any stop along Strand Road and walk for about 3 minutes."}, {"address": "Strand Road, near Botataung Pagoda, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Situated in the heart of the Botataung waterfront district, Yangon Riverfront Viewpoint Park boasts sweeping open views and beautifully manicured riverside lawns. Successfully transforming a former pier area into a vibrant natural recreation park, it features wooden boardwalks, scenic pavilions, and a variety of tropical flowers and plants. From the park\u2019s riverside observation deck, visitors can gaze across at Dala Township and watch ferries bustling back and forth across the water. Photography enthusiasts especially love visiting at early morning or dusk to capture water birds in flight and the mesmerizing light dancing on the river surface.", "name": "Yangon Riverfront Viewpoint Park", "transport": "About a 5-minute walk from Botataung Pagoda; or about a 10-minute taxi ride from downtown."}, {"address": "Pansodan Street \u0026 Strand Road Intersection, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Adjacent to the vital ferry terminal connecting downtown Yangon with Dala Township, Pansodan Jetty Riverfront Green is a prime location to experience the blend of riverside nature and local vibrancy. Featuring a line of tall mature trees and lush flowerbeds extending along the river, it offers comfortable shade from the tropical sun. Visitors can rest under the trees, feel the gentle river breeze, and enjoy the vast waterscapes of the Yangon River alongside the melodious whistles of passing ships. At twilight, this green space becomes one of the best spots to admire the waterfront sunset, showcasing a truly unique Yangon coastal charm.", "name": "Pansodan Jetty Riverfront Green", "transport": "Take a bus to Pansodan Bus Stop and walk for 2 minutes; or take a taxi directly to Pansodan Jetty."}, {"address": "Strand Rd, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Botataung Pagoda Riverfront Gardens seamlessly blend solemn Buddhist heritage with breathtaking riverside landscapes. Built around the famous Botataung Pagoda, the garden features lush foliage, vibrant flora, elegant ponds, and charming walkways. Its most unique aspect is the section extending directly to the banks of the Yangon River, allowing visitors to soak in both a peaceful spiritual ambiance and magnificent river panoramas. In the early morning, locals gather here to walk and exercise, listening to chirping birds and the gentle sound of waves\u2014a truly restorative physical and spiritual experience.", "name": "Botataung Pagoda Riverfront Gardens", "transport": "About an 8\u201310 minute taxi ride from Sule Pagoda in downtown Yangon."}, {"address": "Strand Road, Seikkan Township / Botataung Waterfront, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Nan Thida Jetty Waterfront Plaza is a scenic waterfront leisure space near the Botataung Jetty area, featuring expansive river views and lush landscaping. Paved along the banks of the Yangon River with wide pedestrian paths and comfortable seating, it is an ideal spot to admire the river and enjoy fresh outdoor air. Tucked away from noisy downtown traffic, strolling along the river allows you to feel cool breezes, take in the vast natural watershed views, and observe lively waterbirds\u2014perfect for families looking to relax and take a peaceful walk.", "name": "Nan Thida Jetty Waterfront Plaza", "transport": "Take a taxi and drop off at Nan Thida Jetty; or take a bus along Strand Road and get off at a nearby stop."}, {"address": "Strand Road, Botataung Area, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | The Strand Road Waterfront Walkway is a landscaped green path stretching along the Botataung pier area. Flanked by tropical trees, shrubs, and flowering plants, it effectively buffers the busy traffic of Strand Road, creating a lush riverside ecological corridor. Strolling along the path, you\u0027ll admire historic waterfront architecture on one side and the vast expanse of the Yangon River on the other. A favorite route for local morning joggers and evening walkers, it features resting benches where you can pause anytime to take in the natural river views and stunning sunsets.", "name": "Strand Road Waterfront Walkway", "transport": "Walk south along Pansodan St from downtown Yangon straight to Strand Road, or take a taxi to any spot along Strand Road to start your stroll."}, {"address": "Waterfront Area near Botataung, Strand Rd, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located along a wide stretch of the harbor district, Yangon Port Sunset Waterfront Park is one of the city\u0027s premier scenic spots for admiring waterfront sunsets. Thoughtfully designed with well-maintained sprawling lawns and open-air viewing platforms, standing by the river offers impressive views across the expansive waters. As the sun sets, radiant golden-red hues fill the sky and shimmer across the surface, creating a visually stunning scene. Equipped with ecological info boards and leisure facilities, it\u2019s a wonderful destination for both sightseeing and relaxation.", "name": "Yangon Port Sunset Waterfront Park", "transport": "It is recommended to take a taxi directly to the Botataung Jetty area, then walk to the harbor viewpoint park platform."}, {"address": "Seikkan Waterfront / Strand Road, Yangon, Myanmar", "feature": "\u2b50 4.0 stars | Located adjacent to the Botataung Jetty area, Seikkan Waterfront Park \u0026 Jetty is a relaxing park showcasing natural ecology and riverside scenery. Built along the shoreline, the park includes waterfront walkways, manicured green lawns, and shaded pavilions for resting. Rich in plant diversity that attracts a variety of birds, it is a delightful green corner to connect with nature right in the city. Sitting on benches near the river, visitors can watch the shifting currents of the Yangon River, feel the soothing breeze, and soak in an authentic slice of local life.", "name": "Seikkan Waterfront Park \u0026 Jetty", "transport": "Take a taxi to the Seikkan waterfront area, or take a Strand Road route bus, drop off near the jetty area, and walk over."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.5 Stars | Botataung Pagoda is one of the most significant waterfront landmark pagodas in Yangon. Equal in renown to the famous Shwedagon Pagoda, it offers a completely distinct experience. The interior features a maze-like golden corridor with walls encrusted with countless treasures and sacred Buddha relics. Visitors can walk right inside the heart of the pagoda to marvel at its dazzling, opulent splendor. The riverside plaza outside is also a popular photo spot for watching the Yangon River sunset and feeding seagulls.", "name": "Botataung Pagoda", "transport": "Take a taxi to the intersection of Botahtaung Road and Strand Road, or take a bus to Botataung Pagoda station and walk 2 minutes to arrive."}, {"address": "Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.4 Stars | Located right next to Botataung Pagoda, this ferry jetty is a favorite sunset spot for Yangon locals and tourists alike. As dusk falls, golden sunlight bathes the broad Yangon River while flocks of seagulls soar overhead, creating a poetically beautiful scene. It attracts many photography enthusiasts, and local vendors sell seagull feed so visitors can enjoy feeding the birds and capturing stunning photos.", "name": "Botataung Jetty", "transport": "Located on the riverbank directly behind Botataung Pagoda, about a 3-minute walk from the pagoda\u0027s rear exit."}, {"address": "No. 6, Botahtaung Jetty, Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Moored beside Botataung Jetty, this 1920s British-style vintage luxury yacht is one of the most distinctive and talked-about landmarks along the Yangon waterfront. Decorated in rich Victorian style with exquisite brass accents and classic wooden furniture, even non-staying guests can enjoy afternoon tea or cocktails at the British restaurant or rooftop bar, capturing stylish photos infused with old-world British charm.", "name": "Vintage Luxury Yacht Hotel", "transport": "Take a taxi to Botahtaung Jetty; the large vintage yacht is moored right along the pier."}, {"address": "92 Strand Road, Kyauktada Township, Yangon, Myanmar", "feature": "\u2b50 4.6 Stars | Built in 1901 by the famous Sarkies Brothers, this century-old luxury hotel is brimming with grand British colonial architecture. Soaring archways, marble floors, and vintage wooden decor exude an elegant, refined historical atmosphere. Having hosted countless celebrities throughout history, the hotel\u0027s \u0027The Strand Cafe\u0027 is a highly popular spot for classic British afternoon tea and memorable photo ops.", "name": "The Strand Hotel", "transport": "Walk or take a taxi along Strand Road; located near the Botataung area and waterfront pier district."}, {"address": "Strand Road, Seikkan Waterfront Area, Yangon, Myanmar", "feature": "\u2b50 4.1 Stars | Serving as the main ferry hub connecting downtown Yangon with Dala Township across the river, this spot radiates authentic local life and human charm. Bustling crowds, betel nut vendors, and local snack stalls compose a genuine picture of Yangon waterfront living. Many street photographers visit specifically to capture departing ferries, glowing sunsets, and moving scenes of daily commuters, offering a rich documentary-style feel.", "name": "Nan Thida Jetty", "transport": "Take a taxi heading west along Strand Road; located about a 5-minute drive from Botataung Pagoda."}, {"address": "Strand Road Waterfront Promenade, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | A famous night market along Strand Road that truly comes alive after dark. Illuminated by colorful lights at night, street stalls brim with Burmese skewers, seafood pancakes, tropical fruit ice treats, and diverse local snacks. Not only a paradise for foodies, the vibrant night market lights reflecting against the river nightscape draw many international visitors looking to snap great photos and experience the local nightlife.", "name": "Botataung Night Market", "transport": "Walk west along Strand Road from Botataung Pagoda for about 5 to 10 minutes to reach the night market area."}, {"address": "Waterfront Promenade along Strand Road, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Stretching along the Botataung riverfront, this scenic promenade offers the best viewpoint for taking in the broad expanses of the Yangon River and passing ferries. Lined with benches and lush greenery, evening breezes drift through as the sky paints itself in gradients of orange, red, and purple\u2014making it a perfect romantic date spot and ideal photo location to capture Yangon\u0027s waterfront charm.", "name": "Yangon Riverfront Promenade", "transport": "Take a taxi to Botataung Jetty and stroll along the riverbank path to enjoy the entire scenic promenade."}, {"address": "Seikkan Jetty Area, Strand Road, Botataung District, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | Located in the pier district along the Botataung waterfront, this nostalgic pier corner preserves vintage cranes and freight facilities, reflecting Yangon\u0027s history as a major port city. Especially popular among hipsters and street photographers, the rugged pier structures contrast vividly with the warm sunset glow, creating visually striking, industrial-retro photos.", "name": "Seikkan Pier Sunset Viewpoint", "transport": "About a 3-minute taxi ride from Botataung Pagoda, or an 8-minute walk west along Strand Road."}], "name": "Popular Photo Spots"}}, "name": "Port Tao and Coastal Docks District"}, "dagon_diplomatic": {"categories": {"cat_1": {"items": [{"address": "Arzanat St, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.8 stars | The Shwedagon Pagoda is Myanmar\u0027s most sacred Buddhist site, situated on Singuttara Hill in Dagon Township. Standing 99 meters tall, this golden stupa is covered in pure gold leaf, with its crown encrusted with thousands of diamonds and precious gems. Boasting over 2,500 years of history, it houses relics of four previous Buddhas. Illuminated at night, it glows resplendently, serving as the most iconic historical and architectural landmark in Dagon and all of Myanmar.", "name": "Shwedagon Pagoda", "transport": "About a 10-minute taxi ride from downtown Yangon, or take a bus along Pyay Road and get off at the Shwedagon Pagoda stop."}, {"address": "Shwedagon Pagoda Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Located adjacent to the south gate of Shwedagon Pagoda, Maha Wizaya Pagoda was built in 1980 under the auspices of former Myanmar leader Ne Win. Blending traditional Burmese architectural styles with modern engineering techniques, its most unique feature is the interior ceiling adorned with exquisite murals of zodiac signs and astrological charts. The hollow center houses sacred Buddha relics gifted by the King of Nepal, making it a Buddhist architectural monument of great modern historical significance in Dagon.", "name": "Maha Wizaya Pagoda", "transport": "A 3-minute walk from the South Gate of Shwedagon Pagoda, or accessible by taxi from downtown Yangon."}, {"address": "66/74 Pyay Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Located on Pyay Road in Dagon Township, the National Museum of Myanmar is a grand five-story building housing countless treasures of Burmese history and culture. Its centerpiece exhibit is the impressive 8-meter-tall Sihasana Lion Throne, an original relic of King Thibaw, the last monarch of Myanmar. The museum also displays artifacts from the Bagan Kingdom, royal attire, ancient scripts, and artworks, making it a must-visit for diving deep into Myanmar\u0027s millennium-long history and architectural artistry.", "name": "National Museum of Myanmar", "transport": "Take a bus and get off at the National Museum stop, or take a 15-minute taxi ride from downtown Yangon."}, {"address": "Zagawar St, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Established in 1882, the Pegu Club was one of the premier elite social clubs in Yangon during the British colonial era. Built entirely of exquisite teakwood, it exudes a strong Victorian ambiance combined with tropical colonial charm. Once a gathering spot for British officers and gentlemen, it is also the birthplace of the famous Pegu Club cocktail. Meticulously restored in recent years, it faithfully revives the unique historical elegance and architectural allure of Dagon.", "name": "Pegu Club", "transport": "Located within Dagon Township; taking a taxi to the intersection of Zagawar St and Pyay Rd is recommended."}, {"address": "Arzani St, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Perched on a hill near the North Gate of Shwedagon Pagoda, the Martyrs\u0027 Mausoleum is a national memorial dedicated to General Aung San, the father of Myanmar\u0027s independence, and his cabinet ministers who were assassinated in 1947. Featuring a solemn and dignified architectural style adorned in traditional Burmese red and gold, it offers panoramic views of Dagon and downtown Yangon, standing as a pivotal milestone in Myanmar\u0027s modern political history.", "name": "Martyrs\u0027 Mausoleum", "transport": "A 5- to 10-minute walk from the North Gate of Shwedagon Pagoda, or directly accessible by taxi."}, {"address": "Anawrahta Rd / Shwedagon Pagoda Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Formerly St. Paul\u0027s English High School established during the colonial era, this grand red-brick building constructed in the late 19th century showcases classic British colonial Gothic Revival architecture. Having nurtured countless Burmese luminaries and statesmen, its vintage campus and well-preserved clock tower remain one of the most recognizable architectural heritage sites in Dagon\u0027s historic district.", "name": "BEHS 1 Dagon (Basic Education High School No. 1 Dagon)", "transport": "Take a bus to the Shwedagon Pagoda Road stop, or walk/take a taxi from downtown."}, {"address": "Pyay Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | Situated west of Shwedagon Pagoda in Dagon Township, the Pyithu Hluttaw complex served as a major national political center from the military regime through several past administrations. The expansive, lushly landscaped complex seamlessly blends modern geometric design with traditional Burmese multi-tiered roofs (Pyatthat). While public indoor access to certain areas is restricted, its majestic exterior remains an iconic political and historical landmark of Dagon.", "name": "Pyithu Hluttaw Building (House of Representatives)", "transport": "Take a bus along Pyay Road and get off at the Parliament Building stop, or view it via a passing taxi ride."}, {"address": "U Wisara Rd, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | The West Stairway covered walkway at Shwedagon Pagoda is the most historically and artistically rich of the four pilgrimage entrances. Lined with massive carved teak pillars and intricate reliefs depicting traditional Burmese mythology, it features numerous centuries-old small shrines and merit halls along the path. Preserving authentic late 19th to early 20th-century Burmese Buddhist architectural craftsmanship, walking through it feels like stepping back in time.", "name": "Shwedagon West Stairway Historic Sanctuary", "transport": "Take a bus or taxi to the West Gate of Shwedagon Pagoda on U Wisara Road."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "66 Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | A key cultural landmark in the heart of Dagon Township, this five-story national museum houses countless precious historical artifacts and art treasures of Myanmar. Its most famous exhibit is the Sihasana Lion Throne, the exquisite original golden throne used by Kings Mindon and Thibaw, the last monarchs of Myanmar. In addition, the museum displays ancient royal paraphernalia, traditional musical instruments, Buddhist art, and traditional Burmese attire, making it an essential stop for a comprehensive understanding of Myanmar\u0027s millennia-old history, culture, and arts.", "name": "National Museum of Myanmar", "transport": "Take a taxi directly via Pyay Road, or catch a YBS bus and get off at the National Museum stop, followed by a short walk."}, {"address": "People\u0027s Park, Ahlone Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Nestled within People\u0027s Park in Dagon Township, this contemporary art space harmoniously blends modern aesthetics with lush natural surroundings. The gallery frequently hosts art exhibitions, photography shows, and sculpture displays featuring renowned Burmese artists as well as emerging local talents, dedicated to promoting Myanmar\u0027s contemporary visual arts. Surrounded by verdant greenery, the spacious and elegant gallery includes a cozy cafe area, allowing visitors to enjoy serene natural moments while appreciating fine artworks.", "name": "The Yangon Gallery", "transport": "Walk into People\u0027s Park from the West Gate of Shwedagon Pagoda, or take a taxi to the People\u0027s Park entrance on Ahlone Road."}, {"address": "Arzaney Street, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | Situated on the hills of Dagon Township north of Shwedagon Pagoda, this national memorial honors General Aung San, the father of Myanmar\u0027s independence, and seven cabinet members assassinated in 1947. Designed with sleek red-and-white lines, the mausoleum exudes a solemn and majestic atmosphere. Every year on July 19th (Martyrs\u0027 Day), a formal national memorial ceremony takes place here. An exhibition area inside provides detailed insights into the lives of General Aung San and fellow martyrs, as well as the history of Myanmar\u0027s independence movement.", "name": "Martyrs\u0027 Mausoleum", "transport": "About a 10-minute walk from the North Gate of Shwedagon Pagoda, or take a taxi directly to Arzaney Street."}, {"address": "Signal Pagoda Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Located on Signal Pagoda Road in Dagon Township, this historic Gothic Revival church was built during the colonial period. Featuring red-brick exterior walls, soaring spires, and exquisite stained-glass windows, it showcases a grand and elegant architectural style. The church continues to host regular bilingual services and musical concerts, serving as a spiritual center for the local Christian community in Dagon, as well as a favorite historical landmark for architecture and photography enthusiasts.", "name": "Methodist English Church", "transport": "Take a taxi to Signal Pagoda Road; it is located near the Yangon Central Railway Station area."}, {"address": "Bogyoke Aung San Road, Latha Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | Located just a stone\u0027s throw from Dagon Township in downtown Yangon, this Anglican cathedral is one of Myanmar\u0027s oldest and most significant churches. Built in 1894 and designed by a British architect, it features warm red-brick construction and Victorian Gothic architecture, with beautifully crafted wooden ceiling vaults and vibrant stained-glass windows depicting biblical scenes inside. The serene atmosphere inside offers a tranquil contrast to the surrounding bustling city streets.", "name": "Holy Trinity Cathedral", "transport": "A 5- to 10-minute taxi ride from Dagon Township, or take any YBS bus running along Bogyoke Aung San Road."}, {"address": "372 Bo Aung Kyaw Street, Botahtaung Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | About a 10-minute drive from Dagon Township, this is the largest Catholic cathedral in Myanmar. Built in 1899, the Neo-Gothic church is famous for its twin red-brick spires, soaring vaulted ceilings, and intricate geometric stained-glass windows, creating an awe-inspiring sense of space and sacred ambiance. The interior seamlessly fuses classical European design with local Burmese craftsmanship, standing as one of Yangon\u0027s most iconic religious architectural landmarks.", "name": "St. Mary\u0027s Cathedral", "transport": "A 10- to 15-minute taxi ride from Dagon Township."}, {"address": "62 Pansodan Street, Kyauktada Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | Housed in the historic Sofaer Building in downtown Yangon near Dagon Township, Lokanat Galleries is one of the city\u0027s oldest and most influential non-profit art exhibition spaces. Established in 1971, it has nurtured generations of local Burmese artists, regularly showcasing oil paintings, watercolors, traditional lacquerware art, and contemporary installations. Art lovers can immerse themselves in the evolution of Myanmar\u0027s visual arts over the past half-century within this grand colonial-era building.", "name": "Lokanat Galleries", "transport": "Take a taxi south along Pansodan Street from Dagon Township; takes about 10 minutes."}, {"address": "1st Floor, 286 Pansodan Street, Upper Block, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | Situated in the lively area of Pansodan Street near Dagon Township, Pansodan Gallery serves as a vibrant heart for contemporary art and cultural gatherings in Yangon. The gallery features a vast collection of works by modern Burmese painters, ranging from figurative realism to abstract expressionism. With its relaxed and friendly vibe, it regularly hosts Tuesday evening gatherings for artists and visitors, serving as a popular cultural exchange platform for international tourists, creators, and art collectors alike.", "name": "Pansodan Gallery", "transport": "An 8-minute taxi ride from Dagon Township to Upper Pansodan Street."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.4 Stars | Covering over 130 acres on the west side of Shwedagon Pagoda, People\u0027s Park is the largest and most popular municipal park in Dagon Township. Featuring sprawling lush lawns, exquisite floral displays, fountain ponds, and shaded walkways, it is a favorite spot for morning workouts and family weekend picnics. The park also hosts an outdoor exhibition area displaying vintage railway trains and fighter jets. Select vantage points offer magnificent, glittering views of Shwedagon Pagoda, making it ideal for photos and relaxation.", "name": "People\u0027s Park and Square", "transport": "Take a taxi to the intersection of Pyay Road and Dhammazedi Road, or take a city bus and get off at People\u0027s Park Station."}, {"address": "Shwedagon Pagoda Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 Stars | Adjacent to the famous Shwedagon Pagoda, Maha Wizaya Pagoda is surrounded by quiet, well-maintained green gardens and tree-lined pathways. The rich vegetation offers pilgrims and tourists a serene escape from the city\u0027s hustle and bustle. Here, visitors can admire a pagoda that blends traditional and modern Burmese architectural styles alongside intricate landscaping. Many locals love walking here in the evening to enjoy the gentle breeze and peaceful spiritual atmosphere.", "name": "Maha Wizaya Pagoda Grounds", "transport": "Walk for about 3 minutes via the pedestrian overpass from the South Gate of Shwedagon Pagoda."}, {"address": "Bo Gyoke Aung San Road, Mingala Taungnyunt / Near Dagon, Yangon, Myanmar", "feature": "\u2b50 4.1 Stars | Established in 1906, the Yangon Zoological Gardens is one of the oldest wildlife parks in Southeast Asia, located right on the eastern side of Dagon Township. The park boasts hundreds of rare tropical plants and trees, with lush canopies providing ample shade. Besides observing rare animals like Asian elephants and Bengal tigers, visitors can explore a complete micro-ecosystem formed by expansive lakes and natural flora\u2014making it perfect for nature lovers and families.", "name": "Yangon Zoological Gardens", "transport": "Take a taxi to the entrance on Kan Yeik Tha Road, or take a city bus and get off at the Zoo station."}, {"address": "Kan Yeik Tha Road, Dagon / Bahan Township, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Located right next to the east side of Dagon Township, Kandawgyi Nature Park is famous for its vast lakeside views and surrounding wooden boardwalks. The park\u0027s highlight is Karaweik Palace, a replica of a royal golden barge anchored on the lake. Strolling along the wooden paths offers panoramic, breathtaking reflections of Shwedagon Pagoda on the water, especially at sunset when the golden light illuminates the lake and spires into a stunning natural and cultural picture.", "name": "Kandawgyi Nature Park", "transport": "Take a taxi for about 5 to 10 minutes from central Dagon Township to reach the main entrance of Kandawgyi Park."}, {"address": "Natmauk Road, Near Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | Bogyoke Aung San Park is an urban park rich in history and natural charm, situated on the southwestern shore of Kandawgyi Lake near the border of Dagon Township. Centered around a bronze statue of General Aung San, the father of Myanmar\u0027s independence, it is surrounded by towering ancient tropical trees and verdant lawns. Offering a tranquil escape from the urban hustle, its lakeside paths provide excellent spaces for walking and picnicking.", "name": "Bogyoke Aung San Park", "transport": "Take a taxi and get off at the park entrance on Natmauk Road."}, {"address": "Singuttara Hill, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.7 Stars | The green belt surrounding the sacred Shwedagon Pagoda is one of the most significant natural and cultural landscapes in Dagon Township. This green zone encompasses gardens near the four main pilgrimage entrances, ancient Bodhi tree groves, and beautifully restored landscaped ponds. Pilgrims and visitors can experience profound spiritual tranquility here, surrounded by century-old tropical trees and floral displays that create a perfect green backdrop for the towering golden pagoda.", "name": "Shwedagon Pagoda Park Belt", "transport": "Take a taxi directly to the park entrances at the East or South Gate of Shwedagon Pagoda."}, {"address": "Maha Bandula Road, Kyauktada Township / Near Dagon, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Located in the core downtown area not far from Dagon Township, Maha Bandula Park is deeply connected to Dagon\u0027s cultural and geographical heritage. At its center stands the towering Independence Monument, surrounded by manicured flowerbeds, fountains, and lush palm trees. Bordered by historic colonial-era buildings, it is the best place to experience the blended charm of Yangon\u0027s natural greenery and historical architecture.", "name": "Maha Bandula Park", "transport": "Take a taxi for about 8 minutes from Dagon Township, or take one of several city buses to the City Hall stop."}, {"address": "Pyidaungsu Hluttaw Street, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.0 Stars | Located in the political core of Dagon Township, the Pyidaungsu Hluttaw Park Grounds is a sprawling green space combining political history with landscape design. The grounds preserve numerous precious tropical trees and wide tree-lined avenues, radiating a solemn and dignified atmosphere. Strolling through the pathways, visitors can admire well-maintained, multi-layered greenery while taking in modern Burmese architectural styles, making it a unique and serene green sanctuary in Dagon.", "name": "Pyidaungsu Hluttaw Park Grounds", "transport": "Take a taxi to Pyidaungsu Hluttaw Street to reach the open areas of the park."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 1, Shwedagon Pagoda Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.8 stars | Yangon\u0027s most iconic sacred landmark and a premier photo spot. Standing 99 meters tall, this golden pagoda is covered in pure gold leaf, with its top encrusted with thousands of diamonds and gemstones. Dusk is the best time to capture the glowing golden spire against the sunset, and it turns magnificently grand when illuminated at night. Don\u0027t miss cultural experiences like the devotional water-pouring ritual on Buddha statues and exploring the four directional prayer halls.", "name": "Shwedagon Pagoda", "transport": "Take a taxi directly to the South or West entrance of Shwedagon Pagoda, or take a bus to the Shwedagon Pagoda stop and walk."}, {"address": "666 Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.3 stars | The ultimate sanctuary for delving into Myanmar\u0027s rich history and vibrant culture. This five-story museum houses tens of thousands of precious artifacts. The main photo highlight is the majestic, 8-meter-tall Sihasana Lion Throne, the original throne of King Thibaw of the Konbaung dynasty. Royal gold and silverware, traditional musical instruments, ancient Buddha statues, and ethnic costumes offer fantastic backdrops for culturally rich photos.", "name": "National Museum of Myanmar", "transport": "Take a taxi along Pyay Road, or take Bus #30 and get off at the National Museum stop."}, {"address": "Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.5 stars | The best park for taking photo check-ins featuring panoramic views of Shwedagon Pagoda surrounded by lush greenery. Covering a vast area, it features scenic gardens, fountain plazas, tree-lined walkways, and children\u0027s play areas. The elevated skywalk and waterfront plaza in the park\u0027s center are prime photo spots, offering crowd-free angles of the pagoda soaring into the skyline against blue skies and lush trees.", "name": "People\u0027s Park and Square", "transport": "Located west of Shwedagon Pagoda; enter via the Pyay Road gate. Taking a taxi is the most convenient option."}, {"address": "Shwedagon Pagoda Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | A stunning contemporary pagoda south of Shwedagon, blending traditional craftsmanship with modern aesthetics. Unlike traditional solid pagodas, visitors can step inside this hollow structure. Its dome is painted with exquisite murals depicting constellations and the sky, centered around a glass shrine holding Buddha relics. The gorgeous play of light and graceful architectural lines draw countless photography enthusiasts looking for inner-space photo angles.", "name": "Maha Wizaya Pagoda", "transport": "Walk about 3 minutes across the pedestrian bridge from Shwedagon Pagoda\u0027s South Gate, or take a taxi to the Maha Wizaya stop."}, {"address": "Myoma Kyaung Street, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.2 stars | A cultural landmark showcasing Myanmar\u0027s performing arts and modern architectural aesthetics. Built with international aid, this building features unique Oriental geometric design and grand pillars, making it a popular spot for photography enthusiasts to capture clean architectural lines. The theater regularly hosts traditional Burmese dance, music performances, and international events, with its artistic exterior standing out brilliantly in the sunlight.", "name": "National Theatre of Yangon", "transport": "Take a taxi to Myoma Kyaung Street, located near downtown Yangon and the Shwedagon Pagoda area."}, {"address": "No. 31, Pan Tra Street, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.6 stars | The former residence of former UN Secretary-General U Thant. This white colonial-style villa is surrounded by lush tropical gardens. It preserves precious photos, documents, and furniture from U Thant\u0027s life, illustrating his elegant philosophy and dedication to world peace. The vintage arches, vibrant garden, and sunlit corridors make it a top hidden gem for stylish, retro portrait photography.", "name": "U Thant House", "transport": "Take a taxi to Pan Tra Street; it\u0027s about a 10-minute walk from the National Museum."}, {"address": "Inside People\u0027s Park, Pyay Road entrance, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.4 stars | The most popular Instagrammable area in People\u0027s Park among young travelers. It features cascading fountain pools, an elevated wooden skywalk, and geometric viewing platforms. Standing on the skywalk gives you a fantastic perspective for stunning portrait shots, framing the golden Shwedagon Pagoda in the background alongside lush greenery. The lighting at sunset creates a truly dreamy vibe.", "name": "Fountain Garden \u0026 Skywalk at People\u0027s Park", "transport": "Enter via the main Pyay Road entrance of People\u0027s Park, then follow the park signs for about a 5-minute walk."}, {"address": "People\u0027s Park Complex, Pyay Road, Dagon Township, Yangon, Myanmar", "feature": "\u2b50 4.1 stars | A sci-fi dome structure inside People\u0027s Park and one of Yangon\u0027s iconic examples of retro-modernist architecture. Its unique silvery-white dome stands out strikingly against the blue sky and trees, making it perfect for minimalist architectural and trendy lifestyle shots. Offering a starry sky theater and astronomy exhibits, it is a fun leisure spot combining educational value and visual appeal.", "name": "Yan
