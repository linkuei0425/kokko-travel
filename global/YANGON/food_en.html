 on the northeastern shore of Inya Lake, SEEDS is famous for its elegant bamboo architecture and breathtaking lake views. Its specially designed Vegetarian Tasting Menu comes highly recommended by luxury travelers. The chef selects vegetables from local organic farms, deftly pairing fresh beetroot, roasted pumpkin, and passionfruit sauce to deliver a double feast for both eyes and palate, reminiscent of artwork. The crispy truffle wild mushroom tart melts in your mouth, offering Yangon\u0027s ultimate luxury plant-based dining experience alongside gentle breezes and serene lake waters.", "name": "SEEDS Restaurant \u0026 Lounge - Veg Menu", "transport": "It is recommended to take a taxi from Hledan commercial area via Parami Road turning onto U Tun Tin Road; the drive takes about 12 minutes."}, {"address": "Pyay Road, Opposite Hledan Centre, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Located in the lively and bustling Hledan commercial district, this Indian vegetarian restaurant serves authentic South and North Indian plant-based cuisine. The popular \u0027Giant South Indian Dosa\u0027 reaches half a meter long, with paper-thin, crisp batter wrapping spicy mashed potatoes. Dipped into coconut chutney and tangy sambar lentil soup, every bite is a burst of complex flavors and rich aromas. With extensive vegetarian choices and friendly service, it\u0027s a firm favorite among locals of Indian descent and international tourists alike.", "name": "Kiran\u0027s South \u0026 North Indian Veg Restaurant", "transport": "Take a bus to Hledan Junction or Hledan Center Stop; the restaurant is directly opposite."}, {"address": "Parami Road, Near Inya Lake, Mayangone Township, Yangon", "feature": "\u2b50 4.3 stars | A fresh and cozy plant-based cafe located near Parami Road, close to the northern side of Inya Lake. It serves vegetarian brunches that are as gorgeous as they are delicious. Highly recommended are the \u0027Rainbow Veggie Acai Bowl\u0027 and \u0027Truffle Wild Mushroom Vegan Pasta\u0027. Made with high-quality durum wheat pasta, the dish is wok-tossed with aromatic truffle sauce and fresh wild mushrooms, allowing the perfectly al dente noodles to absorb every bit of rich flavor. The lush, botanical garden-like atmosphere makes it a top choice for a relaxing afternoon tea.", "name": "Inya Oasis Veggie \u0026 Cafe", "transport": "Take a bus to Parami Corner Stop and walk along Parami Road for about 4 minutes."}, {"address": "Corner of Hledan Road and Pyay Road, Kamayut Township, Yangon", "feature": "\u2b50 4.6 stars | A legendary street food stall located along the sidewalk at Hledan Junction, specializing in traditional Nepalese-style vegetarian samosas. Freshly fried, the samosa pastry is ultra-crispy, filled with soft potatoes, green peas, and warm Indian spices. On the spot, the vendor crushes the samosa, smothers it with a ladle of hot spicy lentil soup, and tops it with diced red onions and mint sauce. Tantalizingly tangy and spicy with a complex texture, it is the most popular and tourist-loved street-side vegetarian snack in Hledan.", "name": "Hledan Nepalese Veg Samosa \u0026 Curry Stall", "transport": "Take a bus to Hledan Junction Stop; the stall is located right on the sidewalk corner of the intersection."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Hledan Market, Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.5 Stars | Located at the heart of Hledan Night Market, this popular stall is famous for its made-to-order Samosa Salad (Samosa Thoke). Crispy, fried samosas are cut into bite-sized pieces and tossed with refreshing sliced onions, shredded cabbage, gram flour, and a savory, spicy curry broth. Every bite offers a double delight of crunchy crust and rich, flavorful soup. Its tangy, spicy, and appetizing taste comes highly recommended by local students and international tourists alike.", "name": "Hledan Market Samosa Salad Stall", "transport": "Take a bus to Hledan Bus Stop; the entrance to Hledan Night Market is about a 2-minute walk away."}, {"address": "Corner of Pyay Road and Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.3 Stars | The traditional Burmese snack \u0027Couple Cake\u0027 (Mont Lin Maya) is a street food soul snack you shouldn\u0027t miss in Hledan. Made by cooking rice batter in special hemispherical iron molds until golden and lightly charred on the outside, it is filled with rich quail eggs, chickpeas, and scallions. Crispy on the outside and tender inside, it bursts with savory and delicious warmth in every bite. Its cute appearance\u2014where two halves join into one\u2014and portable nature make it the top choice for tourists to enjoy piping hot while strolling.", "name": "Hledan Mont Lin Maya Street Stall", "transport": "About a 3-minute walk from Hledan Center."}, {"address": "Insein Road, near Hledan Junction, Kamayut Township, Yangon", "feature": "\u2b50 4.4 Stars | An affordable and authentic eatery near the Hledan shopping district, famous for captivating foodies with silky Shan Noodles. Warm sticky rice noodles are topped with a rich tomato chicken sauce and aromatic sesame oil. Silky and chewy in texture, served alongside tangy pickled greens and crunchy crushed peanuts, it boasts rich, distinct flavors. A must-try local classic when visiting this academic and commercial hub.", "name": "Aung Mingalar Shan Noodle - Hledan", "transport": "Located next to Hledan Junction, just a 2-minute walk away."}, {"address": "Inya Lake Embankment Promenade, Pyay Road, Kamayut Township, Yangon", "feature": "\u2b50 4.6 Stars | A popular dessert stall along the Inya Lake embankment promenade, specializing in Falooda, the classic Burmese refreshing dessert. A rich coconut milk and rose syrup base is filled with chewy sago pearls, handmade jelly, egg pudding, and a big scoop of vanilla ice cream. Smooth, sweet, and cooling to the core, enjoying this treat\u2014a delight for both eyes and tastebuds\u2014while strolling along Inya Lake at dusk with a gentle breeze is a favorite among local youth and tourists.", "name": "Inya Lake Waterfront Falooda Vendor", "transport": "Take a bus to Yangon University Station, then walk about 5 minutes toward the Inya Lake Promenade."}, {"address": "Hledan 1st Street, Kamayut Township, Yangon", "feature": "\u2b50 4.2 Stars | The best street spot to experience Yangon\u0027s authentic \u0027tea house culture,\u0027 located at the edge of Hledan Market. Their signature fried dough sticks (Ee Kway) are freshly fried\u2014super crispy on the outside, soft and chewy inside. Dipped into rich, sweet hot milk tea made with condensed milk, the crispy dough soaks up the aromatic tea broth, bursting with an irresistible blend of sweet and savory flavors. An incredible experience for tourists looking to soak in the relaxed local rhythm of life.", "name": "Shwe Yi Burmese Tea Stall \u0026 Snacks", "transport": "About a 4-minute walk from Hledan Station."}, {"address": "Inside Hledan Market, Kamayut Township, Yangon", "feature": "\u2b50 4.1 Stars | A South Asian-flavored street stall beloved for its made-to-order crispy Dosa and Burmese coconut pancakes (Mont Pyat Kalat). The batter is fried paper-thin, golden, and crispy, making a satisfying crunch with every bite. Paired with rich chickpea curry dipping sauce or sprinkled with grated coconut and black sesame seeds, it offers an irresistible aroma and exciting texture contrast. Highly affordable, it is a hugely popular grab-and-go treat in the area.", "name": "Hledan Market Dosa \u0026 Mont Pyat Kalat Stall", "transport": "Located in the main stall area inside Hledan Market, easily accessible on foot."}, {"address": "Hledan 3rd Street, Kamayut Township, Yangon", "feature": "\u2b50 4.5 Stars | Tucked away in an alley near the Hledan commercial area, this traditional stall serves Myanmar\u0027s national dish, Mohinga. The rich, delicious catfish broth blends lemongrass, ginger, and banana stem into a velvety, non-fishy, mildly thick soup. Paired with handmade rice vermicelli and freshly fried yellow pea fritters (Bayar Gyaw)\u2014which turn delightfully semi-soft while absorbing the rich broth\u2014it creates a textured, flavorful dish. A dream snack for locals and tourists alike to kickstart an energetic day.", "name": "Kyaw Swar Mohinga Stall", "transport": "About a 5-minute walk from Hledan Center."}, {"address": "University Avenue Road, near Yangon University Main Gate, Kamayut Township, Yangon", "feature": "\u2b50 4.3 Stars | A mobile snack cart at the intersection of Yangon University and Hledan, specializing in freshly tossed spicy and sour green mango salad (Thayet Thoke). Fresh, crispy green shredded mangoes are tossed vigorously on the spot with fish sauce, dried shrimp powder, roasted crushed peanuts, chili powder, and garlic oil. The mango strips are tart and crunchy, delivering a mouthwatering burst of heat and savory goodness that stimulates the appetite\u2014a favorite grab-and-go refreshment for Yangon University students and passersby.", "name": "University Avenue Mango Salad Cart", "transport": "A 2-minute walk from the main gate of Yangon University; the cart stall will be right in view."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Inya Lake and Hledan Commercial District"}, "thanlyin_kyauktan": {"categories": {"cat_1": {"items": [{"address": "Bogyoke Road, Thanlyin Market, Yangon", "feature": "\u2b50 4.5 stars | Located inside the Thanlyin Traditional Market, this popular noodle stall is the locals\u0027 top choice to start their day. The broth is slow-simmered for hours with fresh catfish, banana stem, and onions, resulting in a rich, creamy texture infused with subtle aromas of lemongrass and pepper. Served with crispy, freshly fried bean fritters and hard-boiled eggs that soak up the rich soup, each bite offers a delightful contrast of crispy and smooth textures, making it a favorite among locals and tourists alike.", "name": "Thanlyin Zay Mohinga", "transport": "Take a taxi from downtown Yangon across Thanlyin Bridge for about 45 minutes; once at Thanlyin Market, it is just a short walk."}, {"address": "Pagoda Road, Near Kyauktan Jetty, Kyauktan, Yangon", "feature": "\u2b50 4.3 stars | Situated right next to the ferry jetty for the Ye Le Pagoda (Kyauktan Water Pagoda), this classic Burmese restaurant is renowned for its fresh river seafood and authentic Burmese curries. The signature prawn curry and braised beef are rich and flavorful without being overly greasy, featuring a sauce infused with the rich sweetness of onions and garlic\u2014mouthwatering when poured over steaming hot rice. Built along the river, you can enjoy tender, juicy chunks of curried meat while watching ferries glide across the water, offering a truly authentic local charm.", "name": "Kyauktan River View Traditional Restaurant", "transport": "Take a tuk-tuk from Thanlyin Township for about 25 minutes to the Kyauktan Jetty area."}, {"address": "Main Road, Near Old Post Office, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | With a history spanning several decades, this traditional tea house is a central gathering place for Thanlyin locals. The Burmese milk tea here is sweet, rich, and smooth, freshly brewed with a strong black tea base and condensed milk. A must-order to accompany your tea is the freshly baked naan with spiced yellow pea dip. The naan is crispy on the outside, soft inside, with a delightful charcoal aroma; dipping it into the hot, savory pea puree creates an addictive sweet-and-savory combination.", "name": "Thanlyin Old Street Tea House", "transport": "Take Yangon YBS Bus Line 31 and get off at the Thanlyin Post Office stop, then walk for about 3 minutes."}, {"address": "Yangon-Kyauktan Highway, Kyauktan, Yangon", "feature": "\u2b50 4.2 stars | This established restaurant is famous for its generous Burmese feast spread. When you order a main dish like mutton curry or braised pork, the restaurant serves over a dozen complimentary local side dishes and fresh vegetable platters, paired with a unique savory fish paste dip. The meat in the curry is stewed until tender and melt-in-your-mouth, with a rich yet pleasant aroma, perfectly demonstrating the authentic deliciousness of traditional Burmese home-style cooking.", "name": "Kyauktan Shwe Nan Daw Myanmar Curry House", "transport": "About a 5-minute drive from the Kyauktan Ye Le Pagoda jetty."}, {"address": "Thanlyin Bridge Approach Road, Thanlyin, Yangon", "feature": "\u2b50 4.1 stars | Located near Thanlyin Bridge, this popular street food stall attracts crowds with its fresh daily Burmese fried fritters (Akyaw). Offerings include deep-fried bottle gourd strips, yellow pea fritters, and crisp shrimp cakes. The golden, crunchy batter coats sweet, juicy bottle gourd, and paired with the house special sweet-and-sour tamarind dipping sauce, it offers a crispy exterior, tender interior, and appetite-whetting flavor. It\u0027s a must-try local street snack when visiting the Thanlyin suburbs.", "name": "Thanlyin Bridge Traditional Akyaw Stall", "transport": "Drive along the main road for about 1 minute right after crossing Thanlyin Bridge; located in the busy roadside stall area."}, {"address": "Portuguese Church Road, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | Located right next to the historic Portuguese Church ruins, this famous local noodle shop specializes in the classic Burmese coconut chicken noodle soup (Ohn No Khao Sw\u00e8). The rich and creamy coconut broth, combined with tender chicken chunks and yellow egg noodles, offers a smooth texture with subtle hints of ginger and lemongrass. Sprinkle with crunchy fritters, diced red onions, and a squeeze of fresh lime juice for an exquisitely creamy, tangy, and unforgettable bowl.", "name": "Thanlyin Old Church Khao Swe House", "transport": "About a 7-minute motorbike taxi ride from Thanlyin town center."}, {"address": "University Road, Near Thanlyin Technological University, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | Loved by local neighborhood regulars, this classic dessert shop specializes in traditional Burmese Falooda and chilled coconut jelly cakes. The Falooda features rose syrup, handmade pudding, basil seeds, coconut jelly, and vanilla ice cream. Refreshingly cool and sweet, the diverse ingredients combine for a delightfully chewy and rich texture\u2014a perfect cooling treat during a hot suburban trip.", "name": "Thanlyin Traditional Dessert \u0026 Ice Shop", "transport": "About a 10-minute tuk-tuk ride from Thanlyin Railway Station."}, {"address": "Thabarwa Center Access Road, Thanlyin, Yangon", "feature": "\u2b50 4.0 stars | Located near the famous Thabarwa Nature Meditation Village, this traditional vegetarian eatery specializes in various traditional Burmese vegetarian dishes. The fermented tea leaf salad (Lahpet Thoke) is highly recommended; fermented tea leaves are tossed with crispy peanuts, broad beans, white sesame, and sunflower oil, creating a savory, slightly tangy, and delightfully crunchy dish with rich layers of flavor. An excellent choice for health-conscious travelers and those seeking authentic local flavors.", "name": "Thabarwa Village Traditional Tea \u0026 Vegetarian Eatery", "transport": "About a 15-minute taxi ride from Thanlyin Township towards Thabarwa Nature Village."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Star City Compound, Kyaik Khauk Pagoda Road, Thanlyin, Yangon", "feature": "\u2b50 4.5 stars | A stylish cafe located inside the upscale Star City community in Thanlyin, renowned for its bright natural light and lush garden views. The menu features delicate English brunches, freshly baked waffles, and specialty espresso made from beans selected from the Shan Plateau in Myanmar. Crispy on the outside and soft inside, their buttery croissants are the perfect choice for enjoying a relaxing morning before visiting the Yele Pagoda.", "name": "Star City Cafe \u0026 Bistro", "transport": "Take a taxi from downtown Yangon across the cross-sea bridge for about 45 minutes to reach the Star City compound."}, {"address": "Bago Riverfront, near Thanlyin Bridge Entrance, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | Situated on the banks of the Bago River, right next to the Thanlyin Bridge, offering unbeatable waterfront views. It is popular for its signature brunch combining specialty Dutch drip coffee with traditional Myanmar Coconut Milk Noodles (Ooh No Khao Sw\u00e8). The rich coconut broth paired with chewy noodles and a refreshing, smooth cold brew creates the ultimate delight for both eyes and palate.", "name": "Bridge View Riverside Cafe", "transport": "Take a Grab taxi across the Thanlyin Bridge, turn right onto the riverbank lane, and walk for about 3 minutes."}, {"address": "Ferry Jetty Road, Kyauktan Township, near Yele Pagoda, Yangon", "feature": "\u2b50 4.2 stars | A popular traditional tea house near the ferry jetty for Yele Pagoda. It seamlessly blends traditional Myanmar milk tea (Laphet Yay) with modern pour-over coffee. Tourists love ordering freshly fried samosas and Myanmar flatbread (Nan Bya) dipped in rich, sweet milk tea\u2014crispy on the outside, fluffy inside, packed with authentic South Asian flavor and local charm.", "name": "Kyauktan Yele Waterfront Tea House", "transport": "Take a tuk-tuk or taxi from downtown Thanlyin to the Kyauktan Ferry Jetty, then walk for 1 minute."}, {"address": "University Road, Near Thanlyin Technological University, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | Tucked away in the suburbs of Thanlyin, this garden cafe is filled with tropical plants and warm wooden accents that create a relaxing vibe. It specializes in health-conscious brunches, such as poached eggs on avocado toast, yogurt smoothie bowls, and organic local Myanmar pour-over coffee. The coffee features distinct citrus and floral notes with a smooth, sweet finish, making it a trendy spot for locals and expats alike.", "name": "The Green Oasis Garden Cafe", "transport": "It is recommended to take a taxi to the vicinity of Thanlyin Technological University, then follow the Green Oasis signs into the alley."}, {"address": "Main Road, Near Thanlyin Zay Market, Thanlyin, Yangon", "feature": "\u2b50 4.1 stars | Known locally for its freshly baked bread and signature iced lattes. Fresh milk toast and croffles served in limited morning quantities offer fantastic textures\u2014crispy yet pleasantly chewy. Paired with an iced caramel macchiato brewed from local Myanmar specialty coffee beans, it\u0027s sweet without being cloying\u2014an ideal brunch spot to refuel before exploring suburban attractions.", "name": "Aroma Coffee \u0026 Bakery Thanlyin", "transport": "A 5-minute walk from Thanlyin Central Market, conspicuously located along the main road."}, {"address": "Bogyoke Street, Thanlyin Township, Yangon", "feature": "\u2b50 4.3 stars | A popular spot for authentic Burmese brunch, showcasing the true pace of local life. Must-order items include Burmese fish noodle soup (Mohinga) and steamed pea fried rice (Htamin Byouk), paired with slightly sweet Burmese milk tea or black coffee. The savory, flavorful fish soup with smooth rice noodles and crispy yellow pea fritters is immensely popular among locals and food lovers.", "name": "Phoe La Pyae Tea \u0026 Coffee House", "transport": "Take a bus or taxi to Bogyoke Street in downtown Thanlyin to arrive."}, {"address": "Thanlyin Golf Estate, Golf Club Road, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | A quiet cafe and bistro located inside the Thanlyin Golf Club, open to all visitors. It serves classic American brunch platters, smoked salmon sandwiches, and high-quality French press coffee. Sitting on the outdoor terrace offers views over sprawling green fairways in an elegant, cozy environment with hearty, authentic dishes and a relaxing resort vibe.", "name": "Thanlyin Golf Club House Cafe", "transport": "It is recommended to drive or hire a dedicated taxi directly to the clubhouse entrance of Thanlyin Golf Club."}, {"address": "Pagoda View Point Street, Kyauktan, Yangon", "feature": "\u2b50 4.0 stars | A scenic cafe situated across from Kyauktan Yele Pagoda, offering prime angles for panoramic photos of the floating pagoda. Serving freshly ground Americano, iced coconut water coffee, and various traditional Burmese desserts (such as Mont Lone Yay Mayat). Enjoying brunch by the breezy riverbank lets you experience a unique blend of ancient pagoda tradition and modern coffee culture.", "name": "River Breeze Cafe near Yele", "transport": "After reaching the riverbank opposite Kyauktan Yele Pagoda, walk for 2 minutes along the scenic promenade to find it."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Star City, Thanlyin Township, Yangon", "feature": "\u2b50 4.3 stars | An exquisite bistro located inside the upscale Star City community in Thanlyin, offering a fusion of Burmese, Western, and international creative dishes alongside various cocktails. Surrounded by an elegant environment near the golf course, it boasts a fantastic atmosphere. The Burmese Beef Curry served with Signature Herb Rice features beef braised to utter tenderness in a richly fragrant sauce\u2014a top favorite among expats and local middle-class residents.", "name": "Star City Club House Restaurant", "transport": "Approx. 45 minutes by taxi from downtown Yangon across the Thanlyin Bridge."}, {"address": "Star City Building A, Thanlyin Township, Yangon", "feature": "\u2b50 4.4 stars | The Thanlyin Star City branch of Yangon\u0027s iconic Italian bistro, combining craft beer with authentic wood-fired pizzas. The signature Southern Myanmar Herb Seafood Pizza pairs freshly caught river seafood with local Burmese spices on a crust that is crispy outside and soft inside. Paired with a chilled signature cocktail, it is an excellent choice for unwinding after visiting the Ye Le Pagoda.", "name": "Parami Pizza Star City Branch", "transport": "Approx. 10 minutes by tuk-tuk or taxi from downtown Thanlyin."}, {"address": "Pagoda Road, Kyauktan Township, Yangon", "feature": "\u2b50 4.1 stars | A unique local eatery right next to the Kyauktan Ye Le Pagoda ferry pier, offering fresh Hlaing River seafood and grilled fish dishes. The local sour and spicy steamed river fish and Burmese grilled prawns are highly recommended\u2014the tender, juicy fish is infused with fresh herbal and lemongrass aromas. Enjoy the freshest water-town flavors of Myanmar while overlooking the river scenery and passing ferries.", "name": "Kyauktan Riverside Seafood Restaurant", "transport": "About a 3-minute walk from the Ye Le Pagoda boat pier."}, {"address": "Bago River Road, Thanlyin Township, Yangon", "feature": "\u2b50 4.2 stars | A highly acclaimed local Burmese traditional restaurant in Thanlyin, renowned for its diverse selection of Burmese curries and flavorful dipping sauces. Highlights include stewed mutton and Burmese fried fish, served with an abundant raw vegetable platter and signature shrimp paste (Ngapi). With its rich, authentic, and layered flavors, it attracts countless travelers visiting the Ye Le Pagoda specifically for a genuine Burmese lunch.", "name": "San Thit Myanmar Food Thanlyin", "transport": "Approx. 8 minutes by taxi from Technological University (Thanlyin)."}, {"address": "Main Road, Near Thanlyin Market, Thanlyin Township, Yangon", "feature": "\u2b50 4.0 stars | A garden bistro hidden in the lush greenery of Thanlyin, converted from a vintage teak mansion brimming with tropical retro charm. It specializes in authentic coastal dishes from Southern Myanmar alongside refreshing craft cocktails, such as lemongrass curry crab and Burmese spiced grilled chicken with crispy skin and juicy meat. Evening lights and live music create a wonderfully exotic and relaxed vibe.", "name": "The Teak Garden Bistro Thanlyin", "transport": "About a 10-minute walk from Thanlyin Old Street Market."}, {"address": "Thanlyin-Kyauktan Highway Road, Thanlyin, Yangon", "feature": "\u2b50 4.1 stars | A famous local fish restaurant located along the main road leading to Ye Le Pagoda, highly recommended by locals and foodies in the know. Selecting fresh live fish from the Bago River daily, the restaurant stews or pan-fries them with traditional Burmese spices. The signature pan-fried river catfish features a golden, crispy skin and incredibly delicate meat; paired with a sour and spicy dip, it\u0027s an unmissable suburban Thanlyin delicacy.", "name": "Ye Ye Fresh Fish Restaurant", "transport": "Directly accessible by taxi along the Thanlyin-Kyauktan Highway."}, {"address": "Star City Zone B, Thanlyin Township, Yangon", "feature": "\u2b50 4.2 stars | A suburban bar and bistro emphasizing open-air scenery, refined light bites, and beer, featuring expansive green views. The menu offers delicate Burmese fusion snacks and tropical fruity cocktails. Highly recommended are the Burmese crispy fried seafood platter and the spicy fermented tea leaf salad (Lahpet Thoke)\u2014the explosion of tangy fermented tea leaves and crunchy nuts makes it a dreamy spot to enjoy a cool breeze and good food.", "name": "The Green Oasis Bar \u0026 Bistro Thanlyin", "transport": "Located inside the Star City complex; accessible by shuttle bus or on foot."}, {"address": "Station Road, Thanlyin Township, Yangon", "feature": "\u2b50 3.9 stars | A great-value traditional local restaurant in Thanlyin Old Town with a long history. Known for its rich Burmese stews and diverse traditional side dishes, especially the pork curry and sour mustard fish soup. The thick, flavorful broths served over piping-hot steaming rice showcase the purest, heartwarming home-style cooking of suburban Myanmar, earning great love from visiting tourists.", "name": "Aung Myanmar Restaurant Thanlyin", "transport": "Located near Thanlyin Railway Station, about a 5-minute walk away."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Thanlyin Main Road, Near Thanlyin Market, Yangon", "feature": "\u2b50 4.3 stars | A traditional Burmese vegetarian tea house located in the heart of Thanlyin Town. Its most acclaimed dishes are the made-to-order vegetarian tofu noodles and fried dough sticks. The tofu noodles feature a rich broth made from locally ground soybeans, offering a smooth and creamy texture paired with crispy plant-based fritters. It is highly favored by local monks and tourists seeking a refreshing meal after visiting the pagodas.", "name": "San Thit Vegetarian \u0026 Tea House", "transport": "Take Bus No. 31 to Thanlyin Market Stop, then walk for about 3 minutes."}, {"address": "Pagoda Ferry Jetty, Kyauktan, Thanlyin, Yangon", "feature": "\u2b50 4.5 stars | A well-known vegetarian stall right next to the Kyauktan Ye Le Pagoda ferry jetty, famous for traditional Burmese vegetarian salads and vegetable fritters. Its signature crispy fritters are made with fresh peas and cilantro, fried to a golden crunch, and served with a tangy, appetizing house-made tamarind dip. It\u0027s a popular street food snack to enjoy before taking the boat to the pagoda.", "name": "Kyauktan Ye Le Veg Food Stall", "transport": "Take a taxi or tuk-tuk from Thanlyin town center for about 20 minutes to reach Kyauktan Jetty."}, {"address": "Station Road, Near Thanlyin Railway Station, Yangon", "feature": "\u2b50 4.2 stars | Run by Burmese-Indians, this authentic South Indian pure vegetarian restaurant serves classic options like crispy Dosas and rich Sambar (lentil curry). The dosas are golden and crispy on the outside yet soft inside, perfectly paired with special coconut chutney and spicy curry. Rich in flavor and 100% meat-free, it\u0027s a favorite for lovers of bold, savory vegetarian food.", "name": "Thanlyin South Indian Pure Veg", "transport": "Take a bus to Thanlyin Station, then walk about 5 minutes."}, {"address": "Bogyoke Aung San Road, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | A lush garden-style vegetarian eatery focusing on natural, additive-free Burmese vegetable dishes and freshly squeezed juices. The vegetarian version of the Burmese Tea Leaf Salad (Lahpet Thoke) is highly recommended; made with fermented tea leaves, toasted nuts, fried yellow peas, and fresh tomatoes, it offers a chewy, nutty, tangy, and delightfully authentic local flavor.", "name": "Mya Nanda Plant-Based Eatery", "transport": "Take a taxi from Thanlyin Technological University (TTU) for about 7 minutes."}, {"address": "Kyauktan Road, Near Thanlyin Pagoda, Yangon", "feature": "\u2b50 4.6 stars | Known for its tranquil and elegant ambience as well as exquisite Buddhist vegetarian cuisine, this restaurant strictly avoids all pungent plants (alliums). The signature Coconut Veggie Noodle Soup (Khasat Khow Suey) features a rich coconut milk broth, springy rice noodles, crispy purple sweet potato, and cilantro, delivering a smooth and velvety taste\u2014an ideal choice for nourishing both soul and body in Thanlyin.", "name": "Thaddha Vegetarian House Thanlyin", "transport": "Take a local tuk-tuk to near Thanlyin Pagoda."}, {"address": "Market Street, Kyauktan Township, Yangon", "feature": "\u2b50 4.1 stars | An affordable vegetarian noodle stall beloved by locals, specializing in vegetarian Shan Noodles. High-quality local rice noodles are tossed in a house-made veggie meat sauce and topped with rich crushed peanuts, offering a chewy texture and fragrant aroma. Served with a bowl of sweet winter melon and radish broth, it provides a satisfying yet refreshing meal.", "name": "Bawga Thukha Veg Noodle House", "transport": "Located inside Kyauktan Township Market, about an 8-minute walk from Kyauktan Jetty."}, {"address": "Riverfront Road, Kyauktan Township, Yangon", "feature": "\u2b50 4.0 stars | Designed especially for pilgrims visiting Ye Le Pagoda, this vegetarian restaurant serves a variety of set meals and stir-fried fresh vegetables. The signature veggie curry is slow-cooked with fresh highland mushrooms and root vegetables in a thick, rich gravy, paired with fragrant Burmese rice. Mild and comforting, it is widely praised by vegetarian travelers.", "name": "Kyauktan Green Veg Restaurant", "transport": "Walk along Kyauktan Riverfront Road; located near the Ye Le Pagoda viewing platform."}, {"address": "University Avenue, Near TTU Campus, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | A healthy vegetarian teahouse incorporating an organic farm concept, serving toxin-free locally grown produce. The popular \u0027Colorful Veggie Spring Rolls\u0027 are wrapped with crisp cucumbers, carrots, and seasoned tofu strips, served with a sweet-and-spicy mint dipping sauce. Extremely refreshing and crunchy, it\u0027s perfect for a tropical afternoon treat.", "name": "Green Light Organic Veg House Thanlyin", "transport": "Located diagonally opposite the main entrance of Thanlyin Technological University (TTU); reachable via Bus No. 32."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Kyauktan Water Pagoda Ferry Pier, Kyauktan, Yangon", "feature": "\u2b50 4.4 stars | A popular traditional snack stall next to the Kyauktan Water Pagoda ferry pier, specializing in Myanmar\u0027s famous \u0027Couple\u0027s Snack\u0027 (Mont Lin Maya). Made by pouring rice batter into small round molds on a special griddle, two halves are joined to form a single crispy sphere. Freshly cooked, the outer crust is golden and crunchy, while the inside remains soft and fragrant, bursting with rich coconut aroma and savory scallion notes. Symbolic of \u0027couple\u0027s unity,\u0027 this delightful street snack is loved by locals and tourists alike, making it a must-try classic before taking the ferry to the Water Pagoda.", "name": "Kyauktan Pier Mont Lin Maya Vendor", "transport": "Take a taxi from downtown Yangon for about 1 hour to the Kyauktan Water Pagoda Ferry Pier; walk right into the pier snack area."}, {"address": "Thanlyin Myoma Market, Bogyoke Road, Thanlyin, Yangon", "feature": "\u2b50 4.5 stars | Tucked inside the bustling traditional Thanlyin Market, this authentic Mohinga stall brews its rich broth daily using fresh river fish caught every morning, infused with lemongrass and turmeric aromas. Silky thin rice noodles soak up the flavorful broth, topped with freshly fried crispy chickpea fritters (Akyaw) and hard-boiled eggs. Taking a bite of the crispy fritter soaked in soup offers an irresistible blend of textures and savory, mild spicy flavors. It\u0027s a beloved morning spot for local shoppers and food enthusiasts alike.", "name": "Thanlyin Market Mohinga Stall", "transport": "Take a YBS bus heading towards Thanlyin to Thanlyin Market Stop, then walk about 2 minutes to reach the center of the market."}, {"address": "Pagoda Road Pier, Kyauktan, Yangon", "feature": "\u2b50 4.2 stars | Located near the riverside pier, this popular stall is famous for various freshly fried Burmese fritters (Akyaw Te), including golden crispy gourd fritters, samosas, and shrimp cakes. Fresh ingredients are coated in a special rice batter and deep-fried to golden perfection, keeping the inside juicy and sweet while crunchy on the outside. Paired with a house-made tangy and spicy dipping sauce, it\u0027s crispy, non-greasy, and appetizing\u2014the perfect grab-and-go snack while enjoying river views.", "name": "Kyauktan Pier Akyaw Te Stand", "transport": "Take a taxi to the entrance of the Kyauktan Water Pagoda Pier; you will find the stall walking along the vendor-lined approach road."}, {"address": "Yangon-Thanlyin Main Road, Thanlyin, Yangon", "feature": "\u2b50 4.3 stars | A popular traditional roadside tea stall on Thanlyin Old Street, specializing in made-to-order buttery flatbreads (Palata) and rich Burmese tea. Skilled artisans flip the dough until paper-thin and sear it on a hot griddle until both sides are golden, flaky, and layered. Crispy on the outside and delightfully chewy inside, it pairs amazingly with sweet condensed milk or a fried egg. Savoring it with a hot cup of sweet, rich milk tea offers a wonderful taste of authentic local tea shop culture.", "name": "Thanlyin Old Street Tea \u0026 Palata Stall", "transport": "Drive along the main road for about 10 minutes after crossing Thanlyin Bridge; located at the corner of Old Street."}, {"address": "Pagoda Approach Road, Kyauktan, Yangon", "feature": "\u2b50 4.1 stars | A traditional Burmese dessert especially popular during Thingyan (Water Festival) and daily markets. The owner wraps chewy glutinous rice dough around pieces of jaggery (palm sugar), boils them until they float, and serves them immediately topped with freshly grated coconut. Each bite bursts with molten palm sugar balanced by the fragrant crunch of fresh coconut\u2014a deliciously sweet and fun street treat loved by kids and tourists.", "name": "Kyauktan Mont Lone Yay May Stall", "transport": "Walk about 3 minutes along the main approach road connecting to Kyauktan Water Pagoda."}, {"address": "Riverfront Pathway near Kyauktan Pagoda Pier, Kyauktan, Yangon", "feature": "\u2b50 4.3 stars | A vibrant evening food stall right by the river pier, renowned for fresh grilled freshwater fish and prawns prepared to order. Fresh tilapia is slathered with a special garlic-herb marinade and grilled over charcoal until the skin is smoky and crisp, while the meat remains tender, juicy, and infused with smoky flavor. Served with a zesty chili-lime sauce, it offers a mouthwatering balance of spicy and tangy notes. Enjoying freshly grilled seafood while feeling the cool river breeze makes this a favorite evening stop for pagoda visitors.", "name": "Kyauktan Pier Riverfront Grilled Fish Stall", "transport": "Located on the riverfront walkway next to Kyauktan Pagoda Ferry Pier, easily accessible on foot."}, {"address": "Thanlyin Night Market Area, Station Road, Thanlyin, Yangon", "feature": "\u2b50 4.4 stars | A famous Shan Noodle stall situated in the lively Thanlyin Night Market. Silky, chewy rice noodles are tossed with savory minced chicken sauce, crushed peanuts, and fragrant garlic oil, delivering a smooth, appetizing comfort meal. Served with a side of tangy pickled greens and a bowl of clear pork bone broth, mixing it up creates a mouthwatering combination of rich sauces and bouncy noodles. Generous portions and friendly service make this one of the night market\u0027s most popular stalls.", "name": "Thanlyin Night Market Shan Noodle Stall", "transport": "Located in the night market area near Thanlyin Railway Station; accessible directly by tuk-tuk or taxi."}, {"address": "Bogyoke Road Street Market, Thanlyin, Yangon", "feature": "\u2b50 4.0 stars | Tucked away in a corner of Thanlyin open-air market, this old-school dessert stall serves banana leaf-steamed black sticky rice (Kauk Hnyin Mei Kway). A blend of black and white sticky rice is steamed with a touch of salt and coconut milk until soft and chewy, then wrapped in fragrant banana leaves. Served with a generous sprinkle of toasted white sesame seeds and fresh coconut shreds, it offers a nutty, rich chewiness filled with natural aromas. A delightful, additive-free traditional snack for those who love nostalgic treats.", "name": "Thanlyin Market Kauk Hnyin Mei Kway Stall", "transport": "Located on the outer street of Thanlyin Market, easily reachable on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Thanlyin and Ye Le Pagoda Suburbs"}, "yankin_kabaraye": {"categories": {"cat_1": {"items": [{"address": "No. 136, Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | An iconic, well-known tea house among Yangon locals and the top choice for experiencing an authentic Burmese breakfast. The signature Mohinga features a rich, savory-sweet broth slow-cooked for hours with fresh catfish bones and lemongrass, subtled with the sweet tenderness of banana stem. Served with crispy fried yellow split-pea fritters and springy rice noodles, every bite offers incredible depth of texture. Pair it with a cup of authentic hot Burmese milk tea (Laphet Yay), crafted with condensed milk and evaporated milk for a perfect balance of creamy richness and tea aroma\u2014a beloved spot for both locals and food-loving travelers.", "name": "Lucky Seven Tea House - Yankin", "transport": "Take the bus to Yankin College Station and walk for about 3 minutes."}, {"address": "No. 2, Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A classic seafood haven renowned for the spicy and sour dishes from the Rakhine region in western Myanmar. The signature Rakhine Mont Di features fresh sea fish simmered into a refreshing yet fiery, tangy broth, paired with smooth rice noodles and plenty of green chilies for an appetizing, sweat-inducing flavor hit. Their grilled seafood dishes and Rakhine-style stir-fried crab are equally sensational, featuring firm, juicy catches that showcase the spicy, maritime heritage of Rakhine cuisine.", "name": "Min Lan Rakhine Seafood Restaurant - Kaba Aye", "transport": "Located along the main Kaba Aye Pagoda Road; taking a Grab taxi directly is recommended."}, {"address": "No. 2A, Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | A celebrated establishment bringing together culinary traditions from Myanmar\u0027s various ethnic minorities, housed in a charming wooden building full of rustic charm. Highly recommended dishes include the Shan-style sour fish soup and Kachin herb-roasted meat. The Kachin roast is slow-grilled wrapped in banana leaves, leaving the meat tender, juicy, and infused with herbal aromas. Served with a complimentary traditional fresh vegetable platter with fish paste dipping sauce (Ngapi Gyi) and warm yellow pea soup, guests can sample the rich multi-ethnic flavors of Myanmar in a single meal.", "name": "Taing Yin Thar - Kaba Aye", "transport": "Located on the main Kaba Aye Pagoda Road; take a taxi or bus to Kabar Aye Station and walk."}, {"address": "No. 33, Kaba Aye Pagoda Road, Mayangone/Yankin Area, Yangon", "feature": "\u2b50 4.2 stars | A long-standing fine dining landmark in Yangon specializing in traditional Burmese slow-cooked braised dishes, popular among international tourists and local business travelers. Adhering to traditional slow-braising techniques, their Burmese mutton and beef curries feature melt-in-your-mouth tenderness, with gravy enriched by onions, turmeric, and aromatic peanut oil without feeling greasy. Served with steaming fragrant Burmese rice and a pickled tea leaf salad (Lahpet Thoke)\u2014offering a delightful crunch with nutty, tangy, and slightly bitter notes\u2014it delivers the timeless elegance of classic Burmese dining.", "name": "Green Elephant Restaurant - Kaba Aye", "transport": "Take the bus to Kaba Aye Pagoda Station and walk for about 5 minutes."}, {"address": "Kanbe Road, near Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A decades-old institution in Yangon seamlessly blending local flavors with traditional Chinese roasting craftsmanship. The signature roasted duck features golden, super-crispy skin that crackles with every bite, delightfully rich without any gamey odor. The meat inside remains succulent and tender, perfectly complemented by sweet plum sauce or a spicy Burmese dipping sauce\u2014a top choice for family gatherings and festive banquets.", "name": "Golden Duck Restaurant - Kaba Aye", "transport": "Take the bus to Kanbe Station and walk for about 4 minutes."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | A beloved neighborhood gem hidden in the Yankin community, cherished by local residents for decades. They carefully select fresh freshwater fish to simmer into a thick, comforting broth, enriched with fragrant sauteed onions and toasted rice powder for a velvety texture and deep flavor. Topped with freshly fried yellow split-pea fritters (Akyaw) and coriander before serving, the crisp fritters soak up the flavorful soup\u2014delivering an authentic, nostalgic taste of traditional Yangon.", "name": "Daw Cho Mohinga - Yankin", "transport": "Near Yankin Market; about a 3-minute walk from Yankin Market."}, {"address": "Pearl Condominium, Kaba Aye Pagoda Road, Bahan/Yankin Border, Yangon", "feature": "\u2b50 4.4 stars | The most iconic cafeteria-style Burmese restaurant chain in Yangon, renowned for its overwhelming variety of traditional stews and curries. Guests can point out their favorite dishes at the counter, such as spicy braised prawns, turmeric pork, and eggplant curry. Every dish is slow-cooked in traditional deep pots, thoroughly absorbing the vibrant spices to create rich, savory sauces perfect over rice. The meal includes a generous complimentary platter of fresh raw vegetables and savory fermented shrimp paste (Ngapi), offering a heart-warming, homestyle Burmese dining experience.", "name": "Feel Myanmar Food - Pearl Center", "transport": "Take the bus to Pearl Condo Station; located inside the Pearl Condominium shopping center."}, {"address": "Near Yankin Center, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | A long-standing famous spot specializing in traditional Shan state noodles, hugely popular with local foodies. The signature Dry Shan Noodles feature slick, springy rice noodles tossed in a house-made sauce crafted from tomato, chicken, and crushed peanuts, delivering a delightfully tangy-sweet flavor profile. Served with a bowl of clear broth with pickled mustard greens, it offers an unforgettable and refreshing taste of authentic Myanmar tradition.", "name": "Aung Mingalar Shan Noodle - Yankin Branch", "transport": "Take the bus to Yankin Center Station and walk for about 2 minutes."}], "name": "Iconic Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "52A Kaba Aye Pagoda Rd, Yangon", "feature": "\u2b50 4.4 stars | A high-end, elegant cafe located on Kaba Aye Pagoda Road, housed in a converted French villa. It serves refined European-style brunch and single-origin pour-over coffee. The signature Eggs Benedict features silky, rich yolks paired with crispy toast and custom Hollandaise sauce, offering an extraordinarily layered flavor profile. With a classic, tranquil ambience and a lush garden, it comes highly recommended by foreign tourists and local elites as a slow-living brunch haven.", "name": "Acacia Tea Salon", "transport": "Take a taxi along Kaba Aye Pagoda Road to diagonally opposite the Sedona Hotel."}, {"address": "30A Kaba Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A highly popular, modern minimalist cafe in Yankin Township, favored by youngsters and remote workers. It uses premium local Myanmar coffee beans to craft cold brews featuring citrusy notes and a nutty finish. For brunch, the Avocado Poached Egg Toast is top-rated\u2014smooth avocado puree blended with subtly spicy Myanmar seasonings makes for a refreshing, unique, and non-greasy bite.", "name": "Easy Cafe", "transport": "About an 8-minute walk from Myanmar Plaza shopping mall."}, {"address": "No. 12, Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | A boutique cafe with soft industrial decor adjacent to Kaba Aye Pagoda Road, featuring house-roasted specialty beans and a hearty Full English Breakfast. The classic brunch platter comes with pan-fried German sausages, aromatic juicy grilled mushrooms, silky scrambled eggs, and crispy bacon\u2014hearty and satisfying. Paired with a hot latte boasting a rich dark chocolate finish, it is immensely popular among expats.", "name": "Craft Cafe", "transport": "Take a bus to Kaba Aye Bus Stop and walk for about 3 minutes."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.1 stars | A well-established, cozy cafe in the Yankin commercial area offering a diverse selection of fusion brunch dishes and quality espresso drinks. Their popular American pancakes are golden and crispy outside, cloud-soft inside, drizzled with rich maple syrup and topped with fresh fruit slices\u2014delightfully sweet without being cloying. The homey, welcoming atmosphere makes guests want to linger.", "name": "Coffee Circles Yankin", "transport": "Take a taxi to near Yankin Center, then walk for about 5 minutes."}, {"address": "Pearl Condo, Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | A bright, stylish specialty pour-over coffee shop in Yankin, renowned for temperature-controlled precision brewing. It uses high-altitude organic coffee beans from Shan State, Myanmar, offering a sweet floral aftertaste. The Smoked Salmon \u0026 Cream Cheese Sourdough Toast features bread crisp outside and chewy inside, paired with silky fresh salmon, making it a trendy photo spot for influencers and food bloggers.", "name": "Press \u0026 Pour Coffee", "transport": "Take a bus to Pearl Condo stop and enter the 1st floor of the building\u0027s commercial arcade."}, {"address": "No. 88, Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | A trendy hybrid cafe on Yankin Road that seamlessly fuses Myanmar local flavors with Western brunch. The special Myanmar-style Curry Chicken Panini is highly recommended: grilled to a golden crunch with a juicy, rich, slightly spicy filling. Paired with a smooth, rich iced matcha latte, the overall dining experience is full of pleasant surprises.", "name": "Genesis Cafe \u0026 Bistro", "transport": "Take a taxi from Yankin Market, arriving in about 3 minutes."}, {"address": "Ground Floor, Myanmar Plaza, Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.0 stars | A European-style bakery cafe near Myanmar Plaza serving freshly baked croissants and French pastries every morning. The golden croissants feature flaky, buttery layers outside and a moist, soft interior. Paired with a rich hot cappuccino topped with dense foam, it is an ideal spot for a leisurely morning brunch or a casual business meeting.", "name": "Yangon Bay Cafe \u0026 Bakery", "transport": "Take a bus to Myanmar Plaza stop for direct access to the shopping mall\u0027s ground floor."}, {"address": "Kanbe Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A leafy garden cafe tucked away in a quiet lane in Yankin, filled with vibrant greenery and bright natural light. It specializes in healthy Acai Bowls and piping-hot cheese omelets. The smoothie-like Acai Bowl is pleasantly sweet and tart, topped with crunchy nuts for a light, guilt-free treat favored by health-conscious travelers.", "name": "Oasis Garden Cafe \u0026 Brunch", "transport": "Take a taxi to near Kanbe Station, then walk for about 4 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 63A, U Tun Tin Street, Mayangone Township, Yangon", "feature": "\u2b50 4.6 stars | A premier, borderless French gastropub situated on the banks of Inya Lake, founded by a Michelin-starred chef. It offers exquisite Euro-Asian fusion cuisine and signature cocktails in a setting surrounded by lush tropical greenery and serene lake waters. The must-order pan-seared scallops with herb sauce are crispy outside, tender and juicy inside. Paired with custom cocktails, it is a top choice for tourists, local politicians, and business elites enjoying a luxurious night out.", "name": "Seeds Restaurant \u0026 Lounge", "transport": "Take a taxi along Kaba Aye Pagoda Road and turn onto U Tun Tin Street to arrive."}, {"address": "4th Floor, Myanmar Plaza, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.1 stars | A trendy gastropub located on the top floor of Myanmar Plaza, a popular landmark in Yankin Township. It boasts magnificent open-air rooftop views and modern decor. Serving a diverse menu of Asian-Western fusion light bites alongside live music performances and craft beers, its classic spicy stir-fried seafood paired with a signature wild berry cocktail is rich and refreshing, making it highly popular among young locals and expats.", "name": "Eclipse Bar \u0026 Restaurant", "transport": "Take a bus to Myanmar Plaza Station, or take a taxi directly to Myanmar Plaza."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A unique gastropub themed around the native culinary culture of Myanmar\u0027s Shan State, seamlessly blending traditional Shan flavors with modern bar concepts. Signature dishes like Shan fermented soybean grilled meat and hot \u0026 sour fish soup, paired with cocktails crafted from local fermented rice wine, offer a vibrant, layered interplay of sweet, sour, and spicy flavors. It is a favorite among foodies seeking authentic regional cuisine and nightlife experiences.", "name": "Root Kitchen \u0026 Bar", "transport": "Take a taxi along Kaba Aye Pagoda Road towards the Yankin Township section."}, {"address": "No. 103, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | A classic British gastropub on the main artery of Kabar Aye in Yankin, offering a relaxed and cultured atmosphere. Highlighting refined pub grub and a broad selection of imported draft beers, the slow-roasted BBQ pork ribs are melt-in-your-mouth tender with a perfectly balanced sweet and spicy glaze. The signature fish and chips are golden crispy on the outside and succulent inside, making it a go-to spot for local expats and tourists to unwind.", "name": "Escape Gastropub", "transport": "Take a taxi straight along Kaba Aye Pagoda Road to arrive."}, {"address": "No. 20, Malikha Street, Mayangone Township, Yangon", "feature": "\u2b50 4.5 stars | A warm French gastropub that doubles as a hospitality training school, showcasing premium local Myanmar ingredients cooked with French culinary techniques. Highly recommended is the pan-seared sea bass with lemongrass butter sauce; the skin is crispy, the flesh delicate, and the sauce blends tropical herbal aromas with rich creaminess. Set in an elegant garden environment, it has earned glowing reviews.", "name": "Shwe Sa Bwe", "transport": "Take a taxi via Kaba Aye Pagoda Road and turn into Malikha Street to arrive."}, {"address": "Kabar Aye Pagoda Road, Mayangone Township, Yangon", "feature": "\u2b50 4.2 stars | A specialty seafood restaurant focusing on the intensely spicy and sour flavors of Myanmar\u0027s Rakhine State, featuring a lively, local atmosphere. Signature dishes like the Rakhine spicy grilled prawns and hot \u0026 sour fish soup use abundant green chilies and tropical herbs; the prawn meat is sweet and snappy, while the tangy soup is addictively mouthwatering. Brimming with bold regional identity, it is a must-visit to experience Myanmar\u0027s seafood dining culture.", "name": "Min Lan Seafood Restaurant (Kabar Aye Branch)", "transport": "Take a bus or taxi along Kaba Aye Pagoda Road to arrive."}, {"address": "Sedona Hotel, No. 1, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | An upscale bar and grill located inside the 5-star Sedona Hotel in Yankin Township, featuring an elegant setting complete with live jazz and piano performances. Serving premium charcoal-grilled steaks and curated wines, the chef\u0027s signature dry-aged ribeye steak has a charred, flavorful crust and a tender, juicy pink center. It is the premier luxury choice for a sophisticated, romantic evening.", "name": "The Piano Bar \u0026 Grill (Sedona Hotel)", "transport": "Take a taxi and drop off at the main entrance of Sedona Hotel."}, {"address": "Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | Tucked away in an alleyway in Yankin, this modern industrial-style gastropub is renowned for its cozy, relaxed vibe and creative Myanmar-Western fusion dishes. The signature Burmese Mutton Curry Handmade Pizza combines rich spiced curry with gooey melted cheese on a crispy crust. Paired with a variety of handcrafted cocktails, it is a popular evening hangout spot for local youth and travelers.", "name": "Frenzo Bistro \u0026 Bar", "transport": "Take a taxi to the alley off Yankin Road to arrive."}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "Kaba Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | A popular vegetarian eatery near Kaba Aye Pagoda Road specializing in traditional Burmese and Chinese plant-based cuisine. Their \u0027Burmese Tofu Salad\u0027 uses house-made chickpea tofu\u2014lightly pan-fried until golden and crispy on the outside while silky-smooth like tofu pudding on the inside. Tossed with lime juice and fresh cilantro, this zesty and tangy dish is a favorite among both local Chinese residents and foreign tourists.", "name": "San Daku Vegetarian Restaurant", "transport": "Take a bus to Kaba Aye Pagoda stop; it is about a 5-minute walk from there."}, {"address": "Yankin Road, near Myanmar Plaza, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | A branch of the globally renowned vegan chain located in Yankin, offering 100% plant-based, dairy-free, and egg-free dishes. The must-try \u0027Plant-Based Coconut Shwe Taung Noodles\u0027 features an exceptionally rich and velvety broth where coconut milk and curry aromas blend seamlessly. Served with chewy noodles and crunchy fried bean crackers, it boasts rich layers of texture that win praise even from non-vegetarians.", "name": "Loving Hut Yankin", "transport": "About an 8-minute walk from Myanmar Plaza shopping center."}, {"address": "Sayar San Road, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | A highly regarded local eatery in the Yankin commercial district, recreating traditional Burmese noodles into vegan variations. Their star dish, \u0027Vegan Mohinga\u0027, simmers lemongrass, banana stem, and flavorful broth into a rich, smooth base. Paired with freshly fried crispy split-pea fritters and a squeeze of lime juice, it delivers an authentic Burmese street food experience.", "name": "Shwe Taung Noodle \u0026 Veggie", "transport": "Take a taxi to the intersection of Sayar San Road and Yankin Road; you will see it right there."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | A North Indian-style vegan restaurant near Kaba Aye, serving flavor-packed South Asian vegetarian dishes. The signature \u0027Veg Thali\u0027 includes a vibrant spread of rich lentil dahl curries, naan bread, and aromatic turmeric rice. The piping-hot naan is crispy outside and soft inside\u2014perfect for dipping into smooth, spiced lentil curry for a deeply exotic meal.", "name": "Bodhgaya Vegetarian House", "transport": "Take a taxi directly to the stretch near Kaba Aye Pagoda."}, {"address": "Pearl Condo, Kabar Aye Pagoda Road, Bahan/Yankin Border, Yangon", "feature": "\u2b50 4.6 stars | A trendy, fresh vegetarian spot near Pearl Condo, blending Thai and Southeast Asian light bites. Their \u0027Crispy Veggie Spring Rolls\u0027 are golden and delightfully crunchy, crackling with every bite. Filled with fresh vegetables and wood ear mushrooms and paired with a sweet-and-sour dipping sauce, they offer a crisp, non-greasy treat.", "name": "Green Gallery Veggie Corner", "transport": "Take a bus to Pearl Condo stop; it is a 3-minute walk away."}, {"address": "Kanbe Road, Yankin Township, Yangon", "feature": "\u2b50 4.1 stars | A cozy spot tucked away in Yankin\u0027s residential area, offering a quiet and relaxing dining ambiance. Highly recommended is the \u0027Zen Shan Noodle Salad\u0027, featuring chewy handmade noodles tossed in a special fermented tomato-soy sauce and topped with crushed peanuts. Savory, slightly tangy, and delightfully textured, it pairs wonderfully with pesticide-free organic herbal tea to refresh your palate.", "name": "Zen Vegetarian Cafe", "transport": "Take the Yangon Circular Railway to Kanbe Station, then walk about 7 minutes from the exit."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.0 stars | An affordable Burmese vegetarian buffet restaurant near Kaba Aye Pagoda, popular among locals and pilgrims alike. The favorite \u0027Vegetarian Tea Leaf Salad (Lahpet Thoke)\u0027 mixes fermented tea leaves with crunchy roasted peanuts, toasted sesame seeds, and fried beans. Delivering a crisp crunch along with earthy tea notes and a punchy tangy-spicy kick, it is a must-try classic of unique Burmese culinary culture.", "name": "Kyaw Swa Vegetarian Restaurant", "transport": "About a 6-minute walk from the main entrance of Kaba Aye Pagoda."}, {"address": "Parami Road near Kabar Aye Pagoda Rd, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | An elegant tea house located on the eastern side of Inya Lake along Kabar Aye Pagoda Road, serving premium vegetarian dim sum and teas. Their \u0027Veg Samosa\u0027 boasts an ultra-crispy crust packed with a hearty filling of spiced potatoes and green peas. Steaming hot and bursting with aromatic spices upon the first bite, it makes a match made in heaven when paired with a dairy-free Thai lemon tea.", "name": "Inya Lake Veggie \u0026 Tea House", "transport": "Take a taxi to the intersection of Parami Road and Kabar Aye Pagoda Road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near Yankin Market, Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Known as \u0027Couple Cakes\u0027, this traditional rice batter snack features quail eggs, scallions, and chickpeas cooked in hemispherical cast-iron molds and fused together in pairs. Fresh out of the pan, they boast a golden, crispy exterior with a savory, tender center infused with subtle aromas of rice and egg. Crispy on the outside and melt-in-your-mouth inside, it\u0027s a favorite street snack among Yankin locals.", "name": "Yankin Mont Lin Maya Stall", "transport": "Take the bus to Yankin Market Stop and walk for about 2 minutes."}, {"address": "Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.6 stars | The rich, comforting broth is simmered with abundant fresh fish bones, lemongrass, and banana stem. Served with silky rice noodles, crispy split pea fritters (Bayar Kyaw), and boiled eggs, it offers wonderfully complex textures and a rich, savory-sweet flavor accented by subtle pepper spices. A must-try spot around Kabar Aye for experiencing Myanmar\u0027s national dish.", "name": "Kabar Aye Mohinga Vendor", "transport": "Take the bus to Kabar Aye Pagoda Stop and walk for 3 minutes."}, {"address": "Sayar San Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Freshly fried to order, these samosas feature a golden, crispy crust packed with aromatic spiced mashed potatoes. The vendor also chops the samosas into bite-sized pieces and ladles a signature hot-and-sour broth with thin onion slices over them to create classic \u0027Samosa Soup\u0027. The delightful mix of crispy and tender textures paired with appetizing tangy flavors makes it a huge hit with visitors.", "name": "Sayar San Road Samosa Stall", "transport": "Take the bus to Sayar San Road Stop; it\u0027s just a short walk away."}, {"address": "Kabar Aye Pagoda Road (Near Myanmar Plaza), Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | A quintessential Myanmar street food experience, Wet Tha Doke Kut features pork offal and meat richly braised in aromatic spices, sliced into small pieces, and skewered on bamboo sticks arranged around a central pot of bubbling broth. Diners sit around the pot, grab skewers as they please, and dip them into a spicy-tangy chili sauce. Chewy, flavorful, and deeply savory, this spot showcases Yangon\u2019s authentic nighttime street food scene.", "name": "Myanmar Plaza Wet Tha Doke Kut Stall", "transport": "Take the bus to Myanmar Plaza Stop and walk for 1 minute."}, {"address": "Kabar Aye Pagoda Road (Lake Side), Yankin Township, Yangon", "feature": "\u2b50 4.5 stars | Located along Kabar Aye Pagoda Road near Inya Lake, this popular dessert cart specializes in traditional Burmese treats: Shwe Yin Aye and Falooda. Loaded with coconut milk, sticky rice, sago, jelly noodles, and ice cream, it\u0027s refreshingly sweet, creamy, and cool\u2014the ultimate treat to beat the heat while strolling along the lake in the afternoon.", "name": "Inya Lake Side Falooda \u0026 Shwe Yin Aye Cart", "transport": "Take the bus to Inya Lake Bank Stop and walk for 2 minutes."}, {"address": "Inside Yankin Market, Yankin Road, Yankin Township, Yangon", "feature": "\u2b50 4.4 stars | Freshly ground yellow peas are cooked into a thick, warm porridge (Shan Tofu Nway) and poured over silky rice noodles, topped with crushed peanuts, sesame seeds, garlic oil, and shredded chicken. Featuring a rich, creamy texture with savory nutty flavors, this authentic Shan specialty draws foodies from all over.", "name": "Yankin Zay Shan Tofu Noodle Stall", "transport": "Take the bus to Yankin Market Stop and walk into the market for about 1 minute."}, {"address": "Kabar Aye Pagoda Street, Yankin Township, Yangon", "feature": "\u2b50 4.2 stars | Located near the pagoda, this traditional cake stall freshly prepares classic Mont Onn Ne. Made from glutinous rice flour, coconut milk, and palm sugar, the cakes are pan-fried until lightly charred on the outside. Featuring a crispy outer layer and a soft, chewy center filled with coconut and jaggery aromas, it\u0027s a beloved local street treat.", "name": "Kabar Aye Mont Onn Ne Stall", "transport": "Take the bus to Kabar Aye Pagoda Stop and walk for about 4 minutes."}, {"address": "Yankin Road, near Yankin Center, Yankin Township, Yangon", "feature": "\u2b50 4.3 stars | Situated at a busy Yankin intersection, this popular fried snack stall freshly prepares split pea fritters (Bayar Kyaw) and Burmese fried dough sticks (Ekyaw). The pea fritters are crunchy outside and soft inside, packed with texture and fresh cilantro flavor, while the hollow, crispy dough sticks are perfect for dipping into rich Burmese milk tea. A quintessential breakfast and afternoon snack beloved by locals.", "name": "Yankin Bayar Kyaw \u0026 Ekyaw Stall", "transport": "Take the bus to Yankin Center Stop and walk for about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Yankin and Kabar Aye Commercial District"}};
        const themeHex = "#b45309";
        const cityName = "Yangon";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
