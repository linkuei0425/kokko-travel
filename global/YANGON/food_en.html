platter of fresh raw vegetables and savory fermented fish paste (Ngapi)\u2014dipping the fresh greens yields a refreshing burst of authentic Myanmar countryside flavor.", "name": "Aung Thukha Traditional Burmese Restaurant", "transport": "About a 5-minute taxi ride from the North Gate of Shwedagon Pagoda."}, {"address": "82 U Wisara Road, Dagon Township, Yangon", "feature": "\u2b50 4.1 stars | A seafood restaurant specializing in bold, spicy, and tangy flavors from Rakhine State in western Myanmar\u2014a true paradise for spice lovers. The signature Rakhine Sour \u0026 Spicy Steamed Fish uses fresh daily catch steamed over high heat with fresh lime juice, raw chilies, and cilantro; the tender fish meat paired with zesty, punchy broth hits all the right notes. Another favorite, Spicy Stir-Fried Cuttlefish, offers a springy texture tossed with aromatic garlic and special chili paste. Paired with a chilled bottle of Myanmar Beer, it is thoroughly satisfying.", "name": "San-Pe Rakhine Seafood Restaurant", "transport": "About a 4-minute taxi ride north along U Wisara Rd from the National Museum of Myanmar."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 42, Sagawa Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Renowned for authentic Burmese plant-based cuisine, this restaurant\u0027s signature herb-mixed rice features distinct grains infused with subtle aromas of lemongrass and turmeric, offering a warm and soothing finish. The rich chickpea curry is thick and dense, perfectly paired with freshly baked Burmese bread that is crispy outside and soft inside. Highly favored by health-conscious tourists and local vegetarians.", "name": "Saninda Vegetarian Restaurant", "transport": "Take a taxi to Sagawa Road in Dagon Township. Located near the National Museum, it is about an 8-minute walk."}, {"address": "No. 15, Manaw Hari Street, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | A fresh, cozy cafe near Shwedagon Pagoda and the National Museum, specializing in vegan and organic dishes. A must-try is the famous Burmese Tea Leaf Salad (Lahpet Thoke), made with fermented tea leaves mixed with crispy fried beans, peanuts, and garlic slices\u2014tangy, savory, delightfully crunchy, and non-greasy. The pleasant garden setting makes it a top relaxation spot for foreign travelers.", "name": "Bodhi Tree Cafe \u0026 Vegetarian", "transport": "A 3-minute taxi ride from the National Museum to Manaw Hari Street."}, {"address": "No. 88, Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Tucked away in lush greenery, this vegetarian eatery offers Western and Southeast Asian fusion dishes. Its signature Vegetarian Khow Suey features a rich, creamy broth infused with coconut and curry notes, served over smooth yellow noodles topped with crispy fried noodles for a delightful chewiness. Addictively delicious, it\u0027s rated by international travelers as a must-eat vegetarian dish in Yangon.", "name": "The Canopy Vegetarian Cafe", "transport": "Take a bus to the National Museum stop and walk north along Pyay Road for about 5 minutes."}, {"address": "No. 102, Yaw Min Gyi Street, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | A long-standing traditional Chinese vegetarian eatery specializing in mock meats and classic stir-fries. The signature Sizzling Vegetarian Char Siu features a crispy caramelized crust with a tender, chewy texture inside, smothered in a sweet and savory sauce that goes perfectly with rice. With a diverse menu and generous portions, it is highly recommended by local Chinese residents and traditional vegetarians.", "name": "Kwan Yin Vegetarian Restaurant", "transport": "About a 12-minute walk or a 5-minute taxi ride from the National Museum of Yangon to Yaw Min Gyi Street."}, {"address": "No. 23, Alan Pya Pagoda Road, Dagon Township, Yangon", "feature": "\u2b50 4.7 stars | A plant-based concept cafe combining yoga and clean eating, focusing on whole foods and no added sugar. The signature Rainbow Quinoa Power Bowl comes with fresh avocado, roasted beetroot, and house-made tahini dressing, delivering a crisp, sweet, and wonderfully layered flavor profile. Filled with natural light and a serene ambiance, it draws numerous Western tourists and yoga enthusiasts.", "name": "Nourish Cafe Yangon", "transport": "Take a taxi to Alan Pya Pagoda Road; it is about a 6-minute drive from the National Museum in Dagon Township."}, {"address": "No. 54, Nawaday Street, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | Specializing in authentic South Indian vegetarian cuisine, its most popular Paper Dosa is paper-thin, crispy, and fragrant. Dipped in house-made lentil stew (Sambar) and coconut chutney, it unleashes a burst of mildly spicy and tangy flavors. Affordable and full of authentic charm, it is a favorite dining spot for local Indian residents and backpackers alike.", "name": "Subhash South Indian Pure Vegetarian", "transport": "About a 10-minute walk from the National Museum to Nawaday Street."}, {"address": "No. 169, War Taze Ter Street, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Known for exquisite Burmese Shan cuisine, this restaurant\u0027s vegetarian menu features incredible Shan Tofu Fritters. Made from chickpea and yellow pea flour, the tofu is fried to golden crispness on the outside while remaining pudding-soft inside. Dipped in a garlicky, spicy, and tangy sauce, the ultimate textural contrast amazes international visitors.", "name": "Shan Yoe Yar Vegetarian Specialties", "transport": "About a 4-minute taxi ride from the National Museum to War Taze Ter Street."}, {"address": "Street Stall near National Museum, Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | A popular street stall near the National Museum, specializing in traditional handmade Warm Tofu Noodles (Tofu Nway). Freshly cooked warm yellow-pea porridge is poured over delicate rice noodles, creating a thick, smooth, and velvety texture topped with crunchy crushed peanuts and cilantro. This authentic Burmese street snack is immensely popular among local office workers and travelers exploring local culture.", "name": "Dagon Traditional Shan Tofu \u0026 Lahpet Street Stand", "transport": "Located along the sidewalk of Pyay Road right outside the main entrance of the National Museum of Yangon, just a 1-minute walk."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "49 Min St, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | A highly iconic morning tea house in Yangon. Its popular signature dish, \u0027Mohinga\u0027 (fish noodle soup), offers a rich and soothing flavor, slow-cooked with fresh fish, lemongrass, and banana stem broth, served with crispy fried split pea fritters and soft-boiled eggs for rich layers of texture. Locals love ordering a cup of rich, sweet Burmese milk tea paired with crispy, freshly fried fritters (Ekyaw) dipped into the tea\u2014filling, satisfying, and packed with local culture.", "name": "Lucky Seven Tea House", "transport": "About a 5-minute taxi ride from the National Museum of Myanmar."}, {"address": "Western St, Near Shwedagon Pagoda West Gate, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Located near the West Gate of Shwedagon Pagoda, serving the classic Burmese street snack \u0027Mont Lin Maya\u0027 (meaning \u0027Couple\u0027s Bites\u0027 or \u0027Loving Couple\u0027). Rice batter is poured into special hemispherical cast-iron pans, topped with quail eggs, scallions, and chickpeas, and then joined into a ball. Crispy and fragrant on the outside when fresh off the grill, soft and hot on the inside, biting in bursts with savory aromas and rich egg yolk\u2014a must-try delicious bite for walking tourists.", "name": "Mont Lin Maya Vendor - Shwedagon West Gate", "transport": "Located right by the West Gate pilgrimage walkway of Shwedagon Pagoda, about a 12-minute walk from the National Museum."}, {"address": "Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Hailed as one of the best Mohinga spots in Yangon, representing Myanmar\u0027s iconic traditional national breakfast. Fresh fish is slow-simmered with aromatic spices to eliminate any fishiness, creating a golden, rich broth served with thin rice vermicelli and fresh mint leaves\u2014tangy, savory, spicy, and packed with umami. Pair it with a freshly fried crispy bottle gourd fritter or fried onion fritter for a rich contrast of crispy and silky textures. The flavorful, non-greasy broth attracts crowds of tourists seeking an authentic Burmese food experience.", "name": "Myaungmya Daw Cho Mohinga - Dagon Branch", "transport": "Take Bus No. 35 to Pyay Road Station, then walk for 3 minutes."}, {"address": "Nawaday Street, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | A popular street stall tucked away on Nawaday Street in Dagon Township, famous for its \u0027Samosa Salad\u0027 (Samosa Thoke). The vendor chops freshly fried golden curry samosas into bite-sized pieces, tossing them with shredded cabbage, onions, chickpea soup, and a signature zesty lemon chili sauce. The samosa pastry retains an impressive crispiness, while the rich curry spices blend perfectly with the tangy, spicy sauce\u2014an amazingly appetizing street snack you shouldn\u0027t miss while exploring the area.", "name": "Nawaday Street Samosa Salad Vendor", "transport": "About a 10-minute walk from the National Museum of Myanmar."}, {"address": "Pyay Road, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Specializing in Rakhine State snacks and seafood delicacies, this spot is a favorite among local young adults. The must-try signature dish is \u0027Rakhine Mont Di\u0027 (Rakhine rice noodles), featuring a light, tangy, and spicy broth served with thin rice noodles, minced fresh fish, raw chilies, and fiery paste for an irresistibly refreshing flavor. The stall also serves popular street hits like charcoal-grilled squid Township, Yangon", "feature": "\u2b50 4.4 stars | A Shan noodle and street snack stall styled after traditional Burmese market stands. The broth of their \u0027Shan Sticky Rice Noodle Soup\u0027 is naturally sweet, paired with smooth rice noodles and tender minced meat\u2014a piping hot bowl that soothes the stomach. The stall also sells \u0027Mont Pyat Tat\u0027 (Burmese steamed rice cake wrapped in banana leaves), offering a delightfully chewy, subtly sweet texture with a gentle fragrance of banana leaves, making it a fantastic spot to experience local street dessert and everyday food culture.", "name": "Aung Mingalar Shan Noodle \u0026 Street Snacks", "transport": "About a 6-minute taxi ride from the South Gate of Shwedagon Pagoda."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dagon District and the National Museum"}, "dala_township": {"categories": {"cat_1": {"items": [{"address": "Dala Ferry Jetty Road, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | A decades-old mohinga stall located near Dala Ferry Terminal. It features a rich, sweet catfish broth infused with lemongrass, served with silky rice noodles and crispy fried bean fritters. This steaming bowl is rich, savory, and slightly spicy, with noodles that melt in your mouth after soaking up the broth. It\u0027s beloved by daily ferry commuters and tourists exploring the river village life.", "name": "Dala Ferry Terminal Mohinga", "transport": "Take the ferry from Pansodan Jetty in downtown Yangon to Dala Jetty, then walk about 2 minutes from the exit."}, {"address": "Bogyoke Street, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | This tea house is a central gathering place for Dala locals to chat and enjoy breakfast. Their signature strong Burmese milk tea (\u0027Laphet Yay\u0027) boasts a robust tea aroma with a rich sweetness. Paired with freshly made paratha and flavorful yellow pea mash, the crispy, chewy flatbread tastes even more rich and layered when dipped ngon", "feature": "\u2b50 4.3 stars | Situated on the Dala bank of the Yangon River, this spot specializes in fresh catch-of-the-day grilled fish and seafood. Fish brushed with special Burmese herbs and spicy-sour sauce is charcoal-grilled to produce a smoky, charred skin and juicy, tender flesh. Enjoying this under the cool river breeze offers a unique water-town vibe highly recommended for fans of local rustic cuisine.", "name": "Dala Riverfront Seafood \u0026 BBQ", "transport": "Walk west along Strand Road along the riverbank for about 10 minutes from Dala Ferry Jetty."}, {"address": "Pyidaungsu Road, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | A decades-old spot specializing in traditional Shan noodles (Shan Khauk Sw\u00e8), offering both soup and dry versions. The house-special marinated tomato chicken sauce is rich, sweet, and tangy, served over soft, chewy rice noodles topped with crunchy crushed peanuts. Mixed together, it creates a smooth, appetizing mix of savory, sweet, and sour flavors, making it a packed lunch favorite.", "name": "Dala Shan Noodle Corner", "transport": "About 6 minutes by trishaw from Dala Ferry Jetty."}, {"address": "Market Street, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | A traditional shop specializing in Myanmar\u0027s national dish, Fermented Tea Leaf Salad (Lahpet Thoke). Premium fermented tea leaves are tossed with crispy fried split peas, broad beans, sesame seeds, garlic chips, and diced tomatoes. The tea brings a subtle, pleasant bitterness followed by an explosion of nutty crunch and tangy spice, delivering amazing texture and authentic local flavor.", "name": "Daw Kyi Tea Leaf Salad Stall", "transport": "Located inside Dala Traditional Market, about an 8-minute walk from the ferry jetty."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Near Dala Ferry Jetty, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | A popular brunch spot near the Dala Ferry Jetty, famous cy crab meat absorbs rich spices, garlic, and chili, creating an addictive, mildly spicy flavor that draws many foodies across the river.", "name": "Dala Oasis Seafood \u0026 Local Bistro", "transport": "Take a trishaw from Dala Ferry Jetty for about 8 minutes."}, {"address": "Bo Min Yaung Road, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | A favorite outdoor bistro among locals, brimming with warm Burmese rustic charm. It serves a variety of fresh skewers and classic Burmese stir-fries. The grilled fish has a crispy skin and tender, juicy meat sprinkled with special herb salt and chili powder for maximum flavor. Paired with local chilled stout beer, it is the best choice for experiencing Dala\u0027s nightlife and a pleasant buzz.", "name": "Village Vibe Beer Station \u0026 Bistro", "transport": "Take a motorbike taxi from Dala Ferry Jetty for about 5 minutes."}, {"address": "Pyidawaye Street, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | Built around a century-old banyan tree, this unique traditional bistro combines the charm of a Burmese tea house with local regional dining. The signature Burmese Mohinga (fish noodle soup) features a rich, thick broth infused with turmeric and banana stem essence, topped with crispy yellow pea fritters. Layered and deeply savory, it is a must-visit spot to taste authentic local riverfront flavors.", "name": "Dala Banyan Tree Tea House \u0026 Bistro", "transport": "Walk about 10 minutes from Dala Ferry Jetty, or take a trishaw for 3 minutes."}, {"address": "Strand Road Waterfront, Dala Township, Yangon", "feature": "\u2b50 4.0 stars | Situated right along the Yangon River, offering close-up views of ferries and fishing boats passing between the shores. The bistro specializes in traditional Burmese curry sets, featuring choices like spiced stewed beef or turmeric stewed chicken, served with fresh vegetables and special shrimp paste (Ngapi). The flavorful, aromatic gravy pairs perfectly with steamed rice, making it a hit with in-depth travelers who love local culture.", "name": "Ferry View Local Bistro", "transport": "Turn left after exiting Dala Ferry Jetty and walk along the riverbank for 3 minutes."}, {"address": "Kyansittha Street, Dala Township, Yangon", "feature": "\u2b50 4.5 stars | Tucked away in lush bamboo structures in Dala, this bistro offers a natural, rustic charm. It specializes in unique Burmese bamboo-roasted meat and herb-steamed fish. The steamed fish is incredibly tender with fresh aromas of bamboo leaves and lime, offering a clean, non-greasy taste. The serene setting away from urban noise attracts many tourists seeking privacy and unique culinary experiences.", "name": "Dala Bamboo Garden Bistro", "transport": "Take a taxi or Tuk-Tuk from Dala Jetty for about 10 minutes."}, {"address": "Riverfront Road, Kamakasit Quarter, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | An open-air riverside bar and local eatery featuring fantastic ambiance with evening lights and cool river breezes. It serves a selection of local beer snacks, such as Deep-Fried Silverfish and Spicy Stir-Fried Clams. The golden, crispy silverfish offer a crunchy, savory, and spicy kick that pairs perfectly with cold beer, making it a popular landmark for soaking in Dala\u0027s night river charm.", "name": "Dala Riverside Beer Garden", "transport": "Walk about 7 minutes from Dala Ferry Jetty."}, {"address": "Merchant Street Corner, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | A cozy water-village style bistro specializing in time-honored traditional Burmese home-cooked dishes and specialty drinks. The must-try Tea Leaf Salad (Laphet Thoke) harmonizes the subtle bitterness and tang of fermented tea leaves with crunchy nuts, creating an astonishingly refreshing starter. Paired with a custom coconut cocktail, it perfectly blends traditional and modern flavors, making it a highlight for food travelers exploring Dala.", "name": "Yangon River Water Village Bistro", "transport": "Take a trishaw from Dala Jetty for about 5 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Near Dala Ferry Pier, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Located near the Dala Ferry Pier, this popular stall specializes in traditional vegetarian Indian snacks. The signature Dosa features a crispy, golden-brown exterior stuffed with spiced mashed potatoes, served alongside a rich custom vegetable curry and coconut chutney for an amazingly layered flavor profile. Piping hot, aromatic, and offering a sweet, sour, and mildly spicy kick, it is a favorite among cross-river commuters and international travelers alike.", "name": "Dala Indian Veg Paratha \u0026 Dosa", "transport": "Take the Yangon River ferry to Dala Pier; it is about a 3-minute walk after exiting the station."}, {"address": "Pagoda Road, near Shwegugyi Pagoda, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Situated near an ancient local pagoda in Dala, this cozy noodle shop offers unique vegan Shan Noodles. Warm, chewy rice noodles are tossed in a savory vegan sauce simmered with crushed peanuts, ripe tomatoes, mushrooms, and special fermented bean paste, delivering a smooth, sweet, tangy, and rich nutty flavor. Served with a side of sweet, clear winter melon and radish broth, it is an excellent choice for experiencing local Buddhist vegetarian culture and traditional flavors.", "name": "Pagoda Road Veg Shan Noodles", "transport": "About an 8-minute ride on a local trishaw from Dala Ferry Pier."}, {"address": "Strand Road, Dala Waterfront, Yangon", "feature": "\u2b50 4.5 stars | Situated along the riverbank, this traditional Burmese tea house features a signature vegan Tea Leaf Salad (Lahpet Thoke). Carefully selected fermented tea leaves are tossed with crunchy fried chickpeas, roasted peanuts, sunflower seeds, sesame seeds, and freshly shredded cabbage, seasoned with fresh lime juice and a dash of green chilies. Sour, spicy, crunchy, and bursting with flavor, it\u0027s an essential Burmese vegan delicacy you shouldn\u0027t miss while relaxing by the waterfront.", "name": "Dala Waterfront Veg Tea House", "transport": "Walk east along the riverfront promenade for about 5 minutes from Dala Ferry Pier."}, {"address": "Market Street, Dala Township, Yangon", "feature": "\u2b50 4.4 stars | A rare dedicated vegetarian restaurant near Dala Market, offering a rich variety of traditional Burmese buffet dishes. The signature veg curries are slow-simmered with fresh papaya, eggplant, okra, and various beans in coconut milk and Burmese spices, resulting in a rich, sweet gravy that pairs perfectly with steaming hot white rice. Prepared without onions or garlic, the meals are fresh and light, highly rated by health-conscious vegetarian travelers.", "name": "Metta Vegetarian Restaurant", "transport": "About a 5-minute motorbike taxi ride from Dala Ferry Pier."}, {"address": "Main Bogyoke Street, Dala Township, Yangon", "feature": "\u2b50 4.1 stars | An authentic evening snack stall specializing in traditional Burmese vegan fritters (Akyaw). The most popular items are the bottle gourd fritters and crispy onion fritters, boasting a golden, crispy shell with a satisfying crunch while keeping the sweet moisture of the vegetables inside. Dipped in a sweet and sour fermented tamarind sauce, they are wonderfully appetizing. Affordable and served piping hot, they make for a perfect walking snack.", "name": "Dala Traditional Veg Akyaw Fry Stall", "transport": "Walk straight along Bogyoke Street for about 7 minutes from Dala Ferry Pier."}, {"address": "Kamakasit Ward, Dala Township, Yangon", "feature": "\u2b50 4.3 stars | Hidden in a quiet neighborhood alley, this small eatery is famous for its rich vegetarian Mohinga (chickpea soup noodle). The broth is meticulously slow-cooked with ground chickpeas, banana stem, and turmeric, served over tender rice vermicelli and topped with crispy fried tofu skin. Dense, creamy, and infused with subtle herbal notes, it easily rivals traditional fish Mohinga, making it a wonderful energy-boosting vegetarian meal for morning or afternoon.", "name": "Jing Xin Veg Chickpea Soup Noodle", "transport": "About a 10-minute trishaw ride from Dala Pier."}, {"address": "Near Dala Central Hospital, Bogyoke Road, Dala Township, Yangon", "feature": "\u2b50 4.0 stars | This cozy spot features a blend of Burmese and Thai vegetarian stir-fries and snacks. Highly recommended are the stir-fried tofu rice noodles and the spicy-sour vegetarian Tom Yum soup, brewed with locally gathered lemongrass, kaffir lime leaves, and fresh mushrooms for an aromatic, savory, and zesty kick. Simple and clean, offering cold drinks and fresh juices, it serves as a great pit stop during your tour of Dala.", "name": "Oasis Vegetarian Snack Bar", "transport": "About a 6-minute ride by minibus or motorbike from Dala Pier."}, {"address": "Riverfront Road, Dala Township, Yangon", "feature": "\u2b50 4.2 stars | Located along the ferry pier bank, this charming small restaurant enjoys sweeping views of the Yangon River. It specializes in traditional Burmese vegetarian stews, such as peanut sauce stewed mushrooms, turmeric braised tofu, and yogurt stewed beans. Smooth, rich, and preserving the authentic essence of local spices, these dishes pair wonderfully with fragrant turmeric rice. The relaxing river view combined with tasty veg cuisine attracts many traveling backpackers.", "name": "Dala Riverfront Veg Curry House", "transport": "Walk west along the riverfront for about 4 minutes after exiting Dala Pier."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near Dala Ferry Port, Dala Township, Yangon", "feature": "\u2b50 4.3 Stars | Located near the Dala Ferry Terminal, this fritter stall is a top snack choice for locals and cross-river commuters alike. Yellow split pea mash is blended with fresh herbs and spices, then deep-fried in hot oil until golden and crispy. Every bite offers a satisfying crunch on the outside while keeping a tender, nutty center. Paired with a signature sweet, sour, and spicy dip, the mouthwatering blend of flavors is intensely appetizing. Tourists love grabbing a hot paper bag right after getting off the ferry to enjoy an authentic slice of everyday Burmese life on the go.", "name": "Dala Jetty Bayia \u0026 Fritter Stall", "transport": "Take the Pansodan Ferry from downtown Yangon to Dala Jetty, then walk for about 1 minute."}, {"address": "Central Market Road, Dala Township, Yangon", "feature": "\u2b50 4.5 Stars | As the most popular rice-based snack stall inside Dala Central Market, the made-to-order \u0027Couple Cakes\u0027 (Mont Lin Maya) are a must-try classic street treat. Rice batter is poured into round cast-iron molds, topped with quail eggs and chickpeas, and then pressed together into a single sphere. Fresh out of the pan, the crispy golden crust yields to a rich rice aroma and smooth, velvety egg yolk. Perfectly balanced between sweet and savory with wonderful textural layers, it\u0027s a crowd favorite for market visitors.", "name": "Dala Central Market Mont Lin Maya", "transport": "Take a trishaw from Dala Ferry Jetty for about 5 minutes to reach Dala Central Market."}, {"address": "Port Road, near Dala Jetty, Dala Township, Yangon", "feature": "\u2b50 4.4 Stars | Located just steps from the ferry exit, this open-air food stall specializes in Mohinga, Myanmar\u0027s iconic national dish. The broth is slow-simmered with fresh catfish, banana stem, generous ginger, and lemongrass, delivering a rich, savory seafood flavor with a peppery kick. Served over smooth rice vermicelli and topped with freshly fried crispy fritters, the delightful contrast of textures keeps you coming back for more. Packed morning and night with commuters and food lovers, its incredible value and authentic flavor earn top reviews.", "name": "Dala Ferry Terminal Mohinga", "transport": "Exit Dala Ferry Terminal, turn right, and walk for about 2 minutes."}, {"address": "Strand Road, Dala Township, Yangon", "feature": "\u2b50 4.2 Stars | Situated along the riverbank, this Samosa Thoke stall perfectly showcases Myanmar\u0027s unique savory salad culture. The vendor snips freshly fried samosas into bite-sized pieces with scissors, tossing them with shredded cabbage, sliced onions, green chilies, a rich chickpea curry broth, and a splash of fresh lime juice. Each bite delivers crispy pastry skin soaked in tangy, spicy broth\u2014refreshing, flavorful, and distinctly local, making it a popular afternoon walk-and-eat snack.", "name": "Dala Waterfront Samosa Thoke", "transport": "Walk along Strand Road from Dala Ferry Jetty for about 4 minutes."}, {"address": "Inside Dala Main Market, Dala Township, Yangon", "feature": "\u2b50 4.1 Stars | Tucked in a corner of Dala Market, this traditional pastry stall serves auspicious glutinous rice dumplings known as Mont Lone Yay May. Featuring a chewy, bouncy outer skin stuffed with rich jaggery (palm sugar) and rolled in freshly grated sweet coconut flakes, these treats offer a sweet surprise in every bite. As you bite down, molten palm sugar bursts out, creating a harmonious balance with the chewy rice skin and refreshing coconut. A nostalgic sweet street food you shouldn\u0027t miss when exploring the market.", "name": "Dala Market Mont Lone Yay May", "transport": "Take a motorbike taxi for about 3 minutes from Dala Ferry Jetty into the market."}, {"address": "Riverfront Road, Dala Township, Yangon", "feature": "\u2b50 4.0 Stars | An iconic evening street food spot on the Dala waterfront, this stall features a large pot simmering with skewers of pork offal and meat braised in spiced sauce. Diners gather around low stools to pick their favorite skewers. The meat is tender, flavorful, and juicy, served with a fiery homemade garlic-chili dip for a punch of savory goodness. Bills are settled by counting the remaining bamboo sticks at the end\u2014an interactive and authentic local dining experience favored by adventurous travelers.", "name": "Dala Riverbank Wat Ah Loo Meat Skewers", "transport": "Walk about 5 minutes from Dala Ferry Jetty to reach the waterfront evening food stall area."}, {"address": "Market Street, Dala Township, Yangon", "feature": "\u2b50 4.6 Stars | Situated on the edge of Dala Market, this small stall specializes in authentic Burmese Pickled Tea Leaf Salad (Laphet Thoke). Made with tender fermented tea leaves tossed with fried peanuts, yellow split peas, crispy garlic chips, sliced tomatoes, and shredded cabbage, it is dressed with savory fish sauce and lime juice. The result is a vibrant blend of salty, sour, bitter, and spicy notes mixed with crunchy nuttiness, leaving a lingering tea aroma. It is a delightfully complex and famous healthy street food in Myanmar.", "name": "Dala Market Laphet Thoke", "transport": "Take a trishaw from Dala Ferry Jetty for about 4 minutes."}, {"address": "Jetty Front Approach, Dala Township, Yangon", "feature": "\u2b50 4.3 Stars | A refreshing lifesaver along the tropical Dala riverbank, this dessert stall serves freshly made coconut milk sago and Burmese-style Falooda iced desserts. Packed with silky coconut jelly, chewy sago pearls, handmade jelly, and rich coconut milk, it is wonderfully cold, sweet, and satisfying without being overly heavy. The subtle sweetness combined with rich coconut flavor and fun textures makes it the perfect cooling treat before or after a ferry ride.", "name": "Dala Jetty Coconut Sweets \u0026 Ice Stall", "transport": "Located right next to the Dala Ferry Terminal waiting area, easily reachable on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dala Riverside Water Town District"}, "downtown_sule": {"categories": {"cat_1": {"items": [{"address": "130b 34th St, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 Stars | A decades-old staple near Sule Pagoda. The signature Shan Noodle Dry features silky, springy rice noodles tossed in a rich savory tomato-minced meat sauce and ground crushed peanuts. Balanced with sweet, sour, and savory notes, it offers an irresistible aroma. Served alongside a sweet, clear pork bone radish soup and complimentary pickled mustard greens, the meal is rich in flavors without being greasy. A top choice for both first-time visitors and locals enjoying their daily lunch.", "name": "999 Shan Noodle House", "transport": "About a 3-minute walk from Sule Pagoda to the entrance of 34th Street."}, {"address": "Ground Floor, 77-79 Pansodan St, Lower Block, Yangon", "feature": "\u2b50 4.6 Stars | An exquisite restaurant that blends traditional Burmese tea house culture with modern colonial elegance. Their signature Mohinga features a broth slow-simmered with fresh catfish and lemongrass, offering a rich, savory taste with a hint of peppery spice. Smooth rice noodles soak up the broth, complemented by crispy yellow split pea fritters and boiled eggs for a delightful texture. The Burmese milk tea (Laphet Yay) can be customized by sweetness and strength\u2014its perfect ratio of tea aroma to condensed milk attracts foodies from all over the world.", "name": "Rangoon Tea House", "transport": "Walk along Anawrahta Rd from Sule Pagoda, turn right onto Pansodan St, about a 7-minute walk."}, {"address": "216 Anawrahta Rd, Between 31st and 32nd St, Yangon", "feature": "\u2b50 4.2 Stars | Founded in 1955, this 70-year-old historic eatery specializes in traditional Burmese-style Biryani (Danbauk). The signature Chicken Biryani is steamed with long-grain basmati rice, Indian spice mixes, and ghee, yielding fragrant, distinct grains infused with turmeric and cloves. The large chicken leg is slow-cooked until fall-apart tender and juicy. Paired with sweet-and-sour pickled mangoes and crisp cucumbers, it\u2019s refreshing and appetizing\u2014a timeless classic adored by both locals and tourists.", "name": "Nilar Biryani \u0026 Cold Drink", "transport": "Located on Anawrahta Road, just about a 4-minute walk from Sule Pagoda."}, {"address": "Corner of Anawrahta Rd and Bo Sun Pat St, Pabedan Township, Yangon", "feature": "\u2b50 4.4 Stars | Highly recommended by locals, this authentic Shan noodle house is renowned for its rich and traditional flavors. The signature Sticky Shan Noodles are made from high-quality rice flour, offering a chewy, delightful texture. Smothered in savory chicken or pork curry sauce and topped with toasted sesame seeds and crispy fried garlic, every bite bursts with rich aromas. Served with complimentary homemade pickled vegetables and crispy pork cracklings for an indispensable crunch.", "name": "Aung Mingalar Shan Noodle", "transport": "Walk west along Anawrahta Rd from Sule Pagoda for about 8 minutes."}, {"address": "No. 175/177, 29th Street (Middle Block), Pabedan Township, Yangon", "feature": "\u2b50 4.3 Stars | For an authentic taste of home-cooked Burmese curry, this legendary spot is a top pick in downtown. The signature mutton and prawn curries are prepared using traditional slow-cooking methods, rendering the meat incredibly tender while infusing it with sweet, aromatic flavors of onions, ginger, garlic, and spices. Ordering a main dish comes with a lavish spread of fresh raw herbs, fermented shrimp paste dip (Ngapi), and various vegetable side dishes, offering a complete cultural dining experience.", "name": "Danuphyu Daw Saw Kalama Burmese Restaurant", "transport": "A 6-minute walk from Sule Pagoda into 29th Street."}, {"address": "Anawrahta Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 Stars | A famous Mohinga shop originating from Myaungmya in the Ayeyarwady Delta. Renowned for its rich broth devoid of any fishy taste, it is slow-cooked with fresh fish meat and banana stem, creating a velvety texture that coats the soft rice noodles smoothly. The accompanying crispy fritters (Akyaw) absorb the fragrant soup, providing a delightful crunchy and juicy bite. Add a squeeze of lime juice and chili powder for a savory, tangy, and spicy bowl you can\u0027t stop eating.", "name": "Myaungmya Daw Cho Mohinga", "transport": "Located on Anawrahta Rd in downtown, about a 5-minute walk from Sule Pagoda."}, {"address": "49th St / Pansodan St Area, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 Stars | One of Yangon\u0027s most iconic traditional tea house chains, with the Pansodan branch exuding a vibrant downtown neighborhood vibe. A must-try is the Samosa Salad (Samusa Thoke), featuring freshly fried vegetable samosas cut into bite-sized pieces and tossed with shredded cabbage, onions, chickpea broth, and cilantro\u2014offering a wonderful contrast between crispiness and rich savory soup. Paired with a freshly pulled cup of hot milk tea, it\u2019s a classic spot to experience traditional Burmese morning tea culture.", "name": "Lucky Seven Tea House - Pansodan Branch", "transport": "About a 3-minute taxi ride or a 10-minute walk from Sule Pagoda."}, {"address": "Anawrahta Road, Near Sule Pagoda, Yangon", "feature": "\u2b50 4.4 Stars | A celebrated restaurant known for serving high-quality, hygienic, and traditional Burmese ethnic cuisine. The signature Coconut Chicken Noodles (Ohn No Khao Sw\u00e8) features a broth simmered from rich coconut milk and chicken stock\u2014creamy, smooth, yet light. The noodles absorb the savory coconut gravy for a chewy texture, complemented by crispy fried noodle toppings and shallots for a blend of sweet and savory notes. The rustic decor makes it perfect for diners wanting authentic local fare in a comfortable setting.", "name": "Khaing Khaing Kyi Burmese Restaurant", "transport": "Located along Anawrahta Road near Sule Pagoda, about a 4-minute walk."}], "name": "Local Traditional Eateries"}, "cat_2": {"items": [{"address": "01-03 Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.6 Stars | Combining classic Burmese tea house culture with modern British vintage flair, this is the top brunch choice for tourists and local trendsetters. The signature Rangoon Milk Tea offers customizable sweetness and richness, paired perfectly with traditional Burmese \u0027Paratha\u0027\u2014crispy on the outside, soft on the inside\u2014served with a fragrant curry dip. The high-ceilinged colonial space boasts an elegant, artistic atmosphere.", "name": "Rangoon Tea House", "transport": "About an 8-minute walk from Sule Pagoda, head straight south along Pansodan Street."}, {"address": "31-A Bo Aung Kyaw Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 Stars | Hidden within a historical building in the Old Town, this refined pour-over cafe features an industrial vibe with lush greenery, creating a quiet and cozy sanctuary. They carefully select high-altitude Arabica beans locally grown in Myanmar, yielding pour-over coffee with bright citrus acidity and delicate floral notes. Their freshly made avocado poached egg toast, with its crispy crust and smooth, rich filling, is highly praised by lifestyle enthusiasts.", "name": "The Press Office Cafe", "transport": "About a 10-minute walk from Sule Pagoda, located near Holy Trinity Cathedral."}, {"address": "644 Merchant Street, Pabedan Township, Yangon", "feature": "\u2b50 4.4 Stars | Located on the second floor of a century-old colonial building, this spot exudes nostalgic luxury with high red-brick walls and classic shuttered windows. Serving premium Burmese coffee and innovative brunch dishes, their elevated take on classic Mohinga (Burmese fish noodle soup) features a rich, savory broth, delicate fish meat, and crispy split pea fritters for a wonderful texture. It\u0027s an excellent place to experience traditional flavors fused with modern coffee culture.", "name": "Burma Bistro", "transport": "About a 5-minute walk from Sule Pagoda, located at the intersection of Merchant Street and Shwe Bon Tha Street."}, {"address": "No. 1 Carter Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 Stars | A famous local sustainable coffee brand in Myanmar, focused on promoting organic high-altitude specialty beans from Shan State. The coffee is smooth and well-rounded, with rich notes of dark chocolate and nutty undertones. Brunch features various freshly toasted paninis and waffles with crispy exteriors and soft centers. Committed to supporting ethnic minority farmers, this brand combines high quality with social enterprise impact, winning high praise from international travelers.", "name": "Genius Coffee", "transport": "About a 7-minute walk from Sule Pagoda, close to Pansodan Street."}, {"address": "92 Strand Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 Stars | Situated inside the century-old, five-star heritage hotel, The Strand Hotel, showcasing ultimate British colonial luxury. Famous for its brunch and high tea, the delicate pastry spread includes freshly baked scones and flavorful quiches. The scones\u2014crispy outside and flaky inside\u2014pair exquisitely with rich clotted cream. Accompanied by premium Burmese coffee or freshly brewed fine tea, it offers an exclusive and relaxing morning experience.", "name": "The Strand Cafe", "transport": "About a 5-minute taxi ride from Sule Pagoda, or walk south along Pansodan Street to Strand Road."}, {"address": "Corner of Pansodan Street \u0026 Merchant Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 Stars | Focusing on local organic ingredients and artisanal homemade cheeses, this is a renowned high-quality deli cafe in Yangon. For brunch, the artisanal European bread with a homemade cheese platter is highly recommended\u2014rich, flavorful cheese paired with hearty, chewy bread, alongside top-tier espresso. The bright, spacious setting makes it ideal for foodies who love natural and healthy gourmet food.", "name": "Sharky\u0027s Deli \u0026 Cafe - Pansodan", "transport": "About a 6-minute walk from Sule Pagoda, located at the corner of Pansodan Street and Merchant Road."}, {"address": "Bogyoke Aung San Road, Pabedan Township, Yangon", "feature": "\u2b50 4.2 Stars | Featuring a minimalist and bright modern Korean style, this cafe is popular among youth and digital nomads. It offers exquisite cold brew coffee, specialty lattes, and fresh brunch options. Fluffy pancake stacks topped with fresh fruit and whipped cream deliver a delightful, perfectly balanced sweetness. The quiet and cozy environment makes it an ideal spot to unwind after exploring Old Town.", "name": "Easy Cafe - Downtown", "transport": "About a 6-minute walk from Sule Pagoda, located near Bogyoke Market."}, {"address": "No. 227 Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.1 Stars | A cozy, charming neighborhood cafe on an Old Town street corner, serving affordable yet high-quality artisanal coffee and local light bites. Their special Burmese-style coconut milk black coffee is smooth with tropical aromas, paired perfectly with fresh banana pancakes or savory cheese omelets. The friendly owner makes this a hidden gem for immersing in the local vibe of Yangon\u0027s Old Town.", "name": "Caf\u00e9 Salween", "transport": "About an 8-minute walk from Sule Pagoda."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "142-144 Pansodan St, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 stars | Located in a century-old colonial building in the Old Town, this top-tier Burmese bistro seamlessly merges traditional tea house culture with modern mixology. The signature Mohinga features a rich, flavorful broth infused with the herbal aromas of banana stem and lemongrass, served with crispy fried dough sticks that make it addictively delicious. Additionally, it offers dozens of custom milk-to-tea ratio variations of traditional Burmese milk tea alongside creative cocktails infused with local herbs. Successfully elevating street food to elevated fine dining, it is a favorite among tourists and local trendsetters.", "name": "Rangoon Tea House", "transport": "About a 5-minute walk from Sule Pagoda to Pansodan Street."}, {"address": "130b 34th St, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 stars | A highly popular local noodle house near Sule Pagoda, boasting a long history and a beloved fanbase among foodies. The signature dry Shan noodles feature silky, chewy rice noodles tossed with house-made peanut sauce, rich tomato meat sauce, and crispy fried garlic. Slightly sweet, mildly spicy, and deeply layered, every bite is pure satisfaction. The complimentary pickled mustard soup provides a refreshing, palate-cleansing contrast, and pairing it with a plate of crisp fried tofu makes for a perfect meal. Clean, cozy, and serving up prompt, friendly service, it\u2019s an essential stop for authentic local flavors in Yangon\u0027s Old Town.", "name": "999 Shan Noodle House", "transport": "Located on 34th Street east of Sule Pagoda, about a 3-minute walk from the pagoda."}, {"address": "60 Pansodan St, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 stars | Housed within the historic 1900s Sofaer Building, this bistro beautifully preserves original patterned tile floors and high-ceiling brick walls, exuding a nostalgic colonial vibe. Specializing in Southeast Asian regional dishes crafted with local Burmese ingredients, a must-try is the Burmese Tea Leaf Salad (Lahpet Thoke)\u2014the fermented tea leaves offer a pleasantly bitter, tangy aroma balanced by crunchy nuts, peanuts, and garlic chips for a multi-textured sensation. In the evening, dim flickering lights and bespoke tropical fruit cocktails make it the ultimate spot to experience the old soul and contemporary culinary scene of Yangon\u0027s Old Town.", "name": "Sofaer \u0026 Co.", "transport": "Located near the intersection of Pansodan St and Merchant St, about a 6-minute walk from Sule Pagoda."}, {"address": "100 Bogalay Zay St, Botahtaung Township, Yangon", "feature": "\u2b50 4.4 stars | A unique venue combining an art gallery with traditional Burmese dining, adorned with vintage local photos and contemporary paintings. The restaurant highlights regional dishes from Myanmar\u2019s various ethnic groups, such as spicy Ayeyarwady seafood dishes from the south and turmeric rice from Shan State. The Burmese pork curry is tender, rich, and flavorful without feeling overly greasy, served alongside fresh vegetable platters and a signature fish paste dip\u2014allowing diners to savor authentic homestyle Burmese cuisine in an artistic atmosphere.", "name": "Pansuriya", "transport": "About a 10-minute walk east along Merchant St from Sule Pagoda, or a 3-minute taxi ride."}, {"address": "535 Merchant St, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | Also located inside the historic Sofaer Building, Gekko is a stylish bistro that thoughtfully fuses a Japanese yakitori bar with local Burmese accents. Featuring antique wooden decor and high vaulted arches, it serves top-tier charcoal-grilled yakitori, sashimi, and signature cocktails infused with native spices (such as local Myanmar gin concoctions). Juicy grilled skewers slicked in savory sauce paired with a chilled craft beer or cocktail offer a distinctive nightlife experience wrapped in rich history.", "name": "Gekko Co. \u0026 Bar", "transport": "Located on Merchant St, about a 6-minute walk from Sule Pagoda."}, {"address": "175 29th St, Pabedan Township, Yangon", "feature": "\u2b50 4.1 stars | For an authentic taste of traditional Burmese cuisine, this long-standing institution is an absolute must. Operating on a classic Burmese curry counter style, ordering a main dish comes with a generous fresh vegetable platter, specialty fish paste dip, and soup of the day. The signature mutton curry and mutton biryani (Danbauk) are aromatic and tender, with rich clarified butter and spices fully infusing the rice. Though the setting is humble, the rich local flavors offer guests a true dive into everyday Burmese food culture.", "name": "Danuphyu Daw Saw Kalama", "transport": "Located on 29th St, about a 7-minute walk west from Sule Pagoda."}, {"address": "42 Pansodan St, Kyauktada Township, Yangon", "feature": "\u2b50 4.2 stars | Located in the financial and historical core of Old Town, Union Bar \u0026 Grill is a modern bistro favored by local expats and business executives. The interior is sleek and contemporary with classic British pub accents. The cuisine blends global dishes with premium local ingredients, such as gourmet burgers made with highland beef from Northern Myanmar, pan-seared local seafood, and delicate tapas. Home to one of the most professional mixology teams in Yangon, its artisanal cocktails and extensive wine list make it a trendy nightlife hub in the downtown district.", "name": "Union Bar \u0026 Grill", "transport": "Located on Pansodan St near Strand Rd, about an 8-minute walk from Sule Pagoda."}, {"address": "92 Strand Rd, Kyauktada Township, Yangon", "feature": "\u2b50 4.6 stars | Situated inside the legendary century-old Strand Hotel, this is one of Yangon\u2019s most historically iconic upscale bars and bistros. Operating since 1901, it has hosted famous historical figures like Rudyard Kipling and W. Somerset Maugham. The bar features a rich teakwood bar counter, leather sofas, and vintage ceiling fans. The signature \u0027Strand Sling\u0027 cocktail mixes local tropical fruits with gin for a refreshing, sweet finish. Paired with refined regional snacks and English afternoon tea treats, it transports guests back to the golden glamour of a bygone era.", "name": "The Strand Bar", "transport": "Located along Strand Road by the Yangon River, about a 9-minute walk from Sule Pagoda."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "29th Street, Middle Block, Pabedan Township, Yangon", "feature": "\u2b50 4.3 stars | A classic Indian pure vegetarian restaurant located near Sule Pagoda, famous for its crispy Dosa and hearty South Indian Thali. The hot, crispy rice-and-lentil crepe paired with warm, aromatic curry sauces and coconut chutney is crisp on the outside, soft on the inside, and rich in tangy, spicy layers. Loved by both local Indian residents and foreign tourists, it offers an affordable, fragrant, and authentic plant-based dining experience.", "name": "San Thi Vegetarian Restaurant", "transport": "About a 5-minute walk from Sule Pagoda."}, {"address": "No. 238, 29th Street, Pabedan Township, Yangon", "feature": "\u2b50 4.4 stars | Tucked away in the alleys of the Old Town, this long-standing vegetarian spot wins diners over with its aromatic Samosas and buttery Naan. The golden-brown samosas boast a crispy crust filled with creamy, spiced potatoes and peas that crunch delightfully with every bite. Serving rich, meat-free Indian platter meals, it\u2019s a must-visit destination to explore Yangon Old Town\u2019s vegetarian culture.", "name": "Ingyin Kalay Pure Vegetarian Indian Restaurant", "transport": "Take a taxi to the intersection of 29th Street and Anawrahta Road, then walk for about 2 minutes."}, {"address": "Anawrahta Road, Middle Block, Pabedan Township, Yangon", "feature": "\u2b50 4.2 stars | Specializing in authentic North and South Indian vegetarian cuisine, this highly-rated eatery is best known for its paper-thin giant Paper Dosa and rich, flavorful Paneer Tikka. The dosa is exceptionally crispy with a subtle hint of fermented rice aroma, paired with custom vegetable soup for a smooth, comforting taste\u2014a top recommendation among plant-based food lovers in the commercial district.", "name": "Kalyana Indian Vegetarian Restaurant", "transport": "Walk west along Anawrahta Road from Sule Pagoda for about 6 minutes."}, {"address": "26th Street Market, Pabedan Township, Yangon", "feature": "\u2b50 4.5 stars | A hidden gem food stall located inside the bustling traditional market of downtown, specializing in traditional Shan Vegetarian Tofu Noodles. The silky, vibrant yellow tofu broth\u2014freshly cooked from soy and chickpea milk\u2014is poured over handmade rice noodles and topped with pickled vegetables and cilantro. Balancing sweet, sour, savory, and spicy flavors, it is an essential street food experience in Yangon.", "name": "26th Street Shan Vegetarian Stall", "transport": "Walk about 7 minutes from Maha Bandula Park into the 26th Street traditional market."}, {"address": "29th Street, Lower Block, Pabedan Township, Yangon", "feature": "\u2b50 4.1 stars | A cozy, homey Indian vegetarian eatery highlighting made-to-order vegetable curries and freshly baked whole wheat Roti. The house vegetable masala curry is stewed to tender perfection, perfect for dipping with chewy, nutty flatbreads. Soaking up the rich, wholesome sauce, every bite is delightfully complex yet light\u2014an affordable Old Town favorite drawing many backpackers.", "name": "Subhash Pure Vegetarian Restaurant", "transport": "Walk along Maha Bandula Road from Sule Pagoda for about 4 minutes, then turn onto 29th Street."}, {"address": "Bo Aung Kyaw Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.2 stars | Combining Burmese-Chinese flavors with traditional Chinese cooking, this classic restaurant is renowned for its delicate mock-meat dishes and refreshing Burmese Tea Leaf Salad (Lahpet Thoke). The vegetarian tea leaf salad offers an incredibly rich texture, tossing crispy fried beans and fermented tea leaves with tangy lime juice and chili for a crunchy, sour-spicy appetizer full of local flavor.", "name": "Evergreen Vegetarian Restaurant", "transport": "Walk east from Sule Pagoda for about 8 minutes, near Merchant Road."}, {"address": "No. 12, Bogabyo Street, Botataung Township, Yangon", "feature": "\u2b50 4.6 stars | A sleek, modern plant-based (vegan) health restaurant located on the edge of Old Town, offering plant-based burgers, fresh veggie power bowls, and dairy-free smoothies. The vegan black bean quinoa burger is hearty and juicy, served with egg-free mayo and fresh avocado for a light, satisfying meal that attracts health-conscious travelers and local youth alike.", "name": "Nourish Cafe Yangon", "transport": "Take a 5-minute taxi ride from Sule Pagoda, or walk east along Merchant Road for about 12 minutes."}, {"address": "Maha Bandula Road, Kyauktada Township, Yangon", "feature": "\u2b50 4.3 stars | A warm restaurant blending local Burmese vegetarian cuisine with Indian flavors. Highlights include the Burmese vegetarian sour lentil soup and crispy vegetable fritters (Akyaw). Golden and crunchy on the outside with juicy fillings inside, the fritters are paired with a special tangy tamarind sauce\u2014offering crisp, non-greasy, flavorful layers ideal for tasting authentic street-style vegetarian food in Yangon\u0027s Old Town.", "name": "Yangon Veggie Delights", "transport": "Located on Maha Bandula Road, just a 3-minute walk from Sule Pagoda."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Strand Rd, Kyauktada Township, Yangon", "feature": "\u2b50 4.2 stars | Located along the riverbank in downtown Yangon, this is the liveliest night food hub, packed with stalls offering fried snacks, steaming Mohinga (fish noodle soup), and skewers. Biting into a fresh crispy samosa reveals a rich, flavorful filling; paired with a special hot-and-sour dipping sauce, it\u0027s incredibly appetizing. It\u0027s the best place to experience local nightlife and taste diverse, everyday street food.", "name": "Strand Road Night Market", "transport": "About a 10-minute walk from Sule Pagoda along Strand Road."}, {"address": "Pansodan Street, Kyauktada Township, Yangon", "feature": "\u2b50 4.4 stars | \u0027Mont Lin Maya\u0027 translates to \u0027Couple Snack\u0027 in Burmese. This traditional street treat is made by frying rice batter in small round molds with a fresh quail egg and chickpeas nestled in the center. Golden and crispy on the outside, soft on the inside with a warm, nutty egg flavor, it\u0027s rich in texture and a favorite afternoon snack among locals.", "name": "Mont Lin Maya Pansodan Stall", "transport": "Walk west along Anawrahta Rd from Sule Pagoda for about 5 minutes, then turn onto Pansodan St."}, {"address": "Maha Bandula Park St, Kyauktada Township, Yangon", "feature": "\u2b50 4.5 stars | Freshly fried golden samosas are chopped into small pieces and combined with shredded cabbage, onions, chickpea broth, and cilantro, then tossed with special lime juice and chili sauce. Every bite offers a perfect contrast of crunchy pastry and rich, spicy broth. Its complex sour and spicy flavor profile makes it immensely refreshing\u2014a must-try savory dish for park visitors.", "name": "Maha Bandula Park Samosa Salad Stall", "transport": "Located right next to the east exit of Maha Bandula Park, a 2-minute walk from Sule Pagoda."}, {"address": "26th Street, Pabedan Township, Yangon", "feature": "\u2b50 4.3 stars | Home to numerous popular food stalls, this market\u0027s highlight is definitely the Shan Dry Noodles. Silky rice noodles are tossed with a fragrant tomato-meat sauce, cilantro, and crushed peanuts, delivering a rich, smooth texture and irresistible aroma. Pair them with golden fried gourd fritters or shrimp crackers from adjacent stalls for a delightfully authentic, budget-friendly meal.", "name": "26th Street Shan Noodles \u0026 Fried Snacks Market", "transport": "Walk west along Maha Bandula Rd from Sule Pagoda for about 5 minutes to reach 26th Street."}, {"address": "Sule Pagoda Rd, Kyauktada Township, Yangon", "feature": "\u2b50 4.1 stars | Traditional Burmese fried dough (Ekyaw Kway) is thicker and fluffier than typical dough sticks, featuring a golden crispy crust and a chewy interior. Locals enjoy dunking it into rich, sweet hot Burmese milk tea. The combination of crispy dough soaking up aromatic sweet tea creates a delightful sweet-and-savory breakfast bite that attracts countless tourists.", "name": "Sule Pagoda Road Ekyaw Kway \u0026 Tea Stall", "transport": "Located along the street opposite the main entrance of Sule Pagoda; a 1-minute walk."}, {"address": "19th Street, Latha Township, Yangon", "feature": "\u2b50 4.6 stars | Downtown Yangon\u0027s famous barbecue street features stalls overflowing with fresh fish, skewers, vegetables, and seafood. Everything is charcoal-grilled to order and brushed with a signature spicy sauce. The grilled fish boasts a crispy skin and juicy flesh, while meat skewers carry a deep smoky flavor. Paired with an ice-cold Myanmar Beer, it\u0027s a nightlife magnet for backpackers worldwide.", "name": "19th Street Chinatown Barbecue Stalls", "transport": "Walk west along Maha Bandula Rd from Sule Pagoda for about 12 minutes, or take a 3-minute taxi ride."}, {"address": "Shwe Bon Tha St, Pabedan Township, Yangon", "feature": "\u2b50 4.3 stars | A classic street food showcasing Yangon\u0027s multicultural heritage. Vendors spread fermented rice batter onto large flat griddles to cook paper-thin, golden South Indian dosas. Piping hot and crisp, filled with spiced mashed potatoes and served with coconut chutney or lentil soup, this savory snack is as fun to watch as it is delicious to eat.", "name": "Shwe Bon Tha Street Dosa Stall", "transport": "Walk west along Maha Bandula Rd from Sule Pagoda to Shwe Bon Tha St, turn left, and walk for 3 minutes."}, {"address": "Sule Pagoda Rd, Kyauktada Township, Yangon", "feature": "\u2b50 4.2 stars | The ultimate colorful cure for Yangon\u0027s hot weather! Falooda combines rose syrup, milk, sago pearls, thin vermicelli, rose pudding, and a scoop of rich ice cream. Sweet and aromatic, the blend of ingredients provides a lively mix of chewy, silky, and icy textures. Its dreamy pink hue and refreshing sweetness make it a hit with both tourists and local youth.", "name": "Sule Pagoda Road Falooda \u0026 Ice Desserts Stall", "transport": "Located on the sidewalk next to Sule Pagoda roundabout, about a 2-minute walk from Sule Pagoda."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Downtown Old Town and Sule Pagoda Area"}, "inya_kamayut": {"categories": {"cat_1": {"items": [{"address": "Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Min Lan is an iconic restaurant in Yangon representing Rakhine State flavors, famous for its fiery Rakhine Mohinga and fresh seafood dishes. Distinct from the sweet and thick traditional Yangon style, their fish noodle soup is brewed with generous amounts of black pepper, fresh fish, and a sour and spicy broth. The soup is rich, flavorful, and packs a strong spicy kick. Served with crisp fried bean fritters and fresh coriander, it is appetizing and multi-layered in texture, highly favored by locals who love bold flavors as well as foreign tourists.", "name": "Min Lan Rakhine Seafood \u0026 Mohinga - Inya Road", "transport": "Take a taxi to Inya Road near the west side of Yangon University; it is a short walk after getting off."}, {"address": "Nar Nat Taw Street, Kamayut Township, Yangon", "feature": "\u2b50 4.2 stars | Win Star Tea House is a well-established teahouse near the Hledan commercial area, deeply loved by local students and residents. The shop serves authentic Myanmar tea (Laphet Yay), smooth and rich on the palate with a perfect blend of tea aroma and condensed milk sweetness. Besides milk tea, their samosas and Burmese dry noodles (Nan Gyi Thoke) are must-try signature items. The thick round noodles are springy, tossed in rich chicken curry sauce and crushed peanuts, offering a hearty, chewy texture that is addictively delicious.", "name": "Win Star Tea House - Kamayut", "transport": "About an 8-minute walk from Hledan Railway Station or Hledan Junction."}, {"address": "Mayangone Township, Near Inya Lake, Yangon", "feature": "\u2b50 4.5 stars | Located just north of Inya Lake, Taing Yin Thar is a highly rated restaurant showcasing traditional cuisine from Myanmar\u0027s ethnic minorities. The restaurant insists on traditional cooking methods and natural spices. Popular dishes include Kachin bamboo-grilled chicken, Shan leaf-wrapped fish, and Red Shan herb salad. The bamboo chicken is tender with a subtle bamboo aroma and sweet juices, while the herb salad is tangy, crisp, and delightfully complex in texture. Elegant traditional bamboo decor and authentic ethnic flavors make this a premier choice for experiencing Myanmar\u0027s diverse food culture.", "name": "Taing Yin Thar Heritage Cuisine", "transport": "Take a taxi along Kabar Aye Pagoda Road toward the north end of Inya Lake to reach the restaurant."}, {"address": "Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | Located in the heart of the Hledan commercial area, Koe Sin Thae is a renowned old-time Shan noodle shop in Yangon. Its signature \u0027Shan Noodle Dry\u0027 features tender rice noodles tossed in a slow-cooked marinated chicken or pork sauce, topped with crushed fried peanuts and pickled greens. Smooth and silky with a subtle sweet-and-sour depth, it comes with a bowl of clear, sweet broth to enhance the taste. Extremely affordable and authentically delicious, it is a favorite among Yangon University students and local office workers.", "name": "Koe Sin Thae Shan Noodle - Hledan", "transport": "Take a bus or taxi to Hledan Center and walk for about 3 minutes."}, {"address": "Pyay Road, Kamayut Township, Yangon", "feature": "\u2b50 4.1 stars | Pwe Taw Win is a fantastic place to experience traditional Myanmar curry and feast-style dining. Dozens of freshly made Burmese stews, curry prawns, and chili pastes are displayed daily. Once guests choose a main dish, the restaurant automatically serves a full spread of free side dishes, fresh raw vegetable platters, and clear soup. The braised beef is tender and flavorful, rich with the sweet aroma of turmeric and onions. The fresh vegetables paired with special fermented shrimp paste (Ngapi) create a savory, spicy, and richly layered taste, showcasing a classic traditional Myanmar family feast.", "name": "Pwe Taw Win Traditional Myanmar Cuisine", "transport": "Take a taxi along Pyay Road to the location diagonally opposite Yangon University."}, {"address": "Near Inya Lake, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | Feel is Myanmar\u0027s most famous traditional culinary brand, and its branch near Inya Lake offers a cozy and comfortable environment. Here, you can try authentic Tea Leaf Salad (Lahpet Thoke), made with fermented tea leaves mixed with crispy fried yellow split peas, broad beans, sesame seeds, garlic chips, and chopped tomatoes. Well-tossed, every bite combines the aroma of fermented tea, crunchy beans, and a subtle balance of tartness and spiciness. Whether as an appetizer or an afternoon snack, it is hugely popular among both tourists and locals.", "name": "Feel Restaurant - Inya Branch", "transport": "Take a taxi to the western area of Inya Lake, near Pyay Road."}, {"address": "Hledan 1st Street, Kamayut Township, Yangon", "feature": "\u2b50 4.2 stars | Tucked away in the alleys of Hledan, this small spot specializing in Inle Lake flavors from Shan State has built a great reputation with its authentic Shan Fish Rice (Nga Htamin). The dish combines turmeric-steamed rice kneaded with savory steamed fish, shredded ginger, and garlic oil into rice balls, topped with crispy fried garlic and fried chilies. It has a soft, savory flavor infused with rich garlic oil and fresh fish sweetness. Light, non-greasy, and distinctly regional, it\u0027s a classic traditional deliciousness you shouldn\u0027t miss when visiting Hledan.", "name": "Inle Shan Traditional Food - Hledan", "transport": "Get off near Hledan Overpass and walk about 5 minutes into 1st Street."}, {"address": "University Avenue Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | This time-honored traditional Mohinga stall in Kamayut Township specializes in Myanmar\u0027s national dish, Mohinga. The broth is slow-cooked for hours with plenty of banana stem, fresh fish bones, and turmeric, yielding a thick, sweet, savory, and non-fishy soup. Served with soft, fine rice vermicelli, crispy fried gourd fritters (Akyaw), and boiled eggs, the fritters soak up the rich broth, offering a crispy exterior and soft interior with savory juices. Locals love grabbing a bowl in the morning to savor the purest traditional morning flavor of Yangon.", "name": "Ah Lone Mohinga - Kamayut", "transport": "Take a taxi to near the intersection of University Avenue Road and Pyay Road."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 31A, Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.5 Stars | Located near Inya Lake, this boutique cafe is renowned for its high-quality single-origin pour-overs and exquisite English-style brunch. Their signature poached egg and avocado toast offers a rich texture\u2014creamy, rich yolk blends seamlessly with flavorful mashed avocado on crispy sourdough. Paired with locally sourced Myanmar highland coffee beans meticulously roasted by the owner, each sip reveals a unique citrus aroma with a nutty finish. It is a favorite morning gathering spot for local expats and trendy university students.", "name": "The Press Office Cafe", "transport": "Take the YBS bus to Hledan Station and walk for about 8 minutes, or take a taxi directly to Inya Road."}, {"address": "No. 52, University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 Stars | Housed in a French colonial-style villa on University Avenue, this salon offers Yangon\u0027s most luxurious and elegant brunch and English afternoon tea experience. Piping hot, freshly baked scones are crispy on the outside and soft inside, spread with rich clotted cream and homemade berry jam for wonderful texture layers. Paired with carefully selected aromatic Darjeeling black tea, it feels as if you\u0027ve been transported to a European estate. The serene, lush green garden makes it a highly popular romantic date spot near Inya Lake.", "name": "Acacia Tea Salon", "transport": "Walk south from Inya Lake along University Avenue Road for about 10 minutes, or take a taxi."}, {"address": "No. 20/A, Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 Stars | Located near the shores of Inya Lake, this light industrial-style cafe is famous for its spacious, comfortable atmosphere and generous brunch portions. The classic full American brunch includes juicy fried bacon, seared German sausages, silky scrambled eggs, and golden hash browns\u2014every bite bursts with rich, savory, and roasted flavors. Paired with a hot latte featuring velvety smooth foam, it allows guests to enjoy an incredibly relaxing morning amidst the serene surroundings of the lake.", "name": "Craft Cafe Inya Lake", "transport": "Take the YBS bus to Inya Lake Station and walk about 3 minutes to arrive."}, {"address": "Pyay Road, Near Hledan Center, Kamayut Township, Yangon", "feature": "\u2b50 4.3 Stars | Located in the heart of the bustling Hledan commercial district, this bakery brunch cafe is deeply loved by Yangon University students and faculty. Freshly baked daily, their French croissants are extraordinarily flaky and crispy, releasing a rich cultured butter aroma with every bite without being greasy. Their special Dutch cold brew coffee is smooth with a mild acidity that perfectly balances the sweetness of the pastries, making it the best spot in the area to take a break and enjoy a light meal.", "name": "Artisan Amour", "transport": "Take the Yangon Circular Railway to Hledan Station and walk about 5 minutes after exiting."}, {"address": "No. 17, A-1, Inya Myaing Road, Bahan Township, Yangon", "feature": "\u2b50 4.7 Stars | Tucked away under shady trees, this plant-filled cafe has sparked a trend among young crowds with its healthy yogurt bowls and plant-based milk brunches. The signature acai smoothie bowl comes topped with an abundance of freshly sliced fruits, nuts, and chia seeds\u2014cool, sweet, tangy, and satisfying without any guilt. Decorated with abundant greenery and warm wooden accents, the atmosphere is cozy and relaxing, making it an excellent choice for experiencing slow living and a guilt-free breakfast.", "name": "Bodhi Nava Cafe", "transport": "Take a taxi for about 5 minutes from the east side of Inya Lake."}, {"address": "Pyay Road, Near Hledan Junction, Kamayut Township, Yangon", "feature": "\u2b50 4.2 Stars | A cozy cafe located on Pyay Road, known for its warm hand-drawn style decor and a wide variety of pressed panini brunches. The hot-pressed ham and cheese toast features a golden, crispy crust bursting with gooey, melted cheese inside\u2014pure bliss in every bite. Paired with a special cold brew iced coffee that offers a crisp and sweet finish, it is perfect for fueling up before exploring the vibrant Hledan shopping district.", "name": "Cafe On the Way", "transport": "Take the YBS bus to Hledan Junction Station and walk for 2 minutes."}, {"address": "Hledan Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 Stars | Located close to the Hledan business area and Yangon University, this bistro specializes in house-roasted single-origin coffee and exquisite Eggs Benedict. Slice into the fresh Eggs Benedict to reveal warm, rich golden yolk flowing over savory hollandaise sauce and smoked salmon\u2014a velvety, melt-in-your-mouth balance of flavors. The interior blends industrial aesthetics with lush plants, offering an upscale yet affordable dining experience that is wildly popular among local students and professionals.", "name": "Grounded Coffee \u0026 Bistro", "transport": "About a 6-minute walk from Hledan Center, offering very convenient access."}, {"address": "37, Kaba Aye Pagoda Road, Mayangone Township, Yangon", "feature": "\u2b50 4.3 Stars | Located within the historic Inya Lake Hotel, this bakery boasting stunning lake views and expansive green lawns serves top-quality Myanmar highland single-origin coffee and classic French pastries. The signature blueberry tart features a crispy, buttery crust filled with smooth, perfectly sweet custard, topped with plump, juicy blueberries that burst with refreshing flavor in every bite. Visitors can sit in the outdoor garden area, enjoying magnificent views of the lake while savoring a top-tier relaxed brunch.", "name": "Inya Lake Hotel Bakery \u0026 Cafe", "transport": "Take a taxi directly into the Inya Lake Hotel grounds, or take a bus to Kaba Aye Station and walk for 10 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 63-A, U Tun Tin Street, Mayangone Township, Yangon", "feature": "\u2b50 4.6 Stars | A supremely romantic lakeside lounge on the eastern shore of Inya Lake, co-created by a Michelin-starred chef. Housed in a stunning organic bamboo structure, the restaurant serves innovative fusion cuisine combining modern European techniques with local Myanmar ingredients. The must-try pan-seared scallops with lemongrass sauce are crispy on the outside and tender inside, rich with natural sweetness and a subtle zesty tang. Paired with exquisite cocktails and breathtaking golden hour lake views, it is the top date spot for high-end travelers, local elites, and dignitaries.", "name": "Seeds Restaurant \u0026 Lounge", "transport": "Take a taxi to the end of U Tun Tin Street by the bank of Inya Lake."}, {"address": "No. 80, University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 Stars | Situated in a century-old colonial-style mansion along University Avenue, offering prime views of Inya Lake. This upscale bistro features a seamless blend of classic French cuisine and local Myanmar flavors. A crowd favorite, the roasted lamb chops boast a golden, crispy crust and tender, juicy meat without any gaminess, perfectly complemented by a house-made wild strawberry red wine reduction. The lush garden houses an open-air bar that turns spellbindingly romantic when lit at night, making it highly sought after by fine-dining enthusiasts.", "name": "Le Planteur Restaurant \u0026 Lounge", "transport": "Take a taxi from Hledan Intersection heading east along University Avenue for about 5 minutes."}, {"address": "No. 33(A), Inya Myaing Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 Stars | Tucked away in lush green surroundings near Inya Lake, this highly acclaimed restaurant serves traditional Burmese cuisine. Their Burmese beef curry is slow-cooked until melt-in-your-mouth tender, with a rich, non-greasy gravy laced with sweet notes of lemongrass and caramelized onions. Dipping crispy Burmese flatbread (Paratha) into the sauce creates a wonderfully rich texture. The peaceful garden dining environment makes it a favorite among tourists seeking authentic local home-style cooking.", "name": "Green Elephant Restaurant", "transport": "Take a taxi from Hledan Station for about 7 minutes to reach Inya Myaing Road."}, {"address": "No. 1, Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.3 Stars | A trendy bistro located right at No. 1 Inya Road, just steps away from the Hledan commercial area, making it a hotspot for Yangon University students and young professionals. It specializes in creative Burmese fusion dishes and craft cocktails. A standout dish, the fried Rakhine seafood cake, is delightfully crispy and hearty, packed with fresh shrimp and cilantro, served with a tangy green chili dip that keeps you coming back for more. With live music performances at night, its relaxed vibe makes it a central landmark for nightlife in the area.", "name": "Inya 1 Restaurant \u0026 Bar", "transport": "Walk about 8 minutes from Yangon University or Hledan station, or take a 3-minute taxi ride."}, {"address": "No. 31, Kabar Aye Pagoda Road, Yankin Township, Yangon", "feature": "\u2b50 4.3 Stars | A stylish gastropub located southeast of Inya Lake, known for its industrial-chic decor and high-quality food. Foodies rave about their signature spicy Burmese pork bao: slow-braised pork belly that is rich without being greasy, paired with pickled greens in a fluffy steamed bun for a bursting flavor experience. The bar offers crafted cocktails featuring local tropical fruits, making it a popular late-night gathering spot for expats and young locals.", "name": "Escape Gastropub", "transport": "Take a bus to the Kabar Aye Pagoda Road stop and walk for 3 minutes, or take a 10-minute taxi from Hledan."}, {"address": "Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.2 Stars | An immensely popular local eatery on Inya Road, specializing in fiery seafood dishes from western Myanmar\u0027s Rakhine State. The signature Rakhine spicy and sour stir-fried crab features plump, sweet meat smothered in a zesty, fiery sauce that leaves you sweating yet craving more. Another highlight, the Rakhine Mont Di (seafood rice noodle soup), boasts an intensely flavorful broth with peppery and sour notes paired with springy rice noodles\u2014a huge hit with local foodies and lovers of bold flavors.", "name": "Min Lan Rakhine Seafood Restaurant - Inya", "transport": "Walk about 10 minutes from central Hledan commercial area to reach the Inya Road location."}, {"address": "No. 36, Inya Myaing Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 Stars | A famed establishment near the Golden Valley area of Inya Lake that elevates traditional Burmese tea house culture to refined bistro dining. Their Mohinga (Myanmar\u0027s national dish of fish noodle soup) features a velvety, rich broth simmered with fresh fish and banana stem, served alongside ultra-crispy split pea fritters. The venue also features a dedicated bar serving signature tea-infused cocktails, while its chic modern-retro interior draws instagrammers and international travelers alike.", "name": "Rangoon Tea House - Golden Valley", "transport": "Take a taxi from Hledan commercial area; takes about 8 minutes."}, {"address": "No. 119/121, University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 Stars | A speakeasy-style American-Burmese gastropub located near University Avenue, renowned for its exquisite tapas and creative signature cocktails. The highly recommended Spicy Burmese Grilled Chicken Wings are marinated and charred to crispy perfection while keeping the inside succulent, coated in a fragrant chili herb sauce full of savory kicks. The intimate, low-key vibe makes it a top pick for travelers seeking a chill evening with delicious bites.", "name": "The Blind Tiger Yangon", "transport": "Take a taxi from Hledan junction along University Avenue for about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Pyay Road, Near Hledan Center, Kamayut Township, Yangon", "feature": "\u2b50 4.5 stars | Located in the heart of the Hledan commercial area, this Indian vegan/vegetarian restaurant is a top choice for local plant-based food lovers. The signature Roti is golden and crispy, paired perfectly with rich, aromatic Chana Masala (chickpea curry) that boasts a creamy texture with zesty hints of ginger and cilantro. Tourists particularly love their Paneer Butter Masala, which is richly milky without being greasy. The dining environment is clean and bright, and prices are extremely budget-friendly, making it a must-visit vegetarian feast when exploring Hledan.", "name": "Bodhgaya Indian Vegetarian Restaurant", "transport": "Take a bus to Hledan Center Stop, then walk for about 3 minutes."}, {"address": "Inya Road, Kamayut Township, Yangon", "feature": "\u2b50 4.4 stars | Loving Hut, the globally renowned vegan chain, has a branch near Inya Lake that is deeply loved by students and foreign tourists. It offers a diverse array of Burmese and Asian vegan dishes. Among them, the \u0027Mohinga Veg\u0027 features a rich, sweet broth simmered from mushrooms and chickpeas, served with crispy fried bean fritters for a multi-layered texture that easily rivals traditional fish soup noodles. The venue is comfortable and filled with greenery, making it the perfect spot for a guilt-free, healthy plant-based meal after touring Inya Lake.", "name": "Loving Hut Yangon - Kamayut", "transport": "Take a bus to Inya Road Stop and walk for about 5 minutes; or take a taxi from the west bank of Inya Lake for about 5 minutes."}, {"address": "Hledan Market Street, Kamayut Township, Yangon", "feature": "\u2b50 4.3 stars | A famous street food stall located at the intersection of Hledan Night Market and the traditional market, specializing in vegan Shan rice noodles. The piping hot Shan Noodles are smooth and chewy, drizzled with a rich special tomato-mushroom sauce and crushed peanuts. Mixing it up releases a nutty aroma blended with sweet and sour notes, complemented delightfully by pickled greens and cilantro. Thanks to its incredibly affordable price and authentic local flavor, it draws crowds of students and tourists queuing up every evening.", "name": "Hledan Shan Veggie Noodle Stall", "transport": "Take the Yangon Circular Railway to Hledan Station; after exiting, walk for about 2 minutes."}, {"address": "University Avenue Road, Kamayut Township, Yangon", "feature": "\u2b50 4.2 stars | Located near the University of Yangon campus, Su Wei Xiang skillfully combines traditional Yunnan flavors with vegetarian cooking. The signature \u0027Vegetarian Dali Shredded Ersi Noodles\u0027 has a tender, chewy texture in a sweet, light broth slow-cooked from various vegetables and Chinese herbs. Another tourist favorite is the \u0027Crispy Vegetarian Fried Chicken\u0027, made from tofu skin and mushrooms, coated in a special batter and fried to a golden crisp. Juicy and remarkably similar to real meat, it is truly astounding.", "name": "Su Wei Xiang Yunnan Vegetarian Restaurant", "transport": "Take a bus to Yangon University Stop, then walk along University Avenue Road for about 6 minutes."}, {"address": "No. 63-A, U Tun Tin Road, Ward 10, Mayangone Township, Yangon", "feature": "\u2b50 4.7 stars | Situated
