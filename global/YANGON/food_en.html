        const db = {"bahan_shwedagon": {"categories": {"cat_1": {"items": [{"address": "No. 17-A, 1st West Shwegondaing Lane, Bahan Township, Yangon", "feature": "\u2b50 4.3 Stars | Aung Thukha is the most down-to-earth traditional Myanmar buffet restaurant in Bahan Township, Yangon, highly recommended by locals and foodies alike. The soul of the menu lies in various rich, aromatic dark Burmese curries\u2014such as stewed mutton, spicy pork, and tender chicken\u2014cooked until melt-in-your-mouth soft with rich turmeric and peanut oil aromas. Ordering a main course includes free side dishes like fresh raw vegetables, fried shrimp paste (\u0027Ngapi\u0027), and a refreshing sour soup. A bite of rice paired with tender curry beef offers the most authentic Burmese home-style flavor.", "name": "Aung Thukha Traditional Myanmar Food", "transport": "Take a taxi to the intersection of Shwegondaing Road and 1st West Lane, then walk for about 3 minutes."}, {"address": "124 Pyidaungsu Yeiktha St, Bahan / Dagon Township, Yangon", "feature": "\u2b50 4.2 Stars | Located near the south side of Shwedagon Pagoda, Feel Myanmar Food is the top landmark restaurant for experiencing authentic Burmese cuisine. Featuring a counter-style service, it displays dozens of freshly prepared spiced curries and side dishes. Highly recommended are the Mohinga (fish noodle soup) and the tea leaf salad (\u0027Lahpet Thoke\u0027). The tea leaf salad is delightfully crunchy, blending subtle tartness from fermented tea leaves with nutty textures. Its rich selection of dishes and lively dining atmosphere make it a favorite among international tourists and local families.", "name": "Feel Myanmar Food", "transport": "About a 5-minute taxi ride from the South Gate of Shwedagon Pagoda."}, {"address": "No. 33, Inya Road, Bahan Township, Yangon", "feature": "\u2b50 4.1 Stars | Nestled in a leafy garden bungalow in Bahan Township, Green Elephant Restaurant is a classic establishment designed for diners who wish to savor authentic Burmese cuisine in an elegant setting. Its signature coconut chicken noodle soup (\u0027Ohn No Khao Sw\u00e8\u0027) features a rich and creamy broth, with noodles absorbing the subtle flavors of coconut and turmeric. Using fresh ingredients with carefully balanced spiciness, it combines traditional flavors with refined taste, allowing foreign travelers to enjoy authentic local food comfortably.", "name": "Green Elephant Restaurant", "transport": "Take a taxi to Inya Road, close to Inya Lake and the upscale Bahan residential area."}, {"address": "U Wisara Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 Stars | Lucky Seven is an iconic traditional tea house in Yangon and the best spot to experience the local tea culture. The Burmese milk tea (\u0027Laphet Yay\u0027) here is rich and sweet, blending aromatic tea seamlessly with condensed milk. Pair it with freshly baked \u0027Roti\u0027 or fried dough sticks (\u0027Ea Kway\u0027) for a crispy outside and soft inside. Additionally, their Mohinga broth is simmered for hours with banana stem and freshwater fish, offering a savory, mildly peppery kick that whets the appetite. It is a time-honored top choice for locals starting their day.", "name": "Lucky Seven Tea House", "transport": "Located on the main U Wisara Road, about a 4-minute taxi ride from the West Gate of Shwedagon Pagoda."}, {"address": "Pearl Condo, Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 Stars | Specializing in Myanmar\u0027s national dish, Mohinga (fish noodle soup), this renowned restaurant passes down an ancient recipe from Myaungmya Town in the Ayeyarwady Region. The fish broth is slow-simmered with toasted rice powder, banana tree stems, and lemongrass, resulting in a rich, sweet broth free of any fishiness. Served with smooth rice noodles, crispy fritters (\u0027Akyaw\u0027), and boiled eggs, every bite combines crunchy and soft textures that tourists and locals alike rave about.", "name": "Myaungmya Daw Cho Mohinga", "transport": "Take a bus or taxi to near Pearl Condo shopping center, then walk for 2 minutes."}, {"address": "No. 16, Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 Stars | Located on Sayar San Road, Min Lan is famous for serving authentic Rakhine-style spicy seafood and traditional snacks. Its signature dish, \u0027Rakhine Mont Di\u0027, features a fiery broth made with green chilies and sour-spicy fish soup, served with springy rice noodles. Accompanied by freshly grilled prawns and spicy stir-fried squid, it offers a deliciously snappy texture. A must-visit spot for foodies who love bold flavors and spicy challenges.", "name": "Min Lan Rakhine Seafood Restaurant", "transport": "Take a taxi to Sayar San Road dining street, near the heart of Bahan Township."}, {"address": "No. 2A, Corner of Sayar San Road and Kan Bae Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 Stars | This famed specialty restaurant brings together traditional dishes from Myanmar\u0027s various ethnic minority groups. Here, you can sample iconic recipes from the Shan, Kachin, and Rakhine peoples all at once. For example, the Kachin steamed beef rice features tender beef slow-steamed in bamboo leaves with fresh herbs, delivering a fragrant and delicate taste, while Shan tofu noodles are silky, tangy, and deliciously textured. With an ethnic-themed ambiance, it is a premier classic establishment for exploring Myanmar\u0027s diverse culinary culture.", "name": "Taing Yin Thar Myanmar Ethnic Cuisine", "transport": "Take a taxi to the corner of Sayar San Road and Kan Bae Road."}, {"address": "No. 290, U Wisara Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 Stars | Housed in a century-old colonial wooden mansion, this restaurant was once the secret office of General Aung San, Myanmar\u0027s independence hero. The kitchen showcases traditional royal and home-style Burmese dishes. The signature Burmese beef stew and spiced grilled fish are slow-cooked using ancient methods, allowing the meat to absorb lemongrass and turmeric aromas until melt-in-your-mouth tender. Dining on classic cuisine inside a historic monument creates an artistic, nostalgic ambiance favored by travelers worldwide.", "name": "House of Memories", "transport": "About a 6-minute taxi ride from the West Gate of Shwedagon Pagoda."}], "name": "Authentic Local Classics"}, "cat_2": {"items": [{"address": "17 West Shwe Gon Daing 4th Street, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Tucked away in a quiet alley near the West Gate of Shwedagon Pagoda, Bodhi Nava is a hidden cafe surrounded by lush tropical greenery. Famous for its fresh and healthy brunch options, its signature \"Acai Smoothie Bowl\" is smooth and ice-cream-like, bursting with sweet-and-sour tropical fruit flavors and crunchy nut toppings. The \"Classic Avocado \u0026 Poached Egg Toast\" features freshly baked sourdough bread topped with creamy avocado mash and a silky poached egg with a runny yolk, offering rich layers of texture. Using carefully selected local Myanmar coffee beans, their pour-over coffee boasts bright floral-fruity aromas and a gentle acidity\u2014making it the ultimate spot for travelers seeking relaxation and a slow-paced brunch before or after visiting Shwedagon Pagoda.", "name": "Bodhi Nava Cafe \u0026 Hostel", "transport": "About an 8-minute walk from the West Gate of Shwedagon Pagoda, or take a taxi directly to West Shwe Gon Daing 4th Street."}, {"address": "52 Saya San Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Housed in a luxurious colonial-era white mansion, this elegant tea salon perfectly blends British elegance with European baking traditions. Step inside to experience a rich nostalgic vibe and refined quality. Popular among expats and Instagrammers, its brunch and afternoon tea sets feature fresh-baked \"English Scones\"\u2014crispy on the outside, fluffy inside, served with rich clotted cream and homemade strawberry jam. Paired with aromatic \"Myanmar High-Mountain Black Tea\" and a variety of freshly made quiches and exquisite French pastries, it feels like attending a 19th-century royal banquet, making it a prime spot for an elegant brunch.", "name": "Acacia Tea Salon", "transport": "Take a taxi along Saya San Road toward Pearl Condo; the striking white mansion is easily visible."}, {"address": "30A Bo Cho Street, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Located in a residential neighborhood of Bahan Township, Easy Cafe features a Scandinavian minimalist decor with a bright, spacious, and immensely comfortable environment. The cafe takes bean roasting and extraction seriously; their signature \"Iced Latte\" harmoniously blends creamy milk with espresso, yielding a silky-smooth texture with a subtle nutty sweetness. The \"Special Club Sandwich\" uses whole wheat toast stuffed with thick, juicy grilled chicken, bacon, and crispy lettuce, offering a satisfying crunch with every savory bite. Quiet with stable Wi-Fi, it is a favorite haunt for digital nomads and local youth to enjoy brunch and work.", "name": "Easy Cafe", "transport": "Take a taxi to Bo Cho Street, near the southeast side of Shwedagon Pagoda, about a 10-minute drive from downtown."}, {"address": "1 Wyne Ko Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Located inside a well-known local yoga studio, Nourish Cafe is a pioneer of plant-based and gluten-free healthy dining in Yangon. Using organic, locally sourced ingredients, it is highly favored by health-conscious diners and international travelers. The popular \"Rainbow Veggie Power Bowl\" uses quinoa as a base, combined with roasted sweet potatoes, edamame, and a special sesame dressing for a vibrant, guilt-free taste. The \"French Banana Oatmeal Pancakes\" are slightly crispy on the outside and soft inside, drizzled with pure maple syrup and fresh banana slices. Pair it with a fresh \"Turmeric Spinach Green Smoothie\" for a refreshing, energizing boost.", "name": "Nourish Cafe", "transport": "Take a taxi to Wyne Ko Road, located near the intersection of Inya Road and Kabar Aye Pagoda Road."}, {"address": "168 West Shwe Gon Daing Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | Perched on elevated ground in Bahan Township, Vista Cafe is famous for its close-up views overlooking Shwedagon Pagoda. Whether bathed in morning sunlight or illuminated at dusk, it offers a magnificent vantage point. The signature \"Special Myanmar Iced Coffee\" combines rich local jaggery with espresso, delivering a smooth sweetness with a hint of smoky flavor. A must-try brunch item is the \"Myanmar-Style Grilled Cheese Sandwich,\" featuring local spices and gooey cheese melted inside a crispy toasted exterior. Tourists love sipping coffee and having brunch here while taking in the stunning golden glory of the pagoda.", "name": "Vista Cafe", "transport": "Take a taxi to the rooftop venue at West Shwe Gon Daing Road, only about a 3-minute drive from the North or West Gate of Shwedagon Pagoda."}, {"address": "13/A Saya San Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | White Merak is a cozy cafe combining an art gallery with handcrafted bakery goods, with walls adorned with paintings by local Myanmar artists creating a rich artistic atmosphere. Freshly baked daily, their signature \"Almond Croissant\" features flaky, golden layers filled with smooth almond custard, delivering buttery and nutty aromas in every bite. Pair it with a \"Cappuccino\" crafted from Shan State highland beans, where velvety milk foam balances rich coffee flavor. Its stylish ambiance and exquisite offerings make it one of Bahan\u0027s most popular spots for brunch and high tea.", "name": "White Merak Cafe \u0026 Bakery", "transport": "Take a taxi along Saya San Road; located within the Saya San commercial dining strip."}, {"address": "Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Craft Cafe seamlessly blends modern industrial chic with traditional Myanmar bamboo weaving crafts in a spacious, beautifully designed interior. It highlights high-quality specialty pour-over coffee and creative Southeast Asian fusion brunch dishes. Highly recommended is the \"Myanmar Spiced Grilled Chicken Waffle,\" pairing crispy-yet-fluffy waffles with flavorful herb-marinated grilled chicken for an amazing sweet-and-savory combination. Their \"Nitro Cold Brew\" features a creamy, stout-like head with a smooth finish and fruity fermented notes. It attracts many expat business professionals and tourists, standing as a key landmark in Yangon\u0027s modern coffee culture.", "name": "Craft Cafe", "transport": "Easily found by taxi along the main artery Kabar Aye Pagoda Road, near Pearl Center."}, {"address": "18 Saya San Road, Bahan Township, Yangon", "feature": "\u2b50 4.1 stars | Situated on Saya San Road, Santino is a long-standing Italian cafe and bistro in Bahan Township, beloved by local families and long-term expats. The bistro serves authentic Italian espresso alongside fresh European-style brunch. The \"American Breakfast Platter\" comes hearty with pan-fried sausages, crispy bacon, sunny-side-up eggs, and garlic saut\u00e9ed mushrooms. The \"Basil Pesto Panini\" is toasted golden and crisp, filled with melty cheese and tender, juicy chicken. Made with dark-roasted Italian beans, the coffee has a bold body with a dark chocolate finish\u2014an ideal start to an energetic day.", "name": "Santino Cafe \u0026 Bistro", "transport": "Take a taxi to Saya San Road, near the intersection with University Avenue Road."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "105 Dhammazedi Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Set inside a beautiful colonial-style garden villa, Padonmar is renowned for serving authentic Burmese and Thai traditional dishes tailored to suit international tastes. Its rich and flavorful Burmese beef curry features tender beef simmered with turmeric and onions until melt-in-your-mouth soft, warm and non-spicy. Paired with steaming jasmine rice and a variety of fresh side salads, every bite delivers rich layers of spice. The refreshing eggplant salad is sweet, sour, and appetizing, with soft eggplant soaking up aromas of lemon juice and crushed peanuts\u2014a favorite among business professionals and travelers visiting Shwedagon Pagoda.", "name": "Padonmar Restaurant", "transport": "About a 5-minute taxi ride from the North Gate of Shwedagon Pagoda."}, {"address": "No. 290, U Wisara Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | Housed in a century-old, two-story wooden villa, this building was once the secret office of General Aung San, Myanmar\u0027s independence hero. Preserving vintage typewriters and historic photographs, dining here feels like stepping back in time. The menu highlights high-quality traditional Burmese dishes and regional drinks, with the \u0027Tea Leaf Salad (Laphet Thoke)\u0027 highly recommended. The fermented tea leaves offer a subtly bitter, tangy aroma paired with crunchy peanuts, broad beans, and white sesame seeds, delivering rich flavors and textures that get more fragrant with every bite. Paired with an ice-cold local craft beer, it\u0027s the perfect place to immerse yourself in Yangon\u0027s history and unique culinary culture.", "name": "The House of Memories", "transport": "Located on U Wisara Road, about a 12-minute walk or a 3-minute taxi ride from the West Gate of Shwedagon Pagoda."}, {"address": "124 Pyidaungsu Yeiktha Street, Dagon/Bahan border, Yangon", "feature": "\u2b50 4.4 stars | For the most authentic and down-to-earth Burmese curries and stir-fries, Feel Myanmar is the ultimate top pick. Operating cafeteria-style, it showcases dozens of traditional dishes served in small copper pots. The signature Burmese pork curry comes in thick, juicy chunks with tender meat and chewy skin, cooked in a sauce rich with onion sweetness and chili oil that instantly whets your appetite over rice. Enjoy it with complimentary unlimited fresh raw vegetables and custom fish sauce dip to balance out any richness. Efficient service and genuine flavors keep this place packed with local foodies and curious international travelers alike.", "name": "Feel Myanmar Food", "transport": "About a 4-minute taxi ride from the South Gate of Shwedagon Pagoda."}, {"address": "168 West Shwe Gon Daine Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Vista Bar is the most famous rooftop bar and lounge in Yangon\u0027s Bahan Township, best known for its unobstructed, breathtaking night view directly facing Shwedagon Pagoda. Here, you can sip cocktails while enjoying modern bar bites infused with Burmese spices, such as the \u0027Spicy Burmese Fried Chicken Wings\u0027\u2014crispy on the outside with a savory herbal kick, juicy inside. Pair them with handcrafted signature cocktails created by skilled mixologists for a refreshing, well-balanced sip. As night falls, the golden pagoda glows brilliantly under the lights, drawing countless visitors for a romantic evening in Yangon.", "name": "Vista Rooftop Bar", "transport": "Just a 10-minute walk or a 3-minute taxi ride from the northeast corner of Shwedagon Pagoda."}, {"address": "Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | A specialty seafood restaurant focused on the coastal flavors of Myanmar\u0027s Rakhine State, celebrated for its bold, punchy sour-and-spicy dishes and fresh seafood. The signature \u0027Rakhine Spicy Stir-Fried Flower Crab\u0027 uses daily fresh live crabs, stir-fried over high heat with heaps of green chilies, garlic, and Rakhine spice mix\u2014the crab meat is firm and sweet, coated in an intensely savory, spicy juice. Another must-try is the \u0027Rakhine Fish Noodle Soup (Rakhine Mont Di)\u0027, featuring a clear broth bursting with black pepper and fish flavors over silky rice noodles. Foodies who love bold flavors and fresh seafood shouldn\u0027t miss this iconic local spot.", "name": "Min Lan Rakhine Seafood - Sayar San", "transport": "Located on Sayar San Restaurant Street in Bahan, about an 8-minute taxi ride from Shwedagon Pagoda."}, {"address": "80 University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Nestled in a lush garden villa, Le Planteur epitomizes Yangon\u0027s finest fine dining wrapped in colonial charm. This upscale French bistro expertly blends European haute cuisine with fresh, local Myanmar ingredients, such as the \u0027Pan-Seared Duck Breast with Wild Myanmar Honey Glaze\u0027\u2014crispy golden skin with tender, juicy pink duck meat, elevated by floral notes from wild honey and a beautifully balanced sweet-and-sour sauce. With serene, elegant gardens displaying vintage classic cars, the atmosphere turns incredibly romantic at night, making it a top choice for tourists seeking a luxurious dinner and fine wines.", "name": "Le Planteur", "transport": "About a 10-minute taxi ride north from Shwedagon Pagoda."}, {"address": "No. 60A, U Tun Tin Street, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Created by a Michelin-starred chef and his wife, Seeds is famous for its natural all-wooden bamboo pavilion design and overwater pavilion seating. This lakeside lounge offers innovative fusion cuisine combining local flavors with modern international dining. The signature \u0027Herb-Crusted Myanmar Sea Bass\u0027 uses select local catch, perfectly crisp on the outside and wonderfully tender inside, served with a vibrant green sauce infused with lemongrass and local herbs. Accompanied by curated wine pairings against glowing sunset views over the lake, it offers diners an unforgettable visual and culinary feast.", "name": "Seeds Restaurant \u0026 Lounge", "transport": "Located on the lakeside northeast of Bahan Township, about a 12-minute taxi ride from Shwedagon Pagoda."}, {"address": "Golden Valley Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Rangoon Tea House, the renowned establishment that elevated traditional Myanmar tea shop culture into a sophisticated bistro setting, features a stylish branch in Bahan\u0027s Golden Valley. Here, you can sample traditional Burmese milk tea with dozens of custom sweetness and richness combinations, but the food is equally exceptional! The signature \u0027Mohinga (Burmese Fish Noodle Soup)\u0027 boasts a rich, savory broth simmered with fresh fish and banana stem, accented with black pepper and served with crispy split-pea fritters and springy rice noodles. In the evening, try creative cocktails infused with Burmese herbs\u2014a favorite spot for both trendy locals and global travelers.", "name": "Rangoon Tea House - Golden Valley", "transport": "Located in the Golden Valley neighborhood of Bahan Township, about a 6-minute taxi ride from Shwedagon Pagoda."}], "name": "Specialty Bistros \u0026 Local Regional Cuisine"}, "cat_4": {"items": [{"address": "No. 8, Waitagyi Street, Bahan Township, Yangon", "feature": "\u2b50 4.7 stars | Specializing in 100% plant-based vegan cuisine, this cafe perfectly fuses local Myanmar ingredients with Western light bites. The must-try Vegan Fermented Tea Leaf Salad (Lahpet Thoke) is delightfully crunchy, packed with fragrant toasted nuts and split peas, offering a refreshing, mildly spicy, and tangy kick. Another hit is the plant-milk curry simmered with chickpea pur\u00e9e and coconut milk\u2014rich, smooth, and aromatic. It\u2019s a popular health-conscious hotspot among expats in Bahan Township.", "name": "Nourish Cafe Yangon", "transport": "Take a taxi to the corner of Waitagyi Street in Bahan Township, then walk for about 2 minutes."}, {"address": "Pearl Condo, Building C, Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | A branch of the internationally renowned Loving Hut vegan chain, offering a variety of Myanmar and Asian vegan dishes. Highly recommended is their Vegan Shan Tofu Noodle, made with fresh chickpea-based yellow tofu that has a velvety texture similar to warm melted cheese, topped with spicy plant-based sauce and crushed peanuts. Bright, clean, and welcoming, it\u2019s a guilt-free sanctuary for healthy food lovers.", "name": "Loving Hut Yangon", "transport": "Take the YBS bus to Pearl Condo Station and walk into the shopping complex building."}, {"address": "Kabar Aye Pagoda Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | A tranquil vegetarian teahouse located just north of Shwedagon Pagoda, serving exquisite Chinese and Myanmar vegetarian dishes. Popular picks include the Healthy Jade Noodles and Crispy Veggie Chop Rice. The noodles are springy with a sweet, non-greasy broth, while the veggie chop features a golden crunchy exterior and a juicy, tender interior. With its peaceful ambiance, it\u2019s an ideal spot to unwind and enjoy a healthy meal after visiting the Shwedagon Pagoda.", "name": "Waterdrop Teahouse Yangon", "transport": "Take a 5-minute taxi ride from the North Gate of Shwedagon Pagoda along Kabar Aye Pagoda Road."}, {"address": "No. 12, West Shwe Gon Dine Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | A lush, green vegetarian restaurant located near the West Gate of Shwedagon Pagoda, focusing on all-natural, additive-free healthy vegetarian food. Its Myanmar Vegan Coconut Milk Noodles (Khaso) combine rich coconut milk with plant-based broth, served with chewy rice noodles and crispy fried onion rings, creating rich layers of flavor with subtle herbal undertones. The garden dining area surrounded by plants offers an immensely relaxing, vacation-like atmosphere.", "name": "The Bodhi Tree Veggie Cafe", "transport": "About an 8-minute walk from the West Gate of Shwedagon Pagoda, located right along West Shwe Gon Dine Road."}, {"address": "Pearl Condo, Ground Floor, Kabar Aye Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | A highly prestigious North Indian restaurant in Yangon featuring an exceptional vegetarian menu. Must-try dishes include Palak Paneer (spinach with cottage cheese) and Tandoori Veggie Skewers. Fresh homemade paneer is simmered in a velvety smooth spinach pur\u00e9e, paired perfectly with freshly baked Garlic Naan that is crispy outside and soft inside. A paradise for lovers of rich Indian vegetarian cuisine.", "name": "The Coriander Leaf - Veg Selection Bahan", "transport": "Take a bus to Pearl Condo Station; enter the ground-floor commercial area to spot the prominent sign."}, {"address": "No. 55, Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | A long-established local vegetarian restaurant in Bahan Township serving affordable Burmese-Chinese style dishes. Recommended highlights include Crispy Chickpea Fritters (Bayagyi) and Vegetarian Mohinga (fishless fish soup noodles). The broth is simmered with banana stem and various spices to create a rich, savory, and sweet base. Entirely fish-free, it retains surprising depth with subtle lemongrass aromas\u2014a must-try local staple.", "name": "Ingyin Vegetarian Restaurant", "transport": "Take a taxi to Sayar San Road, near the bustling Pearl Condo area."}, {"address": "No. 169, Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | An upscale restaurant crafted with traditional Shan bamboo-woven decor, offering a variety of clearly labeled traditional vegan Shan snacks. Their signature Hot \u0026 Sour Vegan Warm Tofu Noodles features silky, warm chickpea tofu creamy as soup, paired with vibrant hot and sour dressing and chewy Shan rice noodles\u2014an addictive treat you won\u0027t want to stop eating.", "name": "Shan Yoe Yar - Bahan Veg Hub", "transport": "Take a taxi for about 7 minutes from the East Gate of Shwedagon Pagoda to reach the branch on Sayar San Road."}, {"address": "No. 42, University Avenue Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | A highly-rated healthy vegetarian spot near University Avenue, specializing in exquisite plant-based Myanmar stir-fries and dim sum. Features include Crispy Salted Egg King Oyster Mushroom (veganized), wrapped in a golden batter that bursts with juicy flavor, and Three-Cup Monkey Head Mushroom, infused with aromatic basil and ginger with a satisfyingly meaty texture. A top favorite among local families and tourists.", "name": "Maitreya Vegetarian Kitchen", "transport": "Take a taxi to near the intersection of University Avenue Road and Inya Road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "East Gate Approach, Shwedagon Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Mont Lin Maya, meaning \u0027Couples\u0027 Cake,\u0027 is one of the most popular street snacks and walkable treats around Shwedagon Pagoda. Rice batter is poured onto round griddles, topped with two quail eggs, scallions, and chickpeas, then cooked until golden and crispy before joining two halves together. The result is a crunchy exterior with a soft, pillowy center bursting with rich egg flavor and a subtle rice aroma. The delightful contrast between crispy and soft makes it addictively good\u2014a must-try affordable street bite after visiting the pagoda.", "name": "Mont Lin Maya - Shwedagon East Gate Vendor", "transport": "Take a taxi to the East Gate approach of Shwedagon Pagoda; it is easily reachable on foot."}, {"address": "South Gate, Shwedagon Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | Myanmar locals are deeply passionate about traditional fritters (Akyaw-sone), and this long-established stall along the South Gate walkway serves freshly fried treats daily. Highly recommended are the fried gourd and yellow pea cakes, coated in a special rice batter and fried to ultimate crunchiness with juicy fillings inside. Dipped in sweet and spicy tamarind sauce, the loud crunch combined with zesty, tangy flavors cuts through the richness. Locals love grabbing a bag to eat while strolling, making it an authentic taste of local street food culture.", "name": "Assorted Fritters Stall - Shwedagon South Gate", "transport": "Take a bus to Shwedagon South Gate stop and walk for about 2 minutes."}, {"address": "Bahan Market, Kabar Aye Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Fresh, crispy samosas are cut into bite-sized pieces and tossed into a savory soup-salad with broth, shredded cabbage, onions, mint leaves, and chickpea flour. Soaking up the flavorful broth, the samosa crust surprisingly retains a bit of crunch, housing a rich, comforting potato filling. Packed with complex textures, tangy heat, and herbal freshness, this is a highly celebrated humble staple among locals at Bahan Market.", "name": "Samosa Thoke - Bahan Market", "transport": "Take a taxi to Bahan Market and walk into the market\u0027s food area."}, {"address": "West Gate Approach, Shwedagon Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.2 stars | This sticky rice dessert is a traditional classic during Myanmar\u0027s Thingyan Water Festival and daily celebrations. Hand-rolled white glutinous rice balls are stuffed with bite-sized chunks of jaggery (palm sugar), boiled until floating, and topped with freshly grated coconut flakes. Biting into it reveals a delightfully chewy rice skin surrounding a burst of molten, fragrant palm sugar syrup, perfectly complemented by the crisp coconut flakes for a sweet, comforting, and whimsical treat.", "name": "Mont Lone Yay Paw Street Stall", "transport": "Walk for about 3 minutes along Shwedagon Pagoda Rd from the West Gate exit of Shwedagon Pagoda."}, {"address": "No. 120, Bahan Road, Bahan Township, Yangon", "feature": "\u2b50 4.6 stars | Mohinga is widely regarded as Myanmar\u0027s national dish, and this legendary brand\u0027s Bahan stall is immensely popular with locals. The rich fish broth\u2014simmered with fresh catfish, banana stem, onions, and turmeric\u2014is served over tender rice vermicelli noodles and topped with crispy fried yellow pea fritters. The savory broth offers a delicate natural sweetness with a peppery kick, absorbing wonderfully into the smooth noodles. Combined with crunchy fritters, it offers an outstanding flavor profile, making it the top choice for an authentic Yangon breakfast and street food experience.", "name": "Myaungmya Daw Cho Mohinga - Bahan", "transport": "Take a taxi to Bahan Road near Jimmy Park to arrive at the location."}, {"address": "Near Pearl Condo, Kabar Aye Pagoda Rd, Bahan Township, Yangon", "feature": "\u2b50 4.5 stars | Fermented tea leaf salad (Laphet Thoke) is arguably Myanmar\u0027s most unique street food. Tender, savory-sour pickled tea leaves are tossed together with crunchy fried yellow split peas, roasted peanuts, sesame seeds, sliced raw garlic, and fresh chilies, lightly dressed with peanut oil and lime juice. Every bite delivers an explosion of crunch followed by the rich, tangy, savory, and spicy flavors of the tea leaves and chili\u2014an extraordinarily invigorating and mouthwatering appetite-pleaser.", "name": "Laphet Thoke - Bahan Street Tea Stall", "transport": "Take a taxi to Pearl Condo; the street side tea stall is a 1-minute walk away."}, {"address": "North Gate, U Wisara Road, Bahan Township, Yangon", "feature": "\u2b50 4.4 stars | Located near the North Gate, this popular food stall specializes in comforting Shan Noodles (Shan Khauk Swe). Smooth, chewy rice noodles are topped with a flavorful tomato-and-minced-pork sauce, crushed peanuts, and pickled greens, available dry-tossed or in hot broth. When mixed, the tender noodles cling to the savory, sweet, and slightly tangy pork sauce, while side-served pickled mustard greens add a crisp brightness. It is a go-to favorite for visitors needing a delicious energy boost after exploring the pagoda.", "name": "Shan Noodles Stall - Shwedagon North Gate", "transport": "Take a taxi to the North Gate entrance of Shwedagon Pagoda; the stall is readily visible."}, {"address": "Sayar San Road, Bahan Township, Yangon", "feature": "\u2b50 4.3 stars | In tropical Yangon, this Indian-inspired dessert drink is the ultimate refreshment. Served in a tall glass, layers of pink rose syrup, rich milk, silky sago pearls, egg pudding, and ice cream are assembled over chewy jelly and basil seeds at the bottom. Stirring it all together with a long spoon offers a deliciously creamy, cool, and sweet sensation, with fun textures tucked into every bite\u2014an instantly refreshing escape from Yangon\u0027s heat.", "name": "Street Falooda Stall - Bahan", "transport": "Take a taxi to the Sayar San Road commercial area; it is easily accessible on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Bahan and Shwedagon Pagoda Area"}, "botahtaung_waterfront": {"categories": {"cat_1": {"items": [{"address": "7-9 Pansodan Rd, Lower Block, Yangon, Myanmar", "feature": "\u2b50 4.6 Stars | This internationally acclaimed traditional tea house is famous for elegantly recreating traditional Myanmar street food. The signature Mohinga broth is slow-cooked with fresh fish and lemongrass, offering a rich, savory sweetness with a subtle citrus aroma. The crispy-on-the-outside, soft-on-the-inside Paratha dipped in fragrant curry is simply irresistible. Pair it with rich traditional Myanmar milk tea\u2014a velvety blend of evaporated and condensed milk that is sweet without being cloying. Combining colonial-era elegance with modern design, it has become a favorite dining landmark for tourists and locals alike.", "name": "Rangoon Tea House", "transport": "Take a taxi to Pansodan Road and get off; it\u0027s about a 2-minute walk to the area near the Yangon River bank."}, {"address": "85 Theinbyu Rd, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.4 Stars | Housed in a beautifully preserved two-story colonial building in the Botataung district, this is an iconic landmark restaurant in Yangon. It specializes in authentic Burmese home-style curries and traditional Southeast Asian cuisine. The Tea Leaf Salad (Laphet Thoke) is highly recommended\u2014fermented tea leaves mixed with crunchy beans, garlic, and fried shallots, delivering a rich multi-layered texture that is delightfully tangy, spicy, and appetizing. The pork curry is braised until melt-in-your-mouth tender, blending savory fats seamlessly with Burmese spices, making it a favorite among both tourists and local elites.", "name": "Monsoon Restaurant \u0026 Bar", "transport": "Take a bus or taxi to near the intersection of Theinbyu Road and Strand Road, then walk for about 3 minutes."}, {"address": "49th Street, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | Located on 49th Street, Lucky Seven is a fantastic spot to experience Yangon\u0027s local tea house culture. Every morning, it bustles with lively locals. The signature Burmese fried dough stick (Ea Kwai) is golden and crispy on the outside, light and fluffy on the inside; dipping it into hot milk tea to absorb the tea aroma makes for an absolute taste delight. Additionally, the Indian flatbread (Palata) served with chicken curry is a must-try, offering distinct textures and rich flavors. With affordable prices, it provides a genuine glimpse into the vibrant daily life of Yangon\u0027s waterfront district.", "name": "Lucky Seven Tea House", "transport": "Take a taxi to 49th Street in Botataung Township, near the intersection with Mahabandoola Road."}, {"address": "92 Strand Rd, Kyauktada Township, Yangon, Myanmar", "feature": "\u2b50 4.5 Stars | Located inside the legendary century-old luxury hotel, The Strand Hotel, this cafe is the most elegant traditional culinary sanctuary along Yangon\u0027s waterfront. It is renowned for its traditional Myanmar afternoon tea, which fuses delicate Burmese desserts like banana coconut pudding with classic English scones. The signature coconut chicken noodle soup (Ono Khao Swe) features a creamy coconut yellow curry broth poured over smooth noodles that absorb all the flavors, topped with a handful of crispy fried noodles for a delightful textural contrast that captivates every diner.", "name": "The Strand Cafe", "transport": "Located on Strand Road near Botataung Jetty; take a taxi directly to the main hotel entrance."}, {"address": "216 Merchant Rd, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | Open since 1955, this is one of the oldest and most famous Burmese Biryani (Danbauk) spots in Yangon\u0027s waterfront commercial district. The signature mutton and chicken biryani features long-grain basmati rice steamed slowly with dozens of Indian spices. The fragrant rice grains remain distinct while absorbing the essence of the savory meat juices, while the tender meat falls off the bone at the touch of a fork. Served with special spicy pickled veggies, garlic, and onions, it cuts through the richness and elevates the flavor. Steeped in the waterfront\u0027s trading history, this iconic dish draws endless food lovers queuing up daily.", "name": "Nilar Biryani \u0026 Cold Drink", "transport": "Located on Merchant Road, just a 3-minute walk from the Pansodan Road intersection."}, {"address": "60 Pansodan St, Kyauktada Township, Yangon, Myanmar", "feature": "\u2b50 4.5 Stars | Set inside the historic Sofaer Building constructed in 1906, this restaurant retains elegant floor tiles and high ceilings, seamlessly blending the historical charm of Old Yangon with classic cuisine. It specializes in thoughtfully refined local Myanmar dishes, with the Burmese-style grilled fish and crispy spring rolls being standout highlights. The grilled fish boasts a lightly charred, crispy skin and tender, juicy flesh seasoned with fresh local herbs and lemon for a tangy, refreshing bite; the fried spring rolls are ultra-crispy with a generous filling, showcasing the rich diversity of Yangon\u0027s waterfront culinary heritage.", "name": "Sofaer \u0026 Co.", "transport": "Take a taxi to Pansodan Street and get off near the Strand Road waterfront area."}, {"address": "29th Street (Middle Block), Yangon, Myanmar", "feature": "\u2b50 4.3 Stars | This is an iconic traditional Burmese buffet curry house highly praised by locals and foodies alike. When you order a main dish (such as braised king prawns, spicy mutton, or stewed pork), the table is filled with complimentary side dishes, including fresh raw vegetable platters, fermented fish/shrimp dip (Ngapi), various pickled veggies, and lentil soup. The braised king prawns are tender yet firm, served in a rich sauce infused with shallots and turmeric; paired with steamed rice, it makes for an unforgettable, authentic local culinary feast.", "name": "Danuphyu Daw Saw Ee Myanmar Restaurant", "transport": "It takes about 5 minutes by taxi from Botataung Jetty."}, {"address": "Strand Rd, Botataung Township, Yangon, Myanmar", "feature": "\u2b50 4.2 Stars | Located right next to Botataung Jetty and the waterfront park, this is a must-visit street food hub while enjoying the sunset over the Yangon River. The most famous snack here is Mont Lin Maya (Burmese couple cakes), crisp rice flour batter treats cooked in round iron molds filled with quail eggs and scallions\u2014crispy on the outside, soft on the inside with rich aromas of rice and egg. Freshly fried Samosas are extra crunchy with aromatic curried potato fillings, making them a popular sweet and savory post-work snack enjoyed by locals.", "name": "Botataung Jetty Traditional Snack Stalls", "transport": "Take a taxi to Botataung Pagoda or Botataung Jetty and walk along the jetty park."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "92 Strand Rd, Botataung Township, Yangon", "feature": "\u2b50 4.6 Stars | Located inside the century-old Strand Hotel, this charming colonial-style caf\u00e9 is the top choice for experiencing English afternoon tea and an elegant brunch. The caf\u00e9 serves exquisite \u0027Strand Classic Eggs Benedict\u0027 and traditional Burmese \u0027Mohinga\u0027 (catfish noodle soup), featuring delicate textures and a rich, flavorful broth. High colonial ceilings paired with smooth lattes brewed from premium beans create a delightful ambiance, highly favored by international travelers and business guests who appreciate historic charm.", "name": "The Strand Caf\u00e9", "transport": "Take a taxi to the intersection of Strand Road and 41st Street; it is directly opposite the jetty area."}, {"address": "36 Merchant Rd, Botataung Township, Yangon", "feature": "\u2b50 4.5 Stars | A popular hotspot that elevates traditional Burmese street tea house culture into modern luxury. Their signature \u0027Burmese Milk Tea (Laphet Yay)\u0027 allows custom sweetness and richness levels, perfectly paired with crispy yet soft samosas and butter naan for rich layers of flavor. Their famous brunch item \u0027Khow Suey\u0027 (coconut chicken noodle soup) features a sweet, rich broth and chewy noodles, beloved by international tourists and trendy local youth alike.", "name": "Rangoon Tea House", "transport": "About an 8-minute walk from Botataung Pagoda, or take a bus to Merchant Street Station."}, {"address": "30 Bo Aung Kyaw St, Botataung Township, Yangon", "feature": "\u2b50 4.4 Stars | A boutique independent caf\u00e9 tucked away on a quiet street in Botataung Township, renowned for expert pour-over coffee and fresh, healthy brunch. The signature \u0027Avocado Toast with Poached Eggs\u0027 features fresh local avocados\u2014creamy and smooth\u2014paired with tangy sour cream and crispy toast for distinct layers of texture. Minimalist Nordic decor combined with fruity notes from in-house roasted beans makes it a favorite haven for hipsters and digital nomads.", "name": "Easy Cafe (Bo Aung Kyaw)", "transport": "Take a taxi to the middle of Bo Aung Kyaw Street; it\u0027s just about a 5-minute walk from the riverfront jetty."}, {"address": "No. 644 First Floor, Merchant Rd, Botataung Township, Yangon", "feature": "\u2b50 4.5 Stars | Hidden on the second floor of a colonial heritage building, featuring exposed brick walls and a lush vintage courtyard. Their \u0027Burmese Tea Leaf Salad (Laphet Thoke)\u0027 blends savory fermented tea leaves with crisp beans and peanuts for a tangy, spicy, and satisfying texture. Paired with a special \u0027Burmese Brunch Platter\u0027, you can sample fried chickpea fritters and savory flatbreads in one go. Its charming historic vibe and inventive local cuisine attract endless photography enthusiasts and foodies.", "name": "Burma Bistro", "transport": "Take a taxi to the intersection of Merchant Rd and 62nd St; it is just a 1-minute walk away."}, {"address": "No. 82 Bo Aung Kyaw St, Botataung Township, Yangon", "feature": "\u2b50 4.3 Stars | A French-European style caf\u00e9 in Botataung Township known for its cozy, minimalist ambiance and top-tier Western brunch. Highly recommended is the \u0027French Toast with Fresh Berries\u0027\u2014golden and crispy on the outside, silky and pudding-soft inside, perfectly balanced in sweetness. Paired with single-origin pour-over coffee featuring rich nutty notes and a smooth mouthfeel, it\u0027s a favorite hidden spot for local professionals and expats to unwind over brunch near the jetty.", "name": "Cafe 82", "transport": "Walk south along Bo Aung Kyaw St toward Strand Road for about 3 minutes."}, {"address": "Merchant Rd, Botataung Township, Yangon", "feature": "\u2b50 4.2 Stars | A trendy caf\u00e9 dedicated to promoting high-quality local coffee beans, located on a bustling commercial street near the jetty area. Their signature \u0027Specialty Cold Brew\u0027 offers subtle acidity with a sweet finish, refreshing and perfect for cooling off in Yangon\u0027s heat. A popular brunch pick, the \u0027Parma Ham \u0026 Cheese Panini\u0027, is pressed to ultimate crispiness with rich, gooey melted cheese inside. Warm service and locally flavored coffee make it a favorite among local professionals and independent travelers.", "name": "Craft Cafe (Merchant Street)", "transport": "About a 6-minute walk from the Yangon Riverfront Jetty."}, {"address": "49th St, Botataung Township, Yangon", "feature": "\u2b50 4.4 Stars | A legendary tea house essential for experiencing an authentic Burmese-style brunch. The piping hot \u0027Burmese Fried Dough (Ea Kway)\u0027 is crispy outside and soft inside, traditionally dipped into sweet, rich milk tea. Additionally, the \u0027Coconut Chicken Noodles\u0027 feature a smooth, rich soup with subtle coconut and curry aromas that leave a lasting impression. Its vibrant local atmosphere and great value make it the top choice for immersing in local culture and enjoying a satisfying meal.", "name": "Lucky Seven Tea House (Botataung)", "transport": "Walk from Botataung Pagoda along Strand Rd and turn onto 49th St; about a 5-minute walk."}, {"address": "Strand Rd near Pansodan Jetty, Botataung Township, Yangon", "feature": "\u2b50 4.1 Stars | A Dutch-style caf\u00e9 located near the Yangon Riverfront jetty area, renowned for high-quality espresso and light sandwiches. The signature \u0027Smoked Salmon \u0026 Cream Cheese Bagel\u0027 features a chewy, dense bagel paired with savory salmon and rich cream cheese for deep flavor layers. Outdoor seating overlooks the Yangon River and bustling jetty; sipping a rich latte in the gentle breeze makes it a perfect sanctuary to escape city bustle and soak in the waterfront vibe.", "name": "Bar Boon (Riverfront)", "transport": "Located opposite Pansodan Ferry Jetty; take a bus or taxi and get off at Pansodan Jetty stop."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "85 Theinbyu Rd, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Housed in a century-old colonial building in Botataung Township, Monsoon is an iconic local bistro in Yangon. It brings together classic home-style dishes from various regions of Myanmar (such as Shan State and Ayeyarwady Region) as well as Southeast Asian favorites. The signature Burmese Beef Curry is tender with rich, layered spices, perfectly paired with fragrant coconut rice and specially crafted cocktails. Offering a gentle yet distinct spice profile, it is immensely popular among foodies worldwide and discerning locals alike.", "name": "Monsoon Restaurant \u0026 Bar", "transport": "Take a taxi to the vicinity of the intersection of Theinbyu Road and Anawrahta Road; it is about a 2-minute walk from there."}, {"address": "9-13 50th St, Botataung Township, Yangon", "feature": "\u2b50 4.2 stars | Tucked away in a historic brick building on 50th Street in Botataung, this is Yangon\u0027s oldest and most unique American-local hybrid bar and restaurant. The high wooden ceilings and vintage decor create a vibrant ambiance. It serves gourmet burgers infused with local Myanmar ingredients, roasted ribs, and craft beers. The food is crispy on the outside, tender on the inside, and perfectly seasoned. With frequent live music performances at night, it is an ideal spot to savor great food and experience the bustling nightlife of Yangon\u0027s waterfront district.", "name": "50th Street Cafe Restaurant Bar", "transport": "Take a taxi and get off on 50th Street; it is located between Merchant Road and Anawrahta Road."}, {"address": "158 Pansodan St, Botataung Township, Yangon", "feature": "\u2b50 4.4 stars | Situated inside the historic Sofaer Building on Lower Pansodan Street (near the waterfront jetty), Sofaer \u0026 Co. seamlessly blends 1900s colonial floor tiles with industrial decor. The restaurant focuses on refining traditional Burmese street food and regional specialties\u2014such as innovative Shan noodles, spicy grilled fish, and tea leaf salad\u2014delivering refreshed flavors with distinct tangy and spicy layers. With an artistic dining atmosphere, it is a must-visit bistro for exploring Yangon\u0027s riverfront culture and modern local cuisine.", "name": "Sofaer \u0026 Co.", "transport": "Take a taxi and get off at Pansodan Street, near the Strand Road waterfront jetty area."}, {"address": "92 Strand Rd, Botataung Township, Yangon", "feature": "\u2b50 4.6 stars | Located inside the legendary riverfront landmark, The Strand Hotel, and named after its founders, the Sarkies brothers. This elegant bistro preserves luxurious late 19th-century wooden bar counters and leather sofas. It offers exquisite Burmese-style light bites along with premium whiskies and the signature \u0027Strand Sling\u0027 cocktail. Bar snacks like crispy Burmese split pea fritters and spicy skewers feature golden, crunchy exteriors and rich flavor, making it the ultimate choice for experiencing riverside colonial history paired with top-tier dining and drinks.", "name": "Sarkies Bar at The Strand Hotel", "transport": "Take a taxi directly to The Strand Hotel on Strand Road, adjacent to Botahtaung Jetty."}, {"address": "Strand Square, 1/2 Strand Rd, Botataung Township, Yangon", "feature": "\u2b50 4.1 stars | Situated on the ground floor of the Strand Square commercial building near the riverfront jetty, Union Bar \u0026 Grill is a trendy spot popular among business professionals and expats. Fusing European bistro fare with local Burmese ingredients, it serves a variety of artisanal pizzas, pan-seared seafood, and signature fruit cocktails. The grilled Yangon river seafood and custom Burmese spice salad are highly recommended, offering sweet and vibrant flavors. Paired with a modern, airy space and professional mixology, it provides a thoroughly relaxing and satisfying experience.", "name": "Union Bar \u0026 Grill", "transport": "Take a taxi to the intersection of Strand Road and 42nd Street; Strand Square will be visible right there."}, {"address": "49th St, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Located on 49th Street in Botataung, this is a classic landmark for experiencing traditional Burmese tea house culture and regional cuisine in Yangon. Although named a tea house, its extensive menu easily rivals full local restaurants. The signature fish noodle soup (Mohinga) features a rich, savory broth slow-cooked with fresh fish and banana stem, infused with subtle peppery heat and served with crispy fritters. The Shan dry noodles offer a chewy texture and a tangy, appetizing spice kick, highly praised by locals and culinary travelers alike.", "name": "Lucky Seven Tea House (49th St Branch)", "transport": "Take a taxi to near the intersection of 49th Street and Mahabandoola Road."}, {"address": "No. 6, Botahtaung Jetty, Strand Rd, Botataung Township, Yangon", "feature": "\u2b50 4.0 stars | Moored by Botahtaung Jetty, this 1920s vintage-style yacht restaurant allows guests to dine amid the glistening waves of the Yangon River. Specializing in regional Burmese seafood and British-style dining, must-try items include charcoal-grilled tiger prawns and spicy Burmese crab\u2014featuring tender, bouncy seafood tossed in fiery, flavorful sauces. Sipping cocktails and enjoying local delicacies while listening to the gentle river waves offers an incomparably romantic and enchanting atmosphere.", "name": "Vintage Luxury Yacht Hotel Restaurant \u0026 Bar", "transport": "Take a taxi to the Botahtaung Jetty area; you will see the black vintage yacht moored along the riverfront."}, {"address": "Botahtaung Jetty, Strand Rd, Botataung Township, Yangon", "feature": "\u2b50 4.1 stars | Located right next to Botahtaung Pagoda, this open-air waterfront bistro is a popular spot to experience local Yangon riverfront late-night dining and beer culture. Outdoor seating offers front-row views of the sunset and night skyline over the Yangon River. Made-to-order dishes feature fresh river seafood and authentic Myanmar BBQ skewers; the grilled fish has a crispy skin and juicy, tender meat, sprinkled with local spiced salt and served with tangy dipping sauce. Paired with cold Myanmar Beer, it delivers a refreshing and exhilarating taste, making it a beloved late-night dining spot for locals and visitors alike.", "name": "Botahtaung Jetty Seafood \u0026 Beer Station", "transport": "Take a taxi to the jetty area next to Botahtaung Pagoda."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Merchant Road, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Located on the bustling Merchant Road in Botataung Township, this long-standing South Indian vegetarian eatery is renowned for its classic South Indian Dosa and diverse spiced curries. The crispy golden Dosa encases a rich, savory spiced potato filling, perfectly paired with fresh coconut chutney and tangy Sambar for incredible depth of flavor. 100% vegetarian with generous portions, it\u0027s a favorite among local Indian residents and health-conscious international tourists alike.", "name": "Ingyin Kalay Pure Vegetarian Restaurant", "transport": "Take a bus to Merchant Road Station and walk for about 3 minutes."}, {"address": "49th Street, Botataung Township, Yangon", "feature": "\u2b50 4.2 stars | Tucked away on 49th Street in Botataung, this hidden vegan gem specializes in traditional North and South Indian vegetarian cuisine. The signature Vegetarian Thali features flavorful dahl, yogurt, freshly baked naan, and fragrant rice, offering rich textures and aromatic spices that satisfy every craving without a trace of meat. Its serene atmosphere attracts travelers who love plant-based or light dining.", "name": "Gokul Pure Vegetarian Restaurant", "transport": "Turn into 49th Street from Mahabandoola Road; the sign is visible after a 2-minute walk."}, {"address": "Anawrahta Road, Botataung Township, Yangon", "feature": "\u2b50 4.1 stars | Blending Chinese and Burmese flavors, this vegetarian spot specializes in vegan noodles and handmade dim sum. Highly recommended are the Vegetarian Mushroom Noodle Soup and Mock Roast Duck Hand Roll\u2014featuring springy noodles, a sweet broth infused with deep mushroom aromas, and a fresh, non-greasy texture. It\u2019s the top pick in Botataung for vegetarians craving warm Chinese plant-based comfort food.", "name": "Eastern Park Vegetarian Restaurant", "transport": "Head north along 48th Street from Botataung Pagoda; it\u0027s about an 8-minute walk."}, {"address": "Merchant Street, Botataung Township, Yangon", "feature": "\u2b50 4.4 stars | Highlighting authentic North Indian Punjabi flavors, this pure vegetarian restaurant shines with its Paneer Butter Masala and Cheese Naan. The handmade Indian paneer is tender and velvety, absorbing a rich sauce made from fresh tomatoes and cashews with just a touch of heat. Its stellar rating stems from strict freshness standards and truly authentic taste.", "name": "Simran Punjabi Pure Veg", "transport": "Located on Merchant Street, about a 6-minute walk from the Yangon River waterfront pier."}, {"address": "Strand Road, Botataung Township, Yangon", "feature": "\u2b50 4.0 stars | Situated near the Yangon River pier, this casual vegan cafe focuses on organic plant-based salad boxes, plant-milk shakes, and vegan smoothie bowls. Its signature \u0027Burmese Rainbow Salad\u0027 pairs local organic greens with a house-made peanut-sesame dressing, delivering a refreshing, crunchy, and tangy bite\u2014the ideal spot to recharge after a riverside stroll.", "name": "Waterfront Green Leaf Cafe", "transport": "Located along the Yangon River on Strand Road, near Botataung Jetty (about a 2-minute walk)."}, {"address": "Botataung Pagoda Road, Botataung Township, Yangon", "feature": "\u2b50 4.2 stars | A traditional Burmese pure-veg eatery near Botataung Pagoda, famous for authentic Tea Leaf Salad (Lahpet Thoke) and Shan Tofu Noodles. The vegetarian Tea Leaf Salad combines fermented tea leaves, crunchy nuts, tomatoes, and shredded cabbage, delivering a complex blend of savory, tangy, and spicy flavors that showcase Myanmar\u0027s unique plant-based heritage.", "name": "Shwe Lathar Pure Veg Food", "transport": "Located on Botataung Pagoda Road, just a 3-minute walk from the entrance of Botataung Pagoda."}, {"address": "52nd Street, Botataung Township, Yangon", "feature": "\u2b50 4.3 stars | Inspired by the compassionate concept of \u0027Ahimsa\u0027 (non-harm), this trendy hipster vegan bistro serves wholesome, guilt-free plant-based dishes. The signature Plant-Based Burger comes with hand-cut sweet potato fries; the patty, made from black beans and quinoa, is hearty and flavorful, topped with house-made vegan mayo that wins over even non-vegetarians.", "name": "Ahims\u0101 Veggie Delights", "transport": "Take a taxi to the junction of 52nd Street and Merchant Road; it\u0027s about a 1-minute walk."}, {"address": "Botataung Jetty Market, Strand Road, Yangon", "feature": "\u2b50 4.1 stars | A popular vegetarian street food stall in Botataung Jetty Market, famous for fresh-fried vegetable fritters (Akyaw) and fried Shan tofu. The fritters feature a golden, crispy exterior packed with the natural sweetness of cabbage and onions; dipped in a tangy homemade plum sauce, they pack a satisfying crunch with every bite\u2014a must-try local snack along Yangon\u0027s waterfront.", "name": "Maha Veggie Street Stall", "transport": "Located inside Botataung Jetty Market; accessible via water bus or a walk along Strand Road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Strand Road, near Botahtaung Jetty, Botahtaung Township, Yangon", "feature": "\u2b50 4.3 stars | Mont Lin Maya (Couple Snacks) is one of Yangon\u0027s most iconic street foods and walking treats. Rice batter is poured into round cast-iron molds, topped with quail eggs, chickpeas, and scallions, then two halves are joined into a single sphere. Golden and crispy on the outside, soft and juicy on the inside, a single bite releases rich egg aromas and a creamy chickpea texture. With its delightful balance of sweet and savory flavors, it is beloved by both locals and tourists alike.", "name": "Mont Lin Maya Stall - Botahtaung Jetty", "transport": "Take a taxi to Botahtaung Jetty and walk for about 2 minutes."}, {"address": "Botahtaung Pagoda Road, Botahtaung Township, Yangon", "feature": "\u2b50 4.5 stars | Mohinga is celebrated as Myanmar\u0027s national dish, and this stall near the jetty simmers a rich, delicious fish soup every morning. Smooth rice noodles absorb the flavorful broth made from banana stems, turmeric, and fresh fish, served with crisp chickpea fritters (Akyaw) and hard-boiled eggs. Rich, aromatic, and pleasantly comforting with a mild kick, it is an unmissable taste of morning life along the Yangon waterfront.", "name": "Botahtaung Strand Mohinga", "transport": "Walk south for about 3 minutes from the main entrance of Botahtaung Pagoda."}, {"address": "Merchant Road, near Botahtaung Township, Yangon", "feature": "\u2b50 4.2 stars | Samosa Thoke features freshly fried, golden-crispy curry samosas chopped into small pieces, tossed with shredded cabbage, mint leaves, onions, and crispy shallot oil, then drenched in rich curry soup and lime juice. Each bite delivers a crisp crunch of samosa crust bursting with tangy, savory flavor\u2014rich yet light and non-greasy, making it an ideal waterfront stroll snack.", "name": "Botahtaung Samosa Thoke Street Vendor", "transport": "Walk east along Strand Rd for about 8 minutes from the Yangon General Post Office."}, {"address": "Strand Road Night Market Area, Botahtaung Township, Yangon", "feature": "\u2b50 4.4 stars | Shan Noodles (Shan Khauk Swe) is a beloved traditional dish available in both dry-tossed and soup versions. Tender, silky rice noodles are tossed with fragrant garlic oil, savory chicken or pork sauce, crushed peanuts, and pickled greens. Chewy, flavor-packed, and slightly tangy, it is an addictive dish perfect for enjoying hot at the night market near the jetty.", "name": "Shan Khauk Swe - Botahtaung Night Market", "transport": "Take a bus to Botahtaung Market stop and walk for 1 minute."}, {"address": "Strand Road, Botahtaung Township, Yangon", "feature": "\u2b50 4.1 stars | Traditional Burmese Pork Skewers (Wat Thar Doke) offer a unique and social street food experience. Diners gather on low stools, selecting skewers of pork, offal, and tongue simmered in aromatic broth. Melt-in-your-mouth tender, the meats are dipped in a signature tangy garlic-chili sauce, creating a juicy, spicy-sour taste loved by local foodies and adventurous travelers.", "name": "Wat Thar Doke - Botahtaung Riverside", "transport": "Located on the street opposite Botahtaung Jetty, easily accessible on foot."}, {"address": "Botahtaung Pagoda Road, Botahtaung Township, Yangon", "feature": "\u2b50 4.0 stars | Mont Lone Yay Paw (Glutinous Rice Balls with Palm Sugar) is a classic Burmese sweet street snack. Soft rice dough wraps around sweet palm sugar chunks, boiled until perfectly tender, and sprinkled with fresh coconut flakes. The chewy dough bursts with warm, rich palm sugar sweet juice, balanced by the crispness of fresh coconut.", "name": "Mont Lone Yay Paw Vendor", "transport": "Walk about 4 minutes from Botahtaung Pagoda to find this roadside dessert stall."}, {"address": "Corner of Strand Rd and 45th Street, Botahtaung Township, Yangon", "feature": "\u2b50 4.3 stars | Burmese fried dough sticks (Ekyaw Kway) feature a golden, crispy exterior with a soft, chewy center, served fresh and steaming hot. The traditional way to enjoy them is dipped into rich, sweet condensed milk tea (Laphet Yay) or sweet soy milk. The savory dough absorbs the creamy tea, creating a uniquely comforting mix of sweet and savory flavors that locals and visitors adore for breakfast.", "name": "Ekyaw Kway \u0026 Burmese Tea Stall", "transport": "Take a taxi to the intersection of 45th Street and Strand Rd."}, {"address": "Strand Road, near Inland Water Transport Pier, Botahtaung Township, Yangon", "feature": "\u2b50 4.2 stars | Specializing in traditional Burmese rice pastries, this stall\u0027s top seller is Mont Pyine Mont (Coconut Rice Cake). Made by steaming rice flour and rich coconut milk topped with toasted sesame seeds and coconut flakes, it offers a soft, velvety texture filled with natural coconut aroma. Lightly sweet and refreshing, it is a favorite treat for families and sweet lovers alike.", "name": "Mont Pyine Mont \u0026 Desserts Corner", "transport": "Located right next to the entrance of Inland Water Transport Pier, about a 2-minute walk."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Port Talbot and Coastal Docks Area"}, "dagon_diplomatic": {"categories": {"cat_1": {"items": [{"address": "124 Pyidaungsu Yeiktha Rd, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | As Yangon\u0027s most famous and iconic traditional Burmese restaurant, this spot is celebrated for its wide array of freshly prepared Burmese curries and classic snacks. The signature Mohinga features a rich broth infused with lemongrass and fresh fish, paired with crispy yellow pea fritters and smooth rice vermicelli for a deeply savory, layered flavor profile. Dozens of large-dish traditional stews\u2014such as spicy braised pork and turmeric-stewed mutton\u2014are tender, richly seasoned, and loved by both locals and international travelers, making this a top destination to experience authentic Burmese food culture.", "name": "Feel Myanmar Food (Pyidaungsu Yeiktha)", "transport": "About an 8-minute walk or a 3-minute taxi ride from the National Museum of Myanmar."}, {"address": "105/A, Pyidaungsu Yeiktha Rd, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Set in a classic, elegant garden villa in Dagon Township, Padonmar is a renowned restaurant specializing in Burmese royal cuisine and traditional home-style cooking. The must-try Tea Leaf Salad (Lahpet Thoke) is delightfully crunchy, balancing the subtle bitterness of fermented tea leaves with roasted peanuts, fried garlic slices, and white sesame seeds for a zesty, spicy, and savory appetizer. The stewed beef and coconut chicken curry feature melt-in-your-mouth tender meat bathed in rich, velvety sauces. The elegant garden dining ambiance makes it a favorite among foreign ambassadors and discerning foodies seeking refined Burmese dining.", "name": "Padonmar Restaurant", "transport": "About 600 meters from the National Museum of Myanmar, approximately a 7-minute walk."}, {"address": "290 U Wisara Rd, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | Housed in a century-old colonial wooden building that once served as the office for General Aung San, a national hero of Myanmar\u0027s independence, this classic restaurant is steeped in history. The menu shines with classic dishes such as traditional Burmese king prawn curry and Nan Gyi Thoke (thick rice noodles tossed in coconut chicken sauce), where chewy noodles absorb a fragrant, coconut-turmeric curry. Guests can savor authentic recipes while soaking in the nostalgic ambiance of a heritage space filled with vintage photos and original furnishings.", "name": "House of Memories", "transport": "About a 5-minute taxi ride (approx. 1.5 km) from the National Museum of Myanmar."}, {"address": "Nawaday St, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Located in the vibrant Nawaday neighborhood of Dagon Township, this is a hugely popular local eatery specializing in traditional Shan noodle dishes. The signature Shan Noodle Dry features soft, chewy rice noodles tossed in a rich, savory tomato-chicken sauce and topped with crushed peanuts, delivering a mild, sweet, and tangy taste with a gentle spicy kick. Additionally, the golden, freshly fried Shan Tofu Fritters are crispy on the outside and silky soft inside\u2014perfect when dipped into the house-special sweet and spicy sauce.", "name": "Aung Mingalar Shan Noodle (Nawaday)", "transport": "About a 4-minute taxi ride or a 15-minute walk from the National Museum of Myanmar."}, {"address": "Pyay Rd, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | A renowned restaurant specializing in traditional seafood dishes from Rakhine State in western Myanmar. Rakhine cuisine is famous for its vibrant, spicy, and tangy flavor profiles; the spicy stir-fried crab and sour-and-spicy seafood soup are absolute must-orders, with the broth packed with green chilies and local fresh herbs for an invigorating punch. The grilled king prawns and steamed grouper are cooked to perfection with firm, springy meat that showcases pure natural sweetness, making this a top pilgrimage spot for seafood lovers who enjoy bold flavors.", "name": "Min Lan Rakhine Seafood (Pyay Road)", "transport": "About a 5-minute taxi ride heading north along Pyay Road from the National Museum."}, {"address": "U Wisara Rd, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | A quintessential traditional Burmese tea house deeply rooted in local daily life, serving authentic Burmese milk tea alongside classic breakfast dishes. Their hot Burmese milk tea (Laphet Yay) is rich, sweet, and aromatic, perfectly balancing strong black tea with condensed milk. A must-try is the classic fried dough stick (Ea Kway), crisp on the outside and airy on the inside\u2014dipping it into hot milk tea is the most authentic local way to enjoy it. Freshly made parathas and piping-hot Mohinga are also huge hits, offering a true taste of Yangon\u0027s lively tea house social culture.", "name": "Lucky Seven Tea House (U Wisara)", "transport": "About a 10-minute walk or a 3-minute taxi ride from the National Museum of Myanmar."}, {"address": "U Wisara Rd, Dagon Township, Yangon", "feature": "\u2b50 4.1 stars | A long-established staple in Yangon famous for its delicious Chinese-Burmese fusion cuisine, particularly its legendary Cantonese-style roast duck and classic hot stir-fries. The signature roast duck features golden, crispy skin over juicy, flavorful meat that is never dry, served with sweet bean sauce and thin wraps for a burst of aroma in every bite. The restaurant also offers generous portions of hot spicy seafood pots and traditional Yang Zhou fried rice, making it a reliable benchmark for group meals and family gatherings near Dagon Township.", "name": "Golden Duck Restaurant (U Wisara)", "transport": "About a 4-minute taxi ride from the National Museum of Myanmar, located right near the South Gate of Shwedagon Pagoda."}, {"address": "Yaw Min Gyi St, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | An elegant restaurant celebrating the refined traditional culinary heritage of Myanmar\u0027s Shan State. Set within a charming, classic wooden building, its signature Shan Tofu Soup features a rich, warm yellow-pea porridge ground fresh from soybeans poured over soft, velvety rice noodles. Tossed with special fermented pickled greens and savory minced pork, the dish offers a unique depth of flavor in a clean, sophisticated atmosphere, making it a top choice for travelers trying Shan cuisine for the first time.", "name": "Shan Yoe Yar (Yaw Min Gyi)", "transport": "About a 6-minute taxi ride from the National Museum of Myanmar."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "30A Yaw Min Gyi St, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Located on famous Yaw Min Gyi St, this cafe is one of Yangon\u0027s specialty coffee pioneers. It serves home-roasted single-origin pour-overs and premium espressos, paired with dense, fragrant pandan cakes and freshly made Western brunch. The signature cold brew is smooth with subtle fruity notes, making it a favorite among local expats and coffee lovers.", "name": "Easy Specialty Coffee", "transport": "About a 15-minute walk from the National Museum of Myanmar, or take a taxi directly to Yaw Min Gyi Street."}, {"address": "31A Yaw Min Gyi St, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | A minimalist, industrial-style cafe popular among hipsters and digital nomads. Their single-origin pour-over coffee uses locally grown Arabica beans, featuring a balanced acidity and a lingering finish. The classic avocado toast with poached eggs is a hit brunch choice\u2014soft whites, rich yolks, served on freshly toasted sourdough for rich layers of texture.", "name": "The Press Office Cafe", "transport": "Located on Yaw Min Gyi Street, about a 5-minute taxi ride from the National Museum of Myanmar."}, {"address": "22 Nawaday St, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | Situated on Nawaday Street, famous for its warm wooden tones and lush plant decor. It serves a rich fusion of British and Burmese brunch, with special recommendations being the Burmese Mohinga brunch platter and latte coffee. The milk foam is silky smooth, perfectly blending subtle coffee bitterness with rich milk for an unforgettable, smooth finish.", "name": "Craft Cafe Yangon", "transport": "Located on Nawaday Street, about a 12-minute walk or 3-minute taxi ride from the National Museum of Myanmar."}, {"address": "12 Yaw Min Gyi St, Dagon Township, Yangon", "feature": "\u2b50 4.7 stars | A garden cafe focusing on healthy, organic, and vegan dining set in a peaceful and pleasant environment. The signature Acai Bowl is topped with fresh tropical fruits, nuts, and shredded coconut, offering a cool, refreshing, and delightfully layered taste. Paired with freshly squeezed cold-pressed juice or a plant-milk cappuccino, it\u0027s perfect for enjoying a light, guilt-free brunch on a sunny morning.", "name": "Nourish Cafe Yangon", "transport": "About a 4-minute taxi ride from the National Museum of Myanmar."}, {"address": "12 Nawaday St, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | A popular spot combining Italian coffee with Mediterranean light bites. Their lattes and mochas are rich and aromatic. For brunch, the American pancake stack and smoked salmon egg burger come highly recommended\u2014the pancakes are crispy outside, fluffy inside, packed with buttery aroma, and delightfully sweet when drizzled with maple syrup. A top weekend choice for tourists and local families alike.", "name": "Santino Cafe \u0026 Bistro", "transport": "Located on Nawaday Street in Dagon Township, about 1 km from the National Museum of Myanmar, taking roughly 3 to 5 minutes by taxi."}, {"address": "17 West Shwe Gon Dine Rd, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | A hidden leafy cafe near the south gate of Shwedagon Pagoda, blending modern leisure with Burmese Zen aesthetic. It offers high-quality pour-over coffee, matcha lattes, along with custom French toast and healthy oat bowls. The French toast is seared to golden perfection\u2014crispy outside and soft, custard-like inside with rich vanilla and maple aromas. An exquisite experience not to be missed in Dagon Township.", "name": "Bodhi Nava Cafe", "transport": "About a 5-minute taxi ride from the National Museum of Myanmar, close to the Shwedagon Pagoda South Gate walkway."}, {"address": "117 Dhammazedi Rd, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | The flagship store of Myanmar\u0027s famous organic brand, specializing in artisanal cheeses, handmade breads, and farm-to-table organic ingredients. Recommended for brunch is the handmade sourdough with fresh house-made cheese and Spanish ham\u2014crispy, chewy, and bursting with milky fragrance. Paired with fine espresso or fresh house yogurt, you can truly savor the ultimate fusion of local ingredients and European cuisine.", "name": "Sharky\u0027s Dagon", "transport": "About 6 minutes by car or taxi north along Pyay Road from the National Museum of Myanmar."}, {"address": "5 Nawaday St, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | A cozy cafe filled with vintage artistic charm and local artists\u0027 paintings lining the walls. It serves flavorful, rich Burmese milk tea and classic espresso. The banana peanut butter pressed toast for brunch features a golden, crispy crust and an ooey-gooey, indulgent center. The combination of crispy and soft textures keeps you coming back for more\u2014a beloved hangout spot for hipsters in Dagon.", "name": "Caf\u00e9 Nawaday", "transport": "Located on Nawaday Street, about a 4-minute taxi ride from the National Museum of Myanmar."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "124 Pyidaungsu Yeiktha St, Dagon Township, Yangon", "feature": "\u2b50 4.4 stars | This is Yangon\u0027s most famous and iconic local Myanmar cuisine restaurant, popular with both foreign tourists and local families. The restaurant operates buffet-style, with glass display counters filled with dozens of freshly stir-fried and slow-cooked traditional Myanmar curries and specialty dishes. The mutton curry and spicy stir-fried river prawns are absolute must-tries; the curry sauce is rich, velvety, and layered with complex spices, with meat stewed to melt-in-your-mouth tenderness. Pair it with the tangy and refreshing Burmese fermented tea leaf salad (Lahpet Thoke), where crunchy fried beans and fermented tea leaves create an amazingly crispy, sour, and savory flavor contrast. Here, you can sample the most authentic Burmese home-style flavors all in one place.", "name": "Feel Myanmar Food", "transport": "About an 8-minute walk from the National Museum of Myanmar, or a 3-minute taxi ride."}, {"address": "105 Kha-Yae-Bin Road, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Nestled in a quiet and elegant colonial-style vintage garden mansion in Dagon Township, Padonmar is a premier bistro for enjoying refined local Myanmar and Thai cuisine. The classic Burmese beef stew is slow-cooked in a special turmeric and onion sauce; the large chunks of beef are melt-in-your-mouth tender, fully infused with warm, aromatic spices. Another signature dish, the grilled fish, features a crispy exterior with tender, juicy flesh, elevated by a tangy lime chili dip. The outdoor garden boasts wonderful ambiance and lighting\u2014sipping craft cocktails under the gentle night breeze makes it a perfect spot for tourists to experience Yangon\u0027s romantic, slow-paced charm.", "name": "Padonmar Restaurant", "transport": "About a 4-minute taxi ride from the National Museum of Myanmar."}, {"address": "290 U Wisara Road, Dagon Township, Yangon", "feature": "\u2b50 4.2 stars | This century-old wooden colonial building was once the secret office of General Aung San, Myanmar\u0027s independence hero, radiating a rich sense of history. The restaurant offers a variety of local ethnic dishes and fine drinks. The classic Herb Roasted Chicken boasts crisp skin and succulent meat infused with subtle notes of lemongrass; the Burmese Sour \u0026 Spicy Seafood Soup is brewed with fresh prawns and local sour mushrooms, delivering an appetising, burstingly savory kick. Dining amid wooden floors and antique furniture feels like stepping back in time, making it a favorite for history buffs and foodies alike.", "name": "The House of Memories", "transport": "About a 10-minute walk or a 3-minute taxi ride from the West Gate of Shwedagon Pagoda."}, {"address": "168 West Shwedagon Road, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | Vista Bar is a highly popular rooftop open-air bistro in Dagon Township, famous for its unobstructed, up-close night views of the golden Shwedagon Pagoda. The bar serves fusion cuisine combining local Burmese flavors with Western styles, such as the Burmese Spicy Grilled Pork Ribs\u2014tender, juicy, and falling off the bone with a sweet-and-spicy mouthwatering sauce. Pair them with Burmese Samosas (crispy outside, soft inside) as bar bites for great texture. Sipping a signature gin cocktail while taking in the stunning night view makes for an unforgettable evening.", "name": "Vista Bar", "transport": "Located opposite the West Gate of Shwedagon Pagoda, about a 5-minute taxi ride from the National Museum of Myanmar."}, {"address": "Hotel G Yangon, 5 Alan Pya Pagoda Road, Dagon Township, Yangon", "feature": "\u2b50 4.5 stars | Located inside the trendy Hotel G, Babett is a chic French bistro popular among expats and local youth in Dagon Township. It seamlessly merges European bistro culture with premium local ingredients. The signature Wood-fired Cheese \u0026 Cold Cuts Platter features high-quality aged cheeses and house-cured ham paired with freshly baked crispy baguettes for a rich, savory bite. The Charcoal-Grilled Ribeye Steak boasts a perfectly charred exterior with tender, juicy pink beef inside. Complemented by a glass of selected red wine, the lively atmosphere exudes modern urban energy.", "name": "Babett Eatery \u0026 Bar", "transport": "About a 7-minute walk from Yangon Central Railway Station, or a 6-minute taxi ride from the National Museum."}, {"address": "17 Wut In Street, Dagon Township, Yangon", "feature": "\u2b50 4.6 stars | Tucked away in a quiet alley near Shwedagon Pagoda, this lush, hip cafe \u0026 bistro is renowned for healthy, natural, and creative local vegetarian and fusion dishes. Highly recommended is the Burmese Avocado \u0026 Fermented Bean Cake Toast, featuring rich local avocado spread on crispy artisan sourdough, topped with crunchy Burmese fried bean cakes for a textured, non-greasy bite. At night, it transforms into a cozy bistro serving local craft beer and botanical cocktails\u2014the ultimate spot to experience Yangon\u0027s hipster vibe and healthy eats.", "name": "Bodhi Nava Cafe \u0026 Bistro", "transport": "Near the South Gate of Shwedagon Pagoda; about a 12-minute walk or a 3-minute drive from the National Museum."}, {"address": "17-A Dhammazedi Road, Dagon Township, Yangon", "feature": "\u2b50 4.3 stars | A long-standing, traditional Burmese eatery celebrated by Yangon locals and foreign backpackers for its authentic home-style flavors. The signature Pork Curry is slow-cooked with diced pork, shallots, garlic, and Burmese spices until the fat melts into a rich, fragrant gravy poured over hot steaming rice. Every meal comes with a complimentary
