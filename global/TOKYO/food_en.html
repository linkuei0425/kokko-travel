ightly caramelized, crisp exterior and a rich, custardy interior as smooth as fine creme brulee. The top favorite, Creme Brulee French Toast, boasts a crunchy torched sugar crust that yields a burst of bittersweet caramel flavor. Pair this impressive treat with breathtaking views of Odaiba Bay for total relaxation.", "name": "LONCAFE Aqua City Odaiba", "transport": "Approx. 1-minute walk from Daiba Station on the Yurikamome Line"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1-13-11 Nishi-Azabu, Minato-ku, Tokyo", "feature": "\u2b50 4.3 stars | A world-famous restaurant renowned as the inspiration for a key scene in Quentin Tarantino\u0027s masterpiece \u0027Kill Bill\u0027, seamlessly blending traditional Japanese izakaya with an American bistro vibe. The signature hand-cut soba noodles are delightfully springy with a rich buckwheat aroma, while the live charcoal-grilled Kuroge Wagyu skewers are crispy outside, tender inside, and bursting with juices. Paired with carefully selected local sake and custom cocktails, it is wildly popular among international tourists and local trendsetters, featuring a vibrant, bustling nightlife ambiance.", "name": "Gonpachi Roppongi", "transport": "Approx. 10-minute walk from Exit 1c of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "5F AQUA CITY Odaiba, 1-7-1 Daiba, Minato-ku, Tokyo", "feature": "\u2b50 4.0 stars | A pirate-themed scenic bistro bar located on the top floor of Aqua City Odaiba, crafted like a pirate ship cabin from the Age of Discovery, filled with an adventurous and joyful atmosphere. It offers a variety of international fusion dishes and signature cocktails. The specialty \u0027Seafood Pirate Platter\u0027 includes crispy fried fish, large prawns, and charcoal-grilled lobster, boasting rich textures and fresh sweetness. The open-air terrace offers a panoramic view of Tokyo Bay and the Rainbow Bridge, making it an ideal atmospheric choice for evening dining and cocktails.", "name": "KING OF THE PIRATES Odaiba", "transport": "Approx. 1-minute walk from Odaiba Station on the Yurikamome Line"}, {"address": "1F, 3-8-8 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.4 stars | A top-tier robatayaki specialist rich in traditional Japanese local charm. Chefs display freshly delivered ingredients daily in front of the counter, grilling them right before your eyes upon ordering and serving the food using long wooden paddles. The selected \u0027Charcoal-Grilled Hokke (Atka Mackerel)\u0027 features a crispy skin with firm, tender, juicy meat, while the \u0027Grilled Hokkaido Scallops\u0027 are rich and sweet. Combining stunning visual flair with exquisite flavor, it is highly praised by international dignitaries and food lovers seeking an authentic local dining experience.", "name": "Inakaya East Roppongi", "transport": "Approx. 3-minute walk from Exit 5 of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "6F AQUA CITY Odaiba, 1-7-1 Daiba, Minato-ku, Tokyo", "feature": "\u2b50 4.2 stars | An upscale Japanese bistro created by the Suntory Group, featuring regional dishes made with seasonal ingredients from across Japan paired with premium whiskies. The signature \u0027Saga Kuroge Wagyu Steak\u0027 is tender, juicy, and infused with a rich smoky aroma, offering an unparalleled taste experience when paired with a classic Hibiki whisky cocktail. Floor-to-ceiling windows offer direct night views of the Rainbow Bridge and Tokyo Tower, set in an elegant and luxurious atmosphere.", "name": "Hibiki Odaiba", "transport": "Approx. 1-minute walk from Odaiba Station on the Yurikamome Line"}, {"address": "1F Saito Building, 5-3-2 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.2 stars | A directly managed taproom bistro in Roppongi by the famous Scottish craft beer brand, featuring over 20 tap craft beers alongside a rich selection of American pub eats. Highly recommended are the crisp, spicy, and tangy \u0027Buffalo Wings\u0027 and the \u0027Craft Beer Fish \u0026 Chips\u0027, featuring juicy, tender fish in a golden, crunchy batter. With its British industrial aesthetic, it is a hugely popular spot for Roppongi nightlife and international socializing.", "name": "BrewDog Roppongi", "transport": "Approx. 3-minute walk from Exit 3 of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "4F AQUA CITY Odaiba, 1-7-1 Daiba, Minato-ku, Tokyo", "feature": "\u2b50 4.1 stars | A trendy bistro combining Southeast Asian regional cuisines located right on the Odaiba waterfront. The signature \u0027Pad Kra Pao (Thai Basil Pork Rice)\u0027 is spicy and flavorful, becoming silky and rich when mixed with a soft-boiled egg; the \u0027Golden Seafood Pad See Ew\u0027 noodles are delightfully chewy and packed with savory sweetness. The interior evokes a Balinese resort vibe, allowing guests to sip tropical fruit cocktails while enjoying night views of Tokyo Bay, making it very popular among young crowds.", "name": "Monsoon Cafe Odaiba", "transport": "Approx. 1-minute walk from Odaiba Station on the Yurikamome Line"}, {"address": "2F Roppongi Keyakizaka-dori, 6-12-4 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.6 stars | An ultra-luxurious fine dining restaurant seamlessly blending traditional Japanese teppanyaki with Western bistro sophistication. The chef\u0027s handpicked \u0027Special Kuroge Wagyu Sirloin\u0027 is seared rapidly on a high-heat teppan grill right before your eyes, offering melt-in-your-mouth marble fat and bursting juices. Paired with carefully selected seasonal local Japanese vegetables and fine red wines in a lavish setting with meticulously detailed service, it is a luxurious temple for experiencing Japan\u0027s ultimate food and wine culture.", "name": "Roppongi Ukai-Tei", "transport": "Approx. 5-minute walk from Exit 1b of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "5F Hillside, Roppongi Hills, 6-10-1 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.3 stars | An immensely popular American-Spanish fusion bistro located in Roppongi Hills, boasting a grand space of nearly 560 square meters and an open bar. Signature offerings include \u0027Freshly Sliced Spanish Jam\u00f3n Ib\u00e9rico\u0027, savory and smooth, alongside the \u0027Charcoal-Grilled Kuroge Wagyu Burger\u0027, featuring a thick, juicy patty and a crisp toasted bun. Offering over a hundred selected wines and original cocktails at reasonable prices, the atmosphere gets livelier as the night progresses, drawing countless local office workers and foreign tourists.", "name": "RIGOLETTO BAR AND GRILL Roppongi", "transport": "Directly connected from Exit 1c of Roppongi Station on the Tokyo Metro Hibiya Line"}], "name": "Specialty Bistro Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "5-4-10 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.6 Stars | Located in Roppongi, this vegan Middle Eastern pita shop comes highly recommended by Western tourists and local vegetarians alike. The signature falafel (deep-fried chickpea balls) features a golden, crispy exterior with a rich, herb-infused chickpea filling that offers a dense, satisfying bite. Served in a soft, chewy pita bread pocket packed with fresh lettuce, red cabbage, and a special tahini sauce, it creates remarkably rich layers of flavor. The shop also offers 100% plant-based cheese and vegan sauces that taste so incredible they will amaze even meat lovers, making it the most distinctive walk-and-eat vegetarian snack in the Roppongi area.", "name": "FALAFEL BROTHERS Roppongi", "transport": "Approx. 3-minute walk from Exit 3 of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "B2F Hillside, Roppongi Hills, 6-10-1 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.3 Stars | Embracing the concept of \u0027Beauty from the Inside Out,\u0027 Mr.FARMER uses carefully selected organic vegetables delivered directly from local Japanese farms. Its vegan plant-based burgers and dairy-free soups are deeply loved by health-conscious diners. The \u0027Vegan Green Power Salad Bowl\u0027 is highly recommended\u2014drizzled with a custom plant-based vinaigrette, crisp and juicy fresh greens are tossed with high-protein nuts and quinoa, delivering a sweet, pure, and natural flavor with every bite. Featuring an American-style interior lush with green plants and large floor-to-ceiling windows drenched in sunlight, it is the perfect choice for a guilt-free vegetarian meal after shopping in Roppongi.", "name": "Mr.FARMER Roppongi Hills", "transport": "Direct access from Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F UF Building 1, 4-9-4 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.4 Stars | Famous for its refreshing Yuzu Salt Ramen, AFURI\u0027s Roppongi branch introduced a sensational hit to the plant-based dining world: the \u0027100% Rainbow Vegan Ramen.\u0027 The broth is slow-cooked for hours using an abundance of fresh seasonal vegetables, kombu kelp, and shiitake mushrooms, offering a delightful sweetness from the veggies combined with a refreshing citrusy hint of yuzu. Made with whole wheat flour, the noodles are smooth with a light, pleasing chewiness. Topped with seared seasonal vegetables and soy protein slices, the light, non-greasy soup shatters the traditional impression of heavy, salty Japanese ramen, drawing many international tourists on a dedicated pilgrimage.", "name": "AFURI Roppongi", "transport": "Approx. 1-minute walk from Exit 6 of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F Nogizaka Building, 7-4-14 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.5 Stars | Tucked right at the border of Roppongi and Nogizaka, Veganic To Go is Japan\u0027s first vegan fast-food joint focusing on 100% macrobiotic practices and zero chemical additives. The signature \u0027Vegan Teriyaki Soy Burger\u0027 features a plant-based patty made from organic soybeans. Lightly charred and grilled before being drenched in a special teriyaki sauce, it is crispy on the outside, tender, juicy, and astonishingly authentic in texture on the inside. Paired with an organic whole wheat brown rice bun and house-made vegan mayo, every bite bursts with rich, natural savory goodness. Their black bean cheese tart and gluten-free desserts are also huge hits, letting vegetarians enjoy American fast food completely guilt-free.", "name": "Veganic To Go Nogizaka", "transport": "Approx. 2-minute walk from Exit 3 of Nogizaka Station on the Tokyo Metro Chiyoda Line, or approx. 7-minute walk from Roppongi Station"}, {"address": "5-10-33 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.7 Stars | Situated in a prime location in Roppongi, Tokyo Juice specializes in made-to-order organic cold-pressed juices and vegan Acai Bowls. Its signature \u0027Rich Vegan Peanut Butter Acai Bowl\u0027 uses a base of frozen acai puree topped generously with fresh organic banana slices, fresh blueberries, handmade gluten-free granola, and rich vegan peanut butter. Ice-cold and silky smooth like sorbet, the slightly tart fruitiness blends seamlessly with the nutty richness to create a texture-packed, highly antioxidant-rich superfood treat. It is the ultimate nutrient boost for trendy office workers and health enthusiasts in Roppongi.", "name": "Tokyo Juice Roppongi", "transport": "Approx. 5-minute walk from Exit 3 of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F Roppongi Central Building, 7-4-5 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.2 Stars | GREEN BROTHERS is a minimalist, greenhouse-style salad bar infused with New York industrial aesthetics, highlighting a highly customizable plant-based dining experience. Guests can freely build their base with pesticide-free leafy greens paired with grilled tofu, chickpeas, roasted beets, and various nuts. The \u0027Vegan Sesame Warm Salad\u0027 comes highly recommended\u2014its special sesame dressing is rich and subtly sweet, while the warm, juicy vegetables burst with freshness upon taking a bite, leaving you thoroughly satisfied. The bright, spacious, and stylishly designed space makes it a favorite among expats and wellness lovers around Roppongi.", "name": "GREEN BROTHERS Roppongi", "transport": "Approx. 3-minute walk from Exit 4a of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "3F Seaside Mall, DECKS Tokyo Beach, 1-6-1 Daiba, Minato City, Tokyo", "feature": "\u2b50 4.4 Stars | Located inside the DECKS Tokyo Beach shopping mall at Odaiba Seaside Park, Bills offers stunning ocean views overlooking Tokyo Bay and the Rainbow Bridge. The restaurant offers a wealth of meat-free and vegetarian-friendly options, notably the \u0027Vegan Breakfast Plate\u0027 featuring pan-seared portobello mushrooms, roasted tomatoes, sliced avocado, and house-made fermented sourdough bread. The avocado is buttery smooth and rich, perfectly complemented by the juicy, slow-roasted portobello mushroom\u2014a sprinkle of sea salt highlights the pure, sweet essence of the ingredients. Enjoying refined, exquisite vegan cuisine against a backdrop of azure ocean views makes this an unmissable culinary highlight of any romantic Odaiba itinerary.", "name": "Bills Odaiba", "transport": "Approx. 2-minute walk from Odaiba-kaihinkouen Station on the Yurikamome Line, or approx. 5-minute walk from Tokyo Teleport Station on the Rinkai Line"}, {"address": "2-19-8 Azabujuban, Minato City, Tokyo", "feature": "\u2b50 4.4 Stars | Located right next to the Roppongi commercial district, Eat More Greens is a plant-based caf\u00e9 oozing French countryside charm, serving a menu completely free of meat, fish, eggs, and dairy products. The signature \u0027Vegan Vegetable Curry Rice\u0027 is slow-simmered with dozens of spices and natural vegetables, yielding a rich, silky sauce with a subtle hint of spice and the natural sweetness of caramelized onions. Served with brown rice and roasted seasonal vegetables, it delivers immensely layered flavors. The cozy outdoor terrace seating offers a relaxed atmosphere, making it a wonderful spot to enjoy a vegan fruit pie while taking in the elegant streetscapes of Roppongi in the evening.", "name": "Eat More Greens Azabu-Juban", "transport": "Approx. 1-minute walk from Exit 4 of Azabu-juban Station on the Tokyo Metro Namboku Line / Toei Oedo Line"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1-8-14 Azabu-juban, Minato-ku, Tokyo", "feature": "\u2b50 4.4 Stars | As the birthplace of Japanese taiyaki, this famed shop serves paper-thin crusts infused with a subtle smoky charcoal aroma. A single bite unleashes a burst of Hokkaido Tokachi red bean paste\u2014rich, smooth, and perfectly balanced in sweetness. Both tourists and locals willingly queue up for this warm, traditional street treat that is freshly baked, crispy on the outside, and soft on the inside.", "name": "Naniwaya Souhonten", "transport": "About a 1-minute walk from Exit 7 of Azabujuban Station on the Toei Oedo Line"}, {"address": "1-8-12 Azabu-juban, Minato-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Founded in 1865, this century-old specialty shop serves fried rice crackers and seasoned beans. Their freshly fried \u0027Shio Okaki\u0027 (salted fried rice crackers) fill the air with irresistible aromas, offering an incredibly crispy, savory taste that keeps you reaching for more. Featuring dozens of flavor coatings on nuts and beans with subtle sweet-and-savory layers, it is the ultimate hand-held snack while strolling around Roppongi and Azabu-Juban.", "name": "Mamegen Azabu-Juban Main Store", "transport": "About a 2-minute walk from Exit 7 of Azabujuban Station on the Toei Oedo Line"}, {"address": "3-1-9 Azabu-juban, Minato-ku, Tokyo", "feature": "\u2b50 4.2 Stars | A Michelin Bib Gourmand-recommended spot famous for premium tamagoyaki (Japanese omelet) sandwiches. Made with special dashi-infused egg omelet featuring a silky, pudding-like, juicy texture, paired with a subtle kick of mustard mayonnaise and pillowy soft bread. The melt-in-your-mouth sandwich bursts with savory-sweet dashi flavor, attracting a constant stream of takeout customers for its refined, layered taste.", "name": "Amanoya Main Store", "transport": "About a 3-minute walk from Exit 1 of Azabujuban Station on the Toei Oedo Line"}, {"address": "4-1-1 Nishi-Azabu, Minato-ku, Tokyo", "feature": "\u2b50 4.1 Stars | Located at the Nishi-Azabu intersection, this pioneer of American blended ice cream mixes fresh fruit and cookies into rich, creamy ice cream on the spot. Smooth dairy notes blend seamlessly with crunchy cookie bits and tangy-sweet fruit pieces. With its satisfying textures and colorful appearance, it has long been a favorite grab-and-go dessert during Roppongi night strolls.", "name": "Hobson\u0027s Nishi-Azabu", "transport": "About an 8-minute walk from Exit 1b of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "4F Seaside Mall, DECKS Tokyo Beach, 1-6-1 Daiba, Minato-ku, Tokyo (Inside Odaiba Takoyaki Museum)", "feature": "\u2b50 4.0 Stars | Located inside the Odaiba Takoyaki Museum, this legendary shop is the birthplace of Osaka takoyaki. It features original dashi-flavored balls served without sauce or mayonnaise. Slightly charred and bite-sized, the inside is smooth and custard-like, infused with a rich soy-dashi broth and tender octopus chunks. Highly praised by visitors seeking authentic, retro-style street bites.", "name": "Ganso Aizuya Odaiba", "transport": "About a 2-minute walk from Odaiba-kaihinkoen Station on the Yurikamome Line"}, {"address": "4F Seaside Mall, DECKS Tokyo Beach, 1-6-1 Daiba, Minato-ku, Tokyo (Inside Odaiba Takoyaki Museum)", "feature": "\u2b50 4.1 Stars | A famous Dotonbori takoyaki spot featuring an ultra-tender texture and oversized octopus chunks. Red wine is dramatically splashed onto the griddle at the finish to elevate the aroma. Served piping hot with dancing bonito flakes, biting through the outer skin reveals a moist, creamy batter wrapped around a chewy, juicy octopus tentacle, coated in savory-sweet sauce that keeps you hooked.", "name": "Takoya Dotonbori Kukuru Odaiba", "transport": "About a 2-minute walk from Odaiba-kaihinkoen Station on the Yurikamome Line"}, {"address": "1F AQUA CiTY Odaiba, 1-7-1 Daiba, Minato-ku, Tokyo", "feature": "\u2b50 4.0 Stars | A popular street dessert kiosk famous for its \u0027melt-in-your-mouth crepes\u0027. Made with a proprietary batter of wheat and almond flour, the crepes are cooked into extremely thin, soft, and delicate sheets, wrapping light whipping cream and sweet-and-sour fresh strawberries. Every bite offers an airy, milky dreaminess, making it a favorite walk-and-eat treat along the Odaiba waterfront.", "name": "Momi \u0026 Toy\u0027s AQUA CiTY Odaiba", "transport": "About a 1-minute walk from Daiba Station on the Yurikamome Line"}, {"address": "2F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto-ku, Tokyo", "feature": "\u2b50 4.2 Stars | Japan\u0027s first specialty candied strawberry shop, serving large, plump red strawberries skewered and coated in a glass-thin sugar shell. Each bite delivers a satisfying crunch followed by an explosion of fresh strawberry juice, balancing sweet crunchiness with fruity tartness. Its vibrant, camera-ready look makes it an absolute favorite photo-op snack for tourists.", "name": "Strawberry Fetish DiverCity Tokyo Plaza", "transport": "About a 5-minute walk from Daiba Station on the Yurikamome Line / About a 3-minute walk from Tokyo Teleport Station on the Rinkai Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Roppongi and Odaiba"}, "shibuya_harajuku": {"categories": {"cat_1": {"items": [{"address": "4-8-5 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | A Showa-era tonkatsu institution founded in 1965, located in the Aoyama/Harajuku area. Housed in a renovated former public bathhouse with soaring ceilings, it exudes a charming nostalgic atmosphere. Their most acclaimed dish is the premium Kurobuta (black pork) tenderloin tonkatsu. Deep-fried in high-quality vegetable oil using custom panko breadcrumbs, the crust achieves a perfectly golden, crispy texture while the meat inside is so tender it can easily be cut with chopsticks! Each bite releases rich fat and savory juices, perfectly complemented by their decades-old sweet and tangy secret sauce and shredded cabbage. A must-visit classic Yoshoku landmark for tourists and local foodies alike.", "name": "Tonkatsu Maisen Aoyama Main Store", "transport": "Approx. 3-minute walk from Exit A2 of Omotesando Subway Station"}, {"address": "2-17-6 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 stars | An authentic legendary ramen shop founded in 1952, hidden in a bustling alley off Shibuya Dogenzaka, standing as a witness to 70 years of Shibuya\u0027s evolution. The signature \u0027Chuka Soba\u0027 showcases pure Showa nostalgia: a warm, rich pork bone soy sauce broth infused with fried shallots that add a delightfully smoky onion aroma. Paired with chewy, thick-cut house-made straight noodles, crunchy bean sprouts, and tender chashu pork, this rich yet non-greasy broth has been a comforting staple for generations of local workers. It offers one of Shibuya\u0027s most iconic traditional ramen experiences.", "name": "Kiraku Ramen", "transport": "Approx. 6-minute walk from Hachiko Exit of JR Shibuya Station"}, {"address": "4F Shibuya Mark City EAST, 1-12-1 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | A renowned traditional Edomae sushi restaurant located in Shibuya Mark City that draws long queues every day. Driven by an uncompromising pursuit of freshness, top-grade seafood is delivered straight from the market daily. The signature set features an extra-long seared conger eel (anago), decadent fatty bluefin tuna (otoro), and sweet botan shrimp. The sushi rice is perfectly seasoned and structured, melting seamlessly with the fresh sashimi in your mouth. Accompanied by rich sake-lees miso soup and chawanmushi (steamed egg custard), its incredible value and authentic craftsmanship keep it consistently at the top of local food rankings.", "name": "Umegaoka Sushi No Midori Shibuya", "transport": "Directly connected to Keio Inokashira Line Shibuya Station, approx. 1-minute walk"}, {"address": "2-16-19 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 stars | Tucked away in a charming Showa-style alley in Dogenzaka, this budget-friendly deep-fried food eatery has been run by an elderly couple for decades. Featuring a rustic wooden counter and a cozy homey vibe, diners can customize set meals with options like fried chicken, tonkatsu, fried ham, or fried squid. Made fresh to order, the fried chicken is incredibly crispy on the outside and juicy on the inside, perfectly paired with a rich, tangy dark sauce to balance the richness. Unbeatable value and nostalgic warmth make this a favorite comfort-food spot for local students, office workers, and adventurous foodies.", "name": "Torikatsu Chicken", "transport": "Approx. 5-minute walk from JR Shibuya Station towards Dogenzaka"}, {"address": "2-19-2 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.0 stars | Established in 1951 (Showa 26), this iconic curry shop in Shibuya Dogenzaka has guarded its secret spice blend for decades. The signature mountain-shaped curry rice features rice sculpted into a dramatic peak topped with sliced hard-boiled egg. The dark brown sauce is slow-cooked for hours, delivering an initial smooth sweetness followed by a rich, layered, spicy kick that lingers delightfully. This classic retro Japanese spicy curry, paired with sweet and sour pickles, offers a unique flavor profile that makes it a holy grail spot for traditional Japanese curry fans.", "name": "Murugi Curry", "transport": "Approx. 7-minute walk from Hachiko Exit of JR Shibuya Station"}, {"address": "1F/2F Champs-Elys\u00e9es Harajuku Bldg 2, 1-13-21 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 stars | Founded in 1984, this legendary Kyushu tonkotsu ramen shop sits in a prime location near Harajuku Station. Featuring colorful, whimsical decor and warm wooden interiors, it holds nostalgic memories for many Harajuku visitors. The signature \u0027Zen-ire Jangara\u0027 features a silky, milky white pork bone broth simmered over long hours\u2014rich and aromatic without any gaminess. Thin, straight noodles cling perfectly to the soup, topped with melt-in-your-mouth braised pork belly (kakuni), soft-boiled ramen egg, and spicy mentaiko (spiced cod roe). The spicy mentaiko adds an incredible burst of umami and freshness to the rich broth.", "name": "Kyushu Jangara Ramen Harajuku", "transport": "Approx. 1-minute walk from Omotesando Exit of JR Harajuku Station"}, {"address": "4F Tosen Udagawacho Bldg, 4-7 Udagawacho, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 stars | Established in 1980, this famous retro Japanese-American hamburg steak specialty shop is located in bustling Udagawacho, Shibuya. Designed with a wild American Western saloon theme, its signature Cheese Hamburg Steak is made with 100% pure beef patties served sizzling on a red-hot iron skillet. Pouring the secret black pepper sauce creates an irresistible aroma and sizzling sound. Melted cheddar cheese drapes over the thick, juicy patty, bursting with beefy flavor in every bite. A beloved late-Showa staple cherished by generations of Shibuya youth and meat lovers.", "name": "Gold Rush Hamburg Steak Shibuya", "transport": "Approx. 8-minute walk from Hachiko Exit of JR Shibuya Station"}, {"address": "5-23-3 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | Tucked away in a quiet alley between Harajuku and Omotesando, this Michelin-starred restaurant is a masterclass in hand-crafted soba noodles. The master is fanatically dedicated to quality\u2014growing his own buckwheat, hand-drying it, and grinding it fresh daily in-house to craft the noodles. Signature dishes like coarse-ground hot soba and cold soba with grated radish feature a subtle greenish-brown hue and slight graininess, boasting an extraordinary nutty buckwheat aroma and wonderful chewiness. Paired with a delicate dashi dipping sauce and freshly grated wasabi, it leaves a clean, sweet aftertaste. A serene Japanese haven in the heart of the city offering the pinnacle of traditional noodle craft.", "name": "Tamawarai", "transport": "Approx. 9-minute walk from Exit 7 of Tokyo Metro Meiji-jingumae Station"}], "name": "Classic Local Institutions"}, "cat_2": {"items": [{"address": "7F Tokyu Plaza Omotesando Harajuku, 4-30-3 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 Stars | Hailed as serving \u0027the best breakfast in the world\u0027, this spot is located on the 7th floor of Tokyu Plaza with a fantastic, lush rooftop view. The signature Ricotta Hotcakes (served with fresh honeycomb butter and banana) are cloud-like, fluffy, and melt in your mouth, perfectly combining creamy ricotta with the natural sweetness of banana. Their velvety organic scrambled eggs served on crispy sourdough toast are equally heavenly\u2014a classic brunch experience you cannot miss in Harajuku.", "name": "bills Omotesando", "transport": "Approx. 4-min walk from JR Harajuku Station / Direct access from Tokyo Metro Meiji-jingumae Station"}, {"address": "1F, 6-23-4 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | A wildly popular spot famous for its \u0027Miracle Souffl\u00e9 Pancakes\u0027, made strictly with premium local Japanese ingredients and fresh eggs. Served with a signature jiggle, these pancakes are impossibly soft, light as snow ice, and melt effortlessly on the tongue. Paired with house-made strawberry vanilla whipped cream, they offer an airy, rich egg flavor that isn\u0027t overly sweet\u2014a dream dessert-brunch loved by tourists and locals alike.", "name": "FLIPPER\u0027S Harajuku", "transport": "Approx. 3-min walk from Exit 7 of Tokyo Metro Meiji-jingumae Station"}, {"address": "1F Futaba Building, 1-15-19 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.5 Stars | Tucked away in a quiet alley of bustling Shibuya, this retro Showa-style kissaten (classic Japanese coffee shop) was once highly praised by the founder of Blue Bottle Coffee. The ambiance is elegant and timeless, featuring a long wooden counter backed by hundreds of unique antique porcelain cups. Their dark-roasted single-origin pour-overs are rich and deeply complex. Pair one with their famous chiffon cake\u2014fluffy, moist, and subtly sweet\u2014to perfectly complement the coffee\u0027s bold flavor in a relaxing, nostalgic setting.", "name": "Chatei Hatou", "transport": "Approx. 3-min walk from Miyamasuzaka Exit of JR Shibuya Station"}, {"address": "1-16-11 Tomigaya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 Stars | Originating from Oslo, Norway, this top-tier Scandinavian coffee brand was famously praised by the New York Times as \u0027worth flying for.\u0027 Housed in a charming wooden house between Yoyogi Park and Shibuya, Fuglen specializes in light roasts that highlight natural fruity and floral notes, resulting in a smooth, vibrant finish. For brunch, enjoy crispy Norwegian waffles or Nordic cold-cut sandwiches on the sunlit outdoor seating for an effortlessly stylish morning routine.", "name": "Fuglen Tokyo (Shibuya Main Store)", "transport": "Approx. 5-min walk from Tokyo Metro Yoyogi-koen Station / Approx. 15-min walk from JR Shibuya Station"}, {"address": "5-17-13 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 Stars | Situated in the heart of Harajuku\u0027s Cat Street, this stylish cafe features an eye-catching industrial-style central bar. Dedicated exclusively to single-origin beans, they offer espressos, pour-overs, and cold brews with vibrant, balanced notes of fruit and nuts. Their most famous brunch treat is the daily limited \u0027NY Ring\u0027 (cronut)\u2014crispy and glazed on the outside, soft and chewy on the inside\u2014making it the ultimate pairing with a fresh pour-over coffee while strolling Cat Street.", "name": "The Roastery by Nozy Coffee", "transport": "Approx. 8-min walk from JR Harajuku Station / Approx. 5-min walk from Tokyo Metro Meiji-jingumae Station"}, {"address": "2-19-2 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Tucked inside a charming, greenery-draped standalone building in Jingumae, this hipster cafe is instantly recognizable by its signature pear logo. Must-try brunch options include their Pork Katsu Sandwich\u2014crispy outside, wonderfully tender and juicy inside\u2014and their delicate crepes. Pan-fried to a golden crisp around the edges with subtle notes of butter and powdered sugar, the crepes are pure bliss when paired with a fresh Iced Americano.", "name": "NEEL Harajuku (Jingumae)", "transport": "Approx. 10-min walk from Tokyo Metro Meiji-jingumae Station / Approx. 12-min walk from JR Harajuku Station"}, {"address": "1F, 6-15-8 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Located in a back alley of Harajuku, this vintage American-style bakery cafe exudes cozy, romantic country vibes. Offering a huge array of baked goods and brunch options, their top hits are the croissant sandwiches and classic American donuts. The croissants are wonderfully flaky and buttery, stuffed with fresh ham and rich cheese for amazing texture, while their pastries are dense, moist, and delightfully flavorful\u2014a hit among trendy locals and tourists.", "name": "The Little Bakery Tokyo", "transport": "Approx. 5-min walk from Tokyo Metro Meiji-jingumae Station"}, {"address": "Inside Kitaya Park, 1-7-3 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Situated inside Kitaya Park, this location is Blue Bottle\u0027s first cafe in Tokyo set surrounded by park greenery. The two-story minimalist building features large floor-to-ceiling windows flooded with natural light. Enjoy pour-over coffee brewed to order with crisp, clean floral and fruity notes. For brunch, the grilled cheese sandwich and Liege waffles are highly recommended\u2014crispy, golden toast with melty, gooey cheese enjoyed under the shade of park trees makes for a delightfully relaxing morning.", "name": "Blue Bottle Coffee Shibuya Park", "transport": "Approx. 7-min walk from JR Shibuya Station"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "23-7 Maruyamacho, Shibuya City, Tokyo", "feature": "\u2b50 4.4 stars | Located near Shinsen in Shibuya, Kaikaya by the Sea is a unique gastropub blending Western bistro style with traditional Japanese seafood cuisine. Sourced fresh daily directly from Sagami Bay, their fresh sashimi and special tuna steak with custom garlic sauce deliver stunning flavors that amaze both tourists and local foodies. Tender, juicy meat bursting with rich ocean flavors paired with handpicked local sake or white wine creates a lively and cheerful dining atmosphere\u2014perfect for enjoying an authentic Tokyo seafood bistro experience with friends at night.", "name": "Kaikaya by the Sea", "transport": "About an 8-minute walk from Tokyu Den-en-toshi Line / JR Shibuya Station (Dogenzaka-ue Exit), or a 2-minute walk from Shinsen Station."}, {"address": "NC Building 2F, 1-9-4 Jinnan, Shibuya City, Tokyo", "feature": "\u2b50 4.3 stars | Created by a world-renowned bartender team, SG Low is an iconic modern Japanese gastropub in Shibuya. It cleverly fuses New York bar culture with traditional Japanese izakaya style. Signature dishes like the rich, aromatic \u0027Bone Marrow Beef Fried Rice\u0027 and French-influenced Japanese appetizers feature distinct layers of texture. Paired with custom Highballs, it offers a trendy yet utterly delicious experience that is hugely popular among Tokyo\u0027s fashionable youth and international travelers.", "name": "SG Low", "transport": "About a 7-minute walk from JR Shibuya Station (Hachiko Exit)"}, {"address": "E. Space Tower 14F, 3-6 Maruyamacho, Shibuya City, Tokyo", "feature": "\u2b50 4.1 stars | Perched on a high floor along Dogenzaka in Shibuya, Gonpachi offers a breathtaking view of the Shibuya nightscape alongside an elegant traditional Japanese ambience. It specializes in refined Japanese regional cuisine, including fresh hand-rolled soba noodles, charcoal-grilled tender skewers, and flavorful Kuroge Wagyu beef dishes. The soba is smooth with a rich buckwheat aroma, while the skewers are perfectly charred on the outside and tender inside with a balanced savory-sweet sauce. Combining the lively vibe of an izakaya with the elegance of a bistro, it is a top choice for experiencing authentic Japanese culinary culture.", "name": "Gonpachi Shibuya", "transport": "About an 8-minute walk from JR Shibuya Station (Dogenzaka-ue Exit)"}, {"address": "TRUNK(HOTEL) 1F, 5-31 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.2 stars | Tucked away in the trendy alleys of Jingumae, Harajuku, this boutique hotel bistro offers fusion cuisine combining local Tokyo ingredients with modern American style. Featuring carefully selected aged beef from across Japan and organic vegetables from the Tokyo suburbs, the signature \u0027Charcoal-Grilled Aged Steak\u0027 has an enticing smoky crust opening to juicy, tender pink meat. With a lush outdoor terrace and stylish interior design, it allows you to elegantly enjoy exquisite regional dishes while strolling through Harajuku.", "name": "TRUNK (KITCHEN)", "transport": "About a 6-minute walk from Exit 7 of Tokyo Metro Meiji-jingumae (Harajuku) Station"}, {"address": "3-20-1 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.2 stars | Hidden in Harajuku\u0027s artistic alleys, Sakura Tei is an art bistro combining a street art gallery with traditional Kanto cuisine. Walls decorated with colorful graffiti murals by international artists set the scene for classic local favorites like Okonomiyaki and Monjayaki. Guests can enjoy the fun of cooking on the teppan grill; the Monjayaki has crispy edges and a creamy, rich center releasing tempting aromas of dashi and melted cheese. Paired with a cold local Japanese craft beer, it is a feast for both the eyes and palate.", "name": "Sakura Tei Harajuku", "transport": "About an 8-minute walk from JR Harajuku Station (Takeshita Exit), or a 5-minute walk from Meiji-jingumae Station"}, {"address": "2-22-6 Dogenzaka, Shibuya City, Tokyo", "feature": "\u2b50 4.0 stars | Tucked in the Hyakukenden alleys of Shibuya, Shibuya Oiran is a trendy bistro blending DJ music culture with local Japanese food. Beyond offering a diverse selection of fine drinks, their signature \u0027Oiran Special Curry\u0027 and Japanese tapas are astonishingly flavorful. The curry sauce is rich, aromatic, and subtly spiced, pairing perfectly with chewy white rice. With great lighting and music, it is a favorite gathering spot for local musicians and fashion icons before kicking off their nightlife.", "name": "Shibuya Oiran", "transport": "About a 6-minute walk from JR Shibuya Station (Hachiko Exit)"}, {"address": "Hoko Building 1F, 28-2 Sakuragaokacho, Shibuya City, Tokyo", "feature": "\u2b50 4.5 stars | Renowned as one of Shibuya\u0027s most hard-to-book top-tier Japanese bistros, Kotaro is famous for its meticulously crafted seasonal regional dishes paired with premium sake. The signature \u0027Kotaro Special Potato Salad\u0027 features smoked bacon and soft-boiled ramen eggs, offering a velvety texture with rich layers of flavor. The fresh-fried \u0027Seasonal Fish Tempura\u0027 boasts a light, crispy batter that bursts with intense ocean flavors upon first bite. With a warm and welcoming ambiance, every dish showcases master craftsmanship, making it a dream destination for an authentic Tokyo food and drink culture experience.", "name": "Kotaro Shibuya", "transport": "About a 6-minute walk from JR Shibuya Station (South Gate West Exit)"}, {"address": "Izumi Hoshino Building B1F, 2-29-13 Dogenzaka, Shibuya City, Tokyo", "feature": "\u2b50 4.0 stars | Located underground in Shibuya, BEE8 is a classic stylish bistro featuring luxury aquariums and mood lighting in a basement setting, creating a mysterious and romantic ambiance. The kitchen focuses on Italian-French style regional dishes using seasonal Japanese ingredients, such as melt-in-your-mouth \u0027Seared Wagyu Beef Carpaccio\u0027 and rich \u0027Mentaiko Cream Pasta\u0027. Complemented by a curated selection of wines and original cocktails, it allows guests to indulge in an elegant, tipsy evening right in the heart of bustling Shibuya.", "name": "BEE8 Shibuya", "transport": "About a 5-minute walk from JR Shibuya Station (Hachiko Exit)"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "B1F Shibuya PARCO, 15-1 Udagawacho, Shibuya City, Tokyo", "feature": "\u2b50 4.6 stars | Located in the basement food hall of Shibuya PARCO, this popular vegan izakaya shatters the stereotype that vegetarian food is bland. Their signature \u0027Soy Karaage\u0027 (fried soy protein) boasts a golden, crispy exterior and juicy interior infused with irresistible garlic and ginger flavors, dangerously close to real chicken in texture. The vegan gyoza features thin skin, generous filling, and a perfectly seared aroma. Boasting a lively atmosphere, it is hugely popular among locals and international tourists alike, making it an excellent spot to experience Japanese nightlife and modern plant-based cuisine.", "name": "Vegan Izakaya Masaka", "transport": "Approx. 5-minute walk from Hachiko Exit of JR Shibuya Station"}, {"address": "5-1-17 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.4 stars | A tasteful vegan restaurant tucked away in the alleyways of Omotesando, specializing in refined \u0027Ichiju-Sansai\u0027 (one soup, three dishes) set meals made with Japanese organic brown rice and seasonal organic vegetables. Their signature \u0027Steamed Steamer Basket Vegetables Set\u0027 allows you to savor the natural sweetness of vegetables, paired with a special sesame dipping sauce and fragrant, chewy brown rice. It offers a rich texture without feeling heavy. The elegant, minimalistic wooden decor and lush green garden provide a relaxed, healthy setting for busy tourists and locals to enjoy afternoon tea or meals.", "name": "Brown Rice by Neal\u0027s Yard Remedies", "transport": "Approx. 1-minute walk from Exit A1 of Tokyo Metro Omotesando Station"}, {"address": "1F Shibuya Stream, 3-21-3 Shibuya, Shibuya City, Tokyo", "feature": "\u2b50 4.5 stars | Classic Middle Eastern street food gets a vibrant new life in Shibuya. Specializing in vegan pita pockets, this spot is a favorite among Western tourists and fitness enthusiasts. The freshly fried falafels are incredibly crispy on the outside, dense and soft on the inside, bursting with rich cumin and coriander aromas. Packed with fresh shredded purple cabbage, hummus, and signature vegan tahini sauce, every bite is delightfully juicy, tangy, and satisfyingly chewy.", "name": "FALAFEL BROTHERS Shibuya", "transport": "Direct access to Shibuya Stream 1F from Exit C2 of JR Shibuya Station"}, {"address": "1F Harajuku 108 Bldg, 3-38-11 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.3 stars | Hidden between Gaienmae and Harajuku, this stylish vegan cafe is committed to 100% plant-based and eco-friendly organic ingredients. The popular \u0027Vegan Burger\u0027 features a custom soy patty topped with homemade vegan cheese and rich BBQ sauce, served in a lightly toasted, aromatic bun. The thick, juicy patty offers a smoky grilled flavor rivaling traditional meat burgers. Featuring a retro American industrial style, it is a photo-worthy haven for Harajuku trendsetters and international travelers to relax and gather.", "name": "Organic Table by LAPAZ", "transport": "Approx. 6-minute walk from Exit 3 of Tokyo Metro Gaienmae Station, or 12-minute walk from Harajuku Station"}, {"address": "2F Laforet Harajuku, 1-11-6 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.2 stars | Located inside Laforet Harajuku\u2014the trend capital of the neighborhood\u2014this trendy pink-themed vegan fast-food spot transforms Chinese street food Gua Bao and Japanese ramen into chic plant-based delights. The signature \u0027Vegan Sesame Mala Ramen\u0027 features a broth simmered with rich sesame paste and aromatic spices, delivering a creamy, spicy, and smooth taste. The \u0027Plant-Based Meat Gua Bao\u0027 pairs tender plant protein with sweet-and-sour sauce inside a chewy steamed bun. With its eye-catching pink aesthetic and grab-and-go convenience, it\u0027s a top snack choice for young shoppers and tourists.", "name": "Chipoon Vegan Ramen \u0026 Gua Bao", "transport": "Approx. 1-minute walk from Exit 5 of Tokyo Metro Meiji-jingumae Station"}, {"address": "103 Royal Palace Shibuya, 15-10 Uguisudanicho, Shibuya City, Tokyo", "feature": "\u2b50 4.4 stars | An iconic classic vegan home-style diner in Shibuya, tucked away in a quiet alley in Uguisudanicho. Its \u0027Vegan Plate\u0027 uniquely blends Japanese home cooking with Middle Eastern spice influences. The signature crispy soy meat nuggets are crunchy outside and tender inside, served with homemade vegan tartar sauce for a rich yet non-greasy bite. Paired with side dishes and mixed grain rice, it offers delightfully complex flavors. The retro space, filled with vinyl records and hip artistic vibes, attracts music lovers, art enthusiasts, and travelers alike.", "name": "Nagi Shokudo", "transport": "Approx. 8-minute walk from West Exit of JR Shibuya Station"}, {"address": "2F, 1-13-21 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.3 stars | A classic ramen establishment that specially crafted a vegan series so plant-based diners can enjoy authentic Japanese ramen. Their \u0027Kumamoto-Style Vegan Black Garlic Oil Ramen\u0027 features a slow-simmered broth made from vegetables and soy milk, topped with fragrant roasted black sesame/garlic oil for a deep, creamy, non-greasy finish. The special egg-free noodles are chewy and absorb the soup beautifully, accompanied by soy chashu, abundant wood ear mushrooms, and scallions. It is a top-choice hot soup dish in Harajuku.", "name": "Kyushu Jangara Harajuku - Vegan Ramen", "transport": "Approx. 1-minute walk from Takeshita Exit of JR Harajuku Station"}, {"address": "B2F Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya City, Tokyo", "feature": "\u2b50 4.2 stars | A famous vegan French-Hawaiian culinary brand hailing from Hawaii, located in the basement food hall of Shibuya Scramble Square. Featuring \u0027Vegan Hawaiian Curry\u0027 and \u0027Plant-Based Steak Bento\u0027, the curry broth is simmered with fruits, vegetables, and proprietary spices, offering a rich, sweet, and lightly spiced flavor profile paired with seared tofu or plant-protein steaks. Beautifully presented and perfect for takeout, it is extremely popular among local office workers and travelers seeking delicious vegan meal boxes.", "name": "Peace Cafe Tokyo (Shibuya)", "transport": "Direct access to Shibuya Scramble Square from Exit B6 of JR Shibuya Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1-6-15 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 stars | As the most iconic classic grab-and-go dessert on Harajuku Takeshita Street, MARION CREPES has been a must-eat street food for tourists and local youth since its founding in 1977. Made to order, the wheat crepe skin is cooked until golden and crispy at the edges while staying moist and tender inside. It is packed with rich whipped cream, fresh banana slices, and drizzled with decadent chocolate sauce. One bite delivers a delightful interplay of warm and cold textures paired with wheat aroma and sweet cream. Smooth, refreshing, and non-greasy, its classic cone packaging makes it easy to eat on the go\u2014an essential foodie memory when experiencing Harajuku\u0027s pop culture.", "name": "MARION CREPES Harajuku Takeshita Street Branch", "transport": "Approx. 3-min walk from Takeshita Exit of JR Yamanote Line \u0027Harajuku Station\u0027"}, {"address": "1-16-8 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | This official directly-operated store for freshly fried Calbee potato chips draws endless crowds eager to experience ultimate freshness and crunch. The most popular item, \u0027Freshly Fried Potato Chips\u0027, is served piping hot, golden, and crispy with an insanely satisfying crunch. Topped with rich Hokkaido butter and savory cheese, or sweet brown sugar honey, the warm melting cheese over crispy chips creates a delicious sweet and savory harmony. They also serve Poterico\u2014hot potato sticks that are crispy on the outside and soft, fluffy inside like freshly cooked potatoes. It\u0027s the ultimate savory walking snack on Takeshita Street.", "name": "Calbee Plus Harajuku Takeshita Street Branch", "transport": "Approx. 5-min walk from Takeshita Exit of JR Yamanote Line \u0027Harajuku Station\u0027"}, {"address": "2-9-1 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | A wildly popular bakery taking Tokyo by storm with its extraordinary \u0027raw\u0027 donuts, offering a melt-in-your-mouth cloud-like lightness that shatters conventional donut expectations. Using a proprietary pumpkin puree dough and high-hydration baking technique, these freshly made raw donuts are impossibly light and airy, melting instantly on the tongue with a subtle milky sweetness and wheat aroma. The classic original flavor is dusted with fine powdered sugar\u2014fluffy, chewy, and not greasy at all. Filled varieties like rich hazelnut chocolate or Uji matcha cream burst with luscious flavor, making it an unmissable takeaway treat in Shibuya.", "name": "I\u0027m donut? Shibuya", "transport": "Approx. 8-min walk from Miyamasuzaka Exit of JR \u0027Shibuya Station\u0027"}, {"address": "5-1-6 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 stars | Hailing from New York, this premier lobster roll shop is a hugely popular gourmet street food spot near the border of Omotesando and Harajuku. Featuring wild-caught Maine seafood, plump and juicy chilled lobster claw meat is packed into a warm, buttered bun toasted crispy outside and soft inside, finished with a dash of signature lemon butter and herb seasoning. Each bite offers an exciting contrast of hot bun and chilled, sweet seafood, rich with buttery goodness. Highly beloved by both local and international travelers.", "name": "LUKE\u0027S LOBSTER Omotesando", "transport": "Approx. 3-min walk from Exit A1 of Tokyo Metro \u0027Omotesando Station\u0027"}, {"address": "6-14-2 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.0 stars | Japan\u0027s classic iconic takoyaki chain, the Harajuku location features a spacious standing-drink and takeaway area, perfect for a quick energy boost while shopping. Its signature feature is a high-heat oil finish that makes the outer shell incomparably golden and crispy, while keeping the inside silky soft, piping hot, and filled with large, bouncy octopus chunks. Topped with savory-sweet takoyaki sauce, specially formulated mayonnaise, and a generous heap of dancing bonito flakes, each hot, crispy bite bursts with flavor. Seasonal variations like Mentaiko Cheese or Scallion Ponzu add delicious layers, making this a street food favorite for all ages.", "name": "Tsukiji Gindaco Harajuku", "transport": "Approx. 3-min walk from Exit 7 of Tokyo Metro \u0027Meiji-jingumae Station\u0027"}, {"address": "1-16-5 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 stars | Japan\u0027s first candied fruit (tanghulu) specialty shop, turning traditional candied fruit into Harajuku\u0027s hottest Instagrammable street dessert. Selecting exceptionally sweet and juicy fresh strawberries coated in a thin, translucent layer of hard sugar candy, each bite yields an addictive crunch as the candy shell shatters, releasing a burst of rich, sweet-and-sour strawberry juice. Beyond the classic flavor, options like condensed milk or cheese foam toppings elevate the experience. Its vibrant colors and stylish presentation make it a favorite photo-worthy street food among youth.", "name": "Strawberry Fetish Harajuku Takeshita Street Branch", "transport": "Approx. 4-min walk from Takeshita Exit of JR Yamanote Line \u0027Harajuku Station\u0027"}, {"address": "MIYASHITA PARK North 2F, 6-20-10 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | Located at MIYASHITA PARK, this American streetwear-inspired ice cream bar seamlessly blends urban street culture with custom culinary treats. Built on a foundation of rich Hokkaido milk soft-serve ice cream, customers can mix in their choice of American breakfast cereals, cookies, or chocolates, pulverized and blended via a special machine. The resulting texture is extraordinarily thick and dense, with every bite filled with crunchy cereal bits and rich dairy flavor\u2014sweet, satisfying, and complex. Served in a sleek, modern tall cup, it\u0027s a stylish street snack for fashion-forward visitors in Shibuya.", "name": "KITH Treats Tokyo", "transport": "Approx. 3-min walk from Hachiko Exit of JR \u0027Shibuya Station\u0027"}, {"address": "6-8-7 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.5 stars | Renowned as one of Tokyo\u0027s top three Mame Daifuku specialty shops, this traditional Showa-era wagashi shop is tucked away in the backstreets of Harajuku. Its signature Mame Daifuku features a thick, chewy outer skin with a natural sticky rice aroma, enclosing a dense, velvety red bean paste made from Tokachi red beans with just the right amount of sweetness. Large red peas embedded in the skin add a subtle saltiness and pleasant crunch. The interplay of soft, savory-salty mochi skin and sweet, smooth filling creates a flawless balance. Made entirely by hand in limited daily quantities, they often sell out before noon\u2014a dream traditional street confection for foodies and tourists alike.", "name": "Mizuho Harajuku", "transport": "Approx. 5-min walk from Exit 7 of Tokyo Metro \u0027Meiji-jingumae Station\u0027"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Shibuya and Harajuku"}, "shinjuku": {"categories": {"cat_1": {"items": [{"address": "3-31-8 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Founded in 1924, this legendary tempura institution boasts nearly a century of artisanal frying technique. The signature fried shrimp and seasonal vegetables feature an extraordinarily crispy yet light batter that gives a satisfying crunch with every bite, while the seafood inside remains succulent, juicy, and fresh. Richly aromatic yet non-greasy sesame oil coats each piece, perfectly paired with a sprinkle of rock salt or sweet tempura dipping sauce for superb layers of flavor. A timeless top choice for tourists and long-time Shinjuku locals alike.", "name": "Tempura Tsunahachi Souhonten", "transport": "Approx. 3-minute walk from JR Shinjuku Station East Exit"}, {"address": "Nakamuraya Bldg., 3-26-13 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | A century-old Yoshoku (Western-style Japanese cuisine) landmark and the birthplace of authentic Indian curry in Japan. Its iconic \u0027Pure Indian Style Chicken Curry\u0027 simmers tender whole chicken pieces with over 20 spices for hours. The sauce is rich, slightly spicy, with a gentle tartness from yogurt, making the chicken fall-off-the-bone tender. Paired with specially selected rice steamed at high heat, it offers a deeply layered and satisfying flavor profile that draws food lovers back generation after generation.", "name": "Shinjuku Nakamuraya Main Store", "transport": "Directly connected via Underground Exit A6 of JR Shinjuku Station"}, {"address": "1-2-11 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Tucked inside Omoide Yokocho, this charcoal-grilled eel skewer specialist has been operating since 1948. Master chefs precisely skewer various parts of the eel\u2014including the head, liver, belly, and fins\u2014and grill them over Binchotan charcoal until lightly charred and crispy. The skin bursts with smoky charcoal aroma and sweet sauce glaze, while the flesh remains tender, rich, and flavorful. It pairs divine with a cold beer, drawing crowds looking for an authentic late-night diner vibe and vintage charm.", "name": "Kabuto Grilled Eel Skewers", "transport": "Approx. 2-minute walk from JR Shinjuku Station West Exit (Inside Omoide Yokocho)"}, {"address": "3-26-11 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Established in 1885, this century-old fruit establishment is renowned for its exquisite fruit parfaits. The signature Crown Melon Parfait uses top-grade Shizuoka Crown Melons, featuring sweet, remarkably juicy, and fine-textured flesh paired with luscious homemade vanilla ice cream and smooth whipped cream. It delivers a perfectly balanced symphony of fruity and creamy notes. This elegant fruit palace remains a dream destination for local dessert lovers and international travelers.", "name": "Takano Fruit Parlor Main Store", "transport": "Approx. 1-minute walk from JR Shinjuku Station East Exit"}, {"address": "10F SUZUYA Bldg., 1-23-15 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | Founded in 1954, this legendary tonkatsu eatery invented the nationally famous \u0027Tonkatsu Chazuke with Stir-fried Soy Sauce Cabbage\u0027. The golden, crispy tonkatsu boasts a thick, juicy pork cutlet topped with sweet cabbage stir-fried on high heat with a secret soy sauce. Mid-meal, hot green tea (sencha) is poured over the dish to transform it into a tea-rice soup (chazuke). The savory cabbage notes blend gracefully with the aromatic green tea, creating a refreshing, multi-layered classic that local Shinjuku foodies cherish.", "name": "Tonkatsu Suzuya Shinjuku Main Store", "transport": "Approx. 3-minute walk from JR Shinjuku Station East Exit"}, {"address": "3-22-10 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Opened in 1963, this cozy, homestyle Yoshoku restaurant exudes a warm nostalgic ambiance. The signature Stuffed Cabbage Roll is slow-simmered in stock and a secret white sauce until melt-in-your-mouth tender, wrapping around a rich, juicy beef filling. Perfectly seasoned with creamy savory notes, it pairs amazingly well with a bowl of white rice, providing comforting flavors loved by local office workers and families for decades.", "name": "Acacia Shinjuku Main Store", "transport": "Approx. 2-minute walk from JR Shinjuku Station East Exit"}, {"address": "Yugentei Bldg., 1-10-7 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 stars | The flagship location of Jojoen, Japan\u0027s iconic luxury yakiniku brand, which pioneered elevating traditional Korean BBQ into a high-end dining culture. Prime marbled Wagyu steaks are grilled to golden perfection on the outside while remaining tender and juicy inside, melting instantly on the tongue with luscious sweetness. Complemented by their house-made savory BBQ sauce and crispy signature salad, both ingredient quality and service are top-notch\u2014making it the ultimate pick for food lovers celebrating a special occasion.", "name": "Jojoen Yugentei Shinjuku", "transport": "Approx. 6-minute walk from JR Shinjuku Station East Exit"}, {"address": "2F, 1-1-10 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Tucked away on the second floor in Shinjuku Golden Gai with rich Showa-era nostalgic vibes, this is one of the legendary birthplaces of Tokyo\u0027s dried sardine (niboshi) ramen. The broth is slow-brewed using over 20 types of dried sardines, creating an exceptionally rich, thick soup with a pleasantly bitter yet savory umbrella of seafood aromas. Featuring a combination of ultra-wide flat noodles (\u0027Ittanmomen\u0027) and medium-thick curly noodles, it delivers a chewy, bouncy texture that absorbs the soup perfectly. Topped with a custom spicy sauce, its bold flavor profile draws ramen enthusiasts from all over the world.", "name": "Sugoi Niboshi Ramen Nagi Shinjuku Golden Gai Main Shop", "transport": "Approx. 6-minute walk from JR Shinjuku Station East Exit"}], "name": "Iconic Local Classic Eateries"}, "cat_2": {"items": [{"address": "1F, NEWoMan Shinjuku, 4-1-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A minimalist open space located on the 1st floor of NEWoMan, serving high-quality, made-to-order single-origin pour-over coffee. Highly recommended paired with hot waffles\u2014crispy on the outside and soft inside\u2014and rich caf\u00e9 latte. The smooth coffee carries nutty and fruity notes, making it extremely popular with both local commuters and international tourists.", "name": "Blue Bottle Coffee Shinjuku", "transport": "Approx. 1 min walk from JR Shinjuku Station Southeast Exit"}, {"address": "B1F, Yamamoto Bldg, 3-1-17 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Shinjuku\u0027s most legendary French toast specialty shop! The bread is soaked thoroughly in egg mixture for a long time and seared until lightly charred on the outside, while the inside remains moist and custard-like, offering an ultra-tender, melt-in-your-mouth texture. Served with fresh cream and custom maple syrup, it\u0027s sweet without being cloying\u2014a super popular brunch hotspot with constant lines.", "name": "Cafe AALIYA", "transport": "Approx. 1 min walk from Tokyo Metro Shinjuku-sanchome Station Exit A1"}, {"address": "2F, Lumine 2, 3-38-2 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | An upscale brunch brand crowned as the \u0027Queen of Breakfast in New York\u0027. The signature Eggs Benedict paired with custom Hollandaise sauce features rich yolk flowing out as you cut open the poached eggs, creating an exceptionally smooth texture. The special French toast is slightly crispy outside and fluffy inside. With its elegant and bright setting, it offers a refined and luxurious brunch experience.", "name": "Sarabeth\u0027s Lumine Shinjuku", "transport": "Direct access to Lumine 2 2F from JR Shinjuku Station South Exit"}, {"address": "B1F, Shinjuku Nomura Bldg, 1-26-2 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A specialty cafe founded by World Barista Champion Paul Bassett. Equipped with a large in-house roaster, it serves premium espresso and velvety caffe lattes. For brunch, try their fluffy artisanal pancakes or freshly made sandwiches\u2014crispy outside with rich fillings and distinct layers of flavor\u2014making it the top choice for coffee lovers in Nishi-Shinjuku\u0027s business district.", "name": "Paul Bassett Shinjuku", "transport": "Approx. 4 mins walk from Tokyo Metro Marunouchi Line Nishi-Shinjuku Station Exit 2"}, {"address": "2F, NEWoMan Shinjuku, 4-1-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A popular specialty coffee shop from Santa Cruz, California. Focusing on light-roast single-origin beans, their coffee features a unique refreshing fruity acidity and floral aroma. The freshly pressed grilled cheese sandwich is golden and crispy on the outside with gooey, savory cheese inside\u2014a perfect refreshing pair with cold brew that attracts trendy crowds and coffee enthusiasts.", "name": "Verve Coffee Roasters Shinjuku", "transport": "Directly connected to JR Shinjuku Station Shin-South Gate"}, {"address": "1-2-6 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | A refined Showa-style retro kissaten tucked away in the bustling West Exit area of Shinjuku. Using house-charcoal-roasted beans, their open-flame pour-over coffee is deep, rich, and intensely aromatic. Paired with thick-cut buttered toast\u2014crispy outside and soft inside, spread with melted butter for a savory delight\u2014it showcases the charming warmth and unique quality of a traditional Japanese kissaten.", "name": "Tajimaya Coffee House Main Store", "transport": "Approx. 2 mins walk from JR Shinjuku Station West Exit"}, {"address": "4F, NEWoMan Shinjuku, 4-1-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | A cozy brunch restaurant combining local Kamakura ingredients with lush greenery design. Featuring handmade American pancakes and fresh brunch platters, the thick, soft pancakes carry a rich milky aroma, paired with crispy bacon and sunny-side-up eggs for an irresistible sweet and savory blend in a spacious, resort-like atmosphere.", "name": "GARDEN HOUSE Shinjuku", "transport": "Directly connected to NEWoMan 4F from JR Shinjuku Station Shin-South Gate"}, {"address": "1F, Kasumi Bldg, 2-5-16 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A cozy Japanese-style indie cafe near Shinjuku Gyoen. Offering delicate Japanese lunch plates and homemade desserts, their signature caramel cheesecake features a lightly burnt crust with a rich, silky filling bursting with cheese aroma. Paired with a custom latte, it provides a relaxing and soothing brunch time for visitors strolling around Shinjuku Gyoen.", "name": "BOWLS cafe", "transport": "Approx. 3 mins walk from Tokyo Metro Shinjuku-sanchome Station Exit C1"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1-2-7 Nishi-Shinjuku, Shinjuku-ku, Tokyo (Inside Omoide Yokocho)", "feature": "\u2b50 4.4 stars | A long-established eel skewer specialty shop located inside Shinjuku\u0027s Omoide Yokocho with decades of history. The shop carefully selects fresh eel and skewers various parts\u2014including the head, fins, belly, and liver\u2014slow-roasting them over Binchotan charcoal until crispy on the outside and tender inside. The special sauce balances sweet and savory perfectly, making both the kabayaki (tare sauce) and shio (salt) flavors enchanting. Paired with warm Japanese sake or an ice-cold beer, the smoky charcoal aroma and rich fat melt in your mouth\u2014an ultimate Showa-era nostalgic experience beloved by locals and tourists alike.", "name": "Kabuto Eel Skewers", "transport": "Approx. 2-minute walk from JR Shinjuku Station West Exit"}, {"address": "B1F Hihara Bldg, 3-32-5 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A renowned traditional kappo restaurant offering incredible value for money, previously awarded a Michelin star. Famous worldwide for its sardine (iwashi) dishes, the signature sardine sashimi is rich in healthy fats, melts in your mouth, and has zero fishy odor. The deep-fried sardines are crispy, aromatic, juicy, and sweet, while the Yanagawa-style sardine simmered with egg is smooth, delicate, and savory. Combining exquisite traditional Japanese craftsmanship with accessible pricing, it is a must-visit spot to experience Tokyo\u0027s finest seafood cuisine.", "name": "Shinjuku Kappo Nakajima", "transport": "Approx. 3-minute walk from JR Shinjuku Station Southeast Exit"}, {"address": "B1F Yoshida Bldg, 3-12-12 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Tucked away in a basement in Shinjuku 3-Chome, this premium sake and traditional local chicken/seafood izakaya features an extensive collection of famous and rare local sakes from across Japan. The sashimi platter uses fresh daily catches straight from the market, served in thick, sweet, succulent slices. Signature grilled Daisen local chicken and sake-steamed clams in rich broth are intensely flavorful. Paired with a crisp Junmai Daiginjo, guests can immerse themselves in a double feast of regional food and sake within a cozy, dimly lit wooden Japanese interior.", "name": "Shinjuku Kanae", "transport": "Approx. 1-minute walk from Tokyo Metro Shinjuku-sanchome Station Exit C6"}, {"address": "Golden Gai Ichiban-gai, 1-1-6 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A hugely popular specialty lemon sour bar located in legendary Kabukicho Golden Gai. The owner is the grandson of a Naoki Prize-winning author, giving the retro space a unique atmosphere filled with books. Their carefully crafted house-made lemon syrup combined with shochu and strong sparkling water is sweet, tart, refreshing, and packed with intense citrus aroma. Paired with simple Japanese bar snacks and grilled skewers, it\u0027s the perfect spot to soak in the unique cultural charm of Shinjuku nightlife.", "name": "OPEN BOOK (Shinjuku Golden Gai)", "transport": "Approx. 7-minute walk from JR Shinjuku Station East Exit"}, {"address": "3-22-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | A traditional Okinawan regional cuisine izakaya standing strong in Shinjuku since 1988. Exuding a rich southern Ryukyu island vibe, must-try items include the fresh, sweet, and crisp Goya Chanpuru (bitter melon stir-fry with tofu) and tender pork soft-bone ramen with a rich soup. Paired with a glass of chilled Awamori liquor or cold Okinawa Orion draft beer, the savory Okinawan snacks and refreshing drinks complement each other perfectly, capturing the hearts of local food lovers.", "name": "Okinawan Cuisine Yanbaru Shinjuku Main Branch", "transport": "Approx. 2-minute walk from JR Shinjuku Station East Exit"}, {"address": "B1F Humax Pavilion Shinjuku Higashiguchi, 3-28-10 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A stylish gastropub directly operated by famous Japanese craft beer brewery Yo-Ho Brewing. The venue offers over ten types of freshly tapped Japanese craft beers on draft, ranging from floral IPAs to rich stouts. The menu highlights oven-roasted specialty sausages and aromatic herb-roasted chicken. The sausages are juicy and snappy on the outside, pairing seamlessly with the smooth, flavorful craft beers. It is an exceptionally popular dining choice in Shinjuku for chic gatherings.", "name": "YONA YONA BEER WORKS Shinjuku East Exit", "transport": "Approx. 2-minute walk from JR Shinjuku Station East Exit"}, {"address": "3F Yutaka Bldg, 3-35-13 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | A themed specialty izakaya focusing on farm-direct free-range local chicken (jidori) from Miyazaki and Kagoshima prefectures. The signature Charcoal-Grilled Jidori is seared quickly over intense charcoal flames, leaving a rich smoky exterior while keeping the meat tender, juicy, and springy. Pairing it with special yuzu kosho (citrus chili paste) makes it perfection. With remarkably friendly service, a variety of fresh farm vegetables, and local shochu, it offers a warm, hospitable taste of Kyushu food culture.", "name": "Tsukada Nojo Shinjuku South Exit", "transport": "Approx. 2-minute walk from JR Shinjuku Station Southeast Exit"}, {"address": "2F, 3-35-5 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | An immensely popular seafood izakaya directly operated by fish wholesalers from Tsukiji and Toyosu Markets. Known for ultra-fresh and generous seafood dishes, their signature \u0027Seafood Caterpillar Roll\u0027 comes heaped with sea urchin (uni), salmon roe (ikura), and crab meat, offering a rich, multi-layered burst of sweetness. The seasonal sashimi platter is firm and exquisitely fresh. With a lively atmosphere and a great sake selection, it\u0027s the premier choice for experiencing authentic Tokyo seafood izakaya dining.", "name": "Uoshin Shinjuku", "transport": "Approx. 1-minute walk from JR Shinjuku Station Southeast Exit"}], "name": "Specialty Izakayas \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "1F Shinjuku 18 Bldg., 3-8-9 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Shinjuku\u0027s iconic vegan restaurant. Its signature \u0027Heavenly Pancakes\u0027 are baked to order using plant milk and special flour. Slightly crisp on the outside and cloud-soft on the inside, melting instantly in your mouth. Paired with rich plant-based butter and maple syrup, the complex layers attract vegans and non-vegan tourists alike.", "name": "Ain Soph. Journey Shinjuku", "transport": "1-min walk from Exit C5 of Tokyo Metro Shinjuku-sanchome Station"}, {"address": "1F Nissho Bldg., 2-46-8 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Specializing in American-style vegan fast food. The popular vegan burger features a thick soy protein patty seared to juicy perfection, smothered in rich dairy-free cheese sauce and special tartar sauce. Topped with crisp lettuce, it perfectly delivers the satisfying taste of classic fast food.", "name": "Ain Soph. Ripple (Kabukicho)", "transport": "2-min walk from the North Exit of Seibu-Shinjuku Station on the Seibu Shinjuku Line"}, {"address": "Inside JR Shinjuku Station (South Gate, Inside Ticket Gates), 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Ultra-popular vegan Tantanmen located inside the JR Shinjuku Station ticket gates, completely free of meat, seafood, and dairy. The signature Black Sesame Tantanmen features a rich, nutty broth with a mild spicy kick, chewy noodles, and flavorful saut\u00e9ed soy mince. An astounding taste experience and the perfect guilt-free meal on the go inside the station.", "name": "T\u0027s Tantan JR Shinjuku Station", "transport": "Inside the South Gate ticket gates of JR Shinjuku Station"}, {"address": "6F LUMINE Shinjuku 1, 1-1-5 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | A stylish cafe specializing in vegan Asian desserts and plant-based meals, famous for its vegan parfaits and plant-based crepes. Made with soy whipped cream and rice flour, the desserts are light, creamy, and wonderfully balanced with fruity notes and crunchy nuts. Features great ambiance and highly photogenic treats.", "name": "Wired Bonbon Lumine Shinjuku", "transport": "1-min walk from South Exit of JR Shinjuku Station (Inside LUMINE 1)"}, {"address": "7F Main Building, Isetan Shinjuku, 3-14-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A refined Macrobiotic restaurant in Isetan Department Store using organic vegetables and natural seasonings. The recommended vegetable curry features a rich, slow-simmered aromatic sauce served over fluffy brown rice and colorful roasted seasonal vegetables. Wholesome, delicious, and very popular among health-conscious locals.", "name": "CHAYA Macrobiotics Isetan Shinjuku", "transport": "Direct access from Exits B3/B4/B5 of Tokyo Metro Shinjuku-sanchome Station"}, {"address": "8F LUMINE EST Shinjuku, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 stars | A vegan falafel specialty shop originating from Middle Eastern cuisine. The freshly fried falafels are incredibly crispy on the outside and soft and aromatic inside. Wrapped in pita bread with fresh red cabbage, cucumber, and rich tahini sauce, every bite offers delightful crunch and rich flavor. A hugely popular street food bite in Shinjuku.", "name": "Falafel Brothers Shinjuku", "transport": "Directly connected to East Exit of JR Shinjuku Station (Inside LUMINE EST)"}, {"address": "1F Odakyu Shinjuku Mylord, 1-1-3 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.0 stars | A plant-forward restaurant centered on \u0027beauty and health,\u0027 serving sweet, fresh vegetables delivered directly from farms across Japan. The signature vegan green salad bowl comes with homemade nut dressing, crisp juicy greens, tender soy protein, and toasted nuts\u2014filling, vibrant, and incredibly appetizing.", "name": "MR.FARMER Shinjuku Mylord", "transport": "Directly connected to South Exit of JR Shinjuku Station (1F Shinjuku Mylord)"}, {"address": "1F/2F Shinjuku Bldg., 3-18-5 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | A dedicated \u0027Vegan Ramen Series\u0027 developed by a famous Tonkotsu ramen chain. Its rich, sweet white broth is slow-simmered from vegetables and soybeans without any gamey odor. Served with custom plant-based chashu and silky noodles, it delivers wonderful texture and aroma, offering vegetarian travelers an authentic and satisfying Japanese ramen experience.", "name": "Kyushu Jangara Shinjuku - Vegan Ramen", "transport": "3-min walk from East Exit of JR Shinjuku Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "3-34-3 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | This taiyaki shop uses the traditional \u0027Icho-yaki\u0027 technique, grilling each piece individually in single iron molds. The skin is thin, light, and delightfully crispy with every bite! For the filling, choose between Hokkaido Tokachi red beans or Naruto Kintoki sweet potato\u2014piping hot, rich, smooth, and perfectly balanced in sweetness. Crispy on the outside and soft inside with a heavenly aroma, it\u0027s a favorite street dessert for tourists and Shinjuku office workers alike, whether enjoyed fresh out of the iron or while strolling.", "name": "Naruto Taiyaki Honpo Shinjuku 3-chome (\u9cf4\u9580\u9bdb\u713c\u304d\u672c\u8217 \u65b0\u5bbf\u4e09\u4e01\u76ee\u5e97)", "transport": "Approx. 3-min walk from JR Shinjuku Station East Exit, or right at Tokyo Metro Shinjuku-sanchome Station Exit A5"}, {"address": "1-14-6 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | One of Japan\u0027s most famous takoyaki brands, with its Kabukicho branch constantly drawing long queues. Using a unique oil-drizzling finishing technique, the exterior turns intensely golden and crispy while the inside remains rich, creamy, and molten like a savory broth. Packed with chunky, springy octopus pieces and topped with signature sweet-savory sauce, mayonnaise, and bonito flakes, it offers incredible layers of flavor\u2014a must-try late-night street snack in Kabukicho.", "name": "Tsukiji Gindaco Shinjuku Kabukicho (\u7bc9\u5730\u9280\u3060\u3053 \u65b0\u5bbf\u6b4c\u821e\u4f0e\u753a\u5e97)", "transport": "Approx. 5-min walk from JR Shinjuku Station East Exit, 3-min walk from Seibu-Shinjuku Station"}, {"address": "Lumine Est Shinjuku B1F, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | A premium apple pie specialty shop located on the basement level of Lumine Est Shinjuku, filling the air with a rich buttery aroma whenever you pass by. This grab-and-go sweet features a 144-layer flaky puff pastry that is impossibly light and crispy, stuffed with generous chunks of Aomori apples and warm, creamy custard. The fruity tartness and rich vanilla cream blend effortlessly without being greasy, making it wildly popular among female tourists and local youth.", "name": "RINGO Freshly Baked Custard Apple Pie Lumine Est Shinjuku (RINGO \u30eb\u30df\u30cd\u30a8\u30b9\u30c8\u65b0\u5bbf\u5e97)", "transport": "Directly connected to JR Shinjuku Station East Exit Underground, Lumine Est B1F"}, {"address": "1-17-2 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.0 stars | A wildly popular street food trend sweeping across Japan, shaped like an adorable oversized 10-yen coin. The waffle-like cake exterior boasts a subtle honey sweetness\u2014crispy outside and fluffy inside\u2014stuffed with a massive amount of mozzarella cheese. Biting into it hot reveals a deliciously savory, incredibly stretchy cheese pull. The irresistible sweet-and-savory combo is not only a hit for the palate, but also a top Instagrammable street snack for young people in Kabukicho.", "name": "Ganso 10-Yen Bread Shinjuku Kabukicho (\u5143\u795610\u5186\u30d1\u30f3 \u6b4c\u821e\u4f0e\u753a\u5e97)", "transport": "Approx. 4-min walk from JR Shinjuku Station East Exit, near the entrance of Kabukicho Ichiban-gai"}, {"address": "Lumine Est Shinjuku 1F, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | A famous cheese tart shop originally from Hokkaido, tantalizing passersby with irresistible aromas from freshly baked batches. The tart shell is double-baked for a firm, crunchy cookie-like texture, while the filling blends three types of Hokkaido and French cheeses into a silky, melt-in-your-mouth mousse with a tangy and rich flavor profile. Enjoyed warm for a gooey center or chilled for a mousse-like smooth treat, it\u0027s one of the most beloved street bites inside Shinjuku Station.", "name": "BAKE CHEESE TART Lumine Est Shinjuku (BAKE CHEESE TART \u30eb\u30df\u30cd\u30a8\u30b9\u30c8\u65b0\u5bbf\u5e97)", "transport": "Outside JR Shinjuku Station East Exit ticket gates, Lumine Est 1F"}, {"address": "B1F, 3-26-11 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 stars | Offered by the century-old fruit specialist \u0027Shinjuku Takano\u0027, these takeaway fruit whipped cream sandwiches are a must-try delicacy for foodies in Shinjuku. Featuring premium seasonal local Japanese fruits (such as melon, strawberry, and grape) paired with signature light, airy whipped cream and soft white bread. Every bite brings together fluffy bread, silky cream, and juicy, sweet-tangy fruit explosions\u2014an extraordinarily refreshing and elegant classic Japanese street treat that attracts countless visitors.", "name": "Shinjuku Takano Fruit Sandwich Takeout (\u65b0\u5bbf\u9ad8\u91ce Takeout Bar)", "transport": "Approx. 1-min walk from JR Shinjuku Station East Exit, Takano Main Store B1F"}, {"address": "2-45-2 Kabukicho, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | A wildly popular Korean corn dog stall located on the border between Kabukicho and Shin-Okubo, specializing in freshly battered and fried rice corn dogs. The outer batter incorporates rice flour for an ultra-crunchy, golden finish, with an optional diced potato coating for extra crunch, encasing melted cheese or sausage inside. With a dramatic cheese pull that stretches for inches, dusted with sugar and drizzled with ketchup and mustard, its rich sweet-and-savory profile makes it a late-night street food obsession in Shinjuku.", "name": "Jongno Hatdog Shinjuku Kabukicho (\u937e\u8def\u30cf\u30c3\u30c8\u30b0 \u6b4c\u821e\u4f0e\u753a\u5e97)", "transport": "Approx. 1-min walk from Seibu-Shinjuku Station North Exit, 7-min walk from JR Shinjuku Station East Exit"}, {"address": "1-2-4 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | A classic yakitori stall tucked inside Shinjuku\u0027s iconic Memory La
