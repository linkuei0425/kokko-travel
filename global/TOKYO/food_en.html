    <script>
        const db = {"akihabara": {"categories": {"cat_1": {"items": [{"address": "1-8-14 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | A classic Showa-style tonkatsu institution tucked away in the backalleys of Akihabara, once honored with a Michelin Bib Gourmand recommendation. The signature special pork loin cutlet is slow-fried at low temperatures, yielding a crispy golden crust that is never greasy. The tender, juicy meat boasts a delicate pink hue and rich savory pork flavor. Paired with a secret sweet sauce and shredded cabbage, the layered textures make this long-queue hotspot a favorite among local salarymen and foreign foodies alike.", "name": "Tonkatsu Marugo", "transport": "Approx. 4-min walk from Electric Town Exit of JR Akihabara Station"}, {"address": "1-13 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Founded in 1884 (Meiji 17), this century-old handmade soba shop preserves the charm of traditional Edo machiya architecture. The hand-rolled soba noodles are firm, springy, and delicately aromatic. The house-special dipping sauce, simmered from premium bonito flakes, offers a rich and mellow umami flavor. Slurping the noodles releases an explosion of broth and buckwheat aroma, delivering a satisfying taste of history and local Edo tradition.", "name": "Kanda Matsuya", "transport": "Approx. 6-min walk from Tokyo Metro Awajicho Station / JR Akihabara Station"}, {"address": "2-10 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Established in 1880, this is the flagship restaurant of the \u0027Yabu Soba\u0027 line, one of Edo\u0027s three great soba families. The soba noodles feature a subtle greenish tint, extraordinarily silky texture, and a unique herbal buckwheat fragrance. Paired with a richly seasoned, traditional Edo-style dipping sauce\u2014where dipping just the tips of the noodles is key\u2014it leaves a lingering aroma on the palate, making it a beloved haunt for fans of traditional Japanese noodles.", "name": "Kanda Yabu Soba", "transport": "Approx. 5-min walk from JR Akihabara Station / Kanda Station"}, {"address": "1-11-1 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Tokyo\u0027s only century-old restaurant specializing in monkfish (Anko), established in 1830 (Tenpo 1). Its building is designated as a Tokyo Historic Structure. The signature monkfish hot pot uses the whole fresh fish; the meat is firm and springy, while the skin and rich monkfish liver melt in your mouth with gelatinous goodness. The smooth, sweet broth is a sublime traditional comfort food sought after by locals and tourists alike in winter.", "name": "Isegen", "transport": "Approx. 6-min walk from Manseibashi Exit of JR Akihabara Station"}, {"address": "1-15 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Operating since the late Meiji era, this historic chicken sukiyaki spot continues to prepare its dishes using traditional shichirin charcoal braziers and iron pots. Carefully selected tender chicken and offal simmered in a sweet and savory sauce yield tender, juicy bites. Dipping the piping hot chicken into rich raw egg coating adds an impossibly silky finish. The old wooden architecture makes guests feel as though they\u0027ve traveled back in time.", "name": "Botan", "transport": "Approx. 7-min walk from JR Akihabara Station"}, {"address": "1-19 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Founded in 1930 (Showa 5), this traditional Japanese sweets shop (Kanmitsu-dokoro) is also a famous anime landmark. Its most popular takeaway sweet is \u0027Age-Manju\u0027 (deep-fried red bean bun), featuring a crisp, golden outer shell filled with smooth, sweet red bean paste. Hot, crunchy on the outside and soft inside without being cloying, pairing it with a cup of warm green tea offers a deliciously nostalgic taste of old Tokyo.", "name": "Takemura", "transport": "Approx. 6-min walk from Electric Town Exit of JR Akihabara Station"}, {"address": "2-21 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | Established in 1949 by Mansei Bridge, this meat lover\u0027s palace is one of Akihabara\u0027s most iconic Showa-era culinary landmarks. The signature hamburg steak boasts a lightly seared crust with a plump, juicy interior. Drizzled with a secret onion red wine sauce, it bursts with flavor. Their thick-cut pork cutlet sandwich (katsu sando) is crisp outside and juicy inside, consistently topping lists for must-eat street foods and edible souvenirs in Akihabara.", "name": "Niku no Mansei Main Branch", "transport": "Approx. 3-min walk from Electric Town South Exit of JR Akihabara Station"}, {"address": "1-24-2 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Founded in 1947 (Showa 22), this historic unagi (eel) specialist is famous for using large, high-quality freshwater eels. Carefully grilled over binchotan charcoal, the kabayaki eel features a lightly charred skin and rich, tender meat that virtually melts in your mouth. Served over fluffy Koshihikari rice and brushed with a sweet secret sauce passed down through generations, it offers an irresistible, deeply fragrant dining experience highly recommended by connoisseurs.", "name": "Kanda Kikukawa Main Branch", "transport": "Approx. 5-min walk from JR Akihabara Station / Kanda Station"}], "name": "Famous Local Historic Restaurants"}, "cat_2": {"items": [{"address": "2F, AKIBA441 Bldg, 4-2-6 Sotokanda, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.2 stars | A famous pancake caf\u00e9 originating from Ehime, renowned for its extra-thick handcrafted souffle pancakes. Made to order with a wait time of about 20 minutes, they arrive at your table exuding a rich egg and milk aroma. Crispy on the outside, the interior is cloud-like, moist, dense, and melts in your mouth. Paired with house-blend hand-poured single-origin coffee, the interplay of bitter and sweet flavors is captivating\u2014making it the perfect exquisite afternoon tea and brunch choice when taking a break from sightseeing in Akihabara.", "name": "Flying Scotsman Akihabara", "transport": "About a 4-minute walk from JR Akihabara Station Electric Town Exit"}, {"address": "2k540 O-1, 5-9-9 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.1 stars | A unique caf\u00e9 located under the elevated tracks in the \u00272k540 Aki-Oka Artisan\u0027 creative park between Akihabara and Okachimachi, featuring hammock seating. Its signature dish, the \u0027Skillet Souffle Pancake,\u0027 is incredibly soft and fluffy, baked to a golden crisp around the edges with a smooth, custard-like center. Topped with whipped cream and homemade jam, it\u0027s a visual and culinary delight highly popular with tourists who love relaxed brunches and photo-worthy spots.", "name": "Cafe Asan", "transport": "About a 3-minute walk from Naka-Okachimachi Station (Tokyo Metro Hibiya Line), or a 7-minute walk from JR Akihabara Station"}, {"address": "8F, Yodobashi Akiba, 1-1 Kanda Hanaokacho, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | A popular spot specializing in premium French toast and American-style brunch. The signature French toast uses custom round French bread soaked in an exclusive egg batter and pan-fried to golden perfection\u2014crispy on the outside while pudding-soft inside. Dusted with powdered sugar and served with honey and whipped cream, every melt-in-your-mouth bite brings pure bliss. Beyond sweet treats, their savory sausage and omelet brunch platters are equally hearty and delicious.", "name": "THE FRENCH TOAST FACTORY Yodobashi Akiba", "transport": "Direct access from JR Akihabara Station Showa-dori Exit to Yodobashi Akiba 8th Floor"}, {"address": "B1F \u0026 1F, Shimura Musen Bldg, 1-12-2 Sotokanda, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.0 stars | A well-known vintage coffee shop blending Showa-era nostalgia with a bold American style. It created a sensation in Akihabara with its wildly oversized sandwiches and hot dogs. Toast that is crispy on the outside and soft inside holds thick slices of cheese, juicy sausages, or generous smoked chicken\u2014delivering an explosion of rich flavors in every bite. Paired with a dark, aromatic roast coffee, it satisfies big appetites while offering a great taste of retro Japanese kissaten culture.", "name": "Cafe MOCO", "transport": "About a 2-minute walk from JR Akihabara Station Electric Town Exit"}, {"address": "3F, Liberty Bldg No. 5, 4-5-1 Sotokanda, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.4 stars | A hidden specialty coffee shop on the 3rd floor of a building in bustling Akihabara, serving as a tranquil urban sanctuary. The shop is meticulous about coffee bean selection and roasting, offering various single-origin pour-overs. Smooth on the palate, their brews feature bright floral and fruity notes with a clean, sweet finish. They also serve exquisite homemade cheesecake and light toast dishes\u2014rich and dense, perfect for connoisseurs seeking high-quality pour-over coffee and a quiet brunch.", "name": "VAULT COFFEE", "transport": "About a 5-minute walk from JR Akihabara Station Electric Town Exit"}, {"address": "1F, Kanda Myojin Cultural Exchange Center EDOCCO, 2-16-2 Sotokanda, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.2 stars | A trendy Japanese-style caf\u00e9 located within the Kanda Myojin Shrine Cultural Exchange Center, blending traditional Shinto culture with modern Japanese cuisine. Signature brunch items and desserts include deluxe matcha parfait, masu box tofu cheesecake, and freshly grilled mochi. The matcha treats offer a balanced sweetness with a charmingly subtle tea bitterness and rich layers. Bright, elegant, and filled with auspicious vibes, it\u0027s a top choice for Japanese-style afternoon tea when visiting Akihabara and Kanda.", "name": "EDOCCO CAF\u00c9 MASUMASU (Kanda Myojin Branch)", "transport": "About a 9-minute walk from JR Akihabara Station Electric Town Exit, or a 5-minute walk from Ochanomizu Station"}, {"address": "2F, AKIBA TOLIM, 1-6-5 Kanda Sakumacho, Chiyoda-ku, Tokyo", "feature": "\u2b50 3.9 stars | A modern Franco-American bistro caf\u00e9 located near Akihabara Station\u0027s Central Gate, serving high-quality French-inspired brunch and light meals. The interior is spacious and stylish. The popular brunch platter features freshly baked French bread crispy outside and soft inside, crispy golden bacon, ultra-silky scrambled eggs, and a crisp fresh salad with tangy homemade dressing. Paired with a specialty latte or fresh juice, it offers a relaxed and satisfying morning culinary experience.", "name": "Portal Cafe Akihabara", "transport": "Direct access from JR Akihabara Station Central Gate to AKIBA TOLIM 2nd Floor"}, {"address": "4F, Onoden Main Store, 1-2-7 Sotokanda, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.0 stars | Founded in 2001, this legendary spot is widely recognized as Japan\u0027s very first maid caf\u00e9. Unlike noisy anime-themed cafes, it embraces a classic British aesthetic with servers wearing elegant long-skirt maid dresses. Certified by the Japan Tea Association, it uses carefully selected tea leaves to brew rich, smooth English tea. Paired with freshly made sandwiches, Wagyu Salisbury steak meals, or handmade chiffon cake, the refined ambiance and authentic tea experience make it a favorite for tourists seeking classic afternoon tea.", "name": "Cure Maid Cafe", "transport": "About a 2-minute walk from JR Akihabara Station Electric Town Exit (4F, Onoden Main Store)"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-8-9 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | A traditional Edo-style restaurant located near Kanda Myojin Shrine, offering exquisite Edo-style bento boxes and local sake appetizers. The signature \u0027Edo Saiei Bento\u0027 features seasonal vegetables and fresh fish prepared with traditional techniques, delivering a delicate and comforting taste. Paired with carefully selected local Tokyo sake, guests can immerse themselves in the rich atmosphere of the ancient capital and traditional izakaya culture. Highly praised by diners who appreciate historical charm and classic Japanese cuisine.", "name": "Kanda Myojinshita Miyabi", "transport": "Approx. 8-min walk from Electric Town Exit of JR Akihabara Station / Approx. 5-min walk from JR Ochanomizu Station"}, {"address": "1F Yodobashi Akihabara, 1-1 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | A popular gastropub that perfectly combines American craft beer with traditional Japanese izakaya dishes. The venue offers over 30 varieties of domestic and international craft beers on tap, all at a transparent and affordable flat rate per glass. Signature bar bites include specially marinated Japanese fried chicken (karaage) crispy on the outside and tender inside, juicy oven-roasted sausages, and appetizers featuring local ingredients. The crisp bitterness of the beer forms a wonderful balance with the rich, savory dishes, making it a favorite among local office workers and foreign tourists.", "name": "Craft Beer Market Akihabara", "transport": "Approx. 1-min walk from Central Gate of JR Akihabara Station"}, {"address": "5F AKIBA TOLIM, 1-6-5 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | A regional izakaya featuring carefully selected ingredients shipped directly from Niigata and Sado Island. Highly praised here is the kamameshi (rice cooked in an iron pot), made with premium Koshihikari rice from Uonuma, resulting in sweet, plump, and perfectly separated grains. Pair it with fresh sashimi from Sado and Niigata\u2019s famous specialty \u0027Tochio Fried Tofu\u0027\u2014crispy on the outside and soft on the inside. With dozens of local Niigata Junmai Daiginjo sakes available, it is the best choice to savor authentic regional dishes from Japan\u0027s snow country.", "name": "Uonuma Kamakura Akihabara", "transport": "Directly connected to Tsukiji Exit of JR Akihabara Station / TX Akihabara Station"}, {"address": "1-24 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | A Japanese gastropub specializing in Date chicken Binchotan-charcoal yakitori and regional poultry dishes. Featuring high-quality branded chicken shipped directly from the farm, master chefs slowly grill the skewers over high-temperature charcoal. The yakitori bursts with aroma, boasting slightly charred crisp skin while locking in the rich juices. Beyond the must-try charcoal-grilled yakitori, the house special handmade Horokanai Soba offers a smooth texture and rich buckwheat fragrance. Served with a clear golden chicken broth, its unique flavor is loved by both tourists and local foodies.", "name": "Torimoto Akihabara Showa-dori", "transport": "Approx. 1-min walk from Showa-dori Exit of JR Akihabara Station"}, {"address": "8F Yodobashi Akihabara Building, 1-1 Kanda Hanaokacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | An upscale Japanese gastropub crafted by the renowned whisky brand Suntory. Spacious and elegant, it focuses on serving seasonal regional dishes from across Japan. Highlights include Kuroge Wagyu grilled on rock salt, Okinawa black pork kakuni (braised pork belly), and seasonal fresh sashimi. Dishes are refined and rich in flavor layers. Paired with Highballs made from rare Japanese whiskies such as Hibiki and Yamazaki, the aroma of spirits and delicacies intertwine to provide a top-tier Akihabara nightlife culinary experience.", "name": "Hibiki Akihabara", "transport": "Approx. 1-min walk from Central Gate of JR Akihabara Station"}, {"address": "1F-2F Taika Building, 1-161 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | A vibrant themed izakaya chain specializing in regional cuisine from Kyushu, Japan. The standout dish, \u0027Ikejime Mackerel Sashimi Shipped Directly from Hirado, Nagasaki,\u0027 features extremely sweet, firm flesh with absolutely no fishiness. Another must-order is the \u0027Hakata Iron Plate Gyoza,\u0027 featuring a thin skin, crispy bottom, and juicy filling sizzling on a hot iron plate. Paired with Kyushu\u0027s local black-koji sweet potato shochu, dining here feels like stepping into the bustling night food stalls of Kyushu.", "name": "Kyushu Netchuya Akihabara LIVE", "transport": "Approx. 1-min walk from Showa-dori Exit of JR Akihabara Station"}, {"address": "1F Sakurai Building, 2-15 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | A stylish Japanese-European gastropub hidden in the Akihabara shopping district, specializing in Binchotan-charcoal grilled Kuroge Wagyu beef and curated red wines. The signature Wagyu lean steak is charcoal-grilled with precise timing, achieving a fragrant charred crust while remaining tender pink inside\u2014releasing rich juices and smoky aroma with every bite. Paired with house-special local vegetable salads and a wide selection of dining wines, it offers a unique feast blending Japanese regional ingredients with Western bistro ambiance.", "name": "Budoya Akihabara", "transport": "Approx. 2-min walk from Showa-dori Exit of JR Akihabara Station"}, {"address": "6F Daini Azuma Building, 1-14 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | An authentic Japanese izakaya specializing in Kagoshima\u0027s Satsuma regional cuisine. Renowned for Kagoshima specialties like \u0027Kurobuta (Black Pork) Shabu-Shabu\u0027 and \u0027Satsuma-age (Fried Fish Cake)\u0027. The Kurobuta pork features beautifully marbled fat that melts in your mouth with a subtle sweet flavor, paired with a light, flavorful broth. The freshly fried Satsuma-age is springy, juicy, and packed with fresh seafood umami. Housing over a hundred varieties of Kagoshima authentic local sake and sweet potato shochu, it is a fantastic spot to experience Southern Kyushu\u0027s bold drinking and dining culture.", "name": "Satsuma Gogochi Akihabara", "transport": "Approx. 1-min walk from Showa-dori Exit of JR Akihabara Station"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "CHABARA, 8-2 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | A renowned vegan Shojin Ryori (Japanese Buddhist temple cuisine) restaurant located inside the CHABARA commercial complex in Akihabara. It strictly avoids meat, seafood, and the five pungent roots. The signature \u0027Shojin Teishoku\u0027 set menu comes with seasonal vegetables and delicate side dishes. The fried soy chicken is crispy on the outside, tender on the inside, and shockingly realistic in texture, while the black sesame tofu melts in your mouth with a rich soybean aroma. With its cozy Japanese-style ambiance, it is a top healthy dining choice loved by both foreign tourists and local vegetarians.", "name": "Komaki Shojin Ryori", "transport": "About a 2-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "3-11-6 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Famous for its tonkotsu (pork bone) ramen, this shop has specially developed a 100% plant-based \u0027Vegan Tonkotsu-Style Ramen\u0027 for vegetarians. The broth is simmered with soy milk, shiitake mushrooms, and various vegetables, creating a rich, smooth, and layered flavor that rivals traditional pork broth. Served with custom vegan meat and springy thin noodles, it is thoroughly satisfying. For vegetarian travelers looking to experience authentic Japanese ramen culture in Akihabara, this is an absolute must-visit destination.", "name": "Kyushu Jangara Akihabara Main Store", "transport": "About a 5-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "3-21-5 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | A highly popular Indian restaurant helmed by authentic Indian chefs, offering a wide variety of authentic vegetarian and vegan curries. Popular choices like \u0027Chana Masala\u0027 and \u0027Palak Paneer\u0027 are rich in aroma and moderately spicy. Paired with freshly baked, crispy-yet-soft naan straight from the oven, a rich explosion of spices awaits your taste buds. Highly praised by both local Akihabara office workers and international tourists.", "name": "Indian Restaurant Aarti", "transport": "About a 6-minute walk from the Showa-dori Exit of JR Akihabara Station"}, {"address": "1-21 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | A world-famous curry chain, this specific branch features a dedicated \u0027Vegetarian Curry\u0027 menu. The curry sauce contains no animal fats or ingredients, offering a sweet, rich flavor with the natural sweetness of vegetables. Diners can freely customize their meal with fried vegetables, eggplant, spinach, mushrooms, and more. This flexible customization allows vegetarians to effortlessly enjoy delicious Japanese curry rice in Akihabara.", "name": "CoCo Ichibanya JR Akihabara Showa-dori", "transport": "About a 1-minute walk from the Showa-dori Exit of JR Akihabara Station"}, {"address": "1-1-2 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 stars | An internationally renowned vegan chain located near the Akihabara shopping district, offering 100% plant-based dishes without egg or dairy. The popular \u0027Vegan Japanese Ramen\u0027 and \u0027Vegan Chashu\u0027 (char siu) have impressive textures; the vegan chashu is lightly charred, sweet, and wonderfully chewy. Additionally, weekend-exclusive vegan steamed buns and dairy-free desserts like cheesecake offer a dense, rich texture, making this a dream foodie spot recommended by local plant-based enthusiasts.", "name": "Loving Hut Kanda", "transport": "About a 3-minute walk from Tokyo Metro Awajicho/Kanda Station (approx. 8-minute walk from Akihabara Station)"}, {"address": "3-8-14 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | An iconic street food stall in Akihabara, the anime hub, offering a vegetarian-exclusive \u0027Falafel Pita\u0027. The freshly fried chickpea patties are golden crisp on the outside and soft and herb-infused inside, paired with fresh, crisp lettuce and special tahini sauce. Every bite offers rich layers and satisfying portions, making it the most convenient grab-and-go street snack when tired from exploring Akihabara\u0027s Electric Town.", "name": "Moses Kebab Akihabara", "transport": "About a 6-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "2-10 Kanda Awajicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | A century-old soba landmark founded in 1880, located just a few minutes\u0027 walk from Akihabara. The signature \u0027Seiro Soba\u0027 is made from 100% pure buckwheat flour (Ju-wari), delivering a smooth, chewy texture brimming with natural nutty aroma. While traditional dipping sauce usually contains bonito, the restaurant can provide plant-based diners with pure soy sauce or sea salt, allowing vegetarians to experience authentic Edo-style soba culture and rich history.", "name": "Kanda Yabu Soba", "transport": "About a 7-minute walk from the Manseibashi Exit of JR Akihabara Station"}, {"address": "4-4-2 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 3.9 stars | A renowned Japanese gourmet burger chain offering a plant-based \u0027SOY BURGER\u0027 specially designed for vegetarians. The burger patty is crafted from high-quality soy protein, pan-seared to be juicy, remarkably authentic in texture, and free of bean aftertaste. Complemented by fresh tomatoes, crisp lettuce, and a custom plant-based sauce, it offers a refreshing and rich taste\u2014perfect for vegetarian anime fans looking for a quick energy boost in Akihabara.", "name": "Freshness Burger Akihabara", "transport": "About a 4-minute walk from the Electric Town Exit of JR Akihabara Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1-13-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Famous on the streets of Akihabara for its unique \u0027winged taiyaki.\u0027 The freshly baked fish-shaped waffle features a large, biscuit-thin crispy crust extending around the edges that makes a satisfying crunch when bitten into. Fillings include Tokachi red bean paste or rich custard cream. The red bean is velvety and subtly sweet, while the custard is hot and silky like cream puff filling. This delightful contrast of a crispy exterior and soft center makes it a top choice for on-the-go snacking.", "name": "Kanda Daruma Akihabara", "transport": "Approx. 2-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "1F GiGO Akihabara Building 5, 1-10-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Blending Akihabara\u2019s unique anime subculture, this shop specializes in limited-edition taiyaki shaped like popular anime and game characters. The batter is chewier and springier than traditional taiyaki, with a texture somewhere between sponge cake and mochi. Fillings include rich custard cream, molten chocolate, or sweet red bean paste. The intricate, adorable designs and seasonally changing themes draw crowds of anime fans and tourists eager to take photos and enjoy a delicious treat.", "name": "GiGO no Taiyaki Akihabara", "transport": "Approx. 1-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "3-10-12 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Kebabs are an iconic part of Akihabara\u0027s street food culture, and Moses Kebab is one of the neighborhood\u0027s most famous spots with long lines. Freshly shaved, grilled beef and chicken are juicy and rich with savory fats, paired with plenty of crunchy shredded cabbage, and drizzled with a custom-spiced yogurt sauce wrapped tightly inside a warm, aromatic pita bread. Juicy meat and crisp veggies combine for a deliciously filling street snack.", "name": "Moses Kebab Akihabara", "transport": "Approx. 3-minute walk from Tokyo Metro Suehirocho Station / 6-minute walk from JR Akihabara Station"}, {"address": "1F Takeout Counter, 2-21 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | A takeaway counter run by Akihabara\u0027s famed meat restaurant Niku no Mansei, famous for its classic pork katsu sandwich\u2014a staple walking snack. Thick-cut pork cutlet coated in golden breadcrumbs is tender, juicy, and rich, paired with a tangy secret sauce and tucked between two slices of soft white bread. Even when eaten cold, the coating stays crisp without getting soggy, making it a savory bite that turns first-timers into loyal fans.", "name": "Niku no Mansei Katsusando", "transport": "Approx. 4-minute walk from the Electric Town South Exit of JR Akihabara Station"}, {"address": "Platform 5 (Sobu Line), JR Akihabara Station, 1-chome Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Brimming with retro Showa-era nostalgic charm, this platform standing-milk kiosk is a unique street food fixture inside Akihabara Station. It offers a curated selection of bottled fresh milk, coffee milk, and fruit milk from all over Japan, served ice-cold, rich, and creamy. Pair a bottle with a warm, soft curry bread or red bean pastry while standing on the train platform to experience authentic Japanese commuter food culture.", "name": "Milk Stand JR Akihabara Station", "transport": "On the Sobu Line platform inside JR Akihabara Station (inside gates)"}, {"address": "1F Akihabara UDX, 4-14-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | A Japanese soft crepe shop known for its signature \u0027melt-in-your-mouth\u0027 texture. Their crepes feature a unique batter made with a golden ratio of flour and almond powder, creating an incredibly soft, delicate wrapper with a light nutty aroma. Wrapped around airy premium whipped cream, fresh strawberries, and caramelized bananas, every bite feels like eating a light, fluffy cake\u2014a huge hit with youth and dessert lovers.", "name": "MOMI \u0026 TOY\u0027S Crepe Akihabara UDX", "transport": "Approx. 3-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "1-14-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | A classic representative of Japanese street takoyaki (octopus balls), the Akihabara branch is often packed with tourists. Using a unique high-heat oil technique, the outer shell achieves a golden, ultimate crispiness while the center remains piping hot, creamy, and filled with a large piece of tender octopus. Drizzled with sweet-savory takoyaki sauce, original mayonnaise, and topped with dancing bonito flakes, the crisp exterior and soft interior create an addictive sensation.", "name": "Tsukiji Gindaco Akihabara", "transport": "Approx. 1-minute walk from the Electric Town Exit of JR Akihabara Station"}, {"address": "Outside the Electric Town Ticket Gates, JR Akihabara Station, 1-15-8 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Specializing in palm-sized freshly baked mini cheese tarts perfect for takeaway snacking on the go. The cookie-like tart shell is delightfully buttery and crisp, encapsulating a light, cloud-like molten cheese filling. Biting into a freshly baked tart releases a hot, gooey cheese center that bursts in your mouth, blending sweet and savory creamy flavors\u2014an ideal sweet pick-me-up during a shopping walk.", "name": "PABLO mini Akihabara", "transport": "Located right outside the Electric Town Ticket Gates of JR Akihabara Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Akihabara"}, "asakusa_ueno": {"categories": {"cat_1": {"items": [{"address": "3-1-12 Nishi-Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.3 stars | A century-old sukiyaki institution founded in 1895 (Meiji 28). Using premium Kuroge Wagyu beef, the sweet-and-savory sauce perfectly complements meat so tender it melts in your mouth, bursting with rich aroma and velvety texture. Highly praised by local foodies and tourists alike, their lunch-exclusive Wagyu bowl (Wagyu Don) offers incredible value and is an absolute must-try.", "name": "Asakusa Imahan", "transport": "Approx. 3-minute walk from Exit 3 of Tawaramachi Station on the Tokyo Metro Ginza Line"}, {"address": "1-38-10 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.0 stars | An iconic tempura restaurant operating in Asakusa since 1887 (Meiji 20). Their signature Ebi Tendon features golden fried prawns in pure sesame oil, coated in a dark, secret ancestral sauce. Rich, moist, and immensely aromatic, the bold sesame flavor blends seamlessly with the sweet-and-savory sauce, making it a favorite among tourists and locals alike.", "name": "Daikokuya Tempura", "transport": "Approx. 4-minute walk from Exit 1 of Asakusa Station on the Tobu Isesaki Line \u0026 Tokyo Metro Ginza Line"}, {"address": "2-1-29 Komagata, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | A historic unagi (eel) specialty restaurant with over 200 years of history, located along the Sumida River. Using top-tier domestic eel, it follows traditional Kanto-style steamed and grilled techniques glazed in a rich, flavorful kabayaki sauce. The flesh is tender and melt-in-your-mouth soft with a subtle smoky aroma on the skin\u2014a premium choice for authentic Edomae eel cuisine.", "name": "Komagata Maekawa", "transport": "Approx. 1-minute walk from Exit A2b of Asakusa Station on the Toei Asakusa Line"}, {"address": "1-7-12 Komagata, Taito-ku, Tokyo", "feature": "\u2b50 4.1 stars | A historic Edo-period restaurant established in 1801, specializing in dojo (loach) hotpot. Whole loaches are simmered in a special sweet soy sauce and miso broth until the bones and flesh are melt-in-your-mouth tender, served topped with abundant green onions. Delicate and odor-free, dining here offers an authentic taste of rustic Edo heritage cherished by traditional food lovers.", "name": "Komagata Dozeu", "transport": "Approx. 1-minute walk from Exit A1 of Asakusa Station on the Toei Asakusa Line"}, {"address": "1-7-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.1 stars | A century-old soba shop opened in the Meiji era, frequented even by famous author Nagai Kafu. Their signature tempura soba features freshly fried, oversized kuruma prawns larger than the bowl itself. The noodles are smooth and springy, paired with a rich, savory bonito broth and crispy, juicy shrimp that leave an unforgettable aftertaste.", "name": "Owariya Soba", "transport": "Approx. 3-minute walk from Tawaramachi Station on the Tokyo Metro Ginza Line"}, {"address": "4-59 Ueno Koen, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Located inside Ueno Park, this historic kaiseki and tofu restaurant was established in 1875 (Meiji 8). It serves delicate, light seasonal kaiseki bento boxes and fresh yuba (tofu skin) dishes. Enjoying exquisite flavors while overlooking an elegant Japanese garden provides a feast for both the eyes and palate, highly recommended by discerning diners.", "name": "Inshotei", "transport": "Approx. 5-minute walk from Park Exit of JR Ueno Station"}, {"address": "3-40-3 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | A legendary tonkatsu shop founded in Ueno in 1930 and the birthplace of the famous Japanese pork cutlet sandwich (Katsu Sando). Famous for cutlets so tender they can be cut with chopsticks, the golden crispy breading encases succulent, juicy pork. Paired with soft bread and custom sauce, it offers a deeply satisfying texture that draws food enthusiasts from afar.", "name": "Isen Honten", "transport": "Approx. 3-minute walk from South Exit of JR Okachimachi Station"}, {"address": "6-9-16 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | Founded in 1892 (Meiji 25), this is one of the premier institutions carrying on the legacy of \u0027Yabu\u0027, one of Tokyo\u0027s three major Edo soba styles. The slightly greenish soba noodles are wonderfully chewy with a robust buckwheat aroma, enjoyed by dipping into a rich, salty dipping sauce in true classic Edo fashion.", "name": "Ueno Yabu Soba", "transport": "Approx. 3-minute walk from Shinobazu Exit of JR Ueno Station"}], "name": "Famous Historic Local Eateries"}, "cat_2": {"items": [{"address": "2-7-4 Kotobuki, Taito-ku, Tokyo", "feature": "\u2b50 4.4 Stars | An independent cafe directly run by \u0027Pelican\u0027, a century-old bakery in Asakusa. The cafe\u0027s most popular charcoal-toasted bread features a crispy, aromatic exterior and an incredibly soft, chewy interior, pairing seamlessly with rich butter. The fresh fruit cream toast carefully selects seasonal fruits, offering a smooth, refreshing taste that\u0027s not overly sweet. Both tourists and locals willingly stand in long queues just to savor the purest taste of toast alongside aromatic, high-quality coffee.", "name": "Pelican Cafe", "transport": "About a 3-minute walk from Tawaramachi Station on the Tokyo Metro Ginza Line"}, {"address": "2-6-15 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.3 Stars | A top-tier coffee brand hailing from Oslo, Norway. The two-story Asakusa branch exudes a warm wooden tone paired with a strong retro aesthetic. It highlights light-roasted coffee beans delivering elegant fruity sweetness and floral notes that are exceptionally smooth. Their signature Norwegian waffles feature a lightly crispy shell and a chewy interior, served with rich cheese or jam\u2014the ultimate relaxed treat for a slow morning.", "name": "Fuglen Asakusa", "transport": "About a 2-minute walk from Asakusa Station on the Tsukuba Express"}, {"address": "6-1-29 Yanaka, Taito-ku, Tokyo", "feature": "\u2b50 4.2 Stars | A legendary machiya (traditional townhouse) cafe located near Yanaka, Ueno. Boasting a century of history, it blends Japanese Showa-era nostalgia with modern hipster charm. Highly recommended is their signature egg sandwich, featuring a thick, soft, piping-hot tamagoyaki bursting with egg flavor and savory dashi broth. Paired with a warm, smooth hand-drip pour-over coffee, it invites you to slow down and enjoy a timeless, peaceful moment.", "name": "Kayaba Coffee", "transport": "About a 10-minute walk from the South Exit of JR Nippori Station, or a 9-minute walk from Nezu Station on the Tokyo Metro Chiyoda Line"}, {"address": "3-1-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.4 Stars | A charming specialty scone cafe situated behind Senso-ji Temple, where the air is always filled with the comforting scent of fresh baking. Their signature scones have a golden crispy exterior and a fluffy, tender inside, releasing rich buttery aromas with every bite\u2014perfect when paired with homemade spreads. The classic caramel pudding is silky yet rich, with its bittersweet caramel syrup forming a flawless balance with a bold latte, making it a favorite spot to recharge morning or afternoon.", "name": "Feb\u0027s coffee \u0026 scone", "transport": "About a 7-minute walk from Asakusa Station on the Tobu Isesaki Line"}, {"address": "6-8-15 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.1 Stars | An iconic Showa-era kissaten (traditional coffee shop) hidden in the alleys of Ueno, featuring opulent classical decor steeped in history. Their extra-thick charcoal toast is impeccably crispy outside and pillow-soft inside, melting in your mouth with a spread of rich butter. The signature hot coffee offers a deep, full-bodied brew with subtle smoky notes. Beloved by local regulars seeking nostalgia and foreign travelers alike, it\u0027s a must-visit spot to experience Ueno\u0027s coffee house culture.", "name": "Coffee Ten Ojo", "transport": "About a 3-minute walk from the Hirokoji Exit of JR Ueno Station"}, {"address": "2-29-2 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.5 Stars | A stylish espresso bar tucked away in the quiet lanes behind Asakusa\u0027s Kannon-ura, famous for its baristas serving coffee in traditional kimonos. The shop extracts espresso using carefully selected single-origin beans; the latte foam is velvety soft, expertly harmonizing milk and coffee flavors. Their seasonal fruit sandwich layers juicy fresh fruits with smooth cream, looking visually stunning in cross-section with multi-layered flavors that draw countless coffee lovers on pilgrimage.", "name": "SUKEMASA COFFEE", "transport": "About a 3-minute walk from Asakusa Station on the Tsukuba Express"}, {"address": "1-9-8 Komagata, Taito-ku, Tokyo", "feature": "\u2b50 4.3 Stars | A cozy, hipster brunch cafe nestled on the edge of Asakusa\u0027s residential area, renowned for its exquisite morning toast sets. Using bread sourced from the famous local Pelican Bakery, the toast is grilled to golden perfection and served with special vanilla butter or melted cheese, creating an amazing crispy-yet-chewy texture. Paired with an aromatic pour-over coffee or a rich latte in a welcoming atmosphere, it\u0027s a dream spot to kick off a beautiful Tokyo morning.", "name": "February Cafe", "transport": "About a 1-minute walk from Exit A1 of Asakusa Station on the Toei Asakusa Line"}, {"address": "1-41-9 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.2 Stars | A charming classic micro-kissaten located on Asakusa\u0027s Rokku shopping street, filled with playful retro vibes. Their iconic freshly baked pancakes are stamped with the word \u0027Tengoku\u0027 (Heaven); they boast a light crispy coating outside, while inside they are warm, fluffy, and fragrant with eggs and flour. Drizzled with syrup and served alongside a balanced, bittersweet black coffee, it\u0027s a match made in heaven. With its cozy space and unique personality, it\u2019s beloved by strolling tourists and dessert lovers alike.", "name": "Coffee Tengoku", "transport": "About a 5-minute walk from Asakusa Station on the Tokyo Metro Ginza Line"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-1-29 Komagata, Taito-ku, Tokyo", "feature": "\u2b50 4.3 stars | A historic unagi (eel) restaurant with over 200 years of history, located right next to the Sumida River. Using carefully selected wild and premium farmed eel, they craft their dishes using the traditional Kanto technique\u2014steaming first then charcoal-grilling\u2014basted with a secret sauce passed down through generations. The eel flesh is delicate, fluffy, and melts in your mouth, featuring a perfectly balanced sweet-savory glaze and a captivating smoky aroma served over chewy rice. Dining here offers panoramic views of Tokyo Skytree and the riverside, perfectly blending Edo traditions with modern views.", "name": "Komagata Maekawa", "transport": "Approx. 1-min walk from Exit A2 of Asakusa Station on the Toei Asakusa Line"}, {"address": "6-13-2 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.1 stars | One of the most iconic casual izakayas in Ueno\u0027s Ameyoko Market, beloved by local office workers and tourists for its nostalgic Showa-era vibe. The signature stewed offal (Motsu-nikomi) uniquely uses horse meat simmered with large blocks of tofu in a rich miso broth\u2014tender, gameless, and naturally sweet. Pair it with a fresh highball, shochu, or sake alongside freshly grilled skewers to fully immerse yourself in Tokyo\u0027s most authentic, lively pub culture.", "name": "Daitoryo Shiten", "transport": "Approx. 3-min walk from Shinobazu Exit of JR Ueno Station"}, {"address": "2-4-3 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.0 stars | A legendary pub in Asakusa Rokku, historically frequented by famous Japanese comedians and literary figures. Famous for savory beef tendon stew and traditional whale dishes, the beef tendon is simmered until tender, gelatinous, and full of rich flavor. Walls covered with celebrity signatures and retro posters create a warm, lively atmosphere, making it a fantastic spot to experience old-town Asakusa\u0027s retro charm.", "name": "Asakusa Kujirasen", "transport": "Approx. 2-min walk from Asakusa Station on the Tsukuba Express"}, {"address": "1-1-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.0 stars | Established in 1880, this is Japan\u0027s very first Western-style bar and a registered Tangible Cultural Property. Its iconic signature cocktail, \u0027Denki Bran\u0027 (Electric Brandy), features a brandy base with a unique sweet and spicy kick. Paired with classic German sausages, beef stew, or Japanese-Western bar snacks, it offers a romantic blend of Taisho and Showa nostalgia\u2014an essential vintage bar experience in Asakusa.", "name": "Kamiya Bar", "transport": "Right outside Exit 1 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "4-59 Uenokoen, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Tucked away in Ueno Park, this century-old ryotei restaurant serves traditional kaiseki and local delicacies inside a charming wooden sukiya-style building. Famous for seasonal tofu, yuba (tofu skin), and chicken Hanakago bento boxes, the food highlights natural, delicate flavors ranging from rich house-made tofu to savory seasonal stews. Large wooden-frame windows overlook the park\u0027s changing seasons, creating a deeply cultural Japanese dining experience.", "name": "Inshotei", "transport": "Approx. 5-min walk from Park Exit of JR Ueno Station"}, {"address": "6-12-19 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.0 stars | A wildly popular open-air yakitori izakaya under the Ueno train tracks, open from daytime and packed year-round. Signature skewers with garlic sauce (like chicken thigh, skin, and heart) are grilled over high-heat charcoal to crispy perfection outside while remaining tender and juicy inside. Paired with cold draft beer or Black Hoppy, enjoying drinks here while trains rumble overhead offers the ultimate lively street drinking vibe.", "name": "Bunraku Yakitori", "transport": "Approx. 3-min walk from Hirokoji Exit of JR Ueno Station"}, {"address": "1-4-4 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.0 stars | Founded in 1946, this historic tempura restaurant and izakaya in Asakusa is renowned for traditional Edomae sesame oil deep-frying. Signature special tempura bowls and fried appetizers feature golden, crispy batter with a rich sesame aroma enclosing plump prawns and seasonal vegetables, finished with a sweet-savory tare sauce. Paired with a curated selection of sake, it\u0027s an ideal spot to savor authentic old-school Asakusa flavors.", "name": "Asakusa Aoi Marushin", "transport": "Approx. 3-min walk from Exit 1 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "6-7-18 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.1 stars | A high-energy izakaya famed for tabletop chicken BBQ and regional poultry dishes. Guests grill tender cuts of chicken and offal over tabletop shichirin charcoal braziers, filling the air with savory aromas while yielding juicy, tender bites. Rich chicken paitan hot pots and regional chicken sashimi are also standout offerings. Paired with regional sake from across Japan, the energetic vibe makes it perfect for gatherings with friends.", "name": "Tori Bancho Ueno Showa-dori", "transport": "Approx. 3-min walk from Hirokoji Exit of JR Ueno Station"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Ecute Ueno 3F, inside JR Ueno Station, 7-1-1 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.3 stars | Crafting amazingly rich and flavorful vegan sesame tantanmen completely without meat, seafood, eggs, or dairy! The classic \u0027Golden Sesame Tantanmen\u0027 features a thick, silky broth with deep sesame aroma and a subtle spicy kick, paired with springy egg-free noodles and plant-based minced meat. Rich yet refreshing with zero greasiness. Conveniently located inside the station, it\u0027s a prime spot for travelers arriving at or leaving Ueno to enjoy a guilt-free, delicious meal.", "name": "T\u0027s Tantan JR Ueno Station", "transport": "3F Ecute Ueno Mall, inside the ticket gates of JR Ueno Station"}, {"address": "1-2-11 Ryusen, Taito City, Tokyo", "feature": "\u2b50 4.6 stars | A Michelin-recommended century-old establishment specializing in traditional Zen Buddhist vegetarian cuisine (Fucha Shojin Ryori), elevating plant-based dining into a refined artistic feast. Using 100% plant-based ingredients, seasonal wild vegetables, tofu, and mushrooms are skillfully prepared into multi-layered dishes like sesame tofu and mock-meat tempura. The sesame tofu boasts a silky, melt-in-your-mouth texture rich with warm sesame fragrance. Featuring an elegant, tranquil Japanese garden setting and exquisite Kaiseki presentation, it attracts tourists eager to experience Japan\u0027s deep-rooted traditional vegetarian culture.", "name": "Bon - Fucha Shojin Ryori", "transport": "About a 10-minute walk from Exit 3 of Iriya Station on the Tokyo Metro Hibiya Line"}, {"address": "7F EKIMISE Asakusa, 1-4-1 Hanakawado, Taito City, Tokyo", "feature": "\u2b50 4.2 stars | A fully vegan scenic caf\u00e9 located inside a shopping mall along the Sumida River, focusing on carefully selected organic vegetables and plant-based whole foods. The popular \u0027Vegan Teriyaki Plant Burger\u0027 uses a thick soy-protein patty that is juicy and chewy, topped with signature sweet-and-savory teriyaki sauce and fresh lettuce, rivaling real meat in depth of flavor. They also serve hearty, wholesome Buddha bowls. With a bright, comfortable atmosphere and distant views of Tokyo Skytree, it attracts many Western tourists enjoying a relaxed vegan brunch.", "name": "FARM CAFE Asakusa", "transport": "Directly connected to EKIMISE Mall 7F, Tobu Isesaki Line Asakusa Station"}, {"address": "2-11-9 Hanakawado, Taito City, Tokyo", "feature": "\u2b50 4.5 stars | A popular restaurant centered around a 100% gluten-free and all-vegan concept, created specifically for health-conscious diners and those with dietary allergies. The signature \u0027Vegan Gluten-Free Ramen\u0027 features a broth slowly simmered from various vegetables and kombu for a sweet, mellow flavor, paired with smooth, chewy rice noodles that absorb the soup perfectly. The vegan cheese onion tart and house-special plant patties are also must-tries. Beautifully presented with complex flavors, it is a top-rated dining spot praised by foreign tourists and local plant-based foodies in Asakusa.", "name": "Marugoto Vegan Dining Asakusa", "transport": "About a 7-minute walk from Exit 7 of Asakusa Station (various lines)"}, {"address": "4-21-6 Higashi-Ueno, Taito City, Tokyo", "feature": "\u2b50 4.4 stars | A cozy vegan bakery and light-meal caf\u00e9 tucked away in a quiet alley of Higashi-Ueno, specializing in healthy baked goods made without butter, eggs, dairy, or refined white sugar. Freshly baked daily, their vegan muffins and scones are wildly popular grab-and-go treats\u2014crispy on the outside, dense and moist inside, bringing out the natural sweetness of soy milk and brown sugar. Their healthy lunch boxes featuring a colorful rainbow vegetable plate are equally beloved by local health-conscious women and light-meal enthusiasts.", "name": "Guruatsu Higashi-Ueno", "transport": "About a 5-minute walk from Inaricho Station on the Tokyo Metro Hibiya Line / 8-minute walk from JR Ueno Station Iriya Exit"}, {"address": "2-15-14 Nishi-Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.5 stars | An award-winning premium gelato shop from Kyoto, whose Asakusa branch offers dozens of dairy-free, 100% vegan gelato choices. Using organic plant milks and high-quality ingredients, the texture is remarkably smooth, rich, and creamy, completely shattering the stereotype that vegan ice cream lacks flavor. The \u0027Organic Black Sesame\u0027 and \u0027Kyoto Uji Organic Matcha\u0027 flavors are highly recommended for their intense aroma and balanced sweetness\u2014an unmissable vegan treat while strolling through the Senso-ji shopping district.", "name": "Premarch\u00e9 Gelateria Asakusa", "transport": "About a 2-minute walk from Exit A1 of Tsukuba Express (TX) Asakusa Station"}, {"address": "1-1-2 Ryusen, Taito City, Tokyo", "feature": "\u2b50 4.6 stars | An artistic and cozy hidden vegan caf\u00e9 famous for its stunning plant-based spice curries and handcrafted vegan desserts. Its flagship dish, the \u0027Rainbow Spiced Plant Curry\u0027, blends fresh seasonal vegetables with house-blended spices to create a rich flavor profile\u2014mildly spicy with a natural vegetable sweetness that unfolds in layers. The vegan fruit tarts feature a crispy crust and smooth, non-greasy custard filling, making it a hidden gem for tourists and vegans seeking a quiet afternoon with delicious food.", "name": "PQ\u0027s Vegan Cafe Asakusa", "transport": "About a 7-minute walk from Iriya Station on the Tokyo Metro Hibiya Line"}, {"address": "1F JR Ueno Station, 7-1-1 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.1 stars | A famous tonkotsu ramen chain\u0027s special vegan ramen line, highly favored by both domestic and international visitors. The \u0027Vegan Kumamoto-style Ramen\u0027 uses absolutely no animal products or pungent aromatics (alliums), yet achieves an amazingly rich and savory soup base using vegetable extracts and special fragrant oil. Featuring a hint of roasted garlic aroma, rich texture, thin straight noodles, and tender soy chashu, it offers an authentic and deeply satisfying experience. A must-visit landmark for vegetarian travelers wanting to taste classic Japanese ramen culture in Tokyo.", "name": "Kyushu Jangara Ueno - Vegan Menu", "transport": "Right outside the Shinobazu Exit of JR Ueno Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-7-13 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.3 stars | Asakusa\u0027s iconic, legendary street treat! Their signature \u0027Jumbo Melonpan\u0027 (melon bread) features an ultra-crispy crust dusted with fine sugar crystals, while the inside undergoes long, low-temperature fermentation to achieve an amazingly cloud-like, fluffy texture. Strolling past Asakusa Shrine with a warm melonpan in hand, the rich yet perfectly balanced buttery aroma is unforgettable, drawing long lines of eager locals and tourists alike.", "name": "Asakusa Kagetsudo Main Store", "transport": "Tobu Isesaki Line / Tokyo Metro Ginza Line \u0027Asakusa Station\u0027, approx. 5 mins walk"}, {"address": "2-3-1 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.2 stars | A popular stall located on Nakamise Shopping Street near Senso-ji Temple\u0027s main hall. Traditional Japanese red bean paste buns are coated in a special batter and freshly deep-fried in hot oil, creating a golden, crispy, and non-greasy exterior. Each bite offers a satisfying contrast between the crispy shell and soft interior, featuring flavors like matcha, red bean, sesame, and even cream cheese. Steaming soft fillings combined with crispy crust make this a classic must-eat snack while exploring Asakusa.", "name": "Asakusa Kokonoe Age-Manju", "transport": "Tokyo Metro Ginza Line \u0027Asakusa Station\u0027 Exit 1, approx. 3 mins walk"}, {"address": "2-3-3 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.3 stars | One of Asakusa\u0027s legendary street food icons. Made from a premium mix of Kanagawa\u0027s premium \u0027Koza Pork\u0027 and beef, the freshly fried panko crust is incredibly crispy. Biting into it releases an explosion of savory, rich juices, complemented by the pronounced sweetness of diced onions. Visitors love devouring these piping-hot, succulent minced meat cutlets in the designated eating area right after purchasing.", "name": "Asakusa Menchi", "transport": "Tobu Isesaki Line \u0027Asakusa Station\u0027, approx. 3 mins walk"}, {"address": "2-3-4 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.2 stars | A wildly popular curry bread specialty shop located right next to Asakusa Menchi. The filling features premium Kuroge Wagyu beef slow-cooked with over ten spices into a rich, savory black curry, encased in breadcrumbed dough and fried until crunch-perfect. A single bite yields an audible crunch, followed by melt-in-your-mouth beef chunks coated in a slightly spicy, velvety curry sauce that keeps foodies coming back for more.", "name": "Toyofuku Kuroge Wagyu Curry Bread", "transport": "Tokyo Metro Ginza Line \u0027Asakusa Station\u0027, approx. 3 mins walk"}, {"address": "1-20-1 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.1 stars | A historic Japanese confectionery shop founded in the Meiji era. Their signature street snack is \u0027Imo Yokan\u0027 (sweet potato jelly block), made strictly without artificial coloring or preservatives\u2014just high-quality sweet potatoes steamed and pressed with a touch of sugar and salt. Dense, smooth, and packed with natural sweet potato flavor. They also offer \u0027Anko Dama\u0027 (red bean balls), glossy colorful jelly spheres enclosing silky sweet bean paste.", "name": "Funawa Nakamise No.1 Store", "transport": "Tokyo Metro Ginza Line \u0027Asakusa Station\u0027 Exit 1, approx. 3 mins walk"}, {"address": "6-13-2 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.2 stars | A famed meat wholesaler-operated eatery tucked in the alleys of Ueno Ameyoko. Its standing snack counter at the front draws constant crowds daily. Their signature \u0027Special Wagyu Menchi Katsu\u0027 features a golden crispy exterior filled with savory minced Wagyu beef and sweet, juicy onions. High-grade beef quality at an affordable price makes it the top choice in Ameyoko to pair with a cold beer or enjoy on the go.", "name": "Niku no Oyama Ueno", "transport": "JR \u0027Ueno Station\u0027 Hirokoji/Shinobazu Exit, approx. 2 mins walk"}, {"address": "4-9-13 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.4 stars | A century-old tea shop standing amidst the vibrant bustle of Ueno Ameyoko. Their rich tea-flavored soft-serve ice cream sold at the storefront is a beloved market treat. The top-seller, \u0027Premium Matcha Soft Serve\u0027, is made with high-grade Uji matcha, yielding an exceptionally smooth texture with a deep, pleasantly bitter tea aroma that dissolves into a refreshing, non-sticky sweetness. It\u0027s the ultimate refreshing treat when taking a break from shopping.", "name": "Chano Kiminoen", "transport": "JR \u0027Ueno Station\u0027 Shinobazu Exit, approx. 3 mins walk"}, {"address": "1-28-1 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.3 stars | A famous taiyaki shop committed to the traditional single-mold cooking technique (\u0027natural-yaki\u0027), grilling each fish-shaped pastry individually over open flame. The skin is thin, crispy, and lightly toasted with a lovely fragrant char, generously stuffed from head to tail. Choose between rich, smooth Tokachi red bean filling or sweet, velvety Naruto Kintoki sweet potato paste. The contrast of the hot, silky filling and crisp outer shell makes it an iconic cozy comfort snack in Asakusa.", "name": "Naruto Taiyaki Honpo Asakusa Shin-Nakamise", "transport": "Tobu Isesaki Line / Tokyo Metro Ginza Line \u0027Asakusa Station\u0027, approx. 4 mins walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Asakusa and Ueno"}, "ginza_tokyo": {"categories": {"cat_1": {"items": [{"address": "3-5-16 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.1 Stars | Founded in 1895, Rengatei is the birthplace of Japan\u0027s Yoshoku (Western-style Japanese) cuisine culture and is renowned as the originator of tonkatsu (pork cutlet) and omurice (omelet rice). The signature \u0027Original Tonkatsu\u0027 is fried at high temperatures to lock in the juices, yielding a golden, crispy crust and tender, succulent pork that delivers a delightful crunch. The \u0027Original Omurice\u0027 features rice cooked together with egg for a silky, rich texture. Beloved by local foodies and international visitors for over a century, its classic Showa-era decor makes you feel as if you\u0027ve stepped back in time.", "name": "Rengatei", "transport": "About a 3-minute walk from Exit A9 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "4-5-7 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.2 Stars | Founded in 1869, Kimuraya is the creator of Japanese anpan (red bean bread) and once served as an official supplier to Emperor Meiji. Their iconic \u0027Sakadane Anpan\u0027 uses traditional sake yeast fermentation, giving the chewy dough a subtle, elegant aroma of sake lees. Filled with smooth, perfectly balanced sweet red bean paste, it offers a harmonious blend of fluffiness and rich flavor. Preserving traditional methods for over a century, both longtime Tokyoites and international travelers come here specifically to pick up freshly baked warm buns.", "name": "Ginza Kimuraya Main Store", "transport": "Direct access from Exit A10 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "8-11-3 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.0 Stars | Established in 1885, Ginza Tengoku is an iconic historic tempura restaurant in Ginza. The signature \u0027Special Tendon\u0027 uses rich sesame oil for frying, producing a crisp, light, non-greasy batter around fresh jumbo prawns, anago (conger eel), and seasonal vegetables. Drizzled with a century-old secret sauce that balances sweet and savory with deep complexity, the batter absorbs the sauce to create a delightfully soft-yet-crispy texture over warm rice\u2014a true taste of traditional Old Edo highly praised by local gourmets.", "name": "Ginza Tengoku Main Store", "transport": "About a 5-minute walk from Exit 1 of Shimbashi Station on the Tokyo Metro Ginza Line"}, {"address": "8-5-6 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.2 Stars | Founded during the late Edo period, Chikuyotei is a century-old Edomae unagi (eel) restaurant recognized with a Michelin star. Following the authentic Edomae technique of steaming before grilling, the eel becomes impossibly plump and tender\u2014literally melting in your mouth\u2014while the skin acquires a delicate char. Their house tare sauce is rich and savory without being overly sweet, perfectly enhancing the fish\u0027s natural oils. Served over fluffy rice glistening with sauce, every bite is pure luxury, making it a must-visit temple of traditional Japanese cuisine.", "name": "Chikuyotei Ginza", "transport": "About a 3-minute walk from Exit 3 of Shimbashi Station on the Tokyo Metro Ginza Line"}, {"address": "8-8-3 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.3 Stars | Opening in 1902 as Japan\u0027s first ice cream soda parlor, Shiseido Parlour is an emblem of Ginza\u0027s modern Yoshoku dining culture. The classic \u0027Meat Croquette\u0027 features a golden, delicate, extremely crispy crust wrapping a velvety, rich white sauce with tender beef, bursting with rich aroma upon the first bite. The \u0027Strawberry Parfait\u0027 uses carefully selected premium strawberries paired with rich, homemade vanilla ice cream, balancing sweet and tangy flavors beautifully. Its elegant upscale decor and timeless recipes continue to draw crowds of enthusiastic visitors.", "name": "Shiseido Parlour Ginza Main Store", "transport": "About a 7-minute walk from Exit A2 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "8-7-6 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.4 Stars | Founded in 1935, Ginza Kyubey is synonymous with high-end Edomae sushi and is famous as the inventor of gunkan-maki (warship roll sushi). The restaurant maintains an uncompromising dedication to the perfect temperature, acidity of the shari (sushi rice), and freshness of the fish. The signature \u0027Otoro (Fatty Tuna) Nigiri\u0027 boasts snowflake-like marbling, melting seamlessly with the warm rice to release rich, savory oils. Combining master craftsmanship with top-tier ingredients, Kyubey delivers an unforgettably luxurious omakase sushi experience.", "name": "Ginza Kyubey Main Store", "transport": "About a 5-minute walk from Exit 3 of Shimbashi Station on the Tokyo Metro Ginza Line"}, {"address": "7-8-1 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.1 Stars | Established in 1927, Ginza Bairin was Ginza\u0027s very first specialized tonkatsu shop and the creator of katsu sando (pork cutlet sandwich) and bite-sized tonkatsu. The signature \u0027Special Pork Loin Cutlet\u0027 uses premium Kurobuta (black pork) fried with proprietary techniques, creating a golden breading that is ultra-crispy without feeling oily, while the pork inside remains tender, juicy, and naturally sweet. Their famous Katsu Sando, made with soft bread and a secret savory-sweet sauce, offers a delightful contrast of textures that makes it a must-try delicacy for travelers.", "name": "Ginza Bairin Main Store", "transport": "About a 5-minute walk from Exit A2 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "4-13-11 Ginza, Chuo City, Tokyo", "feature": "\u2b50 4.2 Stars | A beloved Showa-era kissaten (classic caf\u00e9) famous for serving what many call Tokyo\u0027s silky-softest omurice. The signature omurice features a strikingly bright yellow omelet cooked with butter to fluffy perfection over ketchup fried rice. Slicing it open reveals a soft, runny interior that cascades smoothly over the rice, delivering a cloud-like texture. Rich buttery notes blend effortlessly with the sweet-and-sour ketchup rice for an unforgettable flavor that draws long queues of local and foreign visitors every day.", "name": "Kissako YOU", "transport": "About a 1-minute walk from Exit 3 of Higashi-Ginza Station on the Tokyo Metro Hibiya Line"}], "name": "Legendary Local Historic Dining"}, "cat_2": {"items": [{"address": "12F, GINZA OKURA HOUSE, 2-6-12 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | A renowned brunch brand from Australia, celebrated for serving the \"World\u0027s Best Breakfast\". The must-order signature Ricotta Hotcakes are exceptionally fluffy and melt-in-your-mouth soft, paired perfectly with the rich aroma of ricotta cheese, honeycomb butter, and maple syrup. Located on the top floor of GINZA OKURA HOUSE, it boasts excellent natural light and stylish, elegant decor, making it a favorite among tourists and local socialites alike.", "name": "bills Ginza", "transport": "Approx. 2-minute walk from Exit A13 of Tokyo Metro Ginza Station"}, {"address": "8-10-15 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Founded in 1948, this legendary vintage coffee shop operates with a devoted artisan spirit of \"serving coffee only\". The shop preserves a wide variety of aged vintage coffee beans, poured over to reveal deep, complex, mature flavors. The signature \"Amber Queen\" gracefully layers cold-drip coffee with rich, custom-blended fresh cream. Smooth on the palate with a rich bitter-sweetness and mellow liquor-like aroma, it is a sacred holy ground that coffee lovers visiting Ginza must not miss.", "name": "Caf\u00e9 de L\u0027Ambre", "transport": "Approx. 5-minute walk from Exit A3 of Tokyo Metro Ginza Station"}, {"address": "1F, Tokyo Expressway Konya Building, 1-2-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | An immensely popular luxury toast specialty shop and brunch cafe in Ginza. Highlights fragrant, rich toasts made from wheat of three different origins. Ordering the toast tasting set allows you to select your favorite vintage toaster to bring to your table for a hands-on self-toasting experience! Freshly toasted bread features a crispy crust and a pillowy, chewy interior, bursting with milky fragrance and wheat sweetness with every bite, perfectly complemented by specialty butter and jam.", "name": "Center The Bakery Ginza", "transport": "Approx. 1-minute walk from Exit 3 of Tokyo Metro Ginza-itchome Station"}, {"address": "2F, Tekko Building, 1-8-2 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.1 stars | Known as the \"Queen of Breakfast in New York\", Sarabeth\u0027s flagship space next to Tokyo Station serves iconic classic French toast with a golden, crispy exterior wrapping a soft, custard-like center. Drizzled with maple syrup, it is delightfully sweet without being cloying. The Eggs Benedict pours out golden, soft-poached yolk upon slicing, combining Hollandaise sauce and English muffins for distinctly layered flavors\u2014a top choice for an elegant brunch around Tokyo Station.", "name": "Sarabeth\u0027s Tokyo", "transport": "Approx. 2-minute walk from Yaesu North Exit of JR Tokyo Station"}, {"address": "1F, Marunouchi Building, 2-4-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | A stylish, all-day cafeteria located on the 1st floor of the Marunouchi Building, featuring a spacious, bright marble bar and comfortable seating. Its viral breakout dish is the extra-thick homemade French Toast, several centimeters thick! Thoroughly soaked in egg mixture and pan-seared until crispy outside and tender inside, it tastes like a warm, silky custard pudding. The slightly charred caramel aroma intertwines wonderfully with savory butter.", "name": "The Front Room Marunouchi", "transport": "Approx. 1-minute walk from Marunouchi South Exit of JR Tokyo Station"}, {"address": "1F, Nagasaki Center Building, 8-9-16 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.1 stars | Established in 1911, it is considered one of the oldest surviving kissaten (Japanese-style coffee shops) in Ginza, frequented even by John Lennon and Yoko Ono. It carries a century-old heritage of Brazilian coffee bean roasting craftsmanship. The signature \"Gin-Bra\" coffee is smooth and well-rounded, with a subtle bitterness and a refreshing sweet aftertaste. Paired with house-made Black Forest cake or cheesecake, it instantly transports you back to the elegant coffee culture of the Taisho and Showa eras.", "name": "Caf\u00e9 Paulista", "transport": "Approx. 5-minute walk from Exit A3 of Tokyo Metro Ginza Station"}, {"address": "5-9-17 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | Opened in 1936, this nostalgic Showa-style kissaten exudes classic elegance with its red brick exterior and red carpets. The highlight is the tableside performance where servers pour hot coffee and hot milk simultaneously from a height into your cup to create a \"Caf\u00e9 au Lait\". The foam is dense and fine, tasting silky and rich. Paired with freshly handcrafted golden English scones and special cream, you can enjoy the most authentic classic Japanese kissaten experience.", "name": "Tricolore Ginza", "transport": "Approx. 3-minute walk from Exit A5 of Tokyo Metro Ginza Station"}, {"address": "B1F, Royal Crystal Ginza, 7-4-6 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | A luxurious, classic cafe situated in Ginza\u0027s high-end district, adorned with expensive antique porcelain and crystal chandeliers, creating a refined and noble atmosphere. Serves top-tier single-origin pour-over coffee alongside exquisite brunch sets. Using meticulously selected estate beans, the coffee is aromatic, smooth, and long-finishing. The accompanying homemade sandwich toast is fluffy with rich, fresh fillings, allowing guests to immerse in a quiet, aristocratic luxury.", "name": "Royal Crystal Caf\u00e9 Ginza", "transport": "Approx. 3-minute walk from Exit B6 of Tokyo Metro Ginza Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1F Ginza Lion Bldg., 7-9-20 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | Japan\u0027s oldest existing beer hall features classic early-Showa mosaic murals and a vintage Gothic ceiling. The signature \u0027Black Label Draft Beer\u0027 is poured by master tapsters using the traditional one-pour method, creating a creamy, dense foam, rich hop aroma, and a smooth, non-bitter finish. Pair it with roast steak and a German sausage platter\u2014crispy-skinned and juicy\u2014offering a rich Western gastropub atmosphere beloved by both local office workers and tourists.", "name": "Ginza Lion Beer Hall Ginza 7-Chome", "transport": "About a 3-minute walk from Exit A3 of Tokyo Metro Ginza Station"}, {"address": "5F Taiyo Bldg., 8-8-5 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | A gastropub specializing in premium Kagoshima Kurobuta pork and regional specialties. The signature \u0027Kurobuta \u0026 Scallion Shabu-Shabu\u0027 pairs sliced green onions with thinly sliced high-grade black pork swirled in a secret broth. The meat is tender, sweet, and game-free, with fat melting into a delightful sweetness accentuated by savory ponzu vinegar. The restaurant also offers an extensive selection of authentic Kyushu sweet potato shochu, perfect for enjoying a cozy night out with friends in a quiet, elegant private room.", "name": "Kagoshima Kurobuta Specialty Rabuta Ginza Main Branch", "transport": "About a 5-minute walk from Exit A2 of Tokyo Metro Ginza Station / About a 5-minute walk from Ginza Exit of JR Shimbashi Station"}, {"address": "1F/B1F Ginza First Five Bldg., 1-5-10 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | A high-end regional gastropub specializing in regional cuisine from Kochi Prefecture (Tosa). The most acclaimed dish is the \u0027Straw-Seared Bonito Tataki,\u0027 where chefs sear fresh bonito over a roaring straw fire right before your eyes. The skin gets wonderfully seared and aromatic while the inside stays tenderly raw. Packed with a smoky straw aroma, served with sliced garlic, shredded onions, and citrus ponzu, it delivers an explosion of flavors showcasing the bold, unique culinary tradition of Tosa.", "name": "Tosa Cuisine Tsukasa Ginza Branch", "transport": "About a 1-minute walk from Exit 6 of Tokyo Metro Ginza-ittchome Station"}, {"address": "8F Taiyo Bldg., 8-8-5 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.1 stars | A regional poultry gastropub highlighting Akita Prefecture\u0027s famous \u0027Hinai-jidori\u0027 chicken. Grilled over Binchotan charcoal, their signature yakitori skewers feature juicy, springy meat with crispy skin bursting with savory fat. Another must-try is the \u0027Akita Kiritanpo Nabe,\u0027 featuring toasted rice skewers that absorb the rich chicken broth, paired with crunchy wild celery to refresh the palate. The rustic Tohoku folkcraft decor makes it a favorite among foodies seeking authentic regional Japanese ingredients.", "name": "Ginza Hinai-doriya Main Branch", "transport": "About a 5-minute walk from Exit A2 of Tokyo Metro Ginza Station"}, {"address": "B1F First Avenue Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | A stylish, modern Japanese gastropub directly operated by Yo-Ho Brewing, Nagano\u0027s famous craft brewery. It serves over ten varieties of fresh, limited-edition craft beers on tap, including the immensely popular \u0027Yona Yona Ale\u0027 and \u0027Wednesdays Cat\u0027 (Suiyobi no Neko). The menu blends regional Japanese ingredients with American pub classics. Highlights include the signature oven-roasted herb chicken\u2014crispy, tender, and infused with rosemary aroma\u2014and handcrafted artisan sausages bursting with juice. It is an ideal spot to unwind after work or gather with friends inside Tokyo Station.", "name": "YONA YONA BEER WORKS Tokyo Station Store", "transport": "Direct connection from Yaesu Underground Central Exit of JR Tokyo Station (inside First Avenue Tokyo Station)"}, {"address": "2F Ginza A5 Bldg., 5-6-10 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Tucked away in an elegant alley of Ginza, this gastropub specializes in Yamagata regional cuisine and local sake. Fresh mountain vegetables, taro, and premium Yamagata beef are delivered directly from the source. The signature \u0027Yamagata Imoni\u0027 features tender taro simmered in a savory-sweet soy broth infused with rich beef fat, bringing comforting warmth in every bite. Pair it with famous Yamagata sake like \u0027Jukyonodai\u0027 or \u0027Dewazakura\u0027. The dimly lit, wooden interior offers great privacy, making it a hidden haven for foodies and local elites to enjoy Tohoku\u0027s finest food and drink.", "name": "Yamagata Local Cuisine Ginza Shizuka", "transport": "About a 1-minute walk from Exit B3 of Tokyo Metro Ginza Station"}, {"address": "6F Marunouchi Building, 2-4-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.2 stars | A historic gastropub with over 80 years of tradition, specializing in Miyazaki regional specialties and quality ingredients. The signature \u0027Miyazaki Jitokko Charcoal-Grilled Chicken\u0027 is flash-grilled over high flames, giving the meat a smoky charred coating that is delightfully chewy, juicy, and perfect when paired with yuzu kosho. The \u0027Original Chicken Nanban\u0027 is crispy on the outside and tender inside, topped with tangy homemade tartar sauce. Pair your meal with authentic Miyazaki sweet potato shochu to savor the passionate flavors of Southern Kyushu right inside Tokyo Station.", "name": "Miyazaki Jidori Mansaku Tokyo Station Store", "transport": "About a 1-minute walk from Marunouchi South Exit of JR Tokyo Station (6F Marunouchi Building)"}, {"address": "B1F Miki Bldg., 2-3-5 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.1 stars | A tropical and energetic Okinawan gastropub located in the bustling Ginza shopping district. The signature \u0027Goya Champuru\u0027 uses fresh bitter melon and island tofu flown in from Okinawa, stir-fried over high heat for a refreshing, bittersweet flavor. The \u0027Slow-Simmered Pork Belly\u0027 (Rafute) is braised in Awamori and brown sugar until melt-in-your-mouth tender, rich yet non-greasy. Offering dozens of Awamori varieties and cold Orion draft beer alongside warm sanshin music, it instantly transports diners from busy Ginza to a sun-drenched Okinawan island.", "name": "Okinawa Cuisine \u0026 Awamori Ginza Yanbaru", "transport": "About a 1-minute walk from Exit 4 of Tokyo Metro Ginza-ittchome Station / About a 3-minute walk from Exit C8 of Ginza Station"}], "name": "Specialty Gastropubs \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "1F Keiyo Street, Inside JR Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.4 Stars | A renowned 100% plant-based ramen shop located inside the ticket gates of Tokyo Station, using no meat, seafood, dairy, or eggs. The signature \u0027Gold Sesame Tantanmen\u0027 features a rich, savory broth with deep sesame aromas and a hint of spiciness, paired with springy medium-thin noodles and soy mince for an impressive depth of flavor and umami. Highly recommended for both vegetarians and non-vegetarians, it is an absolute must-visit spot when passing through Tokyo Station.", "name": "T\u0027s Tantan Tokyo Station (T\u0027s\u305f\u3093\u305f\u3093 \u6771\u4eac\u99c5\u4eac\u8449\u30b9\u30c8\u30ea\u30fc\u30c8\u5e97)", "transport": "Inside the Yaesu South Gate ticket gates of JR \u0027Tokyo Station\u0027, approx. 2-min walk (Located in the Keiyo Street area)"}, {"address": "4-12-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 Stars | An elegant vegan restaurant in the Ginza shopping district, specializing in exquisite plant-based dishes and French-style desserts. The dream dessert \u0027Heavenly Pancakes\u0027 is highly recommended\u2014baked with soy cheese and wheat flour, featuring a lightly crisp exterior and a cloud-like, fluffy interior served with custom vegan whipped cream and fresh berries. With its cozy and sophisticated atmosphere, it is immensely popular among both local ladies and international tourists.", "name": "AIN SOPH. GINZA (\u30a2\u30a4\u30f3\u30bd\u30d5 \u30ae\u30f3\u30b6)", "transport": "Approx. 1-min walk from Exit 3 of \u0027Higashi-ginza Station\u0027 on the Tokyo Metro Hibiya Line or Toei Asakusa Line"}, {"address": "Tokyo Ramen Street, B1F First Avenue Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.1 Stars | A branch of the famous Michelin Bib Gourmand-recommended restaurant, renowned for its innovative vegetable ramen. Specially crafted for vegetarians, the \u0027Special Vegesoba\u0027 features light pink noodles infused with paprika powder and a naturally sweet broth simmered from cabbage and carrots. Topped with roasted bell peppers, tomatoes, and shiitake mushrooms, it offers a flavorful, fiber-rich bowl that shatters the heavy,
