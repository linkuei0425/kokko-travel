    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | Tokyo\u0027s oldest temple, famous for its iconic Kaminarimon Gate with a massive red lantern. The bustling Nakamise-dori shopping street offers a variety of traditional street food and unique souvenirs.", "duration": "1-2 hours", "title": "Senso-ji Temple", "transport": "About a 5-minute walk from Asakusa Station on the Tokyo Metro Ginza Line or Toei Asakusa Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | Dedicated to Emperor Meiji and Empress Shoken, this shrine is nestled in a vast 70-hectare forest, providing a serene spiritual haven in the heart of the bustling city.", "duration": "1.5-2 hours", "title": "Meiji Jingu Shrine", "transport": "About a 1-minute walk from Harajuku Station on the JR Yamanote Line or Meiji-jingumae Station on the Tokyo Metro Chiyoda Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | An iconic red-and-white communications tower featuring observation decks with spectacular views of Tokyo\u0027s city skyline at night. Beneath the tower, FootTown offers themed exhibitions and gift shops.", "duration": "1.5-2 hours", "title": "Tokyo Tower", "transport": "About a 5-minute walk from Akabanebashi Station on the Toei Oedo Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | The world\u0027s tallest self-supporting broadcasting tower at 634 meters. Its observation decks offer panoramic vistas stretching as far as Mount Fuji, complemented by the vast Tokyo Solamachi shopping complex at its base.", "duration": "2-3 hours", "title": "Tokyo Skytree", "transport": "Direct access from Oshiage Station on the Tobu Skytree Line or Toei Asakusa Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | A vibrant park combining natural scenery with rich cultural amenities, home to Ueno Zoo, Shinobazu Pond, and several prestigious national museums and art galleries.", "duration": "2-3 hours", "title": "Ueno Park", "transport": "About a 2-minute walk from the Park Exit of Ueno Station on the JR Yamanote Line or Tokyo Metro Ginza Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | The residence of Japan\u0027s Emperor, featuring the iconic photo spot Nijubashi Bridge. The East Gardens preserve the historic ruins of Edo Castle\u0027s main keep alongside picturesque Japanese gardens.", "duration": "1.5-2 hours", "title": "Imperial Palace Outer Gardens \u0026 East Gardens", "transport": "About a 3-minute walk from Nijubashimae Station on the Tokyo Metro Chiyoda Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | One of the Tokyo Ten Shrines, boasting ancient Gongen-zukuri style architecture and a vivid tunnel of neatly lined red torii gates. Its annual spring Azalea Festival draws large crowds of visitors.", "duration": "1 hour", "title": "Nezu Shrine", "transport": "About a 5-minute walk from Nezu Station on the Tokyo Metro Chiyoda Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | The head temple of the Tokugawa Shogunate, offering a striking contrast where the classical main hall is dramatically framed against Tokyo Tower standing right behind it.", "duration": "1 hour", "title": "Zojo-ji Temple", "transport": "About a 3-minute walk from Onarimon Station on the Toei Mita Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | A whimsical museum dedicated to the animated arts of Hayao Miyazaki and Studio Ghibli. The building itself is packed with playful fairy-tale charm; advance ticket reservation is required.", "duration": "2-3 hours", "title": "Ghibli Museum, Mitaka", "transport": "About a 5-minute dedicated shuttle bus ride from the South Exit of Mitaka Station on the JR Chuo Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 5 Stars | An immersive digital art museum where visitors walk barefoot through water-filled spaces, experiencing a breathtaking visual feast blending light, shadow, and reflection.", "duration": "2 hours", "title": "teamLab Planets TOKYO", "transport": "About a 1-minute walk from Shin-Toyosu Station on the Yurikamome Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | Designed by renowned architect Kisho Kurokawa, this striking building features a undulating glass curtain wall. It has no permanent collection but hosts high-profile special exhibitions alongside eye-catching cafes.", "duration": "1.5-2.5 hours", "title": "The National Art Center, Tokyo", "transport": "Direct access from Exit 6 of Nogizaka Station on the Tokyo Metro Chiyoda Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | The premier venue for traditional Japanese Kabuki theater, set in a magnificent Momoyama-style building. Features include the Kabukiza Gallery and single-act (Makumi-seki) ticket experiences.", "duration": "1-3 hours", "title": "Kabukiza Theatre", "transport": "Direct access from Exit 3 of Higashi-Ginza Station on the Tokyo Metro Hibiya Line or Toei Asakusa Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | A grand shrine with nearly 1,300 years of history, renowned for blessings in business success and matchmaking. Located near Akihabara, it has also become a pilgrimage site for anime culture fans.", "duration": "1 hour", "title": "Kanda Myojin Shrine", "transport": "About a 5-minute walk from the Hijiribashi Exit of Ochanomizu Station on the JR Chuo or Sobu Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | Famous as the birthplace of the beckoning cat (Maneki-neko), housing thousands of fortune cats of various sizes. Its serene and elegant atmosphere attracts cat lovers from all over.", "duration": "1 hour", "title": "Gotokuji Temple", "transport": "About a 5-minute walk from Miyanosaka Station on the Tokyu Setagaya Line or a 10-minute walk from Gotokuji Station on the Odakyu Line"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4 Stars | Officially named Taikei-ji, celebrated for its intricate wooden relief carvings adorning the main hall and its exquisite Japanese garden, \u0027Suikei-en\u0027. The surrounding retro shopping street oozes nostalgic charm.", "duration": "1.5-2 hours", "title": "Shibamata Taishakuten Temple", "transport": "About a 3-minute walk from Shibamata Station on the Keisei Kanamachi Line"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Located inside Koganei Park, this open-air museum relocates and restores historical buildings from the Edo period to the early Showa period, including retro public bathhouses and traditional merchant shops.", "duration": "2-3 hours", "title": "Edo-Tokyo Open Air Architectural Museum", "transport": "Take the Seibu Bus from the North Exit of JR Chuo Line \u0027Musashi-Koganei Station\u0027 to \u0027Koganei-koen Nishi-guchi\u0027, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Dedicated to Sugawara no Michizane, the deity of learning, this sacred spot is popular among students praying to pass exams. Beautiful plum blossoms bloom abundantly here during the early spring Plum Blossom Festival.", "duration": "1 hour", "title": "Yushima Tenmangu Shrine", "transport": "About a 2-minute walk from Exit 3 of \u0027Yushima Station\u0027 on the Tokyo Metro Chiyoda Line"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A massive entertainment complex combining a baseball stadium, theme park                 let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
