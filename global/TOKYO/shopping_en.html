"name": "Don Quijote Akihabara Beauty Corner", "transport": "About 3 mins walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "Yodobashi-AKIBA 1F, 1-1 Kanda Hanaokacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 | Must-Buys: OPERA Lip Tint, Fujiko Ponpon Powder, D-UP Silky Liquid Eyeliner. This boutique store focuses on women\u0027s beauty and refined skincare, located on the ground floor of the giant Yodobashi-AKIBA complex. Featuring elegant lighting and displays resembling a beauty magazine layout, it has dedicated popular ranking zones to help customers easily browse the latest viral Japanese makeup, personal fragrances, and exquisite hand creams.", "name": "Ainz \u0026 Tulpe Yodobashi-AKIBA", "transport": "Directly connected to JR Akihabara Station (Showa-dori Exit)"}, {"address": "Atre Akihabara 1 2F, 1-17-6 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 | Must-Buys: to/one Petal Eye Shadow, F Organics Moisture Lotion, shiro Body Mist. A specialty beauty shop focusing on organic, natural, and botanical formulations, loved by local women who value quality living. The store offers organic-certified domestic sunscreens, body washes, skincare, and natural makeup. With fresh and pleasing natural scents, it is a wonderful independent boutique for discovering unique natural beauty items and gifts.", "name": "Cosme Kitchen Atre Akihabara 1", "transport": "Directly connected to JR Akihabara Station"}, {"address": "1-6-5 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 | Must-Buys: Minon Amino Moist Essential Mask, Chifure Washable Cold Cream, Rohto Melano CC Concentration Essence. Kokumin is an established Japanese drug store chain known for providing warm, local, and professional advice. Its Akihabara store offers a rich selection of essential daily skincare, time-tested affordable beauty lines, whitening and anti-aging essences, and travel skincare items\u2014all at very budget-friendly prices.", "name": "Kokumin Drug Akihabara", "transport": "About 1 min walk from JR Akihabara Station (Showa-dori Exit)"}, {"address": "4-1-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 | Must-Buys: SK-II Facial Treatment Essence, Canmake Melty Luminous Rouge, KOSE Clear Turn Mask. BicCamera sells far more than electronics; its beauty floor combines high-end department store counters with popular drugstore brands. It uniquely features trial stations pairing beauty electronics with skincare products, allowing shoppers to test and buy popular Japanese facial devices alongside their matching serums for maximum convenience and tax-free savings.", "name": "BicCamera AKIBA Beauty \u0026 Drug Floor", "transport": "About 2 mins walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "2-7-2 Kanda Sudacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 | Must-Buys: Shiseido ELIXIR Superieur Moisture Lotion \u0026 Emulsion, Ryukakusan Throat Refreshing Powder, Transino White C Clear. Sugi Pharmacy is a trusted chain among local Japanese residents. Situated on the quieter edge of Akihabara, this branch provides a comfortable, unhurried shopping environment away from crowded lines. In addition to general health remedies, it features consultation counters for major Japanese brands like Shiseido and Kao, making it great for purchasing high-quality, authentic Japanese skincare lines.", "name": "Sugi Pharmacy Kanda Akihabara", "transport": "About 3 mins walk from Tokyo Metro Hibiya Line Akihabara Station (Exit 5)"}], "name": "Iconic Local Beauty Stores \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2k540 AKI-OKA ARTISAN O-1, 13-1 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade leather sneakers from Bingo Fuchu, SPM-110 Classic Kangaroo Leather Sneakers. A top-tier handmade footwear brand located in the 2k540 artisan alley beneath the JR elevated tracks, originating from Bingo Fuchu, Hiroshima. Known for its unique vulcanized outsoles and ultra-comfortable kangaroo leather, the brand emphasizes pure artisan craftsmanship, combining trendy style with exceptional durability. Extremely popular among local Japanese fashion enthusiasts and sneakerheads.", "name": "SPINGLE MOVE 2k540", "transport": "About a 5-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "2k540 AKI-OKA ARTISAN N-1, 13-1 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Tochigi leather tote bags, vegetable-tanned handmade short wallets. An independent Japanese leather workshop brand that insists on using top-tier Japanese \u0027Tochigi Leather\u0027 and world-renowned fine leathers. Master artisans hand-stitch various leather goods, shoes, and bags on-site. The items develop a rich, textured patina over time, featuring a unique, warm Japanese minimalist design.", "name": "b3Labo 2k540 Akihabara", "transport": "About a 5-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "2k540 AKI-OKA ARTISAN D-1, 13-1 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Saddle leather business briefcases, handmade leather crossbody bags. SOMES SADDLE is Japan\u0027s sole harness maker, founded in Hokkaido and dubbed the \u0027Herm\u00e8s of Japan.\u0027 Applying flawless equestrian stitching craftsmanship to premium leather bags and accessories, their designs are sleek and exceptionally durable. The Akihabara 2k540 store showcases classic handmade leather bags blending traditional craft with modern urban fashion.", "name": "SOMES SADDLE 2k540", "transport": "About a 5-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "4F Onoden Building, 1-2-7 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Gundam-themed embroidered MA-1 flight jacket, anime collaboration heavyweight canvas crossbody bag. A flagship apparel store seamlessly blending Akihabara\u0027s unique anime subculture with modern street fashion. COSPA is a highly influential Japanese officially licensed streetwear brand, offering stylish collaboration T-shirts, bomber jackets, and tactical bags with fashionable cuts that stylishly integrate subculture elements into daily wear.", "name": "COSPA G-Store Akiba", "transport": "About a 2-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "6-14-3 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: HOUSTON A-2 US military genuine leather flight jacket, military-grade durable tactical backpack. A legendary Japanese store specializing in military-style apparel and leather jackets for decades, serving as a mecca for vintage military gear and rugged menswear fans. The store houses a vast collection of authentic US and international military surplus, retro leather jackets, tactical boots, and heavy-duty canvas backpacks\u2014sturdy and packed with character.", "name": "Nakata Shoten Akihabara", "transport": "1-minute walk from Exit 4 of Suehirocho Station (Tokyo Metro Ginza Line) / About a 7-minute walk from JR Akihabara Station"}, {"address": "3-14-10 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Second-hand Japanese designer jackets, like-new vintage designer leather bags. A local Japanese vintage clothing, shoes, and bags store under the BOOK-OFF Group. Spanning multiple floors, the Akihabara store curates a wide selection of near-mint Japanese street fashion, vintage outerwear, sneakers, and pre-owned luxury bags. It\u0027s a treasure trove for finding unique Japanese silhouettes at affordable prices.", "name": "MODE OFF Akihabara", "transport": "About a 5-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "2F Atre Akihabara 1, 1-17-6 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Control Bear graphic tee, picture-book illustration style canvas tote bag. An iconic Japanese graphic apparel brand renowned for fusing artwork, picture book illustrations, and cultural elements into clothing. Located inside Atre department store, the Akihabara branch offers high-quality graphic T-shirts, cardigans, and unique totes\u2014playful styles that stand out from the crowd.", "name": "graniph Atre Akihabara", "transport": "Directly connected to JR Akihabara Station (2F Atre 1 Building)"}, {"address": "5F AKIBA CULTURES ZONE, 1-7-6 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Character concept embroidered hoodies, anime-themed high-top canvas sneakers. A Japanese brand specializing in subculture fashion and trendy merchandise, beloved by local youth and fashion enthusiasts. Beyond high-quality character wear, the shop features stylish boots, statement caps, and custom bags infused with Akihabara street style, capturing the district\u0027s unique fashion charm.", "name": "ACOS Akihabara Main Store", "transport": "About a 4-minute walk from JR Akihabara Station (Electric Town Exit)"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "8-2 Kanda Neribeicho, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Regional specialty curry packs from across Japan, Kochi Yuzu juice, and artisan-selected soy sauce rice crackers. Located beneath the elevated train tracks, this unique shopping center gathers top-tier specialties and regional snacks from all 47 prefectures of Japan. From rare local sake to traditionally crafted senbei (rice crackers), it is the ultimate haven for sourcing hidden gourmet souvenirs from across Japan in one go\u2014hugely popular with travelers who value quality and local flair.", "name": "Nippon Department Store Shokuhinkan (CHABARA AKI-OKA MARCHE)", "transport": "Approx. 3-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "1F Akihabara Radio Kaikan, 1-15-16 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Moe anime girl printed sandwich cookies, Akihabara-exclusive printed rice crackers, and anime character-shaped chocolates. Located on the 1st floor of the iconic Akihabara Radio Kaikan, this shop specializes in exclusive snacks and novelty gifts packed with Akihabara\u0027s signature otaku culture. Featuring fun anime artwork and subculture memes on the packaging, it\u2019s the top choice for finding memorable, conversation-starting souvenirs for friends.", "name": "Gift Shop The Aki-ba", "transport": "Right outside JR Akihabara Station (Electric Town Exit)"}, {"address": "2-16-2 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Kanda Myojin anime-collaboration manju (steamed buns), IT/tech protection charms (Omamori), and Victory Charm-shaped rice cracker gift boxes. Blending traditional shrine heritage with modern Akihabara anime culture, this center offers shrine-blessed unique souvenirs. Highlights include gadget safety charms designed for techies and otakus, alongside exclusive anime-branded pastries\u2014combining spiritual blessings with local cultural flair.", "name": "Kanda Myojin EDOCCO Cultural Exchange Center", "transport": "Approx. 7-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "4-3-3 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Akihabara-exclusive AKB48 collabo cookies, bulk Matcha KitKats, and various anime-themed snacks. As Akihabara\u0027s most iconic discount mega-store, it features expansive snack and souvenir sections on the ground floor and throughout the building. Beyond a vast array of popular Japanese snacks, you\u0027ll find unique pop-culture gifts exclusive to this location, making it perfect for late-night shopping and bulk buying.", "name": "Don Quijote Akihabara", "transport": "Approx. 3-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "4-3-2 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Popular anime collabo sandwich cookies, voice actor-supervised specialty curry packs, and character visual tea bag gift sets. As one of Japan\u0027s premier anime chain flagships, its snack department offers a huge variety of limited-edition treats featuring trending anime and VTubers. Each snack or drink often comes with exclusive collectible cards or badges, making it an unmissable souvenir spot for anime lovers and subculture fans.", "name": "Animate Akihabara Building 1", "transport": "Approx. 4-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "Platforms 5 \u0026 6 (Sobu Line), JR Akihabara Station, 1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Rich bottled Hida milk, nostalgic coffee milk, and traditional steamed cake. Operating on the platform of JR Akihabara Station since the 1950s, this legendary milk stand is a cherished memory for generations of commuters and anime fans. Serving glass-bottled fresh and flavored milk delivered straight from farms across Japan, paired with classic cashew cake or red bean buns, it offers an authentic taste of nostalgic Showa-era food culture.", "name": "Milk Stand Akihabara Station", "transport": "Located inside JR Akihabara Station on the Sobu Line platform"}, {"address": "1-13-1 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Crispy winged red bean Taiyaki, rich custard cream Taiyaki, and handmade Karinto (sweet fried dough) that stays crispy even cold. A famous traditional shop celebrated for its signature thin, crispy \u0027winged\u0027 crust. Freshly baked on high-heat cast iron molds using Hokkaido Tokachi red beans, the outer shell is cracker-crisp while the filling is smooth and nicely balanced. Beyond enjoying them fresh, their takeaway gift boxes and traditional Karinto snacks make hugely popular sweet souvenirs.", "name": "Kanda Daruma Akihabara", "transport": "Approx. 2-minute walk from JR Akihabara Station (Electric Town Exit)"}, {"address": "2-18-15 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional natural Koji Amazake, century-old secret recipe sesame miso crackers, and handmade Koji miso. Founded in 1846 (Ansei era), this historic establishment sits right next to the Kanda Myojin Torii gate. Utilizing an underground natural cellar to age rice koji, they craft non-alcoholic, naturally sweet warm amazake. Their signature Koji miso and traditionally roasted crackers represent top-tier gift items for experiencing authentic Edo-era flavors in Tokyo.", "name": "Amanoya (Historic Amazake Shop)", "transport": "Approx. 8-minute walk from JR Akihabara Station (Electric Town Exit)"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-1 Kanda Hanaokacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Panasonic Nanoe Hair Dryer, Sony Active Noise-Canceling Bluetooth Headphones, Zojirushi High-Tech Insulated Travel Mug. Yodobashi Camera Multimedia Akiba is one of Japan\u0027s largest comprehensive electronics department stores, spanning nine full floors. From the latest Japanese home appliances, digital cameras, and cosmetics to an entire floor dedicated to scale models and toys, it has it all. The upper floors feature a dining precinct and an indoor golf driving range, alongside generous tax-free shopping and credit card discounts for foreign tourists\u2014making it the ultimate shopping haven for electronics and digital gadgets in Akihabara.", "name": "Yodobashi Camera Multimedia Akiba", "transport": "Approx. 1-minute walk from Showa-dori Exit of JR Akihabara Station"}, {"address": "1-15-16 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: K-BOOKS exclusive anime badges, Kaiyodo detailed blind-box figures, VOLKS original Ball-Jointed Doll (BJD) accessories. Akihabara Radio Kaikan is an iconic local landmark commercial complex with over half a century of history. This 10-story otaku department store brings together countless independent model shops, trading card specialty stores, and second-hand anime merchandise shops. Densely packed with unique stores from top to bottom, it is a holy pilgrimage site for all anime enthusiasts and figure collectors visiting Akihabara.", "name": "Akihabara Radio Kaikan", "transport": "Approx. 1-minute walk from Electric Town Exit of JR Akihabara Station"}, {"address": "4-3-2 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Demon Slayer exclusive character badges, Jujutsu Kaisen acrylic stands, popular anime collaboration perfumes. Animate Akihabara is Japan\u0027s most iconic specialty anime department store, split into the Main Building and Building 1. It boasts the most complete selection of officially licensed anime goods, voice actor CDs, doujinshi (fan comics), and various manga books. Hosting frequent limited-time pop-up shops and voice actor autograph sessions with rapid inventory updates, it\u0027s the ultimate hotspot to experience contemporary Japanese ACG culture and grab exclusive merchandise.", "name": "Animate Akihabara", "transport": "Approx. 4-minute walk from Electric Town Exit of JR Akihabara Station"}, {"address": "1-6-5 Kanda Sakumacho, Chiyoda City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: MUJI packable tote bag, Uniqlo Akihabara store exclusive graphic tees, Maker\u0027s Shirt Kamakura premium men\u0027s shirts. AKIBA TOLIM is a refined lifestyle shopping mall directly connected to JR Akihabara Station. Distinct from the traditional electronics strip, it focuses on daily lifestyle goods, Japanese-style quality apparel, and high-grade personal items, showcasing local Japanese brands and curated specialty shops. With a comfortable ambiance and super convenient access, it\u0027s perfect for travelers looking to escape the crowds while shopping for stylish Japanese fashion and everyday lifestyle items.", "name": "AKIBA TOLIM", "transport": "Directly connected to Central Gates of JR Akihabara Station"}, {"address": "3-11-3 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Nostalgic Famicom (NES) classic game cartridges, out-of-print pre-owned anime PVC figures, popular Ichiban Kuji Prize B figures. Surugaya is a quintessential local shopping department building for pre-owned anime merchandise and vintage collectibles in Akihabara. Meticulously organized across multiple floors, it houses tens of thousands of pre-owned anime goods, rare scale models, and retro 80s/90s gaming consoles and cartridges. Known for highly competitive pricing and professional authentication, it draws collectors worldwide hunting for rare, prized gems.", "name": "Surugaya Akihabara Main Building", "transport": "Approx. 5-minute walk from Electric Town Exit of JR Akihabara Station"}, {"address": "5-9-23 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Tokyo Gakugei handcrafted leather long wallets, Nippon-Kichi Japanese handmade lacquerware tableware, HMA minimalist metal designer jewelry. Tucked beneath the railway tracks between Akihabara and Okachimachi, 2k540 AKI-OKA ARTISAN is Tokyo\u0027s premier shopping arcade for artisanal handmade crafts. It houses over 50 combined studio-shops of emerging local designers and traditional master craftsmen offering unique items like leather goods, woodwork, jewelry, and dyed textiles. Exuding an artistic hipster charm, it displays Japan\u0027s supreme craftsmanship in stark contrast to the nearby electronics town.", "name": "2k540 AKI-OKA ARTISAN", "transport": "Approx. 6-minute walk from JR Akihabara Station towards Okachimachi along the Yamanote Line tracks"}, {"address": "3-13-12 Sotokanda, Chiyoda City, Tokyo", "feature": "\u2b50 4.0 stars | Must-Buy List: Display-grade clearance iPads, pre-owned Nintendo Switch consoles, out-of-print PS4 game discs. Sofmap is a local digital electronics giant in Akihabara, and this specialized branch focuses on outlet clearance items and high-quality pre-owned goods. It offers professionally tested and cleaned electronics, PC parts, gaming consoles, and anime media at discounted prices. If you\u0027re looking to purchase premium Japanese electronics or gaming gear at bargain prices far below market rate, this is hands-down Akihabara\u0027s top outlet spot.", "name": "Sofmap AKIBA Subculture \u0026 Outlet", "transport": "Approx. 5-minute walk from Electric Town Exit of JR Akihabara Station"}, {"address": "2-6-1 Nakase, Mihama Ward, Chiba City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: BEAMS past-season tailored trench coats, Coach double-discounted classic leather bags, Adidas limited-style discounted sneakers. Accessible in about 35 minutes via the JR Sobu Line or Keiyo Line from Akihabara Station, this is one of the Kanto region\u0027s most convenient major outlet shopping centers. Divided into multiple zones, it houses over 130 renowned Japanese brands and top international fashion labels offering massive discounts of 30% to 70% off. With extra tax-free savings and special coupons for international tourists, it\u0027s the ultimate outlet destination for brand-name clothing and handbag shopping near Akihabara.", "name": "Mitsui Outlet Park Makuhari", "transport": "Take the JR Sobu Line from JR Akihabara Station to Makuhari-Hongo Station and transfer to a bus, or take a train to JR Kaihimmakuhari Station and walk approx. 1 minute"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Akihabara"}, "asakusa_ueno": {"categories": {"cat_1": {"items": [{"address": "1-39-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Pure Gold Leaf Hand Cream, Konjac Facial Cleansing Sponge, Natural Botanical Beauty Oil. Originating from Kanazawa\u0027s century-old gold leaf foundry Hakuza, this natural skincare brand offers a store filled with rich Japanese ambiance at its Asakusa location. Its signature hand cream uses edible-grade ingredients and natural gold leaf, absorbing quickly without feeling sticky\u2014perfect for autumn and winter care. The konjac cleansing sponge becomes extremely soft when soaked in water, gently exfoliating dead skin cells, making it an unmissable local beauty find.", "name": "MAKANAI Asakusa Branch", "transport": "Approx. 3 mins walk from Exit 1 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "1-37-10 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-buy list: Satsuma Boxwood Comb, Pure Camellia Oil from Izu Oshima, Hair Care Wooden Comb Repair Set. Founded during the Tenpo era of the Edo period, this century-old shop specializes in boxwood combs and hair care products. Handcrafted from premium Satsuma boxwood and nourished with natural camellia oil, these combs effectively reduce static electricity while nourishing the scalp and hair. They are a traditional Japanese secret for maintaining shiny, healthy black hair, offering immense collectible and gifting value.", "name": "Asakusa Yonoya Kushi-ten", "transport": "Approx. 5 mins walk from Asakusa Station on the Tobu Isesaki Line, or 3 mins walk from Asakusa Station on the Tsukuba Express"}, {"address": "2-1-3 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Asakusa-exclusive Gold Leaf Konjac Soap, Yaezakura Bouncy Facial Cleansing Soap, Matcha Antioxidant Cleansing Soap. Located near Denboin-dori in Asakusa, this specialty beauty shop sells jelly-like, squishy konjac facial soaps. Made with natural Japanese konjac extract and botanical essences, the soaps produce extremely dense foam with incredible moisturizing power. The Asakusa branch\u0027s exclusive gold leaf and cherry blossom versions are exquisitely designed, leaving skin feeling silky smooth without tight feelings\u2014making them one of Asakusa\u0027s most talked-about beauty gifts.", "name": "Tokyo Konnyaku Shabon Asakusa Branch", "transport": "Approx. 4 mins walk from Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "6-11-5 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: EVE Quick DX Pain Reliever, PAIR Acne Cream, Ryukakusan Herbal Throat Powder. A legendary vintage pharmacy located inside Ueno\u0027s Ameyoko Market. Although the shop space is small and does not offer tax-free shopping for tourists, its pre-tax cash prices are often discounted so heavily that they are cheaper than tax-free prices at major chain drugstores! It is a top destination for Japanese locals and savvy travelers to stock up on household medicines and high-CP value skincare products.", "name": "OS Drug Ueno Ameyoko", "transport": "Approx. 3 mins walk from Shinobazu Exit of JR Ueno Station, or 3 mins walk from JR Okachimachi Station"}, {"address": "4-33-2 Taito, Taito-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: Shiseido Bio-Performance Advanced Super Revitalizing Cream, Kanebo suisai Beauty Clear Powder, SK-II Facial Treatment Essence. Located in the Okachimachi and Ueno area, Takeya is a famous discount department store marked by its iconic purple buildings, with TAKEYA3 dedicated to pharmaceuticals, cosmetics, and skincare. It gathers top Japanese luxury counter brands as well as affordable drugstores, offering highly competitive discounts and tax-free shopping year-round. Friendly Chinese-speaking staff are available on-site, making it the best one-stop shopping destination in Ueno for Japanese cosmetics.", "name": "Takeya Building 3 - Cosmetics \u0026 Pharmacy", "transport": "Approx. 2 mins walk from North Exit of JR Yamanote Line Okachimachi Station, or 1 min walk from Toei Oedo Line Ueno-Okachimachi Station"}, {"address": "3F Ueno Marui, 6-15-1 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: @cosme Hall of Fame Cleansing Powder, Decort\u00e9 Liposome Moisture Serum, Canmake Stay-On Balm Rouge. Located inside the Ueno Marui Department Store, this physical store is operated directly by Japan\u0027s largest beauty review website. Products are displayed entirely according to real consumer rankings, accompanied by generous tester areas. Whether you are looking for the latest popular makeup releases or shopping top-rated skincare products based on rankings, you can easily find the perfect items for yourself here.", "name": "@cosme store Ueno Marui Branch", "transport": "Approx. 1 min walk from Hirokoji Exit of JR Ueno Station, or directly connected to Exit 5 of Tokyo Metro Ueno Station"}, {"address": "B1F Ueno Marui, 6-15-1 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: DAZZSHOP Sparkle Pour Eyes Liquid Eyeshadow, Excel Real Clothes Shadow Palette, DUO Cleansing Balm. A spacious, brightly lit, and stylish beauty flagship store focusing on Japan\u0027s latest trending makeup, popular K-beauty skincare, and independent niche beauty brands. Cosmetics are clearly organized by color and effect with exceptionally comprehensive tester setups, making it a favorite shopping paradise for young women and beauty lovers visiting Ueno.", "name": "Ains \u0026 Tulpe Ueno Marui Branch", "transport": "Approx. 1 min walk from Hirokoji Exit of JR Ueno Station, or directly connected to Tokyo Metro Ueno Station"}, {"address": "1-30-2 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: Matsukiyo Exclusive Hydrating Facial Sheet Mask, Anessa Perfect UV Sunscreen Skincare Milk, Curel Intensive Moisture Facial Cream. Located in Asakusa\u0027s bustling Shin-Nakamise Shopping Street, this Matsumoto Kiyoshi branch caters to both tourists and locals with a comprehensive beauty section and exclusive items. Beyond popular drugstore items, it stocks high-CP skincare products from Matsumoto Kiyoshi\u0027s house brand (matsukiyo). Bright and spacious, it offers full tax-free counter services.", "name": "Matsumoto Kiyoshi Asakusa Shin-Nakamise Branch", "transport": "Approx. 3 mins walk from Exit 1 of Asakusa Station on the Tokyo Metro Ginza Line"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1-14-5 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Inujirushi Canvas Tote, Vintage Camera Bag, Pure Cotton Canvas Pencil Case. Founded in 1953 in Tokyo, this long-established canvas bag brand is renowned for its high-density waterproof canvas and sturdy sewing craftsmanship. Every bag features the brand\u0027s iconic metal buckle and logo. Simple, durable, and packed with retro handcrafted character, it is the top choice for design lovers and local residents alike.", "name": "Inujirushi Kaban Seizakusho Asakusa Honten", "transport": "Approx. 3 min walk from Tobu Isesaki Line \"Asakusa Station\" / Approx. 4 min walk from Tokyo Metro Ginza Line \"Asakusa Station\""}, {"address": "2-2-10 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-buy list: Himeji Cowhide Hand-painted Long Wallet, Floral Pattern Kiss-Lock Pouch, Hand-painted Business Card Holder. A traditional leathercraft store with over 90 years of history. Using white-tanned cowhide from Himeji, Hyogo Prefecture, master artisans perform delicate embossing, hand-painting, and lacquer work to create exquisite, artwork-like leather goods. Featuring vibrant, elegant patterns that are uniquely one-of-a-kind, this shop represents the pinnacle of Asakusa craftsmanship.", "name": "Bunkoya Ozeki Asakusa", "transport": "Approx. 2 min walk from Tokyo Metro Ginza Line \"Asakusa Station\" Exit 6"}, {"address": "1-31-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade Paulownia Geta, Premium Lacquered Zori, Customized Hanao (Strap) Patterns. Established in 1912, this century-old traditional footwear shop specializes in Japanese Geta (wooden clogs) and Zori sandals. Offering hundreds of hand-woven straps (hanao), customers can pick their preferred wooden base and straps on-site. Artisans will measure and adjust them on the spot to fit your foot shape perfectly, creating comfortable, tailor-made traditional footwear.", "name": "Tsujiya Honten", "transport": "Approx. 3 min walk from Tokyo Metro Ginza Line \"Asakusa Station\" Exit 1"}, {"address": "2-2-1 Asakusa, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Yuzen-Dyed Cat Pattern Short Wallet, Banshu Himeji Leather Zip Long Wallet, Yuzen-Dyed Glasses Case. Combining traditional Japanese \"Yuzen-dyeing\" techniques with leather embossing, this shop crafts colorful leather items with striking tactile dimensions. Elegant, gentle, and deeply Japanese in style, both classic flora/bird patterns and cute modern cat series are hugely popular with local and international travelers.", "name": "Asakusa Bunko", "transport": "Approx. 3 min walk from Tobu Isesaki Line \"Asakusa Station\""}, {"address": "6-14-10 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: A-2 Genuine Leather Flight Jacket, MA-1 Bomber Jacket, US Military Surplus Gear. The most legendary military fashion and leather jacket specialty store in Ueno\u0027s Ameyoko Market. Founded after WWII, the shop is packed with authentic military wear, vintage jackets, genuine leather coats, and outdoor gear from around the world. The exterior display covered in military surplus creates a strong, hardcore retro vibe that attracts fashion enthusiasts and military fans globally.", "name": "Nakata Shoten Ameyoko", "transport": "Approx. 2 min walk from JR \"Ueno Station\" Shinobazu Exit / Approx. 3 min walk from JR \"Okachimachi Station\" North Exit"}, {"address": "2F Ameyoko Center Building, 4-7-8 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Mita Exclusive Collaboration Sneakers, Ultra-Limited Sneaker Accessories, Classic Vintage Sportswear. Located inside Ueno\u0027s Ameyoko, this world-famous boutique is a sacred ground for Tokyo\u0027s sneaker culture. Renowned for its high-profile collaborations and hard-to-find limited releases, the iconic wire-mesh display walls showcase the most cutting-edge, rare, and popular kicks from top brands\u2014a absolute must-visit landmark for sneaker collectors.", "name": "Mita Sneakers", "transport": "Approx. 3 min walk from JR \"Ueno Station\" Hirokoji Exit / Approx. 3 min walk from JR \"Okachimachi Station\" North Exit"}, {"address": "6-10-22 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Burgus Plus Selvedge Vintage Jeans, Buzz Rickson\u0027s Reproduction Jackets, Warehouse Heavyweight Cotton Tees. A long-standing haven for denim and American heritage fashion in Ameyoko, operating since 1949 with a singular focus on high-quality denim and vintage reproduction clothing. It houses premier Japanese denim brands such as Sugar Cane, Studio D\u0027Artisan, and house brand Burgus Plus. The friendly, expert staff provide precise fitting and denim-fading advice.", "name": "HINOYA Honten", "transport": "Approx. 2 min walk from JR \"Okachimachi Station\" North Exit / Approx. 4 min walk from JR \"Ueno Station\" Hirokoji Exit"}, {"address": "6-10-3 Ueno, Taito-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: Levi\u0027s Japan Limited Edition Jeans, EDWIN Classic Vintage Shirts, Alpha Industries Flight Jackets. Standing prominently at the entrance of Ameyoko, this large casual wear store has been open for over 70 years. Spanning several floors, it displays tens of thousands of jeans and American casual clothes, ranging from affordable basics to premium Made-in-Japan denim, frequently with great discounts\u2014a wonderful spot for casualwear and leather belts.", "name": "Americaya", "transport": "Approx. 2 min walk from JR \"Okachimachi Station\" North Exit / Approx. 4 min walk from JR \"Ueno Station\" Hirokoji Exit"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-22-1 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.4 Stars | Must-buy: Sweet Potato Yokan, Anko Dama (Red Bean Balls), Sweet Potato Crackers. Founded in the 35th year of the Meiji period (1902), this century-old traditional shop is famous for its \u0027Sweet Potato Yokan\u0027, which preserves the natural sweetness of sweet potatoes without any artificial coloring or preservatives. A classic Asakusa Wagashi with a smooth, velvety texture and balanced sweetness, beloved by locals and tourists alike.", "name": "Funawa Main Store", "transport": "Approx. 3-minute walk from Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "2-18-11 Kaminarimon, Taito City, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy: Handmade Dorayaki, Matsukaze (Brown Sugar Cake), Monaka. Renowned as one of Tokyo\u0027s top three Dorayaki shops, its pancake crust is as soft and fluffy as a souffl\u00e9 with a charming roasted aroma, stuffed with premium red bean paste from Tokachi, Hokkaido. Long queues form daily well before opening hours.", "name": "Kamejuu", "transport": "Right outside Exit 2 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "1-3-2 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.1 Stars | Must-buy: Kaminari-okoshi (Rice Crackers), Ningyo-yaki, Brown Sugar Rice Crackers. Located right next to Senso-ji Temple\u0027s Kaminarimon Gate with over 200 years of history, this is Asakusa\u0027s most iconic souvenir shop. \u0027Kaminari-okoshi\u0027 blends puffed rice, maltose, and nuts for a sweet, crunchy bite that symbolizes good fortune and family safety\u2014a must-have traditional snack when visiting Asakusa.", "name": "Tokiwado Kaminari-okoshi Main Store", "transport": "Approx. 1-minute walk from Exit 1 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "6-11-3 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.2 Stars | Must-buy: 1,000-Yen Bargain Chocolate Bag, Japan-exclusive snack packs, imported biscuit assortments. A legendary snack store located in Ueno\u0027s Ameyoko Market, famous for its staff\u0027s energetic and enthusiastic barker performances. For just 1,000 yen, you get a bag stuffed with brand-name chocolates and famous cookies worth far more than the price\u2014a fun and unbeatable bargain experience.", "name": "Shimura Shoten", "transport": "Approx. 3-minute walk from the Shinobazu Exit of JR Ueno Station"}, {"address": "1-21-5 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.2 Stars | Must-buy: Yaki Imo Yokan (Baked Sweet Potato Yokan), Kuri Kinton (Chestnut Paste), Sweet Potato Crackers. Mangan-do captivates food lovers with its unique \u0027Yaki Imo Yokan\u0027. The thin outer skin is delicately toasted over precise heat, locking in the dense, sweet goodness of sweet potato with a subtle roasted aroma. Exquisitely packaged with a longer shelf life, it makes a perfect gift to bring home.", "name": "Asakusa Mangan-do Main Store", "transport": "Approx. 3-minute walk from Asakusa Station on the Tobu Isesaki Line"}, {"address": "1-30-1 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy: Handmade Senbei (Rice Crackers), Soy Sauce \u0026 Nori Rice Crackers, Sun-Dried Senbei. Located on Asakusa Temple\u0027s Nakamise-dori Street, this historic shop crafts handmade rice crackers using premium domestic Japanese rice baked with traditional techniques. Exceptionally crunchy and satisfying, brushed with rich, aromatic soy sauce, every bite offers a nostalgic taste of old Tokyo\u0027s Edo downtown charm.", "name": "Asakusa Kameya", "transport": "Approx. 3-minute walk from Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "1-20-10 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.2 Stars | Must-buy: Gaufres (Wafer Sandwich Cookies), Tokyo Caramelize, Petit Gaufres. Established in 1747, this classic Western confectionery shop blends French techniques with refined Japanese craftsmanship. Its signature product, \u0027Gaufres\u0027, features crisp wafers filled with rich vanilla, chocolate, and strawberry cream. Elegantly packaged, it is Ueno\u0027s premier choice for sophisticated gifts.", "name": "Ueno Fugetsudo Main Store", "transport": "Right outside Exit A4 of Ueno-hirokoji Station on the Tokyo Metro Ginza Line"}, {"address": "1-10-10 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.5 Stars | Must-buy: Usagiya Dorayaki, Usagi Manju (Rabbit Buns), Monaka. Founded in 1913 (Taisho 2), Usagiya is widely recognized as one of Tokyo\u0027s finest Dorayaki makers. The pancake skin is delicate and soft, wrapped around moist and flavorful red bean paste made from Hokkaido Tokachi beans. Eaten warm, it delivers a rich, smooth bean flavor\u2014an unmissable, top-tier treat representing the Ueno area.", "name": "Usagiya", "transport": "Approx. 3-minute walk from Exit 6 of Yushima Station on the Tokyo Metro Chiyoda Line"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-29-5 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Ueno Fugetsudo gaufres, Sakuragitei panda senbei (rice crackers), and Kanaya Hotel century-old bread. A historic department store located in the heart of Ueno with over 300 years of history. The underground food hall features an exceptionally rich collection of local Tokyo souvenirs and Ueno-exclusive panda-themed treats, making it the best place to experience traditional Japanese department store culture and shop for famous heritage items.", "name": "Matsuzakaya Ueno Store", "transport": "1-minute walk from Okachimachi Station on the JR Yamanote Line, or directly connected to Ueno-hirokoji Station on the Tokyo Metro Ginza Line"}, {"address": "1-4-1 Hanakawado, Taito City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Asakusa Imahan beef tsukudani, Funawa sweet potato yokan, and handmade ninja gear and goods. A retro-style shopping center directly connected to Tobu Asakusa Station, featuring a preserved early-Showa era neoclassical architectural exterior. Inside, special zones showcase traditional Japanese handicrafts and local heritage delicacies from Asakusa. The rooftop deck offers magnificent close-up views of Tokyo Skytree.", "name": "Asakusa EKIMISE", "transport": "Directly connected to Asakusa Station on the Tobu Isesaki Line, or a 1-minute walk from Exit 7 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "2-6-7 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Regional craft sake, artisan handcrafted wooden tableware, and premium specialty soy sauces from around Japan. Located in the heart of Asakusa Rokku, this commercial hub carefully selects regional brands and artisanal crafts from all over Japan. Avoiding mass-produced goods, it focuses on lifestyle items and regional delicacies that showcase local Japanese culture and craftsmanship\u2014a paradise for lovers of refined living.", "name": "Marugoto Nippon", "transport": "1-minute walk from Exit A1 of Asakusa Station on the Tsukuba Express"}, {"address": "2-1-16 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic pure cotton canvas tote bags, vintage camera crossbody bags, and handmade leather keychains. An iconic independent canvas bag brand in Asakusa, it insists on 100% handcrafted stitching by Japanese artisans. Using natural extra-thick canvas and high-quality leather, their products are exceptionally durable and develop a unique patina over time. The minimalist classic designs are adored by local hipsters and savvy travelers alike.", "name": "Inujirushi Kaban Seisakusho Main Store (Asakusa)", "transport": "3-minute walk from Exit 6 of Asakusa Station on the Tokyo Metro Ginza Line"}, {"address": "6-15-1 Ueno, Taito City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Francfranc stylish home decor, GAP trendy casual wear, and MUJI high-capacity storage goods. A trendy department store facing JR Ueno Station, highly popular among young adults and budget shoppers. It features numerous domestic fashion brands, cosmetics counters, and Japanese lifestyle goods in a bright, comfortable shopping environment with comprehensive tax-free services.", "name": "0101 Marui Ueno", "transport": "1-minute walk from Hirokoji Exit of JR Ueno Station, or directly connected to Exit 4 of Tokyo Metro Ueno Station"}, {"address": "1-25-15 Asakusa, Taito City, Tokyo", "feature": "\u2b50 4.0 stars | Must-Buy List: SEIYU supermarket Japanese soy sauce and snacks, Daiso novelty goods, and affordable Japanese women\u0027s fashion. A major commercial complex heavily frequented by Asakusa locals, housing fashion stores, lifestyle goods, a large supermarket, and even hot spring facilities. With an authentic local atmosphere and budget-friendly prices, it\u0027s ideal for visitors wanting to stock up on everyday items and regional snacks.", "name": "Asakusa ROX", "transport": "1-minute walk from Exit A1 of Asakusa Station on the Tsukuba Express, or a 5-minute walk from Tawaramachi Station on the Tokyo Metro Ginza Line"}, {"address": "1-2-1 Iizumi, Shisui-machi, Inba-gun, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Coach classic leather bags, Adidas performance shoes, and Beams discounted Japanese fashion. A massive outlet mall offering convenient transit to/from Narita Airport and Ueno, making it one of the top recommended outlet destinations for visitors in the Asakusa/Ueno area. Featuring over 220 international and popular domestic brands, it offers year-round discounts ranging from 30% to 70% off, along with convenient direct bus services.", "name": "Shisui Premium Outlets", "transport": "Take the Keisei Main Line from Keisei-Ueno Station to Keisei-Shisui Station, then transfer to a local bus for about 20 minutes"}, {"address": "2-6-1 Nakase, Mihama-ku, Chiba City, Chiba Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Mont-bell outdoor technical jackets, Nike discounted running shoes, and clearance Urban Research fashion. An urban outlet mall easily accessible by train from the Ueno area in Tokyo, featuring impressive scale and a strong brand lineup. Housing numerous Japanese select shops and international sportswear brands, it offers trendy fashion and outdoor gear at astonishing discounts\u2014perfect for a half-day shopping spree.", "name": "Mitsui Outlet Park Makuhari", "transport": "From JR Ueno Station, take the Yamanote Line to Akihabara Station and transfer to the JR Chuo-Sobu Line, or go to Tokyo Station and transfer to the JR Keiyo Line to Kaihimmakuhari Station; 1-minute walk from the station exit"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Asakusa and Ueno"}, "ginza_tokyo": {"categories": {"cat_1": {"items": [{"address": "7-8-10 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: ULTIMUNE Power Infusing Concentrate, THE GINZA Supreme Empowering Essence, Ginza-exclusive color cosmetics. This complex flagship store was created in Ginza by Shiseido, Japan\u0027s century-old beauty giant, bringing together beauty shopping, a hair salon, and an art gallery caf\u00e9. The venue offers the most complete lineup of Shiseido\u0027s premium products. Notably, the \u0027THE GINZA\u0027 line, sold only through ultra-luxury channels, is a top choice for prestige skincare. Professional beauty consultants provide personalized skin diagnostics and English service, allowing guests to experience the ultimate Japanese skincare philosophy in an elegant, comfortable space.", "name": "Shiseido Flagship Store (SHISEIDO THE STORE)", "transport": "About a 5-minute walk from Exit A2 of Tokyo Metro Ginza Station"}, {"address": "7-10-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: DECORT\u00c9 Vita De R\u00eave Herbal Lotion and Phytotune Refining Softener, SEKKISEI Supreme Cream, Maison KOS\u00c9 customized lip balm. This multi-brand high-tech concept flagship store opened by KOS\u00c9 Group in Ginza deeply integrates skincare, cosmetics, and digital tech. The store covers KOS\u00c9\u0027s full brand lineup including DECORT\u00c9, SEKKISEI, and JILL STUART, while also offering 3D virtual makeup trial mirrors and custom engraving services. Combining high quality with modern tech vibes, this shopping experience is a must-visit landmark for exploring modern Japanese beauty trends.", "name": "KOS\u00c9 Concept Flagship Store (Maison KOS\u00c9 Ginza)", "transport": "About a 3-minute walk from Exit A3 of Tokyo Metro Ginza Station"}, {"address": "5-8-16 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: FANCL Mild Cleansing Oil, Calorie Limit supplements, Ginza-exclusive additive-free high-concentration collagen beauty drinks. FANCL\u0027s global flagship building is located in a prime Ginza area, entirely designed around additive-free skincare and healthy living. Customers can shop the newest and most complete range of additive-free skincare products and health supplements while enjoying exclusive vascular health and skin diagnostic services. Featuring a lovely four-seasons rooftop garden and health-themed restaurants on higher floors, it is an essential sanctuary for anyone prioritizing toxic-free, natural skincare and holistic wellness.", "name": "FANCL GINZA SQUARE", "transport": "About a 1-minute walk from Exit A5 of Tokyo Metro Ginza Station"}, {"address": "1F Matsuya Ginza, 3-6-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-Buy List: S100 Series luxury goat hair powder brush, portable black/vermilion handle eyeshadow brush sets, handmade brush soap. Originating from Kumano, Hiroshima, Hakuhodo is a world-class premier handmade makeup brush brand whose counter at Matsuya Ginza is a holy grail destination for professional makeup artists and beauty enthusiasts worldwide. Hakuhodo insists on hand-crafting brushes without cutting the hair tips, creating ultra-skin-friendly brushes with precise powder pick-up. The counter displays hundreds of brushes with different functions and hair types, offering professional brush consultations and custom engraving\u2014the ultimate tool to elevate your makeup routine.", "name": "Hakuhodo Ginza", "transport": "Directly connected to Matsuya Ginza from Exit A12 of Tokyo Metro Ginza Station"}, {"address": "1-7-7 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: POLA Wrinkle Shot Medical Serum, B.A Grandluxe anti-aging/anti-glycation serum, White Shot Inner Lock supplement. POLA is a luxury anti-aging skincare brand favored by the Japanese royal family and elite clientele. Its Ginza flagship store features an aesthetic space designed like an art gallery. The store displays POLA\u0027s cutting-edge anti-glycation and gene-repair tech skincare products, including the legendary Wrinkle Shot Medical Serum\u2014officially approved in Japan for wrinkle improvement. By reservation, the store also offers ultimate facial SPAs and deep skin diagnostics, providing a truly luxurious skincare feast.", "name": "POLA GINZA Flagship Store", "transport": "Right outside Exit 7 of Tokyo Metro Ginza-itchome Station"}, {"address": "5-5-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Matsukiyo exclusive Eucerin Intensive Repair Cream, ARGELAN organic plant moisturizing lip balm, LuLuLun Ginza-exclusive Sake Lees moisturizing mask. Located at a prime intersection in Ginza, this flagship Matsumoto Kiyoshi branch is specially redesigned for tourists and high-end beauty shoppers. The interior is bright and elegant. Beyond a full array of popular Japanese medicines, it features a dedicated \u0027Matsukiyo Beauty LABO\u0027 selling high-quality organic skincare and exclusive cosmetics developed in-house. It also offers multilingual staff and dedicated fast tax-free counters.", "name": "Matsumoto Kiyoshi Ginza 5-Chome Store", "transport": "About a 1-minute walk from Exit B5 of Tokyo Metro Ginza Station"}, {"address": "B1F-1F, Marronnier Gate Ginza 1, 2-2-14 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: D-UP Silky Liquid Eyeliner, CANMAKE Glow Fleur Cheeks (limited colors), DUO Cleansing Balm. AINZ \u0026 TULPE is a mega beauty and cosmetics flagship store hugely popular among young Japanese women. The Ginza store spans vast floors with an incredible selection of items. Skincare and beauty products are clearly categorized by function and viral popularity, alongside dedicated testing zones for seamless sampling. From viral drugstore makeup and Japanese organic skincare to various beauty accessories, it\u0027s the ultimate one-stop spot for trending Japanese beauty products.", "name": "AINZ \u0026 TULPE Ginza Store", "transport": "About a 3-minute walk from JR Yurakucho Station (Yamanote Line Central Exit) / Exit 4 of Tokyo Metro Ginza-itchome Station"}, {"address": "1F Main Building, Ginza Mitsukoshi, 4-6-16 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-Buy List: Signature Color Eyes (eyeshadow quad), The Cream Foundation (the holy grail for a buttery skin finish), Sheer Matte Lipstick. SUQQU is a red-hot Japanese luxury cosmetics brand famed for promoting the natural radiance of skin and sophisticated, adult-toned colors. The Ginza Mitsukoshi counter is fully stocked and frequently carries exclusive limited-edition collections. The brand\u0027s signature \u0027cream foundation\u0027 and \u0027eyeshadow quad\u0027 boast exquisite textures that create an elegant, high-end Japanese makeup look, attracting makeup lovers worldwide to shop and consult.", "name": "SUQQU Ginza Mitsukoshi", "transport": "Directly connected to Ginza Mitsukoshi from Exit A6 of Tokyo Metro Ginza Station"}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "3-14-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy list: Tone Oilnume Classic Leather Shoulder Bag, OTONA RANDSEL Adult Leather Backpack. A half-century-old leather brand originating from Saitama Prefecture, Japan, famous for its hand-stitched craftsmanship. The Ginza store features a cozy, hipster wooden interior showcasing a full lineup of premium cowhide bags. The warm leather aroma and the patina that develops over time attract countless local business professionals and minimalism lovers.", "name": "Tsuchiya Kaban Ginza", "transport": "Approx. 3-minute walk from Exit 3 of Higashi-ginza Station on the Tokyo Metro Hibiya Line"}, {"address": "Inside JR Tokyo Station Keiyo Street, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: TANKER Classic Flight Nylon Tote Bag, PORTER STAND Exclusive Patchwork Short Wallet. A concept store by Japan\u0027s iconic bag brand Yoshida \u0026 Co., built around the concept of \u0027inside the train station\u0027. Located inside Tokyo Station, it opens very early and offers highly exclusive items. Besides classic cool black nylon bags, it frequently releases Tokyo Station-exclusive colors and collaboration pouches, making it a top quality choice for commuters and travelers.", "name": "PORTER STAND TOKYO", "transport": "Approx. 1-minute walk inside the Yaesu South Gate ticket barrier of JR Tokyo Station"}, {"address": "6-9-7 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: Ultra-lightweight high-capacity suitcases, versatile Japanese-style leather handbags. Located in prime-real-estate Ginza, Ginza Karen is famous among locals and tourists for its incredible cost performance and diverse styles. The multi-story store is packed with suitcases of all sizes and colors alongside locally designed bags. Affordable yet durable, it\u2019s a go-to spot for tourists buying extra luggage for their souvenirs, making it a popular budget-friendly footwear and bag landmark in Ginza.", "name": "Ginza Karen", "transport": "Approx. 2-minute walk from Exit A2 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "7-8-8 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: MEXICO 66 Classic Leather Sneakers, NIPPON MADE Hand-Dyed Artisan Sneakers. Onitsuka Tiger is Japan\u0027s most iconic home-grown casual sneaker brand, and its Ginza flagship boasts a sleek, spacious two-story layout. The store features a dedicated \u0027NIPPON MADE\u0027 zone displaying premium shoes hand-dyed and hand-stitched by Japanese artisans. Featuring delicate leather and superior comfort, it is immensely popular among Japanese trendsetters and international travelers.", "name": "Onitsuka Tiger Ginza Flagship Store", "transport": "Approx. 5-minute walk from Exit A2 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "1-2F Ginza Asahi Building, 4-3-2 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: BEAMS JAPAN Exclusive Collaboration Graphic Tees, Japanese-style Tailored Wide Casual Pants. As a pioneer giant among Japanese select shops, BEAMS Ginza curates men\u0027s and women\u0027s apparel blending American vintage with modern Japanese street style. Besides showcasing the brand\u0027s own refined clothing designs, it carries shoes, bags, and accessories from emerging local Japanese designers\u2014a must-visit for anyone looking to craft an authentic Japanese City Boy look or elegant daily outfit.", "name": "BEAMS Ginza", "transport": "Approx. 1-minute walk from Exit B4 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "Ginza Mitsukoshi M2F, 4-6-16 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Premium 100% Wool Ankle Socks, Customized Text Embroidered Cotton Socks. Tabio is the premium hosiery brand under Kutsushitaya, emphasizing 100% Made in Japan craftsmanship and ultimate wearing comfort. The counter at Ginza Mitsukoshi offers an extensive selection for men and women, ranging from business dress socks and vintage pattern socks to functional athletic socks. They even offer on-site embroidery services, allowing customers to create unique, high-quality custom hosiery.", "name": "Tabio Ginza Mitsukoshi", "transport": "Directly connected to Ginza Mitsukoshi Underground Shopping Mall from Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "GINZA SIX 4F, 6-10-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy list: BAO BAO ISSEY MIYAKE Iconic Geometric Grid Tote Bag, PLEATS PLEASE Classic Wrinkle-Resistant Pleated Top. Issey Miyake is an internationally acclaimed Japanese master fashion design brand, with an avant-garde flagship store in GINZA SIX. The boutique showcases the globally beloved BAO BAO 3D geometric bags as well as the lightweight, easy-to-pack pleated clothing collections. Demonstrating the unique sense of space and geometric aesthetics of Japanese design, it stands as one of Tokyo\u0027s premier luxury fashion landmarks.", "name": "ISSEY MIYAKE GINZA SIX", "transport": "Approx. 2-minute walk from Exit A3 of Ginza Station on the Tokyo Metro Ginza Line"}, {"address": "4-5-11 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-buy list: Wako Exclusive Handmade Leather Handbags, Japanese Artisan Hand-Stitched Premium Men\u0027s Business Dress Shoes. Located inside the iconic clock tower building at Ginza\u0027s central 4-chome intersection, Wako is the ultimate symbol of Ginza\u0027s luxury and heritage. The shop curates limited-edition leather goods and handcrafted shoes made exclusively for Wako by top Japanese artisans. Featuring elegant designs and exquisite materials, it attracts high-earning locals and connoisseurs seeking understated luxury and ultimate Japanese craftsmanship.", "name": "Wako Ginza Main Building - Leather Goods \u0026 Luxury Items", "transport": "Directly accessible from Exit A1 of Ginza Station on the Tokyo Metro Ginza Line"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Gransta Tokyo 1F, inside JR Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buys: Signature Cheese Crisp Roll, Maple Cheese Cake. Created by three world-renowned cheese masters, this hugely popular shop at Tokyo Station constantly draws long queues. The crisp langue de chat biscuits wrap around rich Gouda cheese, cream, and white chocolate. The blend of sweet and savory is unforgettable, making it a high-end souvenir with modern sophistication.", "name": "NewYork Perfect Cheese (Tokyo Station Branch)", "transport": "1-minute walk inside Yaesu South Gate ticket gates, JR Tokyo Station"}, {"address": "1F Tokyo Ginza Shiseido Building, 8-8-3 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buys: Hanatsubaki Classic Biscuits, Rich Original Cheesecake, Ganache Chocolates. A famous Ginza institution with over a century of history. The signature Hanatsubaki biscuits are baked with premium butter and flour for an exquisite aroma, packaged in elegant, retro tin boxes that showcase Ginza\u0027s distinct luxury, history, and taste.", "name": "Shiseido Parlour (Ginza Main Store)", "transport": "3-minute walk from Exit 1 of Shimbashi Station (Tokyo Metro Ginza Line), or 5-minute walk from Exit A2 of Ginza Station"}, {"address": "JR Tokyo Station South Court inside ticket gates, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buys: Original Press Butter Sand, Uji Matcha Butter Sand, Amaou Strawberry Limited Edition. Utilizing a unique press-baking technique, these cookies feature an extra crunchy shell filled with rich Hokkaido cream and sweet raw caramel. A single bite unleashes a burst of dual fillings. Its sleek, industrial-chic packaging makes it a favorite among stylish travelers.", "name": "PRESS BUTTER SAND (Tokyo Station Branch)", "transport": "1-minute walk inside Marunouchi South Gate ticket gates, JR Tokyo Station"}, {"address": "7-3-6 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buys: Signature Leaf Pie, Victoria (Strawberry Jam Cookie), Butter French Sabl\u00e9. Founded in 1947, this retro Showa-style confectionery shop crafts its signature Leaf Pies by hand, laminating 256 delicate layers of puff pastry made with Hokkaido butter and sprinkled with fine sugar. Extremely flaky and rich in butter flavor, it exemplifies refined traditional craftsmanship.", "name": "Ginza West (Main Store)", "transport": "5-minute walk from Exit C2 of Ginza Station (Tokyo Metro), or 8-minute walk from JR Yurakucho Station"}, {"address": "B1F Gransta Tokyo, inside JR Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buys: Glacia Strawberry Cream Bouquet Biscuits, Hello Berry Strawberry Chocolate Tart. A dream dessert brand specializing in strawberry creations. Thin, crispy rolled tuiles enclose rich cream and whole freeze-dried strawberries, resembling delicate mini bouquets. Visually stunning with a perfect balance of sweet and tart flavors, these frequently sell out early at Tokyo Station.", "name": "AUDREY (Tokyo Station Branch)", "transport": "2-minute walk inside Yaesu Underground Central Gate ticket gates, JR Tokyo Station"}, {"address": "4-13-8 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-buys: Sanmidou Seasonal Painted Rice Crackers, Brown Sugar Soy Sauce Senbei, Nori Rice Crackers. An old Edo-era shop with over 200 years of history. Their signature \u0027Sanmidou\u0027 tile-shaped senbei are hand-painted with edible pigments depicting elegant seasonal motifs of Japan. Crunchy with a subtle egg aroma, they make an exquisite souvenir steeped in traditional culture.", "name": "Ginza Matsuzaki Senbei (Main Store)", "transport": "1-minute walk from Exit 5 of Higashi-ginza Station (Tokyo Metro Hibiya Line)"}, {"address": "5-6-15 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buys: Mount Baum Krauchen (Crispy Ridge Baumkuchen), Amber Glazed Baumkuchen, Seasonal Matcha Baumkuchen. One of Japan\u0027s premier baumkuchen specialty shops. Famous for its original mountain-shaped baumkuchen featuring a crispy exterior and soft, wave-like interior. Coated in a thin sugar glaze, it offers a moist crumb and rich butter fragrance beloved by all ages.", "name": "Nenrinya (Ginza Main Store)", "transport": "1-minute walk from Exit B3 of Ginza Station (Tokyo Metro)"}, {"address": "Next to Tokyo Character Street, First Avenue Tokyo Station, 1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.1 stars | Must-buys: Classic Banana Custard Sponge Cake, Doraemon Limited Edition Banana Cake, Tokyo Banana Raisin Sandwich Cookie. Tokyo\u0027s most iconic souvenir. The sponge cake is soft and fluffy, stuffed with rich banana custard cream. With cute character collaborations and exclusive Tokyo Station packaging, it is an essential snack to pick up when visiting Tokyo.", "name": "TOKYO BANANA (Tokyo Station Store)", "transport": "Right outside the Yaesu Underground Central Gate of JR Tokyo Station"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "6-10-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: ISHIYA GINZA Saqu Langue de Chat cookies, Tsujiri Ginza rich matcha soft-serve ice cream, Nakagawa Masashichi Shoten exclusive general goods. The largest premier complex department store in the Ginza area, featuring an open-air rooftop garden. It houses countless domestic luxury designer brands and traditional craft stores, exuding a strong contemporary artistic atmosphere and local cultural character.", "name": "GINZA SIX", "transport": "Approx. 2-minute walk from Exit A3 of Ginza Station on the Tokyo Metro Hibiya and Ginza Lines"}, {"address": "4-5-11 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: WAKO Clock Tower limited edition gold leaf watch, WAKO exquisite handmade limited chocolates, WAKO special high-quality leather goods. As the central iconic landmark of Ginza, WAKO Department Store is famous for its clock tower architecture and holds immense local historical significance. Specializing in luxury watches, jewelry, and exclusive lifestyle goods crafted by top Japanese artisans, it is a must-visit destination to experience the elegant atmosphere of classic Ginza.", "name": "WAKO Ginza", "transport": "Directly accessible from Exit A10 or B1 of Ginza Station on the Tokyo Metro Ginza and Marunouchi Lines"}, {"address": "2-7-2 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Tokyo Central Post Office exclusive commemorative stamps and postcards, Nakagawa Masashichi Shoten Mount Fuji patterned dishcloths, Hacoa artisan handcrafted wooden phone cases. A shopping center renovated from the former Tokyo Central Post Office building, preserving its deeply historical exterior. The center focuses on bringing together cultural/creative products, specialty crafts, and local lifestyle goods from across Japan, while its rooftop garden offers a breathtaking panoramic view of the historic Tokyo Station building.", "name": "KITTE Marunouchi", "transport": "Approx. 1-minute walk from Marunouchi South Exit of JR Tokyo Station"}, {"address": "3-6-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Yoku Moku Matsuya Ginza exclusive packaged Cigare roll cookies, Nihombashi Sembikiya luxury fruit jelly gift sets, Ginza Kanra Mame Daifuku. A long-established local department store in Ginza featuring modern aesthetic night lighting on its exterior facade. The food halls on B1 and B2 bring together numerous top-tier Japanese traditional (wagashi) and Western-style (yo-gashi) confectionary brands, making it a local shopping paradise for authentic Japanese souvenirs.", "name": "Matsuya Ginza", "transport": "Directly connected to Exit A12 of Ginza Station on the Tokyo Metro Ginza and Marunouchi Lines"}, {"address": "5-2-1 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Edo Kiriko handcrafted cut glassware, HitoToToki minimalist Japanese original lifestyle goods, Dassai Migaki Sono Saki sake. Inspired by the traditional Japanese craft of Edo Kiriko cut glass, this architectural landmark seamlessly blends traditional culture with modern trends. It features designated exhibition and retail zones promoting Japanese craftsmanship, making it the premier choice for purchasing authentic artisan-crafted artworks.", "name": "Tokyu Plaza Ginza", "transport": "Approx. 1-minute walk from Exits C2/C3 of Ginza Station on the Tokyo Metro Marunouchi and Hibiya Lines"}, {"address": "1-9-1 Marunouchi, Chiyoda-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: N.Y. City Sand rich caramel sandwich cookies, AUDREY classic strawberry bouquet cookies, Azabu Juban Agemochi exclusive rice crackers. A flagship department store directly connected to Tokyo Station. Its 1st floor and basement house the most impressive souvenir zone in all of Tokyo, bringing together popular local specialties and famous trending shops\u2014making it the ultimate last-minute shopping destination before leaving Tokyo.", "name": "Daimaru Tokyo", "transport": "Direct access from JR Tokyo Station Yaesu North Gate ticket barrier"}, {"address": "4-6-16 Ginza, Chuo-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Shiseido Parlour classic Hanatsubaki (Camellia) biscuits, Sentaro seasonal wagashi, Dojima Roll cream cake roll. The lion statue at the main entrance is Ginza\u0027s most iconic meeting spot. Boasting over a century of history, this department store delivers authentic, high-standard Japanese hospitality. Its basement food hall and upper-floor cosmetics counters feature numerous high-end Japanese brands, offering an experience rich in tradition and contemporary style.", "name": "Ginza Mitsukoshi", "transport": "Directly connected to Ginza Station on the Tokyo Metro Ginza and Hibiya Lines"}, {"address": "3-1-1 Kaneda-higashi, Kisarazu-shi, Chiba", "feature": "\u2b50 4.4 stars | Must-Buy List: BEAMS Outlet exclusive discounted Japanese fashion, Le Creuset discounted cast iron cookware, Seiko outlet deal Made-in-Japan watches. The largest and most recommended outlet shopping center in the Tokyo suburbs, easily accessible via direct highway express bus from Tokyo Station or Ginza. Home to over 300 brands\u2014including numerous local Japanese fashion labels, Japanese lifestyle goods, and international luxury brands\u2014offering highly attractive tax-free discounts.", "name": "Mitsui Outlet Park Kisarazu", "transport": "Approx. 45-minute direct highway express bus ride from Tokyo Station Yaesu Exit or Ginza Station Sukiyabashi bus stop"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Ginza and Tokyo Station"}, "kichijoji_mitaka": {"categories": {"cat_1": {"items": [{"address": "1-1-8 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 Stars | Must-Buy List: EVE Pain Reliever, Alinamin EX PLUS, Chocola BB Royal T. Located in Kichijoji Sunroad Shopping Street, this is widely recognized as one of Tokyo\u0027s cheapest cash-only drugstores. Although there is no tax-free service and credit cards are not accepted, the tax-inclusive prices of many popular medicines and health supplements are even cheaper than the tax-free prices at other drugstores! With a down-to-earth atmosphere, it is loved by locals and savvy tourists alike.", "name": "OS Drug Kichijoji", "transport": "About a 2-minute walk from the North Exit of JR Kichijoji Station (inside Sunroad Shopping Street)"}, {"address": "1F Main Building, Atre Kichijoji, 1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: F organics Deep Moisture Lotion, to/one Duo Eyeshadow, Celvoke Matte Lipstick. A select shop specializing in natural, organic, and plant-based cosmetics and skincare, highly favored by local Kichijoji women seeking a healthy lifestyle. The store brings together carefully selected top-tier organic makeup, essential oil skincare, and hair products from Japan and around the world. Staff offer professional skin consultations, making it the top choice for finding high-quality natural skincare products.", "name": "Cosme Kitchen Kichijoji Atre", "transport": "Directly connected to JR Kichijoji Station, 1F Main Building of Atre Kichijoji"}, {"address": "2F Main Building, Atre Kichijoji, 1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.5 Stars | Must-Buy List: Botanical Essential Oil Hand Soap, Herbal Hand Cream, Wooden Scalp Massage Brush. Founded in Tokyo, this Japanese lifestyle beauty brand focuses on essential oil skincare and cleansing products made with natural plant ingredients. The Kichijoji store features an elegant environment with minimalist Japanese packaging, offering affordable prices and exceptional quality. Its handmade soaps and herbal hand creams make excellent gifts or self-care treats.", "name": "MARKS\u0026WEB Kichijoji Atre", "transport": "Directly connected to JR Kichijoji Station, 2F Main Building of Atre Kichijoji"}, {"address": "1F Main Building, Atre Kichijoji, 1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 Stars | Must-Buy List: White Tea Body Mist, Sake Kasu Moisturizing Serum, Ginger Lip Balm. A minimalist natural skincare and cosmetics brand from Hokkaido, Japan, immensely popular among young local women in Kichijoji. The brand insists on using fruits, vegetables, and natural ingredients (such as sake lees, kelp, ginger, etc.) to create skincare. The store boasts a beautifully sleek, all-white design and natural, comforting fragrances, perfectly showcasing refined Japanese living.", "name": "SHIRO Kichijoji Atre", "transport": "Directly connected to JR Kichijoji Station, 1F Main Building of Atre Kichijoji"}, {"address": "1-8-3 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: LDK Rank #1 Eyeliner, LIPS Trending Highlighter, Popular Japanese Sheet Mask Gift Sets. This large flagship beauty store features an exceptionally spacious and brightly lit shopping area, clearly organized like a beauty museum. The store specifically targets the latest trending niche Japanese makeup brands and top-rated award-winning skincare products, complete with abundant samples\u2014making it the ultimate one-stop shop for Japan\u0027s newest beauty trends.", "name": "AINZ \u0026 TULPE Kichijoji Honcho", "transport": "About a 3-minute walk from the North Exit of JR Kichijoji Station"}, {"address": "1-11-30 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 Stars | Must-Buy List: Shiseido Sunscreen, DHC Vitamin Refills, Rest Time Foot Patches. Located on Sunroad, this Sundrug forms Kichijoji\u0027s famous \u0027drugstore battleground\u0027 alongside nearby OS Drug, offering highly competitive discounts and tax-free deals year-round. The store boasts an extensive selection ranging from medicines and department store cosmetic samples to daily necessities, along with foreign language support and tax-free checkout counters.", "name": "Sundrug Kichijoji Sunroad", "transport": "About a 3-minute walk from the North Exit of JR Kichijoji Station (inside Sunroad Shopping Street)"}, {"address": "2F Main Building, Atre Kichijoji, 1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 Stars | Must-Buy List: Oh! Baby Body Smoother, Echigo Silk Hand Cream, Natural Rose Hydrating Mist. A signature Japanese domestic botanical skincare brand focusing on low-irritation, pure natural body and skin care. Most famous for its multi-year COSME Award winner Oh! Baby Body Smoother, formulated with gentle natural hot spring water. With friendly counter service, it is a must-visit store for skincare enthusiasts.", "name": "HOUSE OF ROSE Kichijoji Atre", "transport": "Directly connected to JR Kichijoji Station, 2F Main Building of Atre Kichijoji"}, {"address": "1-15-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.1 Stars | Must-Buy List: Kose Eyeshadow Palette, Canmake Limited-Edition Lipsticks, Kao Steam Eye Masks. This Cocokara Fine branch on Kichijoji Sunroad highlights a rich \u0027beauty testing area\u0027 and professional pharmacist services. It showcases a comprehensive range of Japanese drugstore makeup brands and cosmeceutical skincare, frequently offering exclusive collaboration promo sets and high-value discount coupons, making it a popular shopping hub in Kichijoji.", "name": "Cocokara Fine Kichijoji Sunroad", "transport": "About a 4-minute walk from the North Exit of JR Kichijoji Station (inside Sunroad Shopping Street)"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2-20-7 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Japan Blue Denim jeans, handmade cotton-linen shirts, quality curated leather shoes. Located on Nakamichi-dori in Kichijoji, this elegant select shop specializes in high-quality local Japanese apparel, workwear shoes, and bags. Carefully curating emerging domestic designer brands and premium cotton-linen garments, it offers a warm ambiance and insightful styling advice. It is the top choice for local hipsters and style enthusiasts seeking unique, non-mainstream pieces.", "name": "STEPS Kichijoji", "transport": "About a 5-minute walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "2-16-7 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Kichijoji-exclusive canvas tote bag, minimalist linen shirts, British-style leather tote bag. Located next to Nakamichi Park, this standalone flagship store features an attached caf\u00e9 and a beautifully naturally lit, minimalist space. It offers the brand\u0027s iconic minimalist apparel along with high-quality leather shoes and bags. The heavy-duty limited-edition canvas totes, in particular, excel in both texture and functionality, making this shop a symbol of elegant local living.", "name": "MARGARET HOWELL Kichijoji", "transport": "About a 6-minute walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-16-11 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Vintage American woven mesh bag, remade vintage embroidered jacket, curated pre-owned sneakers. As one of Kichijoji\u0027s most iconic vintage and lifestyle select shops, its interior radiates a sunny, West Coast American vibe. In addition to handpicked US vintage items in top condition, it offers exclusive remade clothing and handcrafted accessories, shoes, and bags, making it a favorite among local youth and fashion insiders.", "name": "Santa Monica Kichijoji", "transport": "About a 3-minute walk from the South Exit (Park Exit) of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "2-14-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Rare vintage Red Wing boots, vintage Barbour waxed jackets, US-made retro rubber-soled sneakers. Renowned across Tokyo for vintage and luxury second-hand trading, the Kichijoji branch specializes in premium US military surplus vintage, high-end handcrafted leather shoes, and classic retro jackets. All items are in excellent condition and guaranteed authentic, drawing vintage collectors from around the world to dig for hidden gems.", "name": "Safari Kichijoji", "transport": "About a 5-minute walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-8-14 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Pre-owned Comme des Gar\u00e7ons designer jackets, Porter collaboration crossbody bags, pre-owned Maison Margiela leather ankle boots. As Japan\u0027s premier second-hand luxury designer store, the bright and spacious Kichijoji location enforces strict quality selection standards. Here, you can find near-mint condition Japanese and international high-end designer items at fantastic prices\u2014the perfect spot for acquiring top-tier apparel, shoes, and bags on a budget.", "name": "RAGTAG Kichijoji", "transport": "About a 3-minute walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-16-3 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Customized monogrammed Boat and Tote bags, classic Bean Boots, windproof outdoor hooded jackets. A landmark standalone flagship near Inokashira Park. It boasts Japan\u0027s most comprehensive selection of classic canvas totes alongside an on-site embroidery customization service. Showcasing a wide variety of outdoor apparel and casual footwear suitable for day trips, it serves as an icon for local outdoor lifestyle aesthetics.", "name": "L.L.Bean Kichijoji Store", "transport": "About a 3-minute walk from the South Exit (Park Exit) of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-15-14 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Independent designer vintage tailored tops, 90s vintage leather crossbody bags, unique limited-edition sneakers. Housed in a repurposed former public bathhouse, this cool buy/sell vintage store is famous for its exceptional value, with most items priced around 2,000 to 3,000 yen. Featuring a vast selection of clothing, footwear, and bags\u2014ranging from indie street style to edgy statement pieces\u2014it is a favorite fashion hub for Kichijoji youth.", "name": "New York Joe Exchange Kichijoji", "transport": "About a 4-minute walk from the South Exit (Park Exit) of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "2-18-2 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Paraboot handcrafted French leather shoes, Individually Tailored Japanese-made shirts, Slow Tochigi leather handmade briefcases. Situated on Nakamichi-dori in Kichijoji, this refined men\u0027s select shop focuses on high-quality clothing, shoes, and bags designed to stand the test of time. Offering leather bags crafted by local Japanese artisans alongside classic American and French casual wear, its exquisite tailoring and sturdy craftsmanship earn top praise from discerning gentlemen.", "name": "SEEK\u0026FIND Kichijoji", "transport": "About a 5-minute walk from t
