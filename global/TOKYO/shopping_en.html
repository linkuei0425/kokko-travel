he North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "1-1-8 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: Original Kuroge Wagyu Menchi-katsu (minced beef cutlet), Matsusaka Beef Jerky, Special Kuroge Wagyu Curry Pouch. A super popular famous shop in Kichijoji shopping street using premium Kuroge Wagyu beef. Freshly fried beef cutlets feature a crispy crust and juicy interior. Besides enjoying fresh food on-site, their specially made beef jerky and rich curry pouches are hot local souvenir take-outs for tourists.", "name": "Kichijoji Satou (\u5409\u7965\u5bfa \u3055\u3068\u3046)", "transport": "About 1 min walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-1-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Kichijoji-age, Bacon Cheese Fish Cake, Traditional Handmade Satsuma-age Gift Box. A local institution with over 70 years of history specializing in fish paste products, strictly using no preservatives. The freshly fried fish cakes are crispy on the outside and tender inside. Beyond traditional flavors, their uniquely developed \u0027Kichijoji-age\u0027 comes packed with rich fillings like onion and cheese, perfect for a late-night hotel snack or sharing as a local delicacy.", "name": "Tsukada Suisan (\u585a\u7530\u6c34\u7523)", "transport": "About 2 mins walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line, inside Daiya-gai Shopping Street)"}, {"address": "2-17-5 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Kichijoji exclusive illustrated tea bag gift box, Cream Bee Tea, seasonal fruit-flavored teas. A hugely popular black tea brand founded by renowned illustrator Utako Yamada. The whimsical and high-quality illustrated packaging pairs with carefully selected premium teas from Sri Lanka. The Kichijoji main store features exclusive packaging and limited-edition flavors, making it a top choice for exquisite gift shopping.", "name": "Karel \u010capek Tea Library Kichijoji Main Store (\u30ab\u30ec\u30eb\u30c1\u30e3\u30da\u30c3\u30af\u7d05\u8336\u5e97 \u5409\u7965\u5bfa\u672c\u5e97)", "transport": "About 6 mins walk from the North Exit of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "2-7-5 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: Totoro Cream Puffs (Strawberry \u0026 Custard Cream), Handmade Totoro Cookie Gift Box, Ghibli-licensed baked sweets. An officially Ghibli-licensed dessert shop specializing in Totoro-shaped creations. The Totoro cream puffs are immensely cute with rich, flavorful fillings. Their beautifully packaged handmade Totoro cookies have a long shelf life, making them a dream souvenir when visiting Kichijoji and Mitaka.", "name": "Shirohige\u0027s Cream Puff Factory Kichijoji (\u767d\u9aed\u306e\u30b7\u30e5\u30fc\u30af\u30ea\u30fc\u30e0\u5de5\u623f \u5409\u7965\u5bfa\u5e97)", "transport": "About 4 mins walk from the South Exit (Park Exit) of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-1-83 Shimorenjaku, Mitaka-shi, Tokyo (Inside Ghibli Museum)", "feature": "\u2b50 4.6 stars | Must-buy list: Ghibli limited-edition candy tins, Totoro-pattern handmade senbei (rice cracker) gift set, Museum exclusive crest chocolates. The official souvenir shop inside the Ghibli Museum, named after the sky pirates in \u0027Porco Rosso\u0027. In addition to exquisite character merchandise, the shop offers exclusive snacks and specialty food gift sets available nowhere else, featuring highly collectible packaging.", "name": "Ghibli Museum Shop Mamma Aiuto! (\u4e09\u9df9\u306e\u68ee\u30b8\u30d6\u30ea\u7f8e\u8853\u9928 \u30de\u30f3\u30de\u30e6\u30fc\u30c8)", "transport": "About 5 mins by Ghibli Museum Shuttle Bus from the South Exit of Mitaka Station (JR Chuo Line)"}, {"address": "3-8-8 Kichijoji Higashicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Galette Bretonne, Assorted Handmade Baked Sweets Gift Box, Rich Pound Cake. Acclaimed as Tokyo\u0027s top premier patisserie, headed by World Pastry Champion Chef Hideki Kawamura. Beyond exquisite chilled French cakes, their handcrafted baked goods (g\u00e2teaux secs) and cookie gift boxes boast a rich buttery aroma, highly praised by locals and foodies alike.", "name": "a tes souhaits! (\u30a2\u30c6\u30b9\u30a6\u30a7\u30a4)", "transport": "About 15 mins walk from the East Exit of Kichijoji Station (JR Chuo Line), or take the Kanto Bus and get off at \u0027Joshi Dai-mae\u0027 stop"}, {"address": "2-20-1 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy list: House-roasted single-origin coffee beans, Light roast drip bag coffee gift box, Handmade oat cookies. A highly representative local specialty sustainable coffee brand in Tokyo, focusing on single-origin sustainable beans. The gift boxes feature a minimalist and elegant design, while the drip bags offer rich, complex flavors and convenient portability\u2014making it the perfect local Kichijoji souvenir for coffee lovers.", "name": "Woodberry Coffee Kichijoji (\u30a6\u30c3\u30c9\u30d9\u30ea\u30fc\u30b3\u30fc\u30d2\u30fc \u5409\u7965\u5bfa\u5e97)", "transport": "About 5 mins walk from the South Exit (Park Exit) of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}, {"address": "1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: Musashino specialty rice cracker gift sets, Tokyo Banana limited editions, local historic wagashi (Japanese confection) sets. A large shopping center directly connected to JR Kichijoji Station. Its 1st-floor souvenir section gathers numerous traditional Japanese shops and trendy Tokyo dessert counters. Highly convenient, it\u0027s the ultimate one-stop spot to grab all your tourist gifts and local snacks before leaving Kichijoji.", "name": "atre Kichijoji Souvenir Street (\u30a2\u30c8\u30ec\u5409\u7965\u5bfa)", "transport": "Directly connected to the ticket gate of Kichijoji Station (JR Chuo Line / Keio Inokashira Line)"}], "name": "Must-Buy Special Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-11-5 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: Kichijoji Kikuya Japanese ceramic tableware, Rilakkuma Store limited-edition plushies, and Green Park eco-friendly lifestyle items. This iconic local green-lifestyle department store in Kichijoji consists of Buildings A and B. Beyond clothing and home goods from independent local Japanese designers, the 3rd floor features the standout A-REX outdoor gear zone and Character Park, perfectly embodying the refined local lifestyle aesthetic.", "name": "Coppice Kichijoji", "transport": "About a 2-minute walk from the North Exit of Kichijoji Station (JR Chuo Line/Sobu Line, Keio Inokashira Line)"}, {"address": "1-1-24 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.4 Stars | Must-Buy List: Tsukada Suisan handmade oden side dishes, Sawanoi local sake from Ozawa Brewery, and Kichijoji-exclusive Canary Baumkuchen. An elegant department store integrated directly with the JR station. Its B1 food hall brings together countless famous local Musashino eateries and historic Tokyo shops. Along with delicious prepared foods and wagashi (traditional sweets), it houses stylish florists and refined Japanese lifestyle boutiques, making it the top choice for experiencing daily life in Kichijoji.", "name": "Atre Kichijoji", "transport": "Directly connected to JR Kichijoji Station"}, {"address": "1-5-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 Stars | Must-Buy List: Onitsuka Tiger retro sneakers, Design Tshirts Store graniph graphic tees, and exclusive cinema merchandise on B1. A trendy landmark blending high fashion with subculture, featuring emerging Japanese designer brands and handcrafted goods. The B1 floor houses an independent art-house cinema, \u0027UPLINK Kichijoji\u0027, showcasing Kichijoji\u0027s unique artistic vibe and youth culture.", "name": "Kichijoji PARCO", "transport": "About a 2-minute walk from the North Exit of JR Kichijoji Station"}, {"address": "2-1-25 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.1 Stars | Must-Buy List: Lopia selected Japanese Wagyu beef jerky, local independent brand scented hand creams, and lightweight manual sun umbrellas. A 10-story women\u0027s lifestyle and fashion department store developed by Keio Electric Railway. It features local apparel, handmade accessories, and skincare counters tailored for modern women. Upper floors offer panoramic views overlooking Kichijoji Station and Keio Inokashira Line trains coming and going.", "name": "Kirarina Keio Kichijoji", "transport": "Directly connected to the ticket gate of Keio Inokashira Line Kichijoji Station"}, {"address": "2-3-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.1 Stars | Must-Buy List: Kichijoji Kikuya limited-edition lacquerware tea sets, premium Imabari towels from Japan, and American-style pour-over coffee at Taiyo Hiroba (Sun Plaza). The only remaining high-end, classic-style department store in Kichijoji. Its B1 food hall is famous for premium fresh produce and traditional wagashi, while the open-air \u0027Taiyo Hiroba\u0027 (Sun Plaza) on the 9th floor serves as a beloved urban oasis for families and seniors, frequently hosting local farmers\u0027 markets and creative craft fairs.", "name": "Tokyu Department Store Kichijoji", "transport": "About a 5-minute walk from the North Exit of JR Kichijoji Station"}, {"address": "1-7-1 Kichijoji Minamicho, Musashino-shi, Tokyo", "feature": "\u2b50 4.0 Stars | Must-Buy List: MUJI Kichijoji-exclusive handmade dyed textiles, Bio c\u0027 Bon organic nuts and dried fruits, and minimalist sustainable-material tote bags. Located right near the entrance of Inokashira Park, this mall focuses on eco-friendly and natural lifestyles. It houses a massive MUJI flagship store along with \u0027Caf\u00e9\u0026Meal MUJI\u0027, making it the perfect spot to grab picnic supplies and casual apparel before strolling through the park.", "name": "Kichijoji Marui", "transport": "About a 1-minute walk from the Park Exit (South Exit) of JR Kichijoji Station"}, {"address": "1-19-1 Kichijoji Honcho, Musashino-shi, Tokyo", "feature": "\u2b50 4.2 Stars | Must-Buy List: Panasonic nanoe hair dryers, Zojirushi vacuum insulated tumblers, and Tokyo limited-edition G-SHOCK watches. Spanning a massive area, this mega shopping building offers the latest Japanese home appliances, digital gadgets, and cameras from floors 1 to 5, alongside clothing, hobby models/toys, and a restaurant floor on higher levels. It is the most comprehensive electronics shopping center in Kichijoji.", "name": "Yodobashi Camera Multimedia Kichijoji", "transport": "About a 3-minute walk from the North Exit of JR Kichijoji Station"}, {"address": "1-600 Minami-osawa, Hachioji-shi, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: BEAMS OUTLET discounted hip clothing, Adidas Outlet deals on sneakers, and francfranc BAZAR home decor bargains. The premier outlet mall in Tokyo\u0027s western suburbs, easily accessible via the Keio Line from Kichijoji. Designed to resemble a charming village in Provence, France, it houses over 100 international and popular local Japanese brands offering year-round discounts of 30% to 70% off.", "name": "Mitsui Outlet Park Tama Minami-osawa", "transport": "Directly outside Minami-osawa Station on the Keio Sagamihara Line (approx. 40 mins from Kichijoji Station via Keio Inokashira Line to Meidaimae, transferring to the Keio Line Rapid train)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Kichijoji and Mitaka"}, "maihama_disney": {"categories": {"cat_1": {"items": [{"address": "1F The Yard, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: MK Customer Deep Moisturizing Hand Cream, Disney Edition Steam Eye Masks, Kyusoku Jikan Cooling Leg Sheets. As one of the largest drugstores in the Maihama commercial district, located on the 1st floor of Ikspiari, it offers an exceptionally comprehensive selection of Japanese cosmetics and medicines. After walking around theme parks all day, visitors love coming here to buy leg-relieving foot patches and trending cosmetics. Duty-free service for foreign tourists makes restocking super convenient.", "name": "Matsumoto Kiyoshi Ikspiari Branch", "transport": "Approx. 3-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2F Traders Passage, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Disney Collaboration Excel Eyeshadow Quad, Canmake Marshmallow Finish Powder, VT Cica Daily Soothing Mask. Located on the 2nd floor of Ikspiari, PLAZA gathers trendy beauty brands hugely popular among high school girls and young women in Japan. Its biggest highlight is the exclusive Disney collaboration cosmetics with limited packaging, making it a fantastic spot to pick up trendy beauty items.", "name": "PLAZA Cosmetics \u0026 Goods Ikspiari Branch", "transport": "Approx. 4-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2F Museum Lane, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: To/one Petal Duo Eyeshadow, F Organics Deep Moisture Lotion, Giovanni Smooth As Silk Organic Hair Oil. Specializing in natural, organic, and additive-free beauty products, this select shop is beloved by Japanese women who prioritize skincare and natural ingredients. The store curates top organic skincare and fragrances from Japan and around the world, with knowledgeable staff offering professional skin consultations.", "name": "Cosme Kitchen Organic Beauty Store Ikspiari Branch", "transport": "Approx. 4-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2F Museum Lane, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Oh! Baby Silk Body Smoother, Echitou Cream Deep Moisture Cream, Rose Extract Hydrating Hand Cream. A highly popular natural skincare brand in Japan, famous for body care and natural ingredients. Its star product, the Oh! Baby body scrub, is a multi-time winner at the @cosme Japanese Beauty Awards, leaving skin amazingly silky and smooth\u2014a must-buy skincare item when visiting Maihama.", "name": "HOUSE OF ROSE Fragrance \u0026 Skincare Ikspiari Branch", "transport": "Approx. 4-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2F Museum Lane, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Intergalactic Bath Bomb, Mask of Magnaminty Deep Cleansing Mask, Disney Limited Edition Shampoo Bar. Located in the experiential zone of Ikspiari, this delightfully scented LUSH store offers freshly handmade bath and skincare products. Before checking into Resort hotels, many tourists stop by specifically to pick up relaxing bath bombs to enjoy a luxurious bath time.", "name": "LUSH Handmade Cosmetics Ikspiari Branch", "transport": "Approx. 4-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "1F The Yard, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Deep Clear Charcoal Washing Powder, Mild Cleansing Oil, Deep Charge Collagen Drink. A iconic Japanese beauty brand advocating preservative-free formulations, this branch features a bright and minimalist design. It provides a full range of skincare, cleansing oils, and beauty supplements\u2014ideal for customers with sensitive skin seeking pure skincare solutions.", "name": "FANCL Preservative-Free Beauty Shop Ikspiari Branch", "transport": "Approx. 3-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "1-15 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Disney Character Lip Balm Set, Disney Hand Cream Gift Set, Mickey-Shaped Hydrating Face Masks. Positioned between Maihama Station and Tokyo Disneyland, this is Japan\u0027s largest official Disney shop outside the parks. In addition to toys and accessories, its exclusive Disney cosmetics and skincare line serves as iconic souvenirs, perfect both as gifts and for personal use.", "name": "Bon Voyage (Disney Store)", "transport": "Approx. 2-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Disney Limited Edition Steamcream, UV Moisturizing Sunscreen Steamcream, Natural Essential Oil Lip Balm. Famous for its high-penetration moisturizing cream crafted using steam, this Japanese brand\u0027s standout feature is a versatile cream usable for the whole body packaged in beautifully designed, collectible tin cans. The adorable Disney collaboration tins are especially hot beauty souvenirs in the Maihama area.", "name": "STEAMCREAM Ikspiari Branch", "transport": "Approx. 4-minute walk from South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Disney collaboration wallets, Disney character leather pouches, Princess series metal keychains. A famous Japanese luxury leather goods and bag brand designed specifically for women. Located in Maihama Ikspiari, this store frequently offers Maihama-exclusive or limited-edition Disney collaboration bags and small leather accessories. Featuring exquisite craftsmanship and elegance, it\u0027s a must-visit specialty boutique for high-quality leather accessories before or after visiting Tokyo Disney Resort.", "name": "Samantha Thavasa Petit Choice Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: High-elasticity pressure-relief ballet flats, Disney collaboration platform loafers, waterproof easy-walk ankle boots. A hugely popular Japanese women\u0027s footwear brand known for being affordable, trendy, and flattering. Catering to visitors planning long walks at Tokyo Disneyland, the Maihama branch stocks a wide selection of fatigue-resistant, ultra-soft insole walking flats and exclusive collaboration shoes, making it a favorite among both locals and tourists.", "name": "ORiental TRaffic Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Vintage lace dresses, Disney-themed embroidered canvas bags, classic Mary Jane shoes. A highly popular classic romantic clothing brand among Japanese girls, famous for its elegant lace, intricate embroidery, and vintage cuts. The Ikspiari branch boasts one of the most comprehensive Disney collaboration series in Japan. Many Japanese girls stop by here specifically to buy a complete dreamy vintage outfit and matching accessories before heading into the park for photos.", "name": "axes femme POETIQUE Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "3F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Maihama-exclusive printed graphic T-shirts, casual baseball caps, original character canvas tote bags. A famous local Japanese trendy casual wear brand known for its playful graffiti characters and comfortable, high-quality cotton fabrics. The Maihama store exclusively features locally themed graphic tees and resort-style tote bags. Full of fun vibes and unique enough to avoid outfit collisions, these items make wonderful regional souvenirs.", "name": "LAUNDRY Ikspiari Branch", "transport": "About a 4-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Disney character embroidered sneakers, Mickey-themed hoodies, embroidered crossbody bags. A physical store operated by the popular Japanese mail-order brand Belle Maison, specializing in Japan-exclusive Disney-themed apparel, footwear, and bags. Compared to merchandise sold inside the theme park, the apparel and accessories here feature a more wearable, modern Japanese everyday style, making it the top choice for savvy travelers looking for unique Disney daily wear.", "name": "Disney Fantasy Shop by Belle Maison", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Japanese relaxed-fit dresses, vintage leather crossbody bags, lightweight canvas sneakers. An iconic Japanese lifestyle and indie-style apparel brand combining minimalist clothing, quality bags/shoes, and living accessories. The Maihama store is spacious and bright, offering a rich variety of casual men\u0027s and women\u0027s apparel alongside high-functionality bags. Its natural, comfortable aesthetic is highly loved by local fans of Japanese fashion.", "name": "niko and... Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Clear display Ita bags (\u75db\u30d0\u30c3\u30b0), Korean-style platform canvas shoes, street fashion oversized tees. Originating from Harajuku, Tokyo, this popular youth fashion chain specializes in affordable streetwear and trendy accessories. The Maihama store is famous for selling \u0027Ita bags\u0027 designed to display Disney plush keychains, along with vibrant accessories\u2014making it the ultimate spot for young parkgoers to style their personal park outfits.", "name": "WEGO Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}, {"address": "2F Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Mori-girl pleated maxi skirts, versatile cardigans, lightweight canvas shoulder bags. As a flagship representative of Japanese natural \u0027Mori girl\u0027 style apparel, this flagship-level Super Store features an exceptionally complete product lineup. Offering affordable prices, cozy fabrics, and easy-to-match, lightweight bags and shoes, it is a hugely popular shopping destination in Maihama for young women and students.", "name": "earth music\u0026ecology super store Ikspiari Branch", "transport": "About a 3-minute walk from the South Exit of JR Maihama Station (Inside Ikspiari Shopping Mall)"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-1 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Disney character crunch chocolate gift box, assorted senbei rice cracker tin, seasonal snack tins. Located in a massive red-brick building between JR Maihama Station and Tokyo Disneyland, this is Japan\u0027s largest official Disney souvenir store. You don\u0027t even need to enter the park to shop for the most complete selection of park-exclusive snacks and specialties. The highly popular chocolate crunch comes in exquisite packaging with rich flavor, while the senbei rice cracker tins make perfect gifts for elders, representing an iconic local souvenir.", "name": "Bon Voyage Disney Souvenir Flagship Store", "transport": "Approx. 2-minute walk from the South Exit of JR Keiyo Line Maihama Station"}, {"address": "World Bazaar, Tokyo Disneyland, 1-1 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Mickey Mouse head chocolate crunch tin, Mickey waffle cookies, Disney character gummy box. Located inside World Bazaar in Disneyland, this is the largest snack and souvenir store in the park. Under its elegant Victorian-style decor, hundreds of park-exclusive delicate sweets are displayed. The classic Mickey-shaped chocolate crunch is highly recommended\u2014crispy with balanced sweetness that makes it addictive, making it a classic must-buy local souvenir when visiting the park.", "name": "World Bazaar Confectionery", "transport": "Inside the World Bazaar area of Tokyo Disneyland"}, {"address": "Mediterranean Harbor, Tokyo DisneySea, 1-13 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Tokyo DisneySea exclusive caramel sandwich cookies, Disney character picture-frame chocolates, seasonal festive dessert boxes. Located in Mediterranean Harbor at Tokyo DisneySea, this romantic confectionery shop features classic painting-style murals of Disney characters. It houses DisneySea\u0027s best-selling pastries and chocolates. The beautifully packaged caramel sandwich cookies are crispy outside and soft inside, rich yet not overly sweet, making them high-quality souvenirs for friends and family.", "name": "Valentina\u0027s Sweets", "transport": "Inside the Mediterranean Harbor area of Tokyo DisneySea"}, {"address": "American Waterfront, Tokyo DisneySea, 1-13 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Duffy \u0026 Friends butter caramel sandwich cookies, Duffy-shaped tea bag gift box, ShellieMay candy tin. Located in Cape Cod at American Waterfront in Tokyo DisneySea, this red wooden building is a must-visit sanctuary for Duffy fans. In addition to plush toys, the store sells various Duffy-themed snacks exclusive to Tokyo DisneySea. The limited-edition cookie gift boxes feature rich butter caramel filling with adorable and intricate designs, making them the most unique must-buy souvenir at DisneySea.", "name": "Aunt Peg\u0027s Village Store", "transport": "Cape Cod, American Waterfront area of Tokyo DisneySea"}, {"address": "Fantasyland, Tokyo Disneyland, 1-1 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Winnie the Pooh honey sandwich cookies, honey pot gummy tins, Winnie the Pooh honey baumkuchen. Located in Fantasyland at Tokyo Disneyland, the entire store is themed around the Hundred Acre Wood. Dedicated to Winnie the Pooh merchandise, its snack area is absolute heaven for honey lovers. The #1 best-selling honey sandwich cookies carry a rich, pure honey aroma, stamped with cute Winnie the Pooh motifs, making both the packaging and taste exceptionally memorable.", "name": "Pooh Corner (Snack Area)", "transport": "Inside the Fantasyland area of Tokyo Disneyland"}, {"address": "Theater Front 2F, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Ikspiari exclusive blend tea \u0027Maihama\u0027, Disney collaboration tin tea bags, seasonal flavored green teas. Located in the Ikspiari shopping mall in Maihama, this directly managed store of Japan\u0027s premium tea brand LUPICIA exclusively features the store-limited flavored tea \u0027Maihama\u0027, which bursts with sweet floral and fruity aromas reminiscent of a glamorous, romantic resort getaway. The exquisite custom tin is perfect for collecting or gifting, serving as a signature souvenir unique to Maihama.", "name": "LUPICIA Ikspiari", "transport": "Directly connected to JR Keiyo Line Maihama Station, 2F Ikspiari Shopping Mall"}, {"address": "The Resort 2F, Ikspiari, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Freshly baked mini Baumkuchen, classic Baumkuchen gift box, crispy Baumkuchen rusks. Situated in Ikspiari at Maihama, B-studio is a specialized counter by CLUB HARIE, a historic Shiga-based confectionery maker. Here, you can watch Baumkuchen being freshly baked layer by layer. Renowned for its ultra-moist, fluffy texture coated with a delicate sugar glaze, these daily freshly baked treats are a highly coveted delicacy among locals and tourists alike.", "name": "CLUB HARIE B-studio Ikspiari", "transport": "Directly connected to JR Keiyo Line Maihama Station, 2F Ikspiari Shopping Mall"}, {"address": "Mediterranean Harbor, Tokyo DisneySea, 1-13 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Little Green Men (Alien) mochi snack tin, Mickey-shaped custard Danish pastry, Disney exclusive caramel pie. Located near the entrance of Tokyo DisneySea, this bakery and confectionery shop is a wildly popular snack spot inside the park. The undisputed star is the viral Little Green Men mochi, filled with three delicious chewy flavors (chocolate, strawberry, and custard). It comes with an exclusive souvenir Alien container, making it a fun and practical must-buy snack souvenir.", "name": "Mamma Biscotti\u0027s Bakery", "transport": "Near the entrance of Mediterranean Harbor, Tokyo DisneySea"}], "name": "Must-Buy Signature Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Maihama Brewery craft beer \u0027Harvest Moon\u0027, Tokyo Disney Resort exclusive commemorative stationery, and Ikspiari collaboration goods. Designed directly by Tokyo Disney Resort, this large themed shopping mall features up to 140 shops and a movie theater. Built in a whimsical Southern European town style, visitors can shop freely without purchasing Disney park tickets. It brings together a vast array of unique Japanese fashion, cosmetics, and exclusive gourmet foods, making it an unmissable top shopping destination for any Disney trip.", "name": "IKSPIARI Shopping Mall", "transport": "Approx. 1-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "1-15 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Maihama-exclusive Mickey-shaped cookie gift boxes, Tokyo Disneyland seasonal headband ear hoops, and Mickey-shaped pass cases. Shaped like a giant luggage trunk located between Maihama Station and Tokyo Disneyland, this is the largest official Disney store in Japan. The interior is decorated with vintage luggage trunks and retro airship elements, offering a vast array of the latest seasonal park-exclusive items and souvenirs, allowing non-parkgoers to enjoy shopping for park goods as well.", "name": "Bon Voyage (Disney Specialty Store)", "transport": "Approx. 2-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "2-6-1 Nakase, Mihama-ku, Chiba City, Chiba Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Discounted seasonal BEAMS jackets, limited-edition adidas sneakers, and discounted COACH leather bags. Located just a 12-minute train ride from Maihama, this is the closest large outlet center to Tokyo Disney Resort. Featuring hundreds of international and popular Japanese brands like Samantha Thavasa and Agnes b., offering great discounts up to 70% off year-round. It is perfect for scheduling a shopping spree before or after your Disney itinerary.", "name": "MITSUI OUTLET PARK MAKUHARI", "transport": "Approx. 1-minute walk from the South Exit of JR Keiyo Line \u0027Kaihimmakuhari Station\u0027 (about 12 minutes direct via Keiyo Line Rapid train from Maihama Station)"}, {"address": "Ikspiari 2F, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Disney Store exclusive UniBEARsity plush toys, Japan-exclusive Disney character hand cream sets, and Disney Resort Store exclusive tumblers. This is the largest Disney Store in Japan in terms of floor area, divided into multiple themed sections with decor reminiscent of a fairytale theater. In addition to standard Disney Store merchandise, it frequently releases Maihama-exclusive character merchandise and unique art collectibles.", "name": "Disney Store Ikspiari", "transport": "Approx. 3-minute walk to enter from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "Ikspiari 1F, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Kayanoya premium vegetable dashi stock packets, Chiba-exclusive naturally brewed soy sauce, and ultimate grilled flying fish dashi packets. A directly managed store in Maihama by \u0027Kayanoya\u0027, a top traditional Japanese seasoning shop originating from Fukuoka. Offering additive-free, premium dashi stock packets and natural sauces, it is a must-visit for tourists who love Japanese food culture. It specially provides a rich array of Chiba-exclusive local flavors tailored for home cooks and food enthusiasts.", "name": "Kayanoya Ikspiari", "transport": "Approx. 4-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "Ikspiari 2F, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: PLAZA-exclusive Disney collaboration lip balms, popular local Japanese cosmetic sets, and unique imported novelty snacks. The flagship location in Maihama for PLAZA, a famous Japanese cosmetics and lifestyle goods chain store. It carefully selects the hottest local Japanese skincare and makeup products, Japanese stationery, and Disney collaboration lifestyle items. Product updates here are extremely fast, allowing you to pick up many exclusively released collaboration cosmetics.", "name": "PLAZA Ikspiari", "transport": "Approx. 3-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "Ikspiari 2F, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Japanese natural-style cotton-linen dresses, Mori-style woven picnic baskets, and Disney-exclusive ceramic mugs. Studio CLIP, a well-known local Japanese lifestyle apparel brand, focuses on a natural and warm Japanese \u0027Mori Girl\u0027 style. This location specially offers Disney visitors a range of practical yet adorable lifestyle products, quality clothing, and home decor items, making it hugely popular among women who enjoy a refined Japanese lifestyle.", "name": "studio CLIP Ikspiari", "transport": "Approx. 3-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}, {"address": "Ikspiari 1F, 1-4 Maihama, Urayasu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Salt \u0026 Camembert cookies, Honey \u0026 Gorgonzola cheesecake, and Ikspiari-exclusive gift sets. A hugely popular local Japanese cheese dessert specialty store made with fresh Hokkaido milk and premium cheese. In addition to offering the iconic rich cheese cookies, this Maihama location frequently releases Maihama-exclusive packaging and seasonal flavors, making it the perfect stop for buying high-quality souvenirs before leaving Maihama.", "name": "Tokyo Milk Cheese Factory Ikspiari", "transport": "Approx. 4-minute walk from the South Exit of JR Keiyo Line \u0027Maihama Station\u0027"}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Maihama and Tokyo Disneyland"}, "roppongi_odaiba": {"categories": {"cat_1": {"items": [{"address": "2F West Walk, Roppongi Hills, 6-10-1 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Balancing Cleansing Oil R, Essential Oil Fluid Foundation, Botanical Repair Hand Cream. THREE is an iconic Japanese botanical beauty brand, and its flagship store at Roppongi Hills showcases ultimate minimalist Japanese aesthetics. Focusing on natural plant essential oils, their products contain no synthetic fragrances or artificial colors. The flagship Balancing Cleansing Oil features a soothing citrus fragrance, offering an aromatic relaxation experience while removing makeup\u2014an absolute skincare essential for beauty lovers visiting Roppongi.", "name": "THREE Visionarism Tokyo Roppongi Hills Flagship Store", "transport": "Directly connected to Roppongi Hills from Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "2F Galleria, Tokyo Midtown, 9-7-1 Akasaka, Minato-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Hydro Essence Lotion, Aromatics Forest Embrace Spray, Aromatics Hand Cream. BAUM, an independent high-end green beauty brand under Shiseido, features a forest-like space crafted with natural wood and greenery at its Tokyo Midtown store. Emphasizing \u0027coexistence with trees,\u0027 the packaging uses upcycled high-end furniture wood scraps, giving each bottle a unique wood grain. Products emit authentic tree and forest-bathing scents, and the essence lotion provides exceptional hydration\u2014making it a favorite among eco-conscious travellers who value lifestyle quality.", "name": "BAUM Tokyo Midtown", "transport": "Directly connected to Tokyo Midtown from Exit 8 of Roppongi Station on the Toei Oedo Line"}, {"address": "3F West Walk, Roppongi Hills, 6-10-1 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: White Tea Eau de Parfum, Sake Kasu Essence, Kombu Lotion. Originating from Hokkaido, SHIRO is a cruelty-free Japanese skincare brand with an exquisite concept store in Roppongi Hills. Guided by the philosophy of \u0027maximizing the natural benefits of ingredients,\u0027 they formulate cosmetics and skincare using natural ingredients like sake lees (Sake Kasu), kelp (Kombu), and ginger. The bestselling White Tea and Savon fragrances offer clean, sophisticated aromas, while the Sake Kasu essence is a holy grail for achieving radiant, dewy skin\u2014immensely popular among local Japanese women.", "name": "SHIRO Roppongi Hills", "transport": "3-minute walk from Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F Galleria, Tokyo Midtown, 9-7-4 Akasaka, Minato-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: to/one Petal Liquid Eyeshadow, F Organics Deep Moisture Lotion, Chant a Charm Cleansing Milk. Cosme Kitchen is Japan\u0027s premier organic and natural beauty select shop. The Tokyo Midtown branch curates certified organic makeup and skincare brands from Japan and across the globe. The warm, tasteful interior is complimented by knowledgeable staff who offer expert ingredient consultations. Here, you can discover niche, independent Japanese organic brands unavailable at standard drugstores\u2014a shopping paradise for clean beauty enthusiasts.", "name": "Cosme Kitchen Tokyo Midtown", "transport": "1-minute walk via underground passage connected to Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F Hillside, Roppongi Hills, 6-10-1 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: ALBION Skin Conditioner Essential, Balancing Milk, Elegance La Poudre Haute Nuance. ALBION is a classic titan in Japanese luxury counter skincare. ALBION Philosophy at Roppongi Hills combines hands-on product experiences with high-end facial treatment services. The spacious, brightly lit venue offers personalized one-on-one skin analysis. Their legendary star product, the Skin Conditioner, effectively stabilizes sensitive skin, while their subsidiary brand Elegance\u0027s face powder is an immortal legend in the realm of setting powders.", "name": "ALBION Philosophy Roppongi Hills", "transport": "2-minute walk from Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "3F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: CANMAKE Perfect Stylist Eyes, excel Powder \u0026 Pencil Eyebrow EX, LIPS\u0026HIPS Moisturizing Hand Cream. Located inside Odaiba\u0027s DiverCity Tokyo Plaza, AINZ \u0026 TULPE is a highly popular beauty retail chain among women. Brightly lit with wide aisles, products are clearly categorized by benefits and bestseller rankings. Beyond an extensive selection of trendy, affordable Japanese drugstore cosmetics, it features a dedicated corner for their exclusive fragrance and body care brand LIPS\u0026HIPS. It\u0027s the top destination for picking up the latest Japanese makeup trends.", "name": "AINZ \u0026 TULPE DiverCity Tokyo Plaza", "transport": "5-minute walk from Odaiba Station on the Yurikamome Line, or 3-minute walk from Tokyo Teleport Station on the Rinkai Line"}, {"address": "4F AQUA CITY ODAIBA, 1-7-1 Daiba, Minato-ku, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: MK Customer Exclusive Hydrating Sheet Masks, EVE Quick Headache Medicine, LION Restoria Cooling Foot Sheets. Located inside Odaiba\u0027s landmark AQUA CITY, this spacious Matsumotokiyoshi drugstore offers an extraordinarily rich selection of items. Beside popular Japanese medicines, health supplements, and sunscreens, it features dedicated tax-free express checkout counters. The store carries the full lineup of Matsumotokiyoshi\u0027s high-value private brand, MK Customer, making it the most convenient place to buy all your cosmetics and pharmaceuticals in one go while sightseeing in Odaiba.", "name": "Matsumotokiyoshi Aqua City Odaiba", "transport": "1-minute walk from Daiba Station on the Yurikamome Line"}, {"address": "3-14-13 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.0 stars | Must-Buy List: LuLuLun Regional Limited Edition Masks, Saborino Morning Sheet Masks, Kao MegRhythm Steam Eye Masks. Located in the bustling district of Roppongi, Don Quijote is a rare 24-hour shopping paradise. The store features an entire floor dedicated to cosmetics and pharmaceuticals, stocked with hit Japanese beauty items, popular face masks, and over-the-counter medicines. Staying open all night, it\u0027s perfect for a late-night shopping spree after enjoying Roppongi\u0027s night view or dinner. It boasts highly competitive prices and hassle-free tax-free services.", "name": "Don Quijote Roppongi", "transport": "3-minute walk from Exit 3 of Roppongi Station on the Tokyo Metro Hibiya Line or Toei Oedo Line"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "2F/3F West Walk, Roppongi Hills, 6-10-3 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Roppongi-exclusive men\u0027s tailored suit jacket, Japanese handcrafted leather shoes, and collaboration high-quality canvas tote bag. As the flagship store of Japan\u0027s most iconic high-end select shop, it brings together top Japanese designer brands and its own namesake brand. The spacious and sophisticated interior offers a comprehensive selection ranging from formal wear to casual attire, making it a regular haunt for local fashionistas seeking the latest exclusive styles.", "name": "UNITED ARROWS Roppongi Hills", "transport": "Directly connected to Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1F/2F Hillside Keyakizaka Complex, Roppongi Hills, 6-10-2 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Ultra-luxurious cashmere knits, Made-in-Japan silk printed scarves, and elegant pointed-toe leather pumps. Originating in Tokyo, ESTNATION is a highly prestigious high-end boutique in the Japanese fashion scene, catering to urban men and women with outfit ideas that combine elegance and modernity. The Roppongi store is vast, featuring not only curated local Japanese apparel but also a flower shop and a lounge space, making it an excellent spot to experience Tokyo\u0027s luxury-casual lifestyle.", "name": "ESTNATION Roppongi Hills", "transport": "About a 5-minute walk from Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "2F/3F West Walk, Roppongi Hills, 6-10-1 Roppongi, Minato-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: BEAMS JAPAN Mt. Fuji motif graphic T-shirt, Japanese artisan hand-woven shoes, and limited-edition collaboration casual backpacks. BEAMS is an iconic select shop that has led Japanese street culture for decades. The Roppongi flagship effortlessly blends street fashion with high couture. Housing multiple specialty sub-brands under BEAMS, it offers everything from refined tailored clothing to trendy lifestyle goods infused with traditional Japanese elements, making it immensely popular among local tastemakers.", "name": "BEAMS Roppongi Hills", "transport": "About a 4-minute walk from Exit 3 of Roppongi Station on the Toei Oedo Line"}, {"address": "2F Galleria, Tokyo Midtown, 9-7-1 Akasaka, Minato-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: 132 5. 3D geometric folded jacket, Pleats Please signature pleated pants, and BAO BAO ISSEY MIYAKE geometric tote bag. This is an innovative concept store by master Japanese designer Issey Miyake, focusing on apparel crafted from recycled fabrics combined with mathematical geometric structures. The store showcases the stunning artistry of transforming 2D flat folds into 3D structural garments, making it a holy grail for fashion enthusiasts seeking ultimate original Japanese design and high-end textiles.", "name": "132 5. ISSEY MIYAKE Tokyo Midtown", "transport": "Directly connected to Exit 8 of Roppongi Station on the Toei Oedo Line"}, {"address": "1F Galleria, Tokyo Midtown, 9-7-4 Akasaka, Minato-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: PORTER TANKER iconic 3-way briefcase, artisan handcrafted genuine leather geometric coin purse, and Roppongi-exclusive durable nylon crossbody bag. This is the official specialty store for YOSHIDA \u0026 CO., Japan\u0027s legendary handcrafted bag brand. Embodying the craftsman spirit of \u0027one stitch, one soul\u0027, their products are renowned for exceptional durability, functional pocket designs, and minimalist quality. It is a premier sanctuary for local professionals and bag collectors alike.", "name": "KURA CHIKA by YOSHIDA Roppongi", "transport": "About a 3-minute walk from Exit 3 of Nogizaka Station on the Tokyo Metro Chiyoda Line"}, {"address": "4F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: NIPPON MADE hand-dyed leather Mexico 66 sneakers, Serrano lightweight retro running shoes, and printed leather tote bags. Onitsuka Tiger is Japan\u0027s iconic retro sports fashion brand. This large-scale store in Odaiba offers an extensive selection, featuring a dedicated area for the premium \u0027NIPPON MADE\u0027 series. Each pair is handcrafted and dyed by skilled Japanese artisans, combining superior comfort with high collectible value.", "name": "Onitsuka Tiger DiverCity Tokyo Plaza", "transport": "About a 5-minute walk from Daiba Station on the Yurikamome Line / About a 3-minute walk from Tokyo Teleport Station on the Rinkai Line"}, {"address": "4F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto-ku, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: master-piece (MSPC) Made-in-Japan functional waterproof backpack, PORTER lightweight high-density crossbody bag, and Made-in-Japan vegetable-tanned leather long wallet. SAC\u0027S BAR is one of Japan\u0027s largest domestic bag and luggage select stores, bringing together premier local brands like Master-piece, Porter, and TAKEO KIKUCHI. Whether you\u0027re looking for functional outdoor backpacks or elegant handcrafted leather goods, you can find them all in one place.", "name": "SAC\u0027S BAR JEAN DiverCity Tokyo Plaza", "transport": "About a 3-minute walk from Exit B of Tokyo Teleport Station on the Rinkai Line"}, {"address": "5F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Control Bear iconic graphic T-shirt, Japanese artist collaboration cardigan, and embroidered hedgehog canvas tote bag. Originating in Tokyo, graniph is a popular independent graphic design apparel brand renowned for its collaborations with global artists, Japanese picture book creators, and beloved anime. The Odaiba branch boasts a dazzling variety of uniquely styled, budget-friendly graphic tees, dresses, and fashion accessories, making it a hit among local youth and families.", "name": "Design Tshirts Store graniph DiverCity Tokyo Plaza", "transport": "About a 5-minute walk from Daiba Station on the Yurikamome Line"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-8-12 Azabu-Juban, Minato City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Salted Peanuts, Wasabi Peas, Assorted Bean Snacks. Founded in 1865, this century-old shop specializing in bean confectionery is located near Roppongi in the Azabu-Juban shopping district. Adhering to traditional methods, peanuts, peas, and various nuts are coated in dozens of unique flavors\u2014ranging from classic soy sauce and seaweed to shiso (perilla) and brown sugar. Crisp, crunchy, and balancing sweet and savory, these beautiful long-lasting snacks are top-tier souvenirs beloved by both Tokyo locals and international tourists.", "name": "Azabu-Juban Mamegen Main Store", "transport": "About a 3-minute walk from Exit 7 of Azabu-juban Station on the Toei Oedo Line"}, {"address": "1-8-14 Azabu-Juban, Minato City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Taiyaki, Ogura Red Bean Paste Gift Box, Karinto. Renowned as the birthplace of Japanese taiyaki, this shop has been operating since 1909. Using individual single-mould irons (\u0027Iccyo-yaki\u0027) to hand-bake each pastry, the skin is thin, crispy, and lightly toasted, while the filling is made from slow-cooked Hokkaido Tokachi red beans\u2014sweet without being cloying. Grab a few freshly baked taiyaki to go or buy a gift set of red bean paste; it\u0027s hands-down the most authentic traditional wagashi experience around Roppongi.", "name": "Azabu-Juban Naniwaya Sohonten", "transport": "About a 4-minute walk from Exit 4 of Azabu-juban Station on the Toei Oedo Line"}, {"address": "1-9-1 Azabu-Juban, Minato City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Tanuki Senbei Gift Box, Direct-Fired Soy Sauce Rice Crackers, Cheese-Filled Rice Crackers. Located in Azabu-Juban, this historic senbei (rice cracker) shop once supplied products to the Imperial Household, earning fame for its handcrafted baked rice crackers. The signature \u0027Tanuki Senbei\u0027 uses premium Yamagata rice, grilled repeatedly over open flames with a secret aged soy sauce, yielding a satisfying hard crunch and rich aroma. Packaged in elegant tin boxes with classic vintage charm, these crackers make fantastic souvenirs capturing Roppongi\u0027s traditional cultural flair.", "name": "Tanuki Senbei Main Store", "transport": "About a 2-minute walk from Azabu-juban Station on the Tokyo Metro Namboku Line or Toei Oedo Line"}, {"address": "1F Tokyo Midtown Plaza, 9-7-2 Akasaka, Minato City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Assorted French Baked Cookie Gift Box, Pistachio Pound Cake, French Financiers. Created by famed Japanese pastry chef Toshi Yoroizuka, this flagship store is located in Roppongi\u0027s Tokyo Midtown. Alongside top-tier plated desserts served in-store, the takeout section offers exquisite French pastries that are extremely popular as gifts. The must-buy baked cookies use fermented butter and carefully selected ingredients, delivering rich flavors with wonderful complexity. Packaged with elegant sophistication, they perfectly mirror Roppongi\u0027s luxurious modern vibe.", "name": "Toshi Yoroizuka Tokyo Midtown", "transport": "Directly connected to Exit 8 of Roppongi Station on the Toei Oedo Line"}, {"address": "1F Grand Hyatt Tokyo, Roppongi Hills, 6-10-3 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Kuon Brick Chocolates, Seasonal Pound Cake, Premium Handmade Financiers. Situated inside Roppongi Hills, this pastry boutique belongs to a top five-star hotel staffed by internationally award-winning chefs. Their meticulously crafted French desserts and refined gift boxes are highly favored by business executives and discerning travelers. The signature chocolates and room-temperature baked goods are crafted with extraordinary precision, offering rich, subtle flavors without being overly sweet\u2014a true symbol of Roppongi luxury and taste.", "name": "Grand Hyatt Tokyo Pastry Boutique", "transport": "About a 3-minute walk from Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "3F Aqua City Odaiba, 1-7-1 Daiba, Minato City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Salt \u0026 Camembert Cookies, Honey \u0026 Gorgonzola Cookies, Milk Cheese Cake. A highly popular dessert and gift shop located in Odaiba\u0027s Aqua City. Combining fresh Hokkaido milk with carefully selected premium European cheeses, they create irresistibly rich sandwich cookies. The bold savory note of cheese perfectly balances the sweet, buttery cookies. Playfully packaged, easy to carry, and with a great shelf-life, these are immensely popular snack gift boxes you shouldn\u0027t miss when visiting the Odaiba bay area.", "name": "Tokyo Milk Cheese Factory - Aqua City Odaiba", "transport": "About a 1-minute walk from Daiba Station on the Yurikamome Line"}, {"address": "7F Fuji TV Headquarters, 2-4-8 Daiba, Minato City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: One Piece Straw Hat Crew Manju, Chibi Maruko-chan Limited Senbei, Fuji TV Mascot \u0027Laughing Dog\u0027 Sandwich Biscuits. The official flagship souvenir store located inside the iconic Fuji TV Headquarters in Odaiba. The shop gathers exclusive collaboration snacks from popular anime and TV shows. Whether it\u0027s One Piece, Dragon Ball, or Chibi Maruko-chan, the character-themed limited packaging is cute and detailed, housing high-quality cookies and treats. It\u0027s the ultimate spot to pick up unique anime-themed souvenir snacks.", "name": "Fuji TV Goods Shop Wonder Island", "transport": "About a 3-minute walk from Daiba Station on the Yurikamome Line"}, {"address": "7F DiverCity Tokyo Plaza, 1-1-10 Aomi, Koto City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Gundam Limited Zeon Printed Cookie Tin, Gundam Green Tea Bag Set, Amuro Ray Custom Rice Crackers. An official Gundam concept shop located right next to the life-sized Gundam statue at DiverCity Tokyo Plaza in Odaiba. In addition to trendy streetwear, their exclusive Gundam-themed snacks and tea sets are absolute must-buys for fans! The beautifully packaged cookie tins featuring classic Gundam logos and mobile suits have high collectible value, serving as exclusive Odaiba souvenirs that combine anime culture with delicious taste.", "name": "STRICT-G DiverCity Tokyo Store", "transport": "About a 5-minute walk from Daiba Station on the Yurikamome Line, or a 3-minute walk from Tokyo Teleport Station on the Rinkai Line"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "6-10-1 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Estnation limited collaboration accessories, Mori Art Museum Takashi Murakami exclusive merchandise, and handcrafted Japanese artisan leather wallets. Roppongi Hills is Tokyo\u0027s most iconic multi-purpose fashion landmark, bringing together top international luxury brands and emerging local Japanese designer boutiques. Beyond enjoying a premier shopping experience, visitors can head up to the top-floor observation deck for sweeping views of Tokyo Tower. Local fashion enthusiasts love coming here to shop for high-quality lifestyle goods and high-end apparel.", "name": "Roppongi Hills", "transport": "Direct access from Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "9-7-1 Akasaka, Minato City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Kayanoya special dashi stock gift sets, Toraya (TORAYA TOKYO) yokan jelly assortments, and MUJI Midtown exclusive high-quality lifestyle items. An extraordinary space combining expansive greenery with high-end shopping, featuring numerous top-tier local Japanese brands and historic legacy shops. The store designs strongly embody Japanese aesthetics, making it a favorite among stylish Tokyo locals. It\u0027s an excellent spot to purchase exquisite souvenirs and savor premium Japanese desserts.", "name": "Tokyo Midtown", "transport": "Direct access from Exit 8 of Roppongi Station on the Toei Oedo Line"}, {"address": "1-1-10 Aomi, Koto City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: The Gundam Base limited-edition model kits, Hello Kitty Japan exclusive Japanese-style charms, and Calbee Plus freshly fried potato chips with limited-edition snacks. Internationally famous for its life-sized Gundam statue, this mall gathers popular Japanese fashion brands, anime specialty shops, and famous discount retailers. Deeply loved by families and anime fans, it is the liveliest complex in the Odaiba area combining both entertainment and shopping.", "name": "DiverCity Tokyo Plaza", "transport": "About a 5-minute walk from Odaiba Station on the Yurikamome Line, or a 3-minute walk from Tokyo Teleport Station on the Rinkai Line"}, {"address": "1-7-1 Daiba, Koto City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Disney Store Odaiba exclusive plush toys, Tokyo Ramen Kokuhou Taikan limited ramen gift boxes, and Flying Tiger Copenhagen creative lifestyle goods. A large waterfront shopping mall with breathtaking ocean views and a sight of the Statue of Liberty. Housing nearly 100 shops featuring trendy Japanese lifestyle goods and duty-free brands, it is highly favored by couples and tourists alike.", "name": "AQUA CITY ODAIBA", "transport": "About a 1-minute walk from the North Exit of Odaiba Station on the Yurikamome Line"}, {"address": "1F/2F Hillside, Roppongi Hills, 6-10-2 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: ESTNATION original premium wool coats, Hirotaka Japanese designer fine jewelry, and Maison Margiela trendy fragrances and leather goods. As the flagship store of Japan\u0027s most iconic luxury domestic select shop, it centers around the concept of \u0027sophisticated luxury for daily life.\u0027 Bringing together local Japanese and emerging international designer brands with meticulously selected fabrics and cuts, it is the top choice for Tokyo fashion insiders looking for unique, high-quality statement pieces.", "name": "ESTNATION Roppongi Hills", "transport": "About a 3-minute walk from Roppongi Station on the Tokyo Metro Hibiya Line"}, {"address": "1-6-1 Daiba, Koto City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Odaiba 1-Chome Shotengai Showa retro snack packs, Takoyaki Museum exclusive sauces, and LEGOLAND Discovery Center limited souvenirs. Featuring a wooden boardwalk design, this mall houses the \u0027Odaiba 1-Chome Shotengai\u0027 inside, recreating a nostalgic Japanese Showa-era street packed with retro local snacks, vintage toys, and unique knick-knacks. Both locals and tourists love coming here to experience the joyful retro vibe.", "name": "DECKS Tokyo Beach", "transport": "About a 2-minute walk from Odaiba-kaihinkoen Station on the Yurikamome Line"}, {"address": "3-1-1 Kaneda-higashi, Kisarazu City, Chiba Prefecture (Direct highway buses available from Odaiba/Tokyo Station)", "feature": "\u2b50 4.4 stars | Must-Buy List: BEAMS discounted trench coats, SEIKO discounted watches, and Le Creuset dream pink cast iron pots. The largest outlet mall near Tokyo with direct shuttle buses from both Odaiba and Tokyo Station. Boasting over 300 international and local Japanese fashion brands (such as BEAMS, United Arrows, Nike, etc.) with deep discounts, it is the top-rated choice for planning a full-day shopping spree during a trip to Tokyo.", "name": "Mitsui Outlet Park Kisarazu", "transport": "About 45\u201350 minutes by direct highway bus from Tokyo Station or Odaiba Station"}, {"address": "Roppongi Keyakizaka-dori, 6-11-1 Roppongi, Minato City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Tsutaya-exclusive handcrafted leather bookmarks, artisan handmade Japanese ceramic tea sets, and Tokyo-themed collaboration mugs. Combining coffee and reading into a refined lifestyle concept store, this landmark cultural venue in Roppongi features a curated selection of Japanese artisan crafts, stationery, design books, and elegant tableware. Infused with a rich blend of Eastern aesthetics and modern trends, it comes highly recommended by local hipsters and international travelers.", "name": "Roppongi Tsutaya Books", "transport": "About a 5-minute walk from Exit 1C of Roppongi Station on the Tokyo Metro Hibiya Line"}], "name": "Shopping Malls \u0026 Recommended Outlets"}}, "name": "Roppongi and Odaiba"}, "shibuya_harajuku": {"categories": {"cat_1": {"items": [{"address": "1-14-30 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: @cosme Hall of Fame Beauty Sponge, Decort\u00e9 Loose Face Powder, Excel Real Clothes Shadow Palette. Located directly opposite Harajuku Station, this is Japan\u0027s largest beauty haven, featuring over 600 brands and tens of thousands of products. It is famous for its physical ranking walls that turn millions of online consumer reviews into hands-on testing zones, allowing visitors to easily shop the season\u0027s top-selling Japanese and international beauty products all in one place.", "name": "@cosme TOKYO Flagship Store (@cosme TOKYO)", "transport": "About a 1-minute walk from the Takeshita Exit of JR Yamanote Line \u0027Harajuku Station\u0027"}, {"address": "B1F-1F, 3-12-7 Kita-Aoyama, Minato-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Savon Hair Mist, White Tea Eau de Parfum, Sake Lees Lotion. A premier Japanese cruelty-free, vegan, and natural beauty brand, its flagship store embodies the ultimate minimalist Japanese aesthetic. Emphasizing local natural ingredients such as sake lees, gagome kelp, and ginger, it is highly favored by Japanese women who prioritize quality and natural ingredients. The store also offers on-site customization services and exclusive store-limited fragrances.", "name": "SHIRO Omotesando Flagship Store (SHIRO Omotesando)", "transport": "About a 1-minute walk from Exit B2 of Tokyo Metro \u0027Omotesando Station\u0027"}, {"address": "6F, Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Balancing Cleansing Oil R, Shimmering Glow Duo, Aiming Facial Oil Essence. A premium Japanese botanical beauty brand featuring natural essential oils and minimalist grey packaging. The Shibuya counter offers a deeply soothing experiential space. Its iconic cleansing oil, infused with a captivating citrus essential oil scent, is a perennial holy grail item in high-end Japanese skincare.", "name": "THREE Shibuya Scramble Square (THREE Shibuya Scramble Square)", "transport": "Directly connected to JR and Tokyo Metro \u0027Shibuya Station\u0027"}, {"address": "4-28-15 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Fleur Hand Cream, Osmanthus Eau de Parfum, Argan Herbal Oil. A wildly popular niche Japanese organic fragrance and beauty brand that uses carefully selected local natural ingredients. Its Kinmokusei (Osmanthus) series is a legendary limited-edition hit every autumn. Offering exquisite packaging at affordable prices, it is a must-buy insider souvenir when visiting Tokyo.", "name": "AUX PARADIS Omotesando (\u30aa\u30a5\u30d1\u30e9\u30c7\u30a3 \u8868\u53c2\u9053\u5e97)", "transport": "About a 3-minute walk from Exit 5 of Tokyo Metro \u0027Meiji-jingumae Station\u0027"}, {"address": "23-2 Udagawacho, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: Alinamin EX Plus, EVE Quick DX Pain Relief, Shiseido Fino Premium Touch Hair Mask. Without fancy decor or advertising, this drugstore is a legendary secret discount spot known even to Tokyo locals. It offers rock-bottom prices that are often cheaper before tax than other chains after tax refund, making it the ultimate treasure trove for stocking up on household medicines and classic beauty products.", "name": "OS Drug Shibuya (OS\u30c9\u30e9\u30c3\u30b0 \u6e0b\u8c37\u5e97)", "transport": "About a 3-minute walk from the Hachiko Exit of JR \u0027Shibuya Station\u0027"}, {"address": "22-3 Udagawacho, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: ARGELAN Herbal Organic Lip Balm, Blanc White Whitening Essence, LuLuLun Shibuya Limited Edition Face Masks. As one of Matsumoto Kiyoshi\u0027s flagship locations in Shibuya, this mega drugstore offers an exceptionally comprehensive selection. It features dedicated counters for its proprietary organic brand ARGELAN and exclusive Blanc White skincare line, along with multilingual staff and convenient tax-free counters.", "name": "Matsumoto Kiyoshi Shibuya Part1 Store (\u30de\u30c4\u30e2\u30c8\u30ad\u30e8\u30b7 \u6e0b\u8c37Part1\u5e97)", "transport": "About a 3-minute walk from the Hachiko Exit of JR \u0027Shibuya Station\u0027"}, {"address": "2F, 21-1 Udagawacho, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: \u0026be UV Primer, Whomee Control Color Base, Canmake Limited Edition Eyeshadow Palette. The entire 2nd floor of Shibuya LOFT is a paradise for beauty products and cosmetics accessories, bringing together Japan\u0027s trendiest drugstore makeup and rising indie brands loved by young adults. Often featuring exclusive pre-releases and beauty influencer collaborations, it is the frontline hotspot for catching current Japanese makeup trends.", "name": "Shibuya LOFT Beauty Floor (Shibuya LOFT Beauty Floor)", "transport": "About a 5-minute walk from the Hachiko Exit of JR \u0027Shibuya Station\u0027"}, {"address": "6F, Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Face Stylist Palette, Lip Velvet, Powder Highlighter. A clean and organic beauty spin-off from the popular Japanese fashion brand SNIDEL, designed for women who crave sophisticated style. Featuring clean natural ingredients and chic Morandi-toned aesthetic packaging, it is currently one of the most talked-about native boutique beauty brands in Japanese fashion circles.", "name": "SNIDEL BEAUTY Shibuya Scramble Square (SNIDEL BEAUTY Shibuya Scramble Square)", "transport": "Directly connected to JR and Tokyo Metro \u0027Shibuya Station\u0027"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "3-24-7 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy List: Classic BEAMS collaboration sneakers, high-quality Made-in-Japan logo printed T-shirts, and signature BEAMS canvas tote bags. This is the original flagship store of BEAMS, the pioneering Japanese select shop giant that has influenced Tokyo street style for decades. The store brings together menswear, Japanese curated items, and seasonal limited-edition collaborations. Whether you are looking for minimalist American casual style or layered Japanese fashion, this is an absolute must-visit local fashion landmark on the streets of Harajuku.", "name": "BEAMS Harajuku", "transport": "About a 6-minute walk from the Takeshita Exit of JR Harajuku Station"}, {"address": "4-26-32 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy List: CULLNI asymmetrical shirts, Needles classic butterfly embroidered track pants, and ATTACHMENT tailored blazers. Built on the concept of \u0027100% From JAPAN TO THE WORLD\u0027, this local select shop specializes in curating emerging Japanese designer brands. The staff possess impeccable fashion sense and provide warm service. Here, you can discover high-quality, distinctive Japanese clothing that stands out from the crowd\u2014making it the top choice for fashion enthusiasts seeking unique textures and cuts.", "name": "STUDIOUS Harajuku Flagship", "transport": "About a 4-minute walk from Meiji-jingumae Station on the Tokyo Metro"}, {"address": "1F Shibuya PARCO, 15-1 Udagawacho, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy List: Classic HUMAN MADE heart logo casual T-shirts, American vintage duck-print throw pillows, and embroidered vintage baseball jackets. Spearheaded by Japanese streetwear godfather NIGO, this heavy-hitting local brand blends vintage American workwear with playful, whimsical animal graphics. The store displays are highly creative, and limited-edition launches consistently draw massive queues. It\u0027s an unmissable destination embodying modern Tokyo street culture.", "name": "HUMAN MADE Shibuya PARCO", "transport": "About a 5-minute walk from the Hachiko Exit of JR Shibuya Station"}, {"address": "3-22-8 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy List: Exclusive atmos-limited colorway sneakers, atmos logo socks, and sneaker waterproof \u0026 stain protector sprays. Originating in Tokyo as a world-renowned sneaker retailer, atmos\u0027s Harajuku flagship is a true holy land for sneakerheads. Beyond stocking hot releases from top sportswear brands, its biggest draw is the highly collectible Tokyo-exclusive and atmos-exclusive collaborations with brands like Nike and Adidas.", "name": "atmos Harajuku", "transport": "About a 5-minute walk from the Takeshita Exit of JR Harajuku Station"}, {"address": "1-13-1 Jinnan, Shibuya-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy List: Heavyweight American-style pocket T-shirts, FREAK\u0027S STORE main-line relaxed-fit trousers, and collaborative outdoor windbreakers. Located in Shibuya\u0027s Jinnan district, this flagship store is an iconic hub for Japanese Amekaji (American casual style). Focusing on vintage American aesthetics mixed with relaxed Japanese silhouettes, it offers excellent quality at reasonable prices. Extremely popular among local 20- and 30-somethings, this is the perfect spot to pick up effortlessly stylish Japanese street looks.", "name": "FREAK\u0027S STORE Shibuya", "transport": "About an 8-minute walk from the Hachiko Exit of JR Shibuya Station"}, {"address": "5-6-8 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.7 stars | Must-buy List: TANKER series 3-way briefcase, classic PORTER green crossbody bag, and Omotesando-exclusive leather wallets. This standalone flagship of Japan\u0027s legendary bag brand Yoshida \u0026 Co. embodies their famous ethos of \u0027heart and soul in every stitch.\u0027 The spacious and impressive interior displays the most complete collection of TANKER flight-nylon products alongside premium limited editions. Renowned for meticulous craftsmanship, durability, and timeless style, these bags are iconic Tokyo souvenirs.", "name": "PORTER OMOTESANDO", "transport": "About a 5-minute walk from Exit A1 of Omotesando Station on the Tokyo Metro"}, {"address": "4-21-5 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy List: BAPE ABC Camo Shark Full Zip Hoodie, classic Ape Head printed T-shirts, and BAPE STA vintage leather sneakers. Born in Ura-Harajuku, this global pioneer of streetwear carries rich subcultural heritage at its Harajuku flagship. Filled with signature camo graphics and Ape Head motifs, the store offers streetwear, footwear, and lifestyle accessories. Both veteran streetwear fans and the younger generation can immerse themselves in authentic Harajuku street attitude here.", "name": "BAPE STORE\u00ae Harajuku", "transport": "About a 3-minute walk from Exit 5 of Meiji-jingumae Station on the Tokyo Metro"}, {"address": "3-28-1 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-buy List: UNITED ARROWS classic tailored wool blazers, Monkey Time street loose-fit shirts, and Beauty \u0026 Youth high-quality genuine leather loafers. This flagship store is the birthplace of UNITED ARROWS, one of Japan\u0027s premiere select retail giants, seamlessly blending tailored classic elegance with modern trends. Designed by a famed architect, the sophisticated space features high-quality in-house clothing alongside curated global designer footwear and bags\u2014making it the ideal spot to experience refined, mature Japanese fashion.", "name": "UNITED ARROWS Harajuku", "transport": "About an 8-minute walk from the Takeshita Exit of JR Harajuku Station"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "5-11-11 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 Stars | Must-buy list: No.1 Salt Caramel, No.2 Vanilla Caramel, 8-Piece Classic Numbered Caramel Gift Box. Tucked away in an alley off Harajuku Omotesando, this handmade caramel specialty shop is famous for crafting additive-free, pure handcrafted candies. Each caramel is numbered to represent a unique flavor, offering a rich, smooth texture that doesn\u0027t stick to your teeth. Wrapped in beautifully textured packaging, it is one of Harajuku\u0027s most iconic boutique souvenirs.", "name": "NUMBER SUGAR Omotesando Main Store", "transport": "About a 5-minute walk from Exit 7 of Tokyo Metro Meiji-jingumae Station"}, {"address": "1F Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy list: Butter Sandwich Cookies, Amaou Strawberry Butter Sandwich Cookies, Shibuya-exclusive Dark Chocolate Butter Sandwich Cookies. PRESS BUTTER SAND uses a traditional Japanese wagashi press-baking technique to create double-layered crispy cookies, filled with rich Hokkaido fresh cream and smooth raw caramel sauce. The Shibuya store often features exclusive limited-edition packaging and flavors, combining sophistication with mouthwatering deliciousness.", "name": "PRESS BUTTER SAND Shibuya Scramble Square", "transport": "Directly connected to JR Shibuya Station, located on the 1st floor of Shibuya Scramble Square"}, {"address": "B1F Shibuya Mark City (Tokyu Foodshow), 1-12-1 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy list: Butter Financier, Butter French Toast Biscuits, Butter Cake. A hugely popular brand that tops Tokyo souvenir charts, Butter Butler uses carefully selected Swiss fermented butter and French Gu\u00e9rande sea salt. The classic Butter Financier boasts a lightly crispy crust and a rich, moist interior, with an irresistible butter aroma and highly recognizable vintage butler packaging in yellow and blue.", "name": "Butter Butler Shibuya Tokyu Foodshow", "transport": "Directly connected to Keio Inokashira Line Shibuya Station, B1F Shibuya Mark City"}, {"address": "1F Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy list: \u00c9chir\u00e9 Butter Madeleine, \u00c9chir\u00e9 Butter Financier, Canel\u00e9. A pastry shop operated by the premium French fermented butter brand \u00c9chir\u00e9, featuring handcrafted baked goods made exclusively for the Shibuya store that foodies adore. Freshly baked daily, their canel\u00e9s are crispy on the outside, tender on the inside, and infused with rich buttery and caramel aromas\u2014a luxury souvenir you cannot miss when visiting Shibuya.", "name": "\u00c9CHIR\u00c9 P\u00c2TISSERIE AU BEURRE Shibuya", "transport": "Directly connected to JR Shibuya Station, 1st floor of Shibuya Scramble Square"}, {"address": "1-16-8 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.1 Stars | Must-buy list: Freshly Fried Thick-Cut Potato Chips with Hokkaido Soft Serve, Tokyo-exclusive Soy Sauce Potato Sticks, Regional Potato Chip Gift Sets from across Japan. The concept store of the famous potato chip brand Calbee, located on bustling Takeshita Street in Harajuku. Beyond serving piping hot, freshly fried potato chips made to order, it also sells gift boxes collecting regional exclusive flavors from all over Japan\u2014making it fun and highly memorable.", "name": "Calbee+ Harajuku Takeshita Street", "transport": "About a 3-minute walk from the Takeshita Exit of JR Yamanote Line Harajuku Station"}, {"address": "1F Shibuya Scramble Square, 2-24-12 Shibuya, Shibuya-ku, Tokyo", "feature": "\u2b50 4.4 Stars | Must-buy list: Raw Chocolate Tarts, Raw Chocolate Sabl\u00e9s, Aromatic Raw Chocolates. A specialized raw chocolate brand hailing from Kamakura, focusing on premium cacao bean quality and precise water-ratio blending. Their raw chocolate sabl\u00e9 cookies feature a crispy shell with a melt-in-your-mouth filling, offering rich layers of texture without being overly sweet. The sleek, luxury-style packaging is a huge hit among the stylish crowd.", "name": "MAISON CACAO Shibuya Scramble Square", "transport": "Directly connected to JR Shibuya Station, 1st floor of Shibuya Scramble Square"}, {"address": "6-31-15 Jingumae, Shibuya-ku, Tokyo", "feature": "\u2b50 4.2 Stars | Must-buy list: Harajuku Baked Chocolate, Harajuku Honey Roll Cake, Premium Western Confectionery Gift Sets. Founded in 1924, this historic local Western confectionery shop is famous for desserts crafted using honey harvested directly from rooftop beehives in Harajuku. Its signature \u0027Harajuku Baked Chocolate\u0027 won\u0027t melt even in high temperatures, offering a rich bittersweet flavor and crispy texture. It stands as Harajuku\u0027s most iconic classic local souvenir.", "name": "Colombin Harajuku Main Store", "transport": "About a 1-minute walk from Exit 7 of Tokyo Metro Meiji-jingumae Station"}, {"address": "B1F Shibuya Mark City (Tokyu Foodshow), 1-12-1 Dogenzaka, Shibuya-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Must-buy list: Salt \u0026 Camembert Cookies, Honey \u0026 Gorgonzola Cookies, Milk Cheese Cake. Crafted using high-quality Hokkaido milk and fine European cheeses, offering an addictively rich blend of sweet and savory flavors. With a long shelf life and beautifully designed packaging, these cookies are an immensely popular must-buy souvenir for tourists visiting Shibuya.", "name": "Tokyo Milk Cheese Factory Shibuya Tokyu Foodshow", "transport": "Directly connected to Keio Inokashira Line Shibuya Station, B1F Shibuya Mark City"}], "name": "Must-Buy Signature Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "15-1 Udagawacho, Shibuya City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: 2G limited-edition trend figures, BAO BAO ISSEY MIYAKE designer bags, Nintendo TOKYO exclusive merchandise. Blending Japanese subculture with high fashion, the 6th floor features a video game and anime zone complete with Nintendo and Pok\u00e9mon flagship stores. Upper floors house emerging Japanese designer brands and independent select shops, making it an unmissable fashion landmark for trendsetters.", "name": "Shibuya PARCO", "transport": "Approx. 5-min walk from Hachiko Exit of JR Shibuya Station"}, {"address": "2-24-12 Shibuya, Shibuya City, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Press Butter Sand Shibuya-exclusive caramel butter sandwich cookies, HARE uniquely tailored jackets, Nakagawa Masashichi Shoten lifestyle goods. Directly connected to Shibuya Station, this skyscraper complex features a basement food hall packed with iconic Japanese dessert brands. The mid-to-upper floors offer curated Japanese clothing and artisanal goods, while SHIBUYA SKY on the rooftop is the ultimate observatory overlooking the famous Shibuya Crossing.", "name": "Shibuya Scramble Square", "transport": "Directly connected to Exit B6 of JR Shibuya Station"}, {"address": "1-11-6 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Jane Marple vintage dresses, GR8 limited-edition collab streetwear, MILKFED. trendy backpacks. As the
