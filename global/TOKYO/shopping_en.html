 birthplace of Harajuku\u0027s avant-garde youth fashion and subcultures, this mall gathers countless Japanese indie designer brands, Gothic Lolita apparel, and street fashion boutiques. It\u0027s not only the top choice for finding unique personal style but also for deeply immersing yourself in Tokyo\u0027s distinct subculture charm.", "name": "Laforet Harajuku", "transport": "Approx. 5-min walk from Omotesando Exit of JR Harajuku Station, or 1-min walk from Exit 5 of Meiji-jingumae Station (Tokyo Metro)"}, {"address": "4-12-10 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Y-3 sneakers, MARK \u0026 LONA golf wear, SHIRO scented hand creams. Designed by renowned architect Tadao Ando, the interior features a unique spiral sloping ramp layout. Packed with top-tier Japanese designer brands and refined boutique select shops, it exudes an elegant and trendy vibe\u2014perfect for shoppers seeking high-quality lifestyle items and an exquisite shopping experience.", "name": "Omotesando Hills", "transport": "Approx. 2-min walk from Exit A2 of Omotesando Station (Tokyo Metro)"}, {"address": "2-21-1 Shibuya, Shibuya City, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: d47 design travel local traditional crafts, Yoku Moku cigar roll gift sets, CONVERSE TOKYO special canvas bags. A lifestyle department store targeting mature women and hipster audiences. The 8th-floor \u0027d47 MUSEUM\u0027 promotes local specialties and fine crafts from all 47 prefectures of Japan, while the basement floors boast some of Tokyo\u0027s most famous high-end confectionery shops and gift boutiques.", "name": "Shibuya Hikarie", "transport": "Directly connected to Miyamasuzaka Exit of JR Shibuya Station (or Exit 15 via Tokyu Toyoko Line / Tokyo Metro Fukutoshin Line Shibuya Station)"}, {"address": "6-31-21 Jingumae, Shibuya City, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Kosugiyu Harajuku exclusive merch, COVER magazine library original goods, creator collaboration handmade crafts. Opened in 2024, this new Harajuku cultural landmark combines Japanese creator spaces, a traditional sento (public bathhouse) \u0027Kosugiyu\u0027, and quirky lifestyle boutiques. Overflowing with the energy of Japan\u0027s next-gen designers and creators, it offers an unprecedented local cultural shopping vibe.", "name": "Tokyu Plaza Harajuku Harakado", "transport": "Right outside Exit 4 of Meiji-jingumae Station (Tokyo Metro), or approx. 4-min walk from Omotesando Exit of JR Harajuku Station"}, {"address": "2-29-1 Dogenzaka, Shibuya City, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: EGOIST classic flattering trousers, Fig \u0026 Viper street style jackets, Ank Rouge sweet Japanese dresses. The iconic symbol of Shibuya Gyaru and youth fashion, housing dozens of local Japanese young women\u0027s apparel and accessory brands. Staff outfits here frequently lead seasonal teenage trends in Japan, making it the go-to spot for great-value Japanese fashion.", "name": "SHIBUYA109", "transport": "Approx. 3-min walk from Hachiko Exit of JR Shibuya Station"}, {"address": "3-1-1 Kaneda-higashi, Kisarazu City, Chiba Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: BEAMS outlet discounted trench coats, UNITED ARROWS sale wool coats, NIKE limited-edition running shoes. The largest outlet mall with the most complete brand lineup near Tokyo, easily accessible via a direct highway bus from Shibuya Station. It features outlet stores for immensely popular Japanese select shops (like BEAMS, UNITED ARROWS, Urban Research) alongside major international brands, offering unbeatable bargain prices.", "name": "Mitsui Outlet Park Kisarazu", "transport": "Approx. 50 mins by direct highway bus from Shibuya Station (Shibuya Mark City Bus Terminal)"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Shibuya and Harajuku"}, "shinjuku": {"categories": {"cat_1": {"items": [{"address": "2F, Lumine Est Shinjuku, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: @cosme Hall of Fame Award-Winning Products, LuLuLun Deep Moisture Sheet Masks, OPERA Lip Tint. As the flagship concept store of Japan\u0027s largest beauty review website, @cosme, this store transcends brand boundaries to physically display top-ranked mega-hit products. Offering an exceptionally comprehensive selection of testers and real-time bestseller rankings, it is an absolute must-visit holy grail for catching up on the latest Japanese beauty trends.", "name": "@cosme STORE Lumine Est Shinjuku", "transport": "Directly connected to JR Shinjuku Station East Exit"}, {"address": "Shinjuku Suen Building, 3-24-3 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: DAZZSHOP Single Eyeshadow, AYURA Aromatic Bath Essence, LIPS and HIPS Moisturizing Hand Cream. Designed as a dream beauty space for women, this multi-story store is spacious and bright. In addition to popular drugstore cosmetics, it exclusively carries many local Japanese indie brands and natural skincare lines. Beautifully curated like a high-end boutique, it is iconic among local beauty lovers.", "name": "Ainz \u0026 Tulpe Shinjuku East Exit", "transport": "About a 1-minute walk from JR Shinjuku Station East Exit"}, {"address": "B1F, Lumine Est Shinjuku, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: White Tea Eau de Parfum, Sake Kasu Essence, Ginger Lip Butter. Hailing from Hokkaido, Japan, this premium natural skincare and beauty brand emphasizes carefully selected natural ingredients such as sake kasu (sake lees), kelp, and botanicals. The Shinjuku branch features a sleek, minimalist design, and its elegant, comforting fragrances and skincare products are wildly popular among young Japanese women and professionals.", "name": "SHIRO Lumine Est Shinjuku", "transport": "Directly connected to JR Shinjuku Station East Exit"}, {"address": "1F, Main Building, Isetan Shinjuku, 3-14-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature Color Eyes Palette, The Cream Foundation, Vibrant Rich Lipstick. Representing the pinnacle of Japanese high-end aesthetics, this premier luxury makeup counter inside the beauty mecca of Isetan Shinjuku is always bustling. Renowned for its ultra-fine powders, naturally luminous seasonal color palettes, and sophisticated packaging, it is a flagship Japanese luxury brand highly sought after by beauty enthusiasts.", "name": "SUQQU Shinjuku Isetan", "transport": "Directly connected to Tokyo Metro Shinjuku-sanchome Station Exits B3/B4/B5"}, {"address": "3-17-3 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 stars | Must-Buy List: matsukiyo Exclusive Deep Moisture Sheet Masks, EVE Pain Relief Medicine, Santen FX Neo Eye Drops. A large flagship outlet of the famous drugstore chain located in a bustling area of Shinjuku, featuring fully stocked shelves. Beyond traditional household medicines, its highlight is the private label line \u0027matsukiyo,\u0027 which offers exceptional value and high-quality cosmetics and daily skincare, loved by locals.", "name": "Matsumoto Kiyoshi Shinjuku Sanchome", "transport": "About a 1-minute walk from Tokyo Metro Shinjuku-sanchome Station Exit B5"}, {"address": "2F, Lumine Shinjuku 2, 3-38-2 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Dead Sea Body Scrub, 3-in-1 Head Scrub, Silky Body Milk. A beloved bath and body fragrance boutique inside Lumine 2 featuring their iconic Water Well experience area. Attentive staff offer hands-on trial services; the resulting silky smooth skin and soothing scents fascinate countless women, making it a top choice in Shinjuku for buying refined gifts or indulging oneself.", "name": "SABON Shinjuku Lumine 2", "transport": "Directly connected to JR Shinjuku Station South Exit"}, {"address": "2F, Shinjuku Mylord, 1-1-3 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Pok\u00e9mon Collaboration Pressed Powder, Limited Edition Character Eyeliner, Specialty Repair Lip Balm. A lifestyle trend store combining trendy Japanese cosmetics with cute lifestyle goods. It is best known for its exclusive cross-over character cosmetics (e.g., Pok\u00e9mon, Disney), attracting crowds of young Japanese girls eager to add these limited-edition packaging items to their collections.", "name": "IT\u0027S DEMO Shinjuku Mylord", "transport": "Directly connected to JR Shinjuku Station South Exit"}, {"address": "3-5-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.0 stars | Must-Buy List: S-SELECT Deep Hydrating Mask, DHC Lip Cream, LION Restoria Cooling Leg Sheets. A comprehensive everyday pharmacy that Japanese locals rely on heavily. Compared to typical tourist-centric shops, it offers a more spacious, comfortably lit environment with wide aisles. Its affordable private label \u0027S-SELECT\u0027 cosmetics and health supplements make it a great spot to hunt for practical local beauty and wellness treasures.", "name": "Sugi Pharmacy Shinjuku 3-chome", "transport": "About a 1-minute walk from Tokyo Metro Shinjuku-sanchome Station Exit E4"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "3-32-6 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.4 stars | Must-buy list: BEAMS JAPAN Mt. Fuji logo tote bag, Aichi Prefecture orange Maneki-neko (lucky cat), traditional Japanese pattern Haori jacket. This six-story flagship store is a haven where Japanese street culture seamlessly merges with local traditional craftsmanship. The ground floor showcases regional artisanal crafts and souvenirs from across Japan, while higher floors feature exclusive designer collaborations, apparel, shoes, and bags. Highly praised by local fashion enthusiasts, this location allows you to purchase exquisitely tailored Japanese clothing while immersing yourself in authentic Japanese craft aesthetics.", "name": "BEAMS JAPAN Shinjuku Flagship Store", "transport": "About a 3-minute walk from JR Shinjuku Station Southeast Exit, or a 1-minute walk from Tokyo Metro Shinjuku-sanchome Station Exit A5"}, {"address": "3-22-11 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.1 stars | Must-buy list: Exclusive atmos collaboration Nike sneakers, atmos logo hoodies, street-style thick-soled athletic socks. As a leader in Japanese sneaker culture, the atmos Shinjuku flagship brings together limited-edition sneakers and Japan-exclusive colorways from top global brands. The store frequently collaborates with major brands to launch highly collectible sneakers loved by Tokyo fashionistas and sneakerheads alike, making it a must-visit destination for anyone looking to snag cutting-edge Japanese street-style footwear and accessories.", "name": "atmos Shinjuku Flagship Store", "transport": "About a 2-minute walk from JR Shinjuku Station East Exit"}, {"address": "4F LUMINE EST Shinjuku, 3-38-1 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: Needles classic side double-stripe track pants, CULLNI geometric-cut shirts, STUDIOUS Made-in-Japan minimalist wool coats. Operating under the philosophy of \u0027From Japan to the World,\u0027 STUDIOUS curates high-quality apparel strictly designed and made in Japan by 100% domestic designer brands. The interior exudes minimalist modernity, while the stylish staff provide impeccable, professional styling advice. It is a secret shopping hot spot for locals seeking superior tailoring and distinctive design.", "name": "STUDIOUS Shinjuku", "transport": "Directly connected to JR Shinjuku Station Central East Exit or East Exit (inside LUMINE EST)"}, {"address": "3-17-5 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.3 stars | Must-buy list: MEXICO 66 classic yellow-and-black leather retro sneakers, NIPPON MADE handcrafted leather footwear series, embroidered large tote bag. This flagship location boasts a remarkably comprehensive selection of shoes and apparel. In particular, the \u0027NIPPON MADE\u0027 series showcases top-tier Japanese leather craft, hand-dyed and stitched by master artisans for incomparable texture. Both locals and international visitors love the brand for its retro aesthetic combined with exceptional everyday comfort.", "name": "Onitsuka Tiger Shinjuku East Flagship Store", "transport": "About a 3-minute walk from JR Shinjuku Station East Exit, or direct access from Exit B7 of Tokyo Metro Shinjuku-sanchome Station"}, {"address": "3-30-15 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: American retro heavyweight workwear jackets, FREAK\u0027S STORE embroidered logo sweatshirts, outdoor waterproof functional crossbody bags. Specializing in American casual and vintage workwear aesthetics, this store blends utilitarian functionality with refined Japanese tailoring. Tokyo\u0027s youth love its signature oversized silhouettes and high-value in-house line. With a diverse array of shoes, bags, and accessories, it\u2019s an ideal stop for anyone building an effortlessly cool daily wardrobe.", "name": "FREAK\u0027S STORE Shinjuku", "transport": "About a 3-minute walk from JR Shinjuku Station Southeast Exit"}, {"address": "3-32-8 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: Pre-owned Comme des Gar\u00e7ons avant-garde jackets, vintage Issey Miyake pleated bags, Yohji Yamamoto textured wide-leg trousers. RAGTAG is one of Japan\u0027s premier pre-loved designer fashion boutiques, where all items undergo rigorous authentication and professional cleaning. Here, you can hunt down mint-condition pieces from top Japanese designer labels alongside vintage shoes and bags at incredibly reasonable prices, making it a favorite treasure-hunting spot for local fashion insiders.", "name": "RAGTAG Shinjuku", "transport": "About a 3-minute walk from JR Shinjuku Station Southeast Exit"}, {"address": "4F LUMINE 2, 3-38-2 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.2 stars | Must-buy list: UNITED ARROWS tailored blazers, BEAUTY\u0026YOUTH minimalist genuine leather shoulder bags, ultra-soft cashmere-blend knitwear. As a benchmark brand among Japanese high-end select shops, UNITED ARROWS strikes a perfect balance between refined business attire and smart-casual wear with sophisticated elegance. Local professionals favor its proprietary line for its high-grade fabrics and timeless cuts, while the store also features a handpicked selection of domestic designer shoes and elegant bags.", "name": "UNITED ARROWS Shinjuku", "transport": "Directly connected to JR Shinjuku Station South Exit (inside LUMINE 2)"}, {"address": "3F Flags, 3-37-1 Shinjuku, Shinjuku City, Tokyo", "feature": "\u2b50 4.5 stars | Must-buy list: Potential premium waterproof nylon backpacks, Link colorful patchwork multi-functional backpacks, Density lightweight water-repellent crossbody bags. Founded in Osaka in 1994, master-piece (MSPC) is a top-tier Japanese bag brand featuring handcrafted products made from high-tenacity nylon and premium leather in its own factory. Combining peak functionality, clever storage solutions, and sleek Japanese urban street design, these bags are widely praised by Tokyo commuters and outdoor enthusiasts for their unmatched durability and style.", "name": "master-piece Shinjuku Flags", "transport": "Directly connected to JR Shinjuku Station Southeast Exit (inside Flags Building)"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "NEWoMan 2F, Inside JR Shinjuku Station Gates, 4-1-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: Butter Financiers, Butter Shortbread, Butter Tart. This super-popular butter specialty shop has sparked massive queues in Tokyo Station and Shinjuku in recent years. Using fermented Swiss butter and French Gu\u00e9rande sea salt, their legendary \u0027Butter Financier\u0027 boasts a crispy exterior and moist interior, bursting with rich hazelnut and sweet butter aromas with every bite. Packaged with a charming British butler design, it\u0027s elegant, iconic, and the top choice for gifts.", "name": "Butter Butler NEWoMan Shinjuku", "transport": "Directly accessible inside the Shin-Minami (New South) Exit gates of JR Shinjuku Station"}, {"address": "3-1-22 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Soy Sauce Mugwort Dango, Matcha Red Bean Dango, Seasonal Strawberry Dango. A historic traditional Japanese wagashi shop operating since the Edo period, making it one of Shinjuku\u0027s most iconic historic establishments. Their rice dumplings (dango) are freshly made every day, delightfully chewy with a subtle rice aroma. Offering dozens of savory and sweet flavors in charming vintage packaging, this centuries-old tradition is beloved by both tourists and long-time local residents.", "name": "Oiwake Dango Honpo Shinjuku Main Store", "transport": "1-minute walk from Exit C1 of Tokyo Metro Shinjuku-sanchome Station"}, {"address": "5-16-11 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 stars | Must-Buy List: Moist Amanatto (Nure-Amanatto), Hanazono Manju, Kuzumochi. Founded in 1834, this prestigious sweet shop takes its name from the nearby Hanazono Shrine. Its flagship product, \u0027Moist Amanatto\u0027, uses premium Dainagon red beans prepared with a unique method that retains their moist texture and glossy sheen without being overly sweet. Infusing traditional confectionery with refined aesthetics, it\u0027s a premium souvenir representing Shinjuku\u0027s rich history.", "name": "Hanazono Manju Shinjuku Main Store", "transport": "3-minute walk from Exit E2 of Tokyo Metro Shinjuku-sanchome Station"}, {"address": "3-26-11 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 stars | Must-Buy List: Fruit Chocolate Balls, Melon Sandwich Cookies, Fruit Jellies. Established in 1885, this legendary fruit establishment is famous for selling luxury fruits alongside fruity snacks and desserts that are top targets for visitors. Their colorful \u0027Fruit Chocolate Balls\u0027 are infused with concentrated juices like peach, melon, and grape, while the melon cookies burst with rich aroma\u2014an unmissable local gift brand in Shinjuku.", "name": "Shinjuku Takano Main Store", "transport": "1-minute walk from the East Exit of JR Shinjuku Station"}, {"address": "B1F Shinjuku Nakamuraya Building, 3-26-13 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Double Caramel Sandwich Cookies, Caramel Pudding, Caramel Pound Cake. A modern caramel dessert brand launched by the historic Shinjuku Nakamuraya. Featuring golden caramel cooked to perfection wrapped inside crispy cookies, every bite releases a rich, gooey caramel filling with a delicious bittersweet complexity. Highly stylish packaging with trendy illustrations makes it a huge favorite among young women and office workers.", "name": "CARAMEL MONDAY Shinjuku Nakamuraya", "transport": "2-minute walk from JR Shinjuku Station East Exit; directly connected to Exit A6 of Shinjuku-sanchome Station"}, {"address": "NEWoMan Shinjuku 2F, 4-1-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 stars | Must-Buy List: An Paste (Sweet Red Bean Spread), An Paste Sandwich Cookies, Yokan Gift Sets. A stylish modern concept store by Toraya, the 500-year-old traditional confectioner that served the Imperial Court. Transforming traditional sweet red bean paste into smooth spreads enhanced with brown sugar or Bourbon vanilla, it pairs divinely with toast or scones. Minimalist, artistic packaging gives this centuries-old brand a fresh, hip appeal.", "name": "TORAYA AN STAND NEWoMan Shinjuku", "transport": "NEWoMan 2F, outside the Shin-Minami (New South) Exit gates of JR Shinjuku Station"}, {"address": "1-14-5 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.6 stars | Must-Buy List: Special Gateau au Chocolat, Nama Chocolate Treats. Awarded #1 in Japan\u0027s Tabelog Sweets Awards and dubbed \u0027Japan\u0027s Best Chocolate Cake\u0027. Made entirely without flour, using only high-grade Valrhona chocolate, unsalted butter, and fresh eggs. Enjoy it chilled for a rich nama-chocolate texture, at room temperature for a soft crumble, or warm in the microwave for a molten center. Offering three distinct sensory experiences, it\u0027s an ultimate dream treat for chocolate lovers visiting Shinjuku.", "name": "KEN\u0027S CAFE TOKYO Shinjuku Main Store", "transport": "3-minute walk from Exit 2 of Shinjuku-gyoenmae Station on the Tokyo Metro Marunouchi Line"}, {"address": "LUMINE Est Shinjuku B1F, 3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 stars | Must-Buy List: Butter Caramel Sandwich Cookies, Uji Matcha Butter Cookies, Strawberry Butter Cookies. A world-renowned sandwich cookie specialty shop using a unique pressing method to craft a crisp, sturdy outer waffle shell filled with butter cream and rich butter caramel. Crisp outside, soft inside, and never greasy. Featuring sleek industrial-style packaging and store-exclusive limited flavors, it\u0027s a top-tier souvenir to grab in Shinjuku.", "name": "PRESS BUTTER SAND LUMINE Est Shinjuku", "transport": "Directly connected to the East Exit gates of JR Shinjuku Station (LUMINE Est B1F)"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-14-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.6 Stars | Must-Buy List: PRESS BUTTER SAND Caramel Butter Cookies, Shiseido Premium Skincare Series, apparel from emerging Japanese designer brands. As a flagship department store that sets Tokyo\u0027s trends in fashion and gastronomy, its basement food hall gathers exquisite desserts and authentic souvenirs from across Japan. The upper floors feature numerous high-end local fashion brands and exclusive items, making it a must-visit destination to experience refined Japanese shopping culture.", "name": "Isetan Shinjuku Main Store", "transport": "Direct access from Exits B3/B4/B5 of Shinjuku-sanchome Station on the Tokyo Metro"}, {"address": "5-24-2 Sendagaya, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.4 Stars | Must-Buy List: AUDREY Strawberry Cream Dessert Gift Box, Toraya Yokan, BAREFOOT DREAMS quality loungewear. A landmark department store complex adjacent to Shinjuku Station\u0027s South Exit. Beyond the traditional, long-established Takashimaya, it houses many local Japanese craft brands and high-end Japanese curations. The top-floor restaurant avenue even offers distant views of Shinjuku Gyoen\u0027s lush greenery.", "name": "Takashimaya Times Square", "transport": "About a 2-minute walk from the NEW SOUTH Gate of JR Shinjuku Station"}, {"address": "3-38-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: moussy classic slim-fit denim, SNIDEL sweet dresses, HARBS Fresh Fruit Mille Crepe. Directly connected to the East Exit of Shinjuku Station, this mall is a trendsetter for young women\u0027s fashion in Tokyo. It houses countless original Japanese streetwear brands, unique accessories, and Japanese cosmetics shops, offering diverse styles at affordable prices.", "name": "Lumine Est Shinjuku", "transport": "Direct access from the East Exit of JR Shinjuku Station"}, {"address": "3-32-6 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.5 Stars | Must-Buy List: BEAMS Mt. Fuji collaboration merchandise, Shigaraki ware painted raccoon dog figurines, handcrafted apparel featuring traditional Japanese techniques. The entire building is dedicated to promoting local Japanese culture and traditional craftsmanship. From folk arts and regional confectionery on the first floor to independent Japanese designer wear and an art gallery on higher floors, it is the ultimate spot for authentic Japanese-style souvenirs.", "name": "BEAMS JAPAN Shinjuku Flagship Store", "transport": "About a 3-minute walk from the South Exit of JR Shinjuku Station / About a 1-minute walk from Exit A1 of Shinjuku-sanchome Station on the Tokyo Metro"}, {"address": "3-1-1 Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.6 Stars | Must-Buy List: PILOT extra-fine fountain pens, Tombow dual-brush pen sets, Japan-exclusive art and stationery gift boxes. Hailed as the ultimate sanctuary for stationery and art supplies in Japan, this entire building boasts an exceptionally complete range of professional art materials, quality Japanese stationery, and paper crafts. With prices often heavily discounted compared to standard stores, it is an iconic local shop stationery lovers cannot miss in Shinjuku.", "name": "Sekaido Shinjuku Main Store", "transport": "About a 1-minute walk from Exits C1/C4 of Shinjuku-sanchome Station on the Tokyo Metro"}, {"address": "1-2-2 Kabukicho Underground Mall, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.1 Stars | Must-Buy List: Japanese handmade leather women\u0027s shoes, exquisite Japanese hair accessories, affordable pure cotton women\u0027s innerwear. A massive underground shopping center in Shinjuku connecting the East Exit and Kabukicho. It shelters numerous local Tokyo independent boutiques, general merchandise shops, and cosmetics stores, allowing shoppers to hunt for high-value local Japanese products out of the weather.", "name": "Shinjuku Subnade", "transport": "Direct access from Seibu-Shinjuku Station / About a 3-minute walk from the East Exit of JR Shinjuku Station"}, {"address": "1-1-4 Nishi-Shinjuku, Shinjuku-ku, Tokyo", "feature": "\u2b50 4.2 Stars | Must-Buy List: Gateau Festa Harada Rusk, premium Japanese cotton handkerchiefs, traditional senbei (rice cracker) gift sets from long-established shops. A department store rich in local Shinjuku history, renowned for its attentive service and regular nationwide Ekiben (railway bento) fairs. The food hall and lifestyle sections are filled with quality-focused, practical Japanese brands, making it ideal for picking up authentic Japanese gifts for friends and family.", "name": "Keio Department Store Shinjuku", "transport": "Direct access from the West Exit of JR Shinjuku Station / Direct access from Keio Line Shinjuku Station"}, {"address": "1-600 Minami-Osawa, Hachioji-shi, Tokyo", "feature": "\u2b50 4.3 Stars | Must-Buy List: BEAMS Outlet discounted men\u0027s and women\u0027s wear, UNITED ARROWS classic coats, mont-bell outdoor windbreakers. Directly accessible in just about 40 minutes via the Keio Line Express from Shinjuku Station. Designed with a European aesthetic, this outlet mall features popular Japanese select shops and international brand outlets offering year-round discounts of 30% to 70% off, making it the most convenient outlet shopping destination from Shinjuku.", "name": "Mitsui Outlet Park Tama Minami-Osawa", "transport": "Take the Keio Sagamihara Line directly from Shinjuku Station to \u0027Minami-Osawa Station\u0027, about a 2-minute walk after exiting"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Shinjuku"}};
        const cityName = "Tokyo";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">

    </footer>
