", "feature": "\u2b50 4.5 stars | Must-Buy List: Ginseng Radiance Essence, Herbal Sunscreen, Dendrobium Hydrating Mask. Boasting over 200 years of history, the heritage TCM brand Tong Han Chun Tang has recently expanded into herbal cosmeceuticals, blending traditional Chinese medicine with modern biotechnology. Combining traditional botanicals with modern dermatology, its gentle, nourishing skincare line features premium ingredients like ginseng and dendrobium, attracting fans of TCM wellness and beauty.", "name": "Tong Han Chun Tang", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 2), walk for about 3 minutes."}, {"address": "1F, No. 1 Department Store Center, No. 800 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Tai Chi Dual-Action Mask, Silky Brightening Mask, Freeze-Dried Freshness Ampoule. Herborist, a renowned modern herbal skincare brand under Shanghai Jahwa, has a dedicated counter in No. 1 Department Store. Guided by the holistic TCM philosophy of Tai Chi balance, its famous Tai Chi Mask features a dual-step care concept\u2014black mud to purify and white mud to nourish\u2014deeply cleansing pores while brightening the complexion. It is an outstanding homegrown brand that successfully introduced Chinese medicine beauty concepts globally.", "name": "Herborist", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 19), walk for about 2 minutes."}, {"address": "B1 Floor, Henderson Celebrity Shopping Center, No. 300 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Florasis Loose Powder, Perfect Diary Animal Eye Shadow Palette, Judydoll Mono Eyeshadow. THE COLORIST is a wildly popular beauty multi-brand store in China, featuring a vibrant, rainbow-like wall of affordable makeup and housing dozens of trending domestic C-beauty brands. With a fully open-testing layout, customers can shop viral brands like Florasis, Perfect Diary, and Judydoll all in one place\u2014making it a must-visit destination for youth and tourists eager to experience emerging C-beauty trends.", "name": "THE COLORIST", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 2) for direct access."}], "name": "Iconic Local Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "No. 409 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Time-honored genuine leather men\u0027s shoes, comfortable non-slip women\u0027s shoes, vintage handmade leather shoes. Located in the East Nanjing Road commercial district, Shanghai First Shoe City is a shopping memory shared by generations of locals. Bringing together numerous local legacy brands and affordable footwear, it is known for durable quality, great comfort, and exceptional value for money\u2014making it a fantastic spot to hunt for high-value shoes and experience classic Shanghai shopping charm.", "name": "Shanghai First Shoe City", "transport": "About a 3-minute walk from Exit 1 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "Lobby of Peace Hotel, No. 20 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Modern Chinese silk qipao, Shanghai-style embroidered handbags, luxury cashmere scarves. Located inside the iconic Peace Hotel on the Bund, this landmark brand perfectly merges traditional Shanghai culture with modern high-end fashion. Featuring exquisite Chinese-inspired clothing and high-quality leather bags filled with Oriental charm, it is immensely popular among local socialites and international visitors seeking unique quality and Haipai luxury.", "name": "SHANGHAI TANG - Peace Hotel Store", "transport": "About a 5-minute walk from Exit 7 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "No. 600 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Shanghai-style bespoke tailored suits, premium wool coats, exquisite silk ties. Founded in 1928, Baramon is Shanghai\u0027s most iconic heritage bespoke tailoring brand, celebrated for exquisite craftsmanship and flattering cuts. The suits and coats here embody the elegance and sophistication of old Shanghai, making it the top choice for local gentlemen seeking formalwear and high-end outerwear.", "name": "Baramon Tailor - Nanjing Road Store", "transport": "About a 4-minute walk from Exit 4 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "No. 353 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-Buy List: 100% pure wool sweaters, premium silk thermal underwear, cashmere scarves. Hengyuanxiang is a household centennial wool and apparel brand in Shanghai, nationwide famous for high-quality wool fabrics and superb warmth. The East Nanjing Road branch displays the latest wool sweaters and knitwear, loved by local shoppers who prioritize material quality and tactile comfort.", "name": "Hengyuanxiang - Nanjing East Road Store", "transport": "About a 2-minute walk from Exit 1 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "No. 558 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Modern tailored silk qipao, lace tops with handmade frog buttons, Shanghai embroidered shawls. Muller Qipao is a renowned local qipao specialty boutique in Shanghai, blending traditional Chinese tailoring with modern fashion elements for elegant, figure-flattering styles. Whether for formal banquets or stylish daily wear, it\u0027s a must-visit store for women who adore vintage Shanghai romance.", "name": "Muller Qipao - Nanjing East Road Store", "transport": "About a 5-minute walk from Exit 4 of East Nanjing Road Station (Metro Line 2)"}, {"address": "No. 168 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic Shaolin Kung Fu green-label canvas sneakers, high-top white collab sneakers, Guochao retro casual shoes. Feiyue is a classic homegrown sneaker brand originating from Shanghai that has taken the global fashion world by storm with its retro Guochao (China-chic) aesthetic. The East Nanjing Road store offers the most complete selection of classic white sneakers and trendy collaborations. Lightweight, comfortable, and full of vintage indie vibe, they are a must-buy iconic footwear item when visiting Shanghai.", "name": "Feiyue Shoes - Nanjing East Road Store", "transport": "About a 3-minute walk from Exit 2 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "No. 299 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: WB-1 classic red-and-white retro basketball shoes, Guochao canvas skate shoes, vintage printed casual shoes. Founded in Shanghai, Warrior Shoes is China\u0027s most legendary local rubber footwear brand, representing youth memories across generations of Shanghai residents. The flagship store boasts a rich lineup of retro models and contemporary trendy sneakers. Its excellent value for money and strong nostalgia draw crowds of young shoppers.", "name": "Warrior Shoes - Nanjing East Road Flagship", "transport": "About a 2-minute walk from Exit 3 of East Nanjing Road Station (Metro Line 2 or 10)"}, {"address": "No. 479 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Mulberry silk printed long scarves, retro Shanghai-style leather handbags, double-sided embroidered cashmere shawls. Shanghai Story is an immensely popular local fashion accessory brand specializing in premium silk scarves, shawls, and distinctive bags. Blending Shanghai artistic motifs with fine fabrics, its products boast elegant colors and rich textures, making it the top choice for local gifting or tourists seeking memorable Shanghai souvenirs.", "name": "Shanghai Story - Nanjing East Road Store", "transport": "About a 4-minute walk from Exit 1 of East Nanjing Road Station (Metro Line 2)"}], "name": "Popular Local Apparel, Shoes \u0026 Bags"}, "cat_3": {"items": [{"address": "No. 28 Huanghe Road, Huangpu District, Shanghai (Next to Park Hotel)", "feature": "\u2b50 4.7 Stars | Must-Buy: Original Butterfly Pastry (Palmier), Cheese Sticks, Almond Slices. Located near People\u0027s Square, this century-old bakery attached to the Park Hotel is famous for what is hailed as the \u0027No. 1 Palmier in Shanghai.\u0027 Featuring distinctly delicate layers, rich milky aroma, and an extraordinarily crisp texture, long queues form daily\u2014making it the ultimate souvenir choice for classic Shanghai-style Western pastry lovers.", "name": "Park Hotel Bakery", "transport": "Metro Lines 1/2/8, People\u0027s Square Station, Exit 8, approx. 3 mins walk"}, {"address": "No. 636 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy: Salted Egg Yolk \u0026 Pork Floss Green Rice Ball (Qingtuan), Strip Cake (Tiaotou Gao), Crab Shell Pastry (Xiekehuang). Established during the Guangxu reign, this iconic Shanghai time-honored brand is renowned for its glutinous rice pastries. The Strip Cake features a soft, chewy texture filled with smooth, perfectly sweetened red bean paste, while its seasonal Qingtuan draws crowds queuing for hours in spring. Perfect for both gifting and personal enjoyment.", "name": "Shen Da Cheng", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 4, approx. 5 mins walk"}, {"address": "No. 392 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy: Freshly Baked Fresh Pork Mooncakes, Taikang Yellow Label Worcestershire Sauce (Shanghai Spicy Soy Sauce), Dried Goods. A classic food store on East Nanjing Road Pedestrian Street, famous above all for its hot, freshly baked pork mooncakes with thin crusts, generous savory fillings, and rich juices. Additionally, Shanghai\u0027s unique spicy Worcestershire sauce sold here makes a fantastic souvenir representing local culinary heritage.", "name": "Taikang Food Store", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 1, approx. 2 mins walk"}, {"address": "No. 720 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy: White Rabbit Candy Gift Sets, Chenghuangmiao Five-Spice Beans, Shanghai Pear Syrup Candy. A multi-story food department store showcasing top-quality local specialties from Shanghai and across China. It houses a flagship White Rabbit Candy counter offering limited-edition flavors and nostalgic gift boxes\u2014a must-visit sanctuary for one-stop Shanghai souvenir shopping.", "name": "Shanghai First Food Store", "transport": "Metro Lines 1/2/8, People\u0027s Square Station, Exit 19, approx. 5 mins walk"}, {"address": "No. 630 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Must-Buy: Seaweed Crispy Biscuits (Taitiao Bing), Seaweed Peanuts, Jinhua Ham Blocks. Founded in 1870, this historic store specializes in specialty dry goods and traditional Shanghai pastries. Their signature Seaweed Crispy Biscuits blend seaweed powder and sesame oil, offering a unique aroma and a sweet-and-savory crumbly texture\u2014the perfect old-Shanghai souvenir.", "name": "Sanyang South Food Store", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 4, approx. 4 mins walk"}, {"address": "No. 414 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Must-Buy: Wine-Marinated Mud Snails, Yellow Mud Snail Gift Sets, Drunken Crab. Established in 1852, this iconic Shanghai brand is renowned worldwide for its liquor-marinated (\u0027Zao Zui\u0027) delicacies. Their drunken mud snails and crabs use a secret lees marinade recipe, delivering tender meat with rich aromatic wine flavor. Well-packaged for easy transport, they are premier local heritage gifts.", "name": "Shao Wan Sheng", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 1, approx. 3 mins walk"}, {"address": "No. 126 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy: Almond Slices, Walnut Slices, Mini Palmiers. Beloved by local Shanghainese, this Western bakery blends the essence of Russian and traditional Shanghai pastry baking. The signature Almond Slice features a crispy base topped with fragrant sliced almonds and caramel\u2014delightfully sweet without being greasy, rich in buttery flavor, and beautifully layered.", "name": "Harbin Food Factory", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 7, approx. 4 mins walk"}, {"address": "No. 136 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | Must-Buy: Shanghai Lady Vanishing Cream, Vintage Solid Perfume, Classic Hand Cream. Located near Nanjing Road Pedestrian Street and The Bund, this cultural souvenir shop draws design inspiration from 1930s Shanghai modern socialites. The iconic vanishing cream is highly moisturizing, packaged in rich retro vintage style, affordable, and full of sentimental souvenir value.", "name": "Shanghai Modern Lady", "transport": "Metro Lines 2/10, East Nanjing Road Station, Exit 7, approx. 3 mins walk"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 830 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Bee \u0026 Flower Sandalwood Soap, Shanghai Vanishing Cream, Taikang Yellow Brand Distiller\u0027s Grain Oil. A historic landmark department store located at the starting point of East Nanjing Road, formerly known as the famous \u0027Daxin Company\u0027. Upgraded and renovated, it merges retro nostalgia with modern shopping, featuring numerous heritage domestic brands and local afternoon teas. It is the premier spot to experience Old Shanghai\u0027s commercial heritage and shop for local nostalgic souvenirs.", "name": "Shanghai First Department Store", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, Exit 19, then walk for about 2 minutes."}, {"address": "No. 720 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: White Rabbit Milk Candies, Shen Da Cheng Sweet Green Rice Balls, Xing Hua Lou Red Bean Paste Mooncakes. Shanghai\u0027s most prestigious food department store, offering the most comprehensive selection of time-honored pastries, specialty dried fruits, and classic souvenirs from Shanghai and the Jiangnan region. Constantly bustling with crowds, both local Shanghainese and tourists flock here specifically to buy authentic delicacies.", "name": "Shanghai First Food Hall", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, Exit 19, then walk along the East Nanjing Road Pedestrian Street for about 5 minutes."}, {"address": "No. 2-68 West Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy List: White Rabbit crossover creative merchandise, premium Shanghai silk scarves, Wang Yu Tai green tea gift boxes. A mega-complex department store situated at the heart of People\u0027s Square commercial district, featuring a famous indoor climbing wall and an aquarium. Beyond international fashion brands, it boasts dedicated zones for traditional domestic goods and classic time-honored counters, offering both shopping and entertainment.", "name": "Shanghai New World City", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, Exit 19 for direct access."}, {"address": "No. 228 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: ALBION Skin Conditioner Sets, Cl\u00e9 de Peau Beaut\u00e9 luxury skincare products, Shiseido limited-edition gift sets. A high-end department store near The Bund, featuring an iconic spiral escalator and a massive light-transmitting atrium. It gathers Shanghai\u0027s most complete selection of top international beauty/skincare counters and luxury brands, providing an exclusive and comfortable fine shopping environment.", "name": "Shanghai New World Daimaru", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, Exit 7 for direct access."}, {"address": "No. 635 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Must-Buy List: Xie Fu Chun Pressed Duck Egg Face Powder, retro Shanghai Brand watches, early Republican-style silk Cheongsams. One of Shanghai\u0027s top four time-honored department stores founded in 1918, boasting rich European classical architecture. The interior preserves the opulent atmosphere of Old Shanghai, specializing in high-quality local silk products, classic vintage cosmetics, and unique cultural artworks.", "name": "Yongan Department Store", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, Exit 4, then walk for about 3 minutes."}, {"address": "1st Floor, Hongyi International Plaza, No. 299 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy List: Designer beauty travel samples, HARMAY limited-edition tote bags, unique domestic niche perfumes. A new-retail local brand seamlessly blending industrial warehouse aesthetics with multi-brand beauty retail, located in the heart of East Nanjing Road Pedestrian Street. Selling luxury international beauty samples and travel sizes at heavily discounted prices, it is hugely popular among younger generations and budget-conscious tourists.", "name": "HARMAY Shanghai (East Nanjing Road Flagship Store)", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, Exit 3, then walk for about 1 minute."}, {"address": "No. 1192 Huazhou Road, Zhuqiao Town, Pudong New District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Coach iconic monogram designer bags, discounted past-season Prada women\u0027s shoes, Armani sample business suits. Shanghai\u0027s premier Italian-style mega outlet, offering an immersive Italian town streetscape. Featuring hundreds of top-tier international luxury brands and trendy sportswear, it offers year-round discounts of 30% to 70% off, making it an absolute bargain paradise for luxury shopping during your visit to Shanghai.", "name": "Florentia Village Shanghai Luxury Designer Outlet", "transport": "Take Metro Line 2 to \u0027Yuandong Avenue Station\u0027, Exit 2, then transfer to the free shuttle bus or a taxi for about 5 minutes."}, {"address": "No. 2888 Huqingping Highway, Qingpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Burberry classic trench coats, Michael Kors leather goods, discounted limited-edition Nike running shoes. As Shanghai\u0027s most iconic domestic flagship outlet complex, it boasts a spacious garden-style shopping environment. Covering outlet stores for major international luxury brands and quality domestic labels with massive discounts, it is the top choice for locals and tourists hunting for incredible deals.", "name": "Bailian Qingpu Outlets", "transport": "Take Metro Line 17 to \u0027Jiasong Middle Road Station\u0027, then transfer to a bus or taxi for about 8 minutes upon exiting."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "The Bund, Nanjing Road and People\u0027s Square"}, "disney": {"categories": {"cat_1": {"items": [{"address": "Lakeside Boulevard, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Marie Dalgar Guochao Palette, Sephora Disney Limited Edition Face Masks, Chando Time Frozen Essence Lotion. Located in the heart of Disneytown, this store features top international beauty brands alongside a dedicated premium C-beauty section. Blending into the magical Disney atmosphere with exclusive interactive experiences, it is the ultimate destination for purchasing quality local beauty items and international limited-edition collabs.", "name": "Sephora (Disneytown Store)", "transport": "Take Metro Line 11 to Disney Resort Station, Exit 1, and walk about 6 minutes."}, {"address": "Marketplace Riverside Area, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: Knight Gold Tube Lipstick, Cool Black Quick-Dry Liquid Eyeliner, 9-Color Eyeshadow Palette. Founded in Shanghai, this pioneering makeup brand is renowned for its innovative packaging and incredible value. The Disneytown location boasts an artistic, futuristic interior design and offers custom color matching services, making it a favorite among young women and tourists alike.", "name": "Marie Dalgar (Disneytown Store)", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 8 minutes into Disneytown."}, {"address": "Broadway Plaza, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: Toummer Solid Perfume, HARMAY In-House Beauty Tool Set, Yangshengtang Natural Vitamin E Mask. A giant among China\u0027s new generation of warehouse-style multi-brand beauty stores, featuring a bold industrial chic aesthetic. The Disneytown store aggregates countless emerging local beauty brands and niche fragrances, offering a hassle-free, self-directed shopping experience\u2014a true paradise for cosmetics lovers.", "name": "HARMAY (Disneytown Concept Store)", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 5 minutes to Disneytown Plaza."}, {"address": "Entrance of Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.9 stars | Must-Buys: Disney Magical Lip Balm, LinaBell Scented Hand Cream Set, Mickey Limited Edition Hydrating Mist. As part of Asia\u0027s largest official Disney store, this cosmetics section exclusively offers Shanghai Disney Resort limited-edition beauty and skincare products. Every item incorporates Shanghai local motifs and popular character designs, combining practical everyday use with high collectible value.", "name": "World of Disney Store Cosmetics Section", "transport": "Take Metro Line 11 to Disney Resort Station, Exit 1, and walk about 3 minutes."}, {"address": "Marketplace Area, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buys: San Shenghua Face Mask Gift Box, Youth Activating Anti-Wrinkle Serum, Classic Blue Tin Moisturizing Cream. Originating in Shanghai in 1931, Pechoin is a classic heritage skincare brand carrying a century of local beauty wisdom. This experience boutique blends vintage Shanghai aesthetics with modern skincare technology, offering gentle, hydrating products full of Oriental charm\u2014the perfect local gift for friends and elders.", "name": "Pechoin (Disneytown Experience Boutique)", "transport": "Take Metro Line 11 to Disney Resort Station and walk about 7 minutes."}, {"address": "Spice Alley, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Taiji Day \u0026 Night Essence, New Seven-Herb Whitening Mask, Purifying Facial Cleanser. Born in Shanghai, Herborist is a high-end herbal skincare brand combining ancient Chinese beauty remedies with modern biotechnology. The shop features an elegant traditional atmosphere, offering on-site skin analysis and professional herbal skincare consultations. Its gentle, natural products are adored by skincare-conscious travelers.", "name": "Herborist (Disneytown Shop)", "transport": "Take Metro Line 11 to Disney Resort Station, Exit 4, and walk about 8 minutes."}, {"address": "Inside Sephora Counter, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: Fairy Peach Blossom Loose Powder, Floral Engraving Lipstick, Silk Pressed Powder. A mega-popular local brand built on the philosophy of \u0027Eastern Makeup Nurtured by Flowers.\u0027 The counter displays exquisite Eastern aesthetics, integrating traditional Chinese engraving art into cosmetics. Featuring silky textures and elegant packaging, it is a must-visit beauty counter showcasing signature Oriental flair.", "name": "Florasis (Disneytown Counter)", "transport": "Take Metro Line 11 to Disney Resort Station and walk about 6 minutes into Disneytown."}, {"address": "Surrounding Commercial Area, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buys: Explorer 12-Color Animal Eyeshadow Palette, Bionic Film Essence Lipstick, Read-Me Velvet Lip Stain. One of China\u0027s most iconic emerging beauty brands, its Disneytown shop features a full-spectrum makeup testing area and exclusive trial stations. Known for delivering high-end quality at accessible prices, its vibrant colors and chic packaging make it a top shopping choice for young travelers.", "name": "Perfect Diary (Disneytown Shop)", "transport": "Take Metro Line 11 to Disney Resort Station and walk about 9 minutes."}], "name": "Local Iconic Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "Inside Disneytown, Shanghai Disney Resort, Chuansha New Town, Pudong New District, Shanghai", "feature": "\u2b50 4.8 stars | Must-buys: Shanghai-exclusive vintage Qipao-style Mickey embroidered jacket, custom Disney Hanfu collection apparel, and Disneytown limited-edition leather backpacks. Located in the heart of Disneytown, this massive store features exclusive apparel, shoes, and bags blending local Haipai style with traditional Chinese elements. It is wildly popular among both locals and tourists who love Guochao (China-chic) trends and Disney culture.", "name": "World of Disney Store", "transport": "Metro Line 11 Disney Resort Station, Exit 1, approx. 5-min walk"}, {"address": "No. 115 Hupan Road, Disneytown, Pudong New District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buys: Disney collaboration Mickey pearl brooch, vintage mini leather crossbody bag, and Guochao-style silk scarf bowties. A renowned emerging designer brand in China, HEFANG extends elegant jewelry aesthetics to fashion accessories and bags. With romantic, designer interiors, it is a favorite hotspot for local young women seeking refined light-luxury accessories, bags, and shoes.", "name": "HEFANG Jewelry Disneytown Boutique", "transport": "Metro Line 11 Disney Resort Station, Exit 4, approx. 8-min walk"}, {"address": "Phase 1, Bicester Village Shanghai, No. 88 Shendi East Road, Pudong New District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buys: Modernized floral Qipao dresses, Guochao dragon embroidered canvas bags, and vintage frog-button platform sneakers. An iconic local designer brand representing New Orientalism and Guochao style. Featuring bold colors, striking Chinese traditional motifs, and modern cuts across its apparel and accessories, it is a must-visit for fashion lovers seeking a truly unique look.", "name": "MUKZIN (Bicester Village Shanghai)", "transport": "Take Metro Line 11 to Disney Resort Station, then transfer to the Resort Shuttle Bus to Bicester Village Shanghai"}, {"address": "Inside Bicester Village Shanghai, No. 88 Shendi East Road, Pudong New District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buys: Chic Shanghai-tailored Tweed jackets, handcrafted jacquard genuine leather handbags, and vintage leather Mary Jane shoes. A well-known high-fashion womenswear brand born in Shanghai, DAZZLE is renowned for premium fabrics and exquisite local tailoring. The boutique offers a sophisticated selection of apparel, shoes, and bags that perfectly capture modern urban elegance and individuality.", "name": "DAZZLE (Bicester Village Shanghai)", "transport": "Take Metro Line 11 to Disney Resort Station, then transfer to the Resort Shuttle Bus to Bicester Village Shanghai"}, {"address": "Inside Bicester Village Shanghai, No. 88 Shendi East Road, Pudong New District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buys: Minimalist relaxed linen maxidresses, original pleated leather tote bags, and soft-soled solid s i Disneyland, walk straight down Mickey Avenue for about 2 minutes."}, {"address": "Mickey Avenue, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Must-Buy List: StellaLou Purple Sweet Potato Cookie Box, Enchanted Storybook Castle Limited Tea \u0026 Snack Gift Box, Classic Disney Character Egg Rolls. As the park\u0027s largest department store, Avenue M Arcade offers an extensive selection of apparel, merchandise, and a vast souvenir snack area. It highlights beautifully packaged Shanghai Disney-exclusive pastries and premium tea gifts, perfectly blending classic Disney elements with exquisite treats.", "name": "Avenue M Arcade", "transport": "Located prominently along the main thoroughfare of Mickey Avenue after entering Shanghai Disneyland."}, {"address": "Zootopia Land, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.9 Stars | Must-Buy List: Paw-shaped Popsicle Gummies, Officer Clawhauser Donut-shaped Cookies, Zootopia Limited Edition Lollipops. Located in the newly opened Zootopia land, this store faithfully recreates the whimsical Elephant Ice Cream Parlor from the movie. Offering treats inspired by the film, its exclusive Paw-shaped Popsicle Gummies and delicate donut cookies are currently the hottest must-buy souvenirs in the park.", "name": "Zootopia Jumbo-Pops \u0026 Treats Retail", "transport": "After entering Shanghai Disneyland, walk into the Zootopia themed land."}, {"address": "Lakeside Boulevard, Disneytown, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Heritage White Rabbit Cream Candy x Disney Co-branded Box, Shen Da Cheng Haipai Pastries Co-branded Set, Traditional Shanghai Butterfly Pastries. A unique local shop combining heritage Shanghai culinary brands with Disney culture. Here, you can find authentic traditional Shanghai snacks and specialty souvenirs, such as Disney-themed White Rabbit candy packages and classic Shanghai pastries\u2014perfect for travelers looki h year-round discounts. Many brand boutiques sell official Disney co-branded products and international snacks, making it the premier destination for post-park shopping sprees.", "name": "Florentia Village Shanghai Outlet", "transport": "About a 15-minute taxi ride from Shanghai Disney Resort, or take the direct free outlet shuttle bus."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 88 Shendi East Road, Nanhui New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Discounted Coach handbags, ERDOS pure cashmere scarves, Armani tailored suits. Located by the lake near Shanghai Disneyland, this European-style luxury outlet gathers over 200 international and premium Chinese designer brands, offering incredible discounts starting as low as 70% off. Featuring artistic architecture blending lake views and mountain scenery, it\u0027s a premier shopping and dining destination after visiting Disney.", "name": "Bicester Village Shanghai", "transport": "Exit from Exit 4 of Disney Resort Station (Metro Line 11), take the Resort Shuttle Bus or walk for about 15 minutes."}, {"address": "Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buy List: LinaBell plush toys, Shanghai Disney exclusive Shanghai-style Mickey headbands, Resort exclusive collector pins. Located in the heart of Disneytown, this is one of the largest Disney theme stores in Asia. Designed with a circular vintage railway and magic workshop theme, it offers the most comprehensive selection of Disney character merchandise and Shanghai-exclusive cultural souvenirs.", "name": "World of Disney Store", "transport": "Exit from Exit 1 or 2 of Disney Resort Station (Metro Line 11), walk about 5 minutes to enter Disneytown."}, {"address": "Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Shanghai Skyline architecture sets, LEGO Disney  originating from Shanghai, Herborist combines traditional herbal formulations with modern skincare science. The store design seamlessly blends Oriental Zen and modern minimalism into the Former French Concession streetscape. Its facial mud masks and TCM hydrating series are immensely popular among customers looking for natural ingredients.", "name": "Herborist (Huaihai Concept Store)", "transport": "About a 5-minute walk from Exit 1 of Middle Huaihai Road Station (Metro Line 13)"}, {"address": "No. 201 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Gravity-Defying Anti-Wrinkle Eye Cream, Smile Firming Serum, Anti-Glycation Hydrating Mask. A rising high-tech anti-aging skincare brand from Shanghai, specifically developed for Asian skin characteristics. Its flagship store on Anfu Road resembles a futuristic tech art gallery, where customers can experience personalized skin analysis and purchase acclaimed eye creams and anti-aging skincare.", "name": "UNISKIN (Anfu Road Flagship Store)", "transport": "About a 12-minute walk from Exit 7 of Jiaotong University Station (Metro Lines 10/11)"}, {"address": "No. 671 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Must-Buy List: Natural Ultra-Fine Pearl Powder, Herbal Soothing Balm, Ginseng Wellness Tea Bags. Founded during the Qing Dynasty, this heritage Traditional Chinese Medicine (TCM) pharmacy features a charming flagship store in the Former French Concession on Middle Huaihai Road. Beyond raw herbs, it offers affordable, ancient-formula skincare products like high-purity pearl powder and soothing balms, making it an insider top pick for authentic Chinese herbal cosmetics and skincare.", "name": "Lei Yun Shang Pharmacy (Huaihai Branch)", "transport": "About a 4-minute walk from Exit 1 of Middle Huaihai Road Station (Metro Line 13)"}], "name": "Iconic Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "No. 184 Fumin Road, Jing\u0027an ooden tones and natural stone into a chic modern design. Offering international luxury quality at accessible prices, it is perfect for savvy fashion lovers seeking unique, high-quality bags that stand out.", "name": "Songmont Anfu Road Boutique", "transport": "Metro Line 10 or 11, Chiao Tung University Station, Exit 7, approx. 9 mins walk"}, {"address": "No. 290 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Striped knit vests, color-blocked tote bags, vintage pleated skirts. Founded by a local Shanghai designer, Short Sentence is a women\u0027s fashion label advocating simple, comfortable, and playful daily wear. Its Anfu Road store sparkles with vivid colors. The iconic colorful striped shopper tote and structured knitwear are street-style favorites, perfectly capturing the romantic yet effortless urban vibe of the Former French Concession.", "name": "Short Sentence Anfu Road Boutique", "transport": "Metro Line 10 or 11, Chiao Tung University Station, Exit 7, approx. 10 mins walk"}, {"address": "No. 804 Julu Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Geometric print canvas totes, eco-friendly lightweight jackets, original wide-leg casual trousers. ZUCZUG is a pioneer among Shanghai\u0027s independent designer brands, celebrated for its playful humor, eco-conscious philosophy, and relaxed lifestyle. The lush, green Julu Road concept store offers apparel and lifestyle goods from its various sub-labels. With comfortable, clean cuts, it is highly praised by stylish locals who love chic indie design and natural living.", "name": "ZUCZUG Julu Road Concept Store", "transport": "Metro Line 2 or 7, Jing\u0027an Temple Station, Exit 8, approx. 10 mins walk"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Boutiques"}, "cat_3": {"items": [{"address": "No. 613 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Almond Slices, Palmiers (Butterfly Pastries), Peanut Button Biscuits. Originating in 1936, this time-honored bakery represents classic Shanghainese-Western fusion cuisine on Middle Huaihai Road in the Former French Concession. Local Shanghainese queue for hours just for freshly baked almond slices. Rich in milky flavor, crisp and non-sticky, these almond slices\u2014along with their flaky, heavenly palmiers\u2014are the best souvenirs showcasing vintage Shanghainese pastry heritage.", "name": "Harbin Food Factory", "transport": "Metro Line 13, Middle Huaihai Road Station, Exit 1, about a 5-minute walk"}, {"address": "No. 202 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Tuberose Vanishing Cream, Classic Solid Perfume, Essential Oil Vintage Handmade Soap. A local skincare brand soaked in vintage Old Shanghai charm, with a store atmosphere recalling 1930s Shanghai socialites. The vanishing cream is rich yet non-greasy with a subtle floral scent. Adorned with beautiful retro poster-girl illustrations, it\u0027s affordable, iconic, and one of the most popular gift choices for women.", "name": "Shanghai Lady Cosmetics", "transport": "Metro Lines 10/11, Jiaotong University Station, Exit 7, about an 8-minute walk"}, {"address": "1F, TX Huaihai, No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Original Milk Candy Retro Gift Box, White Rabbit Hand Cream, Red Bean Milk Candy. White Rabbit Cream Candy is Shanghai\u0027s most famous local candy brand, cherished by generations. Located in the Huaihai Road shopping district, this concept flagship store offers hundreds of unique candy flavors and limited-edition tins, along with trendy crossover merchandise like hand creams, canvas bags, and plush toys\u2014making for fun and collectible gifts.", "name": "White Rabbit Candy Store", "transport": "Metro Line 13, Middle Huaihai Road Station, Exit 1, about a 3-minute walk"}, {"address": "No. 270 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Red \u0026 Blue Stripe White Sneakers, Wukang Road Limited Canvas Shoes, Vintage High-Top Streetwear Sneakers. Born in Shanghai in the 1950s, Feiyue is a classic rubber shoe brand reborn through modern retro trends. Its boutique in the French Concession carries a wide variety of styles and limited graffiti prints. Lightweight, durable, super affordable, and oozing vintage hip vibes, it is a trendy must-buy item in Shanghai.", "name": "Feiyue Sneaker Store", "transport": "Metro Lines 1/7, Changshu Road Station, Exit 8, about a 10-minute walk"}, {"address": "No. 1008 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-Buy List: Chicken Biscuits (Ji Zai Bing), Seaweed Peanuts, Bite-Sized Shortbread (Yi Kou Su). A century-old Shanghainese bakery brand, Lao Xiang Zhai is renowned for delicate craftsmanship and unique flavors. The signature chicken biscuit is crispy outside, soft inside, with a sweet-and-savory blend. The seaweed peanuts combine savory Zhoushan seaweed with crunchy peanuts, perfectly embodying Shanghai\u0027s beloved savory-sweet palate.", "name": "Lao Xiang Zhai", "transport": "Metro Lines 1/10/12, South Shaanxi Road Station, Exit 4, about a 2-minute walk"}, {"address": "No. 439 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Hand-Painted Plane Tree Leaf Ceramic Plates, Shanghai Impression Scented Candles, Hand-Embroidered Linen Placemats. Situated in the heart of the Former French Concession, this independent design boutique is a collaboration between French designers and local artists. Blending Shanghai elegance with iconic local plane tree leaf motifs, it offers exquisite ceramics and home decor\u2014perfect for travelers seeking stylish, romantic souvenirs with French Concession charm.", "name": "Platane Lifestyle Store", "transport": "Metro Lines 10/11, Jiaotong University Station, Exit 7, about a 9-minute walk"}, {"address": "No. 1028 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Freshly Baked Savory Pork Mooncakes, Taikang Jinhua Ham, Yan Du Xian Flavored Biscuits. A classic specialty food shop on Middle Huaihai Road, famous for its freshly baked savory pork mooncakes. Even outside Mid-Autumn Festival, long queues form outside. The mooncakes feature flaky layered crusts with juicy, savory meat filling. The store also offers beautifully packaged traditional Shanghainese dried fruits and local delicacies.", "name": "Taikang Food Company", "transport": "Metro Lines 1/10/12, South Shaanxi Road Station, Exit 1, about a 3-minute walk"}, {"address": "No. 400 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Pear Syrup Candy, Chenghuang Temple Spiced Beans, Gaoqiao Flaky Cakes. This historic food emporium gathers Shanghai\u0027s most comprehensive selection of local specialties and traditional snacks. It is a one-stop destination for iconic traditional souvenirs, such as cough-soothing century-old pear syrup candies, savory spiced beans, and melt-in-your-mouth Gaoqiao cakes.", "name": "Shanghai First Food Hall", "transport": "Metro Line 13, South Huangpi Road Station, Exit 2, about a 4-minute walk"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 308 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: HARMAY in-house fragrance \u0026 body care sets, sample travel sets from major brands, and local independent designer face masks. Located in the heart of Anfu Road, this warehouse-style beauty select shop is converted from an old factory structure, seamlessly blending industrial wasteland aesthetics with luxury beauty. Designed like a massive warehouse assembly line, the store displays an extraordinarily rich collection of high-end international counter brand samples and trending Chinese indie beauty brands. Tourists can not only snag trial samples at unbeatable prices but also experience a sleek, futuristic shopping space. It stands as one of the most iconic social media landmarks and go-to beauty shopping spots in the Shanghai French Concession in recent years.", "name": "HARMAY (Anfu Road Flagship Store)", "transport": "Take Metro Line 10 or 11 to Jiaotong University Station (Exit 7), then walk for about 10 minutes."}, {"address": "No. 184 Fumin Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Local designer graphic tees, exclusive collaboration canvas bags, and handcrafted wool sweaters. LABELHOOD is the premier pioneer select shop promoting contemporary Chinese independent designers, transforming an old Shanghai garden villa into a multi-layered fashion showcase. Curating creations from dozens of top Chinese indie designers, it offers everything from sharply tailored apparel to distinctive accessories. Exuding a sophisticated yet rebellious artistic vibe unique to the Former French Concession, it is an absolute sanctuary for fashion lovers seeking unique local original designs that guarantee no awkward outfit overlaps.", "name": "LABELHOOD (Fumin Road Flagship Store)", "transport": "Take Metro Line 2 or 7 to Jing\u0027an Temple Station (Exit 8), then walk for about 8 minutes."}, {"address": "Lane 104, No. 322 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Osmanthus Oolong home fragrance series, vintage Shanghai-style silk pajamas, and artistic floral gift boxes. Born in Shanghai, THE BEAST evolved from an online flower shop into China\u0027s premier artistic lifestyle brand. This flagship store on Anfu Road brings the romantic charm of the French Concession to life, featuring four-season floral displays alongside exquisite fragrances, sleepwear, home decor, and tableware. Travelers love purchasing their signature solid perfumes and scented candles infused with vintage Shanghai artistic charm; with their sleek, design-forward packaging, they make high-quality, authentic local souvenirs.", "name": "THE BEAST (Anfu Road Flagship Store)", "transport": "Take Metro Line 10 or 11 to Jiaotong University Station (Exit 7), then walk for about 10 minutes."}, {"address": "No. 6, Lane 845 Julu Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Emerging Chinese designer jewelry, unique independent brand handbags, and limited-edition collab silk scarves. DONGLIANG is one of China\u0027s earliest pioneer select buyer shops dedicated to promoting local independent fashion designers, tucked away in an elegant complex of old lane houses on Julu Road. The store displays feel like a meticulously curated art exhibition, featuring acclaimed works from internationally recognized Chinese designers like Uma Wang. Among the dappled shadows of plane trees and classic villa surroundings, shoppers can browse local luxury clothing and accessories that combine deep cultural storytelling with avant-garde tailoring.", "name": "DONGLIANG (Julu Road Concept Store)", "transport": "Take Metro Line 2 or 7 to Jing\u0027an Temple Station (Exit 9), then walk for about 12 minutes."}, {"address": "No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Shanghai limited-edition designer vinyl figures, local streetwear hoodies, and crossover art merchandise. TX Huaihai is the most talked-about curatorial retail venue near Shanghai\u0027s Former French Concession, seamlessly blending contemporary art exhibitions with trendy shopping. Breaking away from traditional department store models, each floor hosts local streetwear brands, trendy art galleries, and independent cafes. Frequently featuring pop-up stores and exclusive streetwear drops, it is the top treasure-hunting spot for young travelers into street culture, fashion, and contemporary art.", "name": "TX Huaihai Youth Energy Center", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 999 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Limited-edition international luxury bags, niche salon perfumes, and gourmet bakery gift boxes. Situated in the heart of Middle Huaihai Road commercial area, iapm Mall is a premier luxury landmark and late-night shopping destination in the Former French Concession. Featuring futuristic architectural lighting and design, it houses top-tier international luxury houses like Prada, Gucci, and Alexander McQueen alongside high-end boutique select shops. With late operating hours and a rich array of Michelin-starred dining and upscale dessert shops, it offers an exceptional haven for travelers pursuing top-tier quality and an ultimate shopping experience.", "name": "iapm Mall", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station (Exit 2), which connects directly to the mall basement."}, {"address": "No. 300 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Art merchandise \u0026 design accessories, fragrance \u0026 skincare products, and exquisite creative souvenirs. Located on the eastern section of Huaihai Road, Shanghai K11 is an iconic luxury mall that perfectly integrates art, people, and nature. The basement houses a grand contemporary art museum that hosts world-class exhibitions, while lush greenery and art installations fill the mall interior. Bringing together indie designer beauty brands, creative gift shops, and premium fashion, it is ideal for travelers who love browsing curated select stores and buying unique lifestyle goods in an elegant, artistic ambiance.", "name": "K11 Art Mall Shanghai", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), which connects directly to the mall."}, {"address": "No. 633 Huazhou Road, Zhuqiao Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic Gucci leather bags up to 70% off, Moncler end-of-season discounted down jackets, and Coach exclusive tote bags. As Shanghai\u0027s most recommended major luxury outlet, this shopping village faithfully recreates classic Italian Renaissance town architecture complete with open-air plazas, arcades, and fountains. Gathering over 300 top international luxury and athletic brands (such as Gucci, Prada, Saint Laurent, etc.), it offers incredible year-round discounts ranging from 50% to 80% off. It is an absolute must-visit destination for dedicated designer shopping and amazing deals following a tour of the French Concession.", "name": "Florentia Village Shanghai Luxury Designer Outlet", "transport": "From the French Concession, take Metro Line 2 to Yuandong Avenue Station (Exit 2), then transfer to the free shuttle bus for about 5 minutes."}], "name": "Major Department Stores \u0026 Top Outlets"}}, "name": "Shanghai French Concession"}, "lujiazui": {"categories": {"cat_1": {"items": [{"address": "5F, Super Brand Mall, 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic Vanishing Cream, Tuberose Solid Perfume, Magnolia Hand Cream. Shanghai Woman is a well-known local legacy skincare brand imbued with vintage Old Shanghai charm. Filled with a 1930s Shanghai-style retro-modern vibe, its signature vanishing cream comes in traditional tin containers featuring vintage illustrations of elegant ladies in qipao. Highly moisturizing with a delicate floral fragrance, it serves as an iconic and memorable authentic Shanghai souvenir.", "name": "Shanghai Woman", "transport": "Metro Line 2 or 14, Lujiazui Station, Exit 6, approx. 5-minute walk"}, {"address": "LG2, Shanghai IFC Mall, 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Yurong Cream, Rose Liquid Powder, Night in Shanghai Vintage Perfume Series. Established in 1898, Shanghai Vive is a premier luxury brand representing high-end Shanghai beauty, having won a gold medal at the 1915 Panama-Pacific International Exposition in San Francisco. The boutique boasts an elegant, upscale interior featuring skincare and fragrances that blend East and West. The flagship Yurong Cream has a rich, velvety texture with exceptional anti-aging and moisturizing benefits, embodying the refined lifestyle of Old Shanghai socialites.", "name": "Shanghai Vive", "transport": "Metro Line 2 or 14, Lujiazui Station, Exit 6 (direct connection to IFC Mall basement levels)"}, {"address": "1F, L+Mall, 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Fairy Peach Blossom Loose Powder, Engraved Floral Lipstick, Floral Nourishing Silk Compact Powder. Florasis is a sensationally popular C-beauty brand celebrated for its traditional Oriental aesthetic. The store design seamlessly blends classic Chinese garden style with contemporary fashion. Famous for its delicate micro-engraving craft, the lipsticks feature intricate relief carvings of historical paintings or traditional flora and fauna. With a lightweight and smooth formula, their products double as collectible art pieces and practical daily cosmetics.", "name": "Florasis (Lujiazui Experience Store)", "transport": "Metro Line 2, Dongchang Road Station, Exit 3, or direct access from Metro Line 14, Pudong South Road Station"}, {"address": "B1, L+Mall, 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Explorer 12-Color Eyeshadow Palette, Bionic Film Essence Lipstick, ReadMe Velvet Lip Stain. As a leader among next-gen domestic makeup brands, Perfect Diary is immensely popular among Gen Z and millennials. The Lujiazui location features a spacious hands-on beauty section with professional vanity mirrors. Renowned for creative crossover collaborations and great value, its animal-themed eyeshadow palettes offer high color payoff and finely milled textures, making it a top spot to experience modern C-beauty trends.", "name": "Perfect Diary", "transport": "Metro Line 2, Dongchang Road Station, Exit 3, or direct access from Metro Line 14, Pudong South Road Station"}, {"address": "1F, Super Brand Mall, 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buy List: Luxury Caviar Mask, Luminous Cream Foundation, Highlight Cream. Founded by China\u0027s national-treasure makeup artist Mao Geping, this high-end brand offers luxury cosmetics and skincare. Counter beauty advisors provide professional makeup consultations tailored to facial structure and light sculpting. His signature foundation creams and highlighters create flawless, contoured Eastern beauty aesthetics, while the Caviar Mask is a bestselling star item for premium skin restoration.", "name": "MAOGEPING", "transport": "Metro Line 2 or 14, Lujiazui Station, Exit 6, approx. 5-minute walk"}, {"address": "1F, L+Mall, 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Travel-size samples of prestige international brands, To Summer niche Eastern scents, HARMAY house-brand Soapberry bath \u0026 body set. HARMAY is a viral industrial-style beauty multi-brand store that takes warehouse aesthetics to the next level. Featuring steel conveyor-belt display racks, it not only stocks mini luxury travel samples but also spotlights niche Chinese indie beauty and fragrance labels, offering a fun and exploratory shopping experience.", "name": "HARMAY (L+Mall Branch)", "transport": "Metro Line 2, Dongchang Road Station, Exit 3, or direct access from Metro Line 14, Pudong South Road Station"}, {"address": "B1, Super Brand Mall, 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Rhodiola Brightening Essence, Quadruple Silk Hydrating Mask, Gentian Soothing \u0026 Repairing Freeze-Dried Mask. INOHERB is a Shanghai-born herbal skincare brand focusing on traditional Chinese medicine (TCM) botanical skincare technology. Formulated with authentic herbal ingredients, its flagship Rhodiola Essence targets oxidation and dull skin with a gentle, fast-absorbing texture\u2014highly favored by consumers who value clean ingredients and traditional holistic skin care philosophies.", "name": "INOHERB", "transport": "Metro Line 2 or 14, Lujiazui Station, Exit 6, approx. 5-minute walk"}, {"address": "B2, Super Brand Mall, 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | Must-Buy List: Watsons Bird\u0027s Nest Illuminating Mask, Collagen Nourishing Hand Cream, Heated Steam Eye Masks. Located inside Super Brand Mall, this Watsons store is an extremely convenient beauty and health retail chain. In addition to imported Japanese and Korean cosmetics, it features a dedicated section for trendy Chinese beauty brands as well as budget-friendly house brands. The long-time bestselling Bird\u0027s Nest Mask and Collagen series are top picks for hydration and nourishment\u2014perfect for grabbing daily skincare essentials on the go.", "name": "Watsons (Super Brand Mall)", "transport": "Metro Line 2 or 14, Lujiazui Station, Exit 6, approx. 5-minute walk"}], "name": "Iconic Local Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "Level 2, Shanghai IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buy List: Lan Yue Series Leather \u0026 Bamboo Woven Bag, Seamless Cashmere Felt Capes, Oriental Aesthetic Printed Silk Scarves. A high-fashion luxury brand co-created by Chinese designer Jiang Qiong\u0027er and the Herm\u00e8s Group, focusing on integrating traditional Chinese crafts such as bamboo weaving, Kesi silk tapestry, and ceramics into modern apparel and handbags. Located in the IFC Mall in Lujiazui, the store features an Oriental Zen and modern minimalist vibe. Its iconic Lan Yue bag combines delicate bamboo weaving with top-grade calfskin, making it a favorite among fashion lovers seeking unique taste and cultural heritage.", "name": "SHANG XIA", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), and walk for about 2 minutes directly into IFC Mall."}, {"address": "Level 3, Shanghai IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Undyed Cashmere Coats, Un-dyed Mulberry Silk Shirts, Minimalist Plant-Dyed Leather Totes. A local premium eco-fashion brand founded in Shanghai that emphasizes natural raw materials and sustainable fashion. Most garments use undyed wool, organic cotton, and top-tier silk without excessive chemical dyeing, delivering an exceptionally natural and comfortable feel. Its cleanly tailored cashmere coats and commuter bags come highly recommended by female white-collar professionals in Shanghai\u0027s Lujiazui financial district.", "name": "ICICLE", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), connected directly to IFC Mall via the pedestrian passageway."}, {"address": "4th Floor, Lujiazui Center L+Mall, No. 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Barely Zero Cloud Underwear, French Silk Loungewear, Lace-up Ballet Yoga Pants. A renowned local lifestyle and intimate apparel brand founded in Shanghai that advocates comfort, naturalness, and self-expression. The Lujiazui L+Mall store features a spacious, bright experience space displaying ultra-soft loungewear, high-quality activewear, and underwear. Its patented Barely Zero (Cloud) series bra and luxurious silk loungewear are loved by local women, making it a hit local brand combining quality and design.", "name": "NEIWAI", "transport": "Take Metro Line 2 or Line 9 to Dongchang Road Station (Exit 3), or Metro Line 14 to Pudong South Road Station with direct access to L+Mall."}, {"address": "3rd Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Asymmetric Draped Dresses, Designer Wool-Blend Coats, Patchwork Canvas Bags. One of China\u0027s most iconic independent designer womenswear brands, renowned for its natural, relaxed, and artistic design language. The Super Brand Mall store displays the latest seasonal original apparel, shoes, and bags, excelling in natural cotton/linen fabrics and asymmetrical cuts to create a unique Oriental artistic chic style\u2014perfect for shoppers who want distinctive, personalized fashion.", "name": "JNBY", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 2), and walk about 5 minutes to Super Brand Mall."}, {"address": "3rd Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-Embroidered Vintage Dresses, Sequined Cropped Knitwear, Tweed Jacquard Shoulder Bags. A premium local fashion womenswear brand born in Shanghai, famous for intricate handmade details, rich tailoring, and modern color combinations. Blending romanticism with contemporary street style, the Super Brand Mall store frequently launches Shanghai-exclusive and collaboration pieces. Its hand-embroidered clothing and exquisite chain bags are hot items among local fashionistas.", "name": "DAZZLE", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 2), and walk about 5 minutes."}, {"address": "3rd Floor, Lujiazui Center L+Mall, No. 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: High-Waisted Wide-Leg Wool Trousers, Silk Tie-Neck Shirts, Vintage Square-Toe Leather Shoes. A highly sought-after high-end womenswear brand among urban Chinese women, emphasizing a \u0027Gentlewoman\u0027 style that seamlessly blends tailored masculinity with feminine elegance. The Lujiazui L+Mall store features a minimalist industrial decor. Its suits, silk pieces, and versatile leather shoes strike the perfect balance between sharp lines and sophistication\u2014a must-visit shop for Shanghai career women looking to elevate their professional wardrobe.", "name": "Edition", "transport": "Take Metro Line 2 or Line 9 to Dongchang Road Station, or Line 14 to Pudong South Road Station, and access L+Mall directly via the subway connector."}, {"address": "2nd Floor, Lujiazui Center L+Mall, No. 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: 3D Tailored Silk Dresses, Double-Faced Cashmere Oversized Coats, Minimalist Geometric Leather Totes. One of China\u0027s premier high-end fashion brands, known for noble, elegant designs and rigorous fabric selection. The store in the Lujiazui commercial area resembles a modern art museum. The apparel boasts smooth lines and exquisite craftsmanship, paired with sophisticated geometric leather bags and shoes, exuding an aura of mature elegance and confidence favored by high-spending clientele.", "name": "Marisfrolg", "transport": "Take Metro Line 14 to Pudong South Road Station (Exit 2), with direct entry to Lujiazui Center L+Mall."}, {"address": "4th Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: British Retro Ankle Boots, Soft Lambskin Pointed-Toe Stilettos, French Metallic Buckle Chain Bags. A fashion footwear and handbag brand beloved by Asian women, celebrated for combining trendy designs with outstanding wearing comfort. The Super Brand Mall boutique offers a wide range of work and casual footwear. Its premium soft lambskin and ergonomic insoles are highly favored by office workers who stand or walk for long hours, making it easy to complete stylish daily outfits when paired with their chic bags.", "name": "STACCATO", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 2), and walk about 5 minutes to Super Brand Mall."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "5F, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Strip Rice Cake with Red Bean (Tiaotou Gao), Sweet Green Rice Balls (Qingtuan), Crab Shell Pastry (Xieke Huang). Founded in 1875, Shen Da Cheng is a household centuries-old traditional rice pastry shop in Shanghai. Its Lujiazui branch is located inside the bustling Super Brand Mall, drawing crowds of tourists and old Shanghainese alike. The Tiaotou Gao features soft, fragrant glutinous rice wrapped around smooth, dense red bean paste\u2014soft and chewy without sticking to teeth. The Qingtuan boasts a fresh mugwort aroma with rich fillings. They offer individually wrapped gift boxes, perfect for bringing home to share authentic Shanghainese traditional pastry flavors with family and friends.", "name": "Shen Da Cheng (Super Brand Mall)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk for about 5 minutes."}, {"address": "B1, Shanghai Tower, No. 158 Huayuanshiqiao Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buy List: Shanghai Tower landmark-shaped chocolates, Shanghainese Qipao Snow Cake gift set, 3D skyscraper wooden puzzles. Located inside the Shanghai Tower\u2014China\u0027s tallest building\u2014this official flagship store specializes in exquisite souvenirs featuring Shanghai\u0027s contemporary landmark aesthetics and rich local culture. The store\u0027s spacious, modern design seamlessly merges traditional Shanghai elements with high-tech landmark vibes. Here, tourists can pick up exclusive landmark-shaped crafts and limited-edition gourmet gift sets with premium packaging, making it the top choice for souvenirs representing modern Shanghai.", "name": "Shanghai Gifts Flagship Store at Shanghai Tower", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 9), then walk about 6 minutes through the underground pedestrian passage."}, {"address": "5F, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Butterfly Pastries (Palmiers), White Rabbit Cream Candy series, Seaweed Peanuts. First Foodhall is a hub for traditional Shanghai treats and specialties. The branch in Super Brand Mall gathers famous local specialties and traditional snacks from across Shanghai. The crowd favorite is undoubtedly the freshly baked handmade butterfly pastries, featuring flaky layers and a rich buttery aroma. Additionally, it offers a remarkably complete selection of White Rabbit candy products\u2014from original milk flavor to matcha and red bean\u2014making it a one-stop shop for unique Shanghai snacks.", "name": "First Foodhall (Super Brand Mall)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk for about 5 minutes."}, {"address": "Ground Floor Hall (Zero Meter Hall), Oriental Pearl Radio \u0026 TV Tower, No. 1 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Modern Shanghai Vanishing Cream, classic vintage solid perfume, Shanghai-style hand cream. Located on the ground level of the Oriental Pearl Tower, the Shanghai Woman shop brims with nostalgic 1930s Shanghai glamour. The store\u0027s iconic product is vanishing cream packaged in tin cans decorated with vintage portraits of old Shanghai socialites; it is moisturizing, non-greasy, and infused with classic floral scents. Affordable and packaged in collectible retro tins, it makes an iconic gift for women visiting Lujiazui and the Oriental Pearl Tower.", "name": "Shanghai Woman Souvenir Shop (Oriental Pearl Tower)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 1), then walk for about 3 minutes."}, {"address": "B2, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Rose Red Bean Paste Mooncakes, Cantonese Chicken Biscuits (Jizai Bing), Chestnut Paste Cake. Founded in 1851, Xing Hua Lou is one of Shanghai\u0027s most representative heritage Cantonese restaurants and traditional pastry brands. This counter in Super Brand Mall offers beautifully packaged Shanghainese-style Chinese pastries. They are famous for their signature red bean paste, which is smooth, delicate, and pleasantly sweet without being cloying. A hugely popular queue-worthy spot during Mid-Autumn Festival, its year-round small-packaged pastries and specialty biscuits make wonderful teatime gifts for visitors to take home.", "name": "Xing Hua Lou (Super Brand Mall)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk for about 5 minutes."}, {"address": "4F, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Silk printed scarves, vintage solid perfume gift boxes, embroidered handkerchiefs. Shanghai Story is a homegrown cultural brand deeply rooted in Shanghai, seamlessly blending traditional silk craftsmanship with modern local fashion. Located in Super Brand Mall, this boutique displays a colorful array of silk scarves and elegant gifts featuring designs inspired by Shanghai architecture, magnolia blossoms, and old Shanghai charm. Beyond silk products, the store\u0027s specially crafted solid perfumes and fine embroidery pieces are widely popular among visitors seeking sophisticated souvenirs.", "name": "Shanghai Story (Super Brand Mall)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk for about 5 minutes."}, {"address": "5F, Lujiazui Center L+MALL, No. 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Jasmine tea gift box, Shanghai-style Longjing tea, tea-infused snack pastries. Established in 1880, Wang Yi Ji is a prestigious centuries-old tea house in Shanghai. Its branch in Lujiazui Center L+MALL combines traditional tea culture with a modern shopping ambiance, offering high-quality traditional teas. Their jasmine tea boasts a rich, lingering floral aroma, beautifully presented in elegant signature gift boxes\u2014making it an ideal refined Shanghai gift for elders or distinguished friends and relatives.", "name": "Wang Yi Ji Tea House (L+MALL)", "transport": "Take Metro Line 9 to Shangcheng Road Station (Exit 2), or Metro Line 2 to Dongchang Road Station (Exit 3), then walk for about 3 minutes."}, {"address": "B2, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Signature Egg Yolk Pastry, handmade pineapple cake, classic taro pastry. Tang Bakery is renowned for preserving traditional handmade Shanghai baking techniques, set within elegant retro Chinese-style decor. Located in the basement level of Super Brand Mall, this shop tempts passersby with the warm aroma of freshly baked goods. The signature egg yolk pastry features crisp, flaky layers with a rich, velvety salted egg yolk filling that balances sweet and savory notes perfectly. Exquisitely packaged in Chinese gift boxes, it reflects the refinement of Shanghai pastry-making and is a highly popular choice for traditional handmade pastry souvenirs in Lujiazui.", "name": "Tang Bakery (Super Brand Mall)", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk for about 5 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Must-Buy List: CHA LING luxury skincare sets, Lady M exclusive limited-edition Mille Cr\u00eapes, and commemorative merchandise from the Apple Store Pudong flagship. Located in the heart of Lujiazui, this premier luxury shopping center brings together top international brands and high-end dining. Featuring a strikingly modern glass crystal box design, it is one of Shanghai\u0027s premier fashion landmarks.", "name": "Shanghai IFC Mall", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station, and access the mall directly via the underground passage."}, {"address": "No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: To Summer (Guanxia) Oriental-scented candles, Saturnbird specialty cold brew coffee gift sets, and Shanghai Tang modern Haipai silk scarves. Situated on the banks of the Huangpu River, this classic mega-mall houses iconic local high-end designer brands and trendy \u0027Guochao\u0027 lifestyle stores, offering panoramic views of The Bund while you shop.", "name": "Super Brand Mall", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station (Exit 6), then walk about 300 meters."}, {"address": "52nd Floor, Shanghai Tower, No. 501 Yincheng Middle Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | Must-Buy List: 3D metal Shanghai skyline bookmarks, Duoyun signature handcrafted solid perfumes, and co-branded vintage stationery from heritage brands. Situated on the 52nd floor of Shanghai Tower, this sky-high commercial space dubbed the \u0027Department Store in the Clouds\u0027 seamlessly blends cultural merchandise, independent publications, and lifestyle goods designed by local Shanghai artists.", "name": "Duoyun Books Flagship Store", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station, then walk about 500 meters to Shanghai Tower."}, {"address": "No. 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: HARMAY beauty minis \u0026 niche local fragrances, THE BEAST artistic floral gift boxes, and Lao Feng Xiang modern \u0027Guochao\u0027 gold thread bracelets. Home to Galeries Lafayette, this mall combines viral local beauty boutiques with emerging designer brands, perfectly blending international haute couture with Shanghai\u0027s chic trendy vibe.", "name": "L+Mall Lujiazui", "transport": "Take Metro Line 9 directly to Shangcheng Road Station, or Metro Line 2 to Dongchang Road Station and walk for 5 minutes."}, {  List: Shen Da Cheng handmade sticky rice rolls gift sets, vintage Shanghai Watch mechanical watches, and Xie Fu Chun duck-egg face powder. This unique store presents traditional time-honored Shanghai brands wrapped in modern chic packaging, allowing visitors to enjoy one-stop shopping for authentic Shanghai craftsmanship and culinary heritage.", "name": "Shanghai IFC Heritage \u0026 Culture Store", "transport": "Take Metro Line 2 or Line 14 to Lujiazui Station, which directly connects to the IFC basement mall."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Lujiazui"}, "xintiandi-tianzifang": {"categories": {"cat_1": {"items": [{"address": "No. 24, Lane 210, Taikang Road, Tianzifang, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-buy list: Classic vanishing cream, vintage solid perfume, tuberose hand cream. Located in the alleyways of Tianzifang, this heritage Shanghai cosmetics shop is inspired by the glamour of 1930s Shanghai socialites. The signature vanishing cream is rich yet non-greasy, packaged in tin boxes featuring vintage poster girls\u2014a nostalgic and practical beauty souvenir.", "name": "Modern Lady (Tianzifang)", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), about a 3-minute walk."}, {"address": "1st Floor, South Block Xintiandi, Lane 123 Xingye Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: \u0027Kunlun Snow\u0027 Perfume, Nude Scent Hand Cream, Crystal Stone Diffuser Set. The flagship store of a premium Chinese fragrance brand set within a Shikumen building in Xintiandi. The space fuses traditional craftsmanship with modern minimalist aesthetic. Its scents feature iconic Eastern botanical notes like tea and pine-snow, making it a favorite among trendsetters and scent enthusiasts.", "name": "To Summer (Xintiandi Flagship)", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 6), about a 4-minute walk."}, {"address": "1st Floor, Xintiandi S ess": "1st Floor, Xintiandi Style II, No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Must-buy list: \u0027YIN CHAN\u0027 Eau de Parfum, Incense Cones, Scented Hand Cream. An avant-garde high-end Chinese fragrance brand with Zen aesthetics, renowned for its bold, tranquil black-themed interior at the Xintiandi boutique. Featuring high-concentration perfume oils and scents inspired by Eastern philosophy, its unique heavy-metal architectural bottles appeal to fragrance enthusiasts seeking distinctive, non-mainstream scents.", "name": "DOCUMENTS (Xintiandi Store)", "transport": "Directly connected to Exit 2 of Xintiandi Station on Metro Line 10 or 13."}, {"address": "No. 278 South Chongqing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-buy list: Herbal facial masks, Pearl nourishing cream, Traditional Chinese Medicine skincare oils. A famous state-owned traditional Chinese pharmacy with over 200 years of history, located near Tianzifang. Recently transformed to fuse traditional herbal wisdom with modern cosmetics, offering gentle herbal skincare products and balms that appeal to health-conscious consumers.", "name": "Tong Han Chun Tang (South Chongqing Rd Store)", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 4), about a 6-minute walk."}, {"address": "Main Street, Tianzifang, No. 200 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Must-buy list: Classic Tuberose Vanishing Cream, Magnolia Essential Oil Hand Cream, Retro Lip Balm. A well-established local Shanghai cosmetics souvenir shop, with its Tianzifang location exuding classic Haipai vintage charm. Made with traditional formulas that deeply moisturize dry skin, its unique floral scents and nostalgic tin packaging make it a quintessential local beauty souvenir.", "name": "Shanghai Woman Vanishing Cream (Tianzifang)", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), about a 4-minute walk."}], "name": "Local Iconic Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 127 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: Independent designer collaboration T-shirts, original canvas tote bags, niche leather accessories. LABELHOOD is a premier platform for contemporary Chinese independent designers. Located in Xintiandi, this flagship store gathers numerous top local brands. Featuring a sleek modern art aesthetic, it\u2019s a favorite spot for Shanghai fashion insiders and Fashion Week buyers, making it the top destination to explore China\u0027s original fashion scene.", "name": "LABELHOOD Flagship Store", "transport": "Take Metro Line 13 to Xintiandi Station (Exit 6), then walk for about 3 minutes."}, {"address": "Inside Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buys: Classic red and blue logo white sneakers, vintage high-top canvas shoes, Tianzifang-exclusive retro sneakers. Feiyue is Shanghai\u2019s most iconic heritage rubber-soled sneaker brand, radiating a nostalgic retro charm. The Tianzifang branch offers an extensive selection at budget-friendly prices. Lightweight and comfortable, these classic kicks are immensely popular among both locals and tourists\u2014a practical yet memorable wardrobe staple.", "name": "Feiyue Sneakers (Tianzifang Store)", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 410 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Handmade silk embroidered flats, Shanghai-style silk clutches, hand-embroidered house slippers. Founded near Tianzifang, this independent designer footwear boutique seamlessly blends traditional Chinese embroidery craft with modern silhouettes. Each pair features luxurious silk fabrics and intricate hand embroidery, exuding vintage Shanghai allure while offering comfortable wearability and collectible artistic value.", "name": "Suzhou Cobblers Boutique", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), then walk for about 7 minutes."}, {"address": "No. 159 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: Undyed natural cashmere coats, heavy silk shirts, eco-friendly organic cotton trousers. ICICLE is Shanghai\u2019s premier high-end sustainable fashion brand, advocating for natural fabrics and minimalist design. Set within traditional Shikumen architecture, its Xintiandi concept store radiates Zen elegance. Loved by Shanghai\u0027s urban elite who value luxury quality and sustainable fashion, their garments feature exquisite tailoring and ultra-comfortable textures.", "name": "ICICLE Xintiandi Concept Store", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 2), then walk for about 2 minutes."}, {"address": "Xintiandi South Block Plaza, Lane 123 Xingye Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buys: Playful retro graphic T-shirts, creative patchwork dresses, trendy color-block knitwear. UOOYAA is an edgy emerging local designer brand from Shanghai, celebrated for its humorous spirit, retro subculture vibes, and bold color schemes. With unconventional designs colliding traditional elements with street style, it\u2019s highly recommended for fashion-forward youth seeking standout statement pieces.", "name": "UOOYAA Xintiandi Store", "transport": "Take Metro Line 10 to Xintiandi Station (Exit 6), then walk for about 4 minutes."}, {"address": "Phase 1, Xintiandi Style, No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: 3D bow dresses, pearl-embellished leather handbags, retro Mary Jane shoes. Founded by two designers rooted in Shanghai, this globally acclaimed womenswear brand fuses sweet romanticism with edgy coolness. The sleek Xintiandi flagship deftly showcases structured garments, shoes, and bags detailed with signature bows and lace\u2014embodying
