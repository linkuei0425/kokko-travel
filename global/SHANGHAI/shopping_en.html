ation (Exit 1), walk about 3 minutes."}, {"address": "B2, Xintiandi Style II, No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buys: Egg Yolk Pastry Gift Box, Pineapple Cakes, Shanghai Story Gift Box. Tang Bing Jia is famous for handcrafted Chinese pastries, seamlessly blending traditional baking craftsmanship with modern Shanghai aesthetics. Their signature egg yolk pastries feature whole salted duck egg yolks and smooth bean paste inside flaky, layered crusts. Housed in exquisitely illustrated Shanghai-style gift boxes, they make premium gifts for elders or corporate partners.", "name": "Tang Bing Jia Xintiandi Style Store", "transport": "Direct access from Exit 3 of Xintiandi Station on Metro Line 10 or 13."}, {"address": "No. 21, Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buys: Hand-painted Silk Scarves, Retro Shanghai Shawls, Modernized Cheongsam Accessories. Shanghai Story is a celebrated local fashion and accessories brand renowned for exquisite silk craftsmanship and classic Shanghai elegance. Offering a variety of silk scarves and handkerchiefs adorned with traditional motifs, it\u0027s the ideal spot to pick up sophisticated, memorable gifts for women that embody the vintage charm and graceful romance of old Shanghai.", "name": "Shanghai Story Tianzifang Flagship Store", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), walk about 4 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: UMA WANG designer knitwear, Mukzin Guochao dresses, local independent brand accessories. Xintiandi Style serves as a cradle for emerging local Chinese designers, seamlessly blending modern architecture with classic Shikumen charm. Housing numerous Chinese independent designer labels and original boutique select shops, it is a refined shopping mall favored by fashionistas and tourists seeking unique, one-of-a-kind fashion pieces.", "name": "Xintiandi Style I", "transport": "Take Metro Line 10 or 13 to Xintiandi Station, Exit 1, and walk for about 2 minutes."}, {"address": "No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Must-Buy List: Randomevent graphic streetwear tees, DOE limited co-branded sneakers, No-One Center original trendy accessories. Seamlessly integrating art exhibitions with retail, this innovative shopping mall is the ultimate mecca for Shanghai\u0027s youth and streetwear culture. It boasts a high concentration of debut flagship and concept stores from original Chinese streetwear brands. With unique art installations on every floor, it exudes dynamic local contemporary youth culture.", "name": "TX Huaihai Youth Energy Center", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1, and walk for about 3 minutes."}, {"address": "Building 2, No. 4 Courtyard, Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 Stars | Must-Buy List: Shanghai-style heavy-color silk scarves, hand-drawn Shikumen nostalgia art books, paper-cut ceramic mugs. Located inside Tianzifang, Shoubai Art is a local cultural and creative brand founded by renowned Shanghai paper-cutting artist Li Shoubai. Combining traditional Shanghai paper-cutting with modern heavy-color painting, the shop distills the nostalgic ambiance of old Shanghai Shikumen life into beautiful everyday lifestyle items and artworks, making it a fantastic spot for memorable local souvenirs.", "name": "Shoubai Art", "transport": "Take Metro Line 9 to Dapuqiao Station, Exit 1, and walk about 5 minutes into Tianzifang."}, {"address": "No. 27 Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Classic red-and-blue stripe white plimsolls, Tianzifang-exclusive vintage canvas shoes, high-top Guochao co-branded casual sneakers. Originating in Shanghai, Feiyue is a classic heritage plimsoll brand that has revitalized into a globally recognized icon of \u0027Guochao\u0027 (China-chic). This specialty store in Tianzifang offers a complete selection of styles that are affordable, retro, and extremely comfortable\u2014making these shoes an essential Shanghai souvenir.", "name": "Feiyue Shoes (Tianzifang Store)", "transport": "Take Metro Line 9 to Dapuqiao Station, Exit 1, and walk about 4 minutes into Tianzifang."}, {"address": "No. 20 Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy List: 100% pure silk hand-painted scarves, vintage Shanghai-pattern shawls, delicate mulberry silk handkerchiefs. Shanghai Story is one of the city\u0027s most iconic local silk brands. Perfectly capturing old Shanghai nostalgia, this Tianzifang store offers high-quality silk scarves and Qipao accessories featuring designs that blend traditional Shanghai culture with modern aesthetics. It is an ideal place to buy refined gifts for elders or friends.", "name": "Shanghai Story (Tianzifang Store)", "transport": "Take Metro Line 9 to Dapuqiao Station, Exit 1, and walk for about 4 minutes."}, {"address": "Building 15, Xintiandi North Block, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.9 Stars | Must-Buy List: \u0027NIGHT TUBEROSE\u0027 perfume, Zen-inspired scented candles, vintage Shanghai-style car diffusers. DOCUMENTS is currently China\u0027s premier and highly acclaimed home-grown haute perfumery brand. Its Xintiandi flagship store stuns visitors with a unique \u0027Dark Temple\u0027 immersive aesthetic. Combining world-class fine ingredients with deep Eastern philosophy and modern aesthetics, its signature scents and exquisite bottle designs make it a top choice for luxury shopping.", "name": "DOCUMENTS Fragrance (Xintiandi Flagship Store)", "transport": "Take Metro Line 10 to Xintiandi Station, Exit 6, and walk for about 5 minutes."}, {"address": "No. 300 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Must-Buy List: K11 Design Store exclusive designer ornaments, MoMA artistic stationery, Florasis (Huaxizi) limited-edition local beauty gift sets. Situated on the edge of the Xintiandi shopping district, Shanghai K11 is the world\u0027s first luxury shopping mall to seamlessly blend art museum concepts with retail. Alongside famous international luxury brands, its basement and upper floors feature numerous Chinese maker spaces, art select shops, and designer boutiques, allowing shoppers to enjoy sophisticated retail therapy while immersing themselves in contemporary art exhibitions.", "name": "K11 Art Mall Shanghai", "transport": "Take Metro Line 1 or 14 to South Huangpi Road Station, Exit 2 directly connects to the mall\u0027s basement level."}, {"address": "No. 58 Zhuoyao Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Coach classic monogram handbags (from 70% off), popular discounted Nike running shoes, tailored Armani blazers. This is Shanghai\u0027s premier Tuscan Italian-style luxury outlet village. Hosting over 300 top international luxury and high-end local brands offering 30% to 90% off year-round, its charming European town architecture makes it an unmissable bargain paradise for shoppers in Shanghai.", "name": "Florentia Village Shanghai Luxury Designer Outlet", "transport": "Take Metro Line 2 to Yuandong Avenue Station, Exit 2, then take the free shuttle bus for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Xintiandi and Tianzifang"}, "xujiahui-huaihai": {"categories": {"cat_1": {"items": [{"address": "1F, No. 755 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buy list: HARMAY Lemon Verbena Hand Cream, deluxe travel samples of luxury serums, beauty sponge sets. Located on Middle Huaihai Road, this warehouse-style beauty concept store is one of Shanghai\u0027s hottest local new-retail beauty landmarks. Spanning several floors with an industrial ruin aesthetic, its metal shelves are packed with emerging domestic beauty brands and travel-size luxury classics at highly competitive prices. A treasure trove for trendy youngsters and tourists shopping for beauty and skincare products.", "name": "HARMAY \u8a71\u6885 (HARMAY Huaihai Store)", "transport": "About a 3-minute walk from Exit 1 of Middle Huaihai Road Station, Metro Line 13"}, {"address": "B1, Grand Gateway 66, No. 1 Hongqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: Jade Lustre Cream, Rose Tint Powder, Night Shanghai Vintage Perfume. Born in 1898, this century-old luxury Haipai beauty brand perfectly embodies the glamour of old Shanghai socialites. Combining modern high-end beauty technology with Oriental herbal extracts, its signature \u0027Jade Lustre Cream\u0027 offers exceptional moisturizing properties. Featuring elegant vintage Shanghai packaging, it is the top choice for an authentic local souvenir representing refined Shanghai living.", "name": "\u96d9\u59b9 (SHANGHAI VIVE Grand Gateway Store)", "transport": "Direct access from Exit 12 of Xujiahui Station, Metro Lines 1/9/11"}, {"address": "No. 538 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Must-buy list: Endless Night Fragrance Hand Cream, Naive Series Eau de Parfum, Zen Oriental Solid Perfume. A high-end local original beauty and niche fragrance brand from Shanghai that took the beauty world by storm with its unique \u0027Zen Cool\u0027 aesthetic. The flagship store on Middle Huaihai Road resembles a contemporary art gallery. Products strictly use high proportions of rare natural raw ingredients, delivering luxurious textures and distinctive scents beloved by discerning beauty and fragrance connoisseurs.", "name": "\u805e\u737b DOCENTS (DOCUMENTS Huaihai Flagship)", "transport": "About a 5-minute walk from Exit 1 of Middle Huaihai Road Station, Metro Line 13"}, {"address": "No. 966 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-buy list: Shanghai Woman Vanishing Cream Tin Gift Box, Maxam Deep Moisturizing Hand Cream, Pechoin Water Energy Classic Cream. Deeply rooted in Shanghai for decades, this time-honored traditional pharmacy sells medicines as well as serving as the most comprehensive local hub for classic old-school domestic beauty products. With a dedicated section for domestic skincare, you can purchase decades-trusted vanishing creams and affordable lotions featuring simple formulas and incredibly budget-friendly prices.", "name": "\u4e0a\u6d77\u85e5\u623f (Shanghai Pharmacy Huaihai Store)", "transport": "About a 4-minute walk from Exit 2 of South Shaanxi Road Station, Metro Lines 1/10/12"}, {"address": "1F, Metro City, No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: Iron Wand Mascara, 7-Color Playful Eyeshadow Palette, Highlight \u0026 Contour Palette. A Shanghai-born beauty brand famous for exceptional value, vibrant color choices, and high practicality. The flagship store inside Metro City at Xujiahui is filled with youthful, playful decor and offers full makeup testing counters. Highly accessible prices allow customers to guilt-free collect every shade.", "name": "\u6a58\u6735 (Judydoll Metro City Store)", "transport": "About a 2-minute walk from Exit 10 of Xujiahui Station, Metro Lines 1/9/11"}, {"address": "No. 111 Hunan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.9 stars | Must-buy list: Kunlun Snow Scented Body Lotion, Summer Palace Osmanthus Essential Oil Hand Cream, Four Seasons Oriental Botanical Solid Balm. Housed in a standalone vintage villa near the Huaihai Road shopping area, this store highlights Oriental botanical scents and plant-based skincare aesthetics. Seamlessly blending traditional Chinese culture into body care and fragrances, the space exudes serene Oriental elegance for a deeply relaxing sensory trial, standing as a landmark of culturally rich domestic beauty.", "name": "\u89c0\u590f (To Summer Hunan Road House)", "transport": "About an 8-minute walk from Exit 7 of Jiaotong University Station, Metro Lines 10/11"}, {"address": "B1, Grand Gateway 66, No. 1 Hongqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 stars | Must-buy list: Ganoderma Youth Rejuvenating Serum, Herbal Hydrating Lipstick, Cordyceps Timeless Revitalizing Cream. Premium traditional herbal beauty brand specifically tailored for Asian women\u0027s skin, deeply rooted in Shanghai for many years. Combining precious traditional Chinese herbs like Ganoderma, Cordyceps, and Ginseng with modern high-tech skincare technology, it is highly acclaimed for anti-aging and skin-nourishing results. Counters offer professional skin analysis and skincare trial services.", "name": "\u7fbd\u897f (YUESAI Grand Gateway Store)", "transport": "Direct access from Exit 12 of Xujiahui Station, Metro Lines 1/9/11"}, {"address": "1F, Metro City, No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Must-buy list: Explorer 12-Color Animal Eyeshadow Palette, Bionic Film Serum Lipstick, Read-Me Card Soft Matte Lip Tint. An iconic flagship experience store of one of China\u0027s most popular C-Beauty cosmetic brands, prime-located inside Metro City in Xujiahui. The bright and spacious store carries a comprehensive lineup focusing on trendy designs and high value. Professional makeup artists provide on-site guidance, making it the ideal spot to experience contemporary C-Beauty trends.", "name": "\u5b8c\u7f8e\u65e5\u8a18 (Perfect Diary Metro City Experience Store)", "transport": "About a 2-minute walk from Exit 10 of Xujiahui Station, Metro Lines 1/9/11"}], "name": "Iconic Local Beauty \u0026 Pharmacy"}, "cat_2": {"items": [{"address": "No. 158 Xinle Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: DOE logo printed T-shirts, limited-edition brand collaboration sneakers, retro canvas bucket hats. As a core hub for Shanghai\u0027s local street fashion culture, this shop seamlessly blends a coffee bar with limited-edition sneakers and trendy apparel. Its unique tiered stadium seating area draws countless local fashionistas and international visitors alike.", "name": "DOE Huaihai", "transport": "Take Metro Lines 1, 10, or 12 to South Shaanxi Road Station, Exit 7; walk for about 5 minutes."}, {"address": "No. 796 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: 100% undyed natural cashmere coats, double-faced silk tailored shirts, natural organic cotton dresses. Originating in Shanghai, this premium sustainable fashion brand is renowned for its refined natural materials and minimalist cuts. Housed in a historic standalone mansion, this flagship concept store integrates art exhibitions and a curated reading area for a truly sophisticated shopping experience.", "name": "ICICLE Flagship Store", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1; walk for about 3 minutes."}, {"address": "No. 233 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.9 stars | Must-Buys: Moon-collection bamboo-woven leather handbags, Chinese-style silk scarves, cashmere felt capes. Founded by a Chinese designer in partnership with the Herm\u00e8s Group, this luxury brand fuses traditional Chinese craftsmanship\u2014such as bamboo weaving over porcelain and cashmere felting\u2014into modern apparel, shoes, and bag designs, epitomizing Oriental luxury aesthetics.", "name": "SHANG XIA Maison", "transport": "Take Metro Line 1 to South Huangpi Road Station, Exit 2; walk for about 3 minutes."}, {"address": "No. 30 Donghu Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buys: Classic red-and-blue striped white canvas sneakers, Guochao collaboration high-tops, retro replica Kung Fu shoes. A prime example of a heritage Shanghai sneaker brand transforming into a street trend favorite. Extremely affordable, lightweight, and comfortable, these versatile sneakers are a top must-buy item for both international tourists and local youth.", "name": "Feiyue Shoes Huaihai", "transport": "Take Metro Lines 1, 10, or 12 to South Shaanxi Road Station, Exit 2; walk for about 6 minutes."}, {"address": "Near No. 999 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buys: WB-1 classic red-and-white basketball shoes, graffiti casual canvas sneakers, retro dad sneakers. Carrying the memories of generations of Shanghainese, this century-old local athletic footwear brand has embraced modern Guochao trends through creative cross-brand collaborations, infusing its classic vulcanized shoes with trendy contemporary elements that feel both nostalgic and chic.", "name": "Warrior Shoes Huaihai Store", "transport": "Take Metro Lines 1, 10, or 12 to South Shaanxi Road Station, Exit 1 (direct access)."}, {"address": "No. 184 Fumin Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: Printed shirts by emerging Chinese designers, deconstructivist structured handbags, niche designer silver jewelry. China\u0027s most influential select store for local independent designer brands, showcasing countless emerging fashion talents. It is the ultimate destination to explore original Chinese fashion trends and unique footwear/bag designs.", "name": "LABELHOOD Flagship Store", "transport": "Take Metro Lines 1 or 7 to Changshu Road Station, Exit 8; walk for about 5 minutes."}, {"address": "Inside TX Huaihai, No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: Medium Song Bag, Cloud Hobo Bag, Chocolate textured square bag. A hugely viral local original leather goods brand crafted with premium top-grain cowhide. Combining warm Eastern aesthetics with functional practicality, it is wildly popular among local urban women.", "name": "Songmont Huaihai Pop-up", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1; walk for about 2 minutes."}, {"address": "No. 283 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Niche designer patchwork knitwear, minimalist leather crossbody bags, retro sunglasses. A landmark multi-brand designer select shop featuring both global and local brands. Spread across multiple floors with an art gallery atmosphere, it frequently launches exclusive collaboration apparel and unique bags with emerging local designers.", "name": "LOOKNOW Designer Select Shop Huaihai Flagship", "transport": "Take Metro Line 1 to South Huangpi Road Station, Exit 2; walk for about 2 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "No. 603 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: Almond Slice, Palmier (Butterfly Pastry), Gazhisong. As the most iconic classic Shanghainese bakery on Middle Huaihai Road, Harbin Food Factory carries childhood memories for generations of Shanghai locals. Their pastries adhere to traditional hand-baking with rich, high-quality butter. The Almond Slice features crunchy sliced almonds atop a rich, buttery crust\u2014crisp outside and soft inside. The Palmiers are beautifully layered, pleasantly sweet without being cloying, making them an authentic local gift for family and friends.", "name": "Harbin Food Factory", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), about a 3-minute walk."}, {"address": "No. 796 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buy list: Park Hotel Palmiers, Gaoqiao Muffin, Shanghai Pan-Fried Bun-shaped Chocolates. Located in the heart of Middle Huaihai Road shopping district, Shanghai First Food Hall offers the most complete selection of specialty foods in Shanghai. It brings together famous time-honored brands and features a dedicated Shanghai souvenir area. The biggest crowd-pleaser is the viral Park Hotel Palmiers, famous for their flaky, aromatic crunch. You\u0027ll also find creative snacks infused with Shanghai culture, making this the ultimate one-stop shop for souvenirs.", "name": "Shanghai First Food Hall", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, about a 5-minute walk."}, {"address": "Floor B1, Shanghai Times Square, No. 99 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: Original White Rabbit Milk Candy, White Rabbit Lip Balm, Tiramisu Flavored Milk Candy. White Rabbit is Shanghai\u0027s most famous nostalgic snack brand. The flagship store in Huaihai Road area blends retro charm with trendy modern flair. Beyond dozens of limited-edition candy flavors, the store offers cute crossover lifestyle merchandise like perfumes, lip balms, and tote bags. Packed in classic blue, white, and red packaging filled with old Shanghai nostalgia, these are must-buy souvenirs for tourists.", "name": "White Rabbit Candy Specialty Store", "transport": "Take Metro Line 8 to Dashijie Station (Exit 3), about a 6-minute walk."}, {"address": "No. 584 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-buy list: Qingtuan (Sweet Green Rice Ball), Tiaotou Gao (Red Bean Glutinous Rice Strip), Shuang Gao (Layered Rice Cake). Founded in 1875, the century-old Shen Da Cheng is renowned for its delicate traditional Shanghai rice cakes. The branch on Huaihai Road always draws long queues. Their sticky rice pastries are soft, chewy, and non-sticky; the Tiaotou Gao is filled with smooth red bean paste of balanced sweetness. The seasonal Qingtuan sold around Qingming Festival causes a city-wide buying frenzy. Vacuum-packed gift sets are perfect for bringing home to share.", "name": "Shen Da Cheng", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 3), about a 4-minute walk."}, {"address": "No. 100 Tianyaoqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: Zhuangyuan Cake, Dingsheng Cake, Qiao Coffee Souvenir Gift Box. Qiao Jia Shan is a historic bakery brand deeply rooted in Xujiahui, Shanghai. Recently, it launched the innovative concept store \u0027Qiao Coffee\u0027 in Xujiahui, blending classic Shanghainese pastries with specialty coffee. The must-buy Dingsheng Cake is fluffy, sweet, and symbolizes victory and good luck, while the Zhuangyuan Cake is rich in filling. Their ancient-recipe pastry boxes combined with beautifully packaged cold brew coffee bags successfully transform old Shanghai flavors into stylish gifts.", "name": "Qiao Jia Shan", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 12), about a 5-minute walk."}, {"address": "No. 400 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: Fresh Pork Mooncake, Marinated Zaolu Seasoning Pack, Chicken Biscuit. Taikang Food Store is a highly popular traditional food store in Huaihai Road district, best known for freshly baked savory pork mooncakes and traditional dried fruit snacks. Their pork mooncakes feature extra-flaky crusts and juicy, tender meat fillings, selling hot all year round. In addition, exquisite packaged Shanghai-style snacks, traditional candied fruits, and Zaolu seasoning sauces make perfect souvenirs for foodies who love unique Shanghai flavors.", "name": "Taikang Food Store", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), about a 3-minute walk."}, {"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buy list: Curry Beef Pastry, Napoleon Cake, Shanghai Semifreddo (Ice Cake). Lao Da Chang represents classic Shanghai-Western pastries once beloved by famous literary figures like Eileen Chang. The shop on Middle Huaihai Road recreates the romantic atmosphere of vintage French bakeries in old Shanghai. Must-try items include the golden, crispy Curry Beef Pastry with its rich filling, and the Napoleon Cake with rich layers and sweet cream. They also offer portable handmade cookie gift boxes and elegantly packaged pastries, perfectly capturing the unique charm of Shanghai-Western desserts.", "name": "Lao Da Chang", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), about a 2-minute walk."}, {"address": "No. 988 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: Lees-marinated Fresh Pork Mooncake, Drunken Whelks, Canned Mud Snails. Founded in 1852, Shao Wan Sheng is synonymous with Shanghai\u0027s traditional lees-marinated (Zao Zui) delicacies. The Huaihai Road branch blends classic pickling techniques with modern casual snacks. Its specialty Lees-marinated Pork Mooncake carries a unique aroma of wine and savory meat. The bottled drunken whelks and mud snails use modern vacuum-sealing, making them convenient, authentic savory gifts for travelers to take home.", "name": "Shao Wan Sheng", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station (Exit 2), about a 2-minute walk."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buy list: Guochao (China-chic) designer T-shirts, designer art blind boxes, niche fragrance sprays. TX Huaihai is a hub for contemporary youth trend culture in Shanghai, pioneering the concept of \u0027Curated Retail\u0027 that seamlessly blends art exhibitions with trendy shopping. It gathers a huge array of emerging Chinese designer brands and trendy pop-up stores, with each floor featuring distinct themes and art installations\u2014making it an iconic local shopping landmark for Shanghai fashion culture.", "name": "TX Huaihai Youth Energy Center", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, and walk about 3 minutes from the exit."}, {"address": "No. 282 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: Independent designer niche bags, original design accessories, stylish knitwear. Located in the heart of Middle Huaihai Road, LOOKNOW is an iconic local designer buyer shop in Shanghai. The entire multi-story space boasts a modern artistic design, featuring the latest creations from dozens of emerging Chinese and international designers. Offering everything from apparel and bags to jewelry, it ensures you won\u0027t bump into anyone wearing the same outfit, making it a favorite among Shanghai fashionistas and tourists alike.", "name": "LOOKNOW Flagship Store Middle Huaihai Road", "transport": "Take Metro Line 1 or 14 to South Huangpi Road Station, Exit 2, and walk about 2 minutes."}, {"address": "No. 755 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-buy list: International luxury brand perfume samples, local serum sheet masks, botanical hand creams. Originating from Shanghai, HARMAY is a nationwide sensation operating as a warehouse-style cosmetics multi-brand store. The Middle Huaihai Road flagship blends industrial aesthetics with a scientific laboratory concept, offering tens of thousands of luxury beauty samples and emerging domestic skincare brands. Grab a shopping basket and freely explore to score travel-size luxury skincare and exquisite perfumes at unbeatable prices\u2014a true shopping haven for beauty lovers.", "name": "HARMAY (Middle Huaihai Road)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1, and walk about 1 minute."}, {"address": "No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Must-buy list: Anime limited-edition figures, Shanghai-exclusive styled stationery, signature boba/specialty tea drinks. Metro City is the most iconic giant crystal globe landmark in the Xujiahui commercial district, as well as a famous shopping paradise for Japanese anime and subculture in Shanghai. The mall is divided into several themed streets like \u0027European Street\u0027, \u0027Luosong Street\u0027, and \u0027Gofang Street\u0027 (Avenue 5), housing numerous Japanese anime merchandise flagship stores, Japanese lifestyle goods, and trendy local shops, creating a lively and diverse shopping vibe.", "name": "Metro City", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station, Exit 10 connects directly into the mall."}, {"address": "No. 1 Hongqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: High-end luxury fragrance gift sets, Shanghai-exclusive designer bags, artisanal handcrafted chocolates. Situated in the heart of Xujiahui, Grand Gateway 66 is an iconic premier luxury shopping mall in Shanghai. Featuring impressive grand staircases and striking twin towers, it houses top international luxury brands, high-end cosmetics counters, and boutique specialty stores, alongside a wide range of fine dining options, delivering a sophisticated and comfortable luxury shopping experience.", "name": "Grand Gateway 66", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station, Exit 12 connects directly into the mall."}, {"address": "Nos. 939-947 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-buy list: Discounted off-season designer women\u0027s shoes, brand-sale cashmere sweaters, discounted running shoes. Paris Printemps Huaihai Outlet is a well-established and renowned urban outlet store in the Huaihai Road commercial area. Famous for its high value for money, the department store frequently hosts deep discount sales for major brands, clothing, and footwear. It is a must-visit shopping spot for travelers looking to score deals on high-quality discounted apparel right in the city center.", "name": "Paris Printemps Huaihai Outlet", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station, Exit 1, and walk about 2 minutes."}, {"address": "No. 633 Yongjun Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Must-buy list: Discounted Coach leather bags, classic discounted Nike sneakers, Burberry classic check scarves. This is Shanghai\u0027s most recommended and famous Italian-themed outlet mall. Perfectly replicating Tuscan architecture, the village hosts over 200 top international luxury and athletic lifestyle brands, offering huge discounts as low as 80% off year-round. It is ideal for spending a half-day shopping spree while soaking in authentic European outlet charm.", "name": "Florentia Village Shanghai Luxury Designer Outlet", "transport": "Take Metro Line 2 to Yuandong Avenue Station, then take the free shuttle bus or a 5-minute taxi ride to arrive."}, {"address": "No. 999 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-buy list: Gentle Monster trendy sunglasses, Pierre Marcolini luxury chocolate gift boxes, Shanghai-themed cultural \u0026 creative souvenirs. Located on bustling Middle Huaihai Road, iapm is a major trendy shopping mall that pioneered Shanghai\u0027s \u0027Night Shopping\u0027 concept. With extended operating hours late into the night, tourists can enjoy late-night shopping sprees. Bringing together top international luxury brands, famous designer labels, and tasteful lifestyle goods within an ultra-modern architectural space, it is a must-visit flagship mall in the Huaihai Road commercial area.", "name": "iapm Mall", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station, where the underground station passage directly connects to the mall."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Xujiahui and Huaihai Road"}, "yuyuan-oldcity": {"categories": {"cat_1": {"items": [{"address": "No. 28 Yuyuan Old Street, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Duck Egg Fragrant Powder, Shell Powder Eyebrow Powder, Polygonum Multiflorum Hair Nourishing Ointment. Founded during the Chongzhen reign of the Ming Dynasty, Dai Chun Lin is one of China\u0027s oldest traditional cosmetics brands. Located on Yuyuan Old Street, the store boasts an authentic, classic antique vibe. Its signature Duck Egg Fragrant Powder is refined from natural herbs and pearl powder, featuring a silky-fine texture and an elegant vintage fragrance\u2014a huge hit among fans of traditional Chinese style (\u0027Guochao\u0027) cosmetics and retro makeup.", "name": "Dai Chun Lin", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, approx. 5 mins walk"}, {"address": "No. 265 Middle Fangbang Road (Inside Yuyuan Tourist Mart), Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buys: Flying Apsaras Duck Egg Powder, Sweet Osmanthus Solid Balm, Blue and White Porcelain Horse Oil Balm. Established during the Daoguang reign of the Qing Dynasty, Xie Fu Chun is a centuries-old China Time-Honored Brand cosmetics maker. The Yuyuan shop showcases traditional Eastern fragrant powders and solid perfumes crafted using natural aromatics and classic techniques. The packaging makes for excellent collectibles or gifts, and the duck-egg powder adheres smoothly to skin with a light, natural scent\u2014making it a quintessential Yuyuan souvenir.", "name": "Xie Fu Chun", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, approx. 6 mins walk"}, {"address": "Jiuxiaochang Road Shops, Inside Yuyuan Tourist Mart, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buys: Tuberose Vanishing Cream, Rose Hand Cream, Retro Solid Perfume. Shanghai Woman is one of the most iconic local cosmetics brands capturing the vintage allure of Old Shanghai. The packaging features nostalgic illustrations of 1930s Shanghai women wearing qipao. The vanishing cream has a light, non-greasy texture that deeply moisturizes the skin. With budget-friendly prices and a rich nostalgic vibe, it is an extremely popular souvenir shop in the Yuyuan shopping area for tourists.", "name": "Shanghai Woman Cosmetics", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 33 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buys: Herbal Pearl Whitening Cream, Ginseng Repair Essence, Herbal Throat Lozenges. Founded in the 48th year of Emperor Qianlong\u0027s reign, Tong Han Chun Tang is a prestigious and long-standing Traditional Chinese Medicine (TCM) pharmacy in Shanghai. The Yuyuan flagship store sells not only traditional Chinese medicinal herbs, but also TCM cosmetics and skincare products blending ancient recipes with modern technology. Gentle, natural, and non-irritating, it\u0027s a must-visit destination for fans of herbal skincare.", "name": "Tong Han Chun Tang Flagship Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, approx. 4 mins walk"}, {"address": "Counter near Yuyuan Shopping District, No. 1 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Must-Buys: Viva Face Cream, Night of Shanghai Perfume, Pink Rose Cream. Founded in 1898, Shanghai Vive is the premier luxury cosmetics brand in modern Shanghai history. Located in the high-end shopping arcade near Yuyuan, its products fuse classic Shanghai Oriental aesthetics with top-tier French perfumery art. The flagship \u0027Viva Face Cream\u0027 features a velvety-smooth texture with exceptional anti-aging and moisturizing benefits. Exquisitely packaged, it radiates sophisticated Shanghai glamour.", "name": "Shanghai Vive", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, approx. 10 mins walk"}, {"address": "No. 215 Anren Street, Inside Yuyuan Tourist Mart, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buys: Herbal Essential Oil Lip Balm, TCM Face Mask Powder, Herbal Beauty Flower Tea. This crossover flagship space was created by Tong Han Chun Tang specifically for younger generations and travelers. Applying traditional TCM herbs to modern cosmetics and facial masks, it allows customers to mix custom herbal masks on-site and try various herbal skincare products. It seamlessly blends trendy Chinese cosmeceuticals with Eastern wellness, offering a uniquely memorable experience.", "name": "Tong Han Chun Tang TCM Beauty \u0026 Wellness", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, approx. 5 mins walk"}, {"address": "Intersection of Middle Fangbang Road and Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buys: Pearl Skin Moisturizing Ointment, Honeysuckle Soothing Spray, Herbal Anti-Acne Gel. Lei Yun Shang is a household name among traditional Chinese pharmacies in East China. Its Yuyuan branch maintains an authentic antique pharmacy ambience. Their TCM skincare and cosmeceutical lines are carefully formulated using authentic medicinal ingredients, making them ideal for sensitive skin and consumers seeking natural ingredients\u2014offering great effectiveness at affordable prices.", "name": "Lei Yun Shang Pharmacy - Yuyuan Branch", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, approx. 6 mins walk"}, {"address": "1st Floor, Yuyuan Department Store, No. 168 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-Buys: Pechoin Herbal Hydrating Set, Chando Glacier Water Mask, One Leaf Plant Essence Lotion. While Watsons is a well-known chain drugstore, this specific branch features a dedicated \u0027Top Domestic Beauty Products Zone\u0027 tailored for Yuyuan tourists. Bringing together premier C-beauty skincare brands like Pechoin and Chando, it makes it super convenient for visitors to test and buy a wide range of top Chinese cosmetics all under one roof.", "name": "Watsons - Yuyuan Branch", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, approx. 5 mins walk"}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 16 South Henan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Custom handmade mulberry silk Qipao, Haipai embroidered silk scarves, silk loungewear/pajamas. Lao Jie Fu is a century-old Shanghai silk brand renowned for its premium materials and exquisite craftsmanship. The store offers tailored Qipao services that inherit authentic old Shanghai tailoring techniques. With immaculate fit and precise cuts, it is the ultimate choice for experiencing vintage Shanghai style and purchasing high-end apparel.", "name": "Lao Jie Fu Silk \u0026 Qipao", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, about a 3-minute walk"}, {"address": "No. 158 Jiuxiaochang Road, Yuyuan Mall, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Modernized Haipai Qipao, delicate embroidered shawls, handcrafted frog-button accessories. Manlorlan is one of Shanghai\u0027s most iconic high-end Qipao brands, seamlessly blending traditional Chinese elements with modern fashion silhouettes. Located in the Yuyuan commercial area, it offers everything from everyday casual Qipao to elegant formalwear. Highly popular among fans of Guochao (China-chic) and Shanghainese culture for its texture and design.", "name": "Manlorlan Qipao (Yuyuan Branch)", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, about a 5-minute walk"}, {"address": "No. 268 Middle Fangbang Road (Shanghai Old Street), Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic red-white-blue logo canvas shoes, Guochao collaboration high-top canvas sneakers, retro running shoes. Originating in Shanghai as a classic national plimsoll brand, Feiyue has recently become a globally popular icon of Chinese chic. This flagship store on Old Street features an extensive selection of lightweight, durable, and affordable footwear. The vintage and redesigned styles make for a perfect souvenir from Shanghai.", "name": "FEIYUE Sneakers (Yuyuan Old Street Store)", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, about an 8-minute walk"}, {"address": "No. 22 Wenchang Road, Yuyuan Mall, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Printed cashmere shawls, Shanghainese-style long silk scarves, Chinese-style embroidered square scarves. Shanghai Story is one of the city\u0027s most famous scarf and shawl chains. The Yuyuan branch fuses Jiangnan water-town aesthetics with retro Shanghai charm. Featuring thousands of scarf styles\u2014ranging from old Shanghai landmarks to classic florals and modern abstract art\u2014their soft textures and beautiful packaging make them exceptional gifts.", "name": "Shanghai Story (Yuyuan Store)", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, walk into Yuyuan Mall for about 6 minutes"}, {"address": "No. 306 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: WB-1 classic retro sneakers, German trainer style retro casual shoes, Guochao canvas tote bags. Founded in 1927, Warrior is Shanghai\u0027s most iconic heritage athletic footwear brand. Located on Shanghai Old Street, this store showcases trendy reimaginations of classic sneakers. Exceptionally comfortable and infused with a strong nostalgic hipster vibe, it\u0027s a favorite shop among youth and hipsters.", "name": "Warrior Shoes (Shanghai Old Street Branch)", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 1, walk along Middle Fangbang Road for about 7 minutes"}, {"address": "No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Double-sided embroidered silk handbags, handcrafted kiss-lock purse bags, printed silk cardigans/jackets. Yuyuan Silk Mansion is a comprehensive shopping venue bringing together local traditional silk apparel, shoes, and bags in the Yuyuan district. The floors house numerous legacy brands and independent craft workshops. Its embroidered bags and traditional cloth totes in particular are exquisite, detailed, and rich in Oriental elegance, making it a hotspot for aesthetic enthusiasts.", "name": "Yuyuan Silk Mansion", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, about a 6-minute walk"}, {"address": "No. 120 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-Buy List: 100% combed cotton loungewear sets, modal seamless underwear, retro Shanghainese knitwear. Originating in Shanghai, Three Gun is a time-honored Chinese brand famous for knit underwear and loungewear. Besides high-quality, skin-friendly loungewear, this store in the Yuyuan commercial area offers casual wear and undershirts infused with retro Shanghai style, well-loved by locals of all ages and quality-conscious travelers.", "name": "Three Gun Apparel (Yuyuan Store)", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, about a 5-minute walk"}, {"address": "No. 128 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Yunjin brocade handbags, retro pearl-clasp embroidered bags, Chinese-style modern silk cardigans. Si Jin Ji is a unique boutique near Yuyuan favored by youth and traditional fashion enthusiasts. It specializes in integrating traditional brocade and embroidery into modern footwear, bags, and clothing. Featuring exquisite original designs with unique fabric patterns, it is a fabulous place to pick up fashion accessories and garments infused with Oriental charm.", "name": "Si Jin Ji Silk Apparel \u0026 Bags", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, about a 4-minute walk"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 42 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Must-Buy List: Cough-relieving Pear Syrup Candy, Mint Pear Syrup Candy, Fruit Pear Syrup Candy. Pear syrup candy is one of the most iconic traditional sweets in Yuyuan, Shanghai, with a history spanning over a century. Simmered according to ancient recipes using snow pears combined with traditional Chinese herbs like Fritillaria and Pinellia, it offers a refreshing, sweet taste with a rich herbal aroma, making it excellent for soothing the throat and relieving coughs. In addition to traditional herbal flavors, the shop offers fruit-flavored varieties perfect for younger crowds. With vintage Old Shanghai packaging, it is an essential traditional souvenir when visiting Yuyuan.", "name": "Shanghai Pear Syrup Candy Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 6 mins walk"}, {"address": "No. 112 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Must-Buy List: Creamed Spiced Beans, Salt-Roasted Beans, Fennel Beans. As the local saying goes, \u0027If you haven\u0027t had City God Temple\u0027s spiced beans, you haven\u0027t truly visited Shanghai.\u0027 The creamed spiced beans sold here are an iconic snack from a classic Shanghai heritage brand. Made from premium broad beans slow-roasted with a unique blend of spices, the beans are firm and chewy with a light dusting of white salt. They taste salty first, then sweet, carrying a rich cream and five-spice aroma that grows more flavorful as you chew. They make a fantastic nostalgic snack or bar bite to take home for family gatherings.", "name": "City God Temple Creamed Spiced Beans Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Must-Buy List: Crab Roe Xiaolongbao Flavored Crackers, Classic Palmier Gift Box, Seaweed Peanuts. This flagship store brings together a wide variety of classic Shanghai-style pastries and leisure snacks. Tourists particularly love the creative products that infuse famous Shanghai dishes into modern snacks, such as savory, crispy crackers infused with crab roe soup dumpling flavor. Additionally, their palmiers (butterfly pastry) feature distinct buttery layers, packaged elegantly with design elements inspired by Yuyuan\u0027s Nine-Turn Bridge and Shanghainese architecture\u2014making this a fail-proof choice for gift shopping.", "name": "Shanghai Old City God Temple Food Store", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 3, approx. 7 mins walk"}, {"address": "No. 159 Jiuxiaochang Road, inside Yuyuan Garden, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Must-Buy List: Nine-Turn Bridge 3D Postcards, Yuyuan Four Seasons Scented Candles, Vintage Filigree Bookmarks. This independent cultural and creative store cleverly merges the aesthetics of traditional classical Yuyuan gardens with modern lifestyle goods. Offering many Yuyuan-exclusive merchandise with sophisticated design, it is immensely popular among hipsters and international tourists alike. Highly recommended are the Four Seasons scented candles inspired by seasonal flora in the garden, and delicate metal bookmarks crafted with motifs from Yuyuan\u0027s carved window lattices\u2014making them culturally rich and practical high-end souvenirs.", "name": "Yuyuan Cultural and Creative Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 33 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Ginseng Jelly, Herbal Wellness Tea Bags, Ejiao Red Date Cake. Tong Han Chun Tang is a renowned 200-year-old traditional Chinese pharmacy in Shanghai that has transformed traditional wellness concepts into stylish souvenirs. Their top seller is the ginseng jelly, which infuses nourishing ginseng essence into a chewy jelly\u2014sweet with a subtle bitter note and no harsh medicinal taste. Additionally, their exquisite and convenient herbal tea sachets tailored for modern lifestyles are immensely popular among health-conscious travelers, making them ideal high-end wellness gifts for elders or self-care.", "name": "Tong Han Chun Tang Chinese Medicine \u0026 Herbal Tea Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 7, approx. 4 mins walk"}, {"address": "No. 122 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Must-Buy List: Tiaotou Gao (Red Bean Paste Rice Roll), Award-winning Qingtuan (Sweet Green Rice Ball), Shuang Gao Tuan. Founded in 1875, Shen Da Cheng is known as the \u0027King of Rice Cakes\u0027 and represents Shanghai\u0027s time-honored traditional pastries. Long queues form daily at the Yuyuan branch for fresh rice cakes. The must-try Tiaotou Gao features a soft, chewy sticky rice skin filled with smooth, perfectly sweet red bean paste, while the Qingtuan offers a subtle herbal scent with both sweet and savory filling options. Alongside fresh hot treats, exquisite vacuum-sealed gift boxes are available so tourists can easily take authentic, soft Old Shanghai delicacies home.", "name": "Shen Da Cheng (Yuyuan Store)", "transport": "Metro Line 10, Yuyuan Garden Station, Exit 3, approx. 6 mins walk"}, {"address": "No. 88 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Must-Buy List: Classic Tuberose Vanity Cream, Vintage Solid Perfume, Modern Red Lipstick. Infused with rich Shanghai retro chic, this cosmetics boutique specializes in skincare products inspired by stylish 1930s Shanghai socialites. The signature vanity creams come in traditional porcelain jars or vintage tin boxes, offering moisturizing non-greasy care with subtle floral fragrances (like tuberose, magnolia, jasmine). Very affordably priced and packaged in iconic 1930s calendar poster art styles, these make extremely popular specialty gifts for women.", "name": "Shanghai Lady Vanity Cream Store", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 257 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Must-Buy List: Premium Longjing Tea Gift Box, Yuyuan Zisha Mini Teapot, Handmade Tea-Flavored Nougat. Built during the Qianlong reign of the Qing Dynasty, the Huxinting Teahouse is one of Yuyuan\u0027s iconic landmark buildings. Its gift shop specializes in high-quality Chinese teas and teaware, making it a culturally rich souvenir destination. The tea sold here is exceptional, particularly the hand-roasted Longjing tea and premium Tieguanyin. Furthermore, mini Zisha clay teapots modeled after Huxinting\u0027s architecture and fragrant tea-infused nougats elegantly encapsulate Old Shanghai teahouse culture, serving as sophisticated high-end gifts.", "name": "Huxinting Teahouse Gift Shop", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 6 mins walk"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 265 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Yuyuan cultural creative ice cream, pear syrup candy gift boxes, Guochao illustrated postcards. Located in a classic building at the heart of the Yuyuan commercial district, Yuyuan Department Store has recently transformed into a comprehensive local department store blending Haipai vintage charm with modern trendy toys. It houses numerous transformed Shanghai heritage brands and independent designer boutiques, making it the perfect spot for youth and tourists to find souvenirs rich in both modern aesthetics and historical depth.", "name": "Yuyuan Department Store", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 1, and walk for about 6 minutes."}, {"address": "Inside Yuyuan Tourist Mart, No. 265 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Haipai jade carving accessories, handmade Suzhou embroidery handkerchiefs, antique-style Zisha (purple clay) teasets. Huabao Building is the most iconic department building for antiques, handicrafts, and Haipai culture in Yuyuan Tourist Mart. Its underground and upper floors cover arts and crafts, jewelry and gemstones, traditional Chinese paintings and calligraphy, as well as intangible cultural heritage creations. Featuring counters of numerous local veteran master craftsmen, it offers an authentic taste of Jiangnan traditional aesthetics and Haipai collector culture.", "name": "Huabao Building", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 7, and walk for about 7 minutes."}, {"address": "No. 2888 Huqingping Highway, Qingpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Must-Buy List: Coach classic handbags, discounted limited-edition Nike sneakers, Burberry wool scarves. As one of Shanghai\u0027s most iconic and massive outlet centers, Bailian Qingpu Outlet gathers hundreds of renowned international luxury and sports-casual brands, offering steep discounts starting as low as 70% off year-round. Though situated in the suburbs of Qingpu District, it is easily accessible, serving as a must-visit shopping paradise for luxury splurges and bargain hunting during a trip to Shanghai.", "name": "Bailian Qingpu Outlet Mall", "transport": "Take Metro Line 17 to Jiasong Middle Road Station, then transfer to a bus or take a taxi for about 5 minutes."}, {"address": "No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 Stars | Must-Buy List: To Summer (Guanxia) niche scented candles, Shanghai designer apparel, art gallery creative merchandise postcards. Adjacent to the Yuyuan commercial area, BFC Bund Finance Center is a premier full-service fashion complex bringing together high-end fashion, contemporary art, and lifestyle aesthetics. It features not only Kyoto\u0027s Tsutaya Books, but also numerous counters for emerging Shanghai local designer brands and stylish pop-up stores, perfectly blending Old Shanghai history with modern luxury.", "name": "BFC Bund Finance Center", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 7, and walk for about 10 minutes."}, {"address": "No. 168 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Must-Buy List: Lao Feng Xiang ancient-method pure gold bangles, filigree silver jewelry, classic jadeite necklaces. Founded in 1848, Lao Feng Xiang is Shanghai\u0027s most iconic century-old gold and jewelry establishment. Spanning several floors, this resplendent flagship store in Yuyuan showcases gold jewelry steeped in traditional craftsmanship alongside Haipai jewelry designs, making it a top choice for tourists and locals alike seeking value-preserving gold and wedding jewelry.", "name": "Lao Feng Xiang Jewelry Mall (Yuyuan Flagship Store)", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 106 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy List: Mulberry silk Haipai printed scarves, modern modified Haipai Qipao (cheongsam), handmade embroidered eye masks. \u0027Shanghai Story\u0027 is a silk and apparel brand imbued with local character and historic charm. Its Yuyuan flagship store exudes Old Shanghai Haipai flair, specializing in premium mulberry silk scarves, wraps, and Qipao. Seamlessly blending traditional Oriental silk craftsmanship with modern fashion patterns, it makes for the most elegant local gift for friends and family.", "name": "Shanghai Story Silk Flagship Store", "transport": "Take Metro Line 10 to Yuyuan Station, Exit 1, and walk for about 6 minutes."}, {"address": "No. 33 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Must-Buy List: Ginseng 24 Solar Terms wellness tea, herbal essential oil hand cream, traditional nine-processed aged tangerine peel. With over 200 years of history, Tong Han Chun Tang is a famous time-honored traditional Chinese medicine store in Shanghai. Its flagship store in Yuyuan has been reinvented into a unique shopping center combining Traditional Chinese Medicine wellness with modern Guochao (national tide) trends. In addition to authentic medicinal herbs, it offers herbal teas, traditional herbal solid perfumes, and exquisite wellness gift boxes, making it popular among health-conscious visitors.", "name": "Tong Han Chun Tang Guochao Wellness Mall", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 208 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Must-Buy List: Asia No.1 gold \u0027Fu\u0027 (Fortune) charm beads, Haipai retro silver necklaces, Guochao woven gold thread bracelets. Asia No.1 Gold Jewelry Mall is a household-name local gold brand in Shanghai. Its spacious headquarters in Yuyuan integrates Haipai culture into gold designs. Specializing in gold, platinum, and trendy jewelry, the store offers light-luxury Guochao gold accessories and good-luck gifts tailored for youth, combining transparent pricing with traditional craftsmanship.", "name": "Asia No.1 Gold Jewelry Mall (Headquarters)", "transport": "Take Metro Line 10 to Yuyuan Station, Exit 1, and walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Yu Garden and City God Temple"}};
        const cityName = "Shanghai";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
