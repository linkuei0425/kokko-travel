n-based Disney shuttle bus.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Mulin%2520Boutique%2520Homestay%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Mulin%2520Boutique%2520Homestay%2520Shanghai", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Mulin%20Boutique%20Homestay%20Shanghai", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Mulin%20Boutique%20Homestay%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 789 Qigan Village, Zhoupu Town, Pudong New District, Shanghai, China", "feature": "\u2b50 4.7 stars | Manju Parent-Child Vacation Homestay is dedicated to creating a warm family retreat. It features a large indoor children\u0027s play area, a building block wall, and a picture book corner, ensuring kids have a wonderful time. Rooms are spacious with vibrant designs, offering bunk beds with slides and a full set of children\u0027s care products. Beyond free Disney shuttle services, the homestay offers thoughtful assistance with luggage forwarding directly to the park or airport, making family travel effortless.", "name": "Manju Parent-Child Vacation Homestay Shanghai", "transport": "About a 10-minute drive from Shanghai Disneyland. The homestay offers a free park shuttle service twice daily (morning and evening).", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Manju%2520Parent-Child%2520Vacation%2520Homestay%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss% hanghai\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Homestays"}}, "name": "Shanghai Disney Resort"}, "french-concession": {"categories": {"cat_1": {"items": [{"address": "No. 58 South Maoming Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Located on South Maoming Road in the heart of the Shanghai French Concession, Okura Garden Hotel seamlessly blends a modern main tower with the historic Grand Club building erected in the 1920s. The hotel features nearly 30,000 square meters of lush, flowering classical French gardens. The interior exudes classic Haipai (Shanghai-style) luxury, highlighted by breathtaking dry-dock reliefs and stained-glass skylights in the Baroque ballroom. Here, refined Japanese hospitality intertwines with French romantic elegance, offering top-tier dining and an incomparably graceful stay.", "lat": 31.2209992, "lng": 121.4553839, "name": "Okura Garden Hotel Shanghai", "transport": "About a 3-minute walk from Exit 3 of South Shanxi Road Station (Metro Lines 1, 10, 12)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Okura%2520Garden%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2209992%2C121.4553839", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2209992,121.4553839", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Okura%20Garden%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 118 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | As the first Heritage Hotel for InterContinental Hotels Group in the Asia-Pacific region, InterContinental Shanghai Ruijin spans over 100 mu, serving as a grand private garden estate inside the French Concession. Formerly the private residence of the British Morriss family, it boasts elegant red-brick English villas and expansive lawns. Chiang Kai-shek and Soong Mei-ling held their engagement here, and countless historic figures have left their mark. Staying here offers a deep immersion into rich heritage and refined Haipai elegance, making it a premier choice for a luxury retreat.", "lat": 31.2145689, "lng": 121.4596492, "name": "InterContinental Shanghai Ruijin", "transport": "About an 8-minute walk from Exit 3 of Middle Huaihai Road Station (Metro Line 13)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520InterContinental%2520Shanghai%2520Ruijin", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2145689%2C121.4596492", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2145689,121.4596492", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=InterContinental%20Shanghai%20Ruijin%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 480 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 Stars | Capella Shanghai, Jian Ye Li is currently Shanghai\u0027s only all-Shikumen villa luxury hotel, situated in the Xuhui Hengfu Historical and Cultural Area. The hotel meticulously transforms a preserved 1930s Shikumen estate into private villa suites, retaining classic elements like red-brick walls, horse-head gables, narrow alleyways, and courtyard stone gates. Each three-story villa features a private balcony and rooftop terrace, paired with top-tier private butler service and the Michelin-starred French restaurant Pierre Gagnaire for an exceptionally private, luxurious, and nostalgic Shanghai experience.", "name": "Capella Shanghai, Jian Ye Li", "transport": "About a 6-minute walk from Exit 2 of Zhaojiabang Road Station (Metro Lines 7, 9)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Capella%20Shanghai%2C%20Jian%20Ye%20Li", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Capella%20Shanghai%2C%20Jian%20Ye%20Li%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 12 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Situated on iconic, plane tree-lined Hengshan Road in the French Concession, this hotel features an exterior designed by world-renowned architect Mario Botta and interiors crafted by famed designers Yabu Pushelberg. Built with warm terracotta tiles in geometric forms, the property encloses an elegant Chinese courtyard garden. Rooms seamlessly blend contemporary luxury with traditional Oriental aesthetics. Complete with a top-tier SPA and a climate-controlled pool, it is the perfect sanctuary to experience serenity and chic luxury amidst the lush greenery of the French Concession.", "name": "The Twelve at Hengshan Shanghai", "transport": "About a 1-minute walk from Exit 3 of Hengshan Road Station (Metro Line 1)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520The%2520Twelve%2520at%2520Hengshan%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520The%2520Twelve%2520at%2520Hengshan%2520Shanghai", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20The%20Twelve%20at%20Hengshan%20Shanghai", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=The%20Twelve%20at%20Hengshan%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 30 South Shanxi Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.6 Stars | Built in 1936, the Moller Villa is a fairytale-like Nordic castle-style architecture, reputedly designed by British-Jewish tycoon Eric Moller based on a castle from his daughter\u0027s dream. The exterior is clad in Taishan tiles, featuring staggered pointed spires, intricate wood wainscoting, and vibrant stained glass. Recognized as a Key National Cultural Heritage Site, stepping inside feels like entering a real-world fairytale and walking through history. The hotel offers elegant vintage rooms and garden afternoon tea, rich with romantic legend.", "name": "Hengshan Moller Villa Hotel", "transport": "About a 7-minute walk from Exit 8 of West Nanjing Road Station (Metro Lines 2, 12, 13)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Hengshan%2520Moller%2520Villa%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Hengshan%2520Moller%2520Villa%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Hengshan%20Moller%20Villa%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Hengshan%20Moller%20Villa%20Hotel%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 59 South Maoming Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Jin Jiang Hotel is Shanghai\u0027s most legendary hotel and was the first state guesthouse of the People\u0027s Republic of China, having hosted hundreds of foreign heads of state and government leaders. The main buildings, \u0027Jinbei Building\u0027 and \u0027VIP Building\u0027, were constructed in the 1930s in classic Gothic and European architectural styles, retaining historic wooden paneling and artistic carvings. The hotel features over 10,000 square meters of lush, tree-shaded gardens. Positioned at the intersection of the Middle Huaihai Road commercial area and the French Concession, it offers both bustling convenience and historic tranquility.", "lat": 31.2776253, "lng": 121.5417371, "name": "Jin Jiang Hotel", "transport": "Opposite Exit 3 of South Shanxi Road Station (Metro Lines 1, 10, 12)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Jin%2520Jiang%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2776253%2C121.5417371", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2776253,121.5417371", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Jin%20Jiang%20Hotel%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 7 Donghu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Formerly the private residence of 1930s Shanghai tycoon Du Yuesheng, Donghu Hotel is situated at the prime intersection of Donghu Road and Middle Huaihai Road in the French Concession. The hotel encompasses several historic buildings of varying architectural styles alongside exquisite garden lawns, seamlessly blending old Shanghai Haipai charm with modern amenities. Surrounded by French plane trees, artistic cafes, and bistros, its superior location allows guests to immerse themselves in the legendary era and romantic streets of old Shanghai within a peaceful, private estate setting.", "lat": 31.2186893, "lng": 121.4490548, "name": "Donghu Hotel Shanghai", "transport": "About a 4-minute walk from Exit 7 of South Shanxi Road Station (Metro Lines 1, 10, 12)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Donghu%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2186893%2C121.4490548", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2186893,121.4490548", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Donghu%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 78 Xingguo Road, Changning District, Shanghai", "feature": "\u2b50 4.6 Stars | Situated on elegant Xingguo Road on the western edge of the French Concession, this hotel spans over 70,000 square meters, featuring a rare downtown expanse of sprawling lawns and century-old gardens. Scattered across the grounds are several European-style heritage villas built in the 1920s and 1930s, including the former private residence of the Swire head taipan. The prestigious Radisson Collection brand provides meticulous contemporary 5-star luxury service, complemented by expansive room views over verdant garden scenery\u2014a luxurious oasis away from the urban bustle for experiencing the aristocratic seclusion of old Shanghai.", "name": "Radisson Collection Hotel, Xing Guo Shanghai", "transport": "About an 8-minute walk from Exit 7 of Jiaotong University Station (Metro Lines 10, 11)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Radisson%2520Collection%2520Hotel%252C%2520Xing%2520Guo%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Radisson%2520Collection%2520Hotel%252C%2520Xing%2520Guo%2520Shanghai", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Radisson%20Collection%20Hotel%2C%20Xing%20Guo%20Shanghai", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Radisson%20Collection%20Hotel%2C%20Xing%20Guo%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Luxury 5-Star \u0026 Landmark Hotels"}, "cat_2": {"items": [{"address": "No. 480 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 Stars | Nestled in the Xuhui Hengfu Historical and Cultural Area, this is Shanghai\u0027s only all-Shikumen townhouse luxury hotel. Designed by internationally renowned master designer Jansen, it seamlessly blends French romance with classic Shanghainese Shikumen architectural features. Guests can enjoy private courtyards and rooftop terraces for an exclusive, highly elegant staycation. Complete with a Michelin-starred French restaurant, it is the premier choice for combining nostalgic old Shanghai with ultimate contemporary luxury.", "name": "Capella Shanghai, Jian Ye Li", "transport": "Approx. 8-min walk from Exit 2 of Jiashan Road Station (Metro Line 9)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Capella%20Shanghai%2C%20Jian%20Ye%20Li", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Capella%20Shanghai%2C%20Jian%20Ye%20Li%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 82 Xinle Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Originally the 1930s private clubhouse of old Shanghai triad boss Du Yuesheng, this iconic building was crafted by a French architect. It houses over 300 precious historic artifacts and vintage photos, featuring classic fireplaces, a manual elevator, and vintage crystal chandeliers throughout. Staying here feels like traveling back to the Golden Era of night Shanghai, immersed in nostalgic aristocratic charm and rich historical heritage.", "lat": 31.2300755, "lng": 121.4462628, "name": "Mansion Hotel Shanghai", "transport": "Approx. 5-min walk from Exit 2 of South Shaanxi Road Station (Metro Lines 1/10/12)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Mansion%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2300755%2C121.4462628", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2300755,121.4462628", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Mansion%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 17 Middle Wulumuqi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Tucked away in a bamboo grove on Middle Wulumuqi Road, this hotel was transformed from \u0027Zhu Yuan,\u0027 a 1930s garden villa. The design masterfully balances classic old Shanghai architecture with modern Oriental Zen aesthetics, featuring private courtyard gardens and independent terraces. Guest rooms emphasize natural light, shadow, and organic textures alongside private butler services, creating a tranquil sanctuary for travelers seeking peace in the lively French Concession.", "name": "Cachet Hidden Hotel Shanghai", "transport": "Approx. 6-min walk from Exit 8 of Changshu Road Station (Metro Lines 1/7)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Cachet%2520Hidden%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Cachet%2520Hidden%2520Hotel%2520Shanghai", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Cachet%20Hidden%20Hotel%20Shanghai", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Cachet%20Hidden%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 1331 Middle Fuxing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Located within the famous Blackstone Apartments complex, an eclectic 1924 landmark hailed as \u0027China\u0027s No. 1 Apartment Building.\u0027 Deeply rooted in music and art, the hotel mirrors the Shanghai Symphony Hall right across the street. The interior design blends classic arches and decorative moldings with bold contemporary colors and retro vinyl elements, making it an indispensable design sanctuary for music and architecture enthusiasts.", "name": "Blackstone M+ Hotel Shanghai", "transport": "Approx. 7-min walk from Exit 1 of Middle Huaihai Road Station (Metro Lines 10/13)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https% gn Hotels"}, "cat_3": {"items": [{"address": "No. 428 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | A high-quality mid-range business brand under the Huazhu Group, featuring a minimalist, Zen-inspired Japanese and Oriental aesthetic. The guest rooms are decorated in natural wood tones and equipped with premium Kingkoil mattresses and customized tea sets, ensuring an exceptional sleep and relaxation experience. Superbly located near Madang Road Station (Metro Lines 9 and 13), guests can easily walk to the Xintiandi Shikumen Shopping Area and Tianzifang. The hotel features a buffet breakfast restaurant, a 24-hour self-service laundry room, and smart delivery robots. Offering fantastic value for money, it is the top choice for business travelers and independent tourists.", "name": "Ji Hotel Shanghai Xintiandi Madang Road", "transport": "Take Metro Line 9 or 13 to \u0027Madang Road Station\u0027 (Exit 3), then walk for about 3 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Ji%2520Hotel%2520Shanghai%2520Xintiandi%2520Madang%2520Road", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Ji%2520Hotel%2520Shanghai%2520Xintiandi%2520Madang%2520Road", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Ji%20Hotel%20Shanghai%20Xintiandi%20Madang%20Road", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Ji%20Hotel%20Shanghai%20Xintiandi%20Madang%20Road%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 358 Xujiahui Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | A stylish business hotel known for its vibrant modern design and high-quality audio experience. Rooms are equipped with ergonomic c arden%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2209992%2C121.4553839", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2209992,121.4553839", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Okura%20Garden%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 480 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Located in the Hengfu Historic \u0026 Cultural Area of Xuhui District, this is Shanghai\u0027s only ultra-luxury resort hotel created entirely from converted historic Shikumen townhouse heritage villas. Designed by renowned international designer Jaya Ibrahim, it seamlessly blends 1930s Old Shanghai Shikumen architectural aesthetics with contemporary luxury lifestyles. Each multi-story villa offers exceptional privacy with its own private rooftop terrace and courtyard. The property features Le Comptoir de Pierre Gagnaire, a French restaurant led by a Michelin-starred chef, and the world-class Auriga Spa, delivering an unrivaled sense of prestige and cultural immersion for discerning travelers.", "name": "Capella Shanghai, Jian Ye Li", "transport": "Metro Lines 7, 9 \u0027Zhaojiabang Road Station\u0027, approx. 8 mins walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Capella%2520Shanghai%252C%2520Jian%2520Ye%2520Li", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Capella%20Shanghai%2C%20Jian%20Ye%20Li", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Capella%20Shanghai%2C%20Jian%20Ye%20Li%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 118 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Formerly the famous Ruijin Guest House, this property boasts acres of elegant English royal gardens and several historic heritage villas built in the 1920s. This legendary garden estate served as a residence and event venue for iconic historic figures like Mao Zedong and Chiang Kai-shek. Carefully restored, the interior retains a rich English country estate atmosphere and retro Shanghainese decor, perfectly blended with modern 5-star luxury amenities. Strolling through the grounds among towering ancient trees, quaint bridges, flowing water, and French lawns, guests can enjoy an elegant, quiet sanctuary steeped in history right next to the bustling Huaihai Road shopping district.", "lat": 31.2145689, "lng": 121.4596492, "name": "InterContinental Shanghai Ruijin", "transport": "Metro Line 13 \u0027Middle Huaihai Road Station\u0027, approx. 6 mins walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520InterContinental%2520Shanghai%2520Ruijin", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2145689%2C121.4596492", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2145689,121.4596492", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=InterContinental%20Shanghai%20Ruijin%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 78 Xingguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Nestled within a forest garden in the elegant neighborhood of Xingguo Road id the charm of Xujiahui and Hengshan Road.", "name": "Hualuxe Shanghai Twelve at Hengshan", "transport": "Metro Line 1 \u0027Hengshan Road Station\u0027, approx. 1 min walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Hualuxe%2520Shanghai%2520Twelve%2520at%2520Hengshan", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Hualuxe%2520Shanghai%2520Twelve%2520at%2520Hengshan", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Hualuxe%20Shanghai%20Twelve%20at%20Hengshan", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Hualuxe%20Shanghai%20Twelve%20at%20Hengshan%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 7 Donghu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Situated at the intersection of Donghu Road and Middle Huaihai Road, this garden boutique hotel was once the private residence of a prominent Old Shanghai tycoon, steeped in local legend. The main building and classic garden villas are surrounded by lush French-style grounds and century-old trees. Preserving rich Shanghainese Art Deco details and historic red-brick architecture, the guest rooms are upgraded with retro charm and modern luxury tech. Surrounded by popular trendy restaurants and bars, guests can easily immerse themselves in historic Shanghai romance while stepping out into the city\u0027s cutting-edge nightlife scene.", "lat": 31.2186893, "lng": 121.4490548, "name": "Donghu Hotel Shanghai", "transport": "Metro Lines 1, 10, 12 \u0027South Shaanxi Road Station\u0027, approx. 5 mins walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Donghu%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2186893%2C121.4490548", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2186893,121.4490548", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Donghu%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 516 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Located on the plane tree-shaded Hengshan Road steeped in Old Shanghai atmosphere, this hotel is close to the Xujiahui commercial hub and consular district. It boasts an expansive outdoor garden and extensive indoor health club facilities, including a heated pool and tennis courts. Featuring elegant classical Shanghainese architecture, rooms are bright and spacious, most with private balconies overlooking leafy street canopies or manicured lawns. Surrounded by cozy cafes, galleries, and boutique shops, it serves as an ideal luxurious base for exploring Xujiahui and Hengshan Road on foot (Citywalk).", "name": "Hengshan Garden Hotel Shanghai", "transport": "Metro Line 1 \u0027Hengshan Road Station\u0027, approx. 4 mins walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Hengshan%2520Garden%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Hengshan%2520Garden%2520Hotel%2520Shanghai", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Hengshan%20Garden%20Hotel%20Shanghai", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Hengshan%20Garden%20Hotel%2 iddle Huaihai Road)", "transport": "About a 3-minute walk from Exit 1 of Middle Huaihai Road Station (Metro Line 13)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Shanghai%2520Middle%2520Huaihai%2520Road", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.209418%2C121.4398924", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.209418,121.4398924", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Shanghai%20Middle%20Huaihai%20Road%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 148 Hongqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Crystal Orange highlights a light-luxury modern design style, attracting business professionals and young travelers with its tech-forward, stylish vibe. Ideally situated just steps away from Grand Gateway 66. Guest rooms feature smart voice control systems for lights, curtains, and music, alongside high-end audio systems and ergonomic office chairs. The breakfast buffet serves a rich spread of freshly cooked Chinese and Western cuisine. Avant-garde yet elegant, and very reasonably priced, it\u0027s a top-tier choice for those seeking quality living and business convenience.", "lat": 31.2008911, "lng": 121.4283949, "name": "Crystal Orange Hotel (Shanghai Xujiahui)", "transport": "About a 4-minute walk from Exit 11 of Xujiahui Station (Metro Lines 1/9/11)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Shanghai%2520Xujiahui", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31 /r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2343389%2C121.4824042", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2343389,121.4824042", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=The%20Westin%20Bund%20Center%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 2 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Combining a historic neoclassical heritage building (formerly the Shanghai Club) with the modern, soaring Waldorf Astoria Tower, this hotel is just a short walk from Yu Garden. It features the legendary Long Bar and signature Waldorf Astoria Butler Service. Featuring elegant, opulent room decor, stunning Huangpu River views, and unmatched historical depth, it stands as a premier landmark hotel where ultimate luxury meets rich heritage.", "lat": 31.2357244, "lng": 121.4863049, "name": "Waldorf Astoria Shanghai on the Bund", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station and walk for about 8 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Waldorf%2520Astoria%2520Shanghai%2520on%2520the%2520Bund", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2357244%2C121.4863049", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2357244,121.4863049", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Waldorf%20Astoria%20Shanghai%20on%20the%20Bund%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 505 Jiujiang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Located in the Jiujiang Road and Nanjing East Road commercial district, it offers convenient walking access to Yu Garden and the City God Temple. Designed in a classical European palace style, the hotel boasts a grand atrium lobby and refined luxury guest rooms. With exceptional Chinese and Western dining options and comprehensive leisure and fitness facilities, it offers great value compared to front-row Bund hotels, making it a fantastic high-end choice for exploring Yu Garden and Huangpu District attractions.", "lat": 31.2370564, "lng": 121.4769667, "name": "Grand Central Hotel Shanghai", "transport": "Take Metro Line 1, 2, or 10 to East Nanjing Road Station, Exit 4, and walk for about 3 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Grand%2520Central%2520Hotel%2520Shanghai", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2370564%2C121.4769667", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2370564,121.4769667", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Grand%20Central%20Hotel%20Shanghai%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 20 Nanjing East Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Shanghai\u0027s most legendary century-old landmark hotel, located just a short drive or stroll from Yu Garden. Its iconic green copper pyramid roof is a defining feature of the Bund skyline, while the interior preserves a wealth of 1930s Art Deco details. Having hosted countless celebrities and dignitaries, and featuring daily live performances by the famous Old Jazz Band, staying here feels like stepping back into the golden era of old Shanghai.", "lat": 31.2410848, "lng": 121.485078, "name": "Fairmont Peace Hotel", " ith sleek contemporary style. Upper floors offer panoramic views of the classic Yu Garden pavilions and the Huangpu River. Features an indoor top-floor pool with skyline views. The space employs artistic lines and light interplay to create a stylish, welcoming ambiance, making it a perfect choice for exploring Old Shanghai with a luxurious touch.", "lat": 31.2294872, "lng": 121.4835395, "name": "Renaissance Shanghai Yu Garden Hotel", "transport": "Metro Line 10 or 14 Yuyuan Garden Station Exit 3, about a 2-minute walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Renaissance%2520Shanghai%2520Yu%2520Garden%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D31.2294872%2C121.4835395", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=31.2294872,121.4835395", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Renaissance%20Shanghai%20Yu%20Garden%20Hotel%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 888 Renmin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A Southeast Asian resort-style design hotel tailored for discerning travelers, just steps away from Yu Garden. The lobby and rooms feature elegant wooden tones and Balinese-inspired decor, creating a peaceful urban oasis. The hotel offers complimentary freshly ground coffee, exquisite afternoon tea, and a rich buffet breakfast. Rooms are equipped with premium mattresses and Italian capsule coffee machines, offering great value and attentive, warm service.", "lat": 31.2295153, "lng": 121.4801635, "name": "SSAW Boutique Hotel Shanghai Bund", "transport": "Metro Line 10 Yuyuan Garden Station Exit 4, about a 3-minute walk", "urls": {"agoda": "https://tp.media/r?campaign_id=10 nding modern British style with practical business functionality. Bright and spacious rooms are equipped with dedicated desks, high-speed Wi-Fi, and versatile power outlets, perfect for working travelers. Situated in a prime location, it\u0027s a short walk to Yu Garden and the Jiuqu Bridge, surrounded by vibrant dining options. Excellent comfort and unbeatable value.", "name": "Home Inn Plus (Shanghai Yuyuan The Bund)", "transport": "Approx. 600m walk from Yuyuan Station (Metro Line 10)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DShanghai%2520Shanghai%2520Yuyuan%2520The%2520Bund", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DShanghai%2520Shanghai%2520Yuyuan%2520The%2520Bund", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Shanghai%20Shanghai%20Yuyuan%20The%20Bund", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Shanghai\u0026destName=Shanghai%20Yuyuan%20The%20Bund%2C%20Shanghai\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 170 Renmin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | A classic Chinese chain, Jinjiang Inn is favored by budget-conscious business travelers for its reliable quality and fair prices. Rooms are clean, tidy, and simply styled, featuring restful mattresses and individual air conditioning. Located very close to the heart of the City God Temple area, it captures authentic old Shanghai street life. An on-site restaurant serves a nutritious buffet breakfast, making it a smart choice for location-focused budget travelers.", "lat": 31.2107012, "lng": 121.5164775, "name": "Jinjiang Inn (Shanghai Yuyuan)", "transport": "Approx. 700m walk from Yuyuan Station (Metro Lines 10/14)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\
