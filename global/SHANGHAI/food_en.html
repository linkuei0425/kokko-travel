ggie Steak\u0027 utilizes high-quality shiitake stems and soy protein for a juicy, toothsome bite tossed in a savory-sweet sauce that wows even meat lovers.", "name": "Jujube Tree", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), and walk for about 5 minutes."}, {"address": "2nd Floor, No. 100 North Xiangyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Tucked away in a charming garden villa neighborhood along North Xiangyang Road, this bistro blends Western-style dining with meatless creations, making it a favorite among expats and tourists. The \u0027Margherita Plant Cheese Pizza\u0027 is a standout, featuring a crisp, chewy hand-rolled crust topped with rich, gooey plant-based cheese that rivals dairy. The \u0027Wild Mushroom \u0026 Black Truffle Pasta\u0027 offers perfectly al dente noodles coated in a rich white sauce infused with aromatic truffle for wonderfully complex flavors.", "name": "If Lounge Veggie Bistro", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station (Exit 2), and walk for about 7 minutes."}, {"address": "No. 200, Building C, No. 428 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Nestled in a quiet alley along Madang Road, this serene restaurant radiates Zen calmness and cultural charm. The classic \u0027Stir-Fried Lily Bulbs with Cashews\u0027 offers a sweet, crunchy bite full of nutty aroma. The \u0027Vegetarian Sweet and Sour Ribs\u0027 cleverly uses lotus root sticks and wheat gluten glazed in amber sweet-and-sour sauce; each bite delivers a crispy shell with a delightful lotus root crunch, making it an appetite-whetting favorite for all ages.", "name": "Ji Xiang Cao Vegetarian Restaurant", "transport": "Take Metro Line 9 or 13 to Madang Road Station (Exit 3), and walk for about 4 minutes."}, {"address": "2nd Floor, No. 568 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Located on elegant Jianguo West Road, this serene eatery focuses on nourishing vegetarian fare that highlights the natural flavors of ingredients. The must-order \u0027Truffle \u0026 Wild Mushroom Pot\u0027 features a rich, velvety broth filled with tender, juicy mushrooms. The \u0027Handcrafted Jade Vegetarian Dumplings\u0027 boast delicate, chewy wrappers packed with sweet shepherd\u0027s purse and fresh tofu. Each bite delivers pure, wholesome flavors beloved by health-conscious foodies.", "name": "5Dao Vegetarian", "transport": "Take Metro Line 7 or 9 to Zhaojiabang Road Station (Exit 2), and walk for about 8 minutes."}, {"address": "No. 322 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Situated on stylish Anfu Road, this eatery specializes in creative fusion vegetarian dishes from around the world. The signature \u0027Thai-Style Lime Veggie Fish\u0027 layers seasoned tofu and seaweed to recreate the delicate texture of fish, served with a zesty, spicy-sour lime sauce. The \u0027Avocado Quinoa Salad\u0027 is fresh, crisp, and beautifully layered\u2014making it a top pick for a guilt-free meal after strolling through the French Concession.", "name": "Veggie Master", "transport": "Take Metro Line 1 or 7 to Changshu Road Station (Exit 8), and walk for about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 120 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | One of the most legendary street snacks in Shanghai\u0027s Former French Concession. Pan-fried then oven-baked in a traditional multi-step process, the scallion pancake has an insanely crispy crust with a satisfying crunch, revealing distinct, soft, and juicy layers inside. Rich lard aroma combined with fragrant toasted scallions bursts in your mouth with deep savory notes. It\u0027s the ultimate grab-and-go comfort food that both tourists and old Shanghainese are willing to queue hours for.", "name": "Ada Scallion Pancake (\u963f\u5927\u8525\u6cb9\u9905)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, walk for about 6 minutes"}, {"address": "No. 188 South Chongqing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A classic pan-fried pork bun (Shenjianbao) institution backed by intangible cultural heritage recognition. Using a semi-fermented dough technique, the bottom is fried to a golden, biscuit-like crunch, while the top remains tender and absorbent. Take a small bite, and rich, savory broth gushes out, revealing a firm and juicy pork filling. Paired with aromatic vinegar and a small bowl of wonton soup, it\u2019s the perfect way to experience traditional street breakfast in the French Concession.", "name": "Dongtai Xiang Shenjian (\u6771\u6cf0\u7965\u751f\u714e\u9928)", "transport": "Take Metro Line 10 or 13 to Xintiandi Station, walk for about 8 minutes"}, {"address": "No. 848 South Huangpi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A late-night street food legend whose name cheekily implies these wontons are so delicious you wouldn\u0027t give them up even if you got slapped! The signature deep-fried wontons feature a golden crispy skin filled with juicy pork and shepherd\u0027s purse. Drizzled with a rich house-blend peanut sauce and aromatic vinegar, the sweet, savory, and tangy flavors harmoniously dance on your palate. A must-try classic for retro late-night eats in the French Concession.", "name": "Erguang Wonton (\u8033\u5149\u991b\u98e9)", "transport": "Take Metro Line 9 or 13 to Madang Road Station, walk for about 4 minutes"}, {"address": "No. 887 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | A century-old Shanghainese pastry brand whose takeaway window is one of the most popular sweet stopovers along Huaihai Road. Their signature Tiaotou Gao (rice cake rolls) features soft, chewy glutinous rice wrapped around smooth red bean paste that is delightfully sweet without being cloying. The Qingtuan (green mugwort dumplings) offer thin skins packed with filling and a subtle grassy herb aroma. Grab a treat to enjoy on the go for a taste of old Shanghai sweet memories.", "name": "Shen Da Cheng - Huaihai Branch (\u6c88\u5927\u6210)", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station, walk for about 3 minutes"}, {"address": "No. 308 South Xiangyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.2 stars | A traditional fermented flatbread hidden in the lane corners of the French Concession, sold by weight. Available in oily (richer) or dry (fluffier) varieties, the exterior is pan-seared to a golden crisp and heavily dusted with aromatic white sesame seeds and fresh scallions. The inside is airy and soft like bread, offering a satisfying chew and a subtle, savory salt-and-pepper finish. A truly authentic street snack oozing nostalgic local charm.", "name": "Old Shanghai Qiangbing (\u8001\u4e0a\u6d77\u7f8c\u9905)", "transport": "Take Metro Line 9 or 12 to Jiashan Road Station, walk for about 7 minutes"}, {"address": "No. 9 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | An iconic street combo cherished by generations of Shanghainese. Thick pork chops are fried to crisp perfection while remaining juicy inside, served alongside chewy, non-sticky steamed rice cakes. Smothered in a signature sweet-and-spicy brown sauce, every bite offers a wonderful blend of savory and sweet notes. Strolling down Yandang Road Pedestrian Street with a box of this is pure nostalgia.", "name": "Xiandelai Pork Chop with Rice Cake (\u9bae\u5f97\u4f86\u6392\u9aa8\u5e74\u7cd5)", "transport": "Take Metro Line 1 to South Huangpi Road Station, walk for about 5 minutes"}, {"address": "No. 1008 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | A legendary pastry window showcasing the Haipai (East-meets-West) bakery heritage of the French Concession. Their famed chestnut cake uses real chestnut pur\u00e9e to create a smooth, melt-in-your-mouth texture with natural nutty and creamy flavors without being overly sweet. Their airy, ultra-crispy Shanghainese palmier (butterfly pastry) boasts addictively rich buttery layers, making it the most elegant street treat in the neighborhood.", "name": "Commander Bakery - Huaihai Branch (\u51f1\u53f8\u4ee4\u897f\u9905\u5c4b)", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station, walk for about 2 minutes"}, {"address": "No. 8 Taiyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | A wildly popular seafood snack spot near Sinan Road. Beyond their famous crab roe noodles, their street-side takeaway treats like \u0027Deep-Fried Yellow Croaker Bites\u0027 and \u0027Crab Roe Spring Rolls\u0027 make for amazing stroll bites. The fish nuggets feature a crispy golden coating wrapping around tender, boneless, juice-packed fish. The spring rolls are delightfully crunchy, bursting with rich crab roe and savory pork filling in every bite.", "name": "Xie Huang Yu - Sinan Road (\u87f9\u9ec3\u9b5a)", "transport": "Take Metro Line 9 to Dapuqiao Station, walk for about 8 minutes"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Shanghai French Concession"}, "lujiazui": {"categories": {"cat_1": {"items": [{"address": "5th Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | A century-old iconic Jiangnan dim sum brand known for thin wrappers, generous fillings, and rich soup. The signature Pork Xiaolongbao bursts with rich, flavorful soup upon the first bite\u2014sweet, savory, and never greasy. The Crab Roe Xiaolongbao features rich butter crab roe with an irresistible aroma and a delightfully chewy skin. It is a must-visit traditional culinary landmark in Lujiazui for both tourists and local foodies.", "name": "Nanxiang Steamed Bun Restaurant", "transport": "Metro Line 2 or Line 14, Lujiazui Station, Exit 2; about a 5-minute walk"}, {"address": "8th Floor, L+MALL, Lujiazui Center, No. 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Renowned as one of the most authentic Shanghainese restaurants. The signature \u0027Jesse Braised Pork Belly\u0027 uses premium pork belly with well-balanced layers of fat and lean meat, slow-cooked until melt-in-your-mouth tender, showcasing the rich, savory-sweet flavors characteristic of Jiangnan cuisine. The Scallion Oil Fish Head is covered with fragrant fried shallots, offering tender, silky fish meat that makes it a favorite for family gatherings and business diners alike.", "name": "Jesse Restaurant (Lao Ji Shi)", "transport": "Direct access from Exit 4 of Shangcheng Road Station (Metro Line 9), or about a 10-minute walk from Lujiazui Station (Line 2)"}, {"address": "9th Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | An elegant representative of classic Shanghainese cuisine that elevates traditional flavors. The must-order Saut\u00e9ed River Shrimp features sweet, plump shrimp that pair delightfully with Zhenjiang aromatic vinegar. The Old Shanghai Deep-Fried Crispy Shrimp boasts an edible, crunchy shell with tender, sweet-and-sour shrimp meat inside, showcasing the masterclass heat control and seasoning signature to Shanghainese cooking.", "name": "Shanghai Min", "transport": "Metro Line 2 or Line 14, Lujiazui Station, Exit 2; about a 5-minute walk"}, {"address": "9th Floor, L+MALL, Lujiazui Center, No. 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | A refined brand under the Michelin-starred Yongfu group, specializing in traditional Jiangnan and Ningbo seafood cuisine. The signature Yellow Croaker Noodle Soup features a milky white broth that is extraordinarily rich and fresh without any fishiness, paired with delicate fish that melts in your mouth. The handmade Black Sesame Tangyuan has paper-thin skin and a rich, lava-like sesame filling, demonstrating supreme mastery in traditional noodles and desserts.", "name": "Yongfu Zunxian", "transport": "Direct access from Exit 4 of Shangcheng Road Station (Metro Line 9), or about a 10-minute walk from Lujiazui Station (Line 2)"}, {"address": "LG2 Floor, IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | A traditional Shanghainese restaurant famous for its \u0027Yuan Yuan Braised Pork Belly.\u0027 The pork belly features an alluring ruby-red luster\u2014fatty yet not greasy, tender without being dry\u2014accompanied by braised eggs and tofu knot ties soaked in rich savory sauce. The Sizzling Eel Threads arrive at the table with hot oil still crackling, offering tender, flavorful eel that delights both the eyes and palate.", "name": "Yuan Yuan Restaurant", "transport": "Direct access to IFC Mall from Exit 6 of Lujiazui Station (Metro Line 2 or Line 14)"}, {"address": "3rd Floor, Zhongrong International Mall, No. 1088 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | A century-old brand founded during the Guangxu reign of the Qing Dynasty, widely regarded as one of the birthplaces of Shanghainese cuisine. Its signature \u0027Braised Pork Noodle Soup\u0027 is hailed as the king of Shanghai noodles; the pork is slow-cooked until falling apart, melting instantly into the hot noodle broth to create a deeply rich and flavorful soup. The Crispy Eel Noodles combine crispy eel shreds with a sweet and savory sauce, making this the ultimate place to experience authentic old Shanghai noodle culture.", "name": "Dexing Guan", "transport": "Metro Line 9, Shangcheng Road Station, Exit 3; about a 3-minute walk"}, {"address": "8th Floor, China Resources Times Square, No. 500 Zhangyang Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A famous restaurant steeped in nostalgic 1930s Shanghai Haipai style, recreating classic vintage dishes. The Traditional Stewed Tofu Threads feature a delicate broth thoroughly absorbed by the shredded tofu; the Sweet and Sour Pork Ribs are crispy outside and tender inside with a perfectly balanced glaze; the Stir-fried Beef with Black Truffle and Wild Mushrooms combines traditional techniques with modern culinary elements, earning high praise from locals and tourists alike.", "name": "Shanghai No.1 Private Kitchen", "transport": "Metro Line 9, Shangcheng Road Station, Exit 1; about a 5-minute walk"}, {"address": "2nd Floor, Shanghai Bay Plaza, No. 1138 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | A century-old establishment recognized as an Intangible Cultural Heritage brand, founded during the Guangxu reign and considered the origin of authentic Shanghainese cuisine. The flagship dish \u0027Eight-Treasure Duck\u0027 features duck meat cooked until falling off the bone, stuffed with sticky rice, mushrooms, bamboo shoots, ham, and four other luxury ingredients, offering a rich, savory, and sticky delight. The Steamed Shredded Three Treasures demonstrates exquisite knife skills with paper-thin threads in a clear, delicious soup, making it a must-visit for traditional Shanghai banquet dining.", "name": "Shanghai Old Restaurant", "transport": "Metro Line 9, Shangcheng Road Station, Exit 2; about a 4-minute walk"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "LG2, Shanghai IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | This French bakery and cafe is famous for its signature croissants and handmade French ice cream. Freshly baked croissants feature a golden crust so flaky it shatters at first bite, revealing a soft interior rich with fermented butter aroma; paired with a velvety latte topped with silky foam, or a scoop of smooth, rich salted caramel ice cream, it is immensely popular among financial district professionals and tourists alike.", "name": "Luneurs (Shanghai IFC)", "transport": "Metro Line 2 or Line 14, Lujiazui Station (Exit 6), walk directly into IFC Mall"}, {"address": "LG1, Shanghai IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | A minimalist, crisp white specialty coffee shop located in the heart of Lujiazui\u0027s financial district. Its signature Spanish Latte, enhanced with a dash of condensed milk, is exceptionally smooth and velvety on the palate. The subtle dairy sweetness perfectly balances the deep bitterness and delicate nutty notes of the espresso. With its clean interior design and high-quality latte art, it is the top choice for business professionals and Instagrammers enjoying a morning coffee among the skyscrapers.", "name": "% Arabica (Shanghai IFC)", "transport": "Metro Line 2 or Line 14, Lujiazui Station (Exit 6), direct access upon entering IFC Mall"}, {"address": "B2, Shanghai Tower, No. 479 Lujiazui Ring Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Located inside the Shanghai Tower, the world\u0027s second-tallest skyscraper, offering exceptional value-for-money specialty coffee. The classic iced latte uses premium local fresh milk paired with in-house roasted beans, delivering rich hazelnut and dark chocolate flavor notes with a full-bodied, lingering finish. The unique modern urban vibe and fast-paced yet refined coffee experience make this one of Lujiazui\u0027s most iconic coffee landmarks.", "name": "Manner Coffee (Shanghai Tower)", "transport": "Metro Line 2 or Line 14, Lujiazui Station (Exit 9), about a 5-minute walk"}, {"address": "1F, Shanghai Lujiazui Center L+Mall, No. 899 South Pudong Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | The original pioneer coffee brand from California attracts coffee lovers with its dark roast beans and classic brunch sets. The signature Flat White features thick, silky microfoam, perfectly combining the smoky roast aroma of espresso with the natural sweetness of milk. Paired with a freshly made Aussie brunch platter or a savory ham and cheese croissant, its crispy, rich textures keep you coming back for more, making it a great spot for a relaxing afternoon.", "name": "Peet\u0027s Coffee (Lujiazui Center L+Mall)", "transport": "Metro Line 2, Dongchang Road Station (Exit 3), or Metro Line 9, Shangcheng Road Station (Exit 2), about a 3-minute walk"}, {"address": "1F, Shanghai Lujiazui Center L+Mall, No. 899 South Pudong Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | A pioneer brand of domestic Chinese specialty coffee, known for creative and design-forward spaces. The Cloud Latte and seasonal special creations are true highlights, letting you taste the delicate layers between fruity washed coffee beans and soft milk foam. Complemented by freshly baked upscale light meals and airy chiffon cakes that are soft without being sticky, it is wildly loved by young crowds and tourists.", "name": "Seesaw Coffee (L+Mall)", "transport": "Metro Line 9, Shangcheng Road Station (Exit 2), direct access to L+Mall"}, {"address": "1F, Shanghai Lujiazui Center L+Mall, No. 899 South Pudong Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | A trendy coffee shop featuring a minimalist industrial aesthetic and inventive coffee drinks. The viral Oatmeal Cookie Latte serves rich oat milk latte inside an edible, crunchy chocolate chip cookie cup; sip your coffee while munching on the nutty cookie wall for a fun and multi-textured treat. Its striking visual presentation and unique taste make it a hugely popular photo spot in Lujiazui.", "name": "M Stand (Lujiazui Center L+Mall)", "transport": "Metro Line 9, Shangcheng Road Station (Exit 2), short walk"}, {"address": "LG2, Shanghai IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | A classic cafe and restaurant specializing in European-style artisanal bread and hearty brunches. The signature Eggs Benedict bursts with golden runny yolk when sliced, pairing tender Atlantic smoked salmon with crisp English muffins for a delightfully smooth, multi-layered bite. Matched with a freshly pulled Americano whose bright, mildly bitter profile cuts through the richness of Hollandaise, it is the premier choice for a slow, sophisticated brunch.", "name": "Baker \u0026 Spice (IFC Mall)", "transport": "Metro Line 2 or Line 14, Lujiazui Station (Exit 6), direct access"}, {"address": "1F, Shanghai Lujiazui Center L+Mall, No. 899 South Pudong Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | A stylish lounge space combining all-day brunch with signature fruit teas and coffee blends. The popular gaga All-Day Brunch includes black truffle scrambled eggs, juicy pan-seared Nuremberg-style sausages, and crispy hash browns, offering rich flavors and aromas. Pair it with a refreshingly fruity Peach Oolong Coffee or Cold Brew for a luxurious, delicious, and healthy brunch experience.", "name": "gaga (Lujiazui Center L+Mall)", "transport": "Metro Line 2, Dongchang Road Station (Exit 3), or Metro Line 9, Shangcheng Road Station (Exit 2), short walk"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "1F, River Wing, Pudong Shangri-La, No. 33 Fucheng Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Located inside Pudong Shangri-La, Gui Hua Lou is an iconic restaurant in Lujiazui famous for Huaiyang and local Shanghainese cuisine. Its signature Braised Pork Belly is melt-in-your-mouth tender, rich without being greasy, and perfectly balanced in sweet and savory flavors\u2014a favorite among local gourmets and business diners alike. The Steamed Lion\u0027s Head Pork Meatballs feature a flavorful broth and silky smooth texture. Blending classical oriental aesthetics with modern chic, the decor offers sweeping views of the Huangpu River, delivering top-tier quality in both cuisine and ambiance.", "name": "Gui Hua Lou", "transport": "Metro Lines 2/14 Lujiazui Station, Exit 6, approx. 8 mins walk"}, {"address": "Shop L4-16, IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Honored with a Michelin star, Lu Yuan in the IFC Mall specializes in refined Shanghainese and Huaiyang cuisine. The must-try Roasted Duck boasts crispy skin and juicy meat, served with sweet bean sauce and custom sugar crystals for a richly layered taste. The Mandarin Fish in Sweet and Sour Sauce (Squirrel-shaped Fish) is crispy outside and tender inside, sizzling deliciously as hot sweet-and-sour sauce is poured over it. Combining classical elegance with a modern French bistro flair, it is perfect for a sophisticated dining experience.", "name": "Lu Yuan (IFC)", "transport": "Direct access from Metro Lines 2/14 Lujiazui Station, Exit 6 (IFC Mall)"}, {"address": "58F, The Ritz-Carlton Shanghai, Pudong, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Perched on the 58th floor of The Ritz-Carlton Shanghai, Pudong, FLAIR offers unrivaled panoramic views of the Oriental Pearl Tower and the Bund skyline. As Lujiazui\u0027s premier rooftop bistro bar, it serves Southeast Asian flavors and Asian tapas alongside handcrafted signature cocktails. The charcoal-grilled satay skewers are smoky, juicy, and irresistible when paired with secret peanut sauce. As dusk falls, mesmerizing music and dazzling nightscapes make it an absolute must-visit romantic hotspot for travelers.", "name": "FLAIR Rooftop Restaurant \u0026 Bar", "transport": "Direct access from Metro Lines 2/14 Lujiazui Station, Exit 6"}, {"address": "Shop LG2-L2-17, IFC Mall, No. 8 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | An accessible high-end brand under the acclaimed Yongfu group, Yongfu Zunxian seamlessly blends traditional Ningbo seafood cuisine with a modern bistro vibe. Featuring live seafood air-dropped daily from Zhoushan, its signature Braised Sea Anemone with Sweet Potato Noodles offers a rich, umami-packed flavor and springy texture that is unforgettable. The Yellow Croaker Noodle Soup features a milky-white broth, silky tender fish, and a naturally sweet taste. Its luxurious yet welcoming decor makes it a cherished favorite among local foodies.", "name": "Yongfu Zunxian (IFC Mall)", "transport": "Direct access to IFC Mall Level B2 from Metro Lines 2/14 Lujiazui Station, Exit 6"}, {"address": "91F, Park Hyatt Shanghai, No. 100 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Soaring high on the 91st floor of the Shanghai World Financial Center, Century 100 is one of the highest bistro restaurants in the world. Featuring open kitchens, it combines classic Shanghainese stir-fries, refined Cantonese dishes, and Western grills. The signature Stir-fried Shrimp Spheres with Black Truffle are firm and springy with an enchanting truffle aroma, while the Sizzling Eel in Garlic \u0026 Soy Sauce sizzles enticingly with rich garlic and deep soy flavors\u2014a classic local staple. Dining among the clouds with panoramic views of Shanghai offers an unmatched culinary experience.", "name": "Century 100 (Park Hyatt Shanghai)", "transport": "Metro Lines 2/14 Lujiazui Station, Exit 6, approx. 10 mins walk"}, {"address": "9F, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Located inside Super Brand Mall, Shanghai Min is a landmark destination for classic Shanghainese cuisine. The signature Yan Du Xian (Pork \u0026 Bamboo Shoot Soup) is slow-simmered with salted pork, fresh pork, and spring bamboo shoots into a rich, milky, flavorful broth. The Crab Roe Tofu uses freshly picked hairy crab meat and roe, soaking silky tofu with savory crab flavors. With window seats overlooking the Huangpu River, it\u0027s a stellar choice to enjoy Old Shanghai flavors alongside river views.", "name": "Shanghai Min (Super Brand Mall)", "transport": "Metro Lines 2/14 Lujiazui Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 2967 Riverside Promenade (near Lujiazui West Road), Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | A famous Bavarian-style brewpub bistro located along the Riverside Promenade in Lujiazui, boasting prime front-row views of the Huangpu River. Serving freshly brewed German beers alongside refined local fusion dishes, its signature Roasted Pork Knuckle features delightfully crackling skin and tender, juicy meat served with sauerkraut and special mustard. The outdoor seating area offers unobstructed vistas of the historic Bund architecture across the river, making it immensely popular with expats and tourists alike.", "name": "Paulaner Brauhaus (Riverside Promenade)", "transport": "Metro Lines 2/14 Lujiazui Station, Exit 1, approx. 10 mins walk to Riverside Promenade"}, {"address": "3F, Jin Mao Tower, No. 88 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Located in the core of Lujiazui\u0027s financial district, Su Zhe Hui is an outstanding ambassador of Jiangnan and Shanghainese regional dining. The signature Honey-Glazed Ham (Mi Zhi Huo Fang) selects premium Jinhua ham steamed over low heat to melt-in-your-mouth perfection, delivering a divine balance of sweet and savory notes. The Steamed Taihu Hairy Crab features rich, fragrant roe and sweet, delicate meat. Featuring elegant decor and attentive service, it is a top-tier choice to experience authentic Jiangnan food culture.", "name": "Su Zhe Hui (Lujiazui)", "transport": "Metro Lines 2/14 Lujiazui Station, Exit 6, approx. 7 mins walk"}], "name": "Featured Bistro Bars \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "3F, Shanghai World Financial Center, 100 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | A pinnacle of refined vegetarian dining located inside the Shanghai World Financial Center, seamlessly blending traditional Oriental Zen aesthetics with modern molecular gastronomy. The signature \u0027Grilled Lion\u0027s Mane Mushroom\u0027 is genuinely mind-blowing\u2014crispy and slightly charred on the outside, succulent, juicy, and wonderfully chewy inside, offering a tender texture reminiscent of top-grade filet mignon. Creative dishes like the \u0027Tofu Skin Roll\u0027 and seasonal vegetable platters are presented like poetic paintings. Highly acclaimed by tourists and business professionals for its exquisite plating and artwork-like dishes, it completely overturns traditional vegetarian stereotypes for a serene, ultimate culinary feast.", "name": "Dashu Wujie Vegetarian Delights (SWFC)", "transport": "Metro Line 2 Lujiazui Station, Exit 6, approx. 8-min walk"}, {"address": "5F, Shanghai Tower, 501 Yincheng Middle Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | A luxurious Zen-inspired vegetarian restaurant in the Shanghai Tower, renowned for its high-end wellness concept and exquisite spatial aesthetics. The \u0027Lily Bulb \u0026 Truffle Soup\u0027 comes highly recommended\u2014rich, aromatic, and silky smooth, with truffle fragrance unfolding on the tongue in a warm, layered delight. The \u0027Handcrafted Vegan Steak\u0027, crafted from natural mushrooms, is crispy outside and juicy inside, bursting with rich charred aromas. Loved by foodies seeking health and high quality of life, its immersive tea ceremony experience and meticulous service make it the top choice for high-altitude Zen dining in Lujiazui.", "name": "Yeye Puthi Vegetarian Restaurant (Shanghai Tower)", "transport": "Metro Line 2 Lujiazui Station, Exit 9, direct access to Shanghai Tower"}, {"address": "LG2, Century Link Plaza, 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | An exquisite Lujiazui branch of a century-old vegetarian brand, world-renowned for its legendary \u0027Steamed Vegetable Buns\u0027. The bun skin is soft and fluffy with a pleasant bounce; one bite reveals a vibrant green vegetable filling mixed with diced shiitake mushrooms and dried tofu, exuding a fresh aroma with a hint of sweet sesame oil\u2014crisp, juicy, and never greasy. The \u0027Vegetarian Hot and Sour Soup\u0027 is tangy, appetizing, and features thread-fine shredded tofu. Whether for busy commuters or tourists eager for classic Shanghai-style vegetarian dim sum, this century-old pure flavor earns unanimous praise.", "name": "Chunfeng Songyue Tower (Century Link Plaza)", "transport": "Metro Lines 2/4/6/9 Century Avenue Station, Exit 8, direct access to basement mall"}, {"address": "8F, Super Brand Mall, 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A world-famous century-old Shanghai vegetarian institution located in Super Brand Mall, offering stunning views of the Huangpu River while dining. The signature \u0027Mock Roast Duck\u0027 features layered premium tofu skin, slow-fried to a golden crispy exterior while remaining tender and succulent inside; its savory-sweet flavor perfectly replicates the aromatic chew of traditional Su-style roast duck. The \u0027Mock Crab Meat\u0027 is meticulously stir-fried from carrots and tofu, delivering a dense, smooth texture with a balanced tangy sweetness. Beloved by local Shanghainese and visiting tourists alike, it is a must-visit destination to experience traditional mock-meat craftsmanship.", "name": "Gong De Lin Vegetarian Restaurant (Super Brand Mall)", "transport": "Metro Line 2 Lujiazui Station, Exit 2, approx. 5-min walk"}, {"address": "5F, Century Link Plaza, 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | An innovative wellness vegetarian hot pot featuring Tibetan tea broth, bringing a refreshing and peaceful dining concept to Lujiazui\u0027s modern business district. The signature \u0027Tibetan Tea Spicy Broth\u0027 is numbingly spicy and savory without upsetting the stomach, leaving a light tea nuance. Paired with \u0027Specialty Cauliflower Mushroom\u0027, it turns deliciously crunchy and absorbs the essence of the broth. The \u0027Handmade Veggie Meatballs\u0027 are springy, juicy, and rich in soy flavor. Tourists and health-conscious diners love the individual pot setup and light, guilt-free taste that leaves you feeling refreshed with zero heavy smoke odors on your clothes.", "name": "One Leaf One World Tibetan Tea Vegetarian Hotpot (Century Link Plaza)", "transport": "Metro Lines 2/4/6/9 Century Avenue Station, direct access"}, {"address": "545 Pudong Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | An amazingly budget-friendly vegetarian buffet near the heart of Lujiazui, offering dozens of exquisite plant-based dishes. The signature \u0027Black Pepper Veggie Beef Strips\u0027 are firm and chewy, coated in a rich, savory black pepper sauce. The \u0027Freshly Fried Veggie Spring Rolls\u0027 feature a golden, crispy skin that shatters with a satisfying crunch to reveal sweet, juicy cabbage and shiitake mushroom filling. With rapid dish refills, a wide variety, and a clean, bright atmosphere, it is highly favored by local office workers and health-conscious residents looking for a delicious, affordable feast.", "name": "Su Man Xiang Vegetarian Buffet (Pudong Avenue)", "transport": "Metro Line 14 Pudong Avenue Station, Exit 1, approx. 3-min walk"}, {"address": "2852 Riverside Avenue (Binjiang Da Dao), Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | A tranquil vegetarian haven along Lujiazui\u0027s Riverside Promenade, advocating for natural cooking that highlights the authentic flavors of ingredients without relying on mock meats. The \u0027Charcoal-Grilled Bamboo Shoots\u0027 are highly recommended\u2014tender shoots slow-roasted to sweet, juicy perfection with a light, delicate crunch and subtle smoky aroma. The \u0027Grilled Potatoes\u0027 have a lightly crisp skin and a soft, velvety center, seasoned simply with herb salt for exquisite flavor. Dining here while taking in breathtaking skyline and night views along the Huangpu River makes it a romantic favorite for couples and international visitors alike.", "name": "Wuguantang Vegetarian (Lujiazui Riverview)", "transport": "Metro Line 2 Lujiazui Station, Exit 1, approx. 12-min walk to Riverside Promenade"}, {"address": "6F, China Resources Times Square, 500 Zhangyang Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | A renowned healthy vegetarian restaurant inside China Resources Times Square in Lujiazui, advocating a pure vegan experience free from smoke, alcohol, eggs, and dairy. The signature \u0027Black Pepper Black Fungus \u0026 Mushroom Steak\u0027 is savory, chewy, and rich, elevated by spicy black pepper notes. The \u0027Longevity Noodle Soup\u0027 features a clear broth slow-simmered from diverse vegetables, delivering delicate sweetness paired with springy noodles. With its cozy, minimalist ambiance, it is a go-to spot for health-conscious urban professionals and families seeking additive-free, wholesome dining.", "name": "Jujube Tree Vegetarian (Times Square Pudong)", "transport": "Metro Line 9 Shangcheng Road Station, Exit 2, approx. 5-min walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "B2 Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | One of Shanghai\u0027s most iconic signature street snacks! The pan-fried pork buns have a golden, super crispy bottom that crackles with every bite, encapsulating tender pork filling and piping-hot, rich broth. Taking a bite releases an explosion of savory meat flavor and scallion aroma. With thin skins, crispy bottoms, and juicy filling, they are instantly addictive, drawing long queues of both local office workers and tourists alike.", "name": "Xiao Yang Sheng Jian (Yang\u0027s Fry Dumplings)", "transport": "Metro Line 2 Lujiazui Station, Exit 2, approx. 5 mins walk"}, {"address": "B1 Floor, Super Brand Mall, No. 168 Lujiazui West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 Stars | A century-old legendary bakery specializing in traditional Shanghainese pastries, making it the ultimate grab-and-go sweet treat. The popular \u0027Qingtuan\u0027 (sweet green rice ball) features a chewy, elastic outer crust made from fresh mugwort juice and glutinous rice. Whether filled with classic smooth red bean paste or savory salted egg yolk with pork floss, it perfectly balances sweet and savory flavors. Its soft, non-sticky texture and aromatic herbal fragrance make it a must-buy traditional snack in Lujiazui.", "name": "Shen Da Cheng", "transport": "Metro Line 2 Lujiazui Station, Exit 1, approx. 6 mins walk"}, {"address": "Inside the concourse of Lujiazui Metro Station (near Line 2 station hall), Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Renowned as the home of Shanghai\u0027s best Portuguese egg tarts! Fresh out of the oven, these tarts radiate a rich milky and caramelized aroma. The pastry shell consists of dozens of flaky layers that shatter with light crunch, while the custard filling is melt-in-your-mouth smooth, like steamed milk with perfectly balanced sweetness. Located conveniently in a metro hub, it\u0027s perfect for tourists exploring Lujiazui to grab a box and enjoy piping-hot, crispy treats on the go.", "name": "Lillian Bakery", "transport": "Inside Metro Lines 2/14 Lujiazui Station"}, {"address": "LG Floor, Gala Mall, No. 501 Yincheng Middle Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 Stars | An iconic heritage brand representing traditional Shanghainese street snacks, famous throughout Shanghai for its signature \u0027Crab Shell Pastry\u0027 (Xie Ke Huang). Coated in fragrant white sesame seeds and baked to a golden, crab-shell-like crispiness, it comes in both savory scallion oil and sweet red bean fillings. The delicate flaky layers melt into a rich blend of sesame and butter aromas, delivering an unforgettable nostalgic flavor. A must-try traditional delicacy to experience local market charm in Lujiazui.", "name": "Wang Jia Sha Pastry", "transport": "Metro Line 14 Xiepu Road Station or Pudong Avenue Station, approx. 10 mins walk"}, {"address": "No. 492 Dongchang Road, Pudong New Area, Shanghai (near Lujiazui Commercial Area)", "feature": "\u2b50 4.4 Stars | An authentic street snack rooted in old Shanghai tradition. The scallion pancake is first shallow-fried to a golden crisp, then baked in an oven to render off excess oil, creating an ultra-crispy crust with a subtle smoky aroma. Inside, it\u0027s packed with tender green scallions and rich lard, yielding a heavenly crisp-outside, soft-inside texture filled with scallion aroma. Biting into a fresh, hot pancake offers a delightful crunch and savory taste that keeps locals and visitors coming back for more.", "name": "Tilanqiao Shanghai Scallion Pancake", "transport": "Metro Line 2 Dongchang Road Station, Exit 3, approx. 3 mins walk"}, {"address": "B1 Floor, L+MALL Lujiazui Center, No. 899 Pudong South Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 Stars | A trendy eatery redefining traditional street jianbing (Chinese savory crepes). Made to order, mung bean batter is spread into a thin crepe, topped with a fresh egg, brushed with house-special sweet bean sauce and chili paste, sprinkled with scallions and cilantro, and wrapped around a crispy wonton cracker (\u0027baocui\u0027) and tender meat slices. The soft-yet-crunchy, multi-layered bite blends deliciously with the flavorful sauce and hot crepe\u2014an ideal street delicacy to hold in one hand while strolling.", "name": "Capital Jianbing", "transport": "Directly connected to Metro Line 9 Shangcheng Road Station, Exit 2"}, {"address": "No. 290 Pudong Avenue, Pudong New Area, Shanghai (near Lujiazui Ring Road)", "feature": "\u2b50 4.2 Stars | A classic stall-style snack recreating the authentic vibe of old Shanghai\u0027s alleyway food markets. Paper-thin pork wontons float in boiling water before being served in a flavorful, clear broth seasoned with lard, seaweed, egg strips, and pickled mustard greens. The skin is silky-smooth, the meat filling juicy and firm, and the broth warm and comforting. This authentic hot soup snack brings a comforting touch of local life and cozy warmth to the skyscraper-filled district of Lujiazui.", "name": "Old Shanghai Firewood Wonton", "transport": "Metro Line 14 Pudong Avenue Station, Exit 1, approx. 5 mins walk"}, {"address": "Old Shanghai Food Street, LG2 Floor, Century Link Plaza, No. 1192 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 Stars | A trendy street-style fried skewer snack sweeping across China. Premium ingredients like meat skewers, baby potatoes, squid, and fresh vegetables are quick-fried at high temperatures to lock in moisture, then dusted with a signature house blend of pepper salt and cumin spices. Crispy on the outside yet tender and juicy inside, it offers a mouthwatering aroma with a pleasant kick. Served in convenient paper bags, it\u0027s a fun, portable snack perfect for munching while wandering market streets.", "name": "Kuafu Fried Skewers", "transport": "Directly connected to Metro Lines 2/4/6/9 Century Avenue Station, Exit 8"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Lujiazui"}, "xintiandi-tianzifang": {"categories": {"cat_1": {"items": [{"address": "No. 588 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | A centuries-old iconic restaurant on Huaihai Road known for long queues and famous for its pan-baked fresh pork mooncakes made on-site. The mooncake features flaky, golden-crisp layers infused with rich lard aroma, packed with tender, selected pork hindquarter meat. One hot bite releases a burst of delicious, savory juice with a perfect balance of savory and sweet. Beyond mooncakes, its soy-sauce duck and cold appetizers are daily sought-after favorites among local Shanghainese, loved by tourists and residents alike.", "name": "Guangming Village Restaurant (\u5149\u660e\u90a8\u5927\u9152\u5bb6)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 428 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Established during the Guangxu reign of the Qing Dynasty, this China Time-Honored Brand is a top choice to experience authentic Shanghainese everyday food culture. Its \u0027Three-Delicacy Small Wontons\u0027 and \u0027Pan-Fried Buns\u0027 (Shengjianbao) are highly praised. The wonton skins are paper-thin with tender filling in a light, refreshing seaweed and egg drop broth. The pan-fried buns boast a golden, crispy bottom and fluffy dough that gushes delicious savory juice with every bite. Classic traditional craftsmanship and affordable prices keep it bustling all year round.", "name": "Dafugui Restaurant (\u5927\u5bcc\u8cb4\u9152\u6a13)", "transport": "Take Metro Line 9 or 13 to Madang Road Station (Exit 3), then walk for about 5 minutes."}, {"address": "No. 689 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A decades-old brand preserving the essence of Suzhou-style noodles, famous for its smooth noodles and rich, carefully brewed broth. The signature Scallion Oil Noodles with Dried Shrimp features scallions fried until intensely fragrant, tossed with special soy sauce and large dried shrimp for a chewy, flavor-packed bite. The Crab Roe Noodles are rich and velvety, coating every strand with luxurious crab roe for a complex texture that captures nostalgic Suzhou-style flavors.", "name": "Canglang Pavilion (\u6ec4\u6d6a\u4ead)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 3), then walk for about 2 minutes."}, {"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A historic Shanghai bakery with a charming vintage French feel, famously featured in the works of author Eileen Chang. Its classic Curry Beef Pastry has a flaky, layered crust wrapping a rich, savory beef filling. The signature Binggao (Ice Cake) offers a snow-like, smooth, melt-in-your-mouth texture with a rich milky flavor and crunchy nut bits. These classic pastry creations blending Shanghainese and French techniques make for a nostalgic walk-and-eat snack along Huaihai Road.", "name": "Lao Da Chang Bakery (\u8001\u5927\u660c)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 41 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A budget-friendly traditional noodle and dim sum brand beloved by locals, famous for its yeast-leavened pan-fried pork buns. Topped with scallions and white sesame, the buns feature a golden, crispy bottom and juicy meat filling wrapped in fluffy dough that absorbs every drop of savory broth. Pair it with a steaming bowl of Fried Tofu and Vermicelli Soup for a classic, comforting Shanghai street breakfast experience.", "name": "Fengyu Pan-fried Buns (\u8c50\u88d5\u751f\u714e)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 2), then walk for about 6 minutes."}, {"address": "No. 288 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A renowned historic food store located near the entrance of Tianzifang on Taikang Road, celebrated for traditional Suzhou-style pastries and seasonal specialties. Its signature Fresh Pork Mooncakes and YanduXian (Salted Pork \u0026 Bamboo Shoot) Mooncakes wrap Shanghai\u0027s classic soup flavor into buttery, flaky crusts. Each bite blends crisp pastry with tender, juicy pork, crunchy spring bamboo shoots, and rich cured meat, creating an amazing layered texture that makes a perfect local souvenir.", "name": "Taikang Food Specialty Shop (\u6cf0\u5eb7\u98df\u54c1)", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), then walk for about 2 minutes."}, {"address": "No. 36 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Located on Sinan Road near Tianzifang, this famous eatery holds sweet food memories for generations of locals and is renowned across Shanghai for its exquisite Yellow Croaker Noodles. Fresh yellow croaker is deboned and descaled, yielding melt-in-your-mouth fish fillets, while the broth is slow-simmered from fish bones into a milky white, rich, and sweet soup without any fishiness. Served with smooth, springy noodles, every bite captures the fresh essence of the sea.", "name": "A Niang Noodle Restaurant (\u963f\u5a18\u9eb5\u9928)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 171 Ji\u0027an Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Founded during the Guangxu period of the Qing Dynasty, this master establishment of Shanghainese local cuisine and noodle craft is hailed as the birthplace of authentic Shanghai cooking. Its signature Stewed Pork Noodles is considered the premier bowl of noodles in the city; generous cuts of pork are slow-stewed for hours until tender, juicy, and rich without being greasy. Stirred gently into hot broth, the meat melts into a fragrant, savory finish that showcases the deep heritage of traditional Shanghai culinary arts.", "name": "Dexing Guan Restaurant (\u5fb7\u8208\u9928)", "transport": "Take Metro Line 8 or 10 to Laoximen Station (Exit 5), then walk for about 6 minutes."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Ground Floor, Building 5, Xintiandi North Block, Lane 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | A high-end French casual bistro and brunch spot helmed by three-Michelin-starred chef Paul Pairet. The signature French Toast features a golden, crispy caramel crust with a custard-like soft interior that melts in your mouth with rich aromas of butter and caramel. The Eggs Benedict boasts a silky, runny poached egg paired with rich hollandaise sauce and tangy sourdough, offering rich layers of flavor beloved by foodies.", "name": "Polux by Paul Pairet", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 1), then walk for about 3 minutes."}, {"address": "1F, Xintiandi Plaza, No. 333 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | A retro French bakery, ice cream, and brunch cafe known for freshly baked croissants and artisanal gelato. The signature Butter Croissant has a perfect honeycomb interior with a delightfully satisfying crunch and rich French butter aroma. The brunch plates come with sunny-side-up eggs, smoked salmon, and fresh salad greens\u2014refreshing and satisfying, making it a hugely popular photo spot in the Xintiandi area.", "name": "Luneurs (Xintiandi Plaza)", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2) for direct access."}, {"address": "No. 234 Nanchang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | A specialty coffee shop nestled in a historic lane house neighborhood on Nanchang Road, famous for lever espresso machines and unique Dirty coffees. The signature Pistachio Dirty pours hot espresso directly over cold pistachio nut milk. The first sip delivers the fruity acidity and gentle bitterness of espresso, followed by the cool, creamy pistachio milk and crushed nut texture\u2014a distinct contrast of temperatures and flavors.", "name": "Metal Hands (Nanchang Road)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 2), then walk for about 6 minutes."}, {"address": "Inside No. 50 Ruijin 2nd Road (near Middle Fuxing Road), Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | A minimalist, tranquil coffee sanctuary hidden in a vintage courtyard near Tianzifang. It highlights specialty pour-over coffee and homemade desserts. The signature Oat Milk Latte features silky microfoam with coffee notes of natural nut and cocoa sweet aromas. Their Cheesecake has a velvety, smooth texture with a pleasant touch of tartness and rich creaminess\u2014a perfect secret hideaway for a slow brunch in the bustling city.", "name": "Caf\u00e9 On Air (Ruijin 2nd Road)", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 5), then walk for about 8 minutes."}, {"address": "No. 527 Middle Fuxing Road (Inside Sinan Mansions), Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | A classic French bakery and brunch cafe situated within the historic Sinan Mansions. The signature Avocado Sourdough Toast features naturally fermented sourdough with a crispy, chewy crust and moist interior, topped with ripe sliced avocado and a poached egg for a silky bite. Their French Pistachio Choux pastry has a crunchy shell oozing with rich pistachio cream\u2014an exquisite choice for enjoying French flair beneath plane trees.", "name": "PAIN CHAUD (Sinan Mansions)", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 5), then walk for about 7 minutes."}, {"address": "Unit E06, 1F, Hubin Dao Shopping Center, No. 150 Hubin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | A concept cafe and organic grocery restaurant emphasizing farm-to-table freshness. The popular Black Truffle Wild Mushroom \u0026 Avocado Brunch Platter pairs warm, nutty whole-wheat bread with aromatic saut\u00e9ed wild mushrooms and creamy ripe avocado\u2014juicy, flavorful, and guilt-free. The bright, spacious venue exudes the cozy charm of a Western market, making it ideal for casual gatherings.", "name": "Green \u0026 Safe (Hubin Dao)", "transport": "Take Metro Line 8 or 10 to Laoximen Station (Exit 5), then walk for about 6 minutes."}, {"address": "B2, Xintiandi Plaza, No. 333 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | A pioneer of China\u0027s specialty coffee movement, featuring modern design integrated with lush greenery. The signature Cloud Latte combines microfoam with rich house espresso, crafting a light, cloud-like smooth texture. Pair it with a freshly made Black Truffle Ham Croissant Sandwich, featuring flaky pastry wrapping savory ham and melted cheese for a mouthwatering bite.", "name": "Seesaw Coffee (Xintiandi Plaza)", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), directly connected to the underground concourse; walk about 1 minute."}, {"address": "No. 110 Yongjia Road (near South Xiangyang Road), Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | A cozy retro brunch favorite near Tianzifang, famous for handcrafted naturally fermented sourdough. The signature Black Truffle Eggs Benedict sourdough features a crusty, chewy sourdough base topped with a poached egg that bursts with golden yolk, rich black truffle sauce, and fresh greens. Juicy, full-flavored, and paired perfectly with fresh fruit smoothies, it offers a quintessentially popular slow-living brunch experience in the former French Concession area.", "name": "O\u0027Mills Bakery \u0026 Diner (Yongjia Road)", "transport": "Take Metro Line 9 to Jiashan Road Station (Exit 2), then walk for about 7 minutes."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "South Block Xintiandi, No. 338 Huangpi South Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located inside a classic Shikumen building in Xintiandi, this traditional Shanghainese bistro reinvents local cuisine with modern sophistication. The signature braised pork belly is melt-in-your-mouth tender without being overly rich, coated in a thick, savory-sweet glaze. The crispy-skin chicken is delightfully crunchy on the outside and tender inside. Pair your meal with curated wines or unique Huangjiu (yellow wine) cocktails for an experience that seamlessly blends Old Shanghai nostalgia with modern chic. A favorite among foodies worldwide.", "name": "Ye Shanghai", "transport": "Metro Line 10 or 13, Xintiandi Station, Exit 6; approx. 3-minute walk."}, {"address": "Building 5, North Block Xintiandi, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Created by three-Michelin-starred chef Paul Pairet, this all-day French bistro offers a relaxed Parisian ambiance. The French Toast is crispy outside, soft inside, and rich with milky aromas, while the tender pan-seared steak topped with signature herb butter provides an exceptionally rich flavor profile. Complete with crafted cocktails or a glass of fine red wine, it\u0027s a top trendy spot for dining and drinking in Xintiandi.", "name": "Polux by Paul Pairet", "transport": "Metro Line 10, Xintiandi Station, Exit 1; approx. 5-minute walk."}, {"address": "Building 22, North Block Xintiandi, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Combining an organic market with a French-inspired casual bistro, Green \u0026 Safe is famous for farm-to-table fresh ingredients. The truffle mushroom pizza features a crispy crust and a rich, fragrant truffle aroma, perfectly complemented by tender roasted chicken and curated natural wines. Light, refreshing, and clean, its elegant wooden-industrial decor makes it a favorite among hipsters and health-conscious travelers.", "name": "Green \u0026 Safe (Xintiandi)", "transport": "Metro Line 10, Xintiandi Station, Exit 1; approx. 4-minute walk."}, {"address": "Building 19, North Block Xintiandi, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A pioneer of Shanghai\u0027s craft beer scene, this popular gastropub serves award-winning local microbrews and American comfort food. The signature mini beef sliders are juicy and packed with melted cheese, paired perfectly with crispy signature fried chicken and citrusy craft IPAs that cut through the richness. It is a bustling night spot popular with expats and local youth.", "name": "Boxing Cat Brewery (Xintiandi)", "transport": "Metro Line 10, Xintiandi Station, Exit 1; approx. 4-minute walk."}, {"address": "Buildings 10-12, North Block Xintiandi, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located in the heart of Xintiandi, this American bistro \u0026 bar features live jazz performances and high-end American grill items. The charcoal-grilled Angus ribeye steak boasts a charred outer crust and juicy center, paired with rich black pepper sauce and handcrafted cocktails. With its vibrant yet romantic vibe, guests can soak in Xintiandi\u0027s chic nightlife accompanied by soulful music.", "name": "Calix Bistro \u0026 Bar", "transport": "Metro Line 10, Xintiandi Station, Exit 1; approx. 5-minute walk."}, {"address": "Backyard of No. 7 Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Tucked deep inside the Shikumen alleyways of Tianzifang, this outdoor courtyard bistro is famous for its giant fishbowl Margaritas. Offering Mediterranean tapas and rich seafood paella cooked in savory broth, it provides a cozy, relaxed outdoor dining experience in a historic alleyway setting\u2014perfect for travelers seeking exotic flair and casual vibes.", "name": "Tianzifang Commune", "transport": "Metro Line 9, Dapuqiao Station, Exit 1; approx. 5-minute walk."}, {"address": "Building 19, North Block Xintiandi, No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Housed within a classic Shikumen building, this Bavarian-style brewpub offers freshly brewed wheat beer and authentic German feasts. The German roasted pork knuckle boasts crackling crispy skin and juicy tender meat, served alongside sauerkraut and creamy mashed potatoes. Its immersive rustic decor and warm hospitality make for a memorable evening.", "name": "Paulaner Br\u00e4uhaus Shanghai (Xintiandi)", "transport": "Metro Line 10, Xintiandi Station, Exit 1; approx. 4-minute walk."}, {"address": "No. 338 Huangpi South Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A highly representative fine dining spot for Shanghainese and Jiangnan cuisines, serving local classics in a modern, elevated setting. The signature Honey-Glazed Ham (Mizhi Huofang) offers a melt-in-your-mouth balance of sweet and savory notes, while the Camphor and Tea-Smoked Duck features crispy skin and aromatic meat. Paired with fine aged Huangjiu or Chinese wines, it is an exquisite venue for experiencing authentic regional dining.", "name": "Jade Garden (Xintiandi)", "transport": "Metro Line 10 or 13, Xintiandi Station, Exit 6; approx. 3-minute walk."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 453 Middle Fuxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Godly is a century-old vegetarian brand in Shanghai, famous for its exquisite craft of making plant-based ingredients mimic real meat dishes. Its iconic Mock Duck with Shiitake Mushrooms and Vegetarian Ham offer rich layers of texture. Tofu skin wraps shiitake mushrooms and black fungus, which are slow-fried and simmered in a secret sauce to create a crispy-on-the-outside, tender-on-the-inside bite with a slightly sweet and savory Shanghai-style flavor. Both tourists and locals highly praise its unique artistry in replicating authentic meat-like chewy textures.", "name": "Godly Vegetarian Restaurant", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 5), then walk for about 6 minutes."}, {"address": "No. 88 Songshan Road, Huangpu District, Shanghai (near Xintiandi Commercial Area)", "feature": "\u2b50 4.6 Stars | Jujube Tree focuses on healthy, delicate vegetarian dishes made without MSG and low in oil and salt. The signature Black Pepper Vegetarian Beef Tenderloin features carefully cooked premium monkey head mushrooms (lion\u0027s mane), yielding a juicy and uniquely chewy texture paired with a rich black pepper sauce that bursts with flavor without any earthy mushroom taste. The serene, Zen-like atmosphere draws many young foodies and international tourists seeking a light, guilt-free meal.", "name": "Jujube Tree", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), then walk for about 3 minutes."}, {"address": "L3-15, Xintiandi Plaza, No. 333 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Located inside Xintiandi Plaza, this futuristic dining concept store fuses plant-based meats into international cuisine. Its OmniMeat Future Burger and OmniPork Dan Dan Noodles are highly acclaimed; the plant-based patties are seared to perfection with an enticing aroma, paired with custom savory sauces and crisp lettuce\u2014matching real meat in both bite and taste. With futuristic decor and innovative flavors, it has become a hot spot for trendy plant-based food lovers.", "name": "Green Common", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), directly connected to Xintiandi Plaza."}, {"address": "L1-E06, Hubindao Shopping Center, No. 150 Hubin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | A quintessential Western vegan casual restaurant in the Xintiandi area. The signature Mexican Rainbow Power Bowl and Pink Beetroot Burger are customer favorites. The power bowl combines roasted bell peppers, avocado, black beans, and a custom tahini/sesame dressing, offering vibrant textures, a refreshing crunch, and rich high-fiber nutrition. The cozy, bright setting attracts professionals working nearby and health-conscious international tourists.", "name": "Pure \u0026 Whole", "transport": "Take Metro Line 8 or 10 to Laoximen Station (Exit 5), then walk for about 8 minutes."}, {"address": "B2, Xintiandi Style II, No. 338 Zizhong Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | A century-old vegetarian establishment in Shanghai, famous across town for serving \u0027Shanghai\u0027s #1 Vegetable Steamed Bun.\u0027 Freshly steamed, the pillowy bun encase a juicy, vibrant green filling of leafy greens, shiitake mushrooms, and dried tofu strips tossed in pure vegetable oil. It\u0027s refreshing, non-greasy, and subtly sweet. Their clear-broth vegetarian noodles are also a masterpiece, featuring a rich, flavorful broth\u2014a top choice for experiencing traditional Shanghai plant-based noodle dishes.", "name": "Spring Sun Yue Lou", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 1), directly connected."}, {"address": "Near Gate 21, Tianzifang, No. 274 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | Tucked away in the Shikumen alleyways of Tianzifang, this cozy bistro specializes in Truffle \u0026 Wild Mushroom Plant-Milk Pasta. Crafted with assorted wild mushrooms and a rich oat milk sauce, the pasta absorbs the savory flavors into a velvety smooth texture infused with aromatic truffle notes. Its retro, hipster-chic vibe perfectly complements the alley charm, making it a popular spot for a light, relaxing meal after exploring Tianzifang.", "name": "D\u0027Life Plant-Based Bistro", "transport": "Take Metro Line 9 to Dapuqiao Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 30 Sinan Road, Huangpu District, Shanghai (near Middle Fuxing Road)", "feature": "\u2b50 4.5 Stars | Located near Sinan Mansions, this modern Chinese Zen-inspired vegetarian tea house serves exquisite specialties like Bamboo Fungus \u0026 Matsutake Mushroom Soup and Handcrafted Vegetarian Steamed Dumplings. Slow-simmered for hours, the broth tastes rich and naturally sweet, while the tender bamboo fungus soaks up the savory broth for marvelous depth. With elegant Song Dynasty-style food presentation and tranquil garden views, guests enjoy a relaxing feast for both the eyes and palate.", "name": "Leaves Play Vegetarian Tea House", "transport": "Take Metro Line 10 or 13 to Xintiandi Station (Exit 5), then walk for about 7 minutes."}, {"address": "3F, Shanghai Plaza, No. 138 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | An individual hot pot restaurant featuring Tibetan tea broth bases. The signature Tibetan Tea Wild Mushroom Hot Pot comes with a curated platter of wild mushrooms from Tibet. The rich broth carries a subtle tea aroma; cooking fresh mushrooms and plant protein inside yields a tender, juicy bite with natural sweetness. Its health-conscious concept and cozy solo-dining setup are popular among city office workers and trendsetting travelers.", "name": "One Leaf One World Tibetan Vegetarian Hotpot", "transport": "Take Metro Line 8 to Dashijie Station (Exit 3), then walk for about 4 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "B1 Floor, Xintiandi Metro Station, No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Hailed as \u0027Shanghai\u0027s best Portuguese egg tart,\u0027 its multi-layered pastry is ultra-flaky with a satisfying crunch in every bite. The egg yolk filling is rich, silky smooth, and perfectly balanced in sweetness. Fresh out of the oven, each bite blends milky rich flavor with a delicate caramelized aroma. This portable treat is a top-tier snack\u2014it\u0027s common to see commuters and tourists alike carrying a box straight out of the Xintiandi subway station.", "name": "Lillian Bakery", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 and access directly via the underground passage."}, {"address": "No. 636 Middle Huaihai Road, Huangpu District, Shanghai (Near Sinan Road, close to Xintiandi)", "feature": "\u2b50 4.5 stars | A century-old traditional pastry shop famous for its classic green rice balls (Qingtuan), featuring a thin, delightfully bouncy crust infused with a faint mugwort aroma. Fillings like salted egg yolk with pork floss deliver a sweet-savory crunch, while the red bean paste is soft and velvety. Their Tiaotou Cake, rolled with sweet bean paste and scented with osmanthus, is deliciously soft and chewy. Drawing big crowds every weekend and spring season, it\u0027s an essential street snack to taste Old Shanghai\u0027s sticky rice dessert culture.", "name": "Shen Da Cheng", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 (Exit 1), then walk for about 3 minutes."}, {"address": "Alleys inside Tianzifang, Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Named after its crabapple flower shape, Haitang Cake is an iconic Old Shanghai traditional street dessert. Freshly baked with a shiny, paper-thin caramel glaze on top, biting into its crisp exterior reveals a piping-hot, velvety red bean filling inside a soft dough pastry. The fragrant caramel scent wafting from the live baking stalls in Tianzifang\u0027s alleys makes it a classic favorite to enjoy while exploring the historic lanes.", "name": "Old Shanghai Haitang Cake", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 (Exit 1), then walk about 3 minutes into Tianzifang."}, {"address": "Near No. 120 Ruijin 2nd Road, Huangpu District, Shanghai (Near Tianzifang and Sinan Road)", "feature": "\u2b50 4.4 stars | Crafted using the traditional technique of pan-frying followed by oven-baking, these pancakes are made with savory lard and generous amounts of fresh scallions. Served piping hot and intensely aromatic, they feature a golden crispy crust and distinct inner layers rich in savory scallion flavor\u2014crispy outside, tender inside, and never greasy. A genuine local favorite that offers a true taste of everyday Shanghai street life near Xintiandi.", "name": "Old Shanghai Scallion Pancake", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 or Metro Line 9 to \u0027Dapuqiao Station\u0027, then walk about 8 minutes."}, {"address": "Near Gate 1, Tianzifang, Lane 248 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A handcrafted egg tart bakery famous for its signature \u0027368-layer puff pastry.\u0027 The outer shell is impossibly light and flaky, crumbling delicately with every bite, while the sweet egg custard filling is smooth and pudding-like. Popular among younger crowds and tourists, the intoxicating scent of fresh baking and beautiful packaging make it nearly impossible to walk through Tianzifang without grabbing one to enjoy on the go.", "name": "Queen Sophie", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 (Exit 1), then walk about 2 minutes."}, {"address": "No. 252 Taikang Road, Huangpu District, Shanghai (Opposite Tianzifang)", "feature": "\u2b50 4.3 stars | A historic eatery right across from Tianzifang, famous for its giant crab roe soup dumplings (Tangbao) and pan-fried pork buns. The huge dumpling features a thin yet durable wrapper; gently sipping through a straw fills your mouth with golden, rich crab roe broth that is sweet, flavorful, and entirely free of fishiness. Generously filled and perfect when paired with fragrant vinegar, it is a top destination for experiencing authentic Shanghai soup dumplings.", "name": "Taikang Soup Dumplings", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 (Exit 1), then walk about 1 minute."}, {"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai (Near Sinan Road and Xintiandi)", "feature": "\u2b50 4.5 stars | A classic Haipai-style bakery celebrated in the works of legendary author Eileen Chang. Its signature \u0027Ice Cake\u0027 sits wonderfully between ice cream and whipped cream cake\u2014melting instantly on the tongue with rich dairy creaminess and crunchy walnut bits without being overly sweet. Their curry beef pastry is equally delicious, featuring a flaky golden crust and juicy, spiced filling. A nostalgic taste of old Shanghai that shouldn\u0027t be missed while visiting Xintiandi and Sinan Road.", "name": "Lei Da Chang", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 (Exit 1), then walk about 4 minutes."}, {"address": "Near No. 155 Middle Jianguo Road, Huangpu District, Shanghai (Stalls near the back gate of Tianzifang)", "feature": "\u2b50 4.1 stars | Deep-fried rice cake (Cifangao) is a beloved classic street snack in Shanghai. Pressed glutinous rice blocks are fried to a brilliant golden crisp on the outside while remaining soft, chewy, and savory inside, lightly seasoned with scallions and broth. The satisfying contrast between crispy and soft makes this humble local snack one of the most tempting piping-hot treats to enjoy around the old lane houses.", "name": "Old Shanghai Deep-fried Rice Cake", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 (Exit 1), then walk about 5 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Xintiandi and Tianzifang"}, "xujiahui-huaihai": {"categories": {"cat_1": {"items": [{"address": "No. 588 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Guangming Village is an iconic time-honored landmark on Middle Huaihai Road with an ever-present queue. It is famous far and wide for its unparalleled traditional Shanghainese cooked delis and freshly baked meat mooncakes. Its signature freshly baked meat mooncakes feature layers of flaky, crispy crust that crumble upon first bite, stuffed with a juicy, savory pork filling. Served piping hot, the succulent juices burst in your mouth with a perfectly balanced sweet and savory flavor that keeps people coming back for more. The sauce-marinated duck at the cooked food window boasts a glossy reddish-brown skin and firm meat soaked in thick, sweet sauce, offering an irresistible interplay of sweet and savory notes. Tourists and Shanghainese locals alike gladly stand in line for hours just for a taste of this classic flavor passed down through decades.", "name": "Guangming Village Restaurant", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 3, approx. 3-minute walk"}, {"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Founded during the Guangxu era of the Qing Dynasty, Lao Ren He Restaurant is a centuries-old, highly representative Shanghainese landmark in the Huaihai Road commercial area, especially famous for its unmatched drunken/lees-cured (\u0027Zao\u0027) culinary techniques. The signature Drunken Chicken uses premium Sanhuang chicken immersed in special rice wine lees, yielding silky, elastic skin and tender, juicy meat infused with a deep, subtle aroma of aged wine and a sweet lingering finish. The drunken pig trotter and drunken shrimp are equally superb\u2014crispy, non-greasy, with wine aromas penetrating to the bone. This cold dish mastery, taking ancient curing techniques to perfection, makes it a must-visit destination for foodies and tourists eager to experience authentic old Shanghai culinary culture.", "name": "Lao Ren He Restaurant", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 3, approx. 2-minute walk"}, {"address": "No. 845 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | Situated on Middle Huaihai Road, Red House Restaurant is the pioneer and quintessential icon of Haipai (Shanghainese-style) Western cuisine, holding romantic memories for generations of old Shanghainese. The classic Baked Clams French Style bakes tender clam meat with garlic butter and melted cheese, creating a rich, velvety bite where oceanic sweetness meets creamy indulgence. The Borscht, slow-simmered with tomatoes and tender beef, is savory, tangy, and appetite-whetting. Skillfully blending French techniques with Oriental tastes, its elegant nostalgic ambiance and classic flavors allow diners to step back in time to relive Shanghai\u0027s modern golden age.", "name": "Red House Restaurant", "transport": "Metro Line 1/10/12 South Shaanxi Road Station, Exit 2, approx. 3-minute walk"}, {"address": "No. 311 South Xiangyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Qiao Jia Zha is a century-old brand specializing in traditional Jiangnan rice cakes and pastries, deeply rooted in Xuhui District. Its classic Strip Cake (Tiaotou Gao) features a chewy, non-sticky glutinous rice skin wrapped around smooth, delicate red bean paste with just the right sweetness and subtle rice and bean aromas. The Double Cake and Eight-Treasure Rice (Babao Fan) are must-haves for holidays and daily treats; the Eight-Treasure Rice is generously filled, featuring translucent glutinous rice infused with lard and sweet osmanthus notes for a rich, layered texture. Both local elders and curious travelers fall in love with these traditional hand-crafted chewy delights.", "name": "Qiao Jia Zha", "transport": "Metro Line 9/12 Jiashan Road Station, Exit 2, approx. 6-minute walk"}, {"address": "No. 689 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 Stars | Canglang Pavilion is a renowned time-honored Suzhou-style noodle house on Middle Huaihai Road, famous for its meticulously prepared broths and exquisite toppings. The signature Three-Shrimp Noodles (using shrimp brain, roe, and meat) are highly sought-after during peak season\u2014tender, springy shrimp meat stir-fried with rich roe and brain coat every thin noodle strand for an intensely savory bite. The classic Scallion Oil \u0026 Dried Shrimp Noodles features deep-fried crispy shallots and dried shrimp infused into a rich soy sauce base, tossed with chewy noodles for an irresistible aroma. Its dedication to first-batch noodle broth (\u0027Tou Tang Mian\u0027) and delicate flavors perfectly embodies the elegance and depth of Jiangnan noodle culture.", "name": "Canglang Pavilion", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 1, approx. 2-minute walk"}, {"address": "No. 62 Guangyuan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Located on Guangyuan Road in Xujiahui, De Xing Guan is a centuries-old culinary landmark acclaimed as one of the birthplaces of Shanghainese local cuisine (Benbang dish) and traditional noodles. The signature Crispy Eel \u0026 Shrimp Noodles features eel fried to a golden crisp outside and tender inside, stir-fried with fresh shrimp; the thick, savory-sweet topping sauce pairs wonderfully with springy noodles and slow-cooked pork bone broth, delivering layers of rich flavor. Furthermore, its traditional Stewed Pork Noodle and Fried Fish Noodle are equally spectacular with melt-in-your-mouth tenderness. Decades of solid culinary technique and authentic Shanghainese flavor have earned this eatery high acclaim among local foodies.", "name": "De Xing Guan (Guangyuan Rd Branch)", "transport": "Metro Line 1/9/11 Xujiahui Station, Exit 16, approx. 5-minute walk"}, {"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Lao Da Chang is the most legendary Haipai (Shanghainese-style) bakery on Middle Huaihai Road, taking the city by storm with decades of classic French-inspired pastry recipes. The house specialty, \u0027Traditional Ice Cake\u0027, texture lies between ice cream and parfait\u2014light, creamy, and instant-melting with rich milk notes and crunchy caramelized walnut bits. The signature Chestnut Cake uses premium chestnut puree for a silky smooth, pleasantly mild sweetness topped with fresh whipped cream. These nostalgic Haipai desserts are not only childhood memories for Shanghainese locals, but also a wonderful entry point for visitors exploring Shanghai\u0027s unique Western pastry culture.", "name": "Lao Da Chang Bakery", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 3, approx. 2-minute walk"}, {"address": "No. 201 Nandan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Set in a garden estate in Xujiahui featuring historic steam train carriages once used by Empress Dowager Cixi and Madame Song Qingling, Shanghai Station Restaurant blends history, culture, and top-tier traditional Shanghainese cuisine. The signature \u0027Grass Carp \u0026 Pork Intestines\u0027 (Caotou Quanzi) pairs tender clover greens with rich pork intestines; meticulously cleaned, the intestines are springy, tender, perfectly braised in sweet and savory sauces without a hint of odor. The \u0027Steamed Hilsa Herring\u0027 and \u0027Braised Pork Belly\u0027 also showcase the hallmark \u0027heavy oil, dark soy sauce, balanced sweet and savory\u0027 essence of local cuisine. Dining on refined Shanghainese dishes inside vintage train carriages and manicured gardens offers visitors a unique ritualistic experience for both the eyes and taste buds.", "name": "Shanghai Station Restaurant", "transport": "Metro Line 1/9/11 Xujiahui Station, Exit 1, approx. 4-minute walk"}], "name": "Iconic Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "1st Floor, Building 14, No. 322 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Nestled along the tree-lined streets of the French Concession, RAC is one of Shanghai\u0027s premier French brunch and coffee spots. Its signature galette features golden, crispy edges filled with savory ham, melted cheese, and a sunny-side-up egg. When cut, the running yolk fuses seamlessly with the cheese for a rich, savory mouthfeel. Paired with a medium-dark roast Flat White featuring velvety microfoam, it\u0027s a favorite among expats and local trendsetters alike. Its retro green outdoor storefront is also a major photo hotspot.", "name": "RAC Bar (RAC Bar \u0026 Coffee)", "transport": "Metro Lines 1/7 Changshu Road Station, Exit 8; approx. 8-minute walk"}, {"address": "No. 9 Donghu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | As the first overseas flagship store of the American specialty coffee pioneer, the Donghu Road location boasts a spacious outdoor courtyard and sophisticated dark wood decor. The classic Major Dickason\u0027s Dark Roast Latte is highly recommended, offering deep dark chocolate and nutty notes complemented by rich, smooth milk. Pair it during brunch with a freshly baked croissant or lemon tart\u2014their crispy layers and sweet-tangy fillings perfectly balance the bold coffee, making it a top choice for a lazy morning near
