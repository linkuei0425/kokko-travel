uare Station, Exit 8, approx. 3 mins walk"}, {"address": "No. 600 Fuzhou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Founded in 1905, this Huaiyang cuisine institution is famous for traditional noodles and classic dishes. Its seasonal spring delicacy, \u0027Saury Noodle Soup\u0027, is legendary in Shanghai\u2014the milky-white broth is slow-simmered from saury bones into a rich, umami flavor, paired with firm, springy noodles. The signature \u0027Cured Pork Jellied Meat\u0027 (Yao Rou) served with Zhenjiang aromatic vinegar is refreshing and tender. Retaining a strong old-Shanghai eatery ambience, it is the top pick for experiencing Huaiyang noodle culture.", "name": "Lao Ban Zhai", "transport": "Metro Lines 1/2/8 People\u0027s Square Station, Exit 14, approx. 5 mins walk"}, {"address": "No. 766 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located in the bustling East Nanjing Road commercial area, this century-old eatery is renowned for classic Shanghai-style casual dishes and specialty noodles. The signature \u0027Fried Pork Chop\u0027 paired with local Shanghai Mailin Worcestershire sauce is golden and crispy on the outside, juicy and tender on the inside. The \u0027Yellow Croaker Noodle Soup\u0027 features a creamy white broth with tender, boneless fish fillets. Their hot, savory pork mooncakes with flaky layers are a beloved favorite among both locals and visitors.", "name": "Taikang Restaurant", "transport": "Metro Lines 1/2/8 People\u0027s Square Station, Exit 19, approx. 3 mins walk"}, {"address": "No. 689 Fuzhou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Established in the 1950s, this classic Suzhou-style noodle house is famous for refined Suzhou noodles and traditional pastries. Signature dishes like \u0027Three-Shrimp Noodles\u0027 (shrimp meat, roe, and brain), \u0027Scallion Oil \u0026 Dried Shrimp Noodles\u0027, and \u0027Three-Delicacy Wontons\u0027 offer authentic flavors. The clear broth is deeply savory, and the thin noodles are firm and smooth. The stir-fried shrimp roe, brains, and meat emit an irresistible seafood aroma, making every bite a delight for anyone seeking authentic Suzhou noodle craftsmanship.", "name": "Cang Lang Ting (Fuzhou Road)", "transport": "Metro Lines 1/2/8 People\u0027s Square Station, Exit 14, approx. 4 mins walk"}], "name": "Historic Local Institutions"}, "cat_2": {"items": [{"address": "1F, Associate Mission Building, No. 169 Yuanmingyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located on Yuanmingyuan Road in Rockbund, full of retro British charm, the vintage red-brick architecture creates a striking contrast with the modern minimalist all-white interior. The cafe\u0027s latte is renowned for its rich, smooth milky aroma and deep-roasted coffee beans, with the Honeycomb Latte and Matcha Latte being absolute must-orders. Tourists and local professionals love sitting at the outdoor tables, sipping velvety coffee foam while taking in the serene beauty of Old Shanghai\u0027s Concession architecture.", "name": "% Arabica (Shanghai Rockbund Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 6, approx. 8 mins walk"}, {"address": "No. 309 Hankou Road (near Middle Shandong Road), Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Housed in the century-old historic site of the Shenbao newspaper offices, this spot retains high Baroque domes and carved capitals, oozing rich literary and historical heritage. The venue specializes in refined British and French all-day brunch, such as classic Eggs Benedict and Black Truffle Wild Mushroom Risotto. When cut open, the golden runny yolk of the poached egg coats moist cheese and crispy toast, creating a rich and silky texture\u2014making it the top brunch choice to experience Old Shanghai\u0027s modern nostalgia.", "name": "The Press by InnoSocial (Shenbao Building Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 2, approx. 5 mins walk"}, {"address": "Room 102, Rockbund, No. 219 Yuanmingyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | The pioneer of California specialty coffee, the Rockbund branch features a lush outdoor garden and expansive floor-to-ceiling windows. The signature Flat White boasts precisely crafted microfoam for an exceptionally silky mouthfeel, perfectly blending espresso caramel sweetness with fresh milk. Paired with their popular melt-in-your-mouth Basque Cheesecake, it\u0027s the ideal spot to relax during an afternoon stroll along the Bund.", "name": "Peet\u0027s Coffee (Rockbund Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 6, approx. 7 mins walk"}, {"address": "B1 Floor, South Zone, BFC Bund Financial Center, No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | A proud representative of Shanghai\u0027s home-grown affordable specialty coffee, the BFC branch boasts a spacious, bright, and ultra-modern viewing area. The signature Sweet Osmanthus Latte is a must-try, offering subtle sweet floral notes balanced with rich coffee bitterness in distinct layers. Budget-friendly yet maintaining exceptional quality, it\u0027s popular among office workers and tourists alike. Grabbing a takeaway to enjoy by the Bund promenade with river views is pure bliss.", "name": "Manner Coffee (BFC Bund Financial Center Branch)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027 Exit 1, approx. 12 mins walk"}, {"address": "1F, Bund 18, No. 18 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Created by a Michelin-starred team, this establishment serves high-end French brunch and afternoon tea inside the historic Bund 18 building. The signature French croissant features an insanely crispy crust and buttery flaky layers, paired perfectly with a hand-poured single-origin coffee or a freshly made strawberry tart to transport you straight to Paris. With its luxurious black-and-red decor and exquisite culinary standards, it\u0027s a must-visit for lovers of fine brunch.", "name": "Salon de Th\u00e9 de Jo\u00ebl Robuchon (Bund 18 Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 7, approx. 10 mins walk"}, {"address": "1F, The Central, No. 123 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A trendy coffee brand taking Shanghai by storm with its industrial cement aesthetics and minimalism. Its most visually stunning creation, the \u0027Oatmeal Cookie Latte\u0027, serves rich coffee in an edible chocolate-lined cookie cup. Munching on the crunchy cookie cup while sipping latte creates a wonderfully unique experience. It attracts crowds of young tourists for photo ops, adding youthful energy to the bustling East Nanjing Road commercial area.", "name": "M Stand (Nanjing East Road Pedestrian Street Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 5, approx. 3 mins walk"}, {"address": "1F, Raffles City, No. 268 Middle Xizang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A pioneer brand in China\u0027s specialty coffee movement, located at Raffles City in the heart of People\u0027s Square. Signature creations like the \u0027Cloud Peach Cold Brew\u0027 and various seasonal fruit-infused coffees seamlessly combine fresh fruit juices with single-origin beans for a crisp, well-balanced sweet and tangy flavor. The bright and comfortable space also serves quality light brunch options like avocado smoked salmon sourdough toast, making it an ideal pitstop in bustling People\u0027s Square.", "name": "Seesaw Coffee (Raffles City People\u0027s Square Branch)", "transport": "Direct access from Metro Lines 1/2/8 \u0027People\u0027s Square Station\u0027 Exit 15"}, {"address": "No. 268 Hankou Road (near Middle Henan Road), Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | A renowned classic lever espresso bar utilizing vintage lever espresso machines to pull coffee shots. The signature \u0027Dirty Cream Latte\u0027 features velvety cold cream floating atop hot espresso; taking a sip lets you savor the cool sweet cream followed by the rich, warm coffee bitterness\u2014an astonishing contrast of temperature and flavor. Paired with a freshly pressed panino (crispy outside, soft inside) for brunch, it\u0027s a sophisticated delight for coffee lovers.", "name": "Metal Hands (Hankou Road Branch)", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 2, approx. 4 mins walk"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "No. 70 Fuzhou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A hugely popular, affordable home-style Shanghainese restaurant near The Bund, beloved by locals and tourists alike. The signature Braised Pork Belly uses three-layered pork belly slow-cooked to a glossy reddish hue; it melts in your mouth with a rich, balanced sweet-and-savory sauce, perfectly paired with quail eggs. Other dishes like the Squirrel-Shaped Yellow Croaker are crispy outside, tender inside, sweet and sour, showcasing classic authentic Shanghainese home cooking.", "name": "Shanghai Grandmother Restaurant", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 7, about an 8-minute walk"}, {"address": "6F, Bund 18, No. 18 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | A top-tier modern French bistro located at Bund 18, created by celebrated Chef Paul Pairet. The atmosphere is stylish yet relaxed, serving refined and inventive French cuisine. The signature \u0027Lemon \u0026 Lemon Tart\u0027 features a sweet whole roasted lemon shell enclosing a delicate filling, offering an astonishing sweet-and-sour balance. The Black Truffle Roast Chicken has crispy skin, tender meat, and a rich mushroom aroma. Floor-to-ceiling windows offer sweeping views of the Lujiazui skyline, making it the ultimate destination for late-night drinks and gourmet dining.", "name": "Mr \u0026 Mrs Bund Modern Bistro", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 2, about a 10-minute walk"}, {"address": "No. 413 Hankou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A famous local eatery renowned as the \u0027No. 1 Braised Pork Belly in Shanghai\u0027. Its signature Yuan Yuan Braised Pork Belly is rich without being greasy and tender without being dry; layers of marbled pork belly are simmered in signature sweet soy sauce, resulting in a rich, gelatinous, and sweet finish. The restaurant features an elegant ambiance, and besides the braised pork, the Crab Roe Tofu and Deep-Fried River Shrimp are must-try signature dishes.", "name": "Yuan Yuan Restaurant", "transport": "Metro Lines 1/2/8 \u0027People\u0027s Square Station\u0027 Exit 14, about a 5-minute walk"}, {"address": "No. 17A Yan\u0027an East Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A highly atmospheric bistro near The Bund featuring Yunnan ethnic folk cuisine. Dim red lighting and tribal motifs create a mysterious, romantic dining environment. The cuisine fuses Yunnan ethnic minority flavors with modern cooking techniques. Signature dishes like Yunnan Wild Vegetable Cakes are crispy outside and soft inside, while the Herb-Grilled Fish features crispy skin, tender meat, and rich herbal spice notes. Paired with signature herbal cocktails, it offers diners a unique sensory experience.", "name": "Lost Heaven Yunnan Folk Cuisine", "transport": "Metro Lines 10/14 \u0027Yuyuan Garden Station\u0027 Exit 1, about an 8-minute walk"}, {"address": "No. 242 Fuyou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A century-old Shanghainese restaurant established during the Guangxu era of the Qing Dynasty, revered as the \u0027Birthplace of Shanghainese Cuisine\u0027. Its signature dish, \u0027Eight-Treasure Duck\u0027, features a deboned whole duck stuffed with sticky rice, mushrooms, ham, bamboo shoots, and other premium ingredients, then steamed until tender. The rice absorbs the savory duck essence, making it intensely aromatic. Deep-fried river shrimp with delicate shells and sweet, snappy meat showcase the master craftsmanship of traditional Shanghai dining.", "name": "Shanghai Old Restaurant", "transport": "Metro Lines 10/14 \u0027Yuyuan Garden Station\u0027 Exit 3, about a 5-minute walk"}, {"address": "No. 309 Hankou Road, Huangpu District, Shanghai (Former Shun Pao Building)", "feature": "\u2b50 4.3 stars | A retro Shanghai-style bistro housed in the historic former headquarters of Shun Pao, one of modern China\u0027s oldest newspapers. High ornate domed ceilings and classical Roman pillars exude a rich sense of history. The restaurant serves refined Italian dishes and Shanghai creative fusion cuisine. The signature Black Truffle Wild Mushroom Risotto has perfectly al dente rice and a rich, creamy truffle aroma. Paired with specialty Shanghai-style coffee or red wine, guests can savor Old Shanghai\u0027s modern romantic charm within a heritage setting.", "name": "The Press by InnoSocial", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 3, about a 4-minute walk"}, {"address": "No. 471 Guangdong Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | A traditional Shanghainese restaurant founded during the Guangxu reign, celebrated as a hallmark of Shanghai\u0027s signature rich-sauced, deep-cooked cuisine (\u0027Nong You Chi Jiang\u0027). The signature dish \u0027Sea Cucumber with Shrimp Roe\u0027 features premium sea cucumber simmered in rich stock and shrimp roe, delivering a soft, gelatinous texture and intense savory flavor. Their famous De Xing Braised Pork Noodles feature a rich broth and melt-in-your-mouth pork, beloved by local Shanghainese and visiting foodies alike.", "name": "De Xing Guan", "transport": "Metro Lines 1/2/8 \u0027People\u0027s Square Station\u0027 Exit 15, about a 6-minute walk"}, {"address": "No. 719 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A classic landmark restaurant on East Nanjing Road Pedestrian Street. Although specializing in Cantonese cuisine, it integrates Shanghai culinary culture, making it one of the most iconic local dining spots on Nanjing Road. The signature \u0027Sun Ya Roasted Sucking Pig\u0027 boasts crispy skin and tender meat, deliciously fragrant when paired with sweet bean sauce. Other highlights include tender, spicy poached beef, and classic dim sum like Crystal Shrimp Dumplings with thin skin and juicy, bursting shrimp fillings, making it a top choice for quality gatherings.", "name": "Sun Ya Cantonese Restaurant", "transport": "Metro Lines 2/10 \u0027East Nanjing Road Station\u0027 Exit 4, about a 3-minute walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": [{"items": [{"address": "No. 445 West Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | Founded in 1922, this century-old vegetarian establishment is renowned for its masterly craft of mock meats. Signature dishes like \"Vegetarian Yellow Finch\" and \"Butter Vegetarian Crab Roe\" offer exquisite textures; the mock crab roe uses tofu, carrots, and special spices to recreate the dense sweetness of genuine crab roe\u2014sour, sweet, smooth, and non-greasy. It is the top choice for tourists and locals seeking traditional Jiangnan vegetarian cuisine.", "name": "Godly Vegetarian Restaurant (Gong De Lin)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 11), then walk for about 3 minutes."}, {"address": "Inside Commercial Street, No. 479 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | A historic century-old symbol of Shanghai pure vegetarian dining, famous for its iconic vegetable steamed buns. The naturally fermented dough yields a chewy, fragrant skin, wrapping a filling of fresh greens, shiitake mushrooms, and dried tofu specially seasoned for maximum umami. Every bite bursts with fresh juice with zero animal fat\u2014a light, guilt-free street snack essential for anyone exploring the Nanjing Road shopping district.", "name": "Chunfeng Songyue Lou", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 2), then walk for about 2 minutes."}, {"address": "No. 12 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 Stars | A high-end Zen-inspired vegetarian restaurant located in the heart of The Bund, seamlessly blending traditional tea art, wellness philosophies, and modern molecular gastronomy. The signature \"Black Truffle \u0026 Wild Mushroom Soup\" boasts a rich, fragrant broth with tender wild mushrooms and a lingering truffle aroma. The \"Lily Bulb \u0026 Yam Tart\" melts in your mouth with a dense texture and natural sweetness. Its elegant ambiance and ritualistic presentation make it a favorite among health-conscious epicures.", "name": "Yeye Puthi (The Bund)", "transport": "Take Metro Line 10 to Yuyuan Garden Station (Exit 1), then walk about 10 minutes toward The Bund."}, {"address": "8th Floor, Building B, Suning/No. 1 Department Store Commercial Center, No. 830 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Pioneering personal vegetarian hot pots infused with Tibetan Ya\u0027an tea, featuring a clear, ruby-red broth with a unique woody tea fragrance and sweet aftertaste. Ingredients include rare wild mushrooms, handmade tofu meatballs, and fresh organic seasonal vegetables. The mushrooms absorb the tea broth essence, becoming tender, crisp, and soothing. This healthy, lightweight dining concept attracts many young diners and tourists.", "name": "One Leaf One World Vegetarian Hot Pot (Nanjing East Road)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 19), directly connected to No. 1 Department Store."}, {"address": "No. 175 Middle Sichuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | A trendy modern aesthetic vegetarian brand from Hangzhou setting new plant-based trends near Shanghai\u0027s Bund. The signature \"Black Truffle Fried Rice\" features distinct rice grains infused with rich truffle aroma and crunchy pine nuts for incredible depth of flavor. The \"Pan-Fried Homemade Tofu with Olive Oil\" has a crisp golden exterior with a silky, cheese-like center. Focusing on pure, additive-free ingredients and artistic presentations, it is a popular spot for influencers and plant-based food lovers.", "name": "Qingchun Pushe (The Bund)", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 3), then walk for about 5 minutes."}, {"address": "4th Floor, No. 22 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Formerly a Michelin-starred international temple of aesthetic vegetarian dining located in a historic Bund building. Dishes are designed around the 24 solar terms. The signature \"Fu Shou Quan\" slow-simmers precious wild mushrooms into a thick, delicious broth that is lighter and more soothing than traditional Buddha Jumps Over the Wall. The \"Crispy Sweet and Sour Lotus Root Boxes\" feature golden crisp slices filled with juicy stuffing, showcasing oriental vegetarian creativity at its finest.", "name": "Wujie (The Bund)", "transport": "Take Metro Line 10 to Yuyuan Garden Station (Exit 1), then walk about 12 minutes to Bund 22."}, {"address": "No. 500 Guangdong Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | An extraordinarily high-value budget vegetarian buffet near People\u0027s Square, serving dozens of vegan hot dishes, dim sum, soups, and stews daily. Popular \"Handmade Veggie Dumplings\" feature thin wrappers stuffed with crisp cabbage and wood ear mushrooms; the \"Crispy Fried Veggie Cutlet\" offers a golden crunch with a juicy, tender center. With fast dish rotations and fresh flavors, it is a culinary paradise for office workers and budget travelers.", "name": "Su Man Xiang (People\u0027s Square)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 14), then walk for about 6 minutes."}, {"address": "3rd Floor, North Building, Hong Kong Plaza, No. 282 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | A veteran modern pure vegetarian restaurant promoting a healthy vegan concept free of eggs, dairy, and alcohol. The signature \"Longevity Roll\" wraps sliced shiitake mushrooms and bean sprouts in bean curd skin, pan-fried to golden perfection\u2014crispy outside, soft inside, with rich soy and veggie sweetness. The \"Black Pepper Veggie Beef\" convincingly mimics tender beef textures coated in a rich, savory black pepper sauce. Its warm and cozy vibe puts family travelers at ease.", "name": "Jujube Tree (Huangpu)", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), directly connected to Hong Kong Plaza."}], "name": "\ud83c\udf31 Vegetarian"}], "cat_5": {"items": [{"address": "No. 636 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A century-old brand located on East Nanjing Road Pedestrian Street, this is the ultimate sanctuary for tasting traditional Shanghai glutinous rice pastries. The signature Qingtuan features a thin outer skin infused with subtle mugwort aroma, filled generously with sweet paste, delivering a chewy and non-sticky texture. The Tiaotou Gao (rice cake bar) is stuffed with smooth red bean paste, offering rich bean flavor and soft rice comfort in every bite. Both locals and first-time visitors happily queue up for these warm, pillowy street treats.", "name": "Shen Da Cheng (\u6c88\u5927\u6210)", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 4), then walk about 3 minutes."}, {"address": "B1, Shanghai 1788 Plaza, No. 168 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A highly iconic street food chain in Shanghai, famous for its golden, crispy pan-fried soup dumplings (Shengjianbao)\u2014a must-try when visiting the Bund and Nanjing Road. Fresh out of the pan, the bottom is fried to a golden crunch while the top is sprinkled with scallions and sesame seeds. Biting into one releases a burst of piping-hot, rich pork broth paired with juicy pork filling. Pro tip: bite a small hole first to sip the broth to avoid scalding your mouth!", "name": "Yang\u0027s Fry-Dumpling (\u5c0f\u694a\u751f\u714e)", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 2), then walk about 2 minutes."}, {"address": "No. 536 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A century-old food shop located near the junction of People\u0027s Square and East Nanjing Road. Its freshly baked savory meat mooncakes are a beloved year-round street snack for locals. Served piping hot, the flaky pastry shatters satisfyingly with every bite, revealing a juicy, perfectly savory-sweet pork filling. The rendered juice seeps into the crispy layers, creating an irresistible, portable snack for your stroll.", "name": "Zhen Lao Da Fang (\u771f\u8001\u5927\u623f)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 19), then walk about 5 minutes."}, {"address": "No. 28 Huanghe Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Located inside the historic Park Hotel near People\u0027s Square, this bakery is renowned for making what is widely considered \u0027Shanghai\u0027s best butterfly pastries (palmiers).\u0027 Shaped like butterflies, these classic original-flavor pastries feature dozens of light, flaky layers baked to crispy perfection with a rich butter aroma and subtle sugar crunch. Slightly caramelized outside yet airy inside, it is a sweet, addictive treat and a popular souvenir.", "name": "Park Hotel Bakery (\u570b\u969b\u98ef\u5e97\u9905\u5c4b)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (Exit 8), then walk about 3 minutes."}, {"address": "No. 46 South Yunnan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Situated near the South Yunnan Road food street, this classic local brand holds cherished memories for generations of Shanghainese. The thick pork chop is lightly battered and deep-fried to a golden crunch while remaining tender and juicy, paired with chewy rice cakes steamed in a special sauce. Drizzled with signature sweet and spicy sauce, the savory-sweet flavor profile and contrast between crispy pork and soft rice cakes make it a enduring crowd favorite.", "name": "Xiandelai Pork Ribs with Rice Cake (\u9bae\u5f97\u4f86\u6392\u9aa8\u5e74\u7cd5)", "transport": "Take Metro Line 8 to Dashijie Station (Exit 2), then walk about 4 minutes."}, {"address": "No. 136 Middle Sichuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A Michelin Bib Gourmand recipient near the Bund, Dahuchun is the legendary representative of the traditional \u0027Qingshui\u0027 (low-broth) style pan-fried dumplings. Unlike traditional soup-filled dumplings, Dahuchun uses semi-leavened dough, giving the bun a tender, bread-like top and a deeply caramelized, golden crispy bottom. The pork filling is compact, savory-sweet, and satisfying without being greasy, capturing the nostalgic flavor of old Shanghai.", "name": "Dahuchun - Sichuan Middle Road (\u5927\u58fa\u6625)", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 3), then walk about 6 minutes."}, {"address": "Transfer Hall, People\u0027s Square Metro Station, No. 50 West Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Claiming to serve \u0027possibly the best egg tarts in Shanghai,\u0027 Lillian Bakery is immensely popular in the People\u0027s Square metro shopping area. Fresh out of the oven, the signature Portuguese egg tarts emit an enticing milky aroma. The crust boasts dozens of flaky layers, while the custard filling is silky smooth, rich, and melts in your mouth with just the right sweetness. It\u0027s the ultimate warm comfort treat while exploring the city.", "name": "Lillian Bakery (\u8389\u84ee\u86cb\u64bb)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station (located inside the station concourse)."}, {"address": "No. 150 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A classic Haipai (Shanghai-Western fusion) pastry shop on East Nanjing Road, representing authentic local nostalgia. Signature snacks like \u0027Almond Bars\u0027 and \u0027Walnut Bars\u0027 feature a buttery, tender base topped with caramelized toasted almond slices, offering a delightfully crispy and rich nutty flavor. The melt-in-your-mouth peanut shortbreads are equally famous, making this shop a favorite among locals and tourists looking for classic snacks.", "name": "Harbin Food Factory (\u54c8\u723e\u6ff1\u98df\u54c1\u5ee0)", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station (Exit 3), then walk about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "The Bund, Nanjing Road and People\u0027s Square"}, "disney": {"categories": {"cat_1": {"items": [{"address": "No. 710 Disneytown, Lane 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | As one of Shanghai\u0027s most iconic heritage brands, this branch in Disneytown perfectly inherits a century-old craft. The signature Crab Roe Soup Dumplings feature paper-thin skin and neat pleats; one bite bursts with rich, piping-hot savory soup. The blend of pork and fresh crab roe is balanced to perfection with zero fishiness. Tourists love enjoying authentic traditional Shanghai pastries amidst Disney\u0027s joyful atmosphere\u2014paired with a bowl of hot seaweed egg drop soup for a complete meal.", "name": "Nanxiang Steamed Bun Restaurant (Disneytown)", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), then walk about 8 minutes into Disneytown."}, {"address": "No. 635 Disneytown, Lane 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | A Michelin-recommended restaurant specializing in traditional Jiangnan and Cantonese cuisine, prime-located in Disneytown. The signature Shanghai Braised Pork Belly boasts a glossy red sheen, meltingly tender fat-to-lean layers, and a perfectly balanced sweet-savory glaze that showcases classic Shanghainese flavors. The Steamed Pork Dumplings feature springy dough and clean, non-greasy soup. With its elegant classical ambiance and attentive service, it\u0027s a top choice for families seeking refined traditional dining at the resort.", "name": "Crystal Jade Dining Room (Disneytown)", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), then walk about 6 minutes into Disneytown."}, {"address": "Gardens of Imagination, Shanghai Disneyland, No. 753 Shendi North Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | Located in the Gardens of Imagination inside Shanghai Disneyland, Wandering Moon Restaurant is housed in a grand classical Huizhou-style mansion. It specializes in classic Shanghai and Jiangnan dishes. The signature Dongpo Pork is braised to melt-in-your-mouth tenderness, blending rich aromas of pork fat and yellow rice wine. Paired with light Yangzhou Fried Rice and traditional Suzhou-style noodles, guests can enjoy an authentic, nostalgic culinary experience right inside the magical park.", "name": "Wandering Moon Restaurant", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to the Gardens of Imagination area."}, {"address": "No. 1132 Xiuyan Road, Pudong New Area, Shanghai (Disney Resort Commercial Area)", "feature": "\u2b50 4.4 stars | Shanghai\u0027s most famous modern pan-fried pork bun chain, extremely popular around the Disney Resort area. The signature Yang\u0027s Pan-Fried Buns feature a crispy, golden-brown bottom, sprinkled with scallions and white sesame seeds. Filled with fresh pork and wrapped in a soft yet absorbent dough, each bite yields a burst of hot, savory broth. Loved by both locals and tourists for its affordable price and quick service, it is an ideal classic snack to refuel before or after visiting Disney.", "name": "Yang\u0027s Fry-Dumpling (Disney Area)", "transport": "Take Metro Line 11 to Xiuyan Road Station (Exit 2), then walk about 3 minutes."}, {"address": "No. 1158 Kangqiao East Road, Pudong New Area, Shanghai (Near Disney Resort)", "feature": "\u2b50 4.3 stars | Founded in 1932, this legendary Shanghai eatery adheres to traditional yeast-leavened dough methods for its pan-fried buns. Unlike soup-heavy style buns, Da Hu Chun\u0027s buns feature a fluffy, steamed-bread-like texture with a crispy, fragrant bottom. The solid pork filling carries a slightly sweet classic Shanghainese flavor that becomes tastier with every bite. Their traditional pork and crab roe buns are beloved by foodies seeking nostalgic Old Shanghai charm.", "name": "Da Hu Chun (Kangqiao)", "transport": "Take Metro Line 11 to Kangxin Highway Station, transfer to Pudong Bus Line 63, and get off at Kangqiao East Road Station."}, {"address": "Create \u0026 Innovate Manufacturing Zone, No. 3188 Xiupu Road, Pudong New Area, Shanghai (Disney Area)", "feature": "\u2b50 4.6 stars | A celebrated local brand with decades of Shanghainese culinary tradition, elevating home-style dishes into fine dining experiences. The signature Scallion Oil Noodles feature springy noodles thoroughly coated in aromatic scallion oil and seasoned soy sauce. The Sauteed River Shrimp uses wild river shrimp for a tender, sweet, and snappy texture without needing heavy seasonings. Overflowing with Old Shanghai Haipai charm, it is a premier choice for authentic local dining and family gatherings.", "name": "Shanghai Xiao Nan Guo (Kangqiao Branch)", "transport": "Take Metro Line 11 to Xiuyan Road Station (Exit 1), then take a taxi for about 5 minutes."}, {"address": "No. 5032 Chuansha Road, Pudong New Area, Shanghai (Near Disney / Chuansha Area)", "feature": "\u2b50 4.2 stars | Hailed as the \u0027Champion of Shanghai Dim Sum,\u0027 this century-old brand specializes in handcrafted traditional Jiangnan pastries and dim sum. The signature Crab Shell Pastry boasts flaky, crispy layers with a savory, flavorful filling; classic Shanghai Fried Tofu \u0026 Vermicelli Soup and Deep-fried Yellow Croaker with Seaweed are also highly praised. Visitors love picking up traditional rice cakes like Qingtuan (sweet green rice ball) or Red Bean Cake as walking snacks to experience authentic Old Shanghai dim sum culture.", "name": "Wang Jia Sha Pastry (Chuansha)", "transport": "Take Metro Line 2 to Chuansha Station (Exit 1), then walk about 10 minutes."}, {"address": "No. 28 Xiangchuan Road, Chuansha New Town, Pudong New Area, Shanghai (Near Disney Resort Expansion Area)", "feature": "\u2b50 4.5 stars | A legendary state-banquet brand that has hosted numerous world leaders, featuring a branch near the Disney area. The signature Eyebrow Pastry resembles a curved eyebrow, featuring crisp, flaky layers stuffed with shredded bamboo shoots and pork. The Sweet Osmanthus Rice Cake sticks to the plate but not your teeth, offering a delicate floral aroma and soft, sweet texture. With exquisite handcrafted pastries and deep Haipai culinary heritage, guests can enjoy a state-banquet-worthy feast of traditional delicacies.", "name": "Lu Bo Lang (Chuansha)", "transport": "Take Metro Line 2 to Chuansha Station (Exit 2), then walk about 12 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Disneytown, Shanghai Disney Resort, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Housed in a standalone two-story building in the heart of Disneytown, featuring a futuristic wavy ceiling design and exclusive Disney-themed handcrafted beverages. It offers freshly brewed Reserve single-origin pour-over coffee and French croissants freshly baked every morning\u2014crispy on the outside, soft on the inside, with a rich buttery aroma. Many guests love coming here before entering the park for a ritualistic brunch; sitting at a second-floor window seat offers a view overlooking Disneytown, making it the perfect starting point for a magical Disney day trip.", "name": "Starbucks Reserve Disneytown Flagship Store", "transport": "About a 5-minute walk from Exit 1 of Disney Resort Station, Metro Line 11"}, {"address": "Next to Photo Studio, Disneytown, No. 255 West Shendi Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | The first China branch of the hugely popular American restaurant chain, renowned for its extra-large portions of classic American brunch dishes and dozens of cheesecake flavors. For brunch, try the fluffy, juicy French toast and Eggs Benedict paired with a rich, aromatic hot latte\u2014the velvety yolk mixing with roasted aromas creates pure bliss. Featuring luxurious American retro decor and generous portions, it\u0027s perfect for families or groups of friends to feast in a joyful atmosphere.", "name": "The Cheesecake Factory", "transport": "About an 8-minute walk from Exit 1 of Disney Resort Station, Metro Line 11"}, {"address": "Lakeside Area, Disneytown, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | A classic brand focusing on traditional European artisanal bakery items and healthy light brunches. The bakery fresh-bakes sourdough bread, rye toast, and Danish pastries daily\u2014crispy with every bite and full of wheat fragrance. The brunch platter comes with freshly ground organic coffee, fresh avocado, smoked salmon, and poached eggs, offering rich, light, and guilt-free layers of flavor. It is loved by health-conscious visitors and expats seeking a high-quality breakfast.", "name": "BAKER \u0026 SPICE (Disneytown)", "transport": "About a 7-minute walk from Exit 1 of Disney Resort Station, Metro Line 11"}, {"address": "Market Square Area, Disneytown, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 Stars | A cute, Donald Duck-themed restaurant filled with nautical colors and cheerful elements. Besides exquisite handcrafted pizzas and specialty milkshakes, it also offers uniquely styled Donald Duck-themed coffees and Western brunch sets. Freshly made specialty coffee paired with waffles stamped with Donald Duck footprint patterns features a slightly crispy exterior and dense interior, offering a delightfully sweet flavor. Immensely soothing both visually and tastily, it\u0027s a must-visit photo spot for Disney fans.", "name": "Donald\u0027s Dine \u0027n Delights", "transport": "About a 6-minute walk from Exit 1 of Disney Resort Station, Metro Line 11"}, {"address": "Corner of Market Square Area, Disneytown, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | Local specialty coffee champion MANNER has arrived at Disneytown, attracting coffee lovers with high value-for-money and professional extraction quality. Signature Sweet Osmanthus Latte and Flat White are smooth and creamy, perfectly blending milk foam and espresso with subtle floral and nutty notes. Grabbing a rich, aromatic coffee paired with a freshly baked oat cookie in the morning quickly recharges your energy, making it the top budget brunch pick before rushing to popular park rides.", "name": "MANNER COFFEE (Disneytown Store)", "transport": "About a 5-minute walk from Exit 1 of Disney Resort Station, Metro Line 11"}, {"address": "1st Floor, Shanghai Disneyland Hotel, No. 1009 West Shendi Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Located inside the Shanghai Disneyland Hotel, this premium buffet brunch is themed around Lumi\u00e8re from Beauty and the Beast. Here, you can enjoy freshly made omelets, freshly baked delicate Western pastries, freshly ground specialty coffee, and abundant international warm dishes\u2014plus photo ops with Disney friends visiting your table! The food quality is top-tier; Mickey-shaped waffles are crispy outside, fluffy inside, and rich in milky aroma, making it the most immersive and dreamy luxury brunch option in the resort.", "name": "Lumi\u00e8re\u0027s Kitchen", "transport": "Transfer to Resort Shuttle Bus or Resort Ferry from Disney Resort Station, Metro Line 11"}, {"address": "1st Floor, Toy Story Hotel, No. 360 West Shendi Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 Stars | Located inside the Toy Story Hotel, this bright space is filled with colorful Toy Story accents. During breakfast and brunch hours, it serves a rich variety of Chinese and Western light meals alongside hot drinks, with freshly brewed lattes and classic Mickey-shaped waffles strongly recommended. The waffles are toasted golden-crisp on top, turning moist and sweet when drizzled with maple syrup and butter\u2014hugely popular with kids and young adults, providing hotel guests with a lively and whimsical morning boost.", "name": "Sunnyside Caf\u00e9", "transport": "About 10 minutes via Resort Shuttle Bus from Disney Resort Station, Metro Line 11"}, {"address": "Mickey Avenue inside Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Located at the entrance of Mickey Avenue inside Disneyland, this classic bakery coffee shop embodies pink sweetness and fairytale romance. It offers freshly extracted espresso drinks, matcha lattes, adorable Disney-themed cakes, and handmade cinnamon rolls. The cinnamon roll is rich and wonderfully aromatic; paired with a slightly bitter hot Americano, it balances sweet and rich notes perfectly\u2014a fantastic spot for a refined light brunch in the morning to kick off a dreamy day in the park.", "name": "Sweethearts Confectionery", "transport": "Walk from Exit 1 of Disney Resort Station, Metro Line 11 directly to the park turnstiles"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Gardens of Imagination, Shanghai Disneyland, Pudong New District, Shanghai", "feature": "\u2b50 4.5 Stars | Located inside Disneyland, this restaurant features traditional Jiangnan architecture and specializes in exquisite local cuisine and Chinese dishes. The signature Dongpo Pork boasts a glossy reddish color and a melt-in-your-mouth texture\u2014rich without being greasy\u2014paired with a luscious sauce loved by domestic and international guests alike. The Braised Beef Noodle Soup has a rich, savory broth and chewy noodles. Designed like an ancient Jiangnan garden, it offers an immersive Chinese aesthetic setting to savor classic Shanghai and Jiangsu flavors.", "name": "Wandering Moon Restaurant", "transport": "Take Metro Line 11 to Disney Resort Station, then walk into the Gardens of Imagination area inside the park."}, {"address": "No. 705, Lane 255 Shendi West Road, Disneytown, Pudong New District, Shanghai", "feature": "\u2b50 4.3 Stars | A famous Shanghainese restaurant located in Disneytown, perfectly showcasing the classic \u0027rich oil and red sauce\u0027 style of authentic Shanghai cuisine. The must-order Crystal Shrimp is crisp, tender, and delicate; the Grandma\u0027s Braised Pork with Tofu Knots is melt-in-your-mouth tender, juicy, and perfectly balanced in sweet and savory flavors. With elegant surroundings and lakeside seating offering distant views of the castle, it is the top choice for authentic local Shanghainese delicacies.", "name": "Shanghai Min", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), then walk about 8 minutes to Disneytown."}, {"address": "8th Floor, Shanghai Disneyland Hotel, No. 1009 Shendi West Road, Pudong New District, Shanghai", "feature": "\u2b50 4.7 Stars | An upscale specialty bistro situated on the top floor of the Shanghai Disneyland Hotel, offering top-tier Continental and French cuisine paired with an extensive wine cellar. The chef\u0027s signature aged steak is seared crispy on the outside and tender juicy on the inside, perfectly paired with a custom red wine sauce. Seafood platters and delicate desserts offer a feast for both the eyes and palette. At night, enjoy fine wine on the terrace while watching the castle fireworks show in a wonderfully romantic atmosphere.", "name": "Aurora", "transport": "Take Metro Line 11 to Disney Resort Station, then transfer to the Resort Shuttle Bus or Wishing Star Lake Ferry to Shanghai Disneyland Hotel."}, {"address": "No. 660, Lane 255 Shendi West Road, Disneytown, Pudong New District, Shanghai", "feature": "\u2b50 4.4 Stars | An American-style brewpub bistro located in Disneytown\u0027s dining district, famous for fresh craft beer and fusion American cuisine. The artisanal craft beers boast a smooth texture, rich maltiness, and subtle fruity/floral aromas. Pair them with juicy handmade beef burgers and crispy cheesy fries for ultimate satisfaction. Featuring an industrial-style d\u00e9cor with a lively, relaxed vibe, it\u0027s ideal for drinks and gatherings with friends after a day in the park.", "name": "The Blue Sky Brewery", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 2), then walk about 6 minutes to Disneytown."}, {"address": "No. 500, Lane 255 Shendi West Road, Disneytown, Pudong New District, Shanghai", "feature": "\u2b50 4.2 Stars | A famous Cantonese and Jiangnan regional cuisine restaurant with Michelin-recommended heritage, located in the heart of Disneytown. The signature Xiao Long Bao has paper-thin skin filled with rich, flavorful soup that bursts with savory goodness in one bite; the Cantonese Roasted Goose features crispy skin and tender meat, enhanced by a sweet and tangy plum dipping sauce. Decorated in an elegant, refined style, it is an excellent choice for gourmets seeking refined local dishes and Cantonese dim sum.", "name": "Crystal Jade Restaurant", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 7 minutes to Disneytown Central Courtyard."}, {"address": "Lane 255 Shendi West Road, Disneytown, Pudong New District, Shanghai", "feature": "\u2b50 4.5 Stars | A renowned American bistro bar created by a legendary Hollywood celebrity chef, located by the lake at Disneytown. The signature ribeye steak is seared to a perfect rosy pink inside with a slightly charred crust\u2014tender, flavorful, and incredibly juicy. The signature smoked salmon pizza has a thin, crispy crust with rich, layered textures. Offering handcrafted cocktails and curated wines, the outdoor seating lets you soak in the serene views of Wishing Star Lake for a premium dining experience.", "name": "Wolfgang Puck Bar \u0026 Grill", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 2), then walk about 5 minutes to the Wishing Star Lakeshore in Disneytown."}, {"address": "Treasure Cove, Shanghai Disneyland, Pudong New District, Shanghai", "feature": "\u2b50 4.6 Stars | A unique pirate-themed tavern located inside the immersive Treasure Cove area. The signature roasted pork ribs are crispy outside and succulent inside, coated in rich, sweet-and-spicy pirate BBQ sauce where the meat falls off the bone. The seafood fried rice features distinct, fragrant grains packed with ocean flavors. The dining area overlooks the indoor waterway of the \u0027Pirates of the Caribbean\u0027 ride, allowing guests to savor hearty food inside a dimly lit, mysterious pirate cave atmosphere.", "name": "Barbossa\u0027s Bounty", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to the Treasure Cove area."}, {"address": "2nd Floor, Enchanted Storybook Castle, Shanghai Disneyland, Pudong New District, Shanghai", "feature": "\u2b50 4.8 Stars | An upscale Western restaurant tucked inside the Enchanted Storybook Castle, serving royal-caliber, exquisite three-course Western meals. Main courses like roasted lamb chops are tender, juicy, and perfectly seasoned with a custom herb sauce; appetizers such as foie gras mousse melt in your mouth with rich aromas. Beyond the exquisite food, Disney characters dressed in royal attire visit your table during the meal for photos and interactions, creating a truly majestic and magical dining experience.", "name": "Royal Banquet Hall", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and head to Enchanted Storybook Castle."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Enchanted Storybook Castle, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | A premier restaurant located inside the Enchanted Storybook Castle, featuring an exquisite multi-course Western vegetarian set menu. The highlight, Truffle and Wild Mushroom Risotto, uses premium Arborio rice simmered in rich, savory broth infused with sweet truffle and wild mushroom aromas. Creamy yet distinct in texture, it is paired with a delicately roasted vegetable tart that is crispy on the outside and tender inside. It offers the most ceremonial and visually luxurious vegetarian dining experience in Shanghai Disneyland.", "name": "Royal Banquet Hall", "transport": "Take Metro Line 11 to Disney Resort Station, walk into the park to Enchanted Storybook Castle."}, {"address": "Shendi East Road Side, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | A popular American restaurant in Disneytown offering an incredibly extensive selection of vegan and vegetarian choices. Highly recommended is \u0027Evelyn\u0027s Favorite Pasta\u0027, featuring perfectly al dente pasta tossed with vibrant bell peppers, pine nuts, and a light special sauce that creates rich, refreshing layers without feeling oily. Their plant-based burger is juicy, hearty, and generous in portion, making it a favorite among international tourists and plant-based diners alike.", "name": "The Cheesecake Factory", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), walk about 5 minutes to Disneytown."}, {"address": "Gardens of Imagination, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | Steeped in classic Chinese garden charm, this restaurant specializes in high-quality Chinese vegetarian cuisine. The signature Braised Tofu with Buddha\u0027s Delight features golden, crispy fried tofu slow-simmered in a rich broth, absorbing all the savory sauce. Crisp on the outside and silky soft inside, it is cooked with fresh bamboo shoots, wood ear mushrooms, and rare fungi, delivering a wonderful interplay of textures that delights lovers of traditional Chinese plant-based stir-fries.", "name": "Wandering Moon Restaurant", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to Gardens of Imagination."}, {"address": "Treasure Cove, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located in the pirate-themed Treasure Cove with incredible immersive ambiance. Their \u0027Plant-Based Curry Rice\u0027 is widely acclaimed, featuring a rich, smooth Japanese-style curry sauce infused with subtle fruity notes and a mild kick of heat. Juicy and chewy plant-based meat chunks absorb the flavors along with tender potatoes and carrots, creating a deeply fragrant, appetizing dish that lets vegetarians fully indulge in pirate fare.", "name": "Barbossa\u0027s Bounty", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to Treasure Cove."}, {"address": "Spice Bazaar, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A renowned Japanese ramen shop in Disneytown that specially created a \u0027Plant Protein Vegetable Ramen\u0027 for vegetarian guests. The savory, sweet broth contains zero animal ingredients, while springy ramen noodles absorb the rich flavors. Topped with seared sweet corn, shiitake mushrooms, and fresh seasonal greens, it\u0027s a refreshing, hearty, and aromatic bowl\u2014making it a popular stop for a quick energy boost during park visits.", "name": "IPPUDO", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), walk about 6 minutes to Spice Bazaar in Disneytown."}, {"address": "Tomorrowland, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | A futuristic, spacious quick-service restaurant in Tomorrowland starring the \u0027Special Plant-Based Cheeseburger\u0027. The grilled plant-based patty offers a subtle smoky char and a juicy, tender bite nearly indistinguishable from real beef. Layered with melted rich cheese and crisp lettuce wrapped in a soft bun, it is a favorite quick vegetarian option for kids and young adventurers exploring the future.", "name": "Stargazer Grill", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to Tomorrowland."}, {"address": "Lakeside District, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | A popular American bar and grill in Disneytown boasting exceptional plant-based options. Their \u0027Avocado \u0026 Quinoa Super Salad\u0027 features ripe avocados, crunchy quinoa, and fresh greens tossed in a sweet-and-tangy signature vinaigrette\u2014light, guilt-free, and nutrient-packed. Their plant-based burger served with thick-cut fries is equally satisfying, making it a hit among families and international visitors.", "name": "blue frog Bar \u0026 Grill", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1), walk about 7 minutes to Lakeshore, Disneytown."}, {"address": "Fantasyland, Shanghai Disneyland, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | A cozy, fairy-tale restaurant in Fantasyland serving delicious \u0027Wild Mushroom and Vegetable Pizza\u0027. High-temperature baking produces a crust that is golden and crisp on the outside yet soft inside with a subtle wheat aroma. Generously topped with rich mozzarella cheese, colorful bell peppers, and wild mushrooms, it serves up gooey cheese pulls and delightful savory flavors\u2014perfect for vegetarian families dining with children.", "name": "Pinocchio Village Kitchen", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk to Fantasyland."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Treasure Cove, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | An iconic walk-and-eat snack you must try at Disney! The skin is roasted to a light golden brown with a rich smoky aroma. One bite reveals crispy skin and an explosion of savory juice\u2014the tender, juicy turkey meat is delightfully seasoned, and the huge portion is immensely satisfying. Its dramatic appearance and delicious taste make it a top choice for photo ops and snacking on the go.", "name": "Treasure Cove Turkey Leg Cart", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk to the Treasure Cove area"}, {"address": "Inside Mickey Avenue, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | A trendy Donald Duck-themed ice cream shop. Its signature freshly baked waffles pair perfectly with rich soft-serve milk ice cream\u2014crispy on the outside, soft on the inside, with a deep egg and vanilla aroma. The ice cream is silky smooth, dense, and perfectly balanced in sweetness. Adorable and eye-catching for photos, it\u0027s a must-have summer treat and the park\u0027s most popular street dessert.", "name": "Il Paperino", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk along Mickey Avenue for about 3 minutes"}, {"address": "Inside Mickey Avenue, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | A sweet confectionary shop filled with a dreamy pink atmosphere. The main attractions are freshly made Disney character-shaped candy apples and cake pops. Wrapped in a crunchy layer of rich chocolate or candy coating with soft cake or sweet-and-sour apple inside, every bite is wonderfully multi-layered. A favorite among children and young visitors alike.", "name": "Sweethearts Confectionery", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk along Mickey Avenue for about 2 minutes"}, {"address": "Inside Mickey Avenue, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A French-style street bakery inspired by Remy from Ratatouille. Freshly baked Disney character pastries, breads, and tarts fill the shop\u2014the flaky croissants are perfectly layered and deliciously crispy, filled with rich and smooth custard. Convenient to grab and eat on the go, it\u0027s the perfect street snack to start your morning or boost your energy in the afternoon.", "name": "Remy\u0027s Patisserie", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk along Mickey Avenue for about 2 minutes"}, {"address": "Inside Gardens of Imagination, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | A classic market snack kiosk located near Gardens of Imagination. Famous for hot, freshly fried churros and specialty popcorn, the churros are dusted in sweet cinnamon sugar\u2014crispy on the outside and chewy on the inside, made even more irresistible dipped in rich chocolate sauce. Served in handy takeaway boxes for easy walking and eating, it\u0027s an indispensable theme park snack.", "name": "Timothy\u0027s Treats", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk towards Gardens of Imagination"}, {"address": "Inside Treasure Cove, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | A specialty kiosk serving hot, Chinese-style street snacks. Famous for its Donald Duck-shaped pork belly bao and Mickey-shaped pork buns, the steamed buns are soft and fluffy, stuffed with juicy, savory pork fillings. Combining adorable designs with comforting local flavors, it\u0027s a popular snack choice for visitors seeking a hot, savory alternative to Western sweets.", "name": "Sailor\u0027s Snacks", "transport": "Metro Line 11 Disney Resort Station Exit 1, enter the park and walk to the Treasure Cove area"}, {"address": "Lane 255 West Shendi Road, Disneytown, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A Southeast Asian-style street eatery located in Disneytown. Freshly toasted Kaya toast boasts a golden, crispy crust slathered with rich, sweet kaya jam and smooth butter, creating a fragrant blend of sweet and savory in every bite. Paired with a cup of rich iced Teh Tarik, it\u0027s a popular spot for a light bite while strolling through Disneytown after leaving the park.", "name": "Toast Box at Disneytown", "transport": "Metro Line 11 Disney Resort Station Exit 2, walk about 5 minutes to Disneytown"}, {"address": "Lane 255 West Shendi Road, Disneytown, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | A popular street tea shop and bakery. Offering exclusive resort-limited fruit teas and Brown Sugar Boba Fresh Milk, made with sweet-and-sour crushed real fruit and chewy brown sugar boba. The store also sells freshly baked Boba Egg Tarts featuring flaky tart shells filled with silky smooth egg custard that oozes upon biting\u2014a comforting handheld treat enjoyed by visitors walking around Disneytown.", "name": "HEYTEA at Disneytown", "transport": "Metro Line 11 Disney Resort Station Exit 2, walk about 5 minutes to Disneytown"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Shanghai Disney Resort"}, "french-concession": {"categories": {"cat_1": {"items": [{"address": "No. 588 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Guangming Chun Restaurant is a household time-honored culinary landmark on Middle Huaihai Road in the Former French Concession, where long queues form daily. It is renowned for its authentic Shanghainese cooked deli items and fresh pork mooncakes. The pork mooncakes feature flaky, layered crusts stuffed with plump, juicy pork; taking a bite releases a burst of savory broth. The soy-braised duck showcases a deep reddish-brown glaze, balancing salty and sweet flavors with firm, flavorful meat\u2014perfectly embodying the traditional Shanghainese \u0027heavy oil and red sauce\u0027 style. It is beloved by both local residents and visiting foodies alike.", "name": "Guangming Chun Restaurant", "transport": "Approx. 3-min walk from Exit 3 of Middle Huaihai Road Station (Metro Line 13)"}, {"address": "No. 41 Tianping Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Located on Tianping Road, Old Jesse Restaurant is one of Shanghai\u0027s most iconic Benbang (local style) restaurants. Though intimate in size, getting a table is notoriously difficult year-round. Its signature dish, \u0027Jesse Braised Pork Belly\u0027, pairs pork belly with tofu knots, slow-simmered to a glossy crimson red; the fat melts in your mouth without feeling greasy, while the lean meat is tender and savory. Pouring the collagen-rich sauce over steamed rice is perfection. Another favorite, \u0027Scallion Braised Crucian Carp\u0027, fries the fish until crispy before stewing it with abundant charred scallions, rendering even the bones soft and tasty. Its balanced sweet-and-savory profile has won high praise from gourmets worldwide.", "name": "Old Jesse Restaurant", "transport": "Approx. 6-min walk from Exit 1 of Chiao Tung University Station (Metro Lines 10/11)"}, {"address": "No. 130 Jinxian Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Nestled on Jinxian Road, Lan Xin Restaurant is a charming, nostalgic eatery carrying forward decades of classic home-style Shanghainese flavors. While its signature Braised Pork Belly and Soy-Braised Duck are deliciously authentic, the Stir-fried String Beans and Deep-fried River Shrimps are must-orders for every table. The shrimps are fried so crisp that you can eat them shell-and-all; inside, the sweet, springy shrimp meat is coated in a rich, sweet-and-savory glaze, delivering an unforgettable crunch that showcases the pure charm of old Shanghai home cooking.", "name": "Lan Xin Restaurant", "transport": "Approx. 5-min walk from Exit 2 of South Shaanxi Road Station (Metro Lines 1/10/12)"}, {"address": "No. 36 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Situated on Sinan Road, A Niang Noodle Restaurant is a legendary staple in Shanghai\u2019s noodle scene, famous for decades for its exquisite local-style noodles. The iconic \u0027Yellow Croaker Noodles\u0027 uses fresh wild baby yellow croaker fillets prepared daily, deboned and pan-fried to a golden crisp. The broth, simmered for hours, turns milky white, incredibly rich and completely free of fishiness. Thin noodles absorb the savory fish broth, offering a smooth yet springy texture. Complemented by crispy potherb mustard greens, every bite offers warmth and deliciousness\u2014an essential spot in the French Concession.", "name": "A Niang Noodle Restaurant", "transport": "Approx. 7-min walk from Exit 1 of Middle Huaihai Road Station (Metro Line 13)"}, {"address": "No. 328 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Located on Jianguo West Road in Xuhui District, Jianguo 328 Restaurant is a famed eatery serving healthy, traditional Shanghainese cuisine without added MSG, making it a favorite among expats and local food lovers alike. Their deceptively simple \u0027Scallion Oil Noodles\u0027 requires masterful technique: fragrant charred scallions paired with secret-recipe soy sauce and special lard, tossed with chewy noodles for a mouthwatering aroma. Another favorite, \u0027Xin Tai Ruan\u0027 (Soft Heart), features red dates stuffed with chewy glutinous rice, generously drizzled with osmanthus honey. Its delicate, non-sickly sweetness perfectly captures the alluring charm of classic Shanghai pastries.", "name": "Jianguo 328 Restaurant", "transport": "Approx. 8-min walk from Exit 2 of Jiashan Road Station (Metro Lines 9/12)"}, {"address": "No. 271 Fumin Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.1 stars | Open since the 1980s on Fumin Road, Paul Restaurant retains the unique nostalgic atmosphere of an old Shanghai villa dining house. Its classic dish, \u0027Swiss Steak\u0027, fuses Western ingredients with Chinese cooking techniques; the beef is remarkably tender and juicy, bathed in a rich, tangy sweet-and-sour sauce. The \u0027Seafood Youtiao with Grandma\u0027s Pickles\u0027 stuffs crispy fried dough sticks with minced shrimp paste before braising, creating a dish soft on the outside, springy inside, and bursting with flavor. With generous portions and authentic old-school flavor, it\u2019s a top pick to experience the fusion heritage of Shanghai\u0027s Haipai cuisine.", "name": "Paul Restaurant", "transport": "Approx. 5-min walk from Exit 8 of Changshu Road Station (Metro Lines 1/7/14)"}, {"address": "No. 689 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.0 stars | Founded in the 1950s, Canglang Pavilion is an iconic Suzhou-style noodle house and traditional pastry brand in Shanghai\u0027s Former French Concession. Its \u0027Spicy Pork Noodles\u0027 and seasonal \u0027Three-Shrimp Noodles\u0027 are renowned. The spicy pork is diced small and stir-fried until tender, juicy, and spicy, served in a clear, flavorful broth paired perfectly with thin, firm noodles. Additionally, their traditional Suzhou-style pastries, such as \u0027Double Cake\u0027 and \u0027Tiaotou Cake\u0027, feature soft, chewy textures filled with smooth red bean paste\u2014a cherished nostalgic treat for locals who grew up eating them.", "name": "Canglang Pavilion Noodle House", "transport": "Approx. 2-min walk from Exit 2 of Middle Huaihai Road Station (Metro Line 13)"}, {"address": "No. 41 Ruijin 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Feng Yu Sheng Jian is a celebrated time-honored chain serving traditional street food snacks in Shanghai, with its Ruijin 2nd Road branch beloved by neighborhood locals and travelers alike. Its famous signature Shengjianbao (pan-fried pork buns) feature a thin wrapper with a crispy, golden-brown bottom, topped with black sesame seeds and chopped scallions. Inside, the savory meat filling is firm and springy, erupting with hot, flavorful broth at the first bite. Pair it with a bowl of refreshing Fried Tofu \u0026 Cellophane Noodle Soup\u2014where juicy tofu absorbs the sweet broth\u2014for the ultimate authentic old Shanghai breakfast and street eats combo.", "name": "Feng Yu Sheng Jian", "transport": "Approx. 6-min walk from Exit 4 of South Shaanxi Road Station (Metro Lines 1/10/12)"}], "name": "Local Legendary Eateries"}, "cat_2": {"items": [{"address": "1F, Building 14, No. 322 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Nestled in a lush, retro courtyard on Anfu Road, RAC Bar is the ultimate iconic brunch temple in the Shanghai French Concession. Its crown jewel is the authentic French buckwheat crepe (Galette)\u2014golden and crispy on the edges with a slightly chewy texture, wrapping savory ham, melted cheese, and a runny poached egg. Cutting into it releases warm, rich egg yolk for a delightfully layered bite. Paired with a Flat White topped with silky foam, it is the perfect spot to soak in the relaxed, sunlit French vibe beneath the plane trees.", "name": "RAC Bar", "transport": "Metro Lines 10/11 Jiaotong University Station, Exit 7, approx. 10 mins walk"}, {"address": "1F, No. 376 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Located at the heart of the historic Wukang Road, its minimalist pure-white design complements the shadows cast by trees over historic garden houses. The signature \u0027Spanish Latte\u0027 is a must-try classic for coffee lovers, blending premium espresso with fresh milk and a hint of condensed milk. Exceptionally smooth and velvety, it offers a deeply balanced flavor profile of subtle bitterness, rich nutty notes, and gentle milky sweetness. Sitting by the open glass window with a cup of coffee while admiring the streetscapes of the French Concession makes for a quintessential pilgrimage experience for visitors.", "name": "% Arabica (Wukang Road Branch)", "transport": "Metro Lines 10/11 Jiaotong University Station, Exit 1, approx. 8 mins walk"}, {"address": "No. 256 Jianguo West Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | A classic traditional French bakery shaded by plane trees, where the aroma of baked butter and wheat greets you right at the door. The wildly popular \u0027Pistachio Croissant\u0027 features gorgeous flaky layers and an insanely crispy crust that crackles with every bite, filled with rich, smooth pistachio custard. The nutty aroma and buttery sweetness explode in your mouth. Paired with a freshly brewed hot latte, it creates an elegant French brunch experience beloved by locals and expats alike.", "name": "PAIN CHAUD (Jianguo West Road Branch)", "transport": "Metro Line 9 Jiashan Road Station, Exit 2, approx. 6 mins walk"}, {"address": "No. 110 Yongjia Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Specializing in artisanal sourdough and healthy organic brunch, the cozy wooden rustic style and lush greenery create a textured, relaxing home-like feel. The signature \u0027Avocado \u0026 Smoked Salmon Poached Egg Sourdough\u0027 is outstanding\u2014crispy on the outside, soft on the inside with a slight tangy wheat flavor, topped with smooth ripe avocado mash and savory smoked salmon. Gently breaking the poached egg coats everything in golden yolk, delivering a moist, rich, and incredibly layered bite. It\u0027s a blockbuster brunch dish that balances health and ultimate flavor.", "name": "O\u0027Mills Bakery \u0026 Bistro (Yongjia Road Branch)", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 2, approx. 7 mins walk"}, {"address": "Room 104, No. 308 Anfu Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | A long-standing popular brunch bakery on Anfu Road, highly praised for its additive-free, healthy handcrafted bread. The signature soul dish, the \u0027Sunflour Sea Salt Roll\u0027, features a lightly crispy, chewy exterior and a tender, bouncy center. As you chew, the rich aroma of quality butter blends instantly with flakes of sea salt on top, hitting a perfect sweet-and-savory balance that is simple yet deeply addictive. The brunch plates come with freshly pan-fried sausages, fresh salad, and freshly squeezed juice, making it a hotspot to savor the slow pace of life in the French Concession.", "name": "Sunflour (Anfu Road Branch)", "transport": "Metro Lines 10/11 Jiaotong University Station, Exit 7, approx. 9 mins walk"}, {"address": "No. 210 Fumin Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.5 stars | Situated on trendy Fumin Road, Slab Town attracts countless coffee enthusiasts with its industrial concrete-grey tones and open street-side seating. The specialty \u0027Pistachio Latte\u0027 is unique, seamlessly blending house-roasted espresso with rich pistachio paste and topped with silky smooth foam. Every sip bursts with sweet nutty flavors and coffee bitterness on the tongue. Sitting on a roadside stool watching plane leaves fall and stylish passersby offers the most direct taste of the French Concession\u0027s unique corner coffee culture.", "name": "Slab Town (Fumin Road Branch)", "transport": "Metro Lines 2/7 Jing\u0027an Temple Station, Exit 8, approx. 8 mins walk"}, {"address": "No. 234 Nanchang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Tucked inside a historic house on Nanchang Road, this boutique specialty cafe retains old Shanghai red brick walls and vintage metal lever espresso machines, creating a captivating atmosphere. The signature \u0027Butter Latte\u0027 is a must-try\u2014smooth and rich like liquid butter gliding down your throat, followed by a surge of strong nutty and caramel aromas from the espresso, leaving a warm and lingering mouthfeel. The cafe also serves delicate French desserts and light brunch, brimming with artistic flair.", "name": "Metal Hands (Nanchang Road Branch)", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 124 Maoming South Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | A highly renowned independent specialty coffee shop on Maoming South Road. Though small and cozy, it has conquered countless coffee lovers with its top-notch house-roasted beans. The signature \u0027Dirty Coffee\u0027 is superb\u2014hot, concentrated espresso is extracted directly onto cold, rich specialty milk. The first sip delivers intense fruity and bittersweet notes, followed immediately by cool, creamy milkiness. The multi-dimensional hot-meets-cold sensation explodes in your mouth, making it a hidden gem coffee lovers must not miss.", "name": "BLACKSHEEP ESPRESSO (Maoming South Road Branch)", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 3, approx. 4 mins walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 41 Tianping Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | One of the most authentic Shanghainese restaurants on Tianping Road in the French Concession, a must-visit for celebrities and foodies in Shanghai. The signature Braised Pork Belly is rich yet not greasy, melting in your mouth with a perfectly balanced sweet and savory sauce. Pairing it with Pomfret with Rice Cakes and Scallion Oil Noodles with Dried Shrimp is a classic combination, perfectly embodying the essence of traditional Shanghainese cuisine: \u0027heavy oil, dark sauce.\u0027 The cozy, bustling atmosphere of old Shanghai remains, making seats hard to get during peak dining hours.", "name": "Jesse Restaurant (Old Jesse)", "transport": "Metro Lines 10/11 Chiao Tung University Station, Exit 7, approx. 8 mins walk"}, {"address": "No. 5 North Block Xintiandi, Lane 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | An all-day French bistro created by three-Michelin-starred chef Paul Pairet, located in the historic buildings of the former French Concession. Serving classic French country cuisine, the Duck Confit is highly recommended for its crispy skin and tender, juicy meat. The French Toast is a top dessert choice\u2014caramelized on the outside and silky smooth like custard on the inside, beloved by hipsters and expats alike.", "name": "Polux by Paul Pairet", "transport": "Metro Lines 10/13 Xintiandi Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 130 Jinxian Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A legendary Michelin Bib Gourmand Shanghainese eatery on Jinxian Road. Though small, it always draws long queues. The Sauce-Braised Duck features crispy skin and tender meat with a sweet and savory sauce, capturing authentic old Shanghai home-cooked flavors. Dry-Braised Shrimp and Stir-Fried Pork Liver are also must-tries, cooked to perfection with tender pork liver free of any gamey taste, offering an unforgettable, vibrant alleyway vibe.", "name": "Lan Xin Restaurant", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 2, approx. 7 mins walk"}, {"address": "No. 321 Xinhua Road, Changning District, Shanghai", "feature": "\u2b50 4.7 stars | A renowned French bistro hosted by French chef Nicolas Le Bec, situated along tree-lined Xinhua Road in the French Concession. Housed in a romantic historic villa with a garden, signature dishes like P\u00e2t\u00e9 en Cro\u00fbte and aged steaks fill the air with irresistible aromas. Paired with carefully selected French red wines, it is the perfect spot to experience the relaxed pace and charm of the French Concession.", "name": "Villa Le Bec (321 Villa)", "transport": "Metro Lines 10/11 Chiao Tung University Station, Exit 5, approx. 12 mins walk"}, {"address": "No. 29 Mengzi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | A premier French seafood bistro featuring elegant and refined vintage decor. Signature dishes like the Traditional Seafood Stew and White Wine Steamed Mussels are crowd favorites; the mussels are plump and sweet, served with custom cream sauce and crusty baguettes so every bite bursts with oceanic flavor. The fresh oyster platter is delightfully sweet and smooth, making it a top choice for romantic dates and gatherings.", "name": "Coquille Seafood Bistro", "transport": "Metro Lines 9/13 Madang Road Station, Exit 3, approx. 6 mins walk"}, {"address": "No. 87 Fumin Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.4 stars | Tucked under the plane trees on Fumin Road, this classic French bistro exudes the vibrant atmosphere of a Parisian street bistro. Offering classic French comfort food alongside an extensive wine list, highlights include savory seared foie gras and rich, cheesy French onion soup served with warm, freshly baked bread\u2014transporting you straight to the banks of the Seine. A favorite among local expats and food lovers.", "name": "Bistro du Vin", "transport": "Metro Lines 1/7 Changshu Road Station, Exit 8, approx. 5 mins walk"}, {"address": "No. 568 Jianguo West Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | A French-Japanese fusion bistro on Jianguo West Road, seamlessly blending delicate Japanese ingredients with precise French culinary techniques. Highlights include the Charcoal-Grilled French Lamb Chops and Sea Urchin Risotto, where the rice absorbs rich seafood broth topped with fresh, creamy sea urchin. Paired with curated natural wines and sakes, it delivers a refreshing culinary experience.", "name": "Bistro Sola", "transport": "Metro Lines 7/9 Zaojiabang Road Station, Exit 2, approx. 8 mins walk"}, {"address": "No. 189 Wanping Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 stars | A renowned Shanghainese restaurant on Wanping Road, hailed as one of the hallmark spots for Shanghainese braised pork belly. Its signature \u0027Yuan Yuan Braised Pork Belly\u0027 features carefully selected pork belly slow-simmered to a glossy red shine, incredibly tender, melt-in-your-mouth, and non-greasy. Stewing it with abalone enhances the savory richness even further. The elegant ambiance perfectly reflects the refined and graceful culture of Jiangnan cuisine.", "name": "Yuan Yuan Restaurant", "transport": "Metro Lines 1/9/11 Xujiahui Station, Exit 14, approx. 10 mins walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 1037 Yuyuan Road, Changning District, Shanghai", "feature": "\u2b50 4.8 stars | A top-tier, Michelin-starred feast of culinary art. Tucked along the tranquil Yuyuan Road near the edge of the French Concession, Fu He Hui seamlessly blends Zen aesthetics with modern fine dining. The signature \u0027Lily Bulb \u0026 Yam\u0027 is silky smooth and melts in your mouth, infused with rich signature truffle sauce. The \u0027Smoked Vegetarian Steak\u0027 crafts a beef-like tender chew out of lion\u0027s mane mushrooms\u2014crisp on the outside, juicy and tender on the inside. Highly acclaimed by tourists and foodies alike for transforming simple vegetarian ingredients into a breathtaking sensory masterpiece.", "name": "Fu He Hui", "transport": "Take Metro Line 2 or 11 to Zhongshan Park Station (Exit 5), and walk for about 8 minutes."}, {"address": "1st Floor, Building 1, No. 758 Julu Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.7 stars | Located at the trendy Julu Road 758 complex, this spot draws young crowds and travelers with its minimalist wooden decor and serene tea aromas. The signature \u0027Black Truffle Fried Rice\u0027 features perfectly distinct, chewy grains fragrant with wild mushrooms and black truffle. The \u0027Pan-Fried Homemade Tofu with Olive Oil\u0027 boasts a golden, crispy crust shielding a soft, silky interior that rivals fresh milk curd. Blending traditional Eastern vegetarian dining with modern, stylish warmth, it\u2019s a hit plant-based hotspot in the French Concession.", "name": "Qingchun Pumen", "transport": "Take Metro Line 2, 12, or 13 to West Nanjing Road Station, and walk for about 10 minutes."}, {"address": "B1 Floor, Bailian Huaihai 758, No. 527 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | An innovative branch of a century-old vegetarian institution, this location on Middle Huaihai Road blends vintage Old Shanghai charm with sleek modern simplicity. The must-try \u0027Vegetable Steamed Buns\u0027 feature soft, fluffy dough packed with vibrant, sweet greens and savory shiitake mushrooms with a hint of sesame oil. The \u0027Vegetarian Crab Roe Noodles\u0027 expertly combines shredded potato and carrot to mimic the rich, savory texture of real crab roe\u2014a velvety favorite cherished by local Shanghainese and visitors alike.", "name": "Chunfeng Songyue Tower", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), and walk for about 3 minutes."}, {"address": "1st Floor, Shanghai Plaza, No. 77 Songshan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Named after a Chinese pun for \u0027eat vegetarian early,\u0027 this iconic venue is a pioneer in Shanghai\u0027s innovative plant-based scene. Located in the Songshan Road shopping area near Huaihai Road, the kitchen adheres strictly to no eggs, alcohol, or MSG. The flagship \u0027Chang Xiang Si\u0027 uses plant protein to recreate crisp-skinned roast duck\u2014golden on the outside and tender within. The \u0027Black Pepper Ve
