the Huaihai Road shopping district.", "name": "Peet\u0027s Coffee (Donghu Road Flagship Store)", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 2; approx. 5-minute walk"}, {"address": "No. 54 North Xiangyang Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.5 stars | A minimalist cafe that went viral for its industrial stainless-steel design and visually stunning pastries. Must-try items include the Black Truffle Croissant and Butter Croissant, baked to ultra-crispy perfection outside with a rich, airy honeycomb structure inside that melts in your mouth. Paired with a special Black Sesame Latte or cold drip coffee, the subtle caffeine bitterness balances the rich pastries, creating a visual and flavor feast that draws crowds of young brunch enthusiasts.", "name": "BASDBAN", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 1; approx. 7-minute walk"}, {"address": "No. 500 South Xiangyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | A bakery and brunch eatery filled with South-of-France rustic charm, featuring ample natural light from large floor-to-ceiling windows. Famous for fresh sourdough bread, its signature Shakshuka features poached eggs stewed in a rich, spiced tomato sauce. Dipping the freshly baked sourdough\u2014crusty outside and chewy inside\u2014into the dish creates a tangy, savory bite. Pair it with a cup of fragrant Yirgacheffe pour-over coffee, whose bright fruit acidity makes you feel like sitting in a European sidewalk cafe.", "name": "BREAD-ETC", "transport": "Metro Lines 9/12 Jiashan Road Station, Exit 2; approx. 6-minute walk"}, {"address": "No. 888 Huashan Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.7 stars | A dream establishment combining French artisan baking, exquisite brunch, and handcrafted ice cream. The salted caramel ice cream and freshly baked French toast are a legendary combo among foodies\u2014the toast is golden and crispy on the outside, pudding-soft and rich with egg and maple sweetness on the inside. Brunch plates feature fresh salad, smoked salmon, and slow-cooked eggs. Paired with a cold brew, it offers distinct layers of refined flavor, representing elegant French living between Xujiahui and Huaihai Road.", "name": "Luneurs (Huashan Road Branch)", "transport": "Metro Lines 10/11 Chiao Tung University Station, Exit 7; approx. 9-minute walk"}, {"address": "No. 37 Yongjia Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | An independent specialty coffee house originating from Beijing, this Yongjia Road location carries a strong sense of retro nostalgia and hutong indie-art vibe. The flagship product, \u0027Dirty Coffee\u0027, extracts hot espresso directly onto chilled milk; your first sip brings intense warm espresso bitterness followed by smooth cold milk sweetness, creating a striking contrast of temperatures and flavors. Pair it with the handmade Pistachio Basque Cheesecake\u2014creamy and smooth with a rich nutty aroma\u2014for the ultimate afternoon coffee and dessert experience.", "name": "Metal Hands (Yongjia Road Branch)", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 6; approx. 6-minute walk"}, {"address": "No. 100 North Xiangyang Road, Jing\u0027an District, Shanghai", "feature": "\u2b50 4.5 stars | A cozy greenhouse-style brunch spot serving creative American and Australian-style egg dishes all day. The signature Avocado Toast uses toasted multigrain bread topped with creamy avocado mash and fresh herbs. Cutting into the poached egg releases rich golden yolk over the bread, delivering a smooth, refreshing, and nutritious bite. Paired with a silky oat milk latte featuring natural sweet notes blended with roasted coffee flavor, it\u0027s a hidden haven for health-conscious foodies seeking quality brunch.", "name": "EGG", "transport": "Metro Lines 1/7 Changshu Road Station, Exit 2; approx. 8-minute walk"}, {"address": "No. 627 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A minimalist industrial-style brand leading Shanghai\u0027s trendy coffee culture, with a highly stylish store on Middle Huaihai Road. Its most famous original creation, the \u0027Oatmeal Cookie Latte\u0027, uses a crispy oat chocolate cookie as the cup to hold hot latte. Over time, the inner chocolate melts gently into the coffee, and after drinking, you can eat the coffee-infused cookie cup. Fun and innovative, this playful drinking experience attracts streams of young tourists and coffee lovers.", "name": "M-Stand (Middle Huaihai Road Flagship Store)", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 1; approx. 3-minute walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 41 Tianping Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Located on Tianping Road, Old Jesse is a legendary landmark of Shanghainese local cuisine, beloved by local foodies and international visitors alike. Its signature \u0027Braised Pork Belly with Scallion Braised Chicken\u0027 and \u0027Opium Fish Head\u0027 are highly celebrated. The braised pork is rich without being greasy, melt-in-your-mouth tender, and coated in a dark, rich, savory-sweet sauce; the Opium Fish Head is covered with pickled peppers and scallions, offering tender, juicy fish with a subtly spicy aroma. The cozy, nostalgic atmosphere perfectly captures the warmth and authentic flavors of old Shanghai.", "name": "Old Jesse Restaurant", "transport": "Metro Lines 1/9/11 Xujiahui Station, Exit 10, approx. 8 mins walk"}, {"address": "No. 887 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Situated on Middle Huaihai Road, this exquisite crab bistro is famous for its decadent crab roe noodles. The signature \u0027Xie Taiji\u0027 and \u0027Crab Roe Noodles\u0027 each feature the roe and meat of over ten selected hairy crabs. The golden, lustrous crab roe is rich, creamy, and packed with ocean sweetness, paired perfectly with chewy noodles for a top-tier culinary indulgence. Offering complimentary tea and refined appetizers, the elegant dining experience draws countless food enthusiasts.", "name": "Xiejia Dayuan (Crab House)", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 1, approx. 3 mins walk"}, {"address": "Building 18, No. 181 Taicang Road, Huangpu District, Shanghai (near Middle Huaihai Road)", "feature": "\u2b50 4.5 stars | Helmed by three-Michelin-starred Chef Paul Pairet, this French bistro is situated in the Xintiandi area off Huaihai Road. It effortlessly blends the relaxed, casual charm of a traditional French bistro with modern chic. Recommended dishes include the \u0027Duck Confit\u0027\u2014with crispy skin and tender meat that easily falls off the bone\u2014and the \u0027French Toast\u0027, featuring a caramelized, crispy exterior and a cloud-like, moist interior. Whether for all-day brunch or evening wine pairings, it is a stellar spot to savor French romance and fine cuisine.", "name": "Polux by Paul Pairet", "transport": "Metro Lines 10/13 Xintiandi Station, Exit 1, approx. 5 mins walk"}, {"address": "No. 271 Fumin Road, Jing\u0027an District, Shanghai (near Middle Huaihai Road)", "feature": "\u2b50 4.3 stars | Located on Fumin Road near Middle Huaihai Road, Baolu is a classic local restaurant that generations of Shanghainese grew up with. The interior exudes retro Shanghainese nostalgia. The signature \u0027Swiss Steak\u0027 interprets Western steak using local heavy-oil and dark-sauce techniques, yielding juicy meat infused with fruity and sweet-savory notes. The \u0027Crispy Fritter with Shrimp Paste\u0027 stuffs deep-fried dough sticks with fresh shrimp paste, fried to a golden crisp. Affordable and generous, it is a top choice for authentic Shanghainese fusion dishes.", "name": "Baolu Restaurant", "transport": "Metro Lines 1/7/10 Changshu Road Station, Exit 4, approx. 6 mins walk"}, {"address": "6F, North Tower, Hong Kong Plaza, No. 282 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Located in Hong Kong Plaza on Middle Huaihai Road, Highline is an ultimate American restaurant combining a Western bistro with a rooftop terrace bar. Featuring a spacious, sunlit outdoor terrace, it overlooks the bustling streetscape of Huaihai Road. Serving modern American cuisine and craft cocktails, signature dishes include the \u0027Charcoal-Grilled Prime Ribeye\u0027, crispy outside and juicy inside with a smoky aroma, and the \u0027Lobster Seafood Rice\u0027, packed with rich seafood broth and al dente rice. Its stylish decor and marvelous views make it a popular hotspot for date nights and social gatherings.", "name": "Highline", "transport": "Metro Line 1 South Huangpi Road Station, Exit 2, direct access to Hong Kong Plaza"}, {"address": "L4-410, iapm Mall, No. 999 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Located inside iapm Mall on Middle Huaihai Road, Yongfu Zunxian is an accessible, upscale regional dining brand under the Michelin-starred Yongfu group, featuring top-grade Ningbo East China Sea seafood. The signature \u0027Taro Soup\u0027 is silky and velvety, melting in your mouth with rich broth flavors. The \u0027Home-Style Large Yellow Croaker\u0027 features flaky, tender meat in a rich, appetizing, slightly sour and spicy broth. Bright and elegant, the restaurant elevates fresh catches with superb craftsmanship.", "name": "Yongfu Zunxian", "transport": "Metro Lines 1/10/12 South Shaanxi Road Station, Exit 2, direct access to iapm Mall"}, {"address": "No. 201 Xingguo Road, Changning District, Shanghai (near West Huaihai Road)", "feature": "\u2b50 4.5 stars | Located near Xujiahui and West Huaihai Road, Yuan Yuan Restaurant is widely recognized as one of Shanghai\u0027s top braised pork belly destinations. Its signature \u0027Yuan Yuan Braised Pork Belly\u0027 uses selected pork belly slow-simmered for hours to achieve an amber glaze; the meat is tender and rich without being greasy, paired with a perfectly balanced sweet-and-savory sauce. Additionally, the \u0027Yellow Croaker Stewed with Tofu\u0027 boasts a milky-white, sweet broth with tofu absorbing the essence of the fish soup.", "name": "Yuan Yuan Restaurant", "transport": "Metro Lines 10/11 Jiaotong University Station, Exit 7, approx. 8 mins walk"}, {"address": "No. 284 Anfu Road, Xuhui District, Shanghai (near Middle Wulumuqi Road)", "feature": "\u2b50 4.4 stars | Located near Anfu Road and Middle Huaihai Road, Xiawei Guan is a popular dining spot highlighting refined Shanghainese private-kitchen dishes and regional specialties. The interior is classically elegant, evoking the grand manor style of Old Shanghai. The signature \u0027Braised Pork Belly with Dried Fugu\u0027 harmoniously blends dried seafood with rich pork, resulting in a savory broth. The \u0027Crystal Shrimp\u0027 are plump, translucent, and springy, tasting refreshing when dipped in Zhejiang vinegar.", "name": "Xiawei Guan", "transport": "Metro Lines 1/7 Changshu Road Station, Exit 8, approx. 10 mins walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 448 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A century-old legendary vegetarian establishment famous for its exquisite traditional art of mock meat craftsmanship. The signature marinated mock duck is firm, flavorful, and layered with delicate tofu skin that releases a subtle sweetness upon taking a bite. Their faux crab meat is remarkably realistic, crafted from potatoes and carrots for a velvety, dense texture paired with specially blended aromatic vinegar\u2014a perfect recreation of classic Old Shanghai flavors beloved by both elders and tourists.", "name": "Godly Vegetarian Restaurant", "transport": "Approx. 5-min walk from South Huangpi Road Station (Metro Line 13)"}, {"address": "No. 500 South Xiangyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | A minimalist vegan restaurant tucked away in an alley near the Huaihai Road commercial area. Specializing in healthy, innovative plant-based dishes without eggs, dairy, or refined sugar, its signature Black Truffle Wild Mushroom Risotto features perfectly distinct, creamy grains infused with a captivating mushroom aroma. The dairy-and-egg-free plant-based cheesecake is rich and smooth, easily competing with traditional cheesecakes\u2014a huge hit among youth and expats.", "name": "IF Vegan", "transport": "Approx. 6-min walk from Exit 4 of Jiashan Road Station (Metro Lines 9/12)"}, {"address": "No. 160 Taiyuan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 stars | A high-end Zen-inspired vegetarian fine dining establishment near Middle Huaihai Road. Presenting set menus styled like Kaiseki dining, the signature \u0027Lily \u0026 Black Truffle Soup\u0027 offers a light, naturally sweet broth where pure ingredients burst with flavor. Paired with exquisite tableware and a tranquil garden view, it delivers an ultimate feast for both eyes and palate\u2014a top destination for diners seeking holistic mind-body relaxation.", "name": "Yeye Puthi", "transport": "Approx. 10-min walk from Exit 2 of Changshu Road Station (Metro Lines 1/7)"}, {"address": "Floor B2, K11 Art Mall, No. 300 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | A Western-style light vegetarian restaurant located inside the famous K11 Art Mall on Huaihai Road. Focusing on healthy, hearty warm salads and plant-based burgers, the signature Pink Beetroot Burger pairs a dense bean-and-plant patty with house-made plant sauce. Juicy and pleasantly chewy, it\u0027s satisfying yet guilt-free, drawing many business professionals and health-conscious young patrons.", "name": "Pure \u0026 Whole", "transport": "Direct access from South Huangpi Road Station (Metro Line 1)"}, {"address": "Room 201, Jiahui International Plaza, No. 325 Tianyaoqiao Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | A cozy, American vintage-style vegetarian cafe near Metro City in the Xujiahui commercial area. The signature Tofu Patty Burger is crispy on the outside and tender inside, packed with rich soybean aroma and natural vegetable sweetness. Their custom plant-cheese onion rings are deliciously crispy without being greasy. Adorned with nostalgic American vintage toys, the laid-back atmosphere makes it a hidden gem for vegetarians shopping in Xujiahui.", "name": "Green Vege Cafe", "transport": "Approx. 5-min walk from Exit 4 of Shanghai Stadium Station (Metro Line 4)"}, {"address": "No. 268 South Wanping Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | A budget-friendly, high-value vegetarian buffet restaurant near the Xujiahui commercial area. It features over a hundred varieties of fresh vegetables, freshly pan-fried vegetarian dumplings, piping hot noodle soups, and handcrafted dim sum. The signature handmade vegetarian pan-fried buns have a golden, crispy bottom and a juicy, sweet filling of cabbage and diced shiitake mushrooms. Its wallet-friendly prices and wide selection make it a local favorite.", "name": "Sumanxiang Vegetarian", "transport": "Approx. 8-min walk from Exit 4 of Zhaojiabang Road Station (Metro Lines 7/9)"}, {"address": "Near Shanghai iapm Mall, No. 999 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A classic Shanghainese vegetarian brand established in 1910. The signature \u0027Pure Vegetarian Steamed Bun\u0027 features a delicate skin stuffed generously with bok choy, shiitake mushrooms, and wheat gluten. One bite reveals vibrant green, crisp vegetables infused with a subtle sesame oil aroma. They also serve made-to-order vegetarian crispy chicken\u2014crunchy on the outside and tender inside\u2014making it an incredibly popular street snack on Huaihai Road.", "name": "Songyue Tower", "transport": "Direct access from South Shaanxi Road Station (Metro Lines 1/10/12)"}, {"address": "No. 77 Songshan Road (near Middle Huaihai Road), Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A classic fine vegetarian dining brand nestled in a lane off Middle Huaihai Road. Embracing a healthy philosophy of \u0027no eggs, no alcohol\u0027, its signature \u0027Black Pepper Mock Beef Strips\u0027 are made from high-quality soy protein for a realistically chewy texture, tossed in a fragrant, savory black pepper sauce that pairs perfectly with rice. The house-special longevity noodle soup features a light, sweet broth, making it a favorite among health-conscious diners.", "name": "Vegetarian Lifestyle", "transport": "Approx. 3-min walk from Exit 2 of South Huangpi Road Station (Metro Line 1)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 558 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Lao Da Chang is a classic French-Shanghainese bakery on Huaihai Road holding nostalgic memories for generations of locals. The must-try street sweet is the \u0027Italian Frozen Parfait\u0027, which sits right between ice cream and popsicles\u2014melting instantly in your mouth with rich milky notes and crunchy crushed nuts, without feeling greasy at all. Another highlight, the \u0027Palmier\u0027 (Butterfly Pastry), features flaky, buttery layers cooked to crisp perfection. Loved by both tourists and long-time neighborhood regulars, these pastries remain iconic local treats.", "name": "Lao Da Chang (\u8001\u5927\u660c)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 3), and walk for about 3 minutes."}, {"address": "No. 588 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Located on Middle Huaihai Road, Guangming Village draws long queues at its takeout window year-round. Its signature street bite is the \u0027Freshly Baked Pork Mooncake.\u0027 Slow-pan-fried to create a flaky, multi-layered golden crust, each bite bursts with piping-hot, savory meat juice, featuring a firm, bouncy pork filling balanced with subtle Shanghainese sweetness. This piping-hot delicacy is so good that both tourists and local Shanghainese aunties gladly wait hours in line for it.", "name": "Guangming Village Takeout Window (\u5149\u660e\u90a8\u5927\u9152\u5bb6\u5916\u8ce3\u7a97\u53e3)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), and walk for about 4 minutes."}, {"address": "No. 603 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Harbin Food Factory is a legendary Shanghainese pastry shop on Middle Huaihai Road. Their top street snack, the \u0027Almond Bar,\u0027 features a crisp top layer of shaved almonds coated in rich caramel over a buttery, flaky biscuit base\u2014offering a delightful interplay of toasted and nutty aromas. Other unique favorites include the \u0027Mint Cake\u0027 and \u0027Walnut Bar.\u0027 Thanks to its commitment to traditional craftsmanship and premium ingredients, it remains a quintessential street snack and gift choice.", "name": "Harbin Food Factory (\u54c8\u723e\u6ff1\u98df\u54c1\u5ee0)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1); located directly across the street."}, {"address": "No. 641 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Founded in 1875, this century-old brand features a wildly popular pastry window on Huaihai Road. A must-try grab-and-go sweet treat is the \u0027Tiaotou Gao\u0027 (Sticky Rice Roll with Red Bean), featuring a chewy, non-sticky glutinous rice wrapper filled with smooth red bean paste. During spring, their seasonal \u0027Qingtuan\u0027 (Sweet Green Rice Ball) infused with mugwort aroma is equally unmissable. It\u0027s the perfect stop for experiencing classic soft-and-chewy Shanghainese sweet pastries.", "name": "Shen Da Cheng - Huaihai Branch (\u6c88\u5927\u6210)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), and walk for about 2 minutes."}, {"address": "B1 Floor, Metro City, No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 stars | Located in the bustling Xujiahui commercial hub, Master Bao is the viral street food bakery that sparked a nationwide pastry craze. Its star item, the \u0027Seaweed \u0026 Pork Floss Cake\u0027 (Xiaobei), is coated in crispy seaweed pork floss, wrapping soft chiffon cake oozing with rich creamy mayonnaise sauce. Every savory-sweet bite offers a delightful burst of textures, making it a top street treat for young locals and tourists alike.", "name": "Master Bao Bakery - Xujiahui Branch (\u9b91\u5e2b\u5085\u7cd5\u9ede)", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 10), directly connected to Metro City B1."}, {"address": "No. 120 Ruijin 2nd Road (near Middle Huaihai Road), Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Featured in international media and food documentaries, Ada\u0027s represents authentic handmade Shanghainese street food at its finest. The scallion pancakes follow a unique technique\u2014pan-fried first then baked in an oven\u2014resulting in a golden, extra-crispy exterior with flaky, lard-infused, scallion-packed layers inside. Served piping hot, each crunchy bite explodes with savory aroma. Despite moving locations over the years, foodies from all over still flock here.", "name": "Ada\u0027s Scallion Pancake (\u963f\u5927\u8525\u6cb9\u9905)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), and walk along Ruijin 2nd Road for about 5 minutes."}, {"address": "B1 Floor, Metro City, No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Renowned for serving some of Shanghai\u0027s finest Portuguese egg tarts, Lilian Bakery fills Metro City\u0027s underground street with the mouthwatering aroma of baked vanilla custard. The freshly baked tarts boast ultra-flaky pastry shells with a hundred light layers, filled with smooth, pudding-like custard that melts instantly in your mouth. Portable and affordable, it\u2019s an irresistible shopping snack in Xujiahui.", "name": "Lilian Bakery - Metro City (\u8389\u84ee\u86cb\u64bb)", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 10), directly connected to Metro City B1."}, {"address": "No. 697 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Recommended by the Michelin Bib Gourmand, this classic Shanghai icon specializes in traditional pan-fried pork buns (Shengjian Bao) made with fully fermented dough without heavy soup broth inside. The fresh pork buns feature a delightfully crispy, caramelized bottom crust and soft, chewy dough filled with savory pork. Remarkably non-greasy, it offers a true taste of authentic old-Shanghai street breakfast and afternoon tea culture.", "name": "Da Hu Chun - Huaihai Branch (\u5927\u58fa\u6625)", "transport": "Take Metro Line 13 to Middle Huaihai Road Station (Exit 1), and walk for about 3 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Xujiahui and Huaihai Road"}, "yuyuan-oldcity": {"categories": {"cat_1": {"items": [{"address": "No. 87 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A century-old legendary eatery situated beside Yu Garden\u0027s Nine-Turn Bridge. Founded in 1897, it is renowned as one of the birthplaces of Shanghai\u0027s Xiaolongbao (soup dumplings). Their signature pork soup dumplings feature paper-thin, delicately pleated wrappers bursting with rich, piping-hot broth upon the first gentle bite. The pork filling is succulent, springy, and never greasy. Tourists and locals alike willingly queue for hours just to savor the ultimate taste of fresh, piping-hot dumplings straight from the steamer.", "name": "Nanxiang Steamed Bun Restaurant", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 6 minutes."}, {"address": "No. 115 Yuyuan Road, inside Yuyuan Garden, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A prestigious state-guest level restaurant adjacent to the Nine-Turn Bridge, renowned for hosting foreign heads of state and dignitaries. Famous for refined Shanghainese dim sum and classic local dishes, its signature \u0027Eyebrow Shortcake\u0027 (Meimao Su) features flaky, crispy pastry layers wrapped around savory filling. The \u0027Osmanthus Rice Cake\u0027 sticks to the plate and chopsticks but not to teeth, exuding subtle sweet osmanthus and rice wine aromas with a smooth, velvety texture\u2014offering an exquisite dining experience steeped in culture.", "name": "Lu Bo Lang Restaurant", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 242 Fuyou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Founded in 1875 during the Guangxu reign of the Qing Dynasty (originally named Rongshun Guan), this is the undisputed birthplace of authentic local Shanghai cuisine (Benbang dish). The signature \u0027Eight-Treasure Duck\u0027 is prepared using a unique steam-and-roast technique; the duck meat is tender and flavorful, stuffed with glutinous rice, mushrooms, bamboo shoots, ham, and other rich ingredients, delivering a savory, aromatic, and classic sweet-savory braised profile. The \u0027Deep-Fried River Shrimps\u0027 are crispy outside, tender inside, and perfectly sweet and tangy\u2014highly acclaimed by foodies seeking nostalgic Shanghai flavors.", "name": "Shanghai Old Restaurant", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 3, and walk for about 4 minutes."}, {"address": "No. 104 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Located inside the City God Temple Yu Garden Mall, this is the perfect spot to taste authentic traditional Jiangnan sweet soup balls (tangyuan). The signature \u0027Black Sesame \u0026 Lard Tangyuan\u0027 features a water-milled glutinous rice skin that is soft and chewy. A single bite releases a warm, fragrant stream of molten black sesame and lard filling. They also offer savory pork and crab roe dumplings, catering to both sweet and savory tastes with handmade nostalgic warmth.", "name": "Ningbo Dumpling Store", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 99 Bailing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Founded in 1910, this is Shanghai\u0027s oldest surviving pure vegetarian restaurant. Its legendary specialty, the \u0027Mushroom Vegetable Steamed Bun\u0027, is widely considered the ultimate veggie bun in Shanghai. Filled with bok choy, shiitake mushrooms, and dried tofu, the greens retain their vibrant color and tender texture thanks to a proprietary preparation method. Wrapped in soft, fluffy dough, each bite blends the sweet crispness of greens with the earthy richness of mushrooms\u2014earning rave reviews even from non-vegetarians.", "name": "Chunfeng Songyuelou Vegetarian Restaurant", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 7, and walk for about 6 minutes."}, {"address": "No. 257 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Built during the Qianlong reign of the Qing Dynasty (1784) and situated in the middle of the pond along the Nine-Turn Bridge, this is Shanghai\u0027s oldest existing teahouse. Guests can savor premium Longjing or Bi Luochun tea inside the elegant, historic architecture, paired with signature treats like slow-simmered \u0027Tea Eggs\u0027, traditional spiced beans, and dried tofu. The tea eggs are slow-cooked to perfection with dense, savory yolks. Sipping tea and snacking amidst soothing traditional music delivers an enchanting Jiangnan water-town experience.", "name": "Huxinting Teahouse", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 112 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 3.9 stars | Founded in the 1930s by Guo Lupan, \u0027City God Temple Five-Spice Beans\u0027 is Shanghai\u0027s most iconic traditional food souvenir. Made from fava beans slow-cooked with star anise, cinnamon, sea salt, cream, and other seasonings, the beans feature a subtle white powdery frost on the skin. Slightly firm with a delightful chewiness, they become more aromatic with every bite, revealing a subtle creamy sweetness\u2014a classic snack tied to memories of Old Shanghai.", "name": "Shanghai Spiced Beans Shop", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 41 Wenchang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.0 stars | Dating back to the Xianfeng reign of the Qing Dynasty, this shop symbolizes traditional Shanghainese confectionery at the City God Temple. The signature Pear Syrup Candy is crafted using traditional methods, simmering snow pear juice with traditional herbs like fritillaria, pinellia, and platycodon. Crunchy, sweet, and infused with herbal freshness, it is pleasantly soothing and renowned for relieving coughs and moistening the lungs. Offering herbal and flavored pear candy varieties, it is a must-buy traditional treat for visitors.", "name": "Shanghai Pear Syrup Candy Shop", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}], "name": "Famous Traditional Local Establishments"}, "cat_2": {"items": [{"address": "No. 159 Jiuxiaochang Road, Yuyuan Mall, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Nestled in the historic district of Yuyuan Garden, this M Stand cleverly blends modern minimalist industrial style with classic Jiangnan architecture. The oat milk latte here is silky smooth, perfectly blending coffee and nutty aromas for a rich yet non-bitter taste. The fresh coconut cold brew is a signature highlight, where sweet coconut water complements the fruity acidity and rich aroma of espresso, offering a refreshing pick-me-up. For brunch, try their \u0027Cement\u0027 Cheesecake and baked croissants\u2014crispy on the outside, soft on the inside with distinct layers. It\u0027s a fantastic spot to relax and take photos after exploring the City God Temple, making it a favorite among young travelers and local coffee enthusiasts.", "name": "M Stand (Yuyuan Mall)", "transport": "Metro Line 10 or 14 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 5 minutes walk"}, {"address": "No. 69 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Manner Coffee is a prime representative of Shanghai\u0027s affordable specialty coffee scene. Located on the edge of the Yuyuan commercial area, this branch offers exceptional high-quality coffee at great value. The hot latte features silky, ultra-fine microfoam with a smooth mouthfeel and natural sweetness from lactose, while the dark roast beans leave a rich finish of dark chocolate and roasted nuts. Daily freshly baked matcha croissants and artisanal French pastries are popular brunch choices, boasting a crispy exterior, soft interior, and buttery aroma. Thanks to its fast service and consistent quality, it serves as the ultimate energy station for nearby office workers and visitors heading to the City God Temple.", "name": "Manner Coffee (Jiuxiaochang Road)", "transport": "Metro Line 10 or 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 6 minutes walk"}, {"address": "Inside Yuyuan Mall, No. 111 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Uniquely crafted, this Starbucks Reserve store features traditional Hui-style architecture with classic Jiangnan upturned eaves on the outside, while the interior showcases a luxurious, refined modern coffee workshop style. The store offers exclusive Reserve single-origin pour-over coffees, carefully selecting rare beans from around the world that deliver complex layers, bright citrus acidity, and floral undertones. Pair your brew with a classic quiche or panini sandwich for brunch, featuring rich melted cheese and a deliciously flaky crust. Sitting by the second-floor window, you can sip aromatic coffee while taking in the bustling view of Yuyuan Old Street below, soaking in Shanghai\u0027s seamless blend of old and new.", "name": "Starbucks Reserve (Yuyuan Mall)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 7 minutes walk"}, {"address": "Yuyuan Mall, No. 265 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Originating from California as the pioneer of specialty coffee, Peet\u0027s brings a vibe of California sunshine combined with classic old-Shanghai charm to the historic streets of Yuyuan. Their \u0027Founder\u0027s Espresso\u0027 uses dark roasted beans to create a rich crema with a bold, smooth body featuring delightful smoky, caramel, and dark chocolate notes. For a popular brunch option, try the Australian Beef \u0026 Cheese Croissant Burger\u2014served hot with flaky, multi-layered pastry, juicy beef, and melted cheese for a satisfying texture. Whether enjoying a hearty morning brunch or sipping an exquisite pour-over in the afternoon, it\u0027s a delightful spot you won\u0027t want to leave.", "name": "Peet\u0027s Coffee (Yuyuan Mall)", "transport": "Metro Line 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 8 minutes walk"}, {"address": "No. 1 Yicheng Road, Huangpu District, Shanghai (Near Yuyuan City God Temple)", "feature": "\u2b50 4.4 stars | Created as a cross-industry brand by Qiaojiashan, a century-old Shanghai heritage brand, QIAO COFFEE perfectly realizes the creative brunch concept of pairing traditional Chinese pastries with Western specialty coffee. Here, you can order a smooth and aromatic signature Yellow Wine Latte, where subtle alcohol and creamy milk create a velvety texture. Pair it with freshly steamed Dingsheng cakes, sweet green rice balls (Qingtuan), or savory Xiekehuang (crab-shell pastries) with crisp crusts and flavorful fillings. This unique fusion of classic old-Shanghai tastes and modern specialty coffee draws crowds of tourists and young foodies alike to check in and experience something new.", "name": "QIAO COFFEE (Yuyuan)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 6 minutes walk"}, {"address": "B2 Floor, South Zone, BFC Bund Finance Center, No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located at the BFC Bund Finance Center adjacent to Yuyuan Garden, Seesaw is one of China\u0027s specialty coffee pioneers. This branch offers a bright, spacious setting filled with modern artistic design. Their signature \u0027Cloud Latte\u0027 features ultra-light, pillowy foam with subtle floral and fruity aromas and an elegant, balanced acidity. For brunch, the Smoked Salmon \u0026 Avocado Sourdough Toast is highly recommended\u2014chewy sourdough topped with creamy avocado and savory smoked salmon for a light, refreshing meal. The sophisticated atmosphere and quality food make it a great spot to walk over and relax after visiting Yuyuan and the City God Temple.", "name": "Seesaw Coffee (BFC Bund Finance Center)", "transport": "Metro Line 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 10 minutes walk"}, {"address": "S115, BFC Bund Finance Center, No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Hailing from the century-old Italian brand, LAVAZZA brings authentic Italian coffee culture and exquisite gourmet brunch to the Yuyuan district. Their classic espresso features thick crema and an intense, aromatic flavor with notes of caramel and nuts. A popular brunch choice is the Italian Cappuccino paired with a freshly toasted Focaccia sandwich\u2014crispy on the outside, soft on the inside, filled with Parma ham and fresh cheese for a delicious bite. With its elegant decor and authentic flavors, it is a top choice for lovers of genuine European breakfast and coffee.", "name": "LAVAZZA Coffee (BFC Bund Finance Center)", "transport": "Metro Line 10 or 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 10 minutes walk"}, {"address": "No. 125 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | The famous Canadian coffee chain Tims offers cozy and highly cost-effective brunch options in the Yuyuan shopping area. The signature Freshly Brewed Iced Coffee is smooth and refreshing, featuring bright fruity notes without bitterness. For brunch, the hot-pressed Farmer\u0027s Grilled Cheese Egg Burger paired with fresh, warm Timbits is a must-try; the egg burger has a crispy exterior with gooey melted cheese, while the donut bites are crisp on the outside and soft inside without being overly sweet. Friendly service and great value meals make it popular with both local residents and budget-conscious travelers.", "name": "Tims Coffee (Jiuxiaochang Road)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 5 minutes walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 115 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A century-old, famous high-end restaurant situated by the Nine-Turn Bridge in Yu Garden, having hosted numerous foreign heads of state and VIPs. The restaurant specializes in ultra-exquisite Benbang Haipai (Shanghainese) local cuisine and traditional handmade dim sum. The classic dish \u0027Eight-Treasure Duck\u0027 uses premium duck steamed until tender to the bone, stuffed with soft glutinous rice, ham, diced bamboo shoots, and chestnuts. Rich soy sauce aromas blend with savory meat flavors, melting in your mouth without feeling greasy at all. The \u0027Eyebrow Shortcake\u0027 features flaky, crescent-shaped layers with a savory, juicy filling. Here, you can not only savor the most authentic Shanghainese flavors, but also overlook the scenic Yu Garden pond in an elegant, traditional ambiance\u2014highly favored by quality-seeking tourists and Old Shanghainese locals alike.", "name": "L\u00fc Bo Lang Restaurant", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 1), then walk for about 6 minutes."}, {"address": "No. 242 Fuyou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Founded during the Guangxu reign of the Qing Dynasty, this is one of the birthplaces of Benbang (traditional Shanghai) cuisine. The signature \u0027Braised River Shrimp\u0027 has a crispy shell that can be eaten directly, while the shrimp meat is tender and springy, coated in a perfectly balanced sweet, sour, and savory sauce. \u0027Braised Intestines with Clover\u0027 pairs fresh clover greens with rich, melt-in-your-mouth braised pork intestines, creating a rich layered texture. The restaurant retains a nostalgic classic Haipai decor, where seasoned master chefs brilliantly execute classic Shanghai dishes\u2014a must-visit destination for anyone seeking the most authentic Old Shanghai flavors.", "name": "Shanghai Old Restaurant", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 622 Zhonghua Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Founded in 1878, this venerable local eatery is famous for its traditional Shanghai-style lees-marinated dishes and refined stir-fries. Signature dishes like \u0027Braised Pork Noodle Soup\u0027 and \u0027Lees-marinated Chicken\u0027 are beloved by local foodies, while the \u0027De Xing Soy Sauce Duck\u0027 is a must-order at every table. The duck skin exhibits an enticing glossy reddish hue, springy to the bite with firm meat, bursting with rich sweet soy sauce flavor that balances sweet and savory with a lingering sweet aftertaste. The restaurant\u0027s ambiance is simple and traditional, offering generous portions at affordable prices that capture the genuine warmth and vibrant street life of Old Shanghai.", "name": "De Xing Guan", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 2), then walk for about 8 minutes."}, {"address": "4F, Renaissance Shanghai Yu Garden Hotel, No. 159 Henan South Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located inside the Renaissance Shanghai Yu Garden Hotel, this modern bistro seamlessly blends traditional Jiangnan cuisine with a stylish food and wine pairing culture. The chef selects fresh local seasonal ingredients, presenting \u0027Braised Pork Belly\u0027 via modern low-temperature slow cooking\u2014delivering perfectly balanced, soft, and un-greasy meat paired with special sauce and fine red wine for a luxurious tasting experience. The \u0027Steamed Yellow Croaker\u0027 features silk-tender flesh packed with pure umami. With breathtaking high-altitude views overlooking the contrast between ancient Yu Garden architecture and modern Lujiazui skyscrapers, it attracts many young gourmets and business professionals for dates and fine drinking.", "name": "Wan Li Xuan Chinese Restaurant", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 3), then walk for about 2 minutes."}, {"address": "Inside Yuyuan Tourist Mart, No. 69 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Originating from Suzhou, this highly renowned restaurant in the Yu Garden commercial area specializes in Suzhou-style and Jiangnan local cuisine. The signature masterpiece \u0027Squirrel-shaped Mandarin Fish\u0027 is vividly presented; after expert knifework and deep frying, the exterior becomes delightfully crispy while the meat inside stays tender and juicy. Drizzled with a secret sweet and sour tomato sauce, it offers a crunchy bite with an appetizing balance of flavors. \u0027Tofu with Crab Roe\u0027 uses freshly picked Chinese mitten crab roe, offering a smooth, dense, and intensely savory texture. The antique pavilion structure and classic water-town atmosphere make diners feel as though they are attending an ancient royal banquet.", "name": "Song He Lou Restaurant", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 1), then walk for about 7 minutes."}, {"address": "No. 70 Fuzhou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A popular local home-style restaurant located near Yu Garden and The Bund, drawing countless domestic and international tourists with its warm, homey Shanghainese cooking. The #1 customer favorite, \u0027Grandma\u0027s Braised Pork,\u0027 features slow-simmered pork belly with a lustrous red color, springy skin, and tender meat that melts on the tongue, accompanied by rich sweet soy and egg aromas\u2014making it an absolute rice destroyer. \u0027Shanghai Fried Noodles\u0027 uses thick, chewy noodles stir-fried on high heat with dark soy sauce and greens, infused with intense wok hei. Its comforting flavors and friendly service make it the top choice for experiencing local home-cooked Shanghai dining.", "name": "Grandma\u0027s Shanghai Kitchen", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 7), then walk for about 9 minutes."}, {"address": "No. 237 Yuyuan Middle Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Built during the Xianfeng reign of the Qing Dynasty, this historic teahouse dining spot stands right in the center of the Yu Garden pond. It serves classic traditional Shanghai tea refreshments and refined local snacks. The signature \u0027Tea-Marinated Quail Eggs\u0027 are slow-simmered in special tea broth, giving the whites a springy texture and the yolks a dense, non-dry finish. Paired with selected Longjing tea or Shaoxing yellow wine, it presents an iconic Old Shanghai pairing. Sitting by the second-floor wooden window, sipping fresh tea, tasting savory bites, and watching the koi swimming below along with crowds on the Nine-Turn Bridge offers a dual visual and culinary ancient-style bliss.", "name": "Huxinting Teahouse \u0026 Local Dining", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 1), then walk for about 6 minutes."}, {"address": "Hong Kong Famous Shop Street, No. 489 Henan South Road, Huangpu District, Shanghai (near Yu Garden)", "feature": "\u2b50 4.1 stars | A highly prestigious local chain serving Shanghainese regional dishes, favored by old neighbors for its excellent value for money and authentic flavors. The classic \u0027Crystal River Shrimp\u0027 uses fresh river shrimp, translucent with a tender yet crisp, snappy texture; dipping them in Zhenjiang aromatic vinegar highlights their pure sweetness. The \u0027Crystal Pork Jellied Meat\u0027 features a crystal-clear gelatin layer with tender, flavorful cured pork. The restaurant is spacious and bright with an extensive authentic menu, making it a popular spot for experiencing Shanghai\u0027s vibrant local dining and family gathering culture.", "name": "He Ji Xiao Cai", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 4), then walk for about 4 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Yuyuan Tourist Mart, No. 99 Jiuxiaochang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Established in 1910, this century-old vegetarian establishment is a classic symbol of traditional Shanghai vegetarian dining. Its famous \u0027Pure Vegetarian Vegetable Bun\u0027 features a thin skin packed with rich filling\u2014made with selected greens, shiitake mushrooms, and dried tofu tossed with sesame oil. Steamed to a vibrant emerald green color, every bite yields a refreshing aroma and juicy burst without feeling greasy. The \u0027Vegetarian Hot and Sour Soup\u0027 and \u0027Songyue Vegetarian Noodles\u0027 are equally beloved by tourists and old Shanghai locals alike.", "name": "Chunfeng Songyue Pavilion", "transport": "Metro Line 10 or 14 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 5 mins walk"}, {"address": "No. 33 Henan South Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A century-old vegetarian restaurant recognized as a Chinese Intangible Cultural Heritage. Renowned for its exquisite technique of mimicking meat with vegetarian ingredients, its signature \u0027Vegetarian Duck\u0027 features golden, crispy tofu skin on the outside and tender, juicy filling inside. The \u0027Vegetarian Crab Roe\u0027, skillfully crafted from carrots, potatoes, and shiitake mushrooms, replicates the savory, velvety texture of real crab roe. Paired with special aromatic vinegar, it offers a tangy, savory delight praised by vegetarian travelers and foodies worldwide.", "name": "Godly Vegetarian Restaurant (Henan South Road Branch)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 3, approx. 3 mins walk"}, {"address": "4F, Building S3, Bund Finance Center, No. 585 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 stars | Located right next to Yuyuan Garden, this high-end Zen-inspired vegetarian restaurant elevates traditional vegetarian cuisine into an aesthetic feast. The signature \u0027Wild Mushroom Soup\u0027 is slow-simmered with dozens of rare high-altitude wild mushrooms, creating a rich, savory, and soothing broth. Dishes are artfully presented like traditional Chinese landscape paintings, paired with incense and guzheng music for a multisensory healing experience favored by fine-dining lovers and tourists.", "name": "Yeye Puti Vegetarian Restaurant (BFC Mall)", "transport": "Metro Line 10 or 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 8 mins walk"}, {"address": "2F, Building N3, BFC Bund Finance Center, No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | A minimalist vegetarian brand focusing on natural flavors and contemporary minimalist aesthetics. The wildly popular \u0027Black Truffle Fried Rice\u0027 features perfectly distinct grains infused with a rich yet balanced truffle aroma; the \u0027Pan-Fried Homemade Tofu in Olive Oil\u0027 is crispy outside, tender inside, and packed with soybean flavor. Free from artificial additives, dishes highlight the pure sweetness of ingredients, making it a must-visit spot near Yuyuan for youth and foreign tourists.", "name": "Qingchun Pumen Vegetarian (BFC)", "transport": "Metro Line 14 \u0027Yuyuan Garden Station\u0027, Exit 7, approx. 8 mins walk"}, {"address": "3F, Building S2, BFC Bund Finance Center, No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | An innovative vegetarian hotpot featuring Tibetan tea broth, located in the BFC commercial center near Yuyuan Garden. The unique \u0027Tibetan Tea Broth\u0027 is smooth, mellow, and easy on the stomach. Poaching air-freighted wild mushrooms, handmade tofu, and fresh organic seasonal veggies accentuates their natural sweetness. Paired with special sesame sauce and secret chili oil, it offers a rich yet light meal\u2014the top choice for warming up in winter.", "name": "Yiyi Yishijie Tibetan Tea Vegetarian Hotpot (BFC)", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 9 mins walk"}, {"address": "No. 1047 Zhonghua Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | A budget-friendly, high-value vegetarian buffet restaurant near Yuyuan Garden. Serving over 60 dishes daily, options include freshly fried vegetarian spring rolls, steamed seasonal vegetables, handcrafted dim sum, and nourishing soups. The cuisine is light and low in oil, with golden crispy fried treats and subtle, non-greasy pastries\u2014a huge hit with locals and tourists seeking authentic everyday vegetarian culture.", "name": "Sumanxiang Vegetarian Buffet (Laoximen Branch)", "transport": "Metro Line 8 or 10 \u0027Laoximen Station\u0027, Exit 6, approx. 6 mins walk"}, {"address": "No. 115 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A dedicated vegetarian dim sum section at Lu Bo Lang, the century-old iconic restaurant situated right by the Nine-Turn Bridge in Yuyuan. The must-try \u0027Salt \u0026 Pepper Eyebrow Pastry\u0027 features flaky, multi-layered crust filled with savory mushrooms and bamboo shoots; the \u0027Emerald Vegetarian Shumai\u0027 has a delicate skin and crisp, refreshing filling. Enjoying delicate dim sum while overlooking the scenic view of Nine-Turn Bridge offers a truly classical and elegant Old Shanghai experience.", "name": "Lu Bo Lang Vegetarian Dim Sum Pavilion", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 6 mins walk"}, {"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A traditional vegetarian snack stall located in the heart of the City God Temple commercial area, specializing in authentic local Shanghai snacks. Popular choices include the \u0027Vegetarian Ham\u0027, which is dense, firm, and packed with soy flavor; and \u0027Haitang Cake\u0027, coated in a caramelized sugar crust with sweet, smooth red bean paste inside. Eaten hot out of the oven, it\u0027s crispy on the outside and soft inside\u2014a must-try traditional street snack when exploring Yuyuan Old Street.", "name": "Yuyuan Old City God Temple Vegetarian Snack Pavilion", "transport": "Metro Line 10 \u0027Yuyuan Garden Station\u0027, Exit 1, approx. 4 mins walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 85 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | A century-old legendary shop located by the Nine-Turn Bridge in Yuyuan Garden, offering a classic Shanghai bite you simply cannot miss. Their premium takeout Xiaolongbao (soup dumplings) feature paper-thin, translucent skin that bursts with rich, flavorful, piping-hot broth upon the first bite, revealing a tender and firm pork filling. Loved by tourists and locals alike for its hundred-year-old tradition of hand-kneading and folding techniques. Whether sipping hot broth from a giant soup dumpling with a straw or enjoying fresh bite-sized Xiaolongbao on the go, the layers of flavor are truly exquisite.", "name": "Nanxiang Steamed Bun Restaurant (Nanxiang Mantou Dian)", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station (Exit 1), and walk for about 6 minutes."}, {"address": "No. 112 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | A famous traditional eatery inside Yuyuan Bazaar, renowned for its glutinous rice balls (Tangyuan) made from wet-milled rice flour. The signature black sesame Tangyuan has an ultra-soft, chewy skin that doesn\u0027t stick to your teeth, filled with a molten, oozing center. The rich, sweet black sesame combined with the savory aroma of lard creates a burst of smooth, comforting flavors. This warm street dessert is a favorite among visitors\u2014a hot bowl in winter warms you up from the inside out.", "name": "Ningbo Tangyuan Shop", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station and walk for about 5 minutes into Yuyuan Bazaar."}, {"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai (Inside Yuyuan Old Street)", "feature": "\u2b50 4.2 stars | A traditional Shanghai crispy pastry named after its resemblance to a cooked crab shell. The golden-brown crust is generously sprinkled with fragrant white sesame seeds, baked to flaky, multi-layered perfection that crumbles deliciously with every bite. Fillings come in both savory and sweet varieties: savory scallion oil is rich and mouthwatering, while sweet white sugar is soft and honeyed. Crispy on the outside and soft on the inside, this portable snack is an old Shanghai nostalgia trip and a top tea-time favorite for visitors.", "name": "City God Temple Xiekehuang Pastry", "transport": "Take Metro Line 10 to Yuyuan Garden Station and walk for about 7 minutes."}, {"address": "No. 15 Bailing Road, Huangpu District, Shanghai (Near Jiuxiaochang Road, Yuyuan Garden)", "feature": "\u2b50 4.4 stars | Founded during the Xuantong era of the Qing Dynasty, this century-old vegetarian establishment is famous for its signature vegetable bun, hailed as the crown jewel of Shanghai\u0027s veg buns. The steamed bun dough is fluffy and soft with a subtle sweetness, while the filling blends green vegetables, shiitake mushrooms, dried tofu, and wood ear mushrooms cooked with a secret braising method. This keeps the greens crisp and vibrant while delivering a rich, flavorful, yet non-greasy bite. Vegetarians and foodies alike happily queue up to get them freshly cooked.", "name": "Songyue Lou Vegetarian Buns", "transport": "Take Metro Line 10 to Yuyuan Garden Station (Exit 3), and walk for about 8 minutes."}, {"address": "No. 11 South Sichuan Road, Huangpu District, Shanghai (Near Yuyuan Commercial Area)", "feature": "\u2b50 4.3 stars | A classic representative of pan-fried pork buns (Shengjianbao) made using traditional fully-fermented dough. Unlike soup-heavy style Shengjianbao, Dahu Chun emphasizes fluffy dough and an intensely crispy bottom. The crust is fried to a crunchy golden brown, while the bun dough absorbs the savory essence of the dense, juicy pork filling that carries a hint of local sweetness. Topped with fragrant black sesame and chopped scallions, this iconic handheld snack is highly recommended by local food connoisseurs and tourists alike.", "name": "Dahu Chun Shengjianbao (Yuyuan)", "transport": "Take Metro Line 10 to Yuyuan Garden Station (Exit 1), and walk for about 5 minutes."}, {"address": "No. 112 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.0 stars | Shanghai\u0027s signature nostalgic snack\u2014as the popular local saying goes, \u0027If you haven\u0027t tasted City God Temple\u0027s five-spice beans, you haven\u0027t truly been to Shanghai.\u0027 Made from high-quality broad beans cooked carefully with fennel, cinnamon, and spices, each bean is dusted with a thin layer of white frost. Wonderfully chewy with an initial savory punch followed by a lingering sweetness, they grow more flavorful the more you chew them\u2014a perfect traditional snack to nibble on while strolling through Yuyuan Old Street.", "name": "Shanghai Old City God Temple Creamy Five-Spice Beans", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station; walk into Yuyuan Bazaar to find it."}, {"address": "No. 249 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | A historic Yuyuan classic confection rooted in Qing Dynasty artisanal craftsmanship. Made by simmering snow pears with herbal ingredients such as Fritillaria bulb and Platycodon root, the candy crystallizes into hard pieces that provide a cool, sweet, and soothing sensation for the throat. Refreshing without being overly sweet, it carries a unique herbal aroma. Frequently made and sold fresh at street stalls along the old street, it attracts many visitors who grab it as a handy sweet treat.", "name": "Shanghai Pear Syrup Candy Shop", "transport": "Take Metro Line 10 to Yuyuan Garden Station and walk for about 6 minutes into Yuyuan Old Street."}, {"address": "No. 108 Yuyuan Old Street, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | The most popular traditional street dessert in the bazaar and old street area. Plump, fresh hawthorn berries are coated in a crystal-clear, glass-like sugar shell. With one bite, the crisp sugar coating snaps open, letting intense sweet syrup fuse with the tart, juicy fruit underneath. Balanced perfectly in sweet and sour flavors without sticking to teeth, these vibrant red skewers are also a favorite photogenic street food for traveling photo-ops.", "name": "Yuyuan Old Street Tanghulu", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station and walk for 5 minutes into Yuyuan Old Street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Yu Garden and City God Temple"}};
        const themeHex = "#311042";
        const cityName = "Shanghai";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
