. Founded by well-known collector Ma Weidu, it houses galleries for Ceramics, East-West Art, Gold Artifacts, and Statues, displaying remarkably fine ancient craftsmanship. Additionally, its unique \u0027Metal Botanical Garden\u0027 blends Eastern and Western aesthetics, allowing visitors to enjoy a serene, elevated cultural experience 100 meters in the sky.", "name": "Guanfu Museum Shanghai", "transport": "Metro Line 2 or Line 14 Lujiazui Station Exit 9 direct access to Shanghai Tower"}, {"address": "Ground Hall, Oriental Pearl Tower, No. 1 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located in the Ground Hall (Zero-Meter Hall) of the Oriental Pearl Tower, this museum vividly recreates Shanghai\u0027s transformation from a fishing village into a modern international metropolis through hundreds of precious relics, miniature models, and lifelike wax figures. Intricately detailed scenes recreate old Shanghai\u0027s bustling avenues, tea houses, taverns, and historic lane alleys, providing a strong sense of immersion and storytelling.", "name": "Shanghai History Museum at Oriental Pearl Tower", "transport": "Metro Line 2 or Line 14 Lujiazui Station Exit 1, approx. 3-min walk"}, {"address": "No. 15 Lujiazui East Road (inside Lujiazui Central Green Space), Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Located inside Lujiazui Central Green Space, this building was originally \u0027Yinchuan Villa\u0027, the residence of modern Shanghai gentleman Chen Guichun. It is a carved Haipai residence blending Chinese and Western styles. The hall exhibits the life, paintings, calligraphy, seal carvings, and historic artifacts of Haipai master Wu Changshuo, offering an extraordinary haven of cultural tranquility surrounded by towering skyscrapers.", "name": "Wu Changshuo Memorial Hall", "transport": "Metro Line 2 Lujiazui Station Exit 3, approx. 5-min walk"}, {"address": "No. 4777 Binjiang Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Located in the South Riverside area of Lujiazui, this museum was repurposed from an old coal transfer platform. Masterfully transformed, it preserves its original industrial steel-and-concrete structure, evolving into a contemporary art space blending historic industrial vibes with modern minimalism. Regularly hosting international trend art, contemporary photography, and cross-disciplinary design exhibitions, it is an unmissable landmark for art lovers walking along the river.", "name": "Modern Art Museum Shanghai (MAM)", "transport": "Metro Line 9 Shangcheng Road Station or Line 4 Tangqiao Station, then transfer to bus or walk along the river for approx. 15 mins"}, {"address": "No. 150 Pucheng Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Formerly the Lujiazui Community Library, this space was upgraded into a multifaceted cultural destination integrating reading, art exhibitions, academic lectures, and cultural salons. The architectural design is modern and stylish, filled with playful light and shadows, earned it the title of the prettiest \u0027cultural living room\u0027 in the Lujiazui financial center. It regularly hosts the \u0027Lujiazui Reading Club\u0027, bringing renowned cultural figures face-to-face with readers in a rich artistic atmosphere.", "name": "Lujiazui Rong Books \u0026 Art Space", "transport": "Metro Line 9 Shangcheng Road Station Exit 2, approx. 8-min walk"}, {"address": "No. 181 Hongshan Road (near Pudong South Road), Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | Originally built in 1912, this is a historic Catholic church in the Lujiazui and Dongchang Road areas. Built in Gothic revival style, it boasts soaring spires, elegant archways, and vibrant stained-glass windows. Set against Lujiazui\u0027s bustling modern financial hub, this solemn century-old church stands out for its tranquility and unique religious architectural aesthetic, serving as a spiritual retreat for local believers and historic architecture fans.", "name": "Pudong Sacred Heart Catholic Church", "transport": "Metro Line 2 Dongchang Road Station Exit 3, approx. 10-min walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 717 Lujiazui Ring Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Covering approximately 100,000 square meters, Lujiazui Central Green Space is the largest open lawn park in Shanghai\u0027s Lujiazui Financial and Trade Zone. It features expansive open lawns, tall arbor trees, and a winding waterfront lake, with a large decorative pool and fountain at its center. Surrounded by towering skyscrapers like the Shanghai Tower, Shanghai World Financial Center, and Jin Mao Tower, it creates a visually stunning \u0027urban oasis.\u0027 It is not only a favorite spot for local professionals taking lunch breaks and residents having weekend picnics, but also a top location for photography enthusiasts to capture the seamless fusion of modern architecture and lush greenery.", "name": "Lujiazui Central Green Space", "transport": "Take Shanghai Metro Line 2 or Line 14 to \u0027Lujiazui Station\u0027, and walk about 3 minutes from the exit."}, {"address": "Binjiang Avenue (near Fucheng Road), Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Located on the east bank of the Huangpu River, Binjiang Avenue Park is a scenic waterfront corridor combining sightseeing, leisure, and lush greenery. Stretching for several kilometers along the river, it boasts rich vegetation, vibrant year-round floral displays, exquisite flower beds, sculptures, and viewing platforms. Here, visitors can stroll along lush garden paths while enjoying panoramic views of the historic Bund architecture across the river. At dusk, as the setting sun glimmers on the river and night lights turn on, the ambiance becomes irresistibly romantic.", "name": "Binjiang Avenue Park", "transport": "Take Shanghai Metro Line 2 to \u0027Lujiazui Station\u0027, and walk across the Lujiazui Pedestrian Bridge for about 10 minutes to reach the riverfront."}, {"address": "Intersection of Binjiang Avenue and Dongchang Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Connecting the core of Lujiazui with the southern riverside promenade, Dongchang Riverside Green Space serves as a vital green hub along Pudong\u0027s waterfront. The park features spacious jogging and cycling lanes lined with tall dawn redwoods and seasonal blooms, creating an eco-friendly riverside corridor. Outfitted with numerous benches and scenic viewing decks, it offers a perfect setting to watch cruise ships glide past on the Huangpu River and enjoy the refreshing river breeze.", "name": "Dongchang Riverside Green Space", "transport": "Take Shanghai Metro Line 2 to \u0027Dongchang Road Station\u0027 or \u0027Lujiazui Station\u0027, then transfer to a bus or walk about 12 minutes."}, {"address": "Expo Avenue / Lujiazui Waterfront Section, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Pudong Riverside Public Park is a key highlight of the Lujiazui section in Shanghai\u0027s \u0027Huangpu River Connection Project.\u0027 Seamlessly blending industrial heritage with modern landscape design, the park preserves old wharf relics complemented by expansive lawns, tree groves, and aquatic plant ponds. Featuring three distinct, continuous tracks for walking, running, and cycling, it provides a dynamic space for exercise and relaxation amidst lush greenery, showcasing a captivating blend of modern design and historical charm along the river.", "name": "Pudong Riverside Public Park", "transport": "Take Metro Line 14 to \u0027Lujiazui Station\u0027, and walk about 8 minutes from the exit to reach the riverfront."}, {"address": "No. 1 Century Avenue (next to Oriental Pearl Tower), Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located right next to the base of the iconic Oriental Pearl Radio \u0026 TV Tower, Oriental Pearl Park is an elegant urban themed garden. It is filled with topiary plants, seasonal flowers, and artistic installations blending classical and modern styles. Here, visitors can gaze up close at the majestic tower while enjoying a peaceful, fragrance-filled green sanctuary\u2014making it a favorite hidden spot for photos and quick rests.", "name": "Oriental Pearl Park", "transport": "Take Shanghai Metro Line 2 or Line 14 to \u0027Lujiazui Station\u0027 (Exit 1 or 2), and walk about 2 minutes."}, {"address": "No. 180 Rushan Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Meiyuan Park is a historic, classical-style garden located near the Lujiazui financial district, famous for its diverse and premium varieties of plum blossoms. The park features elegant layouts with charming bridges over running water, traditional pavilions, and winding bamboo pathways. In early spring, hundreds of red, white, and green-calyx plum blossoms bloom in competition, filling the air with delicate fragrances. It attracts countless residents and photographers, offering a rare taste of traditional Jiangnan garden scenery right next to a bustling commercial hub.", "name": "Meiyuan Park", "transport": "Take Shanghai Metro Line 2, 4, 6, or 9 to \u0027Century Avenue Station\u0027, and walk about 8 minutes."}, {"address": "Near Taigongline Ferry Terminal (near Pudong South Road), Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | Located on the north side of Lujiazui, Taigong Green Space is a hidden and cozy urban pocket park. It features layered greenery, winding stone paths, and comfortable benches, creating a tranquil and inviting natural atmosphere. Away from the hustle and bustle of major thoroughfares, its lush canopy and fresh air make it a secret garden for neighborhood strolls and a quiet retreat for busy professionals.", "name": "Taigong Green Space", "transport": "Take Shanghai Metro Line 2 to \u0027Lujiazui Station\u0027, and walk north along Pudong South Road for about 10 minutes."}, {"address": "North Section of Binjiang Avenue (near Jimo Road), Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Situated along the northern extension of Lujiazui, North Riverside Park offers sweeping river views and vibrant greenery. The park features multiple scenic greenways and viewing platforms lined with cherry blossoms, ginkgo trees, and camphor trees, changing dramatically with the seasons. At night, it provides an outstanding vantage point to gaze across at the North Bund and Yangpu Bridge, making it a wonderful natural eco-park to escape the crowds, take in the cool breeze, and enjoy river vistas.", "name": "North Riverside Park Lujiazui", "transport": "Take Shanghai Metro Line 14 to \u0027Pudong Avenue Station\u0027, and walk about 10 minutes to the riverfront."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 479 Lujiazui Ring Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Standing at 632 meters, it is China\u0027s tallest and the world\u0027s second-tallest supertall skyscraper. The \u0027Top of Shanghai Observatory\u0027 on the 118th floor is reached in just 55 seconds via the world\u0027s fastest elevator. Here, you can enjoy a 360-degree panoramic view of the stunning skyline along both sides of the Huangpu River, making it the premier photo spot for capturing Shanghai\u0027s modern cityscape. As twilight falls and night arrives, the dazzling neon-lit cityscape is truly breathtaking.", "name": "Shanghai Tower", "transport": "Take Metro Line 2 or 14 to Lujiazui Station, then walk about 5 minutes via the underground passage or Exit 6."}, {"address": "No. 1 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | One of Shanghai\u0027s most iconic landmarks, standing 468 meters tall. Its distinct sphere design blends poetic classical Chinese motifs (\u0027large and small pearls dropping onto a jade plate\u0027) with futuristic technology. The 259-meter-high Transparent Observatory Skywalk features a fully clear tempered glass floor, giving visitors the thrill of walking above the Huangpu River. It\u0027s one of the internet\u0027s most viral photo locations. The tower also houses a revolving restaurant and the Shanghai History Museum.", "name": "Oriental Pearl Radio \u0026 Television Tower", "transport": "Take Metro Line 2 or 14 to Lujiazui Station, Exit 1, and walk for about 3 minutes."}, {"address": "No. 2777 Binjiang Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Designed by renowned French architect Jean Nouvel, this world-class museum sits right on the frontline of the Huangpu River bank. Its most famous check-in feature is the \u0027Glass Hall\u0027 on the 2nd and 3rd floors, where massive ultra-clear glass windows frame reflections of the river and the historic Bund across it, creating picture-frame aesthetics. At night, shifting light and shadow interplay with the riverside lights, making it a must-visit spot for art enthusiasts and photographers.", "name": "Museum of Art Pudong", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk for about 10 minutes; or take a Huangpu River cruise boat to the nearby dock."}, {"address": "52nd Floor, Shanghai Tower, No. 501 Yincheng Middle Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located on the 52nd floor of the Shanghai Tower (239 meters above ground), this \u0027bookstore in the clouds\u0027 is one of the highest physical bookstores in the world. Inspired by classic Chinese landscape principles, it is divided into black-and-white themed reading areas and scenic cafe sections. The highlight is its massive floor-to-ceiling windows facing the Huangpu River and Lujiazui skyscrapers, allowing visitors to sip coffee while taking in unobstructed cloud-level views of Shanghai.", "name": "Duoyun Books Flagship Store", "transport": "Take Metro Line 2 or 14 to Lujiazui Station, enter Shanghai Tower, and take the express elevator directly to the 52nd floor."}, {"address": "Intersection of Lujiazui Ring Road and Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | A massive elevated circular pedestrian bridge straddling the core Lujiazui intersection, connecting the Oriental Pearl Tower, Super Brand Mall, IFC, and the metro station. It\u0027s recognized as one of the premier street-level photo spots for capturing the Lujiazui skyscraper cluster and the famous \u0027Lujiazui Trio\u0027. From the footbridge, you can frame the Oriental Pearl, Shanghai Tower, Jin Mao Tower, and SWFC all in one shot\u2014perfect for both daytime traffic scenes and dazzling nighttime neon views.", "name": "Lujiazui Circular Footbridge", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk directly up to the bridge upon exiting."}, {"address": "No. 100 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Affectionately nicknamed the \u0027Bottle Opener\u0027 for its unique design, this skyscraper stands 492 meters tall. Its 100th-floor \u0027Sky Walk\u0027 features a 55-meter-long glass-floored hallway, giving visitors the feeling of walking in the clouds. It offers a unique vantage point to look up closely at the adjacent Shanghai Tower and down at the Oriental Pearl Tower. The breathtaking view at sunset, as golden light illuminates the river, attracts countless visitors capturing stunning photos.", "name": "Shanghai World Financial Center", "transport": "Take Metro Line 2 to Dongchang Road Station or Lujiazui Station, and walk for about 8-10 minutes."}, {"address": "No. 717 Lujiazui Ring Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | A 100,000-square-meter urban oasis surrounded by soaring skyscrapers in prime Lujiazui. Featuring lakes, fountains, and sprawling lawns, its most popular photo angle is looking up from the green grass at the \u0027Lujiazui Big Three\u0027 (Shanghai Tower, SWFC, Jin Mao Tower), presenting a striking contrast between natural greenery and modern concrete architecture. It\u0027s an ideal spot for urban relaxation, picnics, and capturing grand architectural panoramas.", "name": "Lujiazui Central Green Space", "transport": "Take Metro Line 2 to Lujiazui Station, Exit 5, and walk about 3 minutes to enter the park."}, {"address": "No. 88 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Standing 420.5 meters tall, its architecture blends elements of traditional 13-tiered Chinese pagodas with modern technology. In addition to 360-degree panoramic city views, the 88th-floor observation deck\u0027s most famous highlight is looking down into the massive multi-story atrium, creating a mesmerizing sci-fi-like tunnel effect. Thrill-seekers can also try \u0027Skywalk\u0027, an outdoor platform without handrails along the tower\u0027s outer rim, perfect for dramatic photos.", "name": "Jin Mao Tower Observation Deck", "transport": "Take Metro Line 2 to Lujiazui Station, Exit 6, and walk about 5 minutes."}], "name": "Popular Photo Spots"}}, "name": "Lujiazui"}, "xintiandi-tianzifang": {"categories": {"cat_1": {"items": [{"address": "No. 76 Xingye Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Located in the heart of Xintiandi, the Site of the First National Congress of the CPC is a classic Shanghai Shikumen-style building constructed in 1920. Beyond being the site of a pivotal event in modern Chinese history, the building itself perfectly preserves early 20th-century traditional brick-and-wood features, including carved wooden doors and alternating grey and red brickwork. Inside, a vast collection of precious historical documents is on display, allowing visitors to admire Shikumen architectural aesthetics while gaining a deep appreciation for the architectural heritage and historical evolution of old Shanghai.", "name": "Site of the First National Congress of the CPC", "transport": "Take Metro Line 10 or 13 to \u0027Site of the First CPC National Congress \u00b7 Xintiandi Station\u0027, Exit 6, and walk for about 3 minutes."}, {"address": "No. 25, North Block Xintiandi, Lane 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Converted from an authentic 1920s Shikumen residence, this museum takes its name from the Shanghainese word \u0027Wulixiang\u0027, meaning \u0027Home\u0027. Through meticulously decorated rooms including the living room, study, master bedroom, kitchen, and Tingzijian (mezzanine room), it faithfully recreates the lifestyle, furnishings, and mahogany furniture of a middle-class old Shanghai family. It is an exceptional historical space to explore Shanghai\u0027s unique Shikumen residential structure and Haipai (Shanghai-style) culture.", "name": "Shikumen Open House Museum", "transport": "Take Metro Line 10 or 13 to \u0027Site of the First CPC National Congress \u00b7 Xintiandi Station\u0027 and walk for about 5 minutes from the exit."}, {"address": "Lane 181 Taicang Road (near South Huangpi Road), Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | The Xintiandi complex is a world-renowned example of restoring and commercially revitalizing old Shanghai Shikumen alleyways. Designed by internationally acclaimed architects, it preserves the brick walls, carved stone doorframes, and narrow lane layouts of traditional Shikumen homes while seamlessly integrating modern interior design. Strolling through the South and North Blocks of Xintiandi offers a view of Haipai architectural fusion\u2014blending Western classical styles with traditional Chinese residences\u2014which turns exquisitely romantic when illuminated at night.", "name": "Xintiandi Shikumen Architectural Complex", "transport": "Take Metro Line 1 to \u0027South Huangpi Road Station\u0027, Exit 2, or Metro Line 10/13 to \u0027Site of the First CPC National Congress \u00b7 Xintiandi Station\u0027."}, {"address": "Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Located at Lane 210 Taikang Road, Tianzifang was originally a cluster of traditional Shikumen residences and old factory buildings. Since the late 1990s, it has attracted numerous artists and creative studios. It retains the authentic everyday atmosphere of old Shanghai alleyways, where maze-like narrow lanes feature hanging laundry, vintage utility cables, vibrant boutique shops, and cozy cafes. Blending Shikumen, modern lane housing, and industrial heritage, it is a fantastic historic area to experience the clash between traditional everyday life and contemporary art.", "name": "Tianzifang Art Lanes", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027, Exit 1, and walk for about 2 minutes."}, {"address": "No. 287 South Shaanxi Road (near Jianguo West Road), Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Built in 1930, Cit\u00e9 Bourgogne is one of the most intact remaining Shikumen complexes in Shanghai, showcasing a classic combination of French architectural styles and traditional Chinese lane housing. An elegant Chinese-English paired archway stands at the entrance, while the interior features uniform red-brick exteriors paired with arched doors and windows. Once home to renowned cultural figures like author Ba Jin, local residents still live here today, presenting a rich and authentic glimpse into the vibrant neighborhood history of old Shanghai.", "name": "Cit\u00e9 Bourgogne (Bugaoli)", "transport": "Take Metro Line 9 or 12 to \u0027Jiashan Road Station\u0027 and walk for about 6 minutes; or walk about 8 minutes from Tianzifang."}, {"address": "No. 425 Middle Fuxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 Stars | Built in 1925, All Saints Church is a red-brick church featuring 17th-century Gothic Revival architecture. The building boasts classic ribbed vaults, tall semi-circular arched windows, and a distinctive square bell tower, with red brick exteriors highlighted by granite accents for a quaint, elegant look. Standing quietly along bustling Middle Fuxing Road amidst French plane trees and old villas, it is a historic religious landmark of high artistic value near Xintiandi.", "name": "All Saints Church", "transport": "Take Metro Line 10 or 13 to \u0027Site of the First CPC National Congress \u00b7 Xintiandi Station\u0027 and walk for about 4 minutes."}, {"address": "No. 7 Xiangshan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Located on Xiangshan Road, this dark grey two-story European-style garden villa was the only residence shared by Dr. Sun Yat-sen and Soong Ching-ling in Shanghai (1918\u20131924). The exterior walls are embedded with dark green pebbles and topped with magenta tiles, while the interior preserves original furnishings and rare books used by Dr. Sun. With its quiet, secluded garden embodying classic Shanghai garden-villa charm, it is a must-visit site for understanding modern Chinese history and historic villa architecture.", "name": "Former Residence of Sun Yat-sen", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 and walk for about 7 minutes; or walk about 10 minutes from Xintiandi."}, {"address": "No. 73 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Built in the 1920s, the Zhou Residence is a garden villa designed in a classic French architectural style, adorned with lush green ivy across its exterior walls in a tranquil setting. Between 1946 and 1947, Zhou Enlai and other CPC delegates lived and worked here. The interior exhibits preserved meeting rooms, offices, and bedrooms, while the lush green garden beautifully showcases the unique old-villa character and rich history of Shanghai\u0027s Sinan Road Historic and Cultural Area.", "name": "Former Residence of Zhou Enlai (Zhou Residence)", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027, or Metro Line 10/13 to \u0027Site of the First CPC National Congress \u00b7 Xintiandi Station\u0027, and walk for about 8\u201310 minutes."}], "name": "Historic Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 25, North Block Xintiandi, Lane 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | \u0027Wulixiang\u0027 means \u0027Home\u0027 in Shanghainese. Located within the well-preserved Shikumen architectural complex in Xintiandi, this museum was transformed from a typical 1920s Shikumen residence. It recreates the classic living scenes of a five-member family in old Shanghai, including a living room, study, master bedroom, kitchen (\u0027Zaopijian\u0027), and small room under the roof (\u0027Tingzijian\u0027). Filled with precious vintage items from the 1930s\u2014such as black rotary telephones, antique gramophones, vanishing cream, and retro posters\u2014it perfectly restores the heartwarming memories and daily life of Shanghai\u0027s historic Shikumen lanes.", "name": "Shikumen Open House Museum", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 (Exit 6), then walk for about 3 minutes."}, {"address": "No. 25 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located directly opposite Tianzifang on Taikang Road, this museum was co-founded by famous glass art masters Loretta H. Yang and Chang Yi. The building\u0027s exterior is visually stunning, adorned with thousands of metal mesh glass flowers that glow enchantingly at night. Inside, it features masterworks by contemporary glass artists, where light and shadow intertw carefully to showcase ultimate Oriental aesthetics and fine craftsmanship. The first floor houses a LIULI boutique and a creative caf\u00e9, making it a premier destination to experience Shanghai art and contemporary glass craftsmanship.", "name": "Liuli China Museum", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 (Exit 1), then walk for about 3 minutes."}, {"address": "No. 374 South Huangpi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Located in the heart of Xintiandi, this classic Shikumen building holds monumental historical significance as the venue of the First National Congress of the Communist Party of China in 1921. Combining traditional brick-and-wood Shikumen architecture with modern exhibition spaces, the museum comprehensively introduces Shanghai\u0027s modern history and major historical events through extensive artifacts, documents, sculptures, and interactive multimedia. It is an essential cultural landmark for understanding modern Chinese history and Shikumen heritage.", "name": "Museum of the First National Congress of the CPC", "transport": "Take Metro Line 1 to \u0027South Huangpi Road Station\u0027 (Exit 2), or Metro Line 10/13 to \u0027Xintiandi Station\u0027, then walk for about 5 minutes."}, {"address": "No. 270 South Chongqing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Situated at the intersection of South Chongqing Road and Middle Fuxing Road near Xintiandi and Sinan Mansions, this Catholic church was originally built in the 1930s to serve foreign parishioners in Shanghai. The current restored structure seamlessly blends Gothic and modern architectural styles. Its towering stained-glass windows create magnificent light displays in the sunshine, while the serene and solemn interior offers a peaceful, meditative space amidst the busy city.", "name": "St. Peter\u0027s Church", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 (Exit 5), then walk for about 6 minutes."}, {"address": "No. 425 Middle Fuxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Built in 1925, this Protestant church features a rich 17th-century Gothic Revival style. Constructed with red brick, it showcases elegant narrow arched windows, geometric pattern walls, and a prominent bell tower with time-worn brick textures. Well-preserved through a century of history, it stands along the tree-lined Middle Fuxing Road. Surrounded by a quiet, charming atmosphere, the sound of the pipe organ inside and natural light streaming through stained-glass windows express the unique religious architectural charm of the former French Concession.", "name": "All Saints Church", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 (Exit 5), then walk west along Middle Fuxing Road for about 4 minutes."}, {"address": "No. 7 Xiangshan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located on Xiangshan Road near Xintiandi and Sinan Road, this exquisite two-story dark-gray European-style garden villa was the only residence in Shanghai shared by Dr. Sun Yat-sen and Soong Ching-ling. The museum consists of the former residence itself and an exhibition hall. The interior faithfully preserves its original 1920s appearance, while the exhibition hall displays historic photos, manuscripts, and personal items detailing Dr. Sun\u0027s revolutionary life and daily moments. The lush garden radiates classic Shanghai cultural elegance.", "name": "Shanghai Sun Yat-sen Museum (Former Residence of Sun Yat-sen)", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 (Exit 1) and walk for about 7 minutes, or walk about 10 minutes from \u0027Xintiandi Station\u0027 on Metro Line 10."}, {"address": "No. 73 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Formally known as the Former Site of the CPC Delegation Office in Shanghai, this site is situated along scenic Sinan Road. It is a three-story 1920s Spanish-style garden villa covered in ivy, surrounded by a peaceful, elegant environment. This was where Zhou Enlai lived and worked in Shanghai. The museum displays preserved offices, meeting rooms, dormitories, and daily necessities. Its well-maintained vintage furniture and charming garden landscape allow visitors to step back into a turbulent era and appreciate classic Shanghai villa heritage.", "name": "Former Residence of Zhou Enlai (Shanghai Zhou Gongguan)", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 (Exit 5), then walk along Middle Fuxing Road and turn onto Sinan Road (approx. 8 minutes)."}, {"address": "No. 54, Lane 205 South Chongqing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located near the Yandang Road Pedestrian Street not far from Xintiandi, this hall commemorates Zou Taofen, a famous modern Chinese journalist, publisher, and political commentator. Housed in his former residence\u2014a classic Shanghai Shikumen dwelling\u2014it exhibits his original study, bedroom, precious manuscripts, issues of his publication \u0027Life Weekly\u0027, and historical photographs. Holding great historic value in journalism and literature, it vividly reflects the spirit of intellectuals in old Shanghai.", "name": "Taofen Memorial Hall", "transport": "Take Metro Line 1 to \u0027South Huangpi Road Station\u0027 (Exit 1), then walk for about 8 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 332 South Huangpi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located right next to Shanghai Xintiandi, Taipingqiao Park is a rare large green park in the heart of downtown. At its center lies a man-made lake surrounded by walking paths and benches, framed by iconic Shikumen architecture and modern skyscrapers\u2014creating a unique blend of tradition and modernity. The park boasts lush vegetation and seasonal flowers, drawing countless photography enthusiasts especially during spring cherry blossom and autumn ginkgo seasons. It is also a popular spot for nearby office workers to take lunchtime strolls and locals for morning exercise, offering a peaceful natural sanctuary amidst the bustling city pace.", "name": "Taipingqiao Park", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027, Exit 1, and walk about 3 minutes."}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Fuxing Park is a century-old park and the only one in Shanghai that retains a complete classical French garden style. Located near Sinan Road and the Xintiandi commercial area, it features geometric French flowerbeds, a grand rose garden, and elegant fountains. Its tree-lined avenues of tall London planes exude a romantic former French Concession vibe. Early mornings offer a glimpse into local life as residents practice Tai Chi, ballroom dancing, or water calligraphy. Featuring a statue of Marx and Engels, it stands as an urban oasis seamlessly blending history, culture, and natural beauty.", "name": "Fuxing Park", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027, Exit 1, and walk about 5 minutes; or Metro Line 10 to \u0027Xintiandi Station\u0027 and walk about 8 minutes."}, {"address": "No. 29 Shaoxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Tucked away on Shaoxing Road\u2014known as the \u0027Publishing Street\u0027 and a hotspot for hipsters\u2014Shaoxing Park is just steps away from Tianzifang. Though compact, this park masterfully uses traditional Jiangnan garden techniques of rockery and water layout. It features artificial hills, ponds, small bridges over flowing water, pavilions, and bamboo groves, creating rich, layered landscapes. Peaceful and quiet amidst the city bustle, it exudes a literary vibe and serves as the perfect hidden oasis for quiet reading and relaxation after exploring Tianzifang.", "name": "Shaoxing Park", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027, Exit 1, and walk about 8 minutes."}, {"address": "No. 177 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Situated on the eastern section of the bustling Middle Huaihai Road commercial area and within walking distance of Xintiandi, Huaihai Park is an urban green space offering a breath of fresh air. It features expansive lawns, fitness trails, children\u0027s play areas, and abundant camphor trees, azaleas, and ornamental plants. A large central plaza and covered walkways showcase different seasonal views. It\u0027s a great spot to rest after shopping, as well as an important green hub for local residents to exercise and enjoy nature.", "name": "Huaihai Park", "transport": "Take Metro Line 8 to \u0027Dashijie Station\u0027, Exit 3, and walk about 5 minutes; or Metro Line 1 to \u0027South Huangpi Road Station\u0027 and walk about 6 minutes."}, {"address": "No. 55 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located in the heart of Sinan Road between Xintiandi and Tianzifang, the Sinan Mansions Open-Air Garden is surrounded by dozens of historical vintage garden villas. The greenery complements the classic architecture, featuring century-old London plane trees and elegant English garden landscapes. The open green plaza frequently hosts outdoor book readings, art exhibitions, and lifestyle markets, allowing visitors to experience Shanghai\u0027s unique Haipai garden lifestyle amidst fragrant greenery and nostalgic historical atmosphere.", "name": "Sinan Mansions Open-Air Garden", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 and walk about 7 minutes."}, {"address": "No. 1008 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Situated at the intersection of Middle Huaihai Road and North Xiangyang Road, near Xintiandi and Tianzifang, Xiangyang Park is a historic French-style park. It is famous for its cross-symmetrical avenue lined with majestic London plane trees, European-style fountains, and French floral beds. Following recent renovations, parts of its surrounding walls were removed, seamlessly blending the park into the surrounding neighborhood as an open urban green corridor. Complete with a charming teahouse, children\u0027s play areas, and vibrant seasonal flowers, it is an ideal spot to immerse in the greenery and cultural charm of the former French Concession.", "name": "Xiangyang Park", "transport": "Take Metro Line 1, 10, or 12 to \u0027South Shaanxi Road Station\u0027, Exit 2, and walk about 2 minutes."}, {"address": "No. 80 Jumen Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Located in the Dapuqiao area south of Tianzifang, Liyuan Park is a beloved neighborhood waterfront park. It features a central artificial lake and waterfront platforms, with weeping willows lining the shore and fish swimming in the water, creating a warm, harmonious natural scene. The park offers a circular fitness track, leisure pavilions, and various activity areas for kids and seniors, all shaded by lush, layered flora. For travelers wishing to experience the authentic pace of life in old Shanghai alongside fresh natural scenery, this park is a delightful local retreat.", "name": "Liyuan Park", "transport": "Take Metro Line 9 or 13 to \u0027Madang Road Station\u0027, Exit 3, and walk about 6 minutes."}, {"address": "6F, K11 Art Mall, Hong Kong New World Tower, No. 300 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Located on the upper floors of the K11 Art Mall on Middle Huaihai Road near Xintiandi, the K11 Sky Garden seamlessly blends natural greenery with modern art. This multi-dimensional sky garden features lush plants, vertical green walls, outdoor sculptures, and an urban farm showcase, allowing visitors to connect with nature among towering skyscrapers. With open-air scenic restaurants and cafes, guests can take in panoramic views of the Huaihai Road commercial area and Taipingqiao Park while enjoying a unique cloud-level nature experience surrounded by art and greenery.", "name": "K11 Sky Garden", "transport": "Take Metro Line 1 or 14 to \u0027South Huangpi Road Station\u0027, Exit 2 directly connects to the building\u0027s basement level."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 181 Taicang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Shanghai Xintiandi is a prime example of seamlessly blending traditional Shikumen architecture with modern urban chic lifestyle. Divided into the North and South Blocks, the North Block features well-preserved historic Shikumen buildings transformed into upscale restaurants, bars, caf\u00e9s, and boutiques. The South Block leans modern, integrating an international shopping center and a cinema complex. Strolling through the narrow alleys lined with grey bricks and black tiles, you can feel the collision of rich Haipai historical culture and modern fashion trends, making it an iconic trendy landmark and a must-visit photo spot in Shanghai.", "name": "Shanghai Xintiandi", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 Exit 6, approximately a 2-minute walk."}, {"address": "Lane 210 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Tianzifang is a cultural and creative hub transformed from authentic Shikumen alleyways. It retains the charming daily life vibe of old Shanghai lanes, where labyrinthine alleyways hide hundreds of creative studios, art galleries, independent designer boutiques, vintage craft shops, as well as international restaurants and bars. Red brick walls, black wooden doors, weathered surfaces, and clotheslines hanging overhead create a delightfully photogenic tapestry of everyday life, attracting countless art lovers and photography enthusiasts for treasure hunting and snap shooting.", "name": "Tianzifang", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 Exit 1."}, {"address": "No. 374 South Huangpi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Built in 1920, this classic new-style Shikumen building is the birthplace of the Communist Party of China. Following extensive renovation and expansion, the new venue showcases precious historical relics, documents, and interactive multimedia displays. While the exterior retains its iconic gray and red brickwork with carved Shikumen archways, the interior offers modern, world-class museum exhibitions. As a landmark of profound historical significance in Xintiandi, its elegant traditional architecture also makes it a popular photo stop.", "name": "Museum of the First National Congress of the CPC", "transport": "Take Metro Line 1 to \u0027South Huangpi Road Station\u0027 Exit 2, approximately a 5-minute walk."}, {"address": "No. 523 Middle Fuxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Sinan Mansions is downtown Shanghai\u0027s only preserved historical complex dedicated to garden houses, featuring detached villas, semi-detached houses, and garden lane homes. Once residences to many celebrities and intellectuals, it has been meticulously restored into a high-end cultural precinct combining luxury hotels, fine dining, art galleries, and cultural bookstores (like Sinan Books). Tree-lined Sinan Road offers stunning views in every season, making every snap look like a stylish photo shoot filled with British charm and old Shanghai elegance.", "name": "Sinan Mansions", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 Exit 5, approximately a 10-minute walk."}, {"address": "No. 300 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Shanghai K11 is a premier concept shopping mall that seamlessly integrates Art, People, and Nature. The chi K11 Art Museum on the B3 floor frequently hosts world-class contemporary art exhibitions and trendy crossover events, making it a hotspot for fashion and art enthusiasts. Filled with lush greenery, indoor waterfalls, and artistic sculptures, the mall feels like a contemporary art museum where shopping and dining are enhanced by visual surprises and Instagrammable spots at every turn.", "name": "Shanghai K11 Art Mall (chi K11)", "transport": "Take Metro Line 1 to \u0027South Huangpi Road Station\u0027 Exit 3 for direct access."}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Fuxing Park is the only century-old park in Shanghai that preserves a complete French classical garden style. Featuring expansive lawns, symmetrical flower beds, elegant fountains, and shaded sycamore avenues, it exudes a strong sense of European romance. Local residents gather here in the morning and afternoon to exercise, stroll, or dance, presenting an authentic slice of Shanghai life. Surrounded by historical buildings and trendy cafes, it is a serene French-style oasis and a prime photo location near Xintiandi.", "name": "Fuxing Park", "transport": "Take Metro Line 13 to \u0027Middle Huaihai Road Station\u0027 Exit 1, approximately an 8-minute walk."}, {"address": "No. 245 Madang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Xintiandi Style Shopping Centre focuses on promoting independent designer brands from home and abroad alongside creative lifestyle concepts, standing as an outpost for avant-garde fashion in Shanghai. The interior showcases modern minimalist design and geometric aesthetics, with skybridges seamlessly connecting the historic Xintiandi block to the modern mall. Housing curated select shops, designer apparel boutiques, concept cafes, and chic photo installations, it is a favorite haunt for young trendsetters seeking Shanghai\u0027s international fashion taste.", "name": "Xintiandi Style Shopping Centre", "transport": "Take Metro Line 10 or 13 to \u0027Xintiandi Station\u0027 Exit 2."}, {"address": "No. 25 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Founded by renowned artists Chang Yi and Loretta H. Yang, the Liuli China Museum boasts a breathtaking exterior adorned with thousands of wire-mesh peony flowers and massive glass art pieces that dazzle under night lights. Inside, it exhibits masterworks of colored glass art from around the globe, displaying the ultimate interplay of light, shadow, and glass craftsmanship. The first floor also houses an elegant glass-themed restaurant and gift shop, making it a visually stunning hidden gem for art lovers.", "name": "Liuli China Museum", "transport": "Take Metro Line 9 to \u0027Dapuqiao Station\u0027 Exit 1, approximately a 3-minute walk (located opposite Tianzifang)."}], "name": "Popular Hotspots \u0026 Photo Spots"}}, "name": "Xintiandi and Tianzifang"}, "xujiahui-huaihai": {"categories": {"cat_1": {"items": [{"address": "No. 158 Puxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Built in 1906, this Gothic Revival cathedral was once hailed as the \u0027Grandest Cathedral in the Far East.\u0027 Featuring twin soaring spires, red-brick exterior walls, majestic vaulted ceilings, and exquisite stained-glass windows, it boasts a solemn and sacred artistic ambiance, standing as one of Shanghai\u0027s most iconic historical landmarks.", "name": "St. Ignatius Cathedral (Xujiahui Cathedral)", "transport": "About a 3-minute walk from Exit 3 of Xujiahui Station (Metro Lines 1, 9, 11)"}, {"address": "No. 1850 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Formerly known as the Normandie Apartments, this iconic building was designed by renowned architect L\u00e1szl\u00f3 Hudec and built in 1924 as Shanghai\u0027s first veranda-style apartment building. Its famous flatiron, ship-like shape sits at the intersection of five streets, radiating a rich French Renaissance style. Today, it remains a famous photo spot and a hallmark landmark along Huaihai Road.", "name": "Wukang Building (Normandie Apartments)", "transport": "About a 5-minute walk from Exit 7 of Chiao Tong University Station (Metro Lines 10, 11)"}, {"address": "No. 1843 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | This elegant German-style garden residence was the long-time home and workplace of Soong Ching Ling, Honorary President of the People\u0027s Republic of China. The main building preserves original furnishings and historical artifacts, while the garden features lush lawns surrounded by towering camphor trees. Walking through offers a deep sense of history and cultural heritage.", "name": "Former Residence of Soong Ching Ling", "transport": "About a 4-minute walk from Exit 1 of Chiao Tong University Station (Metro Lines 10, 11)"}, {"address": "No. 188 Puxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Founded in 1847, this is Shanghai\u0027s earliest surviving modern library, featuring a blend of Chinese and Western architectural styles. The lower floor displays a traditional Chinese stack room layout, while the upper floor follows a Western library design. Housing numerous rare Chinese and Western antiquarian books and maps, it records the profound history of East-West cultural exchange.", "name": "Bibliotheca Zi-Ka-Wei (Xujiahui Library)", "transport": "About a 2-minute walk from Exit 3 of Xujiahui Station (Metro Lines 1, 9, 11)"}, {"address": "Inside Xujiahui Park, No. 811 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Located inside Xujiahui Park, this French detached garden villa was built in 1921 as the headquarters for Path\u00e9 Records. It served as the birthplace of modern China\u0027s recording industry, where composer Nie Er created \u0027March of the Volunteers\u0027 (China\u0027s national anthem). Today, it is open to the public as a record museum showcasing the rich history of Chinese vinyl records.", "name": "La Petite Villa (Former Path\u00e9 Studio)", "transport": "About a 4-minute walk from Exit 14 of Xujiahui Station (Metro Lines 1, 9, 11)"}, {"address": "No. 166 Puxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Formerly the Xujiahui Observatory established in 1872, it was once acclaimed as the \u0027Top Observatory of the Far East\u0027 and is one of the few observatories worldwide with uninterrupted weather tracking. This romantic European-style grey-and-red brick building witnessed the development of modern meteorological science and displays rich historical instruments and rare meteorological records.", "name": "Shanghai Meteorological Museum (Xujiahui Observatory)", "transport": "About a 3-minute walk from Exit 3 of Xujiahui Station (Metro Lines 1, 9, 11)"}, {"address": "No. 113 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Built in 1923, this garden villa was home to literary master Ba Jin for nearly half a century. The main building fully preserves his original study, bedroom, and living room, housing tens of thousands of books. The peaceful garden and scholarly atmosphere make it a holy place for literature enthusiasts.", "name": "Ba Jin\u0027s Former Residence", "transport": "About an 8-minute walk from Exit 3 of Shanghai Library Station (Metro Line 10)"}, {"address": "No. 1331 Middle Fuxing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Constructed in 1924, this Eclectic-style building earned its name from the black stone used in its construction and was once praised as a \u0027classic masterpiece of Chinese eclectic architecture.\u0027 Today, the ground floor features a chic music-themed bookstore and caf\u00e9, seamlessly blending century-old classical heritage with modern creative arts.", "name": "Blackstone Apartments", "transport": "About a 6-minute walk from Exit 1 of Shanghai Library Station (Metro Line 10)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 158 Puxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Built in 1906, this Gothic architectural gem features twin spires soaring into the sky and exquisite stained-glass windows. Once hailed as the \u0027Grandest Cathedral in the Far East,\u0027 its grand and solemn interior showcases the ultimate architectural aesthetics of Gothic vaults and colonnades. The open plaza in front offers a magnificent spot for capturing panoramic photos and soaking in blending history. Step inside for an immersive experience of late 19th-century European religious architecture perfectly preserved in Shanghai.", "name": "St. Ignatius Cathedral (Xujiahui Cathedral)", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station, and walk about 3 minutes after exiting."}, {"address": "No. 80 Caoxi North Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Founded in 1847, this is Shanghai\u0027s earliest modern Western-style library and a crucial testament to East-West cultural exchange. Combining Chinese and Western architectural elements, it houses an extraordinarily rich collection of rare ancient books and historical documents. Stepping inside, the wooden staircases and elegant bookshelves evoke a deep sense of history, transporting visitors back to a scholarly sanctuary from a century ago.", "name": "Bibliotheca Zi-Ka-Wei (Xujiahui Library)", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station, Exit 3, and walk about 2 minutes."}, {"address": "No. 79 Fenyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Housed in a French Renaissance-style white villa built in 1905\u2014affectionately known as the \u0027Little White House\u0027\u2014this museum showcases the finest Haipai (Shanghai-style) arts and crafts. Exhibits feature national intangible cultural heritages such as jade carvings, ivory carvings, embroidery, tapestry, dough modeling, and paper-cutting. Visitors can marvel at priceless masterpieces and even watch master artisans at work, making it the perfect place to experience exquisite craftsmanship amidst the elegant ambiance of an old mansion.", "name": "Shanghai Arts and Crafts Museum", "transport": "Take Metro Line 1 or 7 to Changshu Road Station, and walk about 8 minutes."}, {"address": "No. 3 Baoqing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Tucked near bustling Huaihai Middle Road inside a restored garden villa, this is China\u0027s first museum dedicated to symphonic music. Through rare manuscripts, antique instruments, vinyl records, and interactive multimedia, it chronicles the history of the Shanghai Symphony Orchestra and modern Chinese symphonic music. The lush garden setting pairs beautifully with captivating musical heritage, making it an unmissable cultural landmark for music lovers.", "name": "Shanghai Symphony Museum", "transport": "Take Metro Line 1 or 7 to Changshu Road Station, and walk about 5 minutes."}, {"address": "No. 1843 Huaihai Middle Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Located on Huaihai Middle Road, this garden residence is where Soong Ching Ling, Honorary President of the PRC, lived and worked for the longest period. The main boat-shaped three-story Western building retains its original modest yet elegant furnishings. Surrounded by lush greenery and ancient camphor trees, visiting offers deep insights into the life and charm of this historic figure while showcasing the refined mid-20th-century Shanghai garden home architecture.", "name": "Former Residence of Soong Ching Ling", "transport": "Take Metro Line 10 or 11 to Chiao Tung University Station, Exit 1, and walk about 3 minutes."}, {"address": "No. 113 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Situated along artistic Wukang Road, this garden villa was home to literary master Ba Jin for over 40 years, where famous works like \u0027Random Thoughts\u0027 were written. The house perfectly preserves its original appearance, including his book-filled study, cozy living room, and vibrant garden. Stepping into this serene estate lets visitors experience the master\u0027s humble lifestyle and rich emotional depth, making it a highlight of the Wukang Road Historic District.", "name": "Former Residence of Ba Jin", "transport": "Take Metro Line 10 or 11 to Chiao Tung University Station, and walk about 8 minutes."}, {"address": "No. 55 Puhuitang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Tushanwan was a key hub where Western missionaries introduced Western arts and craft techniques to China, earning it the reputation as the \u0027cradle of Chinese vocational education\u0027 and \u0027birthplace of Haipai arts and crafts.\u0027 The museum displays impressive wooden carvings, stained glass, traditional masterpieces, and the majestic Tushanwan Carved Archway\u2014a crowning treasure that showcased at multiple World Expos, beautifully illustrating the fusion of Eastern and Western art.", "name": "Tushanwan Museum", "transport": "Take Metro Line 1 or 4 to Shanghai Indoor Stadium Station, and walk about 8 minutes."}, {"address": "No. 53 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Built in 1925 along plane-tree-lined Hengshan Road, this Gothic-style red-brick church is one of Shanghai\u0027s largest Protestant churches. Featuring pointed archways, a tranquil courtyard, a historic pipe organ, and space for thousands, it offers a serene and solemn atmosphere. When Sunday hymns echo, the ambiance becomes profoundly inspiring, making it a beautiful architectural and cultural landmark of the Hengshan Road area.", "name": "Community Church Shanghai", "transport": "Take Metro Line 1 to Hengshan Road Station, Exit 1, and walk about 3 minutes."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 889 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Xujiahui Park is an iconic urban oasis nestled in the bustling city center, spanning a vast area that seamlessly blends natural ecology with historical heritage. The park preserves historic landmarks such as the famous Red House (formerly the EMI Record Company building). An elevated skywalk runs through the center, offering visitors a bird\u0027s-eye view of the lake and lush greenery. Designed to mimic the winding curves of the Huangpu River, the lake is often home to graceful black swans, making it a perfect spot for locals and tourists to relax, stroll, and enjoy nature.", "name": "Xujiahui Park", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 14), and walk for about 3 minutes."}, {"address": "No. 1008 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Located at the bustling intersection of Middle Huaihai Road and North Xiangyang Road, this classic French-style park was originally built in 1941. It features a grand avenue of plane trees (London planetrees), exquisite geometric gardens, fountains, and classic French pavilions. With seasonal flower displays and a serene, elegant atmosphere, many locals come here in the morning to exercise or play chess under the shade, making it a rare tranquil oasis next to the Huaihai Road shopping precinct.", "name": "Xiangyang Park", "transport": "Take Metro Line 1, 10, or 12 to South Shaanxi Road Station (Exit 2), and walk for about 2 minutes."}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Fuxing Park is Shanghai\u0027s only fully preserved French classicist-style park, located right next to the Huaihai Road commercial area. The park boasts large sunken flowerbeds, fountains, soaring plane tree groves, and expansive lawns, combining romantic French flair with the authentic feel of old Shanghai life. It also features statues of Marx and Engels, making it a preferred spot for artistic youth and local residents to relax and reflect.", "name": "Fuxing Park", "transport": "Take Metro Line 10 or 13 to Site of the First CPC National Congress \u00b7 Xintiandi Station (Exit 5), and walk for about 8 minutes."}, {"address": "No. 17 Nandan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 stars | Guangqi Park is a themed park combining historical commemoration with natural scenery, dedicated to Xu Guangqi, an outstanding scientist of the Ming Dynasty. The park offers a serene environment with towering ancient trees, preserving Xu Guangqi\u0027s tomb and its stone carvings. It also houses the Xu Guangqi Memorial Hall (located inside the Ming-dynasty Duole Hall). With lush plants, charming bridges, and flowing water, it is rich in cultural heritage and perfect for a micro-trip blending nature and history.", "name": "Guangqi Park", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 8), and walk for about 5 minutes."}, {"address": "No. 839 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 stars | Located at the junction of Hengshan Road and Guangyuan Road near the Xujiahui commercial area, Hengshan Park is an exquisite triangular green space. Highlighted by three massive Southern Magnolias and tall camphor trees, the park offers deep canopy shade, lush lawns, and understated stone benches. A statue of Mr. Shen Junru stands in the center. Providing peace amid the hustle and bustle, it is an ideal resting spot while strolling along the tree-lined Hengshan Road.", "name": "Hengshan Park", "transport": "Take Metro Line 1, 9, or 11 to Xujiahui Station (Exit 13), and walk for about 4 minutes."}, {"address": "No. 256 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Situated along the prosperous Middle Huaihai Road, Huaihai Park has a long history and features a vibrant modern feel following its renovation. Divided into lawn areas, waterscapes, and tall timber zones, it offers abundant vegetation and year-round green foliage. Despite being located in the prime heart of the commercial district, the park remains quiet and inviting, giving office workers and tourists a pleasant space to unwind and enjoy sunny green grounds.", "name": "Huaihai Park", "transport": "Take Metro Line 1 to South Huangpi Road Station (Exit 2), and walk for about 3 minutes."}, {"address": "Junction of Middle Yan\u0027an Road and West Jinling Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Yanzhong Green Space is a grand open park in central Shanghai, stretching across the Huangpu, Jing\u0027an, and Xuhui districts near the north side of Huaihai Road. Featuring rolling terrain, large artificial waterfalls, clear lakes, wooden boardwalks, and dense bamboo forests, walking inside feels like stepping into a real forest. It effectively blocks the noise of nearby elevated highways and busy city streets, serving as a true green lung in the heart of the city.", "name": "Yanzhong Green Space", "transport": "Take Metro Line 1 or 14 to South Huangpi Road Station (Exit 1), and walk for about 6 minutes."}, {"address": "No. 29 Shaoxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Nestled on the artistic Shaoxing Road, Shaoxing Park is a pocket-sized park filled with classic Jiangnan garden charm. Although small in scale, it utilizes traditional landscaping techniques to create a grand sense of space, featuring rockeries, small bridges, flowing streams, pavilions, and dense bamboo groves. The quiet and elegant atmosphere carries a subtle scent of books and tea, making it one of the most hidden and exquisite classical garden retreats around the Huaihai Road cultural circle.", "name": "Shaoxing Park", "transport": "Take Metro Line 9 or 12 to Jiashan Road Station (Exit 4), and walk for about 8 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 1850 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Located at the intersection of Middle Huaihai Road and Wukang Road, the Wukang Building (originally Normandy Apartments) was designed by the French-Hungarian architect L\u00e1szl\u00f3 Hudec as Shanghai\u0027s first arcade-style apartment building. Its iconic flatiron-like sharp angle and French Renaissance style make it one of Shanghai\u0027s most iconic red-brick landmarks for photos. Whether under the morning sunlight or amidst twilight streetscapes, it offers the perfect backdrop for vintage cinematic shots infused with classic French-Shanghainese charm.", "name": "Wukang Building", "transport": "Metro Lines 10/11 Jiao Tong University Station, Exit 7; approx. 5 mins walk"}, {"address": "No. 158 North Caoxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 Stars | A trendy cultural landmark right next to St. Ignatius Cathedral, designed by the world-renowned David Chipperfield Architects. The building seamlessly blends modern minimalism with Haipai (Shanghainese) heritage. Inside, a soaring multi-story atrium, the signature light-box reading space, and a massive 3D-printed arch titled \u0027Enchantment of the Sea\u0027 draw countless visitors to read and take photos. The open-air balcony offers panoramic views of the century-old cathedral, making it an extraordinary spot combining visual beauty and cultural vibe.", "name": "Zikawei Library", "transport": "Metro Lines 1/9/11 Xujiahui Station, Exit 3; approx. 2 mins walk"}, {"address": "No. 158 Puxi Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Built in 1910, St. Ignatius Cathedral is a classic Gothic structure once revered as the \u0027Grandest Cathedral in the Far East.\u0027 Featuring twin spires soaring over 50 meters, red-brick walls, intricate rose windows, and elegant Gothic arches, it radiates breathtaking classical elegance and sacred grandeur. The spacious green plaza in front is a popular destination for wedding photography, European-style portraits, and architecture shots.", "name": "St. Ignatius Cathedral of Shanghai", "transport": "Metro Lines 1/9/11 Xujiahui Station, Exit 3; approx. 3 mins walk"}, {"address": "No. 523 Middle Huaihai Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Pioneering the concept of \u0027Curated Retail,\u0027 TX Huaihai is the ultimate trendsetting hub in the Middle Huaihai Road commercial area, wildly popular among youth and fashion circles. It features global flagship streetwear stores, contemporary art exhibits, pop-up shops, and trendy dining options. With its massive exterior LED screen and futuristic, industrial-style interiors, TX Huaihai hosts fresh events almost every week, standing as a premier epicenter for Shanghai\u0027s youth culture and street photography.", "name": "TX Huaihai Youth Energy Center", "transport": "Metro Line 13 Middle Huaihai Road Station, Exit 1; approx. 3 mins walk"}, {"address": "No. 55 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Sinan Mansions is the only preserved, large-scale historical garden house development in central Shanghai, showcasing diverse architectural styles including standalone and row garden villas. Strolling along the plane tree-shaded streets, you\u0027ll find beautifully preserved red-brick and grey-tile villas alongside stylish open-air caf\u00e9s. At nightfall, warm lights transform the area into a romantic haven, making it a favorite location for movie shoots, chic lifestyle photos, and experiencing refined Shanghainese living.", "name": "Sinan Mansions", "transport": "Metro Lines 10/13 Xintiandi Station, approx. 8 mins walk"}, {"address": "No. 1111 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Located in the core Xujiahui shopping district, Metro City is famous for its iconic, giant glass sphere facade. Illuminated at night, the \u0027Metro Dome\u0027 puts on dazzling light shows and animations, serving as a signature centerpiece of Xujiahui\u0027s nightlife skyline. Inside, it blends Japanese anime culture, popular food spots, and lifestyle shops. The \u00275th Avenue\u0027 section exudes authentic Japanese street vibes, making it a hotspot for young crowds and anime enthusiasts.", "name": "Metro City", "transport": "Directly connected to Metro Lines 1/9/11 Xujiahui Station, Exit 10"}, {"address": "No. 1843 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Nestled near the intersection of Middle Huaihai Road and Wukang Road, this elegant Western-style villa served as the home of Soong Ching Ling. The main building faithfully preserves the rooms where she lived and worked, surrounded by a lush garden shaded by ancient camphor trees. Beyond offering rich historical insights, the serene garden paths and vintage architectural details provide a tranquil, sophisticated backdrop perfect for aesthetic photos.", "name": "Former Residence of Soong Ching Ling", "transport": "Metro Lines 10/11 Jiao Tong University Station, Exit 7; approx. 4 mins walk"}, {"address": "No. 113 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 Stars | Situated along the ever-popular Wukang Road, the Former Residence of Ba Jin is a garden villa where the literary master lived and wrote for over half a century. Surrounded by lush foliage, the picturesque courtyard changes beautifully with the seasons. The interiors recreate Ba Jin\u0027s daily life, filled with nostalgic traces and a rich scholarly atmosphere. Visitors exploring Wukang Road love stopping by to feel the quiet charm of old Shanghai villas and honor the spirit of a legendary master.", "name": "Former Residence of Ba Jin", "transport": "Metro Lines 10/11 Jiao Tong University Station, Exit 7; approx. 7 mins walk"}], "name": "Must-Visit Photo Spots"}}, "name": "Xujiahui and Huaihai Road"}, "yuyuan-oldcity": {"categories": {"cat_1": {"items": [{"address": "No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Built during the Jiajing reign of the Ming Dynasty (1559) by Pan Yunduan, Minister of Justice, as a peaceful retirement home for his parents. The name \u0027Yuyuan\u0027 translates to \u0027pleasing one\u0027s parents\u0027. The garden features a harmonious arrangement of pavilions, towers, rockeries, and ponds, standing as a masterpiece of classical Jiangnan garden design. It houses dozens of precious historical buildings and provincial-level protected cultural relics, embodying rich Ming and Qing architectural styles and garden philosophy.", "name": "Yuyuan Garden", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, Exit 1, approx. 5-minute walk"}, {"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Tracing its roots back to the Three Kingdoms period, it was formally converted into a City God Temple during the Yongle reign of the Ming Dynasty. It enshrines three City Gods: Huo Guang, Qin Yubo, and Chen Huacheng. Beautifully restored with red walls, green tiles, and intricately painted beams, this Taoist complex is grand and magnificent. It is not only the core of Shanghai\u0027s Taoist culture, but also an essential historical landmark for visitors seeking to experience old Shanghai\u0027s religious beliefs and traditional folk culture.", "name": "Shanghai City God Temple", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 7-minute walk"}, {"address": "No. 257 Yuyuan Road, Huangpu District, Shanghai (Center of Nine-Turn Bridge Pond, Yuyuan Garden)", "feature": "\u2b50 4.4 stars | Built in 1784 during the Qianlong reign of the Qing Dynasty, it was originally the Fuxi Pavilion of Yuyuan Garden before being converted into a teahouse\u2014making it one of the oldest surviving teahouses in Shanghai. Constructed entirely of wood with upturned eaves, it sits proudly in the center of the pond beside the Nine-Turn Bridge. It has hosted numerous world leaders, including Queen Elizabeth II, and radiates rich old Shanghai tea culture and classical architectural charm.", "name": "Huxinting Teahouse", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 6-minute walk"}, {"address": "Inside Yuyuan Tourist Mart (in front of Huxinting Teahouse), Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | One of the most famous iconic structures in the Yuyuan area, this granite bridge features nine dramatic turns. In Chinese tradition, \u0027nine\u0027 is the supreme Yang number, and the zig-zag design is believed to ward off evil spirits. Strolling across offers beautiful views of the surrounding Jiangnan water landscape and the elegant Huxinting Teahouse, making it an absolute must-visit photo spot in Shanghai.", "name": "Nine-Turn Bridge (Jiuqu Bridge)", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 6-minute walk"}, {"address": "Northeast corner inside Yuyuan Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Built in 1820 during the Daoguang reign of the Qing Dynasty, it was originally the Fujian Sugar Merchants\u0027 Guildhall before gaining fame as the headquarters for the Small Swords Society Uprising in 1853. Featuring exquisite craftsmanship and artistically carved beams, it currently displays historical artifacts, weapons, and official proclamations from the uprising, combining high architectural beauty with significant historic value.", "name": "Dianchun Hall", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 8-minute walk"}, {"address": "In front of Yuhua Hall, Yuyuan Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | The prized treasure of Yuyuan Garden, celebrated as one of the \u0027Three Great Famous Rocks of Jiangnan\u0027 alongside Suzhou\u0027s Ruiyun Peak and Hangzhou\u0027s Guanyun Peak. Standing about 3 meters tall, this Taihu rock showcases the four classic virtues of scholar stones: \u0027wrinkled, slender, perforated, and porous\u0027. Legend has it that burning incense at its base sends wisps of smoke through all its holes, while pouring water on top creates miniature fountains\u2014a unique and captivating wonder.", "name": "Exquisite Jade Rock (Yu Ling Long)", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 8-minute walk"}, {"address": "No. 29 Chenxiangge Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Also known as Ciyun Zen Temple, this notable Buddhist nunnery was built during the Wanli reign of the Ming Dynasty. The solemn, historic complex gets its name from a precious statue of Guanyin carved from agarwood (chenxiang) during the Ming Dynasty. Offering a peaceful and tranquil atmosphere amid burning incense, it stands in quiet contrast to the bustling City God Temple commercial area surrounding it.", "name": "Chenxiang Temple", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 6-minute walk"}, {"address": "Inside Yuyuan Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Also known as the \u0027Flora Pavilion\u0027, Wanhua Chamber was originally built in the Ming Dynasty and rebuilt during the Qing Dynasty\u0027s Daoguang era. The delicate structure is surrounded by ancient trees and rockeries, featuring a magnificent ginkgo tree over 400 years old in front. Its intricately carved doors and windows display exquisite Qing Dynasty woodwork, making it a masterpiece of classical architecture within Yuyuan Garden.", "name": "Wanhua Chamber", "transport": "Metro Line 10 or 14, Yuyuan Garden Station, approx. 7-minute walk"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Located at the core of the Yuyuan commercial area, Shanghai City God Temple is one of the most important Taoist temples in Shanghai. Built during the Yongle reign of the Ming Dynasty, it boasts a long and rich history. The temple honors three City Gods (Huo Guang, Qin Yubo, and Chen Huacheng). The architecture displays a classic Jiangnan palace style with exquisite wood, stone, and brick carvings. Here, visitors can immerse themselves in a rich atmosphere of traditional religious devotion, admire delicate ancient craftsmanship, and experience festive temple fairs, making it an unmissable historic landmark for understanding Old Shanghai\u0027s Taoist culture and folk customs.", "name": "Shanghai City God Temple", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027 (Exit 1), then walk for about 5 minutes."}, {"address": "No. 29 Chenxiangge Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Also known as Ciyun Zen Temple, Chenxiang Pavilion was built during the Wanli reign of the Ming Dynasty and is a renowned Buddhist nunnery in urban Shanghai. Its most famous treasure is a statue of Guanyin carved from agarwood (chenxiang), celebrated for its intricate craftsmanship and subtle fragrance. The temple is elegant and serene, featuring upturned eaves, brick carvings, and timber structures characteristic of Ming and Qing architecture. Offering a peaceful, solemn contrast to the bustling Yuyuan commercial area nearby, it is a wonderful place to explore Old Shanghai\u0027s Buddhist art and architectural history.", "name": "Chenxiang Pavilion", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, then walk for about 8 minutes."}, {"address": "No. 33 Jiuxiaochang Road, Huangpu District, Shanghai (Inside Tonghanchuntang)", "feature": "\u2b50 4.3 stars | Founded during the Qianlong reign of the Qing Dynasty in the heart of Yuyuan Old Street, Tonghanchuntang is a century-old traditional Chinese medicine (TCM) pharmacy. Its internal museum showcases a deep heritage of TCM culture. The museum houses ancient processing tools, rare medicinal specimens (such as century-old wild ginseng), ancient medical texts, and manuscripts from legendary physicians. Through interactive multimedia and physical exhibits, visitors can deeply explore the mysteries and essence of thousands of years of TCM wisdom, experiencing a seamless blend of heritage branding and traditional medical art.", "name": "Tonghanchuntang Chinese Medicine Museum", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, then walk for about 6 minutes."}, {"address": "Inside Yuyuan Tourist Mart, No. 265 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Located at the center of Yuyuan Tourist Mart, Huabao Building is an iconic Ming and Qing imitation structure in the Old City. Its upper floors feature exquisite art galleries and antique auction spaces. The museum regularly hosts high-standard exhibitions of calligraphy, traditional Chinese painting, arts and crafts, and contemporary art, while permanently displaying masterpieces of jade carving, wood carving, and ceramics. Combining antique trading, art appreciation, and cultural exchange, visiting Huabao Building allows you to enjoy profound Oriental aesthetics while taking in panoramic views of Yuyuan Garden and the surrounding old streets.", "name": "Huabao Building Art Museum", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, then walk for about 7 minutes."}, {"address": "No. 36 South Sichuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Also known as Ruose Church, St. Joseph\u0027s Catholic Church was built in 1860 and is a historic Gothic church in Shanghai\u0027s Old City. Featuring a grand, elegant exterior with a towering bell tower and graceful arches, its interior boasts soaring ribbed vaults and vibrant stained glass windows that create a solemn and tranquil sanctuary. Witnessing the modern exchange between Eastern and Western religious cultures, the church sits near the vibrant Yuyuan commercial area, offering a striking cultural contrast that makes it a peaceful must-visit spot for lovers of architecture and religious art.", "name": "St. Joseph\u0027s Catholic Church", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027 (Exit 2), then walk for about 4 minutes."}, {"address": "Inside Yuyuan Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located in the northeast corner of Yuyuan Garden, Tingtao Pavilion is a two-story classical structure now dedicated as an exclusive cultural relics exhibition hall for the garden. The venue rotates displays of ancient calligraphy and paintings, ceramics, rosewood furniture, and precious artworks left by Haipai (Shanghai-style) artists. Here, visitors can stroll through a classic Jiangnan garden while appreciating fine antique artwork, immersing themselves in the elegant taste of Jiangnan scholar-officials and Shanghai\u0027s rich cultural heritage.", "name": "Tingtao Pavilion Exhibition Hall", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, then walk about 8 minutes into the Yuyuan area."}, {"address": "No. 215 Wenmiao Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | The Shanghai Confucian Temple is the only ancient Confucian architectural complex dedicated to Confucius in urban Shanghai. Dating back to the Yuan Dynasty, it possesses a long history and deep cultural significance. The temple features an orderly layout with magnificent structures like Dacheng Hall, Kuixing Pavilion, and Zunjing Pavilion, surrounded by ancient trees in a peaceful, serene setting. It regularly hosts Confucian culture exhibitions, rare stone displays, and classical tea art presentations, and historically served as an important secondhand book market. It is the perfect place to learn about traditional Chinese Confucianism, imperial examination history, and Old Shanghai\u0027s cultural roots.", "name": "Shanghai Confucian Temple", "transport": "Take Metro Line 8 or Line 10 to \u0027Laoximen Station\u0027, then walk for about 10 minutes."}, {"address": "No. 185 Dongjiadu Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located in the Dongjiadu area south of the Yuyuan commercial center, Dongjiadu Cathedral was built in 1853 and was China\u0027s first large-scale Baroque Catholic church capable of holding thousands of people. The interior is grand and airy, featuring exquisite Baroque-Hellenic colonnades, a majestic dome, and invaluable frescoes and sculptures. Beautifully restored to its former glory, this 170+ year-old cathedral perfectly illustrates the seamless blend of 19th-century European religious architecture wit
