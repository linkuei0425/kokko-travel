h Shanghai\u0027s Old City.", "name": "Dongjiadu Cathedral", "transport": "Take Metro Line 9 to \u0027Xiaonanmen Station\u0027 (Exit 3), then walk for about 8 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Built during the Jiajing reign of the Ming Dynasty, Yu Garden is a masterpiece of Jiangnan classical garden art. Deep, serene, and exquisitely laid out, the garden features historic structures like Cuixiu Hall, Yangshan Hall, and Dianchun Hall. Pavilions, rockeries, ponds, cascading waterfalls, and century-old trees complement one another beautifully. The iconic Dragon Wall and intricate brick and stone carvings showcase the pinnacle of traditional landscape architecture, making it a must-visit destination in Shanghai for experiencing the seamless blend of classical gardens and natural beauty.", "name": "Yu Garden", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, Exit 1 or Exit 7, and walk for about 5 minutes."}, {"address": "No. 333 Renmin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located adjacent to the northeast side of Yu Garden, Gucheng Park is the largest open green eco-park around the Old Town. Its landscape blends classical garden aesthetics with modern landscape design, featuring expansive lawns, bamboo groves, tranquil ponds, and winding pathways. It is not only an excellent spot for residents to take a leisurely stroll, but also offers a striking view of Lujiazui\u0027s iconic skyscrapers framing the lush greenery\u2014creating a unique visual contrast between the ancient and the modern.", "name": "Gucheng Park", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, Exit 1, and walk for about 3 minutes."}, {"address": "No. 257 Yuyuan Old Street (inside Yuyuan Bazaar), Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Situated at the heart of Yuyuan Bazaar, the Nine-Turn Bridge and Lotus Pond form the most iconic waterscape landmark in the Old City God Temple area. The zig-zagging bridge makes nine turns, traditionally believed to ward off evil spirits. The shimmering pond comes alive in summer with blooming lotus flowers and swimming koi fish. Framed by traditional Hui-style and Jiangnan architectural buildings, the illuminated reflections at night create a magical, dreamlike atmosphere that attracts countless visitors to stop and take photos.", "name": "Nine-Turn Bridge and Lotus Pond", "transport": "Take Metro Line 10 or Line 14 to \u0027Yuyuan Garden Station\u0027, Exit 7, and walk for about 6 minutes."}, {"address": "Waterfront Belt at the intersection of Zhongshan South Road and Fuxing East Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Extending east from Yu Garden to the banks of the Huangpu River, the South Bund Waterfront Green Belt features spacious waterfront plazas and a continuous stretch of lush greenery. Preserving historic relics of the old docks, it seamlessly integrates modern landscaping and scenic promenades. Visitors can stroll along the riverbank, feel the gentle river breeze, and admire stunning views on both sides of the Huangpu River. It serves as an essential green corridor connecting Yu Garden\u0027s historic charm with modern waterfront energy.", "name": "South Bund Waterfront Green Belt", "transport": "Take Metro Line 9 to \u0027Xiaonanmen Station\u0027 or Line 14 to \u0027Yuyuan Garden Station\u0027, and walk about 10\u201315 minutes to reach the waterfront platform."}, {"address": "No. 380 Nanzhezhan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.2 stars | Located in the Old Town area south of Yu Garden, Penglai Park is a historic city park full of local life and everyday warmth. Lined with lush trees, it boasts large rockeries, ponds, pavilions, covered corridors, and fitness areas. Quiet and elegant, with seasonal flowers blooming year-round, it is a wonderful place to experience the relaxed daily pace of local Shanghai residents while enjoying a touch of urban greenery.", "name": "Penglai Park", "transport": "Take Metro Line 4 or Line 8 to \u0027South Xizang Road Station\u0027 and walk for about 10 minutes."}, {"address": "Between Yan\u0027an East Road and Jinling Middle Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Yanzhong Plaza Park is a large urban forest park located in the heart of Huangpu District, just a short distance from Yu Garden. Hailed as an urban oasis, the park features artificial lakes, waterfalls, babbling streams, and dense woodlands. Designed with an emphasis on natural ecology, it offers wooden boardwalks and waterside platforms, allowing visitors to leave city noise behind and immerse themselves in vibrant nature and fresh air.", "name": "Yanzhong Plaza Park", "transport": "Take Metro Line 8 to \u0027Dashijie Station\u0027, Exit 3, and walk for about 5 minutes."}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Fuxing Park is the only fully preserved French classical garden in Shanghai, located just a short drive from Yu Garden and the Old Town area. It retains traditional French garden elements such as symmetrical axes, sunken flower beds, geometric hedges, expansive lawns, and towering century-old plane trees. The park exudes European romantic charm while carrying the relaxed, timeless vibe of old Shanghai.", "name": "Fuxing Park", "transport": "Take Metro Line 10 or Line 13 to \u0027Xintiandi Station\u0027 and walk for about 8 minutes."}, {"address": "No. 177 Huaihai Middle Road, Huangpu District, Shanghai", "feature": "\u2b50 4.1 stars | Located near Yu Garden and the East Huaihai Road commercial area, Huaihai Park is an elegant green haven nestled in the bustling city. Shaded by trees and winding paths, it features vibrant azalea patches, a rose garden, and artificial landscape features. Compact yet richly designed, it provides locals and travelers with a peaceful, comfortable rest spot away from the urban bustle.", "name": "Huaihai Park", "transport": "Take Metro Line 8 to \u0027Dashijie Station\u0027, Exit 2, and walk for about 3 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Jiuqu Bridge Pond, inside Yu Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Jiuqu Bridge is the most iconic photo landmark in the Yu Garden and City God Temple commercial area. The bridge features nine turns, symbolizing the traditional concept of \u0027returning to unity\u0027 and warding off evil spirits. Standing on the bridge offers sweeping views of classical Jiangnan garden architecture and koi swimming in the pond below. During the annual Lantern Festival, the bridge is lined with exquisitely crafted lanterns. As twilight falls, the interplay of light and shadow creates a magical atmosphere, making visitors feel as though they have traveled back to an ancient golden age\u2014a perfect angle for photography enthusiasts seeking authentic Shanghai traditional charm.", "name": "Jiuqu Bridge (Nine-Turn Bridge), Yu Garden", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 1, and walk about 6 minutes."}, {"address": "No. 257 Yuyuan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Standing in the center of the Jiuqu Bridge pond, Huxinting Teahouse was built during the Qing Dynasty and is one of Shanghai\u0027s oldest surviving teahouses, having hosted distinguished guests like Queen Elizabeth II. Its elegant architecture with flying eaves and upturned corners mirrors beautifully on the clear water, while inside, a rich traditional tea culture thrives. Whether capturing the teahouse\u0027s reflection from the bridge or sipping tea by a second-floor window overlooking the bustling ancient streets, you can snap stunning, aesthetically pleasing photos filled with Oriental charm.", "name": "Mid-Lake Pavilion Teahouse (Huxinting)", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 7, and walk about 7 minutes."}, {"address": "Inside Yu Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Located inside Yu Garden, the \u0027Cloud-Piercing Dragon Wall\u0027 represents the peak of Jiangnan garden carving art. The clay-sculpted dragon winds dynamically along the top of the white lime wall, its head carved with magnificent, life-like power. It is said that the Qing Dynasty garden owner deliberately designed it with three or four claws instead of five to avoid violating the emperor\u0027s exclusive royal motif. Framed by lush bamboo groves and ancient trees, the wall looks mysterious and majestic, making it an unmissable photo spot when exploring the inner garden.", "name": "Dragon Wall Piercing the Clouds, Yu Garden", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station, Exit 1, walk to the main entrance of Yu Garden, purchase a ticket, and enter."}, {"address": "No. 249 Middle Fangbang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | With a history spanning hundreds of years, the Shanghai Old City God Temple is a major Taoist site and cultural landmark. Dedicated to city guardians such as General Huo Guang and Qin Yubo, the main hall features a grand, precise architectural layout and active worship. Huge red pillars, intricate wood carvings, and high-hanging red lanterns at the entrance create a rich folk religious ambience. At night, when illuminated, the glittering hall contrasts brilliantly with the surrounding retro streetscape, offering a truly captivating sight.", "name": "Main Hall of Old City God Temple, Shanghai", "transport": "Take Metro Line 10 to Yuyuan Station, Exit 3, and walk about 8 minutes."}, {"address": "No. 115 Yuyuan Road, inside Yu Garden, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Situated beside Jiuqu Bridge, Lu Bo Lang is renowned for its elegant Ming and Qing architectural style and top-tier Shanghai-style dim sum. This three-story antique building blends seamlessly with the surrounding waterscape, its flying eaves creating a striking visual impression under both blue skies and night lights. Many visitors love taking photos with Lu Bo Lang as a backdrop from the Jiuqu Bridge, or stepping inside to savor famous pastries like \u0027Eyebrow Pastry\u0027 (Meimaosu) and \u0027Osmanthus Rice Cake\u0027 for a state-banquet level feast for both the eyes and taste buds.", "name": "Lu Bo Lang Restaurant", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station and walk about 7 minutes to reach Jiuqu Bridge."}, {"address": "Jiuxiaochang Road (near Middle Fangbang Road), Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Once a military drill field in the Ming Dynasty, Jiuxiaochang Road has transformed into a vintage commercial street rich in Haipai charm and Ming-Qing dynasty aesthetics. The street is lined with time-honored brands and intangible cultural heritage craft stalls. Antique pavilions, ornate carved arches, and high-hanging red lanterns evoke a lively, bustling everyday atmosphere. At night, the illuminated street radiates a dreamy, magical old-world nightscape reminiscent of scenes from anime fantasy films\u2014perfect for striking a pose.", "name": "Jiuxiaochang Road Antique Street, Yuyuan Bazaar", "transport": "Take Metro Line 10 to Yuyuan Station, Exit 1, and walk about 5 minutes."}, {"address": "Inside Yu Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | The \u0027Exquisite Jade Rock\u0027 is the ultimate treasure of Yu Garden, recognized alongside Suzhou\u0027s Ruiyun Peak and Hangzhou\u0027s Zhouyun Peak as one of the three famous stones of Jiangnan. This Taihu stone boasts dynamic shapes and embodies the four classic qualities of garden rocks: \u0027wrinkled, leaky, slender, and porous.\u0027 It is said that if incense is burned underneath, smoke billows magically from every hole. Facing the rock is Yuhua Hall, once the garden owner\u0027s study; looking out through its wooden lattice windows at the rare stone and ancient trees offers a quintessential glimpse into the refined lifestyle of Jiangnan scholars.", "name": "Exquisite Jade Rock \u0026 Yuhua Hall", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station and walk to the Yu Garden scenic area to enter."}, {"address": "Inside Yu Garden, No. 218 Anren Street, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Yu Garden\u0027s Great Rockery was designed by the famous Ming Dynasty rockery master Zhang Nanyang, piled with thousands of tons of yellow stones into majestic, rolling peaks. Next to it stands the exquisite Jiushi Hall (Hall of Nine Lions), featuring finely carved plaques under its eaves and surrounded by rock formations, flowing streams, small bridges, and ancient trees. Standing on the stone path in front of Jiushi Hall with the grand rockery and pavilions in the background captures a richly layered panoramic view of a classical Jiangnan garden\u2014a favorite photo location for photographers.", "name": "Jiushi Hall \u0026 Great Rockery, Yu Garden", "transport": "Take Metro Line 10 or Line 14 to Yuyuan Station and walk in through the main entrance of Yu Garden."}], "name": "Popular Photo Spots"}}, "name": "Yu Garden and City God Temple"}};
        const cityName = "Shanghai";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
