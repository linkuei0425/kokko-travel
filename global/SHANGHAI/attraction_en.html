facts\u2014such as the 1893 Shanghai International Settlement Boundary Stone and the famous Wu Hua Hao Treasure Cabinet. Interactive multimedia exhibits allow visitors to travel through time and experience the century-long changes and elegance of old Shanghai.", "name": "Shanghai History Museum", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, leave via Exit 11, and walk for about 2 minutes."}, {"address": "No. 100 Renmin Avenue, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Centered around the theme \u0027City, People, Environment, and Development\u0027, the Shanghai Urban Planning Exhibition Center serves as a vital showcase for Shanghai\u0027s past, present, and grand blueprint for the future. The centerpiece of the venue is a massive, meticulously detailed scale model of the Shanghai skyline and city layout located on an upper floor. Following an upgraded renovation, the center introduced numerous AR/VR interactive experiences, digital immersive exhibition halls, and green, low-carbon tech displays, making it ideal for visitors interested in modern urban architecture, historical evolution, and future technology.", "name": "Shanghai Urban Planning Exhibition Center", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, Exit 3 leads directly to the venue."}, {"address": "No. 316 Middle Xizang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Formerly known as Moore Memorial Church, located on the east side of People\u0027s Square, this is a renowned Christian church built in the Gothic Revival style. Designed by the famous Hungarian architect L\u00e1szl\u00f3 Hudec and built in the 1920s-1930s, its exterior features brown-red bricks paired with a towering bell tower and exquisite arched windows, exuding a solemn and majestic atmosphere. The interior boasts stunning stained-glass windows that cast magnificent light and shadows when sunlight passes through. Beyond being a key place of worship for local believers, it stands as an iconic historical architectural landmark in the Bund and People\u0027s Square area.", "name": "Moore Memorial Church", "transport": "Take Metro Line 1, 2, or 8 to \u0027People\u0027s Square Station\u0027, leave via Exit 14, and walk for about 1 minute."}, {"address": "No. 219 Jiujiang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Commonly known as the \u0027Red Church\u0027, Holy Trinity Cathedral is located on Jiujiang Road near the East Nanjing Road commercial area and is the oldest surviving English Gothic Revival church in Shanghai. Designed by renowned British architect Sir George Gilbert Scott, the exterior is constructed with crimson face bricks, featuring a soaring spire and a grand basilica interior structure. After meticulous restoration, the cathedral has reclaimed its former glory with lush green gardens. The quaint, elegant red bricks contrast sharply with the surrounding modern skyscrapers, providing a peaceful sanctuary of sacredness and artistic charm amidst the bustling downtown.", "name": "Holy Trinity Cathedral", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, leave via Exit 3, and walk for about 3 minutes."}, {"address": "No. 20 Huqiu Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Situated on Huqiu Road in the Rockbund area, the Rockbund Art Museum is housed in the former Royal Asiatic Society building completed in 1933, blending Art Deco style with traditional Chinese elements. The museum focuses on contemporary art exhibitions and academic promotion, hosting numerous high-level international contemporary art exhibitions, live performances, and art lectures each year. Its elegant exhibition spaces perfectly blend the stone-and-brick textures of historical architecture with avant-garde modern art installations. The rooftop terrace offers stunning views overlooking the Bund and Lujiazui, making it a must-visit Mecca for art enthusiasts and culture lovers.", "name": "Rockbund Art Museum", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, leave via Exit 6, and walk for about 8 minutes."}, {"address": "No. 600 Zhongshan East 2nd Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Located in the Bund Finance Center (BFC) area, Fosun Foundation Shanghai is known as the \u0027Dancing House\u0027 thanks to its unique exterior made of three layers of moving golden bronze tassels. Jointly designed by famous British architectural firms Foster + Partners and Thomas Heatherwick, the outer curtain drops like bamboo pipes and rotates smoothly, creating a visually breathtaking effect. The art center hosts contemporary art exhibitions, fashion shows, public art lectures, and an open-air cafe. Featuring cutting-edge exhibition content, its rooftop terrace \u0027Counter Sky Garden\u0027 is an absolute top spot for photographing the Huangpu River night view and the Lujiazui trio of skyscrapers.", "name": "Fosun Foundation Shanghai", "transport": "Take Metro Line 9 to \u0027Xiaonanmen Station\u0027 or Metro Line 10 to \u0027Yuyuan Garden Station\u0027 and walk for about 12 minutes; or walk south along the Bund riverside promenade."}, {"address": "6th Floor, No. 27 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Located at the core of the International Architecture Exhibition on the Bund\u2014No. 27 Zhongshan East 1st Road (formerly the Jardine Matheson Building)\u2014the Shanghai Jiushi Art Museum ingeniously integrates classic Neoclassical historical architecture with a modern museum space. It mainly exhibits works by domestic and international contemporary masters, Haipai (Shanghai-style) art, and high-quality touring master exhibitions. Immersed in the exhibition halls, visitors can appreciate top-tier artworks while admiring up close the century-old building\u0027s carved domes, wooden handrails, and large arched windows, which offer direct views of the vibrant Huangpu riverfront scene.", "name": "Shanghai Jiushi Art Museum", "transport": "Take Metro Line 2 or 10 to \u0027East Nanjing Road Station\u0027, leave via Exit 7, and walk east along East Nanjing Road toward the Bund for about 8 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 231 West Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Located on the north side of People\u0027s Square in central Shanghai, People\u0027s Park was built on the site of the former Shanghai Raceclub. Lush with leafy trees and dotted with serene ponds, the park features a famous lotus pond, a begonia garden, and the renowned Matchmaking Corner. It serves as a rare, peaceful oasis in the bustling metropolis. Elegant and blooming with seasonal flowers year-round, it is not only a popular spot for morning exercises and casual strolls, but also a place rich in modern Shanghai\u0027s historical memory, blending natural beauty with unique cultural charm.", "name": "People\u0027s Park", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, Exit 11."}, {"address": "No. 28 East Zhongshan 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Built in 1868 at the northern end of The Bund where Suzhou Creek meets the Huangpu River, Huangpu Park is Shanghai\u0027s first European-style park. Layered greenery and wide lush lawns complement the Monument to the People\u0027s Heroes. Though compact in size, the park offers magnificent river views: look east toward the Lujiazui skyscrapers in Pudong, or south to admire the historic Architecture of The Bund. It is a fantastic stop combining natural greenery with iconic historic scenery.", "name": "Huangpu Park", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station, Exit 7, and walk for about 10 minutes."}, {"address": "No. 333 Renmin Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Situated in a prime location between the southern end of The Bund and Yu Garden, Gucheng Park is a large urban park blending modern landscape design with Shanghai\u0027s historical culture. It cleverly incorporates traditional Chinese garden elements\u2014bamboo groves, trickling streams, and rockeries\u2014alongside spacious lawns and winding pathways, bringing a fresh breath of nature to the busy commercial areas nearby. A stroll here allows visitors to enjoy soothing greenery while glimpsing both historic and contemporary skylines through the trees.", "name": "Gucheng Park", "transport": "Take Metro Line 10 or 14 to Yuyuan Garden Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 33 East Zhongshan 1st Road (inside Waitanyuan), Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located on the site of the Former British Consulate near the south bank of Suzhou Creek, Waitanyuan Green Space is the most classic British-style garden along The Bund. It preserves several century-old trees and manicured lawns, enclosed by early historic buildings. Shaded by ancient trees, this quiet and elegant haven offers a refined exotic ambiance\u2014a beloved hidden gem for tourists and photographers looking to capture a serene perspective of The Bund.", "name": "Waitanyuan Green Space", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station, Exit 6, and walk for about 8 minutes."}, {"address": "Between East Yan\u0027an Road and Middle Jinling Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Serving as a massive \u0027urban green lung\u0027 in downtown Shanghai adjacent to People\u0027s Square and the Yan\u0027an Elevated Road, Yanzhong Green Space features natural undulating terrain, artificial lakes, waterfalls, wooden boardwalks, and dense foliage. It feels like a forest park tucked amidst skyscrapers. With scenic paths ideal for walking and jogging, fresh air, and chirping birds, it blocks out urban traffic noise, providing high ecological value and picturesque views right in the city center.", "name": "Yanzhong Green Space - Huangpu Section", "transport": "Take Metro Line 1 or 14 to South Huangpi Road Station, Exit 2, and walk for about 5 minutes."}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located in the heart of Huangpu District near People\u0027s Square and the Huaihai Road shopping district, Fuxing Park is the only park in Shanghai that completely retains a classic French landscape gardening style. It features grand fountains, geometric flower beds, plane tree-lined avenues, and expansive lawns. Teeming with vibrant local life, locals gather here in the morning for exercise and music, while the afternoon brings a relaxed French romantic vibe. It is a historic classic filled with natural elegance.", "name": "Fuxing Park", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1, and walk for about 8 minutes."}, {"address": "No. 200 Renmin Avenue, Huangpu District, Shanghai", "feature": "\u2b50 4.3 stars | Situated at the urban heart of Huangpu District, People\u0027s Square Central Green Space surrounds the famous Shanghai Museum and a 360-degree musical fountain. Designed with exquisite geometric flowerbeds, evergreen lawns, and tree plazas, it seamlessly blends grand civic architecture with modern landscapes. Offering wide-open views and pleasant surroundings, it is an ideal open leisure area to admire surrounding contemporary buildings, watch soaring pigeons, and enjoy urban sunshine.", "name": "People\u0027s Square Central Green Space", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, Exit 1."}, {"address": "Waterfront Promenade along East Zhongshan 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 stars | Stretching along the west bank of the Huangpu River, The Bund Waterfront Green Belt gracefully combines refined urban floral landscapes with spectacular river views. Featuring vertical flower walls, sleek green belts, and seasonal blooms, it highlights the majestic historic buildings along The Bund. Strolling along the waterfront promenade under gentle breezes, surrounded by verdant greenery and river vistas, visitors can enjoy a truly unique experience connecting nature with Shanghai\u0027s premier skyline.", "name": "The Bund Waterfront Green Belt", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station, Exit 7, and walk for about 5 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 1 Zhongshan East 1st Road, Huangpu District, Shanghai", "feature": "\u2b50 4.8 Stars | Spanning about 1.5 km, The Bund is Shanghai\u0027s most iconic landmark area. Standing along the railing, you get a front-row view of Pudong Lujiazui\u0027s ultra-modern skyscrapers across the Huangpu River, including the Oriental Pearl Tower and Shanghai Tower. Behind you stands the International Architecture Exhibition\u2014a grand row of early 20th-century heritage buildings. Whether admiring the Gothic, Romanesque, and Baroque stone architecture by day or taking in the dazzling, illuminated skyline at night, this is a dream photo spot for every visitor to Shanghai.", "name": "The Bund Promenade", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station, then walk east along East Nanjing Road for about 10 minutes."}, {"address": "East Nanjing Road (between Middle Henan Rd and Middle Xizang Rd), Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Renowned as \u0027China\u0027s No. 1 Commercial Street,\u0027 this century-old bustling thoroughfare cuts through the heart of Huangpu District, connecting People\u0027s Square and The Bund. It features a unique blend of heritage Chinese shops and international flagship stores, with vintage Dangdang trams shuttling through. At night, giant glowing neon signs turn the street into a cinematic scene, making it a perfect spot to capture Shanghai\u0027s energetic pulse.", "name": "Nanjing Road Pedestrian Street", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, or Metro Line 2 or 10 to East Nanjing Road Station."}, {"address": "No. 20 East Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Located at the intersection of The Bund and East Nanjing Road, the Peace Hotel is Shanghai\u0027s most legendary Art Deco architectural landmark. Famous for its iconic copper-green pyramidal roof and elegant, luxurious interior, it has hosted countless world leaders, celebrities, and movie stars. Inside, the famous Jazz Bar features a legendary veteran jazz band playing classic tunes. The grand entrance and opulent lobby are magnets for photography enthusiasts and culture lovers.", "name": "Fairmont Peace Hotel Shanghai", "transport": "Take Metro Line 2 or 10 to East Nanjing Road Station, Exit 7, then walk east along East Nanjing Road for about 5 minutes."}, {"address": "Intersection of Zhongshan East 1st Road and South Suzhou Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Situated at the intersection of Suzhou Creek and the Huangpu River, Waibaidu Bridge is China\u0027s first all-steel truss bridge, boasting over a century of history. An iconic symbol of Shanghai\u0027s industrial heritage, it has featured in numerous classic movies and TV shows like \u0027Romance in the Rain\u0027 and \u0027The Bund\u0027. At sunset, warm golden light bathes the steel framework against the futuristic Lujiazui skyline, making it a beloved spot for vintage photos and wedding photography.", "name": "Waibaidu Bridge", "transport": "Take Metro Line 10 or 12 to Tiantong Road Station, Exit 3, then walk southeast for about 10 minutes."}, {"address": "No. 170 West Nanjing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 Stars | Standing opposite People\u0027s Square, Park Hotel was designed by renowned architect L\u00e1szl\u00f3 Hudec and held the title of \u0027the tallest skyscraper in the Far East\u0027 for nearly half a century. A masterpiece of 1930s Art Deco architecture, it houses the official \u0027Geodetic Origin of Shanghai\u0027 marker. Its bakery is world-famous for its delicious butterfly pastry (palmiers), attracting endless queues of visitors who love to snap photos in front of the nostalgic facade.", "name": "Park Hotel Shanghai", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, Exit 8, then walk for about 3 minutes."}, {"address": "No. 201 Renmin Avenue, Huangpu District, Shanghai", "feature": "\u2b50 4.7 Stars | Located at the center of People\u0027s Square, the Shanghai Museum features a unique architectural design representing the ancient Chinese philosophy of \u0027round sky and square earth,\u0027 with its top resembling a large bronze vessel. It houses an extraordinary collection of ancient Chinese bronzes, ceramics, calligraphy, paintings, and sculptures. Surrounded by green lawns and fountains, its grand exterior is a timeless landmark blending high culture with architectural beauty.", "name": "Shanghai Museum (People\u0027s Square)", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, Exit 1, then walk for about 5 minutes."}, {"address": "No. 100 Renmin Avenue, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Recently revamped and reopened, the Shanghai Urban Planning Exhibition Center features a futuristic roof designed to resemble white magnolia petals. The highlight is a massive, incredibly detailed scale model of Shanghai\u0027s urban landscape, alongside futuristic AR/VR interactive exhibits. It seamlessly tells the story of Shanghai\u0027s transformation from a humble fishing village to a global metropolis, making it a hugely popular photo and learning hotspot.", "name": "Shanghai Urban Planning Exhibition Center", "transport": "Take Metro Line 1, 2, or 8 to People\u0027s Square Station, Exit 3."}, {"address": "No. 1 South Xizang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Founded in 1917, The Great World was Old Shanghai\u0027s most famous entertainment center, famously known by the saying, \u0027If you haven\u0027t been to The Great World, you haven\u0027t been to Shanghai.\u0027 It is renowned for its iconic distorting mirrors and multi-tiered tower. Now modernly renovated while preserving its retro charm, it integrates Shanghai intangible cultural heritage, immersive theater, and creative markets, making it a trendy hotspot blending nostalgia with contemporary creativity.", "name": "The Great World Shanghai", "transport": "Take Metro Line 8 to Dashijie (The Great World) Station, Exit 1."}], "name": "Top Photo Hotspots"}}, "name": "The Bund, Nanjing Road and People\u0027s Square"}, "disney": {"categories": {"cat_1": {"items": [{"address": "Inside Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.9 Stars | The Enchanted Storybook Castle is the central iconic landmark of Shanghai Disneyland and the tallest, largest, and most interactive castle in any Disney theme park globally. This majestic structure blends diverse European classical and Gothic architectural aesthetics, with its golden spires adorned with traditional Chinese peony flowers and classic Disney motifs, symbolizing a harmonious fusion of Eastern and Western cultures. Inside, guests will find the \u0027Once Upon a Time\u0027 Adventure walkthrough experience, the Royal Banquet Hall, and Voyage to the Crystal Grotto passing underneath. From its meticulously crafted facade lighting to its intricate interior craftsmanship, the castle showcases the pinnacle of architectural beauty and a magical fairytale atmosphere.", "name": "Enchanted Storybook Castle", "transport": "Take Shanghai Metro Line 11 to Disney Resort Station and walk about 10 minutes to the center of the park."}, {"address": "Inside Adventure Isle, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Located in Adventure Isle, Roaring Mountain is one of the most visually striking natural landscapes and landmark structures in Shanghai Disneyland. Inspired by ancient mysterious tribal legends, this massive artificial mountain feature boasts a giant beast head carved into its cliff face, accompanied by deep roaring sounds and cascading waterfalls that create an intense atmosphere of uncharted adventure. Hidden inside is the swirling rapid track of Roaring Rapids. The entire structure seamlessly integrates geological simulation, landscape sculpture, and ride engineering, demonstrating exceptional craftsmanship in landscape architecture.", "name": "Roaring Mountain", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk left towards Adventure Isle."}, {"address": "No. 756 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | The Shanghai Disneyland Hotel is a luxurious landmark building steeped in Art Nouveau style from the late 19th and early 20th centuries. Situated along Wishing Star Lake, its exterior features elegant ironwork lines, stained glass roofs, and exquisite garden sculptures, perfectly recreating a blend of Victorian elegance and classic Disney charm. The grand lobby features a soaring classical dome and bronze statues of Mickey\u0027s orchestra. The overall architectural design presents an elegant historical texture rich in fairytale charm, making it an architectural masterpiece in the resort not to be missed.", "name": "Shanghai Disneyland Hotel", "transport": "Take the Disney Resort Shuttle Bus or ride the Wishing Star Lake Ferry directly from the Disneytown Pier."}, {"address": "Inside Tomorrowland, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.9 Stars | The giant translucent canopy architecture of TRON Lightcycle Power Run in Tomorrowland is the most futuristic and technologically stunning landmark at Shanghai Disneyland. Utilizing cutting-edge structural engineering, this sleek, massive canopy appears as a pristine white fluid shape by day, and transforms into a dynamic grid of light and shadow at night powered by thousands of LEDs. The architectural design ingeniously encapsulates the high-tech coaster track, fusing avant-garde industrial design with fluid geometric aesthetics into one of the most iconic modern architectural pieces in Disney parks worldwide.", "name": "TRON Canopy Architecture", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and walk right towards Tomorrowland."}, {"address": "Disneytown, No. 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | The architectural district of Disneytown cleverly fuses traditional old Shanghai Shikumen building elements with Shanghai-style Art Deco ornamentation. Divided into themed areas like the Marketplace and Broadway Plaza, the buildings along the streets feature alternating red and blue bricks, vintage iron light fixtures, and elegant arches. This design preserves local historical and cultural heritage while exuding an international resort town charm. Strolling through allows guests to appreciate a unique blend of old and new architectural aesthetics alongside a relaxed, upscale atmosphere.", "name": "Disneytown Architectural District", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1 or 4), then walk for about 5 minutes."}, {"address": "Inside Treasure Cove, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | Located in Treasure Cove, this large building complex faithfully recreates an 18th-century Spanish colonial fort and harbor pier from the Golden Age of Piracy. Utilizing artful distressing techniques, the architecture realistically depicts peeling walls, riveted timber construction, and ancient cannon emplacements. Barbossa\u0027s Bounty restaurant is set directly alongside the indoor dark ride waterway, allowing guests to dine while taking in views of indoor ships and towering pirate fortress structures\u2014a premier example of combining themed environmental architecture with immersive dining.", "name": "Barbossa\u0027s Bounty \u0026 Pirates of the Caribbean: Battle for the Sunken Treasure Architecture", "transport": "Take Metro Line 11 to Disney Resort Station, enter the park, and head towards Treasure Cove."}, {"address": "Main Entrance, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | As the first themed land guests encounter upon entering the park, Mickey Avenue\u0027s architecture pays homage to the retro aesthetics of early 20th-century American towns and classic Disney animation soundstages. The vibrant, highly detailed buildings along the avenue include Il Paperino, Sweethearts Confectionery, and Steamboat Cafe. Each structure features unique whimsical and cartoon vintage details, reimagining early American commercial architecture through a fun, playful lens to evoke a rich sense of nostalgic history and joyous atmosphere.", "name": "Mickey Avenue Vintage American Architecture", "transport": "Take Metro Line 11 to Disney Resort Station, exit, and proceed directly through the main entry turnstiles."}, {"address": "Broadway Plaza, Disneytown, No. 255 Shendi West Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | Located at Broadway Plaza in Disneytown, the Walt Disney Grand Theatre is a landmark venue modeled after classic 1930s Broadway theaters. The exterior features a glamorous neon marquee sign and vintage theater porch, while the interior houses modern theater facilities seating approximately 1,200 guests. Exuding a rich Art Deco style, the architectural design revives the elegance and splendor of the golden age of musicals, having hosted acclaimed Broadway-style Chinese productions of \u0027The Lion King\u0027 and \u0027Beauty and the Beast\u0027.", "name": "Walt Disney Grand Theatre", "transport": "Take Metro Line 11 to Disney Resort Station and walk to Broadway Plaza in Disneytown."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Gardens of Imagination, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Located inside the Gardens of Imagination at Shanghai Disneyland, Marvel Universe is an immersive cultural exhibition hall that blends Marvel comic history, film prop displays, and interactive technology. The venue showcases numerous 1:1 scale Avengers armor models, rare movie manuscripts, and visual art, allowing guests to step into the creative journey and cultural impact of the Marvel Cinematic Universe.", "name": "Marvel Universe", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 10 minutes into the Gardens of Imagination inside the park."}, {"address": "Disneytown, No. 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 stars | Located in Disneytown, the Walt Disney Grand Theatre is an iconic performing arts venue radiating vintage Broadway charm. Blending 1920s Art Deco style with professional, luxurious theater facilities, it successfully hosted the Chinese-language premieres of world-class classic musicals like \u0027The Lion King\u0027 and \u0027Beauty and the Beast\u0027, making it a premier art palace not to be missed in the resort.", "name": "Walt Disney Grand Theatre", "transport": "Take Metro Line 11 to Disney Resort Station (Exit 1 or 2), then walk about 5 minutes to Disneytown."}, {"address": "No. 107 Zhongshi Street, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Located in Chuansha Ancient Town near the Disney Resort, Chuansha Catholic Church (Sacred Heart of Jesus Church) was built in 1856 and is one of the oldest and best-preserved Gothic churches in Pudong. Featuring a grand spired bell tower, exquisite stained glass windows, and a solemn vaulted sanctuary, it exudes rich Western religious art and local historical heritage\u2014an excellent spot for architectural aesthetics and religious culture.", "name": "Chuansha Catholic Church", "transport": "Take Metro Line 11 to Disney Resort Station and transfer to Bus Pudong 50, or take Metro Line 2 to Chuansha Station and walk."}, {"address": "No. 218 Xinchuan Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Located just a few kilometers from Disney Resort, \u0027Neishidi\u0027 is a traditional Jiangnan courtyard mansion and the former residence of modern educator Huang Yanpei and musician Huang Zi. The museum displays precious historical artifacts, calligraphy, paintings, and modern educational archives, faithfully recreating the elegant architectural style and rich cultural atmosphere of a prominent late-Qing to early-Republican Jiangnan family.", "name": "Neishidi - Huang Yanpei Former Residence Museum", "transport": "Take a taxi from Disney Resort for about 15 minutes, or take Metro Line 2 to Chuansha Station (Exit 1) and walk about 10 minutes."}, {"address": "Wishing Star Park, Shanghai Disney Resort, Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Situated within Wishing Star Park surrounding Wishing Star Lake, this area features dedicated art and ecological science exhibition spaces that blend Disney\u0027s creative aesthetics with natural landscapes. The park hosts rotating outdoor sculpture exhibits, Disney animation art displays, and special environmental conservation exhibits, letting visitors enjoy both artistic creativity and ecological beauty amidst scenic lakeside views.", "name": "Wishing Star Park Art \u0026 Nature Exhibition Area", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 3 minutes after exiting to enter Wishing Star Park."}, {"address": "No. 171 Xinchuan Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located in Chuansha Ancient City Wall Park, this historical exhibition hall preserves remnants of Ming Dynasty city walls built to resist Japanese pirates, along with historic structures like Kui Xing Pavilion. Through artifacts, structural fragments, and 3D scale models, it details Chuansha\u0027s centuries-long history as a key coastal defense stronghold and its rich Ming-Qing cultural heritage, just a short drive from Disney Resort.", "name": "Chuansha Ancient City Wall Historical Exhibition Hall", "transport": "Take Metro Line 2 to Chuansha Station, then transfer to a local bus or walk about 12 minutes."}, {"address": "Disneytown, No. 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Located in Disneytown, the LEGO Flagship Store is not just a retail location, but an awe-inspiring brick art gallery. It showcases massive LEGO creations built from millions of bricks, including a giant Disney castle, iconic Marvel heroes, a massive dragon sculpture, and traditional Chinese cultural murals, displaying master-level modern miniature sculpture art and creative genius.", "name": "LEGO Store Art \u0026 Model Exhibition Zone", "transport": "Take Metro Line 11 to Disney Resort Station, then walk about 5 minutes to the LEGO Flagship Store in Disneytown."}, {"address": "Hejing Village, Liuzao, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Hejing Catholic Church is a historic rural Catholic church in the Chuansha region of Pudong. Featuring an elegant and solemn architectural style, it perfectly blends Western Romanesque design with traditional Chinese masonry craftsmanship. The tranquil sanctuary retains rich religious artwork across its altar and murals, making it a unique and peaceful spot for religious architecture near Disney Resort.", "name": "Hejing Catholic Church", "transport": "Take a taxi from Disney Resort for about 10 to 15 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Shanghai Disney Resort, No. 258 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Located right next to Disneytown and Shanghai Disneyland, Wishing Star Park covers approximately 40 hectares built around the beautiful Wishing Star Lake. Featuring a 2.5-kilometer lakeside walking trail, expansive lawns, azure waters, and a rich plant ecosystem, it is the best spot to admire distant views of the Disney Castle and enjoy natural tranquility. The park offers family-friendly woodland exploration areas, wetland bridges, and multiple viewing platforms. Cherry and peach blossoms bloom in spring, while colorful foliage paints a gorgeous landscape in autumn. It\u0027s also an exceptional spot to catch sunset views in the evening.", "name": "Wishing Star Park", "transport": "Take Metro Line 11 to Disney Resort Station, Exit 4, and walk for about 5 minutes."}, {"address": "No. 187, Lane 399 Shendi East Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Located in the eastern area of the Shanghai International Resort, Shanghai Lavender Park is a national 4A-level tourist attraction. It features nearly 200,000 true lavender plants imported from Provence. During the annual Lavender Festival from May to June, the entire park transforms into a spectacular, fragrant sea of purple flowers. Beyond lavender, the park boasts a rose garden, large lawns, and camping zones infused with romantic Southern French charm. It\u0027s an incredibly popular scenic park near Disney Resort, ideal for photography, wedding photoshoots, and family picnics.", "name": "Shanghai Lavender Park", "transport": "Take Metro Line 11 to Disney Resort Station, then transfer to Resort Shuttle Bus Line 2 or 3 and get off at Lavender Park Station."}, {"address": "No. 150 Shendi East Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Situated on the periphery of the Disney Resort core area, Guangming Ecological Park is a versatile ecological park integrating eco-tourism, leisure experiences, and green dining. Preserving pristine water-town scenery and high-quality wetland environments, the park features lush trees, small bridges over flowing streams, and habitats for various rare waterfowl. With orchard fruit-picking areas, an eco-farm, and leisure trails, visitors can enjoy fruit and vegetable picking, cycle or stroll through quiet woods, and embrace pure natural beauty away from the urban bustle.", "name": "Guangming Ecological Park", "transport": "Take Metro Line 11 to Disney Resort Station, then take a resort shuttle bus or taxi for about 8 minutes."}, {"address": "Inside Disneytown, No. 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Stretching along Wishing Star Lake, Disneytown Lakeshore Green Space is an exquisitely landscaped green belt that seamlessly blends natural ecology with Disney\u0027s fairytale charm. Featuring accessible waterfront wooden boardwalks, manicured garden arrangements, and spacious lawns, visitors can gaze at the grand silhouette of the Enchanted Storybook Castle while watching wild waterfowl and the iconic giant Donald Duck installation float on the lake. It is also one of the finest free viewpoints for watching the sun set over the lake and taking in the dazzling Disney nighttime fireworks display.", "name": "Disneyland Town Lakeshore Green Space", "transport": "Take Metro Line 11 to Disney Resort Station, Exit 2, and walk about 3 minutes into Disneytown."}, {"address": "Near the intersection of Shendi East Road and Tanghuang Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.2 stars | Serving as a key green ecological barrier within the Shanghai International Resort, Shendi Ecological Park is renowned for its rustic natural charm and fresh, high-negative-oxygen-ion air. Boasting extremely high vegetation coverage, it features a scenic forest trail stretching several kilometers lined with waterfront platforms, bamboo paths, and wooden resting pavilions. Dedicated to natural habitat conservation, seasonal flowers bloom here year-round, making it a hidden gem for outdoor hiking, jogging, and nature photography, showcasing primitive natural beauty amidst a modern resort.", "name": "Shendi Ecological Park", "transport": "Take Metro Line 11 to Disney Resort Station, then take a taxi for about 5 minutes or take the resort shuttle bus."}, {"address": "No. 4385 Zhoudeng Road, Zhoupu Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.4 stars | Located adjacent to the southwest side of Shanghai Disney Resort, Zhoupu Flower Sea Ecological Park is a vast flower-themed destination. Designed like a rainbow field, it arranges flowers of different varieties and blooming seasons into a vibrant, mosaic-like landscape throughout the year. Facilities include a flower exhibition hall, outdoor camping base, children\u0027s play area, and lakeside boating. Tulips and corn poppies bloom in spring, while cosmos and pink muhly grass create romantic scenes in autumn\u2014making it a perfect suburban flower-viewing spot to complement your Disney trip.", "name": "Zhoupu Flower Sea Ecological Park", "transport": "Take Metro Line 11 to Xiuyan Road Station, then transfer to Pudong Bus Line 92 or Zhoukang Bus Line 5 and get off at Zhoudeng Road Zhouzhu Highway Station."}, {"address": "No. 2600 Huaxia East Road, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 stars | Situated in the ancient town area of Chuansha east of Disney Resort, Chuansha Park is a classical park combining traditional Jiangnan garden aesthetics with modern recreational amenities. Its iconic landmark is the ancient-style \u0027Heming Tower\u0027\u2014a towering structure with upturned eaves offering panoramic views over the park\u0027s ponds, pavilions, and lush greenery. Featuring charming bridges, flowing streams, unique rockeries, a cultural corridor, and a kids\u0027 playground, the park boasts a serene, elegant atmosphere that showcases the rich cultural heritage and scenic charm of Pudong\u0027s Chuansha region.", "name": "Chuansha Park", "transport": "Take Metro Line 2 to Chuansha Station, Exit 1, and walk for about 10 minutes."}, {"address": "Around the intersection of South Huan Resort Road and Tanghuang Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.1 stars | Built along the perimeter of Shanghai Disney Resort, the Disney Section of the Pudong Ecological Greenbelt is a large urban forest corridor designed to foster harmony between humanity and nature. This greenbelt encompasses continuous woodlands, scenic waterways, cycling paths, and fitness trails lined with camphor trees, dawn redwoods, cherry blossoms, and more. Quiet and uncrowded, it is ideal for visitors seeking peaceful outdoor cycling, morning runs, or family walks, offering an up-close look at the vibrant greenery surrounding the resort area.", "name": "Pudong Ecological Greenbelt (Disney Section)", "transport": "Take Metro Line 11 to Disney Resort Station, then take a taxi or shared bicycle for about 10 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.9 Stars | As the heart and iconic landmark of Shanghai Disneyland, the Enchanted Storybook Castle is the tallest, largest, and most interactive Disney castle in the world. Its outer walls feature exquisite Snow White bas-reliefs and four-seasons murals, while the spires gracefully incorporate traditional Chinese auspicious clouds and peony motifs. It is not only the most popular photo spot in the park but also the main stage for the nightly show \u0027ILLUMINATE! A Nighttime Celebration\u0027. Whether taking photos right in front of the castle or looking out from the Alice in Wonderland Maze, you will capture dreamlike fairytale views.", "name": "Enchanted Storybook Castle", "transport": "Take Metro Line 11 to Disney Station, Exit 1, then walk to the park entrance"}, {"address": "Near the park entrance inside Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | As the first themed land upon entering the park, Mickey Avenue is renowned for its colorful vintage architecture and vibrant atmosphere. The street is lined with joyful shops and restaurants, and character meet-and-greets featuring Mickey, Minnie, Donald Duck, and friends happen all around. The \u0027Steamboat Willie\u0027 fountain sculpture in the center, alongside classic Disney character displays, serves as an excellent backdrop for cheerful group photos full of classic American cartoon charm.", "name": "Mickey Avenue", "transport": "Take Metro Line 11 to Disney Station, Exit 1, and walk into the park"}, {"address": "Fantasyland, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Located in Fantasyland, the Mad Hatter Tea Cups ride is inspired by the mad tea party from the classic animation \u0027Alice in Wonderland\u0027. Colorful teacups spin beneath an ornate canopy decorated with vibrant lanterns and whimsical decorations. The scene is particularly romantic at dusk when the lights turn on, making it a favorite spot for taking whimsical, dreamlike photos. The motion of the spinning cups against the shimmering lights effortlessly creates Instagram-worthy shots.", "name": "Mad Hatter Tea Cups", "transport": "Take Metro Line 11 to Disney Station, Exit 1, and walk into Fantasyland inside the park"}, {"address": "Tomorrowland, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.8 Stars | The signature attraction of Tomorrowland and one of the most high-tech, exhilarating roller coasters across all Disney parks worldwide. At night, the massive, futuristic semi-transparent canopy glows with dazzling blue and purple lights, echoing the sleek sci-fi style of \u0027TRON: Legacy\u0027. As Lightcycles zip through winding tracks at high speeds, the junction between the canopy interior and outdoor track offers an exceptional location to capture dynamic speed and futuristic architecture for a striking visual impact.", "name": "TRON Lightcycle Power Run", "transport": "Take Metro Line 11 to Disney Station, Exit 1, and walk into Tomorrowland inside the park"}, {"address": "Disney Pixar Toy Story Land, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Located in Disney Pixar Toy Story Land, this attraction is instantly recognizable by its striking, bright orange U-shaped track. A giant Rex holds a remote control operating the racer, immersing visitors in a playful toy-sized universe. The bold orange track pops vividly against the blue sky, making it a high-demand photo spot. Whether capturing the racer zooming past from below or using the vibrant toy decor as your backdrop, you are guaranteed energetic shots full of childhood magic.", "name": "Rex\u0027s Racer", "transport": "Take Metro Line 11 to Disney Station, Exit 1, and walk into Toy Story Land inside the park"}, {"address": "Fantasyland, Shanghai Disneyland, Chuansha New Town, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | An exclusive attraction designed specifically for Shanghai Disneyland, perfectly recreating the whimsical hedge maze from the classic animated film. Inside, you\u0027ll find the Queen of Hearts sculpture, giant fairytale flowers, the Mad Hatter\u0027s Tea Party set, and the Heart Palace. Featuring numerous photo spots\u2014especially the tea party table laden with treats and the elevated archway overlooking the Enchanted Storybook Castle\u2014it offers endless delightful fairytale photography moments around every turn.", "name": "Alice in Wonderland Maze", "transport": "Take Metro Line 11 to Disney Station, Exit 1, and walk into Fantasyland inside the park"}, {"address": "No. 255 Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai (Inside Shanghai Disney Resort)", "feature": "\u2b50 4.6 Stars | Located adjacent to Shanghai Disneyland, Disneytown is an international shopping, dining, and entertainment district open to the public free of charge. Combining traditional Shanghai Shikumen architecture with modern pedestrian street designs, it features large-scale art installations like the giant inflatable Donald Duck in the center. Home to flagship stores and specialty dining, the district exudes a romantic and relaxed vibe when illuminated at night\u2014making it a perfect check-in destination to soak up Disney magic without buying a park ticket.", "name": "Disneytown", "transport": "Take Metro Line 11 to Disney Station, Exit 2 or 4, and walk a short distance"}, {"address": "Shendi West Road, Chuansha New Town, Pudong New Area, Shanghai (By Wishing Star Lake, Shanghai Disney Resort)", "feature": "\u2b50 4.5 Stars | Built around scenic Wishing Star Lake, this ecological park features a 2.5-kilometer lakeside promenade showcasing fresh and tranquil natural scenery. The park features a colorful giant Donald Duck floating installation on the lake, with sweeping views of the Enchanted Storybook Castle and Disneytown in the distance. It is a peaceful paradise for catching sunsets and photographing panoramic resort views, making it a must-visit outdoor leisure spot within the resort.", "name": "Wishing Star Park", "transport": "Take Metro Line 11 to Disney Station, Exit 3 or 4, and walk a short distance"}], "name": "Popular Photo Spots"}}, "name": "Shanghai Disney Resort"}, "french-concession": {"categories": {"cat_1": {"items": [{"address": "No. 1850 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Originally built in 1924 as Normandy Apartments and designed by renowned Hungarian-Slovak architect L\u00e1szl\u00f3 Hudec, Wukang Mansion is Shanghai\u0027s first arcade-style apartment building. This eight-story French Renaissance-style building spans the intersection of Middle Huaihai Road and Wukang Road with a unique wedge shape resembling an ocean liner. Its red brick exterior adorned with light-grey decorative details showcases immense architectural value. Once home to famous cultural figures like movie stars Wang Renmei and Qin Yi, it is now one of Shanghai\u0027s most popular corner landmarks and photography hotspots. Strolling under its arcades offers a deep sense of the Former French Concession\u0027s romantic and elegant charm.", "name": "Wukang Mansion", "transport": "Metro Line 10 or 11 to Jiaotong University Station (Exit 7), about a 5-minute walk."}, {"address": "No. 55 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Sinan Mansions is the only preservation, restoration, and revitalization project in central Shanghai focused on garden villas. Bringing together 51 historical garden villas of diverse architectural styles, it showcases the essence of 1920s and 1930s French Concession architecture. The complex includes standalone garden villas, semi-detached garden villas, and garden lilong (laneway houses). Walking down tree-lined Sinan Road, carved iron gates, red brick walls, and pebble-finished facades weave a rich tapestry of French nostalgia. Today, Sinan Mansions integrates fine dining, boutique hotels, cultural bookstores, and art exhibitions, seamlessly blending historical heritage with modern lifestyle.", "name": "Sinan Mansions", "transport": "Metro Line 13 to Middle Huaihai Road Station (Exit 1), about an 8-minute walk."}, {"address": "No. 1843 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Located at No. 1843 Middle Huaihai Road, the Former Residence of Soong Ching-ling is a spacious, pseudo-three-story brick-and-timber garden villa built in the 1920s. It was the long-time residence and workplace of Soong Ching-ling, wife of Sun Yat-sen (founding father of the Republic of China) and Honorary President of the People\u0027s Republic of China. The estate boasts a serene environment surrounded by century-old camphor trees and lush lawns. The main building preserves original furnishings from her daily life and guest receptions, showcasing her refined, simple lifestyle and extraordinary life. The adjoining memorial hall displays a wealth of precious historical artifacts and photos, making it a wonderful place to explore modern Chinese history and French Concession heritage.", "name": "Former Residence of Soong Ching-ling", "transport": "Metro Line 10 or 11 to Jiaotong University Station (Exit 7), about a 3-minute walk."}, {"address": "No. 7 Xiangshan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Located at No. 7 Xiangshan Road (formerly No. 7 Rue Moli\u00e8re), the Former Residence of Sun Yat-sen is an exquisite two-story European country garden villa donated to Dr. Sun Yat-sen by overseas Chinese. It was the only joint residence of Dr. Sun and his wife Soong Ching-ling. Here, he authored key works such as \u0027Strategies for Development\u0027 and \u0027History of the Chinese Revolution,\u0027 and planned the first Kuomintang-Communist cooperation. The pebble-finished exterior walls complement dark green window frames and deep red roof tiles. The interior retains its original 1920s layout and ambiance, steeped in history. An adjacent museum systematically presents Dr. Sun\u0027s revolutionary life and historical contributions.", "name": "Former Residence of Sun Yat-sen", "transport": "Metro Line 13 to Middle Huaihai Road Station (Exit 2), about a 6-minute walk."}, {"address": "No. 73 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Located at No. 73 Sinan Road, Zhou Residence is a classic French garden villa built in the 1920s. During the KMT-CPC negotiations in 1946, Zhou Enlai led the CPC delegation to set up their Shanghai office here, publicly known as the \u0027Zhou Residence\u0027. This three-story villa features pitched red-tile roofs, ivy-covered exterior walls, and a charming garden lawn. The venue recreates scenes from the work and lives of revolutionaries like Zhou Enlai and Dong Biwu, including offices, meeting rooms, dormitories, and a press room. Visitors can appreciate French Concession villa aesthetics while experiencing a pivotal site in modern Chinese political history.", "name": "Former Residence of Zhou Enlai", "transport": "Metro Line 13 to Middle Huaihai Road Station, or Metro Line 9 to Dapuqiao Station (Exit 1), about a 10-minute walk."}, {"address": "No. 287 South Shaanxi Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Located at the junction of South Shaanxi Road and West Jianguo Road, Cit\u00e9 Bourgogne was built in 1930 by French investors as a classic French Shikumen laneway residential compound. It seamlessly blends Western Baroque archway elements with traditional Jiangnan residential layouts. A fine brick-carved archway stands at the lane entrance, inscribed with \u00271930\u0027 and \u0027Cit\u00e9 Bourgogne\u0027. The neighborhood retains a remarkably intact Shikumen community feel, featuring red brick walls, black-lacquered wooden doors, and soaring horse-head walls. Renowned Chinese author Ba Jin once lived here and wrote his masterpiece \u0027Family\u0027. Today, local residents still live here, giving it an authentic, bustling neighborhood vibe rich in old-Shanghai flavor.", "name": "Cit\u00e9 Bourgogne", "transport": "Metro Line 9 or 12 to Jiashan Road Station (Exit 2), about a 5-minute walk."}, {"address": "No. 1331 Middle Fuxing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Located at No. 1331 Middle Fuxing Road, Blackstone Apartments (also known as Blackstone House) was built in 1924 as a six-story Eclectic building with strong Baroque influences. Named for its black stone foundational base, it was once hailed as \u0027China\u0027s most luxurious apartment complex\u0027. The symmetrical facade features bold curved lines, intricate relief carvings, and majestic Corinthian colonnades. Today, the ground floor has been transformed into a lifestyle block housing a cultural bookstore (Hubart), a vinyl record cafe, a music bar, and art spaces\u2014merging a century of history with modern hipster culture as a trendy landmark in the Fuxing Road music district.", "name": "Blackstone Apartments", "transport": "Metro Line 1 or 7 to Changshu Road Station (Exit 1), about a 6-minute walk."}, {"address": "No. 79 Fenyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Located at No. 79 Fenyang Road, the Shanghai Craft Museum was originally the official residence of the Director General of the French Concession Municipal Council. Its pure white Neoclassical exterior has earned it the nickname \u0027The Little White House of Shanghai\u0027. Built in 1905, this French Renaissance mansion features dual curved staircases, carved marble columns, and an expansive lawn garden. The opulent interior displays dozens of Shanghai\u0027s intangible cultural heritage crafts\u2014including ivory carving, jade carving, embroidery, and paper cutting\u2014with master artisans demonstrating their craft live on site. It is a brilliant destination combining grand architectural art with exquisite traditional craft aesthetics.", "name": "Shanghai Craft Museum", "transport": "Metro Line 1 or 7 to Changshu Road Station (Exit 2), about an 8-minute walk."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 1843 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Located on Middle Huaihai Road, this elegant garden villa was the long-term Shanghai residence of Soong Ching Ling, Honorary President of the PRC. The main building features a blend of Moganshan-style and Western architectural elements, housing her original furniture, private book collection, and precious historical artifacts. Strolling across the lush green lawn under century-old camphor trees offers a profound sense of 20th-century Chinese history\u0027s serenity and greatness. It is a classic spot rich in culture and history in the heart of the Former French Concession.", "name": "Former Residence of Soong Ching Ling", "transport": "Take Metro Line 10 or 11 to Chiao Tung University Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 79 Fenyang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 stars | Built in 1905, this museum building was formerly the official residence of the Director-General of the French Concession Board of Directors. It earned the nickname \u0027Little White House\u0027 for its elegant white French Neoclassical mansion appearance. The museum showcases dozens of national intangible cultural heritage arts, including woolen embroidery, paper cutting, Shanghai-style micro-carving, jade carving, and boxwood carving. Visitors can not only admire exquisite masterworks but often watch veteran artisans crafting on-site, perfectly blending architectural elegance with Shanghai craftsmanship.", "name": "Shanghai Crafts and Arts Museum", "transport": "Take Metro Line 1 or 7 to Changshu Road Station, Exit 2, and walk for about 10 minutes."}, {"address": "No. 53 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.5 stars | Built in 1925, the Community Church is one of the most representative Gothic Revival churches from Shanghai\u0027s Former French Concession period. Featuring red brick masonry, soaring steeples, and beautiful geometric tracery windows, its architecture is majestic and elegant. As one of Shanghai\u0027s largest Protestant churches, it is surrounded by lush trees and quiet courtyards. On weekends, the melodious pipe organ fills the sanctuary, offering a peaceful sanctuary away from the urban bustle.", "name": "Community Church", "transport": "Take Metro Line 1 to Hengshan Road Station, Exit 4, and walk for about 3 minutes."}, {"address": "No. 113 Wukang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 stars | Located on the iconic Wukang Road, the Former Residence of Ba Jin is a garden villa built in 1923. Ba Jin, a giant of modern Chinese literature, lived and wrote here for half a century, producing important works like \u0027Random Thoughts\u0027. The residence faithfully recreates his later living environment, including a study packed with tens of thousands of books, a modest bedroom, and a vibrant garden. It is not only a pilgrimage site for literary enthusiasts but also a fantastic window into the lifestyle of Old Shanghai intellectuals.", "name": "Former Residence of Ba Jin", "transport": "Take Metro Line 10 or 11 to Chiao Tung University Station, Exit 7, and walk for about 10 minutes."}, {"address": "No. 7 Xiangshan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 stars | Situated on Xiangshan Road, Dr. Sun Yat-sen\u0027s former residence is an elegant two-story European-style garden villa featuring unique dark-pebbled exterior walls. It is the only home Dr. Sun Yat-sen and Soong Ching Ling owned together, where Sun authored key works such as \u0027The Strategy of Country Building\u0027. The main house preserves original furnishings and historical documents, while the adjacent museum chronicles his momentous life in rich detail, offering immense historical and cultural significance.", "name": "Former Residence of Sun Yat-sen Memorial Hall", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 1, and walk for about 8 minutes."}, {"address": "No. 88 Taikang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 stars | Founded by renowned Taiwanese glass artists Chang Yi and Loretta Yang, this contemporary art museum stands opposite Tianzifang. The building\u0027s exterior features thousands of glass tiles embedded with a massive metallic peony blossom, creating breathtaking light effects. Inside, masterworks of contemporary international glass art are displayed alongside historic glass artifacts, blending ancient craftsmanship with modern creativity. The top floor houses a sophisticated cultural teahouse, making it an ideal venue to experience the aesthetics of light and glass.", "name": "Liuli China Museum", "transport": "Take Metro Line 9 to Dapuqiao Station, Exit 1, and walk for about 3 minutes."}, {"address": "No. 3 Baoqing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.8 stars | Set inside a beautiful garden villa on Baoqing Road\u2014formerly the private estate of \u0027Dye King\u0027 Zhou Zongliang\u2014this museum provides a comprehensive look at the history of the Shanghai Symphony Orchestra and modern Chinese symphonic music through rare documents, antique instruments, and interactive multimedia. The lush grounds and high-tech acoustic experience zones allow visitors to enjoy an immersive blend of music and historic architecture.", "name": "Shanghai Symphony Museum", "transport": "Take Metro Line 1 or 7 to Changshu Road Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 16 Gaolan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.4 stars | Built in 1934, St. Nicholas Church is a landmark historic building featuring rich Russian Orthodox architecture, complete with iconic onion domes and exquisite brick carvings. Having served various purposes over decades, it has been revitalized into the \u0027Sinan Books Poetry Store\u0027. The interior uses metallic structures and artistic lighting beneath the church dome to create a sanctuary of literature, effortlessly blending sacred solemnity with poetic modern design. It stands as a unique cultural landmark in the Former French Concession.", "name": "St. Nicholas Church", "transport": "Take Metro Line 13 to Middle Huaihai Road Station, Exit 3, and walk for about 7 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.6 Stars | Fuxing Park is the only park in Shanghai that retains a classical French garden style, built in the early 20th century. The park features a vast central lawn, exquisite geometric flowerbeds, fountains, and an elegant avenue of plane trees. Formerly known as \u0027Gu\u0027s Garden\u0027 under the French Concession authorities, it exudes a rich French romantic charm. Today, it is a wonderful spot where locals do morning exercises, dance square dances, play instruments, and visitors stroll around to experience the leisurely pace of old Shanghai.", "name": "Fuxing Park", "transport": "About a 5-minute walk from Exit 1 of Middle Huaihai Road Station, Metro Line 13"}, {"address": "No. 1008 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Situated at the bustling intersection of Middle Huaihai Road and North Xiangyang Road, Xiangyang Park was formerly known as \u0027Lanying Garden\u0027 in the French Concession. Compact yet elegantly designed, the park boasts beautiful French-style trellises, towering ancient trees, and seasonal floral displays. A peaceful oasis amidst the city bustle, it is a favorite spot for locals to play chess, sip tea, and chat, embodying the unique civic lifestyle and historical heritage of the former French Concession.", "name": "Xiangyang Park", "transport": "About a 3-minute walk from Exit 2 of South Shaanxi Road Station, Metro Lines 1, 10, and 12"}, {"address": "No. 830 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Located at the corner of Hengshan Road and Guangyuan Road, surrounded by plane trees, Hengshan Park is a historic, pocket-sized urban park. Centered around three massive centennial camphor trees, it offers lush shade, a tranquil environment, and a white marble statue of Mr. Shen Junru. Framed by typical French plane tree avenues and historic garden villas, it is a delightful place to rest and take a breath of fresh air while exploring the French Concession architecture along Hengshan Road.", "name": "Hengshan Park", "transport": "About a 5-minute walk from Exit 13 of Xujiahui Station, Metro Lines 1, 9, and 11"}, {"address": "No. 889 Zhaojiabang Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Located at the western end of the former French Concession, Xujiahui Park covers a vast area with rich ecological features. Designed after the Huangpu River water system, an artificial stream runs through the park. It preserves historical elements like the tall chimney of the former Great China Rubber Factory and the \u0027Little Red House\u0027, former site of EMI Studios. Elevated scenic walkways allow visitors to stroll through the dense tree canopy, while black swans glide gracefully on the lake. It is an urban forest park that seamlessly blends industrial heritage with natural beauty.", "name": "Xujiahui Park", "transport": "About a 3-minute walk from Exit 14 of Xujiahui Station, Metro Lines 1, 9, and 11"}, {"address": "No. 29 Shaoxing Road, Huangpu District, Shanghai", "feature": "\u2b50 4.3 Stars | Tucked away on Shaoxing Road\u2014known as the \u0027Publishing Street\u0027\u2014Shaoxing Park is one of the smallest yet most exquisitely crafted Jiangnan-style gardens in Shanghai. Cleverly utilizing rockeries, stacked stones, small bridges over flowing water, and bamboo groves, it maximizes space in a masterpiece of compact design. Listening to the gurgling springs and admiring the dark green moss and traditional pavilions reveals the hidden, refined literary atmosphere nestled within the lanes of the old French Concession.", "name": "Shaoxing Park", "transport": "About a 10-minute walk from Exit 1 of Dapuqiao Station, Metro Line 9"}, {"address": "Near No. 300 Hengshan Road, Xuhui District, Shanghai", "feature": "\u2b50 4.2 Stars | Situated at the intersection of Hengshan Road and Wuxing Road, Libo Garden was originally a private garden villa in the former French Concession. Now, its boundary walls have been opened up to welcome the public. The garden retains several historic centennial trees, rolling green lawns, smooth stone pathways, and ornate wrought-iron fences. With its serene atmosphere and deep sense of history, it is a hidden green haven perfect for experiencing the peaceful charm of the French Concession\u0027s tree-lined streets.", "name": "Libo Garden", "transport": "About a 6-minute walk from Exit 3 of Shanghai Library Station, Metro Line 10"}, {"address": "No. 849 Huashan Road, Changning District, Shanghai", "feature": "\u2b50 4.5 Stars | Dingxiang Garden is one of the best-preserved private villa gardens in Shanghai, rumored to have been the private residence of late Qing Dynasty statesman Li Hongzhang. The garden blends English-style expansive lawns with traditional Chinese garden elements such as glazed dragon walls, pavilions, and waterside kiosks. Surrounded by towering ancient trees and fragrant lilacs in bloom, it beautifully showcases the fusion of Eastern and Western garden design in modern Shanghai, transporting visitors back to the golden era of French Concession private estates.", "name": "Dingxiang Garden", "transport": "About a 12-minute walk from Exit 7 of Chiao Tung University Station, Metro Lines 10 and 11"}, {"address": "No. 1500 Huashan Road, Changning District, Shanghai", "feature": "\u2b50 4.4 Stars | Located at the intersection of Huashan Road and Xingguo Road, Huashan Green Space is a large open green area functioning as an urban oxygen bar. It features dense groves of camphor and metasequoia trees, vast open lawns, sleek wooden boardwalks, and a peaceful artificial lake. Shaded by abundant greenery and filled with fresh air, it seamlessly brings a natural forest feel into the historic neighborhood of the old French Concession, making it an ideal destination for jogging, picnics, and relaxation.", "name": "Huashan Green Space", "transport": "About an 8-minute walk from Exit 1 of Chiao Tung University Station, Metro Lines 10 and 11"}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 1850 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | Built in 1924, the Wukang Building is the most iconic landmark in the Former French Concession. Designed by renowned architect L\u00e1szl\u00f3 Hudec, it showcases a classic French Renaissance flatiron-style architecture. Standing dramatically at the intersection of five roads, its unique wedge shape makes it an absolute must-visit destination for photography enthusiasts and culture lovers, surrounded by exquisite cafes and artisanal boutiques.", "name": "Wukang Building (Normandy Apartments)", "transport": "Metro Lines 10 or 11, Chiao Tung University Station, Exit 7; approx. 5-minute walk"}, {"address": "Anfu Road (between Changshu Road and Wukang Road), Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Hailed as one of Shanghai\u0027s trendiest streets, Anfu Road captures the essence of contemporary Shanghainese lifestyle. This tree-lined avenue is filled with independent boutiques, specialty cafes, the Shanghai Dramatic Arts Centre, and flagship beauty stores. Exuding chic vibes and romance, it attracts countless street-style influencers and trendsetters every weekend.", "name": "Anfu Road", "transport": "Metro Lines 1 or 7, Changshu Road Station, Exit 8; approx. 8-minute walk"}, {"address": "No. 55 Sinan Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Sinan Mansions is the only historic district in downtown Shanghai preserved as an integrated collection of garden villas, row houses, and veranda apartments. Brimming with romantic French flair, it regularly hosts Sinan Books events, open-air concerts, and creative markets, seamlessly blending rich history with vibrant modern arts culture.", "name": "Sinan Mansions", "transport": "Metro Lines 10 or 13, South Huangpi Road Station or Xintiandi Station; approx. 10-minute walk"}, {"address": "No. 1331 Middle Fuxing Road, Xuhui District, Shanghai", "feature": "\u2b50 4.4 Stars | Built in 1924, the Blackstone Apartments is a nearly century-old Eclectic-style building named after its black stone foundation. Revitalized into a high-end creative hub, it houses \u0027Mix-Paper\u0027 (frequently dubbed one of the most beautiful bookstores), sophisticated bistros, and a vinyl listening space. Its classic Baroque curved facades and elegant arches make it a viral social media hotspot.", "name": "Blackstone Apartments", "transport": "Metro Lines 1 or 7, Changshu Road Station, Exit 1; approx. 6-minute walk"}, {"address": "Yongkang Road (between South Xiangyang Road and Taiyuan Road), Xuhui District, Shanghai", "feature": "\u2b50 4.3 Stars | Successfully transformed from a former nightlife street into a refined specialty coffee haven, Yongkang Road stretches only a few hundred meters yet is packed with artisanal cafes, French bakeries, and boutique shops. Strolling under the shade of plane trees with a specialty pour-over coffee offers the quintessential taste of the relaxed, slow-paced lifestyle of the Former French Concession.", "name": "Yongkang Road", "transport": "Metro Lines 1, 10, or 12, South Shaanxi Road Station, Exit 7; approx. 8-minute walk"}, {"address": "No. 105 Yandang Road, Huangpu District, Shanghai", "feature": "\u2b50 4.5 Stars | Fuxing Park is the only park in Shanghai preserving a classic French landscape design, formerly known as French Park. Featuring symmetrical flowerbeds, manicured lawns, fountains, and elegant sunken gardens, you\u0027ll find locals doing morning exercises here, while afternoons attract young visitors taking photos, showcasing a serene French aesthetic.", "name": "Fuxing Park", "transport": "Metro Lines 10 or 13, South Huangpi Road Station or Xintiandi Station; approx. 8-minute walk"}, {"address": "No. 1843 Middle Huaihai Road, Xuhui District, Shanghai", "feature": "\u2b50 4.7 Stars | This elegant French-style villa with red tiles and white walls served as the primary residence of Madame Soong Ching-ling. The interior of the main mansion retains its original furnishings, surrounded by lush evergreen camphor trees that create a serene atmosphere. Beyond immersing yourself in history, the sweeping front lawn and gardens offer a stunning backdrop capturing authentic French Concession charm.", "name": "Soong Ching Ling Memorial Residence", "transport": "Metro Lines 10 or 11, Chiao Tung University Station, Exit 1; approx. 3-minute walk"}, {"address": "No. 480 West Jianguo Road, Xuhui District, Shanghai", "feature": "\u2b50 4.6 Stars | Originally built in the 1930s, Jianye Li is Shanghai\u0027s largest intact historical complex of red-brick Shikumen architecture. Meticulously restored into a luxury heritage hotel and upscale retail hub, it blends traditional Shanghainese \u0027Longtang\u0027 alleyway culture with French elegance. Its grand red-brick walls and stepped gables provide a magnificent backdrop for vintage chic photo shoots.", "name": "Jianye Li", "transport": "Metro Lines 7 or 9, Zhaojiabang Road Station, Exit 2; approx. 7-minute walk"}], "name": "Top Photo Spots"}}, "name": "Shanghai French Concession"}, "lujiazui": {"categories": {"cat_1": {"items": [{"address": "No. 1 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Standing at approximately 468 meters at the tip of Lujiazui in Pudong, the Oriental Pearl Radio \u0026 Television Tower is Shanghai\u0027s most iconic landmark and the heart of its skyline. Completed in 1995, this architectural marvel blends modern technology with Oriental aesthetics, inspired by the poetic imagery of \"large and small pearls falling onto a jade plate.\" It consists of 11 spheres of varying sizes connected together. Inside, visitors can enjoy a 360-degree panoramic observation deck, a transparent glass skywalk, a revolving restaurant, and the Shanghai History Museum at its base\u2014offering not only breathtaking views of both sides of the Huangpu River but also deep insights into Shanghai\u0027s transformation from a sleepy fishing village into a global metropolis.", "name": "Oriental Pearl Radio \u0026 Television Tower", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk for about 3 minutes."}, {"address": "No. 479 Lujiazui Ring Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | Soaring at a height of 632 meters with 128 floors, Shanghai Tower is currently the tallest building in China and the second-tallest in the world. Its unique spiraling double-skin glass facade showcases cutting-edge architectural engineering and eco-friendly design, effectively reducing wind loads. On the 118th floor lies the \"Top of Shanghai Observatory,\" accessible via ultra-fast elevators that reach the summit in just 55 seconds. From over 1,000 feet in the air, visitors can soak in stunning panoramic views of the Lujiazui skyscraper cluster and the shimmering Huangpu River, making it an absolute must-visit to experience Shanghai\u0027s modern architectural wonders.", "name": "Shanghai Tower", "transport": "Take Metro Line 2 or 14 to Lujiazui Station, and walk for about 8 minutes via the underground passage or above ground."}, {"address": "No. 88 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Completed in 1999 and standing at 420.5 meters, Jin Mao Tower is one of Lujiazui\u0027s earliest iconic supertall skyscrapers. Its exterior design cleverly incorporates the silhouette of a traditional Chinese 13-story pagoda, seamlessly blending classical Oriental charm with Western steel-frame engineering. The 88th-floor observation deck features a thrilling outdoor glass skywalk experience with no handrails called \"Skywalk.\" Inside, a breathtaking spiral atrium stretching from the 56th to the 87th floor is famously known as the \"Time-Space Tunnel,\" delivering an unforgettable visual impact.", "name": "Jin Mao Tower", "transport": "Take Metro Line 2 or 14 to Lujiazui Station (Exit 6) and walk for about 5 minutes."}, {"address": "No. 100 Century Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 Stars | Reaching a height of 492 meters across 101 floors, the Shanghai World Financial Center is affectionately nicknamed \"The Bottle Opener\" due to the distinctive trapezoidal aperture at its peak. This multi-purpose skyscraper houses offices, hotels, and viewing decks on the 94th, 97th, and 100th floors. The 100th-floor \"Sky Walk 55\" features a 55-meter-long glass skybridge that makes visitors feel as though they are walking above the clouds. From here, you can gaze up close at the neighboring Jin Mao Tower and Shanghai Tower, immersing yourself in the magnificent grand scale of Lujiazui\u0027s skyscraper trio.", "name": "Shanghai World Financial Center", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk for about 10 minutes."}, {"address": "No. 1777 Riverside Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 Stars | Tracing its roots back to the Xiangsheng Shipyard built in 1862, Shipyard 1862 boasts over a century of industrial heritage. Spearheaded by world-renowned Japanese architect Kengo Kuma, the revitalization of this abandoned shipyard preserved original steel frame structures, weathered brick walls, and vintage piping while seamlessly integrating modern brickwork screens and geometric steel elements. Today, it stands as a model of industrial heritage adaptive reuse\u2014housing a trendy theater, art exhibitions, fine dining, and retail space that showcase the harmonious blend of Shanghai\u0027s modern industrial past and contemporary architectural art.", "name": "Shipyard 1862", "transport": "Take Metro Line 14 to Pudong Avenue Station and walk for about 10 minutes."}, {"address": "No. 15 East Lujiazui Road (inside Lujiazui Central Green Space), Pudong New Area, Shanghai", "feature": "\u2b50 4.4 Stars | Built in 1917 as the private residence of Chen Guichun, a prominent merchant of modern Shanghai\u0027s Haipai culture, Yingchuan Xiaozhu is one of the very few fully preserved historic traditional structures in Lujiazui\u0027s financial core. The architecture beautifully fuses Jiangnan carved residences with Hui-style architectural traditions, reflecting craftsmanship from both the Qing Dynasty and the Republic of China era. Now functioning as the Shanghai Wu Changshuo Memorial Hall, it displays calligraphy and paintings by the Haipai master Wu Changshuo. Strolling through this traditional Chinese courtyard surrounded by soaring skyscrapers offers a striking contrast of time and rich historical depth.", "name": "Yingchuan Xiaozhu / Shanghai Wu Changshuo Memorial Hall", "transport": "Take Metro Line 2 to Lujiazui Station (Exit 1) and enter the Lujiazui Central Green Space to reach the hall."}, {"address": "No. 2777 Riverside Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 Stars | Occupying a prime spot along the Lujiazui waterfront, the Museum of Art Pudong was designed by Pritzker Prize-winning French architect Jean Nouvel. Clad in sleek, elegant white granite, the building features a massive \"Glass Hall\" facade facing the Huangpu River and The Bund, reflecting the century-old historic architecture across the river like a stunning mirror painting. The museum\u0027s interior offers geometric simplicity and airy transparency, standing as a contemporary architectural masterpiece in its own right\u2014a brilliant cultural landmark along the Huangpu River.", "name": "Museum of Art Pudong", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk for about 8 minutes towards Riverside Avenue."}, {"address": "No. 2727 Riverside Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.3 Stars | Situated on the waterfront of Lujiazui facing the historic Bund across the river, the Shanghai International Convention Center opened in 1999. Its most distinctive feature is a pair of massive blue glass globes symbolizing the \"Earth\" echoing the \"Pearl of the East,\" making it instantly recognizable. Having hosted major global events such as the APEC Leaders\u0027 Meeting, the center features a grand column-free ballroom and exquisite murals inside. It remains an indispensable and classic icon of Lujiazui\u0027s riverfront skyline.", "name": "Shanghai International Convention Center", "transport": "Take Metro Line 2 or 14 to Lujiazui Station and walk for about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 2777 Binjiang Avenue, Pudong New Area, Shanghai", "feature": "\u2b50 4.7 stars | Located in the core riverside area of Lujiazui, designed by famous French architect Jean Nouvel. Featuring a minimalist and grand exterior, its interior houses the famous \u0027Hall of Mirrors\u0027, which brilliantly reflects the Huangpu River and the historic Bund architecture like a living painting. Partnering deeply with top global institutions like the UK\u0027s Tate, it exhibits world-class masterpieces year-round, making it one of Shanghai\u0027s most anticipated new cultural landmarks.", "name": "Museum of Art Pudong (MAP)", "transport": "Metro Line 2 Lujiazui Station Exit 2, approx. 10-min walk"}, {"address": "No. 99 Fucheng Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.6 stars | Situated along the Huangpu River, renovated by renowned Japanese architect Tadao Ando. The museum features a dazzling golden glass curtain wall that resembles a jewelry box, while its multi-story interior spiral staircase exhibits striking geometric beauty. Housing a rich collection of ancient Chinese art\u2014including bronzes, pottery figurines, jades, and Buddhist statues\u2014it combines exquisite architectural aesthetics with deep historical heritage.", "name": "Aurora Museum", "transport": "Metro Line 2 Lujiazui Station Exit 1, approx. 8-min walk"}, {"address": "37th Floor, Shanghai Tower, No. 501 Yincheng Middle Road, Pudong New Area, Shanghai", "feature": "\u2b50 4.5 stars | Located on the 37th floor of Shanghai Tower, this is China\u0027s first high-altitude private museum
