Guangdong Province", "feature": "\u2b50 4.3 stars | The pedestrian walkway and platform on the south end of Guangzhou Bridge are a secret haven for photography enthusiasts capturing the full panorama of Canton Tower. From here, you can frame Canton Tower alongside the bustling traffic on the bridge and the towering skyscrapers of Zhujiang New Town. During golden hour, the sunset reflecting off the river combined with the tower\u0027s evening light show creates stunningly vibrant and layered cityscape photos.", "name": "Guangzhou Bridge South Viewpoint", "transport": "Take Guangzhou Metro Line 3 to \u0027Kecun Station\u0027 or \u0027Canton Tower Station\u0027 and walk for about 12 minutes."}, {"address": "Pearl Riverfront, No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Located at the base of Canton Tower along the Pearl River, this dock serves as a major boarding point for the famous Pearl River Night Cruise. The waterfront platform offers wide-open views and an awe-inspiring perspective looking straight up at the tower. At night, sparkling cruise ships on the water contrast beautifully with the shore\u0027s dazzling city lights, making it a dreamy spot for urban romantic photography whether you\u0027re on the dock or cruising the river.", "name": "Canton Tower Wharf", "transport": "Take Guangzhou Metro Line 3 to \u0027Canton Tower Station\u0027, Exit A, and walk about 3 minutes to the riverbank."}, {"address": "Inside the park on the west side of Chigang New Village, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.2 stars | Built during the Wanli era of the Ming Dynasty, Chigang Tower is a 400-year-old octagonal brick pagoda. Situated close to the ultra-modern Canton Tower, it creates a unique sight where ancient history and futuristic architecture share the same frame. Strolling around the surrounding garden park, you can capture breathtaking photos with the historic Ming pagoda in the foreground and the soaring Canton Tower in the background, bridging centuries in a single shot.", "name": "Chigang Tower", "transport": "Take Guangzhou Metro Line 3 to \u0027Canton Tower Station\u0027, Exit B, and walk for about 8 minutes."}, {"address": "No. 168 Xinjiao Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Known as Guangzhou\u0027s \u0027Green Heart in the City Center\u0027, this expansive national wetland park is just a short drive from Canton Tower. It features vast orchards, meandering waterways, and rich foliage with blooming flower fields across all seasons. A favorite photo spot is looking across the lush lakes and flowers toward Canton Tower in the distance, capturing a dramatic contrast between raw nature and futuristic architecture\u2014a peaceful haven for aesthetic nature photography.", "name": "Haizhu National Wetland Park", "transport": "Take Guangzhou Metro Line 3 to \u0027Datang Station\u0027, Exit B, and walk for about 10 minutes."}], "name": "Popular Photo Spots"}}, "name": "Canton Tower and Haizhu Riverside Arts and Culture District"}, "huadu_sunac": {"categories": {"cat_1": {"items": [{"address": "Inside Sunac Resort, No. 78 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Located in the heart of Sunac Resort, the Guangzhou Sunac Grand Theatre was crafted by a top international architectural team inspired by traditional Lingnan \u0027silk\u0027 and \u0027paper-cutting art\u0027. The exterior features a visually stunning dynamic red silk wall, with smooth curves showcasing the ultimate fusion of modern architectural craftsmanship and traditional cultural symbols. Inside, the theatre is equipped with world-class stage technology and top-tier sound systems. It is not only the most iconic modern landmark in Sunac Resort, but also a sanctuary showcasing Guangzhou\u0027s contemporary architectural aesthetics and performing arts culture.", "name": "Guangzhou Sunac Grand Theatre", "transport": "Take Guangzhou Metro Line 9 to \u0027Huadu Square Station\u0027 Exit A, then transfer to Bus Hua 6 or Hua 19 and get off at \u0027Sunac Resort Station\u0027."}, {"address": "Next to National Highway 107, Sanhua Village, Xinhua Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Built during the Tongzhi reign of the Qing Dynasty, the Ancestral Hall of Zizheng Dafu is the largest and best-preserved traditional Qing Dynasty Lingnan ancestral hall complex in Huadu District. The complex consists of magnificent ancient structures including the Zizheng Dafu Ancestral Hall, Shuixian Ancient Temple, Hengzhi Xu Ancestral Hall, and Shuiju Xu Ancestral Hall. Designed in a traditional three-entry, three-route layout, it features exquisite \u0027Four Crafts of Lingnan\u0027\u2014grey plaster mold, brick carving, wood carving, and stone carving\u2014vividly showcasing the peak of Qing Dynasty Lingnan architectural art. The spacious garden and tranquil pond in front of the hall reflect each other, offering immense historical and aesthetic value.", "name": "Ancestral Hall of Zizheng Dafu", "transport": "Take Guangzhou Metro Line 9 to \u0027Guangzhou North Railway Station\u0027, then transfer to Bus Hua 9 or Hua 39 and get off at \u0027Ancestral Hall of Zizheng Dafu Station\u0027."}, {"address": "Langtou Village, Tanbu Town, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 stars | Founded in the Yuan Dynasty, Langtou Ancient Village is a national historic and cultural village with a history of nearly 700 years. Hundreds of traditional Ming and Qing Lingnan buildings are perfectly preserved here, highlighted by continuous, majestic \u0027wok-handle walls\u0027 (huoer walls). The village layout is meticulous, featuring slate-paved streets and a crescent-shaped pond surrounding the village, presenting a classic water town landscape of \u0027gable walls reaching the clouds, blue bricks, and black tiles\u0027. In recent years, the Chunyangtai Arts Center was introduced, seamlessly blending historical heritage with contemporary design aesthetics and turning it into a refined cultural landmark in Guangzhou.", "name": "Langtou Ancient Village", "transport": "Take Guangzhou Metro Line 9 to \u0027Fei\u0027eling Station\u0027, then transfer to Bus Hua 15 and get off at \u0027Langtou Village Station\u0027."}, {"address": "No. 38 Yingbin Avenue West, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Yuanxuan Taoist Temple is a magnificent ancient complex combining traditional Taoist architectural art and grand garden landscapes, often hailed as the \u0027Yellow Crane Tower of Northern Guangzhou\u0027. Its most eye-catching landmark is the \u0027Sanqing Hall\u0027, modeled after the Hall of Prayer for Good Harvests at Beijing\u0027s Temple of Heaven, boasting a magnificent and resplendent design. Built along the mountain slope, the entire complex strictly follows a symmetric central axis, featuring layered halls, upturned eaves, and lifelike murals and stone carvings. Lush green gardens and winding corridors over water create a serene atmosphere, exemplifying classical architecture and Taoist aesthetics at the highest level.", "name": "Yuanxuan Taoist Temple", "transport": "Take Guangzhou Metro Line 9 to \u0027Huadu Square Station\u0027, then transfer to Bus Hua 26 or Hua 2 and get off at \u0027Yuanxuan Taoist Temple Station\u0027."}, {"address": "Guanlubu Village, Xiuquan Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Located in Guanlubu Village, Huadu District, this was the birthplace and childhood home of Hong Xiuquan, leader of the Taiping Heavenly Kingdom movement in the late Qing Dynasty. The residence is a typical mid-19th-century Lingnan rural home with mud bricks and blue tiles, featuring a simple and rustic structure that preserves the original appearance of traditional countryside life. A memorial hall on site displays historical relics and artifacts related to the Taiping Rebellion. Surrounded by ancient wells and centennial longan trees, the serene residence offers a profound sense of historical depth and cultural heritage.", "name": "Former Residence of Hong Xiuquan", "transport": "Take Guangzhou Metro Line 9 to \u0027Huacheng Lu Station\u0027, then transfer to Bus Hua 21 directly to \u0027Former Residence of Hong Xiuquan Station\u0027."}, {"address": "Luochang Village, Huashan Town, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Centered in Luochang Village, the Huashan Diaolou Group is Guangzhou\u0027s most concentrated historic architectural complex showcasing a blend of Chinese and Western styles. Built mostly in the early Republic of China era by overseas Chinese returning to their hometown, these watchtowers perfectly fuse traditional Lingnan blue-brick walls with Western Baroque and Gothic decorative details. Each tower is tall and sturdy, designed for both defense and living, and decorated with delicate plasterwork, Roman columns, and arched windows. Strolling through the ancient alleys offers a unique glimpse into the collision of century-old overseas Chinese history and cross-cultural architectural artistry.", "name": "Huashan Diaolou Group", "transport": "Take Guangzhou Metro Line 9 to \u0027Ma\u0027anshan Park Station\u0027, then transfer to Bus Hua 4 or Hua 17 and get off at \u0027Luochang Village Station\u0027."}, {"address": "Gangtou Village, Huadong Town, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Gangtou Ancient Village is an exceptionally well-preserved Ming and Qing dynasty Lingnan village surrounded by water on three sides and backed by green hills, forming an ideal traditional Feng Shui layout. The village contains numerous Qing Dynasty wok-handle wall houses, ancestral halls, private academies, and ancient wells, constructed with granite foundations and blue brick walls featuring intricate carvings. Famous for its picturesque water village scenery where three rivers meet, the crescent pond reflects the ancient ancestral halls in front. Revitalized through contemporary art projects in recent years, this historic sanctuary shines anew as a hidden gem for photography and architecture enthusiasts.", "name": "Gangtou Ancient Village", "transport": "Take Guangzhou Metro Line 3 to \u0027Airport North Station\u0027, then take a taxi for about 15 minutes to reach Gangtou Ancient Village."}, {"address": "Panguwang Road, Shiling Town, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Located at the foot of Panguwang Mountain in Shiling Town, Huadu, Pangu Temple is an iconic, historic landmark for folk belief and creation mythology in the Lingnan region. Built during the Jiaqing reign of the Qing Dynasty and renovated multiple times, it displays a solemn Lingnan Taoist architectural style. Built along the mountain slope with green tiles and flying eaves, the temple worships Pangu, the creator god of Chinese mythology. Inside, exquisite wood carvings, stone carvings, and painted artwork reflect vibrant local folk customs. The annual Pangu Festival on the 16th day of the 10th lunar month fills this ancient temple with lively cultural vitality.", "name": "Pangu Temple", "transport": "Take Guangzhou Metro Line 9 to \u0027Guangzhou North Railway Station\u0027, then transfer to Bus Hua 23 or Hua 63 and get off at \u0027Panguwang Park Station\u0027."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Xiuquan Park, No. 52 Xiuquan Avenue, Xinhua Street, Huadu District, Guangzhou", "feature": "\u2b50 4.5 stars | Located inside Xiuquan Park in Huadu District, the Hong Xiuquan Memorial Hall is a specialized museum built to commemorate Hong Xiuquan, the leader of the Taiping Heavenly Kingdom peasant uprising. The hall exhibits a vast array of precious historical relics, documentations, replicas, large-scale historical murals, and 3D dioramas, vividly recreating the complete historical journey of the Taiping Rebellion from its inception to its expansion. The building features an elegant Lingnan garden style with clearly organized exhibition halls. Offering immense historical, educational, and artistic value, it is a key cultural landmark for understanding modern Chinese history.", "name": "Hong Xiuquan Memorial Hall", "transport": "Take Guangzhou Metro Line 9 to Guangzhou North Railway Station, and walk for about 10 minutes, or transfer to Bus Hua 4 directly to the park."}, {"address": "Next to National Highway 107, Sanhua Village, Xinhua Street, Huadu District, Guangzhou", "feature": "\u2b50 4.6 stars | Built during the Tongzhi reign of the Qing Dynasty, Zizheng Dafu Shrine is one of the largest and best-preserved Qing ancestral hall complexes in Guangzhou. The complex includes the Zizheng Dafu Shrine, Shuixian Ancient Temple, and Hengzhi Xu Ancestral Hall, showcasing exquisite Lingnan brick, wood, stone carving, and lime sculpture arts. Now repurposed as the Huadu Folk Museum, it features permanent exhibitions on traditional Huadu wedding customs, Lingnan Guangcai porcelain, Cantonese embroidery, and gray plaster craft. Revealing centuries of Lingnan folk lifestyle and craftsmanship aesthetics, it is a magnificent sanctuary for experiencing traditional Guangzhou culture.", "name": "Zizheng Dafu Shrine Complex \u0026 Huadu Folk Museum", "transport": "Take Guangzhou Metro Line 9 to Huadu Square Station, then transfer to Bus Hua 9 or Hua 19 to Zizheng Dafu Shrine Station."}, {"address": "Inside Sunac Cultural Tourism City, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.3 stars | Located within the central commercial corridor of Huadu Sunac Cultural Tourism City, this non-material cultural heritage art space combines modern interactive technology with traditional Lingnan architectural style to showcase Guangdong\u0027s intangible cultural heritage. The exhibition displays exquisite items including Guangcai porcelain art, Cantonese embroidery, wood carvings, and Lion Dance cultural artifacts, alongside live artisan demonstrations and hands-on DIY workshops. Visitors can enjoy an immersive experience with Lingnan arts and crafts after exploring Snow World or the theme park, making it both visually captivating and educational.", "name": "Sunac Cultural Tourism City Lingnan Intangible Cultural Heritage Exhibition Zone", "transport": "Take the Guangqing Intercity Railway directly to Huachengjie Station; or take Metro Line 9 to Ma\u0027anshan Park Station and transfer to Bus Hua 19 or Hua 6."}, {"address": "Guanlubu Village, Xiuquan Street, Huadu District, Guangzhou", "feature": "\u2b50 4.4 stars | Located in Guanlubu Village, Xiuquan Street, Huadu District, the Former Residence of Hong Xiuquan is a national key cultural relic protection unit. The spacious memorial museum grounds preserve the mud-brick and gray-tiled house where Hong Xiuquan spent his early years, as well as a longan tree and a well dug by his own hands, complemented by a grand newly built exhibition hall. Featuring rich graphics, artifacts, wax figures, and multimedia installations, the museum comprehensively presents Hong Xiuquan\u0027s life story and ideological evolution. Set amidst rustic gardens and countryside charm, it offers exceptional historical, cultural, and architectural appreciation value.", "name": "Former Residence of Hong Xiuquan Memorial Museum", "transport": "Take Guangzhou Metro Line 9 to Huadu Auto City Station, then transfer to Bus Hua 21 or Hua 27 to Former Residence of Hong Xiuquan Station."}, {"address": "Near Yingbin Avenue, Baohua Road, Xinhua Street, Huadu District, Guangzhou", "feature": "\u2b50 4.2 stars | Huadu Catholic Church is an important religious landmark and a standout example of Western architectural art in Huadu District. Its exterior combines Gothic steeples with a towering cross design and clean wall lines, while the interior features vibrant stained-glass windows and a solemn main altar. When sunlight streams through the colorful glass into the hall, it creates a breathtaking interplay of light and shadow. Beyond being a sacred place for local Catholics, it is a tranquil spot for architecture enthusiasts and photography lovers to appreciate Gothic aesthetics.", "name": "Huadu Catholic Church (Sacred Heart Church Huadu)", "transport": "Take Guangzhou Metro Line 9 to Huaguoshan Park Station, then walk for about 12 minutes from the exit or take a short taxi ride."}, {"address": "No. 38 Yingbin Avenue West, Xinhua Street, Huadu District, Guangzhou", "feature": "\u2b50 4.7 stars | Yuanxuan Taoist Temple is a magnificent Taoist cultural and Lingnan architectural complex in Guangzhou. The majestic Sanqing Hall is modeled after the Circular Mound Altar of Beijing\u0027s Temple of Heaven, featuring golden roof tiles, red beams, and intricate stone carvings and paintings. The grounds also house a Taoist Culture Museum, Rare Stone Hall, and Chinese Culture Exhibition Hall, displaying Taoist ritual instruments, artwork, classical furniture, and rare stones. Strolling through the elevated pavilions, quiet corridors, and serene ponds offers a profound appreciation of Chinese classical architecture combined with Taoist philosophy.", "name": "Yuanxuan Taoist Temple Architectural \u0026 Cultural Complex", "transport": "Take Guangzhou Metro Line 9 to Huadu Square Station, then transfer to Bus Hua 9, Hua 26, or Hua 2 to Yuanxuan Taoist Temple Station."}, {"address": "Inside Huadu Cultural Center, No. 36 Gongyi Road, Huadu District, Guangzhou", "feature": "\u2b50 4.1 stars | The Art Exhibition Hall of Huadu Cultural Center is a key hub promoted by the local government for contemporary art and local cultural exchange. The bright, spacious gallery hosts regular contemporary calligraphy and painting exhibits, photography shows, intangible heritage craft displays, and folk art special exhibitions. Frequently inviting outstanding artists from Guangdong and across China, it serves as an important showcase for local artistic innovation. With excellent lighting and modern display design, it offers citizens and travelers an enriching cultural space.", "name": "Huadu Cultural Center \u0026 Art Exhibition Hall", "transport": "Take Guangzhou Metro Line 9 to Huadu Square Station Exit A, then walk for about 800 meters."}, {"address": "Inside Stone Manor Park, No. 1 Dahua 1st Road, Dabu Village, Xiuquan Street, Huadu District, Guangzhou", "feature": "\u2b50 4.3 stars | Located within the Huadu Jewelry Town industrial zone, the Guangzhou Huadu Gemstone \u0026 Mineral Art Museum is a specialized museum dedicated to geological oddities, gemstone carving art, and ornamental stone culture. The collection features rare stones, natural crystals, jadeite carvings, and rare fossil specimens from across China and around the world. Blending natural geological wonders with human craftsmanship, the ingenious display cases and lighting highlight nature\u0027s miraculous creations alongside master craftsmanship, making it an excellent destination for learning about gemstone art and geology.", "name": "Guangzhou Huadu Gemstone \u0026 Mineral Art Museum", "transport": "Take Guangzhou Metro Line 9 to Huadu Auto City Station, then transfer to Bus Hua 9 or Hua 21 to Stone Manor Station."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "East End of Shangye Avenue, Xinhua Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.6 stars | Huadu Lake National Wetland Park is a rare national-level wetland park in Guangzhou, combining Lingnan water town charm with modern garden design. The park features breathtaking scenery where sparkling lakes meet lush hills, complete with a lakeside greenway, Peach Blossom Bay, Lingnan-style garden architecture, and vibrant wetland ecosystems. It is a fantastic spot for locals and tourists to stroll, cycle, enjoy flower blossoms, and birdwatch while soaking in nature\u0027s tranquility and fresh air.", "name": "Huadu Lake National Wetland Park", "transport": "Take Metro Line 9 to Liantang Station (Exit C), then walk for about 10 minutes."}, {"address": "Inside Guangzhou Sunac Cultural Tourism City, No. 73 Fenghuang North Road, Huacheng Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.3 stars | Located in the core area of Guangzhou Sunac Cultural Tourism City, this lakeside park is built around a scenic waterfront belt. It offers open water views and beautifully landscaped greenery. At night, visitors can admire the dazzling lights of landmark buildings and spectacular water shows. It\u0027s an ideal place to unwind, take photos, and go for a stroll after visiting the Snow Park or Theme Park.", "name": "Sunac Cultural Tourism City Lake Park", "transport": "Take Bus Hua 76A or Hua 6 to Sunac Cultural Tourism City Station."}, {"address": "Intersection of Yingbin Avenue and Baishou Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.4 stars | Ma\u0027anshan Park is a famous hilly urban park in central Huadu District, named for its mountain shape that resembles a saddle. Rich in lush vegetation and shade trees, the park features well-maintained ridge trails, a hilltop viewing platform, and recreational plazas. Climbing to the top offers panoramic views of the bustling new Huadu cityscape, making it a popular spot for morning workouts and reconnecting with nature.", "name": "Ma\u0027anshan Park", "transport": "Take Metro Line 9 to Ma\u0027anshan Park Station (Exit C), which leads directly to the park entrance."}, {"address": "No. 37 Gongyi Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.2 stars | Huadu People\u0027s Park is a historic and highly representative comprehensive civic park in Huadu. It boasts expansive lawns, scenic lakes, winding corridors, and various fitness facilities. Elegant and peaceful with flowers blooming year-round, it exudes a strong sense of local lifestyle, making it a wonderful place to experience slow-paced living and enjoy a leisure walk.", "name": "Huadu People\u0027s Park", "transport": "Take Metro Line 9 to Huaguoshan Park Station (Exit A), then walk about 850 meters."}, {"address": "No. 1 Wangzishan Road, Timian Town, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Located in the northern mountainous area of Huadu District, Prince Mountain Forest Park boasts well-preserved secondary virgin forests and rich wildlife resources. Surrounded by rolling green peaks, it offers exceptionally high negative oxygen ion levels, earning it the reputation as Huadu\u0027s \u0027natural oxygen bar.\u0027 Featuring crystal-clear streams, cascading waterfalls, and serene forest trails, it is a perfect destination to escape city bustle for outdoor hiking and nature exploration.", "name": "Prince Mountain Forest Park", "transport": "Driving or riding a taxi is recommended. Alternatively, take Bus Hua 17 from Huadu Passenger Transport Station to Timian Station, then transfer to a taxi."}, {"address": "Hongshan Village, Timian Town, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Praised as one of Guangzhou\u0027s most beautiful villages, Hongshan Village is nestled in Timian Town, Huadu District. Surrounded by mountains, it features vast canola flower fields in spring, lotus ponds, and crystal-clear streams. The village retains rich Hakka customs and idyllic pastoral scenery, complete with waterfront boardwalks and village cycling tracks, making it a popular spot for rural eco-tourism and relaxing countryside walks.", "name": "Hongshan Village Scenic Area", "transport": "Driving is recommended. Alternatively, take Bus Hua 17 to Timian Hongshan Village Station."}, {"address": "Jiulongtan Reservoir Area, Huadong Town, Huadu District, Guangzhou City", "feature": "\u2b50 4.1 stars | Located in Huadong Town, Huadu District, Jiulongtan is a natural eco-scenic area famous for its high-gorge lake, rolling mountains, and clear mountain springs. The reservoir offers expansive waters surrounded by lush forest coverage, creating picturesque views. Visitors can enjoy lakeside walks, boat cruises, and outdoor camping, immersing themselves in serene nature.", "name": "Jiulongtan Eco-Tourism Resort", "transport": "Driving is recommended; navigate to \u0027Jiulongtan Eco-Tourism Resort\u0027."}, {"address": "No. 56 Xiuquan Avenue, Xinhua Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.1 stars | Xiuquan Park is a memorial park built to commemorate Hong Xiuquan, the leader of the Taiping Heavenly Kingdom. Built around a wide artificial lake, the park features lush shade trees and charming traditional pavilions. Strolling along the lakeside corridors or visiting the central island allows visitors to enjoy classical garden aesthetics and tranquil water views, blending rich historical culture with natural scenery.", "name": "Xiuquan Park", "transport": "Take Metro Line 9 to Guangzhou North Railway Station, then walk about 1.2 km or transfer to Bus Hua 2 to Xiuquan Park Station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "F1, Sunac Mall, No. 63 Pingbu Avenue East, Huacheng Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | As South China\u0027s largest indoor ski resort, the ice and snow castle inside Guangzhou Bonski is a dreamlike photo scene that every visitor must capture. Built with giant ice sculptures, realistic snowscapes, and colorful neon lights, it instantly transports you to a European winter fairytale. Whether taking a group photo in front of the castle or ascending to overlook skiers zooming down the slopes, you can easily snap stunning, high-quality photos. It is an immensely popular viral photo spot.", "name": "Guangzhou Bonski Snow Castle", "transport": "Take the Guangqing Intercity Railway to Huachengjie Station and walk about 5 minutes to reach the Sunac Mall entrance."}, {"address": "Intersection of Fenghuang North Road and Pingbu Avenue East, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Designed by the internationally acclaimed Steven Chilton Architects, Guangzhou Sunac Grand Theatre features a striking deep Chinese red facade that cleverly blends motifs of woven silk and the Maritime Silk Road. The streamlined red exterior creates elegant light reflections under the sun and glows magnificently when illuminated at night. It attracts countless photography enthusiasts and architecture buffs, making it one of Huadu District\u0027s most eye-catching landmarks.", "name": "Guangzhou Sunac Grand Theatre (\u0027Red Silk\u0027)", "transport": "Take Metro Line 9 to Ma\u0027anshan Park Station (Exit C), then transfer to Bus Hua 19 and get off at Sunac Resort Station."}, {"address": "Inside Guangzhou Sunac Land, No. 78 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Located in the Lingnan Impression area of Sunac Land, \u0027Fly Over Guangdong\u0027 is not only a popular 5D flying theater ride, but its exterior\u2014featuring quaint Lingnan-style grand mansions and lion dance sculptures\u2014is also a highly sought-after photo backdrop. Visitors can immerse themselves in rich Cantonese cultural heritage in front of the classic building before embarking on a giant-screen flight over Lingnan\u0027s magnificent historical sites. It\u0027s an acclaimed hot spot combining culture and visual thrill.", "name": "Guangzhou Sunac Land - \u0027Fly Over Guangdong\u0027", "transport": "Take the Guangqing Intercity Railway to Huachengjie Station and walk into the Sunac Land park area."}, {"address": "Inside Sunac Mall, No. 63 Pingbu Avenue East, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | The fully indoor climate-controlled Sunac Water Park features a massive pink sand beach wave pool and Southeast Asian tropical island decor. The stage at the center of the wave pool and the palm tree landscaping make perfect summer photo opportunities. Maintained at a comfortable temperature year-round, complete with vibrant light shows and water party performances, every snapshot exudes vacation vibes\u2014making it a highly recommended indoor water paradise for young adults and influencers.", "name": "Guangzhou Sunac Water Park Wave Pool", "transport": "Take Bus Hua 6 or Hua 19 to Sunac Resort Terminal, then walk into Sunac Mall."}, {"address": "No. 69 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Built in traditional Lingnan water-town style, the hotel features lakeside pavilions, grey tiles, and white walls that complement each other, evoking the serene elegance of southern water towns. The hotel courtyard\u0027s picturesque lake views and wooden boardwalks are highly popular for modern Chinese portraiture and traditional Hanfu photography. At sunset, the lake reflects the glowing architecture, creating an extraordinarily poetic atmosphere.", "name": "Guangzhou Sunac Steigenberger Grand Hotel Lingnan Courtyard", "transport": "Take Metro Line 9 to Huadu Square Station, then take a taxi for about 10 minutes to arrive."}, {"address": "Inside Sunac Mall, No. 63 Pingbu Avenue East, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | The go-kart track inside Sunac Sports World is packed with high-tech racing flair, featuring a multi-level 3D track layout and electric go-karts imported from France. The photo backdrop area includes a podium, checkered flags, and trendy neon signage, allowing racers to don professional racing suits and snap cool, sporty viral photos while enjoying the high-speed drifting thrills. It is immensely popular among trendy youth.", "name": "Guangzhou Sunac Sports World Crazy Go-Kart Track", "transport": "Take the Guangqing Intercity Railway to Huachengjie Station and walk directly into the Sports World area inside Sunac Mall."}, {"address": "No. 63 Pingbu Avenue East, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | As a large shopping complex, Guangzhou Sunac Mall features a circular atrium with a giant streamlined skylight roof and dazzling lights. It regularly hosts giant art installations and trendy IP exhibitions tailored for holidays. The grand open space combined with modern multi-level balconies allows you to capture sleek, urban aesthetic photos, whether shooting upward at the magnificent ceiling or using stylish exhibits as your backdrop.", "name": "Guangzhou Sunac Mall Starry Atrium", "transport": "Take Bus Hua 76A or Hua 19 directly to Sunac Mall Station."}, {"address": "By the Man-Made Lake, Sunac Resort, Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated by the man-made lake at the heart of Sunac Resort, this spot features expansive lakeside walkways and nightly musical fountain shows. As night falls, brilliant lights and water jets dance rhythmically to music, set against the illuminated backdrop of Snow World and the hotel complex. It\u0027s a wonderful location for couples on dates and strolling visitors to take photos, with the lakeside viewing platform offering effortless opportunities for breathtaking night water-show photos.", "name": "Guangzhou Sunac Lakefront Musical Fountain", "transport": "Take the Guangqing Intercity Railway to Huachengjie Station and walk to the lakeside scenic promenade."}], "name": "Popular Photo Spots"}}, "name": "Huadu Sunac Cultural Tourism City and Snow World"}, "panyu_chimelong": {"categories": {"cat_1": {"items": [{"address": "Intersection of Guangming Expressway and Heping Road, Nancun Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.6 stars | Also known as Yuyin Garden, Yuyin Shanfang was built during the Tongzhi reign of the Qing Dynasty and is one of Guangdong\u0027s Four Great Lingnan Gardens. Though compact in scale, it is renowned for its masterly landscaping art that \u0027creates an immense world within a limited space\u0027, seamlessly blending delicate Lingnan style with subtle Western architectural elements. Key features include classical structures like Shenliu Hall, the Huanhong Kualv Covered Bridge, and the Linchi Villa. Exquisite \u0027Four Lingnan Carvings\u0027\u2014wood, brick, lime plaster, and stone\u2014can be seen throughout, showcasing exceptional craftsmanship.", "name": "Yuyin Shanfang Garden", "transport": "Take Metro Line 7 to Yuangang Station, then transfer to Bus Panyu 30 to Yuyin Shanfang Station."}, {"address": "No. 10 Daxangchong Road, Shawan, Panyu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Founded during the Southern Song Dynasty, Shawan Ancient Town boasts a history of over 800 years and is one of the core birthplaces of Lingnan Cantonese culture. It houses exceptionally well-preserved architectural complexes from the Ming, Qing, and Republic periods, including grand ancestral halls like Liugeng Hall and distinctive \u0027oyster shell walls\u0027. Strolling through ancient alleys flanked by wok-ear gable houses, visitors can admire exquisite brick and lime plaster carvings while immersing themselves in rich traditional Lingnan charm.", "name": "Shawan Ancient Town", "transport": "Take Metro Line 3 to Shiqiao Station, then transfer to Bus Panyu 6 or Panyu 68 to Shawan Ancient Town South Gate Station."}, {"address": "Dalingshan Road, Zini Village, Shawan Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Built in the late Qing and early Republican periods and painstakingly expanded in modern times, Baomo Garden is a grand complex combining Qing Dynasty official gardens, Lingnan architectural arts, and water township landscapes. It features grand structures like Qingxin Pavilion and Zhiben Hall, alongside Guinness World Record-holding artistic masterpieces: the porcelain relief mural \u0027Along the River During the Qingming Festival\u0027 and a colossal brick carving wall. Winding corridors and intricately painted rafters beautifully harmonize classic grandeur with water scenery.", "name": "Baomo Garden", "transport": "Take Metro Line 3 to Shiqiao Station, then transfer to Bus Panyu 67 directly to Baomo Garden Terminal."}, {"address": "No. 1 Waihuan West Road (South of Higher Education Mega Center), Panyu District, Guangzhou City", "feature": "\u2b50 4.4 stars | Located in the south of Guangzhou Higher Education Mega Center, Lingnan Impression Park brings together a wide collection of traditional Lingnan residences and landmark heritage buildings restored or relocated from across Guangdong. It recreates iconic features such as water village lanes, tall wok-ear walls, arcade streets, ancestral halls, and ancient piers. A stroll here offers an up-close look at master architectural craft details and an immersive experience into authentic Cantonese culture.", "name": "Lingnan Impression Park", "transport": "Take Metro Line 4 to Higher Education Mega Center South Station (Exit B), then walk or take a short bus ride."}, {"address": "Inside Lotus Mountain Scenic Area, Shilou Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Built in 1612 during the Wanli reign of the Ming Dynasty, the ~50-meter-tall Lianhua Pagoda is an octagonal pavilion-style brick pagoda. Historically serving as a crucial navigational landmark along the Pearl River estuary, it earned the title \u0027The Ornamental Pillar of the Provincial Capital\u0027. With 9 exterior stories and 17 interior levels, its brickwork is exquisite and structure majestic. Climbing to the top rewards visitors with sweeping views of the Pearl River Estuary, making it a key protected historical site.", "name": "Lianhua Pagoda at Lotus Mountain", "transport": "Take Metro Line 4 to Shiqi Station or Haibang Station, then transfer to Bus Panyu 92 or Panyu 93 to Lianhuashan Station."}, {"address": "Yuangang Avenue, Yuangang Village, Nancun Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.2 stars | Originally built during the Jiajing reign of the Ming Dynasty, the Yuangang Cui Clan Ancestral Hall is a grand and exceptionally preserved example of Cantonese ancestral hall architecture in Panyu. Built with a traditional three-entry, three-courtyard layout, it features a spacious front courtyard and a crescent pond. Inside, gorgeous painted rafters, Ming and Qing wood carvings, stone bases, and Lingnan plaster moldings demonstrate traditional clan heritage and outstanding architectural mastery.", "name": "Yuangang Cui Clan Ancestral Hall", "transport": "Take Metro Line 7 to Yuangang Station (Exit C) and walk about 600 meters."}, {"address": "Zhicun 1st Road, Nancun Town (East of Chimelong Resort), Panyu District, Guangzhou City", "feature": "\u2b50 4.0 stars | Located near Chimelong Safari Park and Hanxi Longcheng Station, the Zhicun Xie Clan Ancestral Hall is a representative local heritage landmark near the resort area. Featuring a three-hall flush-gable roof structure typical of Lingnan architecture, it displays vibrant traditional lime plaster and ceramic ridge decorations, with flagpole stones and ancient banyan trees standing out front. As one of the few well-preserved ancient village halls nearby, it bears witness to centuries of local history and family legacy.", "name": "Zhicun Xie Clan Ancestral Hall", "transport": "Take Metro Line 3 or Line 7 to Hanxi Longcheng Station, then transfer to a bus or walk about 1.2 km."}, {"address": "Shating Village, Hualong Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.1 stars | Established within the Qu Clan Ancestral Hall\u2014dedicated to Qu Dajun, a prominent Qing Dynasty Lingnan scholar and patriotic poet\u2014this site is a key provincial-level protected cultural heritage site. The building boasts classic Lingnan ancestral hall aesthetics with gray tiles, green bricks, and wok-ear gables, emanating a solemn and timeless presence. Exhibits display Qu Dajun\u0027s life achievements, original manuscripts, and Ming and Qing artifacts, serving as a significant landmark for exploring Lingnan history, culture, and architecture.", "name": "Qu Dajun Memorial Hall", "transport": "Take Metro Line 4 to Xinzao Station, transfer to Bus Panyu 60 to Shating Village Station, and walk to the destination."}], "name": "Historic Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 stars | A premier science and culture exhibition hall located inside Chimelong Safari Park. It offers an engaging and educational look into giant panda conservation history, anatomy, and living habits. Combining interactive multimedia displays with rare specimens, it allows visitors to admire lively pandas while gaining a deeper appreciation for ecological conservation\u2014making it both educational and culturally enriching.", "name": "Chimelong Panda Science Museum", "transport": "Take Guangzhou Metro Line 3 or Line 7 to \u0027Hanxi Longcheng Station\u0027, then transfer to the free park shuttle bus upon exit."}, {"address": "Nancun Shixin Road, Dawei Village, Nancun Town, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located inside Yuyin Mountain Villa, one of Lingnan\u0027s four famous Qing Dynasty gardens, Shenliu Hall is the architectural crown jewel of the estate. It houses historically priceless woodcarvings, brick carvings, and calligraphic plaques by famous masters, showcasing exquisite Lingnan garden craftsmanship and deep literary heritage\u2014an ideal spot to immerse oneself in classical Lingnan culture.", "name": "Yuyin Mountain Villa Shenliu Hall Art Gallery", "transport": "Take Guangzhou Metro Line 7 to \u0027Yuangang Station\u0027 or \u0027Banqiao Station\u0027, then transfer to Bus Panyu 30 and get off at \u0027Yuyin Mountain Villa Station\u0027."}, {"address": "No. 1 Outer Ring West Road, Higher Education Mega Center, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Situated within Lingnan Impression Park in the southern part of Guangzhou Higher Education Mega Center, this museum provides a comprehensive look at Cantonese folk traditions, Guang\u5f69 (porcelain) and Guang\u7e61 (embroidery) crafts, Cantonese Opera, and water town lifestyles. Featuring a rich collection of vintage artifacts and handicrafts alongside immersive water town streets, it feels like traveling back to old Guangzhou.", "name": "Lingnan Impression Park Folk Museum", "transport": "Take Guangzhou Metro Line 4 to \u0027Higher Education Mega Center South Station\u0027 (Exit B), then walk or transfer to Bus Panyu 201 to \u0027Lingnan Impression Park Station\u0027."}, {"address": "No. 175 Yinping Road, Shiqiao Street, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | A large district-level comprehensive museum in Guangzhou featuring a grand, modern architectural style. Key exhibition areas include unearthed relics from Panyu, a reconstructed Han Dynasty brick tomb, and a massive Eastern Han iron cauldron. It clearly traces Panyu\u0027s history and cultural evolution over millennia, making it a must-visit for history and arts enthusiasts.", "name": "Panyu Museum", "transport": "Take Guangzhou Metro Line 3 to \u0027Shiqiao Station\u0027, then transfer to Bus Panyu 1 or Panyu 21B to \u0027Panyu Museum Station\u0027."}, {"address": "Inside Guangzhou University of Chinese Medicine, No. 232 Outer Ring East Road, Higher Education Mega Center, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Located inside Guangzhou University of Chinese Medicine at Higher Education Mega Center, this is a unique museum dedicated to medical culture in South China. It features a Medical History Hall, a Chinese Materia Medica Hall, and a stunning \u0027Crystal Palace\u0027 of fluid-preserved specimens, displaying thousands of medicinal herb specimens and ancient medical devices\u2014blending rich cultural background with scientific knowledge.", "name": "Guangdong Museum of Traditional Chinese Medicine", "transport": "Take Guangzhou Metro Line 4 to \u0027Higher Education Mega Center South Station\u0027, then transfer to Higher Education Mega Center Loop Line 1 Bus to \u0027Guangzhou University of Chinese Medicine Station\u0027."}, {"address": "Inside Shawan Ancient Town Scenic Area, No. 10 Daxiangyong Road, Shawan, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Shawan Ancient Town is one of the key birthplaces of Cantonese music. This memorial hall (Sanren Hall) is where the famous He Trio composed iconic masterpieces like \u0027Dragon Boat Race\u0027 and \u0027Rain Dripping on Plantain Leaves\u0027. On display are numerous rare antique musical instruments, vinyl records, and original sheet music manuscripts, brimming with rich Lingnan musical artistic charm.", "name": "Shawan Ancient Town Guangdong Music Memorial Hall", "transport": "Take Guangzhou Metro Line 3 to \u0027Shiqiao Station\u0027, then transfer to Bus Panyu 6 or Panyu 68 to \u0027Shawan Ancient Town South Gate Station\u0027."}, {"address": "Inside Baomo Garden, Zini Village, Shawan Town, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located inside the 4A-rated Baomo Garden, this museum was established through donations from Chinese-American collector Mr. Zhao Tailai. It houses a vast collection of priceless ancient bronzes, Tang Sancai pottery, Ming and Qing ceramics, and calligraphy/paintings by historic masters, seamlessly blending delicate garden scenery with an elegant art museum.", "name": "Baomo Garden Zhao Tailai Art Museum", "transport": "Take Guangzhou Metro Line 3 to \u0027Shiqiao Station\u0027, then transfer to Bus Panyu 67 directly to \u0027Baomo Garden Bus Terminal\u0027."}, {"address": "No. 116 Guangming North Road, Shiqiao Street, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | A Gothic-style Catholic church located in the core area of Shiqiao, Panyu, featuring elegant soaring spires and vibrant stained glass windows. The peaceful and serene environment stands in stark contrast to the surrounding bustling city. Its interior vaulted ceilings and religious murals express deep Western sacred artistic beauty, making it an iconic religious landmark in Panyu.", "name": "Panyu Shiqiao Catholic Church", "transport": "Take Guangzhou Metro Line 3 to \u0027Shiqiao Station\u0027 (Exit A), and walk approximately 800 meters along Guangming North Road."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Swan Lake Zone is one of the most serene and enchanting natural water landscapes in Chimelong Safari Park. The vast lake glimmers with gentle green waves, surrounded by dense subtropical flora and lush green trees. Home to black swans, mute swans, mandarin ducks, and various waterfowl, visitors can take an aerial cable car to overlook the picturesque scenery of lakes and mountains, or stroll along the lakeside wooden boardwalk to experience the tranquil harmony between nature and wildlife.", "name": "Swan Lake Zone, Chimelong Safari Park", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station (Exit D/E), then transfer to the free Chimelong shuttle bus to the South Gate of Chimelong Safari Park."}, {"address": "Qinglong Mountain Zone, Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Qinglong Mountain Zone features primeval forest ecology and Dinosaur Valley adventure, boasting rich vegetation and multi-layered rainforest landscapes. Fresh mountain air and ancient towering trees flank well-structured forest trails. Along the way, visitors can observe rare plants and insect ecosystems while enjoying lifelike animatronic dinosaur models set against misty, wonderland-like effects. It\u0027s a fantastic area combining a natural forest oxygen bar with educational adventure fun.", "name": "Qinglong Mountain Zone, Chimelong Safari Park", "transport": "Take Metro Line 3/7 to Hanxi Changlong Station, transfer to the park\u0027s free shuttle bus to Chimelong Safari Park, and enter on foot."}, {"address": "Panda Land, Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.9 Stars | Panda Valley faithfully replicates the native habitat of giant pandas, densely planted with lush green bamboo groves that create a cool and pleasant microclimate. Home to the world\u0027s only giant panda triplets, the scenic surroundings are picturesque\u2014with clear streams flowing over stones and swaying bamboo shadows. Strolling through feels like being in Sichuan\u0027s alpine bamboo sea, making it a green sanctuary for both visual and mental relaxation.", "name": "Panda Valley \u0026 Bamboo Garden, Chimelong Safari Park", "transport": "Take Metro Line 3/7 to Hanxi Changlong Station, transfer to the free shuttle bus to the Safari Park, and head to the Panda Land area."}, {"address": "Self-drive / Mini-train Tour Area, Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | The African Savanna Zone recreates the magnificent natural scenery of the Great Rift Valley and savanna grasslands. Rolling lawns, scattered acacia trees, and vast loess terrain complement each other perfectly. Visitors can ride a mini-train through the boundaryless grassland landscape to closely observe giraffes, zebras, wildebeests, and other animals running and foraging in an exotic natural setting, showcasing the ultimate grand beauty of the wild.", "name": "African Savanna Zone, Chimelong Safari Park", "transport": "Take Metro Line 3/7 to Hanxi Changlong Station, transfer to the free shuttle bus to the North Gate of the Safari Park. The mini-train boarding point is right near the North Gate."}, {"address": "Inside Chimelong Birds Park, No. 183 Shitang Road, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located in the heart of Chimelong Birds Park, this core natural scenic area faithfully recreates a large-scale subtropical mangrove wetland ecosystem. Interconnected waterways and lush aquatic plants shelter thousands of rare wetland birds such as ibises, egrets, and grey herons. Equipped with concealed bird-watching corridors and wooden boardwalks, it enables nature lovers to admire spectacular wetland sunsets and thousands of birds in flight up close without disturbing their natural habitat.", "name": "Mangrove Wetland Bird Area, Chimelong Birds Park", "transport": "Take Metro Line 2 to Huijiang Station (Exit C), then transfer to the free Chimelong Birds Park dedicated shuttle bus directly to the main entrance."}, {"address": "Inside Chimelong Birds Park, No. 183 Shitang Road, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Pelican Bay combines expansive lake waters with exquisite horticultural floral landscapes, surrounded by year-round blooming flowers and lush greenery. Home to one of China\u0027s largest pelican populations, gentle breezes sweep over the lake as flocks of pelicans feed, rest, and soar near the water. Featuring lakeside waterside platforms and tropical plant green corridors, it offers an elegant, comfortable setting perfect for photos and soaking in the sunshine and waterfront atmosphere.", "name": "Pelican Bay \u0026 Flower Square, Chimelong Birds Park", "transport": "Take Metro Line 2 to Huijiang Station, then transfer to the park\u0027s dedicated shuttle bus directly to Chimelong Birds Park."}, {"address": "No. 688 Yushan Avenue, Shiqiao Street, Panyu District, Guangzhou City, Guangdong Province (Southwest of Chimelong Resort)", "feature": "\u2b50 4.7 Stars | Adjacent to the Chimelong Resort, Dafushan Forest Park is Panyu District\u0027s largest green lung and natural park, covering over 9,000 mu (approx. 600 hectares). Rolling hills surround ponds and reservoirs of various sizes, with hundreds of thousands of dawn redwoods, bald cypresses, and banyan trees planted throughout. Each season offers unique views\u2014especially in autumn and winter when bald cypresses turn red, creating breathtaking lake reflections. Featuring complete lakeside cycling greenways and hiking trails, it\u0027s a popular outing destination for connecting with nature.", "name": "Dafushan Forest Park", "transport": "Take Metro Line 3 to Shiqiao Station (Exit B), then transfer to Bus Panyu 16 or Panyu 9 to \u0027Dafushan Forest Park Terminal\u0027."}, {"address": "Greenery belt surrounding Chimelong Resort, Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Hanxi Chimelong Ecological Green Trail is a public ecological landscape corridor connecting Chimelong Tourist Resort with surrounding green spaces. Lined with abundant palm trees, tall arbors, and colorful seasonal flowers, the trail features comfortable facilities and resting pavilions. Far from noisy traffic with fresh air, it seamlessly blends urban greenery with the resort\u0027s tropical vibe, making it an excellent parkland green space for morning and evening walks, oxygen-rich strolls, and enjoying Panyu New Town\u0027s lush greenery.", "name": "Hanxi Chimelong Ecological Green Trail", "transport": "Take Metro Line 3 or Line 7 to Hanxi Changlong Station (Exit G/D) to reach the trail entrance."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Panda Village is one of the top photo spots in Chimelong Safari Park, home to the world\u0027s only giant panda triplets: \u0027Meng Meng\u0027, \u0027Shuai Shuai\u0027, and \u0027Ku Ku\u0027. Designed with a fairy-tale theme, the area features super cute panda statues, custom-shaped ice creams, and panoramic glass viewing areas. Visitors can observe giant pandas up close as they munch on bamboo, roll around, and play. Additionally, there is a dedicated panda science museum and themed souvenir shop, attracting countless photography enthusiasts and families.", "name": "Chimelong Safari Park - Panda Village", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station (Exit E), then transfer to the free Chimelong Shuttle Bus to the South Gate of Chimelong Safari Park."}, {"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | The Cable Car system is the world\u0027s first aerial cable car designed for watching wild animals, spanning 2.7 km in a continuous loop. Offering 360-degree views\u2014including glass-bottomed crystal cabins\u2014it allows visitors to look down at Swan Lake on the African Savannah, herds of giraffes, and wild animals roaming through the forest. On clear days, the aerial view is breathtaking, making it a premier photo spot for capturing herds of animals and lush natural landscapes.", "name": "Chimelong Safari Park - Cable Car", "transport": "Take the Metro to Hanxi Changlong Station, transfer to the park\u0027s free shuttle bus to the South or North Gate of Chimelong Safari Park, and walk to the Cable Car station."}, {"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Chimelong Koala Plaza is the largest koala breeding base outside of Australia, currently housing a massive six-generation koala family. Featuring exquisitely crafted Australian outback scenery, visitors can see chubby koalas hugging eucalyptus leaves while napping or acting adorable. The area includes a koala educational classroom and special photo backdrops, making it extremely popular among families and photo lovers.", "name": "Chimelong Safari Park - Koala Plaza", "transport": "Take the Metro to Hanxi Changlong Station (Exit E), transfer to the free Chimelong Shuttle Bus to the South Gate of the park, and walk in."}, {"address": "Inside Chimelong Tourist Resort, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.9 Stars | Featuring the world\u0027s largest live circus stage, it brings together top circus performers from dozens of countries alongside hundreds of rare animals. Astounding lighting and sound effects, aerial trapeze acts, Globe of Death motorcycle stunts, and vibrant parades combine to create an unparalleled evening visual feast. The giant castle exterior lights up magically at night, making it an iconic night-time photo spot in the Chimelong Resort.", "name": "Chimelong International Circus", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station (Exit D or E), then walk about 10 minutes or take the free park shuttle bus."}, {"address": "Inside Chimelong Paradise, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Known as the \u0027King of Roller Coasters\u0027, the Vertical Roller Coaster is the flagship attraction of Chimelong Paradise. Featuring an extreme nearly 90-degree vertical drop from a breathtaking height, it gives riders an exhilarating thrill of gravitational acceleration. Its massive red steel structure is striking; whether shooting low-angle shots of the coaster diving down or riding it yourself, it is a hugely viral photo spot on social media.", "name": "Chimelong Paradise - Vertical Roller Coaster", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station (Exit E), then walk about 3\u20135 minutes to the main entrance of Chimelong Paradise."}, {"address": "Chimelong Birds Park, Shijie Road, Shibi Street, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Chimelong Birds Park focuses on natural ecology and wetland conservation, with \u0027Hundreds of Birds Flying Show\u0027 standing out as its most spectacular flagship performance. On a grand water stage, hundreds of rare birds\u2014including black swans, egrets, and crowned cranes\u2014take flight simultaneously, creating a breathtaking, picture-perfect scene. The park\u0027s abundant tropical foliage and water-town landscapes offer endless eco-friendly photo angles, highly popular among photography enthusiasts.", "name": "Chimelong Birds Park - Hundreds of Birds Flying Show", "transport": "Take Metro Line 2 to Huijiang Station (Exit C), then transfer to the dedicated Chimelong Birds Park shuttle bus to arrive directly."}, {"address": "Inside Chimelong Safari Park, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | The Qinglong Mountain area includes \u0027Jurassic Forest\u0027 and \u0027Rainforest Wonderland\u0027, offering an immersive photo spot combining artificial mist with realistic animatronic dinosaurs. Stepping into the area, mist-shrouded rainforest scenery makes you feel as though you\u0027ve entered a fairyland. Giant animatronic dinosaurs hidden in the trees roar and move, creating a striking visual impact that makes it a magical photo spot for both adults and kids.", "name": "Chimelong Safari Park - Qinglong Mountain", "transport": "Take Metro Line 3 to Hanxi Changlong Station (Exit E), then take the free park shuttle bus to enter via the South Gate of Chimelong Safari Park."}, {"address": "Inside Chimelong Tourist Resort, No. 293 Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | The Chimelong Panda Hotel is themed after the famous panda triplets\u0027 cartoon characters, filling the entire hotel with magical fairy-tale vibes. The central atrium and courtyard feature a carefully designed Flamingo Island, where guests can admire vibrant pink flamingos resting by the water up close. The lobby boasts giant panda plush statues and colorful painted walls, making it a highly distinctive Instagrammable hotel and photo landmark in Guangzhou\u0027s Chimelong Resort.", "name": "Chimelong Panda Hotel - Panda Atrium \u0026 Flamingo Garden", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, then transfer to the free Chimelong Shuttle Bus (Panda Hotel Line) directly."}], "name": "Popular Photo Spots"}}, "name": "Panyu Chimelong Wildlife Theme Resort"}, "xiguan_liwan": {"categories": {"cat_1": {"items": [{"address": "No. 34 Enlongli, Zhongshan 7th Road, Liwan District, Guangzhou", "feature": "\u2b50 4.7 stars | Built in 1893 during the Qing Dynasty, the Chen Clan Ancestral Hall is the largest, best-preserved, and most exquisitely decorated traditional clan ancestral hall complex existing in the Lingnan region. The architecture masterfully integrates all \u0027Seven Wonders of Lingnan Architecture\u0027\u2014wood carving, stone carving, brick carving, ceramic sculpting, stucco sculpting, copper/iron casting, and color painting\u2014earning it the title \u0027Pearl of Lingnan Architectural Art.\u0027 Featuring nine halls and six courtyards arranged in a grand, harmonious layout, it stands as a brilliant showcase of Cantonese folk architecture and traditional carving craftsmanship at its peak.", "name": "Chen Clan Ancestral Hall (Chen Clan Academy)", "transport": "Take Guangzhou Metro Line 1 or Line 8 to \u0027Chen Clan Academy Station\u0027, Exit D, and walk for about 1 minute."}, {"address": "Shamian South Street and Shamian North Street Area, Liwan District, Guangzhou", "feature": "\u2b50 4.6 stars | Shamian is Guangzhou\u0027s most enchanting historical district with European flair, having formerly served as a British and French concession. The island features over 150 European-style buildings showcasing Neoclassical, Baroque, Gothic, and Neo-Gothic architectural styles, with dozens designated as National Key Cultural Relics. Strolling along Shamian\u0027s lush, tree-lined avenues, iconic landmarks like Our Lady of Lourdes Church, the former HSBC Building, and the former British Consulate offer a captivating atmosphere rich in vintage European charm and deep history.", "name": "Shamian Island European Architecture Complex", "transport": "Take Guangzhou Metro Line 1 or Line 6 to \u0027Huangsha Station\u0027, Exit F, cross the pedestrian bridge, and enter Shamian Island."}, {"address": "No. 127 Enning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 stars | Situated in the core of Yongqing Fang, the Cantonese Opera Museum is an exquisite architectural complex built in classic Lingnan garden style. Set along the scenic Lizhiwan Canal, the main structure embodies late-Qing Lingnan garden design, complete with serene pavilions, rockeries, winding water paths, intricate wood-carved windows, detailed stucco sculptures, and a stunning floating stage. The rich museum exhibits showcase the history, costumes, props, and legendary masters of Cantonese Opera, making it both a sacred cultural hub and a visually breathtaking garden landmark.", "name": "Cantonese Opera Museum", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027, Exit D2, or Line 6 to \u0027Huangsha Station\u0027, Exit B, and walk for about 10 minutes."}, {"address": "Enning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Built in 1931, Enning Road is celebrated as \u0027Guangzhou\u0027s Most Beautiful Arcade Street.\u0027 The continuous arcaded structures (Qilou) lining both sides seamlessly blend traditional Lingnan residence design with Western architectural elements, creating sheltered covered walkways for pedestrians. Once the bustling commercial and cultural center of old Guangzhou, it still houses traditional copper craft shops and blacksmith workshops. Following tasteful urban revitalization in Yongqing Fang, these historic arcades now blend seamlessly with modern creative shops and independent cafes.", "name": "Enning Road Arcade Street (Qilou Street)", "transport": "Take Guangzhou Metro Line 6 to \u0027Huangsha Station\u0027, Exit B, and walk for about 8 minutes to Enning Road."}, {"address": "No. 13 Yongqing 1st Alley, Enning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 stars | Tucked inside Yongqing Fang, the Bruce Lee Ancestral Residence is a classic Xiguan Grand House purchased in the 1940s by Bruce Lee\u0027s father, Li Hoi-chuen (a renowned Cantonese Opera performer). The building displays signature features of traditional Xiguan architecture, including intricate carved wooden doors, granite doorframes, sliding wooden gate doors (Tanglong doors), and tall marble foundations. Today, the residence hosts exhibits highlighting Bruce Lee\u0027s life story, martial arts philosophy, and his family\u0027s artistic heritage.", "name": "Bruce Lee Ancestral Residence", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027, Exit D2, and walk for about 10 minutes into Yongqing Fang."}, {"address": "Intersection of Longjin West Road and Fengyuan Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Xiguan Grand Houses were grand traditional mansions inhabited by prominent, wealthy families in Guangzhou during the late Qing Dynasty and early Republican era. The historic cluster along Longjin West Road and Fengyuan Road beautifully preserves core architectural elements: brick-and-wood frames, green brick walls with granite bases, traditional triple-door entrances, lofty main halls, inner courtyards, and colorful Manchurian stained-glass windows. Walking through these stone-paved alleys offers a glimpse into the sophisticated lifestyle of historic Guangzhou.", "name": "Longjin West Road Xiguan Grand House Architectural Area", "transport": "Take Guangzhou Metro Line 5 to \u0027Zhongshanba Station\u0027, Exit D, and walk for about 10 minutes to Longjin West Road."}, {"address": "No. 20 Renweimiao Qianjie, Pantang Road, Longjin West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 stars | Founded in 1052 during the Northern Song Dynasty, Renwei Ancestral Temple is an ancient Taoist temple dedicated to Emperor Zhenwu and the largest historic complex in the Pantang area. Facing south, the grand temple spans three main courtyard halls decorated with extraordinary craftsmanship. Intricate wood carvings, stone carvings, brick reliefs, and glazed ceramic ridge sculptures adorn the structures, with the elaborate woodwork being particularly famous. During traditional festivals, the temple thrives with vibrant folk worship and incense.", "name": "Renwei Ancestral Temple", "transport": "Take Guangzhou Metro Line 5 to \u0027Zhongshanba Station\u0027, Exit A, and walk for about 8 minutes."}, {"address": "No. 31 Hualintemple Qianjie, Changshou West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 stars | Founded in 527 AD during the Liang Dynasty (originally known as Xilai Nunnery), Hualin Temple marks the historic site where Bodhidharma, the founder of Zen Buddhism in China, first arrived and began preaching, earning it the title \u0027First Site of Western Arrival.\u0027 The temple\u0027s standout highlight is the Hall of Five Hundred Arhats, housing 500 unique, life-sized gilded clay statues, including one famously modeled after Marco Polo. It stands as a serene sanctuary filled with rich Buddhist heritage.", "name": "Hualin Temple", "transport": "Take Guangzhou Metro Line 8 to \u0027Hualin Temple Station\u0027, Exit C, and walk for about 2 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 127 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Located in the heart of Yongqing Bao, this museum showcases exquisite Lingnan garden-style architecture, blending elements of Suzhou gardens with classic Lingnan design. Visitors can admire picturesque pavilions, rockeries, and water features. The exhibits trace the history of Cantonese Opera, featuring elaborate costumes, props, and audio-visual archives of classic performances. Live Cantonese Opera highlights are occasionally performed on the lake-center stage, making it an unbeatable spot to experience traditional Lingnan opera culture and garden aesthetics.", "name": "Cantonese Opera Art Museum", "transport": "Take Metro Line 1 or 6 to Huangsha Station (Exit B), then walk for about 8 minutes."}, {"address": "No. 13 Yongqing 1st Lane, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Situated inside Yongqing Bao, this is the former residence of Li Hoi-chuen, father of martial arts legend Bruce Lee. Built during the Republican era, this traditional Xiguan Grand House features carved stained glass \u0027Manchu windows\u0027, carved wooden doors, and grey-brick walls. Through historical photos, documentations, documentaries, and interactive multimedia, the venue showcases Li Hoi-chuen\u0027s Cantonese Opera career as well as Bruce Lee\u0027s life, martial arts philosophy, and cinematic achievements, offering immense cultural and commemorative value.", "name": "Bruce Lee\u0027s Ancestral Home", "transport": "Take Metro Line 1 or 6 to Huangsha Station (Exit B), then walk for about 7 minutes."}, {"address": "No. 84 Fengyuan North Street, Yaohua Avenue, Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located next to Liwan Lake Park, this district-level museum highlights the history, culture, and Lingnan garden landscapes of Xiguan. The main building is a Western-style Republican-era villa garden (former residence of Chen Lianbo). Inside, exhibits display the architectural structure of Xiguan Grand Houses, historical materials of Thirteen Factories merchants, and traditional folk art of Liwan. Surrounded by towering ancient trees and tranquil environments, it\u0027s an ideal location to explore the lifestyle of old Xiguan\u0027s wealthy merchants and classic Lingnan residences.", "name": "Liwan Museum", "transport": "Take Metro Line 5 to Zhongshanba Station (Exit A), then walk for about 10 minutes."}, {"address": "No. 82 Fengyuan North Street, Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated within the Liwan Museum grounds, the Xiguan Folk Custom Museum is a faithfully reconstructed model of a classic Xiguan Grand House. It features the signature three-piece entrance door system (wooden low door, sliding wooden gate, and main thick wooden door), and restores traditional layouts such as reception halls, ancestral shrines, bedrooms, and study rooms. Adorned with exquisite rosewood furniture, Manchu stained-glass windows, Canton porcelain, and everyday historical items, it perfectly recreates the daily life and local customs of wealthy Xiguan families during the late Qing Dynasty and early Republican era.", "name": "Xiguan Folk Custom Museum", "transport": "Take Metro Line 5 to Zhongshanba Station (Exit A), then walk for about 10 minutes."}, {"address": "No. 37 Xidi 2nd Road (inside Guangzhou Cultural Park), Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located inside Guangzhou Cultural Park, this museum is dedicated to showcasing the glorious foreign trade history of the Thirteen Hongs during the Qing Dynasty. It houses a vast collection of donated Qing export art pieces, including Cantonese porcelain (Guangcai), ivory carvings, Cantonese embroidery, export oil paintings, and pith paper paintings. Through rich cultural relics and interactive multimedia, the exhibition restores the vibrant trade scenes and East-West cultural exchanges back when Guangzhou was China\u0027s sole foreign trading port.", "name": "Guangzhou Thirteen Hongs Museum", "transport": "Take Metro Line 6 or 8 to Cultural Park Station (Exit A), then walk for about 3 minutes."}, {"address": "No. 85 Shi\u0027erfu West Street, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Located on Shi\u0027erfu West Street near Enning Road, this is the birthplace and childhood home of Zhan Tianyou (Jeme Tien Yow), the \u0027Father of China\u0027s Railway\u0027. Housed in a traditional Qing-dynasty grey-brick Xiguan residence, the museum displays personal belongings, surveying instruments, manuscript drawings, and medals of honor. It vividly documents his grueling journey and monumental contributions in constructing the Beijing-Zhangjiakou Railway, making it rich in educational and historical significance.", "name": "Zhan Tianyou\u0027s Former Residence Museum", "transport": "Take Metro Line 1 to Changshou Road Station (Exit D2), then walk for about 8 minutes."}, {"address": "No. 14 Shamian Main Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated in the core of Shamian Island, this French Gothic Catholic church was built in 1890. Featuring an elegant cream-white and light blue exterior, it boasts a soaring bell tower, pointed archways, and vibrant stained-glass windows. In front of the church stands a Grotto of Our Lady modeled after the famous shrine in Lourdes, France. Peaceful and steeped in exotic architectural charm, it is one of the most famous historical landmarks and photography spots on Shamian Island.", "name": "Our Lady of Lourdes Church, Shamian", "transport": "Take Metro Line 1 or 6 to Huangsha Station (Exit F), cross the footbridge, and walk for about 6 minutes to Shamian Island."}, {"address": "No. 2 Shamian 5th Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Located on Shamian Island and built in 1865, this former Anglican church is one of the oldest religious structures among the Shamian architectural complex. Built in Neo-Romanesque style, it features red-brick walls paired with white accent lines and tall arched windows, presenting a dignified and elegant facade. Surrounded by lush greenery with a solemn interior atmosphere, it serves not only as a place of worship for local Christians but also as an important architectural heritage site showcasing Shamian\u0027s modern concession history.", "name": "Shamian Christian Church", "transport": "Take Metro Line 1 or 6 to Huangsha Station (Exit F), then walk for about 8 minutes to Shamian Island."}], "name": "Arts \u0026 Museums and Churches"}, "cat_3": {"items": [{"address": "No. 155 Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Liwan Lake Park is an iconic city park showcasing Lingnan water town aesthetics, composed of four lakes: Xiaolian Lake, Yucui Lake, Rong Lake, and Wuxiu Lake. Shaded by ancient banyan trees, the park features picturesque pavilions, terraces, and stone bridges scattered across the water, perfectly embodying the traditional Xiguan water town scenery of \u0027green streams along every reach, red lychees on both banks.\u0027 Visitors can rent boats to paddle along the tranquil water or enjoy authentic Cantonese morning tea (Yum Cha) at lakeside teahouses, immersing themselves in the relaxed pace of Xiguan life.", "name": "Liwan Lake Park", "transport": "Metro Line 5 Zhongshanba Station Exit A, approx. 8 minutes walk"}, {"address": "Junction of Longjin West Road and Pantang Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Lizhiwan Creek is Xiguan\u0027s most renowned ancient water system and natural water scenic area, winding through Liwan Lake Park and traditional Xiguan Mansion neighborhoods. The banks are lined with weeping willows and ancient banyan trees, featuring waterfront walkways, the Wen Tower, and Lingnan-style bridges. Strolling along the creek allows visitors to take in clear waters, lush greenery, and the architectural beauty of historical Xiguan Mansions. As evening falls and lights turn on, the shimmering reflections on the water create a deeply captivating atmosphere.", "name": "Lizhiwan Creek Scenic Waterway", "transport": "Metro Line 5 Zhongshanba Station or Metro Line 1 Changshou Road Station, approx. 10 minutes walk"}, {"address": "No. 60 Shamian South Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Located at the southern tip of Shamian Island adjacent to the Pearl River, Shamian Park is a riverside park brimming with European charm and natural greenery. Home to dozens of century-old banyan and camphor trees, its dense canopy forms a lush natural umbrella. The park features a sculpture garden, a riverside promenade, and open plazas, making it the finest natural spot to admire grand views of the Pearl River, watch the sunset, and experience the historic, exotic charm of the former foreign concessions.", "name": "Shamian Park", "transport": "Metro Line 1 or 6 Huangsha Station Exit F, cross the footbridge, approx. 8 minutes walk"}, {"address": "Daguan River Section, Yongqing Fang, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Winding through the core area of Yongqing Fang, the Daguan River Waterfront Promenade is a revitalized ancient canal landscape strip brought back to life through micro-renovation. The banks are planted with rich Lingnan aquatic plants and weeping willows, equipped with waterfront platforms, wooden boardwalks, and stone benches. Here, the soothing sound of flowing water harmonizes with Lingnan Arcade architecture. Visitors can stroll along the green corridor, watch fish swimming in the water, and enjoy an urban oasis tucked away from the city\u0027s hustle and bustle.", "name": "Yongqing Fang Daguan River Waterfront Promenade", "transport": "Metro Line 1 Changshou Road Station Exit D2, approx. 10 minutes walk"}, {"address": "No. 275 Fangcun Avenue Middle, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Zuiguan Park boasts a long history originating from the famous Qing Dynasty \u0027Zuiguan Garden\u0027 in Fangcun, making it one of the birthplaces of Guangzhou\u0027s traditional flower and bonsai culture. Designed in classic Lingnan garden style, the park features shady trees, small bridges over flowing streams, a large bonsai exhibition area, and greenhouse floral displays filled with seasonal fragrances. With its quiet, serene atmosphere, it preserves the authentic character of old Guangzhou\u0027s flower country and serves as a wonderful retreat for leisurely walks and photography.", "name": "Zuiguan Park", "transport": "Metro Line 1 Fangcun Station Exit C, approx. 5 minutes walk"}, {"address": "No. 26 Nan\u0027an Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Situated along the Pearl River in Liwan District, Guangzhou Youth Park is a comprehensive park combining natural ecology with sports and recreational facilities. Lush with leafy trees, the park boasts expansive lawns, shaded walking paths, and a riverfront landscape belt with fresh, pleasant air. Equipped with basketball courts, badminton courts, and children\u0027s play areas, it is a popular green space for local residents to exercise, enjoy picnics, relax, and take in the river views.", "name": "Guangzhou Youth Park", "transport": "Metro Line 5 Zhongshanba Station, transfer to a bus and get off at Nan\u0027an Road Stop"}, {"address": "Near the junction of Penglai Road and Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.1 stars | Penglai Park is a pocket-sized neighborhood park tucked away among the old streets of Xiguan, surrounded by historic residences and traditional arcade buildings. Though compact, it is lush and vibrant, shaded by mature banyan trees and colorful flora. Serving as a tranquil retreat for long-time Xiguan locals to rest, play chess, and walk their birds, it offers an authentic glimpse into the daily life and warm, bustling atmosphere of old Guangzhou.", "name": "Penglai Park", "transport": "Metro Line 1 Huangsha Station Exit B, approx. 7 minutes walk"}, {"address": "No. 1 Honglou Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Located along the Pearl River near Pearl River Bridge in Liwan District, Haijiao Honglou Riverside Park holds nostalgic waterfront vacation memories for long-time Guangzhou residents. It features a broad riverside green pathway and a sheltered tree belt where pleasant river breezes blow. Visitors can gaze out at the grand Pearl River Bridge and watch boats passing by on the water, making it a quintessential natural park to experience Guangzhou\u0027s unique identity as a \u0027water city\u0027.", "name": "Haijiao Honglou Riverside Park", "transport": "Metro Line 5 Tanwei Station Exit C, approx. 12 minutes walk"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Yongqing Fang Phase II, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Located in Yongqing Fang Phase II, the Moon Bridge is one of Guangzhou\u0027s most popular new night photo landmarks. When lit up at night, this semi-circular arch bridge reflects on the water to form a flawless full moon, exuding poetic romantic Lingnan water town vibes. From dusk till late night, it attracts countless photographers and tourists capturing the stunning v
