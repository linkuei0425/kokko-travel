    <script>
        const dbData = {"baiyun_mountain": {"categories": {"cat_1": {"items": [{"address": "Moxing Summit, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Standing at 382 meters above sea level, Moxing Summit is the highest peak of Baiyun Mountain, historically known as the \u0027First Peak\u0027. The summit houses the time-honored Wishing Lock Bridge, Jimu Pavilion, as well as steles and iconic stone tablets chronicling Baiyun Mountain\u0027s rich history. Offering panoramic views of the entire Guangzhou cityscape, it is a must-visit landmark to experience the blend of natural scenery and local heritage.", "name": "Moxing Summit (Moxing Ling)", "transport": "Take the Baiyun Mountain Cable Car to the Summit Plaza, then transfer to a scenic shuttle bus or walk to Moxing Summit."}, {"address": "Nangu Valley Area, Southern Section of Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Built during the Guangxu reign of the Qing Dynasty, Nengren Temple is the largest and best-preserved classical temple complex in Baiyun Mountain. Built along the mountain slope in a harmonious layout, it includes the Main Hall, Ciyun Hall, and Ksitigarbha Hall. Surrounded by historic relics like \u0027Hupao Spring\u0027, \u0027Sword-Testing Stone\u0027, and Amitabha stone carvings, the temple offers a serene vibe highlighting Lingnan Buddhist architecture.", "name": "Nengren Temple", "transport": "Enter from the South Gate of Baiyun Mountain and walk for about 20 minutes, or take the scenic shuttle bus and get off at Nengren Temple Station."}, {"address": "Yunyan Scenic Area, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Zhengxian Temple was built to commemorate An Qisheng (Zheng Xian), a pre-Qin Dynasty practitioner who gathered medicinal herbs on Baiyun Mountain to heal the sick before attaining immortality. Located next to the Yunyan Scenic Area, this elegant, classic temple hosts the annual \u0027Zhengxian Festival\u0027 on the 25th day of the 7th lunar month\u2014a major traditional Guangzhou folk event drawing crowds to pray and climb the mountain.", "name": "Zhengxian Temple", "transport": "Take the scenic tour car to the Yunyan area and walk directly to Zhengxian Temple."}, {"address": "Moxing Ling Valley Entrance, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Built on ancient temple ruins, the Guangzhou Forest of Stone Tablets is a cultural site blending calligraphy art with Lingnan garden architecture. It features hundreds of steles inscribed with poems and calligraphy from famous historical figures, including Mao Zedong, Dong Biwu, and ancient scholars who praised Baiyun Mountain. With pavilions, winding corridors, streams, and stone carvings complementing each other, it boasts rich cultural depth.", "name": "Guangzhou Forest of Stone Tablets", "transport": "Take the scenic shuttle bus to Summit Plaza, then follow the signs and walk for about 10 minutes."}, {"address": "Jiulong Spring Area, below Moxing Summit, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Nine Dragons Spring is the most famous ancient spring on Baiyun Mountain, named after the legend that nine dragons transformed into its water. The spring features intricately carved dragon heads and a quaint hexagonal pavilion; ancient scholars often brewed tea with its sweet water. Surrounded by Qing Dynasty inscriptions and historic well structures, it remains a beloved historical water source and cultural landmark.", "name": "Nine Dragons Spring (Jiulong Spring)", "transport": "Walk from Summit Plaza toward Moxing Summit for about 15 minutes."}, {"address": "Mountainside above Yuntai Garden, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Built in 1931, the Guangdong Aviation Monument is a solemn landmark commemorating pioneers of modern Chinese aviation and revolutionary martyrs. The majestic monument\u0027s base and shaft are inscribed with the heroic deeds of aviation pioneers, showcasing significant modern revolutionary history and architectural craftsmanship.", "name": "Guangdong Aviation Monument", "transport": "Enter from the South Gate of Baiyun Mountain and follow the hiking trail toward Summit Plaza for about 25 minutes."}, {"address": "Shuangxi Scenic Area, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Originally the site of the famous Song Dynasty Shuangxi Temple, Shuangxi Villa was later rebuilt into a villa complex infused with Lingnan garden aesthetic. Surrounded by twin streams, bamboo groves, and ancient trees, it has hosted notable historic figures and foreign dignitaries. Blending traditional blue-brick and grey-tile architecture with garden landscapes, it is a hidden architectural gem on the mountain.", "name": "Shuangxi Villa", "transport": "Take the scenic shuttle bus to Shuangxi Scenic Area Station, then follow the directional signs to reach the villa."}, {"address": "Santailing Scenic Area, Baiyun Mountain, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.1 stars | A municipal-level protected cultural site, this is the joint tomb of Wu Tingfang\u2014a renowned modern Chinese diplomat and legal scholar\u2014and his son Wu Chaoshu. Combining Chinese and Western architectural elements, the grand cemetery structure features well-preserved tombstones and monuments, preserving historical footprints of modern China\u0027s diplomatic and legal evolution.", "name": "Tomb of Wu Tingfang and Wu Chaoshu", "transport": "Enter from the Santailing trail entrance next to Yuntai Garden and walk for about 15 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Longhugang, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.6 Stars | Located on Longhugang in the Baiyun Mountain Scenic Area, Guangzhou Stele Forest was built on the former site of Baiyun Temple. Today, it stands as a large cultural landmark integrating Lingnan calligraphic art with classical garden landscapes. The park features over a thousand carved stone inscriptions of calligraphic works from ancient to modern masters, including manuscripts by Mao Zedong, Sun Yat-sen, and many renowned Lingnan figures. Strolling through winding corridors and classical pavilions, visitors can admire exquisite stone carvings while experiencing the harmonious blend of calligraphic art and nature.", "name": "Guangzhou Stele Forest", "transport": "Take the Baiyun Mountain Cableway to Peak Square (Shanding Guangchang), then walk for about 10 minutes."}, {"address": "Near Peak Park, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.4 Stars | Built in 1953 and nestled in the Shuangxi Scenic Area of Baiyun Mountain, Shuangxi Villa is a cultural landmark blending traditional Lingnan garden aesthetics with modern architectural design. Premier Zhou Enlai stayed and worked here twice. The villa preserves precious historical artifacts and photos amidst serene surroundings and trickling spring waters. Featuring bamboo shadows, curved corridors, and waterside pavilions, it holds immense artistic value and rich historic significance.", "name": "Shuangxi Villa", "transport": "Take the Baiyun Mountain sightseeing bus and get off at Shuangxi Scenic Area Station."}, {"address": "Inside Yuntai Garden, No. 80 Guangyuan Middle Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.7 Stars | Located within Yuntai Garden at the southern foot of Baiyun Mountain, this modern exhibition hall is set against exquisite Western-style garden architecture. It regularly hosts large floral art exhibitions, international art photography expos, and contemporary sculpture exhibitions. Seamlessly integrating natural light, shadows, and botanical design, it merges visual arts with horticulture, making it a renowned art exhibition space and trendy cultural spot in Guangzhou.", "name": "Yuntai Garden Art Exhibition Hall", "transport": "Take Bus 24, 63, or 285 to Yuntai Garden Terminal Station and walk from there."}, {"address": "Summit of Moxing Ridge, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 Stars | Perched on the summit of Moxing Ridge\u2014the highest peak of Baiyun Mountain\u2014this hall is dedicated to showcasing the thousand-year history of Baiyun Mountain and Lingnan cultural heritage. It exhibits rare historical documents and photographs documenting the evolution of ancient sites, poems by historical scholars, and the mountain\u0027s geographical features. Standing on the top-floor platform, visitors can enjoy a panoramic 360-degree view of the Guangzhou city skyline.", "name": "Moxing Ridge Cultural \u0026 History Exhibition Hall", "transport": "Transfer to the Moxing Ridge shuttle bus at Baiyun Mountain Peak Square, or hike up via the summit trail."}, {"address": "No. 13 Luhu Road, Yuexiu District, Guangzhou City (Next to Luhu Park, southern foot of Baiyun Mountain)", "feature": "\u2b50 4.7 Stars | Located beside the Luhu Scenic Area at the southern foot of Baiyun Mountain, this architectural masterpiece was designed by famous architect Mo Bozhi. It combines traditional Lingnan architectural elements with modern museum functionality. The hall originally housed a vast collection of historic Chinese paintings and calligraphy, Lingnan School masterpieces, and sculptures. Surrounded by winding corridors and waterside pavilions, its unique architecture and picturesque lake views continue to attract architecture and art enthusiasts even after the relocation of major exhibits to the new site.", "name": "Guangzhou Museum of Art (Luhu Site)", "transport": "Take Bus 109, 110, or 245 to Luhu Park Station."}, {"address": "Southern Tour Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 Stars | As one of the oldest ancient temples on Baiyun Mountain, Nengren Temple features an attached Cultural and Art Hall showcasing rich Buddhist art carvings, ancient architectural elements, and calligraphic works by prominent monks across generations. Built along the mountain slopes, the temple complex retains historical relics of Baiyun Mountain\u0027s ancient scenic spots such as \u0027Running Tiger Spring\u0027 and \u0027Huan Cui Tao\u0027, combining religious artistic beauty with a tranquil, cultural atmosphere.", "name": "Nengren Temple Cultural \u0026 Art Hall", "transport": "Enter via the South Gate of Baiyun Mountain and walk along the main road for about 25 minutes, or take a sightseeing car."}, {"address": "Inside Mingchun Valley, Peak Park, Baiyun Mountain, Baiyun District, Guangzhou City", "feature": "\u2b50 4.3 Stars | Nestled in the Dishuiyan Scenic Area of Baiyun Mountain, Mingchun Valley is home to one of China\u0027s largest natural aviary parks. Its exhibition hall combines bird ecological education with specimen art displays, using vivid audiovisual effects to present Lingnan\u0027s avian ecology and conservation history. The hall also features interactive art zones, allowing visitors to deeply appreciate the harmonious coexistence of ecological art and nature alongside flocking birds.", "name": "Mingchun Valley Nature \u0026 Culture Exhibition Hall", "transport": "Take the Baiyun Mountain Cableway to Peak Park Station, then walk for about 3 minutes."}, {"address": "Inside Juzhuang Villa, Luhu Park, Luhu Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.4 Stars | Located within the Luhu Scenic Area of Baiyun Mountain, Juzhuang Villa is an elegant, traditional Lingnan courtyard-style cultural building. The hall regularly hosts folk craft exhibitions, Lingnan tea culture showcases, and Guqin music appreciation sessions. Surrounded by lush greenery and winding paths, Juzhuang perfectly merges traditional Lingnan courtyard art with contemporary cultural exhibitions, serving as a charming hub for cultural exchanges.", "name": "Juzhuang Villa \u0026 Cultural Exhibition Hall", "transport": "Take Bus 190 or 546 to Luhu Park Station, then walk for about 8 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Inside Baiyun Mountain Scenic Area, Guangyuan Middle Road, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Originally known as \u0027Diyi Mountain\u0027 (First Mountain), Moxing Summit stands at an altitude of 382 meters, making it the highest peak of Baiyun Mountain. Standing at the summit offers a sweeping panoramic view of Guangzhou\u0027s bustling cityscape, which is especially breathtaking during sunset and as night falls over the city lights. The area features attractions such as the Wishing Lock Walkway, giant stone landmarks, and Zhaixing Pavilion. Blessed with cool year-round breezes and lush greenery, it is a premier spot for hiking, sightseeing, and immersing in nature.", "name": "Moxing Summit", "transport": "Take Metro Line 2 to Guangzhou Railway Station, transfer to Bus 257 to Baiyun Cableway Station, take the cable car up to Summit Square, and then walk for about 15 minutes."}, {"address": "South Gate of Baiyun Mountain Scenic Area, No. 80 Guangyuan Middle Road, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located at the southern foot entrance of Baiyun Mountain, Yuntai Garden is a large modern garden that seamlessly blends Chinese and Western landscape design. Famous for its year-round floral displays, the park features a massive artificial waterfall, Roman colonnades, a rose garden, and a greenhouse aquarium. Spectacular themed flower shows are held every Chinese New Year and major holidays, filling the park with vibrant colors that draw countless photography enthusiasts and families.", "name": "Yuntai Garden", "transport": "Take Bus 24, 63, 285, or B16 to \u0027Yuntai Garden Bus Terminus\u0027 and walk directly to the entrance."}, {"address": "Next to Summit Square, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Mingchun Valley is China\u0027s largest natural aviary-style bird-watching area, situated on the south side of Summit Park on Baiyun Mountain. A massive steel-mesh structure covers the entire valley to recreate a natural ecological sanctuary, providing a habitat for hundreds of rare bird species. Visitors can stroll along elevated boardwalks to observe birds soaring and nesting up close. With babbling streams, dense foliage, a peacock garden, and live performance zones, it offers an engaging ecological experience for families.", "name": "Mingchun Valley", "transport": "Take the Baiyun Cableway from the South Gate of Baiyun Mountain to Summit Square, then walk for about 3 minutes after exiting the cable car station."}, {"address": "Inside Mingzhu Hall Tour Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Nestled within the Mingzhu Hall Scenic Area of Baiyun Mountain, Peach Blossom Valley is a scenic park centered around peach blossoms. Thousands of peach trees of various species bloom along a crystal-clear stream. During peak bloom from February to March, the valley transforms into a sea of rosy pink clouds, evoking the legendary \u0027Peach Blossom Spring\u0027 described by poet Tao Yuanming. Picturesque bridges, flowing water, and traditional pavilions make it a magical spot for spring flower viewing.", "name": "Peach Blossom Valley", "transport": "Enter via the West Gate of Baiyun Mountain, take the scenic sightseeing shuttle to Mingzhu Hall Station, and walk for about 5 minutes."}, {"address": "Inside Mingzhu Hall Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Situated at the northwestern foot of Baiyun Mountain, Huangpodong Reservoir is framed by mountains on three sides, with a glassy lake reflecting the surrounding green hills and bamboo groves. The pristine ecosystem features lakeside walkways and rest pavilions where egrets can often be seen gliding across the water. A peaceful walk here offers a poetic retreat from the city. In autumn, the fiery red needles of the lakeside dawn redwoods make it a top spot for scenic photos.", "name": "Huangpodong Reservoir", "transport": "Enter through the West Gate of Baiyun Mountain (Baiyun Avenue South), walk along the main road for about 20 minutes, or take the scenic sightseeing shuttle to Huangpodong Reservoir Station."}, {"address": "No. 11 Luhu Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Situated at the southern foot of Baiyun Mountain, Luhu Park is one of Guangzhou\u0027s iconic large landscape parks. Centered around expansive Lu Lake, the reflection of hills on the water is punctuated by classical lakeside architecture like Jufang Garden and Xinghai Garden. The park offers a floating boardwalk, a lake-looping greenway, and boating activities. With seasonal highlights like blooming kapok flowers and rusty-red bald cypresses, it exudes quintessential Lingnan water-town charm and serves as a favorite retreat for local residents.", "name": "Luhu Park", "transport": "Take Metro Line 5 to \u0027Xiaobei Station\u0027 Exit C and walk for about 15 minutes; or take Bus 109, 110, or 245 to \u0027Luhu Park Station\u0027."}, {"address": "No. 1038 Baiyun Avenue South, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Positioned at the western foot of Baiyun Mountain, Yunxi Ecological Park is one of urban Guangzhou\u0027s largest free-admission ecological parks. Built along the mountain slope, it contains multiple ecological areas like Yunying Valley, Lotus Pond, and Fruit Fragrance Garden, connected by a wooden boardwalk several kilometers long. Dense forest cover gives it exceptionally high concentrations of negative oxygen ions, earning it the title \u0027Urban Green Lung\u0027\u2014perfect for hiking, family outings, and a refreshing breath of fresh air.", "name": "Yunxi Ecological Park", "transport": "Take Metro Line 2 to \u0027Baiyun Park Station\u0027 Exit D, then walk for about 10 minutes to reach the park entrance."}, {"address": "Junction of Tongxin Road and Feie Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Located in the Feie Ling section of Baiyun Mountain, Guangzhou Sculpture Park harmoniously weaves modern sculptural art into natural forest landscapes. Covering a wide expanse, it is divided into the Lingnan Culture Zone, Historical Culture Zone, and Modern Art Zone, exhibiting large-scale sculptures that tell the story of Guangzhou\u0027s history and spirit. With shaded trails and wide open lawns, it functions both as an outdoor art gallery and a favorite venue for picnics and leisure strolls.", "name": "Guangzhou Sculpture Park", "transport": "Take Bus 36, 66, 189, or 278 to \u0027Xiatang Xi Road Station\u0027 or \u0027Sculpture Park Station\u0027."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside Baiyun Mountain Scenic Area, Guangyuan Middle Road, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Moxing Ridge is the highest peak of Baiyun Mountain, standing at an altitude of 382 meters and formerly known as the \u0027First Peak\u0027. Standing at the top, you can enjoy a bustling panoramic view of the entire Guangzhou city area. Especially during clear sunsets or as night lights turn on, this becomes the ultimate photo spot for photography enthusiasts to capture the Guangzhou skyline. The peak features a massive wishing lock chain and a landmark stele where many visitors attach wish locks for good fortune, making it a classic landmark you shouldn\u0027t miss when visiting Baiyun Mountain.", "name": "Moxing Ridge", "transport": "Take the Baiyun Mountain Cableway to Peak Square, then walk or transfer to a scenic sightseeing bus to reach the Moxing Ridge Scenic Area."}, {"address": "South Gate of Baiyun Mountain Scenic Area, No. 801 Guangyuan Middle Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Located at the southern entrance of Baiyun Mountain, Yuntai Garden is a large, modern garden combining Chinese and Western landscape design, known as the \u0027Pearl of the Flower City\u0027. Flowers bloom year-round inside, featuring glass greenhouses, European-style fountain plazas, rose gardens, and seasonal themed flower shows. Its vibrant colors and delicate landscaping attract countless influencers and wedding photographers, making it a popular photo hotspot with rich European charm.", "name": "Yuntai Garden", "transport": "Take Metro Line 11 to Yuntai Garden Station, or take Bus 24, 63, or 240 to Yuntai Garden Bus Terminal."}, {"address": "Inside Peak Park, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Mingchun Valley is currently China\u0027s largest natural aviary-style bird-watching area, featuring a giant mesh net covering a valley to recreate a natural forest environment. Hundreds of rare bird species live here; as visitors stroll along elevated boardwalks, they can get up close to peacocks fanning their tails, flamingos wading gracefully, and songbirds darting through trees. Beyond bird interactions, the valley offers engaging educational exhibits and natural scenery, making it ideal for family trips and nature photography.", "name": "Mingchun Valley", "transport": "Take the Baiyun Cableway from Baiyun Mountain South Gate to Peak Park Station; walk about 3 minutes after exiting the cable car."}, {"address": "Inside Mingzhu Hall Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Located within the Mingzhu Hall Scenic Area of Baiyun Mountain, Peach Blossom Ravine is a Lingnan natural landscape garden designed to evoke Tao Yuanming\u0027s \u0027The Peach Blossom Spring\u0027. From Chinese New Year to March, thousands of peach trees bloom across the valley, creating a crimson sea of pink flowers that contrasts beautifully with small bridges, running streams, and pavilions. Many visitors dress in traditional Hanfu for photos, making it the top choice for spring outings, flower viewing, and traditional Chinese-style photo shoots.", "name": "Peach Blossom Ravine", "transport": "Enter through Baiyun Mountain West Gate, take a scenic sightseeing bus to Mingzhu Hall Station, then walk a short distance."}, {"address": "Inside Mingzhu Hall Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Nestled at the northwestern foot of Baiyun Mountain and surrounded by hills on three sides, Huangpodong Reservoir features crystal-clear waters framed by lush forests and dawn redwoods. Every autumn and winter, the redwoods turn brilliant shades of gold and red, reflecting on the azure water like a natural oil painting, attracting crowds for picnics, camping, and photos. Strolling along the lakeside wooden boardwalk offers a serene escape from the city bustle, making it a soothing landscape spot on Baiyun Mountain.", "name": "Huangpodong Reservoir", "transport": "Walk or take a sightseeing bus from Baiyun Mountain West Gate (Baiyun Avenue side) to Huangpodong Reservoir."}, {"address": "No. 11 Luhu Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Situated at the southern foot of Baiyun Mountain, Luhu Park is encircled by hills and waters with breathtaking scenery. Inside the park, Honghu Tower is a classic five-story Lingnan-style pagoda that echoes Zhenhai Tower on Yuexiu Mountain, earning the saying \u0027Zhenhai in the north, Honghu in the south\u0027. Climbing to the top rewards you with panoramic views of Luhu Lake, the greenery of Baiyun Mountain, and the distant Zhujiang New Town skyscrapers\u2014a prime vantage point for capturing the fusion of old and new Guangzhou.", "name": "Luhu Park and Honghu Tower", "transport": "Take Bus 109, 110, 245, or 546 to Luhu Park Station and walk to the destination."}, {"address": "Southwest corner of Peak Square, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | \u0027Baiyun Evening View\u0027 has been one of the traditional Eight Sights of Guangzhou since the Yuan Dynasty. Located at the observation deck on the southwest side of Peak Park, it was historically the premier spot to admire Guangzhou\u0027s sunsets and night vistas. Today, offering an unobstructed, sweeping view, it allows visitors to watch the golden sunset cast over the city and witness the spectacular light show of Zhujiang New Town and Canton Tower at night, making it a popular romantic photo spot for sunsets and nightscapes.", "name": "Baiyun Evening View", "transport": "Take the Baiyun Cableway to Peak Square, or walk to Peak Square and head to the southwest observation deck."}, {"address": "Baiyun Mountain South Road (Inside Baiyun Mountain Scenic Area), Baiyun District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Originally built during the Xianfeng reign of the Qing Dynasty, Nengren Temple is the largest and best-preserved ancient Esoteric Buddhist temple on Baiyun Mountain. Built along the mountain slopes, the temple complex features towering ancient trees, bubbling springs, and historical sites such as \u0027Tiger Spring\u0027, \u0027Huancui Waves\u0027, and \u0027Yuhong Pool\u0027. The tranquil and rustic ambiance, with red walls and yellow tiles nestled among lush greenery, radiates a solemn, mystical atmosphere that attracts visitors seeking peace of mind and traditional architecture photography.", "name": "Nengren Temple", "transport": "Enter through Baiyun Mountain South Gate and walk along the main hiking trail for about 20 minutes, or take a scenic sightseeing bus to Nengren Temple Station."}], "name": "Popular Photo Hotspots"}}, "name": "Baiyun Mountain Natural Scenic Area"}, "beijing_lu_yuexiu": {"categories": {"cat_1": {"items": [{"address": "Inside Beijing Road Pedestrian Street, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located at the heart of Beijing Road Pedestrian Street, this site was discovered in 2002 during road renovations. Protected under tempered glass panels, visitors can clearly see 11 layers of ancient road structures superimposed from the Tang, Song, Yuan, Ming, Qing, and Republic of China eras. It physically demonstrates Guangzhou\u0027s central urban axis and vibrant commercial history, unchanged for thousands of years. When illuminated at night, the ancient road structure becomes even clearer, making it a must-see historical wonder on Beijing Road.", "name": "Beijing Road Ancient Avenue Site", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station (Exit D), then walk for about 5 minutes."}, {"address": "No. 56 Yide Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 stars | Built starting in 1863 and taking 25 years to complete, this is one of only four all-granite Gothic cathedrals in the world and the most magnificent Gothic Catholic church in the Far East. Featuring twin spires soaring 58.5 meters high, its interior boasts magnificent stained-glass windows, giant Gothic vaults, and exquisite carvings. The light filtering through the stained glass creates a sacred and artistically breathtaking atmosphere. Constructed entirely from granite blocks, locals affectionately call it the \u0027Stone House\u0027 (Shi Shi).", "name": "Sacred Heart Cathedral", "transport": "Take Guangzhou Metro Line 6 to Yide Lu Station (Exit B), then walk for about 5 minutes."}, {"address": "Inside Yuexiu Park, No. 988 Jiefang North Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Perched atop Yuexiu Hill inside Yuexiu Park, this grand tower was built in 1380 during the Ming Dynasty and boasts a history of over 600 years. Renowned as the \u0027First Scenic Wonder of Lingnan,\u0027 this majestic five-story structure with red walls and green tiles is colloquially known as the \u0027Five-Story Building.\u0027 Once the northeast watchtower of Guangzhou\u0027s ancient city walls, its top floor offers breathtaking panoramic views blending ancient and modern Guangzhou. It now houses the Guangzhou Museum, displaying a rich collection of artifacts tracing local history from the Neolithic Age to modern times.", "name": "Zhenhai Tower", "transport": "Take Guangzhou Metro Line 2 to Yuexiu Park Station (Exit B1), enter the park, and follow the signs for about a 10-minute walk."}, {"address": "No. 259 Dongfeng Middle Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Built in memory of Dr. Sun Yat-sen, the great pioneer of China\u0027s democratic revolution, and completed in 1931, this majestic octagonal palace-style building blends Chinese and Western architectural highlights. Most impressive is its spacious main hall, completely column-free inside, supported by an ingenious steel cantilever truss system that holds up the massive sapphire-blue glazed tile roof. A bronze statue of Dr. Sun Yat-sen stands in front, surrounded by lush trees, including Guangzhou\u0027s oldest kapok tree, presenting a solemn and serene setting throughout the year.", "name": "Sun Yat-sen Memorial Hall", "transport": "Take Guangzhou Metro Line 2 to Sun Yat-sen Memorial Hall Station (Exit C); the destination is right outside the exit."}, {"address": "No. 109 Guangxiao Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 stars | As the oldest and grandest Zen Buddhist temple in Lingnan, a local saying goes: \u0027Guangxiao Temple predates Guangzhou City.\u0027 Founded during the Three Kingdoms period, it is famous as the place where Huineng, the Sixth Patriarch of Zen, was ordained and shared his classic Zen philosophical debate on whether \u0027the wind moves or the banner moves.\u0027 The grounds preserve rich historical relics, including the Tang Dynasty Kezi Well, Song Dynasty Main Shrine Hall, North and South Iron Pagodas, and sacred Bodhi trees. Brimming with burning incense and elegant ancient architecture, it embodies deep religious heritage and the style of the Tang and Song dynasties.", "name": "Guangxiao Temple", "transport": "Take Guangzhou Metro Line 1 to Ximenkou Station (Exit C), then walk for about 5 minutes."}, {"address": "No. 87 Liurong Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Founded in 537 AD during the Liang Dynasty, this temple has over 1,500 years of history and is one of Guangzhou\u0027s four great Buddhist monasteries. The legendary poet Su Dongpo once visited and was so inspired by six majestic ancient banyan trees on the grounds that he inscribed the calligraphic phrase \u0027Six Banyans\u0027 (Liu Rong), giving the temple its modern name. Its centerpiece, the 57-meter-tall Flower Pagoda, is an octagonal, nine-story brick-and-wood pagoda known for its colorful, intricate design. Housing sacred Buddha relics and historical treasures, it is an iconic historical Buddhist landmark in old Guangzhou.", "name": "Six Banyan Trees Temple", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station (Exit I2), then walk for about 8 minutes."}, {"address": "No. 316 Zhongshan 4th Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Adjacent to Beijing Road Pedestrian Street, this site contains the palace ruins of the Nanyue and Southern Han Kingdoms dating back to the Qin and Han Dynasties. It features China\u0027s earliest known Qin-Han garden waterscape remains, including a winding stone brook, a large royal garden pond, and palace foundations. Utilizing modern museum displays and protective canopies, the 2,000-year-old subterranean royal ruins are preserved and presented in situ, allowing visitors an immersive experience of Lingnan\u0027s early civilization and distinctive architectural legacy.", "name": "Nanyue King Museum - Palace Site", "transport": "Take Guangzhou Metro Line 1 to Peasant Movement Institute Station (Exit D), then walk for about 3 minutes."}, {"address": "No. 21 Huixin Middle Street, Huifu East Road, Yuexiu District, Guangzhou City, Guangdong Province (Next to Beijing Road Pedestrian Street)", "feature": "\u2b50 4.7 stars | Originally founded during the Southern Han Dynasty and rebuilt during the Kangxi reign of the Qing Dynasty by Prince Shang Kexi, this temple takes its name from the three massive brass Buddha statues enshrined in its main hall. Tucked away in the bustling Beijing Road shopping district, this ancient temple recently added a striking Dharma Propagation Building. At night, when illuminated, the brilliant building echoes the magical bathhouse from the anime film Spirited Away, delivering a stunning visual blend of ancient spirituality and modern urban vibrancy.", "name": "Dafo Temple", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station (Exit D), then walk for about 6 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 56 Yide Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 Stars | The Sacred Heart Cathedral of Guangzhou is one of only four all-granite Gothic cathedrals in the world, holding immense architectural and artistic value. Its soaring twin spires reach toward the sky, while sunlight streams through magnificent stained-glass rose windows, casting vibrant, heavenly light patterns inside. Built in the late 19th century entirely out of granite blocks, locals affectionately call it the \u0027Stone House\u0027 (\u0027Shi Shi\u0027). Inside, the soaring vaulted ceilings and elegant pointed arches create a rich European classical sacred atmosphere. Located in Yuexiu District, it is an absolute must-visit landmark for history, culture, and aesthetic photography.", "name": "Sacred Heart Cathedral of Guangzhou", "transport": "Take Guangzhou Metro Line 6 to Yide Lu Station, Exit A; walk for about 5 minutes."}, {"address": "No. 316 Zhongshan 4th Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Located right next to the bustling Beijing Road Pedestrian Street, this museum is built directly atop the site of the Nanyue Kingdom Palace, dating back over 2,000 years and showcasing Guangzhou\u0027s profound urban heritage. It features China\u0027s earliest known ancient royal garden ruins\u2014the \u0027Meandering Stone Canal\u0027\u2014alongside layered archaeological remains spanning the Eastern Han, Tang, and Song dynasties. Visitors can walk on elevated glass boardwalks to overlook subterranean structural ruins, inspect excavated wooden slips, roof tiles, and ceramics, and immerse themselves in Lingnan civilization and Guangzhou\u0027s history as the starting point of the Maritime Silk Road.", "name": "Museum of the Nanyue King - Palace Site", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station, Exit F; walk for about 5 minutes."}, {"address": "No. 867 Jiefang North Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 Stars | Situated at the foot of Yuexiu Hill, this is the largest Western Han Dynasty tomb with the richest collection of burial goods discovered in the Lingnan region. Built into the hillside, the museum seamlessly incorporates the original tomb of Zhao Mo, the second king of the Nanyue Kingdom. Its most famous treasure is the legendary Jade Shroud Sewn with Silk Threads\u2014the only one of its kind ever unearthed in China. Other highlights include intricately carved jade plaques with dragon and phoenix motifs and a horn-shaped jade cup, both demonstrating supreme ancient craftsmanship. With rich exhibits and modern display technology, it is a premier cultural destination for exploring ancient Lingnan history.", "name": "Museum of the Nanyue King - King Tomb Site", "transport": "Take Guangzhou Metro Line 2 to Yuexiu Park Station, Exit E; walk for about 3 minutes."}, {"address": "No. 200 Qiyi Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 Stars | Formerly the Guangzhou Police Bureau during the Republic of China period, this historic building blends Western classical Baroque elements with traditional Lingnan architectural features. Its gray walls and red-framed windows impart a captivating retro and artistic vibe. During the Guangzhou Uprising in 1927, China\u0027s first urban Soviet government\u2014the Guangzhou Soviet\u2014was established here. The museum faithfully restores historical scenes such as the uprising command center, guardroom, and holding cells, while hosting permanent exhibitions on Guangzhou\u0027s modern revolutionary history, inviting visitors to reflect on the city\u0027s heroic past.", "name": "Guangzhou Uprising Museum", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station, Exit J; walk for about 3 minutes."}, {"address": "No. 215 Wenming Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located on Wenming Road, this memorial hall sits within the site of the former Guangdong Provincial Assembly, featuring distinctive Lingnan and Western-style architecture. Known locally as the \u0027Clock Tower\u0027 because of the clock at its apex, it was here that literary giant Lu Xun taught at Sun Yat-sen University and lived in 1927. The hall recreates Lu Xun\u0027s bedroom, study, and key meeting rooms from the Great Revolution era. Lush green courtyards complement the vintage red brick and yellow walls, creating a tranquil, artistic atmosphere ideal for literature enthusiasts seeking to trace the master\u0027s footsteps.", "name": "Guangzhou Lu Xun Memorial Hall", "transport": "Take Guangzhou Metro Line 1 to Peasant Movement Institute Station, Exit A; walk for about 8 minutes."}, {"address": "Inside Yuexiu Park, No. 988 Jiefang North Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated inside Yuexiu Park, Zhenhai Tower was originally built during the Hongwu period of the Ming Dynasty and boasts a 600-year history. As one of the classic \u0027Eight Views of Guangzhou,\u0027 this grand five-story structure is also known as the \u0027Five-Story Pagoda.\u0027 Serving as Guangzhou\u0027s premier historical museum, it showcases thousands of years of urban development from the Neolithic age to modern times, featuring extensive collections of export ceramics, Lingnan handicrafts, and historical maps. Ascending to the top offers panoramic views of Yuexiu Hill\u0027s lush greenery and Guangzhou\u0027s old city district\u2014a perfect combination of natural scenery and rich history.", "name": "Guangzhou Museum - Zhenhai Tower", "transport": "Take Guangzhou Metro Line 2 to Yuexiu Park Station, Exit B1; enter the park and follow the signs for about 10 minutes."}, {"address": "No. 42 Zhongshan 4th Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located on Zhongshan 4th Road, this elegant and solemn architectural complex was originally the Panyu Confucian Temple built in the Ming Dynasty. Featuring classic Dacheng Hall styling with sweeping eave cornices, red walls, yellow roof tiles, a Lingxing Gate, and a ceremonial pond, it embodies majestic ancient architectural beauty. In 1926, Mao Zedong chaired the 6th session of the Peasant Movement Institute here. The venue preserves the ancient temple structure and serene shade trees while displaying historical relics and restored student dormitories, offering visitors a timeless, poetic ambiance amidst red walls and rich history.", "name": "Peasant Movement Institute", "transport": "Take Guangzhou Metro Line 1 to Peasant Movement Institute Station, Exit C; directly accessible upon exiting."}, {"address": "No. 259 Dongfeng Middle Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 Stars | Guangzhou Sun Yat-sen Memorial Hall is a magnificent octagonal structure designed by renowned architect Lu Yanzhi, perfectly blending traditional Chinese palace aesthetics with modern steel-frame engineering. Its sweeping blue-glazed tile roof seamlessly pairs with striking red columns. Inside, a column-free cantilevered beam architecture provides superb sightlines and acoustics. The memorial hall is surrounded by century-old trees and manicured lawns, including Guangzhou\u0027s oldest kapok tree. Beyond honoring Dr. Sun Yat-sen, it serves as a premier cultural venue for major art performances and world-class concerts in Guangzhou.", "name": "Sun Yat-sen Memorial Hall", "transport": "Take Guangzhou Metro Line 2 to Sun Yat-sen Memorial Hall Station, Exit C; directly accessible upon exiting."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 988 Jiefang North Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Yuexiu Park is the largest comprehensive park in downtown Guangzhou and one of the Eight Sights of Guangzhou. Combining lush mountains and clear waters, it houses precious historical landmarks such as the iconic Five-Rams Sculpture, ancient Ming Dynasty city walls, Zhenhai Tower (Guangzhou Museum), and Zhenshuo Tower. Visitors can stroll along shaded pathways, experience the relaxed morning exercise culture of old Guangzhou, or paddle boats on Dongxiu and Nanxiu Lakes, fully immersing in a seamless blend of natural beauty and thousands of years of historical heritage.", "name": "Yuexiu Park", "transport": "Metro Line 2 \u0027Yuexiu Park Station\u0027, Exit B1"}, {"address": "No. 1 Fuqian Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Established in 1921, People\u0027s Park is known as the \u0027First Park of Guangzhou\u0027 and sits on the city\u0027s traditional central axis. Designed with a geometric Mediterranean layout, it features lush green lawns, ancient towering trees, and a large central fountain pool. Once the site of Guangzhou\u0027s government offices during the Sui and Tang Dynasties, it boasts a long historical legacy. Today, it is a bustling hub where locals play chess, sing Cantonese opera, and practice Tai Chi, offering a rich sense of local life and serving as an excellent spot to experience the daily rhythm of old Guangzhou.", "name": "People\u0027s Park", "transport": "Metro Line 1 or Line 2 \u0027Gongyuanqian Station\u0027, Exit I2, approx. 100m walk"}, {"address": "No. 901 Jiefang North Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Guangzhou Orchid Garden is an exquisite Lingnan-style classical garden dedicated specifically to showcasing orchids. Compact and serene, it features hundreds of species and tens of thousands of pots of orchids. Complemented by winding paths, waterside pavilions, rockeries, and bamboo-lined streams, it presents a stunning aesthetic where every step reveals a new view. Far from the city\u0027s hustle, the subtle fragrance of orchids fills the air, making it a favorite hidden sanctuary for photography lovers, Hanfu enthusiasts, and tea lovers alike.", "name": "Guangzhou Orchid Garden", "transport": "Metro Line 2 \u0027Yuexiu Park Station\u0027, Exit B2, walk across the street"}, {"address": "No. 100 Liuhua Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Centered around a vast artificial lake, Liuhuahu Park captures the charming vibe of a traditional Lingnan water town. The park is divided into three main scenic zones, with its most iconic highlights being the European-style \u0027Frankfurt Garden\u0027 and the white classical European castle known as \u0027Liuhua Tea Art Castle\u0027. Shaded by trees and decorated with colorful flowers, the park also houses a Bird Island that attracts numerous migratory birds every year. It is a fantastic place to walk along the lakeside corridors, go boating, or watch the magnificent sunset over the lake.", "name": "Liuhuahu Park", "transport": "Metro Line 2 \u0027Yuexiu Park Station\u0027, Exit C, approx. 10-min walk"}, {"address": "No. 92 Zhongshan 3rd Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Guangzhou Martyrs\u0027 Memorial Park seamlessly combines monumental architecture with natural landscape design. Boasting high greenery coverage, the park features majestic pine and cypress avenues, a lotus pond, and the Lingnan-style \u0027Sino-Korean Friendship Pavilion\u0027. In summer, thousands of blooming lotuses cover the lake surface, attracting countless visitors for photos. Elegant and solemn, it serves as an urban oasis providing both historical reflection and everyday relaxation.", "name": "Guangzhou Martyrs\u0027 Memorial Park", "transport": "Metro Line 1 \u0027Martyrs\u0027 Park Station\u0027, Exit D"}, {"address": "No. 123 Donghu Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Commonly known as \u0027Donghu Park\u0027, Dongshan Lake Park is one of Guangzhou\u0027s four traditional artificial lake parks. It features a vast water surface with four islets connected by picturesque bridges, including the Nine-Bend Bridge and the Five-Arch Bridge. The park\u0027s most popular photo spot is capturing the \u0027Nine-Bend Bridge framed with Canton Tower\u0027 in one frame. At sunset, modern skyscrapers and classic bridges reflect on the lake, showing off Guangzhou\u0027s unique charm of blending the old and new. It is also the most relaxing park next to the historic Dongshan Mansion area.", "name": "Dongshan Lake Park", "transport": "Metro Line 6 \u0027Donghu Station\u0027, Exit B2"}, {"address": "Qingbo Road, Ersha Island, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated at the eastern tip of Ersha Island in the middle of the Pearl River, Ersha Island Art Park boasts vast sprawling lawns and modern scenic walkways. It offers an incredible, unobstructed view of Guangzhou\u0027s iconic Canton Tower and the Zhujiang New Town skyline. With its vibrant green grass, visitors are often seen picnicking, flying kites, or cycling here. As night falls and gentle river breezes blow, the glowing city lights across the river make this a premier open-air park to experience Guangzhou\u0027s modern charm and riverside nature.", "name": "Ersha Island Art Park", "transport": "Take APM Line to \u0027Haixinsha Station\u0027 and cross the bridge on foot, or take Bus 57 to \u0027Ersha Dong Station\u0027"}, {"address": "No. 11 Luhu Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located at the southern foot of Baiyun Mountain, Luhu Park is a large mountain lake park in Yuexiu District where mountains meet waters. The lake is clear, fringed by weeping willows and redwood pine trees, offering unique beauty across all four seasons\u2014especially in autumn and winter when the dawn redwoods turn vibrant red along the shores. Home to the famous Lingnan garden building \u0027Jufang Garden\u0027 and a beautiful \u0027Floating Dawn Redwood Boardwalk\u0027, visitors can cycle around the lake, go boating, or walk along the trails, immersing themselves in fresh nature and natural phytoncides.", "name": "Luhu Park", "transport": "Metro Line 5 \u0027Xiaobei Station\u0027, Exit C, approx. 15-min walk, or take Bus 109 to \u0027Luhu Station\u0027"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Located in the most bustling commercial district of central Guangzhou, its history dates back over a thousand years. Beneath a large glass canopy in the center of the street lies the Millennium Ancient Road Relics, displaying stone paving structures from the Song, Yuan, Ming, and Qing dynasties\u2014a seamless blending of history and modern commerce. Blazing with bright lights and lined with shops at night, it\u0027s a must-visit top check-in spot for every traveler in Guangzhou.", "name": "Beijing Road Pedestrian Street", "transport": "Take Metro Line 1 or Line 6 to Gongyuanqian Station or Beijing Lu Station, then walk about 3 minutes after exiting."}, {"address": "No. 21 Huixin Middle Street, Huifu East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 Stars | A thousand-year-old ancient temple dating back to the Southern Han period of Lingnan, nestled within the bustling Beijing Road shopping area. The grand Dharma Propagation Building showcases impressive traditional architectural style. As dusk falls and the lights turn on, golden illumination lights up the multi-story pavilion\u2014a spectacular sight praised by tourists as Guangzhou\u0027s real-life \u0027Spirited Away\u0027 pavilion, making it an extremely popular night photography spot.", "name": "Guangzhou Da Fo Temple (Grand Buddha Temple)", "transport": "Take Metro Line 6 to Beijing Lu Station (Exit B), then walk about 5 minutes."}, {"address": "No. 56 Yide Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.8 Stars | One of only four all-granite Gothic cathedrals in the world, built over 25 years. Sky-piercing twin spires, majestic stone pillars, and stained-glass windows crafted by French artisans interweave a rich European classical atmosphere. In the early morning or afternoon, sunlight filters through the stained glass into the interior, casting vibrant lights and shadows that evoke a sacred, artistically breathtaking feeling.", "name": "Sacred Heart Cathedral (Shishi)", "transport": "Take Metro Line 6 to Yide Lu Station (Exit A), then walk about 8 minutes."}, {"address": "No. 867 Jiefang North Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 Stars | Built directly over the tomb site of Zhao Mo, the second king of the Western Han Nanyue Kingdom, this museum houses an exceptionally intact tomb structure and national treasures such as the jade burial suit sewn with silk threads. The red-brick architecture combines distinct Lingnan heritage with modern design, making it not only an essential destination for exploring Guangzhou\u0027s 2,000-year history but also a stylish cultural photography spot.", "name": "Museum of the Nanyue King - Tomb Site", "transport": "Take Metro Line 2 to Yuexiu Park Station (Exit E), then walk about 3 minutes."}, {"address": "No. 259 Dongfeng Middle Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | A grand architectural landmark built to honor Dr. Sun Yat-sen, the great pioneer of China\u0027s democratic revolution. Featuring a traditional octagonal palace design, its blue glazed tile roof contrasts beautifully with red pillars and yellow walls. The interior cleverly utilizes steel framing and concrete to create a vast, column-free hall. Surrounded by lush greenery, the grounds also house a 300-year-old \u0027King of Kapok Trees\u0027, making it rich in both historical significance and aesthetic appeal.", "name": "Sun Yat-sen Memorial Hall", "transport": "Take Metro Line 2 to Sun Yat-sen Memorial Hall Station (Exit C), accessible directly upon exit."}, {"address": "No. 988 Jiefang North Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | The largest comprehensive natural park in urban Guangzhou, featuring the iconic \u0027Five Rams Sculpture\u0027\u2014the primary symbol behind Guangzhou\u0027s nicknames \u0027City of Rams\u0027 and \u0027City of Ears of Rice\u0027. Surrounded by lush greenery and scenic hills and lakes, the park also houses ancient Ming Dynasty city walls and Zhenhai Tower, making it a quintessential destination to experience local lifestyle, rich history, and natural beauty.", "name": "Yuexiu Park and Five Rams Sculpture", "transport": "Take Metro Line 2 to Yuexiu Park Station (Exit B1), reachable within a short walk."}, {"address": "No. 87 Liurong Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | A famous ancient Lingnan Buddhist temple with a history of over 1,400 years, named after the famous Northern Song dynasty literary master Su Dongpo who inscribed the characters \u0027Six Banyan Trees\u0027. The vibrant \u0027Flower Pagoda\u0027 inside features flared upturned eaves resembling a majestic flower reaching into the sky, making it an exquisite landmark that blends ancient architectural art with Buddhist culture.", "name": "Temple of the Six Banyan Trees and Flower Pagoda", "transport": "Take Metro Line 1 or Line 2 to Gongyuanqian Station (Exit I2), then walk about 10 minutes."}, {"address": "No. 48 Zhongyou Grand Street, Zhongshan 4th Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 Stars | A historic temple originally built during the Hongwu era of the Ming Dynasty, adjacent to the bustling Beijing Road commercial district and one of the largest City God Temples in Lingnan. The architecture showcases exquisite traditional wood carvings, stone sculptures, and lacquer art. Housing the City God and other deities, it radiates a rich atmosphere of folk beliefs and traditional culture, drawing many visitors to pray and capture the beauty of classical architecture.", "name": "Guangzhou City God Temple", "transport": "Take Metro Line 1 to Peasant Movement Institute Station (Exit D), then walk about 6 minutes."}], "name": "Popular Photo Spots"}}, "name": "Beijing Road and Yuexiu Historic Old Town"}, "canton_tower_haizhu": {"categories": {"cat_1": {"items": [{"address": "No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Also known as \"Slim Waist,\" Canton Tower is Guangzhou\u0027s most iconic modern landmark and an architectural marvel. Standing 600 meters tall, its structure features a unique hyperboloid lattice design, showcasing the ultimate aesthetic curves of a twisted slender waist. The tower houses observation decks, an outdoor Sky Drop, a rooftop Ferris wheel, and several top-tier restaurants. Lit up at night, it radiates mesmerizing rainbow hues, making it the best spot to admire the bustling Pearl River night view and the breathtaking skyline.", "name": "Canton Tower", "transport": "Take Guangzhou Metro Line 3 or the APM Line to Canton Tower Station and exit."}, {"address": "Inside Chigang Pagoda Park, Xingang Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | Built in 1609 during the Wanli reign of the Ming Dynasty, Chigang Pagoda is renowned alongside Pazhou Pagoda and Lianhua Pagoda as one of Guangzhou\u0027s three great Fengshui pagodas in the Pearl River Delta. Standing over 50 meters tall, this octagonal, nine-story pavilion-style brick pagoda is majestic and imposing, blending traditional Lingnan masonry with intricate wood carvings. It creates a striking contrast of \"ancient meets modern\" against the contemporary Canton Tower behind it, making it a rare and precious historical gem in Haizhu District.", "name": "Chigang Pagoda", "transport": "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station, then walk for about 8 minutes."}, {"address": "Pazhou Pagoda Park, Xingang East Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Built during the Wanli era of the Ming Dynasty, Pazhou Pagoda stands proudly atop Pazhou Hill. Historically, it served as a crucial navigational mark and geographical landmark for ships entering Guangzhou Port along the Maritime Silk Road. Standing over 50 meters tall, it features an octagonal nine-story exterior with a hidden seventeen-story interior layout, demonstrating rigorous engineering and solemn grandeur. The surrounding park is peaceful and picturesque, with grey bricks and ancient tiles set against lush foliage. Standing beside the pagoda offers a breathtaking view of the historical contrast between traditional heritage and the modern Pazhou Exhibition Center skyline.", "name": "Pazhou Pagoda", "transport": "Take Guangzhou Metro Line 8 to Pazhou Station, then walk for about 12 minutes."}, {"address": "No. 18 Dongsha Street, Fangzhi Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Originally built in 1907 as the Guangdong Cement Factory in the late Qing Dynasty, this grand site features vibrant yellow colonial arcade-style vaulted architecture. Dr. Sun Yat-sen established revolutionary governments here twice and launched the Northern Expedition from this very spot. Exceptionally well-preserved, the interior faithfully restores the original offices, meeting rooms, and living quarters. Combined with rich historical exhibits, it is a must-visit destination to explore modern Chinese revolutionary history and unique Lingnan Western-style architecture.", "name": "Museum of Generalissimo Sun Yat-sen\u0027s Mansion", "transport": "Take Guangzhou Metro Line 2 to The 2nd Workers\u0027 Cultural Palace Station, then transfer to a bus or walk for about 15 minutes."}, {"address": "No. 124 Gexin Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Built in 1904 by the British-owned Butterfield \u0026 Swire, Taikoo Warehouse is a magnificent representative of Guangzhou\u0027s modern industrial and dockside heritage. Today, through successful urban revitalization, these century-old red-brick warehouses have been transformed into a vibrant waterfront leisure complex featuring arts spaces, a lively bar street, a private yacht marina, a cinema, and unique dining outlets. The red brick walls and vintage iron gates glow beautifully beneath the Pearl River sunset, exuding a charming blend of industrial nostalgia and modern trendy vibe.", "name": "Taikoo Warehouse", "transport": "Take Guangzhou Metro Line 8 to Shayuan Station Exit A, then walk for about 12 minutes."}, {"address": "No. 135 Xingang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 stars | Originally the campus of Lingnan University, the South Campus of Sun Yat-sen University boasts South China\u0027s largest and best-preserved red-brick building complex from the Republic of China era. Famous structures include Swasey Hall, Black Hall, and Martin Hall. The architecture beautifully fuses Western Gothic and Cornell University campus elements with traditional Lingnan architectural details. Nestled beneath towering century-old trees, the red bricks and green glazed tiles radiate a profound academic atmosphere and rich historical ambiance.", "name": "Sun Yat-sen University South Campus Historic Buildings", "transport": "Take Guangzhou Metro Line 8 to Sun Yat-sen University Station Exit A; the campus entrance is right outside."}, {"address": "No. 2 Dengshichang Jiminguan Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Built during the Qing Dynasty, Deng Ancestral Hall is dedicated to national hero Deng Shichang, famous for his role in the First Sino-Japanese War. This classic Lingnan three-courtyard ancestral hall possesses immense artistic value, featuring exquisite wood carvings, stone carvings, brick sculptures, and plaster work. The memorial hall displays historical artifacts about Deng Shichang\u0027s heroic deeds and the war. In the courtyard stands a century-old Sterculia tree planted by Deng himself, evoking a deep sense of solemnity and historic resonance.", "name": "Deng Shichang Memorial Hall / Deng Ancestral Hall", "transport": "Take Guangzhou Metro Line 2 or Line 8 to Changgang Station, then walk for about 10 minutes."}, {"address": "Huangpu Ancient Village, Pazhou Street, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Huangpu Ancient Village is one of the important birthplaces of the Maritime Silk Road. The village preserves numerous ancestral halls, family temples, ancient pathways, and historic harbor relics from the Qing Dynasty to the Republic of China era. Famous ancestral halls like Hu Ancestral Hall and Liang Ancestral Hall showcase classic Cantonese architectural features, including wok-ear walls, colorful plaster reliefs, grey bricks, and wooden doors. Wandering along the cobblestone alleys and ancient pier ruins allows visitors to feel the tranquil atmosphere and deep historical legacy of this thousand-year-old trading hub.", "name": "Huangpu Ancient Village Historic Architectural Complex", "transport": "Take Guangzhou Metro Line 8 to Wanshengwei Station, then transfer to Bus 229 to Huangpu Ancient Village Station."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 229 Yiyuan Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 stars | Located on the central axis south of the Canton Tower, this is a top-tier art palace built by Guangzhou. Designed around the concept of a \u0027hero flower blooming in water\u0027, its nighttime lighting makes it look like a giant crystal kapok flower. The museum features over a dozen professional exhibition halls housing a vast collection of masterpieces from Lingnan School masters like Gao Jianfu and Guan Shanyue, while regularly hosting international contemporary art exhibitions. Its striking geometric architectural lines and soaring glass atrium attract countless photography enthusiasts, making it a must-visit cultural landmark combining classical painting and modern architectural aesthetics.", "name": "Guangzhou Museum of Art (New Guangzhou Art Museum)", "transport": "Metro Line 3 or APM Line \u0027Canton Tower Station\u0027 Exit B, about an 8-minute walk."}, {"address": "No. 288 Xinjiao Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.9 stars | Located on the northeast side of Haizhu Lake, this is one of the largest cultural centers in China. Designed in a new Lingnan garden architectural style infused with \u0027Han and Tang Dynasty elegance\u0027, it seamlessly blends pavilions, waterside towers, winding corridors, and natural lake views. It includes several themed areas such as the Public Cultural Center, Cantonese Essence Garden, and Canton Embroidery Garden. Visitors can dive deep into Lingnan intangible cultural heritage crafts like Canton embroidery, Canton enamel, and olive pit carving. The picturesque grounds are perfect for Hanfu photo shoots, offering an immersive time-travel feel and serving as an iconic cultural destination for experiencing traditional Cantonese art and heritage.", "name": "Guangzhou Cultural Center (New Venue)", "transport": "Metro Line 3 \u0027Datang Station\u0027 Exit B, about a 10-minute walk."}, {"address": "No. 118 Modiesha Street, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Reclaimed from the packaging workshops and riverside factory area of the old Pearl River Brewery, this contemporary art and lifestyle street zone preserves industrial-era malt kettles, exposed piping, and retro factory halls, infusing them with contemporary art galleries, creative exhibition spaces, and global dining. The Pearl River-InBev Beer Museum inside showcases a century of brewing craftsmanship and urban industrial history, while the unbeatable riverside viewing platform offers stellar views of the Pearl River nightscape and the Canton Tower. Weekend art markets and special contemporary art exhibits bring a vibrant urban energy that bridges past and present.", "name": "Party Pier Cultural and Art Zone", "transport": "Take the Haizhu Tram Line directly to \u0027Party Pier Station\u0027, or take Metro Line 3 to \u0027Canton Tower Station\u0027 and transfer to the tram."}, {"address": "No. 40 Longzhu Zhi Street, Baogang Avenue, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Built around the Qing Dynasty \u0027Deng Ancestral Hall\u0027, this is one of the best-preserved Lingnan ancestral hall complexes in Guangzhou\u0027s urban core. Constructed during the Guangxu reign of the Qing Dynasty to commemorate national hero Deng Shichang from the First Sino-Japanese War, the interior boasts exquisitely carved beams, painted rafters, fine plaster molds, and intricate woodcarvings. The museum presents Deng Shichang\u0027s life story and special exhibits on Haizhu\u0027s history. Its serene courtyard, highlighted by two near-century-old crabapple trees set against classical gardens, offers a deep sense of history and refined cultural atmosphere along the Haizhu riverfront.", "name": "Deng Shichang Memorial Hall (Haizhu Museum)", "transport": "Metro Line 2 \u0027The 2nd Workers\u0027 Cultural Palace Station\u0027 Exit D, about a 12-minute walk or transfer to a bus to \u0027Longdaowei Station\u0027."}, {"address": "No. 397 Xingang Middle Road, Kecun, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Originally the Guangzhou Textile Machinery Factory established in 1956, this cultural park adjacent to the Canton Tower was revitalized into a creative hub combining fashion design, art exhibitions, aesthetic cafes, and digital tech. Featuring red-brick factory buildings, vintage workshops, and towering leafy trees, it exhibits a captivating blend of retro and modern aesthetics. The park frequently hosts independent illustration shows, fashion exhibitions, and pop-up contemporary art events. Dotted with designer studios, walking here lets you feel both the historical echoes of old industrial ruins and the cutting-edge pulse of Guangzhou\u0027s creative scene.", "name": "TIT Creative Park Art Space", "transport": "Metro Line 3 or Line 8 \u0027Kecun Station\u0027 Exit A, about a 5-minute walk."}, {"address": "No. 1268 Binjiang East Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | Located on the west side of Canton Tower, standing side by side with it on the south bank of the Pearl River, this venue is not only a major media hub but also hosts high-end art shows, photography exhibitions, international design weeks, and multimedia digital art events in its podium and public spaces. The spacious, modern exhibition halls utilize cutting-edge light projection technology and interactive installations for an avant-garde immersive experience. Its outdoor platform offers a stunning close-up panorama looking up at the Canton Tower, making it a prime destination for exploring contemporary visual arts and modern urban architecture.", "name": "Guangzhou International Media Port Art Center", "transport": "Metro Line 3 or APM Line \u0027Canton Tower Station\u0027 Exit A, about a 3-minute walk."}, {"address": "No. 23 Hongde 5th Lane, Hongde Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | A historic Gothic-style church located in Haizhu District (traditionally known as Guangzhou Henan), built in the early 20th century with over a hundred years of history. The exterior features elegant, understated lines with iconic spires and vintage arched windows, while the serene interior turns solemn and romantic when sunlight filters through the stained glass. As an essential religious and architectural heritage site along Haizhu\u0027s waterfront, the church has witnessed the evolution of the old neighborhood. Its Western religious architectural language forms a striking cultural contrast with the surrounding Cantonese alleys, offering immense artistic and historical value.", "name": "Henan Christian Church", "transport": "Metro Line 8 \u0027Tongfuxi Station\u0027 Exit A, about a 6-minute walk."}, {"address": "Inside Canton Tower, No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | A dedicated art exhibition space located inside Canton Tower and its podium area, highlighting the crossover between traditional Lingnan craftsmanship and contemporary creative design. The gallery features year-round displays of Cantonese embroidery, ivory carving, jade carving, and selected Lingnan School paintings, integrated with digital immersive light shows to bring classical culture to life through modern technology. Experiencing rich cultural heritage inside China\u0027s tallest iconic landmark creates a compelling dialogue between past and present. After browsing, visitors can head up the tower for sweeping panoramic views of Guangzhou, making it a high-quality cultural highlight when visiting Canton Tower.", "name": "Canton Tower Lingnan Cultural \u0026 Art Space", "transport": "Directly accessible from Metro Line 3 or APM Line \u0027Canton Tower Station\u0027."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 168 Xinjiao Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.7 Stars | Celebrated as the \u0027Green Heart\u0027 of urban Guangzhou, this expansive park boasts extraordinarily rich ecological resources and four seasons of vibrant flower blooms. Featuring fruit orchard wetlands, intricate river networks, and bird sanctuaries, a peaceful stroll here reveals breathtaking scenery of a classic water country. It is the ultimate escape from urban bustle, perfect for eco-photography and leisurely walks.", "name": "Haizhu National Wetland Park", "transport": "Take Guangzhou Metro Line 3 to Datang Station, then transfer to a bus or taxi to reach the park entrance."}, {"address": "No. 208 Xinjiao Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Serving as the core water area of the Haizhu Wetland Park, Haizhu Lake features vast open waters connected to multiple river channels. It offers well-maintained lakeside walking and cycling trails shaded by lush trees and colorful flora. On clear days, visitors can admire the magnificent reflection of the Canton Tower across the water, making it a favorite natural spot for morning runs, sunset strolls, and landmark photography.", "name": "Haizhu Lake Park", "transport": "Take Guangzhou Metro Line 3 to Datang Station (Exit B), and walk about 300 meters to reach the park entrance."}, {"address": "Riverside Belt, Yuejiang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 Stars | A modern waterfront green corridor extending along the south bank of the Pearl River, adjacent to the Canton Tower and Pazhou Exhibition Area. The park features high-standard running tracks, cycling paths, and open lawns lined with tropical plants and seasonal flowers. At night, accompanied by a gentle river breeze, the dazzling skyline of Zhujiang New Town across the river creates one of the most scenic greenways to experience Guangzhou\u0027s modern culture and night views.", "name": "Yuejiang Road Greenway Park", "transport": "Take the Guangzhou Tram (THX1) to Exhibition Center East Station or Pazhou Pagoda Station, then walk along the river."}, {"address": "Chigang Pagoda Park, Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Built during the Ming Dynasty, Chigang Pagoda is one of Guangzhou\u0027s historic navigation beacons. Built around this ancient landmark, the park seamlessly blends historical heritage with modern green landscaping. Surrounded by towering ancient trees in a tranquil atmosphere, it creates a striking contrast between ancient history and the modern Canton Tower nearby, showcasing the unique cultural heritage of Haizhu District.", "name": "Chigang Pagoda Park", "transport": "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station, then walk about 800 meters."}, {"address": "Riverside at the intersection of Yuejiang West Road and Pazhou Avenue, Haizhu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Located along the river in the core cultural and exhibition district of Pazhou, this park offers a wide shoreline and rich, multi-layered greenery. Designed with waterfront platforms, landscape sculptures, and shaded walking paths, it is an ideal spot for outdoor cultural events or relaxing picnics. Sitting by the river, you can enjoy up-close views of passing cruise ships on the Pearl River and the impressive Pazhou Bridge.", "name": "Pazhou Waterfront Park", "transport": "Take Guangzhou Metro Line 8 to Pazhou Station, then walk north for about 10 minutes."}, {"address": "Next to Modiesha Stream, Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.2 Stars | A hidden gem of a park located near the Pazhou Internet Innovation Cluster, offering abundant shade and babbling streams. Equipped with resting pavilions, scenic walking trails, and open lawns, it serves as a secret garden for local office workers and art lovers to unwind. Its prime location offers dual views of the Canton Tower and the bustling cityscape along both sides of the Pearl River.", "name": "Modiesha Park", "transport": "Take Guangzhou Metro Line 8 to Modiesha Station, then walk for about 10 minutes."}, {"address": "No. 222 Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.8 Stars | A grand urban green plaza surrounding the base of the Canton Tower, combining sprawling lawns, fountain water features, and modern landscape design. It is the premier location for looking up at the full panorama of the Canton Tower and photographing its iconic \u0027Slim Waist\u0027. Connected to waterfront platforms and greenways, the plaza is vibrant with street performers and strolling visitors, exuding modern urban vitality.", "name": "Canton Tower Civic Plaza \u0026 Park", "transport": "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station; the plaza is right outside the exit."}, {"address": "Intersection of Zhoutouzui Road and Binjiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Situated on the western side of Haizhu District where three branches of the Pearl River converge, this is one of the best spots in Guangzhou to view sunsets over White Swan Pond. Shaded by lush foliage and cooled by river breezes, it features a long waterfront promenade and historic monument sculptures. As the golden sunset glimmers on the river surface, the park fills with a romantic and nostalgic ambiance, making it a must-visit riverside destination.", "name": "Zhoutouzui Riverside Park", "transport": "Take Guangzhou Metro Line 8 to Tongfuxi Station, then walk for about 12 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Nicknamed \u0027Slim Waist\u0027, the Canton Tower stands at an impressive 600 meters and is Guangzhou\u0027s most iconic landmark. It offers the best panoramic views of the city\u0027s dazzling night skyline and Zhujiang New Town. At the top, you\u0027ll find the world\u0027s highest outdoor observation deck, a sky tram (Ferris wheel), and thrilling rides like the Sky Drop. At night, the tower lights up in mesmerizing color-changing light shows, making it an irresistible hotspot for photos with futuristic urban aesthetics.", "name": "Canton Tower", "transport": "Take Guangzhou Metro Line 3 or the APM Line to \u0027Canton Tower Station\u0027 and exit."}, {"address": "No. 228 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Transformed from an old brewery right along the Pearl River, this creative park is a bustling hub for Guangzhou\u0027s nightlife and hip art scene. It preserves industrial steel structures and vintage pipes, blending them with avant-garde graffiti, stylish bars, and restaurants featuring stunning riverfront views. As sunset turns into night, it becomes the ultimate vantage point for photographing the Canton Tower and Pearl River nightscape, attracting creators and travelers alike.", "name": "Zhujiang Party Pier Cultural and Art Zone", "transport": "Take the Haizhu Tram Line THZ1 to \u0027Party Pier Station\u0027 and walk for about 1 minute."}, {"address": "No. 397 Xingang Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Formerly the Guangzhou Textile Machinery Factory, this lush green park has been reimagined as a hub for fashion, tech, and art\u2014and even houses the headquarters of tech giant WeChat. Featuring red-brick industrial heritage buildings interspersed with lush greenery and modern art installations, it offers a unique blend of heritage and novelty. Strolling through, you can effortlessly capture stylish, retro-industrial, and indie-chic photos.", "name": "TIT Creative Park", "transport": "Take Guangzhou Metro Line 3 or Line 8 to \u0027Kecun Station\u0027, Exit A, and walk for about 5 minutes."}, {"address": "Canton Tower Terminus, Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Known as \u0027Guangzhou\u0027s Most Beautiful 7 Kilometers\u0027, this scenic tram line runs along the south bank of the Pearl River, connecting Canton Tower to Wanshengwei. The carriages feature floor-to-ceiling panoramic windows, gliding through lush green tunnels, blooming kapok trees, and vibrant flower seas alongside riverfront architecture. Both the stylish trains and modern stations make for perfect backdrop photos with a fresh, cinematic urban vibe.", "name": "Haizhu Tram Line THZ1", "transport": "Take Guangzhou Metro Line 3 to \u0027Canton Tower Station\u0027 and transfer to Haizhu Tram Line THZ1."}, {"address": "East Pedestrian Walkway, South End of Guangzhou Bridge, Haizhu District, Guangzhou,
