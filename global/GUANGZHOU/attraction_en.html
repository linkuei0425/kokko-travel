iew of the \u0027bright moon rising over the water\u0027. Strolling beside the bridge amidst ancient Xiguan architecture and gentle water sounds feels like traveling back in time.", "name": "Yongqing Fang Moon Bridge", "transport": "Metro Line 1 or Line 6 Huangsha Station, Exit B, approx. 8-minute walk"}, {"address": "No. 127 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | The Museum of Cantonese Opera Art is a cultural landmark built in classic Lingnan traditional garden style, seamlessly blending exquisite pavilions, rockeries, and jade-green waters. It\u0027s not only an ideal place to learn about Cantonese opera culture, but also a top location for photo shoots wearing Hanfu or Qipao. Evening light shows and live performances on the floating stage create a stunning audiovisual feast. The museum houses a rich collection of opera costumes, scripts, and famous performers\u0027 props, rich in heritage and aesthetic value.", "name": "Museum of Cantonese Opera Art", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 10-minute walk"}, {"address": "Yongqing Fang Phase I, No. 227 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Renowned as one of \u0027China\u0027s Most Beautiful Bookstores\u0027, Zhongshuge\u0027s first Guangzhou store skillfully blends traditional Xiguan wok-ear roofs, Manchurian windows, and arcade street elements into a magical modern design. The interior features layered mirrored ceilings and maze-like bookshelves, creating a visually stunning space. It\u0027s both a haven for book lovers and a trendy photo spot for hipsters, where every angle yields stylish, high-quality photos.", "name": "Zhongshuge Bookstore (Yongqing Fang)", "transport": "Metro Line 1 Huangsha Station, Exit B, approx. 6-minute walk"}, {"address": "No. 13 Yongqing 1st Lane, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | This brick-and-wood structure built in classic Xiguan grand house style was once the residence of Lee Hoi-chuen, father of martial arts legend Bruce Lee. Featuring vintage carved wooden doors, tall Tanglong sliding doors, and Qing Dynasty brick carvings, it preserves the grand elegance of historic wealthy Xiguan families. The venue includes interactive kung fu zones, a Bruce Lee life exhibition, and visually striking photo installations, attracting martial arts fans and culture lovers alike.", "name": "Bruce Lee\u0027s Ancestral House", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 8-minute walk"}, {"address": "Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Hailed as \u0027Guangzhou\u0027s Most Beautiful Arcade Street\u0027, Enning Road stretches about 1,500 meters through the heart of Xiguan, perfectly preserving early 20th-century Lingnan arcade architecture. The street is lined with traditional coppersmith shops, time-honored snack eateries, and revitalized indie craft boutiques. Walking under the arcades, sunlight filters through the colonnades creating lovely shadows\u2014a dreamy backdrop for retro street photography and film shoots amidst vibrant local life.", "name": "Enning Road Arcade Street", "transport": "Metro Line 1 or Line 6 Huangsha Station, Exit B, approx. 5-minute walk"}, {"address": "Pantang Wuyue, Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Pantang Wuyue is one of Guangzhou\u0027s best-preserved thousand-year-old ancient villages, right next to Liwan Lake Park. Following a gentle urban revitalization, it merges classic Xiguan grey-brick architecture with modern artisan workshops, music bars, and trendy cafes. Winding alleys hide delightful photo spots like cat murals, vintage independent bookstores, and art galleries\u2014a hidden gem for escaping crowds and enjoying a relaxed Xiguan vibe.", "name": "Pantang Wuyue Historical Block", "transport": "Metro Line 5 Zhongshanba Station, Exit A, approx. 8-minute walk"}, {"address": "No. 84 Fengyuan North Street, Yaohua Avenue, Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Liwan Museum consists of a Xiguan Grand House exhibition area and distinctive European-style mansions. Among them, the Former Residence of Chen Lianbo is a romantic pink Baroque building. With its elegant design, lush greenery, and archways, it\u0027s a perfect backdrop for French-retro style photos. Inside, detailed exhibits showcase old Xiguan daily life, wedding customs, and fine furniture, transporting visitors back to a Republic-era mansion.", "name": "Liwan Museum \u0026 Former Residence of Chen Lianbo", "transport": "Metro Line 1 Changshou Road Station, Exit E, approx. 12-minute walk"}, {"address": "Around the intersection of Longjin West Road and Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Historically known as \u0027Little Qinhuai\u0027, Lizhiwan Creek represents quintessential Lingnan water town scenery with swaying willows along the riverbanks. Traditional Xiguan houses, ancient stone arch bridges, and old banyan trees line the channel. Visitors can board traditional wooden boats to soak in the poetic atmosphere of \u0027green winding streams framed by red lychees\u0027. During festivals, water flower markets and folk events light up the night, making it a top spot for capturing authentic Lingnan charm.", "name": "Lizhiwan Creek", "transport": "Metro Line 5 Zhongshanba Station Exit A or Line 1 Changshou Road Station, approx. 10-minute walk"}], "name": "Popular Photo Spots"}}, "name": "Liwan Xiguan Cultural District and Yongqing Fang"}, "zhujiang_tianhe": {"categories": {"cat_1": {"items": [{"address": "No. 1 Zhujiang West Road, Zhujiang New Town, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Designed by the world-renowned architect Zaha Hadid, the design concept is based on \u0027twin boulders\u0027, appearing like two pebbles smoothed by the waters of the Pearl River. Featuring top-tier acoustic engineering and a column-free auditorium, its double-curved 3D geometry showcases the pinnacle of contemporary architectural aesthetics. It stands as one of the most iconic modern cultural and architectural landmarks in Zhujiang New Town CBD.", "name": "Guangzhou Opera House", "transport": "Take Guangzhou Metro Line 3 or 5 to Zhujiang New Town Station, and walk for about 8 minutes; or take the APM Line directly to Guangzhou Opera House Station."}, {"address": "No. 2 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Inspired by traditional Lingnan carved lacquer boxes, this building is affectionately nicknamed the \u0027Moonlight Treasure Box\u0027 by local residents. Constructed with a steel structure and suspended system, its geometrically cut dark red and gray exterior creates a striking blend of modern design and mysterious allure. Inside, it houses a rich collection of Lingnan historical relics and natural specimens, combining cultural depth with cutting-edge architectural vision.", "name": "Guangdong Museum", "transport": "Take Guangzhou Metro APM Line to Guangzhou Opera House Station and walk for about 5 minutes; or take Line 3/5 to Zhujiang New Town Station."}, {"address": "No. 4 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 stars | Situated on the east side of Huacheng Square, the building\u0027s exterior resembles stacked open books, evoking a sense of structural dynamic movement and mechanical beauty. As one of the busiest public libraries in the world, its grand central atrium maximizes natural light through an elegant modern steel frame, making it an iconic symbol of the city\u0027s humanistic spirit in the Tianhe CBD.", "name": "Guangzhou Library", "transport": "Take Guangzhou Metro APM Line to Guangzhou Opera House Station and walk for about 3 minutes."}, {"address": "Both banks of Liede Stream (near Haishan Street), Zhujiang New Town, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Located on the eastern edge of skyscraper-filled Zhujiang New Town, this area is a fascinating example of Guangzhou\u0027s deep-rooted history coexisting harmoniously with a modern CBD. Traditional ancestral halls of the Li and Lin families from the ancient Liede village have been meticulously restored along Liede Stream, showcasing classic Lingnan features like wok-ear walls, blue bricks, gray tiles, and intricate wood carvings. The dragon boat races hosted on Liede Stream during the Dragon Boat Festival offer a vibrant glimpse into local lineage culture.", "name": "Liede Lingnan Water Village and Ancestral Halls", "transport": "Take Guangzhou Metro Line 5 to Liede Station (Exit B) and walk for about 6 minutes."}, {"address": "No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province (Opposite the southern end of Zhujiang New Town)", "feature": "\u2b50 4.6 stars | Affectionately nicknamed \u0027Slim Waist\u0027, Canton Tower stands on the south bank of the Pearl River facing Zhujiang New Town CBD. It is Guangzhou\u0027s most famous landmark and a modern engineering marvel. Rising to a height of 604 meters, its structural design features a unique twisted lattice grid that creates an extraordinarily sleek and dynamic silhouette. Illumined at night, it creates a breathtaking sight alongside the CBD skyline, representing the height of modern Guangzhou\u0027s ambition.", "name": "Canton Tower", "transport": "Take Guangzhou Metro Line 3 or APM Line directly to Canton Tower Station."}, {"address": "No. 233 Tianhe North Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | Located at the intersection of Tianhe North Road and Tianhe East Road, CITIC Plaza was built in the late 1990s and was once the tallest concrete building in Asia and the world. It witnessed the golden age of development for Tianhe CBD and Guangzhou as a whole. This 80-story glass curtain skyscraper features clean, classic lines that align perfectly with the axis connecting Tianhe Sports Center and Guangzhou East Railway Station, holding significant historical and architectural value.", "name": "CITIC Plaza", "transport": "Take Guangzhou Metro Line 3 or 1 to Linhexi Station, Exit A, and walk for about 3 minutes."}, {"address": "No. 6 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Also known as Guangzhou East Tower, this 530-meter skyscraper is the tallest building in Guangzhou and the core anchor of the Tianhe CBD skyline. Its design features staggered setback tiers clad in white terracotta panels, combining high-rise modern engineering with energy-efficient technology tailored to Lingnan\u0027s climate. Housing luxury hotels, incredible observation decks, and upscale retail spaces, its grand silhouette symbolizes the forefront of contemporary business and architecture.", "name": "Guangzhou CTF Finance Centre", "transport": "Take Guangzhou Metro APM Line to Huacheng Avenue Station, or take Line 3/5 to Zhujiang New Town Station and connect via the underground concourse."}, {"address": "No. 5 Zhujiang West Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Commonly known as Guangzhou West Tower, this 438.6-meter skyscraper forms a striking twin-tower spectacle opposite the East Tower. Utilizing an advanced diagonal steel grid and concrete tube structural system, its streamlined, crystal-like silhouette is sleek, minimal, and futuristic. As one of the earliest super-tall modern landmarks in Tianhe CBD, its elegant curves have fundamentally shaped Guangzhou\u0027s contemporary cityscape.", "name": "Guangzhou International Finance Center", "transport": "Take Guangzhou Metro APM Line to Huacheng Avenue Station, or Metro Line 3/5 to Zhujiang New Town Station and walk for about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 2 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Located on the east side of Huacheng Square in Zhujiang New Town, the Guangdong Museum was inspired by a \u0027Moonlight Treasure Box\u0027, boasting a grand and unique structure. The museum holds a rich collection spanning history, culture, natural resources, and artistic creations. Exhibits on Chaozhou woodcarving, Duan inkstones, and Canton enamels showcase the pinnacle of traditional Lingnan craftsmanship. The large marine fossil exhibit and dinosaur skeleton displays are major hits with families. Spaciously laid out with modern lighting design, it is an essential sanctuary for exploring Guangdong\u0027s historical lineage and visual arts.", "name": "Guangdong Museum", "transport": "Metro Lines 3/5 Zhujiang New Town Station Exit B1, about an 8-minute walk; or Metro APM Line Opera House Station Exit B direct access."}, {"address": "No. 4 Zhujiang West Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 stars | Located in the cultural core of Zhujiang New Town, Guangzhou Library was designed around the concept of \u0027Beautiful Books\u0027, resembling a sculpture of stacked books. This world-class public library houses millions of volumes alongside extensive digital resources, thematic exhibition halls, and cultural salon spaces. The high-ceiling atrium enjoys natural daylight and stunning views looking north toward Canton Tower and Huacheng Square. Beyond reading and study, it frequently hosts expert lectures, art exhibitions, and concerts, making it a modern cultural landmark in the Tianhe CBD.", "name": "Guangzhou Library", "transport": "Metro APM Line Opera House Station, about a 3-minute walk; or Metro Lines 3/5 Zhujiang New Town Station Exit B1, about an 8-minute walk."}, {"address": "No. 1 Zhujiang West Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Designed by the legendary deconstructivist architect Zaha Hadid, the Guangzhou Opera House resembles two \u0027twin pebbles\u0027 smoothed by the waters of the Pearl River. Inside, it features world-class acoustics and state-of-the-art stage equipment, including an opera hall, experimental theater, and art exhibition spaces. It regularly hosts world-class symphonies, ballets, operas, and contemporary theatre, alongside art and architectural photography exhibitions. An absolute must-visit for enjoying top-tier performing arts or admiring cutting-edge architectural craftsmanship.", "name": "Guangzhou Opera House", "transport": "Metro APM Line Opera House Station Exit A direct access; or Metro Lines 3/5 Zhujiang New Town Station Exit B1, about a 6-minute walk."}, {"address": "Halls L3 \u0026 L4, Guangzhou K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | Nestled inside Guangzhou K11 Art Mall, chi K11 Art Space seamlessly integrates contemporary art into a stylish shopping experience. Spanning a vast area, it frequently collaborates with top international artists, galleries, and museums to introduce cutting-edge modern art, digital interactive displays, contemporary installations, and pop-culture crossover exhibitions. Masterpieces by contemporary artists are scattered throughout the mall, creating an immersive atmosphere where art meets life\u2014a hotspot for youth who love contemporary art, fashion trends, and photo-worthy spots.", "name": "chi K11 Art Space Guangzhou", "transport": "Metro APM Line Huacheng Avenue Station Exit B direct connection; or Metro Lines 3/5 Zhujiang New Town Station Exit B2 via underground passage."}, {"address": "No. 9 Cuitao Street, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | Situated in eastern Tianhe near the CBD and Tianhe Park, Guangzhou Tianhe Church is the largest modern Gothic-style church built in Guangzhou in recent decades. It blends traditional Gothic pointed arches with sleek modern geometric lines, featuring elegant marble exterior walls that stand solemnly quiet amidst surrounding skyscrapers. The main hall boasts a grand vaulted ceiling and stained-glass windows that cast an elegant, sacred light. Beyond being a worship center for local Christians, it offers visitors a peaceful retreat to appreciate religious architecture.", "name": "Guangzhou Tianhe Christian Church", "transport": "Metro Line 21 Tianhe Park Station Exit E1, about a 10-minute walk; or take a bus to Tianhe Park Station."}, {"address": "Shop MU35, TaiKoo Hui, No. 383 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Located in TaiKoo Hui shopping mall in the heart of Tianhe CBD, Fangsuo Communal is a cross-disciplinary lifestyle hub integrating books, contemporary design, handmade crafts, coffee culture, and fashion. Built with fair-faced concrete and grand subterranean geometric structures, it evokes the atmosphere of an aesthetic temple. Featuring a rich selection of books on art, design, philosophy, and aesthetics, it regularly hosts book signings by domestic and international authors, art salons, and design exhibitions, standing out as Guangzhou\u0027s iconic cultural space.", "name": "Fangsuo Communal Guangzhou", "transport": "Metro Line 3 Shipaiqiao Station BRT Exit direct connection to TaiKoo Hui MU Level; or Metro Line 1 Tiyu Center Station Exit A, about a 5-minute walk."}, {"address": "Huamao Center, Huangpu Avenue West, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.2 stars | Located near the core of Tianhe CBD, Guangzhou Museum of Contemporary Art is dedicated to showcasing Chinese and international contemporary visual arts. With a spacious and minimalist modern design, it frequently holds avant-garde art exhibitions, modern sculptures, emerging photography showcases, and digital multimedia installations. Focusing heavily on young emerging artists, its thought-provoking and visually striking exhibitions inject vibrant modern artistic energy into the bustling business district.", "name": "Guangzhou Museum of Contemporary Art", "transport": "Metro APM Line Huangpu Avenue Station, about an 8-minute walk; or Metro Lines 3/5 Zhujiang New Town Station, about a 10-minute walk."}, {"address": "No. 38 Yanyu Road, Ersha Island, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Situated on Ersha Island adjacent to the south of Zhujiang New Town CBD, the Guangdong Museum of Art enjoys a tranquil riverside setting. As a premier modern art institution in South China, it mainly collects and displays masterpieces of the modern Lingnan School of Painting, Chinese modern art, and international contemporary art. The museum regularly holds national art exhibitions, photography biennials, and international exchange exhibits, while its outdoor garden displays large-scale sculptures. Just minutes away from the CBD by walk or bike, it is a wonderful place to immerse in visual arts and riverside cultural vibes.", "name": "Guangdong Museum of Art", "transport": "Metro APM Line Haixinsha Station, about a 12-minute walk across Haixin Bridge/Ersha Stream; or take Bus 57 to Provincial Museum of Art Station."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 90 Jinsui Road, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | Zhujiang Park is an oasis located in the heart of Zhujiang New Town CBD. Covering a vast area, it boasts lush subtropical vegetation and landscapes. The park is divided into several areas, including scenic spots, botanical viewing zones, and leisure areas, featuring crystal-clear lakes, winding wooden boardwalks, and exquisite Lingnan-style garden architecture. Surrounded by skyscrapers, it offers a rare, tranquil escape, making it a highly popular urban green lung for office workers to unwind and families to spend leisure time.", "name": "Zhujiang Park", "transport": "Metro Line 5, Liede Station, Exit C, approx. 8-minute walk"}, {"address": "Huacheng Avenue, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.8 Stars | Known as Guangzhou\u0027s \u0027City Living Room,\u0027 Flower City Square is situated along the central axis of the Zhujiang New Town CBD. The entire square features expansive green belts and landscape pools planted with a vast array of seasonal flowers and trees. A large underground shopping center lies beneath, while the ground level offers sweeping views of modern landmarks such as Canton Tower, Guangzhou CTF Finance Centre (East Tower), Guangzhou International Finance Center (West Tower), and the Guangzhou Opera House. The nighttime light show and musical fountain are truly spectacular sights.", "name": "Flower City Square", "transport": "Metro Line 3 or Line 5, Zhujiang New Town Station, or APM Line, Huacheng Avenue Station"}, {"address": "No. 24 Linjiang Avenue, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | Located on an island at the southern end of Zhujiang New Town where the Pearl River converges, Haixinsha Asian Games Park was the venue for the opening ceremony of the 2010 Guangzhou Asian Games. The park retains the grand stage structures and flame tower from the games, alongside spacious lawns and riverside promenades. Offering magnificent views, it is one of the best spots for up-close admiration of Canton Tower and Pearl River night views, as well as a popular hub for evening runs and weekend picnics.", "name": "Haixinsha Asian Games Park", "transport": "Directly accessible via Metro APM Line, Haixinsha Station"}, {"address": "Linjiang Avenue (Riverside section of Zhujiang New Town), Tianhe District, Guangzhou", "feature": "\u2b50 4.4 Stars | Extending along the north bank of the Pearl River on the south side of Zhujiang New Town, Linjiang Band Park is a linear park combining natural greenery with sports and leisure. It features dedicated running and cycling lanes, lined with lush trees, blooming flowers, and several scenic viewing platforms. Visitors can stroll while enjoying the vibrant city lights and river views, making it one of the most energetic outdoor waterfront greenways in Tianhe District, Guangzhou.", "name": "Linjiang Band Park", "transport": "Metro APM Line, Guangzhou Opera House Station or Haixinsha Station, then walk to the riverfront"}, {"address": "No. 299 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | Tianhe Park is a large, historic comprehensive landscape park located near the Tianhe CBD. It boasts expansive water bodies such as Cui Lake and Koi Pond, with exceptionally high terrestrial vegetation coverage featuring century-old trees and dense bamboo groves. The park offers recreational activities like boating, strolling, and morning exercises. In spring, flowers bloom across the garden, while in autumn and winter, red bald cypresses frame the lakefront, making it an ideal venue to experience Guangzhou\u0027s local slow life and natural ecology.", "name": "Tianhe Park", "transport": "Metro Line 21, Tianhe Park Station, Exit E1"}, {"address": "Plaza in front of Guangzhou East Railway Station, Linhe Middle Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 Stars | Situated at the northernmost end of Tianhe CBD\u0027s new central axis, Guangzhou East Railway Station Green Plaza is famous for \u0027Tianhe Drifting Snow,\u0027 a grand man-made waterfall. Broad green lawns and landscaped vegetation flank both sides, skillfully blending a modern transit hub with natural greenery. Looking south from the plaza, one can gaze along the central axis toward CITIC Plaza and distant skyscrapers, making it a classic starting point to appreciate Guangzhou\u0027s urban axis greenery.", "name": "Guangzhou East Railway Station Green Plaza", "transport": "Metro Line 1 or Line 3, Guangzhou East Railway Station, Exit G1 or G2"}, {"address": "Qinglan Road, Ersha Island, Yuexiu District, Guangzhou (Adjacent to Haixinsha Bridge)", "feature": "\u2b50 4.6 Stars | Located at the eastern tip of Ersha Island to the southwest of Zhujiang New Town, Ersha Island Art Park faces Haixinsha Island and Canton Tower across the river. It features artistically designed diamond-shaped lawns, lush grass, and scenic trails with sweeping views. It is one of the best photography spots in the city for capturing full views of Canton Tower and the urban skyline, highly favored by photography and camping enthusiasts. The scenery at sunset is particularly charming.", "name": "Ersha Island Art Park", "transport": "Metro APM Line, Haixinsha Station, approx. 10-minute walk across the Haixinsha Pedestrian Bridge"}, {"address": "No. 236 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 Stars | Built around the Tianhe Gymnasium and Stadium, Tianhe Sports Center Green Plaza is a rare, large-scale green sports space in the heart of the Tianhe CBD commercial district. Surrounded by tree-lined avenues and floral landscapes, the plaza features standard fitness trails and outdoor sports courts. Seamlessly blending sports with urban greenery, it showcases Guangzhou\u0027s vibrant urban ecology\u2014whether during morning exercise sessions or at night when surrounded by illuminated skyscrapers.", "name": "Tianhe Sports Center Green Plaza", "transport": "Metro Line 1, Tianhe Sports Center Station, Exit D2, or Line 3, Tiyu Xilu Station"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Between Zhujiang East Road and Zhujiang West Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Known as Guangzhou\u0027s \u0027City Living Room,\u0027 Flower City Square is located on the central axis of the Tianhe CBD. It is the premier photo spot for capturing the Canton Tower alongside the East and West Skyscraper Towers. After dark, the dazzling light show reflects beautifully on the lake, creating an unforgettable view. The square connects underground to a massive shopping mall and subway hub; strolling along its tree-lined paths offers a vivid taste of the prosperity and vitality of modern Guangzhou.", "name": "Flower City Square", "transport": "Take Metro Line 3 or 5 to Zhujiang New Town Station, or take the APM Line to Huacheng Avenue Station."}, {"address": "No. 1 Zhujiang West Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Designed by renowned deconstructivist architect Zaha Hadid, the Guangzhou Opera House was conceived as \u0027two pebbles smoothed by water.\u0027 Its sleek black-and-white visual contours and futuristic steel structure make it an absolute must-visit for photography enthusiasts. Whether admiring the geometric interplay of light and shadow during the day or the mesmerizing illumination at night, the architectural beauty is truly breathtaking.", "name": "Guangzhou Opera House", "transport": "Take the APM Metro Line to Opera House Station and walk about 200 meters."}, {"address": "No. 2 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | The architectural design of the Guangdong Museum was inspired by traditional Lingnan carved lacquerware boxes, earning it the affectionate nickname \u0027Moonlight Treasure Box.\u0027 This magnificent structure skillfully blends traditional culture with modern geometric aesthetics, featuring massive gray steel frames and black glass that create bold, 3D structural lines. Inside, besides rich exhibitions on Lingnan history, culture, and marine specimens, its spacious, light-filled central atrium is a popular spot for photography enthusiasts and architecture lovers.", "name": "Guangdong Museum", "transport": "Take the APM Metro Line to Opera House Station or Huacheng Avenue Station, then walk about 5 minutes."}, {"address": "No. 4 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located next to Flower City Square, Guangzhou Library\u0027s exterior design evokes the concept of \u0027stacked books,\u0027 symbolizing the accumulation of knowledge and cultural depth. Inside, it features an impressive multi-tiered atrium design and panoramic glass curtain walls that let in abundant natural light. Visitors love sitting by the high-floor windows to read while taking in panoramic views of Flower City Square and the Canton Tower, making it a favorite photo spot combining culture and scenery.", "name": "Guangzhou Library", "transport": "Take the APM Metro Line to Opera House Station and walk about 300 meters."}, {"address": "No. 6 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located inside the CTF Finance Centre (East Tower), K11 Guangzhou seamlessly blends premier art exhibitions with luxurious shopping experiences. The interior features rich metallic gold lines and sleek fluid decor, alongside sculptures and installation art by renowned contemporary international artists. Its art galleries and interactive exhibit areas host rotating themes, drawing fashion-forward crowds and influencers to showcase Tianhe CBD\u0027s sophisticated modern lifestyle aesthetic.", "name": "K11 Art Mall Guangzhou", "transport": "Take Metro Line 18 or the APM Line to Xiancun Station, or access directly via the underground walkway from Zhujiang New Town Station."}, {"address": "No. 218 Tianhe Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located in the heart of the Tianhe CBD commercial district, Parc Central features a unique architectural design resembling \u0027Double Koi Carp Leaping,\u0027 with a sleek steel canopy that mimics swimming koi. This open-air sunken park-style mall seamlessly blends lush green landscaping with modern retail space. Its stunning light show at night, along with flagship stores of international brands and trendy eateries, makes it a popular hotspot for youth photos, shopping, and hangouts.", "name": "Parc Central", "transport": "Take Metro Line 1 or 3 to Tiyu West Road Station; underground passages directly connect to the mall."}, {"address": "Liede Avenue section crossing the Pearl River, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Spanning the Pearl River, Liede Bridge features a unique single-tower cable-stayed design resembling a giant seashell, making it one of Guangzhou\u0027s iconic bridges. It serves as a premier vantage point for photographing the sunset over the Zhujiang New Town skyline and the Canton Tower\u0027s dazzling night views. Photographers and visitors flock to the bridge and waterfront promenade at twilight to capture passing boats against the shimmering CBD skyline.", "name": "Liede Bridge", "transport": "Take Metro Line 5 to Liede Station, exit, and walk towards the riverfront to reach the viewing promenade."}, {"address": "No. 6 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Standing 530 meters tall, the Guangzhou CTF Finance Centre (East Tower) is the tallest building in Guangzhou and an iconic skyscraper in South China. Its facade alternates white terra-cotta panels with glass curtain walls, exuding an elegant aesthetic. The upper floors house Rosewood Guangzhou and high-altitude bars, offering breathtaking 360-degree views of the Guangzhou cityscape and the vibrant night scenery along the Pearl River.", "name": "Guangzhou CTF Finance Centre (East Tower)", "transport": "Take Metro Line 18 or APM Line to Xiancun Station, or take Metro Line 3 or 5 to Zhujiang New Town Station and walk."}], "name": "Top Check-in Spots"}}, "name": "Zhujiang New Town and Tianhe CBD Business District"}};
        const cityName = "Guangzhou";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
