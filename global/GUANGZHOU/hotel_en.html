 infusing a modern gallery aesthetic. The property displays paintings and handicrafts from local artists, creating a vibrant artistic atmosphere. Rooms feature large relaxing soaking tubs and ambient warm lighting, alongside a Guzheng (zither) experience and tea tasting area\u2014a sophisticated base to explore Mount Baiyun and immerse in local heritage.", "name": "Yunfeng Stroll Art Homestay Guangzhou", "transport": "Take Bus 179 or 241 to Baiyun Mountain South Gate Station and walk for 6 minutes", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Yunfeng%2520Stroll%2520Art%2520Homestay%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Yunfeng%2520Stroll%2520Art%2520Homestay%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Yunfeng%20Stroll%20Art%20Homestay%20Guangzhou", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Yunfeng%20Stroll%20Art%20Homestay%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 288 Huangshi East Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | Embracing a \u0027Forest Oasis\u0027 concept, this trendy serviced apartment is surrounded by lush trees right next to the West Gate of Mount Baiyun. Room decor utilizes soft natural tones complemented by abundant indoor plants for a refreshingly soothing stay. Units come fully equipped with smart home systems, premium audio speakers, and capsule coffee machines, alongside 24-hour self-check-in. A seamless fusion of privacy and tech-forward convenience, ideal for urban travelers who value quality living.", "name": "Yunshan Poetic Oasis Select Apartment Guangzhou", "transport": "About a 15-minute walk from Exit A of Xiaogang Station, Metro Line 2, or transfer to a bus", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Yunshan%2520Poetic%2520Oasis%2520Select%2520Apartment%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Yunshan%2520Poetic%2520Oasis%2520Select%2520Apartment%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Yunshan%20Poetic%20Oasis%20Select%20Apartment%20Guangzhou", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Yunshan%20Poetic%20Oasis%20Select%20Apartment%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 398 Tonghe Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 Stars | Located in the Tonghe commercial district on the eastern side of Mount Baiyun, this boutique homestay strikes a perfect balance between vibrant city life and peaceful mountains. Inspired by Japanese Wabi-Sabi aesthetics and New Chinese design, it features a tranquil tatami tea room and a bamboo garden. Every guest room boasts excellent natural lighting, a king-size bed, and a private en-suite shower. With warm, attentive staff offering complimentary late-night desserts and Mount Baiyun hiking maps daily, it comes highly recommended by families and vacationers.", "name": "Tonghe Shanyu Qingfeng Boutique Homestay Guangzhou", "transport": "About a 10-minute walk from Exit C of Tonghe Station, Metro Line 3", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Tonghe%2520Shanyu%2520Qingfeng%2520Boutique%2520Homestay%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Tonghe%2520Shanyu%2520Qingfeng%2520Boutique%2520Homestay%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Tonghe%20Shanyu%20Qingfeng%20Boutique%20Homestay%20Guangzhou", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Tonghe%20Shanyu%20Qingfeng%20Boutique%20Homestay%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 770 Baiyun Avenue North, Baiyun District, Guangzhou", "feature": "\u2b50 4.4 Stars | Radiating family warmth and bright sunshine, this duplex garden homestay boasts a spacious sunroom and a private garden. Featuring a kids\u0027 play corner and pet-friendly spaces, it is ideal for family trips or traveling with pets. Guest rooms showcase colorful, cozy American country-style decor. Situated near Mount Baiyun and Peach Blossom Ravine, guests can easily enjoy spring flower viewing, while evenings offer courtyard cocktails or open-air movies for a delightful vacation experience.", "name": "Baiyun Mountain Sunshine Courtyard Homestay Guangzhou", "transport": "Take Metro Line 2 to Huangbian Station Exit D, then transfer to Bus 529 to Baiyun Avenue North Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Baiyun%2520Mountain%2520Sunshine%2520Courtyard%2520Homestay%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Baiyun%2520Mountain%2520Sunshine%2520Courtyard%2520Homestay%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Baiyun%20Mountain%20Sunshine%20Courtyard%20Homestay%20Guangzhou", "trip": "https://tw.trip.com/ho ngdong Province", "feature": "\u2b50 4.5 Stars | Managed by Marriott International, China Hotel is located next to Yuexiu Park and stands as one of Guangzhou\u0027s most iconic original 5-star landmarks from the early reform and opening era. Adjacent to Liuhuahu Park and the Museum of the Nanyue King, it offers deep cultural heritage. Featuring spacious and comfortable rooms, a large outdoor pool, spa center, and several renowned Cantonese and international restaurants, it provides an elegant and luxurious stay for both business and leisure travelers.", "lat": 23.1186453, "lng": 113.2603913, "name": "China Hotel", "transport": "Take Metro Line 2 to Yuexiu Park Station (Exit D1) for direct access to the hotel entrance.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520China%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1186453%2C113.2603913", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1186453,113.2603913", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=China%20Hotel%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 120 Liuhua Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Founded in 1961, Dongfang Hotel Guangzhou is a historic, state-guest house level luxury landmark. It features nearly 10,000 m\u00b2 of central courtyard gardens and a lush poolside landscape, showcasing classic and elegant Lingnan architectural elements. Located near Yuexiu Park and the Mausoleum of the Nanyue King, it is extremely close to Beijing Road Pedestrian Street and the former Canton Fair site. Offering authentic Cantonese morning tea (dim sum) and meticulous room service, it perfectly exhibits the unique charm of a classic Guangzhou heritage hotel.", "lat": 22.7551141, "lng": 113.5321491, "name": "Dongfang Hotel Guangzhou", "transport": "Take Metro Line 2 to Yuexiu Park Station (Exit D1), then walk about 3 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Dongfang%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D22.7551141%2C113.5321491", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=22.7551141,113.5321491", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Dongfang%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 391 Dongfeng Middle Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated in the heart of the municipal government and Dongfeng Road commercial area, DoubleTree by Hilton Hotel Guangzhou is close to Beijing Road Pedestrian Street and Sun Yat-sen Memorial Hall. Guests are welcomed with the signature warm DoubleTree chocolate chip cookie. Rooms feature floor-to-ceiling panoramic windows overlooking Yuexiu Park and the vibrant cityscape. With an outdoor heated pool, a 24-hour fitness center, and a top-notch Cantonese restaurant, it is a premier choice for modern luxury when exploring Guangzhou\u0027s historic old town.", "lat": 23.1343006, "lng": 113.2656726, "name": "DoubleTree by Hilton Hotel Guangzhou", "transport": "Take Metro Line 1 to Peasant Movement Institute Station (Exit D) and walk for about 10 minutes, or take Metro Line 2 to Sun Yat-sen Memorial Hall Station and walk for about 12 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520DoubleTree%2520by%2520Hilton%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1343006%2C113.2656726", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1343006,113.2656726", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=DoubleTree%20by%20Hilton%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 8 Qiaoguang Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Towering over Haizhu Square along the picturesque Pearl River, Hotel Landmark Canton sits at the core of Yuexiu District\u0027s historical axis, just steps away from Beijing Road Pedestrian Street. The hotel boasts unbeatable night views of the Pearl River, featuring a revolving panoramic restaurant and a rooftop bar on the top floor. Guests can easily walk to the Yanjiang West Road bar street or board a Pearl River night cruise. Equipped with comprehensive facilities and a cross-border direct bus station, its location offers unmatched convenience.", "lat": 23.1176015, "lng": 113.2626112, "name": "Hotel Landmark Canton", "transport": "Take Metro Line 2 or Line 6 to Haizhu Square Station (Exit F) for direct access.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Hotel%2520Landmark%2520Canton", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1176015%2C113.2626112", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1176015,113.2626112", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Hotel%20Landmark%20Canton%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 2 Guangwei Road, Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Located right next to the Guangzhou Municipal Government in the heart of the Beijing Road Historical and Cultural Area, Guangdong Hotel Guangzhou is just a few minutes\u0027 walk from Beijing Road Pedestrian Street. This upscale business and leisure hotel offers a quiet environment, high security, and elegant, comfortable rooms. It features a refined Cantonese restaurant, fitness center, and multi-functional conference halls. Step outside to explore the ancient millennia-old road, Dafo Temple, and the Nanyue Kingdom Wooden Sluice Site, making it an ideal base to experience Old Guangzhou\u0027s historical charm and vibrant city life.", "lat": 23.1345855, "lng": 113.2622213, "name": "Guangdong Hotel Guangzhou", "transport": "Take Metro Line 1 or Line 2 to Gongyuanqian Station (Exit I2), then walk about 5 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Guangdong%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1345855%2C113.2622213", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1345855,113.2622213", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Guangdong%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 339 Huanshi East Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located in the CBD core of Huanshi East Road in Yuexiu District, Crowne Plaza Guangzhou City Centre is an international 5-star hotel combining luxury and convenience. It fea %20Points%20by%20Sheraton%20Guangzhou%20Haizhu%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "Guangzhou International Finance Center, No. 5 Zhujiang West Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Occupying floors 74 to 98 of the International Finance Centre (IFC). Although administratively located in Zhujiang New Town, it directly faces Canton Tower and the Haizhu Riverside Cultural Area, making it one of the most iconic top-tier ultra-luxury landmark hotels to admire the Canton Tower and Haizhu riverside skyline. Features a magnificent grand atrium and massive cloud-level floor-to-ceiling windows, allowing guests a bird\u0027s-eye view of Canton Tower across the river and the beautiful riverside scenery of Haizhu for an incomparable, prestigious experience in the clouds.", "lat": 23.1204288, "lng": 113.3179702, "name": "Four Seasons Hotel Guangzhou", "transport": "Take Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, or take the APM Line to \u0027Huacheng Avenue Station\u0027, then walk for about 5 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Four%2520Seasons%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1204288%2C113.3179702", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1204288,113.3179702", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Four%20Seasons%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "CTF Finance Centre, No. 6 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Situated at the top of the CTF Finance Centre (East Towe 026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Guangzhou%2520Chimelong%2520Giraffe%2520Parent-Child%2520Theme%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Guangzhou%20Chimelong%20Giraffe%20Parent-Child%20Theme%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Guangzhou%20Chimelong%20Giraffe%20Parent-Child%20Theme%20Apartment%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "Poly Metropolis, Hanxi Avenue East, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A unique homestay apartment themed around forests and nature, featuring lush green elements and faux wood interiors that feel like a cozy forest cabin. Equipped with a large projection screen and comfortable sofa tatami, perfect for atmospheric movie nights. Quiet surroundings make it an ideal sanctuary to relax after a day at Chimelong Safari Park.", "name": "Guangzhou Chimelong Dream Forest Theme Apartment", "transport": "Take Guangzhou Metro Line 7 to \u0027Hanxi Changlong Station\u0027, Exit C, and walk for about 400 meters.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Guangzhou%2520Chimelong%2520Dream%2520Forest%2520Theme%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Guangzhou%2520Chimelong%2520Dream%2520Forest%2520Theme%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Guangzhou%20Chimelong%20Dream%20Forest%20Theme%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Guangzhou%20Chimelong%20Dream%20Forest%20Theme%20Apartment%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Homestays"}}, "name": "Panyu Chimelong Wildlife Theme Resort"}, "xiguan_liwan": {"categories": {"cat_1": {"items": [{"address": "No. 1 Shamian South Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Situated on the waterfront of Shamian Island in Liwan District, the White Swan Hotel is China\u0027s first five-star hotel designed, invested, and managed by Chinese, making it one of Guangzhou\u0027s most iconic landmarks. The hotel offers breathtaking views of the Pearl River and a deep Lingnan garden heritage; its classic indoor courtyard waterfall, \u0027Hometown Water,\u0027 is an absolute must-visit photo spot. It houses the 3-Michelin-starred Cantonese restaurant \u0027Jade River,\u0027 which serves Guangzhou\u0027s finest morning dim sum and traditional Cantonese delicacies. A stay here offers not only elegant luxury service, but also easy walking access to Shamian\u0027s European architectural complex and the Xiguan Grand Houses of Yongqing Fang for a perfect blend of history and modernity.", "lat": 23.1084679, "lng": 113.2373693, "name": "White Swan Hotel", "transport": "Take Guangzhou Metro Line 1 or Line 6 to \u0027Huangsha Station\u0027 (Exit F), then walk about 8 minutes onto Shamian Island to reach the hotel.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520White%2520Swan%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1084679%2C113.2373693", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1084679,113.2373693", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=White%20Swan%20Hotel%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 54 Shamian North Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located in the heart of Shamian Island in Liwan District, Guangdong Victory Hotel traces its origins back to the late 19th-century Victoria Hotel built by the British. With a history spanning over a century, it is one of the few well-preserved classic British-style luxury hotels in Guangzhou. Comprising East and West Wings, its classical European facade perfectly complements its elegant interior decor, exuding a nostalgic vintage charm. Opening the window reveals tree-lined avenues and heritage buildings. With its premier location, Yongqing Fang and Shangxiajiu Pedestrian Street are well within walking distance, making it an ideal choice for an immersive experience of Xiguan culture and European elegance.", "lat": 23.1104, "lng": 113.2401022, "name": "Guangdong Victory Hotel", "transport": "Take Guangzhou Metro Line 1 or Line 6 to \u0027Huangsha Station\u0027 (Exit E) and walk for about 6 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Guangdong%2520Victory%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1104%2C113.2401022", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1104,113.2401022", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Guangdong%20Victory%20Hotel%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 188 Dishifu Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated directly above Shangxiajiu Pedestrian Street in the core Xiguan area of Liwan, Atour S Hotel Shangxiajiu Guangzhou (formerly the landmark Holiday Inn Shifu) is one of the old city\u0027s most iconic upscale hotels. The property seamlessly blends modern lifestyle design with traditional elements like Manchuria stained-glass windows and Arcade (Qilou) architecture, offering a stay that merges style with heritage. Rooms are spacious and well-equipped with modern amenities, while the rooftop features an outdoor pool and observation deck overlooking old Xiguan tiled roofs and the streets of Yongqing Fang. Step downstairs directly into a vibrant traditional food street with century-old eateries like Tao Tao Ju and Lin Heung Tea House right at your doorstep.", "name": "Atour S Hotel Shangxiajiu Guangzhou", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027 (Exit A) and walk for about 7 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Atour%2520S%2520Hotel%2520Shangxiajiu%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Atour%2520S%2520Hotel%2520Shangxiajiu%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Atour%20S%20Hotel%20Shangxiajiu%20Guangzhou", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Atour%20S%20Hotel%20Shangxiajiu%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 293 Kangwang South Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Mehood Lestie Hotel (Shangxiajiu Yongqingfang Branch) is a top-rated luxury landmark boutique hotel in Liwan\u0027s Xiguan commercial area. It boasts an exceptional location just a few minutes\u0027 walk from the Yongqing Fang scenic area and the Cantonese Opera Art Museum. The design seamlessly fuses traditional Lingnan Xiguan culture with modern luxury, featuring exquisite local craftsmanship in the lobby and public areas. Guests enjoy ultra-attentive British-style butler service, complimentary afternoon tea, and late-night sweet soups. Rooms come equipped with HD projectors and high-end sound systems, making it a highly recommended luxury choice to explore Yongqing Fang\u0027s night view and Xiguan charm.", "name": "Mehood Lestie Hotel Guangzhou Shangxiajiu Yongqingfang", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027 (Exit D2) or Line 8 to \u0027Hualinsi Station\u0027 (Exit C), and walk for about 5 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Mehood%2520Lestie%2520Hotel%2520Guangzhou%2520Shangxiajiu%2520Yongqingfang", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Mehood%2520Lestie%2520Hotel%2520Guangzhou%2520Shangxiajiu%2520Yongqingfang", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Mehood%20Lestie%20Hotel%20Guangzhou%20Shangxiajiu%20Yongqingfang", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Mehood%20Lestie%20Hotel%20Guangzhou%20Shangxiajiu%20Yongqingfang%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 113 Yanjiang West Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Standing by the Pearl River at the intersection of Yanjiang West Road and the Xiguan Cultural Area, the Oi Kwan Hotel held the title of \u0027Tallest Building in Lingnan\u0027 for 30 years after its completion in 1937, serving as a momentous skyscraper landmark in Guangzhou\u0027s modern architectural history. Built in Gothic Revival and Art Deco styles, its shape resembles a grand ship sailing into the sea. Beautifully restored, the hotel recaptures the glamour of its golden age. The revolving restaurant on the 17th floor\u2014Guangzhou\u0027s very first revolving panoramic dining venue\u2014offers a 360-degree view of the Pearl River and historic Liwan, rich in legendary heritage and cultural allure.", "lat": 23.1122632, "lng": 113.2519361, "name": "Oi Kwan Hotel Guangzhou", "transport": "Take Guangzhou Metro Line 6 to \u0027Yide Road Station\u0027 (Exit A) and walk for about 6 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Oi%2520Kwan%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1122632%2C113.2519361", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1122632,113.2519361", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Oi%20Kwan%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 122 Liuhua Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | China Hotel Guangzhou is a renowned classic 5-star luxury hotel landmark in South China. Managed for many years by Marriott International, it holds cherished memories for generations of locals. Adjacent to Yuexiu Park and Liuhuahu Park, it is just a short drive from Liwan\u0027s Xiguan cultural area. The hotel houses several top-tier dining venues, including \u0027Four Seasons\u0027 and \u0027The Verandah,\u0027 serving exceptional Lingnan delicacies and refined Cantonese dim sum. Rooms are spacious and grand, combining modern luxury with Lingnan artistic decor. Complete with an outdoor swimming pool, fitness center, and full spa, it guarantees premier comfort for travelers exploring old Guangzhou culture.", "lat": 23.1425439, "lng": 113.2544102, "name": "China Hotel Guangzhou", "transport": "Take Guangzhou Metro Line 2 to \u0027Yuexiu Park Station\u0027 (Exit D1); the exit leads directly to the hotel lobby.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520China%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D23.1425439%2C113.2544102", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=23.1425439,113.2544102", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=China%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 120 Liuhua Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Established in 1961, Dongfang Hotel Guangzhou is one of the city\u0027s most historically rich 5-star state-guest landmark hotels. Located in the Liuhua commercial area near the old Xiguan cultural district, it boasts a rare 10,000-square-meter Lingnan subtropical courtyard garden and a large outdoor pool right in downtown Guangzhou. Elegant and grand, the hotel perfectly integrates traditional Lingnan garden aesthetics with modern five-star luxury service, having hosted countless domestic and international dignitaries. Its restaurants excel at authentic Cantonese cuisine and classic morning tea, allowing guests to stroll through lush green gardens and enjoy an exclusive, peaceful retreat amidst the bustling city.", "lat": 22.7551141, "lng": 113.5321491, "name": "Dongfang Hotel Guangzhou", "transport": "Take Guangzhou Metro Line 2 to \u0027Yuexiu Park Station\u0027 (Exit D1) and walk for about 3 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Dongfang%2520Hotel%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D22.7551141%2C113.5321491", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=22.7551141,113.5321491", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Dongfang%20Hotel%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 277 Yanjiang West Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | LN Hotel Five Guangzhou is a luxury landmark boutique hotel under the LN Hospitality group, located along the scenic Yanjiang Road riverfront on the north bank of the Pearl River, just a short drive from Liwan Xiguan and Shamian. Inspired by \u0027Old Guangzhou Stories,\u0027 the hotel artfully fuses classic Xiguan patterned tiles and traditional Cantonese porcelain art (Guangcai) with modern high-end fashion design. Every room features a private river-view balcony or tactile vintage furnishings. The rooftop \u0027Bar 5\u0027 offers sweeping views of the Pearl River night skyline and the Rainbow Bridge alongside top-tier Cantonese private dining, making it a stellar choice for travelers who love refined cultural stays and luxury aesthetics.", "name": "LN Hotel Five Guangzhou", "transport": "Take Guangzhou Metro Line 6 to \u0027Beijing Road Station\u0027 (Exit A) and walk for about 10 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520LN%2520Hotel%2520Five%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026 ined afternoon tea and freshly ground coffee, delivering a thoughtful and stylish accommodation experience.", "name": "\u79cb\u679c\u9152\u5e97 \u5ee3\u5dde\u4e0a\u4e0b\u4e5d\u6c38\u6176\u574a\u5e97 (Qiuguo Hotel Guangzhou Shangxiajiu Yongqingfang)", "transport": "Metro Line 1 Changshou Road Station Exit A, about a 7-minute walk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Qiuguo%2520Hotel%2520Guangzhou%2520Shangxiajiu%2520Yongqingfang", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Qiuguo%2520Hotel%2520Guangzhou%2520Shangxiajiu%2520Yongqingfang", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Qiuguo%20Hotel%20Guangzhou%20Shangxiajiu%20Yongqingfang", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Qiuguo%20Hotel%20Guangzhou%20Shangxiajiu%20Yongqingfang%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 133 Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 Stars | A distinctive design hotel beloved by photography enthusiasts and hipsters, inspired by the folk culture of Guangzhou\u0027s old Xiguan. Lingnan architectural elements like Tanglong sliding doors, carved wooden window frames, and vintage patterned tiles can be found throughout the space, integrated with sleek modern geometric lines. Rooms offer excellent natural light, and select room types feature private scenic balconies where guests can closely admire the vibrant daily life of old Xiguan arcade alleys, exuding a rich cultural charm.", "name": "\u5ee3\u5dde\u897f\u95dc\u5370\u8c61\u6587\u5275\u8a2d\u8a08\u9152\u5e97 (Guangzhou Xiguan Impression Design Hotel)", "transport": "Metro Line 1 Changshou Road Station Exit D1, about a 3-minute wal }}, {"address": "No. 8 Huacheng Road, Zhujiang New Town, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 Stars | Located in the west of Zhujiang New Town, near Huacheng Square and Guangzhou Opera House. Blending modern business aesthetics with cozy Nordic warmth, it offers spacious rooms equipped with large HD projectors, separate vanity areas, and kitchenette counters. The neighborhood boasts excellent amenities, packed with convenience stores, cafes, and local bars\u2014ideal for travelers wishing to immerse themselves in Guangzhou\u0027s vibrant nightlife and cultural landmarks.", "name": "Leighton Hotel Apartments Guangzhou", "transport": "About a 6-minute walk from Exit B1 of Zhujiang New Town Station (Metro Lines 3/5)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DGuangzhou%2520Leighton%2520Hotel%2520Apartments%2520Guangzhou", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DGuangzhou%2520Leighton%2520Hotel%2520Apartments%2520Guangzhou", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Guangzhou%20Leighton%20Hotel%20Apartments%20Guangzhou", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Guangzhou\u0026destName=Leighton%20Hotel%20Apartments%20Guangzhou%2C%20Guangzhou\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 88 Huacheng Avenue, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated in a high-rise tower in Zhujiang New Town, this viral Loft homestay was crafted by an emerging design team. Featuring floor-to-ceiling windows, it offers unobstructed panorama of the Canton Tower and the Pearl River nightscape. The interiors showcase a stylish fusion of French vintage and modern minimalism, complemented by home theater projection se         const cityNameEn = "Guangzhou";
        let curDist = null, curCat = null;

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); 
            container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No data available.</div>`;
                return;
            }
            
            document.getElementById('content-area').innerHTML = items.map(item => {
                const itemName = item.name || item.title || "Hotel";
                const itemFeature = item.feature || item.description || "";
                const itemAddress = item.address || item.location || "See Map Navigation";
                const itemTransport = item.transport || item.transit || "See Map";
                
                // 保留亮點的 Google 搜尋功能
                const searchKeyword = encodeURIComponent(`${cityNameEn} ${itemName}`);
                const formattedFeature = itemFeature.replace(/(⭐\s*[\d\.]+(?:\s*Stars?|\s*星)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 🚀 直接讀取 Python 預先處理好的網址
                const mapUrl = item.urls?.gmap || `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;
                const agodaUrl = item.urls?.agoda || '#';
                const bookingUrl = item.urls?.booking || '#';
                const tripUrl = item.urls?.trip || '#';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${itemName}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Highlights</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address：</span><br>${itemAddress}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transportation：</span><br>${itemTransport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> Map Navigation
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
