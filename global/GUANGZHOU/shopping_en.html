ty. Focusing on high-value casual shoes for men and women, handbags, and trendy apparel, their footwear is known for durability and comfort\u2014especially soft-soled loafers and white sneakers, making it a go-to shopping spot for local commuters and students.", "name": "hotwind Gate 5 Mall Store", "transport": "Take Guangzhou Metro Line 2 to Baiyun Park Station, Exit A, and walk for about 6 minutes."}, {"address": "1F Store, Baiyun Wanda Plaza, No. 501 Yuncheng East Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 stars | Must-Buy List: High-end business silk-linen shirts, wool-blend suit jackets, minimalist genuine leather briefcases. Founded in Guangzhou, CANUDILO is a high-end menswear brand famous across South China for exquisite tailoring and premium fabrics. The store specializes in upscale smart-casual wear, formal business attire, fine leather shoes, and briefcases. With a sophisticated, dignified aesthetic and meticulous attention to detail, it is tailor-made for shoppers seeking premium menswear and business accessories.", "name": "CANUDILO Baiyun Specialty Store", "transport": "Take Guangzhou Metro Line 2 to Feixiang Park Station, Exit A, and walk for about 8 minutes."}, {"address": "2F, Gate 5 Mall, No. 353 Yunxiao Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.2 stars | Must-Buy List: Classic Mary Jane shoes, versatile block-heel ankle boots, Chanel-style quilted chain bags. EXULL is an affordable fashion footwear and bag store loved by local young women, featuring styles ranging from Korean sweet aesthetics to urban commuting and retro fashion. The store closely follows seasonal trends, focusing on comfort for shoe designs and offering a diverse selection of quality bags. With huge seasonal sales discounts, it\u0027s a great value spot for picking up trendy footwear and matching bags.", "name": "EXULL Gate 5 Mall Flagship Store", "transport": "Take Guangzhou Metro Line 2 to Baiyun Park Station, Exit A, and walk for about 6 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Next to Yuntai Garden, Baiyun Mountain Scenic Area, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Schefflera Honey (Duckfoot Honey), Natural Royal Jelly, Bee Pollen Gift Box. A well-established local bee products shop located inside the Baiyun Mountain Scenic Area. It harvests natural nectar from the rich vegetation and flora of Baiyun Mountain. Their Schefflera Honey features a unique flavor with subtle herbal notes, making it a favorite healthy and natural souvenir for hikers and visitors.", "name": "Baiyun Mountain Bee Products Shop", "transport": "Take Bus 24 or 63 to Yuntai Garden Bus Terminal, then walk for about 3 minutes."}, {"address": "No. 1039 Baiyun Avenue South, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy List: Traditional Handmade Chick Biscuits (Jizai Bing), Handmade Sweetwife Cakes (Lao Po Bing), Cantonese Egg Yolk Lotus Seed Pastry. A specialty souvenir shop set up near Baiyun Mountain by the century-old brand Tao Tao Ju. Their Chick Biscuits are fragrant, crispy, and savory-sweet, while the Sweetwife Cakes feature flaky layered crusts with soft, chewy fillings\u2014making them exquisite gifts showcasing traditional Guangzhou pastry craftsmanship.", "name": "Tao Tao Ju Souvenir Shop", "transport": "Take Metro Line 2 to Baiyun Park Station (Exit B), then walk for about 10 minutes."}, {"address": "No. 228 Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.7 Stars | Must-Buy List: Cantonese Cured Sausage Gift Box, Handmade Honeycomb Egg Rolls, Walnut Pastries. A famous food brand under Guangzhou Restaurant, this branch offers the most complete selection of Cantonese souvenirs in beautiful packaging. Their cured sausages are marinated with premium pork and Rose Liqueur, bursting with aroma when steamed; the handmade egg rolls are rich and crispy, perfect as gifts for family and friends.", "name": "Guangzhou Restaurant Likoufu", "transport": "Take Bus 175 or 179 to Baiyun Cableway Station, then walk for about 5 minutes."}, {"address": "No. 498 Sanyuanli Avenue, Baiyun District, Guangzhou", "feature": "\u2b50 4.4 Stars | Must-Buy List: Tiancun First-Draw Premium Light Soy Sauce, Cantonese Sweet Vinegar (Tianding Vinegar), Traditional Small-Mill Sesame Oil. Founded during the Ming Dynasty, this 400-year-old seasoning brand is a staple in local Guangzhou kitchens. Its Cantonese Sweet Vinegar is the soul ingredient for making the famous Cantonese dish \u0027Pig\u0027s Trotters and Ginger in Sweet Vinegar\u0027, rich and sweet, highly loved by culinary enthusiasts.", "name": "Zhimeizhai Seasoning Shop", "transport": "Take Metro Line 2 to Sanyuanli Station (Exit A), then walk for about 8 minutes."}, {"address": "Next to Baiyun Cableway Hub, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy List: \u0027Erfen Tou\u0027 Cured Sausages (30% Fat 70% Lean), Cantonese Cured Pork Belly, Gold Medal Duck Sausages. Renowned as the \u0027King of Cantonese Cured Meats\u0027, this century-old brand meticulously selects ingredients and follows traditional curing and baking techniques. Their signature sausages carry a rich aromatic liquor fragrance with a perfect balance of fat and lean meat, making them an absolute delicacy whether cooked in claypot rice or stir-fried.", "name": "Huangshanghuang Cured Meats Shop", "transport": "Take Bus 24 or 285 to Baiyun Cableway Station, then walk for about 2 minutes."}, {"address": "Inside Shennong Chaotang, No. 389 Shatai North Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.8 Stars | Must-Buy List: Wong Lo Kat Original Herbal Tea Concentrate Packs, Shennong Herbal Tortoise Jelly Powder, Herbal Anti-Cold Tea Bags. Located next to the Shennong Chaotang Traditional Chinese Medicine Museum at the foot of Baiyun Mountain, this specialty store combines Lingnan herbal tea culture to offer convenient natural herbal tea bags and herbal jelly. It is the best choice to experience and take home Lingnan wellness culture.", "name": "Shennong Chaotang Herbal Tea Experience Store", "transport": "Take Bus 246 or 808 to Guangyao Baiyunshan Station, then walk for about 5 minutes."}, {"address": "No. 788 Baiyun Avenue South, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Pure Lotus Seed Paste Mooncakes, Traditional Dragon\u0027s Beard Candy, Mang Gong Biscuits. Known as the \u0027First House of Lotus Paste\u0027, this century-old brand has a flagship store along the main road near Baiyun Mountain. Their Dragon\u0027s Beard Candy features fine, delicate threads that melt in your mouth, while the Mang Gong Biscuits are rich, savory, and crispy, brimming with nostalgic Guangzhou flavor.", "name": "Lianxianglou Souvenir Flagship Store", "transport": "Take Metro Line 2 to Baiyun Cultural Square Station (Exit C), then walk for about 12 minutes."}, {"address": "1st Floor, Visitor Center, Yuntai Garden, Baiyun Mountain, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 Stars | Must-Buy List: Baiyun Maojian Tea, Lingnan Lychee Black Tea, High-Mountain Cloud Green Tea Gift Box. Located at the entrance of Yuntai Garden in Baiyun Mountain, this specialty tea gift shop features high-quality teas from Baiyun Mountain and Lingnan high-altitude regions. Baiyun Maojian features a clear liquor with a lingering sweet aftertaste, packaged with traditional landscape paintings of Baiyun Mountain, making it highly collectible and memorable.", "name": "Baiyun Mountain Yuntai Tea \u0026 Gift Shop", "transport": "Take Bus 24, 63, or 240 to Yuntai Garden Bus Terminal; the shop is right there."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 890 Yuncheng West Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 stars | Must-buy List: Discounted past-season Nike running shoes, minimalist Adidas Originals hoodies, and lightweight Samsonite luggage. Located near the western foothills of Baiyun Mountain, Teemall Outlet is an outlet center owned by Teemall, a veteran Guangzhou department store brand. It brings together hundreds of famous international and domestic sportswear brands, men\u0027s and women\u0027s apparel, shoes, bags, and accessories. Offering massive discounts ranging from 70% to 90% off, it is a top shopping destination for locals and savvy travelers hunting for high-value brand-name fashion.", "name": "Teemall Outlet Baiyun Store", "transport": "Take Guangzhou Metro Line 2 to \u0027Baiyun Park Station\u0027, Exit A, and walk for about 5 minutes."}, {"address": "No. 730 Yuncheng West Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.4 stars | Must-buy List: Retro FILA chunky sneakers, classic Levi\u0027s jeans, and stylish Oppo accessories. Transformed from the old Baiyun Airport terminal building, this unique shopping plaza is steeped in aviation history. The mall features a large brand discount zone showcasing popular streetwear and major sportswear brands. Visitors can enjoy great outlet deals on clothing while taking in the spacious, aviation-themed nostalgic ambience and dining options.", "name": "G5 Plaza Outlet Mall", "transport": "Take Guangzhou Metro Line 2 to \u0027Baiyun Park Station\u0027, Exit A or A1, and walk for about 8 minutes."}, {"address": "No. 503 Yuncheng East Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.6 stars | Must-buy List: Locally designed canvas bags, minimalist Japanese scented candles, and exquisite handmade ceramic cups. Located right next to the Baiyun Mountain scenic area, this elegant and modern department store brings together fashion apparel, beauty skincare, and creative lifestyle products. The basement and upper floors feature many stylish independent designer counters and boutique shops. With its bright and comfortable environment, it is highly popular among young locals and visitors looking to unwind after hiking Baiyun Mountain.", "name": "CapitaMall Yunshang", "transport": "Directly connected to Exit A underground concourse of \u0027Baiyun Park Station\u0027 on Guangzhou Metro Line 2."}, {"address": "No. 501 Yuncheng East Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 stars | Must-buy List: Metersbonwe collaboration T-shirts, traditional Cantonese herbal tea gift sets, and Huawei flagship store exclusive earphones. An iconic large-scale comprehensive commercial complex at the foot of Baiyun Mountain, housing hundreds of brand counters and a massive supermarket. The mall features digital flagship stores, fashion chains, and special Lingnan product zones. With top-notch amenities, entertainment, and dining, it serves as a fully equipped classic shopping landmark in Baiyun District.", "name": "Baiyun Wanda Plaza", "transport": "Take Guangzhou Metro Line 2 to \u0027Feixiang Park Station\u0027, Exit A, and walk for about 6 minutes."}, {"address": "Inside CapitaMall, No. 888 Yuncheng West Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.7 stars | Must-buy List: Artistic cotton-linen maxi dresses, handcrafted plant-dyed scarves, and uniquely tailored designer jackets. Founded in Guangzhou, EXCEPTION de MIXMIND is a top Chinese original designer fashion brand known for its blend of Eastern philosophy and natural aesthetics. The Baiyun store combines traditional Lingnan architectural elements with modern minimalism, displaying elegant, high-texture cotton-linen garments and handcrafted accessories\u2014perfect for fashion lovers seeking independent design and refined taste.", "name": "EXCEPTION de MIXMIND Baiyun Store", "transport": "Take Guangzhou Metro Line 2 to \u0027Baiyun Park Station\u0027, Exit A, connecting to 1F of the mall."}, {"address": "1F, Baiyun Wanda Plaza, No. 501 Yuncheng East Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.6 stars | Must-buy List: 9-color eyeshadow palette (Red Fox edition), Bionic Film serum lipstick, and Business Card lip stain. Perfect Diary, a domestic beauty super-brand originating from Guangzhou, offers free trials and personalized makeup consultations for its full line of hit products at this Baiyun experience store. The store features trendy avant-garde decor with high-quality, ultra-affordable products, making it a top local makeup souvenir choice for visitors to Guangzhou.", "name": "Perfect Diary Baiyun Experience Store", "transport": "Take Guangzhou Metro Line 2 to \u0027Feixiang Park Station\u0027, Exit A, and walk for about 6 minutes."}, {"address": "No. 808 Sanyuanli Avenue, Baiyun District, Guangzhou City", "feature": "\u2b50 4.8 stars | Must-buy List: Top-grade first-draw soy sauce gift box, Tianding sweet vinegar, and traditional Old Guangzhou souvenir gift boxes. Dating back to the Ming and Qing dynasties with a 400-year history, Zhimeizhai is a legendary sauce house brand. Its Baiyun flagship store not only sells traditionally brewed premium soy sauce and condiments but also integrates Lingnan culture into its packaging design. Offering exquisite gift sets rich in cultural heritage and practical value, it is a time-honored brand highly recommended by locals and tourists alike.", "name": "Zhimeizhai Heritage \u0026 Cultural Store", "transport": "Take Guangzhou Metro Line 2 to \u0027Sanyuanli Station\u0027, Exit A, then transfer to a bus or taxi for about 5 minutes."}, {"address": "Near Baiyun Mountain Cable Car Entrance, No. 238 Guangyuan Middle Road, Baiyun District, Guangzhou City", "feature": "\u2b50 4.6 stars | Must-buy List: Hand-painted Guangcai porcelain tea sets, Lingnan floral pattern silk scarves, and handcrafted embroidered sachet bags. Located near the Baiyun Mountain Scenic Area, this unique independent craft boutique highlights Guangzhou\u0027s intangible cultural heritage \u0027Guangcai\u0027 (Guangzhou polychrome enamel porcelain) and Lingnan-style handicrafts. The owner personally curates original works from veteran local artisans and young artists. Offering exquisite, elegant, and one-of-a-kind items, it is an excellent spot to purchase authentic cultural souvenirs of Guangzhou.", "name": "Guangcai Lingnan Porcelain \u0026 Craft Boutique", "transport": "Take Bus 24, 63, or 285 to \u0027Yuntai Garden Bus Terminal\u0027, and walk for about 3 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Baiyun Mountain Natural Scenic Area"}, "beijing_lu_yuexiu": {"categories": {"cat_1": {"items": [{"address": "No. 274 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: Guanshi herbal tea bags, Fritillaria and Loquat syrup, health-nourishing herbal packs. Caizhilin is a historically iconic Time-Honored Chinese Pharmacy in Guangzhou. Established during the Qing Dynasty, it has long been an authority on Lingnan herbal medicine and cooling teas. Stepping inside greets you with a rich herbal aroma, where knowledgeable staff offer personalized recommendations for dampness-relieving teas and Lingnan herbal supplements based on your body constitution. It is the premier destination to experience traditional Cantonese herbal beauty and wellness culture.", "name": "Caizhilin Pharmacy (Beijing Road Store)", "transport": "Metro Line 1 or 6, Gongyuanqian Station, Exit D, approx. 6-minute walk"}, {"address": "No. 194 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-Buy List: Xinhui aged tangerine peel Pu\u0027er tea, Zhuifeng Suhe pills, dried tangerine peel throat lozenges. Founded in 1600 AD during the Wanli period of the Ming Dynasty, Chen Li Ji is certified by Guinness World Records as the world\u0027s oldest operating pharmaceutical factory. Its Beijing Road flagship store seamlessly blends Lingnan traditional Chinese medicine with modern wellness lifestyles. Famous for its signature aged tangerine peel (Chenpi) products, it\u0027s us testing area and futuristic chic d\u00e9cor. Offering their complete range of best-selling eyeshadows and lip colors\u2014featuring silky textures and gorgeous packaging\u2014it is a must-visit beauty landmark for young travelers in Guangzhou.", "name": "Perfect Diary Concept Store (Beijing Road)", "transport": "Metro Line 6, Beijing Lu Station, Exit B, approx. 5-minute walk"}, {"address": "No. 280 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: Florasis Loose Powder, Grain Rain Whitening Repair Mask, Curel Cleansing \u0026 Makeup Remover Set. Located in the heart of Beijing Road Pedestrian Street, this massive KKV store boasts a bright yellow shipping-container design, featuring an entire wall of makeup sponges and cosmetics. Packed with trendy domestic C-beauty brands (like Grain Rain, Florasis, Judydoll) as well as imported drugstore products, offering thousands of items. It\u2019s a shopping paradise for beauty lovers looking to stock up and explore local makeup trends.", "name": "KKV (Beijing Road Flagship Store)", "transport": "Metro Line 1, Gongyuanqian Station, Exit D, approx. 6-minute walk"}, {"address": "No. 225 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Domestic niche perfumes, luxury skincare travel mini sets, indie brand repairing sheet masks. Blending industrial warehouse aesthetics with traditional Cantonese Arcade architecture, HARMAY is a buzzing beauty retail concept. The store offers a vast selection of luxury cosmetics samples, international niche cosmetics, and emerging Chinese indie brands. The seamless mix-and-match self-service vibe makes it a favorite haunt for beauty enthusiasts.", "name": "HARMAY (Guangzhou Beijing Road)", "transport": "Metro Line 6, Beijing Lu Station, Exit B, approx. 4-minute walk"}, {"address": "No. 295 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-Buy List: Bird\u0027s Nest Whitening Sheet Mask, Collagen Nourishing Hand Cream, Olive Moisturizing Lip Balm. Set inside a historic building on Beijing Road, this Watsons offers a full selection of international and Asian cosmetics, along with a dedicated section for local Guangzhou best-sellers. Frequently featuring special bundle deals and product trials, it\u2019s a super convenient spot for both locals and travelers to pick up daily skincare essentials.", "name": "Watsons (Beijing Road Historic Branch)", "transport": "Metro Line 1, Gongyuanqian Station, Exit D, approx. 5-minute walk"}], "name": "Iconic Local Beauty \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 11 Xiguyuan Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-buy list: Classic BADMARKET canvas bag, original graphic T-shirts, metallic mini leather pouch. Guangzhou\u0027s premier local streetwear brand located in Yuexiu\u0027s Dongshankou, this historic Western-style mansion has been transformed into a three-story minimalist boutique. The store focuses on street style apparel from local Guangzhou designers, simple yet durable canvas bags, and trendy accessories, making it a favorite among local youth and fashion enthusiasts.", "name": "BADMARKET (Dongshankou Store)", "transport": "Take Guangzhou Metro Line 1 or Line 6 to Dongshankou Station, Exit F, and walk for about 8 minutes."}, {"address": "No. 244 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-buy list: Handcrafted soft-soled leather loafers, time-honored comfortable walking shoes, retro leather sandals. A famous century-old shoe store in Guangzhou located right in the heart of Beijing Road Pedestrian Street. Renowned for decades for its exquisite traditional craftsmanship and exceptional comfort, it is a must-visit landmark for locals and savvy travelers. It specializes in high-quality leather footwear and casual shoes perfect for long walks.", "name": "Herming Shoes Store (Beijing Road)", "transport": "Take Guangzhou Metro Line 6 to Beijing Road Station, Exit B, and walk for about 3 minutes."}, {"address": "No. 2 Xiguyuan Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-buy list: Tailored independent designer dresses, niche structured bags, deconstructivist sneakers. A top fashion multi-brand boutique located in the historic Xinhepu area of Dongshankou, Yuexiu. The interior features a minimalist and geometric art style. Curating apparel, limited-edition footwear, and designer bags from local Guangzhou and cutting-edge global independent designers, it is a shopping paradise for those seeking unique, premium fashion pieces.", "name": "SND Designer Select Store (Dongshankou)", "transport": "Take Guangzhou Metro Line 1 or Line 6 to Dongshankou Station, Exit E, and walk for about 6 minutes."}, {"address": "No. 186 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 stars | Must-buy list: Sharp business blazers, versatile genuine leather tote bags, slim-fit knitwear. A well-known local Guangzhou women\u0027s fashion and leather goods brand deeply rooted in South China, featuring a massive flagship store on Beijing Road. Famous for meticulous tailoring, fine fabrics, and durable quality leather bags, it is ideal for women looking for high-value workwear and elegant handbags.", "name": "GIRDEAR Fashion \u0026 Bags (Beijing Road Store)", "transport": "Take Guangzhou Metro Line 6 to Beijing Road Station, Exit B, and walk for about 4 minutes."}, {"address": "No. 295 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-buy list: Pure cotton printed loose dresses, original hand-painted canvas bags, retro linen short-sleeved shirts. Originating in Guangzhou, this famous local cotton and linen apparel brand offers a flagship boutique on Beijing Road filled with a natural, artistic vibe. Clothes are made primarily from natural, comfortable cotton and linen in fresh, relaxed cuts. Paired with unique canvas bags and flats, it perfectly embodies the relaxed Lingnan lifestyle.", "name": "INMAN Cotton \u0026 Linen Boutique (Beijing Road)", "transport": "Take Guangzhou Metro Line 1 or Line 2 to Gongyuanqian Station, Exit D, and walk for about 6 minutes."}, {"address": "No. 10 Peizheng Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-buy list: American vintage oversized hoodies, multi-pocket utility crossbody bags, original illustrated streetwear caps. Hidden in the historic mansion area of Dongshankou, this local Guangzhou streetwear store blends American retro aesthetics with modern street style. Featuring original apparel and practical bags created by local young designers, it offers high quality at accessible prices\u2014a must-visit indie boutique for trendy youth exploring Yuexiu District.", "name": "SINKING Original Design (Dongshankou)", "transport": "Take Guangzhou Metro Line 1 to Dongshankou Station, Exit F, and walk for about 10 minutes."}, {"address": "No. 26 Xinhepu Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-buy list: Vegetable-tanned leather handbags, modern Chinese frog-button tops, hand-stitched leather coin purses. An independent handcrafted studio located in the historic Xinhepu area of Dongshankou, Yuexiu, highlighting oriental aesthetics and artisanal warmth. Using natural vegetable-tanned leather and premium cotton-linen fabrics, every leather bag and Chinese-style garment is crafted by hand, boasting exceptional design and collectible souvenir value.", "name": "Wuyong Clothing \u0026 Handmade Leather Bags", "transport": "Take Guangzhou Metro Line 6 to Dongshankou Station, Exit E, and walk for about 12 minutes."}, {"address": "No. 280 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.2 stars | Must-buy list: IP collaboration graphic T-shirts, lightweight windproof hooded jackets, high-capacity utility backpacks. A classic casual wear brand that grew up alongside generations in Guangzhou and South China, featuring a spacious flagship store on Beijing Road. Renowned for its incredible value, durable basic cotton apparel, and trendy IP collaboration backpacks, it is a popular destination for affordable everyday wear and travel bags.", "name": "Baleno (Beijing Road Flagship Store)", "transport": "Take Guangzhou Metro Line 6 to Beijing Road Station, Exit B, and walk for about 5 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "No. 271 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Authentic Chicken Biscuits (Ji Zai Bing), Handmade Sweet Wife Cakes, Pure Lotus Seed Paste Mooncakes. A century-old brand, Lin Heung Tea House is famed for its lotus seed paste craftsmanship, earning it the title \u0027First House of Lotus Seed Paste.\u0027 Its signature chicken biscuits are savory, crispy, and perfectly balanced between sweet and salty, infused with a hint of garlic and fermented red bean curd flavor. Beloved by both local Cantoneses and travelers, it makes an ideal gift representing traditional Guangzhou pastries.", "name": "Lin Heung Tea House - Beijing Road Branch", "transport": "Metro Line 6, Beijing Road Station, Exit B, approx. 5-minute walk"}, {"address": "No. 342 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy List: Cantonese Cured Sausage (30% fat ratio), Premium Cured Pork Belly, Gold Medal Cured Duck Leg. Known as the \u0027King of Cured Meats,\u0027 this century-old shop greets you with a rich aroma of Cantonese preserved meats the moment you step in. Made with premium pork and air-dried using a signature Rose Liqueur sauce marinade, these cured meats add mouthwatering fragrance to cured meat claypot rice, making them Guangzhou\u0027s most iconic savory souvenir.", "name": "Huang Shang Huang - Beijing Road Flagship Store", "transport": "Metro Line 1/2, Gongyuanqian Station, Exit D, approx. 6-minute walk"}, {"address": "No. 39 Wenming Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Must-Buy List: Premium First-Draw Soy Sauce (Tianding Touchou), Sweet Black Rice Vinegar (Tianding Sweet Vinegar), Pure Sesame Oil. Founded during the Chongzhen reign of the Ming Dynasty, this 400-year-old condiment house is considered the soul of Guangzhou home kitchens. Its top-grade first-draw soy sauce is naturally sun-brewed over time for a rich, savory-sweet flavor, while the sweet black vinegar is the essential ingredient for the Cantonese specialty \u0027Pork Trotter in Sweet Vinegar and Ginger.\u0027 It is a wonderfully unique and authentic edible gift.", "name": "Zhi Mei Zhai Seasoning Shop", "transport": "Metro Line 6, Beijing Road Station, Exit B, approx. 7-minute walk"}, {"address": "No. 280 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Crispy Chicken Biscuits, Mang Gong Biscuits (Blind Man\u0027s Biscuits), Handmade Walnut Pastries. Founded during the Guangxu reign of the Qing Dynasty, this Lingnan culinary titan offers traditional pastries bursting with authentic Cantonese charm. Gift boxes are elegantly designed, and the baked goods retain the unique aromatic crunch of traditional handmade baking, making them high in historical heritage and perfect for gifting.", "name": "Tao Tao Ju Bakery - Beijing Road Branch", "transport": "Metro Line 6, Beijing Road Station, Exit B, approx. 4-minute walk"}, {"address": "No. 239 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy List: Cantonese Cured Meat Gift Set, Egg Yolk Lotus Seed Paste Pastry, Traditional Cantonese Double-Yolk White Lotus Seed Paste Mooncakes. Likofu, the official souvenir brand under the renowned Guangzhou Restaurant (\u0027First House for Dining in Guangzhou\u0027), packages traditional Cantonese dishes and classic dim sum delicacies for travel. Featuring top-notch quality and exquisite packaging, these gifts are ideal for elders or high-end business gifting.", "name": "Guangzhou Restaurant Likofu - Beijing Road Branch", "transport": "Metro Line 6, Beijing Road Station, Exit B, approx. 3-minute walk"}, {"address": "No. 344 Zhongshan 4th Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Must-Buy List: Dual Pork \u0026 Duck Liver Sausage, Premium Fresh Pork Sausage, Cantonese Cured Pork. Founded in 1903, this century-old preserved meat shop is famous for its exclusive duck liver sausages, which are rich, tender, and lightly infused with aromatic liquor. Handcrafted adhering to traditional recipes, it is a go-to cured meat specialty store for local Guangzhou residents for festive occasions and daily cooking.", "name": "Cangzhou Zhan Cured Meat Shop", "transport": "Metro Line 1, Peasant Movement Institute Station, Exit D, approx. 5-minute walk"}, {"address": "No. 276 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.2 Stars | Must-Buy List: Aged Xinhui Dried Tangerine Peel, Guangdong Dampness-Relieving Herbal Tea Packs, Cantonese Slow-Cooked Soup Ingredient Packs. A 200-year-old traditional Chinese pharmacy in Guangzhou. Beyond standard Chinese herbs, it specializes in premium medicinal soup ingredients essential for Cantonese soups and top-quality aged Xinhui tangerine peels. It is perfect for visitors who want to experience Guangdong\u0027s famous slow-cooked soup and herbal wellness culture.", "name": "Cai Zhi Lin Chinese Pharmacy - Beijing Road Branch", "transport": "Metro Line 6, Beijing Road Station, Exit B, approx. 5-minute walk"}, {"address": "No. 194 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Must-Buy List: Traditional Almond Cakes, Handmade Peanut Brittle, Dragon\u0027s Beard Candy. Established in 1938, this historic snack shop specializes in a wide array of Lingnan candies and traditional biscuits. Its signature almond cakes are firm yet melt-in-your-mouth tender with a rich almond aroma. Affordable and packed with nostalgic vibes, it is a budget-friendly choice for classic traditional treats.", "name": "Qu Xiang Food - Beijing Road Branch", "transport": "Metro Line 6, Beijing Road Station, Exit A, approx. 3-minute walk"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 295 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Guangzhou Restaurant time-honored Chicken Biscuits (Ji Zai Bing), Lingnan Cantonese Porcelain (Guangcai) exquisite tea sets, Tao Tao Ju souvenir gift boxes. Founded in 1991, Grandbuy Department Store is one of Guangzhou\u0027s oldest and most iconic traditional department stores, serving as a core landmark of the Beijing Road commercial district. The mall gathers time-honored souvenirs, high-end cosmetics, gold jewelry, and Lingnan traditional handicrafts. It is the top choice for Guangzhou locals to shop for authentic Cantonese souvenirs and high-end goods during holidays, featuring an exceptionally comprehensive souvenir section on B1.", "name": "Grandbuy Department Store (Beijing Road)", "transport": "Take Guangzhou Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027 (Exit D), then walk for about 5 minutes."}, {"address": "No. 287 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Off-season Nike \u0026 Adidas sneakers at 70%-90% off, discounted limited-edition beauty gift sets, discounted women\u0027s wear from local independent designers. Headquartered in Guangzhou, the nationwide discount e-commerce giant VIPSHOP operates this large flagship outlet store on Beijing Road. The store highlights trending deal items and brand discounts, covering top international sportswear, brand-name women\u0027s apparel, and premium beauty products. With incredible daily deals, it\u0027s the ultimate spot for youth and locals hunting for high-value designer bargain items and clearance sales.", "name": "VIPSHOP Beijing Road Flagship Outlet Store", "transport": "Take Guangzhou Metro Line 6 to \u0027Beijing Lu Station\u0027 (Exit B), then walk for about 4 minutes."}, {"address": "No. 1 Jixiang Road, Yuexiu District, Guangzhou City, Guangdong Province (Underground Space at Gongyuanqian Metro Station)", "feature": "\u2b50 4.4 stars | Must-Buy List: Original Chinese ACG merch blind boxes, local designer Lolita dresses, limited-edition anime figures. Located beneath Gongyuanqian Metro Station and directly connected to the Beijing Road shopping area, this massive underground trendy mall is a holy land for ACG (Anime, Comic, Games) and subculture fans across Guangzhou and China. Spanning multiple levels and zones, it houses hundreds of indie anime shops, Guochao street fashion boutiques, JK uniforms, and Hanfu stores, showcasing Guangzhou\u0027s vibrant and representative youth subculture.", "name": "Guangzhou Comic City", "transport": "Take Guangzhou Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027; the exit directly connects to the underground mall."}, {"address": "No. 200 Guangzhou Qiyi Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Hand-painted Guangcai porcelain small dishes, miniature ivory/olive pit carvings from Guangzhou, hand-embroidered Cantonese silk scarves. This authoritative, time-honored institution specializes in displaying and selling Lingnan traditional fine arts and crafts. Every piece available here is crafted by Guangdong master artisans and heirs of intangible cultural heritage. More like a shop-able craft museum than a standard retail venue, it is an indispensable treasure trove for visitors who appreciate high-end Oriental aesthetics and fine local craftsmanship.", "name": "Guangdong Arts and Crafts Museum Shop", "transport": "Take Guangzhou Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027 (Exit J), then walk for about 3 minutes."}, {"address": "Central Plaza, No. 18 Jianshe Dama Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Samsonite discounted suitcases, department store brand men\u0027s leather boots starting at 90% off, clearance rack women\u0027s apparel from international mid-tier brands. This is another major discount hub under the Grandbuy Group located in Yuexiu District, featuring a dedicated large-scale outlet zone. It regularly hosts store-closing and end-of-season sales featuring clothing, shoes, bags, and home textiles. Offering deep discounts with authentic quality guarantees, it\u0027s ideal for bargain hunters seeking high quality at affordable prices.", "name": "Grandbuy Central Plaza Outlet Center", "transport": "Take Guangzhou Metro Line 5 to \u0027Taojin Station\u0027 (Exit A), then walk for about 8 minutes."}, {"address": "No. 246 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Botanical moisturizing scented hand cream, Guochao-themed eyeshadow palettes, rainbow snack blind boxes. Located in the heart of Beijing Road Pedestrian Street, this massive creative lifestyle flagship store stands out with its signature yellow warehouse-style decor. Spanning multiple floors, it features local youth favorites including Guochao cosmetics, an imported snack wall, an accessory wall, and stationery lifestyle goods. With visually stunning displays and an expansive selection of trendy items, it is a prime spot to experience Guangzhou\u0027s modern retail trends and pick up fun gifts.", "name": "KKV Beijing Road Flagship Store", "transport": "Take Guangzhou Metro Line 6 to \u0027Beijing Lu Station\u0027 (Exit B), then walk for about 5 minutes."}, {"address": "No. 276 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Cantonese slang tote bags, pop-up postcards of Beijing Road\u0027s Ancient Road relic, Lingnan Manchu window-shaped stamp sets. Following a complete revamp, this century-old bookstore transformed into a lifestyle experience store rich in Lingnan architectural charm. Seamlessly blending traditional Arcade (Qilou) buildings and Manchu window aesthetics, it offers not only books but also exclusive lifestyle products themed around Guangzhou\u0027s ancient history and Cantonese culture, drawing crowds of young visitors to soak in the heritage and shop for unique gifts.", "name": "Guangzhou Xinhua Bookstore Cultural \u0026 Creative Hall", "transport": "Take Guangzhou Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027 (Exit D), then walk for about 6 minutes."}, {"address": "No. 68 Zhongshan 5th Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Guangzhou original streetwear graphic tees, Japanese vintage-style canvas shoes, exclusive merch from specialty craft tea shops. Located at the intersection of Zhongshan 5th Road and Beijing Road, this classic shopping center is a favorite among local youth and students in Yuexiu District. The mall houses numerous local streetwear brands, beauty select shops, anime merch hubs, and trendy eateries. Compared to traditional department stores, it offers a youthful, subcultural vibe, making it a great destination to catch current youth fashion trends in Guangzhou.", "name": "Mayflower Plaza", "transport": "Take Guangzhou Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027 (Exit E); the exit directly connects to the mall."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Beijing Road and Yuexiu Historic Old Town Area"}, "canton_tower_haizhu": {"categories": {"cat_1": {"items": [{"address": "1st Floor, Zone C, Liying Plaza, No. 354 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buys: Judydoll Highlight \u0026 Contour Palette, Joocyee Watery Gloss Lip Glaze, Flower Knows Unicorn Blush. A super popular multi-brand beauty store originating from Guangzhou. The store i : "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station, Exit B, and walk about 8 minutes."}, {"address": "1st Floor, Zhuying Starlight City, No. 352 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buys: Bingxi Skin Repair Lotion, Comfy Recombinant Collagen Mask, The Saem Tip Concealer. Headquartered in Guangdong, this mega yellow container-themed beauty and lifestyle store is situated in the film and arts shopping area south of Canton Tower. Featuring a visually stunning massive makeup sponge wall and cosmetics display, it specializes in local dermatological skincare and high-value C-beauty trends, making it a must-visit shopping paradise for hipsters and tourists.", "name": "KKV (Haizhu Zhuying Starlight City Branch)", "transport": "Take Guangzhou Metro Line 3 or Line 8 to Kecun Station, Exit D, and walk about 200 meters."}, {"address": "1st Floor, Poly Plaza, No. 1088 Xingang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buys: Carslan Black Tube Lipstick, Mistine Sunscreen, March Rabbit Makeup Sponge Set. A pioneering modern cosmetics store founded in Guangdong, famous for its iconic rainbow wall of beauty sponges. Focused purely on cosmetics, it offers an acclaimed stress-free self-service shopping environment. You can find the most comprehensive selection of popular Lingnan makeup and sun protection products, perfectly equipped with long-lasting cosmetics suited for Guangzhou\u0027s hot and humid climate.", "name": "THE COLORIST (Haizhu Poly Plaza Branch)", "transport": "Take Guangzhou Metro Line 4 or Line 8 to Wanshengwei Station, Exit A, directly connected to Poly Plaza."}, {"address": "Near TIT Creative Industry Zone, No. 13 Yiyuan South Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buys: Jingxiutang Astragalus Cream, Herbal Acne Repair Gel, Honeysuckle Soothing Spray. Backed by Guangzhou\u0027s famed GPHG and century-old Jingxiutang brand, this herbal beauty experience hall blends traditional Lingnan Chinese herbal wisdom with modern dermatology. Its Astragalus Cream and Acne Gel are affordable skincare holy grails passed down through generations in Guangzhou. Gentle and reasonably priced, they make authentic local souvenirs packed with Lingnan cosmeceutical heritage.", "name": "Baiyunshan Jingxiutang Herbal Beauty (Haizhu Branch)", "transport": "Take Guangzhou Metro Line 3 to Kecun Station, Exit A, and walk about 600 meters."}, {"address": "B1 Floor, Canton Tower, No. 222 Yuejiang West Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Must-Buys: Watsons Collagen Nourishing Hand Cream, Bird\u0027s Nest Whitening Mask, WellDerma Repair Spray. Located underground at Canton Tower, this flagship concept store features special local beauty and sun protection zones catered to tourists. Aside from international brands, it showcases trendy local skincare counters with free skin tests and personalized advice\u2014a great spot to restock beauty and sun care supplies after touring Canton Tower.", "name": "Watsons (Canton Tower Mall Branch)", "transport": "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station; the exit leads directly to Canton Tower Mall."}, {"address": "Zhujiang Party Pier Art Culture Zone, Yuejiang West Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.8 stars | Must-Buys: Love Lock Lipstick, Fairy Peach Blossom Powder, Engraved Silk Pressed Powder. Centered on the concept of \u0027Eastern Makeup Nurtured by Flowers\u0027, this exquisite C-beauty brand features a traditional aesthetic pop-up space in the Canton Tower riverside art zone. Products combine traditional relief craftsmanship with Lingnan floral skin-nourishing ingredients. With intricately detailed packaging worthy of art collection, it represents high-end C-beauty infused with Eastern aesthetics\u2014perfect for gifts or personal use.", "name": "Florasis (Canton Tower Riverside Pop-up / Experience Space)", "transport": "Take Guangzhou Tram (THZ1) to Party Pier Station, and walk about 3 minutes."}], "name": "Iconic Local Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "Fashion Block, TIT Creative Park, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-buy list: Comfortable cotton-linen dresses, retro embroidered cardigans, artsy canvas tote bags. As a famous cotton and linen womenswear brand born in Guangzhou, INMAN infuses a spirit of natural comfort into every piece. Located near the Haizhu Art \u0026 Cultural District, this experience store showcases an elegant, minimalistic cotton-linen lifestyle aesthetic. Featuring skin-friendly Tencel and premium linen blends, it is highly favored by locals and tourists who love a clean, natural style.", "name": "INMAN (INMAN Concept Store)", "transport": "Metro Line 3 or 8, Kecun Station, Exit A; about a 5-minute walk."}, {"address": "Building B3, TIT Creative Park, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-buy list: Cool tailored blazers, original graphic street T-shirts, leather metallic chain crossbody bags. Originating in Guangzhou and swept across the nation, MO\u0026Co. is a premier local womenswear brand known for its modern cool vibe and androgynous tailoring. The concept store in TIT Creative Park boasts a highly industrial, artsy ambiance, offering exclusive seasonal tailored pieces and limited-edition footwear and accessories that showcase Guangzhou\u0027s contemporary fashion creativity.", "name": "MO\u0026Co. (MO\u0026Co. TIT Creative Park Store)", "transport": "Metro Line 3 or 8, Kecun Station, Exit A; about a 6-minute walk."}, {"address": "Pearl River Party Pier Cultural \u0026 Art Zone, No. 218 Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.8 stars | Must-buy list: Hand-tailored 3D linen maxi dresses, botanical-dyed oriental silk scarves, minimalist handcrafted leather totes. EXCEPTION de MIXMIND is one of Guangzhou\u0027s top original designer brands, emphasizing the fusion of Eastern philosophy and natural fabrics. Located along Haizhu\u0027s riverside arts corridor, this tranquil, Zen-filled concept store showcases unique tailoring craft and highly collectible limited-edition shoes and bags\u2014a must-visit for travelers seeking high-quality fashion.", "name": "EXCEPTION de MIXMIND (EXCEPTION de MIXMIND Haizhu Boutique)", "transport": "Haizhu Tram Line 1, Party Pier Station, about a 3-minute walk; or transfer to the tram from Metro Line 3 Canton Tower Station."}, {"address": "Inside Canton Tower Cultural Performance \u0026 Exhibition Space, No. 222 Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-buy list: Deconstructed layered dresses, natural botanical-dyed textured tops, original design statement leather bags. Founded in Guangzhou by famous designer Ban Xiaoxue, the brand takes \u0027naturally occurring\u0027 as its core philosophy, blending artistic painting with deconstructive tailoring. Situated in the Canton Tower riverside arts circle, this store offers a rich array of design-forward shoes, bags, and apparel featuring flowing, multi-layered silhouettes loved by local art lovers.", "name": "BANXIAOXUE (BANXIAOXUE Canton Tower Boutique)", "transport": "Metro Line 3 or APM Line, Canton Tower Station, Exit A; about a 4-minute walk."}, {"address": "1F, Zone C, Liying Plaza, No. 354 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-buy list: Global travel print dresses, lightweight soft cashmere sun-protection knits, vintage French leather saddle bags. Born in Haizhu, Guangzhou, the popular fashion brand GOELIA draws inspiration from \u0027travel and female aesthetics.\u0027 Located near the iconic Canton Tower shopping area, this concept store seamlessly merges floral greenery with chic apparel. The fits are perfectly designed for Asian women, and the footwear and bags combine stylish aesthetics with practicality at exceptional value.", "name": "GOELIA (GOELIA Liying Plaza Concept Store)", "transport": "Directly accessible from Exit C of Metro Line 3 or 8, Kecun Station."}, {"address": "1-2F, Zone C, Liying Plaza, No. 354 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-buy list: Guangzhou original cropped designer tops, chunky retro dad sneakers, textured shoulder bags with metal buckles. URBAN REVIVO (UR) is an international fast-fashion giant nurtured in Guangzhou, often dubbed China\u0027s ZARA. Spanning spacious floors at Liying Plaza in Kecun, Haizhu, the flagship store boasts ultra-fast inventory updates. Its trendy shoes and bags section is especially recommended by local youth, offering on-trend seasonal items with luxury-level designs at accessible prices.", "name": "URBAN REVIVO (UR Liying Plaza Flagship)", "transport": "Metro Line 3 or 8, Kecun Station, Exit C; immediately accessible upon exit."}, {"address": "No. 138 Yiyuan Road, Haizhu District, Guangzhou (Near Canton Tower South Square)", "feature": "\u2b50 4.4 stars | Must-buy list: Customized vegetable-tanned leather wallets, hand-stitched leather loafers, minimalist leather backpacks. An independent handcrafted leather studio tucked in an artistic alley near Canton Tower, founded by local leather artisans. The shop offers exquisite handmade leather shoes and bags; customers can even select leather on-site for custom engraving, filling the space with warm handcrafted texture and local indie art vibes.", "name": "TuBao Leather \u0026 Shoes Lab", "transport": "Metro Line 3, Canton Tower Station, Exit B; about a 7-minute walk."}, {"address": "Shop 102, Zone B, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-buy list: Deconstructed retro sneakers, niche designer techwear nylon bags, Guangzhou local streetwear collabo caps. Located in the Party Pier art district along the Haizhu riverfront, this multi-brand streetwear select shop gathers trendy apparel, unique indie footwear, and functional bags from local independent designers in Guangzhou and South China. Featuring avant-garde industrial decor, it serves as a popular hub for Guangzhou\u0027s trendy youth and street culture enthusiasts.", "name": "S.P.O.T Select Shop", "transport": "Tram Line, Party Pier Station, about a 2-minute walk."}], "name": "Local Popular Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1st Floor, Canton Tower, No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Canton Tower 3D metal model, limited-edition Lingnan paper-cut postcards, gradient color painted mugs. Located on the ground floor of Canton Tower, this official flagship store is the top choice for landmark souvenirs. With a sleek modern design, the store incorporates the unique curves of the tower into creative products\u2014ranging from high-quality metal models to Lingnan Xiguan-style stationery and lifestyle products, making for wonderful keepsakes.", "name": "Canton Tower Official Souvenir Shop", "transport": "Take Metro Line 3 or the APM Line to Canton Tower Station, then walk about 2 minutes from the exit."}, {"address": "No. 208 Nanhua East Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Century-old handmade Chicken Biscuits (Jizai Bing), traditional walnut pastries, Cantonese wedding cakes. With over 200 years of history, Chengzhu Lou is one of Guangzhou\u0027s oldest surviving legendary bakeries. Its signature \u0027Chicken Biscuits\u0027 are baked with a secret pork belly recipe, fermented bean curd, sesame seeds, and five-spice powder. Fragrant, crispy, chewy, and perfectly balancing savory and sweet, they retain the most authentic traditional flavors of old Guangzhou, making them a prized heritage souvenir in Haizhu District.", "name": "Cheung Chu Bakery (Chengzhu Lou)", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station (Exit D), then walk about 10 minutes."}, {"address": "No. 352 Xingang Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Premium Cantonese cured sausages, handmade egg rolls, authentic Cantonese sweetheart cakes (Lao Po Bing). As the specialty gift brand under the famous Cantonese establishment Guangzhou Restaurant, Likoufuk guarantees top quality for traditional souvenirs. Their cured meats are air-dried using traditional methods, featuring rich aromatic liquor accents and firm meat. The traditionally baked egg rolls and sweetheart cakes are also must-try items\u2014beautifully packaged, making them perfect gifts for family and friends.", "name": "Guangzhou Restaurant Likoufuk (Kecun Branch)", "transport": "Take Metro Line 3 or Line 8 to Kecun Station (Exit D), then walk about 3 minutes."}, {"address": "Inside TIT Creative Park, No. 397 Xingang Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Lingnan culture daily tear-off calendars, minimalist Guangzhou-themed mugs, original design portable wooden stationery boxes. Located inside TIT Creative Park near Canton Tower, this lifestyle concept store combines original design with artistic aesthetic. Championing the philosophy of \u0027Living Well,\u0027 it integrates local Guangzhou cultural elements into sleek minimalist designs, offering a variety of chic, hipster-style souvenirs and curated lifestyle goods.", "name": "Shude Life Store (TIT Creative Park Flagship Store)", "transport": "Take Metro Line 3 or Line 8 to Kecun Station (Exit A), then walk about 8 minutes."}, {"address": "No. 46 Jiangnanxi Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Pure lotus seed paste sweetheart cakes, Cantonese Sachima, traditional almond biscuits. The century-old Lin Heung House is renowned as the \u0027First House of Lotus Seed Paste\u0027. Located in the vibrant cultural and commercial area of Haizhu District, this store serves authentic Lingnan traditional pastries. The lotus paste filling is crafted from premium Xiangtan lotus seeds, offering a smooth, silky, subtle sweetness wrapped in a flaky crust\u2014a classic masterpiece of Guangzhou\u0027s traditional food culture.", "name": "Lin Heung House (Jiangnanxi Branch)", "transport": "Take Metro Line 2 to Jiangnanxi Station (Exit A), then walk about 5 minutes."}, {"address": "No. 354 Xingang Middle Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Premium 30/70 lean-to-fat Cantonese sausages, selected cured pork belly, five-spice cured duck legs. Crowned as the \u0027King of Cured Meats in Guangzhou\u0027, Huang Shang Huang produces essential traditional delicacies sought after during holidays and travel. The sausages are made from selected fresh pork, seasoned with high-grade Fenjiu liquor, and naturally air-dried. Steamed to perfection, they release an enticing savory-sweet aroma with rich flavors, making them an incredible ingredient for making authentic Cantonese claypot rice at home.", "name": "Huang Shang Huang (Kecun Branch)", "transport": "Take Metro Line 3 or Line 8 to Kecun Station (Exit D), then walk about 4 minutes."}, {"address": "1st Floor Lobby, Canton Tower, No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Canton Tower 3D pop-up postcards, limited-edition Canton Tower colorful souvenir stamp booklets, Lingnan architecture-shaped wooden keychains. Situated inside Canton Tower, this unique themed post office is a popular stop for souvenir collectors and stationery lovers. It offers exclusive Canton Tower stamps, commemorative envelopes, and beautifully designed hand-drawn postcards. Visitors can stamp their cards on-site with exclusive Canton Tower postmarks to mail warm wishes to loved ones or keep as personal memories.", "name": "Canton Tower Theme Post Office", "transport": "Take Metro Line 3 or the APM Line to Canton Tower Station, then walk about 2 minutes from the exit."}, {"address": "No. 158 Jiangnan Avenue North, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Handmade Century Egg Pastries, traditional fried rice cakes (Chao Mi Bing), crispy Cantonese wedding biscuits. Highly recommended by locals in Haizhu District, Zanki Bakery is an affordable traditional bakery that insists on baking fresh daily. Their signature Century Egg Pastry features a smooth, rich filling wrapped around a whole century egg, offering a delightfully complex texture. The traditional fried rice cakes boast rich roasted rice and nutty aromas without artificial flavorings, perfectly capturing the nostalgic local flavors of old Guangzhou life.", "name": "Zanki Bakery (Jiangnan Avenue Branch)", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station (Exit D), then walk about 6 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 311 Jiangnan Avenue Middle, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Past-season limited-edition Nike sneakers, Adidas sports jackets at 70% off, discounted Samsonite luggage. Guangzhou\u0027s oldest and most popular comprehensive outlet shopping center in Haizhu District. Spanning multiple floors, it gathers major international sportswear brands, outdoor gear, and affordable apparel discount stores. With year-round discounts as low as 50% to 80% off, it\u0027s the top choice for local Guangzhouers hunting for high-value clothing and shoes.", "name": "Wanguo Outlet", "transport": "Take Guangzhou Metro Line 2 to Jiangnanxi Station, Exit E, then walk for about 5 minutes."}, {"address": "No. 28 Shugang Road, Guicheng Street, Nanhai District, Foshan, Guangzhou (Near the border of Haizhu and Panyu Districts)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Classic Gucci leather jackets, Prada nylon backpacks, luxury Coach handbags. The most iconic Italian-style premium outlet shopping center located at the Guangzhou-Foshan border. Featuring circular fountains and open-air arcades, the ambiance is delightfully exotic. Home to over 200 international luxury and curated designer brands offering amazing discounts as low as 80% off, making it an absolute must-visit shopping paradise in Guangzhou.", "name": "Florentia Village Guangzhou Designer Outlet", "transport": "Take Guangfo Metro Line to Financial Hi-Tech Zone Station, then take a shuttle bus or taxi for about 15 minutes."}, {"address": "Inside TIT Creative Industry Zone, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy List: Minimalist bamboo aurora desk lamps, wooden notebooks featuring Guangzhou architectural motifs, handcrafted ceramic pour-over coffee cups. Located in the TIT Creative Industry Zone\u2014the artistic heart of Haizhu\u2014this local independent lifestyle design brand promotes a minimalist, original aesthetic centered around \u0027Living Well\u0027. The store showcases home goods, stationery, and textured lifestyle items crafted by local Guangzhou designers, making it a favorite spot for hipsters and tourists alike.", "name": "Shude Design \u0026 Life Store", "transport": "Take Guangzhou Metro Line 3 or Line 8 to Kecun Station, Exit A, then walk for about 8 minutes."}, {"address": "No. 352 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Must-Buy List: Dresses by local Guangzhou designers, Cantonese creative cold drink cups, Guangzhou-themed scented candles. A large local shopping plaza located at the heart of the iconic Canton Tower commercial district. It blends trendy shopping, independent local fashion boutiques, and traditional Cantonese dining. Compared to typical international chain malls, Lijing Plaza retains many local streetwear boutiques and unique lifestyle shops popular among young locals.", "name": "Lijing Plaza", "transport": "Take Guangzhou Metro Line 3 or Line 8 to Kecun Station, Exit C, which connects directly to the mall."}, {"address": "No. 222 Xingmin Road, Zhujiang New Town, Tianhe District, Guangzhou (Next to Liede Bridge, near Haizhu riverfront area)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Guangzhou-exclusive luxury perfumes, designer silk scarves, handmade French truffle chocolates. A high-end riverfront art shopping mall located across the river from Canton Tower. Its rooftop riverfront garden offers breathtaking close-up panoramic views of the tower. The mall features many debut luxury boutiques in South China alongside emerging local haute couture designer stores, providing a refined and sophisticated shopping atmosphere.", "name": "Tianhui Plaza igc", "transport": "Take Guangzhou Metro Line 5 to Liede Station, Exit B, which connects directly to the mall\u0027s underground concourse."}, {"address": "Creative Avenue, TIT Creative Industry Zone, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy List: Original BADMARKET canvas tote bags, Cantonese typography graphic t-shirts, vintage metal creative enamel pins. A famous local original lifestyle and general store originating in Guangzhou, seamlessly blending street subculture, original clothing, and quirky everyday gadgets. The store features avant-garde interior design, exuding the humorous attitude and local trend energy of Guangzhou\u0027s youth.", "name": "BADMARKET TIT Store", "transport": "Take Guangzhou Metro Line 3 or Line 8 to Kecun Station, Exit A, then walk for about 10 minutes."}, {"address": "1st Floor, Canton Tower, No. 222 Yuexi Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Must-Buy List: Slim Waist geometric metal bookmarks, Canton Tower limited-edition Lingnan embroidered tote bags, Cantonese fragrant tea gift sets. A sophisticated local cultural and creative retail space located on the ground floor of Canton Tower. It carefully curates original items that combine traditional Guangzhou crafts (such as Guangzhou porcelain and embroidery) with modern geometric design, making it the perfect spot to find stylish, modern Guangzhou landmark souvenirs.", "name": "Canton Tower Souvenir \u0026 Design Boutique", "transport": "Take Guangzhou Metro Line 3 or APM Line to Canton Tower Station, Exit A, for direct access."}, {"address": "No. 498 Guangzhou Avenue South, Haizhu District, Guangzhou", "feature": "\u2b50 4.2 Stars | Must-Buy List: Gift boxes of traditional Cantonese pastries from legacy brands, lipsticks from local independent beauty brands, Lingnan traditional handmade embroidered ornaments. A vibrant, community-centric department store mall in Haizhu District. It houses numerous South China local cosmetics chains, homegrown fashion outlets, and classic heritage brands, offering an authentic taste of local lifestyle and warm hospitality.", "name": "Hopson Plaza Haizhu", "transport": "Take Guangzhou Metro Line 8 to Lujiang Station, Exit A, then walk for about 12 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Canton Tower and Haizhu Riverside Arts and Culture District"}, "huadu_sunac": {"categories": {"cat_1": {"items": [{"address": "1st Floor, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Florasis Air Soft Loose Powder, Perfect Diary Animal Eyeshadow Palette, Carslan Big Eyes Mascara. A must-visit beauty selector store for makeup lovers in Sunac Mall, featuring a breathtaking giant beauty sponge wall and testing counters. Highlighting trendy Guochao (China-chic) cosmetics and affordable high-quality makeup, it brings together many local Guangdong and emerging Chinese beauty brands. It offers a stress-free self-service makeup testing experience, making it a favorite among young women and tourists.", "name": "THE COLORIST (Huadu Sunac Mall Store)", "transport": "Take the Guangzhou-Qingyuan Intercity Railway to \u0027Huachengjie Station\u0027, exit and walk for about 5 minutes to reach Sunac Mall."}, {"address": "1st Floor, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Judydoll Single Eyeshadow, ZEESEA Egypt Powder, Roopy Hand Cream. A massive yellow container-style lifestyle and beauty store. The bright interior with neatly organized products creates a visually stunning atmosphere. Beyond a rich array of Chinese trendy makeup and skincare products, it also features unique local beauty tools and travel kits, making it an unmissable one-stop shopping paradise at Huadu Sunac Mall.", "name": "KKV (Huadu Sunac Mall Store)", "transport": "Take the Guangzhou-Qingyuan Intercity Railway to \u0027Huachengjie Station\u0027, exit and walk to 1st Floor of Sunac Mall."}, {"address": "1st Floor, Junyi Tenbang Plaza, No. 81 Shuguang Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Flower Knows Unicorn Blush, JOOCYEE Watery Lip Gloss, COLORKEY Air Lip Lacquer. A super popular trendy beauty store originating in Guangzhou, located just a short drive from Sunac Resort. Designed specifically for the younger generation, the store\u0027s decor blends girlish charm with futuristic style. Bringing together hundreds of emerging beauty brands with comprehensive testing samples available, it is the top destination for purchasing the latest trendy domestic makeup.", "name": "WOW COLOUR (Huadu Junyi Tenbang Store)", "transport": "Take a taxi from Sunac Resort for about 10 minutes, or take Bus Huadu 19 to \u0027Junyi Tenbang Statio angzhou Dishipu Road Branch)", "transport": "Metro Line 1 Changshou Lu Station Exit A, approx. 6-min walk"}, {"address": "No. 58 Xiajiu Road, Shangxiajiu Pedestrian Street, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buys: Botanical Cleansing Balm, Personal Care Travel Kit, Specialty Plant Masks. Housed in a traditional Lingnan arcade building, this KKV fuses yellow modern container aesthetics with classic Xiguan charm. The vast beauty section spans skincare, makeup, fragrances, and personal care. Featuring generous sample testing areas and everything from premium Guangdong brands to imported bath products, it offers a remarkably comfortable shopping experience.", "name": "KKV (Guangzhou Shangxiajiu Qilou Experience Store)", "transport": "Metro Line 6 Cultural Park Station Exit E, approx. 8-min walk"}, {"address": "No. 80 Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buys: Animal Explorer 12-Color Eyeshadow Palette, Business Card Lip Stain, Bionic Film Essence Lipstick. Born in Guangzhou, Perfect Diary is a domestic makeup powerhouse that swept the nation. This concept store in Liwan uniquely incorporates Xiguan Manchu stained-glass windows and traditional floral tiles into its d\u00e9cor. With professional makeup artists offering live makeup trials on-site, its latest lip stains and high-textured eyeshadow palettes make chic beauty souvenirs you shouldn\u0027t miss when visiting Guangzhou.", "name": "Perfect Diary (Guangzhou Liwan Lingnan Concept Store)", "transport": "Metro Line 1 Changshou Lu Station Exit D2, approx. 4-min walk"}], "name": "Iconic Local Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "No. 128 Enning Road, Liwan District, Guangzhou (Inside Yongqingfang area)", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Xiangyun silk modified Cheongsam, Xiangyun silk handkerchiefs, Xiangyun silk embroidered shawls. Tucked away in the alleys of Xiguan Old Street, this shop specializes
