xit A, approx. 6 mins walk"}, {"address": "Shi\u0027erfu West Street, Phase 2 Yongqingfang, Enning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-rubbed leather briefcases, vintage patterned shirts, old Xiguan style leather key pouches. This is a large independent concept shop combining vintage displays with retro clothing and leather goods. Paved with classic Guangzhou green pattern tiles and old wooden furniture, the shop curates a selection of hand-crafted leather bags and vintage wear steeped in nostalgia. Shopping here feels like strolling through an old Xiguan museum from a bygone cinematic era.", "name": "Goodone Vintage \u0026 Leather Shop Yongqingfang", "transport": "Metro Line 1/6 Huangsha Station Exit B, approx. 7 mins walk"}, {"address": "In the alley beside No. 45 Shisanhang Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-stitched leather loafers, retro genuine leather saddle bags, vegetable-tanned minimalist business card holders. Located near the Shisanhang wholesale district and old Xiguan streets, this independent shoemaking studio carries on Guangdong\u0027s traditional leather crafting techniques. Using top-grain leather, it specializes in elegant shoes and refined bags designed for all-day comfort without rubbing feet. With solid craftsmanship and competitive pricing, it is highly favored by local professionals.", "name": "Shisannian Handmade Leather Shoes Studio", "transport": "Metro Line 6 Cultural Park Station Exit A, approx. 5 mins walk"}, {"address": "No. 133 Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: Manchurian stained-glass embroidered canvas tote bags, Xiguan Mansion wood-grain leather card holders, hand-painted Cantonese porcelain (Guangcai) pattern canvas bags. This original independent shop seamlessly transforms architectural symbols like Xiguan Mansion stained-glass Manchurian windows and traditional wooden sliding gates into everyday canvas bags and leather accessories. Featuring simple and lively designs rich in local Liwan charm, it is hugely popular among young travelers.", "name": "Xiguan Imprint Canvas Bags \u0026 Accessories", "transport": "Metro Line 1 Changshou Road Station Exit D1, approx. 4 mins walk"}, {"address": "No. 12 Yaohua Street, Fengyuan Road, Liwan District, Guangzhou (Inside Xiguan Mansion Preservation Area)", "feature": "\u2b50 4.8 stars | Must-Buy List: Double-sided Cantonese embroidered silk scarves, handmade Cantonese embroidered floral silk handbags, traditional Cantonese embroidered modified cheongsams with frog buttons. As one of China\u0027s Four Famous Embroideries, Cantonese embroidery (Guangxiu) comes alive here with local master embroiderers crafting in-store, infusing intangible heritage techniques into modern fashion and high-end handbags. Every stitch on each bag and accessory is crafted by hand, offering extraordinary detail and uniqueness\u2014making them collectible luxury local items.", "name": "Guangzhou Embroidery Fashion Experience Hall", "transport": "Metro Line 1 Changshou Road Station Exit B, approx. 10 mins walk"}, {"address": "No. 99 Enning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Bamboo-woven mixed leather vintage handbags, hand-woven hemp straw hats, cowhide crossbody bags with Xiguan copper art details. The store carefully selects bags created by local Guangdong artisans that combine bamboo weaving and leather craft, cleverly merging traditional water-town weaving techniques with modern leather craftsmanship. Bursting with vibrant Lingnan summer vibes and an arty aesthetic, these bags are lightweight, durable, and unique\u2014an insider recommendation from locals for high-quality accessories.", "name": "Lingnan Charm Handmade Leather \u0026 Woven Bags", "transport": "Metro Line 1/6 Huangsha Station Exit B, approx. 6 mins walk"}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "No. 67 DashiFu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Authentic Little Chicken Biscuits, Premium Lotus Seed Paste Sweet Wife Cakes, Xiguan Mang Gong Biscuits. Founded in 1889, this century-old brand is celebrated as the \u0027First House of Lotus Seed Paste\u0027. Their souvenirs are rich in classic Guangzhou flavors. In particular, the signature Chicken Biscuits offer a savory-sweet, crispy, and fragrant bite, while the Sweet Wife Cakes feature thin crusts with rich, smooth lotus paste\u2014an unmissable top pick when visiting Xiguan.", "name": "\u84ee\u9999\u6a13\u7e3d\u5e97 (Lian Xiang Lou Main Store)", "transport": "Take Metro Line 1 to Changshou Lu Station (Exit D2), walk about 8 minutes"}, {"address": "No. 20 DashiFu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 stars | Must-Buy List: Egg Yolk Golden Lotus Paste Pastry, Tao Tao Ju Niu Zai Biscuits, Traditional Cantonese Wedding Cakes. Founded during the Guangxu reign of the Qing Dynasty, this century-old Guangzhou culinary brand features a pastry and souvenir counter beloved by tourists. The bakery sticks to traditional craftsmanship; its Golden Lotus Paste Pastry uses premium Hunan lotus seeds for a dense, silky-sweet texture. Wrapped in elegant vintage Xiguan packaging, it makes a generous, culturally rich gift.", "name": "\u9676\u9676\u5c45\u9905\u5bb6 (Tao Tao Ju Bakery)", "transport": "Take Metro Line 1 to Changshou Lu Station (Exit D2), walk about 6 minutes"}, {"address": "No. 1-3 Xiajiu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: 30/70 Fat-to-Lean Cured Sausages, Gold Medal Cantonese Cured Pork Belly, Premium Cured Duck Legs. Known as the \u0027King of Cured Meats\u0027, this China Time-Honored Brand is a festive must-buy for locals. Their sausages are marinated with secret soy sauce and Rose Wine, then air-dried naturally for a rich, aromatic flavor. The vacuum-packed gift boxes are highly portable\u2014perfect for making authentic cured meat claypot rice at home.", "name": "\u7687\u4e0a\u7687\u81d8\u5473\u65d7\u8266\u5e97 (Huang Shang Huang Preserved Meat Flagship Store)", "transport": "Take Metro Line 1 or Line 6 to Huangsha Station (Exit B), walk about 10 minutes"}, {"address": "No. 139 Longjin West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade Almond Biscuits, Freshly Baked Walnut Crisps, Fermented Tofu Chicken Biscuits. A beloved neighborhood bakery among Xiguan locals, retaining traditional handcrafted Cantonese pastries. Their almond biscuits are wonderfully crumbly, packed with crunchy crushed almonds and savory candied pork, perfectly balanced in sweetness. Freshly baked with aroma filling the air and affordable prices, it\u0027s a great spot to experience daily Guangzhou pastry culture.", "name": "\u8d0a\u8a18\u50b3\u7d71\u9905\u5bb6 (Zan Ji Traditional Bakery)", "transport": "Take Metro Line 5 to Zhongshanba Station (Exit B), walk about 9 minutes"}, {"address": "No. 100 DashiFu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.2 stars | Must-Buy List: Crispy Phoenix Egg Rolls, Red Fermented Tofu Peanuts, Traditional Mung Bean Cakes. Founded in 1938, this famous historic pastry brand runs stores specializing in traditional Cantonese snacks and biscuits. The Phoenix Rolls are rich in egg flavor and ultra-crispy, filled with pork floss or sesame seeds, making them addictive. The red bean curd peanuts are infused with aromatic Cantonese fermented tofu, making a classic and irresistible snack.", "name": "\u8da3\u9999\u98df\u54c1 (Qu Xiang Food)", "transport": "Take Metro Line 1 to Changshou Lu Station (Exit D2), walk about 7 minutes"}, {"address": "No. 2 Wenchang South Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Likofook Chicken Biscuit Gift Box, Canton Tower Limited Edition Cookie Box, Cantonese Double Yolk White Lotus Paste Mooncakes. A food brand under the renowned Guangzhou Restaurant with a top-notch reputation. The shop offers exquisitely packaged Cantonese souvenir gifts that blend traditional pastries with modern creative designs. Their Guangzhou Landmarks souvenir series features beautiful packaging and strict quality control, ideal for elders or business gifts.", "name": "\u5229\u53e3\u798f - \u5ee3\u5dde\u9152\u5bb6\u624b\u4fe1\u5e97 (Likofook - Guangzhou Restaurant Souvenir Shop)", "transport": "Take Metro Line 1 to Changshou Lu Station (Exit A), walk about 8 minutes"}, {"address": "No. 209 Longjin Middle Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Century Egg Pastry, Xiguan Bowl Rice Cakes, Nourishing Sesame Cakes. A well-known traditional bakery in the Xiguan Old Town that makes fresh pastries daily. Their Century Egg Pastry features flaky outer layers and a unique, delicious filling of fragrant pickled ginger and minced century egg. Traditional treats like sesame cake and white sugar cake are moderately sweet, soft, and chewy\u2014a top choice for experiencing ancient Xiguan handmade pastries.", "name": "\u751f\u9686\u9905\u5bb6 (Sheng Long Bakery)", "transport": "Take Metro Line 1 to Chen Clan Academy Station (Exit C), walk about 10 minutes"}, {"address": "Inside Yongqing Fang, No. 99 En\u0027ning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-Buy List: Xiguan Mansion Blind Box Pastries, Premium Zengcheng Dried Lychees, Lingnan Lion Dance Themed Snack Gift Boxes. Located in the core historical district of Yongqing Fang, this store combines Lingnan intangible cultural heritage with trendy souvenirs. It highlights box designs incorporating Xiguan mansion architecture, Manchurian glass windows, and lion dance motifs. Offering curated Guangdong specialties like dried fruits and signature snacks, it is a trendy souvenir shop that is both stylish and delicious.", "name": "\u6c38\u6176\u574a\u8001\u5ee3\u5dde\u624b\u4fe1\u6587\u5275\u5e97 (Yongqing Fang Old Guangzhou Souvenir Store)", "transport": "Take Metro Line 1 or Line 6 to Huangsha Station (Exit B), walk about 7 minutes"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 28 Shugang Road, Guicheng Street, Nanhai District, Foshan City, Guangdong Province (Near the border of Liwan District, Guangzhou)", "feature": "\u2b50 4.6 stars | Must-Buy List: Coach classic signature handbags, Nike discounted running shoes, Armani business shirts. As an iconic Italian-style luxury discount shopping village in South China, although it sits right on the border of Liwan District, it remains the top choice for Xiguan residents and tourists looking for luxury outlet shopping. Designed in a charming Tuscan architectural style, the village gathers hundreds of world-renowned luxury and sportswear brands, offering year-round discounts as low as 80% off. It is immensely popular among bargain-hunting shopaholics.", "name": "Florentia Village Guangzhou Outlet", "transport": "Take the Guangfo Metro Line to \u0027Leigang Station\u0027 or \u0027Financial Hi-Tech Zone Station\u0027 and transfer to a shuttle bus, or drive approximately 20 minutes from Liwan District."}, {"address": "No. 8 Huangsha Avenue, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Guangzhou Restaurant souvenir gift boxes, Tao Tao Ju chicken biscuits, Cantonese porcelain-style graffiti canvas bags. Located directly above Huangsha Metro Station in Liwan, this is a highly popular large modern shopping center in the historic Xiguan old town. The mall brings together numerous traditional Cantonese heritage brand gift counters and trendy fashion labels. Local Guangzhou residents love coming here to pick up holiday gifts and daily lifestyle goods, creating a seamless blend of traditional Xiguan culture and modern commercial convenience.", "name": "Link Plaza Guangzhou", "transport": "Take Guangzhou Metro Line 1 or Line 6 to \u0027Huangsha Station\u0027 and exit directly into the mall."}, {"address": "No. 40 Xiajiu Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Lian Xiang Lou sweetheart cakes, miniature Xiguan Mansion models, traditional Guangzhou embroidered shoes. A local traditional department store carrying decades of nostalgic memories for Guangzhou locals, deeply rooted in the heart of Shangxiajiu Pedestrian Street. It features dedicated sections for Guangdong specialties and Lingnan handicrafts, making it the ultimate one-stop shop for traditional heritage foods and authentic Xiguan artisan crafts.", "name": "Sun Da Sun Department Store - Shangxiajiu", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027, Exit D2, and walk about 8 minutes."}, {"address": "No. 150 Xiwan Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Local Guangzhou independent designer dresses, Nayuki Tea Guangzhou-exclusive merchandise, trendy domestic beauty gift sets. A flagship-sized mega-mall located in northern Liwan District, featuring an expansive outlet discount area and curated stores for local Cantonese streetwear brands. With its vast open layout, the mall houses many South China debut stores and local lifestyle boutique shops, serving as a landmark masterpiece of the old city\u0027s transformation into a trendy consumer hub.", "name": "Yue City Mall", "transport": "Take Guangzhou Metro Line 5 to \u0027Xicun Station\u0027, then transfer to a bus or walk about 12 minutes."}, {"address": "Inside Phase 1, Yongqingfang, En\u0027ning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Colorful Xiguan Manchurian window postcards, \u0027Write to the Future\u0027 notebooks, hand-drawn Guangzhou landmark mugs. Located in the heart of the Yongqingfang historic area, this cultural and creative lifestyle store combines books, original goods, and unique postcards. The shop incorporates Xiguan architectural motifs into various exclusive products, allowing visitors to pick up elegant lifestyle items featuring Qilou (arcade house) and Manchurian window patterns while enjoying a relaxed, slow-paced atmosphere.", "name": "Momicafe - Yongqingfang", "transport": "Take Guangzhou Metro Line 1 or Line 6 to \u0027Huangsha Station\u0027, Exit B, and walk about 7 minutes."}, {"address": "No. 227 En\u0027ning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Manchurian window style acrylic tumbler, Xiguan cobblestone retro stamp set, Lingnan Cantonese catchphrase metallic stickers. This uniquely charming local cultural design shop is nestled on a historic Xiguan street, dedicated to showcasing traditional Guangzhou heritage. The store offers a wide array of exclusively designed Xiguan-style lifestyle items and stationery. Many hipsters and tourists visit specifically to collect commemorative stamps and buy authentic Lingnan-style souvenirs.", "name": "Time Post Office \u0026 Xiguan Cultural Center", "transport": "Take Guangzhou Metro Line 6 to \u0027Ruyifang Station\u0027, Exit B, and walk about 9 minutes."}, {"address": "No. 95 Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Xiangyun silk scarves, Lingnan lion dance hand-embroidered bags, Lingnan lychee scented candles. Located next to Yongqingfang, this independent original craft and aesthetic boutique specializes in Xiangyun Silk\u2014a national intangible cultural heritage\u2014as well as Lingnan folk art creative products. Seamlessly blending modern elegance with deep tradition, it is an ideal place to find high-quality handcrafted accessories and refined home goods.", "name": "Lingnan Craft Workshop - Xiangyun Silk", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027, Exit E, and walk about 10 minutes."}, {"address": "No. 2 Wenchang South Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Cantonese egg yolk lotus seed paste mooncakes, authentic Xiguan chicken biscuits, cured meat combo gift boxes. As the flagship souvenir outlet for Guangzhou Restaurant\u2014the iconic culinary benchmark famous for the phrase \u0027Eating in Guangzhou\u0027\u2014this shop is deeply rooted in the old city of Liwan. Offering authentic, beautifully packaged Cantonese pastries and traditional cured meats, it is the premier choice for local Guangzhou residents buying heritage specialties during festive seasons.", "name": "Guangzhou Restaurant Souvenir Store", "transport": "Take Guangzhou Metro Line 1 to \u0027Changshou Road Station\u0027, Exit A, and walk about 6 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Liwan Xiguan Cultural District and Yongqing Fang"}, "zhujiang_tianhe": {"categories": {"cat_1": {"items": [{"address": "Shop L115b, L1 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-Buy List: Beauty brand sample gift boxes, light-reflecting setting powder, niche designer perfume samples. Inspired by cosmic black holes, this multi-brand beauty store blends modern art with futuristic technology, creating an iconic high-end beauty retail space in Guangzhou\u0027s Tianhe CBD. Beyond top international luxury brands, it strongly promotes emerging Chinese original cosmetics and high-end C-beauty fragrances. Renowned for its stress-free, open sampling experience, it\u0027s the top spot for young shoppers hunting for travel samples and trendy makeup.", "name": "HAYDON (HAYDON Parc Central)", "transport": "Take Guangzhou Metro Line 1 or Line 3 to \u0027Tiyu Xilu Station\u0027 Exit C, and walk for about 5 minutes through the underground concourse."}, {"address": "Shop 2A011, 2nd Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: Florasis Loose Powder, Perfect Diary Animal Eye Shadow Palette, JudyDoll Single Blush. Originating in Guangdong, this famous beauty retail giant is renowned for its visually stunning makeup sponge wall and gradient color display zones. The Grandview Mall flagship features a massive shopping space showcasing hundreds of trending domestic and international beauty brands\u2014with C-beauty making up over half. Offering free trial samples storewide, it\u0027s a must-visit sanctuary to experience China\u0027s latest beauty trends.", "name": "THE COLORIST (THE COLORIST Grandview Mall)", "transport": "Take Guangzhou Metro Line 1 to \u0027Tiyu Center Station\u0027 Exit D2, and walk for about 3 minutes."}, {"address": "Shop B118, B1 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.8 stars | Must-Buy List: HARMAY signature hydrating cleansing balm, exclusive brand fragrance sets, luxury skincare travel minis. HARMAY took the country by storm with its unique warehouse-industrial aesthetic. This flagship space at Parc Central seamlessly integrates structural steel logistics with sleek beauty displays. Its biggest highlight is selling a vast array of high-end skincare, makeup, and niche fragrances in mini travel sizes, allowing customers to try top-tier products at affordable prices. It\u0027s also a wildly popular trendy photo spot.", "name": "HARMAY (HARMAY Parc Central)", "transport": "Take Guangzhou Metro Line 1 or Line 3 to \u0027Tiyu Xilu Station\u0027 Exit C, and walk for about 5 minutes."}, {"address": "Shop B1-013, B1 Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 stars | Must-Buy List: Joocyee Lip Glaze, Flower Knows Swan Lake Blush, VNK Liquid Eyeshadow. Headquartered in Guangzhou, this leading new-retail beauty shop offers a dreamy cosmetic haven crafted for young women. WOW COLOUR focuses on premium emerging C-beauty brands, stocking almost every viral product trending online. Equipped with extra-long makeup vanity tables and professional vanity lighting, it attracts countless beauty influencers to test and shop.", "name": "WOW COLOUR (WOW COLOUR Grandview Mall)", "transport": "Take Guangzhou Metro Line 1 to \u0027Tiyu Center Station\u0027 Exit D2, and walk straight into the underground mall."}, {"address": "Shop 1G002, 1st Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 stars | Must-Buy List: Novelty makeup sponge sets, herbal plant extract sheet masks, ultra-fine brow pencils (Shu Uemura dupes). This massive bright yellow-themed lifestyle flagship store is an immensely popular beauty and living hub in Lingnan. Featuring an impressive giant sheet-mask wall and shipping-container makeup displays, its vast beauty and drugstore section offers affordable, high-quality local cosmetics, personal care goods, daily health items, and healthy snacks for a delightful shopping experience.", "name": "KKV (KKV Grandview Mall Flagship)", "transport": "Take Guangzhou Metro Line 1 to \u0027Tiyu Center Station\u0027 Exit D2, and walk for about 3 minutes."}, {"address": "1st Floor, Commercial Podium, Kingold Century Financial Center, No. 62 Jinsui Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 stars | Must-Buy List: Cai Zhi Lin special Chinese herbal pearl powder, Cantonese herbal anti-acne repair cream, Lingnan plant moisturizing body oil. Cai Zhi Lin is a century-old traditional Lingnan Chinese medicine brand in Guangzhou with a modern pharmacy branch in Zhujiang New Town. Beyond traditional herbal remedies, its in-house developed herbal skincare and repair cosmetics are deeply trusted by locals. Natural and additive-free, these TCM skincare products and cosmetic pearl powders are ideal choices for visitors to experience traditional Lingnan beauty wisdom.", "name": "Cai Zhi Lin Pharmacy (Zhujiang New Town)", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027 Exit A1, and walk for about 6 minutes."}, {"address": "Shop M48, M Floor, Taikoo Hui, No. 383 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 stars | Must-Buy List: MAOGEPING Light \u0026 Shadow Sculpting Cream, Sephora C-Beauty co-branded gift sets, Marie Dalgar Color Party Eyeshadow Palette. Located in the upscale Taikoo Hui shopping precinct, this Sephora concept store seamlessly blends top international luxury beauty with exclusive premium domestic C-beauty brands. Here you can shop master makeup artist Mao Geping\u0027s exclusive luxury Chinese-style cosmetics line while enjoying one-on-one professional makeup consultations\u2014a ultimate destination for discerning beauty lovers.", "name": "SEPHORA (Taikoo Hui Flagship)", "transport": "Take Guangzhou Metro Line 3 to \u0027Shipaiqiao Station\u0027 BRT exit, which directly connects to Taikoo Hui via the underground concourse."}, {"address": "Shop B221, B2 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 stars | Must-Buy List: Bird\u0027s Nest Whitening Sheet Masks, Collagen Nourishing Hand Cream, Watsons Ultra-Fine Smudge-Proof Eyeliner. Situated in Parc Central, this high-spec Colorlab concept store completely modernizes the traditional drugstore experience. It dramatically expands its cosmetics and skincare zones with trending Japanese, Korean, and Chinese drugstores products, features AI skin analysis and virtual try-on devices, and offers excellent localized customer service.", "name": "Watsons Colorlab (Parc Central)", "transport": "Take Guangzhou Metro Line 1 or Line 3 to \u0027Tiyu Xilu Station\u0027 Exit C, and walk for about 5 minutes."}], "name": "Local Representative Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "1st-2nd Floor, Grandview Plaza, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-buy List: \u0027Minimalist Tailored Urban Dress\u0027, \u0027Retro Leather Underarm Bag\u0027, \u0027Chanel-style Woven Short Jacket\u0027. As a local fast-fashion giant born in Guangzhou, UR\u0027s flagship store in Grandview Mall in Tianhe CBD is massive. Renowned for its rapid new arrivals and silhouettes tailored for Asian body types, it is immensely popular among Guangzhou\u0027s local trendy youth. Offering great quality at affordable prices, it is the go-to spot for hunting trendy fashion items.", "name": "URBAN REVIVO (UR Fast Fashion Flagship Store)", "transport": "Walk about 3 minutes from Exit D2 of Tiyu Center Station on Metro Line 1"}, {"address": "B1 Floor, K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 Stars | Must-buy List: \u0027BM Original Logo Canvas Tote\u0027, \u0027Street Graffiti Printed Tee\u0027, \u0027Retro Metallic Statement Accessories\u0027. Originating in Guangzhou, BADMARKET is an iconic local original select store in South China. The K11 branch in Tianhe combines industrial-style design with lifestyle aesthetics, selling apparel, lifestyle goods, and original shoes and bags from local independent Guangzhou designers, showcasing a bold Guangzhou youth subculture and stylish attitude.", "name": "BADMARKET (Trendy Select Shop)", "transport": "Walk about 2 minutes from Exit B of Huacheng Dadao Station on Metro APM Line"}, {"address": "B1 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-buy List: \u0027Cool Cut Leather Jacket\u0027, \u0027American Vintage Rock Tee\u0027, \u0027High-Waist Silhouette Straight Jeans\u0027. MO\u0026Co. is the flagship womenswear brand under EPO, a famous local fashion group headquartered in Guangzhou. The Parc Central store features an avant-garde design. The brand specializes in a modern, cool, gender-neutral style infused with rock elements. Its high-quality fabrics and sharp tailoring are highly praised by Tianhe CBD white-collars and fashionistas.", "name": "MO\u0026Co. (Parc Central Store)", "transport": "Direct access from Exit A of Tianhenan Station on Metro APM Line"}, {"address": "L2 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.8 Stars | Must-buy List: \u0027Medium Basket Underarm Bag\u0027, \u0027Ear-Loop Tote\u0027, \u0027Cloud Leather Shoulder Bag\u0027. Songmont is a premier local original leather goods brand that has taken China by storm in recent years. The Parc Central store offers a tactile shopping experience. Emphasizing Oriental practical aesthetics and top-grain cowhide leather, its bag designs balance tactile warmth with crisp modern lines. Highly durable and recognizable, it is a must-visit leather shop for tourists in Tianhe.", "name": "Songmont (Songmont Parc Central Store)", "transport": "Direct access from Exit A of Tianhenan Station on Metro APM Line"}, {"address": "L2 Floor, Taikoo Hui, No. 383 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-buy List: \u0027Heavyweight Silk Wide-Leg Pants\u0027, \u0027Wool-Blend Tailored Blazer\u0027, \u0027Minimalist Silk Shirt\u0027. Also hailing from a top Guangzhou-based luxury womenswear group, Edition champions the \u0027Gentlewoman\u0027 independent female aesthetic. The Taikoo Hui boutique offers top-tier shopping service. Using premium natural silk, cashmere, and high-end fabrics, it seamlessly fuses freehand Oriental aesthetics with sleek Western tailoring, making it the top choice for women in the Tianhe business district seeking high-quality workwear and casual attire.", "name": "Edition (Taikoo Hui Guangzhou Store)", "transport": "Direct access to Taikoo Hui basement from Shipaiqiao Station BRT Exit on Metro Line 3"}, {"address": "1st Floor, Teemall, No. 208 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 Stars | Must-buy List: \u0027Classic Accordion Tote\u0027, \u0027Genuine Leather Cat Series Handbag\u0027, \u0027Soft Lambskin Pointed Flat Shoes\u0027. DISSONA is a premium Chinese original designer shoes and bags brand, and its Teemall store showcases artisan-level leather craft. Known for elegant and chic designs alongside premium leather craftsmanship, it integrates Italian luxury-level stitching techniques into modern handbags and comfortable leather shoes, making it ideal for urban women who seek refined quality.", "name": "DISSONA (DISSONA Teemall Store)", "transport": "Direct access from Exit C of Tiyu Xilu Station on Metro Line 1 or 3"}, {"address": "L2 Floor, K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 Stars | Must-buy List: \u0027Natural Undyed Cashmere Knitwear\u0027, \u0027Undyed Natural Silk Maxi Dress\u0027, \u0027Handmade Double-Faced Wool Coat\u0027. ICICLE is a renowned Chinese sustainable luxury brand, with its K11 art concept store feeling like a gallery. The brand insists on using natural, un-dyed cashmere, linen, and silk without chemical processing. Featuring loose, elegant, and comfortable cuts, as well as naturally beautiful shoes, bags, and accessories, it is favored by consumers who value quality and eco-friendly fashion.", "name": "ICICLE (ICICLE Guangzhou K11 Store)", "transport": "Walk about 2 minutes from Exit B of Huacheng Dadao Station on Metro APM Line"}, {"address": "M Floor, Taikoo Hui, No. 383 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-buy List: \u0027Barely Zero Wireless Bra\u0027, \u0027Soft Modal Loungewear\u0027, \u0027Cloud Lambskin Ballet Flats\u0027. NEIWAI is a Chinese original lifestyle apparel brand focused on combining comfort with aesthetics. The Taikoo Hui store features a warm and soft interior design. Beyond its highly acclaimed wireless comfortable innerwear and skin-friendly loungewear, its soft lambskin flats and minimalist canvas totes are hugely popular among locals for their exceptional comfort and elegant design.", "name": "NEIWAI (NEIWAI Guangzhou Taikoo Hui Store)", "transport": "Direct access to Taikoo Hui basement from Shipaiqiao Station BRT Exit on Metro Line 3"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B1 Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 Stars | Must-Buy: Cantonese Cured Sausages, Little Chicken Biscuits (Jizai Bing), Egg Yolk Lotus Seed Paste Pastries. As a famous souvenir brand under the century-old Cantonese brand \u0027Guangzhou Restaurant\u0027, Likoufuku is the top choice for tourists looking for traditional Cantonese pastries and cured meats. Their Cantonese cured sausages have a perfect lean-to-fat ratio, rich wine aroma, and a balanced sweet-and-savory flavor\u2014steaming them with rice offers an authentic Cantonese taste. The Little Chicken Biscuits blend garlic and red fermented bean curd flavors, offering a crispy and savory crunch that perfectly represents Guangzhou\u0027s food culture.", "name": "Guangzhou Restaurant \u00b7 Likoufuku (Grandview Mall)", "transport": "Take Metro Line 1 to Tiyu Center Station (Exit D3) and enter B1 floor of Grandview Mall."}, {"address": "Next to AEON Supermarket, B1 Floor, TEE Mall, No. 208 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy: Traditional Sweetheart Cake (Wife Cake), Little Chicken Biscuits, Lotus Paste Wedding Cakes. Known as the \u0027House of Lotus Paste\u0027, the century-old Lian Xiang Lou has a dedicated counter in TEE Mall. Their signature lotus paste made from premium Hunan lotus seeds is delicately sweet and never cloying. The classic Sweetheart Cake features flaky, layered pastry with a soft, sweet filling\u2014a quintessentially ancient Cantonese delicacy. Their exquisite gift packaging retains a strong nostalgic Xiguan vibe, making it perfect for gifting friends and family.", "name": "Lian Xiang Lou (TEE Mall)", "transport": "Take Metro Line 1 or Line 3 to Tiyu West Road Station (Exit C), which directly connects to B1 floor of TEE Mall."}, {"address": "South Zone, Mall of the World, No. 89 Huacheng Avenue, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | Must-Buy: Tao Tao Ju Little Chicken Biscuits, Handmade Almond Cookies, Phoenix Lava Cakes. Tao Tao Ju is a legendary representative of Guangzhou\u0027s teahouse culture, and its bakery souvenir counter is equally popular. Their handmade almond cookies deliver a rich nutty flavor with a firm, crispy texture. The Little Chicken Biscuits are baked according to traditional recipes with pork strips and secret sauces, yielding an addictive flavor. The grand Lingnan-style gift boxes make them a highly popular, high-end gift choice in the CBD.", "name": "Tao Tao Ju Bakery (Mall of the World)", "transport": "Take Metro Line 3 or Line 5 to Zhujiang New Town Station (Exit A1) and walk to the South Zone of Mall of the World."}, {"address": "Opposite McDonald\u0027s, B1 Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.8 Stars | Must-Buy: 30% Lean Cantonese Cured Sausage, Gourmet Cured Pork, Cured Meat Souvenir Gift Boxes. Considered the #1 cured meat brand by Guangzhou locals, Huang Shang Huang has a flagship counter in Grandview Mall. Their famous sausages use premium pork hind leg meat, cured and roasted using traditional methods, featuring a sweet-savory balance and snappy natural casing. Visitors love the gift sets, which encapsulate authentic old Guangzhou flavors while being easy to carry and store.", "name": "Huang Shang Huang (Grandview Mall)", "transport": "Take Metro Line 1 to Tiyu Center Station (Exit D3) and walk for about 3 minutes."}, {"address": "No. 15 Shipai East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 Stars | Must-Buy: Freshly Baked Century Egg Pastry, Traditional Little Chicken Biscuits, Walnut Cookies. Zan Ji Bakery is an exceptionally popular independent local classic bakery in Guangzhou that maintains the friendly charm and authentic ingredients of a traditional neighborhood pastry shop. Their signature Century Egg Pastry features a flaky outer crust wrapped around a whole quality century egg and sweet red bean paste\u2014creating an amazingly delicious sweet-and-savory contrast. Affordable and freshly baked, it\u0027s a hidden gem for souvenir shopping with genuine local flair.", "name": "Zan Ji Bakery (Shipai East)", "transport": "Take Metro Line 3 to Gangding Station (Exit D) and walk along Shipai East Road for about 5 minutes."}, {"address": "B1-021, B1 Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 Stars | Must-Buy: Seaweed Pork Floss Little Shell Cake, Lemon Yogurt Little Shell Cake, Cod Fish Floss Little Shell Cake. As a nation-wide viral hit bakery, the Master Bao branch in Tianhe CBD always draws long queues of buyers. The signature Seaweed Pork Floss Little Shell Cake is coated in crispy seaweed and savory pork floss, enveloping a super soft sponge cake filled with rich mayonnaise. Each bite offers rich layers of flavor, making it a trendy must-buy treat for young travelers visiting Guangzhou.", "name": "Master Bao Pastry (Grandview Plaza)", "transport": "Take Metro Line 1 to Tiyu Center Station (Exit D3) and enter B1 floor of Grandview Mall."}, {"address": "B2 Floor, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 Stars | Must-Buy: Handmade Cantonese Egg Tarts, Pineapple Bun with Butter Gift Box, Hong Kong-style Silky Milk Tea Packs. Full of nostalgic Cantonese and Hong Kong charm, Kowloon Cafe has set up a special souvenir area at its Parc Central branch. The handmade egg tarts feature puff-pastry crusts and rich, smooth egg custard, while the milk tea packs recreate the authentic bold tea aroma and silky texture of traditional Cha Chaan Tengs, allowing tourists to bring home genuine afternoon tea flavors.", "name": "Kowloon Cafe Souvenirs (Parc Central)", "transport": "Take Metro Line 1 or Line 3 to Tiyu West Road Station (Exit C), and access Parc Central directly via the underground passage."}, {"address": "B1 Floor, Central Zone, Mall of the World, No. 89 Huacheng Avenue, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | Must-Buy: Cantonese Water Chestnut Cake Gift Box, Guangzhou Double-Skin Milk DIY Instant Mix, Pantang Water Chestnut Flour. Freshippo at Mall of the World features a dedicated zone for local Guangzhou traditional brands and regional produce. Here, you can stock up on Pantang water chestnut flour, instant double-skin milk, and dried Lingnan fruits all at once. The instant double-skin milk mix is highly recommended for its authentic flavor and portable convenience, making it the ultimate one-stop shop for traditional Guangzhou snacks and dessert souvenirs.", "name": "Freshippo - Guangzhou Specialty Zone (Mall of the World)", "transport": "Take APM Line to Huacheng Avenue Station (Exit A), which directly connects to the Central Zone of Mall of the World."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Floors 1-4, Guangzhou International Finance Center, No. 5 Zhujiang West Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Lingnan silk scarves, Cantonese polychrome porcelain tea sets, Guangzhou Restaurant New Year gift boxes. As Guangzhou\u0027s most historically iconic classic luxury department store, Friendship Store holds deep nostalgic sentiment for locals. The IFC branch in Zhujiang New Town seamlessly blends heritage brands with a modern, luxurious shopping environment. Featuring dedicated sections for Lingnan local specialties and fine handicrafts, it is the top choice for tourists to buy premium local souvenirs and experience traditional Guangzhou\u0027s refined lifestyle.", "name": "\u5ee3\u5dde\u53cb\u8abc\u5546\u5e97 IFC\u570b\u91d1\u5e97 (Guangzhou Friendship Store - IFC Branch)", "transport": "Metro Line 3/5 Zhujiang New Town Station, Exit A1, approx. 3-min walk"}, {"address": "No. 6 Zhujiang East Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: BANXIAOXUE original designer clothing, Yanjiyou creative stationery/trinkets, limited-edition art scented candles. An iconic landmark combining contemporary art with luxury shopping, home to many Chinese independent designer brands and trendy concept stores. Most notable is local high-end designer brand \u0027BANXIAOXUE\u0027, whose Zen-inspired and deconstructivist apparel is hugely popular among fashion lovers. The mall frequently collaborates with contemporary artists on limited-edition merchandise, allowing shoppers to enjoy world-class art exhibitions alongside their shopping.", "name": "\u5ee3\u5ddeK11\u8cfc\u7269\u85dd\u8853\u4e2d\u5fc3 (K11 Art Mall Guangzhou)", "transport": "Direct access from Metro APM Line Huacheng Avenue Station Exit B; or Metro Line 3/5 Zhujiang New Town Station Exit B1"}, {"address": "Floors 1-7, Teemall, No. 208 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Huang Shang Huang cured meat gift boxes, Taotaoju handmade pastries, Chicks thermal underwear. Teemall Department Store is the signature flagship department store of Teemall, a pioneer in Guangzhou\u0027s Tianhe commercial district. Operating for decades, it offers a rich taste of authentic local Guangzhou life. Clearly organized across multiple floors, it features dedicated sections for heritage souvenirs and classic Hong Kong brands like \u0027Chicks\u0027, beloved by local families and tourists alike. It\u0027s the best spot to buy authentic Cantonese cured meats and traditional pastries at reasonable prices while soaking in classic department store charm.", "name": "\u5929\u6cb3\u57ce\u767e\u8ca8 (Teemall Department Store)", "transport": "Direct access from Metro Line 1/3 Tiyu Xilu Station Exit C"}, {"address": "1st Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Co-branded oversized blazers, retro French dresses, textured leather shoulder bags. URBAN REVIVO (UR) is a leading Chinese fast-fashion brand born in Guangzhou that has taken the global fashion world by storm. Its flagship store at Grandview Mall is massive, featuring futuristic architectural design. With rapid inventory turnarounds and cuts tailored for Asian silhouettes, it offers everything from everyday workwear to edgy party outfits at great value\u2014a must-visit fashion landmark in Guangzhou\u0027s Tianhe CBD.", "name": "URBAN REVIVO \u6b63\u4f73\u5ee3\u5834\u65d7\u8266\u5e97 (URBAN REVIVO Grandview Mall Flagship)", "transport": "Metro Line 1 Tianhe Sports Center Station Exit D2, approx. 5-min walk"}, {"address": "4th Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Guangzhou handmade ceramics, independent designer earrings, curated niche herbal teas. Located inside Grandview Mall, Hi Department Store is Guangzhou\u0027s first home-grown boutique department store, focusing on curating original works from global and local designers. Designed with a warm, cozy wooden aesthetic, it gathers local handcrafted ceramics, indie jewelry, signature fragrances, and curated books. It is the perfect boutique for finding unique creative gifts and expressing refined taste.", "name": "Hi\u767e\u8ca8 (Hi Department Store Guangzhou)", "transport": "Metro Line 1 Tianhe Sports Center Station Exit D2, approx. 5-min walk"}, {"address": "No. 28 Shugang Road, Guicheng Street, Nanhai District, Foshan, Guangdong Province (Transfer shuttle available from Guangzhou Metro Guangfo Line/Line 2)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Discounted Coach leather bags, Nike sneakers on sale, Armani outlet suits. As South China\u0027s premier Italian-themed luxury designer outlet, it is situated on the border of Guangzhou and Foshan but easily accessible via Metro or direct shuttle buses from Tianhe CBD. Recreating Italian Renaissance plazas and porticos, it hosts hundreds of international luxury brands and major domestic labels with year-round discounts starting at up to 70% off. Whether you are hunting for international luxury or value sportswear, this is a must-visit destination for shopaholics.", "name": "\u4f5b\u7f85\u502b\u85a9\u5c0f\u93ae\u5ee3\u5dde\u5967\u7279\u840a\u65af (Florentia Village Guangzhou Luxury Designer Outlet)", "transport": "Take Metro Line 2 to Guangzhou South Railway Station and transfer to the direct shuttle line, or take Guangfo Line to Financial Hi-Tech Zone Station and transfer to the shuttle bus"}, {"address": "1st Floor, Grandview Mall, No. 228 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Florasis loose powder, Flower Knows cat eyeshadow palettes, To Summer oriental fragrances. HAYDON is a trendy, avant-garde beauty concept store that has taken China by storm. The Tianhe branch is inspired by spacecraft cabins and black hole gravity, featuring visually stunning futuristic interiors. Housing over a hundred trending C-beauty brands and international luxury travel sizes, tourists can easily shop for viral Chinese beauty products like Florasis and Flower Knows in one go, enjoying great trial experiences and fantastic photo ops.", "name": "HAYDON\u9ed1\u6d1e\u7f8e\u599d\u6982\u5ff5\u5e97 \u5ee3\u5dde\u5929\u6cb3\u5e97 (HAYDON Beauty Concept Store Guangzhou)", "transport": "Metro Line 1 Tianhe Sports Center Station Exit D2, approx. 5-min walk"}, {"address": "No. 383 Tianhe Road, Tianhe District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Fangsuo Commune limited tote bags, Lingnan cultural journals, niche luxury perfumes. Taikoo Hui Guangzhou stands as the benchmark for ultra-luxury shopping malls in Tianhe CBD. Beyond housing top global luxury fashion houses, it also incubates \u0027Fangsuo Commune\u0027, South China\u0027s most renowned cultural concept bookstore space. Seamlessly blending high-end fashion shopping with local cultural aesthetics, visiting Taikoo Hui allows shoppers to enjoy world-class luxury service while discovering exclusive designer goods and gifts rich in Lingnan culture at Fangsuo.", "name": "\u5ee3\u5dde\u592a\u53e4\u6ed9 (Taikoo Hui Guangzhou)", "transport": "Direct access from Metro Line 3 Shipaiqiao Station BRT Exit"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Zhujiang New Town and Tianhe CBD Business District"}};
        const cityName = "Guangzhou";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">
