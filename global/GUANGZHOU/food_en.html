mooth, rich texture filled with nutty aromas. For brunch, the top pick is the \u0027Pan-seared Black Pepper Beef Toast,\u0027 featuring tender, juicy beef paired with chewy sourdough and house-made basil pesto\u2014delivering vibrant, distinct layers of flavor that draw crowds of trendsetters.", "name": "NOA DECK Coffee \u0026 Brunch", "transport": "Take Metro Line 8 to Baogang Avenue Station (Exit D), then walk for about 10 minutes."}, {"address": "No. 1 Huaxing Avenue, Shuangta Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | A benchmark for Aussie-style specialty brunch and in-house roasted coffee in Guangzhou. Highly praised for its \u0027Single Origin Pour-over Coffee,\u0027 brewed with precise temperature control to highlight inherent bean flavors. The must-order brunch dish is the \u0027Smoked Salmon \u0026 Avocado Tower\u0027\u2014stunningly presented with ultra-fresh ingredients, combining the rich savory notes of smoked salmon with creamy avocado for an unforgettable taste experience.", "name": "Over Easy by Blend", "transport": "Take Metro Line 3 to Canton Tower Station (Exit B), then walk for about 7 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Floors 103-103A, Canton Tower, No. 222 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 stars | Perched on the 103rd floor of the Canton Tower, this top-tier Cantonese restaurant boasts unmatched panoramic views of the Pearl River and the Zhujiang New Town skyline. The restaurant seamlessly blends traditional Cantonese cuisine with modern fine dining. The signature Black Truffle Crispy Roast Goose features golden, crackling skin that bursts with savory fat and aromatic truffle flavors upon first bite, accompanied by tender, juicy meat. The Traditional Lobster Crispy Rice Soup pours rich seafood broth over crispy rice grains, creating a multi-layered delicacy with a contrast of soft and crunchy textures. It attracts countless business diners and tourists looking for a romantic, ceremonial dining experience.", "name": "Hui Yue Xuan Cantonese Restaurant at Canton Tower", "transport": "Take Metro Line 3 or APM Line to Canton Tower Station, Exit B for direct access"}, {"address": "Area A, Party Pier Beer Culture \u0026 Art Zone, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | Located at the heart of Party Pier Beer Culture \u0026 Art Zone, this Bavarian-style German brewpub offers freshly brewed classic German dark and lager beers. The signature German Roasted Pork Knuckle boasts an ultra-crispy skin that crackles with every bite, while the meat inside is rich, succulent, and gelatinous, paired with sauerkraut and special mustard sauce to perfectly balance the richness. With passionate live performances by international bands, guests can sit on the outdoor terrace, sipping fresh malt-infused brew while admiring the dazzling, changing lights of Canton Tower. It is a favorite nightlife spot for expats and local youth.", "name": "Paulaner Br\u00e4uhaus Guangzhou", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 3 minutes"}, {"address": "B01/B02, Area B, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | Facing the iconic Canton Tower and the Pearl River night view, this ultra-popular open-air trendy bistro blends Latin-inspired cuisine with craft cocktails. Highly recommended are the signature Charcoal-Grilled Spanish Beef Skewers and Garlic Butter Shrimp; high-heat charcoal sears in the juicy flavor of the beef, imparting a charming smoky aroma and satisfying chew. Pair it with a sweet signature cocktail crafted with Lingnan specialty lychee for a refreshingly smooth drink. As night falls, neon lights intertwine with river reflections to create an extraordinarily romantic, cozy vibe, making it an ideal spot for romantic dates and social media photos.", "name": "JOJO\u0027S Riverside Bar \u0026 Restaurant", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 2 minutes"}, {"address": "A11-A12, Area A, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 stars | A classic, well-established Mexican cantina located in Haizhu\u0027s Party Pier, famous for its vibrant South American atmosphere and breathtaking river views. The signature Cheese Beef Tacos feature a warm, crispy shell packed with tenderly slow-braised spicy beef and rich melted cheese, delivering a juicy burst of flavor in every bite. The tortilla chips with freshly prepared guacamole make a refreshing, appetite-stimulating starter. On weekend nights, the energy runs high as tourists and local youth dance to the music, making it the top pick to experience Guangzhou\u0027s passionate riverside nightlife.", "name": "Zapata\u0027s Mexican Cantina", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 3 minutes"}, {"address": "No. 608 Binjiang East Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 stars | A Michelin-recommended benchmark for authentic Cantonese cuisine in Guangzhou, located adjacent to Binjiang East Road in Haizhu District. It features grand Lingnan-style decor and frontline river views. Taking local traditional dishes to perfection, the must-order Signature Secret Black BBQ Pork features a perfect blend of lean and fatty meat that melts in your mouth, coated in a slightly charred sweet glaze that is aromatic without being greasy. The Snow Mountain Custard Buns are a dream dessert coveted by tourists, boasting a snow-soft bun that releases hot, rich custard cream the moment it is pulled open. Exceptional ingredient quality and authentic taste ensure it is packed with diners on weekdays and weekends alike.", "name": "Bingsheng Pinwei - Binjiang East Branch", "transport": "Take Metro Line 3 to Canton Tower Station, Exit B, then transfer to a bus or walk for about 15 minutes"}, {"address": "3rd Floor, Area A, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 stars | A refined riverside bistro specializing in live jazz performances and exquisite Italian-French cuisine, featuring floor-to-ceiling windows looking directly out at Canton Tower and Liede Bridge. The signature Slow-Braised Red Wine Short Ribs undergo long, low-temperature cooking until tender enough to pull apart easily with a fork, infused with a rich red wine reduction. Paired with house-exclusive truffle fries and fine wines, every bite offers complex layers of flavor. At night, enjoying delicious food while listening to smooth live jazz music and admiring unobstructed luxury Pearl River night views makes this a favorite spot for discerning patrons seeking a sophisticated date night.", "name": "SOPRANO Jazz \u0026 Riverside Bistro", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 4 minutes"}, {"address": "4th Floor, Area C, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 stars | An accessible luxury bistro themed around stunning sunset glows and Pearl River night views, located on a high-level open-air terrace at Party Pier. It focuses on modern Asian fusion cuisine and creative signature cocktails. The signature Pan-Seared Herb Lamb Chops are crispy outside and tender inside, completely free of gamey odor and infused with a captivating rosemary aroma. The special Sunset Cocktail features a beautiful pink-orange gradient, delivering a refreshing, slightly sweet kick of peach and sparkling water. Watching the setting sun paint the Canton Tower gold before the city lights flicker on creates an intoxicating dual sensory feast for sight and taste.", "name": "SUNSET Sunset Bistro", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 3 minutes"}, {"address": "3rd Floor, Area B, Party Pier, No. 218 Yuejiang West Road, Haizhu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 stars | A riverside specialty bistro combining craft beer culture with industrial-style design, serving as a secret hideaway for beer lovers in Haizhu\u0027s arts district. The venue offers dozens of draft beers delivered fresh from house or local craft breweries, ranging from fruity IPAs to heavy, rich stouts. A must-try is the American Pulled Pork Burger, featuring pork shoulder slow-roasted for 12 hours, paired with proprietary smoky BBQ sauce and crispy fries\u2014delivering juicy, tender meat with rich flavor layers. The casual, accessible vibe complements the incredible river views, making it a hit among local youth and visitors alike.", "name": "The Tramper Craft Beer Bistro", "transport": "Take Haizhu Tram Line 1 to Party Pier Station (Pati), walk for about 2 minutes"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 554 Binjiang East Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 stars | Located on Binjiang East Road in Haizhu District, this stylish restaurant seamlessly blends Lingnan garden elegance with modern vegetarian cuisine. The menu highlights creative plant-based dishes made from fresh mushrooms, tofu, and seasonal vegetables. The signature \u0027Black Truffle Wild Mushroom Claypot\u0027 features stir-fried premium wild fungi with a rich aroma and smooth, velvety textures; the \u0027Pine Nut Lion\u0027s Mane Mushroom\u0027 is crispy on the outside, tender inside, with a sweet and tangy sauce that convincingly rivals gourmet meat dishes. With a tranquil, refined ambiance overlooking distant views of the Pearl River, it is a favorite among health-conscious locals and tourists seeking a serene atmosphere.", "name": "Shuimu Lianhua Vegetarian Restaurant", "transport": "Metro Line 3 Canton Tower Station, then transfer to a bus or walk for about 15 minutes."}, {"address": "T.I.T Creative Industry Zone, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 stars | A renowned time-honored vegetarian brand in Guangzhou with an elegant branch in Haizhu\u0027s arts \u0026 culture district. The restaurant adheres to low-oil, low-salt cooking without artificial coloring, bringing out the natural sweetness of every ingredient. A crowd favorite is the \u0027Pan-fried Lion\u0027s Mane Mushroom with Radish Cake\u0027, featuring a golden, crispy crust and a soft, juicy center with a subtle black pepper aroma. The \u0027Handmade Vegetarian Black Pepper Beef Tenderloin\u0027, crafted from tofu skin and konjac, offers a delightfully springy, chewy texture drenched in savory sauce. Its comfortable, wooden decor makes it the perfect spot to relax with a healthy meal after visiting Canton Tower.", "name": "Yixin Vegetarian Restaurant", "transport": "Metro Line 3/8 Kecun Station, Exit A, then walk about 5 minutes into T.I.T Creative Industry Zone."}, {"address": "No. 118 Chigang North Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.7 stars | A modern, stylish spot specializing in exquisite Western and fusion creative vegetarian dishes, located near Canton Tower and Haizhu\u0027s riverside arts district. The culinary team skillfully combines molecular gastronomy techniques with traditional plant-based ingredients. The signature \u0027Black Truffle Creamy Veggie Pasta\u0027 boasts a rich, silky sauce and al dente noodles infused with intoxicating truffle aroma; the \u0027Avocado Tartare\u0027 served with custom rice crackers offers a refreshing, zesty flavor with complex layers. The exquisite art-like plating attracts many young hipsters and international travelers seeking a photo-worthy dining experience.", "name": "Fanya Creative Vegetarian Restaurant", "transport": "Metro Line 3 Canton Tower Station, Exit B, walk for about 12 minutes or take a 5-minute taxi ride."}, {"address": "No. 211 Yiyuan Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.4 stars | A refreshing light-vegetarian caf\u00e9 located in the creative cluster near Canton Tower, focusing on guilt-free veggie power bowls and artisanal plant-based burgers. The popular \u0027Thick-Cut Veggie Patty Cheeseburger\u0027 features a plant-based patty served on house-baked multigrain bread, dressed with special vegan mustard sauce and fresh lettuce\u2014juicy and completely non-greasy; the \u0027Rainbow Veggie Power Bowl\u0027 combines quinoa, roasted avocado, roasted pumpkin, and fresh greens tossed in a signature sesame dressing, offering a crisp and flavorful light dining option loved by young professionals and health-conscious travelers.", "name": "Shujie Vegetarian Caf\u00e9", "transport": "Metro Line 3 Canton Tower Station, Exit B, walk about 8 minutes."}, {"address": "No. 438 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.3 stars | A classic, Zen-inspired vegetarian restaurant nestled in a quiet corner of the Kecun commercial hub in Haizhu District. It serves an array of Cantonese vegetarian dim sum and nourishing soups. Notably, the \u0027Golden Broth Bamboo Fungus Pot\u0027 slow-cooks rare mushrooms and bamboo fungus into a rich, savory, and sweet-aftertaste soup. The \u0027Vegetarian Steamed Shrimp Dumplings\u0027 feature translucent skins stuffed with water chestnut, wood ear mushroom, and konjac\u2014delicately crisp and juicy, recreating authentic Cantonese yum cha flavors. Traditional decor and soft guzheng music create a tranquil sanctuary amid the bustling city.", "name": "Putixin Vegetarian Restaurant", "transport": "Metro Line 3/8 Kecun Station, Exit D, walk about 6 minutes."}, {"address": "No. 288 Chigang East Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.5 stars | A specialty restaurant known for fusing traditional Lingnan vegetarian recipes with modern wellness concepts, right next to the Pearl River arts corridor. The exclusive \u0027Stir-Fried Veggie Intestines with Basil\u0027 uses specially crafted wheat gluten that is braised and stir-fried to achieve a crispy exterior and chewy interior, infused with aromatic Thai basil that pairs perfectly with rice. The \u0027Double-Boiled Lily Bulb and Lotus Seed Soup\u0027 uses fresh lily bulbs and Xiangtan lotus seeds to yield a sweet, skin-nourishing broth. Featuring minimalistic wooden decor and lush street views, it\u2019s a wonderful spot to experience authentic Guangzhou vegetarian food culture.", "name": "Suxinlian Vegetarian Restaurant", "transport": "Metro Line 8 Chigang Station, Exit C2, walk about 10 minutes."}, {"address": "Zone A, T.I.T Creative Industry Zone, No. 397 Xingang Middle Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.3 stars | A trendy vegetarian restaurant in Haizhu\u0027s T.I.T Creative Industry Zone, featuring Southeast Asian-inspired plant-based cuisine. The highly popular \u0027Thai Tom Yum Veggie Noodle Soup\u0027 brews a tangy and spicy broth using fresh lemongrass, galangal, and fresh tomatoes, loaded with king oyster mushrooms, fried tofu puffs, and handmade veggie meatballs that absorb all the delicious soup. The \u0027Vietnamese Veggie Spring Rolls\u0027 feature paper-thin wrappers stuffed with fresh perilla leaves, rice noodles, and crisp vegetables served with a sweet-and-sour dipping sauce\u2014refreshing, flavorful, and beloved by young creatives and foodies.", "name": "Green Heart Vegetarian", "transport": "Metro Line 3/8 Kecun Station, Exit A, walk about 7 minutes."}, {"address": "No. 222 Yuejiang West Road, Haizhu District, Guangzhou", "feature": "\u2b50 4.6 stars | A premier vegetarian club situated along the banks of the Pearl River in Haizhu, boasting magnificent river views. Specializing in high-end private-kitchen vegetarian set menus, the chef masterfully applies classic Cantonese cooking techniques to plant-based ingredients. The \u0027Steamed Lotus Root Meatballs in Lotus Leaf\u0027 blends diced lotus root, yam, and water chestnuts into handmade balls steamed inside lotus leaves, imparting a subtle floral scent and crisp texture; the \u0027Jade Tofu Soup\u0027 features a brilliant green hue with a smooth, velvety broth that is packed with flavor. Sitting by the window at night allows guests to enjoy a healthy, exquisite meal while taking in illuminated views of the Pearl River and Canton Tower.", "name": "Hetang Yuese Vegetarian Restaurant", "transport": "Take the Guangzhou Tram to Liede Bridge South Station and walk 5 minutes, or transfer to the tram from Metro Canton Tower Station."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 126 Xiadu Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A time-honored dessert shop rooted in Haizhu District for decades, famous for its signature \u0027Tang Bu Shuai\u0027 (glutinous rice balls with sweet toppings) and pan-fried chive dumplings. The dumplings feature a crispy, fragrant golden skin bursting with juicy meat and rich chive aroma in every bite. The sweet rice balls are incredibly chewy and soft, coated in aromatic crushed peanuts and sesame without being overly sweet. Both locals and tourists adore this delightful blend of Hong Kong and Guangzhou street flavors.", "name": "Fenfang Dessert (Xiadu Road Branch)", "transport": "Metro Line 3 or Line 8 Kecun Station Exit C, about an 8-minute walk"}, {"address": "Around Canton Tower Scenic Area, Yiyuan Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | A classic Cantonese street cart beef offal stall near Canton Tower, slow-simmered for hours daily with secret Chu Hou paste and mixed spices. The beef brisket is melt-in-your-mouth tender, while the beef tripe and intestines offer a bouncy, chewy texture. Served with radish and fried tofu that soak up the rich, flavorful broth, every bite bursts with savory juice and a subtle spicy kick. Piping hot and full of retro street flavor, it\u2019s the ultimate snack while strolling along the Canton Tower riverside.", "name": "Uncle\u0027s Spicy Beef Offal (Canton Tower Branch)", "transport": "Metro APM Line or Line 3 Canton Tower Station Exit B, about a 3-minute walk"}, {"address": "Inside Kecun Night Market Alley, Yiyuan South Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | An insanely popular late-night street snack around Kecun Night Market. The chicken feet are braised for hours in a special house sauce until incredibly soft and tender, falling off the bone effortlessly. Rich in collagen, the skin is delightfully gooey and chewy, fully absorbing the savory-sweet essence of the sauce with a subtle hint of Sichuan peppercorn fragrance. It draws lines of young locals and visitors late into the night, standing as an iconic late-night bite in Haizhu\u0027s trendy night scene.", "name": "Kecun Saucy Braised Chicken Feet", "transport": "Metro Line 3 Kecun Station Exit D, about a 5-minute walk"}, {"address": "Next to No. 150 Xiadu Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 Stars | Traditional Cantonese bowl-shaped rice cakes served on wooden skewers, offering classic and innovative flavors like red bean, coconut, and chocolate. Firm and delightfully chewy without sticking to your teeth, they feature a lightly sweet flavor and rich red bean filling. Packed with nostalgic childhood charm and budget-friendly, it is a go-to walking sweet treat for tourists exploring Haizhu\u2019s riverside art district.", "name": "Xiadu Road Traditional Steamed Rice Cake (Put Chai Ko)", "transport": "Metro Line 8 Lujiang Station Exit A, about a 6-minute walk"}, {"address": "No. 13 Yiyuan South Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.1 Stars | Hidden in the back alleys between Kecun and Canton Tower, this stall fries every order fresh to order. Signature chicken knee cartilage and tender pork loin are fried to golden perfection\u2014crispy on the outside while remaining tender and juicy inside. Dusted with house-made spicy cumin powder and white sesame seeds, the mouthwatering aroma and crunchy texture paired with signature sauce draw crowds of young foodies craving a delicious late-night guilty pleasure.", "name": "Yiyuan South Road Classic Fried Skewers", "transport": "Metro Line 3 Kecun Station Exit A, about a 4-minute walk"}, {"address": "No. 554 Binjiang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | A traditional Cantonese dessert stall near the Haizhu Riverside Art Zone, carefully simmered using rich water buffalo milk. The top layer of milk skin is rich and fragrant, while the custard beneath is silky smooth like steamed eggs, melting in your mouth with pure milky warmth and subtle cane sugar sweetness. Enjoyed either chilled or hot, it is an absolute must-try classic for experiencing Lingnan dessert culture.", "name": "Haizhu Riverside Shunde Double Skin Milk", "transport": "Metro Line 3 Canton Tower Station Exit A, about a 12-minute walk, or take the Haizhu Tram to Canton Tower East Station"}, {"address": "Next to Canton Tower Pier, Yuejiang West Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Serving the ultimate open-air food stall soul under the nighttime river view, this spot specializes in fresh wok-fried beef rice noodles. Chefs utilize high heat to achieve magnificent \u0027wok hei\u0027 (breath of the wok). The wide rice noodles remain tender and intact, while velvety marinated beef slices combine with crunchy bean sprouts and aromatic dark soy sauce. Every bite delivers a rich, savory flavor. Enjoying a hot plate here after admiring the Canton Tower night view is a quintessential local experience.", "name": "Canton Tower Pier Stir-fried Beef Rice Noodles", "transport": "Metro APM Line Canton Tower Station Exit E, about a 5-minute walk"}, {"address": "Next to Exit C of Chigang Metro Station, Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 Stars | A freshly baked egg waffle (eggette) stall near Chigang and the Canton Tower art area, crafted with batter made from fresh eggs and rich milk. Fresh out of the iron, the eggettes boast an ultra-crisp golden shell with a soft, spongy, chiffon cake-like interior full of egg and milk aroma. Offering creative flavors like lava cheese and chocolate chip, its irresistibly crisp yet soft texture makes it a top walk-and-eat snack for youth and tourists alike.", "name": "Chigang Golden Hong Kong Style Eggettes", "transport": "Metro Line 8 Chigang Station Exit C, right outside the station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Canton Tower and Haizhu Riverside Arts and Culture District"}, "huadu_sunac": {"categories": {"cat_1": {"items": [{"address": "No. 3022, 3rd Floor, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | As a century-old classic Cantonese restaurant and dim sum brand in Guangzhou, Tao Tao Ju in Sunac Mall perfectly blends traditional Cantonese teahouse culture with modern decor. The signature \u0027Tao Tao Ju Giant Shrimp Dumplings\u0027 feature paper-thin, springy wrappers stuffed with three plump, fresh shrimps; taking a bite releases a rich burst of sweet savory juice with fantastic texture layers. The \u0027Buffalo Milk Pineapple Buns\u0027 have an incredibly flaky crust and a warm, velvety filling made of pure buffalo milk that is rich yet not overly sweet. Highly praised by both locals and tourists for its made-to-order handcrafted dim sum, this is the premier spot to experience authentic Cantonese morning tea culture.", "name": "Tao Tao Ju", "transport": "Take Metro Line 9 to Huadu Square Station, then transfer to Bus Hua 19 or Hua 75A and get off at Sunac Mall Station."}, {"address": "No. 140 Pingbu Avenue Middle, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Yelin Seafood Pier is a highly renowned classic seafood restaurant in Huadu, Guangzhou, celebrated for its affordable prices, fresh quality, and made-to-order steamed dishes. Designed like a live seafood market, guests can select lively seafood directly from tanks. Signature dishes like the \u0027Steamed Wild Sea Prawns\u0027 and \u0027Steamed Scallops with Garlic and Vermicelli\u0027 are cooked to perfection\u2014the prawn meat is firm and bouncy with natural sweetness. The \u0027Coconut Chicken Soup\u0027 offers a sweet, refreshing broth with tender chicken. A go-to choice for locals during holiday gatherings and family reunions, it offers tourists an authentic Cantonese seafood feast.", "name": "Yelin Seafood Pier", "transport": "Take a taxi for about 5 minutes from Sunac Resort; or take Bus Hua 6 to Pingbu Avenue Middle Station and walk for 3 minutes."}, {"address": "No. 118 Yingbin Avenue, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Bandao Haoyuan Restaurant is a long-standing landmark for upscale traditional Cantonese cuisine in Huadu, renowned for its exquisitely crafted Cantonese banquets and classic dim sum. Its signature \u0027Gold Medal Crispy Roast Goose\u0027 uses premium Qingyuan black geese, marinated in special spices and roasted in an oven. The skin is paper-thin and golden crispy, while the meat remains tender, juicy, and infused with subtle charcoal aromas. Served with sweet plum sauce to cut through the richness, the flavors are astonishing. The \u0027Sham Tseng Roast Goose\u0027 and \u0027Braised Chicken Feet in Premium Abalone Sauce\u0027 are also widely acclaimed, making this a top choice for experiencing refined Cantonese tea and culinary culture.", "name": "Bandao Haoyuan Restaurant", "transport": "Take Metro Line 9 to Ma\u0027anshan Park Station (Exit C), then walk for about 800 meters or take a taxi for about 3 minutes."}, {"address": "No. 22 Gongyi Road, Xinhua Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Guojing Restaurant is an iconic local teahouse that has accompanied generations of Huadu residents, holding fond memories of old Huadu. It serves a wide variety of traditional morning tea dim sum, with a special recommendation for the \u0027Traditional Ting Zhai Porridge\u0027 (Sampan Porridge). The smooth, silky rice congee is loaded with fresh fish slices, shredded jellyfish, squid, and fried peanuts, offering a rich and nostalgic flavor in every spoonful. The \u0027Steamed Chicken Feet in Imperial Sauce\u0027 are fall-off-the-bone tender and deeply savory. With wallet-friendly prices and generous portions, it attracts many local regulars chatting over morning tea every day, oozing vibrant local life charm.", "name": "Guojing Restaurant", "transport": "Take Metro Line 9 to Huadu Square Station (Exit A), transfer to Bus Hua 6 to Gongyi Road Station, and walk for 2 minutes."}, {"address": "No. 88 Jianshe North Road, Xinhua Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Longji Roast Goose Restaurant is a beloved classic eatery in the old town area of Xinhua, Huadu. Despite its simple decor, its fantastic reputation draws countless foodies. The signature \u0027Traditional Crispy Roast Goose\u0027 is freshly roasted daily, boasting crackling skin, succulent meat, and rich aroma. Drizzled with a secret recipe goose gravy over piping-hot steamed rice, the luscious goose fat infuses the grains with an irresistible taste that leaves you craving more. Foodies often pair it with a fresh \u0027Goose Offal Soup\u0027 to cleanse the palate, showcasing the true essence of Cantonese street-style roast meats.", "name": "Longji Roast Goose Restaurant", "transport": "Take Metro Line 9 to Guangzhou North Railway Station, then take a taxi for about 8 minutes; or take Bus Hua 19 and get off at Jianshe North Road Station."}, {"address": "Next to Bicun Village Committee, Xiuquan Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Bicun Taro Rice is an iconic local specialty dish in Huadu, and this heritage farmhouse restaurant has truly popularized this rustic culinary delight. Its signature \u0027Taro Claypot Rice\u0027 features local high-quality betel nut taro and pork belly. The taro is fluffy and aromatic, seamlessly absorbing the savory rendered pork fat into the rice, while a crispy golden rice crust forms at the bottom for an amazing crunch. Paired with \u0027Steamed Qingyuan Chicken\u0027 featuring crispy skin and succulent meat, its perfect home-style flavors are beloved by both locals and food-hunting tourists.", "name": "Bicun Farmhouse \u0026 Taro Rice", "transport": "It is recommended to take a taxi from Sunac Resort (approx. 15-minute ride); or take Bus Hua 21 to Bicun Station and walk."}, {"address": "No. 45 Shangye Avenue, Xinhua Street, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Wangji Bamboo Noodles is an iconic traditional handmade noodle shop in Huadu that insists on using large bamboo poles to knead dough by hand, creating an extraordinarily springy texture. The signature \u0027Fresh Shrimp Wonton Bamboo Noodles\u0027 features silky-thin yet springy noodles with a satisfying chew and zero alkaline taste. The wontons are generously stuffed with whole fresh shrimps and seasoned pork. The broth, simmered slowly with dried flounder, pork bones, and shrimp roe, is crystal clear and intensely savory. A childhood favorite for generations of locals, it\u0027s a stellar spot to appreciate traditional Cantonese noodle-making craftsmanship.", "name": "Wangji Bamboo Noodles", "transport": "Take Metro Line 9 to Huaguoshan Park Station (Exit A) and walk for about 600 meters."}, {"address": "No. 12 Shuguang Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Xuji Stone-ground Rice Rolls is a hugely popular local breakfast spot in Huadu that uses traditional slow-speed stone grinding for pure rice batter, preserving the authentic fragrance of rice. The signature \u0027Duo Combination Rice Rolls (Beef \u0026 Egg)\u0027 is steamed to perfection, featuring translucent, jade-like sheets that are exceptionally smooth and springy. Drizzled with a specially blended sweet and savory Cantonese soy sauce, it elevates the flavor without overpowering the delicate rice notes. Every bite delivers a delightful harmony of egg, savory meat juices, and silky rice crepe\u2014an essential morning delight for locals to kickstart their day.", "name": "Xuji Stone-ground Rice Rolls", "transport": "Take Metro Line 9 to Huadu Square Station (Exit C), then walk for about 900 meters or take a taxi for about 4 minutes."}], "name": "Famous Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "No. L1037, 1F, Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located in the core area of Sunac Mall, this Reserve store offers pour-over coffee and freshly baked pastries. The hot latte is velvety smooth with a rich hazelnut aroma, while the specialty croissant features a crispy exterior with rich, buttery layers inside. Highly popular with both post-skiing visitors and local residents, it\u0027s an ideal spot to enjoy a relaxing brunch or afternoon downtime.", "name": "Starbucks Reserve (Guangzhou Sunac Mall)", "transport": "Take Huadu Bus Route 22 or 31B to \u0027Sunac Mall Station\u0027, then walk for about 2 minutes."}, {"address": "1F, Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A famous Canadian chain renowned for its signature freshly brewed coffee and made-to-order bagel brunches. The beef and cheese bagel offers a chewy texture packed with savory melted cheese and juicy beef. Paired with a smooth maple latte boasting a nutty sweet finish, it\u0027s incredibly satisfying and popular among young people and families.", "name": "Tim Hortons (Guangzhou Sunac Mall)", "transport": "Take Metro Line 9 to \u0027Ma\u0027anshan Park Station\u0027 Exit C, then transfer to a taxi for about 8 minutes."}, {"address": "B1 Floor, Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Famous for its high-quality, affordable specialty coffee. Its signature Osmanthus Latte offers an elegant, delicate floral sweetness where milk and espresso blend seamlessly into a velvety smooth texture. Paired with a freshly heated sandwich featuring a crisp crust and generous filling, it is the top choice for working professionals and tourists looking for a quick energy boost.", "name": "Manner Coffee (Guangzhou Sunac Mall)", "transport": "Take the Huacheng Street Special Bus Line to \u0027Sunac Bus Terminal\u0027, then walk for about 3 minutes."}, {"address": "3F (next to Snow World entrance), Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Located right next to the popular Sunac Snow World, this is a must-visit refueling spot for ski enthusiasts. The signature Raw Coconut Latte combines rich natural coconut aroma with bold espresso for an extraordinarily smooth and sweet taste. Paired with a rich cheesecake or a croissant brunch combo, it\u0027s sweet without being cloying, helping you quickly recharge after snow sports.", "name": "luckin coffee (Guangzhou Sunac Snow World)", "transport": "Take Bus Hua 85 or Hua 6 to \u0027Sunac Cultural Tourism City Station\u0027, enter Sunac Mall, and take the escalator to 3F."}, {"address": "2F, Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Offers a variety of innovative flavored coffees and light meal pairings at great value. The Raw Coconut Boba Latte is highly recommended\u2014slightly sweet coconut milk blends with rich coffee, while chewy boba pearls add fun texture. Pair it with a hot-pressed ham and egg toast with gooey melted cheese and golden crisp bread, making it a favorite among young travelers.", "name": "Cotti Coffee (Guangzhou Sunac Mall)", "transport": "Take Bus Hua 66 to \u0027Fenghuang North Road Station\u0027, then walk for about 5 minutes to the entrance of Sunac Mall."}, {"address": "Shops in Sunac Cultural Tourism City Commercial Area, Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | An independent Japanese hipster-style coffee and brunch caf\u00e9 with a warm and cozy atmosphere. The signature All-Day Brunch includes silky scrambled eggs, crispy savory German sausages, and a fresh salad. Paired with a freshly ground single-origin pour-over coffee featuring delicate floral and fruity notes, the sweet, savory, and tangy flavors intertwine beautifully. It\u0027s the perfect spot for holiday photos and enjoying a slow morning.", "name": "Awakening Mountain Coffee \u0026 Brunch (Huadu Sunac)", "transport": "Take Bus Hua 76A to \u0027Sunac Park Station\u0027, then walk for about 4 minutes."}, {"address": "1F, Guangzhou Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Spaciously designed with warm lighting and wooden decor, exuding a Korean vintage charm. The signature waffle brunch is freshly made to order\u2014crispy on the outside, soft inside, and packed with eggy flavor. Drizzled with maple syrup and topped with fresh strawberries and whipped cream, it melts in your mouth. Paired with a dark roast hot Americano for a balanced sweet-and-bitter finish, it is a favorite for dates and ladies\u0027 gatherings.", "name": "Maan Coffee (Guangzhou Sunac Mall)", "transport": "Take Metro Line 9 to \u0027Huaguoshan Park Station\u0027, then transfer to a taxi for about 10 minutes."}, {"address": "1F, Sunac Xintiandi Commercial Street, Sunac Cultural Tourism City, Huadu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | A casual brunch caf\u00e9 featuring an American vintage industrial theme. The popular Eggs Benedict Toast features poached eggs that burst with golden yolk at the touch of a knife, paired with rich Hollandaise sauce and smoked salmon for a rich, savory, and layered flavor profile. Sip on an iced shaken peach oolong coffee, where sweet fruitiness meets deep coffee notes for a refreshing contrast.", "name": "Time Brunch \u0026 Coffee (Sunac Cultural Tourism City)", "transport": "Take the Huacheng Street Special Bus Line to \u0027Sunac Cultural Tourism City Terminal\u0027, then walk for about 2 minutes."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Shop 3015, 3F, Sunac Mall, No. 63 Fenghuang North Road, Huacheng Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.6 stars | As a century-old Cantonese restaurant in Guangzhou, Taotaoju perfectly combines traditional Lingnan culinary culture with a modern bistro ambiance. The signature flaky milk egg tarts feature perfectly layered, ultra-crispy crusts with a silky-smooth, richly milky filling that melts in your mouth. The signature century-old roasted goose boasts paper-thin crispy skin and juicy, tender meat. With its elegant yet trendy decor, it\u0027s a great spot to enjoy refined Cantonese cuisine and yum cha after visiting Bonski.", "name": "\u9676\u9676\u5c45 (\u878d\u5275\u8302\u5e97) (Taotaoju - Sunac Mall Branch)", "transport": "Take the Guangqing Intercity Railway to Huachengjie Station, then walk about 5 minutes to enter Sunac Mall."}, {"address": "1F, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | A unique music bistro seamlessly blending gourmet food, fine wine, and live music performances. The signature Hutaoli roasted chicken features golden, crispy skin and tender, juicy meat infused with special spices for an unforgettable flavor. At night, with flickering lights and live folk music, it offers a deeply romantic atmosphere\u2014making it a popular landmark for tourists and young people to gather, relax, and savor refined local fusion dishes.", "name": "\u80e1\u6843\u91cc\u97f3\u6a02\u9152\u9928 (\u878d\u5275\u8302\u5e97) (Hutaoli Music Restaurant \u0026 Bar - Sunac Branch)", "transport": "Take Bus Hua 76A to Sunac Cultural Tourism City Bus Terminal, then walk about 3 minutes."}, {"address": "No. 12, Commercial Street around Sunac Mall, Pingbu Avenue Middle, Huadu District, Guangzhou City", "feature": "\u2b50 4.4 stars | A charming local Cantonese bistro beloved by locals and tourists alike, famous for its signature herbal wine-infused drunken chicken. The rich broth carries a delicate aroma of yellow wine, paired with high-quality local free-range chicken that is tender, juicy, and flavorful. The baked seafood and specialty claypot rice are also must-try dishes, serving authentic and heartwarming Guangzhou home-style cooking.", "name": "\u9189\u5fc3\u96de\u00b7\u50b3\u7d71\u7cb5\u83dc\u5c0f\u9928 (Zuixin Ji Traditional Cantonese Bistro)", "transport": "About an 8-minute walk from the main exit of Bonski (Sunac Snow Park)."}, {"address": "Near Sunac Cultural Tourism City Commercial Circle, Sandong Avenue East, Huadu District, Guangzhou City", "feature": "\u2b50 4.3 stars | Specializing in authentic Huadu farm-style and Hakka dishes, emphasizing fresh and natural flavors. The signature Hakka stuffed tofu is rich in soybean aroma with savory meat filling, while the stone pot trotters are packed with collagen, chewy, and deeply flavorful. Surrounded by lush greenery in a tranquil setting, it\u0027s a great spot to enjoy wholesome, heart-warming countryside comfort food after skiing.", "name": "\u534a\u5c71\u5c0f\u93ae\u00b7\u82b1\u90fd\u8fb2\u5bb6\u5730\u65b9\u83dc (Banshan Town Local Hakka \u0026 Cantonese Cuisine)", "transport": "Taking a taxi or ride-hailing service is recommended (approx. 5 minutes drive)."}, {"address": "Near the intersection of Fenghuang North Road and Pingbu Avenue, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | A spacious local specialty restaurant designed in Lingnan water-town style, famous throughout Huadu for its signature fruitwood-roasted goose. Freshly roasted with crispy skin, tender meat, and a mouthwatering aroma, it pairs perfectly with sweet plum sauce. The menu also features fresh seafood and home-style stir-fries. With its grand Lingnan garden landscape, it\u0027s an ideal choice for family gatherings and tour groups to experience Guangzhou\u0027s food culture.", "name": "\u9d5d\u516c\u6751\u00b7\u5dba\u5357\u7279\u8272\u6c11\u4fd7\u83dc\u9928 (Egongcun Cantonese Roast Goose Village)", "transport": "Take Bus Hua 19 to Sunac Cultural Tourism City Station and walk for a short distance."}, {"address": "Shop 1028, L1 Floor, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.2 stars | A trendy restaurant blending vintage Hong Kong aesthetics with a modern bistro vibe, highly favored by young crowds. Highlights include silky iced milk tea, decadent Hong Kong-style French toast with pouring milk (Lou Nai Hua), and sizzling black pepper beef claypot rice. At night, it offers handcrafted cocktails and grilled skewers, making it a popular hotspot for both great food and casual socializing in the Sunac area.", "name": "\u6f6e\u5ead\u6e2f\u5f0f\u8336\u9910\u9152\u9928 (Chao Ting Hong Kong Style Bistro)", "transport": "Exit from Huachengjie Station on the Guangqing Intercity Railway directly to the entrance of Sunac Mall."}, {"address": "Near Sunac Cultural Tourism City, Shuguang North Road, Huacheng Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.4 stars | An iconic heritage restaurant in Huadu, Guangzhou, well-known for its exceptional value and authentic Cantonese flavors. Signature dishes include crispy-skinned Sham Tseng roasted goose and spicy, tender local pond fish. Radiating vibrant local life and bustling charm, it\u0027s a classic pick for skiers looking to enjoy generous portions of authentic local cuisine.", "name": "\u7af9\u6eaa\u9152\u5bb6\u00b7\u50b3\u7d71\u82b1\u90fd\u8001\u5b57\u865f (Zhuxi Restaurant - Huadu Local Branch)", "transport": "Take Bus Hua 67 to Shuguang North Road Station, then walk about 6 minutes."}, {"address": "Shop 3022, 3F, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.3 stars | A renowned restaurant chain specializing in Northwestern Chinese cuisine, highlighting handmade noodles and hearty beef and lamb dishes. The signature hand-pulled mutton uses premium lamb that is tender, juicy, and free of gamey flavor; the braised pork bones are rich, savory, and satisfying. The bright, cozy, and spacious atmosphere makes it a great spot to recharge with high-energy comfort food after a day on the slopes.", "name": "\u4e5d\u6bdb\u4e5d\u897f\u5317\u6c11\u9593\u83dc (\u878d\u5275\u8302\u5e97) (Jiumaojiu Northwestern Cuisine - Sunac Branch)", "transport": "Located inside Sunac Mall; take the central elevator to the 3rd floor."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Shop 3012, 3rd Floor, Sunac Mall, No. 76 Fenghuang North Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.6 stars | Located near Sunac Resort, this vegetarian restaurant is renowned for its exquisitely crafted mock meats and natural organic produce. The signature \u0027Black Truffle \u0026 Wild Mushroom Pot\u0027 uses fresh wild mushrooms, boasting a silky texture and a rich truffle aroma. The \u0027Handcrafted Black Pepper Veggie Steak\u0027 features a crisp, golden-brown crust and a juicy, chewy interior with an incredibly realistic texture. Prioritizing low oil and salt, it perfectly combines health and flavor, making it a refreshing top choice to refuel after a day at Sunac Snow Park.", "name": "\u975c\u5fc3\u852c\u98df\u9928 (Jingxin Vegetarian Restaurant)", "transport": "Take Metro Line 9 to Ma\u0027anshan Park Station, transfer to Bus Hua 19 to Sunac Resort Station, and walk for about 3 minutes."}, {"address": "Shop 102, Perimeter Shops of Sunac Mall, No. 66 Pingbu Avenue Middle, Huacheng Street, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Offering over 100 varieties of rich vegetarian dishes, this buffet boasts amazing value for money. The piping-hot \u0027Freshly Cooked Veggie Malatang\u0027 features a savory and spicy broth with ingredients like handmade tofu skin soaking up all the flavor. The \u0027Golden Salted Egg Yolk Pumpkin\u0027 is crispy on the outside and tender inside, combining dense pumpkin with rich, savory notes. Free-flowing freshly squeezed juices and delicate vegetarian pastries are huge hits with tourists and families alike in a peaceful, warm atmosphere.", "name": "\u4e00\u8449\u83e9\u63d0\u7d20\u98df\u81ea\u52a9\u9910 (Yi Ye Pu Ti Vegetarian Buffet)", "transport": "Take Bus Hua 67 or Hua 19 to Sunac Bus Terminal, then walk for about 5 minutes."}, {"address": "2nd Floor, Sunac Tianhui Plaza, No. 70 Fenghuang North Road, Huadu District, Guangzhou City", "feature": "\u2b50 4.7 stars | Featuring a Zen-inspired ambiance and traditional Cantonese vegetarian dim sum, this is a wonderful spot for a tranquil dining experience. Highly recommended is the \u0027Crystal Spinach Dumplings\u0027, with thin, chewy translucent skin stuffed with crisp spinach and diced mushrooms, burstingly sweet and juicy. The \u0027Bamboo Fungus \u0026 Mushroom Soup\u0027 is crystal clear yet deeply savory, with crisp bamboo fungus absorbing the broth for a light, guilt-free treat. Elegant wooden d\u00e9cor and soft background music allow you to slow down amidst a busy journey.", "name": "\u5999\u97f3\u7d20\u98df\u9928 (Miao Yin Vegetarian Restaurant)", "transport": "Take Metro Line 9 to Huadu Square Station, then take a taxi for about 8 minutes."}, {"address": "Shop L4015, 4th Floor, Sunac Mall, Huadu District, Guangzhou City", "feature": "\u2b50 4.4 stars | Famous for creative fusion vegetarian dishes with exotic flavors, this restaurant is highly praised by younger crowds. The signature \u0027Thai Spicy \u0026 Sour Veggie Seafood Soup\u0027 uses konjac to craft vegan shrimp and squid, offering a bouncy, chewy texture in a zestily spicy broth. The \u0027Baked Cheese \u0026 Mushroom Rice\u0027 is richly gooey, with rice infused with creamy and earthy flavors, creating wonderfully layered bites. Delicate plating and a chic, modern space make it a popular hotspot for Instagram check-ins and social gatherings.", "name": "\u7da0\u610f\u852c\u98df\u9910\u5ef3 (Greenery Vegetarian Restaurant)", "transport": "Take Bus Hua 19 to Sunac Mall Station and go directly to the 4th floor."}, {"address": "No. 120 Pingbu Avenue Middle, Huadu District, Guangzhou City (next to Sunac Resort)", "feature": "\u2b50 4.8 stars | Focusing on high-end nourishing herbal cuisine and artistic vegetarian dishes, this restaurant is favored by health-conscious foodies. The \u0027Matsutake Health Broth\u0027 slow-simmers premium alpine matsutake mushrooms for hours, delivering a mellow, sweet, and comforting taste. The \u0027Stuffed Morels with Lily Bulb\u0027 combines lily bulb puree and organic seasonal vegetables inside morels, yielding a tender, springy texture with subtle botanical aromas. Classical and elegant private rooms coupled with attentive table service make it ideal for business banquets or family gatherings.", "name": "\u6c34\u6728\u84ee\u83ef\u990a\u751f\u7d20\u98df (Shui Mu Lian Hua Vegetarian Restaurant)", "transport": "Walk for about 10 minutes from Sunac Snow Park, or take a taxi for about 3 minutes."}, {"address": "Shop B122, 1st Floor, Sunac Tianhui Block, Huadu District, Guangzhou City", "feature": "\u2b50 4.3 stars | Featuring additive-free whole foods, this restaurant is very popular with health-conscious travelers. The \u0027Rainbow Fruit \u0026 Veggie Salad with Sesame Dressing\u0027 selects freshly harvested organic vegetables for a crisp, refreshing bite paired with rich sesame dressing. The \u0027Sizzling Ginger Lion\u0027s Mane Mushroom\u0027 prepares the mushroom to be as juicy and savory as a filet mignon, infused with appetizing ginger aroma and satisfying chewiness. The ambiance is bright, modern, and brimming with natural vibes.", "name": "\u7d20\u5fc3\u5712\u5065\u5eb7\u852c\u98df (Su Xin Yuan Healthy Vegetarian)", "transport": "Take Bus Hua 76A to Sunac Resort Terminal, then walk for about 4 minutes."}, {"address": "Southeast Corner of the Intersection of Shuguang Road and Pingbu Avenue, Huadu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Incorporating traditional Cantonese culinary techniques into vegetarian dishes, this spot leaves guests thoroughly impressed. The signature \u0027Vegetarian Crispy Roast Duck\u0027 is skilfully layered using bean curd skin, roasted to golden crispness, and served with thin pancakes, cucumber strips, and sweet bean sauce for a savory-sweet, crispy, and tender combination. The \u0027Sour \u0026 Spicy Veggie Fish Slices in Golden Soup\u0027 features a zesty, flavorful broth with silky konjac fish slices, making it immensely appetizing. Wallet-friendly with generous portions, it\u0027s perfect for family dining.", "name": "\u83e9\u63d0\u7de3\u852c\u98df\u6599\u7406 (Bodhi Origin Vegetarian Cuisine)", "transport": "Take Bus Hua 67 to Shuguang Road North Station, then walk for about 6 minutes."}, {"address": "No. 88 Baishou Road, Huacheng Street, Huadu District, Guangzhou City (near Sunac Resort)", "feature": "\u2b50 4.4 stars | An affordable vegetarian buffet offering a wide variety of options, ideal for budget travelers and tourists looking for a hearty meal. The \u0027Freshly Fried Veggie Spring Rolls\u0027 feature a golden crispy skin that crackles with each bite, filled with sweet shredded mushrooms and tender cabbage. The \u0027Braised Veggie Beef Noodle Soup\u0027 boasts a rich herbal broth, tender veggie beef chunks, and springy noodles. Clean surroundings and warm, welcoming service offer a cozy, home-like feeling.", "name": "\u6148\u5fc3\u7d20\u98df\u81ea\u52a9\u9910\u5ef3 (Ci Xin Vegetarian Buffet)", "transport": "Take Bus Hua 19 directly to Baishou Lukou Station, then walk for about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Floor L3, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.6 stars | A comforting dessert that is a must-try after skiing at Sunac Snow World! The signature Ginger Milk Pudding is made fresh to order by pouring hot milk directly into raw ginger juice. After setting for a few minutes, it achieves a silky, smooth texture similar to tofu pudding, boasting a rich milky flavor balanced with a gently spicy ginger kick. The Double Skin Milk is equally creamy, thick, and rich in aroma, topped with sweet red beans that aren\u0027t overly sugary\u2014a Cantonese street-side sweet highly praised by locals and tourists alike.", "name": "Zhao Ji Heritage Milk Desserts", "transport": "Take the Guangqing Intercity Railway to \u0027Huachengjie Station\u0027 and walk for about 5 minutes to enter Sunac Mall."}, {"address": "Food Street Area, L1, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.5 stars | Authentic old-school Guangzhou street flavor! Rich Chu Hou paste braises beef tripe, tendon, intestines, and daikon radish slowly over low heat until deeply flavorful. The offal is tender yet chewy with no gamey smell, while the juicy radish absorbs every bit of savory broth and melts in your mouth. Many visitors grab a bowl after shopping or skiing, enjoying it on bamboo skewers as they walk\u2014drizzling on their special chili sauce makes it even better.", "name": "Ah Po Beef Offal", "transport": "Take Bus Hua 63 or Hua 19 to \u0027Sunac Mall Station\u0027, then walk about 3 minutes."}, {"address": "Stalls around Bar Street, Sunac Resort, Huadu District, Guangzhou", "feature": "\u2b50 4.4 stars | Huadu\u0027s iconic traditional stroll-and-eat snack! Made with local Tanbu Areca taro diced and mixed into rice batter, cured pork, and dried shrimp, then steamed and pan-fried until golden and crispy outside. Crispy on the outside and soft on the inside, every bite delivers whole taro chunks with a fluffy texture and the rich, savory aroma of cured meat\u2014a true local favorite beloved by foodies.", "name": "Tanbu Taro Cake Street Stall", "transport": "Walk about 6 minutes from the exit of Sunac Snow World to reach the surrounding pedestrian street area."}, {"address": "Inner Street Stalls, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.3 stars | A hugely popular made-to-order street dessert in the Sunac shopping area. The honeycomb-shaped egg waffles feature an extremely crispy outer shell while remaining fluffy and chewy like a fresh cake on the inside. Rich egg and milk aromas burst in your mouth upon taking a bite. Besides the original flavor, cheese and molten chocolate flavors are also available\u2014making it a perfect energy booster to hold and munch on while exploring.", "name": "Baifang Egg Waffles \u0026 Street Snacks", "transport": "Take Metro Line 9 to \u0027Huadu Square Station\u0027, then transfer to a taxi for about 10 minutes."}, {"address": "Floor L1, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.7 stars | The ultimate refreshing drink that everyone in Guangzhou carries around! Selected perfume lemons are vigorously hand-mashed on the spot to release rich essential oils and juices, then shaken hard with custom high-mountain oolong tea and ice. The very first sip hits you with intense, crisp citrus aromas and icy chill without any bitterness. Perfectly refreshing and palate-cleansing, it\u2019s the best thirst-quencher after wandering lively night markets or indoor skiing.", "name": "LINLEE Hand-punched Lemon Tea", "transport": "Exit from Guangqing Intercity \u0027Huachengjie Station\u0027 and take the connecting walkway directly into Sunac Mall."}, {"address": "Street Food Market outside the entrance of Sunac Snow World, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.2 stars | A sizzling street snack right outside Sunac Snow World that never loses its popularity. Special dough sheets are grilled on a flat top until slightly scorched, topped with an egg, sliced sausage, and diced onions, brushed with sweet and spicy sauce, sprayed with aged vinegar, then rolled and sliced. Chewy, soft, sweet, and sour, the steaming hot aroma is irresistible after a cold indoor skiing session\u2014a massive hit among young travelers.", "name": "Snow World Street Food - Grilled Cold Noodles", "transport": "Located right next to the main entrance of Sunac Snow World on L2 of Sunac Mall, within walking distance."}, {"address": "Food Court, L3, Sunac Mall, No. 63 Fenghuang North Road, Huadu District, Guangzhou", "feature": "\u2b50 4.5 stars | A landmark eatery for traditional Cantonese cloth-steamed rice rolls (Cheung Fun). Freshly steamed to order, the rice sheets are paper-thin, translucent, and wrapped around tender beef or fresh shrimp. Silky smooth and delicate with a hint of rice aroma and chewiness, paired with sweet soy sauce that balances sweet and savory, perfectly showcasing the refined style of Cantonese breakfast and street food. Loved by locals and visitors alike.", "name": "Huahui Steam Rice Rolls", "transport": "Take Bus Hua 19 directly to \u0027Sunac Resort Terminal\u0027, then walk about 4 minutes into the mall."}, {"address": "Outdoor Night Market Area outside Sunac Mall, Sunac Resort, Huadu District, Guangzhou", "feature": "\u2b50 4.4 stars | A tremendously popular Sichuan cold-pot skewer (Bobo Chicken) stall at Sunac\u0027s night market. Cooked chicken, beef tripe, lotus root, wood ear mushroom, and other ingredients are skewered on bamboo sticks and steeped in spicy, fragrant chili oil broth topped with white sesame seeds. Spicy, aromatic, crunchy, and savory, the rich oil aroma is satisfying without feeling greasy. Easy to hold while strolling, it\u0027s a mouthwatering night snack at Sunac Resort.", "name": "Shu Flavor Sichuan Skewers", "transport": "Located next to Sunac Resort Central Square, about an 8-minute walk from Huachengjie Intercity Railway Station."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Huadu Sunac Cultural Tourism City and Ice and Snow World"}, "panyu_chimelong": {"categories": {"cat_1": {"items": [{"address": "Hanxi Intersection, Guangzhou Avenue South Extension, Panyu District, Guangzhou (Near Chimelong Safari Park)", "feature": "\u2b50 4.6 Stars | Zi Zhou Lou is an iconic Shunde and Cantonese traditional establishment in Panyu, famous for its signature \u0027rice-less congee base hot pot\u0027 and classic Cantonese dishes. Simmered on low heat for hours, the rice-less congee base is velvety smooth with a subtle rice aroma. Swirling fresh seafood, pork offal, or yellow beef in this base locks in all the juices, making the meat incredibly tender and silky. Their classic deep-fried milk is crispy on the outside, soft on the inside, and rich with milky sweetness. Both tourists and Guangzhou locals highly praise it for preserving the purest Lingnan culinary wisdom and natural flavors of fresh ingredients.", "name": "Zi Zhou Lou (\u6ecb\u7ca5\u6a13)", "transport": "Metro Line 3/Line 7 \u0027Hanxi Changlong Station\u0027 Exit D, then take a taxi for about 5 minutes."}, {"address": "No. 555 Panyu Avenue North, Panyu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Fisherman\u0027s New Village is a household-name, time-honored large Cantonese seafood restaurant in Panyu. It offers authentic Cantonese morning tea (dim sum) and extravagant seafood feasts. The iconic \u0027King Shrimp Dumplings\u0027 feature paper-thin skin stuffed with plump, bouncy shrimp, while the \u0027Steamed Crystal Chicken Feet\u0027 are tender enough to fall off the bone with a rich, savory sauce. You can also pick fresh seafood live on-site to be steamed or stir-fried, locking in pure natural flavors. A top choice for locals hosting banquets and tourists unwinding after Chimelong, showcasing traditional Cantonese banquet dining at its finest.", "name": "Fisherman\u0027s New Village Main Branch (\u6f01\u6c11\u65b0\u6751 \u7e3d\u5e97)", "transport": "Metro Line 3 \u0027Dashi Station\u0027 Exit D, transfer to Bus Pan 190 and get off at \u0027Guantang Village Station\u0027."}, {"address": "No. 283 Panyu Avenue North, Panyu District, Guangzhou (Inside Chimelong Tourist Resort)", "feature": "\u2b50 4.4 Stars | Belonging to the Chimelong Group, Xiangjiang Restaurant is a long-standing traditional establishment specializing in authentic local Panyu Cantonese cuisine and exquisite morning dim sum. Highly recommended is the \u0027Xiangjiang Sham Tseng Roast Goose\u0027\u2014featuring golden, crispy skin that bursts with savory aroma, paired with juicy, tender meat and a sweet-and-sour plum sauce that cuts through the richness. The hand-pulled rice rolls and salted egg yolk custard buns are also must-orders, offering smooth, chewy textures and balanced sweet-savory filling. An excellent spot to experience authentic Cantonese dim sum culture.", "name": "Xiangjiang Restaurant (\u9999\u6c5f\u9152\u5bb6)", "transport": "Metro Line 3 \u0027Hanxi Changlong Station\u0027 Exit E, take the free Chimelong shuttle bus directly to the venue."}, {"address": "No. 102 Chaoyang East Road, Dashi Street, Panyu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Originating from Shawan Ancient Town, Qinfangyuan is one of Panyu\u0027s most historic traditional Lingnan dessert shops, with branches near Chimelong. Its signature dessert, \u0027Ginger Milk Curd\u0027, uses rich buffalo milk poured directly over hot ginger juice; set after a few minutes into a smooth paste, it has a texture even silkier than tofu pudding, with spicy ginger notes harmonizing perfectly with rich milk. Additionally, the \u0027Double-Skin Milk\u0027 and \u0027Tang Bu Shuai\u0027 (chewy glutinous rice balls with peanuts and sugar) are iconic, unmissable delicacies adored by foodies.", "name": "Qinfangyuan Milk Dessert Expert (\u6c81\u82b3\u5712\u725b\u5976\u751c\u54c1\u5c08\u5bb6)", "transport": "Metro Line 3 \u0027Dashi Station\u0027 Exit A, walk for about 10 minutes."}, {"address": "No. 236 Fushi Road, Dashi Street, Panyu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Huirun Restaurant is a beloved traditional Cantonese eatery praised by Panyu locals for its authentic home-style flavors and expert wok hei (wok heat). The signature \u0027Candied Sweet and Sour Pork\u0027 (Basi Gulu Meat) is an absolute masterwork\u2014coated in a translucent, crispy sugar shell with juicy, tender pork inside, balancing sweet and sour flavors flawlessly. Additionally, the \u0027Hakka Stuffed Tofu\u0027 is golden-crisp on the outside and velvety within, stuffed with savory minced meat\u2014a true crowd-pleaser among neighborhood regulars and Chimelong visitors alike.", "name": "Huirun Restaurant (\u60e0\u6f64\u98ef\u5e97)", "transport": "Metro Line 3 \u0027Dashi Station\u0027 Exit C, then take a taxi for about 6 minutes."}, {"address": "No. 68 Renmin Road, Zhongcun Street, Panyu District, Guangzhou", "feature": "\u2b50 4.2 Stars | Zhongcun Minji is a long-standing, neighborhood staple eatery in the Zhongcun area of Panyu, renowned for traditional \u0027Cantonese Boat Porridge\u0027 (Ting Zai Zhou) and hand-steamed \u0027Stone-Ground Steamed Rice Rolls\u0027. The boat porridge is packed with ingredients like shredded squid, dried shrimp, fish slices, fresh pork, and crunchy peanuts, all simmered into a velvety, naturally sweet broth. The paper-thin rice rolls are silky and fragrant, perfectly elevated when drizzled with custom sweet soy sauce\u2014offering an authentic taste of down-to-earth traditional Cantonese breakfast culture.", "name": "Zhongcun Minji Boat Porridge \u0026 Rice Rolls (\u9418\u6751\u654f\u8a18\u8247\u4ed4\u7ca5)", "transport": "Metro Line 7 \u0027Zhongcun Station\u0027 Exit A, walk for about 12 minutes."}, {"address": "Opposite the North Gate of Jinxiu Xiangjiang, Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.3 Stars | E Jie Restaurant is a highly reputed traditional Lingnan home-style diner near the Chimelong Resort, specializing in Cantonese roasts and classic local Panyu countryside dishes. The famous \u0027Black Pepper Roast Goose\u0027 features crispy skin and succulent meat; roasted goose fat releases an irresistible aroma enhanced by aromatic black pepper. Another highlight, \u0027Steamed Panyu Three Treasures\u0027, uses fresh local ingredients to capture pure, savory, and tender flavors, winning the hearts of food lovers seeking nostalgic flavors.", "name": "E Jie Restaurant (\u9d5d\u59d0\u9910\u9928)", "transport": "Metro Line 3/Line 7 \u0027Hanxi Changlong Station\u0027 Exit C, walk for about 8 minutes."}, {"address": "No. 1 Xindi Road, Hanxi Village, Zhongcun Street, Panyu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Xindi Farmhouse Restaurant is a distinctive traditional Panyu-style rustic eatery near Chimelong, specializing in original Lingnan steamed and \u0027sauna\u0027 dishes. Its signature \u0027Sauna Chicken\u0027 features tender chicken pieces steamed with cordyceps flowers over a wooden steamer, with rich chicken broth simmering underneath. Once steamed, the chicken turns extraordinarily tender, juicy, and aromatic. Finishing the meal with a bowl of the flavorful, nourishing chicken broth below completes the experience. This natural, wholesome cooking technique draws endless food lovers seeking healthy, authentic dining.", "name": "Xindi Farmhouse Restaurant (\u65b0\u5730\u8fb2\u838a)", "transport": "Metro Line 3 \u0027Hanxi Changlong Station\u0027 Exit G, then take a taxi for about 5 minutes."}], "name": "Iconic Local Traditional Establishments"}, "cat_2": {"items": [{"address": "1st Floor, Building 3, Times E-PARK, Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.7 stars | A signature local specialty independent coffee brand in Guangzhou, located inside Times E-PARK in the Chimelong business district. Their signature Flat White is incredibly smooth, perfectly blending espresso and microfoam with rich aromas of nuts and dark chocolate. Featuring a minimalist industrial design, it\u0027s a popular spot for tourists to fuel up before heading to Chimelong Safari Park or for local office workers to enjoy an afternoon break. The signature cold brew offers a balanced sweet-and-sour profile, refreshing and highly favored by young adults.", "name": "STORE by JPG (Times E-PARK Branch)", "transport": "Approx. 300m walk from Exit G of Hanxi Changlong Station (Metro Lines 3/7)"}, {"address": "No. 16, Hanxi Village Commercial Street, Zhongcun Subdistrict, Panyu District, Guangzhou", "feature": "\u2b50 4.6 stars | Located right next to Hanxi Changlong Metro Station, this is one of the most popular brunch spots around the Chimelong Safari Park area. Cut open their signature Eggs Benedict to reveal a rich, golden yolk flowing gently over an English muffin\u2014crispy on the outside, soft on the inside\u2014topped with rich, tangy Hollandaise sauce for a satisfyingly layered flavor profile. Their oat milk latte is fragrant and perfectly balanced, leaving a savory cereal lingering taste. The warm, cozy wooden decor creates a relaxing vacation vibe, attracting families and tourists alike for a leisure morning.", "name": "Lockal Coffee \u0026 Brunch", "transport": "500m walk from Exit C of Hanxi Changlong Station (Metro Line 3)"}, {"address": "1st Floor, Agile Plaza, Wanbo 2nd Road, Nancun Town, Panyu District, Guangzhou", "feature": "\u2b50 4.5 stars | Renowned for fresh-baked Japanese bread and exquisite pour-over coffee. The signature Sea Salt Croissant boasts a crispy exterior and fluffy, pillowy interior, bursting with rich premium butter aroma and a savory touch of sea salt with every bite. Pair it with a fruity Ethiopian pour-over coffee featuring lively acidity and a sweet finish. The minimalist Japanese style makes it ideal for Instagram-worthy photos, making it a fantastic spot for afternoon tea after visiting Chimelong attractions.", "name": "Gakko Bakery \u0026 Cafe", "transport": "400m walk from Exit B of Nancun Wanbo Station (Metro Line 7)"}, {"address": "1st Floor, Wanda Plaza, No. 387 Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.6 stars | A trendy hipster coffee shop located at the border of Wanbo and Chimelong, famous for its house-roasted premium beans. Their Hot Tiramisu Latte is a specialty masterwork: a rich espresso base topped with a thick layer of whipped cream and cocoa powder, tasting just like a sophisticated dessert with a perfect interplay of subtle bitterness and sweetness. The atmosphere is quiet, cozy, and filled with the aroma of roasted coffee, highly praised by local coffee enthusiasts and visiting travelers.", "name": "KUDO COFFEE", "transport": "250m walk from Exit AA of Nancun Wanbo Station (Metro Line 7)"}, {"address": "1st Floor, Building 2, Times E-PARK, Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.5 stars | A renowned specialty coffee chain famous for high quality and excellent value, located in a business park near Hanxi Changlong Station exit. The Hot Osmanthus Latte delivers an elegant, gentle floral osmanthus fragrance, combining seamlessly with rich milk and espresso for a silky smooth finish. Quick service and consistent quality make it the perfect grab-and-go stop for a quality brew before heading out to enjoy Chimelong Safari Park.", "name": "Manner Coffee (Times E-PARK Branch)", "transport": "200m walk from Exit G of Hanxi Changlong Station (Metro Lines 3/7)"}, {"address": "Zone 7, Aoyuan Plaza, Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.8 stars | A popular retro American-style brunch spot in Aoyuan Plaza, specializing in generous brunch platters and fresh milkshakes. The signature Grand American Breakfast features crispy bacon, juicy homemade pork sausages, silky scrambled eggs, and golden hash browns\u2014delivering rich textures and ultimate satisfaction. Paired with a fresh-squeezed juice or a robust Americano, it provides full energy for a big day at Chimelong. The vibrant American street vibe makes it a favorite check-in destination for tourists.", "name": "Over Easy Brunch Club", "transport": "Approx. 350m walk from Exit C of Hanxi Changlong Station (Metro Line 3)"}, {"address": "Next to the North Gate of Chimelong Safari Park, Hanxi Avenue West, Dashi Subdistrict, Panyu District, Guangzhou", "feature": "\u2b50 4.4 stars | A forest-themed scenic caf\u00e9 near the North Gate of Chimelong Safari Park, offering a quiet environment surrounded by lush greenery. The signature Coconut Cold Brew pairs fresh young coconut water with medium-roasted beans, offering a crisp, naturally sweet flavor with gentle notes of coconut and coffee fruit\u2014ideal for Guangzhou\u0027s warm weather. Sitting on the wooden terrace enjoying a coffee feels like escaping into a tropical rainforest, making it a perfect resting spot for families and couples after exploring Chimelong.", "name": "Tree House Cafe", "transport": "Take the free Chimelong resort shuttle bus to Chimelong Safari Park North Gate, then walk for 2 minutes"}, {"address": "2nd Floor, Zone 5, Aoyuan Plaza, Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.5 stars | Tucked away on the second-floor open-air terrace of Aoyuan Plaza, this brunch restaurant boasts abundant natural light and lush greenery. The signature Avocado \u0026 Shrimp Toast uses crusty sourdough topped with creamy mashed avocado and sweet, succulent seared shrimp; every bite bursts with rich buttery aromas and fresh seafood flavors that are delightfully light and healthy. Paired with a specialty Matcha Latte\u2014blending subtle bitter-sweet matcha with velvety milk\u2014it is a favorite choice among female guests and vacationers.", "name": "SEEN Cafe \u0026 Brunch", "transport": "Approx. 300m walk from Exit C of Hanxi Changlong Station (Metro Line 3)"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 368 Xingnan Avenue, Nancun Town, Panyu District, Guangzhou City", "feature": "\u2b50 4.7 stars | Zizhou Lou is an iconic culinary landmark of Panyu, renowned for its unique \u0027rice-less congee hot pot\u0027 and traditional Shunde-Panyu dishes. The restaurant features a rich Lingnan water town decor with a lively yet cozy atmosphere. Patrons rave about the cooked-to-order congee hot pot base\u2014plain white rice congee simmered until the grains melt away, into which tender grass carp slices, handmade pork meatballs, and offal are poached. The cooked ingredients are extraordinarily silky, smooth, and naturally sweet with subtle rice aromas. Additionally, their traditional roasted goose boasts a golden, crispy skin and rich juices that burst with every bite, making it a beloved pick for both locals and tourists.", "name": "Zizhou Lou Restaurant (Panyu Main Branch)", "transport": "Take Guangzhou Metro Line 7 to Yuangang Station, Exit A, and walk for about 8 minutes."}, {"address": "3F, Universal Metropolitan Plaza, No. 477 Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.8 stars | As a legendary benchmark of Cantonese cuisine in Guangzhou, BingSheng PinWei (Hanxi Changlong Branch) combines refined local dishes with an elegant bistro vibe. Its modern Chinese decor is grand and comfortable, making it a top choice for family gatherings and fine dining. The signature \u0027Secret Recipe Black Barbecued Pork\u0027 uses premium pork belly with perfectly balanced fat, slow-roasted with a special glaze until caramel-crisp and sweet, melting in your mouth without feeling overly greasy. The \u0027Chilled Trotters\u0027 offer a refreshing, springy texture with crispy skin and fragrant meat. Paired with selected wines or custom Lingnan tea cocktails, it perfectly elevates the rich layers of Cantonese gastronomy.", "name": "BingSheng PinWei (Hanxi Changlong Branch)", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit G, and walk for about 3 minutes."}, {"address": "Building HI2, Aoyuan Plaza, Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Located at Aoyuan Plaza in the Changlong commercial area, Zui Guan Jing seamlessly blends traditional Cantonese cuisine with a trendy bistro atmosphere. Featuring soft lighting, romantic vibes, an outdoor bar, and cozy booths, it\u0027s perfect for evening drinks and meals with friends. The bistro specializes in creative Cantonese regional dishes paired with craft beers and specialty cocktails. The \u0027Crispy Black Pepper Glass-Skin Pigeon\u0027 comes highly recommended\u2014its skin is as paper-thin and crispy as glass, enclosing juicy meat infused with rich black pepper aroma. Paired with a signature local cocktail infused with aged Guangdong dried tangerine peel, the complex flavors are stunningly delightful, making it a favorite among young diners and travelers.", "name": "Zui Guan Jing Cantonese Bistro", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit C, and walk for about 5 minutes."}, {"address": "1F, Times E-PARK, Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.4 stars | Goose Master is a highly popular local roast meat and Panyu restaurant near Changlong Resort, famous for preserving the traditional method of roasting goose over lychee wood. The diner boasts a cozy, lively open-air eatery (Dai Pai Dong) vibe filled with inviting aromas. The signature \u0027Lychee Wood Ancient-Style Roasted Goose\u0027 utilizes Qingyuan black goose with paper-thin, enticing amber skin that crackles delightfully with every bite, while the meat remains tender, juicy, and subtly infused with smoky lychee wood notes. Served with tangy plum sauce and piping hot goose oil tossed noodles, it offers an unforgettable meal and a must-try experience for local roast duck/goose culture.", "name": "Goose Master Restaurant", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit D, and walk for about 6 minutes."}, {"address": "Near Hanxi Avenue East, Hanxi Village, Zhongcun Street, Panyu District, Guangzhou City", "feature": "\u2b50 4.6 stars | Nestled in a quiet area next to Changlong Resort, Tang She is a unique local restaurant oozing traditional Lingnan water town charm. Bridges, flowing water, and lush greenery create a serene dining escape away from the hustle and bustle. The menu focuses on Panyu farm-style cooking and water town private kitchen dishes, with \u0027Shiqi Pigeon\u0027 and \u0027Panyu Lotus Root Soup Pot\u0027 as signature regional highlights. The lotus root soup, in particular, slow-simmers local tender lotus roots with pork spine for hours, resulting in a rich, sweet broth and melt-in-your-mouth lotus roots that showcase the true, natural flavors of local Panyu ingredients.", "name": "Tang She Water Town Private Kitchen", "transport": "Take Guangzhou Metro Line 3 to Hanxi Changlong Station, then take a taxi for about 5 minutes."}, {"address": "2F, Building 4, Aoyuan Plaza, Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.7 stars | The century-old brand Tao Tao Ju established a flagship branch in the Changlong commercial zone, combining dim sum with a chic bistro experience. The elegant interior preserves traditional Lingnan elements like Xiguan stained-glass windows while integrating modern bar aesthetics. Beyond all-day exquisite Cantonese dim sum, signature local hot dishes like \u0027Tao Tao Ju Century-Old Roast Goose\u0027 and \u0027Crispy Bite-Sized Tofu\u0027 are table staples. The crispy tofu features a golden, crunchy exterior and a custard-smooth interior; dipped in signature sweet and spicy sauce, the dynamic contrast of textures is astonishing, making it a fantastic spot to experience Guangzhou\u0027s rich culinary tradition.", "name": "Tao Tao Ju Restaurant (Chimelong Branch)", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit C, and walk for about 4 minutes."}, {"address": "2F, Universal Metropolitan Plaza, No. 477 Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.6 stars | Haimen Yuzai is a highly acclaimed Teochew regional cuisine restaurant in Guangzhou, with its Changlong branch bustling with crowds daily. It features an open seafood display ordering counter filled with fresh catches over ice, creating an authentic Teochew fishing port vibe. The signature \u0027Bombay Duck Fish\u0027 (Jiutu Fish), prepared steamed in savory soy broth or salt and pepper style, offers boneless, tofu-smooth flesh that melts in your mouth with sweet freshness. The \u0027Teochew Marinated Platter\u0027 is rich in aromatic brine without feeling greasy. Paired with a piping-hot Teochew claypot rice porridge, fresh seafood flavors burst on your palate, winning the hearts of both locals and tourists.", "name": "Haimen Yuzai Teochew Seafood Restaurant", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit G, and walk for about 3 minutes."}, {"address": "1F, Building 3, Aoyuan Plaza, Hanxi Avenue East, Panyu District, Guangzhou City", "feature": "\u2b50 4.5 stars | As one of Guangzhou\u0027s legendary eight historic restaurants, Da Tong Restaurant\u0027s Panyu branch debuts as a modern Cantonese bistro. The venue recreates the charm of old Guangzhou teahouses alongside a sleek bar counter and elegant seating. The signature \u0027Da Tong Chicken\u0027 offers crispy skin, tender meat, and savory flavor right down to the bone. The \u0027Da Tong Egg Tarts\u0027 are timeless classics, boasting dozens of flaky pastry layers with a smooth, rich custard filling that melts effortlessly. Here, you can savor nostalgic regional classics beloved across generations while enjoying a tea-infused cocktail that celebrates Guangzhou\u0027s blend of tradition and modernity.", "name": "Da Tong Restaurant (Modern Cantonese Bistro)", "transport": "Take Guangzhou Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit C, and walk for about 5 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "4th Floor, Panyu Wanda Plaza, No. 381 Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.7 stars | Focuses on exquisite, modern plant-based cuisine, infusing Western cooking techniques into Oriental vegetarian ingredients. The signature Black Truffle Wild Mushroom Rice is rich and silky; the rice grains absorb the rich essence of mushrooms with a hint of creamy notes and distinct truffle aroma, making it flavorful yet non-greasy. The sleek, elegant interior is popular among health-conscious young diners and families visiting Chimelong Resort.", "name": "Shu Dao Vegetarian Restaurant (Wanda Plaza Branch)", "transport": "Take Metro Line 7 or Line 18 to Nancun Wanbo Station, Exit B, then walk for about 5 minutes."}, {"address": "3rd Floor, Panyu Aoyuan Plaza, No. 281 Fude Road, Panyu District, Guangzhou", "feature": "\u2b50 4.6 stars | Panyu branch of a time-honored Guangzhou vegetarian brand, renowned for healthy, natural, Zen-inspired nourishing cuisine. Highly recommended a
