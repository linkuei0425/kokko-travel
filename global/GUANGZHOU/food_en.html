    <script>
        const db = {"baiyun_mountain": {"categories": {"cat_1": {"items": [{"address": "Shuangxi Scenic Area, Mount Baiyun Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.5 Stars | Shuangxi Restaurant is a decades-old, iconic traditional Cantonese establishment located within the Mount Baiyun Scenic Area. Its signature dish, \u0027Baiyun Crispy Pork Trotters,\u0027 uses strictly selected premium trotters soaked in natural mountain spring water and slow-simmered in rich broth. It features crisp skin, tender yet springy meat, and a perfectly balanced sweet-and-sour taste that is never greasy, giving a chilled, delightfully crunchy bite. Additionally, their \u0027Mountain Spring Water Tofu Pudding\u0027 is silky smooth with a rich soybean aroma. Not only is it the top choice for local Guangzhou residents seeking morning tea after a hike, but its antique garden setting and classic Cantonese flavors also make it a must-visit attraction for tourists.", "name": "Shuangxi Restaurant, Mount Baiyun", "transport": "Take the Mount Baiyun Cable Car to Summit Square Station, then transfer to a scenic sight-seeing bus to Shuangxi Scenic Area"}, {"address": "Next to Summit Square, Mount Baiyun, Baiyun District, Guangzhou City", "feature": "\u2b50 4.3 Stars | Located near Summit Square on Mount Baiyun, this spot serves a traditional, authentic local snack that has been a must-try for mountain hikers for decades. Their tofu pudding is handcrafted using ancient methods, utilizing high-quality Mount Baiyun spring water and premium soybeans. It boasts an exceptionally delicate texture that melts in your mouth with a rich natural soybean flavor, perfectly paired with house-made brown sugar syrup or osmanthus syrup\u2014sweet without being cloying, and incredibly smooth. Whether for morning-exercising seniors or visiting tourists, enjoying a bowl of chilled or warm tofu pudding upon reaching the summit is a wonderfully comforting and rewarding ritual.", "name": "Shashen Tofu Pudding", "transport": "Take the Mount Baiyun Cable Car to Summit Park Station, exit and walk for about 2 minutes"}, {"address": "Inside Jiulongquan Scenic Area, Mount Baiyun Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.4 Stars | Situated right beside the Jiulong Spring (Nine Dragons Spring) attraction, this is one of Mount Baiyun\u0027s oldest tea houses. The main highlight here is brewing famous Lingnan teas using water from the renowned Jiulong mountain spring, served alongside traditional Cantonese dim sum. Signature items include the \u0027Mountain Spring Water Har Gow (Shrimp Dumplings),\u0027 featuring paper-thin skin and juicy, bouncy shrimp filling, and the \u0027Siu Mai,\u0027 packed with savory, tender meat. Guests can sip sweet spring-water tea while savoring rich steamed dim sum among lush greenery, experiencing authentic Cantonese \u0027Yum Cha\u0027 culture\u2014a favorite among local regulars and culture enthusiasts.", "name": "Jiulongquan Tea House", "transport": "Take the scenic sight-seeing bus to Jiulongquan Station and walk for about 1 minute"}, {"address": "Inside Summit Park, Mount Baiyun Scenic Area, Baiyun District, Guangzhou City", "feature": "\u2b50 4.2 Stars | Nestled amidst the lush greenery of Mount Baiyun, Luyi Tea House is a traditional classic tea house showcasing distinctive Lingnan garden architecture. The star dish, \u0027Pan-fried Turnip Cake,\u0027 has a golden, crispy exterior with a soft, dense interior, featuring sweet shredded radish and aromatic cured meats; the \u0027Guilinggao (Herbal Jelly)\u0027 offers a pleasant bittersweet herbal note served with rich condensed milk, rendering it silky and refreshing. Its cozy outdoor seating allows visitors to unwind in nature while savoring authentic Cantonese traditional snacks and afternoon tea.", "name": "Luyi Tea House, Mount Baiyun", "transport": "Take the Mount Baiyun Cable Car to Summit Park, then walk about 5 minutes"}, {"address": "Inside Mingchungu Scenic Area, Mount Baiyun, Baiyun District, Guangzhou City", "feature": "\u2b50 4.1 Stars | Located at the entrance of Mingchungu Scenic Area, this long-standing, spacious traditional Cantonese restaurant is famous for authentic mountain-style Cantonese cuisine. The signature \u0027Crispy Roasted Goose\u0027 features thin, glass-like crackling skin that bursts with rich goose fat, offering tender, succulent meat; another hit, the \u0027Mountain Spring Water Steamed Chicken,\u0027 uses Qingyuan free-range chicken, praised for its firm skin, flavorful texture, and rich chicken aroma. Combining panoramic summit views with generous portions and authentic Cantonese flavors, it is an ideal choice for family gatherings and tour groups.", "name": "Mingchungu Summit Restaurant", "transport": "Take the Mount Baiyun Cable Car to Summit Station, exit and walk for about 3 minutes"}, {"address": "Next to the Observation Deck in Summit Park, Mount Baiyun, Baiyun District, Guangzhou City", "feature": "\u2b50 4.3 Stars | Blessed with a prime panoramic viewpoint and decades of consistent dim sum quality, Wangjing Tea House is a highly popular landmark on Mount Baiyun. The signature \u0027Liwan Sampan Congee\u0027 features piping-hot broth poured over raw fish slices, shredded squid, jellyfish, and peanuts, creating a velvety congee base packed with rich flavors and delightful textures. The \u0027Steamed BBQ Pork Buns (Char Siu Bao)\u0027 are fluffy and split open naturally at the top, filled with a rich, balanced sweet-and-savory filling. Here, visitors can overlook the Guangzhou city skyline while relishing piping-hot, authentic Cantonese congee and dim sum.", "name": "Wangjing Tea House, Mount Baiyun", "transport": "Take the Mount Baiyun Cable Car to Summit Park, then walk to the Observation Deck"}, {"address": "South slope section near the West Gate of Mount Baiyun, Baiyun District, Guangzhou City", "feature": "\u2b50 4.4 Stars | Yunshan Tofu Village is an established specialty shop renowned for traditional soy-based snacks, carrying on decades of stone-ground soy milk and tofu pudding crafting techniques. The signature \u0027Red Bean Paste Tofu Pudding\u0027 tops silky tofu pudding with smooth, creamy red bean paste, creating a wonderful interplay of rich soy flavor and sweet red bean notes with an exceptionally velvety mouthfeel. The \u0027Stuffed Pan-fried Tofu\u0027 is crispy outside and silky inside, absorbing savory meat juices into soft, delicate tofu. Known for high-quality artisanal ingredients and generous portions, it continues to earn rave reviews from hikers and travelers alike.", "name": "Yunshan Tofu Village", "transport": "Enter through the West Gate of Mount Baiyun and walk along the footpath for about 10 minutes"}, {"address": "Inside Taohuajian Scenic Area, Mount Baiyun, Baiyun District, Guangzhou City", "feature": "\u2b50 4.2 Stars | Set within the peaceful and scenic Taohuajian (Peach Blossom Stream) area, this famous establishment combines traditional tea ceremony arts with classic Lingnan dim sum. The signature \u0027Osmanthus Cake\u0027 is crystal clear with a springy, refreshing texture, releasing subtle osmanthus floral aromas and honey sweetness with every bite. The \u0027Mountain Spring Water Put Tsai Ko (Steamed Rice Cake)\u0027 is delightfully chewy, perfectly sweetened, and non-sticky. Strolling through this valley reminiscent of a mythical peach blossom paradise, stopping to enjoy handcrafted tea snacks and freshly brewed tea provides a truly relaxing culinary escape.", "name": "Taohuajian Tea House", "transport": "Take the scenic sight-seeing bus to Taohuajian Station and walk for about 2 minutes"}], "name": "Local Traditional Classics"}, "cat_2": {"items": [{"address": "Inside Mingchun Valley Scenic Area, Baiyun Mountain Scenic Area, Guangyuan Middle Road, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Nestled on the hillside of Baiyun Mountain inside the Mingchun Valley Scenic Area, offering magnificent views of lush green forests. It serves refined espresso drinks alongside freshly baked European brunch breads, with single-origin pour-overs and classic croissants highly recommended. Sitting on the outdoor terrace as sunlight filters through the trees, enjoying aromatic coffee amidst birdsong and blossoms, pairing layered pastries with smooth lattes makes this a favorite spot for hikers and influencers.", "name": "Starbucks Coffee (Baiyun Mountain Mingchun Valley Branch)", "transport": "Take Guangzhou Metro Line 2 to Baiyun Park Station, then transfer to a bus or cable car and get off at Mingchun Valley Station."}, {"address": "Peak of Moxing Ridge Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located at the peak of Moxing Ridge, the highest point of Baiyun Mountain, this is one of the highest-altitude cafes in Guangzhou. The cafe specializes in fresh hand-drip coffee and artisanal brunch sandwiches. Enjoy a deep-roast Americano with rich smoky cocoa notes as a cool breeze blows, paired with a crispy, savory ham and cheese panini. It\u0027s an iconic spot for visitors to admire sunset and gaze out over Guangzhou\u0027s breathtaking skyline.", "name": "Moxing Ridge Summit Peak Cafe", "transport": "Take a sightseeing bus from Baiyun Mountain South Gate to Moxing Ridge Ropeway Station, then hike up for about 10 minutes."}, {"address": "Inside Yuntai Garden, No. 80 Guangyuan Middle Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated inside Yuntai Garden at the foot of Baiyun Mountain, right next to elegant European flower beds and fountains. The brunch menu features floral themes, featuring delicious waffles crisp on the outside and soft within, loaded with rich milky aroma. Paired with fresh seasonal fruits and a signature rose latte, it delivers a gentle sweetness with an elegant floral fragrance. The dreamlike ambiance draws crowds for photo ops and local families looking for a relaxing afternoon.", "name": "Yuntai Garden Shadow of Flowers Cafe", "transport": "Take bus 24, 63, or 285 to Yuntai Garden Bus Terminal, then walk for about 3 minutes."}, {"address": "Inside Luhu Park, No. 11 Luhu Road, Yuexiu District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.8 Stars | Set beside Luhu Lake Park on the southern foot of Baiyun Mountain, this spot seamlessly merges Lingnan garden charm with modern coffee brunch culture. It serves unique Cantonese dim sum alongside specialty cold brews\u2014soft salted egg yolk lava buns burst with rich flavor, creating a stunning taste contrast with the pleasantly bittersweet cold brew. Sitting inside the lakeside glass house enjoying views of sparkling waters and mountains makes it a top choice for a slow morning.", "name": "Luming Restaurant Lakefront Cafe \u0026 Brunch", "transport": "Take Metro Line 5 to Xiaobei Station (Exit C), then take a 5-minute taxi ride or walk for 15 minutes."}, {"address": "Inside Yunxi Botanical Garden, No. 1038 Baiyun Avenue South, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.4 Stars | Tucked away inside the natural oxygen bar of Yunxi Botanical Garden on the western slopes of Baiyun Mountain, surrounded by rare plants and cascading streams. Renowned for house-roasted single-origin beans and light, healthy brunch meals. The signature avocado smoked chicken toast boasts crispy bread and creamy avocado, perfectly paired with a bright, fruity Kenyan pour-over coffee to refresh your senses. Enjoying delicious food surrounded by phytoncides makes for a sublime eco-dining experience.", "name": "Yunxi Botanical Garden Greenery Cafe", "transport": "Take Metro Line 2 to Baiyun Park Station (Exit B), then walk for about 10 minutes."}, {"address": "Next to Huangpodong Reservoir, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.5 Stars | Situated along the shores of Huangpodong Reservoir near the Zhuxi Scenic Area on Baiyun Mountain, offering peaceful, Swiss-like mountain and lake views. The cafe specializes in Aussie flat whites and artisanal Eggs Benedict. Slicing open the soft-poached egg lets rich yolk coat the toasted English muffin, resulting in a velvety, mouthwatering bite. Gazing at the mountain reflections over coffee makes this a highly popular hidden gem for relaxing and recharging after a hike.", "name": "Huangpodong Reservoir Waterfront Cafe", "transport": "Enter through Baiyun Mountain West Gate and take the scenic electric sightseeing shuttle to Huangpodong Reservoir Station."}, {"address": "Summit Square, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.3 Stars | Located at Summit Square\u2014the liveliest hub on Baiyun Mountain\u2014featuring an expansive terrace overlooking the skyscraper skyline of Zhujiang New Town. The brunch highlights freshly baked hazelnut French toast and signature coconut lattes. The fluffy, buttery French toast pairs amazingly with tropical notes of coconut milk and espresso. It\u0027s a favorite sunny haven for early morning hikers and afternoon sightseers alike.", "name": "Summit Square Scenic Cafe", "transport": "Take the cable car from Baiyun Mountain South Gate directly to Summit Park Station, then walk for about 2 minutes."}, {"address": "Inside Times TIT Plaza, No. 788 Baiyun Avenue South, Baiyun District, Guangzhou, Guangdong Province", "feature": "\u2b50 4.6 Stars | Set within a creative industry park at the base of Baiyun Mountain, housed in a high-ceiling standalone retro industrial-style building. Famous among young crowds for great value American-style waffle brunch towers and fresh fruit dutch cold brew. Waffles are made-to-order, golden crisp on the outside and warm inside, served with maple syrup, while the cold brew offers refined winy and fruity notes. The spacious, comfortable vibe is perfect for taking a break or meeting up with friends.", "name": "Maan Coffee (Times TIT Plaza Branch)", "transport": "Take Metro Line 2 to Baiyun Cultural Square Station (Exit A), then walk for about 12 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Shuangxi Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | Nestled halfway up Baiyun Mountain, this century-old Cantonese restaurant boasts a tranquil, lush setting. Famous for its \u0027Mountain Spring Tofu Pudding\u0027 and \u0027Baiyun Pork Trotters\u0027\u2014the ultra-smooth tofu pudding melts in your mouth with subtle sweet spring water notes, while the pork trotters are crisp, tender, and refreshing after being soaked in mountain spring water. It\u0027s a favorite spot for hikers and local foodies alike to enjoy authentic Cantonese morning tea and local delicacies.", "name": "Shuangxi Restaurant", "transport": "Take the Baiyun Mountain Cable Car or Sightseeing Bus to Shuangxi Station, then walk for about 3 minutes."}, {"address": "Next to Jiulongquan, Mountain Top Square, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 Stars | Located in the heart of the Mountain Top Square next to the famous Jiulongquan Ancient Well. The restaurant specializes in traditional Cantonese dishes cooked with sweet mountain spring water. The classic \u0027Spring Water Poached Chicken\u0027 features golden, crispy skin and tender, juicy meat that pairs perfectly with ginger-scallion dip. Outdoor seating offers panoramic views of Guangzhou\u0027s skyline\u2014ideal for enjoying a craft beer paired with flavorful local stir-fries in the evening.", "name": "Jiulongquan Restaurant", "transport": "Take the Baiyun Mountain Sightseeing Bus to Mountain Top Square Station, then walk for about 2 minutes."}, {"address": "No. 92 Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.7 Stars | Located near the South Gate of Baiyun Mountain, this is Guangzhou\u0027s most famous historic mutton restaurant with decades of history. Its signature \u0027Deep-Fried Young Pigeon with Mutton\u0027 and \u0027Secret Poached Mutton\u0027 are sublime, completely free of any gamey odor, offering tender, gelatinous meat paired with a proprietary sauce. Combining modern decor with traditional dining, it features a wine bar serving special rice wine and select wines, drawing legions of food enthusiasts.", "name": "Xinxing Restaurant", "transport": "Take Metro Line 2 to Feixiang Park Station, transfer to a bus to Guangyuan Passenger Transport Station, and walk for about 5 minutes."}, {"address": "Inside Mingquan Ju Resort, No. 1068 Baiyun Avenue South, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 Stars | A luxury scenic bistro hidden amidst the lake and mountain scenery at the foot of Baiyun Mountain. It blends modern Lingnan garden architecture with refined local fusion cuisine. Highlights include \u0027Stir-Fried Wagyu Beef with Truffle \u0026 Lily Bulbs\u0027 and \u0027Pan-Seared Black Pepper Abalone\u0027. The lakeside outdoor bar serves craft cocktails infused with local fruits like lychee and wampee, making it the perfect nighttime retreat from the city.", "name": "Mingquan Ju Lakefront Bistro", "transport": "Take Metro Line 2 to Baiyun Park Station, then take a taxi for about 8 minutes."}, {"address": "No. 1 Yunfeng Road, Mountain Top Square, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.4 Stars | A trendy scenic bistro perched high on Baiyun Mountain, offering breathtaking panoramic views of Guangzhou\u0027s night skyline. The menu features creative Lingnan dishes and gourmet light bites, such as crispy \u0027Deep-Fried Pork Intestines\u0027 and rich \u0027Red Wine Braised Beef Brisket\u0027. As night falls, live soft music plays alongside a great selection of craft beers and signature cocktails, making it a favorite for young travelers and couples.", "name": "Yunshan Tingtao Mountain View Bistro", "transport": "Take the Baiyun Mountain Cable Car to the Mountain Peak Station, then walk for about 5 minutes."}, {"address": "Next to Taohuajian Scenic Area, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.2 Stars | An ancient-style local restaurant designed like a hidden paradise, blending seamlessly with the surrounding landscape. The signature \u0027Taihe Fruitwood Roasted Chicken\u0027 is roasted over fruitwood, producing a crispy golden skin and juicy, flavorful meat. Pair it with the rich \u0027Spring Water Stewed Sea Snail Soup\u0027. The house-brewed Peach Blossom Honey Wine and Green Plum Wine are smooth and mellow, pairing wonderfully with savory local stir-fries.", "name": "Taohuayuanji Ancient Style Restaurant", "transport": "Take the Baiyun Mountain Sightseeing Bus to Taohuajian Station."}, {"address": "No. 11 Luhu Road, Luhu Park, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | A renowned scenic lakefront bistro next to Luhu Park at the southern foot of Baiyun Mountain, offering an elegant, peaceful urban oasis. It features high-end local Cantonese cuisine and creative food-wine pairings. Must-try dishes include elastic \u0027Pan-Seared Hand-Beaten Cuttlefish Cakes\u0027 and tender \u0027Traditional Stewed Fish Head in Claypot\u0027. Enjoy a signature Lingnan cold brew coffee or fine wine on the lakeside terrace while admiring the view.", "name": "Green Ripples Lakefront Restaurant", "transport": "Take Metro Line 5 to Xiaobei Station Exit C, then take a taxi for about 5 minutes."}, {"address": "No. 18 Guangyuan Middle Road, Baiyun District, Guangzhou (near Baiyun Mountain South Gate)", "feature": "\u2b50 4.3 Stars | A famous historic Cantonese restaurant offering casual dining known for great value and authentic flavor. The signature \u0027Zhuxi Roasted Goose\u0027 features chip-thin crispy skin and juicy meat served with sweet-and-sour plum sauce. The \u0027Steamed Pork Ribs with Garlic and Black Bean Sauce\u0027 are tender and succulent. The bustling, lively atmosphere makes it a local favorite for family gatherings and beer-and-stir-fry nights.", "name": "Zhuxi Restaurant - Baiyun Mountain Villa", "transport": "Take Metro Line 2 to Feixiang Park Station, transfer to a bus to Guangyuan Middle Road Station, and walk over."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Next to Nengren Temple, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 stars | Located next to the famous ancient Nengren Temple within the Baiyun Mountain Scenic Area, this restaurant enjoys an exceptional \u0027natural oxygen bar\u0027 environment. Its signature dishes, \u0027Arhat\u0027s Delight\u0027 (Luohan Zhai) and \u0027Mountain Spring Stewed Delicacies Soup\u0027, use premium high-altitude mushrooms and fresh tofu. The broth is sweet and refreshing, the tofu melts in your mouth, and the smooth, tender mushrooms carry a subtle sweetness from mountain spring water. Highly recommended by hikers and local devotees alike, it is the top choice to experience Zen serenity and healthy vegetarian cuisine.", "name": "Nengren Temple Vegetarian Restaurant", "transport": "Take the Baiyun Mountain Scenic Sightseeing Bus to Nengren Temple Station, then walk about 2 minutes."}, {"address": "Next to the Tourist Service Center, Moxing Ridge Scenic Area, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 stars | Located right next to the Moxing Ridge scenic area, this specialty restaurant focuses on high-altitude organic plant-based dishes and nourishing hot pots. The signature \u0027Fresh Bamboo Shoots \u0026 Vegetarian Delicacy Claypot\u0027 features local Baiyun Mountain bamboo shoots and dried tofu skin; the shoots are crisp and juicy, while the tofu skin absorbs the rich, flavorful broth for complex layers. Tourists love dining here after reaching the summit, enjoying light, non-greasy plant-based delicacies while taking in panoramic skyline views of Guangzhou city.", "name": "Yunshan Oasis Vegetarian Restaurant", "transport": "Take the Baiyun Mountain Cable Car to Peak Square, transfer to a small sightseeing shuttle to Moxing Ridge, and walk from there."}, {"address": "No. 1028 Baiyun Avenue South, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 stars | Situated near the western foothills of Baiyun Mountain, Yixin Vegetarian is a renowned high-end Zen-themed vegetarian brand in Guangzhou. Highlights include the \u0027Black Truffle Fried Rice\u0027 and \u0027Crispy Vegetarian Roast Duck\u0027. The \u0027duck\u0027 skin is delightfully crispy and fragrant, while the savory filling\u2014crafted from bean curd sheets and shredded shiitake mushrooms\u2014offers a firm, chewy texture with a smoky soy aroma. Its refined landscaping and meticulous ingredients make it a magnet for health-conscious young urbanites and business gourmands.", "name": "Yixin Vegetarian (Baiyun Avenue Branch)", "transport": "Take Metro Line 2 to Baiyun Park Station (Exit B) and walk about 12 minutes."}, {"address": "Near the South Gate entrance of Baiyun Mountain, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.2 stars | Located near the South Gate of Baiyun Mountain and Yuntai Garden, this spot serves affordable, high-quality traditional Cantonese vegetarian dishes and light meals. The \u0027Crispy Taro Pastry\u0027 features a golden, crunchy exterior filled with dense, fragrant taro paste that hits the perfect balance of sweet and savory without sticking to your teeth. The \u0027Lotus Leaf Vegetable Rice\u0027 emits a subtle, delightful botanical fragrance. Generous portions and budget-friendly prices make it a favorite among regular local hikers and visitors.", "name": "Miaoxianglin Vegetarian Restaurant", "transport": "Take Bus 24, 63, or 240 to Yuntai Garden Bus Terminal and walk about 3 minutes."}, {"address": "No. 13 Luhu Road, Yuexiu District, Guangzhou (Near Luhu Park at the southern foot of Baiyun Mountain)", "feature": "\u2b50 4.4 stars | Nestled around Luhu Park at the foot of Baiyun Mountain, this restaurant offers an elegant and tranquil setting. Must-tries include the \u0027Matsutake \u0026 Bamboo Fungus Soup\u0027 and \u0027Stir-fried Diced Vegetables with Dragon Fruit and Lily Bulbs\u0027. The soup is crystal clear yet packed with umami, featuring crunchy bamboo fungus infused with broth, while the lily bulbs and fresh fruits lend a gentle natural sweetness. Its warm vegetarian atmosphere and delicate handcrafted dishes make it the perfect post-hike gathering spot for families.", "name": "Shuxiangge Vegetarian Restaurant", "transport": "Take Bus 109, 110, or 184 to Luhu Park Station and walk about 5 minutes."}, {"address": "No. 188 Guangyuan East Road, Baiyun District, Guangzhou (Next to Yunshan Cable Car Station)", "feature": "\u2b50 4.5 stars | Located near the lower station of the Baiyun Mountain Cable Car, this restaurant seamlessly blends tea culture with exquisite vegetarian cuisine. Must-orders are the \u0027Handcrafted Purple Sweet Potato \u0026 Yam Cake\u0027 and \u0027Jade Steamed Vegetarian Dumplings\u0027. The purple sweet potato cake has a fine, melt-in-your-mouth texture, while the translucent steamed dumplings are packed with crunchy wood ear mushrooms and juicy shredded carrots. The classic, elegant garden scenery and wellness teas offer travelers a serene double indulgence of peace and gastronomy after a day\u0027s stroll.", "name": "Shuimulianhua Vegetarian Hall", "transport": "Take Bus 127, 175, or 285 to Baiyun Cable Car Station and walk about 2 minutes."}, {"address": "Near the West Gate of Baiyun Mountain, Huangshi East Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 stars | Situated in the commercial district outside the West Gate of Baiyun Mountain, this place is famous for fusing Hong Kong-style dim sum with nourishing vegetarian cooking. Highly recommended are the \u0027Vegetarian Honey BBQ Pork Buns\u0027 and \u0027Crystal Truffle Wild Mushroom Dumplings\u0027. The buns are soft and pillowy, filled with soy protein drenched in a rich, sweet-and-savory sauce that tastes surprisingly authentic without being greasy. Offering fantastic value for money and a creative dim sum menu, it enjoys strong support from locals and plant-based foodies alike.", "name": "Fanyin Suxin Zhai", "transport": "Take Metro Line 2 to Xiaogang Station (Exit A), then take a taxi for about 5 minutes."}, {"address": "No. 880 Baiyun Avenue South, Baiyun District, Guangzhou", "feature": "\u2b50 4.1 stars | An immensely popular, budget-friendly vegetarian buffet near Baiyun Mountain, serving over a hundred varieties of hot dishes, snacks, and desserts daily. The hit \u0027Freshly Fried Salt \u0026 Pepper Mushrooms\u0027 are crispy outside and juicy inside, bursting with flavor with every bite, while the \u0027Wood Ear \u0026 Red Date Sweet Soup\u0027 is light and nourishing. The incredible variety and wallet-friendly pricing make it a hit with hungry hikers coming off the mountain and sightseers alike.", "name": "Cimanting Vegetarian Buffet", "transport": "Take Metro Line 2 to Baiyun Park Station and walk about 8 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Stall at Peak Square, Baiyun Mountain Scenic Area, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.6 Stars | Hand-ground using premium Baiyun Mountain spring water, this tofu pudding is ultra-silky and melts in your mouth. Rich with pure soybean aroma, it is served with traditional brown sugar syrup or osmanthus honey. Sweet without being cloying, it\u0027s a refreshing, classic walk-and-eat dessert that every hiker reaching the summit must try.", "name": "Baiyun Mountain Water Tofu Pudding", "transport": "Take the Baiyun Mountain Cableway to Peak Park Station, then walk for about 3 minutes."}, {"address": "Food stall near Mingchun Valley, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.5 Stars | Crafted from rich buffalo milk, the Double Skin Milk features a fragrant top skin layer and a silky smooth custard underneath. The Ginger Milk Curd is freshly set to order; the zest of fresh ginger juice perfectly balances the rich sweetness of milk. Warm and soothing, it\u0027s an ideal traditional sweet treat to replenish your energy during a mountain hike.", "name": "Shawan Dessert Stall - Ginger Milk Curd \u0026 Double Skin Milk", "transport": "Take the scenic area shuttle bus to Mingchun Valley Station and walk for about 2 minutes."}, {"address": "Snack Kiosk beside Nengren Temple, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 Stars | Located beside the thousand-year-old Nengren Temple, this kiosk specializes in made-to-order fried vegetarian spring rolls and handmade radish cakes. The spring rolls are golden and super crispy, stuffed with savory shiitake mushrooms and wood ear fungus, while the radish cake is dense, soft, and naturally sweet. A favorite snack for both vegetarians and tourists.", "name": "Nengren Temple Vegetarian Snacks - Spring Rolls \u0026 Radish Cake", "transport": "Walk along the main path from the South Gate of Baiyun Mountain to Nengren Temple, about a 25-minute walk."}, {"address": "Food Market, Peak Square, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.1 Stars | You can smell the irresistible aroma of grilled savory meat and sweet barbecue from afar. The sausages have a light crispy charred casing that bursts with flavor in every bite, while the sweet corn is brushed with special butter and grilled to juicy perfection. A highly popular grab-and-go snack for mountain trekkers.", "name": "Peak Square Roasted Sausages \u0026 Sweet Corn", "transport": "Take the Baiyun Mountain Cable Car to Peak Park; the stall is located right in the central plaza market area."}, {"address": "Rest Pavilion, Mingzhu Tower Scenic Area, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.4 Stars | Slow-cooked according to traditional Lingnan recipes, this herbal jelly (Guilinggao) offers a subtle herbal aroma with a slightly bitter undertone and a springy, smooth texture. Paired with condensed milk or honey, it creates a delightfully balanced bittersweet taste. Known for cooling heat and detoxifying, it\u2019s a popular cooling treat during hot summer hikes.", "name": "Lingnan Herbal Jelly Stall", "transport": "Enter through the West Gate of Baiyun Mountain, take the scenic shuttle bus, and get off at Mingzhu Tower Station."}, {"address": "Next to South Gate Entrance of Baiyun Mountain, Guangyuan Middle Road, Baiyun District, Guangzhou", "feature": "\u2b50 4.7 Stars | A famous line-worthy spot at the foot of the mountain! Using rice milk ground fresh with traditional stone mills, these steamed rice rolls are paper-thin, silky, and delightfully springy. Filled with fresh shrimp or seasoned pork and drizzled with a secret sweet soy sauce, it\u0027s an essential Cantonese street delicacy before or after your hike.", "name": "Baiyun Mountain Foot Stone-ground Changfen", "transport": "Take Bus 24, 63, or 285 to Baiyun Cableway Station, then walk about 100 meters."}, {"address": "Food Street, Mingchun Valley Area, Baiyun Mountain, Baiyun District, Guangzhou", "feature": "\u2b50 4.2 Stars | Slowly roasted in traditional clay urns, these red-fleshed sweet potatoes bake until dripping with natural sugary honey syrup. Crispy and fragrant on the outside, ultra-soft and fluffy on the inside, they are packed with rich flavor and dietary fiber. Holding a steaming sweet potato while strolling through the forest trail offers a heartwarming nostalgic treat.", "name": "Mingchungu Honey Roasted Sweet Potato", "transport": "Take the cableway from the South Gate to the summit, then walk towards Mingchun Valley for about 5 minutes."}, {"address": "Rest Area, Baiyun Evening View Point, Baiyun Mountain Scenic Area, Baiyun District, Guangzhou", "feature": "\u2b50 4.3 Stars | A quintessential icon of Guangzhou\u0027s traditional \u0027bitter tea\u0027 culture, offering signature infusions like 24-Flavors Tea, Bansha Herbal Tea, and Imperatae Cane Drink. The Imperatae Cane Drink is sweet and refreshing to quench thirst, while traditional herbal teas start with a bitter bite and leave a pleasant sweet aftertaste. Highly popular among travelers eager to experience authentic local culture.", "name": "Traditional Cantonese Liangcha Herbal Tea Shop", "transport": "Walk about 8 minutes from Peak Square toward the Baiyun Evening View Observation Deck."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Baiyun Mountain Natural Scenic Area"}, "beijing_lu_yuexiu": {"categories": {"cat_1": {"items": [{"address": "No. 342 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Founded in 1885, Taipingguang is the first Chinese-operated Western restaurant in Guangzhou, rich with over a century of history. It is famous for its \u0027Premier Set Menu\u0027 and \u0027Mrs. Premier Set Menu\u0027, commemorating where Premier Zhou Enlai and Deng Yingchao famously dined. The signature \u0027Roast Pigeon\u0027 features crispy skin and tender, juicy meat that bursts with flavor, while the \u0027Snow Mountain Flying Lake\u0027 (Baked Alaska) offers a delightful contrast of hot outside and cold ice cream inside. Loved by locals of all generations and visiting tourists, it is an essential historic brand for experiencing Cantonese-style Western cuisine.", "name": "Taipingguang Restaurant", "transport": "About 5 minutes\u0027 walk from Gongyuanqian Station or Beijing Road Station on Metro Line 1 or Line 6"}, {"address": "No. 160-1 Wenming Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Located on Wenming Road, Dayang Original Stew is the most iconic long-queue double-boiled soup shop in Guangzhou\u0027s Old Town. The star dish, \u0027Stewed Silky Fowl in Whole Coconut\u0027, combines black-boned chicken, goji berries, and red dates slow-steamed inside a whole coconut. The broth is exceptionally clear and sweet, perfectly harmonizing natural coconut aroma with rich chicken flavor, while the meat is steamed until meltingly tender. Nourishing soups are central to Cantonese wellness; this comforting delicacy offers an authentic taste of Lingnan food culture and is passionately loved by locals and tourists alike.", "name": "Dayang Stew", "transport": "About 6 minutes\u0027 walk from Exit B of Beijing Road Station on Metro Line 6"}, {"address": "No. 403 Huifu East Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Located on Huifu East Road, Qiaomei Noodle House is a benchmark for traditional Cantonese bamboo-pressed (Jook-sing) noodles in Guangzhou. Its most eye-catching offering is the \u0027Five-Treasure Wonton Noodles\u0027, allowing you to sample five distinct fillings in a single bowl: abalone, fresh shrimp, crab roe, lean pork, and fresh minced pork. The noodles are kneaded using traditional bamboo logs, making them incredibly springy and chewy, while the rich soup base is slow-simmered from flounder, pork bones, and shrimp roe. This signature texture and layered umami keep local foodies coming back year after year.", "name": "Qiaomei Noodle House", "transport": "About 7 minutes\u0027 walk from Exit D of Gongyuanqian Station on Metro Line 1 or Line 6"}, {"address": "No. 210 Wenming Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Founded in 1986, Baihua Dessert Shop is the grand pioneer of Wenming Road\u0027s famous \u0027Dessert Street\u0027. Its extensive menu features over a hundred traditional Cantonese sweet soups (tong sui). The highly recommended \u0027Phoenix Egg Custard\u0027 melts effortlessly in your mouth, coating the palate with a rich, balanced egg and milk aroma; options like \u0027Three Treasures Egg Milk\u0027 and \u0027Red Bean Soup\u0027 are equally silky, sweet, and generously portioned. No matter the season, crowds gather outside enjoying desserts and lively chats, showcasing the true essence of local Guangzhou life.", "name": "Baihua Dessert Shop", "transport": "About 8 minutes\u0027 walk from Exit B of Beijing Road Station on Metro Line 6"}, {"address": "No. 417 Huifu East Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Tucked away in an alley off Huifu East Road, Fulin Restaurant is a legendary home-style Cantonese dining institution in Guangzhou\u0027s Old Town. Its signature \u0027Crispy Pork Knuckle\u0027 features crackling, golden-fried skin wrapping around rich, collagen-packed tender meat, paired with a secret dipping sauce that prevents any grease feeling. The \u0027Poached Beef\u0027 is silky and tender, showcasing master-level Cantonese control over heat and cooking precision. Filled with authentic old-city atmospheric charm, its incredible flavors and value draw steady crowds of regulars and food lovers every day.", "name": "Fulin Restaurant", "transport": "About 6 minutes\u0027 walk from Exit D of Gongyuanqian Station on Metro Line 1"}, {"address": "No. 519 Huifu East Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.1 stars | Established in the 1950s, Yinji Changfen is famous across Guangzhou for rice rolls praised as \u0027white as jade, thin as paper, smooth as silk, and pleasantly chewy\u0027. This branch on Huifu East Road preserves the traditional cloth-steamed technique. The signature \u0027Supreme Cloth-Steamed Rice Roll\u0027 and \u0027Fresh Shrimp \u0026 Beef Rice Roll\u0027 showcase paper-thin rice sheets with wonderful elasticity wrapped around tender beef and plump shrimp, drizzled with special sweet soy sauce. Every bite is silky, flavorful, and aromatic\u2014an absolute must-try traditional dim sum snack for visitors to Guangzhou.", "name": "Yinji Changfen - Huifu East Road Branch", "transport": "About 5 minutes\u0027 walk from Exit J of Gongyuanqian Station on Metro Line 1 or Line 6"}, {"address": "5th Floor, GD Landmark Plaza, No. 168 Beijing Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Dating back to the Guangxu reign of the Qing Dynasty (1880), Tao Tao Ju is one of Guangzhou\u0027s most famous century-old teahouses. The location on Beijing Road Pedestrian Street beautifully fuses traditional Lingnan stained-glass Manchurian windows with modern elegance. Highlights include the \u0027Tao Tao Ju Giant Shrimp Dumplings\u0027, stuffed generously with fresh, snappy shrimp inside delicate wrappers, and the \u0027Steamed Pineapple Buns with Buffalo Milk\u0027, featuring a sweet crispy crust bursting with warm, silky buffalo milk lava upon first bite. Top-grade dim sum quality and authentic morning tea culture make this a premier destination for local family gatherings and culinary pilgrimages.", "name": "Tao Tao Ju - Beijing Road Branch", "transport": "About 3 minutes\u0027 walk from Exit A of Beijing Road Station on Metro Line 6"}, {"address": "No. 218 Wenming Road, Yuexiu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Situated right next to Baihua Dessert Shop, Rose Dessert is another long-established traditional Cantonese sweet soup house on Wenming Road. Though cozy and small, the shop warmingly exudes nostalgic Old Guangzhou charm. The signature \u0027Almond Tofu\u0027 is silky-smooth with a gentle almond aroma, often served alongside rich black sesame paste for a double layer of flavor; the \u0027Mango Sago\u0027 offers a delightfully refreshing sweet-and-tangy treat. Adhering strictly to fresh handmade cooking, moderate sweetness, and zero artificial additives, its refined tastes and friendly service have won over generations of dessert enthusiasts.", "name": "Rose Dessert", "transport": "About 8 minutes\u0027 walk from Exit B of Beijing Road Station on Metro Line 6"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 225 Beijing Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.6 stars | As an iconic local specialty coffee brand in Guangzhou, this cozy storefront near Beijing Road Pedestrian Street always draws a crowd. Their signature Americano and specialty lattes use medium-dark roast beans, featuring rich dark chocolate and nutty aromas with a smooth, lingering malt sweetness. Paired with freshly baked, extra-crispy croissants\u2014shatteringly flaky on the outside and soft, buttery, and honeycomb-textured inside. A favorite among young local professionals and tourists alike, it\u0027s the ultimate stop for a quick caffeine fix while shopping.", "name": "store by .jpg (store by .jpg Beijing Road)", "transport": "Walk about 8 minutes from Exit D of Gongyuanqian Station (Metro Lines 1/2)"}, {"address": "No. 451 Huifu East Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Located on the foodie hub of Huifu East Road, this cafe blends industrial chic with vintage elements. It specializes in unique specialty coffee drinks and exquisite handcrafted brunch. Try the signature \u0027Rescue Specialty Latte,\u0027 which cleverly combines Xinhui dried tangerine peel\u2014a local Guangzhou specialty\u2014with cold brew coffee. The palate is greeted first by citrusy aromas and sweet tangerine peel notes, followed by subtle acidity and a rich, lingering sweetness from the coffee beans. Brunch offerings like the Eggs Benedict Toast feature runny poached eggs coated in rich hollandaise sauce, perfectly complemented by a fresh, appetizing salad.", "name": "RESCUE COFFEE", "transport": "Walk about 5 minutes from Exit J of Gongyuanqian Station (Metro Lines 1/2)"}, {"address": "No. 13 Qiaoguang West Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.7 stars | Situated near Haizhu Square and the Pearl River, Hay Coffee boasts fantastic natural light and minimalist Nordic decor. Their pour-over coffee features selected single-origin beans, ranging from light-roasted Ethiopian floral and fruity notes to medium-roasted Colombian caramel flavors. The must-try full brunch set includes French toast that is crispy outside and soft inside, golden crispy bacon, and German sausages packed with buttery richness and savory juices. It\u0027s a fantastic spot where locals love spending lazy weekend mornings unwinding.", "name": "Hay Coffee", "transport": "Walk about 3 minutes from Exit F of Haizhu Square Station (Metro Lines 2/6)"}, {"address": "No. 9 Miaoqian West Street, Shuqian Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.8 stars | Housed in a century-old red-brick mansion tucked away among the historic Western-style houses of Dongshankou in Yuexiu Old Town, Jueyuan 1984 is a vintage artistic cafe. Furnished with Republican-era antiques and vinyl records, it exudes a rich nostalgic charm. Homemade pancake brunch platters and the signature osmanthus latte are top highlights. The pancakes are crisp on the edges and light as clouds inside, divine when drizzled with pure maple syrup; the osmanthus latte blends delicate floral notes with rich milkiness, harmonizing perfectly with the nostalgic mansion vibe\u2014a trendy landmark popular among influencers and culture lovers.", "name": "Jueyuan 1984 Vintage Cafe \u0026 Brunch", "transport": "Walk about 6 minutes from Exit E of Dongshankou Station (Metro Lines 1/6)"}, {"address": "No. 168 Wenming Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.4 stars | Located near historic Wenming Road, this minimalist cafe integrates modern coffee culture into old Guangzhou neighborhoods. The star dish is the \u0027Phat Kaphrao (Thai Basil Pork) Sandwich Brunch,\u0027 featuring spicy, savory basil pork paired with melted cheese and crispy toasted bread\u2014every bite bursts with flavor, a must-try for bold flavor enthusiasts. Pair it with a refreshing sparkling Americano, where crushed ice and fizz dance on your tongue to clear any richness. Friendly service and localized specialty drinks win high praise from visitors.", "name": "LOCKAL Coffee", "transport": "Walk about 7 minutes from Exit A of Peasant Movement Institute Station (Metro Line 1)"}, {"address": "No. 312 Beijing Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.3 stars | A unique spot blending traditional Cantonese and Hong Kong-style tea drinks with modern specialty coffee. The standout feature is the \u0027Cantonese Joy Latte\u0027, made with high-quality local milk, high-mountain black tea, and espresso, delivering the smooth tea flavor of HK milk tea alongside coffee\u0027s deep, bittersweet notes. Their fresh-baked Pineapple Bun brunch comes stuffed with a thick slice of cold butter; the piping hot, super crispy crust melts the cold butter in a delightful hot-and-cold contrast full of vintage Yuexiu flavor.", "name": "Old Canton Coffee", "transport": "Walk about 5 minutes from Exit D of Gongyuanqian Station (Metro Lines 1/2)"}, {"address": "Chengfang Juluo, No. 225 Beijing Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.6 stars | A specialty coffee brand founded by a team of World Barista Champions, featuring a stylish concept store on Guangzhou\u0027s Beijing Road. Focused on S.O.E (Single Origin Espresso), baristas guide guests through the distinct flavor profile of each bean batch. The popular \u0027Oat Milk Dirty\u0027 presents a striking layered contrast of dark and white; one sip delivers icy, rich oat milk intertwined with the fruity acidity of hot espresso for a silky finish. Paired with freshly made avocado and smoked salmon toast brunch, light and wholesome, it\u0027s a haven for specialty coffee enthusiasts and healthy eaters.", "name": "S.O.E COFFEE (S.O.E Coffee Beijing Road)", "transport": "Walk about 6 minutes from Exit B of Beijing Lu Station (Metro Line 6)"}, {"address": "No. 10 Peizheng Road, Yuexiu District, Guangzhou City", "feature": "\u2b50 4.5 stars | Hidden in the historic architectural area of Dongshankou, Yuexiu, this American vintage brunch eatery serves up generous, authentic American brunch platters featuring freshly griddled pancakes, sunny-side-up eggs, juicy Nuremberg sausages, and golden hash browns. The thick, moist pancakes release a mouthwatering aroma when drizzled with rich butter and honey. Coffee uses medium-roast beans, delivering a clean, crisp iced Americano with a nutty finish. Spaciously comfortable with relaxed American country aesthetics, it\u0027s a favorite weekend gathering spot for families and friends.", "name": "Charlie\u0027s Cafe \u0026 Brunch", "transport": "Walk about 8 minutes from Exit E of Dongshankou Station (Metro Lines 1/6)"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 342 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Founded in 1860, Tai Ping Kwan is the first Chinese-run Western restaurant in Guangzhou, oozing vintage Cantonese-Western fusion charm and nostalgic bistro vibes. The signature \u0027Premier Set Menu\u0027 features tender Swiss Chicken Wings drenched in a sweet-and-savory special sauce, alongside aromatic Baked Portuguese Chicken melted with cheese and curry. Perfectly blending Western fare with local tastes, it is the top choice for experiencing Yuexiu\u0027s history and old-school romance.", "name": "Tai Ping Kwan Restaurant", "transport": "Take Metro Line 1 or 6 to Gongyuanqian Station, Exit D, then walk about 5 minutes."}, {"address": "No. 752 Dongfeng East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | A Michelin-recommended Cantonese restaurant that blends ancient Lingnan aesthetic with modern bistro flair. Famous citywide for its explosive sizzling clay pot (\u0027Jie Jie Bao\u0027) dishes, the signature Sizzling Eel Clay Pot arrives crackling at the table\u2014springy eel tossed in a rich, smoky charred sauce that pairs amazingly with rice. The Sizzling Oyster Clay Pot is equally juicy and fresh. Beloved by locals and tourists alike, it is the ultimate spot to savor authentic Cantonese stir-fries and refined local cuisine.", "name": "Huishijia Restaurant (Dongshan Branch)", "transport": "Take Metro Line 5 to Ouzhuang Station, Exit E, then walk about 8 minutes."}, {"address": "No. 2 Donghu West Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 Stars | A benchmark of local Cantonese dining in Guangzhou, the Haiyin Main Branch elevates traditional regional dishes to high-end bistro quality. The must-order Cold Black BBQ Pork features perfectly balanced fat and lean meat that melts in your mouth, coated in a sweet, caramel-like black sugar sauce. The giant Pineapple Buns have an impossibly flaky crust and a tangy pineapple filling that cuts through richness. With gorgeous presentation, multi-layered flavors, and an elegant ambiance, it is a premier choice for experiencing top-tier Cantonese culinary culture.", "name": "Bingsheng Pinwei (Haiyin Main Branch)", "transport": "Take Metro Line 6 to Donghu Station, Exit B2, then walk about 6 minutes."}, {"address": "No. 451 Huifu East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | An ultra-popular creative Japanese izakaya on Huifu East Road Food Street near Beijing Road, renowned for great value and high-energy vibes. The signature Flame-Torched Salmon Donburi is blowtorched right at your table, creating a burst of savory aroma as melt-in-your-mouth salmon merges with creamy mayo and seasoned rice. The \u0027Exploding Ice Cream\u0027 is eye-catching and layered with textures. Friendly, energetic service keeps crowds of tourists and local youth lining up every day.", "name": "Moda Shitang (Huifu East Road Branch)", "transport": "Take Metro Line 1 or 2 to Gongyuanqian Station, Exit D, then walk about 7 minutes."}, {"address": "4F, Grandbuy Department Store, Teemall, No. 268 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 Stars | The century-old brand Tao Tao Ju brings a fresh look to the Beijing Road shopping area, seamlessly marrying traditional Cantonese dishes with a modern bistro experience. The signature \u0027Century-Old Roasted Goose\u0027 boasts paper-thin crispy skin and tender, succulent meat served with a tangy plum sauce. The Flaky Milk Tarts feature layered, crispy pastry with a rich, silky milk custard. Classic Lingnan decor paired with flavorful regional dishes makes every diner want to stay longer.", "name": "Tao Tao Ju (Beijing Road Branch)", "transport": "Take Metro Line 6 to Beijing Road Station, Exit B, then walk about 3 minutes."}, {"address": "No. 125 Zhongshan 1st Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.2 Stars | A long-standing local favorite in Yuexiu District famous citywide for its signature \u0027Huiai Chicken.\u0027 Prepared using a unique poaching method infused with subtle herbs, the chicken features golden, bouncy skin and delightfully juicy meat dipped in scallion-ginger oil. The Sizzling Large Intestine is smoky, crispy, and packed with wok hei (wok aroma), capturing the truest old Guangzhou flavors.", "name": "Huiai Restaurant (Zhongshan 1st Road Branch)", "transport": "Take Metro Line 1 or 5 to Yangji Station, Exit A, then walk about 4 minutes."}, {"address": "No. 85 Panfu Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.1 Stars | A classic Cantonese open-air eatery (Dai Pai Dong) and local staple in Yuexiu District that comes alive at night with vibrant local nightlife energy. Signature Black Pepper Beef Short Ribs are tender with a bold peppery kick; the Gold-Medal Roasted Goose features crispy skin and savory fat; the Stir-Fried Snails are spicy, savory, and perfect with drinks. Affordable prices and authentic wok flavor make it a wonderful spot to dive into local nightlife and classic stir-fries.", "name": "Zhuzai Ji Restaurant (Panfu Road Branch)", "transport": "Take Metro Line 2 to Sun Yat-sen Memorial Hall Station, Exit C, then walk about 8 minutes."}, {"address": "8F, Mingsheng Plaza, No. 238 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 Stars | A historic brand with nearly a century of heritage, relaunching on Beijing Road with a mix of classic Cantonese fare and refined modern dining. The signature \u0027Datong Chicken\u0027 boasts crisp skin and tender meat served with a savory secret sauce, while the legendary \u0027Datong Egg Tarts\u0027 feature dozens of flaky, crunchy layers wrapping a smooth, sweet egg custard center. With an elegant interior, it is ideal for sampling both traditional feasts and timeless Guangzhou food culture.", "name": "Datong Restaurant (Beijing Road Branch)", "transport": "Take Metro Line 6 to Beijing Road Station, Exit A, then walk about 4 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Pujue Building, Dafo Temple, No. 21 Huixin Middle Street, Huifu East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 stars | Nestled inside the ancient Dafo Temple with over a thousand years of history, this restaurant is famous far and wide for its vegetarian buffet and exquisite \u00e0 la carte dishes. The signature \u0027Black Truffle Fried Rice\u0027 features distinct, fragrant grains, while the \u0027Vegetarian Pickled Fish Soup\u0027 uses konjac and pressed tofu to create a tender, springy texture with a zesty, slightly spicy and sour flavor that amazingly mimics real fish. Surrounded by elegant, tranquil antique wooden decor, it draws countless tourists and local devotees alike.", "name": "Dafo Temple Vegetarian Restaurant", "transport": "Take Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027, Exit D, then walk for about 8 minutes."}, {"address": "Inside Guangxiao Temple, No. 31 Guangxiao Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 stars | Located right next to Guangxiao Temple, the premier ancient temple of Lingnan, this venue serves deeply Zen-inspired traditional Cantonese vegetarian cuisine. The must-try \u0027Luohan Zhai\u0027 (Arhat\u0027s Delight) blends fresh mushrooms and seasonal bamboo shoots in a perfectly balanced rich sauce, offering a sweet, crisp, and savory explosion of mushroom aromas. Don\u0027t miss the \u0027Vegetarian Goose\u0027\u2014crispy and golden on the outside with soft, savory bean curd skin inside. Its light, non-greasy culinary philosophy makes it a favorite among health-conscious foodies.", "name": "Guangxiao Temple Bodhi Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Ximenkou Station\u0027, Exit C, then walk for about 5 minutes."}, {"address": "2nd Floor, Block B, Hotel Landmark Canton, No. 8 Qiaoguang Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 stars | Subverting traditional expectations of vegetarian food, Shudao highlights high-end vegetarian dining inspired by fine Western cuisine. The signature \u0027Lava Black Truffle Steak\u0027 is meticulously aged from lion\u0027s mane mushrooms; every bite bursts with juicy richness and a tender yet firm texture reminiscent of top-tier filet mignon, elevated by a velvety black truffle sauce. With an elegant and sophisticated atmosphere, it is a top romantic date spot near Beijing Road commercial area, popular among young locals and international visitors.", "name": "Shudao Vegetarian Restaurant", "transport": "Take Metro Line 2 or Line 6 to \u0027Haizhu Square Station\u0027, Exit F, then walk for about 3 minutes."}, {"address": "4th Floor, Crowne Plaza Guangzhou City Centre, No. 339 Huanshi East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 stars | A time-honored vegetarian brand in Guangzhou, renowned for cooking with whole, natural ingredients. The \u0027Bamboo Fungus Wild Mushroom Soup\u0027 comes highly recommended\u2014simmered for hours, the broth is clear yet intensely flavorful, with crisp, smooth bamboo fungus soaked in savory goodness. Another highlight is the juicy, springy \u0027Handmade Vegetarian Beef Meatballs\u0027. Emphasizing low oil and low salt, it is a go-to favorite for longtime Guangzhou locals and family gatherings.", "name": "Yixin Vegetarian Restaurant", "transport": "Take Metro Line 5 to \u0027Taojin Station\u0027, Exit B, then walk for about 4 minutes."}, {"address": "No. 280 Huifu West Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 stars | Situated next to the Huifu East Road food street, this budget-friendly yet high-quality vegetarian buffet offers over 100 dishes. Enjoy crackling fresh fried vegetarian spring rolls, silky steamed vegetarian rice rolls, and thin-skinned \u0027Vegetarian Xiaolongbao\u0027 packed with flavorful soup. With incredible value for money and endless choices, it is always bustling with savvy tourists and neighborhood locals.", "name": "Su Xiang Tian Vegetarian Buffet", "transport": "Take Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027, Exit J, then walk for about 7 minutes."}, {"address": "No. 2 Xiaoyou East Street, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 stars | Operating for decades, this classic traditional vegetarian restaurant is beloved by residents of the old city. The signature \u0027Brocade Vegetarian Char Siu\u0027 is crafted from wheat gluten and roasted to perfection with a honeyed glaze, delivering a tender yet crispy texture with a sweet-and-savory bite that amazingly mimics real pork. The \u0027Vegetarian Sweet and Sour Pork\u0027 is tantalizingly tangy and remains delightfully crisp. Its nostalgic Cantonese dim sum hall ambience offers an authentic taste of local Guangzhou vegetarian culture.", "name": "Fo You Yuan Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Ximenkou Station\u0027, Exit B, then walk for about 8 minutes."}, {"address": "No. 319 Zhongshan 4th Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.2 stars | Located near the Beijing Road Pedestrian Street, this restaurant boasts a serene, elegant atmosphere focused on healthy, wellness-inspired vegetarian cuisine. A must-order is the \u0027Pan-Fried Lion\u0027s Mane Mushroom Steak\u0027, featuring a golden-crisp exterior and succulent interior paired with custom black pepper sauce. The \u0027Rainbow Veggie \u0026 Fruit Roll\u0027 wraps fresh, crisp produce in paper-thin rice paper served with a sweet-and-sour dip\u2014wonderfully light and refreshing, especially in summer.", "name": "Miao Ji Xiang Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Peasant Movement Institute Station\u0027, Exit D, then walk for about 6 minutes."}, {"address": "No. 62 Chaotian Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 stars | A trendy, hipster-style eatery blending fine tea culture with modern vegetarian dining. The signature \u0027Stone Pot Truffle Tofu\u0027 pan-fries delicate tofu to a golden brown before serving it sizzling in a hot stone bowl, resulting in a crispy shell, tender center, and rich aromas of truffle and soybean. The \u0027Steamed Bountiful Harvest Grains\u0027 preserves the natural sweetness of whole foods like fluffy taro and smooth sweet potato. Its tranquil ambiance provides a peaceful urban sanctuary right in the bustling historic district of Yuexiu.", "name": "Bore Vegetarian Life Restaurant", "transport": "Take Metro Line 1 or Line 2 to \u0027Gongyuanqian Station\u0027, Exit I2, then walk for about 6 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1F, Mingsheng Plaza, No. 238 Beijing Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Featuring a rich and savory sauce, the beef offal is slow-simmered for hours until remarkably tender and deeply flavorful. Paired with sweet white radish soaked in rich broth, every bite bursts with delicious juice. A decades-old iconic spot on Beijing Road Pedestrian Street, enjoying a small paper bowl while strolling is the ultimate way to experience old Guangzhou\u0027s street food culture.", "name": "Suji Beef Offal (\u8607\u8a18\u725b\u96dc)", "transport": "Metro Line 1 or 2, Gongyuanqian Station, Exit D; approx. 8 minutes walk"}, {"address": "No. 210 Wenming Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.6 Stars | Renowned for its deep heritage in traditional Cantonese desserts, its signature egg custard with milk is silky smooth, rich, and velvety. The red bean paste is slow-cooked to a refined, smooth texture, perfectly sweet without being overwhelming. With over 100 menu combinations, this landmark sweet shop on Wenming Road\u0027s \u0027Dessert Street\u0027 is immensely popular with both locals and visitors.", "name": "Baihua Dessert (\u767e\u82b1\u751c\u54c1\u5e97)", "transport": "Metro Line 1, Peasant Movement Institute Station, Exit A; approx. 6 minutes walk"}, {"address": "No. 160-1 Wenming Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.7 Stars | The signature \u0027Steamed Silkie Chicken Soup in Whole Coconut\u0027 uses a natural coconut shell as its cooking vessel. The broth is crystal clear and naturally sweet, fully infusing the subtle fragrance of coconut into the tender black-bone chicken. Guests often enjoy scooping hot, nourishing soup directly from coconut shells under the historic arcade buildings\u2014a truly unique culinary comfort.", "name": "Dayang Original Stew Soup (\u9054\u63da\u539f\u5473\u71c9\u54c1)", "transport": "Metro Line 1, Peasant Movement Institute Station, Exit A; approx. 5 minutes walk"}, {"address": "No. 218 Wenming Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | The signature almond tofu is as silky smooth as satin with a delicate almond aroma, while the double-skin milk features a perfectly delicate wrinkled skin, melting instantly in your mouth with rich sweetness. This nostalgic, vintage-style shop represents the finest traditional handcraftsmanship of old Guangzhou desserts.", "name": "Rose Dessert (\u73ab\u7470\u751c\u54c1)", "transport": "Metro Line 1, Peasant Movement Institute Station, Exit A; approx. 6 minutes walk"}, {"address": "No. 451 Huifu East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Carrying on a decades-old secret recipe, their signature sauce blends custom-blended peanut butter with traditional soy sauce. The beef tripe and lungs are delightfully springy, while fried tofu and gluten puffs absorb the flavorful broth for an explosion of taste. The nutty aroma of peanut sauce pairs seamlessly with savory offal, making it an irresistible street snack.", "name": "A Po Beef Offal (\u963f\u5a46\u725b\u96dc)", "transport": "Metro Line 1 or 2, Gongyuanqian Station, Exit D; approx. 6 minutes walk"}, {"address": "No. 33 Zhongshan 5th Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.3 Stars | Freshly baked century egg pastries feature flaky, layered crusts with soft savory-sweet filling, while traditional chicken biscuits are delightfully crunchy and packed with rich fermented red bean curd and pork aromas. This time-honored bakery insists on handmade daily treats, attracting constant crowds for authentic, affordable traditional Cantonese pastries.", "name": "Zan Ji Bakery (\u8b9a\u8a18\u9905\u5bb6)", "transport": "Metro Line 1 or 2, Gongyuanqian Station, Exit E; approx. 3 minutes walk"}, {"address": "No. 129 Zhongshan 3rd Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.4 Stars | Famous for its signature black sesame glutinous rice balls featuring thin, springy skin that doesn\u0027t stick to your teeth. One bite releases a warm, rich black sesame filling across your palate. Served with slow-simmered black sesame paste or a unique cilantro fish fillet broth, it offers rich layers of flavor\u2014a comforting classic in the old city.", "name": "Jiashu Tangwan Wang (\u4f73\u53d4\u6e6f\u4e38\u738b)", "transport": "Metro Line 1, Martyrs\u0027 Park Station, Exit D; approx. 4 minutes walk"}, {"address": "No. 503 Huifu East Road, Yuexiu District, Guangzhou", "feature": "\u2b50 4.5 Stars | Skewered on bamboo sticks, these traditional crystal rice puddings are translucent, pleasantly chewy, and soft without sticking to teeth. Available in sweet red bean, crisp water chestnut, or rich coconut flavors, this is one of Guangzhou\u0027s most beloved nostalgic street desserts to enjoy on the go.", "name": "Bubugaosheng Put Chai Ko (\u6b65\u6b65\u9ad8\u6607\u9262\u4ed4\u7cd5)", "transport": "Metro Line 1 or 2, Gongyuanqian Station, Exit D; approx. 5 minutes walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Beijing Road and Yuexiu Historic Old City Area"}, "canton_tower_haizhu": {"categories": {"cat_1": {"items": [{"address": "No. 493 Binjiang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Starting as a humble seafood stall at the foot of Haiyin Bridge, BingSheng has grown into one of Guangzhou\u0027s most iconic high-end Cantonese dining institutions. The must-order \u0027Signature Secret Black Barbecued Pork\u0027 (Black Char Siu) is rich in flavor, tender on the inside with a charred exterior that melts in your mouth with a sweet maltose aroma. The \u0027Crispy Char Siu\u0027 offers a golden, crispy bite with distinct layered textures. Additionally, its \u0027Lo Hei Fish Sashimi\u0027 uses fresh grass carp sliced razor-thin, tossed with an array of seasonings for a sweet, crisp, and refreshing texture\u2014symbolizing good fortune and rising prosperity. With an elegant and majestic ambiance, it is a top choice for experiencing authentic Cantonese culinary culture.", "name": "BingSheng PinWei - Haiyin Main Branch", "transport": "Take Metro Line 3/8 to \u0027Kecun Station\u0027 and transfer to a bus to Binjiang East Road Station, or take the APM Line to \u0027Canton Tower Station\u0027 and walk for about 15 minutes."}, {"address": "No. 172 Binjiang West Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Recommended by the Michelin Guide, Hui Shi Jia represents the pinnacle of Guangzhou\u0027s claypot cooking (Jie Jie Bao). High-temperature claypots lock in ingredients\u0027 moisture instantly, bursting with intense wok hei (wok aroma). The must-try \u0027Claypot Eel\u0027 features firm, bouncy eel meat saut\u00e9ed with whole garlic cloves and a secret sauce, releasing a lightly charred aroma on the palate. The \u0027Claypot Oyster Omelet\u0027 is crispy outside, tender inside, juicy, and savory. For dessert, the \u0027Ginger Milk Ice Cream\u0027 cleverly transforms traditional hot dessert into a cool treat, perfectly balancing ginger heat and creamy milk.", "name": "Hui Shi Jia - Binjiang Branch", "transport": "Metro Line 8 \u0027Tongfuxi Station\u0027 Exit A, walk about 800 meters; or take an along-the-river bus to Binjiang West Road Station."}, {"address": "3rd Floor, Area C, Liying Plaza, No. 354 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A century-old famous Cantonese restaurant brand located in the bustling Kecun commercial district near Canton Tower. Preserving traditional handcrafted dim sum techniques, the must-order \u0027Tao Tao Ju Giant Shrimp Dumplings\u0027 feature at least thirteen folds per wrapper; the translucent yet resilient skin wraps over three whole fresh shrimp, bursting with sweet juices upon first bite. The \u0027Crispy Roast Goose\u0027 boasts paper-thin crispy skin that crackles with each bite, paired with tender, juicy goose meat infused with fruitwood charcoal aroma. The dining environment beautifully blends Lingnan stained-glass windows with modern chic, making it beloved by local residents and tourists alike.", "name": "Tao Tao Ju - Kecun Liying Plaza Branch", "transport": "Metro Line 3/8 \u0027Kecun Station\u0027 Exit C directly connects to Liying Plaza."}, {"address": "No. 1008 Binjiang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Founded by former senior executive chefs of the 5-star White Swan Hotel, this restaurant specializes in authentic, refined, nostalgic old-style Cantonese dishes. The signature \u0027Supreme Roast Pigeon\u0027 uses tender squab marinated in a proprietary braising sauce and deep-fried to a golden crisp; the skin is crunchy, the meat is tender, and juices overflow when torn apart. The \u0027Steamed Pork Ribs with Plums\u0027 are appetizingly sweet and sour with succulent meat, while the \u0027Scallion Oil Sea Cucumber\u0027 is delightfully springy, smooth, and infused with rich scallion flavor. Every dish showcases traditional masterly precision in heat control and seasoning, earning it stellar reviews along the Haizhu riverside area.", "name": "Hai Yan Lou - Binjiang East Branch", "transport": "Take Metro Line 3/APM Line to \u0027Canton Tower Station\u0027, transfer to the Haizhu Tram to \u0027Liede Bridge South Station\u0027, and walk about 5 minutes."}, {"address": "No. 352 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Renowned as \u0027The First Dining House in Guangzhou\u0027, Guangzhou Restaurant is an authoritative benchmark for experiencing classic morning tea (yum cha) and authentic Cantonese cuisine. The signature \u0027Steamed Pork Dumplings (Siu Mai)\u0027 are packed with firm, juicy meat topped with savory crab roe. The \u0027Wanchang Chicken\u0027 has glossy skin, smooth meat, and is paired with freshly grated ginger dip for a rich, non-greasy taste. The \u0027Stir-fried Rice Noodles with Beef in Satay Sauce\u0027 is packed with wok hei, featuring chewy noodles coated in savory sauce. Located near Canton Tower, the Kecun branch offers a spacious, elegant setting with consistently high-quality dim sum and traditional dishes\u2014an unmissable classic for first-time visitors.", "name": "Guangzhou Restaurant - Kecun Branch", "transport": "Metro Line 3/8 \u0027Kecun Station\u0027 Exit A, walk about 3 minutes."}, {"address": "No. 1031 Dongxiaonan Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | A venerable Cantonese eatery famous for its eel dishes and chilled Cantonese delicacies, deeply loved by local foodies. The must-order \u0027Coiled Eel Claypot\u0027 features succulent, bouncy eel cooked in a rich, flavorful sauce. The \u0027Huangpu Scrambled Eggs\u0027 demonstrate top-tier frying mastery, creating silk-like smooth egg folds filled with rich dairy and egg aroma. The \u0027Slow-Simmered Soup\u0027 is boiled for hours daily using fresh seasonal ingredients, yielding a sweet, nourishing broth. With wallet-friendly prices and generous portions, it is a quintessential representation of home-style Guangzhou flavors and traditional culinary skill.", "name": "Xin Tai Le - Haizhu Main Branch", "transport": "Metro Line 8/Line 2 \u0027Changgang Station\u0027 or Line 8 \u0027Xiaogang Station\u0027, within walking distance."}, {"address": "No. 550 Binjiang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | A longstanding Cantonese roast meat (Siu Mei) institution rooted in Guangzhou, renowned in Haizhu District for its affordable prices and top-quality roast meats. The signature \u0027Shenjing Roast Goose\u0027 selects premium Qingyuan geese, featuring crisp golden-red skin and rich flavor without being greasy, served with a sweet and sour plum sauce to cut through the richness. The \u0027Honey Glazed Char Siu\u0027 balances lean and fat meat with lightly caramelized edges, delivering a tender and sweet bite. The casual, welcoming neighborhood vibe attracts steady lines of locals for takeout and dine-in, making it a prime landmark to sample traditional Cantonese roast meats.", "name": "Goose Child Restaurant - Binjiang East Branch", "transport": "Take Bus 182 or 229 to \u0027Binjiang East Road Station\u0027 and walk about 2 minutes."}, {"address": "No. 162 Yiyuan Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A venerable traditional Cantonese dessert shop located near Canton Tower, preserving the ancient Lingnan craft of buffalo milk desserts. The signature \u0027Ginger Milk Pudding\u0027 is made fresh to order: hot milk is poured over fresh ginger juice and left to set for three minutes, resulting in a smooth, soft curd texture with a harmonious blend of spicy ginger and fragrant milk. The \u0027Double-Skin Milk Pudding\u0027 features a rich, aromatic top layer of milk skin over a silky, delicate lower layer\u2014sweet without being cloying. Additionally, the \u0027Taro Sago Soup\u0027 offers velvety, tender taro pieces, serving as a delightful haven to enjoy old Guangzhou treats after strolling around Canton Tower.", "name": "Sha Wan Sweet Soup - Yiyuan Road Branch", "transport": "Metro Line 3/APM Line \u0027Canton Tower Station\u0027 Exit B, walk about 600 meters."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Nos. 1-2, Chuangyi Avenue, TIT Creative Park, No. 397 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | A super popular industrial-style cafe located in TIT Creative Park, converted from an old factory building while preserving retro red bricks and steel structures. The signature \u0027Dirty Coffee\u0027 is smooth and creamy, blending espresso with chilled fresh milk to create rich hazelnut and deep chocolate notes. The made-to-order \u0027Japanese Souffl\u00e9 Pancakes\u0027 are cloud-like, fluffy, and soft, served with house-made vanilla whipped cream and fresh berries\u2014a huge hit with hipsters and tourists alike.", "name": "LOCKAL Coffee", "transport": "Take Metro Line 3 or 8 to Kecun Station (Exit A), then walk for about 5 minutes."}, {"address": "1F, Seasons City, No. 118 Chigang North Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | A design-forward, minimalist specialty coffee shop located along the artsy riverside area of Haizhu District. Its signature \u0027Special Cold Brew\u0027 boasts elegant citrus and floral aromas with a crisp, smooth finish. Pair it with the popular brunch item \u0027Eggs Benedict\u0027\u2014poached eggs yielding rich Hollandaise sauce and runny yolk over crispy English muffins with savory smoked salmon, making it the perfect choice for a relaxing riverside morning.", "name": "Stain Coffee", "transport": "Take Metro Line 3 to Canton Tower Station (Exit B), transfer to the APM Line or a bus to Chigang North Road Station, and walk a short distance."}, {"address": "Zone B, Party Pier Culture and Art Zone, No. 118 Modiesha Street, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Located near the Party Pier Culture and Art Zone, offering stunning outdoor seating facing the Canton Tower and Pearl River night views. The popular \u0027Flat White\u0027 features silky-smooth microfoam and coffee beans with a delightful light acidity and sweet nutty finish. For brunch, the \u0027Avocado \u0026 Scrambled Eggs Toast\u0027 uses naturally fermented sourdough topped with silky scrambled eggs and fresh avocado slices\u2014flavorful, layered, and delightfully healthy.", "name": "Grisousse Coffee", "transport": "Take Haizhu Tram Line 1 to Party Pier Station, then walk for about 3 minutes."}, {"address": "Inside TIT Creative Park, No. 397 Xingang Middle Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | A lush green oasis tucked away near Canton Tower, featuring retro vinyl records and vibrant plant decor. A must-try is the \u0027Coconut Latte,\u0027 made with fresh raw coconut milk and dark roast espresso\u2014sweet, rich, smooth, and refreshing. For brunch, the \u0027Full English Breakfast\u0027 is highly recommended, featuring juicy sausages, crispy bacon, baked beans, and hash browns. Authentic and hearty, it is favored by both international tourists and local professionals.", "name": "APOLLO Coffee", "transport": "Take Metro Line 3 or 8 to Kecun Station (Exit A), then walk for about 6 minutes."}, {"address": "No. 554 Binjiang East Road, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | A stylish cafe combining vintage newspaper elements with American industrial aesthetics. Highly recommended is the \u0027Osmanthus Latte,\u0027 which infuses local osmanthus honey into rich milk coffee for an elegant floral aroma and sweet finish. For brunch, don\u0027t miss the \u0027Pulled Pork Brioche Burger\u0027\u2014slow-cooked, juicy shredded pork served inside a buttery, soft brioche bun, delivering a perfectly balanced sweet and savory flavor profile.", "name": "Pressroom Coffee", "transport": "Take Bus Line 8 or 24 to Binjiang East Road Station, then walk for about 2 minutes."}, {"address": "No. 11 Yiyuan Road (Near Canton Tower), Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A renowned riverside brunch spot with elegant French flair and fantastic views of the iconic Canton Tower. Its signature \u0027Classic French Toast\u0027 is soaked in egg custard and pan-fried to golden perfection\u2014crispy outside, melt-in-your-mouth soft inside\u2014topped with pure maple syrup and vanilla ice cream. Paired with a pour-over single-origin \u0027Ethiopia Yirgacheffe,\u0027 the bright floral and fruity notes perfectly cut through the sweetness, making it a favorite spot for influencers and foodies.", "name": "Ines Brunch \u0026 Bistro", "transport": "Take Metro Line 3 to Canton Tower Station (Exit A), then walk for about 8 minutes."}, {"address": "1F, NOA Hotel, No. 183 Baogang Avenue, Haizhu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | A trendy cafe located within a design boutique hotel and art exhibition space. The signature \u0027Oat Milk Latte\u0027 offers a silky-s
