re the Bamboo Fungus Wild Mushroom Soup and Handmade Vegetarian Char Siu Buns. The soup broth is naturally sweet and fresh without added MSG. The vegetarian char siu bun filling uses specially seasoned mushrooms and soy products, offering a hearty texture with a rich sweet-and-savory barbecue sauce wrapped in a soft, fluffy bun. A favorite among local gourmets and health-minded travelers seeking lighter meals.", "name": "Yi Xin Vegetarian Restaurant (Panyu Aoyuan Plaza Branch)", "transport": "Take Metro Line 3 to Shiqiao Station, Exit B, then transfer to Bus Panyu 68 or Panyu 5 to Aoyuan Plaza Station."}, {"address": "No. 222 Fushi Road, Dashi Street, Panyu District, Guangzhou", "feature": "\u2b50 4.5 stars | A highly affordable vegetarian buffet serving dozens of rich stir-fries, dim sum, soups, and desserts. The kitchen adheres to low-oil and low-salt cooking. The freshly fried vegetarian spring rolls are irresistibly crispy, filled with fresh cabbage and wood ear strips; the slow-simmered herbal tonic soups offer a deep, comforting aftertaste. Exceptional value for money makes this a top choice for local residents and Chimelong visitors looking to recharge.", "name": "Su Man Xiang Vegetarian Buffet (Dashi Branch)", "transport": "Take Metro Line 3 to Dashi Station, Exit D, then walk for about 10 minutes or take a 3-minute taxi ride."}, {"address": "Hanxi Commercial Street, Hanxi Village, Zhongcun Street, Panyu District, Guangzhou", "feature": "\u2b50 4.4 stars | A cozy vegetarian eatery near Chimelong Resort specializing in home-style healthy plant-based dishes. The signature Thai Sweet and Spicy Veggie Fish uses premium tofu skin and seaweed to create a surprisingly realistic texture\u2014crispy on the outside, tender inside, and soaked in tangy, spicy sauce that whets the appetite. The restaurant insists on organic vegetables with minimal additives, delivering innovative yet natural flavors loved by families and health enthusiasts.", "name": "Ci Su Health Vegetarian Restaurant", "transport": "Take Metro Line 3 or Line 7 to Hanxi Changlong Station, Exit G, then walk for about 8 minutes."}, {"address": "2nd Floor, Outdoor Commercial Pedestrian Street, Panyu Wanda Plaza, No. 381 Hanxi Avenue East, Panyu District, Guangzhou", "feature": "\u2b50 4.8 stars | A unique vegetarian hotpot featuring a Tibetan tea soup base, beautifully blending high-mountain tea aromas with pure plant ingredients. The simmering broth releases subtle woody tea notes; dipping fresh mountain mushrooms and house-made tofu into it creates a refreshing, light flavor that is easy on the stomach. Paired with custom sesame or spicy dipping sauces, it satisfies the tastebuds while keeping it healthy. The distinctive dining experience attracts many tourists specifically to try it.", "name": "One Leaf One World Tibetan Tea Vegetarian Hotpot (Panyu Wanda Branch)", "transport": "Take Metro Line 7 or Line 18 to Nancun Wanbo Station, Exit B, then walk for about 4 minutes."}, {"address": "No. 88 Chaoyang Road, Dashi Street, Panyu District, Guangzhou", "feature": "\u2b50 4.3 stars | A traditionally styled vegetarian restaurant renowned for classic Cantonese dim sum and stir-fries. The signature Buddha\u0027s Delight Fried Noodles feature crispy golden noodles topped with a rich gravy of wood ear mushrooms, shiitake, carrots, and bamboo shoots for a delicious contrast of tender and crunchy textures. The freshly steamed Handmade Vegetarian Crystal Dumplings have translucent skins with a springy, satisfying bite. Highly popular among local elders and tourists seeking authentic flavors.", "name": "Gan Lu Vegetarian Restaurant", "transport": "Take Metro Line 3 to Dashi Station, Exit A, then transfer to Bus Panyu 145 to Chaoyang Road Station."}, {"address": "No. 102 Renmin Road, Zhongcun Street, Panyu District, Guangzhou", "feature": "\u2b50 4.4 stars | A budget-friendly buffet offering an exceptionally wide variety of vegetarian dishes, beloved by locals and travelers alike. Highlights include the freshly pan-fried Turnip Cake (Radish Cake), featuring a crispy golden crust, soft silky interior, and natural radish sweetness. Pair it with house-made healthy black soybean milk for a rich, smooth finish. Clean, hygienic, and wallet-friendly, it\u2019s a great spot for a relaxed meal after visiting Chimelong.", "name": "Miao Ji Xiang Vegetarian Buffet (Zhongcun Branch)", "transport": "Take Metro Line 7 to Zhongcun Station, Exit A, then walk for about 12 minutes or take a 5-minute taxi ride."}, {"address": "No. 56 Qunxian Road, Zhongcun Street, Panyu District, Guangzhou", "feature": "\u2b50 4.2 stars | A cozy hidden gem in a local Panyu neighborhood serving wholesome, additive-free home-style vegetarian cooking. The signature Sizzling Black Pepper Veggie Steak uses specially cooked Lion\u0027s Mane mushroom to achieve a tender, juicy, and satisfyingly meaty texture served sizzling with aromatic black pepper sauce\u2014perfect paired with rice. Affordable prices and friendly service give every guest a warm, homey dining experience.", "name": "Jing Xin Vegetarian Restaurant", "transport": "Take Metro Line 7 to Xiecun Station, Exit B, then transfer to Bus Panyu 109 to Qunxian Road Station."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Commercial Street next to Hanxi Chimelong Metro Station, East Hanxi Avenue, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | A time-honored branch from Shawan Ancient Town near Chimelong. Their signature Ginger Milk Pudding is freshly curdled to order\u2014spicy ginger juice blends seamlessly with rich Gaoming buffalo milk, creating a silky, melt-in-your-mouth texture. The fried milk is crispy outside, soft inside, and bursting with milky aroma, making it an iconic Cantonese street dessert for visitors after exploring the park.", "name": "Qinfangyuan Chinese Dessert Shop", "transport": "Approx. 3-min walk from Exit G of Hanxi Chimelong Station (Metro Lines 3/7)"}, {"address": "Renmin Road, Zhongcun Subdistrict, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | A classic street food tradition in Panyu for decades. Beef lung, brisket, and tripe are slow-simmered in braising broth, absorbing rich aromas of star anise and Chu Hou paste. Tender yet delightfully chewy, it is served with special Cantonese sweet chili sauce and melt-in-your-mouth stewed radish. Enjoying this on the go offers an authentic Old Guangzhou night market experience.", "name": "Zhongcun Traditional Beef Offal", "transport": "Approx. 5-min walk from Zhongcun Market Bus Stop (Bus Panyu 109)"}, {"address": "Times E-PARK Night Market Area, Hanxi Chimelong, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 Stars | A wildly popular stall in the night market around Chimelong. Made fresh to order, the golden-crisp lava egg waffles are fluffy inside with rich molten fillings like chocolate or cheese that burst in your mouth. Paired with springy fish balls drenched in rich Hong Kong-style curry sauce, this sweet-and-savory combo is a must-try night walk snack for tourists.", "name": "Chimelong Night Market Lava Egg Waffles \u0026 Curry Fish Balls", "transport": "Approx. 5-min walk from Exit D of Hanxi Chimelong Station (Metro Lines 3/7)"}, {"address": "Near Dashicheng, Dashi Subdistrict, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A favorite local breakfast and late-night spot near the Dashi area of Chimelong. Made from fresh stone-ground rice batter steamed to order, the rice sheets are paper-thin, translucent, fragrant, and silky soft. Filled with tender beef, egg, and finished with a splash of sweet soy sauce, every bite delivers rich layers of flavor loved by locals and visitors alike.", "name": "Dashi Old Street Stone Ground Rice Rolls", "transport": "Approx. 10-min walk from Exit A of Dashi Station (Metro Line 3)"}, {"address": "Chaoyang East Road, Dashi Subdistrict, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | A highly popular cold street appetizer around the Chimelong Resort. Steamed premium Sanhuang chicken is hand-shredded into strips, featuring springy skin and juicy meat. Tossed with sesame oil, secret soy sauce, cilantro, and crushed peanuts, it is refreshingly fragrant, tender, and appetizing\u2014an addictive snack perfect for evening strolls.", "name": "Panyu Hand-Shredded Chicken Stand", "transport": "Approx. 8-min walk from Exit D of Dashi Station (Metro Line 3)"}, {"address": "Aoyuan Plaza Market Area, next to Hanxi Chimelong Metro Station, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | The most bustling night market bite around, featuring fresh, plump oysters sourced from Zhanjiang. Grilled over charcoal until sizzling hot, they are topped with golden minced garlic and chopped chili. The oysters are plump, tender, juicy, and naturally sweet, perfectly harmonizing garlic aroma with fresh seafood flavor.", "name": "Chimelong Market Charcoal-Grilled Oysters \u0026 Seafood BBQ", "transport": "Direct access from Exit G of Hanxi Chimelong Station (Metro Lines 3/7)"}, {"address": "Commercial Area near Chimelong Tourist Resort, No. 290 East Hanxi Avenue, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A street stall specializing in traditional handmade pastries and desserts from Shawan, Panyu. Pan-fried water chestnut cakes are lightly crisp on the outside and chewy-sweet inside, filled with crunchy chestnut bits. Paired with a warm bowl of silky ginger milk pudding, the balance of heat and sweetness offers an authentic nostalgic taste.", "name": "Shawan Ginger Milk \u0026 Water Chestnut Cake Stall", "transport": "Approx. 6-min walk from Exit E of Hanxi Chimelong Station (Metro Lines 3/7)"}, {"address": "Qunxian Road, Dashi Subdistrict, Panyu District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | A cozy street eatery crafting traditional cloth-pulled rice rolls (Bula Changfen), which are springier and chewier than standard rice rolls. Filled with fresh shrimp or BBQ pork and drizzled with sweet soy sauce, they are packed with flavor. The stall also sells nostalgic Put Chai Ko (steamed pudding cakes)\u2014chewy, sweet, and filled with red beans, offering a delightful stroll snack reminiscent of childhood memories.", "name": "Minji Traditional Cloth-Pulled Rice Rolls \u0026 Put Chai Ko", "transport": "Approx. 2-min walk from Qunxian Road Bus Stop (Bus Panyu 187)"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Panyu Chimelong Wildlife Theme Resort"}, "xiguan_liwan": {"categories": {"cat_1": {"items": [{"address": "No. 151 Longjin West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 Stars | Located next to Liwan Lake Park, this is one of China\u0027s largest garden-style restaurants. Its dim sum, such as the \u0027Green Island White Rabbit Dumplings\u0027 and \u0027Water Chestnut Cake,\u0027 are highly iconic. The shrimp dumpling wrappers are paper-thin with fresh, bouncy shrimp inside, while the water chestnut cake offers a chewy, delightfully sweet texture with a subtle water chestnut aroma. It is a favorite spot for both tourists and Guangzhou locals to enjoy traditional Cantonese morning tea while taking in the antique pavilions, towers, and rockery waterscapes.", "name": "Pan Xi Restaurant", "transport": "Metro Line 5 Zhongshanba Station Exit A, walk about 10 minutes"}, {"address": "No. 2 Wenchang South Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 Stars | Renowned as the \u0027First Place to Eat in Guangzhou,\u0027 the Wenchang main branch retains the architectural style of traditional Xiguan grand mansions. The signature \u0027Wenchang Chicken\u0027 is smooth and aromatic, while the \u0027Gold Medal Char Siu\u0027 features a perfect blend of lean and fat pork with a rich honey glaze that melts in your mouth. Whether serving delicate dim sum or classic Cantonese cuisine, it maintains an exceptionally high standard, making it the top choice for experiencing authentic Cantonese culinary heritage.", "name": "Guangzhou Restaurant (Wenchang Main Branch)", "transport": "Metro Line 1 Changshou Road Station Exit A, walk about 8 minutes"}, {"address": "No. 117 Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.1 Stars | A highly representative heritage noodle shop in Xiguan, famous for its authentic bamboo-pressed Jook-sing noodles. The signature \u0027Fresh Shrimp Wonton Noodles\u0027 features a rich broth simmered with dried flounder and shrimp roe. Each wonton enfolds whole fresh shrimp and pork, juicy with every bite, paired with springy noodles free of lye taste. Its enduring popularity stems from decades of traditional craftsmanship and unwavering commitment to quality ingredients.", "name": "Baohua Noodle Restaurant", "transport": "Metro Line 1 Changshou Road Station Exit D2, walk about 3 minutes"}, {"address": "No. 2-3, Alley 3, Shiwufu, Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 Stars | A legendary eatery tucked away in a Xiguan alleyway, famous for decades for its \u0027Ancestral Crispy Seasoned Fish Skin.\u0027 Made from carefully selected grass carp skin, it delivers an extremely crisp and smooth texture tossed with peanuts, scallions, cilantro, and special soy-sesame dressing, bursting with aroma without any fishiness. Paired with a bowl of smooth Ting Zai (sampan) porridge, it forms a classic Xiguan street food pairing beloved by tourists and locals alike.", "name": "Chen Tian Ji Fish Skin", "transport": "Metro Line 1 Changshou Road Station Exit D2, walk about 5 minutes"}, {"address": "No. 345 Wenchang North Road, Liwan District, Guangzhou", "feature": "\u2b50 4.2 Stars | Founded in the 1950s, this famous cloth-steamed rice roll shop is renowned for its signature beef rice rolls. The rolls are praised for being \u0027white as snow, thin as paper, glistening with oil, and delightfully smooth.\u0027 The tender, juicy beef filling pairs perfectly with the house-made sweet-savory soy sauce. Visitors are fascinated by the traditional cloth-pulling technique, while locals consider it an essential daily comfort food.", "name": "Yin Ji Rice Roll (Wenchang Branch)", "transport": "Metro Line 1 Changshou Road Station Exit A, walk about 7 minutes"}, {"address": "No. 47 Dishifu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 Stars | Established in 1934, this classic Cantonese dessert spot is world-famous for its \u0027Double-Skin Milk\u0027 and \u0027Ginger Milk Curd.\u0027 Made with premium buffalo milk, the upper skin of the double-skin milk is rich and savory, while the custard beneath is silky-smooth and delightfully milky. The ginger milk curd offers a subtle kick of spice balanced with sweet creaminess. It\u0027s an indispensable traditional treat after strolling through historic Xiguan.", "name": "Nan Xin Milk Dessert Expert", "transport": "Metro Line 1 Huangsha Station Exit B or Changshou Road Station Exit D2, walk about 8 minutes"}, {"address": "No. 334 Longjin Middle Road, Liwan District, Guangzhou", "feature": "\u2b50 4.2 Stars | A famous historic congee house in Xiguan, renowned for its \u0027Jidi Congee\u0027 (Scholar Congee) and \u0027Dechang Salted Fried Pancakes.\u0027 The congee is simmered to a silky, smooth consistency with rice grains fully dissolved, featuring fresh pork liver, kidney, and meatballs. The freshly fried pancakes are crispy outside and soft inside with a faint hint of fermented red bean curd, perfect for dipping into piping hot congee for an authentic old Guangzhou breakfast experience.", "name": "Wu Zhan Ji (Longjin Middle Road Branch)", "transport": "Metro Line 1 Chen Clan Academy Station Exit A, walk about 10 minutes"}, {"address": "No. 67 Dishifu Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 Stars | A century-old bakery famous as the \u0027First House of Lotus Seed Paste,\u0027 featuring classic Lingnan Xiguan architecture. Famous for its \u0027Lotus Paste Mooncakes\u0027 and \u0027Chicken Biscuits,\u0027 its freshly baked pastries like sweetheart cakes and wedding cakes feature flaky crusts and fragrant, sweet-yet-light fillings of sesame and lotus seed paste. It is a benchmark destination for authentic morning tea dim sum, souvenir shopping, and experiencing Xiguan food culture.", "name": "Lian Xiang Lou (Dishifu Main Store)", "transport": "Metro Line 1 Huangsha Station Exit B, walk about 9 minutes"}], "name": "Famous Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "No. 227 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Located in the arcaded streets of Enning Road, this trendy retro American-style cafe seamlessly blends traditional Cantonese ingredients with modern specialty coffee. Signature drinks like the \u0027Water Chestnut Iced Americano\u0027 and \u0027Ya Shi Xiang Lemon Cold Brew\u0027 are refreshingly crisp, offering subtle sweetness and distinct tea aromas with a rich, layered taste. The vintage green interior contrasts strikingly with the historic Xiguan old street, attracting countless youth and tourists for Instagram-worthy snaps and a cozy brunch.", "name": "Fastfoot Coffee Department", "transport": "Take Guangzhou Metro Line 1 or Line 6 to Huangsha Station, Exit B, and walk for about 8 minutes."}, {"address": "Shi\u0027erfu West Street, Phase 1 Yongqingfang, Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Situated in the heart of Yongqingfang\u0027s historic district, this cafe artfully weaves Japanese minimalist white design into traditional Xiguan grand mansions and blue brick walls. Signature \u0027Spanish Latte\u0027 and \u0027Kyoto Latte\u0027 are rich, smooth, and creamy, pairing perfectly with fresh-baked croissants and light brunch options. As sunlight streams through the courtyard atrium, guests can savor top-tier espresso while taking in the unique Xiguan charm of blended old and new cultures.", "name": "% Arabica (Guangzhou Yongqingfang)", "transport": "Take Guangzhou Metro Line 1 to Changshou Lu Station, Exit D2, and walk for about 10 minutes."}, {"address": "No. 137 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A well-known local specialty coffee brand converted from a classic old Xiguan arcade building. Preserving the wooden staircases and brick structure of the historic building, the cafe features an open-air rooftop seating area overlooking old street views. Popular choices like \u0027Single-Origin Pour-Over\u0027 and \u0027Flat White\u0027 offer clean flavors with rich fruity and nutty notes. For brunch, the \u0027Freshly Toasted Sourdough with Avocado \u0026 Egg\u0027 is crispy outside and soft inside, making it a favorite among coffee enthusiasts and local hipsters.", "name": "Like Coffee (Enning Road)", "transport": "Take Guangzhou Metro Line 6 to Huangsha Station, Exit B, and walk for about 6 minutes."}, {"address": "No. 85 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | A vibrant neighborhood cafe blending industrial chic with lush greenery, serving high-quality pour-over coffees and a thoughtfully designed all-day brunch menu. Highly recommended are the \u0027Coconut Dirty Coffee\u0027 and the \u0027Cantonese Sausage Cheese Panini\u0027, which creatively incorporates local cured sausage into a Western panini for a surprisingly savory, crispy, and mildly spicy treat. With its stylish ambience and friendly service, it\u0027s a perfect spot for tourists to unwind.", "name": "SENSE COFFEE (Enning Road)", "transport": "Take Guangzhou Metro Line 1 to Changshou Lu Station, Exit D2, and walk for about 9 minutes."}, {"address": "No. 10 Baoqing New Street, Duobao Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 Stars | A hidden gem tucked away in the traditional alleyways of Xiguan, renowned for its exquisite pour-over coffee and house-baked desserts. The signature \u0027Osmanthus Oolong Cold Brew\u0027 radiates an elegant floral tea aroma with a sweet and refreshing taste, while the \u0027Basque Cheesecake\u0027 and brunch pancakes are moist, dense, and rich in dairy flavor. The cozy, wooden-toned decor creates a peaceful atmosphere where guests can slow down and enjoy Xiguan\u0027s relaxed pace of life.", "name": "Nine Corners Coffee", "transport": "Take Guangzhou Metro Line 1 to Changshou Lu Station, Exit D2, and walk for about 7 minutes."}, {"address": "No. 6, Lane 1, Yongqing Main Street, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 Stars | A hybrid concept space blending art exhibitions with food and coffee, located inside the Yongqingfang Cultural and Creative Park. The popular \u0027Full English Breakfast\u0027 includes pan-fried bacon, sunny-side-up eggs, baked beans, and crispy toast\u2014generous in portion and fresh in flavor. Pair it with a fruity, bright \u0027Ethiopian Pour-Over Coffee\u0027 that is smooth, aromatic, and deeply satisfying. The unique space allows guests to enjoy contemporary artwork alongside delicious eats.", "name": "Boundless Cafe (Yongqingfang)", "transport": "Take Guangzhou Metro Line 1 or Line 6 to Huangsha Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 128 Fengyuan Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 Stars | A cozy and charming independent coffee shop specializing in creative specialty drinks and Japanese-style brunch. A must-try is the \u0027Cantonese Aged Tangerine Peel Latte\u0027, which blends the sweetness of aged citrus peel with the robust bitterness of espresso for a uniquely lingering sweet finish. Pair it with \u0027French Thick Toast with Fresh Fruit\u0027\u2014soaked in egg wash and fried to golden perfection\u2014making it an essential stop on any Xiguan strolling itinerary.", "name": "Yixi Coffee (Xiguan)", "transport": "Take Guangzhou Metro Line 1 to Changshou Lu Station, Exit E, and walk for about 6 minutes."}, {"address": "Phase 2 Yongqingfang, No. 227 Enning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 Stars | A sophisticated cafe space tailored for young creators and trendsetters, fusing traditional Lingnan Manchu stained-glass windows with modern minimalist aesthetics. Renowned for its signature \u0027Oat Milk Bird\u0027s Nest Latte\u0027 and \u0027Smoked Salmon Avocado Croissant Brunch\u0027, featuring flaky, buttery croissants and delicate savory salmon that pair harmoniously with coffee. With excellent natural light, comfortable seating, and power outlets, it\u0027s a vibrant hub in the Xiguan cultural district.", "name": "Timetable Coffee (Yongqingfang)", "transport": "Take Guangzhou Metro Line 1 or Line 6 to Huangsha Station, Exit B, and walk for about 7 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 151 Longjin West Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Situated beside Liwan Lake Park, this is China\u0027s largest Lingnan garden-style restaurant. It seamlessly blends classic Cantonese cuisine with a waterside garden atmosphere. Signature dishes like \u0027Maofeng Tea-Infused Shrimp\u0027, creative figurative dim sum, and \u0027White Rabbit Dumplings\u0027 feature delicate wrappers and succulent, springy fillings. Loved by local Guangzhou residents for authentic Xiguan flavors, the garden\u0027s rare stones, flowing waters, and traditional pavilions allow diners to savor exquisite tastes while reflecting on historic charm.", "name": "Panxi Restaurant", "transport": "Metro Line 5 Zhongshanba Station Exit B, approx. 8 mins walk"}, {"address": "No. 20 Dishifu Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Founded during the Guangxu reign of the Qing Dynasty, this century-old brand has been revamped while retaining its rich, retro Xiguan charm. Its signature \u0027Centennial Roast Goose\u0027 boasts crispy skin, tender meat, and rich juices\u2014bursting with flavor without being overly greasy. The \u0027Flaky Milk Egg Tarts\u0027 feature distinct flaky layers and a rich milky aroma. A beloved spot for local elders and a top destination for tourists seeking authentic Cantonese local cuisine and exquisite dim sum.", "name": "Tao Tao Ju (Dishifu Main Branch)", "transport": "Metro Line 1 Changshou Lu Station Exit D2, approx. 6 mins walk"}, {"address": "No. 2 Wenchang South Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | Renowned as the \u0027First Restaurant of Guangzhou Cuisine\u0027, the Wenchang main branch features a garden courtyard and classic Xiguan architecture. A must-try is the \u0027Wenchang Chicken\u0027, featuring premium chicken layered with ham and chicken liver for a smooth, savory blend of three distinct flavors. The \u0027Crispy Skin Pigeon\u0027 is crispy outside, tender inside, and perfectly juicy. This venue showcases the refinement and craft of authentic Cantonese dishes, making it the ultimate spot to experience local dining culture.", "name": "Guangzhou Restaurant (Wenchang Main Branch)", "transport": "Metro Line 1 Changshou Lu Station Exit A, approx. 7 mins walk"}, {"address": "No. 853-857 Longjin East Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | A Michelin Bib Gourmand-recommended neighborhood eatery in Xiguan, renowned for traditional Cantonese home-style dishes. Its signature \u0027Scallion Oil Chicken\u0027 uses free-range chicken, blanched to produce crisp skin and smooth meat, then drizzled with a rich scallion oil that bursts with savory aroma. The \u0027Goose Intestines in Premium Soy Sauce\u0027 are crisp, springy, and cooked with perfect wok hei. Beneath its unpretentious decor lies the purest Xiguan home-cooked flavor, highly praised by locals and foodies alike.", "name": "Xiangqun Restaurant (Longjin East Road Branch)", "transport": "Metro Line 1 Chen Clan Academy Station Exit A, approx. 10 mins walk"}, {"address": "No. 258 Duobao Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | A renowned local restaurant in Xiguan that wins over Cantonese palates with authentic, hearty home-style dishes. The signature \u0027Qingxin Prime Chicken\u0027 features crisp skin, tender meat, and rich flavor, enhanced by special ginger-scallion dip. The \u0027Deep-Fried Shatian Pigeon\u0027 has a glass-like crispy skin that gushes with juice when pulled apart, revealing unbelievably tender meat. The lively atmosphere embodies the true authentic vibrant dining spirit of Liwan.", "name": "Qingxin Chicken \u0026 Shatian Pigeon (Duobao Road Branch)", "transport": "Metro Line 6 Ruyifang Station Exit B, approx. 8 mins walk"}, {"address": "Inside Phase 1 Yongqingfang, En\u0027ning Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.2 stars | Tucked away in the Lingnan arcade street district of Yongqingfang, this retro bistro seamlessly fuses traditional Xiguan blue-brick mansion architecture with modern dining and bar culture. Local Cantonese ingredients are creatively infused into Western bistro fare, such as the \u0027Cantonese Dried Tangerine Peel Braised Beef Pairing\u0027 and \u0027Lychee Wood Smoked Pork Ribs\u0027, offering tender meat with fruity aromas. As night falls, order a Lingnan-inspired craft cocktail and enjoy a relaxing drink amidst the unique blend of historic and modern street charm.", "name": "Sui Yue Xuan Bistro (Yongqingfang)", "transport": "Metro Line 1/Line 6 Huangsha Station Exit B, approx. 7 mins walk"}, {"address": "No. 16 Fengyuan Main Street, Fengyuan Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | Housed in a century-old Xiguan mansion, this private dining restaurant offers a serene, classical atmosphere adorned with stained glass Manchu windows and intricate wood carvings that evoke Qing Dynasty and Republican-era romance. It specializes in classic handcrafted Cantonese dishes, such as \u0027Traditional Nostalgic Eight-Treasure Duck\u0027, stewed until the meat melts off the bone while the flavorful filling absorbs the savory juices, and \u0027Signature Double-Boiled Conch Soup\u0027 with a sweet, clear broth. This ceremonial dining experience offers a wonderful glimpse into the culinary culture of historic Xiguan elite households.", "name": "Xiguan Grand House Private Kitchen", "transport": "Metro Line 1 Changshou Lu Station Exit D2, approx. 10 mins walk"}, {"address": "3rd Floor, No. 133 Baohua Road, Liwan District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | Famous across Guangzhou for its pigeon-themed specialties, this popular restaurant is a favorite among young tourists and families. The ultimate flagship dish, \u0027Braised Pigeon Claypot Rice\u0027, is freshly cooked in clay pots, allowing every grain of rice to absorb the rich flavors and aromas of the pigeon meat. The \u0027Salt-Baked Squab\u0027 features fragrant skin, tender meat, and savory seasoning. With its modern, welcoming vibe, this hot spot is a must-visit when exploring Baohua Road and Yongqingfang.", "name": "Dagfan (Baohua Road Branch)", "transport": "Metro Line 1 Changshou Lu Station Exit D2, approx. 3 mins walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 4 Yaohua Street, Yaohua Community, Changshou West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 Stars | Tucked deep inside Yaohua Street in the historic Xiguan old town, this time-honored vegetarian restaurant is a go-to favorite for many Guangzhou locals and plant-based food enthusiasts. Their signature \u0027Vegetarian Char Siu\u0027 (BBQ Pork) is firm and juicy, made from soy protein baked with a special sweet glaze\u2014slightly charred and caramelized on the outside with a realistic, satisfying chew. The \u0027Taro Cake\u0027 and \u0027Sweet and Sour Veggie Ribs\u0027 are crispy on the outside and soft inside. With a simple, warm atmosphere steeped in authentic Xiguan daily life, it is loved by elders and tourists seeking traditional Cantonese vegetarian flavors.", "name": "Fo Shi Jie Vegetarian Restaurant", "transport": "Metro Line 1, Changshou Lu Station, Exit D2, approx. 6 mins walk"}, {"address": "Inside Hualin Temple Scenic Area, Changshou West Road, Liwan District, Guangzhou", "feature": "\u2b50 4.3 Stars | Located adjacent to the thousand-year-old Hualin Temple, this restaurant seamlessly blends Zen culture with traditional Xiguan culinary techniques. The must-order \u0027Buddha\u0027s Delight\u0027 (Luohan Zhai) features a variety of fresh mushrooms, tofu skin, and wood ear simmered over low heat, yielding a rich, silky sauce packed with flavor and complex textures. The golden, crispy \u0027Vegetable Spring Rolls\u0027 have paper-thin wrappers that crunch delightfully with every bite, filled with a fresh, non-greasy stuffing. Worshippers and tourists alike stop here after visiting the temple to enjoy a soul-soothing, authentic vegetarian meal.", "name": "Hualin Temple Vegetarian Restaurant", "transport": "Metro Line 1, Changshou Lu Station, Exit A, approx. 8 mins walk"}, {"address": "Floor B1, Link City Mall, No. 133 Baohua Road, Liwan District, Guangzhou", "feature": "\u2b50 4.6 Stars | Situated inside Link City Mall directly above Changshou Lu Station, this modern vegetarian spot specializes in healthy, creative plant-based dishes. Their signature \u0027Black Truffle Wild Mushroom Fried Rice\u0027 features perfectly fluffy, chewy rice infused with a rich truffle aroma. The \u0027Handcrafted Vegetarian Soup Dumplings\u0027 (Xiao Long Bao) have delicate skin; biting into them releases a hot, sweet vegetable broth that is light and guilt-free. With an elegant, comfortable setting and stylish modern plating, it is a top choice for young diners and international travelers looking for a chic vegetarian experience.", "name": "Yi Xin Vegetarian Restaurant (Link City Mall)", "transport": "Metro Line 1, Changshou Lu Station, Exit E, direct access to Mall B1"}, {"address": "Opposite Renwei Temple, Pantang Road, Liwan District, Guangzhou", "feature": "\u2b50 4.2 Stars | Located near Liwan Lake Park and Pantang Ancient Village, this restaurant showcases the local aquatic ingredients of Xiguan\u0027s water town heritage. Their famous \u0027Pantang Five Treasures Veggie Pot\u0027 combines water chestnuts, lotus root, water caltrops, arrowhead roots, and bamboo shoots simmered in a light broth, highlighting a sweet, refreshing crunch in every bite. The \u0027Pan-Fried Vegetarian Radish Cake\u0027 is golden and crispy on the outside, soft inside, with a rich radish aroma. Old Guangzhou locals love visiting after a stroll around Liwan Lake to savor this nostalgic water-town feast.", "name": "Pantang Vegetarian Restaurant", "transport": "Metro Line 5, Zhongshanba Station, Exit B, approx. 10 mins walk"}, {"address": "No. 16 Fuli Road, Zhongshan 8th Road, Liwan District, Guangzhou", "feature": "\u2b50 4.4 Stars | Renowned for its diverse vegetarian buffet and delicate small plates, this highly affordable wellness restaurant in Liwan District offers great value. The \u0027Sweet and Sour Veggie Ribs\u0027 are coated in a balanced tangy sauce with a crispy, chewy texture, while the \u0027Health Mushroom Soup\u0027 is slow-simmered for hours with premium fungi, resulting in a rich, soothing broth. Clean, bright, and budget-friendly, it comes highly recommended by local office workers and health-conscious tourists.", "name": "Miao Ji Xiang Vegetarian Restaurant", "transport": "Metro Line 5, Zhongshanba Station, Exit D, approx. 5 mins walk"}, {"address": "No. 142 Fengyuan Road, Liwan District, Guangzhou", "feature": "\u2b50 4.1 Stars | Tucked away in the quiet arcade streets of old Xiguan along Fengyuan Road, this serene spot exudes Lingnan artistic charm and classical elegance. The popular \u0027Pine Nut Sweet and Sour Veggie Fish\u0027 is crafted from yam and bean curd sheets shaped into a fish, drizzled with sweet and sour sauce\u2014crispy on the outside, tender inside, perfectly replicating a Cantonese classic. The \u0027Steamed Spring-Water Tofu\u0027 uses handmade spring-water tofu, offering a rich, smooth soybean flavor that melts in your mouth. Visitors exploring Xiguan culture love unwinding here with a clean, guilt-free Zen-inspired meal.", "name": "Su Xin Xuan Vegetarian Restaurant", "transport": "Metro Line 1, Changshou Lu Station, Exit D1, approx. 9 mins walk"}, {"address": "Phase 2, Yongqingfang, En\u0027ning Road, Liwan District, Guangzhou", "feature": "\u2b50 4.5 Stars | Located in the heart of Yongqingfang Cultural District, this restaurant cleverly fuses the ambiance of traditional Xiguan mansion architecture with modern plant-based dining. The signature \u0027Coconut Yellow Curry Vegetables\u0027 is made with fresh coconut milk and aromatic spices, delivering a rich, creamy texture that pairs wonderfully with warm, crispy flatbread. The \u0027Basil Stir-Fried Veggie Tendon\u0027 is tender, chewy, and irresistibly fragrant. Its scenic, nostalgic interior and creative menu make it a fantastic dining stop while taking photos around Yongqingfang.", "name": "Shu Xiang Hui Vegetarian Restaurant (Yongqingfang)", "transport": "Metro Line 1 or Line 6, Huangsha Station, Exit B, approx. 8 mins walk"}, {"address": "No. 84 Duobao Road, Liwan District, Guangzhou", "feature": "\u2b50 4.0 Stars | A budget-friendly, neighborhood vegetarian eatery situated in the traditional district of Duobao Road, popular among local residents. The \u0027Vegetarian Steamed Phoenix Claws in Black Bean Sauce\u0027 is crafted from konjac and tofu skin, springy and rich in flavor. The \u0027Fresh Tofu Skin Veggie Soup\u0027 is refreshing yet savory, combining smooth tofu skin with finely chopped mushrooms for a delightful texture. Down-to-earth, tasty, and extremely affordable, it offers a great glimpse into local Guangzhou everyday vegetarian life.", "name": "Gan Lu Vegetarian Restaurant", "transport": "Metro Line 1, Changshou Lu Station, Exit D2, approx. 7 mins walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 7 Shiwufu Sanji Alley, Baohua Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.5 Stars | One of Xiguan\u0027s most legendary street snacks. The signature seasoned fish skin uses fresh grass carp skin, meticulously iced and prepared with skilled craftsmanship, then tossed with peanuts, scallions, soy sauce, and special sesame oil. Exceptionally crispy, bouncy, and free of any fishy odor, it bursts with rich sesame aroma, subtle spiciness, and a pleasant sweet aftertaste. It is a must-buy street snack for tourists and locals passing by Shiwufu Sanji Alley.", "name": "Chen Tian Ji Fish Skin (\u9673\u6dfb\u8a18\u9b5a\u76ae)", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 5 mins walk"}, {"address": "No. 85 Baohua Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.4 Stars | A traditional Xiguan ice house with nearly a century of history. Its most famous takeaway desserts are hand-crafted coconut and mango ice creams. Made entirely by hand using fresh coconut milk and real mango pulp, the ice cream is silky and dense, bursting with pure natural fruity and milky flavors without any artificial essence. Strolling through Xiguan\u0027s historic streets with a cup on a hot summer day offers a delightfully nostalgic vibe.", "name": "Shun Ji Ice House (\u9806\u8a18\u51b0\u5ba4)", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 4 mins walk"}, {"address": "Inside Yongqing Fang, Enning Road, Liwan District, Guangzhou City (near Yongqing 1st Alley)", "feature": "\u2b50 4.3 Stars | A famous classic representing Guangzhou\u0027s iconic beef offal. Slow-simmered for hours in rich Chu Hou sauce, the beef brisket, tripe, lungs, deep-fried tofu, and radish absorb every drop of savory broth. The offal is tender yet springy with warm hints of herbal spices and peanut sauce, while the sweet, stringless radish bursts with juicy broth in every bite. Walking down the street with a bowl in hand is the quintessential way to experience Guangzhou\u0027s street market culture.", "name": "A Po Beef Offal (\u963f\u5a46\u725b\u96dc)", "transport": "Metro Line 1/6 Huangsha Station, Exit B, approx. 8 mins walk"}, {"address": "No. 318 Duobao Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.3 Stars | A famous old-time Xiguan dessert shop renowned for its signature \u0027Husked Mung Bean Soup\u0027. Hand-skinned mung beans are slow-cooked with vanilla and herbs to create a velvety, melt-in-your-mouth texture infused with subtle herbal and nutty bean aromas. Perfectly sweet without being cloying, it is refreshing served cold and comforting served warm, loved by both long-time local neighbors and visiting foodies.", "name": "Kai Ji Dessert (\u958b\u8a18\u751c\u54c1)", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 6 mins walk"}, {"address": "No. 14 Fengyuan Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.6 Stars | An immensely popular Cantonese traditional street treat nestled in the alleys of Yongqing Fang and Xiguan. Steamed in traditional small porcelain bowls, it comes in dozens of flavors including red bean, coconut, osmanthus, matcha, and chocolate. Perfectly bouncy, chewy, and non-sticky, skewering and eating it with two bamboo sticks brings back delightful retro childhood fun\u2014a must-buy street snack for photos and casual strolling.", "name": "Bu Bu Gao Sheng Bowl Rice Cake (\u6b65\u6b65\u9ad8\u6607\u9262\u4ed4\u7cd5)", "transport": "Metro Line 1 Changshou Road Station, Exit B, approx. 7 mins walk"}, {"address": "No. 180 Duobao Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.4 Stars | A classic bakery steeped in old Xiguan nostalgia, freshly baking and selling traditional Cantonese pastries on-site. The must-try \u0027Chicken Biscuit\u0027 (Jizai Bing) is savory, crispy, and aromatic with distinct hints of garlic and preserved pork; the century egg pastry and sweetheart cake feature flaky, layered crusts filled with soft, sweet centers. Affordable and perfect to grab on the go, it is the ultimate old-school snack while exploring Xiguan\u0027s historical district.", "name": "Zan Ji Traditional Bakery (\u8d0a\u8a18\u5ac1\u56cd\u9905\u5e97)", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 5 mins walk"}, {"address": "No. 93 Huagui Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.2 Stars | A classic rice roll stall tucked at an old street corner that adheres strictly to traditional cloth-steaming methods. The steamed rice sheets are paper-thin, translucent, exceptionally smooth, and delicate with a subtle rice aroma. Wrapped around tender beef or pork and drizzled with custom sweet soy sauce and chili paste, it glides down smoothly\u2014a favorite old-school brunch street food for locals and visitors alike.", "name": "Yuan Ji Cloth-Steamed Rice Rolls (\u6e90\u8a18\u62c9\u5e03\u8178\u7c89)", "transport": "Metro Line 1 Changshou Road Station, Exit B, approx. 8 mins walk"}, {"address": "No. 289 Kangwang South Road, Liwan District, Guangzhou City", "feature": "\u2b50 4.5 Stars | A uniquely traditional Xiguan thick noodle soup street stall. The signature Lai Fun noodles are hand-extruded from pure rice slurry and served in a thick, rich broth simmered with pork lard cracklings, dried shrimp, mushrooms, and preserved vegetables. The noodles are soft yet slightly springy, absorbing the deeply savory broth in every bite. Topped with a spoonful of crispy fried lard cracklings and pickled radish, it explodes with flavor, showcasing authentic Xiguan street food culture.", "name": "Ling Ji Lai Fun Noodles (\u51cc\u8a18\u7028\u7c89)", "transport": "Metro Line 1 Changshou Road Station, Exit D2, approx. 7 mins walk"}], "name": "\ud83c\udf2d Street Snacks \u0026 Market Delicacies"}}, "name": "Liwan Xiguan Cultural Area and Yongqing Fang"}, "zhujiang_tianhe": {"categories": {"cat_1": {"items": [{"address": "1st Floor, No. 2 Xicun Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.6 stars | Founded in 1996, Bingsheng Pinwei is a renowned Cantonese dining brand in Guangzhou that evolved from a humble street stall into a Michelin-recommended restaurant. The signature \u0027Secret Recipe Black Barbecued Pork\u0027 is charred on the outside, tender inside, and rich with a deeply savory-sweet sauce without feeling greasy. The \u0027Crispy Barbecued Pork\u0027 features a paper-thin crispy crust with juicy, succulent meat within. Additionally, the \u0027Chilled Pig\u0027s Trotters\u0027 deliver a delightfully crunchy texture paired with a unique secret sauce. Mastering traditional Cantonese culinary techniques to perfection, it is hugely popular among local foodies and tourists alike.", "name": "Bingsheng Pinwei (Zhujiang New Town Branch)", "transport": "Take Metro APM Line to Opera House Station or Line 3/5 to Zhujiang New Town Station, then walk about 8 minutes."}, {"address": "5th Floor, K11 Art Mall, No. 5 Zhujiang West Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A century-old Cantonese teahouse established during the Qing Dynasty, seamlessly blending traditional dim sum culture with modern, stylish decor. Their signature \u0027Supreme Shrimp Dumplings\u0027 feature paper-thin, translucent wrappers stuffed with whole fresh prawns, exploding with sweet juices in every bite. The \u0027Crispy Milk Pineapple Buns\u0027 feature a super-crunchy crust filled with rich, molten milk custard. Whether for authentic morning tea like the locals or a satisfying lunch or dinner, you can savor consistently excellent handcrafted Cantonese dim sum here.", "name": "Tao Tao Ju (K11 Art Mall Branch)", "transport": "Take Metro APM Line to Huacheng Avenue Station with direct underground connection via B1, or Line 3/5 to Zhujiang New Town Station and walk 5 minutes."}, {"address": "4th Floor, GT Land Plaza Spring Mall, No. 86 Huacheng Avenue, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | A legendary all-day Cantonese teahouse brand in Guangzhou, famous for its commitment to handcrafted dim sum. The signature \u0027Golden Crispy Red Rice Roll\u0027 features soft red rice paper wrapped around a crispy nest and plump, bouncy shrimp, delivering rich, sweet, and crunchy layers of flavor. The \u0027Gold Medal Supreme Shrimp Dumplings\u0027 boast over 12 delicate pleats each, filled with firm and flavorful prawn meat. With its traditional Chinese decor, aromatic teas, and steaming dim sum baskets, it is an ideal spot to experience authentic Cantonese teahouse culture.", "name": "Dian Dou De (Huacheng Branch)", "transport": "Take Metro Line 3/5 to Zhujiang New Town Station (Exit B1), then walk about 3 minutes."}, {"address": "Level L3, Parc Central, No. 218 Tianhe Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A celebrated century-old Cantonese institution praised as the \u0027Top Choice for Dining in Guangzhou\u0027, rich in culinary heritage. The signature \u0027Guangzhou Wenchang Chicken\u0027 pairs premium chicken with cured ham and chicken liver for a tender, savory, and wonderfully unique flavor profile. The \u0027Traditional Handcrafted Shrimp Dumplings\u0027 and \u0027Pan-Fried Pork Buns\u0027 are also must-order table staples. Emphasizing pure flavors and refined knife skills, the menu offers both historic classic dishes and modern Cantonese creations.", "name": "Guangzhou Restaurant (Parc Central Branch)", "transport": "Take Metro Line 1/3 to Tiyu Xilu Station (Exit C), directly connected to Parc Central via the underground concourse."}, {"address": "4th Floor, IFC Mall, Guangzhou International Finance Center, No. 5 Zhujiang West Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.7 stars | A world-renowned high-end Cantonese institution, often referred to as the \u0027Whampoa Military Academy of Cantonese Cuisine\u0027 and a Michelin-starred dining landmark. The signature \u0027Crispy Roasted Pork Belly\u0027 is served in delicate cubes with an ultra-crackling skin, beautifully marbled fat, and tender meat\u2014yielding distinct layers without being greasy. The legendary dessert \u0027Mango Pomelo Sago\u0027 was originally invented by Lei Garden, offering a perfectly balanced sweet and tangy flavor. With impeccable service, it is a premier destination for fine Cantonese dining.", "name": "Lei Garden (IFC Mall Branch)", "transport": "Take Metro Line 3/5 to Zhujiang New Town Station and access directly via the IFC underground concourse."}, {"address": "4th-5th Floor, GT Land Plaza Summer Mall, No. 85 Huacheng Avenue, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.5 stars | A famed landmark for upscale Cantonese cuisine and live seafood, occupying a grand and sophisticated space in the Zhujiang New Town CBD. Renowned for rigorously selected live seafood and refined cooking, their signature \u0027Steamed Fresh Seafood\u0027 showcases precise temperature control that seals in natural sweetness. The \u0027Nanhai Golden Crispy Roast Pigeon\u0027 features crackling skin and succulent, flavorful meat. Dim sum highlights like \u0027Chicken Feet in Abalone Sauce\u0027 and \u0027Black Gold Custard Buns\u0027 are equally delicate.", "name": "Nanhai Yuchun (Zhujiang New Town Branch)", "transport": "Take Metro APM Line to Huacheng Avenue Station (Exit A), then walk about 2 minutes."}, {"address": "6th Floor, CITIC Plaza, No. 233 Tianhe North Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.3 stars | Founded in 1938, Da Tong is one of the four iconic traditional restaurants of Guangzhou, carrying nostalgic dining memories for generations of locals. Reopened in CITIC Plaza in the Tianhe CBD, it continues to preserve classic Cantonese dishes and traditional dim sum. The signature \u0027Da Tong Crispy Skin Chicken\u0027 boasts glass-like crisp skin and tender meat; the \u0027Da Tong Egg Tarts\u0027 feature flaky, layered pastry filled with silky, rich custard that bursts with milky aroma when hot. The ambiance blends elegance with nostalgia.", "name": "Da Tong Restaurant (CITIC Plaza Branch)", "transport": "Take Metro Line 3 (North Extension) to Linhexi Station (Exit D), then walk about 3 minutes."}, {"address": "4th Floor, GT Land Plaza Winter Mall, No. 11 Zhujiang East Road, Tianhe District, Guangzhou City, Guangdong Province", "feature": "\u2b50 4.4 stars | An immensely popular Cantonese home-cooking eatery beloved by locals and CBD office workers, celebrated for authentic, affordable, and high-wok-hei Cantonese comfort food. The signature \u0027Chang Lai Soy Sauce Chicken\u0027 is tender and savory-sweet with rich flavor penetrating to the bone. The \u0027Scallion Oil Pig\u0027s Trotters\u0027 offer a chewy, collagen-rich texture with a mouthwatering scallion aroma, while the crispy rice crust at the bottom of their \u0027Claypot Rice\u0027 is an absolute highlight.", "name": "Chang Lai Xiao Guan (GT Land Plaza Branch)", "transport": "Take Metro APM Line to Huacheng Avenue Station (Exit B), or Line 3/5 to Zhujiang New Town Station and walk about 6 minutes."}], "name": "Traditional Local Classics"}, "cat_2": {"items": [{"address": "No. 16 Huacheng Road, Zhujiang New Town, Tianhe District, Guangzhou City", "feature": "\u2b50 4.6 stars | Located in Zhujiang New Town, this minimalist, pure-white specialty coffee shop is beloved by Guangzhou\u0027s hipsters and coffee enthusiasts for its refined aesthetic. The shop features single-origin coffee beans sourced from top global roasters. Their pour-over coffee offers bright citrus acidity, delicate floral notes, and a long, sweet finish. Highly recommended with their signature freshly baked crispy croissant or silky Eggs Benedict brunch\u2014the golden puff pastry dissolves in your mouth with rich buttery fragrance, offering a double feast for the eyes and taste buds.", "name": "APF. Kafe", "transport": "Metro Lines 3/5 Zhujiang New Town Station, Exit B1, approx. 5 mins walk"}, {"address": "1st Floor, R\u0026F Yingtong Tower, No. 30 Huaxia Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.7 stars | Located in the heart of the CBD, this industrial-style coffee shop is famous for its signature cool cement-grey design and high-standard coffee. Their signature \u0027Dirty Coffee\u0027 slowly pours hot espresso into cold milk; the first sip delivers rich caramel and nutty espresso flavors, followed by smooth, cool milk for a wonderfully layered experience. For brunch, they offer a special Black Truffle Wild Mushroom Sourdough Toast\u2014crispy on the outside, soft on the inside sourdough paired with fragrant wild mushrooms and a perfect soft-boiled egg, making it an excellent choice for a morning luxury.", "name": "stain coffee", "transport": "Metro Lines 3/5 Zhujiang New Town Station, Exit A2, approx. 6 mins walk"}, {"address": "B1 Floor, K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.5 stars | Tucked away in the K11 Art Mall, this popular all-day brunch spot features Mediterranean and Aussie flair. The interior offers a bright, warm vacation atmosphere, specializing in healthy, balanced, and visually stunning big breakfast platters. The signature \u0027Aussie Classic Big Breakfast\u0027 includes smoked salmon, poached eggs, pan-seared buttery avocado, and freshly toasted sourdough. The golden yolk flows upon cutting the poached egg, pairing beautifully with rich avocado and slightly tangy toast. Pair it with a silky Flat White to enjoy a relaxed urban pace.", "name": "Over Easy by Cheez", "transport": "Direct access from APM Line Huacheng Dadao Station Exit B, or Metro Lines 3/5 Zhujiang New Town Station"}, {"address": "1st Floor, Commercial Podium, Kingold Century Financial Center, No. 16 Huaxia Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.4 stars | A specialty coffee space blending Nordic minimalism with modern urban style. They are meticulous about coffee bean sourcing and roasting, offering house espressos with rich dark chocolate and subtly tipsy wine aromas. The popular \u0027Avocado \u0026 Smoked Salmon Poached Egg French Toast\u0027 is loved by foodies\u2014golden toast fried crispy outside and soft inside absorbs rich egg wash, paired with savory smoked salmon and rich guacamole for a perfectly balanced sweet and savory taste. The spacious outdoor seating is an excellent spot for scenic relaxed dining.", "name": "HAY COFFEE", "transport": "Metro Lines 3/5 Zhujiang New Town Station, Exit A1, approx. 4 mins walk"}, {"address": "No. 6 Huajiu Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.6 stars | An independent neighborhood specialty cafe deeply rooted in the Tianhe CBD, famous for its high-quality signature drinks and homemade desserts. The popular \u0027Special Coconut Cold Brew\u0027 combines the natural sweet freshness of coconut water with medium-dark roast cold brew, delivering a refreshing, cool tropical fruit and milky flavor. Pair it with their daily limited-supply cinnamon roll or light brunch platter; the moist cinnamon roll wrapped in rich brown sugar and cinnamon pairs seamlessly with the coffee\u0027s crisp acidity.", "name": "LOCKAL Coffee", "transport": "Metro Lines 3/5 Zhujiang New Town Station, Exit B2, approx. 7 mins walk"}, {"address": "No. 79 Tiyu West Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.5 stars | An American vintage-style cafe located near the heart of the Tianhe commercial district, filled with a casual, easygoing street vibe. The house special \u0027American Heavy Peanut Butter Thick Toast\u0027 is a brunch must-order. Generously slathered with crunchy peanut butter and baked at high temperatures, taking a bite while hot reveals a crispy crust and soft interior, bursting with rich savory-sweet peanut aromas. Paired with a slightly acidic fruity cold brew or fresh milk latte to balance the rich flavor.", "name": "SENSE COFFEE", "transport": "Metro Lines 1/3 Tiyuxi Road Station, Exit E, approx. 5 mins walk"}, {"address": "1st Floor, No. 114 Tiyu East Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.8 stars | A phenomenal independent coffee brand originating from Tianhe CBD that took Guangzhou by storm. It leads trends with exceptional value and top-tier quality. The signature \u0027JPG Latte\u0027 uses house-roasted blend beans paired with high-quality fresh milk, resulting in rich, creamy froth and a bold, roasty coffee flavor with an ultra-smooth finish. Often paired during brunch with daily fresh Basque cheesecake or caramel croissants, the lightly charred cheesecake texture is velvety soft and rich, complementing the deep-roast latte perfectly.", "name": "Store by.JPG", "transport": "Metro Line 1 Tianhe Sports Center Station, Exit D2, approx. 3 mins walk"}, {"address": "1st Floor, Leighton Hotel, No. 8 Huacheng Road, Tianhe District, Guangzhou City", "feature": "\u2b50 4.5 stars | A highly popular, high-quality all-day international brunch spot in Zhujiang New Town, blending modern European cuisine with specialty coffee culture. The signature \u0027Spanish Sausage \u0026 Scrambled Eggs Big Breakfast\u0027 features rich soft-boiled eggs and slightly spicy chorizo, served with golden crispy sourdough and roasted sweet peppers. Each bite bursts with savory meat, egg, and sourdough malt aromas for an incredibly rich, juicy texture. The house pour-over coffee offers a clean balance of sweet and tart flavors.", "name": "Catching Kitchen", "transport": "Metro Lines 3/5 Zhujiang New Town Station, Exit B1, approx. 6 mins walk"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "1st Floor, No. 2 Xicun Road, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 Stars | A premier representative of local Cantonese cuisine and specialty bistros in Guangzhou, located in the heart of Zhujiang New Town. Famous for its exquisite roasted meats and private-kitchen Cantonese dishes, the signature \u0027Black Barbecue Pork\u0027 uses premium pork belly repeatedly roasted with a secret sauce\u2014rich yet not greasy, crispy outside and tender inside, releasing an ultimate sweet caramel aroma on the palate. The \u0027Chilled Pig\u0027s Trotter\u0027 is crispy, fragrant, and refreshing. The interior is elegant and noble, combining modern business aesthetics with Lingnan cultural features. Highly praised by local gourmets, it is a must-visit spot for tourists seeking authentic Cantonese flavors.", "name": "BingSheng PinWei", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, Exit B1, and walk for about 8 minutes."}, {"address": "2nd Floor, Regent Court, No. 28 Jinsui Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | A Michelin-recommended Cantonese restaurant famous for its sizzling claypot (Jie Jie Bao) dishes, perfectly showcasing traditional Lingnan claypot cooking techniques. The crown jewel, \u0027Sizzling Eel Claypot\u0027, is flash-fried in a high-temperature claypot; the eel is tender and firm, sizzling with hot oil and infused with intense garlic and charred aromas, packed with wok hei in every bite. The \u0027Sizzling Yellow Croaker\u0027 is succulent and melts in your mouth. Combining a bistro atmosphere with a curated selection of wines and Chinese cocktails, it is an ideal choice for business dinners and gatherings with friends and family.", "name": "Hui Shi Jia", "transport": "Take Guangzhou Metro Line 5 to \u0027Liede Station\u0027, Exit D, and walk for about 6 minutes."}, {"address": "Shops 101-102, No. 6 Huajiu Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | One of the most popular craft beer bistros among young adults and expats in the Tianhe CBD of Zhujiang New Town. It features dozens of fresh draft beers brewed in-house and selected globally, ranging from crisp IPAs to rich stouts. The menu offers innovative dishes blending local Cantonese flavors with American pub fare, such as the \u0027Cantonese Honey BBQ Pork Burger\u0027 and \u0027Slow-Roasted Smoked Pork Ribs\u0027\u2014tender, juicy, and rich in sauce, pairing perfectly with a cold craft beer. The industrial-style outdoor seating area boasts a fantastic evening atmosphere as the city lights turn on.", "name": "Bravo Brewing Co.", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, Exit B2, and walk for about 5 minutes."}, {"address": "3rd Floor Podium, Qiaoxin International Building, No. 62 Jinsui Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | A high-end Cantonese bistro created by the century-old brand Tao Tao Ju in the Tianhe CBD. The space blends classical Xiguan mansion aesthetics with modern luxury, preserving traditional Cantonese dim sum culture while offering highly creative regional feast dishes. The signature \u0027Century-Old Puff Pastry Milk Egg Tart\u0027 features distinct flaky layers and a silky, rich filling; the \u0027Crispy Shrimp Red Rice Roll\u0027 has a springy outer layer, a crunchy middle, and a plump shrimp filling, creating a delightfully layered texture. Paired with a curated list of spirits and wines, it offers foodies a luxurious dual enjoyment of tradition and trendiness.", "name": "Tao Tao Ju Yayuan", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, Exit A2, and walk for about 7 minutes."}, {"address": "Shop 102, Agile Center, No. 26 Huaxia Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | A minimalist industrial-style bistro located in the core area of Tianhe CBD, combining self-serve wine cellars with a fine Western-American dining experience. Featuring an expansive outdoor garden terrace and an immersive wine wall, the house-special \u0027Tomahawk Steak\u0027 is charcoal-grilled with precise heat to lock in rich juices, crispy outside and tender inside. The \u0027Foie Gras Wagyu Burger\u0027 is rich and satisfying, pairing amazingly well with craft beer or fine wine. The relaxed yet classy atmosphere makes it a trendy gathering spot for CBD professionals to unwind after work and for tourists to experience Guangzhou\u0027s nightlife.", "name": "Commune Reserve", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, Exit A2, and walk for about 3 minutes."}, {"address": "Shop L408, 4th Floor, K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 Stars | A modern Sichuan bistro that reimagines traditional Sichuan cuisine, located in the high-end K11 Art Mall. Introducing the concept of small plates (Tapas) to Sichuan cooking, it breaks the stereotype of large, overly spicy platters. The signature \u0027Rongyi Rattan Pepper Fish\u0027 uses fresh boneless fish fillets combined with custom rattan pepper oil; the broth is refreshing and aromatic with numbingly tender fish. The \u0027Rattan Pepper Shredded Chicken\u0027 is cool, refreshing, and thoroughly seasoned. The gallery-like, elegant ambiance makes it perfect for savoring alongside low-alcohol beverages.", "name": "Rong Yi Sichuan Bistro", "transport": "Take Guangzhou Metro APM Line to \u0027Huacheng Avenue Station\u0027, Exit B for direct access to K11, or take Metro Line 3/5 to \u0027Zhujiang New Town Station\u0027 and walk via the underground passage."}, {"address": "No. 42 Tianhe South 2nd Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.8 Stars | The most stunning innovative Teochew regional cuisine bistro in Guangzhou\u0027s Tianhe District, deconstructing traditional Teochew flavors using modern French culinary techniques. The chef team utilizes fermentation, slow low-temperature cooking, and refined French presentation on Chaoshan seafood and local ingredients. The signature \u0027Marinated Foie Gras\u0027 is silky smooth and melts in the mouth, carrying a rich herbal aroma from aged master stock. The \u0027Chilled Red Crab\u0027 preserves the peak sweetness of the ocean with a refreshing, firm crab meat texture. With a professional wine list curated to complement Teochew flavors, it offers a high-end, immersive regional culinary experience.", "name": "Chao Yue Modern Teochew Cuisine", "transport": "Take Guangzhou Metro Line 3 to \u0027Shipaiqiao Station\u0027, Exit B, and walk for about 5 minutes."}, {"address": "3rd Floor, Aoyuan Building, No. 108 Huangpu Avenue West, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 Stars | A highly praised Hakka regional bistro among locals, cleverly combining traditional rustic Hakka cuisine with modern bistro concepts. The signature \u0027Traditional Salt-Baked Chicken\u0027 uses free-range chicken baked in sea salt; the skin is golden and crisp, while the meat is juicy and firm with rich savory and bone-deep aromas. The \u0027Hakka Stuffed Tofu\u0027 is golden-seared on the outside, soft inside, perfectly blending soybean aromas with flavorful meat filling. The ambiance is cozy and classic, serving homemade Hakka yellow wine and rice wine with a sweet, mellow taste, making it an excellent spot to experience Guangdong\u0027s diverse regional dining culture.", "name": "Zui Ke Jia Hakka Bistro", "transport": "Take Guangzhou Metro Line 3 or Line 5 to \u0027Zhujiang New Town Station\u0027, Exit A1, and walk for about 8 minutes."}], "name": "Featured Bistros \u0026 Regional Specialties"}, "cat_4": {"items": [{"address": "L408, K11 Art Mall, No. 6 Zhujiang East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.7 stars | A high-end western-style vegetarian restaurant located in the prime CBD commercial area, moving away from traditional mock-meat concepts to showcase refined culinary aesthetics using fresh, whole ingredients. The signature \u0027Black Truffle Wild Mushroom Soup\u0027 is rich and velvety with a captivating forest aroma, leaving a delightfully sweet lingering finish. The \u0027Lion\u0027s Mane Mushroom Steak\u0027 undergoes a multi-step process of braising and pan-searing, resulting in a juicy, firm texture with a bite reminiscent of a prime steak; paired with a custom black pepper sauce, it amazes even non-vegetarians. Elegant and luxurious in atmosphere, it is hugely popular for corporate business dinners and romantic dates.", "name": "Shudao Vegetarian Restaurant", "transport": "Take the Metro APM Line to Huacheng Avenue Station, directly connected to K11 Art Mall via the underground passage."}, {"address": "2nd Floor, Redian Building, No. 63 Linhe Middle Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 stars | A long-established fine vegetarian brand in Tianhe District, Guangzhou, highly praised by local foodies and health enthusiasts. Promoting a healthy dining philosophy of low oil and salt, their \u0027Shredded Radish Pastry\u0027 features delicate, flaky layers with a sweet, juicy filling, while the \u0027Hand-Shredded King Oyster Mushroom\u0027 is stir-fried with a proprietary sauce, delivering a crisp, savory texture infused with captivating wok hei. Seamlessly blending traditional Cantonese cooking techniques into plant-based cuisine, it offers distinct layers of flavor in an elegant, serene ambiance\u2014a rare urban sanctuary in the CBD where guests can slow down and enjoy a mindful meal.", "name": "Yixin Vegetarian Restaurant", "transport": "Take Metro Line 1 or Line 3 to Guangzhou East Railway Station (Exit F), about a 5-minute walk."}, {"address": "B01, South Zone, Huachenghui, No. 89 Huacheng Avenue, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 stars | A trendy creative vegetarian restaurant located in the underground Huachenghui commercial district, known for its minimalist green aesthetic space and exquisite plating. Specializing in creative fusion plant-based dishes, the signature \u0027Avocado Tartare\u0027 uses perfectly ripened diced avocado paired with sweet-and-sour fruit jam and crispy crackers, offering a smooth, rich, and layered taste. The \u0027Pesto Wild Mushroom Risotto\u0027 is cooked in authentic Italian style with al dente rice coated in a rich herb pesto and fragrant seared mushrooms. A feast for both the eyes and taste buds, making it a hotspot for young tourists and office workers.", "name": "Manwu Bianji Aesthetic Vegetarian", "transport": "Take the Metro APM Line to Huacheng Avenue Station (Exit B), about a 2-minute walk."}, {"address": "KWG International Finance Plaza, No. 8 Huaxia Road, Zhujiang New Town, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 stars | A high-end Zen-inspired vegetarian establishment tucked away in the core office district of Zhujiang New Town, featuring omakase-style individual set menus and a slow-food experience. The classic \u0027Thai Basil \u0026 Black Truffle Fried Rice\u0027 features distinct, perfectly chewy grains of rice that release a vibrant blend of truffle and basil aromas. The \u0027Double-Boiled Lily \u0026 Bamboo Pith Soup\u0027 is crystal clear yet exceptionally sweet and savory, with tender, crisp bamboo pith infused with rich broth. Surrounded by warm wooden Zen decor and subtle tea aromas, it offers urbanites a peaceful sanctuary for mindfulness and culinary elevation amidst a busy business district.", "name": "Fanpu Vegetarian Fine Dining", "transport": "Take Metro Line 3 or Line 5 to Zhujiang New Town Station (Exit A1), about a 3-minute walk."}, {"address": "6th Floor, Teemall Shopping Center, No. 208 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 stars | A popular healthy vegetarian chain in Teemall favored by families and wellness enthusiasts, focusing on organic ingredients and whole-food cooking. The must-try \u0027Golden Broth Sour Sauerkraut Mock Fish\u0027 is crafted from premium konjac and tofu, yielding a smooth texture that absorbs the zesty, tangy golden sauerkraut broth for a delightfully appetizing kick. The \u0027Organic Fruit \u0026 Vegetable Salad with Sesame Dressing\u0027 features daily-delivered fresh produce, crisp and naturally sweet. Offering a wide variety of dishes at great value, it is the top choice for refueling after shopping in the CBD.", "name": "Tree of Life Organic Vegetarian", "transport": "Take Metro Line 1 or Line 3 to Tiyu West Road Station (Exit C), directly connected to Teemall Shopping Center."}, {"address": "4th Floor, Winter Mall, GT Land Plaza, No. 16 Zhujiang East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 stars | A modern light vegetarian dining spot in GT Land Plaza (Winter Mall), focusing on low-calorie, visually appealing light meals and creative plant-based dishes. The signature \u0027Thai Sour \u0026 Spicy Konjac Noodles\u0027 are delightfully springy, paired with a custom zesty dressing that is immensely appetizing\u2014low in calories yet deeply satisfying. The \u0027Pan-Seared Black Pepper Mock Steak Sandwich\u0027 features whole wheat toast stuffed with a hearty tofu skin patty and fresh lettuce, offering a savory, juicy, and nutritionally balanced meal. With its sleek minimalist interior and quick service, it is a lunch favorite among office workers in the Tianhe CBD.", "name": "Su Xin Sheng Light Vegetarian", "transport": "Take the Metro APM Line to Huacheng Avenue Station (Exit A), directly connected to GT Land Plaza Winter Mall."}, {"address": "2nd Floor, Sanjing Dongfang Building, No. 114 Tiyu East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 stars | An artistic vegetarian space combining tea arts, plant-based meals, and afternoon tea treats in the Tiyu East Road commercial area. The specialty snack \u0027Handmade Vegetarian Crystal Dumplings\u0027 features translucent, chewy skins stuffed with diced bamboo shoots, wood ear, and shiitake mushrooms, offering a fresh and crunchy bite. The \u0027Aged Tangerine Peel Red Bean Soup\u0027 is slow-simmered into a smooth, velvety texture with an elegant fragrance of vintage peel, delightfully sweet without being cloying. Its uniquely peaceful atmosphere and exquisite traditional Cantonese vegetarian dim sum attract many guests looking for a quiet spot to read or talk business.", "name": "Jingxin Su She Vegetarian Cafe", "transport": "Take Metro Line 1 to Tianhe Sports Center Station (Exit A), about a 3-minute walk."}, {"address": "2nd Floor, Liede Commercial Street, No. 10 Xingsheng Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 stars | A classic Chinese-style vegetarian venue adjacent to Liede Bar Street, integrating tea culture with traditional Cantonese vegetarian desserts. The popular snack \u0027Roasted Mock Char Siu\u0027 uses wheat gluten glazed in a special honey sauce, roasted until crispy outside and tender inside with a delightful savory-sweet smoky flavor. The \u0027Coconut Purple Rice Cake\u0027 is soft and chewy, bursting with rich coconut milk fragrance and the elegant sweetness of purple rice. Outdoor seating overlooks the night view of Zhujiang New Town and Canton Tower, making it a wonderful spot for tourists to enjoy evening treats while soaking in the relaxed Lingnan charm.", "name": "Green Tea Vegetarian Club", "transport": "Take Metro Line 5 to Liede Station (Exit D), about a 6-minute walk."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Food Court A021, B1 Floor, Fashion Tianhe Commercial Plaza, No. 299 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 stars | A classic Old Guangzhou walking snack! Deeply marinated beef brisket and offal that are melt-in-your-mouth tender yet delightfully springy, with zero gamey odor. The white radish absorbs the rich Zhuhou sauce, bursting with juicy flavor in every bite. Paired with house-made sweet chili or seafood sauce, it offers an authentic street-snacking vibe loved by tourists and local office workers alike.", "name": "Su Ji Beef Offal (Fashion Tianhe Branch)", "transport": "Take Metro Line 1 to \u0027Tiyu Center Station\u0027, Exit D3, and walk directly into Fashion Tianhe Underground Mall."}, {"address": "East 1st Street, Fashion Tianhe Commercial Plaza, No. 299 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.2 stars | Legendary street food originating from Xiguan! The fish skin is expertly prepared to eliminate any fishy odor, offering an incredibly crisp texture that crunches with every bite. Tossed in a golden ratio of special soy sauce, roasted peanuts, fresh cilantro, and fragrant sesame oil, this refreshing cold dish is a must-buy savory treat when exploring the Tianhe shopping district.", "name": "Chen Tian Ji Fish Skin (Fashion Tianhe Branch)", "transport": "Take Metro Line 1 to \u0027Tiyu Center Station\u0027, Exit D3, with direct access to Fashion Tianhe Underground Mall."}, {"address": "M Floor, Grandview Plaza, No. 228 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.5 stars | Classic Cantonese buffalo milk desserts and snacks. Made-to-order Ginger Milk Pudding has a silky-smooth curd texture, pairing rich, creamy milk with a gentle, spicy kick of ginger. The Double Skin Milk pudding is dense, velvety, and delightfully sweet, topped with a rich, aromatic milk skin\u2014the perfect sweet pick-me-up after a day of shopping.", "name": "Zhao Ji Chuan Cheng Dessert (Grandview Plaza Branch)", "transport": "Take Metro Line 1 to \u0027Tiyu Center Station\u0027, Exit D1, and walk for about 3 minutes."}, {"address": "No. 58 Tianhe Road, Tianhe District, Guangzhou (Near Shipaiqiao Metro Station)", "feature": "\u2b50 4.1 stars | A Michelin-recommended landmark for traditional cloth-steamed rice noodle rolls. The rice sheets are paper-thin yet springy, wrapping tender sliced beef and fresh shrimp. Drizzled with custom sweet soy sauce, every bite is filled with rich rice fragrance and savory filling\u2014an iconic staple of Guangzhou\u0027s street food scene.", "name": "Yin Ji Chang Fen (Shipaiqiao Branch)", "transport": "Take Metro Line 3 (Branch Line) to \u0027Shipaiqiao Station\u0027, Exit B, and walk for about 2 minutes."}, {"address": "B1 Floor, OneLink Walk, No. 230 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.6 stars | A wildly popular street pastry taking the internet by storm! The signature Seaweed Pork Floss Cake is coated in crispy seaweed and savory pork floss, featuring a cloud-like, fluffy cake interior that bursts with a sweet-and-savory mayonnaise sauce. Immensely satisfying, drawing huge daily queues.", "name": "Master Bao Pastry (OneLink Walk Branch)", "transport": "Take Metro Line 3 (Branch Line) to \u0027Shipaiqiao Station\u0027, Exit A, with direct access to OneLink Walk B1 floor."}, {"address": "B1 Floor, Hui Fang, No. 75 Tianhe East Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.4 stars | A vibrant takeaway stall featuring both Hong Kong and Cantonese street flavors. The curry fish balls are springy and soaked in rich, spicy Hong Kong-style curry sauce. The freshly baked egg waffles (Gai Daan Jai) are golden and crispy outside, soft and chewy inside, bursting with a rich egg and milk aroma\u2014a favorite afternoon treat in the CBD.", "name": "Wu Xi Street Snack Counter (Hui Fang Branch)", "transport": "Take Metro Line 3 (Branch Line) to \u0027Shipaiqiao Station\u0027, Exit B, and walk for about 5 minutes."}, {"address": "Middle 2nd Street, Fashion Tianhe Commercial Plaza, No. 299 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.0 stars | Traditional street pastries honoring classic Old Guangzhou recipes. The iconic Ji Zai Bing (Chicken Biscuits) feature a crispy shell and a savory-sweet filling infused with red fermented bean curd and candied pork fat, delivering a rich chewiness that gets more fragrant with every bite. The Sweet Wife Cake has a thin crust and tender winter melon filling\u2014a great stop to experience local heritage baking.", "name": "Lao Guang Ji Traditional Pastry (Fashion Tianhe Branch)", "transport": "Take Metro Line 1 to \u0027Tiyu Center Station\u0027, Exit D3, and walk directly into Fashion Tianhe Underground Mall."}, {"address": "Night Shanghai Zone, Fashion Tianhe Commercial Plaza, No. 299 Tianhe Road, Tianhe District, Guangzhou", "feature": "\u2b50 4.3 stars | Traditional Cantonese sweet soups (Tong Sui) originating from a famous old-city establishment. The freshly ground black sesame paste is thick, silky, and intensely aromatic, while the dried mandarin peel red bean soup is simmered until velvety smooth, leaving a delicate citrus finish. Comforting and smooth, it\u0027s a traditional portable dessert perfect to enjoy on the go.", "name": "Bai Hua Dessert (Fashion Tianhe Branch)", "transport": "Take Metro Line 1 to \u0027Tiyu Center Station\u0027, Exit D3, and walk directly into Fashion Tianhe Underground Mall."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Zhujiang New Town and Tianhe CBD Business District"}};
        const themeHex = "#16a34a";
        const cityName = "Guangzhou";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
