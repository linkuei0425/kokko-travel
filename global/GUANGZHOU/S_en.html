    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | The pinnacle of Lingnan architectural art, featuring exquisite wood, brick, and stone carvings as well as stucco sculptures that showcase rich Lingnan traditional culture and intricate craftsmanship.", "duration": "1-2 hours", "title": "Chen Clan Ancestral Hall", "transport": "About a 1-minute walk from Exit D of Chen Clan Academy Station, Metro Line 1"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A historic architectural complex brimming with European charm. Strolling here feels like being in a European town, making it a fantastic spot for photos and enjoying a relaxed, slow-paced lifestyle.", "duration": "2-3 hours", "title": "Shamian Island", "transport": "About a 10-minute walk from Exit F of Huangsha Station, Metro Line 1 or 6"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Guangzhou\u0027s most iconic landmark, nicknamed the \"Slim Waist.\" Ascend to the top for panoramic night views of the city, ride the high-altitude Ferris wheel, or try thrilling sky rides.", "duration": "2-3 hours", "title": "Canton Tower", "transport": "Direct access upon exiting Canton Tower Station, Metro Line 3 or APM Line"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | The largest comprehensive park in urban Guangzhou, rich in history and featuring the Five-Rams Sculpture (the city\u0027s symbol), ancient Ming Dynasty city walls, and Zhenhai Tower.", "duration": "2-3 hours", "title": "Yuexiu Park", "transport": "Exit B1 of Yuexiu Park Station, Metro Line 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | One of only four all-granite Gothic cathedrals in the world. Its magnificent Gothic architecture and vibrant stained glass windows are truly breathtaking.", "duration": "1-2 hours", "title": "Sacred Heart Cathedral", "transport": "About a 10-minute walk from Exit B2 of Haizhu Square Station, Metro Line 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | A major archaeological discovery in the Lingnan region, featuring the intact original site of the Western Han Nanyue King\u0027s tomb and precious relics like the Jade Garment Sewn with Silk Thread, holding profound historical significance.", "duration": "2-3 hours", "title": "Nanyue King Museum (Mausoleum Exhibition Area)", "transport": "About a 5-minute walk from Exit E of Yuexiu Park Station, Metro Line 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A historic district blending Lingnan arcade architecture with modern creative culture. It houses Bruce Lee\u0027s ancestral home and traditional Xiguan Mansion aesthetics, illuminated beautifully at night along the waterfront.", "duration": "2-3 hours", "title": "Yongqing Fang", "transport": "About an 8-minute walk from Exit B of Huangsha Station, Metro Line 1 or 6"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Where ancient millenary road ruins meet a bustling commercial street. Glass floor panels along the walkway let visitors look down at thousand-year-old road bases dating from the Tang, Song, Ming, and Qing dynasties.", "duration": "2-3 hours", "title": "Beijing Road Cultural Tourism Zone", "transport": "About a 5-minute walk from Exit D of Gongyuanqian Station, Metro Line 1 or 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Designed like an exquisite treasure box, this museum boasts a rich collection featuring themed exhibition halls on marine life, geological minerals, and Lingnan history and culture.", "duration": "2-3 hours", "title": "Guangdong Museum", "transport": "About a 10-minute walk from Exit B1 of Zhujiang New Town Station, Metro Line 3 or 5"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A grand octagonal palace-style building built in memory of Dr. Sun Yat-sen. Boasting an ingenious and imposing architectural structure, the park grounds are home to centuries-old trees.", "duration": "1-2 hours", "title": "Sun Yat-sen Memorial Hall", "transport": "About a 2-minute walk from Exit C of Sun Yat-sen Memorial Hall Station, Metro Line 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Designed by world-renowned architect Zaha Hadid, its exterior resembles two smooth pebbles washed by a stream, serving as a visually stunning hall for modern performing arts.", "duration": "1-2 hours", "title": "Guangzhou Opera House", "transport": "About an 8-minute walk from Exit B1 of Zhujiang New Town Station, Metro Line 3 or 5"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | As the saying goes, \"Guangxiao Temple predates Guangzhou City.\" It is Guangzhou\u0027s oldest ancient temple, featuring elegant classical architecture and a tranquil, Zen-filled atmosphere.", "duration": "1-2 hours", "title": "Guangxiao Temple", "transport": "About a 5-minute walk from Exit C of Ximenkou Station, Metro Line 1"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Top among the Eight Views of Guangzhou and celebrated as the city\u0027s \"lungs.\" Ascending the peak offers sweeping views of the bustling cityscape amidst pleasant natural scenery year-round.", "duration": "3-5 hours", "title": "Baiyun Mountain", "transport": "Take Metro Line 2 to Baiyun Park Station and transfer to a bus, or take the cable car at the South Gate Cable Car Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A famous ancient temple with a thousand-year history, known for its towering and elegant Flower Pagoda. The great literary master Su Dongpo famously inscribed the characters \"Six Banyans\" for it.", "duration": "1-2 hours", "title": "Temple of the Six Banyan Trees", "transport": "About an 8-minute walk from Exit I2 of Gongyuanqian Station, Metro Line 1 or 2"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A retro neighborhood featuring over a hundred red-brick Republican-era villas. Today, it combines indie craft shops, independent cafes, and art galleries, oozing a hipster-chic vibe.", "duration": "2-3 hours", "title": "Dongshankou", "transport": "About a 3-minute walk from Exit E of Dongshankou Station, Metro Line 1 or 6"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 Stars | A creative park transformed from a century-old wharf warehouse, offering stunning riverside sunset views along with a vibrant array of bars and restaurants at night.", "duration": "2-3 hours", "title": "Taigucang Wharf", "transport": "About a 12-minute walk from Exit A of Fenghuang New Village Station, Metro Line 8"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 Stars | A unique park showcasing traditional Lingnan water town architecture, intangible cultural heritage craft demonstrations, and folk performances, beautifully recreating the authentic lifestyle of old Guangzhou.", "duration": "3-4 hours", "title": "Lingnan Impression Park", "transport": "Transfer to a bus or taxi from Exit B of Higher Education Mega Center South Station, Metro Line 4"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.7 Stars | Combining Lingnan garden architecture, historic buildings, and water town features, this garden is filled with ponds of koi fish, crisscrossing bridges, and traditional arcades, radiating rich classical charm.", "duration": "3-4 hours", "title": "Baomo Garden", "transport": "Transfer to Bus Panyu 67 from Exit B of Shiqiao Station, Metro Line 3"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.9 Stars | A world-class safari park in Asia where you can ride a mini-train for close-up views of wild animals and marvel at a massive population of giant pandas.", "duration": "5-8 hours", "title": "Chimelong Safari Park", "transport": "Take the free shuttle bus from Exit D/E of Hanxi Changlong Station, Metro Line 3 or Line 7"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.7 Stars | Board a sightseeing cruise along the Pearl River to admire the beautifully illuminated views of Haixin Bridge, Canton Tower, and Liede Bridge, taking in the dazzling nightscape of Guangzhou.", "duration": "1-2 hours", "title": "Pearl River Night Cruise (Tianzi Wharf)", "transport": "About an 8-minute walk from Exit A of Beijing Road Station, Metro Line 6"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.7 Stars | Designed like an exquisite \"Moonlight Treasure Box,\" the museum houses a rich collection of Lingnan historical relics, ceramics, and natural specimens, making it the top choice for exploring Guangdong culture.", "duration": "2-3 hours", "title": "Guangdong Museum", "transport": "Take the APM Line or Metro Line 3 to Zhujiang New Town Station, then walk about 8 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.6 Stars | One of the world\u0027s oldest and largest tropical/subtropical botanical gardens, featuring conservatory complex displays and rare flora, serving as a lush natural oxygen bar.", "duration": "3-4 hours", "title": "South China National Botanical Garden", "transport": "About a 5-minute walk from Exit A of Botanical Garden Station, Metro Line 6"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 Stars | Combining Qing Dynasty court culture, ancient Lingnan architecture, and garden arts, it features winding covered corridors, clear babbling streams, and tens of thousands of koi fish, creating a truly magnificent spectacle.", "duration": "2-3 hours", "title": "Baomo Garden", "transport": "Take Metro Line 3 to Shiqiao Station, then transfer to Bus Panyu 67 to Baomo Garden Terminal"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 Stars | Renowned as one of Guangdong\u0027s Four Great Gardens, it is celebrated for its compact elegance, ingeniously employing miniature landscaping and borrowed scenery techniques to showcase the height of Lingnan garden architecture.", "duration": "1-2 hours", "title": "Yuyin Shanfang", "transport": "Take Metro Line 7 to Banqiao Station, Exit A, then transfer to Bus Panyu 72"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.8 Stars | One of only four all-granite Gothic cathedrals in the world, its grand stained-glass windows and soaring granite spires complement each other, evoking a profound and solemn religious atmosphere.", "duration": "1-2 hours", "title": "Sacred Heart Cathedral", "transport": "About a 5-minute walk from Exit B of Yide Lu Station, Metro Line 6"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.6 Stars | A grand octagonal building erected in memory of Dr. Sun Yat-sen, blending Chinese and Western architectural craftsmanship. Standing in front of the hall is a century-old kapok tree that creates an imposing vista when in full bloom.", "duration": "1-2 hours", "title": "Sun Yat-sen Memorial Hall", "transport": "Directly accessible upon exiting Exit C of Sun Yat-sen Memorial Hall Station, Metro Line 2"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.7 Stars | The site of China\u0027s famous modern military academy, featuring beautifully preserved historical buildings including the origin         function toggleMobileCart() {

                mobileOverlay.classList.remove('hidden');

                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {

            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function filterCategory(category) {

                if(btn) {

                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";

                }

                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';

                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);

        function addToTrip(type, identifier) {

            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);

                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);

            renderCart();
        }

                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
