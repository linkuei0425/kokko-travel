tional Okinawan habu snake liquor (Habushu), Ryukyu Bingata dyed handkerchief pouches, and artisan handcrafted ceramic mugs. Located inside the famous theme park adjacent to Gyokusendo Cave, this area recreates a century-old Ryukyu traditional village. The workshop shops inside the historic houses sell hand-crafted Bingata dyed textiles, traditional pottery (Tsuboya-yaki style), and Okinawa\u0027s famous health tonic Habushu. These items showcase rich historical and cultural charm, standing far above mass-produced factory souvenirs.", "name": "Okinawa World - Ryukyu Kingdom Castle Town Craft Shop", "transport": "Take Bus No. 83 directly from Naha Bus Terminal to \u0027Okinawa World Mae\u0027 stop."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Southern Okinawa and Senaga Island"}, "urasoe_ginowan": {"categories": {"cat_1": {"items": [{"address": "2F PARCO CITY, 3-1-1 Nishikaigan, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Handmade Essential Oil Facial Cleansing Paste, Ryukyu Sea Silt Deep Cleansing Foam. SuiSavon is Okinawa\u0027s most popular local handmade beauty and fragrance brand, famous for using local natural botanical extracts like brown sugar, shell ginger, sea silt (kucha), and Shikuwasa citrus. Located in PARCO CITY on the Urasoe West Coast, this spacious and bright branch features dedicated handwashing stations where visitors can test the rich, frothy handmade facial cleansing paste firsthand. The bestselling \u0027Handmade Essential Oil Cleansing Paste\u0027 has an ultra-dense texture that leaves skin hydrated without feeling tight, while exuding a delicate natural fruity scent\u2014making it a perfect high-quality souvenir.", "name": "SuiSavon - Shuri Soap Urasoe WEST COAST PARCO CITY", "transport": "Approx. 20-min drive from downtown Naha, or take Ryukyu Bus No. 26 and get off at Parco City Mae station."}, {"address": "2-21-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Churacos All-in-One Gel (Warabihada), Queen\u0027s White Silky Whitening Clay Pack. Churacos is a popular local skincare brand born in Ginowan, Okinawa, built around additive-free and natural extract concepts. Its flagship product, \u0027Warabihada All-in-One Gel\u0027, contains Okinawan Job\u0027s tears (coix seed), shell ginger leaf, and Shikuwasa extracts, specially formulated to smooth skin tags, dryness, and roughness\u2014earning high praise across Japan and overseas. The Ginowan Concept Store carries the complete product lineup and offers exclusive skincare consultations and special store deals.", "name": "Churacos Ginowan Store", "transport": "Drive north along Route 58; located right near the Oyama Intersection."}, {"address": "1F San-A Ginowan Convention City, 558-10 Uchidomari, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawa Shell Ginger Moisturizing Sheet Mask, Okinawa Sea Silt Deep Cleansing Mask. Ryukyu Bishada is Okinawa\u0027s iconic sheet mask specialty brand, highlighting natural Okinawan extracts for daily skin nourishment. The signature \u0027Okinawa Shell Ginger Moisturizing Sheet Mask\u0027 utilizes locally grown organic shell ginger, offering a soothing aroma along with outstanding antioxidant and hydrating properties. The \u0027Okinawa Kucha (Sea Silt) Mask\u0027 effectively absorbs deep pore impurities. Situated in a prime commercial hub in Ginowan, this counter attracts both locals and travelers alike.", "name": "Ryukyu Bishada San-A Ginowan Convention City", "transport": "Take Ryukyu Bus No. 55 to Uchidomari Station, then walk about 3 minutes."}, {"address": "1F PARCO CITY, 3-1-1 Nishikaigan, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Chulala Okinawa Cleansing Lotion, Bitter Melon Extract Antioxidant Serum. Cosme Clinic is a curated beauty store focusing on doctor-formulated and natural skincare, featuring a dedicated \u0027Local Okinawan Beauty Zone\u0027. The famous bestseller \u0027Chulala Okinawa Cleansing Lotion\u0027 utilizes Okinawan deep sea water and Kume Island shell ginger leaf extract, enabling gentle cleansing without double washing while retaining skin moisture. Featuring various serums combining Ryukyu herbal science, it\u0027s a treasure trove for beauty enthusiasts.", "name": "Cosme Clinic Urasoe WEST COAST PARCO CITY", "transport": "Drive via the Rinko Road Urasoe Line directly to PARCO CITY."}, {"address": "1-5-15 Aichi, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buys: Okinawa-exclusive Hibiscus Hand Cream, Ryukyu Citrus Essential Oil Mosquito Repellent Spray. DRUG ELEVEN is one of the most representative drugstore chains in Kyushu and Okinawa. The Aichi branch is spacious with a comprehensive inventory. Beyond popular Japanese drugstore items, it features a special Okinawa-limited cosmetics section, including hand creams made with local hibiscus and Shikuwasa extracts, plus herbal bug sprays infused with natural shell ginger essential oil. Tax-free shopping is available, making it a hit with both locals and independent travelers.", "name": "Drug Eleven Ginowan Aichi", "transport": "Drive through central Ginowan City; located near the Aichi Intersection."}, {"address": "2F PARCO CITY, 3-1-1 Nishikaigan, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Organic Shell Ginger Repair Lotion, Okinawa Sea Salt Warming Body Balm. Cosme Kitchen is a premier Japanese select shop for organic cosmetics from around the world. This branch highlights skincare products developed in partnership with local Okinawan organic farms. The top-selling \u0027Organic Shell Ginger Repair Lotion\u0027 uses pesticide-free shell ginger to soothe and repair UV-damaged skin. The store smells delicately of botanical essential oils, and the knowledgeable staff can guide you through local organic ingredients and benefits, delivering a sophisticated shopping experience.", "name": "Cosme Kitchen Urasoe WEST COAST PARCO CITY", "transport": "Take the Naha Bus direct shuttle or Ryukyu Bus directly to PARCO CITY."}, {"address": "1F PARCO CITY, 3-1-1 Nishikaigan, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: EXLUXURY Okinawa Mud Whitening Facial Wash, LuLuLun Okinawa Limited Hops \u0026 Shell Ginger Sheet Masks. As a leading Japanese drugstore chain, this flagship store inside the large Urasoe West Coast shopping mall boasts an extensive selection of Okinawa-exclusive cosmetics. From exclusive LuLuLun regional sheet masks to deep cleansing products containing Ryukyu sea silt (kucha), you can enjoy one-stop tax-free shopping here\u2014a must-visit destination for drugstore hauls.", "name": "Matsumoto Kiyoshi Urasoe WEST COAST PARCO CITY", "transport": "Accessible via the Rinko Road Urasoe Line by car; free large parking available."}, {"address": "7-7-12 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawa-exclusive SPA Sea Mud Mask, Ryukyu Whitening Goya (Bitter Melon) Cream. MEGA Don Quijote Ginowan is the largest discount store and drugstore in the Ginowan area, offering maximum convenience with 24-hour operation. Its cosmetics section features a massive \u0027Okinawa Local Souvenir Beauty Zone\u0027 packed with affordable, practical local skincare\u2014from Okinawan brown sugar lip balms and sea silt packs to local goya moisturizing creams. With huge discounts on popular pharmaceutical goods, it\u0027s the top choice for late-night shopping sprees.", "name": "MEGA Don Quijote Ginowan", "transport": "Drive along Route 58; located near the Ginowan Bypass Oyama Intersection."}], "name": "Local Representative Beauty \u0026 Cosmetics / Drugstores"}, "cat_2": {"items": [{"address": "2-17-3 Minatogawa, Urasoe City, Okinawa Prefecture (Minatogawa Stateside Town No.42)", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage British leather handbags, European vintage lace dresses, exquisite handcrafted silver jewelry. A highly sophisticated vintage select shop located in the Minatogawa Stateside Town in Urasoe. The owner personally travels across the UK and Europe to curate rare treasures. Filled with a rich British vintage ambiance, the shop sells classic, well-preserved leather bags from decades past alongside stylish vintage apparel. A hidden gem in Okinawa that vintage lovers and tasteful fashion enthusiasts shouldn\u0027t miss.", "name": "VINTAGE YARD", "transport": "Take Ryukyu Bus No. 55 to \u0027Minatogawa\u0027 stop, then walk about 5 minutes."}, {"address": "2-16-1 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: 1950s classic printed Hawaiian shirts, vintage genuine leather crossbody bags, retro American dresses. A well-known vintage shop located along Route 58 Antique Street in Ginowan. Owned by an American expat, the shop specializes in authentic vintage clothing, shoes, bags, and accessories imported directly from the US, spanning from the 1920s to the 1980s. The Hawaiian shirts and antique bags are of top-notch quality, boasting rich American retro cuts and prints highly favored by local Japanese trendsetters and tourists alike.", "name": "American Wave", "transport": "Take Okinawa Bus No. 20 or 120 to \u0027Isa\u0027 stop, then walk about 3 minutes."}, {"address": "2-1-10 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Okinawan hibiscus print Kariyushi shirts, Ryukyu indigo dye-style casual tops, Okinawan-style straw sun hats. One of Okinawa\u0027s most famous brands specializing in Kariyushi Wear (Okinawan Hawaiian shirts), the Ginowan branch features a spacious store with an extensive selection. Committed to 100% local Okinawan design and manufacturing, they incorporate local motifs like hibiscus flowers, bitter melons, and Ishigaki beef into high-quality apparel. Breathable, comfortable, and tailored to fit, it is the top choice for experiencing local style and buying high-grade souvenir clothing.", "name": "MANGO HOUSE Ginowan", "transport": "Take Bus No. 20, 28, or 120 to \u0027Oyama\u0027 stop, then walk about 2 minutes."}, {"address": "2F San-A Urasoe West Coast PARCO CITY, 3-1-1 Irijima, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Okinawan bitter melon pattern socks, Ryukyu Dog printed original T-shirts, Okinawan-motif canvas tote bags. Founded in 1979, HABUBOX is a local original streetwear brand known for its witty and fun designs featuring Okinawan culture. Their embroidered socks and original T-shirts are durable and crafted from sturdy fabrics, brimming with bold Ryukyu street style. Located inside Urasoe PARCO CITY, this branch makes shopping convenient and lets you pick up store-exclusive accessories, shoes, and casual bags.", "name": "HABUBOX Urasoe Parco City", "transport": "Take the direct shuttle bus or Chatan Express from Naha Airport or Naha City Center directly to \u0027San-A Urasoe West Coast PARCO CITY\u0027."}, {"address": "6-47-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-buy list: US military-issue vintage surplus jackets, vintage American denim jeans, graphic canvas tote bags. Located in the Oyama area of Ginowan, this American-style select shop is deeply influenced by US military base culture. It specializes in carefully curated US-made vintage military gear, classic denim apparel, and outdoor accessories. The store maintains strict quality control, making it possible to find rare military surplus gear and high-quality vintage backpacks. A must-visit destination for local fashion-forwards and American style enthusiasts.", "name": "RANCH Vintage \u0026 Select Shop", "transport": "Take Bus No. 99 to \u0027Ginowan Koko-mae\u0027 (Ginowan High School) stop, then walk about 6 minutes."}, {"address": "2-1-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: 1980s classic retro track jackets, US-made Champion hoodies, vintage leather crossbody bags. Originating from Tokyo, this mega-popular vintage shop established a huge branch in Ginowan, Okinawa. The vast retail space displays thousands of American vintage clothes, sneakers, and leather bags. From classic college sweatshirts and retro workwear jackets to vintage boots, everything is available at highly competitive prices\u2014making it a prime spot for treasure-hunting affordable American streetwear in Okinawa.", "name": "DESERT SNOW Okinawa", "transport": "Take Bus No. 20 or 120 to \u0027Oyama\u0027 stop, then walk about 1 minute."}, {"address": "4-4-2 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.8 stars | Must-buy list: Handcrafted natural gemstone macrame necklaces, ethnic leather waist bags, handmade woven fringe bags. A unique artisan apparel and accessory workshop in Ginowan, specializing in macrame knotting and leather crafting. The owner combines natural gemstones with premium leather to create one-of-a-kind ethnic jewelry, waist bags, and woven bags. Every item is a unique handmade piece oozing Mediterranean and Okinawan beach holiday vibes, offering immense personal style and souvenir value.", "name": "Freaky Hands", "transport": "Take Bus No. 20 or 120 to \u0027Dai-ichi Oyama\u0027 stop, then walk about 4 minutes."}, {"address": "4-10-1 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Okinawa-exclusive surf-style T-shirts, technical outdoor sling bags, casual American baseball caps. A popular local select shop located on Pipeline Street in Urasoe, focusing on American casual and surf aesthetics. Bringing together local Okinawan creator brands and classic US West Coast streetwear labels, it offers an extensive collection of streetwear, outdoor footwear, and tactical backpacks. With its laid-back and friendly vibe, it serves as a hub for local youths shopping for casual outdoor fashion and trendy accessories.", "name": "PIPELINE CLOTHING", "transport": "Take Bus No. 55 to \u0027Izu\u0027 stop, then walk about 3 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No.18, 2-17-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Seasonal Fruit Tarts, Okinawa Shikuwasa Lemon Cake (Hirami Lemon Cake), Tabitabi Pie. Located in the Minatogawa Stateside Town of Urasoe, this ultra-popular fruit tart specialty shop is famous for its gorgeous fruit tarts and French-style pies. All tart crusts are carefully baked until crispy, paired with fresh local Okinawan fruits and special custard cream for a layered, perfectly balanced taste that isn\u0027t overly sweet. The easily portable Lemon Cake made with Okinawan Shikuwasa (Shiwasa) is highly recommended\u2014sweet, tart, and refreshing, making it a top gift choice.", "name": "oHacorte Minatogawa Main Store", "transport": "Take bus No. 20, 28, or 120 and get off at \u0027Yafuso\u0027 stop, then walk about 10 minutes to reach Minatogawa Stateside Town."}, {"address": "No.25, 2-16-2 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Brown Sugar Canel\u00e9, Awamori Canel\u00e9, Milk Banana Canel\u00e9. This handmade canel\u00e9 specialty shop highlights brown sugar from Tarama Island, Okinawa. The exterior is baked until exceptionally crispy with a hint of caramelized brown sugar flavor, while the filling is soft, custard-like, and smooth. The shop has developed various limited-edition flavors incorporating local Okinawan ingredients. Featuring beautifully delicate packaging, it is hugely popular among young women and tourists, making it a must-buy French-Okinawan souvenir in Minatogawa Stateside Town.", "name": "Houki Boshi Minatogawa Main Store", "transport": "Take bus No. 20 or 120 and get off at \u0027Yafuso\u0027 stop, then walk about 8 minutes."}, {"address": "No.26, 2-16-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Natural Yeast White Bread, Homemade Scones, Kyushu Cheese Crackers. Tucked away in the foreign residential area, this charming little bakery insists on using Hokkaido wheat, Okinawa sea salt, and house-cultivated natural yeast for baking. Their signature toast contains no oil or sugar, featuring a crispy crust and a soft, chewy interior that sells out shortly after opening every day. Their specially crafted homemade scones are also very popular, boasting a rich wheat aroma that gets tastier with every bite. A hidden gem highly recommended by foodies and bread lovers.", "name": "ippe coppe Bakery (Natural Yeast Bakery)", "transport": "Take bus No. 20 or 28 to \u0027Yafuso\u0027 stop, then walk about 9 minutes."}, {"address": "No.28, 2-15-6 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Stateside Blend Coffee Beans, Okinawa Limited Drip Coffee Bags, In-House Roasted Cold Brew Coffee Bags. As an iconic local specialty coffee roaster in Okinawa with decades of history, Cerrado Coffee focuses on high-quality, select specialty coffee beans. Their in-house roasted beans are exceptionally flavorful, especially the \u0027Stateside Blend\u0027 created exclusively for Minatogawa, featuring rich nutty notes and mild fruity acidity. It is a favorite among coffee enthusiasts, and their beautifully boxed drip bags make classy gifts.", "name": "Okinawa Cerrado Coffee Beans (Minatogawa Store)", "transport": "Take bus No. 20 or 120 and get off at \u0027Yafuso\u0027 stop, then walk about 10 minutes."}, {"address": "No.44, 2-17-6 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Handmade Okinawan Herb Jam, Okinawa Herb Salt, Custom American-Style Dipping Sauces. Located in the Minatogawa area, this lifestyle and gourmet boutique curates seasonings and unique snacks produced by local Okinawan small farmers. The standout items are flavored salts and spreads made with pesticide-free Okinawan herbs and citrus, adding authentic local flair to home cooking. A must-visit hidden gem for treasure hunters and fine food enthusiasts seeking unique gifts.", "name": "Proba tabora Minatogawa", "transport": "Take bus No. 20 or 28 to \u0027Yafuso\u0027 stop, then walk about 10 minutes."}, {"address": "2-22-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Rich American Cheesecake, Jimmy\u0027s Garlic Butter Bread, Handmade American Brown Sugar Cookie Gift Box. Founded in 1956 during the US administration, Jimmy\u0027s is a classic American-style bakery and supermarket loved across generations in Okinawa. The store exudes a nostalgic vintage American vibe. Their signature cheesecake is rich and creamy, and the garlic bread causes a rush every time a batch comes out fresh. Packed with imported American snacks and exclusive handmade souvenirs, it offers a distinct taste of Okinawa\u0027s unique American culture.", "name": "Jimmy\u0027s Oyama Main Shop", "transport": "Take bus No. 20 or 120 and get off at \u0027Daiichi Oyama\u0027 stop, then walk about 2 minutes."}, {"address": "2-21-21 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Choco Renga (Chocolate Brick Cake), Makukuru (Chinsuko Chocolates), Shikuwasa \u0026 Kumquat Chocolates. This well-established Western confectionery and chocolate gift shop seamlessly blends Okinawan history with innovation. The brand is famous for pairing traditional Okinawan \u0027Chinsuko\u0027 shortbread with premium chocolate, creating a deliciously crispy and rich bite that has become a classic souvenir requested by visitors. The Ginowan main store is spacious and offers a full selection of elegant limited-edition gift boxes, ideal for corporate or personal gifting.", "name": "Fashion Candy Ginowan Main Shop", "transport": "Take bus No. 20 or 120 and get off at \u0027Daiichi Oyama\u0027 stop, then walk about 3 minutes."}, {"address": "6-8-12 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Manhattan Rich Cheesecake, Ultimate Cheese Pudding, Longan Honey Cheese Sticks. PUZO is a renowned Okinawan cheese dessert specialty brand that has won awards in national Japanese dessert competitions. The Ginowan store offers refined desserts combining premium cheeses with high-quality Okinawan ingredients. The signature Manhattan Cheesecake is exceptionally rich and dense with a hint of fresh lemon aroma, while the cheese pudding is silky-smooth with a lasting fragrance. They even thoughtfully provide cold pack packaging, making it a must-visit destination for true cheese lovers.", "name": "PUZO Cheese Cake Cellar Ginowan", "transport": "Take bus No. 20, 28, or 120 and get off at \u0027Uchidomari\u0027 stop, then walk about 7 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-1-1 Irijima, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Okinawa-exclusive Shuri Castle collaboration gift sets, 3COINS lifestyle goods, BEAMS Okinawa-exclusive T-shirts. A massive shopping center located on the Urasoe West Coast featuring over 250 stores, including many brands making their debut in Okinawa along with unique local counters. Oceanside with a breathtaking sea-view lounge, shoppers can enjoy invincible Pacific Ocean views while shopping, making it the most stunning shopping landmark in central Okinawa.", "name": "SAN-A Urasoe West Coast PARCO CITY (\u30b5\u30f3\u30a8\u30fc\u6d66\u6dfb\u897f\u6d77\u5cb8 PARCO CITY)", "transport": "Drive approx. 20 mins via Route 58; or take Bus No. 26 or 388 from Naha Bus Terminal and get off at \u0027PARCO CITY-mae\u0027 station."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Discounted GUCCI bags, classic COACH leather goods, BEAMS OUTLET exclusive apparel. Okinawa\u0027s most famous open-air European-style outlet mall, gathering over 100 renowned international brands and Japanese fashion labels. Offering year-round discounts ranging from 30% to 70% off, its resort-like architecture blends tropical Ryukyu and Greek aesthetics, making it an essential shopping paradise for tourists.", "name": "Okinawa Outlet Mall Ashibinaa (\u6c96\u7e04\u30a2\u30a6\u30c8\u30ec\u30c3\u30c8\u30e2\u30fc\u30eb \u3042\u3057\u3073\u306a\u30fc)", "transport": "Drive approx. 15 mins via Route 331; or take direct Bus No. 95 from Naha Airport, arriving in about 20 mins."}, {"address": "558-10 Uchidomari, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Okinawa brown sugar steamed buns, Orion beer merchandise, Okinawa sea salt cookies. A flagship shopping center in Ginowan operated by San-A, Okinawa\u0027s leading supermarket chain, well-loved by locals and tourists alike. Housing a large supermarket, clothing counters, lifestyle goods, and a food court, it offers the most comprehensive selection of local Okinawan souvenirs and daily necessities at budget-friendly prices.", "name": "San-A Ginowan Convention City (\u30b5\u30f3\u30a8\u30fc\u5b9c\u91ce\u6e7e\u30b3\u30f3\u30d9\u30f3\u30b7\u30e7\u30f3\u30b7\u30c6\u30a3)", "transport": "Drive north approx. 25 mins via Route 58; or take Bus No. 55 or 99 to \u0027Uchidomari\u0027 station and walk about 3 mins."}, {"address": "No. 30, 2-15-8 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawan Yachimun pottery mugs, Ryukyu glass cups, locally produced passion fruit jam. Tucked away in the Minatogawa Foreign Residential District in Urasoe, this tasteful select shop is run by a local couple passionate about Okinawan culture. Featuring curated ceramics by local artisans, handmade goods, and selected local ingredients, every item exudes unique handcrafted warmth and contemporary Ryukyu aesthetics.", "name": "PORTRIVER MARKET (\u30dd\u30fc\u30c8\u30ea\u30d0\u30fc\u30de\u30fc\u30b1\u30c3\u30c8)", "transport": "Drive via Route 58 and turn into the Minatogawa intersection; or take Bus No. 20 or 120 to \u0027Gusukuma\u0027 station and walk about 10 mins."}, {"address": "2-21-22 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Long-standing Okinawan Ryukyu glassware, local exclusive textiles, Okinawan specialty brown sugar gift sets. Located in the Oyama area of Ginowan, this lifestyle select store centers around the concept of \u0027Long Life Design\u0027. It curates timeless crafts, everyday tools, and local foods passed down through generations in Okinawa, showcasing a rich local lifestyle aesthetic and a spirit of sustainability.", "name": "D\u0026DEPARTMENT OKINAWA (D\u0026DEPARTMENT OKINAWA by DRAWING)", "transport": "Drive via Route 58 to the Oyama area; or take Bus No. 20 or 120 to \u0027Isa\u0027 or \u0027Oyama\u0027 station and walk about 5 mins."}, {"address": "No. 20, 2-16-7 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Okinawan fabric bags, Bingata dyed craft accessories, handmade brown sugar milk ice cream. An independent craft select shop located in the Minatogawa Stateside Town, \u0027Proots\u0027 stands for \u0027Roots of Okinawa\u0027. The owner thoughtfully collects craftworks from emerging creators across Okinawa\u2014including modern ceramics, woodwork, and textiles\u2014making it a top hidden gem for finding unique, one-of-a-kind souvenirs.", "name": "Proots - Okinawa Local Goods \u0026 Cafe", "transport": "Drive to the Minatogawa Foreign Residential District in Urasoe; or take Bus No. 20 or 120 to \u0027Gusukuma\u0027 station and walk about 8 mins."}, {"address": "7-7-12 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Okinawa-exclusive snow salt brown sugar, Okinawan Awamori chili oil, cost-effective Japanese cosmetics and skincare products. A mega-sized Don Quijote located in Ginowan featuring an extremely spacious retail floor. It offers everything from fresh food, cosmetics, and electronics to Okinawa specialties. Equipped with a massive souvenir section, affordable prices, and late-night operating hours, it is the ultimate destination for bulk souvenir shopping.", "name": "MEGA Don Quijote Ginowan", "transport": "Drive via Route 58 towards Ginowan Seaside Park; or take Bus No. 55 or 99 to \u0027Kanekuhara\u0027 station and walk about 5 mins."}, {"address": "2-16-11 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Vintage American shirts, classic vintage American jewelry, antique decor \u0026 accessories. Located in a corner of Ginowan Furniture Street, this vintage American clothing and antique store features items carefully handpicked by its American owner. Housing authentic American vintage apparel, accessories, and home decor from the 1930s to the 1980s, it perfectly embodies the unique Ryukyu-American hybrid vintage vibe of Ginowan, Okinawa.", "name": "American Wave", "transport": "Drive via Route 58 to the Oyama Furniture Street; or take Bus No. 20 or 120 to \u0027Oyama\u0027 station and walk about 3 mins."}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Urasoe Minatogawa District and Ginowan"}};
        const cityName = "Okinawa";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
