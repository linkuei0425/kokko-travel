t a 7-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "2-8-16 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Must-buy list: Ryukyu White Marine Clay Essential Oil Cleansing Cream, Okinawan Botanical Extract Hand Cream, Handmade Natural Fragrance Gem Soap. An Okinawan botanical skincare brand originating from Shuri, formulated with natural local ingredients like Shikuwasa, shell ginger leaves, and deep sea water. The cleansing paste produces ultra-fine foam with soothing fruity scents, making it a sophisticated local souvenir.", "name": "SuiSavon Shuri Sekken Kokusai Dori Gallery", "transport": "About a 7-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "3-2-1 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | Must-buy list: Hateruma Island Pure Brown Sugar Blocks, Ishigaki Island Pengin Diner Chili Oil, 100% Okinawa Shikuwasa Juice. A retro souvenir shop gathering specialties and local products from across Okinawa and its outer islands. Offering everything from brown sugar products and Awamori spirit to spicy oils, cookies, and snacks, it\u0027s perfect for travelers looking to buy local Okinawan ingredients and snacks all in one stop.", "name": "Okinawaya Main Store", "transport": "About a 4-minute walk from Okinawa Monorail \u0027Makishi Station\u0027"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-buy list: COACH classic signature leather bag, Agnes b. straw bag, Adidas limited colorway sneakers. Okinawa\u0027s only large outlet shopping center, located on the outskirts of Naha, features an open-air ancient Greek architectural style. It brings together over 100 international and domestic Japanese brands, including GUCCI, COACH, BEAMS, and Gap, offering incredible year-round discounts from 30% to 70% off. Beyond being a treasure hunt haven for past-season luxury goods, it also houses local Okinawan handicraft specialty shops and flagship stores for outdoor brands, making it perfect for a final shopping haul before heading home.", "name": "Okinawa Outlet Mall Ashibinaa", "transport": "Take the No. 95 direct express bus from Naha Airport; arrives in about 15 minutes."}, {"address": "1-1-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-buy list: Exclusive Okinawan crafts \u0026 traditional Ryukyu-yaki ceramics, Fleur select shop handmade embroidered scarves, Kayanoya Okinawa-exclusive dashi soup stock packs. Located in downtown Naha next to the Prefectural Office Monorail Station, RYUBO is Okinawa\u0027s oldest and Naha\u0027s only traditional full-service department store. In addition to premium Japanese cosmetics, the 2nd and 8th floors feature extensive sections dedicated to local brands and Okinawan creators, showcasing distinctive Ryukyu glassware, traditional textiles, and stylish modern lifestyle goods. The basement food hall is a top destination for acquiring premium Okinawan brown sugar and Kuroge Wagyu beef souvenirs.", "name": "RYUBO Department Store", "transport": "Take the Okinawa Monorail (Yui Rail) to Prefectural Office Station (Kenfucho-mae), directly accessible via the 2nd-floor connecting walkway (approx. 1-min walk)."}, {"address": "4-4-9 Omoromachi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-buy list: LuLuLun Okinawa-exclusive Bitter Melon \u0026 Shikuwasa face masks, Orion Beer limited merchandise, local Okinawan brown sugar soft gummies. Operated by San-A, Okinawa\u0027s largest local retail giant, this massive shopping center in the Shindoshin commercial district is a beloved shopping hub for locals and savvy travelers. It houses a large supermarket, apparel boutiques, an electronics superstore, and a movie theater. The expansive local supermarket on the 1st floor is highly recommended for budget-friendly Okinawan snacks, Awamori liquor, and fresh local foods\u2014offering much better prices than tourist spots and an authentic slice of daily Okinawan life.", "name": "San-A Naha Main Place", "transport": "Take the Okinawa Monorail to Omoromachi Station; approx. 5-minute walk."}, {"address": "4-1 Omoromachi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-buy list: Shiseido Okinawa-exclusive skincare set, Jo Malone duty-free exclusive perfume set, Prada classic leather wallet. Situated in the heart of Naha\u0027s Shindoshin district, this is Japan\u0027s only downtown tax-free shopping mall located outside an airport. Hosting over 150 top international luxury brands, it offers everything from fine jewelry and designer handbags to department store cosmetics. All items are tax-free, with convenient pickup at Naha Airport before departure. Bright, spacious, and elegant, it is a must-visit sanctuary for travelers looking to purchase luxury duty-free goods.", "name": "T Galleria by DFS, Okinawa", "transport": "Take the Okinawa Monorail to Omoromachi Station; the exit directly connects to the 2nd-floor lobby of the gallery."}, {"address": "2-8-19 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Must-buy list: Original Okashigoten Purple Yam Tarts, Okinawa-exclusive Habushu (viper sake), Okinawa Shikuwasa medicated hand cream. Located at the central intersection of Kokusai Dori, this Don Quijote boasts an extensive retail space spanning from B1 to the 4th floor, open 24 hours a day. The basement level features an exceptionally well-stocked area dedicated to Okinawan specialty gifts and local delicacies\u2014from traditional pastries and snake liquor to local crafts. Its round-the-clock hours make it perfect for late-night shopping for tax-free cosmetics and souvenirs after exploring night markets or enjoying late-night snacks.", "name": "DON QUIJOTE Kokusai Street Store", "transport": "Take the Okinawa Monorail to Miebashi Station or Makishi Station; approx. 7 to 9 minutes walk."}, {"address": "1-2-5 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Must-buy list: Ocean-blue handmade shell-embroidered canvas bag, Okinawa floral ocean-breeze handkerchief, ocean resin liquid coaster. Splash Okinawa is an original ocean-inspired lifestyle select brand born entirely in Okinawa. Designed with a tropical resort vibe and refreshing aqua-blue tones, the store carries a wide variety of unique goods meticulously developed by local designers. From beachy handbags and accessories to home fragrances and stationery, the exquisite designs radiate a vibrant Okinawan coastal feel, making it the top independent local boutique for unique, high-quality souvenirs.", "name": "Splash Okinawa Store No.1", "transport": "Take the Okinawa Monorail to Prefectural Office Station (Kenfucho-mae); walk along Kokusai Dori for about 5 minutes."}, {"address": "3-2-3 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-buy list: Okinawa Snow Salt brown sugar cookies, traditional Chinstuko gift box, Ryukyu indigo-dyed handcrafted charms. Okinawa-ya is one of the most iconic long-standing specialty shops on Naha\u0027s Kokusai Dori, easily spotted by its prominent giant Shisa statue out front. The store displays hundreds of specialty goods and exclusive collaborations from across Okinawa\u0027s various islands\u2014including traditional pastries, brown sugar items, Awamori liquor, and locally designed T-shirts. It is an unmissable destination for travelers seeking a one-stop shop for authentic specialties and regional limited-edition gifts.", "name": "Okinawa-ya Kokusai Dori Store", "transport": "Take the Okinawa Monorail to Makishi Station; approx. 3-minute walk."}, {"address": "1-2-1 Ameku, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | Must-buy list: MUJI Okinawa-exclusive brown sugar crackers, Uniqlo Shisa print collaboration T-shirt, handmade Ryukyu colorful glass cups. A sprawling local lifestyle shopping hub located in the Ameku area of Naha Shindoshin, consisting of several standalone flagship stores\u2014including Naha\u0027s largest Uniqlo, GU, MUJI, and Sports Depo. Featuring spacious surroundings and a huge free parking lot, it is ideally suited for travelers exploring by car. Offering an extensive product selection along with frequent Okinawa-exclusive releases and promotions, it is a budget-friendly shopping favorite for both locals and independent travelers.", "name": "Ameku Rakuchi Machi Shopping Center", "transport": "Take the Okinawa Monorail to Omoromachi Station, then transfer to a city bus or taxi (approx. 5 minutes)."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Downtown Naha and Kokusai Street"}, "onna_yomitan": {"categories": {"cat_1": {"items": [{"address": "Inside Gala Aoki-umi, 915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.8 Stars | Must-Buy List: Ryukyu White Marine Clay Facial Cleansing Balm, Shell Ginger (Getto) Repairing Essence Cream, Okinawa Shekwasha Hand Cream. Founded in Okinawa, this premium handcrafted cosmetics brand specializes in skincare products made with local extracts like shell ginger, shekwasha citrus, marine clay, and brown sugar. The store boasts an elegant atmosphere filled with the soothing scent of natural essential oils. The popular white marine clay cleanser creates a rich, moisture-retaining foam that leaves skin bright and hydrated. A high-quality local beauty boutique you definitely shouldn\u0027t miss when visiting Yomitan Village.", "name": "SuiSavon - Shuri Soap (Gala Aoki-umi Store)", "transport": "About a 60-minute drive from Naha Airport, or take Ryukyu Bus No. 28 to \u0027Takashiho Iriguchi\u0027 stop and walk for about 15 minutes."}, {"address": "2288-1 Namihira, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.7 Stars | Must-Buy List: Okinawa Sea Salt Beauty Soap, Shell Ginger Essential Oil Anti-Aging Soap, Ryukyu Indigo Nourishing Soap. Hidden in Yomitan Village, this original artisan soap shop crafts cold-processed soaps using natural Okinawa sea salt, shell ginger leaf extract, and cold-pressed plant oils. Each bar is aged for several months, resulting in a gentle, natural glycerin-rich bar perfect for sensitive and dry skin. The cozy handcrafted atmosphere draws countless visitors seeking natural skincare treasures.", "name": "La Cucina Soap Boutique Yomitan", "transport": "Driving is recommended. Turn from National Route 58 onto Prefectural Route 6 toward the Namihira area. Dedicated parking space is available in front of the store."}, {"address": "1712 Nagahama, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Must-Buy List: Okinawa Shekwasha Essential Oil Handmade Soap, Natural Shell Ginger Multi-Repair Oil, Okinawa Marine Mineral Bath Salt. Located in a quiet residential area of Yomitan Village, this botanical beauty shop focuses on organic skincare crafted from local Okinawan aromatic plants. Their homemade shell ginger repair oil locks in moisture effectively with a subtle herbal scent, soothing sun-exposed and dry skin. A hidden gem for tourists who love pure, natural skincare.", "name": "Island Aromas Okinawa Yomitan", "transport": "Drive toward Cape Zanpa; follow the signs after passing the Nagahama settlement."}, {"address": "594 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Kucha Deep Facial Cleansing Mud, Natural Shell Ginger Hydrosol Mist, Okinawa Sea Salt Thermal Exfoliator Gel. Situated on the seaside of Onna Village, this beauty shop specializes in Okinawa\u0027s unique skin-beautifying mineral clay, \u0027Kucha\u0027. High in absorption power and rich in trace elements, this sea mud deep-cleanses pores and exfoliates dead skin. Formulated into various convenient home skincare products, it is a local miracle item for achieving radiant skin.", "name": "Kucha Ocean Beauty Shop Onna", "transport": "Take Ryukyu Bus No. 120 to \u0027Manzamo Iriguchi\u0027 stop, then walk for about 8 minutes."}, {"address": "6091-1 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Okinawa-exclusive Bitter Melon Hydrating Mask, Hokkaido \u0026 Okinawa Collaboration Horse Oil Moisturizing Cream, Anessa Perfect UV Sunscreen Skincare Milk. Located at the heart of Onna Village\u0027s resort hotel area, this spacious and bright drugstore offers duty-free shopping. Alongside popular Japanese cosmetics and pharmaceuticals, it features a special section for Okinawa-exclusive skincare. The bitter melon essence mask provides a cooling, hydrating remedy after a day at the beach.", "name": "Satudora Onna Branch", "transport": "Take Ryukyu Bus No. 120 to \u0027Onna-son Yakuba-mae\u0027 stop, then walk for about 3 minutes."}, {"address": "2260 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Okinawa Brown Sugar Repair Lip Balm, Saborino Morning Mask Okinawa Citrus Edition, Shiseido ELIXIR Superieur Aesthetic Essence. Located near luxury resort hotels in Onna Village, this popular drugstore chain is perfect for hotel guests needing a late-night restock. Fully stocked with everything from luxury counter brands to affordable cosmetics, it highlights limited-edition masks and lip balms made with Okinawan botanical ingredients, making it a hit among international tourists.", "name": "Cocokara Fine Resort Onna", "transport": "Drive along National Route 58 to the Seragaki area. Free customer parking is available on site."}, {"address": "343 Owan, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: SK-II Facial Treatment Essence Discount Set, Curel Intensive Moisture Cream, Okinawa Hibiscus Hydrating Hand Cream. A massive discount drugstore located in Yomitan Village\u0027s Owan shopping district, known for highly competitive prices and immense stock. Its cosmetic section is meticulously categorized, allowing shoppers to find major Japanese skincare brands and local Okinawan hand creams at great deals. With ample parking and quick checkout, it\u0027s a top pick for locals and savvy travelers.", "name": "Discount Drug Cosmos Yomitan", "transport": "Drive via Prefectural Route 6 and turn into the Owan shopping area; about a 7-minute drive from Yomitan Village Office."}, {"address": "383-1 Iramina, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: Minon Amino Moist Face Mask, Okinawa Limited Snake Oil Skincare Ointment, DHC Lip Cream. As one of the most iconic drugstore chains in Kyushu and Okinawa, the Yomitan branch is spacious and offers an extensive variety of items. Beyond popular skincare and medicine, it features a local product zone highlighting snake oil ointments and essential oil skincare made with Okinawan ingredients\u2014a favorite for budget-conscious shoppers looking for great value.", "name": "DRUG ELEVEN Yomitan", "transport": "Drive along National Route 58; a large sign is visible near the Iramina Intersection."}], "name": "Representative Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "915 Takashiho, Yomitan, Nakagami District, Okinawa (Inside Gala Aoiumi)", "feature": "\u2b50 4.5 stars | Must-Buy List: Original snake-pattern T-shirts, Okinawa-style ocean bandanas, Ryukyu motif socks. Features: HABUBOX is an iconic Okinawan streetwear brand that seamlessly blends traditional Ryukyu culture with modern street trends. Their T-shirts are made of durable, breathable fabric with humorous and tropical Okinawan designs, making it a favorite fashion stop for both locals and tourists.", "name": "HABUBOX Gala Aoiumi Store", "transport": "About a 60-minute drive from Naha Airport, or take bus No. 28 to \u0027Takashiho Iriguchi\u0027 stop and walk for about 15 minutes."}, {"address": "964 Maeganeku, Onna Village, Kunigami District, Okinawa", "feature": "\u2b50 4.6 stars | Must-Buy List: Mango-pattern Kariyushi shirts, pure cotton tropical floral resort shirts, kids\u0027 floral shirts. Features: A famous local brand specializing in high-quality Okinawan Kariyushi Wear (Okinawan Hawaiian shirts). Located near the beach, the Onna store offers a variety of floral shirts designed by local Okinawan designers. Made from cool cotton-linen blends, they are perfect for wearing during a resort getaway on the west coast.", "name": "MANGO HOUSE Onna Store", "transport": "About a 50-minute drive from Naha Airport, or take bus No. 120 to \u0027Maeganeku\u0027 stop and walk for about 3 minutes."}, {"address": "2816 Onna, Onna Village, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | Must-Buy List: Classic \u0027Uminchu\u0027 slogan T-shirts, ocean-style canvas tote bags, Uminchu flip-flops. Features: A renowned Okinawan local brand famous worldwide for its iconic Kanji slogan \u0027Uminchu\u0027 (Sea Lover). Centered around ocean culture, the shop offers cotton T-shirts and water-resistant tote bags filled with seaside charm, making it a must-visit clothing store along the Onna coastline.", "name": "Uminchu Onna Store", "transport": "About a 55-minute drive from Naha Airport, or take bus No. 120 to \u0027Onna Shogakko-mae\u0027 stop and walk directly from there."}, {"address": "2260 Seragaki, Onna Village, Kunigami District, Okinawa (Inside ANA InterContinental Manza Beach Resort)", "feature": "\u2b50 4.7 stars | Must-Buy List: Premium silk resort shirts, beach-print maxi dresses, resort-style woven beach bags. Features: PAIKAJI is a high-end local Okinawan resort wear brand with a dedicated shop inside the Manza Beach Resort. Their shirts feature elegant, tropical motifs with exquisite tailoring, making them highly popular among travelers who appreciate premium clothing.", "name": "PAIKAJI ANA InterContinental Manza Beach Resort Shop", "transport": "About a 60-minute drive from Naha Airport, or take an airport limousine bus directly to ANA InterContinental Manza Beach Resort."}, {"address": "161-2 Toya, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.8 stars | Must-Buy List: Bohemian hand-woven bags, tropical embroidered beach dresses, shell-shaped jewelry pouches. Features: An independent fashion boutique in Yomitan with an exotic resort vibe, specializing in bohemian and ocean getaway styles. Their woven bags and beach dresses are carefully curated or originally designed, featuring exceptional quality and unique styles you won\u0027t easily see elsewhere.", "name": "BOHO Okinawa Yomitan", "transport": "About a 50-minute drive from Naha Airport, located near Toya Fishing Port."}, {"address": "642 Furugen, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.9 stars | Must-Buy List: Natural plant indigo-dyed T-shirts, handmade gradient indigo canvas bags, indigo-dyed motif silk scarves. Features: An independent local workshop in Yomitan that insists on using traditional Okinawan Ryukyu indigo plants for natural hand-dyeing. Each indigo-dyed shirt and canvas bag boasts a unique ocean-gradient blue, making this store a wonderful stop for handcrafted apparel and bags that combine artistic value with practicality.", "name": "Moonrise Studio Yomitan", "transport": "About a 50-minute drive from Naha Airport; driving by car is recommended."}, {"address": "466-1 Nagoya, Onna Village, Kunigami District, Okinawa", "feature": "\u2b50 4.4 stars | Must-Buy List: Okinawa bitter melon printed T-shirts, Okinawa-limited coarse salt charm pouches, Shisa lucky embroidery tote bags. Features: A local lifestyle and clothing boutique featuring cute and humorous designs. Famous for fun graphic T-shirts and canvas bags incorporating Okinawan specialties (such as bitter melon, Shisa lions, and Agu pork), offering budget-friendly prices and rich local flavor.", "name": "Starland Onna Store", "transport": "About a 55-minute drive from Naha Airport, located right off Route 58, the main road in Onna Village."}, {"address": "915 Takashiho, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Must-Buy List: Okinawan wave-pattern canvas bags, linen resort wide-leg pants, straw sun hats. Features: A stylish boutique located inside the seaside experience facility in Yomitan, featuring carefully selected resort wear, footwear, and accessories from emerging local Okinawan designers. Most clothing uses natural linen and lightweight fabrics, perfect for strolls and photo ops along the west coast beaches.", "name": "Gala Aoiumi Ocean Style Shop", "transport": "About a 60-minute drive from Naha Airport, or take bus No. 28 to \u0027Takashiho Iriguchi\u0027 stop and walk for about 15 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "657-1 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Original Purple Yam Tart (Beni-Imo Tart), Okinawa Brown Sugar Chinchuko, and Beni-Imo Raw Cheesecake Tart. This flagship location is the birthplace of Okinawa\u0027s ultra-popular purple sweet potato tarts. Connected directly to the factory, visitors can watch the automated production line through large glass windows. Made entirely from locally grown Yomitan purple sweet potatoes, these treats feature a dense, naturally sweet texture, making it an essential souvenir spot on Okinawa\u0027s west coast.", "name": "Okashigoten Yomitan Main Store", "transport": "About a 70-minute drive from Naha Airport; or take Bus No. 28 to \u0027Uza\u0027 stop and walk about 5 minutes."}, {"address": "915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Sea Salt \u0026 Brown Sugar Chinchuko, Sun-Dried Sea Salt, and Salted Milk Rusk. Located along Yomitan\u0027s beautiful coastline, this ocean salt-themed park features a refining workshop that crystallizes salt from pure Okinawan seawater. The shop specializes in exclusive snacks infused with local sea salt, creating a deliciously layered sweet and savory flavor profile. The elegant packaging makes them hugely popular among travelers.", "name": "Gala Aoiumi Salt Workshop", "transport": "About a 65-minute drive from Naha Airport; or take Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and walk about 20 minutes."}, {"address": "1656-9 Nakadomari, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Fresh Sata Andagi (Okinawan Doughnuts), Shikuwasa Jam, and Dried Sea Grapes. A hugely popular farm-to-table roadside station in Onna Village, gathering the freshest local produce and classic handmade snacks from the west coast. Enjoy freshly fried traditional Sata Andagi in various flavors, alongside exclusive fruit spreads and dried fruit developed with the local farmers\u0027 association\u2014making it a top pick for authentic local shopping.", "name": "Onna-no-Eki Nakayukui Market", "transport": "About a 50-minute drive from Naha Airport; or take Ryukyu Bus No. 120 to \u0027Nakadomari\u0027 stop and walk about 1 minute."}, {"address": "100 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Purple Yam Sandwich Cookies, Shikuwasa Cream Cake, and Bolsoo Brown Sugar Pie. A flagship coastal highway store in Onna Village styled after the main gate of ancient Ryukyu\u0027s Shuri Castle. Beyond the signature purple sweet potato treats, this store offers exclusive fruit-infused pastries, a generous tasting area, and an ocean-view observation deck for an exceptional shopping experience.", "name": "Okashigoten Onna Store", "transport": "About a 60-minute drive from Naha Airport; or take Bus No. 120 to \u0027Seragaki\u0027 stop and walk about 2 minutes."}, {"address": "2346-11 Kina, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Yomitan Dried Purple Sweet Potato, Handmade Wood-Fired Brown Sugar Cubes, and Dried Okinawa Mangoes. A large local farmers\u0027 market run directly by JA Okinawa, serving as a secret spot for savvy travelers to find authentic snacks. It features pure handmade brown sugar, additive-free dried fruits, and traditional rice crackers directly from local Yomitan farmers. Prices are much lower than at tourist hot spots, making it perfect for bulk purchases.", "name": "JA Okinawa Yunta Market", "transport": "About a 55-minute drive from Naha Airport; or take Bus No. 29 to \u0027Kina\u0027 stop and walk about 10 minutes."}, {"address": "1130 Yamada, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Ryukyu Awamori Bonbons, Traditional Brown Sugar Po-Po Cakes, and Okinawa Habu-Infused Ginger Gummy Candies. Located right at the entrance of the cultural village, this large gift shop can be accessed for free without buying a park admission ticket. It curates signature traditional sweets and artisan snacks from across Okinawa, especially old-style brown sugar delicacies and Awamori-filled candies rich in ancient Ryukyu heritage.", "name": "Ryukyu Mura Souvenir Shop", "transport": "About a 55-minute drive from Naha Airport; or take Bus No. 120 to \u0027Ryukyu Mura\u0027 stop (direct access)."}, {"address": "2878-1 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Manzamo-Exclusive Purple Yam Boston Cake, Sea Salt Shrimp Crackers, and Okinawa Brown Sugar Milk Sandwich Cookies. Located inside the modern visitor center at the iconic Cape Manzamo, this comprehensive shopping zone showcases independent Onna Village brands and local farm specialties. Featuring many elegant, uniquely flavored snack gift sets labeled \u0027Manzamo Exclusive\u0027, it is an ideal spot for gift shopping.", "name": "Manzamo Souvenir Shop", "transport": "About a 60-minute drive from Naha Airport; or take Bus No. 120 to \u0027Manzamo Iriguchi\u0027 stop and walk about 10 minutes."}, {"address": "2745 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: 100% Pure Yomitan Brown Sugar Cubes, Brown Sugar Ginger Candy, and Handmade Brown Sugar Peanut Crackers. Yomitan Village is a premier sugarcane-producing region in Okinawa. Directly operated by the local brown sugar producers\u0027 cooperative, this specialty shop slowly boils sugarcane juice using traditional wood-firing methods. The resulting pure brown sugar is rich, sweet, and mineral-packed\u2014a rare local delicacy seldom found in chain supermarkets.", "name": "Yomitan Brown Sugar Cooperative Shop", "transport": "About a 55-minute drive from Naha Airport; or take Bus No. 29 to \u0027Zakimi\u0027 stop and walk about 8 minutes."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted BEAMS trendy apparel, classic Gucci leather accessories, and Okinawa-exclusive Adidas sneakers. As Okinawa\u0027s only large-scale outlet mall, it offers extremely convenient access from the Onna West Coast resort area. The mall houses over 100 international luxury brands and high-end Japanese labels, offering incredible discounts and duty-free shopping. Designed in a European ancient Greek style, it provides a spacious and comfortable shopping experience.", "name": "Okinawa Outlet Mall ASHIBINAA", "transport": "Approx. 45 minutes by car from the Onna Village hotel area via the Okinawa Expressway (Kokuba IC / Tomigusuku-Nago Line)."}, {"address": "657-1 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Original Purple Yam Tarts, Brown Sugar Raw Chocolate Pies, and Purple Yam Baumkuchen. Designed after Shuri Castle of the Ryukyu Kingdom, this grand reddish-purple palace is Yomitan Village\u0027s iconic souvenir flagship store. Visitors can watch the automated production process of purple yam tarts through transparent glass windows while shopping for exclusive pastries made from local agricultural produce and exquisite Ryukyu glassware.", "name": "Okashigoten Yomitan Main Store", "transport": "Approx. 10 minutes by car from Yomitan Village Hall."}, {"address": "2653-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Handcrafted Ryukyu ceramic mugs, traditional arabesque-patterned ceramic plates, and handmade Shisa lion ornaments. Nestled in the lush hills of Yomitan Village, this traditional pottery village gathers nearly 20 independent ceramic workshops and joint retail galleries. It is a shopping paradise for fans of Japanese lifestyle goods and fine tableware. Every piece of pottery is hand-thrown by local masters and wood-fired in climbing kilns, exuding a rich Okinawan rustic aesthetic.", "name": "Yomitan Yachimun no Sato Ceramic Village", "transport": "Take Okinawa Bus No. 29, get off at \u0027Zakimi\u0027 stop, and walk for about 15 minutes."}, {"address": "1656-9 Nakadomari, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Mitsuya Honpo freshly fried Sata Andagi (Okinawan donuts), shaved ice stacked high with local Okinawa mangoes, and fresh Onna Village sea grapes. As the most popular local produce market in Onna Village, it perfectly showcases Okinawan agricultural and fishing village culture. Packed with stalls directly operated by local farmers and unique grocery shops, you can buy authentic Okinawan brown sugar, Awamori chili oil, and fresh tropical fruits, making it a must-visit shopping spot on the West Coast.", "name": "Nakayukui Market (Onna no Eki)", "transport": "Drive along National Route 58 to the Nakadomari Intersection in Onna Village."}, {"address": "915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Homemade sea salt soft-serve ice cream, premium crystallized salt gift sets, and hand-blown Ryukyu ocean-blue glassware. Situated along the coastline of Yomitan Village, this multi-faceted lifestyle shopping and experience park is centered around Okinawa\u0027s seawater salt-making culture. The complex features independent craft lifestyle shops and sea salt specialty stores, allowing visitors to shop for top-tier edible salts, salt-infused skincare products, and local artisan crafts while taking in stunning East China Sea ocean views.", "name": "Gala Ao-Umi Village", "transport": "Approx. 5 minutes by car from Cape Zanpa."}, {"address": "2767 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Manzamo Elephant Trunk Rock limited edition souvenir T-shirts, premium Onna Village Awamori, and handmade brown sugar peanut candy. Located next to the iconic Manzamo landmark in Okinawa, this modern three-story shopping facility gathers a variety of local Onna Village brands and souvenir shops. The second and third floors feature ocean-view restaurants and free observation decks, making it the top spot to enjoy panoramic sea views while shopping for region-exclusive creative merchandise and local specialties.", "name": "Manzamo Passenger Terminal Shop", "transport": "Drive along National Route 58 and turn into the dedicated Manzamo parking lot."}, {"address": "1861 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Zanpa brown sugar Awamori, Zanpa-exclusive sea salt peanut crackers, and Yomitan Hanaui woven handbags. Situated at the entrance of Cape Zanpa Lighthouse Park, this local-style shopping spot features a giant Shisa lion landmark standing in the plaza. The center specializes in local Yomitan agricultural products, exclusive brews from the famed \u0027Zanpa\u0027 Awamori distillery, and traditional Ryukyu Hanaui woven textiles.", "name": "Zampa Misaki Ikoi no Hiroba Ti-da 33", "transport": "Approx. 3 minutes on foot from Cape Zanpa Lighthouse."}, {"address": "1 Rycom, Kitanakagusuku Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Mont-bell Okinawa-themed moisture-wicking T-shirts, SuiSavon Handmade Organic Soaps, and duty-free electronics at Kojima x BicCamera. Although located in the neighboring Kitanakagusuku area, it is the top shopping destination for visitors staying in Onna and Yomitan resorts looking for big-ticket purchases. Housing over a hundred brand boutiques, a giant indoor aquarium, and dozens of local lifestyle shops, it offers a one-stop shop for Japanese fashion, electronics, and local Okinawan cosmetics.", "name": "AEON MALL Okinawa Rycom", "transport": "Approx. 25 minutes by car from the Onna Village resort hotel area via the Okinawa Expressway."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Onna West Coast and Yomitan Village"}, "shuri_culture": {"categories": {"cat_1": {"items": [{"address": "2-13 Shuri Touzang-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.8 stars | Must-Buy List: Ryukyu Sea Clay Handmade Facial Cleansing Cream, Subtle Fragrance Hand Cream, Shuri Shell Ginger Moisturizing Lotion. An iconic independent beauty brand born at the foot of Shuri Castle, showcasing natural local Okinawan botanical extracts such as shell ginger (gettou), Shekwasha citrus, and deep ocean water essence. The elegant store atmosphere offers hands-on cleansing trials. The handmade sea clay foam is dense and deeply hydrating, making it a sophisticated beauty shop you shouldn\u0027t miss when visiting Shuri.", "name": "SuiSavon Touzang Honten (Shuri Soap Touzang Main Store)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 10 minutes."}, {"address": "1-22 Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Okinawa Sea Salt Gentle Body Scrub, Ryukyu Mugwort Soothing Repair Balm, Natural Shell Ginger Hydrosol Spray. A local independent beauty boutique focusing on traditional Okinawan herbal remedies and natural organic ingredients. Locals highly recommend their repair balm made with Kume Island deep ocean water and Okinawan mugwort extract, which works wonders for soothing dryness and itching on sensitive skin with a gentle, non-greasy texture.", "name": "Ryukyu Botanicals Shuri Shop", "transport": "Take Bus No. 1 or 17 to \u0027Shurijo Koen Iriguchi\u0027 and walk for about 3 minutes."}, {"address": "1-41-1 Shuri Kumoji-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: LuLuLun Okinawa Limited Edition Shell Ginger Face Sheet Mask, Ryukyu Shekwasha Hand Cream, ChuraCosme Bitter Melon Resurfacing Moisturizing Essence. The premier drugstore chain in Kyushu and Okinawa. The Shuri branch is well-stocked and features a dedicated section for Okinawa-exclusive beauty products. Here, you can easily purchase sunscreens and skincare infused with local agricultural extracts, often accompanied by tax-free offers and discounts for tourists.", "name": "Drug Eleven Shuri Store", "transport": "Take the monorail to Gibo Station and walk about 5 minutes after exiting."}, {"address": "3-18 Shuri Akata-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Ryukyu Indigo Extract Handmade Lip Balm, Indigo Whitening \u0026 Brightening Serum, Shell Ginger Seed Anti-Aging Cleansing Oil. A unique independent workshop that merges Ryukyu Indigo\u2014the traditional Okinawan dye plant\u2014with modern skin science. Indigo offers excellent antibacterial and soothing properties. The store\u0027s custom lip balms feature all-natural ingredients and chic Okinawan-inspired packaging, making them extremely popular among female tourists.", "name": "Ryukyu Indigo Organic Beauty", "transport": "Take the monorail to Shuri Station and walk about 7 minutes after exiting."}, {"address": "4-1 Shuri Torihori-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: KOSE Okinawa Shekwasha Limited Edition High-Protection UV Spray, LuLuLun Okinawa Limited Edition Bitter Melon Firming Sheet Mask, Anessa Perfect UV Sunscreen Skincare Milk. Located next to Shuri Monorail Station, this flagship drugstore chain offers a vast array of popular Japanese cosmetics and Okinawa-exclusive items. The sought-after bitter melon sheet mask is rich in Vitamin C and a summer favorite for travelers, making restocking super convenient.", "name": "Matsumoto Kiyoshi Shuri Station Branch", "transport": "Take the monorail to Shuri Station; directly accessible from Exit 1."}, {"address": "1-68 Shuri Yamagawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawa Black Sea Clay Deep Cleansing Powder, Coral Calcium Intense Moisture Sheet Mask, Brown Sugar Hydrating Lip Balm. This locally owned boutique specializes in skincare crafted from Okinawa\u0027s unique mineral-rich sea mud (kucha), which effectively draws out pore impurities. Visitors can enjoy a complimentary hands-on sea mud mask treatment; skin feels noticeably smooth and hydrated after washing off, drawing countless tourists to try and buy.", "name": "Churaumi Sea Mud Beauty Shuri Castle Shop", "transport": "Take the bus to \u0027Yamagawa\u0027 stop and walk for about 2 minutes."}, {"address": "2-13 Shuri Gibo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: DHC Okinawa Shekwasha Vitamin C Gummies, Saborino Okinawa Limited Edition Morning Sheet Mask, Curel Moisture Care Trial Set. Featuring a spacious beauty and skincare section, this store has pharmacists and beauty consultants on-site to offer advice. In addition to trending beauty products, it stocks a wide variety of Okinawa-exclusive cosmetics and everyday health supplements, making it a top choice for both locals and tourists around the Shuri historical district.", "name": "Cocokara Fine Gibo Station Branch", "transport": "Take the monorail to Gibo Station and walk about 1 minute from Exit 2."}, {"address": "2-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Kume Island Deep Ocean Water Ultra-Hydrating Mist, Ryukyu Pearl Powder Brightening Mask, Okinawa Shekwasha Exfoliating Cream. Tucked away near the historic Shuri Kinjo-cho Stone-Paved Path, this charming independent beauty shop focuses on skincare derived from Okinawa\u0027s marine resources. Their signature pearl powder mask uses local cultivated pearl extracts to deliver visible skin brightening. It is a hidden gem that beautifully merges local heritage with skincare.", "name": "Ryukyu Ocean Beauty Kinjo-cho Shop", "transport": "Take the monorail to Shuri Station and walk for about 15 minutes; located near the entrance of the Kinjo-cho Stone-Paved Path."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1-54 Shuri Yamakawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Coral-dyed silk scarves, coral-print canvas tote bags, handmade Bingata pattern tote bags. A historic dyeing studio located near Shuri Castle, famous for its unique dye technique using natural coral fossils as stamps. The shop sells various original clothing items and totes combining traditional coral dyeing and Ryukyu Bingata. With excellent textures and a unique ocean-art vibe, these accessories add a warm, local touch to any outfit.", "name": "Shuri Ryusen", "transport": "Approx. 15-minute walk from Okinawa Urban Monorail (Yui Rail) Shuri Station, or a 2-minute walk from Yamakawa bus stop."}, {"address": "2-64 Shuri Toubara-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Handmade Shuri-hanaori ties, hand-woven pattern long wallets, Ryukyu fabric handbags. This center specializes in promoting \u0027Shuri-ori\u0027, a traditional weaving technique passed down from the Ryukyu Kingdom era. The shop features elegant clothing accessories and bags handcrafted by local artisans. The unique floral stripes and geometric patterns embody the aristocratic aesthetic of the Ryukyu royalty, making them both durable and culturally valuable.", "name": "Shuri-ori Crafts Center Shop", "transport": "Approx. 10-minute walk from Okinawa Urban Monorail (Yui Rail) Shuri Station."}, {"address": "4-9-1 Maeda, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buys: Handmade Bingata crossbody bags, traditional Ryukyu motif cotton-linen T-shirts, Bingata print coin purses. An iconic Bingata dye studio near the Shuri area that incorporates centuries-old traditional Okinawan dyeing techniques into modern apparel, shoes, and bag designs. Vibrant tropical flora, fauna, and wave patterns showcase strong Ryukyu charm, making it a favorite for travelers who love unique folk-style fashion.", "name": "Gusuku Bingata Dye Studio", "transport": "Approx. 12-minute walk from Okinawa Urban Monorail (Yui Rail) Kyozuka Station, or about an 8-minute drive from Shuri Castle."}, {"address": "2-13 Shuri Akata-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Leather short wallets combined with Yaeyama weaving, handmade cowhide tote bags, Ryukyu indigo-dyed leather belts. This local original leather craft brand seamlessly fuses premium handcrafted leather with traditional Okinawan textiles (such as Yaeyama Minsah and Shuri-hanaori). The leather develops a richer patina over time, featuring a sturdy feel and a design infused with the soul of local craftsmanship.", "name": "Ryukyu Leather LLA Shuri Workshop", "transport": "Approx. 6-minute walk from Okinawa Urban Monorail (Yui Rail) Shuri Station."}, {"address": "1-8-6 Kohagura, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Classic Kariyushi shirts, Okinawan floral print dresses, tropical woven totes. MAJUN is one of Okinawa\u0027s premier native Kariyushi Wear brands, featuring tailored cuts and modern aesthetics. Utilizing breathable, high-quality fabrics, they transform local elements like hibiscus flowers, bitter melons, and ocean waves into stylish clothing\u2014perfect for travel and resort wear.", "name": "MAJUN OKINAWA Apparel (Shuri Area Shop)", "transport": "Approx. 3-minute walk from Kohagura bus stop."}, {"address": "2-26 Furujima, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Pure cotton hand-drawn style Kariyushi shirts, tropical plant pattern canvas pouches, local casual sun hats. MANGO HOUSE is a highly popular local Okinawan original floral shirt specialty store featuring tropical designs created by local designers. The clothes feature vibrant colors and come in sizes ranging from infants to adults, making it the top choice for matching family outfits or unique resort wear.", "name": "MANGO HOUSE Kariyushi Wear (Near Shuri)", "transport": "Approx. 5-minute walk from Okinawa Urban Monorail (Yui Rail) Furujima Station."}, {"address": "1-9-47 Matsuo, Naha City, Okinawa Prefecture (Shuri Castle Area Branch)", "feature": "\u2b50 4.5 stars | Must-Buys: Premium silk-blend resort shirts, hand-sewn woven straw bags, Okinawan motif silk scarves. PAIKAJI is an internationally renowned high-end resort wear brand originating from Okinawa. The brand infuses Ryukyuan tropical culture into premium fabrics with impeccable tailoring. Its resort shirts and accessories combine luxury with breathable comfort, making them highly collectible.", "name": "PAIKAJI Tropical Apparel", "transport": "Approx. 8-minute walk from Okinawa Urban Monorail (Yui Rail) Kencho-mae Station, or about a 12-minute drive from Shuri Station."}, {"address": "2-14 Shuri Tozora-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: Natural botanical-dyed linen T-shirts, Ryukyu indigo canvas totes, handmade geta flip-flops. Tucked away in a historic alley near Shuri, this independent boutique specializes in handcrafted apparel, footwear, and bags dyed with local Okinawan plants (such as Fukugi and Ryukyu indigo). Its minimalist, natural aesthetic and comfortable cotton-linen fabrics are deeply loved by hipsters and locals alike.", "name": "Tsumugi Clothing \u0026 Craft Shuri", "transport": "Approx. 8-minute walk from Okinawa Urban Monorail (Yui Rail) Shuri Station."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-11 Shuri Tozucho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Traditional Ryukyu Kingdom Chinsuko (shortbread), Keiranko (egg cake), Hana-Chinsuko. A historic shop inheriting the craftsmanship of the Ryukyu Kingdom\u0027s royal pastry chef. Their Chinsuko strictly preserves the ancient serrated shape and elegant sweetness, featuring a crumbly texture with a delicate aroma\u2014a prestigious souvenir representing Shuri\u0027s history.", "name": "Arakaki Kami Confectionery - Shuri Castle Shop", "transport": "About a 10-minute walk from Shuri Station on the Okinawa Urban Monorail"}, {"address": "2-13 Shuri Tozucho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Ryukyu White Clay Cleansing Cream, Natural Essential Oil Handmade Soap, Hibiscus Moisturizing Hand Cream. A local Okinawan botanical skincare brand born in Shuri. Infused with brown sugar, Katsuren sea grapes, and various Okinawan botanical extracts, its refined fragrances and stylish artistic packaging make it immensely popular among female travelers.", "name": "SuiSavon - Shuri Soap Main Store", "transport": "About an 8-minute walk from Shuri Station on the Okinawa Urban Monorail"}, {"address": "1-35 Shuri Sakiyamacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: Zuisen Aged Awamori \u0027Seiryu\u0027, Shuri Castle Reconstruction Commemorative Awamori, Aged Awamori Heart-Shaped Brown Sugar Umeshu. A century-old famous Awamori distillery located just outside Shuri Castle\u0027s walls. Brewed using famous Shuri spring water and traditional black koji mold, it offers a rich, smooth flavor. Free tastings and distillery tours are available, making it a top souvenir choice steeped in history.", "name": "Zuisen Distillery", "transport": "About a 12-minute walk from Shuri Station on the Okinawa Urban Monorail"}, {"address": "1-29 Shuri Akahiracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade Limited-Edition Chinsuko, Ryukyu Layered Cake (Togei-mochi). This is the legendary old confectionery shop making Okinawa\u0027s most sought-after Chinsuko. Crafted entirely by hand in small batches by family members, it boasts an extraordinarily flaky, melt-in-your-mouth texture. Daily quantities are strictly limited and often sell out immediately upon opening.", "name": "Honke Arakaki Confectionery", "transport": "About a 5-minute walk from Gibo Station on the Okinawa Urban Monorail"}, {"address": "1-54 Shuri Yamagawacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Coral-dyed Shisa Furoshiki (wrapping cloth), Natural Plant-dyed Cotton/Linen Tote Bag, Coral-dyed Coasters. A traditional craft workshop that pioneered using cross-sections of fossilized coral for relief dyeing. It seamlessly blends Okinawa\u0027s natural colors into everyday household goods and textiles, combining cultural heritage with artistic elegance.", "name": "Shuri Ryusen", "transport": "About a 15-minute walk from Shuri Station on the Okinawa Urban Monorail, or take a city bus to \u0027Shurijo Koen Iriguchi\u0027 stop and walk for 2 minutes"}, {"address": "1-18-2 Shuri Kubagawacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buy list: Amuro Traditional Handmade Chinsuko, Fresh Egg Chinsuko Gift Box. A popular local sweet shop operated directly by its own poultry farm. It emphasizes using fresh daily eggs and high-quality lard, resulting in Chinsuko with a rich egg aroma and a delightfully crisp texture. Highly recommended by locals for its generous portions and reasonable prices.", "name": "Amuro Chinsuko Shop (Directly Operated by Amuro Poultry Farm)", "transport": "About a 5-minute walk from Shuri Station on the Okinawa Urban Monorail"}, {"address": "2-2 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Shuri Dunchi Secret Recipe Vacuum-packed Brown Sugar Stewed Pork Trotters, Ryukyu Island Chili Awamori Seasoning Oil, Handmade Ryukyu Glassware. A specialty gift shop attached to a traditional Okinawan house restaurant. It curates authentic Okinawan meal kits, exclusive condiments, and exquisite Ryukyu handicrafts, allowing visitors to bring the flavors of the ancient capital back home.", "name": "Shuri Dunchi Souvenir Shop", "transport": "About a 15-minute walk from Shuri Station on the Okinawa Urban Monorail, located near Kinjocho Stone-Paved Road"}, {"address": "1-2 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Shuri Castle Limited Red Yam Tart, Ryukyu Lacquerware Shisa Ornaments, Shuri Castle Reconstruction Charity Brown Sugar Crackers. The official large souvenir shop inside the \u0027Suimukan\u0027 visitor center at Shurijo Castle Park. It offers various exclusive charity and limited-edition souvenirs available only in the Shuri Castle area, with part of the proceeds contributing to the castle\u0027s reconstruction.", "name": "Suimukan Shop (Shurijo Castle Park Suimukan Souvenir Shop)", "transport": "About a 15-minute walk from Shuri Station on the Okinawa Urban Monorail to reach the entrance of Shurijo Castle Park"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: BEAMS discounted clothing, GUCCI on-sale bags, Adidas sneakers. As Okinawa\u0027s only large-scale outlet mall, Ashibinaa features Greek-inspired architecture and brings together over 100 world-renowned and premier Japanese brands. Off-season items are often discounted up to 70% off, making it a shopping paradise you shouldn\u0027t miss. Top brands like BEAMS and United Arrows offer exclusive deals, while sports enthusiasts can grab bargain sneakers at Nike and Adidas.", "name": "Okinawa Outlet Mall Ashibinaa", "transport": "Take the dedicated shuttle bus from Akamine Monorail Station (approx. 15 minutes)."}, {"address": "1-1-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Raku-fu handmade Shisa crafts, Kayanoya Okinawa-exclusive dashi stock packs, Shiseido Okinawa exclusive beauty sets. As Naha\u0027s only high-end heritage department store, it connects directly to Prefectural Office Station (Kenchomae), making it a key stop along the Shuri historical cultural route. The 8th floor features a large Loft store and MUJI, while the 2nd-floor lifestyle section showcases carefully selected traditional Ryukyuan crafts and local designer clothing, beloved by style-conscious locals.", "name": "Ryubo Department Store", "transport": "Take the Okinawa Urban Monorail to \u0027Kenchomae Station\u0027; 1-minute walk with direct access to the store."}, {"address": "4-4-9 Omoromachi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Okinawan Kariyushi shirts, Okinawa brown sugar sandwich cookies, discounted Japanese department-store cosmetics sets. The flagship shopping mall of Okinawa\u0027s retail giant San-A, this center is a go-to spot for both local residents and tourists in Naha and Shuri. It houses electronics store EDION, fashion brands GU and Uniqlo, and a well-stocked local supermarket, offering a convenient one-stop shopping experience for local specialties and everyday goods.", "name": "San-A Naha Main Place Shopping Center", "transport": "Take the Okinawa Urban Monorail to \u0027Omoromachi Station\u0027; approx. 5 minutes on foot."}, {"address": "1-54 Shuri Yamakawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Coral-dyed fabric bags, coral-dyed silk scarves, handmade coral-dyed apparel. Nestled in the historic town below Shuri Castle, this independent craft workshop and boutique boasts over 40 years of heritage. Using natural fossilized coral as stamps, artists employ traditional dyeing techniques to create unique clothing, bags, and lifestyle items. Blending Ryukyuan cultural heritage with contemporary aesthetics, it stands out as an iconic boutique in the Shuri area.", "name": "Shuri Ryusen", "transport": "Take the Okinawa Urban Monorail to \u0027Shuri Station\u0027 and walk for about 15 minutes, or transfer to a city bus and get off at \u0027Yamakawa\u0027 bus stop (2-minute walk)."}, {"address": "2-111-1 Shuri Ishimine-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Shuri Castle reconstruction commemorative Awamori, Okinawa-exclusive SPAM gift sets, Okashigoten purple yam tarts. Deeply rooted in the Shuri neighborhood, this local supermarket is perfect for experiencing daily life and picking up souvenirs. It features a spacious regional specialty section offering better prices than typical tourist spots, including rare aged Awamori spirits distilled locally in Shuri and classic Okinawan treats.", "name": "San-A V21 Shuri Store", "transport": "Take the Okinawa Urban Monorail to \u0027Ishimine Station\u0027; approx. 3 minutes on foot."}, {"address": "1 Rycom, Kitanakagusuku Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Mont-bell Okinawa-exclusive T-shirts, Orion Beer collaboration shirts, Penguin Shokudo special chili oil. Located in the suburbs near Naha and Shuri, this mega resort-style mall features over 100 stores and a massive aquarium. Highlights include a popular Mont-bell outdoor gear store selling exclusive regional designs, as well as boutique stalls featuring local Okinawan artisan crafts and regional brands, offering an impressive variety of products.", "name": "Aeon Mall Okinawa Rycom", "transport": "Take an express bus (such as No. 152) from Shuri or Naha Bus Terminal directly to \u0027AEON MALL Okinawa Rycom\u0027 bus stop."}, {"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture (inside Suimui Kan)", "feature": "\u2b50 4.2 stars | Must-Buy List: Shurijo Castle lacquerware teacups, traditional Ryukyu indigo-dyed tote bags, traditional Shuri Chinsuko shortbreads. Located inside the Suimui Kan center in Shurijo Castle Park, this souvenir and boutique shop is steeped in Ryukyu Kingdom history. It offers exclusive castle-themed handicrafts like artisan lacquerware, indigo-dyed textiles, and beautifully packaged local sweets. A portion of the sales goes directly toward the reconstruction fund for Shuri Castle, making every purchase meaningful.", "name": "Suimui Kan Shop (Shurijo Castle Park)", "transport": "Take the Okinawa Urban Monorail to \u0027Shuri Station\u0027; approx. 15 minutes on foot to the Shurijo Castle Park entrance."}, {"address": "3-2-10 Makishi, Naha City, Okinawa Prefecture (Tenbusu Naha 2nd Floor)", "feature": "\u2b50 4.5 stars | Must-Buy List: Ryukyu glass artisan cups, Tsuboya-yaki ceramic teabowls, hand-woven Shuri-ori silk ties. Located at the edge of the Kokusai Dori shopping district connected to the Shuri cultural area, this shop combines craft exhibition with retail. It features curated pieces from award-winning Ryukyuan master artisans, including traditional Shuri-ori woven textiles, handmade Ryukyu glassware, and Tsuboya pottery, showcasing the finest authentic Okinawan craftsmanship.", "name": "Naha City Traditional Crafts Center Shop", "transport": "Take the Okinawa Urban Monorail to \u0027Makishi Station\u0027; approx. 5 minutes on foot."}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Shuri Castle and Historic Cultural Area"}, "southern_senaga": {"categories": {"cat_1": {"items": [{"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture (Umikaji Terrace No. 42)", "feature": "\u2b50 4.6 stars | Must-buy list: Soft Color Cleansing Silk Cream, Essential Oil Handcrafted Cube Soap, Alpinia (Getto) Moisturizing Hand Cream. A local Okinawan fragrance and cosmetics brand located right on the oceanfront of Senagajima. It emphasizes natural Okinawan plant extracts such as shell ginger (Getto), acerola, and deep ocean water. The store\u0027s crisp white Greek-style decor echoes the ocean view, making it highly iconic. The handmade soaps have a refreshing scent and look like delicate desserts, making it the top cosmetic souvenir choice when visiting Senagajima.", "name": "SuiSavon - Shuri Soap - Senagajima Umikaji Terrace Branch", "transport": "About 15 minutes from Naha Airport by taking the Senagajima Shuttle Bus or a taxi to the Umikaji Terrace shopping area."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture (Inside Okinawa Outlet Mall Ashibinaa)", "feature": "\u2b50 4.4 stars | Must-buy list: Miyakojima Snow Salt Body Scrub, Ryukyu Sea Salt Moisturizing Bath Salts, Sea Salt Purifying Mineral Soap. Located inside Outlet Mall Ashibinaa in the south, this specialty salt beauty section highlights skincare products refined from sea salt harvested from Okinawa\u0027s pristine waters. Rich in natural sea salt minerals, these products effectively soften cuticles and hydrate the skin, making them hugely popular among Japanese women and foreign tourists.", "name": "Shioya Okinawa Salt Spa Beauty Section - Outlet Mall Ashibinaa Branch", "transport": "Direct access in about 20 minutes from Naha Airport by taking the No. 95 Outlet Direct Express Bus."}, {"address": "539 Chinen Kudeken, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Okinawa Natural Sea Silt (Kucha) Deep Cleansing Powder, Nanjo Getto Essence Moisturizing Mist, Organic Bitter Melon Extract Soothing Facial Mask. Located near the World Heritage site Sefa-Utaki, this produce center features a special southern local herbal cosmetics section. It showcases skincare products developed by local farmers and artisan studios in southern Okinawa, highlighting additive-free, natural Ryukyu beauty wisdom.", "name": "Nanjo Regional Produce Center - Ryukyu Botanical Skincare Section", "transport": "About 45 minutes by car from downtown Naha via National Route 331 heading toward Nanjo."}, {"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture (Inside Umikaji Terrace)", "feature": "\u2b50 4.7 stars | Must-buy list: Okinawa Ocean-Friendly Physical Sunscreen, Natural Sea Salt After-Sun Repair Gel, Organic Coconut Oil Lip Balm. A local eco-friendly sunscreen and cosmetics store created to protect Okinawa\u0027s beautiful ocean and coral reefs. Free from marine-damaging chemicals, its products offer high sun protection while keeping skin hydrated, making it a Holy Grail skincare choice for water sports enthusiasts in the south.", "name": "Coral Friendly Sunscreen Shop - Senagajima Branch", "transport": "Take the Senagajima Sightseeing Bus, get off at Umikaji Terrace Station, and walk for 1 minute."}, {"address": "3-35 Toyosaki, Tomigusuku City, Okinawa Prefecture (iiAS Okinawa Toyosaki 2F)", "feature": "\u2b50 4.5 stars | Must-buy list: Warabihada All-in-One Gel, Churaclear White Clay Foam Cleanser, Churatooth Whitening Toothpaste. Flagship counter of CHURACOS, a famous local Okinawan skincare brand, located inside the large southern mall iiAS. The entire product line features natural Okinawan ingredients like aloe vera, Job\u0027s tears (Coix seed), and Shekwasha (Okinawan citrus). Gentle and non-irritating, it\u0027s a benchmark brand representing Okinawa\u0027s natural skincare culture.", "name": "CHURACOS Okinawa Natural Skincare Store - iiAS Okinawa Toyosaki Branch", "transport": "Take route bus No. 56 or No. 98 from Naha Airport, get off at \u0027Toyosaki Chura-Sun Beach Mae\u0027, and walk for 3 minutes."}, {"address": "3-35 Toyosaki, Tomigusuku City, Okinawa Prefecture (iiAS Okinawa Toyosaki 1F)", "feature": "\u2b50 4.3 stars | Must-buy list: LuLuLun Okinawa Limited Edition Bitter Melon Sheet Mask, Okinawa Hibiscus Moisturizing Hand Cream, Ryukyu Kucha Sea Silt Oil Control Face Wash. An all-in-one drugstore inside a spacious, modern mall in the newly developed Toyosaki area in the south. It features a dedicated large section for \u0027Okinawa Limited Edition Beauty Souvenirs,\u0027 offering a one-stop shop for popular Japanese cosmetics and local Okinawan skincare specialty items.", "name": "Satudora Drugstore - iiAS Okinawa Toyosaki Branch", "transport": "About 20 minutes by car heading south along National Route 331 from Naha Airport."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture (Ashibinaa 1F)", "feature": "\u2b50 4.2 stars | Must-buy list: Shiseido Okinawa Limited Edition Beauty Lotion, Kracie Hadabisei Okinawa Hop Extract Moisturizing Mask, Horse Oil Ryukyu Purple Sweet Potato Nourishing Cream. A major chain drugstore inside the famous outlet mall in southern Okinawa. In addition to top-tier Japanese cosmetics and pharmaceuticals, it offers great discounts on exclusive Ryukyu skincare specialties\u2014super convenient for stocking up right after shopping for designer bags.", "name": "Cocokara Fine Drugstore - Outlet Mall Ashibinaa Branch", "transport": "About 15 minutes by taking the dedicated Outlet shuttle bus from Akamine Monorail Station in Naha."}, {"address": "400 Kanegusuku, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: ONEC Local Herbal Toner, Okinawa Black Sugar Hydrating Lip Balm, Curel Sensitive Skin Moisturizing Set. A large tax-included drugstore offering exceptional value in Itoman City in the south, known for its highly competitive prices. The inventory is extremely comprehensive, ranging from dermo-cosmetic products to local Okinawan herbal skincare, making it an insider restock destination for locals and self-drive tourists alike.", "name": "Discount Drug COSMOS - Itoman Branch", "transport": "About 2 minutes by car from the Kanegusuku Intersection on Itoman Road (National Route 331)."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture (Umikaji Terrace Shop No. 06)", "feature": "\u2b50 4.6 stars | Must-Buys: Okinawa-themed graphic T-shirts, bitter melon embroidered socks, original canvas tote bags. HabuBox is Okinawa\u0027s iconic local original apparel brand, fusing Okinawa\u0027s famous venomous pit viper (\u0027Habu\u0027) with local ocean culture. Located on the oceanfront row of Senagajima (Umikaji Terrace), this store offers exclusive resort-style apparel and high-quality pure cotton tees, making it a favorite among local youth and tourists alike.", "name": "HabuBox Senagajima Store (HabuBox Umikaji Terrace)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Akamine Station\u0027, transfer to the dedicated Senagajima shuttle bus, get off at \u0027Senagajima Umikaji Terrace\u0027, and walk for 1 minute."}, {"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture (Umikaji Terrace Shop No. 36)", "feature": "\u2b50 4.4 stars | Must-Buys: Original Ryukyu-style graphic T-shirts, Shisa embroidered baseball caps, original collab pouches. A T-shirt specialty store showcasing works from local Okinawan designers and artists. Styles range from traditional Ryukyu patterns and American vintage to cute illustrations. Made with durable, washable fabrics, it\u0027s the perfect spot to pick up clothing featuring authentic local culture.", "name": "T-SHIRT-YA.COM Senagajima Store (T-SHIRT-YA.COM Umikaji Terrace)", "transport": "Take the Okinawa Urban Monorail to \u0027Akamine Station\u0027, transfer to the shuttle bus, get off at \u0027Senagajima Umikaji Terrace\u0027, and walk for 2 minutes."}, {"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture (Umikaji Terrace Shop No. 25)", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawan Shisa graphic hoodies, ocean-inspired handmade canvas bags, stylish beach shorts. A local streetwear shop designed around the concept of the Shisa, Okinawa\u0027s traditional guardian lion. Cleverly transforming traditional mascots into modern street-fashion prints, these high-quality and unique pieces let you effortlessly embody a vibrant Okinawan island vibe.", "name": "SHISA WEAR Senagajima Store (SHISA WEAR Umikaji Terrace)", "transport": "Take the Okinawa Urban Monorail to \u0027Akamine Station\u0027, transfer to the shuttle bus, get off at \u0027Senagajima Umikaji Terrace\u0027, and walk for 2 minutes."}, {"address": "1-411 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buys: Premium floral Kariyushi shirts, linen-blend casual resort shirts, original print men\u0027s belts. MAJUN is Okinawa\u0027s premier authentic Kariyushi Wear (Okinawan resort/business shirt) brand. Designed and manufactured locally in Okinawa, their apparel uses highly breathable, comfortable fabrics paired with exquisite tropical floral motifs. It is the top choice for local professionals and businesspeople, as well as high-quality clothing well worth collecting.", "name": "MAJUN OKINAWA Toyosaki", "transport": "About 15 minutes by car from Naha Airport, or take Ryukyu Bus No. 56 to \u0027Toyosaki 3-Chome\u0027 stop and walk for 3 minutes."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture (Ashibinaa Outlet Mall 1F)", "feature": "\u2b50 4.5 stars | Must-Buys: BEAMS heart-logo Japanese fashion, resort-style woven crossbody bags, collaboration casual canvas shoes. An outlet store of the famous Japanese select shop brand BEAMS, located inside Ashibinaa Outlet Mall. Featuring American casual and Japanese trendwear, shoppers can often snag past-season limited bags and stylish women\u0027s apparel at 30% to 70% off, making it a favorite for young fashion enthusiasts.", "name": "BEAMS OUTLET Okinawa (Ashibinaa)", "transport": "Take the direct express Bus No. 95 from Naha Airport and get off at \u0027ASHIBINAA Outlet\u0027."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture (Ashibinaa Outlet Mall 2F)", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawa-exclusive Vans skate shoes, discounted Nike running shoes, Hawkins lightweight waterproof casual shoes. A giant footwear discount outlet located inside the major southern outlet mall. Gathering last-pairs and past-season styles from famous brands, the prices here are highly competitive. Beyond international sportswear brands, you can also find Japan-exclusive casual shoes and loafers, making it the top destination for shoe shopping in southern Okinawa.", "name": "ABC-MART OUTLET Okinawa Outlet Mall Ashibinaa", "transport": "Take the direct express Bus No. 95 from Naha Airport and get off at \u0027ASHIBINAA Outlet\u0027."}, {"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture (Ashibinaa Outlet Mall 1F)", "feature": "\u2b50 4.6 stars | Must-Buys: Alpha series business backpacks, lightweight scratch-resistant 20-inch carry-on luggage, ballistic nylon crossbody bags. The only outlet location in Okinawa for TUMI, the luxury American business bag brand. Featuring their famous backpacks and suitcases crafted from durable ballistic nylon, prices are significantly lower than downtown boutiques, making it perfect for business travelers or anyone seeking ultimate durability.", "name": "TUMI OUTLET Okinawa Outlet Mall Ashibinaa", "transport": "Take the direct express Bus No. 95 from Naha Airport and get off at \u0027ASHIBINAA Outlet\u0027."}, {"address": "3-35 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Made-in-Japan selvedge denim jeans, American retro graphic tees, multi-pocket utility vests. A multi-brand denim and streetwear outlet store located in the southern Toyosaki shopping area. Bringing together numerous Japanese local denim brands and imported casual wear, it offers a wide range of beautifully cut Okayama jeans as well as trendy shoes and bags. A must-visit store for fans of Japanese workwear and denim style.", "name": "JEANS FACTORY OUTLET Toyosaki", "transport": "About 15 minutes by car from Naha Airport, or take Ryukyu Bus No. 56 to \u0027Toyosaki Michi-no-Eki\u0027 stop and walk for 5 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "174-6 Senaga, Tomigusuku, Okinawa (Senagajima Umikaji Terrace No. 28)", "feature": "\u2b50 4.4 stars | Must-buy list: Kokuto (Brown Sugar) Baumkuchen (Gajumaru), Beni-imo (Purple Yam) Baumkuchen (Beni-imo), Honey Baumkuchen (Honoka). A specialized Baumkuchen bakery located right on the oceanfront of Senagajima. It bakes treats on-site using carefully selected local Okinawan brown sugar, purple yams, and eggs. With a slightly crispy exterior and a moist, dense interior, it\u0027s a top souvenir choice for visitors to Senagajima.", "name": "Fukugiya Senagajima Branch", "transport": "Drive or take the Senagajima Shuttle Bus to \u0027Senagajima Umikaji Terrace\u0027 stop, then walk about 1 minute."}, {"address": "174-6 Senaga, Tomigusuku, Okinawa (Senagajima Umikaji Terrace No. 33)", "feature": "\u2b50 4.3 stars | Must-buy list: Okinawan Pineapple Bite-sized Pies, Mango Sandwich Cookies, Passion Fruit Jelly. An independent souvenir boutique specializing in tropical fruit desserts from Okinawa, featuring exquisite pastries made with premium Nago pineapples and brown sugar. Sweet, non-sticky, and packaged in vibrant summer island style\u2014perfect for gifting friends and family.", "name": "Pineapple Sweets KUKURU Senagajima Branch", "transport": "Take the Senagajima Shuttle Bus to \u0027Senagajima Umikaji Terrace\u0027 stop, then walk about 2 minutes."}, {"address": "4-19-1 Nishizakicho, Itoman, Okinawa", "feature": "\u2b50 4.5 stars | Must-buy list: Okinawan Sea Grapes (Umi-budo), Brown Sugar Peanut Candy, Itoman Seaweed Senbei (Rice Crackers). Located at Japan\u0027s southernmost Roadside Station (Michi-no-Eki), this center boasts the most comprehensive collection of local farm produce and dried seafood in southern Okinawa. Freshly harvested sea grapes are available at great prices, and the souvenir area features numerous brown sugar snacks from long-established southern workshops.", "name": "Michi-no-Eki Itoman Souvenir Center", "transport": "Drive approx. 15 minutes from Naha Airport; or take Naha Bus No. 89 to \u0027Nishizaki 2-chome\u0027 stop and walk for about 10 minutes."}, {"address": "1336 Tamagusuku Maekawa, Nanjo, Okinawa (Inside Okinawa World)", "feature": "\u2b50 4.2 stars | Must-buy list: Okinawa Habushu (Snake Sake), OKINAWA SANGO BEER (Coral Beer), Ryukyu Brown Sugar Awamori Plum Wine. A local brewery located inside Okinawa World. It brews beer and Awamori using pure coral water drawn from 100 meters beneath Gyokusendo Cave. Signature offerings include their unique stamina-boosting snake liquor infused with whole pit vipers, as well as Coral Beer boasting a distinct malty aroma.", "name": "Nanto Brewery at Okinawa World", "transport": "Take Ryukyu Bus No. 50 or 83 and get off at \u0027Gyokusendo-mae\u0027 stop."}, {"address": "541 Chinen Kudeken, Nanjo, Okinawa", "feature": "\u2b50 4.1 stars | Must-buy list: Nan-jii (Nanjo mascot) butter cookies, Okinawa Mozuku seaweed dip sauce, Chinen Misaki-shaped Chinsuko (shortbread). A local produce and tourist center near Cape Chinen Park specializing in unique snacks from Nanjo and the southern region. The Nan-jii butter cookies are especially recommended\u2014cute, delicious, and loved by families with children.", "name": "Ganjudake Station Nanjo Souvenir Shop", "transport": "Take Toyo Bus No. 38 to \u0027Sefa-Utaki Iriguchi\u0027 stop, then walk about 3 minutes."}, {"address": "9 Tamagusuku Ou, Nanjo, Okinawa", "feature": "\u2b50 4.4 stars | Must-buy list: Okinawan seaweed tempura-flavored rice crackers, Island Chili \u0026 Awamori Koshu infused soy sauce, handmade salted roasted peanuts. A famous shop on Ou Island known for fried tempura, featuring an adjacent local specialty section. It sells handmade dried seafood from local fishermen and special island chili condiments\u2014a hidden gem for insider snack hunting.", "name": "Nakamoto Tempura \u0026 Local Souvenir Shop (Ou Island)", "transport": "Drive across Ou Bridge to arrive directly; or take Nanjo Community Bus N1 to \u0027Oujima\u0027 stop."}, {"address": "1336 Tamagusuku Maekawa, Nanjo, Okinawa (Inside Okinawa World)", "feature": "\u2b50 4.3 stars | Must-buy list: 35 Coral Roasted Drip Coffee Bags, Hibiscus High-Fiber Black Tea, 35 Coffee Flavored Brown Sugar Biscuits. Okinawa\u0027s unique eco-friendly coffee brand roasts beans at 200\u00b0C using dead, weathered coral, donating 3.5% of its revenue to local coral restoration. The coffee is smooth without acidity, making it, along with exquisite hibiscus tea bags, an exceptionally popular gift.", "name": "35 COFFEE Okinawa World Branch", "transport": "Take Ryukyu Bus No. 83 to \u0027Gyokusendo-mae\u0027 stop."}, {"address": "1 Gushichan, Yaese-cho, Shimajiri District, Okinawa", "feature": "\u2b50 4.0 stars | Must-buy list: Yaese specialty purple yam chips, Okinawan fermented tofu (Tofu-yo), handmade brown sugar ginger cubes. Located in Yaese Town\u2014an agricultural heartland of southern Okinawa\u2014this center highlights purple yam and brown sugar products contract-farmed with local smallholders. The ultra-thin sliced purple yam chips are crisp, sweet, free of artificial food coloring, and showcase pure local southern flavor.", "name": "Yaese Town Local Products Shop", "transport": "Take Ryukyu Bus No. 50 to \u0027Gushichan\u0027 stop, then walk about 5 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "5-1 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Discounted off-season apparel from BEAMS and UNITED ARROWS, classic Coach leather bags, and Okinawa-exclusive UV protection sportswear. Located in Tomigusuku City in southern Okinawa, ASHIBINAA is Okinawa\u0027s only large-scale outlet mall, featuring a Greek Revival architectural design. It brings together over 100 world-renowned international brands and popular Japanese boutique selection stores, including GUCCI, Armani, and Japanese trend labels. Tourists can not only take advantage of tax-free shopping but also enjoy stacked discounts year-round, making it an unmissable shopping paradise in southern Okinawa.", "name": "Okinawa Outlet Mall Ashibinaa", "transport": "About a 15-minute ride via Direct Bus No. 95 from Naha Airport."}, {"address": "3-35 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: DMM Kariyushi Aquarium exclusive sea creature merchandise, locally brewed Okinawa craft beer gift sets, and LoFt Okinawa-exclusive beauty and lifestyle goods. Newly opened in 2020, this giant complex shopping mall sits adjacent to the beautiful Toyosaki Beach, seamlessly combining an aquarium, a large supermarket, and over 200 shops. Alongside major brands like LoFt, Uniqlo, and Kojima Electronics, it features numerous local southern Okinawan brands, offering an extraordinarily comfortable ocean-view shopping environment that is perfect for the whole family.", "name": "iias Okinawa Toyosaki", "transport": "About a 20-minute drive from Naha Airport, or take the Airport Trunk Line Bus and get off at the \u0027iias Okinawa Toyosaki\u0027 stop."}, {"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buy list: SuiSavon Shuri Soap handmade scented cube soaps, natural Okinawan coral silver bracelets, and Ryukyu indigo-dyed original cotton/linen shirts. Set right on the oceanfront of Senaga Island, this pure white terraced complex houses many independent local creators and designer boutiques. Exuding a Mediterranean resort charm, you can admire stunning ocean views and watch airplanes take off and land while shopping for unique handmade accessories and local botanical skincare products, making it a quintessentially Okinawan destination.", "name": "Senagajima Umikaji Terrace Boutique Street", "transport": "About a 20-minute ride on the Senagajima Express Bus (TK02) from Naha Airport."}, {"address": "4-19-1 Nishizakicho, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buy list: Itoman sea salt brown sugar cookies, famous local Awamori liquor \u0027Umi no Kuni\u0027, and farm-direct passion fruit spread. As the southernmost roadside station in Japan, it has been voted one of Japan\u0027s best roadside stations for multiple consecutive years. The product hall offers an extraordinarily rich selection of southern Okinawan agricultural specialties and limited-edition souvenirs, many produced directly by local small farms and artisan workshops. Offering superior freshness and great value, it is a wonderful place to experience local life and purchase regional specialties.", "name": "Roadside Station Itoman - Yukura Souvenir Market", "transport": "About a 25-minute drive from downtown Naha, or take City Bus No. 89 to \u0027Nishizaki 2-chome\u0027 stop and walk for 10 minutes."}, {"address": "169 Fukuji, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Handmade rainbow Ryukyu glass tumblers, Ryukyu glass art trivets, and handcrafted Shisa ceramic figurines. Located in Itoman City, Ryukyu Glass Village is the largest glass craft theme center in southern Okinawa. Its boutique shop displays and sells hand-blown Ryukyu glass creations crafted by local artisans, with every piece boasting unique textures and vibrant colors. Highly artistic and practical, these crafts make beautiful additions to your dining table and cherished Okinawan mementos.", "name": "Ryukyu Glass Village Craft Shop", "transport": "About a 30-minute drive from Naha Airport, or take Bus No. 82 and get off at the \u0027Ryukyu Glass Village\u0027 stop."}, {"address": "539 Chinen Kudeken, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-buy list: Nanjo City mascot \u0027Nanjii\u0027 plushies, traditional handmade black sugar blocks, and Kudaka Island turmeric wellness tea. Located near the entrance to the sacred Sefa-Utaki, the Nanjo City Product Center is the premier spot for local specialties. Packed with snacks and crafts made from southern regional crops, it also features highly popular merchandise shaped like the beloved mascot Nanjii, making it an excellent stop to pick up authentic souvenirs when visiting Nanjo City.", "name": "Nanjo City Product Center", "transport": "Take Bus No. 38 from Naha Bus Terminal, get off at \u0027Sefa-Utaki Iriguchi\u0027 stop, and walk for about 3 minutes."}, {"address": "250 Miyahira, Haebaru Town, Shimajiri District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-buy list: Okinawa-exclusive Orion beer nut snack packs, Okashigoten purple yam tart gift boxes, and Okinawa floral edition LuLuLun face masks. Beloved by southern local residents, this large shopping center features a massive AEON supermarket along with various apparel and lifestyle stores. Compared to malls in downtown Naha, it offers a more spacious environment and an authentic local everyday feel, making it easy to stock up on Okinawa\u0027s most complete range of food products, exclusive snacks, and local cosmetics, complete with tax-free services.", "name": "AEON Haebaru Shopping Center", "transport": "About a 10-minute taxi ride from Okinawa Urban Monorail (Yui Rail) \u0027Shuri Station\u0027."}, {"address": "1336 Tamagusuku Maekawa, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-buy list: Tradi
