i Carnival Park Mihama", "transport": "About 40 minutes by car heading north along Route 58 from downtown Naha; or take Bus No. 120, get off at \u0027Mihama American Village Entrance\u0027, and walk for 5 minutes."}, {"address": "15-68 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Must-buy list: Hokkaido horse oil extra-moisturizing cream (Okinawa limited edition), Okinawa sea salt soothing foot patches, Curel intensive moisture care cream for dry sensitive skin. Featuring a spacious, bright store layout with smooth shopping flow, it carries top-selling beauty items from Hokkaido, Japan, as well as a dedicated section for Okinawa-exclusive beauty products.", "name": "Sapporo Drugstore Chatan American Village", "transport": "Take Bus Route 28 from Naha Bus Terminal, get off at \u0027Mihama American Village Entrance\u0027, and walk for 5 minutes."}, {"address": "1F, AEON Chatan, 8-3 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Must-buy list: KOSE Sekkisei Okinawa limited sunscreen set, Chifure moisturizing serum, Okinawa mineral sea mud deep cleansing mask. Located on the 1st floor of the AEON Chatan shopping mall, it brings together top Japanese high-end counter brands like Shiseido, Kanebo, and KOSE alongside affordable drugstore brands. It offers a wide variety of products and frequently features exclusive promotional bundles.", "name": "AEON Chatan Beauty Department", "transport": "Take Bus No. 20, 28, 29, or 120, get off at \u0027Gunbyoin-mae\u0027 (Naval Hospital) stop, and walk for about 3 minutes."}], "name": "Local Representative Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Depot Island Building A, 9-12 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Must-buy list: Vintage American jackets, Okinawa-exclusive US military-style graphic T-shirts, and Workwear/Amekaji military backpacks. The most iconic two-story American vintage and select shop in American Village. Packed with second-hand vintage directly imported from the US, military surplus gear, and various casual American wear, it\u0027s a must-visit destination for fans of vintage American style and bag hunters.", "name": "American Depot", "transport": "Take Bus No. 120 from Naha Airport, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 7 minutes."}, {"address": "Depot Island Building B 1F, 9-6 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | Must-buy list: Okinawa bitter melon graphic tees, exclusive patented 5-toe rainbow socks, and Ryukyu wave canvas tote bags. Established in 1979, this original local Okinawan apparel brand is famous for blending traditional Ryukyu elements with American humor. Made from extremely comfortable and breathable cotton, its designs are steeped in Okinawan culture, highly recommended by locals and tourists alike.", "name": "HabuBox (HabuBox Chatan Branch)", "transport": "Take Bus No. 20 or 120, get off at \u0027Kuae\u0027 stop, and walk for about 8 minutes."}, {"address": "Depot Island Building A B1F-2F, 9-12 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Must-buy list: Premium EVISU denim jeans, Vans Okinawa store-exclusive sneakers, and US military embroidered flight jackets. A spacious multi-brand American streetwear store located in Depot Island, spanning from the basement to the 2nd floor. It brings together denim, American streetwear brands, military jackets, and a rich variety of exclusive imported boots, sneakers, and bags.", "name": "SOHO (SOHO Chatan Mihama Branch)", "transport": "Take Bus No. 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 7 minutes."}, {"address": "Depot Island Building C 1F, 9-7 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.6 stars | Must-buy list: Hibiscus Ryukyu Hawaiian shirts, Okinawa Shisa casual shirts, and breathable cotton-linen handmade slip-ons. A famous local chain specializing in authentic Okinawa \u0027Kariyushi Wear\u0027, with all shirts designed and made locally in Okinawa. Patterns cleverly incorporate hibiscus flowers, bitter melons, and Shisa lions. Cut perfectly for Asian fits, it is the top choice for authentic local clothing.", "name": "Mango House (Mango House Chatan Branch)", "transport": "Take Bus No. 28 or 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 6 minutes."}, {"address": "Depot Island Building A 1F, 9-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Must-buy list: Original Ryukyu Lion embroidered T-shirts, Okinawa beer-style graphic hoodies, and Bingata dye-style canvas tote bags. An original T-shirt specialty shop bringing together works from various up-and-coming local Okinawan designers. Themes range from traditional Ryukyu motifs to US military culture and marine life. Features diverse cuts and thick, durable, wash-resistant fabrics that hold their shape.", "name": "T-shirt Ya.com (T-shirt Ya.com Chatan Branch)", "transport": "Take Bus No. 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 7 minutes."}, {"address": "Depot Island Central 1F, 9-2 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Must-buy list: OKINAWA MARKET original American mascot T-shirts, vintage army-green washed canvas pouches, and American embroidered baseball caps. Located along the Mihama coastal boardwalk with a rich retro American general store vibe. It seamlessly blends Okinawan charm with classic American cartoon aesthetics, offering lively and cute original apparel, hats, and daily tote bags that are huge hits with younger crowds.", "name": "OKINAWA MARKET (OKINAWA MARKET American Village Branch)", "transport": "Take Bus No. 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 8 minutes."}, {"address": "Depot Island Building A 2F, 9-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Must-buy list: Vintage American biker leather jackets, heavy motorcycle style graphic vests, and US military suede work boots. A niche specialty shop focusing on hardcore American biker style and retro garage aesthetics. Styled like a vintage American motorcycle garage inside, it displays high-quality leather jackets, cargo pants, and rugged shoes/bags, attracting local fashion enthusiasts seeking unique personal style.", "name": "Garage House (Garage House Chatan Branch)", "transport": "Take Bus No. 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 7 minutes."}, {"address": "Depot Island Central 2F, 9-2 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.1 stars | Must-buy list: Nike Okinawa-exclusive colorway sneakers, Adidas retro classic casual shoes, and GORE-TEX waterproof outdoor trail shoes. One of the few top-tier Grand Stage flagship stores in Okinawa. Beyond standard footwear, it carries a wide selection of limited-edition sneakers, trendy collaboration shoes, and technical outdoor bags, making it a must-visit spot when shopping for shoes in Chatan Mihama.", "name": "ABC-MART Grand Stage (ABC-MART Grand Stage Chatan Branch)", "transport": "Take Bus No. 120, get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, and walk for about 8 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Original Beni-Imo (Red Sweet Potato) Tarts, Princess Moon Mango Cake, Brown Sugar Chinsuko. As Okinawa\u0027s most iconic historic confectionery brand, this Chatan store near American Village features a grand exterior resembling Shuri Castle. Their famous Beni-Imo Tarts are made from 100% local Okinawan purple sweet potatoes, offering a dense, silky texture that isn\u0027t overly sweet\u2014the absolute #1 souvenir you can\u0027t miss in Okinawa.", "name": "Okashigoten Chatan", "transport": "Take Bus No. 120 from Naha Airport, get off at \u0027Gun Byoin-mae\u0027 (Military Hospital) stop, and walk for about 7 minutes."}, {"address": "2F Distortion Seaside Bldg, 9-46 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Single-Origin Okinawa Brown Sugar Dark Chocolate, Raw Cacao Nibs with Brown Sugar, Handcrafted Cacao Tea. Located in the seaside building of American Village, this specialty shop is Okinawa\u0027s first Bean-to-Bar artisanal chocolate shop. It expertly pairs locally produced Okinawan brown sugar with premium cacao beans from around the world to craft distinctive local flavors. Beautifully packaged with great texture, it\u0027s a huge favorite among hipsters and design lovers.", "name": "TIMELESS CHOCOLATE", "transport": "Located within American Village, about a 3-minute walk along the coastal promenade from Depot Island."}, {"address": "1F Depot Island Bldg, 9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Yukisio (Snow Salt) Chinsuko, Miyakojima Snow Salt, Okinawan Flavored Table Salt Set. Shiya is a specialized salt shop in Japan bringing together dozens of unique specialty salts from across Okinawa, including the renowned Miyakojima Snow Salt. Beyond cooking salts and gift boxes, they offer famous Snow Salt soft-serve ice cream topped with various flavored salts (like Yuzu or Matcha salt)\u2014a must-visit spot in American Village.", "name": "Shiya Salt House Chatan", "transport": "Located within the Depot Island shopping district in American Village, easily reachable on foot."}, {"address": "1F Depot Island Building A, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: 35 COFFEE Coral Roasted Drip Coffee Bags, 35 CHILI Hibiscus Chili Powder, Coral Bleaching Awareness Commemorative Mug. This famous Okinawa-exclusive coffee brand uses dead fossilized coral to roast coffee beans at high temperatures, donating 3.5% of its revenue to local coral reef restoration efforts. Offering a unique aroma and stylish drip bag packaging, it makes a meaningful, delicious, and eco-friendly gift.", "name": "35 COFFEE Depot Island", "transport": "Located on 1F, Depot Island Building A in American Village."}, {"address": "54-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Chatan Craft IPA Canned Gift Box, Okinawa Spent Grain Flavored Nuts, Original Metal Bottle Opener. Located next to Mihama Harbor, this craft brewery shop features premium beers brewed on-site. Formulated specifically to complement Okinawa\u0027s tropical climate, their brews burst with rich tropical fruit aromas and crisp refreshment. The gift sets are perfect for enjoying back at your hotel or giving as high-quality souvenirs.", "name": "Chatan Harbor Brewery Shop", "transport": "About an 8-minute walk from the central part of American Village toward the harbor."}, {"address": "1F Depot Building B, 9-12 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Okinawan Goya (Bitter Melon) Motif Socks, Original Habu Snake American-style Graphic Tee, Okinawa-exclusive Brown Sugar Rice Crackers. Established decades ago, HabuBox is a trendy Okinawan lifestyle and clothing brand. Its American Village store blends American retro vibes with Ryukyuan style. Aside from creative locally-themed apparel, their custom-packaged cultural snacks and novelty items are a huge hit among visitors.", "name": "HabuBox American Village", "transport": "Located on 1F, Depot Building B in American Village."}, {"address": "Depot Island Building C, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Okinawa Brown Sugar Shrimp Crackers, Pengin Shokudo Ishigaki Island Chili Oil, Shisa Ryukyu Glass Ornaments. Situated right in the heart of American Village, this souvenir shop gathers Okinawa\u0027s most popular snacks, condiments, and crafts under one roof. If you want to grab classic Ishigaki chili oil, brown sugar biscuits, and handmade Ryukyu glassware all at once, this shop offers an extensive selection.", "name": "Depot Island Souvenir Shop", "transport": "Located in the central area of Zone C, Depot Island in American Village."}, {"address": "8-3 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Orion Beer Flavored Peanut Snacks (Bulk Pack), Okinawa Soba Instant Noodles, Okinawa-exclusive Brown Sugar Potato Chips. Located on 1F of the large AEON Shopping Center next to American Village, this massive souvenir section offers great prices\u2014often cheaper than dedicated tourist spots. With an extensive range of goods, it\u0027s the best place to buy bulk local snacks, Orion Beer snack pairings, and Awamori liquor gift sets.", "name": "AEON Chatan Souvenir Section", "transport": "Located across from the main entrance of American Village, about a 3-minute walk from Kuwae Bus Stop."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Must-Buy List: Discounted Gucci bags, BEAMS limited edition collaboration apparel, Coach discounted leather wallets. As Okinawa\u0027s only major OUTLET mall, it\u0027s about a 40-minute drive from Chatan. Featuring an open-air Greek mythology-inspired architectural design, it houses over 100 world-renowned luxury brands and Japanese trendy labels. Offering year-round discounts ranging from 30% to 70% off, from designer goods to casual sportswear, it\u0027s a shopping paradise you absolutely cannot miss when visiting Okinawa.", "name": "Okinawa Outlet Mall Ashibinaa", "transport": "About a 40-minute drive from Chatan Mihama via Route 58 or by sightseeing bus."}, {"address": "8-3 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Okinawa-exclusive Brown Sugar \u0026 Snow Salt Biscuits, Orion Beer-flavored snack packs, Shiseido Anessa Okinawa limited edition sunscreen. Located at the entrance of American Village, this core local shopping center features a massive supermarket where travelers can buy local souvenirs and fresh food in one go, along with budget-friendly clothing and cosmetics counters. Its prime location and highly competitive prices make it the best restock point for both Chatan residents and foreign tourists.", "name": "AEON Chatan Shopping Center", "transport": "Opposite the former landmark Ferris wheel site in Mihama American Village, about a 2-minute walk."}, {"address": "1 Rycom, Kitanakagusuku-son, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Rycom-exclusive Purple Yam Tart gift box, Mont-bell outdoor windbreakers, traditional Okinawa Awamori chili oil. Just a 10-minute drive from Chatan, this is Okinawa\u0027s largest mega shopping mall complex. The first floor boasts an impressive giant aquarium, and the mall houses over 200 stores, including major international brands and unique Japanese select shops. The food court offers abundant choices along with an ocean-view terrace, making it perfect for the whole family to relax and shop all day long.", "name": "AEON MALL Okinawa Rycom", "transport": "About a 10-minute drive from Chatan American Village, or take Bus No. 52 directly from Chatan Bus Stop."}, {"address": "9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Vintage American military jackets, Okinawa-themed retro graphic tees, Hawaiian shirts. As the most iconic American-style select shop in the Chatan Mihama area, it stands out with an eye-catching giant statue at the entrance. The store brings together a vast collection of vintage items imported directly from the US, second-hand jeans, US military surplus gear, and uniquely designed Okinawa-themed tees. Overflowing with a strong West Coast retro vibe, it highlights unique local culture.", "name": "American Depot", "transport": "Located at the entrance of the Depot Island area in American Village, a 3-minute walk from Mihama Seaside Park."}, {"address": "9-20 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Must-Buy List: Original bitter melon print T-shirts, Ishigaki beef themed socks, Okinawa sea snake embroidered baseball caps. An original local streetwear brand established nearly 40 years ago in Okinawa, seamlessly blending local elements like bitter melon, Sanshin instruments, and Shisa lions with American street fashion. Its uniquely developed fabrics are exceptionally breathable and suited for tropical climates, making it the top destination in Chatan for stylish, unique Okinawan souvenirs.", "name": "Habu Box Chatan Store", "transport": "Located along the Boardwalk at American Village, a 1-minute walk within the prime oceanfront area."}, {"address": "9-12 Mihama (Depot Building B), Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-Buy List: Alpha Industries flight jackets, US military surplus classic denim jeans, American-style metal accessories. Tucked away in the basement and 1st floor of Depot Island, this huge independent select shop displays tens of thousands of American street fashion and military items\u2014a true treasure trove for fans of American style. Steeped in a unique vibe influenced by the local US military base culture, it\u0027s a great place to hunt for out-of-print pieces or heavily discounted American brand apparel.", "name": "SOHO Chatan", "transport": "Located in Building B (B1 to 1F) of the Depot Island complex in American Village."}, {"address": "9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-Buy List: Exclusive American Village logo stickers, original American graffiti surf shorts, handmade Okinawan keychains. This local boutique is filled with American graffiti style and Okinawan coastal vibes. Designed exclusively by local artists, the products are full of energy and humor, ranging from original apparel and lifestyle goods to cute postcards, attracting many young visitors who love beach resort style.", "name": "OKINAWA MARKET", "transport": "Located next to the landmark clock tower at the entrance of American Village, a 1-minute walk."}, {"address": "9-21 Mihama (Depot Island Seaside 1F), Chatan-cho, Nakagami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-Buy List: Handmade Okinawa sea salt scented candles, handcrafted Ryukyu double-walled glass cups, Okinawan beach waterproof bags. Located along the waterfront promenade in the Seaside area of American Village, this store specializes in ocean-resort-style lifestyle goods and exquisite handicrafts. Featuring carefully selected works by local Okinawan artisans combined with modern American home aesthetics, the items are of exceptionally high quality\u2014perfect for picking up elegant lifestyle souvenirs that capture memories of Okinawa\u0027s west coast.", "name": "Depot Island Seaside BOKS SHOP", "transport": "Located on the 1st floor of the Depot Island Seaside building along the Mihama coast, facing the West Coast ocean view."}], "name": "Major Department Stores \u0026 Recommended OUTLETs"}}, "name": "Chatan Area and American Village"}, "kouri_yanbaru": {"categories": {"cat_1": {"items": [{"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Kouri Island Exclusive Organic Shell Ginger Hydrating Mist, Sea Salt Repair Scrub, Beautifying Pumpkin Soap. Perched inside the observation tower shop high above Kouri Island, this store offers natural skincare products incorporating local ingredients like pumpkin and shell ginger. The shell ginger mist boasts an elegant fragrance and excellent moisture-locking properties, making it a favorite among vacationing women.", "name": "Kouri Ocean Tower Shop \u0026 Beauty Corner", "transport": "By car: Take the Kyoda IC, drive through Yagaji Island, and cross the Kouri Bridge (approx. 40-minute drive)."}, {"address": "1F AEON Nago Shopping Center, 4470 Nago, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Ryukyu White Marine Clay Facial Cleansing Cream, Fragrant Essential Oil Hand Cream, Shekwasha Eau de Toilette. Okinawa\u0027s iconic local artisanal organic beauty brand, carefully selecting local natural ingredients like Yanbaru Shekwasha, hibiscus, and Ryukyu marine clay. The marine clay cleanser creates dense foam that draws out deep impurities. Conveniently located inside AEON Nago, the gateway to Yanbaru.", "name": "SuiSavon Shuri Soap AEON Nago", "transport": "By car: Drive along Route 58 into downtown Nago. AEON Nago provides a large free parking lot."}, {"address": "2-21-1 Daito, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Okinawa Goya Anti-Acne Cleansing Foam, Snake Oil Ultra-Hydrating Hand Cream, Ryukyu Beautifying Sheet Masks. One of the most iconic local drugstore chains in Kyushu and Okinawa. The Nago branch is fully stocked with a dedicated local Okinawa beauty section. Here, you can find exclusive skincare products infused with local natural extracts at affordable prices with frequent discounts.", "name": "Drug Eleven Nago", "transport": "Take the Okinawa Bus Nago Line to \u0027Daito\u0027 stop and walk about 3 minutes, or drive there directly."}, {"address": "1421-1 Kenken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: 100% Yanbaru Organic Shell Ginger Floral Water, Shekwasha Soothing Essential Oil Balm, Coral Mud Deep Cleansing Powder. An independent local brand focused on plant extracts from the Yanbaru nature reserve. All beauty products use organic ingredients sourced from contract farms in northern Okinawa. The shell ginger hydrosol is highly recommended for its refreshing texture and excellent soothing and repairing effects, bringing the essence of the Yanbaru forest into your skincare routine.", "name": "Yanbaru Botanical Beauty Shop", "transport": "By car: Take Route 449 toward Motobu Town; located near Motobu Port (approx. 50-minute drive)."}, {"address": "904-5 Biwamata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Okinawa Exclusive Hibiscus Lip Balm, Shiseido Whitening Essence, Mugwort Heating Patches. A renowned Japanese drugstore chain located in Nago City, the gateway to northern Okinawa. It\u0027s the perfect stop to stock up on medicines and trendy cosmetics before heading into Yanbaru. Offers multilingual signage, full tax-free services, and a rich selection of Okinawa-exclusive skincare products.", "name": "Matsumoto Kiyoshi Nago Biwamata", "transport": "By car: Drive along Route 58 and turn at the Biwamata Intersection; located along the main thoroughfare in northern Nago."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Kyoda Exclusive Snake Oil Beautifying Cream, Yanbaru Shekwasha Lip Balm, Seaweed Polysaccharide Hydrating Sheet Mask. Located at a must-visit roadside station (Michi-no-Eki) on the way to Kouri Island and Yanbaru, its beauty section brings together specialty skincare products crafted by local small farmers and workshops in northern Okinawa. The snake oil cream is exceptionally moisturizing for autumn and winter and is a long-standing local hidden gem.", "name": "Michi-no-Eki Kyoda Subtropical Beauty \u0026 Local Products Hall", "transport": "By car: Drive on the Okinawa Expressway and exit at \u0027Kyoda IC\u0027."}, {"address": "7-25-11 Miyazato, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Ryukyu Brown Sugar Hand Cream, Sake Lees Brightening Mask, Medicated Whitening Eye Cream. A large chain drugstore in downtown Nago offering highly competitive prices on pharmaceuticals and cosmetics. In addition to mainstream Japanese luxury and drugstore beauty brands, it features a regional Okinawa cosmetics section with nourishing sheet masks and skincare products made with local brown sugar and Ryukyu sake lees.", "name": "Sundrug Nago", "transport": "Take the Nago City Bus to \u0027Miyazato\u0027 stop, or drive and park at the store\u0027s free parking lot."}, {"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Churaumi Deep Sea Water Mist, Jellyfish Collagen Serum, Sea Anemone Repair Night Cream. A unique independent beauty shop near Okinawa Churaumi Aquarium in Motobu Town, themed around northern Okinawa deep sea water and marine extracts. Products emphasize marine mineral hydration power, featuring beautiful Okinawan ocean-inspired packaging, making them wonderful souvenirs.", "name": "Churaumi Ocean Botanical Beauty Shop", "transport": "By car: Take Kyoda IC, drive along Route 58 and Route 449 toward Churaumi Aquarium (approx. 50-minute drive)."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Kouri limited-edition ocean print T-shirts, natural shell woven tote bags, Okinawa-style resort print maxi dresses. Located in the observation tower shopping area at the highest point of Kouri Island, this spot offers not only stunning ocean views but also a special area dedicated to local clothing and accessories. The shop features exclusive apparel inspired by Heart Rock and Kouri\u0027s blue sea, made with highly breathable natural cotton and linen\u2014a favorite among vacationing tourists.", "name": "Kouri Ocean Tower Shell \u0026 Boutique Shop", "transport": "About a 35-minute drive from Kyoda IC; accessible right after crossing the Kouri Bridge."}, {"address": "132 Kijoka, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Ryukyu indigo dyed pure cotton T-shirts, handmade indigo gradient linen scarves, artisan-style tote bags. Nestled in the pristine forests of Yanbaru, this rustic studio insists on using locally grown Ryukyu indigo plants for pure, natural hand-dyeing and weaving. Every item of clothing and handbag features unique water ripple patterns and gradient blues, perfectly capturing the imagery of Yanbaru\u0027s nature and deep blue ocean. It is a highly representative and premium local apparel brand.", "name": "Yanbaru Natural Indigo \u0026 Textile Studio", "transport": "About a 30-minute drive north along Route 58 from Nago City center."}, {"address": "230 Nakasone, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Handwoven natural Shell Ginger (Getto) leaf tote bags, Okinawa-style woven straw hats, Getto fiber canvas pouches. A unique local craft shop in Nakijin Village that uses dried leaves of Okinawa\u0027s signature Getto plant for pure handweaving. The resulting bags carry a subtle, natural herbal fragrance, are durable, and are perfect for beach vacations or daily wear\u2014highly favored by locals and tourists who love natural textures.", "name": "Nakijin Getto Woven Bags \u0026 Craft", "transport": "About an 8-minute drive from the Nakijin Castle Ruins."}, {"address": "142 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Okinawan floral shirts (\u0027Kariyushi Wear\u0027), Yanbaru Rail mascot tote bags, hemp sandals. This select shop brings together works from local designers in the northern Yanbaru region, focusing on resort wear that blends Okinawan culture with modern fashion. The store\u0027s most iconic items are Kariyushi shirts printed with tropical plants and endemic Yanbaru birds. Lightweight and breathable, slipping one on immediately immerses you in Okinawa\u0027s sunny beach resort vibe.", "name": "Yanbaru Select \u0026 Kariyushi Wear", "transport": "About a 10-minute drive from the Okinawa Churaumi Aquarium."}, {"address": "323-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Kouri Sunset quick-dry surf T-shirts, waterproof beach canvas backpacks, handmade shell-decorated flip-flops. Located right by the beach on Kouri Island, this small shop is tailored for outdoor and water sports enthusiasts. It offers sun-protective yet stylish beachwear and durable waterproof bags in vibrant, sun-kissed colors\u2014the top destination on Kouri Island for cool, casual beach outfits.", "name": "Kouri Island Breeze Apparel", "transport": "Turn left after crossing the Kouri Bridge; about a 3-minute walk."}, {"address": "454 Kijoka, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Bashofu hand-crafted coin purses, Bashofu fiber casual hats, national treasure-level Bashofu pattern fashion accessories. Located in Kijoka, Ogimi Village, Bashofu (banana fiber cloth) is one of Okinawa\u0027s most iconic designated Important Intangible Cultural Properties. This craft center incorporates ancient Bashofu weaving techniques into modern clothing accessories, offering lightweight, durable, and highly textured totes and hats\u2014each piece embodying the passion and historic beauty of Yanbaru artisans.", "name": "Ogimi Bashofu Craft \u0026 Apparel", "transport": "Turn off Route 58 into the Kijoka village area; about a 5-minute drive."}, {"address": "1108 Izumi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Heavy canvas waterproof shoulder tote bags, handmade leather key pouches, Okinawan plant-dyed bucket bags. Tucked away in the lush greenery of northern Yanbaru, this handmade studio features designs crafted from high-quality Japanese canvas and naturally tanned leather, combined with local botanical dyeing techniques to create minimal and durable bags. Featuring clean lines, large capacity, and high wear resistance, they are ideal for travel and outdoor use.", "name": "Yanbaru Canvas \u0026 Leather Bags Studio", "transport": "Drive along Route 84 (Izumi Mikan Highway) to reach."}, {"address": "119-1 Hentona, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Yanbaru Rail print organic cotton T-shirts, wooden-button cotton-linen crossbody bags, sun protection sun hats. Located in Kunigami Village at the northernmost tip of Okinawa\u0027s main island, this store aims to promote the Yanbaru World Natural Heritage site by designing organic cotton apparel featuring local forest wildlife and rare plants. Comfortable fabrics paired with charming, quality illustrations make these items practical and memorable, hugely popular with eco-conscious travelers and nature lovers.", "name": "Kunigami Yambaru Nature T-Shirt \u0026 Lifestyle", "transport": "Located in the Hentona Shopping Street of Kunigami Village, about a 40-minute drive from Nago City center."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Kouri Island Pumpkin Tart, Heart Shell Accessories, Pumpkin Cheesecake. Located inside the Kouri Ocean Tower, this specialty shop comes highly recommended for its pumpkin tarts and cakes made from locally grown organic pumpkins. Rich, velvety, and beautifully packaged, they are the top choice for souvenirs right after crossing the Kouri Bridge.", "name": "Kouri Ocean Tower Shop", "transport": "By Car: About a 35-minute drive from Kyoda IC. Go straight after crossing the Kouri Bridge to reach the shop. Free parking available."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Freshly Fried Sata Andagi (Okinawan Donuts), Agu Pork Jerky, Yanbaru Shikuwasa Juice. Acclaimed as Okinawa\u0027s #1 roadside station, it gathers specialty products and agricultural produce from all over northern Yanbaru. The freshly fried Sata Andagi are crispy on the outside, fluffy on the inside, and wonderfully fragrant\u2014pair them with a bottle of pure Yanbaru Shikuwasa juice to refresh your palate.", "name": "Michi-no-Eki Kyoda Souvenir Center", "transport": "By Car: Take the Okinawa Expressway, exit at Kyoda IC, and drive straight for about 1 minute."}, {"address": "1570-1 Okuma, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Kunigami Exclusive Tofu Donuts, Yanbaru Rail Handmade Cookies, Hinoki Wood Carving Crafts. Located at the northernmost point of Okinawa\u0027s main island, this roadside station sells a variety of charming goods inspired by the precious Yanbaru Nature Reserve. Don\u0027t miss the donuts made with local soy milk and tofu\u2014dense, subtly sweet, and wonderfully non-greasy.", "name": "Yui Yui Kunigami Roadside Station", "transport": "By Car: Drive north from Nago City along Route 58 for about 40 minutes."}, {"address": "1220-71 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: 100% Katsuyama Fresh-Squeezed Shikuwasa Juice, Shikuwasa Jam, Specialty Shikuwasa Fruit Soy Sauce. The region encompassing Nago and Ogimi is famous for longevity and Shikuwasa (citrus). This factory store offers free tastings of Shikuwasa juices with varying sourness levels. All-natural, additive-free, and rich in Vitamin C, it is a huge favorite among health-conscious travelers.", "name": "Okinawa Katsuyama Shikuwasa Park", "transport": "By Car: About a 15-minute drive from central Nago City. Large free parking lot available on site."}, {"address": "1195 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Pineapple Premium Cake, Sparkling Pineapple Wine, Dried Pineapple Slices. Boasting the largest pineapple-themed souvenir shop in northern Okinawa, this location offers award-winning pineapple cakes with a perfectly balanced sweet-and-sour, moist texture. Enjoy generous samples and locally produced pineapple wines while browsing.", "name": "Nago Pineapple Park Gift Shop", "transport": "By Car: About a 20-minute drive from Kyoda IC. Free shuttle bus and a large parking lot provided."}, {"address": "2-2-37 Agarie, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Orion Flavored Mixed Nuts, Orion Collaboration T-shirts, Beer Yeast Rice Crackers. The birthplace of Okinawa\u2019s iconic local beer brand, Orion, this gift shop offers factory-exclusive merchandise. The savory, addictively crunchy beer nuts are the ultimate snack to pair with drinks.", "name": "Orion Happy Park Souvenir Shop", "transport": "By Foot: About a 10-minute walk from Nago Bus Terminal. By Car: Parking available at the brewery park."}, {"address": "1301-11 Namino, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Ogimi Village Fragrant Green Tea Bags, Yanbaru Brown Sugar Blocks, Local Handmade Sea Salt Cookies. Situated right along a picturesque coastline, this nature-oriented roadside station promotes pesticide-free local produce and natural crafts. Capturing the authentic, rustic charm of Yanbaru, it\u0027s the ideal spot to pick up authentic specialties from this famous \u0027Village of Longevity\u0027.", "name": "Michi-no-Eki Ogimi Yanbaru Forest Roadside Station", "transport": "By Car: Head north along Route 58 and drive for about 3 minutes after crossing the Shioya Bridge."}, {"address": "323-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Kouri Island Sea Urchin Sauce Crackers, Local Purple Sweet Potato Tarts, Handmade Kouri Brown Sugar Granules. Located near the island end of the Kouri Bridge, this community market features fresh produce harvested by local farmers along with exclusive souvenirs. The unique sea urchin flavored snacks are a regional specialty you won\u0027t find anywhere else.", "name": "Kouri Island Fureai Hiroba Souvenir Shop", "transport": "By Car: Turn left immediately after crossing the Kouri Bridge. Large parking lot available."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-buys: Gucci clutches, popular Adidas sneakers, BEAMS trendy jackets. As Okinawa\u0027s only large outdoor outlet mall, it features over 100 international luxury and Japanese trendy brands. The architecture blends European style with traditional Okinawan red tile elements, offering incredible discount deals. It is a luxury shopping paradise you definitely shouldn\u0027t miss when exploring Okinawa.", "name": "Outlet Mall Ashibinaa", "transport": "About a 20-minute ride on the direct Bus No. 95 from Naha Airport"}, {"address": "4472 Nago, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-buys: Okinawa-exclusive purple yam tarts, Orion Beer collaboration T-shirts, Okinawa brown sugar cookies. Located in the heart of Nago City in the north, this major comprehensive department store is the top choice for restocking before heading to Kouri Island and Yanbaru Nature Reserve. It features a large supermarket, Japanese fashion brands, and various local souvenir counters, making it a favorite among locals and tourists alike.", "name": "AEON Nago Shopping Center", "transport": "About a 15-minute drive after exiting at the Kyoda Interchange"}, {"address": "2-21-1 Daito, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buys: San-A exclusive Snow Salt biscuits, Okinawa Awamori chili oil, locally produced Shikuwasa juice. As the largest northern branch of San-A, Okinawa\u0027s major local retail giant, it offers a rich selection of local products and domestic Japanese fashion. It provides a comfortable shopping environment with high-value local cosmetics and daily necessities.", "name": "San-A Nago Main City", "transport": "Drive north along National Route 58 to Nago City center"}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buys: Kouri Island limited pumpkin cream puffs, Heart Rock-shaped crackers, Kouri-grown blueberry jam. Located inside the core attraction of Kouri Island\u2014the Ocean Tower\u2014this exclusive souvenir store sells limited-edition desserts made from organic pumpkins and blueberries grown on Kouri Island, alongside a section for exquisite handmade seashell accessories.", "name": "Kouri Ocean Tower Shop", "transport": "About a 5-minute drive after crossing Kouri Bridge from Yagaji Island"}, {"address": "1605 Okuma, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-buys: Hand-carved wooden Yanbaru rail figurines, Kunigami Village high-mountain tea, Yanbaru butterfly ginger fragrance spray. Situated at the entrance of the Yanbaru Nature Reserve, this specialty market gathers unique woodcrafts from the Yanbaru forest, wild herbal teas, and traditional handicrafts. It is a fantastic spot to support local conservation while picking up authentic, handmade Yanbaru gifts.", "name": "Yui Yui Kunigami Market", "transport": "Drive all the way north along National Route 58 to Okuma, Kunigami Village"}, {"address": "1195 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-buys: Pineapple white chocolate cake, Nago pineapple wine, pineapple hydrating face masks. A large themed shopping venue dedicated to showcasing and selling pineapple-based products. It features an on-site pineapple winery and exclusive pineapple cosmetics, offering a vibrant tropical vibe along with free tasting samples.", "name": "Nago Pineapple Park Souvenir Store", "transport": "About a 20-minute drive after exiting at the Kyoda Interchange"}, {"address": "4 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-buys: Motobu-produced bonito flakes, hand-dyed Okinawan floral fabric bags, local ceramic coffee cups. Located near Nakijin Village and Kouri Island, this retro hipster market gathers independent shops run by local up-and-coming designers and artisans. Preserving a nostalgic, rustic charm, it is the perfect spot to find one-of-a-kind handcrafted local goods.", "name": "Motobu Town Local Market", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium"}, {"address": "1220-71 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-buys: Mango gummies, Shikuwasa lip balm, tropical dried fruit gift boxes. A spacious shopping arcade located within the northern tropical park, specializing in skincare products, snacks, and lifestyle goods derived from local Okinawan tropical fruits. Its comfortable environment makes it ideal for families to browse for souvenirs together.", "name": "Okinawa Fruit Land Shopping Arcade", "transport": "About a 20-minute drive after exiting at the Kyoda Interchange, right next to Nago Pineapple Park"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Kouri Island and Yanbaru Nature Area"}, "motobu_churaumi": {"categories": {"cat_1": {"items": [{"address": "1421-4 Yamakawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Ala MAHAINA SHOPPING CENTER)", "feature": "\u2b50 4.8 stars | Must-Buy List: Ryukyu White Sea Clay Dual-Action Facial Cleansing Paste, Handcrafted Essential Oil Soap, Hibiscus Moisturizing Hand Cream. A premium local cosmetics brand from Okinawa, tailored specifically for Okinawa\u0027s climate and skin types. Using natural local ingredients like Shekwasha (Okinawan citrus), Shell Ginger leaves, deep sea water, and brown sugar, their skincare products feature dense, creamy cleansing foam and deeply soothing fragrances. An indispensable high-end beauty souvenir when visiting Motobu!", "name": "SuiSavon -Shuri Soap- Motobu Hanasaki Marche Branch", "transport": "About a 5-minute drive from the Okinawa Churaumi Aquarium."}, {"address": "1421-4 Yamakawa, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawa-exclusive LuLuLun Bitter Melon/Shekwasha Face Masks, Ryukyu Sea Salt Body Scrub, Okinawa Purple Sweet Potato Moisturizing Face Mask. A spacious drugstore located inside the Motobu Hanasaki Marche ocean-view complex. Beyond a comprehensive selection of Japanese cosmetics and essential medicines, it features an extensive Okinawa-limited beauty corner, making tax-free shopping and hunting for exclusive Okinawan skincare incredibly convenient for tourists.", "name": "Satudora / Sapporo Drug Store Okinawa Motobu Store", "transport": "About a 4-minute drive from Okinawa Churaumi Aquarium, located inside the Hanasaki Marche complex."}, {"address": "2830 Izumi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Pure Organic Shell Ginger (Getto) Hydrosol, Yanbaru Citrus Essential Oil Insect Repellent \u0026 Hydrating Spray, Shell Ginger Seed Anti-Aging Facial Oil. An independent local skincare brand rooted in the mountainous Izumi area of Motobu. They specialize in skincare products extracted from \u0027Getto\u0027 (Shell Ginger), a traditional Okinawan plant natively cultivated in the Yanbaru region. Renowned for its exceptional antioxidant and moisturizing properties, their all-natural, chemical-free line is a favorite among local women and eco-conscious skincare enthusiasts.", "name": "Yanbaru Getto Natural Beauty Workshop", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium, driving along County Road 84 towards Izumi."}, {"address": "857-1 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Okinawa Brown Sugar Repair Lip Balm, Ryukyu Sea Mud Deep Cleansing Foam, Cooling Deodorant Body Spray. A neighborhood drugstore located near Toguchi Port in Motobu, offering a more authentic local community vibe compared to typical tourist chains. Besides well-stocked pharmaceutical items, you can discover hidden gems like domestic marine-element cosmetics and great-value moisturizing creams.", "name": "Drug SEIMS Motobu Store", "transport": "About a 3-minute drive from Motobu Port, or about an 8-minute walk from Toguchi Port."}, {"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Churaumi Plaza, Ocean Expo Park)", "feature": "\u2b50 4.4 stars | Must-Buy List: Churaumi Deep Sea Water Hydrating Mist, Marine Collagen Hydrating Sheet Mask, Ryukyu Seaweed Extract Hand Cream. A specialized beauty counter located in the souvenir section of Churaumi Plaza inside Ocean Expo Park. It features exclusive skincare lines developed using pure deep sea water and rich ocean minerals from northern Okinawa. The ultra-fine hydrating mist is an absolute must-buy souvenir during your aquarium trip!", "name": "Churaumi Plaza Skincare \u0026 Beauty Corner", "transport": "Located inside Churaumi Plaza right next to the Okinawa Churaumi Aquarium exit, easily accessible on foot."}, {"address": "4 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Locally Grown Motobu Shekwasha Whitening Handcrafted Soap, Ryukyu Sea Mud (Kucha) Facial Powder, Natural Bitter Melon Hydrating Toner. A charming local specialty center operated collaboratively by the Motobu community and the farmers\u0027 association. It offers additive-free handcrafted skincare products made with locally grown fruits and Okinawan mineral sea mud (Kucha). The refreshing natural citrus aroma combined with deep-cleansing mud masks makes this a delightful and popular beauty choice rich in local character.", "name": "Motobu Local Product Center - Skincare \u0026 Herbal Corner", "transport": "About a 3-minute walk from Toguchi Port, or a 10-minute drive from Okinawa Churaumi Aquarium."}, {"address": "856-1 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Ryukyu Turmeric Beauty \u0026 Wellness Capsules, Shiseido Hydrating Facial Cleanser, Okinawa-Exclusive Botanical Sunscreen. A large discount drugstore located near the Biimata area in Nago, right at the gateway to the Motobu Peninsula. Known for transparent, budget-friendly tax-inclusive pricing, it boasts expansive sections for cosmetics, skincare, and health supplements\u2014making it an ideal pitstop to stock up on beauty and medical essentials before or after exploring Motobu.", "name": "Drugstore Cosmos Nago Biimata Store", "transport": "Located along the main road entering Nago City from Motobu Peninsula; about a 15-minute drive from the aquarium."}, {"address": "5-20-5 Taisho, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: ALLIE Okinawa-Limited Sunscreen, Chocola BB Ryukyu Special Edition, Sekkisei Okinawa-Limited Hydrating Gel. A major Matsumoto Kiyoshi branch serving northern Okinawa and Motobu Peninsula visitors. It features a vast selection of trendy Japanese makeup and major skincare brands, alongside a comprehensive range of sunscreens and insect repellents, making restocks ultra-convenient.", "name": "Matsumoto Kiyoshi Nago Store", "transport": "About a 20-minute drive along Route 449 heading towards Nago."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1421-4 Yamakawa, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawa bitter melon embroidered T-shirt, wave-patterned Shima-zori flip-flops, original Okinawan style embroidered canvas tote. A highly popular local original apparel brand known for vibrant Okinawan motifs and original T-shirts. Breathable and comfortable, perfect for tropical wear, making it a favorite among youth and tourists.", "name": "HabuBox Ala Mahaina Hanasaki Marche Store", "transport": "About a 5-minute drive from Okinawa Churaumi Aquarium"}, {"address": "2830 Izumi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade indigo-dyed cotton dress, indigo gradient canvas tote, plant-dyed hemp scarf. Utilizing locally grown Ryukyu indigo plants from Motobu Town, every garment and bag is handcrafted with rich, varied blue shades. Each piece boasts unique natural blue-and-white textures and outstanding quality.", "name": "Ai-kaze Ryukyu Indigo Dyeing \u0026 Apparel Workshop", "transport": "About a 12-minute drive from Motobu Town Hall"}, {"address": "904-5 Biwamata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Okinawa-exclusive Yanbaru Iriomote wildcat T-shirt, lightweight waterproof hiking shoes, windproof UV-resistant outdoor hooded jacket. A must-visit outdoor retail hub before entering Yanbaru National Park, offering a wide selection of professional hiking boots, functional backpacks, and casual wear, alongside highly collectible Okinawa-exclusive graphic tees.", "name": "mont-bell Nago Store", "transport": "About a 30-minute drive from Okinawa Churaumi Aquarium heading east along Route 449"}, {"address": "4 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Customized engraved Shima-zori flip-flops, hibiscus print beach shoes, waterproof beach pouch. Traditional Okinawan Shima-zori hand-carved by local artisans. Customers can select custom patterns or carve personalized names. Featuring durable, lightweight soles, these are essential footwear for exploring Motobu\u2019s beaches.", "name": "Motobu Shima-zori Hand-carved Slippers \u0026 Beachwear", "transport": "About a 3-minute walk from Motobu Toguchi Port"}, {"address": "880 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Military green US-style tote bag, vintage Okinawan floral shirt, handmade leather sandals. A lifestyle select shop blending Northern Okinawa\u0027s American military influence with Yanbaru\u0027s nature aesthetic. Features vintage American apparel, rugged military-style bags, and fine leather footwear, evoking a unique retro coastal vibe.", "name": "Yanbaru Life Select \u0026 Vintage Apparel", "transport": "About a 5-minute walk from Motobu Town Library"}, {"address": "508 Kenken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Durable nautical canvas shoulder bag, handcrafted minimalist pouch, pure linen drawstring casual pants. Crafted from sturdy, high-quality Japanese canvas, each bag is hand-sewn by local tailors. Featuring sleek, elegant designs infused with the ocean blues of Motobu, these water-resistant bags offer exceptional craftsmanship.", "name": "Motobu Ocean Canvas Bags \u0026 Wear Workshop", "transport": "About a 3-minute drive from the Motobu side of Sesoko Bridge"}, {"address": "504 Bise, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Okinawa bitter melon and hibiscus Kariyushi shirt, breathable linen resort tote, women\u0027s Okinawan print resort dress. Specializes in officially certified Okinawan Kariyushi Wear (Ryukyu resort shirts). Made with highly breathable, cooling fabrics featuring motifs like bitter melon, whale sharks, and Shisa lions\u2014a top choice for travel outfits.", "name": "Motobu Kariyushi Wear \u0026 Resort Collection", "transport": "About a 2-minute walk from Bise Fukugi Tree Road"}, {"address": "52 Tamashiro, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.8 stars | Must-Buy List: Handwoven Bashofu shoulder bag, shell ginger leaf woven straw hat, traditional Ryukyu pattern cosmetic pouch. Preserving centuries of traditional Bashofu (banana fiber cloth) and shell ginger leaf weaving crafts from northern Yanbaru. All items are handcrafted from natural plant fibers, lightweight, durable, and subtly infused with a pleasant botanical fragrance.", "name": "Yanbaru Bashofu \u0026 Handwoven Accessories Workshop", "transport": "About an 8-minute drive from Nakijin Castle Ruins"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (At the exit of the Aquarium inside Ocean Expo Park)", "feature": "\u2b50 4.6 stars | Must-Buy List: Giant whale shark plush pillow, limited-edition sea creature cookies gift box, exclusive Churaumi patterned washi tape. Located right at the exit of Churaumi Aquarium, this is the largest official souvenir shop featuring the most extensive collection of ocean-themed merchandise in Okinawa. The hugely popular giant whale shark plush pillow is irresistibly soft and super cute\u2014an absolute fan favorite that nearly every visitor leaves with. Additionally, the beautifully packaged sea creature printed cookies and cute aquarium-exclusive stationery make perfect gifts for friends, family, or coworkers.", "name": "Churaumi Aquarium Official Souvenir Shop: Blue Manta", "transport": "Take the Yanbaru Express Bus from Naha Airport, get off at \u0027Kinen Koen-mae\u0027 stop, and walk for about 5 minutes."}, {"address": "1024-1 Nakayama, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Original Purple Sweet Potato Tart, Brown Sugar Chinstuko, freshly baked Fresh Purple Sweet Potato Tart. As Okinawa\u0027s top souvenir brand, the Nago location blends in beautifully with the natural scenery of the Yanbaru Subtropical Botanical Garden. It is famous for its Purple Sweet Potato Tarts made with 100% local Okinawan purple sweet potatoes, offering a smooth texture and a perfectly balanced sweetness. The Nago store also features a real production line where visitors can watch the tarts being baked through glass windows and buy freshly baked, limited-quantity tarts on the spot.", "name": "Okashi Goten Nago Store", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Kyoda-exclusive handmade Sata Andagi (Okinawan donuts), Shikuwasa concentrate juice, local Yanbaru brown sugar blocks. Renowned as the #1 roadside station in Okinawa, this is a must-visit shopping haven on the way to Motobu Peninsula and the Yanbaru region. It brings together the finest local specialties from villages across northern Okinawa. Their freshly fried Sata Andagi are crispy on the outside and soft on the inside, with brown sugar and purple sweet potato flavors selling out daily. You can also find pure wild Yanbaru Shikuwasa juice and brown sugar directly sourced from local farmers.", "name": "Michi-no-Eki Kyoda (Yanbaru Local Products Center)", "transport": "Take the Okinawa Expressway to Kyoda IC exit, then drive on Route 58 for about 3 minutes."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Kouri Island limited pumpkin financier cakes, island pumpkin steamed buns, handmade Ryukyu blue glassware. Located inside the Ocean Tower at the highest point of Kouri Island, this shop houses the island\u0027s largest souvenir center. The shop highlights various desserts made from Kouri Island\u0027s organic local pumpkins, especially the gold-award-winning pumpkin financier cake, which is rich, moist, and delicious. Beyond treats, visitors can also browse a stunning array of ocean-themed handmade Ryukyu glassware.", "name": "Kouri Ocean Tower Souvenir Shop", "transport": "About a 25-minute drive from Motobu Town crossing over the Kouri Bridge."}, {"address": "1195 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Gold-award luxury pineapple cake, dried pineapple slices, refreshing pineapple sparkling wine. Located inside Nago Pineapple Park, this souvenir area is a paradise for pineapple lovers. Using premium house-grown pineapples, they craft Monde Selection gold-winning pineapple cakes packed with rich, sweet-and-sour fruit pulp. Additionally, additive-free dried pineapple slices and crisp, palate-cleansing pineapple fruit wine make exceptional local gifts.", "name": "Nago Pineapple Park Sweets Shop", "transport": "About a 20-minute drive from Okinawa Churaumi Aquarium."}, {"address": "512-1 Heshiki, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Nakijin watermelon gummy candies, Nakijin Castle exclusive brown sugar senbei crackers, local Awamori chili oil. Located in Nakijin Village, this cozy roadside station overflows with authentic local charm. Nakijin Village is famous for producing Japan\u0027s earliest high-quality watermelons of the season, making its limited-edition watermelon snacks a unique find. It is also a hidden gem for purchasing artisanal Awamori chili oil and traditional wood-fired brown sugar, making it a favorite among local Japanese travelers.", "name": "Michi-no-Eki Nakijin Local Shop", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium via Route 505."}, {"address": "4 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Freshly shaved bonito flakes from historic Motobu shops, Okinawan island chili Awamori seasoning, handmade Yanbaru Shikuwasa cookies. Set in the heart of Motobu\u0027s old town, this traditional market has recently embraced a hip, artisanal vibe. Motobu Town is historically famous for its bonito (skipjack tuna). At this local souvenir shop, you can purchase freshly shaved premium bonito flakes and dashi broth bags with an aroma far superior to standard supermarket goods. You\u0027ll also find small-batch artisan Shikuwasa cookies and unique regional seasonings.", "name": "Motobu Town Market Local Souvenir Corner", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium, near Toguchi Intersection."}, {"address": "5232 Sakimotobu, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Yanbaru citrus langue de chat cookies, Iejima brown sugar wheat biscuits, Motobu Ferry exclusive seaweed rice crackers. Located right by the Motobu Port ferry terminal, this center gathers top specialties from the Motobu Peninsula as well as outer islands like Ie Island and Minna Island. The top recommendation is the rich sweet-and-sour langue de chat cookies made with local Yanbaru citrus. You can also pick up exclusive wheat biscuits from neighboring Ie Island and regional seaweed crackers\u2014a perfect final stop to stock up on unique snacks before leaving Motobu.", "name": "Motobu Port Sea Station Souvenir Center", "transport": "A 1-minute walk from Motobu Port Ferry Terminal."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1-188 Toyosaki, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: COACH leather bags, BEAMS casual wear, GUCCI classic accessories. Okinawa\u0027s only famous outlet shopping mall, housing over a hundred international luxury brands and Japanese trendy fashion labels. Offering attractive discounts across major brands, it is a must-visit shopping paradise in Okinawa, complete with diverse dining options and convenient tax-free services.", "name": "Okinawa Outlet Mall ASHIBINAA", "transport": "Approx. 80 minutes by car from the Motobu Peninsula via the Okinawa Expressway; or about 15 minutes by direct express bus from Naha Airport."}, {"address": "4470 Nago, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Yukisio brown sugar cookies, Okinawa-exclusive Orion Beer snack packs, Shiseido local skincare sets. The largest comprehensive shopping center in the northern region, just a 20-minute drive from the Motobu Peninsula. It features a large supermarket, cosmetics counter, Japanese fashion brands, and a local souvenir area, making it the perfect restock point for visitors heading to the Churaumi Aquarium.", "name": "AEON Nago Shopping Center", "transport": "Approx. 25 minutes by car from Motobu Churaumi Aquarium; or take Okinawa Bus No. 120 or 65 and get off at \u0027Nago Shopping Center-mae\u0027 stop."}, {"address": "851-1 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 3.9 stars | Must-Buy List: Motobu-grown citrus jam, Pengin Shokudo Chili Oil, Chinsuko (Okinawan shortbread). A signature local department store chain located in Motobu Town, adjacent to Motobu Port. Includes a grocery supermarket, daily goods, and apparel, offering authentic northern Okinawa agricultural specialties and exclusive daily necessities full of local charm.", "name": "SAN-A Motobu Shopping Center", "transport": "Approx. 10 minutes by car from Churaumi Aquarium; or take Bus No. 70 or 66, get off at \u0027Ohama\u0027 stop, and walk about 3 minutes."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade Kyoda Sata Andagi (brown sugar deep-fried donuts), Yanbaru mango soft-serve ice cream, discounted Churaumi Aquarium tickets. Ranked as Japan\u0027s top roadside station, situated at the key traffic hub entering the Motobu Peninsula. It gathers local specialties and independent shops from various northern Yanbaru municipalities and is a popular spot to buy discounted aquarium tickets.", "name": "Michi-no-Eki Kyoda Northern Mall", "transport": "Approx. 3 minutes by car from Kyoda IC, or about 35 minutes by car from Churaumi Aquarium."}, {"address": "904-5 Biimata, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Okinawa brown sugar Awamori liquor, handmade local red yam pie, Japanese home goods. A large comprehensive shopping complex located in the Biimata area, the gateway to the Motobu Peninsula. Featuring a spacious shopping environment, it houses a large supermarket, electronics store, apparel counters, and a food court, making it a great spot to experience local shopping life.", "name": "SAN-A Biimata City Shopping Center", "transport": "Approx. 20 minutes by car from Motobu Churaumi Aquarium via National Route 449 connecting to Route 58."}, {"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Ocean Expo Park)", "feature": "\u2b50 4.4 stars | Must-Buy List: Whale shark plush toys, exclusive Churaumi whale shark ceramic mugs, sea creature-shaped 3D cookie gift boxes. An exclusive official shop located right at the exit of Churaumi Aquarium. It sells hundreds of original, uniquely designed whale shark and sunfish merchandise, making it a flagship souvenir store you shouldn\u0027t miss when visiting the Motobu Peninsula.", "name": "Churaumi Aquarium Blue Manta Shop", "transport": "Take the \u0027Yanbaru Express Bus\u0027 directly from Naha Airport to Churaumi Aquarium Stop, then walk about 5 minutes."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Kouri Island-exclusive tropical pumpkin cake, Heart Rock-shaped pies, natural shell craft ornaments. A large specialty shop inside the iconic Ocean Tower on Kouri Island near Motobu Peninsula. Highlights exclusive desserts made from local Kouri Island produce, alongside an array of ocean-themed accessories set in an elegant, stylish shopping atmosphere.", "name": "Kouri Ocean Tower Souvenir Shop", "transport": "Approx. 30 minutes by car from Churaumi Aquarium via Yagaji Island and Kouri Bridge."}, {"address": "4-6-37 Miyazato, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Pure Shekwasha (Okinawan flat lemon) juice, Yanbaru pineapples, handmade bitter melon kimchi. The most representative local produce and fresh fruit shopping center in the north. Directly operated by the local agricultural cooperative, it sells fresh, high-quality northern Okinawa crops and locally brewed condiments straight from the source, making it a favorite among locals and foodies.", "name": "JA Okinawa Yanbaru Farmer\u0027s Market", "transport": "Approx. 20 minutes by car from the Motobu Peninsula; or take a bus to \u0027Miyazato 4-chome\u0027 stop and walk for 2 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Motobu Peninsula and Churaumi Aquarium"}, "naha_kokusai": {"categories": {"cat_1": {"items": [{"address": "2-8-16 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Cube Soaps, Essence Moisturizing Hand Cream. SuiSavon Shuri Soap is Okinawa\u0027s iconic local fragrance and skincare brand, carefully selecting local beauty ingredients such as sea mud, Shekwasha citrus, brown sugar, and botanical extracts. Their most popular handmade soaps feature colorful, dessert-like designs with elegant, natural scents. The hand cream features a unique texture that transforms into water droplets upon application, making it a premium local souvenir that every tourist should pick up.", "name": "SuiSavon Shuri Soap Kokusai Dori Concept Shop", "transport": "About a 5-minute walk from Monorail Makishi Station"}, {"address": "2-5-31 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Must-Buy List: Ryukyu Essential Oil Handmade Soaps, Okinawa Sea Salt Bath Salts. Tucked away near Ukishima-dori, this independent local handcrafted fragrance shop focuses on pure beauty products made with natural Okinawan botanicals using the cold-process method. Using natural ingredients like local sea salt, shell ginger leaves, Shekwasha citrus, and brown sugar, their products contain no added chemical preservatives\u2014making them ideal for sensitive skin. The stylish, minimalist packaging is loved by both local women and international tourists.", "name": "La Cucina Soap Boutique", "transport": "About an 8-minute walk from Monorail Makishi Station"}, {"address": "3-2-22 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buy List: Ryukyu Bihada Sea Mud Mask, Shekwasha Moisturizing Gel. A local skincare brand centered around Okinawa\u0027s unique deep-sea mud (Kucha) and native beauty botanicals. Its signature deep-sea mud mask offers exceptional deep-cleansing and oil-absorbing effects, leaving skin remarkably bright and refined. The Shekwasha Moisturizing Gel exudes a refreshing Okinawan citrus aroma and delivers intense hydration, making it an indispensable local beauty product when visiting Naha.", "name": "Ryukyu Bihada Kokusai Dori", "transport": "About a 3-minute walk from Monorail Kencho-mae Station"}, {"address": "2-5-11 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawa Sea Salt Body Scrub, Ocean Moisturizing Lip Balm. Splash Okinawa is an iconic ocean-themed lifestyle and cosmetics brand on Naha\u0027s Kokusai Dori, exuding a resort vibe that fuses Hawaiian and Okinawan flair. Their cosmetics line uses natural Okinawan sea salt and marine collagen, delivering a gentle, deeply hydrating texture. The delicate, adorable ocean-inspired packaging is irresistible to female visitors.", "name": "Splash Okinawa Shop 3", "transport": "About a 7-minute walk from Monorail Miebashi Station"}, {"address": "2-8-19 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buy List: Okinawa-exclusive LuLuLun Shekwasha Face Masks, Okinawa-exclusive Snake Oil Hand Cream. Located in the heart of Kokusai Dori, this massive discount store features expansive cosmetics and drugstore sections from B1 to 2F. Beyond major Japanese brands, its biggest draw is having the most comprehensive selection of regional Okinawa-exclusive skincare products. Operating 24/7 with on-site tax-free shopping, it offers ultimate convenience for restocking at any time.", "name": "Don Quijote Kokusai Dori", "transport": "About an 8-minute walk from Monorail Miebashi Station"}, {"address": "3-1-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buy List: Okinawa Bitter Melon Moisturizing Mask, ROIHI-TSUBOKO Pain Relief Patches (Warm). A top-choice drugstore chain for travelers visiting Naha, renowned for its highly competitive prices and extensive range of medicines and cosmetics. With plenty of multilingual staff available, it also features a dedicated section for Okinawan specialties and regional cosmetics, making it extremely convenient to buy popular Japanese face masks and health supplements.", "name": "Daikoku Drug Kokusai Dori Kentomae", "transport": "About a 1-minute walk from Monorail Kencho-mae Station"}, {"address": "1-2-3 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Must-Buy List: Matsukiyo Exclusive Hyaluronic Acid Moisturizing Spray, Melano CC Whitening Essence. The main Kokusai Dori outpost of Japan\u0027s famous drugstore chain, offering a curated selection of department store and drugstore beauty brands. The store is brightly lit and neatly organized, carrying many high-quality in-house Matsukiyo brand products along with frequent promotional offers, making it a fantastic spot to shop for trendy Japanese beauty items.", "name": "Matsumoto Kiyoshi Kokusai Street", "transport": "About a 5-minute walk from Monorail Kencho-mae Station"}, {"address": "2-1-1 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Must-Buy List: Santen FX Cooling Eye Drops, Kyusoku Jikan Cooling Foot Sheets. A convenient drugstore right next to Monorail Makishi Station with relatively fewer crowds, providing a relaxed, unhurried shopping experience. It stocks a full range of beauty products and essential remedies and frequently runs exclusive discount promotions, making it a great spot for a quick last-minute shopping run before leaving Kokusai Dori.", "name": "Kokumin Drug Kokusai Dori Makishi", "transport": "About a 2-minute walk from Monorail Makishi Station"}], "name": "Local Signature Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1-2-17 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Habu snake graphic T-shirts, Okinawan-patterned socks, original design baseball caps. HabuBox is a famous local streetwear brand born in Okinawa, incorporating Okinawan culture like the venomous Habu viper, bitter melon, and Okinawan beer into American street style designs. They emphasize 100% high-quality cotton that is durable and deformation-resistant, making it a top pick for local fashion enthusiasts and tourists seeking unique patterned clothing.", "name": "HabuBox Kokusai Dori Store", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Miebashi Station, then walk about 6 minutes."}, {"address": "2-1-8 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Must-Buys: Okinawan hibiscus Hawaiian shirts, pineapple pattern casual shirts, matching family-style Okinawan shirts. Mango House is one of Okinawa\u0027s most iconic Kariyushi Wear (Okinawan shirts) specialty stores. All shirts are designed by local designers and produced in Okinawa, featuring patterns such as hibiscus flowers, bitter melon, and Shisa lions. With vibrant colors and crisp tailoring, they are perfect for vacation wear.", "name": "Mango House Kokusai Dori Store No. 1", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Makishi Station, then walk about 3 minutes."}, {"address": "2-2-34 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Ryukyu patterned handmade leather wallets, Yaeyama Minsah woven leather card holders, handcrafted leather keychains. This shop is an original local Okinawan handcrafted leather specialty store. Its key highlight is combining thick, high-grade cowhide with traditional Okinawan textiles like \u0027Yaeyama Minsah weave\u0027 and \u0027Shuri weave.\u0027 All products are meticulously stitched by artisans, making them durable, rich in Ryukyuan heritage, and exceptionally high quality.", "name": "Ryukyu Leather L.L.A Kokusai Dori Store", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Makishi Station, then walk about 5 minutes."}, {"address": "3-1-8 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawan Eisa drum dance graphic T-shirts, vintage Shisa lion T-shirts, Ryukyu wave hand-rubbed printed T-shirts. Gathering multiple local Okinawan original T-shirt brands, this store offers perhaps the richest selection of short-sleeved tops in downtown Naha. The shop is filled with Ryukyuan-style illustrations, traditional Eisa dance motifs, and Ryukyu Kingdom-themed clothing made with breathable, comfortable fabrics.", "name": "T-SHIRT-YA.COM Kokusai Dori Store", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Makishi Station, then walk about 7 minutes."}, {"address": "2-8-11 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Must-Buys: Ocean-style canvas tote bags, shell-trimmed summer dresses, Okinawan ocean blue water-resistant cosmetic pouches. Splash Okinawa is an original Okinawan resort-style women\u0027s apparel and accessories boutique, styled around the beautiful ocean blue and sunny white of Okinawa. Its bags and vacation dresses radiate romantic coastal vibes and feature marine elements like pearls and shells, making them immensely popular among female shoppers.", "name": "Splash Okinawa Store No. 2", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Prefectural Office Station (Kencho-mae), then walk about 8 minutes."}, {"address": "2-8-9 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Must-Buys: Okinawan dugong (manatee) kids clothing \u0026 T-shirts, Kuroshio current fish illustration cloth bags, whale shark illustrated canvas totes. Jam Market is a delightfully charming local Okinawan illustrated clothing shop with design themes centered on native wildlife and marine life, such as dugongs, whale sharks, and sea turtles. The warm, adorable hand-drawn style is available in a full range of matching family sizes, along with sturdy canvas bags.", "name": "Jam Market Kokusai Dori Store", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Prefectural Office Station (Kencho-mae), then walk about 7 minutes."}, {"address": "2-8-13 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Must-Buys: BILLY\u0027S exclusive collaboration sneakers, Japan-exclusive vintage Vans skate shoes, Okinawa-exclusive casual street style trousers. Located in downtown Naha, this high-end trendy sneaker boutique is a hot spot for Japanese streetwear fans. The shop frequently gets exclusive limited-edition releases from major brands like Vans, Nike, and Adidas, making it a sacred pilgrimage site for sneakerheads seeking Japan-exclusive kicks.", "name": "BILLY\u0027S ENT OKINAWA", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Prefectural Office Station (Kencho-mae), then walk about 8 minutes."}, {"address": "2-1-21 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Must-Buys: Exquisite Okinawan business floral shirts, traditional Ryukyu Bingata dye-inspired shirts, breathable linen-blend resort shirts. MAJUN is a highly prestigious brand specializing in premium Kariyushi Wear, favored by local celebrities and business elites alike. The brand cleverly blends traditional Ryukyu Bingata dyeing arts with sleek modern tailoring using high-spec breathable fabrics\u2014perfect for both formal business occasions and relaxing vacations.", "name": "MAJUN OKINAWA Makishi Store", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Makishi Station, then walk about 4 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-2-5 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-buy list: Original Red Sweet Potato Tart, Brown Sugar Chocolate Sandwich Cookies, Himeimo Tart. As Okinawa\u0027s iconic souvenir flagship brand, their Red Sweet Potato Tart made with locally grown Okinawan purple sweet potatoes is famous worldwide. At the Matsuo shop, you can even watch the automated baking process of the tarts through a glass window. Smooth, velvety, and perfectly sweet without being cloying, it\u0027s a foolproof classic gift choice.", "name": "Okashigoten Matsuo Shop", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "3-29-67 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Must-buy list: Brown Sugar Baumkuchen (Fuku-ki), Red Sweet Potato Baumkuchen (Beni-imo), Honey Baumkuchen. The rich aroma of fresh baking often floats out front, where cakes are freshly baked layer by layer using local Okinawan brown sugar, purple sweet potato, and carefully selected eggs. The signature Brown Sugar Baumkuchen features a slightly crispy exterior and a moist, chewy interior, bursting with rich layers and authentic local flavor.", "name": "Fukugiya Kokusai Dori", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "3-3-16 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-buy list: Miyakojima Yukishio (Snow Salt), Yukishio Chinsuko, Flavored Seasoning Salts (Yuzu Salt and Wasabi Salt). A rare specialty salt shop in Japan, gathering precious salts from Okinawa\u0027s outer islands and around the world. In addition to the immensely popular Yukishio Chinsuko souvenirs, there is a fresh Yukishio soft-serve ice cream counter where you can freely sprinkle dozens of unique flavored specialty salts to customize your treat.", "name": "Shioya Kokusai Dori", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "2-8-16 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Must-buy list: Traditional Ryukyu Dynasty Chinsuko, Brown Sugar Chinsuko, Assorted Chinsuko Gift Box. A century-old shop preserving centuries of Ryukyu royal confectionery craftsmanship. Chinsuko is Okinawa\u0027s oldest and most iconic traditional cookie. Crumbly, rich, and aromatic with a delicate scent of lard and flour, it pairs exquisitely with hot tea or coffee.", "name": "Arakaki Chinsuko Main Store", "transport": "About an 8-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "3-2-2 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Must-buy list: Freshly Fried Red Sweet Potato Fries (Pogiri), Okinawa-exclusive Brown Sugar Sea Salt Potato Chips, Shikuwasa-flavored Kappa Ebisen. The Okinawa concept store of famous Japanese snack brand Calbee. They serve piping hot, freshly fried red sweet potato fries with a crispy exterior and soft center. It\u0027s also the best spot to pick up Okinawa-exclusive packaged snack gift boxes.", "name": "Calbee Plus Okinawa Kokusai Dori", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Makishi Station\u0027"}, {"address": "3-1-14 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Must-buy list: Okinawa Sata Andagi (Deep-fried Doughnuts), Brown Sugar Syrup \u0026 Shikuwasa Sata Andagi, Tricolor Crunchy Sata Andagi. Specializing in Okinawa\u0027s traditional sweet treat \u0027Sata Andagi\u0027, featuring a crispy shell and dense, soft interior with rich aromas of egg and brown sugar. They offer beautifully packaged gift boxes with longer shelf life, making them excellent souvenirs for experiencing nostalgic Ryukyu flavor.", "name": "Ryukyu Kashi Dokoro Ryugu", "transport": "Abou
