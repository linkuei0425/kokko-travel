    <script>
        const db = {"chatan_american": {"categories": {"cat_1": {"items": [{"address": "2-11 Miyagi, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 Stars | Hamaya is one of the premier classic Okinawa Soba institutions in Chatan, featuring an interior filled with warm local nostalgia. The ultimate star here is the melt-in-your-mouth soft bone rib (Soki), braised to collagen-rich tenderness. Paired with a rich yet non-greasy salted pork bone broth and springy noodles, every bite reveals deep traditional culinary roots, making it a favorite for both locals and travelers.", "name": "Hamaya Soba", "transport": "By car: Take Route 58 towards Miyagi Coast. By bus: Take bus No. 20 or 120 to \u0027Ihei\u0027 stop, then walk about 15 minutes."}, {"address": "188-1 Yoshihara, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 Stars | Perched on the hillside of Chatan, this famous traditional Okinawa Soba spot offers sweeping views of the ocean and cityscape. The shop insists on handmaking their noodles fresh daily, giving them a satisfying chew and wheat aroma. The signature Pork Belly Soba features meat slow-cooked in brown sugar and Awamori according to old recipes\u2014perfectly balanced between sweet and savory. Accompanied by a clear golden broth simmered from bonito and pork bones, it leaves an unforgettable aftertaste.", "name": "Shakariba Soba", "transport": "By car: About a 10-minute drive from American Village. By bus: Take a bus to \u0027Yagaru Iriguchi\u0027 stop and walk uphill for about 12 minutes."}, {"address": "2-14-1 Ihei, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 Stars | When mentioning Okinawa\u0027s iconic fusion classic \u0027Taco Rice\u0027, King Tacos is the legendary pioneer. The Chatan branch carries the soul of the original shop, serving massive portions of steaming rice topped with spicy seasoned ground meat, piles of crunchy shredded cabbage, and shredded cheddar cheese. Each bite delivers a delightful mix of hot and cool textures, elevated even further with a drizzle of signature salsa.", "name": "King Tacos Chatan", "transport": "By car: Drive along Route 58; located near the Ihei intersection. By bus: Take bus No. 120 to \u0027Ihei\u0027 stop, then walk about 3 minutes."}, {"address": "Depot Island Building E 2F, 9-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 Stars | A famous local pioneer that reinvented classic Taco Rice with its iconic \u0027Omutaco\u0027. A silky, soft-scrambled golden omelet wraps around spicy taco meat and hot rice, creating a rich and velvety texture. Balanced with special cheese and fresh tomato sauce, it hits the perfect sweet spot between spicy, savory, and creamy, enchanting both local youth and international tourists.", "name": "Taco Rice Cafe Kijimuna American Village", "transport": "Located on the 2nd floor of Depot Island Building E in American Village, about a 2-minute walk from the central plaza."}, {"address": "1-496 Miyagi, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.1 Stars | A local branch of a famous traditional chain, renowned for its rich broth simmered for hours using Agu pork bones. The broth is milky-white, smooth, and naturally sweet without any gaminess. The noodles absorb the flavorful soup and are served alongside traditional fried tofu and tender pork. The soup-infused tofu bursts with flavor, representing authentic local Chatan comfort food.", "name": "Kame Soba Sunabe", "transport": "By car: Head towards the Miyagi Coast area. By bus: Take bus No. 120 to \u0027Mizugama\u0027 stop, then walk about 10 minutes."}, {"address": "8-11 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.0 Stars | Owned by the famous Okinawan folk group \u0027Rinken Band\u0027, this classic Okinawan restaurant sits right by Sunset Beach. It serves authentic Ryukyuan home-style dishes like Goya Champuru (bitter melon stir-fry with tofu and egg), offering a subtle bitterness with a refreshing sweet finish, alongside purple sweet potato tempura and slow-cooked pork trotters. Enjoy time-honored local recipes accompanied by ocean views for a dual sensory treat.", "name": "Rinken\u0027s Kitchen", "transport": "Located next to Sunset Beach in American Village, about a 5-minute walk from the former Ferris wheel landmark."}, {"address": "418-1 Ihei, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 Stars | A cozy traditional noodle shop tucked away in a Chatan neighborhood; \u0027Teida\u0027 means \u0027sun\u0027 in the local Okinawan dialect. Their signature Okinawa Soba features a rich bonito and sea-salt broth paired with thick, springy noodles. The crowd favorite is the flame-seared soft bone pork rib, slightly charred for a smoky aroma with savory-sweet fat that melts in your mouth\u2014a hidden gem beloved by local families and foodies.", "name": "Teida Soba", "transport": "By car: Drive north for about 5 minutes from Mihama shopping district. By bus: Take bus No. 28 to \u0027Ihei\u0027 stop, then walk about 6 minutes."}, {"address": "2-1-13 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.1 Stars | A long-standing traditional Okinawan izakaya in Mihama with charm reminiscent of an old heritage house. \u0027Ganju\u0027 means health and longevity in Okinawan. The restaurant highlights healthy traditional Ryukyu kingdom cuisine, including melt-in-your-mouth slow-cooked pork belly and Jimami Tofu (peanut tofu) known for its chewy, mochi-like texture. Paired with local Awamori spirits, it offers a deeply authentic slice of Okinawan dining culture.", "name": "Ganjutei Okinawan Cuisine", "transport": "About a 5-minute walk from the entrance of American Village, or take bus No. 20 or 120 to \u0027Gun Byoin-mae\u0027 (Military Hospital) stop and walk about 3 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "2F, Depot Island Seaside Building, 9-39 Mihama, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | A ultimate ocean-view pancake shop located right along the American Village boardwalk, famous for its made-to-order pancakes and souffl\u00e9s. Fresh out of the griddle, the pancakes feature a slightly crispy exterior and a cloud-like, fluffy, melt-in-your-mouth interior with a rich milky aroma. Paired with house-made salted butter and maple syrup, the balance of sweet and savory is irresistible. Decor inspired by Santorini, Greece, in vibrant blue and white, with balcony seating offering panoramic views of Okinawa\u0027s deep blue sea. Highly cherished by both international tourists and locals alike for a lovely morning ocean-view brunch.", "name": "Seaside Cafe Hanon", "transport": "Drive about 45 minutes from Naha Airport to American Village, then walk to the 2nd floor of the Depot Island Seaside building."}, {"address": "1F, Depot Central, 34-3 Mihama, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | A trendy specialty coffee shop blending West Coast aesthetics with an industrial style, boasting unbeatable ocean views and stunning sunsets. Carefully selected specialty beans from around the globe are served as espresso, pour-overs, and nitro cold brews. The signature latte is silky and smooth, featuring dark roast beans with rich dark chocolate and nutty notes. Pair it with homemade cheesecake or American cookies for a mouthwatering blend of crispiness and richness. Its street-culture design attracts trendy crowds and tourists alike, making it the most iconic coffee landmark in American Village.", "name": "ZHYVAGO COFFEE ROASTERS", "transport": "About a 5-minute walk from the entrance of American Village, located on the 1st floor facing the ocean side of Depot Central."}, {"address": "1F, Vessel Hotel Campana Annex, 9-21 Mihama, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A sister store to ZHYVAGO, this seaside brunch cafe features a vibrant Bohemian and Western vintage aesthetic. The dishes are beautifully presented; signature omelets and custom sandwiches feature crispy exteriors filled with rich, juicy ingredients, complemented by refreshing avocado and fresh greens for balanced nutrition and multi-layered texture. High-grade light roast beans yield coffee with vibrant fruity acidity and a smooth finish. The outdoor seaside seating makes you feel as if you are on the California coast, drawing crowds seeking photos and relaxed morning sunshine.", "name": "VONGO \u0026 ANCHOR", "transport": "Located on the 1st floor of Vessel Hotel Campana Annex, about a 5-minute walk from the former Ferris wheel site in American Village."}, {"address": "3F, Depot Island Seaside Building, 9-21 Mihama, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | A sun-drenched resort-style brunch restaurant decorated in bright white tones, featuring panoramic floor-to-ceiling glass windows facing Okinawa\u0027s azure sea. Must-try popular items include the California burrito\u2014soft yet chewy, packed with spiced rice, rich cheese, and juicy meats\u2014and fluffy souffl\u00e9 pancakes that feel light as cotton candy with rich egg and milk flavors. Bright, spacious, and family-friendly with a dedicated kids\u0027 area, allowing both families and couples to relax and enjoy a wonderful brunch.", "name": "The CALIF KITCHEN OKINAWA", "transport": "Located on the 3rd floor of the Depot Island Seaside Building; accessible directly via elevator."}, {"address": "1F, Makai Resort, 51-1 Mihama, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | Say goodbye to traditional breakfast and indulge in a luxurious Wagyu brunch by the ocean! Famous for its Wagyu salad bowl and Wagyu croissant sandwich, the restaurant uses premium local Okinawan Kuroge Wagyu. Lightly seared on the outside to release tempting buttery aromas, the meat is melt-in-your-mouth tender and juicy. Paired with buttery, flaky croissants and crisp fresh greens, it offers rich savory flavors without feeling greasy. Resort-style hammocks, ocean views, and visually stunning yet healthy platters make it a favorite among food lovers and travelers.", "name": "WaGyu Cafe KAPUKA", "transport": "Located on the 1st floor of Makai Resort in Chatan, about a 7-minute walk from the central American Village area."}, {"address": "178-1 Hamakawa, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Tucked away in the Hamakawa residential area of Chatan, this popular Australian-style brunch cafe opens early at 6:30 AM and serves as a secret haven for local surfers and expat residents. The signature \u0027GOOD DAY BREAKFAST\u0027 comes with perfectly poached eggs, crispy bacon, and sourdough toast spread with rich smashed avocado. The sourdough is crusty and chewy, while the silky egg yolk flows over spices for a delicious blend of textures. Their home-roasted light Flat White boasts velvety micro-foam and a flawless coffee-to-milk balance that keeps customers coming back.", "name": "Good Day Coffee", "transport": "Driving is recommended; about a 5 to 7-minute drive from American Village to the Hamakawa Foreigners\u0027 Housing area."}, {"address": "6-9 Minato, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Combining a hostel with a specialty coffee shop, \u0027AIEN\u0027 derives its name from the Japanese concept of fateful connection (\u0027Aien\u0027), bringing together travelers from around the world. Brunch features made-to-order Cuban sandwiches and hand-crafted toasties. Pressed to crispy perfection, the sandwiches burst with gooey melted cheese, savory ham, and tangy pickles for a mouthwatering bite. Single-origin pour-overs offer a clean, crisp flavor profile with fruity sweetness and floral notes. Warm wooden tones and an open layout create a cozy neighborhood feel, making it top choice for hipster coffee enthusiasts and slow morning lovers.", "name": "AIEN COFFEE \u0026 HOSTEL", "transport": "Located near the coast in Minato, Chatan; about a 6-minute drive from American Village."}, {"address": "2F, 2-220 Miyagi, Chatan, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | A long-standing, stylish cafe located right on the ocean front of Miyagi Coast, offering breathtaking sea views and a romantic ambience. Brunch features classic American and Mediterranean-style dishes, with standout recommendations like toasted bread with melted Camembert cheese and signature house curry. Golden, crispy bread dipped in rich, warm cheese offers divine flavor, while the spice curry is wonderfully complex with a mild kick. Enjoying a rich coffee or juice on the outdoor terrace while listening to the waves and catching the sunset makes this the ultimate spot to experience Okinawa\u0027s relaxed lifestyle.", "name": "Transit Cafe", "transport": "About an 8-minute drive north from American Village, located on the 2nd floor along the Miyagi Coast seawall road."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "9-22 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.3 stars | A stylish seaside brewpub equipped with large on-site beer brewing facilities. Their signature \u0027Chatan Lager\u0027 offers a refreshing malt aroma with a subtly bitter yet sweet finish. Pair it with the crispy yet juicy \u0027Okinawan Grilled Black Pork Chops\u0027 and the sweet, springy \u0027Garlic Butter Pan-Seared Lobster\u0027 for a rich culinary experience. The waterfront outdoor seating allows guests to sip cold drinks while taking in Okinawa\u0027s stunning sunset, making it highly recommended by both tourists and locals looking for a relaxing night out.", "name": "Chatan Harbor Brewery \u0026 Restaurant", "transport": "About an 8-minute walk from the former Ferris wheel landmark in American Village to the Chatan Harbor area."}, {"address": "2F, Depot Island Building C, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.4 stars | A master of Okinawa\u2019s iconic local soul food! Their original \u0027Omutaco\u0027 wraps a rich, silky soft-boiled golden omelet over spicy taco meat sauce and fluffy white rice, topped with fresh crunchy lettuce and rich cheese. This combination delivers an explosion of creamy, smooth, and crunchy textures in every bite. The special sweet-and-sour taco sauce perfectly balances the savory meat, keeping long lines forming at this popular specialty shop in American Village.", "name": "Taco Rice Cafe Kijimuna Depot Island", "transport": "Located on the 2nd floor of Building C in the Depot Island shopping area of American Village; follow the pedestrian zone signs to reach it."}, {"address": "2F, 2-220 Miyagi, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.5 stars | An intensely romantic bistro located right on the oceanfront of Miyagi Coast, famous for its Aegean-style white decor and panoramic sea-view balcony. The must-try \u0027Garlic Spicy Cream Shrimp\u0027 served with crusty, freshly baked sliced baguette features plump, sweet shrimp in a rich, creamy, slightly spicy sauce\u2014a perfect match for dipping bread. Enjoying a special Okinawan cocktail at night alongside the sound of crashing waves and ocean breezes perfectly encapsulates Chatan\u0027s unique Western resort vibe.", "name": "Transit Cafe", "transport": "About a 5-minute drive or taxi ride from American Village along the Miyagi Coast."}, {"address": "2F, Depot Island Building A, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.2 stars | A popular local izakaya steeped in Ryukyuan charm, featuring interior accents of red roof tiles and woven bamboo. The star signature dish, \u0027Braised Black Pork Belly (Rafute),\u0027 is slow-cooked for hours with Awamori liquor and brown sugar, making the fat melt in your mouth while the tender meat balances sweet and savory flavors. Paired with juicy, crisp \u0027Okinawan Bitter Melon Stir-Fry with Tofu\u0027 and popping, caviar-like \u0027Sea Grapes,\u0027 alongside a glass of local Awamori, you can fully savor authentic Ryukyuan home-style delicacies.", "name": "Kamesen Depot Island Branch", "transport": "Located on the 2nd floor of Building A in Depot Island, American Village; about a 3-minute walk from the public parking lot."}, {"address": "221 Minato, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.1 stars | A classic steakhouse bistro filled with vintage nautical artifacts and nostalgic US military base vibes. Their signature \u0027Charcoal-Grilled Choice Sirloin Steak\u0027 features tempting grill marks, a rich smoky crust, and a juicy, tender, pink center packed with savory juices. Complete with side highlights like special \u0027Garlic Cheese Soup\u0027 and tropical sparkling cocktails served in captain ship-shaped souvenir mugs, it offers exotic resort vibes and visual excitement, perfectly showcasing the fusion of American and Ryukyuan food culture.", "name": "SAM\u0027S BY-THE-SEA Chatan", "transport": "Located near the Chatan Harbor area, about a 3-minute drive from Mihama American Village."}, {"address": "9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.0 stars | A cultural theme restaurant combining delicious food with live traditional Ryukyuan Sanshin music performances. The classic handmade \u0027Jimami Tofu\u0027 (peanut tofu) has a dense, mochi-like texture enhanced by a sweet sauce that highlights the nutty flavor. The \u0027Agu Pork Cartilage Noodle Soup\u0027 features a light, sweet broth with collagen-rich cartilage slow-cooked to melt-in-your-mouth tenderness. Nightly scheduled Ryukyuan folk song shows allow guests to clap along to the music while savoring local specialties, creating a delightfully lively atmosphere.", "name": "Hateruma Okinawan Restaurant (American Village)", "transport": "Located in the heart of American Village\u0027s pedestrian street, near the entrance of Mihama Seaside Park."}, {"address": "9-8 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.2 stars | A unique Anglo-American style bistro featuring a real classic red London double-decker bus inside! A must-try item is the \u0027Special Red Wine Beef Stew Omurice,\u0027 where tender, slow-cooked beef meets rich, silky red wine sauce and soft-scrambled eggs for a flavor-packed dish. Sitting on the second floor of the converted bus at night, overlooking the brilliantly lit streetscape of American Village while enjoying a cold local Okinawan draft beer or cocktail, offers a truly romantic, exotic vibe.", "name": "Double Decker Chatan", "transport": "Located in the heart of American Village shopping district, near Depot Central shopping building."}, {"address": "9-22 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.1 stars | A lively izakaya featuring fresh catches from Okinawa\u0027s local waters alongside local farm produce. Their signature \u0027Ryukyu Sashimi Platter\u0027 includes deep-sea turban shell and red rockfish, featuring tender yet springy flesh rich in flavor. Pair it with golden-crispy \u0027Deep-Fried Turban Shell and Mozuku Seaweed Tempura\u0027 for a delightful crunch infused with subtle ocean aromas. Offering dozens of local Awamori varieties, it is the top choice for late-night gatherings to enjoy fresh seafood and drinks with friends.", "name": "Izakaya Uohana Chatan", "transport": "Located in the American Village waterfront pedestrian precinct, about a 4-minute walk from Sunset Beach."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "9-8 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | Located in Chatan, this Mexican restaurant is widely renowned for its rich vegan options, highly favored by both domestic and international vegetarian foodies and tourists. It features a dedicated plant-based meat menu. The signature \u0027Plant-Based Meat Taco\u0027 wraps pan-seared soy meat, rich vegan cheese, and specially crafted salsa in a natural corn tortilla. The texture layers are exceptionally rich\u2014first tasting the corn aroma of the shell, followed by the juicy soy meat and refreshing kick of the mildly spicy sauce, making it almost indistinguishable from real meat! Blending retro American vibes with exotic charm, the relaxed resort feel makes this a highly praised vegetarian hotspot you shouldn\u0027t miss when visiting American Village.", "name": "Esparza\u0027s Tacos \u0026 Burritos", "transport": "Take Ryukyu Bus No. 120 from Naha Airport, get off at \u0027Gun Byoin-mae\u0027 (Naval Hospital) stop, and walk for about 7 minutes."}, {"address": "3F, Depot Island Building, 9-7 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Perched on the 3rd floor of Depot Island in American Village, this scenic curry shop is famous for its breathtaking views of the azure East China Sea and golden sunsets. The restaurant thoughtfully offers several vegan and yellow bell pepper vegetable curries. The signature \u0027Sunshine Vegetable Spice Curry\u0027 is stewed with fresh local Okinawan bitter melon, eggplant, sweet potato, and pumpkin. The curry sauce is rich and velvety, combining the natural sweetness of fresh produce with a subtle kick of spices. Paired with soft, warm rice, its smooth and dynamic texture keeps you coming back for another bite. Tourists love sitting on the outdoor terrace, savoring savory vegetarian curry while taking in the golden ocean sunset.", "name": "Horizon Curry Works Okinawa", "transport": "Take a bus to \u0027Mihama American Village Minamiguchi\u0027 stop, then walk about 5 minutes to reach Depot Island."}, {"address": "2F, Carnival Park Mihama, 15-69 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Located in the heart of American Village, this authentic Indian restaurant offers a wide variety of genuine vegetarian and vegan Indian dishes. Highlights include the \u0027Rich Spinach \u0026 Paneer Curry (vegan option available)\u0027 and the \u0027Chana Masala (Chickpea Curry)\u0027. The chickpeas, thoroughly simmered and infused with rich spice essences, become tender and flavorful. Paired with freshly baked whole-wheat naan that is crispy on the outside, soft on the inside, and delightfully chewy, the flavors deepen with every bite. Highly accommodating with customizations for strict vegetarians (vegan or without onion/garlic), its bold exotic aromas and vibrant Indian-themed decor make it a highly popular vegetarian landmark in Chatan.", "name": "Bollywood Jewel Mihama", "transport": "Take Bus No. 120, get off at \u0027Kuae\u0027 stop, and walk for about 4 minutes."}, {"address": "2F, Depot Island Seaside, 9-21 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.6 stars | Exuding Aegean blue-and-white Greek charm, Hanon is an iconic Instagram-worthy cafe along the Mihama coastline. For vegetarians and those with dairy/egg allergies, they have specially created the \u0027Plant-Based Oat Milk Pancakes\u0027. The texture is surprisingly soft and fluffy, infused with subtle hints of oat milk and vanilla. Drizzled with pure natural maple syrup or paired with fresh handmade jam, it is lightly sweet without being cloying. Sitting on the oceanfront terrace, listening to the waves while savoring this guilt-free, light vegetarian dessert is widely considered by tourists to be the most soothing afternoon experience in Chatan.", "name": "Seaside Cafe Hanon", "transport": "Walk towards the ocean for about 6 minutes from the former Ferris wheel landmark area in American Village."}, {"address": "178-1 Hamagawa, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | Located in the Sunabe surfer hotspot of Chatan, this popular Australian-style brunch cafe opens early at 6:30 AM and is beloved by health-conscious locals and international tourists alike. Its signature vegetarian dish, the \u0027Ultimate Avocado Sourdough Toast\u0027, features freshly sliced creamy avocado over crispy, toasted artisanal sourdough, dressed with a special lemon-herb sauce. Each bite begins with a satisfying crunch of the bread, followed by the smooth, rich avocado\u2014refreshing and light. The cafe also offers oat milk and plant-based milk lattes, boasting a relaxed, West Coast surf-resort vibe.", "name": "Good Day Coffee", "transport": "Drive or take a taxi from Naha City to the Hamagawa residential area near Sunabe Seawall, or take Bus No. 28 to \u0027Ihei\u0027 stop and walk for about 12 minutes."}, {"address": "6-9 Minato, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Located near Chatan Port, AIEN is a hipster space combining a hostel and community cafe, centered around a warm atmosphere of \u0027connecting people.\u0027 It offers vegetarian-tailored items such as the \u0027Vegan Energy Oat Bowl\u0027 and \u0027Plant-Based Hummus Toast\u0027. Smooth hummus is spread over high-fiber whole-wheat bread, topped with roasted nuts and fresh lettuce, delivering a rich multi-textured bite of creamy hummus and crunchy nuts. They also offer handmade vegan cookies and specialty oat milk drinks, making it highly praised by health-conscious travelers and hipsters worldwide.", "name": "AIEN Coffee \u0026 Hostel", "transport": "Walk about 10 minutes from \u0027Kuae\u0027 bus stop to reach the Chatan Port area."}, {"address": "2F, 15-58 Minato, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Tucked away along the Sunabe coastline, this oceanfront cafe is famous for its exquisite artisanal pancakes and front-row sea views. It features a dedicated \u0027Vegan Plant-Based Pancakes\u0027 section that uses no milk or eggs, instead blending soy milk and organic wheat flour in a golden ratio to create enticing golden pancakes that are slightly crispy outside and delightfully soft and moist inside. Drizzled with local Okinawan brown sugar syrup or topped with fresh purple sweet potato paste, it is sweet, smooth, and full of local flavor. Sitting in front of large floor-to-ceiling windows facing the deep blue sea while enjoying this refined vegan dessert is truly uplifting.", "name": "Kupukupu Sea Side Pancake Cafe", "transport": "About a 5-minute drive from American Village, or take a bus to \u0027Mizugama\u0027 stop and walk for about 8 minutes."}, {"address": "3F, Depot Island Seaside, 9-22 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Located in the seaside building of Depot Island in American Village, this light bites cafe boasts superb ocean views. For vegetarian lovers, they offer the \u0027Okinawa Island Veggie Rainbow Warm Salad Bowl\u0027 and \u0027Vegan Tomato Basil Pasta\u0027. The salad bowl uses local Okinawan specialties like bitter melon, island tofu, purple sweet potato, and seasonal greens, dressed with a special sesame olive oil sauce. The vegetables are fresh and crisp, while the island tofu brings a solid soy flavor, creating a rich yet refreshing taste profile. Enjoying pure vegetarian cuisine while taking in the sunset glows at dusk makes it a widely acclaimed vegetarian dining choice in the Chatan commercial area.", "name": "Cafe Terrace NIRAI", "transport": "Walk about 3 minutes from the central plaza of Mihama American Village to reach the 3rd floor of the Seaside Building."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1F Depot Island Seaside, 9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.4 stars | Freshly made-to-order piping hot, Okinawa\u0027s iconic grab-and-go rice ball. The outer seaweed wrapper is crispy without being dry, wrapping pan-fried Spam and a thick, soft, fluffy Japanese omelet. Every bite offers a rich blend of savory egg and salty Spam, paired with chewy rice and signature mayonnaise\u2014piping hot with rich, layered textures. A favorite among tourists who love eating it along the Mihama Seaside Promenade while taking in the ocean view, making it American Village\u0027s most popular street snack.", "name": "Pork Tamago Onigiri Depot Island Store (\u30dd\u30fc\u305f\u307e)", "transport": "Take Bus 120 to \u0027Gun Byoin-mae\u0027 (Naval Hospital) station, then walk about 7 minutes to the Depot Island Seaside area of Mihama American Village."}, {"address": "1F Depot Island Building B, 9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.3 stars | An iconic classic American hot dog stand in American Village, specializing in 100% pure beef custom sausages grilled to a crispy, charred skin that bursts with juice in every bite. Served on a lightly toasted soft bun, topped with generous savory chili meat sauce and rich melted lava cheese, it delivers a delightfully chewy texture infused with smoky American flavor. A favorite among US military families and international tourists, it\u0027s a can\u0027t-miss street food on the go.", "name": "Benson\u0027s Hot Dogs", "transport": "Take Bus 20 or 120 to \u0027Kuwae\u0027 station, then walk about 8 minutes directly into the Depot Island shopping district."}, {"address": "1F Depot Island Seaside, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.2 stars | A street dessert spot featuring a retro American aesthetic perfect for Instagram. The signature made-to-order churros are crispy outside and soft inside, dusted with sweet cinnamon powder or dipped in rich brown sugar sauce\u2014crispy, chewy, and non-greasy. Paired with rich brown sugar boba soft-serve ice cream and freshly fried hand-cut skin-on fries, the sweet and savory combination is ultimate satisfaction, making it immensely popular among youth and social media lovers.", "name": "Hold By Hand Okinawa (Churros \u0026 Fries)", "transport": "Take Bus 120 to \u0027Gun Byoin-mae\u0027 station, then walk about 6 minutes to the coastal promenade at Depot Island Seaside."}, {"address": "1-5 Miyagi, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.5 stars | Traditional tacos highly recommended by Okinawa locals. Freshly fried custom corn shells offer both crunch and savory corn chewiness, stuffed with seasoned minced beef, crisp shredded lettuce, and diced fresh tomatoes, then topped with special tangy salsa sauce. Crunchy and refreshing with every bite, it is the top savory snack choice while strolling along Chatan\u0027s Miyagi Coast.", "name": "Tacos-ya Chatan", "transport": "Take Bus 43 to \u0027Ihei\u0027 station, then take a taxi for about 5 minutes or walk about 15 minutes to reach the Miyagi Coast."}, {"address": "1F Depot Island Building A, 9-1 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.3 stars | Okinawa\u0027s classic ice cream brand with over a century of history, featuring a charming retro American decor. A must-try is the dual scoop of Okinawan purple yam (Beni-imo) and Salt Milk Tea\u2014smooth, creamy, and pleasantly sweet with subtle milky undertones and Okinawa\u0027s signature sweet-and-salty flavor. The freshly baked waffle cone is super crispy, making it a delightfully iconic Okinawan resort ritual to enjoy while walking along the seaside boardwalk.", "name": "Blue Seal Depot Island", "transport": "Take Bus 120 to \u0027Kuwae\u0027 station, then walk about 8 minutes to reach the entrance of Building A in Depot Island."}, {"address": "1F Carnival Park Mihama, 15-69 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.6 stars | Okinawa\u0027s iconic traditional street snack \u0027Sata Andagi\u0027 (Okinawan fried donut balls). Deep-fried to golden perfection on the outside, the interior is dense yet soft like a pound cake, filled with rich egg aroma and Okinawan brown sugar cane sweetness. Served piping hot fresh out of the fryer, crispy outside and tender inside without being oily, these addictive bite-sized treats are a timeless snack rich in nostalgic Ryukyuan charm.", "name": "Ryukyu Confectionery Mitsuya Honpo Chatan", "transport": "Take Bus 28 or 120 to \u0027Gun Byoin-mae\u0027 station, then walk about 5 minutes to reach the side of the Ferris Wheel Plaza."}, {"address": "1F Depot Island, 9-2 Mihama, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.1 stars | A well-known classic sweet shop specializing in fresh, handmade treats crafted from local Okinawan purple yam and brown sugar. Their #1 favorite, the \u0027Deep-fried Beni-imo Manju\u0027, boasts a golden crispy shell filled with smooth, fragrant Okinawan purple yam paste. Each bite overflows with natural sweet aromas and brown sugar syrup richness, perfectly balanced in sweetness\u2014a charming and delicious hot street snack to enjoy while walking around.", "name": "Chatandou Mihama (Beni-imo \u0026 Brown Sugar Manju)", "transport": "Take Bus 120 to \u0027Gun Byoin-mae\u0027 station, then walk about 7 minutes into the main street of Depot Island."}, {"address": "100 Sunabe, Chatan-cho, Nakagami-gun, Okinawa", "feature": "\u2b50 4.5 stars | A classic retro American burger joint located near Sunabe Coast in Chatan. The hand-patted beef patties are charcoal-grilled fresh to order, lightly charred on the outside and dripping with juice inside, served on artisanal charcoal-grilled buns with special BBQ sauce. Taking a big bite releases bursts of savory beef flavor and perfect chewiness. Grabbing a takeout burger to enjoy along the Sunabe Seawall at sunset is the ultimate Chatan American dining experience.", "name": "Gordie\u0027s Hamburgers Takeout", "transport": "Take Bus 28 to \u0027Mizugama\u0027 station, then walk about 10 minutes to reach the edge of the Sunabe residential area."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Chatan Area and American Village"}, "kouri_yanbaru": {"categories": {"cat_1": {"items": [{"address": "5 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1905 (Meiji 38), this century-old Okinawa noodle shop is the most iconic traditional taste in the Yanbaru region. The restaurant uses handmade thick noodles prepared with wood ash liquid according to ancient methods, giving them a firm, chewy texture with a rich wheat aroma. The broth is simmered with bonito flakes for hours, rendering it light, sweet, and non-greasy. The highlights are the tender, flavorful braised pork belly and fish cakes\u2014the pork melts in your mouth with a perfect balance of sweet and savory notes. Carrying a century-old pure flavor that locals have grown up with, it is a must-visit classic eatery when traveling to Kouri Island and the Yanbaru region.", "name": "Kishimoto Shokudo Honten", "transport": "About 30 minutes by car from Kyoda Interchange; or take Yanbaru Express Bus No. 888 to \u0027Motobu Port\u0027 stop and walk about 10 minutes."}, {"address": "2400 Izumi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Hidden amidst the lush greenery of Yanbaru\u0027s mountains, this classic traditional shop specializes in Soki Soba (pork rib noodles) and pork belly noodles. The biggest highlight is the pork ribs, stewed to ultimate tenderness\u2014the cartilage is springy like jelly, and the meat melts in your mouth, saturated with a rich secret sauce. The chewy noodles soak up the soup, which is brewed from bonito flakes and pork bones, offering a rich yet refreshing savory sweetness. Retaining a nostalgic Showa-era charm, it is deeply loved by visitors seeking authentic local traditional bites and hidden culinary gems.", "name": "Yanbaru Soba", "transport": "Drive along Route 84 (Izumi Highway) toward Yanbaru; dedicated parking available on-site."}, {"address": "61 Orui, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in Ogimi Village\u2014renowned for longevity\u2014this famous local traditional restaurant is run by a longevity cuisine researcher. Dedicated to using pesticide-free organic vegetables, shikuwasa (citrus), and wild herbs from Yanbaru, the restaurant offers the \u0027Longevity Meal\u0027 set embodying the spirit of long life. Dishes include bitter gourd steamed with brown sugar, traditional peanut tofu, wild herb tempura, and shikuwasa rice\u2014refreshing, layered, and full of natural earth flavors. A colorful and elegant spread of home-cooked sides allows diners to enjoy healthy deliciousness while experiencing the refined local culinary culture of the Village of Longevity.", "name": "Emi no Mise (Ogimi Village)", "transport": "Drive north along Route 58 to Ogimi Village, about 40 minutes by car from Kyoda IC."}, {"address": "985 Tsunami, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A popular traditional diner in Ogimi Village, northern Yanbaru, famous for its generously portioned \u0027Beef and Bean Sprout Okinawa Soba.\u0027 A mountain of bean sprouts and shredded beef is stir-fried over high heat with black pepper, bursting with wok hei and spicy aroma. The flavorful broth combines the heat of black pepper with the rich depth of pork bone, while chewy noodles absorb the delicious soup. This spicy, appetizing, and hearty local classic is a favorite among local laborers and truck drivers, drawing many tourists to take on the delicious challenge.", "name": "Maeda Shokudo Honten", "transport": "Drive north along Route 58, past Shioya Bay; parking spaces are available at the entrance."}, {"address": "181 Shoshi, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A popular local traditional noodle shop housed in a renovated ancient red-tile house, exuding a warm and relaxing old-residence atmosphere. Famous for its homemade Okinawa soba noodles, which are smooth, springy, and nicely chewy. The Seared Agu Pork Soba is highly recommended\u2014the pork is slow-stewed and then flame-seared, giving off a rich aroma with savory, non-greasy fat. Complimented by brown sugar pudding and handmade shikuwasa tofu served with the meal, the smooth and delicate desserts provide an ultimate enjoyment of authentic traditional flavors.", "name": "Nakijin Soba", "transport": "About 15 minutes by car from Kouri Bridge to Shoshi area in Nakijin Village."}, {"address": "1280 Hentona, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A traditional seafood diner located inside Hentona Fishing Port at the northernmost tip of Yanbaru, directly operated by the Kunigami Fisheries Cooperative and specializing in ultra-fresh daily catches. Whether it\u0027s the local sashimi set meal, crispy fried fish, or special butter-pan-fried fish, the flesh is firm, tender, and brimming with sweet ocean flavors. Served with hot white rice and traditional miso soup, it offers a lavish fisherman\u0027s feast in generous portions at reasonable prices\u2014making it an unbeatable choice to experience Yanbaru\u0027s coastal local vibes and delicious fresh fish.", "name": "Kunigami Minato Shokudo", "transport": "Drive all the way north along Route 58 into Hentona Fishing Port in Kunigami Village; large parking lot available."}, {"address": "1426 Sakimotobu, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A cozy, traditional family-style diner deeply loved by Yanbaru locals, renowned for its flavorful \u0027Pork Trotter Soba (Tebichi Soba).\u0027 The pork trotters are slow-cooked over low heat for hours, packed with collagen, tender skin, and soft meat without any gamey odor. Paired with a clear, sweet bonito broth and handmade noodles, it is rich yet surprisingly light on the palate. The welcoming, friendly vibe and warm hospitality showcase authentic Okinawan home-cooked charm.", "name": "Yoshiko Soba", "transport": "Drive along Route 449 toward Motobu Port; located along the road in Sakimotobu."}, {"address": "176 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A classic traditional seafood diner located on Kouri Island, filled with the relaxing charm unique to off-shore islands. The most popular signature dishes are the Fresh Sea Urchin Rice Bowl and the Sea Grape \u0026 Agu Pork Rice Bowl. The velvety sweet sea urchin and popping sea grapes mingle in your mouth, delivering a rich oceanic sensation. Additionally, the traditional Okinawan Goya Chanpuru (bitter melon stir-fry) and Fu Chanpuru set meals offer wonderful home-style flavors, making this a classic local diner you shouldn\u0027t miss when visiting Kouri Island.", "name": "Shirasa Shokudo (Kouri Island)", "transport": "Turn left after crossing the Kouri Bridge; about a 3-minute walk or a 1-minute drive."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "466-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Perched high on Kouri Island, offering sweeping views of the famous Kouri Bridge and gradated azure ocean waters. The cafe crafts exquisite brunch menus using carefully selected local Okinawan ingredients. The signature fresh fish dish and French toast are highly acclaimed; the French toast features a golden crispy exterior and a custard-smooth, velvety interior. Paired with freshly brewed aromatic coffee and a gentle ocean breeze, this ocean-view cafe is a must-visit spot for travelers.", "name": "Kouri Island Cafe Restaurant LOTA", "transport": "By car: Drive about 35 minutes from Kyoda IC, cross Kouri Bridge, and head uphill along the island ring road."}, {"address": "1925 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | An ultimate ocean-view cafe combining a giant banyan tree with Bohemian-style hammock chairs, allowing guests to gently sway while admiring sunsets over the East China Sea. Popular brunch options include special Okinawan taco rice and freshly baked purple yam pancakes. The pancakes feature a crispy crust and a rich, natural purple yam filling that pairs exquisitely with a smooth brown sugar latte\u2014offering complex layers of flavor and fantastic photo ops.", "name": "Kouri Island Cafe Gajumaru Rock", "transport": "By car: Drive along the southern coastline of Kouri Island, about a 3-minute drive from Kouri Bridge."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A sky-high vantage point cafe located inside Kouri Ocean Tower, featuring an unobstructed 270-degree glass ocean view. Known for authentic Italian pizza baked fresh in a high-temperature stone oven and refreshing Okinawan Shikuwasa sparkling drinks. The pizza crust boasts a lightly charred, airy rim with a chewy, cheesy center perfectly combined with local black pork sausage, while the crisp sparkling drink blows away the summer heat.", "name": "Kouri Ocean Tower Cafe Ocean Blue", "transport": "By car: After crossing Kouri Bridge, follow the signs to Kouri Ocean Tower. Free dedicated parking is available within the park."}, {"address": "1153-2 Yamazato, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Housed in a traditional Ryukyuan red-tile roof house atop Yanbaru hills, offering sweeping views of Ie Island and breathtaking ocean panoramas. The menu is simple yet amazingly delicious. The signature double cheese pizza has a crispy crust with subtle wood-fired aromas, gooey stretchy cheese, sweet crisp onions, and savory sausage. Paired with refreshing iced tea or pour-over coffee, its popularity remains timeless.", "name": "Cafe Kajinhou", "transport": "By car: Take Route 58 onto Route 449 towards the Motobu Town hills, about a 20-minute drive."}, {"address": "61-1 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A stunning seaside brunch spot where all seats face the East China Sea, with large floor-to-ceiling windows taking in the blue skies and ocean. The popular Kuroge Wagyu beef burger is seared to lock in rich, juicy flavors, served alongside crispy fries and a freshly blended Okinawan mango and passionfruit smoothie. The sweet-sour, velvety smoothie perfectly balances the savory burger, making it a favorite among independent travelers.", "name": "On the Beach CAFE", "transport": "By car: About a 40-minute drive from Kyoda IC, located near Nakijin Castle Ruins."}, {"address": "930-1 Sakimotobu, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Hailed as one of Okinawa\u0027s top burger joints, renowned for its generously sized American-style brunch burgers. The signature burger features a thick, hand-patted beef patty seared golden-brown, bursting with juices at first bite. Served with custom buns toasted crispy outside and fluffy inside, plus a rich house-blend cheese sauce, it offers a deeply satisfying bite\u2014an unmissable food icon in the Yanbaru area.", "name": "Captain Kangaroo Hamburger (Motobu)", "transport": "By car: Drive along the Route 449 coastline; about a 15-minute drive from Okinawa Churaumi Aquarium."}, {"address": "1783 Bise, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A cozy, vibrant little cafe tucked next to the Bise Fukugi Tree Road, filled with tropical resort vibes. It specializes in rainbow smoothie bowls and freshly blended slushes made with local pesticide-free Okinawan fruits. The dragon fruit and mango smoothies feature a velvety smooth texture, refreshingly sweet and tart with no added artificial sugars\u2014the perfect afternoon pick-me-up after a stroll through the Fukugi trees.", "name": "Cafe Okinawa Sun", "transport": "By car: Drive to the entrance of the Bise Fukugi Tree Road; about a 3-minute walk from there."}, {"address": "1241 Wakukawa, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A hidden wooden cafe surrounded by the lush natural forests of Yanbaru, boasting a tranquil and pleasant environment. It serves healthy local Okinawan plant-based brunch dishes and homemade desserts. The signature purple yam pie and brown sugar cheesecake are perfectly balanced and not overly sweet. The purple yam pie has a crisp crust and a velvety, fragrant yam filling\u2014paired with a cup of pour-over dark roast single-origin coffee, it allows you to truly relax immersed in phytoncides.", "name": "Cafe Papaiya (Nakijin Forest Cafe)", "transport": "By car: Turn onto Prefectural Road 84 from Route 58, drive about 15 minutes towards Wakukawa, Nakijin Village."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "466-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A stylish bistro perched on the heights of Kouri Island, offering spectacular views overlooking Kouri Bridge and the crystal-blue ocean. The restaurant specializes in Fusion Italian-French cuisine made with local Okinawan ingredients and fresh Yanbaru seafood. Signature dishes like the lavish seafood pasta and flame-grilled local Agu beef steak, paired with signature tropical fruit cocktails and fine wines, create a top-tier culinary feast. The rich, slightly spicy seafood sauce perfectly coats the springy pasta, and the fresh, sweet texture of the shellfish is breathtaking, making it a top choice for tourists and couples seeking a romantic sunset dinner on Kouri Island.", "name": "L-Lota Breathtaking View Bistro", "transport": "After driving across the Kouri Bridge, drive clockwise around the island along the uphill signs for about 3 minutes."}, {"address": "90 Nakayama, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A traditional Kominka restaurant and bistro restored from a century-old Ryukyuan village complex, complete with a breathtaking natural waterfall in the central courtyard. Highly acclaimed for its high-quality Yanbaru Agu Pork shabu-shabu and signature brown sugar braised pork rib noodles. The Agu pork is naturally sweet with perfectly marbled fat that melts in your mouth\u2014tender, juicy, and completely odor-free. Lit up at night, it exudes an antique charm where guests can sip Awamori liquor and savor handmade Ryukyuan side dishes while listening to the cascading waterfall, drawing travelers worldwide for a double feast of culture and taste.", "name": "Hyakunen Koya Ufuya", "transport": "About a 20-minute drive from Kyoda Interchange (Kyoda IC); or about a 15-minute drive from downtown Nago."}, {"address": "2-14-5 Onan, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in a quiet alley of downtown Nago, this traditional Kominka bistro specializes in authentic Okinawan cuisine and premium Agu pork. Their signature \u0027Yanbaru Island Agu Pork Steamed Bamboo Basket\u0027 layers fresh vegetables and thinly sliced Agu pork in a bamboo steamer, preserving the meat\u0027s sweet juices and the veggies\u0027 crisp freshness. Dipped in house-made ponzu sauce, it offers rich layers of flavor while remaining healthy and non-greasy. Offering a variety of local Okinawan Awamori and craft beers, the cozy tatami dining environment in this old house is loved by locals and foodies seeking authentic flavors.", "name": "Yanbaru Dining Matsunokominka", "transport": "About an 8-minute walk from Nago Crossroad Bus Stop, or a 3-minute drive from central Nago."}, {"address": "251 Isagawa, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Hailed as the \u0027Ultimate Agu Pork Yakiniku Holy Land,\u0027 this Nago local cuisine spot specializes in exquisite charcoal-grilled pork dishes featuring every part of the pig. The restaurant carefully selects rare, purebred Agu pigs raised in Yanbaru, presenting offal, pork neck, belly, and rare cuts with exquisite slicing and seasoning. Grilled over charcoal to perfection\u2014crispy on the outside and juicy on the inside\u2014and dipped in special salt sauce, the marbled fat bursts with rich aroma and chewy texture, completely redefining pork cuisine. The exceptional food quality and extensive Okinawan liquor menu make reservations hard to get, earning wild acclaim from tourists and food connoisseurs alike.", "name": "Yanbaru Shimabuta Manmi", "transport": "About a 10-minute drive from central Nago; dedicated parking available."}, {"address": "1-5-19 Gusuku, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A popular seafood and regional cuisine izakaya located in Nago, the gateway to Yanbaru. Fresh Okinawan seafood and sashimi are delivered daily directly from local fishing ports. Classic dishes include Okinawan specialty \u0027Sea Grape Fresh Fish Salad,\u0027 super crispy \u0027Deep-fried Turban Shell \u0026 Tempura,\u0027 and \u0027Yanbaru Local Chicken Charcoal Grill.\u0027 Thick, tender fresh fish slices and sea grapes bursting with salty ocean flavor pair perfectly with ice-cold Orion draft beer or local Awamori. Full of vibrant Okinawan island nightlife vibes, this is an unmissable spot to experience Yanbaru\u0027s local culinary culture.", "name": "Kaisen Izakaya Enya", "transport": "About a 3-minute walk from Nago Crossroad Bus Stop."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located inside Kouri Ocean Tower, this elevated view bistro boasts unbeatable, sweeping panoramic ocean views. The restaurant highlights wood-fired artisanal pizzas and Mediterranean-inspired regional specialties. Highly recommended is the custom pizza featuring Yanbaru shikuwasa lemon and Okinawan black pork sausage\u2014the crust is crispy outside, soft inside with a rich wheat aroma, balanced by creamy cheese and sweet-sour fruity notes for a refreshing taste. Enjoying a custom Blue Hawaii cocktail and gourmet meal in the ocean breeze makes this a dream spot for lunch and afternoon tea when visiting Kouri Island.", "name": "Kouri Ocean Blue Restaurant", "transport": "After crossing Kouri Bridge by car, follow the signs to inside the Kouri Ocean Tower."}, {"address": "2-15-22 Oshiro, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A classic local bistro highly praised by Nago locals, famous for its unbeatable value and authentic Okinawan home-style dishes. Their signature \u0027Goya Chanpuru\u0027 is outstanding\u2014crunchy bitter melon without harsh bitterness, stir-fried to fragrant perfection with firm island tofu and fluffy eggs. Other highlights include \u0027Okinawa Pig Trotter Soup\u0027 and \u0027Grilled Squid Ink Yakisoba.\u0027 The pig trotters are tender, springy, and rich in collagen, melting in your mouth. The lively and warm izakaya atmosphere allows travelers to enjoy Awamori liquor alongside locals and experience the pure, welcoming night vibe of Yanbaru.", "name": "Izakaya 21", "transport": "About a 10-minute walk from Nago City Hall, or reachable by car."}, {"address": "603 Kenken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Tucked away in the mountains of Yanbaru, this classic local diner and bistro has been captivating locals for decades with home-cooked nostalgic Okinawan flavors. The signature \u0027Pan-fried Agu Pork Chop\u0027 uses thick-cut Yanbaru pork, seared to a golden crispy crust with extremely juicy meat inside, paired with a secret sweet sauce that makes you want bowl after bowl of rice. Additionally, the \u0027Homemade Jimami Tofu\u0027 (peanut tofu) has a creamy, bouncy texture similar to panna cotta, rich with peanut fragrance. Its warm, friendly family-style service and genuine culinary mastery make it a hidden treasure you shouldn\u0027t miss when exploring northern Okinawa.", "name": "Kinokawa Shokudo Regional Cuisine", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium."}], "name": "Featured Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "2013-1 Shoshi, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Located on the highlands of Nakijin Village, this organic vegetarian set-meal restaurant carefully selects fresh organic vegetables harvested daily by local Yanbaru farmers. The signature \u0027Organic Island Vegetable Set\u0027 offers rich, multi-layered textures; the tempura is fried to a golden crisp without being greasy at all. Paired with pickled side dishes and brown rice, it allows you to taste the purest natural sweetness and moisture of the vegetables. It is immensely popular among health-conscious tourists and local plant-based food lovers.", "name": "Cafe Kokuu (\u30ab\u30d5\u30a7 \u3053\u304f\u3046)", "transport": "Drive off the Kyoda Interchange, take National Route 58, and transfer to Prefectural Route 115. It takes about 30 minutes by car."}, {"address": "361 Oshika, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A famous wild vegetable restaurant in Ogimi Village, known as the village of longevity, hosted by a grandmother who is also a nutritionist. The special \u0027Longevity Feast\u0027 features local Yanbaru wild greens, bitter melon, shiikuwasa citrus, and more. The tempura is crispy with a delicate herbal aroma, while the stewed vegetables are tender and flavorful. Its lightly sour and sweet profile is refreshingly smooth and completely guilt-free, making it the top choice to experience local Okinawan vegan culture.", "name": "\u7b11\u5473\u4e4b\u5e97 (Emi no Mise / \u7b11\u5473\u306e\u5e97)", "transport": "Drive north along National Route 58 to Ogimi Village; takes about 40 minutes by car."}, {"address": "4607-1 Yabu, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in the Nago Agricultural Park, this farm-to-table vegetarian-friendly cafe advocates a true \u0027farm-to-fork\u0027 philosophy. The signature Yanbaru vegetable curry is rich and smooth, featuring mildly spicy aromatic layers paired with sweet vegetable essence. The freshly picked salad included with meals is exceptionally crisp and juicy, drizzled with a special shiikuwasa dressing that whets the appetite. It\u0027s a popular spot to recharge with plant-based energy while exploring Yanbaru\u0027s natural scenery.", "name": "Cookhal (\u30af\u30c3\u30af\u30cf\u30eb)", "transport": "About a 15-minute drive from downtown Nago City to the Nago Agricultural Park parking lot."}, {"address": "4-2-1 Umusa no Mori, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A highly popular vegan and gluten-free bakery and curry specialty shop in downtown Nago. Using 100% plant-based ingredients and organic Yanbaru vegetables, their Indian-style spiced vegan curry is rich and aromatic with distinct layers of flavor. The special vegan flatbreads and gluten-free artisanal breads are delightfully chewy with a natural grain aroma\u2014crispy on the outside and soft inside\u2014waking up the tastebuds of both vegans and non-vegetarians alike.", "name": "Niceness (\u30ca\u30a4\u30b9\u30cd\u30b9)", "transport": "About a 20-minute drive from the Kyoda Interchange, or take a Nago city bus to Umusa no Mori Stop and walk for about 3 minutes."}, {"address": "1921 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Perched on a coastal cliff of Kouri Island, this scenic ocean-view cafe offers a variety of vegan-friendly meals. The signature veggie \u0026 bean curry is dense and velvety, topped with plenty of roasted Yanbaru vegetables that deliver rich aromas and textures. Pair it with a freshly blended plant-based subtropical fruit smoothie\u2014cool, tangy, and sweet\u2014to enjoy guilt-free food while gazing at the azure ocean.", "name": "Gajumaru Rock (\u30ac\u30b8\u30e5\u30de\u30eb\u30ed\u30c3\u30af)", "transport": "Cross Kouri Bridge, turn left, and drive along the island loop road for about 3 minutes."}, {"address": "278-3 Nakasone, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A hipster-chic plant-based cafe created by a famous chef in Nakijin Village, filled with a serene natural and artistic vibe. Dishes focus on local Yanbaru organic produce; the signature vegetable plate features diverse seasonal roasted veggies and grain salads with light yet refined textures. The handmade vegan bread with a crispy crust is a standout, releasing subtle wheat aromas with every bite, attracting many foodies seeking refined dining experiences.", "name": "Paramita (\u6ce2\u7f85\u871c Paramita)", "transport": "About a 25-minute drive from downtown Nago City, or an 8-minute walk from the Nakijin Village Office."}, {"address": "1770 Bise, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | A 100% plant-based tropical fruit dessert and beverage shop located near the border of Motobu Town and Yanbaru. The main highlights are vegan smoothie bowls crafted with Okinawan passion fruit, dragon fruit, and island tofu, offering a silky smooth texture that is sweet, tangy, and rich in natural vitamins. They also serve handmade vegan fruit popsicles that are refreshingly cool, making it a must-visit dessert spot en route to Yanbaru\u0027s natural sights.", "name": "Okinawa Sun (\u30aa\u30ad\u30ca\u30ef \u30b5\u30f3\u30c6)", "transport": "Drive towards Okinawa Churaumi Aquarium; it takes about 5 minutes by car from the entrance of Bise Fukugi Tree Road."}, {"address": "2242 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | An organic, vegan-friendly cafe on Kouri Island emphasizing eco-friendliness and harmony with nature. The shop serves organic plant-milk lattes and vegan organic acai bowls that are rich, smooth, and free of artificial sugars. Their special vegan veggie tartar sandwich uses local natural enzyme bread, packed with crisp, juicy fillings and a unique fruity sweet-and-sour touch, making it a highly praised light meal choice on the island.", "name": "\u53e4\u5b87\u5229\u5cf6 LLL Organic Cafe (\u53e4\u5b87\u5229\u5cf6 LLL \u30aa\u30fc\u30ac\u30cb\u30c3\u30af\u30ab\u30d5\u30a7)", "transport": "Drive across Kouri Bridge and follow the island loop road for about 4 minutes; located near Heart Rock."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "436-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Kouri Island\u0027s most iconic grab-and-go delight! Fresh, plump prawns are stir-fried in rich garlic butter and signature spices. Crisp on the outside with juicy, succulent meat inside, served alongside fragrant pearl rice and refreshing lemon slices. Rich yet balanced, it\u0027s a must-try classic snack right after crossing the bridge.", "name": "KOURI SHRIMP Food Truck", "transport": "Drive approx. 30 mins from Kyoda IC; turn right 1 min after crossing Kouri Bridge."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture (Inside Roadside Station Kyoda)", "feature": "\u2b50 4.5 stars | A super popular Sata Andagi (Okinawan donuts) shop inside the Kyoda Rest Area, the gateway to Yanbaru. Deep-fried to golden perfection, crispy outside and dense with a rich egg aroma inside. Don\u0027t miss the daily limited \u0027Mitsuya Dragon Ball\u0027\u2014made with tapioca flour for a wonderfully chewy, mochi-like texture. The ultimate road-trip snack!", "name": "Mitsuya Honpo (Kyoda Rest Area)", "transport": "Exit Okinawa Expressway at Kyoda IC and take National Route 58 directly to Roadside Station Kyoda."}, {"address": "323-1 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A farmer\u0027s market food stall right by Kouri Bridge, serving tropical snacks made with local produce. The signature Beni-imo (purple sweet potato) soft-serve is delightfully smooth and naturally sweet, while the fresh-cut Okinawa mango smoothie bursts with sweet-tart fruity flavors. Perfect for enjoying by the beach after a dip!", "name": "Kouri Fureai Hiroba Market Stand", "transport": "Turn left immediately after crossing Kouri Bridge to enter the Hiroba\u0027s large parking area."}, {"address": "1471-4 Okuma, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located at the northernmost rest stop in Yanbaru, offering unique local wild food choices. Try the grilled-to-order wild boar skewers\u2014tender, chewy, and rich in flavor without gameiness. The freshly fried Mozuku seaweed tempura is crispy outside and savory-slimy inside, loved by locals and eco-tourists alike.", "name": "Yui Yui Kunigami Roadside Station Stalls", "transport": "Drive north on National Route 58 straight into the Okuma area of Kunigami Village."}, {"address": "637 Nuha, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Ogimi Village is famous for longevity and native Shikuwasa citrus. This stall serves fresh Shikuwasa sparkling drinks and soft-serve ice cream\u2014zesty, refreshing, and great for cleansing the palate. Pair them with golden fried whitefish tempura or purple sweet potato cakes for an impressive sweet-and-savory combo.", "name": "Roadside Station Ogimi Shikuwasa \u0026 Tempura Stand", "transport": "Drive along National Route 58 through Nuha area in Ogimi Village to spot the roadside station."}, {"address": "Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture (Beside Kouri Beach)", "feature": "\u2b50 4.0 stars | Right next to Kouri Beach with vibrant island summer vibes. The signature \u0027Ryukyu Blue Shaved Ice\u0027 features finely shaved ice drizzled with tropical fruit syrup and sweet condensed milk\u2014cool and melt-in-your-mouth. They also serve crispy fried squid rings and garlic shrimp balls, making it the perfect post-beach snack stop.", "name": "Kouri Beachside Parlor", "transport": "A 1-minute walk from Kouri Bridge brings you right to the beachside food stalls."}, {"address": "17-1 Kyoda, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A popular savory snack stall at the Kyoda Rest Area foodie hub. Grilled-to-order Okinawa Agu pork sausages and skewers burst with juicy flavor at first bite. Their famous Mozuku seaweed tempura and squid ink tempura feature a light crisp batter packed with oceanic savory goodness. A must-stop when traveling to and from Yanbaru.", "name": "Kyoda Rest Area Agu Pork \u0026 Seafood Tempura Stall", "transport": "Exit Okinawa Expressway at Kyoda IC, take National Route 58 to arrive."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A takeaway sweets booth inside Kouri Ocean Tower specializing in treats made with local island pumpkin. The signature \u0027Kouri Pumpkin Cream Puff\u0027 has a crispy shell filled with silky pumpkin custard\u2014gently sweet with a subtle milky flavor. Enjoying it alongside stunning ocean views is pure bliss.", "name": "Kouri Ocean Tower Sweets Parlor", "transport": "Drive up the hill path for about 5 minutes after crossing Kouri Bridge to reach Ocean Tower."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Kouri Island and Yanbaru Nature Area"}, "motobu_churaumi": {"categories": {"cat_1": {"items": [{"address": "5 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1905 (Meiji 38), this century-old historic Okinawa soba institution is hailed as the sacred haven for Okinawa noodles. The noodles are handcrafted using traditional wood ash water, giving them an exceptionally chewy texture and a unique, subtle aroma with a firm bite. The broth, simmered slowly with bonito flakes and pork bones, is refreshing yet rich in deep savory sweetness. Their signature tender pork belly and braised pork ribs are stewed to melt-in-your-mouth perfection\u2014rich without being greasy. This century-long legacy of pure deliciousness attracts locals and long-distance tourists alike, all willing to wait in line for hours just for a single bowl.", "name": "Kishimoto Shokudo Main Store", "transport": "By car: Take the Kyoda IC exit, drive along Route 58 and Route 449 to Motobu Town (approx. 30 mins). By bus: Take Express Bus #888, get off at \u0027Motobu Town Office\u0027 stop, and walk for about 3 mins."}, {"address": "90 Nakayama, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Rebuilt from a 100-year-old traditional Ryukyuan red-tile house relocated to a lush forest hillside, this restaurant offers stunning views of a garden waterfall while dining. Famous for shabu-shabu and special Okinawa soba made with premium local \u0027Yanbaru Agu Pork\u0027. The Agu pork features delicate texture, well-marbled fat, and a subtle sweetness; lightly poached, it is incredibly tender and springy with no porky odor. Paired with a rich yet gentle simmered broth, every bite is a top-tier indulgence. Combined with its rich historic atmosphere and exquisite local ingredients, it\u0027s a sensory feast not to be missed in the Motobu Peninsula.", "name": "Hyakunen Kinka Ufuya", "transport": "By car: Take the Kyoda IC exit, follow Route 58 onto Prefectural Route 84 heading toward Motobu (approx. 20 mins)."}, {"address": "70 Izumi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Tucked away in the mountain forests of Motobu Town, this immensely popular traditional Okinawa soba spot often sells out early. Their signature \u0027Tender Sparerib Soba\u0027 is an absolute masterpiece\u2014the spareribs are slowly simmered until the cartilage becomes jelly-like, tender, and springy, while the meat falls off the bone. The soup features a pure pork bone and bonito double broth\u2014clear, naturally sweet, and never greasy\u2014paired with springy, flat noodles for a satisfying and comforting meal. The rustic wooden shop exudes a warm, nostalgic Showa-era charm, loved by both local regulars and visiting foodies.", "name": "Yamahara Soba", "transport": "By car: Drive along Prefectural Route 84 (Izumi Highway) toward Motobu Town; free parking available."}, {"address": "11-2 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located near Kishimoto Shokudo, this traditional dessert shop has over 70 years of history, specializing in authentic Okinawan \u0027Kintoki Red Bean Shaved Ice\u0027. The shop still insists on using traditional firewood and large pots to simmer Kintoki red beans until soft and fluffy while keeping the beans whole, perfectly balanced in sweetness with a hint of brown sugar aroma. Topped with powdery, snow-like shaved ice, it melts in your mouth instantly. The cold shaved ice combined with warm, velvety red beans creates a rich texture that is the ultimate summer refreshment. Simple yet crafted with dedication, this local treat is a must-try dessert when visiting the Churaumi area.", "name": "Arakaki Zenzai-ya", "transport": "By car: Approx. 30 mins from Kyoda IC exit. By bus: Get off at \u0027Motobu Town Office\u0027 stop and walk for about 2 mins."}, {"address": "603 Kenken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Highly recommended by locals, this hidden home-style diner offers a warm, comforting atmosphere. Signature dishes like the \u0027Pan-Fried Agu Pork Cutlet Set\u0027 and \u0027Deep-Fried Agu Pork Cutlet\u0027 use high-quality local pork, golden and crispy on the outside, thick, juicy, and springy on the inside. One bite bursts with natural sweet juices. Additionally, their house-special \u0027Agu Pork Liver Stir-Fry with Chives\u0027 and \u0027Goya Chanpuru (Stir-fried Bitter Gourd)\u0027 are executed to perfection\u2014crispy bitter gourd without harsh bitterness. It captures the true essence of traditional Okinawan grandmas\u0027 cooking, making it the top choice for authentic home-style flavors.", "name": "Kinokawa Shokudo", "transport": "By car: Take Route 449 toward Churaumi Aquarium, turn into Kenken Village; approx. 10 mins drive from the aquarium."}, {"address": "1153-2 Yamazato, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A scenic cafe set in a traditional house atop a hill in Motobu Town, boasting breathtaking panoramic views of the East China Sea and Ie Island. Though famous for its handmade pizzas, the atmosphere inside this traditional Ryukyuan red-tile structure is packed with local heritage charm. The pizza dough undergoes long fermentation, baking to a crispy exterior and soft interior with a rich wheat aroma. Generously topped with creamy melted cheese, local fresh sausage, and onions, the cheese stretches wonderfully with every slice. Paired with freshly prepared Okinawan citrus juice or red bean dessert soup, dining under the eaves of a hundred-year-old house with ocean breezes is the ultimate relaxing experience for both tourists and locals.", "name": "Kajinhou", "transport": "By car: Exit at Kyoda IC, take Route 58, turn onto Prefectural Route 84, then head up the mountain road (approx. 30 mins drive)."}, {"address": "1170 Kifu, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked deep in the virgin forest of Motobu Town, this hidden gem of an Okinawa soba shop is run by an elderly couple in a fairy-tale-like forest wooden cottage. Adhering to ancient methods, they collect natural wood to burn into ash water for hand-kneading the dough, giving the noodles incredible chewiness, distinct springiness, and a subtle wood ash aroma. The broth uses all-natural ingredients simmered over low heat without any added MSG, offering a clean, comforting, naturally sweet finish. Served with soft-boned pork tenderly simmered over long hours, the dish is insanely tender. Enjoying a bowl of handcrafted soba in a lush green garden lets you experience the purest Okinawan countryside charm.", "name": "Yume no Ya Hand-Rolled Okinawa Soba", "transport": "By car: Exit at Kyoda IC, turn into Motobu Town mountain roads; approx. 15 mins drive from Churaumi Aquarium."}, {"address": "851-1 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A classic yakiniku restaurant directly operated by Motobu Town\u0027s local ranch, specializing in top-grade Okinawan Kuroge Wagyu \u0027Motobu Beef\u0027. Motobu beef is raised on a special feed mixture containing sake lees, creating finely textured meat with exquisitely marbled fat. Lightly seared on the grill to medium-rare, the fat instantly melts, releasing a rich aroma\u2014melting in your mouth with tender, juicy sweetness and pure beef flavor. Whether it\u0027s the premium short rib or sirloin, paired with special sauces or simply Okinawan sea salt, every bite is divine. An unmissable top-tier gourmet feast for meat lovers visiting Motobu Peninsula.", "name": "Yakiniku Motobu Makiba Main Store", "transport": "By car: Drive along Route 449 into Ohama, Motobu Town to find the restaurant; approx. 10 mins drive from Churaumi Aquarium."}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "1153 Yamazato, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | A traditional Okinawan house-style cafe perched on a hill in Motobu Town, offering panoramic views overlooking the East China Sea and Ie Island. The signature handmade pizza boasts a golden, crispy crust with a satisfying crunch, topped with rich cheese and special sausage\u2014crispy on the outside, soft on the inside, and bursting with flavor. Many tourists come specifically to enjoy aromatic iced coffee amidst the nostalgic red-tiled roof setting, soaking in the ultimate relaxed Okinawan slow-life atmosphere.", "name": "Kajinhou", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium. Driving is recommended, with a dedicated parking lot available."}, {"address": "1438-1 Yamazato, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.4 stars | An open-air hammock cafe brimming with tropical resort vibes, surrounded by lush subtropical foliage with distant views of the blue ocean and sunset. Their brunch options and Thai Gapao rice are exceptionally popular\u2014pleasantly spicy, flavorful, and appetizing, perfectly paired with freshly pressed tropical fruit tea that is refreshingly sweet and sour. Travelers love swaying in a hammock, catching the gentle breeze, and enjoying a lazy, relaxing afternoon.", "name": "Caf\u00e9 Subtropical Teahouse", "transport": "About a 35-minute drive from Kyoda Interchange. Located near Kajinhou on the hilltop with parking available."}, {"address": "429 Bise, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.2 stars | An ocean-view cafe tucked away next to the Bise Fukugi Tree Road, seamlessly blending Okinawan tradition with modern tropical style. The signature brown sugar chiffon cake is moist, airy, and melts in your mouth, rich with caramel-like brown sugar flavor without being overly sweet. Paired with a smooth cold brew single-origin coffee, it is pure bliss. Outdoor terrace seating overlooks an endless sea-and-sky view, making it the perfect spot to stop for afternoon tea after strolling through the Fukugi trees.", "name": "CAF\u00c9 CAHIYA BULAN", "transport": "About a 10-minute walk from Okinawa Churaumi Aquarium, or drive to the Bise Fukugi Tree Road entrance parking lot and walk over."}, {"address": "930-1 Sakimotobu, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.5 stars | Renowned for its famously delicious American-style burgers, this is the wild, wildly popular brunch joint on the Motobu Peninsula. Their signature mega burger features a thick, handmade, extra-juicy beef patty, melted rich cheese, crisp fresh lettuce, and toasted buns that are crispy outside and soft inside, bursting with flavorful juices in every bite. Extremely hearty and delicious, it is highly praised by local foodies, tourists, and young crowds alike.", "name": "Captain Kangaroo Motobu", "transport": "Visible along National Route 449 while driving; about a 12-minute drive from Okinawa Churaumi Aquarium."}, {"address": "224 Bise, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.6 stars | A cute, pink-themed fruit smoothie and light bite stand in the Bise area, serving dreamy and colorful brunch smoothie bowls and drinks made from fresh local Okinawan fruits. The signature passion fruit and dragon fruit smoothies are silky-smooth with a perfectly balanced sweet-and-sour taste, topped with fresh fruit slices that look as good as they taste. Bursting with tropical sunshine vibes, it\u0027s an unmissable refreshing pitstop when exploring Bise.", "name": "Okinawa Sun Smoothie Stand", "transport": "Located inside the Bise Fukugi Tree Road area, about a 3-minute drive from Okinawa Churaumi Aquarium."}, {"address": "2626-1 Imadomari, Nakijin, Kunigami District, Okinawa", "feature": "\u2b50 4.1 stars | Featuring massive panoramic floor-to-ceiling windows, every seat in the house offers an unobstructed view of the crystal-clear turquoise ocean. Brunch features various pasta dishes and Okinawan black pork burgers\u2014the pasta is perfectly al dente and packed with flavorful sauce, while the pork patty is wonderfully juicy and thick. For dessert, try the Okinawan purple sweet potato tart with a special layered sparkling drink while listening to the soothing waves\u2014an unforgettable dining experience with picture-perfect views.", "name": "On the Beach CAFE", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium, situated right on the shore in Nakijin Village with free parking."}, {"address": "1533 Imadomari, Nakijin, Kunigami District, Okinawa", "feature": "\u2b50 4.5 stars | Nestled in the forest near Nakijin Castle Ruins, this nature-inspired cafe insists on using local organic ingredients and freshly baked home-style bread. The brunch platter includes freshly baked natural yeast bread with a crispy crust and soft center, accompanied by freshly harvested greenhouse salad and pan-sea
