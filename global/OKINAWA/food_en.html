red local bacon\u2014rich in texture and bursting with natural flavors. Surrounded by a tranquil, cozy setting with warm wooden decor, it is immensely popular with travelers seeking healthy light meals.", "name": "Caf\u00e9 Coo", "transport": "About a 5-minute drive from Nakijin Castle Ruins and a 15-minute drive from Okinawa Churaumi Aquarium."}, {"address": "981 Yamazato, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.2 stars | Perched atop a hill, this massive wooden Noah\u0027s Ark-shaped structure makes a striking visual statement. The cafe serves exquisite French toast brunch and homemade cakes. The French toast features a caramelized, crispy exterior with a soft, pudding-like interior rich in milky and egg flavor. Sitting on the 3rd-floor terrace offers a breathtaking 360-degree panoramic view of the lush Motobu Peninsula hills and the ocean beyond, attracting photographers and dessert lovers alike.", "name": "Caf\u00e9 Ark", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium to the top of the hill; dedicated parking lot available."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "90 Nakayama, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A classic scenic restaurant converted from a century-old traditional Ryukyu house, creating a rich retro Ryukyu Kingdom atmosphere. Their premium Agu Pork shabu-shabu and special kabayaki Agu pork rice are must-try signature dishes. The pork texture is incredibly fine and melts in your mouth, rich with natural sweet fats without feeling greasy at all. Sitting beside the waterfall garden listening to the soothing water streams and musical melodies, paired with a glass of local Awamori, lets you deeply experience Okinawa\u0027s unique slow-living leisure and quaint culinary culture. Highly popular among tourists and local family gatherings.", "name": "Hyakunen Koga Ufuya", "transport": "About a 25-minute drive from Okinawa Churaumi Aquarium; large free private parking lot available"}, {"address": "1127-1 Kenken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A long-established local home-style diner and izakaya hidden at the foot of the mountains in Motobu Town, highly recommended by local residents and food lovers alike. The eatery serves authentic Yanbaru home-cooked dishes, with its signature \u0027Pan-seared Agu Pork Cutlet\u0027 and \u0027Fresh Sashimi Set\u0027 being extremely popular. The pork cutlet is golden-crisp on the outside, tender, juicy, and bursting with rich meaty aroma on the inside. The daily fresh sashimi delivered straight from local fishing ports is firm and sweet. With a warm, welcoming homey atmosphere and generous portions at reasonable prices, it is the top choice for deeply experiencing authentic Okinawan home cooking.", "name": "Kinogawa Diner", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium"}, {"address": "138-1 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A classic late-night izakaya near Toguchi Port in Motobu Town, brimming with warm hospitality and island passion. The venue specializes in fresh fish dishes directly sourced from Okinawan sea fishermen and authentic Ryukyu snacks, such as crisp-on-the-outside and soft-on-the-inside \u0027Okinawa Mozuku Tempura\u0027, aromatic \u0027Goya Champuru (Stir-fried Bitter Melon with Tofu)\u0027, and rare local goat soup. Perfectly seasoned dishes paired with selected local Motobu Awamori bursting with fruity or rice aromas make the atmosphere lively as night deepens\u2014a fantastic dining bar to feel the night charm of an Okinawan small town.", "name": "Izakaya Yagame", "transport": "About a 3-minute walk from Motobu Town Hall, or a 15-minute drive from the aquarium"}, {"address": "29-7 Tancha, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A seafood dining bar located near Motobu Port, famous for its high value-for-money abundant seafood dishes and authentic izakaya fare. The must-order \u0027Seafood Donburi\u0027 is generously topped with local Okinawan marine delicacies like Great Green Turban shells and Red Coral Trout, offering a firm, springy texture with sweet ocean flavors. Additionally, deep-fried turban shell meat and teriyaki Spiny Lobster make ideal bar bites paired with beer or aged Awamori. The lively and comfortable dining environment makes it perfect for visitors to enjoy a lavish seafood feast after finishing their trip to the aquarium.", "name": "Kaisen-tei Motobu Port Branch", "transport": "About a 5-minute walk from Motobu Port Ferry Terminal; about a 12-minute drive from Okinawa Churaumi Aquarium"}, {"address": "861-1 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A local tavern filled with retro Showa-era charm, serving as a popular spot for Motobu residents to unwind with drinks and chat after work. The kitchen highlights various Ryukyu side dishes and charcoal-grilled skewers made from local Yanbaru ingredients. Among them, the \u0027Slow-simmered Braised Pork Belly (Rafute)\u0027 is melted to perfection\u2014the fatty portion is rich yet non-greasy, and the lean meat is tender, juicy, and effortlessly splits apart. Paired with a chilled glass of Okinawa Orion draft beer or the classic Awamori \u0027Kokuka\u0027, you can fully immerse yourself in the true local life of an Okinawan town with a light buzz.", "name": "Izakaya Kokuka", "transport": "About a 2-minute walk from Motobu Town Ohama Bus Stop"}, {"address": "861-3 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A dining bar focusing on showcasing the local chicken and Ryukyuan cuisine made from the rich agricultural and marine produce of northern Okinawa\u0027s Yanbaru region. Highly recommended are the \u0027Charcoal Yakitori Skewers\u0027 made with Yanbaru herb chicken and the \u0027Okinawan Pork Kimchi Stir-fry\u0027. The chicken skin is crispy and the meat tender, infused with a rich charcoal aroma that releases sweeter flavors with every bite. The tavern also offers various northern local sak\u00e9 and Awamori cocktails. Its joyful and energetic island izakaya atmosphere allows every visitor to feel the warm food culture of northern Yanbaru.", "name": "Yanbaru Izakaya Kitanoya", "transport": "About a 3-minute drive from Motobu Town Hall; about a 15-minute drive from Okinawa Churaumi Aquarium"}, {"address": "140 Toguchi, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A long-established traditional izakaya beloved by local fishermen and residents, featuring a distinctive Ryugu Castle aesthetic and ultra-fresh local seafood. The house-classic \u0027Sea Grape Sashimi Platter\u0027 features plump sea grapes that burst with a subtle salty-sweet ocean flavor in every bite. There are also crispy deep-fried island tofu and special salt-grilled fresh fish cooked to precise perfection, yielding delicate, juicy flesh. With extremely reasonable prices, it\u0027s a high-quality choice for experiencing authentic Okinawan nightlife with guaranteed satisfaction.", "name": "Izakaya Otohime", "transport": "Located inside Toguchi Shopping Street; about a 5-minute drive from Motobu Port"}, {"address": "872-9 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A cozy small local folk-art dining bar highly praised for its exquisite handcrafted Ryukyu local cuisine and comfortable tatami seating. The \u0027Okinawa Soba Seafood Set\u0027 and \u0027Garlic Pan-Seared Agu Pork\u0027 are popular top choices. The broth, slow-simmered from bonito flakes and pork bones, is sweet, clear, and rich, while the noodles are springy and chewy. The chef is extremely meticulous about ingredient selection, serving refined dishes full of warm, home-cooked charm. It is ideal for small groups wishing to quietly savor authentic Okinawan dishes along with a drink.", "name": "Ajidokoro Kanehisa", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium"}], "name": "Specialty Dining Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2626-1 Sakimotobu, Motobu Town, Kunigami District, Okinawa", "feature": "\u2b50 4.5 stars | A superb island vegetable caf\u00e9 located near the bridge connecting Motobu Town and Sesoko Island. The caf\u00e9 focuses on pesticide-free organic vegetables grown locally in Okinawa. The signature veggie platter is generously loaded with pan-fried island tofu, purple sweet potato salad, and a variety of sweet, crisp seasonal greens. Every bite delivers the natural sweetness and crunch of island vegetables with remarkably rich layers of flavor. Its warm wooden interior and healthy, guilt-free cooking style make it a favorite among health-conscious tourists and local vegetarians alike.", "name": "Shimayasai Cafe Tu-Kuru", "transport": "About a 12-minute drive from Okinawa Churaumi Aquarium"}, {"address": "118 Koechi, Nakijin Village, Kunigami District, Okinawa", "feature": "\u2b50 4.6 stars | A renowned fully vegan caf\u00e9 tucked away in the lush green forests of Nakijin Village on the Motobu Peninsula. The kitchen insists on using natural yeast to handmade whole-wheat bread and pure plant-based spice curry. The signature spice curry rice comes topped with abundant roasted island vegetables; the curry is rich, spicy, and smoothed out with coconut milk, leaving a lingering botanical aroma. The vegan bread is crispy on the outside, soft and delightfully chewy on the inside. With its peaceful atmosphere away from the hustle and bustle, combined with exquisite plant-based cuisine, this is a hidden sanctuary for vegan lovers.", "name": "Niceness Vegan Cafe", "transport": "About a 20-minute drive from Okinawa Churaumi Aquarium"}, {"address": "1051 Shoshi, Nakijin Village, Kunigami District, Okinawa", "feature": "\u2b50 4.4 stars | A cozy eatery dedicated to serving pure, natural, and organic plant-based dishes. Featuring freshly harvested vegetables carefully selected from the Motobu Peninsula, its popular island tofu set meal pairs smooth Okinawan island tofu with a savory ginger teriyaki sauce, offering a satisfying texture and irresistible aroma. The meal includes a light vegetable soup that refreshes the palate. The owner prepares all ingredients with immense care without adding chemical seasonings, allowing diners to savor the purest flavors and fresh textures of nature.", "name": "Cafe Karen", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium"}, {"address": "557 Sesoko, Motobu Town, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | A relaxed caf\u00e9 set in a tropical garden on Sesoko Island, offering a variety of vegetarian-friendly and vegan dishes. The island vegetable vegan pasta comes highly recommended\u2014al dente pasta tossed in rich olive oil and fragrant basil, complemented by refreshing grilled zucchini and bell peppers for a light yet satisfying meal. Enjoying sunshine and wholesome plant-based food surrounded by lush greenery gives a delightful resort vibe.", "name": "Fuu Cafe", "transport": "About a 15-minute drive from Okinawa Churaumi Aquarium, and 3 minutes after crossing the Sesoko Bridge"}, {"address": "401 Bise, Motobu Town, Kunigami District, Okinawa", "feature": "\u2b50 4.2 stars | A vegan-friendly scenic restaurant near Okinawa Churaumi Aquarium, offering unobstructed panoramic ocean views. The signature Vegan Taco Rice replaces minced meat with soy protein, paired with custom tangy salsa and abundant fresh lettuce. It is tangy, savory, crisp, and multi-layered in flavor, competing effortlessly with traditional taco rice. The stunning ocean view paired with healthy, appetizing plant-based food attracts countless aquarium visitors.", "name": "Caf\u00e9 Tetan", "transport": "About a 10-minute walk or 3-minute drive from Okinawa Churaumi Aquarium"}, {"address": "436-1 Kouri, Nakijin Village, Kunigami District, Okinawa", "feature": "\u2b50 4.4 stars | A vegan caf\u00e9 on Kouri Island known for its organic island vegetables and plant-based milk beverages. A must-try is the vegan vegetable curry plate, slow-cooked with over ten kinds of local vegetables and spices. The curry sauce is rich and smooth, while the vegetables retain their perfect crunch and sweetness. Finish your meal with a freshly blended Okinawan bitter melon and organic fruit smoothie\u2014sweet, smooth, refreshing, and ideal for cooling off. A must-visit gourmet spot during island sightseeing.", "name": "Cafe LOKA", "transport": "About a 25-minute drive from Okinawa Churaumi Aquarium, accessible after crossing Kouri Bridge"}, {"address": "682 Inoha, Motobu Town, Kunigami District, Okinawa", "feature": "\u2b50 4.1 stars | A cozy vegetarian caf\u00e9 run by local farmers, specializing in chemical-free vegetables cultivated in their own farm. Their vegetarian Okinawa Soba features a broth slow-simmered from kelp and various vegetables, resulting in a clear, sweet flavor. Accompanied by chewy noodles and topped with pan-fried Koya-dofu (freeze-dried tofu) and hydroponic greens, it offers a warm, comforting, and guilt-free taste of authentic Okinawan countryside vegetarian cooking.", "name": "Cafe Cha-Fi", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium"}, {"address": "513 Bise, Motobu Town, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | Nestled right by the scenic Bise Fukugi Tree Road, offering a variety of plant-based light meals and vegan acai bowls. The signature veggie sandwich uses vegan whole-wheat toast stuffed with thick grilled island tofu, fresh tomatoes, and lettuce, drizzled with custom sesame dressing. Every bite is crispy outside, tender inside, juicy, and richly aromatic. Enjoying vegan light bites and cold-pressed juice here after strolling through the Fukugi Tree Road provides pure healing for body and mind.", "name": "Cafe Cactus", "transport": "About a 12-minute walk or 3-minute drive from Okinawa Churaumi Aquarium"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "11-2 Toguchi, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.3 Stars | A historic dessert shop right next to the Motobu Public Market, specializing exclusively in traditional Okinawan shaved ice with red beans (Zenzai). Made from slow-cooked Kintoki kidney beans over firewood and served with chewy white mochi balls under soft, fluffy shaved ice. The cool, light texture of the ice blends beautifully with the rich, gentle sweetness of the red beans. Refreshing and chewy, it\u2019s a must-try summer treat while strolling around Motobu.", "name": "Aragaki Zenzai-ya (\u65b0\u57a3\u30bc\u30f3\u30b6\u30a4\u5c4b)", "transport": "About a 10-minute drive from Okinawa Churaumi Aquarium, located around Motobu Toguchi Market."}, {"address": "17-1 Kyoda, Nago, Okinawa (Inside Roadside Station Kyoda)", "feature": "\u2b50 4.4 Stars | Hailed as the best Sata Andagi (Okinawan deep-fried sugar doughnuts) on the island. Located inside Kyoda Rest Area, this popular stall serves them freshly fried with an exceptionally crispy, biscuit-like exterior and a dense, moist cake interior\u2014never greasy. Alongside classic plain and brown sugar flavors, purple sweet potato and red bean are also crowd favorites. With rich egg aromas and caramelized brown sugar notes, its irresistible contrast of crispy outside and tender inside makes it an essential road-trip snack on your way to Motobu Peninsula.", "name": "Michi-no-Eki Kyoda Sata Andagi (\u9053\u306e\u99c5 \u8a31\u7530 \u3055\u30fc\u305f\u30fc\u3042\u3093\u3060\u304e\u30fc)", "transport": "About a 3-minute drive from Kyoda Interchange to Roadside Station Kyoda."}, {"address": "4 Toguchi, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.1 Stars | A traditional Okinawan tempura stall tucked inside Motobu Public Market. Unlike light, crispy mainland Japanese tempura, Okinawan tempura features a thicker, savory, fluffy batter\u2014almost like a savory fritter\u2014wrapped around fresh white fish and squid. Served piping hot, the soft batter melts nicely into tender, juicy fish flesh. Drizzle a bit of Worcestershire sauce to enhance the flavor. A local favorite and a delight for travelers seeking authentic market eats.", "name": "Motobu Public Market Fish Tempura (\u672c\u90e8\u753a\u516c\u8a2d\u5e02\u5834 \u9b5a\u5929\u3077\u3089)", "transport": "Located inside Motobu Public Market, about a 15-minute bus ride from Okinawa Churaumi Aquarium."}, {"address": "314 Kouri, Nakijin, Kunigami District, Okinawa", "feature": "\u2b50 4.2 Stars | An extremely popular American-style food truck located right next to Kouri Bridge. Fresh, plump white shrimp are high-heat saut\u00e9ed with garlic butter, spicy sauce, or lemon garlic. The shrimp are firm, bouncy, and packed with sweet juiciness, coated in signature garlic sauce that pairs perfectly with warm, fluffy white rice. Enjoy your meal outdoors overlooking the brilliant \u0027Kouri Blue\u0027 ocean for a wonderful blend of atmosphere and taste.", "name": "Kouri Shrimp Food Truck (Kouri Shrimp)", "transport": "About a 1-minute drive after crossing Kouri Bridge, located at the parking lot on the right."}, {"address": "1421-39 Kenken, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.5 Stars | Artisanal gelato made using local agricultural produce from the Yanbaru region in northern Okinawa. The top bestseller, \u0027Katsuyama Shikwasa\u0027, features a sweet-and-sour refreshing citrus aroma with a silky smooth, melt-in-your-mouth texture. Other exquisite flavors include \u0027Nakijin Watermelon\u0027 and \u0027Ie Island Sweet Potato\u0027. Naturally light and velvety, it is the ultimate refreshing treat while exploring under the northern sunshine.", "name": "Yanbaru Gelato Motobu Main Store (\u3084\u3093\u3070\u308b\u30b8\u30a7\u30e9\u30fc\u30c8)", "transport": "About an 8-minute drive from Okinawa Churaumi Aquarium."}, {"address": "17-1 Kyoda, Nago, Okinawa (Outdoor Stall at Roadside Station Kyoda)", "feature": "\u2b50 4.3 Stars | The most eye-catching charcoal-grilled barbecue stall in the outdoor food area at Kyoda Rest Area. Thick chunks of famous Okinawan Agu Pork are grilled over open coals until golden brown, locking in juicy flavors. Juicy, tender, and uniquely bouncy with just the right amount of crispness, it feels rich without being greasy. Lightly seasoned with black pepper and Okinawan sea salt, it\u0027s a savory street food snack you can easily enjoy on the go.", "name": "Michi-no-Eki Kyoda Agu Pork Skewers (\u9053\u306e\u99c5 \u8a31\u7530 \u8c5a\u4e32)", "transport": "Outdoor plaza of Roadside Station Kyoda along National Route 58."}, {"address": "424 Ishikawa, Motobu, Kunigami District, Okinawa (Inside Ocean Expo Park)", "feature": "\u2b50 4.0 Stars | A popular snack corner located in Churaumi Plaza inside Ocean Expo Park. The undisputed star here is the ocean-blue \u0027Churaumi Blue Soft Serve\u0027, featuring a subtle blend of soda and milk flavor that\u0027s delightfully sweet, creamy, and photogenic. They also offer freshly steamed Agu Pork Buns with thin dough and rich, savory meat filling that bursts with flavor. It\u2019s a top street-snack pick to recharge your energy after exploring the aquarium.", "name": "Churaumi Plaza Snack Stand (\u7f8e\u3089\u6d77\u30d7\u30e9\u30b6 \u8efd\u98df\u30b3\u30fc\u30ca\u30fc)", "transport": "Located inside Churaumi Plaza, right next to the exit of Okinawa Churaumi Aquarium."}, {"address": "Bise, Motobu, Kunigami District, Okinawa", "feature": "\u2b50 4.2 Stars | A charming, relaxed snack stand located alongside the tranquil Bise Fukugi Tree Avenue. They serve made-to-order freshly fried traditional Sata Andagi doughnuts and Okinawan Shikwasa citrus juice. The doughnuts feature an extra-crispy crust with rich wheat and brown sugar aromas, paired perfectly with a glass of ice-cold natural Shikwasa juice\u2014crisp, tart, and immensely refreshing. Strolling under the green foliage while enjoying these local treats offers an authentic Okinawan island vibe.", "name": "Bise Fukugi Tree Line Parlor (\u5099\u702c\u306e\u30d5\u30af\u30ae\u4e26\u6728 \u30d1\u30fc\u30e9\u30fc)", "transport": "About a 3-minute drive from Okinawa Churaumi Aquarium, around the entrance to Bise Fukugi Tree Avenue."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Motobu Peninsula and Churaumi Aquarium"}, "naha_kokusai": {"categories": {"cat_1": {"items": [{"address": "3-3-3 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1970, this ultra-popular, long-standing Ryukyu home-style restaurant is tucked away in an alley off Kokusai-dori. Stepping inside reveals a nostalgic izakaya atmosphere. Their signature \u0027Rafute\u0027 (braised pork belly) is cooked until melt-in-your-mouth tender, featuring sweet, non-greasy fat combined with a specially crafted aged Awamori soy-sauce glaze for a perfect savory-sweet balance. The Goya Champuru (bitter melon stir-fry) maintains the crispness of the melon and the rich soy flavor of island tofu, creating a deeply textured local delicacy loved by both locals and foreign travelers.", "name": "Yunangii", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Prefectural Office Station\u0027"}, {"address": "1-7-3 Tsuji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Established in 1953 during the U.S. military administration era, this legendary steakhouse epitomizes Okinawa\u0027s unique culture of enjoying steak after a night out drinking. The flagship \u0027Tenderloin Steak\u0027 is seared at high temperatures to lock in flavorful juices, offering an extraordinarily tender texture rich in classic beef flavor. Pairing it with house-made sauce and minced garlic takes the taste to the next level. Retro American decor and reasonable prices keep a steady crowd queuing up outside.", "name": "Jack\u0027s Steak House", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Asahibashi Station\u0027"}, {"address": "1-8-8 Matsuyama, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A high-end historic ryotei passing down the essence of Ryukyu Kingdom royal court cuisine, housed in a preserved traditional wooden machiya building. Signature dishes like braised pork belly and \u0027Jimami Tofu\u0027 (peanut tofu) are exquisitely flavorful; the peanut tofu boasts a silky, pudding-like elasticity infused with rich peanut aroma, drizzled with a delicious sweet sauce. Paired with serene views of an elegant Japanese garden, it offers gourmets a royal dining experience for both the eyes and the palate.", "name": "Ryukyu Cuisine Mie", "transport": "About a 7-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "1-7 Shuri Akatacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | An iconic Okinawa soba institution carrying on a century-old traditional craft, open for just a few hours daily until sold out. The noodles are hand-kneaded using traditional wood ash lye water, giving them a delightfully chewy texture and distinct wheaty aroma. The broth, simmered delicately from Okinawan black pork bones and bonito flakes, is clear, sweet, and non-greasy. Topped with thick, tender braised pork belly and savory Kamaboko fish cakes, its pure and authentic flavors draw endless streams of food lovers.", "name": "Shuri Soba", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Shuri Station\u0027"}, {"address": "1-4-59 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Tucked away in an alley near the Kokusai-dori shopping district, this traditional eatery specializes in unique Daito Island-style soba. The noodles are thicker and slightly curly compared to standard Okinawa soba, featuring a bouncy, chewy bite that fully absorbs the light yet flavorful bonito pork broth. Pair it with their famous \u0027Daito Sushi\u0027\u2014fresh tuna marinated in a house soy glaze over seasoned sushi rice\u2014for a tender, sweet, and distinctly local delicious duo.", "name": "Daito Soba", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "2F, 3-2-17 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located on the 2nd floor of a building on Kokusai-dori, this nostalgic soba diner is a beloved favorite among local residents and students. Serving Miyako-style Okinawa soba with a sweet, refreshing broth, its signature \u0027Soki Soba\u0027 features stewed pork ribs braised so tender that even the soft cartilage melts in your mouth, rich in natural collagen. Smooth, slightly wavy noodles soak up the savory bonito broth, making every bite feel like a cozy, nostalgic taste of Okinawan home cooking.", "name": "Doraemon Okinawa Soba", "transport": "About a 3-minute walk from Okinawa Monorail \u0027Prefectural Office Station\u0027"}, {"address": "1-3-18 Matsuyama, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Situated along Route 58, this legendary casual diner has been comforting Naha locals for decades. Its famous specialty is \u0027Okinawa Champon\u0027\u2014unlike the noodle soup version found elsewhere in Japan, Okinawan Champon consists of minced beef, cabbage, and eggs stir-fried together and served over a hot bowl of rice. Savory, smooth, and delightfully comforting, it offers generous portions at affordable prices, capturing the authentic essence of simple Okinawan comfort food.", "name": "Mikado Shokudo", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Prefectural Office Station\u0027"}, {"address": "3-2-10 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 3.9 stars | A legendary budget-friendly diner that has stood inside Heiwa-dori Shopping Street for over half a century, oozing charming Showa-era retro nostalgia. It offers extraordinarily generous traditional Okinawan set meals. The signature \u0027Hanagasa Set\u0027 includes pork tonkatsu, grilled red rockfish, Goya Champuru, and a small bowl of Okinawa Soba, loaded with homestyle goodness. Meals come with house-made sweet red bean soup or Okinawa iced tea. Hearty portions and friendly, motherly service deliver a warm, heartwarming taste of local hospitality.", "name": "Hanagasa Shokudo", "transport": "About an 8-minute walk from Okinawa Monorail \u0027Makishi Station\u0027"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "1F Takamine Building, 2-9-6 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A wildly popular brunch spot right next to Makishi Market, built around the concept of \u0027Delicious Breakfast on a Journey.\u0027 Their must-try signature Souffl\u00e9 Pancakes are made to order, filling the room with a rich aroma of eggs and milk as they arrive at your table. Cutting into them reveals a light, cloud-like, fluffy texture that melts instantly in your mouth. Drizzled with maple syrup and served with fresh fruit and smooth cream, they offer a rich yet perfectly balanced sweetness. The menu also features delicious acai bowls and hearty Eggs Benedict, drawing crowds of tourists and locals every morning.", "name": "C\u0026C BREAKFAST Okinawa", "transport": "Take the Okinawa Yui Rail to \u0027Makishi Station\u0027 and walk for about 8 minutes."}, {"address": "1F Sun Heights Matsuo, 2-8-19 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A renowned Japanese souffl\u00e9 pancake specialty shop located in the heart of Kokusai Street. Their pancakes are crafted using high-quality fermented butter from New Zealand and pure maltose, completely free of preservatives. Freshly baked, these thick and fluffy pancakes feature an exquisitely soft, moist texture that releases a rich egg flavor with every bite. Topped with custom fermented butter and bittersweet maple syrup, every bite feels like tasting a sweet cloud. With its elegant, comfortable atmosphere and heavenly textures, it\u0027s a top brunch pilgrimage for dessert lovers visiting Naha.", "name": "A Happy Pancake Naha Kokusai Street Branch (\u5e78\u305b\u306e\u30d1\u30f3\u30b1\u30fc\u30ad)", "transport": "Take the Yui Rail to \u0027Miebashi Station\u0027 or \u0027Makishi Station\u0027, then walk for about 7 minutes."}, {"address": "1-4-1 Izumizaki, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Naha\u0027s most stylish French bakery and brunch cafe, designed around the lifestyle theme of \u0027clothing, food, living\u0027 and bread. Their signature French Toast uses house-baked thick-cut bread thoroughly soaked in a special egg mixture. Pan-fried to a golden crisp on the outside while remaining custard-pudding soft on the inside, every bite bursts with rich milk and egg flavors. Paired with freshly cooked sausage, bacon, and crisp salad, the savory-sweet balance is irresistible. The warm, rustic industrial decor offers a cozy backdrop for a relaxing, gourmet morning.", "name": "oHacort\u00e9 Bakery Izumizaki", "transport": "Take the Yui Rail to \u0027Kenchomae Station\u0027 and walk for about 5 minutes."}, {"address": "1-1-39 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A trendy fried donut ball shop tucked away in the alleyways off Kokusai Street, offering a unique and stylish light brunch experience. Fried fresh to order, these signature spherical donuts feature a crispy golden exterior with a chewy, soft center that never feels greasy. The crowd-favorite Lemon \u0026 Sugar flavor comes dusted with sugar and served with fresh lemon slices. Squeezing the tangy juice over the hot dough creates a delightful blend of sweet and zesty flavors that will keep you coming back for more.", "name": "BALL DONUT PARK Naha", "transport": "Take the Yui Rail to \u0027Miebashi Station\u0027 and walk for about 6 minutes."}, {"address": "B1F Don Quijote Kokusai Street, 2-8-19 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A unique eco-friendly cafe in Okinawa that roasts its coffee beans using dead weathered coral at a high temperature of 200\u00b0C (named 35 because the Japanese word for coral, \u0027Sango\u0027, sounds like 35). Their signature coral-roasted coffee boasts a distinct flavor\u2014moderately bitter with a smooth, sweet finish and a subtle roasted aroma. Beyond hot coffee, iced hibiscus tea and coffee soft-serve ice cream are also highlights. Furthermore, the company donates 3.5% of its profits to Okinawa\u0027s coral restoration projects, allowing guests to support marine conservation while enjoying a relaxing coffee break.", "name": "35 COFFEE Don Quijote Kokusai Street", "transport": "Take the Yui Rail to \u0027Miebashi Station\u0027 or \u0027Makishi Station\u0027, then walk for about 7 minutes."}, {"address": "1-2-6 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A specialty pour-over coffee shop housed in a renovated traditional home, tucked away in a quiet alley off bustling Kokusai Street. The cafe meticulously selects premium single-origin beans from around the world, expertly roasted in-house. Their signature pour-over coffee is clean and delicate with distinct layers, highlighting the beans\u0027 natural floral, fruity, and subtle acidic notes. Pair it with their homemade specialty Tiramisu\u2014featuring espresso and liqueur-soaked ladyfingers blended with velvety mascarpone cheese\u2014for an exquisite morning treat that specialty coffee lovers shouldn\u0027t miss.", "name": "T\u0026M Coffee", "transport": "Take the Yui Rail to \u0027Miebashi Station\u0027 and walk for about 5 minutes."}, {"address": "1-2-25 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A minimalist industrial-style brunch cafe located along the Kumoji River, inspired by Portland\u0027s vibrant coffee culture. Their signature Shakshuka features fresh tomatoes, spices, roasted vegetables, and poached eggs simmered together, served with crusty sourdough bread. Spread with rich cheese and runny warm yolk, it offers a deeply comforting, multi-layered flavor profile. Paired with a top-notch light-roast oat milk latte that is silky and aromatic, this spot has become a favorite morning haunt for Naha\u0027s trendy crowd and international travelers alike.", "name": "Better Girl", "transport": "Take the Yui Rail to \u0027Kenchomae Station\u0027 and walk for about 2 minutes."}, {"address": "1-7-14 Tsuboya, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A delightful Thai-inspired brunch cafe near Tsuboya Yachimun Street and Makishi Market, skillfully blending local Okinawan ingredients with Southeast Asian spices. Their signature morning spice curry platter offers a half-and-half combination option. The curry sauce is simmered with abundant fresh herbs and coconut milk, yielding a rich, smooth texture with mild spice and subtle natural sweetness. Served with tender, juicy Okinawan herb chicken and fresh organic vegetables, it\u0027s a vibrant and appetizing meal. The warm, cozy handmade decor and comforting coffee bring a refreshing multi-cultural culinary start to your Naha morning.", "name": "Cafe Soi", "transport": "Take the Yui Rail to \u0027Makishi Station\u0027 and walk for about 9 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "3-3-3 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in an alley off Kokusai Dori, this extremely popular legendary Okinawan izakaya has maintained its cozy, homemade family flavor since opening in the 1970s. The signature dish, \u0027Rafute\u0027 (Braised Pork Belly), is slow-cooked for hours with Awamori and brown sugar until melt-in-your-mouth tender, rich in savory sauce without being oily. Another must-try is the \u0027Goya Chanpuru\u0027 (Stir-fried Bitter Melon with Tofu), which perfectly balances the refreshing bitterness of the gourd with the rich aroma of local island tofu. Bustling with both tourists and locals, the slightly tipsy, lively atmosphere lets you fully experience Okinawa\u0027s warm hospitality.", "name": "Yunangii Okinawan Cuisine (\u3086\u3046\u306a\u3093\u304e\u3044)", "transport": "About a 4-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "388-5 Asato, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Hailed as a sanctuary for traditional Ryukyu cuisine and aged Awamori, Urizun was founded in 1972 and continues to captivate countless gourmets and drinkers. Their original creation, \u0027Duru-ten\u0027 (Deep-fried Taro Cakes), features a crispy crust and a rich, creamy filling packed with taro and shiitake mushroom aromas, making it an exceptional pub snack. The restaurant houses over a hundred varieties of aged Awamori spirits from all over Okinawa, paired perfectly with chewy Okinawan noodles and house-special miso stir-fried bitter melon. The weathered wooden textures and nostalgic antique vibe inside this old house invite guests to immerse themselves in the most authentic Ryukyuan nightlife.", "name": "Izakaya Urizun (\u5c45\u9152\u5c4b \u3046\u308a\u305a\u3093)", "transport": "About a 2-minute walk from Okinawa Monorail \u0027Asato Station\u0027"}, {"address": "1-10-8 Matsuyama, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A highly coveted hot pot gastropub in downtown Naha specializing in exquisite Agu pork. It strictly selects top-tier purebred Agu pork slices featuring a gorgeous pink color and exquisite marbling. Swirled in special broth for just a few seconds, the meat becomes extraordinarily tender with an astonishing natural sweetness and clean fat aroma, completely free of any gameiness. Pair it with the chef\u0027s special fruit vinegar dipping sauce and mozuku seaweed, alongside a chilled Orion beer, to experience a truly luxurious ultimate Okinawan meat feast.", "name": "Honke Shabu-Shabu Matsumoto (Agu Pork)", "transport": "About an 8-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "1-2-2 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located in the heart of Kokusai Dori, this vibrant gastropub combines authentic local Okinawan cuisine with live traditional Sanshin folk music performances. Here, you can sample a rich variety of Ryukyu royal and home-style dishes, such as silky \u0027Jimami Tofu\u0027 (Peanut Tofu) and juicy \u0027Salt-Grilled Agu Pork Skewers\u0027. The nightly live Sanshin performances are powerfully engaging, as performers lead the entire dining room in clapping and dancing\u2014making its joyous, high-energy atmosphere the top choice for experiencing Okinawa\u0027s celebratory culture.", "name": "Okinawa Ryori Angama (Kokusai Dori Branch)", "transport": "About a 5-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "1-2-25 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A stylish craft beer pub directly operated by Okinawa\u0027s famous Helios Distillery. Tap lines directly connected to the brewery serve the renowned \u0027Hyakunen Kominka Agu Pork Beer\u0027 alongside multiple world-award-winning craft stouts and wheat beers. The food menu highlights fusion pub eats using local ingredients, such as \u0027Sea Grape Cheese Salad\u0027, \u0027Garlic Agu Pork Sausage\u0027, and crispy \u0027Okinawan Stuffed Purple Sweet Potato Fries\u0027. The modern high-ceilinged dining space is hugely popular among young travelers and women, making it a fantastic spot on Kokusai Dori to enjoy craft beer.", "name": "Helios Craft Beer Pub (Kokusai Street Branch)", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "1-2-26 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A seafood and Okinawan izakaya brimming with the vibrant energy of a fishing port. Step inside to immediately feel the immersive island festival vibe. The restaurant features daily fresh fish sashimi delivered straight from local ports, as well as charcoal-grilled Okinawa black hair Wagyu beef and seafood delicacies. The piping hot \u0027Teppan Agu Pork Gyoza\u0027 are crispy on the outside and juicy on the inside, pairing perfectly with an ice-cold Awamori cocktail. Infectious live Sanshin folk performances take place every evening, bringing high-pitched, joyful tunes and a table full of delicious food for a grand night full of laughter.", "name": "Okinawan Cuisine Chinuman (Kokusai Dori Branch)", "transport": "About a 6-minute walk from Okinawa Monorail \u0027Miebashi Station\u0027"}, {"address": "1-3-17 Matsuyama, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | An iconic late-night diner-style casual pub in Naha\u0027s Matsuyama area that has served as a sanctuary for locals and late-night drinkers for decades. The restaurant\u0027s most talked-about signature dish, \u0027Okinawan Sukiyaki\u0027, features stir-fried minced beef, onions, and garlic in a special sweet-and-savory sauce topped with a soft-boiled egg\u2014boasting a rich aroma and impressive portions. Furthermore, various Chanpuru stir-fries offer a crisp texture and cozy homemade flair. With affordable prices and welcoming lights open 24 hours, it showcases Naha\u0027s most genuine and profound local food culture.", "name": "Mikado (Matsuyama Branch)", "transport": "About a 7-minute walk from Okinawa Monorail \u0027Kencho-mae Station\u0027"}, {"address": "2-2-30 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A unique upscale Okinawan gastropub themed around an \u0027aquarium undersea cave\u0027. The restaurant features a massive aquarium and serene rock cave decor where colorful tropical fish swim, filling your dining experience with fantasy. The menu offers exquisite Ryukyu Kaiseki cuisine and top-tier stone-grilled Agu pork. The \u0027Charcoal-Grilled Ishigaki Beef\u0027 melts in your mouth with rich fatty flavor, while the \u0027Sea Grape Sashimi Platter\u0027 delivers a delightful popping texture packed with oceanic freshness. With its romantically mysterious atmosphere and luxurious environment, it is an exceptional hidden gem for romantic dates and business dinners.", "name": "Okinawan Cuisine Umikaji (Kokusai Dori Branch)", "transport": "About a 3-minute walk from Okinawa Monorail \u0027Makishi Station\u0027"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2-12-3 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A landmark organic vegan restaurant on Ukishima Street, highlighting traditional Okinawan vegetables and grains to perfection. The signature \"Vegan Taco Rice\" swaps minced meat for mixed grains and organic tofu, topped with a custom spiced sauce and fresh lettuce for a richly layered flavor profile with a robust soy fragrance. The crispy Shima-tofu cutlet is golden on the outside and tender inside, completely free of any greasy feel typical of some vegetarian foods. With its warm and elegant atmosphere, it is a favorite among Western tourists and health-conscious local women.", "name": "Ukishima Garden", "transport": "Approx. 9-minute walk from Miebashi Station or 10-minute walk from Kencho-mae Station on the Okinawa Urban Monorail."}, {"address": "1-6-9 Tsuboya, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alley near Tsuboya Yachimun (Pottery) Street, this cozy vegan cafe set in a traditional house offers 100% egg- and dairy-free organic vegan dishes. The \"Daily Vegan Plate\" features delicate small dishes made from local Okinawan wild vegetables, served alongside brown rice and rich homemade miso soup\u2014refreshing yet full of flavor. Their house-special plant-based, gluten-free cheesecake is silky smooth with a subtle nutty aroma, making it a perfect sweet treat during a leisurely stroll.", "name": "Mana Pure Vegan Cafe", "transport": "Approx. 8-minute walk from Makishi Station on the Okinawa Urban Monorail, close to Tsuboya-dori."}, {"address": "1-3-30 Tsuboya, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A historic Taiwanese vegetarian staple in downtown Naha, famous for its unbeatable value vegetarian all-you-can-eat buffet. It offers dozens of freshly prepared dishes daily, including aromatic stir-fried island vegetables, vegetarian Mapo Tofu, and fried mock meat\u2014all authentically seasoned without being greasy. The star attraction is their handcrafted \"Vegetarian Sticky Rice Zongzi,\" featuring chewy, fragrant sticky rice wrapped around savory shiitake mushrooms and dried tofu. It\u0027s savory, satisfying, and a popular take-away snack for walking around.", "name": "Kintsubo Shokudo", "transport": "Approx. 7-minute walk from Makishi Station on the Okinawa Urban Monorail, located in an alley off Heiwa-dori Shopping Street."}, {"address": "2F Palette Kumoji, 1-1-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A stylish light-bites cafe inside the department store at Kencho-mae Station, offering a rich plant-based menu for health-conscious diners. The \"Vegan Rainbow Bowl\" features carefully selected local Okinawan organic superfoods drizzled with custom sesame dressing, delivering crisp, sweet, and layered bites. The \"Plant-Based Thick Burger\" is equally impressive\u2014juicy plant patty, fresh tomatoes, lettuce, and dairy-free sauce make it just as savory as a traditional beef burger, earning high praise from international travelers.", "name": "Rakuen Cafe", "transport": "1-minute walk from Kencho-mae Station on the Okinawa Urban Monorail, directly connected to Palette Kumoji 2F."}, {"address": "1-1-60 Asato, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A minimalist vegan restaurant near Makishi Station dedicated to serving delicious 100% plant-based dishes. The \"Vegan Green Curry\" uses a coconut milk base packed with fresh local vegetables and Shima-tofu, offering a rich, mildly spicy, and soothing broth. The \"Vegan Teriyaki Soy Cutlet Burger\" boasts a crispy, lightly seared exterior that absorbs the sweet and savory sauce for a juicy, chewy bite. Served with crispy fries, it\u0027s a favorite gathering spot for plant-based eaters near Kokusai-dori.", "name": "Cafe VG Naha", "transport": "Approx. 3-minute walk from Makishi Station on the Okinawa Urban Monorail."}, {"address": "2-11-13 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A cozy alleyway cafe specializing in organic and vegetarian cuisine, highly praised by vegan foodies for its signature \"Vegan Veggie Ramen.\" The broth is slow-simmered for hours using kelp, shiitake mushrooms, and organic vegetables, creating a sweet, deep flavor without feeling heavy. Served with springy additive-free noodles and seared Shima-tofu \"chashu,\" every bite is infused with veggie goodness. They also offer thick, smooth organic vegan smoothies that are refreshing and sweet\u2014a perfect energy boost while shopping on Kokusai-dori.", "name": "Organic Cafe Espacio", "transport": "Approx. 10-minute walk from Miebashi Station on the Okinawa Urban Monorail, near Makishi Public Market."}, {"address": "3-1-11 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A rare handmade vegan dessert shop in downtown Naha, specializing in healthy, guilt-free treats free of eggs, dairy, and refined white sugar. The popular \"Vegan Crepe\" features a delicate wrap made with organic soy milk and oat flour, lightly scented with grain aroma and filled with Okinawa brown-sugar-stewed red beans and nut cream\u2014sweet without being cloying. Carefully selected ingredients allow those with dairy allergies or strict vegans to fully enjoy a delicate afternoon tea.", "name": "L\u0027Aura Vegan Sweets \u0026 Cafe", "transport": "Approx. 5-minute walk from Makishi Station on the Okinawa Urban Monorail, located in an alley in the heart of Kokusai-dori."}, {"address": "2-4-15 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A refined plant-based eatery highlighting natural eating concepts by blending traditional Okinawan ingredients with modern cooking techniques. The \"Vegan Goya Champuru\" tames the bitterness of bitter melon before stir-frying it on high heat with organic Shima-tofu, wood ear mushrooms, and a special soybean paste\u2014crisp melon and creamy tofu deliver an authentic home-cooked Okinawan flavor. Paired with soft and fragrant 16-grain rice, the meal is rich in texture and nutritionally balanced, attracting locals and tourists seeking health and wellness.", "name": "Kitchen Kukuru Vegan Light Food", "transport": "Approx. 5-minute walk from Miebashi Station on the Okinawa Urban Monorail."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-8-35 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Okinawa\u0027s iconic national street food! Made-to-order steaming hot rice balls packed with thick-cut pan-fried Spam, tender seaweed, and a freshly cooked fluffy omelet. The rice is chewy, savory, and perfectly seasoned, offering rich layers of flavor. Perfect for breakfast or a walking snack while exploring, always drawing long queues of tourists and locals alike.", "name": "Pork Tamago Onigiri Makishi Market Main Store", "transport": "Approx. 9 minutes walk from Okinawa Urban Monorail Makishi Station or Miebashi Station"}, {"address": "2F, First Makishi Public Market, 2-10-1 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A hidden traditional street dessert tucked away on the 2nd floor of the First Makishi Public Market! Renowned as the best Sata Andagi (Okinawan fried dough fritters) in town. Freshly fried daily, the exterior is incredibly crispy while the inside is soft, cake-like, fluffy, and rich with egg flavor without being greasy. Addictively good when warm right out of the fryer, they often sell out shortly after opening.", "name": "Sata Andagi Bu", "transport": "Approx. 10 minutes walk from Okinawa Urban Monorail Miebashi Station"}, {"address": "1-1-39 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A super popular modern street dessert spot hidden in the alleys of Kokusai-dori! Specializing in made-to-order, bite-sized spherical donuts that are golden-crispy on the outside and wonderfully springy and chewy inside. The top-rated Lemon Butter flavor is drizzled with fresh lemon juice, perfectly sweet and tangy without being overly heavy. Served in cute, stylish cups, it\u0027s ideal for snacking on the go.", "name": "Ball Donut Park Naha", "transport": "Approx. 8 minutes walk from Okinawa Urban Monorail Miebashi Station"}, {"address": "3-29-67 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | An aromatic Baumkuchen specialty shop right on main Kokusai Street. Through the front glass display, you can watch the chefs roast the cakes live while intoxicating aromas of brown sugar and fresh cream fill the air. Their signature Okinawan Brown Sugar Baumkuchen features a lightly caramelized outer crust and a moist, soft interior, bursting with rich local brown sugar flavor. An exquisite local delicacy perfect for street snack lovers.", "name": "Fukugiya Kokusai-dori Main Store", "transport": "Approx. 5 minutes walk from Okinawa Urban Monorail Kencho-mae (Prefectural Office) Station"}, {"address": "3-2-2 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A fresh-fried potato chip and fry shop located in the vibrant Kokusai-dori shopping district! Here, you can savor Okinawa-exclusive freshly fried Purple Yam Fries (Poteriko). Served piping hot, they feature a super crispy outer layer and a soft, mashed-potato-like interior with a subtle natural sweet flavor. A must-try street food treat when strolling down Kokusai Street.", "name": "Calbee+ Okinawa Kokusai-dori", "transport": "Approx. 5 minutes walk from Okinawa Urban Monorail Makishi Station"}, {"address": "2-16-27 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | An old-school Okinawan tempura shop nestled in the alleyways around Makishi Market. Unlike delicate traditional mainland Japanese tempura, Okinawan-style tempura features a thicker, savory-seasoned batter that\u0027s delightfully chewy and soft. The signature Mozuku (seaweed) tempura and Bitter Melon (Goya) tempura are crispy outside, tender inside, hearty, and extremely wallet-friendly, making them a favorite among local neighborhood regulars and savvy travelers.", "name": "Goya Tempura Shop", "transport": "Approx. 10 minutes walk from Okinawa Urban Monorail Miebashi Station"}, {"address": "2-2-34 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A vibrant and eye-catching artisanal gelato shop on Kokusai Street! Daily handcrafted gelatos showcase local Okinawan ingredients, featuring options like rich and creamy Okinawan purple yam, refreshing Shikuwasa citrus, and Yukisio salt milk. Silky-smooth, melt-in-your-mouth textures with vivid colors make this the ultimate cooling treat while exploring Okinawa under the sun.", "name": "Fontana Gelato", "transport": "Approx. 4 minutes walk from Okinawa Urban Monorail Makishi Station"}, {"address": "1-2-32 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Okinawa\u0027s iconic American-style ice cream parlor! Rooted in U.S. military base food culture, it offers exclusive local island flavors such as Yukisio Salt Peanut, Okinawan Kintoki Red Bean, and Purple Yam. Rich, dense, and sweetly delicious, served in crispy waffle cones, you\u0027ll see shoppers holding these everywhere on Kokusai Street\u2014a dessert packed with retro American vibes and sunny Okinawan spirit.", "name": "Blue Seal Ice Cream Kokusai-dori", "transport": "Approx. 7 minutes walk from Okinawa Urban Monorail Miebashi Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Downtown Naha and Kokusai Street"}, "onna_yomitan": {"categories": {"cat_1": {"items": [{"address": "1669-1 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Nakamura Soba is an iconic, long-standing Okinawa Soba shop in Onna Village. Its most popular dish, the \u0027Ishigaki Sea Moss Soba,\u0027 features fresh sea moss kneaded directly into the noodles, giving them an enticing emerald-green color. A bite reveals firm, springy noodles bursting with rich seaweed sweetness, perfectly complemented by a clear broth simmered from bonito flakes and pork bones. Topped with melt-in-your-mouth, tender stewed pork belly with a balanced sweet and savory flavor, it is beloved by both locals and international tourists alike.", "name": "Nakamura Soba (\u4e2d\u6751\u305d\u3070)", "transport": "About a 50-minute drive from Naha Airport via the Okinawa Expressway, exiting at Yaka IC; or take Bus No. 20/120 to \u0027Seragaki\u0027 stop and walk for 1 minute."}, {"address": "2418-1 Namihira, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Located in Yomitan Village, Hanaori Soba is a famous spot highly praised by foodies for authentic traditional Okinawan home-style cooking. Renowned for its generous toppings, the most popular dishes are the Stir-fried Vegetable Soba and Pork Offal Soba. The broth is light, aromatic, and sweet, paired with chewy hand-made noodles. The pork offal is meticulously cleaned with no gamey odor, stir-fried over high heat with abundant cabbage and bean sprouts to impart a captivating \u0027wok hei\u0027 aroma. Its unpretentious nostalgic flavor draws countless locals and makes it a top choice to experience Yomitan\u0027s regional heritage.", "name": "Hanaori Soba (\u82b1\u7e54\u305d\u3070)", "transport": "About a 50-minute drive north from downtown Naha via Route 58; or take Bus No. 28 to \u0027Namihira\u0027 stop and walk for about 3 minutes."}, {"address": "6092-1 Minamionna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | As the birthplace of the Okinawan Sea Grape Rice Bowl (Umi-budo Don), this legendary restaurant showcases Okinawa\u0027s signature \u0027sea grapes\u0027 at their finest. The iconic bowl is topped with glistening green pearls of sea grapes, grated mountain yam, and fresh sea urchin, dressed with a special citrus vinegar sauce. With every bite, the sea grapes pop with a satisfying crunch, releasing a burst of briny sweetness and ocean flavor. Refreshing and smooth, it is an essential traditional seafood experience when visiting Onna Village.", "name": "Ganso Umibudo Honten (\u5143\u7956\u6d77\u3076\u3069\u3046 \u672c\u5e97)", "transport": "About a 60-minute drive north from Naha Airport via Route 58; or take Nago Nishi Airport Bus No. 120 to \u0027Minamionna\u0027 stop and walk for 2 minutes."}, {"address": "1020-1 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture (Inside Murasaki Mura Kingdom)", "feature": "\u2b50 4.4 Stars | Located within Murasaki Mura Kingdom, Janatei is a traditional Ryukyuan restaurant housed inside a restored historic red-tile house. Dedicated to preserving the court and folk culinary heritage of the Ryukyu Kingdom, its signature Ryukyu Set Meal features tender braised pork belly (Kakuni), Okinawan peanut tofu (Jimami Tofu), and bitter melon stir-fry (Goya Champuru). The braised pork boasts chewy skin and melt-in-your-mouth meat that is rich yet not greasy, while the peanut tofu has a silky, creamy texture served with a sweet savory sauce. A meal here feels like traveling back in time to sample pure, authentic Okinawan flavor.", "name": "Ryukyu Cuisine Janatei (\u7409\u7403\u6599\u7406 \u8b1d\u540d\u4ead)", "transport": "About a 60-minute drive from Naha Airport; or take Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and walk for about 10 minutes."}, {"address": "2571 Onna, Onna Village, Kunigami District, Okinawa Prefecture (Inside Onna Roadside Station Nakayukui Market)", "feature": "\u2b50 4.5 Stars | Established for decades, Mitsuya Honpo is a famous classic shop renowned for Okinawa\u0027s beloved street snack, \u0027Sata Andagi\u0027 (Okinawan deep-fried donuts). Freshly fried Sata Andagi are exceptionally crispy on the outside, dense and soft on the inside, infused with rich milky notes and brown sugar fragrance without being greasy. Beyond classic black sugar and original flavors, they offer purple yam, black sesame, and daily limited \u0027Mitsuya Dragon Balls\u0027 (mochi-like fried balls made with purple yam and glutinous rice for a chewy texture). Loved by locals and tourists alike, it\u0027s a must-buy treat along Onna\u0027s west coast.", "name": "Ryukyu Sweets Mitsuya Honpo Onna (\u4e09\u77e2\u672c\u8217 \u6069\u7d0d\u5e97)", "transport": "About a 50-minute drive north from Naha along Route 58; or take Bus No. 120 to \u0027Inbu\u0027 or \u0027Onna Shogakko-mae\u0027 stop and walk a short distance."}, {"address": "6369-1 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Shimabutaya in Onna Village is a renowned traditional eatery specializing in Okinawa\u0027s native black pork, \u0027Agu Pork.\u0027 Utilizing traditional wooden steamer methods and signature broth shabu-shabu, it perfectly seals in the sweet, juicy flavors of Agu pork. The meat is finely textured with balanced marbling, melting instantly in your mouth with natural sweetness and high collagen content\u2014entirely devoid of gamey taste. Served with fresh local vegetables and homemade citrus ponzu sauce for a light, refreshing bite, it is highly favored by health-conscious food lovers and fans of traditional Japanese meat cuisine.", "name": "Okinawa Black Pork Specialty Shimabutaya (\u5cf6\u8c5a\u5bb6)", "transport": "About a 45-minute drive from Naha Airport via the Okinawa Expressway, exiting at Yaka IC."}, {"address": "1088-1 Namihira, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Yomitan Monogatari is a highly acclaimed traditional local izakaya in Yomitan Village that blends classic Okinawan regional dishes with modern culinary techniques. Popular dishes include classic Goya Champuru (bitter melon stir-fry), Squid Ink Yakisoba, and signature Fried Sea Urchin Tofu. The bitter melon is carefully prepared to keep a crisp texture with a balanced bittersweet finish that pairs wonderfully with rich local island tofu. Fresh local sashimi and Awamori liquor make the ultimate combination. Its cozy, rustic wooden atmosphere attracts diners eager to immerse themselves in the local nightlife dining culture.", "name": "Yomitan Monogatari (\u8aad\u8c37\u7269\u8a9e)", "transport": "About a 55-minute drive from Naha Airport; or take Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and walk for about 5 minutes."}, {"address": "2288-671 Nakama, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Tucked away in the greenery of Onna Village, \u0027Obaa no Ie\u0027 (Grandma\u0027s House) is a charcoal yakiniku and traditional cuisine restaurant set inside a 100-year-old Okinawan red-tile roof home. Stepping inside feels like returning to a cozy rural grandmother\u0027s house, where guests sit on tatami mats to enjoy charcoal grilling. The restaurant highlights premium Okinawa Wagyu beef and Agu pork. The charcoal fire locks in rich juices, delivering an explosion of savory flavor and exceptionally tender meat with every bite. Paired with traditionally crafted Okinawan Awamori liquor and side dishes, it offers a heartwarming, nostalgic culinary experience.", "name": "Obaa no Ie Charcoal Yakiniku (\u304a\u3070\u3041\u306e\u5bb6)", "transport": "About a 60-minute drive from Naha Airport via the Okinawa Expressway, exiting at Kyoda IC."}], "name": "Famous Traditional Local Restaurants"}, "cat_2": {"items": [{"address": "698 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Located in Onna Village, this popular brunch spot is famous for its premium Hawaiian pancakes, attracting long queues of tourists even before opening. The signature savory nut butter pancakes feature an extremely soft, fluffy, and bouncy texture. With every bite, rich milky aromas and crunchy nut bits burst on your palate\u2014a perfectly balanced sweet and savory treat that is utterly addictive. Paired with a signature Americano, it\u0027s the ultimate morning indulgence.", "name": "Hawaiian Pancakes House Paanilani", "transport": "Drive along National Route 58 towards Seragaki; about a 15-minute drive from Kyoda IC. Dedicated parking is available right in front of the store."}, {"address": "560 Gima, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | Perched on a cliff edge in Yomitan Village, this stunning ocean-view cafe is one of the largest seaside cafes in Japan. The signature sparkling soda packed with colorful tropical fruit bits delivers a refreshing, slightly tangy fizzy taste. Sitting on the spacious oceanfront terrace watching the azure sea and waves is deeply healing, making it a favorite among photography enthusiasts and vacationers.", "name": "Hoshino Resorts BANTA CAFE", "transport": "About a 60-minute drive from Naha Airport. Paid dedicated parking is available (parking fees can be offset with purchases)."}, {"address": "466-1 Maeganeku, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | An iconic fluffy souffl\u00e9 pancake specialty cafe in Onna Village. Made to order, the pancakes are lightly golden on the outside with a cloud-like, airy texture inside that melts in your mouth, infused with rich egg flavor and smooth fresh cream. Paired with local seasonal fruits like mango or purple yam, the balanced sweet and sour taste draws countless influencers and dessert lovers.", "name": "Trip Cafe Okinawa", "transport": "Take Okinawa Bus No. 20 or 120, get off at \u0027Maeganeku\u0027 stop, and walk for about 2 minutes."}, {"address": "243-1 Maeganeku, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Combining a traditional Okinawan pottery studio with an elevated ocean-view cafe, guests can enjoy pour-over coffee and homemade thin-crust pizza served in handcrafted ceramics while overlooking panoramic views of Onna Village from the wooden deck. The pizza crust is delightfully crispy and chewy with gooey melted cheese, perfectly complemented by fruity black coffee. The laid-back atmosphere and artisan flair keep both locals and travelers coming back.", "name": "Cafe Doka Doka", "transport": "Drive along National Route 58 and turn onto the Maeganeku hilltop; about 45 minutes by car. Free parking is available."}, {"address": "2816-1 Yamada, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | A hidden gem for amazing American brunch in Onna Village, famous for its generous portions and freshly toasted crispy bread. Highlights include the signature \u0027Kouri Black Pork Cuban Sandwich\u0027 and \u0027Thick-Cut Bacon, Cheese \u0026 Egg Sandwich\u0027. The golden-crisp toast encases tender, juicy meats and rich melted cheese\u2014bursting with flavor in every bite and full of West Coast retro vibes.", "name": "The Bros Sandwich Stand", "transport": "Drive along National Route 58 to near the Yamada intersection. A limited number of parking spaces are available nearby."}, {"address": "367 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Tucked away in the lush greenery of Yomitan Village, this traditional house bakery uses natural wild yeast and a stone oven. Their signature wood-fired wild yeast breads feature a crusty, chewy exterior with a beautifully open crumb, carrying natural wheat aromas and a subtle sourdough tang. Spread with homemade herb butter or paired with a hearty vegetable stew, the wholesome, rustic flavors are highly praised by foodies and health-conscious diners alike.", "name": "Bakery Suien", "transport": "Navigate by car to the small alley near Zakimi Castle Ruins; about an 8-minute walk from the ruins."}, {"address": "915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Located inside the Gala Aoiumi Salt Experience Village in Yomitan, featuring a magnificent viewing platform facing the East China Sea. The most renowned brunch treats here are the sea salt soft-serve ice cream and homemade salted French toast. Crispy on the outside and pudding-soft on the inside, the French toast\u0027s sweetness is elevated by a hint of sea salt\u2014rich without being overly sweet. It\u0027s the perfect refreshment after a stroll along the beach.", "name": "Gala Aoiumi Ocean View Cafe", "transport": "Drive towards Takashiho Coast in Yomitan Village; large free parking is available inside the experience village."}, {"address": "2578 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A hidden gem cafe right next to Diamond Beach in Onna Village, boasting an incredible oceanfront terrace. Signature brunch items include rich Ryukyu purple yam pancakes and local Okinawan fruit parfaits. The smooth, aromatic purple yam paste offers a mild, pleasant sweetness, paired with refreshing yogurt and freshly brewed cold drip coffee. A fantastic spot to soak up Okinawa\u0027s sunshine and slow-paced vibes.", "name": "Diamond Beach Cafe", "transport": "Drive along National Route 58 towards Cape Manzamo, then turn toward Seragaki Coast."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2239-8 Shioya, Onna, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | Located in Onna Village, Seafood Cuisine Hama no Ya is an immensely popular local gastropub famous for its generous portions and exceptionally fresh butter-fried fish (Sakana no Butter-yaki). Freshly caught seasonal fish is seared on a hot iron skillet with plenty of minced garlic and rich, creamy butter until golden crisp on the outside while locking in the tender, juicy fish inside. Each bite offers a harmonious combination of lingering garlic aroma and rich ocean flavor with an exquisitely smooth texture. The pub also offers a selection of local Okinawan Awamori and fresh sashimi, where its warm, down-to-earth machiya izakaya atmosphere allows visitors to deeply experience authentic Okinawan fishing village charm and warm hospitality.", "name": "Seafood Cuisine Hama no Ya", "transport": "About a 50-minute drive from Naha Airport along National Route 58."}, {"address": "419-1 Fuchaku, Onna, Kunigami District, Okinawa", "feature": "\u2b50 4.2 stars | Umimonogatari Main Store is a gastropub that perfectly combines traditional Okinawan Shimauta (island folk song) performances with authentic Ryukyuan cuisine. Every evening features passionate live sanshin folk music performances, creating a lively atmosphere that often gets the entire crowd cheering and dancing along. Must-order dishes include the Okinawan Red Pork Goya Champuru (bitter melon stir-fry with tofu), where refreshing bitter melon pairs with firm tofu and rich black pork for a layered, palate-cleansing flavor profile. Additionally, fresh and snappy sea grapes and grilled Agu pork skewers paired with an ice-cold Orion draft beer or local Awamori cocktails make it the premier choice for enjoying a fun night on the west coast of Onna.", "name": "Ryukyu Shimauta Live Izakaya Umimonogatari Main Store", "transport": "About a 50-minute drive from Naha Airport, located in the hotel district of Fuchaku, Onna."}, {"address": "120-1 Maeda, Onna, Kunigami District, Okinawa", "feature": "\u2b50 4.1 stars | Churahana Onna features a wooden architecture full of classic Kominka (traditional Japanese home) charm, offering high-quality and authentic Ryukyuan traditional dishes. Their slow-braised Okinawan Kakuni (pork belly) is meticulously simmered for hours; the fat melts in your mouth without feeling greasy, while the lean meat absorbs the sweet and savory brown sugar and Awamori sauce, making it tender, juicy, and aromatic. Moreover, the restaurant\u0027s special handmade Okinawan noodles are delightfully chewy, paired with a clear, sweet bone broth that keeps you coming back for more. The comfortable, elegant ambiance and warm, friendly service make it perfect for both family gatherings and romantic dates.", "name": "Churahana Onna Branch", "transport": "About a 45-minute drive from Naha Airport, near Cape Maeda."}, {"address": "1070-1 Haminihira, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Located in Yomitan Village, Izakaya Chunjun is a hidden gem favored by local residents and seasoned foodies. The pub highlights fresh ingredients sourced directly from local farmers and fishermen. Must-try signature dishes include crispy squid ink Okinawan tempura and freshly grilled Agu pork sausages\u2014crispy on the outside, bursting with juice on the inside, infused with subtle smoky and herbal notes. The drink menu features an extensive collection of premium Awamori distilled by local Yomitan distilleries. Paired with cozy and relaxing traditional Japanese tatami seating, guests can leisurely immerse themselves in the authentic everyday drinking culture of Yomitan.", "name": "Island Dishes \u0026 Awamori Izakaya Chunjun", "transport": "About a 55-minute drive from Naha Airport, located in the Haminihira area of Yomitan Village."}, {"address": "1042-1 Senaha, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | Ryori Kobo Niwa is a creative gastropub that cleverly combines traditional Okinawan ingredients with modern cooking techniques. The chef pays meticulous attention to detail; the signature charcoal-grilled Okinawan Yamashiro Agu pork chops feature a lightly charred crispy exterior while remaining an enticing pink on the inside\u2014tender, juicy, and filled with a uniquely sweet pork flavor. Paired with their special Okinawan peanut tofu (Jimami Tofu), which boasts a velvety, panna cotta-like silky-chewy texture and a lingering nutty aroma, this double feast for the eyes and palate makes it a highly acclaimed hidden culinary hot spot in Yomitan Village.", "name": "Cuisine Workshop Niwa (Ryori Kobo Niwa)", "transport": "About a 60-minute drive from Naha Airport, near Zanpa Golf Club."}, {"address": "6375-1 Onna, Onna Village, Kunigami District, Okinawa", "feature": "\u2b50 4.3 stars | Perched on a coastal hill in Onna Village, Ryukyu Dining Momoka boasts breathtaking ocean views and exquisite modern Japanese decor. This upscale local gastropub features Kaiseki multi-course meals and izakaya appetizers incorporating local Okinawan ingredients. Highly recommended is their dual Okinawan Wagyu beef and Agu pork shabu-shabu; featuring beautifully marbled meat, it melts in your mouth after just a few seconds of swishing in hot broth, overflowing with rich, sweet juices. Enjoy authentic delicacies alongside carefully curated limited-edition Awamori or custom cocktails while admiring the sunset glow over Okinawa\u0027s west coast\u2014a romantic atmosphere deeply loved by tourists.", "name": "Ryukyu Dining Momoka", "transport": "About a 55-minute drive from Naha Airport, near Cape Manzamo."}, {"address": "2442 Onna, Onna Village, Kunigami District, Okinawa", "feature": "\u2b50 4.2 stars | Onna Matsuri is a local cuisine gastropub highlighting a vibrant festival atmosphere and high-quality local Agu pork. The decor is bursting with energy, decorated with Okinawan Taiko drums and red lanterns. The restaurant takes great pride in its Okinawan pork-bone broth shabu-shabu and various grilled dishes. The sliced Agu pork is cut to perfect thickness; dipped in special Kumquat Ponzu sauce after cooked, its sweet and tangy flavor elevates the sweetness and springiness of the meat. In addition, deep-fried Okinawan bitter melon slices and squid ink fried noodles are must-order signature dishes at every table, making its lively atmosphere ideal for a feast.", "name": "Onna Island Pork Shabu-Shabu Izakaya Onna Matsuri", "transport": "About a 50-minute drive from Naha Airport, located along the main street of central Onna Village."}, {"address": "2346-1 Kina, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.0 stars | Izakaya Hanafu is a local gastropub rich in regional character in Yomitan Village, carrying on the essence of traditional Ryukyuan home-style cooking. The atmosphere inside is warm and welcoming, featuring daily sanshin folk song performances that provide guests with pure Okinawan hospitality. A must-try dish is the Fu Champuru (stir-fried wheat gluten with egg and vegetables); the Okinawan Kurumafu absorbs egg liquid and broth before being stir-fried over high heat, resulting in a fluffy yet bouncy texture rich with egg and fresh vegetable aromas. Drizzle with house-made Okinawan chili pepper Awamori sauce for a mildly spicy appetite opener, then sip a refreshing Awamori Highball to truly experience the unhurried, laid-back pace of life in an Okinawan village.", "name": "Yomitan Village Shimauta Izakaya Hanafu", "transport": "About a 50-minute drive from Naha Airport, near the Kina Intersection on National Route 58."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "857-1 Yamada, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A popular Italian restaurant located along the coast of Onna Village, featuring a variety of vegetarian and vegan pizzas made with local Okinawan produce. Using gluten-free crusts and vegan cheese baked to perfection in a high-temperature wood-fired oven, their crispy yet chewy pizzas are topped with bitter melon, island tofu, and green laver (aosa sea lettuce). Every bite bursts with rich vegetable sweetness and doughy aroma. Highly recommended for foreign tourists and health-conscious locals seeking a unique fusion of Okinawan and Italian plant-based cuisine.", "name": "Pizzeria Da ENZO (Ryukyu Veggie Pizza)", "transport": "About a 25-minute drive from Kyoda IC, or take Ryukyu Bus No. 120, get off at \u0027Yamada\u0027 stop, and walk for about 5 minutes."}, {"address": "2753-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A landmark vegan and organic health cafe in Yomitan Village with an attached organic grocery store. Their popular Vegan Buddha Bowl features fresh local organic brown rice, roasted seasonal vegetables, and homemade sesame dressing, delivering fantastic layers of flavor in a light, guilt-free dish. They also serve rich acai bowls and freshly blended plant-milk smoothies, making it a favorite among international tourists and health enthusiasts. With its cozy, relaxed atmosphere, it\u0027s an ideal spot for a light brunch in Yomitan.", "name": "Green Leaf Market \u0026 Cafe Yomitan", "transport": "About a 5-minute drive toward Zakimi Castle Ruins; free dedicated parking available in front of the store."}, {"address": "1661 Nagahama, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A cozy spot located near the seaside in Yomitan Village, specializing in North Indian-style vegetarian and vegan curries. The signature Dal (lentil) curry and Palak (spinach) curry are paired with freshly baked whole-wheat naan, offering rich layers of spices that go down smoothly, with a mild kick balanced by the sweetness of coconut milk and tomatoes. Many vegetarian lovers are drawn to the aromatic, freshly ground spices, savoring soul-soothing meatless meals while gazing out at the blue ocean views.", "name": "Shanti Shanti Cafe Yomitan (Herbs \u0026 Indian Vegan Curry)", "transport": "About an 8-minute drive from Route 58 turning toward Nagahama Coast."}, {"address": "6092-1 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Okinawa\u0027s iconic taco rice specialty shop, featuring a branch right beside Onna Village\u0027s beach. They offer a specially created vegan taco rice topped with seasoned soy protein and beans, fresh diced tomatoes, rich avocado, and crisp lettuce. With chewy rice and flavorful, zesty soy meat, the texture is remarkably close to traditional minced meat taco rice, allowing vegetarians to enjoy Okinawa\u0027s quintessential classic street food worry-free.", "name": "Taco Rice Cafe Kijimuna Onna", "transport": "Take the Okinawa City Bus to \u0027Manzamo Entrance\u0027 stop and walk for about 3 minutes, or drive directly via Route 58."}, {"address": "2653-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A stylish cafe located inside Yomitan\u0027s famous Pottery Village (Yachimun no Sato), serving meals presented on beautiful handcrafted local pottery. The cafe\u0027s highlight is the traditional Okinawan longevity vegetable lunch platter, featuring steamed island tofu, shaved bitter melon salad, shredded carrot saut\u00e9ed with kelp, and purple sweet potato mash. Light, naturally seasoned, and rich in textures, it flawlessly merges artistic pottery with local pesticide-free vegetarian cuisine, attracting travelers who appreciate slow living and traditional culture.", "name": "Cafe Clay 68 Yomitan (Pottery Village Organic Cafe)", "transport": "About a 2-minute walk from the free parking lot inside Yomitan Pottery Village."}, {"address": "315 Toya, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A healthy vegan cafe located near the coastline of Yomitan Village, specializing in authentic macrobiotic and vegan gluten-free meals. Popular dishes include the brown rice vegetable tempura set and house-made soy cutlets, paired with fresh cold-pressed vegetable juices and dairy-free vegan cheesecake. The tempura is crispy outside and tender inside, perfectly preserving the pure flavors of fresh vegetables without feeling greasy. Boasting incredible ocean views and a lush green garden, it is a hidden gem for vegetarian foodies seeking relaxation for mind and body.", "name": "Organic Cafe Grand Blue Yomitan", "transport": "About a 5-minute walk from Toya Fishing Port, or a 3-minute drive from the Toya junction off Route 58."}, {"address": "2288-37 Nakama, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | An exquisite raw vegan dessert shop located in the resort area of Onna Village. It specializes in raw vegan cakes and pies made entirely without high-heat baking, gluten, dairy, eggs, or refined sugars. The signature Raw Nut Chocolate Tart and Okinawan Shikuwasa Raw Cheesecake-style Tart utilize nuts and coconut oil to create an insanely smooth, creamy texture that melts in your mouth with rich fruity aromas. Extremely popular among female customers and health enthusiasts.", "name": "Raw Sweets Cafe Abundante Onna", "transport": "Drive along Route 58 toward Nakama; about a 3-minute drive near the Sheraton Resort."}, {"address": "360 Iramina, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A popular organic vegetarian dining spot in Yomitan Village beloved by both locals and health-minded tourists. The menu highlights fermented enzyme brown rice plates and wild vegetable curries made with house-fermented enzymes and pesticide-free produce. The enzyme brown rice is chewy with a subtle adzuki bean aroma, served with various handcrafted pickled vegetables and a rich, gentle plant-based spiced curry. Comforting, stomach-warming, and easy to digest, it beautifully showcases the essence of Okinawa\u0027s longevity food culture.", "name": "Nanohana Organic Cafe Yomitan", "transport": "Turn off Route 58 at the Iramina inte
