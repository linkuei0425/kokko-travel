ge site for both tourists and local coffee lovers.", "name": "Okinawa Cerrado Coffee Beans Store", "transport": "Take Bus No. 120 to Minatogawa Station, then walk about 6 minutes."}, {"address": "2-16-1 Minatogawa (No. 26), Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | A hugely popular natural yeast bakery and cafe in the Minatogawa area. They strictly avoid eggs, milk, and chemical additives, relying solely on Hokkaido wheat and Hateruma Island brown sugar. The signature toast has a crispy crust and a chewy, fluffy interior, releasing a natural wheat aroma and subtle sweetness with every bite. Paired with special Dutch cold brew or organic tea, it offers a warm, guilt-free, handmade brunch experience.", "name": "ippe coppe Bakery \u0026 Cafe", "transport": "Take Bus No. 20/120 to Minatogawa Station, then walk about 5 minutes."}, {"address": "2-16-2 Minatogawa (No. 25), Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Okinawa\u0027s first specialty cafe dedicated to canel\u00e9s made with Tarama Island brown sugar. Featuring a caramelized, crispy exterior and a moist, springy interior, their treats incorporate local Okinawan ingredients like milk, Awamori, dragon fruit, and green tea. Take a bite to release rich brown sugar aromas\u2014paired with fresh black coffee, it is a can\u0027t-miss stroll snack or teatime treat in Minatogawa Stateside Town.", "name": "Houkiboshi Minatogawa (Brown Sugar Canel\u00e9 Specialty Store)", "transport": "Take Bus No. 120 to Minatogawa Station, then walk about 5 minutes."}, {"address": "1-23-17 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | A unique concept combining retro American vintage clothing with a handmade burger brunch cafe. Located in Ginowan City, it exudes a nostalgic American vibe. Their signature handmade burger patty is thick, juicy, and packed with smoky grilled flavor, paired with house-made spreads and crispy fries. The shop also curates select vintage apparel and goods, making it a favorite for lovers of American culture and good food.", "name": "Bricoleur Ginowan (Vintage American Clothing \u0026 Cafe)", "transport": "Take Bus No. 99 to Mashiki Station, then walk about 3 minutes."}, {"address": "3-3-7 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | A highly-rated local favorite for bagels and coffee in Ginowan. Freshly handcrafted daily, their wide variety of bagels feature a delightfully chewy texture. Whether spread with a thick layer of homemade cream cheese or loaded up as a brunch bagel sandwich with fresh veggies and smoked chicken, pairing one with an aromatic single-origin pour-over delivers pure morning bliss.", "name": "Cactus Eatrip Ginowan (Bagel \u0026 Cafe)", "transport": "Take Bus Line No. 58 to Oyama Station, then walk about 4 minutes."}, {"address": "5-6-3 Makiminato, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | A retro American brunch restaurant in Urasoe City, converted from a former US military house. Vintage wooden furniture and antique decor create an authentic exotic atmosphere. Their signature American brunch features charcoal-grilled burger patties, freshly sizzled bacon, fluffy pancakes, and sunny-side-up eggs in overwhelmingly generous portions. Crispy on the outside and tender inside, the pancakes paired with maple syrup and savory bacon deliver the ultimate classic American taste.", "name": "Gordie\u0027s Old House Urasoe (Retro American Brunch)", "transport": "Take Bus No. 120 to Makiminato Station, then walk about 7 minutes."}, {"address": "2-1-29 Ginowan, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | A stylish gallery-style cafe hidden in a residential neighborhood of Ginowan. The interior is filled with warm wooden elements and lush greenery while exhibiting and selling local Okinawan pottery (Yachimun). Brunch dishes and handmade cakes are prepared with local organic ingredients, accompanied by smooth, well-rounded in-house brewed coffee. Served on exquisite handmade ceramics, it lets guests savor a tranquil brunch filled with Okinawan aesthetic charm.", "name": "mofgmona Cafe Ginowan (Gallery Cafe)", "transport": "Take Bus No. 97 to Nagata or Ginowan Station, then walk about 8 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-13-9 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | An atmospheric bistro located in the Minatogawa Stateside Town in Urasoe, perfectly blending hipster retro vibes with local Okinawan ingredients. The signature goat curry is tender with zero gamineness and rich spice layers, pairing amazingly with a custom Okinawan brown sugar cocktail or local craft beer. The cozy retro building space is immensely popular among tourists and young adults.", "name": "Rat \u0026 Sheep Minatogawa Bistro", "transport": "About a 20-minute drive from downtown Naha, or take the Okinawa Urban Monorail to Urasoe-Maeda Station and transfer to a taxi for about 10 minutes."}, {"address": "3-3-6 Yafuso, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | A highly rated and extremely popular Ryukyu cuisine izakaya in Urasoe. Serving authentic Goya Champuru (bitter melon stir-fry), wild bitter melon tempura, and slow-braised pork belly (Rafute) that melts in your mouth with rich savory notes. Featuring an extensive Awamori liquor collection, it is a favorite for locals after work and tourists seeking genuine Okinawan flavors.", "name": "Izakaya Maeten Urasoe Main Branch", "transport": "Take the Ryukyu Bus to \u0027Yafuso\u0027 stop, then walk for about 3 minutes."}, {"address": "793 Uchidomari, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | A lively izakaya highlighting fresh fish delivered daily from nearby coastal waters alongside local Ryukyuan specialties. Must-order dishes include the sweet, firm sashimi platter, crisp sea grapes (umi-budo), and deep-fried sea urchin tofu featuring a crispy exterior, tender center, and harmony of soy and ocean flavors. Its relaxed, casual atmosphere makes it a top spot for enjoying lively Okinawan nightlife and local food.", "name": "Seafood Izakaya Uosho Ginowan", "transport": "About a 5-minute drive from Ginowan Seaside Park, or take a bus to \u0027Uchidomari\u0027 stop and walk for about 4 minutes."}, {"address": "2-27-27 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.0 Stars | A unique bistro famous for its aquarium-themed private rooms, allowing guests to admire swimming tropical fish while dining. Signature dishes include Okinawan Agu pork teppanyaki and squid ink fried noodles. The Agu pork is tender and juicy, while the squid ink noodles are savory, rich, and lightly charred. Highly loved by families and young crowds.", "name": "Izakaya Kamesennin Ginowan", "transport": "About a 10-minute walk from the Okinawa Convention Center."}, {"address": "4-27-6 Gusukuma, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | A premier spot in Urasoe for charcoal-grilled skewers and local dishes. Using strictly selected local Okinawan chicken, high-heat Binchotan charcoal grilling creates a golden, crispy skin and juicy interior. Served with special Okinawan salt and citrus ponzu sauce for a refreshing, non-greasy taste, it comes highly recommended by local office workers and gourmets alike.", "name": "Charcoal Yakitori Izakaya Torihana Urasoe", "transport": "About a 5-minute drive from Urasoe City Hall, or take a bus to \u0027Gusukuma\u0027 stop and walk for about 3 minutes."}, {"address": "1-7-2 Shimashi, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A traditional Okinawan house-style bistro steeped in Ryukyuan charm, serving authentic local comfort food. The stewed pig\u0027s trotters (Tebichi) are highly recommended\u2014tender, springy, collagen-rich, and melt-in-your-mouth; paired with traditionally brewed aged Awamori (Koshu) featuring a mellow texture and long finish, it offers a deeply authentic Okinawan taste.", "name": "Ryukyu Izakaya Kisaku Ginowan", "transport": "Located near the University of the Ryukyus Ginowan Campus; drive there or take a bus to \u0027Shimashi\u0027 stop and walk for 5 minutes."}, {"address": "2-33-15 Futenma, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A cozy local Okinawan cuisine bistro where the friendly owner makes you feel right at home. The signature Soba Champuru (stir-fried Okinawan noodles) features chewy noodles infused with rich broth flavor, stir-fried with seasonal vegetables to spark the appetite. Highly praised by tourists for its affordable prices and delicious, home-cooked Okinawan dishes.", "name": "Okinawan Cuisine \u0026 Awamori Izakaya Yudzuki Ginowan", "transport": "About a 4-minute walk from Futenma Shrine."}, {"address": "2-21-25 Isa, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | A popular izakaya specializing in Binchotan charcoal skewers and Okinawan home cooking. The classic Island Tofu and Goya Champuru offers distinct, layered textures with a deliciously balanced bittersweet profile. Additionally, the seared Agu pork skewers are aromatic and enticingly charred\u2014a perfect match with an ice-cold Orion draft beer.", "name": "Izakaya Torien Ginowan", "transport": "About a 3-minute walk from Isa Intersection, easily accessible by driving along National Route 58."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "3-22-5 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A plant-based health restaurant centered around traditional Okinawan island tofu and soybeans. Their signature island tofu burger patty features a crisp, lightly seared exterior with a rich, soft, and creamy soybean interior, complemented by a special egg- and dairy-free sauce for a rich depth of flavor. All dishes strictly use local organic soybeans and seasonal wild vegetables, making it a favorite among health-conscious tourists and local vegetarians.", "name": "SOY LAB", "transport": "Take the bus to \u0027Izu\u0027 stop, then walk about 5 minutes."}, {"address": "2-16-1 Minatogawa, Urasoe City, Okinawa Prefecture (Stateside Town No.26)", "feature": "\u2b50 4.6 stars | A famous bakery in the Minatogawa Stateside Town, specializing in vegan natural yeast bread made without eggs, dairy, or chemical additives. The signature scones are crispy on the outside, soft and delicate on the inside, bursting with pure wheat aroma and subtle sweetness. Their toast is pillowy and elastic, pairing wonderfully with plant-based jams. Offered in limited quantities daily, these iconic treats are a top choice for light bites while strolling through Minatogawa.", "name": "ippe coppe Bakery", "transport": "From Naha city center, take bus No. 55 to \u0027Ujibaru\u0027 stop and walk for about 8 minutes."}, {"address": "1-2-3 Shimashi, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A long-standing organic vegetarian cafe in Ginowan, specializing in macrobiotic and vegan cuisine. Their popular \u0027Organic Vegetable Vegan Curry\u0027 is slow-simmered with dozens of spices and local pesticide-free vegetables, resulting in a rich, smooth dish filled with natural sweetness, served alongside chewy brown rice. The warm, leafy, wood-toned interior allows guests to slow down and enjoy a light, refreshing plant-based meal.", "name": "Cafe Sprout", "transport": "Take bus No. 97 to \u0027Shimashi\u0027 stop, then walk about 3 minutes."}, {"address": "3-25-5 Isa, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | One of the few American-Mexican diners in the Ginowan area offering a wide variety of vegan and vegetarian options. Their \u0027Vegan Tacos\u0027 feature homemade gluten-free corn tortillas filled with seared plant-based meat, generous fresh salsa, and vegan cheese. Crisp, juicy, and subtly spicy, they authentically recreate classic Mexican street flavors, making them a popular favorite among foreign tourists and vegetarian enthusiasts near the military base.", "name": "Esparza\u0027s Tacos \u0026 Burritos", "transport": "Take bus No. 20 or 120 to \u0027Isa\u0027 stop, then walk about 4 minutes."}, {"address": "2-14-5 Minatogawa, Urasoe City, Okinawa Prefecture (Stateside Town No.34)", "feature": "\u2b50 4.2 stars | A stylish, hipster-vibe restaurant located in the Minatogawa Stateside Town in Urasoe, offering a variety of plant-forward and vegetarian-friendly dishes. Highly recommended is their \u0027Local Vegetable Cream Soup Set with Toast.\u0027 The soup is smooth and velvety, packed with the natural sweetness of seasonal Okinawan produce. Paired with golden toasted bread, it delivers a warm, delicious, and savory bite\u2014making it a perfect vegetarian option while soaking in the romantic ambiance of Minatogawa.", "name": "Limpid", "transport": "Take bus No. 99 to \u0027Minatogawa\u0027 stop, then walk about 10 minutes."}, {"address": "2F, 2-39-8 Aragusuku, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A scenic cafe combining Okinawan arts, culture, and local produce, with a menu featuring many clearly marked organic vegetarian dishes. The best-selling \u0027Okinawa Style Warm Vegetable Salad Platter\u0027 features local toxin-free produce from Ginowan. Lightly roasted to bring out a natural charred aroma and juicy crunch, it\u0027s served with homemade soy-sesame dressing. Refreshing, appetizing, and highly nutritious, it is popular among travelers and local creatives alike.", "name": "Cafe Unizon", "transport": "Take bus No. 22 or 77 to \u0027Aragusuku\u0027 stop, then walk about 6 minutes."}, {"address": "6-46-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A cozy spot in Ginowan focusing on macrobiotic principles and additive-free organic vegetarian cuisine. Their \u0027Vegetable Plate Meal\u0027 includes over seven varieties of cooked and raw local Okinawan vegetables served with fragrant brown rice and fermented miso soup. The vegetables are tender, juicy, and crisp, offering a clean yet flavorful taste. In a cozy, homelike atmosphere, guests can experience the wholesome healing power of nature.", "name": "Poka Poka Table", "transport": "Take a Route 58 bus line to \u0027Oyama\u0027 stop, then walk about 7 minutes."}, {"address": "1-48-1 Maeda, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A quiet, elegant vegetarian-friendly tearoom tucked away in a leafy corner of Urasoe\u0027s Maeda residential area. The house signature \u0027Vegan Wild Mushroom Curry\u0027 uses no meat or animal fats, featuring a slow-simmered vegetable broth infused with rich wild mushrooms and nuts. Smooth, savory, and satisfyingly chewy, paired with a cup of homemade organic soy latte, it\u0027s a hidden gem for escaping the crowds and enjoying a tranquil afternoon tea.", "name": "Cafe Midori no Oka", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Urasoe-Maeda\u0027 Station, then walk about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 18, 2-17-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | The most eye-catching exquisite fruit tart specialty shop in the Urasoe Foreign Residential Area, offering a must-try street sweet while strolling through the former US military housing district. The signature seasonal fruit tart features a delightfully crispy crust. One bite reveals rich buttery aromas and vanilla custard paired with strictly selected fresh fruits. It\u0027s refreshing, perfectly sweet and tangy without being heavy. The multi-layered crunchy and smooth textures are mesmerizing, making it a hit street dessert that locals and tourists love to snap photos of.", "name": "oHacort\u00e9 Minatogawa", "transport": "Take Bus No. 55 or 99 to \u0027Minatogawa\u0027 stop, then walk about 5 minutes to reach the Minatogawa Stateside Town (former US military housing area)."}, {"address": "No. 25, 2-16-2 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Okinawa\u0027s very first brown sugar cannel\u00e9 specialty shop, seamlessly blending Tarama Island\u0027s local brown sugar into classic French pastries. Freshly baked brown sugar cannel\u00e9s feature an ultra-crispy crust with a bittersweet caramel aroma, while the inside remains chewy, moist, and custard-like. The more you chew, the richer the brown sugar flavor becomes. Their bite-sized shape makes them perfect to grab and go while strolling the alleys\u2014an irresistible mini treat that pairs perfectly with milk or coffee.", "name": "Houki Boshi Minatogawa Main Store", "transport": "Take a bus to \u0027Minatogawa\u0027 stop, then walk about 6 minutes into the Minatogawa Stateside Town to spot the cozy green wooden cabin."}, {"address": "No. 26, 2-16-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A highly popular natural yeast bakery and scone shop hidden inside the Urasoe Foreign Residential Area. Their handmade scones are golden and crispy on the outside, light, fluffy, and rich in milky aroma on the inside, without feeling dry at all. In summer, they serve Japanese shaved ice with homemade natural syrup; the fine ice crystals melt instantly in your mouth, offering a delightful sweet-and-sour fruity contrast to the dense scones. A must-visit spot to pick up a tasty stroll snack.", "name": "IPPE COPE", "transport": "Take Bus No. 55 or 99 to \u0027Minatogawa\u0027 stop, then walk about 5 minutes."}, {"address": "1-24-6 Futenma, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | One of the birthplaces of Okinawa\u0027s iconic Tex-Mex street food born from US military culture, famous for massive portions of Taco Rice and handmade Tacos. The freshly fried corn taco shells are ultra-crispy, stuffed with savory juicy ground meat, heaps of shredded lettuce, and generous melted cheddar cheese, topped with spicy and tangy homemade salsa. Crunchy and packed with rich layers of flavor, it ranks #1 for popular takeaway food in Ginowan.", "name": "King Tacos Futenma", "transport": "Take Bus No. 23, 27, or 31 to \u0027Futenma\u0027 stop, then walk about 2 minutes."}, {"address": "2-19-1 Isa, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A famous historic takeaway shop for \u0027Okinawan Zenzai\u0027, an iconic traditional shaved ice dessert. Unlike hot red bean soup, this treat features rich Kintoki red bean broth paired with finely shaved ice and chewy white shiratama mochi. The beans are cooked until tender yet distinct, perfectly sweet, offering instant cool relief while taking a summer walk in Ginowan.", "name": "Fujiya Ginowan", "transport": "Take Bus No. 20 or 120 to \u0027Isa\u0027 stop, then walk about 3 minutes."}, {"address": "2-22-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A local Okinawan-American grocery supermarket and bakery filled with rich retro American charm, beloved by both US military personnel and locals. The bakery \u0026 deli section offers hot takeaway American apple pies and banana pies, featuring flaky crusts filled with soft, sweet apple chunks and subtle cinnamon notes. The hot food section also serves aromatic fried chicken and American-style BBQ ribs\u2014a top choice for packing a picnic before heading to Ginowan Seaside Park.", "name": "Jimmy\u0027s Oyama Store", "transport": "Take Bus No. 20, 58, or 120 to \u0027Dai-Ichi Oyama\u0027 stop, then walk about 1 minute."}, {"address": "7-1350-81 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A local fresh produce and seafood market located right next to the Ginowan Fishing Port, hosting a variety of freshly made seafood walking snacks. The most popular items are freshly fried Okinawan fish cakes (Kamaboko) and grilled seafood skewers. The fish cakes have a golden crispy skin and a springy, ocean-sweet bite. You\u0027ll also find crispy tempura and fresh fish soup\u2014grab it on the go to experience the vibrant warmth and authentic flavors of Okinawa\u0027s harbor market.", "name": "Ginowan Yui Marche Waterfront Market Snacks", "transport": "Recommended to drive yourself, or take a taxi to the area near Ginowan Port Marina."}, {"address": "6-46-5 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular Okinawan takeaway shop dedicated to garlic rotisserie chicken. Premium local chicken is stuffed generously with minced garlic and special spices, then slow-roasted. The chicken skin is golden, aromatic, and crispy; one bite bursts with juicy tender meat infused with bold garlic flavors that leave you licking your fingers. This hearty street meat snack is a favorite whether enjoyed on a walk or as a late-night treat.", "name": "Chicken House Ginowan", "transport": "Take Bus No. 20 or 120 to \u0027Oyama\u0027 stop, then walk about 8 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Urasoe Minatogawa District and Ginowan"}};
        const themeHex = "#0891b2";
        const cityName = "Okinawa";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
