rsection; about a 4-minute drive near Yomitan Village Office."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1190 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Home to \"Sata Andagi,\" Okinawa\u0027s iconic traditional street-walk sweet. Freshly fried to a golden crisp on the outside, every bite releases a rich egg and milk aroma, while the inside is soft, dense, and not greasy at all. Their limited-edition \"Dragon Ball\" made with tapioca flour is famously chewy and remains delicious even after cooling down. It is a must-buy drive-by snack for both locals and tourists cruising along the Onna Village west coast.", "name": "Mitsuya Honpo Onna", "transport": "About a 20-minute drive from Kyoda IC. Dedicated customer parking available."}, {"address": "1656-9 Nakadomari, Onna Village, Kunigami District, Okinawa Prefecture (Inside Onna no Eki Rest Area)", "feature": "\u2b50 4.4 stars | A wildly popular shaved ice stand inside the Onna no Eki Rest Area, famous for its extravagantly piled-high fruit shaved ice. Made with locally grown Okinawan mangoes, passionfruit, and dragon fruit, the shaved ice is drizzled with rich fruit jam and sweet condensed milk. Featuring big, juicy chunks of fruit with a refreshing sweet-and-sour flavor, it is the ultimate cool-down treat by the sea and a must-try market staple.", "name": "Ryupin Onna no Eki", "transport": "Take Ryukyu Bus No. 120 to \"Nakadomari\" stop, then walk for about 1 minute."}, {"address": "1656-9 Nakadomari, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | One of the most popular seafood stands in Onna no Eki Market, best known for its grilled lobster and scallops smothered in rich sea urchin sauce. Tender seafood is topped with a thick layer of secret sea-urchin mayonnaise sauce and flame-torched to fragrant perfection. Rich, creamy, and bursting with umami, you can enjoy it right in the market\u0027s outdoor seating area while soaking in the Okinawan sea breeze.", "name": "Hamano-ya Seafood Grill Stand (Nakayukui Market)", "transport": "About a 50-minute drive from Naha Airport via the Okinawa Expressway."}, {"address": "2871 Onna, Onna Village, Kunigami District, Okinawa Prefecture (1F, Cape Manzamo Visitor Center)", "feature": "\u2b50 4.2 stars | A hugely popular shop that elevates Okinawa\u0027s soul food\u2014pork spam and egg rice balls\u2014made fresh to order. Warm Okinawan rice is wrapped in fragrant seaweed with thick-cut fried spam and fluffy rolled egg, creating a perfect balance of savory pork and aromatic seaweed. The Cape Manzamo branch features an exclusive viewing platform where you can munch on your rice ball while overlooking the iconic elephant rock and ocean views.", "name": "Potama Cape Manzamo", "transport": "About a 60-minute drive from Naha. Paid parking available at Cape Manzamo Visitor Center."}, {"address": "139-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A charming, rustic dessert shop located right next to Zakimi Castle Ruins, specializing in traditional Okinawan \"Zenzai\". Large kidney beans are slow-cooked in brown sugar and served over snowy shaved ice topped with chewy shiratama mochi balls. Rich brown sugar and soft, velvety red beans blend seamlessly without being overly sweet\u2014a perfect nostalgic treat after exploring the ancient castle grounds.", "name": "Tsurukamedo Zenzai Yomitan", "transport": "Take Bus No. 29 to \"Zakimi\" stop, then walk for about 5 minutes."}, {"address": "915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located next to Murasaki Mura in Yomitan Village, Gala Aoki Umi is famous for extracting pure ocean salt. Their sea salt soft-serve ice cream is exceptionally smooth and creamy, with a subtle natural saltiness that perfectly enhances the rich milk sweetness for a refreshing, non-cloying flavor. Enjoying a soft-serve while gazing over the East China Sea cliffs makes for a wonderfully memorable coastal stroll.", "name": "Gala Aoki Umi Salt Ice Cream", "transport": "About a 60-minute drive from downtown Naha. Free large parking lot available."}, {"address": "20 Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A famous Okinawan chain famous for creating \"Omutaco\" (Omurice Taco Rice). This dish creatively pairs savory seasoned taco meat and cheese rice with a velvety, soft-cooked omelet draped over the top. The smooth egg softens the mild spicy kick, resulting in a rich, harmonious flavor. Takeout boxes are available, making it ideal for a beach picnic in Onna Village.", "name": "Taco Rice Cafe Kijimuna Onna", "transport": "Take Ryukyu Bus No. 120 to \"Seragaki\" stop, then walk for about 2 minutes."}, {"address": "469-1 Maeda, Onna Village, Kunigami District, Okinawa Prefecture (Inside Cape Maeda Rest Area)", "feature": "\u2b50 4.1 stars | A snack stand located at the Cape Maeda rest area (near the famous Blue Cave diving spot), serving sizzling fresh-grilled Okinawan Agu pork skewers. Charcoal-grilled to lock in juicy goodness, the meat offers rich yet clean flavors with crispy edges. A sprinkle of Okinawan sea salt brings out the pork\u0027s natural sweetness\u2014making it the ultimate hot grab-and-go energy snack after snorkeling or diving.", "name": "Cape Maeda Agu Pork Skewer Stand", "transport": "About a 50-minute drive from downtown Naha. Paid parking available at Cape Maeda."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Onna West Coast and Yomitan Village"}, "shuri_culture": {"categories": {"cat_1": {"items": [{"address": "2-13 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A century-old traditional Ryukyuan house restaurant near Shuri Castle featuring an exquisite dry landscape (Karesansui) Japanese garden. Their signature Okinawa Soba with pork cartilage ribs boasts a clear yet rich broth. The pork cartilage is braised until melt-in-your-mouth tender and gelatinous, paired with chewy, thick handmade noodles. A dash of Awamori chili oil adds vibrant depth. Highly loved by foodies and tourists alike, it allows you to savor authentic home-style and royal cuisine amidst the rich historical ambiance of the Ryukyu Kingdom.", "name": "\u7409\u7403\u6599\u7406 \u3042\u3057\u3073\u3046\u306a\u3041 (Ryukyu Cuisine Ashibiuna)", "transport": "About a 15-minute walk from Monorail \u0027Shuri Station\u0027, or take a city bus to \u0027Shurijo-koen Mae\u0027 stop and walk 3 minutes."}, {"address": "1-7 Shuri Akatacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | The top traditional handmade soba shop in Shuri with long queues, serving daily limited quantities until sold out. Sticking to traditional methods, their noodles are famously firm and chewy. The broth, slow-simmered from bonito flakes and pork bones, is crystal-clear yet incredibly sweet and savory. Topped with flavorful pork belly and fish cakes, paired with a bowl of savory seasoned rice (Juicy) packed with broth essence, it delivers a deeply satisfying, classic nostalgic Okinawan flavor.", "name": "\u9996\u91cc\u9eb5 (Shuri Soba)", "transport": "About a 5-minute walk from Monorail \u0027Shuri Station\u0027."}, {"address": "1-14 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A cozy, home-style Ryukyuan restaurant tucked away in the alleyways of Shuri\u0027s historic paths, featuring a charming stone-wall exterior. The restaurant specializes in \u0027Inamuruchi\u0027 (white miso pork soup set) and Peanut Tofu (Jimami Tofu). The Jimami Tofu has a panna-cotta-like dense, silky, and springy texture, perfectly paired with a sweet sauce that keeps you reaching for more. Pork dishes are stewed to tender, juicy perfection, fully restoring the traditional family dining culture of the Ryukyu Kingdom.", "name": "\u7409\u7403\u6599\u7406 \u5bcc\u4e45\u5c4b (Fukuya)", "transport": "About a 10-12 minute walk from Monorail \u0027Gibo Station\u0027 or \u0027Shuri Station\u0027."}, {"address": "1-58 Shuri Mawashicho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A traditional bakery boasting over a century of history, famous for one of the three iconic Shuri Manju passed down from the Ryukyu Kingdom era. Freshly steamed, the manju is wrapped in fragrant shell ginger (gettou) leaves. The skin is thin, soft, and fluffy, filled with smooth red bean paste that is pleasantly sweet. Each bite bursts with the unique herbal aroma of shell ginger combined with the gentle sweetness of red beans\u2014a must-try handmade legacy snack when strolling along Shuri\u0027s historic paths.", "name": "\u5c71\u57ce\u9945\u982d (Yamashiro Manju)", "transport": "About a 10-minute walk from Monorail \u0027Shuri Station\u0027."}, {"address": "1-11 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A century-old bakery inheriting the culinary legacy of royal pastry chefs from the Ryukyu Kingdom, specializing in traditional Chinsuko (biscuit) and royal delicacies like Hanakai-mochi. Their Chinsuko is entirely handmade using ancient techniques, offering an exceptionally crumbly, melt-in-your-mouth texture rich with lard aroma and a subtle sweet-and-salty balance that doesn\u0027t stick to teeth. This quintessential historic confection makes for the most authentic souvenir representing Shuri\u0027s culture.", "name": "\u65b0\u57a3\u30ab\u30df\u83d3\u5b50\u5e97 (Arakaki Kami Sweets Shop)", "transport": "About a 12-minute walk from Monorail \u0027Shuri Station\u0027, located right next to the ruins of Engaku-ji Temple near Shuri Castle."}, {"address": "1-27 Shuri Mawashicho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A hipster-chic handmade Okinawa Soba shop tucked away in an alley near Shuri Castle, featuring an elegant and serene environment. The shop freshly stone-grinds wheat in-house daily to make noodles with a delicate wheat aroma and a springy, refreshing bite. Served with a golden broth brewed from local Okinawan ingredients and carefully selected bonito, the thoroughly seasoned soft bone ribs and fresh potherb mustard complement each other perfectly. Exceptionally clean and non-greasy, it is a favorite among health-conscious and quality-seeking food lovers.", "name": "\u9996\u91cc\u307b\u308a\u5ddd (Shuri Horikawa)", "transport": "About a 10-minute walk from Monorail \u0027Shuri Station\u0027."}, {"address": "2-82 Shuri Kubagawacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A traditional Okinawan Sata Andagi (deep-fried dough ball) shop directly operated by its own poultry farm, famous for using fresh, high-quality eggs. Freshly fried, the golden exterior is ultra-crispy with a satisfying crunch, while the interior remains dense, moist, and packed with rich egg aroma and brown sugar sweetness. Even after cooling down, they stay wonderfully crispy without tasting oily. A beloved childhood comfort snack for locals, it is an essential street food treat when visiting Shuri.", "name": "\u5b89\u5ba4\u990a\u96de\u5834 \u6c96\u7e69\u958b\u53e3\u7b11\u9905\u5e97 (Amuro Sata Andagi)", "transport": "About an 8-minute walk from Monorail \u0027Shuri Station\u0027."}, {"address": "1-29 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A premier traditional Ryukyu royal cuisine restaurant located near the Shuri Kinjo-cho Stone-paved Path, offering views overlooking the Shuri Castle area. It serves meticulously crafted Ryukyu Kaiseki course meals, featuring iconic dishes like Rafute (braised pork belly), Goya Champuru (bitter melon stir-fry), and delicate court appetizers. The Rafute is slow-simmered for hours with brown sugar and Awamori; the meat is melt-in-your-mouth tender and rich without being greasy, bathed in a flavorful sweet-and-savory sauce. It faithfully recreates the grand banquet flavors once served to Qing Dynasty imperial envoys.", "name": "\u6f6d\u4ead \u7409\u7403\u6599\u7406 (Tantei Ryukyu Cuisine)", "transport": "About a 15-minute walk from Monorail \u0027Shuri Station\u0027, or a 5-minute taxi ride."}], "name": "Famous Traditional Local Spots"}, "cat_2": {"items": [{"address": "2-13 Shuritouzouch\u014d, Naha, Okinawa", "feature": "\u2b50 4.4 stars | Housed in a traditional Ryukyu heritage home near Shuri Castle, this charming tearoom boasts a distinctive Japanese dry landscape garden (Karesansui). Renowned for its signature Ryukyu-style brunch and afternoon tea, its popular traditional set meal comes with various side dishes. Highlights include pan-fried pork that is crispy outside, tender and juicy inside, as well as crisp, soft Sata Andagi (Okinawan brown sugar donuts) rich with aromatic brown sugar sweetness. Guests love sitting on the tatami mats along the veranda, taking in the gentle breeze while savoring refined Okinawan cuisine and desserts\u2014an absolute must-visit spot when exploring Shuri\u0027s historic charm.", "name": "Ryukyu Sabo Ashibiuna", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 15 minutes."}, {"address": "2-152-1 Shurikubagawach\u014d, Naha, Okinawa", "feature": "\u2b50 4.5 stars | Tucked away near Shuri Station, this cozy wooden-style cafe is a favorite among local youth and coffee aficionados. The house pour specialty coffee offers rich aromas with bright fruity acidity and an elegant finish. The brunch menu features thick toast made from locally baked bread, generously spread with homemade herb butter and seared golden brown\u2014delivering a delightfully crispy crust and a cloud-soft interior. Coupled with their limited-edition handmade French caramel pudding, which is silky smooth with a perfect bittersweet balance, it serves as the ultimate spot to unwind after touring Shuri Castle.", "name": "Shuri Cafe Nito (Caf\u00e9 Nito)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station Exit 1, then walk for about 3 minutes."}, {"address": "2-70 Shukinjocho, Naha, Okinawa", "feature": "\u2b50 4.3 stars | Nestled along the historic Kinjo-cho Stone-Paved Path in Shuri, this cozy spot is a converted traditional house. A must-try item is the red sweet potato cheese tart, boasting a flaky crust and a smooth, sweet, non-greasy red yam filling. Paired with a glass of iced Sanpin tea (jasmine tea), it offers a refreshing and delightful flavor harmony. The brunch platter includes freshly made Okinawan rice balls (onigiri) and signature soup, with chewy rice wrapped in aromatic nori. Window seats overlook the ancient stone-paved trail and lush greenery, surrounding diners in a romantic, historic atmosphere.", "name": "Shuri Kinjo-cho Stone-Paved Path Cafe Nakamoto (Caf\u00e9 Nakamoto)", "transport": "Walk from Shureimon Gate of Shuri Castle toward Kinjo-cho Stone-Paved Path; it takes about 10 minutes."}, {"address": "34 Shuriikehatach\u014d, Naha, Okinawa", "feature": "\u2b50 4.6 stars | Located near Shuri Castle, this popular minimalist specialty coffee stand is renowned for its high-quality signature brews and house-roasted beans. The oat milk latte is rich and smooth, seamlessly blending slightly bitter espresso with plant-based milk to release captivating nutty aromas. A morning bestseller is the freshly pressed croissant sandwich filled with rich melted cheese and savory Okinawa Agoo pork ham\u2014each bite delivers an addictive crunch as gooey cheese and savory ham burst with flavor, making it a beloved pilgrimage site for tourists.", "name": "Shuri SUI COFFEE STAND (Sui Coffee Stand)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Gibo Station or Shuri Station and walk for about 12 minutes."}, {"address": "1-13 Shuritoubarach\u014d, Naha, Okinawa", "feature": "\u2b50 4.4 stars | A highly acclaimed European-style bakery cafe in Shuri, filled every morning with the rich aroma of freshly baked bread. Its signature French croissant boasts an intensely rich buttery flavor with a flaky honeycomb crust and a soft, elastic center. The morning brunch platter includes artisanal German sausage, sunny-side-up eggs, fresh salad, and homemade sourdough bread featuring a delightful chew and subtle wheat aroma. With a bright, warm dining atmosphere, it is an elegant top choice for locals and visitors seeking an exquisite Western brunch.", "name": "Shuri Boulangerie Clochette", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Gibo Station and walk for about 8 minutes."}, {"address": "1-2 Shukinjocho, Naha, Okinawa (Inside Suimukan, Shurijo Castle Park)", "feature": "\u2b50 4.1 stars | Situated inside the Suimukan rest area of Shurijo Castle Park, this scenic cafe features large floor-to-ceiling windows overlooking vibrant outdoor greenery. The brunch highlights local Okinawan ingredients in popular dishes like Okinawan Taco Rice and Red Sweet Potato Pancakes. The pancakes are wonderfully fluffy and tender, drizzled with brown sugar syrup and whipped cream for a melt-in-your-mouth bite rich in sweet potato flavor. The savory Taco Rice creatively layers spicy minced meat with fresh lettuce for a rich texturing. Reasonably priced with a spacious and comfortable environment, it is an ideal spot to recharge after exploring historical sites.", "name": "Shurijo Castle Park Rest Area Cafe Suimui (Caf\u00e9 Suimui)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk about 15 minutes to the underground visitor center at Shurijo Castle Park."}, {"address": "1-6 Shuriakatach\u014d, Naha, Okinawa", "feature": "\u2b50 4.5 stars | Tucked away in a residential neighborhood of Shuri, this hidden gem cafe has made a name for itself with healthy, guilt-free vegetarian brunch platters and delicate desserts. The brunch platter features a colorful variety of local organic vegetables, pan-seared tofu, and black rice\u2014offering a refreshing, nutritious, and wholesome meal. Pair it with a house-special Okinawa Brown Sugar Ginger Latte, where delicate ginger notes and subtle brown sugar warmth soothe the body. The homemade mango cheesecake is delightfully creamy with a perfectly balanced sweet-tart flavor, earning high praise from lifestyle enthusiasts and female travelers alike.", "name": "Shuri Residence Cafe Sona (CAF\u00c9 Sona)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station Exit 2 and walk for about 6 minutes."}, {"address": "2-2 Shukinjocho, Naha, Okinawa", "feature": "\u2b50 4.3 stars | Combining an Okinawan history and folklore museum with a dining experience, this unique scenic tearoom cafe features lush greenery and rustic traditional wooden architecture. During brunch hours, popular offerings include special red sweet potato rice ball ice cream desserts and Okinawan Awamori Tiramisu. The tiramisu is deliciously moist and smooth, with bitter cocoa powder highlighting the aromas of Awamori liquor and cream. Another highlight is the Okinawa Brown Sugar Affogato\u2014pouring espresso over rich vanilla ice cream creates a perfectly bittersweet, velvety taste that keeps guests coming back for more.", "name": "Shuri Ancient City Cafe - Sabo Shuri Dounai", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 14 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-35 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Nestled on the quaint hills of Shuri, this spot combines an Okinawan folklore museum with a refined Ryukyu cuisine dining bar. Their slow-braised pork belly (Rafute) strictly uses local Agu pork, simmered for hours with Awamori liqueur and brown sugar. The fatty layer melts instantly in your mouth, while the lean meat absorbs the rich, sweet savory sauce without drying out. Paired with a glass of chilled three-year aged Awamori, the depth of flavor is unmatched. Surrounded by historic wooden architecture and Japanese gardens, guests can immerse themselves in the historic atmosphere of the Ryukyu Kingdom while enjoying traditional folk songs and delicious food.", "name": "Shuri Tounuchi", "transport": "Take the Naha Yui Rail to \u0027Shuri Station\u0027, then walk for about 15 minutes."}, {"address": "2-13 Shuri Kinjoucho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Renovated from a historic Ryukyu traditional house, this restaurant features a stunning dry landscape (Karesansui) garden. The most popular dish is the Special Agu Pork Goya Chanpuru (bitter melon stir-fry); thin slices of bitter melon are stir-fried crisp and green, paired with aromatic grilled tofu and savory pork slices, creating an addictively sweet-and-bitter finish. Sitting on the veranda (engawa), taking in the lush green views while sipping craft beer or an Awamori cocktail offers a visual and culinary delight that is immensely popular with tourists.", "name": "Ryukyu Dining Ashibiunaa", "transport": "About a 10-minute walk from Monorail \u0027Gibo Station\u0027, or a 5-minute walk from Shurijo Castle\u0027s Shureimon Gate."}, {"address": "1-27 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Hidden in an alley along the historic Shuri Kinjo-cho Stone-Paved Road, this hidden gem specializes in traditional Ryukyu royal and home-style dishes passed down through generations. The signature \u0027Jimami Tofu\u0027 (peanut tofu) has a rich, silky panna cotta-like texture with a deep peanut aroma, drizzled with a sweet-and-savory special sauce. Additionally, the \u0027Squid Ink Yakisoba\u0027 infuses fresh squid flavor straight into springy noodles. The cozy atmosphere makes it a top choice among locals for late-night gatherings and nostalgic flavors.", "name": "Fukuya Ryukyu Cuisine", "transport": "Take the Monorail to \u0027Shuri Station\u0027, transfer to a local bus and get off at \u0027Shurijo Koen Iriguchi\u0027, then walk about 3 minutes."}, {"address": "3-17 Shuri Akadacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A local-style izakaya beloved by Shuri residents and students, offering a rich menu of local Okinawan dishes and creative stir-fries. A must-try is the \u0027Crispy Okinawan Tempura\u0027, which features a thicker, seasoned batter than typical Japanese tempura, fried to a golden fluff and stuffed with tender garlic fish or sea grapes\u2014crunchy and piping hot with every bite. Paired with all-you-can-drink Orion draft beer, the lively and festive atmosphere makes it a wonderful place to experience a warm local midnight diner feel.", "name": "Anzuya Shuri Branch", "transport": "Take the Monorail to \u0027Shuri Station\u0027, exit and walk about 3 minutes."}, {"address": "1-1 Shuri Sakiyamacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Focusing on high-quality charcoal-grilled skewers and diverse Ryukyu dishes, this is a hugely popular late-night spot in Shuri. Carefully selecting local Okinawan chicken and Agu pork, they sear the skewers over high-heat Binchotan charcoal to lock in juices, yielding an invitingly smoky exterior and juicy interior. The \u0027Charcoal-Grilled Pork Belly Skewer with Awamori Sauce\u0027 is a highlight\u2014richly marbled yet non-greasy, infused with a subtle alcoholic sweetness. The lively atmosphere and reasonable prices attract many tourists looking to unwind after visiting Shurijo Castle.", "name": "Kushikado Shuri Branch", "transport": "Take the Monorail to \u0027Shuri Station\u0027, then walk about 8 minutes."}, {"address": "1-12 Shuri Touzouchou, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located right next to Shurijo Castle Park, this dining spot is a favorite among history buffs and foodies alike. The bar offers dozens of aged Awamori spirits from various Okinawan islands, paired with classics like \u0027Mozuku Seaweed Tempura\u0027 and \u0027Sea Grape \u0026 Okinawan Pork Salad\u0027. The sea grapes burst in your mouth like caviar with a natural, salty ocean flavor. Paired with a custom Awamori Highball, it\u0027s refreshing and palate-cleansing, allowing you to fully soak in the tropical island vibe.", "name": "Izakaya Shurei", "transport": "Just a 4-minute walk from Shurijo Castle\u0027s \u0027Shureimon Gate\u0027."}, {"address": "2-14 Shuri Kubagawacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A stylish dining bar combining modern Japanese izakaya style with traditional Ryukyu elements. Dish highlights like \u0027Vinegared Yam with Sea Grapes\u0027 and \u0027Seared Agu Pork Gyoza\u0027 are hugely popular among female diners. The gyoza feature thin, crispy skins filled with juicy pork and aromatic scallions, dipped in a custom Okinawan citrus ponzu sauce that adds a sweet-and-sour kick. With soft lighting and private dining booths, it offers an inviting, intimate experience\u2014perfect for couples or families seeking a refined Okinawan night out.", "name": "Ryukyu Dining Horai Shuri", "transport": "Take the Monorail to \u0027Shuri Station\u0027, then walk about 5 minutes."}, {"address": "1-20 Shuri Toriboricho, Naha City, Okinawa Prefecture", "feature": "\u2b50 3.9 stars | Named for its storehouse (kura) decor, this unique dining bar boasts a thick nostalgic Showa retro vibe. Must-try specialties include \u0027Goya Stir-fry with Tofu \u0026 Soft Bone Pork\u0027 and \u0027Teriyaki Okinawan Purple Sweet Potato Cheese Cake\u0027. The sweet potato cake is lightly charred outside and dense and sweet inside, layered with rich melted cheese that creates a surprisingly delicious balance of sweet and savory. Accompanied by handpicked local Junmai sake or fruit Awamori, it satisfies the palate and eases travel fatigue\u2014highly recommended by local regulars and seasoned travelers.", "name": "Izakaya Kura Shuri", "transport": "Take the Monorail to \u0027Shuri Station\u0027, then walk about 4 minutes."}], "name": "Specialty Dining Bars \u0026 Local Dishes"}, "cat_4": {"items": [{"address": "2-13 Shuritouzoucho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Housed in a century-old traditional Ryukyuan house near Shuri Castle, overlooking a tranquil Zen dry landscape garden. The restaurant offers a wide variety of vegetarian and tofu dishes, with special recommendations for the meat-free vegetarian version of \u0027Island Tofu Goya Champuru\u0027 and \u0027Beni-imo (Red Sweet Potato) Tempura\u0027. The tempura is crispy on the outside and soft on the inside, while the bitter melon is fresh, crisp, and completely free of harsh bitterness. Paired with the serene Japanese garden view, it is highly favored by international tourists seeking a peaceful ambiance and healthy dining.", "name": "Ryukyu Sabo Ashibiuna", "transport": "About a 15-minute walk from Shuri Monorail Station, or a 5-minute walk from the Shuri Castle Main Hall."}, {"address": "2-2 Shurikinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A classical Ryukyuan restaurant located on the Shuri highlands, resembling a Ryukyu history museum. It offers a thoughtfully designed \u0027Ryukyu Shojin Ryori Set (Vegetarian Course)\u0027 crafted with carefully selected local organic vegetables and island tofu. The iconic signature dish, \u0027Jimami Tofu (Peanut Tofu)\u0027, has a smooth, silky texture with a rich peanut aroma and sweet sauce that melts in your mouth, leaving a delightful aftertaste. It is the premier choice for experiencing Ryukyuan court-style vegetarian cuisine.", "name": "Shuri Dunchi", "transport": "About a 12-minute walk from Gibo Monorail Station, or about a 5-minute taxi ride."}, {"address": "1-6 Shuriakatacho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Tucked away inside a traditional house in Akatacho below Shuri Castle, Fukuya specializes in home-style Ryukyuan vegetarian dishes. The signature dish, \u0027Duruwakashi (Mashed Taro Root Dish)\u0027, is made by slow-simmering local taro root with wild mushrooms and kelp. It has a rich, delicate, and thick texture with a nostalgic earthy flavor. Embracing a low-oil and low-salt approach, it highlights the natural sweetness of the ingredients, making it a favorite among locals and health-conscious diners.", "name": "Fukuya", "transport": "About a 5-minute walk from Shuri Monorail Station."}, {"address": "1-23 Shurikinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A cozy teahouse located along the famous Kinjocho Cobblestone Road, offering breathtaking views overlooking Naha City. It serves a variety of vegan Japanese desserts and light snacks. The must-try \u0027Okinawa Brown Sugar Shaved Ice\u0027 features kidney beans slow-cooked in brown sugar, paired with fine shaved ice and chewy shiratama dango. Refreshingly sweet without being cloying, it is the perfect cooling treat after strolling along the historic cobblestone path.", "name": "Ishidatami Chaya Shinju", "transport": "About a 15-minute walk from Shuri Monorail Station; follow the signs to Kinjocho Cobblestone Road."}, {"address": "2-12-3 Matsuo, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | An iconic 100% vegan organic restaurant in Naha that showcases local pesticide-free vegetables and grains to perfection. Its signature \u0027Island Tofu Plant-Based Taco Rice\u0027 uses a multi-grain rice base topped with spiced tofu mince and fresh salsa. Juicy, flavorful, and with a delightful hint of spice, it completely reshapes the stereotype of vegetarian food.", "name": "Ukishima Garden", "transport": "About a 10-minute walk from Miebashi Monorail Station, close to the commercial area connecting to Shuri Castle."}, {"address": "3-1 Shuritouzoucho, Naha City, Okinawa Prefecture (Inside Shurijo Castle Park)", "feature": "\u2b50 4.1 stars | A relaxed rest house inside the Shurijo Castle Park Visitor Center, offering various vegan traditional Ryukyuan street snacks. The \u0027Beni-imo P\u014dp\u014d (Red Sweet Potato Crepe)\u0027 is highly recommended\u2014its thin crepe-like skin is soft and chewy, wrapping around smooth, sweet Okinawan red sweet potato paste. Rich in natural sweetness, it is a favorite treat among tourists exploring the historic castle grounds.", "name": "Suimukan Rest House Tea House", "transport": "About a 15-minute walk from Shuri Monorail Station directly to Shurijo Castle Park."}, {"address": "1-1-1 Kumoji, Naha City, Okinawa Prefecture (1F RYUBO Department Store)", "feature": "\u2b50 4.5 stars | A stylish plant-based caf\u00e9 emphasizing the \u0027Okinawan Longevity Diet Culture\u0027, using 100% animal-free ingredients and local organic produce. Its flagship \u0027Okinawan Island Vegetable Vegan Curry\u0027 features a rich, velvety sauce simmered with coconut milk, ripe fruits, and local turmeric. Served with roasted seasonal vegetables, it delivers rich layers of flavor and tropical aromas\u2014a modern vegan dish you shouldn\u0027t miss when visiting Shuri and Naha.", "name": "Rakuen Caf\u00e9", "transport": "Directly connected to Kencho-mae Monorail Station; easily accessible to and from the Shuri Castle commercial area by bus or monorail."}, {"address": "1-22 Shuritoubaru-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A Showa-style nostalgic teahouse hidden in a tranquil alley behind Shuri Castle, serving delicate vegetarian teahouse snacks and pour-over coffee. Its specialty \u0027Grilled Black Sugar Mochi\u0027 features a lightly charred, crispy exterior with a soft, chewy interior, drizzled with rich brown sugar syrup. Sweet yet non-sticky, pairing it with a cup of pesticide-free Okinawan herbal tea creates a wonderfully relaxing afternoon.", "name": "Kissa Tomo Shuri", "transport": "About an 8-minute walk from Shuri Monorail Station."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1-35 Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A traditional Ryukyuan confectionery shop near Shuri Castle, founded during the Ryukyu Kingdom era. Their classic Chinsuko shortbread is crumbly, crisp, and melts in your mouth, featuring a rich lard aroma and balanced sweetness. A royal-grade street snack perfect for a stroll in Shuri, loved by tourists and locals alike.", "name": "\u65b0\u57a3\u30ab\u30df\u83d3\u5b50\u5e97 (Arakaki Kami Kashiten)", "transport": "Approx. 10-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "1-58 Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A famous Shuri specialty steamed bun with over a century of history, freshly steamed wrapped in shell ginger leaves. Served hot, the thin casing is slightly chewy with a fresh herbal fragrance from the leaves, filled with smooth, perfectly balanced sweet red bean paste. A cherished nostalgic street sweet loved by locals and visitors.", "name": "\u5c71\u57ce\u307e\u3093\u3058\u3085\u3046 (Yamashiro Manju)", "transport": "Approx. 12-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "2-109-1 Shuri Kubagawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | An iconic Shuri tradition also known as \u0027Ju Manju\u0027. Its signature feature is the bright red stamp of the character \u0027\u5341\u0027 (symbolizing good luck and blessing) applied to the freshly steamed large buns on the spot. Soft and fluffy with a delicate aroma from shell ginger leaves, it\u0027s packed with sweet, dense house-made red bean paste\u2014a culturally rich and satisfying street snack.", "name": "\u5100\u4fdd\u307e\u3093\u3058\u3085\u3046 / \u304e\u307c\u307e\u3093\u3058\u3085\u3046 (Gibo Manju / Ju Manju)", "transport": "Approx. 3-minute walk from Monorail \u0027Gibo Station\u0027"}, {"address": "1-8 Shuri Akata-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | One of the rare historic shops in Okinawa still handcrafting \u0027Kippan\u0027 (citrus confectionery), a delicacy once served to the Ryukyu Royal Court. Made by simmering local Okinawan citrus fruits over several days and coated in delicate icing sugar, it offers a chewy texture bursting with intense citrus tartness and sweetness. Pairs exquisitely with fresh Okinawan jasmine tea.", "name": "\u5409\u672c\u304d\u3063\u3071\u3093\u5e97 (Jitouya Kippan Store)", "transport": "Approx. 8-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "2-11 Shuri Tozang-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Tucked in a Shuri alleyway, this immensely popular shop makes Okinawan deep-fried dough balls (Sata Andagi) using fresh farm-direct eggs. Fresh out of the fryer, they boast a golden, crisp exterior and a dense, moist, cake-like interior infused with rich egg and brown sugar aromas. Even when cooled, they remain crunchy and non-greasy\u2014a must-try grab-and-go snack.", "name": "\u5b89\u5ba4\u30b5\u30fc\u30bf\u30fc\u30a2\u30f3\u30c0\u30ae\u30fc (Amuro Sata Andagi)", "transport": "Approx. 10-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture (Inside Suireikan)", "feature": "\u2b50 4.1 stars | A casual snack kiosk inside the Shurijo Castle Park Visitor Center offering light bites and soft-serve ice cream made with local ingredients. The most popular highlight is the Okinawan purple sweet potato soft serve\u2014silky smooth, rich in flavor, and perfectly sweet. Paired with crispy freshly fried Okinawan brown sugar donuts, it\u0027s a great energy booster loved by families and tourists exploring the park.", "name": "\u9996\u91cc\u57ce\u516c\u5712 \u9996\u91cc\u675c\u9928\u8ce3\u5e97 (Shurijo Castle Park Suireikan Kiosk)", "transport": "Approx. 15-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "1-27 Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked alongside the quiet stone-paved path of Shuri Castle town, this famous spot serves wildly popular takeaway fried Mozuku (seaweed) tempura alongside exquisite noodles. Featuring a delightfully crunchy exterior and a soft, chewy seaweed center, it releases a savory, slightly salty ocean flavor enhanced with a sprinkle of Okinawan sea salt\u2014a perfect savory street snack while walking the historic path.", "name": "\u9996\u91cc\u307b\u308a\u304b\u308f \u6d77\u85fb\u5929\u5a66\u7f85 (Shuri Horikawa Mozuku Tempura)", "transport": "Approx. 10-minute walk from Monorail \u0027Shuri Station\u0027"}, {"address": "1-54 Shuri Yamagawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A charming rest stop combining traditional Ryukyuan coral dyeing crafts with local snack experiences. Serving freshly made traditional Ryukyuan crepe \u0027Po-Po\u0027 (brown sugar crepes), the batter is soft and chewy, wrapped around a savory-sweet brown sugar pork miso filling. Piping hot with complex sweet-and-savory layers, paired with a sip of iced jasmine tea, it offers an authentic Ryukyuan strolling experience.", "name": "\u9996\u91cc\u7409\u67d3 \u6563\u7b56\u8336\u5c4b (Shuri Ryusen Walk Kiosk)", "transport": "Approx. 15-minute walk from Monorail \u0027Shuri Station\u0027"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Shuri Castle and Historical Cultural District"}, "southern_senaga": {"categories": {"cat_1": {"items": [{"address": "1172 Oton, Yaese, Shimajiri District, Okinawa", "feature": "\u2b50 4.3 stars | Located in Yaese Town, Yagiya is a century-old traditional Okinawan house registered as a Japanese Tangible Cultural Property. The signature soy milk Okinawa soba boasts a rich aroma, featuring a broth that blends the sweetness of pork bones and bonito flakes, paired with smooth yet firm homemade soy milk noodles. The tender pork belly is braised to melt-in-your-mouth perfection, delightfully savory without being greasy. Surrounded by red-tiled Ryukyuan architecture and serene garden views, locals and travelers alike can savor authentic hometown flavors in a wonderfully nostalgic atmosphere.", "name": "Yagiya", "transport": "About a 30-minute drive from Naha Airport, or take the Ryukyu Bus to \u0027Oton\u0027 stop and walk for about 5 minutes."}, {"address": "223 Makabi, Itoman, Okinawa", "feature": "\u2b50 4.2 stars | Tucked away in a traditional village in Itoman City, Chaya Makabi Jinya is housed in a traditional red-tiled Ryukyuan building preserved since WWII. The signature soft-bone ribs Okinawa soba is an absolute classic; the broth is slow-simmered with bonito flakes and kelp, delivering a refreshing yet deep, complex flavor. The ribs are cooked so tender that even the soft bones crumble easily, bursting with juicy flavor. Paired with springy noodles that soak up the rich soup and homemade Awamori chili pepper sauce, it draws countless food lovers seeking historical charm and old-fashioned taste.", "name": "Chaya Makabi Jinya", "transport": "About a 30-minute drive from Naha Airport."}, {"address": "3-22-1 Shiozakicho, Itoman, Okinawa", "feature": "\u2b50 4.4 stars | Nambu Soba is an iconic traditional Okinawa soba shop in Itoman City, famous for its signature pig\u0027s trotter soba (Tebichi Soba). The trotters are meticulously cleaned and slow-cooked in a secret sauce until gelatinous, yielding a chewy skin and succulent, melt-in-your-mouth meat infused with sweet-savory notes. Their curly homemade noodles perfectly hold onto the clear, flavorful bonito and pork broth. Capturing the authentic heritage of southern Okinawa, it remains an irreplaceable delicacy for food enthusiasts.", "name": "Nambu Soba", "transport": "About a 25-minute drive from Naha Airport, located near Itoman City Hall."}, {"address": "4-17 Nishizakicho, Itoman, Okinawa", "feature": "\u2b50 4.3 stars | Operated by a local fishing family, Itoman Gyomin Shokudo features architecture crafted from Ryukyu limestone, blending traditional craftsmanship with modern design. The crowd favorite here is the Pan-Fried Fish with Butter Set Meal, featuring fresh seasonal fish delivered daily directly from Itoman Fishing Port. Sizzled on a hot plate with signature garlic butter, the skin turns golden and crispy while keeping the fish delicate and juicy. Served with a unique herb butter dipping sauce, it offers rich layers of flavor, impeccably showcasing southern Okinawa\u0027s coastal culinary art.", "name": "Itoman Gyomin Shokudo", "transport": "About a 20-minute drive from Naha Airport, located around the Itoman Industrial Zone."}, {"address": "9 Tamagusuku Ou, Nanjo, Okinawa", "feature": "\u2b50 4.1 stars | Located right at the entrance bridge to Ou Island in Nanjo City, Nakamoto Tempura Shop is a famous long-standing tempura joint in southern Okinawa. Okinawan-style tempura features a thicker, savory-seasoned batter that comes out hot, crispy on the outside, and soft on the inside. Every bite offers delightful flavors, whether it\u0027s smooth Mozuku seaweed, bouncy squid, or sweet fresh fish. Highly affordable and delicious, these piping hot treats with perfectly seasoned batter are a street food staple you shouldn\u0027t miss when visiting Nanjo.", "name": "Nakamoto Tempura Shop (Ou Island)", "transport": "About a 40-minute drive from Naha Airport, located right at the entrance of Ou Island after crossing the bridge."}, {"address": "19-1 Tamagusuku Tamagusuku, Nanjo, Okinawa", "feature": "\u2b50 4.4 stars | Built against a mountainside, Yama no Chaya Rakusui is a famed dining spot in Nanjo City known for traditional Okinawan natural health cuisine. Embracing locally grown organic vegetables, wild herbs, and fresh Okinawan tofu, the restaurant offers wholesome Ryukyu herbal set meals and traditional turmeric brown rice. Stone-oven-baked flatbreads and special vegetarian sets deliver crisp, distinct flavors where natural sweetness unfolds in every bite. Featuring rustic wooden interiors exposed to natural rock walls and sweeping ocean views of the Pacific, guests can savor authentic dishes in a relaxing, slow-paced atmosphere.", "name": "Yama no Chaya Rakusui", "transport": "About a 40-minute drive from Naha Airport, near Mibaru Beach."}, {"address": "Shop 34, Umikaji Terrace, 174-6 Senaga, Tomigusuku, Okinawa", "feature": "\u2b50 4.2 stars | Situated at Senagajima Umikaji Terrace, Maguro Honpo specializes in fresh tuna caught daily off the coast of Okinawa. Thanks to nearby tuna ports in southern Okinawa, they serve never-frozen, ultra-fresh raw tuna. The signature Tuna Rice Bowl is generously topped with rich, fatty bluefin tuna belly and lean akami, melting instantly in your mouth with natural sweetness and delicate flavor. Paired with perfectly seasoned rice, stunning ocean vistas, and views of planes taking off and landing, it stands as a premier dining landmark combining local seafood heritage with breathtaking scenery.", "name": "Maguro Honpo (Senagajima Umikaji Terrace)", "transport": "About a 15-minute drive from Naha Airport, or take the dedicated Senagajima shuttle bus directly."}, {"address": "1190 Chinen Chinen, Nanjo, Okinawa", "feature": "\u2b50 4.3 stars | Perched on a hilltop in Chinen, Nanjo City, Kurukuma is a legendary, long-established scenic restaurant in southern Okinawa. Famous for its Thai herb curries, the restaurant is operated by a local Okinawan organic medicinal herb farm, seamlessly incorporating traditional Okinawan herbs like turmeric and Choju-so (longevity herb). The signature \u0027Kurukuma Special Combo Curry\u0027 features three curries with distinct spice levels and flavor profiles, paired with tender meats, explosive spice aromas, and nutritious turmeric rice. Rich in taste and paired with breathtaking ocean views, its health-conscious dining concept has captivated visitors for decades.", "name": "Asian Herb Restaurant Kurukuma", "transport": "About a 45-minute drive from Naha Airport, near Chinen Cape Park."}], "name": "Local Traditional Famous Restaurants"}, "cat_2": {"items": [{"address": "Shop 32, Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Situated in a prime ocean-view location at Umikaji Terrace on Senagajima Island, this famous spot serves signature pancakes with an impossibly soft, fluffy, melt-in-your-mouth texture. Enriched with fresh milk fragrance and the natural sweetness of pure New Zealand honey, each order is cooked fresh and takes about 20 minutes. The ultimate bliss bursts when warm, golden pancakes topped with custom vanilla honey butter are enjoyed on the outdoor terrace, watching planes take off from Naha Airport against a stunning sunset backdrop\u2014a dream brunch experience for travelers.", "name": "A Happy Pancake Senagajima", "transport": "Take the Senagajima Shuttle Bus (TK02) from Naha Airport to \u0027Senagajima Umikaji Terrace\u0027 stop, then walk about 2 minutes."}, {"address": "Shop 27, Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A highly distinctive and hugely popular hangout for young travelers and Instagrammers on Senagajima Island. The highlight is the outdoor patio equipped with comfortable, authentic woven hammocks imported from Mexico. Guests can sway gently in the sea breeze while relishing homemade wraps and freshly blended tropical fruit smoothies. The wraps feature a lightly charred, crispy exterior stuffed with rich cheese and savory fillings, while the icy fruit smoothies are silky, refreshing, and deeply satisfying\u2014making it the perfect spot to soak in Okinawa\u0027s tropical breeze and laid-back vibe.", "name": "HAMMOCK CAFE LA ISLA", "transport": "Take the Senagajima Shuttle Bus to \u0027Senagajima Umikaji Terrace\u0027 stop, about a 1-minute walk."}, {"address": "175-4 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Perched atop a cliff on Senagajima Island, this Southern Italian-style oceanfront restaurant offers sweeping 360-degree panoramic views of the turquoise Pacific Ocean. The brunch and afternoon teas here are exceptional. Their signature wood-fired Neapolitan pizza boasts a delightfully crispy yet chewy crust infused with subtle flour aromas, topped with fresh mozzarella and sweet tomato sauce. Sitting on the outdoor terrace enjoying the breeze, ocean views, and planes soaring through the blue sky provides one of the most upscale brunch experiences in southern Okinawa.", "name": "POSILLIPO cucina meridionale", "transport": "About a 15-minute drive from Naha Airport, or take the Senagajima shuttle bus to the hilltop \u0027Ryukyu Onsen Senagajima Hotel\u0027 stop and walk 1 minute."}, {"address": "2-1 Tamagusuku, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Okinawa\u0027s legendary wooden seaside cafe, located right next to Tamagusuku Hyakuna Beach. The highly sought-after window seats allow guests to feel the rhythm of the ocean with every rising and falling tide. The menu features classic pairings like rich black coffee and homemade baked purple sweet potato pie\u2014crispy on the outside with a smooth, velvety filling full of natural yam flavor and subtle butter fragrance. When the high tide approaches right up to the window, sipping coffee to the sound of waves creates a peaceful, poetic retreat cherished by all visitors.", "name": "Hamabe no Chaya", "transport": "About a 40-minute drive from Naha city center; or take Toyo Bus No. 38 to \u0027Shikiya\u0027 stop and walk about 10 minutes."}, {"address": "19-1 Tamagusuku, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | The sister venue to \u0027Hamabe no Chaya\u0027, tucked away amid lush greenery and natural rock formations on the hills of Nanjo City. The architecture seamlessly blends raw stone walls with timber elements to create a serene, elegant forest atmosphere. The cafe specializes in healthy brunch sets made with pesticide-free local vegetables and native herbs. The signature Kusa Mochi (herb rice cake) is soft and chewy with a delicate herbal aroma, while their self-roasted organic coffee is smooth with a sweet aftertaste. Window seats on the second floor offer panoramic views of the distant blue sea, surrounding you with the soothing power of nature.", "name": "Yama no Chaya Rakusui", "transport": "About a 40-minute drive from Naha city center; located at the top of the stone steps across the slope from \u0027Hamabe no Chaya\u0027."}, {"address": "1190 Chinen, Chinen, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Perched high on the cliffs of the Chinen Peninsula, this spectacular scenic cafe boasts uninterrupted views of the Pacific Ocean. Renowned for serving some of the most authentic Thai curry brunches in Okinawa, their signature \u0027Kurukuma Curry Platter\u0027 offers beef, pork, and chicken curries with varying levels of spice and distinct flavor profiles, served with fragrant jasmine rice. The rich, aromatic spices awaken your palate instantly. After dining, visitors love taking photos and strolling across the expansive lush green lawn overlooking the ocean.", "name": "Caf\u00e9 Kurukuma", "transport": "About a 45-minute drive from Naha city center; or take the Nanjo City N-BUS to \u0027Chinen Marine Leisure Center\u0027 and take a 5-minute taxi ride."}, {"address": "202 Tamagusuku Maekawa, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located inside a natural limestone cave at the entrance of the \u0027Valley of Gangala\u0027 in southern Okinawa, offering a truly unique and mystical dining environment. The cave stays cool and refreshing, with impressive ancient stalactites hanging overhead. They serve special \u002735 Coffee\u0027, brewed using beans roasted over weathered Okinawan coral, producing a smooth, balanced flavor with gentle roasted notes. The signature brown sugar ice cream is rich and creamy, featuring a deep molasses sweetness balanced by a hint of saltiness. Enjoying coffee and light bites inside an ancient cave makes for a memorable adventure-style break.", "name": "Cave Cafe", "transport": "About a 30-minute drive from Naha city center; located directly opposite \u0027Okinawa World\u0027, about a 2-minute walk."}, {"address": "268 Tamagusuku Kakinohana, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A cozy, all-wooden hillside cafe in Nanjo City, surrounded by verdant forests. From the second-floor terrace, guests can enjoy sweeping views of southern Okinawa\u0027s blue coastline. The kitchen serves comforting home-style brunch dishes, with special praise for their homemade chiffon cake and cheesy curry rice. The chiffon cake is remarkably light, moist, and tender with elegant vanilla milk notes, while the cheese curry rice is rich and comforting, blending melted cheese with aromatic curry. It is a hidden sanctuary favored by locals and hipsters looking to escape the hustle and bustle.", "name": "Caf\u00e9 Fuuju", "transport": "About a 35-minute drive from Naha city center. Navigation is recommended; free customer parking is available on-site."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Senagajima Rooftop, 174-5 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Perched atop the hill on Senagajima, this upscale Italian bistro boasts an unobstructed 270-degree view of the azure Pacific Ocean and breathtaking sunsets. Highlighting Southern Italian Mediterranean-style cuisine, the restaurant uses fresh local Okinawan seafood and authentic vegetables. Their wood-fired pizza features a crispy crust with Neapolitan charcoal aroma and a chewy, moist interior, while the shrimp pasta is rich with savory ocean flavors. Visitors and locals alike love sipping selected wines or cocktails here while taking in the romantic view of airplanes landing and the sun dipping below the horizon.", "name": "POSILLIPO cucinameridionale (Senagajima Ocean View Italian Bistro)", "transport": "About 15 minutes by car from Naha Airport, or take the Senagajima Shuttle Bus from Akamine Monorail Station to the last stop and walk about 5 minutes."}, {"address": "746 Odon, Yaese Town, Shimajiri District, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A 100-year-old red-tile traditional house registered as a Tangible Cultural Property of Japan, offering a rich sense of traditional Ryukyuan history. Their signature Mozuku (seaweed) Okinawan Noodle features a smooth and springy texture, served with thick, melt-in-your-mouth braised pork belly in a sweet, light broth infused with subtle kelp and bonito aromas. The Ryukyuan home-style dishes and tofu specialties are immensely popular. Dining in the quaint tatami hall surrounded by garden greenery and gentle breezes offers an immersive experience of southern Okinawa\u0027s authentic local food culture.", "name": "Yagiya Traditional Okinawan Cuisine", "transport": "About 30 minutes by car from Naha city center, or take Bus No. 50 to \u0027Odon\u0027 bus stop and walk for about 3 minutes."}, {"address": "1190 Chinen, Chinen, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Perched on a cliff top in Nanjo City, southern Okinawa, this scenic bistro offers an incredible high-altitude ocean view. Famous for its Thai curry, it perfectly blends local Okinawan herbs and specialty ingredients. The signature chicken curry is rich, spicy, and infused with coconut milk, paired with tender chicken and chewy rice for a rich combination of textures. Tourists love sitting in the outdoor terrace area, feeling the sea breeze while taking in the panoramic gradient blue ocean of Cape Chinen and the Pacific\u2014a truly relaxing tropical dining experience.", "name": "Caf\u00e9 Curcuma (Nanjo Thai \u0026 Local Specialty Ocean View Restaurant)", "transport": "About 45 minutes by car from Naha city center, and about a 5-minute drive from Sefa-Utaki."}, {"address": "Shop No. 14, Senagajima Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | A highly popular seafood bistro in Senagajima Umikaji Terrace, family-run by local fishermen. The restaurant emphasizes using fresh, never-frozen top-grade yellowfin tuna caught in nearby waters that day. The signature tuna rice bowl features tender, melt-in-your-mouth tuna meat bursting with natural sweetness, pairing perfectly with special Ryukyu Awamori soy sauce and wasabi. The deep-fried tuna steak is crispy on the outside and juicy on the inside. Sitting on the front-row ocean view terrace with a cold draft of Okinawan Orion beer makes this an unmissable culinary highlight on Senagajima.", "name": "Oyaji no Maguro (Senagajima Branch)", "transport": "About 15 minutes by car from Naha Airport, or take the Senagajima Shuttle Bus to Umikaji Terrace."}, {"address": "6-4-8 Nishizaki, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | An authentic seafood izakaya located in Itoman, a key fishing port town in southern Okinawa, highly favored by locals and food lovers alike. Sourcing fresh catches directly from Itoman Fishing Port daily, it offers exceptional value seafood dishes. The sashimi platter features thick, generous slices that are fresh and sweet; the Okinawan-style butter-fried fresh fish is crispy on the outside and tenderly juicy inside, rich with garlic and butter aromas. It pairs wonderfully with freshly brewed Okinawan Awamori liquor. The lively and warm atmosphere perfectly captures the cheerful late-night dining culture of southern Okinawa\u0027s fishing town.", "name": "Itoman Seafood Izakaya Uosh\u014d", "transport": "About 25 minutes by car from Naha city center, or take Bus No. 89 to \u0027Nishizaki 2-Chome\u0027 stop and walk about 3 minutes."}, {"address": "268 Tamagusuku Kakinahana, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Tucked away where the lush forests and ocean meet in Nanjo City, this charming wooden bistro is built entirely from warm timber. The second-floor terrace offers distant views of sacred Kudaka Island and the Pacific Ocean. The restaurant serves creative local fusion and Western dishes incorporating Okinawan ingredients, such as hamburg steaks made with Okinawan Agu pork, which are firm, juicy, and rich in natural sweetness. Paired with custom Okinawan brown sugar desserts and local herbal tea, the flavors are delicate and soothing. Surrounded by forest and sea, this hidden gem is perfect for travelers looking to escape the hustle and bustle while enjoying exquisite local cuisine.", "name": "Caf\u00e9 Fuu-ju Ocean Bistro", "transport": "About 40 minutes by car from Naha city center, and about a 10-minute drive from Gyokusendo / Okinawa World."}, {"address": "1299-1 Tamagusuku Hyakuna, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | A Ryukyuan dining establishment inside \u0027Hyakuna Garan\u0027, a luxury oceanfront hotel near Hyakuna Beach in the south. It serves high-end kaiseki cuisine blending traditional Ryukyu Kingdom court dishes with modern culinary techniques. The chef selects top-tier Okinawan Ishigaki beef, Agu pork, and seasonal southern wild vegetables. The classic braised pork belly (Rafute) is stewed to rich perfection\u2014tender and melting in your mouth, infused with the deep sweetness of brown sugar and Awamori; the sea grapes are fresh and bursting with juice. Featuring private room settings with sweeping ocean views and a majestic rock garden, it offers utmost privacy and elegance, making it the top choice for sampling premium Okinawan regional cuisine.", "name": "Hyakuna Garan Kanro Okinawan Dining", "transport": "About 40 minutes by car from Naha Airport, or take the Nanjo City Bus to \u0027Hyakuna\u0027 stop and walk about 10 minutes."}, {"address": "400 Kaneshiro, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.0 Stars | A charming local bistro steeped in Ryukyuan vibe in Itoman City. Decorated with Okinawa Sanshin instruments and sake bottles, it exudes a cheerful, authentic izakaya atmosphere. Here you can savor all classic Okinawan regional dishes in one place, including crisp Goya Chanpuru (bitter melon with tofu), tender squid ink fried noodles, and charcoal-grilled Okinawan Wagyu beef skewers. Complemented by a wide selection of aged Okinawan Awamori and ice-cold draft beer, the place gets livelier as night falls, making it a favorite for both locals and tourists seeking authentic local nightlife.", "name": "Izakaya Maten Itoman", "transport": "About 25 minutes by car from Naha city center, or take Bus No. 89 to \u0027Kaneshiro\u0027 stop and walk about 2 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "3-464 Nishizakicho, Itoman, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A plant-based vegan restaurant located in Itoman City, specializing in gluten-free, dairy-free, and egg-free natural detox cuisine. The signature vegan plate set features a variety of local Okinawan organic vegetables and tofu tempura\u2014crispy on the outside, soft on the inside, and drizzled with a rich, fragrant special sesame sauce. Tourists and health-conscious foodies especially love their raw vegan cakes, which are dense, smooth, and pleasantly sweet without being cloying, offering a light, guilt-free treat.", "name": "Detox Cafe felicidad (\u30c7\u30c8\u30c3\u30af\u30b9\u30ab\u30d5\u30a7 \u30d5\u30a7\u30ea\u30b7\u30c0\u30fc\u30c9)", "transport": "About 20 minutes by car from Naha Airport; or take Ryukyu Bus No. 89 to \u0027Nishizaki 2-chome\u0027 stop and walk for about 5 minutes."}, {"address": "987-1 Tamagusuku Hyakuna, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A cozy vegetarian cafe hidden in the hills of Nanjo City, ideal for macrobiotic diet enthusiasts. Using pesticide-free local island vegetables and handmade island tofu from local farmers, their popular \u0027Island Tofu Cutlet Set\u0027 pan-sears tofu to a golden-crisp finish with a soft, delicate interior. Paired with a sweet homemade miso sauce, the rich layers of flavor are truly impressive. With scenic rural views and exquisite health-focused dishes, it\u0027s a perfect spot to soothe the soul.", "name": "Caf\u00e9 Beans (\u30ab\u30d5\u30a7 \u30d3\u30fc\u30f3\u30ba)", "transport": "About 40 minutes by car from downtown Naha; or take Toyo Bus No. 38 to \u0027Hyakuna Iriguchi\u0027 stop and walk for about 10 minutes."}, {"address": "1190 Chinen, Chinen, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched on a coastal cliff in Nanjo with ultimate ocean views, this restaurant is famous not only for Thai meat dishes but also for its pure plant-based vegan curries. The special \u0027Vegetable \u0026 Herb Spice Curry\u0027 is slow-cooked with local turmeric and various Southeast Asian spices, creating a rich, smooth flavor with a mild spicy herbal freshness. Served with sweet, tender local root vegetables, it\u0027s exceptionally delicious. Enjoying healthy plant-based meals on the outdoor terrace overlooking the Pacific Ocean makes it a huge hit among Instagrammers and travelers.", "name": "Cafe Curcuma (\u30ab\u30d5\u30a7 \u304f\u308b\u304f\u307e)", "transport": "About 45 minutes by car from Naha Airport; or take Okinawa Bus No. 39 to \u0027Chinen Marine Leisure Center Iriguchi\u0027 and take a 5-minute taxi ride."}, {"address": "269 Sashiki Abiki, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A vegetarian-friendly restaurant inspired by French natural dining concepts, nestled amidst the lush greenery of Nanjo City. The chef creatively utilizes seasonal Okinawan organic vegetables and fresh vegetable broths to craft colorful French vegetarian platters. Seared bitter melon and island radish offer a subtle smokiness and sweetness, served with artisanal sourdough bread that is crisp on the outside and pillowy soft inside. Many travelers seeking light, low-carbon dining are captivated by its elegant atmosphere and pure, authentic flavors.", "name": "Cafe BE NATURAL (\u30ab\u30d5\u30a7 \u30d3\u30fc\u30ca\u30c1\u30e5\u30e9\u30eb)", "transport": "About 35 minutes by car from downtown Naha; or take Ryukyu Bus No. 37 to \u0027Abiki\u0027 stop and walk for about 3 minutes."}, {"address": "1672-3 Tamagusuku Hyakuna, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A highly popular cafe featuring floor-to-ceiling ocean-view windows, offering a variety of meatless and vegetarian options for health-conscious diners. The signature \u0027Island Vegetable Pasta\u0027 uses abundant fresh bitter melon, purple sweet potato, and okra, tossed with light olive oil and herbs. The pasta is perfectly al dente, and the vegetables are fresh and crisp. The homemade multi-grain and wild rice salad bowl is also a must-order for photo-seeking tourists, bursting with natural freshness and layered textures.", "name": "Cafe Yabusachi (\u30ab\u30d5\u30a7 \u30e4\u30d6\u30b5\u30c1)", "transport": "About 40 minutes by car from Naha Airport; or take Toyo Bus No. 38 to \u0027Hyakuna\u0027 stop and walk for about 12 minutes."}, {"address": "1360 Tamagusuku Hyakuna, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A rare open-air beachfront Nepalese curry stall right next to Mibaru Beach in Nanjo City. Offering several meatless and vegan curries, their \u0027Chickpea \u0026 Vegetable Curry\u0027 features a rich, smooth texture with melt-in-your-mouth chickpeas. Paired with freshly baked, aromatic Nepalese Naan\u2014crispy on the outside and fluffy inside\u2014it leaves a lasting impression. Dining barefoot on fine white sands with wholesome hot food is the captivating highlight drawing travelers from all over the world.", "name": "Shokudo Karika (\u98df\u5802\u304b\u308a\u304b)", "transport": "About 40 minutes by car from downtown Naha; or take Ryukyu Bus No. 39 to \u0027Mibaru Beach\u0027 terminal stop and step right off."}, {"address": "421 Tamagusuku Maekawa, Nanjo, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Tucked away in a quiet alley in Nanjo City, this healthy Shojin Ryori (Buddhist temple cuisine) cafe specializes in vegan and organic wild herb set meals. Their \u0027Okinawan Medicinal Herb Tempura\u0027 uses freshly picked longevity grass and wild herbs coated in light batter and fried to golden perfection; every crispy bite delivers a refreshingly fragrant, slightly bitter, yet uplifting taste. Free from artificial additives, it receives rave reviews from health-conscious local seniors and soul-seeking vegetarian travelers alike.", "name": "Cafe Samgha (\u30ab\u30d5\u30a7 \u30b5\u30e0\u30ae\u30e3)", "transport": "About 30 minutes by car from Naha Airport; or take Okinawa Bus No. 50 to \u0027Maekawa\u0027 stop and walk for about 8 minutes."}, {"address": "186 Gishi, Yaese, Shimajiri District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A natural country-style cafe located in Yaese Town, specializing in local Okinawan island vegetable lunch plates and healthy light meals. The \u0027Vegan Purple Sweet Potato Croquette\u0027 is highly recommended\u2014crispy breadcrumbs on the outside with a soft, sweet, and velvety filling that tastes amazing without heavy seasoning. With a warm and cozy atmosphere, a wide variety of fresh organic salad greens, and homemade plant-based dressings, it is beloved by local families and vegetarian travelers.", "name": "Cafe Olive (\u30ab\u30d5\u30a7 \u30aa\u30ea\u30fc\u30d6)", "transport": "About 25 minutes by car from downtown Naha; or take Ryukyu Bus No. 50 to \u0027Gishi\u0027 stop and walk for about 4 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "9 Tamagusuku Ou, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A legendary tempura stall located at the entrance of Ou Island, making it a top choice for street food while strolling in southern Okinawa. Its signature \u0027Mozuku Tempura\u0027 is golden and crispy on the outside, filled with a rich seaweed aroma and a soft, chewy texture. The fresh fish and squid tempura are thick and juicy, crackling with every bite of their special batter, best enjoyed with just a dash of salt. High value-for-money and fried fresh to order, attracting endless lines of tourists and anglers.", "name": "Nakamoto Tempura Shop", "transport": "Approx. 35 mins by car from Naha Airport; or take Bus No. 51 to \u0027Ou\u0027 stop and walk 1 min."}, {"address": "193 Tamagusuku Ou, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A secret local tempura shop tucked deep inside Ou Island. Items are fried fresh to order and served steaming hot. Signature offerings like the \u0027Fried Hot Dog\u0027 and \u0027Vegetable Fritter\u0027 feature a thin, crispy outer crust with a tender center that highlights the natural sweetness of the vegetables. The \u0027Fried White Fish\u0027 is delicate, odor-free, and melts in your mouth. Many insiders grab a portion to enjoy on the sea embankment while taking in the gentle breeze and beautiful ocean views.", "name": "Oshiro Tempura Shop", "transport": "Approx. 35 mins by car from Naha Airport; walk about 5 mins along the coastal road after arriving at Ou Island."}, {"address": "No. 8, Senagajima Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A trendy street snack shop that fuses traditional Okinawan \u0027Sata Andagi\u0027 (deep-fried dough balls) with modern dessert culture. Freshly fried, hot purple yam or brown sugar dough is crispy outside and soft inside with rich milk and egg flavors, topped with a large scoop of cold, silky Okinawa Salt Milk or Mango Gelato. The explosive hot-and-cold combination, paired with Senaga Island\u0027s blue skies and sweeping ocean views, makes this an Instagram-favorite dessert spot.", "name": "KAME ANDAGI Senagajima", "transport": "Approx. 15 mins by car from Naha Airport; or take the Senagajima Shuttle Bus to \u0027Umikaji Terrace\u0027 stop."}, {"address": "No. 4, Senagajima Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A wild, giant American burger stall sitting right on the oceanfront of Senaga Island. Famous for freshly made burgers overflowing with toppings. The thick, hand-pressed beef patty is seared on a hot griddle until aromatic and juicy, bursting with flavor at the first bite. Layered with rich melted cheese, crispy bacon, and plenty of crunchy lettuce, it offers incredible texture. Its juicy flavor and impressive size make it impossible for passing tourists to resist.", "name": "Hanran Burger Chimfugas", "transport": "Approx. 15 mins by car from Naha Airport; or take the Senagajima Shuttle Bus directly."}, {"address": "4-19 Nishizakicho, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | The most iconic seafood street-food market in southern Okinawa. Multiple stalls offer ready-to-eat seafood, with the most popular being the \u0027Broiled Sea Urchin Spiny Lobster\u0027, featuring firm, springy meat topped with a rich sea urchin sauce that turns irresistibly fragrant when torched. Raw-grade giant scallops and fresh oysters are silky, sweet, and carry the natural salinity of the sea. Visitors can freely select small seafood sashimi bowls to enjoy standing or in the seating area for an authentic fish market vibe.", "name": "Itoman Fish Market Seafood Stalls", "transport": "Approx. 20 mins by car from Naha Airport; or take the TK02 Akamine Express Bus to \u0027Michi-no-Eki Itoman\u0027 stop."}, {"address": "No. 33, Senagajima Umikaji Terrace, 174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | An ocean-view branch of Okinawa\u0027s wildly popular national street food, the \u0027Spam and Egg Rice Ball\u0027. Made to order using steaming-hot Niigata Koshihikari rice and premium seaweed wrapped around thick-cut grilled Spam and a soft, thick omelet. The classic \u0027Bitter Melon Tempura Rice Ball\u0027 pairs the crispy, slightly bitter batter of goya with savory Spam for an amazingly layered bite. The convenient handheld design lets you stroll and eat while enjoying aircraft landings and ocean waves.", "name": "Potama Senagajima Umikaji Terrace", "transport": "Approx. 15 mins by car from Naha Airport; or take the airport shuttle bus to \u0027Senagajima Umikaji Terrace\u0027 and walk 1 min."}, {"address": "4-19-1 Nishizakicho, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A popular street dessert stall located inside Roadside Station Itoman. Known for summer shaved ice and fruit skewers made with fresh local tropical fruits from southern Okinawa. The must-try \u0027Banana Mango Shaved Ice\u0027 is piled high with thick chunks of fresh tropical mango, drizzled with rich fruit jam and condensed milk\u2014cool, velvety, and bursting with fruity flavor. They also serve crispy-on-the-outside, chewy-on-the-inside \u0027Purple Yam Fries\u0027 and \u0027Okinawan Shikuwasa Sparkling Drink\u0027, making it a perfect refreshing pit stop during a road trip.", "name": "Roadside Station Itoman Parlor Yukuru", "transport": "Approx. 20 mins by car from Naha Airport; or take Bus No. 89 to \u0027Nishizaki 2-chome\u0027 and walk about 10 mins."}, {"address": "1-18 Chinen Tsukishiro, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | A nostalgic local Parlor snack stall hidden on a plateau in Nanjo City. Deeply loved by local residents and touring cyclists, it serves freshly fried Okinawan snacks. The \u0027Ishigaki Beef Croquette\u0027 features an ultra-crispy shell with a juicy, flavorful beef filling, while the \u0027Okinawan Brown Sugar Red Bean Shaved Ice\u0027 is perfectly sweet with a rich brown sugar aroma and soft simmered red beans. Enjoy simple, authentic street food while sitting at the pavilion stall overlooking the ocean view of the Chinen Peninsula.", "name": "Parlor Tsukishiro", "transport": "Approx. 40 mins by car from Naha Airport; located along the main road of the Tsukishiro community in Nanjo City."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Southern Okinawa and Senaga Island"}, "urasoe_ginowan": {"categories": {"cat_1": {"items": [{"address": "3-36-2 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Celebrated as the birthplace of \"Yushidofu Soba\" (fluffy tofu Okinawa soba), this is Urasoe\u0027s most iconic long-standing noodle shop. The signature dish features silky, delicate white soft tofu layered over chewy Okinawa noodles, immersed in a rich broth blending savory pork bone and bonito essence. The soup is warm, mildly sweet, and remarkably non-greasy. Paired with melt-in-your-mouth soft tofu and stewed tender pork ribs, it offers incredible layers of texture. Since opening in the 1970s, it has captivated locals and tourists alike with its comforting, authentic flavors\u2014a must-visit traditional culinary hall in Urasoe.", "name": "Takaesu Soba", "transport": "About a 25-minute drive from Naha Airport, or take the Ryukyu Bus to \"Izu\" stop and walk about 3 minutes."}, {"address": "3-1-3 Isa, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located in Ginowan City, MEXICO is a legendary taco institution that has specialized solely in tacos for decades. Its standout feature is the daily homemade, freshly fried shells\u2014crispy on the outside yet pleasantly soft and chewy inside, completely distinct from hard American-style shells. Filled with fragrant seasoned ground beef, crisp shredded cabbage, and cheddar cheese, it\u0027s served with signature house-made tomato salsa for a tangy, refreshing bite. Its pure simplicity leads locals to buy them by the dozen, making it a beloved pilgrimage site for foodies in Ginowan.", "name": "Tacos MEXICO", "transport": "About a 30-minute drive from Naha city center; or take Okinawa Bus No. 20/120 to \"Isa\" stop and walk about 2 minutes."}, {"address": "1-24-6 Futenma, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | The pioneer shop that birthed Okinawa\u0027s iconic soul food, Taco Rice. This traditional Futenma branch retains nostalgic Showa-era charm and serves famously giant portions. The signature Taco Rice spreads savory, spiced ground beef over steaming hot white rice, piled high with a mountain of shredded lettuce and cheddar cheese. As the heat melts the cheese into the rice, every bite delivers a hearty blend of fresh lettuce, signature sweet-and-spicy sauce, and rich fusion flavors loved by locals and US military personnel alike.", "name": "King Tacos Futenma", "transport": "About a 35-minute drive from Naha Airport, or take a bus to \"Futenma\" stop and walk about 3 minutes."}, {"address": "2-41-1 Futenma, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A classic Okinawan diner that has stood on a corner of Futenma\u0027s old street for decades, oozing retro nostalgia. Dedicated to authentic home-style Okinawan cooking, its top highlights are the Goya Champuru (bitter melon stir-fry) and Tebichi (braised pig trotters). The bitter melon is crisp and mildly bitter, flash-fried with tofu, Spam, and egg for a smoky stir-fry aroma. The braised pig trotters are slow-cooked for hours until rich in collagen and meltingly tender. With hearty portions and wallet-friendly prices, it offers a warm taste of genuine Okinawan home cooking.", "name": "Sankaku Shokudo", "transport": "Take the Okinawa Bus to \"Futenma Ichiba-mae\" stop and walk about 1 minute."}, {"address": "1-11-21 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | An award-winning Okinawa Soba institution famed for its extremely clear yet deeply flavorful broth. Carefully simmered from pork bone and bonito flakes, the golden broth is crisp, sweet, and lingering on the palate. Paired with custom-made thin straight noodles, it offers a springy bite that absorbs the soup perfectly. The soft-bone pork ribs are stewed until tender enough to eat whole. Be sure to add a few drops of the special Awamori chili liquor on the table to unlock an addictive spicy depth\u2014this is the gold standard of Okinawa soba for Urasoe locals.", "name": "Tamaya Soba Urasoe", "transport": "About a 20-minute drive from Naha city center, or take a bus to \"Izu 2-chome\" stop and walk about 4 minutes."}, {"address": "No. 40, 2-13-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in Urasoe\u0027s Minatogawa Stateside Town, this traditional handmade Okinawa soba spot is famous for its rich broth crafted from premium local Agu pork. The unique handmade wood-ash noodles offer a natural aroma and delightful chewiness, paired perfectly with broth slow-simmered purely from Agu pork bones. Each bowl is signature-topped with a delicate folded omelet wrapper and served alongside fragrant seared pork ribs. Delivering juicy bites and springy noodles, it effortlessly blends traditional heritage with chic foreigner-quarter ambiance.", "name": "Ishigufu Minatogawa", "transport": "About a 30-minute drive from Naha Airport; or take a bus to \"Minatogawa\" stop and walk about 8 minutes."}, {"address": "3-15-1 Miyagi, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A legendary ramen spot in the Miyagi district of Urasoe. Though specializing in Kyoto-style soy sauce ramen, it has been deeply rooted in the community for decades as Urasoe\u0027s ultimate local comfort noodle shop. The signature Kujo Scallion Shoyu Ramen comes topped with abundant sweet green onions flown in fresh from Kyoto. Its rich tonkotsu shoyu broth carries a hint of pork back fat\u2014savory, smooth, and never overly heavy. Thin noodles soak up the scallion aroma and complement the flame-seared chashu pork, consistently drawing long lines during meal times.", "name": "Menya Waraku", "transport": "Take a bus to \"Miyagi 3-chome\" stop and walk about 2 minutes, or drive about 20 minutes from Naha city center."}, {"address": "1-12-11 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A classic local favorite deeply rooted in Ginowan, named after the famous local Hagoromo legend. The signature Hagoromo Soba is known for its generous portions of tender, slow-braised soft-bone ribs and pork belly that melt in your mouth. The broth uses high-grade kelp and bonito dashi for a clean, comforting finish with a subtle oceanic sweetness. Interestingly, they also offer homemade mugwort (Yomogi) noodles, which lend a gentle herbal fragrance that pairs wonderfully with the savory meat broth.", "name": "Hagoromo Soba", "transport": "About a 25-minute drive from Naha; or take Bus No. 20 or 120 to \"Oyama\" stop and walk about 5 minutes."}], "name": "Local Iconic Classic Eateries"}, "cat_2": {"items": [{"address": "2-17-1 Minatogawa (No. 18), Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | The most iconic French fruit tart specialty cafe located in the Minatogawa Stateside Town in Urasoe. Housed in a cozy white cottage converted from former US military housing, it oozes warm rustic charm. Their signature mixed fruit tart features a cookie-like crispy crust paired with smooth, perfectly balanced custard and fresh seasonal fruit. Rich in sweet-and-sour flavor layers, it is perfect for lazy sunny mornings and afternoon tea.", "name": "oHacort\u00e9 Minatogawa Main Store", "transport": "Take Ryukyu Bus No. 28/29 to Jinjinmori or Minatogawa Station, then walk about 5 minutes."}, {"address": "2-15-6 Minatogawa (No. 28), Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | A long-standing local specialty coffee roastery established in 1986, tucked away in the Minatogawa Stateside Town. Selecting high-quality coffee beans from around the world, they roast unique single-origin pour-overs and espressos in-house. Bright, lively fruity acidity and subtle sweetness coat the palate with every sip. Filled with a rich coffee aroma, it is a sacred pilgrima
