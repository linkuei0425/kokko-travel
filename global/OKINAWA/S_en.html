    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.5 Stars | As the political and cultural center of the Ryukyu Kingdom, this World Heritage site showcases a unique fusion of Chinese and Japanese architectural styles.", "duration": "2-3 hours", "title": "Shuri Castle Park", "transport": "Take the Okinawa Monorail (Yui Rail) to Shuri Station, then walk about 15 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.4 Stars | Perched on a cliff overlooking the ocean, this head of the Eight Shrines of Ryukyu is Naha\u0027s most famous spot for prayers and worship.", "duration": "1 hour", "title": "Naminoue Shrine", "transport": "Take the monorail to Asahibashi Station, then walk about 15 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.3 Stars | A royal Ryukyuan landscape garden featuring a central pond, blending Chinese stone arch bridges with traditional Ryukyuan architecture.", "duration": "1-1.5 hours", "title": "Shikinaen Garden", "transport": "Take Bus No. 2 (Shikina Line) from central Naha and get off at the Shikinaen-mae stop."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.2 Stars | A serene classical Chinese garden built to commemorate the sister-city partnership between Naha and Fuzhou.", "duration": "1 hour", "title": "Fukushuen Garden", "transport": "Take the monorail to Kencho-mae Station, then walk about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.4 Stars | A charming stone-paved historic street with a retro vibe, lined with centuries-old Ryukyuan pottery workshops and boutique select shops.", "duration": "1-2 hours", "title": "Tsuboya Yachimun Street", "transport": "Take the monorail to Makishi Station, then walk about 8 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.4 Stars | Designed to resemble a grand Ryukyuan fortress, this complex offers an in-depth look at Okinawa\u0027s unique nature, rich history, and modern art.", "duration": "2 hours", "title": "Okinawa Prefectural Museum \u0026 Art Museum", "transport": "Take the monorail to Omoromachi Station, then walk about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.3 Stars | A preserved limestone-paved trail from the Ryukyu era, lined with charming traditional houses and ancient camphor trees that evoke deep nostalgia.", "duration": "1 hour", "title": "Kinjo-cho Stone-Paved Path", "transport": "Walk about 10 minutes from Suirumukan in Shuri Castle Park to reach this ancient path."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.3 Stars | Known as Naha\u0027s kitchen, this brightly renovated market offers an authentic food experience where you can buy fresh seafood downstairs and have it cooked on the second floor.", "duration": "1-2 hours", "title": "First Makishi Public Market", "transport": "Take the monorail to Miebashi Station, then walk about 8 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.2 Stars | Naha\u0027s bustling \"Miracle Mile\", packed with local souvenir shops, authentic Ryukyuan restaurants, and charming specialty boutiques.", "duration": "2-3 hours", "title": "Kokusai-dori Shopping Street", "transport": "Take the monorail to either Kencho-mae Station or Makishi Station; the street is right outside."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.0 Stars | The remains of the royal mausoleum of the Ryukyu Kingdom, featuring massive stone arched gates designated as an Important Cultural Property of Japan.", "duration": "0.5 hours", "title": "Sogen-ji Stone Gate", "transport": "Take the monorail to Miebashi Station, then walk about 6 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.3 Stars | A spacious sports park in the city featuring Oki Shrine (one of the Eight Ryukyu Shrines) and long roller slides loved by families.", "duration": "1.5 hours", "title": "Onoyama Park and Oki Shrine", "transport": "Take the monorail to Onoyama-koen Station; the park is right outside."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.0 Stars | Located near Naminoue Shrine, this Minnan-style Confucius Temple reflects the deep influence of Confucianism on the Ryukyu Kingdom.", "duration": "0.5-1 hours", "title": "Shiseibyo (Naha Confucius Temple)", "transport": "Take the monorail to Kencho-mae Station, then walk about 12 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.3 Stars | Former U.S. military housing transformed into a trendy American-style district filled with stylish caf\u00e9s, dessert shops, and handmade craft boutiques.", "duration": "1.5-2 hours", "title": "Minatogawa Stateside Town", "transport": "Take Bus No. 20 or 120 from Naha Bus Terminal, get off at Izu Station, and walk about 10 minutes."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.5 Stars | Home to Gyokusendo Cave\u2014one of Japan\u0027s top three limestone caves\u2014where you can experience traditional Ryukyuan crafts and watch thrilling Eisa drum performances.", "duration": "3 hours", "title": "Okinawa World", "transport": "Take Bus No. 83 from Naha Bus Terminal and get off at Gyokusendo-mae Station."}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.4 Stars | A vibrant American-style entertainment complex packed with shopping malls, international cuisine, and romantic oceanfront sunsets.", "duration": "2-3 hours", "title": "American Village", "transport": "Take Bus No. 20 or 120 from central Naha, get off at Kuwae Station, and walk about 5 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture",                 let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
