        "@type": "ListItem",
        "position": 1,
        "item": {
          "@type": "TouristAttraction",
          "name": "Shurijo Castle Park",
          "description": "⭐ 4.5 stars | Shurijo Castle was once the political, diplomatic, and cultural center of the Ryukyu Kingdom, showcasing a unique Ryukyuan architectural art style that blends Chinese Ming and Qing architectural elements with Japanese woodworking technology. Although the main hall suffered a tragic fire in 2019, an active and elaborate reconstruction project is currently underway. The park has opened an observation path, allowing visitors to witness up close the precious process of traditional artisans using ancient methods to restore this historic heritage. Standing by the elevated Kankaimon and Kohokumon gates, visitors can also overlook the entire Naha cityscape and distant ocean views. It is an indispensable landmark for gaining a deep understanding of the Ryukyu Kingdom's centuries of glorious history.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "3-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 2,
        "item": {
          "@type": "TouristAttraction",
          "name": "Shureimon Gate",
          "description": "⭐ 4.4 stars | Shureimon Gate is an iconic landmark of Shurijo Castle and the central motif featured on the Japanese 2,000-yen banknote. Built in the 16th century during the reign of King Sho Sei of the Ryukyu Kingdom, this paifang-style wooden structure bears a plaque reading 'Shurei no Kuni' (Land of Propriety), symbolizing the nation's spirit of courtesy and respect. Heavily influenced by Chinese paifang architecture, it integrates Ryukyu's signature red-tiled eaves and delicate carvings, exhibiting immensely high historical and artistic value. It is the most popular spot for souvenir photos when visiting Shurijo Castle.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-1 Shuri Mawashi-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 3,
        "item": {
          "@type": "TouristAttraction",
          "name": "Tamaudun Mausoleum",
          "description": "⭐ 4.3 stars | Built in 1501 by King Sho Shin of the Second Sho Dynasty of the Ryukyu Kingdom, Tamaudun is a grand royal mausoleum designated as a UNESCO World Heritage Site. Constructed entirely of Ryukyuan limestone, this massive stone complex simulates the layout of the Shurijo Castle palace, divided into central, eastern, and western chambers, with intricately carved and mystical stone lions guarding the entrance. The grounds also feature an underground museum displaying unearthed funerary urns and rare artifacts, offering an excellent perspective on Ryukyuan royal burial customs and stone masonry craft.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-3 Shuri Kinjo-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 4,
        "item": {
          "@type": "TouristAttraction",
          "name": "Shikinaen Garden",
          "description": "⭐ 4.4 stars | Built in 1799, Shikinaen Garden served as a royal villa for the Ryukyu kings and a guesthouse for entertaining Chinese imperial envoys (Sapposhi). It is a UNESCO World Heritage Site featuring a stroll-style garden design that ingeniously blends Chinese Jiangnan-style stone bridges and hexagonal pavilions with Japanese hill-and-pond landscaping, while extensively incorporating local Ryukyuan limestone and red-tiled structures. Strolling along the lakeside wooden boardwalks and between rustic red-tiled royal halls, visitors can experience serene seasonal landscapes and the unique refined leisure style of Ryukyuan royalty.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "421-7 Maaji, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 5,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naminoue Shrine",
          "description": "⭐ 4.5 stars | Naminoue Shrine holds the highest rank among the Eight Shrines of Ryukyu and has been a sacred place since ancient times for praying for safe voyages, bountiful harvests, and national prosperity. Built atop a massive coral reef cliff facing the East China Sea, the shrine's vermilion main hall creates a striking and stunning contrast with the azure ocean below. Visitors can pray for blessings and purchase protective charms (omamori), or gaze up at the majestic shrine perched on the cliff from nearby Naminoue Beach, experiencing Okinawa's unique blend of natural beauty and spiritual heritage.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-25-11 Wakasa, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 6,
        "item": {
          "@type": "TouristAttraction",
          "name": "Fukushuen Garden",
          "description": "⭐ 4.3 stars | Located in the Kume district of Naha City, Fukushuen Garden was built in 1992 to commemorate the 10th anniversary of the sister-city partnership between Naha and Fuzhou, China. Historically, Kume was a settlement for Chinese immigrants (the 36 Families of Fujian). Fukushuen adopts traditional Fujian garden architecture, using timber and stone sourced directly from Fuzhou and constructed under the guidance of Fuzhou artisans. The garden features miniature landscapes representing Fuzhou's iconic 'Three Mountains, Two Pagodas, and One River', waterfalls, pavilions, and carved stone arch bridges, exhibiting an elegant Chinese garden aesthetic.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2-29-19 Kume, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 7,
        "item": {
          "@type": "TouristAttraction",
          "name": "Kinjo-cho Stone-paved Path",
          "description": "⭐ 4.4 stars | The Kinjo-cho Stone-paved Path is a preserved section of the historic Madama-michi road that connected Shurijo Castle to southern regions during the ancient Ryukyu Kingdom, built in the 16th century under King Sho Shin. Spanning roughly 300 meters, this steep path paved with Ryukyuan limestone has acquired a soft, weathered patina over centuries. Rustic red-tiled traditional residences and stone walls line both sides. Along the way stands a sacred Bishop Wood tree over 300 years old. Strolling here feels like stepping back in time to experience old Naha's quiet and nostalgic Ryukyuan charm.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2-Chome Shuri Kinjo-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 8,
        "item": {
          "@type": "TouristAttraction",
          "name": "Sogenji Temple Stone Gate",
          "description": "⭐ 4.1 stars | Sogenji Temple was the state royal temple for the monarchs of the Second Sho Dynasty of the Ryukyu Kingdom, originally built in the 15th century during the reign of King Sho Shin. Although the main wooden temple structure was destroyed during the Battle of Okinawa in WWII, the grand triple-arched stone gate and surrounding Ryukyuan limestone walls miraculously survived and are designated as a National Important Cultural Property of Japan. The stone gate demonstrates exquisite Ryukyuan arch masonry, and the lush banyan trees with sprawling roots inside the grounds evoke a peaceful, timeless historical atmosphere.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-11-1 Tomari, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 9,
        "item": {
          "@type": "TouristAttraction",
          "name": "Okinawa Prefectural Museum & Art Museum (Okimu)",
          "description": "⭐ 4.3 stars | Also known as Okimu, this is the largest comprehensive cultural facility in Okinawa Prefecture. The building's exterior blends Ryukyuan castle wall styles with modern minimalism, constructed using native Ryukyu limestone. The museum section provides detailed exhibits on Okinawa's nature, history, and folklore from the Ryukyu Kingdom period, through the U.S. administration era, up to modern times. The art museum section showcases modern and contemporary works by artists with deep ties to Okinawa. Featuring hands-on interactive rooms and a unique cultural souvenir shop, it is a must-visit destination for exploring Ryukyuan culture.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-1-1 Ameku, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 10,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naha City Historical Museum",
          "description": "⭐ 4.1 stars | Conveniently located on the 4th floor of the Palette Kumoji department store at the start of Kokusai-dori in downtown Naha. The museum houses precious artifacts from the Sho family, the royal dynasty of the Ryukyu Kingdom, including National Treasures such as royal attire, lacquerware, paintings, and ancient documents. Through refined displays and multimedia presentations, visitors can quickly understand Naha's history as it evolved from an ancient trading port into a vibrant modern city. It is a fantastic cultural stop while shopping.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "4F, 1-1-1 Kumoji, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 11,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naha Municipal Tsuboya Pottery Museum",
          "description": "⭐ 4.2 stars | Situated at the entrance of nostalgic Tsuboya Yachimun Street, this museum is dedicated to the history and craft of 'Tsuboya-yaki,' Okinawa's traditional pottery. The collection features rustic, exquisite ceramic masterpieces dating back to the Ryukyu Kingdom era, replicas of ancient climbing kilns, and pottery tools, alongside documentary films showing master artisans at work. The permanent exhibition fully presents the evolution of Okinawan ceramics, and audio guides are available on-site for visitors strolling down Tsuboya Street to deeply appreciate local craft aesthetics.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-9-32 Tsuboya, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 12,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naha City Traditional Arts and Crafts Center",
          "description": "⭐ 4.0 stars | Located on the 2nd floor of the Tenbusu Naha building in the heart of Kokusai-dori, this center combines exhibitions, hands-on workshops, and retail. It showcases Naha's five major traditional crafts: Bingata dyed textiles, Tsuboya pottery, Ryukyu lacquerware, Ryukyu glass, and Shuri-ori weaving. Visitors can admire masterworks up close and book hands-on DIY workshops such as glassblowing, Bingata dyeing, or pottery making to craft their own unique Okinawan souvenir.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2F, 3-2-10 Makishi, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 13,
        "item": {
          "@type": "TouristAttraction",
          "name": "Tsushima-maru Memorial Museum",
          "description": "⭐ 4.4 stars | Located near Naminoue Shrine and Naminoue Beach, this memorial museum honors WWII history. It solemnly documents the tragic sinking of the Tsushima-maru in 1944, an evacuation ship carrying hundreds of schoolchildren attacked by a submarine. Exhibiting personal belongings of victims, classroom replicas, survivor video testimonials, and rare photographs, the atmosphere is quiet and reverent. Dedicated to conveying the priceless value of peace, it is a deeply educational and humanistic historic site.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-1-1 Wakasa, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 14,
        "item": {
          "@type": "TouristAttraction",
          "name": "Kainan Catholic Cathedral",
          "description": "⭐ 4.5 stars | Located in the Kainan district of Naha, this is the cathedral of the Roman Catholic Diocese of Naha. Built during the post-war reconstruction era, the architecture blends Western Gothic Catholic elements with local storm-resistant Okinawan design. The sanctuary interior features high, elegant ceilings, colorful stained glass, and a solemn main altar. When sunlight filters through the stained glass, it creates a serene and sacred atmosphere, making it a landmark church rich in both faith and architectural art.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-22-12 Izumizaki, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 15,
        "item": {
          "@type": "TouristAttraction",
          "name": "Shuri Ryusen Cultural Art Center",
          "description": "⭐ 4.4 stars | Located at the foot of historic Shuri Castle, this cultural center combines a textile art museum with the preservation of traditional craft traditions. It pioneered 'Coral Dyeing,' a unique technique using natural coral fossil cross-sections that symbolize happiness and prosperity. The first floor displays vintage dyeing tools and valuable craft antiques, while the second and third floors host workshops and hands-on DIY areas, drawing arts-and-crafts enthusiasts to experience the unique charm of Okinawan art.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-54 Shuriyamakawa-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 16,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naha Church of United Church of Christ in Japan",
          "description": "⭐ 4.3 stars | Located in the bustling Kumoji commercial district of Naha, this church boasts over a century of missionary history and is one of Okinawa's most representative Protestant churches. Rebuilt after WWII, its exterior features sleek, minimalist lines blending modern architecture with local stone elements, while the sanctuary interior offers a warm, peaceful sanctuary. Serving as both a gathering space for local believers and a quiet urban retreat, its geometric aesthetics and rich history attract architecture and history enthusiasts alike.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2-16-1 Kumoji, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 17,
        "item": {
          "@type": "TouristAttraction",
          "name": "Shurijo Castle Park",
          "description": "⭐ 4.4 stars | Perched on the hills of eastern Naha, Shurijo Castle Park was the political and cultural heart of the Ryukyu Kingdom. Surrounded by magnificent Ryukyuan limestone walls, the park preserves historical sites such as Kankaimon and Shureimon gates, alongside lush greenery and precious tropical flora. From the park's elevated observation deck, you can enjoy sweeping panoramic views of downtown Naha and the sparkling blue ocean—a must-visit destination combining rich history with stunning natural scenery.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "3-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 18,
        "item": {
          "@type": "TouristAttraction",
          "name": "Fukushuen Garden",
          "description": "⭐ 4.3 stars | Fukushuen Garden is a traditional Chinese garden built to commemorate the 10th anniversary of sister-city relations between Naha and Fuzhou, China. Crafted using timber and stone imported directly from Fuzhou, it blends the Jiangnan landscape garden styles of the Ming and Qing dynasties. Featuring charming bridges, trickling streams, dramatic rock formations, a three-tiered waterfall, and quaint pavilions, the garden blooms with seasonal flowers year-round. Strolling along the lakeside paths offers a tranquil escape wrapped in classical Oriental aesthetics.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "2-29-19 Kume, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 19,
        "item": {
          "@type": "TouristAttraction",
          "name": "Yogi Park",
          "description": "⭐ 4.1 stars | Located in central Naha near Kokusai Dori, Yogi Park is an urban oasis and one of Okinawa's most iconic cherry blossom viewing spots. Hundreds of Kanhizakura (Taiwan cherry trees) line the riverbanks; during peak bloom in mid-February, the entire park is wrapped in a vibrant sea of deep pink, accompanied by a lively Cherry Blossom Festival. With wide palm-lined paths, expansive lawns, and play areas for kids, it's a popular spot for both locals and tourists to enjoy sunny outdoor leisure.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-1 Yogi, Naha City, Okinawa Prefecture"
          }
        }
      },
      {
        "@type": "ListItem",
        "position": 20,
        "item": {
          "@type": "TouristAttraction",
          "name": "Naminoue Beach & Park",
          "description": "⭐ 4.2 stars | As the only natural beach in downtown Naha, Naminoue Beach sits right below the dramatic cliffside Naminoue Shrine. Featuring crystal-clear waters, the adjacent seaside park offers beautifully landscaped walking paths and elevated viewing platforms. Here, visitors can marvel at the striking cliffside temple views while relaxing on the sand, taking in the ocean breeze and breathtaking sunsets right in the heart of the city.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "1-25-11 Wakasa, Naha City, Okinawa Prefecture"
          }
        }

    <script>
        const dbData = {"chatan_american": {"categories": {"cat_1": {"items": [{"address": "9-1 Mihama, Chatan, Nakagami District, Okinawa 904-0115", "feature": "\u2b50 4.4 stars | Depot Island is the most iconic architectural complex in Chatan\u0027s American Village, offering a perfect blend of retro American nostalgia and local Okinawan culture. Made up of colorful, uniquely designed exotic buildings, wandering through feels like strolling down the US West Coast or a charming European town. Inside, you\u0027ll find US military vintage clothing shops, original handmade accessory boutiques, Okinawan cuisine, and scenic cafes. Packed with retro graffiti walls, American street signs, and distinctive sculptures, it is a must-visit spot for photography and architectural appreciation in Chatan.", "name": "Depot Island Architectural Complex (American Village)", "transport": "From Naha Bus Terminal, take bus No. 20, 28, or 120 and get off at \u0027Kuwae\u0027 or \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, then walk for about 5 minutes."}, {"address": "Yoshihara, Chatan, Nakagami District, Okinawa 904-0102", "feature": "\u2b50 4.0 stars | The Chatan Castle Ruins are an important Ryukyu Kingdom castle site (Gusuku) perched on a high hill in Chatan, offering sweeping views of the town and the East China Sea. Historical research indicates the castle was built around the 14th century using Okinawa\u0027s unique Ryukyuan limestone, featuring beautifully curved masonry technique. Although much of the wall was destroyed during World War II, recent archaeological excavations and restoration efforts have preserved precious foundation stones and ruins, making it a cultural treasure for exploring Ryukyu Kingdom history and ancient defensive architecture.", "name": "Chatan Castle Ruins", "transport": "Driving is recommended (approx. 45 minutes from Naha Airport via Route 58). Alternatively, take bus No. 53, get off at \u0027Yoshihara\u0027 stop, and walk for about 10 minutes."}, {"address": "2-21 Chatan, Chatan, Nakagami District, Okinawa 904-0116", "feature": "\u2b50 4.3 stars | Located within Araha Beach Park, the wooden sailing ship landmark \u0027Megami\u0027 and its historical monument commemorate a touching international rescue story. In 1840, the British merchant ship \u0027India\u0027 sank in a typhoon off the coast of Chatan. Local residents courageously braved the storm to rescue the crew and offered them warm hospitality. To honor this historic event showcasing the Okinawan spirit of hospitality (Ichariba Chode\u2014\u0027once we meet, we are brothers\u0027), the park features a life-sized wooden ship playground and memorial stele, combining historical education with fun waterfront play for children.", "name": "Araha Park Indian Ship Monument \u0026 Megami Ship", "transport": "From downtown Naha, take bus No. 28 or 120 and get off at \u0027Hamby Chushajo-mae\u0027 stop, then walk about 5 minutes."}, {"address": "1-1 Chatan, Chatan, Nakagami District, Okinawa 904-0116", "feature": "\u2b50 4.1 stars | Chatan Shrine is a historic spiritual center deeply rooted in the daily lives of local residents. Tucked away in a tranquil environment, it offers a peaceful contrast to the bustling American Village nearby. Dedicated to deities protecting maritime safety, household harmony, and abundant harvests, its architecture beautifully blends traditional Ryukyuan red-tiled roofs with classic Japanese torii gate design. During the Japanese New Year and local festivals, locals gather here to pray, making it a wonderful place to experience Chatan\u0027s folk faith and cultural heritage.", "name": "Chatan Shrine", "transport": "Take bus No. 28, 29, or 120 and get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, then walk for about 8 minutes."}, {"address": "Sunabe, Chatan, Nakagami District, Okinawa 904-0112", "feature": "\u2b50 3.8 stars | The Sunabe Shell Mound is a prehistoric site of significant archaeological value, dating back to Okinawa\u0027s Jomon period (Shell Mound era). Excavations have unearthed pottery, stone tools, shell ornaments, and marine shells and fish bones left behind by ancient inhabitants, proving that a thriving hunter-gatherer community existed along Chatan\u0027s coast thousands of years ago. While most artifacts have been moved to museums, interpretive plaques and preserved natural rock formations allow visitors to imagine the lives of ancient Ryukyu ancestors living in harmony with the sea.", "name": "Sunabe Shell Mound Historical Site", "transport": "Take bus No. 28, get off at \u0027Sunabe\u0027 stop, and walk west toward the coast for about 10 minutes."}, {"address": "1-Chome Chatan, Chatan, Nakagami District, Okinawa 904-0116", "feature": "\u2b50 3.9 stars | Located near the Hamby Town shopping area in Chatan, this historic monument bears witness to post-WWII military history during the US administration of Okinawa. Following WWII, the US military established \u0027Hamby Airfield\u0027 here for military helicopters and light aircraft. After the land was returned to Japan and local authorities in 1981, it was redeveloped into a bustling commercial and residential neighborhood. This monument documents the unique transformation from a military base to a vibrant modern urban district, serving as a key historical landmark.", "name": "Former Hamby Airfield Historical Monument", "transport": "Take bus No. 28, get off at \u0027Hamby Chushajo-mae\u0027 stop, and walk for about 3 minutes."}, {"address": "718-28 Yoshihara, Chatan, Nakagami District, Okinawa 904-0102", "feature": "\u2b50 4.3 stars | Perched on a high hill in Chatan, Yagaru Park is one of the town\u0027s most iconic lookout points and historic village sites. Before World War II, the Yagaru area was a traditional Okinawan farming village. Today, the park preserves several sacred prayer sites (Utaki) and historical stone monuments that tell the stories of its past. From the observation deck, visitors can take in panoramic views of American Village, the coastline, and the blue Pacific Ocean\u2014with city lights sparkling magically at sunset, seamlessly blending historical memory with modern beauty.", "name": "Yagaru Park \u0026 Historic Village Site", "transport": "About an 8-minute drive from American Village, or take bus No. 53, get off at \u0027Yagaru Iriguchi\u0027 stop, and walk uphill for about 12 minutes."}, {"address": "1-2 Sunabe, Chatan, Nakagami District, Okinawa 904-0112", "feature": "\u2b50 4.2 stars | Situated near Miyagi Coast in Sunabe, Baba Park features expansive lawns and ocean views while serving as a poignant historical landmark dedicated to peace. A memorial stele stands in the park to honor local residents and soldiers lost during the Battle of Okinawa in World War II, promoting the precious value of peace. Post-war seawall structures and historical panels line the coast, blending beautiful ocean scenery with solemn historical reflection\u2014an important site for experiencing Chatan\u0027s humanistic care and reflective history.", "name": "Baba Park War Memorial \u0026 Coastal Heritage", "transport": "Take bus No. 28, get off at \u0027Sunabe Iriguchi\u0027 stop, and walk for about 7 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "AKARA 2F, 9-20 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | A renowned private museum located within the AKARA complex in American Village, dedicated to displaying the magnificent works of Bokunen Naka, a master Ryukyuan woodblock print artist and national treasure. The museum\u0027s exterior features a whimsical Ryukyu red-tile roof reminiscent of rolling waves, while the interior showcases grand, vividly colored woodcuts that capture Okinawa\u0027s vibrant nature and ocean legends. The museum\u0027s observatory offers panoramic views of the Chatan coastline, making it a must-visit destination for experiencing Okinawan contemporary art and architectural aesthetics.", "name": "Bokunen Museum", "transport": "From Naha Airport, take bus No. 120 to \u0027Gun Byoin-mae\u0027 (U.S. Naval Hospital) stop, then walk about 10 minutes."}, {"address": "8-22 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.6 stars | An immensely popular pure-white chapel situated on the Mihama American Village coastline in Chatan, boasting breathtaking near-270-degree views of the azure ocean. Designed in aquamarine and pristine white tones, the interior features a soaring glass virgin road and a transparent altar, allowing couples and visitors to experience ultimate romance amid gentle sea breezes and soothing waves. As the sun sets, golden evening rays illuminate the chapel, creating a breathtakingly beautiful scene. It is one of Chatan\u0027s premier dream wedding destinations and photography landmarks.", "name": "Cent Legenda Okinawa", "transport": "About a 45-minute drive from Naha Airport; or take bus No. 20 or 120 to \u0027Kuwae\u0027 stop and walk for 12 minutes."}, {"address": "9-22 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | An exquisite modern chapel along the Mihama American Village coastline, designed around the concept of a \u0027Journey of Light and Ocean.\u0027 The architecture skillfully captures natural light, featuring a marble virgin road that leads directly to floor-to-ceiling glass windows facing Chatan Sunset Beach, creating the dreamlike illusion of a wedding floating on the sea. Located next to the Mihama shopping area and coastal promenade, its striking modern exterior is a stunning piece of architectural art not to be missed during a coastal stroll.", "name": "Voyage De Lumiere Chatan Resort", "transport": "From Naha Airport, take the Airport Limousine bus directly to \u0027Chatan Seaside Condominium Hotel\u0027 stop, then walk about 3 minutes."}, {"address": "467-1 Kuwae, Chatan, Nakagami District, Okinawa (Inside Chatan Nirai Center)", "feature": "\u2b50 4.1 stars | A rich cultural and historical museum located inside the Chatan Nirai Center, providing the best venue for an in-depth understanding of Chatan\u0027s evolution over time. The museum houses a vast collection of Jomon-period pottery excavated from local archaeological sites, farming and fishing tools from the Ryukyu Kingdom era, everyday folk artifacts, as well as precious historical documents and photographs from the Battle of Okinawa during WWII. Informative and highly educational, it offers history buffs an enriching intellectual retreat right next to the bustling shopping district.", "name": "Chatan Historical Folk Museum", "transport": "From Naha Airport, take bus No. 28 or 29 to \u0027Chatan Cho Yakuba-mae\u0027 (Chatan Town Hall) stop, then walk about 5 minutes."}, {"address": "467-1 Kuwae, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.0 stars | An exhibition space located within Chatan\u0027s Lifelong Learning Center, regularly hosting art exhibitions by local artists, traditional Ryukyuan craft displays, pottery showcases, and photography exhibits. The gallery offers a quiet and elegant atmosphere that reflects Chatan\u0027s vibrant community art culture. It also frequently hosts cross-cultural art exhibitions celebrating connections with the local US Military base community, perfectly exemplifying Chatan\u0027s unique blend of American and Ryukyuan cultures\u2014an ideal spot for travelers looking to savor local artistic flair.", "name": "Chatan Nirai Center Cultural Gallery", "transport": "By car, drive along Route 58 and turn at the Kuwae Intersection; large free parking available on-site."}, {"address": "9-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | An open-air art haven stretching throughout the Depot Island area, turning Mihama American Village into a vibrant, sprawling open-air contemporary museum. Street walls are adorned with vintage American-style graffiti murals, angel wing photo spots, and creative metal art installations. Tucked away in the alleys, boutique craft galleries showcase local Okinawan original handicrafts and trendy art, making it an ideal haven for young travelers and art lovers seeking photo ops and creative inspiration.", "name": "Depot Island Art Wall and Galleries", "transport": "From Naha Bus Terminal, take bus No. 28 or 120 to \u0027Gun Byoin-mae\u0027 (U.S. Naval Hospital) stop, then walk about 7 minutes to enter American Village."}, {"address": "1-456 Miyagi, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | A historic church located near Chatan\u0027s Sunabe Coast, showcasing a simple yet tranquil architectural style. Catering to Chatan\u0027s diverse international community and U.S. military families, the church offers bilingual worship services in Japanese and English, reflecting a warm and inclusive multicultural environment. Surrounded by lush greenery, its charming and elegant exterior provides a serene sanctuary of peace amidst the vibrant bustle of the Chatan coast.", "name": "Chatan Baptist Church", "transport": "About a 7-minute drive from Mihama American Village; or take bus No. 43 to \u0027Ihei\u0027 stop and walk for about 10 minutes."}, {"address": "729-1 Yoshihara, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.1 stars | A traditional local community church situated in the central district of Chatan Town, featuring clean, solemn lines with a distinctive Okinawan residential charm. Dedicated to serving the community through local cultural activities and international cultural exchange, it exudes a warm and peaceful ambiance. Far removed from the hustle and bustle of the Mihama commercial district, it offers visitors a tranquil window into the serene daily life and quiet faith of the local community.", "name": "Okinawa Chatan Bible Church", "transport": "About a 50-minute drive north from Naha Airport via Route 58."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "2-chome Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Located in the heart of American Village, Sunset Beach is one of Chatan\u0027s most iconic natural landmarks. Featuring pristine white sands and calm, shallow waters equipped with excellent safety facilities and lifeguards, it is ideal for families with children. As the sun sets, the sky blushes with vibrant gradients of golden yellow and soft purple, creating a breathtaking contrast with the offshore breakwaters and the iconic Ferris wheel. The beach is dotted with open-air bars and lounge seats where visitors can order a refreshing cold drink, listen to the gentle waves, and take in a view recognized as one of Okinawa\u0027s top three sunset spots.", "name": "Sunset Beach", "transport": "From Naha Bus Terminal, take bus No. 20, 28, or 120 and get off at \u0027Gunbyoin-mae\u0027 (Military Hospital) stop, then walk about 7 minutes."}, {"address": "2-21 Chatan, Chatan Town, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Araha Park is a comprehensive coastal park featuring a vast white sand beach and abundant recreational facilities. The main attraction is a giant wooden pirate ship playground modeled after the 19th-century British shipwreck \u0027Indian Oak\u0027, offering endless fun for kids to climb and slide. A well-paved boardwalk and basketball courts line the hundreds-of-meters-long coastline, making it a favorite spot for locals and US military families. With crystal-clear waters, it offers exciting water sports like jet skiing and banana boat rides, making it a perfect spot for recreation, relaxation, and family fun.", "name": "Araha Park \u0026 Araha Beach", "transport": "Drive north from Naha city center along Route 58 for about 35 minutes; or take bus No. 63 to \u0027Hamby Chuten\u0027 stop and walk about 5 minutes."}, {"address": "Miyagi, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | Miyagi Coast (also known as Sunabe Seawall) is a renowned diving and surfing hotspot in Okinawa, as well as one of the island\u0027s most romantic sunset spots. A multi-kilometer promenade stretches along the sea wall, decorated with colorful, exotic murals. Thanks to its proximity to the US military base, the coastline is lined with unique oceanfront cafes, craft beer bars, and American-style eateries. In the evening, strolling along the seawall while watching surfers ride the waves amidst gentle sea breezes and golden twilight creates an incredibly laid-back, cozy vibe.", "name": "Miyagi Coast", "transport": "Take bus No. 28 or 29 to \u0027Ihei\u0027 or \u0027Mizukama\u0027 stop, then walk about 10 to 15 minutes to reach the coast."}, {"address": "1-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Chatan Park is a spacious, multi-purpose recreational park adjacent to American Village and Sunset Beach. Lush with greenery, the park houses sports grounds, a baseball stadium (spring training home of the Chunichi Dragons), and tree-lined walking trails. It\u0027s a top choice for locals to jog and walk, while its vast green lawns frequently host outdoor markets and music events. Visitors can relax on the spacious lawns and then easily stroll over to the adjacent beach or commercial area for shopping, soaking in the perfect harmony of nature and urban resort vibes.", "name": "Chatan Park", "transport": "Take bus No. 20, 28, or 120 to \u0027Kuae\u0027 or \u0027Mihama American Village Minamiguchi\u0027 stop, then walk about 5 minutes."}, {"address": "1-4 Aza Sunabe, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Located at the northern seaside of Chatan, Baba Park is a local neighborhood park offering fantastic scenic views. It features expansive green lawns and children\u0027s play equipment, with the highlight being its direct connection to a rocky shore and blue ocean vistas. Quieter and more peaceful compared to the bustling beaches near American Village, it\u0027s a great hidden spot to escape the crowds and enjoy the sea. Guardrails and paths along the shore make it ideal for evening walks, ocean listening, and sunset viewing, with many local families spreading picnic blankets to enjoy a lazy afternoon.", "name": "Baba Park", "transport": "Take bus No. 28 to \u0027Sunabe\u0027 stop, then walk about 8 minutes."}, {"address": "Sunabe, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.1 stars | Located along the extended coastline of Miyagi Coast, Sunabe Seaside Park is a natural coastal park loved by water sports enthusiasts. The surrounding waters boast rich soft coral reefs and colorful tropical fish, making it a famous spot on Okinawa\u0027s main island for shore diving and scuba instruction. Equipped with simple rest gazebos and shower facilities, it draws locals in the evening for exercise, dog walking, or catching the sunset. Sitting on the seawall watching the sun dip into the East China Sea offers a deep taste of Okinawa\u0027s relaxed coastal rhythm.", "name": "Sunabe Seaside Park", "transport": "About an 8-minute drive from American Village; or take bus No. 28 or 29 to \u0027Sunabe Iriguchi\u0027 stop and walk about 12 minutes."}, {"address": "115 Hamagawa, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.0 stars | Situated in the Hamagawa area of Chatan, Hamagawa Park is close to Hamagawa Fishing Port and Miyagi Coast. Shaded by lush trees, this park offers a small playground, rest pavilions, and benches, creating a peaceful and cozy environment. A small river flows past the park into the sea, forming a rich estuarine ecosystem. Free from heavy commercialization, it showcases the authentic everyday life of Okinawa, making it a wonderful quick rest spot for travelers seeking simple natural scenery and quiet community atmosphere.", "name": "Hamagawa Park", "transport": "Take bus No. 28 to \u0027Hamagawa\u0027 stop, then walk about 6 minutes."}, {"address": "9-1 Mihama, Chatan, Nakagami District, Okinawa", "feature": "\u2b50 4.5 stars | The Depot Island Boardwalk is a scenic wooden walkway connecting the Depot Island shopping area with the sparkling sea. Extending along the coastline, the boardwalk is lined with retro American-style and tropical plants, wooden benches, and charming photo spots. It not only offers up-close views of crashing ocean waves but also serves as an outstanding vantage point for watching the sunset dip below the horizon. As night falls, warm, romantic light installations illuminate the path, creating an enchanting exotic coastal evening view.", "name": "Depot Island Boardwalk", "transport": "From Naha city center, take bus No. 20, 28, or 120 to \u0027Mihama American Village Iriguchi\u0027 stop, then walk about 5 minutes to reach the boardwalk."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "9-1 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located in the heart of Okinawa\u0027s American Village, this coastal wooden boardwalk is lined with colorful American-style buildings and unique shops. As evening approaches, the sunset glows over the sea, combined with the illuminated retro shopping arcade, creating breathtaking scenery. It is one of Okinawa\u0027s most popular oceanfront boardwalks and photography spots.", "name": "Depot Island Boardwalk", "transport": "Take Bus No. 120 or the Airport Limousine Bus from Naha Airport, get off at \u0027Mihama American Village Entrance\u0027, and walk for about 7 minutes."}, {"address": "2 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A popular natural beach right next to American Village, famous for its breathtaking views of the East China Sea sunset. Featuring well-equipped beach paths and resting areas, its crystal-clear waters and stretching white sand attract countless visitors to swim and capture dreamlike photos set against the sunset and waves.", "name": "Mihama Sunset Beach", "transport": "About a 40-minute drive north from downtown Naha via Route 58."}, {"address": "Inside Depot Island, 9-1 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | The Depot Island area within American Village is packed with creative, American retro-style street graffiti, featuring various artistic murals alongside officially licensed Pikachu and Pok\u00e9mon wall art (Pok\u00e9genic). Around every corner lies a delightful photo backdrop, making it a must-visit spot for young travelers and influencers alike.", "name": "Depot Island Wall Art \u0026 Pok\u00e9genic Spots", "transport": "About a 3-minute walk from the Chatan Tourist Information Center to reach the graffiti area inside the complex."}, {"address": "34-3 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located in Depot Central, this red-brick vintage clock tower boasts a unique design brimming with exotic nostalgia. Designed to resemble an overseas street corner with open-air balconies and foreign street signs, photos taken here make you feel like you\u0027ve stepped into a European or American town. It is one of American Village\u0027s most iconic landmarks.", "name": "Depot Central Clock Tower", "transport": "Located in the center of American Village, about a 5-minute walk from the free parking lot."}, {"address": "1F Depot Island Seaside, 9-21 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A specialty store filled with festive Christmas cheer 365 days a year. Giant nutcracker soldiers and Santa Claus displays stand at the entrance, while the entire building is adorned with sparkling lights and exquisite holiday decorations. At night, it turns into a magical wonderland, attracting countless visitors to snap photos.", "name": "Christmas Land Okinawa", "transport": "Located on the 1st floor of Depot Island Seaside, easily accessible by walking along the coastal boardwalk."}, {"address": "2-21 Chatan, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located inside Araha Park south of Chatan Town, this spot features a full-sized pirate ship play structure modeled after the historical shipwreck \u0027Indian Oak\u0027. The blue sky, clear waters, and white sand combined with the magnificent pirate ship setting create adventurous and playful photos, making it a must-visit for families and photo enthusiasts.", "name": "Araha Beach \u0026 Indian Oak Pirate Ship", "transport": "About a 45-minute drive from Naha Airport; or take Bus No. 63 to \u0027Hamby Town-mae\u0027 bus stop and walk for about 5 minutes."}, {"address": "1F Depot Central, 34-3 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | This hugely popular American industrial-style cafe is situated right on the Chatan waterfront. Offering high-quality pour-over coffee and American desserts, its outdoor ocean-view seating area lets you enjoy breathtaking views of the sea and sunset. The cool, rugged industrial interior paired with the seamless view of ocean and sky creates ultra-stylish photos.", "name": "ZHYVAGO COFFEE ROASTERS", "transport": "Located on the ocean side of Depot Central 1st floor, about a 4-minute walk from Sunset Beach."}, {"address": "9-20 Mihama, Chatan Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Designed by famous Okinawan printmaker Bokunen Naka, this uniquely shaped building features stacked wavy organic curves, overflowing with local Okinawan artistic flair and an avant-garde feel. Its red-tile roof and fluid exterior walls stand out vividly against the blue sky, serving as a distinct cultural and artistic landmark in American Village.", "name": "Akara Gallery \u0026 Building", "transport": "About a 5-minute walk from the main American Village tourist bus stop."}], "name": "Popular Photo Spots"}}, "name": "Chatan Area and American Village"}, "kouri_yanbaru": {"categories": {"cat_1": {"items": [{"address": "5101 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A UNESCO World Heritage Site, this was the residence of the King of Hokuzan during the Sanzan period of the Ryukyu Kingdom in the 14th century. Its sturdy Ryukyuan limestone walls meander along the mountain contours for 1.5 kilometers, earning it a reputation as an \u0027impregnable fortress.\u0027 In early spring, it is one of the earliest cherry blossom spots in Okinawa. Standing atop the walls offers magnificent vistas of the East China Sea and Kouri Island, steeped in rich history and grandeur.", "name": "Nakijin Castle Ruins", "transport": "About a 40-minute drive from Kyoda IC; or take the Yanbaru Express Bus to \u0027Nakijincojo-mae\u0027 stop and walk for about 15 minutes."}, {"address": "Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Perched on a high point in northern Kouri Island, this historic navigational aid has guided vessels in surrounding waters since its construction during the Showa era. The pure white tower stands atop a cliff framed by azure waters and lush greenery. Although the interior is closed to the public, the surrounding area features well-maintained observation platforms and walking trails, making it a fantastic historic landmark for overlooking the island\u0027s coastal scenery and breathtaking sunset views.", "name": "Kouri Lighthouse", "transport": "About an 8-minute drive from Kouri Bridge to reach the lighthouse area at the northern end of the island."}, {"address": "157 Oganeku, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Built in 1925 (Taisho 14), this is the oldest surviving reinforced concrete building in Okinawa Prefecture and is registered as a National Tangible Cultural Property of Japan. Having withstood the bombardment of WWII\u0027s Battle of Okinawa and countless powerful typhoons, this historic edifice showcases the historical value of modern Ryukyuan architectural evolution, boasting a unique blend of Western classical and modern aesthetics.", "name": "Old Ogimi Village Hall", "transport": "About a 35-minute drive north along Route 58 from Kyoda IC."}, {"address": "Hedo, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Standing atop the cliff at Cape Hedo, the northernmost tip of Okinawa Island, this significant historic monument commemorates Okinawa\u0027s reversion to Japan in 1972 following US administration. During the US rule, local residents often gathered here to light bonfires facing Kagoshima and mainland Japan across the ocean, calling for reunification. Featuring dramatic terrain and crashing waves, it holds profound modern historical significance alongside striking coastal geological views.", "name": "Hedo Point Okinawa Reversion Monument", "transport": "About a 70-minute drive north along Route 58 from Kyoda IC."}, {"address": "Kamiunten, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Unten Port has historically served as a vital natural harbor and strategic military outpost in northern Okinawa since the Ryukyu Kingdom era. Beside the port stands the monument commemorating Minamoto no Tametomo\u0027s landing, recording the legendary tale of how Tametomo drifted to Ryukyu after the Hogen Rebellion in Japan and fathered Shunten, the first king of Ryukyu. The ancient port remnants and rich historical heritage evoke a deep sense of nostalgia.", "name": "Unten Port Minamoto no Tametomo Monument", "transport": "About a 10-minute drive from central Nakijin Village to the Unten Port area."}, {"address": "Kouri (Next to Chigunu Beach), Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A natural sea-eroded limestone cave located next to Chigunu Beach on Kouri Island, revered in Ryukyuan creation myths as the birthplace of the Okinawan Adam and Eve. The name Kouri Island itself evolved from \u0027Kuishima\u0027 (Island of Love). Imbued with ancient Shinto and creation legends, this cave is a mystical landmark rich in historical and cultural heritage.", "name": "Chinuntia Cave", "transport": "After crossing Kouri Bridge onto the island, walk about 3 minutes to reach the cave next to Chigunu Beach."}, {"address": "5511 Nago, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located within Nago Central Park, this 14th-century Ryukyuan mountain castle site was once a fortress of the Hokuzan forces affiliated with Nakijin Castle. The ruins stretch along Mount Nago; while most stone walls have yielded to time, ancient stone steps and sacred Utaki worship sites remain. Today, it is one of Okinawa\u0027s most iconic cherry blossom viewing spots, attracting countless visitors every spring when thousands of Taiwan cherries bloom.", "name": "Nago Castle Ruins", "transport": "About a 20-minute drive from Kyoda IC; or take a bus from Nago Bus Terminal to \u0027Nagoj\u014d Iriguchi\u0027 stop and walk uphill."}, {"address": "Nerome, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A traditional Ryukyuan settlement in the Nerome area of Ogimi Village, beautifully preserving ancient Ryukyuan coral limestone walls (Ishigami) and tall Fukugi tree windbreaks. Strolling through the village lanes offers an authentic glimpse into rural village life during the Ryukyu Kingdom era and the architectural wisdom used to withstand typhoons. It stands as a valuable cultural landscape and living legacy in the Yanbaru region.", "name": "Nerome Historic Village Stone Walls", "transport": "About a 30-minute drive from Kyoda IC, located inside Nerome village along Route 58."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located inside the Kouri Ocean Tower, this museum showcases a collection of over 10,000 rare and uniquely shaped shells from all over the world. Filled with a romantic and artistic ocean vibe, the exhibits feature everything from extremely rare fossilized shells to vibrant tropical sea snails. Beautifully designed, the exhibition weaves together the legend of Kouri Island\u0027s \u0027Heart Rock\u0027 with maritime culture, making it an unmissable cultural stop on Kouri Island.", "name": "Kouri Ocean Tower Shell Museum", "transport": "About a 90-minute drive from Naha Airport via the Okinawa Expressway and Kouri Bridge."}, {"address": "2786 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.7 stars | Perched on a high point on Kouri Island, Kouri Chura Church is an exquisitely romantic chapel surrounded by subtropical lush greenery and stunning views of Kouri Blue waters. Designed with expansive glass walls, it seamlessly blends sunlight, sky, and the deep blue sea. The interior aesthetics gracefully combine pure white tones with warm wood accents. Featuring private gardens and an observation deck, it is one of the Yanbaru region\u0027s most iconic pieces of contemporary church architecture.", "name": "Kouri Chura Church", "transport": "Cross the Kouri Bridge and follow the road signs for about 5 minutes by car."}, {"address": "51 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Located right next to the UNESCO World Heritage site \u0027Nakijin Castle Ruins,\u0027 this center displays historical artifacts from the Hokuzan Kingdom during the Sanzan period of Ryukyu history, everyday folk tools, and unique folk religious heritage from northern Okinawa\u0027s Yanbaru region. Through rich historical documents, excavated pottery, and traditional crafts, it offers an in-depth look at centuries of Nakijin\u0027s cultural evolution, making it an excellent venue to discover Yanbaru\u0027s rich heritage.", "name": "Nakijin History and Culture Center", "transport": "Take an express bus from Naha Airport to Nago Bus Terminal, then transfer to the Ryukyu Bus and get off at Nakijin-jo-seki-guchi stop, followed by a 10-minute walk."}, {"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Ocean Expo Park)", "feature": "\u2b50 4.4 stars | Situated inside Ocean Expo Park, this museum showcases the rich seafaring cultures of Oceania and the Ryukyu Islands. On display are full-scale traditional wooden sailing canoes and fishing gear, highlighting ancient navigation wisdom guided by stars and ocean currents. It also houses a high-definition planetarium featuring captivating audiovisual shows on the cosmos\u2014blending art and science to immerse visitors in the vast wonders of ocean and sky.", "name": "Ocean Culture Museum and Planetarium", "transport": "Take the Yanbaru Express Bus from Naha Airport and get off at the Kinenkoen-mae (Memorial Park) stop."}, {"address": "150 Kijoka, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Kijoka in Ogimi Village is the birthplace of Okinawa\u0027s traditional Bashofu (banana fiber cloth). This center serves as a vital facility dedicated to preserving and exhibiting Bashofu, an Important Intangible Cultural Property of Japan. It details the intricate process from cutting down banana trees and extracting fibers to dyeing and handweaving. Visitors can witness master artisans weaving live and admire exquisite Bashofu clothing and artwork steeped in traditional Okinawan craftsmanship.", "name": "Ogimi Bashofu Exhibition Center", "transport": "Drive north from Nago City along Route 58 for approximately 30 minutes."}, {"address": "263-1 Hiji, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in Kunigami Village, the Yanbaru Wildlife Conservation Center (Ufugi Nature Museum) is an educational nature center dedicated to the UNESCO World Natural Heritage site Yanbaru National Park. Interactive exhibits, preserved specimens, and ecological documentaries offer an in-depth introduction to rare endemic species found only here, such as the Yanbaru Rail and Okinawa Woodpecker. Combining ecological education with aesthetic displays, it allows visitors to truly discover the mysteries of the Yanbaru forest.", "name": "Yanbaru Wildlife Conservation Center Ufugi Nature Museum", "transport": "Drive north along Route 58 to Hiji in Kunigami Village, then follow the local signs into the country road to arrive."}, {"address": "1094-1 Hentona, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Tucked away in the lush forests of Yanbaru, this museum\u0027s structure and exhibits are crafted entirely from locally sourced Okinawan timber. It features hundreds of handcrafted wooden toys, artistic carvings, and large-scale woodwork installations. Wrapped in the warm scent of natural wood, both adults and children can experience the aesthetic connection between craft and nature, making it a unique cultural venue celebrating Yanbaru\u0027s rich forest heritage.", "name": "Okinawa Wood Toy Museum", "transport": "About a 2-hour drive from downtown Naha northbound along Route 58 toward Kunigami Village."}, {"address": "4-1-1 Onaka, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Serving as a cultural gateway to the Yanbaru region, Nago Museum centers on the theme \u0027The People and Nature of Yanbaru.\u0027 It systematically exhibits natural history specimens, traditional whaling heritage, and historical mountain lifestyle tools from Nago and northern Okinawa. Illustrating how local people harmoniously coexisted with Yanbaru\u0027s rugged terrain, it is a perfect first stop to gain a rich historical foundation before exploring Kouri Island and deeper Yanbaru.", "name": "Nago Museum", "transport": "Take Express Bus No. 111 or 117 from Naha Bus Terminal to Nago Bus Terminal, followed by about a 15-minute walk."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located right at the island\u0027s entrance after crossing the Kouri Bridge, Kouri Beach features stunning, crystal-clear \u0027Kouri Blue\u0027 waters and fine white sand. The excellent water quality makes it ideal for swimming and various water sports, serving as a must-visit summer retreat. Looking up from the beach offers a close-up view of the magnificent Kouri Bridge, and at dusk, you can admire a breathtaking sunset fading into shades of purple and red, soaking in the laid-back island atmosphere.", "name": "Kouri Beach", "transport": "About a 1-hour and 40-minute drive from Naha Airport via National Route 58 and the Kouri Bridge."}, {"address": "2 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Situated on the northern side of Kouri Island, Tinu Beach is famous for its two heart-shaped coral reef rocks carved by wave erosion. Ever since the famous Japanese idol group Arashi filmed a commercial here, it has become a popular romantic sanctuary for visitors worldwide. The two Heart Rocks display different charms depending on the tide and light; at low tide, you can walk up close to examine their details, making a stroll along the pure white beach delightfully romantic.", "name": "Tinu Beach \u0026 Heart Rock", "transport": "After crossing Kouri Bridge, drive along the island loop road to the northern tip for about 5 minutes to reach the paid parking lot."}, {"address": "1241-1 Aha, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located within Yambaru National Park, Daisekisarinzan is a tropical karst landscape formed over 250 million years of geological changes. Revered as a sacred site by the Ryukyuan people since ancient times, it exudes a mystical power spot atmosphere. The park features several well-designed trails\u2014including barrier-free paths, subtropical giant tree forest trails, and rock formation trails\u2014where you can admire giant uniquely shaped rocks, centuries-old banyan trees, and stunning ocean views of Cape Hedo, making it perfect for families to connect with nature.", "name": "Daisekisarinzan", "transport": "About a 2-hour drive heading north from downtown Naha via the Kyoda Interchange and National Route 58."}, {"address": "Hedo, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Cape Hedo is the majestic northernmost point of Okinawa Main Island, where sheer cliffs formed from raised coral reefs plunge dramatically into the deep blue ocean. Renowned for its powerful crashing waves against the cliffs, visitors can even spot Yoron Island in the distance on a clear day. The cape features an observation deck and the Monument of the Reversion to the Homeland; walking along the well-paved trails allows you to fully experience the immense power of nature where the Pacific Ocean meets the East China Sea.", "name": "Cape Hedo", "transport": "Drive north along National Route 58 to the end of the main island; it takes about 2 hours and 15 minutes by car from Naha Airport."}, {"address": "781-1 Hiji, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in the subtropical virgin forest of Yambaru, Hiji Waterfall boasts a 25.7-meter drop, making it the highest waterfall on Okinawa Main Island. Reaching the waterfall involves a 40-minute hike along well-maintained forest trails and suspension bridges, where you can observe rare wildlife like the Okinawa rail, along with lush fern ecosystems. Upon arrival, the spectacular view of the cascading water and refreshing mist instantly washes away all tiredness.", "name": "Hiji Waterfall", "transport": "Drive to the entrance of the Hiji Waterfall Campsite, park your car, and enter the trail on foot."}, {"address": "Ginama, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Kayauchi Banta is a sheer coral reef cliff standing approximately 100 meters high. It got its name from a local legend saying that if a bundle of miscanthus grass were thrown off the top, the strong updraft would shred it to pieces before it hit the bottom. Looking down from the cliffside observatory, the vast blue East China Sea unfolds before you, with dramatic shorelines and crashing white waves creating a visually striking landscape. It is also a hidden gem for watching the sun sink below the ocean horizon.", "name": "Kayauchi Banta", "transport": "Head north along National Route 58, then follow the road signs onto the mountain road near the Ginama area; about a 2-hour drive."}, {"address": "Tsuba, Ogimi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Located upstream on the Henan River, Ta-Taki Waterfall is the most popular river trekking and shower climbing hotspot in the Yambaru region. Unlike ordinary land trails, reaching Ta-Taki Waterfall requires wading upstream through crystal-clear streams and stepping across riverbed rocks, offering an adventure-packed journey. The roaring waterfall at the end features a natural pool perfect for swimming, playing in the water, or standing behind the water curtain\u2014a dream paradise for outdoor enthusiasts.", "name": "Ta-Taki Waterfall", "transport": "It is recommended to set your GPS to the dedicated Ta-Taki parking lot, then follow the directional signs to enter the stream from the trail starting point."}, {"address": "154 Gesashi, Higashi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Spanning 10 hectares, Gesashi Bay Mangrove Forest is the largest mangrove ecosystem on Okinawa Main Island and has been designated a National Natural Monument of Japan. It hosts a diverse range of mangrove plants thriving in the tidal currents, alongside vibrant intertidal life like fiddler crabs and mudskippers. Visitors can stroll along the wooden boardwalks for easy wildlife watching or join a guided kayaking tour to navigate through the mangrove waterways, immersing themselves in a unique natural sanctuary.", "name": "Gesashi Bay Mangrove Forest", "transport": "Drive along National Route 329 and transfer to National Route 331 towards Higashi Village; about 1.5 to 2 hours drive from downtown Naha."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Spanning approximately 1,960 meters to connect Yagaji Island and Kouri Island, Kouri Bridge is one of Okinawa\u2019s top scenic sea-crossing bridges. Driving across offers breathtaking views of the famous \u0027Kouri Blue\u0027 ocean\u2014a vivid gradient of emerald green and deep azure\u2014making it feel like driving on a sea skywalk. With parking areas and observation decks at both ends, it is an essential photo landmark when visiting Kouri Island.", "name": "Kouri Bridge", "transport": "About 1.5 hours by car from Naha Airport via Route 58 and the Okinawa Expressway."}, {"address": "2593-2 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located at Ti-nu Beach on the north side of Kouri Island, these two raised coral reef rocks were naturally eroded by waves into heart shapes. They exploded in popularity after being featured in a commercial by a famous Japanese idol group. When aligned, their silhouettes form a double-heart shape against crystal-clear blue waters and white sand\u2014a romantic photo spot for couples and travelers.", "name": "Heart Rocks (Ti-nu Beach, Kouri Island)", "transport": "About a 5-minute drive around the island loop road from Kouri Bridge to the parking lot, followed by a 3-minute walk down to the beach."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched 82 meters above sea level, this striking white tower is reached via self-driving automated golf carts that glide through lush tropical gardens. Inside, you\u0027ll find a Shell Museum displaying over 10,000 shells from around the world. The open-air rooftop observation deck offers sweeping 360-degree ocean views and a great look at Kouri Bridge, complete with a \u0027Bell of Happiness\u0027 perfect for photos.", "name": "Kouri Ocean Tower", "transport": "After crossing Kouri Bridge, turn right and drive along the island loop road for about 3 minutes to reach the designated parking lot."}, {"address": "1241 Ginama, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located inside Yambaru National Park, Daisekirinzan features rock peaks formed 250 million years ago and vast subtropical virgin forests. Considered sacred in Ryukyu mythology, the park offers 4 boardwalk trails covering bizarre rock formations, ocean lookouts, and giant banyan trees. Reaching the Goku Rock Lookout awards panoramic views of Cape Hedo and the coastline\u2014a high-energy, popular nature destination.", "name": "Daisekirinzan", "transport": "About a 2-hour drive north from Naha City via Route 58; about 5 minutes by car from Cape Hedo."}, {"address": "Hedo, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Positioned at the northernmost tip of Okinawa Main Island, Cape Hedo features dramatic raised coral reef cliffs where the Pacific Ocean meets the East China Sea. Crashing waves hit the sheer cliffs with dramatic force, and on clear days, you can spot Yoron Island in the distance. Featuring monuments and unique observatories, it is an essential landmark for exploring northern Yambaru.", "name": "Cape Hedo", "transport": "About 1.5 hours northbound on Route 58 from Kyoda IC. Features a large free parking area."}, {"address": "Hedo, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched atop a cliff near Cape Hedo stands a massive 11.5-meter-tall observatory shaped like Okinawa\u0027s endemic, protected bird, the Yanbaru Rail (Kuina). The striking and adorable structure draws countless visitors for fun photo ops. Climb the interior stairs to the bird\u0027s chest viewing platform for sweeping vistas of the blue Pacific and Cape Hedo.", "name": "Yanbaru Kuina Observatory", "transport": "About 5 minutes by car from Cape Hedo; follow the uphill mountain road signs to the summit parking lot."}, {"address": "Ginama, Kunigami Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | An iconic scenic landmark in Yambaru, featuring thrilling 80-meter Ryukyu limestone cliffs plunging straight into the ocean. Legend has it that a bundle of miscanthus grass thrown off the cliff top would be ripped apart by the strong coastal winds. The well-maintained observation deck offers spectacular panoramic views of the coastline, the East China Sea, and winding Route 58, especially breathtaking at sunset.", "name": "Kayauchi Banta Cliff", "transport": "Driving north from Naha along Route 58, turn right onto the mountain road just before Ginama Tunnel; reach the observatory parking area in about 3 minutes."}, {"address": "160-1 Gesashi, Higashi Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located on the east coast of Kunigami Village at Gesashi Bay, this area boasts the largest and best-preserved mangrove wetland ecosystem on Okinawa Main Island, designated as a National Natural Monument. A well-designed wooden walkway weaves through lush mangrove canopies and estuaries, allowing visitors to closely observe fiddler crabs, mudskippers, and various waterbirds. It is also a popular spot for mangrove kayaking.", "name": "Gesashi Bay Mangrove Walkway", "transport": "About 50 minutes by car from Kyoda IC via Route 329 and Prefectural Route 14 toward Higashi Village."}], "name": "Popular Photo Spots"}}, "name": "Kouri Island and Yanbaru Nature Area"}, "motobu_churaumi": {"categories": {"cat_1": {"items": [{"address": "5101 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | Listed as a UNESCO World Heritage Site, Nakijin Castle Ruins was the residence of the Hokuzan Kingdom in the 14th century. The magnificent curved stone walls follow the natural contours of the mountain, resembling a winding giant dragon. Inside, the ancient main gate \u0027Heiromon\u0027 and the ruins of the main hall are preserved. In spring, it is a famous spot for viewing Ryukyu Kanhizakura (Taiwan cherry) blossoms. Standing atop the castle offers a breathtaking view of the vast East China Sea, exuding a profound sense of historical grandeur and architectural craftsmanship.", "name": "Nakijin Castle Ruins", "transport": "About a 40-minute drive from Kyoda IC, or take the Yanbaru Express Bus to \u0027Nakijin Castle Ruins Entrance\u0027 stop and walk for about 15 minutes."}, {"address": "90 Nakayama, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | Reconstructed at the end of the Meiji period, the historic Asato House perfectly restores centuries-old traditional Ryukyuan red-tile architecture. The compound consists of multiple ancient folk houses surrounded by lush subtropical forests and small waterfall landscapes. Here, you can admire the craftsmanship of traditional timber mortise-and-tenon joints and red-tiled roofs, while savoring special Agu pork Okinawa Soba in a historic atmosphere.", "name": "Ufuya (Historic Ryukyu House)", "transport": "About a 20-minute drive from Okinawa Churaumi Aquarium. Large dedicated parking lot available."}, {"address": "Bise, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | Located near the Okinawa Churaumi Aquarium, Bise Village beautifully preserves the rustic charm of traditional Okinawa windbreak trees interwoven with red-tiled houses. Thousands of centuries-old Fukugi (Garcinia) trees form stunning green tunnels. Traditional houses are enclosed by coral limestone stone walls (\u0027Ishigaki\u0027), featuring screen walls (\u0027Hinpun\u0027) at the entrance to block evil spirits and guardian lion-dogs (\u0027Shisa\u0027) on the roofs\u2014faithfully presenting the architectural wisdom of typhoon protection from the Ryukyu Kingdom era.", "name": "Bise Traditional Village", "transport": "About a 10-minute walk or a 3-minute drive from Okinawa Churaumi Aquarium to the entrance of Bise Fukugi Tree Road."}, {"address": "5101 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | Located adjacent to Nakijin Castle Ruins, this history museum\u0027s architecture blends seamlessly into the traditional Ryukyuan landscape. Displays include Chinese ceramics from the Song, Yuan, and Ming dynasties excavated from the castle ruins, weapons from the Ryukyu Kingdom era, ritual artifacts, and traditional farming tools of Nakijin Village. It is an excellent place to gain in-depth insight into the history of the Hokuzan Kingdom, the rise and fall of Ryukyu maritime trade, and local folk culture.", "name": "Nakijin Center for History and Culture", "transport": "Located within the Nakijin Castle Ruins grounds, about a 1-minute walk from the castle ticket office."}, {"address": "Gushiken, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 3.8 Stars | An ancient castle site in the Gushiken area of Motobu Town, believed to have been part of the Hokuzan Kingdom\u0027s defense system during the Sanzan period. The ruins retain untouched original stone walls stacked in the \u0027Nozura-zumi\u0027 (natural stone stacking) technique, exhibiting a rugged architectural style weathered by time. The hilltop offers excellent views overlooking the northwestern coastline of Motobu Peninsula and Iejima Island.", "name": "Gushiken Castle Ruins", "transport": "About a 10-minute drive from central Motobu Town. Driving by car is recommended."}, {"address": "Jahana, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 3.7 Stars | Jahana Castle Ruins is a mountain fortress site on the Motobu Peninsula blending historical heritage with natural landscapes, originally serving as a defensive mountain stronghold in ancient times. Remnants of old Ryukyu limestone walls and paved stone paths showcase the early form of 14th-century Ryukyuan castle architecture. Quiet and uncrowded, it is ideal for off-the-beaten-path travelers who love exploring rustic historic sites and feeling authentic history.", "name": "Jahana Castle Ruins", "transport": "About a 12-minute drive from Okinawa Churaumi Aquarium, heading along Prefectural Route 114 toward Jahana Village."}, {"address": "Kamiunten, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 3.9 Stars | Unten Port has been a vital natural harbor in northern Okinawa since ancient times, serving as a historic hub for Ryukyu Kingdom foreign trade and the landing site of the Satsuma Domain. Near the port stands the \u0027Monument Honoring Minamoto no Tametomo\u0027, commemorating the legendary epic of the Heian-era samurai general who drifted here, whose son became King Shunten, the founder of the Ryukyu Kingdom. Featuring dramatic natural terrain, it offers rich historical legends alongside beautiful harbor views.", "name": "Unten Port \u0026 Minamoto no Tametomo Legend Monument", "transport": "About a 10-minute drive from Nakijin Village Office to the Unten Port Ferry Terminal area."}, {"address": "888 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 Stars | Located near downtown Motobu Town, this museum showcases the Motobu Peninsula\u0027s maritime culture, forestry development, and traditional crafts throughout history. Exhibits include models of Ryukyuan wooden \u0027Yanbaru boats\u0027, traditional diving gear, historical documents, and life-size models of traditional red-tile houses. The building exudes nostalgic medieval Ryukyuan charm, serving as a key facility for understanding the historical development and fishing village architecture of Motobu Town.", "name": "Motobu Town Historical and Folk Museum", "transport": "About a 5-minute drive from Motobu Port, or take a bus to \u0027Motobu Town Hall\u0027 stop and walk for about 3 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Ocean Expo Park)", "feature": "\u2b50 4.4 stars | A large cultural exhibition hall inside Ocean Expo Park showcasing valuable artifacts of maritime folklore and culture from Oceania and Okinawa, including traditional canoes and navigational tools. It features a large projection planetarium where visitors can comfortably gaze up at a simulated beautiful Okinawan night sky and ancient seafaring constellations, offering immense educational, artistic, and cultural value.", "name": "Oceanic Culture Museum and Planetarium", "transport": "Take the Yanbaru Express Bus from Naha Airport, get off at the \u0027Churaumi Aquarium\u0027 stop, and walk for about 5 minutes."}, {"address": "51 Imadomari, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located near the World Heritage Site Nakijin Castle Ruins, this core museum offers deep insights into the history of the Hokuzan Kingdom and local folklore traditions of the Motobu Peninsula. Divided into four main exhibition areas, it displays ancient trade ceramics excavated from the castle ruins, antique farming equipment, everyday utensils, and ritual cultural materials of Nakijin Village. Rich in historical charm and archaeological depth, it\u0027s a must-visit spot for history and arts enthusiasts.", "name": "Nakijin Center for History and Culture", "transport": "About a 40-minute drive from Kyoda Interchange, or take Bus No. 65/66 to the \u0027Nakijin Castle Ruins Entrance\u0027 stop and walk a short distance."}, {"address": "424 Ishikawa, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Ocean Expo Park)", "feature": "\u2b50 4.3 stars | An open-air museum replicating a traditional Okinawan village from the Ryukyu Kingdom period (17th\u201319th century). The park features reproductions of red-tiled traditional residences and stilt storehouses from various social classes and regions, alongside traditional crafts, textiles, and performances. Visitors can stroll along antique Ryukyuan stone walls amidst the soothing melodies of the sanshin, experiencing the daily life, culture, and architectural artistry of ancient Okinawa.", "name": "Okinawa Native Village", "transport": "Take Highway Bus No. 117 from Naha Airport and get off at the \u0027Kinen Koen Mae\u0027 (Memorial Park) stop."}, {"address": "538 Kouri, Nakijin Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A unique shell museum located on the lower floor of Kouri Ocean Tower, displaying over 10,000 rare and colorful shells of various shapes from all around the world. Exquisitely lit like an ocean art gallery, it highlights the marvelous beauty and sublime art of nature\u0027s creations. After visiting, you can ride an automated cart up to the observation tower to enjoy stunning panoramic ocean views.", "name": "Kouri Ocean Tower Shell Museum", "transport": "About a 45-minute drive from Kyoda Interchange via the Kouri Bridge."}, {"address": "148-1 Bise, Motobu Town, Kunigami District, Okinawa Prefecture (Inside Hotel Orion Motobu Resort \u0026 Spa)", "feature": "\u2b50 4.6 stars | An exquisitely beautiful oceanfront chapel located inside Hotel Orion Motobu Resort \u0026 Spa. Featuring an elegant, fresh white design facing Emerald Beach and Iejima Island, its panoramic floor-to-ceiling glass windows offer unobstructed views of brilliant sunshine
