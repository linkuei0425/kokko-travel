ho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A sprawling historical park surrounding the Shurijo Castle ruins, blending the Ryukyu Kingdom\u0027s natural beauty with its grand history. Lush greenery and ancient trees fill the grounds, while walking along the castle wall paths offers panoramic views of Naha city and the azure East China Sea. In spring, cherry blossoms bloom around the park, making it a prime cherry blossom viewing spot in Naha. At dusk, enjoy breathtaking views of the sun dipping below the ocean horizon while immersing yourself in the timeless elegance of the Ryukyu Dynasty.", "name": "Shurijo Castle Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 15 minutes."}, {"address": "1-Chome Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Excavated in 1427, Ryutan Pond is a historic man-made pond built during the Ryukyu Kingdom era to entertain Chinese envoys. The tranquil water reflects Shurijo Castle\u0027s iconic red-tiled roof and the blue sky. Lined with lush trees, waterbirds, ducks, and geese often swim gracefully, creating a peaceful natural ambiance. Strolling along the lakeside path offers various striking angles of the castle, making it a classic photo spot to capture stunning mirror reflections.", "name": "Ryutan Pond", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 12 minutes."}, {"address": "1-3-1 Shuri Sueyoshi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | A large forest park located northwest of Shurijo Castle, spanning across the Ano River Valley and boasting a rich subtropical primeval forest ecosystem. Covered in dense greenery, walking trails reveal ancient stone bridges, Ryukyu pines, and wild ferns. In summer, it becomes a rare spot in Naha to watch terrestrial fireflies (Luciola filiformis). Featuring the historical Sueyoshi Shrine alongside a secluded, hidden-gem natural environment, it is perfect for reconnecting with nature and enjoying an immersive hike.", "name": "Sueyoshi Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shiritsu Byoin-mae Station\u0027 and walk for about 5 minutes."}, {"address": "3-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Tucked away next to the Shuri Kinjo-cho Stone-paved Path, this serene forest park houses a designated National Natural Monument\u2014a giant bishop wood (Akagi) tree over 300 years old. Its massive canopy blots out the sky, exuding profound vitality. It is traditionally believed to be an Utaki (sacred Ryukyuan site) where deities descend. The air is filled with the scent of ancient wood and a calming aura, attracting visitors seeking mystical natural energy reminiscent of Totoro\u0027s forest.", "name": "Shuri Kinjo-cho Giant Akagi Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk about 15 minutes to the middle section of Kinjo-cho Stone-paved Path."}, {"address": "1-39 Shuri Sakiyama-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A hidden gem observatory park perched on the southeastern hill of Shurijo Castle, featuring spacious grounds and shady trees. The highest point has an observation platform offering unobstructed views of Naha\u0027s cityscape at night, the Kerama Islands, and the vast Pacific Ocean. Peaceful and laid-back with local neighborhood charm, it is an ideal retreat to escape tourist crowds, catch a soft breeze, and admire glowing sunsets.", "name": "Sakiyama Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk about 18 minutes, or take a city bus to \u0027Sakiyama-cho\u0027 bus stop and walk 3 minutes."}, {"address": "3-Chome Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located near the Kyukeimon Gate of Shurijo Castle, Enkanchi Pond is a man-made pond dug in 1502, primarily fed by natural castle springs. At its center stands Benzaitendo, a shrine featuring Minnan architectural influences, connected to land by the picturesque Tennyobashi stone arch bridge. Surrounded by tall subtropical foliage and flowers, the elegant and tranquil pond setting with turtles and fish swimming offers a taste of refined Ryukyu garden aesthetics and natural charm.", "name": "Enkanchi Pond", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 13 minutes."}, {"address": "1 Shuri Bengadake-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Standing at around 165 meters above sea level, Mount Bengadake is the highest peak in Naha City and was revered as a sacred mountain (an Utaki for rain prayers) where Ryukyu kings prayed for bountiful harvests and peace. Bengadake Park at the summit preserves precious subtropical natural secondary forest, rich in vibrant greenery and fresh air. Climbing the stone steps to the top rewards you with a 360-degree panoramic view of Shuri and surrounding hills, soaked in untouched nature and deep spiritual heritage.", "name": "Bengadake Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027, then take a taxi for about 5 minutes or walk for about 20 minutes."}, {"address": "1-32 Shuri Tobaru-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A neighborhood nature park set on the elevated hills of a Shuri residential area, characterized by rolling terrain and lush foliage. The park features a variety of native Okinawan flora that bloom vibrantly across seasons. Its highlight is a long roller slide built along the hillside, making it a huge hit with families. The hilltop viewing zone offers refreshing breezes and scenic overlooks of the surrounding Shuri hills\u2014a delightful spot to experience local daily life and enjoy a relaxed outing.", "name": "Tobaru Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Gibo Station\u0027 and walk for about 8 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Shureimon Gate is one of Okinawa\u0027s most iconic landmarks and is famously featured on the 2,000-yen banknote. Built in the Chinese hip-and-gable architectural style with three bays and four pillars, the ceremonial arch bears a plaque reading \u0027Shurei no Kuni\u0027, signifying that the Ryukyu Kingdom was a nation of etiquette and respect. This is an absolute must-visit photo spot when exploring Shuri Castle. The majestic red-tiled roof and vibrant vermilion paint set against the clear blue sky perfectly showcase the grand style of the Ryukyu Dynasty.", "name": "Shuri Castle - Shureimon Gate", "transport": "Take the Okinawa Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 15 minutes, or take a city bus and get off at \u0027Shurijo Koen Iraguchi\u0027."}, {"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Paved during the 16th-century Ryukyu Dynasty, this ancient stone path is crafted from Ryukyuan limestone and exudes a tranquil, timeless charm. Flanked by quaint traditional red-tiled houses and lush greenery, it was selected as one of the \u0027100 Best Roads in Japan\u0027. Not only has it served as a filming location for numerous TV dramas and movies, but it is also the ultimate historical backdrop for photos in traditional Ryukyuan attire.", "name": "Kinjo-cho Stone-Paved Path", "transport": "About a 5-minute walk from Shureimon Gate at Shuri Castle to reach the entrance of the path."}, {"address": "Shuri Ikebata-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Constructed in 1439, this man-made pond was once where the Ryukyu King entertained envoys from the Chinese Emperor. The water is clear and surrounded by lush trees, offering a stunning vantage point to capture the reflection of Shuri Castle perched high on the hill\u2014a favorite spot for photographers. Waterfowl often glide across the pond, and the golden hour sunset creates a truly romantic atmosphere.", "name": "Ryutan Pond", "transport": "About a 3-minute walk from Shurijo Castle Park."}, {"address": "3-20 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in a sacred grove along the Kinjo-cho Stone-Paved Path, this ancient tree is estimated to be over 300 years old. Having miraculously survived the devastation of war, it is revered by locals as a sacred tree inhabited by deities. Legend has it that on the 15th day of the 6th lunar month, gods descend to grant wishes. Its massive canopy and intertwined, robust roots create a magical, mysterious ambiance\u2014a highly recommended power spot and hidden gem for photo enthusiasts.", "name": "Kinjo Large Bischofia Javanica Tree", "transport": "Walk midway along the Kinjo-cho Stone-Paved Path, follow the signposts into a small side street, and walk for about 3 minutes."}, {"address": "2-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Built in 1492, this was the head temple of the Rinzai sect of Zen Buddhism in Ryukyu, modeled after the famed Engaku-ji in Kamakura, Japan. Although most of the structures were destroyed during World War II, the restored main gate (Somon) and Gokuraku-bashi Bridge showcase unique Ryukyuan stone-carving artistry. The stone bridge over the pond surrounded by beautiful foliage offers a serene, Zen-filled backdrop perfect for historic photos.", "name": "Enkaku-ji Temple Site", "transport": "Located on the north side of Shurijo Castle Park, about a 3-minute walk from Shureimon Gate."}, {"address": "2-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Nestled on a small island in the middle of Enkan-chi Pond, this red-tiled hall was originally built to store Buddhist scriptures gifted by the Korean king. Connecting the islet to the mainland is the beautifully crafted stone arch bridge known as \u0027Ahagon Bridge\u0027. The red tiles, ancient stone bridge, and surrounding green waters form a breathtaking scene reminiscent of a traditional ink-wash painting\u2014a beloved hidden gem for photography lovers.", "name": "Benzaitendo \u0026 Ahagon Bridge", "transport": "Located at Enkan-chi Pond inside Shurijo Castle Park, adjacent to the Enkaku-ji Temple Site."}, {"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Kankaimon is the main outer entrance into the inner compound of Shuri Castle; \u0027Kankai\u0027 means \u0027welcome\u0027, referring to welcoming Chinese envoys and honored guests. Built into sturdy arched stone walls with a wooden turret on top, the gate is guarded by an imposing pair of stone Shisa lions on either side. Visitors love posing with the Shisa lions to capture the grand and welcoming hospitality of the ancient Ryukyu Kingdom.", "name": "Shuri Castle - Kankaimon Gate", "transport": "Located inside Shurijo Castle Park, about a 2-minute walk after passing through Shureimon Gate."}, {"address": "1-3 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A UNESCO World Heritage Site built in 1501, Tamaudun is the royal mausoleum of the Second Sho Dynasty of the Ryukyu Kingdom. Carved entirely from granite and Ryukyuan limestone, its architecture mimics the royal palace of the era. Solemn, grand, and adorned with intricately carved stone lions atop the stone walls, this site exudes an aura of ancient mystery, offering immense photographic and cultural value.", "name": "Tamaudun Royal Mausoleum", "transport": "Located on the west side of Shurijo Castle Park, about a 3-minute walk from Shureimon Gate."}], "name": "Popular Photo Spots"}}, "name": "Shuri Castle and Historical \u0026 Cultural District"}, "southern_senaga": {"categories": {"cat_1": {"items": [{"address": "267-1 Chinen Kudeken, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Sefa-Utaki is the highest-ranking sacred site of the Ryukyu Kingdom era and a UNESCO World Cultural Heritage site. Nestled in the forests of Nanjo City, this natural Utaki (sacred grove) has served as a holy place since ancient times, where Ryukyu kings and the Kikoe-\u014dgimi (the highest priestess) held prayer rituals. Strolling along the lush green ancient trail, you will find \u0027Sangui\u0027, a triangular rock fissure formed by two massive leaning boulders. Passing through it offers a distant view of the sacred Kudaka Island. Built without artificial bricks or tiles, this sanctuary uses nature\u0027s rocks and trees as its temple, exuding a deep and solemn mystic atmosphere. It is a must-visit historical landmark to experience the roots of Ryukyu culture and spiritual cleansing.", "name": "Sefa-Utaki", "transport": "Take Toyo Bus No. 38 from Naha Bus Terminal to \u0027Sefa-Utaki Iriguchi\u0027 stop, then walk about 7 minutes."}, {"address": "449 Tomigusuku, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located on a small hill in Tomigusuku City, the Former Navy Headquarters Bunker is an underground complex excavated by the Imperial Japanese Navy during the Defense of Okinawa in late WWII. Dug several meters below ground, this hand-carved network spans hundreds of meters of intricate tunnels, preserving the commander\u0027s office, operations room, generator room, and soldiers\u0027 quarters. Bullet holes and grenade shrapnel marks are still clearly visible on the walls, presenting a solemn and powerful piece of history. An onsite museum displays wartime military equipment and letters, making it a site of profound historical education and reflection on peace.", "name": "Former Navy Headquarters Bunker", "transport": "Take a 10-minute taxi ride from Naha Yui Rail \u0027Oroku Station\u0027, or take Naha Bus No. 98 to \u0027Kaigungo Koen-mae\u0027 stop and walk for about 5 minutes."}, {"address": "671-1 Ihara, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located in Itoman City, the Himeyuri Monument honors the \u0027Himeyuri Student Nurse Corps\u0027\u2014female students and teachers from the Okinawa Normal School and First Girls\u0027 High School\u2014who lost their lives in the Battle of Okinawa during WWII. These young female students were mobilized as field nurses, treating the wounded in harsh underground bunkers, with most tragically perishing. Adjacent to the memorial stands the Himeyuri Peace Museum, displaying records of their struggle, personal belongings, manuscripts, and testimonial videos from survivors. The solemn, serene grounds draw many visitors to offer flowers and prayers, conveying a heartfelt plea for peace and remembrance of history.", "name": "Himeyuri Peace Museum \u0026 Monument", "transport": "Take Bus No. 89 from Naha Bus Terminal to Itoman Bus Terminal, then transfer to Bus No. 107 or 108 and get off at \u0027Himeyuri no To-mae\u0027 stop."}, {"address": "444 Mabuni, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Perched on coastal hills in Mabuni, Itoman City, Okinawa Peace Memorial Park marks the final battlefield and conclusion of the Battle of Okinawa in WWII. The expansive park houses the Peace Memorial Hall, a museum, and the \u0027Cornerstone of Peace\u0027 monuments engraved with the names of all those who died in the battle. Black granite slabs lined up like waves bear the names of over 240,000 victims regardless of nationality or status, symbolizing a message of peace that transcends hatred. Standing along the deep blue Pacific coastline, the park blends breathtaking views with poignant history, serving as Okinawa\u0027s most iconic peace landmark.", "name": "Okinawa Peace Memorial Park", "transport": "Take Bus No. 89 from Naha Bus Terminal to Itoman Bus Terminal, then transfer to Bus No. 82 (Gyokusendo Line) and get off at \u0027Heiwa Kinentang-mae\u0027 stop."}, {"address": "1730 Kiyan, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched on coastal cliffs at the southernmost tip of Okinawa Island in Itoman City, Gushikawa Castle Ruins is a Ryukyu Kingdom-era fortress site featuring a unique geographical setting. Built from limestone, the walls meander along the natural contours of the cliff face, with crashing ocean waves and wave-cut platforms directly below. Legend has it that the castle was founded by the Kume Gushikawa Anji who fled from Kume Island, and its architecture closely resembles the Gushikawa Castle on Kume Island. Inside, a hole leading straight down to the sea cliff served defensive and maritime trade transfer purposes. Walking among the ruins, visitors can feel a poignant sense of history while taking in sweeping, unobstructed views of the Pacific Ocean.", "name": "Gushikawa Castle Ruins", "transport": "Drive for about 40\u201350 minutes from downtown Naha; or take a bus to Itoman Bus Terminal and transfer to a taxi for about 15 minutes."}, {"address": "19-1 Tamagusuku, Tamagusuku-aza, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located on a 180-meter-high plateau in Nanjo City, Tamagusuku Castle Ruins is one of the \u0027Seven Utaki of Ryukyu\u0027 created by gods in Ryukyu founding legends, carrying immense ancient historical and religious value. The castle was divided into primary, secondary, and tertiary enclosures; the best-preserved section today is the stone wall of the main enclosure and an arched gate carved out of a natural giant rock. This unique circular stone gate faces the eastern sunrise; during the summer solstice, sunlight passes directly through the arch into the inner grounds, considered a sacred design attuned to celestial events. The summit offers magnificent panoramic views overlooking Nanjo City and Kudaka Island in the distance, blending ancient Ryukyu history seamlessly with nature.", "name": "Tamagusuku Castle Ruins", "transport": "Drive about 35\u201340 minutes from Naha Airport; or take the N-Bus (Nanjo City Community Bus) to \u0027Tamagusuku Castle Ruins\u0027 stop and walk for about 5 minutes."}, {"address": "Itokazu, Tamagusuku-aza, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Situated on high ground in the Tamagusuku area of Nanjo City, Itokazu Castle Ruins is one of the largest and best-preserved castle (Gusuku) sites in southern Okinawa. Built in the early 14th century, the castle features towering walls constructed from massive cut stones, reaching heights of several meters in its steepest sections. Curving elegantly along the natural topography, the walls showcase the exquisite craftsmanship of ancient Ryukyu masonry. Left largely un-restored, it retains an authentic, atmospheric beauty. From atop the stone walls, visitors can enjoy 360-degree views of Nanjo\u0027s farmlands, villages, and the distant blue coastline.", "name": "Itokazu Castle Ruins", "transport": "Drive about 40 minutes from downtown Naha; or take the N-Bus to \u0027Itokazu\u0027 stop and walk for about 10 minutes."}, {"address": "Chinen, Chinen-aza, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located in the Chinen area of Nanjo City, Chinen Castle Ruins is a Nationally Designated Historic Site divided into an \u0027Old Castle\u0027 and a \u0027New Castle\u0027. According to Ryukyuan songs and ancient records, this area is revered as one of the sacred birthplaces of rice and wheat cultivation in Okinawa. The Old Castle features un-cut natural stone masonry, while the New Castle boasts finely cut stone walls and a beautifully crafted arched gate. Standing on a high hill overlooking the ocean, surrounded by lush foliage, the site offers a peaceful atmosphere. Here, visitors can admire the evolution of ancient Ryukyu stone masonry while gazing out at the crystal-clear Pacific Ocean and Kudaka Island.", "name": "Chinen Castle Ruins", "transport": "Drive about 40 minutes from Naha; or take Toyo Bus No. 38 to \u0027Chinen\u0027 stop and walk for about 10 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "614-1 Mabuni, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located within Peace Memorial Park in Itoman City, this is one of the most iconic historical and cultural museums in southern Okinawa. It houses and exhibits a vast collection of rare historical photos, documents, and survivor testimonies from the Battle of Okinawa at the end of World War II. The exhibition space is solemnly designed and thought-provoking, using multimedia and dioramas to vividly convey the cruelty of war and the preciousness of peace. The observation deck on the top floor offers sweeping views of the Pacific Ocean, inspiring deeper reflection on peace. An indispensable historical site for a deep dive into modern Okinawan history.", "name": "Okinawa Prefectural Peace Memorial Museum", "transport": "From Naha Bus Terminal, take Bus No. 89 to \u0027Itoman Bus Terminal\u0027, then transfer to Bus No. 82 or 108 and get off at \u0027Heiwa Kinentang-mae\u0027 stop."}, {"address": "671-1 Ihara, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Built near the site where the Himeyuri Student Nurse Corps perished during the Battle of Okinawa, this museum commemorates the female students who tragically lost their lives and works to pass on the message of peace. It displays diaries, personal belongings, photos, and a replica battlefield bunker related to the high school girls mobilized as nursing aides. The exhibits present a gentle yet powerful narrative that leaves visitors deeply moved and reflective. Featuring an emotional documentary room and a memorial message area, this venue holds immense educational and memorial value, making it one of southern Okinawa\u0027s most poignant cultural landmarks.", "name": "Himeyuri Peace Museum", "transport": "Take Bus No. 89 from downtown Naha to Itoman Bus Terminal, then transfer to Bus No. 82 or 107 and get off at \u0027Himeyuri no To-mae\u0027 stop; walk about 1 minute."}, {"address": "448 Mabuni, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched on high ground within Peace Memorial Park, the Okinawa Peace Memorial Hall features a striking 45-meter geometric tower that is visually impressive and artistically striking. Inside stands the 12-meter-tall \u0027Okinawa Peace Prayer Statue,\u0027 crafted over decades by renowned sculptor Shinzan Yamada to symbolize prayers for eternal world peace. The hall also doubles as a space for cultural events and art exhibitions, frequently showcasing peace-themed paintings and crafts. Surrounded by lush greenery, its serene atmosphere offers a unique blend of sculptural art, spiritual reflection, and cultural heritage.", "name": "Okinawa Peace Memorial Hall", "transport": "About a 35-minute drive from Naha Airport; or take Bus No. 82 and get off at \u0027Heiwa Kinentang-mae\u0027 stop."}, {"address": "1-6-1 Nishizaki-cho, Itoman City, Okinawa Prefecture (Inside Southern Beach Hotel \u0026 Resort)", "feature": "\u2b50 4.4 stars | Located inside the Southern Beach Hotel \u0026 Resort in Itoman City, Sea Shell Mode Chapel is an exquisite wedding chapel inspired by seashells and ocean waves. It features a curved, snow-white exterior and soaring floor-to-ceiling glass windows inside that overlook the endless azure Pacific Ocean and white sandy shores. Sunlight filtering through the skylight and glass fills the interior with a dreamlike radiance. Beyond hosting weddings, its avant-garde, elegant modern architecture and harmonious coastal design attract countless photography and art enthusiasts, making it a famous romantic landmark in southern Okinawa.", "name": "Sea Shell Mode Chapel", "transport": "Take an airport express bus or taxi from Naha Airport; approximately 20 minutes to Southern Beach Hotel \u0026 Resort."}, {"address": "1438 Nashiro, Itoman City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Situated inside a luxury resort at Nashiro Beach in Itoman City, this premier modern chapel seamlessly blends classic Ryukyuan flair with European seaside chapel aesthetics. Featuring an exceptionally high vaulted ceiling and panoramic glass walls, it directly faces the golden sunsets and crystal-clear waters of the southwestern coastline. The interior boasts an elegant pure-white and wooden color palette, opulent crystal chandeliers, and a long white aisle, creating a truly grand visual impression. While primarily used for private weddings, its breathtaking architectural and landscape design has made it an artistic architectural highlight along the southern coast.", "name": "Ryukyu Hotel \u0026 Resort Nashiro Beach Chapel", "transport": "Drive or take a taxi from Naha Airport south along Route 331; reachable in about 20 minutes."}, {"address": "3148-1 Yonabaru, Yonabaru Town, Shimajiri District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Restored from the site of the pre-war Taisho-era \u0027Yonabaru Station\u0027, the Yonabaru Light Railway Museum radiates nostalgia and historical charm. The museum faithfully restores the wooden structure and red-tiled roof of Okinawa\u0027s only light railway station from that period, showcasing railway artifacts, rare old photos, scale models, and historical overviews. Interactive models and displays transport visitors back in time to explore Okinawa\u0027s thriving transportation and railway culture prior to WWII, making it a rare and precious industrial history museum in southern Okinawa.", "name": "Yonabaru Light Railway Museum", "transport": "From Naha Bus Terminal, take Bus No. 30 or 37 and get off at \u0027Yonabaru\u0027 stop, then walk about 3 minutes."}, {"address": "257 Kyan, Haebaru Town, Shimajiri District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Haebaru Town Cultural Center is a comprehensive museum showcasing the native history, folk crafts, and traditional culture of southern Okinawa. The highlight of the museum is its in-depth display of traditional Okinawan textiles such as \u0027Haebaru Hanaori\u0027 and \u0027Ryukyu Kasuri\u0027, complete with hands-on weaving areas and antique looms. Additionally, it preserves historical documents regarding the Haebaru Army Bunkers from WWII, combining artistic appreciation with educational depth. With its elegant design evocative of a traditional Ryukyu village, it offers a wonderful deep dive into southern Okinawa\u0027s local heritage and craftsmanship.", "name": "Haebaru Town Cultural Center", "transport": "About a 15-20 minute drive from downtown Naha; or take Bus No. 111, 113, or 127 to \u0027Haebaru Yakuba-mae\u0027 stop and walk about 5 minutes."}, {"address": "228 Tomigusuku, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Situated on high ground in Tomigusuku City, this unique museum combines an underground military site with historical artifacts. Visitors can descend into hundreds of meters of hand-dug underground tunnels to view the operations commander\u0027s room, communications room, and original earth walls. The adjacent exhibition hall displays military supplies recovered from the tunnels, soldiers\u0027 letters home, weaponry, and detailed photographic histories, offering a solemn and poignant look at wartime reality. The observation deck at the top of the park provides sweeping views of Naha City and the southern Okinawan coastline.", "name": "Former Japanese Navy Underground Headquarters Museum", "transport": "Take a 10-minute taxi ride from Oroku Monorail Station in Naha, or take Bus No. 105 to \u0027Kaigungo Koen-mae\u0027 stop and walk about 5 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "523 Kudeken, Chinen, Nanjo, Okinawa", "feature": "\u2b50 4.5 stars | Located on the southeastern tip of Okinawa\u0027s main island, Chinen Cape Park boasts a panoramic 270-degree view of the Pacific Ocean, making it a prime spot for catching sunrise and stargazing at night. The park features barrier-free green paths, red-tiled pavilions, and iconic sculptures. Strolling along the seaside trail offers distant views of the sacred Kudaka Island and Tsuken Island. The stunning tapestry of blue skies, lush lawns, and gradient turquoise ocean makes this one of southern Okinawa\u0027s most iconic natural landmarks.", "name": "Chinen Cape Park", "transport": "About 45 minutes by car from Naha Airport; or take Bus No. 38, get off at \u0027Chinen Misaki Koen-mae\u0027 stop, and walk for about 5 minutes."}, {"address": "Senaga, Tomigusuku, Okinawa", "feature": "\u2b50 4.4 stars | Located just south of Naha Airport, Senagajima is famous for its stunning sunsets and up-close views of airplanes taking off and landing. Surrounded by crystal-clear shallows and rocky coastal beauty, walking along the seaside promenade evokes a charming Mediterranean resort vibe. At dusk, the sky and ocean are painted in gradients of golden yellow and purple-red, paired with planes gliding across the horizon\u2014a uniquely romantic visual feast.", "name": "Senagajima Coast \u0026 Sunset Viewpoint", "transport": "About 15 minutes by car from Naha Airport; or take the Senagajima Shuttle Bus (TK02) and get off at \u0027Senagajima Umikaji Terrace\u0027."}, {"address": "202 Tamagusuku Maekawa, Nanjo, Okinawa", "feature": "\u2b50 4.6 stars | The Valley of Gangala is a subtropical virgin forest valley formed by the collapse of limestone caves tens of thousands of years ago. It preserves a remarkably rich and primitive ecosystem, featuring giant banyan trees (Gajumaru), natural limestone caves, and prehistoric human relics. Guided tours allow visitors to venture deep into this mystical green sanctuary, while the Cave Cafe at the entrance is built inside a natural limestone cavern, offering an unforgettable immersive experience in nature\u0027s majesty.", "name": "Valley of Gangala", "transport": "About 30 minutes by car from Naha Airport; or take Bus No. 83, get off at \u0027Gyokusendo-mae\u0027 stop, and walk for about 3 minutes."}, {"address": "Tamagusuku Hyakuna, Nanjo, Okinawa", "feature": "\u2b50 4.4 stars | Hyakuna Beach is a sacred site in Ryukyuan mythology where the creation goddess Amamikyo is said to have descended, exuding a mystical and pristine atmosphere. Free from heavy commercial development and artificial water sports facilities, it maintains pure sandy shores and intertidal rock formations. Giant, oddly-shaped rocks stand amidst the waves, revealing rich marine life at low tide. Its serene and peaceful environment is perfect for travelers seeking to escape the hustle and connect with the quiet power of nature.", "name": "Hyakuna Beach", "transport": "About 40 minutes by car from Naha Airport; or take Bus No. 39, get off at \u0027Hyakuna\u0027 stop, and walk for about 15 minutes."}, {"address": "1338-1 Tamagusuku Hyakuna, Nanjo, Okinawa", "feature": "\u2b50 4.3 stars | Located on the eastern coast of southern Okinawa, Mibaru Beach is renowned for its hundreds of meters of soft white sand and crystal-clear turquoise waters. Natural coral reef boulders dot the shoreline, creating a unique coastal landscape. The most popular activity here is taking a glass-bottom boat tour, allowing guests to observe vibrant tropical fish and coral reef ecosystems up close without getting wet\u2014a fantastic marine experience for families.", "name": "Mibaru Beach", "transport": "About 40 minutes by car from Naha Airport; or take Bus No. 39 to the final stop \u0027Mibaru Beach\u0027 and walk just a short distance."}, {"address": "444 Mabuni, Itoman, Okinawa", "feature": "\u2b50 4.5 stars | Situated on the Mabuni Hills, Peace Memorial Park is a national park that seamlessly blends historical memory with breathtaking coastal beauty. Spanning a vast area facing dramatic Pacific Ocean cliffs, it features manicured sprawling lawns and scenic seaside walking paths. Beyond the Cornerstone of Peace engraved with the names of fallen victims, the park serves as a serene spot for walking, relaxing, and taking in sweeping ocean views, offering a deeply tranquil experience.", "name": "Okinawa Senseki Quasi-National Park - Peace Memorial Park", "transport": "About 40 minutes by car from Naha Airport; or take Bus No. 82 and get off at \u0027Heiwa Kinentang-mae\u0027 stop."}, {"address": "236 Tomori, Tomigusuku, Okinawa", "feature": "\u2b50 4.2 stars | Perched on the elevated hills of Tomigusuku, Former Navy HQ Park preserves the underground bunker relics of the Former Japanese Navy Underground Headquarters while serving as a lush lookout park with magnificent panoramic views. The park boasts vast green spaces, children\u0027s play areas, and a popular long roller slide. From the hilltop observation deck, visitors can enjoy 360-degree views of Naha cityscape, the East China Sea, and planes landing at Naha Airport.", "name": "Former Navy HQ Park", "transport": "About 15 minutes by car from Naha Airport; or take Bus No. 55, get off at \u0027Kaigungo Koen-mae\u0027 stop, and walk for about 3 minutes."}, {"address": "1637 Tomori, Yaese, Shimajiri District, Okinawa", "feature": "\u2b50 4.1 stars | Built on the site of Tomori Castle ruins on Mount Yaese, Yaese Park is an elevated park famous for its hilly natural setting and panoramic vistas. From the top observation platform, visitors can take in breathtaking views stretching to the Kerama Islands, Naha City, and southern farmland scenery. From late January to early February, approximately 500 Taiwan cherry trees bloom into a vibrant pink tunnel, making it one of southern Okinawa\u0027s premier cherry blossom and picnicking destinations.", "name": "Yaese Park", "transport": "About 30 minutes by car from Naha Airport; or take Bus No. 34, get off at \u0027Tomori\u0027 stop, and walk for about 15 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "174-6 Senaga, Tomigusuku City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | Known as the \u0027Little Greece of Okinawa,\u0027 this ultimate photo hot spot features white tiered buildings nestled against blue skies and the ocean, home to numerous gourmet restaurants and specialty shops. Here, you can sit on the open-air terrace to enjoy the famous Happy Pancake, sip on freshly mixed drinks, watch airplanes landing and taking off at Naha Airport at extremely close range, and take in the gorgeous sunset. Every photo taken here captures a rich Mediterranean resort vibe.", "name": "Senagajima Umikaji Terrace", "transport": "About a 20-minute ride from Naha Airport on the Senagajima route bus (Ryukyu Bus No. 189), which departs via Asahibashi Station."}, {"address": "523 Chinen Kudeken, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.5 Stars | A famous scenic park located at the southeastern tip of Okinawa Main Island, boasting an expansive 270-degree view of the Pacific Ocean. Red-tiled pavilions built along the hillsides and circular green walking paths contrast strikingly with the deep blue sea. Not only is this a fantastic spot to watch the sunrise over the ocean, but you can also look out towards the sacred Kudaka Island, capturing iconic photos of Okinawa\u0027s natural scenery effortlessly.", "name": "Chinen Cape Park", "transport": "About 45 minutes by car from downtown Naha; or take Bus No. 38 (Shitabaku Line) from Naha Bus Terminal to \u0027Chinenmisaki Kouen-mae\u0027 stop and walk for about 5 minutes."}, {"address": "Chinen Chinen, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.4 Stars | \u0027Nirai Kanai\u0027 means \u0027Utopia\u0027 or \u0027Land of the Gods\u0027 in the Okinawan dialect. This large S-shaped elevated bridge spans across a valley; looking down from the observatory towards the ocean, the bridge resembles a winding dragon soaring toward the vast Pacific Ocean. Emerging from the tunnel into the breathtaking open panorama of sea and sky while driving makes this one of the most striking highway photo spots in all of Okinawa.", "name": "Nirai Kanai Bridge", "transport": "Driving is recommended. Takes about 40 minutes from downtown Naha via National Route 331 and Prefectural Route 86 to reach the bridge-top observatory."}, {"address": "202 Tamagusuku Maekawa, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.6 Stars | A mysterious subtropical virgin forest valley formed by the collapse of a limestone cave tens of thousands of years ago. The most popular photo spot here is the \u0027Cave Cafe\u0027 located at the entrance of the cavern, where visitors can savor rich coffee beneath ancient stalactites formed over millions of years. Deep in the valley stands the grand 20-meter-tall banyan tree \u0027Ufushu Banyan\u0027, emanating a magical and sacred ambiance reminiscent of a Studio Ghibli film.", "name": "Valley of Gangala", "transport": "About 30 minutes by car from Naha Airport; or take Bus No. 50, 51, or 83 to \u0027Gyokusendo-mae\u0027 stop and walk for about 3 minutes."}, {"address": "2-1 Tamagusuku Tamagusuku, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | An immensely popular ocean-view cafe located next to Hyakuna Beach in southern Okinawa. Its most sought-after seats are the row of wooden counter seats facing large open windows overlooking the sea. At high tide, the water laps right beneath the window frames, making you feel as if you are floating on the ocean. Sipping pour-over coffee, enjoying desserts made from local ingredients, and capturing aesthetic photos framed by the ocean windows make this a must-visit spot in southern Okinawa.", "name": "Hamabe no Chaya", "transport": "About 40 minutes by car from downtown Naha; or take Bus No. 50 (Hyakuna Line) to \u0027Mibaru Beach\u0027 stop and walk for about 10 minutes."}, {"address": "1336 Tamagusuku Maekawa, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.3 Stars | A large theme park combining traditional Okinawan culture with natural wonders. The park\u0027s most famous highlight is Gyokusendo Cave, formed over 300,000 years, stretching about 5 km (890 meters open to the public). Inside, the fantastically illuminated \u0027Blue Water Fountain\u0027 attracts countless visitors for photos. The park also features a century-old Ryukyu Kingdom village where you can try on traditional Ryukyuan attire for memorable cultural portraits.", "name": "Okinawa World", "transport": "About 30 minutes by car from Naha Airport; or take Bus No. 83 (Gyokusendo Line) from Naha Bus Terminal directly to \u0027Gyokusendo-mae\u0027 stop."}, {"address": "1147 Chinen Azama, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.2 Stars | A popular man-made beach boasting crystal-clear waters and pure white sand. It features various photo installations favored by young crowds, such as the famous \u0027Bell of Happiness\u0027 (Bell of Love), a pure white seaside swing, and colorful cute photo walls. With calm waves and magnificent views reaching out to sacred Kudaka Island, it is a hugely popular venue for shooting romantic beach wedding photos and trendy social media pictures.", "name": "Azama Sunsun Beach", "transport": "About 45 minutes by car from downtown Naha; or take Bus No. 38 (Shitabaku Line) to \u0027Azama Sunsun Beach Iriguchi\u0027 stop and walk for about 5 minutes."}, {"address": "1338-1 Tamagusuku Hyakuna, Nanjo City, Okinawa Prefecture", "feature": "\u2b50 4.1 Stars | Compared to artificial beaches, Mibaru Beach preserves the most pristine and untouched natural landscape of southern Okinawa. The white sand beach is scattered with uniquely shaped mushroom-like rocks formed by sea erosion, creating a mysterious coastal scene. Visitors can take glass-bottom boat tours to marvel at the rich marine ecosystem, making it the top choice for capturing photos rich in geological beauty and raw Okinawan seascape.", "name": "Mibaru Beach", "transport": "About 40 minutes by car from Naha Airport; or take Bus No. 50 or 39 to the \u0027Mibaru Beach\u0027 terminus and walk for about 3 minutes."}], "name": "Top Photo Spots"}}, "name": "Southern Okinawa and Senaga Island"}, "urasoe_ginowan": {"categories": {"cat_1": {"items": [{"address": "2-40-1 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Urasoe Castle Ruins marks the site of the ancient capital of the Chuzan Kingdom during the Ryukyu Kingdom era. In the 14th and 15th centuries under King Chatu, it served as the political and economic center prior to Shuri Castle. The stone walls curve elegantly along the mountain contours, showcasing ancient Ryukyuan masonry techniques. Although heavily destroyed during the Battle of Okinawa, recent archaeological restorations have revived its majestic presence. From the hilltop, visitors can enjoy unbeatable panoramic views of the ocean, Ginowan, and Urasoe city, offering an atmosphere rich in historical charm and grand scale.", "name": "Urasoe Castle Ruins", "transport": "From Naha Bus Terminal, take Bus No. 55 or 56 and get off at \u0027Urasoe Maeda Station\u0027 or \u0027Nakama Iriguchi\u0027 stop, then walk about 10\u201315 minutes."}, {"address": "2-40 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Nestled beneath the steep cliffs of the Urasoe Castle Ruins, Urasoe Youdore is the royal mausoleum of King Eizo of the First Sho Dynasty and King Sho Nei of the Second Sho Dynasty. \u0027Youdore\u0027 translates to \u0027a quiet place at sunset\u0027 in the Ryukyuan language. Built into natural cliffside caves, the entrance is strictly guarded by massive stone walls, creating a solemn and reverent atmosphere. Featuring intricate stone sarcophagi inside, it is an invaluable cultural heritage site for studying Ryukyuan burial customs and stone-carving craftsmanship.", "name": "Urasoe Youdore (Royal Mausoleum)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Urasoe-Maeda Station\u0027 and walk about 15 minutes into Urasoe Castle Ruins Park."}, {"address": "1-27-10 Futenma, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | As one of the Eight Shrines of Ryukyu and the oldest shrine in Ginowan City, Futenma Shrine is dedicated to Kumano Gongen and traditional Ryukyuan deities. Its standout architectural and historical feature is a 280-meter-long natural limestone cave located behind the main shrine hall, revered by ancient Ryukyuans as a sacred \u0027Utaki\u0027 prayer site. Blending Shinto architectural traditions with indigenous Ryukyuan nature worship, the shrine\u0027s elegant structures make it a deeply significant cultural and spiritual sanctuary.", "name": "Futenma Shrine", "transport": "From downtown Naha, take Bus No. 23, 27, or 31 to \u0027Futenma\u0027 stop, then walk about 3 minutes."}, {"address": "1-22 Touzan, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Often hailed as \u0027Urasoe\u0027s Shuri Kinjo-cho Stone-Paved Road\u0027, the Touzan Stone-Paved Road was part of the vital official highway network (\u0027Shukudou\u0027) connecting Shuri Castle to the northern Nakagami region during the Ryukyu Kingdom period. Constructed in the 17th century using Ryukyu limestone, this historical path meanders along steep valley terrain flanked by lush greenery and peaceful surrounds. Once trodden by kings and envoys, walking along this path offers a serene immersion into centuries-old Ryukyuan masonry and heritage.", "name": "Touzan Stone-Paved Road", "transport": "Take the Okinawa Urban Monorail to \u0027Urasoe-Maeda Station\u0027 and walk about 12 minutes to the entrance of the ancient path."}, {"address": "2-19 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Dating back to the 13th century, Izu Castle Ruins is the birthplace and residence of King Eizo, a prominent figure in Ryukyuan history. Situated on a plateau approximately 70 meters above sea level, the fortress utilizes natural Ryukyu limestone terrain to form sturdy stone walls. Within the grounds lies the sacred \u0027Forest of Izu\u0027 Utaki, where locals still offer prayers today. The surrounding park is shaded by lush trees with bougainvillea blooming year-round, and the hilltop observation deck offers panoramic ocean views over Ginowan.", "name": "Izu Castle Ruins", "transport": "Take Bus No. 55 to \u0027Izu\u0027 stop, then walk about 8 minutes."}, {"address": "1-25 Kakazu, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located on a high ridge in southern Ginowan City, Kakazu Ridge was the battlefield for one of the fiercest conflicts during World War II\u0027s Battle of Okinawa. The park preserves original Japanese concrete bunkers, pillboxes, and machine-gun nests riddled with clear bullet holes, serving as a poignant testament to the harsh realities of war. At the top of the park stands a unique globe-shaped observatory offering sweeping views of MCAS Futenma and Ginowan City, making it a powerful landmark for historical reflection.", "name": "Kakazu Ridge Bunker Site", "transport": "From downtown Naha, take Bus No. 55 or 56 to \u0027Kakazu\u0027 stop, then walk about 10 minutes."}, {"address": "2-12-9 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Originating during the post-WWII U.S. military administration of Okinawa in the 1950s, Minatogawa Stateside Town was built as a residential area of single-story American-style houses for military families. Streets are named after U.S. states like Texas and Florida. In recent years, these minimalist, Morandi-toned bungalows have been repurposed into charming bakeries, trendy cafes, and lifestyle boutiques. Blending American retro nostalgia with modern Japanese indie flair, it is a uniquely stylish architectural neighborhood in Urasoe City.", "name": "Minatogawa Stateside Town", "transport": "From Naha, take Bus No. 20, 28, or 120 to \u0027Minatogawa\u0027 stop, then walk about 5 minutes."}, {"address": "1-12 Takashi, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Situated on a plateau in southern Urasoe City, Takashi Castle Ruins was an important defensive outpost and local noble residence for the Chuzan Kingdom during the 14th to 15th-century Sanzan period. Built along steep limestone cliffs, the site skillfully integrated natural terrain into its defensive stone ramparts. Though damaged over centuries and by war, the remaining stone structures and sacred Utaki sites reflect the distinct architecture of ancient Ryukyuan fortresses. Offering expansive views toward Shuri Castle and Naha Port, it is a fascinating spot for off-the-beaten-path historical exploration.", "name": "Takashi Castle Ruins", "transport": "From \u0027Shiritsu Byoin-mae\u0027 Monorail Station, take a taxi for about 8 minutes, or take a local bus to \u0027Takashi\u0027 stop and walk about 10 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-9-2 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Urasoe Art Museum is Okinawa\u0027s first public art museum, renowned worldwide for its exquisite collection of lacquerware art. The collection spans classic lacquer works from the Ryukyu Kingdom era to modern times, along with precious traditional crafts from various Asian countries. Its architecture blends traditional Ryukyuan castle wall lines with modern style, boasting a grand exterior and peaceful surroundings. Visitors can admire the Ryukyu Dynasty\u0027s unique red lacquer and gold foil techniques firsthand, participate in regular hands-on workshops, and view special exhibitions, making it the ultimate destination to discover local Okinawan art and Ryukyuan aesthetic philosophy.", "name": "\u6d66\u6dfb\u5e02\u7f8e\u8853\u9928 (Urasoe Art Museum)", "transport": "Take Bus No. 55 or 56 from Naha Bus Terminal, get off at \u0027Shiritsu Toshokan Mae\u0027 (In front of City Library) stop, and walk for about 3 minutes."}, {"address": "2-40-1 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | The Urasoe Yodore Museum is a cultural museum dedicated to showcasing the history of \u0027Urasoe Yodore\u0027, the royal mausoleum of the Ryukyu Kingdom\u0027s First and Second Sho Dynasties. The museum features a full-scale replica of the interior of the Yodore\u0027s West Chamber, alongside precious artifacts, sarcophagi, and ceramics excavated from the tombs and nearby Urasoe Castle ruins. Though compact, the museum packs high academic value and cultural impact, allowing visitors to deeply explore 14th- and 15th-century tomb architecture, burial customs, and Urasoe\u0027s glorious past as a former political heartland.", "name": "\u6d66\u6dfb\u6975\u6a02\u9675\u9928 (Urasoe Yodore Museum)", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Urasoe-Maeda Station\u0027 and walk for about 15 minutes into the Urasoe Castle Ruins."}, {"address": "1-25-1 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Ginowan City Museum is a historical and cultural exhibition hall deeply rooted in local folklore and natural history, documenting Ginowan\u0027s development from ancient times to the present. Exhibitions are divided into themes such as \u0027Ginowan\u0027s Nature and Climate\u0027, \u0027Folklore and Traditional Life\u0027, and \u0027Modern War History and Base Evolution\u0027. Visitors can view traditional Okinawan household artifacts, farming and fishing tools, festival paraphernalia, and learn about the impact of US military bases established post-WWII on local life. Hosting regular cultural document exhibits, it\u0027s ideal for travelers seeking an in-depth understanding of local history and everyday culture.", "name": "\u5b9c\u91ce\u7063\u5e02\u7acb\u535a\u7269\u9928 (Ginowan City Museum)", "transport": "Take Ryukyu Bus No. 99 from Naha City, get off at \u0027Mashiki\u0027 stop, and walk about 5 minutes."}, {"address": "1-9-3 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Urasoe Cultural Hall, also known as Tedako Hall (\u0027Tedako\u0027 meaning \u0027Child of the Sun\u0027 in the Ryukyuan dialect), is Urasoe City\u0027s premier performing arts center. Featuring striking modern architecture, it houses a main hall, small hall, and several art exhibition rooms, regularly hosting large-scale concerts, traditional Ryukyuan dance performances, stage plays, and contemporary visual art exhibitions. Exuding a lively local spirit, its surrounding outdoor park connects seamlessly with Urasoe Sports Park, making it a favorite hub for locals and arts enthusiasts to enjoy performances or spend a relaxing afternoon.", "name": "\u6d66\u6dfb\u5e02\u6587\u5316\u6703\u9928 \u592a\u967d\u5802 (Urasoe Tedako Hall)", "transport": "Take a bus from downtown Naha, get off at \u0027Urasoe Shiyakusho Mae\u0027 (In front of Urasoe City Hall) stop, and walk about 5 minutes."}, {"address": "2-22-1 Oyama, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | All Saints Anglican Church Okinawa is a historic church with unique architecture and a solemn atmosphere, situated in the Oyama area of Ginowan City. The building ingeniously combines local Okinawan stonework with traditional Anglican Gothic architectural elements, featuring beautiful spires and exquisite stained glass windows. Sunlight streaming through the stained glass fills the sanctuary with a captivating, serene interplay of light and shadow. Beyond serving as a devout gathering place for local parishioners, its peaceful ambience and artistic design draw architecture and religious culture enthusiasts seeking reflection and appreciation.", "name": "\u6c96\u7e69\u5168\u8056\u5f92\u6559\u5802 (All Saints Anglican Church Okinawa)", "transport": "Take a bus along Route 58 (such as No. 20, 28, or 120), get off at \u0027Isa\u0027 stop, and walk for about 8 minutes."}, {"address": "2-18-3 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Originally a residential enclave of single-story American houses for US military personnel and their families, Minatogawa Stateside Town has transformed into Okinawa\u0027s most unique American-vintage and creative arts district. Named after US states, its colorful bungalow-lined streets hide independent galleries, handmade craft boutiques, hipster photography studios, and famous dessert shops. Blending American pop culture with local Ryukyuan craftsmanship, every corner shines with artistic ingenuity\u2014making it a must-visit walking destination for lovers of art, photography, and lifestyle aesthetics.", "name": "\u6e2f\u5ddd\u5916\u4eba\u4f4f\u5b85\u85dd\u6587\u805a\u843d (Minatogawa Stateside Town Art \u0026 Cultural District)", "transport": "Take Bus No. 20, 28, or 120 from downtown Naha, get off at \u0027Minatogawa\u0027 stop, and walk about 5 minutes to the district entrance."}, {"address": "1-8-8 Shimashi, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Ginowan Baptist Church is a warm and modern community church nestled in a quiet residential neighborhood of Ginowan City. The exterior features sleek, minimal lines paired with warm wooden tones and ample natural light, creating an open and welcoming sacred space. Inside, a beautiful modern sanctuary and small performance area offer exceptional acoustics, frequently used for community concerts and sacred choral performances. It serves not only as a spiritual haven but also as a vibrant community platform sharing music and humanistic care.", "name": "\u5b9c\u91ce\u7063\u6d78\u4fe1\u6703\u6559\u5802 (Ginowan Baptist Church)", "transport": "Take Bus No. 97 or 98, get off at \u0027Shimashi\u0027 stop, and walk for about 3 minutes."}, {"address": "1-27 Kakazu, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Kakazu Ridge Peace Memorial Park is a historical site blending battlefield memory with reflection on peace. During the Battle of Okinawa, this site was the main battlefield for the fierce Battle of Kakazu Ridge. The park preserves original Japanese military trenches, bunker remnants, and bullet-riddled walls, alongside peace monuments and explanatory panels detailing the cruelty of war and the preciousness of peace. At the park\u0027s summit, a globe-shaped observatory offers panoramic views of Futenma Base and Ginowan City, offering deep historical value and educational reflection.", "name": "\u5609\u6578\u9ad8\u5730\u548c\u5e73\u7d00\u5ff5\u5c55\u671b\u53f0\u8207\u6230\u53f2\u907a\u8de1 (Kakazu Ridge Peace Memorial Park)", "transport": "Take Bus No. 25 or 56 from Naha, get off at \u0027Kakazu\u0027 stop, and follow the signs to walk about 10 minutes to the ridge park."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-11-1 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Urasoe Park is a hugely popular, sprawling comprehensive park on the main island of Okinawa, spanning the border between Urasoe City and Ginowan City. The park is divided into three main zones: the \u0027Historical Learning Zone\u0027 focused on historic sites and monuments, \u0027Zone C Playground\u0027 featuring an ultra-long roller slide and various playground equipment, and \u0027Zone B Ecological Recreation Area\u0027 filled with lush greenery. The main highlight for families with kids is the thrilling 90-meter-long roller slide, where you can speed down the mountainside while enjoying lush green scenery. Additionally, the elevated vantage point offers panoramic views of Ginowan city and the azure waters of the west coast, making it a must-visit destination combining natural landscapes, family fun, and rich history.", "name": "Urasoe Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Urasoe-Maeda Station\u0027 and walk for about 15 minutes; or drive about 25 minutes from downtown Naha."}, {"address": "4-2-1 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Located right next to Ginowan Seaside Park and Okinawa Convention Center, Ginowan Tropical Beach is an iconic municipal beach in central Okinawa. It features powdery white sand and crystal-clear waters, with breakwaters keeping the sea calm\u2014making it ideal for families with young children. Well-equipped with barbecue facilities, shower rooms, and lifeguard duty, it attracts many visitors and locals every evening to admire stunning west coast sunsets. The setting sun paints the sky in vibrant shades of pink, purple, and gold against the deep blue sea, creating a perfect natural spot for a relaxing stroll and experiencing Okinawa\u0027s easygoing vibe.", "name": "Ginowan Tropical Beach", "transport": "Drive north along Route 58 from Naha Airport for about 35 minutes; or take Ryukyu Bus No. 99 to \u0027Okinawa Convention Center\u0027 stop and walk about 5 minutes."}, {"address": "1-27 Kakazu, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Situated on a hill in Ginowan City, Kakazu Takadai Park was a fierce battlefield during the World War II Battle of Okinawa. Today, it has been transformed into a scenic observation park blending historical education with natural lush greenery. The park preserves wartime pillboxes (bunkers) and memorials, with its most iconic landmark being a uniquely globe-shaped observatory. Climbing up to the observatory grants a 360-degree view over Ginowan City and the East China Sea, as well as a direct bird\u0027s-eye view of the runway and helicopter activity at the U.S. Marine Corps Air Station Futenma (MCAS Futenma)\u2014a popular site for history buffs, military enthusiasts, and photographers.", "name": "Kakazu Takadai Park", "transport": "Drive about 20-25 minutes from downtown Naha; or take Bus No. 55 to \u0027Kakazu\u0027 stop and walk for about 10 minutes."}, {"address": "4-2-1 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Ginowan Seaside Park is a large waterfront recreational park seamlessly connected to Ginowan Tropical Beach and the Okinawa Convention Center. Featuring expansive green lawns, picnic areas, an outdoor theater, and coastal walking trails, it is a favorite spot for locals to walk, jog, and host weekend family gatherings. It frequently hosts large outdoor concerts, fireworks festivals, and cultural events. Strolling along the seaside promenade lets you feel the gentle ocean breeze and enjoy sweeping views of the sea and sky, while nightfall reveals sparkling city lights across the bay, exuding a relaxed island-city atmosphere.", "name": "Ginowan Seaside Park", "transport": "Drive along Route 58 from downtown Naha for about 30 minutes; or take Bus No. 28 or 99 to \u0027Okinawa Convention Center\u0027 stop."}, {"address": "1-24-1 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located in the Mashiki district of Ginowan City, Morinokawa Park is an ancient park rich in mysterious folklore and lush natural vegetation. Its spring, \u0027Morinokawa\u0027, is considered the birthplace of Ryukyu\u0027s heavenly maiden legend (\u0027Hagoromo Legend\u0027). The freshwater spring still flows continuously today, surrounded by centuries-old banyan trees and vibrant subtropical plants, creating a serene and sacred ambiance. With stone-paved terraced paths and playground equipment, it is a hidden gem where you can escape the crowds, immerse yourself in traditional Ryukyuan sacred nature culture, and enjoy forest bathing.", "name": "Morinokawa Park", "transport": "Drive about 25 minutes from downtown Naha; or take a bus to \u0027Oyajana\u0027 bus stop and walk about 10 minutes."}, {"address": "1-18 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 3.9 stars | Located on the northern hills of Urasoe City, Izu Park is a spacious green park that combines ancient castle ruins (Izu Castle Ruins) with vibrant floral displays. The park is most famous for its spring azaleas, which cover the hillside in a sea of pink and purple blossoms, drawing crowds of flower lovers. An observation deck at the highest point offers unobstructed views of Urasoe City, Ginowan City, and the coastline of Chatan Town. Featuring shaded tree canopies and well-maintained loop trails, it is an ideal spot for seasonal flower viewing as well as year-round leisure hiking.", "name": "Izu Park", "transport": "Drive about 7 minutes from monorail \u0027Urasoe-Maeda Station\u0027, or about 25 minutes from downtown Naha."}, {"address": "2-41-1 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Perched on the elevated hills of Urasoe City, Urasoe Castle Ruins Park preserves the 14th-to-15th century political center of the Chuzan Kingdom of the Ryukyu Kingdom, blending rich historical heritage with natural beauty. The park houses the famous royal mausoleum \u0027Urasoe Yodore\u0027 alongside ancient stone wall ruins. Walking along shaded ancient paths, visitors can sense the deep atmosphere of the old Ryukyu capital. The observatory provides a stunning 270-degree panoramic view overlooking Urasoe City, the Makiminato coastline, and the Ginowan area. With captivating sunsets and night views, it is a cherished spot highly recommended for history and nature lovers alike.", "name": "Urasoe Castle Ruins Park", "transport": "Take the Okinawa Monorail to \u0027Urasoe-Maeda Station\u0027 and walk about 15 minutes; or drive about 20 minutes from downtown Naha."}, {"address": "1-35 Ahacha, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Tucked away in a lush valley in Urasoe City, Ahacha Bridge is a historic stone arch bridge built in the 16th century along the highway connecting Shuri Castle to northern Okinawa during the Ryukyu Kingdom period. Having withstood centuries of weather, this ancient double-arch stone bridge remains remarkably well-preserved. Surrounded by dense subtropical trees and a babbling stream, stepping onto the stone path feels like stepping back in time to ancient Ryukyu. With quiet stone-paved trails along the stream, fresh air, and sounds of running water and chirping birds, it is a serene hidden oasis full of cultural depth and natural rustic charm near Minatogawa.", "name": "Ahacha Bridge \u0026 Historical Trail", "transport": "Take the Okinawa Monorail to \u0027Kyozuka Station\u0027 or \u0027Urasoe-Maeda Station\u0027 and walk for about 15 minutes; or drive about 20 minutes from Naha."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2-chome Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Formerly a residential area for US military personnel and their families, Minatogawa Stateside Town features streets named after US states like Texas and Florida. Today, these former military quarters have been transformed into hipster lifestyle shops, handmade dessert cafes, specialty coffee shops, and chic boutique stores. Vintage mint green, sky blue, and crisp white exterior walls adorned with graffiti and American-style yards make every photo look like a magazine shoot\u2014a must-visit photo spot in the Urasoe area.", "name": "Minatogawa Stateside Town", "transport": "About a 30-minute drive from Naha Airport; or take Naha Bus No. 20, 28, or 120 to \u0027Izu\u0027 stop and walk for about 10 minutes."}, {"address": "No. 18, 2-17-1 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in Minatogawa Stateside Town, oHacort\u00e9 is Okinawa\u0027s most famous handmade fruit tart specialty shop. Housed in a charmingly converted former military quarter, it features a cozy wooden garden and rustic country-style decor. Using seasonal fresh fruits atop buttery, crispy crusts, each tart resembles a miniature work of art. Enjoying afternoon tea in the cozy wooden cottage or sunlit garden with their signature tarts is an iconic dessert experience that every visitor to Urasoe shouldn\u0027t miss.", "name": "oHacort\u00e9 Minatogawa Main Store", "transport": "Located in Minatogawa Stateside Town, about an 8-minute walk from \u0027Izu\u0027 bus stop. Dedicated parking available in front of the store."}, {"address": "No. 25, 2-16-2 Minatogawa, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Houki Boshi (\u0027Shooting Star\u0027) is Okinawa\u0027s first brown sugar canel\u00e9 specialty shop, crafting delicious bite-sized canel\u00e9s with local Tarama Island brown sugar and fresh local ingredients. The vibrant royal blue and fresh white storefront with its cute star emblem and clean wooden aesthetic draws countless photography lovers. Crisp on the outside and soft inside with a rich brown sugar aroma, packaged in stylish gift boxes, it\u0027s a delightful treat for both the eyes and palate.", "name": "Houki Boshi Minatogawa Main Store", "transport": "Located in Minatogawa Stateside Town, about a 10-minute walk from \u0027Izu\u0027 bus stop when taking a bus from central Naha."}, {"address": "4-9-1 Makiminato, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A\u0026W is an iconic American fast-food chain unique to Okinawa, and the Makiminato branch in Urasoe is its most retro, nostalgia-filled flagship store. It preserves a 1950s classic \u0027Drive-in\u0027 ordering area complete with towering neon signs, vintage classic cars, and a retro outdoor playground. At night, the glowing neon lights add a touch of romance, making it feel like stepping back into 1950s California\u2014an absolute must-visit spot for vintage Americana lovers.", "name": "A\u0026W Makiminato", "transport": "About a 25-minute drive north from central Naha along Route 58; or take Bus No. 20 or 28 to \u0027Uchidomari\u0027 stop and walk for about 3 minutes."}, {"address": "13-1 Izu, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Urasoe Park is a massive public park combining historical ruins with modern family-friendly facilities. Its biggest highlight is the exhilarating 90-meter-long roller slide, offering thrilling rides with panoramic views of Urasoe City and the azure sea. The park is also home to historical treasures like the Urasoe Castle Ruins from the First Sho Dynasty and the \u0027Urasoe Gokuraku-ryo\u0027 mausoleum. With spacious lawns, stunning viewpoints, and diverse attractions, it\u0027s a favorite spot for families and photographers alike.", "name": "Urasoe Park", "transport": "About a 35-minute drive from Naha Airport; or take the Okinawa Urban Monorail to \u0027Urasoe-Maeda\u0027 Station and walk for about 15 minutes."}, {"address": "4-2-1 Mashiki, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Situated next to the Okinawa Convention Center, Ginowan Tropical Beach is famous for its soft white sand and crystal-clear turquoise waters. Equipped with top-notch amenities, it features BBQ areas, water sports, and safe swimming zones. The beach\u0027s quintessential photo opportunity comes at sunset, when golden light paints the winding seawall and swaying palm silhouettes, creating a breathtaking tropical scene beloved by couples and sunset seekers.", "name": "Ginowan Tropical Beach", "transport": "About a 30-minute drive from central Naha; or take Bus No. 55 or 99 to \u0027Ginowan Kyujo-mae\u0027 or \u0027Convention Center-mae\u0027 stop and walk for about 5 minutes."}, {"address": "1-5 Kakazu, Ginowan City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Perched atop a hill in Ginowan City, Kakazu Takadai Park was a fierce battlefield during the Battle of Okinawa in WWII, now transformed into a serene memorial park. At the summit sits a uniquely designed globe-shaped observation deck offering a 360-degree panoramic view of Ginowan City and the East China Sea, as well as a direct bird\u0027s-eye view of the runways at US Marine Corps Air Station Futenma. The iconic globe dome and sweeping vistas make it a popular landmark for photography.", "name": "Kakazu Takadai Park", "transport": "About a 30-minute drive from Naha Airport; or take Bus No. 25 or 90 to \u0027Kakazu\u0027 stop and walk for about 10 minutes."}, {"address": "1-9-2 Nakama, Urasoe City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Urasoe Art Museum is Japan\u0027s first public art museum dedicated to lacquerware. Its architectural design creatively blends traditional Ryukyuan lacquerware motifs with octagonal Islamic-inspired domes. The striking red-tiled roofs and geometric towers pop dramatically against the blue sky, surrounded by lush gardens and outdoor sculptures. Whether admiring priceless historical Ryukyu lacquer artifacts indoors or snapping chic photos along the geometric corridors and playing with light and shadow, it offers a deeply rich aesthetic experience.", "name": "Urasoe Art Museum", "transport": "About a 35-minute drive from Naha Airport; or take the monorail to \u0027Urasoe-Maeda\u0027 Station and walk for about 15 minutes."}], "name": "Popular Photo Spots"}}, "name": "Urasoe Minatogawa District and Ginowan"}};
        const cityName = "Okinawa";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
