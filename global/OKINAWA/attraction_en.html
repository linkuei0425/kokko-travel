and azure waters. It is one of the most iconic romantic wedding chapels on the Motobu Peninsula, brimming with sacredness and artistic ambiance.", "name": "Chapel Canoviano Okinawa", "transport": "About a 100-minute drive from Naha Airport, or take the Yanbaru Express Bus directly to the hotel."}, {"address": "871-1 Ohama, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A cultural museum dedicated to documenting and showcasing Motobu Town\u0027s unique maritime culture, natural beauty, and local history. The museum exhibits artifacts and gear from traditional local whaling and skipjack tuna fishing, folk festival props, and precious historical photos. Ideal for travelers wishing to delve deep into the cultural roots and fishing village heritage of the Motobu Peninsula.", "name": "Motobu Town Historical Museum", "transport": "About a 5-minute drive from Motobu Port, or take Bus No. 111/117 from Naha, get off at \u0027Motobu Town Office\u0027, and walk for about 8 minutes."}, {"address": "4-1-1 Onaka, Nago City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A permanent museum located in Nago City, the gateway to the Motobu Peninsula, themed around \u0027Hokuzan Life Intertwined with Mountains, Sea, and People.\u0027 It features an extensive collection of mountain hunting gear, Nago Bay whaling boats, traditional Ryukyuan crafts, and natural ecology specimens. Nostalgic and culturally rich, it serves as a vital bridge connecting Yanbaru nature with northern folk culture.", "name": "Nago Museum", "transport": "Take Bus No. 20/120 from Naha Bus Terminal, get off at \u0027Nagojoguchi\u0027 stop, and walk for about 5 minutes."}, {"address": "2-14-1 Tancha, Motobu Town, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | A peaceful Catholic church nestled in the heart of Motobu Town, offering a tranquil sanctuary for spiritual reflection for local parishioners and visitors alike. The building is simple and understated, blending local Okinawan stonework aesthetics with traditional cross design. Set in serene, elegant surroundings, it embodies a solemn, reverent religious beauty distinct from resort wedding chapels.", "name": "Motobu Catholic Church", "transport": "About a 6-minute drive from Motobu Port, or take a bus to the \u0027Toguchi\u0027 stop and walk for about 5 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "424 Ishikawa, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Built to commemorate the 1975 Okinawa International Ocean Exposition, this massive national park features expansive grounds with completely free admission. Beyond the famous Churaumi Aquarium, the park houses a tropical botanical garden, an Oceanic Culture Museum, and a recreated traditional Ryukyu village. Vast lawns meet the azure ocean to create breathtaking natural scenery, with alpine and tropical plants blooming across all four seasons. Perfect for family strolls while taking in grand views of Iejima Island.", "name": "Ocean Expo Park", "transport": "Take the highway bus (No. 117 or Yanbaru Express) from Naha Airport and get off at \u0027Kinenkoen-mae\u0027 (Ocean Expo Park) stop."}, {"address": "Bise, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located near Ocean Expo Park, this windbreak trail radiates rustic Ryukyu charm. Thousands of centuries-old Fukugi trees form lush, shady canopy tunnels stretching for kilometers. Dappled sunlight filters through the dense foliage while cool ocean breezes sweep through. Stroll through to soak in the relaxed rural atmosphere, or explore via a traditional water buffalo cart or rental bicycle\u2014an ideal spot to experience traditional Okinawan living in harmony with nature.", "name": "Bise Fukugi Tree Road", "transport": "About a 5-minute drive or 15-minute walk from Okinawa Churaumi Aquarium."}, {"address": "Bise, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Situated at the tip of the Bise Fukugi Tree Road, this coastal cape is one of Motobu Peninsula\u0027s top spots for tidepooling and snorkeling. At low tide, the rock pools fill with rich marine life, including tropical fish, sea urchins, and colorful corals, making it fantastic for family eco-exploration. Look across the water to spot the distinctive Mount Gusuku on Iejima Island, and stay until dusk for a breathtaking, hidden sunset photo spot.", "name": "Cape Bise (Bisezaki)", "transport": "Walk all the way to the end of Bise Fukugi Tree Road. Paid parking is available."}, {"address": "424 Ishikawa, Motobu-cho, Kunigami-gun, Okinawa Prefecture (Inside Ocean Expo Park)", "feature": "\u2b50 4.4 stars | Located at the northern tip of Ocean Expo Park, this natural beach boasts exceptional water quality, earning the highest rating in Japan\u0027s \u0027100 Best Bathing Beaches\u0027. The vibrant blue-green waters shimmer like emeralds against fine white sand. Divided into three designated zones\u2014Resting, Viewing, and Play\u2014it features well-maintained breakwaters and safety nets for a safe, sun-filled day of swimming and water activities.", "name": "Emerald Beach", "transport": "About a 10-minute walk from the central entrance of Ocean Expo Park, or take the park shuttle tram."}, {"address": "921-2 Namizato, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Rising about 453 meters above sea level, Mount Yae is Okinawa Island\u0027s premier cherry blossom destination, hosting Japan\u0027s earliest cherry blossom festival every year from mid-January to early February. Over 7,000 deep-pink Kanhizakura trees line the winding mountain road, creating a vibrant floral tunnel. The summit observation deck offers sweeping panoramic views of Motobu Peninsula\u0027s rolling hills and ocean horizons.", "name": "Mount Yae Sakura Park", "transport": "About a 40-minute drive from Kyoda IC. Driving up the mountain road is recommended to enjoy the blossoms."}, {"address": "Border of Nago City and Motobu-cho, Okinawa Prefecture (Trailhead located at Mount Katsuudake Trailhead Parking Lot)", "feature": "\u2b50 4.3 stars | Standing at 452 meters tall, Mount Katsuudake offers one of the Motobu Peninsula\u0027s most iconic hiking trails, renowned for its ancient karst limestone formations. The path is surrounded by dense subtropical virgin forest; while the scramble up features rocky inclines, the summit rewards hikers with an unfettered 360-degree panorama overlooking Nago Bay, Haneji Inland Sea, and the dramatic coastline.", "name": "Mount Katsuudake", "transport": "Driving is recommended; about a 25-minute drive from downtown Nago to the trailhead parking lot."}, {"address": "5583-1 Sesoko, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located on the western side of Sesoko Island\u2014connected by a bridge to Motobu Town\u2014this beach spans 800 meters of pristine white sand and crystal-clear waters. With natural coral reefs just offshore, it is a world-class destination for snorkeling and tropical fish watching. Facing west toward the East China Sea, it offers sunny afternoons on the sand followed by breathtaking sunset glows at dusk.", "name": "Sesoko Beach", "transport": "About 10 minutes by car after crossing Sesoko Bridge. Large paid parking lot available."}, {"address": "Gushiken, Motobu-cho, Kunigami-gun, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A hidden natural beach tucked away in Motobu\u0027s Gushiken area, far from tourist crowds and preserved in its untouched wild state. Uniquely shaped Ryukyu limestone rock formations dot the sand, contrasting with clear blue-green waters to create a secluded paradise. A local secret for relaxing and taking in unobstructed sunsets, ideal for travelers seeking quiet immersion in Okinawa\u0027s natural seaside beauty.", "name": "Gushiken Beach", "transport": "About a 15-minute drive from central Motobu. Turn off National Route 505 onto the coastal lane."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "424 Ishikawa, Motobu, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | The world-renowned giant main tank, \u0027Kuroshio Sea,\u0027 is the breathtaking centerpiece of Okinawa Churaumi Aquarium, featuring a massive acrylic panel measuring 35 meters wide and 8.2 meters high. Standing before the tank, watching gigantic whale sharks and manta rays glide gracefully through the deep blue world feels like being transported underwater. The daily scheduled feeding shows are an absolute must-see highlight\u2014the sight of whale sharks feeding vertically is visually stunning, making this the number one photo spot when visiting the Motobu Peninsula.", "name": "Okinawa Churaumi Aquarium - Kuroshio Sea", "transport": "Take the Yanbaru Express Bus or Express Bus No. 117 from Naha Airport and get off at the \u0027Kinenkoen-mae\u0027 (Ocean Expo Park) stop."}, {"address": "Kouri, Nakijin, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Spanning approximately 1,960 meters to connect Yagaji Island and Kouri Island, Kouri Bridge stretches across the stunningly translucent \u0027Kouri Blue\u0027 ocean. Driving across the bridge surrounded by gradient turquoise waters and the distant horizon feels like floating on a highway over the sea, offering unmatched, breathtaking views. The observation deck and beach near the bridge entrance are prime photography locations, perfect for capturing panoramic shots of the grand bridge stretching toward the island.", "name": "Kouri Bridge", "transport": "About a 1.5 to 2-hour drive from Naha city via Kyoda IC, Route 58, and Prefectural Route 110."}, {"address": "2 Kouri, Nakijin, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Located on Tinu Beach on the northern side of Kouri Island, these two naturally formed sea-eroded rocks are famous across Japan for resembling two overlapping or side-by-side hearts. The spot exploded in popularity as a romantic photo landmark after featuring in a famous idol group\u0027s commercial. As the sun sets, casting a golden glow over the Heart Rocks and splashing waves, the scene becomes deeply poetic, attracting countless couples and photography enthusiasts.", "name": "Heart Rock at Tinu Beach", "transport": "After crossing Kouri Bridge, drive north along the island ring road for about 5 minutes to reach the parking lot, followed by a 3-minute walk to the beach."}, {"address": "Bise, Motobu, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located right next to Okinawa Churaumi Aquarium, the Bise district preserves over a thousand centuries-old Fukugi trees, forming a 1,000-meter-long green windbreak tunnel. Walking through the path, dappled sunlight filters through dense green leaves, creating a rustic, tranquil, and healing atmosphere. Visitors can stroll, rent a bicycle, or take a water buffalo cart ride through the tree canopy and traditional Ryukyu residences leading to the blue coastline\u2014a perfect spot for capturing charming, artistic photos.", "name": "Bise Fukugi Tree Road", "transport": "About a 3-minute drive or a 15-minute walk from Okinawa Churaumi Aquarium to the entrance."}, {"address": "5101 Imadomari, Nakijin, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | A UNESCO World Heritage site, the Nakijin Castle Ruins were the residence of the King of Hokuzan during the 14th-century Sanzan period of Ryukyu history, famous for its grand, beautifully curved ancient stone walls. The walls follow the undulating contours of the hills, and standing at the top offers sweeping views of the northern coastline and surrounding primeval forest. From late January to early February, it becomes Okinawa\u0027s most famous cherry blossom spot, where blooming Kanhi cherry blossoms and evening light shows create a romantic scene blending history and beauty.", "name": "Nakijin Castle Ruins", "transport": "About a 1.5-hour drive from Naha Airport, or take Bus No. 66 from Nago Bus Terminal and get off at \u0027Nakijincastle Entrance\u0027."}, {"address": "538 Kouri, Nakijin, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Perched on a high point of Kouri Island at an elevation of 82 meters, Ocean Tower is the premier observatory for taking in panoramic views of Kouri Bridge and the magnificent coral reefs. Upon entry, visitors ride an automated, themed golf cart to the main building while enjoying a meticulously landscaped subtropical garden along the way. Inside, there\u0027s a shell museum displaying over 10,000 shells from around the world, while the top floor observatory offers an unobstructed 360-degree view of the ocean and clear blue sky, making it an extremely popular photography destination.", "name": "Kouri Ocean Tower", "transport": "After crossing Kouri Bridge, follow the signs and drive about 3 minutes to reach the Ocean Tower complex."}, {"address": "Sakimotobu, Motobu, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located along the coast of Sakimotobu in Motobu Town, this unique rock formation earned its name \u0027Gorilla Chop\u0027 because it resembles a massive gorilla preparing to chop the ground with its palm. Not only is it a paradise for snorkeling and diving enthusiasts, but its crystal-clear waters and fun rock backdrop also make it a viral, fun photo spot on social media. Whether diving in to explore rich coral reef ecosystems or taking quirky photos with the rock formation, it is highly recommended.", "name": "Gorilla Chop", "transport": "Drive north from Nago city along Route 449 for about 15 minutes; located in front of Sakimotobu Ryokuchi Park."}, {"address": "Bise, Motobu, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located at the end of the Bise Fukugi Tree Road, Biseazaki is a natural cape projecting into the ocean at the northernmost tip of the Motobu Peninsula. It boasts ultra-clear ocean waters and well-developed natural rock reef formations that create numerous tide pools at low tide, allowing close-up observation of tropical fish and sea urchins. Standing on the shore with the deep blue sea and Ie Island\u0027s Mount Gusuku in the background, the sunset view is breathtakingly beautiful\u2014making it a premier photo spot to capture Okinawa\u0027s raw, natural beauty.", "name": "Biseazaki Coast", "transport": "Drive or walk to the northernmost end through the Bise Fukugi Tree Road to reach Biseazaki Coast Park."}], "name": "Popular Photo Spots"}}, "name": "Motobu Peninsula and Churaumi Aquarium"}, "naha_kokusai": {"categories": {"cat_1": {"items": [{"address": "3-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Shurijo Castle was once the political, diplomatic, and cultural center of the Ryukyu Kingdom, showcasing a unique Ryukyuan architectural art style that blends Chinese Ming and Qing architectural elements with Japanese woodworking technology. Although the main hall suffered a tragic fire in 2019, an active and elaborate reconstruction project is currently underway. The park has opened an observation path, allowing visitors to witness up close the precious process of traditional artisans using ancient methods to restore this historic heritage. Standing by the elevated Kankaimon and Kohokumon gates, visitors can also overlook the entire Naha cityscape and distant ocean views. It is an indispensable landmark for gaining a deep understanding of the Ryukyu Kingdom\u0027s centuries of glorious history.", "name": "Shurijo Castle Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 15 minutes; or transfer to a local city bus and get off at the Shurijo-koen-mae (Shurijo Castle Park Entrance) stop."}, {"address": "1-1 Shuri Mawashi-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Shureimon Gate is an iconic landmark of Shurijo Castle and the central motif featured on the Japanese 2,000-yen banknote. Built in the 16th century during the reign of King Sho Sei of the Ryukyu Kingdom, this paifang-style wooden structure bears a plaque reading \u0027Shurei no Kuni\u0027 (Land of Propriety), symbolizing the nation\u0027s spirit of courtesy and respect. Heavily influenced by Chinese paifang architecture, it integrates Ryukyu\u0027s signature red-tiled eaves and delicate carvings, exhibiting immensely high historical and artistic value. It is the most popular spot for souvenir photos when visiting Shurijo Castle.", "name": "Shureimon Gate", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station, then walk for about 15 minutes to reach Shureimon Gate at the entrance of Shurijo Castle."}, {"address": "1-3 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Built in 1501 by King Sho Shin of the Second Sho Dynasty of the Ryukyu Kingdom, Tamaudun is a grand royal mausoleum designated as a UNESCO World Heritage Site. Constructed entirely of Ryukyuan limestone, this massive stone complex simulates the layout of the Shurijo Castle palace, divided into central, eastern, and western chambers, with intricately carved and mystical stone lions guarding the entrance. The grounds also feature an underground museum displaying unearthed funerary urns and rare artifacts, offering an excellent perspective on Ryukyuan royal burial customs and stone masonry craft.", "name": "Tamaudun Mausoleum", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 15 minutes (located on the west side of Shurijo Castle Park)."}, {"address": "421-7 Maaji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Built in 1799, Shikinaen Garden served as a royal villa for the Ryukyu kings and a guesthouse for entertaining Chinese imperial envoys (Sapposhi). It is a UNESCO World Heritage Site featuring a stroll-style garden design that ingeniously blends Chinese Jiangnan-style stone bridges and hexagonal pavilions with Japanese hill-and-pond landscaping, while extensively incorporating local Ryukyuan limestone and red-tiled structures. Strolling along the lakeside wooden boardwalks and between rustic red-tiled royal halls, visitors can experience serene seasonal landscapes and the unique refined leisure style of Ryukyuan royalty.", "name": "Shikinaen Garden", "transport": "From Naha Bus Terminal, take the Arakawa Line (No. 14) or Shikina Kainan Line (No. 2) bus and get off at the Shikinaen-mae stop."}, {"address": "1-25-11 Wakasa, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Naminoue Shrine holds the highest rank among the Eight Shrines of Ryukyu and has been a sacred place since ancient times for praying for safe voyages, bountiful harvests, and national prosperity. Built atop a massive coral reef cliff facing the East China Sea, the shrine\u0027s vermilion main hall creates a striking and stunning contrast with the azure ocean below. Visitors can pray for blessings and purchase protective charms (omamori), or gaze up at the majestic shrine perched on the cliff from nearby Naminoue Beach, experiencing Okinawa\u0027s unique blend of natural beauty and spiritual heritage.", "name": "Naminoue Shrine", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Asahibashi Station and walk for about 15 minutes; or take a city bus and get off at the Naminoue-guji-mae stop."}, {"address": "2-29-19 Kume, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in the Kume district of Naha City, Fukushuen Garden was built in 1992 to commemorate the 10th anniversary of the sister-city partnership between Naha and Fuzhou, China. Historically, Kume was a settlement for Chinese immigrants (the 36 Families of Fujian). Fukushuen adopts traditional Fujian garden architecture, using timber and stone sourced directly from Fuzhou and constructed under the guidance of Fuzhou artisans. The garden features miniature landscapes representing Fuzhou\u0027s iconic \u0027Three Mountains, Two Pagodas, and One River\u0027, waterfalls, pavilions, and carved stone arch bridges, exhibiting an elegant Chinese garden aesthetic.", "name": "Fukushuen Garden", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Kencho-mae Station and walk for about 10 minutes."}, {"address": "2-Chome Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | The Kinjo-cho Stone-paved Path is a preserved section of the historic Madama-michi road that connected Shurijo Castle to southern regions during the ancient Ryukyu Kingdom, built in the 16th century under King Sho Shin. Spanning roughly 300 meters, this steep path paved with Ryukyuan limestone has acquired a soft, weathered patina over centuries. Rustic red-tiled traditional residences and stone walls line both sides. Along the way stands a sacred Bishop Wood tree over 300 years old. Strolling here feels like stepping back in time to experience old Naha\u0027s quiet and nostalgic Ryukyuan charm.", "name": "Kinjo-cho Stone-paved Path", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk about 15 to 20 minutes to reach the path\u0027s entrance."}, {"address": "1-11-1 Tomari, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Sogenji Temple was the state royal temple for the monarchs of the Second Sho Dynasty of the Ryukyu Kingdom, originally built in the 15th century during the reign of King Sho Shin. Although the main wooden temple structure was destroyed during the Battle of Okinawa in WWII, the grand triple-arched stone gate and surrounding Ryukyuan limestone walls miraculously survived and are designated as a National Important Cultural Property of Japan. The stone gate demonstrates exquisite Ryukyuan arch masonry, and the lush banyan trees with sprawling roots inside the grounds evoke a peaceful, timeless historical atmosphere.", "name": "Sogenji Temple Stone Gate", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Miebashi Station and walk for about 8 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-1-1 Ameku, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Also known as Okimu, this is the largest comprehensive cultural facility in Okinawa Prefecture. The building\u0027s exterior blends Ryukyuan castle wall styles with modern minimalism, constructed using native Ryukyu limestone. The museum section provides detailed exhibits on Okinawa\u0027s nature, history, and folklore from the Ryukyu Kingdom period, through the U.S. administration era, up to modern times. The art museum section showcases modern and contemporary works by artists with deep ties to Okinawa. Featuring hands-on interactive rooms and a unique cultural souvenir shop, it is a must-visit destination for exploring Ryukyuan culture.", "name": "Okinawa Prefectural Museum \u0026 Art Museum (Okimu)", "transport": "About a 10-minute walk from Omoromachi Station on the Okinawa Urban Monorail (Yui Rail)"}, {"address": "4F, 1-1-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Conveniently located on the 4th floor of the Palette Kumoji department store at the start of Kokusai-dori in downtown Naha. The museum houses precious artifacts from the Sho family, the royal dynasty of the Ryukyu Kingdom, including National Treasures such as royal attire, lacquerware, paintings, and ancient documents. Through refined displays and multimedia presentations, visitors can quickly understand Naha\u0027s history as it evolved from an ancient trading port into a vibrant modern city. It is a fantastic cultural stop while shopping.", "name": "Naha City Historical Museum", "transport": "About a 2-minute walk via the connecting walkway from Kenchomae Station on the Okinawa Urban Monorail (Yui Rail)"}, {"address": "1-9-32 Tsuboya, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Situated at the entrance of nostalgic Tsuboya Yachimun Street, this museum is dedicated to the history and craft of \u0027Tsuboya-yaki,\u0027 Okinawa\u0027s traditional pottery. The collection features rustic, exquisite ceramic masterpieces dating back to the Ryukyu Kingdom era, replicas of ancient climbing kilns, and pottery tools, alongside documentary films showing master artisans at work. The permanent exhibition fully presents the evolution of Okinawan ceramics, and audio guides are available on-site for visitors strolling down Tsuboya Street to deeply appreciate local craft aesthetics.", "name": "Naha Municipal Tsuboya Pottery Museum", "transport": "About a 10-minute walk from Makishi Station on the Okinawa Urban Monorail (Yui Rail)"}, {"address": "2F, 3-2-10 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Located on the 2nd floor of the Tenbusu Naha building in the heart of Kokusai-dori, this center combines exhibitions, hands-on workshops, and retail. It showcases Naha\u0027s five major traditional crafts: Bingata dyed textiles, Tsuboya pottery, Ryukyu lacquerware, Ryukyu glass, and Shuri-ori weaving. Visitors can admire masterworks up close and book hands-on DIY workshops such as glassblowing, Bingata dyeing, or pottery making to craft their own unique Okinawan souvenir.", "name": "Naha City Traditional Arts and Crafts Center", "transport": "About a 5-minute walk from Makishi Station on the Okinawa Urban Monorail (Yui Rail)"}, {"address": "1-1-1 Wakasa, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located near Naminoue Shrine and Naminoue Beach, this memorial museum honors WWII history. It solemnly documents the tragic sinking of the Tsushima-maru in 1944, an evacuation ship carrying hundreds of schoolchildren attacked by a submarine. Exhibiting personal belongings of victims, classroom replicas, survivor video testimonials, and rare photographs, the atmosphere is quiet and reverent. Dedicated to conveying the priceless value of peace, it is a deeply educational and humanistic historic site.", "name": "Tsushima-maru Memorial Museum", "transport": "About a 15-minute walk from Kenchomae Station on the Okinawa Urban Monorail (Yui Rail), or take a city bus and get off at \u0027Wakasa\u0027 stop"}, {"address": "1-22-12 Izumizaki, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located in the Kainan district of Naha, this is the cathedral of the Roman Catholic Diocese of Naha. Built during the post-war reconstruction era, the architecture blends Western Gothic Catholic elements with local storm-resistant Okinawan design. The sanctuary interior features high, elegant ceilings, colorful stained glass, and a solemn main altar. When sunlight filters through the stained glass, it creates a serene and sacred atmosphere, making it a landmark church rich in both faith and architectural art.", "name": "Kainan Catholic Cathedral", "transport": "About an 8-minute walk from Asahibashi Station on the Okinawa Urban Monorail (Yui Rail)"}, {"address": "1-54 Shuriyamakawa-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located at the foot of historic Shuri Castle, this cultural center combines a textile art museum with the preservation of traditional craft traditions. It pioneered \u0027Coral Dyeing,\u0027 a unique technique using natural coral fossil cross-sections that symbolize happiness and prosperity. The first floor displays vintage dyeing tools and valuable craft antiques, while the second and third floors host workshops and hands-on DIY areas, drawing arts-and-crafts enthusiasts to experience the unique charm of Okinawan art.", "name": "Shuri Ryusen Cultural Art Center", "transport": "About a 15-minute walk from Shuri Station on the Okinawa Urban Monorail (Yui Rail), or take a city bus and get off at \u0027Shurijo-koen-iriguchi\u0027 stop"}, {"address": "2-16-1 Kumoji, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in the bustling Kumoji commercial district of Naha, this church boasts over a century of missionary history and is one of Okinawa\u0027s most representative Protestant churches. Rebuilt after WWII, its exterior features sleek, minimalist lines blending modern architecture with local stone elements, while the sanctuary interior offers a warm, peaceful sanctuary. Serving as both a gathering space for local believers and a quiet urban retreat, its geometric aesthetics and rich history attract architecture and history enthusiasts alike.", "name": "Naha Church of United Church of Christ in Japan", "transport": "About a 5-minute walk from Miebashi Station on the Okinawa Urban Monorail (Yui Rail)"}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "3-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Perched on the hills of eastern Naha, Shurijo Castle Park was the political and cultural heart of the Ryukyu Kingdom. Surrounded by magnificent Ryukyuan limestone walls, the park preserves historical sites such as Kankaimon and Shureimon gates, alongside lush greenery and precious tropical flora. From the park\u0027s elevated observation deck, you can enjoy sweeping panoramic views of downtown Naha and the sparkling blue ocean\u2014a must-visit destination combining rich history with stunning natural scenery.", "name": "Shurijo Castle Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 15 minutes."}, {"address": "2-29-19 Kume, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Fukushuen Garden is a traditional Chinese garden built to commemorate the 10th anniversary of sister-city relations between Naha and Fuzhou, China. Crafted using timber and stone imported directly from Fuzhou, it blends the Jiangnan landscape garden styles of the Ming and Qing dynasties. Featuring charming bridges, trickling streams, dramatic rock formations, a three-tiered waterfall, and quaint pavilions, the garden blooms with seasonal flowers year-round. Strolling along the lakeside paths offers a tranquil escape wrapped in classical Oriental aesthetics.", "name": "Fukushuen Garden", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Kenchomae Station\u0027 and walk for about 10 minutes."}, {"address": "1-1 Yogi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Located in central Naha near Kokusai Dori, Yogi Park is an urban oasis and one of Okinawa\u0027s most iconic cherry blossom viewing spots. Hundreds of Kanhizakura (Taiwan cherry trees) line the riverbanks; during peak bloom in mid-February, the entire park is wrapped in a vibrant sea of deep pink, accompanied by a lively Cherry Blossom Festival. With wide palm-lined paths, expansive lawns, and play areas for kids, it\u0027s a popular spot for both locals and tourists to enjoy sunny outdoor leisure.", "name": "Yogi Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Asato Station\u0027 and walk for about 15 minutes, or take a city bus to \u0027Yogi Jujiro\u0027 bus stop."}, {"address": "1-25-11 Wakasa, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | As the only natural beach in downtown Naha, Naminoue Beach sits right below the dramatic cliffside Naminoue Shrine. Featuring crystal-clear waters, the adjacent seaside park offers beautifully landscaped walking paths and elevated viewing platforms. Here, visitors can marvel at the striking cliffside temple views while relaxing on the sand, taking in the ocean breeze and breathtaking sunsets right in the heart of the city.", "name": "Naminoue Beach \u0026 Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Asahibashi Station\u0027 and walk for about 15 minutes."}, {"address": "52 Onoyama-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Ounoyama Park is a sprawling multi-purpose sports and recreational park in Naha, housing historic shrines like Oki Shrine and Gokoku Shrine alongside extensive sports complexes and playgrounds. Extending along the Kokuba River, the tree-shaded park boasts multi-kilometer running tracks and a massive treehouse slide loved by kids. It is an ideal place to enjoy waterfront views, go for a workout, or simply experience the relaxed pace of local life.", "name": "Ounoyama Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Ounoyama-koen Station\u0027 or \u0027Tsubogawa Station\u0027; the park is right outside the station."}, {"address": "1-1 Mekaru, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Located in the heart of the modern Naha Shindoshin commercial district, Shimmachi Park seamlessly integrates urban planning with expansive green spaces. The park features lush, open lawns and a circular walking/jogging track, seamlessly connecting to the adjacent Okinawa Prefectural Museum \u0026 Art Museum. Clean, spacious, and beautifully landscaped, it\u0027s the perfect spot to unwind and enjoy an urban oasis after a day of shopping.", "name": "Naha Shimmachi Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Omoromachi Station\u0027 and walk for about 5 minutes."}, {"address": "3-22 Kohagura, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Built around Lake Manko\u2014a wetland area designated under the Ramsar Convention\u2014Manko Park preserves a highly valuable wetland ecosystem. The park features well-maintained boardwalks and a wetland observation center, allowing visitors to closely observe lush mangrove forests, fiddler crabs, and various migratory birds on the city\u0027s edge. A stroll along the lakeside trails offers fresh air and serene, harmonious natural charm.", "name": "Manko Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Tsubogawa Station\u0027 and walk for about 10 minutes."}, {"address": "1-4 Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 3.9 stars | Tucked away just behind the bustling Kokusai Dori shopping district, Midorigaoka Park is a lush, gently rolling hilltop park. Shaded by ancient trees with sprawling roots, it features plenty of benches and basic recreational facilities. The peaceful atmosphere makes it a favorite spot for friendly street cats to sunbathe. For shoppers tired of the crowds on Kokusai Dori, this secret garden is the perfect place to cool off under the canopy and enjoy a quiet moment of nature.", "name": "Midorigaoka Park", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to \u0027Miebashi Station\u0027 and walk about 5 minutes through the side streets."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "3-1 Shuri Tonokura-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Shurijo Castle was the political and cultural center of the Ryukyu Kingdom, featuring architecture that seamlessly blends Chinese and Japanese castle styles. The vivid vermilion \u0027Shureimon Gate\u0027 is one of Naha\u0027s most iconic photo landmarks and was featured on the former 2,000-yen note. Although the main hall was damaged by a fire in 2019, open restoration facilities allow visitors to witness the rebirth of this historic site firsthand. The surrounding stone paths and observation decks offer breathtaking panoramic views of Naha City, making it a spectacular photo spot by day or sunset.", "name": "Shurijo Castle Park", "transport": "Take the Okinawa Monorail (Yui Rail) to \u0027Shuri Station\u0027 and walk for about 15 minutes."}, {"address": "1-25-11 Wakasa, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Revered as the chief guardian shrine of the region, Naminoue Shrine stands dramatically atop a high cliff right beside the turquoise ocean, making it a unique and powerful holy photo spot in Naha. Its red-tiled roof and vermilion pillars exhibit strong Ryukyuan shrine characteristics, attracting countless visitors praying for safe sea voyages and good fortune. Capturing a photo of the shrine from the nearby Naminoue Bridge showcases a stunning composition of the cliff, shrine, and vibrant sea, making it an unmissable iconic landmark.", "name": "Naminoue Shrine", "transport": "Take the Monorail to \u0027Asahibashi Station\u0027 and walk for about 15\u201320 minutes, or take a city bus and get off at \u0027Naminoue-gumu Mae\u0027 stop."}, {"address": "1-Chome Tsuboya, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Tsuboya Yachimun Street is a charming stone-paved avenue rich in nostalgia and artisan history, serving as the sanctuary for master potters since the Ryukyu Kingdom era. The rustic cobblestone path is lined with traditional red-tiled houses, stone walls, and unique Shisa (guardian lion-dogs) tucked into every corner. Today, it hosts trendy pottery workshops, curated lifestyle shops, and cozy cafes. Bursting with artistic ambiance and vintage flair, it is a paradise for photography lovers and cultural explorers.", "name": "Tsuboya Yachimun Street", "transport": "Take the Monorail to \u0027Makishi Station\u0027 and walk for about 8\u201310 minutes."}, {"address": "2-29-19 Kume, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Built to commemorate the 10th anniversary of the sister-city partnership between Naha and Fuzhou, China, Fukushuen is an authentic Chinese garden crafted using traditional Fuzhou landscaping techniques. The garden features charming bridges, flowing streams, dramatic rockeries, waterfalls, elegant pavilions, and classical covered walkways. Strolling through the grounds feels like stepping back into poetic ancient China\u2014a picturesque hidden gem in downtown Naha for stunning social media photos.", "name": "Fukushuen Garden", "transport": "Take the Monorail to \u0027Kenfucho-mae Station\u0027 (Prefectural Office Station) and walk for about 10 minutes."}, {"address": "3-1-1 Omoromachi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Commonly known as OkiMu, this landmark features a striking modern geometric facade constructed from white Ryukyu limestone, inspired by traditional Okinawan fortress walls (Gusuku). The imposing exterior under the bright blue sky creates a powerful visual impact, with dramatic plays of light and shadow attracting architecture enthusiasts and art lovers alike. The outdoor area also showcases traditional Ryukyuan houses and ancient crafts, beautifully blending modern aesthetics with rich history.", "name": "Okinawa Prefectural Museum \u0026 Art Museum (OkiMu)", "transport": "Take the Monorail to \u0027Omoromachi Station\u0027 and walk for about 10 minutes."}, {"address": "3-Chome Makishi, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | Positioned at the entrance of Naha\u0027s bustling Kokusai Dori shopping street and near the First Makishi Public Market, this giant Shisa (guardian lion-dog) statue is a must-snap photo landmark for first-time visitors to Okinawa. Stretching 1.6 kilometers, Kokusai Dori is vibrant with tropical murals, neon signs, and Okinawan culture. Posing with this impressive yet adorable giant Shisa is the ultimate \u0027I\u0027ve arrived in Naha!\u0027 photo ritual.", "name": "Kokusai Dori Giant Shisa", "transport": "Take the Monorail to \u0027Makishi Station\u0027 or \u0027Kenfucho-mae Station\u0027; Kokusai Dori is right outside the station."}, {"address": "Around 1-25-11 Wakasa, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Naminoue Beach is the only official swimming beach in Naha City, located just a short drive from downtown and Kokusai Dori. Its defining charm is the rare view blending clear blue waters and soft white sand with the oversea highway bridge and the cliffside Naminoue Shrine in the background. Whether you come to dip your feet in the water, relax on the sand, or catch the glowing sunset over the horizon, it is an ideal spot to capture tropical island vibes in the heart of the city.", "name": "Naminoue Beach", "transport": "Take the Monorail to \u0027Asahibashi Station\u0027 and walk for about 15 minutes, or take a city bus to \u0027Wakasa Kaihin Koen-mae\u0027."}, {"address": "1-2 Shuri Kinjo-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Built during the Ryukyu Kingdom era, the Kinjo-cho Stone-paved Road is a beautifully preserved historic trail selected as one of the \u0027100 Famous Roads in Japan\u0027. This winding path made of Ryukyu limestone is flanked by vintage red-tiled traditional homes and lush greenery, evoking a serene sense of timelessness. Walking along this quiet historic stone road offers a deep taste of old Ryukyu, making it a favored photo spot for capturing retro, cinematic landscapes.", "name": "Kinjo-cho Stone-paved Road", "transport": "Take the Monorail to \u0027Shuri Station\u0027 and walk for about 15\u201320 minutes."}], "name": "Popular Photo Spots"}}, "name": "Downtown Naha and Kokusai Street"}, "onna_yomitan": {"categories": {"cat_1": {"items": [{"address": "708-6 Zakimi, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.4 stars | Built in the early 15th century, Zakimi Castle Ruins is a UNESCO World Heritage site under the \u0027Gusuku Sites and Related Properties of the Kingdom of Ryukyu.\u0027 Designed and supervised by the renowned general Gosamaru, its castle walls feature unique undulating curves that demonstrate master-level arched stone construction techniques, making it a masterpiece of Ryukyuan stone architecture. Visitors can ascend the 125-meter-high stone walls to gaze across the East China Sea to Cape Zanpa. It is an extraordinary spot at sunset, filled with a deep sense of historic splendor.", "name": "Zakimi Castle Ruins", "transport": "About 60 minutes by car from Naha Airport, or take Bus No. 29 to \u0027Zakimi\u0027 stop and walk about 10 minutes."}, {"address": "1130 Yamada, Onna, Kunigami District, Okinawa", "feature": "\u2b50 4.1 stars | Ryukyu Mura is a cultural theme park dedicated to preserving and recreating the traditional culture of the ancient Ryukyu Kingdom. The park features century-old traditional Okinawan houses relocated from across the region (all registered Tangible Cultural Properties of Japan), with red-tiled roofs and stone walls radiating rustic charm. Visitors can enjoy dynamic Eisa drum dances and Sanshin music performances, try Awamori brewing, or experience traditional crafts, feeling as though they have stepped back in time into the old Ryukyu Kingdom.", "name": "Ryukyu Mura", "transport": "About 60 minutes by car from Naha Airport, or take Bus No. 120 (Nago Nishi Airport Line) to \u0027Ryukyu Mura\u0027 stop."}, {"address": "1861 Uza, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Located at the westernmost point of Okinawa Main Island, Cape Zanpa features a towering 31-meter chalk-white lighthouse, one of the few historic lighthouses in Okinawa open for climbing. Built in 1973 on a 30-meter-high sheer cliff, ascending to the top rewards you with a 360-degree panoramic view of the cobalt-blue ocean and dramatic coral coastline. Nearby stand the statue of Taiki, hero of the Ryukyu Great Trading Era, and a giant Shisa statue, making it a must-visit spot that seamlessly blends natural beauty and historical heritage.", "name": "Cape Zanpa Lighthouse", "transport": "About 70 minutes by car from Naha Airport, or take Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and transfer to a taxi for about 10 minutes."}, {"address": "1020-1 Takashiho, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.0 stars | Originally constructed as an outdoor set for the NHK historical drama \u0027Ryukyu no Kaze,\u0027 this park faithfully recreates the streets and Shuri Castle-style architecture of the 14th- and 15th-century Ryukyu Kingdom. Cobblestone paths, vermilion gates, and traditional red-tiled houses transport guests straight into ancient Ryukyu. With over 101 hands-on traditional craft activities available\u2014including glassblowing, Shisa painting, and wearing traditional Ryukyuan attire\u2014it is a fantastic destination to experience local history and craftsmanship.", "name": "Murasaki Mura Ryukyu Kingdom Theme Park", "transport": "About 65 minutes by car from Naha Airport, or take Bus No. 28 to \u0027Oki\u0027 stop and transfer to a taxi for about 5 minutes."}, {"address": "2653-1 Zakimi, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.3 stars | Nestled in the lush hills of Yomitan, this pottery village hosts dozens of ceramic workshops and galleries, making it Okinawa\u0027s quintessential center for traditional pottery. Its hallmark attraction is the historic \u0027Noborigama\u0027 (stepped climbing kiln), whose red-tiled roof spanning the hillside possesses striking architectural beauty. Strolling through greenery-lined paths filled with the subtle scent of wood-firing allows visitors to appreciate the profound heritage of Ryukyuan craft traditions and architecture.", "name": "Yachimun no Sato Pottery Village", "transport": "About 60 minutes by car from Naha Airport, or take Bus No. 29 to \u0027Zakimi\u0027 stop and walk about 15 minutes."}, {"address": "708-6 Zakimi, Yomitan, Nakagami District, Okinawa", "feature": "\u2b50 4.2 stars | Located adjacent to the Zakimi Castle Ruins, the Yuntanza Museum (formerly Yomitan Village History and Folklore Museum) is a key cultural landmark showcasing the rich history, nature, and archaeology of Yomitan. Exhibits include detailed models of Zakimi Castle\u0027s construction, archaeological artifacts, WWII historical items, and traditional folk implements. The building\u0027s exterior gracefully combines modern design with traditional Ryukyuan stone masonry, making it an indispensable spot for an in-depth understanding of the region.", "name": "Yuntanza Museum", "transport": "About 60 minutes by car from Naha Airport; located right next to the entrance of Zakimi Castle Ruins."}, {"address": "Nakadomari, Onna, Kunigami District, Okinawa", "feature": "\u2b50 3.9 stars | A nationally designated historic site located in Nakadomari, Onna Village, this multi-layered archaeological complex spans from the Early Shell Mound Period to medieval Okinawa (approx. 1000 BC to present). The site includes cliff cave tombs, stone wall structures, and traces of prehistoric dwellings. Walking along the verdant historic trail allows visitors to see ancient rock-shelter homes adapted from the natural terrain thousands of years ago, offering incredible archaeological value and primitive historic charm.", "name": "Nakadomari Ruins", "transport": "About 50 minutes by car from Naha Airport, near the Ishikawa IC Interchange and Onna Seaside Park."}, {"address": "1656-8 Nakadomari, Onna, Kunigami District, Okinawa", "feature": "\u2b50 4.0 stars | Situated along the scenic coastline of Onna Village, this cultural institution documents and preserves the unique coastal and mountain heritage of Onna\u0027s west coast. Exhibits feature traditional fishing equipment, forestry and agricultural tools, Sabani dragon boat racing history, and the evolution of local coastal settlements. Standing right by the sea with elegant exhibition spaces, it serves as an insightful gateway to exploring the history and natural landscape of Onna.", "name": "Onna Village Museum", "transport": "About 50 minutes by car from Naha Airport, or take Bus No. 120 to \u0027Nakadomari\u0027 stop and walk about 3 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "708-6 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located next to the Zakimi Castle Ruins, this museum displays Yomitan Village\u0027s rich historical artifacts, folk tools, and precious works of traditional \"Yomitan-zan Hanaori\" textile craft. Through multimedia displays and physical exhibits, it provides an accessible introduction to the village\u0027s cultural evolution from ancient times to the present day, making it the perfect intellectual spot to learn about local Okinawan culture and craft traditions.", "name": "Yuntanza Museum (Yomitan Village Historical and Folklore Museum)", "transport": "About 60 minutes by car from Naha Airport; or take Bus No. 29, get off at \"Zakimi\" stop, and walk for about 10 minutes."}, {"address": "2653-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | An artistic village bringing together dozens of Okinawa\u0027s top ceramic artists and workshops. Strolling through the lush green village, you can see giant wood-fired climbing kilns (noborigama) featuring traditional red roof tiles, alongside a variety of pottery studios and shops full of unique personal flair. More than just a shopping destination, this is an open-air art museum showcasing contemporary Okinawan craft aesthetics and the inheritance of traditional techniques.", "name": "Yachimun no Sato (Yomitan Pottery Village)", "transport": "About 60 minutes by car from Naha Airport; or take a bus to \"Iramina\" stop and transfer to a taxi for about 10 minutes."}, {"address": "600 Gima, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Located beside the famous Zanpa Beach in Yomitan Village, this church boasts Gothic spires and grand white stone pillars, creating a breathtaking, pure white dream sanctuary. The interior features a panoramic glass wall looking out over the endless blue Pacific Ocean. As sunlight refracts through the crystal chandeliers to create brilliant rays, it showcases unique architectural craftsmanship and a romantic artistic atmosphere, making it a dream wedding venue for countless couples.", "name": "Lazor Garden Alivila Cristea Church", "transport": "About 70 minutes by car from Naha Airport via Route 58; or take the airport limousine bus bound for Hotel Nikko Alivila directly."}, {"address": "675 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Designed around the concept of \"Water and Greenery,\" this standalone wedding chapel is adjacent to Uza Beach. Featuring soft, elegant architectural lines and pure white exterior walls, the interior is adorned with a unique Ryukyu glass virgin road and towering crystal decorations. It perfectly merges traditional Okinawan glass craft with modern minimalist aesthetics, standing on the coastline like an elegant seaside work of art.", "name": "Aquagrace Chapel", "transport": "About 65 minutes by car from Naha Airport via Route 58; or take an airport shuttle bus and get off at hotels in the Yomitan Village area."}, {"address": "1656-8 Nakadomari, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Situated on the Onna Village coast, this museum takes \"Life and Nature of Onna Village\" as its core theme, showcasing rich west coast marine ecological heritage, ancient fishing gear, and historical documents from the Ryukyu Kingdom period. Equipped with interactive exhibits and a grand ocean-view observation deck, visitors can deeply explore the cultural and historical context of the west coast settlements while enjoying breathtaking sea views.", "name": "Onna Village Cultural Museum", "transport": "About 50 minutes by car from Naha Airport via the Okinawa Expressway (exit at Ishikawa IC); or take Bus No. 120 and get off at \"Nakadomari\" stop."}, {"address": "1550-1 Fuchaku, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located inside Hotel Monterey Okinawa Spa \u0026 Resort, this church features an exquisite British Victorian classical architectural style. A pure white Gothic spire soars into the sky, while the interior houses an infinity ocean-view glass altar and a classical pipe organ, oozing elegance and nobility. Its unique seaside promenade and European-style landscaped gardens make it feel like a Western art palace standing beside the azure ocean.", "name": "Monterey Lumer Church", "transport": "About 75 minutes direct by airport limousine bus to \"Hotel Monterey Okinawa Spa \u0026 Resort\"; or about 60 minutes by car."}, {"address": "66-1 Fuchaku, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located within a famous resort hotel in Onna Village, featuring a pier extending over the ocean and a standalone white chapel. The building utilizes wide-angle floor-to-ceiling glass facing the sea, and its interior design cleverly blends natural light and modern geometric aesthetics, seamlessly connecting the chapel\u0027s interior with the vibrant blue East China Sea\u2014a testament to exquisite modern coastal chapel architecture.", "name": "Art Grace Ocean Front Chapel", "transport": "About 50 minutes by car from Naha Airport via the Okinawa Expressway; or take Bus No. 120 and get off at \"Fuchaku\" stop."}, {"address": "2590 Nakama, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Perched on a hill inside the Okinawa Kariyushi Beach Resort Ocean Palace in Onna Village, this chapel is famous for its all-glass transparent dome structure. Offering a 360-degree panoramic view, it allows guests to soak in uninterrupted views of the Onna West Coast and azure skies. Resembling a giant crystal pyramid suspended between the mountains and the sea, it is a classic masterpiece blending architectural art with natural beauty.", "name": "Chapel Diamond Ocean", "transport": "About 70 minutes by car from Naha Airport via the Okinawa Expressway (exit at Kyoda IC); or take the Airport Limousine Bus directly to the hotel."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "2871 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located in Onna Village, Cape Manzamo is one of Okinawa\u0027s most iconic natural wonders, famous for its Ryukyu limestone cliff shaped like an elephant\u0027s trunk. The name \u0027Manzamo\u0027 originates from praise by King Sho Kei of the Ryukyu Kingdom, meaning \u0027a field where ten thousand people can sit.\u0027 Standing on the 20-meter-high cliff, you can overlook crystal-clear, deep blue waters and spectacular waves crashing against the rocks. It is also an extraordinary sunset spot, offering a deeply romantic and mesmerizing view as the golden evening rays illuminate the sea.", "name": "Cape Manzamo", "transport": "About 50 minutes by car from Naha Airport via the Okinawa Expressway (exit at Yaka IC); or take Ryukyu Bus No. 120 to \u0027Manzamo Iriguchi\u0027 stop and walk for about 10 minutes."}, {"address": "1861 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Situated at the westernmost tip of Yomitan Village, Cape Zanpa features a continuous 2-kilometer stretch of 30-meter-high sheer cliffs where powerful waves crash dramatically against the rock face. At the end of the cape stands a prominent white lighthouse\u2014one of the few in Okinawa open to the public for climbing, offering a 360-degree panoramic view of the East China Sea and surrounding coastline. Surrounded by rich coastal flora and uplifted coral reef formations, it is also a popular sunset vantage point to watch the sun sink below the horizon.", "name": "Cape Zanpa", "transport": "About 1 hour 10 minutes by car from Naha Airport; or take Okinawa Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and walk for about 30 minutes or transfer to a taxi."}, {"address": "469-1 Maeda, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Cape Maeda is a famous coastal cliff in Onna Village and home to the world-renowned snorkeling and diving paradise, the \u0027Blue Cave.\u0027 The observation deck at the cape offers sweeping views of the East China Sea and Onna\u0027s gorgeous coastline, while vibrant coral reefs and abundant marine life thrive underwater below. Even if you don\u0027t go diving, relaxing on the grassy park atop the cliff, feeling the ocean breeze, and watching the lively blue sea dotted with snorkelers is delightfully refreshing.", "name": "Cape Maeda", "transport": "About 50 minutes by car from Naha Airport via the Okinawa Expressway (exit at Ishikawa IC); or take Ryukyu Bus No. 120 to \u0027Kuraha\u0027 stop and walk for about 15 minutes."}, {"address": "708-6 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Perched on high ground in Yomitan Village, the World Heritage-listed Zakimi Castle Ruins are surrounded by serene Ryukyu pine forests and lush natural greenery. Built in the 15th century by the famed general Gosamaru, the fortress features beautifully curved and masterfully crafted stone walls. Climbing the ruins rewards visitors with majestic ocean vistas of the west coast and distant views of the Kerama Islands. Surrounded by ancient trees and greenery year-round, this park is a sanctuary blending rich history with picturesque scenery.", "name": "Zakimi Castle Ruins Park", "transport": "About 1 hour by car from Naha Airport; or take Okinawa Bus No. 29 to \u0027Zakimi\u0027 stop and walk for about 10 minutes."}, {"address": "Seragaki, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Tucked away near Cape Manzamo in Onna Village, Diamond Beach is celebrated for its crystal-clear waters and unique natural limestone formations. The shoreline features dramatic sea-eroded rocks and sea caves, revealing shallow sandflats and tide pools during low tide\u2014perfect for observing tropical fish and small crabs up close. Uncrowded and pristine, it is a peaceful hidden gem ideal for photography and tranquil nature walks.", "name": "Diamond Beach", "transport": "About 55 minutes by car from Naha Airport; or take Ryukyu Bus No. 120 to \u0027Seragaki\u0027 stop and walk for about 5 minutes."}, {"address": "Fuchaku, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Situated on the west coast of Onna Village, Fuchaku Beach is an open, natural white-sand beach featuring a long, soft shoreline and multi-hued azure waters. Unlike enclosed resort beaches, it preserves a pure, untouched coastal atmosphere. With gentle waves and expansive ocean views, it is a favored local spot for relaxing walks and water-gazing, especially at sunset when the twilight glow reflects beautifully across the water.", "name": "Fuchaku Beach", "transport": "About 45 minutes by car from Naha Airport via the Okinawa Expressway (exit at Yaka IC); or take Ryukyu Bus No. 120 to \u0027Fuchaku\u0027 stop and walk for about 3 minutes."}, {"address": "1861 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Adjacent to the Cape Zanpa cliffs, this spacious recreational park combines natural coastline, a giant wind turbine, and wide grassy fields. Its most iconic landmark is Japan\u0027s largest Shisa statue (7 meters tall), standing proudly against the backdrop of the open sea. Equipped with scenic coastal walking paths, children\u0027s play structures, and open lawns for sunbathing to the sound of waves, it is one of Yomitan Village\u0027s favorite seaside spots for families and couples.", "name": "Cape Zanpa Recreation Park", "transport": "About 1 hour 10 minutes by car from Naha Airport; or take Okinawa Bus No. 28 to \u0027Yomitan Bus Terminal\u0027 and walk for about 20 minutes."}, {"address": "2005-1 Afuso, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located in northern Onna Village, Mission Beach is a privately managed natural beach infused with retro American charm and wild natural appeal. Framed by lush native foliage and natural rock formations, it features a secluded, 300-meter stretch of pure white sand. The waters are exceptionally clear, exposing vibrant coral reefs beneath at low tide, creating an elegant and quiet retreat that feels like a hidden tropical getaway.", "name": "Mission Beach", "transport": "About 1 hour by car from Naha Airport via the Okinawa Expressway (exit at Kyoda IC); or take Ryukyu Bus No. 120 to \u0027Afuso\u0027 stop and walk for about 5 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2871 Onna, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | An iconic landmark located in Onna Village, famous for its natural Ryukyuan limestone sea cliff shaped like an elephant\u0027s trunk. Rising 20 meters above the azure East China Sea, the cliff top is covered with a vast natural lawn. Legend has it that King Sh\u014d Kei of the Ryukyu Kingdom praised it as a grassy plain (\u0027M\u014d\u0027) large enough for ten thousand people to sit on (\u0027Man\u0027). The newly built visitor facility offers a comfortable observation deck and local food stalls. The breathtaking views where the sea meets the sky at sunset draw countless visitors looking for the perfect photo.", "name": "Cape Manzamo", "transport": "About 50 minutes by car from Naha Airport (via Okinawa Expressway, exiting at Yaka IC), or take Bus No. 120 (Nago Nishi Airport Line) to \u0027Manzamo Iriguchi\u0027 stop and walk for about 10 minutes."}, {"address": "1861 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Situated at the westernmost tip of Yomitan Village, these sheer Ryukyuan limestone cliffs tower 30 meters high and stretch for nearly 2 kilometers. Crashing waves hit the cliff sides with magnificent force. At the cape stands the only white lighthouse on the main island of Okinawa that visitors can climb for a 360-degree panoramic ocean view. As the last spot where the sunset dips on the main island, the golden dusk casting light over the sheer cliffs and ocean makes it an unmissable photo spot for photography enthusiasts.", "name": "Cape Zanpa", "transport": "About 1 hour and 10 minutes by car from Naha Airport, or take Bus No. 28 (Yomitan Line) to \u0027Zanpamisaki Toudai Iriguchi\u0027 stop and walk for about 15 minutes."}, {"address": "560 Gima, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Perched on a coastal cliff in Yomitan Village, this is one of Japan\u0027s largest ocean-view cafes, meticulously crafted by Hoshino Resorts. The cafe features four distinct areas: the \u0027Grand Terrace\u0027 on top of the cliff, the \u0027Rock Terrace\u0027 built along the cliffside, the lush \u0027Gathering Lounge\u0027 surrounded by greenery, and the \u0027Beach Terrace\u0027 with direct access to the shore. Guests can order colorful gradient Okinawa signature drinks and fragrant waffles, choose their favorite spot, and take in the stunning gradient blue sea and romantic sunset.", "name": "Hoshino Resorts Banta Cafe", "transport": "About 1 hour by car from Naha Airport, or take the Airport Limousine Bus to \u0027Royal Hotel Okinawa Zanpamisaki\u0027 and walk or take a taxi for about 5 minutes."}, {"address": "2653-1 Zakimi, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Nestled in the forests of Yomitan Village, this pottery culture enclave brings together dozens of Okinawa\u0027s top ceramic artists and traditional climbing kilns. The village exudes an artistic atmosphere, with its most iconic photo landmark being a massive multi-tiered climbing kiln with red roof tiles. Strolling along gravel paths surrounded by greenery and visiting various workshops allows you to buy traditional \u0027Yachimun\u0027 pottery filled with warm, earthy textures\u2014making it a perfect destination combining cultural depth and visual aesthetic.", "name": "Yachimun no Sato (Yomitan Pottery Village)", "transport": "About 1 hour by car from Naha Airport, or take Bus No. 29 (Yomitan Line) to \u0027Zakimi\u0027 stop and walk for about 15 minutes."}, {"address": "469-1 Maeda, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | One of Onna Village\u0027s most famous coastal landscapes and home to the world-renowned diving spot \u0027Blue Cave\u0027. The view of the azure coastline stretching out from the observation deck is spectacular, overlooking steep cliffs and crashing waves. Even if you don\u0027t dive, walking along the coastal boardwalk allows you to feel the cool sea breeze and admire the crystal-clear water. Its prime elevated location makes it a popular destination for photographing deep blue seas and sunsets, drawing influencers and outdoor enthusiasts alike.", "name": "Cape Maeda", "transport": "About 55 minutes by car from Naha Airport, or take Bus No. 120 (Nago Nishi Airport Line) to \u0027Kuraha\u0027 stop and walk for about 15 minutes."}, {"address": "1130 Yamada, Onna Village, Kunigami District, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | A Ryukyu traditional cultural theme park in Onna Village, featuring century-old traditional houses dismantled and relocated from across Okinawa to recreate a historic Ryukyu Kingdom village. Surrounded by greenery, walking along stone-paved paths in traditional Ryukyuan attire (\u0027Ryusou\u0027) creates a marvelous sense of time travel. Visitors can also enjoy Eisa drum performances, try playing the Sanshin, or participate in traditional craft DIY activities, making it an excellent spot for deeply experiencing Okinawan culture and taking vintage-style photos.", "name": "Ryukyu Village", "transport": "About 50 minutes by car from Naha Airport, or take Bus No. 120 (Nago Nishi Airport Line) to \u0027Ryukyumura\u0027 stop and get off directly."}, {"address": "675 Uza, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | A dreamlike oceanfront chapel located on the Uza coast of Yomitan Village, designed around the concept of \u0027water and greenery.\u0027 Its pure white exterior with Gothic spires stands right next to the blue ocean and white sandy beach. Inside, the chapel features a soaring marble aisle with large floor-to-ceiling windows offering sweeping views of the East China Sea. Its dreamy and elegant atmosphere makes it a coveted wedding destination for couples and an exceptionally popular seaside photo spot.", "name": "Aquagrace Chapel", "transport": "About 1 hour by car from Naha Airport, or take Bus No. 28 (Yomitan Line) to \u0027Uza Kouminkan-mae\u0027 stop and walk for about 8 minutes."}, {"address": "915 Takashiho, Yomitan Village, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.0 stars | A multi-concept ocean-view experience village situated along the coast of Yomitan Village, featuring Mediterranean-style white walls and sea-blue accents for an exotic flair. Here, visitors can enjoy expansive ocean views while participating in traditional sea salt harvesting, glassblowing, and pottery crafting. The coastal scenery and oceanfront restaurants are popular photo spots, especially on clear days when the blue sky, white walls, and sea intertwine to make you feel like you are at a European coastal resort.", "name": "Gala Aoiumi", "transport": "About 1 hour by car from Naha Airport, or take Bus No. 28 (Yomitan Line) to \u0027Takashiho Iriguchi\u0027 stop and walk for about 20 minutes."}], "name": "Popular Photo Spots"}}, "name": "Onna West Coast and Yomitan Village"}, "shuri_culture": {"categories": {"cat_1": {"items": [{"address": "1-2 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Shureimon Gate is one of the iconic architectural structures of Shuri Castle. Hanging on the gate is a plaque reading \u0027Shurei no Kuni\u0027 (Land of Propriety), symbolizing the Ryukyu Kingdom\u0027s cultural spirit of valuing courtesy. This paifang-style archway merges classic Chinese archway design with traditional Ryukyuan red-tile craftsmanship and was once featured on Japan\u0027s 2,000-yen banknote. With the elegant curves of its pillars and roof line, it is a must-visit landmark for photos when visiting Shuri Castle.", "name": "Shureimon Gate (Shuri Castle)", "transport": "Take the Okinawa Monorail (Yui Rail) to Shuri Station, then walk for about 15 minutes."}, {"address": "1-3 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.6 stars | Built in 1501 by King Sho Shin of the Ryukyu Kingdom as a grand stone tomb for his father, King Sho En, Tamaudun is designated as a UNESCO World Heritage Site. The mausoleum complex is divided into East, Central, and West chambers, enclosed by massive limestone walls that showcase extraordinary stone craftsmanship and a solemn atmosphere. The guardian stone lions at the entrance and the intricate carvings are well worth pausing to admire.", "name": "Tamaudun Royal Mausoleum", "transport": "Take the Okinawa Monorail to Shuri Station and walk for about 15 minutes, or take a city bus and get off at the Shurijo-koen Mae stop, then walk for 3 minutes."}, {"address": "1-2 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Paved in the 16th century during the Ryukyu Kingdom\u0027s golden age, the Kinjo-cho Stone-paved Path is an ancient official roadway crafted from Ryukyuan limestone. Traditional red-tiled houses and ancient stone walls line the path, exuding the rich atmosphere of the former Ryukyuan capital. Strolling along these time-worn cobblestones feels like stepping back into ancient Okinawa, with centuries-old giant camphor trees adding to its charm\u2014making it an exceptional spot for scenic walks and photos.", "name": "Kinjo-cho Stone-paved Path", "transport": "Take the Okinawa Monorail to Shuri Station, then walk about 15 to 20 minutes to reach the path entrance."}, {"address": "3-1 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Built in 1519, Sonohyan-utaki Ishimon is a sacred site where Ryukyuan kings prayed for safe journeys before departing the castle, and it is also designated as a UNESCO World Heritage Site. Although named a \u0027gate,\u0027 it was not meant for people to walk through; rather, it served as a place of worship facing the sacred forest (Utaki) behind it. Carved from Ryukyuan limestone, its exquisite arch and wood-like stone carvings demonstrate supreme traditional Ryukyuan stonecraft.", "name": "Sonohyan-utaki Ishimon", "transport": "Take the Okinawa Monorail to Shuri Station, then walk for about 15 minutes into Shurijo Castle Park."}, {"address": "3-1 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Kankaimon Gate is the main outer gate leading into the inner castle walls of Shuri Castle. \u0027Kankai\u0027 means \u0027welcome,\u0027 reflecting its purpose to greet Chinese envoys (Sapposhi) and distinguished guests. The gate ingeniously combines an arched stone rampart with a wooden turret, offering strong structural defense. Flanking the gate are two stone lion-dogs called \u0027Shisa,\u0027 placed to ward off evil spirits\u2014a wonderful expression of Shuri Castle\u0027s defense system and sculptural art.", "name": "Kankaimon Gate (Shuri Castle)", "transport": "Take the Okinawa Monorail to Shuri Station, then walk for about 15 minutes into Shurijo Castle Park."}, {"address": "3-1 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Created in 1502, Enkanchi is a landscaped pond built to collect natural spring water flowing from Shuri Castle. Situated on an island in the middle of the pond is Benzaitendo, originally constructed to store Buddhist scriptures gifted by the King of Korea. The crimson Benzaitendo shrine is connected to the shore via a stone arch bridge named \u0027Tennyobashi\u0027 (Bridge of Heavenly Nymphs), featuring traditional Chinese architectural accents. The pristine reflection of the ancient structure and surrounding greenery on the water creates a serene and elegant atmosphere.", "name": "Enkanchi Pond \u0026 Benzaitendo", "transport": "Take the Okinawa Monorail to Shuri Station, then walk for about 13 minutes to the pond side in Shurijo Castle Park."}, {"address": "3-1 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Zuisenmon Gate derives its name from \u0027Ryuhi,\u0027 a crystal-clear spring located beside it; \u0027Zuisen\u0027 translates to \u0027splendid and auspicious spring.\u0027 Built atop stone castle walls, this two-story wooden gate is a classic representation of Ryukyuan castle architecture. Water from Ryuhi gushes out from a carved stone dragon head and historically served as drinking water for the Ryukyuan king and visiting Chinese envoys. The wide staircase in front of the gate offers magnificent views for admiring the castle\u0027s sweeping wall contours.", "name": "Zuisenmon Gate (Shuri Castle)", "transport": "Take the Okinawa Monorail to Shuri Station, then walk for about 15 minutes to the inner castle wall entrance."}, {"address": "1-4 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1492, Engaku-ji was once the head temple of Rinzai Zen Buddhism in the Ryukyu Kingdom and the royal family temple for the Sho dynasty, modeled after Engaku-ji Temple in Kamakura. Although the main structures were destroyed during World War II, the historically valuable stone Somon gate and Hosho-bashi bridge remain. The exquisite, elegant stone carvings on Hosho-bashi bridge are designated as an Important Cultural Property of Japan, making this a peaceful historic site to reflect on Ryukyuan Buddhist heritage.", "name": "Engaku-ji Temple Site", "transport": "Take the Okinawa Monorail to Shuri Station, then walk for about 12 minutes to the area beside Enkanchi Pond in Shurijo Castle Park."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-3 Shuri Kinjocho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Tamaudun is the stone mausoleum of the Ryukyu Kingdom\u0027s royal family and a designated UNESCO World Heritage site. Its underground exhibition room displays precious tomb models, excavated artifacts, sarcophagus photos, and detailed explanations of Ryukyuan royal funeral culture. Before exploring the magnificent mausoleum itself, visitors can gain deep insights into the historical background of successive Ryukyu kings and their unique stone architectural art through rich documents and multimedia guides.", "name": "Tamaudun Exhibition Room", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 15 minutes."}, {"address": "2-64 Shuri Toubaracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Shuri-ori is a centuries-old traditional Ryukyu Kingdom textile weaving technique, historically used as luxury clothing for nobility. The center showcases exquisite historical Shuri-ori works and documents, and allows visitors to watch artisans meticulously craft textiles using traditional wooden looms. There is also a gift shop featuring creative craft accessories, where you can purchase refined items or book a hands-on weaving experience.", "name": "Naha City Shuri-ori Craft Center", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Gibo Station and walk for about 10 minutes."}, {"address": "1-4 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.1 stars | Adjacent to Shurijo Castle Park, this art museum houses and displays a vast collection of traditional Ryukyuan crafts, including textiles, Bingata stencil dyeing, Ryukyuan lacquerware, ceramics, and contemporary artworks. Hosting regular themed exhibitions curated by university professors and emerging artists, it is an exceptional cultural space to explore local contemporary art developments and the transformation of traditional Ryukyuan craft aesthetics.", "name": "Okinawa Prefectural University of Arts Museum", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 12 minutes."}, {"address": "3-1 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.5 stars | Located within Shurijo Castle Park, this center was established to give the public a comprehensive understanding of the main hall\u0027s restoration process. The exhibition features clear video documentation, historical wooden models, and live explanations of carpentry restoration techniques. Visitors can witness up close the historical moment of dismantling and meticulously rebuilding this Ryukyuan heritage site, gaining a deep appreciation for the Okinawan people\u0027s dedication to preserving their cultural heritage.", "name": "Shurijo Castle Reconstruction Information Center", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk about 15 minutes into Shurijo Castle Park."}, {"address": "2-20 Shuri Akahira-cho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in the charming historic alleys of Shuri, this Catholic church beautifully blends traditional Okinawan red-tiled roofs with Western Gothic architecture. Inside, the atmosphere is serene and tranquil, with soft light casting colorful shadows through stained-glass windows. Beyond serving as a spiritual home for local believers, it is an off-the-beaten-path architectural gem showcasing a unique fusion of Eastern and Western aesthetics.", "name": "Shuri Catholic Church", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Gibo Station and walk for about 6 minutes."}, {"address": "2-17 Shuri Tonokuracho, Naha City, Okinawa Prefecture", "feature": "\u2b50 4.2 stars | Boasting a long history, Shuri Church was rebuilt after WWII on the Shuri heights and stands as one of the area\u0027s most iconic religious and historical landmarks. Featuring a simple and elegant exterior surrounded by lush native Okinawan greenery, the church offers a solemn and peaceful setting. It frequently hosts community concerts and cultural lectures, playing a vital role in fostering local engagement and spiritual reflection.", "name": "Shuri United Church of Christ in Japan", "transport": "Take the Okinawa Urban Monorail (Yui Rail) to Shuri Station and walk for about 10 minutes."}, {"address": "193-1 Uehara, Nishihara Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.3 stars | Located near the eastern side of Shuri, this facility is dedicated to researching and exhibiting underground archaeological discoveries from Okinawa Prefecture. With free entry, the exhibition rooms systematically showcase excavated pottery, stone tools, and trade ceramics spanning from the Paleolithic and Shell Mound eras to the Ryukyu Kingdom period. Complete with detailed informative panels and interactive displays, it is ideal for history and archaeology enthusiasts wishing to explore ancient Okinawan civilization.", "name": "Okinawa Prefectural Center for Buried Cultural Properties", "transport": "From Monorail Shuri Station, take the Shurijo Castle Loop Bus (Shurijo Shitamachi Line) or a taxi for about a 10-minute ride."}, {"address": "1 Senbaru, Nishihara Town, Nakagami District, Okinawa Prefecture", "feature": "\u2b50 4.4 stars | Located on the University of the Ryukyus campus northeast of Shuri, this is Okinawa\u0027s only comprehensive university museum. It houses rich collections of unique Ryukyu Islands biological specimens (including rare wildlife and marine life), folklore artifacts, ancient documents, and geological fossils. This educational and engaging space provides visitors with a well-rounded understanding of Okinawa\u0027s subtropical biodiversity and deep Ryukyuan cultural heritage.", "name": "Ryukyu University Museum Fujukan", "transport": "From Monorail Shuri Station, take city bus No. 97 or 98 to \u0027Ryudai Kitaguchi\u0027 and walk for about 5 minutes."}], "name": "Culture, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "3-1 Shuri Tonokura-c
