nts. It\u0027s a must-visit to experience Hong Kong\u0027s dynamic nights.", "name": "\u862d\u6842\u574a (Lan Kwai Fong) (\u591c\u751f\u6d3b\u8207\u5a1b\u6a02)", "transport": "MTR Central Station Exit D1, approximately 5 minutes walk"}, {"address": "Pottinger Street, Central", "feature": "\u2b50 4.2 stars | Named for its stone slab pavement, this street is lined with hawker stalls selling festive items, clothing, and souvenirs, exuding a nostalgic charm.", "name": "\u77f3\u677f\u8857 (Pottinger Street) (\u7279\u8272\u5c0f\u8ca9)", "transport": "MTR Central Station Exit D2, approximately 3 minutes walk"}, {"address": "Junction of Hollywood Road and Lok Ku Road, Sheung Wan", "feature": "\u2b50 4.0 stars | A famous antique street, selling various antiques, curios, calligraphy, and handicrafts. It\u0027s a great place to find unique souvenirs and experience old Hong Kong.", "name": "\u6469\u7f85\u8857 (Cat Street / Upper Lascar Row) (\u53e4\u8463\u8207\u820a\u7269)", "transport": "MTR Sheung Wan Station Exit A2, approximately 10 minutes walk"}, {"address": "Gough Street, Central", "feature": "\u2b50 4.1 stars | A charmingly artistic street, home to numerous designer brand stores, boutique home shops, and unique cafes. It\u0027s a wonderful place for a leisurely stroll and shopping.", "name": "\u6b4c\u8ce6\u8857 (Gough Street) (\u8a2d\u8a08\u5c0f\u5e97\u8207\u5496\u5561)", "transport": "MTR Sheung Wan Station Exit A2, approximately 8 minutes walk"}, {"address": "Tai Ping Shan Street and Po Hing Fong area, Sheung Wan", "feature": "\u2b50 4.3 stars | The area around Tai Ping Shan Street and Po Hing Fong in Sheung Wan features many colorful street murals, adding artistic vibrancy to the old district and making it a great spot for photos.", "name": "\u4e0a\u74b0\u8857\u982d\u85dd\u8853 (Sheung Wan Street Art)", "transport": "MTR Sheung Wan Station Exit A2, approximately 7 minutes walk"}], "name": "Art \u0026 Street Culture"}, "cat_4": {"items": [{"address": "10 Cotton Tree D ing Tung Chung and Ngong Ping. Choose between standard or crystal cabins for panoramic views of Hong Kong International Airport, the majestic Lantau mountains, and the sparkling South China Sea.", "name": "Ngong Ping 360 Cable Car", "transport": "MTR Tung Chung Station Exit B, approx. 2-minute walk to the cable car terminal"}, {"address": "Hong Kong Disneyland Resort", "feature": "\u2b50 4.0 stars | Located within the Hong Kong Disneyland Resort, this vibrant shopping and dining district offers a variety of shops, restaurants, and entertainment options, accessible without a park ticket.", "name": "Disneytown", "transport": "MTR Disneyland Resort Station, approx. 5-minute walk"}, {"address": "Next to Hong Kong Disneyland Hotel", "feature": "\u2b50 3.8 stars | Situated next to the Disneyland Hotel, this pier once served as a ferry terminal to Central. Now, it\u0027s a fantastic spot for sightseeing, enjoying the sea breeze, and capturing memorable photos.", "name": "Disneyland Pier", "transport": "MTR Disneyland Resort Station, take a free shuttle bus to Hong Kong Disneyland Hotel, then approx. 5-minute walk"}, {"address": "11 Tat Tung Road, Tung Chung", "feature": "\u2b50 4.2 stars | The starting point for the Ngong Ping 360 Cable Car, featuring ticket counters, shops, and restaurants. It\u0027s the main transport hub for visiting the Tian Tan Buddha and Po Lin Monastery.", "name": "Tung Chung Cable Car Terminal", "transport": "MTR Tung Chung Station Exit B, approx. 2-minute walk"}, {"address": "Ngong Ping, Lantau Island", "feature": "\u2b50 4.1 stars | Located at the Ngong Ping 360 Cable Car\u0027s final stop, this charming village is themed around traditional Chinese culture. Explore its shops, restaurants, and interactive experiences \u2013 a perfect resting spot before visiting the Big Buddha.", "name": "Ngong Ping Village", "transport": "Take Ngong Ping 360 Cable Car to Ngong Ping, or Bus No. 23 from Tung Chung Town Centre"}, {"address": "Sleeping Beauty Castle, Hong Kong Disneyland", "feature": "\u2b50 4.7 stars | A spectacular nightly fireworks display over Sleeping Beauty Castle at Hong Kong Disneyland. This dazzling show, synchronized with music and lighting effects, is the park\u0027s iconic grand finale.", "name": "Disney Fireworks Show", "transport": "MTR Disneyland Resort Station, then walk into the park"}, {"address": "Main Street, U.S.A., Hong Kong Disneyland", "feature": "\u2b50 4.6 stars | Hong Kong Disneyland\u0027s daily vibrant parade, featuring beloved Disney characters and performers singing and dancing, bringing joy and wonder to all visitors.", "name": "Disney Parade", "transport": "MTR Disneyland Resort Station, then walk into the park"}], "name": "Theme Parks \u0026 Cable Cars"}, "cat_2": {"items": [{"address": "Ngong Ping, Lantau Island", "feature": "\u2b50 4.6 stars | A majestic outdoor bronze Buddha statue located in Ngong Ping, one of the tallest outdoor seated Buddhas in the world. Its solemn grandeur makes it a significant religious landmark in Hong Kong.", "name": "Tian Tan Buddha", "transport": "Take Ngong Ping 360 Cable Car to Ngong Ping, then approx. 10-minute walk"}, {"address": "Ngong Ping, Lantau Island", "feature": "\u2b50 4.5 stars | A renowned Buddhist monastery nestled beside the Tian Tan Buddha. With a rich history and magnificent architecture, it\u0027s a central hub for Buddhism in Hong Kong, offering delicious vegetarian cuisine.", "name": "Po Lin Monastery", "transport": "Take Ngong Ping 360 Cable Car to Ngong Ping, then approx. 5-minute walk"}, {"address": "Ngong Ping, Lantau Island", "feature": "\u2b50 4.3 stars | Nestled at the foot of Lantau Peak, this serene installation features 38 wooden steles inscribed with the \u0027Heart Sutra,\u0027 arranged in an \u0027\u221e\u0027 pattern. A tranquil spot imbued with Zen spirit.", "name": "Wisdom Path", "transport": "Approx. 15-20 minute walk from Tian Tan Buddha"}, {"address": "Kat Hing Street, Tai O", "feature": "\u2b50 3.9 stars | One of the oldest temples in Tai O Fishing Village, dedicated to Kwan Tai. It serves as a spiritual anchor for local fishermen and boasts a unique architectural style.", "name": "Tai O Kwan Tai Temple", "transport": "Take Bus No. 11 from Tung Chung Town Centre to Tai O Bus Terminus, then approx. 5-minute walk"}, {"address": "San Tsuen Street, Tai O", "feature": "\u2b50 3.8 stars | Another ancient temple in Tai O, dedicated to Hau Wong. It\u0027s a vital spiritual center for local residents, hosting grand Hau Wong Festival celebrations annually.", "name": "Tai O Yeung Hau Temple", "transport": "Take Bus No. 11 from Tung Chung Town Centre to Tai O Bus Terminus, then approx. 8-minute walk"}, {"address": "Ma Wan New Village, Tung Chung", "feature": "\u2b50 3.7 stars | A historical relic in Tung Chung, built during the Qing Dynasty to defend against pirates. Six ancient cannons remain, offering a fascinating glimpse into Lantau Island\u0027s past.", "name": "Tung Chung Fort", "transport": "MTR Tung Chung Station Exit B, approx. 15-minute walk or take a taxi"}, {"address": "Hau Wong Temple Street, Tung Chung", "feature": "\u2b50 3.6 stars | An ancient temple in Tung Chung, dedicated to Hau Wong. It\u0027s a spiritual heart for local residents, hosting annual celebrations rich in local character.", "name": "Hau Wong Temple", "transport": "MTR Tung Chung Station Exit A, approx. 10-minute walk"}, {"address": "Silvermine Bay Road, Mui Wo", "feature": "\u2b50 4.0 stars | A beautiful natural wonder in Mui Wo. The waterfall is surrounded by tranquil scenery, perfect for hiking and connecting with nature. Explore nearby remnants of old mine shafts.", "name": "Mui Wo Silvermine Waterfall", "transport": "Take ferry from Central Pier No. 6 to Mui Wo Pier, then approx. 20-minute walk or take a taxi"}], "name": "Cultural \u0026 Religious Landmarks"}, "cat_3": {"items": [{"address": "Lantau Island", "feature": "\u2b50 4.7 stars | Hong Kong\u0027s third-highest peak, renowned for its spectacular sunrise and sunset views. The unique \u0027Lantau Campsite\u0027 stone huts at the summit create a distinctive landscape, making it a hiker\u0027s paradise.", "name": "Sunset Peak", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Pak Kung Au, then hike up along the Lantau Trail"}, {"address": "Lantau Island", "feature": "\u2b50 4.8 stars | Hong Kong\u0027s second-highest peak and a popular spot for sunrise viewing. The summit offers expansive panoramic views of Lantau Island, presenting a more challenging hike.", "name": "Lantau Peak", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Pak Kung Au, then hike up along the Lantau Trail"}, {"address": "Cheung Sha, South Lantau Island", "feature": "\u2b50 4.3 stars | Lantau Island\u0027s longest beach, divided into Upper and Lower Cheung Sha. With crystal-clear waters and fine sand, it offers barbecue facilities and water sports, making it a perfect summer escape.", "name": "Cheung Sha Beach", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Cheung Sha Beach Station"}, {"address": "Pui O, South Lantau Island", "feature": "\u2b50 4.2 stars | Boasting golden sands and clear waters, Pui O Beach offers camping grounds and barbecue facilities. It\u0027s a popular spot for family picnics and water activities, often graced by wandering water buffaloes.", "name": "Pui O Beach", "transport": "Take Bus No. 3M from Tung Chung Town Centre to Pui O Beach Station"}, {"address": "Mui Wo, Lantau Island", "feature": "\u2b50 4.0 stars | Located in Mui Wo, this beach features flat sands and clear waters. With changing rooms and shower facilities, it\u0027s a pleasant recreational spot for Mui Wo residents and visitors alike.", "name": "Silvermine Bay Beach", "transport": "Take ferry from Central Pier No. 6 to Mui Wo Pier, then approx. 5-minute walk"}, {"address": "Tai Pak Beach, Discovery Bay", "feature": "\u2b50 4.1 stars | A private beach within Discovery Bay, offering beautiful surroundings and soft sand. Equipped with children\u0027s play facilities, it\u0027s a delightful leisure spot for Discovery Bay residents and hotel guests.", "name": "Discovery Bay Beach", "transport": "Take ferry from Central Pier No. 3 to Discovery Bay Pier, then approx. 5-minute walk"}, {"address": "Shek Pik, Lantau Island", "feature": "\u2b50 4.0 stars | Lantau Island\u0027s largest reservoir, offering picturesque lake and mountain scenery. It\u0027s an excellent spot for hiking and birdwatching, with Shek Pik Prison located nearby.", "name": "Shek Pik Reservoir", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Shek Pik Reservoir Station"}, {"address": "Kau Ling Chung, Lantau Island", "feature": "\u2b50 4.1 stars | A secluded campsite in South Lantau, offering tranquil surroundings and stunning sea views. It\u0027s an important resupply point along hiking trails, ideal for experienced campers.", "name": "Kau Ling Chung Campsite", "transport": "Take Bus No. 11 from Tung Chung Town Centre to Tai O Bus Terminus, then approx. 2-hour walk along the Lantau Trail"}], "name": "Nature \u0026 Beaches"}, "cat_4": {"items": [{"address": "Tai O, Lantau Island", "feature": "\u2b50 4.6 stars | Known as the \u0027Venice of Hong Kong,\u0027 famous for its unique stilt houses and charming fishing village atmosphere. Enjoy a boat tour and savor local delicacies and fresh seafood.", "name": "Tai O Fishing Village", "transport": "Take Bus No. 11 from Tung Chung Town Centre to Tai O Bus Terminus"}, {"address": "Mui Wo, Lantau Island", "feature": "\u2b50 4.2 stars | One of Lantau Island\u0027s gateways, boasting Silvermine Bay Beach, a waterfall, and numerous hiking trails. It\u0027s a tranquil town perfect for escaping the city\u0027s hustle and bustle.", "name": "Mui Wo", "transport": "Take ferry directly from Central Pier No. 6 to Mui Wo Pier"}, {"address": "Discovery Bay, Lantau Island", "feature": "\u2b50 4.3 stars | A well-planned international community featuring a private beach, golf course, and diverse international restaurants. Enjoy its beautiful environment and relaxed pace of life.", "name": "Discovery Bay", "transport": "Take ferry directly from Central Pier No. 3 to Discovery Bay Pier"}, {"address": "Tung Chung, Lantau Island", "feature": "\u2b50 4.0 stars | Lantau Island\u0027s transport hub and a vibrant new town. Home to Citygate Outlets and the Ngong Ping 360 Cable Car Terminal, it serves as the main gateway to various destinations across Lantau.", "name": "Tung Chung", "transport": "MTR Tung Chung Station"}, {"address": "Shui Hau, Lantau Island", "feature": "\u2b50 4.1 stars | Located in South Lantau, Shui Hau Village is famous for its expansive mudflats and rich ecology. It\u0027s a popular spot for clam digging and birdwatching, perfect for family activities.", "name": "Shui Hau Village", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Shui Hau Village Station"}, {"address": "Cheung Sha, Lantau Island", "feature": "\u2b50 4.0 stars | Situated near Cheung Sha Beach, this peaceful village features traditional houses and unique restaurants. Experience the authentic rural charm of Lantau Island here.", "name": "Cheung Sha Village", "transport": "Take Bus No. 11 or 23 from Tung Chung Town Centre to Cheung Sha Village Station"}, {"address": "Pui O, Lantau Island", "feature": "\u2b50 4.0 stars | Adjacent to Pui O Beach, this village offers idyllic pastoral scenery, with water buffaloes often seen grazing. It provides camping and barbecue facilities for a relaxing getaway.", "name": "Pui O Village", "transport": "Take Bus No. 3M from Tung Chung Town Centre to Pui O Village Station"}, {"address": "Fan Lau, Lantau Island", "feature": "\u2b50 4.2 stars | Located at the southernmost tip of Lantau Island, this remote and ancient fishing village boasts historical relics like Fan Lau Fort and Fan Lau Lighthouse, perfect for in-depth exploration.", "name": "Fan Lau Village", "transport": "Take Bus No. 11 from Tung Chung Town Centre to Tai O Bus Terminus, then approx. 2-3 hour walk along the Lantau Trail, or take a kaito (small ferry) from Tai O"}], "name": "Fishing Villages \u0026 Unique Towns"}}, "name": "Lantau Island \u0026 Disneyland"}, "mongkok_yaumatei": {"categories": {"cat_1": {"items": [{"address": "Tung Choi Street, Mong Kok", "feature": "\u2b50 4.0 stars | Mong Kok\u0027s most famous open-air market, selling a variety of clothing, handbags, accessories, souvenirs, and trinkets. It\u0027s a great place to experience Hong Kong\u0027s local shopping culture \u2013 remember to bargain!", "name": "Ladies\u0027 Market", "transport": "MTR Mong Kok Station Exit E2, approximately 2 minutes walk."}, {"address": "Temple Street, Yau Ma Tei", "feature": "\u2b50 4.1 stars | Yau Ma Tei\u0027s most iconic night market. It comes alive after dark with food stalls, fortune tellers, singing performances, souvenirs, and electronics, exuding the charm of old Hong Kong.", "name": "Temple Street Night Market", "transport": "MTR Yau Ma Tei Station Exit C, approximately 3 minutes walk."}, {"address": "Flower Market Road, Prince Edward", "feature": "\u2b50 4.2 stars | A distinctive market in the Prince Edward area, selling a variety of fresh flowers, potted plants, and gardening supplies. It\u0027s colorful, fragrant, a paradise for photographers, and a wonderful place to soak in Hong Kong\u0027s vibrant atmosphere.", "name": "Flower Market", "transport": "MTR Prince Edward Station Exit B1, approximately 5 minutes walk."}, {"address": "Northern section of Tung Choi Street, Mong Kok", "feature": "\u2b50 4.1 stars | Mong Kok\u0027s unique pet street, with shops on both sides displaying bags of goldfish and various ornamental fish, as well as other small animals and pet supplies. It\u0027s a fascinating place to experience a distinctive aspect of Hong Kong culture.", "name": "Goldfish Market", "transport": "MTR Prince Edward Station Exit B2, approximately 5 minutes walk."},         const cityName = "HongKong";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
