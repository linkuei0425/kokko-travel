 "name": "Yangjiaping and Huangjueping"}, "nanbin_nanshan": {"categories": {"cat_1": {"items": [{"address": "Foot of Shizi Mountain, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Founded during the Tang Dynasty and rebuilt during the Qing Dynasty, Ciyun Temple is a rare Chinese monastery where monks and nuns practice together. The architecture blends Chinese and Western styles, featuring a brick-and-stone structure resembling a Western castle, while the interior maintains a traditional Buddhist temple layout. It houses a magnificent jade Buddha brought back from Myanmar and receives many worshippers. Situated at the foot of Shizi Mountain on Nanbin Road, adjacent to the Yangtze River, it offers breathtaking views of the Yuzhong Peninsula and the confluence of the two rivers. As night falls, it becomes a top historical spot to enjoy Chongqing\u0027s night skyline.", "name": "Ciyun Temple", "transport": "Take Bus 375 or 338 and get off at \u0027Ciyun Temple Station\u0027, or walk for about 15 minutes from the South Station of the Yangtze River Cableway."}, {"address": "No. 76 Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.4 stars | Built in 1902, the former French Naval Barracks is one of the most iconic European-style buildings from Chongqing\u0027s treaty port era. The design combines French Renaissance style with a traditional Chinese courtyard layout, featuring blue brick masonry, exquisite arched verandas, and carved railings. Once a station for French naval sailors, it has been meticulously restored into a cultural landmark combining historical exhibits, creative spaces, and unique dining, exuding French romanticism and a century of history.", "name": "Former Site of French Naval Barracks", "transport": "Take Bus 375 or 338 to \u0027Danzishi Station\u0027 and walk about 5 minutes, or take Metro Loop Line / Line 11 to \u0027Danzishi Station\u0027 and transfer to a bus."}, {"address": "Changjiahui Shopping Park, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Located in the core section of Nanbin Road, Danzishi Old Street was once an important river port in Southwest China. Rebuilt based on a \u0027nine-tier terraced hill\u0027 landform, it cleverly fuses a century of old-street history with modern commerce. The area preserves historic sites like Wang\u0027s Courtyard and Sun\u0027s Garden, along with attractions like the Hundred-Step Stairs and the Open-Port Exhibition Hall. Strolling through the quaint alleys, visitors can sample local Chongqing street food and enjoy stunning panoramic views of Chaotianmen Pier and the confluence of the Yangtze and Jialing Rivers.", "name": "Danzishi Old Street (Changjiahui)", "transport": "Take Metro Loop Line to \u0027Danzishi Station\u0027 (Exit 2), then walk about 10 minutes."}, {"address": "No. 1 Nanshan Botanical Garden Road (Huangshan), Nanan District, Chongqing", "feature": "\u2b50 4.7 stars | Located in the Nanshan Huangshan Scenic Area, this museum complex preserves 15 historical buildings\u2014including Song Hall, Yunxiu Villa, Cao Pavilion, and Kongxiang Villa\u2014which served as residences for Chiang Kai-shek and high-ranking officials during Chongqing\u0027s time as the wartime capital. The mountain villas blend Eastern Sichuan folk style with Western architecture. Having witnessed key World War II decisions for the Allied China Theater, this quiet sanctuary surrounded by ancient trees offers a rich historic and cultural experience amid natural beauty.", "name": "Chongqing Anti-Japanese War Museum", "transport": "Take Bus 384 to \u0027Nanshan Station\u0027 and transfer to a local taxi, or take a taxi directly."}, {"address": "Behind Huangjiaoya Old Street, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Nestled at the foot of Yulei Mountain in Nanshan, Laojun Cave was founded in the Tang Dynasty as the Buddhist Taiyuan Temple before converting to Taoism in the Ming Dynasty. It is Chongqing\u0027s largest and oldest Taoist temple. Built into the hillside, the serene pavilion-filled complex includes Sanqing Hall and Yuhuang Hall. Climbing the ancient stone steps lined with cliff carvings leads to a summit viewing deck with panoramic vistas of Yuzhong Peninsula and Nanbin Road. It is a favored local spot for blessings and scenic views.", "name": "Laojun Cave Taoist Temple", "transport": "Take Bus 346 or 347 to \u0027Huangjiaoya Station\u0027, then walk uphill through Huangjiaoya Old Street for about 20 minutes."}, {"address": "Tushan Peak, Nanshan Street, Nanan District, Chongqing", "feature": "\u2b50 4.3 stars | Perched atop Tushan Peak in Nanshan, Tushan Temple reportedly dates back to the Western Han Dynasty, making it one of Chongqing\u0027s oldest surviving temples. Named after the legend of Emperor Yu marrying Lady Tushan, most existing structures were rebuilt during the Qing Dynasty and house statues of Emperor Yu, Queen Tushan, and Sakyamuni Buddha. Surrounded by lush ancient trees, the majestic halls blend mythic lore with Buddhist-Taoist culture. High vantage points offer sweeping views of the Yangtze River.", "name": "Tushan Temple", "transport": "Take Bus 346 or 347 to \u0027Erwai Station\u0027, then hike up the Nanshan trail for about 15\u201320 minutes."}, {"address": "Shangxin Street, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.3 stars | Established in the 1890s by British merchant Archibald John Little, this was one of the earliest foreign trading firms built after Chongqing opened as a treaty port. Built along the hillside, the complex includes offices, warehouses, and residences, blending Western arcaded style with traditional Eastern Sichuan stilt house structures. Having witnessed the dawn of Chongqing\u0027s modern commerce, the restored landmark now serves as a historic hub featuring port-history exhibits, creative spaces, and dining.", "name": "Former Site of Archibald Little\u0027s Firm", "transport": "Take Metro Line 6 or Loop Line to \u0027Shangxin Street Station\u0027, then walk about 8 minutes towards Nanbin Road."}, {"address": "Wenfeng Section, Nanshan Street, Nanan District, Chongqing", "feature": "\u2b50 4.2 stars | Built in 1851 during the Daoguang reign of the Qing Dynasty, Nanshan Wenfeng Pagoda stands approximately 28 meters tall. It is a seven-tier, octagonal brick-and-stone pagoda with close-set eaves, originally erected to foster local scholarship and harmonize feng shui. Perched gracefully on a Nanshan ridge with fine body carvings, it is surrounded by lush greenery. An essential historical marker along the Nanshan trail system, it is a must-visit for hikers and ancient architecture enthusiasts.", "name": "Nanshan Wenfeng Pagoda", "transport": "Take Bus 346 or 347 to \u0027Chongwen Road Station\u0027, then walk about 25 minutes along the Nanshan Fitness Trail."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Next to Ciyun Temple, Nanbin Road, Nan\u0027an District, Chongqing (Former Site of Anderson Mansion)", "feature": "\u2b50 4.6 stars | Located within the former site of the Anderson Mansion on Nanbin Road, this specialized museum commemorates the heroic history of the Palace Museum\u0027s artifacts being relocated southward during World War II. Combining historical architecture, interactive multimedia exhibits, and creative spaces, it vividly documents the miraculous journey of tens of thousands of crates of national treasures transported across vast distances unharmed. The building itself blends traditional stilt-house architecture with modern foreign firm design, exuding a rich artistic atmosphere that makes it a top spot for historical education and artistic photography.", "name": "Chongqing Museum of Palace Museum Relics Southward Migration", "transport": "Take CRT Line 6 to Shangxinjie Station, transfer to Bus 375, get off at Ciyun Temple Station, and walk a short distance."}, {"address": "No. 105 Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Built in 1902, this castle-like landmark infused with classical French romanticism once served as the garrison for the French Navy. The architecture seamlessly blends European Romanesque arches with Chongqing\u2019s traditional timber frame structure, creating a highly unique fusion of East and West. Meticulously restored, it now serves as a vibrant cultural hub housing art exhibitions, an independent bookstore, cozy cafes, and creative design studios. Its brick-and-stone walls and delicate carvings radiate timeless romance.", "name": "Former Site of Chongqing French Naval Barracks", "transport": "Take CRT Line 6 to Danzishi Station and walk about 15 minutes, or transfer to Bus 354 to Haitangxi Station."}, {"address": "Jiguanshi Village, Jiguanshi Town, Nanshan Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 stars | Tucked away in the lush forests of Nanshan Mountain, Cimu Catholic Church was built in 1911 and boasts over a century of history. The structure uniquely merges Gothic architectural elements with traditional eastern Sichuan residential craftsmanship. Featuring grey bricks, black tiles, a towering cross, and elegant arches surrounded by tranquil woods, it feels extraordinarily serene and solemn. The interior offers a quiet atmosphere where classical light and shadows interweave, making it an artistic and historical architectural treasure.", "name": "Cimu Catholic Church (Cimu Cathedral)", "transport": "Driving or taking a taxi is recommended. Alternatively, take Bus 384 to the Nanshan terminus and transfer to a local shuttle."}, {"address": "No. 14 Huangshan Lane, Nanshan Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Nestled in the Huangshan Scenic Area of Nanshan Mountain, this site features a historic complex of former residences belonging to the Nationalist Military Council and notable figures during World War II, including over ten historical buildings such as Yunxiu Villa, Song Pavilion, and Cao Pavilion. The museum houses a rich collection of wartime historical artifacts and fine art. Surrounded by dense bamboo groves and lush green trees, the diverse architectural styles harmonize seamlessly with the natural landscape, offering deep historical significance and aesthetic charm.", "name": "Chongqing Anti-Japanese War Museum", "transport": "Take Bus 384 to Nanshan Station, then transfer to the Bus 384 Shuttle or take a taxi directly to the park entrance."}, {"address": "No. 1 Hongjing Road, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Located in the heart of Nanbin Road, this comprehensive museum highlights the history of Chongqing opening its port in 1891. Built along the foothills of Nanshan Mountain, the park preserves and restores several century-old structures, including the former Little Brothers \u0026 Co. premises. Through digital media, precious historical documents, and immersive scenes, the exhibition showcases Chongqing\u0027s transformation from a traditional river city to a modern port and thriving metropolis. Beautiful evening illumination further accentuates its artistic ambiance.", "name": "Chongqing Open Port Heritage Park Museum", "transport": "Take CRT Line 6 or the Loop Line to Shangxinjie Station, then walk about 10 minutes."}, {"address": "Next to Ciyun Temple, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.4 stars | Formerly a warehouse for the British firm Mackenzie \u0026 Co., the Anderson Mansion played a vital role in sheltering relocated Palace Museum treasures. Redesigned by world-renowned architects around the concept of \u0027symbiosis between old and new\u0027, it stands rejuvenated on Nanbin Road. The gallery hosts contemporary art exhibitions, photography shows, and cultural lectures. Minimalist timber frameworks contrast gracefully with historic grey bricks, creating one of the most sophisticated artistic salons and exhibition venues along the river.", "name": "Anderson Mansion Cultural \u0026 Art Exhibition Center", "transport": "Take Bus 375 or 338 to Ciyun Temple Station, then walk about 3 minutes."}, {"address": "Inside Longmenhao Old Street, No. 105 Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Situated in the core of Longmenhao Old Street along Nanbin Road, this gallery is housed in converted Western-style structures and traditional eastern Sichuan residences from the early open-port era. It regularly invites domestic and international artists to present illustration, sculpture, and contemporary visual art exhibitions. Strolling along flagstone paths and old brick walls, visitors can soak in breathtaking river views of the Yangtze and Dongshuimen Bridge while enjoying a fascinating interplay of traditional heritage and contemporary art.", "name": "Longmenhao Old Street Art Gallery", "transport": "Take CRT Line 6 or the Loop Line to Shangxinjie Station (Exit 2), then walk about 5 minutes."}, {"address": "No. 1 Chahua Road, Chayuan New Town, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.8 stars | Located near Jiangnan New Town in Nan\u0027an District, this is Southwest China\u0027s most advanced museum dedicated to cultural artifact restoration and technological conservation. Featuring public viewing areas for restoration work, scientific testing labs, and art galleries, visitors can watch master restorers intricately repair bronzes, ceramics, and ancient calligraphic paintings through glass walls. It seamlessly merges conservation science with artistic appreciation, delivering immense educational and visual value.", "name": "Chongqing Three Gorges Cultural Relics Preservation Base", "transport": "Take CRT Line 6 to Chayuan Station, then transfer to Bus 178 to Three Gorges Relics Preservation Base Station."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 101 Nanshan Park Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Located in the heart of the Nanshan Scenic Area, this large-scale botanical garden integrates plant collection, science education, and eco-tourism. The park features diverse areas such as a greenhouse exhibition hall, camellia garden, orchid garden, and rose garden, with flowers blooming across all four seasons. The spring cherry blossoms and tulip fields, along with winter plum blossoms, attract countless visitors for photography. Shaded by lush trees and offering crisp, fresh air rich in negative oxygen ions, it serves as a rare natural oxygen bar and summer retreat in Chongqing\u0027s urban area.", "name": "Nanshan Botanical Garden", "transport": "Take Bus 384 and get off at \u0027Nanshan Station\u0027 or \u0027Botanical Garden Station\u0027."}, {"address": "No. 6 Nanshan Tiaoshigang, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Named after a century-old Chongqing banyan (Huangjue) tree preserved at the site, this platform offers the ultimate natural viewpoint to admire panoramic and night views of Chongqing\u2019s \u0027magic mountain city.\u0027 Perched halfway up Nanshan Mountain, it boasts an exceptionally wide field of view, taking in the confluence of the Yangtze and Jialing Rivers as well as the dense skyscrapers of the Yuzhong Peninsula. At twilight as the sun sets and city lights flicker on, the dazzling reflections on the river create an unforgettable, vibrant nightscape.", "name": "Nanshan One Tree Sightseeing Platform", "transport": "Take Bus 346 or 347 to \u0027Huangjueya Station\u0027, then transfer to a taxi or walk for about 15 minutes."}, {"address": "Nanbin Road, Nan\u0027an District, Chongqing (Directly opposite Sheraton Hotel)", "feature": "\u2b50 4.4 stars | Located in the prime section of Nanbin Road, facing the Yangtze River and backed by Nanshan Mountain, this park is named after \u0027Misty Rain over Begonias,\u0027 one of the Twelve Historic Views of Ancient Bayu. Stretching along the river, it features a wide waterfront walkway, exquisite floral gardens, and a large-scale musical fountain. With lush greenery all year round and refreshing river breezes, it is a perfect riverside spot for strolls, jogs, and taking in the illuminated skyline of Yuzhong Peninsula and Dongshuimen Yangtze River Bridge.", "name": "Haitang Yanyu Park", "transport": "Take the Loop Line subway to \u0027Haitangxi Station\u0027, and walk about 10 minutes."}, {"address": "Next to Lvyin Reservoir, Qianjin Village, Nan\u0027an District, Chongqing (Shangxinjie Entrance)", "feature": "\u2b50 4.7 stars | Built during the Tang Dynasty, this deeply historic trail was once a vital section of the ancient Sichuan-Guizhou Tea Horse Road. Stretching about 2.5 kilometers, the trail features winding bluestone paths shaded by towering, century-old banyan trees. Exuding a serene, timeless charm and pristine mountain character, it is an outstanding outdoor nature trail for hiking, breathing fresh air, and experiencing the historic heritage of Chongqing.", "name": "Huangjueya Ancient Trail", "transport": "Take CRT Line 6 or the Loop Line to \u0027Shangxinjie Station\u0027, and walk from the exit to the trail entrance."}, {"address": "Along Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.3 stars | A highly iconic linear waterfront park in Chongqing that stretches several kilometers along the Yangtze River on Nanbin Road. Blending natural river views, landscaped gardens, and historical sculptures, it features leisure plazas, waterfront platforms, and greenways. Visitors can stroll along the river to enjoy majestic views of the Yangtze and modern landmarks like the Twin Towers, immersing themselves in Chongqing\u0027s unique blend of natural eco-beauty and vibrant urban energy.", "name": "Chongqing Nanbin Park", "transport": "Take Bus 375, 338, or other routes to \u0027Longmenhao Station\u0027 or \u0027Nanbin Lu Station\u0027."}, {"address": "Behind the main campus of Chongqing Technology and Business University, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Situated in the southern part of the Nanshan Mountain Range, this area gets its name from its undulating ridge that resembles the spine of a giant dragon. A hidden gem for local hiking enthusiasts, it boasts dense vegetation, high forest coverage, and delightfully fresh air. Ascending the stone steps along the ridge rewards hikers with rugged rock formations and lush valleys. Reaching the summit peak offers sweeping views of the Yangtze River bend and Nan\u0027an District, presenting a grand natural landscape and prime ecological environment.", "name": "Longjishan Natural Scenic Area", "transport": "Take CRT Line 3 to \u0027Wugongli Station\u0027, and enter via the mountain trail behind the back gate of Chongqing Technology and Business University."}, {"address": "No. 167 Huangjueya Main Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Perched on steep cliffs near Huangjueya on Nanshan Mountain, Laojun Cave is the largest Taoist temple complex in central Chongqing, surrounded by lush forests. Built along the mountainside, the mountain path is flanked by ancient trees and exudes a tranquil, rustic, and culturally rich Taoist atmosphere. Climbing to Sanqing Hall at the top provides unrivaled, breathtaking views of Chongqing\u2019s two rivers and four banks, making it a peaceful sanctuary combining cultural depth with natural beauty.", "name": "Laojun Cave Scenic Area \u0026 Trail", "transport": "Take Bus 346 or 347 to \u0027Huangjueya Station\u0027, then follow the signage to walk up the mountain."}, {"address": "Tushan Road, Nanshan Sub-district, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.4 stars | Located at the northwestern end of the Nanshan Mountain Range, Tushan is famous for the ancient legend of Emperor Yu marrying Lady Tushan. The mountain features steep peaks and dense forests, home to the thousand-year-old Tushan Temple and serene natural forest trails. The tranquil, evergreen environment offers a peaceful escape where walkers can feel gentle mountain breezes and Zen stillness. Ascending to higher vantage points rewards visitors with sweeping panoramas of Yuzhong Peninsula and the Yangtze River.", "name": "Tushan Scenic Area", "transport": "Take Bus 384 or 347 to \u0027Tushansi Station\u0027 and walk to the entrance."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 105 Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.7 stars | Longmenhao Old Street is one of the best-preserved and largest historical and cultural districts in Chongqing\u0027s urban core, situated next to the Yangtze River and backed by Nanshan Mountain. It blends traditional eastern Sichuan architecture featuring blue bricks and black tiles with retro Shanghai-style Western buildings, housing numerous protected historical structures and former embassy sites. At dusk, standing on the high-level viewing platform offers a close-up view of the Yangtze River Bridge and the dazzling night skyline of Yuzhong Peninsula across the river. It is also a famous photo spot to capture the CRT Loop Line train crossing the river in the same frame.", "name": "Longmenhao Old Street", "transport": "Take Chongqing Rail Transit (CRT) Loop Line or Line 6 to Shangxinjie Station (Exit 2), then walk about 5 minutes."}, {"address": "Xiahaoli, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Adjacent to Longmenhao Old Street, Xiahaoli Old Street is a newly revitalized artistic landmark meticulously restored in recent years. It perfectly preserves Old Chongqing\u0027s original cliffside walking paths and bluestone alleys while seamlessly integrating modern art exhibitions, independent cafes, craft workshops, and boutique bookstores. Strolling between rustic brick walls and lush hillside steps, you can feel the warmth of old local life and historical depth while capturing trendy, 3D mountain-city photos\u2014making it a favorite among youth and photography enthusiasts.", "name": "Xiahaoli Old Street", "transport": "Take CRT Line 6 to Shangxinjie Station (Exit 1), and follow the signs for an 8-minute walk."}, {"address": "Next to Changjiahui Shopping Park, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.8 stars | Situated at the prime viewing spot where the Yangtze and Jialing Rivers converge, Danzishi Old Street is a national 4A-level tourist attraction. Featuring a tiered 3D topography known as \u0027Nine Streets and Eighteen Alleys,\u0027 it recreates the commercial prosperity of Chongqing\u0027s century-old treaty port era. The site features historical ruins like the Wang Family Courtyard and Custom Stone, along with modern viewing terraces. It is not only the best place to admire the grand river confluence and the futuristic Raffles City night view at Chaotianmen, but its night lights also recreate a romantic, surreal visual reminiscent of scenes from \u0027Spirited Away.\u0027", "name": "Changjiahui Danzishi Old Street", "transport": "Take CRT Loop Line to Danzishi Station, then transfer to Bus 119 or walk for about 12 minutes."}, {"address": "No. 144 Wangshan Road, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Located halfway up Nanshan Mountain and named after a century-old banyan tree, the One Tree Lookout is the classic landmark for a panoramic view of Chongqing\u0027s glittering night skyline. Offering a breathtaking open vista, it overlooks the Yuzhong Peninsula, Yangtze River Bridge, and the surrounding rivers forming the surreal 3D mountain landscape. As night falls, city lights and river reflections create a stunning visual spectacle\u2014a must-visit spot for any photographer in Chongqing.", "name": "Nanshan One Tree Lookout", "transport": "Take Bus 346 or 347 to \u0027Yikeshu\u0027 (One Tree) Station, or take a taxi from Nanbin Road (approx. 15 mins)."}, {"address": "Ma\u0027anshan Section, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Built along the cliffs of Nanshan Mountain, Chongqing Open Port Heritage Park features multi-layered mountain-city landscapes and rich modern history. It preserves and restores century-old historical buildings, such as the former Little Bros \u0026 Co. site, and features an Open Port History Museum and a sprawling cliffside viewing platform. Visitors can climb glass walkways and bamboo-lined paths to overlook the Yangtze River Cableway gliding across the river, as well as Dongshuimen Bridge and the city\u0027s blend of ancient and modern architecture\u2014making it a popular photo spot combining history with modern aesthetics.", "name": "Chongqing Open Port Heritage Park", "transport": "Take CRT Line 6 to Shangxinjie Station, then walk about 10 minutes to the park entrance."}, {"address": "Laojun Mountain, Huangjueya Town, Nanan District, Chongqing", "feature": "\u2b50 4.7 stars | Perched on the steep cliffs of Nanshan Mountain, Laojun Temple is the largest and oldest Taoist temple complex in Chongqing\u0027s urban area. Built along the mountain contours, its staggered pavilions and cliff carvings carry a mystical Taoist charm. Reaching Yuhuang Tower at the temple\u0027s summit rewards you with panoramic vistas of the Yangtze River and Yuzhong Peninsula from high above. Far from the city noise, morning fog and sunset glow transform this tranquil space into a dreamlike wonderland, making it a favorite for photographers and peace-seekers.", "name": "Laojun Temple", "transport": "Take Bus 346 or 347 to \u0027Huangjueya\u0027 Station, then walk uphill along the ancient trail for 15\u201320 minutes."}, {"address": "Middle Section of Nanbin Road (opposite Sheraton Hotel), Nanan District, Chongqing", "feature": "\u2b50 4.4 stars | Located right along Nanbin Road waterfront, Haitang Yanyu Park is the origin of \u0027Begonia in the Misty Rain,\u0027 one of the famous Twelve Views of Bayu. The park features an iconic musical fountain plaza and expansive riverside promenades directly facing the Yuzhong Peninsula and Chaotianmen Pier across the river. Popular activities include strolling or cycling along the river while framing shots of the river, the Sheraton Twin Towers, and the skyline. At night, the illuminated fountain and light show create a deeply romantic ambiance.", "name": "Haitang Yanyu Park", "transport": "Take Bus 375 or 338 and get off at \u0027Haitang Yanyu Park\u0027 Station."}, {"address": "No. 105 Nanshan Park Road, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Known as the \u0027Green Lung of Chongqing,\u0027 Nanshan Botanical Garden is a high-altitude forest park. It features a greenhouse complex and themed gardens dedicated to cherry blossoms, peach blossoms, camellias, and more, offering vibrant floral displays year-round. In spring, blooming cherry blossoms cover the slopes, attracting visitors for dreamlike, Japanese-style photoshoots. The towering glass greenhouse and rare tropical plants also serve as stunning backdrops for fashion photography.", "name": "Nanshan Botanical Garden", "transport": "Take Bus 384 directly to \u0027Nanshan Botanical Garden\u0027 Station."}], "name": "Popular Photo Spots"}}, "name": "Nanbin Road and Nanshan"}, "wulong_karst": {"categories": {"cat_1": {"items": [{"address": "Bottom of the sinkhole, Three Natural Bridges Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Built in 619 AD during the Tang Dynasty, this ancient courier station sits at the bottom of the sinkhole in the Three Natural Bridges scenic area. Serving as a crucial post for official communications in ancient Fuzhou, the current classic courtyard complex was rebuilt for Zhang Yimou\u0027s movie *Curse of the Golden Flower*. It features rustic wooden structures with upturned eaves set against a 100-meter sheer cliff, exuding the solemnity and mystery of a Tang Dynasty post house amidst deep valleys.", "name": "Tianfu Official Post (Tianfu Guan Yi)", "transport": "Take the Wulong Scenic Area shuttle bus to the entrance of Three Natural Bridges, take the elevator down to the bottom of the sinkhole, and walk to reach the location."}, {"address": "Along the Wujiang River, Yangjiao Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Steeped in history, Yangjiao Ancient Town was historically a key commercial hub along the Wujiang River shipping route and a birthplace of tracker (qianfu) culture. The town preserves and restores numerous eastern Sichuan-style wooden stilt houses (Diaojiaolou) and ancient alleys dating back to the Ming and Qing dynasties. Combining Wujiang riverine heritage, tracker lore, and local delicacies, it offers an authentic canyon ancient town experience.", "name": "Yangjiao Ancient Town", "transport": "Take a local bus or taxi from urban Wulong; it takes about 20 minutes to arrive."}, {"address": "Longxi Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Nestled along the Wujiang River basin, Longxi Ancient Town is one of Wulong\u0027s best-preserved historical and cultural towns. It boasts a wealth of traditional residences from the Qing Dynasty and Republican era, bluestone-paved streets, and ancient pier ruins. Retaining its authentic rural charm and peaceful ambiance, it serves as a living fossil for studying Wujiang water transport and traditional settlement architecture.", "name": "Longxi Ancient Town", "transport": "Take a long-distance bus heading to Longxi Town from Wulong Bus Station."}, {"address": "Wangxian Village, Baima Town, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Perched atop sheer cliffs, this ancient mountain fortress complex dates back to the Ming and Qing dynasties. Utilizing the rugged terrain, it was constructed with stone fortress walls, forts, and watchtowers, serving both military defense and residential functions. The fortress offers breathtaking panoramic views of the Wujiang River Gorge, showcasing the wisdom and magnificence of ancient mountain defense architecture in eastern Sichuan.", "name": "Wangxian Ancient Fortress", "transport": "Driving or hiring a private car from downtown Wulong is recommended; it takes about 1 hour along mountain roads."}, {"address": "Tianba Village, Haokou Miao and Gelao Ethnic Township, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Haokou Miao and Gelao Ethnic Township represents the core ethnic minority culture of Wulong, featuring a large number of historic wooden stilt houses (Diaojiaolou). Built along the hillside with beautiful layers, these structures were constructed using traditional mortise-and-tenon joinery, demonstrating extraordinary craftsmanship. Strolling through the village allows visitors to experience rich ethnic heritage and rustic local customs.", "name": "Haokou Miao Traditional Village Architecture", "transport": "Driving or hiring a car from downtown Wulong is recommended, taking approximately 1.5 hours."}, {"address": "Fengshan Sub-district, Wulong District, Chongqing", "feature": "\u2b50 4.1 stars | Fuxing Temple is one of Wulong\u0027s oldest temples, boasting a long history and multiple renovations over the centuries. Its architecture blends traditional eastern Sichuan religious designs, featuring a grand gate, Mahavira Hall, and side halls decorated with painted beams, carved rafters, and sweeping eaves. The serene, ancient temple grounds stand as a witness to local faith and religious history.", "name": "Wulong Fuxing Temple", "transport": "Located near downtown Wulong, it takes about 10 minutes by local bus or taxi."}, {"address": "Canglang Village, Tudi Township, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Hidden deep in the mountains of Wulong, Canglangbao Ancient Village features historical stone gates, watchtowers, and Qing Dynasty residences. Surrounded by mountains, its solemn and rustic architecture blends pass-defense functions with agricultural living space. Radiating an evocative sense of history, it is a prime spot for exploring Wulong\u0027s historical geography and ancient architectural heritage.", "name": "Canglangbao Ancient Fortress Village", "transport": "Self-driving from Xiannvshan Town or downtown Wulong via county roads is recommended."}, {"address": "Zhaojia Township, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | The Zhao Family Ancient Village is a remarkably well-preserved complex of traditional Qing Dynasty eastern Sichuan residences, boasting several intact courtyards and wooden structures. Exquisite wooden window carvings, carved stone bases, and sweeping gabled roofs illustrate the architectural artistry and historical evolution of prominent families and rural settlements from the Qing Dynasty to the Republican era.", "name": "Zhao Family Traditional Village Residences", "transport": "Take a passenger bus bound for Zhaojia Township from downtown Wulong or drive; it takes about 40 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Next to Xiannvshan Town Tourist Center, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Located near the Fairy Mountain Town Tourist Center, this is the premier popular science venue for learning about the geological evolution and natural wonders of the Wulong Karst World Natural Heritage site. Through rich water erosion models, precious fossil specimens, and interactive immersive videos, the museum vividly demonstrates the formation of unique landforms such as sinkholes, gorges, and caves, seamlessly blending cultural exhibition with scientific education.", "name": "Wulong Karst Geology Museum", "transport": "Take the passenger shuttle bus from Wulong urban area to Xiannvshan Town, get off at the Xiannvshan Tourist Center, and walk to the destination."}, {"address": "Next to Tianfu Official Post House, Three Natural Bridges Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Celebrating the cinematic legacy of blockbusters like Curse of the Golden Flower and Transformers: Age of Extinction, this exhibition displays rare stills, replica props, and production design artwork. The collision between the historic Tianfu Official Post House and modern cinematic art creates a visually striking atmosphere, making it a must-visit spot for movie buffs and art enthusiasts.", "name": "Three Natural Bridges Movie \u0026 TV Culture Exhibition Center", "transport": "Take the scenic area shuttle bus from Xiannvshan Town Tourist Center to enter the Three Natural Bridges Scenic Area, then walk down to Tianfu Official Post House at the bottom of the sinkhole."}, {"address": "Inside Impression Wulong Theater, Taoyuan Grand Canyon, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | A cultural exhibition space dedicated to preserving and showcasing \u0027Chuanjiang Haozi\u0027 (Sichuan River boatmen\u0027s work songs), a National Intangible Cultural Heritage. Through historical footage, vintage oars, traditional boat tools, and interactive audio installations, it recreates the heroic saga of ancient Bayu boatmen battling the churning waters of the Yangtze and Wu Rivers. Paired with the background of Zhang Yimou\u0027s team\u0027s Impression Wulong show, it delivers a deeply moving cultural experience.", "name": "Impression Wulong Chuanjiang Haozi Cultural Exhibition Hall", "transport": "At night, take the Impression Wulong dedicated shuttle bus from Xiannvshan Town Tourist Center directly to the theater and exhibition hall."}, {"address": "Near the Grassland Area, Fairy Mountain National Forest Park, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Located within Fairy Mountain National Forest Park, this exhibition hall highlights the rich ethnic customs of the Tujia and Miao minority groups. It displays traditional brocade (\u0027Xilankapu\u0027), batik crafts, ethnic costumes, and local agricultural implements. Immersed in cultural charm, it is perfect for visitors interested in folk crafts and heritage.", "name": "Fairy Mountain Folk Culture Exhibition Hall", "transport": "Take the scenic sightseeing shuttle bus from Xiannvshan Town Tourist Center, get off at the Grassland Station, and walk to the hall."}, {"address": "No. 56 Fuqian Road, Fengshan Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | As Wulong District\u0027s core history museum, it houses a vast collection of precious artifacts unearthed along the Wu River basin, spanning from the Han Dynasty through the Tang, Song, Ming, and Qing Dynasties. Centered on Wu River shipping history, salt and cinnabar culture, and ancient Shu roads, it beautifully presents Wulong\u0027s deep historical heritage and artistic aesthetic\u2014an unmissable spot for understanding local culture.", "name": "Wulong District Museum", "transport": "Take local bus route 101 or 102 from Wulong Bus Station, get off at the District Government Station, and walk about 300 meters."}, {"address": "Inside Furong Cave Tourist Center, Jiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Situated in the tourist area of the Furong Cave Scenic Area, this hall integrates the geological wonders of the Furong River Gorge with the intangible cultural heritage of the Wu River basin. It features mesmerizing cave crystal specimens, antique woodcarvings, and local opera puppets, offering a captivating synthesis of natural wonders and human artistic craftsmanship.", "name": "Furong River Geology \u0026 Intangible Cultural Heritage Hall", "transport": "Take the dedicated bus heading to Jiangkou Town or Furong Cave from Wulong Passenger Transport Center, and get off at the final stop."}, {"address": "Near Jianshe East Road, Fengshan Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.0 stars | Located along the banks of the Wu River in downtown Wulong, this welcoming church boasts a simple Gothic exterior and elegant stained-glass windows. Offering a serene and peaceful atmosphere set against the surrounding mountain-and-river cityscapes, it is a rare representative religious architectural landmark in Wulong, popular among photography enthusiasts and peace-seekers alike.", "name": "Wulong Christian Church", "transport": "Take a local taxi or walk to the Jianshe East Road section in downtown Wulong."}, {"address": "Guiyuan Town, Shuizhuping Village, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Nestled in Guiyuan Town at the foot of Fairy Mountain, this artistic cultural space blends rural revitalization with modern aesthetic design. The center features a rural study room, craft workshops, and independent art exhibition halls. Hosting regular rural art exhibitions, pottery workshops, and poetry readings, it harmoniously connects nature with modern artistic lifestyle, making it a delightfully poetic hotspot.", "name": "Guiyuan Town Cultural \u0026 Art Lifestyle Center", "transport": "It is recommended to drive or take a taxi from Xiannvshan Town to Guiyuan Town; the ride takes approximately 20 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Inside Fairy Mountain National Geopark, Xiannvyushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 Stars | The largest and highest group of karst natural bridges in the world, consisting of three massive stone arch bridges: Tianlong, Qinglong, and Heilong. Deep within the valley flanked by towering cliffs lies the Tang Dynasty-style Tianfu Official Post, a famous filming location for \u0027Curse of the Golden Flower\u0027 and \u0027Transformers: Age of Extinction\u0027. Walking through the canyon offers an awe-inspiring experience of nature\u0027s majestic craftsmanship.", "name": "Three Natural Bridges (Tiansheng Sanqiao)", "transport": "Take a bus from Wulong Bus Terminal to the Xiannvyushan Town Tourist Center, then transfer to the scenic area shuttle bus."}, {"address": "Longshui Gorge Fissure Scenic Area, Xiannvyushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 Stars | A classic karst fissure landscape featuring deep valleys and sheer cliffs, formed by crustal movements hundreds of millions of years ago. Stretching 5 km, the sightseeing path built along the cliffside guides visitors past cascading waterfalls, rushing streams, surging underground rivers, and bizarre rock formations. Rich in negative oxygen ions, it feels like exploring a mysterious realm at the center of the Earth.", "name": "Longshui Gorge Fissure", "transport": "Take the scenic area shuttle bus directly from the Xiannvyushan Town Tourist Center to the entrance."}, {"address": "Fairy Mountain National Forest Park, Shuanghe Township, Wulong District, Chongqing", "feature": "\u2b50 4.6 Stars | Renowned as the \u0027Switzerland of the East,\u0027 this park sits at an average altitude of 1,900 meters and boasts hundreds of thousands of acres of alpine meadows and dense forests. Cool and pleasant in summer, it\u0027s a perfect retreat from the heat; in winter, it transforms into a picturesque snowscape featuring an outdoor ski resort. With undulating scenic roads, vast lawns, and grazing livestock, it is ideal for camping, picnics, and outdoor hiking.", "name": "Fairy Mountain National Forest Park", "transport": "About a 45-minute drive from Wulong urban area, or take a direct shuttle bus from the Xiannvyushan Town Tourist Center."}, {"address": "Furong River Bank, Jiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 Stars | Honored as one of the \u0027World\u0027s Top Three Caves\u0027 alongside Mammoth Cave in the US and Clamouse Cave in France, Furong Cave is also the only limestone cave in China listed as a UNESCO World Natural Heritage Site. It holds a vast variety of cave deposits, featuring nearly every form of stalactite, helictite, calc-flower, and stone waterfall. Artistic lighting illuminates this grand underground palace, creating a breathtaking, dreamlike spectacle.", "name": "Furong Cave", "transport": "Take a dedicated shuttle bus heading toward Jiangkou Town or Furong Cave from the Wulong Bus Station."}, {"address": "Furong River Scenic Area, Jiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 Stars | Famous for its emerald waters, verdant hills, and deep gorges, this natural scenic area features lush bamboo groves and uniquely shaped peaks. Visitors can board a sightseeing cruise deep into the canyon to spot wild monkeys on steep cliffs and cascading waterfalls, immersing themselves in poetic, dramatic landscapes\u2014a perfect spot to experience Wulong\u0027s graceful nature.", "name": "Furong River Grand Canyon", "transport": "Take a shuttle bus from Wulong urban area to Jiangkou Town, then transfer to a local taxi or shuttle to reach the pier."}, {"address": "Baimashan Scenic Area, Baima Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 Stars | Perched at an altitude of about 1,200 meters, this mountain resort overlooks Fairy Mountain across the Wu River. Themed around the romantic legend of the White Horse Prince and the Fairy, it features alpine tea plantations, the \u0027Flying Kiss\u0027 rotating observation deck, Tianchi Valley, and Tribute Tea Gardens. Shrouded in mountain mist with lush vegetation, it is ideal for taking in panoramic views of the Wu River Grand Canyon and immersing in local tea culture.", "name": "Baimashan Tianchi Love Scenic Area", "transport": "Take a bus from Wulong Bus Station to Baima Mountain, or drive there directly."}, {"address": "Lanba Scenic Area, Xiannvyushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 Stars | A resort combining natural landscapes with contemporary art, situated on a high mountain plateau evergreen all year round and surrounded by seas of clouds. Internationally renowned artists were invited to create site-specific installations, such as the \u0027Heartbeat Museum\u0027, \u0027Bamboo Sound Theater\u0027, and \u0027Moss Museum\u0027. Blending natural ecology with Zen serenity, it offers a visually and spiritually captivating experience.", "name": "Lanba International Zen Art Resort", "transport": "Drive or take a local taxi from the Xiannvyushan Town Tourist Center for about 15\u201320 minutes."}, {"address": "Along the Wu River (Yangjiao Town to Jiangkou Town section), Wulong District, Chongqing", "feature": "\u2b50 4.6 Stars | Running through Wulong, the Wu River carves out magnificent high-mountain canyons, celebrated as a \u0027100-mile natural landscape gallery.\u0027 The river runs clear and turquoise, framed by sheer cliffs, dense forests, and quaint ancient villages. Whether driving along the riverside highway or taking a scenic cruise, visitors will be treated to breathtaking views reminiscent of classic Chinese ink paintings.", "name": "Wujiang Gallery (Wulong Section)", "transport": "Drive along National Highway G319 from Wulong urban area, or catch a Wujiang Gallery cruise from Yangjiao Pier or Jiangkou Pier."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Bottom of the sinkhole, Three Natural Bridges Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | Located at the bottom of the Tianlong Bridge sinkhole in the Three Natural Bridges scenic area, Tianfu Official Inn was originally built during the Tang Dynasty. Its quaint black-tiled, wooden courtyard architecture sits beneath majestic karst cliffs. It served as the exclusive exterior filming location for the films \u0027Curse of the Golden Flower\u0027 and \u0027Transformers: Age of Extinction\u0027. The ancient courtyard style contrasts strikingly with the surrounding steep peaks, making it one of the most iconic and dramatic photo spots in all of Wulong Karst.", "name": "Tianfu Official Inn", "transport": "Take the shuttle bus from Wulong Visitor Center to the entrance of Three Natural Bridges, take the sightseeing elevator down to the bottom of the sinkhole, and walk for about 10 minutes."}, {"address": "Inside Fairy Mountain National Forest Park, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | The most talked-about viral highway in Fairy Mountain National Forest Park, this undulating road stretches along the mountain contours, creating a mesmerizing visual illusion resembling rolling ocean waves. Driving or strolling along the road reveals dense coniferous forests and alpine meadows on either side, exuding a distinct European charm. Many visitors bring telephoto lenses to capture striking, compressed-perspective photography, making it a social media favorite.", "name": "Fairy Mountain Wave Highway", "transport": "Take the dedicated scenic shuttle from Wulong Visitor Center to Fairy Mountain Park, then transfer to the sightseeing mini-train, rent a car, or walk to the Wave Highway section."}, {"address": "Longshui Gorge Fissure Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | Longshui Gorge Fissure is a massive canyon formed hundreds of millions of years ago by tectonic movement, hundreds of meters deep and only a few meters wide at its narrowest. The underground waterfall plunges down from towering cliffs hundreds of meters high, its roar echoing through the deep fissure, creating misty spray that frequently forms rainbows when hit by sunlight. Walking along the cliffside boardwalk offers a thrilling \u0027journey to the center of the Earth\u0027 experience, making it a prime location for photographers capturing dramatic gorge waterfalls.", "name": "Longshui Gorge Fissure Underground Waterfall", "transport": "Take the Fissure shuttle bus directly from the Wulong Karst Visitor Center to the scenic area entrance."}, {"address": "Middle section of Three Natural Bridges Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Qinglong (Azure Dragon) Bridge is the tallest and grandest of the Three Natural Bridges, towering at 281 meters. When sunlight streams down from the top of the sinkhole, the silhouette of the cliff walls beside the arch resembles a giant divine eagle spreading its wings to take flight\u2014a breathtaking visual phenomenon. Looking up from the sinkhole floor reveals the raw grandeur of nature\u0027s craftsmanship, making this an unmissable landmark along the tour route.", "name": "Qinglong Bridge and Shenying Sinkhole", "transport": "Walk along the Three Natural Bridges trail from Tianfu Official Inn toward the exit for about 15 minutes to reach the base of Qinglong Bridge."}, {"address": "Inside Fairy Mountain National Forest Park, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Known as the \u0027Switzerland of the East\u0027 and \u0027Chongqing\u0027s Premier Pasture,\u0027 this site features vast rolling alpine meadows sitting at an average elevation of 1,900 meters. Summers are delightfully cool with lush green grass dotted with cattle and sheep, while winters transform the landscape into a snow-covered wonderland. Visitors can enjoy mini-train rides, horseback riding, camping, and sweeping views with fresh mountain air, making it a photo-worthy paradise for families and couples alike.", "name": "Fairy Mountain Alpine Meadow", "transport": "Take the scenic shuttle bus from Xiannvshan Town Visitor Center to the entrance of Fairy Mountain Park, then take the sightseeing mini-train to the Meadow Station."}, {"address": "Furong Cave Scenic Area, Furong Riverbank, Jiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.9 stars | Acclaimed as one of \u0027China\u0027s Most Beautiful Caves,\u0027 Furong Cave is also the only cave designated as a UNESCO World Natural Heritage site. The \u0027Coral Jade Pool\u0027 inside is a rare crystalline calcite pool with crystal-clear waters. On the pool floor lie exceptionally rare and perfectly formed mineral crystals and stone corals. Illuminated by colorful lights, it creates a magical reflection like a heavenly jade pool\u2014making it the cave\u0027s most dramatic, delicate, and mesmerizing highlight.", "name": "Furong Cave Coral Jade Pool", "transport": "Take a dedicated bus from Wulong Bus Station heading to Jiangkou Town or Furong Cave, or hire a private car from the city center, then take the cable car directly to the cave entrance."}, {"address": "End section of Three Natural Bridges Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Heilong (Black Dragon) Bridge is the third bridge in the Three Natural Bridges complex, named for its deep, dark vault reminiscent of a hidden dragon. Inside, steep rock walls feature hidden underground springs such as \u0027Mist Spring,\u0027 \u0027Pearl Spring,\u0027 and \u0027Triple Cascade Spring,\u0027 with water droplets cascading hundreds of meters from the ceiling like scattered pearls amidst swirling mist. With humid, fresh air and sunbeams piercing the cave opening to create ethereal light rays (\u0027God rays\u0027), it is a dream spot for atmospheric photography.", "name": "Heilong Bridge Shenquan Springs", "transport": "Follow the scenic trail past Qinglong Bridge and continue walking for about 20 minutes to reach the Heilong Bridge area."}, {"address": "Taoyuan Grand Canyon, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Created with renowned director Zhang Yimou as chief consultant, \u0027Impression Wulong\u0027 is a grand live-action performance set inside Taoyuan Grand Canyon, a natural 200-meter-deep karst gorge. The massive U-shaped cliff walls serve as a natural backdrop and projection screen. Combined with dramatic light effects and hundreds of performers, it vividly recreates the unique Bayu \u0027Haozi\u0027 work songs and boatmen history. As night falls, the glowing gorge and moving storytelling create an unforgettable nighttime cultural spectacle.", "name": "Impression Wulong Live Show Theater", "transport": "In the evening, take the dedicated \u0027Impression Wulong\u0027 show shuttle bus from Xiannvshan Town or Wulong Bus Station to the theater."}], "name": "Popular Photo Spots"}}, "name": "Wulong Karst Scenic Area"}};
        const cityName = "Chongqing";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
