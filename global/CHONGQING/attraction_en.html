        const dbData = {"ciqikou_shapingba": {"categories": {"cat_1": {"items": [{"address": "Baiyan Mountain, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Nestled at the foot of Baiyan Mountain in Ciqikou Ancient Town, Baolun Temple sits with its back to the mountain, facing the Jialing River. Legend has it that Emperor Jianwen of the Ming Dynasty took refuge here, earning it the alternate name \u0027Longyin Temple\u0027 (Hidden Dragon Temple). The temple architecture is magnificent; remarkably, the main hall was constructed entirely of wood without using a single nail or rivet, displaying masterly ancient craftsmanship. As the oldest and largest ancient Buddhist temple in Ciqikou, it remains a bustling place of worship. Climbing to higher grounds here rewards visitors with sweeping views of the Jialing River and the ancient town.", "name": "Baolun Temple", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station, then walk for about 10 minutes."}, {"address": "No. 17, Huangjueping 1st Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 Stars | Built during the Guangxu reign of the Qing Dynasty, Zhong\u0027s Courtyard is one of the best-preserved Eastern Sichuan courtyard residences in Ciqikou Ancient Town. The compound blends the orderly symmetry of northern quadrangle courtyards with the airy elegance of southern courtyard dwellings, showcasing signature Bayu architectural charm. On display inside are late Qing and early Republican mahogany furniture, intricately carved beds, and various everyday utensils, offering an immersive glimpse into the refined lifestyle of wealthy Chongqing families of a bygone era.", "name": "Zhong\u0027s Courtyard", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station (Exit 1), enter the main street of the ancient town, and walk for about 8 minutes."}, {"address": "Huangjueping 1st Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 Stars | Originally a private school during the Qing Dynasty, Hanlin Courtyard earned its name after scholars who studied here passed the imperial examinations to become Hanlin academicians, earning it the nickname \u0027The Premier Residence in Sichuan\u0027. The ancient complex boasts exquisite brick, wood, and stone carvings within a tastefully layered layout. With its tranquil environment, wooden corridors, and rustic courtyards radiating a scholarly ambiance, it stands as an essential historical landmark for understanding traditional Bayu education and the imperial examination system.", "name": "Hanlin Courtyard", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station, enter the ancient town area, and walk for about 7 minutes."}, {"address": "Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.1 Stars | Built in the Qing Dynasty, Baoshan Palace is a renowned Taoist and cultural assembly hall building in Ciqikou Ancient Town. During the peak of Jialing River water transport, it served as the Ningbo Guild Hall and later as Ciqikou Primary School. Featuring a rigorous architectural layout, it preserves a distinctive stage and winding corridors. Today, Baoshan Palace has been revitalized into a cultural venue where visitors can experience Sichuan Opera face-changing, tea culture, and Eastern Sichuan folk customs, radiating rich historical heritage and local charm.", "name": "Baoshan Palace", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station and walk along the Main Street for about 6 minutes."}, {"address": "Near Jinkuihua Square, Ciqikou Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | Situated at the foot of Gele Mountain near Ciqikou, Feng Yuxiang\u0027s Former Residence is also known as \u0027Kangjian Hall\u0027. This Republican-era style brick-and-wood structure was the residence of General Feng Yuxiang, a famous patriotic general during the War of Resistance Against Japanese Aggression. Featuring a simple yet elegant exterior, the interior houses a wealth of precious historical photos, manuscripts, and original furniture, making it highly valuable for historical commemoration and modern architectural study.", "name": "Feng Yuxiang\u0027s Former Residence", "transport": "Take Rail Transit Line 1 to Ciqikou Station, then transfer to Bus 261 or walk there."}, {"address": "Campus A, Chongqing University, No. 174 Shazheng Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Built in the 1930s, the Old Library of Chongqing University is the central landmark of the \u0027Early Architecture Group of Chongqing University\u0027, a major national historical and cultural site. The building seamlessly blends traditional Chinese palace-style roofs with Western classical and modern structural elements, featuring grand hip-and-gable roofs and sweeping eaves. Nestled among lush trees in Campus A of Chongqing University, it stands as a testament to the glorious history and resilient spirit of higher education in Southwest China during the war.", "name": "Chongqing University Early Buildings - Old Library", "transport": "Take Rail Transit Line 1 to Shapingba Station, then transfer to Bus 215 or 808 to Chongqing University Campus A Station."}, {"address": "Jialing River Bank, Northeast side of Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 Stars | Situated on the banks of the Jialing River, Ciqikou Ancient Wharf has been one of Chongqing\u0027s most crucial land-and-water docks since the Song Dynasty, famously praised for its scene of \u0027thousands greeting by day, ten thousand lanterns glowing by night\u0027. Wide stone steps cascade down to the river, flanked by ancient buildings constructed along the hillside that showcase the unique layout of traditional mountain-city ports. It is not only a witness to the rise and fall of water transport on the Jialing River, but also a fantastic spot to enjoy river scenery and immerse oneself in ancient trading heritage.", "name": "Ciqikou Ancient Wharf", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station, walk through the main street of the ancient town directly to the riverside wharf."}, {"address": "Huangjueping Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.0 Stars | Jusenmao is a century-old traditional brand and courtyard complex in Ciqikou Ancient Town that historically served as a renowned center for Shu embroidery and porcelain crafting. The structure retains its signature Eastern Sichuan Qing-Dynasty wooden frame and small grey tile roof, with elegantly layered interior spaces. Today, combining traditional handicraft exhibitions, historic architecture preservation, and creative cultural spaces, it serves as an essential landmark for experiencing Chongqing\u0027s traditional crafts and historic merchant culture.", "name": "Jusenmao Cultural Courtyard", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station and walk into the ancient town to reach."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Huxi Campus of Sichuan Fine Arts Institute, No. 56 Daxuecheng South Road, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | Located inside the Huxi Campus of the Sichuan Fine Arts Institute in Chongqing, Luo Zhongli Art Museum is one of the largest art museums in Chongqing. Its striking exterior is covered in vibrant mosaic artwork made from colorful broken ceramic tiles, showcasing a visually captivating contemporary art style combined with rich Bayu folk tradition. The museum houses and exhibits an extensive collection of paintings, sculptures, and contemporary artwork by faculty, students, and internationally renowned artists. It is a must-visit spot for art lovers and hipsters visiting Shapingba, offering vast exhibition spaces filled with unique visual tension.", "name": "Luo Zhongli Art Museum", "transport": "Take Chongqing CRT Line 1 to Daxuecheng Station, then transfer to a bus or walk for about 15 minutes."}, {"address": "Inside Geleshan National Forest Park, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Nestled at the foot of Geleshan in Shapingba, Zhazidong was originally a small coal mine before being converted into a secret Kuomintang prison. Today, it serves as a historical museum showcasing modern history and Red culture. The site fully preserves interrogation rooms, prison cells, and exhibition halls from that era. Through a wealth of precious historical photographs, artifacts, and documents, it recounts the moving stories of revolutionary martyrs like Jiang Zhujun (Sister Jiang). Set in a solemn atmosphere, it is a key site for understanding Chongqing\u0027s history, culture, and revolutionary spirit.", "name": "Zhazidong Revolution Museum", "transport": "Take CRT Line 1 to Lieshimu Station, then transfer to Special Bus Route 210 or the scenic shuttle bus directly."}, {"address": "No. 17, Huangjueping 1st Alley, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Located in the heart of Ciqikou Ancient Town, the Zhong Family Courtyard was built during the reign of Empress Dowager Cixi in the Qing Dynasty and is one of the best-preserved classic Eastern Sichuan quadrangle courtyards in Ciqikou. The original owner served as an eunuch to Cixi. The architecture ingeniously blends the structured symmetry of Northern siheyuan with the elegance of Southern dwellings. The courtyard exhibits antique Qing furniture, wood carvings, traditional ceramics, and daily folk utensils, beautifully recreating the affluent lifestyle of Chongqing families in the late Qing and early Republican periods with a rich artistic atmosphere.", "name": "Zhong Family Courtyard Museum", "transport": "Take CRT Line 1 to Ciqikou Station and walk into the core area of the ancient town."}, {"address": "Near Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Located near downtown Shapingba, Shapingba Catholic Church is a solemn sanctuary blending Gothic architectural elements with modern design. Featuring a grand exterior with tall spires, the interior boasts beautiful Gothic vaults and exquisite stained glass windows. As sunlight pours through the stained glass into the prayer hall, it creates a serene and sacred artistic ambience. It serves as a center of faith for local Catholics and a peaceful retreat worth stopping by when visiting Shapingba.", "name": "Shapingba Catholic Church", "transport": "Take CRT Line 1 or Line 9 to Xiaolongkan Station or Shapingba Station, then walk for about 8 minutes."}, {"address": "Near Tianbao Temple, Xiyong Sub-district, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Located next to Tianbao Temple in Xiyong, Shapingba, the Former Residence of Guo Moruo was the home of Mr. Guo Moruo during the Anti-Japanese War when he led the 3rd Hall of the Political Department and the Cultural Work Committee. This elegant traditional Eastern Sichuan timber-framed dwelling sits in quiet surroundings. The museum houses rich historical documents and artifacts detailing Guo\u0027s creation of the famous historical play \u0027Qu Yuan\u0027 and his efforts in driving the wartime cultural movement, making it a culturally and historically significant museum in Shapingba.", "name": "Guo Moruo Former Residence Museum", "transport": "Take CRT Line 1 to Weidianyuan Station, then transfer to local Bus Route 291 or take a taxi."}, {"address": "Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.1 stars | Situated inside Ciqikou Ancient Town, the Bayu Folk Customs Museum is a unique museum dedicated to displaying the traditional folk culture and local crafts of the Bayu region. Its collection features traditional farm tools, wedding props, Shu embroidery, Sichuan opera masks, and intricate wood carvings. Through realistic wax figures and scene restorations, it vividly recreates old Chongqing life, festival customs, and Yangtze River dock culture, offering an excellent immersive experience into Chongqing\u0027s authentic traditional arts and heritage.", "name": "Bayu Folk Customs Museum in Ciqikou", "transport": "Take CRT Line 1 to Ciqikou Station, then walk directly into the ancient town."}, {"address": "Inside Campus A of Chongqing University, No. 174 Shapingba Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Located within the historic building cluster of Chongqing University\u0027s old campus (Campus A) in Shapingba, the museum building itself radiates rich Republican-era charm and academic elegance. Through thousands of rare photographs, archives, manuscripts of famous scholars, and historic teaching instruments, the museum systematically showcases Chongqing University\u0027s journey and academic achievements since its founding in 1929. Surrounded by lush greenery and heritage buildings, this campus museum offers a captivating reflection of higher education\u0027s evolution rich in culture and history.", "name": "Chongqing University History Museum", "transport": "Take CRT Line 9 to Chongqing University Station, or take a bus to \u0027Chongqing University Campus A Station\u0027 and walk in."}, {"address": "Huangjueping Alley, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Ciqikou Hanlin Academy is a well-preserved Qing Dynasty private school site in Ciqikou Ancient Town, renowned historically for producing prominent scholars. This charming traditional courtyard building features deep, serene gardens and houses a Hanlin culture exhibition detailing the Qing imperial examination system, traditional private schooling, and stories of local scholars. Containing precious horizontal plaques, wood carvings, and ancient books, it exudes a rich scholarly atmosphere and classic literary spirit, making it a wonderful boutique museum to explore Bayu Confucian heritage and imperial exam history.", "name": "Ciqikou Hanlin Academy Museum", "transport": "Take CRT Line 1 to Ciqikou Station, walk along the main street of the ancient town, and turn into Huangjueping Alley."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Senlin Road, Geleshan Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Known as the \u0027green lung\u0027 of urban Chongqing, Geleshan National Forest Park boasts extremely rich natural vegetation and dense forest coverage. Featuring steep, lush mountains that remain evergreen year-round, it is the premier getaway for locals seeking fresh air, a peaceful escape from the city, and panoramic views from above. The park features the famous and challenging \u0027300-Step Trail,\u0027 shaded by lush trees and filled with bird songs and floral aromas. From the peak, you can take in grand, spectacular views of Shapingba District. Blending natural beauty with a deep cultural and historical heritage, it is a versatile forest park ideal for outdoor fitness and historical exploration.", "name": "Geleshan National Forest Park", "transport": "Take Metro Line 1 to Lieshimu Station, then transfer to Bus 210 and get off at Geleshan Ropeway Station."}, {"address": "No. 52 Tianchen Road, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Shapingba Park is a historic and highly iconic comprehensive urban park in the district, holding fond memories for generations of Chongqing locals. Shaded by lush foliage, the scenic lakes and hills mirror each other, complemented by classical pavilions, winding lakeside boardwalks, and spacious plazas. Each season offers a unique charm: spring brings blooming cherry and peach blossoms that attract crowds of photography enthusiasts; summer sees blooming lotus flowers releasing a delightful fragrance; and autumn covers the ground in a golden carpet of ginkgo leaves. With an amusement area for children and traditional teahouses, it\u0027s a wonderful place to experience local Chongqing culture and enjoy nature at a relaxed pace.", "name": "Shapingba Park", "transport": "Take Metro Line 1 or Line 9 to Shapingba Station, then walk for about 10 minutes."}, {"address": "Pingdingshan Mountain Top, Xiaolongkan Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Perched along a ridge in the heart of Shapingba District, Pingdingshan Park takes its name from its flat mountain summit. It is a hilltop park combining natural scenery, ecological conservation, and city view platforms. Densely forested and serene, it offers exceptional vantage points, making it a hidden gem for viewing Chongqing\u0027s \u0027Mountain City\u0027 nightscape and the grand bend of the Jialing River. The park features multiple observation decks and quaint traditional teahouses where visitors can sip cover-bowl tea, feel the gentle mountain breeze, look down at the bustling city skyline and flowing river, and savor Chongqing\u0027s unique layered terrain and tranquil charm.", "name": "Pingdingshan Park", "transport": "Take Metro Line 1 to Xiaolongkan Station, then take a taxi or walk up the hiking trail to the park."}, {"address": "Fenghuang Village, Fenghuang Town, Shapingba District, Chongqing", "feature": "\u2b50 4.1 stars | Located in Fenghuang Town, Shapingba District, Chongqing Phoenix Flower Ocean Park is a large-scale eco-park themed around modern floral agritourism. Covering a vast area, it features hundreds of rare floral species tailored to changing seasons, creating breathtaking rainbow-like carpets of flowers across the rolling hills. Spring highlights tulips and cherry blossoms, summer brings radiant sunflowers and lavender, while autumn turns the landscape into a romantic sea of pink muhly grass. Complete with scenic greenhouses, family fruit-picking orchards, lakes, and windmills, it is a perfect destination for family outings, romantic dates, and photography lovers seeking vibrant colors.", "name": "Chongqing Phoenix Flower Ocean Park", "transport": "Take Metro Line 1 to Daxuecheng Station, then transfer to Bus 565 or take a taxi to Fenghuang Town."}, {"address": "Lianhua Village, Zengjia Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Located in Zengjia Town, Shapingba District, Lianhua Lake Scenic Area is a natural lake destination boasting pristine, untouched landscapes. Surrounded by rolling hills, bamboo groves, and pine forests, the crystal-clear lake has a thriving ecosystem. Its undulating shoreline creates numerous natural bays and peninsulas, earning its name because the water\u0027s shape resembles a blooming lotus blossom. With crisp, clean air, the lakeside campsite becomes a hot spot in autumn. Here, visitors can picnic, fish, cycle, or stroll along the boardwalk around the lake, escaping the urban bustle to immerse themselves in serene blue waters and open skies.", "name": "Lianhua Lake Scenic Area", "transport": "Take Metro Line 1 to Daxuecheng Station, transfer to Bus 271 or 290 to Zengjia Town, then take a local shuttle bus."}, {"address": "Qingshuixi Basin, next to Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Situated right next to the famous Ciqikou Ancient Town and the banks of the Jialing River, Ciqikou Qingshuixi Park seamlessly blends eco-waterfront restoration with historic town culture. Qingshui Creek runs through the park, offering lush, restored valley greenery along both banks. Gentle water-adjacent boardwalks, scenic stone bridges, and Chongqing-style stilt house pavilions line the route. After exploring the bustling ancient town, visitors can take a peaceful walk along the stream, listen to the babbling water, admire the streamside flora, and savor a rare moment of tranquil natural green space right beside the ancient town.", "name": "Ciqikou Qingshuixi Park", "transport": "Take Metro Line 1 to Ciqikou Station, then walk for about 5 minutes to reach the park entrance."}, {"address": "Chongqing University Huxi Campus, No. 55 Daxuecheng South Road, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Located within the Huxi Campus of Chongqing University, Jinjia Lake Park is celebrated as one of the most beautiful campus natural landscapes in Chongqing. Centered around the broad, rippling Jinjia Lake, the shoreline is lined with black pines, ginkgo trees, dawn redwoods, and seasonal blooms. Its most famous feature is the elegant black swans and ducks residing on the lake, bringing vibrant life to the scenic landscape. Strolling along the winding lakeside boardwalk, visitors can enjoy reflections of Huxi Mountain and modern university architecture, as well as stunning golden ginkgo avenues in autumn\u2014exuding a unique harmony of academic culture and natural serenity.", "name": "Jinjia Lake Park at Chongqing University Huxi Campus", "transport": "Take Metro Line 1 to Daxuecheng Station, then walk or take a short bus ride to the main gate of Chongqing University Huxi Campus."}, {"address": "Ridgeline area surrounding Geleshan National Forest Park, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Traversing dense mountain forests and ravines, the Geleshan Fitness Trail is a long-distance eco-mountain trail that stands as one of Shapingba\u0027s most popular outdoor hiking and nature exploration routes. Built along the mountain terrain, sections retain authentic stone steps and dirt paths flanked by towering ancient trees, intertwined vines, and rich wildlife. Resting posts and multiple observation platforms along the trail allow hikers to pause and admire views of the Jialing River or breathe in oxygen-rich forest air. It is an exceptional choice for experiencing the unique terrain of the \u0027Mountain City\u0027, exercising, and immersing oneself in Chongqing\u0027s wild natural beauty.", "name": "Geleshan Fitness Trail", "transport": "Take Metro Line 1 to Lieshimu Station, then walk to the hiking trail entrance after exiting."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 1 Cinan Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Ciqikou Ancient Town Main Street is one of Chongqing\u0027s most iconic historic and cultural districts, praised with the saying, \u0027A single flagstone path, a thousand years of Ciqikou.\u0027 Traditional Ming and Qing dynasty Eastern Sichuan architecture lines both sides of the street, with layered wooden stilt houses and grey-tiled roofs exuding a rich mountain-city charm. Here, visitors can watch local delicacies like Chen Mahua (fried dough twists) and traditional handmade hot and sour noodles being made fresh on site, filling the air with mouth-watering aromas. Traditional teahouses along the street offer a prime spot to experience old Chongqing\u0027s covered-bowl tea culture and Sichuan opera face-changing shows. On holidays, bustling crowds blend with the ancient streetscapes, making it an unmissable classic spot in Shapingba District.", "name": "Ciqikou Ancient Town Main Street", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 5 minutes."}, {"address": "Sichuan Fine Arts Institute Huxi Campus, No. 28 Daxuecheng South Road, Shapingba District, Chongqing", "feature": "\u2b50 4.7 Stars | Located at the Huxi Campus of the Sichuan Fine Arts Institute, Luo Zhongli Art Museum is the largest art museum in Chongqing and a masterclass in combining contemporary art with architectural aesthetics. Its exterior walls are decorated with millions of colorful, recycled ceramic fragments, creating a massive, vibrant mural with immense visual impact that looks like a magazine cover photo from any angle. The museum houses a rich collection and frequently hosts high-caliber contemporary art and graduation exhibitions in spaces filled with geometric lines and spatial beauty. Both its vibrant facade and artistic interior attract countless art enthusiasts and photography lovers.", "name": "Luo Zhongli Art Museum", "transport": "Take Metro Line 1 to Daxuecheng Station (Exit 2), then transfer to Bus 272 or walk for about 15 minutes."}, {"address": "Northwest side of Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 Stars | Ciqikou Back Street is a newly upgraded cultural tourism landmark. Compared to the bustling Main Street, the Back Street seamlessly blends modern creative culture with mountain city terrain. Built along the hillside, staggered staircase paths connect unique creative shops, independent cafes, and viewing platforms. The most famous spots are the elevated sky corridor and modern stilt-style building complex, offering elevated views over the ancient town\u0027s layered rooftops and the Jialing River. At night, sparkling light displays and folk music bars bring a romantic, chic vibe completely different from the day.", "name": "Ciqikou Back Street", "transport": "Take Metro Line 1 to Ciqikou Station and walk through the Main Street to reach Back Street."}, {"address": "Gele Mountain Sub-district, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | Known as the \u0027natural oxygen bar\u0027 and \u0027green lung\u0027 of central Chongqing, Gele Mountain National Forest Park features rolling hills and lush green forests. It is not only a popular spot for hiking and fitness among locals, but also a fantastic viewpoint overlooking the Shapingba urban area and the bends of the Jialing River. The Gele Mountain Cableway and tree-top adventure courses are very popular with young visitors, while the famous observation deck offers panoramic views of the layered mountain terrain and bustling cityscape. Stunning in every season, it feels like a fairyland in morning mist and turns magnificent at sunset.", "name": "Gele Mountain National Forest Park", "transport": "Take Metro Line 1 to Lieshimu Station, then transfer to Bus 210 and get off at Geleshan Ropeway Station."}, {"address": "Southwest of Ciqikou Scenic Area, Foot of Gele Mountain, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Located at the foot of Gele Mountain, Zhazidong Scenic Area is a historic memorial site rich in revolutionary heritage. Originally a small coal mine, it was later converted into a historic prison complex, with its interrogation rooms, cells, and courtyard layouts fully preserved. Surrounded by mountains on three sides, the atmosphere is secluded and solemn. Detailed historical exhibits and artifacts set against the quiet mountain environment allow visitors to reflect deeply on history, making it one of Shapingba\u0027s most educational and historically significant sites.", "name": "Zhazidong Scenic Area", "transport": "Take Metro Line 1 to Lieshimu Station, then transfer to the Zhazidong Shuttle Bus or Sightseeing Bus to reach the site directly."}, {"address": "No. 55 Daxuecheng South Road, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Renowned as one of Chongqing\u0027s most beautiful university campuses, Chongqing University\u0027s Huxi Campus seamlessly blends sleek modern architecture with ecological lake scenery. Highlights include the area around the Jin Shangyi Gallery, the mirror-like artificial lake, and golden ginkgo and dawn redwood avenues in autumn. The magnificent library, along with swans and egrets resting on green lawns, creates a vibrant academic atmosphere. During spring blossoms and autumn leaf changes, it draws many visitors and photographers to capture romantic campus strolls.", "name": "Chongqing University Huxi Campus", "transport": "Take Metro Line 1 to Daxuecheng Station, then walk or take a shared bicycle to enter the campus."}, {"address": "Jialing Riverside, East Gate of Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 Stars | Situated on the banks of the Jialing River east of the ancient town, Ciqikou Riverside Wharf was once a thriving cargo and passenger port witnessing a century of commercial history. Today, ecological restoration and landscaping have turned it into a perfect spot to get close to the river. Visitors can admire the wide river and passing boats, while dry seasons expose pebble beaches ideal for dipping feet or taking nostalgic river-town photos. At sunset, golden reflections on the water pair beautifully with the twinkling lights of the ancient town.", "name": "Ciqikou Riverside Wharf", "transport": "Take Metro Line 1 to Ciqikou Station and walk along the stone path toward the river for about 10 minutes."}, {"address": "No. 8 Xizun Road, Xiyong Microelectronics Industrial Park, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Chongqing Sunac Cultural Tourism City is a mega-scale, modern resort complex in Shapingba District, integrating Sunac Land, Snow World, Ocean World, and Water World. Sunac Land features Chongqing culture-themed zones with top-tier outdoor roller coasters and spectacular evening light-and-water shows. Snow World offers indoor skiing and snow activities, bringing winter fun to the southern region year-round. Colorful fairytale buildings, dazzling night lighting, and diverse attractions make it a joyous paradise for families, couples, and photo enthusiasts.", "name": "Chongqing Sunac Cultural Tourism City", "transport": "Take Metro Line 1 to Weidianyuan Station, then transfer to Sunac Cultural Tourism City Shuttle Bus 540 or 545 directly."}], "name": "Popular Check-in Spots"}}, "name": "Ciqikou and Shapingba"}, "dazu_carvings": {"categories": {"cat_1": {"items": [{"address": "Inside Baoding Mountain Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.9 stars | Located on the south cliff of Dafowan at Baoding Mountain, this statue was carved during the Southern Song Dynasty and is hailed as a \u0027national treasure among national treasures.\u0027 Standing 7.7 meters high, this Qianshou (Thousand-Hand) Guanyin statue features 830 outstretched arms, each holding an eye and a ritual implement. Exquisitely carved and resplendent in gold, it underwent a meticulous restoration in recent years after nearly 800 years of weathering, fully restoring its golden brilliance and magnificent grandeur. It stands as China\u0027s only stone carving masterpiece featuring over a thousand distinct hands in varying poses.", "name": "Qianshou Guanyin Statue at Baoding Mountain", "transport": "Take Dazu Bus Route 205 to Baodingshan Rock Carvings Station, then walk for about 10 minutes."}, {"address": "Inside Dafowan, Baoding Mountain Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Reclining along the east cliff of Dafowan at Baoding Mountain, this Sleeping Buddha stretches 31 meters long, making it the largest giant half-body Nirvana statue in Baoding Mountain. With its head facing north, feet to the south, facing west, and resting on its right side, the Buddha\u0027s eyes are half-closed in a serene and tranquil expression. Only the upper half of the body is carved out of the rock, evoking endless imagination of the unseen lower body. In front, nine disciples and relatives stand reverently in mourning, demonstrating extraordinary artistic imagination and religious philosophy.", "name": "Sleeping Buddha Statue at Baoding Mountain", "transport": "Take a sightseeing shuttle from the entrance of Baoding Mountain Scenic Area to the Dafowan area, then proceed on foot."}, {"address": "Core Area of Baoding Mountain Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Dafowan is the core highlighted area of the Baoding Mountain Rock Carvings, set in a vast U-shaped valley over 500 meters long. The cliff walls are densely carved with dozens of large comic-strip-style Buddhist reliefs, including the \u0027Six Realms of Reincarnation,\u0027 \u0027Illustration of Parent\u0027s Heavy Grace,\u0027 and \u0027Illustration of Hell.\u0027 Initiated and overseen by the famous Southern Song monk Zhao Zhifeng, it took 70 years to complete. Blending Buddhist, Taoist, and Confucian ethical doctrines, the sculptures are vivid and exceptionally well-preserved.", "name": "Dafowan at Baoding Mountain", "transport": "Take the direct shuttle bus to Baoding Mountain from the Dazu Bus Passenger Center."}, {"address": "Inside Baoding Mountain Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Originally built during the Chunxi period of the Southern Song Dynasty, Shengshou Temple was personally commissioned by Zhao Zhifeng, the founder of the Baoding Mountain Rock Carvings, as an affiliated Esoteric Buddhist sanctuary. Situated atop Baoding Mountain, the temple complex cascades elegantly along the mountain slope, featuring magnificent ancient structures like the Heavenly Kings Hall, Indra Hall, Mahavira Hall, and Great Compassion Hall. Peaceful and rustic with thriving incense worship, it is a magnificent sanctuary to experience Buddhist culture and ancient architectural art dating back to the Song Dynasty.", "name": "Shengshou Temple", "transport": "After touring Dafowan at Baoding Mountain, walk uphill along the mountain stairs for about 5 minutes to reach the temple."}, {"address": "No. 149 Beishan Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | The Beishan Rock Carvings were initiated during the Jingfu period of the late Tang Dynasty and spanned over 250 years across the Five Dynasties and Southern Song Dynasty. Concentrated along a 500-meter cliff at Fowan, they are renowned for delicate craftsmanship and superb technique, hailed as the \u0027Gallery of Chinese Tang and Song Grotto Art.\u0027 Among them, the \u0027Wheel-turning Sutra Storehouse Cave\u0027 is the most famous, showcasing the absolute pinnacle of Song Dynasty stone sculpture through intricate stone lattice carving and elegant, ethereal Bodhisattva figures.", "name": "Beishan Rock Carvings", "transport": "Take Dazu Bus Route 101 or 105 to Beishan Rock Carvings Station, then walk up the mountain trail for about 15 minutes."}, {"address": "Cave No. 29, Dafowan, Baoding Mountain, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Located inside Dafowan at Baoding Mountain, Yuanjue Cave is the largest and most exquisitely carved grotto at the site. It enshrines the Trikaya (Three Bodies of Buddha) and the Twelve Bodhisattvas of Perfect Enlightenment, who feature dignified, gentle expressions and fluid, silk-like drapery. The cave\u0027s most ingenious aspects are its lighting and drainage systems: a skylight at the top lets in natural light, while water drains through the mouth of a carved dragon into an underground channel, showcasing the extraordinary architectural and hydraulic wisdom of Song Dynasty craftsmen.", "name": "Yuanjue Cave (Cave of Perfect Enlightenment)", "transport": "After entering the Dafowan area of Baoding Mountain, follow the tour directional signs to Grotto No. 29."}, {"address": "Inside Nanshan Park, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Carved during the Shaoxing period of the Southern Song Dynasty, the Nanshan Rock Carvings are a highly representative Taoist grotto art site. The carvings primarily depict the Taoist pantheon. The iconic \u0027Sanqing Ancient Cave\u0027 features the Three Pure Ones (Yuqing, Shangqing, and Taiqing) along with an extensive assembly of Taoist immortals and deities. Grand in scale and meticulously organized, it serves as crucial historical material for studying Song Dynasty Taoism, its pantheon, and stone carving techniques.", "name": "Nanshan Rock Carvings", "transport": "Take a taxi for about 10 minutes from downtown Dazu to reach the entrance of Nanshan Park."}, {"address": "Shimenshan, Xinsheng Village, Shima Town, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Carved between the late Northern Song and Southern Song Dynasties, the Shimenshan Rock Carvings are distinguished by their syncretic style blending Buddhism and Taoism. Featuring 12 groups of carvings along the cliff, they depict Buddhist figures like the Medicine Buddha and Shakyamuni alongside Taoist deities such as the Jade Emperor and Shuming Guanyin. Works like the \u0027Medicine Buddha Transformation\u0027 and \u0027Three Emperors Cave\u0027 showcase exquisite carving work, merging Buddhist compassion with Taoist mysticism to reveal a unique cultural landscape of religious harmony in the Song Dynasty.", "name": "Shimenshan Rock Carvings", "transport": "It is recommended to hire a car or drive from downtown Dazu; the journey takes about 25\u201330 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Dazu Rock Carvings Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | The Dazu Rock Carvings Museum is a modern, national first-grade museum integrating artifact exhibition, conservation research, and cultural communication. It features several permanent exhibition halls, such as \u0027A Thousand Peaks: Dazu Rock Carvings History and Culture Exhibition\u0027 and \u0027Masterpieces of Cave Art Exhibition\u0027. Combining advanced digital multimedia with precious physical artifacts, it offers a comprehensive interpretation of Dazu Rock Carvings\u0027 evolution from the Tang and Song to the Ming and Qing dynasties, as well as its unique art combining Buddhism, Daoism, and Confucianism. It is the absolute best starting point for understanding the historical context and artistic value before visiting the rock carvings.", "name": "Dazu Rock Carvings Museum", "transport": "Take Dazu Bus Route 205 to Dazu Rock Carvings Tourist Center Station, then walk to the destination."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Located on the upper right side of Dafowan at Mount Baoding, Shengshou Temple was built during the Southern Song Dynasty by the famous monk Zhao Zhipheng. It is a thousand-year-old ancient temple blending Buddhist art and traditional architectural aesthetics. Built along the mountain slope in an orderly fashion, the temple houses grand halls, imperial spirit tablets, and exquisite wood and stone carvings. As a core component of the Dazu Rock Carvings Esoteric Buddhist sanctuary, it demonstrates both the profound heritage of Song Dynasty Esoteric Buddhism and master-level ancient architectural craftsmanship.", "name": "Baodingshan Shengshou Temple", "transport": "Take the direct tourist shuttle bus from Dazu Passenger Transport Center to Baodingshan, then walk to the core area of Mount Baoding."}, {"address": "Baodingshan Dafowan, Dazu Rock Carvings Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.9 stars | Dafowan is the largest and best-preserved open-air grotto art museum in the Dazu Rock Carvings area, spanning hundreds of meters. It features awe-inspiring, large-scale Song Dynasty cliff statues, including the Thousand-Hand Avalokitesvara, Wheel of Reincarnation, Nirvana of the Great Buddha, and Illustration of Filial Piety. Masterfully blending profound Buddhist doctrine with everyday secular life scenes, the vibrant, intricately carved statues are hailed as the last monument of Oriental grotto art, offering an unparalleled visual and spiritual experience.", "name": "Baodingshan Dafowan Rock Carvings Art Hall", "transport": "Take the scenic area sightseeing shuttle from Dazu Rock Carvings Tourist Center directly to the entrance of Baodingshan Dafowan."}, {"address": "Beishan Rock Carvings Scenic Area, No. 107 Beishan Road, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | Carved between the late Tang and Southern Song dynasties, the Beishan Rock Carvings are known as an exquisite gallery of Tang and Song stone art. Centered around Fowan, the exhibition area gathers hundreds of fine statue niches. The Guanyin statue in the Revolving Sutra Repository Cave is the most famous, praised as the \u0027Venus of the East\u0027. With smooth lines and intricate drapery details, it showcases the stylistic shift from Tang grandeur to Song elegance, serving as an invaluable outdoor art museum for studying mid-to-late Chinese grotto art.", "name": "Beishan Rock Carvings Art Exhibition Area", "transport": "Take Dazu Bus Route 101 or 201 to Beishan Rock Carvings Station, then walk uphill to reach the site."}, {"address": "Inside Dazu Rock Carvings Tourist Center, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Featuring top-tier international 8K ultra-high-definition dome projection technology, the Dazu Rock Carvings Dome Cinema presents two custom digital films: \u0027Dazu Rock Carvings\u0027 and \u0027Freezing Eternity\u0027. The cinema projects the historic cliff carvings onto a massive dome screen, letting visitors soar above for a panoramic view and zoom in on intricate carvings perched high on cliffs that are normally hard to see, creating a seamless fusion of modern technology and traditional stone art.", "name": "Dazu Rock Carvings Dome Cinema and Digital Art Center", "transport": "Located within the Dazu Rock Carvings Tourist Center complex; after arriving at the center, walk directly to purchase tickets and view the films."}, {"address": "Inside Nanshan Park, Nanshan Road, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Carved during the Southern Song Dynasty, the Nanshan Rock Carvings stand as one of China\u0027s largest and most representative sacred sites for Daoist grotto art. The scenic area exhibits a remarkably complete pantheon of Song Dynasty Daoist deities, including the Jade Emperor, the Three Pure Ones, and the Three Official Emperors inside the Sanqing Cave. Featuring fine carving work and solemn expressions, it is both a treasure house for Daoist culture research and an essential exhibition park for understanding Song Daoist art and sculpting technique.", "name": "Nanshan Rock Carvings Daoist Art Exhibition", "transport": "Take a taxi for about 10 minutes from downtown Dazu to reach Nanshan Park entrance."}, {"address": "Shimenshan Scenic Area, Xinsheng Village, Shima Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Famous for its integration of Buddhism and Daoism, Shimenshan Rock Carvings were created in the Song Dynasty, featuring exquisite craftsmanship and diverse subjects. The site houses renowned caves like the Medicine Buddha Cave, Sanhuang Cave, and Water-Moon Guanyin Cave. Here, Daoist Shenxiao School statues and Buddhist statues exist side-by-side, perfectly illustrating the syncretism of Song Dynasty folk beliefs. Surrounded by lush mountains in a serene atmosphere, it is a fantastic destination to connect with nature and appreciate Song sculpture art.", "name": "Shimenshan Rock Carvings Buddhist-Daoist Art Museum", "transport": "It is recommended to charter a car from downtown Dazu or take a bus to Shima Town, then transfer to a local shuttle."}, {"address": "Shizhuanshan Scenic Area, Dafo Village, Sanqu Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Created in the Northern Song Dynasty, the Shizhuanshan Rock Carvings are a classic early example of carving Confucian, Buddhist, and Daoist statues in a single location. The exhibition area includes delicate sculptures such as the Confucius and His Ten Disciples Niche (Confucianism), Taishang Laojun Niche (Daoism), and Monk Zhigong Niche (Buddhism). The statues are simple yet powerful, reflecting the open-mindedness and syncretic society of the Northern Song Dynasty, holding immense historical, cultural, and artistic value.", "name": "Shizhuanshan Three Teachings Rock Carvings Area", "transport": "Take a long-distance bus from Dazu Bus Station to Sanqu Town, then transfer to a local taxi or walk to the site upon arrival in Sanqu Town."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Yulong Lake Shore, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Located in the southern part of Dazu District and adjacent to the Dazu Rock Carvings, Longshui Lake boasts vast waters spanning thousands of acres and 108 natural islands, earning it the title of the \u0027West Lake of Chongqing.\u0027 The scenic harmony between lake and mountains changes beautifully with the seasons, making it an ideal destination for water sports, lakeside cycling, and outdoor camping.", "name": "Longshui Lake Scenic Area", "transport": "Drive directly or take Bus Route 205 from downtown Dazu to Longshui Lake Station."}, {"address": "Haitang Avenue, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | A large comprehensive ecological park in downtown Dazu, Xiangguo Park is built upon the rich cultural heritage of the \u0027Fragrant Realm of Begonias.\u0027 The park features lush greenery, surrounding waterways, and highlights like Miaogao Peak and Xiangguo Pavilion. The stunning night light show makes it the perfect spot for locals and tourists to take relaxing walks and experience the blend of nature and culture.", "name": "Xiangguo Park", "transport": "Take Dazu Bus Route 101 or 105 from downtown Dazu to Xiangguo Park Station."}, {"address": "Beishan Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Built around the Beishan Rock Carvings, Beishan Park features lush vegetation and a serene atmosphere. Winding stone-step trails meander through dense forests and ancient temples, showcasing vibrant spring blooms and fiery autumn foliage. The summit offers sweeping panoramic views of downtown Dazu, creating a natural oasis that combines cultural exploration with a refreshing forest oxygen bath.", "name": "Beishan Park", "transport": "Take Dazu Bus Route 201 to Beishan Rock Carvings Station, then walk to the park area."}, {"address": "Adjacent to Changzhou Ancient Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Named after Dazu\u0027s historical moniker, the \u0027Fragrant Realm of Begonias,\u0027 this park is planted with diverse begonia varieties that bloom into a breathtaking sea of pink every spring. Blending traditional water town gardens with Bayu architecture, it features riverside scenic trails and waterfront decks that showcase a charming, poetic natural environment.", "name": "Haitang Xiangguo Cultural Park", "transport": "Take Dazu Bus Route 103 to Changzhou Ancient Town Station and walk a short distance."}, {"address": "Miaogao Village, Jijia Town, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | Famous for its deep gorges, unique rock formations, and dense forests, Mt. Miaogao also houses the renowned Miaogaoshan Cliff Statues. With fewer tourists, it preserves a pristine, rustic ecosystem. Walking along forest trails offers crisp, oxygen-rich air, making it a hidden gem for hiking and escaping the summer heat.", "name": "Miaogaoshan Scenic Area", "transport": "Driving is recommended, or take a coach from Dazu Bus Station to Jijia Town and transfer to a local shuttle."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Extending from the Baodingshan Rock Carvings, this ecological area boasts rich mountain vegetation and clear, flowing streams. Wooden boardwalks and relaxing pavilions seamlessly connect grand Buddhist cliff art with serene natural landscapes, allowing visitors to soak in both deep history and nature\u0027s beauty.", "name": "Baodingshan Nature Park", "transport": "Take Bus Route 205 from Dazu Bus Station directly to the Baodingshan Visitor Center."}, {"address": "Nanshan Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.1 stars | Located on the southern side of downtown Dazu, Nanshan Park is home to the Nanshan Rock Carvings. Featuring rolling hills, verdant pine trees, and a peaceful atmosphere, the park offers well-paved trails through natural rock landforms and dense woods. It serves as a beloved green backyard for local morning exercise and leisure.", "name": "Nanshan Park (Dazu)", "transport": "Take Dazu Bus Route 108 to Nanshan Park Station."}, {"address": "Shengjing Road, Shuanglu Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | Shengjing Lake Park is a modern lakeside park in Dazu District, featuring mirror-like clear waters surrounded by landscaped flower gardens and scenic walking trails. Fresh air and beautiful sunset reflections over the lake make it a peaceful, charming natural retreat in the evening.", "name": "Shengjing Lake Park", "transport": "Take Dazu Bus Route 206 to Shengjing Lake Station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.9 Stars | Hailed as the \u0027national treasure of national treasures,\u0027 this magnificent statue was restored over several years to reveal its resplendent original splendor. Carved directly into the cliff face, it features 830 outstretched arms, each holding a different sacred ritual object. With breathtaking craftsmanship connecting every hand and eye, it is the only Thousand-Hand Guanyin statue in the world with over 800 actual hands, serving as the most visually stunning landmark of the Dazu Rock Carvings.", "name": "Thousand-Hand Guanyin Statue", "transport": "Take Dazu Bus Route 205 to Baodingshan Scenic Area Passenger Station, then walk for about 10 minutes."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 Stars | This is the largest single statue among the Dazu Rock Carvings, stretching a massive 31 meters long. Depicting the Buddha Shakyamuni reclining on his side with only his upper body visible, it conveys the artistic concept of \u0027half-revealed and half-concealed,\u0027 leaving endless room for imagination. Flanked by mourning disciples and patrons, the grand composition and intricate details make it a premier photo spot.", "name": "Sleeping Buddha / Shakyamuni\u0027s Parinirvana", "transport": "Follow the directional signage within the Baodingshan Scenic Area to the cliff below Shengshou Temple."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.7 Stars | Comprising Vairocana Buddha, Manjusri Bodhisattva, and Samantabhadra Bodhisattva, these three statues stand 7 meters tall with solemn, majestic expressions. Most astonishing is the stone pagoda held by the Bodhisattva, weighing hundreds of pounds and remaining suspended in the air for over a thousand years\u2014a brilliant fusion of architectural mechanics and carving mastery showcasing supreme ancient craftmanship.", "name": "Three Saints of Huayan", "transport": "Located along the main loop trail inside the Baodingshan Scenic Area; easily accessible on foot."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 Stars | Masterfully conceived, this carving consists of a massive wheel held by a demon, vividly depicting the Buddhist concepts of karma and the six realms of reincarnation. Featuring intricate layers and engaging storytelling, it seamlessly blends everyday secular life with religious philosophy, drawing endless visitors to stop, reflect, and capture photos.", "name": "Wheel of Reincarnation / Six Realms of Samsara", "transport": "Walk along the main sightseeing path within the Baodingshan Scenic Area to reach the site."}, {"address": "Beishan Road, Longgang Street, Dazu District, Chongqing", "feature": "\u2b50 4.6 Stars | Renowned for their exquisite elegance, the Beishan Rock Carvings are hailed as the \u0027Gallery of Tang and Song Dynasty Grotto Art.\u0027 Cave 136 (Wheel Sutra Repository Cave) showcases magnificent carvings, including graceful Guanyin statues imbued with profound artistic beauty. When illuminated at night, they transform into an enchanting, sacred light and shadow show.", "name": "Beishan Rock Carvings", "transport": "Take a 10-minute taxi ride from downtown Dazu to reach the Beishan Scenic Area entrance."}, {"address": "Next to the Dazu Rock Carvings Visitor Center, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.7 Stars | Located at the entrance of the Baodingshan Scenic Area, this modern museum integrates stone artifact exhibitions, a digital dome theater, and cultural research. It houses a vast collection of fine stone carvings and historical relics. A major highlight is the immersive dome cinema movie \u0027Dazu Rock Carvings,\u0027 which offers visitors deep insights into the historical lore behind the carvings.", "name": "Dazu Rock Carvings Museum", "transport": "Take Dazu Bus Route 205 to the Baodingshan Visitor Center; the museum is right next to it."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 Stars | Originally built in the Southern Song Dynasty, Shengshou Temple was personally overseen by Zhao Zhipheng, the founder of the Dazu Rock Carvings. Built along the mountain slope, the temple boasts grand, classical architecture. Imbued with rich Zen atmosphere and burning incense, it is both a sacred place for prayers and an extraordinary vantage point for taking panoramic photos and traditional Chinese style portraits.", "name": "Shengshou Temple", "transport": "Follow the signage inside the Baodingshan Scenic Area and climb the stone steps to reach the temple."}, {"address": "Inside Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.7 Stars | Sculpted in the form of a sequential comic strip, this series of carvings vividly portrays the ten stages of raising children, seamlessly blending profound filial piety culture with Buddhist teachings. Filled with relatable everyday details and expressive emotions, it is one of the most heartwarming, educational, and popular photo spots in Baodingshan.", "name": "Parents\u0027 Grace Sutra Carvings", "transport": "Located in the Dafowan area of Baodingshan; easily visited while walking along the main sightseeing trail."}], "name": "Must-Visit Photo Spots"}}, "name": "Dazu Rock Carvings Scenic Area"}, "eling_liziba": {"categories": {"cat_1": {"items": [{"address": "Inside Eling Park, No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Situated at the highest point of Eling Park, Kansheng Tower is a premier historical landmark for overlooking the confluence of the two rivers and the night view of the mountain city on the Chongqing Peninsula. Rising seven stories high, its majestic and elegant architectural style blends traditional tower design with modern reinforced concrete construction. Standing at the top offers an unobstructed 360-degree panoramic view of the Yuzhong Peninsula, Jialing River, and Yangtze River. It has been a beloved spot for celebrities and intellectuals to enjoy scenic views since the Republic of China era.", "name": "Kansheng Tower in Eling Park", "transport": "Take CRT Line 1 to Eling Station (Exit 1), then walk about 500 meters."}, {"address": "Inside Eling Park, No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Built in 1939, Feige Pavilion is an exquisite two-story hip-and-gable roof building that blends Chinese and Western architectural aesthetics. During the War of Resistance, Chiang Kai-shek and Soong Mei-ling resided here for several months, hosting numerous key political figures and international guests. Featuring flying eaves and interlocking brackets on the exterior, the interior retains a strong Republic of China decor style. Surrounded by lush greenery, it holds rich modern historical memories.", "name": "Feige Pavilion (Former Residence of Chiang Kai-shek)", "transport": "Take CRT Line 1 to Eling Station, then walk about 600 meters into the park."}, {"address": "No. 63 Jialing New Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | The Stilwell Museum was originally the former residence of General Joseph Stilwell, Chief of Staff to the Allied forces in the China Theater during WWII. Built into the cliffside, this classic mountain-city residential structure offers expansive views. The museum houses a vast collection of historical photographs, military items, and personal letters showcasing Sino-American wartime cooperation, vividly recreating historic milestones like the Flying Tigers and the Hump Route. It is a vital memorial for understanding the WWII alliance between China and the US.", "name": "General Stilwell Museum", "transport": "Take CRT Line 2 to Liziba Station, then walk uphill along Jialing New Road for about 800 meters."}, {"address": "Near No. 189 Jialing New Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Built in the 1940s, Yuanlu Villa was the private villa of Sun Ke (son of Sun Yat-sen), designed by the famous architect Yang Tingbao. Its standout feature is its modernist disc-shaped architecture, which cleverly utilizes Chongqing\u0027s mountainous terrain with a circular tower structure and ring corridors. Highly avant-garde for its era, it represents one of Chongqing\u0027s finest modern architectural heritage sites.", "name": "Yuanlu Villa (Former Residence of Sun Ke)", "transport": "Take CRT Line 1 to Eling Station, then walk downhill along Jialing New Road for about 10 minutes."}, {"address": "No. 19 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Built along the Jialing River, Liziba Anti-Japanese War Heritage Park preserves several wartime historic buildings, including the Gao Residence, Former Residence of Li Gengu, and Liu Xiang\u0027s Drinking Fountain. The park seamlessly combines river views with historical sites, showcasing brick-and-wood Republic-era architecture that offers a glimpse into the lives of political, military, and cultural figures during the wartime capital era.", "name": "Liziba Anti-Japanese War Heritage Park", "transport": "Take CRT Line 2 to Liziba Station, then walk about 300 meters."}, {"address": "No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Formerly the Central Bank Printing Factory established in 1937 (later Chongqing No. 2 Printing Factory), this park preserves the steel structures, weathered walls, and faded slogans of mid-20th-century industrial architecture, radiating vintage industrial nostalgia. Jointly revitalized by Sino-British design teams, it has transformed into a trendy cultural landmark combining creative studios, art exhibitions, cafes, and dining. It was also a primary filming location for the movie \u0027I Belonged to You\u0027.", "name": "TESTBED 2 - Former Central Bank Printing Factory", "transport": "Take CRT Line 1 to Eling Station (Exit 1), then walk about 800 meters."}, {"address": "No. 138 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Located on Eling Main Street, this historical building was constructed during World War II and served as an important witness to diplomatic activities in the wartime capital. Featuring a classic Western-style mansion design with red brick walls and wooden verandas, it enjoys a tranquil environment. Though aged by time, it preserves its original structural frame and historical character, reflecting Chongqing\u0027s diverse diplomatic culture and international standing in the 1940s.", "name": "Former Site of the Australian Embassy", "transport": "Take CRT Line 1 to Eling Station, then walk about 500 meters."}, {"address": "No. 128 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Also known as Li Yaoting Villa, Juelu Villa was built in the late Qing Dynasty/early Republic era as the private residence of wealthy merchant Li Yaoting\u0027s family. Combining eastern Sichuan residential features with Western verandah architecture, it features blue brick construction, intricately carved beams, and exquisite craftsmanship. As one of the earliest residences in Chongqing to incorporate modern Western architectural elements, it witnessed the opening of Chongqing port and the rise of modern commercial culture.", "name": "Juelu Villa (Former Residence of Li Yaoting)", "transport": "Take CRT Line 1 to Eling Station, then walk about 450 meters."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 63 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Located along the Jialing River in Liziba, this museum was formerly the residence of General Joseph W. Stilwell, Chief of Staff to the Allied China Theater during WWII. The museum houses a vast collection of precious wartime photos, historical documents, relics, and everyday artifacts, vividly depicting the alliance between China and the US during the Anti-Japanese War. Combining Republic-era mountain architecture with military historical significance, it is a must-visit for diving deep into WWII military and diplomatic history.", "name": "Chongqing Stilwell Museum", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 19 Liziba Main Street, Yuzhong District, Chongqing (Inside Liziba Anti-Japanese War Heritage Park)", "feature": "\u2b50 4.4 stars | Located within the Liziba Anti-Japanese War Heritage Park, this museum was built on the site of the former Ordnance Bureau of the Nationalist Government and its air-raid shelter network. It profoundly records the heroic history of China\u0027s modern military industry relocating west to Chongqing amid the flames of war while maintaining production. Featuring wartime weapon samples, machinery, and original shelter ruins, it offers an exceptionally impactful and immersive historical experience.", "name": "Liziba Ordnance Museum Site", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit 1, and walk for about 3 minutes."}, {"address": "Inside TESTBED2 Cultural Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Situated in the heart of the popular TESTBED2 Cultural \u0026 Creative Park, this museum was once the Central Bank Printing Plant during the Republic of China era. Preserving the industrial-ruin aesthetic of old workshop frames, weathered red brick walls, and vintage printing machinery, the museum chronicles the plant\u0027s transformation from a wartime currency printer to a post-1949 color packaging factory, and finally into today\u0027s contemporary art landmark\u2014a prime example of fusing industrial heritage with modern artistic culture.", "name": "Eling Testbed 2 History Museum", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk for about 10 minutes."}, {"address": "No. 63 Liziba Main Street, Yuzhong District, Chongqing (Same location as Stilwell Museum)", "feature": "\u2b50 4.5 stars | Adjacent to the Stilwell Museum, this hall is dedicated to showcasing the heroic achievements of the 14th Air Force (the famous \u0027Flying Tigers\u0027) led by General Claire Chennault during WWII in China. On display are flight gear, fighter plane models, rare historical photographs, and wartime communication equipment. Deeply highlighting the alliance and shared struggle against aggression, it is a favorite spot for military buffs and history enthusiasts.", "name": "Flying Tigers Exhibition Hall Chongqing", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station and walk for about 5 minutes."}, {"address": "Inside TESTBED2, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Located in the high-elevation gallery space of TESTBED2, this center is a hub for Chongqing\u0027s avant-garde art and youth culture. It regularly hosts contemporary photography exhibitions, modern sculpture showcases, visual arts displays, and independent design expos. The high ceilings and exposed rebar structures of the former printing factory clash dramatically with avant-garde contemporary aesthetics, making it a pilgrimage site for art enthusiasts and creators.", "name": "Eling Testbed 2 Contemporary Art Center", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk for about 10 minutes."}, {"address": "No. 65 Zhongshan 4th Road, Yuzhong District, Chongqing (Near Eling/Lianglukou area)", "feature": "\u2b50 4.6 stars | Situated along the Eling to Zhongshan 4th Road cultural belt, this classic Republic-era brick-and-wood villa was formerly the residence of General Zhang Zhizhong. During the 1945 Chongqing Negotiations, Mao Zedong and Zhou Enlai worked here and signed the Double Tenth Agreement, giving it immense historical and political importance. The museum meticulously restores wartime reception rooms, offices, and living quarters. Surrounded by tranquil gardens filled with sweet osmanthus trees, it is an essential cultural site for understanding a pivotal turning point in modern Chinese history.", "name": "Guiyuan Museum - Chongqing Negotiations Site", "transport": "Take Chongqing Rail Transit Line 1 or Line 3 to Lianglukou Station and walk for about 8 minutes."}, {"address": "Inside Eling Park, No. 176 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Located in the core area of \u0027Li Garden\u0027 (now Eling Park), Chongqing\u0027s earliest private garden, Shengjing Tower houses exhibits depicting the park\u0027s century-long evolution and its role as a key venue for high-ranking military commanders and diplomats during WWII. The building blends Jiangnan garden aesthetics from the late Qing and early Republic eras with local Bayu mountain architecture. Standing at the top floor, visitors can enjoy sweeping views of the confluence of the two rivers amid rich cultural heritage.", "name": "Shengjing Tower Museum in Eling Park", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 2, and walk for about 5 minutes to enter the park."}, {"address": "No. 181 Zhongshan 1st Road, Yuzhong District, Chongqing (Near Lianglukou on the east side of Eling)", "feature": "\u2b50 4.3 stars | Situated at the junction of Lianglukou and Zhongshan 1st Road near Eling, this early 20th-century church is one of Chongqing\u0027s rare, well-preserved English Gothic Revival religious buildings. Featuring gray brick exterior walls, ornate pointed arches, vintage stained-glass windows, and elegant Gothic colonnades, it exudes solemn elegance. Beyond being a place of worship for local Christians, it serves as a cultural landmark for architectural photographers and history buffs exploring Chongqing\u0027s modern Western architectural heritage.", "name": "Savior\u0027s Episcopal Church Chongqing", "transport": "Take Chongqing Rail Transit Line 1 to Qixinggang Station or Lianglukou Station, and walk for about 6 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Eling Park is Chongqing\u0027s earliest private garden (originally named Yiyuan), perched on the ridge of Eling Mountain at the highest point of the Yuzhong Peninsula. Shaded by lush, ancient trees, the park offers exceptional panoramic views overlooking the magnificent confluence of the Jialing and Yangtze Rivers. Blending late-Qing and early-Republican garden art with modern leisure vibes, the park preserves historical relics such as Ronghu Lake and Feige Pavilion, making it an ideal retreat for locals and visitors to escape urban bustle and immerse themselves in the mountain city\u0027s natural ecology and heritage.", "name": "Eling Park", "transport": "Take CRT Line 1 to Eling Station, Exit 2, and walk for about 5 minutes."}, {"address": "Foothill of the intersection of Changjiang 1st Road and Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Connected to the mountain range of Eling Park, Fotuguan Park has been a strategic military stronghold and vital transportation pass west of Chongqing since ancient times. Built along steep mountain slopes with dense vegetation, it boasts dramatic natural cliffs and forest landscapes. Every spring, plum blossoms and cherry blossoms burst into bloom, and CRT Line 2 trains glide through a sea of flowers\u2014creating the viral sensation known as \u0027the train bound for spring\u0027 that draws countless photography enthusiasts.", "name": "Fotuguan Park", "transport": "Take CRT Line 2 to Fotuguan Station, or walk along the trail from Line 1 Eling Station."}, {"address": "Inside Eling Park, No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Towering over the highest point of Eling Park, Kansheng Pavilion (also known as Liangjiang Pavilion) is the ultimate vantage point for enjoying a 360-degree night view of Chongqing and its surrounding rivers and mountains. Standing several stories high, climbing to the top floor awards visitors sweeping views of the Yuzhong Peninsula, the Yangtze River Bridge, and the scenic Jialing River. Especially at sunset and dusk, as evening lights mirror across the water alongside glowing clouds, it creates a magical tapestry of natural beauty and cityscapes.", "name": "Kansheng Pavilion at Eling Park", "transport": "After entering Eling Park, follow the signs uphill for about an 8-minute walk to reach the pavilion."}, {"address": "No. 161 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Adjacent to the famous Liziba monorail-through-building site, Liziba Anti-Japanese War Heritage Park is built along the steep foothills of the Jialing River. It is a ribbon-style park integrating river views, forest greenery, and historical culture. Shaded by lush greenery with winding quiet paths, it features several restored historic buildings and former residences of prominent figures from the war period. Strolling through the park allows visitors to enjoy up-close views of the vast Jialing River while experiencing the unique cliffside flora and rich heritage of this mountain city.", "name": "Liziba Anti-Japanese War Heritage Park", "transport": "Take CRT Line 2 to Liziba Station, Exit 1, and walk along the riverfront for about 300 meters."}, {"address": "Inside Fotuguan Park at the foot of Eling Mountain, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | The Fotuguan Cliff Walkway is a distinctive aerial forest walkway within the city\u0027s trail network. Suspended on steep rock faces, it weaves through dense forest canopies. Walking along the trail, lush cliffs and ancient trees flank one side while the Jialing River and bustling city thoroughfares lie below on the other. Designed with natural ecological preservation in mind, it features multiple viewing platforms, making it an excellent route to experience Chongqing\u0027s unique \u0027three-dimensional mountain city\u0027 geography and enjoy a refreshing trail hike.", "name": "Fotuguan Cliff Walkway", "transport": "Access by descending the trail from the back gate of Eling Park, or walk uphill along the hiking trail from CRT Line 2 Fotuguan Station."}, {"address": "East side of Eling Park, No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Located in the core scenic area of Eling Park, Ronghu Lake and Lotus Pond showcase classic Chinese traditional garden water features. Ancient banyan trees along the shore feature deep roots and lush leaves, their massive canopy covering the water like a green umbrella. The lakes feature elegant stone arch bridges, zig-zag bridges, and pavilion features scattered throughout. In summer, lotus flowers bloom in full fragrance as fish swim among lotus leaves, revealing a serene, elegant water-town charm rare for a hilltop park in Chongqing\u2014a dream spot for relaxing, taking in views, and photography.", "name": "Ronghu Lake and Lotus Pond at Eling Park", "transport": "Enter through the main gate of Eling Park and walk along the tree-lined main path on the right for about 3 minutes."}, {"address": "Liziba Section, Jialingjiang Riverside Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Located at the foot of Liziba Mountain along the southern bank of the Jialing River, the Jialing Riverfront Green Corridor is an ecological, waterfront landscape belt. The corridor features comfortable walking and cycling paths lined with rich native aquatic plants and seasonal flowers. Strolling here offers views of the wide, emerald waters of the Jialing River, while looking up reveals monorail trains passing through buildings on the cliffside alongside layered mountain city architecture\u2014a perfect fusion of natural river vistas and modern urban fantasy.", "name": "Jialing Riverfront Park Liziba Section", "transport": "Take CRT Line 2 to Liziba Station, exit and walk down the stairs to Riverside Road."}, {"address": "Inside Eling Park, No. 173 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Feige Pavilion is a uniquely styled classical hexagonal structure hidden amidst dense bamboo groves and tall trees in Eling Park. Built along the mountain slope with carved beams and painted rafters, it is surrounded by a tranquil sea of bamboo and ancient trees, creating an exceptionally serene environment. Historically a summer retreat and reception place for notable figures, it is now an exceptional scenic spot where visitors can feel the mountain breeze and listen to birdsong amidst lush greenery.", "name": "Feige Pavilion at Eling Park", "transport": "After entering Eling Park, walk towards the historical preservation area on the left for about 5 minutes to spot Feige Pavilion."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | The Liziba Monorail Station Observation Deck is one of Chongqing\u0027s most famous viral check-in spots, offering a front-row view of the spectacle where Chongqing CRT Line 2 trains pass directly through a 19-story residential building. The observation deck is specially designed with optimal viewing angles, allowing visitors to try fun forced-perspective photography like \u0027eating the monorail\u0027 or \u0027catching the monorail\u0027. Surrounded by cultural markets and local Chongqing snacks, it is a must-visit destination to experience the city\u0027s surreal, 3D terrain and unique urban transit landscape.", "name": "Liziba Monorail Station Observation Deck", "transport": "Take Chongqing CRT Line 2 to Liziba Station. Walk out of the station to reach the viewing deck below."}, {"address": "No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Formerly the Central Bank Printing Plant and Chongqing No. 2 Printing Factory, TESTBED2 was revitalized from old factory buildings while preserving a rugged industrial charm and vintage British architectural style. It gained immense fame as a primary filming location for the movie \u0027I Belonged to You\u0027. Its rooftop garden offers an unbeatable night view overseeing the confluence of the Yangtze and Jialing Rivers. Packed with independent cafes, craft workshops, art exhibitions, and specialty eateries, it is a trendy landmark that hipsters and photography enthusiasts shouldn\u0027t miss.", "name": "TESTBED2 Cultural and Creative Park", "transport": "Take Chongqing CRT Line 1 to Eling Station (Exit 1), then walk along Eling Main Street for about 10 minutes."}, {"address": "Inside Eling Park, No. 176 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Situated at the highest point of Eling Park, Kansheng Tower (also known as Liangjiang Pavilion) is a superb vantage point for sweeping views of the Chongqing peninsula embraced by the Yangtze and Jialing Rivers. Blending classical and modern architectural elements, this seven-story tower offers breathtaking, layered views of Chongqing\u0027s stunning million-dollar skyline at night. The park itself boasts a rich history\u2014originally the private villa \u0027Yi Garden\u0027 of a wealthy merchant in the late Qing Dynasty\u2014featuring lush greenery, elegant pavilions, and a serene, culturally rich atmosphere.", "name": "Kansheng Tower in Eling Park", "transport": "Take Chongqing CRT Line 1 to Eling Station (Exit 2), then walk for about 5 minutes to enter the park."}, {"address": "Along Liziba Main Street to Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Sanceng Road (Three-Tiered Road) is a mountain trail connecting Liziba and Eling, named after its three winding tiers that follow the natural mountain slopes. It seamlessly links World War II historical sites, old Chongqing residential neighborhoods, and modern creative shops, perfectly showcasing the city\u0027s 3D surreal charm where \u0027the mountain is the city, and the city is the mountain\u0027. Strolling along the trail, you\u0027ll encounter traditional teahouses under banyan trees, nostalgic murals, and viewing decks overlooking the Jialing River\u2014an ideal route for an in-depth, slow-paced exploration of local culture.", "name": "Sanceng Road Mountain City Trail", "transport": "Walk uphill from CRT Liziba Station, or head downhill along the trail from CRT Eling Station."}, {"address": "No. 1-39 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Located along the banks of the Jialing River, the Liziba Anti-Japanese War Heritage Park features meticulously preserved and restored historic buildings from the WWII era, including the Gao Mansion, Former Residence of Li Gengu, and Liu Xiang\u0027s Yinhe Room. It showcases strong Republican-era architectural style alongside a lush riverside park environment. With historical exhibitions and cultural spaces throughout, walking along the quaint stone pathways under shaded trees lets you immerse yourself in wartime memory while taking in scenic views of the river and mountain city.", "name": "Liziba Anti-Japanese War Heritage Park", "transport": "Take Chongqing CRT Line 2 to Liziba Station, exit, and walk east along Liziba Main Street for about 3 minutes."}, {"address": "No. 63 Jialing New Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | The General Stilwell Museum was originally the former residence of General Joseph Stilwell, Chief of Staff to the Allied China Theater during WWII. Built into the hillside, this vintage villa features faithfully restored rooms\u2014including General Stilwell\u0027s office, bedroom, and reception hall\u2014alongside rare historical photos, uniforms, and documents that chronicle the joint Sino-American combat efforts in the CBI Theater. Set in quiet surroundings with balcony views of the Jialing River, it holds great historical, educational, and architectural value.", "name": "General Stilwell Museum", "transport": "Take Chongqing CRT Line 2 to Fotuguan Station or Liziba Station, and walk for about 10 minutes."}, {"address": "No. 62 Jialing New Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Located next to the General Stilwell Museum, the Flying Tigers Museum was once the US Army Officers\u0027 Club. The museum exhibits a vast collection of artifacts, fighter jet models, rare photos, and historical archives detailing the American Volunteer Group (Flying Tigers) assisting China during WWII. Recounting the heroic feats of General Claire Chennault and his airmen, it stands as a key landmark celebrating WWII history and Sino-American friendship, while its Republican-style architecture attracts many history enthusiasts and photographers.", "name": "F
