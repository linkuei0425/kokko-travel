lying Tigers Museum Chongqing", "transport": "Take Chongqing CRT Line 2 to Liziba Station and walk along Jialing New Road for about 10\u201312 minutes."}, {"address": "Middle section of Sanceng Road, Jialing New Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Situated mid-slope on Sanceng Road in Eling, Juelu Villa is a classic Haipai-style (Shanghai-influenced) brick-and-wood mansion built during the Republican era. Its distinctive red brick walls, vintage arches, and exquisite carvings make it stand out among the surrounding mountain dwellings. Once home to notable historical figures, it has been thoughtfully repurposed into a space hosting vintage photography exhibitions, premium tea tasting, and cultural exchange. It is a hidden gem along Sanceng Road filled with cultural elegance and nostalgic atmosphere.", "name": "Juelu Villa Historic Site", "transport": "Accessible on foot along the Sanceng Road Trail from either CRT Line 1 Eling Station or CRT Line 2 Liziba Station."}], "name": "Popular Check-in Hotspots"}}, "name": "Eling and Liziba"}, "guanyinqiao_jiangbei": {"categories": {"cat_1": {"items": [{"address": "Inside Jiangbeizui Central Park, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | Dating back to the Guangxu reign of the Qing Dynasty, Jiangbeizui St. Teresa Catholic Church is a Gothic Revival Catholic church blending Gothic and modern architectural styles. Its soaring spires and majestic arches stand out strikingly against the backdrop of surrounding modern skyscrapers, creating a unique landscape where the old meets the new. Inside, beautiful stained-glass windows and elegant vaulted ceilings attract countlessly newlyweds for wedding photography and tourists for check-ins, making it one of the most culturally enriched architectural landmarks in Jiangbeizui Central Park.", "name": "Jiangbeizui St. Teresa Catholic Church", "transport": "Take Chongqing Rail Transit Line 6 to Jiangbaicheng Station (Exit 3), then walk for about 5 minutes."}, {"address": "Inside Jiangbeicheng Riverside Park, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 Stars | Baoding Gate is one of the few well-preserved city gate ruins among the original seventeen gates of ancient Jiangbeicheng. Built during the Qing Dynasty, it has witnessed the vicissitudes of Chongqing at the confluence of the two rivers. Built with dressed stone blocks, the wall is thick and sturdy, showcasing the exquisite craftsmanship of ancient defense engineering. Situated right along the Yangtze River, walking along the old stone steps and through the archway offers a profound sense of contrast between historical heritage and modern urban development. It serves as an important physical testament to Chongqing\u0027s ancient city defense system and Jiangbei\u0027s history.", "name": "Baoding Gate and Jiangbeicheng Ancient City Wall", "transport": "Take Chongqing Rail Transit Line 6 to Jiangbaicheng Station, then walk towards the Yangtze River for about 10 minutes."}, {"address": "Duiyinsi Street, Jiangbeicheng, Jiangbei District, Chongqing (near Chongqing Science and Technology Museum)", "feature": "\u2b50 4.3 Stars | The Rui Tomb of Ming Yuzhen is the mausoleum of Ming Yuzhen, the founder of the Daxia regime during the late Yuan Dynasty, and the only emperor\u0027s tomb in Chongqing, holding immense historical research value. Unearthed in 1982, a large number of precious artifacts were discovered, including imperial dragon robes, black silks, and gold, silver, and jade wares. Today, the mausoleum is preserved on its original site as an exhibition hall showcasing the rise and fall of the Daxia Kingdom and the legendary life of Ming Yuzhen, adding a deep sense of imperial history to this modern financial center.", "name": "Rui Tomb of Ming Yuzhen", "transport": "Take Chongqing Rail Transit Line 6 to Jiangbaicheng Station, then walk for about 8 minutes."}, {"address": "Intersection of Guihua Street and Chengtou Road, Jiangbeizui, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 Stars | Originally built in 1894, Jiangbeizui Gospel Church is a Protestant church with over a century of history. As part of the overall redevelopment of Jiangbeizui, the church was reconstructed and restored on its original site, retaining the iconic red brick, stone pillars, and classical European style while incorporating modern architectural elements. Standing gracefully in the lush Central Park, its vintage red brick walls and spires complement each other beautifully, making it a prominent historical landmark rich in culture and religious art in the Jiangbeizui area.", "name": "Jiangbeizui Gospel Church", "transport": "Take Chongqing Rail Transit Line 6 to Jiangbaicheng Station, then walk for about 6 minutes."}, {"address": "Hilltop of Jiangbeizui Central Park, Jiangbei District, Chongqing", "feature": "\u2b50 4.2 Stars | Located at the highest point of Jiangbeizui Park, Cehou Pavilion was built during the Republic of China period and is an important relic of Chongqing\u0027s early meteorological observation. Designed in a simple yet elegant traditional Chinese pavilion style, it blends historical function with scenic value. Standing beside the pavilion, visitors can enjoy sweeping views of the grand confluence of the Yangtze and Jialing Rivers, as well as the skyscrapers of Yuzhong Peninsula across the river. It is a fantastic spot to experience the harmonious blend of Chongqing\u0027s riverside scenery and historic architecture.", "name": "Cehou Pavilion (Meteorological Pavilion)", "transport": "Take Chongqing Rail Transit Line 6 to Jiangbaicheng Station, walk uphill through Central Park for about 10 minutes."}, {"address": "No. 9 Jianbei 1st Branch Road, Jiangbei District, Chongqing (near Guanyinqiao Commercial District)", "feature": "\u2b50 4.5 Stars | Formerly the Jiangbei Textile Factory warehouse built in the 1960s, Beicang Cultural and Creative Park fully preserves the brick-and-timber structure and industrial heritage of that era. Carefully renovated, it has become a tranquil cultural oasis tucked away near the bustling Guanyinqiao commercial district, hosting independent bookstores, creative craft shops, cafes, and exhibition spaces. Old red brick walls, lush greenery, and modern artistic elements blend together seamlessly, showcasing the unique charm of Chongqing\u0027s revitalized industrial heritage.", "name": "Beicang Cultural and Creative Park", "transport": "Take Chongqing Rail Transit Line 9 to Guanyinqiao Station (Exit 5), then walk for about 7 minutes."}, {"address": "Inside Hong\u0027ensi Forest Park, Hongshi Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 Stars | Located atop the hill in Hong\u0027ensi Forest Park, Hong\u0027en Pavilion is a magnificent seven-story classic structure built in the Ming and Qing architectural style, making it one of the highest observation decks in Chongqing\u0027s urban area. The architecture is grand and imposing, with flying eaves, bracket sets, and painted rafters that reflect traditional Chinese architectural aesthetics. At night, the pavilion glows in golden lights like a palace in the sky, offering panoramic night views of the Guanyinqiao commercial district and the Jialing River. It is one of Jiangbei District\u0027s most iconic and scenic historic-style landmarks.", "name": "Hong\u0027en Pavilion", "transport": "Take Chongqing Rail Transit Line 5 to Dashiba Station, then transfer to a bus or taxi for about 10 minutes to Hong\u0027ensi Park."}, {"address": "No. 7 Wenxingmen Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | Chongqing Grand Theatre is a highly representative modern landmark in Jiangbeizui. Featuring a striking green glass curtain wall and curved structure, its design resembles a sailboat gliding toward the confluence of the two rivers, symbolizing Chongqing\u0027s spirit of setting sail into the future. Combining cutting-edge modern technology with high architectural aesthetics, it shines like a sparkling emerald along the river at night. Inside, it houses a large theatre and a medium theatre, serving as Chongqing\u0027s premier cultural venue for high-end concerts, plays, and grand artistic performances.", "name": "Chongqing Grand Theatre", "transport": "Take Chongqing Rail Transit Line 6 to Grand Theatre Station (Exit 2), then walk for about 3 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Jiangbeizui Central Park, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Located inside Jiangbeizui Central Park, St. Teresa\u0027s Cathedral is a Gothic Revival Catholic church blending traditional Gothic architecture with modern elements. Originally built in 1855 and rebuilt nearby during urban redevelopment, it boasts towering spires, brilliant stained glass windows, and elegant arches. Not only is it a spiritual center for local Catholics, but it is also a popular spot for wedding photos and soaking in a peaceful artistic atmosphere. Illuminated at night, it radiates solemnity and grace.", "name": "St. Teresa\u0027s Cathedral (Jiangbeicheng)", "transport": "Take Chongqing Metro Line 6 to Jiangbaicheng Station, exit and walk for about 5 minutes."}, {"address": "No. 7 Wenxingmen Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Located in the core of Jiangbeizui Financial District, the Chongqing Science and Technology Museum is a large-scale, modern comprehensive venue for science education. Its striking architectural design symbolizes the harmony of mountains and rivers alongside technological breakthroughs. The venue houses permanent exhibition halls covering Life Science, Disaster Prevention, Transportation, Aerospace, alongside special effects theaters and interactive facilities. Whether for family learning or culture lovers interested in modern tech and design, it offers a deeply engaging and fun experience.", "name": "Chongqing Science and Technology Museum", "transport": "Take Chongqing Metro Line 6 to Jiangbaicheng Station, take Exit 2 and walk about 300 meters."}, {"address": "No. 1 Wenxingmen Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Situated at the dramatic confluence of the two rivers in Jiangbeizui, the Chongqing Grand Theatre is one of the city\u0027s premier cultural landmarks. Encased in a green glass curtain wall, the building resembles a grand vessel sailing upon the Yangtze and Jialing Rivers, seamlessly blending futuristic tech with artistic design. Equipped with world-class acoustic and stage facilities, it regularly hosts top-tier operas, ballets, symphonies, and plays. The surrounding viewing platform is also one of the best spots to admire the dazzling night view of Hongyadong and Chaotianmen Pier.", "name": "Chongqing Grand Theatre", "transport": "Take Chongqing Metro Line 6 to Grand Theatre Station, Exit 2 leads directly to the theatre plaza."}, {"address": "No. 9 Jianbei 1st Road, Jiangbei District, Chongqing (near Guanyinqiao Business District)", "feature": "\u2b50 4.4 stars | Tucked away next to the bustling Guanyinqiao commercial area, Beicang Cultural and Creative Park was transformed from a 1950s textile factory warehouse, standing as a benchmark for Chongqing\u0027s urban regeneration. Retaining traditional red-brick buildings and tall plane trees, the district features the Beicang Library, art galleries, independent workshops, trendy cafes, and designer boutiques. Hosting regular art exhibitions, craft markets, and cultural talks, it radiates a distinct bohemian charm and slow-paced lifestyle.", "name": "Beicang Cultural and Creative Park", "transport": "Take Chongqing Metro Line 3 or Line 9 to Guanyinqiao Station and walk for about 10 minutes."}, {"address": "Beibin 1st Road, Jiangbei District, Chongqing (near Guanyinqiao and Beicang)", "feature": "\u2b50 4.3 stars | Jiangbei District Art Museum is an important public cultural and artistic platform near Guanyinqiao. The venue regularly hosts contemporary art, calligraphy, photography, and intangible cultural heritage exhibitions, aiming to promote local artists while importing outstanding domestic and international showcases. Spacing a clean, modern design with bright, expansive halls, it offers a serene refuge away from the hustle, perfect for immersing oneself in visual arts and contemporary aesthetics.", "name": "Jiangbei District Art Museum", "transport": "Take Chongqing Metro Line 3 to Guanyinqiao Station or bus to Jianxin North Road Station, then walk to the destination."}, {"address": "B1, Sunshine Century Shopping Center, No. 9 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Located inside Sunshine Century Shopping Center in the Guanyinqiao commercial district, Fangsuo Commune is more than a bookstore\u2014it is a lifestyle, art, fashion, and cafe hub. Inspired by Chongqing\u0027s mountain caves and unique terrain, the space utilizes dramatic steel-concrete structures and sweeping arches to create a grand, underground temple-like aesthetic. Hosting frequent book launches, art salons, and cultural expos, it is a flagship cultural landmark of Guanyinqiao.", "name": "Fangsuo Commune (Chongqing Store)", "transport": "Take Chongqing Metro Line 3 or Line 9 to Guanyinqiao Station, with direct access via the underground walkway to Sunshine Century Shopping Center."}, {"address": "Baoding Gate Relics Area, Jiangbeizui Central Park, Jiangbei District, Chongqing", "feature": "\u2b50 4.2 stars | Located beneath Jiangbeizui Central Park around the Baoding Gate ruins, this museum is a specialized site showcasing the historical evolution of ancient Jiangbei Town and the city wall defense system of the Ming and Qing dynasties. Blending physical heritage sites with interactive multimedia, it displays ancient gates, water gates, and weathered stone city walls. Walking through, visitors travel across time to gain insight into centuries of military defense and river trade history.", "name": "Jiangbeizui City Wall Relics Museum", "transport": "Take Chongqing Metro Line 6 to Jiangbaicheng Station, and walk about 8 minutes into the central park to reach the site."}, {"address": "No. 17 Jianxin West Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Situated along the Jialing River in Jiangbei District (near Guanyinqiao), Miaoershi Creative Park was transformed from a century-old White Cat daily chemical factory. Sporting bold red exterior walls and industrial-style design, old workshops now host contemporary art exhibitions, creative studios, themed theaters, indie cafes, and unique eateries. Preserving rich industrial heritage while infusing avant-garde art and youth subcultures, it\u0027s a prime destination for photography and performance arts.", "name": "Miaoershi Creative Park", "transport": "Take Chongqing Metro Line 3 to Guanyinqiao Station, then take an 8-minute taxi ride, or take a bus to Miaoershi Station."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Intersection of Jiangbeicheng West Road and Jingang Tian\u0027an Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | A sprawling urban green space located in the heart of the Jiangbeizui financial district. The park seamlessly blends vast lush lawns and towering ancient trees with modern skyscrapers. It preserves historical landmarks such as the Ming Yuzhen\u0027s Ruiling Tomb (featuring Gothic-style architectural accents), the Holy Love Church, and the Gospel Church. A popular local spot for kite flying, picnics, camping, and wedding photography, the park\u0027s high points offer sweeping, picturesque views of the confluence of the Yangtze and Jialing Rivers.", "name": "Jiangbeizui Central Park", "transport": "Take Metro Line 6 or Line 9 to Jiangbeicheng Station; it is about a 5-minute walk from the exit."}, {"address": "Riverside Shoals near Chongqing Grand Theatre, Beibin 2nd Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 Stars | A vibrant waterfront park adjacent to the Chongqing Grand Theatre and the confluence of the two rivers. It is a prized spot for admiring the sparkling night skyline of Hongya Cave and Raffles City across the river. During the dry season, wide pebble beaches and dramatic rocky shoals are exposed, creating a unique riverbed landscape where visitors gather to splash in the water, take photos, and catch stunning sunsets. At night, colorful city neon lights mirror off the river surface, highlighting Chongqing\u0027s legendary multi-dimensional charm.", "name": "Jiangbeizui Riverbed Park", "transport": "Take Metro Line 6 to Grand Theatre Station (Exit 2), then walk about 8 minutes down to the riverbed."}, {"address": "No. 1 Hong\u0027en Road, South Side of Hongshi Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 Stars | Perched on Hong\u0027en Mountain near the Guanyinqiao commercial area, this is one of the largest forest parks in central Chongqing. It boasts dense vegetation and crisp, fresh air. Its grand jewel is the towering classical-style Hong\u0027en Pavilion, which glows brilliantly gold at night and is often dubbed Chongqing\u0027s real-life \u0027Spirited Away Tower\u0027. From the top floor, enjoy a breathtaking 360-degree panoramic view of Chongqing\u0027s nine urban districts and magical nighttime mountain landscape. In autumn, the sweet aroma of blooming osmanthus fills the air.", "name": "Hong\u0027en Temple Forest Park", "transport": "Take Bus 631 or 847 to Hong\u0027en Temple Park Station, or take a 10-minute taxi ride from the Guanyinqiao commercial area."}, {"address": "Intersection of Guanyinqiao Pedestrian Street and Guanyinqiao Ring Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 Stars | An inviting urban oasis nestled in the bustling core of the Guanyinqiao pedestrian district, seamlessly uniting nature with modern city life. Featuring a large musical fountain, shaded tree-lined walkways, and open plazas, it offers a serene retreat amid the energetic shopping scene. Locals and travelers love to stroll, relax, and watch the dynamic water fountain shows while soaking in Chongqing\u0027s vibrant yet laid-back urban rhythm.", "name": "Guanyinqiao Jialing Park", "transport": "Take Metro Line 3 or Line 9 to Guanyinqiao Station; the park is directly accessible upon exiting."}, {"address": "Riverside Zone along Beibin 1st Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 Stars | A linear waterfront greenway extending miles along the banks of the Jialing River, featuring wide fitness trails and cycling paths. Richly planted with trees and flowers, the park runs parallel to grand river views. Removed from the noise of commercial centers, it is a favorite haunt for admiring the Jialing River Bridge, glowing city skylines, and dramatic sunsets. On cool evenings, runners and strollers gather to enjoy the gentle river breeze and shimmering city lights.", "name": "Beibin Road Riverside Park", "transport": "Take Bus 672 or 868 to Huaxinjie Jiangjiatuo Station or Beibin Road Station to access the park trail."}, {"address": "Adjacent to Fortune Financial Center, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 Stars | A delicate landscape park tucked away among the glass towers of the Jiangbeizui Financial Center. Its signature feature is a unique three-tiered cascading waterfall and water feature system. Utilizing the natural slope of the terrain, the park weaves together layered water scenes, waterfront platforms, bamboo groves, colorful blooms, and resting pavilions. It serves as a peaceful hidden sanctuary for office workers on lunch breaks and photography enthusiasts seeking sleek, minimalist aesthetics.", "name": "Jiangbeizui Sandie Water Park", "transport": "Take Metro Line 6 to Grand Theatre Station or Jiangbeicheng Station, then walk for about 7 minutes."}, {"address": "Tashan Road, Cuntan Subdistrict, Jiangbei District, Chongqing", "feature": "\u2b50 4.2 Stars | A historical, natural hilltop park east of Jiangbeizui, named after the ancient Wenfeng Pagoda built during the Qing Dynasty. Filled with soaring old trees, rolling ridge lines, and preserved pristine forest terrain, it offers a true taste of mountain nature. Ascending the stone pathways to the pagoda at the peak rewards visitors with magnificent views of the winding Yangtze River and overlapping bridges\u2014making it a perfect spot for exploring antiquities, taking in river vistas, and enjoying a classic mountain hike.", "name": "Tashan Park", "transport": "Take Bus 866 or 841 to Baoshuigangqu (Bonded Port Area) Station, then walk about 15 minutes to the trailhead entrance."}, {"address": "Intersection of Dashiba Main Street and Beibin 1st Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 Stars | A hillside terrain park situated along the Jialing River near the Shimen Bridge. Built following the natural contours of the mountain, it features quiet pavilions, picturesque ponds, small bridges, and dense forests reminiscent of traditional Chinese garden design. The park\u0027s observation deck is an ideal vantage point for photographing the impressive Shimen Bridge and the dramatic Jialing River Gorge. Its peaceful environment makes it a local favorite for family picnics and morning walks.", "name": "Jiangbei Shimen Park", "transport": "Take Metro Line 5 to Dashiba Station and walk about 10 minutes, or transfer to Bus 270 to Shimen Park Station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Exterior Wall of Sun Century Building, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 Stars | One of the hottest check-in landmarks in the Guanyinqiao business district. The giant \u0027Chongqing\u0027 text on the building facade, paired with dynamic visual effects, makes it a must-visit photo spot for visitors. As night falls, light and shadow intertwine to create a cyber-magical atmosphere, showcasing the modern prosperity and ultra-trendy urban charm of this mountain city.", "name": "Guanyinqiao Giant LED Landmark Screen", "transport": "Take Metro Line 3 to Guanyinqiao Station; it is a 2-minute walk from the exit."}, {"address": "No. 7 Wenxingmen Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 Stars | A prime viewing platform located at the confluence of the Jialing and Yangtze Rivers, offering the ultimate vantage point to capture panoramic shots of Hongyadong and the Qiansimen Bridge across the river. At sunset or nightfall, the riverside park fills with photography enthusiasts eager to shoot mesmerizing river views and dazzling city lights reminiscent of scenes from the movie \u0027Spirited Away\u0027.", "name": "Chongqing Grand Theatre \u0026 Jiangbeizui Riverside Park", "transport": "Take Metro Line 6 to Jiangbeicheng Station, Exit 2, and walk for about 8 minutes."}, {"address": "No. 29 Guihua Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 Stars | A romantic Gothic-style Catholic church whose soaring spires and exquisite stained-glass windows stand out dramatically amid the skyscrapers of the Jiangbeizui financial district. A popular spot for wedding photography and hipster street photos, the striking contrast between classic European architecture and modern high-rises creates effortlessly romantic visuals.", "name": "Jiangbeizui St. Teresa Catholic Church", "transport": "Take Metro Line 6 to Jiangbeicheng Station, Exit 3, and walk for about 5 minutes."}, {"address": "No. 55 Taping, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 Stars | An artsy haven transformed from a 1950s textile warehouse, hidden right next to the bustling Guanyinqiao business district. Retaining traditional red-brick buildings and lush old trees, the park houses independent bookstores, vintage cafes, artisan workshops, and art exhibitions. Filled with a relaxed indie vibe, it\u0027s a peaceful photo destination for culture lovers.", "name": "Beicang Cultural and Creative Park", "transport": "Take Metro Line 9 to Guanyinqiao Station, Exit 6, and walk for about 10 minutes."}, {"address": "Near No. 42 Liyuchi Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | The ultimate landmark for Chongqing nightlife and trendsetters, hailed as the heart of the \u0027Sleepless City\u0027. Packed with dozens of diverse bars, nightclubs, live music bistros, and late-night food streets, it shines bright with neon lights and gets livelier as the night goes on. It\u0027s the perfect spot to experience Chongqing\u0027s vibrant night scene or snap cool urban photos against neon backdrops.", "name": "Jiu Jie Nightlife Block", "transport": "Take Metro Line 10 or Line 9 to Liyuchi Station, and walk for about 8 minutes from the exit."}, {"address": "Underground Commercial Space, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 Stars | Chongqing\u0027s first trendy commercial block dedicated to ACG (Anime, Comic, Games) and Gen Z subcultures. It features creative graffiti walls, anime merch shops, Cosplay photo spots, and cyberpunk interior design. The underground zone is filled with sci-fi light beams and futuristic setups, drawing crowds of young people to experience subculture vibes and take edgy, stylish photos.", "name": "Guanyinqiao Fangyuan LAB", "transport": "Take Metro Line 3 to Guanyinqiao Station, which directly connects to the underground commercial street."}, {"address": "Chengnan Road, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 Stars | A green jewel nestled in the financial core area, blending historical sites like the Baoding Gate ancient city wall ruins and the Ming Dynasty Tomb of Ming Yuzhen with vast grassy lawns. Here, you can capture the blend of ancient and modern scenery up close, as well as panoramic views of the two rivers converging\u2014making it an ideal location for city picnics, sunset strolls, and landscape photography.", "name": "Jiangbeizui Central Park", "transport": "Take Metro Line 6 to Jiangbeicheng Station, Exit 1, and walk for about 6 minutes."}, {"address": "Zone B, Starlight 68 Plaza, No. 68 Yanghe 1st Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | A giant cylindrical aquarium located in the atrium of Zone B at the high-end Starlight 68 Plaza shopping mall, featuring a multi-story panoramic tank. Thousands of tropical fish and sharks swim amid dreamy blue underwater lighting, making it an iconic hotspot for high-fashion check-ins and surreal ocean-themed photography.", "name": "Starlight 68 Plaza 360-Degree Aquarium", "transport": "Take Metro Line 3 to Guanyinqiao Station, Exit 5, and walk for about 7 minutes."}], "name": "Top Photo \u0026 Check-in Spots"}}, "name": "Guanyinqiao and Jiangbeizui"}, "jiefangbei_hongyadong": {"categories": {"cat_1": {"items": [{"address": "No. 177 Minzhu Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Often abbreviated as Jiefangbei, the People\u0027s Liberation Monument stands in the commercial heart of Yuzhong District, Chongqing. It is the only monument in China dedicated to victory in the War of Resistance Against Japanese Aggression. Built in 1947, this classic 27.5-meter octagonal tower was originally named the \u0027Victory Monument\u0027. Inside, a spiral staircase leads to the top, while the dignified exterior features large clocks on all four sides. It serves not only as Chongqing\u0027s most significant historical and spiritual emblem, but also as the bustling epicenter of the city\u0027s premier shopping district, witnessing the metropolis\u0027s century-long transformation from wartime capital to modern hub.", "name": "People\u0027s Liberation Monument", "transport": "Take Chongqing Rail Transit Line 2 to Linjiangmen Station, or Line 1/Line 2 to Jiaochangkou Station, and walk about 300 meters."}, {"address": "No. 88 Jialingjiang Binjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Hongya Cave features a stilted house complex infused with rich Bayu architectural style, built along the steep cliffs of the Jialing River across 11 stories. This landmark perfectly showcases the unique craftsmanship and ingenuity of old Chongqing\u0027s cliffside architecture. Its staggered wooden structures and upturned eaves, illuminated at night, evoke the mystical world of Studio Ghibli\u0027s \u0027Spirited Away\u0027. Visitors can wander through ancient, atmospheric alleys while taking in a stunning visual blend of traditional Bayu residential design and modern lighting art.", "name": "Hongya Cave Stilted Buildings", "transport": "Take Chongqing Rail Transit Line 2 to Linjiangmen Station, or Line 1/Line 6 to Xiaoshizi Station, and walk about 500 meters."}, {"address": "No. 142 Changbin Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Originally built in 1697 during the reign of Emperor Kangxi in the Qing Dynasty, Chongqing Huguang Guild Hall is the largest surviving ancient guild hall complex in the Yangtze River basin. Comprising Yu Wang Palace, Qi\u0027an Association, and Guangdong Association, it preserves the history of the massive \u0027Huguang Fills Sichuan\u0027 migration. Built into the hillside, the complex boasts yellow walls, black tiles, elaborate carved beams, and fireproof horsehead walls reflecting Jiangnan and Lingnan architectural styles. Its intricate wooden and stone carvings represent the pinnacle of Qing Dynasty craftsmanship.", "name": "Chongqing Huguang Guild Hall", "transport": "Take Chongqing Rail Transit Line 1 or Line 6 to Xiaoshizi Station (Exit 8), and walk about 800 meters toward the Yangtze River."}, {"address": "No. 7 Luohansi Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Founded during the Zhiping era of the Northern Song Dynasty (1064\u20131067), Luohan Temple is a thousand-year-old Buddhist sanctuary tucked away in the bustling Jiefangbei commercial area. The temple\u0027s highlights include the Arhat Hall, housing 500 lifelike clay statues of Arhats in various postures, and a 20-meter cliff carving dating back to the Song Dynasty. Blending classical Buddhist architecture with mountain topography, its red walls and green tiles offer a peaceful, historic contrast to the surrounding skyscrapers\u2014making it a perfect spot to escape the urban noise.", "name": "Luohan Temple", "transport": "Take Chongqing Rail Transit Line 1 or Line 6 to Xiaoshizi Station (Exit 6); the temple is right outside the exit."}, {"address": "No. 287 Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Built in 1893 during the Qing Dynasty, St. Joseph\u0027s Cathedral serves as the cathedral church of the Catholic Archdiocese of Chongqing. This historic Gothic cathedral features a clock tower over 30 meters high crowned with a cross, grey brick exterior walls, soaring vaulted ceilings, and vibrant stained glass windows inside. Solemn and elegant, it creates a striking East-meets-West cultural contrast with the surrounding traditional mountain lanes, standing as one of Chongqing\u0027s most representative modern Western religious landmarks.", "name": "St. Joseph\u0027s Cathedral Chongqing", "transport": "Take Chongqing Rail Transit Line 1 or Line 2 to Jiaochangkou Station (Exit 5), and walk about 300 meters."}, {"address": "No. 1 Wuyi Lane, Wuyi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Built in the 1910s, this classical European brick-and-timber building originally served as a diocesan hospital founded by French missionaries before becoming a vital liaison site for Sino-British military and diplomatic affairs during WWII. Featuring exquisite French architecture, its louvered windows, arched arcades, and alternating red and grey brickwork remain impeccably preserved. Meticulously restored, it now operates as a creative cultural space combining design shops, cafes, and historical exhibits showcasing the unique diplomatic heritage of wartime Chongqing.", "name": "Former Site of Sino-British Contact Office", "transport": "Take Chongqing Rail Transit Line 1 or Line 6 to Xiaoshizi Station, or Line 2 to Linjiangmen Station, and walk about 400 meters."}, {"address": "No. 74 Xinhua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Constructed in the 1930s, this landmark building served as the cornerstone of wartime Chongqing\u0027s financial center. Designed by renowned architects, it showcases a classic Neoclassical Western style, featuring a granite exterior facade, soaring Roman columns, and geometric carved motifs that exude dignity and elegance. The edifice stands not only as a testament to the master architecture of its era but also preserves the legacy of Chongqing\u0027s golden years as China\u0027s wartime financial hub.", "name": "Former Site of Central Bank of National Government", "transport": "Take Chongqing Rail Transit Line 1 or Line 6 to Xiaoshizi Station, and walk about 250 meters."}, {"address": "No. 92 Zhonghua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Founded during the Guangxu period of the Qing Dynasty, Nengren Temple is a rare Buddhist nunnery located in downtown Chongqing. Though compact in size, the complex features refined traditional Bayu timber construction, including the Main Hall and Guanyin Hall. Tucked away within the lively Jiefangbei shopping district, it creates a powerful visual contrast\u2014incense smoke and quiet antiquity inside the gates, framed by modern skyscrapers outside.", "name": "Nengren Temple", "transport": "Take Chongqing Rail Transit Line 1 or Line 2 to Jiaochangkou Station, and walk about 350 meters."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Guotai Arts Center, No. 1 Linjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Located within the Guotai Arts Center at the heart of the Jiefangbei Commercial District, the Chongqing Art Museum boasts a visually striking exterior. Inspired by traditional mortise-and-tenon structures, its interlocking red and black steel beams resemble a bonfire or stacked firewood, earning it affectionate local nicknames like the \u0027Bonfire Building\u0027 or \u0027Red Chili.\u0027 The museum regularly exhibits contemporary and traditional art, including Chinese paintings, oil paintings, prints, and sculptures. It is a must-visit contemporary art landmark for lovers of artistic exhibitions and architectural photography.", "name": "Chongqing Art Museum", "transport": "Take Chongqing Rail Transit Line 2 to Linjiangmen Station, Exit 2, and walk about 200 meters."}, {"address": "No. 85 Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Built in 1893, St. Joseph\u0027s Cathedral is the most famous Catholic church in downtown Chongqing, situated alongside bustling Minsheng Road. This Gothic building features a towering cross bell tower, thick rustic walls, soaring vaulted ceilings inside, and exquisite stained glass windows paired with beautiful sacred murals. Amidst the urban bustle, St. Joseph\u0027s Cathedral offers a sacred, peaceful, and artistic haven, attracting visitors seeking history and Gothic architectural beauty.", "name": "St. Joseph\u0027s Cathedral", "transport": "Take Chongqing Rail Transit Line 1 or Line 2 to Jiaochangkou Station, Exit 24, and walk about 300 meters."}, {"address": "No. 82 Changbin Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Located on the banks of the Yangtze River near Hongyadong and Dongshuimen Bridge, the Chongqing Huguang Guild Hall stands as a historical testament to the Qing Dynasty migration movement (\u0027Huguang Fills Sichuan\u0027). The complex includes Yuwang Palace, Qi\u0027an Guild Hall, and Guangdong Guild Hall, featuring signature bright yellow walls and intricately carved Hui-style architecture. It houses the Chongqing Immigration Museum, detailing local migration history. Visitors strolling through can admire masterful woodcarvings and fireproof gabled walls while immersing themselves in rich historical atmosphere.", "name": "Chongqing Huguang Guild Hall", "transport": "Take Chongqing Rail Transit Line 6 to Xiaoshizi Station, Exit 8, and walk about 800 meters."}, {"address": "No. 208 Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Situated near the intersection of Jiaochangkou and Minsheng Road, this museum was an important venue where Madame Song Qingling lived and engaged in foreign affairs during the Anti-Japanese War. This remarkably well-preserved brick-and-wood building combines Chinese and Western architectural styles. It displays numerous precious historical photographs, documents, original furniture, and personal items, evoking the turbulent wartime era and cultural heritage of the period. It is a memorial museum steeped in historical depth near Jiefangbei.", "name": "Chongqing Song Qingling Former Residence Museum", "transport": "Take Chongqing Rail Transit Line 1 to Jiaochangkou Station, Exit 1, and walk about 350 meters."}, {"address": "No. 42 Jintang Street, Qixinggang, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Tongyuanmen is one of the best-preserved city gate ruins of Chongqing\u0027s ancient city wall. This museum seamlessly integrates historical ruins with a charming green park space. Visitors can touch the sturdy stone walls dating back to the Ming and Qing dynasties, admire vivid bronze sculptures depicting ancient warfare scenes, and experience Chongqing\u0027s traditional slow-paced life at a teahouse atop the wall, perfectly blending ancient history with modern leisure.", "name": "Tongyuanmen City Wall Museum", "transport": "Take Chongqing Rail Transit Line 1 to Qixinggang Station, Exit 1, and walk about 300 meters."}, {"address": "Inside Shibati Traditional Scenic Area, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Baoshan Palace is one of the most iconic historical buildings within the Shibati Traditional Scenic Area, originally serving as a Qing Dynasty charitable organization and private school. Beautifully restored, it now serves as a cultural hall showcasing old Chongqing folklore and Bayu heritage. Through historical imagery, vintage artifacts, and interactive multimedia, it tells the story of Shibati\u0027s transformation. The wooden courtyard, grey bricks, and black tiles exude a rich nostalgic charm.", "name": "Baoshan Palace Cultural Exhibition Hall at Shibati", "transport": "Take Chongqing Rail Transit Line 1 or Line 2 to Jiaochangkou Station, Exit 11, and walk about 400 meters into Shibati."}, {"address": "No. 201 Xinhua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Located on Xinhua Road, the Chongqing Financial History Exhibition Hall is housed in the former Bank of China site built in the 1930s, featuring classic Neoclassical Western architecture. The exhibition chronicles Chongqing\u0027s history as China\u0027s financial center during wartime and its modern role as a commercial hub. Displays include rare banknotes, financial vouchers, and historical documents. Its majestic exterior and rich displays make it a hidden gem for architecture and history enthusiasts.", "name": "Chongqing Financial History Exhibition Hall", "transport": "Take Chongqing Rail Transit Line 1 or Line 6 to Xiaoshizi Station, Exit 5, and walk about 250 meters."}, {"address": "No. 75 Zhongshan 4th Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Named after the famous Chinese printmaker and art theorist Mr. Wang Qi, this museum is located in an artistic neighborhood near Zhongshan 4th Road in Yuzhong District. It houses a rich collection of modern printmaking works and contemporary fine art, hosting special themed exhibitions and lectures regularly. With its elegant and refined ambiance, it is a fantastic destination to explore contemporary printmaking art and humanistic aesthetics in the Mountain City.", "name": "Wang Qi Art Museum", "transport": "Take Chongqing Rail Transit Line 2 to Zengjiayan Station, Exit C, and walk about 500 meters."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Near the intersection of Cangbai Road and Daijia Xiang, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Located right next to the Hongyadong Scenic Area, Daijia Xiang Cliff Path Park is an ingeniously crafted mountain-city cliff park. Built along sheer precipices, the path winds through lush greenery and historic Chongqing residential quarters, featuring multiple scenic platforms along the way. Visitors can stroll along the verdant, steep walkways to experience Chongqing\u0027s unique geology up close while taking in breathtaking views of the Jialing River and Qiansimen Bridge. It is a fantastic spot for relaxing and taking photos that combine natural greenery with urban cliffside charm.", "name": "Daijia Xiang Cliff Path Park", "transport": "Take Metro Line 2 or Line 6 to Linjiangmen Station or Xiaoshizi Station, then walk for about 5-8 minutes."}, {"address": "No. 1 Sichuan Road, Yuzhong District, Chongqing (near Jiefangbei Pedestrian Street)", "feature": "\u2b50 4.3 stars | Founded in 1926, Chongqing People\u0027s Park is the oldest municipal park in central Chongqing, acting as a tranquil oasis in the bustling Jiefangbei commercial district. Built into the mountain, layered green trees and quaint stone steps complement each other, with many precious tall trees and historical monuments preserved inside. It is a favorite spot for local residents to do morning exercise, sip tea, and chat, filled with a strong local mountain-city vibe and refreshing lushness that lets you escape the hustle and bustle.", "name": "Chongqing People\u0027s Park", "transport": "Take Metro Line 1 or Line 2 to Jiaochangkou Station (Exit 9), then walk for about 6 minutes."}, {"address": "No. 74 Pipashan Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Situated on one of the highest points of Yuzhong Peninsula at 345 meters above sea level, Pipashan Park features dense vegetation and towering trees with evergreen natural scenery year-round. The Red Star Pavilion inside offers a fantastic vantage point to overlook the Jiefangbei skyline and the confluence of the two rivers. Far from the noisy commercial areas, its winding stone pathways and thick canopy create a natural oxygen bar, attracting nature lovers and hikers alike.", "name": "Pipashan Park", "transport": "Take Metro Line 1 to Qixinggang Station (Exit 2), then walk for about 10-15 minutes."}, {"address": "No. 176 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Originally named \u0027Yi Garden\u0027, Eling Park is Chongqing\u0027s earliest private garden, named after its terrain resembling a goose\u0027s neck. Perched high on the narrow ridge of Yuzhong between the Yangtze and Jialing Rivers, the park blends classical landscape architecture with breathtaking natural scenery. Kansheng Tower within the park is an iconic spot for panoramic views of Chongqing\u0027s skyline and nightscapes. Strolling through bamboo groves, pavilions, and century-old trees offers a unique experience of the mountain city\u0027s high-altitude forest landscape.", "name": "Eling Park", "transport": "Take Metro Line 1 to Eling Station (Exit 2), then walk for about 5 minutes to reach the park entrance."}, {"address": "Jialing River Binjiang Road, Yuzhong District, Chongqing (Riverfront area below Hongyadong Scenic Area)", "feature": "\u2b50 4.5 stars | Extending along the Jialing River below Hongyadong, Jialing River Waterfront Park is an urban riverfront park blending natural river views with landscaped greenery. It features expansive riverbank lawns and riverside walking paths lined with tropical plants and native flowers. Any snapshot captures a picturesque cityscape blending broad waters with soaring skyscrapers. Refreshed by gentle river breezes, it is a favorite retreat for visitors and locals after exploring Hongyadong.", "name": "Jialing River Waterfront Park", "transport": "Take Metro Line 2 to Linjiangmen Station or Line 6 to Xiaoshizi Station, then walk through Hongyadong directly down to Binjiang Road."}, {"address": "Cangbai Road, Yuzhong District, Chongqing (11th floor, top level of Hongyadong)", "feature": "\u2b50 4.6 stars | Situated at the top level of Hongyadong (level with Cangbai Road), Hongyadong City Balcony Park is an elevated sky-plaza park. Ingeniously taking advantage of Chongqing\u0027s multi-layered topography, it features lush flower beds, waterscapes, and a spacious viewing platform atop a dozens-of-meters-high cliff. Surrounded by landscaped trees and seasonal flowers, standing on this balcony offers unobstructed views of the Jialing River and Qiansimen Bridge\u2014a double feast for the eyes and the senses.", "name": "Hongyadong City Balcony Park", "transport": "Take Metro Line 6 or Line 2 to Xiaoshizi Station (Exit 6 or 9), then walk for about 5 minutes."}, {"address": "Changjiang Binjiang Road, Yuzhong District, Chongqing (Next to the northern end of the Yangtze River Bridge)", "feature": "\u2b50 4.2 stars | Located near the northern head of the Yangtze River Bridge in Yuzhong District, Shanhu Park is a large riverfront park on the Yuzhong Peninsula. Featuring sprawling lawns, tree-lined avenues, and exquisite gardens, it offers a rare expansive green space in the bustling city center. Following recent upgrades, it provides comfortable riverside trails and relaxation lawns, allowing visitors to enjoy views of the Yangtze River and the majestic bridge surrounded by vibrant foliage.", "name": "Shanhu Park", "transport": "Take Metro Line 1 or Line 3 to Lianglukou Station, then transfer to a bus or walk for about 15 minutes."}, {"address": "Yanziyan Area, Nanjimen Sub-district, Yuzhong District, Chongqing (near the southern end of Shibati Scenic Area)", "feature": "\u2b50 4.3 stars | Located along the cliffside belt of Yuzhong District near Shibati and Baixiang Street, Yanziyan Cliff Ecological Park cleverly utilizes the city\u0027s steep cliff topography for ecological restoration. It features steep trails and elevated platforms that create a 3D forest feel. Lush native plants and vines climb over old stone walls, echoing with birdsong and flower fragrance. A stroll here lets you experience wild cliffside beauty while taking in lofty views of the Yangtze River, showcasing Chongqing\u0027s unique harmony between mountain, river, and city.", "name": "Yanziyan Cliff Ecological Park", "transport": "Take Metro Line 1 or Line 2 to Jiaochangkou Station, then walk toward Shibati and down into the Lower City area."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 100 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 Stars | As Chongqing\u0027s most iconic central landmark and bustling commercial hub, the People\u0027s Liberation Monument stands proudly at the center of the square, symbolizing the city\u0027s historical memory and spirit. As night falls, the neon lights of surrounding modern skyscrapers blaze brilliantly, creating a striking contrast with the classic monument. It is a must-visit spot to experience the collision of history and modern fashion in this magical mountain city.", "name": "Jiefangbei Pedestrian Street (Jiefangbei Shopping Square)", "transport": "Take Chongqing CRT Line 2 to Linjiangmen Station, or Line 1/Line 2 to Jiaochangkou Station, then walk about 3 minutes."}, {"address": "No. 88 Jialing River Riverside Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 Stars | Featuring traditional Bayu \u0027Diaojiaolou\u0027 (stilt houses), this complex is built along the mountain cliffs facing the river. When evening falls and the lights turn on, the entire 11-story structure glows in golden light, resembling the mysterious bathhouse from Studio Ghibli\u0027s \u0027Spirited Away\u0027. Looking out from Qiansimen Bridge, you can take in the breathtaking panorama of the illuminated stilt houses and the dazzling river view.", "name": "Hongya Cave Folk Custom Scenic Area", "transport": "Take Chongqing CRT Line 2 to Linjiangmen Station and walk about 8 minutes; or take Line 6 to Xiaoshizi Station and walk about 10 minutes."}, {"address": "No. 7 Linjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | A quintessential attraction showcasing Chongqing\u0027s \u00278D surreal terrain\u0027. Just when you think you\u0027re standing on a ground-level plaza, walking to the edge reveals you\u0027re actually on the rooftop of a 22-story building! This mind-bending illusion of \u0027standing on the 1st floor with 22 floors below you\u0027 attracts countless visitors eager to snap stunning cliff-edge photos.", "name": "Kuixing Pavilion Sky Square", "transport": "Take Chongqing CRT Line 2 to Linjiangmen Station (Exit 2), then walk about 5 minutes."}, {"address": "No. 151 Xinhua Road, Yuzhong District, Chongqing (Xinhua Road North Station)", "feature": "\u2b50 4.5 Stars | Known as the \u0027First Air Corridor of the Yangtze River\u0027, it was once a daily commuting cable car for local residents and has now become a wildly popular attraction for experiencing the city\u0027s 3D landscape. Inside the cable car, enjoy a unique 360-degree view overlooking the mighty Yangtze River, towering skyscrapers on both banks, and the grand confluence of the two rivers.", "name": "Yangtze River Cableway", "transport": "Take Chongqing CRT Line 1 or Line 6 to Xiaoshizi Station (Exit 5B), then walk about 2 minutes."}, {"address": "Daijia Lane, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | Adjacent to Hongya Cave, this boardwalk suspended over a 100-meter cliff beautifully showcases the harmonious blend of urban renewal and dramatic topography. As you walk down the winding trail, you\u0027ll enjoy breathtaking views of the Jialing River and Qiansimen Bridge, while discovering hipster cafes, craft beer bars, and vintage alleyways along the cliffside.", "name": "Daijia Lane Cliff Trail", "transport": "Take Chongqing CRT Line 2 to Linjiangmen Station, then walk about 6 minutes to the Daijia Lane entrance."}, {"address": "No. 7 Luohansi Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 Stars | Founded during the Northern Song Dynasty, this ancient temple is tucked away in a narrow alley surrounded by modern skyscrapers, creating a visually striking contrast of ancient and contemporary worlds. It is famous for its 500 lifelike clay Arhat statues, scripture hall, and ancient stone carvings. The temple also served as a filming location for the hit movie \u0027Crazy Stone\u0027, attracting movie fans and culture lovers alike.", "name": "Luohan Temple", "transport": "Take Chongqing CRT Line 1 or Line 6 to Xiaoshizi Station (Exit 6); the entrance is right outside."}, {"address": "Floors 73-74, Chongqing World Financial Center, No. 188 Minzu Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 Stars | Located on the 73rd and 74th floors of the Chongqing World Financial Center at an altitude of 590 meters, this is the ultimate vantage point to look down upon the peninsula. Stepping onto the open-air \u0027Eye of the Clouds\u0027 deck offers an unobstructed 360-degree panorama, taking in the grand river confluence, magnificent bridges, and the mesmerizing sea of city lights at night.", "name": "WFC Eye of the Clouds Observation Deck", "transport": "Take Chongqing CRT Line 2 to Linjiangmen Station, then walk about 3 minutes to reach the World Financial Center."}, {"address": "No. 1 Zhongxing Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | Connecting upper and lower Chongqing, this historic street was once the heart of local life in old Chongqing. Beautifully restored, it retains traditional stone steps and Eastern Sichuan stilt house architecture, blended with modern creative shops and evening light shows. Strolling down the flagstone stairs feels like stepping back in time to experience the rich heritage and vibrant everyday life of old mountain alleys.", "name": "Shibati Historic District", "transport": "Take Chongqing CRT Line 1 or Line 2 to Jiaochangkou Station (Exit 11); the upper entrance to Shibati is right outside."}], "name": "Popular Photo Spots"}}, "name": "Jiefangbei and Hongya Cave"}, "jiulongpo_huangjueping": {"categories": {"cat_1": {"items": [{"address": "No. 104-5, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | Built in 1987, Jiaotong Tea House is Chongqing\u0027s most authentic time-honored tea house, brimming with vintage charm and old Bayu culture. The building preserves the typical 1980s timber-frame structure and traditional column-and-tie construction. The roof is made of aged wooden beams and translucent tiles, while the floor consists of mottled gray bricks and dirt. Originally a canteen for employees of the Huangjueping Transport Company, it was later converted into a teahouse rich with historical nostalgia. Inside, dozens of worn bamboo chairs and square wooden tables are neatly arranged, where locals gather to sip lidded bowl tea, play cards, and play mahjong. Steeped in the lively atmosphere of everyday life and historical depth, it not only attracts film shoots but is also a premier landmark for experiencing old Chongqing market life and wooden architectural heritage.", "name": "Jiaotong Tea House", "transport": "Take CRT Line 18 to Huangjueping Station, exit and walk about 5 minutes; or take Bus 223 or 823 to Huangjueping Station."}, {"address": "No. 108, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Founded in the 1950s, the Huangjueping Campus of Sichuan Fine Arts Institute is the birthplace of modern art and design education in Southwest China. The campus preserves a large cluster of Soviet-style red brick buildings, old teaching facilities, and sloping roofs from the early PRC era. Nestled among lush trees, the vine-covered walls and aged facades display immense architectural art value and historical depth. Strolling through the campus allows visitors to absorb both the solemn architectural charm and the unique artistic imprint left by master artists, making it a key educational and cultural landmark in Huangjueping.", "name": "Old Buildings of Sichuan Fine Arts Institute (Huangjueping Campus)", "transport": "Take CRT Line 18 to Huangjueping Station and walk about 300 meters from the exit; or take Bus 233 to SCFAI Huangjueping Campus Station."}, {"address": "Near Dianli Wucun, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Built in the 1950s, the Huangjueping Power Plant was a vital major power facility in post-1949 Chongqing, witnessing the rise of modern industrialization in the city. Its most iconic features are two towering giant chimneys over 100 meters tall, which once dominated the skyline of Huangjueping and Jiulongpo District. Although the plant shut down as part of urban green transitions and industrial upgrades, the structure\u2014with its distinct Bauhaus aesthetic and heavy-industrial character\u2014has been completely preserved, becoming a central hub for industrial heritage preservation and creative arts in Huangjueping.", "name": "Huangjueping Power Plant Chimneys and Industrial Heritage Site", "transport": "Take CRT Line 18 to Tanzikou Station or Huangjueping Station, then walk about 10 minutes along Huangjueping Main Street toward the river to view or reach the site."}, {"address": "No. 126, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Formerly the No. 1 Warehouse of the Chongqing Tobacco Company built in the 1950s, 501 Art Base is a classic example of large-scale industrial and military warehouse architecture. The structure features towering brick-and-timber alongside reinforced concrete designs typical of its era, offering high ceilings, sturdy construction, and a solid, rustic industrial aesthetic. Revitalized by contemporary artists moving in, this once-silent warehouse retained its weathered exterior walls, massive iron gates, and historical marks, successfully transforming into a stellar model of historic building adaptive reuse that combines art studios, galleries, and exhibition spaces.", "name": "501 Art Base (Former Tobacco Warehouse)", "transport": "Take CRT Line 18 to Huangjueping Station and walk about 400 meters; or take Bus 223 or 233 to Huangjueping Station."}, {"address": "No. 1, Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | Built against the hillside, the Chongqing Jianchuan Museum Cluster possesses a deeply powerful historical setting\u2014originally the subterranean air-raid shelter system for the 1st Arsenal (Hanyang Arsenal) during the War of Resistance against Japanese Aggression. Comprising 24 massive, practical ordnance air-raid shelters, this complex serves as a symbol of resilience for China\u0027s national and military industries during WWII. Preserving the original rock vaulted ceilings, reinforced steel framing, and industrial traces, the museum seamlessly integrates solemn wartime history and industrial heritage into unique underground spaces, making it a one-of-a-kind military history landmark in Jiulongpo and Xiejiawan.", "name": "Chongqing Jianchuan Museum Cluster - Ordnance Cave Site", "transport": "Take CRT Line 2 or Loop Line to Xiejiawan Station, leave from Exit B, and walk about 10 minutes; or take CRT Line 18 to Xiejiawan Station."}, {"address": "Near the intersection of Xiejiawan Main Street and Yangjiaping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 stars | Originally the relocated Hanyang Arsenal founded by Zhang Zhidong during the Self-Strengthening Movement, the former Chongqing Jianshe Machine Tool Factory is one of the cradles of modern Chinese military defense and machinery manufacturing. Situated between Yangjiaping and Xiejiawan in Jiulongpo, the site features Soviet-style red brick workshops, soaring timber-framed halls, and historical industrial structures. It bears witness to Chongqing\u0027s dramatic transformation from an early military stronghold into a modern industrial metropolis. Today, parts of the factory complex have been creatively renovated into commercial spaces and cultural heritage parks, bridging rich industrial history with vibrant modern urban life.", "name": "Former Site of Chongqing Jianshe Machine Tool Factory", "transport": "Take CRT Line 2 to Yangjiaping Station or Xiejiawan Station, and walk about 5 to 8 minutes to reach the surrounding heritage area."}, {"address": "Intersection of Yangjiaping Heng Street and Tiema Road, Jiulongpo District, Chongqing", "feature": "\u2b50 4.1 stars | Built during the Third Front Construction period, the Tiema Group\u0027s old factory site (formerly State-Owned Factory No. 256) is a vital historical testament to Chongqing\u0027s industrial development and heavy machinery manufacturing. The buildings exemplify the Third Front architectural style, featuring thick concrete structures, tall sawtooth skylight roofs, and weathered red brick walls that reflect functional pragmatism and heavy industrial aesthetics. Once a producer of heavy vehicles and specialized equipment, it contributed significantly to national defense and construction. Today, core historical workshops and facade features remain intact, making it a precious landmark documenting the legacy of heavy industry in the Yangjiaping area.", "name": "Tiema Group Old Factory Site", "transport": "Take CRT Line 2 to Yangjiaping Station, take Exit 2, and walk about 800 meters to reach the perimeter of the Tiema factory area."}, {"address": "Yangtze Riverfront, Jiulong Village, Jiulong Town, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 stars | First built in the late 1930s, Jiulongpo Dock was once one of the largest water-land intermodal transportation hubs on the upper Yangtze River and serves as a living fossil of Chongqing\u0027s modern maritime history. The port area preserves early administration offices, massive storage warehouses, stone staircases, and historic dock ruins along the riverbank. Constructed with sturdy stonework and concrete, these buildings showcase clean geometric lines and unpretentious transportation architectural styles. Telling the story of endless cargo flow along the golden Yangtze waterway, this site forms an iconic architectural cluster rich in heritage along the Huangjueping and Jiulongpo waterfronts.", "name": "Jiulongpo Old Dock \u0026 Port Historical Buildings", "transport": "Take Bus 244 or 441 to Jiulonggang Station and walk about 5 minutes to reach the riverside dock heritage area."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | Located within a prestigious art institution, this art museum is a central landmark for contemporary art and cultural vibe in Chongqing. It frequently exhibits avant-garde paintings, sculptures, and installation art by faculty, students, and renowned domestic and international artists. Combining historical weight with contemporary architectural design, it is a must-visit pilgrimage site for art enthusiasts looking to experience the Mountain City\u0027s artistic heritage.", "name": "Sichuan Fine Arts Institute Art Museum - Huangjueping Campus", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 5 minutes."}, {"address": "Inside Sichuan Fine Arts Institute Campus, No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | Housed in transformed military factory warehouses and featuring decommissioned tanks, this contemporary art center is one of the most distinctive and visually striking exhibition spaces in the Huangjueping Art Zone. Preserving a strong sense of industrial heritage, it seamlessly blends avant-garde contemporary exhibitions with hard-line industrial history, featuring multiple independent galleries and artist studios for a truly unique visual and cultural experience.", "name": "Tank Loft Contemporary Art Center", "transport": "Take Bus 223, 233, or 823 to Huangjueping Station, then walk into the Sichuan Fine Arts Institute campus."}, {"address": "No. 126 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 Stars | Originally a tobacco warehouse built in the 1950s, this site has been transformed into a vibrant cultural hub housing numerous artist studios, galleries, and independent design boutiques. The building retains its weathered concrete walls and high ceilings, exuding a distinct rustic and contemporary artistic flair. Visiting 501 Art Base allows tourists to see painters at work up close and find inspiration among unique artistic exhibitions.", "name": "501 Art Base", "transport": "Take Bus 223 or 823 to Huangjueping Main Street Station, then walk for about 3 minutes."}, {"address": "Fu No. 59 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 Stars | Located between Xiejiawan and Yangjiaping in Jiulongpo District, this unique cave museum cluster was built inside a network of air-raid shelters on the former site of Ordnance Industry Arsenal No. 1. Rare nationwide, it encompasses multiple themed museums\u2014including the War of Resistance Artifacts Museum, Weapons Development History Museum, and Chongqing Stories Museum\u2014displaying tens of thousands of precious historic relics alongside a distinctive air-raid shelter cultural setting.", "name": "Chongqing Jianchuan Museum Cluster", "transport": "Take CRT Line 2 to Xiejiawan Station, then transfer to Bus 413 or walk about 15 minutes."}, {"address": "No. 17 Zhigang Avenue, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | A private boutique museum dedicated to agarwood culture and the ancient art of incense ceremonies. It houses a vast collection of rare raw agarwood, exquisite ancient censers, and incense utensils, systematically showcasing thousands of years of Chinese incense history. Designed with a meditative Oriental Zen aesthetic, it offers peaceful incense tasting and guided cultural tours, making it a serene haven rich in cultural heritage in the Yangjiaping area.", "name": "Jiulong Agarwood Museum", "transport": "Take CRT Line 2 to Yangjiaping Station, then transfer to Bus 438 or 820 and get off at Zhigang Avenue Station."}, {"address": "Near the intersection of Yangjiaping Main Street and Qianjin Road, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 Stars | An important religious and cultural landmark as well as an architectural highlight in Jiulongpo District. The church blends Western Gothic style with modern architectural elements; its towering cross and solemn sanctuary stand out peacefully amid the surrounding bustling commercial district. Inside, vibrant stained glass windows glow brilliantly in the sunlight, attracting many believers and visitors seeking a moment of peace and sacred tranquility.", "name": "Yangjiaping Catholic Church", "transport": "Take CRT Line 2 or Line 18 to Yangjiaping Station, take Exit 2, and walk for about 5 minutes."}, {"address": "Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | Spanning approximately 1.25 kilometers, Huangjueping Graffiti Street is the world\u0027s largest open-air graffiti art gallery and street museum. Dozens of old building facades along both sides of the street were covered in vibrant paintings created by faculty, students of Sichuan Fine Arts Institute, and contemporary artists, transforming an ordinary residential neighborhood into a wall-less museum bursting with energy and visual impact.", "name": "Huangjueping Graffiti Art Street Open-air Museum", "transport": "Take CRT Line 18 to Huangjueping Station; the street is right outside the exit."}, {"address": "No. 128 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | Founded by a renowned artist, Himalaya Art Space is not only a humanities bookstore but also a museum-caliber venue for contemporary art and academic exchange in Huangjueping. It houses a vast collection of extremely rare art books, contemporary exhibition catalogs, and historical literature. The walls are adorned with gifted artwork and historical artifacts from artists, exuding a deep and genuine artistic memory of the Mountain City.", "name": "Himalaya Art Space \u0026 Bookstore", "transport": "Take Bus 223, 233, or 823 to Huangjueping Station, then walk for about 2 minutes."}], "name": "Arts \u0026 Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 17 Hegao Road, Yangjiaping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 Stars | Located in the heart of Jiulongpo District, Yangjiaping Park is a historic, lush urban park. Filled with towering trees, open leisure plazas, scenic corridors, and an artificial lake, it serves as a vital spot for locals to exercise in the morning, take strolls, and unwind. Flowers bloom throughout the seasons\u2014with peach and cherry blossoms competing in radiance during spring\u2014offering a rare urban oasis and tranquil corner right beside the bustling Yangjiaping Commercial Area.", "name": "Yangjiaping Park", "transport": "Take Chongqing Rail Transit Line 2 to Yangjiaping Station, then walk for about 8 minutes."}, {"address": "No. 1 Yangjiaping West Road, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | Adjacent to the Yangjiaping Commercial Area and built in 1955, Chongqing Zoo is a large comprehensive park integrating wildlife conservation, popular science education, and natural scenery. The park features beautiful natural surroundings with shade-providing trees and harmonious mountains and waters. Its biggest highlight is the Giant Panda Pavilion, famous for its high breeding success rate and adorable panda family. With teahouses, lake boating, and exhibits of rare wildlife, it\u0027s an ideal destination for family trips and connecting with nature.", "name": "Chongqing Zoo", "transport": "Take Chongqing Rail Transit Line 2 to Dongwuyuan (Zoo) Station; Exit 1 leads directly to the main entrance."}, {"address": "Yangtze Riverbank, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 Stars | Situated along the banks of the Yangtze River, Huangjueping Riverside Park seamlessly combines natural river views with the unique artistic vibe of Huangjueping. Built along the riverbank, it features open-view boardwalks and waterfront platforms. Visitors can gaze out at the Yangtze River Bridge and passing vessels, taking in the grand scenery of the flowing river. Dotted with creative graffiti art installations and sculptures, it is a fantastic spot to relax and capture stunning sunset views over the river.", "name": "Huangjueping Riverside Park", "transport": "Take Bus 223, 441, or 823 to Huangjueping Station, then walk towards the Yangtze River for about 10 minutes."}, {"address": "Intersection of Kecheng Road and Caiyun Lake Ring Road, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | Located just a few kilometers from Yangjiaping, Caiyun Lake National Wetland Park is the first national-level wetland park in Chongqing\u0027s urban core. Centered around a lake wetland ecosystem, it offers several kilometers of waterfront walkways and cycling trails around the lake. The park boasts rich, evergreen vegetation, stream wetlands, Peach Blossom Island, and a jellyfish viewing area. Attracting numerous bird species, it serves as a rare natural oxygen bar and ecological green lung within the city.", "name": "Caiyun Lake National Wetland Park", "transport": "Take the Chongqing Rail Transit Loop Line to Caiyunhu Station, then walk about 5 minutes to enter the park."}, {"address": "Next to Egongyan Bridge, Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.1 Stars | Situated right next to the Jiulongpo side of Egongyan Bridge, Egongyan Park is a hillside riverview park nestled between mountains and water. Featuring winding wooden trails, viewing pavilions, and abundant mountain flora, it offers one of the best vantage points to overlook the grand Yangtze River and the majestic Egongyan Bridge. At sunset, as golden light ripples across the water and bridge lights turn on, the scenery highlights the dramatic 3D cityscape of Chongqing.", "name": "Egongyan Park", "transport": "Take Chongqing Rail Transit Line 2 or Loop Line to Xiejiawan Station, then walk for about 12 minutes."}, {"address": "Near Tiema Group Factory Area, Yangjiaping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.0 Stars | Located near traditional residential neighborhoods by Yangjiaping, Tiema Park is a community natural park carrying Chongqing\u0027s industrial history and neighborhood greenery charm. Shaded by lush trees and blooming flora, it features simple leisure benches and fitness trails. The serene and relaxed atmosphere reflects the authentic everyday life and local natural beauty of old Chongqing, making it a great place for a peaceful stroll.", "name": "Tiema Park", "transport": "Take Bus 411 or 412 to Tiemachang Station, then walk for about 3 minutes."}, {"address": "Along Taohua Stream from Yangjiaping to Zhigang Avenue, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 Stars | Built along the Taohua Stream running through Jiulongpo District, Taohuaxi Greenway Park has been transformed through recent ecological restoration into a scenic riverside green corridor. Lined with leafy trees, jogging tracks, landscape art, and rest pavilions, the greenway features babbling stream waters and seasonal flora, offering local residents around Yangjiaping an ideal spot for outdoor exercise and relaxed waterfront living.", "name": "Taohuaxi Greenway Park", "transport": "Take Bus 268 or 419 to Zhigang Avenue Station, then walk to the stream greenway to enter."}, {"address": "Yangtze Riverbank, Tanzikou, Jiulongpo District, Chongqing", "feature": "\u2b50 4.0 Stars | Connecting the Yangjiaping and Huangjueping areas, Tanzikou Wetland Park is a green park that combines fluctuation zone ecological restoration with natural riverbank landscapes. The park preserves extensive wild vegetation and pebble beach landscapes. Seasonal fluctuations in the Yangtze River\u0027s water levels create a unique riverbank terrain, making it a hidden gem for photography enthusiasts aiming to capture natural river scenery and wild coastal flora.", "name": "Tanzikou Wetland Park", "transport": "Take Bus 223 or 233 to Tanzikou Station, then walk for about 8 minutes directly to the riverside park."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | One of the world\u0027s largest graffiti art districts, stretching approximately 1.25 km with building facades along the entire street covered in vibrant, colorful graffiti. Originally an old neighborhood, it was transformed by faculty and students of the Sichuan Fine Arts Institute into a contemporary street gallery bursting with youthful vitality and avant-garde art. Featuring everything from cartoon characters to realistic paintings and abstract art, it is a perfect spot for snapping photos and experiencing Chongqing\u0027s unique artistic pulse and street culture.", "name": "Huangjueping Graffiti Street", "transport": "Take Metro Line 18 to Huangjueping Station and walk; or take Bus 223, 233, or 823 to Huangjueping Station."}, {"address": "No. 104-5 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | Built in 1987, Jiaotong Teahouse is Chongqing\u0027s best-preserved historic teahouse, rich with authentic local atmosphere and vintage charm. Retaining its original weathered brick walls, wooden beams, and flagstone floors, stepping inside feels like traveling back in time decades ago. Not only a famous filming location for the movie \u0027Crazy Stone\u0027, it serves as a bustling hub where local artists, neighbors, and global travelers gather. For just a few RMB, order a covered bowl tea (gaiwan) and peacefully savor the ultimate slow life and local vibes.", "name": "Jiaotong Teahouse", "transport": "Take Metro Line 18 to Huangjueping Station and walk for about 5 minutes."}, {"address": "No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | As one of Southwest China\u0027s most iconic artistic sanctuaries, the Huangjueping Campus radiates a profound cultural atmosphere and rich history. Lush trees shade the crisscrossing pathways, which are lined with sculptures, installation art, and painted walls created by faculty and students. More than a cradle for top artists, its blend of vintage architecture and avant-garde creations crafts a one-of-a-kind campus charm that draws artistic souls and photography enthusiasts searching for inspiration and great photos.", "name": "Sichuan Fine Arts Institute Huangjueping Campus", "transport": "Take Metro Line 18 to Huangjueping Station and walk about 300 meters from the exit to reach the main gate."}, {"address": "3rd Floor, South Area, The MixC, No. 51 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Hailed as one of China\u0027s most beautiful bookstores, this Zhongshuge location draws design inspiration from Chongqing\u0027s iconic mountain terrain to create an awe-inspiring, sci-fi surreal space. Featuring mirrored ceilings and crisscrossing staircase bookshelves, it delivers optical illusions reminiscent of Penrose stairs and endless spatial depth. Stepping inside feels like entering a labyrinth straight out of \u0027Monument Valley\u0027 or \u0027Inception\u0027. Beyond its rich book collection and cozy reading areas, it is a visually stunning hit spot for photos.", "name": "Zhongshuge Bookstore at The MixC", "transport": "Take Metro Line 2 or Loop Line to Xiejiawan Station; an underground passage directly connects to The MixC shopping mall."}, {"address": "No. 126 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | A contemporary art cluster converted from an abandoned old warehouse, often called Chongqing\u0027s version of the \u0027798 Art District.\u0027 Originally a warehouse for Chongqing\u0027s First Tobacco Factory, the building retains its rugged industrial steel frames and red brick walls. Today, it houses independent artist studios, galleries, design workshops, and cozy cafes. Visitors can watch artists at work up close and experience the sparks between traditional industrial heritage and avant-garde art, making it a hotspot for creative vibes and retro-industrial photos.", "name": "501 Art Warehouse", "transport": "Take Metro Line 18 to Huangjueping Station and walk for about 6 minutes."}, {"address": "Yangjiaping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 stars | The commercial heart of Jiulongpo District, Yangjiaping Pedestrian Street is famous for its unique circular skywalk, lush greenery, and massive shopping malls. Standing tall at the center is \u0027Jiulong Gate,\u0027 a giant iconic art installation that fuses sleek modern steel lines with local cultural motifs. Lit up at night, it glows with a dazzling, futuristic energy. Packed with local eateries, trendy brands, and entertainment venues, it showcases the bustling vitality and modern style of urban Chongqing.", "name": "Yangjiaping Pedestrian Street \u0026 Jiulong Gate", "transport": "Take Metro Line 2 to Yangjiaping Station; the exit leads straight into the core pedestrian street."}, {"address": "Inside Sichuan Fine Arts Institute, No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Located inside the Huangjueping Campus of the Sichuan Fine Arts Institute, Tank Loft was originally a military logistics backup warehouse. Its signature feature is the real retired military tanks and armored vehicles parked in the courtyard, creating a striking contrast against postmodern art exhibitions. The center regularly hosts contemporary art shows, lectures, and cross-disciplinary cultural events, seamlessly blending heavy-duty military aesthetics with artistic finesse\u2014a must-visit spot for art lovers and military enthusiasts alike.", "name": "Tank Loft Contemporary Art Center", "transport": "Take Metro Line 18 to Huangjueping Station, enter the Sichuan Fine Arts Institute campus, and walk for about 5 minutes."}, {"address": "Inside the former Huangjueping Power Plant, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Featuring iconic 240-meter-tall twin chimneys from the former Chongqing Power Plant, this site once symbolized the Mountain City\u0027s golden industrial era. Through environmental transformation and the expansion of the graffiti district, these massive chimneys were refreshed with new colorful murals and light installations, morphing into visually striking landmarks on the Jiulong Peninsula. Blending old industrial heritage with modern art park layout, the illuminated chimneys glow like giant twin towers of light at night, attracting visitors and photographers eager to capture Chongqing\u0027s unique industrial cyber-aesthetic.", "name": "Huangjueping Power Plant Art Zone", "transport": "Take Metro Line 18 to Sichuan Fine Arts Institute Station or Huangjueping Station, then transfer to a bus or walk for about 12 minutes."}], "name": "Popular Photo Spots"}},
