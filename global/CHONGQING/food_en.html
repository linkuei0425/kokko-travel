 and walk about 850 meters."}, {"address": "No. 149-1 Zhongshan 3rd Road, Yuzhong District, Chongqing (near Liziba area)", "feature": "\u2b50 4.8 stars | Built inside an authentic historical air-raid shelter, this unique hotpot and local cuisine restaurant offers an unparalleled dining environment\u2014cool in summer and warm in winter with rustic rocky walls. The pure tallow hotpot broth is rich, savory, and grows more fragrant as it simmers. Crisp fresh tripe and well-marinated spicy beef paired with chilled drinks offer guests a genuine taste of Chongqing\u0027s famous \u0027Jianghu\u0027 (rustic river-lake) dishes and air-raid shelter dining culture.", "name": "Dongting Fresh Hotpot (Liziba Branch)", "transport": "Take Chongqing Rail Transit Line 1 or Line 2 to Lianglukou Station and walk about 8 minutes."}, {"address": "No. 118 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Perched halfway up Eling Hill, this traditional local eatery serves bold, rustic Chongqing \u0027Jianghu\u0027 dishes. Signature items include crispy and fiery \u0027Geleshan Spicy Chicken\u0027 and tender, numbingly fragrant \u0027Szechuan Poached Fish\u0027. With excellent window-side views overlooking the monorail passing through the building and the winding river, it\u0027s a great spot to experience Chongqing\u0027s vibrant personality and bold local flavors.", "name": "Chama Gudao - Lingshang Jianghu Cuisine", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit 2, and walk about 400 meters."}, {"address": "Building H, TESTBED2 Cultural Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | A highly popular vintage-style cafe \u0026 bistro decorated with lush greenery inside TESTBED2. Filled with antique furniture and tropical plants, it boasts a romantic and cozy ambiance. The menu offers exquisite light bites and house special local dishes incorporating local ingredients, such as pickled pepper baby squid and herb-roasted pork ribs. Delicious and rich in flavor, it is hugely popular among young travelers and creatives.", "name": "Lazy Fish Time Cafe \u0026 Bistro", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk about 12 minutes."}, {"address": "No. 102 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | A cozy eatery highlighting nostalgic old Chongqing home cooking and signature tea-infused rice (ochazuke style). Fragrant hot green tea broth poured over rice balances the rich, bold flavors of classic Sichuan dishes like stir-fried pork liver, authentic double-cooked pork belly, and fish with pickled greens. Refreshing and appetite-stimulating, it showcases a delightfully delicate side of local Chongqing cuisine.", "name": "Liziba Tea Rice \u0026 Traditional Bistro", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit A, and walk about 250 meters."}, {"address": "No. 43 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A long-standing local restaurant located right next to the Liziba viewing platform, renowned for authentic high-heat stir-fried \u0027Jianghu\u0027 dishes. Highlights include spicy wok-fried pig kidney\u2014tender and savory\u2014and hot and sour fish soup with tender, smooth fish fillets. Generous portions and masterful wok skills capture the bustling, vibrant soul and pure deliciousness of traditional Chongqing alleyway dining.", "name": "Xiyangyang Local Chongqing Cuisine", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit B, and walk about 150 meters."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Building H, TESTBED2 Cultural and Creative Park, No. 31 E\u0027ling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Located inside the TESTBED2 Cultural and Creative Park, this hipster-style vegetarian restaurant is famous for creative molecular plant-based cuisine and local organic ingredients from the Mountain City. Its signature \u0027Black Truffle Wild Mushroom Tofu Tart\u0027 features a crispy, fragrant crust with a dense, silky tofu filling infused with rich truffle aroma and mushroom juices, offering wonderfully complex layers of texture. Tourists love sitting on the outdoor balcony overlooking the Yangtze River while enjoying light, exquisite vegetarian food\u2014a top hipster choice after exploring TESTBED2.", "name": "TESTBED2 Ling Shang Vegetarian Kitchen", "transport": "CRT Line 1, E\u0027ling Station, Exit 1, approx. 10 mins walk"}, {"address": "Inside Fotuguan Park, Changjiang 1st Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Tucked away in a tranquil ancient temple inside Fotuguan Park, this traditional vegetarian dining hall boasts a long history and offers simple, Zen-inspired flavors. The must-try \u0027Handmade Three-Delicacy Vegetarian Dumplings\u0027 have thin, springy wrappers filled with freshly chopped shiitake mushrooms, wood ear, and alpine cabbage. Each bite bursts with sweet, savory juice and a crisp texture. Away from the hustle and bustle, it is highly favored by tourists seeking peace and local seniors enjoying traditional temple food culture.", "name": "Fotuguan Temple Vegetarian Dining Hall", "transport": "CRT Line 2, Fotuguan Station, approx. 15 mins walk along the park trail"}, {"address": "No. 138 E\u0027ling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A cozy vegetarian restaurant near E\u0027ling Park focusing on home-style, health-conscious plant-based dishes with low oil and salt. The \u0027Handcrafted Konjac Vegetarian Tripe\u0027 is highly recommended; made from natural konjac, it delivers a delightfully crisp and chewy texture. Paired with a special Chongqing spicy green peppercorn dipping sauce, it captures the signature Sichuan numbing-spicy aroma without straining digestion. Refreshing and light, it is praised by health-conscious travelers.", "name": "Shun Qi Zi Ran Vegetarian Restaurant", "transport": "CRT Line 1, E\u0027ling Station, Exit 2, approx. 5 mins walk"}, {"address": "No. 118 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | A river-view vegetarian restaurant located near the famous Liziba monorail-through-building attraction, offering stunning views of the Jialing River and premium omakase-style plant-based cuisine. The signature \u0027Stewed Bamboo Fungus with Red Dates and Lily Bulbs Soup\u0027 is clear, sweet, and comforting, with tender bamboo fungus absorbing every drop of flavorful broth. Many visitors love coming here to unwind, enjoy fine food, and take in the river scenery after snapping photos at Liziba.", "name": "Jingxin Vegetarian \u0026 Tea Space", "transport": "CRT Line 2, Liziba Station, Exit A, approx. 6 mins walk"}, {"address": "No. 176 E\u0027ling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Perched atop the E\u0027ling ridge, this exquisite tea house seamlessly blends Zen tea culture with refined vegetarian dining. The specialty \u0027Vegetarian Abalone in Golden Soup\u0027 uses monkey head mushrooms (lion\u0027s mane) prepared through multiple steps, achieving a bouncy, succulent texture soaked in a rich, golden soup made from pumpkin and carrots. It\u0027s velvety, flavorful, and delightfully chewy. Locals and tourists alike love sipping tea while enjoying the delicate vegetarian craftsmanship here.", "name": "Yi Ye Pu Ti Vegetarian \u0026 Tea House", "transport": "CRT Line 1, E\u0027ling Station, Exit 1, approx. 8 mins walk"}, {"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | A lush, greenery-surrounded vegetarian eatery near Liziba Anti-Japanese War Heritage Park, focusing on whole-food plant-based dishes and traditional handmade vegetarian noodles. Its \u0027Signature Spicy Vegetarian Noodle\u0027 uses 100% plant-based broth with thin, springy noodles topped with house-made vegetarian peanut chili oil and crispy soybeans. It recreates the fiery, aromatic soul of traditional Chongqing noodles while being lighter and guilt-free.", "name": "Lushe Cultural Vegetarian Restaurant", "transport": "CRT Line 2, Liziba Station, Exit B, approx. 4 mins walk"}, {"address": "No. 88 E\u0027ling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | A popular spot along the scenic walkway between E\u0027ling and Liziba, specializing in pure vegan and pungency-free (allium-free) dishes. The signature \u0027Crispy Vegetarian Ribs\u0027 are skillfully crafted from yam and lotus root, coated in a special batter and fried to a golden crunch. Crisp on the outside and tender inside, they carry a natural root-vegetable sweetness drizzled with a mouthwatering sweet and sour sauce\u2014a top recommendation for families and strict vegans.", "name": "Shuxiang Shijia Pure Vegan Restaurant", "transport": "CRT Line 1, E\u0027ling Station, Exit 2, approx. 7 mins walk"}, {"address": "No. 160 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Perched halfway up the hill at Liziba, this scenic vegetarian restaurant features an elegant and tranquil atmosphere. The \u0027Truffle \u0026 Wild Mushroom Fried Rice\u0027 is an absolute must-try; each distinct grain of rice is infused with smoky wok hei and thoroughly tossed with minced wild black truffles and rare mushrooms. Chewy, savory, and bursting with mushroom aroma, it is a top choice for tourists coming to enjoy gourmet food alongside night views of the Mountain City.", "name": "Juepin Lianhua Vegetarian", "transport": "CRT Line 2, Liziba Station, Exit A, approx. 8 mins walk uphill along the trail"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near No. 153 Eling Main Street / Zhongshan 4th Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | A legendary noodle shop near Eling Test Bed 2, loved by both locals and tourists. Their signature beef noodle soup features large, tender, flavor-infused chunks of beef, chewy springy noodles, and a numbingly spicy, savory broth enriched with rich beef tallow. Pair it with a bowl of refreshing brown sugar cold rice cake\u2014sweet, chewy, and rich\u2014to instantly soothe the spiciness. It\u0027s an absolute must-try street delicacy when visiting Eling Test Bed 2.", "name": "Pangmei Noodle House", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station or Line 1 to Eling Station, then walk for about 10 minutes."}, {"address": "Next to the exit of Liziba Monorail Station, Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | Located at the foot of the hill near Liziba Monorail Station, this traditional dessert stall is famous for its freshly hand-rolled mini glutinous rice balls (tangyuan). The rice balls are soft, chewy, and springy, served over finely shaved ice, rich traditional brown sugar syrup, and aromatic fermented sweet rice wine. Every bite offers a delightful contrast of textures and refreshing sweetness\u2014the perfect post-monorail-viewing treat to cool off and cleanse your palate.", "name": "Liziba Traditional Ice Tangyuan", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station and exit from Exit 1."}, {"address": "Inside Eling Test Bed 2 Cultural Park, No. 142 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 Stars | A popular street food stall tucked inside the Eling Test Bed 2 Cultural and Creative Park. Premium pork with an ideal fat-to-lean ratio is coated in a special Sichuan pepper batter and fried to order at high temperatures. The exterior is incredibly crunchy, while the meat inside remains juicy and tender, releasing a gentle tingly numbing pepper aroma on your palate. Savory, spicy, and addictively crisp, it\u0027s the ultimate snack to enjoy as you stroll through the park.", "name": "Eling Test Bed 2 Freshly Fried Crispy Pork", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, then walk for about 15 minutes."}, {"address": "No. 118 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 Stars | A time-honored shop with years of heritage, serving 100% handmade sweet potato noodles that are smooth, chewy, and delightfully springy. The soul of the dish lies in its secret-recipe Baoning vinegar and aromatic chili oil, topped with crispy roasted peanuts, soybeans, and pickled green beans. Tangy, zesty, and spicy, the comfortable sourness opens up your appetite, making it a beloved favorite among neighborhood locals and visiting foodies alike.", "name": "Eling Main Street Time-Honored Handmade Sour and Spicy Noodles", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 2, then walk for about 5 minutes."}, {"address": "Stall at the intersection of Liziba Main Street and Guihuajing Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 Stars | An iconic nostalgic Chongqing street snack named after the heavy iron press molds used to make it. Freshly baked on the spot, the outer crust is golden and crispy, while the inside is soft and cloud-like, filled with a rich egg flavor and the natural mild sweetness of fermented rice. Pleasantly sweet without being cloying, it offers rich layers of texture and stands as a classic bite of old Chongqing nostalgia.", "name": "Liziba Traditional Molded Rice Cake (Yundougao)", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, then walk for about 6 minutes."}, {"address": "Next to the Mid-Level Trail, Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | This little street stall specializes in authentic traditional Chongqing summer desserts. The cold rice cake (Lianggao) is silky-smooth like pudding and melts in your mouth, while the rice drop dessert (Liangxia), shaped like small shrimp, offers a tender chewiness with a delicate rice aroma. Drizzled with thick, traditionally simmered brown sugar syrup, it\u0027s refreshingly sweet and cooling\u2014the ultimate remedy after spicy Chongqing cuisine, highly popular among young locals and tourists.", "name": "Eling Old Street Handcrafted Lianggao \u0026 Liangxia", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, then walk along the Mid-Level Trail for about 8 minutes."}, {"address": "Stalls near Liziba Anti-Japanese War Heritage Park, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 Stars | A unique Chongqing BBQ street snack located near Liziba. Fresh pig brains are placed in foil tins and slow-roasted over heat with house-made fermented black beans, secret chili oil, chopped pickles, and Sichuan peppercorns. The texture is as silky and tender as soft tofu, melting in your mouth with zero gamey taste. Soaked in savory red oil, it is rich, spicy, and perfectly numbing\u2014a must-try late-night street delicacy for adventurous foodies.", "name": "Liziba Street Roasted Pork Brains", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit 2, then walk for about 7 minutes."}, {"address": "No. 176 Eling Main Street (Diagonally opposite the main entrance of Eling Park), Yuzhong District, Chongqing", "feature": "\u2b50 4.3 Stars | A popular grab-and-go street snack near Eling Park, featuring various cooked vegetables and meats skewered on bamboo sticks and steeped in a chilled sesame chili broth. The ingredients fully absorb the nutty flavor of toasted white sesame and the sharp, fiery numbness of spicy oil. Featuring crunchy tripe, springy wood ear mushrooms, and tender duck gizzards, holding a bundle to enjoy on the go is invigorating and delicious\u2014the ultimate snack companion while exploring the scenic views of Eling.", "name": "Eling Mountain City Cold Skewers (Leng Chuan Chuan)", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, then walk for about 3 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Eling and Liziba"}, "guanyinqiao_jiangbei": {"categories": {"cat_1": {"items": [{"address": "B1, Daxian Shopping Mall, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 Stars | A legendary noodle stall hidden in the Guanyinqiao underground shopping mall, this is a famous name in Chongqing\u0027s Xiaomian (spicy noodle) scene. Their signature Peas and Minced Pork Noodles (Wanza Mian) feature melt-in-your-mouth, velvety stewed peas combined with spicy, aromatic homemade red chili oil and springy noodles. Every bite is coated in rich sauce, leaving a mouthwatering aftertaste loved by both locals and foodies alike.", "name": "Dong Xiao Mian", "transport": "Take Metro Line 3 to Guanyinqiao Station and walk for about 3 minutes."}, {"address": "No. 418-6 Panxi Road, Jiangbei District, Chongqing (near Guanyinqiao Commercial Area)", "feature": "\u2b50 4.5 Stars | A classic late-night icon in Chongqing that popularized the local delicacy of roasted pig brains. Wrapped in foil and slow-roasted with secret pickled peppers, Sichuan peppercorns, and custom chili oil, the brains have a smooth, creamy texture like tofu with zero gamey taste. An explosion of sour, spicy, and savory flavors on your tongue, it is an unmissable midnight snack for experiencing Chongqing\u0027s nightlife.", "name": "Jiucun Roasted Brains", "transport": "Take Bus 127 to Panxi Market Station, or take a 10-minute taxi ride from Guanyinqiao Commercial Area."}, {"address": "No. 2 Chengbei Road, Jiangbei District, Chongqing (near Jiangbeizui Financial City)", "feature": "\u2b50 4.7 Stars | One of the birthplace restaurants of Chongqing\u0027s classic Sichuan dish, Boiled Fish in Chili Oil. It is renowned for being \u0027rich but not greasy, spicy but not drying, numbing but not bitter, and tender in texture.\u0027 Freshly sliced live fish arrives at your table in a bubbling pot of piping hot chili oil and peppercorns. The fish slices are silky smooth, infused with a complex aroma of green vine pepper and dried chilies that leaves an unforgettable impression.", "name": "Cuiyun Boiled Fish", "transport": "Take Metro Line 6 to Jiangbeizui Station and walk for about 8 minutes."}, {"address": "No. 8 Jianbei 1st Road, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 Stars | A flagship representative of Chongqing traditional hotpot designated as Intangible Cultural Heritage, famous for its authentic, rich pure beef tallow broth. Their signature Big-Blade Pork Kidney Slices are paper-thin, needing only a few seconds of swishing in the bubbling spicy broth. Paired with a special dry dipping powder, the meat is crisp, tender, and completely odorless, embodying the bold and generous spirit of local dining culture.", "name": "Zhoushixiong Hotpot", "transport": "Take Metro Line 3 or Line 9 to Guanyinqiao Station (Exit 5) and walk for about 4 minutes."}, {"address": "No. 68 Yanghe 1st Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 Stars | A renowned heritage restaurant serving traditional Sichuan cuisine, famous for pioneering classic dishes like Chongqing Spicy Chicken (Lazi Ji) and Taro Chicken. Their signature Taoran Spicy Chicken uses premium mountain-bred chicken, deep-fried until crispy outside and tender inside, stir-fried with heaps of regional red chilies and peppercorns. Digging through the fragrant mound of peppers to find savory, chewy chicken bits offers a delightful spicy finish, making it a top choice for experiencing a traditional Chongqing feast.", "name": "Taoranju Restaurant", "transport": "Take Metro Line 3 to Guanyinqiao Station and walk for about 10 minutes."}, {"address": "No. 139 Songshi Branch Road, Jiangbei District, Chongqing (near Guanyinqiao and Huahuiyuan Business Districts)", "feature": "\u2b50 4.5 Stars | A legendary rice noodle joint well-known to every local in Chongqing, famous for its massive portions and deeply rich broths. The crowd favorites, Pickled Pepper Beef and Pickled Pepper Pork Liver Rice Noodles, feature house-pickled spicy and tangy peppers cooked fresh in sizzling clay pots. The chewy, bouncy noodles soak up the intensely zesty broth, while the tender pork liver and flavorful beef deliver an incredibly satisfying meal.", "name": "Limi Xian Rice Noodles", "transport": "Take Metro Line 6 to Huahuiyuan Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 24 Huanglong Road, Huangnibang, Jiangbei District, Chongqing (near Guanyinqiao Commercial Area)", "feature": "\u2b50 4.6 Stars | A beloved neighborhood hotpot spot tucked away in an alleyway of Jiangbei District, highly praised by longtime locals. The broth base uses thick, traditional beef tallow that grows more fragrant as it simmers without being harshly spicy. The fresh duck intestines and fresh tripe are of top quality\u2014quick-dip them in the bubbling pot for a few seconds to achieve an irresistibly snappy, crunchy texture coated in rich beef oil, embodying the true essence of classic Chongqing hotpot.", "name": "Yuzong Old Hotpot", "transport": "Take Metro Line 6 to Huangnibang Station (Exit 3B) and walk for about 6 minutes."}, {"address": "Inside Guanyinqiao Food Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 Stars | Originating from Tongliang, Chongqing, this legendary street food chain took the city by storm by transforming simple potatoes into an extraordinary treat. Their signature Broth Crinkle-Cut Potatoes (\u0027Langya\u0027 Potatoes) and sliced potatoes are tossed expertly with a secret red chili sauce, Sichuan pepper powder, and scallions. Crispy outside and soft inside, or dense and flavorful, every bite bursts with bold numbing spice\u2014a favorite grab-and-go snack for youth and tourists alike.", "name": "Dingjiapo Potato", "transport": "Take Metro Line 3 to Guanyinqiao Station and walk for about 3 minutes to Guanyinqiao Food Street."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 93 Taping Main Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Located in the artistic Taping neighborhood, this is one of Chongqing\u0027s most iconic independent coffee shops. The cafe creatively blends local ingredients like Sichuan peppercorns and fermented sweet rice into its specialty drinks. The first sip delivers a subtle tingling numbing spice that transitions into rich, velvety milk notes\u2014an unexpectedly brilliant flavor profile. Their brunch platters feature freshly baked sourdough bread and signature sausages, crispy on the outside and soft inside, making it a favorite among hipsters and foodies alike.", "name": "TOTOMATO Coffee (Guanyinqiao Taping Branch)", "transport": "About an 8-minute walk from Exit 5 of Guanyinqiao Station on CRT Line 9"}, {"address": "No. 10 Taping Community, Jianbei Branch Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Tucked away in an alleyway of an old neighborhood, this minimalist cafe and bistro specializes in specialty Chongqing-inspired coffees and healthy brunches. The classic \u0027Sichuan Pepper Latte\u0027 offers a mildly numbing, aromatic touch, seamlessly blending the bittersweet espresso with fresh milk for a smooth, rounded finish. The brunch platter comes with freshly toasted sourdough, velvety scrambled eggs, and seared bacon\u2014generously portioned and top quality, making it a perfect spot for a slow-paced morning.", "name": "Awaken Mountain Coffee (Guanyinqiao Branch)", "transport": "About a 10-minute walk from Guanyinqiao Station on CRT Line 3"}, {"address": "No. 46 Beicheng Paradise Walk, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 stars | A hugely popular representative of Aussie-style brunch in Chongqing, famous for its authentic Australian coffees and vibrant dishes. The signature Eggs Benedict features a rich egg yolk that cascades over tender pulled pork and sourdough toast, paired with a tangy-sweet Hollandaise sauce for a velvety taste. Paired with a classic Flat White with silky microfoam, it offers pure happiness in every bite.", "name": "G\u0027day Brunch \u0026 Coffee (Guanyinqiao Branch)", "transport": "About a 5-minute walk from Exit 2 of Guanyinqiao Station on CRT Line 3"}, {"address": "No. 120 Taping Community, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | A cozy neighborhood cafe infused with a charming nostalgic retro vibe and warm hospitality. The pour-over coffee features carefully selected specialty beans, offering nuanced flavors and a long finish. The \u0027Fermented Sweet Rice Iced Americano\u0027 is highly recommended\u2014the natural sweetness of fermented rice intertwines with the fruity acidity of black coffee for a refreshing, palate-cleansing drink. Pair it with their homemade rich cheesecake, which melts in your mouth without being overly sweet.", "name": "Jingkou Coffee (Taping Branch)", "transport": "About a 7-minute walk from Exit 5 of Guanyinqiao Station on CRT Line 9"}, {"address": "Near Gate 2, Financial City, Jiangbeicheng West Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | An upscale cafe located in the heart of Jiangbeizui CBD, offering a serene relaxation spot for professionals and coffee enthusiasts alike. It features high-quality, house-roasted single-origin pour-overs with crisp floral, fruity, and nutty notes. Their brunch-time Avocado \u0026 Smoked Chicken Sandwich features golden, crispy toasted bread filled with fresh guacamole and tender chicken\u2014rich, juicy, and highly praised.", "name": "Weeds Coffee (Jiangbeizui Financial City Branch)", "transport": "About a 6-minute walk from Exit 3 of Jiangbeicheng Station on CRT Line 6"}, {"address": "Beibin 1st Road, next to Grand Theatre, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | A stunning scenic cafe boasting sweeping views of the Jialing River and Hongyadong across the water. The menu offers exquisite English and French brunches. The signature \u0027French Toast\u0027 is golden and crisp on the outside, soft and custard-like on the inside, drizzled with maple syrup and fresh blueberries for a luscious treat. Enjoying it with a rich cold brew while overlooking the river creates a marvelous feast for both eye and palate.", "name": "A Page Coffee (Jiangbeizui Grand Theatre Branch)", "transport": "About a 5-minute walk from Exit 2 of Grand Theatre Station on CRT Line 6"}, {"address": "Entrance to 9th Street, Beicheng Paradise Walk, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | A trendy local popular coffee brand wildly sought after by young adults. The shop serves creative fruit-infused specialty coffees, such as the \u0027Fresh Orange Specialty Americano\u0027, which blends freshly squeezed orange juice with espresso for a crisp, bittersweet, and fruit-forward flavor. Paired with freshly baked, buttery croissants that are flaky and crisp, it\u0027s the ultimate refueling stop while shopping in the district.", "name": "NEVER LATE COFFEE (Beicheng Paradise Walk Branch)", "transport": "About an 8-minute walk from Exit 2 of Liyuchi Station on CRT Line 10"}, {"address": "Ground Floor Shop, Tower A, Jiangbeizui Financial Center, Jincheng Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | A specialty coffee shop dedicated to ultimate flavor profiles, set in a contemporary, stylish space. Their signature \u0027Dirty Coffee\u0027 pairs chilled condensed fresh milk with dark roast coffee beans, creating a delightful contrast on the palate between cold, rich creaminess and warm, bittersweet espresso. Their handmade cinnamon rolls are crisp on the outside, soft on the inside, and filled with an elegant cinnamon aroma, making them popular with both office workers and tourists.", "name": "11 Degrees Coffee (Jiangbeizui CBD Branch)", "transport": "About a 4-minute walk from Exit 2 of Jiangbeicheng Station on CRT Line 6"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 42 Liyuchi Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Located in the trendy 9th Street (Jiujie), this bistro is famous for its creative \u0027Zhangzhongbao\u0027 chicken knee cartilage skewers. Coated in a special marinade and cooked in numbing-spicy red oil, the cartilage is delightfully springy with a crunchy bite. Pair it with cool, soothing iced jelly (Bingfen) to instantly tame the heat. With retro Hong Kong-style bistro decor, it is a great spot for tourists and young locals to enjoy nightlife and authentic Chongqing spicy flavors.", "name": "Jiujie Shufen Skewer Bistro", "transport": "CRT Line 10 Liyuchi Station, Exit 3, about a 5-minute walk"}, {"address": "No. 1 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 stars | An iconic restaurant representing traditional Chongqing Jianghu cuisine and Sichuan dishes, steeped in nostalgic Republic-era charm. The signature \u0027Yang\u0027s Overlord Rabbit\u0027 features exceptionally tender meat cooked with vibrant green peppercorns and fresh chilies, delivering a delightfully numbing and refreshing flavor profile. The \u0027Glory Duck\u0027 boasts crispy skin and juicy meat. With rich authentic seasonings and a ritualistic presentation, diners get to experience Chongqing\u0027s warm and vibrant food culture.", "name": "Yang Ji Long Fu Traditional Cuisine", "transport": "CRT Line 3 Guanyinqiao Station, Exit 2, about a 3-minute walk"}, {"address": "No. 28 Jianxin East Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | A unique local specialty that fuses slow-cooked Chinese herbal medicine with fiery Chongqing spice. Local free-range chicken is simmered with soft taro chunks, angelica root, and codonopsis. The chicken easily falls off the bone, boasting a tender texture and a delicate herbal fragrance. The soft, stewed taro absorbs the rich broth, melting in your mouth with flavor. Loved by locals and tourists alike for its delicious balance of heat and nourishing herbal sweetness.", "name": "Liziba Liangshan Chicken", "transport": "CRT Line 9 Guanyinqiao Station, Exit 5, about a 6-minute walk"}, {"address": "9th Street Gaojiao Building, No. 9 Yanghe East Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | A bistro filled with Chongqing\u0027s vibrant \u0027Jianghu\u0027 spirit, serving rustic yet incredibly flavorful local dishes. The iconic Spicy Chicken (La Zi Ji) challenges you to find crispy chicken bites amidst a mountain of red chilies, offering a crispy exterior, tender interior, and numbing heat in every bite. The Pickled Pepper Pork Liver is tender, tangy, and invigorating. The tavern also offers house-brewed fruit and rice wines that are sweet and smooth\u2014the perfect match for savory Jianghu cuisine.", "name": "Fan Jiang Hu Folk Bistro", "transport": "CRT Line 10 Liyuchi Station, Exit 2, about an 8-minute walk"}, {"address": "Opposite Soho Bar (North), 9th Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Combining an American-style bistro bar with a self-serve drink wall, this trendy spot is a favorite hangout for night owls and tourists. The menu features a signature Black Truffle Beef Burger made with a juicy patty and soft buns infused with rich truffle aroma, as well as Spicy Fried Chicken Wings with an extra crispy skin and tender meat. Paired with hundreds of craft beers from around the world, it is the ultimate choice to unwind and experience 9th Street\u0027s energetic nightlife.", "name": "COMMUNE Bistro \u0026 Bar", "transport": "CRT Line 10 Liyuchi Station, Exit 3, about a 7-minute walk"}, {"address": "Jianxin North Road 3rd Branch Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | A legendary hot pot spot preserving the soul of traditional Chongqing hot pot, famous for its rich beef tallow base and deep, spicy-numbing flavors. The signature fresh beef tripe is crisp and springy after swishing it briefly in the broth, absorbing the spicy red oil for an exhilarating taste. The handmade shrimp paste is bouncy, sweet, and succulent. Featuring classic wooden decor and a lively vibe, it is a must-visit for authentic hot pot lovers.", "name": "Linjiangmen Old Hotpot", "transport": "CRT Line 3 Guanyinqiao Station, Exit 3, about a 4-minute walk"}, {"address": "No. 132 Taping, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | A famous classic local eatery in Chongqing known for its comforting pig trotter soup slow-simmered for hours. The trotters are cooked until soft and gelatinous, rich in collagen, while the milky-white broth is flavorfully smooth without being greasy. Dipped into the signature spicy dipping sauce, the dish transforms into an incredible combination of savory, spicy, and tangy flavors that leave diners thoroughly warmed and satisfied.", "name": "Hu Ji Pig Trotters Soup", "transport": "CRT Line 10 Liyuchi Station, Exit 1, about a 6-minute walk"}, {"address": "No. 3 Chengxin 1st Road, Jiangbeizui, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | An elegant scenic bistro nestled in the Jiangbeizui financial district along the Jialing River, offering breathtaking night views of the city skyline. The signature \u0027Truffle Abalone Braised Chicken\u0027 combines rich black truffle, tender abalone, and juicy chicken in a velvety sauce. The \u0027Jiangbei Specialty Grilled Fish\u0027 features crispy skin and tender, spicy-aromatic meat. With its sophisticated courtyard setting and crafted cocktails, it is a top pick for business dinners and romantic evenings.", "name": "Jiangbeizui No. 3 Courtyard", "transport": "CRT Line 6 Jiangbeizui Station, Exit 3, about a 5-minute walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "4F, Zone B, Paradise Walk, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Located in the bustling Guanyinqiao commercial area, this refined Zen-inspired vegetarian restaurant is famous for infusing the spicy, numbing, and aromatic flavors of Sichuan cuisine into healthy plant-based dishes. The signature \u0027Black Truffle Wild Mushroom Casserole\u0027 is tender, juicy, and rich with mushroom aroma. Another highlight, the \u0027Imperial Mock Roast Duck\u0027, features golden, crispy bean curd skin wrapped with sweet bean sauce and scallion shreds, offering rich layers of texture that rival real roast duck. Quiet and elegant, it is highly favored by health-conscious locals and tourists looking for innovative vegetarian Sichuan dishes.", "name": "Puti Su Vegetarian Restaurant", "transport": "Take Metro Line 3 to Guanyinqiao Station (Exit 5) and walk for about 5 minutes."}, {"address": "6F, IMIX Park, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | A pioneer in healthy vegetarian hotpot with a Tibetan tea soup base, offering a light alternative to traditional oily and spicy hotpots. The broth is fragrant with a sweet finish, featuring subtle tea notes and comforting Chinese herbal warmth. Special handcrafted mock meat balls are springy and chewy, while the wild mushroom platter absorbs the tea broth to become silky and sweet. Visitors shopping in Guanyinqiao love enjoying this guilt-free hotpot experience.", "name": "One Leaf One World Tibetan Tea Vegetarian Hotpot", "transport": "Take Metro Line 3 to Guanyinqiao Station (Exit 3) and walk for about 3 minutes."}, {"address": "3F, Podium Building, Financial City Tower 3, Jiangbeizui, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 stars | Situated in the Jiangbeizui Financial District, this top-tier vegetarian club combines modern elegance with Chinese Zen aesthetics. It specializes in fine-dining omakase-style set menus that highlight fresh seasonal ingredients. The popular \u0027Bamboo Fungus Golden Soup\u0027 is smooth, soothing, and perfectly balanced with a mild sour and spicy kick; the \u0027Handcrafted Shiitake \u0026 Lion\u0027s Mane Mushroom Steak\u0027 served with special black pepper sauce is thick, juicy, and immensely satisfying. It is immensely popular among business professionals and vegetarian gourmets.", "name": "Jingxinlian Zen Vegetarian Restaurant", "transport": "Take Metro Line 6 to Jiangbeicheng Station (Exit 3) and walk for about 6 minutes."}, {"address": "8F, New Century Department Store, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Specializing in great-value vegetarian buffets and delicate side dishes, offering dozens of menu items. The signature dish, \u0027Vegetarian Boiled Fish\u0027, utilizes konjac and soy products to replicate soft, tender fish textures, paired with rich, aromatic Sichuan spicy red oil\u2014spicy yet not overly harsh. Bright and comfortable, it is a top spot for office workers and tourists in the Guanyinqiao business district looking to boost their vegetable intake.", "name": "Juepin Refined Vegetarian Cuisine", "transport": "Take Metro Line 3 to Guanyinqiao Station (Exit 1) and walk for about 4 minutes."}, {"address": "No. 27 Jianxin East Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | An affordable, well-established local vegetarian buffet offering daily stir-fries, pastries, and freshly cooked noodle soups. Highly recommended is the \u0027Vegetarian Xiaomian\u0027 (Chongqing Noodles)\u2014chewy noodles tossed in a fragrant, spicy sauce topped with crispy soybeans, perfectly capturing the soul of local street food with zero meat. Reasonable prices and authentic flavors keep this spot packed with locals and budget diners.", "name": "Sanyi Vegetarian Buffet", "transport": "Take Metro Line 9 to Guanyinqiao Station (Exit 6) and walk for about 5 minutes."}, {"address": "2F, East Zone, 9th Street, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Tucked away in 9th Street, Guanyinqiao, this creative vegetarian spot seamlessly fuses Western herb cuisine with Chinese cooking techniques. The popular snack \u0027Herb-Roasted Organic Mushrooms\u0027 is juicy with fresh herbal notes of rosemary and thyme, while the \u0027Thai Spicy and Sour Mock Seafood Pot\u0027 is tangy, refreshing, and chewy (made from konjac). Stylishly presented with unique flavors, it is very popular among young adults and female diners.", "name": "Suxin Herbs Vegetarian Restaurant", "transport": "Take Metro Line 10 to Liyuchi Station (Exit 2) and walk for about 8 minutes."}, {"address": "Level 3, IFS (International Finance Center), Jiangbeizui, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | An elegant vegetarian teahouse located in Jiangbeizui IFS, combining high-altitude river views with delicate vegetarian dim sum. The \u0027Truffle \u0026 Mushroom Steamed Dumplings\u0027 are a standout, featuring translucent skins filled with rich black truffle aroma and mushroom juices. Paired with freshly brewed high-mountain Oolong tea, it perfectly refreshes the palate. An exquisite spot for taking in Chongqing\u0027s nighttime river views while enjoying a sophisticated vegetarian afternoon tea.", "name": "Qingxin Vegetarian \u0026 Tea House", "transport": "Take Metro Line 6 to Jiangbeicheng Station (Exit 2), which directly connects to the IFS Mall."}, {"address": "3F, Building A, Longfor Starry Street, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | A concept restaurant specializing in Southeast Asian flavors and modern plant-based cuisine, right along the Jialing River. The must-try \u0027Green Curry Vegetable \u0026 Fruit Pot\u0027 is rich and fragrant with sweet layers of lemongrass and coconut milk, paired beautifully with aromatic purple rice. The \u0027Crispy Fried Taro Rolls\u0027 are extra crunchy on the outside with a smooth, sweet filling. Offering stunning riverside views, it\u0027s a top pick for tourists seeking trendy vegetarian cuisine with a scenic dinner setting.", "name": "Green Leaf Boat Vegetarian Concept", "transport": "Take Metro Line 3 to Huaxinjie Station (Exit 1), then transfer to a bus or walk for about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Food Street, B1, Daxian Shopping Mall, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Dingjiapo Potato is an iconic local street food in Chongqing and the reigning king of Guanyinqiao Food Street. The potatoes here come in sliced, cubed, or mashed varieties. The crowd-favorite wavy-cut \u0027wolf-tooth\u0027 potatoes are fried to perfection\u2014crispy on the outside and soft on the inside. Tossed with signature chili oil, Sichuan pepper powder, cumin, and pickled mustard bits, they offer a rich, numbing, spicy, and savory flavor profile that captivates both local youth and tourists.", "name": "\u4e01\u5bb6\u5761\u6d0b\u828b (Dingjiapo Potato - Guanyinqiao Branch)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 5, approx. 300m walk"}, {"address": "Zone A, Guanyinqiao Food Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Egg-wrapped potato is an innovative traditional snack that has swept Chongqing\u0027s markets and night markets in recent years. Made fresh to order at this cozy stall, golden aromatic eggs are pan-fried until slightly charred, wrapping smooth, velvety mashed potatoes mixed with pickled cowpeas, crunchy diced radish, and a special spicy sauce. One bite reveals tender, fragrant egg crepe and melt-in-your-mouth potatoes, with tangy, spicy toppings balancing any richness. A truly unique delicacy!", "name": "\u96bb\u89d2\u8001\u91cd\u6176\u86cb\u5305\u6d0b\u828b (Zhijiao Egg Wrapped Potato)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 4, approx. 250m walk"}, {"address": "Inside Food Street, No. 15 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Grilled sweet potato sheet (Shao Pi) is an iconic late-night soul food unique to Chongqing. Thick sheets made from sweet potato starch are grilled over charcoal until puffed and blistered, yielding a wonderfully soft yet chewy texture. Wrapped inside are cilantro, scallions, pickled mustard, and pickled cowpeas, generously brushed with secret spicy chili sauce. Chewy, aromatic, and exploding with smoky, spicy flavors, it\u0027s an essential grab-and-go bite in Guanyinqiao.", "name": "\u8001\u5b57\u865f\u70e4\u82d5\u76ae\u8c46\u5e72 (Traditional Grilled Sweet Potato Sheet \u0026 Dried Tofu)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 3, approx. 200m walk"}, {"address": "Entrance of Zone B, Guanyinqiao Food Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Amidst the fiery spicy flavors of Guanyinqiao, Fat Mother Ice Tangyuan serves as every foodie\u0027s ultimate palate saver. This traditional dessert features freshly boiled, wonderfully chewy glutinous rice balls bathed in crushed ice and rich, hand-crafted brown sugar syrup. Garnished with fermented sweet rice, hawthorn slices, raisins, and sesame seeds, it is cool, refreshing, and pleasantly sweet. The hot rice balls contract in the ice to get extra chewy\u2014a massive hit among travelers!", "name": "\u80d6\u5b50\u5abd\u8001\u91cd\u6176\u51b0\u6e6f\u5713 (Fat Mother Ice Tangyuan)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 5, approx. 220m walk"}, {"address": "No. 34 Jianbei Branch Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 stars | Jiucun Grilled Pig Brain is a legendary establishment famed across Chongqing\u0027s night market and street barbecue scene. Fresh pig brain is placed in a custom foil box and slow-grilled over charcoal with broth, chili oil, Sichuan pepper, minced garlic, and pickled peppers. The brain has a silky, velvety texture like fine tofu that melts instantly in your mouth. Devoid of any gamey odor, it bursts with rich garlic and spicy aromas\u2014so irresistible that even hesitant tourists fall in love at first bite!", "name": "\u4e5d\u6751\u70e4\u8166\u82b1 (Jiucun Grilled Pig Brain)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 2, approx. 500m walk"}, {"address": "Next to Century New World, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Haoyoulai Sour and Spicy Noodles is one of Chongqing\u0027s most classic street snacks. Handmade sweet potato noodles are slippery, chewy, and satisfying, soaked in a broth of balanced sour and spicy notes. Topped with savory minced pork sauce, Baoning vinegar, fragrant chili oil, crispy roasted peanuts, and fresh cilantro, each bite is appetizingly tart and delightfully spicy. Holding a paper bowl and enjoying it while strolling down Guanyinqiao Pedestrian Street is the ultimate way to experience local Chongqing street food culture.", "name": "\u597d\u53c8\u4f86\u9178\u8fa3\u7c89 (Haoyoulai Sour and Spicy Noodles)", "transport": "CRT Line 3 Guanyinqiao Station, Exit 1, approx. 180m walk"}, {"address": "Inside Beicang Cultural and Creative Park, No. 55 Taping, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Located in the hip Beicang Cultural and Creative Quarter near Guanyinqiao, this artisanal food stall is famous for its freshly baked, handmade sticky rice cakes. This nostalgic treat boasts a golden, crispy outer crust while maintaining a mochi-like, chewy, and soft interior filled with rich egg and milky aromas. Perfectly sweet and non-sticky to the teeth, it\u0027s served warm and fragrant\u2014a beloved snack among youngsters exploring the creative market.", "name": "\u5317\u5009\u624b\u4f5c\u7cef\u7c73\u86cb\u7cd5 (Beicang Craft Sticky Rice Cake)", "transport": "CRT Line 10 Liyuchi Station, Exit 2A, approx. 600m walk"}, {"address": "Outer Plaza of Chongqing IFS, No. 38 Jiangbeicheng North Avenue, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | A featured baked flatbread stall at the outer market of IFS in the Jiangbeizui Financial District. Leavened dough is filled with finely chopped preserved mustard greens and pork belly, then slapped onto the inside walls of a high-temperature barrel oven. The baked flatbread comes out paper-thin and delightfully crunchy with every bite. The savory-sweet filling radiates a smoky roasted vegetable aroma mixed with rich pork juices. Convenient and flavorful, it is a hugely popular street bite for local office workers and riverfront tourists alike.", "name": "\u6c5f\u5317\u5634\u570b\u91d1\u5e02\u96c6\u73fe\u70e4\u6885\u5e72\u83dc\u6263\u8089\u9905 (Jiangbeizui IFS Market Dried Vegetable Pork Flatbread)", "transport": "CRT Line 6 Jiangbeicheng Station, Exit 3, approx. 150m walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Guanyinqiao and Jiangbeizui"}, "jiefangbei_hongyadong": {"categories": {"cat_1": {"items": [{"address": "No. 9 Sishi Lane, Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Peijie Old Hot Pot is an iconic representative of authentic Chongqing nine-grid hot pot, insanely popular among both tourists and locals. The soup base is simmered with premium beef tallow and aromatic Sichuan peppercorns, delivering the ultimate numbingly spicy and savory flavor profile. The signature tribute vegetable meatball is springy and crisp to the bite, while the fresh tripe and duck intestines soak up the spicy broth, yielding a texture that is crunchy, tender, and pleasantly spicy without being overly dry. The lingering numbing sensation on your tongue makes this the top choice to experience Chongqing\u0027s hot pot culture.", "name": "Peijie Old Hot Pot (Jiefangbei Branch)", "transport": "Take Metro Line 2 to Linjiangmen Station, then walk for about 5 minutes."}, {"address": "No. 9 Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Renowned as one of Chongqing\u0027s top 5 noodle shops, Huashi Wanza Noodles is a legendary traditional establishment in the Jiefangbei commercial area. The noodles are cooked to chewy perfection, generously topped with soft, creamy stewed yellow peas and rich, savory-spicy minced meat sauce (zajiang). Mix thoroughly before eating: the rich, buttery pea texture wraps around the chewy noodles, creating a savory, numbing, spicy, and perfectly layered flavor that keeps you coming back for more.", "name": "Huashi Wanza Noodles (Jiaochangkou Branch)", "transport": "Take Metro Line 1 or Line 2 to Jiaochangkou Station, Exit 11, then walk for about 3 minutes."}, {"address": "No. 42 Qingnian Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Qiu Er Guan is a centuries-old heritage brand in Chongqing, famous far and wide for its nourishing stewed chicken soup. A comforting departure from Chongqing\u0027s dominant spicy and numbing flavors, the chicken soup here uses premium stewing hens slow-simmered for hours with traditional Chinese herbs. The golden broth is clear, sweet, and rich without being greasy, with chicken meat so tender it falls off the bone. A must-try classic for anyone seeking a gentle, comforting taste amid Chongqing\u0027s fiery culinary scene.", "name": "Qiu Er Guan Restaurant (Qingnian Road Branch)", "transport": "Take Metro Line 2 to Linjiangmen Station, then walk for about 4 minutes."}, {"address": "No. 26 Minquan Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A landmark brand for traditional Chongqing wontons (chaoshou), famous across the mountain city for its three customizable levels of numbing spice (mild, medium, extreme). Plump, thin-skinned wontons roll in a fiery chili oil broth; biting into them reveals juicy, tender meat, followed immediately by an intense, multi-layered Sichuan peppercorn buzz on your lips and tongue. Exhilarating and addicting, it is an essential stop for lovers of extreme spice.", "name": "Lao Ma Chao Shou (Jiefangbei Main Branch)", "transport": "Take Metro Line 1 to Jiaochangkou Station, then walk for about 5 minutes."}, {"address": "Near the intersection of Bayi Road and Zhonghua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | A legendary staple in Chongqing\u0027s late-night BBQ scene, Jiucun Roasted Pig Brain takes local passion for pig brain to the absolute next level. Fresh pig brain is placed in a foil tray and charcoal-roasted with a special chili paste, Sichuan peppercorns, pickled peppers, and crushed fermented black beans. It boasts a silky, rich texture akin to soft cheese with zero gamey odor, replaced instead by intense savory spicy and numbing notes\u2014a dream delicacy for experiencing local Jianghu late-night street food culture.", "name": "Jiucun Roasted Pig Brain (Jiefangbei Branch)", "transport": "Take Metro Line 2 to Linjiangmen Station, then walk for about 6 minutes."}, {"address": "Bayi Road Food Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Hu Ji Pig Trotter Soup is an immensely popular traditional nourishing snack near Jiefangbei. Pig trotters are slow-cooked with white kidney beans until the broth turns milky white. Packed with collagen, the pig trotter skin is springy and the meat tender enough to melt in your mouth without feeling heavy. Dip the meat into Chongqing\u0027s signature spicy and numbing dipping sauce\u2014the contrast between the velvety broth and spicy tender meat is pure satisfaction.", "name": "Hu Ji Pig Trotter Soup (Bayi Road Branch)", "transport": "Take Metro Line 1 to Jiaochangkou Station, then walk for about 4 minutes."}, {"address": "Bayi Road Food Street, No. 158 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Located on Bayi Road Food Street, Pang Zi Ma Salted Duck is a decades-old braised delicacy brand in Chongqing. Its salted duck features white skin, tender meat, and a perfectly balanced salty flavor infused with subtle spices and natural duck sweetness, all with lean fat that never feels greasy. In addition, their signature braised duck gizzards and duck webs are firm and pleasantly crunchy\u2014a hugely popular local classic for street snacking or taking home as edible souvenirs.", "name": "Pang Zi Ma Salted Duck (Bayi Road Branch)", "transport": "Take Metro Line 2 to Linjiangmen Station, then walk for about 3 minutes."}, {"address": "No. 227 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Lu Gao Jian is a renowned heritage shop for braised and seasoned meats in Chongqing, holding savory memories for generations of locals. Using carefully selected cuts, their spiced beef and braised pork ribs are simmered in a secret master brine, resulting in tender, flavor-packed meat with a rich, savory-sweet profile and a deep aromatic finish. Whether enjoyed as a snack paired with drinks or alongside local noodles, it offers a deeply satisfying taste of old Chongqing.", "name": "Lu Gao Jian Braised Meat (Jiaochangkou Branch)", "transport": "Take Metro Line 1 to Jiaochangkou Station, then walk for about 3 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Beside the Cliff Walkway, No. 2 Daijia Lane, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 Stars | Perched on the cliff\u0027s edge of Daijia Lane, this cafe boasts breathtaking views overlooking the Jialing River and Qianshimen Bridge. The interior is filled with retro wooden tones and green lush plants, creating a cozy and relaxing vibe. The signature specialty drink \u0027Chongqing Foggy City Latte\u0027 blends rich espresso with subtly sweet osmanthus syrup, giving it a smooth, velvety texture with a delicate floral aroma. Pair it with their freshly baked Basque Cheesecake\u2014crispy charred skin on the outside, with a rich, silky, half-baked center. Tourists love enjoying a lazy afternoon here taking aesthetic shots of river views and coffee, while local youth often visit to escape the hustle and bustle.", "name": "Lazy Fish Wooden Balcony Cafe", "transport": "CRT Line 2 Linjiangmen Station Exit 2, about an 8-minute walk"}, {"address": "No. 28 Daijia Lane, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | A stylish, hipster cafe hidden in Daijia Lane near the Jiefangbei commercial district. Its minimalist industrial decor blends seamlessly with old Chongqing brick walls to create a unique aesthetic. The hand-poured single-origin filter coffees are highly praised by coffee lovers, especially the light-roasted Ethiopian beans with bright notes of citrus sweetness and white flowers, delivering a crisp, refreshing finish. A popular brunch choice is the \u0027Avocado Sourdough Toast with Poached Egg\u0027\u2014crispy on the outside, soft inside, with a golden egg yolk flowing like a waterfall when cut open, offering rich layers of texture. Ideal for both resting tourists and remote-working local creatives.", "name": "Yusheng Coffee", "transport": "CRT Line 2 Linjiangmen Station Exit 2, about a 6-minute walk"}, {"address": "1F, Starlight Plaza, No. 99 Wuyi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | A highly popular trendy cafe in the Jiefangbei area, famous for its creative specialty drinks and modern decor. The signature \u0027Iced Tomato Americano\u0027 perfectly combines fresh tomato juice with medium-dark espresso; the sweet and tangy fruity aroma balances coffee bitterness, resulting in an unforgettable, crisp, and surprising taste. Pair it with the \u0027Black Pepper Beef Croissant Sandwich\u0027 for brunch\u2014layered, flaky, highly aromatic, and filled with tender, juicy black pepper beef. Its designer-forward space draws countless influencers and young tourists to snap photos, showcasing Chongqing\u0027s vibrant young coffee culture.", "name": "TOTOMATO Coffee", "transport": "CRT Line 1 or Line 6 Xiaoshizi Station Exit 5, about a 5-minute walk"}, {"address": "Next to International Business Center, No. 178 Zhonghua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 Stars | An established independent coffee shop rooted in Chongqing for years, its Jiefangbei location retains a nostalgic alley atmosphere and warm hospitality. They roast their own beans in-house for exceptional quality. The \u0027Oat Milk Latte\u0027 boasts a silky texture, blending cereal sweetness seamlessly with deep espresso for a lasting finish, while the \u0027Flat White\u0027 features rich, velvety microfoam with bold nutty notes. For brunch, the \u0027Classic American Breakfast\u0027 is highly recommended\u2014packed with sausage, bacon, scrambled eggs, and toasted sourdough, offering a hearty and delicious meal. Revered by local baristas and travelers seeking authentic coffee flavors.", "name": "Crow Coffee", "transport": "CRT Line 1 Jiaochangkou Station Exit 9, about a 4-minute walk"}, {"address": "No. 76 Cangbai Road, Yuzhong District, Chongqing (Near the top level of Hongyadong)", "feature": "\u2b50 4.6 Stars | Perched high on a cliff right next to the Hongyadong scenic area, this cafe offers an unobstructed panoramic view of the Jialing River at night and the mystical glowing lights of Hongyadong. The signature drink \u0027Cliff Fireworks\u0027 uses cold brew coffee as a base, combined with sparkling water and custom grapefruit syrup for a refreshing, fizzy, and fruity drink that quenches any thirst. For brunch, try the \u0027Vanilla French Toast\u0027\u2014eggy bread fried to golden perfection, drizzled with maple syrup and topped with freshly chopped berries, yielding a crispy exterior and cloud-like soft interior. Its unmatched location makes it a secret sanctuary for visitors to take in Chongqing\u0027s magical mountain city nightscape.", "name": "Wild Cliff Cafe", "transport": "CRT Line 6 Xiaoshizi Station Exit 9, about a 7-minute walk"}, {"address": "2F, No. 177 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 Stars | A retro-themed experience cafe styled after the Republic of China era, decorated with vintage record players, old-style desk lamps, and brass furniture, making you feel like you\u0027ve traveled back in time to old Chongqing. The \u0027Old Chongqing Covered Bowl Coffee\u0027 (Gaiwan Coffee) is a must-try\u2014blending rich espresso with sweet floral notes, served in traditional ceramic Gaiwan tea sets for a unique and fun drinking experience. It tastes bold, smooth, and carries a roasted aroma. The brunch special \u0027Sichuan Cured Pork Eggs Benedict\u0027 creatively pairs local smoked bacon with English muffins, where savory, slightly spicy meat flavors meet velvety hollandaise sauce in an exquisite culinary fusion, drawing many culturally curious tourists.", "name": "1941 Memory Chongqing Coffee", "transport": "CRT Line 2 Linjiangmen Station Exit D, about a 3-minute walk"}, {"address": "No. 283 Minsheng Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | A highly rated cozy and fresh brunch cafe located near the Jiefangbei Pedestrian Street, featuring wooden furnishings and lush greenery for a relaxing environment. The signature brunch dish \u0027Shakshuka\u0027 simmers fresh tomatoes, spices, and poached eggs, served with crispy garlic bread for dipping\u2014rich, tangy, savory, and appetite-pleasing with a kick of spice. The \u0027Sea Salt Caramel Latte\u0027 features exquisite latte art with a sweet-and-salty foam layer that adds remarkable depth to the coffee. With fast service and consistently great quality, it\u0027s the top breakfast pick for tourists seeking energy before exploring the mountain city.", "name": "Shiguang \u0026 You Brunch \u0026 Coffee", "transport": "CRT Line 1 Jiaochangkou Station Exit 1, about a 5-minute walk"}, {"address": "No. 100 Mianhua Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 Stars | A cozy independent coffee shop tucked away in a quiet corner near Hongyadong, focusing on fine hand-poured pour-over coffee and homemade baked desserts. The popular \u0027Cold Drip Black Coffee\u0027 is cold-extracted over 12 hours, resulting in a clean, bright palate with ripe fruity and vinous notes reminiscent of red wine. Pair it with the freshly made \u0027Tiramisu Brunch Waffle\u0027\u2014crispy baked waffle stuffed with mascarpone cheese and Marsala wine aroma, wonderfully moist, rich, yet perfectly balanced in sweetness. The friendly hospitality and exquisite quality provide travelers wandering between Jiefangbei and Hongyadong with a delightful, cozy rest stop.", "name": "Corner Coffee", "transport": "CRT Line 1 Xiaoshizi Station Exit 8, about a 6-minute walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 32-7 Linjiang Branch Road, Yuzhong District, Chongqing (Near Jiefangbei Pedestrian Street)", "feature": "\u2b50 4.7 stars | As a classic representative of Chongqing urban cuisine, this restaurant perfectly blends Republican-era vintage style with authentic Jianghu flavor. The signature \u0027Yang\u0027s Overlord Rabbit\u0027 is crispy on the outside, tender inside, numbingly spicy, and visually striking with its abundance of green peppercorns and dried chilis. The \u0027Republican Braised Pork\u0027 is rich without being greasy and melts in your mouth. Antique wooden decor and palace lantern setups make diners feel as though they\u0027ve traveled back in time to old Chongqing while savoring delicious local dishes, making it highly praised by both locals and tourists.", "name": "Yang Ji Long Fu - Jiefangbei Flagship (\u694a\u8a18\u9686\u5e9c \u89e3\u653e\u7891\u7e3d\u5e97)", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit 2), then walk for about 3 minutes."}, {"address": "No. 1 Chunyang Dong, Yuzhong District, Chongqing (Near Qixinggang and Jiefangbei Commercial Area)", "feature": "\u2b50 4.6 stars | A decades-old folk tavern carrying the vibrant, down-to-earth everyday spirit of old Chongqing. Their house-made \u0027Peach Blossom Wine\u0027, \u0027Green Plum Wine\u0027, and \u0027Purple Sweet Potato Wine\u0027 are sweet, smooth, and bursting with fruity aromas. Paired with signature dishes like \u0027Fresh Pepper Rabbit\u0027, \u0027Straw Mushroom Eel\u0027, and \u0027Mashed Garlic Pork Slices\u0027, the spiciness is satisfyingly bold and complex. With budget-friendly prices and an authentic tavern atmosphere, it\u0027s a fantastic spot to experience Chongqing\u0027s nightlife and tipsy culture.", "name": "Chun Yang Tavern (\u7d14\u967d\u8001\u9152\u9928)", "transport": "Take CRT Line 1 to Qixinggang Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 191 Changjiang Riverside Road, Yuzhong District, Chongqing (Near Huguang Guild Hall and Hongyadong)", "feature": "\u2b50 4.5 stars | Located along the Yangtze River, this Ming and Qing dynasty inn-style Jianghu restaurant is filled with bamboo chairs, wooden tables, and martial arts (wuxia) elements. The signature \u0027Chongqing Spicy Chicken\u0027 features golden, crispy chicken bites buried in a sea of red chilis\u2014numbingly spicy and addictive. The \u0027Steamed Pork with Rice Flour in Bamboo Basket\u0027 is soft, savory, rich, and flavorful. Their house-brewed Chinese rice wine is sweet and soothing against spiciness, capturing Chongqing\u0027s hearty tradition of feasting heartily and drinking generously.", "name": "Fan Jiang Hu - Hongyadong (\u98ef\u6c5f\u6e56 \u6d2a\u5d16\u6d1e\u5e97)", "transport": "Take CRT Line 6 to Xiaoshizi Station (Exit 8), then walk for about 8 minutes."}, {"address": "2nd Floor, Yudu Mansion, No. 168 Bayi Road, Yuzhong District, Chongqing (Jiefangbei Bayi Road Food Street)", "feature": "\u2b50 4.4 stars | A historic Sichuan restaurant dating back to the Republican era, famous for its extraordinarily flavorful stewed chicken soup. Unlike Chongqing\u0027s mainstream heavy-oil and heavy-spice dishes, Qiu Er Guan excels in nourishing broths and refined home-style cooking. The signature \u0027Chicken Broth Potstickers\u0027 are crisp on the bottom and fragrant inside, while the \u0027Gold Medal Stewed Chicken Soup\u0027 boasts a rich, sweet broth with tender meat that falls off the bone. It\u0027s an exceptional place to soothe your stomach after spicy feasts and experience the essence of traditional Chongqing cuisine.", "name": "Qiu Er Guan Restaurant (\u4e18\u4e8c\u9928\u50b3\u7d71\u83dc)", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station (Exit 9), then walk for about 4 minutes."}, {"address": "4th Floor, Metropolitan Oriental Plaza, No. 68 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | A specialty restaurant seamlessly blending a modern, stylish bistro vibe with traditional Chongqing home-style cooking. The signature \u0027Shunfeng Spicy Fish\u0027 uses fresh live fish with tender, silky slices in a rich, aromatic spicy broth. The \u0027Green Pepper Shredded Potatoes\u0027 and \u0027Hot and Sour Mashed Potatoes\u0027 offer delightful innovative twists. Bright and sophisticated, the dining environment serves select fruit wines and cocktails, making it ideal for tourists seeking a refined dining ambiance and family gatherings.", "name": "Shunfeng 123 Restaurant - Zourong Road (\u9806\u98a8123 \u5927\u6703\u5802/\u9112\u5bb9\u8def\u5e97)", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit D), then walk for about 2 minutes."}, {"address": "No. 56 Cangbai Road, Yuzhong District, Chongqing (High-rise scenic building next to Hongyadong Area)", "feature": "\u2b50 4.6 stars | A high-rise river-view bistro adjacent to Hongyadong, perfectly combining authentic Chongqing stir-fried Jianghu dishes with a modern cocktail bar. The signature \u0027Stir-fried Spicy Pork Kidneys\u0027 are tender, crisp, and fresh, while the \u0027Spicy Crab\u0027 features plump, sweet crab meat. Sitting on the outdoor terrace at night, sipping specialty Chinese cocktails and fruit wines while overlooking Hongyadong\u0027s dazzling night view and the Jialing River, provides complete satisfaction for both eyes and palate.", "name": "Zui Jin Chao Jianghu Bistro (\u9189\u4eca\u671d\u6c5f\u6e56\u83dc\u9910\u9152\u9928)", "transport": "Take CRT Line 6 to Xiaoshizi Station (Exit 9), then walk for about 5 minutes."}, {"address": "No. 15 Zhonghua Lane, Bayi Road, Yuzhong District, Chongqing (Inside Jiefangbei Commercial Area)", "feature": "\u2b50 4.3 stars | A unique bistro packed with an immersive martial arts (Wuxia) atmosphere, where guests are addressed as \u0027Heroes\u0027 and waiters as \u0027Inn Keepers\u0027. Menu items are inspired by martial arts novels\u2014the signature \u0027Dali Wan\u0027 (Power Meatball) features sticky rice meatballs stuffed with salted egg yolk, savory and delicious. Items like \u0027Dali Shuishou\u0027 and house-brewed \u0027Yun\u00fc Xinjing Wine\u0027 offer distinct flavors. Humorous dialogue and engaging role-play interactions make dining here filled with fun and laughter.", "name": "Feng Bo Zhuang Martial Arts Bistro (\u98a8\u6ce2\u838a\u6c5f\u6e56\u83dc)", "transport": "Take CRT Line 1 to Jiaochangkou Station (Exit 24), then walk for about 3 minutes."}, {"address": "Near Xinhua International, No. 27 Minquan Road, Yuzhong District, Chongqing (Core Jiefangbei Area)", "feature": "\u2b50 4.5 stars | A late-night refined bistro highlighting an ancient Chinese aesthetic, decorated with dark-toned traditional accents and subtle bamboo shadows. The signature \u0027Dry Pot Pork Intestines\u0027 are crisped to perfection and deeply spicy, while the \u0027Pickled Cabbage Pork Slivers\u0027 offer tender meat in a refreshingly tangy broth. Served in charming ceramic bottles, their house-brewed fruit wines have a balanced alcohol content and rich fruit aromas, making this a popular haunt in Jiefangbei for late-night drinks and local Chongqing flavors.", "name": "Da Gui Gu Tavern (\u5927\u9b3c\u8c37\u8001\u9152\u9928)", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station (Exit 10), then walk for about 4 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Luohan Temple, No. 7 Luohan Temple Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 Stars | Located inside the ancient Luohan Temple, this vegetarian restaurant is an excellent spot to unlock Chongqing\u0027s traditional Zen-inspired vegetarian cuisine. The signature vegetarian noodles and vegetarian hot and sour glass noodles are smooth and delicate, served in a clean, non-greasy broth that perfectly recreates the authentic spicy flavors of local snacks while retaining a crisp, vegetarian lightness. Tourists and local devotees alike love enjoying a hot bowl of vegetarian noodles here after worshiping, soaking in a rare moment of peace and heavenly flavor amidst the bustling city.", "name": "Luohan Temple Vegetarian Restaurant", "transport": "Take CRT Line 1 or Line 6 to Xiaoshizi Station (Exit 6), approx. 2 mins walk"}, {"address": "4F, Metropolitan Oriental Plaza, No. 108 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 Stars | Featuring a unique health-conscious Tibetan tea broth, this vegetarian hotpot shatters the stereotype that Chongqing hotpot must be fiery spicy beef tallow broth. The warm, rich tea broth cooks a variety of fresh wild mushrooms and handcrafted tofu, delivering a sweet, velvety texture bursting with mushroom aroma and rich layers. The restaurant exudes a serene Zen ambiance, making it a favorite among health-conscious young tourists and female foodies\u2014a top choice for experiencing hotpot culture while preferring lighter vegetarian fare.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hotpot", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit B), approx. 5 mins walk"}, {"address": "Eslite Center, No. 166 Minzu Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | A high-end vegetarian restaurant located in the prime Jiefangbei commercial district, offering dozens of exquisite plant-based dishes. Highly recommended are the handcrafted vegetarian skewers and plant-based Sichuan dishes, which feature a chewy, firm texture tossed with custom savory spicy powder\u2014spicy, refreshing, and guilt-free. Blending traditional Sichuan flavors with modern vegetarian concepts, it is praised by both tourists and nearby office workers.", "name": "Juepin Vegetarian Restaurant", "transport": "Take CRT Line 1 to Xiaoshizi Station (Exit 5), approx. 3 mins walk"}, {"address": "Near Jiefangbei Pedestrian Street, No. 268 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 Stars | Known for exquisite private-kitchen vegetarian dishes, this spot flawlessly showcases Sichuan cuisine\u0027s hallmark of \u0027each dish having its own unique style and flavor profile.\u0027 The signature dish \u0027Vegetarian Spicy Boiled Fish\u0027 uses monkey head mushrooms and custom soy products, yielding a tender, springy texture that bursts with spicy red oil broth\u2014easily rivaling real fish. Its elegant, peaceful dining environment and remarkably realistic food textures draw countless plant-based food lovers.", "name": "Puti Su Vegetarian Restaurant", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit A), approx. 4 mins walk"}, {"address": "Near No. 46 Cangbai Road (Close to the top floor of Hongyadong), Yuzhong District, Chongqing", "feature": "\u2b50 4.3 Stars | A venue combining tea art with pure vegan cuisine, located near the Hongyadong scenic area. The menu features delicate vegetarian set meals and freshly pressed pan-fried dumplings. The dumplings have a golden, crispy skin filled with a golden ratio of mushrooms, cabbage, and glass noodles, offering a juicy and sweet bite. Many tourists enjoy stopping by after taking in Hongyadong\u0027s night view to sip good tea, sample fine vegetarian snacks, and unwind.", "name": "Shun Qi Zi Ran Vegetarian \u0026 Tea House", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit B), approx. 7 mins walk"}, {"address": "No. 14 Datong Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 Stars | This affordable vegetarian buffet restaurant is a hugely popular spot in the Jiefangbei area. Dishes are plentiful and constantly replenished, ranging from freshly fried vegetarian spring rolls (crispy outside, soft inside, packed with fresh veggie aroma) to classic vegetarian Mapo Tofu, offering authentic, flavorful local Chongqing kick. Thanks to its fresh ingredients and great value, it is highly recommended by locals and budget travelers alike.", "name": "Hongyuan Vegetarian Restaurant", "transport": "Take CRT Line 1 to Xiaoshizi Station (Exit 4), approx. 3 mins walk"}, {"address": "Near Jiefangbei, No. 222 Xinhua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 Stars | An exquisite restaurant offering fusion plant-based cuisine alongside classic Sichuan vegetarian dishes. The \u0027Vegetarian Kung Pao Chicken\u0027 is highly recommended; made with king oyster mushrooms specially deep-fried to achieve a crisp exterior and tender, springy interior, tossed in a sweet, tangy, and mildly spicy sauce with crunchy peanuts to awaken your appetite. With its elegant ambiance and meals providing both visual and culinary impact, it is a top-rated vegetarian destination in the Jiefangbei commercial area.", "name": "Jingxinlian Vegetarian Restaurant", "transport": "Take CRT Line 1 to Jiaochangkou Station (Exit 1), approx. 6 mins walk"}, {"address": "No. 177 Bayi Road (Inside Bayi Road Food Street), Yuzhong District, Chongqing", "feature": "\u2b50 4.3 Stars | A specialty vegetarian street food stall near the Bayi Road Food Street, specializing in vegan Chongqing snacks. Signature items like \u0027Vegan Bingfen\u0027 (ice jelly) and \u0027Vegetarian Red Oil Wontons\u0027 are widely acclaimed. The wontons feature thin wrappers stuffed generously with fresh mushroom and veggie filling, drenched in special spicy red oil that gives off a delightful aroma and a smooth, flavorful bite. It\u0027s a popular go-to snack for visitors shopping nearby to grab and refuel on the go.", "name": "Suxiangyuan Vegetarian Snacks", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit D), approx. 3 mins walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 181 Bayi Road, Yuzhong District, Chongqing (Bayi Road Food Street)", "feature": "\u2b50 4.5 stars | Hot and sour rice noodles are Chongqing\u0027s most iconic street food snack, and Haoyoulai is a legendary stall on Jiefangbei Bayi Road Food Street. The signature hot and sour noodles use pure sweet potato noodles, cooked fresh to be silky, chewy, and elastic. Drizzled with secret aromatic vinegar, chili oil, a generous spoonful of spicy minced pork sauce, and topped with crunchy peanuts and cilantro. A single bite offers a burst of sour, spicy, and numbing flavors that make walking and eating an absolute delight. It attracts long queues of tourists and local foodies alike in every season.", "name": "Haoyoulai Hot and Sour Rice Noodles (Bayi Road Main Store)", "transport": "Take Metro Line 2 to Linjiangmen Station (Exit 2), then walk for about 3 minutes."}, {"address": "4F Snack Street, Hongyadong Folk Custom Area, No. 88 Jialingjiang Binjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | A wild street food icon of Chongqing night markets. Soft and chewy sweet potato starch sheets (Shao Pi) are grilled over charcoal until puffed and bubbling, brushed with special mala sauce and chopped green onions, and wrapped around pickled long beans, diced dried radish, or even beef sausages. The skin is crispy and chewy, while the filling is savory, sour, and spicy with rich layered textures. It\u0027s a piping hot street snack everyone holds while taking in the night view of Hongyadong.", "name": "Hongyadong Grilled Sweet Potato Starch Sheet \u0026 Tofu Skewers", "transport": "Take Metro Line 1 or 6 to Xiaoshizi Station (Exit 9), then walk about 8 minutes to the 4th floor of Hongyadong."}, {"address": "Snack Area inside Hongyadong Scenic Area, Cangbai Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A hugely popular street snack known for chicken feet so tender that the meat separates from the bone with just a light suck. Braised in a secret broth for hours and lightly deep-fried, the skin develops an appetizing tiger-skin texture before being dusted with spicy Chongqing chili powder or drizzled with garlic sauce. Rich in collagen, melt-in-your-mouth tender, and addictively spicy, it is a hugely popular walk-and-eat snack among young tourists.", "name": "Jianglong Dim Sum Chicken Feet (Hongyadong Branch)", "transport": "Take Metro Line 2 to Linjiangmen Station, then walk about 10 minutes to the Cangbai Road entrance of Hongyadong."}, {"address": "No. 85 Minsheng Road, Yuzhong District, Chongqing (Near Flower Market Park)", "feature": "\u2b50 4.6 stars | A renowned local establishment featured in the Top 50 Chongqing Xiao Mian list, famous for its yellow pea and minced pork sauce noodles (Wanza Noodles). Soft, melt-in-your-mouth yellow peas are mixed with rich savory pork sauce and served over chewy alkaline noodles, coating every strand when tossed. Rich, creamy, and flavorful without being overwhelmingly hot, foodies gladly squat on tiny plastic stools outside the store just to enjoy a bowl\u2014embodying the most authentic street dining culture of Chongqing.", "name": "Huashi Wanwan Noodles", "transport": "Take Metro Line 1 to Jiaochangkou Station (Exit 2), then walk for about 5 minutes."}, {"address": "Underground Food Court, Bayi Road Food Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | A highly distinctive, traditional old-school breakfast and street food in Chongqing. It features a base of thick, smooth rice paste cooked from rice flour, topped with golden crispy fried noodle strands (\"Sanzi\"), sesame oil, Sichuan pepper oil, chili oil, chopped preserved mustard tubers, and green onions. Stirred well before eating, the comforting smoothness of the paste contrasts brilliantly with the crispiness of the fried noodles. Rich in aromatic numbing spice, it\u0027s a must-try classic snack to taste old Chongqing.", "name": "Traditional Chongqing Youcha", "transport": "Take Metro Line 2 to Linjiangmen Station (Exit 2), then walk about 2 minutes to enter Bayi Road Food Street."}, {"address": "B1 Floor, PARK108 Cathay Plaza, No. 108 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | The ultimate palate cleanser and spice antidote after indulging in spicy street food! Authentic handmade ice powder is hand-rubbed from nicandra seeds, resulting in a crystal-clear, smooth texture with tiny micro-bubbles that melt instantly in your mouth with a cool refreshing feel. Drizzled with rich traditional brown sugar syrup and topped with rose jam, hawthorn flakes, sweet fermented rice wine, crushed peanuts, and raisins. Sweet yet refreshing and delightfully floral, it is an unmissable artisanal dessert when exploring the Jiefangbei shopping district.", "name": "Chongqing Rose Handmade Ice Powder", "transport": "Take Metro Line 2 to Linjiangmen Station (Exit B), which connects directly to Cathay Plaza Shopping Center."}, {"address": "Phase 2 Food Street, Bayi Plaza, No. 177 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | The ultimate bold delicacy of Chongqing night market culture. Fresh pig brains are placed in a foil tray, topped with generous red chili oil, Sichuan pepper, pickled peppers, minced garlic, and fermented black beans, then slow-grilled over charcoal. The finished dish has a creamy, delicate texture similar to fine foie gras or silken tofu that melts in your mouth\u2014spicy, savory, and completely free of gaminess, winning over many adventurous tourists who were initially hesitant to try.", "name": "Jiucun Grilled Pig Brains", "transport": "Take Metro Line 1 or 2 to Jiaochangkou Station (Exit 9), then walk for abo
