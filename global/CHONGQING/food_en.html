        const db = {"ciqikou_shapingba": {"categories": {"cat_1": {"items": [{"address": "No. 145 Zheng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Ciqikou\u0027s most renowned century-old traditional snack brand in Chongqing. Fresh out of the fryer, these fried dough twists (Mahua) emit a rich aroma of wheat and salt-and-pepper. Biting into one yields an intensely satisfying crunch that melts in your mouth, perfectly balancing savory and sweet without feeling greasy. Adhering to traditional hand-kneading and multi-stage fermentation, their original, salt \u0026 pepper, and spicy flavors are wildly popular among both locals and international tourists, drawing long lines all year round.", "name": "Chen Jianping Chen Mahua", "transport": "Take CRT Line 1 to Ciqikou Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 102 Zheng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | One of the birthplaces of Ciqikou Chicken Offal and a classic local eatery with decades of history. In a sizzling, bright-red iron pot, chicken gizzards, hearts, and intestines are stir-fried with high-altitude pickled peppers, aged ginger, and Sichuan peppercorns. The intestines are crisp and snappy, while the gizzards are tender and springy. The sour, spicy, and savory broth infuses every ingredient, making it an absolute \u0027rice killer\u0027. Foodies flock here specifically to experience this quintessential dish full of Chongqing\u0027s rustic charm.", "name": "Maozhuang Ciqikou Chicken Offal", "transport": "Take CRT Line 1 to Ciqikou Station and walk along the main street of the ancient town for about 6 minutes."}, {"address": "No. 15 Heng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 Stars | A famous traditional Ciqikou shop known for its live noodle-making performance. Using high-quality sweet potato starch, the noodles are handmade on the spot, yielding unbelievable stretch, chewiness, and a delightfully springy texture. The soul of the dish lies in its golden ratio of savory broth, aged vinegar, fragrant chili oil, and seasoned minced pork. Zesty, mouth-watering, and packed with a punchy numbness and spice that never feels harsh, it attracts countless tourists for a culinary pilgrimage.", "name": "Zhang Laohan Handmade Hot and Sour Noodles", "transport": "Take CRT Line 1 to Ciqikou Station, enter Heng Street in the ancient town, and walk for about 7 minutes."}, {"address": "Next to Gele Mountain National Forest Park (Sanbaiti, Geleshan Town), Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | The original founding restaurant of the famous dish \u0027Gele Mountain Spicy Chicken\u0027, located next to Gele Mountain National Forest Park. Tender bite-sized chicken pieces are deep-fried until crispy on the outside and juicy inside, then stir-fried over high heat with mountain-like piles of dried chilies and Hanyuan peppercorns. Hunting for crispy chicken chunks amidst a sea of red peppers is a classic culinary joy here. Fragrant, crispy, juicy, and packed with deep, lingering numbness and spice, this is considered the ultimate holy grail for Chongqing food lovers.", "name": "Linzhongle Gele Mountain Spicy Chicken", "transport": "Take CRT Line 1 to Lieshimu Station, transfer to Bus 210 to Geleshan Station, then take a shuttle or taxi directly to the restaurant."}, {"address": "Next to the Underground Shopping Mall Exit, No. 290 Xiaolongkan Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | A legendary Shapingba shop ranked among Chongqing\u0027s Top 50 Xiaomian Noodle Joints, serving traditional flavors passed down for decades. Their signature Pea and Pork Ragu Noodles (Wanza Mian) features yellow peas simmered to a creamy mash, paired with rich, fragrant minced pork and homemade red chili oil. When tossed thoroughly, every strand of noodle is coated in thick sauce, offering a harmonious contrast of smooth and chewy textures with explosive savory and spicy aromas\u2014a true soul breakfast for generations of locals and students.", "name": "Dong Xiaomian", "transport": "Take CRT Line 1 to Xiaolongkan Station (Exit 4), then walk for about 2 minutes."}, {"address": "No. 50 Tianxingqiao Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | A long-standing local noodle joint in Shapingba beloved by neighborhood regulars and university students. Famous for its Beef Noodles and Pork Intestine Noodles; the beef is cut into thick chunks, slow-cooked until melt-in-your-mouth tender while retaining its meaty texture. The pork intestines are meticulously cleaned, rich, savory, and pleasantly chewy. Paired with a rich homemade bone broth and fiery red oil, every bowl showcases the bold yet refined essence of traditional Chongqing noodles.", "name": "Qinyun Noodle House", "transport": "Take CRT Line 9 to Tianxingqiao Station (Exit 2), then walk for about 5 minutes."}, {"address": "No. 6 Huangjueping Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 Stars | An established tofu pudding shop in Ciqikou preserving the purest traditional techniques. Soybeans are freshly stone-ground by hand every morning. The resulting soft tofu (Douhua) has an unbelievably silky, delicate texture with a natural sweetness and soy aroma. Served with its signature dipping sauce\u2014a mix of cooked chili oil, scallions, mustard tuber bits, and sesame oil\u2014pairing this tender tofu with steamed rice creates a smooth, spicy, and savory comfort meal reflecting authentic home-style Chongqing flavor.", "name": "Ciqikou Old Stone Mill Douhua", "transport": "Take CRT Line 1 to Ciqikou Station, turn into Huangjueping Lane from the main street, and walk for about 9 minutes."}, {"address": "No. 78 Zheng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | A representative venue for the famous Chongqing dish \u0027Maoxiewang\u0027 in Ciqikou. Fresh duck blood curds, tripe, pork aorta, luncheon meat, and bean sprouts are served in a boiling hot, numbing, and spicy broth. The blood curd is silky-smooth and melts in your mouth, while the tripe and aorta deliver a satisfying crunch. Crowned with premium peppercorns and sizzled chili oil, this bowl unleashes a fiery, rich aroma that perfectly embodies the passionate and multi-layered nature of Chongqing\u0027s iconic cuisine.", "name": "Yumama Maoxiewang", "transport": "Take CRT Line 1 to Ciqikou Station and walk along the main street of the ancient town for about 5 minutes."}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Upper Floor of Old House, No. 168 Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.7 Stars | Located in a distinctive historic house within Ciqikou Ancient Town, featuring a prime wooden balcony seating area overlooking the Jialing River and the ancient town\u0027s cobblestone streets. The cafe specializes in exquisite pour-over coffee and freshly baked souffle pancakes that are cloud-like, smooth, and melt in your mouth. Paired with a rich signature latte, it attracts countless tourists and hipsters, making it a top choice in the ancient town to unwind and enjoy a leisurely afternoon.", "name": "Lazy Fish Balcony Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 15 Ciqikou Back Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Tucked away in a quiet alley on Ciqikou Back Street, the entire store exudes a rich blend of Japanese Zen and Chinese vintage aesthetics. It offers a variety of single-origin specialty coffee beans and handmade light brunch items. Highlights include the signature Citrus Americano and freshly made smoked chicken croissant sandwich, which features a crispy crust and rich fillings with distinct layers of flavor. Local youth love coming here to enjoy a tranquil atmosphere away from the hustle and bustle.", "name": "Floating Life Hand Drip Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station, then walk about 10 minutes to the Back Street area."}, {"address": "No. 88 Xiaolongkan New Street, Three Gorges Square, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Located around the bustling Three Gorges Square commercial area in Shapingba, focusing on American and Australian all-day brunch. The classic Eggs Benedict is served with fresh sliced avocado and smoked salmon, featuring runny poached egg yolks coated in rich Hollandaise sauce for an exceptionally smooth texture. Paired with a rich Flat White, it is a popular spot for nearby college students and office workers to start their day with energy.", "name": "Gorge Corner Brunch \u0026 Coffee", "transport": "Take Chongqing Rail Transit Line 1 or Line 9 to Shapingba Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 174 Shazheng Street (Next to Zone A of Chongqing University), Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | Located near the Shapingba Campus of Chongqing University, filled with a strong academic and youthful atmosphere. The space is spacious and bright, offering a wide selection of books to read. Popular menu items include freshly grilled cheese pressed toast and traditional handmade brown sugar latte\u2014the toast is gooey, rich, crispy on the outside, and soft on the inside. Highly favored by university students and book lovers, it is a fantastic place for reading, working, and enjoying brunch together.", "name": "CQU Campus Time Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Shapingba Station, then transfer to Bus 215 and get off at Chongqing University Station."}, {"address": "No. 12 Ciqikou Binjiang Road, Shapingba District, Chongqing", "feature": "\u2b50 4.8 Stars | Situated next to the riverside walkway of Ciqikou, offering unbeatable panoramic views of the Jialing River. It offers exquisite English afternoon tea sets and cold brew specialty coffees. The signature slightly tipsy Osmanthus Latte features subtle floral and milky notes that are smooth and not overly sweet. Tourists love sitting on the outdoor terrace at sunset, enjoying delicious pancakes while admiring the evening glow over the riverbanks.", "name": "Maple \u0026 Fishing Light Riverside Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Shijingpo Station or Ciqikou Station, then walk for about 12 minutes along the riverside walkway."}, {"address": "No. 20 Zhuangzhi Road, Geleshan Mountain, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Located near the foot of Geleshan Mountain and the foothills of Shapingba, surrounded by lush green plants and flowers, feeling like an urban oasis. It features a healthy and rejuvenating brunch platter complete with freshly pan-fried German sausages, whole wheat toast, and fresh seasonal salad. Paired with their signature hand-drip Yirgacheffe coffee, it offers a refreshing sweet-and-sour taste with a lingering finish, making it hugely popular among health-conscious guests and photo enthusiasts.", "name": "Wizard of Oz Garden Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Lieshimu Station, then transfer to Bus 210 and get off at Zhuangzhi Road Station."}, {"address": "No. 28 Ciqikou Heng Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | A concept space combining postcard culture, stationery, and specialty coffee, located inside the Ciqikou Cultural Park. It serves handmade Matcha Lattes and French Caramel Macchiatos, paired with daily freshly baked double cheesecake that is rich, creamy, and pleasantly sweet. Guests can write a postcard to the future here while immersing themselves in the fragrance of books and coffee.", "name": "Cats Sky Concept Book Cafe", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station (Exit 2), then walk for about 6 minutes."}, {"address": "No. 8 Jinrong Lane, Ciqikou, Shapingba District, Chongqing", "feature": "\u2b50 4.7 Stars | Renovated from a traditional mountain-city old building on stone steps (\u0027Tikan\u0027), perfectly showcasing Chongqing\u0027s local 3D magical spatial charm. The signature Caramel Pudding Latte paired with a freshly made Beef Baguette Sandwich is a must-try combo\u2014the beef is tender and juicy, while the baguette is crispy outside and chewy inside. Its unique open-air seating on the steps lets visitors experience the rhythm of mountain city life firsthand, receiving highly positive reviews.", "name": "Tikan Old Street Coffee", "transport": "Take Chongqing Rail Transit Line 1 to Ciqikou Station, then walk about 7 minutes to Jinrong Lane."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 74 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | A time-honored Jianghu cuisine eatery located on Ciqikou Main Street, renowned for serving the most authentic Chongqing chicken offal. A bubbling hot pot packed with savory, spicy chicken liver, intestines, and gizzards, combined with plenty of celery and pickled peppers. Tangy, zesty, tender, crisp, and with zero gamey odor. The rich, fiery broth goes amazingly well with rice, making it a beloved favorite among locals and tourists alike, and an unmissable staple in Ciqikou.", "name": "Maozhuang Guzhen Chicken Offal", "transport": "CRT Line 1 Ciqikou Station, Exit 1, about an 8-minute walk"}, {"address": "No. 16 Heng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | A specialty restaurant blending Republic-of-China nostalgic vibes with traditional Chongqing Jianghu cuisine, featuring antique, culturally rich decor. Signature dishes like \u0027Overlord Rabbit\u0027 and \u0027Honor Duck\u0027 are intensely spicy, flavorful, tender, and juicy, with Sichuan peppercorns and dried chilis delivering rich layers of numbingly spicy flavors. The restaurant also serves house-brewed peach blossom and green plum wines\u2014sweet, tart, and refreshing\u2014which are immensely popular among visitors.", "name": "Yangji Longfu (Ciqikou Branch)", "transport": "CRT Line 1 Ciqikou Station, Exit 2, about a 6-minute walk"}, {"address": "No. 156 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | As Ciqikou is the birthplace of Chongqing\u0027s famous Maoxiewang (spicy duck blood stew), Duoxiangju stands out as a highly reputed vintage local diner. The aromatic red oil broth is intensely spicy and numbing, filled to the brim with melt-in-your-mouth duck blood curds, crispy beef tripe, spam, and soybean sprouts. Absorbing the spicy broth, the duck blood bursts with ultimate spicy savory goodness, showcasing the fiery and bold spirit of Chongqing Jianghu cuisine.", "name": "Duoxiangju Maoxiewang", "transport": "CRT Line 1 Ciqikou Station, Exit 1, about a 10-minute walk"}, {"address": "Inside Three Gorges Square, No. 88 Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Tucked away in the Three Gorges Square commercial district of Shapingba, this trendy bistro effortlessly blends exquisite Sichuan local dishes with live music performances. Try the signature \u0027Sichuan Peppercorn Craft Cocktail\u0027 paired with \u0027Spicy Rattan Pepper Chicken\u0027\u2014the chicken is tender and springy, infused with a long-lasting, mildly tingling rattan pepper aroma. With soft acoustic guitar music and warm dim lighting, it offers a romantic artistic vibe, making it a top choice for young people\u0027s nightlife gatherings.", "name": "Manshiguang Music Bistro", "transport": "CRT Line 1 Shapingba Station, Exit 1, about a 5-minute walk"}, {"address": "No. 268 Xiaolongkan Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | A renowned time-honored local brand in Chongqing that pioneered the elevated combination of traditional Sichuan dishes and rustic Jianghu cuisine. The must-order signature \u0027Taoran Taro Chicken\u0027 features chicken simmered until tender and savory, paired with silky smooth taro that soaks up the rich red oil and 13-spice aromas. With an elegant and spacious dining environment, it is an ideal spot for savoring authentic Chongqing banquets and family dinners.", "name": "Taoranju (Shapingba Main Branch)", "transport": "CRT Line 1 Xiaolongkan Station, Exit 4, about a 3-minute walk"}, {"address": "No. 69 Tianxingqiao Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | An affordable local restaurant hugely popular among students and residents, radiating authentic local Chongqing life and charm. The signature \u0027La Zi Ji\u0027 (Spicy Chicken) features bone-in diced chicken fried to golden crispiness and submerged in a sea of Sichuan peppercorns and dried red chilis\u2014the more you chew, the more fragrant and numbingly spicy it gets. Another hit, the \u0027Sour and Spicy Pork Intestines\u0027, is tender, crispy, tart, and spicy, pairing addictively well with rice.", "name": "Zhuanjiao Caofang Jianghu Restaurant", "transport": "CRT Line 9 Tianxingqiao Station, Exit 2, about a 5-minute walk"}, {"address": "No. 18 Jinbi Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | A popular music bistro situated along the Jialing River inside Ciqikou Ancient Town, boasting unbeatable river views and ancient town nightscapes. The menu features creative bar foods infused with Chongqing flavors, such as \u0027Spicy Cold Rabbit\u0027 and \u0027Spicy Grilled Pig Brain\u0027, complemented by local specialty fruit wines and craft beers. As night falls, gentle breezes and live acoustic singing create an unforgettable, atmospheric night out.", "name": "Xunmeng Folk Music Bistro", "transport": "CRT Line 1 Ciqikou Station, Exit 1, about a 12-minute walk"}, {"address": "No. 28 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | A legendary Ciqikou chicken offal institution on par with Maozhuang, highly acclaimed by local foodies in Chongqing. Stewed live in small pots at your table, the chicken offal boasts a vibrant red hue; the heart and intestines are delightfully snappy and tender, fully absorbing the tangy and spicy flavors of pickled vegetables and peppers. Add a serving of soft, chewy puffed tofu sheets at the end to soak up the rich, flavorful broth for an unforgettable taste of true local flavor.", "name": "Yanji Guzhen Chicken Offal", "transport": "CRT Line 1 Ciqikou Station, Exit 1, about a 7-minute walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Baolun Temple, Baiya Mountain, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.6 Stars | Located inside the thousand-year-old Baolun Temple in Ciqikou, this restaurant is steeped in historical ambiance. The signature vegetarian tofu pudding and vegetarian small noodles are truly unique. The tofu pudding has a smooth, velvety texture that melts in your mouth, paired with custom plant-based spicy chili oil and savory fermented black beans for a richly layered yet non-greasy taste. Visitors love enjoying a refreshing, healthy vegetarian meal here after paying their respects, soaking in the rare tranquility and peaceful atmosphere of the ancient town.", "name": "Baolun Temple Vegetarian Restaurant", "transport": "Take CRT Line 1 to Ciqikou Station (Exit 1), then walk for about 10 minutes."}, {"address": "No. 199 Tianxingqiao Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | A refined vegetarian restaurant deeply loved by local health-conscious diners, specializing in various mock meat dishes and healthy vegetable mini hotpots. The popular dish \u0027Vegetarian Shredded Chicken\u0027 is meticulously crafted from high-quality tofu skin, offering a firm and chewy texture. Dressed with a special spicy and numbing sauce and cilantro, it tastes delightfully numbing, refreshing, and incredibly appetizing\u2014winning high praise even from non-vegetarians.", "name": "Lianhua Vegetarian Restaurant", "transport": "Take CRT Line 1 to Tianxingqiao Station (Exit 2), then walk for about 5 minutes."}, {"address": "No. 12 Huangjueping 1st Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 Stars | Tucked away in an ancient alley of Ciqikou, boasting a tranquil, elegant environment filled with antique charm. The signature \u0027Vegetarian Chaoshou\u0027 (wontons) features thin, springy wrappers filled with a savory mixture of minced shiitake mushrooms, black fungus, and tofu. Chewy, tender, and juicy, served in a sweet and flavorful vegetable broth, it offers the ultimate comforting treat for tourists weary from exploring the streets.", "name": "Chansu Pavilion Vegetarian Restaurant", "transport": "Take CRT Line 1 to Ciqikou Station, then walk into the Ciqikou Ancient Town scenic area for about 8 minutes."}, {"address": "Zone B, Underground Commercial Street, Three Gorges Square, Shapingba Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 Stars | Located near the Three Gorges Square commercial area, famous for its traditional handmade vegetarian dim sum and pastries. Highly recommended are the \u0027Vegetarian Mushroom Bun\u0027 and \u0027Purple Sweet Potato Cake\u0027. The mushroom bun has a soft, fluffy crust bursting with savory mushroom aroma upon biting, while the purple sweet potato cake is pleasantly sweet with a delicate, fine texture\u2014a favorite healthy street snack among locals and students.", "name": "Cixin Vegetarian Workshop", "transport": "Take CRT Line 1 to Shapingba Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 88-10 Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.2 Stars | A high-value vegetarian buffet restaurant in the Xiaolongkan commercial district, serving over 40 fresh hot stir-fries and soups daily. The \u0027Fried Vegetarian Cutlet\u0027 in particular features a golden, crispy skin and a tender, juicy bean-product interior with a wonderful texture, drawing crowds of students, young professionals, and health enthusiasts for a satisfying meal.", "name": "Suxinyuan Vegetarian Buffet", "transport": "Take CRT Line 1 to Xiaolongkan Station (Exit 2), then walk for about 4 minutes."}, {"address": "No. 28 Hengjie Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.1 Stars | Situated on Hengjie Street in Ciqikou, this specialty stall focuses on traditional Chongqing vegetarian street food. The \u0027Vegetarian Hot and Sour Noodles\u0027 uses pure sweet potato noodles that are delightfully chewy, fully absorbing the well-balanced sour and spicy broth along with crunchy crushed peanuts. Tangy, savory, and appetite-inducing, it effortlessly wins the hearts of tourists.", "name": "Qingxin Vegetarian Snacks", "transport": "Take CRT Line 1 to Ciqikou Station (Exit 2), then walk for about 8 minutes."}, {"address": "Hall B, Longfor U-Town Mall, No. 27 Daxuecheng South Road, Shapingba District, Chongqing", "feature": "\u2b50 4.5 Stars | Located in the University City commercial district, blending modern creative culinary techniques into vegetarian cuisine. Popular choices include \u0027Truffle Wild Mushroom Risotto\u0027 and \u0027Thai-Style Vegetarian Tom Yum Soup\u0027. The risotto rice absorbs rich mushroom flavors with a creamy texture, while the sour and spicy soup is refreshing and cuts through richness, fully showcasing the delicious umami of wild mushrooms. It is a top choice for dates and gatherings among young people.", "name": "Shuxiangyi Vegetarian Restaurant", "transport": "Take CRT Line 1 to Daxuecheng Station (Exit 1), then walk for about 6 minutes."}, {"address": "No. 15 Jinbi Lane, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.7 Stars | Seamlessly combining Zen tea culture with nourishing vegetarian cuisine, hidden deep inside a Ciqikou alley. The signature \u0027Nourishing Bamboo Fungus \u0026 Red Date Soup\u0027 offers a sweet and clear broth, with crisp, juicy bamboo fungus that absorbs every drop of soup. Paired with custom grilled vegetarian skewers featuring a tender, savory flavor, it is highly favored by tourists seeking spiritual relaxation and high-quality vegetarian dining.", "name": "Yi Ye Pu Ti Vegetarian \u0026 Tea House", "transport": "Take CRT Line 1 to Ciqikou Station, then walk into the ancient town for about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 85 Zhengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | As the most iconic traditional souvenir and street snack in Ciqikou, Chen Changyin Mahua is exceptionally crispy, delivering a satisfying crunch with every bite as the aromas of wheat and rapeseed oil burst in your mouth. The sweet flavor is pleasantly light without being cloying, while the salt-and-pepper option boasts a bold, numbing Sichuan peppercorn aroma. Loved by locals and tourists alike, you\u0027ll always find a long queue at the door.", "name": "Chen Changyin Mahua (Fried Dough Twists)", "transport": "Take CRT Line 1 to Ciqikou Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 12 Hengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Watching the live noodle-making demonstration at the stall is a visually thrilling spectacle. The hot and sour rice noodles are soft yet deliciously chewy, thoroughly soaking up the signature chili oil and tangy vinegar. Every bite delivers a quick punch of tartness, followed by spicy heat and a lingering numbing sensation. Topped with crispy soybeans, diced pickled mustard tubers, and fresh cilantro, this vibrant, appetizing dish is a classic street snack enjoyed while strolling through the ancient town.", "name": "Zhang Laotie Handmade Hot and Sour Rice Noodles", "transport": "Take CRT Line 1 to Ciqikou Station, enter the ancient town, and walk for about 5 minutes."}, {"address": "Near No. 108 Zhengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | A daring Chongqing street food specialty, this foil-wrapped grilled pig brain boasts a texture as silky as French foie gras or tender tofu, completely free of gaminess. Melting instantly in your mouth, it bursts with the intense aromas of signature spicy chili oil, fermented black beans, and minced garlic. The interplay of smoky charred notes and rich creaminess astounds adventurous first-timers and keeps locals coming back for more.", "name": "Duoxiaoxian Grilled Pig Brain", "transport": "Take CRT Line 1 to Ciqikou Station, then walk for about 10 minutes."}, {"address": "No. 5 Lane 1, Huangjueping, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | A traditional steamed pastry wrapped in fresh leaves, its outer skin is made from glutinous rice flour, offering a delightfully chewy texture infused with a subtle herbal leaf aroma. Fillings range from savory minced pork with peanuts to sweet red bean paste. Biting into a hot, steaming savory one releases rich, flavorful juices\u2014a perfect balance of flavors that captures the authentic alleyway nostalgia of old Chongqing.", "name": "Ciqikou Ancient Town Ye\u0027er Ba (Leaf-Wrapped Rice Cakes)", "transport": "Take CRT Line 1 to Ciqikou Station, then walk for about 7 minutes."}, {"address": "Inside Three Gorges Square Pedestrian Street, Xiaolongkan Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | The reigning king of contemporary Chongqing night markets and street eats. Sweet potato skins are grilled until bubbly and slightly crisp on the outside while remaining stretchy and chewy inside, packed with pickled cowpeas, mustard tubers, scallions, and fish mint. Each bite is a crispy yet tender explosion of spicy, savory goodness infused with cumin and chili oil aromas\u2014a beloved late-night street snack among local students.", "name": "Shapingba Grilled Sweet Potato Skin \u0026 Dried Tofu", "transport": "Take CRT Line 1 to Shapingba Station (Exit 1), then walk for about 3 minutes."}, {"address": "Stalls along Zhengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | A charming, nostalgic traditional sweet found in the ancient town, where vendors swirl golden maltose syrup back and forth between two bamboo sticks. Richly sweet and delightfully gooey with stretchy threads, it slowly dissolves in your mouth to release pure, wholesome malt sweetness. Fun to play with and photo-worthy, it offers a sweet trip down memory lane as you wander along Ciqikou\u0027s cobblestone streets.", "name": "Traditional Maltose Jiaojiao Tang (Stirred Maltose Candy)", "transport": "Take CRT Line 1 to Ciqikou Station, then walk directly into the core area of the ancient town."}, {"address": "No. 45 Jinsha Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | A unique dessert made by freshly steaming potato flour and glutinous rice flour in small wooden steamers using high-pressure steam. Served piping hot, these fluffy, tender cakes are drizzled with brown sugar syrup and topped with sesame seeds, crushed peanuts, and diced hawthorn. Sweet, moist, and pleasantly tangy, the fragrant rice and rich brown sugar melt delightfully on the tongue, making it a hit with women and children.", "name": "Ancient Town Chongchong Gao (Steamed Rice \u0026 Potato Cake)", "transport": "Take CRT Line 1 to Ciqikou Station (Exit 2), then walk for about 6 minutes."}, {"address": "No. 104 Zhengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.8 stars | Though served in a restaurant setting, its bite-sized takeaway portions and street-style punchy flavors are famous throughout Chongqing. Crunchy chicken intestines, tender chicken liver, and springy gizzards are stir-fried over high heat with pickled peppers, celery, and Sichuan peppercorns. Delivering a bold mix of fresh, spicy, and tangy flavors with a rich sauce and lingering numbing kick, this is a top-tier local culinary experience in Shapingba.", "name": "Maozhuang Guzhen Jiza (Ancient Town Chicken Offal)", "transport": "Take CRT Line 1 to Ciqikou Station, then walk for about 9 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Ciqikou and Shapingba"}, "dazu_carvings": {"categories": {"cat_1": {"items": [{"address": "No. 168 Yixin Avenue, Youting Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Youting Liu Duck is one of the most iconic traditional dishes in Dazu District. Premium spot-billed ducks are braised with dozens of Chinese herbal medicines and special spices, then roasted to perfection. The skin is slightly crispy while the meat inside remains tender, juicy, and delightfully chewy, infused with a rich spicy and herbal aroma with no gamey odor at all. Highly praised by both tourists and locals, it is a classic time-honored delicacy you cannot miss when visiting Dazu.", "name": "Youting Liu Duck Restaurant", "transport": "Take Dazu Bus 201 to Youting Town Station, then walk for about 5 minutes."}, {"address": "No. 202 Yixin Avenue, Youting Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | The birthplace of Chongqing\u0027s crucian carp craze, this famous old-brand restaurant is renowned for its irresistibly delicious spicy crucian carp. Fresh carp is slow-simmered in a simmering broth with special broad bean paste and Sichuan peppercorns. The fish melts in your mouth\u2014exceptionally tender and thoroughly soaked in savory, numbingly spicy broth. Paired with a dipping sauce of scallions and crushed chili, it offers an incredible taste explosion. Locals cherish its decades-old authentic flavor, while tourists are captivated by its vibrant, spicy taste.", "name": "Youting Crucian Carp Main Restaurant", "transport": "Take Dazu Bus 201 to Youting Bus Station, then walk for about 3 minutes."}, {"address": "No. 136 Longzhong Road, Longgang Street, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Originating in Dazu, Dingjiapo Potato is a legendary snack famous throughout Chongqing. The potatoes are served in three styles: crinkle-cut fries (Langya potatoes), sliced potatoes in broth, and mashed potatoes, all tossed in the house-special chili oil and ground Sichuan pepper. The potato slices are crisp and refreshing, the mashed potatoes are smooth and rich, and the crinkle-cut fries are crispy on the outside and soft inside, packed with savory spice and fragrant oil. Both locals and visitors to the Dazu Rock Carvings make a special pilgrimage to this iconic flagship shop.", "name": "Dingjiapo Potato Main Shop", "transport": "Take Dazu Bus 101 or 105 to Hongsheng Square Station, then walk for about 4 minutes."}, {"address": "Near the entrance of Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | A well-known traditional eatery near the Baodingshan Rock Carvings scenic area, famous for its authentic Chongqing countryside home-style cooking. Signature dishes include stir-fried local pork, aged cured pork stewed with bamboo shoots, and pickled cabbage fish. The local pork is rich yet not greasy, with a springy texture cooked over a high-fire wok to impart a smoky wok hei. The bamboo shoots absorb the savory flavor of the cured meat, remaining crisp and juicy. Generous portions and authentic tastes make it the perfect spot for tourists seeking a comforting local meal after exploring the carvings.", "name": "Penglaiju Local Restaurant", "transport": "Take the Dazu Bus 205 Tourist Line to Baodingshan Rock Carvings Parking Lot Station, then walk about 300 meters."}, {"address": "No. 188 Middle Section of Wuxing Avenue, Tangxiang Street, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | A classic time-honored venue combining traditional Dazu flavors with a rustic dining atmosphere. Signature dishes like Dazu Black Corn Chicken and Stone Pot Tofu Pudding Fish are fan favorites. The Stone Pot Tofu Pudding Fish features freshly ground, silky tofu pudding served with tender fish in a bubbling stone pot. The fish is incredibly fresh and tender, floating in a spicy, aromatic broth that keeps diners coming back for more. Its ancient culinary techniques preserve the raw flavors of the ingredients, acting as a true ambassador for Dazu\u0027s food culture.", "name": "Impression Dazu Local Restaurant", "transport": "Take Dazu Bus 102 to Civic Center Station, then walk for about 5 minutes."}, {"address": "No. 88 Longshui Road, Longgang Street, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | A classic establishment specializing in traditional Chongqing smoked cured meat, slow-smoked over high-mountain cypress branches. The sliced cured pork displays a translucent red sheen; the fat is wonderfully crispy without being greasy, while the lean meat is savory and delightfully chewy, infused with a subtle woody aroma. Paired with wild mountain vegetables or served as cured pork fried rice, it offers rich textures and a lingering finish, making it a favorite among local gourmets who cherish ancient culinary traditions.", "name": "Qinjiagang Cured Meat Restaurant", "transport": "Take Dazu Bus 103 to Longshui Road Junction Station, then walk for about 2 minutes."}, {"address": "Next to the Visitor Center of the Core Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Located right next to the exit of Baodingshan Rock Carvings, this renowned traditional restaurant specializes in authentic Dazu folk banquet cuisine. Signature dishes like Steamed Pork with Rice Flour and Taibai Duck excel in color, aroma, and taste. The steamed pork melts in your mouth, with seasoned rice flour absorbing every drop of rich meat juices and fragrant spices. The Taibai Duck features a clear, savory broth with fall-apart tender meat. Decorated in an elegant vintage style, it offers diners an excellent combination of cultural ambiance and outstanding taste.", "name": "Baoding Gourmet Garden Traditional Restaurant", "transport": "Take Dazu Bus 205 Tourist Line to Baodingshan Rock Carvings Visitor Center Station; the restaurant is visible right upon arrival."}, {"address": "No. 108 Beishan Road, Dazu District, Chongqing (near Beishan Rock Carvings Scenic Area)", "feature": "\u2b50 4.5 stars | This farmstead-style traditional restaurant is famous for its home-grown organic vegetables and home-raised poultry. Famous signature dishes like Poached Fish in Chili Oil and Firewood Chicken draw visitors from near and far. The Firewood Chicken is cooked fresh over a wood flame in a large iron wok, yielding firm yet tender meat coated in a thick, numbingly spicy sauce. Corncakes pressed along the rim of the wok absorb the rich juices, becoming crispy on the outside and soft inside with a sweet-and-spicy flavor profile. Top-tier ingredients combined with authentic wood-fired cooking make it a popular spot for family gatherings and tour groups.", "name": "Xiangmanyuan Farmstead Restaurant", "transport": "Take Dazu Bus 208 to Beishan Rock Carvings Station, then walk for about 6 minutes."}], "name": "Renowned Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Next to the Visitor Center, Baodingshan Rock Carvings Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.6 Stars | A unique themed cafe inside the Baodingshan Rock Carvings Scenic Area, perfectly fusing thousand-year-old rock carving culture with modern specialty coffee. Their latte art features stunning designs like the classic Thousand-Hand Guanyin totem and Buddha silhouettes. The signature \u0027Carving Special Latte\u0027 uses a medium-dark roast with a smooth, velvety texture and rich nutty and dark chocolate notes, paired with a custom matcha mille-feuille cake that offers a deep tea flavor without being overly sweet. It\u0027s a favorite resting spot for tourists to sip fragrant coffee while taking in views of the mountain forest and ancient cultural heritage\u2014a true feast for both the eyes and taste buds.", "name": "Baodingshan Carving Cafe (Baodingshan Scenic Area)", "transport": "Take Dazu Bus Route 205 to Baodingshan Rock Carvings Scenic Area Station, then walk for about 3 minutes."}, {"address": "No. 128 Haitang 1st Road, Tangxiang Street, Dazu District, Chongqing", "feature": "\u2b50 4.5 Stars | Hidden in urban Dazu, this hipster brunch cafe is the ultimate pit stop for locals and travelers visiting the Dazu Rock Carvings. Their signature handmade French toast is toasted to a golden crisp on the outside while remaining cloud-soft inside, topped with pure maple syrup and fresh strawberries for a perfectly balanced sweetness. The classic Raw Coconut Latte blends cold-pressed coconut water with espresso, yielding a crisp, refreshing mouthfeel with layers of coffee and coconut aromas. Filled with lush greenery and warm wooden decor, it offers comforting handmade meals highly favored by Instagrammers and travelers looking to unwind.", "name": "Tangcheng Xiaozhu Brunch \u0026 Cafe", "transport": "Take Dazu Bus Route 101 to Haitang 1st Road Station, then walk about 200 meters."}, {"address": "1st Floor, Wuyue Plaza, Intersection of Longshui Road and Haitang Avenue, Dazu District, Chongqing", "feature": "\u2b50 4.4 Stars | Located in Dazu\u0027s core commercial district, this global coffee chain branch provides international travelers visiting the Dazu Rock Carvings with a familiar, high-quality coffee experience. The interior is spacious and bright, featuring decor infused with local Bayu design elements. The signature Flat White boasts velvety, fine milk foam with a rich espresso flavor and a lasting lingering finish. Pair it with the toasted beef croissant brunch, which has a crispy, layered crust and savory, juicy beef filling. Whether recharging before heading out to the scenic spots in the morning or relaxing after an afternoon tour, it is a trusted chain coffee choice for both locals and tourists.", "name": "Starbucks (Dazu Wuyue Plaza)", "transport": "Take Dazu Bus Route 201 directly to Wuyue Plaza Station."}, {"address": "Floor B1, Wuyue Plaza, Haitang Avenue, Dazu District, Chongqing", "feature": "\u2b50 4.3 Stars | A popular, high-value coffee brand loved by young travelers and independent tourists heading to the scenic area. Its iconic Raw Coconut Latte is smooth and rich, with sweet coconut milk perfectly balancing any espresso bitterness for an irresistibly refreshing drink. Served hot during brunch hours, the Toasted Beef \u0026 Cheese McMuffin features rich, gooey melted cheese, making it the perfect start to the day alongside a black coffee. Convenient mobile ordering and speedy preparation allow visitors bound for Baodingshan or Beishan to quickly grab a quality cup of coffee on the go.", "name": "Luckin Coffee (Dazu Wuyue Plaza)", "transport": "Take Dazu Bus Route 202 to Wuyue Plaza Station, then walk into Mall Floor B1."}, {"address": "Next to the Park inside Haitang Xiangguo Scenic Area, Beishan Road, Dazu District, Chongqing", "feature": "\u2b50 4.7 Stars | Located near the Beishan Rock Carvings Scenic Area, this Oriental Zen-themed cafe cleverly blends traditional tea art with modern coffee extraction. A standout highlight is the Cold Brew Pu\u0027er Coffee, which combines the aged aroma of Yunnan Pu\u0027er tea with the fruity notes of light-roasted Ethiopian coffee beans, leaving a smooth, complex, and delightfully sweet aftertaste. The brunch platter offers fresh fruit and vegetable salads alongside multi-grain rice balls for a light, guilt-free meal. Set in a tranquil environment with wooden tatami mats and rustic tea sets, it is the ideal spot for tourists seeking inner peace and flavor surprises after a cultural tour of the rock carvings.", "name": "Haitang Xiangguo Zen Tea \u0026 Coffee", "transport": "Take Dazu Bus Route 208 to Beishan Park Station, then walk about 5 minutes."}, {"address": "No. 210, Middle Section of Wuxing Avenue, Longgang Street, Dazu District, Chongqing", "feature": "\u2b50 4.5 Stars | Featuring an American vintage industrial style, this high-quality brunch cafe is loved by local foodies and wandering tourists alike. The signature American Grand Breakfast comes in generous portions, including fluffy scrambled eggs, seared German sausage, rich cheese toast, and fresh crispy salad\u2014offering a well-balanced and flavorful meal. Pair it with a single-origin Yirgacheffe pour-over, featuring elegant citrus and white flower aromas with a balanced acidity and clean finish. Warm service and hearty meals energize any morning in Dazu.", "name": "Time Caf\u00e9 \u0026 Brunch", "transport": "Take Dazu Bus Route 105 to Wuxing Avenue Station, then walk about 150 meters."}, {"address": "No. 88 Longzhong Road, Longgang Street, Dazu District, Chongqing", "feature": "\u2b50 4.4 Stars | A cozy shop near central Dazu focusing on healthy, low-calorie light meals and specialty coffee. The signature Smoked Salmon \u0026 Avocado Sandwich uses fresh whole wheat toast stuffed with creamy mashed avocado and tender, savory smoked salmon, creating clear, non-greasy layers of flavor. Pair it with an Oat Milk Latte, where sweet cereal notes blend seamlessly with espresso for a silky texture. The bright, minimalist environment is perfect for health-conscious travelers looking to enjoy a delicious brunch or afternoon tea.", "name": "Meet Coffee \u0026 Light Meal (Dazu)", "transport": "Take Dazu Bus Route 102 to Longzhong Road Station, then walk about 100 meters."}, {"address": "Building 3, Haitang Xiangguo Waterfront Style Street, Dazu District, Chongqing", "feature": "\u2b50 4.6 Stars | Situated by the Haitang Xiangguo Waterfront Scenic Area, this spacious scenic cafe features floor-to-ceiling windows and romantic crystal chandeliers. The popular classic Waffle Brunch Platter is baked fresh to order\u2014crisp on the outside and soft like cake inside\u2014served with rich vanilla ice cream and fresh berries for a perfectly balanced sweet-and-sour indulgence. For coffee, the signature Vienna Coffee tops rich, hot black coffee with cool, sweet fresh whipped cream, creating a delightful interplay of hot and cold, sweet and bitter. With its stunning views, it\u0027s the ultimate spot to enjoy a relaxing afternoon tea after exploring the Dazu Rock Carvings.", "name": "Maan Coffee (Dazu Haitang Xiangguo)", "transport": "Take Dazu Bus Route 205 to Haitang Xiangguo Station, then walk about 300 meters."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 102 Yixin Avenue, Youting Town, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | As the birthplace and a time-honored brand of Dazu Youting Crucian Carp, this is an iconic representative of local cuisine famous for its tender, spicy, and numbing flavors. The signature Youting Crucian Carp has delicate, melt-in-your-mouth flesh that absorbs the special Sichuan pepper and red chili oil broth, bursting with spicy and savory goodness. Included crushed peanuts, cilantro, and signature dipping sauce enhance the natural sweetness of the fish. With a lively and welcoming atmosphere, it is an absolute must-try classic for both tourists visiting the Dazu Rock Carvings and locals alike.", "name": "\u90f5\u4ead\u5289\u6c0f\u9bfd\u9b5a\u7e3d\u5e97 (Youting Liu\u0027s Crucian Carp Restaurant)", "transport": "Take Dazu Bus 201 to Youting Town Station, then walk for about 5 minutes."}, {"address": "Inside Changzhou Ancient Town Commercial Street, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Located within Changzhou Ancient City, this bistro blends quaint Song Dynasty architectural style with a traditional Sichuan bistro vibe. The menu features Dazu-style Sichuan dishes and homemade fruit wines. Signature dishes like \u0027Changzhou Roast Duck\u0027 boast crispy skin and tender meat, pairing exquisitely with floral-fruity rice wine for a rich sensory experience. Tourists love dining under the vintage corridors, enjoying local delicacies while taking in the romantic night views of the ancient town.", "name": "\u660c\u5dde\u5370\u8c61\u6c11\u4fd7\u9152\u6a13 (Changzhou Impression Folk Bistro)", "transport": "Take Dazu Bus 101 to Changzhou Ancient Town Station, then walk for about 3 minutes."}, {"address": "No. 15 Pedestrian Street, Gate of Baodingshan Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Located near the exit of the Baodingshan Rock Carvings scenic area, this is the best place to experience authentic Dazu farmhouse firewood-cooked dishes. Their \u0027Firewood Free-Range Chicken Pot\u0027 uses free-range mountain chicken, featuring firm, flavorful meat and a rich broth. Wild mushrooms soaked in the chicken broth are silky and smooth. Homemade pickles and aged cured pork are extraordinary highlights. Rich in cozy rustic atmosphere, it is highly favored by food lovers looking to recharge after walking the rock carving trails.", "name": "\u5bf6\u9802\u8fb2\u5bb6\u571f\u83dc\u9928 (Baoding Farmhouse Local Restaurant)", "transport": "Take Dazu Bus 205 (Scenic Special Line) to Baodingshan Rock Carvings Station, then walk for about 2 minutes."}, {"address": "No. 8 Hubin Road, Longshui Lake Resort Area, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Situated by the Longshui Lake Scenic Area, this restaurant specializes in lake-fresh fish dishes served in multiple ways. They carefully select live fish from Longshui Lake, killed freshly to order. The \u0027Fish with Pickled Cabbage\u0027 is delightfully tangy and appetizing, featuring paper-thin, incredibly tender fish fillets in a spicy, sour, and sweet broth. The \u0027Spicy Fish Bites\u0027 are crispy on the outside and soft inside, tossed with aromatic Sichuan peppercorns and dried chilies. Offering lakeside outdoor seating, you can take in beautiful lake and mountain views while dining\u2014a perfect combination of scenery and taste.", "name": "\u9f8d\u6c34\u6e56\u751f\u614b\u9b5a\u5e9c (Longshui Lake Ecological Fish Restaurant)", "transport": "Recommended to drive or take a taxi from Dazu downtown (approx. 20 minutes)."}, {"address": "Middle Section of Wuxing Avenue, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | An innovative restaurant that cleverly combines modern bistro style with local Dazu Sichuan cuisine. The popular \u0027Dazu Spicy Crab\u0027 features sweet, plump crab meat stir-fried in a secret spicy sauce until fragrant, paired perfectly with a craft \u0027Mountain City Sorghum Brew\u0027 for a thrilling, refreshing contrast. The interior design blends text elements from Dazu Rock Carvings with a modern industrial style, making it a favorite spot for young tourists and hipsters.", "name": "\u9189\u7f8e\u5927\u8db3\u7279\u8272\u9910\u9152\u9928 (Zuimei Dazu Featured Bistro)", "transport": "Take Dazu Bus 105 to Wuxing Avenue Station, then walk for about 4 minutes."}, {"address": "Inside Lotus Villa Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | A scenic local restaurant themed around lotus culture, where guests can enjoy a pond full of lotus blossoms during summer and autumn. Their exquisite \u0027Full Lotus Feast\u0027 is highly unique, featuring dishes like \u0027Steamed Pork with Rice Flour in Lotus Leaf\u0027\u2014fragrant, tender, non-greasy, and infused with subtle lotus leaf aroma\u2014and \u0027Fried Lotus Petals\u0027, which are crispy outside, soft inside, and pleasantly sweet. Offering both artistic cuisine and a tranquil, elegant ambiance, it is a wonderful choice for enjoying refined local food and unwinding.", "name": "\u8377\u82b1\u5c71\u838a\u751f\u614b\u666f\u89c0\u9910\u5ef3 (Lotus Villa Ecological Landscape Restaurant)", "transport": "Take Dazu Bus 205 (Scenic Special Line towards Baodingshan), get off at Lotus Villa Station, and walk a short distance."}, {"address": "No. 16 Longjing Road, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | A long-standing famous eatery in Dazu District, preserving a decades-old secret recipe for special red chili oil. Its \u0027Cold Pot Crucian Carp\u0027 arrives at the table bursting with aroma; the delicate, velvety fish is steeped in broth rich with premium green Sichuan peppercorns and seasoned oil, delivering a gently numbing and deeply savory taste. Homemade douhua (tofu pudding) is smooth and dense, served with dipping sauce to perfectly ease the spiciness. Warm service and genuine quality make it a local culinary landmark visited repeatedly by food enthusiasts.", "name": "\u90f5\u4ead\u9673\u6c0f\u8001\u5b57\u865f\u9bfd\u9b5a\u9928 (Youting Chen\u0027s Crucian Carp Bistro)", "transport": "Take Dazu Bus 102 to Tangxiang Jiekou Station, then walk for about 3 minutes."}, {"address": "No. 45 Beihuan 1st Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | A cozy eatery focusing on ancient-recipe local Chongqing Dazu cuisine, offering generous portions at affordable prices. The signature \u0027Taibai Duck\u0027 boasts a rich, flavorful broth with meat stewed until tender enough to fall off the bone, carrying subtle notes of herbal medicine and yellow wine. \u0027Dazu Sanhe Ni\u0027 is a classic traditional dessert made by slow-stirring glutinous rice, sesame, and walnuts; it is aromatic, chewy, and sweet without being cloying. Highly praised by locals for its authentic home-style flavors, it is a benchmark of local cuisine.", "name": "\u8700\u9999\u5712\u5730\u65b9\u8001\u83dc\u9928 (Shuxiangyuan Local Cuisine Restaurant)", "transport": "Take Dazu Bus 108 to Beihuan Lukou Station, then walk for about 2 minutes."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Shengshou Temple, Baodingshan Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Located inside the core scenic area of Baodingshan, this millennium-old temple vegetarian hall serves traditional Buddhist Zen vegetarian cuisine. The signature \u0027Lily Nourishing Vegetarian Soup\u0027 offers a dense, sweet, and smooth texture, with lilies and bamboo fungus melting on the tongue to deliver pure comfort. The \u0027Stir-fried Tofu Skin\u0027 boasts a rich soy aroma and a delightfully chewy texture. Beyond enjoying pure vegan dishes crafted according to ancient methods, guests can immerse themselves in a peaceful Zen dining atmosphere, making it a favorite for devout believers and tourists seeking inner peace.", "name": "Dazu Baodingshan Shengshou Temple Vegetarian Hall", "transport": "Take Dazu Bus Route 205 to the Baodingshan Scenic Area terminal station, then walk for about 8 minutes."}, {"address": "No. 1 Hehua Avenue, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | A scenic vegetarian restaurant combining Dazu\u0027s local lotus culture. The specialty \u0027Lotus-scented Seed Rice\u0027 steams fresh lotus seeds and glutinous rice wrapped in lotus leaves; the rice absorbs the subtle leaf fragrance, offering a delightfully chewy, soft texture with a hint of natural sweetness. The \u0027Fried Lotus Root Slices\u0027 are crispy on the outside and crunchy on the inside, satisfyingly crisp with every bite. Featuring elegant presentation full of natural flavors, it is a wonderful spot for visitors to unwind and enjoy a healthy meal after exploring the Rock Carvings.", "name": "Lotus Villa Vegetarian Restaurant", "transport": "Take a taxi for about 5 minutes from the Dazu Rock Carvings Baodingshan Visitor Center."}, {"address": "No. 12, Zone B, Commercial Street, Dazu Rock Carvings Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | An exquisite vegetarian restaurant near the scenic area entrance, renowned for creative mock-meat dishes and healthy cuisine. Highly recommended is the \u0027Handmade Vegetarian Twice-Cooked Pork,\u0027 which cleverly uses high-quality konjac and soy products to simulate the layered texture of pork belly\u2014firm, bouncy, and stir-fried with Chongqing\u0027s signature home-style Sichuan sauce for an aromatic, non-greasy taste. Even non-vegetarians are conquered by its impressive texture, making it a top-rated local favorite.", "name": "Dazu Rock Carvings Mingxiangyuan Vegetarian Restaurant", "transport": "Just a 300-meter walk from the scenic area exit, offering extremely convenient access."}, {"address": "No. 45 Baosheng Road, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | A well-established local vegetarian restaurant specializing in affordable vegetarian dim sum and ala carte dishes. A must-try is the \u0027Tai Chi Vegetarian Soup\u0027, beautifully crafted into a Yin-Yang pattern using spinach juice and mashed tofu; it is silky-smooth, melts in your mouth, and offers a refreshingly delicate taste. The \u0027Pan-fried Vegetarian Goose\u0027 features layered bean curd skin pan-fried to a golden crisp, stuffed with wood ear mushrooms and shredded bamboo shoots for rich texturing. Affordable prices and authentic Sichuan vegetarian flavors make this a top choice for locals and backpackers alike.", "name": "Dazu Baoding Vegetarian Restaurant", "transport": "Take Dazu Bus Route 205 to Baoding Town Bus Station, then walk about 200 meters."}, {"address": "No. 188 Middle Section of Wuxing Avenue, Tangxiang Street, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | An exquisite wellness sanctuary that seamlessly combines guqin tea art with Zen-inspired vegetarian dining. Try the \u0027Truffle \u0026 Wild Mushroom Pot,\u0027 slow-simmered with premium local high-mountain wild mushrooms; the broth is rich and flavorful, filling the senses while the mushrooms offer a smooth yet crisp bite. The \u0027Handcrafted High-Mountain Green Tea Cake\u0027 is sweet without being cloying, with a soft, chewy texture infused with subtle tea aroma. Featuring antique-style decor and private tea rooms, it is an ideal afternoon spot to sip tea, enjoy vegetarian snacks, and savor a peaceful, slow-paced lifestyle.", "name": "Miaoyin Vegetarian Tea House", "transport": "Take Dazu Bus Route 101 to Wuxing Avenue Station, then walk about 150 meters."}, {"address": "No. 78 Longdong Road, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | A traditional eatery focusing on spicy Chongqing-style vegetarian dishes. The exclusive \u0027Vegetarian Hot and Sour Noodles\u0027 features Dazu local sweet potato noodles\u2014chewy and smooth\u2014served in a house-made vegetarian broth with spicy chili oil; it is delightfully tangy and spicy with zero animal fat. The \u0027Spicy \u0026 Numbing Vegetarian Tofu\u0027 uses hand-ground stone-mill tofu, perfectly infused with spices for a rich, authentic Chongqing flavor. An unmissable spot for foodies who love fiery Chongqing spices while sticking to a plant-based diet.", "name": "Cixinzhai Vegetarian House", "transport": "Take Dazu Bus Route 201 to Longshui Bus Station, then walk about 400 meters."}, {"address": "No. 168 Beishan Road, Dazu District, Chongqing (Next to the entrance of Beishan Rock Carvings Scenic Area)", "feature": "\u2b50 4.6 stars | Nestled at the foot of the Beishan Rock Carvings scenic area, enjoying gorgeous natural scenery and a serene ambiance. The highlighted dish, \u0027Bamboo Fungus \u0026 Mountain Delicacies Pot,\u0027 features crisp bamboo fungus soaked in flavorful broth that bursts in your mouth with natural sweetness; pair it with the \u0027Steamed Harvest Grains\u0027 to savor the purest natural sweetness of fresh ingredients. Dishes here focus on authentic flavors with light oil and salt, making it popular among health-conscious and culturally minded travelers seeking inner purification.", "name": "Dazu Beishan Zen Vegetarian Restaurant", "transport": "Take Dazu Bus Route 208 directly to Beishan Rock Carvings Station, then walk about 2 minutes."}, {"address": "Group 3, Chongjiao Village, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | A rustic specialty vegetarian restaurant utilizing local pollution-free farm vegetables from Dazu. The \u0027Golden Salted Crisp Pumpkin\u0027 is a must-try: pumpkin strips coated in special batter and fried to golden perfection, offering a delightful contrast between the crispy shell and the sweet, soft interior. The \u0027Stone Pot Assorted Vegetables\u0027 combines a variety of fresh seasonal vegetables and mushrooms, using the piping-hot stone pot to lock in natural aromas. Its cozy farmstead ambiance and fresh, light ingredients win unanimous praise from travelers.", "name": "Jingxinzhai Specialty Vegetarian Restaurant", "transport": "Driving is recommended, or take a taxi for about 7 minutes from Baodingshan Scenic Area."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 139 Longzhong Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | This is Dazu\u0027s most iconic legendary street food and a soulful comfort food locals grew up eating. The shop prepares potatoes in three forms: crinkle-cut fries, thin potato chips, and mashed potatoes, tossed with a secret chili oil, Sichuan pepper powder, garlic water, and chopped scallions. Crispy on the outside and soft inside, while the mashed potato is dense and flavorful, the spicy and numbing red oil instantly explodes on the palate with rich layers. It attracts countless tourists to make a pilgrimage for Chongqing\u0027s most quintessential walking snack.", "name": "Dingjiapo Potato (Dingjiapo Yangyu)", "transport": "Take Dazu Bus 205 to \u0027Longgang Police Station\u0027 stop, then walk about 200 meters."}, {"address": "Stall 16, Old Street, Baodingshan Rock Carvings Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | A traditional handmade snack on the old street at the exit of Baodingshan Rock Carvings scenic area. Fresh wild mugwort is blended with glutinous rice flour, wrapped around savory diced cured pork or sweet red bean paste, and pan-fried until golden on both sides. The crust is crispy and fragrant, opening into a chewy, bouncy bite rich with herbal aromas and rice sweetness. Perfectly balanced and non-sticky to the teeth, it\u0027s a favorite refueling walking dessert for tourists after visiting the carvings.", "name": "Baodingshan Old Street Mugwort Rice Cake (Caozhi Baba)", "transport": "Take Dazu Bus 205 from Dazu Bus Station directly to \u0027Baodingshan Carvings Station\u0027, then walk into the old street."}, {"address": "No. 5 Commercial Street, Baodingshan Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | A traditional intangible cultural heritage street food in Dazu, Chongqing, steamed fresh to order. Fine powder milled from indica and glutinous rice is packed into special wooden molds and rapidly steamed with jets of vapor, then drizzled with brown sugar syrup, sesame seeds, crushed peanuts, and candied winter melon strips. Soft, dense, with a subtle woody aroma, it melts in your mouth hot and sweet without being cloying. Its rustic preparation process draws crowds of tourists to watch, take photos, and sample.", "name": "Baoding Steamed Rice Cake (Chongchong Gao)", "transport": "Take the scenic shuttle car to Baodingshan Commercial Area, then walk about 3 minutes."}, {"address": "Stall outside Minle Shopping Mall, Beijie Street, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | An immensely popular cold jelly stall in Dazu Old Town, nicknamed \u0027Sad Cold Jelly\u0027 because its fiery kick literally brings tears to your eyes as you eat. Handcrafted from premium pea starch, cut into uniform strips, and tossed with fiery custom red oil, spiced soy sauce, minced preserved mustard greens, and roasted peanuts. The jelly is silky-smooth and springy, melting in your mouth before a wave of intense, flavorful spicy-numbing goodness hits\u2014an exhilarating rush that spice lovers can\u0027t get enough of.", "name": "Deng\u0027s Handmade \u0027Sadness\u0027 Cold Jelly (Dengji Handcrafted Cold Jelly)", "transport": "Take Dazu Bus 101 to \u0027Beijie Station\u0027, then walk about 100 meters."}, {"address": "Stall 12, Longhua Road Night Market, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | A signature street fried bite originating from Longshui Town in Dazu. Fresh boneless fish fillets are marinated, lightly battered, fried to a golden crisp, and dusted with a unique five-spice chili powder. Extremely crispy on the outside while tender, juicy, and fishy-smell-free inside, offering a savory, spicy, and refreshing taste. Served in paper bags for easy munching on the go, it\u0027s one of the most popular savory street snacks in local night markets.", "name": "Longshui Town Five-Spice Spicy Fried Fish Bites", "transport": "Take Dazu Bus 201 to \u0027Longshui Hardware Market Station\u0027, then walk about 400 meters to the night market."}, {"address": "Snack Stall beside No. 88 Yixin Avenue, Youting Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | A traditional snack stall near Youting Town\u0027s famous food street, renowned for its deboned chicken feet with pickled chili and spicy red oil. Meticulously deboned, the feet offer a crispy skin and chewy bite with great elasticity, fully absorbing the tangy spice of Sichuan pickled peppers and the numbing aroma of red chili oil. Tangy, spicy, appetizing, and completely ungreasy, many tourists traveling to Dazu Rock Carvings stop by to pick up a few packs as roadside snacks.", "name": "Youting Liu\u0027s Snacks Boneless Chicken Feet", "transport": "Take Dazu Bus 105 to \u0027Youting Bus Station\u0027, then walk about 300 meters."}, {"address": "Stall 23, Pedestrian Street, Changzhou Ancient Town Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | A traditional folk market stall along the cobblestone streets of Changzhou Ancient Town. A local artisan crafts lifelike animal sugar paintings on the spot using maltose while freshly baking handmade sesame egg rolls. Hot off the press, the egg rolls are exquisitely crispy, bursting with rich egg and sesame aromas with every bite. The sugar art is sweet, crunchy, and non-sticky, radiating nostalgic childhood charm\u2014a popular market treat for families and travelers alike.", "name": "Changzhou Ancient Town Sugar Painting \u0026 Egg Roll Stall", "transport": "Take Dazu Bus 203 to \u0027Changzhou Ancient Town Station\u0027, then walk into the ancient town area."}, {"address": "Stall 29, No. 1 Night Market, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Located in the Longgang Old Street Night Market, this snack stall represents iconic Chongqing late-night food. Fresh pig brains are placed in tin foil cups with pickled peppers, Sichuan peppercorns, minced garlic, fermented black beans, and special chili oil, slow-roasted over charcoal. The texture is intensely silky and melt-in-your-mouth tender\u2014reminiscent of French foie gras\u2014with zero gamey flavor, replaced by a mouthwatering explosion of spicy, numbing, and savory goodness. A must-try item for foodies seeking bold, authentic Chongqing flavors.", "name": "Longgang Old Street Traditional Roasted Pig Brain", "transport": "Take Dazu Bus 102 to \u0027Longgang Department Store Station\u0027, then walk about 250 meters."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dazu Rock Carvings Scenic Area"}, "eling_liziba": {"categories": {"cat_1": {"items": [{"address": "5F, No. 60 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Located right next to the Liziba Monorail Station, this household name in Chongqing is a famous traditional eatery. The signature Liangshan Chicken is simmered with a secret blend of Chinese herbs, tender chicken chunks, and taro. The broth is rich, savory, and spicy, balanced with the soothing herbal notes of goji berries and angelica root. The chicken is succulent, and the soft, silky taro melts in your mouth after absorbing the flavorful soup. Both local foodies and visiting tourists rave about its uniquely warming, nourishing, yet non-drying spicy flavor profile.", "name": "Liziba Liangshan Chicken", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit A, and walk about 3 minutes."}, {"address": "Annex No. 1, No. 149 Zhongshan 3rd Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | This legendary hotpot spot inside an authentic air-raid shelter was a filming location for the hit movie \u0027Chongqing Hot Pot\u0027. It preserves the shelter\u0027s raw rock walls and cool, humid air, oozing nostalgic charm. The signature beef tallow broth is thick, aromatic, and fiery. Their specialty beef tripe comes in generous, crispy slices\u2014just swish it in the boiling broth for a few seconds, dip into garlic sesame oil, and enjoy a satisfyingly crunchy, highly flavorful bite. Locals love it for its top-notch ingredients and genuine air-raid shelter experience.", "name": "Dongtingxian Air-raid Shelter Hotpot", "transport": "Take Chongqing Rail Transit Line 1 to Lianglukou Station, Exit 1, and walk about 8 minutes."}, {"address": "No. 113 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Tucked away next to a steep mountain staircase near Liziba, this venerable noodle shop gets its name \u0027Tikan\u0027 from the local culture of eating noodles and chatting on outdoor stairs. The signature Peas \u0026 Sauce Noodles (Wanza Noodle) and Beef Noodles offer fantastic textures: chewy noodles paired with velvety soft peas and savory meat sauce that clings to every strand. Every bite bursts with rich sauce flavors and a tongue-numbing Sichuan pepper kick, making it a beloved haunt for both neighborhood office workers and food-seeking travelers.", "name": "Tikan Noodle Restaurant", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit B, and walk about 5 minutes."}, {"address": "No. 163 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Nestled in an alley near the top of Eling Hill, this historic hotpot eatery relies on time-tested traditional beef tallow simmering techniques. The glossy red broth intensifies in heat and aroma as it cooks, releasing a rich aroma of Sichuan peppercorns and beef fat. The fresh duck intestines are a must-order\u2014translucent and incredibly crispy after just a few seconds in the pot. Their handmade cilantro meatballs are hearty and juicy, bursting with rich meat juices and spicy soup when you bite into them. A go-to favorite for local family gatherings.", "name": "Eling Old Hotpot", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk about 6 minutes."}, {"address": "Near No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Operating for decades in the historic Eling neighborhood, this vintage shop preserves the purest traditional mountain-city snack flavors. The signature Sour and Spicy Noodles (Suan La Fen) and Chongqing Xiaomian make a perfect pair. The sweet potato noodles are bouncy and smooth with great chewiness, bathed in a tangily zesty broth crafted from aged vinegar and custom chili oil. It\u0027s refreshingly sour and kicky without being harsh, garnished with crunchy peanuts and diced preserved mustard stem\u2014a classic nostalgic comfort food for old Chongqing locals.", "name": "Chayuan Snack Old Noodle Shop", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 2, and walk about 4 minutes."}, {"address": "No. 55 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Situated right beside the famous Liziba monorail viewing platform, this popular local spot lets you admire monorail trains passing through the residential building while dining. It features traditional nine-grid beef tallow hotpot with authentically punchy spice levels. The spicy sliced beef is thick and generously coated in special chili powder, cooking into tender, fiery perfection that delivers an instant spicy kick. Their handmade shrimp paste is springy and sweet, taking on vibrant flavor layers as it absorbs the spicy hotpot oil.", "name": "Liziba Chuanlou Old Hotpot", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit A, and walk about 2 minutes."}, {"address": "No. 102 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A branch of Chongqing\u0027s iconic late-night dining establishment, renowned far and wide for its uniquely delicious roasted pork brains. Served in foil trays, the pork brains are slow-roasted with pickled chilies, Sichuan peppercorns, minced garlic, and chili oil. The texture is as silky and delicate as tofu, completely free of gamey odor and bursting instead with rich savory, spicy, numbing, and garlic flavors. A traditional delicacy that challenges your culinary courage yet keeps you coming back for more.", "name": "Jiucun Roasted Brains (Liziba Branch)", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit 1, and walk about 5 minutes."}, {"address": "Inside TESTBED 2 Cultural Park, No. 31 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | A classic cold braised stew store located near TESTBED 2 (Eling) Cultural Park. The signature Spicy Duck is slow-marinated cold using over ten traditional herbal spices and premium Sichuan peppercorns. The duck meat is firm, chewy, and dry-cured, coated in aromatic chili oil and sesame seeds. It hits the palate sweet first before transitioning into a tongue-numbing heat, growing more flavorful with every chew. A must-buy street snack for tourists visiting TESTBED 2.", "name": "Eling Testbed 2 Traditional Spicy Duck", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk about 10 minutes."}], "name": "Established Local Eateries"}, "cat_2": {"items": [{"address": "Inside TESTBED2 Cultural \u0026 Creative Park, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | A hidden gem of a lush green cafe in TESTBED2 Cultural and Creative Park. Surrounded by retro plants and wooden furniture, it radiates a warm, Japanese forest-like vibe. Known for its rich hand-drip single-origin coffees, signature matcha mousse cake, and freshly baked waffles\u2014crispy on the outside, soft inside, perfectly sweet without being overwhelming. Highly recommended by both tourists and local youth as a tranquil afternoon tea escape.", "name": "Lazy Fish Time Cafe", "transport": "Approx. 10-min walk from Exit 1 of Eling Station, Rail Transit Line 1"}, {"address": "Rooftop, Building H, TESTBED2 Cultural \u0026 Creative Park, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Perched on the highest rooftop of TESTBED2, offering unmatched views of the two rivers converging and the Yuzhong Peninsula skyline. Enjoy their signature cold brew with refreshing citrus notes alongside a dense, rich Basque cheesecake. Savoring an exquisite brunch while overlooking the mountain city\u2019s stunning panorama makes this a famous sunset photo spot.", "name": "Wild Roof Coffee", "transport": "Approx. 12-min walk from Exit 1 of Eling Station, Rail Transit Line 1"}, {"address": "No. 128 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | A stylish, hipster cafe near Eling Park featuring a minimalist industrial design blended with old Chongqing architecture. The signature \u0027Osmanthus Latte\u0027 pairs local osmanthus honey with espresso, offering an elegant floral aroma and warm milky flavor. Serving all-day American breakfasts and avocado toast with fresh, layered ingredients, it\u0027s a favorite among foreign tourists and trendy locals.", "name": "Lingshang Coffee", "transport": "Approx. 5-min walk from Exit 2 of Eling Station, Rail Transit Line 1"}, {"address": "2F, No. 56 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Located directly opposite Liziba Station, this prime vantage point cafe allows you to capture the surreal sight of the monorail passing through the building right from your window seat. The house-special \u0027Chongqing Spicy Caramel Latte\u0027 blends subtle spiciness with rich caramel for a novel yet delicious treat. Paired with fluffy, freshly made American pancakes and fruit platters, it\u0027s the ultimate spot to experience Chongqing\u2019s unique topography over a relaxing break.", "name": "Monorail Viewing Cafe", "transport": "Approx. 2-min walk from Exit 1 of Liziba Station, Rail Transit Line 2"}, {"address": "1F, Building B, TESTBED2, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | A classic retro cafe inside TESTBED2 that retains the original red brick walls and steel structure of the old printing factory, showcasing strong industrial aesthetics. Specializing in single-origin hand-poured coffee and house-roasted beans with clean, bright flavors. Their popular brunch features Eggs Benedict with oozing egg yolks, crispy bacon, and special Hollandaise sauce\u2014a rich and flavorful crowd favorite.", "name": "TIME Cafe", "transport": "Approx. 10-min walk from Exit 1 of Eling Station, Rail Transit Line 1"}, {"address": "No. 118-3 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | A hidden light-meals cafe near the Liziba riverside, boasting front-row panoramic views of the Jialing River. The healthy, low-calorie brunch menu features items like smoked salmon salad with nut rye bread\u2014refreshing and light. The signature iced coconut cold brew is cool and refreshing with subtle coconut milk sweetness, perfect for travelers seeking quiet river scenery and wholesome food.", "name": "Jiangpan Xunlu Riverview Cafe", "transport": "Approx. 8-min walk from Exit B of Liziba Station, Rail Transit Line 2"}, {"address": "No. 15 Eling Foothill Trail, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Tucked away in an alley along the Eling mountain trail, this cafe exudes a cozy, handmade vibe. The owner\u0027s homemade tiramisu is moist, dense, and delicately laced with liquor and espresso. The hot-pressed panini brunch features a crispy crust and stretchy melted cheese, which pairs wonderfully with a rich Flat White for a delightful slow-paced respite in the bustling mountain city.", "name": "Mangu Corner Cafe", "transport": "Approx. 8-min walk from Exit 1 of Eling Station, Rail Transit Line 1"}, {"address": "No. 88 Liziba Back Mountain Trail, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | An outdoor scenic cafe blending camping aesthetic with mountain city charm, surrounded by lush greenery halfway up Eling mountain. Popular dishes include freshly toasted sourdough with avocado poached egg and vanilla souffl\u00e9, which is cloud-like light and melts in your mouth. Paired with the specialty \u0027Mountain Mist Iced Coffee\u0027, it offers both visual and culinary delight\u2014a must-visit spot for influencers and photo lovers.", "name": "Wilderness Mountain Cafe", "transport": "Approx. 10-min walk from Exit A of Liziba Station, Rail Transit Line 2"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 60 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | A landmark of classic Chongqing local cuisine, Liziba Liangshan Chicken is famous for its unique spicy herbal flavor profile. The restaurant selects premium free-range chickens, slow-simmering them with dozens of traditional herbs like Chinese angelica and glehnia root, along with a secret spicy hot pot base. The chicken is tender and falls right off the bone, while the taro absorbs the rich broth to become melt-in-your-mouth soft. Featuring a spicy kick with a subtle herbal sweetness, this local specialty is an absolute must-try when visiting Liziba.", "name": "Liziba Liangshan Chicken Flagship Store", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, Exit A, and walk about 300 meters."}, {"address": "Inside TESTBED2 Cultural Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Located within the Eling TESTBED2 Cultural Park, this industrial-chic bistro seamlessly blends local spicy Chongqing flavors with American craft beers. The signature spicy steak is crispy on the outside and tender juicy on the inside, perfectly paired with house-brewed specialty craft beer to refresh your palate. The bistro features a fantastic terrace offering stunning panoramic views of Yuzhong Peninsula\u0027s dazzling night cityscape.", "name": "Eling 31 Craft Beer \u0026 Bistro", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 1, and walk about 10 minutes."}, {"address": "No. 136 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Tucked away on the summit of Eling Hill, this scenic bistro \u0026 bar specializes in modern Chongqing local fusion and Italian cuisine. Designed with an artistic touch and modern aesthetic, its outdoor garden seating overlooks the grand Yangtze River. The signature herb-roasted crispy skin chicken is incredibly juicy and flavorful, pairing delightfully with the owner\u0027s signature cocktail \u0027Mountain City Years\u0027 for a refreshing visual and culinary delight.", "name": "Lingwai Bistro \u0026 Bar", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station, Exit 2,
