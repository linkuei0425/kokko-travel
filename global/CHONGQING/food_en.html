 highlights, offering rich layers of flavor loved by both tourists and locals alike.", "name": "Xunwei Wulong Local Restaurant", "transport": "Take the Wulong district bus to Xiannvshan Town Visitor Center Station, then walk for about 5 minutes."}, {"address": "No. 95 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Famous for passing down traditional mutton dishes for generations, this time-honored local eatery uses local Wulong high-altitude black goats. Simmered for hours over low heat with special spices, the mutton is tender, juicy, and melts in your mouth, infused with spicy and savory broth. Paired with local sour mustard greens and tofu soup, it\u0027s appetizingly sour, spicy, and perfectly cuts through grease\u2014making it an ideal stop to recharge after visiting the Three Natural Bridges scenic area.", "name": "Zhang\u0027s Bowl Mutton Restaurant", "transport": "Take the Xiannvshan Town Loop Bus to Yinxing Avenue Station, then walk for about 3 minutes."}, {"address": "No. 12 Guihua Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Specializing in classic delicacies from the Wujiang River basin, this local restaurant carefully selects fresh fish from the Wujiang River and local hand-milled stone-ground tofu. The fish meat is delicate, soft, and bone-free, absorbing the essence of a custom spicy red broth and pickled peppers. The tofu is crispy on the outside and tender inside, filled with flavorful spicy broth, offering an unforgettable taste experience that makes it a must-visit spot for tourists.", "name": "Wujiang Tofu Fish Restaurant", "transport": "Take a taxi from Xiannvshan Visitor Center; takes about 5 minutes."}, {"address": "Building 3, Champagne Town, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | Combining Tujia ethnic features with a modern bistro ambiance, this exquisite local restaurant showcases a rich minority wooden architectural style. It offers homemade cured pork, stir-fried cured pork with bamboo shoots, and unique high-mountain corn wine. The cured pork is rich yet not greasy with a satisfying chew, perfectly complimented by the sweet, smooth local wine to create the purest mountain flavors of Wulong.", "name": "Zhaizi Tujia Local Restaurant", "transport": "Take the Wulong Xiannvshan Tourist Bus line to Champagne Town Station."}, {"address": "No. 128 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Renowned for its unique bamboo steamer cooking technique and secret spicy sauce, this local specialty restaurant features free-range local chicken and high-altitude small taros. The chicken is firm and tender, while the taro is simmered until soft, velvety, and melt-in-your-mouth. The secret sauce blends seamlessly into the ingredients, offering a spicy punch with a sweet aftertaste\u2014a deeply satisfying, comforting delicacy perfect for winter.", "name": "Xiannv Mountain Bamboo Basket Taro Chicken", "transport": "Take Xiannvshan Town Bus Route 1 to Yinxing Road Intersection Station, then walk for about 2 minutes."}, {"address": "No. 8 Xueling Road, Resort Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Immersed in vibrant Miao ethnic customs, this specialty local restaurant offers a unique \u0027High Mountain \u0026 Flowing Water\u0027 traditional toast ceremony along with song and dance performances. The signature Sour Soup Fish uses traditional Miao fermented sour broth, which is tangy, spicy, and refreshing, paired with tender, silky fish. Accompanied by special Miao sweet glutinous rice wine, it\u0027s a sensory feast combining sights, sounds, and flavors.", "name": "Gaoshan Liushui Miao Local Cuisine", "transport": "Take a taxi from the entrance of the Three Natural Bridges scenic area; takes about 8 minutes."}, {"address": "Zone B, Xiannv Pedestrian Street, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | A trendy music bistro situated in the Xiannvshan Resort Area that seamlessly combines local Wulong ingredients with craft beer. Signature dishes include fresh high-altitude cold-water fish sashimi, spicy grilled lamb chops, and local wild herb salad. The bar serves a variety of craft beers and cocktails infused with local high-mountain fruits. With its cozy and laid-back vibe, it is the ultimate spot for travelers to unwind and enjoy a drink after a day of exploring Karst landscapes.", "name": "Impression Wulong Night Bistro", "transport": "Walk to the core area of Xiannv Pedestrian Street; located in the middle section of the pedestrian street."}, {"address": "No. 22 Shilin Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | A cozy restaurant specializing in Wulong\u0027s high-altitude sweet potato starch noodles (Shao Fen) and traditional local dishes. The signature hot and sour sweet potato noodles are delightfully chewy and springy, soaking up the savory hot and sour broth and aromatic minced meat. Paired with house-made pot-cooked rice and stir-fried wild vegetables, it delivers the most authentic, humble flavors of mountain home cooking, highly acclaimed by foodies.", "name": "Gaoshan Sweet Potato Noodle \u0026 Local Dishes", "transport": "Take Xiannvshan Town Bus Route 2 to Shilin Road Station, then walk for about 1 minute."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 9 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Located near the Fairy Mountain Scenic Area, this vegetarian restaurant focuses on wild mushrooms and high-altitude organic vegetables. The signature \u0027Alpine Bamboo Shoot Claypot\u0027 is tender and juicy, featuring sweet, crisp bamboo shoots simmered in a rich vegetable broth for an unforgettable flavor. The local wild mushroom platter is a must-order for tourists, offering thick, juicy mushroom meat with ultimate savory umami\u2014making it the top choice for a refreshing, detoxifying meal after sightseeing.", "name": "Fairy Mountain Vegetarian Restaurant", "transport": "Take the Fairy Mountain Scenic Area Sightseeing Bus to Town Center Station, then walk for about 5 minutes."}, {"address": "No. 15 Xiangjiang Road, next to Tourist Center, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Combining Zen tea arts with refined vegetarian cuisine, this specialty restaurant is a favorite among travelers seeking a quiet ambiance. Its signature \u0027Handmade Tofu Claypot\u0027 features a lightly charred, crispy exterior with an interior as smooth as tofu pudding, drizzled with a secret spicy vegetarian sauce that is refreshing and non-greasy. The fragrant high-altitude green tea offers a sweet aftertaste, perfectly paired with vegetarian pastries like pine nut cake for a delightfully layered culinary experience.", "name": "Guizhen Vegetarian \u0026 Tea House", "transport": "Walk about 3 minutes from the Wulong Karst Tourist Center."}, {"address": "No. 3, Area B, Commercial Area, Exit of Three Natural Bridges Scenic Area, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Located right near the exit of Three Natural Bridges, this casual vegetarian diner serves healthy, light meals for post-hike travelers. The signature \u0027Alpine Gastrodia Vegetarian Noodle\u0027 features chewy, bouncy noodles in a slow-simmered broth made from Chinese herbs and mountain produce, warming the stomach and revitalizing energy. Pair it with the special \u0027Chilled Alpine Cabbage\u0027, which offers a crisp, tangy, and spicy taste that boosts your appetite.", "name": "Tiansheng Sanqiao Vegetarian Cafe", "transport": "Walk about 2 minutes after exiting the transfer center at the Three Natural Bridges Scenic Area."}, {"address": "Next to the entrance of Longshui Gorge Fissure Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Located near Longshui Gorge Fissure, this restaurant specializes in high-altitude cold-water tofu and wild mountain greens. The \u0027Sizzling Cumin Vegetarian Beef\u0027 comes highly recommended\u2014made from high-quality soy protein, it is tender, chewy, and bursting with cumin aroma, rivaling real meat. The signature \u0027Wild Mushroom Soup\u0027 features a clear, savory broth and delightfully chewy mushrooms, making it a favorite among plant-based food lovers.", "name": "Longshuixia Suxin Vegetarian Restaurant", "transport": "Take the Longshui Gorge shuttle bus to the scenic area entrance; the restaurant is right there."}, {"address": "Next to the ticket office of Impression Wulong Theater, Taoyuan Grand Canyon, Wulong District, Chongqing", "feature": "\u2b50 4.1 stars | Designed for visitors attending the Impression Wulong live performance, this spot specializes in convenient grab-and-go vegetarian meals. The flagship \u0027Colorful Sorghum Rice Bento\u0027 includes purple sweet potato, corn, wild mountain bamboo shoots, and shiitake mushrooms, served over fragrant, distinct grains for a refreshingly balanced meal. The \u0027Crispy Vegetarian Chop\u0027 is particularly popular\u2014crisp on the outside, tender inside, with a subtle nutty soy aroma, making it a perfect quick energy boost.", "name": "Impression Wulong Vegetarian Bento", "transport": "Take the Impression Wulong Special Bus Route to the theater terminal station."}, {"address": "No. 88 Guihua Road, Fairy Mountain National Forest Park Resort Area, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | An upscale vegetarian restaurant centered around bamboo shoots and bamboo fungus. The signature \u0027Stuffed Bamboo Fungus with Mountain Veggies\u0027 wraps minced wild mushrooms and carrots inside fresh bamboo fungus, offering a crisp texture that bursts with sweet vegetable broth in every bite. The elegant, antique-style interior overlooks expansive mountain vistas, making it an ideal spot to savor local Wulong bamboo cuisine and unwind.", "name": "Xianshan Zhuhai Vegetarian Restaurant", "transport": "Driving or taking a 10-minute taxi ride from Xiannvshan Town is recommended."}, {"address": "No. 1 Fanyin Lane, next to Cuiyunlang Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | A classic Zen-inspired vegetarian house located near the scenic area, focusing on the pure flavors of raw ingredients. The popular \u0027Golden Broth Vegetarian Lion\u0027s Head\u0027 is handcrafted from tofu, water chestnut, and mashed shiitake mushroom, soaking up a rich golden broth with a dense, soft texture accented by a subtle crispness from the water chestnut. Served with a bowl of mountain red rice, it provides a satisfying, guilt-free meal favored by hikers.", "name": "Fanyin Zen Tea \u0026 Vegetarian House", "transport": "Take the scenic loop bus from Fairy Mountain Tourist Center and get off at Cuiyunlang Station."}, {"address": "No. 168-5 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | A unique eatery combining traditional Chongqing claypot cuisine with healthy vegetarian dining. Its \u0027Sour \u0026 Spicy Wild Mushroom Claypot\u0027 simmers local aged pickled vegetables with various wild mountain mushrooms, creating an appetizing, tangy broth and succulent mushrooms packed with rich flavor. Paired with \u0027Handmade Mountain Corn Cakes\u0027\u2014crispy outside and sweet and chewy inside\u2014it is the ultimate cozy culinary treat for chilly mountain weather.", "name": "Gaoshan Yuan Vegetarian Claypot", "transport": "Walk or take the town sightseeing bus to Yinxing Avenue Middle Station."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Food Street Area outside Xiannv Mountain Town Visitor Center, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Made with small potatoes native to the high-altitude region of Wulong, slow-roasted over charcoal or griddled until golden brown and crispy on the outside, yet soft and fluffy inside. Each bite offers a satisfying slight crunch with a smoky aroma, yielding to a warm, melt-in-your-mouth interior. Sprinkled with a custom spice blend of chili powder, Sichuan pepper powder, cumin, and scallions, it creates a savory, spicy balance highlighting the potato\u0027s natural sweetness. It is the top choice for a street snack to recharge your energy after exploring the Three Natural Bridges.", "name": "Xiannv Mountain Roasted Potato Stall (Xiannv Mountain Roasted Potatoes)", "transport": "Take the scenic area shuttle bus to Xiannv Mountain Visitor Center and walk for about 3 minutes."}, {"address": "Yinxing Avenue Night Market Stall, Xiannv Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Wulong yellow dried tofu is a long-standing traditional soy product known for its firm, elastic texture. Street stalls slice the tofu and grill it on a Teppan hot plate until slightly puffed and golden. It is brushed with a secret chili oil spicy sauce and heartleaf (zherigen) sauce, then topped with crushed peanuts and fresh cilantro. Firm and chewy, the rich soy aroma combines with spicy seasonings to create an explosion of authentic Chongqing flavor.", "name": "Wulong Handmade Grilled Dried Tofu Stall", "transport": "Take the Xiannv Town sightseeing mini-train or bus to Yinxing Avenue Station, then walk for about 2 minutes."}, {"address": "Stall No. 12, Food Street Night Market, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Featuring high-mountain black goat meat from Wulong, cut into generous chunks with a perfect ratio of lean meat to fat, threaded onto bamboo skewers, and grilled over charcoal until sizzling. Finished with cumin, chili powder, and coarse sea salt, the exterior turns lightly charred and crispy while the meat remains surprisingly tender and juicy. Free of any gamey odor, it exudes a natural buttery and charcoal aroma, making it a wildly popular night-time street snack for both tourists and locals.", "name": "Xiannv Town Charcoal-Grilled Mutton Skewers", "transport": "Located in the central commercial district of Xiannv Town, accessible via a 5 to 10-minute walk from major resort hotels."}, {"address": "Snack Area on the Exit Trail of Three Natural Bridges Scenic Area, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | The most popular refreshing dessert to cool down with after hiking through the Three Natural Bridges. Hand-rubbed ice jelly contains natural tiny air bubbles and feels silken smooth, while \u0027Liangxia\u0027 (rice-pulp jelly drops) are shaped like little shrimp with a soft, chewy texture. Served with rich brown sugar syrup, crushed peanuts, sesame seeds, hawthorn flakes, and sweet fermented rice wine, it tastes refreshing and deliciously sweet-and-sour, instantly soothing your fatigue after trekking.", "name": "Three Natural Bridges Exit Handmade Ice Jelly \u0026 Liangxia", "transport": "After exiting the Three Natural Bridges elevator, walk along the trail for about 2 minutes to spot the stall."}, {"address": "Specialty Snack Stall, Pedestrian Street, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Tiaosu (sweet potato crisp) is a classic traditional handmade pastry in Wulong, crafted primarily from high-quality sweet potatoes and fine flour. Freshly deep-fried to an inviting golden crisp, it gives a satisfying crunch with every bite, accompanied by the rich, sweet flavor of roasted sweet potato and sesame. Sweet without being cloying or sticky to your teeth, it is a uniquely local treat perfect for snacking while strolling.", "name": "Wulong Specialty Sweet Potato Crisps Stall", "transport": "Located in the heart of Xiannv Town Pedestrian Street; easily accessible on foot along the commercial street."}, {"address": "Jinke Tianlu Snack Market, Xiannv Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | A traditional delicacy originating from Jiangkou Town in Wulong. The stall turns fresh fish from the Furong River into an ultra-fine paste, hand-shaping and cooking the fish balls fresh to order. Exceptionally soft yet springy, the fish balls are served in a deeply savory broth garnished with pickled mustard greens, wild mountain chilies, and chopped celery. Its tangy and spicy soup is immensely appetizing, offering a delightful local bowl for tourists craving hot soup snacks.", "name": "Jiangkou Fresh Fish Ball Snack Stall", "transport": "Take a local Wulong district bus to Jinke Tianlu Station, then walk for about 3 minutes."}, {"address": "No. 08, Resort Night Market, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Made with fresh, hand-crafted sweet potato noodles cooked to order. The noodles are delightfully chewy and bouncy, soaking up a tangy, spicy broth prepared from rich bone stock, aromatic vinegar, and homemade chili oil. Generously topped with crunchy roasted soybeans, savory minced pork, and pickled long beans, every mouthful delivers an addictive blend of sour, spicy, and savory flavors that keep people coming back for more\u2014a true market staple.", "name": "Shancheng Old Street Chongqing Hot \u0026 Sour Noodles", "transport": "Located inside the central night market of Xiannv Town Resort area; walking is recommended."}, {"address": "Snack Street around Impression Wulong, Xiannv Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | A quick street-side serving of Wulong\u0027s traditional mutton hot pot, served conveniently in individual bowls. Featuring skin-on goat meat and offal slow-simmered for hours, the meat becomes fall-apart tender while the skin retains a bouncy, gelatinous texture. The bright red, spicy broth has a kick without overpowering the natural sweetness of the lamb. Piping hot and deeply warming, it is the ultimate comfort dish at Wulong\u0027s cool night markets.", "name": "Wulong High-Mountain Bowl Mutton Soup Stall", "transport": "After watching the Impression Wulong live show, walk about 5 minutes to the surrounding snack street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Wulong Karst Scenic Area"}};
        const themeHex = "#e11d48";
        const cityName = "Chongqing";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
