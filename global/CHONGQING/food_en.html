ut 4 minutes."}, {"address": "No. 188 Minzu Road, Yuzhong District, Chongqing (Stalls around Jiefangbei Pedestrian Street)", "feature": "\u2b50 4.3 stars | A traditional Chongqing sticky rice dessert freshly made and fried on the spot. Premium sticky rice is steamed and pounded into rice cake dough, sliced, and deep-fried until golden and crispy outside while intensely chewy and gooey inside. Served fresh out of the oil with a drizzle of thick artisanal brown sugar syrup and a generous dusting of fragrant roasted soybean powder. Enjoyed piping hot, it is crispy on the outside, soft on the inside, sweetly aromatic without sticking to teeth, and a wildly popular street sweet on walking streets.", "name": "Qiaqiasu Freshly Baked Brown Sugar Ciba", "transport": "Take Metro Line 2 to Linjiangmen Station (Exit 1), then walk about 3 minutes to the center of Jiefangbei Pedestrian Street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Jiefangbei and Hongyadong"}, "jiulongpo_huangjueping": {"categories": {"cat_1": {"items": [{"address": "No. 5-1, Huangjueping Main Street, Jiulongpo District, Chongqing (Opposite Sichuan Fine Arts Institute, Huangjueping Campus)", "feature": "\u2b50 4.6 Stars | A decades-old staple next to the Sichuan Fine Arts Institute in Huangjueping, this eatery holds fond culinary memories for generations of art students and local neighbors. The signature Pig\u0027s Trotter Soup features trotters simmered until extraordinarily soft and melt-in-your-mouth tender, served in a rich, milky-white broth packed with collagen and a delightful soy aroma. Paired with a bowl of the house-special spicy dipping sauce, the rich, savory flavor of the trotter blends seamlessly with the sauce on your palate\u2014rich without being greasy. This steaming, soul-warming dish is truly unforgettable.", "name": "Huji Trotter Soup (\u80e1\u8a18\u8e44\u82b1\u6e6f)", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 5 minutes."}, {"address": "No. 20, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 Stars | Built in 1987, Jiaotong Teahouse is Huangjueping\u0027s most iconic Old Chongqing time capsule, retaining its original wooden beam structure and weathered brick walls. Here, you can sip classic gaiwan tea and sample traditional local teahouse snacks and vintage Tuocha tea. The fragrant tea has a smooth, lingering sweet finish. Pair it with crispy peanuts and sunflower seeds to experience the slow-paced lifestyle of local Chongqing folk chatting, cracking seeds, and playing Chinese chess. Its authentic, nostalgic atmosphere makes it a beloved spot for tourists.", "name": "Jiaotong Teahouse (\u4ea4\u901a\u8336\u9928)", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 6 minutes."}, {"address": "Near Huangjueping Primary School, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | Tucked deep within an old residential neighborhood in Huangjueping, this famous menu-less traditional eatery is renowned for stir-fries and stews bursting with classic Chongqing flavors. The signature Boiled Fish and Stir-Fried Pork Kidneys are extraordinarily fresh and tender. The kidney slices are meticulously prepared and flash-fried over high heat, imbued with an intense \u0027wok hei\u0027 aroma for a crispy, spicy, and pleasantly numbing bite. Preserving its secret recipe for decades, every bite captures the soul of authentic Chongqing folk cuisine, highly recommended by local foodies.", "name": "Tikan Home Cooking Restaurant (\u68af\u4f83\u5bb6\u5e38\u83dc)", "transport": "Take Bus 223, 233, or 823 to Huangjueping Station, then walk for about 4 minutes."}, {"address": "No. 103, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 Stars | A legendary noodle shop in Huangjueping specializing in traditional Chongqing Xiao Mian and \u0027Cat Noodles\u0027. The noodles are handmade from scratch, offering a delightfully chewy texture. The signature Pea and Minced Pork Noodles (Wanza Mian) feature melt-in-your-mouth simmered peas, savory stir-fried minced pork, and house-made chili oil. Once tossed, every strand is coated in rich sauce, offering a spicy, savory, and multi-layered flavor profile\u2014a top breakfast and lunch choice for locals for decades.", "name": "Goumama Cat Noodles (\u82df\u5abd\u5abd\u8c93\u5152\u9eb5)", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 7 minutes."}, {"address": "No. 12-2, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 Stars | Another renowned traditional trotter soup shop on Huangjueping Old Street, standing shoulder-to-shoulder with Huji. The trotters are carefully selected and simmered over low heat for hours, producing a thick, flavorful milky soup. The pork trotter skin is velvety and the meat falls cleanly off the bone at a gentle pinch of chopsticks. White beans absorb the savory essence of the meat, gaining a creamy, potato-like texture. Paired with a secret spicy black bean sauce, you\u0027ll feel an immediate kick of heat followed by the sweet, savory richness of the trotter.", "name": "Zhangji Trotter Soup (\u7ae0\u8a18\u8e44\u82b1\u6e6f)", "transport": "Take CRT Line 18 to Sichuan Fine Arts Institute Station, then walk for about 4 minutes."}, {"address": "No. 26, Zhigang Avenue, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | Located on Zhigang Avenue in Yangjiaping, this heritage restaurant specializes in Chongqing folk cuisine and is famous for recreating iconic dishes from the Republic of China era. The signature \u0027Yang\u0027s Secret Overlord Rabbit\u0027 and \u0027Republican Braised Pork Belly\u0027 are absolute must-tries. The braised pork has perfectly marbled layers that melt in your mouth with a rich, sweet sauce. The Overlord Rabbit features diced rabbit stir-fried to crispy-tender perfection, buried under a mountain of Sichuan peppercorns and chilies for an intense spicy and numbing experience that reflects the bold flavor profile of traditional Chongqing dining.", "name": "Yang Ji Long Fu (\u694a\u8a18\u9686\u5e9c)", "transport": "Take CRT Line 2 to Yangjiaping Station, then transfer to a bus or walk for about 12 minutes to Zhigang Avenue."}, {"address": "No. 16, Yangjiaping Heng Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 Stars | A long-standing classic Sichuan restaurant near the Yangjiaping Commercial Area, serving authentic Bayu home-style dishes. Highly recommended are the \u0027Fish-Flavored Shredded Pork\u0027 and \u0027Fish with Pickled Mustard Greens\u0027. The shredded pork omits chili bean paste, relying purely on pickled peppers, sugar, and vinegar to create a classic fish-flavor profile that balances sweet, sour, savory, and spicy notes with silky pork strips. The pickled fish soup is appetizingly tangy and spicy, featuring paper-thin, velvety fish fillets. Affordable with generous portions, it is a favorite among locals and visiting food lovers alike.", "name": "Xiyangyang Restaurant (\u559c\u6d0b\u6d0b\u9910\u9928)", "transport": "Take CRT Line 2 to Yangjiaping Station, then walk for about 8 minutes from the exit."}, {"address": "No. 6, Yangjiaping Main Street, Yangjiaping Pedestrian Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | A legendary cooked-food shop in Yangjiaping that has stood the test of time for decades, serving an indispensable staple for local dinner tables. The signature Salted Duck uses premium tender duck prepared through traditional brine curing and gentle simmering. The duck skin is pleasantly chewy, while the meat is succulent and juicy with perfectly balanced saltiness. Free of any gamey odor, it carries subtle hints of aromatic herbal spices\u2014a must-buy traditional takeout treat when visiting Yangjiaping.", "name": "Pangzima Salted Duck (\u80d6\u5b50\u5abd\u9e7d\u6c34\u9d28)", "transport": "Take CRT Line 2 to Yangjiaping Station, then walk for about 3 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 122-1, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | A hipster haven located next to the old Sichuan Fine Arts Institute campus, seamlessly blending an old library with an independent cafe. The air is filled with the rich aroma of pour-over coffee and the distinct scent of aged paper. The signature \u0027Moss Specialty Coffee\u0027 blends matcha, espresso, and velvety milk foam, creating distinct layers with a pleasant bittersweet and refreshing finish. Paired with a freshly toasted banana panini brunch, it is a favorite among art students and hipster travelers.", "name": "Himalaya Bookstore \u0026 Cafe", "transport": "Take Bus 223, 233, or 823 to \u0027Huangjueping Station\u0027, then walk for about 3 minutes."}, {"address": "No. 104, Railway Village, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 Stars | Nestled deep inside the Huangjueping Old Railway Village, this cafe is converted from an old house, exuding nostalgic retro Chongqing old-street vibes. Their pour-over coffee uses medium-dark roast beans with rich black chocolate and nutty aromas, offering a smooth, mellow finish. They also serve traditional Chongqing ice jelly alongside exquisite toast brunch platters. Sipping coffee here as a breeze blows over the train tracks lets you truly experience a peaceful, slow-paced lifestyle.", "name": "Junge Bookstore \u0026 Cafe", "transport": "Take Bus 223 to \u0027Huangjueping Station\u0027, walk through the Sanjiaodao Railway Village for about 10 minutes."}, {"address": "Inside 501 Art Base, No. 126 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | Tucked away inside an art hub converted from a former abandoned warehouse, this space is filled with industrial aesthetics and avant-garde paintings. The popular \u0027Oat Latte\u0027 is silky smooth, perfectly blending milky richness with roasted coffee notes. The \u0027Smoked Salmon Avocado Eggs Benedict\u0027 brunch is a double treat for both sight and taste\u2014slicing open the egg unleashes a golden runny yolk over crispy sourdough, making it a top pick for local artists seeking inspiration or gathering together.", "name": "501 Art Warehouse Cafe", "transport": "Take Bus 823 to \u0027Sichuan Fine Arts Institute Station\u0027, then walk for about 2 minutes."}, {"address": "Youdian Branch Road, Huangjueping Graffiti Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | A botanical, floral-themed cafe right next to Graffiti Street, where lush greenery creates a striking contrast against colorful graffiti walls. The \u0027Roasted Rose Milk Tea Latte\u0027 offers subtle floral notes and a softly sweet milky flavor\u2014gentle, smooth, and immensely popular among young women. The hearty brunch platter includes freshly pan-fried German sausages, scrambled eggs, and freshly baked garlic baguette. Rich in flavor and generous in portion, it\u0027s the perfect spot to relax after exploring Graffiti Street.", "name": "Yeren \u0026 Hua Cafe", "transport": "Take CRT Line 18 to \u0027Sichuan Fine Arts Institute Station\u0027, then walk for about 5 minutes."}, {"address": "No. NL118, MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.8 Stars | A flagship specialty coffee brand located in MixC, Yangjiaping Commercial Area, featuring modern minimalist architecture with abundant natural light. Highly recommended is the Chongqing-exclusive \u0027Sichuan Pepper Sparkling Americano\u0027, which pairs the subtle tingling aroma of local numbing pepper with refreshing sparkling water and single-origin coffee beans\u2014delivering a bold, creative burst of spicy aroma followed by bright acidity. The high-quality brunch menu features fresh sandwiches and American pancakes, favored by professionals and young crowds alike.", "name": "Seesaw Coffee (MixC Yangjiaping Branch)", "transport": "Take CRT Line 2 or Line 10 to \u0027Xiejiawan Station\u0027 and access MixC directly via the underground pedestrian passage."}, {"address": "L1 Floor, MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | A wildly popular brand known for its trendy minimalist vibe, located in the fashion quadrant of MixC Yangjiaping. A must-try signature is the \u0027Fresh Coconut Iced Latte\u0027, poured using pure coconut water combined with rich espresso for a cool, refreshing interplay of sweet coconut and bittersweet coffee. Pair it with their popular \u0027Brown Sugar Croffle\u0027 (croissant waffle)\u2014crispy outside, soft inside, and richly buttery\u2014making for a stylish and delicious brunch combo.", "name": "M Stand Cafe (MixC Yangjiaping)", "transport": "Take CRT Line 2 to \u0027Xiejiawan Station\u0027 (Exit B), then walk for about 4 minutes."}, {"address": "LG Floor, South Zone, MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 Stars | A pioneer of specialty coffee with a rich heritage, this MixC branch boasts a spacious, green outdoor seating area. The signature \u0027Major Dickason\u0027s Dark Roast Latte\u0027 is exceptionally intense and full-bodied, featuring smoky and sweet caramel notes with velvety, lasting foam. For brunch, the \u0027Baked Ham \u0026 Cheese Croissant\u0027 is highly recommended\u2014served piping hot with gooey melted cheese and flaky, layered pastry, attracting coffee connoisseurs who prioritize exceptional quality.", "name": "Peet\u0027s Coffee (MixC Yangjiaping)", "transport": "Take CRT Line 2 to \u0027Xiejiawan Station\u0027, then walk directly to the South Zone of MixC."}, {"address": "Core Area of Graffiti Street, No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | Housed in a repurposed old workshop in the heart of Huangjueping Graffiti Street, this cafe features exterior walls covered in vibrant artistic graffiti. The signature \u0027Osmanthus Oolong Latte\u0027 blends local tea fragrance with smooth espresso, offering an elegant floral-tea aroma and a sweet, smooth finish. The brunch fusion menu features the \u0027Old Street Hot \u0026 Sour Beef Panini\u0027\u2014crispy on the outside with a savory, spicy, and tangy beef filling inside, delivering a unique crossover flavor praised by tourists.", "name": "Graffiti Corner Workshop Cafe", "transport": "Take CRT Line 18 to \u0027Sichuan Fine Arts Institute Station\u0027 (Exit 2), then walk for about 3 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 213 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Located opposite the old Sichuan Fine Arts Institute (SFAI) campus in Huangjueping, this is an iconic time-honored local restaurant in Chongqing. Its signature tofu pudding (Douhua) is silky, smooth, and rich in soybean aroma, paired with a secret spicy dipping sauce and scallion dip that creates a rich, mouthwatering flavor profile. The restaurant also offers classic Sichuan home-cooked stir-fries and local wines. Popular among art faculty, students, and foodies alike, it embodies the pure neighborhood food culture and warm hospitality of old Chongqing.", "name": "Tikan Douhua Restaurant", "transport": "Take CRT Line 18 to Huangjueping Station, then walk about 5 minutes."}, {"address": "No. 5-1 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | A decades-old establishment on Huangjueping Graffiti Street specializing in slow-simmered pig trotter soup and exquisite Sichuan home-style dishes. The trotters are simmered until melt-in-your-mouth tender, resulting in a milky white, rich yet non-greasy soup packed with collagen. Paired with a special red chili oil dipping sauce, spicy and savory flavors blend seamlessly. With its cozy and rustic vibe, it\u0027s an excellent late-night gathering spot for artists and tourists seeking authentic local taste.", "name": "Huji Trotter Soup \u0026 Local Sichuan Cuisine", "transport": "Take CRT Line 18 to Huangjueping Station and walk along Huangjueping Main Street for about 6 minutes."}, {"address": "No. 5 Ruitian Road, Yangjiaping Pedestrian Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | A highly-rated themed bistro inheriting the essence of Republic-era Chongqing Jianghu cuisine and traditional local dishes. The decor blends old Chongqing stilt houses with red brick aesthetics, exuding a strong folk/outlaw vibe. Signature dishes like \u0027Yang\u0027s Overlord Rabbit\u0027 and \u0027Glory Duck\u0027 are spicy, savory, and tender, creating an intense sensory punch from Sichuan pepper and dried chilis. Paired with house-brewed peach blossom or green plum wine, guests feel transported to an ancient martial arts gathering. A must-visit local dining destination for tourists.", "name": "Yang Ji Long Fu Folk Bistro", "transport": "Take CRT Line 2 or Line 18 to Yangjiaping Station, Exit 2, and walk for about 3 minutes."}, {"address": "Building 18, Minzhucun Community, Yangjiaping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Located in the renovated Minzhucun Community in Yangjiaping, this local bistro features a retro-industrial aesthetic housed in an old factory workshop. It combines traditional Chongqing Jianghu cuisine with a modern cozy bistro vibe, featuring signature dishes like \u0027Spicy Chicken\u0027 and \u0027Sour and Spicy Potato Shreds.\u0027 The spicy chicken is crispy outside, tender inside, and bursting with spicy numbing flavors\u2014perfect alongside craft beer or custom Chinese cocktails. It preserves Chongqing\u0027s industrial history while offering a fantastic relaxed atmosphere for dining and drinks.", "name": "Minzhucun Old Factory Jianghu Cuisine Bistro", "transport": "Take CRT Line 2 to Yangjiaping Station and walk about 8 minutes to reach Minzhucun."}, {"address": "No. 26 Yangjiaping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Located in the core of Yangjiaping commercial district, this popular folk bistro is beloved by locals and food enthusiasts alike. Famous for high-heat wok stir-fries, its signature \u0027Mao Xue Wang\u0027 (Spicy Duck Blood Stew) is packed with duck blood, tripe, and spam in a fiery, fragrant red broth. The \u0027Stir-fried Pork Kidneys\u0027 are tender, crisp, and free of gamey odor. Serving a rich variety of local fruit wines and Baijiu, it offers an authentic, down-to-earth Chongqing Jianghu dining and drinking experience.", "name": "Zui Jianghu Folk Bistro", "transport": "Take CRT Line 2 to Yangjiaping Station, Exit 1, and walk for about 4 minutes."}, {"address": "No. 14 Diancecun, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.2 stars | Tucked away in an alley off Huangjueping Graffiti Street, this local home-style eatery has operated for years, renowned for generous portions and authentic flavors. Popular dishes include \u0027Steamed Pork with Rice Powder,\u0027 soft, savory, and rich without being greasy, and \u0027Spicy Intestine and Chicken,\u0027 featuring tender chicken and chewy pork intestines in a fiery sauce. Many visitors touring the art graffiti nearby stop by to savor a cozy, down-to-earth Sichuan home-cooked meal.", "name": "Gou Mama Home-style Sichuan Restaurant", "transport": "Take Bus 223 or 823 to Huangjueping Station, then walk about 3 minutes."}, {"address": "No. 88 Railway 5th Village, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Situated near the Huangjueping Art Zone, this artsy private kitchen bistro is adorned with paintings and crafts by local artists, offering an elegant and cultured ambiance. The menu focuses on refined Chongqing local specialties and house-brewed fruit wines. Signature \u0027Spicy Crab\u0027 features sweet, plump meat with a spicy kick, while the \u0027Green Pepper Fish\u0027 is tender with a rich, smooth numbing flavor. Highly popular among art enthusiasts and hipsters, it seamlessly blends art appreciation with culinary delights.", "name": "Artists\u0027 Village Private Sichuan Bistro", "transport": "Take CRT Line 18 to Sichuan Fine Arts Institute Station and walk for about 10 minutes."}, {"address": "No. 108-15 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | A trendy hybrid bistro on the backstreet of SFAI Huangjueping Campus that fuses youth art creativity with classic Chongqing local dishes. Specialty dishes include \u0027Pickled Fish\u0027 with a zesty, savory broth, as well as signature \u0027Huadiao Drunken Chicken\u0027 and small bamboo-steamed dishes with authentic flavors. By night, it turns into a cozy, atmospheric bistro featuring live music, cocktails, and craft beers\u2014a popular spot for tourists to experience Huangjueping\u0027s youthful, artistic nightlife.", "name": "SFAI Backstreet Bistro \u0026 Sichuan Dishes", "transport": "Take CRT Line 18 to Huangjueping Station, then walk about 7 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Huayan Scenic Area, No. 50 Huayan Village, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 Stars | Located inside the historic Huayan Temple in Jiulongpo District, this vegetarian restaurant is famous for its classic Zen vegetarian dishes and mock meats. The signature \u0027Buddha\u0027s Delight\u0027 (Luohan Zhai) is stewed with a variety of fresh mushrooms and soy products, featuring a rich, savory broth and layered textures. Another favorite is their special \u0027Vegetarian Ribs\u0027\u2014crispy on the outside, tender on the inside\u2014beloved by tourists and local devotees alike.", "name": "Huayan Temple Vegetarian Restaurant", "transport": "Take Metro Line 5 to Huayan Temple Station, Exit 3, and walk for about 8 minutes."}, {"address": "L4, South Zone, MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 Stars | Situated in the Yangjiaping MixC shopping area, this hotpot restaurant specializes in light, oil-free Tibetan tea broth vegetarian hotpot. The piping-hot, tea-infused broth is smooth and naturally sweet. Swirling premium wild mushrooms and handmade plant-based meatballs into the soup renders them chewy and packed with flavor. With its quiet and elegant ambiance, it\u2019s a top pick for health-conscious diners and vegetarian foodies.", "name": "Yiye Yishijie Tibetan Tea Vegetarian Hotpot (Yangjiaping MixC)", "transport": "Take Metro Line 2 or Loop Line to Xiejiawan Station, Exit B, and walk for about 5 minutes."}, {"address": "Next to Graffiti Street, No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | Tucked away in a corner of Huangjueping Graffiti Street, this time-honored eatery is popular among students and faculty from the Sichuan Fine Arts Institute as well as local Chongqing residents. The signature \u0027Vegetarian Tofu Pudding\u0027 is silky smooth and melts in your mouth. Served with a house-special numbing-spicy dipping sauce and cilantro chili oil, it offers a rich, flavorful kick that is immensely satisfying without containing any meat.", "name": "Huangjueping Old Street Vegetarian Tofu Pudding Shop", "transport": "Take Bus 223 or 823 to Huangjueping Main Street Station, then walk for about 2 minutes."}, {"address": "No. 26-12 Yangjiaping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | Located near Yangjiaping Pedestrian Street, this cozy little vegetarian bistro focuses on creative home-style plant-based cuisine. A highly recommended hit is the \u0027Vegetarian Twice-Cooked Pork\u0027 made from specially prepared konjac and premium bean curd skin. Spicy, flavorful, and wonderfully chewy, it perfectly recreates classic Chongqing home cooking, attracting many non-vegetarians to try it out.", "name": "Sansheng Youxing Small Vegetarian Bistro", "transport": "Take Metro Line 2 to Yangjiaping Station, Exit A, and walk for about 6 minutes."}, {"address": "2nd Floor, No. 154 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 Stars | Situated near the Huangjueping campus of the Sichuan Fine Arts Institute, this amazing value-for-money vegetarian buffet offers dozens of stir-fried vegetable dishes, vegan noodles, and cold appetizers. The freshly baked \u0027Vegetarian Sesame Flatbreads\u0027 are delightfully crispy outside and soft inside, pairing perfectly with a steaming bowl of vegan Chongqing Small Noodles\u2014spicy, numbing, and smooth. Highly praised by students and neighborhood locals alike.", "name": "Meixin Vegetarian Buffet (Huangjueping)", "transport": "Take Bus 441 or 823 to Sichuan Fine Arts Institute Station, then walk for about 3 minutes."}, {"address": "L5, Mid Zone, MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.8 Stars | An upscale plant-based restaurant featuring fine, health-conscious dining that merges traditional vegetarian cooking with modern molecular gastronomy concepts. Its signature \u0027Black Truffle Bamboo Fungus Soup\u0027 boasts a clear yet remarkably flavorful broth, with tender, crisp bamboo fungus soaking up every drop. The \u0027Pan-Fried Vegetarian Goose\u0027 has a golden, crispy skin wrapped around a savory, juicy filling\u2014making it a refined dining choice while shopping at MixC.", "name": "Bodhi Vegetarian Health Restaurant", "transport": "Take Metro Line 2 to Xiejiawan Station, Exit A, offering direct access to the MixC shopping mall."}, {"address": "Inside Graffiti Art Park, No. 233 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 Stars | A plant-based lifestyle tearoom combining the artistic vibe of Graffiti Street with Zen tea culture. The must-try \u0027Handmade Vegan Rice Cake\u0027 is delightfully chewy, fragrant, and subtly sweet. Pair it with their exquisite \u0027Vegetarian Spicy Dry Pot\u0027\u2014stir-fried fresh seasonal vegetables and dried tofu with robust spicy and savory seasonings. It\u2019s a popular spot for hipsters and tourists to rest and unwind.", "name": "Luyezhou Vegetarian \u0026 Tea House", "transport": "Take Bus 233 to Huangjueping Station, then walk for about 4 minutes."}, {"address": "No. 19 Qianjin Road (near Yangjiaping Pedestrian Street), Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 Stars | A historic eatery specializing in traditional Chinese vegetarian dim sum and noodles. The signature \u0027Vegan Mushroom Buns\u0027 feature fluffy, bouncy dough filled with savory, juicy diced mushrooms. Their \u0027Vegetarian Steamed Dumplings\u0027 have paper-thin wrappers generously filled with fresh greens and wood ear mushrooms, offering crisp, clean flavors. It\u0027s a favorite classic among locals for daily breakfast or afternoon tea.", "name": "Gongdelin Vegetarian Dim Sum Workshop (Yangjiaping)", "transport": "Take Metro Line 2 to Yangjiaping Station, Exit B, and walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Stall near the main gate of Huangjueping Campus, Sichuan Fine Arts Institute, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Dudu Cake is an ancient traditional steamed rice cake street snack in Chongqing. Made from ground rice slurry and steamed to order in special small wooden buckets, each bite is piping hot, soft, and dense with a subtle natural rice fragrance and sweet sesame undertones. Moderately sweet without sticking to your teeth, this affordable, warm, and chewy treat is a nostalgic walking snack loved by Sichuan Fine Arts Institute students and local residents alike since childhood.", "name": "Huangjueping Traditional Dudu Cake", "transport": "Take Bus 223, 233, or 823 to Huangjueping Station, then walk for about 2 minutes."}, {"address": "Market stall at the middle section of Graffiti Street, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | A highly iconic street snack in Chongqing\u0027s night markets, featuring sweet potato starch wraps (Shao Pi) and thick dried tofu grilled over charcoal until golden and blistered. Chewy and springy on the outside, it is stuffed with pickled green beans, scallions, diced preserved mustard tubers, and secret-recipe minced pork, finished with a generous dusting of special chili and Sichuan pepper powder. Bursting with spicy juice in every bite, its rich layers of flavor and chewy texture make it instantly addictive.", "name": "Huangjueping Roasted Sweet Potato Skin and Dried Tofu", "transport": "Take Bus 233 or 823 to Sichuan Fine Arts Institute Station, then walk for about 3 minutes."}, {"address": "Snack Area in the Underpass of Yangjiaping Pedestrian Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | A classic old-school Chongqing street food perfect for breakfast or an afternoon snack. Warm, freshly steamed glutinous rice is flattened and wrapped around a super crispy fried dough stick (Youtiao), then rolled in sweet soybean powder and fine sugar. Soft, sticky, and sweet on the outside with a golden, crispy center, its sweet-and-savory blend and wonderful aroma make it a must-try local delight for visitors to the Yangjiaping Commercial Area.", "name": "Jiulongpo Handmade Glutinous Rice Roll", "transport": "Take CRT Line 2 to Yangjiaping Station (Exit 2), then walk for about 5 minutes."}, {"address": "122-5 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Ye\u0027erba is a traditional specialty pastry of the Sichuan-Chongqing region. Glutinous rice dough wrapped in fresh green banana leaves is steamed to perfection, resulting in a delightfully soft, springy texture infused with a subtle botanical leaf aroma. Available with savory minced pork or sweet red bean paste fillings, the savory version releases savory juices into the skin when steamed, creating a rich yet non-greasy bite. It is a wildly popular grab-and-go snack near Graffiti Street.", "name": "Dengji Ye\u0027erba Rice Cake", "transport": "Take Bus 223 to Huangjueping Main Street Station, then walk for about 1 minute."}, {"address": "Tuanjie Road Snack Street, Yangjiaping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Potatoes are cut into zigzag crinkle waves (named \u0027Wolf Tooth Potatoes\u0027 after their shape) and deep-fried in hot oil until lightly crispy on the outside while remaining fluffy inside. They are then tossed in a large bowl with signature chili oil, Sichuan pepper oil, chopped fish mint, scallions, and minced garlic. Spicy, tangy, and tongue-numbing, these flavorful potatoes are irresistible bite after bite\u2014a hit street snack in the Yangjiaping Commercial Area.", "name": "Yangjiaping Deep-Fried Wave-Cut Potatoes", "transport": "Take CRT Line 2 to Yangjiaping Station (Exit 1), then walk for about 300 meters."}, {"address": "Huangjueping Main Street (Street stall diagonally opposite Jiaotong Tea House), Jiulongpo District, Chongqing", "feature": "\u2b50 4.8 stars | In a city dominated by spicy street snacks, chilled iced tangyuan is the ultimate spicy food relief. Warmly freshly cooked mini glutinous rice balls are chilled on ice, making them incredibly chewy and smooth. Served with rich brown sugar syrup slow-simmered using traditional methods, fine crushed ice, toasted white sesame seeds, and sweet fermented rice wine (Laozao), every spoonful is cool, refreshing, and deeply satisfying\u2014a favorite among Sichuan Fine Arts Institute students and tourists alike.", "name": "Huangjueping Handmade Ice Tangyuan", "transport": "Take Bus 223 or 233 to Huangjueping Station, then walk for about 100 meters."}, {"address": "Corner Market Stall, Graffiti Street, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | The ultimate delicacy of Chongqing street markets. Fresh pig brain is placed in a custom foil bowl with rich broth, secret red chili oil, Sichuan peppercorns, fermented black beans, and fish mint, then slow-roasted over charcoal. Once cooked, it melts in your mouth with a silky texture akin to tender tofu, fully absorbing the bold, spicy sauce without any gamey odor. Numbing, spicy, and savory, it is a signature street dish at Huangjueping\u0027s night market.", "name": "Graffiti Street Roasted Pig Brain", "transport": "Take Bus 823 to Huangjueping Station, then walk for about 200 meters."}, {"address": "Street Stall at the entrance of Zhigang Avenue, Yangjiaping Pedestrian Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Made from natural Nicandra seeds rubbed by hand to form a translucent jelly, this refreshing treat is even smoother, juicier, and melt-in-your-mouth soft than ordinary jelly noodles. Drizzled with thick, traditional pure brown sugar syrup and topped with crunchy crushed peanuts and hawthorn flakes, it is sweet, refreshing, and smooth\u2014a classic nostalgic dessert perfect to sip on while shopping.", "name": "Yangjiaping Traditional Brown Sugar Jelly", "transport": "Take CRT Line 2 to Yangjiaping Station, then walk for about 400 meters."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Yangjiaping and Huangjueping"}, "nanbin_nanshan": {"categories": {"cat_1": {"items": [{"address": "Jinzhu Village, Huangjiaoban Town, Nanan District, Chongqing", "feature": "\u2b50 4.7 stars | Perched across an entire hillside on Nanshan, this massive \u0027hotpot mountain\u0027 is one of Chongqing\u0027s most spectacular and iconic traditional hotpot destinations. The spicy broth base is slow-cooked with pure beef tallow and a blend of local Sichuan peppercorns and chilies, resulting in a vibrant red, rich, aromatic, and fiery soup. Their signature tripe is exceptionally crisp\u2014swished in the pot for just eight seconds and dipped in sesame oil and minced garlic, it offers a juicy, delightfully chewy burst of flavor. The tender beef is deeply seasoned, spreading spicy warmth across your palate. Tourists are captivated by the dazzling night views cascading down the mountain, while locals adore its decades-unchanged, robust spicy flavors and lively, bustling atmosphere.", "name": "Pipaguan Hotpot", "transport": "Taking a taxi or ride-hailing service directly to Nanshan Pipaguyan Hotpot is recommended."}, {"address": "No. 15 Huangming Road, Huangjiaoban Town, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Located on Nanshan, this garden-style hotpot restaurant surrounds a picturesque lotus pond, infusing Chongqing\u2019s time-honored hotpot tradition with the tranquil elegance of Jiangnan water towns. Hand-stirred using traditional methods, the soup base is spicy without being overpowering and offers a lingering fragrance. The classic duck intestines are tender and bouncy, crisping up after a quick swish to unleash a burst of savory beef tallow flavor. Handcrafted mushroom meatballs absorb the spicy broth, yielding a soft exterior with a firm, savory center. Locals love bringing visiting friends here to enjoy the elegant setting and authentic Chongqing taste, while tourists adore the visual and culinary feast of enjoying boiling hotpot by the tranquil lotus pond.", "name": "Xianlongjing Ecological Hotpot", "transport": "Take Bus 384 to Huangjiaoban Station and walk for about 10 minutes, or take a taxi."}, {"address": "Spring Water Chicken Street, Huangjiaoban Town, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | A classic establishment with decades of history on Nanshan Spring Water Chicken Street, specializing in \u0027Spring Water Chicken\u0027, a celebrated Chongqing Jianghu dish. High-quality free-range chickens are cooked with natural mountain spring water and flash-fried over high heat with abundant Sichuan peppercorns and signature chili sauce. The chicken skin is crisp and fragrant, while the tender yet firm meat absorbs the rich, spicy broth, bursting with juicy flavor and a subtle sweetness from the spring water. The three-course meal includes tender, crisp stir-fried chicken offal and a silky, savory chicken blood soup. It is a top choice for local gatherings, and tourists flock here to experience this unique spring-water culinary craft.", "name": "Zhoulou Spring Water Chicken", "transport": "Take Bus 384 to Huangjiaoban Ancient Town Station and walk for about 3 minutes."}, {"address": "No. 88 Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Standing along the banks of the Yangtze River on Nanbin Road, this iconic restaurant is a major landmark for authentic Sichuan and Jianghu cuisine in Chongqing. Its signature dish, \u0027Taoran Taro Chicken,\u0027 slow-simmers tender chicken with smooth, melt-in-your-mouth taro, which completely absorbs the rich, spicy pan juices. Another hit, \u0027Taoran Giant Snails,\u0027 offers firm, snappy snail meat packed with a fiery punch. The stunning riverfront view allows tourists to enjoy breathtaking million-dollar nightscapes of the Yuzhong Peninsula while savoring exquisite local dishes, while locals consider it a guaranteed mark of quality for business banquets and family reunions.", "name": "Taoranju Restaurant Nanbin Branch", "transport": "Take CRT Line 3 to Gongmao Station, then transfer to Bus 372 or 375 and get off at Nanbin Road Section."}, {"address": "No. 6 First Avenue, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.7 stars | An outstanding representative of authentic, traditional Sichuan cuisine, this Nanbin Road branch sits right next to the Yangtze River, offering spectacular views alongside top-tier culinary craftsmanship. The signature \u0027Boiled Fish in Chili Oil\u0027 features paper-thin slices of fresh live fish sizzled with scalding oil over Sichuan peppercorns and chilies; the fish is impossibly tender and melts in your mouth with a deeply aromatic, non-harsh spice. The \u0027Boiled Beef\u0027 is equally velvety and bursting with complex spicy layers. Local gourmets praise their masterful technique, while tourists love the elegant riverside ambience and refined classic flavors.", "name": "Yuxin Sichuan Cuisine Nanbin Branch", "transport": "Take CRT Line 3 to Gongmao Station, followed by a 5-minute taxi ride."}, {"address": "No. 88 Xinglongwan, Nanshan Street, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Tucked away in the old streets of Nanshan, this classic hotpot shop represents the \u0027Land Route\u0027 (Lupai) style, preserving the rawest mountain-city hotpot heritage. Unlike the \u0027Water Route\u0027 style, Land Route hotpot emphasizes a heavy, deeply fragrant beef tallow base balanced perfectly with aromatic spices. The signature \u0027Dual-Chili Beef\u0027 is marinated in secret seasonings, cooking into tender, juicy bites that release an explosion of fresh chili and peppercorn heat. The \u0027Aged Pork Slices\u0027 stay remarkably tender even after prolonged boiling, absorbing intense savory and spicy notes. Locals adore its unapologetically pure traditional heat, while tourists are captivated by the authentic, lively street-life atmosphere inside a charming mountain courtyard.", "name": "Badaoguan Land Route Hotpot", "transport": "A direct taxi ride to Nanshan Badaoguan Hotpot is recommended, or take Bus 384 to Nanshan Station and walk."}, {"address": "Changjiang Xincun (near Nanbin Road), Nanan District, Chongqing", "feature": "\u2b50 4.4 stars | A nostalgic venue serving famous \u0027Jianghu\u0027 (outlaw/rustic style) cuisine near Nanbin Road in Nanan District, soaked in traditional dock culture and martial arts lore. The signature \u0027Spicy Chicken\u0027 (Lazi Ji) features small bits of fried free-range chicken buried in a sea of vibrant red dried chilies and peppercorns\u2014crispy, savory, numbing, and addictively delicious. The \u0027Pork Liver with Pickled Peppers\u0027 showcases exquisite heat control, producing velvety-smooth, tangy, and appetizing liver slices. Tourists can immerse themselves in the bold, hearty spirit of Chongqing\u0027s culinary culture, while old Chongqing locals gather here for the most down-to-earth classic comfort food.", "name": "Fan Jiang Hu Restaurant", "transport": "Take CRT Line 6 to Shangxinjie Station and walk for about 10 minutes."}, {"address": "Next to Nanshan Botanical Garden, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Nestled in the Nanshan Scenic Area, this traditional garden-style heritage restaurant combines the natural beauty of Nanshan with fine classic Sichuan dishes. Its \u0027Nanshan Camphor Tea Duck\u0027 is crafted using traditional smoking techniques, featuring crispy golden skin, tender meat, and a subtle aroma of camphor wood and tea leaves that leaves a lingering savory sweetness. The \u0027Spring Water Tofu\u0027 is silky smooth and melts in your mouth, carrying the pure fragrance of soybeans and sweet mountain spring water. Tourists love the relaxing dining experience in lush garden surroundings, while locals frequently bring elders here for refined, authentic classic Sichuan cooking.", "name": "Yinyue Garden Restaurant", "transport": "Take Bus 384 to Nanshan Botanical Garden Station and walk for about 5 minutes."}], "name": "Iconic Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "Perimeter of Hall D, Phase 2, Oriental 1891, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.7 Stars | A minimalist cafe boasting a prime scenic location on Nanbin Road, serving quality single-origin pour-over coffee and exquisite all-day brunch. The signature Eggs Benedict with special Hollandaise sauce features perfectly runny yolks and a silky texture. The avocado sourdough toast is a healthy and delicious favorite, spread with rich avocado mash and sprinkled with crushed pink peppercorns for a crispy, soft, and flavorful bite. Sitting on the outdoor terrace offers panoramic views of the grand confluence of the Yangtze River and Yuzhong Peninsula, making it immensely popular among youth and tourists.", "name": "Pury Coffee \u0026 Brunch", "transport": "Take Metro Line 6 to Haitangxi Station, then walk for about 15 minutes."}, {"address": "Courtyard 9, Longmenhao Old Street, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 Stars | Tucked inside a heritage building in the Longmenhao Historic Cultural District along Nanbin Road, this cafe preserves vintage gray bricks and rustic ruin aesthetics, seamlessly blending history with modern coffee culture. The signature \u0027Chongqing Spicy Coffee\u0027 pairs subtle Sichuan pepper aroma with espresso, starting bitter, turning sweet, and leaving a mild numbing sensation\u2014a truly surprising flavor journey. Enjoy freshly baked English scones with blueberry jam on the open-air terrace while watching the Yangtze River Cableway pass over the river. A quintessential local check-in spot.", "name": "Ruins Coffee at Longmenhao Old Street", "transport": "Take Metro Line 6 to Shangxinjie Station (Exit 2), then walk for about 8 minutes."}, {"address": "Inside Chongqing Open Port Heritage Park, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.8 Stars | Situated inside the Open Port Heritage Park halfway up Nanshan Mountain, this cafe offers an unobstructed 270-degree panoramic river view alongside the Dongshuimen Bridge. Its highlights include Classic American Big Breakfasts and signature fruit sparkling coffees. The black coffee is rich and perfectly balanced in bitterness and sweetness, while the brunch platter comes generous with crispy German sausages, thick-cut bacon, fluffy scrambled eggs, and freshly baked European bread. Whether enjoying the river scenery by day or the glittering skyline at night, it\u0027s an unforgettable experience.", "name": "Chongqing Open Port Heritage Park Cafe", "transport": "Take Metro Line 6 to Shangxinjie Station, transfer to Bus 304 to Longmenhao Station, then walk up the hill."}, {"address": "Near the intersection of Chongwen Road and Fangniu Village, Nanshan Subdistrict, Nanan District, Chongqing", "feature": "\u2b50 4.5 Stars | Hidden deep in the lush forests of Nanshan, this Japanese-style wooden cafe is surrounded by greenery, offering a healing and serene atmosphere. It specializes in self-roasted single-origin pour-over coffee featuring rich floral and fruity notes, alongside handmade Basque cheesecake. The brunch platter serves freshly made French toast with German sausage\u2014egg-soaked toast seared golden and sweet, delightfully balanced by savory sausages. Highly favored by visitors seeking escape from city bustle.", "name": "Nanshan Youshan Mountain Cafe", "transport": "Driving or taking a taxi is recommended, or take Bus 384 to Nanshan Botanical Garden Station and walk for 15 minutes."}, {"address": "1F Yuan Art Museum, Atrium of Oriental 1891, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 Stars | An artsy cafe located inside Yuan Art Museum on Nanbin Road, seamlessly integrating contemporary art exhibitions with specialty coffee. The signature Dirty coffee uses high-quality espresso poured over chilled milk, offering a rich contrast of temperatures and deep coffee-and-milk flavors. Brunch features smoked salmon croissants and fresh smoothies; the croissant is exceptionally flaky and buttery, perfectly pairing with savory smoked salmon. Sitting by the floor-to-ceiling riverside windows, guests can enjoy art and scenic river views simultaneously.", "name": "Yuan Art Museum C-Store Cafe", "transport": "Take Metro Line 6 to Haitangxi Station, then walk for about 12 minutes."}, {"address": "Inside Valley No. 3, Houshan Road, Nanshan Subdistrict, Nanan District, Chongqing", "feature": "\u2b50 4.7 Stars | A camping-themed cafe halfway up Nanshan Mountain featuring a sprawling lawn and outdoor canopy tents that create a relaxed holiday vibe. The signature \u0027Valley Beef Burger\u0027 features juicy handmade beef patties served with special American sauce and crispy fries\u2014a huge brunch favorite. For coffee, the Osmanthus Latte comes highly recommended, weaving gentle floral notes with creamy milk. On clear days, you can take in distant views of the Chongqing skyline, making it a perfect spot to unwind.", "name": "Valley No. 3 Cafe \u0026 Brunch", "transport": "Taking a taxi directly is recommended, or take Bus 384 to Chongwen Road Station and transfer to a local shuttle."}, {"address": "Next to the lower station of the Yangtze River Cableway, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 Stars | An industrial-chic cafe located right by the river along Nanbin Road, commanding stunning views of the two rivers converging at the Yuzhong Peninsula. The shop features light-to-medium roasted single-origin beans, serving crisp pour-overs with charming fruity acidity. The brunch platter is abundant, featuring freshly cooked souffl\u00e9 pancakes, smoked bacon, and creamy cheddar scrambled eggs. The souffl\u00e9 pancakes are cloud-like and melt in your mouth, making it extremely popular among young women and influencers.", "name": "Riverside Gather Cafe", "transport": "Take Metro Line 6 or Loop Line to Shangxinjie Station, then walk for about 10 minutes."}, {"address": "Fangniu Village Section, near Nanshan Botanical Garden, Nanan District, Chongqing", "feature": "\u2b50 4.5 Stars | A garden-style cafe near the Nanshan Botanical Garden, surrounded by flowers and trees like a secret garden. The signature Specialty Oat Latte is silky smooth with subtle nutty undertones. The brunch is best known for its handmade sourdough toast topped with truffle scrambled eggs\u2014rich, alluring truffle aromas paired with silky eggs and crispy sourdough deliver pure satisfaction. Sitting under the garden shade enjoying a gentle breeze and delicious food makes this a dream spot for tourists experiencing Nanshan\u0027s slow-paced life.", "name": "Yinshan Tree Time Cafe", "transport": "Take Bus 384 directly to Nanshan Botanical Garden Station, then walk for about 5 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 183 Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 Stars | Located in a prime viewing location on Nanbin Road, blending refined traditional Sichuan cuisine with modern mixology. Signature dishes include \u0027Mao Xue Wang\u0027 (Spicy Duck Blood \u0026 Offal Stew)\u2014where the duck blood is smooth and tender with a rich, non-harsh spice\u2014and \u0027Garlic Pork Slices\u0027 cut paper-thin to melt in your mouth. Popular among tourists and local youth, it offers a pleasant, tipsy atmosphere to savor rich, multi-layered Sichuan classics while overlooking the brilliant night views of the Yuzhong Peninsula.", "name": "Sunshine Town Riverfront Bistro \u0026 Sichuan Cuisine", "transport": "Take MRT Line 3 to Gongmao Station, transfer to Bus 375 to Nanbin Road Station, then walk for about 5 minutes."}, {"address": "No. 1 Huangjiao\u0027ang, Nanshan Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 Stars | A classic local restaurant in the Nanshan Scenic Area specializing in Chongqing\u0027s iconic local dish, \u0027Spring Water Chicken\u0027. Prepared using high-quality Nanshan mountain spring water and freshly slaughtered chicken, the meat has crispy skin, tender, juicy meat, and a fragrant pot of spicy red oil with a subtle sweetness from the spring water. Served alongside duck blood soup and stir-fried chicken giblets for a three-course feast, it is rich in flavor and generous in portion\u2014a must-try authentic taste after a hike.", "name": "Old Nanshan Spring Water Chicken Restaurant", "transport": "Take Bus 384 to Nanshan Station and walk about 300 meters."}, {"address": "Inside Longmenhao Old Street, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 Stars | Perched above Longmenhao Old Street on Nanbin Road, featuring fusion Sichuan cuisine and a stylish rooftop bar. Signature dishes include \u0027Black Truffle Roast Duck\u0027 with crispy skin, juicy meat, and rich truffle aroma, as well as \u0027Green Peppercorn Black Pork\u0027 known for its bold numbing aroma and tender texture. Guests can enjoy fine craft beer and creative cocktails while taking in spectacular night views of the two rivers converging\u2014a premier choice for business dinners and romantic dates.", "name": "Yijing Siji Riverview Restaurant \u0026 Bistro", "transport": "Take MRT Line 6 or Loop Line to Shangxinjie Station, Exit 2, and walk for about 10 minutes."}, {"address": "Jinzhu Village, Nanshan Street, Huangming Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.8 Stars | A hilltop scenic restaurant complex built across an entire mountain, renowned as one of the world\u0027s largest hot pot and local dining villas. Besides classic Chongqing spicy hot pot, its local stir-fries and freshly fried \u0027Crispy Pork\u0027 (Surou) are famous for being crispy outside, tender inside, and packed with Sichuan peppercorn aroma. Lit up brightly at night like the palace in Spirited Away, strolling along bamboo paths while savoring bold, numbing flavors is an unforgettable experience.", "name": "Pipayuan Shisheng Villa Hotpot \u0026 Local Dishes", "transport": "Recommended to drive or take a ride-hailing service; or take Bus 384 to Jinzhucun Station."}, {"address": "Hall B, Dongyuan 1891, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.4 Stars | A retro Chinese chic-style skewered hot pot bistro seamlessly combining traditional Chongqing street skewers (Chuan Chuan) with stylish iced desserts and cocktails. The signature feature is multi-flavored \u0027Zhangzhongbao\u0027 (chicken knee cartilage), marinated in secret sauce, delightfully crunchy and spicy when cooked. Paired with refreshing iced jelly (Bingfen) and craft rice wine, it is very popular among youth and tourists for its vibrant, nostalgic-meets-modern atmosphere.", "name": "Jiujie Shufen Changzhongbao Chuan Chuan \u0026 Bistro", "transport": "Take Bus 375 or 338 to Haitangxi Station, then walk for about 3 minutes."}, {"address": "No. 16 Caofangwan, Huangjiao\u0027ang, Huangming Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 Stars | An eco-friendly Nanshan restaurant designed in the style of Jiangnan classical gardens, complete with lotus ponds, small bridges, and flowing water. Beyond top-quality beef tripe and goose intestines, its local specialties include \u0027Longjing Crispy Pigeon\u0027 with crispy skin and juicy meat, and \u0027Freshly Ground Tofu Pudding\u0027 (Douhua) featuring a creamy texture and rich soybean fragrance. Evening traditional Sichuan Opera face-changing performances allow guests to enjoy authentic spicy flavors and fine spirits in a serene garden setting.", "name": "Xianlongjing Eco-Restaurant \u0026 Bistro", "transport": "Take Bus 384 to Huangjiao\u0027ang Station, then walk for about 8 minutes."}, {"address": "No. 1 Mishi Street, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 Stars | An elegant Sichuan bistro set within a heritage Western building complex along Nanbin Road. Classic dishes include \u0027Geleshan Spicy Chicken\u0027 with crispy, tender chicken pieces hidden among aromatic red chilies, and \u0027Fish with Pickled Mustard Greens\u0027 (Suancai Yu) featuring paper-thin, silky fish in a zesty, mouthwatering broth. House-brewed sweet osmanthus rice wine and peach blossom wine offer smooth, gentle flavors. Accompanied by river breezes, it\u0027s a fantastic spot to experience Chongqing\u0027s nightlife and local cuisine.", "name": "Xunchang Gushi Riverview Sichuan Bistro", "transport": "Take MRT Line 6 to Shangxinjie Station, then walk for about 12 minutes to Mishi Street Historic District."}, {"address": "Next to Yangtze Club Contemporary Art Center, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 Stars | An upscale restaurant pairing high-end modern Sichuan cuisine with a single malt whisky bar. Signature dishes include \u0027Kung Pao Lobster\u0027, blending traditional sweet-and-savory Kung Pao flavors with fresh, succulent lobster, and \u0027Shadow Beef\u0027 (Dengying Beef), sliced paper-thin, crispy, and aromatic. Panoramic floor-to-ceiling windows face the Yangtze River and Chaotianmen Pier, offering an incredibly stylish nighttime atmosphere perfect for foodies seeking the ultimate visual and culinary experience.", "name": "Yangtze Club Fine Cuisine \u0026 Whisky Bistro", "transport": "Take Bus 338 or 375 to Longmenhao Station, then walk for about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Tushan Temple, Nanshan Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Located inside Nanshan\u0027s Tushan Temple, this traditional temple vegetarian restaurant focuses on fresh wild mountain vegetables and handmade soy products. The signature \u0027Handmade Tofu Pudding\u0027 is velvety smooth with a rich, pure soy aroma, paired with a custom aromatic Sichuan dipping sauce. The \u0027Vegetarian Spring Rolls\u0027, crispy on the outside with a savory-sweet filling, are immensely popular and a must-try for hikers and locals seeking spiritual and culinary refreshment.", "name": "Tushan Temple Vegetarian Restaurant", "transport": "Take Bus 384 to \u0027Tushan Temple Station\u0027, then walk for about 3 minutes."}, {"address": "Inside Laojun Cave Scenic Area, No. 1 Liaocaogou, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Nestled inside the Laojun Cave Taoist Temple on Nanshan, this restaurant offers an elegant and peaceful setting. The specialty \u0027Vegetarian Twice-Cooked Pork\u0027 cleverly uses lion\u0027s mane mushrooms and konjac to create a soft, chewy texture packed with savory sauce flavors. Perfectly capturing the soul of Sichuan cuisine, it is pleasantly spicy and non-greasy, delighting countless visiting tourists.", "name": "Laojun Cave Vegetarian Restaurant", "transport": "Take Bus 346 to \u0027Laojun Cave Station\u0027, then walk uphill along the trail for about 10 minutes."}, {"address": "4F, Changjiahui Shopping Park, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 stars | Featuring a nourishing Tibetan tea broth, this healthy vegetarian hot pot offers a smooth, sweet-aftertaste soup with a fragrant aroma. Fresh wild mushrooms cooked in the simmering tea broth become tender, juicy, and infused with tea flavor. Paired with custom sesame sauce or scented oil dip, it\u0027s a guilt-free delicious meal and a highly popular high-quality vegetarian option in the Nanbin Road commercial area.", "name": "Yiye Yishijie Tibetan Tea Vegetarian Hot Pot", "transport": "Take CRT Line 11 to \u0027Danzishi Station\u0027, then walk for about 10 minutes."}, {"address": "Fangniu Village, next to Nanshan Botanical Garden, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.8 stars | Tucked deep within the bamboo groves of Nanshan, this upscale Zen-inspired vegetarian restaurant specializes in exquisite omakase-style menus. The signature \u0027Roasted Fresh Bamboo Shoots with Black Truffle\u0027 uses seasonal Nanshan shoots that are crisp, tender, and sweet, bursting with the rich aroma of black truffle for a deeply layered flavor beloved by discerning foodies.", "name": "Yipiao Vegetarian Restaurant Nanshan", "transport": "Recommended to take a taxi or drive toward \u0027Fangniu Village near Nanshan Botanical Garden\u0027."}, {"address": "No. 1 Yanyu Road (next to Nanbin Road Sports Park), Nan\u0027an District, Chongqing", "feature": "\u2b50 4.4 stars | A serene vegetarian eatery near Nanbin Road combining traditional Sichuan culinary techniques. The specialty \u0027Boiled Vegetarian Fish in Spicy Broth\u0027 is crafted from premium tofu skin and yam, yielding a delicate and smooth texture. Soaked in a numbingly spicy red oil broth, it delivers rich spicy flavors that thrill the tastebuds while staying healthy and light.", "name": "Juepin Zen Vegetarian Cuisine", "transport": "Take Bus 372 to \u0027Haitangxi Station\u0027, then walk for about 6 minutes."}, {"address": "No. 168 Nanshan Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.3 stars | A unique venue combining mountain tea tasting on Nanshan with creative vegetarian dishes. The popular snack \u0027Grilled Vegetarian Gluten\u0027 features a lightly charred, crispy exterior; biting into it releases a burst of sweet-and-savory juice with a springy, satisfying chew. Paired with a cup of high-mountain misty green tea, it\u0027s refreshing and poetic\u2014a hidden gem favored by young people.", "name": "Suyu Tea \u0026 Vegetarian Space", "transport": "Take Bus 384 to \u0027Chongwen Road Station\u0027, then walk for about 5 minutes."}, {"address": "No. 52 Nanshan Back Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.2 stars | A cozy, welcoming vegetarian eatery near the Nanshan Scenic Area, specializing in wild mushroom soups and vegetable stir-fries. The \u0027Nourishing Wild Mushroom Pot\u0027 boasts a rich, sweet broth with smooth yet crunchy mushrooms; packed with natural goodness, it leaves guests craving bowl after bowl\u2014a heartwarming choice to recharge after exploring Nanshan.", "name": "Cizhuju Vegetarian Health Restaurant", "transport": "Take Bus 347 to \u0027Nanshan Station\u0027, then walk for about 4 minutes."}, {"address": "2F, Hall B, Dongyuan 1891 Shopping Mall, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.1 stars | A modern creative vegetarian restaurant located in the trendy Nanbin Road shopping district. The \u0027Pan-Seared Nut Steak\u0027 comes highly recommended; made from pressed mixed nuts and beans, it is pan-fried to golden crispy perfection with a rich, hearty nutty center that easily rivals real meat, making it a hit with youngsters and plant-based diners.", "name": "Green Wilderness Vegetarian Cafe", "transport": "Take Bus 872 to \u0027Nanbin Road Haitangxi Station\u0027, then walk for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near No. 95 Danzishi Main Street, Nanan District, Chongqing", "feature": "\u2b50 4.5 Stars | Ye\u0027erba is an iconic traditional Chongqing street food steamed in fresh banana leaves, emitting a subtle herbal aroma. The outer glutinous rice skin is chewy, soft, and non-sticky. It comes in two filling varieties: savory minced pork with preserved mustard greens, or sweet red bean paste with sesame. Dense and tender on the outside with juicy, flavorful fillings, this sweet-and-savory treat is loved by locals and tourists alike\u2014perfect for grabbing a bite while strolling along Nanbin Road.", "name": "Deng\u0027s Ye\u0027erba Sticky Rice Cake (Dengji Ye\u0027erba)", "transport": "Take the Loop Line subway to Danzishi Station, Exit 2, and walk for about 8 minutes."}, {"address": "Night Market Stalls at Haitang Yanyu Park, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 Stars | A hugely popular stroll-and-eat dessert at the Nanbin Road riverside night market. Hand-rubbed from natural seeds, this crystal-clear ice jelly melts in your mouth with a silky, refreshing texture. Vendors drizzle it with thick, traditional brown sugar syrup and top it with aromatic rose jam, crushed peanuts, hawthorn flakes, and mini chewy rice balls. It instantly cuts through Chongqing\u0027s summer heat and lingering spiciness, offering rich layers of texture\u2014the ultimate sweet companion for taking in the Yuzhong night views.", "name": "Nanbin Night Market Handmade Rose Ice Jelly", "transport": "Take Subway Line 3 to Gongmao Station, then transfer to Bus 375 and get off at Haitang Yanyu Park Station."}, {"address": "Chongwen Road, Nanshan Street, Nanan District, Chongqing (Near East Gate of Chongqing University of Posts and Telecommunications)", "feature": "\u2b50 4.4 Stars | Located near the Nanshan Scenic Area, this specialty stall roasts custom sweet potato starch skins over charcoal until blistered and crispy on the outside, while remaining stretchy and chewy inside. Brushed with a secret spicy red oil sauce, it is stuffed with chopped green onions, pickled tubers, and fish mint (Houttuynia cordata). Crispy outside and soft inside with a fragrant spice kick, every bite delivers an addictive, authentic Sichuan-Chongqing street food flavor\u2014an absolute must-try when visiting Nanshan.", "name": "Nanshan Roasted Sweet Potato Peel \u0026 Tofu Sheet", "transport": "Take Bus 346 or 347 to Chongqing University of Posts and Telecommunications Station, then walk for about 3 minutes."}, {"address": "Inside Danzishi Old Street, Danzishi Changjiahui, No. 69 Taichang Road, Nanan District, Chongqing", "feature": "\u2b50 4.3 Stars | Located on Danzishi Old Street, this food stall draws crowds with live demonstrations of pounding sticky rice using traditional wooden mortars. Freshly steamed glutinous rice is pounded until springy and resilient, shaped into hot little balls, coated in roasted soybean powder, and drenched in warm, thick dark brown sugar syrup. Warm, chewy, and impossibly smooth, the nuttiness of the soybean powder blends effortlessly with the rich brown sugar\u2014delivering a simple, comforting happiness in every bite.", "name": "Danzishi Old Street Handmade Ciba", "transport": "Take the Loop Line subway to Danzishi Station, Exit 3, and walk for about 10 minutes to reach the Old Street."}, {"address": "Haitangxi New Street Night Market Area, Nanan District, Chongqing", "feature": "\u2b50 4.5 Stars | Freshly fried crispy pork is one of the iconic soul foods of Chongqing street culture. Premium pork belly strips are marinated with Hanyuan Sichuan peppercorns, coated in a sweet potato starch and egg batter, then deep-fried to a golden crisp. Piping hot out of the fryer, the skin is shatteringly crispy, releasing rich savory juices followed by a signature numbing pepper kick that keeps you coming back for more. Eating it off a bamboo skewer as you stroll is a quintessential night market experience.", "name": "Haitangxi Night Market Crispy Fried Pork", "transport": "Take the Loop Line subway to Haitangxi Station, Exit 2, and walk for about 5 minutes."}, {"address": "No. 1 Yanyu Road, Nanbin Road, Nanan District, Chongqing (Near Haitang Yanyu Park)", "feature": "\u2b50 4.7 Stars | Although operating as a storefront, its food stall radiates authentic street night market charm. Fresh pig brains are set in tin foil boxes with rich broth, secret red chili oil, fermented black beans, and minced garlic, then simmered slowly over charcoal until fully infused with flavor. Delicately creamy and melt-in-your-mouth tender like warm tofu, it soaks up the spicy, savory broth with zero gamey odor\u2014a highly sought-after delicacy for adventurous foodies.", "name": "Jiucun Roasted Pig Brain (Nanbin Branch)", "transport": "Take Bus 375 or 338 to Haitang Yanyu Park Station, then walk for about 2 minutes."}, {"address": "Longmenhao Old Street Historical \u0026 Cultural District, No. 105 Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.2 Stars | Chongchong Cake is a traditional steamed rice cake packed with nostalgia for generations of Chongqing locals. A finely ground mixture of indica and glutinous rice flour is packed into small custom wooden steamers and instantly steamed with high-pressure steam. Drizzled with brown sugar syrup and sprinkled with sesame seeds and chopped walnuts, the soft, tender cake offers a pure rice aroma and gentle sweetness. Moist and fluffy, it exudes a charming old-school nostalgia that captivates hipsters and tourists visiting Longmenhao Old Street.", "name": "Longmenhao Old Street Chongchong Cake", "transport": "Take Subway Line 6 or the Loop Line to Shangxinjie Station, Exit 2, and walk for about 5 minutes."}, {"address": "Nanshan Botanical Garden Road, Nanshan Street, Nanan District, Chongqing (Near Nanshan Yikeshu/One Tree Lookout entrance)", "feature": "\u2b50 4.6 Stars | A hugely popular street treat around the Nanshan Tree Lookout. Premium rabbit is marinated with over ten spices and roasted repeatedly over fruitwood charcoal until the skin becomes golden and crisp. The roasted meat is shredded by hand on the spot and tossed with special spicy chili oil, toasted peanuts, and white sesame seeds. Meaty, chewy, and never greasy, the crisp exterior contrasts wonderfully with the tender meat\u2014an indispensable snack to grab after taking in the city nightscape.", "name": "Nanshan Yikeshu Shredded Spicy Roasted Rabbit", "transport": "Take Bus 346 or 347 to Yikeshu Lookout Station, then walk a short distance."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Nanbin Road and Nanshan"}, "wulong_karst": {"categories": {"cat_1": {"items": [{"address": "No. 112 Binjiang Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Zhang\u0027s is an iconic lamb restaurant in Wulong that uses high-mountain black goat meat from Mount Fairy. The meat is stewed until tender and flavorful, completely free of any gamey smell. The bright red broth is rich and delicious, and the tender lamb melts in your mouth alongside the bold aroma of mountain Sichuan pepper and chili oil. It\u0027s an addictive, heart-warming culinary favorite for both locals and tourists.", "name": "Zhang\u0027s Bowl Lamb Restaurant (\u5f35\u8a18\u7897\u7897\u7f8a\u8089)", "transport": "Take Wulong Bus 101 to Binjiang Road Station and walk for about 3 minutes."}, {"address": "No. 52 Yinxing Avenue, Xiannvshan Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Renowned for its traditional Tujia ethnic specialties, this restaurant\u0027s signature high-mountain sorghum cured pork is wonderfully aromatic, rich without being greasy, and stir-fried with wild mountain bamboo shoots for a crisp, tangy, and spicy finish. Using traditional firewood slow-stewing methods, they offer guests the most authentic mountain farmhouse flavors.", "name": "Xunwei Wulong Tujia Restaurant (\u5c0b\u5473\u6b66\u9686\u00b7\u50b3\u7d71\u571f\u5bb6\u83dc)", "transport": "Take a taxi from Xiannvshan Tourist Center; it takes about 5 minutes."}, {"address": "No. 18 Jiangdong Road, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Located on the banks of the Wu River, Jiangdong Fish Restaurant is famous for its freshly prepared, succulent Wu River fish. Prepared in the traditional Chongqing spicy boiled fish style, the fish is extraordinarily silky and tender, absorbing the essence of the special spicy broth. Intensely flavorful, spicy, and mouth-numbing, it\u0027s the perfect spot to replenish your energy after exploring the Karst landscapes.", "name": "Jiangdong Fish Restaurant (\u6b66\u9686\u6c5f\u6771\u9b5a\u838a)", "transport": "Take Wulong Bus 201 to Jiangdong Qiaotou Station and walk a short distance."}, {"address": "No. 6 Cuiyun Road, Xiannvshan Town Resort, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Carrying on the authentic flavor of Chongqing\u0027s traditional nine-grid hotpot, it uses a rich, pure beef tallow base that gives off a deep, intoxicating aroma as it boils. The must-order crisp tripe comes in large slices\u2014swished in the spicy broth for a few seconds, it delivers a satisfying crunch. Paired with a garlic and sesame oil dipping sauce, it delivers the most thrilling, authentic Chongqing spicy experience.", "name": "Impression Wulong Old Hotpot (\u5370\u8c61\u6b66\u9686\u8001\u706b\u934b)", "transport": "Walk for about 10 minutes from the Xiannvshan Town Tourist Reception Center."}, {"address": "No. 58 Furong East Road, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Dong\u0027s Bowl Mutton is a classic local time-honored eatery in Wulong. A bowl of spicy chili oil lamb served with a bowl of mountain soft tofu pudding is the ultimate local comfort set meal. The lamb is firm and springy, the chili oil is aromatic without being harsh, and the soft tofu is delicate and smooth. Dipped in special charred chili sauce, it offers rich layers of flavor and authentic local charm.", "name": "Dong\u0027s Bowl Mutton (\u8463\u6c0f\u7897\u7897\u7f8a\u8089)", "transport": "Take a taxi from Wulong Railway Station; it takes about 8 minutes."}, {"address": "No. 128 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Specializing in high-mountain smoked cured meats from Mount Fairy, both the cured pork and sausages are long-smoked over pine and cypress branches, resulting in a bright reddish hue and translucent slices. Taking a bite releases a rich burst of savory fat, balanced by firm, savory lean meat. Served with cold-water mountain rice, it\u0027s a delicious, savory dish that leaves tourists raving.", "name": "Xiannv Mountain Cured Pork Restaurant (\u4ed9\u5973\u5c71\u81d8\u8089\u838a)", "transport": "Take the Xiannvshan Resort Loop Bus to Yinxing Avenue Station."}, {"address": "No. 45 Fuxing Road, Furong Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Zhao\u0027s is famous across Wulong for its meticulously cleaned, odor-free bowl pork intestines. The pork intestines are slow-stewed to perfection, offering a delightfully chewy yet tender texture. Absorbing the savory, spicy broth infused with Sichuan peppercorns and chili bean paste, it pairs brilliantly with a refreshing bowl of pickled mustard green soup.", "name": "Zhao\u0027s Bowl Pork Intestine (\u8d99\u8a18\u7897\u7897\u80a5\u8178)", "transport": "Take Wulong Bus 102 to Fuxing Lukou Station and walk for about 2 minutes."}, {"address": "No. 88 Wuling Road, Xiannvshan Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Zhuxiangyuan highlights Wulong\u0027s high-mountain wild bamboo shoots and traditional home-style cooking. The signature Beef Stewed with Bamboo Shoots features freshly harvested mountain square bamboo shoots that are tender and fiber-free. The beef is stewed until melt-in-your-mouth tender, in a rich gravy perfect for pouring over rice\u2014a classic spot to experience mountain delicacies.", "name": "Zhuxiangyuan Home-style Restaurant (\u7af9\u9999\u5712\u5bb6\u5e38\u83dc)", "transport": "Take a taxi or sightseeing bus within Xiannvshan Town to Wuling Road."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Inside Lazy Ba International Zen Art Village, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 Stars | Located inside Lazy Ba International Zen Art Village, this treehouse cafe perfectly blends forest aesthetics with modern coffee culture. The signature \"Moss Latte\" incorporates matcha with dense milk foam, offering rich layers of flavor\u2014starting with rich milkiness, followed by refreshing tea notes and the bitter-sweet finish of dark roasted espresso beans, creating a striking visual and taste sensation. Pair it with freshly baked crisp honey butter waffles, crispy on the outside and soft inside with a rich egg aroma\u2014an ultimate choice for tourists to snap photos and unwind.", "name": "Lazy Ba Treehouse Cafe", "transport": "Self-driving recommended, or take the scenic area shuttle bus from Xiannvshan Town Visitor Center to Lazy Ba Art Zone."}, {"address": "Inside Zhuoya Resort Hotel, Fairy Mountain National Forest Park, Wulong District, Chongqing", "feature": "\u2b50 4.8 Stars | Perched inside a luxury boutique hotel on a high cliff edge, this cafe offers panoramic mountain canyon views alongside exquisite brunch menu options. The recommended \"Karst Sunrise Brunch Platter\" features pan-seared low-fat smoked bacon, silky hand-whisked omelet, freshly toasted sour cream baguette, and fresh mountain berries, rich in flavor and nutritionally balanced. For coffee, pour-overs use specialty Ethiopian beans with bright citrus and floral notes, refreshing and smooth, making it popular among luxury travelers and hipsters alike.", "name": "Zhuoya Cliff View Brunch \u0026 Coffee", "transport": "Drive to Fairy Mountain National Forest Park and follow the signs for Zhuoya Resort Hotel."}, {"address": "No. 88 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 Stars | Located on the main commercial street of Xiannvshan Town, this is the most popular warm-toned European-style brunch spot in the area. The classic \"Alpine Avocado Smoked Chicken Eggs Benedict\" features poached eggs with runny yolks enveloping tender smoked chicken and rich avocado mash, drizzled with special hollandaise sauce for an extremely silky texture. Pair it with a freshly ground \"Fairy Mountain Cloud Cappuccino\"\u2014topped with foam as delicate as clouds with subtle bitter undertones of dark chocolate and nuts, making it a crowd favorite among tourists.", "name": "Cloud Town Sunshine Brunch", "transport": "Take the Wulong bus line to Xiannvshan Town Visitor Center Station, then walk about 5 minutes."}, {"address": "Next to Three Natural Bridges Tourist Entrance, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 Stars | Situated right on the cliffside outside Three Natural Bridges scenic area, offering stunning views of the Karst canyon. The house specialty is \"Handcrafted Croissant \u0026 Caramel Macchiato.\" The croissants are baked daily using imported New Zealand butter, featuring a crispy exterior and a soft, honeycomb interior that bursts with rich butter flavor upon every bite. The Caramel Macchiato blends rich espresso with slightly bitter caramel sauce, sweet without being cloying. Enjoying coffee and pastries in the gentle breeze is truly refreshing.", "name": "Cliff Wind Bakery \u0026 Cafe", "transport": "Walk about 8 minutes from Xiannvshan Town Visitor Center, or take a short taxi ride."}, {"address": "No. 16 Jingqu Huanxian Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 Stars | A cozy cafe filled with warm American country log cabin charm, making it the perfect rest stop after hiking and sightseeing. The featured \"Sweet Osmanthus Latte\" infuses local wild osmanthus honey into rich milk and espresso; sweet and smooth to taste, with a lingering floral scent, while the mild coffee bitterness perfectly balances the sweetness. Pair it with homemade \"Alpine Walnut Cheesecake\", dense and velvety, where rich cheese perfectly complements crunchy walnut bits.", "name": "Alpine Log Cabin Coffee", "transport": "Drive or take the Fairy Mountain Loop Tour Bus and get off at Alpine Log Cabin Station."}, {"address": "Visitor Area, Impression Wulong Theater, Taoyuan Grand Canyon, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 Stars | Located near the Impression Wulong Live Show Theater, offering charmingly distinct vibes day and night. The \"Herb Roasted Chicken Club Sandwich\" uses whole wheat toast stuffed with tender, juicy rosemary roasted chicken breast, fresh tomatoes, and lettuce\u2014crispy, juicy, and generous in portion. Pair it with \"Oat Milk Caramel Cold Brew\", where refreshing acidity from cold brew meets cereal notes of oat milk, perfectly balanced in sweet and bitter tones, making it an excellent recharge after watching the show or sightseeing.", "name": "Impression Wulong Starry Light Meal Cafe", "transport": "Take the Impression Wulong Show Shuttle Bus directly to the theater plaza."}, {"address": "Exit Service Area, Longshui Gorge Gap Scenic Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.2 Stars | A plant-themed cafe and brunch spot located near the exit of Longshui Gorge Gap scenic area, offering a relaxed vibe filled with greenery. The signature \"American Country Breakfast\" includes pan-fried German N\u00fcrnberger sausages, crispy hash browns, sunny-side-up eggs, and garlic butter toast, offering rich and savory flavors. Pair it with an \"Espresso Tonic\", where sparkling water brings a crisp, refreshing sensation that instantly lifts post-hike fatigue, hugely popular among outdoor hikers.", "name": "Longshuixia Green Corner Brunch", "transport": "About a 2-minute walk from the hiking exit of Longshui Gorge Gap Scenic Area."}, {"address": "Core Great Grassland Area, Fairy Mountain National Forest Park, Wulong District, Chongqing", "feature": "\u2b50 4.7 Stars | A trendy retro coffee truck parked at the edge of the Great Grassland area, offering a unique camping-style coffee experience. The must-try \"Alpine Snow Cap Mocha\" features rich chocolate espresso topped with custom whipped cream, sprinkled with cocoa powder and toasted marshmallows, offering a velvety smooth texture with an interplay of sweet and bitter notes. Sitting on a camping chair with a warm mocha while taking in the vast grassland and roaming horses is a dual feast for both eyes and taste buds.", "name": "Fairy Mountain Grassland Coffee Truck", "transport": "After entering Fairy Mountain National Forest Park, take the mini train to Great Grassland Station, then walk a short distance."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 18 Cuiyun Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Located in the core commercial district of Xiannv Mountain Town, this highly popular local restaurant is famous for its authentic local dishes. The signature Bowl Mutton uses carefully selected high-altitude, premium goat meat, slow-cooked until tender and flavorful without any gamey odor. The broth is rich and fragrant, with a subtle kick of spicy chili oil and numb Sichuan peppercorns. Additionally, the braised pork with potatoes and stir-fried cured pork with fish mint are absolute
