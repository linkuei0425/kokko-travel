ARMAY (Chongqing Guanyinqiao Branch)", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 3), then walk about 150 meters."}, {"address": "B1 Floor, IMIX Park, No. 8 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Guochao Brand 9-Color Eyeshadow Palettes, Florasis Loose Powder, Judydoll Velvet Lip Glaze. WOW COLOUR is a super-popular beauty chain in China focusing on trendy \"Guochao\" (Chinese fashion trend) homegrown cosmetics and skincare brands. Famous for its visually striking giant makeup wall and immersive testing vanity tables, the Guanyinqiao IMIX Park branch lets you try out all the latest viral domestic beauty products in one place. With budget-friendly prices and oriental aesthetic packaging, it is the best destination to experience contemporary Chinese youth beauty trends.", "name": "WOW COLOUR (Guanyinqiao IMIX Park Branch)", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 3), then walk about 150 meters."}, {"address": "B1 Floor, Longfor Paradise Walk, No. 6 Beicheng Paradise Walk, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Rainbow Beauty Blender Sets, Domestic Botanical Soothing Face Masks, Colorful Press-On Nails. THE COLORIST became a nation-wide sensation thanks to its iconic giant rainbow beauty-blender wall and visually striking colorful interior design. Located in the heart of the Guanyinqiao commercial area, the Longfor Paradise Walk branch houses over 100 domestic and international vegan/botanical skincare brands alongside high-value makeup. The store offers a pressure-free, self-service shopping atmosphere with no pushy sales pitches, making it a treasure trove for makeup lovers and budget skincare shoppers.", "name": "THE COLORIST (Guanyinqiao Longfor Paradise Walk Branch)", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 2), then walk about 400 meters."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"  comfort.", "name": "JNBY (JNBY Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station, then walk across the pedestrian bridge for about 5 minutes."}, {"address": "1F-2F, New Century Department Store, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Trendy cropped jackets, vintage leather underarm bags. As a leader among Chinese original fast-fashion brands, it boasts a massive two-story flagship store in the Guanyinqiao shopping area. The collections update rapidly to match international trends, making its accessories, shoes, and bags section a shopping paradise for both tourists and stylish local girls.", "name": "UR (Urban Revivo Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station and exit from Exit 4 directly into the department store."}, {"address": "B1 Floor, Century Xindu, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Lightweight soft-soled loafers, versatile minimalist backpacks, casual white sneakers. A well-established Chinese domestic casual fashion and footwear chain, extremely popular in Guanyinqiao. Known for exceptional value and great comfort, its footwear is especially ideal for navigating the sloped streets of Chongqing\u0027s Mountain City, making it a go-to budget choice for local students and office workers.", "name": "Hotwind (Hotwind Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station; directly connected via the underground concourse."}, {"address": "1F, Moye City, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Cargo multi-pocket casual pants, trendy geometric knitwear. An original menswear brand founded by a famous Chinese designer, the Guanyinqiao store radiates an avant-garde fashion vibe. Blending Eastern tailoring with American street style, it is a favorite hotspot for young men in Chongqing looking for cool, quality clothes and casual bags.", "name": "Cabbeen (Cabbeen Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station, then walk for about 6 minutes."}, {"address": "3F, Chongqing New Century Department Store, No. 6 Jianxin North Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Chunky heel Mary Janes, genuine leather smart-casual shoes. As a household footwear brand in China, its department store counter in Guanyinqiao is immensely popular. Tailored to Asian foot shapes, its shoes combine trendy looks with walking comfort, making it a reliable choice for purchasing high-quality footwear while traveling in Chongqing.", "name": "BELLE (BELLE Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station, connected directly to the department store from the exit."}, {"address": "3F, Far Eastern Department Store, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Elegant French-style shirts, vintage high-waisted midi skirts. A well-known domestic womenswear brand embodying an elegant and romantic style. Renowned for fine fabrics and exquisite slim-fit tailoring, it is loved by local Chongqing women and serves as a great destination for workwear outfits and refined handbags.", "name": "3COLOUR (3COLOUR Guanyinqiao)", "transport": "Take Chongqing Rail Transit Line 3 to Guanyinqiao Station, then walk for about 4 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Floor B1, Century Metro, No. 6 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Qiaotou Handmade Traditional Hotpot Base, Clear Broth Soup Base, Spicy Fish Seasoning. Launched by the century-old brand Qiaotou Hotpot, these seasoning packages are among Chongqing\u0027s most authentic souvenirs. Made with carefully selected premium beef tallow and Sichuan peppercorns, their rich, spicy aroma allows you to recreate the wonderful flavors of traditional Chongqing hotpot right at home.", "name": "Qiaotou Hotpot Seasoning Store", "transport": "Take CRT Line 3 to Guanyinqiao Station, then walk for about 3 minutes."}, {"address": "New Century Department Store, No. 1 Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic Diehua Strange-Flavored Beans, Spicy Fava Beans, Sweet \u0026 Spicy Strange-Flavored Beans. A traditional nostalgic Chongqing snack for decades, it uniquely blends five flavors: salty, sweet, numbing, spicy, and sour. Crispy, fragrant, and leaving a lingering aftertaste, it is a must-buy local treat when visiting the Guanyinqiao Commercial Area.", "name": "Diehua Strange-Flavored Beans Store", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 4), then walk for about 2 minutes."}, {"address": "Inside the Metro Commercial Street, Guanyinqiao Metro Station, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Original Salt \u0026 Pepper Mahua, Black Sesame Sweet Mahua, Spicy Mini Mahua. A famous time-honored Chongqing pastry snack. Freshly baked and packed on-site, these fried dough twists are aromatic, crispy, and non-greasy. Every bite is filled with rich flavor, making them perfect souvenirs for friends and family.", "name": "Chen Mahua Guanyinqiao Flagship Store", "transport": "Take CRT Line 3 or Line 9 to Guanyinqiao Station and walk into the underground commercial street."}, {"address": "Tower A Mall, Hongding International, No. 8 Jianxin North Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Sweet Hechuan Peach Slices, Salt \u0026 Pepper Peach Slices, Sesame Spicy Peach Slices. A traditional delicacy listed as Chongqing Intangible Cultural Heritage. Crafted from premium glutinous rice, walnut kernels, and white sugar, these paper-thin slices are soft, sweet, and melt in your mouth with a rich aroma of walnut and sesame.", "name": "Hechuan Peach Slices \u0026 Traditional Pastries Counter", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 3), then walk for about 5 minutes."}, {"address": "Floor 4, IMIX Park, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Shudaoxiang Hand-Torn Spicy Beef Jerky, Spicy Vegetarian Beef, Sichuan Cold-Cooked Rabbit. A super popular local spicy snack brand in Chongqing, featuring chewy beef jerky and various Sichuan-Chongqing style delicacies. Conveniently individually packed, it is a must-stock souvenir for spicy food lovers.", "name": "Shudaoxiang Spicy Snack Experience Store", "transport": "Take CRT Line 3 to Guanyinqiao Station, then walk for about 4 minutes to enter IMIX Park."}, {"address": "Level L1, Jiangbeizui IFS International Finance Center, No. 1 Jiangbeicheng Main Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Chongqing High-Mountain Yongchuan Xiuya Green Tea, Deluxe Cold Lemon Chicken Feet, Premium Dahongpao Peppercorn Oil. Located inside a premier mall in the Jiangbeizui Financial District, this section features Chongqing\u0027s highest quality local specialties and high-end tea gift sets. Exquisitely packaged, they are ideal for business gifts or premium souvenirs.", "name": "city\u0027super Chongqing Specialty Area - Jiangbeizui IFS", "transport": "Take CRT Line 6 or Line 9 to Jiangbeicheng Station, which directly connects underground to the IFS Mall."}, {"address": "Floor B1, Yuanrong Plaza, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Zhangfei Spicy Beef Slices, Jiucun Grilled Pig Brain Seasoning Pack, Chongqing Xiaomian Noodle Sauce. Gathering the most popular local souvenirs and seasonings from all over Chongqing, it offers fair prices and an extensive variety. A great one-stop shop for hotpot bases, top local specialties, and classic spicy snacks.", "name": "Chongqing Impression Specialty Supermarket", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 5), then walk for about 3 minutes."}, {"address": "Floor B1, Moye City, Guanyinqiao, Jianxin East Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Yuxiong Mini Mahua Gift Box, Black Rice \u0026 Seaweed Mini Mahua, Spicy Beef Flavored Mini Mahua. A very popular local leisure mahua brand in Chongqing, focusing on dainty individually packaged dough twists. Combining innovative flavors with traditional craftsmanship, they are deliciously crispy and refreshingly flavorful\u2014a perfect choice for office snacks and souvenirs.", "name": "Yuxiong Xiangsu Mahua Store", "transport": "Take CRT Line 3 to Guanyinqiao Station, then walk for about 6 minutes to Moye City."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Jiangbeicheng Wenhua Street, Jiangbeicheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Chongqing Mountain City limited-edition commemorative badges, high-end Chanel-style handbags, and Mountain City view limited afternoon tea gift boxes. Located in the heart of Jiangbeizui CBD, this is Chongqing\u0027s most iconic luxury shopping center. Featuring a giant panda art installation on its facade, the interior gathers top international brands and local luxury boutiques, making it a must-visit shopping paradise for tourists and local trendsetters.", "name": "Chongqing IFS Mall", "transport": "Directly accessible from Jiangbeicheng Station on CRT Line 6 or Line 9"}, {"address": "No. 1008 Jinkai Avenue, Yubei District, Chongqing (near the northern transit hub of Jiangbei District)", "feature": "\u2b50 4.6 stars | Must-buy list: Super discounted Coach leather tote bags, limited-edition Nike sneakers, and Bosideng down jackets. As one of Asia\u0027s lar and independent brands, it radiates a rich cultural ambiance and refined Oriental aesthetic.", "name": "Fangsuo Communal Chongqing", "transport": "3-minute walk from Exit 2 of Guanyinqiao Station on CRT Line 3"}, {"address": "No. 9 Jianxin East Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Must-buy list: Chongqing multi-flavored fava bean gift boxes, heritage brand Chen Changyin fried dough twists (Mahua), and Chongqing Shu brocade craft handkerchiefs. As the flagship center of local department store giant \u0027Chongqing Department Store New Century\u0027 in Guanyinqiao, it holds fond shopping memories for generations of locals. Beyond fashion and general goods, it features an extensive \u0027Chongqing Specialty Goods Zone\u0027 offering fair prices and strict quality control, making it the best spot to experience local life and purchase all your souvenirs in one stop.", "name": "New Century Department Store (Guanyinqiao Store)", "transport": "3-minute walk from Exit 6 of Guanyinqiao Station on CRT Line 9"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Guanyinqiao and Jiangbeizui"}, "jiefangbei_hongyadong": {"categories": {"cat_1": {"items": [{"address": "No. 2 Minquan Road, Yuzhong District, Chongqing (Jiefangbei Pedestrian Street)", "feature": "\u2b50 4.6 stars | Must-Buys: Tongjunge Handmade Herbal Soap, Guilinggao (Herbal Jelly), Chuanbei Pipa Gao (Fritillary \u0026 Loquat Syrup). Tongjunge is a famous centuries-old traditional pharmacy in Chongqing with a rich history. Beyond traditional Chinese medicinal herbs, its most popular offerings are its self-developed herbal beauty and skincare products\u2014such as Lithospermum Ointment and Herbal Essence Moisturizing Cream. Made with natural, gentle ingredients, they attract many locals and savvy travelers alike.", "name": "Tongjunge Pharmacy Jiefangbei Flagship", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit 2; walk about 3 minutes."}, {"address": "No. 108 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buys: Big-brand beauty travel minis, exclusive limited-edition scented candles, herbal repairing sheet masks. A warehouse-style, industrial-chic cosmetics select shop that pushes aesthetic design to the limit, making it wildly popular in the Jiefangbei commercial district. It brings together top international brands and trendy emerging domestic beauty lines. The mini travel-sized samples are exceptionally popular, allowing visitors to sample high-end skincare at wallet-friendly prices\u2014drawing crowds of young shoppers and trendsetters.", "name": "HARMAY Jiefangbei Branch", "transport": "Take CRT Line 1 or 2 to Jiaochangkou Station, Exit 9; walk about 5 minutes."}, {"address": "No. 177 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buys: Taiji Tianma Shouwu Tablets, Herbal Essence Hand Cream, Chinese Herbal Repairing Masks. Taiji Group is a local pharmaceutical giant in Chongqing, and its flagship store is located in the heart of Jiefangbei. In addition to a comprehensive range of medicines and health supplements, the store features a dedicated herbal beauty section showcasing high-quality, affordably priced TCM cosmetics extracted with modern technology\u2014making it the top spot for local wellness souvenirs.", "name": "Taiji Pharmacy Jiefangbei Flagship", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit 1; walk about 4 minutes."}, {"address": "Floor B1, PARK108 Guotai Plaza, No. 108 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buys: Florasis Loose Powder, Perfect Diary Eyeshadow Palette, Judydoll Single Blush. A ultra-popular \u0027Guochao\u0027 (China-chic) cosmetics multi-brand store bringing together hundreds of trendy domestic beauty and skincare brands. Featuring stylish, colorful interiors and excellent makeup testing stations, it\u0027s the ultimate one-stop shop for tourists looking to buy hot C-beauty products, complete with frequent exclusive bundle deals.", "name": "WOW COLOUR Guotai Plaza Store", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit D; directly connected to Guotai Plaza."}, {"address": "WFC World Financial Center, No. 188 Minzu Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buys: Explorer 12-Color Eyeshadow Palette, Bionic Film Essence Lip Stain, Business Card Lipsticks. A store dedicated to one of China\u0027s top makeup brands, famed for its beautifully designed eyeshadow palettes and top-tier lip products. On-site makeup artists provide professional testing services. Its high cost-performance ratio makes it a hit among students and young travelers, while its store-exclusive gift sets make wonderful gifts.", "name": "Perfect Diary Jiefangbei Store", "transport": "Take CRT Line 1 or Line 6 to Xiaoshizi Station, Exit 5 or 6; walk about 5 minutes."}, {"address": "No. 168 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buys: Alpine Dendrobium Orchid Anti-Wrinkle Serum, Purple Reishi Multi-Action Youth Cream, Snow Lotus Whitening Sunscreen Lotion. A domestic C-beauty brand centering on alpine plant skincare, co-developed with the Kunming Institute of Botany, Chinese Academy of Sciences. Emphasizing natural, low-allergen, and high-activity ingredients, its products are ideal for skin in subtropical or variable climates and are highly favored by fans of herbal skincare.", "name": "DR. PLANT Jiefangbei Pedestrian Street Store", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit 1; walk about 3 minutes."}, {"address": "1F, Chongqing Department Store, No. 2 Minquan Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buys: Bird\u0027s Nest Brightening Facial Mask, Collagen Ultimate Nourishing Cream, Citrus Botanical Hand Cream. Located inside the historic Chongqing Department Store, this branch of the famous beauty chain often carries exclusive South-West region limited medical skincare lines and herbal care series. With its spacious layout and broad selection, it is a convenient spot for daily cosmetics and travel skincare essentials.", "name": "Watsons Chongqing Department Store Branch", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit D; walk about 2 minutes."}, {"address": "Floor B1, Bayi Plaza, No. 238 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.1 stars | Must-Buys: SUISSE PROGRAMME Firming Mask, Japanese Soy Milk Skincare Lotion, Avene Thermal Spring Water Spray. Located inside Bayi Plaza next to the Jiefangbei Food Street, this outlet features popular skincare and cosmetics brands from Japan, Korea, Europe, and America. Offering competitive prices and frequent sales promotions, it is a great stop for tourists to restock top-notch international drugstore products while exploring local delicacies.", "name": "SaSa Bayi Plaza Store", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station, Exit 9; walk about 4 minutes."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Inside the Shopping Mall, No. 168 Minzu Road, Jiefangbei Pedestrian Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Chongqing dialect printed T-shirts, \u0027This is Chongqing\u0027 canvas tote bags, Spicy Jianghu baseball caps. Highly recommended by local Chongqing youth, this original streetwear brand creatively blends classic local spicy culture and Chongqing dialect phrases like \u0027This is Chongqing\u0027 and \u0027Xiong Qi\u0027 (Let\u0027s go!) into apparel and bag designs. Made from heavy-duty pure cotton with a relaxed American fit, the clothing offers a strong street-style aesthetic, making it a top pick for tourists looking for stylish photo outfits and unique local souvenirs.", "name": "Yi Ma Yi La Chongqing Fashion (Yima Yila Original Streetwear)", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit 2), walk for about 3 minutes."}, {"address": "No. 32 Zhonghua Lane, Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-stitched genuine leather shoes, vintage leather ankle boots, top-grain leather brogue loafers. A time-honored Chongqing handmade shoe shop handed down through generations, specializing in ultra-comfortable, fully hand-stitched leather footwear. Using premium top-grain cowhide, their shoes are designed for long walks\u2014featuring soft, foot-hugging soles that are extremely wear-resistant. Perfectly suited for Chongqing\u0027s hilly terrain, many locals and shoe enthusiasts visit specifically to order custom pairs or purchase ready-made shoes.", "name": "San Bu Pao Handmade Leather Shoes", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station (Exit 9), walk for about 5 minutes."}, {"address": "No. 222 Xinhua Road, Yuzhong District, Chongqing (Near Jiefangbei Commercial Area)", "feature": "\u2b50 4.8 stars | Must-buy list: Vegetable-tanned handmade tote bags, handmade leather coin purses, vintage genuine leather crossbody bags. Tucked away in an alley near Jiefangbei, this independent handmade leather studio focuses on minimalist, high-texture natural vegetable-tanned leather bags. Every item is originally prototyped and hand-stitched by the designer. The leather develops a unique, beautiful patina over time, and the shop offers on-site custom engraving services to create personalized accessories.", "name": "Qiu Shan Handmade Leather Bags", "transport": "Take CRT Line 6 to Xiaoshizi Station (Exit 5A), walk for about 6 minutes."}, {"address": "B1 Floor, PARK108 Cathay Plaza, No. 108 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buy list: Designer cotton-linen dresses, uniquely tailored knitwear, 3D-cut wide-leg trousers. Extremely popular among fashionable Chongqing women, this local independent womenswear store features natural cotton and linen fabrics paired with minimalist geometric cuts. The clothing style exudes a subtle Zen vibe combined with sleek urban elegance. The silhouettes flatter various body types, and the skin-friendly, breathable materials make it a go-to secret spot for women seeking high-quality, unique fashion.", "name": "SHUYI Designer Boutique", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit D), directly connected to PARK108 Cathay Plaza."}, {"address": "No. 56 Cangbai Road, Yuzhong District, Chongqing (Opposite the top floor of Hongyadong)", "feature": "\u2b50 4.9 stars | Must-buy list: Embroidered Hanfu jackets, Chongqing-themed hair accessories, vintage embroidered cloth shoes. A popular Hanfu and Guochao (Chinese chic) store near Hongyadong. Besides providing Hanfu rentals and photography services, it sells high-quality original modern Hanfu, vintage-style shoes, and bags. By combining the Mountain City\u0027s night views with traditional embroidery, the designs blend cultural heritage with everyday wearable functionality, attracting many tourists visiting Hongyadong.", "name": "Yi Cun Shi Guang Hanfu \u0026 Guochao Store", "transport": "Take CRT Line 6 to Xiaoshizi Station (Exit 9), walk for about 8 minutes to the top floor of Hongyadong."}, {"address": "Shopping Mall, Marriott International Trade Center, No. 77 Qingnian Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buy list: Reflective streetwear backpacks, utility crossbody bags, multifunctional street chest bags. A local streetwear bag brand store highly sought after by Chongqing\u0027s edgy youth, featuring techwear, workwear, and futuristic aesthetics. Made with high-strength waterproof fabrics and multi-pocket functional designs, these spacious and avant-garde bags are ideal for travel, outdoor sports, or daily street style, offering exceptional value for money.", "name": "MCJH\u0026TWJ Streetwear Bag Shop", "transport": "Take CRT Line 1 to Jiaochangkou Station (Exit 24), walk for about 4 minutes."}, {"address": "F2, Metropolitan Oriental Plaza, No. 177 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-buy list: Vintage combat boots, lightweight sneakers, British-style soft leather loafers. A representative nationwide casual fashion footwear and bag brand in China, with a bright and spacious flagship store in Jiefangbei. Their footwear emphasizes comfort and trendy designs\u2014combat boots are soft and pain-free, sneakers are lightweight and durable for walking, and bag options range from daily commute to stylish street purses. Affordable yet well-made, it\u0027s a top choice for locals and tourists seeking budget-friendly fashion accessories.", "name": "Hotwind (Jiefangbei Branch)", "transport": "Take CRT Line 2 to Linjiangmen Station (Exit B), walk for about 3 minutes."}, {"address": "No. 2 Minquan Road, Jiefangbei Pedestrian Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buy list: Soft sheepskin flats, co-branded fashion handbags, comfortable block-heel pumps. Located at the heart of Jiefangbei Pedestrian Street, this flagship store of a major domestic footwear giant brings together several of its premium and trendy sub-brands. Known for high-quality leather and shoe lasts tailored to Asian foot shapes, its soft sheepskin series offers excellent sole cushioning\u2014ideal for long shopping walks. Paired with a wide selection of chic leather bags, it caters to all occasion needs.", "name": "Belle Shoes \u0026 Bags Flagship Store", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station or Linjiangmen Station, walk to the side of the Jiefangbei Monument."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 177 Minzu Road, Yuzhong District, Chongqing (Near Jiefangbei Pedestrian Street)", "feature": "\u2b50 4.8 stars | Must-Buy List: Qiaotou Handmade Old Hotpot Base, Fragrant Beef Tallow Base, Special Dry Dip Spicy Powder. A China Time-Honored Brand founded during the Guangxu reign of the Qing Dynasty, it is the ultimate synonym for authentic hotpot base among Chongqing locals. The shop is filled with the mouthwatering aroma of beef tallow, and the simmered broth is numbingly spicy, fresh, and savory without being harsh\u2014making it the top souvenir choice to recreate Chongqing hotpot flavors at home.", "name": "Qiaotou Hotpot Seasoning Store", "transport": "Take Metro Line 2 to Linjiangmen Station, Exit 2, and walk about 300 meters."}, {"address": "4F, Hongyadong Folk Custom Area, No. 88 Jialing River Binjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic Salt \u0026 Pepper Twists, Spicy Twists, Sweet Black Sesame Twists. A famous snack recognized as Chongqing Intangible Cultural Heritage. Although originating from Ciqikou, its Hongyadong branch is equally packed with fans. The fried twists are wonderfully crispy, fragrant, and non-greasy with a satisfying crunch in every bite. Offering various flavors to cater to every palate, it is an addictive snack perfect for both gifting and self-indulgence.", "name": "Hongyadong Chen Changyin Fried Dough Twists", "transport": "Take Metro Line 1 or 6 to Xiaoshizi Station, Exit 9, and walk about 500 meters."}, {"address": "No. 131 Zourong Road, Yuzhong District, Chongqing (Inside Jiefangbei Commercial Area)", "feature": "\u2b50 4.5 stars | Must-Buy List: Zhoujunji Chongqing Old Hotpot Base, Boiled Fish Seasoning, Chongqing Xiaomian Spicy Sauce. A flagship store directly operated by a famous Chongqing seasoning manufacturer with certified quality products. Besides traditional hotpot bases, their Boiled Fish and Pickled Cabbage Fish seasoning packets are kitchen must-haves for cooking beginners\u2014allowing you to easily whip up authentic Sichuan-Chongqing classic dishes with basic ingredients.", "name": "Zhoujunji Hotpot Seasoning Store", "transport": "Take Metro Line 2 to Linjiangmen Station and walk about 200 meters."}, {"address": "1F, Bayi Road Food Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-Shredded Spicy Beef Jerky, Five-Spice Air-Dried Beef Strips, Sichuan-Style Shredded Beef Bites. The storefront often features eye-catching decorations styled after the Peking Opera character Zhang Fei. The beef jerky is cured and air-dried using traditional techniques, featuring a dark shiny exterior and reddish interior. The meat is firm, chewy, and increasingly savory as you chew\u2014imparted with deep spicy flavors that make it an exceptional snack to pair with drinks.", "name": "Zhangfei Beef Specialty Store", "transport": "Take Metro Line 1 or 2 to Jiaochangkou Station, Exit 11, and walk about 150 meters."}, {"address": "Near No. 288 Bayi Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Alpine Spicy Dried Tofu, Wild Chili Flavored Dried Tofu, Five-Spice Braised Dried Tofu. A century-old traditional specialty hailing from Yangjiao Ancient Town in Wulong, Chongqing, crafted using high-altitude quality soybeans and natural spring water. The dried tofu boasts a delicate yet elastic texture that is deeply flavorful and juicy. High in protein and low in fat, it is a healthy, classic snack locals have loved since childhood.", "name": "Wulong Yangjiao Dried Tofu Store", "transport": "Take Metro Line 1 to Jiaochangkou Station and walk about 3 minutes via Bayi Road."}, {"address": "Near No. 140 Xinhua Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Chengkou Alpine Cured Pork Slabs, Sichuan Spicy Sausage, Flavored Cured Ribs. Selenium-rich cured meat from the high mountains of Chengkou County, slow-smoked over cyclobalanopsis oak and cypress wood for dozens of days. The meat is rosy and translucent, rich without being greasy, with a subtle woody smoke aroma. Unbeatable whether cooked in soup or stir-fried with garlic sprouts, it stands as Chongqing\u0027s most representative New Year souvenir.", "name": "Chengkou Cured Meat Specialty Store", "transport": "Take Metro Line 1 to Xiaoshizi Station, Exit 5 or 6, and walk about 250 meters."}, {"address": "5F, Hongyadong Custom Area, No. 88 Jialing River Binjiang Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Jiangxiaobai Sorghum Liquor 40% Classic Edition, Fruit Cube Peach Flavored Sorghum Liquor, Yuzhou Limited Gift Box. The flagship modern sorghum liquor brand of Chongqing, featuring chic, trendy store decor filled with hip, reflective quotes. The liquor is smooth and easy to drink without burning the throat. Wrapped in stylishly nostalgic packaging, it makes a great gift for younger friends or a lightweight souvenir to experience Chongqing\u0027s drinking culture.", "name": "Jiangxiaobai Concept Experience Store", "transport": "Take Metro Line 6 to Xiaoshizi Station and walk to the 5th floor viewing platform of Hongyadong."}, {"address": "No. 168 Bayi Road, Jiefangbei Pedestrian Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Hechuan Peach Slices (Chuanzhou Brand), Yuxiong Strange-Flavored Fava Beans, Wujiang Fuling Pickled Mustard Tuber Deluxe Gift Box. A comprehensive one-stop supermarket to buy all local Chongqing specialties. Bringing together iconic products from various districts and counties, highlights include soft, sweet Hechuan Peach Slices and the complex 5-flavor (sweet, sour, spicy, numbing, salty) fava beans. Features transparent pricing and an exceptionally full inventory.", "name": "Chongqing Impression Bayu Specialty Hall", "transport": "Take Metro Line 2 to Linjiangmen Station and walk to the center of Bayi Road Food Street."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1008 Jinkai Avenue, Yubei District, Chongqing (Directly accessible via nearby CRT line)", "feature": "\u2b50 4.6 stars | Must-Buy List: Outerwear from top international brands at up to 70% off, high-quality trench coats from independent local brands, limited-edition running shoes from sports brands. Originating in Chongqing and now famous nationwide, this outlet giant features an Italian castle-style architectural design. It houses hundreds of international luxury brands and top Chinese designer labels, offering deeply discounted prices year-round. It is the top shopping choice for both tourists and locals hunting for great bargains.", "name": "Sasseur Outlets", "transport": "Take Chongqing Rail Transit (CRT) Line 3 to Olympic Garden Station or Jintong Lu Station, then transfer to a shuttle bus."}, {"address": "No. 108 Linjiang Road, Jiefangbei, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Graffiti T-shirts by local independent designers, original canvas bags inspired by the Mountain City, co-branded art figures by local trendy artists. Located in the heart of Jiefangbei, this shopping mall focuses on youth trends and local culture, featuring numerous Chongqing designer apparel boutiques, cultural and creative lifestyle shops, and independent select stores. The exterior blends modern steel structures with the dramatic red and black lines reminiscent of the Bayu Grand Theater, making it a paradise for young people who love niche styles and original local Chongqing designs.", "name": "PARK108 Youth Plaza", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit 2 for direct access."}, {"address": "No. 100 Zourong Road, Jiefangbei, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Creative Chongqing dialect ceramic mugs, custom perfumes themed around Mountain City maps, hand-drawn postcards co-branded with local heritage brands. LOCALAND is a multi-concept independent lifestyle brand deeply rooted in local Chongqing culture, combining local creative goods, independent publications, and curated aesthetic items. The store\u0027s spatial design showcases Chongqing\u0027s unique 3D futuristic vibe. Offering everything from handmade local crafts to original daily lifestyle trinkets, it\u2019s the best place to find unique souvenirs infused with local charm.", "name": "LOCALAND Chongqing", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station, Exit 9, and walk about 300 meters."}, {"address": "No. 55 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Popular travel-size sample sets from major beauty brands, Chongqing-exclusive camellia deeply moisturizing hand cream, niche salon fragrance discovery sets. HARMAY integrates Chongqing\u0027s iconic air-raid shelters and industrial warehouse aesthetics into its spatial design, creating a beauty retail space with a sleek industrial vibe. The store stocks over a thousand global luxury and niche cosmetics and skincare products, presented in an open warehouse-style layout for effortless browsing. Its unique Chongqing-exclusive products attract beauty lovers from far and wide.", "name": "HARMAY (Chongqing Jiefangbei Branch)", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit B, and walk about 250 meters."}, {"address": "No. 2 Minquan Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade Shu brocade scarves from traditional local brands, Tianfu Cola co-branded creative items, traditional spicy beef jerky gift boxes. Founded in the last century, Chongqing Department Store is the most iconic vintage local department store in Chongqing. It holds the shopping memories of generations of locals. Beyond classic department store counters, the basement level and sales zones feature numerous local heritage brand counters and deeply discounted items. If you want to experience the most authentic daily shopping atmosphere in Chongqing, this is the place to go.", "name": "Chongqing Department Store", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station and walk about 200 meters."}, {"address": "No. 188 Minzu Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Exclusive perfumes from luxury international brands, limited-edition skydeck souvenir albums, premium hard-box Chongqing high-mountain tea gift sets. As the podium shopping mall of WFC, the tallest skyscraper in Jiefangbei, this venue houses top international luxury brands and high-end retail chains. The shopping environment is exceptionally spacious and elegant. Visitors can also head to the high-floor observation deck to take in panoramic views of Hongyadong and the confluence of the two rivers. It is a landmark destination for those seeking a premium shopping experience and refined souvenirs.", "name": "Chongqing World Financial Center Mall (WFC Mall)", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit B, and walk about 150 meters."}, {"address": "No. 68 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: High-quality silk shawls, premium gift boxes of local Chongqing specialties, imported gourmet snack sets. Metropolitan Oriental Plaza was one of the first foreign-invested commercial complexes in the Jiefangbei shopping district, boasting a long history and a prime location. In addition to major international fashion brands, the complex features exquisite local craft counters and specialty dining options, offering a multi-faceted retail experience suitable for the whole family.", "name": "Metropolitan Oriental Plaza", "transport": "Take CRT Line 2 to Linjiangmen Station, Exit B, and walk about 200 meters."}, {"address": "No. 100 Zourong Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Designer leather handbags, limited-edition fine chocolate gift boxes, quality jewelry from independent brands. Located right at the heart of the iconic Jiefangbei intersection, Chongqing Times Square is renowned for its modern and sophisticated retail environment. It hosts a rich selection of luxury boutiques and top-tier personal care brands, frequently organizing fashion pop-ups and exhibitions. It is an excellent choice for travelers who appreciate luxury department stores and a refined shopping atmosphere.", "name": "Chongqing Times Square", "transport": "Take CRT Line 1 or Line 2 to Jiaochangkou Station, Exit 9, and walk about 100 meters."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jiefangbei and Hongyadong"}, "jiulongpo_huangjueping": {"categories": {"cat_1": {"items": [{"address": "No. 26 Yangjiaping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Pearl Whitening Powder, Taiji Qibai Cream, Tongjunge Herbal Beauty Mask. As a centuries-old honored brand pharmacy in Chongqing, Tongjunge not only provides traditional Chinese medicine but also offers self-developed Han herbal skincare and cosmetics beloved by local residents. Their specially crafted pearl powder has an ultra-fine texture that can be blended into daily skincare products\u2014a secret beauty treasure passed down through generations in old Chongqing.", "name": "Tongjunge Pharmacy (Yangjiaping Branch)", "transport": "Walk about 300 meters from Exit 2 of Yangjiaping Station on CRT Line 2"}, {"address": "No. 18 Yangjiaping Pedestrian Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Herbal Repair Balm, Chongqing Herbal Moisturizing Face Cream, Mugwort Self-Heating Eye Mask. Peace Pharmacy is one of Chongqing\u0027s most iconic local pharmacy chains, featuring dedicated sections for domestic skincare and traditional herbal beauty products. Their house-made herbal balm works wonders for hydrating skin in dry weather, offering natural ingredients at affordable prices\u2014an everyday skincare staple for locals.", "name": "Peace Pharmacy (Yangjiaping Pedestrian Street Store)", "transport": "Walk about 150 meters from Exit 1 of Yangjiaping Station on CRT Line 2"}, {"address": "NL199, Chongqing MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Luxury cosmetics travel samples, HARMAY signature herbal essential oil hand cream, limited-edition beauty sponge sets. Located in the MixC Yangjiaping, this industrial-style warehouse cosmetics concept store is a favorite among local trendsetters and art students. It houses countless international and emerging domestic beauty brands. The biggest draw is its huge selection of high-end travel/sample sizes and limited-edition beauty merchandise, allowing customers to try popular products at budget-friendly prices.", "name": "HARMAY (Chongqing MixC Store)", "transport": "Directly connected to MixC via Exit 1 of Xiejiawan Station on CRT Line 2 or Line 10"}, {"address": "No. 108 Huangjueping Main Street, Jiulongpo District, Chongqing (Next to Sichuan Fine Arts Institute Huangjueping Campus)", "feature": "\u2b50 4.4 stars | Must-Buy List: Ancient Qibai Formula Face Cream, Handmade Lithospermum Repair Balm, Agarwood Herbal Essential Oil. Located near the Huangjueping campus of Sichuan Fine Arts Institute, this unique independent beauty shop combines traditional herbalism with modern plant extraction techniques. The owner thoughtfully formulates various additive-free, handmade plant skincare products ideal for sensitive skin. The store\u0027s classic vintage decor and subtle botanical fragrance create a soothing, relaxing atmosphere as soon as you step inside.", "name": "Caimuxuan Herbal Skincare (Huangjueping Store)", "transport": "Take Bus 223 or 823 to Huangjueping Main Street Station and walk about 100 meters"}, {"address": "No. 12 Yangjiaping Side Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Taiji Aloe Vera Repair Gel, Honeysuckle Anti-Acne Serum, Chuanxiong \u0026 Centella Hand Cream. Taiji Group is a renowned local pharmaceutical brand in Chongqing, and its pharmacies exclusively feature cosmeceuticals developed by the Taiji Herbal Laboratory. Highlighting native Chinese medicinal herbs from Sichuan and Chongqing as core ingredients, their formulations are exceptionally effective for acne control and post-sun skin repair, earning deep trust from local students and office workers.", "name": "Taiji Pharmacy (Jiulongpo Outlet)", "transport": "Walk about 400 meters from Exit B of Yangjiaping Station on CRT Line 2"}, {"address": "No. 128 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Guochao 9-Color Eyeshadow Palette, Mountain City Matte Lip Glaze, Art Co-branded Cleansing Balm. Located in the famous Huangjueping Graffiti Art Street, this independent makeup and cosmetics boutique is hugely popular among art students. It focuses on high-value domestic beauty brands (\"Guochao\") and trending emerging labels. The graffiti-packaged lip glazes and palette sets are tailored specifically for this artistic enclave, making them perfect souvenirs and collector\u0027s items.", "name": "Color Diary Cosmetics (Huangjueping Store)", "transport": "Take Bus 233 or 823 to Huangjueping Graffiti Street Station"}, {"address": "No. 35 Tuanjie Road, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Mugwort Thermal Soothing Eye Cream, Camellia Firming Face Cream, Handmade Honeysuckle Bar Soap. Tucked away in a residential neighborhood in Yangjiaping, this local boutique focuses on traditional herbal plant-based skincare. Owned by a senior local practitioner, the shop offers custom herbal blending services on-site. Their deeply moisturizing mugwort eye cream and camellia face cream are ideal for autumn and winter, earning this hidden gem glowing word-of-mouth recommendations among local moms.", "name": "Luye Herbal Beauty Shop (Yangjiaping Store)", "transport": "Walk about 450 meters from Exit 3 of Yangjiaping Station on CRT Line 2"}, {"address": "No. 12 Qianjin Road, Yangjiaping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Centella Asiatica Soothing Toner, Abelmoschus Manihot Firming Mask, Alpine Snow Lotus Hydrating Cream. Located near Yangjiaping Meibao Park, this elegant cosmetics store focuses on high-concentration botanical extracts and gentle skin repair. Utilizing alpine plants native to Southwestern China as key ingredients, its products offer remarkable hydrating and restorative results. With complimentary skin analysis and product trials offered on-site, it is a local favorite.", "name": "Post-Plant Beauty (Yangjiaping Store)", "transport": "Walk about 350 meters from Exit 2 of Yangjiaping Station on CRT Line 2"}], "name": "Local Iconic Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 126 Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buys: Original graffiti print t-shirts, Sichuan Fine Arts Institute (SCAI) limited canvas tote bags, artistic illustrated canvas sneakers. Located in the heart of Huangjueping Graffiti Street, this store is run by a team of SCAI graduates who transform Huangjueping\u0027s iconic wall graffiti into wearable fashion. The apparel embodies Chongqing\u0027s unique local magical realism style, highly favored by young trendsetters and art enthusiasts.", "name": "SCAI Graffiti Art \u0026 Apparel Store", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 5 minutes."}, {"address": "Inside Diantai Village Art Zone, Railway 4th Village, Huangjueping, Jiulongpo District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buys: Hand-stitched vegetable-tanned leather totes, vintage distressed leather ankle boots, minimalist genuine leather key pouches. Tucked away in the Huangjueping Art Zone, this hidden leather workshop insists on pure hand-cutting and polishing. Run by a veteran local artisan, it offers high-quality, one-of-a-kind leather shoes and bags, attracting local hipsters and discerning buyers for custom orders.", "name": "Wildness Handmade Leather \u0026 Shoes Studio", "transport": "Take Bus 223 or 823 to Huangjueping Station, then walk for about 8 minutes."}, {"address": "1st Floor, Building 2, Old Residential Area, Huangjueping Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buys: American vintage denim jackets, 80s Hong Kong style printed shirts, hand-woven vintage square bags. Hidden in an old residential neighborhood of Huangjueping, this vintage shop curates classic clothing and accessories from around the world and Chongqing\u0027s past. Filled with nostalgia, its interior makes it a top treasure-hunting spot for art students and fashionistas.", "name": "Corner Vintage \u0026 Apparel Shop", "transport": "Take CRT Line 18 to Huangjueping Station, then walk for about 3 minutes."}, {"address": "No. 108 Huangjueping Main Street, Graffiti Block, Jiulongpo District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buys: Hand-painted mountain city nightscape canvas shoes, monorail-through-building themed backpacks, customized hand-painted baseball caps. Featuring in-house creations by fine arts students, this workshop incorporates iconic sights like Chongqing\u0027s monorail, Yangtze River Cableway, and Huangjueping graffiti onto everyday shoes and bags. Customers can request custom designs on the spot, creating unique, memorable local fashion souvenirs.", "name": "Painters Village Hand-painted Shoes \u0026 Bags Workshop", "transport": "Take Bus 233 to Huangjueping Station, then walk for about 2 minutes."}, {"address": "Level 2, Chongqing MixC, No. 55 Xiejiawan Main Street, Jiulongpo District, Chongqing", "feature": "\u2b50 4.8 stars | Must-buys: Chinese independent designer co-branded dresses, geometric leather crossbody bags, stylish patchwork women\u0027s shoes. Located in the high-end Chongqing MixC shopping center in Yangjiaping, this is a pioneering select shop for Chinese independent designer fashion. Showcasing numerous top Chinese independent brands, it balances avant-garde fashion with refined quality, making it immensely popular among Cho
