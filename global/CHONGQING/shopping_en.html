ansit Line 1 or Line 9 to Shapingba Station, and walk for about 6 minutes."}, {"address": "No. 24 Hengjie, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Chongqing Mountain Mugwort Foot Soak Bags, Peppermint Cooling Soothing Ointment, Chinese Herbal Plant Mosquito Repellent. Peace Pharmacy is a chain store under a large state-owned pharmaceutical enterprise in Chongqing, deeply rooted in the region for years. The branch on Ciqikou Hengjie features a special \u0027Chongqing Medicine \u0026 Herbal Health Zone\u0027 tailored for tourists. It is highly recommended to pick up foot soak bags and portable cooling ointments crafted from local mountain mugwort. Soaking your feet after walking along the ancient town\u0027s cobblestone streets provides amazing relief, making them practical souvenirs with local charm.", "name": "\u548c\u5e73\u85e5\u623f (\u78c1\u5668\u53e3\u6a6b\u8857\u5e97) (Peace Pharmacy Ciqikou Hengjie Branch)", "transport": "Take Rail Transit Line 1 to Ciqikou Station, enter the ancient town and walk for about 10 minutes."}, {"address": "No. 19 Xiaolongkan New Street, Three Gorges Plaza, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Herbal Pearl Whitening Facial Mask, Tongjunge Tortoise Shell and Deer Antler Gel Beautifying Skincare, Sichuan-Chongqing Specialty Herbal Tea Packs. Baishengtang is a well-known local drugstore chain in Chongqing, located in the core Three Gorges Plaza business circle of Shapingba. Combining traditional Chinese medicine principles with modern cosmeceuticals, it offers many herbal skincare products tailored for Asian skin types. Its exclusively sold Herbal Pearl Whitening Masks and wellness tea packs are extremely popular among local university students and young professionals for their great quality and value for money.", "name": "\u767e\u751f\u5802\u5927\u85e5\u623f (\u6c99\u576a\u58e9\u4e09\u5cfd\u5ee3\u5834\u5e97) (Baishengtang Pharmacy Sanxia Plaza Branch)", "transport": "Take Rail Transit Line 1 to Shapingba Station, Exit 2, and walk for about 3 minutes."}, {"address": "Floor B2, Longfor Jinsha Paradise Walk, No. 1 Zhannan Road, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Dendrobium Orchid Firming \u0026 Anti-Wrinkle Essence Cream, Alpine White Tea Freeze-Dried Mask, Yunnan Poplar Repairing Serum. DR.PLANT is a representative domestic beauty brand dedicated to alpine plant skincare, with numerous counters across Chongqing. Located in Jinsha Paradise Walk directly above Shapingba High-Speed Railway Station, the store offers an elegant, natural ambiance along with complimentary skin tests and product trials. Its flagship Dendrobium Orchid series is beloved by local women for its strong moisturizing and repairing capabilities, making it ideal for autumn, winter, or dry climates.", "name": "\u690d\u7269\u91ab\u751f (\u6c99\u576a\u58e9\u9f8d\u6e56\u91d1\u6c99\u5929\u8857\u5e97) (DR.PLANT Shapingba Longfor Jinsha Paradise Walk Branch)", "transport": "Take Rail Transit Line 1, Line 9, or Loop Line to Shapingba Station for direct access into Longfor Jinsha Paradise Walk Mall."}, {"address": "No. 1 Shuangxiangzi, Three Gorges Plaza Pedestrian Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Judydoll Single Eyeshadow, Carslan Slim Lipstick, ZEESEA Feather Light Matte Concealer. THE COLORIST is an iconic, large-scale makeup multi-brand store in China. The Three Gorges Plaza branch in Shapingba is a shopping hotspot for young girls due to its proximity to the university area. The vibrant rainbow beauty sponge wall and fully open makeup trial area are eye-catching features, bringing together nearly a hundred trending C-beauty (Guochao) brands. Whether you\u0027re looking for budget-friendly eyeshadow palettes or high-end texture lip glazes, you can test and buy them all under one roof.", "name": "THE COLORIST \u8abf\u8272\u5e2b (\u6c99\u576a\u58e9\u4e09\u5cfd\u5ee3\u5834\u5e97) (THE COLORIST Sanxia Plaza Branch)", "transport": "Take Rail Transit Line 1 to Shapingba Station, exit and walk for about 4 minutes into Three Gorges Plaza Pedestrian Street."}, {"address": "Floor L3, Longfor Jinsha Paradise Walk, No. 1 Zhannan Road, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Florasis Loose Powder, Perfect Diary Animal Eyeshadow Palette, Joocyee Dewy Lip Glaze. KKV is a massive, yellow container-themed lifestyle and beauty destination inside Shapingba Jinsha Paradise Walk. The store features a huge beauty and skincare zone, focusing on exquisite C-beauty and top-trending drugstore items. With visually impactful displays, it stocks everything from beautifully crafted traditional-style Florasis cosmetics to high-demand facial masks, making it the top destination in Shapingba for the latest viral domestic beauty products.", "name": "KKV (\u6c99\u576a\u58e9\u9f8d\u6e56\u91d1\u6c99\u5929\u8857\u5e97) (KKV Shapingba Longfor Jinsha Paradise Walk Branch)", "transport": "Take Rail Transit Line 1, Line 9, or Loop Line to Shapingba Station for direct access."}, {"address": "Floor F1, Xuandi Shopping Center, No. 85 Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Pientzehuang Pearl Cream, Winona Soothing Repair Freeze-Dried Mask, Herborist Taiji Youth Preserving Serum. Located in Xuandi Shopping Center\u2014a primary hangout for local students\u2014this Watsons features a large dedicated section for popular Chinese domestic pharmaceutical brands and specialized skincare alongside global labels. The store frequently runs promotions on classic Chinese dermatological-grade cosmetic brands like Pientzehuang and Winona, attracting many nearby university students to shop for high-value skincare favorites.", "name": "\u5c48\u81e3\u6c0f (\u6c99\u576a\u58e9\u70ab\u5730\u8cfc\u7269\u4e2d\u5fc3\u5e97) (Watsons Shapingba Xuandi Shopping Center Branch)", "transport": "Take Rail Transit Line 1 to Shapingba Station, Exit 1, and walk for about 2 minutes."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 118 Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buys: Handmade Shu embroidery silk scarves, tailored modern cheongsams, double-sided Shu embroidered handbags. Tucked away in the alleys of Ciqikou Ancient Town, this clothing boutique inherits thousand-year-old Shu embroidery techniques, with all items handcrafted by local senior artisans. Loved by local women who appreciate quality and vintage elegance, tourists can also get custom-tailored modern cheongsams made to fit their silhouette perfectly\u2014blending traditional heritage with modern beauty.", "name": "Ciqikou Shu Embroidery Cheongsam Workshop", "transport": "CRT Line 1 Ciqikou Station, Exit 1, approx. 8 mins walk"}, {"address": "No. 22 Huangjueping Alley, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buys: Vintage loose-fit cotton \u0026 linen dresses, hand-woven hemp rope sandals, frog-button cotton \u0026 linen cardigans. An independent local Chongqing brand showcasing a casual, natural style with carefully selected breathable cotton and linen fabrics\u2014ideal for staying comfortable during Chongqing\u0027s summers. Decorated with vintage charm, many local artistic youths and creative culture lovers come here specifically for Zen-inspired, hipster-style outerwear and accessories.", "name": "Ciqikou Ancient Street Cotton \u0026 Linen Apparel", "transport": "CRT Line 1 Ciqikou Station, Exit 1, approx. 10 mins walk"}, {"address": "No. 45 Heng Street, Ciqikou, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buys: Vegetable-tanned leather vintage saddle bags, hand-stitched genuine leather boots, carved leather coin purses. Co-founded by young local Chongqing designers and veteran leather artisans, this leather goods store features durable, raw leather that develops a richer patina over time. Offering on-site engraving services, customers can pick up unique, comfortable leather shoes and handcrafted bags packed with Mountain City character.", "name": "Mountain City Original Handmade Leather \u0026 Shoes Studio", "transport": "CRT Line 1 Ciqikou Station, Exit 2, approx. 6 mins walk"}, {"address": "No. 88 Jinsha Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buys: Botanical indigo-dyed shawls, tie-dyed canvas tote bags, Sichuan-Chongqing motif scarves. Blending Chongqing\u0027s traditional tie-dyeing techniques with modern clothing, this local workshop uses natural plant dyes for unique, one-of-a-kind fabric patterns. Beyond selling regional shawls and totes, they offer mini tie-dye workshops, making it a top pick for artisanal cultural souvenirs.", "name": "Bayu Indigo Dye Ethnic Clothing Workshop", "transport": "CRT Line 1 Ciqikou Station, Exit 1, approx. 12 mins walk"}, {"address": "No. 12, Zone B, Underground Shopping Center, Three Gorges Square, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buys: Korean-style tailored blazers, high-waisted slim jeans, designer chain crossbody bags. Located in the core shopping district of Shapingba, this popular affordable boutique is a secret haven for local college students and young professionals seeking trendy casual outfits. Inventory is updated weekly to stay aligned with the latest Korean and local Chongqing fashion trends, offering diverse styles at highly competitive prices.", "name": "Shapingba Three Gorges Square Fashion Boutique", "transport": "CRT Line 1 Shapingba Station, Exit 1, approx. 3 mins walk"}, {"address": "No. 67 Main Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buys: Classical satin embroidered soft-sole shoes, tiger-head embroidered baby shoes, embroidered soft slippers. A traditional Chongqing shoe shop with decades of history, dedicated to multi-layered cloth soles and delicate embroidery craftsmanship. The footwear is comfortable, breathable, and rich in Oriental aesthetics, popular among both local neighbors and tourists as indoor loungewear or accessory shoes for Hanfu costumes.", "name": "Chongqing Traditional Handmade Embroidered Shoes Shop", "transport": "CRT Line 1 Ciqikou Station, Exit 1, approx. 7 mins walk"}, {"address": "No. 89 Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buys: Retro chunky sneakers, lightweight water-resistant backpacks, minimalist leather sling bags. Situated next to Shapingba Pedestrian Street, this curated local shoe and bag select shop caters to fashion-conscious youth looking for personalized style. Featuring trendy shoes and minimalist bags from various Chinese independent designer brands, it offers top quality and great design, making it a favorite among Chongqing streetwear enthusiasts.", "name": "Shapingba Trendy Shoes \u0026 Designer Bags Store", "transport": "CRT Line 1 Shapingba Station, Exit 3, approx. 5 mins walk"}, {"address": "No. 15 Alley next to Baolun Temple, Ciqikou, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buys: Traditional ink-wash style crossbody bags, tie-dye drawstring pouches, embroidered Chongqing landmark canvas totes. This cozy handcraft studio is famous for canvas bags featuring Chongqing Mountain City motifs, blending creative embroidery with traditional tie-dyeing. Durable, spacious, and adorned with eye-catching designs, these bags are hugely popular among young tourists and students.", "name": "Ciqikou Tie-Dye Canvas Bag Handcrafted Studio", "transport": "CRT Line 1 Ciqikou Station, Exit 1, approx. 11 mins walk"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 74 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Original Sweet Mahua, Salt \u0026 Pepper Mahua, Spicy \u0026 Numbing Mahua. Chen Changyin Mahua is the most iconic century-old souvenir brand in Ciqikou Ancient Town, drawing long queues of eager tourists daily. Made using traditional handcrafted techniques, these fried dough twists are sweet, crispy, and don\u0027t stick to your teeth. The spicy flavor seamlessly blends Chongqing\u0027s signature Sichuan pepper aroma\u2014savory, spicy, and satisfyingly numbing. It is the most authentic local snack to bring home for friends and family.", "name": "Chen Changyin Mahua Main Store", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 8 minutes."}, {"address": "No. 84 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Black Sesame Mahua, Honey Mahua, Seaweed Mahua. Another famous mahua shop located on Ciqikou Main Street, boasting its own loyal fanbase alongside Chen Changyin. Xia Zongbi focuses on innovative flavors and an ultra-crispy texture. The black sesame flavor is rich and aromatic, while the honey option is sweet without being cloying. Freshly fried and sold on the spot, they are served pleasantly warm\u2014a specialty treat you shouldn\u0027t miss when visiting the ancient town.", "name": "Xia Zongbi Chen Mahua", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 8 minutes."}, {"address": "No. 120 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Tallow Hot Pot Base, Vegetable Oil Hot Pot Base, Sichuan Spicy Fish Seasoning. Qiaotou Hot Pot is a century-old Time-Honored Brand in China, with a local saying: \u0027Pick Qiaotou for your broth base for a guaranteed delicious feast.\u0027 This flagship store in the ancient town offers various conveniently packaged hot pot bases and famous Sichuan dish seasonings. The beef tallow base is exceptionally rich and hearty, allowing visitors to easily recreate authentic Chongqing spicy hot pot at home.", "name": "Qiaotou Hot Pot Base Flagship Store (Ciqikou)", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 10 minutes."}, {"address": "No. 102 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature Braised Roasted Duck, Spicy Duck Tongues, Vacuum-Packed Duck Feet. Zhang Yazi is a famous Chongqing braised delicacy brand legendary for selling a million ducks a year. Its secret braising broth is simmered with dozens of traditional Chinese herbs. The duck meat is deeply savory, firm, chewy, and pleasantly non-greasy. Portable vacuum-sealed gift boxes are available, making it a fantastic snack for pairing with drinks or casual munching.", "name": "Zhang Yazi Braised Duck (Ciqikou Store)", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 10 minutes."}, {"address": "No. 22 Ciqikou Heng Street, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: \u0027Li\u0027s Spicy Degree\u0027 Hot Pot Base, Dezhuang Three Treasures Gift Box, Green Pepper Fish Seasoning. Dezhuang is a giant in Chongqing\u0027s restaurant industry that pioneered the \u0027Dezhuang Spice Scale\u0027 (higher degrees mean hotter spice), making it easy even for mild-spice lovers to pick their perfect hot pot base. Stylishly packaged, their 45\u00b0 and 52\u00b0 Li\u0027s spicy beef tallow bases are top-sellers and quintessential Chongqing souvenirs.", "name": "Dezhuang Hot Pot Base Specialty Shop", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 2) and walk for about 7 minutes."}, {"address": "No. 15 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Traditional Salt \u0026 Pepper Peach Slices, Sweet Walnut Peach Slices, Bazhen Cake. Hechuan Peach Slices are a famous traditional Chongqing delicacy, and Sanminzhai is its century-old flagship brand. Sliced paper-thin, these soft and delicate rice cakes melt in your mouth with a rich aroma of walnuts and sesame seeds. The salt \u0026 pepper flavor offers a unique sweet-and-savory twist\u2014a timeless heritage pastry loved by all ages.", "name": "Sanminzhai Hechuan Peach Slice Cake (Ciqikou Store)", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 5 minutes."}, {"address": "No. 15, Lane 1, Huangjueping, Ciqikou, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Mini Sorghum Baijiu Bottles, Fruit Cube White Peach Sorghum Spirits, Creative Mini Liquor Gift Sets. Jiangxiaobai is a famous trendsetting Baijiu brand originating from Chongqing, wildly popular among youth for its clean, refreshing taste and trendy quote-printed packaging. Featuring sleek modern design, this experience store offers free tastings of various sorghum liquors and fruit-flavored spirits. Its hip, artisanal packaging makes it a great spot for picking up souvenirs.", "name": "Jiangxiaobai Experience Store (Ciqikou)", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 9 minutes."}, {"address": "No. 58 Ciqikou Main Street, Shapingba District, Chongqing", "feature": "\u2b50 4.1 stars | Must-Buy List: Freshly Pressed Original Ginger Candy, Mint Ginger Candy, Sesame Maltose Candy. Strolling through the old streets of Ciqikou, you\u0027ll often catch artisans performing the traditional craft of pulling and shaping warm ginger candy. Using locally selected fresh ginger and premium maltose, this shop insists on traditional handcrafted pulling techniques. The candy is warmly soothing, sweet with a delightful spicy kick, and deliciously rich\u2014a healthy, authentic traditional snack showcasing local folk culture.", "name": "Ciqikou Handcrafted Ginger Candy", "transport": "Take Metro Line 1 to Ciqikou Station (Exit 1) and walk for about 6 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 3 Hamao Road, Microelectronics Park, Shapingba District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buy list: Coach classic signature bags, discounted Nike sneakers, Armani tailored suits. This open-air, Italian-style town is the premier OUTLET shopping paradise in Shapingba District, Chongqing, featuring hundreds of renowned international and luxury domestic brands. Enjoy incredible discounts as low as 70% off. The plaza\u0027s fountains and Italian architectural scenery are popular photo spots, making it a favorite among locals and tourists alike.", "name": "Florentia Village Chongqing Luxury Outlet", "transport": "Take Chongqing CRT Line 1 to Weidianyuan Station, then transfer to a shuttle bus or taxi for about 5 minutes."}, {"address": "No. 1 Zhannan Road, Shapingba District, Chongqing", "feature": "\u2b50 4.8 stars | Must-buy list: Chongqing-exclusive cultural planner notebooks, local designer streetwear T-shirts, special spicy snack gift boxes. As China\u0027s first large shopping mall built directly above a high-speed railway station (Shapingba Station) integrating bullet trains and subway lines, it brings together hundreds of famous international and local fashion, cosmetics, and lifestyle brands. Bright, multi-layered, and stylish, it is Shapingba District\u0027s hottest modern shopping destination.", "name": "Longfor Chongqing Jinsha Paradise Walk", "transport": "Take Chongqing CRT Line 1 or Line 9 to Shapingba Station, directly connected to the underground mall."}, {"address": "No. 44 Xiaolongkan New Street, Shapingba District, Chongqing", "feature": "\u2b50 4.3 stars | Must-buy list: Chongqing local brand silk scarves, time-honored skincare creams, Chongqing specialty tea gift boxes. Chongqing Department Store (Chongbai) is Chongqing\u0027s most iconic time-honored local department store, holding shopping memories for generations of locals. Gathering many high-quality domestic women\u0027s and men\u0027s wear brands alongside local specialty counters, it offers budget-friendly discounts and thoughtful service\u2014an excellent place to experience old-school department store charm and purchase local goods.", "name": "Chongqing Department Store Shapingba Branch", "transport": "Take Chongqing CRT Line 1 to Xiaolongkan Station, about a 3-minute walk."}, {"address": "No. 85 Xiaolongkan New Street, Three Gorges Square, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buy list: Local domestic cosmetics and skincare, Chongqing designer women\u0027s shoes, high-mountain cold valley green tea. New Century Department Store is a highly reputable local chain in Chongqing; its Shapingba branch is situated in the heart of Three Gorges Square commercial area. Featuring a wide array of local and domestic brands alongside a large supermarket, you can pick up modern trendy apparel and authentic Chongqing specialties all in one stop.", "name": "New Century Department Store Shapingba Branch", "transport": "Take Chongqing CRT Line 1 to Shapingba Station (Exit 1), about a 2-minute walk."}, {"address": "Underground Commercial Street, Three Gorges Square, Shapingba District, Chongqing", "feature": "\u2b50 4.2 stars | Must-buy list: Handcrafted Korean-style accessories from independent boutiques, affordable trendy apparel, unique handmade canvas bags. This is Shapingba\u0027s most distinctive and youthful underground shopping complex, housing hundreds of independently owned fashion boutiques, cosmetics stalls, and quirky shoe \u0026 bag shops. Famous for its budget-friendly prices and rapidly updated styles, it\u0027s a bargain-hunting haven for local students and youth.", "name": "Three Gorges Square Underground Fashion Mall", "transport": "Take Chongqing CRT Line 1 to Shapingba Station, directly accessible through the underground mall."}, {"address": "No. 108 Zheng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade double-sided Shu embroidery silk fans, traditional Bayu lacquer tea cups, Shu brocade embroidered coin purses. Located in Ciqikou Ancient Town, this boutique offers exquisite local heritage crafts, specializing in national intangible cultural heritage \u0027Shu Embroidery\u0027 and traditional Bayu handicrafts. Every item is handcrafted by local artisans, effortlessly blending traditional embroidery art with contemporary living aesthetics.", "name": "Ciqikou Shu Embroidery \u0026 Chongqing Crafts Flagship Store", "transport": "Take Chongqing CRT Line 1 to Ciqikou Station (Exit 1), about an 8-minute walk."}, {"address": "No. 60 Zheng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buy list: Handcrafted salt \u0026 pepper Chen Mahua (fried dough twists), traditional Chongqing hot pot soup base gift boxes, local shade-dried rice crispy cakes. The most legendary time-honored local specialty shop in Ciqikou Ancient Town, where you can watch master bakers expertly knead, twist, and deep-fry mahua by hand. Beyond its famous crispy dough twists, it offers a variety of authentic Chongqing gourmet souvenirs, making it a must-visit destination for tourists.", "name": "Ciqikou Chen Mahua \u0026 Yucui Gift Flagship Store", "transport": "Take Chongqing CRT Line 1 to Ciqikou Station, then walk to the core area of Zheng Street in the Ancient Town."}, {"address": "No. 22 Heng Street, Ciqikou Ancient Town, Shapingba District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buy list: Handcrafted ceramic gaiwan, Chongqing high-mountain old-tree Tuo tea, retro bamboo-woven lifestyle goods. Nestled in an alleyway of Ciqikou Ancient Town, this independent lifestyle and teaware boutique is run by local Chongqing artists. Featuring curated contemporary handcrafted teaware from surrounding ceramic kilns alongside traditional bamboo goods, its rustic, tranquil ambiance attracts visitors seeking a refined lifestyle.", "name": "Ciqikou Ancient Town Handcrafted Teaware \u0026 Lifestyle Boutique", "transport": "Take Chongqing CRT Line 1 to Ciqikou Station, then walk to Ciqikou Heng Street."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Ciqikou and Shapingba"}, "dazu_carvings": {"categories": {"cat_1": {"items": [{"address": "No. 55 Jingqu Avenue, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Must-buy list: Tongjunge Mugwort Warm Patches, Chuanxiong \u0026 Mugwort Soothing Essential Oil, Chinese Herbal Sheet Masks. Tongjunge is a century-old established pharmacy in Chongqing, with a special service outlet near the Dazu Rock Carvings scenic area. Beyond traditional Chinese herbal medicines, it combines local Chongqing herbs with modern beauty technology to create a range of natural health care products and Traditional Chinese Medicine (TCM) skincare items\u2014perfect as health and wellness gifts.", "name": "Tongjunge Pharmacy (Baoding Branch)", "transport": "Take Dazu Bus 205 to Baodingshan Rock Carvings Scenic Area Station, then walk for about 3 minutes."}, {"address": "No. 1 Hongsheng Square, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buy list: Taiji Lithospermum Ointment, Sweet Wormwood Soothing Hydrating Spray, TCM Herbal Hand Cream. Taiji Group is one of Chongqing\u0027s most iconic local pharmaceutical enterprises. Its store in downtown Dazu features a dedicated herbal skincare area. Featuring gentle moisturizing products extracted from native Bayu sweet wormwood and natural botanicals, this store embodies traditional herbal wisdom and is a must-visit local drugstore treasure trove when visiting Dazu.", "name": "Taiji Pharmacy (Dazu Hongsheng Branch)", "transport": "Take Dazu Bus 101 to Hongsheng Square Station, then walk for about 1 minute."}, {"address": "1st Floor, Seazen Wuyue Plaza, Xianguo Avenue, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Dendrobium Alpine Plant Firming Essence, Purple Ganoderma Multi-Effect Repair Mask, Alpine Camellia Moisturizing Cream. This botanical skincare specialty store, famous for its high-altitude plant extracts, is extremely popular in Dazu Wuyue Plaza. Emphasizing organic alpine ingredients and minimalist skincare concepts, its signature Dendrobium series is deeply loved by women. The store offers friendly skin consultations and product trials.", "name": "DR.PLANT (Dazu Wuyue Plaza)", "transport": "Take Dazu Bus 201 to Wuyue Plaza Station, and enter the 1st floor of the shopping mall."}, {"address": "1st Floor, Dazu Commercial Center, No. 88 Longzhong Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buy list: Taiji Ancient Formula Youth Preserving Dual Essence, Delicate Hydrating Crystal Cream, Taiji T-Zone Mud Mask. As a leading premium Chinese herbal skincare brand, Herborist seamlessly blends ancient TCM beauty formulas with modern technology. Located in Dazu\u0027s core commercial area, this counter offers professional skin analysis and TCM skincare regimens. The products come in elegant, vintage packaging and deliver noticeable skin results.", "name": "Herborist Counter (Dazu Shopping Center)", "transport": "Take Dazu Bus 102 to Longzhong Road Station, then walk for about 2 minutes."}, {"address": "No. 32 Beishan Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buy list: Bayu Herbal Foot Bath Packs, TCM Anti-Acne Soothing Ointment, Pearl Seven-White Whitening Powder Mask. Guoda Pharmacy\u0027s flagship store in Dazu features a dedicated TCM beauty and wellness zone. Combining traditional Bayu herbal culture, it offers handcrafted TCM mask powders and natural beauty products, making it very popular among locals and travelers seeking natural beauty remedies.", "name": "Guoda Pharmacy Hanfang Beauty (Longgang Branch)", "transport": "Take Dazu Bus 105 to Beishan Road Intersection Station, then walk for about 3 minutes."}, {"address": "Beauty Area, 2nd Floor, Seazen Wuyue Plaza, Xianguo Avenue, Dazu District, Chongqing", "feature": "\u2b50 4.9 stars | Must-buy list: Soft-Blooming Peach Blossom Loose Powder, Engraved Lipstick, Silk Powder Compact. Famous worldwide for its \u0027Oriental Aesthetics\u0027, this brand\u0027s counter is decorated in a classic Chinese garden style. Its products combine traditional Chinese carving craftsmanship with natural floral skincare benefits. The exquisitely carved lipsticks and ultra-fine loose powders are hot-selling items that offer incredible visual appeal and make excellent souvenirs.", "name": "Florasis Oriental Beauty Counter (Dazu)", "transport": "Take Dazu Bus 201 to Wuyue Plaza Station, then take the escalator to the 2nd floor."}, {"address": "No. 12 Laojie (Old Street), Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Must-buy list: Rice Water Herbal Oil-Control Shampoo, Panax Notoginseng Hair Growth \u0026 Strengthening Serum, Polygonum Multiflorum Herbal Handcrafted Hair Soap. Located near the Dazu Rock Carvings tourist area, this boutique specializes in hair and scalp care infused with regional herbs from Yunnan, Guizhou, and Sichuan. Featuring scalp care products extracted from Panax notoginseng and local herbs, they effectively balance scalp oil while offering a relaxing natural herbal aroma.", "name": "Yangyuanqing Scalp Care Boutique (Baoding)", "transport": "Take Dazu Bus 205 to Baoding Old Street Station, then walk for about 2 minutes."}, {"address": "1st Floor, Dazu New World Plaza, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | Must-buy list: Domestic Herbal Repair Sheet Masks, Bird\u0027s Nest Nourishing Hydrating Spray, Tea Tree Anti-Acne Essential Oil. A popular personal care and beauty chain store with a spacious branch in Dazu New World Plaza. Alongside international beauty brands, it features a special section for local Chinese cosmetics and regional drugstore skincare products. With a wide variety of goods and frequent discounts, it is a great spot to restock skincare supplies.", "name": "Watsons (Dazu New World Plaza)", "transport": "Take Dazu Bus 108 to Dazu New World Plaza Station, then walk for about 1 minute."}], "name": "Local Iconic Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 128 Longzhong Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade Shu embroidery shoulder bags, vintage double-sided embroidered pouches, exquisite embroidered makeup bags. This local independent handmade shop seamlessly blends traditional Chongqing Shu embroidery craftsmanship with modern functional design, making it a favorite among both locals and tourists. The fabric shoes and bags are all hand-stitched by senior local artisans. The embroidery patterns are stunning, cleverly incorporating lotus flowers and flying apsaras elements from the Dazu Rock Carvings, making them both collectible works of art and practical everyday items.", "name": "Dazu Shu Embroidery \u0026 Handmade Bag Workshop", "transport": "Take Dazu Bus 101 to Longzhong Road Station, then walk about 200 meters."}, {"address": "No. 35 Old Street, Baoding Town, Dazu District, Chongqing (Outer Old Street area of Baodingshan Scenic Area)", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional bamboo/straw woven handbags, breathable summer bamboo \u0026 rattan sandals, vintage bamboo crossbody bags. Utilizing high-quality local bamboo from Dazu and traditional rattan weaving techniques, this unique specialty store crafts distinctive shoes and bags. Locals highly recommend their lightweight and durable bamboo totes, which feature a simple, elegant design and a faint bamboo fragrance\u2014perfect for summer, indie/hipster styles, or traditional Hanfu outfits.", "name": "Zhuyun Bamboo Handwoven Shoes \u0026 Bags", "transport": "Take Dazu Bus 205 (Scenic Route) to Baodingshan Parking Lot Station, then walk to Baoding Old Street."}, {"address": "No. 88, Section 2, Wuxing Avenue, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Zen-style cotton-linen shirts with Dazu Rock Carvings elements, Chinese-style embroidered shawls, canvas bags with carved lotus motifs. As a leading local brand for original cultural and creative clothing in Dazu, this store specializes in Chinese-style apparel and bags infused with Dazu Rock Carvings art. Most garments are made from natural cotton and linen, offering breathable comfort and a rich Oriental Zen charm. It is a must-visit boutique for local fashion enthusiasts and traveling visitors.", "name": "Impression Dazu Cultural \u0026 Creative Apparel", "transport": "Take Dazu Bus 105 to Changzhou Ancient City Station, then walk about 150 meters."}, {"address": "No. 16 Longjing Road, Dazu District, Chongqing (Inside Longgang Pedestrian Street)", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade classic embroidered flats, New Chinese-style soft-soled cloth shoes, premium bridal embroidered cloth shoes. A specialty shop focusing on traditional Chongqing handmade embroidered shoes and soft-soled cloth shoes, carrying forward generations of shoemaking craftsmanship. Thoughtfully optimized for modern foot shapes, the soft soles provide incredible comfort while the embroidered patterns look vivid and lifelike. Many local women and traditional style lovers come here specifically for custom-made pairs.", "name": "Zuzhixiu Traditional Embroidery Shoes", "transport": "Take Dazu Bus 102 to Longgang Pedestrian Street Station, then walk directly into the pedestrian street."}, {"address": "Shop 1015, 1st Floor, Wanda Plaza, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Smart urban blazers, designer-cut dresses, printed silk scarves. As a representative high-end local women\u0027s fashion boutique in Chongqing, it carries products from independent designer brands across Sichuan and Chongqing as well as local premium handbag lines. Offering professional personal styling advice, their garments are tailored to flatter Asian body shapes with exceptional quality, making it very popular among local working professionals and fashionable women in Dazu.", "name": "CQ Local Women\u0027s Fashion Boutique - PSALTER", "transport": "Take Dazu Bus 201 to Wanda Plaza Station."}, {"address": "No. 142 Tangxiang Road, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Vegetable-tanned vintage leather handbags, hand-stitched genuine leather ankle boots, handmade leather coin purses. This is an independent leather workshop and shoe/bag boutique that emphasizes 100% hand-polishing and hand-stitching. The owner, a veteran local leather artisan, carefully selects top-grain cowhide and offers custom engraving services for leather shoes and bags. Every piece radiates a rich handcrafted feel and unique, warm patina.", "name": "Dazu Custom Leather Craft \u0026 Shoes", "transport": "Take Dazu Bus 108 to Tangxiang Road Station, then walk about 100 meters."}, {"address": "No. 215 Longgang Road, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Business casual leather men\u0027s shoes, stylish lightweight women\u0027s leather bags, comfortable walking soft-soled women\u0027s shoes. Red Dragonfly is an iconic national shoe and bag brand in China. Operating in Dazu for many years, it has earned a stellar reputation. The store updates its styles quickly and is known for high-quality leather, comfortable wear, and durability\u2014making it a go-to physical shop for locals buying everyday work and casual footwear and bags.", "name": "Red Dragonfly Shoes \u0026 Bags Dazu Longgang Store", "transport": "Take Dazu Bus 101 or 103 to Longgang Road Middle Section Station."}, {"address": "No. 45 Beijie, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Genuine leather women\u0027s tote bags, lightweight casual sneakers, high-quality genuine leather belts. Yearcon is a highly renowned, long-established chain flagship store for leather shoes and bags in Dazu District. The spacious retail space offers a wide variety of leather shoes, casual footwear, and leather accessories. With affordable pricing and consistent quality, it is deeply loved and trusted by local families and shoppers of all ages.", "name": "Yearcon Shoes \u0026 Bags Dazu Flagship Store", "transport": "Take Dazu Bus 102 to Beijiekou Station, then walk about 80 meters."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1st Floor, Visitor Center Commercial Street, Dazu Rock Carvings Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Selenium-rich black peanuts, black sesame paste gift boxes, healthy black rice wine. The \u0027Dazu Black Five Treasures\u0027 are very famous local agricultural specialties, including black rice, black beans, black sesame, black peanuts, and black fungus. Located in the scenic area\u0027s visitor center commercial street, this specialty shop offers various processed products organically grown by local farmers. Beautifully packaged and highly nutritious, they are the top choice for healthy gifts for elders, family, and friends.", "name": "Dazu Black Five Treasures Specialty Shop", "transport": "Take Dazu Bus Route 205 to Dazu Rock Carvings Visitor Center Station, then walk about 2 minutes."}, {"address": "No. 128 Longshui Road, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: 3-year aged Dazu Dongcai (preserved mustard greens) in clay jars, Dongcai braised pork seasoning packs, handmade spicy Dongcai sauce. Known as the essence of the \u0027Hometown of Chinese Dongcai\u0027, Dazu Dongcai is cured, jarred, and fermented for years, resulting in a rich aroma and crisp texture. This historic shop adheres strictly to traditional handmade techniques, making it a favorite among local Chongqing residents and foodies. It is an excellent culinary gift for steaming meat, stir-frying, or making soups.", "name": "Dazu Dongcai Traditional Handcrafted Shop", "transport": "Take Dazu Bus Route 201 to Longshui Bus Station, then walk about 5 minutes."}, {"address": "1st Floor Cultural \u0026 Creative Exhibition and Sales Area, Dazu Rock Carvings Museum, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Thousand-Hand Guanyin gold foil bookmarks, Reclining Buddha aroma diffuser stones, rock carving rubbing art gift sets. Located inside the Dazu Rock Carvings Museum, this officially operated cultural creative shop integrates precious Buddhist art and historic elements into modern everyday items. The products boast exceptional quality and high collectible value, making them a must-buy memorable souvenir for almost every visitor.", "name": "Dazu Rock Carvings Cultural and Creative Flagship Store", "transport": "Walkable directly inside the Baodingshan Scenic Area of Dazu Rock Carvings."}, {"address": "No. 88 Wujin Road, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Dengjia traditionally forged kitchen knives, Longshui precision-forged fruit knives, multi-functional kitchen shears. Longshui Town in Dazu is famous as China\u0027s hometown of hardware, and \u0027Dengjia Knife\u0027 is a renowned local brand boasting over a century of hand-forging history. Known for being razor-sharp, durable, and crafted from high-quality steel, these kitchen knives are a legendary local Chongqing practical souvenir favored by homemakers and professional chefs alike.", "name": "Dengjia Knife Dazu Longshui Flagship Store", "transport": "Take Dazu Bus Route 201 or 202 to Longshui Hardware Market Station, then walk about 3 minutes."}, {"address": "No. 15 Baoding Old Street, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Handmade small mahua (fried dough twists) gift boxes, carved peach slice pastries, salt \u0026 pepper shortbread biscuits. Located on Baoding Old Street, this shop freshly hand-frys fried dough twists daily, offering a crispy, fragrant, non-greasy texture. Beyond traditional mahua, their carved peach slice pastries are soft and sweet, and the unique packaging featuring rock carving patterns makes this a great spot for snacks to eat on the go or take home.", "name": "Baodingshan Heritage Mahua Pastry Shop", "transport": "Located in the Old Street commercial area of Baodingshan Scenic Area; about a 5-minute walk from the scenic area exit."}, {"address": "No. 12, Zone B, Exit Commercial Street, Baoding Town Scenic Area, Dazu District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Pure wild kudzu root (pueraria) powder, kudzu pastry gift boxes, sugar-free kudzu tea. The mountainous climate of Dazu is ideal for growing kudzu root. The local powder is fine and pure, turning into a translucent gel when brewed, known for its heat-clearing and detoxifying properties. This specialty shop focuses on handmade kudzu products harvested from the Dazu mountains, offering convenient, compact packaging that makes perfect wellness hot drinks for the office.", "name": "Dazu Kudzu Root Powder Specialty Shop", "transport": "Located within the exit commercial street of Baodingshan Scenic Area, Dazu Rock Carvings; accessible on foot."}, {"address": "No. 2, Hongsheng Square Commercial Street, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature air-dried roast duck vacuum packs, spicy duck tongues, marinated duck feet. Zhang Yazi is a famous time-honored braised delicacy brand in Chongqing, renowned for being \u0027dry-fragrant, numbingly spicy, and wonderfully chewy\u0027. Located near the junction of the scenic area and downtown, this branch provides vacuum sealing services so visitors can easily take home authentic Bayu-style Chongqing flavors.", "name": "Zhang Yazi Braised Duck Dazu Rock Carvings Store", "transport": "Take Dazu Bus Route 101 or 105 to Hongsheng Square Station, then walk about 1 minute."}, {"address": "No. 240, Middle Section of Wuxing Avenue, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Gaosheng in-shell roasted peanuts, salt \u0026 pepper crispy peanuts, handmade rapeseed oil chili sauce. Gaosheng Peanuts are a National Geographical Indication Product from Gaosheng Town in Dazu District, famous for their large kernels, rich oil content, and intense aroma. The experience store showcases the peanut processing method and offers freshly roasted samples, making it an authentic souvenir that traditional nut snack lovers should not miss.", "name": "Dazu Gaosheng Peanut Specialty Experience Store", "transport": "Take Dazu Bus Route 108 to Wuxing Avenue Station, then walk about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 108 Wujin Road, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Dengjia Knife Santoku kitchen knives, Dazu pickled mustard greens gift sets, and Chongqing time-honored Chen Mahua (fried dough twists). Located in the core commercial hub of Dazu District, this large-scale comprehensive department store and shopping mall brings together traditional local specialties and modern fashion brands. Not only does it feature counter displays for classic Chongqing and Dazu brands where you can buy authentic Longshui hand-forged kitchen knives and local Dazu pickled mustard greens, but it also offers rich dining and leisure facilities. It is the top choice for tourists to shop for local specialties and relax after visiting the Dazu Rock Carvings.", "name": "Dazu Impression Mall", "transport": "Take Dazu District Bus Route 201 to Wujin Lukou Station, then walk for about 3 minutes."}, {"address": "No. 68 Xingguang Avenue, Longshui Town, Dazu District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Dengjia traditional hand-forged household chef\u0027s knives, Longshui special household tailoring scissors, and deluxe traditional cultural \u0026 creative cutlery gift boxes. Dengjia Knife is an iconic brand representing Dazu Longshui\u0027s traditional metal forging craft, inheriting over a century of blacksmithing mastery. This flagship store specializes in various high-performance kitchen knives and handmade scissors known for their ultra-sharp, durable blades\u2014a must-have kitchen tool in every local home and a uniquely practical souvenir favored by tourists visiting Dazu.", "name": "Dengjia Knife Dazu Flagship Store", "transport": "Take Dazu Bus Route 202 to Xingguang Avenue Station, then walk for about 2 minutes."}, {"address": "No. 300 Hemao Road, Shapingba District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Coach classic signature handbags, Nike high-value running shoes, and Michael Kors stylish backpacks. A premier Italian-style large outlet shopping center in Chongqing, easily accessible from Dazu District. Designed in the architectural style of the Italian Renaissance, it gathers over a hundred internationally renowned luxury and sports lifestyle brands, offering amazing year-round discounts as low as 80% off. It is the best choice for scheduling a luxury shopping spree on your trip to the Dazu Rock Carvings.", "name": "Florentia Village Chongqing Luxury Designer Outlet", "transport": "Take a long-distance coach or high-speed rail from the Dazu Rock Carvings scenic area to Chongqing West Railway Station, then transfer to an airport bus or direct shuttle line; or drive via G93 Chengdu-Chongqing Ring Expressway for about 50 minutes."}, {"address": "Inside the Visitor Center, Dazu Rock Carvings Scenic Area, Baoding Town, Dazu District, Chongqing", "feature": "\u2b50 4.9 stars | Must-Buy List: Exquisite gold foil ornaments of the Thousand-Hand Guanyin, traditional rock carving art rubbings, and Reclining Buddha creative bookmark gift sets. This is an officially authorized flagship shop located inside the Dazu Rock Carvings scenic area, seamlessly blending millennial stone carving art with modern lifestyle aesthetics. The store sells exclusive artistic merchandise inspired by the Baodingshan and Beishan carvings. Elegant and deeply rooted in cultural heritage, it is a souvenir spot you shouldn\u0027t miss when visiting Dazu.", "name": "Dazu Rock Carvings Cultural \u0026 Creative Flagship Store", "transport": "Located inside the Visitor Center of Dazu Rock Carvings Scenic Area; take Dazu Bus Route 205 (Scenic Express) directly to the entrance."}, {"address": "No. 1 Feifeng Road, Tangxiang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Chongqing handmade hot pot soup base, Dazu high-mountain kudzu root powder gift sets, and Shu brocade handcrafted silk scarves. The newest and largest modern shopping center in Dazu District, perfectly integrating fashion trends with local Chongqing Bayu culture. The mall features a spacious Chongqing specialty souvenir zone and independent local fashion design boutiques, allowing you to buy spicy hot pot base, local agricultural products, and quality lifestyle goods all in one bright, comfortable shopping environment.", "name": "Dazu Wuyue Plaza", "transport": "Take Dazu Bus Route 101 or 105 to Wuyue Plaza Station."}, {"address": "No. 8 Biqing North Road, Bishan District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted Armani men\u0027s suits, Adidas Originals sneakers, and premium local Chongqing tea set gift boxes. Sasseur is a famous Chinese outlet brand located in Bishan District to the east of Dazu, serving as a massive discount shopping paradise in Western Chongqing. Built in a super-outlet lifestyle concept, it hosts hundreds of leading domestic and international brands offering deep discounts year-round. It also features a Chongqing traditional handicraft exhibition and sales area, making it an ideal stop on your journey home to hunt for discounted designer goods and special souvenirs.", "name": "Sasseur Outlet Bishan Chongqing", "transport": "Take the high-speed train from Dazu to Bishan Station, then transfer to Bishan Bus Route 112 directly; or drive via G5013 Yurong Expressway for about 40 minutes."}, {"address": "No. 66 Longgang Road, Longgang Subdistrict, Dazu District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Feitian Brand Longshui hand-forged chef\u0027s knives, traditional crocks of Dazu pickled winter mustard, and Guchang dried pork jerky souvenirs. A long-standing local commercial department store in Dazu District rich with authentic everyday life atmosphere. It gathers a huge selection of traditional local vendor stalls and small independent shops, serving as a hub for locals buying daily necessities and regional specialties. Here, tourists can buy authentic traditionally cured Dazu winter greens and time-honored Longshui hardware products at extremely reasonable prices.", "name": "Dazu Commercial Trade Center Department Store", "transport": "Take Dazu Bus Route 102 or 108 to Shangmao Zhongxin (Commercial Trade Center) Station."}, {"address": "No. 89 Jinyu Avenue, Yubei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Burberry classic check trench coats, Tommy Hilfiger casual polo shirts, and Polo Ralph Lauren knitwear. A long-established and highly rated outlet mall in Chongqing, featuring a wide range of top-tier European and American luxury brands and sports lifestyle labels. The plaza frequently hosts large-scale brand promotional sales with steep discounts. For visitors traveling to Dazu and downtown Chongqing, it is a fantastic destination to pick up incredible values on designer apparel and fashion accessories.", "name": "Bailian Chongqing Outlets Plaza", "transport": "Take a long-distance coach or high-speed rail from Dazu to downtown Chongqing, transfer to Chongqing Rail Transit Line 3 to Jinyu Station, and walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dazu Rock Carvings Scenic Area"}, "eling_liziba": {"categories": {"cat_1": {"items": [{"address": "No. 136 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Tongjingge Herbal Pearl Powder, Panax Notoginseng Herbal Repair Face Cream. As a famous century-old pharmacy in Chongqing, Tongjingge not only offers professional medicines but its self-developed Chinese herbal skincare products are also the insider beauty secrets of local Chongqing residents. The herbal pearl powder features an ultra-fine texture, which pairs exceptionally well with their natural botanical creams to combat dry weather\u2014radiating the deep wisdom of traditional Chinese beauty wellness.", "name": "Tongjingge Pharmacy (Eling Main Street Branch)", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Heping Mugwort Thermal Care Patch, Old Mountain City Peppermint Soothing Moisturizing Balm. Heping Pharmacy is a well-established local pharmacy chain with a massive market share in Chongqing. Located near the Liziba scenic area, this branch features a dedicated section for local herbal skincare and Traditional Chinese Medicine (TCM) cosmetics alongside traditional medicines. The peppermint balm uses natural ingredients, offering remarkable skin-soothing, mosquito-repelling, and swelling-relieving effects\u2014a super practical souvenir for travelers.", "name": "Heping Pharmacy (Liziba Anti-Japanese War Heritage Park Branch)", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, then walk for about 3 minutes."}, {"address": "1st Floor, Building H, TESTBED2 Arts \u0026 Cultural Park, No. 142 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Chongqing Camellia Nourishing Essence Oil, Foggy City Morning Dew Solid Perfume. Tucked away inside the TESTBED2 Arts \u0026 Cultural Park, this local independent boutique beauty studio specializes in vegan skincare and fragrances crafted from local Chongqing plant extracts. Carefully selected camellia and high-mountain botanicals power their nourishing yet non-greasy serum oil, while the solid perfume captures the atmospheric scents of Chongqing\u0027s misty morning dew\u2014a huge favorite among young women and hipsters.", "name": "Yinshan Botanical Beauty \u0026 Fragrance (TESTBED2 Branch)", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station (Exit 2), then walk for about 10 minutes."}, {"address": "No. 108-3 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Green Sichuan Pepper Anti-Acne Soothing Sheet Mask, Chuanxiong Circulation Foot Bath Pack. This unique local beauty house merges Chongqing\u0027s native flora with modern technology. Its star product is the anti-acne facial mask infused with local green Sichuan pepper extract. Rich in natural antibacterial properties while remaining gentle and non-irritating, it redefines the traditional perception of peppercorns into an exclusive beauty experience brimming with Mountain City flavor.", "name": "Old Mountain City Herbal Cosmetics Gallery (Liziba Store)", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station (Exit 2), then walk for about 4 minutes."}, {"address": "No. 98 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Taiji Gastrodia Nourishing Mask, Taiji Herbal Lip Balm. Taiji Group is a prominent pharmaceutical giant in Chongqing, and the cosmeceutical-grade skincare products sold at its pharmacies enjoy an excellent reputation locally. Featuring high-purity herbal extracts and gentle formulas, its Gastrodia (Tianma) skincare line is highly praised for skin tightening and repair\u2014affordable, safe, and trustworthy.", "name": "Taiji Pharmacy (Eling Branch)", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station (Exit 1), then walk for about 3 minutes."}, {"address": "1st Floor, Building A, TESTBED2 Arts \u0026 Cultural Park, No. 142 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Florasis Loose Powder (Guochao Trend), Judydoll Single Eyeshadow. Specially designed for the TESTBED2 Arts \u0026 Cultural Park, this Watsons features a chic industrial decor. Unlike standard chain branches, it expands the dedicated counters for trending domestic C-beauty (Guochao) brands and offers an extensive makeup trial zone where you can shop all the latest and hottest cosmetics and cosmeceuticals under one roof.", "name": "Watsons (TESTBED2 Trendy Beauty Concept Store)", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station (Exit 2), then walk for about 10 minutes."}, {"address": "No. 116 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Herbal Ganoderma Anti-Aging Cream, Centella Soothing Facial Spray. Xinhua Pharmacy is a long-standing local pharmacy deeply rooted in Yuzhong District. It features a special herbal dermacosmetics corner, offering various skincare products for sensitive skin supervised by local Chongqing pharmaceutical companies. The Centella spray provides outstanding soothing effects at budget-friendly prices, making it a go-to secret cosmeceutical spot for locals and in-the-know travelers.", "name": "Xinhua Pharmacy (Liziba Main Street Branch)", "transport": "Take Chongqing Rail Transit Line 2 to Liziba Station, then walk for about 5 minutes."}, {"address": "No. 176 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Thuja Soothing Handmade Essential Oil Soap, High-Mountain Aged Tea Polyphenol Antioxidant Serum. An independent botanical beauty shop located near the Eling cultural creative zone, dedicated to handcrafted skincare using local ingredients like Mount Jinfo aged tea and Daba Mountains Thuja (cliff cypress). The essential oil soap creates a fine lather with a unique woody forest aroma, while the antioxidant serum is specially formulated for urban night-owls\u2014all wrapped in exquisitely designed packaging.", "name": "Eling Mist Handmade Botanical Beauty Boutique", "transport": "Take Chongqing Rail Transit Line 1 to Eling Station (Exit 1), then walk for about 7 minutes."}], "name": "Local Representative Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "Building H, TESTBED2 Cultural \u0026 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Mountain City printed canvas bag, original vintage oversized shirt, handmade vegetable-tanned leather coin purse. A trendy hotspot inside TESTBED2 (Eling2), bringing together works from various local young designers in Chongqing. The clothing style blends the unique mountain terrain elements with modern street style. The canvas bags feature excellent texture and chic geometric patterns inspired by Chongqing, making it a top treasure-hunting spot for stylish youth and visitors looking for unique outfits.", "name": "31-8 Independent Designer Store", "transport": "Metro Line 1, Eling Station, Exit 1, about a 10-minute walk"}, {"address": "1F, Building B, TESTBED2 Cultural \u0026 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: 80s vintage floral shirts, handmade embroidered canvas shoes, retro vintage leather handbag. Tucked away inside the old red-brick buildings of TESTBED2, this shop specializes in nostalgic vintage clothing and upcycled fashion creations. Featuring a vast collection of classic patterned shirts and re-imagined pieces, every item tells a story, making it a beloved haunt for local vintage enthusiasts.", "name": "Island Vintage Clothing Shop", "transport": "Metro Line 1, Eling Station, Exit 1, walk along Eling Main Street for about 12 minutes"}, {"address": "Building A, TESTBED2 Cultural \u0026 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Foggy City emblem baseball cap, Chongqing typography streetwear T-shirt, co-branded water-resistant utility chest bag. A homegrown Chongqing street culture brand that transforms local buzzwords like \u0027Foggy City\u0027 and \u0027Mountain City\u0027 into visually striking streetwear and accessories. Boasting immaculate tailoring and durable, high-quality fabrics, it is the ultimate choice for picking up cool, authentic local street style.", "name": "TOUCH Mountain City Streetwear Store", "transport": "Metro Line 1, Eling Station, Exit 1, about a 10-minute walk"}, {"address": "No. 126 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade genuine leather vintage ankle boots, handcrafted vegetable-tanned leather tote bag, original brass-buckle leather key pouch. A charming shop combining a leathercraft workshop with curated footwear, celebrating the warm texture of handcrafted goods. Using high-grade top-grain cowhide, craftsmen hand-stitch every bag and shoe. Featuring simple, elegant silhouettes that gain a beautiful patina over time, it is adored by locals seeking a refined lifestyle.", "name": "Lingshang Leather Craft \u0026 Vintage Shoes", "transport": "Metro Line 1, Eling Station, Exit 2, about a 5-minute walk"}, {"address": "Near No. 88 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Botanical tie-dye scarf, ethnic jacquard crossbody bag, pure linen relaxed dress. Specializing in natural cotton and linen apparel alongside handmade ethnic accessories, this shop offers a tranquil and relaxed ambiance. The botanical tie-dye scarves and jacquard bags are limited original designs, made with breathable, comfortable fabrics infused with a Zen artistic aesthetic. Highly popular among female travelers who appreciate natural styles and slow living.", "name": "Yinshan Linen Apparel \u0026 Handcraft Workshop", "transport": "Metro Line 1, Eling Station, Exit 1, about an 8-minute walk"}, {"address": "2F, Building F, TESTBED2 Cultural \u0026 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Structural designer backpack, vintage metal-clasp crossbody bag, geometric cowhide short wallet. This independent bag boutique features modern, highly structured designs blending architectural lines with practical storage. Every bag is produced in small batches with exceptional quality, making them distinct and unlikely to clash with others. Packed with artistic flair, it is a must-visit bag shop for artists and designers visiting TESTBED2.", "name": "Time Overlap Bag \u0026 Accessory Store", "transport": "Metro Line 1, Eling Station, Exit 1, about an 11-minute walk"}, {"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing (next to Liziba Anti-Japanese War Heritage Park)", "feature": "\u2b50 4.5 stars | Must-Buy List: Liziba train-through-building T-shirt, Mountain City silhouette embroidered bucket hat, 3D structural canvas tote bag. Located right next to the iconic Liziba landmark, this store integrates Chongqing\u0027s famous \u0027monorail passing through a building\u0027 and 3D terrain into stylish clothing designs. Far from cheap souvenirs, these chic pieces feature skin-friendly fabrics and sleek prints, making them perfect fashionable keepsakes for travelers commemorating their Chongqing trip.", "name": "Foggy City Impression Concept Store", "transport": "Metro Line 2, Liziba Station, Exit 1, about a 3-minute walk"}, {"address": "No. 102 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade hemp woven shoes, lightweight straw tote, soft cotton relaxed maxi dress. Situated between Liziba and Eling, this cozy lifestyle boutique specializes in earth-tone cotton and linen clothing alongside shoes and bags made from natural materials. The woven shoes and straw bags are lightweight, portable, and exude a breezy summer vacation vibe\u2014making them ideal casual companions for strolling along Chongqing\u0027s hilly stairways.", "name": "Lazy Tree Natural Wear \u0026 Shoes", "transport": "Metro Line 2, Liziba Station, Exit B0, about a 5-minute walk"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Inside TESTBED 2 Cultural Park, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Chongqing monorail train-through-building 3D postcards, TESTBED 2 vintage hand-drawn maps, and handcrafted woodcarvings of old Chongqing architecture. Located inside the TESTBED 2 Arts \u0026 Cultural Park, this shop incorporates Chongqing\u0027s unique cyberpunk terrain and historical industrial style into creative products. It\u0027s a must-visit souvenir spot for hipsters and tourists alike.", "name": "TESTBED 2 Cultural \u0026 Souvenir Shop", "transport": "Take Metro Line 1 to Eling Station (Exit 1), then walk for about 10 minutes."}, {"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing (Next to Liziba Viewing Platform)", "feature": "\u2b50 4.5 stars | Must-Buy List: Liziba monorail train-through-building souvenir ice cream, Chongqing spicy Xiaomian gift boxes, and hand-painted train-through-building mugs. Located right next to the famous Liziba Monorail Viewing Platform, this shop offers artisan shaped ice cream snacks as well as iconic visual souvenirs and authentic local snacks.", "name": "Liziba Chongqing Impression Souvenir Store", "transport": "Take Metro Line 2 to Liziba Station (Exit 2), then walk for about 2 minutes."}, {"address": "Building H, TESTBED 2, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Mountain City Eagle Tea bags, homemade Chongqing herbal \u0026 dried fruit gift sets, and vintage botanical scented candles. Tucked away amid the greenery of TESTBED 2, this hipster boutique offers chic gift sets made with local Chongqing flora and traditional tea crafting techniques\u2014perfect for friends who appreciate lifestyle aesthetics.", "name": "Lazy Fish Time Gift Shop", "transport": "Take Metro Line 1 to Eling Station, then walk for about 12 minutes."}, {"address": "Inside TESTBED 2, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: JIANGXIAOBAI Chongqing landmark limited-edition sorghum liquor (Baijiu), fruity sorghum liquor gift boxes, and creative mini cocktail kits. As Chongqing\u0027s most iconic modern Baijiu brand, this store features limited-edition souvenirs infused with Chongqing dialect and landmark graffiti, showcasing trendy design and vibrant local youth culture.", "name": "JIANGXIAOBAI TESTBED 2 Concept Store", "transport": "Take Metro Line 1 to Eling Station (Exit 1), then walk for about 10 minutes."}, {"address": "No. 102 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Qiaotou century-old brand handmade beef tallow hotpot base, Halal clear broth hotpot base, and Chongqing Xiaomian seasoning packs. Recognized as an intangible cultural heritage of Chongqing, Qiaotou Hotpot offers authentic, rich beef tallow hotpot bases at this branch near Liziba\u2014a classic choice to take the real flavor of Chongqing home.", "name": "Qiaotou Hotpot Base Specialty Store", "transport": "Take Metro Line 2 to Liziba Station, then walk for about 5 minutes."}, {"address": "No. 88 Eling Main Street, Yuzhong District, Chongqing (Next to Eling Park Main Entrance)", "feature": "\u2b50 4.3 stars | Must-Buy List: Yuxiong Strange-Flavored Fava Beans, Zhangfei Beef Jerky, and Chen Mahua (fried dough twists) individually wrapped gift sets. Specializing in authentic local snacks from Chongqing and Sichuan, this shop brings together the best-selling classic snack brands of the past few decades. Affordable and conveniently packaged, it is the best place to pack up Mountain City flavors.", "name": "Yuweishuxiang Chongqing Local Snacks Shop", "transport": "Take Metro Line 1 to Eling Station (Exit 2), then walk for about 3 minutes."}, {"address": "Building 3, TESTBED 2, No. 141 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Chongqing nine-grid hotpot plaster diffuser ornaments, Shu embroidery tote bags, and Chongqing woven bamboo crafts. Run jointly by local young artists and craft artisans, this market features strong Chongqing local elements blended with modern craft art\u2014a fantastic place to find unique local gifts.", "name": "Mountain City Goods Handcraft Market", "transport": "Take Metro Line 1 to Eling Station, then walk for about 10 minutes."}, {"address": "No. 118 Liziba Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Diehua Brand classic strange-flavored fava beans, Chongqing Tuocha tea gift boxes, and Hechuan peach slices. Strange-flavored fava beans combine numb, spicy, sweet, salty, and savory flavors all in one\u2014a classic childhood snack for locals. The shop also sells Tuocha tea steeped in Chongqing history, ideal both for gifting and personal enjoyment.", "name": "Diehua Chongqing Strange Flavor Beans \u0026 Tea Shop", "transport": "Take Metro Line 2 to Liziba Station (Exit 1), then walk for about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade aromatherapy from Lazy Fish Flower House, Chongqing creative postcards, Yinhan craft beer. Renovated from a former Republican-era money printing factory, TESTBED 2 Creative Park is Chongqing\u0027s most iconic cultural and creative hub, showcasing specialty brands and boutique shopping. It retains a strong industrial ruin vibe combined with an artistic atmosphere, attracting many local independent designer brands and creative lifestyle shops. It\u0027s the top choice for hipsters and travelers looking for unique treasures and local souvenirs.", "name": "TESTBED 2 Creative Park (\u9d5d\u5dba\u4e8c\u5ee0\u6587\u5275\u516c\u5712)", "transport": "Metro Line 1 Eling Station, Exit 1, about a 10-minute walk"}, {"address": "Around Eling Area, Yuzhong District, Chongqing (near pop-up counters in main urban commercial hubs)", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted classic Coach handbags, Nike limited-edition running shoes with extra discounts, Arc\u0027teryx outdoor jackets. As Chongqing\u0027s most famous international outlet shopping center, it gathers numerous global luxury, sports, and casual brands, offering regular discounts of 50% to 80% off. The spacious and comfortable shopping environment allows visitors to grab designer apparel and leather goods at unbeatable prices, making it a top recommended destination for tourists looking for major brand sprees in Chongqing.", "name": "Sasseur Outlets (Chongqing Store)", "transport": "Take Metro Line 1 to Eling Station, then transfer to a shopping shuttle or taxi (approx. 15 mins)"}, {"address": "No. 99 Ruitian Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Jiangxiaobai jacquard gift box, graffiti creative canvas bags, authentic Chongqing spicy dried beef. Located along the Jialing River adjacent to the Liziba area, this newly emerging large-scale commercial mall seamlessly blends modern fashion with the mountainous terrain. It features many \u0027first stores in Chongqing\u0027 and high-quality local lifestyle brands. Offering stunning river views, visitors can enjoy shopping while admiring the scenic Jialing River from high-altitude terraces, blending retail therapy with sightseeing.", "name": "Chongqing Impression City", "transport": "Directly accessible via Metro Line 9 International Land-Sea Center Station, or about an 8-minute bus ride from Liziba Station"}, {"address": "Building H, TESTBED 2 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Yuzhong old district hand-drawn map tote bag, original mountain city ceramic mugs, camellia essential oil handmade soap. Perched on the ridge of Eling, this independent designer concept store focuses on promoting original Chongqing designs and works by emerging young artists. Featuring decor that highlights the city\u0027s unique topography, the store offers everything from exquisite handicrafts and independent publications to specialty apparel. Every product carries a rich local cultural story, highly favored by travelers seeking uniqueness and lifestyle quality.", "name": "Lingshang Concept Store", "transport": "Metro Line 1 Eling Station, Exit 1, about a 12-minute walk"}, {"address": "Area F, TESTBED 2 Creative Park, Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Botanical dye handmade linen scarves, Mountain City Impression cotton-linen tote bags, Shu embroidery totem tea mats. This independent lifestyle store specializes in traditional Chongqing fabric arts and natural textiles. Committed to using natural botanical dyes and handwoven linen, it combines local landscape lines with traditional Shu embroidery craftsmanship to create home goods and fashion accessories that embody both classical charm and modern aesthetics, demonstrating exceptional local artisanal value.", "name": "Zhenma Cultural \u0026 Creative Store", "transport": "Metro Line 1 Eling Station, Exit 1, about an 11-minute walk"}, {"address": "Building 3, TESTBED 2 Creative Park, No. 1 Eling Main Street, Yuzhong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Chongqing topography-inspired silver jewelry, vintage Mountain City neon light decor, uniquely tailored designer shirts. Cardoli is a trendy multi-brand store in Eling showcasing over a dozen rising local designers across accessories, apparel, and lifestyle items. Most popular are the metal jewelry and home ornaments inspired by Chongqing\u0027s magical 3D topography, blending city symbols with modern aesthetics\u2014a great spot for picking up stylish, high-quality local souvenirs.", "name": "Cardoli Designer Store", "transport": "Metro Line 1 Eling Station, Exit 1, about a 10-minute walk"}, {"address": "No. 62 Liziba Main Street, Yuzhong District, Chongqing (next to Liziba Station Viewing Platform)", "feature": "\u2b50 4.7 stars | Must-Buy List: Monorail-passing-through-building toy models, 3D mugs with train-through-building motifs, Chongqing dialect creative stickers. Located right at the famous Liziba monorail viewing area, this officially authorized souvenir store is tailored specifically for tourists. Its highlights are exclusive merchandise themed around the iconic \u0027monorail passing through a building,\u0027 turning Chongqing\u0027s unique transit wonder into portable souvenirs. A must-visit shopping spot when visiting Liziba.", "name": "Liziba Transit Cultural Store", "transport": "Directly accessible right outside Metro Line 2 Liziba Station"}, {"address": "No. 174 Changjiang 2nd Road, Yuzhong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Lacquerware craft tea sets, Sichuan-Chongqing spicy hotpot base gift boxes, Taosu specialty pastries. A massive modern shopping complex near Eling, consisting of multiple thematic halls spanning a huge footprint. In addition to housing major international fashion brands, it features a flagship section dedicated to local Chongqing specialty souvenirs and traditional craft exhibitions. Whether you\u0027re looking for luxury goods or authentic local food and souvenirs, this place has it all.", "name": "Longfor Paradise Walk Daping", "transport": "Directly accessible via Metro Line 1 Shiyouru Station or Daping Station, just 1 metro stop from Eling"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Eling and Liziba"}, "guanyinqiao_jiangbei": {"categories": {"cat_1": {"items": [{"address": "No. 2 Jianxin East Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Taiji Huoxiang Zhengqi Oral Liquid, Chongqing Herbal Honeysuckle Moisturizing Cream, Sichuan-Chongqing Gastrodia \u0026 Eucommia Capsules. Heping Pharmacy is one of Chongqing\u0027s most iconic time-honored chain pharmacies with decades of history, deeply trusted by locals. The Guanyinqiao Flagship Branch is spacious and comprehensively stocked. Beyond standard prescription and over-the-counter drugs, its main feature is a dedicated section for local Chongqing herbal skincare and Traditional Chinese Medicine (TCM) cosmeceuticals. Out-of-town tourists often visit specifically to purchase authentic TCM supplements and gentle local herbal skincare creams, making it the top choice to experience traditional Chongqing medicine culture and pick up healthy souvenirs.", "name": "Heping Pharmacy (Guanyinqiao Flagship Branch)", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 5), then walk about 300 meters."}, {"address": "No. 4 Jianxin West Road, Guanyinqiao, Jiangbei District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Taiji Ziyou Jinchuang Ointment, Sichuan-Chongqing Herbal Soup Packs, TCM Mugwort Heating Patches. As a flagship directly managed pharmacy under Taiji Group, a famous local pharmaceutical giant in Chongqing, Taiji Pharmacy plays a crucial role in the Guanyinqiao commercial area. The store seamlessly blends traditional Chinese medicinal principles with modern cosmeceuticals, launching various soothing skincare products and gentle patches infused with local herbal extracts. It features a professional TCM physician consultation area and a raw herb selection zone. Locals love shopping here for soup herbs and essential plant-based soothing ointments for daily home use.", "name": "Taiji Pharmacy (Guanyinqiao Branch)", "transport": "Take CRT Line 9 to Guanyinqiao Station (Exit 6), then walk about 180 meters."}, {"address": "B1 Floor, Jiangbeizui IFS, No. 1 Chengnan Road, Jiangbei District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Tongjunge Handmade Ejiao Cake, Time-Honored Herbal Anti-Acne Essence, Chongqing Pearl Eye Drops. Founded during the Guangxu reign of the Qing Dynasty, Tongjunge is a household-name traditional Chinese medicine brand in Chongqing. Located in the Jiangbeizui financial district, this branch ingeniously blends classical culture with modern shopping mall aesthetics, offering high-quality herbal skincare, TCM wellness teas, and handmade health supplements. Its herbal skin repair series and traditional pearl face powder are hugely popular among female customers seeking natural beauty ingredients, showcasing a unique Bayu TCM skincare philosophy.", "name": "Tongjunge Pharmacy (Jiangbeizui IFS Branch)", "transport": "Take CRT Line 6 to Jiangbeicheng Station (Exit 3), then walk about 250 meters."}, {"address": "1F, Hall T2, Financial City No. 2, No. 1 Jingang Xincheng, Jiangbei District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Wanhe Herbal Cold Compress Patch, Three Gorges Wild Gastrodia Essence Oil, TCM Moisturizing Lip Balm. Wanhe Pharmacy is a major local pharmacy chain with years of deep roots in Chongqing, highly favored by white-collar workers and families. The branch in the Jiangbeizui business district is clean and bright; in addition to professional pharmaceutical services, it prominently features unique herbal cosmetics and personal care products from Chongqing and Southwest China. The wild gastrodia repair oil and natural herbal hand cream here are affordable and highly effective, making them popular local souvenirs with a high repurchasing rate among tourists.", "name": "Wanhe Pharmacy (Jiangbeizui Financial City Branch)", "transport": "Take CRT Line 6 to Jiangbeicheng Station (Exit 2), then walk about 350 meters."}, {"address": "1F, Suning.com Plaza, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Niche Independent Brand Perfumes, Chongqing Limited-Edition Skincare Sets, Travel-Size Luxury Serums. HAYDON is a trendy, high-end beauty concept store that has taken China by storm. Designed with a futuristic tech and sci-fi space aesthetic, the Guanyinqiao Flagship Store has become a popular photo spot on Guanyinqiao Pedestrian Street. The store brings together over a hundred top global luxury brands alongside emerging Chinese local designer beauty labels, offering a pressure-free testing environment. Its exclusive Chongqing-themed gift sets and extensive selection of niche fragrances draw crowds of trendy young shoppers.", "name": "HAYDON (Guanyinqiao Flagship Store)", "transport": "Take CRT Line 3 to Guanyinqiao Station (Exit 4), then walk about 200 meters."}, {"address": "1F, IMIX Park, Guanyinqiao Pedestrian Street, Jiangbei District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: HARMAY Exclusive Plant Essential Oils, Niche Haircare Gift Sets, Viral Cleansing Balms. Famous for its distinctive industrial warehouse aesthetic, HARMAY incorporates Chongqing\u0027s signature multi-layered, mountainous architecture into its store interior design. The store features luxury cosmetic travel sizes and a curated selection of global independent beauty brands, where customers can pick up a shopping basket and browse freely just like in a supermarket. Equipped with a dedicated essential oil and fragrance experience zone, it attracts many trendy youths who enjoy testing novel beauty products and taking stylish photos.", "name": "H
