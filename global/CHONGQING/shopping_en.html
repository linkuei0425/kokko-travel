ea, this shop blends Nanshan\u0027s Taoist health-preserving culture with its products, offering limited-edition low-sugar vegetable-oil cakes and locally harvested high-mountain tea. Featuring packaging imbued with Taoist landscape aesthetics, these make for a uniquely cultural Nanshan souvenir.", "name": "Nanshan Laojundong Vegetarian \u0026 Tea Gift Shop", "transport": "Take Bus 384 to Laojundong Station, then follow the walking trail up the mountain."}, {"address": "Zone C, Longmenhao Old Street, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic rose tuo tea gift boxes, aged Chongqing tuo tea brick cakes, cold brew tea bags. Chongqing Tuo Tea boasts over a century of history. Nestled inside a century-old blue-brick building in Longmenhao Old Street along Nanbin Road, this hall lets you sip rich, sweet-aftertaste tuo tea and buy beautifully packaged nostalgic tin gift boxes\u2014a favorite among hipsters and tea enthusiasts alike.", "name": "Chongqing Tuo Tea Experience Hall (Longmenhao Old Street)", "transport": "Take Metro Line 6 to Shangxinjie Station (Exit 2), then walk for about 8 minutes."}, {"address": "Inside Landmark Riverside Park, No. 88 Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Dezhuang 45\u00b0 mild spicy hotpot base, Dezhuang 52\u00b0 extra spicy base, clear mushroom broth soup pack. Created by famous Chongqing hotpot brand Dezhuang inside Danzishi Landmark Riverside Park, this exquisite souvenir shop highlights their proprietary \u0027Li\u0027s Spicy Degree Standard\u0027, allowing tourists with lower spice tolerances to easily pick the perfect hotpot base and seasoning packs.", "name": "Dezhuang Hotpot Souvenir Experience Store (Nanbin Road)", "transport": "Take the Loop Line subway to Danzishi Station, then transfer to a bus or walk to Landmark Riverside Park."}, {"address": "No. 102 Longmenhao Section, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Spicy mini dough twists (mahua), Sichuan pepper crispy biscuits, black sesame crispy biscuits. Yuxiong is a household snack brand in Chongqing. Its flagship spicy crispy biscuits offer a crunchy texture packed with aromatic Sichuan pepper tingle, making them an authentic local treat to pair with drinks or tea. Beautifully packaged and budget-friendly.", "name": "Yuxiong Spicy Crispy Biscuit Specialty Store (Nanbin Road)", "transport": "Take Metro Line 6 to Shangxinjie Station, then walk towards Nanbin Road for about 10 minutes."}, {"address": "No. 15 Nanshan Botanical Garden Road, Nanan District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Nanshan Maojian, Dingxin green tea gift box, Nanshan osmanthus black tea. Thanks to its humid climate, Nanshan is ideal for growing tea. Operated directly by local tea farmer cooperatives near Nanshan Botanical Garden, this store specializes in locally grown high-mountain green and scented teas. The clear brews carry a distinct wild mountain aroma, making them great natural souvenirs from Nanshan.", "name": "Nanshan High Mountain Tea Farmers Specialty Store", "transport": "Take Bus 384 to Nanshan Botanical Garden Station, then walk for about 3 minutes."}, {"address": "No. 1 Mishi Street, Nanbin Road, Nanan District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Salt \u0026 pepper Chen mahua, spicy Chen mahua, sweet black sesame mahua. Chen Mahua (fried dough twists) is an iconic traditional Chongqing snack. Located along the scenic Nanbin Road, this specialty shop offers both freshly fried and sealed packaged twists. Crispy and fragrant, the salt \u0026 pepper and spicy flavors deliver authentic local taste, making them a must-buy treat while taking in the night views along Nanbin Road.", "name": "Chen Mahua Specialty Flagship Store (Nanbin Old Street)", "transport": "Take Metro Line 6 to Shangxinjie Station, then walk to Mishi Street in about 12 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 168 Lujiao Avenue, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buy list: Name-brand sneakers up to 70% off, affordable luxury leather shoulder bags, classic discounted down jackets. Located in the Chayuan New Area at the foot of Nanshan Mountain, this mega outlet center brings together hundreds of famous international brands such as Coach, Michael Kors, Nike, Adidas, and Armani, offering incredible site-wide discounts. Built in a European town style with great natural light and seamless shopping routes, it is the top choice outlet for bargain hunters, both tourists and locals, in the Nanbin Road and Nanshan areas.", "name": "Chongqing Capital Outlets", "transport": "Take Metro Line 6 to Chayuan Station, then transfer to Bus 180 or take a taxi for about 10 minutes."}, {"address": "Danzishi Old Street, Landmark Riverside, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Danzishi Old Street cultural postcards, Shu embroidery double-sided folding fans, Qiaotou hot pot base gift boxes. Situated at the confluence of the Yangtze and Jialing Rivers along Nanbin Road, this center blends a modern shopping mall with the historic architecture of the century-old Danzishi Old Street. It features dedicated zones for local Chongqing creative souvenirs and homegrown brands. Visitors can enjoy unobstructed views of the spectacular two-river confluence at Chaotianmen while shopping\u2014an iconic mall capturing the blend of modern and traditional Chongqing.", "name": "Landmark Riverside Shopping Center", "transport": "Take the Metro Loop Line to Danzishi Station and walk for about 8 minutes."}, {"address": "No. 80 Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.5 stars | Must-buy list: Ebony creative ornaments, traditional Chongqing lacquerware, handmade spicy beef jerky. Extending along the riverbank of Nanbin Road, this riverfront commercial landmark brings together independent local designer fashion boutiques, craft workshops, and curated select stores. Filled with artistic flair and lifestyle goods, it offers panoramic night views of the brilliantly illuminated Yuzhong Peninsula, making it a favorite among local youth and trendsetters.", "name": "East Original 1891 Shopping Mall", "transport": "Take Bus 372 or 338 to Haitang Yanyu Park Station, and you will arrive directly."}, {"address": "No. 108 Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.4 stars | Must-buy list: Independent designer landmark T-shirts, handmade ceramic tea cups, Mountain City woodblock print merchandise. Located in the prime section of Nanbin Road, this art-focused retail hub highlights local original designs and artistic lifestyle goods. It features many independent brands from emerging local artists, including unique accessories, designer apparel, and home decor, offering a personalized shopping experience distinct from traditional department stores.", "name": "1089 Art Retail Center", "transport": "Take Bus 372 to Nanbin Lu Di Yi Da Dao Station, then walk for about 3 minutes."}, {"address": "Inside Yihuali Night Sky Market, Fushou Road, Nanshan Street, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.8 stars | Must-buy list: Nanshan specialty Kudzu root powder, handmade osmanthus cake, high-mountain old-tree green tea. Nestled in the Nanshan Scenic Area, this unique local market and lifestyle boutique brings together Nanshan\u0027s specialty agricultural products, traditional handicrafts, and heritage Chongqing pastries. Dedicated to promoting Bayu culture with beautifully packaged items, it is an excellent stop for purchasing authentic Chongqing souvenirs and lifestyle goods after taking in the sights on Nanshan.", "name": "Yi Hua Li Market \u0026 Lifestyle Store", "transport": "Take Bus 384 to Nanshan Station, then transfer to a local shuttle or take a taxi for about 5 minutes."}, {"address": "Near the Egongyan Bridge Connection, Chayuan New Area, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.6 stars | Must-buy list: Mountain City limited-edition denim jackets, Sichuan-Chongqing spicy sausage gift boxes, local Chongqing stationery sets. A landmark mega shopping complex in Chongqing\u0027s Nan\u0027an District, featuring a vast array of chain and local retail counters. The mall introduces many local streetwear brands and premier regional stores for Southwest China, while its underground street boasts a large gourmet specialty zone for Chongqing products, satisfying all your one-stop shopping needs.", "name": "Longfor Jiangnan Paradise Walk", "transport": "Take Metro Line 6 to Chayuan Station, Exit 2 for direct access."}, {"address": "Inside the Park, No. 105 Nanshan Botanical Garden Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.3 stars | Must-buy list: Nanshan camellia essential oil, forest-style botanical specimen bookmarks, handmade plant-dyed silk scarves. Tucked inside the Nanshan Botanical Garden, this local lifestyle store centers around Chongqing\u0027s city flower, the camellia, offering a series of plant-derived merchandise and skincare products. Developed in collaboration with local artisans and brands, these high-quality products exude the natural, ecological charm of Nanshan.", "name": "Nanshan Botanical Garden Cultural \u0026 Lifestyle Store", "transport": "Take Bus 384 to Nanshan Botanical Garden Station."}, {"address": "2nd Floor, Hall D, Phase 2, East Original 1891, Nanbin Road, Nan\u0027an District, Chongqing", "feature": "\u2b50 4.7 stars | Must-buy list: Chongqing Mountain City 3D pop-up journals, traditionally brewed fruit and flower wines, hand-painted Bayu canvas tote bags. Jingdian Bookstore is Chongqing\u0027s most prestigious local independent bookstore and cultural lifestyle department store, with its Nanbin Road flagship store boasting prime river views. Beyond books, a large section is dedicated to selling stationery, home goods, traditional Bayu crafts, and curated gifts created by local designers, creating an iconic local cultural retail space.", "name": "Jingdian Bookstore \u0026 Lifestyle Dept", "transport": "Take Bus 338 or 372 to Haitang Yanyu Park Station and walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Nanbin Road and Nanshan"}, "wulong_karst": {"categories": {"cat_1": {"items": [{"address": "No. 88 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Alpine Mugwort Essential Oil Hand Cream, Gastrodia Repairing Facial Mask. A distinctive local drugstore near the Fairy Mountain Tourist Center, specializing in skincare products extracted from local Wulong alpine herbs. The store\u0027s top-selling mugwort hand cream features a subtle herbal scent and supreme moisturizing capabilities, making it perfect for dry mountain weather and a favorite souvenir among tourists.", "name": "Wulong Alpine Herbal Skincare \u0026 Wellness Center", "transport": "Take the Xiannvshan Town Sightseeing Bus to the Tourist Center Station, then walk for about 3 minutes."}, {"address": "No. 12 Cuiyun Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Taiji Gromwell Root Salve, Alpine Pearl Whitening Face Cream. A well-known local time-honored chain pharmacy in Chongqing with a branch in Xiannvshan Town. Besides emergency medicines, tourists love its self-produced and distributed Herbal Cosmeceuticals. The Gromwell Root Salve is particularly effective for dry, itchy skin caused by large temperature fluctuations, making it an essential local remedy for visitors.", "name": "Taiji Pharmacy (Xiannv Mountain Tourist Center Branch)", "transport": "Take the passenger bus from Wulong Urban Area to Xiannv Mountain, get off at the Tourist Center, and walk for about 5 minutes."}, {"address": "No. 45 Jinshan Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Pien Tze Huang Pearl Cream, Coptis Soothing Anti-Acne Cream. Tongjunge is a centuries-old Traditional Chinese Medicine brand iconic to Chongqing, featuring a traditional cosmeceutical section. Combining traditional herbal wisdom with modern skincare technology, its Pien Tze Huang Pearl Cream fades spots and brightens complexion, highly favored by locals and travelers alike.", "name": "Tongjunge Pharmacy (Wulong Xiannv Town Store)", "transport": "Take the Xiannvshan Town Loop Bus to Jinshan Intersection Station, and it\u0027s right there."}, {"address": "1st Floor, Zone B, Xiannv Tianjie, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Alpine Dendrobium Firming Facial Mask, Alpine Snow Lotus Hydrating Toner. A premier Chinese skincare brand specializing in alpine plants, fitting seamlessly with Fairy Mountain\u0027s alpine ecosystem. Featuring carefully selected high-altitude botanical ingredients, it offers gentle, non-irritating restorative skincare. Beautifully packaged, these products make exquisite gifts.", "name": "DR.PLANT (Wulong Xiannushan Branch)", "transport": "Located within the Xiannv Tianjie commercial area, about an 8-minute walk from the Xiannv Mountain Tourist Center."}, {"address": "No. 120 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Chongqing Snake Oil Anti-Chapping Ointment, Honeysuckle Refreshing Spray. A major local pharmacy chain in Chongqing. Tailored to the alpine weather of the scenic area, this branch is stocked with sun care, moisturizing, and allergy-soothing cosmeceuticals. The snake oil cream is remarkably effective against cold weather and chapping, highly affordable, and offers fantastic value.", "name": "Heping Pharmacy (Wulong Xiannv Mountain Branch)", "transport": "Take the Xiannv Mountain Scenic Route Bus to Yinxing Avenue Station; the store is right in view."}, {"address": "No. 6 Xiangye Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.9 stars | Must-Buy List: Alpine Honeysuckle Handmade Lip Balm, Wild Rose Botanical Hydrosol. A unique independent boutique specializing in skincare extracted from wild alpine herbs in Chongqing. Handcrafting lip balms and hydrating hydrosols with pure botanical ingredients, it offers clean, non-burdening formulations\u2014a must-visit beauty spot on your Wulong Karst nature adventure.", "name": "Xiannv Mountain Herbal Beauty Experience Store", "transport": "About a 4-minute walk from the Xiannv Tianjie Pedestrian Street."}, {"address": "1st Floor, Zone A, Xiannv Tianjie, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Bird\u0027s Nest Brightening Mask, Aqua High-Protection Sunscreen Lotion. An international chain beauty store located in the core business district of Xiannvshan Town, stocking famous skincare and personal care items. After visiting the Three Natural Bridges and Fairy Mountain Prairie, travelers can drop by to restock high-SPF sun protection, soothing products, and daily toiletries.", "name": "Watsons (Wulong Xiannv Tianjie Store)", "transport": "Take the Xiannv Mountain Sightseeing Bus to Xiannv Tianjie Station; it is right at the mall entrance."}, {"address": "No. 156 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Karst Rock Botanical Essential Oil, Alpine Green Tea Antioxidant Face Cream. Tucked away in a quaint street of Xiannvshan Town, this independent beauty shop focuses on skincare extracted from plants native to Wulong\u0027s unique Karst ecosystem. Featuring a cozy, natural ambience, friendly staff offer skin assessments and tailored skincare advice for high-altitude climates.", "name": "Karst Botanical Extracts Beauty Shop", "transport": "About a 3-minute taxi ride from the Xiannv Mountain Tourist Center."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 52 Yinxing Avenue, Xiannv Mountain Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Tujia embroidered shawls, Miao-style crossbody bags, distinctive silver-adorned cloaks. Located near the Xiannv Mountain Town Visitor Center, this specialty boutique blends local Wulong Tujia and Miao traditional crafts. Many tourists visiting Wulong Three Natural Bridges and Xiannv Mountain Prairie for photo shoots drop by to pick up ethnic-patterned shawls and bags, which add stunning visual flair to photos while keeping you warm.", "name": "Xiannv Mountain Ethnic Clothing \u0026 Handicrafts Shop", "transport": "Take the Xiannv Mountain Scenic Area Bus Line to Xiannv Mountain Town Visitor Center Station, then walk about 5 minutes."}, {"address": "No. 18 Jianshe West Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: 3-in-1 windproof hardshell jackets, lightweight breathable hiking shoes, large-capacity outdoor backpacks. Given Wulong\u0027s complex Karst terrain and unpredictable weather, this outdoor gear store is a lifesaver for hikers and trekkers. Offering high-quality, waterproof, windproof functional apparel and professional footwear, it\u0027s perfect for gearing up before trekking through Xiannv Mountain or Longshui Gorge Gap.", "name": "Toread Outdoor Gear Wulong Store", "transport": "Take Wulong Bus Route 101 or 102 to Jianshe West Road Station and walk straight to the store."}, {"address": "No. 28 Tiyu Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Tujia hand-embroidered cloth shoes, hand-woven sun straw hats, children\u0027s tiger-head multi-layer sole shoes. Run by veteran local tailors and artisans in Wulong, this independent vintage shop specializes in fully handcrafted cloth shoes with multi-layer soles and embroidered accessories. Patterns draw inspiration from Wulong\u0027s landscapes and auspicious Tujia symbols. Comfortable, breathable, and culturally rich, these make memorable souvenirs.", "name": "Wulong Tujia Handmade Shoes \u0026 Hats Shop", "transport": "Take Wulong Bus Route 201 to Tiyu Road Junction Station, then walk for about 3 minutes."}, {"address": "No. 105 Renmin East Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Soft-soled flat casual shoes, British vintage ankle boots, lightweight women\u0027s handbags. Located in Wulong\u0027s bustling urban commercial district, this popular women\u0027s footwear and bag shop focuses on stylish yet comfortable designs. Their soft-soled flats are a hit among local women and tired tourists needing comfortable shoe replacements after exploring scenic spots, offering great quality at affordable prices.", "name": "Exull Shoes Wulong Xiangkou Store", "transport": "Take Wulong Bus Route 101 to Renmin East Road Station, then walk about 2 minutes."}, {"address": "No. 88 Renmin East Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Chongqing printed hoodies, cargo casual jeans, windproof warm jacket coats. As a well-known casual wear brand, this store occupies a prime location in downtown Wulong. It offers a wide variety of affordable fashion apparel, particularly warm jackets and casual pants tailored for mountain temperature changes, making it the top pick for local youth and tourists stocking up on budget-friendly clothes.", "name": "Yishion Fashion Wulong Renmin East Road Store", "transport": "Take Wulong Bus Route 101 or 105 to Renmin East Road Commercial District Station and step right out."}, {"address": "No. 36 Wuyi Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Nitrogen technology cushioned running shoes, windproof sportswear, multifunctional outdoor waist packs. A favorite shopping spot for local sports enthusiasts and Xiannv Mountain hikers, this store offers high-performance footwear and activewear. Their cushioned running shoes effectively reduce foot fatigue during long walks along the Three Natural Bridges trails, earning rave reviews from visitors.", "name": "Anta Sports Wulong Wuyi Road Store", "transport": "Take Wulong Bus Route 102 to Wuyi Road Station, then walk about 1 minute."}, {"address": "No. 12 Cuiyun Road, Xiannv Mountain Town, Wulong District, Chongqing", "feature": "\u2b50 4.8 stars | Must-Buy List: Extreme Cold Series down jackets, lightweight portable down vests, windproof warm scarves. Xiannv Mountain is cold with snow during winter, and this Bosideng flagship store supplies heavy-duty down wear suited to the area\u0027s climate. Whether you\u0027re visiting for winter skiing/snow-viewing or staying warm during night camping in spring and autumn, this is the best place to purchase ultimate cold-weather gear.", "name": "Bosideng Down Jacket Xiannv Mountain Store", "transport": "Take the Xiannv Mountain Scenic Area Bus to Xiannv Mountain Town Center Station, then walk about 4 minutes."}, {"address": "No. 45 Changjiang 1st Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Botanical-dyed artistic canvas bags, vintage hand-woven bamboo totes, plant-dyed cotton \u0026 linen scarves. Tucked away in a mountain lane in Wulong, this independent craft workshop combines traditional Chongqing bamboo weaving with natural botanical dyeing techniques. Every bag and scarf is a unique handmade piece exuding a natural, earthy charm\u2014a must-visit boutique for art-loving travelers.", "name": "Wulong Bamboo \u0026 Botanical Dye Bags Workshop", "transport": "Take Wulong Bus Route 103 to Changjiang 1st Road Station, then walk about 3 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 99 Yinxing Avenue, Xiannushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Spicy \u0026 Numbing Dried Tofu, Five-Spice Dried Tofu Cubes, Pickled Chili Dried Tofu. Yangjiao dried tofu is a National Geographical Indication product of Wulong, Chongqing, with a history spanning hundreds of years. This main store serves the most authentic, traditionally crafted dried tofu, featuring a firm yet elastic texture, a satisfying chew, and a rich soybean aroma. It is an iconic souvenir you shouldn\u0027t miss when visiting the Wulong Karst region.", "name": "Yangjiao Dried Tofu Wulong Main Store", "transport": "Take the Xiannushan Town Scenic Area Loop Bus to Yinxing Dadao (Ginkgo Avenue) Station and walk for about 3 minutes."}, {"address": "No. 18 Cuiyun Road, Xiannushan Subdistrict, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Fairy Mountain Alpine Air-Dried Beef Jerky, Wulong Handmade Sweet Potato Vermicelli, Dried Alpine Bracken. A local comprehensive specialty store located near the scenic area, featuring a wide array of local delicacies and dried fruits. Partnering directly with local farmers, their beef jerky is made from free-range alpine yellow cattle\u2014savory, spicy, and delicious. It\u2019s the premier one-stop shop for tourists to stock up on authentic local snacks.", "name": "Wulong Impression Specialty Store", "transport": "Take the scenic area shuttle bus to Xiannv Town Bus Passenger Station, then walk for about 5 minutes."}, {"address": "Zone B, Xiannv Tianjie, Yinxing Avenue, Xiannushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Xiannv Alpine Green Tea, Xiannv Black Tea, Alpine Organic Kuding Tea. A direct sales outlet located right in the Fairy Mountain tea plantation area at an altitude of over 1,000 meters, specializing in misty alpine organic teas. The tea liquor is clear and rich with a long-lasting sweet aftertaste. Exquisitely packaged with designs reflecting Wulong\u0027s natural landscape, it is a favorite among tea culture enthusiasts.", "name": "Xiannushan Alpine Tea Shop", "transport": "Take Xiannv Town Bus Route 1 to Xiannv Tianjie Station."}, {"address": "Next to the Tourist Reception Center of Xiannushan Town Scenic Area, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Alpine Cured Bacon, Handmade Pork Sausage, Wild Morels. Highly recommended by locals, this shop specializes in authentic mountain delicacies and traditional cured/smoked products from Wulong. Their bacon is slow-smoked over firewood using ancient techniques\u2014richly aromatic without being greasy. Vacuum packaging is available, making it convenient for tourists to carry and transport home.", "name": "Xunwei Wulong Specialty Supermarket", "transport": "About a 2-minute walk from the Wulong Karst Tourist Reception Center."}, {"address": "No. 35 Jingui Road, Xiannushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Pure Handmade Sweet Potato Noodle Threads, Wide Noodles for Hot \u0026 Sour Powder, Pure Purple Sweet Potato Noodles. Wulong sweet potato vermicelli is handmade from high-quality sweet potato starch, offering a chewy, springy texture that holds up well during cooking. This specialty store demonstrates traditional noodle-making processes and offers various premium gift boxes\u2014a must-buy for hot pot and hot \u0026 sour glass noodle lovers.", "name": "Wulong Alpine Handmade Sweet Potato Vermicelli Store", "transport": "Take the Xiannv Town Loop Bus to Jingui Road Station and walk about 100 meters."}, {"address": "No. 112 Wujiang Road, Yangjiao Town, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Yangjiao Dried Fish Snacks, Handmade Black Peanuts, Alpine Honey. This market-style store brings together traditional products from the Wu River basin and Yangjiao Ancient Town. Highly recommended are the spicy dried fish snacks made from wild fish of the Wu River; compact packaging makes them perfect office snacks, delivering a crispy, spicy flavor full of Chongqing riverside flair.", "name": "Yangjiao Town Traditional Specialty Market", "transport": "Drive or take the local bus from Wulong Urban Area to Yangjiao Town and get off at Yangjiao Ancient Town."}, {"address": "No. 126 Yinxing Avenue, Xiannushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Tujia Brocade Handbags, Handmade Embroidered Sachets, Wulong Landform Wooden Bookmarks. A cultural souvenir shop that incorporates local ethnic minority heritage. Alongside exquisite Wulong pastries and snacks, the highlight here is the handmade brocade crafts, combining traditional heritage with modern design for a truly memorable souvenir.", "name": "Xiannushan Tujia Brocade \u0026 Souvenir Shop", "transport": "Take Xiannv Town Bus Route 1 to Yinxing Dadao Zhongduan (Middle Section) Station."}, {"address": "No. 8 Xiangye Road, Xiannushan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Chongqing Hot Pot Soup Base (Wulong Special Blend), Dried Wild Alpine Bamboo Shoots, Crispy Walnuts. A spacious, bright flagship souvenir store in the core commercial hub of Xiannushan Town. Their custom hot pot base is infused with special alpine spices for a unique aroma, while the wild bamboo shoots harvested from deep within the Wulong mountains are tender and crispy\u2014a perfect ingredient for home cooking.", "name": "Karst Sentiment Specialty Flagship Store", "transport": "Take a taxi for about 5 minutes from Xiannushan Town Bus Passenger Station."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 83 Jinyu Avenue, Liangjiang New Area, Chongqing", "feature": "\u2b50 4.7 stars | Must-Buy List: Classic Coach leather bags, extra-discounted Nike sneakers, FILA trendy casual wear. Located near key transit hubs en route to Wulong, this is Chongqing\u0027s largest and most popular discount shopping center, hosting hundreds of renowned international and domestic brands. Featuring European town-style architecture and year-round deep discounts, it serves as an excellent pit stop for sports gear and luxury items before or after your trip to Wulong.", "name": "Sasseur Outlet Chongqing", "transport": "Take Chongqing Rail Transit Line 3 directly to Outlet Station; or visit en route while driving via the Baomao Expressway to Wulong."}, {"address": "No. 18 Fuxing Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Time-honored Tianfu Cola, Wulong handmade sweet potato noodles, local brand cold-proof jackets. This is the most iconic large-scale comprehensive department store in Wulong\u0027s urban area, deeply rooted in the local community for years. It houses local clothing brands, daily necessities, and a large fresh food supermarket. Many locals and tourists heading to Fairy Mountain for camping or outdoor scenic areas make a special trip here for cost-effective outdoor winter clothing and local snacks.", "name": "Chongqing Department Store Wulong Branch", "transport": "Take Wulong District Bus Route 101 or 102 and get off at Chongbai Building Station."}, {"address": "No. 62 Yinxing Avenue, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.2 stars | Must-Buy List: Bamboo woven handicrafts, high-mountain wild delicacy gift boxes, special embroidered cashmere shawls. Situated at the entrance of the Wulong Karst core scenic area, this large commercial plaza features architecture that blends East Chongqing residential styles. It brings together many Chongqing local design brands and specialty shops, offering a one-stop shopping and leisure experience. The cashmere shawls and windproof jackets designed specifically for the scenic area\u0027s unpredictable weather are especially popular among female tourists.", "name": "Fairy Mountain Tourist Center Commercial Plaza", "transport": "Take the shuttle bus heading to Xiannvshan Town at Wulong Bus Station and get off at Fairy Mountain Tourist Center."}, {"address": "No. 12 Old Street, Yangjiao Ancient Town, Yangjiao Town, Wulong District, Chongqing", "feature": "\u2b50 4.6 stars | Must-Buy List: Yangjiao dried tofu gift boxes, Wulong high-mountain cured bacon, high-mountain wild honey. This flagship independent department store specializes in Wulong\u0027s intangible cultural heritage specialties, located in Yangjiao Ancient Town along the Wujiang River. Combining traditional workshops with modern display spaces, customers can sample freshly made Yangjiao dried tofu for free and purchase wild mushrooms and bacon smoked using traditional methods by local farmers\u2014a must-visit store for taking home authentic Wulong flavors.", "name": "Yangjiao Ancient Town Local Specialty Pavilion", "transport": "Take the dedicated bus route to Yangjiao Town from Wulong urban area, get off at Yangjiao Ancient Town Station, and walk for about 3 minutes."}, {"address": "No. 18 Wanfeng Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: Xiannv Red Tea, high-mountain green tea bags, handmade Karst landscape ceramic cups. This stylish local independent boutique and tea shop highlights premium tea produced from Wulong\u0027s high-altitude, pollution-free tea plantations. Collaborating with local ceramic artists, the store offers various cultural and creative products inspired by the scenery of Wulong Three Natural Bridges and Fairy Mountain. The interior exudes Zen tranquility and modern design, attracting many hipster travelers looking for unique souvenirs.", "name": "Fairy Mountain Tea \u0026 Cultural Creative Store", "transport": "Walk from Xiannvshan Town Center or take the town sight-seeing mini-train and get off at Wanfeng Road Intersection."}, {"address": "No. 88 Guihua Road, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Miao silver bracelets, Tujia brocade \u0027Xilankapu\u0027 handbags, ethnic totem scarves. Rich in ethnic minority culture, Wulong is home to this independent craft store specializing in pure silver jewelry and traditional Tujia brocade handcrafted by local artisans. All silver pieces are crafted by experienced master smiths, while the brocade works boast vibrant colors, high practicality, and collectible value\u2014making them exquisite handicrafts rich in Wulong\u0027s regional identity.", "name": "Wulong Tujia \u0026 Miao Silver Crafts Shop", "transport": "Take the Xiannvshan Town Loop Bus, get off at Guihua Road Intersection, and walk about 200 meters."}, {"address": "No. 55 Shuibin Road, Xiangkou Town, Wulong District, Chongqing", "feature": "\u2b50 4.5 stars | Must-Buy List: High-mountain fern root powder, Jiangkou dried radish, Wulong Tianma (Gastrodia elata) gift boxes. A highly renowned local independent specialty chain flagship, this store features beautifully displayed products with transparent pricing. Carefully selecting top-quality agricultural products grown at altitudes above 1,000 meters in the Wulong Karst mountains, it repackages traditional mountain goods into elegant gift sets, making it the top choice for purchasing local premium healthy foods.", "name": "Wulong Impression Specialty \u0026 Lifestyle Center", "transport": "Take Wulong District Bus Route 201 and get off at Shuibin Road Station."}, {"address": "No. 108 Yinxing Avenue, Resort Area, Xiannvshan Town, Wulong District, Chongqing", "feature": "\u2b50 4.3 stars | Must-Buy List: Local brand warm windproof jackets, Yangjiao horn carving craft combs, high-mountain dried morels. Blending outdoor gear with mountain delicacies, this specialty store caters to Fairy Mountain\u0027s high-altitude climate and outdoor recreation needs. Besides offering great-value local outdoor apparel suitable for trekking in Karst terrain, it features dedicated sections for rare wild mushrooms and exquisite handcrafted horn carvings, making it popular among outdoor enthusiasts and families.", "name": "Fairy Mountain Outdoor \u0026 Mountain Specialty Pavilion", "transport": "Take the free shuttle bus in Fairy Mountain Tourist Resort Area and get off at Yinxing Avenue Leisure Plaza Station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Wulong Karst Scenic Area"}};
        const cityName = "Chongqing";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
