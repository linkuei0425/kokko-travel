\u5728\u5730\u8001\u9955\u8207\u5916\u5730\u904a\u5ba2\u63a8\u5d07\u3002", "name": "\u5927\u58fa\u6625\u751f\u714e\u5305 (Dahu Chun Shengjianbao - Yuyuan)", "transport": "\u642d\u4e58\u5730\u943510\u865f\u7dda\u81f3\u8c6b\u5712\u7ad91\u865f\u51fa\u53e3\uff0c\u6b65\u884c\u7d045\u5206\u9418\u3002"}, {"address": "\u4e0a\u6d77\u5e02\u9ec3\u6d66\u5340\u8c6b\u5712\u8def112\u865f", "feature": "\u2b50 4.0\u661f | \u4e0a\u6d77\u6975\u5177\u4ee3\u8868\u6027\u7684\u53e4\u65e9\u5473\u96a8\u624b\u96f6\u5634\uff0c\u300e\u4e0d\u5403\u57ce\u968d\u5edf\u4e94\u9999\u8c46\uff0c\u7b49\u65bc\u6c92\u4f86\u904e\u4e0a\u6d77\u300f\u3002\u9078\u7528\u512a\u8cea\u8836\u8c46\u914d\u5408\u8334\u9999\u3001\u6842\u76ae\u7b49\u9999\u6599\u7cbe\u5fc3\u716e\u88fd\uff0c\u8c46\u7c92\u8868\u9762\u6cdb\u8457\u4e00\u5c64\u8584\u8584\u7684\u767d\u971c\u3002\u56bc\u52c1\u5341\u8db3\uff0c\u5165\u53e3\u5148\u9e79\u5f8c\u751c\uff0c\u7518\u9999\u6fc3\u90c1\uff0c\u56de\u5473\u7121\u7aae\uff0c\u8d8a\u56bc\u8d8a\u9999\uff0c\u662f\u904a\u5ba2\u908a\u901b\u8c6b\u5712\u8001\u8857\u908a\u54c1\u5690\u7684\u50b3\u7d71\u4e7e\u679c\u5c0f\u98df\u3002", "name": "\u57ce\u968d\u5edf\u4e94\u9999\u8c46\u5c08\u8ce3\u5e97 (Shanghai Old City God Temple Creamy Five-Spice Beans)", "transport": "\u642d\u4e58\u5730\u943510\u865f\u7dda\u621614\u865f\u7dda\u81f3\u8c6b\u5712\u7ad9\uff0c\u9032\u5165\u8c6b\u5712\u5546\u57ce\u5167\u5373\u53ef\u770b\u5230\u3002"}, {"address": "\u4e0a\u6d77\u5e02\u9ec3\u6d66\u5340\u8c6b\u5712\u8def249\u865f", "feature": "\u2b50 4.1\u661f | \u6b77\u53f2\u60a0\u4e45\u7684\u8c6b\u5712\u7279\u8272\u50b3\u7d71\u751c\u54c1\u5c0f\u5403\uff0c\u50b3\u627f\u81ea\u6e05\u4ee3\u7684\u50b3\u7d71\u624b\u5de5\u85dd\u3002\u4ee5\u9d28\u68a8\u6216\u96ea\u68a8\u642d\u914d\u5ddd\u8c9d\u3001\u6854\u6897\u7b49\u591a\u7a2e\u8349\u672c\u690d\u7269\u71ac\u88fd\u800c\u6210\u3002\u7cd6\u584a\u8cea\u5730\u5805\u786c\u7d50\u6676\uff0c\u5165\u53e3\u6e05\u6dbc\u7518\u751c\u3001\u6ecb\u6f64\u5589\u56a8\uff0c\u751c\u800c\u4e0d\u81a9\u4e14\u5e36\u6709\u7368\u7279\u7684\u85e5\u81b3\u8349\u672c\u9999\u6c23\u3002\u8001\u8857\u6524\u4f4d\u4e0a\u5e38\u5e38\u73fe\u505a\u73fe\u8ce3\uff0c\u5438\u5f15\u5927\u91cf\u89c0\u5149\u5ba2\u8cfc\u8cb7\u4f5c\u70ba\u96a8\u8eab\u6563\u6b65\u7cd6\u679c\u3002", "name": "\u4e0a\u6d77\u68a8\u818f\u7cd6\u5c08\u8ce3\u5e97 (Shanghai Pear Syrup Candy Shop)", "transport": "\u642d\u4e58\u5730\u943510\u865f\u7dda\u81f3\u8c6b\u5712\u7ad9\uff0c\u6b65\u884c\u7d046\u5206\u9418\u9032\u5165\u8c6b\u5712\u8001\u8857\u5167\u3002"}, {"address": "\u4e0a\u6d77\u5e02\u9ec3\u6d66\u5340\u8c6b\u5712\u8001\u8857108\u865f", "feature": "\u2b50 4.2\u661f | \u5e02\u96c6\u8207\u8001\u8857\u5546\u5708\u4e2d\u6700\u53d7\u6b61\u8fce\u7684\u7d93\u5178\u6563\u6b65\u751c\u9ede\u3002\u56b4\u9078\u65b0\u9bae\u5927\u9846\u7684\u5c71\u6942\u679c\u5be6\uff0c\u5916\u5c64\u88f9\u4e0a\u4e00\u5c64\u6676\u7469\u5254\u900f\u3001\u8106\u5982\u73bb\u7483\u7684\u7cd6\u8863\u3002\u4e00\u53e3\u54ac\u4e0b\uff0c\u5916\u5c64\u7cd6\u8863\u5580\u5693\u7834\u88c2\uff0c\u6975\u81f4\u751c\u7f8e\u7684\u7cd6\u9999\u7acb\u523b\u8207\u5167\u9921\u5c71\u6942\u7684\u9178\u723d\u6c41\u6c34\u4ea4\u7e54\u5728\u4e00\u8d77\uff0c\u9178\u751c\u9069\u53e3\u3001\u5b8c\u5168\u4e0d\u6cbe\u7259\u3002\u6f02\u4eae\u7684\u7d05\u8272\u4e32\u4e32\u66f4\u662f\u904a\u5ba2\u908a\u8d70\u908a\u62cd\u7167\u6253\u5361\u7684\u8857\u982d\u7f8e\u98df\u3002", "name": "\u8c6b\u5712\u8001\u8857\u51b0\u7cd6\u846b\u8606 (Yuyuan Old Street Tanghulu)", "transport": "\u642d\u4e58\u5730\u943510\u865f\u7dda\u621614\u865f\u7dda\u81f3\u8c6b\u5712\u7ad9\uff0c\u6b65\u884c5\u5206\u9418\u9032\u5165\u8c6b\u5712\u8001\u8857\u3002"}], "name": "\ud83c\udf2d \u8857\u982d\u5c0f\u5403\u8207\u5e02\u96c6\u7f8e\u98df"}}, "name": "\u8c6b\u5712\u8207\u57ce\u968d\u5edf"}};
        const themeHex = "#311042";
        const cityName = "\u4e0a\u6d77";

        const badgeColors = [
            "bg-amber-100 text-amber-800 border-amber-400",
            "bg-sky-100 text-sky-800 border-sky-400",
            "bg-rose-100 text-rose-800 border-rose-400",
            "bg-green-100 text-green-800 border-green-400",
            "bg-indigo-100 text-indigo-800 border-indigo-400",
            "bg-pink-100 text-pink-800 border-pink-400"
        ];

        let currentRegion = "";
        let currentCategory = "";

        const regionContainer = document.getElementById('region-buttons');
        const categoryContainer = document.getElementById('category-buttons');
        const categorySection = document.getElementById('category-section');
        const contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            const regionKeys = Object.keys(db);
            regionKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (regionKeys.length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden');
            categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            const catKeys = Object.keys(categoriesObj);

            catKeys.forEach((catKey, index) => {
                const catData = categoriesObj[catKey];
                const catDisplayName = catData.name || catKey; 
                const colorClass = badgeColors[index % badgeColors.length];

                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${colorClass} opacity-70 hover:opacity-100`;
                btn.innerText = catDisplayName;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });

            if (catKeys.length > 0) selectCategory(catKeys[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105');
                btn.style.opacity = "0.6";
            });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105');
            clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const categories = db[currentRegion]?.categories || {};
            const targetCat = categories[currentCategory];
            const items = Array.isArray(targetCat) ? targetCat : (targetCat?.items || []);

            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">此區域目前無此類別的推薦資料！</p></div>`;
                return;
            }

            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 【新增】：將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">推薦</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 詳細地址：</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 自由行交通：</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md" style="background-color: ${themeHex};">
                            <i class="fa-solid fa-location-arrow"></i> 開啟地圖導航
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
