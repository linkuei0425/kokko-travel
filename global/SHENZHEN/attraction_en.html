ular panoramic views of the border between Shenzhen and Hong Kong.", "name": "Diwang Mansion (Shun Hing Square)", "transport": "Take Metro Line 1 or Line 2 to Grand Theater Station (Exit C3), then walk for about 150 meters."}, {"address": "Central Area of Dongmen Pedestrian Street (near Shenzhen Theater), Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.3 Stars | Founded in 1688 during the Kangxi reign of the Qing Dynasty, this academy boasts a history of over 300 years and stands as Dongmen Old Street\u0027s most iconic traditional Lingnan clan academy. Designed with gray bricks, green tiles, exquisite wood carvings, and flush gable roofs, it exudes quaint charm. Having served as a reception center during the Canton-Hong Kong strike, it now sits tucked away within the bustling Dongmen Pedestrian Street, combining rich history with artistic value.", "name": "Siyue Academy", "transport": "Take Metro Line 1 or Line 3 to Laojie Station (Exit F), then walk for about 250 meters."}, {"address": "No. 2 Dongning Road, Nantang Community, Dongmen Subdistrict, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.2 Stars | Located on Dongning Road in Dongmen Old Street, this early 20th-century two-story brick-and-wood building was originally the \u0027Hong\u0027an Restaurant\u0027 of the local Shenzhen Market. Following the outbreak of the Anti-Japanese War in 1938, General Ye Ting established the headquarters for the Dongjiang Anti-Japanese Guerrilla Force here. The architecture seamlessly blends early 20th-century Lingnan arcade house style with Western elements, housing precious historical photos and artifacts inside.", "name": "Former Site of General Ye Ting\u0027s Headquarters", "transport": "Take Metro Line 1 or Line 3 to Laojie Station (Exit C), then walk for about 300 meters."}, {"address": "No. 5018 Shennan East Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 Stars | Opened in 1989 as one of the early \u0027Eight Great Cultural Facilities\u0027 of the Special Economic Zone, it is situated at the core of the MixC shopping district. Grand and elegant, its architecture skillfully combines modernist lines with classic theater aesthetics. Serving as a cradle for Shenzhen\u0027s performing arts, it stands as an iconic cultural landmark that witnessed the city\u0027s transformation from a sleepy border town into an international metropolis.", "name": "Shenzhen Grand Theatre", "transport": "Take Metro Line 1 or Line 2 directly to Grand Theater Station (Exit B)."}, {"address": "No. 1008 Jianshe Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.1 Stars | Located adjacent to the Luohu Port, the current station building was rebuilt in 1991, featuring a calligraphy sign inscribed by Deng Xiaoping. As the primary gateway connecting Hong Kong and Mainland China after the Reform and Opening-Up, this modern transportation hub has witnessed hundreds of millions of passenger journeys and economic miracles. Its grand hall and iconic clock tower form many visitors\u0027 very first impression of Shenzhen.", "name": "Shenzhen Railway Station Building", "transport": "Take Metro Line 1 directly to Luohu Station (Exit A1 or A2)."}, {"address": "Around the intersection of Dongmen Middle Road and Jiefang Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 Stars | Originating in the mid-Ming Dynasty, Dongmen Old Street (Shenzhen Ancient Market) is the city\u0027s oldest commercial birthplace. A traditional stone archway (Paifang) stands at its center, surrounded by restored late-Qing and early-Republic Lingnan arcade buildings and bronze sculptures like the \u0027Century Clock\u0027 and the \u0027Giant Century Bronze Tricycle\u0027, faithfully recreating the bustling charm of old Shenzhen market life.", "name": "Dongmen Old Street Archway and Historic Buildings", "transport": "Take Metro Line 1 or Line 3 to Laojie Station (Exit A or D) and walk from there."}, {"address": "No. 5047 Shennan East Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.3 Stars | Situated in the Caiwuwei Financial Zone next to MixC, this building was constructed in the mid-to-late 1990s as the former headquarters of China\u0027s first listed regional commercial bank. Its striking golden-yellow glass curtain wall and unique curved classical colonnade showcase the grand momentum of the early Special Economic Zone\u0027s booming financial sector, making it an iconic financial landmark along Luohu\u0027s Shennan Boulevard.", "name": "Shenzhen Development Bank Building", "transport": "Take Metro Line 1 or Line 2 to Grand Theater Station (Exit F), then walk for about 200 meters."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 6 Nanji Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 stars | Located in the heart of Luohu District adjacent to The MixC commercial area, Luohu Art Museum is an influential modern public art space in eastern Shenzhen. The museum regularly hosts high-caliber contemporary art, watercolor, calligraphy, and photography exhibitions, featuring works by renowned domestic and international artists alongside emerging creators. Featuring a sleek modern architectural style and excellent lighting, it offers a peaceful and comfortable viewing environment for art enthusiasts\u2014a perfect spot to immerse yourself in artistic culture after shopping.", "name": "Luohu Art Museum", "transport": "Take Shenzhen Metro Line 2 to Hubei Station, Exit A, then walk for about 5 minutes."}, {"address": "Next to Nantang Commercial Plaza, Dongmen Pedestrian Street, Luohu District, Shenzhen", "feature": "\u2b50 4.3 stars | Situated in the center of the bustling Dongmen Old Street pedestrian area, Siyue Academy is a 300-year-old Qing Dynasty Lingnan-style building. Once a reception station during the Canton-Hong Kong Strike, it holds immense historical, cultural, and revolutionary memorial significance. With its blue bricks, grey tiles, and painted beams, the academy houses rich historical artifacts and photographic displays tracing Shenzhen\u0027s transformation from an ancient fishing village to a modern metropolis. Amidst the lively commercial district, Siyue Academy stands as a quiet, elegant sanctuary of history and art.", "name": "Siyue Academy", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Laojie Station, Exit F, then walk for about 3 minutes."}, {"address": "No. 1015 Heping Road, Luohu District, Shenzhen", "feature": "\u2b50 4.2 stars | Located on Heping Road in Luohu District, close to Luohu Port and The MixC Shopping Mall, Shenzhen Heping Protestant Church is one of the city\u0027s older downtown churches. The church features a simple, solemn exterior and a tranquil, reverent interior ambiance. Every weekend and during holidays, it holds solemn worship services and musical praise gatherings. For visitors who appreciate architectural aesthetics or seek spiritual peace, Heping Church exemplifies Shenzhen\u0027s diverse and inclusive urban cultural heritage.", "name": "Shenzhen Heping Protestant Church", "transport": "Take Shenzhen Metro Line 1 to Luohu Station, Exit A2, then walk for about 8 minutes."}, {"address": "No. 2 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 stars | Located in the Huangbeiling area of Luohu, Shenzhen Antique City is a major hub for antiques and art trading in South China, featuring dedicated exhibition spaces and museum areas. The collection displays a vast array of precious classical furniture, ceramics, jade, calligraphy, paintings, and folk artifacts, highly favored by collectors and culture enthusiasts. More than just a marketplace for antiques, it functions as a living museum of traditional Chinese art, regularly hosting antique appreciation salons and cultural exchange events.", "name": "Shenzhen Antique City Museum", "transport": "Take Shenzhen Metro Line 2 or Line 5 to Huangbeiling Station, Exit D, then walk for about 6 minutes."}, {"address": "No. 4018 Jiefang Road, Luohu District, Shenzhen", "feature": "\u2b50 4.1 stars | Established in the 1960s, Shenzhen Theater is a historic cultural landmark that predates the Shenzhen Special Economic Zone, situated in the heart of Dongmen Old Street. Beyond regular Chinese opera performances, film screenings, and stage plays, it features dedicated art and cultural exhibition halls. The gallery frequently hosts regional opera exhibitions, intangible cultural heritage handicraft displays, and vintage photography exhibitions of Shenzhen, allowing visitors to enjoy modern entertainment while gaining deep insight into the city\u0027s cultural context and artistic heritage.", "name": "Shenzhen Theater Art Gallery", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Laojie Station, Exit F, then walk for about 2 minutes."}, {"address": "69th Floor, Diwang Mansion, No. 5002 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 stars | Located on the top floor of Diwang Mansion adjacent to Luohu The MixC, \u0027Shen-Kong Window\u0027 features not only a 360-degree observation deck offering breathtaking views of Shenzhen and Hong Kong, but also a dedicated history and cultural exhibition hall. Through rich historical photographs, scale models, interactive multimedia installations, and precious documents, the exhibition details the shared history and development of Shenzhen and Hong Kong alongside the glory of China\u0027s Reform and Opening-Up, perfectly blending high-altitude city sightseeing with rich cultural history education.", "name": "Diwang Sightseeing - Shen-Kong Window History Exhibition", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit C3, then walk for about 3 minutes."}, {"address": "No. 2060 Taibai Road, Luohu District, Shenzhen", "feature": "\u2b50 4.2 stars | The Luohu Cultural Center serves as a core hub for promoting public arts and culture in Luohu District, equipped with modern art exhibition halls and versatile performance spaces. Free and open to the public year-round, the exhibition hall regularly hosts community fine art shows, photography exhibitions, public calligraphy contests, and various intangible cultural heritage events. It vibrant displays the artistic vitality of Shenzhen\u0027s grassroots communities, making it a great destination to experience authentic local community atmosphere.", "name": "Luohu Cultural Center Exhibition Hall", "transport": "Take Shenzhen Metro Line 3 to Shuibei Station, Exit A, then walk for about 10 minutes."}, {"address": "Inside the Dongmen Old Street Historic District, Luohu District, Shenzhen", "feature": "\u2b50 4.3 stars | Shenzhen Market (Shenzhen Xu, now Dongmen Old Street) is one of the birthplaces of Shenzhen. Situated in the Dongmen Historical District, this exhibition hall documents and showcases centuries of commercial and social development from the market\u0027s founding in the early Qing Dynasty to the present. Featuring reconstructed historical storefronts, traditional street vendor tools, retro everyday items, and valuable archival documents, it transports visitors back in time to old Shenzhen, offering an authentic taste of local history and culture.", "name": "Shenzhen Market History Exhibition Hall", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Laojie Station, Exit A, then walk for about 4 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 3071 Renmin North Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Established in 1983, Renmin Park is one of Shenzhen\u0027s oldest parks, renowned for its diverse Chinese rose exhibitions. The park features traditional pavilions, artificial lakes, and a central island, shaded by lush trees and filled with birdsong, making it a rare tranquil sanctuary in the bustling downtown of Luohu. Locals and tourists often stroll, admire flowers, and row boats here, immersing themselves in the rich Lingnan garden charm and a relaxed pace of life.", "name": "Renmin Park", "transport": "Take Shenzhen Metro Line 3 to Shaibu Station, Exit C, then walk for about 5 minutes."}, {"address": "No. 1001 Hongling Middle Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located adjacent to The MixC and Shenzhen Grand Theater, Lizhi Park is named for its large grove of ancient lychee trees. The park boasts the expansive Li Lake, stone arch bridges, waterfront platforms, and the famous Deng Xiaoping Portrait Plaza. With lush green lawns and picturesque lake reflections, it serves as a local cultural and recreational landmark\u2014perfect for an afternoon stroll or relaxing by the lake while gazing at the Luohu skyline.", "name": "Lizhi Park", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit B, then walk for about 3 minutes."}, {"address": "No. 48 Tongxin Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Situated at the intersection of Tongle Road and Tongxin Road in Luohu, this is Shenzhen\u0027s oldest park dedicated specifically to children. Lushly shaded with an elegant atmosphere, it offers classic amusement rides alongside spacious grassy areas perfect for family picnics and walks. The abundant greenery provides a fresh, joyful urban oasis right next to the bustling Dongmen Commercial Area.", "name": "Shenzhen Children\u0027s Park", "transport": "Take Shenzhen Metro Line 3 to Shaibu Station, Exit D1, then walk for about 8 minutes."}, {"address": "No. 1142 Cuizhu Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Cuizhu Park is renowned for its bamboo landscape, featuring dozens of bamboo varieties such as Yellow Groove Bamboo, Buddha\u0027s Belly Bamboo, and Fernleaf Bamboo. Built along a hill, it offers well-maintained hiking trails and viewing platforms where visitors can enjoy panoramic views of the bustling Luohu Dongmen area. With swaying bamboo and crisp, fresh air, it is a favorite spot for local residents to enjoy morning exercise and hikes in nature.", "name": "Cuizhu Park", "transport": "Take Shenzhen Metro Line 3 to Cuizhu Station, Exit B2, then walk for about 6 minutes."}, {"address": "No. 2023 Wenjin North Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Centered around a lotus ecosystem, Honghu Park boasts spectacular views in summer when thousands of lotus flowers bloom across massive ponds. The park also features a romantic bald cypress forest, whose leaves turn vibrant shades of red and reflect beautifully on the water in autumn and winter. Equipped with boardwalks, a lotus exhibition hall, and an egret sanctuary, it is an essential ecological park for photography enthusiasts and nature lovers in Luohu.", "name": "Honghu Park", "transport": "Take Shenzhen Metro Line 7 to Honghu Station, Exit A, then walk for about 2 minutes."}, {"address": "No. 4006 Aiguo Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Donghu Park is one of the largest comprehensive parks in Luohu District, backed by Wutong Mountain and facing Shenzhen Reservoir. Rich in natural resources, it features the Chigeng Mountain Scenic Area, ornamental plant gardens, artificial lakes, and ancient tree groves. The annual Shenzhen Chrysanthemum Show in autumn attracts millions of visitors. With excellent walking trails, it\u0027s ideal for hiking, cycling, and family picnics.", "name": "Shenzhen Donghu Park", "transport": "Take Shenzhen Metro Line 5 to Tai\u0027an Station, Exit C, then transfer to a bus or walk for about 15 minutes."}, {"address": "Intersection of Shennan East Road and Caiwuwei 1st Street, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.1 Stars | Nestled in the financial heart of Luohu near The MixC and Shun Hing Square (Di Wang Building), this pocket green park blends exquisite landscaping with surrounding skyscrapers. Featuring leisure benches, scenic fountains, and tree-lined walkways, it offers busy professionals and shoppers a refined urban sanctuary to take a short break, soak in the sunshine, and enjoy nature.", "name": "Caiwuwei Community Park", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit C3, then walk for about 2 minutes."}, {"address": "Intersection of Huangbei Road and Qingxi Road, Luohu District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.2 Stars | Situated near the Dongmen Commercial Area, Huangbeiling Park is a community mountain park built along hillside terrain, featuring tranquil stone step trails and shaded pavilions. With dense vegetation and a quiet, peaceful atmosphere, it offers panoramic views of the surrounding urban scenery. It is a wonderful getaway to escape commercial hustle and enjoy gentle mountain breezes and quiet moments.", "name": "Huangbeiling Park", "transport": "Take Shenzhen Metro Line 2 or Line 5 to Huangbeiling Station, Exit B, then walk for about 10 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Dongmen Pedestrian Street, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | As one of Shenzhen\u0027s oldest and most iconic commercial districts, Dongmen Pedestrian Street holds countless urban memories for locals. Blending modern commerce with old-school Shenzhen nostalgia, its bustling streets are packed with shops offering everything from budget clothing and specialty snacks to trendy toys. The massive bronze Century Clock and the Old Street History Museum are classic landmarks. At night, neon lights illuminate the vibrant street, making it the best spot to experience local Shenzhen life and enjoy street photography.", "name": "Dongmen Pedestrian Street", "transport": "Take Shenzhen Metro Line 1 or 3 to Laojie Station, Exit A or F, and walk right over."}, {"address": "No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.7 Stars | As the pioneer of top-tier luxury shopping malls in Shenzhen, Luohu MixC brings together flagship concept stores of top international luxury brands and fine dining restaurants. The mall boasts grand, modern architecture featuring geometric lines, a massive glass dome, and regularly updated high-profile art exhibitions and pop-up installations that draw fashion enthusiasts for photo shoots. It is not only a shopping haven but also a prime spot showcasing modern urban luxury.", "name": "The MixC Luohu", "transport": "Take Shenzhen Metro Line 1 or 2 to Grand Theater Station, directly accessible via the connecting walkway from Exit C3 or F."}, {"address": "No. 3002 Jiefang Road, Luohu District, Shenzhen", "feature": "\u2b50 4.3 Stars | Located near Laojie Station, Shenzhen Wenheyou creates a stunning retro-futuristic time capsule. It faithfully recreates a cyberpunk landscape of 1980s and 90s Shenzhen and traditional Cantonese alleyways, with crisscrossing neon signs, vintage residences, and Hong Kong-style storefronts\u2014every angle feels like a retro movie shot. Beyond its visually impactful scenes, it brings together Lingnan food specialties and trendy art spaces, making it the hottest hip gathering spot in Luohu.", "name": "Shenzhen Wenheyou", "transport": "Take Shenzhen Metro Line 1 or 3 to Laojie Station, Exit G, and walk about 100 meters."}, {"address": "69th Floor, Diwang Mansion, No. 5002 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | Diwang Mansion (Shun Hing Square) was once the tallest building in Asia and remains an iconic Shenzhen landmark. Located on the top 69th floor, \u0027Meridian View Centre\u0027 is a high-altitude observation deck featuring a 360-degree panoramic view, allowing visitors to overlook the magnificent urban skyline at the border of Shenzhen and Hong Kong. Combining interactive light displays with a historical gallery, it offers breathtaking views whether you visit during the day for the cityscape or at night for the dazzling city lights.", "name": "Diwang Mansion Sightseeing", "transport": "Take Shenzhen Metro Line 1 or 2 to Grand Theater Station, Exit D, and walk for about 3 minutes."}, {"address": "Next to Nantang Commercial Plaza, Dongmen Pedestrian Street, Luohu District, Shenzhen", "feature": "\u2b50 4.2 Stars | Hidden within the bustling Dongmen Old Street, Siyue Academy is a 300-year-old Qing Dynasty building brimming with classic Lingnan architectural style. Its white walls, black tiles, flying eaves, and carved beams stand in striking contrast to the surrounding modern skyscrapers, showcasing a unique blend of ancient and modern beauty. Once a contact station during the Canton-Hong Kong strike, it carries deep historical heritage, making it a serene oasis and a perfect backdrop for Hanfu or vintage photography.", "name": "Siyue Academy", "transport": "Take Shenzhen Metro Line 1 or 3 to Laojie Station, Exit A, and walk about 300 meters."}, {"address": "No. 2028 Renmin South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | Kingglory Plaza is a trendy landmark in Luohu\u0027s Guomao business district, featuring a giant open-air plaza and a modern sky garden. The mall boasts abundant natural lighting inside, and its massive atrium frequently hosts themed pop-up stores, large-scale art installations, and festive light shows. At night, the spacious outdoor walkways and colorful building facade illuminate magically, attracting countless young people to shop, hang out, and take photos in a vibrant urban atmosphere.", "name": "Kingglory Plaza", "transport": "Take Shenzhen Metro Line 1 to Guomao Station, directly accessible via the connecting walkway from Exit A."}, {"address": "No. 3002 Renmin South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.3 Stars | The Shenzhen International Trade Centre Building is a famous witness to the history of China\u0027s Reform and Opening-up, once setting the miracle of \u0027Shenzhen Speed\u0027 by constructing one floor every three days. The top floor houses a famous revolving restaurant where guests can savor exquisite cuisine or Cantonese dim sum while slowly rotating to enjoy 360-degree views of Luohu\u0027s old city and the lush green mountains of Hong Kong across the border. Carrying historic glory, it is a must-visit cultural and architectural landmark.", "name": "Shenzhen International Trade Centre Building", "transport": "Take Shenzhen Metro Line 1 to Guomao Station, Exit C, and walk about 200 meters."}, {"address": "1st-3rd Floor, Dongmenting Commercial Plaza, Luohu District, Shenzhen", "feature": "\u2b50 4.1 Stars | Dongmenting Food Plaza is the most popular and vibrant street food hub in the Dongmen shopping district, famous for its visually stunning giant neon signboards and cyberpunk cityscape. It brings together hundreds of local street food stalls and viral snacks from across the country. Wandering through the bustling, brightly lit indoor street packed with lively energy makes it an unmissable hot spot for young travelers and food lovers looking to capture Shenzhen\u0027s nightlife.", "name": "Dongmenting Food Plaza", "transport": "Take Shenzhen Metro Line 1 or 3 to Laojie Station, Exit C, and walk about 150 meters."}], "name": "Top Check-in Spots"}}, "name": "Luohu Dongmen and The MixC"}, "nanshan_hi_tech": {"categories": {"cat_1": {"items": [{"address": "Inside MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | Located at the core of the MixC World shopping district, Dachong Zheng Family Ancestral Hall is one of the few century-old historical structures fully preserved and meticulously restored during Shenzhen\u0027s urban village redevelopment. Originally built in the Qing Dynasty, the ancestral hall features a traditional Lingnan architectural layout with three halls and two courtyards. The interior boasts exquisite wood carvings, plaster moldings, and ornate eaves, reflecting a profound clan cultural heritage. Framed by modern premier commercial areas and super-tall office towers, this charming ancient hall presents a unique blend of history and modernity, serving as a symbolic cultural landmark within the High-Tech Park.", "name": "Dachong Zheng Family Ancestral Hall", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and walk for about 3 minutes."}, {"address": "Near the intersection of Gaoxin South 1st Road and Dachong 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Dachong Tianhou Temple is one of the oldest places of folk worship around Nanshan Hi-Tech Park, embodying the spiritual heritage of the former Dachong fishing and farming community. Meticulously restored alongside the development of MixC World and the tech park, the temple retains classical Qing Dynasty Lingnan features, including upturned eaves, colorful murals, and carved stone pillars. Dedicated to the goddess Mazu, incense continuously burns here. It serves not only as a cultural bond for local villagers seeking their roots, but also offers a tranquil, soul-soothing historical refuge amidst the bustle for busy tech professionals.", "name": "Dachong Tianhou Temple", "transport": "Take Metro Line 1 to Hi-Tech Park Station, Exit B, and walk for about 5 minutes."}, {"address": "Next to Elephant Plaza, MixC World, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | The Dachong Historic Banyan Tree \u0026 Memory Plaza was intentionally preserved as a natural and historical landmark during the planning of MixC World. Standing at the center are several banyan trees over a century old, which used to be the main gathering spot for former Dachong villagers. The design team seamlessly integrated the ancient trees into a modern urban plaza surrounded by seating areas and historical information plaques. Tracing Dachong\u0027s dramatic transformation from a farming village into a tech power hub and trendy commercial district, it stands as a warm, emotionally resonant historical site in the technology park.", "name": "Dachong Historic Banyan Tree \u0026 Memory Plaza", "transport": "Take Metro Line 1 to Hi-Tech Park Station, Exit A, enter MixC World and walk for about 2 minutes."}, {"address": "No. 2666 Keyuan South Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | Standing 392.5 meters tall, the China Resources Tower is affectionately nicknamed \u0027Spring Bamboo\u0027 for its unique conical bamboo shoot silhouette, making it one of Nanshan District\u0027s most iconic modern landmarks. Designed by the internationally renowned architecture firm KPF, the facade features a striking diagrid steel structure that exudes a strong geometric aesthetic and high-tech feel. Symbolizing Shenzhen\u0027s vibrant innovation bursting forth like bamboo after spring rain, its base connects seamlessly with nearby retail hubs and Shenzhen Bay Park, making it a must-visit destination for exploring modern architectural craftsmanship.", "name": "China Resources Tower \u0027Spring Bamboo\u0027", "transport": "Take Metro Line 2 or Line 11 to Houhai Station, Exit G, and walk for about 8 minutes."}, {"address": "No. 33 Haitian 2nd Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | Serving as the global headquarters of Tencent, Tencent Binhai Towers is one of the most futuristic architectural landmarks in the core of Nanshan Hi-Tech Park. Designed by NBBJ, the complex consists of two towers (248m and 194m tall) connected by three massive skybridge \u0027belts\u0027, symbolizing the spirit of internet connectivity. Incorporating cutting-edge smart, eco-friendly tech, its distinct geometric faceted exterior creates an immensely futuristic look when illuminated at night\u2014a brilliant example of contemporary technological architecture.", "name": "Tencent Binhai Towers", "transport": "Take Metro Line 9 to Shenzhen University South Station, Exit A, and walk for about 6 minutes."}, {"address": "Inside Yuehai Campus, Shenzhen University, No. 3688 Nanhai Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | Located right next to the High-Tech Park and built in the early 1980s, the Yuehai Campus of Shenzhen University represents one of the most iconic educational architectural complexes from the early Special Economic Zone era. Designed by master architect Mo Bozhi and others, it combines Lingnan garden elements with minimalist modernist aesthetics. Highlights such as the Performing Arts Center, \u0027Stone No. 5\u0027 Plaza, and the old library feature white walls, red bricks, and geometric lines, designated as exemplary modern architectural works of Shenzhen. Surrounded by lush trees, serene lake views, and cultural architecture, it\u0027s an ideal spot to experience Shenzhen\u0027s early technology and cultural development.", "name": "Shenzhen University Yuehai Campus Historic Buildings", "transport": "Take Metro Line 1 to Shenzhen University Station, Exit C, and walk about 5 minutes into the campus."}, {"address": "Water Plaza, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | The Water Plaza and \u0027Bubblecoat Elephant\u0027 art installation serve as iconic modern architectural and public art landmarks at MixC World. Designed by Dutch conceptual artist Florentijn Hofman, the long-trunked elephant perches atop the building while dancing fountains complement the sleek, streamlined commercial architecture. This design breaks the boundaries of traditional retail spaces, harmoniously blending artistic landmarks with complex architectural forms, making it one of the most popular trendsetting spots and photo opportunities in Nanshan Hi-Tech Park.", "name": "MixC World Water Plaza \u0026 Bubblecoat Elephant Landmark", "transport": "Take Metro Line 1 to Hi-Tech Park Station, Exit A, and walk right out into the Water Plaza."}, {"address": "No. 9 Gaoxin South 9th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | Weixin Software Science Park is one of the premier early developments in Nanshan Hi-Tech Park, distinguished by its clever blending of modern high-tech office towers with classical Jiangnan Chinese garden architecture. Featuring traditional pavilions, winding paths over trickling streams, and waterside gazebos, it creates a serene, classic oasis amid a landscape of concrete and steel. By integrating traditional architectural language into a contemporary business park, it has become a unique cultural landmark brimming with historic charm.", "name": "Weixin Software Science Park Classical Garden Architecture", "transport": "Take Metro Line 9 to Yuehaimen Station, Exit A, and walk for about 7 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located in the heart of Nanshan High-Tech Park, MixC World is not only a trendy shopping paradise, but also an urban cultural space blending modern art and literary exhibitions. It frequently hosts world-class contemporary art exhibitions, cross-over design shows, and pop-art pop-ups. The famous giant \u0027Bubble Elephant\u0027 installation is a wildly popular photo spot. By regularly inviting renowned domestic and international artists to curate, the venue seamlessly integrates commercial space with artistic experiences, injecting a rich artistic atmosphere into the tech park.", "name": "MixC World Art \u0026 Culture Space", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and walk about 200 meters."}, {"address": "Inside Yuehai Campus, Shenzhen University, No. 3688 Nanhai Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Nestled within the beautiful Yuehai Campus of Shenzhen University, near the core area of the High-Tech Park, this museum serves as a key university hub for artistic creation and academic exchange. Featuring several professional exhibition halls, it permanently displays excellent works by faculty and students, contemporary fine art, and various themed special exhibitions. The serene and elegant environment is steeped in an academic and youthful vibe, making it a sophisticated palace of knowledge and art near the tech district.", "name": "Shenzhen University Art Museum", "transport": "Take Shenzhen Metro Line 1 to Shenzhen University Station, Exit C, and walk about 10 minutes into the campus."}, {"address": "No. 2239 Nanhai Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Shenzhen Nanshan Christian Church is an iconic modern religious landmark in Nanshan District, just a few minutes\u0027 drive from the High-Tech Park. Its grand, solemn architecture blends modern geometric aesthetics with traditional Gothic elements. Inside, Gothic spires and stained-glass windows cast colorful light under the sun, creating a peaceful and sacred atmosphere. Beyond regular Sunday services, the church frequently hosts music concerts and community charity events, offering a rare spiritual sanctuary amidst the bustling tech life.", "name": "Shenzhen Nanshan Christian Church", "transport": "Take Shenzhen Metro Line 9 to Nanshan Book City Station, Exit D, and walk about 500 meters."}, {"address": "No. 16 Gaoxin North 6th Road, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Adjacent to the North Area of High-Tech Park, Gobei 16 Creative Park is a cultural and creative cluster transformed from old industrial plants. Its art exhibition space retains industrial steel-structure features, integrating contemporary art exhibitions, independent bookstores, cafes, and handicraft workshops. It frequently hosts independent illustration shows, vinyl record exhibitions, creative markets, and salon lectures\u2014serving as a vibrant hub of inspiration for young tech engineers and art enthusiasts.", "name": "Gobei 16 Creative Park Art Space", "transport": "Take a bus to Gaoxin North 1st Road Station and walk about 3 minutes."}, {"address": "No. 9013 Shennan Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Located a short distance east of MixC World, He Xiangning Art Museum is China\u0027s first national-level art museum named after an individual. Featuring an elegant white and gray facade with sleek lines, the architecture exudes modern Oriental aesthetics. In addition to permanent exhibitions of masterpieces by the famous painter and revolutionary He Xiangning, it frequently hosts contemporary women\u0027s art exhibitions, overseas Chinese art exhibitions, and various international contemporary art biennales, making it a landmark cultural hub in the Shenzhen-Hong Kong region.", "name": "He Xiangning Art Museum", "transport": "Take Shenzhen Metro Line 1 to OCT (Overseas Chinese Town) Station, Exit C, and walk about 300 meters."}, {"address": "No. 9 Xinglong West Street, OCT, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located just one metro stop away from High-Tech Park and MixC World, OCAT Shenzhen is one of South China\u0027s most influential non-profit contemporary art institutions. Housed in converted industrial factory buildings, it focuses on experimental, critical, and contemporary practices, hosting high-quality visual art exhibits, architectural design shows, contemporary performances, and academic forums. Showcasing works by avant-garde domestic and international artists, it is a must-visit for exploring the evolution of contemporary art.", "name": "OCAT Shenzhen", "transport": "Take Shenzhen Metro Line 1 to OCT Station, Exit A, and walk about 8 minutes."}, {"address": "Inside Shenzhen University, No. 3688 Nanhai Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Situated at the heart of the Shenzhen University campus, this museum showcases the university\u0027s development history since its founding, as well as the outstanding achievements of its research teams in science, technology, and the humanities. Rich in historical artifacts, interactive multimedia zones, and displays from the School of Art \u0026 Design, it perfectly embodies Shenzhen\u0027s pioneering spirit as a Special Economic Zone. It is an ideal visit for travelers fond of culture, history, and academic atmosphere.", "name": "Shenzhen University History and Tech Cultural Hall", "transport": "Take Shenzhen Metro Line 1 to Shenzhen University Station, Exit A2, and walk into the campus."}, {"address": "China Resources Land Tower, No. 9668 Shennan Avenue, Nanshan District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Perched on the upper floors of the China Resources Land Tower at the heart of MixC World in the High-Tech Park, this gallery combines stunning city skyline views with contemporary art exhibitions. Partnering regularly with renowned international galleries and curators, it presents sculptures, photography, digital art, and immersive light shows. The minimalist yet grand gallery design allows visitors to immerse themselves in fine art while overlooking Nanshan Tech Park\u0027s bustling cityscape, showcasing a captivating blend of technology and art.", "name": "China Resources Land Tower Art Gallery", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and access directly via the underground passage at MixC World."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Near the intersection of Shennan Avenue and Shahe West Road, Nanshan District, Shenzhen (Adjacent to MixC World)", "feature": "\u2b50 4.8 stars | A large waterfront ecological green corridor running adjacent to Nanshan Science and Technology Park and MixC World, hailed as one of Shenzhen\u0027s most beautiful urban greenways. Smooth jogging paths and dedicated bike lanes line both sides of the river, surrounded by lush vegetation and seasonal blossoms. It is not only an ideal post-work spot for tech park professionals to stroll, relax, or jog, but also a fantastic destination for visitors to experience the harmonious blend of Shenzhen\u0027s urban modernity and natural beauty. Resting posts and scenic platforms are scattered along the way, offering panoramic views of distant skyscrapers framed by riverside greenery.", "name": "Dasha River Ecological Corridor", "transport": "About a 5-minute walk from Exit A of Hi-Tech Park Station (Metro Line 1), or walkable from Window of the World / Baishizhou Station (Metro Line 1)."}, {"address": "No. 7001 Beihuan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | An expansive comprehensive municipal park located in the North Zone of the Science \u0026 Technology Park, featuring vast sunny lawns and dense groves. Offering a tranquil environment, the park is equipped with circular running tracks, children\u0027s play facilities, and cozy teahouses, making it a popular weekend spot for nearby residents and white-collar workers to enjoy picnics and family camping. The gently undulating lawns are perfect for flying kites or lounging under the sun\u2014a rare, refreshing oasis next to a high-density tech hub.", "name": "Dasha River Park", "transport": "About a 10-minute walk from Exit C of Chaguang Station (Metro Line 7), or take various bus routes to \u0027Dasha River Park\u0027 Stop."}, {"address": "Intersection of Songpingshan Road and Langshan Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | A neighborhood ecological park nestled in the heart of Nanshan Science \u0026 Technology Park North Zone, serving as a secret garden for local tech employees looking to take lunchtime strolls or unwind at sunset. Shaded by lush trees, the park features charming small bridges over trickling streams, rich multi-layered vegetation, badminton courts, fitness equipment, and rest pavilions. In spring, colorful blossoms burst into bloom, creating a delightful scenery that showcases a warm, vibrant side of the tech zone.", "name": "Songpingshan Park", "transport": "Songping Station (Metro Line 13, under construction), or take a bus to \u0027Songpingshan Park\u0027 Stop and walk for 1 minute."}, {"address": "Near the intersection of Kefa Road and Keyuan Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 stars | A pocket urban oasis nestled among skyscrapers in the Central Zone of Nanshan Science \u0026 Technology Park, tailor-made for busy tech workers. It features modern scenic walkways, wooden boardwalk rest areas, and geometrically designed greenery, seamlessly blending modern technology with natural green spaces. Many engineers and entrepreneurs enjoy grabbing a coffee, taking a break, and brainstorming ideas here during work hours. It is an exquisite spot to experience Shenzhen\u0027s tech-startup atmosphere and modern urban landscape design.", "name": "Science Park", "transport": "About a 6-minute walk from Exit B of Hi-Tech Park Station (Metro Line 1)."}, {"address": "No. 8 Baishi Road East, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | A national wetland park adjacent to the east side of MixC World, boasting a rare, sprawling mangrove wetland ecosystem right in central Shenzhen. Operating on a strict reservation-only system with visitor limits, the park preserves wildlife habitats and native ecology exceptionally well. Equipped with boardwalks, bird-watching hides, and a nature school, visitors can watch egrets and other rare birds skimming across the water. It offers an incredible natural exploration experience\u2014a tranquil paradise just steps away from the bustling MixC World commercial hub.", "name": "OCT Wetland Park", "transport": "About a 10-minute walk from Exit D1 of Shenzhen Bay Park Station (Metro Line 9), or about an 8-minute taxi ride from MixC World."}, {"address": "No. 2 Xiangshan Middle Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A hidden mountain park near the MixC World commercial hub that preserves the beauty of an original secondary forest. Towering trees provide fresh, crisp air alongside stone steps, a hilltop viewing platform, a tranquil artificial lake, and waterfalls. Reaching the summit rewards you with panoramic views of Nanshan Science \u0026 Technology Park\u0027s skyscraper skyline and the artistic streets of OCT Loft. It is a perfect cool retreat and fresh-air sanctuary for urban dwellers who love hiking without traveling far.", "name": "Yanhan Mountain Country Park", "transport": "About a 10-minute walk from Exit B of Qiaocheng North Station (Metro Line 2), or about a 10-minute bike ride from MixC World."}, {"address": "No. 3329 Keyuan South Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.9 stars | China\u0027s first large-scale urban park themed around \u0027Talent\u0027, located in the southern extension of the Science \u0026 Technology Park adjacent to Shenzhen Bay. Built around Houhai Inner Bay, it offers grand, magnificent scenery with sweeping sea views and a stunning vantage point of the iconic \u0027Spring Bamboo\u0027 tower. The park features a Walk of Fame, a talent memorial wall, infinity waterfront platforms, and an extensive lakeside running track. The breathtaking skyline light show at night makes it one of Shenzhen\u0027s most iconic modern parks.", "name": "Shenzhen Talent Park", "transport": "About a 10-minute walk from Exit H of Houhai Station (Metro Line 2/11), or via Talent Park Station (Metro Line 13)."}, {"address": "End of Longzhu 6th Road, Nanshan District, Shenzhen (Longzhu Gate Entrance)", "feature": "\u2b50 4.7 stars | Serving as a natural urban green barrier on the north side of the Science \u0026 Technology Park, this large country park\u0027s Longzhu Gate entrance is just a short drive from the North Zone. Home to rich flora and fauna, it boasts well-maintained hiking trails dotted with pavilions and scenic platforms. Reaching the main peak\u0027s Jimu Pavilion rewards you with a 360-degree panoramic view of Nanshan Science \u0026 Technology Park, Qianhai Bay, and Shenzhen Bay. It is the premier natural destination for tech park sports enthusiasts for weekend morning workouts or night climbs to admire the cityscape.", "name": "Tanglang Mountain Country Park", "transport": "About a 15-minute walk from Exit D of Taoyuancun Station (Metro Line 7), or take a taxi to \u0027Tanglang Mountain Country Park Longzhu Gate\u0027."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Water Plaza, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 Stars | Created by Dutch conceptual artist Florentijn Hofman, the giant art installation \u0027Bubblecoat Elephant\u0027 stands 12 meters high with a 24-meter-long trunk that occasionally mists water from its tip. It is the most iconic landmark at Nanshan MixC World. Perched atop the mall roof, its adorable yet impressive scale draws countless visitors for photos. At night, accompanied by light shows, it exudes a magical colorful charm. With themed pop-up installations regularly featured nearby, this is an absolute must-visit spot when exploring the Tech Park and MixC World.", "name": "Bubblecoat Elephant at MixC World", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and walk for about 3 minutes."}, {"address": "Outdoor Block, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 Stars | MixC World High Street is an outdoor block featuring international fashion flagship stores, trendy pop-up shops, and open-air cafes. Designed with a sleek, modern geometric architectural style, floor-to-ceiling glass display windows, and artistic installations, the street is filled with stylish street art and trendy visuals. It regularly hosts art exhibitions, pop music performances, and fashion markets. Its vibrant modern urban vibe makes it a hotspot for photography enthusiasts and street style lovers.", "name": "MixC World High Street", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and walk for about 2 minutes."}, {"address": "Intersection of Houhai Avenue and Binhai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 Stars | Serving as the global headquarters for tech giant Tencent, the Tencent Seafront Towers were designed by a renowned architectural firm. Two skyscrapers are connected by three double-decker skybridges, creating a vertical and horizontal structure that symbolizes the Internet of Things and human connections. The exterior features high-tech metal panels and geometric glass curtain walls that reflect sunlight into stunning futuristic light patterns. Although internal office areas require authorization to enter, the outer plaza and striking architectural silhouette have made it a futuristic landmark for tech fans and architecture photographers worldwide.", "name": "Tencent Seafront Towers", "transport": "Take Shenzhen Metro Line 9 to Shenzhen University South Station, Exit A, and walk for about 8 minutes."}, {"address": "Near the intersection of Keji South Road and Dasha River, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 Stars | Known as Shenzhen\u0027s \u0027Seine River\u0027, the Dasha River Ecological Corridor runs through the Nanshan Hi-Tech Park area. The Tech Park section combines natural waterscapes with the modern skyline of the high-tech district. Featuring sprawling greenways, waterfront platforms, shimmering riverways, and seasonal flower blooms, it creates a striking contrast between nature and urban architecture. It\u0027s an ideal spot for morning jogs, sunset walks, and vibrant photo shoots with towering skyscrapers in the background\u2014a true urban oasis for tech park professionals and visitors alike.", "name": "Dasha River Ecological Corridor - Tech Park Section", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit D, and walk about 10 minutes to the riverside greenway."}, {"address": "Shenzhen University Yuehai Campus, No. 3688 Nanhai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 Stars | Adjacent to Nanshan Hi-Tech Park, Shenzhen University\u0027s Yuehai Campus is famous for its striking postmodern geometric architecture. Key structures like the School of Architecture, Science \u0026 Engineering buildings, and Art Building incorporate large geometric openwork walls, sleek white lines, and fair-faced concrete designs. Intersecting light and shadows create a visually breathtaking effect. Renowned as a haven for architecture and photography fans, any snapshot yields cool, minimalist aesthetic shots, drawing many young visitors in search of creative angles.", "name": "Shenzhen University Yuehai Campus Architecture", "transport": "Take Shenzhen Metro Line 1 to Shenzhen University Station, Exit C, and walk for about 5 minutes to enter the campus."}, {"address": "NL115, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located in the heart of MixC World, the Art Plaza centers around the modern geometric architecture of the MixC Theater, complimented by large outdoor seating stairs and landscape pools. The plaza frequently hosts rotating art exhibitions, large installations, and creative markets. Whether enjoying the sunny light play on the steps by day or the dreamy nocturnal light projections on modern facades by night, this spot is highly recommended for art lovers and trendsetters.", "name": "MixC Art Plaza \u0026 Theater", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit A, and walk for about 4 minutes."}, {"address": "Intersection of Tonggu Road and Shennan Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Dachong Urban Plaza surrounds office skyscrapers like CR Tower, showcasing the sleek urban modernization of Nanshan Hi-Tech Park. Framed by shimmering glass curtain walls, the plaza features streamlined seating, water features, and artistic evening illumination. At night, sparkling light shows from surrounding skyscrapers interlock with ground illumination, reflecting Shenzhen\u0027s vibrancy as a global tech and innovation hub. It\u0027s a prime spot for capturing cinematic urban nightscapes.", "name": "CR Tower \u0026 Dachong Urban Plaza", "transport": "Take Shenzhen Metro Line 1 to Hi-Tech Park Station, Exit B; right outside the exit."}, {"address": "Intersection of Gaoxin South 4th Road and Keyuan South Road, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 Stars | Located in the core of Nanshan Hi-Tech Park, Shenzhen Hi-Tech Park is a sprawling urban oasis surrounded by tech giants. The park features streamlined walkways, lush green lawns, and contemporary geometric sculptures, seamlessly blending tech aesthetics with natural ecology. Standing in the center, you can take in a 360-degree view of corporate headquarters housing tech unicorns and multinational titans\u2014a breathtaking visual experience perfect for capturing photos themed \u0027symbiosis of technology and nature\u0027.", "name": "Shenzhen Hi-Tech Park", "transport": "Take Shenzhen Metro Line 2/Line 8 to Keyuan Station, Exit B, and walk for about 6 minutes."}], "name": "Trending Photo Spots"}}, "name": "Nanshan Science and Technology Park and MixC World"}, "oct_shekou": {"categories": {"cat_1": {"items": [{"address": "Inside Sea World Plaza, No. 1128 Wanghai Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 Stars | Originally built in France as the luxury ocean liner \u0027ANCERVILLE\u0027, the Minghua Cruise was purchased by China in 1973 and renamed \u0027Minghua\u0027. It served as an ocean liner hosting numerous VIPs. In 1983, it was permanently berthed on the Shekou coastline, where Deng Xiaoping personally inscribed \u0027Sea World\u0027 for it, pioneering China\u0027s first cruise-themed commercial and entertainment complex. This legendary 10,000-ton ship has now become an iconic Shekou landmark, housing a boutique hotel, specialty restaurants, and scenic bars. Complemented by water shows and night light displays around the hull, it perfectly showcases Shekou\u0027s historic transition from an old industrial zone into an international, vibrant district.", "name": "Minghua Cruise at Sea World", "transport": "Take Shenzhen Metro Line 2 or Line 12 to \u0027Sea World Station\u0027, Exit A, and walk for about 3 minutes."}, {"address": "No. 1187 Wanghai Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 Stars | Designed by Pritzker Prize-winning Japanese architect Fumihiko Maki, this center is one of Shenzhen\u0027s most iconic contemporary architectural and cultural landmarks. Designed around the concept of a triple view of \u0027Mountain, Sea, and City\u0027, three elevated exhibition halls pointing in different directions seamlessly connect Shekou\u0027s natural mountain and coastal scenery with the modern urban landscape. The complex houses the V\u0026A Gallery, Horizon Hall, and multiple artistic exhibition spaces, alongside a large stepped plaza extending to the waterfront and a seaside promenade. The sleek white exterior and glass curtain wall glisten in the sunlight, attracting countless architecture enthusiasts and art lovers.", "name": "Sea World Culture and Arts Center", "transport": "Take Shenzhen Metro Line 2 to \u0027Sea World Station\u0027, Exit A, and walk towards the coast along Wanghai Road for about 10 minutes."}, {"address": "No. 39 Chiwan 1st Road, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Originally built during the Song Dynasty, Chiwan Tianhou Temple is the largest and historically most influential Mazu (Sea Goddess) temple in Shenzhen. It served as an important historical venue for Zheng He\u0027s fleet to perform sea worship ceremonies before embarking on voyages to the Western Oceans. Rebuilt multiple times during the Ming and Qing dynasties, it displays classic Lingnan traditional architectural style with antique glazed tile roofs, exquisite stone and wood carvings, and grand sacred halls. Dedicated to Goddess Mazu, the temple sees constant incense offerings. Surrounded by ancient trees and brick walls, it preserves nearly a millennium of Shekou\u0027s maritime culture and folk belief traditions.", "name": "Chiwan Tianhou Temple", "transport": "Take Shenzhen Metro Line 2 to \u0027Chiwan Station\u0027, Exit C, then transfer to Bus B945 or walk for about 15 minutes."}, {"address": "Yingzuishan Hilltop, Intersection of Chiwan 6th Road and Ganghang Road, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.3 Stars | Constructed during the Kangxi reign of the Qing Dynasty, the Left Fort of Chiwan is the only fully preserved historical remnant of the \u0027Chiwan Fort\u0027, a major naval defense stronghold on the Nanshan Peninsula. Situated at a high point commanding the harbor entrance, it served as a crucial frontline fort during Lin Zexu\u0027s anti-opium campaign and the Opium Wars. Constructed from granite blocks, the site still preserves an authentic Qing Dynasty iron cannon, conveying a profound sense of modern Chinese naval defense history. Surrounded by lush greenery and featuring a full-length bronze statue of Lin Zexu, standing on the ancient fort offers a panoramic view of the busy shipping lanes of Chiwan Port, evoking a quiet reflection across time.", "name": "Left Fort of Chiwan", "transport": "Take Shenzhen Metro Line 2 to \u0027Chiwan Station\u0027, transfer to Bus B945 to \u0027Chiwan Zuo Paotai Station\u0027, and walk up the hill."}, {"address": "Shaodi Road, Chiwan Village, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.1 Stars | The Tomb of the Young Song Emperor is the only Song Dynasty imperial tomb in the Lingnan region. It is the final resting place of Zhao Bing, the last emperor of the Southern Song Dynasty. In 1279, following the collapse of the Southern Song at the Battle of Yamen, the 8-year-old emperor was carried into the sea by his minister to die; his body washed ashore near Chiwan and was buried by local villagers and monks. The solemn and understated mausoleum complex includes a sacrificial altar, the young emperor\u0027s tomb, a stone statue depicting Lu Xiufu carrying the emperor into the sea, and a memorial tablet corridor. As a key protected cultural heritage site in Shenzhen, this tranquil historic site bears witness to a poignant turning point in late Song history.", "name": "Tomb of the Young Song Emperor", "transport": "Take Shenzhen Metro Line 2 to \u0027Chiwan Station\u0027, Exit C, and walk for about 10 minutes."}, {"address": "Inside the former Eastern Industrial Zone, No. 2 Jinxiu North Street, Overseas Chinese Town (OCT), Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 Stars | Formerly an old industrial estate (Eastern Industrial Zone) established with foreign investment in the 1980s, OCT-LOFT has fully preserved the original factory architecture and tall, weathered sawtooth roofs. Guided by the concept of \u0027industrial heritage regeneration\u0027, it has transformed into a creative and cultural landmark housing contemporary art galleries, design studios, themed cafes, and independent bookstores. Featuring exposed rough red brick walls, industrial steel beams, and lush climbing vines, it exhibits a unique industrial retro aesthetic combined with contemporary spatial art charm.", "name": "OCT-LOFT Creative Culture Park", "transport": "Take Shenzhen Metro Line 1 to \u0027Qiaocheng East Station\u0027, Exit A, and walk for about 5 minutes to enter the park."}, {"address": "Building F2, South District, OCT-LOFT, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Transformed from several old factory buildings, OCAT Shenzhen (OCT Contemporary Art Terminal) forms the architectural core of contemporary art within OCT-LOFT. The venue maximizes the high-ceilinged, expansive space and raw industrial texture of the former factories. Minimalist white walls and concrete floors paired with sophisticated lighting design create an elegant, tranquil atmosphere for contemporary art exhibitions. Main and branch exhibition halls are arranged in harmony alongside public art installations, perfectly illustrating Shenzhen\u0027s spatial transformation of breathing new contemporary cultural life into historic industrial architecture.", "name": "OCAT Shenzhen", "transport": "Take Shenzhen Metro Line 1 to \u0027OCT Station\u0027, Exit A, and walk for about 8 minutes."}, {"address": "No. 8 Haiwan Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 Stars | Formerly the Guangdong Float Glass Factory established in the 1980s, Shekou Value Factory won national technological and architectural awards and stands as an important historical artifact of Shenzhen\u0027s early industrialization during the Reform and Opening-Up era. After operations ceased, its iconic towering chimneys, massive concrete silos, and expansive industrial frameworks were preserved, transforming it into an industrial heritage park featuring cultural exhibitions, maker spaces, and film shooting locations. Having served as a main venue for the Bi-City Biennale of Urbanism\\Architecture (UABB), it showcases a magnificent Bauhaus industrial architectural aesthetic and a deep sense of history.", "name": "Shekou Value Factory", "transport": "Take Shenzhen Metro Line 2 or Line 5 to \u0027Chiwan Station\u0027, then transfer to Bus M105 or B945 to \u0027Value Factory Station\u0027."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 1187 Wanghai Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | Designed by renowned Japanese master architect Fumihiko Maki, this is one of Shenzhen\u0027s most iconic cultural landmarks. The grand building boasts clean, modern lines with panoramic views facing Shenzhen Bay and distant Hong Kong. Inside, it houses a V\u0026A Gallery, exhibition halls, a performing arts theater, and various design workshops. It frequently hosts world-class contemporary art, design, and photography exhibitions. The architectural harmony of mountains and sea makes it a must-visit haven for photography enthusiasts and art lovers.", "name": "Sea World Culture and Arts Center", "transport": "Metro Line 2, Sea World Station, Exit A, about an 8-minute walk"}, {"address": "No. 9013 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | China\u0027s first national-level art museum named after an individual, and a classic cultural landmark in the OCT area. The elegant white modern architecture incorporates traditional Chinese garden aesthetics, offering a tranquil ambiance. It mainly collects, displays, and researches the artworks and historical documents of He Xiangning, while regularly holding domestic and international contemporary art exhibitions and academic symposia, possessing profound cultural depth.", "name": "He Xiangning Art Museum", "transport": "Metro Line 1, OCT Station, Exit C, about a 3-minute walk"}, {"address": "Building F2, South District, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Located in the heart of the OCT-LOFT Creative Park, this space was transformed from an old industrial factory, oozing a rich vibe of industrial vintage and contemporary art. OCAT is dedicated to promoting Chinese contemporary art and experimental exhibitions spanning visual arts, architecture, and modern design. It serves as a vital hub for contemporary artists and creators to exchange ideas and showcase works.", "name": "OCAT Shenzhen (OCT Center for Contemporary Art)", "transport": "Metro Line 1, Qiaocheng East Station, Exit A, about a 10-minute walk"}, {"address": "3rd Floor, Sea World Culture and Arts Center, No. 1187 Wanghai Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | The nation\u0027s first historical museum themed around China\u0027s \u0027Reform and Opening Up\u0027, located inside the Sea World Culture and Arts Center. Through rich historical artifacts, old photographs, 3D scale models, and interactive multimedia displays, it vividly recreates Shekou\u0027s historic days as the testing ground for China\u0027s economic reforms, highlighting the backdrop behind the iconic slogan \u0027Time is money, efficiency is life.\u0027", "name": "Museum of Shekou Reform and Opening Up", "transport": "Metro Line 2, Sea World Station, Exit A, about an 8-minute walk"}, {"address": "No. 8 Haiwan Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 stars | Formerly a famous float glass factory, this space was repurposed into a creative art zone combining contemporary art exhibitions, architectural design expos, creative offices, and large cultural events. It preserves visually striking massive silos, towering chimneys, and concrete industrial ruins. The raw industrial style creates a powerful contrast with modern art, making it a stellar spot for photography and spatial art appreciation.", "name": "Shekou Value Factory", "transport": "Metro Line 2, Chiwan Station, Exit C, then about a 5-minute bus or taxi ride"}, {"address": "No. 94 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 stars | Located in Shekou\u0027s old town area, this historic church boasts a solemn and peaceful environment. Combining Western Gothic and modern architectural elements, its soaring cross and elegant white exterior stand out gracefully amid the bustling neighborhood. Offering multilingual Mass services, it is a spiritual haven and cultural community hub for both locals and expatriates.", "name": "Shekou Catholic Church", "transport": "Metro Line 2, Dongjiatou Station, Exit A, about a 6-minute walk"}, {"address": "No. 15 Gongye 1st Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 stars | A prominent place of Christian worship in Shekou featuring a sleek, modern design topped with a striking red cross. The main sanctuary inside is spacious and bright, evoking a dignified yet peaceful ambiance. Grand worship services and musical gatherings are held during weekend services and major holidays like Christmas, showing a rich blend of cultural and religious charm.", "name": "Shekou Christian Church", "transport": "Metro Line 2, Shuiwan Station, Exit D, about a 7-minute walk"}, {"address": "No. 9 Chiwan 6th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Situated on the Chiwan Peninsula in Shekou and built during the Song Dynasty, this is one of the largest Tianhou (Mazu) Temples in Lingnan, now also serving as a folk history museum. The complex features grand architecture with intricately carved beams and painted rafters. It preserves valuable artifacts and historical documents on the Maritime Silk Road, Zheng He\u0027s voyages, and Lingnan Mazu belief, making it the best destination to explore Shenzhen\u0027s maritime history.", "name": "Chiwan Tianhou Temple Museum", "transport": "Metro Line 2, Chiwan Station, Exit C, about a 12-minute walk"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 45 Xiangshan Middle Street, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Tucked away in the heart of OCT, Yanhan Mountain Country Park serves as a lush green lung for the city. Interwoven with dense tropical rainforest flora and winding hiking trails, it is a natural treasure offering a raw ecological feel amidst urban surroundings. Towering trees provide abundant shade, while artificial lakes and cascading waterfalls complement each other beautifully. Visitors can soak in high concentrations of negative oxygen ions and enjoy a peaceful atmosphere away from the hustle and bustle. The summit features an observation deck offering panoramic views of the OCT Creative Culture Park and Shenzhen Bay, making it perfect for morning jogs, picnics, or nature watching.", "name": "Yanhan Mountain Country Park", "transport": "Take Shenzhen Metro Line 1 to OCT Station, Exit B, and walk for about 10 minutes."}, {"address": "No. 8 Baishi Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | An essential part of the Shenzhen Bay coastal wetlands, OCT Wetland Park is China\u0027s first national urban wetland park. It features a vast mangrove ecosystem and rich migratory bird habitats, drawing large flocks of rare birds every autumn and winter. To protect its fragile environment, the park operates on an advance reservation system. It offers kilometers of wooden boardwalks, birdwatching hides, and an eco-education exhibition hall. Strolling here allows visitors to admire mangrove flora, watch waterfowl at play, and witness the harmonious coexistence of a modern metropolis and natural ecosystem.", "name": "OCT Wetland Park", "transport": "Take Shenzhen Metro Line 9 to Shenzhen Bay Park Station, Exit D1, and walk for about 8 minutes."}, {"address": "South of the intersection of Binhai Boulevard and Shahe West Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Stretching for tens of kilometers connecting OCT to the Shekou coastline, Shenzhen Bay Park is the city\u0027s most famous coastal green corridor. It features several themed areas like Egret Slope, Liuhua Mountain, and Sea Breeze Sports Park, complete with dedicated cycling paths and seaside boardwalks. Standing along the shoreline, visitors can enjoy unobstructed views of Hong Kong\u0027s rolling mountains across the bay and the grand Shenzhen Bay Bridge. As the sun sets, golden rays bathe the ocean while flocks of birds take flight\u2014making it the ultimate spot for sunset watching, cycling, and relaxing.", "name": "Shenzhen Bay Park", "transport": "Take Shenzhen Metro Line 9 to Shenzhen Bay Park Station, Exit C2; the park is right outside."}, {"address": "No. 8 Yanshan Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Towering over the Shekou Peninsula with a peak elevation of around 336 meters, Dananshan is the premier vantage point for sweeping panoramas of Shekou Port, Sea World, and Qianhai Bay. The park boasts dense forest coverage and well-maintained stone hiking trails, such as Qitian Pavilion Trail and Minghua Trail. Although climbing to the summit requires some exertion, the path is refreshed by cool breezes and lush greenery. The Qitian Pavilion at the top is a spectacular spot for night views, where dazzling city lights from Sea World and busy harbor shipping channels create a mesmerizing sight.", "name": "Dananshan Park (Nanshan Park)", "transport": "Take Shenzhen Metro Line 2 to Shuiwan Station, Exit C, and walk about 15 minutes to the Nanshan Park trailhead."}, {"address": "Intersection of Chiwan 6th Road and Chiwan 2nd Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | Compared to the bustling Dananshan, Xiaonanshan Park is quieter and more rustic\u2014a hidden gem favored by locals seeking tranquil nature. The summit preserves the ancient Chiwan Beacon Tower, steeped in history. From the summit observation deck, visitors get an incredible perspective of the busy Chiwan Container Terminal and the expansive Lingdingyang Bay, where huge container ships navigate through a striking blend of industrial power and natural beauty. With lush trees, fresh air, and spacious stone trails, it is ideal for light hiking and photography.", "name": "Xiaonanshan Park", "transport": "Take Shenzhen Metro Line 2/5 to Chiwan Station, Exit C, then transfer to Bus B945 and get off at Xiaonanshan Park Stop."}, {"address": "No. 82 Gongyuan Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Built in 1987, Sihai Park is Shekou\u0027s oldest and most iconic comprehensive public park. Centered around East Lake and West Lake, it features crystal-clear waters, weeping willows, classical pavilions, and zigzag bridges. The park\u0027s standout attraction is the giant modern sculpture \u0027Peerless Golden Bull\u0027, giving the space a rich artistic atmosphere. Recently renovated, it blends traditional Lingnan garden architecture with modern landscape design, offering teahouses, children\u0027s play areas, and a lakeside running track\u2014a perfect place to experience Shekou\u0027s relaxed pace of life.", "name": "Sihai Park", "transport": "Take Shenzhen Metro Line 12 to Sihai Station, Exit A, and walk for about 3 minutes."}, {"address": "Next to Sea World, Taizi Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 Stars | Located right next to the Sea World commercial district, Weiboshan Park is a compact hill park rich in the history of Shenzhen\u0027s reform and opening-up. China\u0027s first microwave communication station was established here in 1979, symbolizing the pioneering spirit of the Shekou Industrial Zone. Though small, the park is enveloped in lush greenery with gentle wooden boardwalks and rest pavilions. From the lookout deck, you can enjoy close-up views of the Minghua Ship, the Sea World musical fountain, and surrounding vibrant shopping streets\u2014a peaceful oasis bridging history and modernity.", "name": "Weiboshan Park", "transport": "Take Shenzhen Metro Line 2/12 to Sea World Station, Exit A, and walk for about 5 minutes."}, {"address": "Coastal section of Sea World, Wanghai Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Situated where Shekou\u0027s Sea World meets the shore, Nuwa Coastal Park is famous for its grand white marble statue of Nuwa Mending the Sky. The park features wide seafront promenades and landscaped green belts along the coastline, offering gentle sea breezes and open views. Visitors can admire the chic architecture of the Sea World district alongside sweeping bay vistas. At night, dazzling water and light shows transform the area into a romantic coastal hotspot, ideal for dating, family walks, and photos.", "name": "Sea World Nuwa Coastal Park", "transport": "Take Shenzhen Metro Line 2/12 to Sea World Station, Exit A, and walk about 8 minutes through the Sea World commercial area to the seafront."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Sea World Plaza, No. 1128 Wanghai Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Originally the French luxury cruise ship \u0027ANCERVILLE\u0027, the Minghua Ship was purchased by China in 1973 and berthed in Shekou, where Deng Xiaoping personally inscribed \u0027Sea World\u0027. Today, this massive cruise liner has been transformed into a multi-functional landmark featuring a luxury hotel, specialty dining, and exotic bars. At night, the ship comes alive with a musical fountain light show, casting a romantic glow over the harbor\u2014an iconic check-in spot you shouldn\u0027t miss in Shekou.", "name": "Sea World Minghua Ship", "transport": "Take Shenzhen Metro Line 2 or Line 12 to Sea World Station, Exit A, and walk for about 3 minutes."}, {"address": "No. 1187 Wanghai Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 stars | Designed by Pritzker Prize-winning Japanese architect Fumihiko Maki, this coastal landmark features sleek, modern lines that seamlessly blend mountains, sea, and city views. It houses the Design Society galleries, V\u0026A Gallery, and a large theater, while its rooftop garden offers panoramic views of Shenzhen Bay and Yuen Long in Hong Kong. Brimming with artistic vibe and cultural sophistication, it\u0027s perfect for taking photos and immersing yourself in world-class exhibitions.", "name": "Sea World Culture and Arts Center", "transport": "Take Shenzhen Metro Line 2 to Sea World Station, Exit A, and walk along the Wanghai Road Coastal Boardwalk for about 8 minutes."}, {"address": "No. 2 Jinxiu North Street, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Transformed from abandoned factories in an old industrial zone, this cultural and creative haven is split into North and South areas. Lined with lush trees, its shaded pathways feature creative graffiti walls, independent art galleries, cozy cafes, unique design boutiques, and creative markets. Preserving industrial history while injecting vibrant contemporary art, it\u2019s a top choice for art enthusiasts and photographers seeking inspiration and striking photos.", "name": "OCT Loft Creative Culture Park", "transport": "Take Shenzhen Metro Line 1 to Qiaocheng East Station, Exit A, and walk for about 10 minutes."}, {"address": "No. 2008 Binhai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 stars | A grand entertainment landmark combining natural ecology, modern commerce, and waterfront leisure. Centered around \u0027Qushui Bay\u0027\u2014a unique water-town commercial district\u2014OCT Harbour features the spectacular Heart of the Sea Water Show Theater, the Ocean Secret Aquarium, and numerous high-end flagship restaurants. At night, sparkling lights reflect off the water against modern architecture, making a stroll along the waterfront a stunning night-view experience for visitors.", "name": "OCT Harbour", "transport": "Take Shenzhen Metro Line 9 to Shenzhen Bay Park Station, Exit E; located right outside the exit."}, {"address": "No. 8 Haiwan Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.3 stars | Formerly a float glass factory and a main venue for the Bi-City Biennale of Urbanism\\Architecture, this site preserves massive concrete silos, towering chimneys, and sprawling industrial structures. Combined with cool street graffiti and modern trendy studios, its bold industrial vintage aesthetic makes it a popular filming location for movies and fashion shoots, delivering powerful visual photos.", "name": "Value Factory Shekou", "transport": "Take Shenzhen Metro Line 2 to Chiwan Station, Exit E, then take a shuttle bus or taxi for about 5 minutes."}, {"address": "No. 9 Liyuan Road, Shekou, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 stars | Transformed from an old glass bottle factory into a trendy pink-themed space, this hub is a favorite among youth and influencers. Its signature check-in spots feature romantic pink installations and silvergrass fields. Packed with artisan shops, pet-friendly cafes, themed pop-up markets, and aesthetic design exhibitions, it offers vibrant inspiration and ideal photo ops.", "name": "G\u0026G Creative Community", "transport": "Take Shenzhen Metro Line 2 to Shuiwan Station, Exit D, and walk for about 8 minutes."}, {"address": "Inside Egrets Slope, Shenzhen Bay Park, Binhai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 stars | Located on the shores of Shenzhen Bay, this panoramic glasshouse bookstore is hailed as Shenzhen\u0027s most beautiful seaside reading space. Facing the sea, floor-to-ceiling glass windows offer sweeping views of azure waters and the Hong Kong skyline across the bay. Visitors can sip coffee while reading, or sit on the lawn watching egrets fly against sunset skies\u2014a breathtaking blend of nature and culture that went viral on social media.", "name": "Egrets Slope Book House at Shenzhen Bay Park", "transport": "Take Shenzhen Metro Line 9 to Shenzhen Bay Park Station, Exit D2, and walk along the coastal boardwalk for about 10 minutes."}, {"address": "Guanghua Street, OCT, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 stars | A green oasis at the heart of the OCT community and an aesthetically designed eco-architectural complex, known as a forest garden in the city. The plaza seamlessly integrates architecture with nature using organic curves and lush greenery. Every summer when the Royal Poinciana trees bloom, fiery red blossoms attract countless photographers. Surrounded by serene quality cafes and unique eateries, it offers a delightfully relaxed pace of life rare in Shenzhen.", "name": "OCT Ecological Plaza", "transport": "Take Shenzhen Metro Line 1 to OCT Station, Exit B, and walk for about 5 minutes."}], "name": "Popular Photo Hotspots"}}, "name": "Overseas Chinese Town and Shekou Sea World"}, "yantian_dameisha": {"categories": {"cat_1": {"items": [{"address": "Chung Ying Street, Shatoujiao Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Chung Ying Street is the most iconic historical landmark in Shatoujiao, Shenzhen, established after the signing of the Convention for the Extension of Hong Kong Territory in 1898. Spanning less than 0.5 km, this unique street once embodied \u0027one street, two systems\u0027\u2014a special zone within a special zone\u2014with one side governed by Shenzhen and the other by Hong Kong. Retaining its old commercial layout, a stroll here offers a deep sense of historical gravity alongside the chance to buy duty-free and Hong Kong goods. It serves as a living fossil witnessing the modern history of China and Hong Kong.", "name": "Chung Ying Street", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station (Exit B), walk about 15 minutes, and obtain a Border Special Management Area Permit to enter."}, {"address": "No. 9 Huancheng Road, Shatoujiao Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Located near the entrance of Chung Ying Street in Shatoujiao Town, this four-story museum comprehensively displays the century-long history of Shatoujiao and Chung Ying Street. It houses a rich collection of precious histor
