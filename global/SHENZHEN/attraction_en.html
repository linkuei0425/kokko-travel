        const dbData = {"baoan_qianhai": {"categories": {"cat_1": {"items": [{"address": "No. 3109 Shennan Avenue, Nanshan District, Shenzhen (Northeast of Qianhai Area)", "feature": "\u2b50 4.6 stars | Also known as \"Xin\u0027an Ancient City\", Nantou Ancient City boasts a history of nearly 1,700 years. It served as the administrative center and coastal defense stronghold for ancient Lingnan, hailed as the \"root of Shenzhen-Hong Kong history and culture.\" The ancient town preserves Lingnan-style historic architecture, memorial arches, the East Gate Tower, and the Qing Dynasty Dongguan Assembly Hall. Following recent urban micro-renovations, it seamlessly blends historic relics, creative districts, special exhibitions, and trendy cafes into a unique cultural landmark where classical charm meets modern life. It\u0027s a must-visit destination to explore the shared past and present of Shenzhen and Hong Kong.", "name": "Nantou Ancient City", "transport": "Take Metro Line 12 to Zhongshan Park Station, Exit D, then walk about 5 minutes; or Line 1 to Taoyuan Station, then walk about 10 minutes."}, {"address": "West of the intersection of Qianwan 1st Road and Tinghai Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Qianhai Stone Park is the most iconic modern historical landmark in the Qianhai Cooperation Zone. At its heart sits the \"Qianhai Stone,\" a multi-ton monolith shaped like a ship setting sail, engraved with the characters \"Qianhai\"\u2014a testament to the area\u0027s grand transformation from mudflats into a booming modern district. Built along the coastline, the park features expansive seaside lawns and oceanfront promenades offering incredible vistas of Qianhai Bay\u0027s skyscrapers and the \"Bay Glory\" Ferris wheel. At dusk, it becomes the ultimate spot to photograph breathtaking sunsets and the stunning Qianhai skyline.", "name": "Qianhai Stone Park", "transport": "Take Metro Line 9 to Qianwan Station, Exit D, then transfer to a bus or walk about 15 minutes."}, {"address": "No. 1 Qianwan 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | A defining contemporary landmark in Qianhai, this center features a modern \"gossamer silhouette\" design concept. It cleverly incorporates traditional Lingnan residential architecture elements\u2014such as double-pitched roofs and post-and-lintel structural styles\u2014creating a harmonious blend of Eastern tradition and Western modernity. The building facade presents a translucent, veil-like effect with play of light and shadow, grand yet elegant. Host venue for the 40th Anniversary Celebration of the Shenzhen Special Economic Zone, its internal exhibition hall showcases the achievements of Qianhai\u0027s open development, making it an essential stop to experience Shenzhen\u0027s modern rapid growth and architectural brilliance.", "name": "Qianhai International Conference Center", "transport": "Take Metro Line 9 or Line 11 to Qianwan Station, Exit C, then walk about 8 minutes."}, {"address": "Inside Coastal Cultural Park, intersection of Baohua Road and Haitian Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 stars | Located inside the Coastal Cultural Park in Bao\u0027an Central District, this striking modern architectural complex was designed by renowned architect Rocco Yim\u0027s team under the concept of \"water eroding stone.\" Its sleek lines and futuristic geometric facets have earned it the affectionate nickname \"Voice of the Bay.\" Right beside it stands the 128-meter-tall \"Bay Glory\" Ferris wheel, featuring panoramic giant cabins that make it a dazzling star of Bao\u0027an. At night, spectacular building light shows harmonize with the shimmering Ferris wheel, creating an unforgettable spot to take in Shenzhen\u0027s cutting-edge modern architecture and waterfront views.", "name": "Shenzhen Coastal Performing Arts Centre \u0026 Bay Glory", "transport": "Take Metro Line 5 to Linhai Station, Exit B2 to enter the park directly; or Line 5 to Baohua Station, Exit A, then walk 5 minutes."}, {"address": "No. 39 Chiwan 1st Road, Nanshan District, Shenzhen (Chiwan Area, Qianhai Shekou Free Trade Zone)", "feature": "\u2b50 4.5 stars | Founded in the Song Dynasty and sitting adjacent to southern Qianhai Bay, Chiwan Tianhou Temple (also known as Chiwan Tianhou Ancient Temple) historically served as a crucial navigation mark and blessing sanctuary along the Maritime Silk Road. Great explorers like Zheng He and officials from the Ming and Qing dynasties offered sea prayers here before setting sail. Restored across centuries, the grand temple complex exhibits classic Lingnan temple architecture featuring ornate carved beams, painted rafters, a main gate, front hall, main hall, and rear hall. Containing valuable ancient steles and historic wells, it stands as the most culturally profound religious and architectural heritage site near Qianhai.", "name": "Chiwan Tianhou Temple", "transport": "Take Metro Line 2/5 to Chiwan Station, Exit C, then transfer to Bus B945 to Tianhou Temple Station."}, {"address": "No. 74 Xin\u0027an 2nd Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.3 stars | Originally built in the 1990s as Bao\u0027an County\u0027s library, cultural center, and concert hall, \"Bao\u0027an 1990\" stands as a living witness to the district\u0027s urban evolution. A comprehensive modern transformation preserved its original architectural skeleton and historical memories while introducing geometric volumes and perforated aluminum panels to create a sleek modern design. Today, this upgraded cultural complex combines history exhibitions, art performances, public reading spaces, and creative cultural hub, turning an aging building into a stylish landmark that bridges past heritage with modern urban lifestyle.", "name": "Bao\u0027an 1990 Cultural Center", "transport": "Take Metro Line 12 to Xin\u0027an Park Station, Exit P, then walk about 300 meters."}, {"address": "No. 38 Luotian Road, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.4 stars | Bao\u0027an Stadium is a distinctive modern sports architecture landmark inspired by Guangdong\u0027s local bamboo groves. Its outer facade features hundreds of staggered green steel columns that mimic the elegant, upright posture of a bamboo forest. These columns provide structural support and sunshading while creating a light, dynamic visual aesthetics. Having hosted events for the World University Games (Universiade), this stadium masterfully blends natural motifs with concrete and steel, standing out as a masterpiece of architectural design in Bao\u0027an.", "name": "Bao\u0027an Stadium \u0027Bamboo Forest\u0027", "transport": "Take Metro Line 1 to Baoti Station, Exit A for direct access; or Line 11 to Bao\u0027an Station, then walk about 8 minutes."}, {"address": "Intersection of Chiwan 6th Road and Chiwan 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.1 stars | The Tomb of Emperor Shao of Song is the only imperial mausoleum in Guangdong Province. Located in the Chiwan area at the southern end of Qianhai Bay, it was built at the end of the Southern Song Dynasty to honor Zhao Bing, the last emperor of the Song Dynasty who died following the Battle of Yamen. The mausoleum grounds are quiet and solemn, featuring memorial arches, altars, the imperial tomb, and a statue depicting Lu Xiufu carrying the young emperor into the sea. Though compact in size, this historic site bears solemn witness to the fall of the Song Dynasty and holds profound historical and memorial value.", "name": "Tomb of Emperor Shao of Song", "transport": "Take Metro Line 2/5 to Chiwan Station, Exit B, then walk about 10 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 9 Baoxing Road, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.8 Stars | Known as the \u0027Voice of the Bay Area\u0027, this stunning landmark is located in Oh Bay, Bao\u0027an Central District, and was designed by renowned architect Rocco Yim. Its sleek, dynamic architecture mimics rolling ocean waves. Housing a 1,500-seat grand theater and a 600-seat multi-function hall, it stands as one of Shenzhen\u0027s premier venues for performing arts and cultural exhibitions.", "name": "Bay Opera of Shenzhen", "transport": "Metro Line 5, Linhai Station, Exit B2; about a 5-minute walk."}, {"address": "Intersection of Shangchuan Road and Anshun Road, Zone 71, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 Stars | A unique local landmark blending Gothic revival with modern architectural styles, featuring grand spires and pristine white exterior walls. Inside, the church exudes a serene, solemn vibe with soft light filtering through beautiful stained glass windows, making it a favorite spot for architecture enthusiasts and photographers.", "name": "Bao\u0027an Christian Church", "transport": "Metro Line 5, Xingdong Station, Exit D; transfer to a bus or taxi for about 8 minutes."}, {"address": "Intersection of Dongbin Road and Linghai Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | The central exhibition hall showcasing the planning and achievements of the Qianhai Shenzhen-Hong Kong Modern Service Industry Cooperation Zone. Combining multimedia sound and light displays, a massive 3D master plan model, and interactive screens, it comprehensively illustrates Qianhai\u0027s transformation from mudflats into a modern metropolis\u2014making it a premier window into the area\u0027s future.", "name": "Qianhai Exhibition Hall", "transport": "Metro Line 9, Qianwan Station, Exit D; about a 10-minute walk."}, {"address": "No. 1 Baoxing Road, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located along the Central Green Axis of Bao\u0027an Central District, this building draws design inspiration from ocean waves and unrolling book scrolls. Besides housing vast literary collections, it frequently hosts fine art exhibitions, lectures by renowned figures, and cultural events, offering visitors an immersive space for artistic appreciation and cultural enrichment.", "name": "Bao\u0027an District Library Exhibition Hall", "transport": "Metro Line 5, Baohua Station, Exit D; about a 3-minute walk."}, {"address": "No. 72 Xin\u0027an 2nd Road, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.4 Stars | A vibrant public arts hub rooted in Bao\u0027an\u0027s local heritage, featuring various art galleries, intangible cultural heritage exhibition zones, and multi-purpose performance halls. It regularly hosts free public art shows, hands-on cultural heritage workshops, and literary salons, celebrating rich Lingnan traditions and modern Shenzhen local culture.", "name": "Bao\u0027an Cultural Center", "transport": "Metro Line 12, Xin\u0027an Park Station, Exit C; about an 8-minute walk."}, {"address": "No. 6 Qianwan 1st Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Shenzhen", "feature": "\u2b50 4.6 Stars | The architectural design elegantly merges traditional Lingnan \u0027Guangfu Mansion\u0027 aesthetics with modern tensile membrane structures, featuring a graceful, silk-like roof silhouette. Host to key grand celebrations for Qianhai\u0027s development, it features permanent exhibitions on Qianhai\u0027s achievements, showcasing avant-garde modern engineering alongside an international convention atmosphere.", "name": "Qianhai International Convention Center", "transport": "Metro Line 9, Tinghai Avenue Station, Exit C; about a 6-minute walk."}, {"address": "Hezhou 1st Road, Hezhou Community, Xixiang Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.3 Stars | China\u0027s first public museum dedicated to everyday workers, capturing the historical memories of countless builders and migrant workers across Shenzhen\u0027s 40+ years of Reform and Opening-Up. Its collection includes vintage photographs, factory assembly line artifacts, and daily life items, delivering a deeply moving and authentic tribute to the era.", "name": "Shenzhen Workers Museum", "transport": "Take Metro Line 1 to Xixiang Station, then transfer to Bus M210 and get off at Hezhou Village Station."}, {"address": "No. 88 Longjing 2nd Road, Xin\u0027an Subdistrict, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.3 Stars | Combining scientific education with engaging science-art exhibitions, this venue features a dome theater, 4D motion cinema, and interactive science halls. It frequently hosts cross-disciplinary exhibitions bridging tech and art, making it a fantastic educational destination for families, youth, and curious minds.", "name": "Bao\u0027an Science and Technology Museum", "transport": "Metro Line 5, Lingzhi Station, Exit A; about a 12-minute walk."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Intersection of Baohua Road and Haifu Road, Haihua Community, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 stars | Situated along the coast of Bao\u0027an Central District, covering a total area of 380,000 square meters, this is a mega modern coastal park integrating culture, tourism, art, and ecology. The park\u0027s most eye-catching landmark is the 128-meter-tall giant Ferris wheel, \u0027Bay Glory,\u0027 whose panoramic transparent cabins offer sweeping views of Qianhai Bay and the Shenzhen skyline. Featuring expansive lawns, a seaside promenade, a water show plaza, and modern art installations, it is perfect for late afternoon strolls to watch the magnificent sunset sinking into the ocean horizon. At night, spectacular light and water shows take place, making it one of Shenzhen\u0027s most popular new city landmarks in recent years.", "name": "Bao\u0027an Coastal Cultural Park", "transport": "Metro Line 5 Linhai Station Exit B2, or Baohua Station Exit A, walk about 5 minutes"}, {"address": "West end of Qianwan 1st Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Located along the coastline of the Qianhai Shenzhen-Hong Kong Modern Service Industry Cooperation Zone, Qianhai Stone Park is a historically significant and iconic urban park. The park\u0027s central symbol is the giant \u0027Qianhai Stone\u0027 standing by the sea, inscribed with the characters for \u0027Qianhai\u0027, symbolizing the brilliant journey of Qianhai\u0027s development and opening up. Boasting unbeatable sea views, it features a seaside boardwalk stretching several kilometers and well-maintained green lawns. Standing by the shore, visitors can look out towards Shenzhen Bay Bridge and the Qianhai skyline. On clear days, the sunset views are breathtaking, making it a beloved outdoor retreat and popular photo spot for locals and tourists alike.", "name": "Qianhai Stone Park", "transport": "Metro Line 5 Qianwan Station Exit D, then transfer to a bus or cycle for about 1.5 km"}, {"address": "Seaside at the intersection of Guiwan 1st Road and Qianhai Avenue, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 stars | Qianhai Performance Park is one of the most popular romantic oceanview parks along Qianhai Bay, renowned for its unbeatable sunset viewing angles. The park boasts a wide, soft lawn right next to the blue Qianhai Bay, where visitors can picnic, fly kites, or simply lie on the grass enjoying the sunshine and sea breeze. At dusk, the setting sun paints the sky in shades of pink and purple, while the coastal lighthouse and the distant Yanjiang Expressway sea-crossing bridge form a stunning silhouette, attracting countless photography enthusiasts and couples to capture the romantic moment\u2014a wonderful coastal oasis to unwind.", "name": "Qianhai Performance Park", "transport": "Metro Line 5 Guiwan Station Exit E, about 15 minutes walk or 5 minutes cycle"}, {"address": "South side of Guiwan 1st Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 stars | Guiwan Park is the first major water corridor park in the core area of Qianhai, spanning about 2.2 kilometers in length with a total area of approximately 450,000 square meters. Adopting an eco-friendly \u0027Sponge City\u0027 design concept, the park introduces seawater into inland channels, creating rich wetland ecosystems and waterfront landscapes. The park features scenic bridges, tropical plant trails, water-accessible platforms, and children\u0027s play areas, seamlessly blending modern architectural art with natural scenery. Shaded by lush trees and shimmering waters, strolling here allows visitors to enjoy fresh natural air while taking in grand views of Qianhai\u0027s impressive skyscraper cluster.", "name": "Guiwan Park", "transport": "Metro Line 1 Liyumen Station Exit A, walk about 10 minutes to reach the park area"}, {"address": "Intersection of Baomin 1st Road and Xin\u0027an 4th Road, Zone 13 of Baocheng, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 stars | Bao\u0027an Park is one of the largest municipal parks around the Bao\u0027an Central Area, covering an area of 125 hectares with vegetation coverage exceeding 95%, earning it the title of the \u0027Green Lungs\u0027 of Bao\u0027an District. Nestled against hills and water, the park consists of a mountain zone and a flatland zone, featuring themed plant gardens such as Bamboo Art Garden, Orchid Garden, Peach Blossom Valley, and Begonia Kingdom. Winding mountain trails lead to the summit, offering panoramic views of Bao\u0027an urban area and the distant bay. With its rich botanical resources and quiet trail system, it is an ideal spot for local residents to exercise in the morning, gather with family on weekends, or simply connect with nature.", "name": "Bao\u0027an Park", "transport": "Metro Line 5 Lingzhi Station Exit C1, transfer to Bus M206 or others and get off at Bao\u0027an Park Station"}, {"address": "Near the intersection of Jinwan Avenue and Gushu 1st Road, Xixiang Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Adjacent to the western coast of Bao\u0027an, Xiwan Mangrove Wetland Park is a featured wetland park integrating coastal ecological conservation and leisure tourism. It houses a vast native mangrove ecosystem that attracts numerous seabirds, along with a sea-view boardwalk stretching several kilometers and viewing platforms. The highlight here is close-up view of the magnificent Yanjiang Expressway sea-crossing bridge spanning across the water. Especially under the evening glow of sunset, the elevated bridge, passing flights, and ocean mangroves complement each other to form a visually striking scene\u2014making it a perfect landmark to experience Shenzhen\u0027s blend of marine ecology and modern engineering.", "name": "Xiwan Mangrove Wetland Park", "transport": "Metro Line 11 Bihaiwan Station Exit E, transfer to Bus B887 and get off at Xiwan Park Station"}, {"address": "Intersection of Qianjin 2nd Road and Baotian 3rd Road, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 stars | Located in the northern part of central Bao\u0027an District, Pingluanshan Park is the largest urban forest park in Bao\u0027an. Featuring rolling hills with a peak elevation of about 230 meters, the park preserves well-intact forest vegetation and rich biodiversity. Well-paved mountain hiking trails and pavilions line the park, offering cool shade and fresh air. Reaching the summit viewing platform, visitors can take in panoramic views of Bao\u0027an Central Area\u0027s bustling skyscrapers, as well as look out towards Qianhai Bay and Tiezaishan Park. On clear days, it serves as a fantastic vantage point for watching ocean sunsets and night views, making it ideal for hiking and outdoor sports.", "name": "Pingluanshan Park", "transport": "Metro Line 12 Pingluanshan Station Exit C, walk about 10 minutes to reach the park entrance"}, {"address": "Intersection of Dongbin Road and Tinghai Avenue, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.3 stars | Situated in the core heart of the Qianhai Cooperation Zone, Bauhinia Park is an exquisite urban themed park featuring Hong Kong\u0027s city flower, the Bauhinia (orchid tree). Planted with various species of Bauhinia, the park transforms into a vibrant sea of pink and purple blossoms during blooming season, offering an elegant and charming scene. The park design blends Hong Kong-style landscape gardening with refined leisure spaces, featuring winding flagstone pathways, scenic pavilions, and lush open lawns. Surrounded by Qianhai\u0027s modern commercial high-rises, it creates a serene oasis amidst the bustling city\u2014a hidden gem for Qianhai office workers and tourists to relax and enjoy a peaceful afternoon.", "name": "Bauhinia Park", "transport": "Metro Line 9 Yihai Station Exit C, walk about 5 minutes"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside OH Bay, Intersection of Haitian Road and Baohua Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 Stars | As a trendy new landmark in Shenzhen, this massive 128-meter giant Ferris wheel is located in Bao\u0027an OH Bay. Featuring panoramic oval capsules, it offers incredible 360-degree views. As the wheel gently ascends to its highest point, you can take in unobstructed sea views of Qianhai Bay and modern skyscrapers in the distance. At night, it lights up with a gorgeous light show\u2014making it a top-tier photo spot for photography enthusiasts both day and night.", "name": "Bay Glory Ferris Wheel", "transport": "Metro Line 5, Linhai Station, Exit B2; about a 3-minute walk"}, {"address": "Intersection of Baohua Road and Haixiu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 Stars | OH Bay is an ultra-large urban complex integrating coastal leisure, culture, arts, commerce, and eco-landscapes. It boasts a wide coastal promenade, an avant-garde performing arts center, and design-forward shopping malls. Strolling through the park, you\u0027ll spot modern art installations and lush green lawns everywhere. It\u0027s a fantastic location for capturing romantic sunsets, making it immensely popular among youth and influencers.", "name": "OH Bay", "transport": "Metro Line 5, Baohua Station Exit A or Linhai Station Exit A"}, {"address": "Seaside at the Intersection of Zimao West Street and Qianwan 1st Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Anchored by the iconic \u0027Qianhai Stone\u0027\u2014a landmark symbolizing historical breakthroughs in Qianhai\u0027s reform and opening up\u2014this park sits right along the Qianhai Bay coastline. It features vast ocean views and a clean, beautiful coastal boardwalk. Beyond its rich historical significance, it is a hugely popular photo spot for admiring the skyline of Qianhai\u0027s skyscrapers framed against the sea and sky, especially on bright afternoons and at dusk when sunset glows over the water.", "name": "Qianhai Stone Park", "transport": "Metro Line 5, Qianwan Station Exit D, then transfer to a feeder bus or ride a shared bike"}, {"address": "Guiwan 1st Road, Qianhai Shenzhen-Hong Kong Cooperation Zone, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Guiwan Park serves as the core green corridor landscape park of Qianhai, designed around the concept of a \u0027Tropical Water City\u0027 spanning the entire Qianhai Guiwan area. The park features winding waterways, sleekly designed bridges, ecological wetlands, and expansive lush lawns. Its modern architectural structures contrast dramatically with surrounding sky-scraping financial towers, attracting countless photographers looking to capture striking visuals of nature blending with urban architecture.", "name": "Guiwan Park", "transport": "Metro Line 1/5/11, Qianhaifan Station Exit E; about an 8-minute walk"}, {"address": "No. 1 Baoxing Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 Stars | Hailed as \u0027One of the Most Beautiful Libraries in Shenzhen,\u0027 Bao\u0027an District Library showcases a unique architectural concept inspired by geometric \u0027waves\u0027 and \u0027books.\u0027 Its glass curtain wall refracts captivating light and shadows under the sun. The interior is spacious, bright, and styled with modern minimalist aesthetics. Comfortable reading areas line the giant floor-to-ceiling windows, making it not just a temple of knowledge, but an urban artistic landmark frequented by culture lovers and architecture enthusiasts.", "name": "Bao\u0027an District Library", "transport": "Metro Line 5, Baohua Station Exit D; about a 5-minute walk"}, {"address": "No. 99 Xinhu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 Stars | As one of the largest single commercial complexes in Shenzhen, Uniwalk brings together numerous international brands and gourmet restaurants. Its architectural facade and the grand dragon-shaped sculpture \u0027Dragon Family\u0027 at the entrance have become iconic landmarks. The shopping center houses multiple unique sky gardens and sunken plazas paired with high-tech lighting effects, making it a stylish gathering spot for fashion trends, shopping, and taking trendy photos.", "name": "Uniwalk Bao\u0027an", "transport": "Direct access from Metro Line 1/5, Bao\u0027an Center Station Exit F"}, {"address": "No. 169 Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Qianhai MixC is a premier high-end luxury commercial landmark in Qianhai, blending an open-air streetscape concept with indoor luxury spaces to create a sophisticated, international metropolitan lifestyle aesthetic. The complex features futuristic geometric architecture, light-and-shadow art corridors, and outdoor green terraces, attracting fashion lovers for chic street-style photography and lifestyle shots.", "name": "Qianhai MixC", "transport": "Metro Line 9 Tinghai Avenue Station, or Metro Line 5 Guiwan Station Exit E"}, {"address": "No. 4 Baoxing Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.4 Stars | Adjacent to the Bao\u0027an Library, the Bao\u0027an Youth Palace forms part of the cultural and artistic axis of the Bao\u0027an Central District along with nearby landmarks. The architectural design radiates futuristic technology vibes, featuring streamlined geometric exteriors and metallic facade walls that create striking visual contrast against the blue sky. The geometric staircases and sky corridors inside serve as ideal photo backdrops, drawing young visitors looking to capture sci-fi-style minimalist architectural shots.", "name": "Bao\u0027an Youth Palace", "transport": "Metro Line 5, Baohua Station Exit D; about a 4-minute walk"}], "name": "Top Photo Hotspots"}}, "name": "Bao\u0027an Center and Qianhai"}, "dapeng_peninsula": {"categories": {"cat_1": {"items": [{"address": "Dapeng Ancient City, Pengfei Road, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | Fully named \u0027Huizhou Prefecture Coastal Defense Dapeng Camp\u0027, Dapeng Ancient City was established in 1394 during the Ming Dynasty. It served as a vital coastal defense fortress in southern China during the Ming and Qing Dynasties, and is the origin of Shenzhen\u0027s nickname, \u0027Pengcheng\u0027. The city preserves an intact Ming and Qing Dynasty layout, narrow alleys, and numerous general mansions and historic dwellings, showcasing rich maritime defense heritage and Hakka architectural charm.", "name": "Dapeng Ancient City (Dapeng Fortress)", "transport": "Take Bus E11 or M471 to \u0027Dapeng Ancient City Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk from there."}, {"address": "Zheng Street, Dapeng Ancient City, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.5 stars | Built during the Daoguang reign of the Qing Dynasty, this grand residence belonged to Admiral Lai Enjue, a celebrated naval commander who fought against British aggression. Spanning over 2,500 square meters, it showcases classic Lingnan Hakka \u0027three-room two-corridor\u0027 architecture. Complete with memorial arches, three courtyard halls, side wing rooms, and ornate carvings, the mansion displays precious artifacts and historical documents from the Battle of Kowloon.", "name": "General Lai Enjue Mansion", "transport": "Accessible by walking inside the Dapeng Ancient City scenic area."}, {"address": "Dongmen Lane, Dapeng Ancient City, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.3 stars | Built during the Jiaqing reign of the Qing Dynasty, this mansion was the residence of Liu Qilong, an Admiral of the Fujian Navy. Featuring a classic Lingnan courtyard layout, it boasts precise construction, premium materials, and exquisite wood, stone, and brick carvings. Multiple exhibition rooms inside introduce General Liu\u0027s life and the history of coastal defense along the southeastern shores.", "name": "General Liu Qilong Mansion", "transport": "Accessible by walking inside the Dapeng Ancient City scenic area."}, {"address": "South Gate of Dapeng Fortress, Pengfei Road, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.4 stars | The South Gate is the grandest and best-preserved of the fortress\u0027s four original gates. Built with a solid granite strip foundation topped by a magnificent two-story gate tower, climbing up offers sweeping views of the entire ancient city and distant mountains. The historic plaza in front of the gate is the most iconic photo spot in the area.", "name": "South Gate of Dapeng Fortress", "transport": "Take Bus M471 or M457 to \u0027Dapeng Ancient City Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk about 3 minutes."}, {"address": "Dongshan Temple, Pengfei Road, Dapeng Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.5 stars | Founded in 1394 during the Ming Dynasty, Dongshan Temple sits at the foot of Mount Dapeng (Longshan) on the east side of the ancient city. As one of Lingnan\u0027s renowned historic temples, its grand structures climb up the hillside, blending traditional shrine architecture with intricate stone carvings. Offering a serene atmosphere and bustling incense offerings, it also commands a stunning view of Dapeng Bay.", "name": "Dongshan Temple", "transport": "Take Bus M471 to \u0027Dongshan Temple Station\u0027 (\u6771\u5c71\u5bfa\u7ad9) and walk about 5 minutes."}, {"address": "Tianhou Lane, Zheng Street, Dapeng Ancient City, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.3 stars | Dating back to the Ming Dynasty, this Tianhou Temple was a vital worship site where soldiers and residents prayed for safety at sea. Designed in classic Lingnan temple style with three-bay width and three-entry depth, it enshrines the goddess Mazu. Featuring elaborate carvings and imposing dragon pillars, the temple hosts lively folk festival celebrations during Mazu\u0027s birthday.", "name": "Tianhou Temple of Dapeng Fortress", "transport": "Accessible by walking inside the Dapeng Ancient City scenic area."}, {"address": "Beimen Street, Dapeng Ancient City, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.2 stars | Built during the Kangxi reign of the Qing Dynasty, this site served as the supreme military headquarters of the Dapeng Garrison. Featuring a formal, solemn layout complete with main halls, inner halls, rear chambers, and side wings, it reflects the architectural norms of Qing Dynasty naval command offices. Today, it houses the Dapeng Maritime Defense History Exhibition.", "name": "Xietaixia Government Office", "transport": "Accessible by walking inside the Dapeng Ancient City scenic area."}, {"address": "Dongmen Street, Dapeng Ancient City, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.1 stars | Located inside Dapeng Ancient City and built in the early Republican era, this historical site blends modern Western architectural elements with traditional Lingnan Hakka styles. The elegant white Western-style building stands in striking contrast to the surrounding Ming and Qing blue-brick courtyards, serving as a key historic site for studying Shenzhen\u0027s early modern education and architectural evolution.", "name": "Former Site of Pengcheng School", "transport": "Accessible by walking inside the Dapeng Ancient City scenic area."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Dapeng Fortress, Pengfei Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 stars | Located inside the Dapeng Fortress, a national key cultural relics protection unit, the Dapeng Ancient City Museum is the premier venue for exploring South China\u0027s coastal defense history and anti-British history during the Ming and Qing dynasties. The museum features a rich collection of artifacts, including ancient cannons, Ming and Qing weaponry, coastal defense documents, and daily items used by soldiers, detailing the rise and fall of Dapeng Fortress as a key military stronghold in the Dongjiang region. Combining modern multimedia with recreated historical scenes, the exhibition halls allow visitors to step back in time and experience the heroic efforts of coastal defense soldiers resisting foreign invaders, offering immense historical and cultural value.", "name": "Dapeng Ancient City Museum", "transport": "Take bus M471, M457, or B753 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk about 300 meters."}, {"address": "No. 1 Dijian Park Road, Nan\u0027ao, Dapeng New District, Shenzhen", "feature": "\u2b50 4.7 stars | Nestled at the foot of Qiniang Mountain, the National Geopark Museum features architectural design inspired by ancient volcanic landforms. Inside, six themed exhibition halls cover geological relics, coastal landforms, paleontology fossils, and more. Utilizing exquisite mineral specimens, giant fossil skeletons, and 3D projection technology, the museum vividly reconstructs the dramatic geological evolution of ancient volcanic eruptions from around 135 million years ago. More than just a treasure trove of scientific knowledge, its unique contemporary architectural aesthetics complement the outdoor park scenery, making it a must-visit spot for photography enthusiasts and art lovers.", "name": "Guangdong Dapeng Peninsula National Geopark Museum", "transport": "Take bus M423 directly to the terminus \u0027National Geopark Station\u0027 (\u570b\u5bb6\u5730\u8cea\u516c\u5712\u7ad9)."}, {"address": "No. 2 Nanmen Street, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | General Zhenwei\u0027s Mansion is the largest and best-preserved residence of a famous Qing Dynasty general inside Dapeng Fortress. It was built for Lai Enjue, Commander-in-Chief of the Guangdong Navy, who defeated the British forces at the Battle of Kwun Chung during the First Opium War. Boasting nearly 300 years of history, this classic Dapeng Hakka residential complex features dozens of halls and side rooms showcasing top-tier Lingnan wood carving, stone carving, and plaster artwork. Permanent exhibitions inside detail General Lai\u0027s life and Opium War coastal defense culture, allowing visitors stepping into this intricately decorated ancient mansion to immerse themselves in Dapeng\u0027s rich history and military heritage.", "name": "General Lai Enjue\u0027s Mansion", "transport": "Take bus M471 or M457 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9), enter through the South Gate of Dapeng Fortress, and walk about 150 meters."}, {"address": "Inside Dongmen Lane, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | The Mansion of General Liu Qilong is the former residence of Fujian Naval Commander-in-Chief Liu Qilong during the Qing Dynasty, standing as an iconic coastal naval general\u0027s residence exhibition in Dapeng Fortress. Built in a traditional three-courtyard Lingnan Siheyuan layout, it preserves exquisite eave corners, beam carvings, and painted murals that radiate an elegant antique charm. Through precious artifacts, paintings, and historical documents, the museum showcases General Liu\u0027s legendary rise from a common soldier to a first-rank naval commander while presenting a detailed look into Qing Dynasty maritime patrols and anti-piracy efforts.", "name": "General Liu Qilong\u0027s Mansion", "transport": "Take bus M471 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9), enter through the East Gate of the ancient city, and walk about 200 meters."}, {"address": "Liangcang Road, Inside Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | The Dapeng Fortress Granary is a cultural exhibition space revitalized from Qing Dynasty military grain stores and old modern granaries. Retaining its original cylindrical brick-and-wood industrial historical texture, clever modern design transforms it into a contemporary art hall and salon steeped in vintage artistic charm. The venue hosts regular contemporary art exhibitions, intangible cultural heritage showcases, and local historical photo exhibits, while integrating creative merchandise sales and a cozy cafe nook where visitors can appreciate creative arts and the blending of past and present inside a historic granary.", "name": "Dapeng Granary Cultural Exhibition Hall", "transport": "Take bus M471 or B753 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk into the core area of the ancient city for about 5 minutes."}, {"address": "Dongmen Street, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Originally built in the early Republican period, the former site of Pengcheng School was a crucial cradle of modern education on the Dapeng Peninsula. Its architectural design skillfully blends Lingnan Hakka styles with Western Baroque decorative elements. Today, this quaint vintage school building serves as the Dapeng Intangible Cultural Heritage Exhibition Hall, displaying rich cultural heritage including Dapeng Mountain Songs, the Dapeng Taiping Qingjiao Festival, traditional green rice cake craftsmanship, and Hakka wedding customs. Visitors can stroll through time-worn corridors and classrooms, exploring Dapeng\u0027s unique folk culture and artistic vibes through static exhibits and multimedia interactions.", "name": "Pengcheng School Former Site \u0026 Intangible Cultural Heritage Exhibition Hall", "transport": "Take bus M471 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk to Dongmen Street in Pengcheng Community."}, {"address": "Inside Rose Town, No. 12 Buxin Road, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Situated inside the Rose Town Film and Television Base on Buxin Road, this European-style chapel is an artistic landmark rich in Gothic and Romanesque architectural style. Featuring soaring spires, intricate stained-glass rose windows, and Gothic arches, its romantic classical interiors make it a popular sanctuary for weddings and wedding photography. Beyond wedding events, the surrounding European plaza and landscaped gardens attract photography buffs and culture enthusiasts. Stepping into this surreal space feels like being transported instantly to a medieval European town infused with artistic romance.", "name": "Rose Town European Chapel", "transport": "Take bus M274, E11, or M362 to \u0027Buxin Community Station\u0027 (\u5e03\u65b0\u793e\u5340\u7ad9) and walk about 400 meters."}, {"address": "At the Main Entrance of Dapeng Fortress, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Founded during the Yongle reign of the Ming Dynasty, Dapeng Fortress Tianhou Temple boasts nearly 600 years of history as a major Mazu worship center and folk culture hub in the Lingnan region. The temple showcases exquisite architectural craft, featuring vibrant wood carvings, carved stone dragon pillars, and East Guangdong ceramic roof ridge decorations of exceptional artistic value. In addition to housing Mazu statues, it displays historical artifacts related to ancient sea deity worship and Dapeng Navy ritual traditions. It remains a deeply meaningful spiritual haven and cultural monument for Dapeng locals and Dongjiang fishermen alike.", "name": "Dapeng Fortress Tianhou Temple", "transport": "Take bus M471 or M457 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk about 100 meters to the temple entrance."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 1 Geopark Road, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.7 stars | Renowned for its unique volcanic landforms and rich natural ecosystem, Dapeng Peninsula National Geopark is a natural wonder formed by ancient volcanic eruptions hundreds of millions of years ago. The park features a geological museum showcasing diverse rock specimens and ancient fossils, alongside a complete coastal landform and forest ecosystem. Walking along the trails, visitors can observe ancient volcanic ruins, bizarre rock formations, and lush mountain scenery up close, making it ideal for family outings and outdoor educational exploration.", "name": "Shenzhen Dapeng Peninsula National Geopark", "transport": "Take Bus E11 to Xinda Bus Hub, then transfer to Bus M321 and get off at the Geopark Station."}, {"address": "Yangmeikeng Village, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.5 stars | Located in the northeastern part of the Dapeng Peninsula, Yangmeikeng features a picturesque coastal road and is celebrated as one of Shenzhen\u0027s best spots for cycling and strolling. Backed by Mount Qiniang and facing crystal-clear Daya Bay, the striking blend of mountain and sea scenery is truly refreshing. The coastline is dotted with rugged reefs and transparent turquoise waters, attracting countless visitors to ride bicycles, take wedding photos, or walk along the shore to enjoy the ocean breezes and romantic coastal scenery.", "name": "Yangmeikeng", "transport": "Take Bus E11 or Bus 833 to Xinda Bus Hub, then transfer to Bus M274 and get off at Yangmeikeng Station."}, {"address": "Luzui Avenue, Yangmeikeng, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | Situated at the easternmost tip of the Dapeng Peninsula, Luzui Villa is famous as a filming location for the blockbuster movie \u0027The Mermaid\u0027. Dubbed Shenzhen\u0027s \u0027End of the Earth\u0027, it boasts dramatic cliffs and breathtaking sea caves. Strolling along the wooden boardwalk built on the edge of the cliff, you can watch crashing waves beat against dark rocks below, with the vast ocean extending to the horizon. It is also an ideal spot to catch Shenzhen\u0027s very first rays of morning sunlight.", "name": "Luzui Villa \u0026 Cliff Boardwalk", "transport": "After arriving at Yangmeikeng, you can walk along Guanhai Avenue, take a sightseeing electric shuttle, or ride a speedboat from the pier directly to Luzui Villa."}, {"address": "Astronomical Observatory, Xichong Community, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.8 stars | Perched atop the sea cliffs of Xichong, the Shenzhen Astronomical Observatory features the most visually stunning mountain-and-sea boardwalk in all of Shenzhen. The white wooden path winds along the serpentine ridge toward the ocean, resembling a white dragon resting between lush cliffs and the deep blue Pacific Ocean. Exploring down the boardwalk offers sweeping panoramic views of Xichong Bay\u0027s graceful coastline and magnificent cliff faces, making it a viral hit on social media and a paradise for photographers.", "name": "Shenzhen Astronomical Observatory Coastal Boardwalk", "transport": "Take Bus E11 to Xinda Bus Hub, transfer to Bus M232 to Hesou Village Station or Xichong Beach No. 4, then take a shuttle bus or walk up the mountain."}, {"address": "No. 28 Xidong Road, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | Renowned as one of Shenzhen\u0027s most pristine and clear beaches, Judisha Beach is famous for its powder-soft white sand and crystal-clear \u0027glass sea\u0027 waters. The crescent-shaped beach is framed by dense forests and rolling hills, with waters shifting gracefully between dreamy lake blue and emerald green. Featuring exceptional water quality, it is ideal for swimming, water sports, or simply relaxing under the shade of trees along the shoreline for a tranquil seaside getaway.", "name": "Judisha Beach", "transport": "Take Bus E11 to Xinda Bus Hub, then transfer to Bus M274 directly to Judisha Station."}, {"address": "Dapeng Peninsula National Geopark, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | Standing as Shenzhen\u0027s second-highest peak at 869 meters above sea level, Mount Qiniang is often shrouded in swirling clouds and mist, creating a fairytale-like atmosphere. The mountain preserves a remarkably intact virgin forest ecosystem and unique geological landforms, serving as a haven for hikers and outdoor enthusiasts. Well-maintained hiking trails lead to the summit, where you can take in panoramic views of the Dapeng Peninsula\u0027s three surrounding bays and rolling mountain ranges.", "name": "Mount Qiniang", "transport": "Take Bus E11 to Xinda Bus Hub, transfer to Bus M321 to Geopark Station, and begin hiking up from the trail entrance."}, {"address": "Dongchong Community, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.4 stars | Famous for its untouched natural landscape, the Dongchong Coastline boasts pristine beaches, coastal erosion landforms, and tropical mangrove wetlands. It is also one of the start/end points of the classic \u0027Xichong-to-Dongchong Coastal Trek\u0027. Featuring rugged boulders and crashing waves along the path, it showcases the raw and powerful energy of nature. With clear blue waters and ocean breezes, it is a fantastic choice for escaping urban hustle and reconnecting with nature.", "name": "Dongchong Coastline", "transport": "Take Bus E11 to Xinda Bus Hub, then transfer to Bus M231 and get off at Dongchong Bathing Beach Station."}, {"address": "Border of Kuichong Subdistrict and Dapeng Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.3 stars | Reaching an elevation of 707 meters, Paiya Mountain derives its name (\u0027Row of Teeth Mountain\u0027) from its sharp, jagged ridge line that resembles rows of wild beast teeth, making it one of Shenzhen\u0027s most challenging and dramatic peaks. The area features high forest coverage, fresh air, and spectacular cliff scenery. Hikers along the route can enjoy magnificent views of the Daya Bay Nuclear Power Plant where the mountains meet the sea, offering an exhilarating experience for outdoor adventure seekers.", "name": "Paiya Mountain", "transport": "Take Bus E11 to Dapeng Center Station, transfer to Bus M471 to near Daya Bay Nuclear Power Plant, or walk to the Baguang trailhead to start your hike."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Dapeng Fortress, Pengfei Road, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 Stars | Dapeng Fortress, originally built in 1394 during the Ming Dynasty, is the historical origin of Shenzhen\u0027s nickname \u0027Pengcheng\u0027 (City of the Peng). The fortress preserves a complete architectural complex from the Ming and Qing Dynasties, featuring narrow cobblestone alleys, traditional residences, general mansions (such as the Zhenwei General Mansion), and ancient city gates. It is a fantastic spot to snap vintage cultural photos and explore Shenzhen\u0027s rich history\u2014strolling through feels like stepping back in time.", "name": "Dapeng Fortress", "transport": "Take bus M471, M457, or B753 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk over."}, {"address": "Jiaochangwei Road, Kuichong Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.4 Stars | Known as \u0027Shenzhen\u0027s Gulangyu,\u0027 Jiaochangwei is the only coastal village in Shenzhen. Adjacent to Dapeng Fortress, it boasts hundreds of unique guesthouses with colorful facades contrasted against the blue sea and sky. Visitors can stroll along the beach, try water sports like windsurfing and jet skiing, or enjoy a lazy afternoon tea at a seaside cafe\u2014a vibrant, tropical holiday spot popular with social media creators.", "name": "Jiaochangwei Beach", "transport": "Take bus M471 or M457 to \u0027Jiaochangwei Station\u0027 (\u8f03\u5834\u5c3e\u7ad9), then walk for about 5 minutes."}, {"address": "Luzui Mountain Lodge, Yangmeikeng, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located at the easternmost tip of the Dapeng Peninsula, Luzui Mountain Lodge shot to fame as the filming location for Stephen Chow\u0027s blockbuster movie *The Mermaid* (the Mermaid Cave). It features dramatic cliffside crags, endless blue sea views, and natural sea caves. Walking along the cliffside boardwalk offers breathtaking views of crashing ocean waves, and it\u0027s the ultimate spot to catch the first rays of sunrise in Shenzhen, drawing countless photography enthusiasts.", "name": "Luzui Mountain Lodge", "transport": "After arriving at Yangmeikeng, take a sightseeing speedboat or an electric shuttle cart to reach Luzui Mountain Lodge."}, {"address": "Near Beach No. 4, Xichong Beach Resort, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.8 Stars | Perched on the cliffs of Xichong, the Shenzhen Astronomical Observatory overlooks a stretch named one of \u0027China\u0027s Most Beautiful Coastlines\u0027 by *National Geographic China*. Its iconic white wooden boardwalk winds along mountain ridges straight toward the sea, creating the illusion of walking on a stairway to heaven. The white dome observatory paired with the blue ocean backdrop creates a romantic, futuristic scene, making it one of Shenzhen\u0027s most viral scenic spots.", "name": "Shenzhen Astronomical Observatory", "transport": "Take bus M232 to \u0027Xichong Xigong Village Station\u0027 (\u897f\u6d8c\u897f\u8ca2\u6751\u7ad9), then transfer to a local shuttle or walk to the observatory trail entrance."}, {"address": "Yangmeikeng, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.3 Stars | Located in northwestern Dapeng Peninsula, Yangmeikeng is famous for its crystal-clear waters and long coastal bike paths. It is Shenzhen\u0027s premier seaside cycling destination\u2014pedaling along the coastal road with lush green mountains on one side and the expansive blue ocean on the other is pure bliss. With rocky shores and popular wedding photo bases along the way, it\u0027s ideal for romantic strolls, photo ops, and water recreation.", "name": "Yangmeikeng", "transport": "Take bus M274 to \u0027Yangmeikeng Station\u0027 (\u694a\u6885\u5751\u7ad9) to reach the valley and coastal entrances."}, {"address": "Guanhu Village, Kuichong Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.5 Stars | Dubbed \u0027Shenzhen\u0027s Kamakura,\u0027 Guanhu Village is a peaceful, romantic fishing village. Its Japanese-style streets leading down to the sea, colorful houses, and laid-back beach vibe evoke the coastal charm of Shonan, Japan. Away from the city\u0027s hustle, it boasts pristine beaches and gentle waves, attracting trendy travelers and photographers seeking breezy, cinematic portraits.", "name": "Guanhu Village", "transport": "Take bus B956 or M457 to \u0027Guanhu Village Committee Station\u0027 (\u5b98\u6e56\u6751\u59d4\u7ad9) and walk into the village."}, {"address": "Xichong Community, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.4 Stars | Boasting a 4.5-kilometer stretch of natural golden sand, Xichong is Shenzhen\u0027s largest beach resort and China\u0027s first designated \u0027International Dark Sky Community.\u0027 With fine sand and azure waters across Beaches 1 to 4, it is perfect for surfing, camping, catching sunrises, and stargazing at night. Strolling along the expansive shoreline offers a deep connection to the pristine, grand beauty of the Dapeng Peninsula.", "name": "Xichong Beach", "transport": "Take bus M232 to reach the entrances for Xichong Beaches 1 through 4."}, {"address": "No. 1 Geopark Road, Xinda Community, Nan\u0027ao Subdistrict, Dapeng New District, Longgang District, Shenzhen", "feature": "\u2b50 4.6 Stars | Featuring ancient volcanic geological remains dating back 135 million years, Dapeng Peninsula National Geopark rests against Mount Qiniang, Shenzhen\u0027s second-tallest peak. It houses a modern Geological Museum showcasing rare geological specimens and dinosaur fossil replicas, alongside outdoor hiking trails through pristine forests and ancient volcanic landforms. Reaching the towering main peak rewards hikers with sweeping panoramic views of Dapeng Bay and Daya Bay, making it a favorite spot for hiking and nature discovery.", "name": "Dapeng Peninsula National Geopark", "transport": "Take bus M274 or M423 to \u0027National Geopark Station\u0027 (\u570b\u5bb6\u5730\u8cea\u516c\u5712\u7ad9)."}], "name": "Popular Photo Spots"}}, "name": "Dapeng Peninsula and Dapeng Fortress"}, "futian_cbd": {"categories": {"cat_1": {"items": [{"address": "No. 5033 Yitian Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Standing at 599 meters tall, the Ping An Finance Centre is Shenzhen\u0027s tallest skyscraper and the second tallest in China, serving as the core symbol of the Futian skyline. Designed by Kohn Pedersen Fox (KPF), this supertall landmark showcases the pinnacle of modern architectural craft and steel structure aesthetics. The 116th floor houses the \u0027Free Sky\u0027 observation deck, offering stunning 360-degree panoramic views of Shenzhen and distant views of Hong Kong\u0027s rolling hills, mesmerizing day and night.", "name": "Ping An Finance Centre", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Shopping Park Station (Exit D), then walk for about 3 minutes."}, {"address": "No. 1 Fuzhong 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Home to the Shenzhen Municipal Government, the Shenzhen Civic Center is one of the most iconic modern architectural complexes in Futian Central District. Its most striking feature is the massive roof shaped like a roc spreading its wings, symbolizing Shenzhen\u0027s rapid rise after the reform and opening-up. The complex integrates exhibition halls, a museum, a grand theater, and administrative offices. Illuminated by brilliant light shows at night, it is a must-visit landmark to experience the grandeur of Shenzhen\u0027s central axis.", "name": "Shenzhen Civic Center", "transport": "Take Shenzhen Metro Line 2 or Line 4 directly to Civic Center Station (Exit C)."}, {"address": "No. 2016 Fuzhong 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Designed by renowned Japanese architect Arata Isozaki, this twin-building complex masterfully fuses modern geometric aesthetics with traditional cultural motifs. The Concert Hall\u0027s \u0027Golden Tree\u0027 atrium echoes the Library\u0027s \u0027Silver Wall\u0027 exterior, presenting elegant lines with a futuristic flair. Not only is it the cultural hub of Shenzhen, but its unique crystal-shaped design and dramatic play of light and shadow also make it a dream spot for architectural photography.", "name": "Shenzhen Concert Hall \u0026 Library", "transport": "Take Shenzhen Metro Line 3 or Line 4 to Children\u0027s Palace Station (Exit D), then walk for about 5 minutes."}, {"address": "Peak Plaza, Lotus Hill Park, No. 6030 Hongli Road, Futian District, Shenzhen", "feature": "\u2b50 4.8 Stars | Perched on the hilltop plaza of Lotus Hill Park, the bronze statue of Deng Xiaoping is Shenzhen\u0027s most historically and politically significant spiritual landmark. Standing 6 meters high, the statue portrays the chief architect of China\u0027s Reform and Opening-up striding forward with confidence. The broad summit plaza is not only a place to connect with the memories of Shenzhen\u0027s rapid transformation, but also the premier natural vantage point for sweeping views of Futian\u0027s impressive skyline and central axis.", "name": "Deng Xiaoping Statue at Lotus Hill Park", "transport": "Take Shenzhen Metro Line 3 or Line 4 to Children\u0027s Palace Station (Exit F2), then hike up the footpath for about 20 minutes to reach the peak."}, {"address": "5th Floor, Modern Window Building, No. 1058 Huaqiang North Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Located in the heart of Huaqiangbei\u2014known as \u0027China\u0027s No. 1 Electronics Street\u0027\u2014this museum is an important cultural landmark documenting Shenzhen\u0027s electronics industry history and maker culture. Through historical artifacts, interactive technological displays, and immersive audiovisual exhibits, it recounts Huaqiangbei\u0027s legendary evolution from an early industrial park into the world\u0027s largest electronics distribution hub and innovation source, combining rich history with modern tech vibes.", "name": "Huaqiangbei Museum", "transport": "Take Shenzhen Metro Line 2 or Line 7 directly to Huaqiangbei Station (Exit E2) to access the building."}, {"address": "Zone A, Civic Center, Fuzhong Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located in the east wing of the Civic Center, the Shenzhen Museum of History and Folk Culture is a premier landmark for exploring the complete story of Shenzhen from ancient times to the present. Exhibits cover ancient Shenzhen, modern revolutionary history, and the era of Reform and Opening-up, with 1:1 life-size dioramas recreating traditional Lingnan folk customs and historic streetscapes. Grand in architecture and rich in content, it is the best place to experience Shenzhen\u0027s deep cultural heritage.", "name": "Shenzhen Museum of History and Folk Culture", "transport": "Take Shenzhen Metro Line 2 or Line 4 to Civic Center Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 3032 Shennan Middle Road, Futian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Built in 1985, the Shanghai Hotel is one of the early iconic landmarks of the Shenzhen Special Economic Zone, once hailed as \u0027Shenzhen\u0027s Origin Coordinate\u0027 and the \u0027Starting Point of Shenzhen\u0027s Journey\u0027. Standing proudly at the intersection of Shennan Middle Road and Huaqiangbei amidst low-rise buildings of its era, it witnessed the boom of the Huaqiangbei commercial area and the rise of Shenzhen. Today, it still exudes a rich nostalgic charm.", "name": "Shanghai Hotel Shenzhen", "transport": "Take Shenzhen Metro Line 1 to Huaqiang Road Station (Exit B), then walk about 300 meters."}, {"address": "No. 2012 Shennan Avenue, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Designed by OMA, led by Pritzker Prize laureate Rem Koolhaas, this building is famous for its 36-meter-high \u0027Floating Podium\u0027. Defying traditional architectural conventions of ground-bound bases, the structure elevates the massive trading hall into mid-air, creating a visually striking, avant-garde style. It stands as an unmissable contemporary architectural masterpiece in Futian\u0027s financial district.", "name": "Shenzhen Stock Exchange Plaza", "transport": "Take Shenzhen Metro Line 2 or Line 3 to Futian Station (Exit 32), then walk for about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Zone A, Civic Center, Fuzhong Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.8 Stars | Located on the east wing of the Futian Civic Center, this top-tier National First-Grade Museum is the best place to explore Shenzhen\u0027s ancient, modern, and Reform and Opening-Up history. The museum features permanent exhibition halls such as the \u0027Shenzhen Reform and Opening-Up Exhibition,\u0027 \u0027Ancient Shenzhen,\u0027 and \u0027Modern Shenzhen.\u0027 Utilizing realistic scenes, interactive multimedia installations, and precious historical artifacts, it vividly recreates Shenzhen\u0027s miraculous journey from a quiet border town to an international metropolis. Perfect for cultural exploration and family outings.", "name": "Shenzhen Museum of History and Folk Culture", "transport": "Take Shenzhen Metro Line 2 or 4 to \u0027Civic Center Station\u0027 Exit B, then walk for about 3 minutes."}, {"address": "No. 2002 Fuzhong Road, Lianhua Subdistrict, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.7 Stars | Designed by the renowned deconstructivist architecture firm Coop Himmelb(l)au, this iconic landmark in the Civic Center boasts a futuristic geometric metallic look and sleek steel structures. Divided into two main sections\u2014Contemporary Art and Urban Planning\u2014it showcases cutting-edge modern art exhibitions alongside blueprints of Shenzhen\u0027s future urban development. The grand interior \u0027Cloud\u0027 sculpture and sweeping steel ramps offer striking visual backdrops, making it an absolute must-visit photo spot.", "name": "Museum of Contemporary Art and Urban Planning (MOCAPE)", "transport": "Take Shenzhen Metro Line 3 or 4 to \u0027Children\u0027s Palace Station\u0027 Exit A2, then walk for about 2 minutes."}, {"address": "5th Floor, Huaqiangbei Modern Window Commercial Plaza, No. 1058 Huaqiangbei Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Situated in the core of the Huaqiangbei Commercial Street, this modern thematic museum chronicles the entrepreneurial legend and technological evolution of \u0027China\u0027s No. 1 Electronics Street.\u0027 Designed with a cyberpunk aesthetic and vibrant light-and-shadow tech vibes, it features zones like \u0027Dreaming Zone,\u0027 \u0027Time Machine,\u0027 and \u0027Trend Field.\u0027 Displaying classic electronics across different eras, real stories of entrepreneurs, and immersive interactive installations, it vividly captures Shenzhen\u0027s spirit of technological innovation.", "name": "Huaqiangbei Museum", "transport": "Take Shenzhen Metro Line 2 or 7 to \u0027Huaqiangbei Station\u0027 Exit E2, then walk for about 3 minutes."}, {"address": "No. 6026 Hongli Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.6 Stars | Nestled at the southern foot of Lianhuashan Park, this national key art museum is named after Guan Shanyue, a master of the Lingnan School of Chinese Painting, who donated his personal works. The architecture beautifully blends modern design with classical courtyard garden aesthetics in an elegant setting. Featuring year-round exhibitions of Master Guan\u0027s fine traditional Chinese paintings alongside diverse contemporary art shows, it is a sanctuary for art lovers seeking Oriental aesthetics and contemporary ink works.", "name": "Guan Shanyue Art Museum", "transport": "Take Shenzhen Metro Line 3 or 4 to \u0027Children\u0027s Palace Station\u0027 Exit F2, then walk for about 5 minutes."}, {"address": "No. 1093 Shangbu Middle Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.3 Stars | Located near the Huaqiangbei commercial district, this is one of Shenzhen\u0027s earliest \u0027Eight Great Cultural Facilities,\u0027 cherishing the tech-enlightenment memories of several generations. The museum houses interactive zones such as \u0027Tech Paradise,\u0027 \u0027Cosmic Exploration,\u0027 and \u0027Life Sciences,\u0027 while hosting regular popular-science shows and sci-fi audio-visual experiences. Designed for hands-on fun, it is a fantastic destination to ignite scientific curiosity and exploration.", "name": "Shenzhen Science Museum", "transport": "Take Shenzhen Metro Line 1 or 6 to \u0027Science Museum Station\u0027 Exit A, then walk for about 2 minutes."}, {"address": "Floors 2-10, Zone B, Civic Center, Fuzhong 3rd Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Housed inside the iconic domed building of the Civic Center, this exhibition hall serves as a premier showcase for Shenzhen\u0027s industrial achievements and high-tech advancements. Displays cover cutting-edge innovations in AI, new energy, high-end manufacturing, and biotechnology, complemented by impressive 3D interactive exhibition zones that highlight Shenzhen\u0027s hardcore tech capabilities and industrial aesthetics as the \u0027Capital of Innovation.\u0027", "name": "Shenzhen Industrial Exhibition Hall", "transport": "Take Shenzhen Metro Line 2 or 4 to \u0027Civic Center Station\u0027 Exit C, then walk for about 3 minutes."}, {"address": "No. 65 Nonglin Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.5 Stars | Located on Nonglin Road in Futian District, this modern minimalist Catholic church features a main building shaped like a sailing vessel of grace. Inside, soaring lines combine with natural light filtering through stained-glass windows to create a peaceful, solemn, and artistic spiritual atmosphere. During weekend Masses or Christmas celebrations, it attracts many residents and believers seeking prayer and spiritual reflection.", "name": "St. Anthony\u0027s Catholic Church Shenzhen", "transport": "Take Shenzhen Metro Line 7 to \u0027Nonglin Station\u0027 Exit D1, then walk for about 5 minutes."}, {"address": "No. 69 Meilin Road, Futian District, Shenzhen City, Guangdong Province", "feature": "\u2b50 4.4 Stars | Situated in the Meilin Subdistrict of Futian District, this rare specialized museum in South China is dedicated to the art of classical pianos. It houses tens of antique pianos originating from Europe and the Americas, spanning from the 18th to the early 20th centuries. Featuring intricate Victorian and Baroque carvings, each piano exudes rich historical charm and craftsmanship. Visitors can often enjoy beautiful live performances of classical piano music.", "name": "Shenzhen Piano Museum", "transport": "Take Shenzhen Metro Line 9 to \u0027Meicun Station\u0027 Exit C, then walk for about 8 minutes."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 6030 Hongli Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 Stars | Lianhuashan Park is Shenzhen\u0027s most iconic urban mountain park, located at the northern end of the Futian Central District. Spanning a vast area, it features lush greenery and vibrant flower displays. The hilltop plaza houses a bronze statue of Deng Xiaoping and offers the best vantage point for sweeping views of Futian CBD\u0027s skyscraper skyline and the Civic Center. The sprawling lawn at Kite Plaza inside the park is a local favorite, where families often fly kites and picnic on weekends, soaking in the relaxing vibes of an urban oasis.", "name": "Lianhuashan Park", "transport": "Take Shenzhen Metro Line 3 or Line 4 to Children\u0027s Palace Station, Exit F1, and walk for about 3 minutes."}, {"address": "No. 1 Zhenhua West Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 Stars | Stretching from north to south, Shenzhen Central Park is sandwiched between the Futian Central District and the Huaqiangbei commercial area, serving as the city\u0027s \u0027green heart\u0027. The crystal-clear Futian River flows through it, surrounded by lush plantations and elegant landscaped spots. Just steps away from the bustling Huaqiangbei Electronics Street, it\u0027s a favorite refuge for office workers and tourists to escape the hustle and bustle and enjoy tranquil waterfront walkways and spacious lawns.", "name": "Shenzhen Central Park", "transport": "Take Shenzhen Metro Line 2 or Line 7 to Huaqiang North Station, or Line 3 to Lianhuacun Station, and walk for about 8-10 minutes."}, {"address": "No. 26 Meigang Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Bijiashan Park is named after its rolling terrain of over ten connected peaks resembling a traditional Chinese penholder, located right north of Huaqiangbei. The park boasts dense forests, rich wildlife, and well-maintained hiking trails. Reaching the main summit rewards hikers with panoramic views of central Shenzhen\u0027s skyline and the landscape of Hong Kong\u0027s New Territories\u2014a perfect natural oxygen bar in Futian for light hiking and fresh air.", "name": "Bijiashan Park", "transport": "Take Shenzhen Metro Line 9 to Yinhu Station (Exit B) or Line 7 to Huangmugang Station, and walk for about 10 minutes to reach the entrance."}, {"address": "No. 1001 Hongling Middle Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 Stars | Adjacent to the eastern side of Huaqiangbei and Diwang Building, Lizhi Park is named for its more than 500 preserved ancient lychee trees. Centered around the picturesque Lizhi Lake, the traditional gardens exude Lingnan water-town style, featuring elegant pavilions, zigzag bridges, and lotus ponds. Strolling along the lakeside wooden boardwalk offers stunning views of city skyscrapers reflected on the serene water\u2014a classic Chinese garden sanctuary in the heart of the city.", "name": "Lizhi Park", "transport": "Take Shenzhen Metro Line 3 or Line 9 to Hongling Station, Exit E, and walk for about 3 minutes."}, {"address": "No. 2002 Yitian Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.4 Stars | Located south of the Futian Central District, Huanggang Park is a wooded hill park centered around natural vegetation and recreational green space. Featuring towering trees and shady canopies, the park includes viewing pavilions, a hilltop plaza, tennis courts, and a kids\u0027 play area. Quiet with fresh air, it is a hidden green haven for local residents and professionals looking to jog, walk, and unwind away from urban bustle.", "name": "Huanggang Park", "transport": "Take Shenzhen Metro Line 7 to Huanggang Village Station, Exit A, and walk for about 7 minutes."}, {"address": "North Plaza of Civic Center, Fuzhong 3rd Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 Stars | Located north of the Shenzhen Civic Center and seamlessly connected to Lianhuashan Park, Kite Square features a vast sunny lawn that is a favorite outdoor spot for locals. Offering wide-open views, visitors can admire the roof of the Civic Center\u2014designed to resemble a soaring roc\u2014along with surrounding landmark skyscrapers. On weekend afternoons, the sky fills with colorful kites, radiating a lively, relaxed atmosphere.", "name": "Shenzhen Civic Center Kite Square", "transport": "Take Shenzhen Metro Line 2 or Line 4 to Civic Center Station, Exit C; the plaza is right outside the exit."}, {"address": "No. 30 Nongyuan Road, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 Stars | Xiangmi Park is a highly acclaimed modern urban park in Futian District that seamlessly blends natural ecology with contemporary design. It features a romantic rose garden, a lakeside elevated skywalk, lush lychee groves, and a traditional Chinese building in the middle of the lake known as \u0027Shenzhen\u0027s Most Beautiful Marriage Registration Office\u0027. The skywalk winds through tree canopies, offering stunning views from varied heights, making it a trendy spot for photos and relaxing walks.", "name": "Xiangmi Park", "transport": "Take Shenzhen Metro Line 7 to Nonglin Station, Exit C, and walk for about 8 minutes."}, {"address": "Along the Futian River inside Shenzhen Central Park, Futian District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Running through Shenzhen Central Park, the Futian River Greenway is an iconic waterfront eco-corridor in the Futian Central District. Surrounded by lush vegetation, it features water-access platforms, stone bridges, and wooden boardwalks, with clear river waters attracting various birds. Cycling or jogging here allows visitors to enjoy an eco-friendly landscape where water and greenery harmoniously merge, providing a peaceful escape from traffic.", "name": "Futian River Greenway", "transport": "Take Shenzhen Metro Line 1 to Huaqiang Road Station, Exit A, and walk for about 6 minutes into the Central Park section to reach the greenway."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "116th Floor, Ping An Finance Centre, No. 5033 Yitian Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located on the 116th floor of Ping An Finance Centre\u2014Shenzhen\u0027s tallest skyscraper\u2014at an elevation of 541.1 meters. It offers a 360-degree panoramic view, capturing Shenzhen\u0027s dazzling urban skyline and the rolling mountains of Hong Kong in the distance. Featuring a visually stunning cantilevered glass observation deck and futuristic interactive exhibit zones, this is an absolute must-visit high-altitude landmark in Shenzhen.", "name": "Free Sky Skydeck at Ping An Finance Centre", "transport": "Direct access from Exit D of Shopping Park Station, Metro Lines 1/3"}, {"address": "No. 1 Fuzhong 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A key civic landmark in Shenzhen featuring a striking giant roof shaped like a \u0027roc spreading its wings\u0027, showcasing impressive modern geometric architecture. On weekend and holiday evenings, a grand light show takes place at Civic Square, projecting vibrant neon displays across the surrounding skyscrapers and attracting countless visitors to capture breathtaking night photos.", "name": "Shenzhen Civic Center", "transport": "Exit C of Civic Center Station, Metro Lines 2/4"}, {"address": "No. 6030 Hongli Road, Futian District, Shenzhen", "feature": "\u2b50 4.8 Stars | Situated at the northern end of Futian CBD, the peak plaza features a grand bronze statue of Deng Xiaoping and offers the absolute best vantage point overlooking the central axis of Shenzhen\u0027s skyscraper skyline. With its expansive Kite Square and lush forested trails, the park seamlessly merges natural ecology with modern cityscapes, making it an exceptional location for memorable photos.", "name": "Lianhuashan Park", "transport": "Exit F1 of Children\u0027s Palace Station, Metro Lines 3/4"}, {"address": "No. 5001 Huanggang Road, Lianhua Yicun Community, Huafu Subdistrict, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | An international complex seamlessly blending commerce and ecology, best known for its open-air \u0027Town\u0027 area on the 3rd floor. The building facades feature high-saturation Morandi color blocks\u2014reds, yellows, oranges, and blacks\u2014creating a bold geometric aesthetic and sleek modern vibe that draws crowds of young people and fashion influencers for photoshoots.", "name": "UpperHills", "transport": "A short walk from Exit E of Donggualing Station, Metro Line 10"}, {"address": "Huaqiangbei Road, Futian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Renowned as \u0027China\u0027s No. 1 Electronics Street\u0027, this vibrant hub houses hundreds of electronics wholesale markets and cutting-edge tech experience halls. Following a major revamp, the spacious pedestrian street features futuristic landscape installations and LED light art. When dusk falls, it comes alive with a cyberpunk vibe, making it the ultimate destination to experience Shenzhen\u0027s hardcore tech culture and street style photography.", "name": "Huaqiangbei Pedestrian Street", "transport": "Direct access from Huaqiangbei Station exits, Metro Lines 2/7"}, {"address": "No. 2016 Fuzhong 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Designed by world-renowned architect Arata Isozaki, the exterior features striking geometric shapes in yellow, red, teal, white, and black, radiating modern artistic energy. Inside, the grand \u0027Crystal Hall\u0027 boasts soaring glass curtain walls. As sunlight filters through the geometric steel frame, it casts a captivating play of light and shadow, making it a highly recommended spot for photography enthusiasts and art lovers.", "name": "Shenzhen Concert Hall", "transport": "Exit D of Children\u0027s Palace Station, Metro Lines 3/4"}, {"address": "No. 269 Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | An iconic lifestyle open-air shopping mall in Shenzhen, featuring a unique sunken outdoor plaza and a lively bar street. The mall regularly hosts trendy art installations and creative exhibitions. With its romantic ambient lighting and vibrant urban atmosphere, it stands out as a prime location in Futian for street fashion shots and night scene check-ins.", "name": "Futian COCO Park", "transport": "Exit C of Shopping Park Station, Metro Lines 1/3"}, {"address": "Zone A, Civic Center, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located in the East Wing of the Civic Center, this museum beautifully showcases Shenzhen\u0027s remarkable transformation from an ancient fishing village into a modern metropolis. Highlights include meticulously recreated scenes of vintage Guangdong streets, realistic folk culture displays, and interactive multimedia, offering a time-traveling experience ideal for capturing vintage-style portraits and documentary photography.", "name": "Shenzhen Museum of History and Folk Culture", "transport": "Exit B of Civic Center Station, Metro Lines 2/4"}], "name": "Popular Photo Spots"}}, "name": "Futian Central Area and Huaqiangbei"}, "luohu_dongmen": {"categories": {"cat_1": {"items": [{"address": "No. 3002 Renmin South Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.5 Stars | Built in the early 1980s, this building famously birthed the world-renowned \u0027Shenzhen Speed\u0027 by constructing one floor every three days. It stands as one of the most significant historical symbols and architectural landmarks of China\u0027s early Reform and Opening-Up era. The top floor features a famous revolving restaurant where Deng Xiaoping delivered key remarks during his 1992 Southern Tour, giving it profound historical and cultural significance.", "name": "Shenzhen International Trade Centre Building", "transport": "Take Metro Line 1 to Guomao Station (Exit C), then walk for about 100 meters."}, {"address": "No. 5002 Shennan East Road, Luohu District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 Stars | Located next to the MixC commercial zone and officially named Shun Hing Square, it was Asia\u0027s tallest building and Shenzhen\u0027s first skyscraper over 300 meters tall upon its completion in 1996. Featuring a steel frame and dark green glass curtain walls, it showcases classic 90s skyscraper design. The top floor houses the \u0027Window of Shenzhen and Hong Kong\u0027 observation deck, offering spectac
