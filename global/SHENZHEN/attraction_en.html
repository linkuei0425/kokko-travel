ical photos, documents, and physical archives, detailing the unique heritage and human stories from the late Qing Dynasty boundary demarcation through the Anti-Japanese War to the Reform and Opening-up era.", "name": "Chung Ying Street Historical Museum", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station (Exit B) and walk about 12 minutes."}, {"address": "Centerline of Chung Ying Street, Shatoujiao Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | The boundary stones are major historical and cultural sites protected at the national level. Since the border demarcation in 1899, eight boundary stones were set up along the centerline of the street to mark the boundary between China and British Hong Kong. Weathering over a century of historical shifts, their inscriptions remain clear today, serving as a direct testament to modern China\u0027s history and the practice of \u0027One Country, Two Systems\u0027.", "name": "Chung Ying Street Boundary Stones", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, obtain a permit to enter Chung Ying Street, and walk along the street to view them."}, {"address": "Sanzhoutian Village, Meisha Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | Situated in the mountainous area of Sanzhoutian in Yantian District, this site is where Dr. Sun Yat-sen launched the Gengzi Uprising (Sanzhoutian Uprising) in 1900. The site includes the Gengzi Revolution Memorial Hall and historical buildings documenting the heroic struggles of revolutionaries to overthrow the Qing Dynasty. Surrounded by serene natural landscapes, it is a significant historical site for learning about modern Chinese revolutionary history.", "name": "Sanzhoutian Gengzi Revolution Site", "transport": "Driving is recommended, or take Bus M520 or 308 to OCT East Station and transfer to a scenic shuttle bus."}, {"address": "Haibian Street, Yantian Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.2 stars | Also known as Mazu Temple, Yantian Mazu Temple is situated near Yantian Seafood Street and has served as a spiritual center for local fishermen and coastal residents for centuries. Featuring Lingnan architecture with upturned eaves and exquisite carvings, it honours Mazu, the goddess protecting seafarers. The temple showcases Yantian\u0027s deep maritime heritage, hosting vibrant celebrations every year on Mazu\u0027s birthday.", "name": "Yantian Mazu Temple", "transport": "Take Shenzhen Metro Line 8 to Yantian Road Station or Yantiangang West Station, transfer to a bus to Yantian Seafood Street Station, and walk to the temple."}, {"address": "Qiaodong Community, Shatoujiao Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | This museum is dedicated to the \u0027Shatoujiao Fish Lantern Dance\u0027, a national intangible cultural heritage. Originating in Hakka villages during the early Qing Dynasty over 300 years ago, the dance features handcrafted bamboo fish lanterns. The museum exhibits fine lantern props, historical artifacts, and documentaries, detailing crafting techniques, performance formations, and the local Hakka history.", "name": "Shatoujiao Fish Lantern Dance Heritage Museum", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station and walk about 10 minutes."}, {"address": "Inside Dameisha Seashore Park, Meisha Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | Towering at the center of Dameisha Seashore Park, the 81.6-meter Wish Tower is one of the most iconic modern landmarks in the Dameisha and Xiaomeisha area. Featuring a futuristic maritime design, the upgraded tower incorporates light-and-shadow art with a high-altitude observation deck. Visitors can enjoy panoramic views of the stunning bay and golden beach, as well as interactive tech-infused light displays.", "name": "Dameisha Wish Tower", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station (Exit A) and walk about 300 meters."}, {"address": "Near the intersection of Donghai Road and Beishan Road, Yantian Sub-district, Yantian District, Shenzhen", "feature": "\u2b50 4.1 stars | As the birthplace of early commerce and market fairs in Yantian, Yantian Xu Old Town Site has a long history rooted in maritime trade and fishing village life. Once a bustling ancient market for trading seafood and daily goods, it retains some old alley layouts and traditional architectural remains despite modern urban renewal, tracing Yantian\u0027s evolution from a traditional fishing port to an international modern hub.", "name": "Yantian Xu Old Town Site", "transport": "Take Shenzhen Metro Line 8 to Yantian Road Station (Exit D) and walk about 10 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 9 Huancheng Road, Shatoujiao Town, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Located inside Chung Ying Street in Shatoujiao, Yantian District, the Chung Ying Street Historical Museum is a specialized museum documenting the unique historical development of \u0027One Street, Two Systems\u0027. The museum houses a vast collection of precious documents, old photographs, and historical relics, vividly bringing to life over a century of dramatic shifts and folk customs in the Shatoujiao area since the signing of the Convention for the Extension of Hong Kong Territory in 1898. The top floor features an observation deck overlooking the entire Chung Ying Street and the Shenzhen-Hong Kong border scenery, offering rich historical, cultural, and educational value.", "name": "Chung Ying Street Historical Museum", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B. Walk or transfer to a bus to Chung Ying Street, apply for a permit, and enter."}, {"address": "Cultural and Art Center, No. 18 Haishan Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Located near Haishan Road in Shatoujiao, the Yantian Art Museum is a key venue for promoting contemporary art and visual culture in Yantian District. The exhibition halls are spacious and bright, regularly hosting special exhibitions in painting, photography, sculpture, and contemporary installation art, alongside frequent art exchange exhibitions between Shenzhen and Hong Kong. The serene and elegant atmosphere makes it an ideal spot for visual art lovers to immerse themselves in peaceful appreciation, making it a great place to experience local cultural sophistication in Shatoujiao.", "name": "Yantian Art Museum", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A1, and walk about 500 meters."}, {"address": "Next to Haishan Park, Coastal Boardwalk, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.8 Stars | Renowned as one of Shenzhen\u0027s most beautiful seaside libraries, the Lighthouse Library features architecture resembling a giant white lighthouse standing along the harbor. It enjoys excellent natural lighting with large floor-to-ceiling glass windows, allowing readers to browse curated books and arts magazines while gazing at Yantian Port and the blue sea and sky. The top floor features a dedicated panoramic reading area full of poetic charm and modern architectural aesthetics, making it an unmissable cultural landmark along the Shatoujiao Coastal Boardwalk.", "name": "Lighthouse Library", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit B, and walk to the Coastal Boardwalk."}, {"address": "Inside Dameisha Seaside Park, Meisha Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located next to Dameisha Seaside Park, Qixi Library is a unique smart library blending natural landscapes with modern geometric lines. It offers a rich collection of humanities and art books alongside digital reading equipment. The interior features warm wooden tones and soft lighting, creating a wonderfully ceremonial reading environment. Away from urban hustle and bustle, grabbing a cup of coffee and enjoying a good book here after strolling along Dameisha Beach offers pure relaxation.", "name": "Qixi Library (Dameisha Bookhouse)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit A, and walk about 600 meters."}, {"address": "Qiaodong Community, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | The Fish Lantern Dance is a famous national intangible cultural heritage of Shatoujiao. This exhibition hall is dedicated to showcasing the origins, craftsmanship, and performance customs of the Shatoujiao Hakka Fish Lantern Dance. It displays various colorful handcrafted fish lanterns, traditional musical instruments, and historical video footage, profoundly presenting the traditional Hakka fishing village culture and festive atmosphere at the Shenzhen-Hong Kong border. It is a unique venue for gaining deep insights into local folk traditions and historical craft.", "name": "Shatoujiao Hakka Fish Lantern Dance Exhibition Hall", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit A, and walk about 800 meters."}, {"address": "Lane 1, Guanlupao, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | With a long history, Shatoujiao Christian Church is one of the representative religious buildings in the Yantian area. The architectural style is solemn and majestic, combining modern and traditional church elements; its white exterior walls look exceptionally sacred and peaceful against the blue sky. It is not only a venue for local believers to gather and seek spiritual solace, but its elegant and serene architecture also attracts many culture and art enthusiasts to visit and take photos, soaking in the quiet and religious atmosphere of this coastal town.", "name": "Shenzhen Shatoujiao Christian Church", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B, and walk about 700 meters."}, {"address": "Along the Coastal Boardwalk, Yantian Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Tinghai Library is one of the coastal smart libraries created by Yantian District, situated along the Yantian Coastal Boardwalk. Inspired by the ocean and waves, the space design features spacious sea-view reading seats, allowing visitors to read peacefully accompanied by the sound of waves and gentle sea breezes. The library year-round features ocean-themed literature, artistic illustrations, and eco-science books, serving as a marvelous resting spot that blends natural seascape with contemporary culture.", "name": "Tinghai Library", "transport": "Take Shenzhen Metro Line 8 to Yantian Port West Station, Exit B, then transfer to a bus or walk along the Coastal Boardwalk."}, {"address": "Wish Tower, Dameisha Seaside Park, Yankui Road, Meisha Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | The Dameisha Wish Tower is an iconic landmark of Dameisha. Its internal Ocean Metaverse Exhibition Space seamlessly combines digital immersive art with marine science displays. Visitors can experience interactive light and shadow art exhibits, digital marine life education, and a 360-degree high-altitude observation deck. Combining modern tech-art with azure coastal scenery, it offers a novel artistic exhibition experience filled with fantastical visual effects and contemporary aesthetics.", "name": "Dameisha Wish Tower Ocean Exhibition Space", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk about 300 meters."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 9 Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Dameisha Beach Park is one of Shenzhen\u0027s most famous free public beaches, featuring expansive stretches of golden sand and clear blue ocean views. The park is equipped with well-maintained leisure facilities, including the iconic Wishing Tower, a coastal boardwalk, sunny beach areas, and various water sports. Bordering Dapeng Bay to the east with pleasant year-round weather, it is perfect for family picnics, beach volleyball, and scenic strolls. The sunset glow in the evening is truly refreshing and breathtaking.", "name": "Dameisha Beach Park", "transport": "Take Metro Line 8 to Dameisha Station (Exit A), then walk for about 3 minutes."}, {"address": "Xiaomeisha Section, Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Known as the \u0027Hawaii of the East,\u0027 Xiaomeisha features a beautiful crescent-shaped bay surrounded by mountains on three sides and facing the sea on one. Compared to Dameisha, Xiaomeisha offers a quieter, more refined atmosphere with crystal-clear waters and soft, fine sand. Following a comprehensive upgrade, it now integrates top-tier coastal resorts, a marine theme park, and luxury vacation hotels, making it an ideal destination for water sports, diving, sunbathing, and enjoying a premium tropical getaway vibe.", "name": "Xiaomeisha Resort", "transport": "Take Metro Line 8 to Xiaomeisha Station; the exit leads directly to the beach."}, {"address": "Coastal Boardwalk, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | The Yantian Coastal Boardwalk is an ultra-long scenic seaside trail nearly 20 kilometers in length, stretching from Shatoujiao in the west to Xiaomeisha in the east. Built right along the winding coastline, it passes key attractions such as Yantian Port, Seafood Street, and Dameisha. Featuring modern, safe, and comfortable design with numerous rest stops and viewing platforms, walking along the trail lets you listen to waves up close while gazing at the magnificent harbor and busy cargo ships. It is Shenzhen\u0027s most popular coastal hiking route.", "name": "Yantian Coastal Boardwalk", "transport": "Take Metro Line 8 to Haishan Station or Yantian Road Station, then walk to the coast to access the boardwalk."}, {"address": "Around Enshang Reservoir, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Situated halfway up the southern slope of Wutong Mountain, Enshang Wetland Park is a hidden alpine forest wetland retreat far from urban hustle. The park features lush green alpine meadows, towering bald cypress trees, and the mirror-like Enshang Reservoir. Offering exceptionally fresh air, lake-encircling trails, and elevated viewing platforms, it delivers panoramic views of Yantian Port and breathtaking mountain-sea landscapes. Exuding a dreamy European forest ambiance, it is a popular spot for outdoor picnics and connecting with nature.", "name": "Enshang Wetland Park", "transport": "Take Metro Line 8 to Haishan Station (Exit C), then transfer to the Shanhaitong Shuttle Bus or walk up the mountain."}, {"address": "Wutongshan Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Wutong Mountain is Shenzhen\u0027s highest peak. Its range in the Yantian and Shatoujiao areas is renowned for deep valleys, rich flora and fauna, and spectacular streams and waterfalls. Ascending via the Xiutong or Bitong trails allows hikers to enjoy primeval forests and unique rock formations along the way. Reaching the summit rewards you with an unbeatable 360-degree panoramic view of Dapeng Bay, the New Territories of Hong Kong, and downtown Shenzhen\u2014a true natural paradise for hikers and outdoor enthusiasts.", "name": "Wutong Mountain National Forest Park - Yantian Area", "transport": "Take Metro Line 8 to Shenwai Senior High School Station or Haishan Station, then transfer to a bus or taxi to the trail entrance."}, {"address": "Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Located right next to the Yantian Coastal Boardwalk and Haishan Station, Yantian Central Park is an open urban park blending modern art with beautiful coastal scenery. Its main highlight is the giant octopus-shaped playground known as \u0027Giant Octopus Castle\u0027, along with expansive green lawns and scenic fountains. It is ideal for family fun, kite flying, and picnics, as well as enjoying views of Yantian Port and relaxing afternoon tea.", "name": "Yantian Central Park", "transport": "Take Metro Line 8 to Haishan Station (Exit B) and walk about 300 meters."}, {"address": "Inside OCT East, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Nestled among the wooded hills of OCT East Resort, the Wetland Flower Sea features vibrant blooms that change with the seasons alongside natural water landscapes. The area offers lakeside wooden boardwalks, terraced flower belts, and wetland ecological zones with charming streams and bridges. With fragrant floral scents and crisp forest air, it serves as a serene summer getaway to escape urban bustle and immerse in the beauty of mountains and flowers.", "name": "OCT East Wetland Flower Sea", "transport": "Take Bus M520 or 387 to OCT East Knight Valley Station, then transfer to the scenic area shuttle bus."}, {"address": "Haijing Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | Located along the Shatoujiao coastline, Shatoujiao Coastal Park faces the New Territories of Hong Kong across the sea. Thoughtfully designed along the shore, it offers an elegant and tranquil environment with coastal walking paths, casual seating, and manicured gardens. Away from busy commercial areas, the pleasant sea breezes make it a hidden gem for locals and visitors to catch harbor sunsets, view lush opposite mountains, and enjoy quiet moments.", "name": "Shatoujiao Coastal Park", "transport": "Take Metro Line 8 to Shatoujiao Station or Haishan Station, then walk for about 10 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 9 Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Dameisha Seaside Park is one of Shenzhen\u0027s most iconic free beaches, featuring miles of golden sand and crystal-clear water. Its most famous photo landmark is the set of giant, colorful \u0027Wishman\u0027 sculptures scattered across the beach, facing the sea in various poses\u2014an absolute must-snap photo backdrop when visiting Yantian. The park boasts excellent facilities, including a sunshine corridor, seaside boardwalk, and plenty of water sports. At sunset, the entire beach is bathed in a golden glow, creating a deeply romantic coastal landscape.", "name": "Dameisha Seaside Park", "transport": "Metro Line 8 to Dameisha Station, Exit A; about a 3-minute walk."}, {"address": "Next to Dameisha Seaside Park, Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Standing right beside the Dameisha Seaside Boardwalk, the Lighthouse Library is a trending landmark that seamlessly blends ocean views with the cozy aroma of books. This freestanding, three-story white lighthouse features floor-to-ceiling panoramic windows, allowing readers to enjoy a 270-degree view of the azure Dameisha sea while reading. The simple, elegant interior offers sea-view reading spots, reflection zones, and an outdoor terrace\u2014a perfect artistic haven for book lovers and photography enthusiasts alike.", "name": "Yantian Lighthouse Library", "transport": "Metro Line 8 to Dameisha Station, Exit B; walk about 8 minutes along the seaside boardwalk."}, {"address": "Chung Ying Street Community, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Located in Shatoujiao, Chung Ying Street is a century-old street steeped in history and unique political and cultural background. Operating under a \u0027one street, two systems\u0027 dynamic, boundary stones in the center mark the border between Yantian, Shenzhen, and the New Territories, Hong Kong. Retaining classic Lingnan arcade architecture and retro shops, visitors can experience stepping between two territories in a single pace, photograph historical markers, shop for duty-free goods, and sample Hong Kong-style delicacies.", "name": "Chung Ying Street", "transport": "Metro Line 8 to Shatoujiao Station, Exit A, transfer to Bus B662 to \u0027Zhongyingjie Guanqian\u0027 Stop. Note: A Special Border Zone Permit must be applied for in advance."}, {"address": "Seaside Boardwalk (Shatoujiao to Dameisha \u0026 Xiaomeisha section), Yantian District, Shenzhen", "feature": "\u2b50 4.8 Stars | Hailed as Shenzhen\u0027s most stunning coastal path, the Yantian Seaside Boardwalk spans nearly 20 kilometers from Shatoujiao in the west to Xiaomeisha in the east, connecting scenic spots like Yantian Port, Dameisha, and Xiaomeisha. Suspended over coastal rocks and the ocean waves, the winding path offers breathtaking, unobstructed views of the deep blue sea. Strolling or cycling here yields effortlessly dreamy, cinematic summer photos\u2014especially when the sunlight glimmers on the water beneath clear blue skies.", "name": "Yantian Seaside Boardwalk", "transport": "Take Metro Line 8 to Haishan Station, Yantian Port West Station, or Dameisha Station to access different sections of the boardwalk."}, {"address": "No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Dameisha 8th Warehouse Outlets is an inland lakeside shopping town overflowing with European charm. Featuring romantic Italian and Mediterranean architecture with red tiles, yellow walls, arched arcades, and serene waters, it offers a delightful atmosphere. At its center lies a large artificial lake with music fountains, where black swans glide gracefully alongside cozy open-air cafes and sculpture gardens. Beyond being a discount shopper\u0027s haven, it\u0027s a popular backdrop for wedding photography and social media shoots.", "name": "Dameisha 8th Warehouse Outlets", "transport": "Metro Line 8 to Dameisha Station, Exit D; about a 5-minute walk."}, {"address": "Around Enshang Reservoir (Yantian Section of Wutong Mountain Scenic Area), Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Nestled at the foot of Wutong Mountain, Enshang Wetland Park is dubbed Shenzhen\u0027s \u0027Little Switzerland\u0027\u2014a high-altitude mountain oasis viral on social media. It features expansive alpine lawns, the serene Enshang Reservoir, and winding mountain roads. The iconic photo spot is a solitary ancient tree standing on the wide lawn, looking straight out of a fairytale. From the viewing platforms, visitors can take in panoramic views of the bustling Yantian Port containers and the deep blue sea, beautifully harmonizing mountain greenery with ocean horizons.", "name": "Enshang Wetland Park", "transport": "Metro Line 8 to Haishan Station, Exit C, then transfer to the \u0027Mountain \u0026 Sea Express\u0027 Shuttle Bus directly to Enshang Wetland Park."}, {"address": "Next to One City Mall, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Located near Haishan Station in Shatoujiao and close to the coastline, Yantian Central Park is a favored green retreat for locals and tourists alike. The park\u0027s main attraction is a vibrant, giant octopus-themed play park designed by an international artist. The striking red octopus sculpture is an instant hit for photos among both kids and adults. With lush, expansive lawns perfect for picnics, camping, and kite flying, it exudes a relaxing coastal urban lifestyle.", "name": "Yantian Central Park", "transport": "Metro Line 8 to Haishan Station, Exit A2; about a 3-minute walk."}, {"address": "Xiaomeisha Section, Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Renowned as the \u0027Hawaii of the East,\u0027 Xiaomeisha Coastal Park has undergone a comprehensive upgrade to become Yantian\u0027s newest premier seaside resort landmark. Nestled against lush mountains on three sides and opening up to the sea, the renovated park combines sleek modern luxury with raw coastal beauty. Highlights include a striking crescent-shaped golden beach, an infinity ocean-view observation deck, and designer coastal architecture. With fine soft sand and crystal-clear waters, it offers stunning scenery from golden sunrise hours to romantic lit-up evenings.", "name": "Xiaomeisha Coastal Park", "transport": "Metro Line 8 to Xiaomeisha Station, Exit A; the park entrance is right outside the station."}], "name": "Popular Photo Spots"}}, "name": "Yantian, Dameisha, Xiaomeisha and Shatoujiao"}};
        const cityName = "Shenzhen";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
