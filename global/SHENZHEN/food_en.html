s. The handmade beef balls are delightfully springy, chewy, and burst with broth. Maintaining authentic Teochew flavors and affordable prices for decades, it remains a beloved traditional culinary landmark near Dongmen Pedestrian Street.", "name": "Chao Tai Beef Hotpot - Dongmen (\u6f6e\u6cf0\u725b\u8089\u5e97)", "transport": "Take Shenzhen Metro Line 9 to Xiangxicun Station (Exit C) and walk about 200 meters."}], "name": "Local Iconic Traditional Restaurants"}, "cat_2": {"items": [{"address": "L1 Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | Located in the trendy core of The MixC, the minimalist white tones blended with warm wood accents create a modern Japanese aesthetic. The signature \u0027Spanish Latte\u0027 is made with house-roasted premium coffee beans mixed with a touch of condensed milk, offering a smooth, rich flavor with intense nutty and cocoa notes, achieving a perfect bittersweet balance. Paired with a freshly baked buttery croissant\u2014crisp and flaky on the outside, soft and subtly sweet on the inside\u2014it is an exquisite morning combo highly recommended by business professionals and fashion influencers alike.", "name": "% Arabica (Shenzhen MixC Luohu)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, approx. 300m walk"}, {"address": "No. NL125, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.7 Stars | The pioneer of California specialty coffee, renowned for its dark-roasted beans. The popular \u0027Flat White\u0027 features silky, velvety microfoam that opens up with intense caramel aromas and a hint of dark chocolate bitterness. The \u0027Flat White + Egg Tart\u0027 combo is the most popular brunch pick in the house; the freshly baked Portuguese egg tart boasts a flaky, layered crust and a rich, smooth egg custard, making it a favorite among local professionals and leisure travelers.", "name": "Peet\u0027s Coffee (Shenzhen MixC)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, approx. 250m walk"}, {"address": "No. N301, Phase 2, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | A pioneer of Shenzhen\u0027s local specialty coffee scene, the MixC branch offers a warm, romantic ambiance filled with rich coffee aromas. Their single-origin pour-over \u0027Ethiopia Yirgacheffe\u0027 boasts bright citrus acidity and elegant floral notes with a clean, refreshing mouthfeel. Paired with a hot-pressed sandwich and smoked chicken salad brunch set\u2014where the toast is grilled to golden perfection and filled with gooey, melted cheese\u2014it hits the sweet spot between healthy and delicious. An ideal location for a slow-paced afternoon tea or brunch.", "name": "Gee Coffee Roasters (MixC Luohu)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit F, approx. 400m walk"}, {"address": "Underground Commercial Street, Shun Hing Square (Diwang Building), No. 5002 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | A hugely popular local specialty coffee brand in Shenzhen, famous for its inventive signature concoctions. The must-try \u0027Eucalyptus Specialty Coffee\u0027 cleverly fuses yogurt with cold brew, delivering rich layers, a refreshing sweet-and-sour profile, and a subtle herbal finish. Pair it with the signature \u0027Avocado, Bacon \u0026 Poached Egg Toast\u0027\u2014once sliced, the creamy poached egg yolk drips over smooth mashed avocado and savory bacon, creating a perfectly balanced flavor profile that draws crowds of tourists for social media check-ins.", "name": "Something For (Diwang Starlight Plaza)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, approx. 150m walk"}, {"address": "B1 Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | Known for its minimalist industrial aesthetic and playful creative drinks, this is a trendy coffee hub loved by young locals. The signature \u0027Oat Cookie Latte\u0027 serves coffee inside an edible baked cookie cup lined with rich chocolate\u2014allowing you to sip creamy latte while munching on a crispy, sweet oat cookie for a fun dining experience. During brunch, pair it with their \u0027Basque Cheesecake\u0027, featuring a soft, moist center and intense caramelized cheese notes, highly favored by dessert lovers.", "name": "M Stand (Shenzhen MixC Luohu)", "transport": "Metro Line 1 or 2, Grand Theater Station Exit C, direct access via MixC underground passage"}, {"address": "No. L182, L1 Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.8 Stars | A pioneer brand in Shenzhen for all-day light brunch and fruit teas, boasting a delightful outdoor dining area surrounded by lush greenery at MixC. The recommended \u0027All-Day Australian Big Breakfast\u0027 includes seared bacon, juicy Nuremberg sausages, poached eggs, saut\u00e9ed wild mushrooms, and roasted tomatoes\u2014offering rich, savory perfection. Pair it with a classic \u0027gaga Fresh Fruit Tea\u0027, bursting with real fruit for a refreshing sweet-and-tart kick. It\u0027s the top choice for locals and visitors enjoying a sun-drenched weekend brunch.", "name": "gaga (Shenzhen MixC)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, approx. 200m walk"}, {"address": "B1 Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.3 Stars | Embracing a Nordic-style healthy light dining concept, offering balanced, guilt-free brunch options. The \u0027Champion Energy Bowl\u0027 combines fresh avocado, poached chicken breast, quinoa, and a soft-boiled egg, drizzled with special sesame dressing for a satisfyingly chewy, crisp, and clean taste. Pair it with a freshly blended \u0027Doctor Says\u0027 juice (apple, beetroot, ginger)\u2014tangy, sweet, and subtly spicy\u2014which is vibrant and hugely popular among fitness enthusiasts and health-conscious diners.", "name": "Wagas (Shenzhen MixC)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, direct access"}, {"address": "L2 Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | Dedicated to artisanal European sourdough, delicate pastries, and Western brunch offerings. The signature \u0027Smoked Salmon \u0026 Avocado Sourdough\u0027 uses house-fermented sourdough featuring a crisp, chewy crust and a moist interior with subtle tangy malt aromas. Topped with rich smoked salmon and creamy avocado, it offers delightful texture layers. Paired with a fresh \u0027Iced Single-Origin Pour-Over Coffee\u0027, its bright fruity acidity cuts through the richness of the salmon, delivering a truly authentic European brunch experience.", "name": "BAKER \u0026 SPICE (Shenzhen MixC)", "transport": "Metro Line 1 or 2, Grand Theater Station, Exit C, approx. 300m walk"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Shop 490, 4th Floor, Phase 1, The MixC, No. 1881 Baoan South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 stars | A renowned, classic Cantonese restaurant located inside The MixC Shenzhen. The elegant and exquisite decor seamlessly blends traditional Cantonese cuisine with a modern bistro atmosphere. Their signature Secret Black BBQ Pork (Char Siu) is melt-in-your-mouth tender, savory-sweet, and perfectly balanced without being overly fatty. The Crispy BBQ Pork is golden and crunchy, pairing wonderfully with specially selected wines for a rich layer of flavors. It is a top choice for authentic Cantonese dining among locals and tourists alike.", "name": "Bingsheng Pinwei", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit C, and walk for about 3 minutes."}, {"address": "1st Floor, KK MALL, No. 5016 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 stars | A trendy bistro combining American dining with a self-serve craft beer wall, very popular among young adults and office workers. It offers over a hundred global craft beers and cocktails. Highlights from the menu include crispy roasted chicken that is tender inside, and irresistibly aromatic truffle parmesan fries. With its spacious industrial design and relaxing music, it\u2019s an ideal spot for nightlife and gatherings in the Luohu MixC commercial district.", "name": "COMMUNE Bistro", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit B, which connects directly to KK MALL."}, {"address": "4th Floor, KK MALL, No. 5016 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.7 stars | An iconic Hunan cuisine brand famous for its stir-fried pork with chili. It selects premium Zhangshugang peppers and black pork, served on a mini burner at the table to keep it piping hot. The pork slices are tender with a delicate sear, the peppers are crisp with a kick of spice, and the savory sauce makes it incredibly appetizing with rice. The bustling, vibrant atmosphere combined with bold, spicy flavors keeps lovers of regional spicy food coming back for more.", "name": "Chef Fei Fried Pork with Chili", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit B, and walk up to the 4th floor of KK MALL."}, {"address": "4th Floor, KK MALL, No. 5016 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 stars | A long-established Sichuan restaurant chain in Shenzhen that brings out the best of classic Bashu flavors. The signature Mao Xue Wang features fresh, rich ingredients in a spicy, flavorful broth that is bold yet easy on the throat. The poached fish slices in chili oil (Shuizhu Yu) are silky smooth, infused with the rich aroma of Sichuan peppercorns and dried chilis. The restaurant\u0027s decor incorporates Sichuan opera masks and bamboo accents, creating a charming, traditional atmosphere perfect for foodies seeking authentic Sichuan spice and culture.", "name": "Bashu Feng", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit B, and walk via the underground passageway."}, {"address": "T301, Phase 3, The MixC, No. 1881 Baoan South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 stars | An exquisite bistro crafted by a well-known craft brewery, renowned for its award-winning original craft beers and creative local fusion dishes. Their signature craft beers feature fine bubbles and rich malt aromas, pairing amazingly with spicy braised platters or French duck breast. The atmospheric, ambient lighting attracts many tourists and local trendsetters for evening drinks and fine food.", "name": "18th Brewing Bistro", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit C, and walk about 5 minutes to Phase 3 of The MixC."}, {"address": "Floors 1-4, Zhongxing Building, No. 8 Xinyuan Road, Luohu District, Shenzhen (near Dongmen Old Street)", "feature": "\u2b50 4.3 stars | One of the most iconic Hong Kong-style Cantonese restaurants in Luohu, famous for authentic Cantonese dim sum and fresh seafood dishes. The signature Gold Award Roasted Pigeon has a golden, crispy skin and juicy, tender meat that bursts with flavor at first bite. The roasted suckling pig platter and stir-fried seafood dishes also showcase top-tier culinary craftsmanship. With a grand and comfortable dining environment, it is a classic location for family gatherings and experiencing Lingnan food culture.", "name": "Tang Palace Seafood Restaurant", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Laojie Station, Exit F, and walk for about 3 minutes."}, {"address": "Shop 498, 4th Floor, Phase 1, The MixC, No. 1881 Baoan South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 stars | A centuries-old brand originating from Guangzhou that combines traditional Lingnan dim sum tea culture with a modern, stylish dining setting. The signature giant shrimp dumplings feature translucent, thin skin packed with plump, juicy shrimp, while the crispy milk pineapple buns are flaky on the outside with a smooth, rich filling. The retro decor evokes classic Xiguan mansion charm, paired with curated tea drinks and regional dishes, making it immensely popular among foodies and travelers.", "name": "Tao Tao Ju (The MixC Luohu Branch)", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Grand Theater Station, Exit C, and walk directly to The MixC."}, {"address": "10th Floor, Maoye Department Store, No. 2088 Dongmen Middle Road, Luohu District, Shenzhen", "feature": "\u2b50 4.2 stars | A unique Northern Chinese simmer pot chain located in the bustling Dongmen shopping area. It utilizes a waterless cooking technique where fresh meats, seafood, and vegetables are layered together, drizzled with signature three-sauce savory glazes, and cooked right at your table. The ingredients absorb all the rich, flavorful sauces, resulting in tender, succulent bites. After finishing the simmer pot, broth can be added to transform it into a hotpot, making it a hit among young diners and tourists.", "name": "Huang Ji Huang Three-Sauce Simmer Pot", "transport": "Take Shenzhen Metro Line 3 to Shaibu Station, Exit A1, and walk about 2 minutes to Maoye Department Store."}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "2F, Shengang Haoyuan, No. 2078 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 stars | A time-honored vegetarian institution in Luohu, Shenzhen, famous for its rich variety of vegetarian dim sum and nourishing specialty dishes. The signature \u0027Steamed Black Truffle Dumplings\u0027 feature thin, chewy wrappers that burst with rich, fragrant mushroom juice with every bite. The \u0027Vegetarian Soup Dumplings (Xiao Long Bao)\u0027 boast delicate skin, delicious filling, and abundant broth. Seamlessly blending traditional Cantonese dim sum craftsmanship into vegetarian cuisine, it attracts countless tourists and local elders alike.", "name": "Dongpin Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 3 or 9 to Hongling Station, Exit D, and walk for about 6 minutes."}, {"address": "1F, No. 3038 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 stars | An elegant vegetarian restaurant imbued with a serene Zen atmosphere and classic aesthetics, specializing in refined, health-conscious plant-based dishes. The featured \u0027Bamboo Fungus \u0026 Wild Mushroom Soup\u0027 offers a clear, sweet, and comforting broth. The handmade \u0027Vegetarian Cutlet\u0027 is crispy on the outside and tender on the inside, featuring a golden, lightly charred crust filled with juicy, flavorful filling without feeling greasy. Its tranquil ambiance provides an instant escape from the bustle of Dongmen, making it a favorite among slow-food enthusiasts.", "name": "Jingyizhou Vegetarian Restaurant", "transport": "Take Metro Line 3 to Shaibu Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 2088 Dongmen Middle Road, Dongmen Sub-district, Luohu District, Shenzhen", "feature": "\u2b50 4.3 stars | A highly affordable vegetarian buffet offering fantastic value with dozens of stir-fries, cold dishes, dim sum, and soups. Highly recommended are the freshly fried \u0027Vegetarian Spring Rolls,\u0027 featuring a crackling golden crust and a sweet, juicy filling of cabbage and shiitake mushroom strips. Pair them with the melt-in-your-mouth, rich, and creamy \u0027Handmade Taro Cake\u0027 for ultimate satisfaction. With budget-friendly prices and abundant choices, it\u0027s a top dining spot for shoppers and office workers in the Dongmen Commercial Area.", "name": "Sumanxiang Vegetarian Buffet", "transport": "Take Metro Line 3 to Shaibu Station, Exit A1, and walk for about 3 minutes."}, {"address": "3F, Carrianna Friendship Square, No. 2002 Renmin South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 stars | A renowned legacy establishment dedicated to the art of traditional mock-meat cuisine, perfecting plant-based meat textures. The signature \u0027Honey-Glazed Vegetarian Char Siu\u0027 is roasted to a light charred aroma and coated in a balanced sweet-and-savory honey glaze, delivering a firm, springy, and impressively realistic chew. Spaciously laid out and spotless, it is beloved by local foodies and a must-visit Mecca for tourists curious about vegetarian culinary artistry.", "name": "Qishan Vegetarian Restaurant", "transport": "Take Metro Line 9 to Xiangxicun Station, Exit D1, and walk for about 5 minutes."}, {"address": "4F, KK MALL, No. 5016 Shennan East Road, Luohu District, Shenzhen", "feature": "\u2b50 4.7 stars | A unique, health-conscious vegetarian hotpot restaurant located near the MixC shopping district, featuring a deep, mellow Tibetan tea broth that leaves a sweet, refreshing finish. Must-orders include the \u0027Wild Mushroom Platter\u0027 and \u0027Handmade Vegetarian Meatballs.\u0027 Rare, exotic mushrooms cooked in the tea broth become silky and sweet, while the springy handmade balls absorb the subtle fragrance of the tea. Its sophisticated, modern decor and innovative tea-broth hotpot experience are wildly popular among younger crowds.", "name": "A Leaf A World Tea Vegetarian Hotpot", "transport": "Take Metro Line 1 or 2 to Grand Theater Station, Exit B, which connects directly to KK MALL."}, {"address": "No. 15 Xinyuan Road, Dongmen Old Street, Luohu District, Shenzhen", "feature": "\u2b50 4.2 stars | A creative, light-fare vegetarian eatery offering refreshing, light meals that fuse Oriental ingredients with Western bistro techniques. A popular hit is the \u0027Black Truffle \u0026 Wild Mushroom Pasta,\u0027 where al dente pasta thoroughly absorbs the rich truffle sauce, leaving a lingering earthy aroma. Pair it with the colorful and refreshing \u0027Avocado Quinoa Salad\u0027 for delightful layers of texture. The cozy, minimalist decor attracts many hipsters and health-conscious diners.", "name": "Shuxin Vegetarian Dining", "transport": "Take Metro Line 1 or 3 to Laojie Station, Exit F, and walk for about 4 minutes."}, {"address": "No. 2012 Dongmen South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 stars | A cozy, home-style vegetarian restaurant tucked away in old Luohu, committed to additive-free, low-oil, and low-salt healthy cooking. The signature \u0027Pine Nut \u0026 Vegetable Fried Rice\u0027 features aromatic, perfectly separated golden grains where nuttiness meets the natural sweetness of rice. Pair it with a bowl of rich, smooth, and warming \u0027Pumpkin Soup\u0027 for a comforting meal. Its authentic, quality flavors are highly praised by local residents and visiting food enthusiasts alike.", "name": "Cisufang Vegetarian Restaurant", "transport": "Take Metro Line 9 to Xiangxicun Station, Exit C, and walk for about 6 minutes."}, {"address": "Near Phase 1, The MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 stars | A fairytale forest-themed creative vegetarian restaurant offering a feast for both the eyes and the palate. Popular dishes include the \u0027Salted Egg Yolk Mock Squid,\u0027 coated in savory salted egg yolk and fried to golden crispness while maintaining a springy texture, and the \u0027Thai-Style Sweet \u0026 Sour Mock Fish,\u0027 featuring delicate plant-based fish infused with a zesty, appetizing sauce. With artistic food presentations and a magical atmosphere, it\u0027s a hotspot for social media check-ins in the MixC commercial zone.", "name": "Wizard of Oz Vegetarian Restaurant", "transport": "Take Metro Line 1 or 2 to Grand Theater Station, Exit C3, and walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 2059 Renmin North Road, Dongmen Sub-district, Luohu District, Shenzhen", "feature": "\u2b50 4.7 Stars | A must-try street treat for tourists and locals alike! Their signature Seaweed Meat Floss Cake features a soft, fluffy sponge cake filled with smooth, special salad dressing, coated in crispy seaweed and savory pork floss. The explosion of sweet and savory flavors creates rich layers that keep you coming back for more.", "name": "Bao Master Bakery (Dongmen Branch)", "transport": "Metro Lines 1/3, Laojie Station, Exit A, approx. 300m walk"}, {"address": "No. 1 Yongxin Street, Dongmen Pedestrian Street, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | A classic street food staple with years of history in Dongmen Pedestrian Street. Tender beef offal and daikon radish are stewed to perfection in a special braising sauce. The beef tripe is delightfully chewy, the brisket is melt-in-your-mouth tender, and the radish absorbs all the flavorful broth. Paired with house-made Chaoshan chili sauce, it\u2019s a spicy, savory snack perfect for eating on the go.", "name": "Ah Yong Beef Offal (Dongmen)", "transport": "Metro Lines 1/3, Laojie Station, Exit C, approx. 200m walk"}, {"address": "1F, Dongmenting Food Plaza, Renmin South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.3 Stars | Located in the bustling Dongmenting Food Street, large fresh oysters are grilled to order over charcoal, topped with a generous layer of minced garlic and diced green peppers. The fiery heat locks in the plump oyster\u0027s natural sweetness, making every bite juicy, smooth, and packed with garlic and ocean flavors. A must-have night market staple!", "name": "Dongmenting Garlic Grilled Oysters", "transport": "Metro Lines 1/3, Laojie Station, Exit C, approx. 150m walk"}, {"address": "No. 15 Xinyuan Road, Dongmen Sub-district, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | The ultimate refreshing drink seen in everyone\u0027s hand on the streets of Shenzhen! Premium perfume lemons are freshly hand-muddled and shaken with high-mountain Oolong tea and ice. Extremely zesty, crisp, and citrusy, the aromatic lemon oils leave a lasting floral note on your palate\u2014perfect for cutting through rich street foods!", "name": "LINLEE Hand-Punched Lemon Tea (Dongmen)", "transport": "Metro Lines 1/3, Laojie Station, Exit F, approx. 250m walk"}, {"address": "Perimeter 1F, Sun Plaza, No. 2001 Jiefang Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | A classic Hong Kong-style street sweet baked fresh to order. Golden and crispy on the outside with soft, chewy bubbles inside, each bite gives a satisfying crunch followed by rich egg and milk flavors. Best enjoyed hot off the iron as you stroll\u2014the contrast between crispy skin and soft center is irresistibly good.", "name": "Hong Kong Style Egg Waffle (Sun Plaza)", "transport": "Metro Lines 1/3, Laojie Station, Exit A, approx. 180m walk"}, {"address": "Zone B, Dongmenting Pedestrian Street Food City, Luohu District, Shenzhen", "feature": "\u2b50 4.2 Stars | A highly popular Sichuan-Chongqing style street snack among local youth. Wide, chewy sweet potato noodle sheets are grilled until lightly blistered and crispy, then stuffed with pickled green beans, preserved mustard greens, and green onions before being dusted with cumin and chili powder. Chewy, crispy, tangy, and spicy all in one explosive bite!", "name": "Yuxiang BBQ Sweet Potato Noodle Wrap (Dongmen)", "transport": "Metro Lines 1/3, Laojie Station, Exit C, approx. 200m walk"}, {"address": "No. 2010 Dongmen Middle Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | A traditional Lingnan herbal dessert passed down through generations. The herbal jelly (Guilinggao) has a silky-smooth texture with a subtle, aromatic herbal bitterness. Dripped with sweet condensed milk or honey, it achieves a perfect sweet-bitter balance, leaving a lingering refreshing taste. A local top choice for cooling down during warm shopping days.", "name": "Baicaotang Ancestral Herbal Jelly", "transport": "Metro Line 3, Shaibu Station, Exit A1, approx. 350m walk"}, {"address": "1F, First Market, Dongmen Pedestrian Street, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | A landmark street food stall on Dongmen Old Street with non-stop queues! Springy sweet potato noodles are served in a rich broth that bursts with sour, spicy, numbing, and savory flavors, topped with crunchy peanuts and pickled beans. Slurping down these tangy, spicy noodles is addictively satisfying\u2014a favorite for both locals and tourists.", "name": "Chongqing Bage Sour and Spicy Noodles (Dongmen)", "transport": "Metro Lines 1/3, Laojie Station, Exit C, approx. 220m walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Luohu Dongmen and The MixC"}, "nanshan_hi_tech": {"categories": {"cat_1": {"items": [{"address": "Shop NL159, Water Plaza, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | A century-old Cantonese restaurant and dim sum institution founded during the Guangxu reign of the Qing Dynasty. Since opening at MixC World, it has become the top choice for locals and tourists to savor authentic Cantonese flavors. The signature \u0027TaoTaoJu Giant Shrimp Dumpling\u0027 (Har Gow) features a translucent, chewy skin packed with large, succulent fresh shrimp that burst with savory juices in every bite. The \u0027Crispy Milk Pineapple Bun\u0027 offers a cookie-like golden crust filled with rich, smooth hot milk custard\u2014warm on the outside, soft inside, perfectly sweet without being cloying, and adored by food connoisseurs.", "name": "TaoTaoJu", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, approx. 300m walk"}, {"address": "2nd Floor, Dachong Urban Garden, Tonggu Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | An iconic Cantonese dim sum house originating from Guangzhou, recognized as a protector of intangible cultural heritage and renowned for its handcrafted dim sum. The must-order \u0027Crispy Red Rice Roll with Shrimp\u0027 offers an unparalleled texture: a springy, delicate red rice wrapper enclosing a golden crisp layer and plump, sweet shrimp\u2014soft outside, crunchy inside, and full of flavor. The \u0027Signature Shrimp Dumplings\u0027 and \u0027Honey BBQ Pork Buns\u0027 are timeless classics, featuring rich, savory BBQ pork in pillowy, flavorful steamed buns that showcase the deep traditions of old Guangzhou teahouses.", "name": "Dian Dou De", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 400m walk"}, {"address": "2nd Floor, Skyworth Semiconductor Design Building, Intersection of Keji South Road and Gaoxin South 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | A traditional teahouse carrying on a century of Cantonese yum cha culture, taking the High-Tech Park business district by storm with its exceptional value and authentic handmade dim sum. The signature \u0027Asparagus \u0026 Shrimp Dumpling\u0027 features a paper-thin yet resilient wrapper filled with juicy shrimp and the fresh crispness of asparagus. The \u0027Steamed Chicken Feet with Mushrooms\u0027 are deep-fried then steamed to absorb the rich, savory sauce; they melt in your mouth, effortlessly separating from the bone with a collagen-rich, tender texture that is irresistibly nostalgic.", "name": "Fan Lou", "transport": "Metro Line 1 Hi-Tech Park Station, Exit C, approx. 250m walk"}, {"address": "2nd Floor, Han\u0027s Laser Technology Center, No. 9988 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | A classic Teochew and Cantonese culinary staple rooted in Shenzhen for decades, beloved by corporate executives and local elders alike. The signature \u0027Braised Lionhead Goose Platter\u0027 uses authentic Lionhead goose steeped in a deeply aromatic aged brine; the thick slices of goose meat are tender and juicy, while the goose liver melts in your mouth with silky richness. The \u0027Teochew Chilled Flower Crab\u0027 highlights the natural sweet, firm meat of the crab, served with traditional soybean sauce or ginger vinegar for a truly authentic Chaoshan seafood experience.", "name": "Chao Jiang Chun", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, approx. 450m walk"}, {"address": "3rd Floor, Dachong Urban Garden, Dachong 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | The legendary pioneer of Shenzhen\u0027s coconut chicken hotpot, often dubbed the city\u0027s unofficial \u0027national dish.\u0027 It uses 100% natural, fresh Hainan green coconut water as its broth, simmered right at your table with authentic Hainan Wenchang chicken. The chicken features crisp skin, tender meat, and rich flavor infused with natural coconut sweetness. Paired with a signature local dipping sauce made of sand ginger, calamansi juice, and premium soy sauce, the taste is refreshingly sweet and non-greasy\u2014a top recommendation for tourists and Tech Park professionals alike.", "name": "Run Yuan Si Ji Coconut Chicken", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 350m walk"}, {"address": "B1 Floor, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | Originating from a decades-old Hong Kong classic bing sut (ice cafe), this spot perfectly captures traditional Hong Kong-style diner culture. The signature \u0027Men Wah Thick French Toast\u0027 bursts with rich molten salted egg yolk custard upon slicing, topped with melting butter over golden crisp bread\u2014sweet, buttery, crisp on the outside, and pillowy inside. The hearty \u0027Big Men Pineapple Bun\u0027 is stuffed with luncheon meat, fluffy scrambled eggs, cheese, and tomato, making it amazingly satisfying when paired with a cup of rich, aromatic silk-stocking milk tea.", "name": "Men Wah Bing Teng", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A (Direct access to MixC World B1)"}, {"address": "3rd Floor, Phase 2, Dachong Xincun, Tonggu Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Hailing from Shantou, this legendary Chaoshan hand-cut beef hotpot chain is renowned for its ultra-fresh, never-frozen beef and exquisite knife skills. The clear beef bone broth highlights the pure flavor of the meat. The signature \u0027Diaolong\u0027 (rib eye cap) has well-marbled fat that becomes incredibly tender and juicy after just a few seconds of swishing in broth, while \u0027Chiren\u0027 and \u0027Chibing\u0027 (shoulder cuts) offer a pleasant, slightly springy bite. Their handmade beef meatballs are juicy, chewy, and bursting with flavor, showcasing the Chaoshan commitment to pure, unadulterated ingredients.", "name": "Ba He Li Chaoshan Beef Hotpot", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 500m walk"}, {"address": "Shop SL133, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Founded under the personal guidance of renowned food critic Chua Lam, this traditional Cantonese dim sum spot honors classic craftsmanship while introducing refined innovations. The signature \u0027Crispy Hawthorn BBQ Pork Bun\u0027 breaks tradition by pairing rich barbecue pork with a homemade sweet-and-sour hawthorn sauce inside a pineapple-bun-style crispy crust, making it savory yet refreshingly balanced. The \u0027Egg White \"Egg-Crab\" Shrimp Dumpling\u0027 features whipped egg whites as velvety as crab roe paired with crisp, juicy shrimp for a smooth, complex flavor profile that is immensely popular among young foodies.", "name": "Chai Lan Cantonese Dim Sum", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, approx. 300m walk"}], "name": "Famous Local Classic Eateries"}, "cat_2": {"items": [{"address": "Shop NL150, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | As an iconic light meal and coffee brand in Shenzhen, its MixC World flagship store features a stunning panoramic green outdoor terrace. The signature \u0027gaga Beef Brunch Platter\u0027 pairs crispy-on-the-outside, soft-on-the-inside sourdough bread with tender, juicy beef and silky, rich creamy scrambled eggs. Paired with a signature fresh fruit tea or a flat white, the refreshing flavor profile and rich layers enjoyed in a gentle breeze make it a top choice for Science Park professionals and tourists to spend a relaxing afternoon.", "name": "gaga Fruit Tea \u0026 Light Eats (gaga MixC World Flagship)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 300m"}, {"address": "Shop WT101, Water Plaza, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Located in the heart of Water Plaza at MixC World, this spot boasts an ultra-aesthetic, pure white minimalist design. The signature \u0027Spanish Latte\u0027 blends rich espresso with sweet condensed milk, delivering a smooth, velvety texture and pure coffee aroma that is deliciously sweet without being cloying. Surrounded by sleek metallic and glass architectural views, it is a dream destination for photos and enjoying high-quality specialty coffee.", "name": "% Arabica (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 250m"}, {"address": "Shop NL118, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Specializing in European bakery items and healthy brunch, the store is filled with the enticing aroma of freshly baked bread. The \u0027Eggs Benedict Brunch\u0027 is highly recommended\u2014pierce the poached eggs to let the rich golden yolk coat the smoked salmon and soft toast, perfectly balanced by a tangy Hollandaise sauce. Paired with a cup of freshly brewed single-origin drip coffee, it offers a satisfying yet light and exquisite morning experience.", "name": "BAKER \u0026 SPICE (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 350m"}, {"address": "Shop SL132, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A trendy cafe renowned for creative specialty coffee, featuring a clean and chic industrial-style decor. The highly inventive \u0027Oat Cookie Latte\u0027 uses an edible wheat cookie as a cup lined with rich dark chocolate. Filled with smooth latte, taking a bite offers a delightful contrast between crispy outer cookie and rich, velvety coffee\u2014both fun and delicious.", "name": "M Stand (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 400m"}, {"address": "Street block near Hi-Tech Park Metro Station, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | A wildly popular local independent coffee brand originating in Shenzhen, known for its iconic green shipping container aesthetic and cozy street style. The must-try signature \u0027Peanut Butter Latte\u0027 features a silky peanut cream top sprinkled with crunchy peanut bits, blending seamlessly with rich espresso. Sweet and savory, dense and rich, every sip brings pure bliss.", "name": "Kuddo Coffee (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, walk approx. 180m"}, {"address": "Ground level shops, Dachong Urban Garden, Intersection of Keji South Road and Tonggu Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | A top local specialty signature coffee brand in Shenzhen dedicated to precise flavor profiles. The signature \u0027Dirty Coffee\u0027 creates a thrilling contrast in temperature and flavor as hot espresso hits icy cold fresh milk, delivering a smooth, rich taste with a long nutty finish. Warm and brightly lit, the cafe space is a popular, stylish haven for relaxation in the Science Park.", "name": "Something For (Hi-Tech Park Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, walk approx. 200m"}, {"address": "Shop NL138, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | One of China\u0027s pioneer specialty coffee brands, masterfully blending spatial aesthetics with creative coffee concoctions. Must-try drinks include the \u0027Cloud Latte\u0027 and seasonal specials, featuring silky milk foam with subtle floral, fruity notes and a caramel sweet aftertaste. Pair it with their signature \u0027Basque Cheesecake\u0027\u2014soft, rich, and melt-in-your-mouth\u2014for the ultimate afternoon tea experience.", "name": "Seesaw Coffee (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 300m"}, {"address": "Shop SL116, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | The pioneer of specialty coffee originating from California, USA, famous for its dark roasts and bold flavors. The classic \u0027Flat White\u0027 uses premium hand-roasted beans with silky smooth microfoam, creating a deep, rich taste intertwined with intense espresso. Add a crisp yet soft \u0027Artisanal French Croissant\u0027 packed with buttery goodness for a lingering, delightful aftertaste.", "name": "Peet\u0027s Coffee (MixC World Branch)", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, walk approx. 320m"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Shop NL150, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | A century-old Cantonese culinary legend and iconic yum cha spot from Guangzhou, located in the bustling MixC World shopping district. Their signature Giant Shrimp Dumplings feature translucent, delicate skins with sweet, succulent shrimp fillings, while the Crispy Pineapple Bun with Milk Filling offers a delightfully crunchy exterior and a warm, molten center. The interior beautifully blends traditional Xiguan grand mansion aesthetics with modern chic design, drawing endless streams of local foodies and tourists alike.", "name": "Tao Tao Ju Restaurant", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 300m walk"}, {"address": "Shop NL601, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | A retro Cantonese bistro oozing nostalgic charm, featuring museum-like interiors adorned with elegant antiques and classic mahogany furniture. Highlights include the savory, rich Soup Dumplings with Shark Fin and the wonderfully textured Red Rice Rolls. Paired with fine specialty teas and vintage cocktails, it offers a deep immersion into Lingnan culinary culture.", "name": "Yu Ba Xian Restaurant", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 350m walk"}, {"address": "Shop NL115, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A wildly popular hotspot blending a self-serve beer supermarket concept with an American-style bistro. It boasts a massive, multi-meter-long refrigerated wall featuring hundreds of craft beers from around the globe. Dig into crisp, juicy roasted chicken and thick, handcrafted American burgers\u2014the go-to post-work hangout for High-Tech Industrial Park professionals seeking to unwind.", "name": "COMMUNE Bistro \u0026 Bar", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 250m walk"}, {"address": "Shop NL501, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | A Michelin-recommended modern Sichuan bistro that redefines traditional, heavy Sichuan flavors with refined and innovative creations. Signature dishes include the Rattan Pepper Fish\u2014tender, silky fish bathed in a refreshing, numbingly aromatic rattan pepper broth\u2014and Spicy Crunchy Shrimp. Complemented by elegant, white-toned Nordic minimalist decor, it is immensely popular among trendy youth and business professionals.", "name": "Rong Yi Sichuan Bistro", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 320m walk"}, {"address": "4F, Tower C, China Resources Land Building, Science \u0026 Technology Park, Keyuan South Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | A regional restaurant rich in Huizhou charm, designed with white walls and dark tiles evocative of traditional Hui architecture. The signature Stinky Mandarin Fish undergoes natural fermentation\u2014pungent to the nose yet extraordinarily savory on the palate, with springy, garlic-clove-like flaky meat. Accompanied by classic Hairy Tofu and Huangshan Sesame Cakes, it invites diners on an authentic deep dive into Jianghuai regional flavors.", "name": "Wan Chu Anhui Cuisine", "transport": "Metro Line 1, Hi-Tech Park Station, Exit B, approx. 400m walk"}, {"address": "Shop NL106, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A classic American casual bar \u0026 grill featuring a spacious outdoor patio at its MixC World branch. The signature Grilled Beef Burger uses premium juicy beef patties melted with rich cheese, served alongside golden fries for a truly satisfying meal. Enjoy creative cocktails and craft beers during happy hour in a relaxed, romantic night vibe\u2014a favorite spot for expats and corporate professionals.", "name": "blue frog Bar \u0026 Grill", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 200m walk"}, {"address": "2F, Tower B, Zhongke Building, Gaoxin South 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | A wildly popular spot among locals for authentic Hunan home-style cooking, sourcing fresh ingredients directly from Hunan villages. Signature dishes include Stir-fried Pork Trotters with Baby Abalone\u2014rich, springy, and packs a fiery punch\u2014and Stir-fried Pork with Local Peppers, featuring local Zhangshugang peppers and black pork cooked with intense wok hei. Full of rustic warmth, it\u0027s the ultimate choice for experiencing fiery Hunan flavors.", "name": "Nong Geng Ji Hunan Cuisine", "transport": "Metro Line 1, Hi-Tech Park Station, Exit C, approx. 280m walk"}, {"address": "Shop NL201, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | A renowned upscale Hong Kong-style Cantonese restaurant situated in the prime area of MixC World. Their legendary 101 Fruit Napoleon is a towering dessert masterpiece with paper-thin crisp pastry and fresh, vibrant fruit; while the Tableside Crispy Roasted Duck boasts golden, crispy skin and tender, fragrant meat. The luxurious and elegant decor provides a sophisticated backdrop for family gatherings and high-end business banquets.", "name": "Jade Garden", "transport": "Metro Line 1, Hi-Tech Park Station, Exit A, approx. 300m walk"}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "NL601, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | The Shenzhen debut store of Hangzhou\u0027s ultra-popular fine vegetarian brand, located in MixC World. The restaurant focuses on natural, additive-free creative plant-based dishes. The signature Black Truffle Fried Rice features distinct, springy grains infused with a rich truffle aroma. The Black Pepper Lion\u0027s Mane Mushroom is firm and juicy, bursting with a savory roasted flavor that outshines real meat. With its minimalist Zen aesthetic, it is a highly recommended top-tier vegetarian choice for tech park professionals and tourists alike.", "name": "Qingchun Pumen", "transport": "Metro Line 1 Hi-Tech Park Station Exit A, approx. 3 mins walk"}, {"address": "Commercial Street, Phase 1 China Resources Land Dachong, No. 19 Kefa Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | An all-plant bistro combining a futuristic tech vibe with stylish green concepts, hugely popular among young tech professionals in the park. Utilizing premium plant-based meats and fresh whole food ingredients, it creates fusion plant-based delicacies. The signature Plant-Based Burger boasts a golden, crispy bun and a juicy, chewy patty paired with house-made vegan cheese and a mildly spicy sauce. Rich in layers without feeling heavy, it completely revolutionizes the traditional impression of vegetarian food.", "name": "Planet Green Veg Bistro", "transport": "Metro Line 1 Hi-Tech Park Station Exit B, approx. 5 mins walk"}, {"address": "No. 1 East Baishi Road, Shahe Street, Nanshan District, Shenzhen (Near South High-Tech Park)", "feature": "\u2b50 4.7 stars | An upscale Zen-style vegetarian restaurant adjacent to the High-Tech Park and OCT area, renowned for health-conscious ingredients and artistic plating. The classic \u0027Bamboo Fungus and Wild Mushroom Soup\u0027 is sweet and refreshing with an elegant, lingering mushroom aroma, while the \u0027Organic Tofu Claypot\u0027 features a crispy exterior and tender inside rich with pure bean fragrance. Set in a tranquil and elegant atmosphere paired with smooth handmade vegan desserts, it offers a refined dining experience that relaxes both body and mind, making it a favorite for business banquets and family gatherings.", "name": "Ruolanci Vegetarian Restaurant", "transport": "Metro Line 9 Shenzhen Bay Park Station Exit E, transfer to bus or taxi for approx. 5 mins"}, {"address": "2nd Floor, Commercial Podium, Phase 2 Dachong Xincun, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 stars | A great-value, healthy vegetarian buffet tailored for tech park office workers, serving over 50 rich dishes daily. Offerings range from freshly stir-fried high-mountain seasonal vegetables and aromatic vegetarian dim sum to nourishing herbal soups. The freshly steamed vegetarian Xiaolongbao (soup dumplings) feature thin wrappers packed with fiber-rich fillings. Light and non-greasy, it serves as an ideal canteen for local commuters and health-conscious diners looking for a veggie energy boost.", "name": "Xin Man Yi Su Vegetarian Buffet", "transport": "Metro Line 1 Hi-Tech Park Station Exit B, approx. 6 mins walk"}, {"address": "Ground Floor, Block B, Kexing Science Park, No. 15 Keyuan Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | A hipster-style vegetarian restaurant inside Kexing Science Park, specializing in low-salt, low-oil, guilt-free light meals. The popular signature \u0027Black Pepper Lion\u0027s Mane Mushroom Rice Bowl\u0027 features juicy, tender mushrooms infused with savory sauce and wok hei, served with chewy purple rice and fresh warm vegetables. Fast service and bright surroundings make it a go-to lunch spot for tech park engineers.", "name": "Su Yi Vegetarian Cuisine", "transport": "Metro Line 1 Shenzhen University Station Exit A3, approx. 10 mins walk"}, {"address": "2nd Floor, West Block, Skyworth Semiconductor Design Building, No. 18 Gaoxin South 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A classic vegetarian restaurant specializing in traditional home-style vegetarian dishes and herbal wellness meals, strictly free of artificial additives. The signature \u0027Golden Soup Sour \u0026 Spicy Vegan Fish\u0027 uses high-quality soy protein to craft tender fish slices that absorb the tangy, appetizing golden broth. Paired with freshly simmered \u0027Lily Bulb and Lotus Seed Soup\u0027, which is subtly sweet and soothing, it is highly praised by long-term vegetarians and foodies.", "name": "Shan Shui Yuan Vegetarian", "transport": "Metro Line 1 Hi-Tech Park Station Exit C, approx. 8 mins walk"}, {"address": "Street Shop, Dachong Urban Garden, No. 39 Tonggu Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A trendy plant-based light eatery near MixC World, emphasizing whole foods and low-GI dining concepts. The signature \u0027Rainbow Warm Salad Bowl\u0027 is packed with roasted pumpkin, chickpeas, quinoa, and fresh greens, drizzled with rich sesame dressing for a crunchy, juicy, and satisfying meal. Their custom vegan oat milk latte is smooth and fragrant, attracting many shoppers and fitness enthusiasts.", "name": "Veggie Supreme Light Meals", "transport": "Metro Line 1 Hi-Tech Park Station Exit B, approx. 4 mins walk"}, {"address": "1st Floor, Commercial Building next to Weiyong Railway Bridge, No. 10 Kefa Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 stars | A charming vegetarian eatery focusing on natural flavors and handmade noodles, beloved by staff in the northern area of the Tech Park. The \u0027Handmade Vegetarian Moo Shu Stir-Fried Noodles\u0027 uses custom whole-wheat noodles stir-fried on high heat with shiitake mushrooms, wood ear mushrooms, and shredded carrots, full of tempting wok hei aroma. The \u0027Handmade Pan-Fried Veggie Dumplings\u0027 feature a golden, crispy crust bursting with cabbage juices, delivering total satisfaction in every bite.", "name": "Veggie Life Kitchen", "transport": "Metro Line 1 Hi-Tech Park Station Exit A, approx. 7 mins walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Floor B1, MixC World, No. 9668 Shennan Avenue, Dachong Community, Yuehai Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | A legendary bakery with long queues of Hi-Tech Park office workers and tourists alike! The signature \u0027Seaweed Meat Floss Cake\u0027 (Xiao Bei) is generously coated in crispy seaweed and savory pork floss. One bite reveals golden, fluffy chiffon cake filled with a bursting creamy mayonnaise sauce. Perfectly balancing sweet and savory notes with a rich, moist texture, it\u2019s the ultimate delightfully indulgent snack for a stroll.", "name": "Bao\u0027s Pastry", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, approx. 200m walk"}, {"address": "Shop NL119, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Famous for fresh, handcrafted Taiwanese and Cantonese desserts and drinks, this is a wildly popular trendy spot in MixC World. The signature \u0027Hand-mashed Taro Paste with Rice Mochi\u0027 features Lipu taro from Guangxi mashed fresh daily, paired with stretchy, chewy rice mochi and rich milk. It blends velvety smooth textures with a playful bounce, bursting with rich taro and milky aromas that dessert lovers adore.", "name": "Ah Ma Hand Made", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A, approx. 300m walk"}, {"address": "Street Shop, Phase 2, Dachong Xincun, Hi-Tech Park, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | A beloved traditional Cantonese sweet soup spot favored by locals and commuters. The signature \u0027Freshly Poured Ginger Milk Pudding\u0027 involves pouring hot milk directly over aged ginger juice to set, creating a silky custard-like texture where zesty ginger warmth blends seamlessly with sweet milk. Their \u0027Mango Sago with Pomelo\u0027 is equally refreshing, offering a chewy, sweet-and-sour classic treat perfect for cutting through street food richness.", "name": "Deng\u0027s Heritage Desserts", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 450m walk"}, {"address": "Street Shop, Hi-Tech Park Food Street, Gaoxin South 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | One of the most popular late-night street food spots in Hi-Tech Park, serving Leshan, Sichuan-style fried skewers. Specialties like chicken cartilage, tender beef, and squid are fried to crisp perfection, then dusted with a secret spiced chili blend and sesame seeds. Crispy on the outside and juicy inside, these savory, spicy skewers are non-greasy and make the ultimate post-work midnight snack.", "name": "Kuafu Fried Skewers", "transport": "Metro Line 1 Hi-Tech Park Station, Exit C, approx. 350m walk"}, {"address": "Street Shop, Dachong Urban Garden, Dachong 1st Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | An exquisite street pastry shop carrying on traditional Chinese imperial baking techniques. The signature \u0027Crispy Beef Pie\u0027 and \u0027Fragrant Walnut Cookies\u0027 boast irresistible golden hues. The walnut cookies melt in your mouth with rich buttery and egg aromas, while the beef pies feature paper-thin crispy crusts filled with juicy, aromatic savory beef. Served hot out of the oven, they make fantastic portable snacks and edible souvenirs.", "name": "Wu Su Sheng Palace Pastry", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 250m walk"}, {"address": "Underground Commercial Street, Hi-Tech Park Metro Station, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A famous cold-dish skewer brand originating from Chengdu, making it a must-buy street food right outside the metro station. Boneless chicken, kelp, beef tripe, and wood ear mushrooms are steeped in a savory, tongue-numbing chili oil sauce. With juicy chicken and crunchy vegetables infused with bold Sichuan flavors, it\u0027s a convenient, mouth-watering grab-and-go snack.", "name": "Liao Ji Bang Bang Chicken", "transport": "Directly accessible via the underground concourse of Metro Line 1 Hi-Tech Park Station"}, {"address": "Street side, Junction of Tonggu Road and Kefa Road, Dachong, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | A lively neighborhood stall packed with local flavor. Using freshly stone-ground rice batter steamed to order, the rice sheets are paper-thin, silky, and tender. Wrapped around fresh shrimp, eggs, and minced pork, then drizzled with sweet soy sauce and house-made garlic chili sauce, this piping-hot delicacy delivers the pure, authentic charm of Lingnan street food.", "name": "Dachong Steamed Rice Roll", "transport": "Metro Line 1 Hi-Tech Park Station, Exit B, approx. 400m walk"}, {"address": "Underground Street, Floor LG, MixC World, No. 9668 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | A wildly popular Japanese handcrafted sweet spot in the MixC World shopping district. Reinventing traditional dorayaki, they specialize in chilled, generously stuffed pancake sandwiches. The fluffy pancake shell encases smooth, rich fillings like \u0027Matcha Red Bean Cream\u0027 and \u0027Oreo Cheese\u0027. Chilled to perfection and not overly sweet, these photogenic treats are a hit for handheld street snacks.", "name": "Sawada Honke Dorayaki", "transport": "Metro Line 1 Hi-Tech Park Station, Exit A direct access to MixC World B1/LG level"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Nanshan Science and Technology Park and MixC World"}, "oct_shekou": {"categories": {"cat_1": {"items": [{"address": "No. 131 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Standing on Shekou Old Street for decades, this legendary Cantonese roast meat spot is considered a shrine for Hong Kong-style roast meats among locals and foodies. The signature Sham Tseng roast goose features paper-thin, crispy skin that releases a rich, fragrant burst of juices and tender, succulent meat with every bite. The honey-glazed Char Siu boasts a delightful char and perfectly balanced sweetness. An absolute favorite for both tourists and long-time locals is the roast goose combo rice served with their secret plum sauce\u2014sweet, tangy, and refreshing, capturing the most authentic classic Cantonese flavor in every bite.", "name": "De Ji Roast Meat Restaurant", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), then walk about 450 meters."}, {"address": "No. 118 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A highly representative traditional eatery on Shekou Old Street, renowned far and wide for its generously filled salted egg yolk rice dumplings and savory claypot rice. The signature salted egg yolk rice dumpling is packed with a rich, savory egg yolk, flavorful pork belly, and soft red beans, with sticky rice soaked in rich meat broth\u2014chewy and fragrant without being mushy. The made-to-order claypot rice features a crispy, aromatic bottom crust drizzled with special soy sauce, making it an absolute hit among food enthusiasts.", "name": "Jiahua Snack Bar", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), then walk about 400 meters."}, {"address": "No. 207 Shekou New Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | A beloved heritage shop passed down through generations, specializing in Chinese herbal teas and traditional Cantonese desserts, steeped in nostalgic Lingnan charm. The most famous item, the signature Secret Herbal Tortoise Jelly, is smooth with a delicate bitterness and lingering sweet aftertaste\u2014perfect when paired with condensed milk or honey. Additionally, the Buffalo Steamed Milk Pudding is rich, sweet, and melt-in-your-mouth, while the Mango Double-Skin Milk offers a delicious symphony of fruity and milky flavors. It is not only a refreshing haven for locals to beat the heat, but also a must-visit spot for tourists eager to experience traditional herbal tea culture.", "name": "Baicaotang Traditional Herbal Tea \u0026 Dessert", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), then walk about 500 meters."}, {"address": "1F, Portofino Club, No. 1 Xiangshan Middle Street, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | Situated on the shores of Swan Lake in OCT, this classic high-end Cantonese restaurant has been rooted in Shenzhen for decades, renowned city-wide for its authentic dim sum and refined traditional main dishes. The signature Braised Pork Trotter is tender, chewy, and rich in collagen, braised to savory perfection. The Supreme Shrimp Dumpling (Har Gow) features paper-thin translucent skin wrapping two to three plump, snappy whole shrimps, delivering a sweet, robust flavor. Boasting breathtaking lake views and elegant classic decor, it is the top choice for local family gatherings and tourists looking for an authentic Yum Cha experience.", "name": "Dan Guai Xuan (OCT Branch)", "transport": "Take Shenzhen Metro Line 2 to Qiaocheng North Station (Exit B), then walk about 900 meters."}, {"address": "No. 2 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 Stars | The most iconic traditional seafood open-air stall (Dai Pai Dong) in Shekou, accompanying generations of locals for late-night meals. Featuring fresh daily seafood directly sourced from Shekou Fishing Port, the signature Salt \u0026 Pepper Bombay Duck Fish is crispy on the outside and tofu-soft inside, melting instantly. The Steamed Scallops with Garlic and Salt \u0026 Pepper Mantis Shrimp are sweet, plump, and bursting with garlic and oceanic goodness. Its relaxed, down-to-earth vibe and ultra-fresh ingredients make it the ultimate spot to experience Shenzhen\u0027s authentic local seafood culture.", "name": "Shekou Kangle Seafood Restaurant", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), then walk about 600 meters."}, {"address": "No. 6 Guanghua Street, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | A well-established traditional staple in Shenzhen, famous for its Teochew-style claypot porridge cooked fresh from raw rice. The signature Crab and Fresh Shrimp Porridge uses strictly selected live crabs and juicy prawns slow-simmered in rich broth until the rice grains absorb every drop of seafood essence and rich crab roe, creating a velvety, sweet, and comforting texture. Paired with freshly fried golden crispy Youtiao (Chinese crullers) and Teochew side dishes, it warms both the stomach and the soul\u2014the best place for late-night foodies and travelers craving authentic Teochew flavors.", "name": "Jin Dao Yuan Claypot Porridge (OCT Branch)", "transport": "Take Shenzhen Metro Line 1 to OCT Station (Exit A), then walk about 350 meters."}, {"address": "No. 108 Taizi Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | A classic heritage Cantonese restaurant in Shekou that holds beloved morning tea memories for countless long-time Shenzhen residents. It preserves the most traditional Cantonese morning tea culture. The signature Steamed Chicken Feet in Black Bean Sauce is melt-in-your-mouth tender, effortlessly sliding off the bone, while the Honey BBQ Pork Buns are fluffy and packed with savory-sweet filling. Local elders love coming here for a relaxed morning with tea and dim sum; its wallet-friendly prices and decades of consistent quality continue to draw food lovers from all over.", "name": "Shekou Dexingcheng Restaurant", "transport": "Take Shenzhen Metro Line 2 or Line 12 to Sea World Station (Exit D), then walk about 300 meters."}, {"address": "No. 29 Zhaodong Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A legendary steamed rice roll shop hidden in the old neighborhoods of Shekou, persisting for decades in freshly steaming hand-ground rice batter made with traditional stone mills. The rice noodle sheets are paper-thin, translucent, silky smooth, and delightfully chewy with a subtle rice aroma. The signature Pork and Egg Combo Rice Roll is wrapped with juicy minced pork and soft scrambled egg, drizzled with sweet homemade soy sauce\u2014savory, silky, and melt-in-your-mouth. Though humble and unpretentious, it consistently draws long lines of locals and food hunters, perfectly showcasing Shekou\u0027s most authentic street flavor.", "name": "Shekou Famous Rice Noodle Roll Shop", "transport": "Take Shenzhen Metro Line 2 to Shuiwan Station (Exit C), then walk about 500 meters."}], "name": "Iconic Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "Room 101, Building F1, Wenchang South Street, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | A specialty coffee pioneer in OCT-LOFT, featuring industrial-style decor paired with a lush, green courtyard. Pour-over coffees use in-house roasted single-origin beans with distinct aromatic layers. Paired with their signature avocado and smoked salmon sourdough toast, it offers a rich yet refreshing taste\u2014a top choice for hipsters and coffee lovers enjoying a lazy morning.", "name": "Gee Coffee Roasters (OCT-LOFT Branch)", "transport": "Take Metro Line 1 to Qiaocheng East Station (Exit A), then walk for about 8 minutes."}, {"address": "South Square, G\u0026G Creative Community, No. 9 Liyuan Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | An instagrammable green shipping container cafe located in Shekou G\u0026G Creative Community, famous for its signature soy milk latte and handmade avocado croissant. The latte is silky smooth with a rich soy aroma, while the croissant is crispy outside, soft inside, and full of flavor. Combined with outdoor camping-style seating, it perfectly showcases Shekou\u0027s unique slow lifestyle and relaxing vibe.", "name": "Kuddo Coffee (Shekou G\u0026G Branch)", "transport": "Take Metro Line 2 to Shuiwan Station (Exit D), then walk for about 5 minutes."}, {"address": "Room 102, Building A4, North Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | An Australian-style brunch cafe and specialty coffee shop known for its signature deep-blue color palette and minimalist design. The signature Flat White features silky and smooth microfoam, paired perfectly with Eggs Benedict or their homemade Aussie Big Breakfast. Generous portions and fresh ingredients attract many expats and tourists alike.", "name": "Something For (OCT-LOFT Branch)", "transport": "Take Metro Line 2 to Qiaocheng North Station (Exit B), then walk for about 10 minutes."}, {"address": "Room 103, Building A4, North Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | A unique specialty coffee shop blending racing culture and outdoor camping style, located in the North Area of OCT-LOFT. The cafe offers creatively crafted signature coffee drinks, such as bold cold brews and fruity lattes, served alongside freshly baked American bacon waffles and artisanal desserts. Highly distinct personality with multi-layered flavors.", "name": "AOKKA Coffee (OCT-LOFT Branch)", "transport": "Take Metro Line 2 to Qiaocheng North Station (Exit B), then walk for about 9 minutes."}, {"address": "Room 101, Building 1, Nanhai E-Cool, Gongye 3rd Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | A cozy Japanese bakery and cafe in Nanhai E-Cool, specializing in daily fresh-baked Japanese Shokupan (raw toast), mentaiko French baguettes, and pour-over coffee. The Shokupan is soft, springy, and rich in milk flavor; paired with a slightly bright Yirgacheffe pour-over, it immerses you in Shekou\u0027s elegant rhythm.", "name": "Gaku Gaku Bakery \u0026 Cafe", "transport": "Take Metro Line 2 to Shuiwan Station (Exit D), then walk for about 6 minutes."}, {"address": "Room 108, Building 2, Nanhai E-Cool, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Tucked away in Shekou\u0027s Nanhai E-Cool, this vintage industrial cafe is a favorite among local residents and coffee lovers. Offering carefully selected premium coffee beans from around the world, both pour-overs and dark roast lattes excel here. Paired with a rich Basque cheesecake that melts in your mouth, it is the best place to enjoy a quiet afternoon tea.", "name": "Halfton Coffee (Shekou Branch)", "transport": "Take Metro Line 2 to Shuiwan Station (Exit D), then walk for about 7 minutes."}, {"address": "Room 101, Zone C, Sea World, No. 1128 Wanghai Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | A minimalist American-style brunch spot near Sea World Plaza, famous for fresh-baked American breads and hearty big breakfast platters. Signature beef cheeseburgers and French toast offer rich, crisp-yet-tender textures. Accompanied by aromatic cold brew, it provides ultimate satisfaction while taking in the beautiful scenery of Sea World.", "name": "BAKERS BASE (Shekou Sea World Branch)", "transport": "Take Metro Line 2 or Line 8 to Sea World Station (Exit A), then walk for about 3 minutes."}, {"address": "Room 102, Building 1, Zone C, Sea World, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | The famous minimalist white-themed specialty coffee brand from Hong Kong features a stunning design-centric space at Sea World. The store focuses on single-origin pour-overs and classic lattes crafted with precise water temperature and flow control for an exceptionally clean and pure taste. Paired with healthy yogurt bowls and sourdough brunch, it is beloved by those who pursue a quality lifestyle.", "name": "NOC Coffee Co. (Sea World Branch)", "transport": "Take Metro Line 2 or Line 8 to Sea World Station (Exit A), then walk for about 4 minutes."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 118, Zone C, Sea World Plaza, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | A classic Irish pub located in Shekou Sea World, beloved by expats and local foodies alike. The lively, festive atmosphere pairs perfectly with their signature Guinness Beef Pie\u2014featuring a golden, flaky crust filled with tender, flavorful stewed beef that bursts with rich juices. Paired with a freshly poured pint of Guinness, the crisp, slightly bitter malt flavors beautifully balance the savory meat, making it the ultimate destination for evening drinks, great food, and international vibes.", "name": "McCawley\u0027s Irish Pub \u0026 Restaurant", "transport": "Metro Line 2, Sea World Station, Exit A, approx. 300m walk"}, {"address": "Shop 106, Building 1, Nanhai Rose Garden Phase 2, Jinshiji Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | A long-standing authentic Italian bistro in Shekou, famous for its pizzas baked in traditional wood-fired ovens. The signature Margherita pizza boasts a chewy crust with a crispy, charred edge, where sweet-and-sour fresh tomato sauce and melted, stretchy mozzarella harmonize to deliver authentic Southern Italian flavors. Paired with selected Italian red wines and a grilled seafood platter, its rich textures attract countless international food enthusiasts.", "name": "Oggi Pizzeria \u0026 Bistro", "transport": "Metro Line 2, Shuiwan Station, Exit D, approx. 800m walk"}, {"address": "No. 201, Zone A, Sea World Plaza, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | An open-air music bar and restaurant situated right next to the Minghua Ship in Sea World, offering top-notch live band performances. Their charcoal-grilled American pork ribs are tender and juicy, pulling off the bone effortlessly while coated in a sweet-and-savory BBQ sauce. Enjoy them alongside craft cocktails and crispy fried seafood snacks for a crisp-on-the-outside, tender-on-the-inside taste explosion\u2014a quintessential Shekou nightlife experience.", "name": "Terraces Bar \u0026 Restaurant", "transport": "Metro Line 2, Sea World Station, Exit A, approx. 200m walk"}, {"address": "North Zone, OCT-LOFT Creative Culture Park, No. 10 Jinxiu North Street, Xiangshan East Street, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | A renowned Anhui restaurant in OCT-LOFT that seamlessly blends traditional regional flavors with a modern bistro concept. The signature Stinky Mandarin Fish is naturally fermented for a deep, savory aroma; its firm, garlic-clove-like meat offers a springy bite with a mild spicy kick that goes remarkably well with rice. Paired with house-special Huizhou yellow wine or a crisp white wine, the fish\u0027s fresh sweetness is elevated to perfection, earning high praise from discerning gourmets.", "name": "Wan Chu - Anhui Cuisine", "transport": "Metro Line 2, Qiaocheng North Station, Exit B, approx. 600m walk"}, {"address": "Shop 101, Building A1, North Zone, OCT-LOFT Creative Culture Park, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Tucked away in the lush greenery of OCT-LOFT, this elegant and sophisticated modern Cantonese bistro is a hidden gem. The Crispy Roasted Squab comes highly recommended\u2014its skin is roasted to a paper-thin, glass-like crunch that crackles with every bite, unleashing a burst of succulent, sweet, and tender juices. Complemented by selected champagnes or sakes, it highlights the delicate craftsmanship of Cantonese cuisine, making it a top choice for fine dining.", "name": "Que Yuan - Cantonese Private Dining", "transport": "Metro Line 2, Qiaocheng North Station, Exit B, approx. 500m walk"}, {"address": "No. 201, Zone B, Sea World, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | An American-style bistro featuring a self-serve beer wall and signature local-fusion bites, housed in a spacious, industrial-chic space. The popular Black Truffle Fried Chicken boasts a golden, crispy skin and tender, juicy meat generously coated in rich, aromatic black truffle sauce. Paired with craft beers from around the world, the effervescent bubbles and indulgent fried chicken create a delightfully refreshing palate, making it a favorite among young crowds and tourists.", "name": "COMMUNE Bistro \u0026 Bar", "transport": "Metro Line 2, Sea World Station, Exit A, approx. 250m walk"}, {"address": "1st Floor, Building B2, North Zone, OCT-LOFT Creative Culture Park, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | The flagship location in OCT-LOFT that pioneered the music tavern trend, seamlessly blending Sichuan cuisine, live folk music performances, and wine culture. Served in a custom wooden cage, the signature Hutaoli Roast Chicken features a glossy, crispy golden skin and tender meat. Dipped in house-made Sichuan spicy powder, it delivers an explosive burst of savory, tingling flavor. Enjoyed with a glass of fine red wine amidst soul-stirring melodies, it offers a romantic and culturally rich dining experience.", "name": "Hutaoli Music Tavern", "transport": "Metro Line 2, Qiaocheng North Station, Exit B, approx. 550m walk"}, {"address": "Shop 106, Zone B, Huanchuan Plaza, Sea World, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A vibrant exotic bistro situated in the heart of Sea World, Shekou, celebrated for its Mexican and Latin American specialties. Their signature Beef Tacos feature handmade corn tortillas wrapped around tender, juicy braised beef, topped with tangy salsa and fresh guacamole. Every bite offers a crispy shell, rich juices, and complex flavors. Accompanied by handcrafted Margaritas, the zesty and slightly spicy combination is incredibly satisfying.", "name": "VIVA Bar \u0026 Restaurant", "transport": "Metro Line 2, Sea World Station, Exit A, approx. 180m walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2F, Building A4, North Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | A renowned Zen-style vegetarian spot located in OCT-LOFT, featuring an elegant and serene ambience. The signature \u0027Black Truffle Wild Mushroom Fried Rice\u0027 offers distinct grains infused with rich earthy mushroom aromas, bursting with forest flavors in every bite. The \u0027Black Pepper Vegetarian Steak\u0027 is firm, juicy, and pleasantly chewy, earning high praise from gourmets and international visitors alike.", "name": "Ruolanci Vegetarian Restaurant", "transport": "Metro Line 2, Qiaocheng North Station, Exit B, approx. 8 mins walk"}, {"address": "Room 102, Building F1, South Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Specializing in trendy plant-based dishes and cholesterol-free creative Western cuisine, attracting many young people and foreign tourists. Highly recommended is the \u0027Plant-Based Oat Burger\u0027, featuring a juicy patty free from raw soy flavor, paired with house-made plant cheese and crispy fries. Rich in flavor and texture, it perfectly combines health and taste.", "name": "Vegan Planet", "transport": "Metro Line 1, OCT Station, Exit A, approx. 10 mins walk"}, {"address": "Building 13, Qushui Bay, OCT Harbour, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Situated by the waterfront at OCT Harbour, blending Eastern Zen aesthetics with modern vegetarian cuisine. The \u0027Pan-fried Olive Oil Tea Tree Mushroom Buns\u0027 are highly recommended, featuring a crispy golden crust and a juicy, tender mushroom filling. The \u0027Black Truffle Tofu\u0027 melts in your mouth with a rich soy aroma, making it a top pick for family gatherings and tourists.", "name": "Qingchun Pusu Vegetarian Restaurant", "transport": "Metro Line 9, Shenzhen Bay Park Station, Exit E, approx. 5 mins walk"}, {"address": "3F, Zone C, Sea World, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | A healthy vegetarian hot pot using Tibetan tea broth, located in the vibrant Sea World area. The signature \u0027Tibetan Tea Broth\u0027 is rich with a lingering sweet finish. Cooked with the \u0027Handmade Wild Mushroom Platter\u0027, the ingredients absorb both tea and earthy aromas, yielding tender and crisp textures. Guilt-free and refreshing, it\u0027s loved by health-conscious city dwellers.", "name": "One Leaf One World Tibetan Tea Vegetarian Hotpot", "transport": "Metro Line 2/12, Sea World Station, Exit A, approx. 3 mins walk"}, {"address": "No. 19 Shuiwan Road, Shuiwan Community, Zhaoshang Street, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | A great-value vegetarian buffet in old Shekou, offering dozens of vegan hot dishes, pastries, and soups. The signature \u0027Handmade Veggie Dumplings\u0027 feature thin wrappers with juicy cabbage and wood ear fillings. The \u0027Freshly Fried Veggie Spring Rolls\u0027 are wonderfully crispy and fragrant, making it a popular spot for locals and expats to enjoy authentic, affordable plant-based dining.", "name": "Sumanxiang Vegetarian Buffet", "transport": "Metro Line 2, Shuiwan Station, Exit C, approx. 4 mins walk"}, {"address": "No. 9 Qiaocheng East Road, East Area Community, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Tucked away in the lush green streets of OCT, this traditional vegetarian spot serves exquisite Chinese plant-based dishes. A must-try is the \u0027Pine Nut Sweet and Sour Yellow Croaker\u0027, skillfully crafted from Lion\u0027s Mane mushroom and bean curd skin. Fried to a crisp golden finish and coated in a tangy sweet-and-sour sauce, it\u0027s delightfully refreshing and richly layered in texture.", "name": "Lotus Heart Vegetarian Restaurant", "transport": "Metro Line 1, Qiaocheng East Station, Exit A, approx. 6 mins walk"}, {"address": "No. 111 Taizi Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 Stars | A cozy healthy-eating spot near Sea World, famous for whole foods prepared with light seasoning. The \u0027Five-Grain Brown Rice with Veggies and Fruits\u0027 is highly recommended, served with seasonal vegetables and pan-seared pressed tofu. Crisp on the outside and tender inside, the tofu absorbs natural vegetable sweetness, providing a light, burden-free lunch choice for expats and office workers.", "name": "Yuan Su Healthy Vegetarian Cuisine", "transport": "Metro Line 2, Sea World Station, Exit C, approx. 5 mins walk"}, {"address": "L3 Floor, Yitian Holiday Plaza, No. 9028 Shennan Avenue, OCT, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | An upscale creative vegetarian restaurant adjacent to Window of the World in OCT, blending fusion cuisine into plant-based dining. The signature \u0027Avocado Veggie Tartare\u0027 features fresh avocado and house-made vegan cheese with a smooth texture and subtle fruity sweetness. Served with crispy organic crackers, it is beautifully presented and highly favored by influencers and tourists.", "name": "Vegetable Heart Creative Vegetarian", "transport": "Metro Line 1/2, Window of the World Station, Exit A, directly connected to the mall"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 80 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A decades-old legendary street food shop in Shekou. Its signature dish is the \u0027Egg Yolk Pork Zongzi\u0027\u2014glutinous rice soaked in fragrant lard and savory braised sauce wrapping around a perfect balance of tender pork belly and a rich, creamy salted egg yolk. The pork trotter noodles and claypot rice are also hugely popular among locals and tourists, making it a must-visit stall for authentic Shenzhen street food.", "name": "Jiahua Snacks", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), and walk for about 300 meters."}, {"address": "No. 207 Shekou New Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | Shekou\u0027s most famous traditional dessert and herbal tea shop. Must-try treats include the \u0027Mango Sago with Pomelo\u0027 and \u0027Signature Milk Cubes\u0027. The milk cubes offer an incredibly rich dairy flavor with a cool, bouncy texture, while the mango sago balances sweet and tangy flavors with smooth sago pearls. Steeped in nostalgic Hong Kong and Cantonese street vibe, it draws crowds every afternoon seeking a refreshing sweet treat.", "name": "Baicaotang Ancestral Herbal Tea \u0026 Desserts", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), and walk for about 450 meters."}, {"address": "No. 29 Zhaoshang Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 stars | A legendary fried chicken shop operating in Shekou for decades. Famous for thin skin and juicy meat, their fried chicken drumsticks are cooked to order\u2014crispy and golden on the outside with a satisfying crunch, while the tender meat inside is infused with a subtly spicy thirteen-spice blend. Strolling through Shekou while enjoying one of these chicken legs is an absolute quintessential experience.", "name": "Kangle Fried Chicken \u0026 Snacks", "transport": "Take Shenzhen Metro Line 2 to Shuiwan Station (Exit C), and walk for about 500 meters."}, {"address": "No. 5
