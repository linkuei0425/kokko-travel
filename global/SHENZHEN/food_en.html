9 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 stars | Using traditional stone mills to grind fresh rice batter, this stall serves steamed rice noodle rolls (changfen) that are paper-thin, translucent, and incredibly silky yet chewy. Drizzled with a secret sweet soy sauce and custom chili paste, and filled with fresh shrimp or minced pork and egg, it explodes with rice fragrance and savory notes\u2014a beloved classic breakfast and street snack for generations of locals.", "name": "Shekou Old Street Stone-Mill Changfen", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), and walk for about 350 meters."}, {"address": "Near the intersection of Yucun Road and Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.2 stars | A hidden traditional street stall near the old cinema, famous throughout Guangdong for its handmade \u0027Signature Coconut Milk Red Bean Cake\u0027 and \u0027Double Skin Milk Pudding\u0027. The coconut cake features distinct layers with a cool, springy texture, releasing a rich coconut aroma complemented by soft, gently sweet red beans. Served in handy paper boxes perfect for munching on the go, it offers a nostalgic taste of old Shekou.", "name": "Shekou Cinema Auntie\u0027s Desserts", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), and walk for about 400 meters."}, {"address": "North Area Market, OCT Loft, Jinxiu North Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.1 stars | A wildly popular street snack stall at the OCT Loft Creative Market. Featuring a cake-like fluffy crust loaded with generous fillings, every piping hot bite bursts with rich flavors like taro paste salted egg yolk or molten matcha. The hip aesthetic and stylish packaging make these wheel cakes a favorite photo-worthy grab-and-go snack for market-goers.", "name": "OCT Loft Market Wheel Cake Stall", "transport": "Take Shenzhen Metro Line 2 to Qiaocheng North Station (Exit B), and walk for about 600 meters."}, {"address": "No. 113 Shekou New Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | A traditional street stall pounding out fresh glutinous rice cakes daily, specializing in \u0027Mango Mochi\u0027 and \u0027Peanut \u0026 Sesame Mochi\u0027. Made from pounded premium glutinous rice, the skin is delightfully chewy yet non-sticky, encasing a whole chunk of ripe, sweet mango. One bite releases a burst of fresh fruit juice blended with bouncy mochi, making it an unmissable budget-friendly street sweet in Shekou.", "name": "Old Neighbor Handmade Rice Cake Shop", "transport": "Take Shenzhen Metro Line 2 to Shuiwan Station (Exit D), and walk for about 550 meters."}, {"address": "No. 136 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | A Michelin-recommended local icon in Shekou. Beyond full bento meals, its takeaway window serves insanely popular street bites like \u0027Honey BBQ Pork Pastries\u0027 and \u0027Roast Duck Wings/Feet\u0027. The BBQ pork pastry boasts flaky, buttery layers filled with sweet and savory seasoned char siu pork, best enjoyed hot and fresh. A beloved spot for both locals and traveling foodies.", "name": "De Ji Roast Meat Street Window", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station (Exit A), and walk for about 300 meters."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Overseas Chinese Town and Shekou Sea World"}, "yantian_dameisha": {"categories": {"cat_1": {"items": [{"address": "No. 83 Shashen Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | A highly iconic, time-honored rice noodle roll shop in Shatoujiao, Yantian, famous for its stone-ground rice noodle rolls made from freshly milled rice slurry. The rolls are paper-thin, silky, and velvety, melting in your mouth with a rich rice aroma. Paired with the house-secret sweet soy sauce and special chili paste, it offers an unforgettable taste\u2014a classic morning culinary experience for locals and visitors alike.", "name": "Deng Family Heritage Rice Noodle Roll", "transport": "Metro Line 8, Shatoujiao Station, Exit A, approx. 500m walk"}, {"address": "No. 100 Yanmei Road, Dameisha, Meisha Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A long-standing famous landmark in Dameisha, renowned throughout Shenzhen for its golden, crispy roasted pigeon. Featuring crispy skin and tender, juicy meat with a savory, flavorful finish in every bite. The dining atmosphere is filled with coastal charm, combining the essence of Hakka and Cantonese cuisines, making it a top traditional dining choice after visiting Dameisha Beach.", "name": "Wugufang Pigeon Restaurant (Dameisha Main Store)", "transport": "Metro Line 8, Dameisha Station, Exit A, approx. 600m walk"}, {"address": "No. 76 Yanmei Road, Meisha Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A decades-old landmark seafood restaurant in Dameisha, celebrated for its fresh tank-to-table seafood cooked to preserve natural flavors. The signature salt-and-pepper mantis shrimp boasts a crispy shell and succulent, springy meat, while the steamed seafood is exquisitely sweet and fresh. Dining on the rooftop terrace at dusk with an ocean breeze and sunset earns rave reviews from foodies and travelers alike.", "name": "Shigonghui Seafood Restaurant (Dameisha Branch)", "transport": "Metro Line 8, Dameisha Station, Exit B, approx. 800m walk"}, {"address": "No. 8 Yantian Seafood 1st Street, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | One of the oldest institutions on Yantian Seafood Street, specializing in live seafood prepared with classic Cantonese culinary techniques. The signature Typhoon Shelter crab is deliciously spicy with sweet, plump meat, while the steamed scallops with garlic and vermicelli are plump and juicy. Reasonable prices and supreme freshness make it a favorite local gathering spot.", "name": "Mingji Seafood Restaurant (Yantian Seafood Street)", "transport": "Metro Line 8, Yantian Road Station, transfer to Bus M191 to Yantian Seafood Street Stop"}, {"address": "No. 16 Yuanlin Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A popular traditional rice noodle roll shop hidden in an alley of an old Shatoujiao neighborhood. The house sauce is perfectly balanced, making the pork and egg rolls delicate and smooth with a seamless blend of aromas, enhanced by rich scallion oil. Its nostalgic community vibe and budget-friendly prices draw endless foodies seeking authentic flavors.", "name": "Changfen Wu (Shatoujiao)", "transport": "Metro Line 8, Shatoujiao Station, Exit B, approx. 400m walk"}, {"address": "No. 21 Tianxin East Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A long-running Chaoshan beef eatery in Shatoujiao, Yantian, serving authentic beef hotpot and beef noodles crafted from fresh unchilled beef delivered daily. Sliced to perfect thickness, the beef turns tender, juicy, and richly flavorful after just seconds in hot broth. Hand-beaten beef balls are springy and bursting with juice, loved by locals and purists alike.", "name": "Zhouji Beef Restaurant (Shatoujiao)", "transport": "Metro Line 8, Haishan Station, Exit A1, approx. 700m walk"}, {"address": "Near the intersection of Jiuhao Road and Shayan Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | A nostalgia-filled food stall loved by Shatoujiao locals since childhood, famed for traditional drawer-steamed rice noodle rolls. The sheets are translucent, soft, and pleasantly chewy, wrapped around fresh shrimp or minced pork, topped with secret chili oil and scallion sauce. Simple yet richly layered, it delivers authentic local Shenzhen street flavor.", "name": "No. 9 Rice Noodle Roll (Shatoujiao)", "transport": "Metro Line 8, Shatoujiao Station, Exit A, approx. 350m walk"}, {"address": "1F, No. 1025 Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A highly acclaimed traditional Chaozhou restaurant near Haishan Station in Yantian. The signature marinated goose platter is tender with rich, fragrant marinade, while the chilled flower crab offers sweet, firm, and refreshingly cool meat. Authentic Chaoshan flavors refined with a delicate touch make it the top choice in Shatoujiao for exquisite local heritage cuisine.", "name": "Chaoxiang Sihai Authentic Chaozhou Cuisine (Shatoujiao)", "transport": "Metro Line 8, Haishan Station, Exit L2, approx. 300m walk"}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Inside Lighthouse Library, Coastal Boardwalk, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.7 stars | Located inside the viral-worthy Lighthouse Library along the Yantian Boardwalk, featuring an unbeatable 270-degree ocean view. Savor a rich Flat White and freshly baked Basque cheesecake while admiring the sparkling sunlit sea. The medium-dark roast coffee beans offer a full-bodied taste with notes of dark chocolate and nuts. The smoked salmon avocado croissant brunch is crispy and juicy\u2014making this the ultimate escape for a relaxing afternoon tea.", "name": "Lighthouse Library Cafe", "transport": "About a 10-minute walk from Exit B of Haishan Station, Metro Line 8"}, {"address": "Inside InterContinental Dameisha Resort, No. 9 Yankui Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.8 stars | Situated within the luxury resort at Dameisha, right next to golden beach sands and azure waters. Their English afternoon tea for two and American brunch are hugely popular. The signature cold brew offers a sweet-and-sour balance with fresh citrus notes. The eggs Benedict features golden oozy yolks paired with seared bacon and house-made French toast that is crispy outside and pillow-soft inside. A favorite spot for both tourists and locals to unwind in the sea breeze.", "name": "InterContinental Dameisha Resort Seaview Cafe \u0026 Brunch", "transport": "About an 8-minute walk from Exit A of Dameisha Station, Metro Line 8"}, {"address": "Inside Interlaken Town, Tea Stream Valley, Shuangxi East Road, Overseas Chinese Town East, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Tucked away in a European-style town at Tea Stream Valley in East OCT, this caf\u00e9 is full of Swiss charm. The lakeside outdoor seating lets you watch swans swim by. Classic single-origin pour-over coffee features bright acidity with floral and fruity aromas, perfectly paired with French strawberry mille-feuille and freshly made American pancake stacks. The cool lake breeze makes for a romantic European getaway vibe.", "name": "Interlaken Lake Cafe at East OCT", "transport": "Take Bus M520 to OCT East Terminus, then transfer to the park shuttle bus"}, {"address": "Seaside Plaza, 1st Floor, ONE MALL, Shenyan Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Located at the waterfront plaza of One Mall near Haishan Station in Shatoujiao, featuring floor-to-ceiling windows overlooking the seaside park. Highlights include specialty pour-overs and handmade Japanese souffl\u00e9 pancakes that are cloud-light and melt in your mouth. Paired with a rich matcha latte or sparkling cold brew, it\u2019s pure bliss. A favorite weekend brunch and gathering spot for Shatoujiao locals.", "name": "One Mall Seaview Cafe Shatoujiao", "transport": "About a 5-minute walk from Exit A2 of Haishan Station, Metro Line 8"}, {"address": "No. 102 Wutongshan Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | A hipster indie caf\u00e9 tucked away near the trailhead of Wutong Mountain in Shatoujiao. Away from the coast, it offers tranquil forest air and greenery. Specialty single-origin pour-overs and house-baked sourdough brunch are the main draws. The Yirgacheffe pour-over emits delicate rose and citrus notes, while the avocado basil chicken sourdough sandwich is crispy outside, soft inside, and packed with flavor\u2014a secret hideaway for hikers to recharge.", "name": "Wutong Mountain Foot Coffee", "transport": "From Exit B of Shatoujiao Station (Metro Line 8), transfer to Bus B924 to Wutong Mountain Scenic Area Station"}, {"address": "Observation Deck, Coastal Boardwalk, Xiaomeisha Resort, Yankui Road, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | A scenic caf\u00e9 located right by the observation deck along the Xiaomeisha coastline, offering unobstructed views of the ocean. The signature sea salt latte features premium fresh milk topped with a savory-sweet foam cap, smooth and lingering on the palate. The hearty full English breakfast (beans, sausages, bacon, fried eggs) is aromatic and satisfying. Eating here while listening to waves crash against rocks draws crowds of photo-seeking tourists.", "name": "Xiaomeisha Corner Seaview Cafe", "transport": "About a 12-minute walk from Exit A of Xiaomeisha Station, Metro Line 8"}, {"address": "No. 45 Haitao Road, Chung Ying Street Historic \u0026 Cultural District, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | A heritage building turned specialty coffee shop that blends the rich history of Chung Ying Street with modern coffee culture. The interior retains vintage red brickwork and antique furniture, creating a retro vibe. The signature Hong Kong-style Yuan Yang Specialty Latte blends espresso with Ceylon black tea into a silky bittersweet brew, served with freshly baked pineapple bun with iced butter\u2014a quintessential local culinary experience.", "name": "Chung Ying Street Vintage Coffee", "transport": "About a 15-minute walk from Exit A of Shatoujiao Station, Metro Line 8"}, {"address": "West Terrace, Dameisha Seaside Park, Yankui Road, Meisha Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Nestled in a seaside garden on the west side of Dameisha Seaside Park, oozing tropical resort vibes. Famous for its Tex-Mex beef burrito brunch and coconut cold brew. The chewy, toasted tortilla wraps spicy, juicy beef and melted cheese, delivering a burst of flavor in every bite. Fresh coconut water infuses dark-roast espresso with refreshing nutty undertones. Outdoor umbrella seating lets guests soak up the sun and beach views.", "name": "Heat Wave Ocean Garden Cafe", "transport": "About a 6-minute walk from Exit B of Dameisha Station, Metro Line 8"}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "No. 8 Haixian Street, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | A decades-old institution on Yantian Seafood Street, renowned for ultra-fresh seafood cooked live-to-order with authentic Cantonese techniques. The signature Salt \u0026 Pepper Bombay Duck fish features a crispy exterior and melt-in-your-mouth interior with rich seasoning; the Steamed King Prawns with Minced Garlic are plump, springy, and bursting with sweet juices. Loved by local foodies and tourists alike, dining here while enjoying gentle ocean breezes and sea views makes it an unmissable landmark restaurant.", "name": "Shigonghui Seafood Restaurant", "transport": "Take Metro Line 8 to Yantian Road Station, then transfer to Bus M191 and get off at Yantian Seafood Street Station."}, {"address": "No. 2001 Shayan Road, Tianxin Community, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A traditional Hakka eatery rooted in Shatoujiao for years, bringing rich, authentic countryside Hakka flavors to life. The signature Hakka Stuffed Tofu is pan-fried to a light golden brown, blending silky tofu with savory meat filling in a rich, savory gravy perfect with rice; the Hakka Salt-Baked Chicken features crispy skin, tender meat, and a rich chicken oil aroma. The dining environment exudes a strong vintage charm, making it the top choice for experiencing Shatoujiao\u0027s local culture and authentic Hakka cuisine.", "name": "Deng\u0027s Hakka Restaurant", "transport": "Take Metro Line 8 to Shatoujiao Station (Exit A) and walk about 500 meters."}, {"address": "Inside The Interlaken Hotel, OCT East, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Located by the lake in Interlaken Town inside OCT East, Dameisha, combining Swiss charm with a refined bistro experience. It serves premium European barbecue, craft cocktails, and freshly brewed beer. The signature German Roasted Pork Knuckle boasts crispy skin and juicy meat, paired with specially made sauerkraut to balance the richness. Dining at night on the lakeside terrace with fine food, lights, and music creates an intensely romantic atmosphere, hugely popular among couples and vacationers.", "name": "Interlaken Lakefront Bistro \u0026 Bar", "transport": "Take Metro Line 8 to Dameisha Station, then transfer to a tourist shuttle bus or taxi to OCT East."}, {"address": "No. 14 Haixian Street, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A storied ocean-view restaurant on Yantian Seafood Street, famous for its abundant live seafood and authentic Cantonese specialties. The signature Stir-fried Clams in Black Bean Sauce is cooked over high heat, featuring plump sand-free clams coated in rich savory black bean sauce; the Steamed Grouper is cooked to perfection, yielding delicate, sweet fish meat. Offering front-row panoramic sea views, diners can enjoy exquisite seafood while taking in the magnificent scenery of Yantian Port.", "name": "Mayflower Seafood Restaurant", "transport": "Take Metro Line 8 to Yantian Road Station, transfer to Bus M191, and get off at Yantian Seafood Street Station."}, {"address": "No. 42 Jinrong Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A famous Shenzhen midnight-dining and casserole porridge brand. The Shatoujiao branch serves authentic Chaoshan claypot porridge and fine skewers. The signature Crab Roe \u0026 Shrimp Porridge is cooked to order with live crabs and prawns; the velvety porridge base absorbs the rich crab roe and sweet shrimp flavors, making every bite delicious and comforting. Paired with crispy-yet-tender lamb skewers and grilled oysters, it is a local and tourist favorite for late-night gatherings and casual dining.", "name": "Jindaoyuan Casserole Porridge (Shatoujiao Branch)", "transport": "Take Metro Line 8 to Haishan Station (Exit A1) and walk about 600 meters."}, {"address": "1F, InterContinental Shenzhen Dameisha Resort, No. 9 Yankui Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | An upscale oceanfront bistro located inside InterContinental Shenzhen Dameisha Resort, specializing in authentic Italian Mediterranean cuisine and curated wines. The signature wood-fired handmade pizza has a crispy yet chewy crust topped with fresh basil and rich mozzarella; the Seared New Zealand Lamb Chops are seared crisp on the outside and juicy inside without gameiness. Direct beach access, unrivaled ocean views, and an ultra-luxurious dining ambiance make it a favorite for lovers of high-end dining and romantic dates.", "name": "Capri Italian Restaurant \u0026 Bar (InterContinental Dameisha)", "transport": "Take Metro Line 8 to Dameisha Station (Exit B) and walk about 800 meters."}, {"address": "Yantian Port Building, No. 1 Haiyan Road, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A Yantian branch of Shenzhen\u0027s renowned classic Cantonese brand, seamlessly fusing traditional Cantonese heritage with local fresh seafood. The signature sizzler claypot (Zhezhe Bao) series is wonderfully aromatic\u2014the eel and chicken pots arrive sizzling at the table with tender meat and savory sauce; the Crispy Roast Goose features paper-thin skin and juicy meat, served with sweet-and-sour plum sauce. Elegant interior decoration makes it exceptionally popular for both family gatherings and business banquets.", "name": "Shengji Seafood Restaurant (Yantian Branch)", "transport": "Take Metro Line 8 to Yantian Road Station (Exit D) and walk about 700 meters."}, {"address": "No. 33 Haitao Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | A hidden local secret tucked away in Shatoujiao\u0027s old neighborhood, focusing on Shatoujiao home-style dishes and coastal fishing village flavors. The signature Pan-Fried Stuffed Three Treasures and Steamed Sea Fish in Black Bean Sauce taste exceptionally authentic; the fish is tender and springy, bringing out sweet natural flavors with simple soy sauce. The Hakka Pork Soup is light, sweet, and infused with peppery notes, perfectly warming and nourishing. Down-to-earth, cozy, affordable, and generous, it\u0027s a great spot to experience local Shatoujiao food culture.", "name": "Haitao Restaurant (Shatoujiao Local Cuisine)", "transport": "Take Metro Line 8 to Shatoujiao Station (Exit B) and walk about 650 meters."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 2015 Shenyan Road, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Located in Shatoujiao, this popular vegetarian buffet is famous for its incredible value for money and wide variety of dishes. The restaurant offers over 50 vegan and lacto-ovo vegetarian dishes. The freshly fried vegetarian spring rolls and homemade vegan collagen soup are highly recommended. The spring rolls have an ultra-crispy skin that crackles with every bite, filled with shredded shiitake mushrooms and cabbage for a sweet, juicy, and non-greasy flavor. Loved by locals and hikers alike, it\u0027s a top choice for experiencing authentic, affordable local vegetarian cuisine.", "name": "Ciwei Vegetarian Buffet", "transport": "Shenzhen Metro Line 8, Haishan Station, Exit A1, about a 500-meter walk"}, {"address": "Phase 2, One City, Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | An exquisite vegetarian restaurant near Seashore Park, featuring a quiet and elegant ambience. The signature \u0027Black Truffle Wild Mushroom Fried Rice\u0027 features a variety of fresh, rare mushrooms stir-fried over high heat with distinct grains of rice. The rice absorbs the essence of the mushrooms and the rich aroma of black truffle, offering a chewy, multi-layered texture. Another standout, the \u0027Three-Cup Lion\u0027s Mane Mushroom\u0027, is prepared to give the mushroom a tender, meat-like texture that soaks up savory juices. Juicy with every bite and infused with ginger and basil aromas, it is a favorite among health-conscious tourists.", "name": "Jingxin Vegetarian Restaurant", "transport": "Shenzhen Metro Line 8, Haishan Station, Exit B2, about a 350-meter walk"}, {"address": "No. 88 Yantian Section, Wutong Mountain Winding Highway, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Nestled at the foot of Wutong Mountain, this Zen-inspired vegetarian restaurant is a favorite stop for hikers. The \u0027Nourishing Bamboo Fungus and Bamboo Shoot Soup\u0027 is highly recommended; simmered over low heat for hours, it captures the natural sweetness of mountain bamboo shoots and the crispness of bamboo fungus, yielding a refreshing, velvety broth. Paired with freshly steamed \u0027Whole Wheat Vegetable Buns\u0027\u2014soft, chewy dough stuffed with fresh wild vegetables that release a natural fragrance\u2014it\u0027s the perfect delicious meal to recharge after a hike.", "name": "Wutong Mountain Vegetarian Kitchen", "transport": "Take Bus M444 to \u0027Wutong Mountain Scenic Area Station\u0027, then walk about 10 minutes"}, {"address": "Inside InterContinental Dameisha Resort, No. 9 Yankui Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.8 Stars | Situated in the Dameisha Seashore Resort, this top-tier plant-based restaurant offers unbeatable ocean views alongside a five-star gourmet vegetarian feast. The chef-recommended \u0027Coconut Yellow Curry Vegetable Pot\u0027 features carefully selected local organic vegetables and tofu simmered in a rich, smooth house-made coconut yellow curry. The tofu absorbs all the curry flavor and melts in your mouth, combining rich Southeast Asian spices with the natural sweetness of vegetables. Artfully presented, it is highly sought after by fine dining lovers and holidaymakers.", "name": "InterContinental Dameisha Resort - Plant-Based Dining", "transport": "Take Metro Line 8 to Dameisha Station, Exit A, about an 8-minute walk"}, {"address": "No. 102 Beishan Road, Yantian Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A cozy restaurant blending traditional Buddhist vegetarian cuisine with modern culinary techniques. Its specialty, \u0027Sweet and Sour Veggie Ribs\u0027, is skillfully crafted from lotus root and soy protein, coated in a signature sweet and sour sauce, and fried to golden perfection. Sweet, tangy, firm, and chewy, it recreates the texture of real ribs without any heavy feeling. With a comfortable, welcoming atmosphere filled with tea aroma, it\u0027s a hidden gem highly recommended by Yantian locals.", "name": "Putiyuan Vegetarian Restaurant", "transport": "Take Bus M205 to \u0027Beishan Lukou Station\u0027, then walk about 3 minutes"}, {"address": "No. 38 Jinrong Road, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A popular vegetarian spot in the Shatoujiao commercial district, specializing in healthy, low-oil, and low-salt dishes that showcase natural flavors. The iconic \u0027Emerald Tofu Pot\u0027 features handmade organic tofu paired with spinach juice and fresh mushrooms. The tofu is silky smooth and melts in your mouth, while the mushrooms lend a rich umami taste to the broth, creating a clean, well-rounded flavor. With a bright, clean atmosphere and affordable prices, it attracts many nearby office workers and is a top dining choice for tourists visiting Chung Ying Street.", "name": "Shushi Shuxin Vegetarian Restaurant", "transport": "Shenzhen Metro Line 8, Shatoujiao Station, Exit A, about a 600-meter walk"}, {"address": "No. 12 Tianxin East Road, Tianxin Community, Shatoujiao Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | Tucked away in the old street community of Shatoujiao, this charming vegetarian eatery focuses on traditional handmade dim sum and light meals. The house specialty, \u0027Handmade Mushroom Vegetarian Dumplings\u0027, features thin, springy wrappers loaded with minced shiitake mushrooms, wood ear mushrooms, and cabbage. Fresh vegetable juices burst forth with every bite, delivering a crisp, refreshing, light flavor. Paired with a bowl of rich \u0027Red Date \u0026 Tremella Soup\u0027\u2014thick, smooth, and gently sweet\u2014it is a favorite choice for afternoon tea or a healthy meal among locals and tourists alike.", "name": "Suxinge Healthy Vegetarian", "transport": "Shenzhen Metro Line 8, Shatoujiao Station, Exit B, about a 450-meter walk"}, {"address": "No. 26 Guangwu Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | An eco-friendly vegetarian buffet boasting a vast array of freshly prepared dishes. The crowd-favorite \u0027Freshly Pan-Fried Veggie Shredded Pancake\u0027 has a crisp, golden-brown crust with distinct chewy layers and a subtle wheat aroma. Pair it with house-made \u0027Organic Soy Milk\u0027 for a rich, velvety, and delightfully nutty experience. Its budget-friendly prices and healthy cooking make it a bustling spot packed daily with locals and visitors eager to experience local life.", "name": "Green Life Vegetarian Buffet", "transport": "Shenzhen Metro Line 8, Haishan Station, Exit C, about a 400-meter walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 101, Building 84, Haitao Garden, Donghe Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | The most famous street food in Shatoujiao, Yantian, perfect for breakfast or late-night snacks! Made from high-quality rice ground fresh daily, the steamed rice rolls are paper-thin yet springy, with a silky smooth texture. Stuffed with fresh minced pork and egg, and drizzled with a sweet, savory secret soy sauce and chili paste, every bite bursts with rich rice aroma and savory juices. Soft, tender, and mouthwatering, it\u0027s a classic grab-and-go treat worth queuing for!", "name": "Deng\u0027s Traditional Rice Rolls", "transport": "Metro Line 8 Shatoujiao Station, Exit A, about an 8-minute walk"}, {"address": "No. 2015 Shenyan Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A wildly popular cold street snack in Shatoujiao Old Street! Premium Sanhuang chicken with crispy skin and tender meat is skillfully hand-shredded and tossed with secret fragrant sesame oil, roasted sesame seeds, scallions, and crunchy crushed peanuts. The skin is bouncy and snappy, while the chicken remains succulent and juicy with a subtle numbing spice. Perfect for grabbing as a savory snack while strolling along the coast.", "name": "Runfaji Hand-Shredded Chicken", "transport": "Metro Line 8 Haishan Station, Exit A1, about a 6-minute walk"}, {"address": "Yantian Pedestrian Street, Sanyuehua Road, Yantian Sancun, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Located at the Yantian Night Market\u2014one of Shenzhen\u0027s longest night markets\u2014these charcoal-grilled oysters are the ultimate star. Fresh daily oysters are grilled to order over charcoal and topped with a generous layer of fragrant, golden garlic sauce. Plump, juicy, and buttery smooth, each bite bursts with savory garlic and smoky charcoal flavors balanced by the natural ocean brininess, captivating foodies every night.", "name": "Yantian Night Market - Charcoal-Grilled Garlic Oysters", "transport": "Metro Line 8 Yantian Road Station, Exit D, about a 10-minute walk"}, {"address": "Near the intersection of Anjie Street and Jinrong Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A nostalgic, traditional Cantonese street dessert packed with childhood memories! Steamed in small porcelain bowls, these rice cakes come in classic flavors like red bean, coconut, chocolate, and sesame. Translucent, chewy, and non-sticky, they carry a subtle sweetness from cane sugar and pure rice. Skewered on two bamboo sticks, it\u0027s an easy-to-eat street sweet loved by tourists and locals alike.", "name": "Shatoujiao Old Street Traditional Put Chai Ko (Steamed Rice Cakes)", "transport": "Metro Line 8 Shatoujiao Station, Exit B, about a 7-minute walk"}, {"address": "No. 105 Yanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | The iconic street food delicacy of Dameisha Beach! The takeaway window serves piping hot roast pigeon freshly out of the oven. The skin is golden-red and chip-thin crispy, while the tender meat inside locks in savory juices. Tearing it open releases a burst of juicy flavor\u2014crispy on the outside, tender on the inside, perfectly seasoned, and a must-buy snack when heading to the Dameisha seaside.", "name": "Dameisha Wugufang - Crispy Roast Pigeon Takeaway Stand", "transport": "Metro Line 8 Dameisha Station, Exit A, about a 5-minute walk"}, {"address": "No. 46 Haitao Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A vibrant stall combining classic Hong Kong-style desserts and fried street skewers! The signature Mango Pomelo Sago is rich and creamy, featuring smooth sago, sweet-and-sour mango, and juicy pomelo pulp. The skewers, cooked fresh to order, feature crispy-on-the-outside fish balls and fried tofu coated in special curry or sweet chili sauce. A delightful mix of sweet and savory, perfect for an afternoon stroll along the Shatoujiao Boardwalk.", "name": "Liao\u0027s Hong Kong Desserts \u0026 Skewers", "transport": "Metro Line 8 Haishan Station, Exit B, about a 5-minute walk"}, {"address": "Night Market Stalls, Intersection of Donghai 3rd Road and Mingzhu Avenue, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | Authentic Teochew street treats full of traditional flavor! The radish cake (Caitou Guo) is pan-fried on a griddle until golden and crispy on both sides, bursting with the aromas of radish and dried shrimp. The herbal grass jelly (Cao Guo) is smooth and silky, dusted with sugar powder and toasted sesame seeds for a cool, bittersweet finish. This classic pairing of savory and sweet is a top favorite for local night owls.", "name": "Yantian Port Night Market - Teochew Radish Cake \u0026 Herbal Jelly", "transport": "Metro Line 8 Yantian Road Station, Exit E, about a 12-minute walk"}, {"address": "Snack Plaza next to Seaside Park, Yanmei Road, Xiaomeisha, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | The most popular grilled seaside snack in Xiaomeisha! Whole fresh squids are seared on a hot teppan griddle and brushed with a secret rich, sweet-and-spicy seafood sauce and cumin. The squid is thick, snappy, chewy, and tender, imbued with subtle smokiness and sweet natural juices. Enjoying this steaming skewer while taking in the sea view makes for the ultimate beach stroll companion.", "name": "Xiaomeisha Seaside - Saucy Grilled Squid Skewers", "transport": "Metro Line 8 Xiaomeisha Station, Exit A, about a 3-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dameisha, Xiaomeisha and Shatoujiao, Yantian"}};
        const themeHex = "#1e3a8a";
        const cityName = "Shenzhen";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
