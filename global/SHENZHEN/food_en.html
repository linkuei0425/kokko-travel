irectly connects to Uniwalk Shopping Center."}, {"address": "No. 136 Baomin 1st Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.4 stars | A famous eatery dedicated to traditional Lingnan charcoal-cooked claypot rice. The signature \u0027Dual Preserved Meat Claypot Rice\u0027 features a golden, fragrant, and extra-crispy rice crust at the bottom. The rice absorbs the savory oils of Cantonese sausages, creating a rich, deeply satisfying nostalgic dish.", "name": "Wenheji Cantonese Claypot Rice", "transport": "Take Shenzhen Metro Line 12 to \u0027Lingzhi Station\u0027 (Exit A1) and walk for about 10 minutes."}, {"address": "Bao\u0027an Garden Shops, Haixiu Road, Bao\u0027an Center District, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.3 stars | A classic Teochew casserole porridge shop carrying on the tradition of slow-simmered raw rice. Fresh live mud crabs and prawns are cooked to order, creating a thick, velvety porridge base steeped in the sweet essence of seafood. Enhanced with savory preserved mustard greens and celery, every bite is delightfully savory.", "name": "Xuanji Teochew Casserole Porridge", "transport": "Take Shenzhen Metro Line 5 to \u0027Baohua Station\u0027 (Exit A) and walk for about 7 minutes."}, {"address": "No. 163 Jia\u0027an Village, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | A hidden traditional handmade dessert shop tucked away in Bao\u0027an\u0027s old town. The signature \u0027Coconut Milk Golden Cake\u0027 reveals a distinct honeycomb pattern when warmed up, offering a soft, springy texture with aromatic coconut and subtle fermentation notes. Perfectly sweet without being heavy, it\u0027s a beloved local comfort food.", "name": "Dongji Golden Cake \u0026 Dessert", "transport": "Take Shenzhen Metro Line 1 to \u0027Xin\u0027an Station\u0027 (Exit C) and walk for about 9 minutes."}, {"address": "No. 258 Jian\u0027an 1st Road, Bao\u0027an Center District, Bao\u00 spicy, savory, and perfect with rice. The \u0027Claypot Wild Mushroom Rice\u0027 features crispy rice crust with the rich aroma of wild mushrooms fully infused into every grain. Warm, hospitable service and heart-warming dishes make guests feel right at home.", "name": "Putixin Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 11 to Bao\u0027an Station, Exit B, and walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Yantian Street, Xixiang Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 stars | One of Shenzhen\u0027s largest street night markets, boasting hundreds of unique food stalls. The highlights are the Zhanjiang garlic grilled oysters stir-fried over high flames and Hunan garlic-spicy grilled cold noodles (Kao Leng Mian). The oysters are plump, juicy, and silky smooth, bursting with garlic and charred aromas. The grilled cold noodles are crispy on the outside, chewy on the inside, and drenched in a sweet, sour, and spicy sauce that keeps you coming back for more. Whether for locals grabbing late-night bites or tourists visiting for the experience, it offers the most authentic and vibrant street food atmosphere.", "name": "Xixiang Yantian Night Market", "transport": "Take Shenzhen Metro Line 1 to Xixiang Station, Exit A, and walk about 800 meters."}, {"address": "Building Area 14, Jia\u0027an Village, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Tucked away in an urban village near Bao\u0027an Central District, this nostalgic stall serves signature peanut tofu pudding ground from fresh peanuts and soybeans. Exceptionally dense and smooth, it packs a rich nutty and soybean aroma. The syrup is perfectly sweet without being cloying, making it an ultimate refreshing treat when chilled. Topped with freshly fried crispy taro balls and red beans, its rich textures create an unforgettable bite\u2014highly recommended by local neighbors and young foodies alike.", "name": "Dong\u0027s Peanut Tofu Pudding (Jia\u0027an Village)", "transport": "Take Shenzhen Metro Line 5 to Fanshen Station, Exit C, and walk about 600 meters."}, {"address": "B2, Uniwalk Shopping Mall, No. 99 Xinhu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.8 stars | A nationwide viral street bakery famous for its endless queues. The must-try \u0027Seaweed Pork Floss Cake\u0027 features a fluffy cake core packed with rich signature salad dressing, coated in a thick layer of savory pork floss and crispy seaweed. Every bite offers a rich interplay of sweet and savory flavors\u2014a delicious calorie bomb that is utterly addictive. It\u0027s an unmissable walk-around snack and souvenir when shopping at Bao\u0027an Uniwalk.", "name": "Bao Master (Bao\u0027an Uniwalk Branch)", "transport": "Take Shenzhen Metro Line 1 or Line 5 to Bao\u0027an Center Station, Exit F, which leads directly to Uniwalk B2."}, {"address": "No. 109 Xin\u0027an 2nd Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | A decade-old time-honored herbal tea and dessert shop in Bao\u0027an, preserving traditional Cantonese street snack flavors. The signature \u0027Secret Double-Skin Water Buffalo Milk Pudding\u0027 uses high-fat water buffalo milk, resulting in a lightly crinkled top skin, vibrant milky aroma, and a silky smooth texture with balanced sweetness. Pair it with traditional herbal jelly or hot curry fish balls for a perfect blend of sweet and savory\u2014the ultimate spot to experience old Bao\u0027an\u0027s heritage dessert culture.", "name": "Baicaotang Traditional Herbal Tea \u0026 Snacks", "transport": "Take Shenzhen Metro Line 12 to Xin\u0027an Park Station, Exit C1, and walk about 500 meters."}, {"address": "B1, Qianhai MixC, No. 169 Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.9 stars | A phenomenal artisanal tea and handmade snack shop in South China, emphasizing on-site preparation and natural ingredients. The signature handmade taro paste with rice mochi uses Lipu taro from Guangxi, steamed and mashed fresh daily, combined with stretchy hand-beaten rice mochi and rich fresh milk. Lightly sweet and deeply fragrant, every sip delivers a delightful blend of real taro bits and chewy mochi, wildly popular among young tourists and boba tea lovers.", "name": "Ah Ma Handmade (Qianhai MixC)", "transport": "Take Shenzhen Metro Line 9 to Tinghai Avenue Station, Exit A, which leads directly to Qianhai MixC."}, {"address": "Inside Jia\u0027an Village, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | A budget-friendly food stall in Bao\u0027an\u0027s urban village, beloved by local students and office workers. Made-to-order fried skewers are the main event; the signature fried rice cakes feature a golden crispy exterior and soft, stretchy interior, brushed with a secret house sauce (a mix of sweet chili and spicy cumin sauce). Other favorites include fried sausage, chicken cutlets, and cauliflower, making it an aromatic, mouthwatering top pick for late-night street food on the go.", "name": "Mojia Skewers (Jia\u0027an Village)", "transport": "Take Shenzhen Metro Line 5 to Fanshen Station, Exit C, and walk about 650 meters."}, {"address": "Inside Oh Bay, Intersection of Haitian Road and Baohua Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Located right beneath the Bao\u0027an Ferris Wheel, this vibrant coastal cultural and food market offers a modern, resort-like vibe. It gathers a variety of signature walk-and-eat snacks, such as freshly made Hong Kong-style bubble waffles\u2014crispy on the outside, fluffy and soft inside with rich egg and milk aromas\u2014as well as refreshing coconut jelly and seared cheese hotdog skewers. Enjoy high-quality street food while taking in breathtaking ocean views of Qianhai Bay and evening light shows.", "name": "Oh Bay Coastal Market Snack Stalls", "transport": "Take Shenzhen Metro Line 5 to Linhai Station, Exit B2, right outside the exit."}, {"address": "B1, Uniwalk Shopping Mall, No. 99 Xinhu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 stars | A popular traditional Chinese palace pastry shop filled with the aroma of freshly baked treats. Highlights include the signature \u0027Crispy Beef Cake\u0027 and \u0027Sesame Walnut Pastry\u0027. The walnut pastry is impossibly melt-in-your-mouth crumbly, rich with sesame and genuine butter aroma, while the beef cake boasts a golden crispy crust with a savory, juicy beef filling spiced with subtle pepper. Its traditional sweet-and-savory profile is a hit among adults, kids, and tourists alike.", "name": "Wu Su Sheng Chinese Pastry (Uniwalk)", "transport": "Take Shenzhen Metro Line 1 or Line 5 to Bao\u0027an Center Station, Exit F, which leads directly to Uniwalk."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Bao\u0027an Center and Qianhai"}, "dapeng_peninsula": {"categories": {"cat_1": {"items": [{"address": "No. 20 Chengdong Street, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.6 stars | Located right at the main entrance of the 600-year-old Dapeng Fortress, this classic antique-style establishment is an absolute must-visit on the Dapeng Peninsula. The signature \u0027Pengcheng General Duck\u0027 features premium duck slow-braised with traditional Chinese herbs, yielding tender, flavor-infused meat rich in savory sauce. Paired with silky, chewy \u0027Dapeng Lai Fun\u0027 (rice noodles) and \u0027Hakka Stuffed Tofu\u0027 (crispy on the outside, tender inside), it offers a rich layering of textures. The quaint wooden decor transports diners back in time, making it a favorite among tourists and veteran Shenzhen locals alike.", "name": "Pengcheng Restaurant", "transport": "Take Bus E11 or M471 to \u0027Dapeng Fortress Station\u0027, then walk for about 3 minutes."}, {"address": "No. 15 Jiaochangwei Road, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.5 stars | A well-known classic seafood restaurant near Jiaochangwei Beach, famous for its signature \u0027Nan\u0027ao Sea Urchin Fried Rice\u0027. The rice grains are perfectly distinct, delivering rich, sweet sea urchin and savory egg flavor in every bite without being greasy. All seafood is freshly caught daily; the salt-and-pepper mantis shrimp is firm and springy, while the stir-fried squid with rich sauce is tender and refreshing. It is the top choice for seafood lovers visiting Jiaochangwei.", "name": "Pengcheng Renjia Seafood Restaurant", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027, then walk for about 5 minutes."}, {"address": "No. 18 Haibin South Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.4 stars | A classic street food shop representing Nan\u0027ao\u0027s intangible cultural heritage. Fresh sea urchin roe, marinated pork belly, and glutinous rice are wrapped in bamboo leaves and steamed to perfection. Unwrapping the leaf releases an irresistible aroma; the rice absorbs the ocean sweetness of sea urchin and rich savory pork fat, resulting in a soft, fragrant, and savory delicacy. A unique coastal flavor combination, it\u0027s a must-buy souvenir and culinary classic in Dapeng.", "name": "A Ke Sea Urchin Rice Dumplings", "transport": "Take Bus E11 or 833 to \u0027Nan\u0027ao Yueliangwan Station\u0027, then walk for about 4 minutes."}, {"address": "No. 12 Inner East Street, Dapeng Fortress, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.3 stars | Hidden in an ancient alley inside Dapeng Fortress, this traditional Hakka private kitchen recreates the cozy, sumptuous banquets of a historical general\u0027s residence. The signature \u0027Hakka Braised Pork\u0027 uses pork belly slow-simmered until melt-in-your-mouth tender\u2014rich yet not greasy, with a sauce that goes amazingly well with rice. The \u0027Kiln-Baked Chicken\u0027 features crispy skin, juicy meat, and a distinct wood-fired aroma. Its historical atmosphere and crafted artisanal dishes mesmerize foodies from all over.", "name": "Jiangjun Fu Private Kitchen", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027, enter the fortress\u0027s East Street, and walk for about 2 minutes."}, {"address": "No. 28 Haibin Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.5 stars | A staple waterfront seafood establishment in Nan\u0027ao Town for decades, perfectly located next to the pier for first-hand fresh catches. The signature \u0027Steamed Wild Sea Fish\u0027 highlights the fish\u0027s natural sweet flavor and delicate texture, while the \u0027Salt and Pepper Mantis Shrimp\u0027 features a crispy shell and juicy, plump meat. The open-air dining area offers panoramic views of the blue ocean, allowing you to enjoy authentic seafood feasts in the ocean breeze\u2014a popular hotspot for local gatherings and tourist check-ins.", "name": "Nan\u0027ao Seafood Harbor Restaurant", "transport": "Take Bus E11 to \u0027Nan\u0027ao Grand Hotel Station\u0027, then walk for about 3 minutes."}, {"address": "No. 7 Nanmen Street, Dapeng Fortress, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.2 stars | A classic handmade snack shop on South Gate Street of Dapeng Fortress, carrying on the long-standing artisanal pastry culture of the Dapeng Peninsula. The classic \u0027Dapeng Turnip Dumpling (Caitoujiao)\u0027 features a chewy crust filled with flavorful shredded radish and minced mushrooms; the traditional \u0027Fevervine Cake (Jitengtengbing)\u0027 offers a soft, glutinous texture with subtle herbal notes. Bursting with nostalgic childhood flavors, it is highly favored by visitors who love traditional folk foods.", "name": "Pengcheng Traditional Snack Shop", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027, enter through the South Gate, and walk for about 1 minute."}, {"address": "No. 168 Buxin Road, Dapeng Subdistrict, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.6 stars | An immensely popular wood-fired kiln-baked chicken restaurant in Dapeng. Featuring free-range local chickens marinated in special spices, wrapped in tin foil, and baked in high-temperature brick kilns. Fresh out of the kiln, the chicken boasts golden, crispy skin; tearing it open bursts juicy savory goodness, with amazingly tender meat infused with smoky wood aromas. Paired with house dipping sauce and stir-fried Hakka wild greens, it\u0027s a must-try local delicacy for outdoor trips to Dapeng.", "name": "Jiucun Kiln Baked Chicken", "transport": "Take Bus M274 or 833 to \u0027Buxin Community Station\u0027, then walk for about 5 minutes."}, {"address": "No. 108 Shuitou Seafood Street, Dapeng New District, Shenzhen City", "feature": "\u2b50 4.4 stars | A renowned restaurant on Shuitou Seafood Street, famous for cook-to-order fresh catches, transparent pricing, and authentic cooking techniques. The \u0027Steamed Scallops with Garlic and Vermicelli\u0027 are juicy, sweet, and bursting with garlic aroma; the \u0027Steamed Egg Custard with Sea Urchin\u0027 has a velvety smooth texture, seamlessly blending rich sea urchin sweetness with savory egg. With a lively atmosphere and charming fishing-village vibe, it\u0027s an excellent choice for savoring local seafood and traditional Hakka dishes.", "name": "Shuitou Fisherman Restaurant", "transport": "Take Bus M321 or M274 to \u0027Shuitou Seafood Street Station\u0027, then walk for about 2 minutes."}], "name": "Local Traditional Favorites"}, "cat_2": {"items": [{"address": "No. 31 Nanmen Street, Dapeng Fortress, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 stars | Tucked deep within an ancient alley of Dapeng Fortress inside a blue-brick heritage home, this cafe blends Ming and Qing architectural charm with modern specialty coffee craft. The signature pour-over coffee uses high-quality light roast beans, featuring bright floral-fruity acidity and a lingering sweet aftertaste. Pair it with freshly baked artisanal Basque cheesecake\u2014rich, dense, and perfectly balanced without being overly sweet. Tourists and local youths love sitting in the courtyard, sipping coffee while soaking in the peaceful aura of centuries of history.", "name": "Pengcheng Coffee", "transport": "Take Bus M471 or M457 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk for about 3 minutes."}, {"address": "Binhai Road, Yangmuzhang Village, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.8 stars | Situated along the Nan\u0027ao coast, offering front-row views of stunning glass-green sea waters. Designed with a Mediterranean resort vibe, this oceanfront brunch spot features the must-try \u0027Sea Salt Caramel Latte\u0027 with delicate, velvety foam and an amazing balance of sweet and salty flavors. The \u0027Aussie All-Day Brunch\u0027 comes packed with pan-fried bacon, sunny-side-up eggs, sourdough bread, and fresh avocado\u2014hearty and delightfully aromatic. Enjoying brunch on the outdoor terrace with a cool ocean breeze is the ultimate soul-soothing experience.", "name": "Acanala Glass Sea Cafe", "transport": "Recommended to travel by car or taxi. Alternatively, take Bus E11 to \u0027Nan\u0027ao Office Station\u0027 (\u5357\u6fb3\u8fa6\u4e8b\u8655\u7ad9) and transfer to a local shuttle."}, {"address": "No. 33 Haibin South Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.7 stars | Perched on a cliff by the sea in Nan\u0027ao, this pure white building embodies the ultimate romantic Greek Santorini style. The signature \u0027Iced Coconut Americano\u0027 is crisp and refreshing, perfectly blending natural coconut sweetness with rich espresso notes. Pair it with hot, freshly baked waffles served with special whipped cream\u2014crispy outside, soft inside, with a rich milky aroma. With breathtaking views of the ocean meeting the sky and exquisite dishes, it is the most popular Instagram-worthy brunch destination on the Dapeng Peninsula.", "name": "Meet Yue Santorini Cafe", "transport": "Take Express Bus E11 to \u0027Nan\u0027ao Health Center Station\u0027 (\u5357\u6fb3\u885b\u751f\u6240\u7ad9), then walk or take a 5-minute taxi ride."}, {"address": "No. 9 Jiaochangwei Road, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Located right on the Jiaochangwei beach coastline, featuring a spacious outdoor beach dining area. The signature \u0027Cold Brew Oat Latte\u0027 is ultra-smooth, lingering with nutty oat aromas and rich coffee flavor. The \u0027English Sandwich Brunch\u0027 uses crispy baguettes stuffed with smoked salmon and special house sauce for rich layers of texture. Many visitors love sitting on seaside chairs in the morning or dusk, enjoying a fine breakfast while gazing at the glistening ocean.", "name": "Cape No. 9 Seaview Cafe", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027 (\u8f03\u5834\u5c3e\u7ad9), walk through the B\u0026B street for about 5 minutes to reach the beachfront."}, {"address": "No. 51 Jiaochangwei Haibin Road, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Situated front row along the Jiaochangwei coast, featuring a Japanese retro wooden aesthetic combined with spectacular ocean views. The store-exclusive \u0027Brown Sugar Boba Latte\u0027 perfectly combines freshly cooked chewy brown sugar boba with rich milk\u2014sweet but not cloying. Pair it with a freshly made \u0027American Pancake Platter\u0027\u2014crispy on the outside, fluffy inside, served with vanilla ice cream and fresh fruit. Whether for taking photos or simply gazing at the sea, this is a stylish cafe you can\u0027t miss on the Dapeng Peninsula.", "name": "Amos Seaview Cafe", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027 (\u8f03\u5834\u5c3e\u7ad9) and walk toward the shoreline for about 6 minutes to find it."}, {"address": "No. 28 Jiaochangwei Haibin Road, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 stars | Bringing an Impressionist oil-painting garden to the seashore, this cafe is filled with floral decorations and romantic artistic vibes. The signature \u0027Rose Oat Latte\u0027 features delicate floral undertones with rich milkiness, incredibly smooth on the palate. The \u0027French Toast Brunch\u0027 features thick toast soaked in egg batter and pan-fried to golden perfection, drizzled with pure maple syrup and sprinkled with crushed nuts\u2014crispy outside, melt-in-your-mouth tender inside. Its relaxed and elegant atmosphere is hugely popular among female tourists and couples.", "name": "Monet Garden Seaview Cafe", "transport": "Take Bus M457 or M471 to \u0027Jiaochangwei Station\u0027 (\u8f03\u5834\u5c3e\u7ad9) and walk about 4 minutes to enter the coastal pedestrian street."}, {"address": "No. 12 Dongmen Street, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Tucked away near Dapeng Fortress, this hipster-style cafe features minimalist cloud-themed decor and handcrafted specialty drinks. The signature \u0027Marshmallow Cloud Coffee\u0027 serves steaming latte under a slowly melting marshmallow, delivering a delightful visual and taste experience. The \u0027Handmade Caramel Pudding\u0027 is silky smooth with a balanced sweet-bitter caramel, rich egg flavor, and natural vanilla bean aroma. This cozy touch of modernity within an ancient neighborhood attracts many hipster travelers seeking fresh discoveries.", "name": "A Cloud Coffee", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027 (\u5927\u9d6c\u6240\u57ce\u7ad9) and walk through the East Gate into the ancient town for about 2 minutes."}, {"address": "Inside Longcheer Yacht Club, No. 1 Xinxi Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.7 stars | Situated beside the luxurious Judisha yacht marina, offering unobstructed blue sea views and glamorous yacht scenery. The signature \u0027Pour-Over Specialty Geisha Coffee\u0027 carries elegant floral scents and citrus acidity, with an exquisitely rich layer of flavors. The \u0027German Eggs Benedict Brunch\u0027 pairs poached eggs with seared ham and rich hollandaise sauce\u2014bursting the egg yolk brings pure satisfaction. This is the top choice for indulging in high-end oceanfront brunch and premium coffee.", "name": "Longcheer Yacht Club Cafe \u0026 Brunch", "transport": "Take Bus M274 to \u0027Langqi Station\u0027 (\u6d6a\u9a0e\u7ad9) and walk for about 3 minutes to enter the yacht club area."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 79 Dapeng Fortress Main Street, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 Stars | A century-old style establishment located in the heart of Dapeng Fortress, recreating the Lingnan architectural style of the Ming and Qing Dynasties. Famous for classic Dapeng Hakka cuisine and the \u0027General\u0027s Banquet\u0027, a must-try is the \u0027Hakka Stuffed Tofu\u0027, featuring a golden-seared outer layer, tender silky tofu, and delicious meat filling. The \u0027Dapeng Rice Noodles\u0027 are chewy and smooth with a rich, aromatic broth, perfectly carrying on the rustic flavor of the local heritage residences\u2014an authentic staple for any visitor.", "name": "Pengcheng Restaurant", "transport": "Take Bus M471 or M457 to \u0027Dapeng Fortress Station\u0027, then walk for about 3 minutes."}, {"address": "No. 26 Jiaochangwei Road, Dapeng New District, Shenzhen (Near Jiaochangwei Beach)", "feature": "\u2b50 4.5 Stars | A renowned local seafood restaurant adjacent to Jiaochangwei Beach, famous for fresh catches and authentic Dapeng flavors. Highly recommended is their signature \u0027Nan\u0027ao Sea Urchin Fried Rice\u0027, featuring distinct rice grains coated in golden sea urchin and egg, delivering a sweet, fragrant, and layered taste. The \u0027Steamed Grouper\u0027 offers firm and bouncy meat, perfectly capturing the original flavors of a coastal town\u2014ideal for family and friend gatherings.", "name": "Pengcheng Renjia Seafood Restaurant", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027, then walk for about 5 minutes."}, {"address": "No. 12 South Gate East Lane, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 Stars | Located beside the historical monuments of Dapeng Fortress, this restaurant seamlessly merges the general\u0027s residence culture with traditional Hakka cuisine. The specialty dish \u0027General\u0027s Duck\u0027 is slow-simmered for hours, resulting in fall-off-the-bone tender meat infused with a rich, savory sauce that pairs perfectly with steaming hot rice. The house-made \u0027Red Vinasse Pork\u0027 is enticingly colored, rich without being greasy, and full of local charm.", "name": "General\u0027s Mansion Hakka Restaurant", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027, enter through the South Gate, and walk for about 2 minutes."}, {"address": "Inside Longcheer Yacht Club, No. 88 Xindong Road, Xinda Community, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.7 Stars | An upscale ocean-view bistro located along Dongshan Bay on the Dapeng Peninsula, offering unbeatable 270-degree views of the azure sea and a luxurious yacht marina. Focusing on refined seafood Western cuisine and craft cocktails, the signature \u0027Pan-Seared Bluefin Tuna Steak\u0027 is crispy on the outside and tender inside. Paired with special pesto and refreshing signature cocktails, guests can enjoy a relaxed, tipsy night breeze\u2014a popular dating spot highly favored by couples and influencers.", "name": "Longcheer Yacht Club Ocean Bistro", "transport": "Driving or taking a taxi is recommended; alternatively, take Bus M274 to \u0027Langqi Station\u0027 and walk to the destination."}, {"address": "Inside Manjinghua Yixiang iTown, No. 106 Kuipeng Road, Kuichong Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 Stars | Converted from an old printing and dyeing factory, this industrial-style art district bistro merges vintage architecture with modern craft beer culture. It offers a variety of local Shenzhen craft beers and American light bites. The classic \u0027Handcrafted Beef Burger\u0027 is juicy and thick; paired with the rich floral-fruity aroma and slightly bitter malt taste of \u0027Dapeng IPA Craft Beer\u0027, it creates a thoroughly satisfying experience loved by hipsters and international visitors alike.", "name": "iTown Art District Craft Bistro", "transport": "Take Bus M357 or M457 directly to \u0027Yixiang iTown Station\u0027."}, {"address": "No. 50 Haibin Road, Jiaochangwei, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 Stars | A tropical-style bistro located right on the beachfront of Jiaochangwei B\u0026B Town, featuring open-air beach seating and an illuminated stage. Specializing in Southeast Asian seafood BBQs and tropical fruit cocktails, the must-try \u0027Thai Lemongrass Grilled Shrimp\u0027 is aromatic, sweet, and snappy. Live singers perform at night, creating an insanely romantic vibe accompanied by fine drinks and the sound of crashing waves.", "name": "Jiaochangwei Wave Bistro \u0026 Bar", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027, then walk to the front line of the beach."}, {"address": "No. 42 Haibin Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 Stars | A specialty restaurant dedicated to local Nan\u0027ao sea urchins and authentic seafood dishes on the Dapeng Peninsula, highly recommended by local foodies. The most popular \u0027Steamed Egg with Sea Urchin\u0027 is silky smooth, seamlessly melting sweet sea urchin and rich egg flavors on your tongue. The \u0027Salt \u0026 Pepper Bombay Duck Fish\u0027 has a crispy, spicy exterior with fish meat that melts in your mouth, perfectly displaying the lively street-food charm of Shenzhen\u0027s Dapeng Peninsula.", "name": "Nan\u0027ao Sea Urchin \u0026 Seafood Restaurant", "transport": "Take Bus E11 or M274 to \u0027Nan\u0027ao Power Supply Station\u0027, then walk for about 4 minutes."}, {"address": "Ling\u0027ao Village Entrance, Pengfei Road, Dapeng New District, Shenzhen (Near Dapeng Fortress)", "feature": "\u2b50 4.4 Stars | An authentic rustic local restaurant nestled at the foot of the Dapeng Peninsula mountains, famous for baking free-range chicken using traditional mud kilns and firewood. The \u0027Traditional Kiln-Baked Chicken\u0027 uses select local free-range chicken wrapped in secret herbal spices and lotus leaves, sealed and baked in a high-temperature mud kiln. The skin turns golden and glossy, while the meat remains juicy, tender, and infused with a rich woody aroma\u2014bursting with juice when torn apart. It\u0027s a signature delicacy you can\u0027t miss when visiting Dapeng.", "name": "Dapeng Traditional Kiln Chicken Village", "transport": "Take Bus M471 to \u0027Ling\u0027ao Village Station\u0027, then walk for about 2 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Dongshan Temple, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 stars | A classic vegetarian dining hall nestled within Dongshan Temple near Dapeng Ancient City, famous for its fresh organic vegetarian dishes and traditional handcrafted soy products. Highly recommended are the \"Luohan Zhai\" (Arhat\u0027s Delight) and \"Handmade Vegetarian Tofu\". The tofu features a lightly golden, crispy exterior with a soft, rich interior, paired with a custom plant-based sauce for a rich yet refreshing texture. The peaceful and serene temple environment attracts numerous visitors seeking worship and spiritual peace.", "name": "Dongshan Temple Vegetarian Hall", "transport": "Take Bus M471 to \"Dongshan Temple\" station, then walk for about 3 minutes."}, {"address": "No. 18 Nanmen Street, Dapeng Fortress, Pengcheng Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Located within the ancient architectural complex of Dapeng Fortress, blending quaint Ming and Qing dynasty architecture with modern healthy plant-based dining concepts. The signature \"Black Truffle \u0026 Wild Mushroom Pot\" uses a variety of locally handpicked fresh wild mushrooms\u2014tender, juicy, and infused with a rich black truffle aroma. The restaurant is dedicated to using no artificial colors or refined seasonings, preserving the original flavors of the ingredients, making it a favorite among light-meal lovers and cultural enthusiasts.", "name": "Dapeng Fortress Zen Vegetarian Restaurant", "transport": "Take Bus M362 or M471 to \"Dapeng Fortress\" station, enter the fortress and walk for about 5 minutes."}, {"address": "Inside Guanyin Mountain Park, Buxin Community, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Situated adjacent to Dapeng Guanyin Mountain Park, offering an elegant setting surrounded by mountains and waters. It specializes in traditional Hakka-style plant-based cuisine, notably the \"Hakka Stuffed Vegetarian Bitter Melon\" and \"Handmade Yam Cake\". The bitter melon is sweet without harsh bitterness, stuffed with mushrooms and soy ingredients for a soft, juicy, and lingering sweet finish. Many hikers and locals make a special trip here to enjoy a light, wholesome, and burden-free vegetarian meal after exploring the mountain.", "name": "Guanyin Mountain Vegetarian Restaurant", "transport": "Take Bus M274 or M457 to \"Guanyin Mountain\" station, then walk along the hiking trail for about 8 minutes."}, {"address": "No. 52 Jiaochangwei Road (Inside Jiaochangwei Coastal Scenic Area), Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Located in the Jiaochangwei coastal B\u0026B area, featuring a casual dining experience that combines ocean views with plant-based cuisine. Its signature dish, \"Emerald Bamboo Fungus Vegetarian Bird\u0027s Nest\", has a silky, smooth texture with a delicate bamboo leaf fragrance and subtle broth sweetness. Another hit, \"Crispy Coconut Vegetarian Chops\", is crispy on the outside, tender inside, and bursting with rich coconut aroma. The romantic seaside vibe and light gourmet food make it a trendy check-in spot for young hipsters and coastal tourists.", "name": "Jiaochangwei Shanhai Suxin Vegetarian Restaurant", "transport": "Take Bus M471 to \"Jiaochangwei\" station, then walk toward the beach for about 6 minutes."}, {"address": "No. 8 Yingbin Road, Guanhu Community, Kuichong Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | A tranquil teahouse that perfectly blends Zen tea culture with high-end wellness vegetarian cuisine. Its \"Matsutake \u0026 Bamboo Shoot Soup\" features a rich, sweet broth, crisp bamboo shoots, and a mouth-filling woody matsutake aroma. Paired with specially crafted egg- and dairy-free tea snacks, the texture is delicate and soft. Scholars, artists, and visitors seeking mental relaxation highly praise the tranquil atmosphere and exquisite dishes.", "name": "Yunshui Chanxin Vegetarian \u0026 Tea House", "transport": "Take Bus M457 to \"Guanhu Village\" station, then walk for about 5 minutes."}, {"address": "No. 36 Shuitousha Village, Nan\u0027ao Community, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.2 stars | Hidden in the lush mountains of Nan\u0027ao, this eco-vegetarian restaurant highlights organic fresh vegetables straight from its own farm. The \"Rainbow Fruit \u0026 Veggie Warm Salad\" with custom sesame dressing offers crisp, sweet veggies that are wonderfully refreshing. The \"Basil Stir-Fried King Oyster Mushrooms\" delivers intense basil aroma and a satisfyingly chewy texture similar to abalone, making it extremely appetizing with rice. The comfortable outdoor garden seating lets tourists enjoy a pure vegetarian feast nestled between mountains and sea.", "name": "Nan\u0027ao Green Wilderness Vegetarian Restaurant", "transport": "Take Bus E11 or M274 to \"Nan\u0027ao Shuitousha\" station, then walk for about 7 minutes."}, {"address": "No. 68 Zhongshan Road (Next to the West Gate of the Ancient City), Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Located near the Dapeng Ancient City cultural area, this restaurant attracts many vegetarian enthusiasts with its warm, minimalist wooden decor. The signature \"Thai Sour and Spicy Vegetarian Sea Cucumber\" is crafted from konjac and natural plant collagen, offering a springy texture and an appetizing sour-spicy flavor that young diners love. The \"Pumpkin \u0026 Taro Claypot\" is rich, creamy, and melts in your mouth. With affordable prices and generous portions, it is a great spot to recharge after touring the ancient city.", "name": "Yuanshe Health Vegetarian Restaurant", "transport": "Take Bus M471 or M362 to \"Dapeng Ancient City\" station, then walk for about 4 minutes."}, {"address": "No. 1 Shengtaiyuan Road, Baguang Community, Kuichong Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Situated next to the Dapeng Peninsula Agricultural Eco-Park, emphasizing a zero-distance organic farm-to-table experience. Popular dishes include the \"Wholesome Five-Grain Rice\" and \"Vegetarian Lion\u0027s Head in Golden Broth\". The lion\u0027s head is crafted from tofu, water chestnuts, and plant-based meat, delivering a solid bite with the crunchy sweetness of water chestnuts, perfectly complimented by the rich golden broth. Its immense popularity stems from its commitment to natural freshness and healthy living.", "name": "Baicaoyuan Organic Vegetarian Restaurant", "transport": "Take Bus B983 to \"Baguang Exhibition Hall\" station, then walk for about 10 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 18 Zheng Street, Dapeng Fortress, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | One of the most iconic traditional street foods on the Dapeng Peninsula, this sea urchin rice dumpling blends freshly harvested sea urchin meat, pork belly, and glutinous rice. With every bite, the soft and sticky outer rice combines perfectly with the sweet sea urchin and savory pork fat. Rich, savory, and brimming with oceanic freshness, it\u0027s a piping hot snack that tourists must grab while strolling through Dapeng Fortress.", "name": "Pengcheng Old Street Sea Urchin Rice Dumpling", "transport": "Take Bus M471 to Dapeng Fortress Station, then walk for about 3 minutes."}, {"address": "No. 5 East Gate Old Street, Dapeng Ancient City, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.4 stars | A classic representative snack of traditional Hakka culture, this food stall offers a variety of fillings including shredded radish, peanut \u0026 sesame, and mugwort green rice balls. Steamed to chewy perfection, the outer skin bursts with flavorful fillings when bitten into\u2014savory options are rich and addictive, while sweet ones are filled with aromatic peanut and sesame. Loved by both locals and tourists, it\u0027s a non-sticky, textured treat perfect for eating on the go.", "name": "Pengcheng Traditional Handmade Hakka Rice Cake", "transport": "Take Bus M471 or M457 to Dapeng Fortress Station, enter East Gate Old Street, and walk for about 2 minutes."}, {"address": "Next to Haibin Square, Jiaochangwei Road, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.5 stars | A highly popular food stall right by Jiaochangwei Beach, mixing locally caught fresh small shrimp with batter and deep-frying them to a golden crunch. Freshly fried cakes feature an ultra-crispy shell that crackles with every bite, while keeping the shrimp inside tender and juicy. Sprinkled with salt, pepper, or chili powder, it\u0027s packed with savory ocean flavor\u2014an ideal street snack for a beach stroll.", "name": "Jiaochangwei Freshly Fried Shrimp Cake Stand", "transport": "Take Bus M471 to Jiaochangwei Station, then walk to Haibin Road in about 5 minutes."}, {"address": "No. 110 Pengfei Road, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.7 stars | An unmissable street specialty on the Dapeng Peninsula. Premium free-range chicken is marinated with secret spices, wrapped in tin foil, and roasted in a high-temperature red clay kiln. Bursting with mouthwatering aroma when fresh out of the kiln, it features crispy golden skin and tender, juicy meat infused with subtle woody and earthy scents. The meat falls off the bone easily, making it incredibly satisfying to eat by hand.", "name": "Dapeng Traditional Kiln Roasted Chicken", "transport": "Take Bus M471 to Dongshan Temple Station, then walk for about 4 minutes."}, {"address": "No. 32 South Gate Street, Dapeng Fortress, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.3 stars | The ultimate refreshing street dessert for cooling down while exploring Dapeng Ancient City in the summer heat. Hand-crafted using local medicinal herbs, this translucent dark brown jelly is silky smooth and bouncy, melting effortlessly in your mouth. Served with signature brown sugar syrup or rich condensed milk, it offers a light herbal aroma and a pleasantly sweet, soothing chill favored by young tourists and families alike.", "name": "Pengcheng Ancient City Handmade Grass Jelly", "transport": "Take Bus M471 to Dapeng Fortress Station, enter through the South Gate, and walk for about 150 meters."}, {"address": "No. A12, Jiaochangwei Snack Street Zone, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.5 stars | A popular street food highlighting local Hakka culinary traditions. Freshly made soft tofu is stuffed with seasoned minced pork and dried shrimp, then pan-fried on a griddle until both sides are golden and crispy. Featuring a lightly golden crust and a soft, velvety interior, the dish pairs savory meat filling with rich sauce for a comforting bite. A best-selling snack at Jiaochangwei night markets.", "name": "Jiaochangwei Hakka Stuffed Tofu", "transport": "Take Bus M471 to Jiaochangwei Station, enter the Guesthouse Snack Street, and walk for about 3 minutes."}, {"address": "No. 8 West Lane, Zheng Street, Pengcheng Community, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.6 stars | A traditional authentic local favorite passed down for generations in Dapeng, featuring thick rice noodles (Lai Fun) made from pure rice slurry. Smooth, translucent, and fragrant with rice, the noodles offer a pleasantly chewy bite. Served in a rich, piping-hot broth simmered from dried local fish and pork bones, topped with shredded cabbage, dried shrimp, and crispy pork lard bits, a bowl of this warming noodle soup is perfect for discovering traditional local flavors.", "name": "Dapeng Handmade Lai Fun Noodle Stand", "transport": "Take Bus M471 to Dapeng Fortress Station, and walk for about 4 minutes into the ancient town\u0027s West Lane."}, {"address": "No. 45 Zheng Street, Dapeng Fortress, Dapeng Subdistrict, Longgang District, Shenzhen", "feature": "\u2b50 4.4 stars | A beloved Chinese street dessert in the ancient city, handcrafted using high-quality cassava flour and rich coconut milk. Featuring a beautiful golden honeycomb texture, the cake is lightly pan-toasted after steaming to create a delicate crispy crust over a chewy, bouncy interior. Filled with rich coconut and creamy aromas, it is pleasantly sweet without being cloying\u2014a warm, delicious treat to enjoy while exploring Dapeng Ancient City.", "name": "Pengcheng Old Shop Coconut Honeycomb Cake", "transport": "Take Bus M471 to Dapeng Fortress Station, enter the ancient city main street, and walk for about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Bites"}}, "name": "Dapeng Peninsula and Dapeng Fortress"}, "futian_cbd": {"categories": {"cat_1": {"items": [{"address": "1F, Huangjin Building, No. 47 Zhenhua Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 stars | A classic century-old brand inheriting Guangdong\u0027s yum cha culture, insisting on steaming fresh to order. The steaming hot Bamboo Shoot Har Gow features paper-thin wrapper packed with three whole big prawns and tender bamboo shoots, bursting with juicy, springy, and crunchy texture; the Red Rice Roll is soft on the outside, golden and crispy in the middle, and filled with sweet shrimp, offering rich and impactful layers of flavor. Tourists and Shenzhen locals alike are willing to queue for hours just to enjoy this ultimate authentic Cantonese morning tea experience.", "name": "Fan Lou Dim Sum (\u8629\u6a13)", "transport": "Walk about 200m from Exit C of Yannan Station, Metro Line 2"}, {"address": "2-3F, Block B, Pavilion Hotel, No. 4002 Huaqiang North Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A long-established Cantonese restaurant in the Huaqiangbei business district for decades, holding memories for countless locals. The signature Durian Pastry features snowflake-like flaky layers that melt in your mouth, filled with rich, velvety pure durian pulp that is sweet without being greasy; the Steamed Chicken Feet in Imperial Sauce are cooked until tender and flavorful, easily falling off the bone with a rich, gelatinous mouthfeel that lingers. Its rigorous traditional craftsmanship and consistently high quality make it the top choice for family gatherings and entertaining guests among older Shenzhen residents.", "name": "Phoenix House (\u9cf3\u51f0\u6a13)", "transport": "Walk about 150m from Exit A2 of Huaxin Station, Metro Lines 3/7"}, {"address": "No. 93 Huafa North Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | A legendary roast meat shop hidden in the alleys of Huaqiangbei for over 30 years, constantly crowded despite its unpretentious environment. The signature Gold Medal Roast Goose features an amber-colored, crispy, aromatic skin; the rendered fat bursts on the tongue without feeling greasy, while the juicy, firm meat carries unique notes of herbal and five-spice aromas. Dipped in special plum sauce, the sweet and tangy contrast creates addictive, multi-layered flavors. This is the ultimate comfort food that countless Huaqiangbei tech moguls and workers grew up eating.", "name": "Huaxiang Roast Goose (\u83ef\u9999\u9d5d\u5feb\u9910\u5e97)", "transport": "Walk about 400m from Exit B of Huaqiang North Station, Metro Line 2"}, {"address": "1-3F, Danfeng Bailu Hotel, No. 13 Yannan Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A classic Cantonese restaurant rooted in Shenzhen since 1989, famous for exquisite Cantonese seafood and authentic home-style dishes. The signature Sizzling Chinese Kale cooked in hot clay pots locks in moisture instantly, sizzling when served with an extremely crisp texture and enchanting wok hei (wok aroma); the Salt \u0026 Pepper Bombay Duck Fish is crispy outside and tender inside, with flesh so delicate it melts like tofu. Their strict standards for fresh ingredients and culinary mastery keep diners coming back for more.", "name": "Sheng Ji Restaurant (\u52dd\u8a18\u98ef\u5e97)", "transport": "Walk about 180m from Exit A of Yannan Station, Metro Line 2"}, {"address": "1F, Huangjin Building, No. 47 Zhenhua Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | A Sichuan cuisine pioneer starting from Zhenhua Road in Huaqiangbei in 1998, introducing authentic Sichuan flavors to Shenzhen. The classic signature Mao Xue Wang is packed with rich ingredients: silky smooth duck blood curd and crunchy tripe in a spicy red chili oil broth that is richly aromatic and numbing without excessive harshness; the Boiled Fish uses freshly killed fish cut into paper-thin, silky, tender slices bathed in aromatic Sichuan peppercorns and dried chilies. Its traditional Sichuan taste maintained consistently for decades is loved by both tourists and foodies alike.", "name": "Ba Shu Feng Sichuan Restaurant (\u5df4\u8700\u98a8)", "transport": "Walk about 210m from Exit C of Yannan Station, Metro Line 2"}, {"address": "2-3F, Building 4, Excellence Century Center, Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 stars | One of the pioneer brands that created Shenzhen\u0027s signature \u0027coconut chicken\u0027 trend, highly popular in the Futian CBD area. The broth uses 100% natural fresh Hainan green coconut water, making it naturally sweet; authentic Hainan Wenchang chicken is chosen for its thin skin, soft bones, and springy, tender meat. After boiling for a few minutes, dip it in the ultimate sauce made of calamansi, sand ginger, and premium soy sauce for an explosion of refreshing sweetness. Finish with a pot of Cured Meat Claypot Rice featuring golden crispy rice crust\u2014a classic Shenzhen flavor you cannot miss.", "name": "Run Yuan Si Ji Coconut Chicken (\u6f64\u5712\u56db\u5b63\u6930\u5b50\u96de)", "transport": "Walk about 500m from Exit E of Convention \u0026 Exhibition Center Station, Metro Lines 1/4"}, {"address": "2F, Anlian Building, No. 4018 Jintian Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | Established in 1989, this prestigious long-standing Cantonese dining brand is synonymous with traditional banquets and morning tea for Futian business professionals and locals. Its signature Crispy Roasted Squab features crispy skin and juicy, amazingly tender meat; the Har Gow (shrimp dumplings) and Double-Boiled Fish Maw Soup also demonstrate master-level culinary skill with rich, nourishing, long-lasting sweet flavor. The restaurant offers a grand, elegant atmosphere, showcasing high-end Guangzhou dining culture and warm service.", "name": "Chun Man Yuan (\u6625\u6eff\u5712)", "transport": "Walk about 450m from Exit F of Civic Center Station, Metro Lines 2/4"}, {"address": "L3, COCO Park, No. 3 Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A renowned legendary brand that popularized Chaoshan hand-cut beef hot pot, famous for extreme freshness delivered directly from slaughterhouses. Signature cuts like chuck flap (Shi Ren) and rib eye (Diao Long) feature tender, tight red meat that, after swishing in boiling broth for just a few seconds, becomes melt-in-your-mouth tender with rich beefy aroma. The hand-pounded beef meatballs are incredibly bouncy, bursting with sweet juice upon every bite. Paired with special Shacha sauce, it showcases Chaoshan\u0027s passion for pure, natural flavors.", "name": "Baheli Haiji Beef Hotpot (\u6c55\u982d\u516b\u5408\u91cc\u6d77\u8a18\u725b\u8089\u5e97)", "transport": "Walk about 200m from Exit C of Shopping Park Station, Metro Lines 1/3"}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "L1, Phase 1, Futian COCO Park, Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A wildly popular hipster cafe brand originating in Shenzhen, renowned for its minimalist green-and-white container aesthetic and cozy outdoor seating area. The signature \u0027Avocado Tieguanyin Latte\u0027 seamlessly blends rich, creamy avocado puree with fragrant Tieguanyin tea, creating a smooth texture with subtle floral tea notes. Pair it with the freshly baked \u0027Soy Milk Peanut Bagel\u0027, featuring a crispy crust and dense, chewy inside slathered with a thick layer of sweet-and-savory spread\u2014making it a top viral brunch choice in town.", "name": "Kuddo Coffee", "transport": "Metro Line 1/3 Shopping Park Station, Exit C, approx. 150m walk"}, {"address": "L1, East Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 stars | A minimalist, industrial-style specialty cafe located in the heart of Futian\u0027s business district, hugely popular among local office workers and tourists. It specializes in artisanal pour-overs and creative signature brews. The popular \u0027Flat White\u0027 features silky-smooth microfoam and a rich, lingering coffee aroma. For brunch, the \u0027Eggs Benedict Croissant\u0027 combines flaky croissants with freshly seared smoked bacon\u2014slice into it to reveal a golden, runny yolk for a rich and thoroughly satisfying bite.", "name": "Something For", "transport": "Metro Line 10/1 Gangxia Station, Exit F, approx. 200m walk"}, {"address": "L1, Tower 1, Kerry Plaza, No. 1 Zhongxin 4th Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | A long-established homegrown specialty coffee roaster in Shenzhen, featuring a warm wooden interior mixed with modern textures. Highly recommended is their \u0027Classic Single-Origin Pour-Over\u0027, which perfectly highlights the floral, fruity, and subtle acidic notes of beans from different origins. For brunch, don\u0027t miss the \u0027Full English Breakfast\u0027, packed with freshly cooked sausages, sunny-side-up eggs, saut\u00e9ed wild mushrooms, and crispy hash browns. Generous portions and fresh ingredients make it the ultimate choice for a relaxing weekend morning.", "name": "Gee Coffee Roasters", "transport": "Metro Line 1/4 Convention \u0026 Exhibition Center Station, Exit A, approx. 350m walk"}, {"address": "L3, UpperHills, No. 5001 Huanggang Road, Lianhua Yicun Community, Huafu Subdistrict, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A trendy bakery cafe known for sourdough breads and exquisite French-style brunch, featuring a bright, spacious environment filled with the aroma of freshly baked goods. The signature \u0027Black Truffle Wild Mushroom Open Sourdough Sandwich\u0027 uses house-fermented sourdough that is crispy outside, soft, and pleasantly chewy inside. It\u0027s topped with rich black truffle sauteed mushrooms and a soft-boiled poached egg for a luxurious, velvety bite. Paired with a cold brew black coffee, it offers a perfectly balanced flavor profile loved by tourists and foodies alike.", "name": "SAANCI 3Ci Bakery \u0026 Brunch", "transport": "Metro Line 10 Donggualing Station, Exit E, approx. 400m walk"}, {"address": "L1, West Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.4 stars | A hit corner coffee shop originating from South China, famous for high-quality, quick-grab coffee culture. The signature \u0027Uncle Latte\u0027 uses dark roast beans blended with rich fresh milk, delivering a bold, velvety profile with dark chocolate and nutty undertones. Pair it with their bestselling \u0027Freshly Baked Matcha Chocolate Croissant\u0027\u2014flaky, buttery layers wrapped around a bittersweet matcha filling. Perfect for a quick coffee grab while exploring the Futian business district.", "name": "store by .jpg", "transport": "Metro Line 1/4 Convention \u0026 Exhibition Center Station, Exit A, approx. 300m walk"}, {"address": "L1, Yuanwang Digital Mall, Huaqiang North Road, Huaqiangbei Subdistrict, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | A minimalist cafe chain taking the internet by storm with its \u0027unique design per store\u0027 concept and inventive coffee creations. The viral hit \u0027Oat Cookie Latte\u0027 serves aromatic oat milk coffee in an edible cookie cup lined with rich chocolate\u2014making it fun, interactive, and delicious. For brunch, grab a \u0027Beef \u0026 Cheese Panini\u0027, featuring crispy pressed bread loaded with savory beef and gooey melted cheese that will leave you wanting more.", "name": "M Stand Coffee", "transport": "Metro Line 2/7 Huaqiang North Station, Exit A, approx. 180m walk"}, {"address": "L1, North Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | A pioneer of specialty creative coffee in China, boasting lush greenery and modern aesthetics to create an inspiring space. The signature creation \u0027Cloud Peach Latte\u0027 is visually dreamy, featuring delicate peach notes and velvety milk foam. For a light brunch, try the \u0027Avocado \u0026 Smoked Salmon Croissant\u0027, packed with premium smoked salmon slices and creamy avocado topped with a dash of tangy lemon juice\u2014refreshing, crisp, and delightfully healthy.", "name": "Seesaw Coffee", "transport": "Metro Line 2 Gangxia North Station, Exit N2, approx. 250m walk"}, {"address": "L1, Outdoor Star Plaza, Phase 1, COCO Park, Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 stars | An iconic Shenzhen lifestyle cafe serving all-day light bites and brunch, with outdoor garden seating that offers a relaxing resort vibe. The signature \u0027gaga All-Day Brunch\u0027 is generously packed with sous-vide chicken breast, whole wheat toast, roasted tomatoes, and creamy scrambled eggs. Pair it with the popular \u0027Peach Oolong Fruit Tea\u0027 or a poured-over single-origin coffee for a refreshing mix of fruit and tea aromas\u2014the perfect spot to soak up afternoon sunshine with friends.", "name": "gaga Garden", "transport": "Metro Line 1/3 Shopping Park Station, Exit C, approx. 100m walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1st Floor, Block A, Shenfang Building, No. 2001 Huaqiang North Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | A unique bistro that seamlessly blends a bar, restaurant, and caf\u00e9. Their signature Hutaoli Roast Chicken features crispy skin, tender meat, and a subtle charcoal aroma. Paired with custom cocktails and live band performances, it creates a romantic and relaxing social atmosphere, highly popular among young professionals and tourists.", "name": "Hutaoli Music Tavern (Huaqiangbei)", "transport": "Approx. 3-min walk from Exit B of Huaqiang North Station, Metro Lines 2/7"}, {"address": "4th Floor, Excellence INTOWN Shopping Center, No. 2030 Jintian Road, Futian District, Shenzhen", "feature": "\u2b50 4.8 Stars | An iconic local delicacy of Shenzhen. Made with fresh Hainan Wenchang chicken cooked in a broth of freshly chopped coconut water, the chicken is tender and smooth. Dipped in a custom sauce made of calamansi, sand ginger, and special soy sauce, the broth is sweet, refreshing, and rich in coconut aroma\u2014a must-try specialty when visiting Shenzhen.", "name": "Runyuan Siji Coconut Chicken (Excellence INTOWN)", "transport": "Approx. 8-min walk from Exit E of Convention \u0026 Exhibition Center Station, Metro Lines 1/4"}, {"address": "1st Floor, Building 405, Sangda Industrial Zone (Intersection of Huaqiang North Rd and Zhenhua Rd), Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | A long-standing Sichuan regional restaurant in the Huaqiangbei commercial area. The signature Boiled Fish is boneless, tender, numbing, spicy, and savory, while the Saliva Chicken offers springy chicken with fragrant crushed peanuts. Its rich and layered Sichuan spicy flavors perfectly embody the authentic culinary essence of Shu, drawing countless foodies for a pilgrimage.", "name": "Bashu Style Sichuan Cuisine (Huaqiangbei)", "transport": "Approx. 2-min walk from Exit C of Huaqiang North Station, Metro Line 2"}, {"address": "3rd Floor, Futian Galaxy COCO Park, No. 268 Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | An immensely popular restaurant highlighting rural Hunan regional specialties. The signature Stir-fried Pork with Peppers uses premium black pork and local Hunan spiral peppers, packed with wok hei, spicy, and appetizing. The Mountain Radish Stewed Beef Brisket is sweet, savory, melt-in-your-mouth soft, and dense. Using fresh and pure ingredients, it offers food lovers an authentic and rustic Huxiang culinary experience.", "name": "Nonggengji Hunan Country Cuisine (Futian COCO Park)", "transport": "Directly accessible from Exit F of Shopping Park Station, Metro Lines 1/3"}, {"address": "L1 Floor, East Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | An exquisite exotic bistro filled with Spanish flair. The classic Spanish Seafood Paella features rice cooked to perfection after absorbing rich seafood stock, loaded with intense umami. Paired with crispy, juicy Gambas al Ajillo (garlic spicy shrimp) and selected wines, its romantic and elegant indoor/outdoor setting is ideal for evening drinks and gathering with friends.", "name": "EPE Tapas Bar (One Avenue)", "transport": "Approx. 5-min walk from Exit 12 of Gangxia North Station, Metro Line 10"}, {"address": "No. N121, West Zone, One Avenue, No. 2005 Shennan Avenue, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | A renowned high-end Cantonese regional flagship in Lingnan. The signature Secret Black Barbecue Pork (Char Siu) is rich yet not greasy, melting in your mouth with a caramelized, sweet honey glaze. Their pioneer Crispy Char Siu is crispy outside and tender inside with bursting aromas. Masterful cooking techniques and an elegant ambiance make it the top choice to experience classic Cantonese cuisine.", "name": "Bingsheng Pinwei (One Avenue)", "transport": "Approx. 4-min walk from Exit B of Gangxia Station, Metro Lines 1/10"}, {"address": "1st Floor, Futian Galaxy COCO Park, No. 268 Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | A specialty bistro combining an American gastropub with craft beer draft towers. Offering over a hundred craft beers, their signature slow-roasted pork ribs are fall-off-the-bone tender and juicy. Paired with rich crispy fries and custom American burgers, the fun and casual atmosphere makes it a popular hotspot for Futian nightlife and American pub culture.", "name": "COMMUNE Reserve Bistro (Futian Galaxy COCO Park)", "transport": "Approx. 2-min walk from Exit G of Shopping Park Station, Metro Lines 1/3"}, {"address": "L3 Floor, West Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A specialty bistro centered around oysters sourced locally from Shenzhen and top regions worldwide. The founder, \u0027Master Oyster\u0027, pioneered diverse preparations including chilled fresh oysters, gold medal crispy fried oysters, and fresh \u0026 dried oyster claypots. Plump, juicy, and packed with ocean freshness, pairing them with selected champagnes adds a luxurious layer of enjoyment.", "name": "Haoye Oyster Bistro (Futian One Avenue)", "transport": "Approx. 6-min walk from Exit 10 of Gangxia North Station, Metro Lines 2/10"}], "name": "Featured Bistros \u0026 Local Regional Cuisine"}, "cat_4": {"items": [{"address": "2F, Aihua Building, No. 2038 Shennan Middle Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | An iconic time-honored vegetarian restaurant in Shenzhen, famous for its lavish buffet and exquisite Cantonese vegetarian dim sum. The renowned \u0027Black Pepper Vegetarian Steak\u0027 offers a firm, juicy texture expertly crafted from mushrooms and soy products, bursting with rich aroma with every bite. The steamed dim sum, such as the \u0027Vegetarian Crystal Dumplings\u0027, features chewy, translucent skins with crisp, flavorful fillings, making it a favorite among regulars and tourists alike.", "name": "Deng Pin Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 1 to Science Museum Station (Exit B), then walk for about 3 minutes."}, {"address": "2F, East Zone, One Avenue, No. 348 Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.8 Stars | A trendy, high-end modern vegetarian restaurant located in One Avenue, featuring an ambiance infused with Oriental Zen. The signature \u0027Black Truffle Fried Rice\u0027 features distinct grains infused with aromatic truffle notes and layered with wild mushrooms. The \u0027Pan-Fried Organic Chinese Yam in Olive Oil\u0027 is crispy outside and tender inside, boasting a silky texture that perfectly preserves the natural sweetness and healthy essence of the ingredients.", "name": "Qing Chun Pu She Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 1 or Line 10 to Gangxia Station (Exit B), then walk for about 5 minutes."}, {"address": "2F, Building 2, China Phoenix Building, No. 2008 Shennan Avenue, Futian District, Shenzhen", "feature": "\u2b50 4.7 Stars | A renowned fine-dining Zen vegetarian restaurant in central Futian that seamlessly blends traditional Buddhist culture with modern fine cuisine. The classic \u0027First-Class Buddha Jumps Over the Wall\u0027 features rare, premium mushrooms slow-simmered into a rich, savory, velvety broth. The \u0027Vegetarian Roast Duck\u0027, cleverly crafted from tofu skin, boasts a crispy texture that pairs wonderfully with delicate thin pancakes and sweet bean sauce for an incredibly layered taste.", "name": "Jing Xin Lian Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 2 or Line 8 to Gangxia North Station (Exit 12), then walk for about 4 minutes."}, {"address": "1F, Aihua Market, Zhenzhong Road, Huaqiangbei Street, Futian District, Shenzhen", "feature": "\u2b50 4.4 Stars | An incredible value-for-money vegetarian buffet restaurant in the Huaqiangbei commercial area, serving dozens of fresh hot dishes, dim sum, and soups daily. The signature \u0027Handmade Vegetarian Steamed Buns\u0027 feature fluffy dough packed with sweet, juicy vegetable filling, while the golden \u0027Fried Vegetarian Spring Rolls\u0027 offer a crispy bite with non-greasy wood ear mushrooms and shredded carrots\u2014hugely popular with local office workers and tourists.", "name": "Su Man Xiang Vegetarian Buffet", "transport": "Take Shenzhen Metro Line 2 or Line 7 to Huaqiang North Station (Exit C), then walk for about 4 minutes."}, {"address": "L4, Great China International Exchange Square, No. 126 Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | A vegetarian restaurant focusing on wellness and healthy dining concepts, nestled in a tranquil and elegant setting. The specialty \u0027Matsutake \u0026 Bamboo Fungus Soup\u0027 is clear and sweet, with tender bamboo fungus soaked in flavorful broth. The \u0027Handmade Five-Grain Vegetable Claypot\u0027 slow-stews various root vegetables to create a velvety, soft texture with natural sweetness that leaves a lasting impression.", "name": "Ruo Shui Hua Kai Vegetarian", "transport": "Take Shenzhen Metro Line 1 or Line 4 to Convention \u0026 Exhibition Center Station (Exit A1), which connects directly to Great China International Exchange Square."}, {"address": "L4, Century Place Mall, No. 1 Zhonghang Road, Futian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A stylish, modern vegetarian eatery located inside Century Place Mall in Huaqiangbei. The signature \u0027Thai Sour \u0026 Spicy Vegetarian Fish\u0027 cleverly replicates fish texture using soy protein, bursting with tangy, bold flavors in a springy bite. The \u0027Golden Broth Tofu\u0027 is crafted from organic soybeans, offering silky-smooth tofu bathed in a rich, savory broth that pairs perfectly with rice, making it a hit among young foodies.", "name": "Ran Su Vegetarian Cuisine", "transport": "Take Shenzhen Metro Line 1 to Huaqiang Road Station (Exit B), then walk for about 6 minutes."}, {"address": "3F, Futian Galaxy COCO Park, No. 268 Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | A chic, aesthetically designed plant-based restaurant located in COCO Park that celebrates the natural taste of whole foods. The signature \u0027Quinoa Avocado Salad\u0027 is refreshing and creamy, paired with a custom sweet-and-sour dressing. The \u0027Wild Mushroom Curry Pot\u0027 features a rich, deeply fragrant curry packed with satisfyingly chewy wild mushrooms, delivering a delightful taste experience for plant-based diners.", "name": "Wan Wu Jing Guan Vegetarian Cuisine", "transport": "Take Shenzhen Metro Line 1 or Line 3 to Shopping Park Station (Exit C), directly connecting to the mall."}, {"address": "Near No. 2001 Hongli Road, Lianhua Street, Futian District, Shenzhen", "feature": "\u2b50 4.4 Stars | A traditional Zen-style vegetarian restaurant situated near Lotus Mountain and central Futian. Highly recommended is the \u0027Vegetarian Pickled Fish\u0027, made from konjac and tofu skin into springy, tender slices immersed in a zesty, zippy pickled cabbage soup. The \u0027Pan-Fried Vegetarian Goose\u0027 boasts a crispy, fragrant golden crust layered with light five-spice flavors, adored by vegetarian food lovers.", "name": "Da Fan Yin Vegetarian Restaurant", "transport": "Take Shenzhen Metro Line 3 or Line 10 to Lianhuacun Station (Exit A1), then walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "B1, Huaqiangbei Maoye City, No. 2009 Huaqiangbei Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 Stars | An insanely popular spot for grab-and-go treats in Futian, Shenzhen! Their signature \u0027Seaweed Meat Floss Cake\u0027 features a cloud-like, soft cake coated in crispy seaweed shreds and fluffy pork floss, stuffed with a rich, bursting sweet-and-savory mayonnaise filling. Both tourists and local commuters queue up eagerly for these irresistible bites\u2014a must-buy souvenir and street snack when exploring the Huaqiangbei commercial area.", "name": "Bao Master Pastry (Bao Shi Fu)", "transport": "Take Shenzhen Metro Line 2 or Line 7 to Huaqiangbei Station (Exit A), and walk for about 2 minutes."}, {"address": "No. 103, Building 39, Yuanling Xincun, Futian District, Shenzhen (Near Huaqiangbei Commercial Area)", "feature": "\u2b50 4.3 Stars | Tucked away in the alleys near Huaqiangbei, this heritage beef offal stall carries childhood memories for countless Shenzhen locals. The classic \u0027Cantonese Curry Beef Offal\u0027 is slow-simmered for hours, leaving the brisket, tripe, and tendon melt-in-your-mouth tender, fully absorbed in a savory curry sauce. The stewed daikon radish is a true highlight\u2014bursting with sweet, flavorful broth with every soft bite. Walking around with a small bowl is the ultimate authentic Shenzhen street food experience.", "name": "Uncle Ashu\u0027s Beef Offal", "transport": "Take Shenzhen Metro Line 9 to Yuanling Station (Exit C), and walk for about 5 minutes."}, {"address": "No. 38 Shuiwei Street, Shuiwei Village, Futian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Located in the Shuiwei Food Street district, this famous traditional stone-ground rice roll shop is beloved by locals and tourists alike. Fresh rice milk is ground daily to create paper-thin, silky-smooth rolls with a delicate chew. Loaded with tender minced meat and fresh eggs, then drizzled with special soy sauce and homemade chili paste, every bite delivers rich rice aroma and savory layers. A top priority for exploring Futian\u0027s night markets and street food!", "name": "Deng\u0027s Heritage Cantonese Steamed Rice Roll", "transport": "Take Shenzhen Metro Line 4 or Line 7 to Fumin Station (Exit D), and walk for about 6 minutes."}, {"address": "Underground Commercial Street (Link City), Huaqiangbei Pedestrian Street, Futian District, Shenzhen", "feature": "\u2b50 4.2 Stars | A highly popular baked street snack right on Huaqiangbei Pedestrian Street! Fermented dough stuffed with savory preserved mustard greens and minced pork belly is stuck inside a piping-hot clay oven and baked on the spot. Served piping hot and golden-crisp, every bite crackles with satisfaction. The filling hits you with a smoky, savory-sweet flavor profile with a touch of spice\u2014an absolute hit for eating on the move.", "name": "Shaoxing Preserved Mustard Greens \u0026 Pork Flatbread", "transport": "Take Shenzhen Metro Line 1 or Line 2 to Huaqiang Road Station or Huaqiangbei Station, and walk through the Link City underground concourse."}, {"address": "Near Zhenxing Road, Huaqiangbei Commercial Area, Futian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Originating from the Chaoshan region, this traditional pastry stand tucked in Futian\u0027s old neighborhood alleyways draws steady crowds. The mung bean pastry boasts flaky, paper-thin layers that crumble delightfully at a touch. Inside, the smooth, finely ground mung bean paste is light, creamy, and subtly sweet. Served crisp and warm fresh out of the oven, or chewy when cooled, it\u2019s a beloved local after-dinner stroll snack.", "name": "Huilai Mung Bean Pastry", "transport": "Take Shenzhen Metro Line 2 to Yannan Station (Exit C), and walk for about 4 minutes."}, {"address": "No. 100 Zhenhua Road, Huaqiangbei Subdistrict, Futian District, Shenzhen", "feature": "\u2b50 4.3 Stars | A highly rated cold dish specialty around Huaqiangbei! Premium Sanhuang chicken is poached, chilled, and hand-shredded before being tossed with aromatic sesame oil, toasted sesame seeds, fresh cilantro, and a secret spicy sauce. The skin is pleasantly bouncy while the meat stays tender and juicy. Wrapped in tempting spicy-numbing aromas, this appetizing dish is frequently bought by tourists to go, making a perfect night market snack to go with a cold drink.", "name": "Zhuangji Hand-Shredded Chicken", "transport": "Take Shenzhen Metro Line 2 to Huaqiangbei Station (Exit B), and walk for about 3 minutes."}, {"address": "Shuiwei 1368 Block, Futian Subdistrict, Futian District, Shenzhen", "feature": "\u2b50 4.1 Stars | A late-night street food craze among youth around the Shuiwei 1368 Block and Coco Park. Ingredients are fried fresh to order: signature fried bean curd skin turns wafer-thin and crackly, while fried rice cakes offer a crispy shell with a delightfully chewy interior. Brushed with a signature sweet-spicy sauce and cumin powder, these skewers serve up a rich blend of spicy and savory flavors\u2014a classic paper-cup market snack you can enjoy while strolling.", "name": "Linjia Fried Skewers", "transport": "Take Shenzhen Metro Line 7 to Huanggang Village Station (Exit A), and walk for about 5 minutes."}, {"address": "No. B02, Link City Underground, Futian District, Shenzhen (Near the connecting walkway between Coco Park and Huaqiangbei Metro)", "feature": "\u2b50 4.5 Stars | A viral Cantonese hand-pounded lemon tea shop in Huaqiangbei\u0027s Link City underground concourse! Premium Guangdong perfume lemons are vigorously hand-pounded to release aromatic essential oils, then shaken over ice with freshly brewed Ya Shi Xiang Dancong tea. Tangy, crisp, and refreshing with zero astringency, it leaves a sweet aftertaste that perfectly cuts through rich, savory street snacks like fried skewers and beef offal.", "name": "Yaya Hand-Pounded Lemon Tea", "transport": "Take Shenzhen Metro Line 1 to Shopping Park (Coco Park) Station or Huaqiang Road Station, accessible directly via the underground street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Futian Central Area and Huaqiangbei"}, "luohu_dongmen": {"categories": {"cat_1": {"items": [{"address": "2nd-3rd Floor, Shenyun Building, No. 26 Shaibu Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | Shenyun Restaurant is a historically rich, time-honored Cantonese restaurant in Luohu District, Shenzhen. Open since the 1980s, it carries the culinary memories of countless long-time Shenzhen residents. The signature Crispy Duck boasts crispy skin, tender meat, and aromatic, melt-in-your-mouth bones without a hint of greasiness. The traditional handmade King Har Gow (Shrimp Dumplings) features a thin wrapper packed with fresh, plump shrimp. Retaining its warm, rustic traditional dim sum hall decor, patrons gather here to enjoy morning tea and exquisite Cantonese dishes, offering a rich local cultural atmosphere\u2014a must-visit spot to experience authentic Lingnan culinary culture and nostalgic flavors.", "name": "Shenyun Restaurant (\u6df1\u904b\u9152\u6a13)", "transport": "Take Shenzhen Metro Line 3 to Shaibu Station (Exit B) and walk about 200 meters."}, {"address": "4th-5th Floor, Carrianna Plaza, No. 2002 Renmin South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.7 Stars | Located in the bustling Luohu commercial area, Carrianna Chiu Chow Restaurant has been synonymous with top-tier traditional Teochew cuisine in Shenzhen for decades. The Chilled Red Crab features sweet, firm meat that bursts with maritime sweetness when dipped in special ginger vinegar sauce. The Braised Goose Web and Wings are slow-cooked in a master brine aged over decades, yielding tender skin, melt-in-your-mouth meat, and deep savory flavor. From classic Teochew chilled fish to handcrafted Teochew dim sum, every dish showcases supreme culinary artistry, making it a favorite among local gourmets and business travelers.", "name": "Carrianna Chiu Chow Restaurant (\u4f73\u5be7\u5a1c\u6f6e\u5dde\u9152\u6a13)", "transport": "Take Shenzhen Metro Line 9 to Xiangxicun Station (Exit D1) and walk about 300 meters."}, {"address": "1st Floor, Sun Far Building, No. 2004 Chunfeng Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | Sun Far Restaurant is a long-standing Hong Kong-style Cantonese roast meat joint in the Dongmen area of Luohu, capturing the hearts of countless diners with its master roasting techniques. The signature Gold Medal Roast Goose has paper-thin, golden crispy skin bursting with flavorful aroma in every bite, while the goose meat remains juicy, tender, and free of gamey odor\u2014paired perfectly with sweet plum sauce for balance. The Crispy Pork Belly features beautifully defined pork layers and an ultra-crunchy rind. With authentic, warm service and a nostalgic Hong Kong vibe, it stays bustling from morning till night.", "name": "Sun Far Restaurant (\u65b0\u767c\u71d2\u81d8\u8336\u9910\u5ef3)", "transport": "Take Shenzhen Metro Line 9 to Xiangxicun Station (Exit B) and walk about 250 meters."}, {"address": "1st Floor, Sunshine Hotel, No. 2001 Jiabin Road, Luohu District, Shenzhen", "feature": "\u2b50 4.6 Stars | As an iconic classic Cantonese restaurant near the MixC shopping district in Luohu, Dan Gui Xuan has maintained high-quality authentic dim sum and handcrafted Cantonese dishes for decades. The Braised Sea Cucumber with Pig Trotters is rich in collagen, delightfully sticky, and softly aromatic. The Taiwanese-style Pig Trotters and Pan-fried Pork Intestine Buns are signature table staples. At dawn, the restaurant fills with local regulars enjoying traditional steamed dim sum; classic Crystal Shrimp Dumplings and Steamed Spare Ribs in Black Bean Sauce offer refined, satisfying textures, perfectly reflecting the heritage and dedication of a classic Lingnan teahouse.", "name": "Dan Gui Xuan - Sunshine Hotel (\u4e39\u6842\u8ed2)", "transport": "Take Shenzhen Metro Line 1 to Guomao Station (Exit B) and walk about 400 meters."}, {"address": "Side Shop, 1st Floor, Haiyan Building, No. 3002 Jiabin Road, Luohu District, Shenzhen", "feature": "\u2b50 4.4 Stars | Tucked away near the Haiyan Building in Luohu, this iconic rice roll shop is one of the most popular and representative traditional street snack spots in the Dongmen commercial area. Made fresh to order using stone-ground rice batter, the steamed rice rolls are translucent, paper-thin, and wonderfully springy. The signature Beef \u0026 Egg Rice Roll, drizzled with custom-blended savory soy sauce, is smooth, velvety, and seamlessly blends juicy minced beef with fragrant egg. This humble yet intensely flavorful street delicacy draws endless crowds of tourists and local workers alike.", "name": "Haiyan Building Rice Rolls (\u6d77\u71d5\u5927\u5ec8\u50b3\u7d71\u8178\u7c89)", "transport": "Take Shenzhen Metro Line 1 to Guomao Station (Exit E) and walk about 150 meters."}, {"address": "5th Floor, Phase 1, Shenzhen MixC, No. 1881 Bao\u0027an South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.8 Stars | Tao Tao Ju, a century-old Lingnan institution famed for Cantonese yum cha, opened its outlet in Luohu MixC while staying true to authentic, refined Cantonese culinary traditions. The signature Tao Tao Ju Jumbo Har Gow is stuffed with multiple fresh shrimp, wrapped in a translucent, chewy skin. The Puff Pastry Milk Pineapple Bun boasts a golden crispy crust and a hot, richly milky filling. Blending traditional Xiguan heritage decor with modern refinement, it is a classic must-visit culinary establishment when visiting The MixC.", "name": "Tao Tao Ju - MixC Luohu (\u9676\u9676\u5c45)", "transport": "Take Shenzhen Metro Line 1 or 2 to Grand Theater Station (Exit F), direct connection to The MixC."}, {"address": "No. 1001 Hongling Middle Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | Founded in 1989, Sheng Kee Restaurant is a renowned powerhouse in Shenzhen\u0027s Cantonese dining scene, with its Luohu branch carrying forward nearly three decades of authentic Guangdong flavors. The signature Sizzling Eel Claypot is flash-fried live in a blistering hot clay pot, producing firm, springy eel meat infused with robust garlic and shredded ginger aromas. The Special Three-Cup Duck and Crispy Roasted Pigeon are also must-order classics on every table. With strict quality control over fresh ingredients and master control of wok hei, Sheng Kee is a top choice for local family gatherings and visitors seeking authentic Cantonese food.", "name": "Sheng Kee Restaurant - Luohu (\u52dd\u8a18\u98ef\u5e97)", "transport": "Take Shenzhen Metro Line 3 or 9 to Hongling Station (Exit E) and walk about 350 meters."}, {"address": "No. 3067 Dongmen South Road, Luohu District, Shenzhen", "feature": "\u2b50 4.5 Stars | Chao Tai Beef Hotpot is a long-established Teochew fresh beef hot pot destination in Luohu District, famous for its daily fresh-cut beef and pure beef bone broth base. Signature cuts like Diaolong (rib eye cap) and Snowflake Beef feature beautiful marbling and need only seven seconds of swishing in boiling bone broth, resulting in juicy, tender bites with a hint of milky sweetnes
