District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buy List: Explorer 12-Slot Eyeshadow Palette, Bio-Lip Membrane Essence Lipstick, Slim Card Compact Powder. One of China\u0027s most iconic emerging C-beauty makeup brands. The Bao\u0027an Center store offers full product trials and makeup application services by professional artists. Celebrated for exquisite packaging and high cost-performance, it seamlessly blends Oriental aesthetics with modern fashion, making it a huge hit among young visitors.", "name": "Perfect Diary (Bao\u0027an Uniwalk Experience Store)", "transport": "Take Shenzhen Metro Line 1 or Line 5 to Bao\u0027an Center Station, Exit F, and enter B1 Floor of the shopping mall."}, {"address": "L2 Floor, Qianhai MixC, Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Must-Buy List: Fairy Peach Blossom Loose Powder, Blooming Love Lock Lipstick, Jade Carved Pressed Powder. Internationally renowned top Chinese cosmetics brand centered on micro-carving craftsmanship and ancient herbal skincare recipes. Designed with the elegant Oriental aesthetics of Jiangnan gardens, every product looks like a luxurious handicraft. Its loose powder offers superb oil control, making it a must-visit beacon of Eastern beauty in the Qianhai commercial area.", "name": "Florasis (Qianhai MixC Counter)", "transport": "Take Shenzhen Metro Line 5 to Guiwan Station, Exit A, and walk for about 4 minutes to reach Qianhai MixC."}, {"address": "Near the Intersection of Xinghua 1st Road and Luotian Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buy List: Guangyuyuan Dingkun Dan, Ma Ying Long Longzhu Ointment, Nin Jiom Pei Pa Kao. A state-owned large chain pharmacy flagship store deeply rooted in Shenzhen for many years, offering guaranteed quality and authentic herb sourcing. In addition to a comprehensive range of prescription and OTC medicines, counters also sell products from time-honored Chinese brands, including herbal skincare and wellness remedies\u2014making it a fantastic spot to pick up authentic traditional wellness souvenirs.", "name": "Sinopharm Accord Pharmacy (Bao\u0027an Center Branch)", "transport": "Take Shenzhen Metro Line 1 or Line 5 to Bao\u0027an Center Station, Exit B, and walk for about 8 minutes."}], "name": "Local Signature Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "L1, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 stars | Must-Buys: Oversized streetwear T-shirts, techwear cargo pants, branded graphic caps. ROARINGWILD is an original local streetwear brand born in Shenzhen, featuring a futuristic tech-inspired concept store at Bao\u0027an Uniwalk. Blending Shenzhen\u0027s local youth culture with modern techwear aesthetics, their clothes feature sleek, highly recognizable cuts. A massive favorite among local trendy youth, this is a must-visit clothing store to experience Shenzhen\u0027s local street culture.", "name": "ROARINGWILD (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}, {"address": "L2, Qianhai MixC, No. 5059 Tinghai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buys: Tailored sculptural wool coats, printed silk dresses, artistic leather handbags. Headquartered in Shenzhen, Marisfrolg is an iconic high-end women\u0027s fashion brand in China. Its flagship store at Qianhai MixC features stunning architectural artistry, embodying an elegant, grand design spirit rooted in Oriental aesthetics. Crafted with meticulously selected fabrics, it is highly favored by local high-end business women and fashion elites in Shenzhen.", "name": "Marisfrolg (Qianhai MixC Store)", "transport": "Approx. 300m walk from Exit E of Guiwan Station, Metro Line 5"}, {"address": "B1, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buys: Retro block-heel loafers, lightweight genuine leather ankle boots, stylish British-style combat boots. Originating in Shenzhen, BELLE is a renowned footwear giant in China. Its large storefront in Bao\u0027an Center offers the most comprehensive seasonal footwear collection. Combining modern fashion with ultimate comfort, it covers everything from workplace commuter shoes to casual footwear, making it the top choice for locals buying high-quality genuine leather shoes.", "name": "BELLE Flagship Store (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}, {"address": "L1-L2, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buys: Designer niche dresses, vintage baguette bags, oversized blazers. URBAN REVIVO (UR) is a flagship Chinese fast-fashion brand. Its store at Bao\u0027an Uniwalk boasts a massive layout and incredibly fast new-arrival updates. Renowned for its exceptional value and runway-worthy designs rivaling global luxury brands, its bags and apparel are massively popular among Shenzhen\u0027s youth, frequently setting local daily outfit trends.", "name": "URBAN REVIVO (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}, {"address": "L2, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 stars | Must-Buys: Extreme Cold series down jackets, lightweight windproof down coats, designer collaboration down bags. Bosideng is China\u0027s premier down apparel brand. Its Uniwalk flagship store showcases high-end collaboration lines with top international designers. Featuring a high-tech thermal experience zone, the apparel breaks away from traditional bulky down wear with sleek, urban stylish designs, making it the go-to shop for locals seeking high-tech winter outerwear.", "name": "Bosideng Flagship Store (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}, {"address": "L1, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.6 stars | Must-Buys: Champion series running shoes, Nitrogen Tech basketball shoes, retro dad sneakers. As China\u0027s leading sportswear giant, ANTA built a massive experiential flagship store in Bao\u0027an Center. Offering a full lineup of professional athletic shoes and trendy activewear, the store highlights cutting-edge midsole cushioning tech and supreme comfort, highly recommended by local sports enthusiasts and streetwear fans.", "name": "ANTA Flagship Store (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}, {"address": "L2, Qianhai MixC, No. 5059 Tinghai Avenue, Nanshan District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.7 stars | Must-Buys: Lace-embroidered dresses, classic tailored suits, cashmere knits. Koradior is a signature brand under Shenzhen\u0027s local luxury fashion group EEKA Fashion. The Qianhai MixC boutique creates a shopping environment infused with French romance and modern luxury. Renowned for exquisite lace craft, sleek tailoring, and elegant color palettes, it is beloved by local corporate women and socialites.", "name": "Koradior (Qianhai MixC Store)", "transport": "Approx. 300m walk from Exit E of Guiwan Station, Metro Line 5"}, {"address": "L2, Uniwalk Shopping Mall, Center Area, Xin\u0027an Street, Bao\u0027an District, Shenzhen, Guangdong Province", "feature": "\u2b50 4.8 stars | Must-Buys: Deconstructivist tailored tops, natural cotton-linen maxidresses, original handmade fabric bags. BANXIAOXUE is a renowned Chinese independent designer brand famous for its nature-inspired philosophy and deconstructed tailoring. The store at Bao\u0027an Uniwalk exudes a Zen vibe and Oriental aesthetic. Focusing on natural materials and unique artistic textures, it\u0027s a must-visit highlight for shoppers seeking unique tastes and niche quality.", "name": "BANXIAOXUE (Uniwalk Store)", "transport": "Direct access from Exit F of Bao\u0027an Center Station, Metro Lines 1/5"}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "B2 Floor, Uniwalk, Baohua Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Try: Signature Sweet Wife Cake, Traditional Egg Yolk Pastry, Cantonese Signature Crispy Pastry. Originating in Bao\u0027an, Shenzhen, Maixuan is a century-old brand recognized for its Intangible Cultural Heritage and long history of Cantonese pastry craftsmanship. Its Wife Cakes feature flaky, layered crusts with a sweet, perfectly balanced filling. The Egg Yolk Pastries contain whole savory salted egg yolks for a rich, textured bite. It is a top-choice gift representing authentic local Bao\u0027an culture.", "name": "\u9ea5\u8ed2\u9905\u5bb6 (Maixuan Bakery - Bao\u0027an Uniwalk Store)", "transport": "Metro Line 1/5 Bao\u0027an Center Station, Exit F, about 200m walk"}, {"address": "No. 1 Guiwan 3rd Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | Must-Try: Original Swiss Roll, Calamansi Lime Juice, Durian Mille Crepe Cake. Located in Qianhai, this flagship store is a shopping haven for both tourists and locals buying snacks and souvenirs in bulk. The Swiss rolls are dense, soft, and moist with a rich cream filling, while the calamansi juice is refreshing and sweet-tart. The extra-large packaging is perfect for sharing with family and friends or group buys.", "name": "\u524d\u6d77\u5c71\u59c6\u6703\u54e1\u5e97 (Sam\u0027s Club Qianhai Flagship)", "transport": "Metro Line 1 Liyumen Station, Exit A, transfer to shuttle bus or walk about 10 minutes"}, {"address": "Shop B2-026, B2 Floor, Uniwalk, Baohua Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Try: Seaweed Meat Floss Cake (Xiaobei), Lemon Yogurt Tart, Cod Floss Cake. A hugely popular bakery in Shenzhen that constantly draws long queues with every fresh batch. The classic Seaweed Meat Floss Cake is packed with crispy seaweed and generous meat floss over a soft sponge cake filled with savory salad dressing. The perfect mix of sweet and savory makes it addictively good\u2014an iconic internet-famous snack souvenir.", "name": "\u9b91\u5e2b\u5085\u7cd5\u9ede (Bao Master - Uniwalk Bao\u0027an Store)", "transport": "Metro Line 1/5 Bao\u0027an Center Station, Exit F, directly connected to Uniwalk B2 Floor"}, {"address": "B1 Floor, Uniwalk, Baohua Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Try: Danish Butter Shortbread, Signature Cheese Toast, Cheese Souffl\u00e9. A premier local Shenzhen bakery brand beloved by young locals. Its Danish butter shortbread is richly aromatic, flaky, and melt-in-your-mouth. Beautifully packaged, it makes a high-quality local souvenir to bring back for friends and family.", "name": "\u5361\u746a\u738b\u5b50 (Prince Kama Bakery - Bao\u0027an Uniwalk Store)", "transport": "Metro Line 1/5 Bao\u0027an Center Station, Exit F, about 150m walk"}, {"address": "B2 Floor, Uniwalk, Baohua Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Try: Iced Chestnuts, Freeze-Dried Strawberry Yogurt Bites, Crispy Citrus Slices. A premium Chinese chain for roasted nuts and dried fruits, extremely popular in the Bao\u0027an Center area. Its signature iced chestnuts are processed with a special technique, offering a silky, gelato-like chestnut puree texture when chilled. The freeze-dried strawberry yogurt bites perfectly preserve fruit aromas and creamy yogurt flavors, making them a must-buy snack for trendy young shoppers.", "name": "\u859b\u8a18\u7092\u8ca8 (Xue Ji Roasted Seeds and Nuts - Uniwalk Bao\u0027an Store)", "transport": "Metro Line 1/5 Bao\u0027an Center Station, Exit F, directly connected to Mall B2 Floor"}, {"address": "B2 Floor, Uniwalk, Baohua Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Try: Original Walnut Pastry (Taosu), Old Beijing Sesame Cake, Savory Fresh Pork Mooncake. A renowned bakery famous for traditional Chinese walnut pastries (Taosu), known for their crumbly texture, subtle sweetness, and rich nostalgic milky aroma. Freshly baked on-site, a full box captures authentic classic Chinese pastry flavors\u2014affordable, easy to store, and highly representative as a gift.", "name": "\u7018\u6eaa\u6cb3\u6843\u9165 (Luxihe Bakery - Uniwalk Bao\u0027an Store)", "transport": "Metro Line 1/5 Bao\u0027an Center Station, Exit F, about 200m walk"}, {"address": "L1 Floor, MixC Qianhai, No. 169 Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Try: Inspiration Tea Gift Box, Tea Sandwich Cookies, Freeze-Dried Fruit Tea Bags. Beyond fresh-made drinks, HEYTEA\u0027s MixC Qianhai store features a dedicated section for stylish tea gift boxes and snacks. The modern Inspiration Tea Gift Box includes exclusive high-mountain Oolong and Black tea bags paired with aromatic tea-infused sandwich cookies\u2014a stylish gift ideal for design- and lifestyle-conscious friends.", "name": "\u559c\u8336 (HEYTEA - MixC Qianhai Store)", "transport": "Metro Line 5 Guiwan Station, Exit E, about 300m walk"}, {"address": "B1 Floor, MixC Qianhai, No. 169 Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Try: Sea Salt Honey Cake, Crispy Shrimp Chips, Hand-Torn Sourdough Bread. A popular high-end fresh produce supermarket in Qianhai whose bakery and snack sections are a treasure trove for tasty treats. The sea salt honey cake is moist and sweet with a lovely sweet-and-salty balance, while the shrimp chips are intensely savory and crunchy. A favorite spot among locals and tourists alike to stock up on delicious snacks.", "name": "\u76d2\u99ac\u9bae\u751f (Freshippo - Qianhai MixC Store)", "transport": "Metro Line 5 Guiwan Station, Exit E, directly connected to MixC Qianhai B1 Floor"}], "name": "Must-Buy Souvenirs \u0026 Specialty Snacks"}, "cat_4": {"items": [{"address": "Manfun World, Songgang Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic Nike cushioned running shoes, signature Coach printed tote bag, Max Mara cashmere coat. Located in Manfun World, Bao\u0027an, Shenzhen, Shanshan Outlet Mall is a highly popular large-scale discount shopping center in the suburbs, gathering nearly 300 well-known international and domestic brands. Famous for its unbeatable value for money, it offers deep discounts starting as low as 90% off all year round. It\u0027s an ideal one-stop destination for travelers seeking luxury apparel and sports gear.", "name": "Shenzhen Shanshan Outlet Mall", "transport": "Take Metro Line 11 to Songgang Station, then transfer to Bus M291 to Manfun World Station"}, {"address": "No. 169 Guiwan 4th Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Buy List: Jo Malone scented candles, niche luxury perfumes, limited-edition designer handbags. MixC Qianhai is a premier fashion landmark in the Qianhai area, showcasing high-quality lifestyle aesthetics and luxury shopping experiences. The mall features numerous top international brands and debut stores, seamlessly combining art exhibitions and lush greenery to create an ultra-elegant shopping atmosphere highly favored by stylish locals and visitors.", "name": "MixC Qianhai", "transport": "Directly accessible via Exit A of Guiwan Station on Metro Line 5"}, {"address": "No. 99 Xinhu Road, Xin\u0027an Street, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.8 stars | Must-Buy List: Chinese-chic cultural canvas bags, trendy limited-edition art toys, exquisite handcrafted ceramic mugs. Uniwalk Bao\u0027an is one of Shenzhen\u0027s largest single-building shopping malls, housing over 500 brands. From high-end fashion and specialty cuisine to trendy pop-up shops, it has it all. Featuring an exceptionally spacious layout and excellent family-friendly facilities, this modern complex is the most iconic shopping landmark in Bao\u0027an District.", "name": "Uniwalk Bao\u0027an", "transport": "Directly accessible via Exit F of Bao\u0027an Center Station on Metro Line 1 or 5"}, {"address": "No. 5059 Tinghai Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buy List: Original designer jewelry, luxury organic fragrance skincare products, specialty coffee bean gift sets. As a shiny new commercial gem in the Qianhai area, Uniworld Qianhai centers around an \u0027urban oasis\u0027 concept, blending lush greenery with fashion retail. It hosts a variety of exquisite independent designer brands, boutique select stores, and outdoor lifestyle hubs, offering young consumers a stylish and relaxing shopping environment.", "name": "Uniworld Qianhai", "transport": "3-minute walk from Exit B of Tinghai Avenue Station on Metro Line 5"}, {"address": "Floor 3, Uniwalk Bao\u0027an, No. 99 Xinhu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Buy List: Signature \u0027Mi\u0027 canvas bags, Shenzhen city-themed stationery sets, hardcover architecture and design books. Mi Bookstore is a unique local Shenzhen bookstore and cultural brand, once honored as \u0027China\u0027s Most Beautiful Bookstore.\u0027 Its visually striking interior seamlessly merges reading spaces with lifestyle goods and original cultural products. Visitors can pick up locally designed items and stationery while immersing themselves in the city\u0027s rich cultural vibe.", "name": "Mi Bookstore (Bao\u0027an Uniwalk)", "transport": "Directly accessible via Exit F of Bao\u0027an Center Station on Metro Line 1 or 5"}, {"address": "Floor 2, Uniwalk Bao\u0027an, No. 99 Xinhu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Buy List: UV-protection pocket umbrellas, high-tech cooling sun-protective clothing, lightweight foldable sunglasses. Beneunder is a famous Shenzhen-founded outdoor and sun-protection lifestyle brand, renowned for products that blend stylish aesthetics with high-tech sun defense. Featuring a minimalist modern store design, it offers the latest lightweight outdoor gear and comprehensive sun accessories\u2014a must-visit shopping spot for coastal and southern trips.", "name": "Beneunder (Bao\u0027an Uniwalk)", "transport": "Directly accessible via Exit F of Bao\u0027an Center Station on Metro Line 1 or 5"}, {"address": "Floor 1, Bao\u0027an Max City, Haixiu Road, Bao\u0027an District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buy List: Domestic botanical facial masks, imported makeup sponge sets, stylishly packaged snack gift boxes. KKV is an ultra-popular Chinese lifestyle concept mega-store known for its iconic yellow container design and neatly arranged \u0027rainbow walls.\u0027 Offering tens of thousands of budget-friendly items across cosmetics, fashion accessories, imported foods, and lifestyle goods, it\u0027s a hot spot for youngsters to hunt for fun finds and unique gifts.", "name": "KKV (Bao\u0027an Max City Flagship)", "transport": "Directly accessible via Exit A of Pingzhou Station on Metro Line 1"}, {"address": "Level 2, MixC Qianhai, Qianhai Shenzhen-Hong Kong Modern Service Industry Cooperation Zone, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 stars | Must-Buy List: Handcrafted solid wood mortise-and-tenon coasters, original bamboo-woven scented candle holders, minimalist handmade ceramic tea sets. FNJI is an iconic Chinese independent furniture and home aesthetics brand. The MixC Qianhai location masterfully merges Oriental Zen philosophy with modern minimalist design. Beyond stunning solid wood furniture, the store offers exquisite handcrafted home g New District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buys: Pien Tze Huang Pearl Cream, Mayinglong Longzhu Ointment, gNreal Pearl Sheet Masks. A time-honored state-owned pharmacy located in the heart of Dapeng Subdistrict. It features a dedicated counter for domestic beauty brands and traditional Chinese herbal cosmetics, selling classic and highly effective heritage skincare products trusted for generations.", "name": "Sinopharm Accord Pharmacy (Dapeng Branch)", "transport": "Take Bus E11 to \u0027Dapeng Center Station\u0027 and walk for about 6 minutes."}, {"address": "No. 58 Haibin Road, Jiaochangwei, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buys: Deep-Sea Kelp Hydration Mask, Ocean Mineral Body Scrub, Handcrafted Sea Salt Cleansing Soap. A unique local skincare boutique inspired by the abundant ocean resources of the Dapeng Peninsula. Featuring chemical-free formulas packed with marine minerals and seaweed extracts, its products are specifically designed to hydrate and repair skin after a day in the coastal sun.", "name": "Haifeng Herbal \u0026 Seaweed Skincare Shop", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027 and walk to Haibin Road."}, {"address": "Shop L1-12, 1F, Kaisa Plaza, Lingnan Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 Stars | Must-Buys: Watsons Bird\u0027s Nest Hydrating Mask, After-Sun Cooling Soothing Gel, Ultra-Fine High-SPF Sunscreen Spray. Situated inside Kaisa Plaza, the largest shopping mall in Dapeng New District. Offering an extensive array of international beauty items, Japanese skincare, and popular local brands, it serves as the ultimate hub for residents and tourists stocking up on modern cosmetics and personal care products.", "name": "Watsons (Kaisa Plaza Dapeng Branch)", "transport": "Take Bus E11 or M362 directly to \u0027Dapeng Kaisa Plaza Station\u0027."}, {"address": "No. 16 Dongmen Street, Dapeng Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.8 Stars | Must-Buys: Traditional Herbal Acne Cream, Honeysuckle Soothing Spray, Herbal Pearl Whitening Cream. Nestled on the old street of Dapeng Ancient City, this herbal beauty boutique champions traditional Chinese wellness concepts. Offering on-site herbal skin consultations and skincare products formulated with local botanical extracts, it\u0027s a popular spot for visitors eager to experience time-tested beauty rituals.", "name": "Dapeng Bencao Chinese Herbal Beauty", "transport": "Take Bus M274 to \u0027Dapeng Fortress Station\u0027, enter through the ancient city\u0027s East Gate, and walk for about 2 minutes."}, {"address": "No. 88 Yingbin Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.2 Stars | Must-Buys: Pechoin Hydrating Set, Biaoting Vitamin E Emulsion, Ricqles Peppermint Oil. A well-established local chain pharmacy deeply rooted in Shenzhen communities. It features a dedicated domestic beauty section filled with budget-friendly, high-value classic Chinese cosmetic items and everyday personal care essentials.", "name": "Wanmin Pharmacy (Dapeng Yingbin Road Branch)", "transport": "Take Bus M818 or 833 to \u0027Dapeng State Taxation Bureau Station\u0027 and walk for about 3 minutes."}, {"address": "No. 22 Haibin North Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buys: Lavender Soothing Essential Oil, Sea Salt Body Scrub, High-Concentration After-Sun Aloe Vera Gel. A charming boutique located near the Nanao coastal area on the Dapeng Peninsula. Blending resort vibes with aromatherapy, it specializes in plant essential oils, natural sea salt body care, and after-sun relief products\u2014a go-to restock spot after enjoying water sports at the beach.", "name": "Nanao Seaside Cosmetics \u0026 Essential Oils", "transport": "Take Bus M274 or E11, transfer to Bus M321, get off at \u0027Nan\u0027ao Hotel Station\u0027, and walk for about 4 minutes."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 58 Jiaochangwei Road, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade resort-style straw woven bags, Bohemian tassel sun hats. Tucked away in the alleys of Jiaochangwei Beach, this shop specializes in a variety of purely handcrafted beach resort bags and exquisite straw hats. The owner uses natural plant fibers for weaving, making the items lightweight and moisture-resistant. They are essential accessories for local tourists taking beach photos and are hugely popular among Instagrammers and female shoppers.", "name": "Jiaochangwei Sea Breeze Handmade Woven Bag \u0026 Accessories Store", "transport": "Take Bus M274 or M321 to Jiaochangwei Station, then walk for about 3 minutes."}, {"address": "No. 18 Zhengjie Street, Dapeng Fortress, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.8 stars | Must-Buy List: Ming-style vintage embroidered handbags, handmade embroidered traditional pouches. Located near the General\u0027s House in the ancient town, this shop draws inspiration from the history of Dapeng Fortress as a Ming Dynasty military stronghold. It specializes in high-quality Hanfu and vintage accessories. The embroidered totes and vintage scented pouches feature exquisite craftsmanship, recreating an elegant antique charm. Many tourists come specifically to pick out full traditional outfits for photo shoots.", "name": "Dapeng Fortress Ming Style Hanfu \u0026 Vintage Bags", "transport": "Take Bus M471 to Dapeng Fortress Station, enter Zhengjie Street, and walk for about 5 minutes."}, {"address": "No. 22 Haibin Road, Jiaochangwei, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.5 stars | Must-Buy List: Professional UV-protection rash guards, non-slip amphibious beach shoes. Located at the heart of the Jiaochangwei B\u0026B area, this store is highly recommended by local surfing enthusiasts and outdoor adventurers. It offers a wide selection of professional long-sleeved UV rash guards, trendy quick-dry shorts, and non-slip waterproof beach shoes, perfectly blending practical protection with island streetwear style.", "name": "Jiaochangwei Surfer Apparel \u0026 Watersports Gear", "transport": "Take Bus M274 to Jiaochangwei Station, then walk towards the beach for about 4 minutes."}, {"address": "No. 35 Nanmen Street, Dapeng Fortress, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.7 stars | Must-Buy List: Solid-color loose cotton-linen dresses, handmade linen totes. This local boutique focuses on a natural, minimalistic style, emphasizing breathable cotton and linen fabrics ideal for Dapeng Peninsula\u0027s hot and humid coastal climate. The clothing features clean, generous cuts with soft, natural tones. It also offers rustic handmade linen bags and scarves, perfectly embodying a slow-living aesthetic.", "name": "Dapeng Ancient Town Cotton \u0026 Linen Lifestyle Wear", "transport": "Take Bus M471 or B753 to Dapeng Fortress Station, enter through the South Gate, and walk for about 3 minutes."}, {"address": "No. 10 West 3rd Lane, Jiaochangwei, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.4 stars | Must-Buy List: Oceanian-style floral beach dresses, Dapeng limited-edition creative canvas bags. Designed specifically for seaside vacations, this boutique offers a rich selection of tropical print dresses, jumpsuits, and bikini cover-ups. Additionally, their custom-printed Dapeng beach-themed canvas bags are spacious, durable, and one of the most popular local souvenir bags among visitors.", "name": "Jiaochangwei Seaside Floral Dress \u0026 Canvas Bag Shop", "transport": "Take Express Bus E11 to Dapeng Center Station, transfer to Bus M274 to Jiaochangwei Station, then walk for about 5 minutes."}, {"address": "No. 12 Dongmen Lane, Dapeng Fortress, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.9 stars | Must-Buy List: Handcrafted vegetable-tanned leather totes, retro handmade genuine leather sandals. Tucked away in an ancient alley of Dapeng Fortress, this independent leather workshop features a craftsman with years of experience in leather carving and shoemaking. The workshop displays and sells handcrafted leather bags, shoes, and key pouches made on-site. Durable and rich in character, many customers come specifically to order custom-made leather bags.", "name": "Fortress Vintage Leather Craft \u0026 Shoes Workshop", "transport": "Take Bus M471 to Dapeng Fortress Station, enter Dongmen Lane, and walk for about 4 minutes."}, {"address": "No. 44 Team 2, Jiaochangwei, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.3 stars | Must-Buy List: Shell-decorated handmade espadrilles, starfish crossbody mini bags. The items in this boutique cleverly incorporate marine elements from the Dapeng Peninsula, combining natural shells, pearls, and woven fabrics to create unique footwear and bags. The handcrafted shell-adorned shoes offer comfortable cushioning and eye-catching designs, making them perfect for beach strolls.", "name": "Seaside Shells Original Accessories \u0026 Shoes Boutique", "transport": "Take Bus M321 to Jiaochangwei Bus Terminus, then walk for about 3 minutes."}, {"address": "No. 15 Zone 1, Ling\u0027ao New Village, Dapeng New District, Longgang District, Shenzhen City", "feature": "\u2b50 4.6 stars | Must-Buy List: Lightweight windproof quick-dry jackets, high-traction outdoor trekking shoes. Home to famous coastal hiking routes (such as the Dongchong-Xichong coastline trek), Dapeng Peninsula inspires this store to cater to hikers and climbers. It offers professional windproof jackets, breathable performance pants, and high-grip footwear. With excellent gear quality, it is the ideal spot for travelers planning outdoor adventures on the peninsula to gear up.", "name": "Dapeng Peninsula Outdoor Apparel \u0026 Trekking Shoes", "transport": "Take Bus E11 or H92 to Dapeng Center Station, then walk for about 6 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "No. 7 Chengdong Street, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-buy list: Pengcheng Lai Fun (Rice Noodles) Gift Box, Handmade Tea Cakes, Mung Bean Cakes. As the most iconic traditional food brand in Dapeng Fortress, its souvenir shop packages centuries of Hakka and Tanka culinary tradition into elegant gift sets. The signature Pengcheng Lai Fun is made from premium rice, offering a smooth, springy texture that recreates authentic ancient town flavors when paired with their special seafood soup base. Freshly handcrafted daily, the tea cakes feature rich, non-cloying fillings\u2014making them the perfect gift to explore Dapeng\u0027s traditional food culture.", "name": "Pengcheng Restaurant Souvenir Shop", "transport": "Take Bus M471 or M457 to \u0027Dapeng Fortress Station\u0027 (Dapeng Suocheng), then walk for about 3 minutes."}, {"address": "No. 18 Seafood Street, Haibin North Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Sun-dried Nan\u0027ao Laver (Nori), Premium Dried Scallops, Sea Urchin Sauce. Nan\u0027ao Fishing Port is Dapeng Peninsula\u0027s most famous seafood origin, and this long-standing dried seafood shop is loved by locals and tourists alike. Their Nan\u0027ao laver is hand-harvested by local fishermen and naturally sun-dried, offering pure quality and rich umami flavor. Their house-made sea urchin sauce is the ultimate condiment for rice or noodles, perfectly locking in the rich sweetness of South China Sea sea urchins.", "name": "Nan\u0027ao Dried Seafood Specialty Shop", "transport": "Take Bus E11 to \u0027Nan\u0027ao Yueliangwan Station\u0027, then walk for about 5 minutes."}, {"address": "No. 12 Nanmen Street, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-buy list: Fevervine Cake (Jitengteng Gao), Mugwort Tea Cakes, Shredded Radish Tea Cakes. Hidden deep in an ancient alley of Dapeng Fortress, this traditional pastry shop sticks to old-style manual kneading and steaming. The Fevervine Cake mixes fresh local fevervine leaves into glutinous rice flour, lending a unique herbal aroma and health benefits. The Mugwort Tea Cakes have a chewy outer skin wrapped around fragrant crushed peanuts and sesame, offering a nostalgic local treat rich in Dapeng character.", "name": "Gucheng Handcrafted Tea Cake Shop", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027 (Dapeng Suocheng), enter via the South Gate, and walk for about 2 minutes."}, {"address": "No. 33 Haibin Road, Jiaochangwei, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-buy list: Marine-themed Shell Crafts, Dapeng Postcard Sets, Crispy Coconut Thin Cracker. Located along the coastal promenade of Jiaochangwei Homestay Town, this charming shop overflows with oceanic vibe. Besides handmade accessories crafted from natural shells collected along the Dapeng coastline, it also offers exclusively developed coconut thin crackers\u2014crispy, sweet, and beautifully packaged with custom Dapeng landscape illustrations, making it a stylish souvenir.", "name": "Jiaochangwei Beach Souvenir \u0026 Cultural Store", "transport": "Take Bus M471 to \u0027Jiaochangwei Station\u0027, then walk to Haibin Road for about 5 minutes."}, {"address": "Next to General\u0027s Mansion, Zheng Street, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-buy list: General\u0027s Seafood Tea Bag Gift Box, Dapeng Fortress Roof Tile Chocolates, Ming \u0026 Qing Dynasty Fortress Metal Bookmarks. This specialty store ingeniously blends coastal defense heritage with modern creative products. The top-selling General\u0027s Tea features high-mountain Oolong tea curated to pair perfectly with seafood meals. The roof tile chocolates draw design inspiration from the grey tiles of ancient Dapeng Fortress buildings; not only are they visually striking, but the rich chocolate is also delightfully tasty, making them a hit among young travelers.", "name": "General Mansion Cultural \u0026 Creative Shop", "transport": "Take Bus M457 to \u0027Dapeng Fortress Station\u0027 (Dapeng Suocheng), then walk for about 4 minutes."}, {"address": "No. 28 Dongmen Street, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-buy list: Traditional Peanut Candy, Black Sesame Crispy Candy, Handcrafted Maltose Biscuits. Spanning three generations, this artisanal candy shop crafts its sweets entirely through traditional cauldron boiling and hand-stretching techniques. Their peanut candy features select large peanuts roasted to perfection and coated in a thin layer of maltose, offering a crispy bite that doesn\u0027t stick to your teeth. The black sesame candy has a balanced sweetness and a long-lasting, fragrant sesame aroma\u2014a beloved traditional snack for all ages.", "name": "Pengcheng Traditional Handcrafted Candy Store", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027 (Dapeng Suocheng), then walk for about 4 minutes."}, {"address": "No. 1 Seafood Market, Haibin Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Sun-Dried Mackerel, Supreme Fish Gelatin (Fish Maw), Ready-to-Eat Spicy Small Fish. Located in the core pier area of Nan\u0027ao Fishing Port, this store focuses on high-end, premium seafood gifts. The sun-dried mackerel is crafted under strict salinity and sun exposure controls, resulting in firm texture and delicious savory flavor. Their canned ready-to-eat spicy small fish, specially created for tourists, can be enjoyed immediately and serves as an ideal local snack to pair with beer or rice.", "name": "Nan\u0027ao Fishing Port Specialty Store", "transport": "Take Bus M274 to \u0027Nan\u0027ao Fishing Port Station\u0027, then walk for about 2 minutes."}, {"address": "Inside Dapeng Beautiful Countryside Scenic Area, Dongshansi Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-buy list: Dried Dapeng Lychees, Kiln-Roasted Chicken Flavored Snack Chips, Wildflower Honey. This center brings together produce from across the Dapeng Peninsula Eco-Agricultural Zone. Renowned for its premium Lingnan lychees, Dapeng yields lychee dried during peak season that features thick, naturally sweet flesh. Additionally, the exclusive crisp chips flavored after the famous local dish \u0027Dapeng Kiln-Roasted Chicken\u0027 offer a unique snack found nowhere else.", "name": "Dapeng Beautiful Countryside Specialty Produce Pavilion", "transport": "Take Bus M471 to \u0027Dongshan Temple Station\u0027 (Dongshansi), then walk for about 6 minutes."}], "name": "Must-Buy Specialties, Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen (Near the entrance to Dapeng Peninsula)", "feature": "\u2b50 4.6 stars | Must-buy list: Discounted off-season Nike sneakers, classic printed Coach bags, limited-edition Adidas windbreakers on sale. This European-town-style Outlet located along Shenzhen\u0027s eastern coastline is the ultimate shopping paradise to visit en route to Dapeng Peninsula. Designed as an open-air pedestrian block, it brings together over 200 world-renowned and major sports/leisure brands, offering year-round discount deals from 10% to 50% off. Enjoy shopping in a serene lakeside setting while taking in the refreshing ocean breeze.", "name": "Dameisha 8th Warehouse Outlet", "transport": "Take Metro Line 8 to Dameisha Station, Exit B, and walk for about 5 minutes."}, {"address": "No. 68 Lingnan Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-buy list: Dapeng seafood gift boxes, Nayuki\u0027s Tea classic Supreme Cheese Strawberry, casual wear from local brands. As the largest and most fully equipped comprehensive shopping mall on the Dapeng Peninsula, this is the top choice for both locals and tourists to resupply and shop. Blending fashion retail, local culinary delights, and entertainment, the plaza hosts many emerging Chinese designer brands and unique eateries, showcasing the vibrant daily life of modern Dapeng.", "name": "Dapeng Kaisa Plaza", "transport": "Take Bus E11 or M274 to \u0027Dapeng Center Station\u0027 and walk for about 3 minutes."}, {"address": "No. 22 Neizheng Street, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Vintage postcards of Dapeng General\u0027s Mansion, hand-painted coastal defense canvas bags, limited-edition ancient architecture models of the Fortress. Rich in local history, this independent cultural and creative boutique is located along the ancient streets of Dapeng Fortress. The shop transforms symbols from the Ming and Qing coastal defense fortress into exquisite everyday goods and stationery. Featuring a nostalgic vintage decor, it\u0027s the perfect spot to pick up souvenirs imbued with Dapeng\u0027s unique cultural heritage.", "name": "Dapeng Fortress Impression Cultural \u0026 Creative Store", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027, enter the ancient city, and walk about 200 meters."}, {"address": "No. 35 Haibin Road, Jiaochangwei, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-buy list: Handmade seashell accessories, woven sun straw hats, island-style printed cotton dresses. Located in the Jiaochangwei B\u0026B town\u2014often dubbed Shenzhen\u0027s \u0027Gulangyu\u0027\u2014this independent lifestyle shop blends beach resort vibes with hip, artistic flair. Selling seaside lifestyle items and handmade jewelry crafted by local Shenzhen artists, it is a must-visit boutique for tourists vacationing in Jiaochangwei looking to hunt for unique treasures.", "name": "Jiaochangwei Seaside Breeze Lifestyle Shop", "transport": "Take Bus M471 or M09 to \u0027Jiaochangwei Station\u0027 and walk to the waterfront district."}, {"address": "No. 26 Kuizheng West Road, Kuiyong Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-buy list: Local Shenzhen herbal tea gift boxes, specialty dried seafood snacks, independent designer sandals. Developed by China Merchants Shekou in Dapeng, this modern community shopping plaza combines local cultural creativity with boutique retail. It features popular Guangdong chain brands alongside long-standing local select shops, offering a relaxed and comfortable environment to explore Dapeng\u0027s modern shopping scene.", "name": "China Merchants Dapeng Commercial Plaza", "transport": "Take Bus E26 to \u0027Kuiyong Center Station\u0027 and walk for about 5 minutes."}, {"address": "No. 12 South Gate East Lane, Dapeng Fortress, Dapeng New District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-buy list: Traditional Hakka Lai Fun noodle gift boxes, handmade traditional Cha Guo snacks, Dapeng Hakka floral fabric bags. Co-run by a local elderly Hakka woman and young entrepreneurs, this charming local shop perfectly embodies the Hakka heritage and coastal defense culture of Dapeng Fortress. The handicrafts and regional specialties sold here strictly adhere to ancient traditional techniques, attracting many visitors eager to experience authentic local Dapeng culture.", "name": "Fortress Ah-Po Traditional Handmade Gift Shop", "transport": "Take Bus M471 to \u0027Dapeng Fortress Station\u0027, enter the ancient city through the South Gate, and walk about 150 meters."}, {"address": "Intersection of Haibin North Road and Haikui Road, Nan\u0027ao Subdistrict, Dapeng New District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-buy list: Nan\u0027ao wild dried golden hook shrimps, handmade sun-dried squid, premium dried abalone. Situated in Nan\u0027ao Town at the southern tip of Dapeng Peninsula, this arcade is Dapeng\u0027s most iconic local fishery and dried seafood shopping street. Lined with dozens of decades-old shops run by local fishermen, it offers authentic, high-quality dried seafood and sea-derived gift sets, delivering an unmissable local shopping experience for peninsula visitors.", "name": "Nan\u0027ao Seafood \u0026 Local Specialty Shopping Arcade", "transport": "Take Bus E11 to \u0027Nan\u0027ao Yueliangwan Station\u0027 and walk for about 3 minutes."}, {"address": "Intersection of Kuiping Road and Pingkui Road, Dapeng New District, Shenzhen", "feature": "\u2b50 4.1 stars | Must-buy list: Skincare sets from domestic beauty chains, specialty Hakka yellow wine, original American vintage T-shirts. Located at the entryway of Kuiyong in Dapeng New District, this comprehensive shopping plaza features numerous independent clothing boutiques and lifestyle stores. Alongside large supermarket chains and dining options, it houses a dedicated showcase zone for Dapeng local specialties, making it an excellent stop to restock and shop local brands before exploring deeper into the peninsula.", "name": "Kuiyong Fantasia Commercial Plaza", "transport": "Take Bus E11 or M362 to \u0027Kuiyong Middle School Station\u0027 and walk for about 4 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dapeng Peninsula and Dapeng Fortress"}, "futian_cbd": {"categories": {"cat_1": {"items": [{"address": "No. 1 Huafa North Road, Huaqiangbei Street, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Winona Anti-Redness Soothing Repair Cream, Grain Rain Whitening Serum, Perfect Diary Animal Eyeshadow Palette. Located in the heart of Huaqiangbei, this former traditional electronics market has transformed into the largest beauty wholesale and retail distribution center in Shenzhen and nationwide. Home to thousands of cosmetics stalls, it offers everything from emerging domestic brands to international giant labels at highly competitive prices\u2014a treasure-hunting paradise for young women and beauty vloggers.", "name": "Mingtong Beauty World", "transport": "About 300m walk from Exit A of Yannan Station (Metro Line 2), or 5-min walk from Exit B of Huaqiangbei Station (Metro Line 3)"}, {"address": "Floor B1, Futian Galaxy COCO Park, No. 269 Fuhua 3rd Road, Futian District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-buy list: Biohyalux Hyaluronic Acid Ampoule Serum, Filorga Meso-Mask, Valmont Prime Renewing Pack. Born in Shenzhen, AFIONA is a leading high-end beauty retail chain in China with its headquarters located right in the city. The COCO Park store features a modern, sophisticated decor focusing on premium skincare and boutique C-beauty products. Professional skin testing and sample trial services are provided, delivering an exceptional shopping experience favored by local white-collar workers and business professionals.", "name": "AFIONA BEAUTY (Futian COCO Park)", "transport": "Direct access from Exit C of Shopping Park Station (Metro Line 1 or Line 3)"}, {"address": "L150, Floor L1, East Zone, One Avenue, No. 348 Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-buy list: HARMAY Cosmetics Sample Mystery Box, To Summer Customized Fragrance Samples, Fig Hand Cream. As one of China\u0027s most influential warehouse-style beauty multi-brand stores, this massive location at One Avenue features a distinctive industrial aesthetic with exposed steel pipes and scaffolding. Showcasing over 10,000 beauty and skincare products, its biggest draw is the dazzling array of travel-sized luxury minis and hot domestic skincare items, allowing customers to try top-tier products at budget-friendly prices.", "name": "HARMAY (One Avenue)", "transport": "About 200m walk from Exit B of Gangxia Station (Metro Line 1 or Line 10)"}, {"address": "FG002, Floor G, Link CentralWalk, No. 138 Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-buy list: Flower Knows Unicorn Blush, Carslan Slim Velvet Lipstick, Judydoll Single Eyeshadow. Headquartered in Guangdong, this wildly popular domestic beauty store chain is famous for its visually stunning makeup sponge walls and rainbow display walls. Focusing purely on cosmetics, it stocks over 100 affordable trendy brands from China and abroad. With a 100% open-trial system and zero pressure selling, it\u0027s the ultimate go-to spot for young shoppers wanting to try endless swatches.", "name": "THE COLORIST (Link CentralWalk)", "transport": "About 150m walk from Exit B of Convention \u0026 Exhibition Center Station (Metro Line 1 or Line 4)"}, {"address": "Floor L1, Excellence INTOWN Shopping Center, No. 2030 Jintian Road, Futian District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-buy list: Colorkey Air Lip Glaze, Chioti Gentle Makeup Remover, Maogeping Foundation Balm Sample. Hailing from Guangdong, this mega lifestyle and beauty flagship features a massive section dedicated to domestic C-beauty brands. The vibrant yellow, container-style industrial space is a visual treat. Its beauty zone covers lip glosses, eyeshadows, face masks, and beauty tools in satisfyingly neat layouts, offering great quality at affordable prices\u2014a favorite daily restock hub for local youth.", "name": "KKV (Excellence INTOWN)", "transport": "About 500m walk from Exit E of Convention \u0026 Exhibition Center Station (Metro Line 1 or Line 4)"}, {"address": "N131, North Zone, One Avenue, Fuhua 1st Road, Futian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Maogeping Light \u0026 Shadow Sculpting Balm, To Summer Scented Candle, Zhiben Cleansing Oil. HAYDON is a trailblazing avant-garde beauty retail brand. Its One Avenue store features a futuristic space-tech atmosphere combined with art gallery aesthetics. Curating top-rated hero products from high-end international skincare to trending C-beauty icons, it covers everything from cleansing and skincare to home fragrances\u2014a unique venue perfect for both photo-ops and immersive shopping.", "name": "HAYDON (One Avenue Flagship)", "transport": "About 300m walk from Exit 12 of Gangxia North Station (Metro Line 2)"}, {"address": "Floor B1, PAFC Mall, Ping An Finance Centre, No. 5033 Yitian Road, Futian District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-buy list: Voolga Medical Sodium Hyaluronate Repair Facial Mask, Mannings Lanolin Cream, Yangshengtang Natural Vitamin E. Located inside the podium mall of Ping An Finance Centre (Shenzhen\u0027s tallest skyscraper), this Mannings operates as a modern boutique pharmacy-style flagship. Beyond conventional healthcare and personal care products, it features a vast array of medical-grade beauty masks and restorative serums, backed by professional pharmacist consultation\u2014a trusted destination for customers focused on skin health and post-procedure care.", "name": "Mannings (PAFC Mall)", "transport": "Directly connected to the underground concourse from Exit D of Shopping Park Station (Metro Line 1 or Line 3)"}, {"address": "B132, Floor B1, Catic Plaza, No. 1 Zhonghang Road, Futian District, Shenzhen", "feature": "\u2b50 4.1 stars | Must-buy list: Watsons Bird\u0027s Nest Brightening Mask, Collagen Nourishing Hand Cream, Florasis Peach Blossom Pressed Powder. Adjacent to the bustling Huaqiangbei commercial hub, this flagship store has been fully upgraded into a smart, next-gen beauty experience center. Breaking away from traditional layouts, it offers digital skin analysis zones and interactive makeup bars alongside a rich selection of trending C-beauty counters and exclusive skincare lines, drawing countless female professionals from the surrounding business district.", "name": "Watsons (Catic Plaza)", "transport": "About 300m walk from Exit B of Huaqiang Road Station (Metro Line 1)"}], "name": "Local Signature Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "L1, East Zone, One Avenue, No. 348 Fuhua 1
