 Sea World Station, Exit A, walk about 3 minutes"}, {"address": "No. 201, Building A4, North Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buy List: Avant-garde tailored design shirts, niche designer patchwork canvas shoes, geometric metal buckle square bags. A cutting-edge independent designer boutique originating in Shenzhen, gathering dozens of top domestic and international original designer brands. The OCT Loft store features unique men\u0027s and women\u0027s apparel, handmade leather bags, and stylish footwear\u2014a perfect spot to find high-quality, distinctive pieces that won\u0027t clash with anyone else\u0027s outfit.", "name": "The Fashion Door (TFD OCT Loft)", "transport": "Take Metro Line 2 to Qiaocheng North Station, Exit B, walk about 7 minutes"}, {"address": "No. 101, Building A3, North Area, OCT-LOFT, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Buy List: Minimalist independent designer shoulder bags, vegetable-tanned handcrafted flat shoes, linen knit cardigans. Located in the core cultural space of OCT Loft, combining contemporary art exhibitions with original designer fashion retail. Focusing on elegant local independent brand shoes, bags, and clothing, its style emphasizes natural cuts and warm textures, highly popular among local Shenzhen hipsters and art professionals.", "name": "A3+ Design \u0026 Fashion Store", "transport": "Take Metro Line 2 to Qiaocheng North Station, Exit B, walk about 5 minutes"}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "1F, Zone C, Sea World, Xinghua Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buy List: Seaweed Pork Floss Little Cake, Lemon Yogurt Little Cake, Raisin Mochi Balls. This is one of the most wildly popular bakeries in Shenzhen, located in the Sea World commercial area. Its signature Seaweed Pork Floss Little Cake features a soft sponge cake generously covered in crispy seaweed and savory pork floss, paired with special mayonnaise. Rich in texture with a perfect balance of sweet and savory, it is a must-buy souvenir that tourists queue up for before leaving Shenzhen.", "name": "Bao\u0027s Pastry (Shekou Sea World Store)", "transport": "Take Shenzhen Metro Line 2 to Sea World Station, Exit A, and walk for about 3 minutes."}, {"address": "1F, Building B2, North Area, OCT-LOFT Creative Cultural Park, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | Must-Buy List: Indie vinyl records, creative literary postcards, original Shenzhen tote bags. Located in the OCT-LOFT Creative Cultural Park, this iconic indie bookstore blends vinyl records, self-published books, and a cozy cafe. Featuring a curated selection of artistic merchandise and music products infused with Shenzhen\u0027s unique creative spirit, it is the ultimate spot for hipsters and art lovers to find one-of-a-kind souvenirs.", "name": "Old Heaven Books", "transport": "Take Shenzhen Metro Line 2 to Qiaocheng North Station, Exit B, and walk for about 8 minutes."}, {"address": "1F, Huanchuan Plaza, Sea World, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buy List: Vacuum-packed braised goose gift boxes, High-Mountain Dancong tea gift boxes, Chaoshan hand-beaten beef balls. A renowned Chaoshan culinary institution deeply rooted in Shenzhen, its Sea World branch features a dedicated souvenir counter. Featuring the most iconic Chaoshan braised goose from the Lingnan region preserved with vacuum packaging and paired with aromatic Dancong tea, it lets you easily bring home the authentic flavors of Guangdong to share.", "name": "Chen Pengpeng Chaozhou Restaurant (Gift Box Area)", "transport": "Take Shenzhen Metro Line 2 to Sea World Station, Exit A, and walk for about 2 minutes."}, {"address": "No. 107, Zone B, Sea World Plaza, Taizi Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buy List: Saizhenzhu Tieguanyin gift boxes, Shenzhen Impression limited edition tea sets, aged Pu\u0027er tea cakes. Originating from Fujian and expanded significantly in Shenzhen, Bama Tea is a famous national tea brand. The Sea World store offers exquisitely packaged Shenzhen-themed tea gift boxes, seamlessly blending traditional Chinese tea culture with Shenzhen\u0027s modern urban style\u2014making it an elegant premium gift ideal for business associates or elders.", "name": "Bama Tea (Shekou Sea World Store)", "transport": "Take Shenzhen Metro Line 2 or Line 12 to Sea World Station, Exit D, and walk for about 3 minutes."}, {"address": "No. 41 Shekou Old Street (near Shekou Market), Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | Must-Buy List: Giant salted egg yolk pork zongzi (rice dumplings), traditional cured meat zongzi, house-made peanut sauce. A decades-old local favorite shop in the historic Shekou old street near Sea World, famous across Shenzhen for its giant handmade rice dumplings. Many long-time residents and foodies visit specifically to buy vacuum-packed pork \u0026 salted egg yolk zongzi as gifts, featuring fragrant savory sticky rice packed with rich fillings.", "name": "Jiahua Snack Shop (Shekou)", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station, Exit A, and walk for about 6 minutes."}, {"address": "Room 101, Building F1, South Area, OCT-LOFT Creative Cultural Park, Nanshan District, Shenzhen", "feature": "\u2b50 4.3 Stars | Must-Buy List: Shenzhen city vibe wooden postcards, OCT flora journal notebooks, hand-drawn Shekou map canvas bags. This independent boutique brings together original creations from local Shenzhen designers. Inspired by the lush greenery of the OCT industrial heritage park, it offers stylish everyday accessories and creative stationery that reflect the new wave of Shenzhen\u0027s modern creative scene.", "name": "OCT-LOFT Creative Store", "transport": "Take Shenzhen Metro Line 1 to Qiaocheng East Station, Exit A, and walk for about 10 minutes."}, {"address": "Shop 205, 2F, Zone C, Sea World, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buy List: Hong Kong-style sweetheart cakes, Shenzhen limited-edition panda cookie tins, handmade egg rolls. Located in the Sea World commercial area, this classic traditional bakery offers exquisite pastries featuring authentic Lingnan and Hong Kong flavors. Its adorable panda and penguin cookie tins are hugely popular among visitors, featuring collectible packaging and rich, crispy butter cookies\u2014a perfect crowd-pleasing souvenir.", "name": "Kee Wah Bakery (Shekou Sea World Store)", "transport": "Take Shenzhen Metro Line 2 to Sea World Station, Exit A, and walk for about 4 minutes."}, {"address": "No. 18, Dried Goods Area, Shekou Market, Yucun Road, Shekou, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buy List: Sun-dried dried shrimp, Shekou dried oysters, house-made handmade scallop sauce. Located near Sea World, this traditional seafood market offers an authentic glimpse into Shenzhen\u2019s history as a fishing village. Long-standing dried goods stalls in the market offer high-quality dried seafood sun-cured by local fishermen, packed with rich savory flavor\u2014a must-visit hidden gem for food lovers seeking genuine local Shekou vibes.", "name": "Shekou Market Dried Seafood Store", "transport": "Take Shenzhen Metro Line 2 to Dongjiaotou Station, Exit A, and walk for about 5 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Minkang Road, Longhua District, Shenzhen (approx. 30-min drive from OCT Nanshan)", "feature": "\u2b50 4.5 Stars | Must-Buy: Nike discounted sneakers, Coach vintage monogram bags, Adidas classic hoodies. One of Shenzhen\u0027s most iconic mega outlet centers, featuring hundreds of famous international and domestic brands. Year-round discounts range from 70% to 90% off. The international sportswear and accessible luxury bag areas are especially great for finding rare items or sample sales, making it the top shopping choice for locals and tourists looking for high-quality discounted goods.", "name": "Shenzhen 8th Warehouse Outlet Store", "transport": "Take Metro Line 5 to Guangyayuan Station, Exit B, then walk for about 8 minutes."}, {"address": "No. 9028 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buy: Apple Shenzhen city-exclusive accessories, trendy designer brand T-shirts, imported gourmet handmade chocolates. Located in the heart of Overseas Chinese Town (OCT), it is Shenzhen\u0027s first experiential shopping center. The layout seamlessly integrates lush greenery with artistic design, housing top-tier international luxury brands, South China\u0027s first Apple Store, and numerous trendy local designer pop-up shops. Directly connected to the metro, it offers a relaxed and elegant shopping environment.", "name": "Yitian Holiday Plaza", "transport": "Take Metro Line 1 or Line 2 to Window of the World Station, Exit A for direct access."}, {"address": "No. 169 Taizi Road, Nanshan District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buy: Shekou cultural \u0026 creative ocean tote bags, Hong Kong-style handmade cookies, imported essential oil fragrance gift sets. Located adjacent to the Minghua Cruise Ship at Sea World, Harbour City Phase II features a \u0027coastal cultural \u0026 tourism retail\u0027 theme, highlighting a refined lifestyle with Hong Kong flair. It boasts many South China debuts, waterfront view restaurants, and independent designer boutiques, combining exotic charm with shopping fun.", "name": "Sea World Harbour Shopping Center", "transport": "Take Metro Line 2 or Line 12 to Sea World Station, Exit B, and walk for about 3 minutes."}, {"address": "L1, Yitian Holiday Plaza, No. 9028 Shennan Avenue, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | Must-Buy: Original design cotton-linen jackets, stylishly tailored maxi dresses, handmade linen scarves. A premier domestic designer womenswear brand founded by a renowned Chinese independent designer. The store\u0027s interior is filled with Oriental Zen aesthetics and natural poetry. The apparel features bold structures and premium fabric textures, seamlessly blending traditional craftsmanship with modern tailoring\u2014a favorite among fashion-forward women and art enthusiasts.", "name": "BANXIAOXUE (OCT Store)", "transport": "Take Metro Line 1 to Window of the World Station, Exit A, and enter the 1st floor of Yitian Holiday Plaza."}, {"address": "Room 101, Building B3, North Area, OCT-LOFT, Xiangshan Middle Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.8 Stars | Must-Buy: OCT handmade botanical scented candles, designer ceramic cups, original printed silk scarves. Tucked away inside the OCT Loft Creative Culture Park, this independent lifestyle select store brings together handcrafted art, home goods, and high-quality clothing from local and global designers. Surrounded by lush plants in a tranquil atmosphere, it\u0027s an exceptional spot to discover unique, artistic souvenirs.", "name": "Blossom Garden Select Store", "transport": "Take Metro Line 2 to Qiaocheng North Station, Exit B, then walk for about 10 minutes."}, {"address": "Room 101, Building A2, OCT-LOFT, Xiangshan Middle Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.7 Stars | Must-Buy: Handcrafted solid wood trays, original agarwood incense gift sets, minimalist ceramic tea sets. One of China\u0027s most iconic original furniture and lifestyle design brands. Housed in a repurposed old factory building, the OCT store retains industrial accents while blending peaceful Oriental aesthetics. Beyond large furniture pieces, it offers a wide range of exquisite handcrafted woodenware, tea sets, incense, and lifestyle crafts.", "name": "FNJI (OCT Loft Store)", "transport": "Take Metro Line 1 to Qiaocheng East Station, Exit A, then walk for about 12 minutes."}, {"address": "No. 102 Shekou Old Street, Nanshan District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buy: Shekou ocean-themed vintage postcards, handmade vegetable-tanned leather card holders, Shenzhen Special Economic Zone original motif canvas bags. A local independent select shop near the historic Shekou old street area, dedicated to promoting local cultural creativity and craftsmanship. The store showcases many original design items inspired by Shekou\u0027s port history and maritime culture, with every product rich in local Shenzhen warmth and story.", "name": "Nest Lifestyle Select Shop (Shekou)", "transport": "Take Metro Line 2 to Shuiwan Station, Exit D, then walk for about 7 minutes."}, {"address": "Building 15, Qushui Bay, OCT Harbour, No. 8 Baishi Road East, Nanshan District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buy: Shenzhen-exclusive cold brew tea gift sets, traditional handmade taro pastry, creative collaboration ceramic mugs. A mega concept store launched by the famous Shenzhen-born brand, combining specialty tea beverages, reading, bakery, and curated lifestyle items. It features a dedicated local cultural gift section with Shenzhen-themed premium tea gift boxes and original merchandise, making it a popular landmark for experiencing modern Shenzhen tea culture and picking up souvenirs.", "name": "Nayuki Life Concept Store (OCT Bay)", "transport": "Take Metro Line 9 to Shenzhen Bay Park Station, Exit E, then walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Overseas Chinese Town and Shekou Sea World"}, "yantian_dameisha": {"categories": {"cat_1": {"items": [{"address": "No. 11, Zone B, Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Buys: Neptunus Golden Throat Lozenges, 999 Cold Granules, Pianzihuang Pearl Cream. Born in Shenzhen, Neptunus Pharmacy is a nationally renowned chain drugstore. This branch on Chung Ying Street not only provides professional pharmaceutical consultation but also features dedicated sections for traditional domestic beauty products and Han botanical wellness cosmetics. Local residents and tourists love shopping here for natural herbal moisturizers and essential household medicines, guaranteed for high quality.", "name": "\u6d77\u738b\u661f\u8fb0\u5927\u85e5\u623f (Neptunus Pharmacy - Chung Ying Street)", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B. Apply for the Chung Ying Street permit on foot before entering."}, {"address": "L1, ONE MALL, 1025 Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Buys: Judydoll Single Eyeshadow, Perfect Diary Gradient Lip Gloss, FLORTTE Makeup Pencil. Located inside Yantian\u0027s landmark ONE MALL (One Marina Plaza), this is a highly popular next-generation beauty specialty store in China. Featuring an iconic beauty blender wall and hundreds of emerging domestic beauty brands, it offers a hands-on, hassle-free makeup testing environment, drawing many young women eager to grab trendy limited-edition shades.", "name": "THE COLORIST \u8abf\u8272\u5e2b (\u9e7d\u7530\u58f9\u6d77\u57ce\u5e97) (THE COLORIST - Yantian One Marina Plaza)", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A1, and walk for about 5 minutes."}, {"address": "L1-L2, ONE MALL, 1025 Haijing 2nd Road, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buys: ZEESEA Egyptian Pressed Powder, Florasis Fairy Peach Blossom Pressed Powder, UKISS Dewy Lip Tint. A massive container-style lifestyle and beauty concept store featuring bold, vibrant yellow decor that makes a stunning visual impact. The beauty zone highlights a wide range of trendy C-beauty items and skincare minis at affordable prices with frequent updates, making it a must-visit trendy spot after a scenic walk along the Shatoujiao coastline.", "name": "KKV (\u9e7d\u7530\u58f9\u6d77\u57ce\u5e97) (KKV - Yantian One Marina Plaza)", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A1, and walk for about 5 minutes."}, {"address": "L1, Phase 1, Dameisha Outlets 8, No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-Buys: Watsons Collagen Intensive Nourishing Hand Cream, INOHERB Rhodiola Brightening Serum, One Leaf Botanical Facial Masks. Located inside the famous Dameisha Outlets 8, this Watsons features a large counter dedicated to domestic herbal skincare alongside standard cosmetics. It frequently offers exclusive outlet discounts, making it popular with beachgoers at Dameisha looking to pick up sunblock or post-sun repair products.", "name": "\u5c48\u81e3\u6c0f (\u5927\u6885\u6c998\u865f\u5009\u5e97) (Watsons - Dameisha Outlets)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 23 Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-Buys: Wong To Yick Wood Lock Medicated Oil, Two Girls Pressed Powder, Ling Nam Ultra Balm. A historic independent drugstore on Chung Ying Street in Shatoujiao, preserving a vintage storefront and signboards from decades ago. Specializing in time-honored medicated ointments, Hong Kong-style cosmetics, and classic Chinese beauty brands, it is known for affordable prices and genuine products\u2014a go-to choice for generations of local Shenzhen shoppers.", "name": "\u4e2d\u82f1\u8857\u5be6\u60e0\u85e5\u599d\u5e97 (Shihui Pharmacy \u0026 Cosmetics - Chung Ying Street)", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, then transfer to a bus or walk to apply for the permit to enter Chung Ying Street."}, {"address": "No. 2018 Shenyan Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buys: Pianzihuang Pearl Cream, Mayinglong Babao Firming Eye Cream, gNpearl Whitening Cream. Headquartered in Shenzhen, Sinopharm Yizhi is a flagship state-owned pharmacy chain in South China. Situated on a main avenue in Shatoujiao, this branch features a fully stocked zone for Traditional Chinese Medicine beauty products and local cosmetics, focusing on gentle, herbal-based skincare that attracts many customers looking for natural ingredients.", "name": "\u570b\u85e5\u4e00\u81f4\u5927\u85e5\u623f (\u6c99\u982d\u89d2\u5e97) (Sinopharm Yizhi Pharmacy - Shatoujiao)", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit B, and walk for about 6 minutes."}, {"address": "No. 15 Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-Buys: Po Sum On Medicated Oil, Tiger Balm, Po Chai Pills. A centuries-old Lingnan-style traditional pharmacy branch nestled inside historic Chung Ying Street. In addition to traditional Chinese medicinal herbs and household remedies, the shop sells a variety of Hong Kong and domestic botanical essential oils and herbal creams, making it a must-visit spot to experience the unique border-shopping culture between Shenzhen and Hong Kong.", "name": "\u5bf6\u829d\u6797\u5927\u85e5\u574a (\u4e2d\u82f1\u8857\u7279\u7d04\u5e97) (Po Chi Lam Pharmacy - Chung Ying Street)", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, enter Chung Ying Street with your permit, and walk to the shop."}, {"address": "B1, ONE MALL, 1025 Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-Buys: Mannings Olive Oil Moisturizing Facial Mask, CHANDO Ice Lake Water, Pechoin Herbal Hydrating Cream. Located inside a large coastal shopping mall in Shatoujiao, this Mannings store combines Hong Kong\u0027s signature health \u0026 beauty retail expertise with a wide selection of emerging mainland skincare brands. Cleanly organized and fully stocked, it offers exclusive gift sets from classic domestic brands like Pechoin and CHANDO, drawing many coastal strollers and shoppers.", "name": "\u842c\u5be7 Mannings (\u9e7d\u7530\u58f9\u6d77\u57ce\u5e97) (Mannings - Yantian One Marina Plaza)", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A1, walk about 5 minutes to B1 of ONE MALL."}], "name": "Local Iconic Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "L1, Phase 1, 8th Warehouse Outlet, No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-buy list: Double-faced wool coat, mulberry silk printed dress, exquisite genuine leather handbag. Located in 8th Warehouse Outlet Dameisha, this outlet for Marisfrolg\u2014a high-end local Shenzhen women\u0027s fashion brand\u2014is the top choice for local women who value quality and fine tailoring. The spacious store is well-stocked, often offering incredible discounts of 50% to 70% off on past-season items. Featuring premium fabrics and exquisite craftsmanship, it is a high-value destination for independent designer fashion that you shouldn\u0027t miss when visiting Yantian District.", "name": "8\u865f\u5009\u5967\u7279\u840a\u65af Marisfrolg \u5c08\u8ce3\u5e97 (Marisfrolg Outlet Dameisha)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 18, Zone B, Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-buy list: Retro Hong Kong-style genuine leather briefcase, imported lightweight casual canvas shoes, pure cotton UV protection casual shirt. Deeply rooted in Shatoujiao\u0027s Chung Ying Street for decades, this shop is loved by local neighbors and regulars. It specializes in quality apparel, shoes, and bags imported from Hong Kong and overseas, featuring a strong classic Hong Kong vibe and retro texture. Prices are highly competitive with solid, durable materials; the genuine leather bags are even hand-stitched, making it a great spot for affordable, high-quality unique accessories.", "name": "\u4e2d\u82f1\u8857\u5be6\u60e0\u670d\u98fe\u7cbe\u54c1\u5e97 (Chung Ying Street Shihui Apparel Boutique)", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit A, transfer to Bus B924 to Chung Ying Street Checkpoint Station, apply for a checkpoint permit, and walk in."}, {"address": "L2, Phase 2, 8th Warehouse Outlet, No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Slim-fit tailored suit, knitted cashmere sweater, geometric pattern handbag. YINER Fashion Group is an iconic local fashion enterprise in Shenzhen. Its brand outlet in 8th Warehouse Outlet Dameisha gathers several of its high-end womenswear lines. The apparel styles are sharp and elegant, perfect for career women. Shoes, bags, and accessories are stylishly designed with huge discounts while maintaining superior quality, making it a popular local recommendation for high-quality workwear.", "name": "\u5f71\u5152\u6642\u5c1a Outlet (YINER Outlet Dameisha)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk for about 10 minutes."}, {"address": "Seaside Park Commercial Area, No. 9 Yanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.2 stars | Must-buy list: Bohemian woven straw bag, resort-style printed beach shoes, breathable sun-protective wide-brim straw hat. Located right next to Dameisha Seaside Park, this independent boutique caters to vacationing tourists and relaxing locals. Filled with vibrant island flair, it sells soft printed dresses, sun protection accessories, handmade straw bags, and comfortable beach footwear. The unique designs ensure you won\u0027t bump into someone wearing the same thing, instantly turning you into a seaside style icon.", "name": "\u5927\u6885\u6c99\u6d77\u6ff1\u5ea6\u5047\u98a8\u683c\u5c08\u8ce3\u5e97 (Dameisha Seaside Resort Wear \u0026 Bags)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit A, and walk about 5 minutes to the entrance of Seaside Park."}, {"address": "L1, ONE MALL, No. 28 Haishan Road, Yantian District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-buy list: Mulberry silk modern qipao dress, hand-embroidered leather bag, cashmere knitted cardigan. Located inside ONE MALL along Shatoujiao\u0027s waterfront front line, EP YAYING is renowned for blending Oriental aesthetics with modern tailoring. The store display is artistic, and garments are crafted from top-tier silk and wool with meticulously refined details. The hand-embroidered bags perfectly fuse traditional craftsmanship with modern handbag structures, making them a favorite among local shoppers seeking refined living and cultural depth.", "name": "\u58f9\u6d77\u57ce EP YAYING \u96c5\u7469\u7cbe\u54c1\u5e97 (EP YAYING ONE MALL Store)", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A2, and walk for about 3 minutes."}, {"address": "L2, Phase 1, 8th Warehouse Outlet, No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-buy list: Soft-soled genuine leather flats, retro Martin boots, stylish shoulder tote bag. As a highly influential footwear and bag brand in South China, BELLE operates a massive flagship outlet in 8th Warehouse Outlet Dameisha. It offers a wide variety of men\u0027s and women\u0027s shoes and leather bags, from new arrivals to past-season bestsellers. Renowned for comfort and durability, their genuine leather totes and wallets are offered at budget-friendly outlet prices, making it the top destination for local families and young adults shopping for shoes and bags.", "name": "\u767e\u9e97 BELLE Outlet \u65d7\u8266\u5e97 (BELLE Outlet Dameisha)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 42 Jinrong Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.1 stars | Must-buy list: Lightweight flyknit running shoes, Hong Kong retro dad sneakers, waterproof canvas crossbody bag. An independent footwear and bag shop nestled in Shatoujiao\u0027s old neighborhood, this community fixture offers high-value trendy shoes and backpacks. The owner has a great eye for style, personally handpicking the latest trends weekly from South China\u0027s fashion wholesale markets. Featuring comfortable, flexible, and wear-resistant soles at affordable prices, it is a hidden gem for local youth and students seeking budget-friendly trendy footwear.", "name": "\u6c99\u982d\u89d2\u6f6e\u4eba\u978b\u696d (Shatoujiao Fashion Footwear)", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B, and walk for about 6 minutes."}, {"address": "L1, Phase 2, 8th Warehouse Outlet, No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-buy list: Global travel-themed dress, lightweight windproof functional jacket, elegant quality box bag. GOELIA is a famous Guangdong womenswear and accessory brand built around the theme of global travel and culture. This Dameisha outlet store combines the brand\u0027s signature garden concept with outlet discounts in a tranquil, elegant environment. Their dresses are ultra-comfortable and tailored specifically for Asian female silhouettes; paired with custom box bags and quality leather shoes, they easily create elegant resort or professional looks.", "name": "\u6b4c\u8389\u5a6d GOELIA 8\u865f\u5009\u6982\u5ff5\u5e97 (GOELIA Outlet Dameisha)", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit B, and walk for about 10 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 12 Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade HK-style egg rolls, Jenny Bakery teddy bear cookies, canned abalone sauce. Located inside historic Chung Ying Street, this time-honored specialty store gathers iconic Hong Kong and Macao style snacks and imported foods. Thanks to its location, you can buy authentic, reasonably priced traditional HK pastries and imported casual snacks, making it the top choice for souvenir shopping when visiting Shatoujiao.", "name": "Chung Ying Street HK Specialty Shop", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B, and walk for about 15 minutes. (Note: A special permit for the Chung Ying Street Border Special Administrative Zone must be obtained in advance.)"}, {"address": "No. 68 Yantian Seafood Street, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buy List: Sun-dried squid, wild dried golden hook shrimps, premium light-dried scallops. Located near the famous Yantian Seafood Street, this shop has been operated by a local fisherman\u0027s family for decades. It specializes in dried seafood naturally sun-dried after being caught in local Yantian waters, preserving pure savory marine freshness with no added chemical preservatives. Perfect local ingredients to bring home for soups or stir-fries.", "name": "Yantian Jinhaiwei Dried Seafood Shop", "transport": "Take Shenzhen Metro Line 8 to Yantian Road Station, transfer to Bus M196, and get off at Yantian Seafood Street Station."}, {"address": "No. 10, Street 1, Qiaodong Xincun, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Hakka mugwort cakes, traditional turnip rice cakes, handmade peanut brittle. A hugely popular traditional Hakka pastry shop in Shatoujiao, preserving decades of Hakka rice pastry craftsmanship. The owners fresh-grind rice milk every morning; the pastries feature a chewy, aromatic texture that is delightfully sweet without being cloying, beautifully embodying Yantian\u0027s traditional Hakka food culture.", "name": "Deng\u0027s Hakka Traditional Pastry", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit A, and walk for about 8 minutes."}, {"address": "No. 168 Wutong Mountain Avenue, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-Buy List: Wutong mountain green tea, kumquat lemon tea cakes, Hakka yellow wine gift sets. Utilizing tea and agricultural products grown under the superior climate of Mount Wutong (Shenzhen\u0027s highest peak), this shop specializes in high-mountain teas and Hakka wellness tea gifts. The tea yields a bright infusion with a long sweet aftertaste, and its packaging incorporates Yantian mountain and sea cultural elements\u2014ideal as gifts for elders or tea lovers.", "name": "Wutong Mountain Tea \u0026 Souvenir House", "transport": "Take Shenzhen Metro Line 8 to Shenwai Senior High School Station, Exit C, transfer to Bus M444, and get off at Wutong Mountain Terminus."}, {"address": "Floor B1, ONE MALL, One City, No. 1 Haishan Road, Yantian District, Shenzhen", "feature": "\u2b50 4.3 stars | Must-Buy List: Spicy deep-sea fish skin, Thai coconut chips, premium dried mangoes. Located in One City Mall, this specialty snack store focuses on casual foods from Southeast Asia, Hong Kong, and Macao. Its wide variety of seafood snacks and dried fruits are particularly popular. Featuring clean and beautiful packaging, it\u0027s a great place to pick up snacks and gifts while taking a stroll along the Yantian Waterfront Boardwalk.", "name": "Ziranpai Imported Snacks One City", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit A1, directly connecting to the shopping mall."}, {"address": "No. 9 Yanmei Road, Meisha Subdistrict, Yantian District, Shenzhen (Next to Dameisha Seashore Park Visitor Center)", "feature": "\u2b50 4.2 stars | Must-Buy List: Sea salt caramel crepes, crispy deep-sea yellow croaker, ocean-themed gummy candies. Located at the heart of the Dameisha and Xiaomeisha tourist area, this store offers creative food gifts designed specifically for coastal tourists. The main attractions are baked cookies infused with Dameisha sea salt and savory seafood snacks, combining eye-catching presentation with delicious flavors.", "name": "Dameisha Seaside Souvenir Shop", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station, Exit A, and walk for about 3 minutes."}, {"address": "No. 22 Jingtou East Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Sweetheart Cakes (Lou Po Bing), traditional almond biscuits, Cantonese Little Chicken Biscuits (Gai Zai Peng). A time-honored traditional bakery deeply rooted in Shatoujiao for years, sticking to traditional handcrafted methods and carefully selected ingredients. Freshly baked sweetheart cakes feature thin crusts with generous soft fillings, while almond biscuits are rich and crispy, preserving the authentic traditional flavors of old Shenzhen and Hong Kong pastries.", "name": "Shatoujiao Jiabao Traditional Bakery", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, Exit B, and walk for about 10 minutes."}, {"address": "No. 1022 Haijing 2nd Road, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.4 stars | Must-Buy List: Shatoujiao salted chicken jerky, aged tangerine peel lemon paste, Hakka handmade fried rice cakes. This specialty souvenir shop transforms traditional Yantian Hakka salted chicken into convenient jerky snacks while offering traditionally extracted tangerine peel lemon paste and classic rice cakes, cleverly blending local Hakka food culture with modern souvenir convenience.", "name": "Yantian Port Hakka Souvenir House", "transport": "Take Shenzhen Metro Line 8 to Haishan Station, Exit B, and walk for about 5 minutes."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "No. 1 Huanmei Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.6 Stars | Must-Buys: Nike extra-discounted sneakers, Coach classic leather tote bags, Adidas Originals hoodies. As eastern Shenzhen\u0027s premier lakeside European village-style outlet, Dameisha 8th Warehouse brings together over 200 renowned international and domestic brands. Famous for steep discounts ranging from 50% to 70% off year-round, it is a must-visit shopping paradise in Yantian. Surrounded by scenic lakes and European architecture, shoppers can relax at lakeside caf\u00e9s when tired, enjoying both sunshine and retail therapy.", "name": "Dameisha 8th Warehouse Outlet Shenzhen", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station (Exit B), then walk for about 5 minutes."}, {"address": "No. 2015 Shenyan Road, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buys: Nayuki\u0027s Tea limited soft European bread, Sisyphe Bookstore Shenzhen ocean-themed postcards, Guochao designer apparel. Yantian District\u0027s iconic large ocean-view shopping mall, adjacent to the Yantian Boardwalk, offers stunning coastal views. Combining trendy shopping with leisure dining, it houses numerous domestic original designer brands and lifestyle goods stores popular with local youth and tourists. Drop by to shop and unwind after an afternoon stroll by the sea to experience Yantian\u0027s signature relaxed vibe.", "name": "Yihai City ONE MALL", "transport": "Take Shenzhen Metro Line 8 to Haishan Station (Exit A1), then walk about 300 meters."}, {"address": "Inside Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.3 Stars | Must-Buys: HK-version Wong To Yick Wood Lock Medicated Oil, imported chocolate gift packs, Kjeldsens butter cookies. Located inside the famous historic border attraction Chung Ying Street, this is a time-honored duty-free shopping paradise. Packed with traditional department stores and imported goods shops, it offers daily necessities, medicines, and snacks from Hong Kong and around the world at discounted tax-free prices. Shopping here allows visitors to bag great deals on HK goods while experiencing the unique historic atmosphere of \u0027one street, two systems.\u0027", "name": "Chung Ying Street Commercial Center", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station (Exit A), transfer to a bus or walk to the Chung Ying Street checkpoint to apply for a permit before entering."}, {"address": "Mingzhu Avenue, Yantian Port Logistics Zone, Yantian District, Shenzhen", "feature": "\u2b50 4.2 Stars | Must-Buys: Premium Chilean red wine, New Zealand deep-sea fish oil capsules, imported European toiletries. Leveraging Yantian Port\u0027s powerful international logistics chain, this direct sales center offers authentic, original imported products directly. With no middleman markup, prices are significantly cheaper than standard supermarkets. Featuring dedicated sections for imported foods and health supplements, it serves as a secret haven for locals and savvy tourists bulk-buying high-quality global goods and gifts.", "name": "Yantian Port Import Goods Direct Outlet", "transport": "Take Shenzhen Metro Line 8 to Yantian Road Station (Exit D), then transfer to Bus M380 and get off at Yantian Port Area."}, {"address": "Intersection of Yanmei Road and Neihu Road, Dameisha, Yantian District, Shenzhen", "feature": "\u2b50 4.7 Stars | Must-Buys: Michael Kors scratch-resistant leather bags, Under Armour high-performance compression wear, Puma limited-edition sneakers. The Phase II expansion of 8th Warehouse focuses on mid-to-high-end accessible luxury brands and outdoor sports outlets. Designed with gorgeous Venetian-style waterfront architecture, it offers scenic outdoor caf\u00e9 seating. Stock is updated rapidly, with frequent buy-one-get-one-free promos or extra tier discounts, making it a top pick for fashion-conscious, value-seeking shoppers.", "name": "Dameisha 8th Warehouse Phase II Luxury Outlet", "transport": "Take Shenzhen Metro Line 8 to Dameisha Station (Exit A), then walk for about 8 minutes."}, {"address": "No. 42 Jinrong Road, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.1 Stars | Must-Buys: Local traditional handmade pastries, classic domestic Yumeijing face cream, traditional cotton-linen Hakka clothing. A deeply rooted local department store in Shatoujiao Old Town, filled with warm community vibes and retro nostalgia. It focuses on selling local Shenzhen brands, traditional fabric apparel, and daily sundries at extremely wallet-friendly prices. Compared to modern trendy malls, this place is great for unearthing traditional everyday goods and nostalgic items reflective of southeastern coastal China.", "name": "Shatoujiao Jinhaiyan Department Store", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station (Exit B), then walk for about 600 meters."}, {"address": "No. 18 Coastal Boardwalk Commercial Street, Chung Ying Street, Shatoujiao, Yantian District, Shenzhen", "feature": "\u2b50 4.4 Stars | Must-Buys: Shiseido Urea Hand Cream (Japan), French floral perfume travel sprays, Korean hydrating glass-skin sheet masks. Highly acclaimed among Shatoujiao locals, this independently run beauty boutique imports hot-selling global cosmetics and skincare products directly via Hong Kong channels. Offering guaranteed quality and a comprehensive selection at wholesale duty-free prices, it\u0027s a paradise for beauty lovers seeking the latest viral makeup and skincare finds.", "name": "Chung Ying Street HK Goods \u0026 Cosmetics Store", "transport": "Take Shenzhen Metro Line 8 to Shatoujiao Station, apply for a border entry permit, and walk into Chung Ying Street."}, {"address": "L1-08, Phase II Yihai City, Haibin Community, Haishan Subdistrict, Yantian District, Shenzhen", "feature": "\u2b50 4.5 Stars | Must-Buys: Keychains featuring Yantian\u0027s national intangible cultural heritage \u0027Fish Lantern Dance\u0027, Hakka handmade pastry gift boxes, Yantian mountain-and-sea landscape journals. An original independent lifestyle boutique located in Yihai City, seamlessly blending Yantian\u0027s coastal mountain vibe with Hakka intangible cultural heritage elements. Collaborating with local artists, the store offers exclusive creative merchandise and unique souvenirs. Warm and refined in style, it is the best place to purchase meaningful gifts capturing Yantian\u0027s memories and aesthetic.", "name": "Yantian Mountain \u0026 Sea Cultural Life Store", "transport": "Take Shenzhen Metro Line 8 to Haishan Station (Exit A2), then walk about 400 meters."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Yantian, Dameisha, Xiaomeisha and Shatoujiao"}};
        const cityName = "Shenzhen";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
