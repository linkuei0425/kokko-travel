abian-style bottles along with premium agarwood make wonderful gifts.", "name": "Royal Fragrances", "transport": "Take the MRT Downtown (Blue) or East-West (Green) Line to Bugis MRT Station (Exit A) and walk for about 6 minutes."}, {"address": "200 Victoria St, #B1-07 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.2 stars | Must-Buy List: Bird\u0027s Nest Hydrating Facial Mask, Natural Crocodile Oil Repair Cream, Universal Wind Oil. Hockhua Tonic is a long-established healthcare and wellness chain in Singapore, with a Bugis Junction branch that offers an extensive selection. Beyond traditional herbal supplements, their proprietary crocodile oil cream works wonders for repairing dry and sensitive skin, while their natural bird\u0027s nest face masks are wildly popular among locals and savvy travelers alike, combining traditional Singaporean wellness with modern skincare.", "name": "Hockhua Tonic @ Bugis Junction", "transport": "Take the MRT to Bugis MRT Station and use the underground linkway directly to Level B1 of Bugis Junction."}, {"address": "200 Victoria St, #B1-11 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.3 stars | Must-Buy List: Tiger Balm ointment and warm medicated plasters, Minyak Kayu Putih (Eucalyptus oil), Bio-essence soothing spot essence. Guardian is one of Singapore\u0027s largest health and beauty pharmacy chains, and its Bugis Junction branch is exceptionally well-stocked. It gathers Singapore\u0027s most iconic topical pharmaceutical products, such as the famous Tiger Balm series, local herbal balms, and medicated oils, alongside many affordable natural skincare brands unique to Southeast Asia. It is a fantastic spot to pick up everyday Singaporean beauty and personal care items.", "name": "Guardian @ Bugis Junction", "transport": "Take the MRT to Bugis MRT Station and walk 1 minute via the underground linkway to Bugis Junction Level B1."}, {"address": "201 Victoria St, #02-05 Bugis+, Singapore 188067", "feature": "\u2b50 4.3 stars | Must-Buy List: Tiger Balm Neck \u0026 Shoulder Rub, Silkygirl Matte Lipstick, Kwan Loong Medicated Oil. Located inside Bugis+ shopping mall, this bright and spacious Watsons store is a popular spot in the Bugis shopping district for cosmetics and personal healthcare items. The shop features dedicated zones for Southeast Asian beauty brands like Silkygirl\u2014a favorite among Singaporean and Malaysian youth\u2014along with various local Singaporean medicated oils and repair creams. It offers a huge variety of products with frequent local exclusive deals.", "name": "Watsons @ Bugis+", "transport": "Take the MRT to Bugis MRT Station (Exit C) and walk across the Level 2 pedestrian overpass directly into Bugis+ shopping mall."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "200 Victoria St, #01-111 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.6 stars | Must-Buy Items: \u0027Micro Dumpling Bag\u0027, \u0027Water-resistant Backpack\u0027, \u0027Pocket Tee\u0027. Beyond The Vines is a local independent designer brand from Singapore that has exploded in popularity across Asia in recent years, famous for its minimalism and color aesthetics. Its iconic Dumpling Bag is made of lightweight, water-resistant nylon, featuring vibrant color-blocking designs that perfectly blend fashion with generous storage capacity. It is a must-visit fashion icon store for Singapore youth and international visitors in Bugis.", "name": "Beyond The Vines (Bugis Junction)", "transport": "Take the East West Line or Downtown Line to Bugis MRT Station (EW12/DT11), then take Exit C to directly access Level 1 of Bugis Junction."}, {"address": "200 Victoria St, #01-06/07/08 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.5 stars | Must-Buy Items: \u0027Chain Geometric Crossbody Bag\u0027, \u0027Pointed Toe Mule Shoes\u0027, \u0027Zip-Around Wallet\u0027. Founded in Singapore, Charles \u0026 Keith is an internationally renowned local fashion brand famous for bringing high-end luxury design at accessible, affordable prices. The Bugis Junction boutique boasts a comprehensive collection, from the latest seasonal women\u0027s footwear and stylish handbags to chic accessories, making it the #1 must-visit spot on any Singapore shopping spree.", "name": "Charles \u0026 Keith (Bugis Junction)", "transport": "Take the East West Line or Downtown Line to Bugis MRT Station (EW12/DT11), connected directly via underground pedestrian walkway to Level 1 of Bugis Junction."}, {"address": "200 Victoria St, #01-13 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.4 stars | Must-Buy Items: \u0027Leather Briefcase\u0027, \u0027Textured Leather Wallet\u0027, \u0027Structured Loafers\u0027. PEDRO is a high-end footwear and bag brand under the Charles \u0026 Keith group, specializing in slick, elegant, modern urban styles. The store offers sophisticated men\u0027s and women\u0027s leather shoes, handbags, totes, and leather goods. Featuring top-notch leather quality and modern cuts at reasonable prices, it is a favorite among Singapore\u0027s local young professionals and fashion lovers.", "name": "PEDRO (Bugis Junction)", "transport": "Take the East West Line or Downtown Line to Bugis MRT Station (EW12/DT11), then walk via the connected walkway to Level 1 of Bugis Junction."}, {"address": "26 Haji Ln, Singapore 189219", "feature": "\u2b50 4.5 stars | Must-Buy Items: \u0027Graphic Tee\u0027, \u0027Bucket Hat\u0027, \u0027Canvas Tote Bag\u0027. Tucked away in Haji Lane, Kampong Gelam, Goodluck Bunch is a well-known independent streetwear select shop in Singapore. It curates independent streetwear clothing and accessories from local Singaporean brands as well as Japan, Korea, the US, and Europe. The two-story store features a cool street-style vintage decor, offering unique graphic tees, hats, and bags that guarantee you won\u0027t bump into someone wearing the same outfit. A true treasure trove for vintage and street fashion lovers!", "name": "Goodluck Bunch (Haji Lane)", "transport": "Take the Downtown Line or East West Line to Bugis MRT Station (DT11/EW12), Exit B and walk about 6 minutes to Haji Lane."}, {"address": "200 Victoria St, #02-29 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.3 stars | Must-Buy Items: \u0027High-Waisted Trousers\u0027, \u0027French Style Dress\u0027, \u0027Linen Shirt\u0027. Supergurl is a rapidly rising homegrown women\u0027s fashion brand in Singapore, celebrated for its superb cuts tailored specifically for Asian body types and great value for money. The store at Bugis Junction features a soft, pastel Korean aesthetic, offering versatile fashion pieces suitable for both work and daily casual wear. The comfortable, breathable fabrics are perfect for tropical climates like Singapore\u0027s, making it immensely popular with young Singaporean women.", "name": "Supergurl (Bugis Junction)", "transport": "Take the East West Line or Downtown Line to Bugis MRT Station (EW12/DT11), enter Bugis Junction via Exit C, and take the escalator to Level 2."}, {"address": "200 Victoria St, #02-38 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.4 stars | Must-Buy Items: \u0027Indie Leather Tote\u0027, \u0027Designer Printed Shoulder Bag\u0027, \u0027Metallic Earrings\u0027. Sift \u0026 Pick is a premier local flagship select store for fashion bags in Singapore, specializing in bringing top independent designer footwear, bags, and accessories from across Asia under one roof. The spacious and bright store offers diverse, unique items to help you avoid mainstream outfit clashes. From indie canvas totes and urban real-leather bags to stylish jewelry, it\u0027s the ultimate destination for shoppers who love niche, original designs.", "name": "Sift \u0026 Pick (Bugis Junction)", "transport": "Take the East West Line or Downtown Line to Bugis MRT Station (EW12/DT11), and enter Level 2 of Bugis Junction via the connecting walkway."}, {"address": "47 Haji Ln, Singapore 189240", "feature": "\u2b50 4.7 stars | Must-Buy Items: \u0027Vintage Printed Shirt\u0027, \u0027Batik Pattern Dress\u0027, \u0027Handmade Earrings\u0027. Located in Haji Lane in Kampong Gelam, Utopia Apparels is a unique local brand featuring original and vintage fashion. The brand seamlessly blends traditional Southeast Asian print culture (such as Batik) with modern street silhouettes, crafting vibrant, tropical-style shirts, dresses, and accessories. Each piece boasts bold, vivid colors produced in limited quantities, making them highly collectible souvenirs with rich local cultural flavor.", "name": "Utopia Apparels", "transport": "Take the Downtown Line or East West Line to Bugis MRT Station (DT11/EW12), Exit B, walk along Victoria Street for about 7 minutes, and turn into Haji Lane."}, {"address": "38 Haji Ln, #02-01, Singapore 189231", "feature": "\u2b50 4.8 stars | Must-Buy Items: \u0027Handcrafted Leather Wallet\u0027, \u0027Customized Card Holder\u0027, \u0027Retro Leather Crossbody Bag\u0027. Situated in the artistic alleys of Kampong Gelam, Crafune is a local independent artisan leather brand in Singapore. The shop displays vegetable-tanned leather shoes, bags, and everyday goods crafted entirely by hand by local artisans. Made with premium Italian leather, the products are warm, durable, and age beautifully over time. They also offer on-site custom engraving, allowing you to add a personalized touch to your leather items, making for a truly memorable handcrafted souvenir.", "name": "Crafune", "transport": "Take the Downtown Line or East West Line to Bugis MRT Station (DT11/EW12), Exit B, and walk for about 6 minutes straight to Haji Lane."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "24 Kandahar St, Singapore 198887", "feature": "\u2b50 4.4 stars | Must-Buy List: Pandan Swiss Roll, Durian Swiss Roll, Homemade Kaya Jam. Tucked away on Kandahar Street in Kampong Gelam, this legendary heritage bakery draws long queues of both locals and tourists alike. Everything is baked fresh daily, featuring incredibly soft, pillowy cake layers filled with rich, perfectly balanced creams. The best-selling Pandan flavor boasts a subtle, natural herbal aroma paired with silky smooth cream\u2014a match made in heaven. The Durian flavor uses real durian flesh for a rich, authentic aroma. It\u0027s the ultimate choice for a hotel snack or a gift to bring back home.", "name": "Rich \u0026 Good Cake Shop", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, exit via Exit B, and walk about 8 minutes."}, {"address": "21 Bussora St, Singapore 199439", "feature": "\u2b50 4.6 stars | Must-Buy List: Egyptian Musk Oils, Arabian-style carved glass perfume bottles, custom rollerball perfume oils. Established in 1933 on Bussora Street, Jamal Kazura is Kampong Gelam\u0027s oldest family-run alcohol-free perfume oil (Attar) shop. Filled with enchanting, rich oriental scents, the store offers long-lasting perfume oils extracted from pure natural plants and flowers. Customers can also choose exquisite hand-crafted Arabian-style stained glass bottles and have them filled on the spot\u2014a highly unique, exotic souvenir full of personal character.", "name": "Jamal Kazura Aromatics", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, exit via Exit B, and walk about 6 minutes to Bussora Street pedestrian mall."}, {"address": "265 Beach Rd, Singapore 199544", "feature": "\u2b50 4.5 stars | Must-Buy List: Singapore Blue \u0026 White Porcelain Plate, Merlion motif tote bags, HDB pattern printed coasters. Located on Beach Road at the edge of Kampong Gelam, Supermama is Singapore\u0027s premier lifestyle design brand. The founders fuse local cultural elements (such as HDB public housing, the Merlion, and traditional pandan leaves) with traditional Japanese Arita porcelain craftsmanship to create exquisite tableware and souvenirs. Every piece is artistic, meaningful, and deeply rooted in Singapore\u0027s identity\u2014perfect for travelers who appreciate lifestyle design and seek one-of-a-kind gifts.", "name": "Supermama Flagship Store", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station and walk about 7 minutes."}, {"address": "42 Arab St, Singapore 199741", "feature": "\u2b50 4.8 stars | Must-Buy List: Solid Perfume in vintage tin boxes, Custom Perfume, hand-blown glass scented candles. Tucked inside a historic shophouse on Arab Street, this independent perfume atelier is run by a third-generation perfumer showcasing high-end niche perfumery. Blending ancient perfume-making techniques with modern aesthetics, they offer alcohol-free scent oils, soy candles, and vintage solid perfumes. Stepping into the store feels like walking into a 19th-century apothecary. Enjoy a custom perfume consultation and take home a refined, truly unique scent infused with exotic Singaporean romance.", "name": "Sifr Aromatics", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, exit via Exit B, and walk about 5 minutes to Arab Street."}, {"address": "200 Victoria St, #B1-02/03 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.2 stars | Must-Buy List: Pandan Chiffon Cake, Handmade Kueh Lapis, Traditional Pineapple Tarts. Bengawan Solo is Singapore\u0027s most famous traditional Nyonya and Southeast Asian bakery brand, featuring a convenient counter at Bugis Junction Basement 1. Celebrated by international celebrities and foodies alike as a national dessert, their signature Pandan Chiffon Cake is made with natural pandan leaf juice, offering a cloud-like fluffy texture with rich coconut and herbal aromas. Their buttery, rich Kueh Lapis is another top favorite gift to buy before heading home.", "name": "Bengawan Solo - Bugis Junction", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, directly connected to Bugis Junction B1."}, {"address": "200 Victoria St, #B1-19 Bugis Junction, Singapore 188021", "feature": "\u2b50 4.3 stars | Must-Buy List: Signature Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. The globally famous Singaporean snack brand IRVINS has a counter inside Bugis Junction. Famous for its \u0027Dangerously Addictive\u0027 salted egg fish skin, premium fried fish skins are coated in rich salted egg yolk, curry leaves, and chili pepper, resulting in an insanely crispy, savory, and spicy crunch that you can\u0027t stop eating. With striking sealed packaging, it is the ultimate modern snack souvenir from Singapore.", "name": "IRVINS Salted Egg - Bugis Junction", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, directly connected to the Bugis Junction B1 foodhall."}, {"address": "59 Arab St, Singapore 199756", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Rose \u0026 Hazelnut Turkish Delight Box, Apple Tea Powder, Middle Eastern cooking spice mixes. Located in the heart of Kampong Gelam on Arab Street, this vibrant Middle Eastern store exudes rich Ottoman charm. Its colourful display windows showcase a wide array of handmade Turkish Delights (Lokum)\u2014chewy, packed with nuts, and pleasantly sweet. The shop also carries authentic Middle Eastern spices, herbal teas, and delicate porcelain teaware. Ideal for anyone wanting to experience the multicultural charm of Bugis and Kampong Gelam while picking up unique exotic treats.", "name": "Sultan Turkish Delights \u0026 Spices", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station and walk about 6 minutes to Arab Street."}, {"address": "3 New Bugis St, Singapore 188867", "feature": "\u2b50 4.1 stars | Must-Buy List: Merlion Chocolates, Dried Durian \u0026 Durian Candies, Singapore landmark print tote bags and souvenir keychains. Bugis Street Market is Singapore\u0027s largest and most bustling sheltered indoor market, packed with hundreds of small stalls. It offers Singapore\u0027s best-value and widest selection of tourist souvenirs and snacks, including beautifully packaged Merlion chocolates, pandan cookies, and dried tropical fruits (such as dried durian and mango). With highly competitive prices and vast variety, it\u0027s perfect for travelers looking to buy budget souvenirs in bulk for colleagues and friends.", "name": "Bugis Street Market Souvenir Stalls", "transport": "Take the Downtown (Blue) or East West (Green) MRT Line to Bugis Station, exit via Exit C, cross the street, and you will arrive at the entrance of Bugis Street."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "200 Victoria St, Singapore 188021", "feature": "\u2b50 4.4 stars | Must-Buy List: Charles \u0026 Keith classic handbags, Pazzion soft lambskin flats, local Singaporean souvenirs from BHG Department Store. Located in the heart of Bugis, this semi-open-air shopping mall with a glass canopy seamlessly blends vintage Nanyang shophouses with a modern department store. Housing Singapore\u0027s iconic Charles \u0026 Keith footwear and a massive BHG department store, it is a top shopping destination for both local youth and tourists.", "name": "Bugis Junction", "transport": "Take the MRT East-West Line or Downtown Line to Bugis Station (EW12/DT14), direct access to the basement level from the station."}, {"address": "201 Victoria St, Singapore 188067", "feature": "\u2b50 4.3 stars | Must-Buy List: Singaporean streetwear designer T-shirts, Sephora exclusive beauty sets, indoor aroma diffuser stones. Connected to Bugis Junction via an overhead bridge, Bugis+ features a striking avant-garde honeycomb geometric facade. It brings together numerous local youth street brands and international fast fashion, making it a popular spot for discovering local fashion apparel and accessories.", "name": "Bugis+", "transport": "Take the MRT to Bugis Station, then walk about 3 minutes via the 2nd-floor skybridge connecting from Bugis Junction."}, {"address": "3 New Bugis St, Singapore 188867", "feature": "\u2b50 4.2 stars | Must-Buy List: Nanyang-style printed tote bags, Singapore slogan cotton T-shirts, handmade woven sun hats. Known as Singapore\u0027s version of Myeong-dong, it houses over 800 budget-friendly small stalls and clothing shops. As Singapore\u0027s largest indoor budget shopping street, it offers a vibrant local shopping atmosphere with incredible value-for-money accessories and trinkets.", "name": "Bugis Street", "transport": "Take the MRT to Bugis Station Exit C, then walk about 1 minute."}, {"address": "61 Haji Ln, Singapore 189254", "feature": "\u2b50 4.6 stars | Must-Buy List: Nanyang tile-pattern tote bags, hand-drawn postcards by local illustrators, handmade vintage earrings. Tucked away in Haji Lane at Kampong Gelam, this highly distinctive local independent boutique sells handcrafted goods, accessories, and original apparel from Singaporean creators and artisans. Filled with retro Nanyang hipster charm, it is a treasure trove for unique souvenirs.", "name": "Craft Assembly", "transport": "Take the MRT to Bugis Station Exit B, then walk about 7 minutes."}, {"address": "21 Bussorah St, Singapore 199439", "feature": "\u2b50 4.7 stars | Must-Buy List: Egyptian rose essential oil balm, handcrafted carved Middle Eastern perfume bottles, custom alcohol-free Arabian Nights perfume oil. Founded in 1933, this long-standing independent perfume shop on Arab Street in Kampong Gelam passes down three generations of traditional fragrance formulas. Paired with exquisite handcrafted glass bottles rich in Middle Eastern artistry, it stands as a signature local gift showcasing Singapore\u0027s multicultural heritage.", "name": "Jamal Kazura Aromatics", "transport": "Take the MRT to Bugis Station Exit B, then walk about 6 minutes along Arab Street."}, {"address": "42 Arab St, Singapore 199741", "feature": "\u2b50 4.8 stars | Must-Buy List: Custom essential oil perfumes, soy lavender scented candles, vintage brass oil burners. Operated by a family of local Singaporean perfumers inside a heritage shophouse, this boutique scent studio specializes in traditional artisanal perfume blending and bespoke fragrances. It offers high-quality independent perfumes and home fragrances infused with Nanyang botanical elements.", "name": "Sifr Aromatics", "transport": "Take the MRT to Bugis Station Exit B, then walk about 5 minutes."}, {"address": "7 Fraser St, Singapore 189356", "feature": "\u2b50 4.3 stars | Must-Buy List: Singaporean artisanal roasted coffee beans, local designer multi-brand apparel, organic essential oil body care sets. Designed by a world-renowned architect, this twin-tower complex connects Kampong Gelam with the Bugis shopping precinct. Featuring sophisticated independent boutiques and lifestyle concept stores, it offers an elegant, refined shopping experience away from the bustling crowds.", "name": "DUO Galleria", "transport": "Take the MRT to Bugis Station Exit E, direct access to the basement level."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.5 stars | Must-Buy List: Coach classic signature wallets (often 50-60% off), discounted Nike sneakers, Kate Spade crossbody bags. As Singapore\u0027s largest and most recommended outlet mall, IMM features over 100 international brand outlet stores. Although a bit further from Bugis, it is directly accessible via the MRT East-West Line (Green Line), making it a must-visit shopping paradise for bargain hunting on designer brands.", "name": "IMM Outlet Mall", "transport": "Take the MRT East-West Line (Green Line) from Bugis Station to Jurong East Station (EW24), then walk about 10 minutes via the sheltered elevated walkway."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Bugis and Kampong Glam"}, "changi_katong": {"categories": {"cat_1": {"items": [{"address": "78 Airport Blvd., #B1-289 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.5 stars | Must-Buy List: Custom Serum, Tri-Light LED Device, Skincare Serum Capsules. Skin Inc is Singapore\u2019s iconic tech-led skincare brand, famous for creating bespoke serums tailored to on-site skin analysis results. Located inside Jewel Changi Airport, this futuristic, tech-forward store is a must-visit luxury skincare haven for international travelers and beauty enthusiasts visiting Singapore.", "name": "Skin Inc Custom-Serum Bar (Jewel Changi Airport)", "transport": "Take the MRT East West Line to Changi Airport MRT Station, directly connected to B1 of Jewel Changi Airport."}, {"address": "78 Airport Blvd., #B1-282 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.4 stars | Must-Buy List: Rose Chamomile Hydrating Mist, Natural Essential Oils, Herbal Soothing Hand Cream. HYSSES (formerly Mt. Sapola) is a renowned homegrown Singaporean brand specializing in natural botanical aromatherapy and skincare. Formulated specifically for tropical climates, its products are 100% natural, chemical-free, lightweight, and quickly absorbed. The store smells divine with soothing botanical scents, making it a favorite among natural beauty lovers.", "name": "HYSSES (Jewel Changi Airport)", "transport": "Take the MRT East West Line to Changi Airport MRT Station, with direct access to B1 of Jewel Changi Airport."}, {"address": "78 Airport Blvd., #02-213 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.6 stars | Must-Buy List: Night Jasmine Body \u0026 Massage Oil, Thai Bergamot Body Scrub, Custom Oud Incense. Originating from Singapore\u0027s luxury hospitality group Banyan Tree, this boutique offers premium spa-grade skincare and home aromatherapy products. It allows travelers to bring home the serene, rejuvenating experience and relaxing ambiance of a world-class resort spa.", "name": "Banyan Tree Gallery (Jewel Changi Airport)", "transport": "Take the MRT East West Line to Changi Airport MRT Station and walk to Level 2 of Jewel Changi Airport."}, {"address": "30 East Coast Rd, #01-11 Katong V, Singapore 428751", "feature": "\u2b50 4.3 stars | Must-Buy List: Bottled Bird\u0027s Nest Gift Sets, Bird\u0027s Nest Collagen Beauty Drink, Natural Pearl Powder Cream. Eu Yan Sang, a century-old traditional Chinese medicine brand, has a specialty outlet in the historic Katong neighborhood. Beyond classic herbal tonics, its innovative Bird\u0027s Nest Skincare series and herbal beauty drinks make uniquely Eastern beauty souvenirs that are wildly popular among female travelers.", "name": "Eu Yan Sang (Katong V)", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade MRT Station and walk about 8 minutes to Katong V mall."}, {"address": "78 Airport Blvd., #B2-219/220 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.3 stars | Must-Buy List: Bio-Essence 24K Gold Rose Gold Water, Tiger Balm Warm Medicated Plaster, Axe Brand Universal Oil. Guardian is Singapore\u2019s premier health \u0026 beauty pharmacy chain. This flagship location features a dedicated section for iconic Singaporean skincare and wellness products. It\u0027s a popular one-stop shop for tourists stocking up on local cult favorites like Bio-Essence skincare and classic remedies like Tiger Balm and Axe Oil.", "name": "Guardian Flagship Store (Jewel Changi Airport)", "transport": "Take the MRT East West Line to Changi Airport MRT Station and walk to B2 of Jewel Changi Airport."}, {"address": "112 East Coast Rd, #B1-22 i12 Katong, Singapore 428802", "feature": "\u2b50 4.2 stars | Must-Buy List: Traditional Singapore Crocodile Oil Repair Cream, Herbal Anti-Allergy Balm, Silkygirl Long-Wear Lip Tint. Located in the heart of Katong inside the i12 mall, this Watsons features a dedicated section for traditional Singaporean Crocodile Oil creams. Known in Singapore for its incredible ability to repair dry and sensitive skin, this local holy grail product is a must-buy for skincare insiders.", "name": "Watsons (i12 Katong)", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade MRT Station and walk about 5 minutes to i12 Katong mall."}, {"address": "78 Airport Blvd., #01-201 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.5 stars | Must-Buy List: Sigi Skin Morning Dew Sunscreen, Allies of Skin Molecular Repair Mask, Singapore-Exclusive Beauty Sets. The highlight of this Sephora location is its special showcase of homegrown Singaporean beauty brands. Skincare aficionados seeking high-performance local products can find globally acclaimed Singaporean clean beauty brands here, such as Sigi Skin and Allies of Skin.", "name": "Sephora (Jewel Changi Airport)", "transport": "Take the MRT East West Line to Changi Airport MRT Station and walk to Level 1 of Jewel Changi Airport."}, {"address": "212 East Coast Rd, Singapore 428911", "feature": "\u2b50 4.4 stars | Must-Buy List: Herbal Whitening Facial Powder, Kwan Loong Medicated Oil, All-Natural Zi Yun Ointment. Combining traditional Chinese medicine with modern herbal beauty concepts, this long-standing Singaporean pharmacy offers handcrafted herbal facial powders, natural Zi Yun healing ointments, and classic pain-relief oils, showcasing Katong\u0027s rich heritage and unique local pharmacy culture.", "name": "SinChong Traditional Chinese Medicine (Katong)", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade MRT Station and walk along East Coast Road for about 7 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacy Brands"}, "cat_2": {"items": [{"address": "109 East Coast Road, Singapore 428800", "feature": "\u2b50 4.5 stars | Must-Buy List: Handcrafted Nyonya beaded shoes, traditional Batik pattern scarves, hand-embroidered coin purses. Located on historic East Coast Road in Katong, Rumah Kim Choo Boutique is the premier destination to experience and purchase traditional Peranakan attire. The shop showcases and sells iconic Nyonya kebayas with intricately detailed embroidery, as well as labor-intensive hand-beaded shoes (Kasut Manek). Exuding a charming retro Nyonya vibe, it is a uniquely authentic local boutique showcasing rich heritage.", "name": "Rumah Kim Choo Boutique", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade Station (TE26) and walk about 6 minutes from the exit."}, {"address": "113 East Coast Road, Singapore 428803", "feature": "\u2b50 4.4 stars | Must-Buy List: Custom handcrafted Kebayas, intricately beaded women\u0027s shoes, Nyonya-patterned handbags. Founded by Peranakan culture preservationist Bebe Seet, this independent workshop and boutique is housed in a colorful, traditional shophouse. Filled with rich cultural flair, it specializes in exquisitely crafted Peranakan garments and beaded footwear. Most items are limited handmade pieces featuring unique, beautiful patterns, making it an unmissable Katong landmark for lovers of indie brands and artisan crafts.", "name": "Rumah Bebe", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade Station (TE26) and walk about 6 minutes from the exit."}, {"address": "448 Joo Chiat Road, Singapore 427661", "feature": "\u2b50 4.6 stars | Must-Buy List: Singapore-themed canvas tote bags, local illustrator-designed socks, vintage-patterned printed dresses. Loved by local hipsters and travelers alike, this independent Katong select shop promotes emerging Singaporean designers and creators. It offers original apparel, tote bags, and chic accessories inspired by Singaporean culture and Katong architectural motifs. With a friendly resident store cat, it offers a delightful shopping experience.", "name": "Cat Socrates East Coast", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade Station (TE26) and walk about 10 minutes, or transfer to Bus 16 and get off at Marshall Lane Station."}, {"address": "129 Joo Chiat Road, Singapore 427415", "feature": "\u2b50 4.7 stars | Must-Buy List: Katong shophouse motif tote bags, silk printed scarves, geometric patterned clutches. Onlewo is a home-grown Singaporean print design brand. Its founder incorporates Katong\u0027s shophouse tiles, vintage window grilles, and native flora into fabric designs. Designed locally in Singapore, their canvas bags, silk scarves, and accessories showcase an elegant modern geometric aesthetic rich in cultural heritage\u2014a uniquely stylish local choice where you won\u0027t bump into duplicates.", "name": "Onlewo Studio Katong", "transport": "Take the MRT East West Line to Eunos Station (EW7), transfer to Bus 13 or 150, alight opposite Joo Chiat Complex, and walk about 3 minutes."}, {"address": "78 Airport Boulevard, #02-221 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic minimalist Micro Dumpling Bag, water-resistant nylon crossbody bag, minimalist solid pocket tee. Beyond The Vines is a trending homegrown Singaporean design brand taking Southeast Asia by storm, known for its minimalism, functionality, and vibrant colors. Located in Jewel Changi Airport, the spacious store features a sleek, design-forward interior. Its signature Dumpling Bag is made from lightweight water-resistant nylon and comes in an array of colors, making it immensely popular among local youth and tourists alike.", "name": "Beyond The Vines (Jewel Changi)", "transport": "Take the MRT East West Line Changi Airport Branch to Changi Airport Station (CG2), which directly connects to Level 2 of Jewel Changi Airport."}, {"address": "78 Airport Boulevard, #02-244 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.3 stars | Must-Buy List: Rhinestone ballet flats, calfskin crossbody bag, matching mother-child soft leather flats. Founded in Singapore, PAZZION is a popular local women\u0027s footwear and bag brand famous for crafting comfortable shoes from high-quality calfskin and lambskin. The store design is sleek and elegant, offering shoes that seamlessly balance chic office looks and trendy casual styles. Known for incredible value, its soft-soled flats and exquisite leather bags are daily staples for Singaporean women.", "name": "PAZZION (Jewel Changi)", "transport": "Take the MRT East West Line Changi Airport Branch to Changi Airport Station (CG2), connecting directly to Level 2 of Jewel Changi Airport."}, {"address": "78 Airport Boulevard, #02-237 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.5 stars | Must-Buy List: Geometric cut handbag, pointed-toe elegant flats, classic chain accordion mini wallet. Affectionately known as \u0027Charles \u0026 Keith\u0027, this is Singapore\u0027s most famous homegrown fashion shoes and accessories brand. The Jewel Changi location boasts a comprehensive stock updated rapidly with the latest season\u0027s footwear, bags, and sunglasses. Internationally renowned for bold, trendy designs at accessible prices, it is a must-visit local boutique for virtually every traveler to Singapore.", "name": "Charles \u0026 Keith (Jewel Changi)", "transport": "Take the MRT East West Line Changi Airport Branch to Changi Airport Station (CG2), connecting directly to Level 2 of Jewel Changi Airport."}, {"address": "78 Airport Boulevard, #02-234 Jewel Changi Airport, Singapore 819666", "feature": "\u2b50 4.4 stars | Must-Buy List: Modern gentleman leather loafers, minimalist geometric shoulder bag, lightweight leather cardholder. PEDRO is a high-end footwear and bag brand under a local Singaporean fashion group, specializing in modern, contemporary footwear and accessories for both men and women. The store interior reflects refined urban aesthetics, featuring premium leather and sleek tailored cuts. From formal business dress shoes and smart-casual sneakers to structured bags, it exemplifies the fine craftsmanship of Singaporean design.", "name": "PEDRO (Jewel Changi)", "transport": "Take the MRT East West Line Changi Airport Branch to Changi Airport Station (CG2), connecting directly to Level 2 of Jewel Changi Airport."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Boutiques"}, "cat_3": {"items": [{"address": "109 East Coast Road, Singapore 428800", "feature": "\u2b50 4.4 Stars | Must-Buy List: Nyonya Rice Dumplings, Nyonya Kueh, Traditional Pineapple Tarts. A century-old legendary establishment located on East Coast Road in Katong, this is a must-visit landmark for experiencing Singapore\u0027s Peranakan culture. Their iconic Nyonya rice dumplings feature soft, aromatic glutinous rice stuffed with pork marinated in secret spices and candied winter melon, offering a delightful harmony of sweet and savory flavors. The second floor houses a rich display of traditional Peranakan attire and handicrafts, allowing visitors to deeply immerse themselves in Katong\u0027s vibrant Baba-Nyonya heritage while shopping for delicious snack souvenirs.", "name": "Kim Choo Kueh Chang", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade Station (TE26) and walk for about 6 minutes."}, {"address": "#01-229, Jewel Changi Airport, 78 Airport Boulevard, Singapore 819666", "feature": "\u2b50 4.3 Stars | Must-Buy List: Pandan Chiffon Cake, Lapis Legit (Layer Cake), Handmade Kaya Jam. Singapore\u0027s most famous traditional bakery brand, with its Jewel Changi Airport branch being the top choice for tourists to pick up last-minute souvenirs before departure. Their signature Pandan Chiffon Cake is exceptionally soft, fluffy, and infused with the rich, natural fragrance of pandan leaves and coconut milk\u2014earning it the title of Singapore\u0027s \u0027national dessert.\u0027 In addition, the rich Indonesian Lapis Legit and beautifully packed artisanal Kaya jam make perfect gifts.", "name": "Bengawan Solo - Jewel Changi Airport", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and follow the linkway directly to Level 1 of Jewel Changi Airport."}, {"address": "#B2-248, Jewel Changi Airport, 78 Airport Boulevard, Singapore 819666", "feature": "\u2b50 4.5 Stars | Must-Buy List: Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. IRVINS is Singapore\u0027s globally famous, addictive snack brand with the legendary slogan \u0027Dangerously Addictive.\u0027 Made by stir-frying premium salted egg yolks, curry leaves, and chili, the savory coat perfectly covers crispy fish skin and potato chips. The rich, savory flavor with a subtle kick of spice creates an amazingly crunchy and multi-layered taste, making it a trendy snack souvenir you can\u0027t miss at Changi Airport.", "name": "IRVINS Salted Egg - Jewel Changi Airport", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and walk directly to Basement 2 of Jewel Changi Airport."}, {"address": "Departure/Transit Lounge South, Terminal 3, Singapore Changi Airport, Singapore 819663", "feature": "\u2b50 4.6 Stars | Must-Buy List: 1910 Coffee Bag Gift Box, Signature Singapore Morning Coffee Beans, French Croissants. A luxury coffee brand originating in Marrakech and flourishing in Singapore. Located in Terminal 3 of Changi Airport, this boutique boasts opulent, golden decor and offers pure single-origin and flavored coffees from dozens of regions worldwide. Their classic 1910 Coffee Bag carries sweet notes of wild strawberries and whipped cream, packaged like a work of art\u2014making it an exceptionally classy and sophisticated gift.", "name": "Bacha Coffee - Changi Airport T3", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and head to the Departure Transit Lounge inside Terminal 3."}, {"address": "#1K-209, Jewel Changi Airport, 78 Airport Boulevard, Singapore 819666", "feature": "\u2b50 4.4 Stars | Must-Buy List: Pandan Swiss Roll, Durian Swiss Roll, Kaya Swiss Roll. Founded in 1997, this well-loved local Singaporean bakery is famous for its handcrafted, extra-long Swiss rolls. The cake is moist and soft, stuffed generously with filling. Their top-selling Pandan flavor infuses natural pandan leaf fragrance with silky whipped cream, while the Durian flavor features rich, fresh durian flesh. Popular with both locals and tourists, it\u0027s a hot-ticket dessert spot at Jewel Changi Airport.", "name": "Rich \u0026 Good Cake Shop - Jewel Changi Airport", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and take the direct linkway to Level 1 of Jewel Changi Airport."}, {"address": "Departure/Transit Lounge, Terminal 3, Singapore Changi Airport, Singapore 819663", "feature": "\u2b50 4.5 Stars | Must-Buy List: Signature Sliced Pork Bakkwa, Prawn Bakkwa, Crispy Pork Floss. A legendary Singaporean bakkwa (barbecued meat) brand established in 1938, dedicated to traditional charcoal-grilling techniques. Their signature sliced pork bakkwa is thick yet tender, infusing a slightly charred smoky aroma with a secret sweet-and-savory glaze that stays juicy without drying out. The Changi Airport branch offers neatly sealed, travel-friendly packaging, perfect for enjoying at your hotel or gifting as a high-quality local delicacy.", "name": "Lim Chee Guan - Changi Airport T3", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and proceed to the Departure Transit Lounge inside Terminal 3."}, {"address": "113 East Coast Road, Singapore 428803", "feature": "\u2b50 4.3 Stars | Must-Buy List: Handmade Nyonya Kueh, Traditional Nyonya Pineapple Tarts, Special Nyonya Sambal. Housed in a stunning blue Peranakan heritage mansion on Joo Chiat Road in Katong, Rumah Bebe is run by Peranakan culture expert Bebe Chaudhry. Besides serving exceptionally authentic handmade traditional Nyonya pastries (such as Pulut Intan and Nine-Layer Cake), the shop sells intricate beaded slippers and traditional attire. Their baked pineapple tarts offer a perfectly balanced sweet-and-tangy flavor with a crumbly crust, making this a wonderful hidden gem for experiencing authentic Baba-Nyonya culture and purchasing refined handcrafted gifts.", "name": "Rumah Bebe", "transport": "Take the MRT Thomson-East Coast Line to Marine Parade Station (TE26) and walk for about 5 minutes."}, {"address": "#01-B248, Jewel Changi Airport, 78 Airport Boulevard, Singapore 819666", "feature": "\u2b50 4.4 Stars | Must-Buy List: Kaya Liqueur Chocolates, Sugar-Free Durian Chocolates, Pandan Truffles. A premier homegrown Singaporean chocolate brand that specializes in infusing unique Southeast Asian flavors into creative artisanal chocolates. Co-created by a master chocolatier and a medical doctor, CHOCOELF focuses on low-sugar and no-added-sugar healthy concepts. Their high-purity chocolates incorporate local flavors like Kaya, durian, and pandan leaves, housed in gift boxes depicting Singapore landmark motifs\u2014making it a highly distinctive and sophisticated local treat.", "name": "CHOCOELF - Jewel Changi Airport", "transport": "Take the MRT East-West Line to Changi Airport Station (CG2) and go directly to Level 1 of Jewel Changi Airport."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "5 Changi Business Park Central 1, Singapore 486038", "feature": "\u2b50 4.2 Stars | Must-Buy List: Nike Factory Store limited-edition discounted sneakers, Adidas Outlet training apparel, Pedro odd-size/clearance bags. Changi City Point is the most famous outlet mall in Eastern Singapore, located just one MRT stop from Changi Airport. It houses numerous brand outlet stores including Nike, Adidas, Puma, Timberland, and Charles \u0026 Keith (CK), offering year-round discounts as low as 70% off. It is a fantastic bargain-hunting destination before leaving Singapore.", "name": "Changi City Point Outlet", "transport": "Take the MRT Downtown Line (DTL) or East West Line (EWL) to Expo Station (Expo, DT35/CG1), exit and walk about 3 minutes."}, {"address": "78 Airport Blvd., Singapore 819666", "feature": "\u2b50 4.7 Stars | Must-Buy List: IRVINS salted egg fish skin, Supermama Merlion motif porcelain, Violet Oon limited Pandan Chiffon Cake. Jewel Changi Airport seamlessly blends lush greenery with a massive modern shopping complex, featuring the world\u0027s tallest indoor waterfall. It brings together numerous homegrown Singaporean brands and flagship stores offering exclusive local souvenirs, gourmet food, fashion, and lifestyle crafts\u2014a must-visit shopping landmark before departure.", "name": "Jewel Changi Airport", "transport": "Take the MRT East West Line (EWL) Changi Airport Branch to Changi Airport Station (CG2), connected directly to Terminals 1, 2, and 3 via indoor walkways."}, {"address": "80 Marine Parade Rd, Singapore 449269", "feature": "\u2b50 4.3 Stars | Must-Buy List: Marks \u0026 Spencer British shortbread cookies, Isetan exclusive cosmetics sets, Eu Yan Sang premium bird\u0027s nest gift sets. Parkway Parade is one of the largest and oldest integrated suburban shopping malls in the East Coast and Katong region. Featuring over 250 stores, including Isetan Department Store, Marks \u0026 Spencer, and many local family-favorite chains and lifestyle grocers, it offers an authentic glimpse into everyday local retail life.", "name": "Parkway Parade", "transport": "Take the MRT Thomson-East Coast Line (TEL) to Marine Parade Station (TE26); accessible immediately upon exiting."}, {"address": "112 East Coast Rd, Singapore 428802", "feature": "\u2b50 4.4 Stars | Must-Buy List: PopWay local independent designer handmade earrings, Scoop Wholefoods bulk natural nuts, Singapore specialty house fragrances. Located in the heart of Katong, i12 Katong is a stylish lifestyle mall that seamlessly blends Peranakan heritage with modern trendy elements. It features popup stores by local designers, creative brands, and eco-friendly shops, making it a great destination for unique East Coast flair and homegrown design products.", "name": "i12 Katong", "transport": "Take the MRT Thomson-East Coast Line (TEL) to Marine Parade Station (TE26) and walk about 8 minutes, or take Bus 10, 12, or 14 and get off at the I12 Katong stop."}, {"address": "448 Joo Chiat Rd, Singapore 427661", "feature": "\u2b50 4.6 Stars | Must-Buy List: Singapore motif printed tote bags, retro Merlion illustrated postcards, local handmade cat-themed creative crafts. Cat Socrates is a famous local independent lifestyle select shop in Singapore, and its Katong branch is filled with rich local character. The shop curates works from local independent illustrators and designers, offering everything from vintage homeware and stationery to authentic Singaporean souvenirs\u2014complete with a friendly resident shop cat.", "name": "Cat Socrates (Katong)", "transport": "Take Bus 16 or 33, alight at the Opposite Maranatha Hall stop, and walk for about 2 minutes."}, {"address": "113 East Coast Rd, Singapore 428803", "feature": "\u2b50 4.5 Stars | Must-Buy List: Handmade Nyonya beaded shoes (Kasot Manek), traditional hand-crafted Kebaya attire, hand-painted Nyonya porcelain tea sets. Rumah Bebe is an iconic traditional heritage boutique in Katong, founded by cultural preservationist Bebe Seet. Specializing in Southeast Asian Peranakan handicrafts, its interior preserves the classic shophouse style. Visitors can purchase exquisitely crafted beaded shoes and fine traditional Kebayas, offering a precious and refined local cultural shopping experience.", "name": "Rumah Bebe (Nyonya Boutique)", "transport": "Take the MRT Thomson-East Coast Line (TEL) to Marine Parade Station (TE26) and walk about 6 minutes."}, {"address": "109 East Coast Rd, Singapore 428800", "feature": "\u2b50 4.5 Stars | Must-Buy List: Mini traditional Nyonya rice dumpling trinkets, Nyonya Pandan Kaya spread, hand-painted Nyonya tea sets. Established in 1945, Rumah Kim Choo is the most authentic Peranakan cultural boutique and souvenir shop in Katong and Joo Chiat. Beyond its famous Nyonya rice dumplings and delicacies, its retail area offers a wealth of exquisite local heritage goods, including house-blend Kaya, Peranakan apparel, traditional accessories, and porcelain.", "name": "Rumah Kim Choo Flagship Store", "transport": "Take the MRT Thomson-East Coast Line (TEL) to Marine Parade Station (TE26) and walk about 5 minutes."}, {"address": "30 East Coast Rd, Singapore 428751", "feature": "\u2b50 4.1 Stars | Must-Buy List: FairPrice Finest exclusive Prima Taste Laksa Lamian sets, local organic skincare products, artisanal Nanyang-style cookies. Katong V is a charming boutique mall infused with nostalgic Katong flair. Its anchor supermarket, FairPrice Finest, stocks an extensive selection of premium local ingredients and specialty food items, alongside various lifestyle goods and wellness/spa boutiques\u2014making it a comfortable spot for buying quality local snacks and gifts.", "name": "Katong V", "transport": "Take Bus 10, 12, 14, or 32, alight at the Roxy Square stop, and walk about 2 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Changi and Katong"}, "chinatown": {"categories": {"cat_1": {"items": [{"address": "269 South Bridge Rd, Singapore 058818", "feature": "\u2b50 4.5 stars | Must-Buy List: Bird\u0027s Nest Beauty Drink, Herbal Radiance Skincare Mask, Bo Ying Compound. As Singapore\u0027s oldest traditional Chinese wellness apothecary, this century-old flagship store in Chinatown combines traditional Chinese herbal medicine with modern cosmetic technology. The store\u0027s most popular items are beauty drinks combining high-purity bird\u0027s nest with herbal ingredients and natural face powders, making it the top choice for tourists seeking natural internal and external skin conditioning.", "name": "Eu Yan Sang South Bridge Road Flagship", "transport": "Take the MRT North East Line or Downtown Line to Chinatown Station, exit via Exit A, walk along Pagoda Street for about 5 minutes, and turn onto South Bridge Road."}, {"address": "34 Pagoda St, Singapore 059193", "feature": "\u2b50 4.6 stars | Must-Buy List: Nutmeg Oil, Handshake Brand Safflower Oil, Natural Citronella Mosquito Repellent Balm. Founded in 1916, Chop Wah On is Singapore\u0027s most famous century-old brand for medicinal beauty and essential oils, located in the bustling area of Pagoda Street in Chinatown. The store follows ancient methods to refine various plant essential oils and ointments. Among them, nutmeg oil and safflower oil are extraordinarily effective for soothing skin discomfort and skin repair, making them household staple local specialties in Singapore.", "name": "Chop Wah On", "transport": "Take the MRT North East Line or Downtown Line to Chinatown Station, exit via Exit A, and walk for about 1 minute."}, {"address": "201 New Bridge Rd, Singapore 059428", "feature": "\u2b50 4.4 stars | Must-Buy List: Pure Natural Crocodile Oil Skin Repair Essence, Herbal Anti-Acne Cleanser, Ready-to-Drink Rock Sugar Bird\u0027s Nest. Thye Shan Medical Hall is a highly authoritative traditional Chinese medicine and herbal skincare specialty shop in Singapore\u0027s Chinatown. One of Singapore\u0027s most famous traditional skincare products, Crocodile Oil, can be bought here in its purest quality. Rich in natural fatty acids that repair the skin barrier, crocodile oil is particularly effective for dry, cracked, and sensitive skin. The store also offers a variety of TCM moisturizing and anti-acne beauty products.", "name": "Thye Shan Medical Hall", "transport": "Take the MRT North East Line or Downtown Line to Chinatown Station, exit via Exit A, and walk along New Bridge Road for about 2 minutes."}, {"address": "7 Tanjong Pagar Plaza, Singapore 081007", "feature": "\u2b50 4.7 stars | Must-Buy List: Kaleanser (Kale Jelly Cleansing Gel), Morning Glow Sunscreen, Youth Beam Anti-Aging Serum. Sigi Skin is one of Singapore\u0027s most iconic new-generation local clean beauty brands, focusing on herbal skincare that combines superfoods with high-tech active ingredients. Located in Tanjong Pagar, this experiential concept store showcases a minimalist, toxin-free beauty philosophy. Free of artificial fragrances and harmful chemicals, its products are highly praised by local young women and beauty enthusiasts.", "name": "Sigi Skin Tanjong Pagar", "transport": "Take the MRT East West Line to Tanjong Pagar Station, exit via Exit A, and walk for about 5 minutes."}, {"address": "16 Sago St, Singapore 059016", "feature": "\u2b50 4.3 stars | Must-Buy List: Safflower Oil, Neck \u0026 Shoulder Soothing Balm, Herbal Universal Ointment. Founded over a century ago, Fung Man Kee is one of the few remaining traditional herbal wellness and topical ointment shops in Singapore\u0027s Chinatown. Its natural plant ointments and essential oils, crafted from exclusive proprietary formulas, not only relieve muscle soreness but are also used by many locals as a repair balm for soothing sensitive skin and insect bites, making it rich in Singaporean local heritage.", "name": "Fung Man Kee", "transport": "Take the MRT North East Line or Downtown Line to Chinatown Station, exit via Exit A, and walk along Sago Street for about 4 minutes."}, {"address": "11 Tanjong Pagar Rd, Singapore 088434", "feature": "\u2b50 4.8 stars | Must-Buy List: Organic Rosehip Repair Oil, Customized Skincare Serum Oil, Soothing Botanical Mist. Scent Apothecary is an independent boutique aromatherapy and natural skincare brand unique to Singapore, located near the trendy neighborhood of Tanjong Pagar. The shop focuses on pure plant essential oil extractions and organic skin care. Customers can experience custom-blended botanical essential oils tailored on the spot to their skin conditions. Its elegant packaging, combined with excellent moisturizing and antioxidant benefits, makes it a top-rated beauty shop in the area.", "name": "Scent Apothecary Tanjong Pagar", "transport": "Take the MRT East West Line to Tanjong Pagar Station, exit via Exit A, and walk for about 4 minutes."}, {"address": "133 New Bridge Rd, #B1-01 Chinatown Point, Singapore 059413", "feature": "\u2b50 4.2 stars | Must-Buy List: Bio-essence Deep Exfoliating Gel, Tiger Balm Warm Soothing Patch, Silkygirl Shine-Free Powder. Guardian is one of Singapore\u0027s largest health and beauty retail chains. The outlet in Chinatown Point brings together many unique beauty brands exclusive to Singapore and Southeast Asia. Particularly recommended is Singapore\u0027s beloved domestic beauty brand Bio-essence, whose exclusive Royal Jelly and Gold skincare series are immensely popular locally. Offering exceptional quality at affordable prices, it is a fantastic destination to stock up on Southeast Asian cosmetics and drugstore finds.", "name": "Guardian Health \u0026 Beauty Chinatown Point", "transport": "Take the MRT North East Line or Downtown Line to Chinatown Station; the MRT station exit directly connects to Basement 1 of Chinatown Point shopping mall."}, {"address": "1 Wallich St, #B2-12/13 Guoco Tower, Singapore 078881", "feature": "\u2b50 4.3 stars | Must-Buy List: Bio-essence Bird\u0027s Nest Peptides Nourishing Cream, Tiger Balm Essential Oil Hand Cream, Dr. Dermis Sensitive Skin Repair Serum. Located inside Guoco Tower in Tanjong Pagar, Watsons is a popular shopping spot for office workers and tourists looking for Singapore-exclusive beauty products. In addition to carrying a rich selection of international cosmetics, it features a dedicated local Singapore brand section, highlighting exclusive items such as the Tiger Balm skincare range and Bio-essence Bird\u0027s Nest Peptides whitening products\u2014affordably priced with frequent exclusive local deals.", "name": "Watsons Guoco Tower", "transport": "Take the MRT East West Line to Tanjong Pagar Station; the MRT station directly connects to Basement 2 of Guoco Tower."}], "name": "Iconic Local Beauty \u0026 Health Retailers"}, "cat_2": {"items": [{"address": "116 Telok Ayer Street, Singapore 068585", "feature": "\u2b50 4.8 stars | Must-Buy List: Custom suit ties, handmade leather cardholders, modern-fit printed shirts. Located in the historic Telok Ayer neighborhood, this independent men\u0027s boutique fashion store was founded by a local Singaporean designer. The store specializes in high-end semi-bespoke and bespoke tailoring for the modern gentleman, seamlessly blending British tailoring with the demands of Nanyang\u0027s tropical climate. Beyond exquisite suits, its geometric pattern ties and high-quality leather accessories are huge hits among local business executives and stylish gents\u2014perfect for men looking to elevate their personal taste.", "name": "Q Menswear", "transport": "Take the MRT Downtown Line to \u0027Telok Ayer (DT18)\u0027 station, Exit A, and walk about 2 minutes."}, {"address": "70 Eu Tong Sen Street, Singapore 059805", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade mulberry silk cheongsams, vintage embroidered handbags, pure silk loungewear. Housed in an iconic landmark building in the heart of Chinatown, this legacy Singapore department store offers the most comprehensive selection of traditional and modern tailored Chinese apparel in the country. Locals and tourists alike flock here to shop for elegantly cut pure silk cheongsams and beautifully embroidered bags steeped in Oriental charm. Boasting superb craftsmanship and cultural heritage, it\u0027s a quintessential cultural shopping destination.", "name": "Yue Hwa Chinese Products", "transport": "Take the MRT North East Line or Downtown Line to \u0027Chinatown (NE4/DT19)\u0027 station, Exit A leads directly there."}, {"address": "133 New Bridge Road, #01-11 Chinatown Point, Singapore 059413", "feature": "\u2b50 4.5 stars | Must-Buy List: Trapezoid metal-buckle handbags, minimalist square-toe block heels, woven shoulder bags. Singapore\u2019s globally renowned homegrown fashion label, affectionately known as \u0027Little CK\u0027, features a spacious store at Chinatown Point. Famous for high value-for-money products and cutting-edge designs straight off global fashion weeks, new styles drop weekly\u2014ranging from sleek evening clutches to practical daily totes. It\u0027s an absolute must-visit footwear and bag shopping destination for ladies in Singapore.", "name": "Charles \u0026 Keith (Chinatown Point)", "transport": "Take the MRT North East Line or Downtown Line to \u0027Chinatown (NE4/DT19)\u0027 station, Exit E underpass connects directly to Chinatown Point."}, {"address": "1 Wallich Street, #B1-09 Guoco Tower, Singapore 078881", "feature": "\u2b50 4.6 stars | Must-Buy List: Wrinkle-resistant bamboo fiber shirts, handmade silk pocket squares, creatively designed cufflinks. A premium homegrown menswear and accessory brand located in Tanjong Pagar\u0027s landmark Guoco Tower. Championing \u0027gentleman style that doesn\u0027t blindly follow trends\u0027, the brand focuses on high-quality fabrics and unique details. Its breathable, wrinkle-free shirts tailored for tropical weather are huge hits with local professionals. Business executives also frequent the store specifically for its exquisite cufflinks and stylish pocket squares.", "name": "The Shirt Bar (Guoco Tower)", "transport": "Take the MRT East West Line to \u0027Tanjong Pagar (EW15)\u0027 station, Exit C connects directly to the Guoco Tower basement mall."}, {"address": "133 New Bridge Road, #01-12 Chinatown Point, Singapore 059413", "feature": "\u2b50 4.4 stars | Must-Buy List: Genuine leather business briefcases, minimalist leather backpacks, classic metal-buckle loafers. A well-known homegrown Singapore fashion brand offering upscale footwear and accessories, operating as the higher-end line under the Charles \u0026 Keith Group. PEDRO specializes in refined, luxurious, and contemporary shoes, handbags, and leather goods. Its men\u0027s leather briefcases and women\u0027s sleek handbags are immensely popular among Singapore\u0027s urban professionals, offering high-end leather quality at a fraction of luxury brand prices.", "name": "PEDRO (Chinatown Point)", "transport": "Take the MRT North East Line or Downtown Line to \u0027Chinatown (NE4/DT19)\u0027 station, Exit E underpass connects directly to Chinatown Point."}, {"address": "1 Wallich Street, #B1-12 Guoco Tower, Singapore 078881", "feature": "\u2b50 4.7 stars | Must-Buy List: Minimalist tailored dresses, high-waisted linen wide-leg pants, elegant cropped knit tops. A wildly popular independent womenswear designer label in Singapore, featuring an aesthetically pleasing store decorated in minimalist warm beige tones. With a core philosophy centered on \u0027sustainability and timeless style\u0027, its collections feature earth tones and sleek silhouettes that seamlessly combine comfort and high fashion. Beloved by modern Singaporean women and fashion bloggers, it\u0027s the ideal place to pick up sophisticated urban Singaporean style.", "name": "Klarra (Guoco Tower)", "transport": "Take the MRT East West Line to \u0027Tanjong Pagar (EW15)\u0027 station, Exit C connects directly to the Guoco Tower basement mall."}, {"address": "1 Wallich Street, #B1-13 Guoco Tower, Singapore 078881", "feature": "\u2b50 4.6 stars | Must-Buy List: British-style vintage dress shoes, retro canvas messenger bags, linen-blend casual blazers. Originating in Singapore, this well-known vintage British-inspired menswear designer brand effortlessly fuses Melbourne\u0027s retro art scene with Singapore\u0027s contemporary vibe. The store is filled with the warm scent of wood and fine leather. Alongside sharp suits and casual wear, its handcrafted vintage leather shoes and high-texture canvas-leather hybrid bags are bestsellers\u2014a true shopping haven for lovers of vintage gentleman and dapper styles.", "name": "BENJAMIN BARKER (Guoco Tower)", "transport": "Take the MRT East West Line to \u0027Tanjong Pagar (EW15)\u0027 station, Exit C connects directly to the Guoco Tower basement mall."}, {"address": "32 New Market Road, #02-1114 People\u0027s Park Centre, Singapore 050032", "feature": "\u2b50 4.3 stars | Must-Buy List: Custom modern cheongsams, Peranakan-style hand-embroidered shawls, silk embroidered coin purses. Located inside People\u0027s Park Centre in Chinatown, this legendary independent tailor shop with decades of history is helmed by veteran Singaporean master tailors. Preserving traditional Nanyang Chinese and Peranakan apparel tailoring craftsmanship, it offers off-the-rack modern cheongsams as well as bespoke tailoring services. Many local women visit specifically before major festivals or weddings to get a one-of-a-kind cheongsam custom-made.", "name": "Golden Scissor Cheongsam", "transport": "Take the MRT North East Line or Downtown Line to \u0027Chinatown (NE4/DT19)\u0027 station, Exit C and walk about 1 minute to reach People\u0027s Park Centre."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "203 New Bridge Rd, Singapore 059429", "feature": "\u2b50 4.6 stars | Must-buy list: Signature Sliced Pork, Prawn Bakkwa, Crispy Pork Floss. Founded in 1938, Lim Chee Guan is Chinatown\u0027s most iconic heritage brand for traditional charcoal-grilled bakkwa (sweet savory jerky). Adhering to time-honored hand-grilled charcoal methods, their bakkwa retains a rich smoky aroma and juicy texture. Tender, succulent, and perfectly balanced between sweet and savory, it is widely acclaimed by tourists and locals as the ultimate Nanyang bakkwa souvenir.", "name": "Lim Chee Guan Bakkwa", "transport": "Take the MRT Downtown Line or North East Line to Chinatown MRT Station (Exit A), then walk about 2 minutes."}, {"address": "2 Smith St, Singapore 058917", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Pineapple Tarts, Pandan Pineapple Tarts, Rose Pineapple Tarts. A renowned home-grown Singapore brand with over 30 years of history, once voted the best souvenir in Singapore. Famous for its golden, buttery, melt-in-your-mouth crust paired with a tangy-sweet, non-sticky pineapple filling. The pandan-flavored tart is a uniquely popular item infused with Southeast Asian flair.", "name": "Kele Pineapple Tarts", "transport": "Take the MRT Downtown Line or North East Line to Chinatown MRT Station (Exit A), then walk about 3 minutes."}, {"address": "285 South Bridge Rd, Singapore 058833", "feature": "\u2b50 4.4 stars | Must-buy list: Diamond-shaped Egg Tarts, Coconut Tarts, Traditional Sweet Wife Cakes. Established in the 1920s, this century-old Cantonese bakery is famous for its unique diamond-shaped flaky egg tarts. Featuring a silky, custard-like egg filling wrapped in a light, multi-layered crust, these freshly baked, perfectly sweet treats are a classic pastry in Chinatown you cannot miss.", "name": "Tong Heng Delicacies", "transport": "Take the MRT Thomson-East Coast Line to Maxwell MRT Station (Exit 2), then walk about 3 minutes."}, {"address": "133 New Bridge Rd, #B1-47 Chinatown Point, Singapore 059413", "feature": "\u2b50 4.3 stars | Must-buy list: Signature Salty Tau Sar Piah, Yam Paste with Egg Yolk Pastry, Traditional Soft Candy. Founded in 1943, this heritage Teochew bakery specializes in authentic handcrafted Teochew pastries. Their best-selling Salty Tau Sar Piah features paper-thin flaky crust wrapped around smooth mung bean paste infused with aromatic shallot oil. The perfect sweet and savory balance is deeply loved by foodies of all ages.", "name": "Thye Moh Chan", "transport": "Take the MRT Downtown Line or North East Line to Chinatown MRT Station (Exit E) for direct access to Chinatown Point Basement 1."}, {"address": "133 New Bridge Rd, #B1-02 Chinatown Point, Singapore 059413", "feature": "\u2b50 4.3 stars | Must-buy list: Pandan Chiffon Cake, Kueh Lapis (Layer Cake), Nyonya Rainbow Lapis Sagu. Singapore\u0027s most famous Nyonya pastry brand. Its light and fluffy Pandan Chiffon Cake, rich with natural pandan leaf aroma and coconut fragrance, is celebrated as a national-treasure dessert that you must buy before leaving Singapore.", "name": "Bengawan Solo", "transport": "Take the MRT Downtown Line or North East Line to Chinatown MRT Station (Exit E) for direct access to Chinatown Point Basement 1."}, {"address": "70 Eu Tong Sen St, Singapore 059805", "feature": "\u2b50 4.2 stars | Must-buy list: Axe Brand Universal Oil, Prima Taste Laksa La Mian, Nanyang Curry Cooking Paste. Housed in a historic heritage building in the heart of Chinatown, this is a one-stop shopping landmark for Southeast Asian medicated oils, local sauce kits, and unique Singaporean snacks, offering a comprehensive and quality-assured selection.", "name": "Yue Hwa Chinese Products", "transport": "Take the MRT North East Line to Chinatown MRT Station (Exit C) for direct access."}, {"address": "257 South Bridge Rd, Singapore 058806", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Sliced Pork Bakkwa, Gourmet Fine Slice (Coin) Pork Bakkwa, Chili Pork Bakkwa. A premium local bakkwa brand committed to using 100% fresh Australian pork. Marinated with a secret sauce and grilled over traditional charcoal, the meat is tender yet wonderfully chewy with a mouthwatering smoky aroma\u2014a true local insider favorite.", "name": "Kim Joo Guan Bakkwa", "transport": "Take the MRT Thomson-East Coast Line to Maxwell MRT Station (Exit 2), then walk about 2 minutes."}, {"address": "251 South Bridge Rd, Singapore 058800", "feature": "\u2b50 4.1 stars | Must-buy list: Lobster Bakkwa, Ostrich Bakkwa, Dried Durian. A traditional Chinatown store famous for innovative flavors. Beyond classic pork bakkwa, they have developed unique lobster and ostrich bakkwa, alongside a variety of tropical dried fruits and signature spreads\u2014perfect for adventurous travelers looking to try something new.", "name": "Woo Zhen Lu Dried Meat Shop", "transport": "Take the MRT Thomson-East Coast Line to Maxwell MRT Station (Exit 2), then walk about 3 minutes."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "70 Eu Tong Sen St, Singapore 059805", "feature": "\u2b50 4.4 stars | Must-buy list: Singaporean-style printed cheongsams, wild bird\u0027s nest gift boxes, natural traditional Chinese medicine skincare products. Housed in an iconic landmark building in the heart of Chinatown, this historic five-story local department store blends traditional Chinese goods with modern creative lifestyle items. Offering everything from Oriental embroidered clothing and traditional tea sets to various health tonics, it is the top choice for travelers looking for souvenirs infused with deep Eastern heritage.", "name": "Yue Hwa Chinese Products", "transport": "Take the MRT Downtown Line or North East Line to Chinatown Station (Exit C), then walk for about 1 minute."}, {"address": "100 Upper Cross St, Singapore 058358", "feature": "\u2b50 4.1 stars | Must-buy list: Singaporean Crocodile casual wear, imported daily cosmetics/skincare, high-quality local luggage. OG is one of Singapore\u0027s most iconic old-school discount department stores, deeply loved by locals and shoppers alike. Offering very affordable prices, it frequently hosts brand sales and seasonal discounts. With products ranging from apparel, shoes, and bags to homeware and health supplements, it is a great spot to hunt for high-value local goods.", "name": "OG People\u0027s Park", "transport": "Take the MRT North East Line to Chinatown Station (Exit C), connected directly to People\u0027s Park Complex via the underground walkway."}, {"address": "133 New Bridge Rd, Singapore 059413", "feature": "\u2b50 4.3 stars | Must-buy list: Bee Cheng Hiang freshly grilled bakkwa (pork jerky), Song Fa Bak Kut Teh spice packs, affordable local women\u0027s shoes. Chinatown Point is one of the largest modern integrated shopping malls in the Chinatown area, featuring brands like MUJI and Matsumoto Kiyoshi, alongside numerous famous shops selling traditional Singaporean food souvenirs. A large FairPrice Finest supermarket in the basement makes it easy for tourists to stock up on local snacks and gifts all in one go.", "name": "Chinatown Point", "transport": "Take the MRT Downtown Line or North East Line to Chinatown Station (Exit E), connected directly to the mall via the underground walkway."}, {"address": "100 Tras St, Singapore 079027", "feature": "\u2b50 4.2 stars | Must-buy list: DON DON DONKI exclusive Japanese snacks, local Singaporean creative lifestyle items, Japanese-style quality apparel. Located in the heart of the Tanjong Pagar commercial district, this refined mall focuses on Japanese fashion and modern lifestyle. Featuring the large Japanese discount store DON DON DONKI, various independent cafes, and lifestyle boutique stores, it is a favorite shopping and leisure spot for business professionals and local residents.", "name": "100 AM Mall", "transport": "Take the MRT East West Line to Tanjong Pagar Station (Exit A), then walk for about 5 minutes."}, {"address": "1 Wallich St, Singapore 078881", "feature": "\u2b50 4.5 stars | Must-buy list: Singaporean original design fragrances, artisanal dark chocolates, niche designer leather bags. Sitting at the base of Singapore\u0027s tallest skyscraper, Guoco Tower combines premium retail space with lush outdoor greenery. It houses many local independent design brands, fine dining options, and lifestyle concept stores. With a sleek, modern metropolitan vibe, it is an ideal spot for finding refined souvenirs and high-end design products.", "name": "Guoco Tower", "transport": "Take the MRT East West Line to Tanjong Pagar Station; the mall sits directly above the station."}, {"address": "36 Mosque St, Singapore 059514", "feature": "\u2b50 4.6 stars | Must-buy list: \u0027Bu Zhi Xiang\u0027 Bak Kut Teh pairing tea, \u0027Bu Zhi Xiang\u0027 Tieguanyin tea leaves, vintage tin gift boxes. Established in 1925, this century-old independent tea merchant is the official tea supplier to many famous local Bak Kut Teh eateries. The store retains a strong nostalgic ambiance, offering professionally hand-wrapped traditional teas and on-site tasting experiences. Deeply showcasing Singapore\u0027s traditional tea culture, it is a highly iconic local shop.", "name": "Pek Sin Choon", "transport": "Take the MRT Downtown Line to Chinatown Station (Exit A), then walk for about 3 minutes to Mosque Street."}, {"address": "2-A Keong Saik Rd., Singapore 089109", "feature": "\u2b50 4.7 stars | Must-buy list: 1950s vintage printed dresses, handmade vintage leather handbags, independent designer vintage accessories. Located near Tanjong Pagar, this independent vintage fashion boutique specializes in fine clothing and exquisite accessories from the 1950s to 1980s. Carefully curated and restored from around the world and local Singapore, these vintage pieces are deeply loved by local fashionistas and treasure-hunting tourists, making it a great spot to experience the unique charm of Tanjong Pagar\u0027s independent shops.", "name": "Dustbunny Vintage", "transport": "Take the MRT Thomson-East Coast Line to Maxwell Station (Exit 3), then walk for about 3 minutes to Keong Saik Road."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.5 stars | Must-buy list: Discounted Charles \u0026 Keith bags and shoes, Nike outlet sneakers, classic Coach outlet leather goods. As Singapore\u0027s largest and most iconic outlet mall, IMM brings together over 100 discount outlet stores from famous international and local brands, offering amazing discounts of 20% to 80% year-round. Although not in the heart of Chinatown, it is directly accessible by MRT from Tanjong Pagar and Chinatown, making it an unmissable bargain shopping paradise for tourists visiting Singapore.", "name": "IMM Outlet Mall", "transport": "Take the MRT East West Line from Tanjong Pagar Station to Jurong East Station, then walk for about 10 minutes via the pedestrian bridge."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Chinatown and Tanjong Pagar"}, "civic_clarke_quay": {"categories": {"cat_1": {"items": [{"address": "252 North Bridge Rd, #B1-31 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.5 stars | Must-Haves: Bird\u0027s Nest Nourishing \u0026 Plumping Sheet Mask, Pure Pearl Powder Whitening Capsules, Bottled Bird\u0027s Nest with Rock Sugar. A century-old Chinese herbal wellness and beauty brand originating from Singapore and Southeast Asia, seamlessly combining traditional Chinese medicine with modern skincare technology. Its bird\u0027s nest mask and pearl powder series are highly recommended by locals and tourists alike for holistic inner and outer care. Staff members are professional and offer detailed consultations, highlighting unique Oriental wellness beauty traditions.", "name": "Eu Yan Sang - Raffles City", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), directly connected via the underground walkway to Raffles City B1."}, {"address": "15 Stamford Rd, #01-83 Capitol Singapore, Singapore 178906", "feature": "\u2b50 4.6 stars | Must-Haves: Tuberose Soothing Body Oil, Thai Lime \u0026 Ginger Body Scrub, Natural Botanical Fragrance Diffuser. Originating from Singapore\u0027s top luxury resort brand \u0027Banyan Tree\u0027, this store specializes in premium, spa-grade botanical beauty and body care products. Designed like a private spa retreat, its essential oils and skincare items are crafted from natural organic ingredients, making it a must-visit for travelers seeking a high-quality home spa experience.", "name": "Banyan Tree Gallery - Capitol Singapore", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), exit via Exit B connected to Capitol Singapore, approximately a 2-minute walk."}, {"address": "107 North Bridge Rd, #01-K07 Funan, Singapore 179105", "feature": "\u2b50 4.5 stars | Must-Haves: Lemongrass Botanical Soothing Mist, Pure Cold-Process Moisturizing Bar Soap, Lavender Deep Sleep Roll-On Essential Oil. A renowned local Singaporean botanical aromatherapy and skincare brand, specializing in lightweight, non-greasy formulations specially designed for tropical climates. All products use natural essential oils and plant extracts without artificial fragrances, perfect for sensitive skin types and lovers of herbal scents.", "name": "HYSSOP - Funan", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), walk through the underground pedestrian linkway for about 5 minutes to reach Funan."}, {"address": "107 North Bridge Rd, #02-18 Funan, Singapore 179105", "feature": "\u2b50 4.7 stars | Must-Haves: Oasis Skin Zero-Waste Shampoo Bar, Local Organic Herbal Lip Balm, Scent Supply Co. Natural Handmade Fragrance Moisturizing Oil. Singapore\u0027s most famous eco-friendly and independent beauty curated store, bringing together numerous homegrown indie beauty brands. Focusing on vegan, cruelty-free, and zero-waste green skincare, it is the best spot to discover original, eco-conscious, and exquisite local beauty gems.", "name": "The Green Collective SG - Funan", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), walk through the underground pedestrian linkway for about 5 minutes to Funan Level 2."}, {"address": "252 North Bridge Rd, #01-12/13/14 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.4 stars | Must-Haves: Allies of Skin Peptides \u0026 Antioxidant Daily Treatment, Sigi Skin Kale Anti-Blue Light Sunscreen, Wishful Enzyme Exfoliating Scrub. Although an international beauty retail giant, this Raffles City flagship features a special Singapore Local Beauty section showcasing globally acclaimed home-grown luxury skincare brands like Allies of Skin and Sigi Skin. It\u0027s the ideal destination if you want to pick up top local science-backed tech beauty products all in one place.", "name": "Sephora - Raffles City Shopping Centre", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), located right at the Level 1 entrance above the station."}, {"address": "252 North Bridge Rd, #B1-46 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.3 stars | Must-Haves: Tiger Balm Ointment, Glowfully Hydrating Whitening Sheet Mask, Bio-Oil Skincare Oil. Guardian is Singapore\u0027s largest and most trusted local drugstore chain. This outlet in Raffles City boasts a comprehensive selection, offering everything from iconic traditional household medicated ointments to homegrown niche skincare brands\u2014a popular hotspot for everyday wellness and cosmetic shopping.", "name": "Guardian Health \u0026 Beauty - Raffles City", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), directly connected to Raffles City B1."}, {"address": "107 North Bridge Rd, #B2-13 Funan, Singapore 179105", "feature": "\u2b50 4.2 stars | Must-Haves: Double Prawn Brand Herbal Oil, Eagle Brand Medicated Oil, Local Ultra-Nourishing Hand Cream. Established by NTUC, Unity is an iconic local health and pharmacy store focusing on affordable prices and professional pharmacist consultations. It carries a rich selection of traditional Southeast Asian drugstore remedies, including highly rated local soothing oils and repair creams\u2014a fantastic hidden gem for savvy travelers and locals.", "name": "Unity Pharmacy - Funan", "transport": "Take the MRT East West Line (EW) or North South Line (NS) to City Hall Station (EW13/NS25), walk through the underground walkway to Funan B2."}, {"address": "6 Eu Tong Sen St, #B1-06/07 Clarke Quay Central, Singapore 059817", "feature": "\u2b50 4.2 stars | Must-Haves: Singapore Pure Crocodile Oil Repair Cream, Singapore Gold Lion Medicated Oil, Local Sensitive Skin Repair Cream. Situated right along the scenic Singapore River at Clarke Quay, this store features a specially curated \u0027Singapore Souvenirs \u0026 Specialty Health\u0027 section for tourists. Top-selling traditional remedies like pure crocodile oil and Gold Lion oil are fully stocked, making it convenient to pick up authentic local remedies after an evening stroll around Clarke Quay.", "name": "Watsons - Clarke Quay Central", "transport": "Take the MRT North East Line (NE) to Clarke Quay Station (NE5), directly connected to Clarke Quay Central B1 upon exiting."}], "name": "Iconic Local Beauty \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "107 North Bridge Rd, #02-09 Funan, Singapore 179105", "feature": "\u2b50 4.6 stars | Must-buy list: Cloud Sleeveless Dress, High-Waisted Tailored Trousers, Fitted Knit Top. Singapore\u0027s hottest homegrown womenswear brand, tailored specifically for Asian women\u0027s frames, combining chic urban minimalism with gentle elegance. The Funan flagship store is spacious and features a trendy fitting room photo zone, making it the premier destination for locals and tourists looking for workwear and resort outfits.", "name": "Love, Bonito (Funan Flagship Store)", "transport": "Take the MRT East West Line / North South Line to City Hall Station, then walk through the underpass for about 5 minutes to Level 2 of Funan."}, {"address": "107 North Bridge Rd, #02-08 Funan, Singapore 179105", "feature": "\u2b50 4.7 stars | Must-buy list: Nylon Dumpling Bag, Micro Bag, Color-Block Tote. A hit Singaporean independent designer brand famous for its minimalist aesthetic and vibrant color palettes. Their viral water-resistant nylon Dumpling Bag is lightweight, durable, and surprisingly spacious, attracting countless youth and travelers to collect them in every color.", "name": "Beyond The Vines (Funan Concept Store)", "transport": "Exit at MRT City Hall Station and follow the underground pedestrian linkway directly to Level 2 of Funan Mall."}, {"address": "252 North Bridge Rd, #01-33 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.5 stars | Must-buy list
