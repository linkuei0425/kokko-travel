 the MRT NS or DT Line to Orchard Station; located near the food hall on Basement 4 of ION Orchard."}, {"address": "2 Orchard Turn, #B2-K3 ION Orchard, Singapore 238801", "feature": "\u2b50 4.3 stars | Must-Buy List: Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. The pioneer that ignited the global salted egg craze, IRVINS lives up to its motto: \u0027Dangerously Addictive\u0027. Premium salted egg yolks, fresh curry leaves, and chili peppers are stir-fried and coated onto crispy deep-sea fish skin or potato chips. Every bite delivers a rich, savory, multi-layered flavor that isn\u0027t greasy at all. This ION Orchard store is fully stocked and often offers exclusive large packs and gift sets\u2014a wickedly delicious snack that vanishes instantly at gatherings!", "name": "IRVINS Salted Egg at ION Orchard", "transport": "Take the MRT NS Line to Orchard Station; located on Basement 2 of ION Orchard."}, {"address": "2 Orchard Turn, #02-20/21 ION Orchard, Singapore 238801", "feature": "\u2b50 4.5 stars | Must-Buy List: 1837 Black Tea, Singapore Breakfast Tea, Tea-Infused Macarons. Founded in Singapore, TWG Tea represents the pinnacle of global luxury tea brands. The flagship store at ION Orchard exudes elegance with polished brass fittings, handcrafted wooden tables, and hundreds of signature golden tea tins. Offering over 800 fine harvest single-estate teas and exclusive blends, their famous 1837 Black Tea features notes of berries, anise, and caramel for a smooth finish. Beautiful colorful artisan tea tins and tea-infused macarons make the perfect chic, luxurious gift from Singapore.", "name": "TWG Tea Flagship Salon at ION Orchard", "transport": "Take the MRT NS or DT Line to Orchard Station, which connects directly to Level 2 of ION Orchard."}, {"address": "2 Orchard Turn, #B4-07 ION Orchard, Singapore 238801", "feature": "\u2b50 4.4 stars | Must-Buy List: Singapore Sling Tea, Tropical Fruit Black Tea, Earl Grey Milk Tea Bags. Originating from the Ceylon tea trade in 1872, The 1872 Clipper Tea Co. is one of Singapore\u0027s oldest local tea brands. Compared to TWG\u0027s opulence, Clipper Tea offers a more artisanal, hipster, and local tropical charm. Its signature Singapore Sling Tea mirrors the classic cocktail\u0027s cherry and pineapple aromas in a ruby-red brew\u2014alcohol-free yet delightfully romantic. Housed in delicate vintage tins featuring Singapore landmarks, it\u0027s a must-buy souvenir on Orchard Road for tea lovers and aesthetic seekers alike.", "name": "The 1872 Clipper Tea Co. at ION Orchard", "transport": "Take the MRT NS Line to Orchard Station; located at the Basement 4 atrium of ION Orchard."}, {"address": "2 Orchard Turn, #03-28/29 ION Orchard, Singapore 238801", "feature": "\u2b50 4.5 stars | Must-Buy List: Singapore Curry Paste, Sambal Bajak, Traditional Pandan Kaya. Founded by Singapore\u0027s national culinary icon Violet Oon, this venue combines a luxurious restaurant with a boutique gift shop at ION Orchard. It highlights authentic, refined Peranakan and Singaporean specialty sauces, all slow-cooked according to traditional methods. From spicy aromatic sambal to creamy pandan kaya, each jar is packaged in boxes showcasing beautiful Nanyang tile art\u2014making it a top-tier gift to bring Singaporean flavors back home to culinary enthusiasts.", "name": "Violet Oon Singapore Gift Shop at ION Orchard", "transport": "Take the MRT NS Line to Orchard Station; located on Level 3 of ION Orchard."}, {"address": "313 Orchard Road, #B3-33 313@somerset, Singapore 238895", "feature": "\u2b50 4.2 stars | Must-Buy List: Ya Kun Signature Kaya Jar, Special Blend Coffee Powder, Kaya Toast Biscuits. Founded in 1944, Ya Kun is synonymous with traditional Singaporean breakfast and a beloved local household brand. Beyond serving fresh butter kaya toast and soft-boiled eggs on-site, the 313@somerset outlet is a popular spot to grab their iconic signature souvenir: Jarred Kaya Jam. Made by slow-simmering eggs, coconut milk, sugar, and pandan leaves, Ya Kun\u0027s Kaya is rich, sweet, and fragrant\u2014spread it on toast anytime to recreate the authentic Singapore breakfast experience at home.", "name": "Ya Kun Kaya Toast at 313@somerset", "transport": "Take the MRT NS Line to Somerset Station, which directly connects to Basement 3 of 313@somerset."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "320 Orchard Rd, Singapore 238865", "feature": "\u2b50 4.4 Stars | Must-Buy List: CHARLES \u0026 KEITH exclusive limited-edition shoes, Colette aromatherapy essential oil skincare products, and Bengawan Solo Pandan Chiffon Cake. Founded in 1932, TANGS is Singapore\u0027s oldest homegrown department store, featuring a distinctive Chinese palace-style green tiled roof that makes it an iconic landmark on Orchard Road. The store showcases numerous independent local Singaporean designer brands, Nanyang-inspired fragrances, and cultural products\u2014offering a much richer local touch than standard international malls. The basement level houses an extensive selection of counters dedicated to traditional Singaporean food souvenirs.", "name": "TANGS at Tang Plaza", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14), then access the store directly via the underground pedestrian walkway."}, {"address": "250 Orchard Rd, Singapore 238905", "feature": "\u2b50 4.5 Stars | Must-Buy List: Eden + Elie handcrafted glass bead jewelry, Artisan of Sense botanical handcrafted scented candles, and State Property original designer jewelry. Located in the heart of Orchard Road, Design Orchard is a curated retail space dedicated to showcasing Singapore\u0027s local designers and independent brands. Featuring over 100 original local brands, it offers everything from fashion apparel and woven bamboo bags to home fragrances and decor. Brimming with Nanyang creative charm, it is the ultimate destination to pick up one-of-a-kind Singapore souvenirs.", "name": "Design Orchard", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14), and walk along Orchard Road for about 5 minutes."}, {"address": "2 Orchard Turn, Singapore 238801", "feature": "\u2b50 4.6 Stars | Must-Buy List: TWG Tea 1837 Classic Tea Bag Gift Box, Bacha Coffee Moroccan-style drip coffee bags, and PAZZION comfortable local genuine leather flats. As the most iconic luxury shopping mall on Orchard Road, ION Orchard boasts a futuristic glass facade. Beyond top international luxury houses, it hosts flagship stores for prominent home-grown brands like Singapore\u0027s luxury tea maker TWG and local footwear label PAZZION. The basement 4 ION Food Hall is also a prime hotspot for sampling and purchasing renowned local snacks and treats.", "name": "ION Orchard", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14); ION Orchard is located directly above the station."}, {"address": "14 Scotts Rd, Singapore 228213", "feature": "\u2b50 4.1 Stars | Must-Buy List: Original printed dresses from local independent boutiques, Singapore streetwear, and unique handcrafted silver jewelry. Far East Plaza stands out on Orchard Road as a vibrant hub of independent retail. Quite different from massive department stores, it houses hundreds of local small shops, streetwear select stores, Korean-style apparel boutiques, and custom nail salons. Popular among local youth and indie design enthusiasts, it offers budget-friendly, unique fashion items\u2014making it a hidden gem for treasure hunting rare clothes and accessories.", "name": "Far East Plaza", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14), then walk along Scotts Road for about 6 minutes."}, {"address": "391 Orchard Rd, Singapore 238872", "feature": "\u2b50 4.5 Stars | Must-Buy List: The Golden Duck Salted Egg Fish Skin, IRVINS Salted Egg Potato Chips, and Ya Kun Kaya (coconut jam) gift sets. Ngee Ann City is a grand red-granite architectural landmark on Orchard Road. The B2 Food and Souvenir Hall inside Takashimaya Department Store is a must-visit for tourists. Here, you\u0027ll find an abundance of local Singaporean food and traditional pastry counters alongside sections showcasing Southeast Asian and Singaporean handicrafts, finely crafted shoes, and home goods\u2014a perfect fusion of international quality and local flavors.", "name": "Ngee Ann City - Takashimaya Department Store", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14), then walk through the underground connection for about 7 minutes."}, {"address": "68 Orchard Rd, Singapore 238839", "feature": "\u2b50 4.4 Stars | Must-Buy List: Love, Bonito local designer womenswear, Pedro fine leather wallets and men\u0027s shoes, and heritage Singaporean fragrance gift sets. Located at the eastern gateway of Orchard Road, Plaza Singapura is one of Singapore\u0027s oldest mega shopping complexes. It features a massive flagship store for Love, Bonito, Singapore\u0027s hit homegrown womenswear brand known for minimalist designs tailored for Asian fits. Additionally, it offers a wide array of local lifestyle and beauty select stores, making it a favorite among both locals and visitors.", "name": "Plaza Singapura", "transport": "Take the MRT North-South Line (NS), North-East Line (NE), or Circle Line (CC) to Dhoby Ghaut Station (NS24/NE6/CC1); direct underground access leads straight into the mall."}, {"address": "501 Orchard Rd, Singapore 238880", "feature": "\u2b50 4.3 Stars | Must-Buy List: Singapore designer leather accessories, accessible luxury botanical skincare gift sets, and indie design stationery. Famous for its distinctive glass pyramid architectural design, Wheelock Place is a lifestyle shopping mall focused on boutique dining and unique shops. Offering a more laid-back shopping vibe compared to bustling chain malls, it houses local designer boutiques, lifestyle store selections, and trendy cafes\u2014making it a superb spot to escape the crowds and find tasteful gifts.", "name": "Wheelock Place", "transport": "Take the MRT North-South Line (NS) or Thomson-East Coast Line (TE) to Orchard Station (NS22/TE14), accessible directly via the underground linkway."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.4 Stars | Must-Buy List: Charles \u0026 Keith classic clearance shoes and bags, Coach handbags at up to 70% off, and discounted Nike activewear. IMM is Singapore\u0027s largest and most recommended outlet mall, housing over 100 international and local brand factory outlets offering year-round discounts of up to 80% off. Must-visit highlights include the outlet store for local pride Charles \u0026 Keith, where you can score stylish shoes and bags at bargain prices. Top brands like Coach, Adidas, and Michael Kors also operate huge discount outlets here, making it an unmissable shopping paradise on your Singapore trip.", "name": "IMM Outlet Mall", "transport": "From Orchard Road, take the MRT North-South Line (NS) to Jurong East Station (NS1/EW24), then walk along the sheltered pedestrian bridge for about 8 minutes to arrive directly."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Orchard Road Shopping District"}, "sentosa": {"categories": {"cat_1": {"items": [{"address": "1 HarbourFront Walk, #01-01 VivoCity, Singapore 098585", "feature": "\u2b50 4.6 stars | Must-Buys: Customized \u0027My Daily Dose\u0027 Serum, Pure Revival Peel, Tri-Light Illuminating Device. Founded in Singapore and now a global sensation, this tech-beauty brand specializes in customized skincare. They offer on-site skin tests to blend personalized serums tailored to your needs, making it a favorite among local women and travelers seeking efficient, precision skincare.", "name": "Skin Inc Supplement Bar VivoCity", "transport": "Take the Circle Line or North East Line to HarbourFront MRT Station, and use Exit E to enter Level 1 of VivoCity directly."}, {"address": "1 HarbourFront Walk, #01-12 VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buys: Lemongrass Essential Oil, Lavender Repairing Body Lotion, Bergamot Balancing Facial Serum. Formerly known as Mt. Sapola, this is Singapore\u0027s premier local brand for natural essential oils and aromatherapy skincare. Featuring 100% natural ingredients and Southeast Asian botanical extracts, the store smells wonderfully relaxing, making it the top choice for purchasing high-quality local home scents and spa products.", "name": "HYSSES VivoCity", "transport": "Take the MRT to HarbourFront MRT Station and walk directly into Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #01-23 VivoCity, Singapore 098585", "feature": "\u2b50 4.3 stars | Must-Buys: Tiger Balm Ointment, Bio-Essence Miracle Bio-Water, Silkygirl Makeup Collection. Guardian is a major local health \u0026 beauty retail chain in Singapore. The VivoCity branch is bright, spacious, and fully stocked. Beyond international brands, you can pick up local specialty medicated ointments, mosquito repellents, and budget-friendly Southeast Asian beauty products here.", "name": "Guardian VivoCity", "transport": "Take the MRT to HarbourFront MRT Station, and take Exit B or E straight to Basement 1 or Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #B2-07 VivoCity, Singapore 098585", "feature": "\u2b50 4.4 stars | Must-Buys: Bird\u0027s Nest Hydrating Spray, Bo Ying Compound, Bak Foong Pills Beauty Drink. Eu Yan Sang is a century-old herbal wellness and pharmacy brand in Singapore, infusing Traditional Chinese Medicine (TCM) herbs into modern beauty care. Its Bird\u0027s Nest skincare line and TCM beauty masks are highly trusted by locals, making it an excellent traditional spot to buy wellness gifts for elders or to rejuvenate your own complexion.", "name": "Eu Yan Sang VivoCity", "transport": "Take the MRT to HarbourFront MRT Station and follow the underground walkway directly to Basement 2 of VivoCity."}, {"address": "1 Maritime Square, #01-22 HarbourFront Centre, Singapore 099253", "feature": "\u2b50 4.2 stars | Must-Buys: Axe Brand Universal Oil, Wong To Yick Wood Lock Medicated Oil, Local Singapore Herbal Oils. Operated by NTUC, this official pharmacy ensures top quality and reliability. Popular with nearby residents and ferry passengers, this branch in HarbourFront Centre offers a wide range of traditional Singapore medicated balms, insect repellents, and natural herbal skincare at budget-friendly prices.", "name": "Unity HarbourFront Centre", "transport": "Take the MRT to HarbourFront MRT Station and take Exit B directly into Level 1 of HarbourFront Centre."}, {"address": "8 Sentosa Gateway, Hotel Michael, Resorts World Sentosa, Singapore 098269", "feature": "\u2b50 4.7 stars | Must-Buys: Banyan Tree Tuberose Essential Oil, Thai Jasmine Body Scrub, Night Soothing Repair Cream. A luxury SPA \u0026 beauty boutique run by Singapore\u0027s iconic luxury hotel brand, Banyan Tree. Located inside Resorts World Sentosa, it specializes in premium essential oils, natural skincare, and bath collections\u2014allowing you to bring the ultimate Singapore luxury SPA experience home.", "name": "Banyan Tree Gallery Resorts World Sentosa", "transport": "Take the Sentosa Express to Resorts World Station and walk about 3 minutes to Hotel Michael."}, {"address": "1 HarbourFront Walk, #01-178 VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buys: Allies of Skin Peptides \u0026 Antioxidants Firming Daily Treatment, Sigi Skin Morning Glow Physical Sunscreen, Ultra Violette Supreme Screen SPF 50+. The VivoCity Sephora is massive and features a dedicated section for indie beauty brands from Singapore and Southeast Asia. It is a treasure trove for beauty lovers to discover rising local luxury indie skincare brands like Allies of Skin and Sigi Skin.", "name": "Sephora VivoCity", "transport": "Take the MRT to HarbourFront MRT Station and walk to Level 1 of VivoCity, next to the main atrium."}, {"address": "1 HarbourFront Walk, #B2-06 VivoCity, Singapore 098585", "feature": "\u2b50 4.3 stars | Must-Buys: Bio-essence 24K Bio-Gold Gold Water, Mustika Ratu Rose Water, Singapore Crocodile Oil Cream. Serving as the flagship store in the HarbourFront area, this Watsons features popular Southeast Asian beauty essentials as well as a dedicated section for traditional Singaporean skincare\u2014including crocodile oil repair creams and natural Asian herbal masks. It\u2019s a hot spot for tourists hunting for local beauty souvenirs.", "name": "Watsons VivoCity", "transport": "Take the MRT to HarbourFront MRT Station and take Exit E to Basement 2 of VivoCity."}], "name": "Local Iconic Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1 HarbourFront Walk, #01-50/51 VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buy List: Geometric crossbody bags, pointed low-heel Mary Janes, embossed long wallets with metal buckles. Singapore\u0027s most famous homegrown fashion footwear and bag brand, affectionately known as \u0027Little CK\u0027. The VivoCity store is spacious with an extremely complete collection. Designed for modern women, it offers affordable luxury with a high-end feel\u2014a must-visit shopping destination when in Singapore.", "name": "Charles \u0026 Keith VivoCity", "transport": "Take the Circle Line or North East Line to HarbourFront MRT Station (NE1/CC29), which directly connects to Basement 2 of VivoCity. Take the escalator/elevator up to Level 1."}, {"address": "1 HarbourFront Walk, #01-156 VivoCity, Singapore 098585", "feature": "\u2b50 4.6 stars | Must-Buy List: Tailored wide-leg trousers, printed V-neck dresses, seamless camisole tops. Singapore\u0027s leading homegrown womenswear brand tailored specifically for Asian women\u0027s proportions, emphasizing comfortable fits and sleek fashion. The VivoCity store is elegant and bright with thoughtful fitting rooms, making it a favorite fashion shopping landmark for locals and tourists alike.", "name": "Love, Bonito VivoCity", "transport": "Take the MRT to HarbourFront Station, exit and walk straight into Level 1 of VivoCity Shopping Centre."}, {"address": "1 HarbourFront Walk, #01-144 VivoCity, Singapore 098585", "feature": "\u2b50 4.7 stars | Must-Buy List: Dumpling Bags, lightweight nylon crossbody bags, colorful multi-purpose pouches. A Singaporean minimalist designer brand that has taken the world by storm in recent years, famous for its colorful, lightweight, and incredibly practical Dumpling Bags. The store boasts a modern artistic design, offering products that balance aesthetics and function, highly favored by local hipsters and trendsetters.", "name": "Beyond The Vines VivoCity", "transport": "Take the MRT to HarbourFront Station and walk to Level 1 of VivoCity Shopping Centre."}, {"address": "1 HarbourFront Walk, #01-38/39 VivoCity, Singapore 098585", "feature": "\u2b50 4.4 stars | Must-Buy List: Affordable luxury leather tote bags, smart-casual leather loafers, minimalist short wallets with metal buckles. A high-end sister brand under Charles \u0026 Keith, specializing in refined and sophisticated footwear and leather goods for men and women. Featuring a modern style with exquisite texture, the VivoCity store offers a wide variety of designs perfect for both workwear and casual outfits, offering great taste and value.", "name": "PEDRO VivoCity", "transport": "Take the MRT to HarbourFront Station and head up to Level 1 via the VivoCity concourse."}, {"address": "1 HarbourFront Walk, #02-09 VivoCity, Singapore 098585", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-embellished crystal foldable flats, genuine woven leather sandals, vintage French-style shoulder bags. A premium local Singaporean footwear brand known for its ultra-comfortable lambskin and calfskin leather shoes. Its signature item is the sparkling crystal foldable flats, combining elegance with cushioned comfort\u2014the perfect footwear choice for daily walking and traveling.", "name": "PAZZION VivoCity", "transport": "Take the MRT to HarbourFront Station, enter VivoCity, and take the escalator to Level 2."}, {"address": "1 HarbourFront Walk, #01-83B VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buy List: British-cut linen shirts, handcrafted blazers, vintage leather pocket squares. A premium local Singaporean menswear brand combining British vintage flair with modern gentleman tailoring, specifically designed for light, breathable wear in tropical climates. Featuring rustic wooden decor, the VivoCity outlet is a top choice for men seeking quality daily attire and tailored suits.", "name": "Benjamin Barker VivoCity", "transport": "Take the MRT to HarbourFront Station and head into Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #02-166 VivoCity, Singapore 098585", "feature": "\u2b50 4.2 stars | Must-Buy List: Square-toe block-heel mules, wide-strap platform sandals, minimalist spacious tote bags. A long-standing local Singaporean footwear brand offering trendy, comfortable, and budget-friendly women\u0027s shoes and bags. With a special emphasis on ergonomic shoe lasts and soles, it is highly popular among young professionals and students looking for stylish, high-value footwear.", "name": "DMK VivoCity", "transport": "Take the MRT to HarbourFront Station and head up to Level 2 of VivoCity."}, {"address": "1 HarbourFront Walk, #02-207/208 VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buy List: Straight linen dresses, minimalist relaxed-fit shirts, brass geometric accessories. Singapore\u0027s iconic minimalist independent fashion brand advocating sustainable fashion and earthy color palettes. The spacious VivoCity store features a pristine white, micro-cement aesthetic and tiered bundle pricing, making it a favorite shopping hot spot for young Singaporeans\u0027 everyday style.", "name": "The Editor\u0027s Market VivoCity", "transport": "Take the MRT to HarbourFront Station, enter VivoCity, and take the escalator to Level 2."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "1 HarbourFront Walk, #B2-28 VivoCity, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-Buy List: Pandan Chiffon Cake, Nyonya Kueh Platter, Pineapple Tarts. Singapore\u0027s most iconic traditional confectionery brand, with a very comprehensive selection at its VivoCity branch. The most popular Pandan Chiffon Cake has a soft, fluffy texture with a natural fragrance of pandan leaves, making it a top souvenir choice for tourists before heading home. The classic Nyonya kuehs are brightly colored with a chewy, soft texture, showcasing rich traditional Nanyang flavors.", "name": "Bengawan Solo - VivoCity", "transport": "Take the Circle Line or North East Line to HarbourFront Station, and take Exit B2 directly to Basement 2 of VivoCity."}, {"address": "1 HarbourFront Walk, #B2-K25 VivoCity, Singapore 098585", "feature": "\u2b50 4.6 stars | Must-Buy List: Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. Singapore\u0027s globally popular, viral \u0027dangerously addictive\u0027 snack brand. The VivoCity store is stocked with various signature salted egg snacks. The crispy fish skin is coated in rich salted egg yolk, curry leaves, and bird\u0027s eye chili, delivering a sweet, savory, and spicy flavor combo that makes it an immensely popular snack for relaxing or pairing with drinks.", "name": "IRVINS Salted Egg - VivoCity", "transport": "Take the MRT to HarbourFront Station and head to the VivoCity B2 kiosk zone to reach the store."}, {"address": "1 HarbourFront Walk, #01-207/208 VivoCity, Singapore 098585", "feature": "\u2b50 4.4 stars | Must-Buy List: 1837 Black Tea Teabags, Singapore Breakfast Tea, Tea-infused Macarons. Singapore\u0027s premier luxury tea brand, featuring an elegant and delicate store decor at VivoCity. The brand carefully selects top-quality teas worldwide for exclusive blends. The signature 1837 Black Tea boasts sweet notes of berries and caramel, while the Singapore Breakfast Tea blends vanilla and green tea aromas. Packaged in high-end golden tin canisters, it makes an exceptionally luxurious gift.", "name": "TWG Tea - VivoCity", "transport": "Take the MRT to HarbourFront Station and walk to the central shopping area on Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #02-08 VivoCity, Singapore 098585", "feature": "\u2b50 4.7 stars | Must-Buy List: Tropical Scented Candle, Singapore Vintage Hand-painted Tile, Colonial Style Coaster Set. An independent lifestyle store rich in Singapore\u0027s local history and culture, brimming with Nanyang colonial charm and vintage aesthetics. The shop offers many exclusive souvenirs crafted by local designers, such as ornaments featuring nostalgic Singaporean architectural motifs, specialty fragrances, and home decor\u2014perfect for travelers seeking unique, high-quality keepsakes.", "name": "The Singapore Trading Post - VivoCity", "transport": "Take the MRT to HarbourFront Station and take the escalator to Level 2 of VivoCity."}, {"address": "50 Beach View, Beach Plaza #01-03, Sentosa Island, Singapore 098604", "feature": "\u2b50 4.3 stars | Must-Buy List: Sentosa Merlion Metal Keychain, Sentosa Eco Tumbler, Sentosa Beach Towel. Located next to Sentosa\u0027s Beach Station, this official flagship souvenir shop is an unmissable stop on Sentosa Island. It gathers a full array of official island-exclusive merchandise, ranging from adorable Merlion gifts and beach resort essentials to eco-friendly stationery, making it the best place to pick up mementos of your island vacation.", "name": "Sentosa Shop - Beach Plaza", "transport": "Take the Sentosa Express from VivoCity to Beach Station, and walk about 1 minute after exiting the station."}, {"address": "1 HarbourFront Walk, #B2-K24 VivoCity, Singapore 098585", "feature": "\u2b50 4.2 stars | Must-Buy List: Kaya Jam, Pandan Chiffon Cake, Mini Pineapple Tarts. PrimaD\u00e9li is a long-standing, beloved homegrown bakery brand in Singapore. Its VivoCity store offers a variety of freshly baked authentic Singaporean pastries. Their packaged Kaya Jam is pleasantly sweet with rich coconut and pandan aromas, making it ideal to bring home for authentic Singaporean toast breakfasts\u2014affordable and high quality.", "name": "PrimaD\u00e9li - VivoCity", "transport": "Take the MRT to HarbourFront Station and enter the B2 food street of VivoCity."}, {"address": "26 Sentosa Gateway, #01-209 Resorts World Sentosa, Singapore 098138", "feature": "\u2b50 4.3 stars | Must-Buy List: Merlion Shaped Dark Chocolates, Durian Cream Chocolates, Singapore Edition Chocolate Box. Located at Resorts World Sentosa, this confectionery and chocolate specialty store brings together world-famous chocolates and numerous Singapore-exclusive souvenirs. The top sellers include Singapore Merlion-shaped chocolate gift boxes and tropical fruit-flavored chocolates with local flare. Beautifully packaged, they are immensely popular among tourists.", "name": "The Cocoa Trees - Resorts World Sentosa", "transport": "Take the Sentosa Express to Resorts World Station and walk to the Level 1 retail area."}, {"address": "1 Maritime Square, #01-85/86 HarbourFront Centre, Singapore 099253", "feature": "\u2b50 4.5 stars | Must-Buy List: Ya Kun Kaya Jar, Ya Kun Traditional Coffee Powder, Ya Kun Hainanese Milk Tea Bags. Ya Kun is Singapore\u0027s iconic breakfast brand. In addition to serving freshly made meals, its HarbourFront Centre branch features a souvenir section. Visitors can take home Ya Kun\u0027s pride\u2014signature kaya jam (preservative-free)\u2014and traditional coffee powder infused with rich Nanyang roasted aromas, making it easy to recreate Singapore\u0027s authentic morning tea experience at home.", "name": "Ya Kun Kaya Toast - HarbourFront Centre", "transport": "Take the MRT to HarbourFront Station, exit via Exit B, and walk straight into Level 1 of HarbourFront Centre."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "1 HarbourFront Walk, Singapore 098585", "feature": "\u2b50 4.5 stars | Must-buy list: Pandan Kaya spread, Singapore-themed graphic T-shirts, exclusive snacks from the giant hypermarket. As Singapore\u0027s largest shopping mall, VivoCity was designed by renowned Japanese architect Toyo Ito, featuring open-air spaces and a beautiful waterfront promenade. Housing hundreds of international and local brands, it is a shopping paradise you must visit before heading to Sentosa. The rooftop even features a water park and scenic views overlooking the Sentosa Strait.", "name": "VivoCity", "transport": "Take the MRT North East Line (NE) or Circle Line (CC) to HarbourFront Station; direct connection at Basement 2."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted Nike sneakers, classic Coach print handbags, Kate Spade discounted dresses. Singapore\u0027s largest outlet mall boasts over 100 designer outlet stores, offering unbeatable year-round discounts from 30% to 80% off. Featuring popular brands like Nike, Adidas, Coach, Michael Kors, and Charles \u0026 Keith, it is a bargain hunter\u0027s paradise for value-seeking travelers.", "name": "IMM Outlet Mall", "transport": "Take the MRT to Jurong East Station, then walk about 8 minutes via the sheltered pedestrian bridge."}, {"address": "1 HarbourFront Walk, #01-187 \u0026 #02-189 VivoCity, Singapore 098585", "feature": "\u2b50 4.3 stars | Must-buy list: TANGS exclusive pandan cake, Singapore-style Peranakan porcelain tableware, local indie brand scented hand cream. TANGS is Singapore\u0027s iconic and historic home-grown department store, founded in 1932. The VivoCity branch showcases modern Singaporean lifestyle aesthetics, offering a curated selection of high-quality homeware, fashion, beauty products, and authentic local souvenirs\u2014the perfect place to shop for refined Singaporean gifts.", "name": "TANGS at VivoCity", "transport": "Take the MRT to HarbourFront Station and head to Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #01-144 VivoCity, Singapore 098585", "feature": "\u2b50 4.6 stars | Must-buy list: Classic Nylon Dumpling Bag, Micro Dumpling Bag, color-blocked canvas tote bags. A local designer lifestyle brand that has taken the world by storm, famous for its understated minimalism, vibrant color blocking, and highly functional nylon dumpling bags. The VivoCity store features a striking modern geometric interior, making these lightweight and durable bags a trendy must-buy item for visitors to Singapore.", "name": "Beyond The Vines Concept Store (VivoCity)", "transport": "Take the MRT to HarbourFront Station and locate the store on Level 1 of VivoCity."}, {"address": "1 HarbourFront Walk, #02-184/185 VivoCity, Singapore 098585", "feature": "\u2b50 4.4 stars | Must-buy list: Structured crossbody bags, woven mules, metallic buckle heel sandals. Affectionately known as \u0027Little CK\u0027, Singapore\u0027s premier homegrown fashion footwear and bag brand offers a spacious, bright flagship store at VivoCity with a complete product lineup. Offering high-fashion designs at wallet-friendly prices with new arrivals weekly, it is an essential fashion destination in Singapore.", "name": "Charles \u0026 Keith Flagship Store (VivoCity)", "transport": "Take the MRT to HarbourFront Station and go directly to Level 2 of VivoCity."}, {"address": "1 HarbourFront Walk, #02-186/187 VivoCity, Singapore 098585", "feature": "\u2b50 4.3 stars | Must-buy list: Vintage real leather loafers, minimalist leather totes, slim business card holders. Pedro is a sophisticated, higher-end brand under the Charles \u0026 Keith group, also originating from Singapore. It specializes in refined formal and casual footwear, leather accessories, and chic handbags with sleeker, more luxurious designs at affordable prices\u2014a favorite among local professionals and stylish travelers.", "name": "Pedro (VivoCity)", "transport": "Take the MRT to HarbourFront Station and head to Level 2 of VivoCity."}, {"address": "26 Sentosa Gateway, Resorts World Sentosa, Singapore 098138", "feature": "\u2b50 4.2 stars | Must-buy list: Sentosa-exclusive Merlion figurines, tropical floral shirts, eco-friendly geometric canvas totes. The official themed gift store located inside Resorts World Sentosa exudes a vibrant island resort vibe. Packed with Sentosa-exclusive collectibles, trendy graphic merchandise, stationery, and resort wear, it is the ideal spot to pick up unique souvenirs before leaving Sentosa.", "name": "Sentosa Fun Shop (Resorts World Sentosa)", "transport": "Take the Sentosa Express to Resorts World Station; it is a 2-minute walk from the station."}, {"address": "1 Maritime Square, Singapore 099253", "feature": "\u2b50 4.1 stars | Must-buy list: Discounted Timberland leather boots, Cotton On sale casual wear, high-fiber snack packs from local Singaporean brands. Located right next to VivoCity and connected to the ferry terminal, HarbourFront Centre is a budget-friendly shopping mall popular with locals. It houses factory outlets and local shops offering lower prices than standard department stores\u2014perfect for bargain hunting and purchasing daily essentials.", "name": "HarbourFront Centre", "transport": "Take the MRT North East Line or Circle Line to HarbourFront Station; Exit B connects directly to HarbourFront Centre."}], "name": "Major Department Stores \u0026 Outlet Malls"}}, "name": "Sentosa Island and HarbourFront"}};
        const cityName = "Singapore";

        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
