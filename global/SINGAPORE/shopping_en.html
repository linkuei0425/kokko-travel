: Metallic Buckle Shoulder Bag, Pointed-Toe Kitten Heel Mules, Geometric Box Crossbody Bag. Singapore\u0027s world-renowned homegrown footwear and bag brand, featuring an exceptionally complete collection at its Raffles City branch. Offering the latest seasonal trendy shoes, stylish bags, and exquisite accessories at accessible prices, it is an unmissable shopping paradise in Singapore.", "name": "CHARLES \u0026 KEITH (Raffles City Branch)", "transport": "Located on Level 1 of Raffles City Shopping Centre, directly above MRT City Hall Station."}, {"address": "252 North Bridge Rd, #01-41 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.4 stars | Must-buy list: Tailored Cotton Dress, Geometric Resin Necklace, Minimalist Wide-Leg Trousers. A premium local independent designer brand in Singapore focusing on modern minimalism and crisp asymmetrical tailoring. Crafting pieces from high-quality, breathable fabrics with sleek silhouette cuts, it is immensely popular among fashionable professionals and tastemakers.", "name": "In Good Company (Raffles City Branch)", "transport": "Direct access to Level 1 of Raffles City Shopping Centre from MRT City Hall Station."}, {"address": "13 Stamford Rd, #01-83 Capitol Singapore, Singapore 178905", "feature": "\u2b50 4.5 stars | Must-buy list: British-Cut Suit Blazer, Pure Slub Cotton Shirt, Vintage Handcrafted Leather Shoes. A high-end local gentlemen\u0027s menswear brand seamlessly blending classic British flair with contemporary tailored cuts. Designed like a sophisticated gentlemen\u0027s club, the store offers a comprehensive range of stylish picks from casual shirts to fine suits and premium leather accessories.", "name": "Benjamin Barker (Capitol Singapore Flagship Store)", "transport": "Connected directly to Level 1 of Capitol Singapore via Exit B of MRT City Hall Station."}, {"address": "252 North Bridge Rd, #01-36A Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.3 stars | Must-buy list: Pearl \u0026 Rhinestone Flats, Woven Genuine Leather Handbag, Vintage Square-Toe Moccasins. A famous Singaporean footwear and bag brand renowned for handcrafted genuine leather and exceptional comfort. Its signature flats featuring rhinestone and pearl accents offer both elegant charm and effortless walking comfort, making them hugely popular among female shoppers.", "name": "PAZZION (Raffles City Branch)", "transport": "Just outside MRT City Hall Station on Level 1 of Raffles City Shopping Centre."}, {"address": "252 North Bridge Rd, #02-14 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.6 stars | Must-buy list: Asymmetrical Maxi Skirt, Architectural Pleated Top, Designer Collaboration Printed Canvas Tote. Founded by emerging Singaporean designer Sabrina Goh, this eponymous label fuses architectural aesthetics with fluid silhouettes to present bold modernity and distinct personal style\u2014a secret favorite for lovers of indie fashion and unique designs.", "name": "SABRINAGOH (Raffles City Branch)", "transport": "Directly accessible via MRT City Hall Station to Level 2 of Raffles City Shopping Centre."}, {"address": "107 North Bridge Rd, #02-23 Funan, Singapore 179105", "feature": "\u2b50 4.2 stars | Must-buy list: High-Waisted Wide-Leg Jeans, Vintage Cropped Knit Top, Edgy-Sweet Style Dress. A popular local indie fast-fashion brand beloved by Singapore\u0027s young women and students. Focusing on youthful energy, flattering cuts, and affordable everyday wear with weekly new arrivals, it\u0027s a great spot to discover contemporary local youth fashion trends.", "name": "SuperGurl (Funan Store)", "transport": "A 5-minute walk from MRT City Hall Station to Level 2 of Funan Mall."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "6 Eu Tong Sen St, #01-62/63 The Central, Singapore 059817", "feature": "\u2b50 4.6 stars | Must-buy list: Bak Kut Teh cookies, Laksa cookies, Pandan Coconut cookies. Founded by renowned Singaporean pastry chef Daniel Tay, Old Seng Choong ingeniously infuses iconic local dishes like Bak Kut Teh, Laksa, and Satay into traditional cookies. Rich, savory, and packed with unique Nanyang flavors, they come packaged in elegant boxes\u2014making them an ideal signature souvenir to represent Singapore.", "name": "Old Seng Choong (Clarke Quay Central)", "transport": "Take the MRT North East Line to Clarke Quay MRT Station; Exit E directly connects to Level 1 of Clarke Quay Central shopping center."}, {"address": "252 North Bridge Rd, #B1-78 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.4 stars | Must-buy list: Pandan Chiffon Cake, Pineapple Tarts, Lapis Sagu (Nine-Layer Cake). A household name for traditional pastries in Singapore. Their legendary green Pandan Chiffon Cake is impossibly fluffy and light, bursting with the natural fragrance of pandan leaves and rich coconut milk\u2014a dream souvenir requested by countless travelers. Additionally, their melt-in-your-mouth pineapple tarts and traditional Peranakan cakes are immensely popular.", "name": "Bengawan Solo (Raffles City)", "transport": "Take the MRT East West Line or North South Line to City Hall MRT Station and take the underground linkway directly to B1 of Raffles City."}, {"address": "252 North Bridge Rd, #B1-61 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.5 stars | Must-buy list: Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. Singapore is the birthplace of the world-famous \u0027Dangerously Addictive\u0027 salted egg snacks! Combining rich salted egg yolk with crispy fried fish skin and fragrant curry leaves, every bite delivers an explosive crunch of savory goodness. Irresistibly addictive, it is Singapore\u0027s ultimate legendary snack.", "name": "IRVINS Salted Egg (Raffles City)", "transport": "Take the MRT East West Line or North South Line to City Hall MRT Station; Exit A connects directly to Basement 1 of Raffles City."}, {"address": "93 Stamford Rd, #01-01 National Museum of Singapore, Singapore 178897", "feature": "\u2b50 4.7 stars | Must-buy list: Merlion Blue \u0026 White porcelain plates, Singapore city print handkerchiefs, HDB motif soy sauce dishes. An iconic local independent design boutique in Singapore that collaborates with master Arita porcelain artisans from Japan. They craft exquisite blue-and-white ceramics featuring local culture (such as the Merlion, HDB public housing, and estate balconies). Blending modern aesthetics with local nostalgia, these make exceptionally tasteful souvenirs.", "name": "Supermama Cultural \u0026 Creative Gift Shop (National Museum)", "transport": "Take the MRT Circle Line to Bras Basah MRT Station and walk about 3 minutes, or walk about 8 minutes from City Hall Station into the National Museum of Singapore."}, {"address": "6 Eu Tong Sen St, #01-31 The Central, Singapore 059817", "feature": "\u2b50 4.3 stars | Must-buy list: Jars of traditional Kaya jam, Ya Kun specially blended Kaya cookies, Singaporean-style drip coffee bags. The true soul of Singapore\u0027s traditional breakfast culture lies in its Kaya spread\u2014slow-cooked from pandan leaves, eggs, sugar, and coconut milk to create a rich, sweet aroma. Spread it on toasted bread at home with a slice of cold butter to perfectly recreate an authentic Singaporean breakfast!", "name": "Ya Kun Kaya Toast (Clarke Quay Central)", "transport": "Take the MRT North East Line to Clarke Quay MRT Station Exit 1; located at the ground-floor riverfront storefront of Clarke Quay Central."}, {"address": "252 North Bridge Rd, #01-15 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.6 stars | Must-buy list: 1837 Black Tea, Singapore Breakfast Tea, Tea-Infused Macaron Gift Box. A world-renowned luxury tea brand founded in Singapore, featuring hundreds of rare, fine teas sourced globally. The signature \u00271837 Black Tea\u0027 boasts delightful notes of berries and caramel. Housed in iconic, elegant yellow tins, it makes a luxurious gift choice for family, friends, and respected elders.", "name": "TWG Tea (Raffles City)", "transport": "Take the MRT to City Hall MRT Station and walk to Level 1 of Raffles City Shopping Centre upon exiting."}, {"address": "6 Eu Tong Sen St, #01-70 The Central, Singapore 059817", "feature": "\u2b50 4.2 stars | Must-buy list: Classic sliced pork bakkwa, Golden Coin pork bakkwa, individually wrapped mini pork bites. A heritage Singaporean brand boasting over 80 years of history in charcoal-grilled bakkwa (barbecued meat). Prepared over traditional charcoal fires, the meat remains tender, juicy, and subtly sweet with a smoky aroma. Designed for travelers, their individually vacuum-packed mini bakkwa pieces are easy to carry and offer a long shelf life, making them a popular gift option.", "name": "Bee Cheng Hiang (Clarke Quay Central)", "transport": "Take the MRT North East Line to Clarke Quay MRT Station; the exit leads directly to Level 1 of Clarke Quay Central Shopping Centre."}, {"address": "252 North Bridge Rd, #01-38/39 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.7 stars | Must-buy list: 1910 Coffee Beans, Bacha Coffee signature drip bag gift box, Caramel Croissant. A luxury specialty coffee brand born in Singapore, evoking the grand palace style of Marrakech\u0027s Dar el Bacha. Offering hundreds of 100% Arabica coffee varieties packaged like fine art\u2014complete with amber sugar crystals and exquisite filter bags\u2014it lets you enjoy a royal-class coffee experience right at home.", "name": "Bacha Coffee (Raffles City)", "transport": "Take the MRT East West Line or North South Line to City Hall MRT Station; exit directly to Level 1 Atrium of Raffles City Shopping Centre."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "107 North Bridge Rd, #02-08 Funan, Singapore 179105", "feature": "\u2b50 4.5 stars | Must-buy list: Classic Dumpling Bag, Micro Nylon Bag, Rainbow Foldable Tote Bag. Singapore\u0027s hottest homegrown independent designer label, famous for its minimalist geometric aesthetic and vibrant color palettes. Located in Funan, this flagship store boasts an avant-garde space featuring sleek, lightweight, and stylish lifestyle products. It is a top choice for local youth and tourists looking to pick up trendy homegrown designs.", "name": "Beyond The Vines Flagship Store at Funan", "transport": "Take the MRT East-West Line or North-South Line to City Hall MRT Station, then walk about 5 minutes via the underground pedestrian walkway."}, {"address": "107 North Bridge Rd, #02-27 Funan, Singapore 179105", "feature": "\u2b50 4.4 stars | Must-buy list: High-waisted tailored trousers, chic structured dresses, Korean-style vintage crop tops. A rapidly rising local Singaporean womenswear brand tailored specifically for Asian silhouettes, offering affordable yet high-quality everyday fashion. Decorated with warm pastel tones and cute photo-ready mirrors, it is a go-to spot for young local women seeking casual outfits and date-night looks.", "name": "Supergurl Flagship Store at Funan", "transport": "Take the MRT to City Hall MRT Station (Exit B) and follow the underpass directly to Level 2 of Funan Mall."}, {"address": "93 Stamford Rd, National Museum of Singapore, Singapore 178897", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage architectural postcards, Merlion tote bags, Peranakan tile-patterned paperweights. The official concept store inside the National Museum of Singapore showcases creative works by various local artists and independent designers. It translates Singapore\u0027s rich Nanyang history and culture into exquisite handcrafted lifestyle goods and stationery\u2014truly unique souvenirs you won\u0027t find anywhere else.", "name": "The Museum Label - National Museum of Singapore", "transport": "Take the Circle Line to Bras Basah MRT Station (Exit C) and walk about 3 minutes, or walk about 5 minutes from Dhoby Ghaut MRT Station."}, {"address": "252 North Bridge Rd, #01-22 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.3 stars | Must-buy list: 1837 Black Tea, Singapore Breakfast Tea, artisanal tea-infused macarons. Founded in Singapore, this world-renowned luxury tea brand features opulent store interiors infused with golden European-Nanyang elegance. Offering hundreds of fine harvests and bespoke blends alongside ornate yellow tins, its exquisite taste and high-end packaging make it the premier choice for gifts from Singapore.", "name": "TWG Tea Boutique at Raffles City", "transport": "Directly connected from City Hall MRT Station to Level 1 of Raffles City Shopping Centre."}, {"address": "107 North Bridge Rd, Singapore 179105", "feature": "\u2b50 4.5 stars | Must-buy list: Love, Bonito homegrown apparel, Grandstand tech gadgets and accessories, unique creative lifestyle items. Blending technology, sports, and fashion aesthetics, this futuristic mall features an indoor rock-climbing wall and a dedicated indoor cycling track. Packed with local Singaporean independent labels, creative lifestyle shops, and tech novelties, it stands out as the most dynamic trendy mall in the Civic District.", "name": "Funan Shopping Mall", "transport": "Take the MRT to City Hall MRT Station (Exit B) and walk about 5 minutes through the air-conditioned underground pedestrian linkway."}, {"address": "13 Stamford Rd, Singapore 178905", "feature": "\u2b50 4.4 stars | Must-buy list: Bacha Coffee luxury drip bag gift sets, artisanal Indian home fragrances, handcrafted wooden carvings. Transformed from the historic Capitol Theatre and neoclassic heritage buildings, this elegant and tranquil complex combines fine dining, local artisan boutiques, and creative craft spaces, exuding a charming colonial vintage aesthetic.", "name": "Capitol Singapore", "transport": "Take the MRT to City Hall MRT Station (Exit B) and follow the direct linkway to Capitol Singapore."}, {"address": "6 Eu Tong Sen St, Singapore 059817", "feature": "\u2b50 4.2 stars | Must-buy list: Don Don Donki exclusive Japanese snacks, Ya Kun Kaya Jam gift sets, discounted Charles \u0026 Keith shoes and bags. Located along the Singapore River, this lifestyle mall mixes Japanese retail goods with popular local Singaporean brands. While shopping, visitors can enjoy sweeping waterfront views of Clarke Quay through high-floor glass windows, enjoying a relaxed resort-like vibe.", "name": "Clarke Quay Central", "transport": "Take the North East Line to Clarke Quay MRT Station (Exit NE5) for direct access to the mall\u0027s basement level."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted Nike running shoes, Charles \u0026 Keith end-of-season handbags, Kate Spade wallets on deal. As Singapore\u0027s largest official outlet mall, IMM is easily accessible via MRT from the Civic District. Housing over 100 designer and local outlet stores, it offers year-round savings from 30% to 80% off, making it an absolute bargain hunter\u0027s paradise for tourists.", "name": "IMM Outlet Mall", "transport": "Take the MRT East-West Line from City Hall MRT Station directly to Jurong East MRT Station, then walk about 10 minutes across the pedestrian bridge."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Civic District and Clarke Quay"}, "little_india": {"categories": {"cat_1": {"items": [{"address": "145 Syed Alwi Rd, Singapore 207704", "feature": "\u2b50 4.4 stars | Must-Buy List: Medimix Ayurvedic Soap, Dabur Vatika Coconut Hair Oil, Vicco Turmeric Ayurvedic Cream. Operating 24 hours, Mustafa Centre is the most legendary shopping paradise in Singapore\u0027s Little India, with its cosmetics and skincare section being a true treasure trove. It gathers the most complete range of Indian Ayurvedic herbal beauty products in Singapore at highly competitive prices. The famous Medimix soap comes in a full lineup\u2014including classic green herbal, sandalwood, and turmeric varieties\u2014making it a top pick for tourists stocking up.", "name": "Mustafa Centre - Cosmetics \u0026 Perfume Section", "transport": "Take the MRT Downtown Line to Farrer Park MRT Station (NE8/DT24) Exit B, and walk for about 3 minutes."}, {"address": "1 Campbell Ln, Singapore 209882", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Henna Hair Dye Powder, Facial Turmeric Powder, Traditional Kajal Eyeliner. Founded in the 1960s, Jothi is an iconic five-story heritage store in Little India. Beyond fresh flowers and prayer offerings, the second and third floors are the main hub for local women buying traditional Indian cosmetics and skincare. The shop offers authentic natural henna hair powders and traditional herbal skincare products. The friendly staff can also provide personalized Ayurvedic beauty advice based on your skin type.", "name": "Jothi Store \u0026 Flower Shop", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station (NE7/DT12) Exit E, about a 2-minute walk."}, {"address": "180 Kitchener Rd, #B1-27 City Square Mall, Singapore 208539", "feature": "\u2b50 4.6 stars | Must-Buy List: Purifying Neem Face Wash, Natural Lip Balm, Anti-Hair Fall Shampoo. Himalaya is a globally renowned Indian Ayurvedic skincare brand, featuring a flagship store in City Square Mall right next to Little India. Emphasizing pure herbal extracts, their products are gentle, non-irritating, and very affordable. The Purifying Neem Face Wash and natural lip balm are bestselling skincare items that tourists from all over the world flock to buy.", "name": "Himalaya Wellness Store - City Square Mall", "transport": "Take the MRT North East Line to Farrer Park MRT Station (NE8) Exit I, directly connected to City Square Mall B1 via the underground walkway."}, {"address": "70 Serangoon Rd, Singapore 217975", "feature": "\u2b50 4.3 stars | Must-Buy List: Mysore Sandal Soap, Chandrika Ayurvedic Soap, Anu Tailam Ayurvedic Oil. Located on Serangoon Road, the main artery of Little India, Kannan Stores is a traditional cosmetics and daily necessities shop rich in authentic Indian culture. Specializing in classic Indian brands, especially royal-grade Mysore sandalwood soap and various scalp-nourishing oils, it is loved by locals and savvy tourists alike\u2014a fantastic spot to experience the magic of Ayurvedic herbal wellness.", "name": "Kannan Stores", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station (NE7/DT12) Exit E, and walk along Serangoon Road for about 3 minutes."}, {"address": "180 Kitchener Rd, #B1-01/02 City Square Mall, Singapore 208539", "feature": "\u2b50 4.2 stars | Must-Buy List: Bio-essence 24K Bio-Gold Water, Tiger Balm Ointment, Silkygirl Matte Lipstick. Guardian is one of Singapore\u0027s most iconic health and beauty chains. The spacious branch at City Square Mall features affordable local and regional makeup brands like Silkygirl, top Southeast Asian skincare brand Bio-essence, and must-buy Tiger Balm products, offering a diverse array of local drugstore choices.", "name": "Guardian Health \u0026 Beauty - City Square Mall", "transport": "Take the MRT North East Line to Farrer Park MRT Station (NE8) Exit I, directly connected to City Square Mall B1 via the underground walkway."}, {"address": "180 Kitchener Rd, #02-23/24 City Square Mall, Singapore 208539", "feature": "\u2b50 4.2 stars | Must-Buy List: Tiger Balm Mosquito Repellent Patch, Singapore Crocodile Oil Repair Cream, Extra Strength Pain Relief Patch. Watsons in Singapore features extensive sections for local drugstore products and supplements. This branch located on the edge of Little India is well-stocked with tropical-climate essentials like mosquito repellents and local remedies, such as Singapore crocodile oil cream and Tiger Balm mosquito patches\u2014making it a convenient stop for trip refills and souvenirs.", "name": "Watsons - City Square Mall", "transport": "Take the MRT North East Line to Farrer Park MRT Station (NE8) Exit I, then walk to Level 2 of City Square Mall."}, {"address": "8 Buffalo Rd, Singapore 219783", "feature": "\u2b50 4.1 stars | Must-Buy List: Biotique Basil Nourishing Shampoo, Kama Ayurveda Rose Water, Neem Antibacterial Toothpaste. Located on Buffalo Road near Tekka Centre, Sri Murugan is a popular local grocery and herbal department store in Little India. Its beauty shelves are packed with authentic premium herbal goods imported directly from India, including skincare from high-end Ayurvedic brands like Biotique and Kama Ayurveda. Affordable prices and genuine quality attract many natural and organic beauty enthusiasts seeking great finds.", "name": "Sri Murugan Trading - Buffalo Road", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station (NE7/DT12) Exit E, and Buffalo Road is right outside the exit."}, {"address": "122 Serangoon Rd, Singapore 218027", "feature": "\u2b50 4.3 stars | Must-Buy List: Ayurvedic Natural Face Mask Powder, Bridal Henna Cone (Mehendi), Ayurvedic Massage Oils. Roopa is a charming boutique on Serangoon Road specializing in traditional Indian cosmetics and accessories. Highlights include secret bridal face mask powders and henna cones (Mehendi), along with blended Ayurvedic relaxation essential oils. A must-visit for travelers looking to experience authentic Indian beauty culture or purchase body painting DIY kits.", "name": "Roopa Beauty \u0026 Cosmetics", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station (NE7/DT12) Exit E, and walk along Serangoon Road for about 5 minutes."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "60 Serangoon Rd, Singapore 217967", "feature": "\u2b50 4.4 stars | Must-Buy List: Bollywood-style silk sarees, printed Cashmere shawls, traditional men\u0027s Kurta shirts. Established in 1962, this heritage Singaporean apparel brand is renowned for its high-quality Indian silk and exquisite fabrics. Whether you are looking for ready-to-wear traditional Indian attire or selecting premium textiles for custom tailoring, this is a top choice for both local Indian residents and tourists.", "name": "Haniffa Textiles", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station, Exit E, and walk for about 3 minutes."}, {"address": "100 Serangoon Rd, Singapore 217998", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Kanchipuram pure silk sarees, handcrafted gold-embroidered shawls, luxurious Indian wedding gowns. Originating in India in 1928, this century-old brand offers exceptionally high-quality pure silk sarees and handmade textiles at its Little India store. Featuring vibrant fabrics embellished with intricate gold and silver thread embroidery, it is highly favored by fashion enthusiasts who love South Asian style and fine craftsmanship.", "name": "Nalli Silk Sarees", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station, Exit E, and walk along Serangoon Road for about 5 minutes."}, {"address": "135 Serangoon Rd, Singapore 218030", "feature": "\u2b50 4.3 stars | Must-Buy List: Samudrika Pattu silk sarees, North Indian style Lehenga sets, traditional gold-trimmed sandals. A renowned retail chain from South India, its multi-story store in Singapore offers a wide range of traditional and modern fused South Asian clothing. From simple everyday wear to extravagant bridal attire, everything is available, and the friendly staff are happy to assist with saree draping.", "name": "Pothys Flagship Store", "transport": "Take the MRT North East Line to Farrer Park MRT Station, Exit A, and walk for about 5 minutes."}, {"address": "112 Serangoon Rd, Singapore 218017", "feature": "\u2b50 4.5 stars | Must-Buy List: Seamless pure silk sarees, men\u0027s printed silk shirts, hand-woven ethnic totes. A popular spot for high-quality traditional Indian wear and modern printed cotton-linen shirts. Bright and spacious, the store boasts an incredible variety of fabrics and offers fresh, vibrant modernized South Asian apparel and delicate accessories geared toward younger shoppers.", "name": "Kalyan Silks Singapore", "transport": "Take the MRT Downtown Line to Little India MRT Station, Exit E, and walk for about 4 minutes."}, {"address": "151 Serangoon Rd, Singapore 218006", "feature": "\u2b50 4.7 stars | Must-Buy List: Haute couture hand-embroidered Lehenga gowns, Indian-style beaded clutches, handcrafted beaded fringe shawls. A prestigious Singaporean luxury Indian fashion boutique specializing in custom bridal couture and glamorous party gowns. Seamlessly blending traditional Indian craftsmanship with contemporary tailoring, local celebrities and tourists alike visit to pick up one-of-a-kind beaded bags and high-end dresses.", "name": "Stylemart Bridal Collection", "transport": "Take the MRT North East Line to Farrer Park MRT Station, Exit I, and walk for about 6 minutes."}, {"address": "665 Buffalo Rd, Level 2, Singapore 210665", "feature": "\u2b50 4.2 stars | Must-Buy List: Affordable Punjabi Suits, hand-embroidered ethnic shoes (Jutti), colorful bangles, and printed tote bags. Located on the second floor of the famous Tekka Food Centre, this is Singapore\u0027s most authentic and down-to-earth hub for budget apparel, footwear, and bags. Dozens of local independent stalls offer wallet-friendly printed textiles, traditional menswear, handmade leather sandals, and vibrant folk bags\u2014perfect for treasure hunting.", "name": "Tekka Centre Level 2 Apparel Stores", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station, Exit C, directly outside the station."}, {"address": "1 Campbell Ln, Singapore 218982", "feature": "\u2b50 4.3 stars | Must-Buy List: Indian-style beaded cloth bags, unique traditional leather shoes, gold-embroidered drawstring pouches. This multi-story landmark in Little India is an iconic institution; beyond flower garlands, its fashion accessories and traditional bags department is highly popular. Steeped in vibrant local flavor, you can discover unique folk-embroidered bags, traditional gold accessories, and distinctive leather footwear here for a truly local shopping experience.", "name": "Jothi Store \u0026 Flower Shop", "transport": "Take the MRT Downtown Line or North East Line to Little India MRT Station, Exit E, and walk for about 2 minutes."}, {"address": "145 Syed Alwi Rd, Singapore 207704", "feature": "\u2b50 4.3 stars | Must-Buy List: Affordable pure cotton printed Sarongs, budget Indian handmade flats, unique leather crossbody bags. Little India\u0027s legendary 24-hour shopping mega-haven boasts a massive apparel and footwear department. Bringing together thousands of printed sarongs, traditional footwear, and budget handbags loved by locals and travelers alike, it offers highly competitive prices and an incredible variety\u2014perfect for night owl shoppers.", "name": "Mustafa Centre - Apparel \u0026 Footwear Department", "transport": "Take the MRT North East Line to Farrer Park MRT Station, Exit G, and walk for about 3 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "145 Syed Alwi Rd, Singapore 207704", "feature": "\u2b50 4.4 stars | Must-buy list: Indian Masala Powder, Tiger Balm, Ya Kun Kaya Jam. This 24-hour mega shopping center is the most iconic landmark in Little India, offering almost every Southeast Asian and Indian specialty product imaginable. The spice section is impressively massive, stocked with a wide array of uniquely flavored Indian spice powders, dried fruits, and snacks at very affordable prices. Highly recommended by locals and tourists alike for a grand shopping spree.", "name": "Mustafa Centre", "transport": "Take the MRT North East Line to Farrer Park Station (Exit I) and walk for about 3 minutes."}, {"address": "48 Serangoon Rd, #01-16 Little India Arcade, Singapore 217959", "feature": "\u2b50 4.1 stars | Must-buy list: Laddoo, Barfi, Gulab Jamun. A famous old-style dessert shop located inside the Little India Arcade, carrying on the traditional craft of North Indian sweet-making. The shop showcases a colorful array of Indian pastries rich with milky and cardamom aromas\u2014perfect for travelers who want to taste authentic Indian sweets or pick up a unique gift box.", "name": "Moghul Sweet Shop", "transport": "Take the MRT Downtown Line or North East Line to Little India Station (Exit E) and walk for about 2 minutes."}, {"address": "82 Serangoon Rd, Singapore 217987", "feature": "\u2b50 4.2 stars | Must-buy list: Murukku, Mysore Pak, Coconut Barfi. A dessert and snack shop attached to a famous, historic Indian restaurant, specializing in freshly made traditional South Indian snacks. Their Murukku is crispy, savory, and aromatic with fennel\u2014a classic South Indian treat that comes beautifully packaged, making it great to take home and share with friends and family.", "name": "Komala Vilas Sweets \u0026 Savouries", "transport": "Take the MRT to Little India Station (Exit E) and walk along Serangoon Road for about 4 minutes."}, {"address": "1 Campbell Ln, Singapore 209882", "feature": "\u2b50 4.3 stars | Must-buy list: Chandrika Herbal Soap, Ayurvedic Essential Oils, Henna Cones. This five-story historic store is one of the cultural hearts of Little India. Besides fresh floral garlands for worship, it sells a huge selection of herbal beauty items and fragrance gifts. Highly popular among female travelers, its Indian essential oil soaps and natural Ayurvedic skincare products are quality bargains, making them quintessential local souvenirs.", "name": "Jothi Store \u0026 Flower Shop", "transport": "Take the MRT to Little India Station (Exit E), turn onto Campbell Lane, and walk for about 2 minutes."}, {"address": "118 Dunlop St, Singapore 209437", "feature": "\u2b50 4.1 stars | Must-buy list: Premium Turmeric Powder, Masala Chai Mix, Natural Indian Sandalwood Balm. A homegrown Singaporean-Indian department store brand with deep roots, specializing in quality South Asian products. Its food and snack section offers a rich variety of authentic Indian chai teas and traditional nut snacks at wallet-friendly prices\u2014a fantastic spot to experience daily shopping in Singapore\u0027s Indian community.", "name": "Haniffa Department Store", "transport": "Take the MRT Downtown Line to Rochor Station (Exit A) and walk for about 3 minutes."}, {"address": "85 Syed Alwi Rd, Singapore 207664", "feature": "\u2b50 4.2 stars | Must-buy list: Spicy Papadum, Jeera Biscuits (Cumin Biscuits), Rich Spiced Curry Cubes. A chain supermarket beloved by local Indian families, hiding a wealth of specialty snacks known mostly to insiders. Their Papadums puff up extra crispy when fried, and paired with flavorful spiced biscuits, they allow tourists to bring home truly authentic Indian flavors.", "name": "Sri Murugan Trading", "transport": "Take the MRT to Farrer Park Station (Exit G) and walk for about 5 minutes."}, {"address": "48 Serangoon Rd, Singapore 217959", "feature": "\u2b50 4.2 stars | Must-buy list: Hand-carved Wooden Block Stamps, Indian-style Keychain Accessories, Exquisitely Hand-painted Camel Bone Boxes. Set within well-preserved 1920s heritage buildings, this arcade gathers many unique independent craft and souvenir stalls. It\u0027s the best place to find non-food specialty souvenirs, offering vibrant Indian-style creative novelties and fine decor.", "name": "Little India Arcade Souvenirs", "transport": "Take the MRT to Little India Station (Exit E) and walk for about 2 minutes."}, {"address": "13 Dunlop St, Singapore 209343", "feature": "\u2b50 4.3 stars | Must-buy list: Teh Tarik Masala Mix, Roasted Spiced Cashews, Traditional Coconut Candy. This independently run small spice and dried fruit store is famous for its high-quality roasted nuts and custom-blended spices. Many loyal regular customers come specifically for their custom Teh Tarik masala powder and spiced cashews, packed with local handcrafted warmth and unique flavors.", "name": "Selvi Stores", "transport": "Take the MRT Downtown Line to Rochor Station (Exit A) and walk for about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "145 Syed Alwi Rd, Mustafa Centre, Singapore 207704", "feature": "\u2b50 4.4 Stars | Must-Buy List: Medimix Ayurvedic Herbal Soap, Royal Camel Milk Chocolates, Taj Mahal Masala Chai Tea Bags. Operating 24/7, this giant department store is the most legendary shopping landmark in Singapore\u0027s Little India. Spanning multiple stories with maze-like aisles, it offers over 300,000 items, ranging from unique Indian spices, gold jewelry, beauty products, and international snacks to electronics. Famous for its highly competitive wholesale prices, it is a must-visit paradise for both locals and tourists looking to stock up on souvenirs.", "name": "Mustafa Centre", "transport": "Take the MRT North East Line to Farrer Park MRT Station, leave via Exit NE8, and walk for about 3 minutes."}, {"address": "180 Kitchener Rd, Singapore 208539", "feature": "\u2b50 4.3 Stars | Must-Buy List: Charles \u0026 Keith trendy women\u0027s shoes \u0026 bags, Ya Kun Kaya Jam gift sets, Decathlon lightweight outdoor gear. Located in the heart of Little India, this is Singapore\u0027s first eco-mall to win the Green Mark Award. Directly connected to the MRT station, it features a modern, bright, and spacious environment with over 200 international and local retail brands, an affordable food court, a large supermarket, and a cinema. It\u0027s the perfect spot to cool off, relax, and enjoy one-stop shopping after a cultural walking tour of Little India.", "name": "City Square Mall", "transport": "Take the MRT North East Line to Farrer Park MRT Station and head out Exit I to directly enter the mall via the underground linkway."}, {"address": "665 Buffalo Rd, Singapore 210665", "feature": "\u2b50 4.2 Stars | Must-Buy List: Traditional handcrafted printed Sarees, Indian embroidered Juttis shoes, Natural Henna cones. Located on the second floor of Tekka Centre, this arcade is Little India\u0027s most iconic local traditional apparel and sundries marketplace. It brings together dozens of independent shops run by local Indian families, showcasing colorful sarees, Punjabi suits, and gorgeous fabrics. The warm and friendly shopkeepers offer custom tailoring services, allowing visitors to deeply experience an authentic traditional Indian shopping atmosphere.", "name": "Tekka Centre Arcade", "transport": "Take the MRT North East Line or Downtown Line to Little India MRT Station; it is right outside Exit C."}, {"address": "48 Serangoon Rd, Singapore 217959", "feature": "\u2b50 4.1 Stars | Must-Buy List: Decorative Indian brass incense burners, Ayurvedic herbal skincare oils, Hand-carved wooden Ganesha statues. Housed in an orange-and-white heritage building constructed in the 1920s, this site has been transformed into a boutique arcade celebrating Indian craft traditions. Packed with vibrant shops, it specializes in traditional handicrafts, brassware, Ayurvedic beauty products, and fragrances. You can even get an authentic Henna tattoo done on-site, making it the top choice for unique cultural souvenirs.", "name": "Little India Arcade", "transport": "Take the MRT North East Line or Downtown Line to Little India MRT Station, leave via Exit E, and walk about 2 minutes."}, {"address": "60 Serangoon Rd, Singapore 217967", "feature": "\u2b50 4.3 Stars | Must-Buy List: Bollywood-style handcrafted Kashmiri shawls, Zari-embroidered Punjabi suits, Exquisite beaded bags. Haniffa is a renowned local department store brand in Singapore with decades of history, specializing in high-end Indian textiles and apparel. The store is filled with fine silks, fabrics, and ready-to-wear ethnic attire sourced from various regions of India. Whether you need luxurious outfit options for weddings or comfortable cotton wear for daily use, it offers a rich and high-quality selection loved by the local Indian community.", "name": "Haniffa Textiles", "transport": "Take the MRT North East Line or Downtown Line to Little India MRT Station, leave via Exit E, and walk about 3 minutes."}, {"address": "1 Campbell Ln, Singapore 209882", "feature": "\u2b50 4.5 Stars | Must-Buy List: Himalaya herbal skincare products, Indian sandalwood essential oil balm, Hand-carved copper water bottles. Starting out as a humble street-corner flower stall in Little India, Jothi has grown into a five-story Indian lifestyle department store giant. Packed with authentic herbal skincare, brassware, festive decorations, and incense products, it attracts savvy travelers looking to discover genuine Indian herbal wellness goodies.", "name": "Jothi Store \u0026 Flower Shop", "transport": "Take the MRT North East Line or Downtown Line to Little India MRT Station, leave via Exit E, and walk about 4 minutes."}, {"address": "93 Serangoon Rd, Singapore 217998", "feature": "\u2b50 4.2 Stars | Must-Buy List: Colorful Indian-style glass bangles, Handcrafted natural incense \u0026 holder sets, Traditional peacock motif tapestries. Located on Serangoon Road, the main thoroughfare of Little India, this representative local craft store is renowned for its fine traditional Indian jewelry, gold and silver ornaments, and deity statues. With thousands of vibrant glass and metal bangles on display alongside helpful wearing advice, it\u0027s the ideal place for travelers looking to experience Indian decorative aesthetics and purchase high-quality handicrafts.", "name": "Gokulam Jewels \u0026 Crafts", "transport": "Take the MRT North East Line or Downtown Line to Little India MRT Station, leave via Exit E, and walk about 5 minutes."}, {"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.4 Stars | Must-Buy List: Discounted classic Coach leather bags, Rare discounted Nike sneakers, Kate Spade luxury fashion wallets. As Singapore\u0027s largest and most recommended outlet mall, IMM features over 100 international designer brands. Offering year-round savings of 20% to 80% off popular brands like Coach, Michael Kors, Kate Spade, Nike, Adidas, and Tommy Hilfiger, it is a bargain hunter\u0027s shopping paradise you shouldn\u0027t miss when visiting Singapore.", "name": "IMM Outlet Mall", "transport": "Take the MRT from Little India Station to Jurong East MRT Station, then walk for about 10 minutes via the sheltered J-Walk elevated pedestrian network."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Little India"}, "marina_bay": {"categories": {"cat_1": {"items": [{"address": "3 Temasek Blvd, #02-341/342 Suntec City Mall, Singapore 038983", "feature": "\u2b50 4.6 stars | Must-Buy List: Lemongrass Essential Oil, Rose Chamomile Face Cream, Bergamot Room Spray. HYSSES is an iconic Singaporean brand specializing in natural aromatherapy and green beauty, formerly known as Mt. Sapola. Emphasizing 100% pure plant essential oils and handcrafted blends, the store fills the air with a soothing herbal fragrance. Their skincare products are specifically formulated for Southeast Asia\u0027s hot and humid climate\u2014lightweight, non-sticky, and perfectly suited for Asian skin\u2014making it the top choice for tourists seeking high-quality fragrances and body care products.", "name": "HYSSES (Suntec City)", "transport": "Take the MRT Circle Line to Esplanade Station or Promenade Station, then walk about 3 minutes."}, {"address": "252 North Bridge Rd, #01-28 Raffles City Shopping Centre, Singapore 179103", "feature": "\u2b50 4.5 stars | Must-Buy List: Custom \u0027My Daily Dose\u0027 Serum, Tri-Light Facial Device, Pure Deepsea Hydrating Mask. Skin Inc is an internationally acclaimed Singaporean beauty tech brand known for its bespoke skincare. Customers can undergo a skin analysis at the counter, where experts blend concentrated vitamins and active ingredients tailored to individual skin needs to create a unique serum. Featuring stylish rainbow encapsulated serums that look stunning and deliver impressive results, this is a must-visit local tech beauty spot in the Marina Bay shopping area.", "name": "Skin Inc Supplement Bar (Raffles City)", "transport": "Take the MRT North-South Line (NSL) or East-West Line (EWL) to City Hall Station for direct access to the shopping centre."}, {"address": "10 Bayfront Ave, Level 55 Sands SkyPark / #B2-01A The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.7 stars | Must-Buy List: Thai Lemongrass Body Scrub, Night Ginger Flower Soothing Massage Oil, Lavender Sleep Mist. Located on the 55th floor of Marina Bay Sands Hotel and inside the Shoppes, Banyan Tree Gallery is the official retail outlet of the world-renowned luxury spa brand Banyan Tree. It features premium spa-grade body care and home fragrances made with pure natural botanical ingredients and essential oils, emphasizing sustainability. Many visitors to Marina Bay Sands shop here for high-quality home spa essentials to recreate that luxurious hotel relaxation experience at home.", "name": "Banyan Tree Gallery (Marina Bay Sands)", "transport": "Take the MRT Downtown Line (DTL) or Circle Line (CCL) to Bayfront Station; exit directly into the resort complex."}, {"address": "3 Temasek Blvd, #B1-106 Suntec City West Wing, Singapore 038983", "feature": "\u2b50 4.4 stars | Must-Buy List: Ready-to-Drink Bird\u0027s Nest with Rock Sugar, Pearl Powder Whitening Mask, Concentrated Collagen Beauty Drink. Eu Yan Sang is a century-old Singaporean brand renowned for Traditional Chinese Medicine (TCM) wellness and herbal skincare. Originating as a traditional apothecary, its modern herbal beauty products and edible beauty drinks are wildly popular. Their Bird\u0027s Nest skincare line and natural pearl powder masks combine traditional Asian beauty wisdom with modern biotechnology, making it a go-to spot for savvy tourists looking for holistic beauty solutions.", "name": "Eu Yan Sang (Suntec City)", "transport": "Take the MRT Circle Line to Promenade Station or Esplanade Station and walk about 5 minutes."}, {"address": "2 Bayfront Ave, #B2-63 The Shoppes at Marina Bay Sands, Singapore 018972", "feature": "\u2b50 4.3 stars | Must-Buy List: Tiger Balm Ointment, Bio-Essence Bio-Gold Rose Gold Water, Singapore Shake Hand Brand Cough Powder. Guardian is Singapore\u0027s largest and most trusted pharmacy and health \u0026 beauty retail chain. Bright and spacious, this branch at The Shoppes houses a comprehensive selection of Singapore\u0027s iconic health and cosmetic brands. You can grab home remedy staples from national heritage brand Tiger Balm as well as the full anti-aging and brightening line from popular skincare brand Bio-Essence, all at affordable prices with frequent promotions.", "name": "Guardian (The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Downtown Line or Circle Line to Bayfront Station (Exit C) for direct entry into The Shoppes."}, {"address": "10 Bayfront Ave, #B2-05/06 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.6 stars | Must-Buy List: Allies of Skin Peptides \u0026 Antioxidants Daily Treatment, PSA Heroine Mandelic Acid Serum, Local Brand Fragrance Bath \u0026 Body Sets. This Sephora at Marina Bay Sands is one of Singapore\u0027s most iconic beauty flagship stores. Beyond major international brands, the highlight here is the full showcase of \u0027Allies of Skin\u0027, a homegrown luxury clinical skincare brand, alongside its affordable sister brand \u0027PSA\u0027. Allies of Skin has gained global popularity for its high concentration of active ingredients and powerful skin-repairing results.", "name": "Sephora (The Shoppes at Marina Bay Sands)", "transport": "Take the MRT to Bayfront Station and walk about 2 minutes."}, {"address": "3 Temasek Blvd, North Wing Suntec City, Singapore 038983", "feature": "\u2b50 4.5 stars | Must-Buy List: Coco-Friggin-Fantastic Lip Scrub, Rose Charcoal Deep Cleansing Mask, Ultra Nourishing Lip Mask. Handmade Heroes is a hugely popular local Singaporean 100% vegan and cruelty-free handcrafted skincare brand. Free from artificial additives and cruelty-free, it uses natural plant oils and fresh ingredients. Their lip scrubs and beauty oils are bestsellers in Singapore, and their cute, lightweight packaging makes them ideal souvenirs to take home to friends and family.", "name": "Handmade Heroes (Suntec City Store)", "transport": "Take the MRT Circle Line to Promenade Station and walk about 4 minutes from the exit."}, {"address": "6 Raffles Blvd, #02-212 Marina Square, Singapore 039594", "feature": "\u2b50 4.2 stars | Must-Buy List: Ginvera Green Tea Exfoliating Marvel Gel, Bio-Essence Bird\u0027s Nest Peptides Nourishing Cream, Crocodile Oil Repairing Toner. This flagship Watsons store at Marina Square is a treasure trove for discovering Southeast Asian and local Singaporean cosmetics and skincare. Highly recommended is classic Singaporean beauty brand Ginvera\u2014its Green Tea Exfoliating Gel has been a decades-long bestseller for its gentle yet effective exfoliation. The store also offers a wide array of local medicated balms, herbal itch-relief ointments, and sun protection products with authentic local appeal.", "name": "Watsons (Marina Square)", "transport": "Take the MRT North-South Line to City Hall Station or Circle Line to Esplanade Station, then walk about 5 minutes via the underground pedestrian linkway to Marina Square."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "10 Bayfront Ave, #B2-96 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.5 Stars | Must-Buy List: Sleek geometric handbags, classic pointed-toe low heels, textured metallic-buckle shoulder bags. Singapore\u0027s most iconic homegrown fashion footwear and accessory brand, globally renowned for its high affordability and bold, avant-garde designs that rival luxury labels. The flagship store at The Shoppes at Marina Bay Sands showcases Singapore\u0027s most complete collection of seasonal new arrivals and exclusive limited-edition styles. With fine leather textures and chic tailoring, it is a top must-visit shopping destination for women visiting Singapore.", "name": "Charles \u0026 Keith (The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Circle (Yellow) or Downtown (Blue) Line to Bayfront MRT Station (CE1/DT16), take Exit C directly into Level B2 of The Shoppes at Marina Bay Sands."}, {"address": "10 Bayfront Ave, #B2-97 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.4 Stars | Must-Buy List: Minimalist leather tote bags, British-style men\u0027s loafers, geometric textured short wallets. As the high-end sister brand of Charles \u0026 Keith, PEDRO focuses on sophisticated footwear, handbags, and leather accessories for men and women. The design style leans towards modern, sleek, and urban business aesthetics, using premium leather materials. The store\u0027s interior exudes modern luxury, making it a must-visit for fashion lovers seeking understated luxury and great value.", "name": "PEDRO (The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Circle (Yellow) or Downtown (Blue) Line to Bayfront MRT Station (CE1/DT16); after exiting, walk about 1 minute on Level B2 of The Shoppes at Marina Bay Sands."}, {"address": "3 Temasek Blvd, #01-321 Suntec City West Wing, Singapore 038983", "feature": "\u2b50 4.6 Stars | Must-Buy List: Micro Dumpling Bag, versatile water-resistant crossbody bags, minimalist color-blocked lifestyle goods. A Singaporean independent designer brand that has surged in popularity across Asia in recent years, celebrated for its minimalist aesthetic and vibrant color-blocking. Its iconic Dumpling Bag is made from lightweight, durable nylon, offering easy foldability and versatile styles. The store presents a space filled with contemporary artistic flair and playful colors, highly favored by the younger crowd.", "name": "Beyond The Vines (Suntec City)", "transport": "Take the MRT Circle Line to Promenade MRT Station (CC4/DT15), take Exit C into Suntec City West Wing, and walk about 5 minutes."}, {"address": "6 Raffles Blvd, #02-333 Marina Square, Singapore 039594", "feature": "\u2b50 4.3 Stars | Must-Buy List: Handmade foldable lambskin ballet flats, rhinestone-embellished flats, metal-buckle mini square bags. A renowned local Singaporean footwear brand known for its high-quality genuine leather women\u0027s shoes tailored specifically for Asian foot shapes. The brand insists on using soft, supple lambskin and calfskin, emphasizing blister-free comfort and elegant, gorgeous design details. Perfect for daily work commutes or long walks while traveling abroad, it has earned an outstanding local reputation.", "name": "PAZZION (Marina Square)", "transport": "Take the MRT North-South (Red) or East-West (Green) Line to City Hall MRT Station (EW13/NS25), walk through the CityLink Mall underground walkway for about 7 minutes to reach Marina Square."}, {"address": "3 Temasek Blvd, #01-353 Suntec City West Wing, Singapore 038983", "feature": "\u2b50 4.5 Stars | Must-Buy List: Staple tailored high-waisted wide-leg pants, elegantly cut dresses, linen-blend casual blazers. The flagship physical store of Southeast Asia\u0027s largest e-commerce fashion brand, founded by a local Singaporean female entrepreneur to create exclusive cuts tailored for Asian women\u0027s silhouettes. The Suntec City store is spacious and bright, featuring beautifully designed fitting rooms and personalized consultation services. The clothing style seamlessly bridges workwear and weekend leisure with solid quality and accessible prices, making it a wardrobe staple for Singaporean women.", "name": "Love, Bonito (Suntec City)", "transport": "Take the MRT Circle Line to Promenade MRT Station (CC4/DT15), take Exit C directly connecting to Level 1 of Suntec City West Wing."}, {"address": "6 Raffles Blvd, #02-240 Marina Square, Singapore 039594", "feature": "\u2b50 4.4 Stars | Must-Buy List: Sculptural asymmetrical dresses, modern minimalist jumpsuits, artistic geometric earrings. A premium original apparel brand founded by emerging local Singaporean designer Sabrina Goh. The store\u0027s style is rich in geometric aesthetics and architectural structure, utilizing 3D tailoring and premium fabrics to create sleek, elegant apparel. Highly recommended by local fashion enthusiasts and celebrities who value unique taste and distinctive style.", "name": "SABRINAGOH (Marina Square)", "transport": "Take the MRT Circle Line to Esplanade MRT Station (CC3), take Exit A and walk through the subway linkway for about 4 minutes to Level 2 of Marina Square."}, {"address": "10 Bayfront Ave, #B2-41 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.7 Stars | Must-Buy List: Raffles classic premium crocodile leather handbag, handmade crocodile zip-around long wallet, luxury leather cardholder. Founded in 1938, KWANPEN is a heritage Singaporean luxury leather house specializing in the highest quality handmade crocodile leather bags and accessories. Globally renowned for its exquisite edge-cutting techniques and brilliant leather sheen, the flagship store at The Shoppes at Marina Bay Sands displays artwork-grade luxury handbags, standing as the ultimate symbol of homegrown Singaporean luxury craftsmanship.", "name": "KWANPEN (The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Circle (Yellow) or Downtown (Blue) Line to Bayfront MRT Station (CE1/DT16), exit directly into the luxury retail zone on Level B2 of The Shoppes at Marina Bay Sands."}, {"address": "3 Temasek Blvd, #01-333/334 Suntec City West Wing, Singapore 038983", "feature": "\u2b50 4.5 Stars | Must-Buy List: Vintage British-tailored blazers, high-quality knit polo shirts, pure cotton vintage pocket squares. A premier menswear lifestyle brand originating in Singapore, designed for the modern gentleman who values taste and fine tailoring. The store ambience exudes a rich vintage Melbourne gentleman vibe with warm woody scents. Alongside flattering suits and casualwear, it also offers ties, belts, and men\u0027s fragrances, making it an excellent spot for premium menswear and gifts.", "name": "Benjamin Barker (Suntec City)", "transport": "Take the MRT Circle Line to Promenade MRT Station (CC4/DT15), exit and walk about 5 minutes to reach Level 1 of Suntec City West Wing."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "2 Bayfront Ave, #B2-13/14 The Shoppes at Marina Bay Sands, Singapore 018972", "feature": "\u2b50 4.6 stars | Must-buy list: 1910 Fine Coffee Beans, Handcrafted Flavored Drip Coffee Bags, Signature Amber Sugar Spread. Hailing from Morocco and flourishing in Singapore, this luxury coffee brand is located inside The Shoppes at Marina Bay Sands. Its opulent, golden palace-style decor captivates countless visitors. Selecting 100% Arabica beans wrapped in iconic retro-orange packaging, it boasts premium quality and stands as a top choice for luxury souvenirs.", "name": "Bacha Coffee (at The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Circle Line (Yellow) or Downtown Line (Blue) to Bayfront Station (CE1/DT16), and walk through the underground linkway to Level B2 of The Shoppes at Marina Bay Sands."}, {"address": "2 Bayfront Ave, #B2-89/89A The Shoppes at Marina Bay Sands, Singapore 018972", "feature": "\u2b50 4.5 stars | Must-buy list: 1837 Black Tea, Tea-Infused Handcrafted Macarons, Tea-Infused French Fruit Jellies (P\u00e2te de Fruits). Founded in Singapore, this internationally renowned luxury tea brand features a venue positioned right above the indoor canal at Marina Bay Sands, reminiscent of a floating tea salon. Packaged in elegant brass tins and boasting hundreds of exclusive tea blends, it beautifully showcases Singapore\u0027s sophisticated taste in gift-giving.", "name": "TWG Tea (TWG Tea Garden at Marina Bay Sands)", "transport": "Take the MRT Circle Line (Yellow) or Downtown Line (Blue) to Bayfront Station (CE1/DT16). It is located right by the canal on Level B2 of The Shoppes at Marina Bay Sands."}, {"address": "2 Bayfront Ave, #L1-K3 The Shoppes at Marina Bay Sands, Singapore 018972", "feature": "\u2b50 4.4 stars | Must-buy list: Classic Salted Egg Fish Skin, Salted Egg Potato Chips, Salted Egg Cassava Chips. Singapore\u0027s globally famous, \u0027dangerously addictive\u0027 snack brand features rich salted egg yolk stir-fried with crispy fish skin, aromatic herbs, and curry leaves. Savory, rich, and irresistibly crunchy, it is an absolute must-buy snack when visiting Marina Bay.", "name": "IRVINS Salted Egg (at The Shoppes at Marina Bay Sands)", "transport": "Take the MRT Circle Line (Yellow) or Downtown Line (Blue) to Bayfront Station (CE1/DT16), take Exit E, and enter the main lobby on Level 1 of The Shoppes at Marina Bay Sands."}, {"address": "6 Raffles Blvd, #02-41 Marina Square, Singapore 039594", "feature": "\u2b50 4.3 stars | Must-buy list: Pandan Chiffon Cake, Traditional Kueh Lapis, Pineapple Tarts. A legendary traditional bakery in Singapore, famous for its signature Pandan Chiffon Cake\u2014fluffy, soft, and infused with natural pandan leaf fragrance and rich coconut milk. Hailed as a national treasure-level gift, it is universally adored by travelers.", "name": "Bengawan Solo (at Marina Square)", "transport": "Take the MRT North-South Line (Red) or East-West Line (Green) to City Hall Station (NS25/EW13), and walk through the underground linkway to Level 2 of Marina Square."}, {"address": "6 Raffles Blvd, #02-266 Marina Square, Singapore 039594", "feature": "\u2b50 4.4 stars | Must-buy list: Singapore Chilli Crab Cookies, Hainanese Chicken Rice Cookies, Pandan Coconut Cookies. A premier homegrown boutique specialty store for creative handmade cookies. It cleverly fuses authentic local Singaporean dishes into artisanal cookies, packaged in gorgeously nostalgic tin gift boxes. Packed with surprising flavors and rich local flair, it\u0027s a fantastic spot for unique souvenirs.", "name": "The Cookie Museum (at Marina Square)", "transport": "Take the MRT Circle Line (Yellow) to Promenade Station (CC4/DT15) and walk about 5 minutes to Level 2 of Marina Square."}, {"address": "18 Marina Gardens Dr, Flower Dome Exit, Singapore 018953", "feature": "\u2b50 4.5 stars | Must-buy list: Orchid Tea Bag Gift Set, Supertree Limited Edition Pattern Mug, Garden-themed Essential Oil Blends. Located right at the exit of the Flower Dome at Gardens by the Bay, this official gift shop offers an array of exclusive gourmet items and creative lifestyle products inspired by Singapore\u0027s national flower, the orchid, and the iconic Supertrees\u2014truly memorable and unique keepsakes.", "name": "Gardens by the Bay Gift Shop", "transport": "Take the MRT Thomson-East Coast Line (Brown) to Gardens by the Bay Station (TE22), take Exit 3, and walk about 5 minutes to the exit of the Flower Dome."}, {"address": "3 Temasek Blvd, #B1-103 Suntec City, Singapore 038983", "feature": "\u2b50 4.3 stars | Must-buy list: Ya Kun Signature Kaya Jam Jars, Ya Kun Traditional Black Coffee Powder, Kaya Peanut Butter. Singapore\u0027s iconic traditional breakfast chain. Its soul\u2014the fragrant Kaya spread\u2014is slow-cooked from coconut milk, fresh eggs, and pandan leaves. Sweet without being cloying, pairing it with buttered toast at home perfectly replicates Singapore\u0027s beloved breakfast.", "name": "Ya Kun Kaya Toast (at Suntec City)", "transport": "Take the MRT Circle Line (Yellow) to Promenade Station (CC4/DT15), take Exit C to enter Suntec City Level B1 directly."}, {"address": "3 Temasek Blvd, #B1-K1 Suntec City West Wing, Singapore 038983", "feature": "\u2b50 4.2 stars | Must-buy list: Dark Chocolate Truffles Gift Box, Handcrafted Chocolate Cookies, Rich Dark Chocolate Cake. A trendsetting homegrown Singaporean artisanal dark chocolate brand focusing on pure, rich, and non-cloying dark chocolate creations. Packaged in sleek, minimalist monochrome boxes that exude elegance, these treats make sophisticated and tasteful gifts.", "name": "Awfully Chocolate (at Suntec City)", "transport": "Take the MRT Circle Line (Yellow) to Promenade Station (CC4/DT15) and walk about 3 minutes to Suntec City West Wing Level B1."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "2 Jurong East Street 21, Singapore 609601", "feature": "\u2b50 4.4 Stars | Must-Buy List: Discounted off-season Charles \u0026 Keith bags, Nike sale sneakers, Coach signature scratch-resistant wristlets. As Singapore\u0027s largest outlet mall, IMM features over 100 designer outlet stores. For tourists staying around the Marina Bay area, it is easily accessible via MRT. Year-round discounts reach up to 80% off. The outlet store of local Singaporean brand Charles \u0026 Keith is a must-visit shopping paradise for tourists, offering high-quality bags and footwear at incredibly wallet-friendly prices.", "name": "IMM Outlet Mall", "transport": "Take the MRT North-South Line (NSL) or East-West Line (EWL) to Jurong East Station (NS1/EW2), then walk about 5 minutes via the pedestrian bridge."}, {"address": "10 Bayfront Ave, Singapore 018956", "feature": "\u2b50 4.7 Stars | Must-Buy List: TWG Tea premium gift sets, Bacha Coffee bean gift boxes, Pedro stylish leather men\u0027s shoes. As Singapore\u0027s most iconic luxury shopping destination, this mall features incredible natural lighting and an indoor canal where visitors can even ride a sampan boat while shopping. Bringing together global top luxury brands and local Singaporean flagship stores, it offers everything from high-end fashion to premium local souvenirs, making it an unmissable shopping landmark in the Marina Bay area.", "name": "The Shoppes at Marina Bay Sands", "transport": "Take the MRT Downtown Line (DTL) or Circle Line (CCL) to Bayfront Station (CE1/DT16); directly connected to the mall via an underground link."}, {"address": "3 Temasek Blvd, Singapore 038983", "feature": "\u2b50 4.4 Stars | Must-Buy List: OSIM uCozy massage pillow, Supermama blue-and-white porcelain plates, Pedro geometric wallets. Built around the famous Fountain of Wealth, Suntec City is one of Singapore\u0027s largest integrated shopping malls. Divided into North, South, East, and West zones, it houses numerous international brands alongside a vast selection of local lifestyle and electronics stores. With its spacious and comfortable layout, it is perfect for family exploration and shopping.", "name": "Suntec City", "transport": "Take the MRT Circle Line (CCL) to Promenade Station (CC4/DT15) or Esplanade Station (CC3), then walk about 3 minutes."}, {"address": "10 Bayfront Ave, #B2-113 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.6 Stars | Must-Buy List: Micro Dumpling Bag, versatile nylon tote bags, minimalist colorful card holders. Beyond The Vines is a hit Singaporean independent designer brand famous for its minimalism and vibrant colors. The Marina Bay Sands boutique boasts a contemporary artistic design. Its flagship \u0027Dumpling Bag\u0027 is made of lightweight, water-resistant nylon with stylish color-blocking, making it both fashionable and practical\u2014a must-buy local trend accessory when visiting Singapore.", "name": "Beyond The Vines (Marina Bay Sands)", "transport": "Take the MRT to Bayfront Station (CE1/DT16), enter B2 of The Shoppes at Marina Bay Sands via the underground linkway."}, {"address": "10 Bayfront Ave, #B2-96 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.5 Stars | Must-Buy List: Classic metallic buckle shoulder bags, geometric block heel pumps, minimalist bifold wallets. Known affectionately as \u0027Little CK\u0027, Singapore\u0027s national pride in footwear and accessories is globally famous for chic, high-quality, and affordable designs. The flagship store at The Shoppes at Marina Bay Sands offers the most complete selection, often featuring Singapore-exclusive colorways and first-release new items, making it the top destination for souvenir shopping and gifts.", "name": "CHARLES \u0026 KEITH (Marina Bay Sands Flagship)", "transport": "Take the MRT to Bayfront Station (CE1/DT16) with direct access to B2 of The Shoppes at Marina Bay Sands."}, {"address": "10 Bayfront Ave, #B2-65/68 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.6 Stars | Must-Buy List: 1837 Black Tea loose tea in signature yellow tin, handcrafted tea-infused macarons, Grand Wedding Tea. Founded in Singapore, TWG Tea elevates tea culture to the realm of luxury. Located in the center of the floating boutique, the Marina Bay Sands flagship displays hundreds of fine teas sourced from around the globe. Packaged in elegant luxury yellow tins alongside exquisite tea-infused French macarons, it stands as the ultimate choice for sophisticated gifting.", "name": "TWG Tea Salon \u0026 Boutique (Marina Bay Sands Flagship)", "transport": "Take the MRT to Bayfront Station (CE1/DT16) and walk to B2 along the canal inside The Shoppes at Marina Bay Sands."}, {"address": "10 Bayfront Ave, #B2-13/14 The Shoppes at Marina Bay Sands, Singapore 018956", "feature": "\u2b50 4.7 Stars | Must-Buy List: Singapore Sling flavored drip coffee gift set, Moroccan Amber sugar crystals, freshly baked classic pistachio croissants. Under Singapore\u0027s VTL Group, luxury coffee brand Bacha Coffee recreates the opulent style of a 1910 Moroccan palace. The store showcases hundreds of 100% Arabica single-origin and fine-flavored coffee beans in opulent gold and orange packaging. Visitors can purchase beautifully packaged drip coffee bags as well as takeaway fresh gourmet coffee and delicate croissants.", "name": "Bacha Coffee (Marina Bay Sands)", "transport": "Take the MRT to Bayfront Station (CE1/DT16) and exit directly into B2 of The Shoppes at Marina Bay Sands."}, {"address": "1 Esplanade Dr, #02-02 Esplanade - Theatres on the Bay, Singapore 038981", "feature": "\u2b50 4.3 Stars | Must-Buy List: Singapore durian-shaped stationery, hand-illustrated postcards by local artists, Merlion Peranakan tile tote bags. Located inside Esplanade \u2013 Theatres on the Bay (affectionately nicknamed \u0027The Durian\u0027), this independent arts gift shop features creations from numerous local Singaporean artists and designers. Dedicated to promoting local culture, the store is filled with delicate creative items blending Nanyang charm, Peranakan tile motifs, and Singaporean landmarks\u2014a fantastic hidden gem for unique souvenirs.", "name": "The Shop at Esplanade", "transport": "Take the MRT Circle Line to Esplanade Station (CC3), or to City Hall Station (NS25/EW13) and walk about 8 minutes via the underground linkway."}], "name": "Shopping Malls \u0026 Recommended Outlets"}}, "name": "Marina Bay and Sands"}, "orchard": {"categories": {"cat_1": {"items": [{"address": "2 Orchard Turn, #B3-43 ION Orchard, Singapore 238801", "feature": "\u2b50 4.6 stars | Must-Buy List: Custom Serum Cocktail, Serum Mist, Optimizer Voyage Tri-Light. Skin Inc is a renowned home-grown luxury skincare brand founded in Singapore, famous for customizing bespoke serums tailored to individual skin types. Its flagship store at ION Orchard offers professional skin analysis services, allowing customers to formulate personalized skincare products on the spot targeting issues like dryness, dullness, or aging. It is immensely popular among local socialites and international tourists alike.", "name": "Hydration Beauty Expert: Skin Inc Supplement Bar (ION Orchard)", "transport": "Take the Singapore MRT to Orchard Station (NS22/TE14), directly connecting to ION Orchard Basement 3."}, {"address": "310 Orchard Rd, TANGS at Tang Plaza, Singapore 238864", "feature": "\u2b50 4.7 stars | Must-Buy List: Multi-Targeted Elixir, Clarifying Concentrate, Smoothing Face Cream. RE:ERTH is a high-end local Singaporean botanical skincare brand featuring exclusive patented ingredients like Japanese White and Leaf Turmeric. Specifically formulated for tropical climates, its products are lightweight and fast-absorbing. Located inside the historic TANGS at Tang Plaza on Orchard Road, the counter offers warm, expert service, making it the top destination to experience local Singaporean high-tech skincare.", "name": "Minimalist Patented Skincare: RE:ERTH (TANGS at Tang Plaza)", "transport": "Take the MRT to Orchard Station (NS22/TE14) Exit A, and walk 1 minute via the underground pass to TANGS at Tang Plaza."}, {"address": "250 Orchard Rd, Design Orchard, Singapore 238905", "feature": "\u2b50 4.5 stars | Must-Buy List: Cocolicious Tri-Pout Lip Scrub, Snow Shroom Hyaluronic Serum, Hair Repair Oil. Handmade Heroes is a benchmark local Singaporean brand for vegan, cruelty-free, and organic skincare, boasting 100% natural and clean ingredients. Located inside Design Orchard\u2014a showcase for Singaporean designers and local brands\u2014the products feature affordable prices and fresh packaging. Its lip care line is a top souvenir choice loved by tourists from Europe, America, and Asia.", "name": "Vegan \u0026 Natural Skincare: Handmade Heroes (Design Orchard)", "transport": "Take the MRT to Somerset Station (NS23) Exit B, and walk about 5 minutes along Orchard Road to Design Orchard."}, {"address": "391 Orchard Rd, Level 3 Ngee Ann City, Singapore 238872", "feature": "\u2b50 4.4 stars | Must-Buy List: Post Cream, Cleanser Hair Anti-Hairloss, Restore Gel Mask. Founded by renowned Singaporean dermatologist Dr. Georgia Lee, DrGL combines a medical background with a philosophy of high-efficacy, minimalist skincare. Specially designed to meet Asian skin needs in hot and humid climates, its luxury counter in Ngee Ann City features fragrance-free formulations highly favored by discerning local shoppers who demand clean ingredients.", "name": "Renowned Doctor-Formulated Skincare: DrGL (Takashimaya Shopping Centre)", "transport": "Take the MRT to Orchard Station (NS22/TE14) and walk about 5 minutes via the underground pedestrian link to Ngee Ann City (Takashimaya)."}, {"address": "290 Orchard Rd, #B1-22 Paragon, Singapore 238859", "feature": "\u2b50 4.5 stars | Must-Buy List: Bird Nest Facial Mask, Pearl Powder, Herbal Beauty Set. Eu Yan Sang is a century-old traditional Chinese wellness brand in Singapore. In addition to traditional medicine, its herbal beauty and bird\u0027s nest skincare lines are immensely popular across Singapore and Malaysia. The elegant Paragon branch features knowledgeable staff who provide detailed advice on herbal skincare and body constitution care, making it an excellent stop for authentic local wellness beauty products.", "name": "Traditional Herbal Beauty: Eu Yan Sang (Paragon)", "transport": "Take the MRT to Orchard Station (NS22/TE14) Exit A, and walk about 6 minutes along Orchard Road to Paragon Shopping Centre."}, {"address": "391A Orchard Road, #B2-15/23 Ngee Ann City, Singapore 238873", "feature": "\u2b50 4.3 stars | Must-Buy List: Tiger Balm Ointment, Local Relief Patch, Singapore Crocodile Oil. Guardian is an iconic health and beauty chain in Singapore, with its flagship store on Basement 2 of Ngee Ann City offering the most comprehensive product selection. In addition to major international brands, it features a dedicated section for Singapore-made medicated oils, herbal patches, and crocodile oil skincare, making it the ultimate one-stop shop for drugstore souvenirs.", "name": "Guardian Health \u0026 Beauty Flagship Store (Takashimaya)", "transport": "Take the MRT to Orchard Station (NS22/TE14) and walk via the underground linkway to Ngee Ann City Basement 2."}, {"address": "2 Orchard Turn, #B2-09 ION Orchard, Singapore 238801", "feature": "\u2b50 4.6 stars | Must-Buy List: Fenty Beauty Gloss Bomb, KVD Liquid Eyeliner, Sephora Collection Sheet Mask. The Sephora at ION Orchard is one of the largest beauty flagships in Singapore, bringing together global high-end cosmetics and Southeast Asian exclusives. Spacious and brightly lit, it offers makeovers and personalized consultations with beauty experts, serving as a shopping paradise for beauty lovers and young shoppers on Orchard Road.", "name": "Sephora Flagship Store (ION Orchard)", "transport": "Take the MRT to Orchard Station (NS22/TE14), which connects directly underground to ION Orchard Basement 2."}, {"address": "391 Orchard Road, #B2-06 to 10 Ngee Ann City, Singapore 238872", "feature": "\u2b50 4.4 stars | Must-Buy List: Kwan Loong Medicated Oil, Herbal Pain Relief Patches, SG Whitening Serum. The Watsons flagship store at Ngee Ann City features an extensive selection of local Singaporean and Malaysian specialty beauty and health products. Showcasing classic Singaporean medicated oils alongside emerging local skincare brands, it offers highly competitive prices and frequent promotions, making it a favorite health and beauty hub for locals and tourists.", "name": "Watsons Flagship Store (Ngee Ann City)", "transport": "Take the MRT to Orchard Station (NS22/TE14) and walk 5 minutes via the underground pedestrian link to Ngee Ann City Basement 2."}], "name": "Iconic Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "2 Orchard Turn, #B2-12/13/14 ION Orchard, Singapore 238801", "feature": "\u2b50 4.5 stars | Must-buy list: Classic metallic buckle crossbody bag, geometric faceted heels, pleated short wallet. Singapore\u0027s most iconic fashion shoe and bag brand, affectionately known as \u0027Little CK\u0027 by Asian travelers. The ION Orchard flagship store offers the most complete selection of styles and new arrivals. Renowned for high cost-performance ratio and designs that closely follow international Fashion Week trends, it is a must-visit shopping hotspot for tourists on Orchard Road.", "name": "Charles \u0026 Keith (ION Orchard Flagship Store)", "transport": "Take the MRT North-South Line or Thomson-East Coast Line to Orchard MRT Station (NS22/TE14), and use the underground linkway to directly reach ION Orchard Level B2."}, {"address": "250 Orchard Rd, #01-01 Design Orchard, Singapore 238905", "feature": "\u2b50 4.6 stars | Must-buy list: Dumpling Bag, Micro Dumpling Bag, color-blocked nylon tote bag. A hit minimalist independent design brand from Singapore, famous across Southeast Asia for its \u0027Dumpling Bag\u0027 made of lightweight, scratch-resistant, water-repellent nylon fabric. Featuring vibrant color choices and exceptional storage functionality, it perfectly embodies the effortless lifestyle aesthetic of modern Singaporean youth.", "name": "Beyond The Vines (Design Orchard Store)", "transport": "Take the MRT North-South Line to Somerset MRT Station (NS23) and walk for about 5 minutes."}, {"address": "2 Orchard Turn, #B3-02 ION Orchard, Singapore 238801", "feature": "\u2b50 4.4 stars | Must-buy list: Tailored linen-blend wide-leg pants, slim-fit halter dresses, casual everyday blazers. A home-grown Singaporean womenswear brand tailored specifically for Asian female silhouettes, featuring fashion pieces that balance quality and comfort. Whether for office commuting or vacation style, you\u0027ll find approachable and perfect wardrobe staples here.", "name": "Love, Bonito (ION Orchard Store)", "transport": "Take the MRT North-South Line or Thomson-East Coast Line to Orchard MRT Station (NS22/TE14) with direct access to ION Orchard Level B3."}, {"address": "391A Orchard Rd, #B1-31/32 Ngee Ann City, Singapore 238873", "feature": "\u2b50 4.3 stars | Must-buy list: Lightweight genuine leather loafers, minimalist backpack, gentleman\u0027s leather dress shoes. A refined local Singaporean footwear and bag brand under the same group as Charles \u0026 Keith, focusing on elegant sophistication and smart-casual styles. Featuring fine leather materials, clean minimalist lines, high quality, and strong design appeal, it is highly favored by local professionals and fashion enthusiasts.", "name": "PEDRO (Ngee Ann City Takashimaya S.C. Store)", "transport": "Take the MRT North-South Line to Somerset MRT Station (NS23) or Orchard MRT Station (NS22), then walk along Orchard Road for about 6 minutes to Ngee Ann City."}, {"address": "2 Orchard Turn, #B1-06 ION Orchard, Singapore 238801", "feature": "\u2b50 4.5 stars | Must-buy list: Sculptural tailored cotton dresses, minimalist metallic necklaces, geometric earrings. A renowned independent designer brand from Singapore known for modern minimalist tailoring and high-quality fabrics, emphasizing silhouette lines and durability. The store also curates original jewelry design and lifestyle goods, perfectly reflecting Singapore\u0027s high-end aesthetic.", "name": "In Good Company (ION Orchard Store)", "transport": "Take the MRT North-South Line or Thomson-East Coast Line to Orchard MRT Station (NS22/TE14) with direct access to ION Orchard Level B1."}, {"address": "250 Orchard Rd, Singapore 238905", "feature": "\u2b50 4.6 stars | Must-buy list: Nanyang-style printed silk scarves, Singapore-themed handcrafted gold jewelry, local independent designer dresses. Located in the heart of Orchard Road, this government-supported design incubator hubs over 100 emerging local Singaporean creators offering apparel, footwear, bags, fragrance, and lifestyle goods. It is the best spot to uncover unique local original fashion.", "name": "Design Orchard (Local Brands Multi-Brand Store)", "transport": "Take the MRT North-South Line to Somerset MRT Station (NS23) and walk along Orchard Road for about 5 minutes."}, {"address": "290 Orchard Rd, #02-14 Paragon Shopping Centre, Singapore 238859", "feature": "\u2b50 4.3 stars | Must-buy list: Asymmetrical shirt dresses, structured water-repellent trench coats, minimalist geometric shoulder bags. Founded by renowned Singaporean designer Sabrina Goh, this eponymous brand skillfully blends architectural silhouettes with fashion design. Embodying sleek, confident minimalist lines for modern women, it is a favorite among local celebrities and hipsters alike.", "name": "SABRINAGOH (Paragon Store)", "transport": "Take the MRT North-South Line to Orchard MRT Station (NS22) and walk through the underground pedestrian walkway for about 7 minutes to Paragon Shopping Centre."}, {"address": "501 Orchard Rd, #02-11 Wheelock Place, Singapore 238880", "feature": "\u2b50 4.5 stars | Must-buy list: Slim-fit cotton gentleman shirts, vintage ties and pocket squares, relaxed tailored blazers. Founded in Singapore, this premium menswear brand features classic British vintage aesthetic and tailoring thoughtfully cut for Asian proportions, offering a one-stop refined menswear styling solution from formal suits to everyday casual wear.", "name": "Benjamin Barker (Wheelock Place Store)", "transport": "Take the MRT North-South Line to Orchard MRT Station (NS22) and exit via Underground Linkway Exit E directly into Wheelock Place."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "2 Orchard Turn, #01-15/16 ION Orchard, Singapore 238801", "feature": "\u2b50 4.6 stars | Must-Buy List: 1910 Marrakech Morning Coffee Beans, Curry Chicken Croissant, Drip Coffee Gift Box. Hailing from Marrakech, this century-old luxury coffee brand has created an opulent, gold-gilded flagship store at ION Orchard. It offers over 200 varieties of single-origin and flavored Arabica coffee beans from around the world, packaged in exquisite amber glass jars and handcrafted boxes, making it a truly high-end souvenir. The popular 1910 flavor features notes of wild berries and cream. You can also grab freshly baked croissants and elegant gold-rimmed gift boxes to take away, immersing yourself in the lavish vibe of a North African royal palace right on Orchard Road.", "name": "Bacha Coffee Flagship Store at ION Orchard", "transport": "Take the MRT North South (NS) or Downtown (DT) Line to Orchard Station, and walk directly to Level 1 of ION Orchard via the underground linkway."}, {"address": "391A Orchard Road, #B2-07-2-2 Ngee Ann City (Takashimaya), Singapore 238873", "feature": "\u2b50 4.4 stars | Must-Buy List: Pandan Chiffon Cake, Kueh Lapis (Layer Cake), Pineapple Tarts. Founded in 1979, Bengawan Solo is Singapore\u0027s most iconic heritage bakery, specializing in traditional Nanyang pastries and handmade cookies. Its legendary Pandan Chiffon Cake is cloud-soft, light, and infused with the subtle fragrant aroma of natural pandan leaves and coconut milk\u2014making it the #1 souvenir tourists buy before leaving. Additionally, the rich, buttery Kueh Lapis and bite-sized Pineapple Tarts with luscious filling are classic choices for both gifting and personal enjoyment.", "name": "Bengawan Solo at Ngee Ann City", "transport": "Take the MRT North South (NS) Line to Orchard Station, then walk about 5 minutes through the underground concourse to Basement 2 of Ngee Ann City."}, {"address": "2 Orchard Turn, #B4-98 ION Orchard, Singapore 238801", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature Sliced Pork Bakkwa, Spicy Pork Bakkwa, Crispy Pork Floss. Established in 1938, Lim Chee Guan is the undisputed #1 bakkwa (barbecued meat) brand in the hearts of Singaporeans, with locals queuing for hours during festive seasons. Unlike other chain brands, Lim Chee Guan insists on charcoal grilling to preserve the authentic smoky aroma and meat flavor. The pork slices are thick, juicy, tender, and perfectly balanced with sweet and savory secret spices. Conveniently located in ION Orchard, it\u0027s a prime spot to pick up authentic traditional Singaporean delicacies.", "name": "Lim Chee Guan at ION Orchard", "transport": "Take
