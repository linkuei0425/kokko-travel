partment store in Harbin, featuring a large dedicated counter for classic Chinese heritage beauty brands on the 1st floor. Gathering iconic traditional domestic brands, its rich moisturizing products created for Northeast China\u0027s harsh cold are extraordinarily popular.", "name": "\u4e2d\u592e\u5546\u57ce\u8001\u5b57\u865f\u570b\u8ca8\u7f8e\u599d\u5c08\u6ac3 (Central Mall National Heritage Cosmetics Counter)", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 3 minutes to reach the mall."}], "name": "Local Representative Cosmetics \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "No. 128 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Mink winter hats, genuine leather anti-slip snow boots, high-end leather gloves. Located in the heart of Central Street, this long-standing shop is the top choice for locals and Northeastern travelers seeking extreme cold-weather gear. Specializing in high-quality local fur and leather products, the shop uses premium, durable materials offering exceptional warmth. Combining traditional Harbin cold-weather wisdom with modern stylish tailoring, it\u0027s a must-visit to experience authentic Northeast winter fashion.", "name": "Harbin Fur \u0026 Leather Boutique", "transport": "Take Metro Line 2 to Shangzhi Street Station, then walk for about 6 minutes."}, {"address": "No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: High-end fur coats, Northeast-style embroidered scarves, exquisite leather handbags. NE TIGER is China\u0027s premier luxury fashion brand originating from the Northeast, renowned for combining traditional fur craftsmanship with Chinese haute couture. Housed in a historic building near Central Street, the flagship store displays breathtaking fur coats and traditional brocade accessories, highlighting Harbin\u0027s luxury fashion heritage as the \u0027Paris of the East\u0027.", "name": "NE TIGER Harbin Flagship", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 3 minutes."}, {"address": "No. 115 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Anti-slip fleece-lined leather snow boots, vintage Harbin cowhide shoes, thermal wool insoles. Guanya is a deeply historic local shoe brand on Central Street, specifically crafting footwear for the Northeast\u0027s freezing temperatures and icy streets. Their leather boots are lined with thick wool and feature specialized anti-slip outsoles\u2014making them the local secret weapon for walking safely in winter without slipping.", "name": "Guanya Leather Shoes Store", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 5 minutes."}, {"address": "Next to Modern Hotel, No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Modern Popsicle pattern canvas bags, Harbin landmark co-branded baseball caps, vintage snowflake embroidered sweatshirts. Located next to the Modern Hotel, this cultural \u0026 creative concept store blends the century-old Modern brand heritage with contemporary street style. It offers original clothing and bags designed by local young creators, featuring Saint Sophia Cathedral motifs and snow elements highly favored by young travelers and trendy hipsters.", "name": "Modern Fashion \u0026 Accessories Store", "transport": "Take Metro Line 2 to Central Street Station (Exit 1), then walk for about 4 minutes."}, {"address": "No. 59 Toulong Street, Daoli District, Harbin City, Heilongjiang Province (Next to Sophia Square)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Hand-painted Saint Sophia Cathedral tote bags, Central Street European architecture knit totes, Russian-style drawstring pouches. This cozy, independent local handmade shop features original hand-painted art o h sweet, non-sticky fillings. Additionally, Lao Ding Feng\u0027s Chinese ice cakes are a cherished childhood memory for Harbin locals, offering a pure milky flavor that is sweetly balanced\u2014the ultimate choice for experiencing Northeast China\u0027s traditional pastry culture.", "name": "Lao Ding Feng Central Street Flagship Store", "transport": "Take Metro Line 2 to Central Street Station, then walk along Central Street for about 4 minutes."}, {"address": "No. 88 Toulong Street (near Saint Sophia Cathedral), Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Alyonka Chocolate, Russian Linden Honey, Russian Pudding Wafers. Located near Saint Sophia Cathedral, this supermarket gathers a vast array of imported Russian foods and specialty snacks. The most popular items are the iconic Alyonka chocolates and the smoothly sweet Russian honey. Offering great quality at affordable prices with charmingly exotic packaging, these make fantastic office snacks or travel gifts.", "name": "Global Russian Goods Supermarket", "transport": "Take Metro Line 2 to Shangzhi Avenue Station (Exit 1), then walk for about 6 minutes to reach the area around Saint Sophia Square."}, {"address": "No. 112 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Huamei Russian Dalieba Bread, Special Russian Flower Rolls, Salad Dressing Soft Bread. Huamei Restaurant is an iconic, long-standing Russian restaurant in Harbin. Its dedicated bakery and souvenir counter serves freshly baked Russian bread daily. Their Dalieba bread uses natural hops for fermentation, featuring a firm, crusty exterior and a soft, subtly tangy interior. Paired with butter or red sausage, it offers unmatched flavor, drawing crowds of eager tourists lining up every day.", "name": "Huamei Bakery \u0026 Souvenir Shop", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 5 minutes."}, {"address": "No. 120 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Russian Purple Gold Jewelry, Authentic Russian Tiramisu, Classic Vodka Mini Gift Set. Housed inside the famous century-old historic building \u0027Songpu Foreign Firm\u0027 on Central Street, this store seamlessly blends history, culture, and specialty shopping. It sells authentic Russian tiramisu cake, renowned for its velvety texture and rich dairy aroma. Additionally, beautifully packaged Russian vodka and exquisite purple gold jewelry make perfect collectibles or high-value gifts.", "name": "Songpu 1918 Specialty \u0026 Souvenir Shop", "transport": "Take Metro Line 2 to Central Street Station, then walk along Central Street for about 4 minutes."}, {"address": "Inside Saint Sophia Square, No. 59 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Saint Sophia Cathedral 3D Ice Cream, Cathedral-shaped Metal Bookmarks, Hand-drawn Russian Style Postcards. Located right next to Saint Sophia Cathedral Square, this is the top destination for purchasing creative souvenirs inspired by Harbin\u0027s iconic landmarks. The hottest item is the 3D cathedral-shaped ice cream, which is both delicious and extremely photo-worthy. Exquisite metal architectural bookmarks and hand-painted postcards offer high-quality gifts that let you take the architectural beauty of Harbin home.", "name": "Saint Sophia Cultural \u0026 Creative Store", "transport": "Take Metro Line 2 to Shangzhi Avenue Station, then walk for about 5 minutes into Saint Sophia Square."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 100 Central Street, Daoli District, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Matryoshka doll chocolates, Qiulin Red Sausage gift sets, Northeast wild hazelnuts. Located at the core of Central Street, this well-establishe  strictly controlled quality, genuine ingredients, and transparent pricing.", "name": "Harbin New No.1 Shopping Center", "transport": "Take Metro Line 2 to Shangzhi Avenue Station, then walk for about 5 minutes."}, {"address": "No. 1 Zhigu Avenue, Songbei District, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Classic Coach crossgrain leather bags, waterproof warm Timberland snow boots, Columbia cold-proof down jackets. Harbin\u0027s most iconic and largest Tuscan European-style village outlet mall, offering a dedicated shuttle bus service from Central Street. Bringing together over 300 renowned international and domestic brands, it offers massive discounts of 50% to 70% off year-round. It is especially recommended for outdoor cold-weather gear and high-end leather goods; brands like Timberland and Columbia feature extremely attractive discounted prices, making it the top choice for buying winter gear before the Ice \u0026 Snow Festival.", "name": "Maple Leaf Village Outlet Harbin", "transport": "Take the free Maple Leaf Village shuttle bus at the intersection of Central Street and Jingwei Street, or take a taxi for about 30 minutes."}, {"address": "No. 137 Central Street, Daoli District, Harbin, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Qiulin Kvass beverage, Dalieba black rye bread, Qiulin Lidaosi red sausages. Founded in 1867, Qiulin is a legendary century-old department store brand steeped in Russian heritage. This flagship store combines classical Russian architectural charm with modern shopping experiences. Its basement food hall draws endless queues daily for freshly baked Russian Dalieba bread and authentic Lidaosi red sausages, making it an essential landmark for experiencing Harbin\u0027s Russian culinary culture and picking up iconic souvenirs.", "name": "Qiulin Department Store Central Street Branch", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 2 minutes."}, {" ction of international cosmetics and fashion brands, its basement gourmet supermarket is famous for premium Changbai Mountain supplements and high-end Russian imported foods. Offering top-tier quality and exquisite packaging, it is ideal for business travelers and tourists looking for high-quality gifts.", "name": "MYKAL Department Store Harbin", "transport": "Take Metro Line 2 to Shangzhi Avenue Station (Exit 2), then walk for about 2 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Central Street and Saint Sophia Square"}, "laodaowai": {"categories": {"cat_1": {"items": [{"address": "No. 208 Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.7 stars | Must-Buy List: Shiyitang Herbal Rejuvenating Facial Mask, Han Herbal Pearl Nourishing Cream, Special Snake Oil Anti-Freeze \u0026 Anti-Chapping Ointment. Shiyitang is a century-old, time-honored Chinese pharmacy in Harbin. The Lao Dao Wai branch is located inside the quaint Zhonghua Baroque architectural complex and is deeply trusted by local residents in Northeast China. Combining a century of traditional Chinese medicine wisdom, the store has launched various skincare products specifically formulated for the region\u0027s extreme cold and dry climate. The snake oil anti-freeze ointment and herbal facial masks, infused with high-quality botanical extracts, offer excellent moisturizing and cold-resistant protection. They are absolute must-buys for herbal skincare and cosmetics boasting rich Northeast local character and deep historical heritage.", "name": "\u4e16\u4e00\u5802\u85e5\u5e97 \u4e2d\u83ef\u5df4\u6d1b\u514b\u5e97 (Shiyitang Pharmacy - Zhonghua Baroque Branch)", "transport": "Take Metro Line 3 to Zhonghua Baroque Quarter Station (Exit 1), and walk for about 3 minutes."}, {"address": "No. 45 Nansandao Street, Daowai District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Granny Agafia Botanical Facial Mask, Russian Version Garnier High-Efficiency Hand Cream, Russian Organic Carrot Face Cream. Brimming with rich Russian flair, this specialty beauty shop is located in the core commercial district of Lao Dao Wai, directly importing affordable, high-quality skincare products from Russia and Eastern Europe. Thanks to Harbin\u0027s unique border culture, the cosmetics here are extremely popular among local women and tourists alike. The highly praised Granny Agafia masks feature natural ingredients and superb value for money, while the carrot face cream is a star product for antioxidant and deep moisturizing benefits. Buying these as souvenirs is both practical and distinctively memorable.", "name": "\u4fc4\u7f85\u65af\u7d2b\u91d1\u7f8e\u599d\u9928 \u8001\u9053\u5916\u5e97 (Russian Zijin Cosmetics Shop - Lao Dao Wai Branch)", "transport": "Take Bus 107 or 108 to Jingyu Street Station, and walk for about 200 meters."}, {"address": "No. 238 Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.6 stars | Must-Buy List: Ginseng Essence Nourishing Cream, High-Purity Mink Oil Repair Balm, Horse Oil Deep Body Lotion. Founded in the late Qing Dynasty and early Republic of China era, Taikang Pharmacy is a classic time-honored brand representing Harbin\u0027s traditional skincare and herbal beauty. The Lao Dao Wai store retains a strong historical atmosphere, offering moisturizing skincare developed specifically to combat Northeast China\u0027s harsh cold and windy sands. Among them, the mink oil repair balm and ginseng nourishing cream utilize extracts from precious local Northeast medicinal herbs. Rich in texture and intensely hydrating, they effectively soothe dry, cracked skin\u2014an authentic local herbal skincare choice that visitors to Lao Dao Wai should not miss.", "name": "\u6cf0\u5eb7\u767e\u5e74\u8001\u85e5\u623f \u9756\u5b87\u8857\u5e97 (Taikang Century-Old Pharmacy - Jingyu Street Branch)", "transport": "Take Metro Line 3 to Zhonghua Baroque Quarter Station, exit and walk straight along Jingyu Street for about 400 meters."}, {"address": "No. 28 Nan\u0027erdao Street, Daowai District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Retro Ice \u0026 Snow Cream, Heilongjiang Linden Honey Lip Balm, Wild Sea Buckthorn Repair Serum. Beiguo Xuelei is an independent beauty boutique deeply rooted in Heilongjiang\u0027s local heritage. Its store decor seamlessly blends Lao Dao Wai\u0027s Baroque carvings with vintage Northeastern elements. The shop focuses on skincare derived from wild plants and regional specialties of the Northeast, such as lip balm made from Wandashan linden honey and wild sea buckthorn serum from the Daxing\u0027anling Mountains, all natural and additive-free. The iconic retro vanishing creams come in exquisitely designed nostalgic packaging, making them immensely popular among young tourists and hipster trendsetters.", "name": "\u5317\u570b\u96ea\u857e\u7f8e\u599d\u7279\u8272\u5e97 \u4e2d\u83ef\u5df4\u6d1b\u514b\u5e97 (Beiguo Xuelei Local Beauty Shop - Zhonghua Baroque Branch)", "transport": "Take Bus 1 or 28 to Jingyang Street Station, and walk for about 350 meters."}, {"address": "No. 12 Beitoudao Street, Daowai District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Velvet High-Moisturizing Hand Cream, Russian Version L\u0027Or\u00e9al Revitalift Anti-Wrinkle Cream, Russian Pure Milk Body Balm. Epinduo is a large-scale direct retail chain for Russian goods in Harbin, boasting a vast array of items in the beauty section of its Lao Dao Wai flagship store. Skincare and cosmetics are imported directly from Russia in original packaging at prices far lower than domestic department store counters. Russian-market L\u0027Or\u00e9al products have become bestsellers due to higher ingredient concentrations and incredible cost-efficiency, while the Velvet Hand Cream is a hot item everyone grabs. It is a premier destination for purchasing Russian-style cosmetics and skincare.", "name": "\u4fc4\u54c1\u591a\u9032\u53e3\u7f8e\u599d\u65d7\u8266\u5e97 \u5df4\u6d1b\u514b\u5e97 (Epinduo Russian Cosmetics Flagship Store - Baroque Branch)", "transport": "Take Metro Line 3 to Zhonghua Baroque Quarter Station, and walk for about 5 minutes."}, {"address": "No. 88 Jingyang Street, Daowai District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Changbai Mountain Reishi Radiance Serum Oil, Ancient Formula Seven-White Whitening Mask Powder, Eleuthero Soothing Repair Mist. As a direct retail store of a long-established Harbin traditional Chinese medicine factory, this store offers authentic Han herbal skincare and cosmetics with transparent pricing. Utilizing genuine Northeastern herbs like Reishi (Ganoderma) and Eleuthero (Acanthopanax), the shop formulates gentle yet effective modern oriental skincare. The Seven-White Whitening Powder follows an ancient prescription and works wonders on dull skin, while the Eleuthero Mist quickly soothes skin discomfort caused by extreme cold\u2014highly favored by customers prioritizing ingredient safety.", "name": "\u54c8\u723e\u6ff1\u4e2d\u85e5\u5ee0\u76f4\u71df\u9580\u5e02 \u9053\u5916\u5e97 (Harbin TCM Factory Direct Store - Daowai Branch)", "transport": "Take Bus 64 or 94 to Daowai Sandao Street Station, and walk for about 150 meters."}, {"address": "No. 56 Nansidao Street, Daowai District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic Osmanthus Scented Vanishing Cream, Long-Lasting Anti-Chapping Hand \u0026 Foot Cream, Night Repair Rose Body Lotion. This is a cozy local independent boutique specializing in traditional Northeastern vanishing creams and oil-based skincare, preserving beauty memories of old Harbin neighborhoods from over half a century ago. Formulated using traditional techniques, their vanishing creams come packaged in nostalgic tin boxes with vintage illustrations. The creams are rich yet non-greasy with an elegant, nostalgic fragrance. The anti-chapping hand and foot cream is an essential household item for the harsh Northeastern winter, offering immense local cultural flair and practical value.", "name": "\u51b0\u57ce\u8001\u5b57\u865f\u96ea\u82b1\u818f\u5c08\u8ce3\u5e97 \u8001\u9053\u5916\u5e97 (Ice City Heritage Snow Cream Shop - Lao Dao Wai Branch)", "transport": "Take Metro Line 3 to Zhonghua Baroque Quarter Station (Exit 2), and walk for about 350 meters."}, {"address": "No. 180 Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.2 stars | Must-Buy List: Deer Antler Youth-Preserving Repair Mask, Birch Sap Ultra-Moisturizing Mist, Northern Wild Fir Hydrosol \u0026 Essential Oil. Saiwai Herbal is a local independent beauty workshop that combines Northeastern forest herbs with modern cold-extraction technology. The shop highlights natural plant extracts from Heilongjiang\u0027s Daxing\u0027anling and Changbai Mountain ranges. Its moisturizing mist replaces pure water with birch sap for exceptional hydrating power, while the deer antler mask stands out as a premium Northeastern anti-aging beauty staple. Featuring a classic, elegant interior, the store offers customized fragrances and herbal skincare experiences, making it a uniquely charming herbal drugstore in the Lao Dao Wai shopping district.", "name": "\u585e\u5916\u672c\u8349\u7f8e\u599d\u574a \u4e2d\u83ef\u5df4\u6d1b\u514b\u5e97 (Saiwai Herbal Beauty Workshop - Zhonghua Baroque Branch)", "transport": "Take Bus 107 or 120 to Jingyu 20th Street Station, and walk for about 250 meters."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 188 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buys: Mink dome hats, Russian-style thermal leather gloves. Located in the heart of the Chinese Baroque Historic District, this boutique inherits the Russian-influenced fashion heritage of old Harbin. Offering high-quality, cozy furs and fine leather goods, it\u2019s the top choice for braving Harbin\u2019s freezing cold and a favorite among tourists seeking authentic Northeastern winter attire.", "name": "Lao Daowai Russian Fur \u0026 Leather Boutique", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 3 minutes."}, {"address": "No. 45 Nansandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buys: Traditional Northeastern floral cotton jackets, vintage frog-button fabric handbags. Overflowing with regional charm, this shop turns iconic local floral patterns into stylish padded jackets and handcrafted cloth accessories. With vibrant cultural flair and impressive warmth, these items make excellent souvenir keepsakes and perfect props for memorable photos.", "name": "Northeast Floral Fabric \u0026 Traditional Attire Workshop", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 5 minutes."}, {"address": "No. 22 Nanerdao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buys: Handmade vegetable-tanned leather shoulder bags, vintage Baroque-carved wallets. This independent studio incorporates the ornate relief architectural motifs of Daowai into its leather designs. The owner hand-selects, cuts, and sews every piece. Featuring exquisite textures and vintage character, it\u0027s a must-visit craft workshop for hipster locals and travelers alike.", "name": "Baroque Style Handmade Leather Studio", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 4 minutes."}, {"address": "No. 210 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buys: Shanghai-style embroidered handmade cheongsams, Northeastern-style printed silk scarves. Set inside a century-old Baroque building, this shop fuses traditional Chinese qipao design with Harbin\u2019s historical Western aesthetics. Offering both off-the-rack pieces and custom tailoring, it is a hit among tourists who buy dresses to take stunning vintage photos along the historic street.", "name": "Chinese Baroque Cheongsam Store", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 3 minutes."}, {"address": "No. 12 Beitoudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buys: Multi-layered sole embroidered cloth shoes, fleece-lined warm snow boots. A heritage shop specializing in traditional multi-layered sole cloth shoes and winter padded footwear stitched using time-honored methods. The classic cloth shoes are breathable and comfortable, while the fleece-lined options are lightweight and cozy\u2014a favorite classic brand for local seniors and vintage fashion enthusiasts.", "name": "Daowai Heritage Handmade Cloth Shoes Store", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 6 minutes."}, {"address": "No. 38 Nansidao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buys: Pure wool felt fedoras, high-latitude traditional wool felt snow boots. Distinctively Harbin, this heritage shop creates felt goods handcrafted from premium pure wool through meticulous fulling techniques. The felt hats are elegant and windproof, while the sturdy felt boots are ancestral secrets to keeping feet toasty during extreme Northeastern freezes.", "name": "Ice City Heritage Felt Hats \u0026 Shoes", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 5 minutes."}, {"address": "No. 15 Nantoudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buys: Soviet-style vintage army green backpacks, American retro fleece-spliced jackets. Tucked away in the alleys of the Chinese Baroque District, this independent select shop focuses on Sino-Russian retro and workwear styles. The owner curates a unique array of vintage-inspired apparel and authentic retro bags, popular among trendy youth.", "name": "Daowai Retro \u0026 Vintage Select Shop", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 4 minutes."}, {"address": "No. 156 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 stars | Must-Buys: Traditional Manchu embroidered handbags, exquisitely embroidered coin purses. Dedicated to Heilongjiang\u0027s Intangible Cultural Heritage embroidery techniques, this creative shop blends traditional Manchu and Northeastern folk embroidery patterns into modern handbag designs. Rich in artistic value and artisanal warmth, every bag makes an unmissable local souvenir.", "name": "Heilongjiang Embroidery Handbag Gallery", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 2 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bags"}, "cat_3": {"items": [{"address": "No. 392 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Lao Ding Feng mooncakes, creamy ice cream, traditional Changbai cakes. Lao Ding Feng is a century-old bakery brand in Harbin, located in the heart of Daowai District. Preserving authentic old Harbin baking flavors, its classic flaky mooncakes and rich, creamy handmade ice cream are nostalgic childhood favorites for locals, as well as a can\u0027t-miss souvenir when visiting the Chinese Baroque Historic District.", "name": "Lao Ding Feng Bakery (Chinese Baroque Flagship Store)", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 3 minutes."}, {"address": "Intersection of Jingyu Street and Nansandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic fruitwood-smoked red sausage, air-dried lean sausage, pine nut stomach sausage. Founded in 1909, Haroulian is one of the original pioneers of Harbin red sausage. The Lao Daowai branch offers fresh vacuum-sealing services. Smoked using traditional fruitwood charcoal, these sausages pack a rich garlic aroma and a firm, juicy texture with iconic Russian-style smoky flavors\u2014perfect as gifts for friends and family.", "name": "Haroulian Red Sausage (Lao Daowai Chinese Baroque Store)", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 2 minutes."}, {"address": "Inside Chinese Baroque Historic Area, Nansidao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Qiulin Dalieba (large sourdough bread), Bread Kvass, flavored sourdough rusks. A century-old brand, Qiulin seamlessly integrated Russian baking culture into Harbin. Their signature Dalieba bread is fermented with wild hops and baked over linden wood fires, featuring a hard crust and a dense, tangily fragrant center. Paired with lightly sparkling, sweet-and-sour fermented kvass, it offers the most authentic taste of Russian culinary heritage.", "name": "Qiulin Food Store (Chinese Baroque Specialty Branch)", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 250 meters along Nansidao Street."}, {"address": "No. 18 Nantoudaojie Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Russian purple-wrapper candy (Krokant), Linden snow honey, Linden blossom dark chocolate. Filled with Russian charm, this independent specialty shop gathers an array of authentic imported Russian snacks straight from the border. The most popular purple-wrapper candy wraps crunchy peanuts, crushed nuts, and caramel inside rich dark chocolate\u2014sweet without being overwhelming, making it a top pick for bulk souvenir shopping.", "name": "Lao Daowai Russian Specialties Shop", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 400 meters."}, {"address": "No. 208 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Yuchang roast chicken, braised pork trotters, five-spice beef jerky. Yuchang Food is a long-established local brand famous for its cooked deli meats marinated in a secret recipe sauce. The roast chicken has crispy skin and tender meat, while the braised pork trotters are melt-in-your-mouth soft and deeply flavorful. The store provides special gift boxes and vacuum sealing, making it easy for travelers to take home these traditional braised delicacies as gifts.", "name": "Yuchang Food Store (Lao Daowai Branch)", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 5 minutes."}, {"address": "No. 45 Nansandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Changbai Mountain wild black fungus, Daxing\u0027anling wild hazelnuts, pure linden honey. Located in the Lao Daowai Historic District, this store specializes in premium agricultural products from Northeast China. The black fungus is thick, fleshy, and delightfully crisp, while the wild hazelnuts are richly aromatic with zero artificial additives. Carefully selected from major forest regions across Heilongjiang, these healthy, natural mountain treasures make fantastic wholesome souvenirs.", "name": "Black Soil Northeast Mountain Delicacies Shop", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 300 meters."}, {"address": "No. 26 Nan\u0027erdao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Chinese Baroque 3D architectural postcards, Ice City hand-carved Matryoshka dolls, carved handcrafted metal keychains. This local creative store blends Harbin\u0027s unique East-meets-West architectural aesthetics with Russian artistic flair. Hand-painted postcards meticulously depict old Daowai courtyards and Baroque bas-reliefs, while hand-painted wooden nesting dolls made by local artisans offer rich historical charm and memorable souvenir value.", "name": "Baroque Cultural \u0026 Creative Souvenir Shop", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 200 meters."}, {"address": "No. 12 Beiwudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Caozi sponge cakes, Mi San Dao (honey-glazed fried pastries), red bean crisp cookies. Daxing Bakery is a beloved old-school bakery cherished by Lao Daowai locals, sticking to traditional techniques for classic Chinese pastries. The Caozi cakes feature a rich egg flavor and dense texture, while the Mi San Dao are glossy, sweet, crisp, and delicious. Sold by weight at affordable prices, these traditional treats offer a delightful slice of old Harbin nostalgia.", "name": "Daxing Traditional Bakery (Lao Daowai Branch)", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 6 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 588 Zhigu 2nd Street, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted Nike sneakers, classic Coach leather bags, Moncler down jackets. Harbin\u0027s most iconic European town-style outlet center, featuring rich Tuscan architectural charm. Hosting over 200 international luxury and sports brands, it offers year-round discounts from 50% to 90% off. Whether you are looking for international luxury or winter clothing, this is a shopping paradise every visitor to Harbin shouldn\u0027t miss.", "name": "Maple Leaf Town Outlet", "transport": "Take Metro Line 2 to Shimao Avenue Station, then transfer to the Songbei New District Special Bus Line or take a taxi directly."}, {"address": "No. 1 Nanjing Road, Limin Development Zone, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Discounted Adidas collaboration sneakers, Bosideng polar thermal down jackets, Michael Kors handbags. A massive comprehensive outlet in Northeast China, seamlessly combining shopping, dining, and leisure entertainment. It features huge designer discount zones, especially for winter apparel and outdoor gear, making it the top destination for locals and tourists to stock up on high-quality branded clothing.", "name": "Shanshan Outlet Plaza", "transport": "Take Bus 213 or 225 and get off at Shanshan Outlet Station."}, {"address": "No. 168 Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.1 stars | Must-Buy List: Northeast-style fur hats, handmade leather snow boots, Lao Daowai black fungus gift boxes. Mark Way Shopping Mall is a historically iconic wholesale and retail department complex in the Lao Daowai commercial area, rooted locally for decades and holding shopping memories for generations of Harbin residents. Spanning extensive floor space, it offers a vast variety of goods from traditional fur coats, hats, and shoes to local Northeast delicacies at highly competitive prices, offering an authentic local everyday shopping experience.", "name": "Mark Way Shopping Mall", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk about 300 meters."}, {"address": "No. 230 Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Churin Redog vacuum-packed red sausages, Dalieba nut bread, traditional fermented Kvass drink. Located in the core of the Chinese Baroque Historic and Cultural Block, this flagship local specialty store carefully curates Heilongjiang\u0027s most authentic and time-honored famous brands. Known for its business integrity and comprehensive local product range, it offers on-site tasting and full delivery services, making it an excellent spot for buying authentic Harbin souvenirs.", "name": "Lao Daowai Century Specialty Store", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, Exit 1, and walk about 150 meters."}, {"address": "No. 45 Nansandao Street, Daowai District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Russian Matryoshka nesting doll sets, Northeast folk handmade paper-cut art, wheat straw collage crafts. A unique department store collecting folk art and handcrafted items, dedicated to displaying and selling Heilongjiang\u0027s intangible cultural heritage and fine works by local artisans. The store captures a unique atmosphere blending Baroque aesthetics with Northeast folk traditions, with every item brimming with rich cultural heritage and handcrafted warmth.", "name": "Chinese Baroque Artisans Department Store", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, Exit 2, and walk about 200 meters."}, {"address": "No. 154 Nanji Street, Daowai District, Harbin City", "feature": "\u2b50 4.2 stars | Must-Buy List: Northeast wild basswood honey, premium Korean pine nuts, cold-region specialty skincare products. An established, large-scale department store combining a modern shopping environment with local features, deeply rooted in Daowai District for many years. It houses a large gourmet supermarket and various brand counters, gathering high-quality organic produce and regional specialty dried goods from Heilongjiang. With strictly controlled quality, it is a trusted shopping venue for both locals and tourists.", "name": "Mykal Department Store Daowai", "transport": "Take Bus 107, 108, or 109 and get off at Nanji Street Station, then walk about 100 meters."}, {"address": "No. 12 Beitoudao Street, Daowai District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian rose gold jewelry, imported hazelnut chocolate bars, premium black caviar tins. Set within classic Chinese Baroque architecture in Lao Daowai, this specialty import department store deals exclusively in authentic Russian imported foods, handicrafts, and high-quality jewelry. Sourced directly from border ports, the store offers a wide variety of guaranteed authentic items, allowing visitors to enjoy a rich Sino-Russian shopping vibe amid historical charm.", "name": "Russian Arts \u0026 Goods Department Store", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk about 250 meters."}, {"address": "No. 228 Nanji Street, Daowai District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Changbai Mountain wild ginseng gift sets, premium sliced velvet antler, Northeast black propolis softgels. Located near the Chinese Baroque Block, this large trade complex is one of the largest distribution centers for traditional tonics and local specialties in Harbin and Northeast China. Bringing together hundreds of historic wholesale and retail shops offering reliable quality and fair prices, it is a must-visit for savvy travelers looking to buy high-grade Northeast health tonics and rare local specialties.", "name": "Nanji International Trade Center", "transport": "Take Bus 26, 74, or 116 and get off at Nanji Market Station for direct access."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Lao Daowai Chinese Baroque Historic District"}, "nangang_gogol": {"categories": {"cat_1": {"items": [{"address": "No. 318 Dongdazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Hayao Brand Caltrate Vitamin Tablets, Hasuo (Wood Frog Jelly) Nourishing Capsules, Sanjing Shuanghuanglian Herbal Skincare Balm. Hayao Group is Heilongjiang\u0027s most iconic time-honored pharmaceutical enterprise. Located in the Qiulin Commercial District, this flagship store not only sells professional medicines, but also offers a wide range of skincare and cosmetic products extracted from Northeastern specialty medicinal ingredients (such as wood frog jelly, ginseng, and Siberian ginseng). Locals and tourists alike love shopping here for unique Northeastern anti-freeze skincare products and nourishing beauty supplements, trusting its exceptional quality implicitly.", "name": "Hayao Group Pharmacy (Qiulin Flagship Store)", "transport": "Take Harbin Metro Line 1 to Museum Station, then walk for about 3 minutes."}, {"address": "No. 208 Guogeli Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Changbai Mountain Ginseng Essence Sheet Masks, Deer Placenta Paste Beauty Ointment, Northeastern Horse Oil Anti-Chapping Hand Cream. Located on the Russian-style Guogeli Street, Baofeng Pharmacy is a long-established local pharmacy brand in Harbin. The store features a dedicated \u0027Northeastern Specialty Cosmetics \u0026 Tonics Zone\u0027. Anti-chapping snake oil creams and horse oil salves specifically designed for extreme cold weather are bestsellers, making this a top choice for surviving Harbin\u0027s harsh winter and picking up unique souvenirs.", "name": "Baofeng Pharmacy (Guogeli Street Branch)", "transport": "Take Metro Line 1 to the First Affiliated Hospital of Harbin Medical University Station, then walk along Guogeli Street for about 8 minutes."}, {"address": "1F, Far East Department Store, No. 378 Guogeli Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Classic Vaseline Body Cream, Herbal Ultra-Moisturizing Hand Cream, Sanshenghua Botanical Brightening Sheet Masks. As a highly popular, classic Chinese domestic beauty brand, Pechoin has a large counter in the Far East Department Store. Tailored to Harbin\u0027s dry and cold climate, its classic Vaseline and herbal moisturizing series are hugely popular locally. The counter offers personalized skin analysis services, making it an excellent spot to purchase high-quality domestic beauty products.", "name": "Pechoin (Far East Department Store Counter)", "transport": "Take Metro Line 1 to Museum Station and access Far East Department Store directly via the underground passage."}, {"address": "No. 42 Xidazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Traditional Clam Shell Anti-Frost Balm, Northeastern Snake Oil Hand Cream, Siberian Ginseng Herbal Repairing Lotion. Lao Bai Xing Pharmacy is a famous large pharmacy chain in Northeastern China. The Museum Branch is spacious and boasts an extensive cosmetics and skincare section. The store\u0027s most popular items are the budget-friendly, nostalgic clam shell creams and snake oil skin remedies, which work wonders on soothing severe dryness and chapping caused by extreme cold, earning deep love from both older locals and visiting tourists.", "name": "Lao Bai Xing Pharmacy (Museum Branch)", "transport": "Take Metro Line 1 to Museum Station (Exit 3), then walk for about 2 minutes."}, {"address": "Beauty Area, 1F, Far East Department Store, No. 378 Guogeli Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 Stars | Must-Buy List: Master Contour Palette, Tricolor Concealer Palette, Jade Flawless Cushion Foundation. TIMAGE is a trending star cosmetics brand celebrating Chinese aesthetics, tailored specifically for Asian skin tones and facial contours. Located in the Far East Department Store, the counter features elegant classical decor and professional makeup testing services. Its contouring and concealing products have long-lasting power that withstands the extreme indoor-outdoor temperature differences in the Northeast without melting off, making it a highly recommended must-buy beauty brand for young women.", "name": "TIMAGE (Far East Department Store Counter)", "transport": "Take Metro Line 1 to Museum Station, then walk for about 3 minutes."}, {"address": "1F, Qiulin International Shopping Center, No. 319 Dongdazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Pearl Whitening Body Cream, Traditional Chinese Herbal Acne Cream, Reishi Mushroom Ultra-Nourishing Sheet Masks. Inheriting the rigorous quality of a century-old pharmacy brand, Tongrentang\u0027s Qiulin branch merges traditional Chinese medicine therapy with modern herbal cosmetics. Its herbal skincare products are renowned for being gentle and non-irritating, making them perfect for sensitive and dry skin types. Staff can recommend tailored herbal skincare products based on individual skin conditions, offering an authentic taste of local herbal beauty culture.", "name": "Renmin Tongrentang (Qiulin International Branch)", "transport": "Take Metro Line 1 to Museum Station, then walk along Dongdazhi Street for about 4 minutes."}, {"address": "B1 Floor, Far East Department Store, No. 378 Guogeli Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Bird\u0027s Nest Brightening Sheet Masks, Collagen Nourishing Hand Cream, Olive Protective Lip Balm. Located in the core commercial hub of Nangang, this Watsons store features both international cosmetics brands and a specially curated high-moisturizing cold-weather skincare section tailored for Northeastern weather. The store frequently offers discounted value sets and carries an exhaustive range of items\u2014from bestselling Japanese and Korean cosmetics to rich local seasonal skincare remedies. It is an essential stop for young locals stocking up on cold-proof beauty essentials.", "name": "Watsons (Far East Department Store Branch)", "transport": "Take Metro Line 1 to Museum Station, which directly connects to B1 floor of Far East Department Store."}, {"address": "Underground Shopping Center, Hongbo Square, Intersection of Xidazhi Street and Guogeli Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Botanical Soothing Ultra-Moisturizing Sheet Masks, Hydrating Anti-Chapping Lip Masks, Rainbow Essential Oil Fragrance Shampoo. KKV is an immensely popular large-scale lifestyle and beauty concept store located at the underground hub of Hongbo Square. Featuring visually striking bright yellow display walls, it houses hundreds of trendy makeup, nail care, personal care, and winter protection items. With trendy packaging and affordable prices, it draws crowds of local youth and students looking for trendy beauty finds.", "name": "KKV (Hongbo Square Branch)", "transport": "Take Metro Line 1 to Museum Station; the underground passage directly connects to Hongbo Square."}], "name": "Local Representative Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 288 Guogeli Street, Nangang District, Harbin City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Northeast mink coats, handcrafted wool \u0026 leather gloves. This is the most iconic local fur specialty building in Nangang District, Harbin, with a history spanning several decades. Locals come here to select premium winter mink coats and leather goods. The quality is solid, with on-site custom tailoring services available, and prices are much more affordable than outside the region.", "name": "Far East Fur Building", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 Exit 2, then walk for about 5 minutes."}, {"address": "2F, Qiulin Company, No. 319 Dong Dazhi Street, Nangang District, Harbin City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Russian handcrafted wool shawls, genuine vintage leather handbags, polar cold-proof winter hats. Located inside the century-old Qiulin Company, this shopping spot in Nangang Commercial District exudes rich Russian flair. The counter offers authentic Russian and Northeastern local handcrafted textiles and leather bags, featuring refined textures and a strong exotic vintage aesthetic loved by locals and tourists alike.", "name": "Qiulin Company Russian Handcrafted Apparel \u0026 Leather Counter", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 Exit 2, then walk for about 3 minutes."}, {"address": "Gate B, Underground Shopping Center, Hongbo Square, Nangang District, Harbin City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Northeastern original thick-soled snow boots, vintage leather backpacks. Hongbo Underground is the favorite fashion hub for young locals in Harbin. It gathers many emerging local Harbin designers and boutique buyers. The footwear is specifically tailored for the harsh cold climate of the Northeast\u2014waterproof, non-slip, stylishly trendy, and offering great value for money.", "name": "Hongbo Underground Shopping Center - Local Original Fashion Shoes \u0026 Bags Boutique", "transport": "Take Metro Line 1 or Line 2 to \u0027Museum Station\u0027, which directly connects to the underground mall."}, {"address": "3F, Songlei Commercial Mansion, No. 329 Dong Dazhi Street, Nangang District, Harbin City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Goose down polar long parkas, fleece-lined waterproof snow boots. Songlei Commercial Mansion is an established, high-end local department store in the Nangang Commercial District. Its down apparel and shoes/bags section brings together Heilongjiang\u0027s most famous cold-weather clothing brands. Locals visit every seasonal shift; the down fill is substantial enough to withstand extreme cold down to -30\u00b0C, making it the top choice for winter gear in Harbin.", "name": "Songlei Commercial Mansion - Northeast Coldproof Down \u0026 Snow Boots Counter", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 Exit 1, then walk for about 2 minutes."}, {"address": "No. 168 Guogeli Street, Nangang District, Harbin City", "feature": "\u2b50 4.2 Stars | Must-Buy List: Pure wool jacquard sweaters, Russian handcrafted carved leather wallets. A charming independent shop located on the corner of Guogeli Street, featuring wool products and handcrafted leather bags imported from Russia or made in collaboration with local workshops. The items feature rich Slavic pattern motifs, soft and warm textures, and unique, durable leather bags\u2014a hidden gem known to local regulars.", "name": "Gogol Russian Handmade Cashmere \u0026 Leather Bag Shop", "transport": "Take Bus Route 7 or 8 to \u0027Guogeli Street Station\u0027, then walk for about 1 minute."}, {"address": "4F, Yuan Da Shopping Mall, No. 369 Guogeli Street, Nangang District, Harbin City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Tailored woolen coats, designer handcrafted genuine leather square crossbody bags. Located inside Yuan Da Shopping Mall, this counter showcases select designer brands from Harbin and the Northeast. Featuring clean lines, exquisite materials, and a blend of grand northern style with modern urban chic, it is highly favored by urban women and discerning shoppers in Harbin.", "name": "Yuan Da Shopping Mall - Heilongjiang Independent Designer Womenswear Counter", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 Exit 1, then walk for about 3 minutes."}, {"address": "No. 211 Youzheng Street, Nangang District, Harbin City", "feature": "\u2b50 4.1 Stars | Must-Buy List: Non-slip warm handcrafted leather shoes, custom leather ankle boots. Bu Yun Zhai is a century-old traditional shoe shop in Harbin, adhering to traditional handcrafted shoemaking techniques. Offering custom fitted shoe services, their special non-slip, fleece-lined outsoles are perfect for walking on icy and snowy ground. Featuring excellent leather quality and high comfort, many older locals and quality-conscious customers make special visits here.", "name": "Bu Yun Zhai Traditional Handcrafted Leather Shoes Shop", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 Exit 3, then walk for about 6 minutes."}, {"address": "No. 210 Guogeli Street, Nangang District, Harbin City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Imported mink fur-trimmed leather jackets, genuine leather briefcases. A specialty leather flagship store on Guogeli Street, specializing in Russian and Northeastern luxury leather apparel and bags. Products are known for authentic materials, durability, and cold protection. With sleek leather jackets, it is a shopping paradise for local business professionals and fans of rugged vintage style.", "name": "Moscow Leather Goods \u0026 Apparel Flagship Store", "transport": "Take Bus Route 18 or 109 to \u0027Qiulin Company Station\u0027, then walk for about 4 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "1F Qiulin Company, No. 319 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Qiulin Redous Red Sausage, Russian Dalieba Bread, Qiulin Kvass. A century-old iconic flagship store in Harbin. The red sausage is smoked using traditional wood, offering a rich aroma and firm texture; the Dalieba bread is crispy on the outside, soft inside with a unique subtle sourdough aroma, making it the top souvenir choice for both tourists and locals.", "name": "Qiulin Company Food Counter", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station (Exit 2), then walk for about 3 minutes."}, {"address": "No. 288 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Russian Krokant Purple Crunch Candy, Alenka Chocolate, Russian White Bear Beer. Located at the core of the Gogol Street business district, this Russian grocery specialty store imports thousands of authentic Russian snacks and local specialties. Affordable and comprehensively stocked, it\u0027s an excellent destination for exotic sweets and gifts.", "name": "Ruipinduo Russian Supermarket", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station and walk for about 8 minutes, or take Bus Line 7 to Gogol Street Station."}, {"address": "No. 162 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Traditional Chinese Changbai Cake, Old-Fashioned Ice Cream, Chuansu Mooncake. A time-honored Harbin pastry brand with centuries of heritage. The pastries are flaky, melt-in-your-mouth, and pleasantly sweet without being greasy. The traditional old-fashioned ice cream and custom Northeast shortbreads are highly loved by locals and travelers alike.", "name": "Lao Ding Feng Bakery (Gogol Store)", "transport": "Take Metro Line 1 to Railway Bureau Station (Exit 1), then walk for about 6 minutes."}, {"address": "No. 105 Youzheng Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Zhengyanglou Air-Dried Sausage, Pine Nut Pork Sausage (Songren Xiaodu), Roasted Delicatessen Chicken. A century-old deli brand in Harbin renowned for its uniquely flavored air-dried sausages and cooked meats. Richly savory and delightfully chewy, they offer vacuum-sealing services\u2014perfect to bring home as delicious gifts for family and friends.", "name": "Zhengyanglou Food Specialty Shop", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station, then walk for about 5 minutes."}, {"address": "No. 368 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Russian Honey Medovik Cake, Russian Black Bread, Premium Vodka. A charming store near Gogol Street specializing in fresh Russian honey layer cakes and authentic Russian pastries. Sweet, rich in creamy aroma, and never overwhelming, it\u0027s an unmissable bakery souvenir shop when visiting Gogol Street.", "name": "Polar Bear Russian Food Store", "transport": "Take Bus Line 8 or 18 to Revolutionary Leaders Memorial Station, then walk for about 2 minutes."}, {"address": "No. 54 Jianshe Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Wild Changbai Mountain Black Fungus, Wild Hazel Mushrooms, Premium Cracked Pine Nuts. Specializing in the \u0027Three Treasures of the Northeast\u0027 and high-quality mountain delicacies from Changbai Mountain and the Greater Khingan Range. Rigorously quality-checked and dried for easy storage, making it the best choice for purchasing healthy and nourishing local ingredients as souvenirs.", "name": "Heilongjiang Northeast Mountain Products Main Store", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station (Exit 1), then walk for about 4 minutes."}, {"address": "No. 280 Dong Dazhi Street (near Far Eastern Department Store), Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Greater Khingan Range Wild Dried Blueberries, Wild Blueberry Juice \u0026 Jam, Blueberry Wine. Highlighting pure natural wild blueberry products from the Greater Khingan Range. Sweet and tangy, packed with anthocyanins, beautifully packaged, and full of forest region charm\u2014a health-conscious snack gift favored by young tourists.", "name": "Blueberry Country Northeast Specialty Shop", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station (Exit 3), then walk for about 3 minutes."}, {"address": "No. 112 Gexin Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Russian Canned Mixed Fruit, Pickled Cucumber Canned, High-Purity Dark Chocolate. Tucked away in an alley in the Nangang Commercial Area, this imported Russian food shop offers rare traditional Russian canned pickles and imported high-purity dark chocolates. Unique products at fair prices make it a fantastic place to discover exotic snack treasures.", "name": "Moscow Russian Food Workshop", "transport": "Take Metro Line 2 to Provincial Hospital Station, then walk for about 7 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 319 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Qiulin Red Sausage, Qiulin Kvass beverage, century-old Dalieba bread. Established in 1900, this century-old department store was founded by Russian merchants and deeply rooted in Harbin, making it the most iconic landmark in the Nangang Commercial District. The downstairs food supermarket sees daily queues for freshly made red sausages infused with a rich smoky garlic flavor. The Dalieba bread, fermented using traditional Russian hops, has a dense and satisfying texture\u2014making this store an irreplaceable city card for both locals and tourists.", "name": "Qiulin Department Store", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 (Exit 1) and walk about 200 meters."}, {"address": "No. 329 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Heilongjiang local designer fur accessories, Northeast linden honey gift boxes, Harbin cultural \u0026 creative ice cream tumbler cups. Songlei Department Store is a leading homegrown commercial brand in Harbin, deeply loved by local residents. It brings together numerous local clothing and creative brands unique to the Northeast. Compared to standard chain stores, it radiates the Ice City\u0027s unique grand charm, offers friendly service, and frequently runs exclusive promotions for local shoppers.", "name": "Songlei Center Plaza (Nangang Branch)", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 (Exit 2) and walk about 150 meters."}, {"address": "No. 381 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Wild Heilongjiang hazelnuts, exquisite Russian-style chocolate gift boxes, Yuan Da Good Day co-branded warm cashmere sweaters. Yuan Da Shopping Plaza is the pioneer of local high-end department stores originating in Harbin, leading the Ice City\u0027s fashion trends. The basement level\u0027s Good Day Market boasts Harbin\u0027s most complete selection of imported foods and premium Heilongjiang local specialties, making it the top choice for local middle-class families and tourists shopping for exquisite souvenirs.", "name": "Yuan Da Shopping Plaza (Nangang Branch)", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 (Exit 3) and walk about 300 meters along Gogol Street."}, {"address": "Underground of Hongbo Square, Intersection of Hongjun Street and Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Local cold-proof polar snow boots, stylish extra-thick Northeast down jackets, hand-knitted beanie hats. Converted from air-raid shelters, Hongbo Underground Shopping Center is a legendary local shopping hub that accompanied generations of Harbin residents as they grew up. Housing hundreds of local apparel shops and general merchandise stalls, it offers highly competitive prices and serves as a treasure base for picking up extreme-cold winter apparel and trendy cold-weather accessories.", "name": "Hongbo Underground Shopping Center", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027; direct underground connecting walkways lead into the mall."}, {"address": "No. 228 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Russian Matryoshka/Alyonka chocolates, Russian rose gold jewelry, high-end Russian Tiramisu cake. Situated in the heart of Gogol Street, this independent boutique features rich European retro decor. The owner directly imports daily goods, cosmetics, and snacks from Russia. The store offers certified rose gold jewelry in various styles, while the classic Alyonka chocolate is sweet without being cloying\u2014a must-visit spot when exploring the Russian charm of Gogol Street.", "name": "Guogeli Russian Specialty Goods Store", "transport": "Take Bus 7, 8, or 18 to \u0027Gexin Street Station\u0027, then walk about 100 meters."}, {"address": "No. 40 Xi Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Northeast-style mink fur coats, thick goose-down coats, original Harbin trendy hoodies. This massive wholesale and retail clothing market is a treasure-hunting paradise for local fashion-savvy youth. Spanning multiple floors, it hosts many local Northeast designers and factory-direct outlets. Renowned for supreme cold insulation and unbeatable value for money, it is the best place to find authentic, high-spec winter wear at affordable prices.", "name": "Nangang Guomao Fashion City", "transport": "Take Metro Line 1 to \u0027Railway Bureau Station\u0027 (Exit 2) and walk about 3 minutes."}, {"address": "No. 156 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Vacuum-packed Heilongjiang Wuchang rice, wild wood ear mushrooms, Changbai Mountain ginseng slices. A specialty store deeply rooted in Nangang District for years, it carefully selects high-quality agricultural products across Heilongjiang Province. Free from touristy pushy sales gimmicks, pricing is completely transparent and fair. The authentic Wuchang rice is richly aromatic, and the wild wood ear mushrooms are thick and gelatinous\u2014a local favorite secret spot for buying genuine produce from the fertile black soil.", "name": "Heilongjiang Specialty Local Department Store", "transport": "Take Bus 8, 18, or 63 to \u0027Gogol Street Station\u0027."}, {"address": "No. 1700 Nanjing Road, Songbei District, Harbin City, Heilongjiang Province (direct shuttle pickup point available in Nangang District)", "feature": "\u2b50 4.6 stars | Must-Buy List: Bosideng high-end extreme-cold down jackets (from 70% off), Columbia 3-in-1 jackets, Coach classic signature handbags. Harbin\u0027s most representative large outlet mall features American-style town architecture. It brings together top international luxury brands and premier domestic cold-weather brands. Brands essential for the local climate like Bosideng, The North Face, and Arc\u0027teryx offer year-round deep discounts, making it a shopping paradise for locals stocking up on name-brand winter gear and luxury goods.", "name": "Harbin Shanshan Outlet Plaza", "transport": "A free direct Shanshan Outlet shopping shuttle bus can be taken at the Museum Metro Station exit in Nangang District."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Nangang Commercial District and Gogol Street"}, "pingfang_history": {"categories": {"cat_1": {"items": [{"address": "No. 128 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Sanjing Calcium Gluconate Oral Liquid, Gaizhonggai High-Calcium Tablets, Harbin Pharma Pure Pearl Powder. As the official direct flagship store of Harbin Pharmaceutical Group\u2014a local pharmaceutical giant\u2014it offers authentic health supplements and restorative ointments that locals have used since childhood. With guaranteed quality and highly competitive prices, it is the top trusted choice for skincare and pharmacy goods among locals.", "name": "Harbin Pharmaceutical Group Direct Store", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 1), walk about 300 meters."}, {"address": "No. 65 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Garnier All-in-One Hand Cream, Granny Agafia Cream Facial Mask, Russian Velvet Antler Nourishing Ointment. Leveraging Harbin\u0027s geographic border advantage, this store imports a wide variety of original Russian beauty and pharmacy products. Featuring natural ingredients, generous sizes, and intense moisture formulated for cold, dry climates, it is a unique specialty beauty shop popular with both residents and tourists.", "name": "Russian Purple Gold Cosmetics Store", "transport": "Take Harbin Metro Line 1 to Youxie Street Station, walk about 450 meters."}, {"address": "No. 38 Xinhua Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Sunflower Liver Protection Tablets, Little Sunflower Soothing Baby Cream, Herbal Extract Anti-Sensitivity Toothpaste. A directly operated chain store under Sunflower Pharmaceutical, a renowned local pharmaceutical company in Heilongjiang. In addition to traditional Chinese patent medicines, its recently developed herbal skincare and personal care series have built an excellent local reputation for their gentle, region-specific formulations.", "name": "Sunflower Pharmaceutical Chain Pharmacy", "transport": "Take Bus 343 or 338 to Xinhua Road Station, walk about 150 meters."}, {"address": "1F, Pingfang Commercial Building, No. 88 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Bee \u0026 Flower Wheat Protein Conditioner, Shanghai Lady Vanishing Cream, Friendship Brand High-Grade Skincare Cream. A charming specialty shop in Pingfang District dedicated to classic Chinese heritage beauty and skincare brands. Retaining nostalgic vintage packaging alongside incredible value, it is widely beloved by customers who appreciate nostalgic vibes and budget-friendly quality care.", "name": "Bee \u0026 Flower Vintage Beauty Shop", "transport": "Take Harbin Metro Line 1 to Baoguo Street Station (Exit 2), walk about 200 meters."}, {"address": "No. 15 Xinjiang West Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Northeast Wild Ginseng Repair Mask, Deer Antler Gel Moisturizer, Lily Lip Balm. A long-established pharmacy deeply rooted in Heilongjiang. It features a special counter dedicated to beauty products made from authentic local Northeast herbs. Combining herbal extracts unique to Mount Changbai and Heilongjiang, it offers a line of traditional Chinese cosmetic care tailored specifically for cold climates.", "name": "Renhetang Pharmacy", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 3), walk about 500 meters."}, {"address": "1F, Wanda Plaza, Intersection of Hanan 11th Road and Hanan 1st Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Must-Buy List: Chando Glacier Water Hydrating Mask, Kans Red Waist Serum, Watsons Horse Oil Intensive Moisturizing Cream. Located in the core commercial district inside Wanda Plaza, this branch expands its selection beyond international brands to feature trendy domestic cosmetics popular in Northeast China, offering a comprehensive shopping experience for Chinese beauty and pharmacy lines.", "name": "Watsons (Pingfang Wanda Branch)", "transport": "Take Bus 361 or 371 to Hanan Wanda Plaza Station, walk about 100 meters."}, {"address": "No. 22 Xingjian Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian Calendula Soothing Cream, Sea Buckthorn Seed Oil Anti-Wrinkle Essence, Organic Honey Repair Hand Cream. A curated boutique specializing in premium Russian herbal skincare brands. The products feature high concentrations of wild sea buckthorn and cold-extracted plant essences, specifically formulated for harsh cold climates. It is a go-to natural skincare spot in Pingfang District.", "name": "Titian Herbal Russian Skincare Boutique", "transport": "Take Harbin Metro Line 1 to Xingjian Street Station, walk about 350 meters."}, {"address": "No. 102 Lianmeng Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Pianzihuang Pearl Cream, Dr. Yu Skin Barrier Repairing Milk, Osmosis Pearl Radiant Essence. A cosmeceutical beauty center operated by a major pharmaceutical chain in Harbin. Combining professional pharmacist consultation with high-safety skincare products, it is the premier shopping destination for locals looking to repair sensitive skin and maintain intense hydration during autumn and winter.", "name": "Baofeng Pharmacy \u0026 Beauty", "transport": "Take Bus 343 to Lianmeng Street Station, walk about 180 meters."}], "name": "Iconic Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "No. 138 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-buy list: Northeast goose down extra-thick parka, wool knit cold-weather hat, thermal gloves. A classic department store in the heart of Pingfang District\u0027s commercial area, highly trusted by locals. The store specializes in local brand clothing designed for the extreme cold of Northeast China, especially locally produced high-quality goose down jackets. Excellent warmth retention at affordable prices, making it the best choice to withstand Harbin\u0027s severe winter.", "name": "Pingfang Department Store Local Clothing Counter", "transport": "Take Metro Line 1 to Xinjiang Street Station (Exit 1), then walk for about 3 minutes."}, {"address": "No. 25 Hongxing Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-buy list: Windproof fleece-lined snow boots, traditional Northeast floral jacket, thick cashmere sweater. Located near Hongxing Street in Pingfang District, this independent clothing store is famous for its high cost-performance ratio and unique foreign trade apparel. The owner has been rooted in the local community for years, curating clothes that combine traditional Northeast characteristics with modern casual elements\u2014perfect for tourists looking to try local fashion styles.", "name": "Hongxing Foreign Trade Original Clothing Store", "transport": "Take Bus 338 or 343 to Pingfang Railway Station, then walk for about 5 minutes."}, {"address": "No. 88 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-buy list: Vintage Northeast printed floral padded jacket, hand-knitted fluffy crossbody bag, cold-proof fleece-lined scarf. This charming local shop features original clothing that blends traditional Northeast floral fabric culture with modern tailoring. The clothing and items are designed and made with the help of local artisans, ensuring even the bags and accessories carry a rich essence of ice and snow culture.", "name": "Snow Country Original Thermal Apparel", "transport": "Take Metro Line 1 to Youxie Street Station, then walk for about 4 minutes."}, {"address": "No. 45 Xinjiang East Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Must-buy list: Anti-slip fleece-lined leather boots, vintage genuine leather handbag, men\u0027s cold-proof leather gloves. A time-honored local leather store in Pingfang District specializing in genuine leather footwear and high-quality leather goods. The owner insists on using thick cowhide and high-density warm wool lining to create non-slip boots specially made for icy and snowy roads. Durable and sturdy, it is highly beloved by long-time residents.", "name": "Harbin Traditional Leather \u0026 Shoes Boutique", "transport": "Take Bus 361 to Xinjiang East Road Station, then walk for about 2 minutes."}, {"address": "No. 12 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-buy list: Trendy color-block backpack, polar anti-slip high-top snow boots, multifunctional travel organizer bags. A popular trendy shopping spot among young people in Pingfang District, bringing together local designer brands from Harbin and Northeast China. It features shoes and bags combining fashionable looks with exceptional functionality. In particular, the anti-slip snow boots are stylishly designed, completely overturning the bulky image of traditional snow boots.", "name": "Ice City Trendy Shoes \u0026 Bags Store", "transport": "Take Metro Line 1 to Baoguo Street Station (Exit 2), then walk for about 3 minutes."}, {"address": "No. 210 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-buy list: Extreme Cold series long hooded down parka, lightweight windproof down vest, snowproof gloves. As a flagship store for one of Northeast China\u0027s most famous local down jacket brands, this store offers the most complete selection of winter outerwear. Featuring high down fill power and rigorous windproof testing, the store guides are experienced in dressing for extreme cold, offering visitors the most practical winter styling advice.", "name": "Yalu Down Jacket Pingfang Flagship Store", "transport": "Take Metro Line 1 to Xinjiang Street Station, then walk for about 6 minutes."}, {"address": "No. 77 Lianmeng Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-buy list: Traditional handcrafted tiger-head shoes, Lei Feng-style ear-flap wool hat, vintage woven tote bag. A folk footwear and headwear store preserving traditional craftsmanship, specializing in handmade Northeast-style products. The ear-flap hats are made of natural wool for ultimate warmth, while the handcrafted tiger-head shoes are a popular souvenir full of folk art flavor and cultural value.", "name": "Northeast Traditional Handcrafted Shoes \u0026 Hats Store", "transport": "Take Bus 220 to Lianmeng Street Station, then walk for about 3 minutes."}, {"address": "No. 56 Xinhua Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-buy list: Vintage sheepskin handbag, top-grain cowhide short wallet, plush-trimmed crossbody bag. A well-known independent leather boutique in Pingfang District. The owner personally selects high-quality leather goods and stylish women\u0027s bags from across Northeast China. The products feature a sleek, elegant style and budget-friendly prices, with a quality far surpassing chain brands in the same price range\u2014making it a top pick for local women.", "name": "Da\u0027an Boutique Leather Goods \u0026 Handbags", "transport": "Take Bus 343 to Xinhua Street Station, then walk for about 2 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 42 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Garlic Red Sausage, Kids\u0027 Sausage, Russian Dalieba Bread. Harbin\u0027s most iconic century-old red sausage brand, located in the core commercial area of Xinjiang Street in Pingfang District. Made with selected premium pork and smoked over classic fruitwood, these sausages boast a rich aroma packed with juicy meatiness and garlic flavor. A classic souvenir must-buy for tourists visiting the nearby Unit 731 Exhibition Hall.", "name": "Churin-Lidos (Xinjiang Street Store)", "transport": "About a 300-meter walk from Exit 1 of Xinjiang Street Station, Metro Line 1"}, {"address": "No. 88 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Premium Lean Red Sausage, Air-Dried Sausage, Pine Nut Pork Tripe. A China Time-Honored Brand founded in 1913, highly praised by locals in Pingfang District. Its red sausages are crafted using traditional Russian methods, featuring a subtle fruitwood smoke aroma on the casing that blends perfectly with the garlicky savory meat inside. Vacuum-packed options make it super convenient for travelers to take home.", "name": "Harbin Meat Processing Factory Shop (Youxie Street Store)", "transport": "About a 400-meter walk from Exit 2 of Youxie Street Station, Metro Line 1"}, {"address": "No. 21 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Purple Wrapper Peanut Candy, Alyonka Chocolates, Russian Tiramisu Cake. Located right near the Unit 731 Exhibition Hall, this specialty shop features imported Russian snacks and treats. The crowd-favorite crunchy purple-wrapped candies, along with various flavored Russian chocolates and cakes, make for unique, exotic border-town gifts.", "name": "Russian Goods Specialty Store (Unit 731 Museum Branch)", "transport": "About a 150-meter walk from Exit 2 of Xinjiang Street Station, Metro Line 1"}, {"address": "No. 102 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Chuansu Mooncake, Traditional Fried Cake, Chinese Long Pastries. A 200-year-old traditional Chinese bakery brand in Harbin with a local branch in Pingfang District. Adhering to time-honored handmade craft, their pastries are delightfully flaky, sweet, and non-greasy. The classic Chuansu mooncakes and various nut pastry treats are huge hits among elders and tourists alike.", "name": "Lao Ding Feng Bakery (Pingfang Store)", "transport": "About a 350-meter walk from Exit 1 of Youxie Street Station, Metro Line 1"}, {"address": "No. 15 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Northeast Wild Pine Nuts, Greater Khingan Dried Blueberries, Pure Natural Linden Snow Honey. A specialty dried fruit and mountain delicacies shop strongly recommended by local residents. It directly sells ecological produce from the Greater Khingan forests of Heilongjiang. Plump wild pine nuts packed with aroma, alongside sweet-and-sour dried blueberries with no artificial additives, make healthy and natural Northeast gifts.", "name": "Dalaoli Mountain Specialties \u0026 Dried Fruit Shop (Pingfang Market Store)", "transport": "Take Bus 343 or 399 to Baoguo Street Station, then walk about 200 meters"}, {"address": "No. 85 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Traditional Russian Dalieba Bread, Small Lieba Rolls, Gabala Caramel Biscuits. Inheriting the century-old Russian restaurant baking quality from Central Street ping Road, Xiangfang District, Harbin City (Direct shuttle buses available around Pingfang District)", "feature": "\u2b50 4.5 stars | Must-Buy List: Discounted Nike past-season sneakers, Coach classic signature bags, trendy Evisu T-shirts. This is a large European-style outlet mall in Northeast China, featuring numerous internationally famous brands and high-end Chinese designer labels. The open-air setting is elegant and offers massive discounts, with year-round savings from 70% to 90% off. It is the premier destination in Harbin for shopping designer brands at discount prices.", "name": "Harbin Bailian Outlets Plaza", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, then transfer to Bus 338 or take a taxi for about 15 minutes."}, {"address": "No. 33 Xinjiang Dajie, Pingfang District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Vacuum-packed Northeast cold noodles, Harbin red sausage gift boxes, Heilongjiang dried blueberries. As the core and most iconic local commercial department store in Pingfang District, Hongbo Shopping Plaza brings together retail, supermarkets, and local brand chains. Rich in vibrant local Harbin life, it is an ideal spot to buy local Northeast specialties and daily essentials.", "name": "Pingfang Hongbo Shopping Plaza", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, Exit 1, and walk for about 3 minutes."}, {"address": "No. 18 Youyi Road, Pingfang District, Harbin City", "feature": "\u2b50 4.1 stars | Must-Buy List: Northeast extreme-cold snow boots, local thermal down jackets, premium Black Soil pine nuts. An established landmark department store in Pingfang District, it houses many local Heilongjiang apparel brands and cold-weather gear shops. Offering solid quality at great value, it is a favorite shopping spot among locals for winter clothing and daily items.", "name": "Pingfang Friendship Time Square", "transport": "Take Bus 211 or 343 to Youyi Lu Station and walk for about 2 minutes."}, {"address":
