 338 to Lianmeng Dajie Station and walk for about 3 minutes."}, {"address": "No. 15 Xinping Street, Pingfang District, Harbin City", "feature": "\u2b50 4.2 stars | Must-Buy List: Fleece-lined windproof snow boots, goose down thermal jackets, mink velvet winter hats. A unique local independent boutique in Pingfang District specializing in high-quality extreme-cold weather gear designed for the freezing Northeast climate. Combining style with impressive thermal performance at prices far more affordable than major international brands, it is the top choice to gear up for sub-zero travel.", "name": "Ice Capital Arctic Apparel Boutique", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, then transfer to Bus 220 to Xinping Jie Station."}, {"address": "No. 45 Nanchang Street, Pingfang District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Birch bark carving crafts, Northeast linden honey gift sets, handmade Matryoshka nesting dolls. An independent shop showcasing Heilongjiang traditional folk crafts and unique lifestyle goods. The owner curates a selection of local artisans\u0027 handcrafts and pure natural farm products, each imbued with strong local Harbin culture\u2014perfect for finding one-of-a-kind souvenirs.", "name": "Pingfang Black Soil Craft \u0026 Grocery Store", "transport": "Take Metro Line 1 to Baoguo Dajie Station and walk for about 8 minutes."}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Former Site of Unit 731 in Pingfang District"}, "songbei_ice_snow": {"categories": {"cat_1": {"items": [{"address": "Hall 2, Russian Style Town, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Must-Buy List: Granny Agafia Russian Herbal Face Mask, Garnier Anti-Freeze Repair Hand Cream, Russian Organic Plant Essential Oils. Located inside the Russian Style Town on Sun Island, this specialty cosmetics shop is a favorite among tourists. It features pure natural herbal skincare products directly imported from Russia, uniquely suited for the Northeast border region. Ideal for combating Harbin\u0027s dry, freezing winter weather, these items come in exquisite packaging at budget-friendly prices, making it the premier destination for distinctive beauty souvenirs.", "name": "Sun Island Russian Town Beauty Shop", "transport": "Take Harbin Metro Line 2 to Sun Island Station, then walk for about 8 minutes."}, {"address": "Area A, Indoor Commercial Service Zone, Ice and Snow World Park, Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.7 stars | Must-Buy List: Extreme Cold Anti-Chapping Repair Balm, Ice \u0026 Snow Honey Lip Balm, Rhodiola Anti-Aging Moisturizer. Specially designed to tackle the extreme sub-zero temperatures (-20\u00b0C and below) of Ice and Snow World, this beauty experience hall is located inside the park\u0027s Commercial Service Center. The store features a wide selection of anti-freeze, moisturizing cosmetics and snow-proof skincare products developed locally in Heilongjiang. Its Extreme Cold Anti-Chapping Balm quickly soothes wind-chapped and cold-damaged skin, making it an essential emergency skincare savior when visiting the ice sculptures.", "name": "Ice \u0026 Snow World Extreme Beauty Pavilion", "transport": "Take Harbin Metro Line 2 to Ice \u0026 Snow World Station, Exit 3."}, {"address": "No. 105, Style Commercial Street, Intersection of Taiyang Avenue and Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian Karelia Propolis Repair Cream, Olayton Rose Fragrance Essential Oil, Russian Velvet Antler Repair Mask. A well-known Russian-style cosmetics and drugstore in the Songbei Commercial District near Sun Island, focusing on authentic imported skincare and cosmeceuticals from Russia. The shop offers a rich trial experience with plenty of samples. The propolis repair cream is highly recommended for its remarkable ability to repair dry and peeling skin. Both locals and tourists love buying specialized moisturizing products here.", "name": "Zijin Russian Imported Cosmetics Experience Hall", "transport": "Take Metro Line 2 to Sun Island Station, Exit 1, and walk about 10 minutes."}, {"address": "1st Floor, Commercial Zone, Visitor Center, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Changbai Mountain Ginseng Anti-Freeze Body Lotion, Acanthopanax Soothing Repair Mist, Sea Buckthorn Vitamin C Brightening Essence. This flagship experience store for a native Northeastern herbal skincare brand is located in the Sun Island Scenic Area. It specializes in skincare made from rare plant extracts unique to Heilongjiang and Changbai Mountain. Its ginseng moisturizer and Acanthopanax mist quickly rehydrate skin and strengthen the moisture barrier, making them popular among fans of natural herbal skincare.", "name": "Beiguo Herbal Cosmetics Sun Island Shop", "transport": "Take Metro Line 2 to Sun Island Station, then follow signs to the Visitor Center and walk for about 3 minutes."}, {"address": "No. 8 Pingyuan Street, Inside Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Snow Pine Needle Essential Oil Fragrance Water, Birch Sap Ultra-Moisturizing Face Mask, Lilac Extract Hydrating Hand Cream. Nestled in the cultural and creative commercial area of Sun Island, this cozy botanical boutique focuses on local skincare lines extracted from Harbin\u0027s city flower (lilac) and cold-zone flora like birch sap and pine needles. The shop has a warm and elegant atmosphere, and its birch sap face masks offer incredible hydration\u2014making them an exclusive beauty gift representing Harbin\u0027s snowy botanical heritage.", "name": "Snow Country Botanical \u0026 Fragrance Boutique", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to the park sightseeing shuttle bus to Pingyuan Street."}, {"address": "Floor B1, Underground Commercial Street, Metro Sun Island Station, Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Northeast Horse Oil Intensive Anti-Chapping Ointment, Arbutin Whitening Serum Lotion, Pearl Herbal Skin Repair Cream. Set up inside the commercial concourse of Sun Island Metro Station, this beauty and drugstore section is part of a trusted century-old pharmacy chain. Beyond standard medical ointments, it promotes premium local horse oil and herbal repair beauty products. Known for pure ingredients and deep moisturizing properties, it offers an affordable solution against harsh cold and skin chapping.", "name": "Tongren Kangle Pharmacy Beauty Section - Sun Island Outlet", "transport": "Take Harbin Metro Line 2 to Sun Island Station; accessible directly inside the metro\u0027s commercial street."}, {"address": "Shop No. 12, Outer Access Passage, Ice \u0026 Snow World Park, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Must-Buy List: Russian Organic Sea Buckthorn Repair Oil, Snow Extreme Deep Moisture Cream, Royal Jelly Anti-Wrinkle Eye Cream. Situated near the entrance of Ice \u0026 Snow World, this drugstore combines Heilongjiang\u0027s locally developed extreme-cold skincare with best-selling organic cosmetics from Russia. The organic sea buckthorn oil is exceptionally effective for repairing skin irritated by freezing winds, drawing many visitors to stock up before or after exploring Ice and Snow World.", "name": "Ezi Local \u0026 Russian Beauty Boutique", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station, Exit 1, and walk for about 5 minutes."}, {"address": "No. 188 Songbei Avenue (Opposite the entrance to Sun Island Park), Songbei District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Black Earth Natural Mineral Mud Deep Cleansing Mask, Wild Blueberry Antioxidant Night Cream, Russian Cedar Body Lotion. Located near Sun Island in Songbei District, this specialty local beauty shop highlights skincare infused with minerals from the Northeast\u0027s unique black soil and cold-zone wild fruit extracts. Its black soil mineral mud mask features high absorption power rich in trace elements, while the blueberry night cream provides antioxidants and brightens skin, showcasing Harbin\u0027s distinct local agricultural and natural heritage.", "name": "Black Earth Mineral Skincare Flagship Store", "transport": "Take Metro Line 2 to Sun Island Station, Exit 2, and walk for about 6 minutes."}], "name": "Iconic Local Beauty \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 1 Shanglv Street, Visitor Center, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Russian-style mink hats, handmade warm wool gloves, and suede thermal snow boots. Located near the Sun Island Scenic Area, this store is a highly distinctive local shop specializing in Russian-style clothing. Using premium Northeast furs and imported Russian materials, it crafts hats and fur garments that combine classic European elegance with ultimate winter warmth, making it a favorite among locals and tourists alike.", "name": "Heilongjiang Specialty Russian Fur \u0026 Leather Boutique", "transport": "Take Harbin Metro Line 2 to Sun Island Station (Exit 3) and walk for about 3 minutes."}, {"address": "Zone A12, East Commercial Block, Harbin Ice and Snow World, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Extra-thick polar windproof down jackets, professional anti-slip snow boots, and ear-protecting thermal cashmere hats. Specially designed for the extreme temperatures (-20\u00b0C and below) of Harbin Ice and Snow World, this highly acclaimed local outdoor brand is famous for its quality. The snow boots feature patented anti-slip soles, and the down coats boast ultra-high fill power, making this the top choice to stock up on winter gear before heading to Ice and ntage felt tote bags, and traditional plush ear-flap winter hats. Situated in the heart of the Russian Town on Sun Island, this workshop is a collaboration between local artisans and Russian designers. It features hand-embroidered cloth and leather bags as well as unique ethnic clothing, with every piece showcasing one-of-a-kind patterns and exquisite craftsmanship.", "name": "Sun Island Russian Handmade Embroidery \u0026 Handbag Workshop", "transport": "Take Harbin Metro Line 2 to Sun Island Station (Exit 2) and walk into the Russian Town Scenic Area."}, {"address": "Building B5, Commercial Street, Intersection of Songbei Avenue and Ice \u0026 Snow World Landscape Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Waterproof professional ski suit sets, high-capacity snowproof outdoor backpacks, and anti-fog ski goggle \u0026 glove sets. Located near Harbin Ice and Snow World, this shop offers high-spec clothing, footwear, and bags for outdoor enthusiasts and winter visitors. Products boast exceptional waterproof, breathable, and thermal performance, ensuring maximum protection whether you\u0027re riding the ice slides or taking photos.", "name": "Snow Realm Extreme Sports Apparel \u0026 Gear Specialty Shop", "transport": "Take Harbin Metro Line 2 to Ice and Snow World Station (Exit 3) and walk for about 5 minutes."}, {"address": "Shops opposite the Globe Theatre, Shimao Avenue (Sun Island Commercial Area), Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Pure cashmere warm scarves, extra-thick mink-velvet base layers, and real wool shawls with matching handbags. A premier local Heilongjiang chain specializing in high-quality cashmere and fur, featuring a large flagship store near Sun Island. Renowned for pure goat cashmere and fine textile craftsmanship, their products are luxuriously soft, snug, and exceptionally warm\u2014a top choice for locals buying premium winter gifts for elders.", "name": "Heilongjiang Cashmere \u0026 Fur Flagship Store", "transport": "Take Bus 125 or 126 to Shimao Avenue Station, then walk for about 3 minutes."}, {"address": "No. 102 Business Area, Visitor Service Center Hall (North Side), Harbin Ice and Snow World, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Matching family colorful windproof down jackets, cute kids\u0027 anti-slip snow boots, and cartoon-shaped thermal mitten bags. Designed specifically for families visiting Harbin Ice and Snow World and the Sun Island Snow Expo, this specialty shop offers matching parent-child winter outfits. Brightly colored and stylish, these outfits are perfect for capturing heartwarming family photos against the crisp white snow.", "name": "Frozen Fantasy Kids \u0026 Family Winterwear Store", "transport": "Take Harbin Metro Line 2 to Ice and Snow World Station (Exit 2), leading directly into the Visitor Service Center."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Inside Ice and Snow World Park, Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.8 stars | Must-buy list: Ice castle snow globes, ice sculpture-shaped popsicles, and Ice and Snow World limited-edition 3D wooden puzzles. This is the most distinctive official souvenir shop inside the park, specializing in exclusive ice-and-snow-themed cultural products. After viewing the breathtaking ice sculptures, visitors love shopping here for exquisite winter souvenirs that are unique and highly collectible.", "name": "Harbin Ice and Snow World Cultural \u0026 Creative Flagship Store", "transport": "Take Metro Line 2 to \u0027Ice and Snow World Station\u0027, Exit 3, and walk to arrive."}, {"address": "Inside Russian Style Town, No. 1 Pingyuan Street, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-painted Matryoshka nesting dolls, Russian dark chocolate, and lacquer jewelry boxes. Located inside the Russian Style Town on Sun Island, this store exudes exotic charm. It features authentic imported Russian handicrafts and classic snacks, making it a top choice for travelers looking for gifts infused with Harbin\u0027s unique historical culture.", "name": "Sun Island Russian Town Specialty \u0026 Cultural Souvenir Shop", "transport": "Take Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 1, and walk for about 10 minutes."}, {"address": "At the entrance of Sun Island Scenic Area, No. 1 Taiyang Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.7 stars | Must-buy list: Qiulin-Lidaos red sausage, fruit-flavored Kvass, and traditional Dalieba (large rye bread). Qiulin is a centuries-old heritage brand in Harbin. Located on Sun Island, this specialty shop offers authentic Harbin flavors. The classic garlic red sausage is fruitwood-smoked with a rich aroma, while the fermented Kvass drink is delightfully sweet, tangy, and refreshing\u2014a must-buy souvenir stock for every traveler.", "name": "Qiulin-Lidaos Sun Island Specialty Shop", "transport": "Take Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 2, and walk for about 5 minutes."}, {"address": "Near the intersection of Songbei Avenue and Bingxue Road, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | Must-buy list: Lao Ding Feng Chuan Su mooncakes, hawthorn crispy shortbread (Guokui), and Changbai Mountain ginseng cake. Lao Ding Feng is a famous Time-Honored Brand pastry shop with nearly a century of history. Adhering to traditional hand-crafting methods, its pastries are flaky, light, and perfectly sweetened. Located near Sun Island attractions, this branch offers several beautifully designed gift sets, popular among visitors who love traditional Chinese pastries and authentic Northeastern snacks.", "name": "Lao Ding Feng Pastry Sun Island Shop", "transport": "Take Metro Line 2 to \u0027Ice and Snow World Station\u0027, then transfer to a shuttle bus or taxi for about 5 minutes."}, {"address": "Inside Polarland, No. 3 Taiyang Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.7 stars | Must-buy list: Taotao Penguin plush toys, 3D polar ocean animal fridge magnets, and beluga whale vacuum flasks. Located near Sun Island, the wildly popular Harbin Polarland features a flagship souvenir shop centered around adorable polar animals. The signature \u0027Taotao Penguin\u0027 merchandise is soft, cute, and exceptionally crafted, making it a favorite shopping stop for families and young travelers.", "name": "Harbin Polarland Cultural \u0026 Creative Flagship Store", "transport": "Take Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 1, and walk for about 8 minutes."}, {"address": "Next to the Tourist Center, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.4 stars | Must-buy list: Russian purple-wrapped crunch candies, classic Tiramisu honey cake, and mini Russian vodka gift sets. Gathering a vast array of authentic imported Russian snacks and groceries, this store offers reasonable prices and incredible variety. The famous purple-wrapped peanut candies and layered Russian honey cake are massive hits, allowing you to stock up on authentic Russian delicacies without stepping out of China.", "name": "Sun Island Russian Goods Supermarket", "transport": "Take Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 2, and walk for about 3 minutes."}, {"address": "Next to Sun Island Riverside Park, Jiangpan Road, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | Must-buy list: Ice crystal glass cups, Harbin landmark paper-cut light boxes, and snowflake metal bookmarks. Situated on the north bank of the Songhua River near Sun Island Park, this shop combines Harbin\u0027s ice-and-snow culture with the charm of the Songhua River basin. The souvenirs are elegant and stylish, integrating ice motifs and European architecture into everyday items\u2014a perfect spot for artistic and culturally meaningful gifts.", "name": "Songhua River Ice \u0026 Snow Cultural Gift Shop", "transport": "Take the Songhua River Cableway to Sun Island Station, and walk for about 5 minutes."}, {"address": "Inside Harbin Grand Theatre, No. 1 Wenhua Zhongxin 1st Road, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Must-buy list: Grand Theatre architectural wooden models, snowland music boxes, and \u0027City of Music\u0027 limited-edition herbal tea gift sets. The Harbin Grand Theatre, a famous landmark in the eastern water system of Sun Island, houses a souvenir shop that blends the city\u0027s musical heritage with its snowy charm. Visitors frequently stop by to pick up artistic, beautifully designed gifts filled with cultural depth.", "name": "Harbin Grand Theatre Cultural Souvenir Shop", "transport": "Take Bus 35 or 122 to \u0027Harbin Grand Theatre Station\u0027 and walk to arrive."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 888 Limin Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.7 Stars | Must-Buys: Discounted last-season Nike sneakers, COACH designer bags, Bosideng warm down jackets. A mega outlet center located in Songbei District, featuring hundreds of top international luxury brands and first-tier Chinese fashion labels. Offering incredible discounts year-round, it is the premier outlet destination in Harbin for acquiring high-value designer goods and extreme-cold winter gear.", "name": "Shanshan Outlet Plaza Harbin", "transport": "Take Metro Line 2 to Nanjing Road Station, then transfer to Bus 213 to reach the destination."}, {"address": "No. 99 Shimao Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.6 Stars | Must-Buys: Harbin limited-edition cultural \u0026 creative mugs, Northeast hazelnut gift boxes, professional outdoor skiing gloves. Adjacent to the famous Sunac Snow Park, this is a massive integrated shopping mall in Songbei District. Alongside international fast-fashion brands, it features numerous counters offering Heilongjiang local cultural creative items and outdoor sports apparel.", "name": "Harbin Sunac Mall", "transport": "Take Metro Line 2 to Shimao Avenue Station and walk for about 5 minutes."}, {"address": "Intersection of Shimao Avenue and Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.4 Stars | Must-Buys: Northeast black bee honey, Harbin Beer collaboration T-shirts, Russian-style rose gold (Zijin) jewelry. A core commercial landmark in Songbei District featuring a spacious and bright shopping environment. The mall includes dedicated exhibition and sales areas for Northeast and Russian cultural products, making it perfect for one-stop shopping, dining, and leisure.", "name": "Songbei Wanda Plaza", "transport": "Take Metro Line 2 directly to Shimao Avenue Station."}, {"address": "Next to Sun Stone Square, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.8 Stars | Must-Buys: Qiulin Red Sausage (Lidaosi), Russian-style Dalieba bread, Qiulin Kvass fermented drink. A highly iconic centuries-old brand in Heilongjiang, specializing in traditional fruitwood-smoked classic red sausages and authentic Russian bread. It is a must-visit flagship store for local specialties after exploring Sun Island Park.", "name": "Qiulin Food Sun Island Store", "transport": "Take Metro Line 2 to Sun Island Station and walk for about 3 minutes."}, {"address": "Inside Sun Town, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.5 Stars | Must-Buys: Intangible cultural heritage handmade birch bark paintings, handmade Russian Matryoshka dolls, Russian dark chocolate. An independent local craft shop located on Sun Island, preserving the Heilongjiang intangible cultural heritage technique of \u0027birch bark painting\u0027 while selling exquisite Russian-style handmade wooden crafts with rich regional characteristics.", "name": "Sun Island Birch Bark Art \u0026 Russian Craft Workshop", "transport": "Take the Sun Island Scenic Area sightseeing shuttle or walk from Metro Sun Island Station."}, {"address": "No. 120 Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.3 Stars | Must-Buys: Wild Changbai Mountain Korean pine nuts, linden honey black fungus, ginseng wellness tea gift boxes. A highly reputed local specialty shop in Songbei focusing on premium Northeastern mountain delicacies and agricultural products. Known for strict quality control and transparent pricing, it is a favorite among tourists.", "name": "Heilongjiang Specialty Songbei Flagship Store", "transport": "Take Bus 80 or 119 to Songbei Avenue Station and walk for about 2 minutes."}, {"address": "Zone B, Perimeter Commercial Area, Harbin Ice and Snow World, Songbei District, Harbin City", "feature": "\u2b50 4.4 Stars | Must-Buys: Ice and Snow World snow globe fridge magnets, handmade Northeastern Lei Feng hats, snowflake-themed scented candles. An independent original lifestyle shop located around the Ice and Snow World area, focusing on tasteful items that combine Harbin\u0027s ice and snow elements with Northeastern folk customs. Rich in design and sentimental value.", "name": "Northern Scenery Snow Culture \u0026 Lifestyle Shop", "transport": "Take Metro Line 2 to Ice and Snow World Station and walk for about 6 minutes."}, {"address": "No. 238 Shimao Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.5 Stars | Must-Buys: Northeastern-style faux mink thermal hats, polar extra-thick goose down jackets, warm cashmere scarves. A well-known local independent store for winter apparel, tailored for the severe Northeastern cold. It offers high-quality fur hats, high-spec down jackets, and winter accessories infused with northern fashion styles.", "name": "Harbin Songbei Fur \u0026 Winter Wear Store", "transport": "Take Metro Line 2 to Shimao Avenue Station, then transfer to Bus 125 to Shimao Avenue West Station."}], "name": "Major Shopping Malls \u0026 Recommended Outlets"}}, "name": "Sun Island and Ice and Snow World"}, "volgar_manor": {"categories": {"cat_1": {"items": [{"address": "Commercial Street near St. Nicholas Church, Volga Manor Scenic Area, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Granny Agafia Russian Herbal Face Masks, Siberian Sea Buckthorn Hand Cream, Russian Purple Gold Rose Essence Oil. Located inside the scenic Volga Manor, this specialty boutique focuses on imported beauty products made from Russian polar plants. The local Siberian sea buckthorn hand cream is rich in vitamins with a non-greasy, deeply moisturizing texture\u2014perfect for northern dry climates. Granny Agafia\u0027s herbal face masks are budget-friendly favorites that tourists stock up on, and the store staff provides helpful bilingual service.", "name": "Volga Russian Style Beauty Boutique", "transport": "Take the direct shuttle bus from downtown Harbin to Volga Manor, or take Bus 377 from downtown to Chenggaozi Town and transfer to a dedicated minibus."}, {"address": "East side of the entrance gate tower of Volga Manor, Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Hayao High-Purity Hyaluronic Acid Serum, Eleuthero (Acanthopanax) Antioxidant Emulsion, Haslea Peptide Firming Eye Cream. Established by the time-honored Harbin pharmaceutical company \u0027Hayao Group\u0027, this cosmeceuticals shop combines authentic Heilongjiang herbs with high-tech extraction technology. Its Eleuthero and Haslea skincare series are unique local holy-grail items that effectively combat cold weather and skin aging, making them trusted choices for locals and tourists alike.", "name": "Hayao Group Direct Cosmeceuticals Flagship (Manor Avenue Store)", "transport": "Driving or taking a taxi to the main entrance of Volga Manor is recommended; the store is easily visible upon arrival."}, {"address": "Shops next to Jinhuan Western Restaurant, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Birch Sap Hydrating Mist, Siberian Pine Needle Repair Hand Cream, Wild Sea Buckthorn Facial Serum. This unique store focuses on skincare products made from birch sap harvested from Russian and Northeast Asian cold regions. Rich in minerals and amino acids, birch sap rapidly replenishes skin moisture. Blending traditional Slavic herbal remedies with modern cosmetics, the store features cozy Russian wooden cabin decor for a delightful shopping experience.", "name": "Slavic Birch Sap \u0026 Herbal Beauty Pavilion", "transport": "Located inside the Volga Manor scenic area; accessible on foot after entering the park."}, {"address": "No. 168 Zhuangyuan Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Wild Ginseng Radiance Face Mask, Northeast Rhodiola Whitening Cream, Schisandra Soothing Repair Spray. Longyaotang is a premier Heilongjiang brand promoting traditional \u0027Northern TCM\u0027 specialties. This branch specializes in medical-grade cosmeceuticals developed from Northeast Treasures (ginseng and antler extracts) and cold-climate Chinese herbs. Rhodiola and Schisandra extracts effectively soothe sensitive skin and fight photoaging, making these items ideal local souvenir gifts.", "name": "Longyaotang Northern TCM Cosmeceuticals Shop", "transport": "Take a taxi or manor shuttle bus to the main street of Chenggaozi Town."}, {"address": "Shop No. 3, Russian Folk Culture Village, Volga Manor, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Russian Black Birch Herbal Cleanser, Natural Lip Balm, Russian Honey Oatmeal Body Scrub. A boutique directly operated by Sino-Russian traders, with all products imported straight from Far East Russia. The Russian black birch facial cleanser cleans thoroughly without feeling tight, while the natural beeswax lip balms are wallet-friendly and incredibly effective\u2014a must-buy affordable souvenir when visiting Volga Manor.", "name": "Purple Gold Katya Russian Cosmetics House", "transport": "Accessible on foot within the Folk Culture Exhibition Area inside Volga Manor."}, {"address": "Pavlov Castle Experience Area, Volga Manor, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: High-Purity Haslea Collagen Cream, Northern Wild Blueberry Antioxidant Mask, Herbal Antler Nourishing Night Cream. This specialty skincare pavilion highlights extracts from the rich ecological resources of the Changbai and Lesser Khingan Mountains. The Haslea collagen face cream offers powerful moisturizing and repairing qualities loved by those with dry skin, while the blueberry antioxidant mask utilizes wild Heilongjiang blueberries rich in anthocyanins to noticeably brighten skin tone.", "name": "Volga Birch Forest Haslea Herbal Skincare Pavilion", "transport": "Located inside the castle zone of the scenic area; easy to visit while touring Pavlov Castle."}, {"address": "Next to Pushkin Salon, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Altai Herbal Repair Ointment, Russian Irish Moss Hydrating Serum, Siberian Fir Essential Oil Soap. Introducing organic cosmeceutical brands from the pristine ecosystems of Russia\u0027s Altai Mountains, free from artificial fragrances and preservatives. The Altai Herbal Repair Ointment works wonders for chapped skin and bug bites, earning it the nickname \u0027Russian Cure-All Ointment\u0027, while the fir essential oil soap exudes a rich Siberian forest aroma that leaves skin feeling refreshed.", "name": "Russian Altai Pure Herbal Cosmeceuticals", "transport": "A 5-minute walk within the Cultural Zone inside Volga Manor."}, {"address": "1st Floor, Windmill Hotel Shopping Gallery, Volga Manor, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Frigid Pine Nut Nourishing Essence Oil, Birch Bark Antibacterial Handmade Soap, Wild Sea Buckthorn Lip Balm. A boutique shop curating high-cold botanical skincare from both Heilongjiang and Russia. Its exclusive pine nut nourishing oil is packed with unsaturated fatty acids to lock in moisture, serving as a winter shield against harsh northern winds. The handmade birch bark soap features a charming rustic aesthetic that makes it both practical and visually pleasing.", "name": "Frigid Botanical Beauty Selects (Volga Shopping Street)", "transport": "Located on the 1st floor shopping street of the Manor Hotel; convenient for both hotel guests and visitors."}], "name": "Local Iconic Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "Inside Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional embroidered Russian blouses (Rubakha), handmade wool shawls, and traditional folk headdresses (Kokoshnik). Located in the heart of Volga Manor, this boutique specializes in clothing and accessories with rich Eastern European flair. In addition to offering costume rentals for photos, it sells exquisite garments designed in collaboration with native Russian artisans and local master tailors, making it a favorite among visitors obsessed with Russian aesthetics.", "name": "Volga Russian Costume \u0026 Fashion Boutique", "transport": "Recommended to take the direct Volga Manor shuttle bus or drive yourself; reachable on foot via the main manor pathway."}, {"address": "Next to the St. Nicholas Church Art Gallery, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.6 stars | Must-Buy List: Russian Orenburg goat down shawls, cozy Northeast rex rabbit fur hats, and handmade fur crossbody bags. Located near the reconstructed St. Nicholas Church, this shop is renowned for its high-quality winter warming accessories. The highlight is the authentic Orenburg hand-knitted lace shawls\u2014feather-light yet exceptionally warm\u2014making them an iconic high-end fashion souvenir from Harbin.", "name": "St. Nicholas Handwoven Shawls \u0026 Fur Shop", "transport": "Reachable on foot within the manor, or take the scenic shuttle cart and get off at St. Nicholas Church Station."}, {"address": "Inside Pavlov Castle, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage handmade genuine leather tote bags, Russian emblem embossed wallets, and hand-stitched thermal suede boots. Situated on the 1st floor of Pavlov Castle, this independent design shop blends classic Russian craftsmanship with local Northeast leather goods. The owner emphasizes 100% hand-stitching, giving the leather products a rich vintage texture and authentic leather scent\u2014extremely durable and highly collectible.", "name": "Pavlov Castle Handmade Leather \u0026 Bags Workshop", "transport": "Walk to the Pavlov Castle complex within the manor."}, {"address": "Near the Ash River Boat Dock, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Russian felt boots (Valenki), heavy-duty anti-slip snow boots, and genuine leather ear-flap hats (Ushanka). Located near the Ash River scenic area, this store caters specifically to extreme winter cold. They offer modernized traditional Russian felted wool boots that are both stylish and ultra-warm\u2014a favorite winter gear spot for locals and tourists exploring Volga Manor.", "name": "Ash River Russian Winter Footwear \u0026 Hats Store", "transport": "Walk to the Ash River dock area within the manor."}, {"address": "Pushkin Salon Area, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Russian linen dresses, plant-dyed linen scarves, and hand-embroidered linen tote bags. Located beside the Pushkin Salon Exhibition Hall, this shop features clothing and handbags crafted from high-quality natural Russian linen. Breathable, comfortable, and gentle on the skin, the designs blend classic Russian motifs with modern minimalist cuts, attracting many female shoppers who love a natural aesthetic.", "name": "Pushkin Salon Russian Linen Clothing Store", "transport": "Walk to the Pushkin Salon Exhibition Hall within the manor."}, {"address": "Folk Culture Workshop Street, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade tribal-embroidered canvas bags, Russian floral pattern ankle boots, and delicate drawstring embroidered pouches. Located in the Folk Culture Experience Zone of Volga Manor, this artisanal shop specializes in traditionally embroidered footwear and accessories. Combining Northeast Chinese paper-cut patterns with Russian floral embroidery, it creates unique, cultural bags and cloth shoes with an independent, creative flair.", "name": "Volga Art Workshop Ethno Embroidered Shoes \u0026 Bags", "transport": "Walk to the Folk Culture Experience Zone within the manor."}, {"address": "Inside Three Bears Park, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 stars | Must-Buy List: Matryoshka doll print matching family hoodies, playful bear-shaped plush backpacks, and kids\u0027 cold-weather down jackets. Located inside the popular Three Bears Park within the manor, this specialty boutique is tailor-made for families. Packed with cute Russian fairytale-inspired clothes and fun whimsical backpacks, it offers excellent quality and memorable keepsakes that kids and parents love.", "name": "Three Bears Park Family Apparel \u0026 Bags", "transport": "Walk or take the manor shuttle bus directly to Three Bears Park."}, {"address": "No. 38 Main Street, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.2 stars | Must-Buy List: Extra-thick genuine fur gloves, locally made Harbin tall snow boots, and vintage windproof earmuffs. Located in Chenggaozi Town near Volga Manor, this budget-friendly shop comes highly recommended by locals and savvy travelers. Specializing in traditional Northeastern extreme-cold apparel and handcrafted warm boots and bags, it offers competitive prices, solid heavy-duty insulation, and a warm, authentic local atmosphere.", "name": "Chenggaozi Northeast Fur Shoes \u0026 Apparel Shop", "transport": "About 3 km from the main gate of Volga Manor; take Bus 377 to Chenggaozi Town Station, then walk a short distance."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Next to the Visitor Center, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional Russian Matryoshka nesting dolls, hand-painted lacquer wooden boxes, Baltic amber jewelry. Located at the heart of the manor, this store specializes in crafts directly imported from Russia as well as exclusive manor-authorized items. Designed with the involvement of local Russian artisans, each nesting doll features unique hand-painted details, making them highly collectible.", "name": "Volga Manor Russian Craft Store", "transport": "It is recommended to take the scenic area shuttle bus or drive directly to Volga Manor; reachable on foot after entering the park."}, {"address": "1st Floor, Vodka Castle, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Custom Volga Manor vodka, Russian carved crystal glassware, miniature ice wine gift sets. Situated inside the manor\u0027s iconic Vodka Castle, this shop offers a variety of high-purity Russian vodkas and exquisite drinkware. After enjoying vodka served in ice glasses, visitors often buy the limited-edition castle-branded vodka here as a premium souvenir.", "name": "Vodka Castle Specialty Shop", "transport": "Walk to the Vodka Castle within the park, or take the scenic electric shuttle car."}, {"address": "Next to St. Nicholas Church, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Wooden architectural models of St. Nicholas Church, Orthodox-style vintage metal bookmarks, hand-drawn manor scenery postcards. Set against the 1:1 replica of the St. Nicholas Art Museum, this shop exudes a rich historical and artistic ambience. It specializes in cultural creative products related to Harbin\u0027s architectural history, making it a top pick for art lovers and architecture enthusiasts.", "name": "St. Nicholas Church Cultural Souvenir Shop", "transport": "Walk to the St. Nicholas Art Museum area within the park."}, {"address": "1st Floor, Pavlov Castle, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Authentic Russian Lieba bread, Churin Red Line sausage gift sets, Russian honey gingerbread. Located inside Pavlov Castle, this bakery bakes traditional wood-fired Lieba bread fresh on-site, filling the air with enticing aromas. The wood-fired Lieba bread\u2014crispy on the outside, soft on the inside\u2014paired with local Northeast red sausage is an unmissable classic gift from Volga Manor.", "name": "Pavlov Castle Russian Bakery \u0026 Snack Shop", "transport": "Walk to the Pavlov Castle area within the park."}, {"address": "Three Bears Park Area, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-carved wooden bears, traditional Russian children\u0027s headscarves, fairy-tale picture books. Located in the whimsical Three Bears Park, the shop is styled like a cozy Russian countryside cottage. It offers family- and child-friendly Russian folk toys and handmade wood carvings full of charming rustic character.", "name": "Three Bears Park Folk Craft Shop", "transport": "Take the electric shuttle car or walk to Three Bears Park within the park."}, {"address": "Petrov Art Palace, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Russian oil painting print replicas, handmade Russian enamel jewelry boxes, limited-edition manor oil-painting style canvas bags. Displaying numerous artworks from Ilya Repin St. Petersburg State Academic Institute painters, the Petrov Art Palace features a gift shop offering high-quality art derivatives\u2014the perfect choice to bring home the manor\u0027s rich artistic atmosphere.", "name": "Petrov Art Palace Gallery \u0026 Gifts", "transport": "Walk to the Petrov Art Palace within the park."}, {"address": "1st Floor, Miniature Restaurant, Volga Manor, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian purple-skin peanut candy, traditional fermented Kvass, canned black caviar spread. Located next to the replica Miniature Restaurant, this shop brings together popular imported Russian snacks and high-end ingredients. Visitors can pick up unique Russian tea treats and gourmet condiments all in one place.", "name": "Minature Russian Gourmet Shop", "transport": "Walk to the Miniature Restaurant area within the park."}, {"address": "Exit Vendor Area, Volga Manor Exit, No. 168 Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Northeast wild blueberry jam, Russian hazelnut milk chocolate bars, Russian jacquard warm wool shawls. Combining local forest specialties from Heilongjiang with Russian products, this store offers a wide variety of casual snacks and warm textiles. Its natural, additive-free wild blueberry products are a big hit among health-conscious travelers.", "name": "Volga Forest Local Specialty Store", "transport": "Located right at the park exit, accessible on foot."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Inside Volga Manor Scenic Area, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-painted Matryoshka dolls, Russian dark chocolate, and barley Kvass beverage. Located in the core area of Volga Manor, this shopping mall completely recreates the classical Russian architectural style of the historic Harbin Moscow Shopping Mall. The interior specializes in authentic imported Russian goods and manor-exclusive creative products, making it a must-visit shopping spot when visiting the manor.", "name": "Volga Manor Moscow Shopping Mall", "transport": "Take the Volga Manor direct bus or tourist line bus directly, or take a taxi from downtown Harbin for about 45 minutes"}, {"address": "No. 2288 Nanjing Road, Limin Development Zone, Hulan District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-buy list: Coach classic monogram bags, Bosideng high-end down jackets, and discounted Adidas sneakers. One of the most representative large European-style shopping villages in Harbin, featuring hundreds of internationally famous and top-tier domestic brands. In addition to offering attractive year-round deep discounts, it combines a large indoor glass dome design unique to the Northeast, allowing visitors to comfortably shop for discounted designer brands even during snowy winter days.", "name": "Shanshan Outlet Plaza Harbin", "transport": "Take Metro Line 2 to Jiangbei University Town Station, then transfer to a shuttle bus or taxi for about 10 minutes"}, {"address": "No. 168 Zhigu Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-buy list: NIKE casual jackets, original Russian chocolate gift boxes, and polar cold-proof snow boots. A large shopping village themed around Italian town architecture, with exotic garden landscapes throughout the complex. In addition to major international sports and fashion brands offering 50%\u201370% off year-round, the village also houses flagship stores for Harbin local specialties and Russian goods, making it an excellent choice for enjoying a romantic atmosphere and stocking up on unique souvenirs all at once.", "name": "Maple Town Outlet Harbin", "transport": "Take Bus 145 or 146 and get off at Maple Town Station"}, {"address": "No. 480 Gongbin Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-buy list: Churin Red Sausage, Churin Dalieba (Russian sourdough bread), and Churin Kvass. Churin Department Store is a century-old local iconic department store brand in Harbin, originating from a Russian merchant association founded in 1900. The Xiangfang branch perfectly inherits the daily shopping memories of old Harbin residents. The underground food street is packed daily with crowds buying authentic red sausage and Russian-style bread, making it the top choice for experiencing local life and purchasing the most authentic souvenirs.", "name": "Churin Department Store Xiangfang Branch", "transport": "Take Metro Line 3 to Gongbin Road Station, exit and walk about 3 minutes"}, {"address": "Next to St. Nicholas Cultural and Art Center inside Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-buy list: DIY hand-painted wooden Matryoshka dolls, linden wood carved handicrafts, and Russian tin-canned tea. This is a unique independent shop combining traditional Russian craft DIY and local souvenir sales, located next to Saint Nicholas Church in Volga Manor. Visitors can not only buy limited-edition nesting dolls hand-painted by local artists, but also experience the joy of painting their own dolls, making for a highly memorable keepsake.", "name": "Volga Manor Matryoshka Handcraft Workshop", "transport": "Accessible on foot within Volga Manor"}, {"address": "No. 55 Xiangfu Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-buy list: Northeast wild hazelnuts, local designer brand padded coats, and Russian purple gold jewelry. A large comprehensive shopping complex located in the heart of Xiangfang District, relatively close to Volga Manor, making it a favorite modern shopping landmark for local residents and tourists alike. The mall features many local Harbin fashion brands and specialty shops for Northeast mountain delicacies, offering more affordable prices than tourist attractions.", "name": "Xiangfang Yongtai City Shopping Center", "transport": "Take Bus 68 or 387 and get off at Yongtaicheng Station"}, {"address": "No. 68 Heping Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Must-buy list: Russian 585 purple gold rings, Baltic natural amber necklaces, and Russian painted lacquer boxes. An independent national chain boutique specializing in imported Russian jewelry and handicrafts, deeply rooted in the Harbin local market for years. The shop highlights authentic Russian purple gold (rose gold) jewelry and high-quality amber. Each item comes with a certificate of authenticity, offering excellent quality and a strong exotic flair.", "name": "Russian Purple Gold \u0026 Amber Shop", "transport": "Take Metro Line 2 to Heping Road Station, exit and walk about 5 minutes"}, {"address": "No. 8 Sandadongli Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-buy list: Northeast Korean pine nuts, traditional Harbin pastry gift boxes, and Russian vodka. Lesong Shopping Plaza is one of the most historic and popular classic shopping centers in Harbin\u0027s Xiangfang District, deeply loved by local residents. It gathers numerous stalls for local Northeast general merchandise, local fashion, and regional specialty food counters. Offering affordable prices and a complete selection, it is a great spot to buy budget-friendly Northeast dried fruits and local snacks.", "name": "Lesong Shopping Plaza Harbin", "transport": "Take Metro Line 3 to Xusheng Street Station and walk about 8 minutes"}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Volga Manor Scenic Area"}, "yabuli_resort": {"categories": {"cat_1": {"items": [{"address": "No. 1 Jinpai Avenue, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Granny Agafia Herbal Hand Cream, Russian Purple Gold Lip Balm, Teana Hyaluronic Acid Serum. Located in the core commercial district of Yabuli Ski Resort, this shop specializes in high-value imported Russian cosmetics and drugstore products. The top-selling hand cream is ultra-moisturizing, perfect for severely dry skin after a day of skiing, and loved by skiers and tourists alike.", "name": "Yabuli Zijinhua Russian Cosmetics Boutique", "transport": "Take the free internal shuttle bus in Yabuli Resort and get off at the Resort Commercial Street Stop."}, {"address": "Zone B, Windmill Village Commercial Area, Yabuli Ski Resort, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Ginseng Nourishing Repair Cream, Velvet Antler Lip Balm, Changbai Mountain Snow Lotus Anti-Frostbite Ointment. An iconic local drugstore combining precious traditional Northeastern Chinese herbal ingredients with modern skincare technology. Their signature Ginseng Cream effectively soothes dryness and redness caused by cold wind exposure, making it a must-have souvenir from Yabuli.", "name": "Northeast Sanbao \u0026 Herbal Pharmacy (Yabuli Branch)", "transport": "About a 5-minute walk from the Yabuli Ski Resort Tourist Center."}, {"address": "1st Floor, Main Hall, Sun Mountain Ski Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Intensive Anti-Frostbite Repair Balm, Polar Ultra-Moisturizing Horse Oil Cream, High-SPF Cold-Resistant Lotion. A skincare shop specially tailored for the extreme cold of the ski resort, highly recommended by local ski instructors and veteran skiers. In temperatures dropping below -20\u00b0C, their anti-frostbite balm and deeply moisturizing horse oil effectively lock in moisture and shield your face from severe windburn.", "name": "Yabuli Cold Protection \u0026 Skincare Specialty Shop", "transport": "Located inside the Sun Mountain Ski Resort service hall; skiers can walk straight in to shop."}, {"address": "No. 15 Qingyun Town Commercial Street, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Natura Siberica Birch Repair Cream, Russian Sea Buckthorn Ultra-Hydrating Body Lotion, Russian Vintage Essential Oil Soap. A charming Russian-themed specialty store offering imported natural and organic drugstore brands. Featuring polar botanical extracts with pure ingredients, these products work wonders against the harsh, dry weather of the Northeast.", "name": "Slav Russian Imports Cosmetics Hall (Yabuli)", "transport": "Take a Yabuli resort taxi or private vehicle to Qingyun Town Commercial Street."}, {"address": "1st Floor, Commercial Center, Yabuli Sun Mountain Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Polar Lip Repair Oil, Soothing Repair Spray, Pharmaceutical-Grade Deep Moisturizing Cream. A convenient shop located inside Sun Mountain Resort providing emergency skincare and basic pharmaceuticals during the ski season. Friendly staff offer post-ski skin-soothing advice, and their lip repair oil is an absolute essential for skiers.", "name": "Yabuli Sun Mountain Resort Pharmacy \u0026 Beauty", "transport": "Guests staying at Sun Mountain Resort Hotel can walk directly via the connecting walkway, or take the resort shuttle bus to Sun Mountain Hotel."}, {"address": "Next to West District Tourist Service Center, Yabuli Ski Resort, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian Carrot Whitening \u0026 Hydrating Cream, Milk \u0026 Honey Bubble Bath, High-Purity Vitamin E Skincare Oil. Featuring a wide selection of popular budget-friendly Russian drugstore products, this store is a favorite among female tourists. The carrot cream is lightweight yet deeply hydrating, incredibly affordable with amazing results\u2014a top pick for bulk shopping!", "name": "Global Select Russian Pharmacy \u0026 Lifestyle (Yabuli)", "transport": "Take the ski resort loop shuttle bus and get off at the West District Service Center Stop."}, {"address": "No. 88 Zhanqian Street, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Herbal Hydrating Vanishing Cream, Ginseng Anti-Wrinkle Eye Cream, Chinese Herbal Soothing Foot Bath Bags. A long-standing local pharmacy combining traditional Chinese medicine with modern beauty care. Their self-developed herbal vanishing cream carries a subtle herbal scent, perfect for foot soaking and full-body nourishment after a day on the slopes.", "name": "Yabuli Town Tongrentang \u0026 Northeast Medicinal Herbs", "transport": "Take a bus or taxi for about 10 minutes from Yabuli High-Speed Railway Station (Yabuli West Station) to Zhanqian Street, Yabuli Town."}, {"address": "No. 28 Xuexiang Road, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: St. Petersburg Limited Edition Rose Essential Oil Balm, Russian Black Caviar Anti-Aging Mask, Windburn \u0026 Anti-Frostbite Lotion. Specializing in high-quality Russian cosmetics directly from St. Petersburg, renowned for natural ingredients and exceptional moisture-locking protection. Knowledgeable staff can recommend creams and masks best suited for extreme cold climates.", "name": "St. Petersburg Russian Beauty Direct Shop (Yabuli)", "transport": "Take the internal resort shuttle bus to Xuexiang Road Stop; walk 2 minutes after getting off to spot the prominent sign."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "No. 1 Huaxuechang Street, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Benliu Co-branded Windproof Ski Suit, Extra-Thick Thermal Ski Gloves, Spine Protection Safety Backpack. One of the oldest local ski equipment shops in Yabuli, specifically designed for Northeast China\u0027s extreme cold weather. The fabrics offer excellent windproof and waterproof properties with stylish designs and unbeatable value for money, making it a favorite among ski enthusiasts nationwide and local instructors.", "name": "Benliu Extreme Ski \u0026 Snowboard Shop", "transport": "Recommended to drive or take the resort\u0027s free shuttle bus and get off next to the main building of Yabuli Ski Resort."}, {"address": "No. 18 Jinxi Road, Resort Zone, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Heilong Brand Professional Ski Suit, High-Elasticity Thermal Base Layer, Professional Waterproof Snow Boots. Heilong is a time-honored local sports brand in Heilongjiang with decades of history. Its winter apparel is engineered specifically for ultra-low temperatures with ergonomic tailoring, making it the top choice for experiencing authentic Heilongjiang-made gear.", "name": "Heilong Ski Gear \u0026 Apparel Shop", "transport": "Take the high-speed rail to Yabuli West Station, then transfer to a taxi for about 15 minutes to arrive."}, {"address": "Zone A, Windmill Village Commercial Street, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Russian-Style Mink Coat, Handcrafted Warm Wool Hat, Genuine Leather Anti-Slip Gloves. Blending Harbin\u0027s traditional Russian charm, this fur and leather boutique offers high-quality local and imported leather apparel. Exceptionally soft and intensely warm, it is the ultimate luxury fashion choice for authentic Harbin style in extreme cold weather.", "name": "Yabuli Russian Style Fur \u0026 Leather Apparel", "transport": "Located within the Windmill Village Pedestrian Street, a 5-minute walk from the resort\u0027s core area."}, {"address": "No. 35 Commercial Street, Qingyun Town, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Red \u0026 Green Floral Padded Jacket, Northeast-Style Lei Feng Trapper Hat, Retro Floral Crossbody Cloth Bag. A unique clothing store showcasing local Dongbei folk culture. Crafted with traditional thick cotton, their vibrant floral padded jackets are visually striking, highly photo-worthy, and exceptionally warm\u2014making them a fun, must-buy souvenir for tourists.", "name": "Dongbei Flower Padded Jacket Experience Store", "transport": "Located in the Qingyun Town commercial area; take the town\u0027s sightseeing mini-train and get off at Qingyun Station."}, {"address": "No. 12 Sanguo Kuihua Avenue, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-Buy List: High-Grip Anti-Slip Snow Boots, Wool Cold-Proof Insoles, Waterproof Large-Capacity Outdoor Backpack. Specializing in foot warmth and pack gear for extreme snow conditions. The snow boots feature natural wool linings and thick anti-slip rubber outsoles, perfectly equipped for Yabuli\u0027s icy paths at -30\u00b0C.", "name": "Polarproof Snow Boots \u0026 Outdoor Gear", "transport": "Take the resort shuttle bus to the Ski Service Center Station, then walk about 200 meters."}, {"address": "2nd Floor Commercial Area, Ski Hall, Yabuli Sun Mountain Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Hot Snow Miracle Lightweight Down Jacket, Professional Waterproof Shell Jacket, Reflective Night-Skiing Crossbody Bag. A chain outdoor apparel shop blending modern trends with professional sports functionality. Extremely popular among young skiers, its down jackets feature high-loft down that is lightweight yet intensely warm, with eye-catching color schemes.", "name": "Hot Snow Miracle Outdoor Apparel Store", "transport": "Located inside the Ski Hall of Sun Mountain Resort; directly accessible from within the ski area."}, {"address": "1st Floor Shops, Yunding Hotel, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Pure Cashmere Knitted Scarf, Shearling Leather Gloves, Classic Vintage Cowhide Travel Bag. An independent boutique specializing in high-end Northeastern cashmere and leather products. All items feature high-purity natural materials with a soft, delicate touch. Their scarves and gloves make perfect winter gifts or personal treats.", "name": "Snowfield Hunter Cashmere \u0026 Leather Shop", "transport": "Take the Yabuli Resort Loop Bus and get off at Yunding Hotel Station."}, {"address": "No. 2 Pedestrian Street, Sunshine Town, Yabuli, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Guochao Co-Branded Ski Hoodie, Waterproof Drawstring Fanny Pack, Stylish Beanie Cold-Proof Hat. Founded by veteran local skiers, this trendy select shop stocks a wide variety of outdoor ski wear and stylish bags/shoes from independent Chinese designers. Offering unique styles that stand out, it is highly recommended by trendy youth.", "name": "Mountain Geek Snowboard \u0026 Apparel Boutique", "transport": "Located in the core pedestrian street of Sunshine Town; take a 5-minute shuttle bus ride from Yabuli South Railway Station."}], "name": "Popular Local Apparel, Footwear \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 1 Shangwu Street, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Must-buy list: Wild black fungus, top-grade hazel mushrooms, dried wild blueberries. Located in the core of the Yabuli Resort, this specialty store is the top choice for visitors seeking mountain delicacies from the Changbai and Lesser Khingan Mountains. All dried goods are naturally sun-dried by local farmers after harvesting. The black fungus is small, thick, and wonderfully textured, while the hazel mushrooms are the soul ingredient for the classic Northeastern dish \u0027Braised Mushrooms\u0027. The shop offers free vacuum-sealing services, making items perfect for packing and bringing back home.", "name": "Yabuli Mountain Specialty Store", "transport": "Take the Yabuli Resort internal shuttle bus to Shangwu Street Station, then walk about 100 meters."}, {"address": "Next to the Visitor Center, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Must-buy list: Qiulin red sausage, Kvass fermented bread drink, nut-stuffed Dalieba (Russian bread). This officially authorized shop of the century-old brand Qiulin Redos serves fruitwood-smoked red sausages bursting with garlic and smoky aromas, offering a firm and juicy bite. They also sell classic Kvass fermented beverages and giant Dalieba bread. Restocked fresh daily, these items represent the ultimate food souvenirs of Harbin and Northeastern culinary culture.", "name": "Qiulin Redos Yabuli Specialty Shop", "transport": "Turn right at the exit of the Yabuli Ski Resort Visitor Center and walk for about 2 minutes."}, {"address": "Inside Windmill Village, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-buy list: Russian purple-wrapped krokant candies, Alyonka chocolates, Russian linden honey. Due to Yabuli\u0027s proximity to Russia, the resort area features many exotic Russian specialty shops. This store imports a vast array of authentic Russian snacks, including the highly popular purple-wrapped krokant candy\u2014known for its crunchy nut filling and rich chocolate coating. Perfect for buying in bulk by the box, items are beautifully packaged and very affordably priced.", "name": "Russian Style Specialty Souvenir Shop", "transport": "After entering the Windmill Village scenic area, walk to the commercial street on the east side of Windmill Square."}, {"address": "No. 88 Jinpai Avenue, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-buy list: Wild Korean pine nuts, snow-white linden honey, concentrated blueberry jam. Heilongjiang\u0027s Greater Khingan and Wandashan mountain ranges abound with wild blueberries and pine nuts, and this shop specializes in high-quality nut and jam products. The wild pine nuts are plump, rich in natural oils, and easy to crack open by hand; the linden snow honey has a crystalline snow-like texture that is sweetly subtle without being cloying, making it a highly nutritious local wellness souvenir.", "name": "Yabuli Blueberry \u0026 Pine Nut Shop", "transport": "Take a taxi from Yabuli South Railway Station; it takes about 8 minutes to arrive."}, {"address": "1st Floor, Sun Mountain Resort Building, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Must-buy list: Dried frozen pears/persimmons, Northeastern deer antler slices, ginseng lozenges. A comprehensive supermarket combining Northeastern frozen fruit specialties with valuable health tonics. Their specially crafted dried frozen pears transform the region\u0027s winter-exclusive frozen pears into portable dried snacks, perfectly preserving their sweet, tangy, and juicy flavor. Additionally, the shop offers fully compliant packaged deer antler and ginseng products, making it easy for skiers to purchase thoughtful health gifts for elders.", "name": "Yabuli Ice \u0026 Snow Local Specialty Supermarket", "transport": "Located inside the Sun Mountain Resort ski service hall; head directly here to shop after skiing."}, {"address": "Opposite the Resort Entrance Shuttle Station, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Must-buy list: Wuchang rice deluxe gift box, Shangzhi yew tea, wild lion\u0027s mane mushrooms. Directly operated by a local Shangzhi agricultural cooperative, this store highlights premium agricultural products nurtured by the region\u0027s fertile black soil. The iconic Wuchang rice is intensely aromatic and cooks up translucent and glossy, making it a highly praised souvenir. They also offer beautifully packaged wild lion\u0027s mane mushrooms and alpine specialty tea bags, all backed by official quality guarantees.", "name": "Shangzhi Black Soil Agricultural Products Store", "transport": "Take the town bus to the Yabuli Resort Entrance Station; it is located right opposite."}, {"address": "No. 16 Huandao Road, Ski Resort, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Must-buy list: Pine nut corn crisp, Heilongjiang hazelnuts, sea buckthorn juice drinks. This large-scale souvenir distribution market boasts an incredibly rich variety of products. The crowd favorite is the Pine Nut Corn Crisp, combining local Northeastern corn and pine nuts into a crunchy, non-sticky snack. The sea buckthorn juice is rich in Vitamin C, wonderfully sweet and tangy, allowing visitors to conveniently buy all the Northeastern specialty snacks needed for friends and family in one stop.", "name": "Yabuli Specialty Products Distribution Center", "transport": "Take the resort\u0027s free loop shuttle bus and get off at Huandao Road Station."}, {"address": "No. 25 Commercial Street, Qingyun Town, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Must-buy list: Canned Russian pickles, Northeastern black bee honey, raisin Sachima. Located in Qingyun Town, this charming shop ingeniously combines traditional Russian pickled foods with local Northeastern specialties. The Russian-style pickled cucumbers are amazing for cutting through the richness of heavy meat dishes, while the black bee honey is sourced from nature reserves and boasts a unique floral fragrance. The friendly shopkeeper offers free samples so customers can buy with total confidence.", "name": "Russian Food \u0026 Northeast Delicacies Boutique", "transport": "Walk straight for about 300 meters from the pedestrian street entrance of Qingyun Town."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Inside Yabuli Ski Resort, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Professional windproof ski goggles, Yabuli snowflake commemorative badges, and Northeast wild red pine nut gift boxes. As the largest comprehensive shopping center within Yabuli Ski Resort, it brings together internationally renowned outdoor brands and local Heilongjiang specialty shops. Resort guests love visiting during ski breaks to restock gear and buy souvenirs. The store also provides professional equipment consultation and tax-refund packaging services.", "name": "Yabuli Ski Resort Commercial Center", "transport": "Take the free shuttle bus inside Yabuli Ski Resort and get off at the Resort Central Square Station."}, {"address": "Intersection of Limin Avenue and Haping Road, Xiangfang District, Harbin, Heilongjiang Province (Yabuli Ski Shuttle Service available)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Bosideng extreme cold down jackets, Columbia waterproof insulated hiking boots, and Descente professional ski suits. As a landmark international discount shopping center in Heilongjiang, it offers exclusive brand discounts tailored for Yabuli skiers. Housing hundreds of top international and outdoor sports brands with year-round discounts of 50% to 70% off, it is the top choice for ski enthusiasts buying big-brand thermal gear and ski equipment.", "name": "Shanshan Outlet Plaza Yabuli Section", "transport": "Take the direct travel shuttle bus provided by the shopping plaza from Harbin Railway Station or Yabuli High-Speed Railway Station."}, {"address": "No. 18 Main Street, Qingyun Tourism Famous Town, Yabuli, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Wild Changbai Mountain hazelnut mushrooms, Yabuli farm linden snow honey, and black soil wild dried blueberries. An independent local commercial plaza featuring authentic Northeastern characteristics, operated jointly by long-established local merchants. Instead of duplicate international brands, it focuses on precious mountain delicacies and handicrafts from Heilongjiang\u0027s Daxing\u0027anling and Changbai Mountain ranges. Offering authentic quality at friendly prices, it is an excellent shopping spot to experience authentic Northeastern local produce culture.", "name": "Yabuli Qingyun Town Local Specialty Plaza", "transport": "Take a taxi for about 8 minutes from Yabuli South Railway Station, or walk directly from the pedestrian street in the center of Qingyun Town."}, {"address": "2nd Floor, Main Ski Equipment Hall, Yabuli Sun Mountain Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Burton snowboard accessories, Goldwin high-end thermal ski base layers, and Oakley anti-fog ski goggles. Located inside Sun Mountain Resort, this professional ski outlet store provides past-season but brand-new high-quality gear for all levels of skiers. Operated with the involvement of a local professional ski instructor team, it offers authentic equipment advice based on your skill level, along with steep discounts.", "name": "Yabuli Sun Mountain Ski Gear Outlet", "transport": "Go directly to the 2nd floor commercial area inside the Ski Equipment Building of Yabuli Sun Mountain Resort."}, {"address": "No. 88 Zhongxin Road, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Must-Buy List: Northeastern big floral pattern padded jackets, classic Harbin red sausage gift boxes, and traditional handcrafted wooden sled models. A local general department store representing the daily life and regional charm of Yabuli residents. It preserves a rich shopping atmosphere of a Northeastern small town, featuring not only daily necessities but also local artisans selling authentic folk craft items.", "name": "Yabuli Town Xinhua Local Mall", "transport": "Take Bus Line 1 within Yabuli Town and get off at Xinhua Mall Station."}, {"address": "No. 16888 Zhongyuan Avenue, Songbei District, Harbin, Heilongjiang Province (Yabuli Skiing Line Authorized Direct Store)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Salomon trail running shoes, The North Face 3-in-1 jackets, and Arc\u0027teryx windproof fleece hats. A large outlet village featuring a charming European town architectural style, gathering numerous high-end outdoor and sports brand discount stores. The outlet provides ski gear storage and exclusive discount coupon distribution services. Many ski enthusiasts make a special trip here to purchase top-tier outdoor equipment before heading to Yabuli.", "name": "Maple Town Outlet Shopping Village", "transport": "Take the Yabuli Ski Direct Shuttle Bus or drive along the Ha-Mu Expressway."}, {"address": "Next to Jintian Flyover, Yabuli Tourist Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Pure natural black fungus gift boxes, Changbai Mountain ginseng lozenges, and premium packaged Northeast rice. Directly operated by a leading agricultural brand in Heilongjiang, this large specialty store carefully selects top-tier organic foods from forest areas and farms across Heilongjiang. Offering nationwide shipping and on-site packing services, it is a highly rated shop for skiers to purchase authentic Northeastern agricultural products before leaving Yabuli.", "name": "Heilongjiang Northeast Produce Center Yabuli Flagship Store", "transport": "Take the Yabuli Resort Loop Shuttle Bus and get off at Jintian Flyover Station."}, {"address": "No. 1 Windmill Village Commercial Street, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Handcrafted Russian matryoshka dolls playing the violin, Northeastern birch bark craft paintings, and frozen pear flavored handmade hard candies. Filled with Northeastern ice and snow charm, this independent grocery and craft mall gathers works from local Heilongjiang folk artists and Sino-Russian border handicrafts. The owner handpicks wood carvings and handmade gifts from the Sino-Russian border and Xiaoxiang\u0027an Mountains, rich in unique folk charm and highly popular among tourists and ski lovers.", "name": "Yabuli Snow Village Craft \u0026 Souvenir Mall", "transport": "About a 3-minute walk from Yabuli Windmill Village."}], "name": "Shopping Malls \u0026 Recommended Outlets"}}, "name": "Yabuli Ski Resort"}};
        const cityName = "Harbin";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
