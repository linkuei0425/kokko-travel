r Saint Sophia Square. The signature Braised Pork Spine and Pork Big Bones are slow-cooked until tender, savory, and fall-off-the-bone delicious. Straws are provided to savor the rich marrow inside! The Guobao Rou (Crispy Sweet and Sour Pork) is another standout, featuring a golden, crispy shell coating tender pork loin\u2014a brilliant display of authentic, hearty Northeastern flavor.", "name": "Xuefu Yipin Jianggu", "transport": "About a 5-minute walk from Exit 1 of Shangzhi Street Station, Metro Line 2"}, {"address": "No. 57 Shangzhi Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A decades-old hidden gem tucked in an alley near Central Street. The pancakes are golden, crispy, layered, and delightfully wheaty, while the smoked pork is tender, savory, and infused with a distinct smoky aroma. Spread sweet bean sauce, roll up scallions and smoked pork into the pancake, and take a bite\u2014crispy on the outside, tender on the inside, with a rich, savory flavor that is satisfying without being greasy. A must-visit local classic.", "name": "Maomao Smoked Meat \u0026 Pancake", "transport": "About a 4-minute walk from Exit 2 of Shangzhi Street Station, Metro Line 2"}, {"address": "No. 28 Xishidao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A private museum-style Russian restaurant on Xishidao Street, filled with historical charm and unique private antiques. The signature borscht offers a well-balanced sweet-and-sour flavor, pairing wonderfully with fresh-baked, chewy Russian rye bread. The Red Wine Braised Beef features tender meat that melts in your mouth with every rich spoonful. It is highly favored by visitors looking for a romantic atmosphere and artisanal Russian home-style cooking.", "name": "Lucia Restaurant", "transport": "About a 5-minute walk from Exit 1 of Central Street Station, Metro Line 2"}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "Near No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | A highly popular Nordic-style cafe near Saint Sophia Cathedral, beloved by both locals and tourists. They offer exquisite pour-over coffee and freshly baked European brunch platters\u2014sourdough bread crispy on the outside and soft inside, paired with rich cheese and smoked salmon for rich layers of flavor. The warm aroma of coffee and wooden decor create a delightfully relaxing vibe, making it a top choice for a relaxing brunch after exploring the cathedral.", "name": "Helsinki Coffee", "transport": "Take Bus 101 or 103 to Sophia Church Station, then walk for about 3 minutes"}, {"address": "No. 39 Hongxia Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Tucked away in an alley off Central Street, this hipster cafe is famous for its specialty oat milk lattes and handmade French desserts. Their signature avocado egg toast served during brunch pairs perfectly with rich dark roast coffee, offering a smooth and refreshing taste. With its cozy Japanese retro style and friendly service, many visitors consider it a must-visit gem in the Central Street area.", "name": "Deer Fish Coffee", "transport": "Take Metro Line 2 to Central Street Station (Exit 1), then walk for about 5 minutes"}, {"address": "No. 57 Toudao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A classic cafe brimming with a century of Russian nostalgia, recreating the life of Russian emigres in old Harbin. Signature items include hot Russian cocoa and freshly brewed Russian coffee, served alongside brunch featuring garlic toast made from traditional Harbin Lieba bread for a hearty, aromatic flavor. Rich historical ambience and antique furniture make you feel as if you\u0027ve stepped back into the early 20th century while enjoying your meal.", "name": "Lucia Cafe \u0026 Restaurant", "transport": "Take Metro Line 2 to Central Street Station, then walk about 6 minutes to Toudao Street"}, {"address": "1F, Modern Hotel, No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Located inside the historic Modern Hotel, featuring elegant decor inspired by the Art Nouveau movement. Famous for its iconic popsicles, its brunch and specialty coffees are equally popular. Try the classic Russian Tiramisu paired with fresh espresso for a silky, rich blend of bitter and sweet flavors\u2014highly recommended for lovers of old-world European afternoon tea and brunch.", "name": "Modern Hotel Cafe", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 4 minutes"}, {"address": "High Floor, Shopping Plaza, No. 111 Shitoudao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Boasting stunning panoramic views, this cafe overlooks the grand Saint Sophia Cathedral directly. It specializes in premium single-origin pour-over coffee and creative brunch waffle towers, featuring crispy waffles topped with fresh berries and custom custard for a rich, sweet-and-sour flavor. The breathtaking window view combined with top-tier food makes it a famous, Instagram-worthy brunch destination.", "name": "Langyi Coffee", "transport": "Take Bus 1, 13, or 28 to Architecture Art Square Station, then walk for about 2 minutes"}, {"address": "No. 120 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Focusing on authentic Russian baking and classic black coffee, this cafe is famous for its daily fresh-baked jam buns, Lieba bread, and brewer\u0027s yeast breads. For brunch, try the Russian borscht paired with a French croissant\u2014the warm, savory-sweet soup combined with a flaky croissant creates a deeply comforting flavor. It\u0027s a fantastic spot to experience Harbin\u0027s unique Russian brunch culture.", "name": "1903 Russian Bakery \u0026 Cafe", "transport": "Take Metro Line 2 to Shangzhi Street Station, then walk for about 5 minutes"}, {"address": "No. 115 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Located in the heart of Central Street, this elegant cafe embraces a French countryside style. Highlights of their brunch include the French ham and cheese croissant and custom vanilla latte. The freshly baked croissant is light and crispy, filled with gooey cheese and savory ham. The outdoor seating area lets guests enjoy good food while admiring the historic cobblestone street and European architecture.", "name": "Seine Bank Cafe", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 3 minutes"}, {"address": "Near the intersection of Jingu Pedestrian Street and Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A distinctive cafe steeped in Eastern European charm, serving light brunch dishes that merge traditional Russian recipes with modern flavors. The signature smoked beef sandwich, paired with a custom Vienna coffee, features tender, juicy beef and bread that is crispy outside and soft inside. Charming hand-painted Russian murals and warm lighting make it an alluring spot for a relaxed afternoon tea or brunch along Central Street.", "name": "Moscow Suburbs Cafe", "transport": "Take Metro Line 2 to Central Street Station (Exit 2), then walk for about 4 minutes"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 112 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Founded in 1925, this century-old establishment is one of Harbin\u0027s most iconic Russian Western restaurants. The interior preserves rich Baroque and Russian royal palace styles, making you feel as if you\u0027ve stepped into last century\u0027s Moscow. Must-try dishes include Russian borscht, braised beef in a pot, and roasted cold bread. The braised beef is tender and juicy, while the borscht is delightfully sweet and sour, loved by both international tourists and local foodies.", "name": "Huamei Restaurant", "transport": "Take Metro Line 2 to Zhongyang Street Station, then walk for about 5 minutes."}, {"address": "No. 55 Xiqidao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | The birthplace of Crispy Pork in Sweet and Sour Sauce (Guo Bao Rou)! The founder was once the head chef of the Daotai Mansion in the late Qing Dynasty, combining traditional Northeastern dishes with the essence of aristocratic cuisine. The signature authentic Guo Bao Rou features a golden, crispy coating tossed in a perfectly balanced sweet and sour sauce, offering a satisfying crunch with tender, juicy tenderloin inside. Filled with vintage Harbin historical artifacts, the restaurant allows guests to immerse themselves in rich culture while savoring delicious food.", "name": "Lao Chu Jia Restaurant (Daotaifu Cuisine)", "transport": "Walk from Central Street to Xiqidao Street in about 3 minutes."}, {"address": "B1, No. 127 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Built in 1901, this popular Russian bistro is renowned as one of Harbin\u0027s earliest authentic foreign restaurants. The basement dining area preserves ancient brick walls and dark wood tones, paired with melodious Russian accordion performances and subtle, luxurious lighting that creates an incredible atmosphere. Must-try specialties include the Caucasian skewers and red wine stewed beef\u2014juicy, thick, and bursting with flavor. Paired with Russian dark beer or vodka, it\u0027s the perfect spot to experience the nightlife of Harbin, the \u0027Moscow of the East\u0027.", "name": "Tados Russian Restaurant", "transport": "Walk about 350 meters from Exit 1 of Zhongyang Street Station on Metro Line 2."}, {"address": "No. 28 Xishidao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A legendary Russian bistro with the atmosphere of a private museum, built in memory of Madame Lucia, a Russian emigr\u00e9. The restaurant is adorned with exquisite handmade wood carvings, old photos, and antique furniture, alongside a lush garden. Featured dishes like Lieba bread with spread, Russian sausage platters, and creamy braised lamb in a pot offer authentic and heartwarming flavors, making it a favorite for tourists seeking vintage artistic vibes and a refined dining experience.", "name": "Lucia Western Restaurant", "transport": "Turn onto Xishidao Street from Central Street and walk for about 2 minutes."}, {"address": "1F, Modern Hotel, No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Located inside the famous Modern Hotel with a history dating back to 1906, this is a classic representative of Harbin\u0027s French-Russian fusion cuisine. Filled with opulent Art Nouveau carvings, the restaurant offers an elegant and romantic ambience. Signature dishes like French pan-seared foie gras, Russian giblet soup, and homemade Berkshire pork sausage are outstanding. Finishing your meal with a nationally renowned Modern Popsicle is an indispensable culinary experience when visiting Central Street.", "name": "Modern Restaurant (Madie\u0027er)", "transport": "About a 6-minute walk from Zhongyang Street Station on Metro Line 2."}, {"address": "No. 60 Zhaolin Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located near Saint Sophia Cathedral, this is an excellent spot to experience traditional Northeastern braised pork bones and popular local home-style dishes. The signature braised spine and large marrow bones are slow-cooked for hours in a secret sauce until the meat effortlessly falls off the bone\u2014rich in savory sauce flavor, popping on gloves to suck out the marrow is an absolute delight. Accompanied by Northeastern glass noodle salad (Da La Pi) and mixed stew (Luan Dun), the portions are exceptionally generous and affordable, constantly attracting enthusiastic crowds.", "name": "Xue Fu Yi Pin Jiang Gu", "transport": "About a 3-minute walk from Saint Sophia Square."}, {"address": "No. 12 Xiqidao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A highly-rated restaurant combining traditional Russian cuisine with a modern craft beer bistro concept. Housed in a three-story classical European-style building, it frequently features live performances by professional Russian dancers and bands in the evening. Must-try dishes include braised seafood in a pot, black pepper steak, and Russian pirozhki\u2014made with fresh ingredients and exquisite seasoning. Paired with house-brewed Russian Kvass or craft beer, it delivers a double feast for both eyes and palate.", "name": "Portman Western Restaurant", "transport": "Walk about 150 meters from Central Street to Xiqidao Street."}, {"address": "No. 43 Da\u0027an Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A highly popular local restaurant in the Central Street commercial area. The pork smoked over special fruitwood features rich layers\u2014tender and flavorful without being overly greasy. Wrap it in freshly baked pancakes that are crispy outside and soft inside, spread with sweet bean sauce and shredded scallions; every bite is packed with aroma. Their Guo Bao Rou and braised pig trotters (\u0027Sai Xiong Zhang\u0027) are also widely praised, making this an ideal spot for authentic local Harbin comfort food.", "name": "Mao Mao Smoked Meat \u0026 Pancake", "transport": "Turn onto Da\u0027an Street from Central Street and walk for about 4 minutes."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Toulong Street, Daoli District, Harbin, Heilongjiang Province (Near Saint Sophia Square)", "feature": "\u2b50 4.6 stars | Located in Daoli District near Central Street, this classic vegetarian restaurant is famous for its rich variety of Northeastern-style vegetarian dishes and delicate dim sum. The signature dish, \u0027Vegetarian Sweet and Sour Pork\u0027 (Su Guo Bao Rou), features a crackling crispy crust with lion\u0027s mane mushrooms inside to perfectly replicate the texture of meat, all coated in a balanced sweet and sour sauce that earns endless praise. In addition, there are various freshly steamed vegetarian shaomai and medicinal herb vegetarian soups with rich, sweet broth, highly favored by health-conscious tourists and local seniors.", "name": "Cihang Vegetarian Restaurant", "transport": "Take Bus 101 or 103 and get off at Zhaolin Park Station; walk for about 5 minutes."}, {"address": "West 15th Street, Daoli District, Harbin, Heilongjiang Province (Near Central Street)", "feature": "\u2b50 4.7 stars | A highly popular, affordable vegetarian buffet located in the Central Street commercial district, offering dozens of hot stir-fried vegetarian dishes, cold dishes, Northeastern handmade pastries, and hot soups. The \u0027Vegetarian Dumplings\u0027 here feature thin wrappers and generous fillings made of celery, shiitake mushrooms, cabbage, and wood ear mushrooms, bursting with savory juice in every bite. There are also freshly fried \u0027Vegetarian Spring Rolls\u0027 that are golden, crispy, and aromatic. Its unbeatable value for money and authentic Northeastern home-style flavors make it highly recommended by vegetarians and tourists seeking light meals alike.", "name": "Sumanxiang Vegetarian Buffet", "transport": "Take Metro Line 2 to Central Street Station (Exit 1), then walk for about 6 minutes."}, {"address": "Diduan Street, Daoli District, Harbin, Heilongjiang Province (Near Saint Sophia Square)", "feature": "\u2b50 4.5 stars | A specialty restaurant that combines Zen tea ceremony with high-quality vegetarian cuisine. The interior is decorated in an antique style, offering a calm and peaceful atmosphere. The \u0027Black Truffle Fried Rice\u0027 and \u0027Handmade Tofu Pot\u0027 are highly recommended; the tofu absorbs rich vegetable and fruit broth, featuring a soft, silky texture infused with deep flavors. Enjoying a pot of freshly brewed Pu-erh tea with handmade vegetarian pastries after a meal\u2014melting in your mouth with a gentle sweetness\u2014makes it an ideal place to rest after exploring Saint Sophia Square.", "name": "Jingxin Vegetarian Tea House", "transport": "Take Bus 16 or 64 to Harbin No. 1 Department Store Station, then walk for about 4 minutes."}, {"address": "Shangzhi Street, Daoli District, Harbin, Heilongjiang Province (Near Central Street)", "feature": "\u2b50 4.4 stars | A traditional established restaurant specializing in mock-meat dishes and health-conscious vegetarian food, transforming Northeastern cuisine into an astonishing vegetarian feast. Must-order dishes include the \u0027Vegetarian Di San Xian\u0027 (Three Treasures of the Earth) and \u0027Vegetarian Braised Pork\u0027, where ingredients like eggplant, potatoes, and konjac are cooked until tender, savory, and perfectly seasoned\u2014rich yet not oily at all. With warm, friendly service and traditional Northeastern flavors, it is deeply loved by plant-based food enthusiasts who crave rich tastes.", "name": "Lotus Vegetarian Restaurant", "transport": "Take Metro Line 2 to Shangzhi Street Station and walk for about 5 minutes after exiting."}, {"address": "West 7th Street, Daoli District, Harbin, Heilongjiang Province (Near Central Street)", "feature": "\u2b50 4.8 stars | A refined vegetarian space filled with cultural charm, boasting a quiet and elegant environment with dishes that balance aesthetics and health. The top pick, \u0027Fo Guang Noodles\u0027, uses a secret vegetable broth that is sweet and refreshing, served with springy, chewy noodles, juicy vegetarian bean curd rolls, and seasonal vegetables for a comforting and satisfying meal. The dessert \u0027Red Bean Matcha Cake\u0027 is cool, refreshing, and moderately sweet\u2014a soothing treat for tourists strolling along Central Street.", "name": "Water Drop Vegetarian Tea House", "transport": "Take Metro Line 2 to Central Street Station (Exit 2), then walk for about 3 minutes."}, {"address": "Zhaolin Street, Daoli District, Harbin, Heilongjiang Province (Near Saint Sophia Square)", "feature": "\u2b50 4.3 stars | A traditional vegetarian restaurant located around Saint Sophia Square, emphasizing natural ingredients low in oil and salt. The \u0027Stir-fried Yam, Lily Bulb, and Wood Ear Mushroom\u0027 and \u0027Baiye Tofu Casserole\u0027 are especially recommended; the yam is crisp yet dense, while the lily bulbs add a light sweetness that cleanses the palate, letting you taste the freshness of the ingredients in every bite. The atmosphere is simple and cozy, with affordable prices and generous portions, making it a go-to favorite for local plant-based eaters.", "name": "Puzhao Vegetarian Restaurant", "transport": "Take Bus 1 or 28 and get off at Zhaolin Street Station."}, {"address": "Duan Street, Daoli District, Harbin, Heilongjiang Province (Near Central Street Pedestrian Street)", "feature": "\u2b50 4.6 stars | Focusing on exquisite, innovative vegetarian dishes and imperial-style healthy cuisine, the food here is presented like works of art. The signature \u0027Bamboo Fungus \u0026 Spinach Thick Soup\u0027 has a silky, smooth texture that glides down easily, while the \u0027Rainbow Vegetarian Hand Roll\u0027 wraps fresh lettuce around crunchy nuts and special sauce for distinct, refreshing layers of flavor. The elegant dining environment and attentive service make it perfect for family meals or tourists looking for Instagram-worthy moments.", "name": "Shuxiang Shijia Vegetarian Restaurant", "transport": "Walk to the intersection of Central Street and Duan Street; it takes about 2 minutes on foot."}, {"address": "West 12th Street, Daoli District, Harbin, Heilongjiang Province (Near Central Street)", "feature": "\u2b50 4.5 stars | A creative vegetarian restaurant that ingeniously combines Western plant-based cuisine with Eastern ingredients. The popular dish \u0027Creamy Truffle Wild Mushroom Risotto\u0027 features grains of rice soaked in the rich aroma of wild mushrooms and plant butter, delivering a smooth, hearty mouthfeel. Another favorite, \u0027Baked Eggplant with Vegan Cheese\u0027, features a toasted outer skin with tender eggplant meat, topped with tempting, gooey melted plant cheese. Its innovative and multi-layered flavors subvert traditional impressions of vegetarian food, attracting many young tourists.", "name": "Wizard of Oz Vegetarian Creative Cuisine", "transport": "Take Metro Line 2 to Central Street Station, then walk for about 4 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Originating on Central Street in 1906, this iconic frozen treat features pale yellow rectangular bars with an extraordinarily rich and creamy texture. Made with pure milk and eggs without any aerating agents, every bite offers a silky, sweet delight. Even in the freezing winter at -20\u00b0C, eating one outdoors gives a unique \u0027the colder it is, the more you want it\u0027 sensation, making it a must-try pilgrimage for tourists and locals alike.", "name": "Modern Ice Cream Popsicle (Madieer Ice Pop)", "transport": "Take Metro Line 2 to Central Street Station, then walk about 5 minutes."}, {"address": "Near No. 130 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Harbin\u0027s most iconic garlic-infused smoked sausage, charcoal-smoked over fruitwood through multiple meticulously crafted steps. The casing is snappy with a satisfying crackle, unlocking firm, juicy meat infused with rich garlic and captivating charcoal smokiness. Tearing into a piping-hot sausage right at the stall delivers a savory, chewy delight that keeps you coming back for more\u2014a true soul food that locals grew up loving.", "name": "Churin Leader Freshly Grilled Red Sausage Stand", "transport": "Take Metro Line 2 to Shangzhi Avenue Station, then walk about 8 minutes."}, {"address": "Near the intersection of Toulong Street and Shangzhi Avenue, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Special noodle sheets are griddled to a light golden crisp, topped with a freshly cracked egg, diced onions, cilantro, and sliced sausage, then brushed with a signature sweet-and-spicy sauce and aged vinegar. The texture perfectly balances chewy noodle skin with soft, tender egg. Every layer explodes with tangy, sweet, and mild spicy flavors, making it a piping-hot, mouthwatering favorite around St. Sophia Square.", "name": "Northeastern Grilled Cold Noodles (Kao Leng Mian)", "transport": "Take Bus 101 or 103 to St. Sophia Square Station, then walk about 3 minutes."}, {"address": "Stalls along Central Street Pedestrian Mall, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | On Harbin\u0027s freezing streets, the outer sugar coating of these candied fruits freezes into a crystal-thin, icy-crisp shell. Biting into one gives a sharp crunch followed by the burst of sweet and tangy juice from hawthorns or strawberries within. This irresistible blend of crispy ice sugar and refreshing fruit is an essential winter delicacy satisfying both the eyes and taste buds.", "name": "Ice City Classic Frozen Candied Hawthorns (Tanghulu)", "transport": "Take Metro Line 2 to Central Street Station and stroll along the pedestrian mall to find them."}, {"address": "No. 112 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A long line always forms at the takeout window next to Huamei Western Restaurant. The fresh-baked Chimney Rolls feature a golden, crispy exterior dusted with sugar and cinnamon powder, concealing a soft, aromatic wheat interior. Meanwhile, the authentic Russian Dalieba bread offers a dense, crusty shell with a delightfully subtle sourdough flavor that gets richer with every chew, making it a favorite among fans of Russian bakery treats.", "name": "Huamei Bakery Takeout Window - Dalieba \u0026 Chimney Roll", "transport": "Take Metro Line 2 to Central Street Station, then walk about 6 minutes."}, {"address": "Corner stall at St. Sophia Square, Shitoudao Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | This kiosk serves piping-hot, golden fried cakes made from sticky yellow millet dough, boasting a crispy crust and a gooey, chewy center bursting with sweet red bean paste. Side-by-side, they offer thawed dark frozen pears\u2014bite open the skin to sip the ice-cold, naturally sweet juice that tastes like a pear slushie. This dramatic contrast of hot vs. cold and rich sweet vs. crisp fresh attracts endless visitors eager for a taste.", "name": "Traditional Fried Cake \u0026 Frozen Pear Kiosk", "transport": "Take Bus 201 to Zhaolin Street Station, then walk about 4 minutes."}, {"address": "Intersection of West 15th Street and Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Large lamb and pork skewers cooked over open charcoal fires on massive iron skewers. Generous cuts of tender meat are seasoned with cumin and chili powder, perfectly charred on the outside and juicy on the inside. Pair them with a cold glass of Kvass\u2014a fermented Russian bread drink with light effervescence and a sweet malt aroma\u2014to perfectly cut through the richness. It is the ultimate street food combo while strolling between Central Street and St. Sophia Square.", "name": "Russian Kvass \u0026 Giant Meat Skewers Stall", "transport": "Take Metro Line 2 to Central Street Station (Exit 1), then walk about 4 minutes."}, {"address": "Market Area, St. Sophia Square, No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Located in the market surrounding St. Sophia Church Square, this kiosk makes Russian Blini fresh to order. The crepes are thin, tender, and subtly buttery, filled with your choice of savory melted cheese and ham or rich blueberry jam. Enjoying these hot, delicate, and flavor-filled crepes amidst Russian-style architecture offers a delightful taste of exotic street culture.", "name": "St. Sophia Russian Blini Kiosk", "transport": "Take Metro Line 2 to Shangzhi Avenue Station, then walk about 7 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Central Avenue and St. Sophia Square"}, "laodaowai": {"categories": {"cat_1": {"items": [{"address": "Near the intersection of Nan\u0027erdao Street and Toudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Founded in 1802, this century-old institution is one of Harbin\u0027s earliest steamed bun shops. Its most iconic signature dish, the \u0027Pork Rib Bun,\u0027 features thin dough filled with generous ingredients; biting into it releases a rich burst of savory meat juice. The pork rib meat is remarkably tender, melting off the bone with a subtle hint of Sichuan pepper aroma. Paired with a refreshing bowl of seaweed and egg drop soup, it is a timeless classic that local Harbiners and tourists alike must visit.", "name": "Zhang Bao Pu", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 5 minutes."}, {"address": "No. 114 Nan Sandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Established in 1912, this renowned century-old eatery is famous far and wide for its signature \u0027Three-Delicacy Steamed Dumplings.\u0027 The dumpling wrapper is handmade, yielding a satisfyingly chewy and resilient texture. The filling combines fresh pork, shrimp, and Chinese chives seasoned with a secret master broth, making every bite incredibly plump, juicy, and sweet. Preserving a warm, retro Northeast diner atmosphere, it is deeply loved by local foodies and traveling guests alike.", "name": "Fan Ji Yong Dumpling Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 6 minutes."}, {"address": "No. 382 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | An iconic braised eatery in Daowai District that has conquered countess food lovers\u0027 palates with its tender, flavorful braised pig trotters. The trotters feature an appetizing reddish-brown skin, rich in collagen, soft, dense, and non-greasy, melting in your mouth with the complex aroma of aged master soy sauce marinade. Paired with house-braised beef and crisp cold appetizers, this is an excellent spot to experience traditional Northeastern braising culinary heritage.", "name": "Fu Qiang Pig Trotters Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 7 minutes."}, {"address": "No. 130 Nan Wudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A decades-old Halal specialty eatery in Old Daowai, featuring premium mutton slow-simmered over low heat in custom mini clay pots. The soup is crystal clear, rich, and completely gamey-free, while the thick cuts of mutton are stewed to ultimate tenderness, offering a velvety warmth infused with delicate notes of angelica and white pepper. Enjoying a piping-hot pot of mutton soup alongside freshly baked sesame flatbread in the freezing winter provides pure soul-satisfying bliss.", "name": "De Jing Pot Mutton Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 8 minutes."}, {"address": "Near the intersection of Jingyu Street and Beiqidao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | A hugely popular traditional street food stall in Old Daowai with daily limited quantities and long queues. Made from premium yellow sticky rice flour, the cakes are fried to a golden crisp outside while remaining soft and chewy inside, filled with smooth, delightfully sweet red bean paste. Taking a bite freshly out of the fryer reveals an amazing contrast of hot, crispy dough and velvety red bean filling\u2014an irresistible perfection that keeps locals and travelers patiently waiting in line.", "name": "Yin Pang Zi Fried Cake", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk along Jingyu Street for about 9 minutes."}, {"address": "No. 334 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A longstanding braised bone specialty house in Old Daowai, famous for authentic Northeastern soy-braised pork spine and pig trotters. The bones are simmered until tender and savory, allowing you to suck out the rich, fragrant bone marrow, while the tender, juicy meat carries deep aromas of soy sauce, Sichuan pepper, and star anise. Put on disposable gloves and dig in with your hands to embrace the bold, generous spirit of Northeastern dining\u2014a favorite for travelers who love hearty meat feasts.", "name": "Lao Tou Pig Trotters \u0026 Braised Pork Bones", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 6 minutes."}, {"address": "No. 315 Jingyang Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | A legendary diner that preserves the nostalgic ambiance and operational style of the state-owned era. The signature \u0027Fresh Pork Wontons\u0027 feature paper-thin skins in a clear, flavorful broth, packed with savory pork filling fragrant with sesame oil and scallions for a smooth, soothing bite. Pair them with freshly baked crispy flatbread dipped in the wonton broth\u2014alternating bites between flatbread and wontons is a cherished comfort food tradition in the hearts of old Harbin locals.", "name": "State-Owned Hong Guang Wonton Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 4 minutes."}, {"address": "Nan Wudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A renowned Halal fried cake shop preserving traditional techniques, offering an essential old-school sweet treat in Old Daowai. Made-to-order using traditionally fermented yellow rice flour dough and house-cooked red bean paste, these treats are fried to a golden finish. Featuring a subtly crisp exterior, a springy and chewy texture inside, and a smooth, aromatic red bean center, this century-old delicacy delights both young travelers and older generations alike.", "name": "Rong Hua Fried Cake Shop", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 8 minutes."}], "name": "Traditional Local Eateries"}, "cat_2": {"items": [{"address": "Inner Courtyard, Chinese Baroque District, Jingyu Street, Daowai District, Harbin City", "feature": "\u2b50 4.7 stars | A popular independent cafe tucked away inside the courtyard of a century-old Chinese Baroque building. Signature drinks like the \u0027Specialty Ice Drip Coffee\u0027 and \u0027Cream Latte\u0027 are velvety smooth, bursting with rich nutty and fruity notes that local youth and tourists adore. The cafe retains Laodaowai\u0027s original brick-and-wood structure and carved railings, where sunlight streams down through the courtyard, creating a beautifully nostalgic and immersive, cozy ambiance.", "name": "Luyu Coffee (\u9e7f\u9b5a\u5496\u5561)", "transport": "Take Metro Line 3 to Chinese Baroque District Station, Exit 1, and walk for about 3 minutes."}, {"address": "No. 45 Nansandao Street, Daowai District, Harbin City", "feature": "\u2b50 4.5 stars | A unique brunch cafe combining Russian flair with the nostalgic vibe of Northeast China\u0027s historic streets. The must-try \u0027Russian Borscht with Artisanal Sourdough\u0027 features sourdough that is crispy outside, soft inside, with a subtle tangy aroma. Paired with steaming hot, rich borscht, it offers cozy warmth especially in winter, making it an ideal spot to experience Laodaowai\u0027s exotic brunch culture. Don\u0027t miss their \u0027Torched Cheese Latte\u0027 either.", "name": "Baroque Time Coffee (\u5df4\u6d1b\u514b\u6642\u5149\u5496\u5561)", "transport": "Take Bus 1 or 28 to Jingyu Street Station, then walk for about 2 minutes."}, {"address": "Chinese Baroque Historic Cultural District, Nan\u0027erdao Street, Daowai District, Harbin City", "feature": "\u2b50 4.6 stars | A brunch bakery centered around a Baroque courtyard. Freshly baked daily, the \u0027Cinnamon Rolls\u0027 and \u0027Blueberry Cheese Tarts\u0027 offer a rich cinnamon aroma with a moist, dense texture. Paired with a dark-roast \u0027Hand-Poured Pour-Over Coffee,\u0027 the subtle bitterness gives way to a sweet lingering finish, creating perfect flavor layers. It\u0027s an ultimate choice for tourists to snap photos and spend a relaxing afternoon.", "name": "Time Courtyard Bakery \u0026 Cafe (\u62fe\u5149\u9662\u5b50\u70d8\u7119\u5496\u5561)", "transport": "Take Metro Line 3 to Chinese Baroque District Station, then walk for about 4 minutes."}, {"address": "No. 18 Beisandao Street, Daowai District, Harbin City", "feature": "\u2b50 4.4 stars | An exquisite cafe full of nostalgic old-Harbin charm, specializing in Russian-style brunch and specialty coffees. The \u0027Dalieba Sandwich\u0027 uses authentic local Russian dalieba bread loaded with thick-cut ham and pickles. Each bite is crispy, solid, and aromatic with wheat flavor. Paired with a smooth, perfectly sweet \u0027Oat Milk Latte,\u0027 it beautifully showcases Harbin\u0027s
