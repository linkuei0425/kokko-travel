st crispy sweet and sour pork (Guo Bao Rou) is exceptional here\u2014golden, sweet and tangy, and delightfully crunchy on the outside, wrapped around tender, savory pork loin. Paired with a warm glass of locally brewed stout or spiced heated rice wine, the sweet and savory harmony offers deep satisfaction, making it immensely popular among young skiers and international visitors.", "name": "Yabuli Sun Valley Craft Beer \u0026 Bistro", "transport": "Located next to the Sun Valley Resort Ski Equipment Hall, just a 1-minute walk after exiting the slope."}, {"address": "No. 18 Jinxin Avenue, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A charming local restaurant steeped in rich Northeast folk heritage, famous for authentic big-pot hearth cooking and wild mountain delicacies. The must-order stewed chicken with mushrooms uses local free-range chicken and wild hazel mushrooms; the meat is springy and succulent, while the broth is intensely rich and flavorful, complementing smooth sweet potato noodles that absorb every bit of juice. Sitting on a heated Kang bed while enjoying steaming hot meals offers an unforgettable immersion into local rural culture.", "name": "Linhai Xueyuan Authentic Northeast Cuisine", "transport": "Take the Yabuli Resort Loop Bus to Lvyou Shanzhuang Station, then walk for 3 minutes."}, {"address": "No. 15 Fengche Road, Qingyun Town, Yabuli, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A cozy log cabin-style bistro specializing in Northeast charcoal barbecue and warm local mulled spirits. The signature grilled lamb skewers are tender and free of gamey odor, dusted with fragrant cumin and chili powder that release a mouthwatering aroma; paired with warm local blueberry wine from Heilongjiang, the sweet, slightly tart drink soothes and warms the body. With its cozy late-night ambiance and hot sizzling skewers, it\u0027s a fantastic spot to unwind with friends after a day on the slopes.", "name": "Yabuli Wooden Chalet BBQ \u0026 Bistro", "transport": "About an 8-minute taxi ride from Sun Mountain Resort."}, {"address": "No. 5 Commercial Street, Qingyun Town, Yabuli Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A heartwarming eatery showcasing organic mountain treasures and classic Northeast home-cooked dishes from Heilongjiang. Specialty dishes like Sha Zhu Cai (traditional pork feast) feature crisp, tangy sauerkraut that refreshes the palate, delicate blood sausage, and tender pork slices. Served alongside house-made warm Northeast rice wine, the gentle and smooth drink wards off the severe winter chill. Generous authentic portions and friendly service make this a beloved dining destination.", "name": "Yabuli Snow Village Home Cuisine", "transport": "Located within Qingyun Town Commercial Street, easily accessible on foot."}, {"address": "1st Floor, Beginner Slope Hall, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A stylish bistro located right at the foot of the ski slopes, combining Nordic alpine chalet aesthetics with light Heilongjiang snacks. Its Harbin red sausage platter and baked cheese potato cakes are highly acclaimed; the smoked red sausage carries a rich garlic aroma with a snappy, hearty bite. Paired with a rich hot chocolate or warm spiced wine, it offers a silky energy boost, making it a favorite spot to recharge and snap photos after skiing.", "name": "Yabuli Ski Resort Foothill Cafe \u0026 Bistro", "transport": "Located on the 1st floor of the beginner ski hall, within walking distance from the ski area."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Sun Mountain Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Healthy vegetarian dishes specially designed to recharge energy after skiing, featuring selected wild hazel mushrooms, fiddlehead ferns, and Acanthopanax from the Greater Khingan and Changbai Mountains. The steaming hot wild mushroom soup is delicious and sweet, with tender yet springy mushrooms. Authentic Northeast wild vegetables are crisp and refreshing with zero grease, making it extremely popular among health-conscious skiers and vegetarian lovers.", "name": "Yabuli Sun Mountain Resort Wild Mountain Vegetables Wellness Restaurant", "transport": "Take the Yabuli Scenic Area shuttle bus to the Sun Mountain Resort Lobby and walk from there."}, {"address": "No. 18, Qingyun Town Folk Gourmet Street, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Specializing in zero-additive, all-natural wild mushroom feasts, carefully selecting alpine delicacies like matsutake, lion\u0027s mane, and hazel mushrooms. The signature mushroom wellness hot pot broth is simmered for hours\u2014rich, fragrant, and savory\u2014with juicy, chewy mushrooms paired with a special vegetarian satay sauce that keeps you coming back for more. Highly acclaimed by travelers looking for a comforting, belly-warming meal and vegetarians alike.", "name": "Yabuli Qingyun Town Wild Mushroom Vegetarian Restaurant", "transport": "Take a taxi from Yabuli South Railway Station for about 10 minutes to reach Qingyun Town Gourmet Street."}, {"address": "Inside Windmill Village, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Located inside the picturesque Windmill Village, offering a rich variety of Northeastern specialty mountain wild vegetarian dishes. Signature stir-fried Acanthopanax and wild ferns are tender and crisp, with a subtle woody bitterness followed by a sweet finish. The special handmade tofu is crispy on the outside and tender inside with a rich soy flavor. With its unique local flavors and cozy wooden cabin dining environment, it is a highly recommended hidden gem among skiers.", "name": "Yabuli Windmill Village Mountain Delicacies Vegetarian Restaurant", "transport": "Take the resort\u0027s free shuttle bus from the main ski equipment hall of Yabuli Ski Resort to Windmill Village."}, {"address": "Zone B, Forest Gourmet Plaza, Qingyun Town, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Offering the ultimate vegetarian hot pot experience in freezing sub-zero 20\u00b0C temperatures. Features proprietary tomato red broth and clear herbal stew broth, paired with Northeastern specialties like black fungus, alpine frozen tofu, and frozen Chinese cabbage. The frozen tofu absorbs the rich, tangy soup, bursting with flavor with a velvety texture, while the thick wood ear mushrooms are delightfully crunchy\u2014making it the most popular heartwarming delicacy after a day of winter skiing.", "name": "Yabuli Forest Town Vegetarian Hot Pot", "transport": "Take the scenic area dedicated bus from Yabuli Railway Station to Qingyun Town Plaza Station and walk for about 3 minutes."}, {"address": "Inside Club Med Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | An upscale vegetarian buffet blending international flavors, serving Mediterranean roasted seasonal vegetables, Western vegetarian pasta, and Northeastern organic greenhouse salads. Roasted bell peppers and zucchini are juicy and sweet with well-balanced herb seasonings, while the cheese-baked vegetarian eggplant is soft and velvety. The luxurious, comfortable atmosphere and high-quality ingredients make it a top choice for international tourists and modern vegetarians.", "name": "Club Med Yabuli Green \u0026 Veggie Dining", "transport": "Guests staying at Club Med can enter directly; non-guests can make advance reservations for resort dining and take the internal shuttle bus."}, {"address": "No. 6, Gourmet Street, beside Ski Resort Connecting Road, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Carrying on the traditional Northeastern brine tofu craft, featuring 100% vegetarian tofu dishes. Freshly ground and made warm tofu drizzled with secret vegetarian soy sauce offers an exceptionally smooth, soft texture filled with natural soy fragrance. Tofu with scallions and dry-pot vegetarian tofu are savory, hearty, and pair perfectly with rice. Its simple, homemade taste is beloved by locals and foodies alike.", "name": "Yabuli Homemade Mountain Delicacies Tofu House", "transport": "Walk for about 8 minutes from the main gate of Yabuli Ski Resort to reach the gourmet street."}, {"address": "Next to the Mountain Top Cable Car Station on Daguokui Mountain, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | A scenic vegetarian tea house perched atop snowy mountain peaks, offering stunning views while you enjoy piping-hot vegetarian snacks and mountain vegetable noodles. The signature braised vegetarian beef noodles use premium pressed lion\u0027s mane mushrooms, yielding a realistically chewy texture infused with rich braised flavors, paired with springy noodles and a warm, non-greasy broth. The panoramic view and comforting alpine hot food draw countless skiers to visit.", "name": "Yabuli Ski Resort Mountain Top Vegetarian \u0026 Tea House", "transport": "Take the Yabuli Ski Resort summit cable car to the Daguokui Mountain Top Station; it\u0027s right at the exit."}, {"address": "Opposite the Ski Tourist Service Center, Jinguang Avenue, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Specializing in Northeastern specialty vegetarian dim sum and mountain wild snacks, including vegetarian sticky bean buns, Northeastern savory crepes (Jianbing) filled with wild vegetables, and vegetarian pickled cabbage steamed dumplings. The sticky bean buns have a chewy, soft skin with a silky, subtly sweet red bean filling; the vegetarian pickled cabbage dumplings are deliciously tangy, thin-skinned, juicy, and generous with fillings. Affordable prices and rich local Northeastern flavors make this the top choice for travelers looking to quickly sample local vegetarian culture.", "name": "Yabuli Dongbei Wild Vegetables \u0026 Veggie Eats", "transport": "Located directly opposite the Passenger Service Center in Yabuli Town, a 1-minute walk away."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Food Street outside the Main Tourist Center, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A popular street food stall located right next to the ski resort tourist center. This quintessential Northeastern street food features springy cold noodle sheets seared on a flat-top grill until lightly charred, cracked with fresh eggs, and sprinkled with diced onions, cilantro, and special sausage, finished with a rich sweet-and-sour sauce and a touch of chili paste. Biting into it hot after skiing reveals a golden, crispy exterior and a soft, juicy interior. The exquisite interplay of sweet, sour, savory, and spicy flavors instantly warms your lips and body, making it a top snack choice for tourists and ski enthusiasts to recharge.", "name": "Yabuli Ski Resort Special Grilled Cold Noodle Stall", "transport": "Take the resort\u0027s free shuttle bus to the Main Tourist Center Station and walk for about 1 minute."}, {"address": "Stall at the entrance of Sunshine Ski Resort, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.8 stars | A century-old landmark dessert from Harbin, tasting particularly unique in the minus-20-degree snow of Yabuli. Made without any added stabilizers, this popsicle relies on pure milk aroma and fresh egg yolks to create an extraordinarily dense, smooth texture that melts instantly in your mouth with an explosion of rich dairy flavor. Even enjoyed outdoors in the freezing wind, its cool, crisp-outside-soft-inside texture and rich sweet aroma are addictively delicious, making it a classic strolling treat that every visitor to Yabuli must take a photo with.", "name": "Authentic Modern Popsicle Yabuli Stall", "transport": "Take the cable car or shuttle bus to the Ski Equipment Hall of Sunshine Ski Resort to find it right in front."}, {"address": "Stall No. 12, Xuexiang Road Food Market, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A market stall brimming with Northeastern ice-and-snow charm, displaying a vibrant array of translucent candied hawthorns and signature frozen fruits. The highlights are traditional candied hawthorns and frozen pears. Biting into a candied hawthorn, the outer sugar shell, hard and crisp as glass, shatters instantly, followed by the juicy, sweet-and-sour hawthorn flesh in perfect balance. Meanwhile, naturally frozen pears, thawed in clear water, allow you to sip natural sweet juice from a small bite\u2014refreshingly sweet and icy, making it an excellent post-skiing treat to cleanse the palate.", "name": "Northeastern Candied Haws \u0026 Frozen Fruits Stall", "transport": "Take a taxi from Yabuli Railway Station for about 15 minutes to reach the market."}, {"address": "Stall at the lower station of Sanguankui Cable Car, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 stars | An immensely popular stall filling the snowy air with tempting meaty aromas. Made from premium pork and secret spices, these authentic sausages are grilled on hot slates until glossy, plump, and popping at the skin. Each bite delivers a satisfying snap, followed by overflowing juices and rich garlic flavor, with a firm, chewy, and smoky texture. Walking through the snow holding a steaming grilled sausage brings simple yet incomparable happiness and a quick energy boost.", "name": "Yabuli Mountain Grilled Sausage Stand", "transport": "Take the internal resort shuttle bus to the lower station of the Sanguankui Cable Car."}, {"address": "Middle Section of Qingyun Town Pedestrian Street, Yabuli Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 stars | An old-fashioned stall whose rich charcoal aroma can be smelled from afar. Using Northeastern waxy corn and red-fleshed sweet potatoes, they slowly roast them in specialized charcoal barrels. The sweet potatoes are roasted until the skin is charred and oozing syrup; peel open the aromatic skin to reveal golden, velvety, honey-sweet flesh. The roasted corn features plump, chewy kernels with a subtle smoky charred fragrance. Holding a piping hot roasted sweet potato warms both your hands and stomach, making it the most heartwarming street dessert in winter.", "name": "Snowy Charcoal Roasted Corn \u0026 Sweet Potato Stall", "transport": "Take the local public bus from Yabuli South Station to Qingyun Town Pedestrian Street."}, {"address": "No. 08, Folk Specialty Food Street, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A snack stall showcasing authentic Northeastern rustic charm. The sticky bean buns (Niandoubao) are made from ground yellow sticky millet and glutinous sorghum flour wrapped around red bean paste, then steamed over large wood-fired cauldrons or pan-fried to a golden crisp. They have a stretchy, chewy, and soft texture, blending the natural grain aroma of yellow millet with the subtle sweetness of red beans. The freshly fried cakes are crispy outside and tender inside, steaming with sweet red bean paste when bitten open. Visitors who love glutinous desserts and traditional snacks definitely shouldn\u0027t miss this classic treat.", "name": "Traditional Wood-fired Niandoubao \u0026 Fried Cake Stall", "transport": "Take a city bus from Yabuli Bus Station for about 10 minutes to Folk Food Street."}, {"address": "Next to Tiyu South Road Leisure Square, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A popular stall serving warm Northeastern breakfasts and all-day snacks. The vendor spreads mung bean batter thinly onto a round flat-top griddle, cracks a fresh egg over it, sprinkles black sesame seeds and chopped scallions, flips it, brushes it with special sweet bean sauce and fermented bean curd paste, then wraps it around crispy cracker sheets and sausage. Biting down offers distinct layers\u2014soft on the outside, crispy inside, and rich with savory sauce. Paired with a hot cup of freshly ground soy milk, every bite and sip instantly dispels the harsh chill of the ski slope.", "name": "Hot Jianbing Guozi \u0026 Fresh Soy Milk Stand", "transport": "Walk to Tiyu South Road Leisure Square in the resort to spot the prominent yellow stall."}, {"address": "Specialty Market, Ice and Snow Cultural Square, Yabuli Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A street food stall offering Harbin-style treats infused with Russian flavor. The classic Harbin red sausage is garlic-infused and smoked, featuring crispy skin and tender meat with a rich garlic and woodsmoke aroma, served neatly cut into convenient bite-sized pieces in a box. The large bread (Dalieba) has a firm crust and a dense interior with a subtle sourdough tang. Paired together, the savory meat and wheat flavor harmonize into a hearty, satisfying snack that is extremely convenient to eat while exploring the market.", "name": "Harbin Red Sausage \u0026 Mammoth Bread Kiosk", "transport": "Take the resort loop shuttle bus to Ice and Snow Cultural Square Station."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Yabuli Ski Resort"}};
        const themeHex = "#6b7280";
        const cityName = "Harbin";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
