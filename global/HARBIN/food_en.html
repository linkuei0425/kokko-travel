ory, juicy, and delightfully chewy. Paired with freshly pulled espresso topped with fresh milk foam, the robust coffee aroma cuts through any richness, making this immersive brunch option highly recommended by tourists and local foodies alike.", "name": "Daowai Memory Western Restaurant \u0026 Cafe (\u9053\u5916\u8a18\u61b6\u897f\u9910\u5496\u5561\u5ef3)", "transport": "Take Metro Line 3 to Chinese Baroque District Station, then walk for about 6 minutes."}, {"address": "No. 36 Bei\u0027erdao Street, Daowai District, Harbin City", "feature": "\u2b50 4.2 stars | A sun-drenched corner cafe set in a historic house, famous for delicate handcrafted waffles and specialty coffees. The \u0027Ice Cream Americano\u0027 melts rich vanilla ice cream into slightly bitter Americano for a cool, creamy, bittersweet contrast. Paired with freshly baked \u0027Strawberry Waffles\u0027 that are crispy outside, fluffy inside, and full of rich egg flavor, it\u0027s the most healing pit stop when exploring the old streets.", "name": "Sunlight Corner Cafe (\u967d\u5149\u89d2\u843d\u5496\u5561)", "transport": "Take Bus 19 or 64 to Daowai Erdao Street Station, then walk for about 2 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Intersection of Nanxun Street and Toudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Founded in 1902 during the Guangxu reign, this century-old establishment is one of the most iconic local restaurants in Old Daowai. Its signature tofu buns and pork rib buns feature paper-thin dough packed with juicy, flavorful fillings that burst with delicious soup upon the first bite. The Crispy Sweet and Sour Pork (Guo Bao Rou) is fried to a golden crunch\u2014crispy outside, tender inside, and perfectly tossed in a fragrant tangy sauce, making it a favorite among locals and tourists alike.", "name": "Zhang Bao Pu Buns \u0026 Local Dishes", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 5 minutes."}, {"address": "No. 128 Sandao Street, Baroque Block, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A historic Northeast Chinese brand established in 1912, famous for its traditional three-delicacies steamed dumplings. The dumpling skin is delightfully springy, wrapping a filling of premium pork, fresh shrimp, and chives that releases rich, savory juices without feeling greasy. Adorned with nostalgic vintage decor, it offers authentic regional foods like traditional clear sheet jelly noodles and smoked cold cuts for a true Northeast dining experience.", "name": "Fan Ji Yong Dumpling House", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, Exit 1, then walk for about 6 minutes."}, {"address": "Near the intersection of Jingyu Street and Toudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Hidden in the alleys of Old Daowai, this wildly popular eatery specializes in braised pork bones. Their signature bone-in pork ribs are slow-cooked for hours in a secret master broth until the meat tenderly falls off the bone with deep, savory aromas. Foodies love using a straw to sip the rich, silky, collagen-packed bone marrow. Paired with a bowl of noodle soup or rice, it offers complete culinary satisfaction.", "name": "Fuqiang Bone Marrow Restaurant", "transport": "Take Bus 1 or 28 to Jingyu Street Station, then walk for about 3 minutes."}, {"address": "Inside Chinese Baroque Block, Nan-er-dao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A unique restaurant blending century-old Chinese Baroque architecture with modern craft beer culture and bistro dining. Here, you can savor creative twists on traditional Northeast dishes, such as special Songhua River beer duck and smoked meat platters, packed with rich layers of flavor. Beautifully illuminated at night with a fantastic ambiance, it serves local craft beers and cocktails\u2014making it a top choice for a nightcap after strolling the historic streets.", "name": "De Ding Feng Baroque Bistro", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 4 minutes."}, {"address": "No. 39 Toudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | A time-honored Harbin local eatery that has stuck to freshly hand-crafting and steaming buns for decades. The pork buns feature soft, elastic dough wrapped around firm, juicy meat infused with scallion aromas. Pair them with a piping hot bowl of mutton soup or hot and sour soup for a refreshing and hearty meal. High value for money and warm hospitality make this a must-visit for authentic local flavors.", "name": "Lao Tou Bao Zi Buns \u0026 Soups", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 5 minutes."}, {"address": "No. 50 Nansandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A local restaurant specializing in classic Harbin heritage cuisine, recreating authentic local flavors from decades ago. Featured dishes include Di San Xian (saut\u00e9ed potato, eggplant, and pepper), Demoli braised fish, and quick-fried pork strips. The Di San Xian has a slightly crisp exterior with tender eggplant coated in savory sauce, offering rich textures without feeling heavy. The vintage decor recreates old streetscapes, letting you savor history alongside great food.", "name": "Cheng Lian Lao Dao Wai Local Cuisine", "transport": "Take Bus 107 or 108 to Nansandao Street Station, then walk for about 2 minutes."}, {"address": "No. 22 Beitoudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | Located in the heart of the historic Baroque district, this traditional restaurant is renowned for its skillful heat control and authentic Northeast cooking techniques. Signature dishes like crispy fried pastry twists and soft-fried pork tenderloin are light, non-greasy, and intensely aromatic when paired with seasoned salt. The cozy, bustling atmosphere makes it a top pick for diners seeking genuine Harbin flavors.", "name": "Bei Tou Dao Jie Vintage Restaurant", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 7 minutes."}, {"address": "No. 26 Nan-er-dao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A bar and bistro fusing Northeast folk delicacies with modern craft beer culture. Serving freshly grilled local skewers, smoked meat pancakes, and custom Harbin red sausage platters, all savory and ideal to pair with drinks. The interior retains the high ceilings and exposed brick walls of historic Baroque architecture, complete with live folk music at night\u2014an unbeatable venue to experience the charming mix of old and new.", "name": "Baroque Craft Beer \u0026 Folk Bistro", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk for about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 188 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Tucked away next to the Chinese Baroque architectural complex in Old Daowai, this vegetarian restaurant is famous for its exquisite mock-meat dishes and vegan homestyle cooking. The signature \u0027Vegan Sweet and Sour Ribs\u0027 are crafted from lotus root and soy products; the exterior is fried to ultimate crispiness, while the inside remains juicy with an amazingly satisfying chew, coated in a rich sauce with a perfect balance of sweet and sour. Local residents and health-conscious tourists highly praise its refreshing, non-greasy cooking style, and its elegant, quiet ambiance makes it an ideal spot to relax after strolling through the historic streets.", "name": "Lianhua Vegetarian Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 Exit 1, and walk about 300 meters."}, {"address": "No. 56 Nansidao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Beloved by local vegetarians, Cihang Vegetarian House focuses on plant-based twists on traditional Northeastern dishes. The crowd-favorite \u0027Vegan Crispy Pork (Guo Bao Rou)\u0027 is crafted using lion\u0027s mane mushrooms and custom soy protein, featuring a golden, mouthwatering crust that is crisp on the outside and tender on the inside. Taking a bite yields a crunchy sound followed by a burst of specially blended fruity sweet-and-sour sauce, rivaling the traditional recipe in flavor. Tourists praise its remarkable authenticity and refreshing taste, making it a must-visit spot to experience the harmonious fusion of Northeastern cuisine and plant-based dining.", "name": "Cihang Vegetarian House", "transport": "Take Bus Line 1, 28, or 206 to \u0027Nanshiqidao Street Station\u0027, then walk about 4 minutes."}, {"address": "No. 88 Nansandao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Seamlessly blending the vintage charm of the historic Chinese Baroque district with modern Zen-inspired vegetarian cuisine. The specialty dish \u0027Bountiful Harvest Vegan Steamed Dumplings\u0027 features wrappers vibrantly colored with natural vegetable juices, filled with finely diced shiitake mushrooms, wood ears, and water chestnuts. Soft skin and crunchy, juicy filling deliver a subtle, natural aroma of grains upon entry. Renowned for its elegant dining space and artistic plating, it has become a hot spot for travelers seeking aesthetic photo opportunities and refined plant-based gastronomy.", "name": "Jingxin Vegetarian Aesthetics House", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027, then walk about 5 minutes."}, {"address": "Inside Beisandao Street Market, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Brimming with the vibrant street-life atmosphere of old Harbin, this nostalgia-filled food stall specializes in traditional breakfast fare suitable for strict vegans. The signature \u0027Vegan Tofu Pudding\u0027 is silky smooth like white jade when scooped, topped with a rich savory gravy simmered from mushrooms and wood ears. It melts in your mouth with a comforting mushroom umami and gentle soybean aroma. Pair it with an aromatic bowl of fried-flour tea (You Cha) with a thick, velvety texture. This unique traditional street food spot is deeply loved by visitors looking to experience authentic Northeastern breakfast culture.", "name": "Old Daowai Vegan Tofu Pudding \u0026 Oil Tea Stall", "transport": "Take Bus Line 19 or 64 to \u0027Daowai Sandao Street Station\u0027, then walk about 2 minutes."}, {"address": "No. 230 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Focusing on health-conscious vegetarian dishes and Zen tea experiences, this restaurant preserves the architectural beauty of traditional courtyard houses in Old Daowai. The must-try \u0027Vegan Di San Xian (Three Treasures from the Earth)\u0027 pan-roasts eggplants, potatoes, and bell peppers with precise temperature control to reduce oiliness. The eggplant becomes soft and tender, while the potatoes are fluffy and smooth, all coated in a savory-sweet sauce that delivers rich flavor without feeling heavy. Many travelers exploring the historical Baroque district love to stop here for a light, fulfilling vegan feast.", "name": "Miaoyin Zen Vegetarian Restaurant", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027, then walk along Jingyu Street for about 6 minutes."}, {"address": "No. 15 Dongzhi Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | This high-value vegetarian buffet offers over forty freshly prepared vegan stir-fries, staple foods, and hot soups. The wildly popular \u0027Spicy Vegan Dry Pot\u0027 brings together alpine cabbage, lotus root slices, frozen tofu, and bean curd sheets, stir-fried over high heat to impart an enticing wok hei (smokiness). It is spicy, savory, crisp, and delightfully appetizing. With a wide variety of choices and affordable prices, it serves as a daily canteen for locals and a top choice for backpackers seeking budget-friendly plant-based meals.", "name": "Shuxiangyuan Healthy Vegetarian Buffet", "transport": "Take Bus Line 6 or 74 to \u0027Dongzhi Road Station\u0027, then walk about 3 minutes."}, {"address": "No. 12 Nanerdao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Combining classical tea arts with high-end vegetarian dining, this sophisticated establishment is housed inside a meticulously restored vintage Baroque building. The recommended dessert, \u0027Vegan Handmade Jujube Cake\u0027, contains no eggs or dairy and is handcrafted using premium Xinjiang red dates. Its texture is springy and soft; biting into it delivers a warm, dense softness with rich date aromas and dark sugar sweetness spreading across the palate without being overly sweet. Tourists can enjoy delicious plant-based food while appreciating the seamless blend of Harbin\u0027s traditional architecture and modern tea culture.", "name": "Yuanqi Suxin Vegetarian \u0026 Tea House", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 Exit 2, then walk about 4 minutes."}, {"address": "No. 102 Taigu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A cozy vegetarian restaurant emphasizing natural flavors and additive-free dishes. The signature \u0027Black Truffle Wild Mushroom Vegan Fried Rice\u0027 uses high-quality Northeastern rice, cooked so each grain is distinct, aromatic, and pleasantly chewy. Paired with generous black truffle sauce, diced premium shiitake mushrooms, and pine nuts, every bite leaves a lingering scent and rich layers of tantalizing mushroom aromas. This light yet refined culinary experience is highly favored by young plant-based enthusiasts and traveling families, making it a culinary spot not to be missed when exploring Old Daowai.", "name": "Lily Vegan Restaurant", "transport": "Take Bus Line 26 or 73 to \u0027Taigu Street Station\u0027, then walk about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Chinese Baroque District, No. 228 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | An absolute must-try walking treat when visiting the Chinese Baroque district! Extremely rich and milky with a dense, silky texture that melts in your mouth without excessive artificial sweeteners. In the freezing Northeast winter with temperatures tens of degrees below zero, strolling through century-old Baroque architecture with a rich popsicle in hand\u2014an ultimate \u0027the colder it gets, the more ice cream you eat\u0027 experience\u2014is deeply loved by both tourists and locals.", "name": "Modern Hotel Popsicles (Chinese Baroque Flagship Stall)", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 (Exit 1), then walk for about 3 minutes."}, {"address": "Near the intersection of South 3rd Street and Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Tucked away in an old street alley, this fried cake stall is a classic childhood treat for locals. Made from sticky rice dough fried at high heat until golden and crispy, each bite offers a satisfying crunch followed by dense, sweet red bean paste and a chewy glutinous rice layer. Served piping hot, sweet yet not cloying, its rich contrast of crispy outside and soft inside turns first-timers into lifelong fans.", "name": "Laodaowai Xu\u0027s Fried Rice Cake", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027, walk along Jingyu Street to South 3rd Street, and you\u0027ll spot it."}, {"address": "Inside Chinese Baroque Pedestrian Street, South 2nd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | One of Harbin\u0027s most authentic street teppanyaki snacks! Chewy, springy cold noodle sheets are placed on a hot griddle, topped with a freshly cracked egg fried to a golden crisp, brushed with the stall\u0027s signature sweet, sour, and spicy sauce, and sprinkled with diced onions, cilantro, and sausage before being rolled up and sliced. Savory, sweet, tangy, and spicy flavors intertwine with a delightfully crispy edge and chewy texture\u2014an indispensable piping-hot snack as you stroll through the old street.", "name": "Old Street Authentic Grilled Cold Noodles", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk about 4 minutes into the heart of the pedestrian street."}, {"address": "Intersection of South 4th Street and Baroque Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A traditional walking snack rich in Northeast folk flavor. Carefully selected yellow millet and glutinous rice are kneaded into dough, wrapped around smooth house-cooked red bean paste, and steamed. Fresh out of the steamer, these buns feature thin skins, generous filling, and a delightfully sticky, chewy texture that exudes the natural aroma of grains and sweet red beans. Dipped lightly in sugar, their soft, sweet warmth comforts the hearts of many travelers.", "name": "Xu\u0027s Traditional Sticky Bean Buns", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk about 5 minutes to arrive."}, {"address": "Along Jingyu Street, Chinese Baroque Historic and Cultural District, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | A traditional street dessert in Laodaowai that delights both the eyes and taste buds. Plump, large hawthorns are skewered and coated with a thin, crystal-clear layer of caramelized sugar. The candy shell gives a satisfying \u0027snap\u0027 upon biting, followed by juicy, refreshingly tart and sweet hawthorn. Balanced perfectly without sticking to your teeth, it\u0027s the most popular street food photo prop while capturing Baroque architecture in winter.", "name": "Time-Honored Traditional Tanghulu Stall", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027; walk along the main Jingyu Street after exiting to find multiple stalls."}, {"address": "Inside Chinese Baroque District, South 1st Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A unique street pairing combining Russian flair with local Harbin flavor. Freshly poured Kvass, naturally fermented from barley and rye bread, offers a lightly bubbly finish with a rich toasted-bread aroma. Paired with sliced traditional dense \u0027Dalieba\u0027 sourdough bread spread with custom jam or butter, it delivers a sturdy, satisfying chew that grows more flavorful with every bite, exuding exotic historical charm.", "name": "Qiulin Kvass \u0026 Dalieba Bread Stall", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk for about 2 minutes."}, {"address": "Near the market entrance of North 3rd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A nostalgic street food fondly remembered by old Daowai locals. Wheat flour is slow-roasted with sesame oil and tallow until golden and fragrant, then whisked with boiling water into a thick, comforting porridge topped with crispy sesame seeds, crushed peanuts, and sunflower seeds. Smooth, warm, and savory with delicate nutty aromas, enjoying a bowl in cold weather instantly warms your entire body, evoking the true everyday life of old Harbin.", "name": "Laodaowai Traditional Roasted Flour Tea (You Cha Mian)", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk about 6 minutes to the edge of North 3rd Street."}, {"address": "Intersection of Jingyu Street and South 5th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | A savory street snack representing the culinary soul of Harbin! Made from premium pork and garlic, slowly wood-smoked over fruitwood, the red sausage features a taut, lightly crisp casing. When sliced, the meat is bouncy, firm, savory, and juicy, infused with signature garlic notes and natural woodsmoke aroma. Stalls offer sliced-to-order bagged portions perfect for eating on the go, making it an immensely popular market staple.", "name": "Fresh-Cut Harbin Red Sausage Stall", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk east along Jingyu Street for about 6 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Lao Daowai Chinese Baroque Historic District"}, "nangang_gogol": {"categories": {"cat_1": {"items": [{"address": "No. 7 Wenfu Street, Nangang District, Harbin City", "feature": "\u2b50 4.7 stars | Lao Chu Jia is a famous birthplace of authentic Northeast Chinese cuisine in Harbin, best known for its legendary signature dish, \"Guo Bao Rou\" (Crispy Sweet and Sour Pork). The pork is fried to absolute crispy perfection, making a satisfying crunch with every bite, while the tender pork tenderloin inside stays juicy, coated in a perfectly balanced sweet and sour sauce that is rich yet never greasy. The restaurant\u0027s decor retains Harbin\u0027s rich historical charm, displaying vintage photos and antique artifacts, allowing tourists and locals alike to deeply experience the city\u0027s century-old culinary culture while savoring classic dishes.", "name": "Lao Chu Jia", "transport": "Take Metro Line 2 to Provincial Museum Station; it\u0027s about a 10-minute walk after exiting."}, {"address": "No. 12 Xidazhi Street, Nangang District, Harbin City", "feature": "\u2b50 4.6 stars | Located in the heart of the Nangang commercial area, Portman Restaurant is an iconic old-brand destination for authentic Russian cuisine. The classic must-order \"Pot-Stewed Beef\" is slow-cooked until melt-in-your-mouth tender, filling your palate with rich tomato and beef aromas. Pair it with crispy yet tender \"Pot-Stewed Shrimp\" and rich \"Borscht\" for a pleasantly tangy and savory meal. The interior recreates a Russian palace style, with ornate wood carvings and live music creating an elegant, nostalgic dining atmosphere favored by foodies craving authentic exotic flavors.", "name": "Portman Restaurant", "transport": "Take Metro Line 1 or Line 2 to Museum Station; walk for about 2 minutes from Exit 3."}, {"address": "No. 319 Dongdazhi Street, Nangang District, Harbin City", "feature": "\u2b50 4.8 stars | Qiulin Company is Harbin\u0027s most iconic century-old brand, and its Food Hall is the ultimate hub for local traditional treats. Its famous \"Dalieba\" (large sourdough bread) features a firm, chewy crust infused with rich hop aromas and a natural tang; meanwhile, \"Qiulin Red Sausage\" is renowned for its bold garlic flavor, firm texture, charcoal smokiness, and juicy chew. Whether for locals buying daily groceries or tourists seeking quintessential Harbin souvenirs, this is an unmissable iconic landmark.", "name": "Qiulin Food Hall", "transport": "Take Metro Line 1 to Museum Station; walk for about 3 minutes from Exit 2."}, {"address": "No. 100 Guangmang Street, Nangang District, Harbin City", "feature": "\u2b50 4.5 stars | A classic establishment rooted in Nangang District for years, Maomao has won over countless diners with its secret-recipe smoked meat and freshly baked flatbreads. Premium pork is marinated and smoked through multiple steps, producing reddish, juicy slices that are rich without being greasy, packed with woodsmoke aroma. The freshly made flatbreads are golden and crispy outside, layered and chewy inside. Spread sweet bean sauce over hot smoked meat, wrap it inside the flatbread with shredded scallions, and take a bite\u2014the sweet rendered fat and scallion aroma combine into an ultimate local comfort food.", "name": "Maomao Smoked Meat \u0026 Flatbread", "transport": "Take Metro Line 1 to The First Affiliated Hospital of Harbin Medical University Station; walk for about 8 minutes after exiting."}, {"address": "No. 338 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.4 stars | Lao Chang Chun Bing is a celebrated heritage brand in Harbin that perfectly showcases Northeastern Chinese wrap culture. The restaurant offers paper-thin, translucent \"Chun Bing\" (spring pancakes) and flaky, chewy \"Jin Bing\" (stretched pancakes)\u2014both made fresh to order and served piping hot. The classic way to eat is wrapping stir-fried mixed vegetables, shredded pork in sweet bean sauce, and tender scrambled eggs inside the pancake. Soft wrappers, savory-juicy fillings, and crunchy sprouts explode with flavor for a wonderfully layered local culinary experience.", "name": "Lao Chang Chun Bing", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station; walk for about 6 minutes."}, {"address": "No. 55 Guangmang Street, Nangang District, Harbin City", "feature": "\u2b50 4.3 stars | Founded around the late Qing Dynasty and early Republic period, Fan Ji Yong is a historic dumpling house steeped in tradition. Its signature \"Three Delicacies Dumplings\" (San Xian Dumplings) feature thin, chewy wrappers stuffed with fresh pork, shrimp, and Chinese chives. One bite bursts with rich, sweet, and savory juice. In addition to dumplings, their Northeastern cold appetizers and traditional stir-fries are equally impressive. Through over a century of hand-making dumplings with genuine ingredients, it remains a favorite among locals and travelers.", "name": "Fan Ji Yong Dumpling House", "transport": "Take Metro Line 1 to Museum Station; walk for about 10 minutes."}, {"address": "No. 57 Toudao Street, Nangang District, Harbin City", "feature": "\u2b50 4.6 stars | Located near Gogol Street, Lucia Western Restaurant resembles a well-preserved Russian private museum. The Russian cuisine here inherits home-style recipes passed down by older generations of expatriates. The classic \"Baked Fish with Cream\" features tender, silky fish blanketed in rich cream and cheese aroma for a smooth, velvety taste. Paired with house-made black bread and Kvass, the tangy, lightly fermented flavors clear the palate delightfully. Filled with historical artifacts and retro furniture, the warm and elegant setting makes dining feel like stepping back into the romantic era of old Harbin.", "name": "Lucia Western Restaurant", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station; walk for about 8 minutes."}, {"address": "No. 200 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.5 stars | Dazhong Roulian is one of Harbin\u0027s legendary century-old cooked meat brands, and its Gogol Street branch is always bustling. Its signature \"Harbin Red Sausage\" is traditionally smoked over fruitwood, featuring a dry, slightly snappy casing and a firm, juicy meat filling infused with a distinctive garlic and smoky aroma. Another popular hit, \"Tea Sausage\", offers a finer, softer texture. Whether served as a savory beer snack or sliced for a quick bite on the go, these delicacies showcase Harbin\u0027s unique charcuterie craft and heritage flavors.", "name": "Dazhong Roulian Specialty Shop", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station; walk for about 5 minutes after exiting."}], "name": "Famous Local Traditional Shops"}, "cat_2": {"items": [{"address": "No. 167 Gexin Street, Nangang District, Harbin City", "feature": "\u2b50 4.7 stars | A cozy independent cafe located near Gexin Street, famous for its exquisite pour-over single-origin coffees and freshly baked desserts. The interior creates a strong retro artistic vibe, making it a favorite among hipsters and tourists alike. Their signature pour-over coffee uses premium light-roast beans, delivering bright citrus acidity, sweet floral notes, and a smooth, refreshing finish. Paired with a freshly baked Basque cheesecake\u2014creamy, rich, and melting on the tongue with soft cheese aromas\u2014it is the perfect spot in Nangang District to enjoy a relaxing brunch or afternoon leisure.", "name": "Deer Fish Coffee", "transport": "Take Metro Line 2 to Gexin Street Station, then walk for about 5 minutes."}, {"address": "No. 78 Gongsi Street, Nangang District, Harbin City", "feature": "\u2b50 4.6 stars | A minimalist wooden-style cafe near Harbin Institute of Technology, serving as a hidden gem for local students and coffee enthusiasts. The cafe specializes in custom signature coffees and Japanese-style light brunch. The most popular item, the \u0027Sea Salt Caramel Latte,\u0027 features ultra-creamy milk foam with a rich, layered blend of sweet and salty flavors. Paired with freshly baked waffles featuring a crispy crust, moist interior, and a spread of rich butter, every bite brings pure bliss.", "name": "Yimu Coffee", "transport": "Take Metro Line 1 to HIT (Harbin Institute of Technology) Station, then walk for about 8 minutes."}, {"address": "No. 208 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.5 stars | Situated in the heart of Gogol Street, this specialty cafe exudes a rich Russian ambiance. The exterior architecture and interior decor seamlessly blend Russian vintage artistic elements, making you feel as if you are standing on the streets of Moscow. Beyond high-quality Russian espresso, its Russian brunch is a must-try for tourists\u2014especially the freshly made Russian pancakes (Blini) with red caviar. Featuring a golden, slightly crispy crust, tender chew, and savory caviar bursting with flavor, it delivers an incomparable, authentic exotic taste.", "name": "Suburbs of Moscow Cafe", "transport": "Take Metro Line 2 to Provincial Hospital Station, then walk for about 6 minutes."}, {"address": "No. 284 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.4 stars | Tucked away inside an old historic building on Gogol Street, this classic cafe \u0026 bistro carries Harbin\u0027s deep history of Russian emigrant culture. It serves exquisite Russian brunch and signature crafted drinks. The flagship \u0027Russian Dalieba (Sourdough Bread) with Black Coffee\u0027 is a perfect match\u2014the sourdough crust is crispy and chewy, while the inside is soft and aromatic. Dipped in rich butter or paired with slightly tangy dark black coffee, the subtle bitterness and wheat sweetness interweave on the palate for a deeply memorable taste.", "name": "Old Russian Cafe \u0026 Bistro", "transport": "Take Bus 8 or 18 to Gexin Street Stop, then walk for about 3 minutes."}, {"address": "No. 12 Xuefu 3rd Street, Nangang District, Harbin City", "feature": "\u2b50 4.8 stars | A highly popular, premium brunch cafe in the Nangang Commercial Area, drawing foodies with its bright, modern minimalist aesthetic and exquisite presentation. Their \u0027Flat White\u0027 boasts incredibly fine microfoam, perfectly blending nutty coffee bean aromas with rich milk for a silky smooth mouthfeel. The popular brunch dish \u0027Avocado Poached Egg Toast\u0027 uses freshly baked sourdough bread\u2014the crispy base topped with creamy avocado mash and a silky, runny poached egg creates a rich yet light and burden-free flavor profile.", "name": "Hestia Cafe \u0026 Brunch", "transport": "Take Metro Line 1 to Xuefulu Station, then walk for about 7 minutes."}, {"address": "No. 369 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.3 stars | A classic chain cafe located on Gogol Street, renowned for its spacious, romantic high-ceiling interior and warm wooden atmosphere lit by crystal chandeliers. Offering a wide selection of brunch options, its most popular \u0027Waffle Brunch Platter\u0027 is made to order\u2014crispy on the outside, soft on the inside, with a rich egg and butter aroma drizzled with Canadian maple syrup. Paired with an aromatic cold brew coffee, the chilling, slightly tart yet sweet finish perfectly balances the sweetness, making it ideal for gatherings with friends.", "name": "Maan Coffee (Gogol Branch)", "transport": "Take Metro Line 2 to Workers\u0027 Cultural Palace Station, then walk for about 4 minutes."}, {"address": "No. 418 Gogol Street, Nangang District, Harbin City", "feature": "\u2b50 4.5 stars | Adjacent to the Nangang Yuan Da Shopping Center, this popular brunch spot is filled with lush greenery and a sunroom vibe. The signature \u0027Dirty Coffee\u0027 pours hot espresso gently into cold milk; the first sip yields a bold, bitter coffee aroma that gradually transitions into a smooth, milky finish. Pair it with a sizzling hot \u0027American All-Day Breakfast,\u0027 featuring pan-fried bacon, juicy German sausages, and fluffy scrambled eggs\u2014the rich, savory meat flavors and generous portions will completely re-energize your morning.", "name": "Time \u0026 You Cafe \u0026 Brunch", "transport": "Take Metro Line 1 to Museum Station, then walk for about 5 minutes."}, {"address": "No. 328 Dong Dazhi Street, Nangang District, Harbin City", "feature": "\u2b50 4.2 stars | Located in the core of the Nangang Museum Commercial Area, this classic cafe exudes a rich French romantic charm. It offers high-quality espresso drinks and French baked brunch items. The signature \u0027French Croissant\u0027 is made with imported butter, featuring a crispy, flaky crust and a soft, honeycomb interior that bursts with buttery goodness in every bite. Paired with a rich cappuccino topped with aromatic cinnamon powder, the luscious foam makes your entire morning feel filled with French romance.", "name": "Left Bank Cafe", "transport": "Take Metro Line 1 or Line 2 to Museum Station, Exit 1, then walk for about 2 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 12 Xidazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Located in the Nangang Museum Commercial Area, this is one of Harbin\u0027s most iconic and authentic Russian bistros. The interior exudes classic Russian royal elegance, accompanied by live accordion and Russian singer performances at night. The signature pot-braised beef is stewed until melt-in-your-mouth tender, featuring rich, savory beef cubes paired with sour cream and borscht with rich, tangy, and beautifully layered flavors. The pan-seared foie gras with red wine has a dense, velvety texture that melts on the tongue, deeply captivating both tourists and local gourmets.", "name": "Portman Western Restaurant", "transport": "Metro Line 1 \u0027Museum Station\u0027, Exit 3, approx. 200m walk"}, {"address": "No. 177 Wenchang Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | The founding legend of Northeast and Harbin local cuisine, and the original birthplace of the iconic classic dish \u0027Guo Bao Rou\u0027 (Crispy Sweet and Sour Pork). Its signature Guo Bao Rou features a golden, crispy crust that crackles pleasantly with every bite, wrapping around tender, juicy pork tenderloin coated in a perfectly balanced, sweet and tangy sauce. Paired with refreshing Northeast Sheet Jelly (Lapi) and unique deep-fried ice pops, the surprising contrast of hot and cold textures makes it an absolute must-try when exploring authentic old Harbin flavors.", "name": "Lao Chu Jia Restaurant - Wenchang Branch", "transport": "Take Bus 115 or 121 to \u0027Wenchang Street Station\u0027 and walk approx. 150m"}, {"address": "Inside Hongbo Plaza, No. 320 Dongdazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located inside the Nangang Hongbo Commercial Area, this stylish bistro fuses traditional Russian dining with modern chic style. The dark wooden interior is full of texture and character, offering a wide selection of vodka cocktails and authentic Russian delicacies. The must-order Russian pot-braised prawns are firm and snappy, absorbing the rich, savory house sauce. The Russian BBQ platter is charred on the outside and juicy on the inside, best enjoyed alongside soft cheese bread and Russian craft beer. Its romantic ambiance makes it a favorite among couples and travelers.", "name": "Russia Kitchen - Nangang Hongbo Branch", "transport": "Directly connected to Hongbo Underground Commercial Street via Metro Line 1 or 3 \u0027Museum Station\u0027"}, {"address": "No. 208 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Situated in the historical district of Gogol Street, this exquisite bistro is rich with the nostalgic Russian charm of old Harbin. The signature charcoal-grilled Russian mega-skewers are bursting with aroma\u2014thick, chewy, and seasoned to perfection with special Russian spices. Paired with craft Russian wheat beer and garlic baguette that is crispy outside and soft inside, it offers a satisfying, rich taste experience. It\u0027s a prime destination for evening gatherings with friends to enjoy authentic Russian bistro culture.", "name": "Medvege Russian Bistro", "transport": "Metro Line 1 \u0027First Affiliated Hospital of HMU Station\u0027, Exit 2, approx. 500m walk"}, {"address": "No. 112 Gexin Street (near Gogol Street), Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Adjacent to the Gogol Street Commercial Area, this venue artfully blends old Harbin Russian architectural elements with a modern bistro vibe. The Russian pot-braised lamb here has zero gamey taste; stewed until tender and melt-in-your-mouth soft, it absorbs the rich essence of tomatoes and fresh vegetables. The classic black bread spread with special herb butter delivers an intricate blend of tangy and creamy flavors with a hearty, satisfying texture\u2014making it an excellent spot for relaxing drinks and experiencing Harbin\u0027s exotic, tipsy nightlife.", "name": "Manticar Russian Bistro", "transport": "Take Bus 8 or 18 to \u0027Gexin Street Station\u0027 and walk approx. 200m"}, {"address": "No. 58 Fenbu Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located on a historic core street in Nangang District, this eatery specializes in classic Guandong local dishes and traditional Northeast stir-fries. The signature Stewed Chicken with Wild Hazel Mushrooms uses wild hazel mushrooms and free-range native chicken, resulting in a savory, rich broth, tender meat, and handmade glass noodles that soak up the flavorful juices. The Pork Feast (\u0027Shazhucai\u0027) and Demoli Stewed Fish are also exceptional, served in incredibly generous portions with rich, savory flavors that perfectly embody the bold and hearty dining culture of the Northeast.", "name": "Chuang Guandong Old Local Restaurant", "transport": "Metro Line 1 \u0027Railway Bureau Station\u0027, Exit 1, approx. 450m walk"}, {"address": "No. 358 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Nestled in the Gogol Street Commercial Area, vintage Russian oil paintings and live accordion performances create a captivating foreign atmosphere. The Russian Baked Cod with Cream is highly recommended\u2014the fish is tender and silky, covered in a velvety, rich cream sauce. Paired with a refreshing Moscow salad and Russian red wine, layers of rich flavors bloom on the palate. It is a dream location for an exotic dinner after strolling along Gogol Street.", "name": "Katusha Russian Bistro - Gogol Branch", "transport": "Take Bus 7 or 13 to \u0027Gogol Street Station\u0027 and walk approx. 100m"}, {"address": "No. 288 Xuanhua Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | An iconic traditional local restaurant near the Nangang Commercial Area. The heart and soul of the menu\u2014the smoked pork\u2014is prepared using secret traditional herbs and wood-smoking techniques; it is rich without being greasy, cooked until tender, and infused with a delightful fruity wood aroma. Wrapped in freshly baked golden crispy flatbreads with special sweet bean sauce and fresh scallions, every bite offers a fragrant, crispy, and soft texture that is passionately recommended by both locals and tourists.", "name": "Maomao Smoked Meat \u0026 Pancake Restaurant", "transport": "Take Bus 24 or 201 to \u0027Xuanhua Street Station\u0027 and walk approx. 120m"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Near the intersection of Gexin Street and Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A highly popular vegetarian buffet near the Gogol Commercial District, famous for its rich variety of Dongbei (Northeastern)-style vegetarian dishes and healthy ingredients. The signature dish, \u0027Vegetarian Crispy Sweet and Sour Pork\u0027 (Su Guo Bao Rou), is crispy on the outside and tender on the inside, crunching loudly with every bite. Paired with a perfectly balanced sweet and sour sauce, its texture rivals real meat, making it a favorite among tourists and local plant-based food lovers alike. The buffet also offers steamed dim sum, freshly stir-fried seasonal vegetables, and steaming nourishing herbal soups, leaving you healthy and satisfied.", "name": "Jingxin Vegetarian Buffet", "transport": "Take Metro Line 2 to \u0027Workers\u0027 Cultural Palace Station\u0027 and walk for about 8 minutes."}, {"address": "No. 105 Youzheng Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A long-standing vegetarian restaurant near Nangang Youzheng Street, specializing in delicate traditional mock-meat dishes and Northern Chinese wheaten pastries. Highly recommended is the \u0027Braised Vegetarian Ribs\u0027, crafted from premium soy products and lotus root. Chewy with a rich savory sauce and a slightly seared, aromatic crust, it offers incredible depth of texture. Friendly service and a warm, cozy atmosphere make this a top choice for everyday dining among locals.", "name": "Miaoxiang Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 (Exit 2), and walk for about 5 minutes."}, {"address": "No. 68 Dacheng Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | An elegant vegetarian eatery near Dacheng Street in Nangang District, focusing on healthy, low-oil, and low-salt dishes. The house specialty, \u0027Mushroom Vegetarian Dumplings\u0027, features chewy wrapper dough packed with juicy filling; biting into them releases a delightful burst of rich mushroom umami and sweet cabbage crunch. The serene, classical atmosphere is perfect for visitors seeking a peaceful moment and healthy delicacies amid the bustling commercial area.", "name": "Ciyuan Vegetarian Restaurant", "transport": "Take Bus No. 7 or 8 to \u0027Dacheng Street Station\u0027 and walk for about 3 minutes."}, {"address": "No. 218 Huayuan Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Located near the Huayuan Street Commercial District, this vegetarian restaurant is famous for its exquisite handmade tofu dishes and vegetarian Northeastern Stew (Daluandun). The \u0027Signature Spicy Tofu\u0027 is silky smooth, with a mouth-numbing, spicy, and fragrant sauce penetrating deeply into the tofu, melting instantly in your mouth with rich soy flavors and an appetizing kick. Many tourists visit specifically to experience these creative dishes that blend bold Dongbei flavors with plant-based cuisine.", "name": "Lianxin Vegetarian", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 (Exit 3), and walk for about 6 minutes."}, {"address": "No. 45 Guangmang Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | A cozy spot on Guangmang Street specializing in great-value buffets and made-to-order plant-based stir-fries. The signature dish, \u0027Stir-fried Vegetarian Eel Shreds\u0027, cleverly uses deep-fried shiitake mushroom stems to achieve a crispy, chewy texture, tossed with a special sweet-and-spicy sauce and refreshing cucumber shreds. Affordable yet full of culinary creativity, it is a highly popular plant-based landmark near Gogol Street.", "name": "Shuxiangyuan Vegetarian Restaurant", "transport": "Take Metro Line 2 to \u0027Workers\u0027 Cultural Palace Station\u0027 and walk for about 7 minutes."}, {"address": "No. 312 Xuanhua Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Located near Xuanhua Street, this cozy restaurant focuses on natural vegetarian dishes that highlight the original, wholesome flavors of ingredients. The popular dish \u0027Golden Vegetarian Cutlet\u0027 is specially prepared with yam and lion\u0027s mane mushroom, fried to golden crispy perfection while remaining juicy and tender inside, delivering a delicious natural mushroom sweetness. Clean and brightly lit, it attracts many young office workers and tourists looking for a guilt-free meal.", "name": "Qingxin Vegetarian Restaurant", "transport": "Take Bus No. 3 or 72 to \u0027Xuanhua Street Station\u0027."}, {"address": "No. 360 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Situated near the heart of Gogol Street, Yangxinzhai combines traditional imperial vegetarian cooking styles with modern plant-based concepts. Its \u0027Pine Nut Emerald Fried Rice\u0027 features distinct, perfectly chewy rice grains tossed with fragrant toasted pine nuts and vibrant green vegetables, offering rich texture and nutty minutes."}, {"address": "1F Takeout Counter, Qiulin Department Store, No. 319 Dong Dazhi Street, Nangang District, Harbin", "feature": "\u2b50 4.8 stars | Located in the heart of the Nangang Qiulin Shopping District, this century-old deli counter always attracts long queues. Freshly sliced fruitwood-smoked red sausages exude rich garlic and charcoal-smoked aromas, featuring firm, springy meat that bursts with juice in every bite. Paired with Dalieba bread\u2014crispy on the outside, soft inside, with a subtle natural sourdough fragrance\u2014it recreates the most authentic Russian-style street snack experience, making it a must-buy treat while strolling down Gogol Street.", "name": "Qiulin Department Store - Sliced Red Sausage \u0026 Dalieba Takeout Counter", "transport": "Take Metro Line 1 to Museum Station (Exit 2), then walk for about 3 minutes."}, {"address": "Near the intersection of Gogol Street and Gexin Street, Nangang District, Harbin", "feature": "\u2b50 4.5 stars | The most eye-catching winter walking snack in Harbin! Fresh hawthorns, yam beans, or strawberries are carefully selected and coated with a paper-thin, glass-like sugar shell. In Northeast China\u0027s freezing air, the sugar glaze instantly turns extra crunchy, making a crisp crunch sound when bitten into. The sweet and sour fruit blends seamlessly with the icy sugar layer, creating a delightful contrast of textures that tourists love.", "name": "Gogol Street Traditional Bingtanghulu Stall", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station, then transfer to Bus No. 8 and get off at Gexin Street Station."}, {"address": "No. 208 Gogol Street, Nangang District, Harbin", "feature": "\u2b50 4.6 stars | Located on Gogol Street, this branch spares you the long queues of the main store on Central Street. Made with pure milk and fresh cream without any artificial puffing agents, it offers a dense, rich texture with a deep milky aroma that is sweet without being greasy. Enjoying a creamy popsicle while strolling through -20\u00b0C streets lets you experience Harbin\u0027s unique charm of \u0027eating ice cream the colder it gets\u0027\u2014a must-try experience in Nangang District.", "name": "Modern Ice Cream - Gogol Street Branch", "transport": "Take Metro Line 1 to Railway Bureau Station (Exit 2), then walk for about 5 minutes."}, {"address": "Wenxing Street (Main Street of Shida Night Market), Nangang District, Harbin", "feature": "\u2b50 4.6 stars | A wild street dish at Shida Night Market with continuous long queues! Pig trotters are first braised with dozens of spices until tender and flavorful, then charcoal-grilled until the skin turns golden and slightly charred, before being generously sprinkled with cumin powder, crushed peanuts, and special chili powder. Crispy skin, tender meat, and packed with collagen, it\u0027s rich, savory, spicy, and non-greasy, leaving a lingering aroma with every bite.", "name": "Shida Night Market - Gao\u0027s Roasted Pig Trotters", "transport": "Take Metro Line 1 to Hexing Road Station (Exit 1), then walk for about 8 minutes."}, {"address": "Intersection of Gogol Street and Ahshihe Street, Nangang District, Harbin", "feature": "\u2b50 4.4 stars | The warmest winter comfort food on the streets of Nangang District, Harbin. Slowly roasted in traditional large iron barrels, a rich caramelized sweet aroma can be smelled from afar. Peel open the charred skin to reveal steaming, golden sweet potato flesh inside. Silky, soft, exceptionally sweet with a subtle smoky charcoal flavor, holding one in your hands keeps you warm while satisfying your taste buds\u2014a beloved local street snack since childhood.", "name": "Gogol Street Roasted Sweet Potato Stall", "transport": "Take Metro Line 1 to Museum Station, then walk for about 7 minutes."}, {"address": "Hexing 3rd Street (Shida Night Market Stall), Nangang District, Harbin", "feature": "\u2b50 4.5 stars | A highly distinctive traditional steamed rice cake snack at Shida Night Market. Made by naturally fermenting pure rice slurry before steaming, the snow-white cake is filled with delicate honeycomb-like pores. Fresh out of the steamer, it boasts a fluffy, bouncy texture with a subtle rice aroma and sweet-and-sour fermented flavor, topped with crunchy cashews and raisins. Rich in texture and refreshingly sweet, it is an ideal palate-cleansing dessert.", "name": "Shida Night Market - Cashew Rice Cake", "transport": "Take Metro Line 1 to Hexing Road Station (Exit 1), then walk for about 8 minutes."}, {"address": "Hexing 3rd Street (Inside Shida Night Market), Nangang District, Harbin", "feature": "\u2b50 4.5 stars | A classic night market snack that accompanied generations of Harbin students growing up. Tender chicken breast strips are marinated in a signature garlic sauce, lightly coated in flour, and deep-fried over high heat until golden and crispy. Served hot with a dusting of chili powder and plum powder, biting through the crunchy exterior reveals juicy chicken with a burst of garlic flavor. Crispy on the outside, tender inside, and irresistibly chewy, it\u0027s impossible to stop at just one bite.", "name": "Shida Night Market - Garlic Chicken Strips", "transport": "Take Metro Line 1 to Hexing Road Station (Exit 1), then walk for about 8 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Nangang Commercial District and Gogol Street"}, "pingfang_history": {"categories": {"cat_1": {"items": [{"address": "No. 12 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Founded in 1912, this century-old deli is renowned for its long tradition of air-dried sausages, pine nut tripe, and pine-smoked marinated meats. The signature air-dried sausage features a crispy skin and firm, juicy meat, leaving a lingering savory finish rich in spices and charred fat. The pine nut tripe has a springy texture, releasing the refreshing lovers.", "name": "Dehouyong Halal Restaurant", "transport": "Take Bus 343 or 361 to Pingfang Railway Station, then walk for about 5 minutes."}, {"address": "No. 88 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A beloved local establishment serving comforting, authentic Northeastern home-style cuisine. The signature Mama\u0027s Mixed Salad is crisp and refreshing, featuring vermicelli, fresh vegetables, and fruits tossed in a sweet and sour dressing. Demoli-style Braised Live Fish features rich, tender fish with vermicelli absorbing every bit of savory broth. The Stewed Chicken with Wild Hazel Mushrooms uses wild mushrooms, resulting in fall-off-the-bone chicken and a deeply aromatic broth. Hearty portions and cozy home-cooked flavors offer comforting solace to travelers visiting the nearby Unit 731 Museum.", "name": "Mama\u0027s Home Cooking", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 2), then walk for about 4 minutes."}, {"address": "No. 23 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | A famous classic charcoal BBQ joint in Pingfang District that has hosted late-night cravings for decades. Known for traditional Harbin-style raw-grilled pork cuts (Tizi Rou) and lamb skewers, the meat is fresh and tender. Charbroiled over roaring flames, it features a lightly charred, crispy exterior while remaining succulent inside, dusted with signature cumin and chili powder. Paired with a cold Harbin Beer, it offers an authentic taste of Harbin\u0027s hearty, down-to-earth food culture.", "name": "Laohei Barbecue", "transport": "Take Metro Line 1 to Baoguo Dajie Station (Exit 2), then walk for about 3 minutes."}, {"address": "No. 66 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A quintessential historic eatery in Harbin famous for traditional casseroles and local snacks. The signature Combination Casserole comes piping hot with sweet cabbage, tender meatballs, and vermicelli steeped in rich broth\u2014a warming treat with every sip. Pair it with freshly baked pork or beef pastry cakes featuring a flaky crust and savory, juicy filling; eating casserole alongside warm baked bread is the classic Harbin way. Loved by locals and tourists alike for its authentic taste and affordable prices.", "name": "Laoshanghao Casserole \u0026 Traditional Snacks", "transport": "Take Bus 338 or 343 to Youxie Dajie Station, then walk for about 3 minutes."}, {"address": "No. 45 Lianmeng Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A long-standing local restaurant in Pingfang District famous for freshly handmade dumplings and classic Northeastern stir-fries. The signature Three-Treasure Dumplings have delicate skins packed with flavorful filling; biting into them releases a juicy burst of fresh shrimp and pork. The Saut\u00e9ed Crispy Pork Nuggets (Liu Rou Duan) are fried to golden perfection and tossed in a savory sauce, offering a satisfying chewy texture. The lively atmosphere embodies traditional Northeastern hospitality, earning rave reviews from local food enthusiasts.", "name": "Shuanghesheng Traditional Restaurant", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, transfer to Bus 361 to Lianmeng Dajie Station, and walk to arrive."}, {"address": "No. 18 Xinjiang East Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Located near the Museum of Evidence of War Crimes by Japanese Army Section 731, this classic home-style restaurant is celebrated for its great value and authentic Harbin flavors. The signature Braised Pork Bones are tender, fall-off-the-bone, rich, and deeply flavorful. The traditional Shazhucai (pork stew with pickled cabbage) features refreshing sauerkraut along with tender pork belly and blood sausage. With budget-friendly prices and generous portions, it is the premier spot for visitors to recharge and sample genuine local tastes after exploring historical sites.", "name": "Baicai Baiwei Home Cooking Restaurant", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 1), then walk for about 6 minutes."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 128 Xinjiang Street, Pingfang District, Harbin City", "feature": "\u2b50 4.6 Stars | Tucked away near the Museum of Evidence of War Crimes by Japanese Army Unit 731, this hidden independent cafe features cozy wooden decor and a literary atmosphere. Specializing in freshly ground, hand-drip single-origin coffee, their Ethiopian Yirgacheffe offers a rich citrus aroma, gentle acidity, and a smooth, subtly sweet finish\u2014a favorite among hipsters and visitors seeking a tranquil space after visiting the museum. For brunch, their freshly baked butter waffles are crispy on the outside and soft inside, pairing perfectly with a rich cafe latte.", "name": "Jingyu Hand Drip Cafe", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 1), then walk about 300 meters."}, {"address": "No. 78 Xinjiang Street, Pingfang District, Harbin City", "feature": "\u2b50 4.7 Stars | This flagship bakery-cafe from the famous chain brand in Pingfang District serves high-quality freshly baked bread and espresso drinks. Their legendary half-baked cheesecake melts in your mouth with rich milky creaminess, perfectly balanced when paired with a slightly bitter oat milk latte. Bright, spacious, and equipped with comfortable seating, it is a top choice for locals and tourists enjoying sophisticated breakfast items or afternoon tea.", "name": "Holiland Bakery \u0026 Cafe Flagship Store", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 2), then walk about 150 meters."}, {"address": "No. 88 Xinjiang Street, Pingfang District, Harbin City", "feature": "\u2b50 4.5 Stars | Located near the Unit 731 Exhibition Hall "Take Harbin Metro Line 1 to Baoguo Street Station (Exit 3), then walk about 250 meters."}, {"address": "No. 15 Xinchengli Street, Pingfang District, Harbin City", "feature": "\u2b50 4.3 Stars | Located in an old neighborhood, this cozy home-style brunch cafe serves comforting handmade dishes. The signature Cappuccino comes topped with dense, velvety foam and a dusting of aromatic cinnamon powder for pure contentment in every sip. For brunch, the \u0027Special Avocado \u0026 Egg Burger\u0027 is highly recommended\u2014freshly toasted buns layered with ripe avocado slices and a runny sunny-side-up egg, offering a smooth, multi-textured bite that wins high praise from health-conscious travelers and American brunch lovers.", "name": "Old Times Brunch \u0026 Cafe", "transport": "Take Harbin Metro Line 1 to Pingfang Station (Exit 2), then walk about 500 meters."}, {"address": "No. 32 Xinjiang East Road, Pingfang District, Harbin City", "feature": "\u2b50 4.8 Stars | Tucked away in an alleyway in Pingfang, this boutique specialty cafe is run by an owner meticulous about coffee bean quality. Their innovative \u0027Osmanthus Sweet Fermented Rice Latte\u0027 is a must-try, fusing local floral osmanthus syrup and sweet fermented rice with espresso and fresh milk for a delightfully harmonious cup bursting with gentle floral notes and subtle rice aroma. Quiet and refined, it is an ideal refuge to unpack your thoughts and savor handcrafted brunch desserts after visiting historic sites.", "name": "Buruo Cafe Studio", "transport": "Take Bus 338 to Xinjiang East Road Station, then walk about 150 meters."}, {"address": "No. 106 Xinjiang Street, Pingfang District, Harbin City", "feature": "\u2b50 4.2 Stars | Located right near the exit of the Unit 731 Museum, this fast and high-quality spot offers reliable coffee and satisfying breakfast items. Their signature Flat White features micro-foam and a rich coffee taste for an exceptionally smooth mouthfeel. Paired with the Bacon \u0026 Egg McMuffin brunch set\u2014chewy English muffins combined with savory bacon and melted cheese\u2014it\u2019s a top choice for tourists needing a quick energy boost in Pingfang.", "name": "McCaf\u00e9 (Xinjiang Street)", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 1), then walk about 180 meters."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 102 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | A classic Northeast iron pot stew you cannot miss when visiting Pingfang District in Harbin! Packed with rich Kuantung rustic charm, large iron pots simmer tender river fish or goose alongside dense, flavor-absorbing potatoes, vermicelli, and dried green beans, slowly cooked over firewood into a rich, savory feast. The cornbread stuck to the sides of the pot has a crispy, golden bottom and a soft top; dipping it into the rich broth yields a crispy-yet-soft bite with natural sweet grain aroma and rich layers. A top choice for local gatherings and tourists looking to experience Northeastern culinary culture.", "name": "Shanhetun Iron Pot Stew - Youxie Street (\u5c71\u6cb3\u5c6f\u9435\u934b\u71c9 \u53cb\u5354\u5927\u8857\u5e97)", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station, exit and walk about 800 meters."}, {"address": "No. 25 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Lao Chu Jia is a famous century-old brand in Harbin and the birthplace of the famous Northeastern dish Guobaorou (Crispy Sweet and Sour Pork). Thinly sliced pork tenderloin is coated in special starch and deep-fried until golden and crispy, then quickly tossed in a perfectly balanced sweet and sour sauce. Every bite delivers a satisfying crunch, while the meat inside remains remarkably tender and juicy, filling your mouth with vibrant sweet-and-sour aromas. The restaurant\u0027s historical decor displays the deep heritage of Northeastern food culture.", "name": "Lao Chu Jia Dao Tai Restaurant - Pingfang (\u8001\u5eda\u5bb6\u9053\u53f0\u98df\u5e9c \u5e73\u623f\u5e97)", "transport": "Take Harbin Metro Line 1 to Baoguo Street Station (Exit 2), then walk about 3 minutes."}, {"address": "No. 18 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A highly popular Korean ethnic specialty restaurant in Pingfang District that blends traditional Korean flavors with a cozy Northeastern bistro ambiance. Their signature cold noodles feature a tangy, ice-cold broth and chewy noodles served with sliced beef and crisp kimchi\u2014incredibly refreshing in summer. In winter, the spicy beef pot and aromatic dolsot bibimbap (stone pot rice) are the ultimate soul warmers. Known for rich, spicy, tangy, and appetizing flavors, it receives rave reviews from lovers of bold and Korean dishes.", "name": "Jindalai Korean Local Bistro (\u91d1\u9054\u840a\u671d\u9bae\u65cf\u7279\u8272\u98a8\u5473\u83dc\u9928)", "transport": "Take Harbin Metro Line 1 to Xinjiang Street Station (Exit 1), then walk about 200 meters."}, {"address": "No. 55 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Tucked away near historic sites in Pingfang District, this popular local bistro is famous for authentic Northeastern home-style stir-fries and exquisite regional specialties. Their signature Di San Xian (sauteed eggplant, potato, and green pepper) is crispy on the outside and tender inside, coated in a rich savory sauce; while the Shazhucai (pork and pickled cabbage stew) offers tangy sauerkraut and delicate blood sausage. Serving a variety of house-brewed Northeastern liquors and fruit wines in a lively, welcoming atmosphere, it\u0027s a great spot to soak in local vibes and home-cooked flavors after museum visits.", "name": "Youxie Bistro \u0026 Local Dishes (\u53cb\u5354\u5c0f\u9152\u9928\u5730\u65b9\u83dc)", "transport": "Take bus 343 or 338 to \u0027Youxie Dajie\u0027 stop, then walk about 150 meters."}, {"address": "No. 12 Jian\u0027an 4th Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A unique bistro combining modern light-industrial style with traditional Northeastern regional dishes. The kitchen specializes in innovative local cuisine paired with custom craft beers. The signature dish, \u0027Big Bowl Braised Pork Bones,\u0027 is slow-cooked for hours to yield rich marrow and fall-off-the-bone tender meat, perfect for eating with your hands in hearty Northern style. Pair it with a wheat-scented cold-brew craft beer for a crisp, refreshing touch. Its elegant, pleasant atmosphere makes it a popular hangout for young travelers.", "name": "Beiguo Impression Local Bistro (\u5317\u570b\u5370\u8c61\u672c\u571f\u9910\u9152\u9928)", "transport": "Take Metro Line 1 to Xinjiang Street Station, then transfer to bus 361 and get off at \u0027Jian\u0027an Sidaojie\u0027 stop."}, {"address": "No. 88 Lianmeng Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A local restaurant renowned for traditional firewood-stewed goose. Using premium Northeastern goose with thin skin and thick meat, it is slow-cooked over a wood fire in a giant pot with special sauces for over an hour, resulting in succulent, tender meat bursting with rich goose aroma. The hazel mushrooms and vermicelli soak up all the flavorful broth, turning delightfully silky and chewable. Guests can dine on traditional heated Kang beds, experiencing authentic Northeastern farmstead hospitality and generous, satisfying portions.", "name": "Nenjiangwan Firewood Goose \u0026 Local Cuisine (\u5ae9\u6c5f\u7063\u67f4\u706b\u71c9\u9d5d\u8207\u5730\u65b9\u83dc)", "transport": "Take bus 338 to \u0027Lianmeng Dajie\u0027 stop, then walk about 300 meters."}, {"address": "No. 88 Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Located in the commercial area of Pingfang District, this music bistro perfectly blends Harbin\u0027s beer culture with local BBQ bar snacks. Guests can enjoy freshly poured craft beer featuring creamy foam and rich malt aromas, paired with grilled lamb skewers, roasted oysters, and seasoned beef flank tendons\u2014savory, spicy, smoky, and deliciously chewy. With live singers performing at night in a relaxed, romantic music setting, it\u0027s an excellent spot to unwind in the evening.", "name": "Maixiang Craft Beer \u0026 Music Bistro (\u9ea5\u9999\u7cbe\u91c0\u97f3\u6a02\u9910\u9152\u9928)", "transport": "Take Metro Line 1 to Baoguo Street Station (Exit 1), then walk about 500 meters."}, {"address": "No. 105 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A long-standing late-night bistro in Pingfang District specializing in classic Northeastern charcoal-grilled BBQ and local custom drinks. The signature charcoal-grilled pig trotters feature a charred, crispy skin packed with collagen, offering a gooey, chewy bite; while the grilled cold noodles (Kao Leng Mian) are smothered in sweet-and-sour sauce and diced onions for a soft yet crisp texture. Vibrant with Harbin\u0027s lively night culture, locals love coming here to eat hearty meats and enjoy big drinks in bold Northern spirit.", "name": "Lao Pingfang BBQ \u0026 Local Bistro (\u8001\u5e73\u623f\u71d2\u70e4\u9910\u9152\u9928)", "transport": "Take Metro Line 1 to Xinjiang Street Station (Exit 2), then walk about 300 meters."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 18 Xingkong Road, Pingfang District, Harbin City", "feature": "\u2b50 4.5 stars | Offering over 100 vegan dishes and healthy stews, this buffet features a rich variety of food that is low in oil and salt. Highlights include the signature \u0027Handcrafted Vegetarian Meatballs\u0027\u2014firm, chewy, juicy, and flavorful\u2014and the \u0027Shiitake Mushroom and Bamboo Fungus Stew\u0027, which offers a clear, sweet, and nourishing broth. It deeply attracts many visitors seeking peace of mind and healthy food after visiting the Unit 731 Museum.", "name": "Lianxin Vegetarian Buffet", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 55 Xinjiang Dajie, Pingfang District, Harbin City", "feature": "\u2b50 4.3 stars | Specializing in refined Zen vegetarian dishes and traditional Dongbei-style vegetarian fare. The must-order \u0027Vegetarian Sweet and Sour Pork (Guo Bao Rou)\u0027 is crafted from Lion\u0027s Mane mushrooms. With a golden, crispy exterior coated in a perfectly balanced sweet and sour sauce, each bite yields a meaty, juicy texture that perfectly recreates the Dongbei classic, earning high praise from local vegetarians and tourists alike.", "name": "Jingxin Vegetarian Restaurant", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 2), then walk for about 5 minutes."}, {"address": "No. 102 Youxie Dajie, Pingfang District, Harbin City", "feature": "\u2b50 4.2 stars | An affordable vegetarian buffet offering a wide array of stir-fried veggies, handmade vegetarian dumplings, and freshly cooked noodles. Highly recommended are the \u0027Stir-fried Black Fungus with Veggie Egg\u0027 and \u0027Braised Veggie Spare Ribs\u0027. The ribs are cleverly made from wheat gluten and lotus root, offering a crispy skin, soft center, and subtle lotus aroma\u2014a go-to daily favorite among Pingfang locals and backpackers.", "name": "Ciguang Vegetarian Buffet", "transport": "Take Bus 371 or 343 to Youxie Dajie Station, then walk for about 3 minutes."}, {"address": "No. 88 Lianmeng Dajie, Pingfang District, Harbin City", "feature": "\u2b50 4.4 stars | A Pingfang branch of a renowned vegetarian chain known for its clean environment and diverse cooked dishes. The \u0027Freshly Steamed Vegetarian Buns\u0027 feature soft, fluffy dough stuffed with cabbage, shiitake mushrooms, and dried tofu, bursting with aroma and rich textures. Paired with complimentary red bean and millet porridge, it\u0027s a deeply comforting meal.", "name": "Sumanxiang Vegetarian Buffet", "transport": "Take Metro Line 1 to Pingfang Station (Exit 3), then walk for about 10 minutes."}, {"address": "No. 23 Baoguo Dajie, Pingfang District, Harbin City", "feature": "\u2b50 4.1 stars | Focused on health-conscious vegetarian dishes and herbal wellness soups. The popular \u0027Golden Broth Tofu Pot\u0027 uses tender organic soy tofu served in a rich golden broth made from pumpkin puree. Silky smooth with a deep soybean flavor, it is an ideal choice for warming body and soul during cold seasons.", "name": "Qingxin Vegetarian Restaurant", "transport": "Take Bus 338 to Baoguo Dajie Station, then walk for about 4 minutes."}, {"address": "No. 21 Xinjiang Dajie, Pingfang District, Harbin City (Near Unit 731 Museum site)", "feature": "\u2b50 4.0 stars | Located right next to the Museum of Evidence of War Crimes by Japanese Army Unit 731, offering quick and convenient traditional vegetarian snacks. The popular \u0027Vegetarian Jianbing (Savory Crepe)\u0027 features a crisp golden crepe wrapped around savory sweet bean sauce, veggie ham, and fresh lettuce. Crispy, sweet, and savory in every bite, it is the top pick for a quick energy boost after visiting.", "name": "Oasis Vegetarian Snack Bar", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 3); the restaurant is right outside."}, {"address": "No. 45 Yimin Street, Pingfang District, Harbin City", "feature": "\u2b50 4.3 stars | Boasting a tranquil and elegant ambiance, this spot specializes in traditional mock-meat gourmet dishes. The signature \u0027Pine Nut Vegetarian Fish\u0027 wraps mashed yam and potato in bean curd skin, drizzled with sweet and sour sauce and topped with crunchy pine nuts. Crispy on the outside and velvety inside, it delivers a surprisingly realistic taste that is light on oil, offering a treat for both eyes and palate.", "name": "Foguang Vegetarian Court", "transport": "Take Bus 343 to Yimin Street Station, then walk for about 2 minutes."}, {"address": "No. 66 Kaifa Road, Pingfang District, Harbin City", "feature": "\u2b50 4.2 stars | A healthy vegetarian eatery focusing on low-oil, low-salt, whole-food dishes. The popular \u0027Whole Grain Veggie \u0026 Fruit Bowl\u0027 is paired with a house-made sesame sauce, delivering crisp veggies, nutty aromas, and rich layers of flavor. Another favorite, the \u0027Handcrafted Veggie Pie\u0027, boasts a crispy golden crust and juicy fillings, making it immensely popular among young diners and health-conscious eaters.", "name": "Shuxiang Shijia Healthy Vegetarian", "transport": "Take Bus 220 to Kaifa Road Station, then walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near the intersection of Xinjiang Street and Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Harbin\u0027s ultimate soulful street food! Fresh off the griddle, these roasted cold noodles feature a slightly crispy, chewy outer layer wrapped around a savory fried egg, diced onions, and special sausage. Brushed with a rich secret sweet and sour sauce and sprinkled with fresh cilantro, every bite delivers a delightful mix of chewy texture and sweet, savory, tangy, and spicy flavors. Piping hot and irresistibly fragrant, it\u0027s a favorite grab-and-go snack for both locals and museum visitors.", "name": "Pingfang Xinjiang Street Roasted Cold Noodles", "transport": "Take Metro Line 1 to Xinjiang Street Station and walk for about 5 minutes."}, {"address": "No. 18 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Eating a Modern Ice Popsicle on the street\u2014even in Harbin\u0027s -20\u00b0C winter\u2014is the ultimate authentic local experience! With a history spanning over a century, this classic popsicle boasts a rich, pure milky flavor with zero fluffing agents, resulting in a dense, smooth, and creamy texture. As the rich milk and egg aroma slowly melts on your tongue, its perfectly balanced nostalgic sweetness leaves an unforgettable aftertaste\u2014an iconic Northeastern dessert that proves the colder it is, the better it tastes!", "name": "Modern Ice Popsicle (Pingfang Branch)", "transport": "Take Metro Line 1 to Xinjiang Street Station (Exit 1) and walk for about 3 minutes."}, {"address": "In front of Pingfang Shopping Mall, Xinjiang West Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | On the snowy winter streets of Northeast China, bright crimson skewers of candied hawthorns are the most eye-catching sight. The paper-thin glass-like sugar coating delivers an addictively crisp crunch, yielding to juicy, tart-sweet hawthorn fruit underneath. Beyond traditional hawthorn, you\u0027ll find inventive varieties featuring strawberries, grapes, or red bean paste fillings, blending sweet and sour notes for an addictive treat.", "name": "Old Harbin Candied Hawthorn Stand", "transport": "Take Metro Line 1 to Xinjiang Street Station and walk for about 7 minutes."}, {"address": "No. 25 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Harbin\u0027s famous fruitwood-smoked red sausages, sliced fresh right at the stall! Smoked over traditional fruitwood charcoal, they boast a subtle charred and garlic aroma. The casing snaps nicely with a firm, elastic texture inside, perfectly balanced with marble fat and smoky wooden notes. Sliced thin for effortless snacking on the go, this savory, aromatic delicacy is the pinnacle of Northeastern street food.", "name": "Churin-Lidows Red Sausage Stand", "transport": "Take Metro Line 1 to Hanan Station, then transfer to Bus 361 and get off at Youxie Street Station."}, {"address": "Entrance of the Market on Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Made-to-order traditional Northeastern fried pastries showcasing a golden, crispy exterior. The fried cake uses premium sticky yellow rice flour, yielding a crisp outer shell and a pleasantly chewy center stuffed with sweet red bean paste that exudes a natural aroma. The giant twisted fried dough sticks (mahua) are delightfully crunchy and layered. Served hot off the fryer, the satisfying crunch combined with warm, sticky filling makes for a deeply gratifying treat.", "name": "Pingfang Traditional Fried Cake \u0026 Twist Stall", "transport": "Take Metro Line 1 to Baoguo Street Station (Exit 2) and walk for about 4 minutes."}, {"address": "Opposite the exit of Unit 731 Museum, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | On freezing Harbin streets, the smoky aroma of roasted sweet potatoes and corn is impossible to resist. Locally grown Northeastern black sticky corn and orange sweet potatoes are slowly roasted over a traditional charcoal stove. The sweet potatoes are caramelized on the outside, silky and honey-sweet inside, while the corn kernels are plump, chewy, and infused with smoky richness. Holding one in your hands satisfyingly wards off both hunger and the winter chill.", "name": "Northeast Charcoal Roasted Corn \u0026 Sweet Potato Stall", "transport": "Take Metro Line 1 to Xinjiang Street Station (Exit 2) and walk for about 2 minutes."}, {"address": "Xingjian Street Morning Market, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | An iconic local market wonder! Frozen pears turn jet-black through natural freezing; once thawed, poke a straw in to sip the ice-cold, pure, tangy-sweet juice\u2014nature\u0027s coolest winter slushie! Sticky bean buns (Nian Dou Bao) feature yellow rice dough stuffed with red bean paste, steamed to chewy perfection and delicious when dipped in white sugar. These unique winter-exclusive specialties are absolute must-tries for experiencing authentic Northeastern food culture.", "name": "Pingfang Market Frozen Pear \u0026 Sticky Bean Bun", "transport": "Take Metro Line 1 to Baoguo Street Station and walk for about 8 minutes to Xingjian Street."}, {"address": "Intersection of Xinjiang Street and Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A bustling street stall on Xinjiang Street where the rich scent of cumin and charcoal greets you from afar. Fresh, perfectly marbled lamb skewers are grilled over open flames, dusted with custom cumin and chili powder\u2014juicy, tender, and completely free of gameiness. The pan-fried meat pies are rolled fresh with paper-thin crispy crusts oozing with savory pork and scallion filling. Highly recommended by locals as an ultimate energy booster.", "name": "Xinjiang Street Mutton Skewers \u0026 Meat Pies", "transport": "Take Metro Line 1 to Xinjiang Street Station and walk for about 5 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Former Site of Unit 731, Pingfang District"}, "songbei_ice_snow": {"categories": {"cat_1": {"items": [{"address": "No. 452 Shimao Avenue, Songbei District, Harbin", "feature": "\u2b50 4.7 Stars | As the birthplace of Harbin\u0027s century-old iconic dish, Guobaorou (Crispy Sweet and Sour Pork), Lao Chu Jia carries over a hundred years of culinary tradition. Their signature Guobaorou is crispy on the outside and tender inside, producing a satisfying crunch with every bite, perfectly coated in a balanced sweet and sour sauce over golden pork tenderloin for incredible depth of flavor. Besides Guobaorou, the fried cakes, fried seafood mix, and tofu meatballs are must-try items for food lovers. The cozy, retro decor paired with authentic Dongbei flavors makes it a favorite among locals and tourists alike.", "name": "Lao Chu Jia - Daotaifu
