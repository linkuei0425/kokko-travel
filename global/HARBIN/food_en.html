 Cuisine", "transport": "Take Metro Line 2 to Shimao Avenue Station (Exit 2), then walk for about 5 minutes."}, {"address": "Next to Taiyangshi Square, Sun Island Scenic Area, Songbei District, Harbin", "feature": "\u2b50 4.6 Stars | Founded in 1906, Modern Hotel is one of Harbin\u0027s most historic and representative Russian-style Western restaurants. Its branch near Sun Island carries on the elegant style of the original establishment. Signature dishes include rich and tangy Russian borscht, creamy potted stewed beef, and French grilled lamb chops. The beef is slow-cooked until melt-in-your-mouth tender. Don\u0027t miss the nationally renowned Modern Popsicle\u2014rich, creamy, and pure in flavor, making it a must-try classic treat when visiting Sun Island.", "name": "Modern Hotel Restaurant", "transport": "Take Metro Line 2 to Sun Island Station (Exit 3), then walk for about 8 minutes."}, {"address": "No. 1 Pingdingshan Road, Sun Island Scenic Area, Songbei District, Harbin", "feature": "\u2b50 4.5 Stars | Located near Sun Island Scenic Area, this restaurant is an iconic destination for tasting wild Songhua River fish and traditional Northeastern iron-pot fish stew. The kitchen selects live kaluga sturgeon and mandarin fish from the Songhua River, simmering them slowly over firewood in big iron pots using ancient methods. The fish meat is delicate, tender, and free of earthy odor, while the broth is rich and robust. Served with corn cakes attached to the side of the pot\u2014golden and crispy on the bottom from soaking up the flavorful fish soup, soft on top\u2014creating a rich culinary experience that guests rave about.", "name": "Sun Island River Fish Restaurant", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to a scenic area shuttle bus or walk for about 12 minutes."}, {"address": "Intersection of Shimao Avenue and Songbei 1st Road, Songbei District, Harbin", "feature": "\u2b50 4.4 Stars | Founded in 1902, this century-old brand is one of Harbin\u0027s earliest steamed bun shops. The Songbei branch saves diners from long lines in the old city area. Its signature \u0027Pork Rib Bun\u0027 is truly unique: chopped bone-in pork ribs are wrapped in dough, allowing the bun skin to absorb rich marrow and savory juices during steaming. Biting into one releases flavorful juice and chewy, tender meat. The Rib \u0026 Tofu Buns and Three Delicacies Buns are also exceptional, featuring bouncy dough crafted with century-old techniques highly praised by food lovers.", "name": "Zhang Bao Pu", "transport": "Take Metro Line 2 to Shimao Avenue Station, transfer to Bus 213, get off at Songbei 1st Road Station, and walk for about 3 minutes."}, {"address": "No. 1 Taiyang Avenue, Songbei District, Harbin (near Ice and Snow World)", "feature": "\u2b50 4.6 Stars | A highly reputed classic restaurant dedicated to preserving Dongbei folk customs and Heilongjiang regional specialties. Its signature \u0027Northeastern Iron Pot Stew\u0027 and \u0027Braised Chicken with Mushrooms\u0027 feature wild Heilongjiang hazel mushrooms and free-range chicken, stewed until the meat falls off the bone. The mushrooms absorb the rich chicken broth, offering a velvety, flavorful bite. Other popular dishes include steamed Songhua River sturgeon and Di San Xian (saut\u00e9ed eggplant, potato, and pepper). Generous portions and authentic, rustic flavors make this a top choice for family gatherings and cultural food experiences.", "name": "Longjiang Jiayan Traditional Restaurant", "transport": "Take Metro Line 2 to Ice and Snow World Station (Exit 3), then walk for about 10 minutes."}, {"address": "No. 188 Songbei Avenue, Songbei District, Harbin", "feature": "\u2b50 4.3 Stars | Founded in 1925, Huamei Restaurant is synonymous with authentic Russian Western dining in Harbin. The Sun Island experience store continues the classical Tsarist Russian court style. Signature dishes like Potted Stewed Mutton and Potted Stewed Shrimp are slow-baked in traditional clay pots, producing tender, juicy meat in a rich, sweet and savory red sauce. Paired with freshly baked Lieba (Russian-style bread) and specialty jam\u2014crispy outside, soft inside, with a rich milky aroma\u2014it is a must-visit spot to experience Harbin\u0027s Eastern European culinary heritage.", "name": "Huamei Restaurant (Sun Island Store)", "transport": "Take Metro Line 2 to Ice and Snow World Station (Exit 1), then walk for about 15 minutes or take a 5-minute taxi ride."}, {"address": "No. 22 Songhu North Road, Songbei District, Harbin", "feature": "\u2b50 4.5 Stars | A traditional local staple serving classic Shandong and Northeastern dishes, famous for authentic old-Harbin cooking techniques. The signature Crispy Fried Pork Segments (Liu Rou Duan) are crispy outside and tender inside, thoroughly coated in a savory sauce that bursts with meat flavor; Soft-Fried Pork Loin and Squirrel-Shaped Mandarin Fish demonstrate exceptional wok mastery. Simple yet comfortable decor, affordable prices, and huge portions make it a beloved spot for neighborhood locals and visiting foodies alike.", "name": "Fuyu Traditional Chinese Restaurant", "transport": "Take Bus 125 or 126 to Songhu North Road Station, then walk for about 2 minutes."}, {"address": "No. 15 Weidi Road, Sun Island Scenic Area, Songbei District, Harbin", "feature": "\u2b50 4.6 Stars | Located near Sun Island Scenic Area, this traditional Western restaurant oozes Russian nostalgia. The interior displays many historic artifacts and old photographs from Harbin\u0027s Chinese Eastern Railway era over a century ago. The signature Russian Pan-Fried Steak is cooked to perfection, rich with juice when sliced, and paired with a flavorful black pepper sauce. Handcrafted Russian Tiramisu and Salads are smooth, perfectly sweet, and satisfying. It is an artistic and historical culinary icon.", "name": "Lucia Russian Restaurant", "transport": "Take Metro Line 2 to Sun Island Station (Exit 1), then walk for about 10 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Next to the Deer Park, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | A cozy wooden cabin cafe located right next to the Sun Island Deer Park, where sunlight pours through large glass windows, creating a Nordic forest atmosphere. The cafe offers freshly ground pour-over single-origin coffee and Russian baked goods. Most popular are the rich, velvety smooth caffe latte and freshly baked Russian Dalieba (rye bread) served with butter spread. The rich aroma of coffee beans paired with brunch bread that is crispy outside and soft inside releases a subtle wheat scent, making it a favorite for photography lovers and families.", "name": "Sun Island Deer Park Cafe", "transport": "Take Metro Line 2 to Sun Island Station (Exit 3), then walk for about 10 minutes."}, {"address": "Building 1, Russian Style Town, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | Tucked away in the Russian Style Town on Sun Island, this classic Russian cafe features vintage wooden decor and authentic Russian handicraft ornaments. The signature Russian hot chocolate and hazelnut-infused Viennese coffee are true lifesavers on freezing winter days. Pair them with rich, velvety Russian honey cake and a hearty cheese omelet brunch set; the milky aroma and caramel sweetness blend beautifully, letting you enjoy a relaxing morning amidst exotic surroundings.", "name": "Russian Town Bakery \u0026 Coffee", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to a scenic area sightseeing shuttle or walk for about 8 minutes."}, {"address": "Intersection of Dajuyuan 1st Road and Yalu River Road, Cultural Center, Songbei District, Harbin City", "feature": "\u2b50 4.4 stars | A scenic brunch cafe near Sun Island and the Harbin Grand Theatre, featuring floor-to-ceiling windows with panoramic views of the Songhua River. It offers exquisite specialty pour-over coffees and all-day American brunch staples, such as Eggs Benedict and French toast that is crispy outside and tender inside. The coffee features citrusy notes and smooth milk aroma, perfectly complementing slightly charred crispy bacon and soft poached eggs. The sweet and savory layers attract countless hipsters and photography enthusiasts.", "name": "Grand Theatre Riverside Coffee", "transport": "Take Metro Line 2 to Shimao Avenue Station, then transfer to Songbei New District Bus Route 35 to Harbin Grand Theatre Station."}, {"address": "Inside the Botanical Greenhouse, Snow Expo Park, Sun Island Scenic Area, Songbei District, Harbin City", "feature": "\u2b50 4.3 stars | A greenhouse oasis cafe located within the Sun Island Snow Expo park. Entering here after exploring the freezing outdoors feels like a true rebirth. The interior maintains a comfortably warm temperature filled with lush greenery. The signature brown sugar latte is sweet and smooth with fine, delicate froth, paired with made-to-order Belgian waffles that are crispy on the outside and chewy on the inside. Dipping steaming hot waffles into rich coffee offers a delightful contrast in texture, making it the perfect spot to recharge and relax after viewing magnificent snow sculptures.", "name": "Sun Island Snow Expo Greenhouse Cafe", "transport": "Take Metro Line 2 to Sun Island Station (Exit 1), enter the main park of Sun Island Snow Expo, and follow the guide signs walking for about 5 minutes."}, {"address": "2F, North Station of Songhua River Cableway, No. 1 Taiyang Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.5 stars | Located inside the North Station (Sun Island end) of the Songhua River Cableway, styled after a classical European castle. The cafe offers stunning high-angle views of the river. Sitting by the window, guests can savor beautifully poured latte-art cappuccinos alongside special Russian brunch platters. The rich, smooth latte perfectly balances subtle coffee bitterness with sweet caramel notes, paired with freshly baked, slightly toasted soft croissants that burst with rich butter flavor upon biting, highly praised by visiting tourists.", "name": "Songhua River Cableway Castle Cafe", "transport": "Take Metro Line 2 to Sun Island Station, or take the Songhua River Cableway directly to the North Station."}, {"address": "1F, Main Exhibition Hall of Four Seasons Ice \u0026 Snow Project, Ice \u0026 Snow World, Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.7 stars | A unique store located inside the main exhibition hall of the Four Seasons Ice \u0026 Snow project at Ice \u0026 Snow World. The interior design seamlessly blends icy elements with modern industrial style. In addition to standard espresso drinks, the hot hazelnut latte and matcha latte are crowd favorites. Steaming hot coffee with silky smooth milk foam paired with a soft, sweet cheesecake that melts in your mouth makes this a popular spot to warm up quickly after taking photos with ice sculptures and enjoying ice attractions.", "name": "Starbucks Ice \u0026 Snow World Four Seasons Hall", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station (Exit 3), providing direct access into the Four Seasons Ice \u0026 Snow Exhibition Hall."}, {"address": "Inside the Food Court, Ice \u0026 Snow World Park, Songbei Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.2 stars | An ultra-cozy concept store designed specifically for visitors to Ice \u0026 Snow World, offering quick, convenient, and high-value brunch and freshly ground coffee. The rich hot Americano and brown sugar boba fresh milk latte are bestsellers, tasting rich and smooth. During brunch hours, the cheese egg burger and crispy panini\u2014featuring golden crispy bread and gooey melted cheese\u2014deliver a piping hot, savory delight that instantly fends off the freezing cold, making it a hit among young travelers and families.", "name": "KFC KCOFFEE Ice \u0026 Snow Concept Store", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station (Exit 2), then walk for about 3 minutes to enter the Food Court."}, {"address": "Inside the Polar Pavilion, Harbin Polar Park, No. 3 Taiyang Avenue, Songbei District, Harbin City", "feature": "\u2b50 4.6 stars | An immensely popular themed cafe inside Harbin Polar Park on Sun Island. The biggest highlight is watching adorable penguins play through special glass windows while sipping coffee. The cafe offers lattes with penguin-shaped latte art alongside limited-edition brunch light bites. The latte is smooth and rich in milky flavor; paired with a special tuna salad panini that is pressed crispy on the outside and juicy on the inside. It\u0027s not only fun and highly Instagrammable, but also serves high-quality food, making it an unmissable culinary spot in the Polar Park.", "name": "Penguin Cafe at Harbin Polar Park", "transport": "Take Metro Line 2 to Sun Island Station (Exit 2), then walk for about 3 minutes to reach Harbin Polar Park."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Located inside the beautiful Sun Island Scenic Area, offering authentic Russian home cooking and specialty red wines. The signature borscht is rich, tangy, and sweet, perfectly paired with a mixed grill platter and house-brewed Kvass beer, making you feel as if you were in Moscow. Towering Russian-style wooden cabins complement the winter snowscapes, making it the perfect spot for a cozy, warm dinner after admiring the ice sculptures.", "name": "Sun Island Russian Bistro", "transport": "Take Harbin Metro Line 2 to Sun Island Station, then walk for about 5 minutes."}, {"address": "No. 99 Shimao Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | A century-old restaurant founded in the late Qing Dynasty, famously known as the birthplace of the famous Northeastern dish, Crispy Sweet and Sour Pork (Guo Bao Rou). The outer crust is golden and crispy with a satisfying crunch, while the pork loin inside remains tender and juicy, tossed in a flawlessly balanced sweet and sour sauce. Besides Guo Bao Rou, the fried pork liver and beer duck are must-order classics at every table, drawing countless foodies from near and far.", "name": "Lao Chu Jia - Songbei Branch", "transport": "Take Metro Line 2 to Shimao Avenue Station, Exit 1, and walk for about 8 minutes."}, {"address": "Near the intersection of Songbei Avenue and Ice and Snow World Park, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | An authentic Northeastern iron pot stew restaurant located near Harbin Ice and Snow World. Watch goose or river fish simmer live in a giant iron pot filled with rich, savory broth until the meat becomes tender and deeply flavorful. Golden cornbread slapped along the inside edge of the pot absorbs the savory broth, becoming sweet, soft, and pleasantly chewy. Gathering around a piping-hot iron pot after playing in the chilly snow creates a warm, lively, and comforting dining experience.", "name": "Shangzhi Iron Pot Stew - Ice and Snow World Branch", "transport": "Take Metro Line 2 to Ice and Snow World Station, Exit 3, and walk for about 6 minutes."}, {"address": "2F, Shangri-La Songbei, No. 1 Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 Stars | An upscale, refined local cuisine restaurant situated along the Songhua River, seamlessly blending the essence of traditional Heilongjiang cuisine with modern Cantonese flair. Highly recommended are the wild Kaluga sturgeon from the Songhua River and premium dishes crafted from organic black-soil ingredients. Pair these exquisite creations with curated local wild mountain wines while taking in sweeping views of Sun Island and the Ice and Snow World in an elegant setting.", "name": "Shang Palace - Shangri-La Songbei", "transport": "Take Metro Line 2 to Sun Island Station, then take a 5-minute taxi ride."}, {"address": "Intersection of Shimao Avenue and Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A well-known Russian-themed bistro in Harbin with a rich, exotic charm. The melt-in-your-mouth pot-stewed beef infused with red wine and fresh produce is an absolute must-try. Paired with freshly baked bread that\u0027s crispy outside and soft inside, along with freshly poured Russian craft stout, it offers rich layers of flavor\u2014making it immensely popular among young travelers and local family gatherings.", "name": "Tsar Kitchen Russian Restaurant - Songbei Xiangyu Branch", "transport": "Take Metro Line 2 to Shimao Avenue Station and walk for about 10 minutes."}, {"address": "Luming Island, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Tucked away in Sun Island Park, this European garden-style restaurant serves refined Russian private dishes and local specialties. Signature dishes like Moscow pot-stewed shrimp and creamy baked mixed casserole are rich and aromatic. Enjoy them alongside custom vodka cocktails or fruity mulled wine while watching snow gently fall over the courtyard, creating the ultimate romantic snowy-town atmosphere.", "name": "Luming Garden Russian Bistro", "transport": "Take Metro Line 2 to Sun Island Station, then walk for about 12 minutes inside the park or take a sightseeing shuttle."}, {"address": "Intersection of Chuangxin 1st Road and Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A stylish bistro that perfectly blends classic Northeastern bar bites with modern craft beers. The signature spicy grilled pig\u0027s trotters are crispy on the outside, tender inside, and packed with collagen. Pair them with the house-brewed Harbin wheat ale and refreshing Northeastern sheet jelly noodles to balance the rich flavors. With live music in the evening, it\u0027s the ultimate cozy spot to unwind with a drink after exploring the ice lantern festival.", "name": "Shan Hai Guan Craft Beer \u0026 Local Bistro", "transport": "Take Metro Line 2 to Ice and Snow World Station, then take a 6-minute taxi ride."}, {"address": "Around Ice and Snow World Commercial District, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Located near the Ice and Snow World, this restaurant specializes in authentic Northeastern countryside dishes and Songhua River seafood. The Stewed Chicken with Mushrooms uses wild hazel mushrooms and free-range chicken, creating an intensely savory broth, while the \u0027Di San Xian\u0027 (saut\u00e9ed potato, eggplant, and green pepper) is crispy outside, soft inside, and packed with flavor. Featuring traditional heated \u0027Kang\u0027 brick bed seating and warm, hospitable service, guests are instantly immersed in Northern Chinese dining culture.", "name": "Snow Town Impression Local Cuisine", "transport": "Take Metro Line 2 to Ice and Snow World Station and walk for about 8 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 1 Pingyuan Street, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Tucked away in a quiet corner of the Sun Island Scenic Area, this spot perfectly blends traditional Zen tea ceremony with exquisite vegetarian cuisine. The restaurant carefully selects local organic alpine mushrooms and fresh seasonal vegetables from Heilongjiang. Their signature dish, \u0027Truffle Lily Wild Mushroom Pot\u0027, features a sweet, fresh, and clear broth with silky mushrooms that absorb all the rich flavors. The \u0027Handcrafted Veggie Ribs\u0027 expertly use lion\u0027s mane mushrooms to replicate an amazingly firm, juicy meat texture, earning high praise from vegetarians and tourists alike.", "name": "Sun Island Zen Vegetarian Tea Court", "transport": "Take Harbin Metro Line 2 to Sun Island Station (Exit 3), then walk for about 8 minutes."}, {"address": "No. 228 Shimao Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A well-known traditional vegetarian restaurant in the Songbei District near Sun Island, famous for its mock-meat craftsmanship and imperial-style vegetarian dishes. The restaurant offers an elegant and quiet atmosphere. The \u0027Basil Stir-Fried Veggie Intestines\u0027 has a chewy, springy texture bursting with basil aroma, while the \u0027Golden Broth Veggie Bird\u0027s Nest\u0027 is simmered with high-quality snow fungus and white wood ear mushroom, offering a smooth, delicate, and pleasantly subtle sweet taste. Every dish is both delicious and visually stunning, making it a top choice to recharge after visiting Ice and Snow World.", "name": "Lotus Vegetarian Restaurant", "transport": "Take Bus 122 or 125 to Shimao Avenue Station, then walk for about 3 minutes."}, {"address": "Zone A, Food Hall, Ice \u0026 Snow World Park, Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Dedicated to serving piping hot vegetarian dishes to tourists exploring the ice sculptures at Ice and Snow World. In extreme cold weather, their steaming \u0027Northeastern Veggie Stew Pot\u0027 is a massive crowd favorite, packed with glass noodles, frozen tofu, Chinese cabbage, and wood ear mushrooms in a rich, savory broth that bursts from the juicy tofu. Paired with freshly baked \u0027Hand-Pulled Veggie Flatbread\u0027\u2014crispy outside and soft inside\u2014it makes for the ultimate comforting winter meal.", "name": "Ice \u0026 Snow World Veggie House", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station (Exit 3), and enter the park\u0027s Food Hall."}, {"address": "No. 168 Songpu Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A great value-for-money buffet restaurant offering dozens of rich vegetarian options. The spread includes Northeastern-style vegetarian stews, various veggie sushi rolls, dim sum, and freshly cooked hot soups. The \u0027Fried Veggie Spring Rolls\u0027 feature a golden, crispy shell filled with refreshing, juicy cabbage and shredded wood ear mushrooms. The \u0027Black Pepper Veggie Tenderloin\u0027, made from soy protein, delivers a meaty texture rich with bold black pepper aroma, making it wildly popular among locals and visitors alike.", "name": "Ci Xin Yuan Vegetarian Buffet", "transport": "Take Bus 35 or 80 to Songpu Avenue Station, then walk for about 5 minutes."}, {"address": "No. 28 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Located near Harbin Polarland, this place features an elegant, antique decor, serving delicate healthy plant-based meals and premium Pu\u0027er tea. The signature \u0027Bamboo Fungus \u0026 Wild Mushroom Soup\u0027 boasts a sweet, clear broth with crisp bamboo fungus that absorbs the flavors. The \u0027Veggie Skewers\u0027 creatively use king oyster mushroom cubes seasoned with special cumin, giving a satisfyingly chewy bite packed with spicy Northeastern BBQ flavor that keeps customers coming back for more.", "name": "Jingxin Veggie \u0026 Tea House", "transport": "Take Metro Line 2 to Sun Island Station (Exit 2), then walk for about 10 minutes."}, {"address": "Inside Polarland, No. 3 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Located in the shopping area of Harbin Polarland, this cafe specializes in youthful, energetic meat-free light meals and plant-based dishes. Pair their signature \u0027Vegan Oat Milk Latte\u0027 with the \u0027Truffle Wild Mushroom Veggie Burger\u0027\u2014a patty made from black beans and quinoa, seared to a fragrant crisp, topped with fresh lettuce and custom plant-based sauce. It offers rich layers of flavor with zero guilt, making it a great spot to relax after touring Polarland.", "name": "Polarland Veggie \u0026 Light Meal Cafe", "transport": "Take Metro Line 2 to Sun Island Station (Exit 2), then walk 5 minutes into Polarland."}, {"address": "No. 88 Xinkai Street, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A private kitchen restaurant featuring herbal wellness dishes and seasonal vegetarian options, decorated in a warm and elegant style. Recommended is the \u0027Angelica \u0026 Astragalus Veggie Mutton Pot\u0027, which uses specially processed shiitake mushroom stems to craft mock mutton with a deliciously chewy bite, paired with a nourishing broth perfect for warming up in cold winter weather. The \u0027Crispy Veggie Cheese Rolls\u0027 feature a crunchy outer layer and a rich, toasted filling, blending sweet and savory flavors loved by kids and young travelers.", "name": "Sui Yue Jing Hao Health Vegetarian", "transport": "Take Bus 146 to Xinkai Street Station, then walk for about 4 minutes."}, {"address": "No. 55 Songbeiyi Road, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A pure vegetarian restaurant focusing on adapted traditional Northeastern flavors with an emphasis on low oil, low salt, and natural ingredients. A must-order is the \u0027Veggie Sauteed Crispy Pork Nuggets\u0027, featuring mushrooms coated and deep-fried to a golden crisp while staying tender and juicy inside, tossed in a rich sweet-and-sour sauce. It perfectly replicates the exquisite texture of Harbin\u0027s classic Northeastern Sauteed Pork Ribs, earning high praise from foodies.", "name": "Songbei Jing Su Zhai", "transport": "Take Bus 213 or 211 to Songbeiyi Road Station, then walk for about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Next to the main venue of the Snow Expo, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | The must-try soul-soothing walking dessert in Harbin! Even in the minus-20-degree snow of Sun Island, holding one is an absolute requirement. Founded in 1906, this century-old French-style ice cream boasts an extremely rich milky aroma, a dense, smooth texture, and zero chemical additives. Taking a bite in the freezing cold reveals a slightly firm exterior with a rich interior\u2014the colder it gets, the cooler and sweeter it tastes. Immensely popular among both tourists and locals alike.", "name": "Modern Popsicle (Sun Island Branch)", "transport": "Take Metro Line 2 to Sun Island Station, Exit 3, and walk for about 5 minutes."}, {"address": "Food Market Area, Ice \u0026 Snow World Park, Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | The most iconic Northern-style vintage street snack inside Ice and Snow World. Specially selected large fresh hawthorns, strawberries, or grapes are coated in a thin, crystal-clear layer of melted malt sugar. In the extreme cold, the sugar coating instantly hardens into a crispy ice shell that cracks delightfully when bitten into, releasing the sweet, sour, and juicy fruit pulp inside. Rich in layered textures, it is the top walking delicacy for visitors to boost their energy while admiring the ice sculptures.", "name": "Ice \u0026 Snow World Candied Fruit Stall", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station, Exit 2, and walk directly into the park\u0027s food street."}, {"address": "Food Kiosk near the Snowflake Ferris Wheel, Ice \u0026 Snow World, Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Harbin\u0027s signature night market street snack, wafting sizzles and aromatic griddle scents through the snowy park. Special noodle sheets are grilled on a hot iron plate until lightly charred, cracked with an egg, brushed with secret sweet and spicy sauce, diced onions, and cilantro, and wrapped around sliced Harbin red sausage. Chewy, springy, savory, sweet, and slightly spicy, it serves up steaming hot comfort right off the griddle to instantly revive frozen bodies and spirits.", "name": "Ice \u0026 Snow World Northeastern Grilled Cold Noodles Stall", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station; after entering the park, walk toward the Ferris Wheel for about 3 minutes."}, {"address": "Entrance to Sun Island Town Market, No. 1 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A Russian-flavored street BBQ specialty on Sun Island. Thick slices of premium lamb or pork are marinated and threaded onto special iron skewers, then charcoal-grilled until crispy on the outside and tender on the inside. Dusted with cumin and chili powder, the sizzling meat drips fat onto the embers. Succulent and flavorful with every bite, its smoky skin and juicy, chewy meat make it a bold, satisfying street food you shouldn\u0027t miss while exploring Sun Island Park.", "name": "Sun Island Russian Style BBQ Skewer Stall", "transport": "Take Metro Line 2 to Sun Island Station, Exit 2, and walk for about 8 minutes to reach the market area."}, {"address": "Next to Shuige Yuntian Attraction, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Harbin\u0027s most representative century-old culinary icon, offering convenient grab-and-go kiosks throughout Sun Island Park. Made using traditional garlic flavoring and fruitwood smoking techniques, the outer skin is snap-crisp with a hint of smoky char, while the firm, dense meat inside bursts with rich garlic aroma and savory juices. Eaten straight out of hand or paired with hot tea, it grows more flavorful with every chew\u2014a classic street food recommended by locals and tourists alike.", "name": "Churin Qiulin Red Sausage Kiosk (Sun Island)", "transport": "Take Metro Line 2 to Sun Island Station, enter the park, and take the sightseeing shuttle to Shuige Yuntian Station."}, {"address": "Snack Kiosk around Crown of Ice and Snow Plaza (Main Tower), Ice \u0026 Snow World, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | The most popular hand-warming street snack under the sub-zero temperatures of Ice \u0026 Snow World. Slow-roasted over charcoal in traditional large iron barrels, the sweet potatoes release caramelized honey drips under lightly charred skins, uncovering soft, golden, deliciously sweet flesh that melts in your mouth. The roasted corn emits a rich grain aroma with caramelized notes, featuring plump, chewy kernels. Doubles as a natural hand-warmer and offers pure, comforting deliciousness.", "name": "Ice \u0026 Snow World Roasted Sweet Potato \u0026 Corn Kiosk", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station, walk into the park toward the central plaza, and you will spot it."}, {"address": "Folk Custom Experience Alley, Snow Expo Area, Sun Island, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A highly distinctive Northeastern winter-exclusive icy snack. Wild pears or apples are frozen black by the natural extreme winter cold, and stalls offer on-the-spot thawing and slicing services. Once thawed in cold water, the frozen pear acquires a soft, slushie-like texture; one bite unleashes a burst of sweet, refreshing pear juice that cools, slakes thirst, and cuts through greasiness. First-time visitors are routinely amazed by this magical \u0027freeze-then-thaw\u0027 texture.", "name": "Sun Island Frozen Pears \u0026 Apples Experience Stall", "transport": "Take Metro Line 2 to Sun Island Station and walk into the experiential alley inside the Snow Expo exhibition area."}, {"address": "Food Hut next to the Ice Slide Queue Area, Ice \u0026 Snow World, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A steaming hot snack stall specifically designed for visitors to recharge amidst the freezing winds of Ice \u0026 Snow World. Freshly steamed mini milk buns feature smooth, soft skins with a subtle milky sweetness; pair them with a cup of hot ginger tea brewed with brown sugar and aged ginger for a sweet-spicy warmth that settles the stomach. Simple, nostalgic flavors that perfectly soothe tired bodies playing in the world of ice and snow.", "name": "Ice \u0026 Snow World Hot Ginger Tea \u0026 Steamed Buns Kiosk", "transport": "Take Metro Line 2 to Ice \u0026 Snow World Station, enter the park, and walk toward the Super Ice Slide attraction for about 6 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Sun Island and Ice and Snow World"}, "volgar_manor": {"categories": {"cat_1": {"items": [{"address": "Inside Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Located in the heart of the manor, showcasing an ultra-rich Imperial Russian palace style. The restaurant\u0027s must-order Russian pot-roasted beef is tender and melt-in-your-mouth, perfectly infused with the sweet and savory essence of red wine and tomatoes. The borscht is vibrant red, refreshing, and carries the natural sweetness of beets. Fully recreating the century-old traditional craft of Harbin\u0027s classic Western dining, its elegant setting and authentic flavors earn high praise from tourists and local foodies alike.", "name": "Golden Ring Restaurant", "transport": "Walkable within the resort, or take the manor sightseeing shuttle bus to the Golden Ring Restaurant Station"}, {"address": "Along the Ashi River, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Replicating the exterior of Harbin\u0027s famous historic Miniature Restaurant, this spot specializes in traditional Russian home-style cooking and exquisite pastries. Its signature Russian pot-cooked shrimp features tender, springy shrimp meat paired with a rich, creamy soup and herbal seasoning\u2014flavorful without being heavy. The golden, crispy sliced rye bread pairs perfectly with custom butter spread. Recreating historic architecture and nostalgic flavors, it is the premier venue to experience Harbin\u0027s Russian-Western culinary history.", "name": "Miniature Restaurant", "transport": "About an 8-minute walk along the main avenue from the manor\u0027s main entrance"}, {"address": "Three Bears Land Area, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A traditional specialty restaurant themed around Russian fairy tales, exuding a cozy log-cabin charm. The handmade Russian Lieba (rye bread) and sausage platter comes highly recommended. The Lieba features a crispy, chewy crust with a dense interior and a unique naturally fermented tang. Paired with smoky, juicy Russian sausages that burst with flavor in every bite, the rich layer of textures makes it a huge hit with families and gourmets alike.", "name": "Three Bears Restaurant", "transport": "Take the vintage mini-train within the resort and get off at Three Bears Land Station"}, {"address": "Next to the Pier, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Situated right beside the Ashi River, this restaurant offers a fusion of local Harbin Northeastern cuisine and Russian flavors. The classic Northeastern Guobao Rou (Crispy Sweet and Sour Pork) is crispy on the outside and tender inside, crackling satisfyingly with every bite and coated in a perfectly balanced sweet and sour sauce. Meanwhile, the steamed fresh river fish highlights delicate, sweet meat that preserves the natural taste of local ingredients, perfectly combining waterfront views with authentic local taste.", "name": "Volga Pier Restaurant", "transport": "Walk to the Ashi River Cruise Pier within the resort"}, {"address": "Inside the Performing Arts Center, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A renowned venue combining vibrant Russian music and dance performances with a lavish feast of traditional Western cuisine. The charcoal-grilled Russian pork chop is charred on the outside and juicy on the inside, featuring thick, succulent meat infused with a delightful smoky aroma; paired with custom black pepper sauce, the flavor profile is rich and satisfying. Guests can savor authentic Russian delicacies while enjoying passionate Russian folk dances, making this dual sensory experience a hot spot for travelers.", "name": "Fantasia Show Restaurant", "transport": "Walk to the Performing Arts Center building within the resort"}, {"address": "Castle Area, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Housed within a grand castle-style building, offering a varied Russian traditional buffet alongside classic \u00e0 la carte options. The classic Olivier Salad features a smooth, refreshing texture, perfectly balancing mashed potatoes, diced ham, and pickles for a sweet and tangy finish. The red wine braised beef is stewed until melt-in-your-mouth tender, with the beef fully absorbing the rich gravy. The majestic castle atmosphere paired with traditional flavors makes it a traveler favorite.", "name": "Volga Castle Restaurant", "transport": "Take the shuttle bus from the manor entrance directly to the Castle Building"}, {"address": "Inside Country Hotel, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Located in the Country Hotel area of the manor, specializing in authentic local Harbin Northeastern comfort food. The steaming Braised Chicken with Mushrooms uses local hazel mushrooms and free-range chicken, creating a deep, savory broth with tender, flavorful meat. Di San Xian (Stir-fried Potato, Eggplant, and Pepper) features melt-in-your-mouth potato and eggplant chunks with a lightly charred, fragrant exterior. Perfectly showcasing the hearty and comforting essence of Northeastern dining, it is an unbeatable choice for authentic regional flavors.", "name": "Country Hotel Traditional Northeastern Restaurant", "transport": "Walk to the Country Hotel area within the resort"}, {"address": "Perimeter of Volga Manor Scenic Area, Ashi River Village, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A famous traditional rustic restaurant located near the outer perimeter of Volga Manor, renowned for authentic Harbin iron-pot stews. The steaming Iron-Pot Stewed Goose with Corn Cakes features goose slow-simmered for hours until intensely fragrant and tender, while the corn cakes soak up the rich sauce and develop a crispy, toasted bottom. This feast, filled with authentic Northeastern country flair and time-honored cooking techniques, draws endless food lovers to feast.", "name": "Ash River Folk Farmhouse Restaurant", "transport": "About a 5-minute taxi ride or a 15-minute walk from the main gate of Volga Manor"}], "name": "Iconic Local \u0026 Traditional Restaurants"}, "cat_2": {"items": [{"address": "Inside Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.6 stars | Nestled in the lush central area of the manor, Masha Cafe features cozy Russian-style log cabin (Mukeleng) architecture. It specializes in rich hand-poured Russian dark roast coffee and freshly baked Russian donuts (Pyshki). Crispy and golden on the outside with a dense, soft interior, they are served with cranberry jam and whipped cream for a delightful balance of sweet and tart. Sunlight filters through birch trees onto the outdoor seating, creating a relaxed, enchanting atmosphere loved by visitors.", "name": "Masha Cafe at Volga Manor", "transport": "Take Bus 377 to Chenggaozi Town and transfer to a dedicated minibus, or take a taxi directly from downtown Harbin to the scenic area."}, {"address": "Inside Miniaguer Attraction, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 stars | Replicating Harbin\u0027s famous historical Miniaguer building, its exterior resembles a giant wooden ship. The cafe bar specializes in traditional Russian black coffee and Russian Lieba (bread) brunch platters. The signature big Lieba bread is crusty on the outside and soft inside, featuring a subtle sourdough aroma. Spread thick with cheddar cheese and paired with savory Russian sausage, every bite is rich and satisfying. Its elevated location offers sweeping views of the Ashi River, making it an extremely popular brunch spot.", "name": "Miniaguer Cafe \u0026 Restaurant", "transport": "Walk about 8 minutes after entering Volga Manor, or take the park\u0027s electric sightseeing shuttle."}, {"address": "Golf Club Area, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 stars | Tucked away among expansive lawns and woods, this exquisite cafe serves specialty hazelnut lattes and freshly made Russian pancake (Blini) brunch. The pancakes are thin, soft, and smooth, wrapped around smoked salmon and sour cream for a perfectly balanced, layered sweet-and-savory flavor. The quiet, elegant atmosphere allows guests to admire the lush golf course and distant Russian spires up close, attracting travelers seeking a refined lifestyle.", "name": "Forest Golf Club Cafe", "transport": "Take the park\u0027s electric shuttle and get off at the Golf Course stop."}, {"address": "Next to St. Nicholas Church Square, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.7 stars | Adjacent to the classic wooden St. Nicholas Church, this cafe is filled with the rich aromas of freshly baked bread and coffee. The signature sliced Russian Lieba bread served with strawberry jam and a rich cappuccino makes for a popular brunch combo. The bread is satisfyingly chewy and grows more flavorful with every bite, topped with silky smooth milk foam. Many visitors to the art museum love sitting by the window, enjoying delicious food while admiring the stunning Russian architectural scenery.", "name": "St. Nicholas Art Museum Cafe \u0026 Bakery", "transport": "Located in the core cultural area of the manor, about a 5-minute walk from the main entrance."}, {"address": "Inside Golden Ring Western Restaurant, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.8 stars | Renowned for its luxurious Russian fine dining, its morning-to-afternoon Russian cottage cheese pancake (Syrniki) brunch is equally acclaimed. Pan-fried to a golden crisp on the outside, the pancakes are soft and tender inside with a rich milky flavor. Dipped in sour cream and honey, each bite offers a sweet, tangy, crisp-yet-tender delight. Paired with a hot spiced tea, it feels like stepping into a Moscow palace, earning top praise for its exquisite taste.", "name": "Golden Ring Restaurant Russian Brunch Bar", "transport": "Walk within the park or take the sightseeing boat to Golden Ring Dock."}, {"address": "Ashi Riverside, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.3 stars | A waterfront cafe located beside a branch of the Ashi River, specializing in Russian apple tart brunch and single-origin cold brew coffee. The apple tart has a crispy crust filled with soft, sweet apples infused with cinnamon, balancing wonderfully with the smooth, slightly bitter coffee. Sitting on the outdoor riverside patio, you can watch swans gliding across the water. The relaxed and cozy vibe makes families and couples linger with pleasure.", "name": "Volga Riverside Afternoon Tea \u0026 Cafe", "transport": "Easily accessible by walking along the riverside scenic trail inside the park."}, {"address": "Inside Fantasia Performance Hall, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.2 stars | Imbued with vibrant Russian artistic flair, this coffee lounge specializes in savory Russian beef pies and aromatic latte coffee. The pie features a flaky, layered crust stuffed with juicy, well-seasoned beef filling that is deeply satisfying. Quiet and spacious in the morning with comfortable sofa seating, it is a great spot for tourists to enjoy a refined brunch before watching a performance.", "name": "Fantasia Show Restaurant Coffee Lounge", "transport": "Located near Performance Square inside the park; reachable on foot or by electric shuttle."}, {"address": "Upper Level, Tsaritsyno Castle, Volga Manor, No. 100 Volga Road, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.6 stars | Perched high up in the castle, this scenic view cafe offers magnificent panoramic vistas of the manor\u0027s entire Russian castle complex. It serves special rye smoked meat sandwiches and Dutch cold drip coffee. The sandwich features crusty rye bread packed with thick-cut smoked beef and pickles, creating an appetizing savory and tangy flavor. With spectacular castle sights for the eyes and delicious flavors for the palate, it comes highly recommended by influencers and tourists alike.", "name": "Tsaritsyno Castle View Cafe", "transport": "Climb the stairs from the castle area entrance or take the internal elevator to reach the top."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Inside Volga Manor Scenic Area, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | The most iconic Russian restaurant in Volga Manor, recreating the original Baron Hotel from the 1913 Khabarovsk Exhibition. It serves highly unique, authentic Russian royal cuisine paired with select vodkas. The signature Braised Beef in a Pot is slow-cooked until amazingly tender and flavorful, bathed in a rich, sweet-and-sour broth that pairs wonderfully with crisp-on-the-outside, soft-on-the-inside Russian Dalieba bread. Both tourists and locals highly praise its luxurious heavy-timber interior and authentic Russian flavors, making it the top choice for an exotic dining experience.", "name": "Golden Ring Russian Restaurant", "transport": "Take the dedicated Manor bus or a downtown taxi directly to the scenic area entrance, then proceed on foot."}, {"address": "Miniature Island, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Replicated from Harbin\u0027s famous historical Miniature Restaurant, this building resembles a sailboat anchored on Sun Island. The bistro specializes in Russian buffets and classic local specialties, seamlessly combining Northeastern Chinese ingredients with Russian culinary techniques. The classic Russian Borscht is sweet, sour, and appetizing, featuring a rich beet and beef broth that leaves a lasting impression, perfectly paired with pan-fried Taimen salmon boasting crisp skin and tender, juicy meat. Its beautiful lakeside views and varied menu options attract streams of visitors.", "name": "Miniature Restaurant", "transport": "Take a cruise within the manor to Miniature Dock or walk along the waterfront promenade."}, {"address": "Inside Volga Wine Castle, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Nestled in the basement of the majestic Volga Wine Castle, this bar exudes a rustic and mysterious Russian winery atmosphere. It exclusively serves a variety of authentic Russian vodkas alongside exquisite bar bites. The most popular experience is drinking vodka from carved ice glasses\u2014one icy gulp ignites a fiery burst of aroma down your throat, delivering the ultimate sensation of fire and ice. Complemented by special pickles, savory salmon caviar tartlets, and sliced cured pork fat (Salo), it is a must-visit destination to experience Russian dining and drinking culture.", "name": "Volga Wine Castle Vodka Bar", "transport": "Take the scenic area shuttle bus to Volga Wine Castle Station and walk from there."}, {"address": "1F, Forest Country Hotel, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Tucked away among the manor\u0027s dense forest and lakes, this country-style bistro serves cozy Russian home-style dishes alongside local Northeastern farmhouse cuisine. The specialty dish, \u0027Russian Sausage Platter,\u0027 features coarse-grain sausages of various flavors grilled to an aromatic crispness that bursts with juice in every bite, perfectly accompanied by sauerkraut and mustard. It also offers the classic Northeastern Guo Bao Rou (crispy sweet and sour pork), which is crispy outside, tender inside, and balanced in flavor. The warm wooden ambiance and generous, budget-friendly portions make it a favorite for families and group travelers.", "name": "Forest Country Hotel Russian Bistro", "transport": "Walk within the scenic area or take the park shuttle to Forest Country Hotel Station."}, {"address": "Next to Masha Memorial Hall, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Centered around rich Russian countryside charm, Masha offers an exquisite Russian bistro experience. The restaurant\u0027s classic \u0027Baked Creamy Casserole\u0027 combines ham, potatoes, mushrooms, and rich cheese baked to bubbly golden perfection, delivering a smooth texture overflowing with milky aroma. Paired with freshly poured Russian draft beer or mulled wine, it brings cozy warmth during cold winters. The inviting lighting and friendly service ensure a pleasant evening for couples and travelers alike.", "name": "Masha Russian Restaurant \u0026 Bar", "transport": "Walk along the main road toward Tsaritsyno Castle for about 8 minutes."}, {"address": "1F, Pushkin Exhibition Hall, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Named after the great Russian poet Pushkin, this artistic bistro combines the charm of a literary salon with refined light dining and drinks. It serves freshly ground Russian coffee, specialty craft beers, along with delicate Russian pastries and light bites. The signature \u0027Russian Black Bread with Sour Cream\u0027 has a dense, chewy texture that yields pure wheat aroma as you chew, making it delightful when paired with hot cocoa or red wine. Elegant classical music and wall-to-wall art paintings make it an ideal spot for photography and relaxation.", "name": "Pushkin Salon Bistro", "transport": "Walk within the scenic area to the Pushkin Salon building complex."}, {"address": "Outer surrounding road section of Volga Manor Scenic Area, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Located at the boundary between the manor and surrounding countryside, this specialty local restaurant specializes in authentic time-honored Northeastern dishes and local fruit wines. The must-order \u0027Iron Pot Stewed River Fish\u0027 uses fresh fish caught from the Ashi River, slow-simmered with wide glass noodles, tofu, and special sauces in an iron pot. The fish meat is extraordinarily tender, while the bouncy noodles soak up rich flavors, complemented by cornmeal cakes stuck to the side of the pot that are crispy on the bottom and soft inside. The traditional heated kang seating area exudes authentic local warmth, making it a wonderful place to taste genuine regional dishes.", "name": "Volga Old Daowai Farmer\u0027s Cuisine", "transport": "Exit the main gate of Volga Manor, walk along Zhengao Road for about 5 minutes, or take a local tricycle."}, {"address": "Ashi River Waterfront Deck Area, Volga Manor, No. 168 Zhengao Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Situated along the Ashi River, this open-air and semi-open waterfront bistro offers prime views of the water and castle reflections. It features \u0027Russian Charcoal-Grilled Oysters and Russian Giant Meat Skewers\u0027. The massive skewers are marinated with special spices and grilled over charcoal until juicy and bubbling, imbued with a distinct charcoal aroma; paired with a cold glass of Kvass or Harbin Beer, it is thoroughly refreshing. Enjoying fine drinks and food here while admiring the river sunset in summer and autumn creates a truly romantic vibe.", "name": "Ashihe Riverview Outdoor Bistro", "transport": "Walk along the Ashi River trail within the scenic area to the waterfront deck."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Gold Ring Restaurant, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.6 stars | Located in the heart of Volga Manor, this restaurant, steeped in a grand Russian palace style, offers a dedicated Russian vegetarian menu. Highly recommended are the Vegetarian Russian Borscht and Baked Creamy Mushrooms\u2014warm, rich, and bursting with wild mushroom aromas that unfold in your mouth. Paired with authentic Russian Dalieba bread, crispy on the outside and soft inside, it offers amazing texture. A favorite for health-conscious diners and photography enthusiasts alike.", "name": "Gold Ring Restaurant - Vegetarian Section", "transport": "Walkable within the park, or take the manor sightseeing battery car and get off at Gold Ring Restaurant Station."}, {"address": "Inside Minuer Restaurant, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 stars | Recreating the glory of Harbin\u0027s historically famous Minuer Restaurant, this spot offers a rich array of vegetarian salads and Russian cold dishes. A must-try is the Russian Pickled Cucumber Mashed Potatoes\u2014smooth and refreshing potato mash paired with tangy, crunchy Russian pickles and herbs for a delightfully complex, non-greasy taste. Highly praised by healthy eaters and tourists alike.", "name": "Minuer Restaurant - Plant-Based Russian Buffet", "transport": "Located in the central area of the manor, about a 3-minute walk from the main castle building."}, {"address": "Inside Petrov Palace, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 stars | Enjoy a thoughtfully designed Russian monastery-style vegetarian set menu inside the magnificent Petrov Palace. The featured \u0027Russian Baked Cheese Seasonal Vegetables\u0027 slow-bakes fresh seasonal veggies with rich cheese, yielding a tender, juicy, and subtly charred delight. Paired with steaming hot fruity floral tea, it transports you to the elegant days of a Russian estate.", "name": "Petrov Palace Restaurant - Monastery Vegetarian Set Menu", "transport": "Take the manor cruise boat to Petrov Palace Pier, or walk about 8 minutes from the park\u0027s main road."}, {"address": "Forest Restaurant, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.3 stars | Nestled in a log cabin amidst the manor\u0027s lush woods, this restaurant focuses on combining Northeast wild mushrooms with Russian culinary techniques. Highly recommended are the \u0027Steamed Matsutake \u0026 Rare Mushroom Dumplings\u0027 and \u0027Sizzling Black Pepper Lion\u0027s Mane Mushroom\u0027. The lion\u0027s mane mushroom is tender and juicy, bursting with rich black pepper and butter aromas with a texture rivaling top-tier steak\u2014a must-try for vegetarian gourmets visiting the manor.", "name": "Forest Restaurant - Wild Mushroom Vegetarian Feast", "transport": "Walk about 5 minutes along the manor forest trail, or take a direct battery shuttle."}, {"address": "Along the Ashi River Bank, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.2 stars | Located next to the beautiful Ashi River, this teahouse offers strict vegan and lacto-ovo vegetarian traditional Russian pastries. The \u0027Vegetarian Sauerkraut \u0026 Potato Pirozhki\u0027 is a standout: golden, crispy pastry wrapped around tangy sauerkraut and smooth mashed potatoes. Crispy outside, soft inside, with a perfect blend of savory and sour flavors, it delivers an authentic Russian countryside vibe beloved by riverside strollers.", "name": "Ashi River Teahouse - Russian Vegetarian Tea \u0026 Pastry", "transport": "Located next to Ashi River Pier; easily accessible on foot or by water boat."}, {"address": "Entrance of Castle Square, Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City", "feature": "\u2b50 4.7 stars | Adhering to century-old traditional Russian handmade fermentation and baking methods, this bakery offers vegan \u0027Dalieba\u0027 rye bread and nut oat biscuits. The rye bread features a chewy, firm crust with a slightly sour interior infused with natural wheat and fruitwood smoke aromas\u2014tasting even better as you chew. Paired with special vegan jam, it is a must-buy walking snack and souvenir for tourists.", "name": "Volga Fortress Bakery - Traditional Vegetarian Rye Bread", "transport": "Located right at the main entrance of the Volga Manor Tourist Center, easily reachable on foot."}, {"address": "Near the intersection of Gongbin Road and Hacheng Road, Xiangfang District, Harbin City (along the connecting road to Volga Manor)", "feature": "\u2b50 4.5 stars | A highly-rated Chinese vegetarian restaurant in the commercial area of Xiangfang District near Volga Manor, specializing in refined mock-meat dishes and traditional Northeastern vegetarian cuisine. The signature dish \u0027Vegetarian Sweet and Sour Pork Ribs\u0027 is crafted from lion\u0027s mane mushrooms and lotus root nodes, coated in a thick sweet-and-sour sauce. Crispy and juicy with rich layers, it perfectly recreates a classic Northeastern delicacy, making it a popular dining choice before or after visiting the manor.", "name": "Sanshengxiang Vegetarian Restaurant - Xiangfang Branch", "transport": "About 15 minutes by taxi from Volga Manor, or take Bus 377 and get off at Gongbin Road Station."}, {"address": "Along Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City (near the connecting road to Volga Manor entrance)", "feature": "\u2b50 4.4 stars | An elegant vegetarian restaurant located near Volga Manor with a quiet, pleasant atmosphere. The signature \u0027Di San Xian (Three Treasures of the Earth)\u0027 reinterprets the famous Northeastern dish in a low-oil, healthy way\u2014eggplant, potatoes, and green peppers are gently braised in a special sauce, rendering them tender, flavorful, and sweet while remaining light and guilt-free. Highly loved by health-conscious visitors.", "name": "Jingxinyuan Zen Vegetarian Restaurant", "transport": "About 5 minutes by car from the main gate of Volga Manor, offering convenient transport."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Next to Pavlov Castle Square, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.6 Stars | Freshly baked Dalieba (Russian bread) boasts a golden, crispy crust with a rich sourdough aroma and wheat sweetness inside. Paired with freshly poured chilled Kvass\u2014refreshingly fizzy, sweet, and tangy\u2014it\u0027s the ultimate authentic Russian snack combo for strolling through the estate castles and a must-have for photo check-ins.", "name": "Volga Russian Bakery Stall", "transport": "Walk within the manor or take the scenic electric shuttle bus and get off at Pavlov Castle Station."}, {"address": "Snack stall outside St. Nicholas Church Art Museum, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 Stars | Freshly grilled fruitwood-smoked red sausage with a lightly charred, crisp casing that bursts with juicy goodness upon first bite. The rich garlic aroma blends perfectly with the savory, succulent meat\u2014a hugely popular grab-and-go hot street snack enjoyed by almost every visitor in the manor.", "name": "St. Nicholas Castle Snack Kiosk", "transport": "Walk within the manor to the plaza surrounding St. Nicholas Church."}, {"address": "Stall outside Miniur Restaurant, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.7 Stars | This classic milk ice cream bar features an ultra-creamy, dense texture that melts in your mouth, bursting with pure fresh milk and cheese flavors. Enjoying an ice cream bar amidst snowy winter surroundings is a uniquely romantic Harbin walking dessert loved by both tourists and locals.", "name": "Miniature Ice Cream Pavilion", "transport": "Walk within the manor to the area near the Miniur Viewing Platform."}, {"address": "Market area outside Fantasia Show Club, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 Stars | Freshly baked Russian chimney cakes dusted with cinnamon sugar and chopped nuts offer a crispy exterior and soft, layered interior. Paired with aromatic mulled wine\u2014where fruity sweetness meets warm spices\u2014it is the winter market\u0027s favorite comfort food to keep you warm while strolling.", "name": "Fantasia Market Stall", "transport": "Walk within the manor to the plaza in front of Fantasia Show Club."}, {"address": "Snack Street, Tsaritsyno Castle Scenic Area, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.3 Stars | Sizzling on the griddle, the grilled cold noodles (Kao Leng Mian) are pleasantly chewy, brushed with a special sweet, sour, and spicy sauce, and wrapped around eggs, minced onions, and sausage. Crisp on the outside and soft inside, this explosion of sweet, savory, and spicy flavors is an iconic local street food hit among young travelers.", "name": "Tsaritsyno Flavor Stall", "transport": "Take the manor boat to Tsaritsyno Wharf or walk there."}, {"address": "Outdoor stall near Pushkin Exhibition Hall, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.5 Stars | Charcoal-grilled, oversized Russian skewers featuring a seared, aromatic exterior and juicy, tender meat spiced with cumin and herbs. Paired with freshly fried, golden potato pancakes\u2014crisp on the outside and fluffy inside\u2014this satisfying snack is deeply fulfilling during a leisurely stroll.", "name": "Pushkin Salon Grill Kiosk", "transport": "Walk within the manor to Pushkin Salon Square."}, {"address": "Rest Square, Forest Golf Course, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.2 Stars | Bite into a candied hawthorn stick (Tanghulu) for a satisfying crunch that balances tart juice with sweet sugar coating; or enjoy sliced frozen pears served in a cup\u2014soft, incredibly juicy, and refreshing. It\u0027s a must-try traditional Northern winter dessert experience while exploring the manor.", "name": "Forest Golf Rest Kiosk", "transport": "Walk within the manor or take the sightseeing electric bus and get off at Forest Golf Course Station."}, {"address": "Riverside snack kiosk along Ashi River, Volga Manor, Chenggaozi Town, Xiangfang District, Harbin City", "feature": "\u2b50 4.4 Stars | Freshly made Russian pancakes (Blini) with a subtle milky fragrance and lightly browned golden edges. Tender and delightfully chewy, they are served with rich Russian sour cream or sweet jam. Light, delicious, and perfectly balanced, this delicate treat is a visitor favorite along the Ashi River.", "name": "Ashih River Bistro Kiosk", "transport": "Walk along the Ashi River scenic trail within the manor."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Volga Manor Scenic Area"}, "yabuli_resort": {"categories": {"cat_1": {"items": [{"address": "Jinjin Avenue, Yabuli Ski Tourism Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | A famous traditional restaurant around Yabuli Ski Resort brimming with authentic Northeastern charm. The most popular dishes among skiers are \u0027Iron Pot Stewed Goose\u0027 and \u0027Iron Pot Stewed River Fish\u0027. The goose meat is tender, firm, and deeply braised to absorb the rich savory broth, resulting in a melt-in-your-mouth, aromatic texture. Paired with corn cakes pressed against the inside of the pot\u2014crispy and golden on the bottom, soft and sauce-soaked on top\u2014every bite offers an unforgettable dual texture. The restaurant preserves traditional Northeastern Kang bed seating and vibrant floral fabric decor, offering an immersive local rustic atmosphere.", "name": "Shanli Renjia Iron Pot Stew", "transport": "Recommended to take a 10-minute taxi ride from Yabuli South Railway Station."}, {"address": "Next to the Ski Resort Entrance, Resort Area, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Famous for slow-cooked pork ribs with green beans and free-range chicken with mushrooms over firewood, this renowned classic represents authentic local farmhouse cuisine. Featuring wild hazel mushrooms from Changbai Mountain and local free-range chicken, the meat is simmered until tenderly falling off the bone and incredibly juicy. The unique forest aroma of the mushrooms thoroughly infuses the broth, giving it a smooth and rich flavor. Enjoying a hot bowl of soup here after skiing will warm you up completely. The lively atmosphere makes it a favorite among domestic and international tourists as well as locals.", "name": "Linhai Xueyuan Iron Pot Stew", "transport": "About a 15-minute walk from the main ski resort service center, or take the resort\u0027s free shuttle bus."}, {"address": "Qingyun Town, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | A classic Northeastern restaurant preserving decades of culinary tradition, famous for its signature dish \u0027Guo Bao Rou\u0027 (Crispy Sweet and Sour Pork). Using premium pork tenderloin, the meat is coated in starch and fried to a golden crispness, then tossed in a perfectly balanced sweet and sour sauce. It offers a satisfying crunch with every bite while locking in juicy tenderness\u2014sweet, tangy, and refreshing. Additionally, \u0027Di San Xian\u0027 (Saut\u00e9ed Eggplant, Potato, and Pepper) is a must-order on every table, featuring soft eggplant and fragrant crispy potatoes for a heartwarming, home-cooked feel.", "name": "Guandongqing Courtyard Northeastern Cuisine", "transport": "Located in the Qingyun Town commercial area; accessible in about 15 minutes via shuttle bus from Yabuli West Railway Station."}, {"address": "Beside Yaxue Highway, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A highly reputable restaurant specializing in traditional Northeastern iron pot stewed goose, insisting on live stewing over open wood stove fires. The goose meat is plump and chewy, releasing rich savory aromas after hours of simmering. Paired with soft Northeastern potatoes and wide glass noodles\u2014which absorb the rich goose oil to become bouncy, translucent, and deeply flavorful. Tourists love sitting on the warm traditional heated Kang bed to enjoy this piping-hot pot of deliciousness, driving away the freezing cold outside.", "name": "Lao Guandong Goose Iron Pot Stew", "transport": "Takes about a 5 to 8-minute taxi ride from major hotel areas in the ski resort."}, {"address": "Near Windmill Village, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | A traditional specialty restaurant highlighting mountain delicacies (wild mushrooms and edible wild herbs) from the Changbai and Lesser Khingan ranges. \u0027Stewed Wild Pheasant with Matsutake\u0027 and \u0027Saut\u00e9ed Wild Fern\u0027 are signatures; the wild mushroom broth is extraordinarily savory and juicy with a delicate natural forest aroma, while the crisp fern refreshes the palate, perfectly balancing the rich flavors of Northeastern cuisine. Highly favored by food lovers seeking healthy, revitalizing, and authentic local mountain flavors.", "name": "Yabuli Mountain Delicacy Restaurant", "transport": "About a 5-minute walk from Windmill Village, very conveniently located."}, {"address": "Chezhan Road, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | A well-established, affordable classic highly recommended by locals, renowned for its generous portions and authentic taste. The must-order \u0027Sha Zhu Cai\u0027 (Pork and SauerKraut Stew) perfectly combines pickled cabbage, pork belly, and blood sausage. The sauerkraut is crisp, tart, and cuts through richness effortlessly; the blood sausage is as smooth and tender as tofu, while the pork belly is rich without being greasy. The friendly, welcoming vibe makes it a top choice for ski instructors and veteran skiers gathering after a day on the slopes.", "name": "Baihuaxiang Northeast Restaurant", "transport": "Located in the town center of Yabuli, about an 8-minute walk from Yabuli Railway Station."}, {"address": "Yunshui 1st Road, Yabuli Ski Tourism Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | A classic eatery specializing in hand-rolled Northeastern dumplings and traditional snacks. The dumpling skins are freshly rolled to order, giving them a satisfying chew wrapped around plump, juicy fillings. The most popular variants, \u0027Sour Cabbage \u0026 Pork Dumplings\u0027 and \u0027Three Delicacies Shrimp Dumplings\u0027, burst with rich, savory juice the moment you bite into them, perfectly blending the subtle tartness of sauerkraut with savory pork. The shop also serves steaming candied hawthorns and frozen pears, offering a refreshingly sweet, icy-tart dessert experience.", "name": "Heitudi Specialty Dumpling House", "transport": "Located in the central commercial area of the ski resort; within walking distance of major ski rental halls."}, {"address": "Jingguan Avenue, Qingyun Town, Yabuli Tourism Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | A specialty restaurant preserving an authentic, rustic farmhouse feel, showcasing \u0027Iron Pot Stewed River Fish\u0027 and \u0027Stewed Chicken with Mushrooms\u0027. Using fresh fish caught from Lianhua Lake, the tender, odorless fish meat simmers alongside tofu and glass sheet noodles over time. The tofu absorbs all the rich fish broth, becoming deeply flavorful and tender. Many visitors love pairing their meal with house-brewed blueberry wine and local rice, rich in fragrance and showcasing the purest flavors of the Northeastern fertile black soil.", "name": "Yabuli Farmhouse Iron Pot Stew", "transport": "Take the Qingyun Town local loop bus and get off at Jingguan Avenue Station."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Next to the Summit Cable Car Station, Sun Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Perched atop a mountain nearly 1,000 meters high, offering spectacular 360-degree panoramic snow views. The piping hot latte paired with freshly baked Black Forest waffles is a favorite among skiers. Rich, creamy foam glides smoothly on the palate, warming your entire body instantly in the freezing weather. Crispy on the outside and soft on the inside with a subtle sweetness, the chocolate waffles are loved by both domestic and international tourists as well as photography enthusiasts.", "name": "Yabuli Sun Resort Summit Cafe", "transport": "Take the Sun Resort A1 high-altitude cable car to the Summit Station; it is located right outside the station."}, {"address": "Inside Club Med Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Offers top-tier all-day French brunch and specialty coffees in an elegant, romantic atmosphere. Their signature Morning Sun Omelet with smoked bacon oozes rich melted cheese when sliced open. Paired with a dark roast Americano featuring a sweet-bitter balance and subtle fruity notes, it\u0027s the top choice for skiers to recharge while enjoying an upscale resort vibe.", "name": "Club Med Yabuli L\u0027Oxyg\u00e8ne Lounge \u0026 Brunch Bar", "transport": "Take the resort\u0027s dedicated shuttle bus from Yabuli South Railway Station for about 10 minutes."}, {"address": "1st Floor, Avaunce Hotel, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Features large floor-to-ceiling windows overlooking stunning ski slopes, serving hearty Northeast Asian specialty brunch and Caramel Macchiatos. The sweet caramel aroma on hot coffee blends perfectly with nutty notes, while freshly made Russian pancakes with berry jam offer a delightfully sweet and tangy flavor. With a golden crisp exterior and soft interior, it attracts countless families and young travelers for photos.", "name": "Yabuli Avaunce Snow View Brunch \u0026 Cafe", "transport": "Take a taxi from Yabuli Railway Station for about 25 minutes, or take the resort loop bus to Avaunce Hotel Station."}, {"address": "1st Floor, Tourist Service Center, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | One of the most unique ski resort Starbucks locations in China, featuring a warm and cozy wooden cabin design. The signature Toffee Nut Crunch Latte is delightfully sweet without being cloying, paired with a rich and silky cheesecake. It offers a familiar, high-quality, and comforting break during cold skiing sessions, making it a must-visit spot for tourists.", "name": "Starbucks Coffee Yabuli Ski Resort", "transport": "Walk directly to the Tourist Service Center of Yabuli Resort."}, {"address": "No. 18, Commercial Street, Qingyun Town, Yabuli Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | A cozy space crafted with vintage red brick and raw wood, specializing in specialty pour-over coffee and Japanese pancakes. Their Ethiopian light roast pour-over boasts bright floral and fruity notes, pairing perfectly with fresh-out-of-the-oven souffl\u00e9 pancakes that melt like clouds in your mouth. The subtle sweet egg aroma perfectly complements the bright acidity of the coffee, making it hugely popular among young hipsters.", "name": "Forest Snow Valley Brick \u0026 Wood Coffee", "transport": "Take the dedicated minibus from Yabuli South Railway Station for about 15 minutes to Qingyun Town, then walk."}, {"address": "No. 1, Commercial \u0026 Office Area, next to the Beginner Slope, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Styled like an American snow cabin, specializing in high-energy, generous brunch portions and espresso. The classic American steak platter comes with sunny-side-up eggs and crispy hash browns. Golden on the outside and tender inside, the hash browns paired with a rich oat latte provide all the energy needed for a day on the slopes, attracting many foreign ski enthusiasts for a relaxing morning.", "name": "Snowfall Foothill American Brunch \u0026 Coffee", "transport": "Located at the bottom of the beginner slope; skiers can glide right up to the rest area in front of the restaurant."}, {"address": "Inside the Broadcast International Exchange Center, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Quiet and cozy environment, serving classic Italian espresso beverages and passionfruit pie. The hot Mocha topped with rich chocolate sauce and freshly whipped cream blends bitter and sweet flavors, while the pie features a flaky crust with a pleasantly tangy fruit filling. It is a fantastic hidden gem to warm up, quietly read, or chat with friends after skiing.", "name": "Yabuli Broadcast Hotel Rest Cafe", "transport": "Take the resort internal shuttle bus and get off at the Broadcast International Exchange Center Station."}, {"address": "2nd Floor Leisure Area, Ski Hall, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A bistro combining Oriental flavors with modern coffee craftsmanship. Their signature Osmanthus Oat Latte features subtle floral and rich grain notes, served alongside a golden, toasted French garlic sandwich. With a crunchy bite, savory melted cheese, and aromatic garlic, it instantly whets the appetite, making it a highly popular spot for female guests and couples.", "name": "Snow Realm Osmanthus Latte \u0026 Bistro", "transport": "Enter the Yabuli New Sports Bureau Ski Hall and take the elevator to the 2nd floor."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Daguokui Mountain Top, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A scenic bistro perched at the summit of Yabuli Ski Resort, serving rich, authentic Northeast Chinese cuisine and fine mulled wine. The signature stewed venison with wild mountain mushrooms is tender, juicy, and rich in earthy mushroom aromas\u2014a heart-warming feast on a freezing mountaintop. Crispy yet juicy roasted suckling pig and specialty hot drinks make it a top refuel choice for skiers. Paired with breathtaking panoramic views of snow-covered pine forests, it is immensely popular among tourists and seasoned skiers alike.", "name": "Yabuli Mountain Top Windmill Restaurant", "transport": "Take the Yabuli Ski Resort ropeway/cable car to Daguokui Summit Station."}, {"address": "No. 28 Central Street, Qingyun Town, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.8 stars | An absolute must-try local Northeast specialty when visiting Yabuli! The signature simmered goose with hazel mushrooms is slow-cooked over a wood fire in a massive iron pot. The goose meat is tender, savory, and rich, while the corn flatbreads stuck to the sides of the pot absorb the flavorful broth, rendering a crispy bottom and a soft, sweet interior. The striking contrast of textures and authentic rustic flavors leave every diner raving. It is the perfect spot for group dining and experiencing bold Northeast food culture.", "name": "Yabuli Qingyun Town Farmhouse Iron Pot Stew", "transport": "About a 10-minute taxi ride from Yabuli South Railway Station."}, {"address": "Inside Club Med Resort, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 stars | An exquisite bistro \u0026 bar blending high-end resort ambiance with local Northeast flavors. The restaurant offers French-inspired interpretations of regional ingredients alongside premium crafted cocktails. Highly recommended are the black truffle wild mushroom risotto and French roasted lamb chops\u2014crispy on the outside, juicy on the inside, and layered in flavor. Live music performances in the evening create a romantic and elegant atmosphere, making it the premier choice for travelers seeking a refined dining experience and evening relaxation.", "name": "Club Med Yabuli Birch Forest Specialty Bistro \u0026 Bar", "transport": "Within walking distance inside the resort, or accessible via the resort shuttle."}, {"address": "Next to the Cable Car Station, Yabuli Sun Mountain Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 stars | A snowy mountain-style bistro pairing craft beers with authentic Northeast pub snacks. The classic Northea
