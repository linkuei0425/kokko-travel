    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A grand cathedral built in magnificent Byzantine architectural style. As one of Harbin\u0027s most famous landmarks, it exudes a captivating Russian flair when illuminated at night.", "duration": "1-2 hours", "title": "Saint Sophia Cathedral", "transport": "Take Bus 1, 5, or 20 to \u0027Zhaolin Street\u0027 Stop, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | The longest pedestrian street in Asia, lined with century-old buildings in various European architectural styles. Don\u0027t miss tasting the classic Modern Popsicle here!", "duration": "2-3 hours", "title": "Zhongyang Pedestrian Street", "transport": "Take Metro Line 2 to \u0027Zhongyang Street\u0027 Station for direct access"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A world-class ice and snow theme park featuring massive ice structures, thrilling ultra-long ice slides, and breathtaking night light shows.", "duration": "3-5 hours", "title": "Harbin Ice and Snow World", "transport": "Take Metro Line 2 to \u0027Ice and Snow World\u0027 Station for direct access"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A national 5A-rated scenic area featuring the majestic International Snow Sculpture Art Expo in winter and lush, refreshing greenery for summer retreats.", "duration": "3-4 hours", "title": "Sun Island Scenic Area", "transport": "Take Metro Line 2 to \u0027Sun Island\u0027 Station, or take the Songhua River Cableway across"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A scenic pedestrian walkway converted from a century-old railway bridge. Sections feature glass floors, offering splendid panoramic views of the Songhua River.", "duration": "1-2 hours", "title": "Chinese Eastern Railway Park (Songhua River Railway Bridge)", "transport": "Walk about 10 minutes from the northern end of Zhongyang Street, or take a bus to \u0027Stalin Park\u0027 Stop"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | Blending futuristic, organic curves seamlessly with its natural surroundings, this landmark was voted one of the world\u0027s best buildings and boasts modern interiors.", "duration": "1-2 hours", "title": "Harbin Grand Theatre", "transport": "Take Bus 35 or 122 to \u0027Harbin Grand Theatre\u0027 Stop"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A grand theme resort dedicated to Russian culture, meticulously recreating iconic historic Russian buildings and castles.", "duration": "4-6 hours", "title": "Volga Manor", "transport": "Taking a dedicated resort shuttle bus or a taxi is recommended; drive time is about 50 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A unique architectural blend of East and West, combining Baroque facades with traditional Chinese courtyard interiors steeped in historic charm.", "duration": "2-3 hours", "title": "Chinese Baroque Historic District", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station for direct access"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | An important memorial museum honoring history, revealing WWII truths through extensive historical records and preserved ruins.", "duration": "2-3 hours", "title": "Museum of Evidence of War Crimes by Japanese Army Unit 731", "transport": "Take Metro Line 1 to \u0027Xinjiang Street\u0027 Station, then walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A comprehensive museum housed in Russian-style architecture, displaying prehistoric fossils from Northeast China, Jin Dynasty relics, and Hezhen ethnic folk culture exhibits.", "duration": "1-2 hours", "title": "Heilongjiang Provincial Museum", "transport": "Take Metro Line 1 or Line 2 to \u0027Museum\u0027 Station for direct access"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A century-old street steeped in Russian atmosphere, home to the famous St. Alekseyev Church and charming specialty bookstores.", "duration": "1-2 hours", "title": "Gogol Street", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University\u0027 Station, then walk about 8 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A classic Russian Orthodox church featuring vibrant red brick walls offset by bright green onion domes, making a striking visual statement.", "duration": "1 hour", "title": "St. Alekseyev Church", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University\u0027 Station, then walk about 10 minutes to Shike Street"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A linear park stretching along the Songhua River with Russian sculptures and flowerbeds, ideal for relaxing walks and river views.", "duration": "1-2 hours", "title": "Stalin Park", "transport": "Walk straight ahead from the northern exit of Zhongyang Street"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Built to commemorate the heroic residents who conquered the catastrophic 1957 flood, standing as a proud symbol of Harbin\u0027s spirit.", "duration": "0.5-1 hour", "title": "Harbin Flood Control Monument", "transport": "Located at the northern end of Zhongyang Street, easily reachable on foot"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A polar-themed park famous for its animal performances, including the spectacular \u0027Heart of the Ocean\u0027 beluga whale show and cute penguin parades.", "duration": "3-4 hours", "title": "Harbin Polar Park", "transport": "Take Metro Line 2 to \u0027Sun Island\u0027 Station, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | The world\u0027s largest breeding and research center for Siberian tigers, where visitors can ride in specially reinforced safari buses to observe magnificent tiger packs up close.", "duration": "2-3 hours", "title": "Siberian Tiger Park", "transport": "Take Bus 35 or 122 and get off at \u0027Siberian Tiger Park\u0027 Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A historic downtown park that hosts the famous Harbin Ice Lantern Art Fair every winter, featuring exquisitely crafted, translucent ice sculptures.", "duration": "1-2 hours", "title": "Zhaolin Park", "transport": "Take Bus 16 or 64 to \u0027Daoli Sandao Street\u0027 Station, then walk for about 3 minutes."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | One of Asia\u0027s tallest steel towers, offering breathtaking panoramic views of Harbin, a fine revolving Western restaurant, and a thrill-seeking cloud walk experience.", "duration": "1-2 hours", "title": "Dragon Tower (Heilongjiang Network Broadcasting Tower)", "transport": "Take Bus 7, 24, or 71 and get off at \u0027Dragon Tower\u0027 Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Built in classic Qing Dynasty imperial architectural style, this is the largest and best-preserved Confucian temple complex in Northeast China.", "duration": "1-2 hours", "title": "Harbin Confucian Temple", "transport": "Take Metro Line 1 to \u0027Harbin Engineering University\u0027 Station and walk for about 5 minutes."}, {"category": "\ud83c\udfd         // Toggle Mobile Cart Drawer
        function toggleMobileCart() {
            if (cartDrawer.classList.contains('drawer-closed')) {
                cartDrawer.classList.remove('drawer-closed');
                cartDrawer.classList.add('drawer-open');
                mobileOverlay.classList.remove('hidden');
            } else {
                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }
        }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {
            const container = document.getElementById('filter-bar');
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function switchTab(tab) {
            activeTab = tab;
            if(tab === 'schedule') {
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                filterWrapper.style.display = 'block'; 
            } else {
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                filterWrapper.style.display = 'none'; 
            }
            renderPool();
        }

        function filterCategory(category) {
            currentFilter = category;
            ['All', '🏛️ Attractions', '🛍️ Shopping', '🍜 Dining', ...dynamicCats].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
