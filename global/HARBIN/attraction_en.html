            "@type": "PostalAddress",

he Harbin Jewish History and Culture Memorial Hall, showcasing Jewish life, cultural contributions, and deep friendships formed in Harbin during the early 20th century.", "name": "Harbin New Synagogue", "transport": "Walk about 10 minutes from Saint Sophia Square, or take Bus 21 or 105 to Jingwei Street Station."}, {"address": "No. 73 Central Street, Daoli District, Harbin, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Constructed in the 1940s near the intersection of Central Street and Toulong Street, this is a classic example of Neoclassical architecture. The facade displays rigorous symmetry crafted from solid granite blocks, while majestic entrances and soaring stone pillars showcase the grandeur of early financial institutions. Today, it stands as a historical gem seamlessly integrated into the vibrant vintage atmosphere of Central Street.", "name": "Former Concord Bank Building", "transport": "Take Metro Line 2 to Central Street Station and walk for about 3 minutes."}, {"address": "Bank of Songhua River, East Side of Stalin Park, Daoli District, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Built in 1900 and also known as the Harbin Middle East Railway Bridge, this was the first railway bridge over the Songhua River, bearing witness to a century of Harbin\u0027s growth alongside the railway. This all-steel historical structure has been transformed into a scenic pedestrian walkway complete with glass-bottomed sections, allowing visitors to walk over the flowing river and explore an iconic industrial heritage site connecting Daoli and Songbei districts.", "name": "Binzhou Railway Bridge (Harbin Railway Bridge)", "transport": "Walk east along Stalin Park from the Flood Control Monument on Central Street for about 10 to 12 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Saint Sophia Cathedral is Harbin\u0027s most famous landmark, built in 1907 in a classic Byzantine architectural style. Standing 53.35 meters tall, its massive red brick walls and full, dark-green onion dome display an unparalleled grandeur and majesty. The interior has been converted into the \u0027Harbin Architecture Art Museum\u0027, displaying precious historical photographs and city development materials, featuring a massive crystal chandelier and vintage restored frescoes. At night, illuminated by landscape lights, the cathedral appears even more magical and enchanting, making it an unmissable cultural and artistic sanctuary on Central Street and Sophia Square.", "name": "Saint Sophia Cathedral (Harbin Architecture Art Museum)", "transport": "Take Metro Line 2 to \u0027Shangzhi Thoroughfare Station\u0027 Exit 1 and walk for about 5 minutes; or take Bus 1, 5, 20, or 113 to \u0027Architecture Art Square Station\u0027."}, {"address": "No. 133 Diduan Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Located in a historic building near Sophia Square, Heilongjiang Provincial Art Museum was built in the early 20th century as a European-style commercial building with elegant, classic, and dignified lines. The museum houses a large collection of prints, watercolors, oil paintings, and sculptures with rich Northeast regional characteristics, particularly the Beidahuang prints of the Heilongjiang school, which enjoy great acclaim in the Chinese art world. It regularly hosts special contemporary art exhibitions and solo shows by famous artists. The spacious, artistic interior is the perfect place for art enthusiasts to experience Harbin\u0027s unique \u0027Ice and Snow Art\u0027 and \u0027Beidahuang Aesthetics\u0027.", "name": "Heilongjiang Provincial Art Museum", "transport": "About a 3-minute walk from Saint Sophia Cathedral; or take Bus 8, 28, or 206 to \u0027Diduan Street Station\u0027."}, {"address": "No. 85 Tongjiang Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Originally the Main Synagogue of Harbin built in 1909, the Harbin Jewish History and Culture Museum is one of the largest synagogue ruins in East Asia. The building blends Arabic and Jewish architectural styles, with its dome and Star of David emblem being particularly eye-catching. Through rich artifacts, documents, photographs, and recreated scenes, the museum meticulously records the glorious history of tens of thousands of Jewish people seeking refuge, living, conducting business, and developing culture in Harbin during the early 20th century. Walking through it offers a deep appreciation for the inclusive cultural heritage and heavy historical weight of Harbin, the \u0027Little Paris of the East\u0027.", "name": "Harbin Jewish History and Culture Museum (Main Synagogue)", "transport": "About a 5-minute walk from Central Street (near the intersection of Tongjiang Street and Youyi Road); or take Bus 126 or 128 to \u0027Tongjiang Street Station\u0027."}, {"address": "No. 108 Tongjiang Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Formerly the Jewish Secondary Synagogue built in 1921, the Harbin Old Synagogue Concert Hall features a classic combination of pitched-roof and Romanesque architecture. After meticulous restoration, it has been transformed into a highly artistic classical concert hall and exhibition space. The interior retains excellent acoustic design and exquisite wood carvings, regularly hosting string quartets, piano solos, and chamber music concerts. Here, visitors can not only enjoy elegant classical music but also savor rich Russian coffee and creative cultural products in the attached caf\u00e9 and bookstore, making it one of the most elegant cultural landmarks in the Central Street commercial area.", "name": "Harbin Old Synagogue Concert Hall", "transport": "About a 6-minute walk from Central Street; or take Bus 15 or 25 to \u0027Tongjiang Street Station\u0027."}, {"address": "No. 369 Youyi Road, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Situated near the northern end of Central Street and the banks of the Songhua River, the Harbin City Planning Exhibition Hall is a large-scale city museum combining modern design with a rich sense of history. Centered on the themes of \u0027Impressions of Harbin, City History, Construction Achievements, and Future Planning\u0027, the hall uses interactive multimedia installations, a 3D theater, and a massive panoramic city scale model to vividly showcase Harbin\u0027s century-long transformation from a small fishing village into a European-style international metropolis. The venue also features 3D scale models illustrating the architectural styles of Central Street across different eras, making it a fantastic first stop to gain deep insight into Harbin\u0027s architectural heritage and urban development.", "name": "Harbin City Planning Exhibition Hall", "transport": "About a 2-minute walk from the northern end of Central Street; or take Metro Line 2 to \u0027Central Street Station\u0027 and walk."}, {"address": "No. 100 Zhaolin Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Located at the intersection of Zhaolin Street and Liushu Street, just a few hundred meters from Sophia Square, the Harbin Museum Cluster consists of several century-old municipal heritage buildings. The cluster includes themed venues such as the Harbin Middle East Railway History Museum, Harbin City History Exhibition Hall, Ancient Fossil Museum, and Oil Painting Art Gallery. It showcases the cultural synthesis, Russian art styles, and rich paleontological fossils present in Harbin since the opening of the Chinese Eastern Railway. Free to the public, the quiet, elegant grounds exude a classical European manor charm, making it a hidden treasure for culture lovers to deeply explore Harbin\u0027s history.", "name": "Harbin Museum Cluster", "transport": "About a 5-minute walk from Saint Sophia Cathedral; or take Bus 16, 64, or 94 to \u0027Zhaolin Street Station\u0027."}, {"address": "Inside Modern Hotel, No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Located inside the iconic Modern Hotel in the heart of Central Street, the Modern Hotel History Museum commemorates a century of rich culture and history. Built in 1906, the Modern Hotel is an architectural masterpiece of the Art Nouveau movement. The museum detailedly chronicles the legendary history of this century-old hotel, including international dignitaries and scholars hosted here, as well as the historical shifts during the Chinese Eastern Railway era. On display are original 100-year-old classical European furniture, carved tableware, historical photos, and vintage gramophones. Stepping inside feels like traveling back in time to Harbin\u0027s most glamorous, modern era of the early 20th century. Trying a classic Modern Popsicle while visiting is an essential experience.", "name": "Modern Hotel History Museum", "transport": "Located in the core area of Central Street Pedestrian Mall; take Metro Line 2 to \u0027Central Street Station\u0027 and walk for about 5 minutes."}, {"address": "Near No. 115 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Nestled in a historic European-style building near Central Street, the Harbin Russian Oil Painting Gallery is an artistic space dedicated to showcasing and exchanging Russian realism and modern oil paintings. Due to historical ties, Harbin shares a deep connection with Russian art and culture. The gallery houses hundreds of original oil paintings by People\u0027s Artists, Honored Artists, and emerging talent from Russia, featuring subjects such as snowy landscapes, birch forests, portraits, and traditional Russian scenes. The quiet, elegant atmosphere offers an enriching artistic experience. Appreciation and acquisition consultations are available, making it an excellent spot to immerse yourself in the artistic heritage of \u0027Oriental Moscow\u0027.", "name": "Harbin Russian Oil Painting Gallery", "transport": "Located within Central Street Pedestrian Mall, easily reachable on foot; or take Metro Line 2 to \u0027Central Street Station\u0027 and walk."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 1 Jinjiang Street (Northern end of Central Street), Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.7 stars | Located on the south bank of the Songhua River in Daoli District, Harbin, Stalin Park is easily reached by walking to the northern end of Central Street. Built in 1953, this Russian-style riverside park is famous for its beautiful Russian flowerbeds, classical sculptures, and tree-lined promenade. In summer, it is a prime spot for locals and tourists to take cool walks and admire the expansive views of the Songhua River. In winter, it transforms into an ice-and-snow playground featuring river ice rinks and ice sculpture displays, offering a rich blend of history and natural river vistas.", "name": "Stalin Park", "transport": "Take Metro Line 2 to Central Street Station or Sun Island Station and walk, or take Bus 101, 102, or 103 to Flood Control Monument Station."}, {"address": "No. 74 Youyi Road, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.5 stars | Adjacent to St. Sophia Square and Central Street, Zhaolin Park is one of Harbin\u0027s earliest urban parks, named in honor of General Li Zhaolin, an anti-Japanese war hero. The park features lush greenery, clear lakes, classical bridges, and traditional pavilions. Every winter, it hosts the historic Harbin Ice Lantern Art Fair, showcasing crystal-clear ice lanterns and exquisite ice sculptures. It serves as a vital green space in downtown Harbin, combining natural ecology with rich history and culture.", "name": "Zhaolin Park", "transport": "Take Bus 16, 64, 83, or 94 to Zhaolin Park Station, or walk about 8 minutes from St. Sophia Square."}, {"address": "Riverside on the East Side of Stalin Park, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.6 stars | Extending along the historic century-old Middle East Railway site, this park connects the east side of Stalin Park with the century-old Binzhou Railway Bridge. It perfectly preserves old railway tracks, steam locomotives, and historical railway buildings, complemented by lush greenery and waterfront walkways. Visitors can stroll along the verdant path to step onto the historic railway bridge for panoramic views of the majestic Songhua River, enjoying a blend of industrial vintage charm and natural scenery.", "name": "Middle East Railway Impression Park", "transport": "Walk east along the river through Stalin Park from the Flood Control Monument on Central Street for about 15 minutes."}, {"address": "Riverside at the intersection of Jiangqiao Alley and Youyi Road, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.4 stars | Located to the west of Stalin Park, Jiuzhan Park is part of the ribbon riverside park along the south bank of the Songhua River. Featuring a long riverside green belt, dense trees, and cozy scenic pavilions, it is a local secret spot for morning exercise, catching sunsets, and admiring river views. In autumn, golden foliage beautifully contrasts with the river, while winter offers up-close views of the spectacular frozen Songhua River.", "name": "Jiuzhan Park", "transport": "Take Bus 12, 24, 56, 65, or 74 to Jiuzhan Station and walk a short distance."}, {"address": "Sophia Square, No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.8 stars | Surrounding the magnificent St. Sophia Cathedral, this square garden park seamlessly integrates European landscape design with century-old architecture. The area features manicured lawns, a large musical fountain, and decorative illumination. Visitors can enjoy European-style views of peace doves flying around the imposing cathedral, while summer nights feature light and fountain shows, making it the most romantic urban oasis in the Central Street commercial district.", "name": "St. Sophia Square Garden Park", "transport": "Take Metro Line 2 to Shangzhi Street Station and walk for about 5 minutes."}, {"address": "Along Yanjiang Road (both sides of Flood Control Monument), Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.6 stars | Located on both sides of the Flood Control Monument at the northern end of Central Street, this waterfront green promenade stretches several kilometers along the south bank of the Songhua River. Shaded by trees and brushed by river breezes, it features numerous outdoor benches, flower displays, and street performance areas. In summer, visitors can watch the vast river and tour boats, while in winter, you can step onto the thick ice to experience Harbin\u0027s unique frozen river landscape and snow park activities.", "name": "Songhua River Waterfront Promenade", "transport": "Walk to the northern end of Central Street, or take Metro Line 2 to Central Street Station."}, {"address": "Intersection of Tongjiang Street and Youyi Road, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.2 stars | Located near Central Street, Tongjiang Street Green Square is a street corner oasis that integrates Harbin\u0027s Jewish historical and cultural background. The park is lush with dense trees and features historical sculptures and benches. Away from the hustle and bustle of Central Street\u0027s main thoroughfare, it offers a quiet and elegant spot to rest, making it perfect for taking a break after strolling along the old Jewish neighborhood.", "name": "Tongjiang Street Green Square", "transport": "Walk west from Central Street for about 5 minutes to Tongjiang Street."}, {"address": "Intersection of Jingwei Street and Shangzhi Street, Daoli District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.1 stars | Located on the south side of the Central Street commercial district, Jingwei Street Park is an important linear street park in Daoli District. It features native Northeast Chinese trees such as white birches and lilacs, filling the park with fragrance during blooming season. Equipped with pedestrian paths and scenic corridors, it skillfully blends European architectural elements with urban park landscapes, giving visitors and residents a tranquil green retreat amidst the busy downtown.", "name": "Jingwei Street Park", "transport": "Take Metro Line 2 to Shangzhi Street Station and walk about 3 minutes along Jingwei Street."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Saint Sophia Cathedral is Harbin\u0027s most iconic Byzantine architectural landmark. Built in 1907, its grand green onion dome and red brick walls exhibit a rich Russian exotic charm. Visually stunning both day and night when illuminated, it is an absolute must-visit photo spot in Harbin. Pigeons often soar across the square against the romantic architectural backdrop, making it effortless to capture stunning, European-style shots. The interior now houses the Harbin Architecture Art Museum, displaying a century of the city\u0027s historical transformation.", "name": "Saint Sophia Cathedral", "transport": "Take Metro Line 2 to \u0027Shangzhi Thoroughfare Station\u0027 Exit 1, then walk for about 5 minutes."}, {"address": "Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Renowned as \u0027Asia\u0027s First Street\u0027, Central Street is a 1,450-meter-long pedestrian boulevard featuring over a century of Western architectural history. Paved with precious granite cobblestones, the street is lined with historic Western buildings blending Renaissance, Baroque, and Eclectic styles. Every season offers distinct charm, especially in winter when it is adorned with brilliant ice sculptures and Christmas lights. Strolling down the street with a classic Modern popsicle while soaking in the unique European romantic and nostalgic vibes makes it a core photo spot beloved by travelers worldwide.", "name": "Harbin Central Street", "transport": "Take Metro Line 2 to \u0027Central Street Station\u0027 and exit right onto the street."}, {"address": "Riverside at the northern end of Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Located at the northern end of Central Street along the Songhua River, the Harbin Flood Control Monument was built in 1957 to commemorate the people of Harbin overcoming a historic massive flood. This grand monument features a cylindrical tower surrounded by a semi-circular colonnade, beautifully carved and majestic. A group of heroic sculptures stands atop the tower facing a broad square that merges with the scenic river view. It serves as the ultimate starting point for taking photo souvenirs, admiring river views, and enjoying winter ice activities, showcasing the resilient spirit of this heroic city.", "name": "Harbin Flood Control Monument", "transport": "Take Metro Line 2 to \u0027Central Street Station\u0027, then walk north along Central Street to the end."}, {"address": "East side of Stalin Park, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Also known as the Harbin Century-Old Middle East Railway Bridge, the Binzhou Railway Bridge was built in 1900 as the first railway bridge over the Songhua River. Today, it has been transformed into a pedestrian glass-bottom walkway, preserving its steel truss structure rich in vintage industrial beauty. Walking on the bridge, visitors can look down through transparent glass sections at the rushing river below or the vast frozen ice sheet in winter. It is not only a prime vantage point for photography enthusiasts capturing golden hour sunsets and river views, but also a trendy viral landmark popular among young travelers.", "name": "Songhua River Harbin Railway Bridge", "transport": "Walk east from the Flood Control Monument through Stalin Park for about 10 minutes to reach the bridgehead."}, {"address": "No. 89 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Built in 1906, the Modern Hotel is the most famous French Art Nouveau architectural landmark on Central Street, having once been a premier luxury hotel in the Far East. Its elegant green roof and exquisite floral ironwork exude strong French romance. A visit here demands queuing at the arched window by the entrance for a traditional handmade \u0027Madier Popsicle\u0027. Even in freezing minus twenty-degree winter temperatures, biting into a rich, creamy popsicle while posing with this century-old historic building is a quintessential, ritualistic Harbin photo experience.", "name": "Modern Hotel", "transport": "Take Metro Line 2 to \u0027Central Street Station\u0027, then walk north along Central Street for about 300 meters."}, {"address": "No. 3 Stalin Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Established in 1953, Stalin Park is a belt-shaped, Russian-style riverside park stretching along the banks of the Songhua River, seamlessly connected to Central Street and the Flood Control Monument. Lush with lush vegetation, the park features classical Russian sculptures, flower beds, and open-air benches, evoking a distinct Moscow vibe. In summer, it\u0027s a cool retreat for locals taking leisurely strolls along the river; in winter, it transforms into a natural snow-and-ice paradise offering ice spinning tops, ice slides, and horse-drawn sleds\u2014packed with northern winter fun and humanistic photography charm.", "name": "Stalin Park", "transport": "Take Metro Line 2 to \u0027Central Street Station\u0027, and walk to the Flood Control Monument at the end of Central Street; the park stretches along both sides."}, {"address": "No. 115 Central Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | The Central Street 1906 Post Office is a trending photo spot blending a century of postal history with modern creative art style. The building itself retains a vintage European exterior, while the interior offers unique snow-and-ice postcards, wooden postcards, Harbin-exclusive postmarks, and creative souvenirs. Visitors can pick postcards featuring Harbin snowscapes or Saint Sophia Cathedral, stamp them with exclusive commemorative seals to mail to loved ones, or pose in front of the classic British-style green mailbox to capture artistic travel memories.", "name": "Central Street 1906 Post Office", "transport": "Take Metro Line 2 to \u0027Central Street Station\u0027, then walk along Central Street for about 400 meters."}, {"address": "No. 88 Toulong Street, Daoli District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Situated surrounding the Saint Sophia Cathedral, Sophia Square is one of the most romantic public spaces in the city. Featuring a massive musical fountain, the nighttime water jets dance to symphonic music accompanied by light shows, creating a magnificent harmony with the illuminated cathedral. Flocks of peace doves fly around the square, and intricately carved ice and snow sculptures are added in winter. It attracts countless couples taking wedding photos and serves as an exceptional photo spot for capturing full cathedral panoramas, night lights, and the romantic musical vibe of Harbin in winter.", "name": "Saint Sophia Square Musical Fountain", "transport": "Take Metro Line 2 to \u0027Shangzhi Thoroughfare Station\u0027 Exit 1, then walk for about 5 minutes to reach the square."}], "name": "Popular Photo Spots"}}, "name": "Central Street and St. Sophia Square"}, "laodaowai": {"categories": {"cat_1": {"items": [{"address": "Area between Jingyu Street and South 1st Street to South 14th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | The Chinese Baroque Historic Street Block is the most iconic historical and cultural district in Harbin\u0027s Daowai District, world-renowned for its unique architectural style featuring a \u0027Baroque exterior with a Chinese courtyard interior.\u0027 It preserves a vast collection of mixed-use commercial and residential buildings constructed during the early 20th-century \u0027Chuang Guandong\u0027 migration era. The facades showcase ornate Western Baroque carvings, graceful arches, and Corinthian columns, yet the decorative motifs incorporate traditional Chinese auspicious symbols like bats (blessings), gourds (prosperity), peaches (longevity), and pomegranates (fertility). Inside, you\u0027ll find classic Northeastern siheyuan (courtyards) or vaulted arcade layouts. This seamless blend of Western exterior and Chinese essence reflects the wisdom and aesthetics of early Chinese entrepreneurs\u2014a historical treasure you cannot miss in Harbin.", "name": "Chinese Baroque Historic Street Block", "transport": "Take Harbin Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, Exit 1 or 2, and walk for about 2 minutes."}, {"address": "No. 28 Qingzhen 1st Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Built in 1897, Harbin Grand Mosque is one of the largest and most prominent Arabic Islamic-style mosques in Northeast China, serving as a key witness to the history of Old Daowai. The architecture brilliantly combines Islamic domed aesthetics with traditional Chinese structural design. The grand sanctuary features a unique blending of traditional Chinese double-eaved hip-and-gable roofs with Arabic domes. Surrounded by lush greenery and a tranquil atmosphere, the elegant prayer hall and towering minaret reflect Harbin\u0027s rich history of multicultural integration, making it a crucial landmark for studying local Islamic culture and modern architectural history.", "name": "Harbin Grand Mosque", "transport": "Take Harbin Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, then walk about 800 meters (approx. 10 minutes)."}, {"address": "Junction of North 3rd Street and North 4th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Chunyang Taoist Temple is an extraordinarily rare and well-preserved Taoist sanctuary in urban Harbin. Built during the Republic of China era, it serves as an important site for the Quanzhen Longmen sect of Taoism. Its architectural design is truly unique, seamlessly blending traditional Northern Chinese courtyard styles with Western Baroque exterior carvings to create a one-of-a-kind \u0027Baroque Taoist Temple.\u0027 Dedicated to Patriarch L\u00fc Dongbin, the main hall features upturned eaves and exquisite brick and stone carvings. Standing quietly amid the bustling Baroque district, it draws many visitors passionate about religious heritage and historic architecture.", "name": "Chunyang Taoist Temple (Old Daowai)", "transport": "Take Bus 1, 28, or 107 to \u0027Jingyu Street\u0027 Stop, and walk about 300 meters."}, {"address": "No. 31 South 2nd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Dehou Li Courtyard is one of the most iconic mixed-use courtyard compounds in the Chinese Baroque district, holding great historical significance in Harbin\u0027s modern commercial development. The street-facing facade boasts elegant Baroque relief pediments and decorative columns. Once inside, you\u0027re greeted by a 2-to-3-story wooden atrium courtyard. This signature layout\u2014shops in front and factories/residences in the back or above\u2014perfectly recreates the life and business operations of early 20th-century immigrants. Walking along the weathered wooden corridors feels like stepping back in time to experience the vibrant street life of old Harbin.", "name": "Dehou Li Courtyard", "transport": "Take Harbin Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk for about 5 minutes."}, {"address": "Intersection of Jingyu Street and North 3rd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Built in the 1920s, the former site of Hengsheng Gold Shop is a renowned commercial landmark on Jingyu Street in Old Daowai. It was once a bustling center for gold and silver jewelry processing and trading. The three-story building features an exquisitely crafted facade combining rich Baroque reliefs with Classical columns, featuring intricate auspicious motifs on its pediment that remain clearly visible today. The structure stands as a tangible testament to Old Daowai\u0027s glorious history as a financial hub and the growth of local national commerce.", "name": "Former Site of Hengsheng Gold Shop", "transport": "Take Harbin Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, exit and walk along Jingyu Street for about 400 meters."}, {"address": "No. 160 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Originally named \u0027Ping\u0027an Cinema,\u0027 the former Songguang Cinema was built in the 1920s and is one of Harbin\u0027s earliest motion picture theaters, holding cherished entertainment memories for generations of locals. The building features an exquisite Chinese Baroque exterior crowned with a magnificent pediment wall and clean moldings, while its interior retains a classic theater layout. Though no longer showing films, it has been repurposed into a cultural exhibition and creative commercial space, continuing to exude the unique charm of Harbin\u0027s port city heritage.", "name": "Former Site of Songguang Cinema", "transport": "Take Bus 107, 108, or 206 to \u0027Jingyu 7th Street\u0027 Stop, and walk about 150 meters."}, {"address": "North 1st Street (near Jingyu Street), Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | The North 1st Street Historic Architecture Group is one of the most authentic and lively historical zones in the Chinese Baroque conservation area. It gathers numerous modern shops and residences built by wealthy early immigrants, featuring relief carvings, double-column arches, interconnected interior corridors, and steep wooden stairs. Unlike heavily commercialized blocks, North 1st Street preserves the original neighborhood texture and everyday life of old Harbin, making it an ideal spot for architectural photographers and culture seekers looking to capture genuine local memories.", "name": "North 1st Street Historic Architecture Group (Old Daowai)", "transport": "Take Bus 26, 64, or 94 to \u0027Daowai 3rd Street\u0027 Stop, and walk about 3 minutes."}, {"address": "Intersection of Jingyu Street and South 4th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Built in 1928, the former site of Jiaotong Hotel was once a famous inn and trade distribution hub in Old Daowai. This multi-story building combines Neoclassical flair with Chinese Baroque elegance. Its most striking features are the rounded corner pediment, exquisitely textured stucco walls, and a multi-level open-air atrium corridor inside. Having hosted countless merchants traveling via the Songhua River docks and the Chinese Eastern Railway, it stands as a prime witness to Old Daowai\u0027s history as a vibrant trade hub in Northeast Asia.", "name": "Former Site of Jiaotong Hotel", "transport": "Take Harbin Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk along Jingyu Street for about 6 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 284 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Located in the core block of Old Daowai, this exhibition hall vividly brings to life the glorious history of the early 20th-century \u0027Chuang Guandong\u0027 migration wave into Harbin and the national entrepreneurs who built iconic East-meets-West architecture here through a vast collection of precious historical photos, vintage artifacts, and scale models. The hall offers an in-depth look at the unique architectural design of \u0027Baroque facade, courtyard layout within,\u0027 making it the premier destination for an immersive exploration of Harbin\u0027s old town cultural heritage and local folk evolution.", "name": "Harbin Chinese Baroque History \u0026 Culture Exhibition Hall", "transport": "Take Metro Line 3 to Chinese Baroque Block Station (Exit 1), and walk for about 3 minutes."}, {"address": "No. 115 South 14th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Originally built in 1897, Daowai Mosque is the largest Arabic Islamic-style architectural complex in Northeast China. Its main hall seamlessly blends traditional Chinese palace architecture with Arabic Islamic domes, resulting in a magnificent and exquisite design. The mosque houses numerous steles and religious texts dating back to the Qing Dynasty, showcasing the unique charm of Harbin\u0027s multicultural and multi-religious harmony, holding immense historical and artistic value.", "name": "Harbin Daowai Mosque", "transport": "Take Bus 1, 28, or 106 to Qingzhensi (Mosque) Station, then walk about 200 meters."}, {"address": "Intersection of South 3rd Street and South 4th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Fujiadian is the former name of Daowai District. This memory museum is dedicated to recording the life of the local Han community during Harbin\u0027s opening as a treaty port. The museum recreates scenes of time-honored shops, traditional teahouses, and folk artist performances, while meticulously documenting the heroic fight against the plague led by Dr. Wu Lien-teh in 1910. Rich in emotion, the exhibition takes visitors back in time to experience the resilience and everyday wisdom of old Daowai residents.", "name": "Fujiadian History Memory Museum", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk along Jingyu Street to South 3rd Street."}, {"address": "No. 45 Toudao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Dedicated to showcasing Heilongjiang\u0027s traditional folk culture and craft arts, this museum houses an extensive collection of Heilongjiang paper-cuts, clay sculptures, shadow puppets, and traditional Northeastern ice-and-snow woodcarvings. Master artisans often perform craft demonstrations on-site, allowing visitors to not only appreciate intricate folk creations but also get hands-on experience with traditional rubbings or operating shadow puppets, making it a highly interactive and artistic cultural hub.", "name": "Laodaowai Folk Art Museum", "transport": "Take Bus 26, 64, or 94 to Jingyu Street Station, then walk about 150 meters."}, {"address": "No. 41 South 2nd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Housed in a beautifully preserved century-old Baroque residence, this museum features a fa\u00e7ade adorned with exquisite traditional Chinese carvings of bats, pomegranates, and peonies\u2014all symbolizing good fortune. Inside, perspective drawings, real architectural components, and multimedia projections deeply unpack the craft secrets and aesthetic nuances of Chinese Baroque architecture, enabling architecture enthusiasts to appreciate the marvelous fusion of Eastern and Western design languages.", "name": "Chinese Baroque Architecture Art Museum", "transport": "Take Metro Line 3 to Chinese Baroque Block Station, then walk about 5 minutes to South 2nd Street."}, {"address": "Junction of South 4th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Gathering intangible cultural heritage items from across Heilongjiang Province, this hall features Hezhen fish skin garment crafting techniques, Manchu embroidery, historical props from Northeastern Errenzhuan folk song-and-dance shows, and traditional Chinese medicine processing techniques. Designed with an artistic aesthetic, the exhibition space effortlessly combines ancient handicrafts with modern lighting displays, offering a fantastic setting to explore the multi-ethnic cultural heritage and craft aesthetics of Northeast China.", "name": "Longjiang Intangible Cultural Heritage Exhibition Hall", "transport": "Take Bus 19 or 79 to Daowai Sandao Street Station, then walk about 300 meters."}, {"address": "No. 156 Dongzhi Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Built in the early 20th century, this historically significant religious landmark in Daowai District fuses Gothic spires with local Northeastern architectural elements. The vibrant stained glass windows dazzle under the sunlight, creating a solemn and serene atmosphere. It serves not only as an active worship center for local believers but also as a key artistic landmark for visitors seeking to experience Harbin\u0027s diverse religious architectural styles.", "name": "Daowai Christian Church", "transport": "Take Metro Line 1 to Jiaotong Xueyuan Station (Exit 2), then walk about 600 meters."}, {"address": "Intersection of Jingyu Street and South 5th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Daowai District was once one of the most prosperous centers for early film screening and theater culture in Harbin. This museum houses film projectors from the early 20th century, rare film reels, classic movie posters, and vintage theater seating. Documentaries about Harbin and excerpts from vintage movies are screened year-round, with retro lighting and black-and-white imagery weaving a rich nostalgic artistic atmosphere\u2014making it a perfect spot for photos and taking a trip down memory lane.", "name": "Centennial Daowai Cinema Culture Museum", "transport": "Take Metro Line 3 to Chinese Baroque Block Station (Exit 2), and walk for about 400 meters."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Jiangpan Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Located along the Songhua River just north of the Chinese Baroque Historic District, this lush riverside park is a prime spot to experience Harbin\u0027s natural riverfront scenery and local leisure life. The park features shade-providing trees, spacious walking paths, and scenic viewing platforms. In summer, refreshing river breezes offer a cool escape, while winter brings majestic views of the frozen Songhua River and beautiful ice sculptures, seamlessly blending natural river vistas with the city\u0027s historical character.", "name": "Daowai Jiangpan Park", "transport": "Walk north from the Chinese Baroque Historic District for about 10 minutes; or take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk toward the riverfront."}, {"address": "No. 107 Dayoufang Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | A famous classical city park in Daowai District, home to a centennial ancient pear tree. Between spring and summer, the pear blossoms bloom in full force like fallen snow, drawing countless visitors to admire the flowers and take photos. With dense greenery, charming pavilions, stone bridges, and serene ponds, it is one of Old Daowai\u0027s most iconic spots for classical nature and ecological beauty.", "name": "Guli Park (Old Pear Tree Park)", "transport": "Take Bus 205 or 206 and get off at \u0027Guli Park Station\u0027; or take a 10-minute taxi ride from the Chinese Baroque Historic District."}, {"address": "No. 14 Yangjingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A commemorative city park built to honor the Anti-Japanese war hero Yang Jingyu, blending natural ecological landscapes with rich cultural history. The park features lush trees, vast lawns, a scenic lake, and heroic statues, offering distinct beauty across all four seasons. It serves as a beloved green space where Old Daowai locals exercise, stroll, and connect with nature amidst a lively yet peaceful atmosphere.", "name": "Jingyu Park", "transport": "Walk east along Jingyu Street from the Chinese Baroque Historic District for about 15 minutes; or take Bus 19 or 76 to \u0027Jingyu Park Station\u0027."}, {"address": "Junction of Jiangpan Road and Binzhou Railway Bridge, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | A linear park surrounding the century-old railway bridge over the Songhua River, connecting Daoli and Daowai districts. The green trails on the Daowai side offer close-up views of the grand steel truss bridge architecture and vast river scenery. At sunset, the golden light shimmering across the river creates a poetic and historic atmosphere, making it a fantastic outdoor sanctuary blending industrial heritage with natural riverfront views.", "name": "Binzhou Railway Bridge Park (Daowai Section)", "transport": "Walk west along the river from Daowai Jiangpan Park for about 12 minutes to reach the green space under the railway bridge."}, {"address": "Internal courtyards of the Chinese Baroque Historic District between Nanxun Street and Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Hidden inside the Chinese Baroque architecture complex\u2014famous for its \u0027Chinese facade, Western interior\u0027 layout\u2014these green courtyard spaces skillfully integrate local Northeastern flora like lilacs and flowering plums with century-old Baroque patio courtyards. Wandering through these interconnected spaces, visitors can admire the unique miniature garden design where intricate brick and wood carvings meet vibrant greenery.", "name": "Laodaowai Baroque Courtyard Gardens", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block Station\u0027 and walk into the inner courtyards of the historic district."}, {"address": "Riverside at Beiershidao Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Located on the north side of Old Daowai, this riverside green space and former pier heritage park was once the central hub for Harbin\u0027s water passenger and cargo transport. Renovated into an open riverfront park complete with waterfront decks, tree-lined walkways, and seating, it offers breathtaking evening views of Sun Island across the river as the setting sun sparkles on the water.", "name": "Daowai Songhua River Pier Park Area", "transport": "Walk about 15 minutes from the Chinese Baroque Historic District; or take Bus 24 to \u0027Beiershidao Street Station\u0027 and walk toward the river."}, {"address": "Near the junction of Nanji Street and Dongzhi Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | A linear urban eco-park transformed from an old railway site, lined with tall trees and lilacs, Harbin\u0027s city flower. Strolling along the greenway allows visitors to experience the historic charm of old Harbin\u0027s railway heritage while enjoying a shaded natural environment. It is a peaceful, refreshing spot for a summer walk with unique local character.", "name": "Daowai Chinese Eastern Railway Greenway Park", "transport": "Take Metro Line 3 to \u0027Beiwudao Street Station\u0027 or \u0027Chinese Baroque Block Station\u0027, then take a taxi for about 5 minutes."}, {"address": "Zhiqing Square, Jiangpan Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | An open riverside park square on the south bank of the Songhua River in Daowai, featuring sculptures themed after \u0027Educated Youth\u0027 (Zhiqing) culture alongside expansive green lawns. Surrounded by riverfront cycling paths and scenic relaxation areas, it boasts lush grass and cool river breezes in summer, making it a popular landmark for enjoying open natural views and experiencing local Northeastern culture.", "name": "Zhiqing Square Riverside Park", "transport": "From the Chinese Baroque Historic District, walk north along Beishiqidao Street for about 12 minutes to reach Zhiqing Square by the river."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Intersection of Jingyu Street and South 3rd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | The Chinese Baroque Historic Block is a crown jewel of Harbin\u0027s modern architectural heritage, seamlessly blending opulent Western Baroque exteriors with the layout of traditional Chinese courtyard homes (siheyuan). It houses a wealth of well-preserved historic shops and intricately carved facades. Stone pediments adorned with Chinese auspicious motifs\u2014such as bats, pomegranates, and peonies\u2014make it the top photo destination for photography lovers and travelers wishing to experience old Harbin\u0027s unique fusion of Eastern and Western charm.", "name": "Chinese Baroque Historic Block", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station (Exit 1), and walk for about 2 minutes."}, {"address": "Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Named in honor of General Yang Jingyu, an anti-Japanese national hero, Jingyu Street serves as the central spine of Old Daowai. Streetfront facades are richly decorated with Baroque pediments, majestic columns, and relief sculptures, exuding a classic, cinematic retro vibe. Strolling here allows you to admire exquisite brick carvings and wrought-iron balconies that capture the unique urban textures and historical character of Harbin.", "name": "Jingyu Street Historic Buildings", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk for about 3 minutes to reach Jingyu Street."}, {"address": "Near the intersection of South 4th Street and Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Dehou Li is one of the most iconic traditional courtyards in the Chinese Baroque Historic Block, showcasing a classic \u0027shop in front, workshop behind; Western outside, Chinese inside\u0027 spatial layout. Pass through the archway of its grand Western Baroque facade to discover a serene Chinese courtyard complete with wooden balconies and an open skylight. It is an extraordinary backdrop for capturing photos that bridge past and present with a captivating sense of time travel.", "name": "Dehou Li Baroque Courtyard", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk along Jingyu Street to South 4th Street."}, {"address": "South 3rd Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | South 3rd Street is a vibrant microcosm of daily life in Old Daowai, featuring the highest concentration of century-old eateries and creative indie shops. Adorned with red lanterns and vintage signs, the street lights up at night with a wonderfully atmospheric glow. As you wander through, you can savor legendary local specialties like Guobao Meat and Zhangbaopu steamed buns while snapping charming street scenes brimming with local warmth and vitality.", "name": "South 3rd Street Cultural Alley", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, exit and walk directly into South 3rd Street."}, {"address": "No. 28 Qingzhen 1st Road, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Built in 1897, the Harbin Daowai Mosque is one of the largest Islamic architectural complexes in Northeast China, beautifully harmonizing Islamic aesthetics with traditional Chinese palace architecture. Its imposing green dome and minarets stand out strikingly against Old Daowai\u0027s cityscape, while the magnificent prayer hall and peaceful courtyards create a distinct cultural sanctuary\u2014making it a highly rated cultural stop in Daowai.", "name": "Harbin Daowai Mosque", "transport": "Take Bus 1, 28, or 64 to \u0027Qingzhensi (Mosque) Station\u0027, and walk about 200 meters."}, {"address": "Intersection of Jingyu Street and South 4th Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Dating back to the early 20th century, the former site of Chunhua Hospital is a century-old structure that blends Neoclassical and Baroque decorative details. Elegant arches, intricate column capital carvings, and classic yellow-and-grey walls give it a grounded sense of history. Beautifully preserved, it continuously attracts photography enthusiasts eager to capture the interplay of light and shadow across its vintage facade.", "name": "Former Site of Chunhua Hospital", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk about 400 meters along Jingyu Street."}, {"address": "No. 156 Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Originally known as the Shuishiying Cinema, the former Songguang Cinema is one of the oldest and most atmospheric movie houses in Old Daowai. Its grand Baroque pediment and large arched windows create a powerful visual impact, holding moviegoing memories across generations of local Harbin residents. While its bustling past has faded into quiet charm, its ornate architectural lines remain a favorite backdrop for retro old-world photography.", "name": "Former Site of Songguang Cinema", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk for about 5 minutes."}, {"address": "Intersection of Nantou Street and Jingyu Street, Daowai District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | The Baroque Art Theater Courtyard breathes new life into a historic courtyard house, transforming it into a vibrant space for traditional opera and contemporary cultural performances. Featuring two-story wooden balconies with delicately carved railings, it presents a fascinating collision of Northeastern folklore and Baroque architectural design. Visitors frequently gather here to enjoy Errenzhuan (traditional song-and-dance duets) or comic crosstalk performances, making it a popular hotspot for authentic local-style portraits.", "name": "Baroque Art Theater Courtyard", "transport": "Take Metro Line 3 to \u0027Chinese Baroque Block\u0027 Station, and walk for about 6 minutes."}], "name": "Popular Photo-worthy Spots"}}, "name": "Old Daowai Chinese Baroque Historic District"}, "nangang_gogol": {"categories": {"cat_1": {"items": [{"address": "No. 269 Shike Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Built in 1912, St. Alexeyev Church is a classic Russian Orthodox church featuring a brick-and-wood structure with vibrant red brick exterior walls, iconic onion domes, and tent roofs. Originally a Russian military field church, it was later relocated to its current site at the intersection of Gogol Street and Shike Street. Its architectural style combines Byzantine influences with traditional Russian timber framing. The exquisite interior murals and lively surrounding plaza make it a favorite spot for locals to relax and take photos, showcasing Harbin\u0027s rich exotic charm.", "name": "St. Alexeyev Church", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 or take Bus 8 or 18 to \u0027Gexin Street Station\u0027, then walk to reach the destination."}, {"address": "No. 319 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Constructed in 1904 by Russian merchant Ivan Yakovlevich Churin, this building is a masterpiece of Art Nouveau architecture in modern Harbin. It boasts smooth flowing lines, delicate floral reliefs, and an elegant, soft color scheme. As one of the oldest department stores in Northeast China, it is also famous for originating Churin\u0027s iconic Lieba (Russian rye bread) and red sausages. Stepping inside offers a deep sense of historical heritage and century-old commercial glory.", "name": "Former Site of Churin \u0026 Co. Building", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027, take Exit 3, and walk about 200 meters."}, {"address": "No. 50 Hongjun Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Originally built in 1904 as the Moscow Market, the Heilongjiang Provincial Museum sits at the heart of Hongbo Square in Nangang District. This striking yellow classical building harmoniously blends Baroque and Art Nouveau styles. The museum houses rich collections of paleontology fossils (including mammoth and woolly rhino skeletons), Jin Dynasty historical relics, and cultural artifacts from ethnic minorities along the Heilongjiang River basin. With its grand dome and elegant facade decorations, it is one of the most brilliant historical landmarks in the Nangang commercial district.", "name": "Heilongjiang Provincial Museum", "transport": "Take Metro Line 1 or Line 2 directly to \u0027Museum Station\u0027."}, {"address": "No. 268 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Also known as the Ukrainian Church, Pokrovsky Church was built in 1930 and designed by Russian architect Zhdanov. Featuring a Byzantine Revival style, it stands prominently in the famed \u0027Three-Religion Street\u0027 area on Dong Dazhi Street. The church boasts a massive central dome, graceful Gothic-inspired soaring vertical lines, and a harmonious exterior built with red brick accented by yellow and white trim. Witnessing the multi-ethnic cultural integration in early 20th-century Harbin, it is now a major historical site protected at the provincial level.", "name": "Harbin Pokrovsky Church", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 (Exit 1), and walk east along Dong Dazhi Street for about 5 minutes."}, {"address": "No. 252 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Located at the corner of Dong Dazhi Street and Jilin Street, this church was built in 1914 for German expatriates as a Lutheran Evangelical church. The architecture displays a unique fusion of Gothic Revival and Nordic country styles, featuring yellow walls accented with dark facing tiles and a soaring, sharp bell tower with clean, uplifting lines. Standing side-by-side with neighboring Orthodox and Protestant churches, it forms a globally rare spectacle of three different Christian denominations coexisting on the same street.", "name": "Harbin German Lutheran Church", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027 and walk about 300 meters."}, {"address": "No. 226 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Built in 1925 and originally named the Baptist Church affiliated with St. Nicholas Cathedral, this is another classic religious landmark in Dong Dazhi Street\u0027s historic district. The building combines Gothic elements with Russian architectural accents, showcasing delicate pointed window frames and soft yellow exterior walls. Warm worship services are held here every weekend, where soaring vaulted ceilings and stained glass cast a solemn, majestic glow in the sunlight, bringing a peaceful historical tranquility to the bustling Nangang commercial district.", "name": "Harbin Nangang Christian Church", "transport": "Take Metro Line 1 to \u0027First Affiliated Hospital of Harbin Medical University Station\u0027, then walk east along Dong Dazhi Street for about 400 meters."}, {"address": "No. 1 Tielu Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | First established in 1899, the current main station building recreates the iconic 1903 original Art Nouveau style of the old Harbin Station. Featuring an elegant green-and-white color palette and soft, flowing curves, it recreates the grand splendor of the Chinese Eastern Railway hub. Exquisite arches, reliefs, and vintage lights inside and outside the station faithfully recreate the historic atmosphere of the \u0027Orient\u0027s Little Paris\u0027, making it a grand historical landmark in Nangang District.", "name": "Harbin Railway Station Main Building", "transport": "Take Metro Line 2 directly to \u0027Harbin Railway Station\u0027, or take various bus routes to their terminus at the station."}, {"address": "No. 22 Yaojing Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Built in 1907, this exquisite building served as the consulate general for Tsarist Russia and later the Soviet Union in Harbin. Its facade showcases classic Neoclassical Revival and Eclectic architectural styles, featuring a grand portico, elaborate pilaster reliefs, and elegant arched windows. Nestled in the historic and cultural district around the museum and Hongbo Square in Nangang, it stands as a testament to modern Harbin\u0027s multilateral diplomatic past as a global metropolis, making it a key site for exploring Harbin\u0027s Western-style heritage architecture.", "name": "Former Site of the Soviet Consulate in Harbin", "transport": "Take Metro Line 1 to \u0027Museum Station\u0027 and walk for about 8 minutes after exiting."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 237 Gexin Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Located at Gexin Street Square in Nangang District, the Church of St. Alexeyev is a former Eastern Orthodox church showcasing a rich Russian Baroque style combined with Byzantine architectural elements. Built in 1912, its red brick walls paired with unique onion domes and a towering bell tower create vivid colors and graceful lines. Although currently used as a Catholic church, its interior preserves exquisite frescoes and iconostases. The surrounding square is an ideal spot for Harbin locals to experience authentic Russian charm and enjoy a leisurely afternoon.", "name": "Church of St. Alexeyev", "transport": "Take Metro Line 2 to \u0027Gongren Wenhua Gong\u0027 (Workers\u0027 Cultural Palace) Station and walk for about 8 minutes."}, {"address": "No. 50 Hongjun Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Situated at the core of Hongbo Square in Nangang District, the museum building itself is a historically protected Art Nouveau eclectic structure built in 1904, originally serving as the Moscow Market. The museum houses a vast collection of precious geological, biological, and historical artifacts from the ancient Jin Dynasty of Heilongjiang, including national treasures like the famous Jin Dynasty Brass Seated Dragon. It stands as a premier artistic and historical sanctuary for deeply understanding the culture and multi-ethnic history of the Northeast borderlands.", "name": "Heilongjiang Provincial Museum", "transport": "Take Metro Line 1 or Line 2 to \u0027Museum\u0027 Station and exit directly to the museum."}, {"address": "No. 211 East Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Commonly known as the East Dazhi Street Polish Catholic Church, the Cathedral of the Sacred Heart of Jesus stands among the group of three churches on East Dazhi Street in Nangang District. Originally built in 1906, this Gothic Revival architecture features a sky-scraping spire and elegant pointed archways, with an exterior finished in soft pastel yellow and white tones. The interior atmosphere is grand and solemn, where vivid stained-glass windows cast dazzling light and shadows under the sun, making it an unmissable religious art landmark in Nangang District.", "name": "Cathedral of the Sacred Heart of Jesus", "transport": "Take Metro Line 1 to \u0027Yida Yiyuan\u0027 (First Affiliated Hospital of Harbin Medical University) Station and walk for about 3 minutes."}, {"address": "No. 268 East Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Also known as the Ukrainian Church, the Church of the Intercession of the Mother of God is located in the famous religious architecture cluster on East Dazhi Street. Designed by the renowned Russian architect Zhdanov, the church adopts an ancient Russian Byzantine style featuring a magnificent dome and a rigorous structure. Its green dome paired with yellow walls delivers an elegant and classic visual impact. Although the interior is not fully open to the public currently, its majestic architectural form still attracts countless photography and architecture enthusiasts.", "name": "Church of the Intercession of the Mother of God", "transport": "Take Metro Line 1 to \u0027Yida Yiyuan\u0027 Station or \u0027Tieluju\u0027 (Railway Bureau) Station, and walk for about 5 minutes."}, {"address": "No. 252 East Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Along with the Church of the Intercession and the Cathedral of the Sacred Heart of Jesus, this church is known as one of the \u0027Three Churches on Dazhi Street\u0027. Built in 1916 in the German Gothic style, it once served as a place of worship for German expatriates in Harbin. Its clean lines, red brickwork, and steep gable roofs intertwine to create a unique Nordic religious atmosphere. The prayer hall and pipe organ facilities inside are remarkably well-preserved, showcasing high religious and artistic value.", "name": "Harbin Nangang Christian Church", "transport": "Take Metro Line 1 to \u0027Yida Yiyuan\u0027 Station and walk for about 4 minutes."}, {"address": "No. 25 Wenmiao Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Originally built in 1926, the Harbin Confucian Temple is the largest and most complete Qing Dynasty official-style architectural complex in Heilongjiang Province, often hailed as the \u0027Forbidden City of Harbin\u0027. The temple features top-tier architectural specifications with yellow glazed tile roofs and grand hip-and-gable roofs, presenting a majestic grandness of classical Oriental architectural aesthetics. Inside, it houses the Harbin Folk Customs Museum displaying rich Manchu culture and folk art. Strolling through the courtyard shaded by ancient cypresses offers a deep immersion in Confucian cultural heritage and artistic charm.", "name": "Harbin Confucian Temple", "transport": "Take Metro Line 1 to \u0027Gongcheng Daxue\u0027 (Harbin Engineering University) Station Exit 3, and walk for about 8 minutes."}, {"address": "No. 1 Yiyuan Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Located at No. 1 Yiyuan Street in Nangang District, this museum was originally the private mansion of rich Harbin merchant Kowalski. Built in 1919, it is an opulent French Art Nouveau mansion. The building boasts elegant and dynamic exterior forms and magnificent interior decorations, featuring intricate wood carvings, stained glass, and white marble stair handrails. It is not only a venue showcasing revolutionary historical relics, but also an extraordinary museum of modern European architectural art.", "name": "No. 1 Yiyuan Street - Museum of Revolutionary Leaders Inspecting Heilongjiang", "transport": "Take Metro Line 1 or Line 2 to \u0027Museum\u0027 Station and walk for about 6 minutes."}, {"address": "Inside the campus of Harbin Engineering University, No. 145 Nantong Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Situated on the original campus of the PLA Institute of Military Engineering (Harbin Military Engineering Institute), the museum\u0027s architecture combines the grand scale of Soviet-style buildings with traditional Chinese flying eaves, exuding a majestic aura. The museum displays a vast collection of precious graphics, artifacts, and models detailing the development of modern Chinese defense technology, military engineering history, and university history. It presents a unique cultural and artistic ambiance where technology meets history, making it an in-depth cultural exhibition hall in the Nangang educational district.", "name": "Harbin Military Engineering Museum", "transport": "Take Metro Line 1 to \u0027Gongcheng Daxue\u0027 (Harbin Engineering University) Station for direct access to the campus."}], "name": "Arts Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 295 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Located in the heart of Nangang District and directly connected to Gogol Street, Harbin Children\u0027s Park is a historic and unique large urban park. Built in 1925 and originally known as the \u0027Railway Garden,\u0027 its most famous attraction is China\u0027s first children\u0027s railway along with the \u0027Juvenile\u0027 mini train, which holds fond childhood memories for generations of Harbin residents. Built along the Majiagou River, the park is filled with lush trees and vibrant flowers, offering distinct beauty in every season. In summer, ride the mini train through a sea of green to admire blooming flowers and exquisite sculptures; in winter, it transforms into a playful snow and ice wonderland. It is not only a top choice for family outings but also a wonderful oasis to experience the relaxed lifestyle of old Harbin.", "name": "Harbin Children\u0027s Park", "transport": "Take Harbin Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station or Railway Bureau Station, then walk about 8 minutes; or take bus 7, 8, 18, or 63 to Children\u0027s Park Station."}, {"address": "Majiagou River Banks (near Gogol Street section), Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Majiagou River Park is a waterfront green corridor running through Nangang District. Stretching along both banks of the Majiagou River and intersecting with Gogol Street, it serves as a vibrant natural landscape belt near the Nangang commercial area. Following years of revitalization and greening, it has evolved into an open linear park featuring waterfront greenways, scenic bridges, leisure plazas, and flower gardens. In spring and summer, shaded by weeping willows, colorful wildflowers and decorative plants bloom, attracting locals for walks, morning exercises, and sightseeing. Autumn turns the trees into poetic golden hues, while winter brings fun ice and snow activities on the frozen river. Strolling across miniature European-style bridges over the river perfectly showcases the unique waterfront charm of Harbin, the Ice City and Summer Capital.", "name": "Majiagou River Park", "transport": "Walkable from Gogol Street Commercial Area; or take Metro Line 1 to Museum Station and transfer to Bus 7 or 8 to stops near Majiagou."}, {"address": "No. 1 Gongcheng Street (near Dongdazhi Street and Jile Temple), Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Located near Jile Temple and Harbin Engineering University in Nangang District, Harbin Culture Park (formerly Harbin Amusement Park) is an iconic large comprehensive park in Northeast China. It spans vast green forests and natural lakes, seamlessly blending European-style landscape gardens with modern amusement facilities. Towering trees and lush greenery frame the park, where ancient pines and cypress complement elegant architecture. Its famous giant Ferris wheel was once a prominent city landmark, offering panoramic views of Nangang\u0027s vibrant cityscape interwoven with lush trees from above. With serene lakeside paths, it serves as a fantastic urban oasis combining joyful entertainment with natural tranquility right next to bustling commercial districts.", "name": "Harbin Culture Park", "transport": "Take Harbin Metro Line 1 to Harbin Engineering University Station, Exit 3, and walk about 5 minutes."}, {"address": "No. 225 Haping Road, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Situated on Haping Road in Nangang District, Heilongjiang Forest Botanical Garden is China\u0027s only cold-temperate national forest park located inside a provincial capital\u0027s urban area, spanning an impressive 136 hectares. Rich in plant species, it features specialized gardens dedicated to tulips, lilacs, peonies, medicinal plants, and more. Every spring, Harbin\u0027s city flower, the lilac, blooms en masse, filling the air with rich fragrance. Summer offers a cool, dense forest canopy known as a natural oxygen bar and urban green lung. Autumn brings vibrant red maples and golden larches, creating a vivid multi-colored canvas. With long wooden boardwalks, crystal-clear lakes, and quiet pine forests, it stands as the most impressive natural eco-landmark in Nangang District.", "name": "Heilongjiang Forest Botanical Garden", "transport": "Take bus 28, 51, 67, 69, 81, or 121 directly to Botanical Garden (Zhiwuyuan) Station."}, {"address": "Intersection of Hanjiang Road and Xiangjiang Road, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Located near the Convention and Exhibition Center commercial area in Nangang District, Xiangjiang Park is an open urban park featuring modern landscape design and high green coverage. It is highlighted by sprawling lawns, a central artificial lake, and multi-functional leisure plazas, with rich layers of flora adapted to cold-temperate climates. The park offers high-quality loop running tracks, waterfront platforms, and kids\u0027 playgrounds in an elegant, neat environment. Whether it\u0027s locals doing morning workouts or evening visitors strolling to catch the sunset, all can enjoy a tranquil escape from the urban hustle. At nightfall, surrounding park lights reflect beautifully on the water, highlighting the modern, relaxing vibe of Nangang District.", "name": "Xiangjiang Park", "transport": "Take Metro Line 3 to Convention and Exhibition Center Station and walk about 10 minutes; or take bus 51, 74, or 203 to Xiangjiang Park Station."}, {"address": "Intersection of Qingbin Road and Xuefu 3rd Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Situated around Xuefu Road and Qingbin Road in Nangang District, Qingbin Park is a charming community park beloved by students, teachers, and residents nearby. Designed with elegant aesthetics, shaded by trees, and adorned with winding corridors, pavilions, and stone sculptures, it embodies a harmonious mix of culture and nature. The park is home to mature elms, pines, and seasonal flowers, providing cool shade during midsummer and making it a great retreat from the heat. Surrounded by numerous universities, the park offers a tranquil, scholarly vibe\u2014a peaceful green secret garden right next to the lively Nangang commercial area.", "name": "Qingbin Park", "transport": "Take Harbin Metro Line 1 to Xuefu Road Station or Heilongjiang University Station, then walk about 10 minutes."}, {"address": "No. 390 Xuefu Road, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | Located in the southwestern part of Nangang District, Window of Eurasia Park is a vast, scenic natural park featuring rich European flair. It is famous for combining miniature Eurasian landmark architecture with graceful forest terrain. The park boasts high forest coverage with expansive pine woods, birch groves, and rolling lawns. Strolling through, classic European castle structures, towers, and sculptures peek out from dense foliage, exuding an exotic romantic charm. Offering quiet surroundings and fresh air, it is a prime spot for summer camping, picnics, and photography, while winter transforms the snow-covered forest into a fairytale-like Nordic landscape.", "name": "Window of Eurasia Park", "transport": "Take bus 67, 68, 104, 114, or 343 to Window of Eurasia Park (Ou Ya Zhi Chuang Gong Yuan) Station."}, {"address": "Intersection of Jiankang Road and Daqing Fu Road, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Located near Jiankang Road in Nangang District, Daixiuhu Park is an urban waterfront eco-park centered around a natural lake. Built around the shimmering waters of Lake Daixiu, the park features long wooden boardwalks, platforms, and leisure pavilions along the shoreline. With lush greenery, weeping willows, seasonal flowers, and waterfowl gliding over the lake, it presents a harmonious water-country ecological scene. Equipped with sports fitness areas and kids\u0027 play facilities, it is a popular spot for Nangang residents to exercise, enjoy nature, watch birds, and spend family time, perfectly blending ecological beauty with public community life.", "name": "Daixiuhu Park", "transport": "Take Metro Line 1 to Hexing Road Station, transfer to bus 18, 59, or 69 to Jiankang Road Station, and walk about 5 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Built in 1901, Gogol Street is a century-old historic street steeped in rich Russian charm. Lined with historic Russian-style architecture featuring Renaissance, Baroque, and Eclectic designs, strolling here makes you feel as if you\u0027ve stepped into a classic European town. Whether admiring the exquisite architectural details by day or capturing the romantic streetscapes as the lights come on at night, walking along this exotic avenue is a must-do photography highlight when visiting Nangang District, Harbin.", "name": "Gogol Street", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station or Railway Bureau Station, then walk about 5 minutes from the exit."}, {"address": "No. 170 Gexin Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Built in 1912, St. Alekseyev Church is a Catholic church featuring classic Russian Baroque architecture. Known for its striking red brick walls and vibrant onion domes, the elegant exterior radiates a profound sense of romantic grandeur. The lively plaza in front is a popular hotspot for photography enthusiasts and wedding photoshoots\u2014every snapshot looks straight out of a magazine spread.", "name": "St. Alekseyev Church", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station (Exit 2), then walk about 10 minutes."}, {"address": "No. 164 Gogol Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Renowned as one of China\u0027s most beautiful European-style bookstores, Gogol Bookstore seamlessly blends classic Russian aesthetics with modern reading spaces. Decorated with elegant dark wood tones, intricate carved chandeliers, and classical murals, it creates an opulent atmosphere reminiscent of a 19th-century European aristocrat\u0027s private library. With comfortable reading nooks and a cozy caf\u00e9 area, it attracts countless book lovers and travelers to capture photos and savor its unique cultural charm.", "name": "Gogol Bookstore", "transport": "Take Metro Line 1 to Railway Bureau Station (Exit 2), then walk about 8 minutes."}, {"address": "No. 319 Dong Dazhi Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Founded in 1867, Churin Department Store\u0027s flagship in Nangang is a majestic, century-old heritage building. Featuring a green dome and cream-yellow exterior walls, this Russian-style landmark is famous for selling authentic Harbin red sausages, traditional Dalieba sourdough bread, and Russian preserves. Beyond shopping for iconic local souvenirs, tourists love posing in front of its elegant facade.", "name": "Churin Department Store", "transport": "Take Metro Line 1 to Museum Station (Exit 2), then walk about 3 minutes."}, {"address": "No. 50 Hongjun Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Located in the heart of Hongbo Square in Nangang District, the main building of the Heilongjiang Provincial Museum was built in 1904 as the former Moscow Market, showcasing a classic Eclectic architectural style. The museum houses rich exhibits on Northeast Chinese history, ancient fossils from the Heilongjiang River Basin, and Jin Dynasty relics. Its elegant yellow exterior paired with the spacious Hongbo Square makes it a premier photo spot for discovering Harbin\u0027s urban heritage.", "name": "Heilongjiang Provincial Museum", "transport": "Take Metro Line 1 or Line 2 to Museum Station (Exit 3); it is right outside the exit."}, {"address": "No. 25 Wenmiao Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Built between 1926 and 1929, the Harbin Confucian Temple is the largest and best-preserved Qing Dynasty-style architectural complex in Heilongjiang Province. Standing out from Harbin\u0027s predominant Russian architecture, it features classic imperial Chinese elements such as red wal
