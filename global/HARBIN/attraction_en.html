ls, yellow roof tiles, and upturned eaves set in a tranquil compound. Every autumn, golden ginkgo leaves contrast beautifully against the red walls, making it a wildly popular spot on social media for Hanfu traditional dress photoshoots.", "name": "Harbin Confucian Temple", "transport": "Take Metro Line 1 to Harbin Engineering University Station (Exit 3), then walk about 8 minutes."}, {"address": "No. 209 Changjiang Road, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Standing 336 meters tall, the Dragon Tower (Heilongjiang Radio and TV Tower) offers the ultimate high-altitude panoramic view of Harbin. Inside, visitors can enjoy a revolving sky restaurant, a skywalk glass bridge, and several interactive observation decks. At night, the tower lights up with vibrant neon colors, making it one of the brightest landmarks in Harbin\u0027s skyline\u2014perfect for nightscape photography and thrilling high-altitude check-ins.", "name": "Dragon Tower (Heilongjiang Radio and TV Tower)", "transport": "Take Bus 7, 24, 71, or 112 to Longta (Dragon Tower) Station."}, {"address": "Intersection of Gexin Street and Shike Street, Nangang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Centered around St. Alekseyev Church, Gexin Street Church Square is a vibrant neighborhood hub for local daily life. Surrounded by charming Russian architecture and creative shops, the area comes alive in the evening with bustling bird-and-flower markets and food stalls. Blending elegant European scenery with authentic local Harbin flavor, it\u0027s an incredible location for candid photography of everyday life.", "name": "Gexin Street Church Square", "transport": "Take Metro Line 1 to First Affiliated Hospital of Harbin Medical University Station, then walk about 10 minutes."}], "name": "Popular Photo Spots"}}, "name": "Nangang Commercial District and Gogol Street"}, "pingfang_history": {"categories": {"cat_1": {"items": [{"address": "No. 25 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | This modern exhibition hall features a black rectangular structure known as the \u0027Black Box,\u0027 symbolizing a flight recorder that uncovers historical truth. The museum displays a wealth of physical artifacts, photographs, documents, and testimonies detailing the human experimentation and germ warfare atrocities committed by the Japanese army during WWII. The architecture itself evokes a profound sense of solemnity, making it an invaluable educational and memorial site.", "name": "Museum of Evidence of War Crimes by Japanese Army Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 (Exit 1), then walk for about 5 minutes."}, {"address": "No. 23 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Built in 1936, the Headquarters Building is one of the best-preserved structures at the Unit 731 site. Designed in a Japanese administrative style with a two-story brick-and-wood structure, it served as the supreme command center for the Epidemic Prevention and Water Purification Department of the Kwantung Army, overseeing massive biological weapon research and human trial programs. Walking inside offers a hauntingly solemn historical atmosphere.", "name": "Former Headquarters Building of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk for about 3 minutes."}, {"address": "Inside Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | This towering brick chimney is one of the most prominent landmarks at the Unit 731 site. Beyond supplying heat and steam sterilization for the massive facility, the boiler room was chillingly used to cremate victims\u0027 bodies and burn evidence. Standing tall to this day, the chimney serves as a silent witness to a dark chapter in history.", "name": "Former Boiler Room Chimney of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk into the park to reach the site."}, {"address": "Inside Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | This workshop site reveals where the Japanese army secretly mass-produced destructive weapons like ceramic bacterial bombs. The remaining concrete foundations and reinforced steel structures expose the sheer scale of automated biological weapon production at this \u0027death factory.\u0027 Detailed historical information boards and protective shelters help visitors gain a deeper understanding of WWII history.", "name": "Former Bacterial Bomb Assembly Workshop of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk for about 8 minutes within the park."}, {"address": "Central Area of Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Located in the center of Building No. 4, the Special Prison was used to detain innocent human test subjects, referred to chillingly as \u0027maruta\u0027 (logs). Destroyed by retreating Japanese forces in 1945 to destroy evidence, the site today preserves building foundations and underground passage ruins. Raised walkways allow visitors to view the layout of the detention area, offering a sobering and profound historical experience.", "name": "Former Special Prison Site of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk about 10 minutes into the protected site area."}, {"address": "Inside Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | The Frostbite Laboratory was a primary facility for human experimentation under extreme environmental conditions. Exploiting Harbin\u0027s brutal winter cold, Japanese researchers conducted agonizing frostbite and rewarming experiments on human victims. Remaining wall sections and low-temperature equipment bases serve as crucial physical evidence of illegal medical experiments during WWII.", "name": "Former Frostbite Laboratory of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk for about 6 minutes within the park."}, {"address": "Inside Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | This site was used for secret human exposure tests with various toxic chemical gases and aerosols, including mustard gas and lewisite. Although the main structure was destroyed, the surviving ruined walls and underground pipeline networks document the intricate design and heavy security of the facility.", "name": "Former Poison Gas Laboratory of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk for about 7 minutes within the park."}, {"address": "Inside Unit 731 Ruins Park, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | The Yellow Weasel Breeding Room was a specialized facility built to mass-breed disease-carrying animal vectors and insects for biological warfare. Well-preserved architectural ruins show the extensive vector-breeding pipeline established for large-scale germ warfare, offering visitors deep insight into the scale and cruelty of their research.", "name": "Former Yellow Weasel Breeding Room of Unit 731", "transport": "Take Harbin Metro Line 1 to \u0027Xinjiang Street Station\u0027 and walk for about 10 minutes within the park."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "No. 23 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | The Museum of Evidence of War Crimes by Japanese Army Unit 731 is a specialized historical museum that comprehensively displays the atrocities of bacteriological warfare and human experimentation by the Japanese military during WWII. The museum preserves a wealth of precious historical documents, artifacts, and oral history videos, using modern sound and light technology to recreate horrific experimental scenes. Designed around the concept of a \u0027Black Box\u0027, the architecture symbolizes the unsealing and revelation of painful historical truths. Visitors can deeply feel the value of peace and the weight of history, making it a crucial site for understanding the darkest chapter of WWII\u0027s Asian theater.", "name": "Museum of Evidence of War Crimes by Japanese Army Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 1), then walk about 300 meters."}, {"address": "No. 25 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | The Headquarters Building is the former core command center of Unit 731, built around 1936 as a two-story brick-and-wood structure in a typical WWII Japanese architectural style. It served as the supreme command center where Shiro Ishii and other officers worked and planned bacteriological warfare and human experiments. Restored and open to the public as a historical site, the interior preserves the original office layouts and historical furnishings, exuding a solemn atmosphere that makes it an indispensable site for WWII historical research.", "name": "Unit 731 Headquarters Building Site", "transport": "Take Metro Line 1 to Xinjiang Dajie Station (Exit 2), then walk about 400 meters."}, {"address": "Inside the Relic Park, No. 23 Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | The Sifang Building Site is the most core architectural remnant of Unit 731. Originally a massive square three-story complex, it housed a heavily fortified \u0027Special Prison\u0027 at its center for detaining human test subjects known as \u0027Maruta\u0027. Japanese forces blew it up on the eve of defeat to conceal their crimes. Today, foundation ruins and reinforced concrete fragments remain, sheltered by a protective steel canopy and viewing walkways. Standing before the site offers a profound visual and emotional impact of the devastating atrocities.", "name": "Sifang Building Site of Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, then walk into the historical site park."}, {"address": "Inside the Historic Protection Zone, Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | The Frostbite Laboratory Site was where Unit 731 conducted human experiments in extreme cold temperatures. During Harbin\u0027s freezing winters, victims were exposed to sub-zero temperatures outdoors for brutal frostbite testing, with data recorded for military applications. The site preserves parts of the wall structures and underground pipes, featuring detailed historical panels that offer visitors a direct look at these inhumane crimes, carrying profound historical warning and educational significance.", "name": "Frostbite Laboratory Site of Unit 731", "transport": "Take Bus 343 or 338 to 731 Jiuzhi Station, then walk a short distance."}, {"address": "Near the intersection of Huanghe Road and Xinjiang Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | The Yellow Rat Breeding Room Site was a crucial facility where Unit 731 mass-bred infected fleas and plague vectors. The Japanese military established a large-scale animal breeding and toxin collection system here, supplying steady biological weapons for germ warfare. The surviving site exhibits brick breeding structures and ventilation systems, standing as concrete evidence of mass biological warfare preparations while offering a space for deep historical reflection.", "name": "Yellow Rat Breeding Room Site of Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station and walk about 800 meters."}, {"address": "No. 98 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | The Pingfang District Cultural Center is a comprehensive local cultural venue integrating art exhibitions, intangible cultural heritage protection, and community activities. It regularly hosts calligraphy and painting exhibitions, historical photography displays, and folklore lectures, illustrating Pingfang\u0027s evolution from an industrial hub to a historical and cultural district. With an elegant artistic ambiance, it is an ideal spot to experience local grassroots arts and community life.", "name": "Pingfang District Cultural Center", "transport": "Take Bus 343 to Youxie Dajie Station, then walk about 200 meters."}, {"address": "Intersection of Xinjiang East Road and Baoguo Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | Pingfang Christian Church is a representative religious landmark in Pingfang District. Its design blends modern Gothic with contemporary minimalist styles, featuring red brick exterior walls, a soaring spire, and a cross that stands out solemnly in the neighborhood. The spacious and serene chapel holds warm gatherings on weekends and holidays, offering insight into the evolution of modern religious culture and local spiritual life in Northeast China.", "name": "Pingfang Christian Church", "transport": "Take Bus 338 to Baoguo Dajie Station, then walk about 350 meters."}, {"address": "Relic Area near Dalian Road, Development Zone, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | The Ammunition Depot Site was originally an underground and semi-underground bunker used by Unit 731\u0027s dedicated air force to store aerial bombs and poison gas shells. Constructed with extremely thick walls for blast and air defense, the site preserves reinforced concrete bunker ruins and protective trenches. It demonstrates Unit 731\u0027s military deployment for air-delivered biological and chemical warfare, serving as important physical evidence to understand the full scale of the historical site.", "name": "Ammunition Depot Site of Unit 731 Air Force", "transport": "Take Bus 220 to Pingfang Kaifaqu Station, then walk about 600 meters."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 119 Youxie Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | The most iconic and historic comprehensive civic park in Pingfang District. Shaded by lush trees with rippling lake waters, it features scenic bridges, leisure plazas, and abundant children\u0027s playground facilities. In spring and summer, various flowers bloom in full display, making it a preferred oasis for local residents\u0027 morning exercises, strolls, and family gatherings, showcasing the vibrant lifestyle and natural beauty of Pingfang District.", "name": "Pingfang Park", "transport": "Take Metro Line 1 to Pingfang Station, then walk about 800 meters from the exit."}, {"address": "Intersection of Baoguo Avenue and Hanan 17th Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Famous for its picturesque weeping willows and serene lake scenery, Cuiliu Park is built along a water system with well-designed wooden boardwalks and waterfront platforms. Planted with numerous weeping willows and seasonal flowers, it offers a peaceful and pleasant atmosphere. It is a highly distinctive ribbon-shaped waterscape park in Pingfang District, perfect for relaxing strolls and photography.", "name": "Cuiliu Park", "transport": "Take Bus 343 or 361 to Baoguo Dajie Station, then walk about 300 meters."}, {"address": "No. 25 Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | A memorial park combining historic ruins with green landscapes. The expansive outdoor area preserves numerous architectural foundations and remnants of the former site. The park uses simple and solemn landscape design to complement the historic ruins, allowing visitors to contemplate the weight of history in a quiet atmosphere while offering a spacious area for outdoor commemoration and reflection.", "name": "Unit 731 Ruins Memorial Park", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, then walk about 200 meters from the exit."}, {"address": "Junction of Jianxin Street and Youxie Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.0 stars | A community park located in the heart of a residential area in Pingfang District. Well-equipped with walking trails, leisure corridors, and various fitness equipment, it boasts high green coverage and dense tree shade. It provides surrounding residents with an excellent venue for daily leisure and outdoor exercise in a peaceful, warm atmosphere.", "name": "Jianxin Park", "transport": "Take Bus 211 or 338 to Jianxin Jie Station to arrive."}, {"address": "Junction of Tianshan Road and Chang\u0027an Road, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Located near Tianshan Road in Pingfang District, Tianshan Park features a compact and exquisite design blending modern landscape art with natural flora. Equipped with an open-air leisure plaza and fountain waterscapes surrounded by trees, it is a great spot for local residents to enjoy square dancing, walk their kids, and soak up the sunshine.", "name": "Tianshan Park", "transport": "Take Bus 361 to Tianshan Lu Station, then walk about 150 meters."}, {"address": "No. 105 Haping Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Located near the border of Xiangfang and Pingfang districts, this is the largest national-level forest botanical garden within Harbin\u0027s urban area. It features a massive tulip gtang\u0027s team, the museum features a sleek black box design symbolizing the sealing and revealing of historical truth. Inside, a vast collection of artifacts, site models, and archives powerfully exposes the crimes of human experimentation and biological warfare conducted by the Japanese army. Visually striking and deeply solemn, it is an absolute must-visit landmark in Pingfang District.", "name": "Museum of Evidence of War Crimes by Japanese Army Unit 731 - New Hall", "transport": "Take Harbin Metro Line 1 to Xinjiang Dajie Station (Exit 1), and walk about 300 meters."}, {"address": "No. 25 Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Serving as the core command hub of Unit 731, this well-preserved two-story brick-and-wood structure bears solemn traces of history. It documents the complete operational framework of the unit at the time. The historical information plaques in front of the building provide rich context, making it an essential site for understanding this history and capturing meaningful photographs.", "name": "Former Headquarters Building of Unit 731", "transport": "Take Harbin Metro Line 1 to Xinjiang Dajie Station, then walk about 5 minutes after exiting."}, {"address": "Behind the Evidence Museum Complex, No. 23 Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | The Sifang Building was once the secret location where Unit 731 conducted core biological experiments and detained human subjects, destroyed by the Japanese army on the eve of their defeat. Today preserved as an open-air historical site following archaeological excavation, its shattered foundations and remaining metal structures deliver a powerful visual and emotional impact, attracting many visitors to lay flowers and pay tribute.", "name": "Sifang Building Site Park of Unit 731", "transport": "Located within the Unit 731 Museum complex. Walk through the main museum building from Metro Line 1 Xinjiang Dajie Station."}, {"address": "Inside the Unit 731 Relic Site Park, Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | This was where the Japanese army used Harbin\u0027s severe cold weather to conduct atrocious human frostbite experiments. Today, remnants of ruined walls and foundations are preserved here, surrounded by detailed historical signage and protective fencing. A deeply reflective site that serves as a powerful reminder of the cruelties of war.", "name": "Former Frostbite Testing Site of Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station, then walk into the Unit 731 Relic Site Park."}, {"address": "Inside the Unit 731 Relic Site Park, Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | This towering brick chimney is a prominent historical landmark in Pingfang District, which once supplied energy and heating to the entire biological unit facility. Standing alone in the ruins park like a monument to history, it is a popular spot for photography enthusiasts capturing poignant shots against the sky.", "name": "Former Boiler House Chimney Site of Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station and walk into the heart of the relic park to see the towering chimney."}, {"address": "No. 9 Chang\u0027an Road, Haping Road Concentrated Area, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Located within the Harbin Brewery complex in Pingfang District, this is one of China\u0027s largest beer-themed museums. Combining century-old beer history exhibits, dynamic holographic displays, and hands-on brewing craft experiences, it features a charming retro European-style beer town street where visitors can sample freshly brewed beer and take stylish, exotic photos.", "name": "Harbin Beer Museum", "transport": "Take Bus 361, 371, or 399 to \u0027Ha Pijiu Chang\u0027 (Harbin Brewery) Station, then walk about 5 minutes."}, {"address": "No. 131 Youxie Street, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | The most iconic urban oasis in Pingfang District, featuring lush trees, shimmering artificial lakes, scenic bridges, winding footpaths, and exquisite garden landscapes. It offers a wonderful glimpse into local slow-paced life and serves as a peaceful spot to unwind and reflect after visiting the solemn historical ruins.", "name": "Pingfang Park", "transport": "Take Bus 343 or 361 to \u0027Pingfang Gongyuan\u0027 (Pingfang Park) Station. It is about 1.5 km from Metro Xinjiang Dajie Station."}, {"address": "Near the exit of the Evidence Museum Complex, No. 23 Xinjiang Avenue, Pingfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 Stars | Located in the memorial area of the museum grounds, the black granite wall is engraved with the names and details of known victims. The corridor maintains a profoundly solemn atmosphere where visitors present flowers and observe moments of silence, making it one of the most emotionally resonant and reverent remembrance sites in the complex.", "name": "Martyrs Wall and Memorial Corridor of Unit 731", "transport": "Take Metro Line 1 to Xinjiang Dajie Station and walk into the Unit 731 Museum complex to reach the memorial corridor."}], "name": "Popular Photo Spots"}}, "name": "Former Site of Unit 731, Pingfang District"}, "songbei_ice_snow": {"categories": {"cat_1": {"items": [{"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Located in the heart of Sun Island, Russian Style Town is a historic scenic area featuring tens of fully preserved classic early 20th-century Russian villas and wooden structures. Exuding rich exotic charm and Harbin\u0027s unique European architectural culture, strolling through it feels like visiting a Far East Russian village. Inside, numerous precious Russian folk art pieces, historical photos, and furniture are on display.", "name": "Russian Style Town", "transport": "Take Harbin Metro Line 2 to Sun Island Station, then walk for about 10 minutes."}, {"address": "Cuiliu Lake, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Shuige Yuntian Pavilion is one of the most representative traditional landscape structures in the Sun Island Scenic Area. Built over the water, this two-story gallery pavilion merges traditional Chinese pavilion style with classic garden design. Situated by Cuiliu Lake, its winding corridors and intricately carved, painted beams make it a superb historical landmark for admiring the lake scenery and capturing reflections.", "name": "Shuige Yuntian Pavilion", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to an electric shuttle car or walk to Cuiliu Lake area."}, {"address": "East Cableway Station, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located on the east side of Sun Island, this cable car station features an elegant medieval European castle design. Majestic spires and vintage brick walls make it an iconic European landmark on the island. The cableway spans the Songhua River, connecting Stalin Park south of the river to Sun Island in the north, offering both aerial transport and an authentic European-style scenic experience.", "name": "Songhua River Cableway Sun Island Castle Station", "transport": "Take the Songhua River Cableway directly from Central Street to Sun Island Castle Station; or take Metro Line 2 to Sun Island Station and walk."}, {"address": "Historical Buildings Exhibition Area, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Built in the early 20th century, this villa is one of the remarkably preserved old Russian wooden villas on Sun Island. Featuring elegant timber frame lines and Russian spires, it stands as a testament to Harbin\u0027s history of foreign immigration and fine craftsmanship during the Chinese Eastern Railway hub era, holding high historical, cultural, and artistic value.", "name": "Belarusian General Villa on Sun Island", "transport": "Take Metro Line 2 to Sun Island Station, then walk to the Historical Buildings Exhibition Area inside the scenic spot."}, {"address": "Central Avenue, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Taiyang Pavilion is an iconic traditional landmark in the Sun Island Scenic Area. Situated on elevated ground, its grand design blends the majestic northern double-eave style with modern landscape art. Towering and magnificent, climbing the pavilion offers panoramic views of Sun Island\u0027s lush greenery and the magnificent Songhua River, making it a must-see core attraction.", "name": "Taiyang Pavilion", "transport": "Take Metro Line 2 to Sun Island Station, then walk for about 12 minutes to reach Taiyang Pavilion."}, {"address": "No. 1 Wenhua Center 1st Road, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | Located at the Songbei Cultural Center near Sun Island and designed by renowned architect Ma Yansong, the Harbin Opera House is Harbin\u0027s premier modern architectural landmark and performing arts haven. Its undulating, snow-white hyper-curved facade appears sculpted by ice and snow, blending seamlessly with the northern landscape. Featuring warm, curved wooden interiors, it has won numerous world-class architectural awards.", "name": "Harbin Opera House", "transport": "Take Metro Line 2 to Shimao Avenue Station, then transfer to Bus 122 or Bus 35 and get off at Harbin Opera House Station."}, {"address": "Harbin Ice and Snow World Park, West Side of Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 stars | Held every winter on the west side of Sun Island, Harbin Ice and Snow World is the world\u0027s largest and most influential ice and snow architectural miracle. Giant blocks of natural ice harvested from the Songhua River are used to construct grand ice castles, historic pagodas, and modern geometric main towers. Combined with state-of-the-art lighting art, it presents a breathtaking and spatially dramatic seasonal epic of architecture.", "name": "Harbin Ice and Snow World Ice Architecture", "transport": "Take Metro Line 2 to Ice and Snow World Station; exit the station to reach the main entrance directly."}, {"address": "No. 1 Taiyang Avenue (Main Gate of Sun Island), Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Located at the main entry of the Sun Island Scenic Area, the Sun Stone and magnificent entrance arch serve as iconic welcoming landmarks. The massive natural granite Sun Stone is inscribed with calligraphy from famous artists, while the entrance building behind it features a grand, modern landscape portico design, symbolizing warm hospitality and rich cultural heritage.", "name": "Sun Stone and Main Entrance Gate of Sun Island", "transport": "Take Metro Line 2 to Sun Island Station (Exit 1); upon exiting, you will see the Sun Stone and the main entrance gate."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | The Sun Island Ice and Snow Art Museum is one of the world\u0027s largest indoor ice and snow art exhibition halls, allowing visitors to experience Harbin\u0027s unique ice culture even in the heat of summer. Maintained at a constant temperature of -5\u00b0C to -10\u00b0C year-round, the museum showcases colorful ice and snow sculptures meticulously crafted by master artists. Combined with brilliant lighting effects, it creates a dreamy, fairytale-like world.", "name": "Sun Island Ice and Snow Art Museum", "transport": "Take Harbin Metro Line 2 to Sun Island Station and walk for about 10 minutes after exiting."}, {"address": "No. 27 Pingyuan Street, Songbei District, Harbin City, Heilongjiang Province (Inside Sun Island Scenic Area)", "feature": "\u2b50 4.3 stars | Located in the heart of Sun Island, the Russian Style Town preserves dozens of Russian-style villas and wooden buildings built in the early 20th century. The exhibition hall displays a wealth of precious Russian folk crafts, oil paintings, old photographs, and vintage furniture, fully showcasing the deep historical fusion of Harbin and Russian cultures. Every spot offers a picturesque, exotic vibe.", "name": "Sun Island Russian Style Town Exhibition Hall", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to a scenic shuttle bus or walk after exiting."}, {"address": "Gongyuan Road, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Harbin is renowned as the \u0027City of Music.\u0027 Situated on Sun Island, this Piano Museum houses over a hundred antique pianos from around the world, spanning centuries. The collection features ancient upright pianos, player pianos, and exquisitely hand-carved grand pianos. Boasting immense artistic and historical value, it is a must-visit cultural sanctuary for music lovers.", "name": "Sun Island Piano Museum", "transport": "Take Harbin Metro Line 2 to Sun Island Station, then walk for about 12 minutes."}, {"address": "East Zone, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Named after Mr. Yu Zhixue, the founder of China\u0027s famous Ice and Snow Painting School, this art museum displays a large number of traditional Chinese paintings and snow sculptures themed around Heilongjiang\u0027s snowscapes and Northern minority lifestyles. The unique architectural style seamlessly blends traditional ink art with modern ice and snow aesthetics, showcasing the ultimate artistic charm of the northern cold region.", "name": "Yu Zhixue Snow Sculpture Art Museum", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to a scenic tour bus."}, {"address": "No. 1 Wenhua Zhongxin 1st Road, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | The Harbin Grand Theatre is not only a world-class performing arts center, but its architecture itself is a grand modern sculpture. Inside, permanent and special exhibition spaces regularly host architectural photography, contemporary art, and musical artifact exhibitions. With its exterior undulating like snow-capped peaks, visitors can also walk up the winding rooftop pathway to enjoy breathtaking panoramic views of the Songhua River and Sun Island.", "name": "Harbin Grand Theatre Cultural \u0026 Art Space", "transport": "Take Bus 122, 145, or 146 to Harbin Grand Theatre Station."}, {"address": "No. 1458 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located at the entrance of Sun Island, this large modern museum combines popular science education, art displays, and interactive experiences. It features 12 exhibition areas and several special-effects theaters, including sound-and-light art experience zones, mechanical aesthetics exhibits, and aerospace model displays. Edutaining and fun, it is ideal for family travelers and tech/art enthusiasts to explore deeply.", "name": "Heilongjiang Science and Technology Museum", "transport": "Take Metro Line 2 to Sun Island Station (Exit 2), then walk for about 300 meters."}, {"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Nestled amid lush greenery in the scenic area, the Sun Island Art Gallery is an exquisite building filled with Russian flair. It year-round exhibits oil paintings, watercolors, and wood carvings by local Harbin and contemporary Russian artists, reflecting the unique regional art style along the Songhua River. With its serene and pleasant environment, it is an excellent spot to soak in a cultural atmosphere.", "name": "Sun Island Art Gallery", "transport": "Take Metro Line 2 to Sun Island Station and walk for about 8 minutes after exiting."}, {"address": "Inside the Russian Style Area, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Built to commemorate the historically famous St. Nicholas Cathedral of Harbin, this exquisite wooden architectural pavilion was created within the Sun Island Scenic Area. The gallery detailedly presents the original cathedral\u0027s architectural blueprints, precious historic photos, and a 1:1 scale wood-carved model, telling visitors the legendary architectural and religious art story of Harbin, the \u0027Moscow of the East.\u0027", "name": "Saint Nicholas Church Model Art Pavilion", "transport": "Take Metro Line 2 to Sun Island Station, then transfer to a scenic sightseeing tram or walk for about 15 minutes."}], "name": "Arts \u0026 Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "No. 1 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Located on the north bank of the Songhua River, Sun Island is a National AAAAA Tourist Attraction and a renowned summer resort and ecological park zone in Harbin. Lush with trees and vibrant flowers, the island boasts breathtaking natural scenery and a unique river island ecosystem. In summer, the pleasant climate makes it perfect for picnics, cycling, and strolling along the riverside to admire European-style architecture; in winter, it hosts the world-famous Snow Sculpture Art Expo.", "name": "Sun Island Scenic Area", "transport": "Take Harbin Metro Line 2 to Sun Island Station, or take the Songhua River Cableway across the river."}, {"address": "Central Lake Area, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | One of the iconic landmarks in Sun Island Park, Water Pavilion and Cloud Sky sits on the edge of the island\u0027s central lake. Combining modern and classical aesthetics, this two-story waterside pavilion features long corridors, viewing decks, and lakeside gazebos. From the pavilion, visitors can enjoy sweeping views of the crystal-blue lake and surrounding lush forests. When the lotuses bloom in summer, the scene is especially graceful, making it a perfect spot for photos and peaceful relaxation.", "name": "Sun Island Water Pavilion and Cloud Sky", "transport": "Walk or take a sightseeing shuttle bus within the Sun Island Scenic Area."}, {"address": "East side of Sun Island Park, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Located in the ecological zone of Sun Island Park, Squirrel Island is a natural sanctuary specially created for squirrels and other small wild animals. The island features charming wooden squirrel houses and climbing ropes, with lively squirrels frequently seen leaping through the trees. Visitors can feed them nuts in designated interactive areas and enjoy close encounters with these adorable creatures, making it ideal for family trips and nature photography.", "name": "Sun Island Squirrel Island", "transport": "After entering the Sun Island Scenic Area, follow the main road signs for about a 15-minute walk."}, {"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Sun Island Deer Park is a fairytale-like forest ecological area filled with expansive lawns and temperate trees, home to gentle sika deer and red deer. Visitors can watch the deer roaming freely along the edge of the vast lawn or purchase special feed to interact with them. The serene environment and fresh air make it a wonderful spot to experience the charm of nature and peaceful wildlife interaction.", "name": "Sun Island Deer Park", "transport": "Walk or take a sightseeing shuttle bus within the Sun Island Scenic Area."}, {"address": "North side of Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Located in the wetland nature reserve of Sun Island, Swan Lake is a natural lake offering immense ecological value. The crystal-clear water is framed by dense reeds and weeping willows. Home to black swans, white swans, and various rare waterfowl, visitors can stroll along the wooden boardwalk to watch swans gliding gracefully across the water, enjoying a tranquil escape from the bustling city.", "name": "Sun Island Swan Lake", "transport": "Walk or take a sightseeing shuttle bus to Swan Lake Station inside the Sun Island Scenic Area."}, {"address": "South side of Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Sun Island Flower Garden is one of the largest outdoor botanical gardens in Northeast China. Covering an expansive area, it features multiple meticulously designed exhibition zones with hundreds of seasonal flower species, including tulips, peonies, roses, and alpine blooms. During spring and summer, the entire garden transforms into a vibrant canvas, attracting countless tourists and photography enthusiasts.", "name": "Sun Island Flower Garden", "transport": "Accessible on foot within the Sun Island Scenic Area."}, {"address": "West side of Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Famous worldwide for its magnificent winter ice and snow architectural wonders, the Harbin Ice and Snow World Park also transforms into a grand riverside park during the non-winter seasons. Spanning a vast area along the Songhua River, it boasts wide open green spaces and stunning river views. In summer, it hosts indoor ice and snow pavilion experiences, beer festivals, and outdoor music events, offering a lush, vibrant atmosphere entirely different from its winter wonderland persona.", "name": "Harbin Ice and Snow World Park", "transport": "Take Harbin Metro Line 2 directly to Ice and Snow World Station."}, {"address": "Wenhua Zhongxin 1st Road (next to Harbin Opera House), Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Adjacent to the northeast side of Sun Island, Harbin Opera House Wetland Park seamlessly blends avant-garde modern architecture with pristine riverside wetland ecology. Multi-kilometer wooden boardwalks wind through tall reeds and peaceful ponds. Strolling along the path offers close-up views of wild wetland flora and fauna, alongside stunning panoramic angles of the sleek, futuristic Harbin Opera House\u2014making it a top spot for capturing sunsets and architectural reflections.", "name": "Harbin Opera House Wetland Park", "transport": "Take Metro Line 2 to Shimao Avenue Station or Sun Island Station, then transfer to a bus or taxi."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "West Side of Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Founded in 1999, this is the world\u0027s largest ice and snow theme park. Every winter, massive blocks of ice harvested from the Songhua River are used to build grand ice castles, aurora towers, and spectacular light shows. When night falls, colorful lights illuminate the park into a magical wonderland, making it Harbin\u0027s ultimate unmissable winter landmark and top photo spot.", "name": "Harbin Ice and Snow World", "transport": "Take Harbin Metro Line 2 to \u0027Ice and Snow World Station\u0027, Exit 3."}, {"address": "Inside Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Commonly known as the \u0027Sun Island Snow Expo\u0027, it is the birthplace and largest venue for snow sculpture art in China. Every winter, top snow sculptors from around the world craft massive yet intricately detailed white snow sculptures. The snow-white world bathed in sunlight is breathtaking, perfect for high-end winter photo shoots.", "name": "Sun Island International Snow Sculpture Art Expo", "transport": "Take Harbin Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 2, and walk to the destination."}, {"address": "Inside Ice and Snow World, West Side of Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Standing 120 meters tall, this giant Ferris wheel features snowflake-shaped cabins equipped with climate control and transparent panoramic windows. At the highest point, riders enjoy an unobstructed 360-degree view of the dazzling ice structures across Ice and Snow World and the frozen Songhua River, making it an extraordinarily romantic photo landmark.", "name": "Snowflake Ferris Wheel at Ice and Snow World", "transport": "Take Harbin Metro Line 2 to \u0027Ice and Snow World Station\u0027 and enter the park."}, {"address": "No. 67 Taiyang Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Adjacent to the Sun Island Scenic Area, this is the world\u0027s first polar performing arts theme park. Popular photo highlights include the internet-famous \u0027Naughty Penguins Backpacking\u0027 outdoor parade and the original beluga whale show \u0027Heart of the Ocean\u0027. Visitors can interact closely with penguins and polar bears in a charming, magical atmosphere.", "name": "Harbin Polarland", "transport": "Take Harbin Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, Exit 1, and walk for about 5 minutes."}, {"address": "No. 27 Pingdingshan Road, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | Located in the core area of Sun Island, this spot preserves dozens of early 20th-century Russian-style wooden villas and historic buildings. Visitors receive a special souvenir passport to stamp at the entrance. Featuring exotic streetscapes, Russian handicraft shops, and traditional bakeries, it is a fantastic spot for retro-style photos.", "name": "Russian Style Town", "transport": "Take the Sun Island sightseeing shuttle or walk from Metro Line 2 \u0027Taiyangdao (Sun Island) Station\u0027."}, {"address": "Central Lake Area, Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Shuige Yuntian is an iconic landmark within the Sun Island Scenic Area, featuring a two-story corridor design situated on the banks of a man-made lake. Lush green and reflecting vibrant landscape views in summer, the lake turns into a serene, snow-covered northern winter wonderland that attracts countless photography enthusiasts.", "name": "Shuige Yuntian Pavilion", "transport": "Walk within Sun Island or take the scenic area shuttle car to reach."}, {"address": "Inside Ice and Snow World, West Side of Songbei Avenue, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.9 Stars | The flagship attraction of Ice and Snow World, this slide stretches over 500 meters with a vertical drop of tens of meters. Visitors zip down from the top on specialized sleds to experience high-speed thrills. Besides being exciting, its massive ice structure is a must-see, must-photo highlight of the park.", "name": "Super Ice Slide at Ice and Snow World", "transport": "Take Harbin Metro Line 2 to \u0027Ice and Snow World Station\u0027, enter the park, and head to the Slide Area."}, {"address": "East Side of Sun Island Scenic Area, Songbei District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Located on the eastern side of Sun Island, this is the largest squirrel viewing and interaction park in Heilongjiang Province. Boasting a beautiful natural environment, it features quaint wooden cabins and elevated walkways. Hundreds of friendly squirrels leap through the trees, allowing visitors to hand-feed them nuts and snap photos\u2014a heartwarming, popular hotspot for families and young travelers.", "name": "Squirrel Island at Sun Island", "transport": "Take Harbin Metro Line 2 to \u0027Taiyangdao (Sun Island) Station\u0027, then transfer to a park shuttle car or walk."}], "name": "Popular Photo Spots"}}, "name": "Sun Island and Ice and Snow World"}, "volgar_manor": {"categories": {"cat_1": {"items": [{"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.8 stars | As the most iconic central landmark of Volga Manor, St. Nicholas Church Art Museum is a faithful 1:1 scale replica of the famous St. Nicholas Cathedral, which once stood in downtown Harbin before being destroyed during a historical period. Crafted entirely according to traditional mortise-and-tenon woodworking techniques without using a single nail, it showcases classic Russian wooden tented-roof architecture. Inside, a vast collection of precious historical photos, Russian Orthodox artworks, and exquisite murals are displayed, evoking a profound sense of religious artistry and historical depth. It is an absolute must-visit for anyone wanting to explore Harbin\u0027s Russian architectural heritage.", "name": "St. Nicholas Church Art Museum", "transport": "Take the Volga Manor direct tourist shuttle or a taxi from downtown Harbin to reach the manor; it is easily accessible on foot after entering the park."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.7 stars | Recreating classic Russian architectural style, Pavlov Castle is a grand fortress modeled after an original castle near St. Petersburg. Towering by the Ashi River, its exterior features impressive, heavy stone masonry and beautifully designed defensive towers. Inside, art exhibition halls display large oil paintings by renowned Russian artists, fine handicrafts, and rare classical furniture year-round. Visitors can enjoy sweeping views of the manor and the Ashi River from the top floor, while immersing themselves in the dignified luxury of an ancient Russian noble estate.", "name": "Pavlov Castle", "transport": "Electric sightseeing cars are available within the park, or you can take a pleasant stroll along the scenic Ashi River promenade."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.6 stars | Named after the great Russian poet Alexander Pushkin, the Pushkin Salon features 19th-century Russian Neoclassical architecture. This elegant white building stands amidst lush trees and vibrant flower beds, fronted by a bronze statue of Pushkin. The interior is spacious and refined, regularly hosting Russian arts and culture exhibitions, oil painting salons, and elegant musical events. Here, surrounded by a rich literary and artistic ambiance, visitors can savor the profound depth and grace of traditional Russian culture.", "name": "Pushkin Salon", "transport": "Located in the central cultural zone of the park; about a 5-minute walk along the main road from the scenic area entrance."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.5 stars | Miniajur Restaurant recreates the famous Russian wooden-structure restaurant that once flourished on Sun Island in Harbin. Built by the water with a unique boat-like wooden architecture, it resembles a magnificent wooden ship docked at the riverbank. The interior boasts nostalgic Russian-style decor, offering authentic traditional Russian royal cuisine and Western specialties. Dining here offers lovely views of the shimmering Ashi River, letting guests experience the romantic allure of old Harbin, known as the \u0027Oriental Moscow\u0027.", "name": "Miniajur Restaurant", "transport": "Easily accessible on foot within the scenic area, located near the Ashi River viewing platform."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.6 stars | Imbued with Baroque romanticism, Petrov Palace is a magnificent building inspired by the imperial palace architectural style of Peter the Great\u0027s era. The vibrant facade features exquisite carvings, where majestic domes and soaring colonnades reflect supreme royal grandeur. Inside, opulent decor boasts soaring gold-leaf ceilings, fine murals, and large crystal chandeliers. Currently used for high-end art exhibitions, business conferences, and grand banquets, it perfectly revives the lavish court splendor of Tsarist Russia.", "name": "Petrov Palace", "transport": "Take the park sightseeing shuttle car, or walk about 10 minutes from the main plaza."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.5 stars | Modeled after the famous Tsaritsyno Imperial Estate in Moscow, Tsaritsyno Castle combines Gothic and traditional Russian architectural elements. Featuring red brick walls and white accents, this fairytale castle boasts charmingly layered towers that look magical against the winter snow. Surrounded by lush green lawns and winding streams, it is a dream location for photography enthusiasts capturing Russian architecture, light, and portraits.", "name": "Tsaritsyno Castle", "transport": "It is recommended to take the park shuttle car to the Castle Area stop, or stroll along the circular walking trail."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.4 stars | Recreating traditional Russian rural dwellings, Three Bears Park is a charming cluster of wooden houses constructed entirely from logs. The buildings preserve authentic notched log joinery techniques, adorned with colorful finishes and folk carvings. Visitors can explore traditional Russian family layouts, a bakery, and craft workshops, or try hands-on activities like painting Matryoshka nesting dolls to experience the rustic, warm atmosphere of Russian village life.", "name": "Three Bears Park Wooden House Complex", "transport": "Located in the family recreation area of the manor; about an 8-minute walk from the main entrance."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province, China", "feature": "\u2b50 4.6 stars | Combining modern design with traditional Russian elements, the Fantasia Performing Arts Center is a domed theater building serving as Volga Manor\u0027s premier venue for Russian dance and music shows. The grand exterior houses professional stage facilities and advanced lighting and sound systems. Daily performances by professional Russian dance troupes feature passionate folk dances, ballet, and musical shows, giving visitors a visually stunning cultural extravaganza within a classic architectural setting.", "name": "Fantasia Performing Arts Center", "transport": "Located in the core service area of the manor, adjacent to Volga Hotel; easily accessible on foot."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 stars | The St. Nicholas Church Art Museum is the iconic centerpiece of Volga Manor. It is a precise 1:1 replica of the original St. Nicholas Cathedral, built in downtown Harbin in 1899 and later destroyed during historical upheaval. Constructed using traditional Russian wooden log-building techniques without a single nail, it showcases extraordinary architectural craftsmanship. The interior houses a rich collection of precious icons, historical photographs, and Russian religious art, taking visitors on a journey through time to experience the religious charm and historical depth of the former \u0027Moscow of the East\u0027.", "name": "St. Nicholas Church Art Museum", "transport": "Take the direct Volga Manor shuttle bus, or take Bus 377 from downtown Harbin to Chenggaozi Town, then transfer to Bus 340 directly to the manor\u0027s main entrance."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Standing gracefully on the banks of the Ashi River, Pavlov Castle is modeled after a late-18th-century defensive fortress built during the reign of Tsar Paul I of Russia. Featuring weathered red-brick walls and classic defensive towers, the castle has been transformed into an oil painting gallery showcasing masterpieces and sculptures by famous Russian artists. Strolling through the castle corridors, the picturesque river view outside blends seamlessly with the artwork inside, creating a tranquil and poetic atmosphere.", "name": "Pavlov Castle Art Museum", "transport": "Reachable on foot within the manor, or take the resort\u0027s sightseeing shuttle car to attractions along the Ashi River."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Built in 2007, Pushkin Salon takes architectural inspiration from late-19th-century Russian salon buildings, featuring a blend of classicism and Russian countryside charm. It hosts high-profile Russian fine art exhibitions, cultural lectures, and salon gatherings. The gallery displays a wide array of fine paintings by contemporary Russian masters, immersing visitors in the romantic artistic atmosphere of the era of Alexander Pushkin, Russia\u0027s literary giant.", "name": "Pushkin Salon Art Gallery", "transport": "An 8-minute walk from the main entrance, or take the park shuttle car to Cultural Square Station."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | The Petrov Art Palace is a grand Russian palace within the manor, beautifully blending Baroque and Neoclassical styles. Its grand hall is adorned with magnificent gold leaf murals, giant crystal chandeliers, and original wall paintings by masters from the Repin Academy of Arts. Year-round exhibitions showcase oil paintings and manuscripts by outstanding artists from the Repin Academy, making it a premier cultural haven for exploring Russian art history and imperial court aesthetics.", "name": "Petrov Art Palace", "transport": "Sightseeing shuttles and cruise boats are available in the park; visitors can take a boat from Venice Pier to Petrov Palace Pier."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Modeled after Russia\u0027s famous Bishingov Castle, Vodka Castle combines defensive architecture with winery styling. The interior houses a museum dedicated to Russian vodka culture, detailing its brewing history, varieties, and drinking etiquette, along with a collection of unique bottles from around the world. The highlight is the Ice Bar experience, where visitors can savor authentic ice-cold vodka from glasses made of real ice in sub-zero temperatures\u2014an unforgettable cultural experience.", "name": "Vodka Castle Museum", "transport": "Located in the central area of the manor, easily reachable on foot, adjacent to the Ashi River scenic trail."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Inspired by the famous Tsaritsyno Imperial Estate in Moscow, Tsaritsyno Castle features a striking blend of Gothic and traditional Russian styles with alternating red brick and white stone. Serving as a cultural and artistic exhibition space, it hosts rotating displays of Russian folk crafts, manuscripts, costumes, and traditional handiwork (such as the history of Matryoshka nesting dolls). Its distinctive red-brick fa\u00e7ade and gleaming metal spires stand out elegantly across all four seasons.", "name": "Tsaritsyno Castle", "transport": "Walk within the park or take a scenic boat ride to Tsaritsyno Pier."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | The Moscow Theater faithfully recreates the grand exterior of classic Russian theaters, topped with exquisite domes and sculptures. It serves as both an exhibition hall for Russian performing arts history and the premier venue for watching authentic Russian song and dance performances. Daily regular shows performed by professional Russian troupes present vibrant dances, folk songs, and musical plays, vividly bringing the passion and romance of Russian culture to life.", "name": "Moscow Theater \u0026 Performance Center", "transport": "Located next to the central plaza, about a 10-minute walk from the main entrance."}, {"address": "Inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Replicated from the famous Ropsha Palace near St. Petersburg, Ropscha Castle preserves the 18th-century architectural aesthetics of the Russian Empire. The castle interior hosts modern and contemporary Russian history and art exhibitions, displaying handicrafts, exquisite porcelain, and antique furniture. Standing serenely by the lake with its majestic reflection dancing on the water, it is an unmissable serene spot for photography and architecture enthusiasts.", "name": "Ropscha Castle Art Museum", "transport": "Take an electric shuttle car from the main entrance directly to the lakeside castle area, or enjoy a scenic stroll along the park\u0027s waterfront trail."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Along the Ashi River inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | The Ashi River meanders through Volga Manor, offering breathtaking waterfront views. Lush trees line both banks of the winding waterway, creating distinct seasonal beauty throughout the year. In summer and autumn, visitors can take a cruise boat along the crystal-clear river to admire the seamless blend of classic Russian architecture and natural ecology, enjoying poetic breezes and shimmering waters.", "name": "Ashi River Scenic Bank", "transport": "Reachable on foot within the manor, or take a sight-seeing boat at the cruise pier."}, {"address": "Wetland Area on the east side of Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Preserving the pristine ecology of the Ashi River basin, this natural wetland is home to diverse aquatic plants and vibrant bird habitats. Wooden boardwalks weave through the wetlands, where early morning fog creates a mystical fairytale landscape. Visitors can observe wild ducks and herons up close, making it an ideal spot to relax, breathe fresh air, and capture nature photography.", "name": "Volga Manor Wetland Park", "transport": "Enter through the main entrance of the manor and follow the signs for about a 15-minute walk to the boardwalk entrance."}, {"address": "Birch Forest Area inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Birch trees are an important symbol in traditional Russian culture, and the manor features a sprawling, dense birch forest. Each season brings a unique charm: vibrant green leaves offer cool shade in summer, golden foliage contrasts sharply with white trunks in autumn, and snow-covered branches create a fairytale winter wonderland filled with Russian romanticism.", "name": "Birch Forest Area", "transport": "Take the shuttle cart inside the manor to Birch Forest Station, or walk for about 10 minutes."}, {"address": "Courtyard in front of Tsaritsyno Castle inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Built around the magnificent Tsaritsyno Castle, this European-style garden blends classic Russian royal landscaping with natural scenery. Planted with diverse flowers and ornamental shrubs, it features an elegant central fountain and exquisite sculptures. During spring and summer blooms, colorful floral displays complement the red-and-white castle, drawing countless photography enthusiasts.", "name": "Tsaritsyno Castle Garden", "transport": "Easily accessible on foot within the manor to the castle garden plaza."}, {"address": "Behind Petrov Art Palace inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Situated directly behind the Petrov Art Palace along the Ashi River, this lawn garden seamlessly blends natural and artistic beauty. Expansive green lawns stretch to the water\u0027s edge, surrounded by mature trees and vibrant flower beds. It is also one of the best spots in the manor to watch the sunset, as golden light reflects off the river and illuminates the palace spires.", "name": "Petrov Palace Back Garden", "transport": "Walk along the main avenue to Petrov Art Palace and pass through the main building to reach the back garden."}, {"address": "Ashi River Bend inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Located along a bend of the Ashi River, this natural beach area features soft sand bordering clear waters, surrounded by lush vegetation. In summer, it is a fantastic spot for water fun and outdoor sunbathing. Outfitted with lounge chairs and Russian-style umbrellas, it makes visitors feel as though they are at a European resort.", "name": "Volga Manor Sunny Beach", "transport": "Take the sight-seeing shuttle cart inside the manor, or walk along the waterfront path for about 12 minutes."}, {"address": "Island in the middle of the Ashi River inside Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Situated in the middle of the Ashi River and connected to the main park by a small bridge, this island is filled with lush greenery and waterfront viewing decks. The park cleverly utilizes natural waterways and island terrain. Surrounded by shady trees and peaceful surroundings, strolling along the island trail offers 360-degree panoramic views of nearby Russian architecture and river scenery\u2014a truly tranquil getaway within the manor.", "name": "Vannis Market Island Waterfront Park", "transport": "Cross the wooden bridge inside the manor to reach the island on foot."}, {"address": "West side of Volga Manor, 16 km Hacheng Road, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Combining natural forest landscapes with rolling hilly terrain, this golf course boasts an exceptionally high greenery coverage. Expansive lush lawns intertwine with natural woods, creating rich visual layers across the seasons. Even for non-golfers, walking along the surrounding trails offers a refreshing dose of forest phytoncides and open nature for a relaxing outdoor experience.", "name": "Forest Golf Course Park", "transport": "Take the manor\u0027s dedicated golf shuttle at the Visitor Center."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Inside Volga Manor Scenic Area, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | The St. Nicholas Church Art Gallery is the most iconic landmark within Volga Manor, reconstructed as a precise 1:1 replica of the original St. Nicholas Cathedral that once stood on Central Street in Harbin before its destruction. Built entirely of traditional Russian wooden architecture without a single iron nail, it showcases superb craftsmanship and religious artistic charm. The gallery houses a wealth of precious historical photos and Russian Orthodox cultural artifacts. Surrounded by lush trees and gardens, it offers an intensely romantic, exotic backdrop for photos whether in spring green or winter snow, making it a must-visit photo spot for every visitor to the manor.", "name": "St. Nicholas Church Art Gallery", "transport": "It is recommended to take the dedicated Volga Manor shuttle bus, or take Bus 377 from downtown Harbin to Chenggaozi Town and transfer to a local taxi."}, {"address": "Ashi Riverbank, Inside Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Standing proudly on the banks of the Ashi River, Pavlov Castle is modeled after famous historical fortresses in Russia. Built with deep red brick, its imposing walls and exquisite towers complement each other, evoking a strong classical European military aesthetic. The interior is decorated in a classic aristocratic style, hosting year-round exhibitions of fine Russian handicrafts, ceramics, and paintings. Strolling along the top floor, you can enjoy panoramic views of the meandering Ashi River and the breathtaking scenery of the manor, making it an ideal location for wedding photography and high-end aesthetic photos.", "name": "Pavlov Castle", "transport": "Accessible on foot within the manor, or take the vintage electric shuttle car."}, {"address": "Central Area, Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | The Petrov Art Palace is one of the grandest and most magnificent structures in the manor, capturing the essence of 18th-century Russian Baroque architecture. Its luxurious interior features a massive atrium and a grand double-winged colonnaded staircase, with ceiling murals painted in the exquisite style of the Repin Academy of Fine Arts. The palace displays hundreds of original oil paintings and intricate sculptures by famous Russian artists. Strolling through feels like visiting the Hermitage Museum in St. Petersburg, with every hallway, chandelier, and golden wall accent offering a visually stunning photo backdrop.", "name": "Petrov Art Palace", "transport": "About a 5-minute walk along the main path within the park."}, {"address": "Next to St. Nicholas Church, Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Named after the great Russian poet Alexander Pushkin, the Pushkin Salon is a 19th-century Russian-style building featured with a classic red-and-white facade and delicate wrought-iron decorations. Recreating the social atmosphere where 19th-century Russian cultural elites gathered, it now serves as a high-end cultural and art exhibition hall within the manor. Surrounded by vibrant flowers and offering a quiet, elegant interior, it exhibits fine paintings and photographic works by contemporary Russian artists. With its rich artistic ambiance and retro elegance, it is perfect for photos in classic European dresses.", "name": "Pushkin Salon", "transport": "Located diagonally opposite the St. Nicholas Church Art Gallery, just a 1-minute walk away."}, {"address": "East Side of Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Designed in a fairytale-like traditional Russian countryside style, the Three Bears Russian Folk Park perfectly recreates a 19th-century Russian log cabin village. The park is filled with cute Matryoshka nesting dolls, wooden windmills, and charming sculptures, offering interactive DIY experiences such as painting your own nesting doll or baking Russian Kvass bread. It is not only a paradise for families, but its vibrant colors and playful architecture also make it a trendy photo spot for young travelers, instantly transporting visitors into a classic Russian picture book.", "name": "Three Bears Russian Folk Park", "transport": "Follow the signs for an 8-minute walk within the manor, or take the park shuttle car."}, {"address": "Inside Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Modeled after the famous Tsaritsyno Imperial Estate in Moscow, Tsaritsyno Castle perfectly blends the soaring lines of Gothic architecture with the lavishness of Russian folk style. Its red-and-white brick walls and exquisite domed towers stand out brilliantly under clear blue skies, combining majesty with romance. Inside, visitors can enjoy fine Russian afternoon tea and rent vintage court costumes, dressing up in glamorous Russian aristocratic attire to capture dreamlike palace-style photos along classical corridors and carved archways.", "name": "Tsaritsyno Castle", "transport": "After entering through the main gate, take the sight-seeing car directly to the Tsaritsyno Castle area."}, {"address": "Along the Ashi River, Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | The Ashi River meanders through Volga Manor, and the waterfront pier offers the best vantage point for admiring the scenic riverbanks and exotic architecture on both sides. In summer, with clear waters and lush greenery, visitors can board painted pleasure boats or rowboats to capture castle reflections shimmering on the water. In winter, the frozen river transforms into a winter wonderland where the pier becomes a hub for ice biking, curling, and castle skiing. Regardless of the season, it offers visually rich and picture-perfect photo opportunities.", "name": "Ash River Waterfront Pier", "transport": "Located around the central waters of the manor; all pier boarding points are easily accessible on foot."}, {"address": "Ski Area inside Volga Manor, 16 km Marker, Hacheng Road, Chenggaozi Town, Xiangfang District, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | The Volga Manor Ski Resort is a world-renowned destination for \u0027Castle Cross-Country Skiing\u0027 and \u0027High-Altitude Castle Snow Tubing\u0027. Visitors can experience the thrill of speeding down a long ice-and-snow slide right from the top of Pavlov Castle. Covered in a thick blanket of snow during winter, the pristine white landscape contrasts beautifully with the fairytale Russian castles, making you feel as though you\u0027ve stepped into a Frozen kingdom. It is an unmissable outdoor experience and top photography hotspot during a winter trip to Harbin.", "name": "Volga Manor Ski Resort", "transport": "When open during the winter season, follow the guide signs upon entering or take the park shuttle bus to the ski hall."}], "name": "Popular Photo Spots"}}, "name": "Volga Manor Scenic Area"}, "yabuli_resort": {"categories": {"cat_1": {"items": [{"address": "Inside Yabuli Ski Resort, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Built in 2008, Yabuli South Railway Station is China\u0027s first Gothic-style railway station specifically designed for a ski resort. Its castle-like appearance blends seamlessly with the surrounding snow-covered mountain forests, earning it the reputation of \u0027China\u0027s Most Beautiful Ski Resort Railway Station.\u0027 Beyond its function as a vital transit hub, its spires, arches, and European-style exterior make it an iconic, must-photograph architectural landmark for visitors arriving in Yabuli.", "name": "Yabuli South Railway Station", "transport": "Take the direct ski express train from Harbin to Yabuli South Railway Station"}, {"address": "Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Built on the eve of the 3rd Asian Winter Games in 1996, Yabuli Windmill Village is the most iconic architectural complex in the Yabuli Ski Resort. Blending traditional European villas with wooden windmill cabins, it served as the Athletes\u0027 Village during the Asian Winter Games. Housing dozens of uniquely styled timber structures and windmill buildings, it chronicles the inception and growth of modern winter sports in China.", "name": "Yabuli Windmill Village", "transport": "Take a resort shuttle bus or taxi within the resort area"}, {"address": "Qingyun Town, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | Designed by renowned architect Ma Yansong (MAD Architects), this futuristic building blends modern art with nature and is known as \u0027a white cloud under the snow-capped mountains.\u0027 Featuring a hybrid steel and timber structure, its shape resembles a giant wing resting on the snow plains, symbolizing the flight of entrepreneurial spirit. Completed in 2020, it stands as Yabuli\u0027s most architecturally significant contemporary landmark.", "name": "Yabuli China Entrepreneurs Forum Permanent Site", "transport": "About a 10-minute taxi ride from Yabuli South Railway Station"}, {"address": "Zhanqian Street, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 Stars | Yabuli Town was originally named \u0027Yabloni\u0027 (Russian for \u0027apple orchard\u0027). This station is a historical remnant from the construction of the Chinese Eastern Railway in the early 20th century. Exhibiting classic Tsarist Russian architectural style with yellow walls, wooden windows, and metal roofs, it stands as a witness to a century of Sino-Russian trade and forestry railway development, serving as a key architectural specimen for understanding Heilongjiang\u0027s modern history.", "name": "Old Yabuli Railway Station Site of CEE (Chinese Eastern Railway)", "transport": "Walk directly upon exiting Yabuli Railway Station (Old Station)"}, {"address": "Qingyun Town, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Qingyun Town is a unique town within the Yabuli Resort that combines history, culture, and leisure. It meticulously preserves and reconstructs several elegant Russian-style \u0027Mukeleng\u0027 (log houses) and brick-timber structures. Characterized by intricate decorative carvings, vibrant colors, and steep pitched roofs, these buildings recreate the architectural fusion of Chinese and Russian cultures in Heilongjiang\u0027s border regions during the late Qing Dynasty and early Republic of China era.", "name": "Qingyun Town Russian Style Architecture Complex", "transport": "Resort internal bus or free scenic area shuttle"}, {"address": "Forest Area, Yabuli Forestry Bureau, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | This station is part of the narrow-gauge steam train relics once used for lumber transportation in the Northeast forests. Built with rugged, rustic logs typical of traditional northeastern timberlands, it exudes a strong sense of history. Preserved on site are vintage steam locomotives and tracks, documenting the historical shift from forestry exploitation to ecological transformation in mid-20th century Yabuli.", "name": "Yabuli Forest Steam Train Station", "transport": "Recommended to drive or hire a private car from the resort"}, {"address": "Summit of Daguokui Mountain, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | Perched atop Mount Daguokui at an elevation of 1,374 meters, this towering landmark marks the highest point in Yabuli. Built with a robust structure to withstand extreme alpine cold and strong winds, the observation tower offers visitors and ski enthusiasts a breathtaking 360-degree panoramic view of the snow-covered forests and the Sanguokui mountain range, standing as a spiritual symbol of Yabuli\u0027s ice and snow culture.", "name": "Yabuli Daguokui Mountain Top Tower", "transport": "Take the Yabuli Cable Car directly to the mountain summit"}, {"address": "Memorial Park surrounding Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | A historic memorial site built to honor General Zhao Shangzhi, a famous commander of the Anti-Japanese Amalgamated Army, after whom Shangzhi City (where Yabuli is located) is named. Featuring a solemn stone monument and memorial park surrounded by lush virgin forests, it serves as the most important red history and cultural landmark in the Yabuli area.", "name": "General Zhao Shangzhi Memorial Monument \u0026 Heritage Protection Area", "transport": "About a 20-minute drive from Yabuli town center"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | As China\u0027s first professional museum dedicated to skiing, the Yabuli Ski Museum showcases the history of Chinese skiing, various early wooden skis, the evolution of professional ski equipment, and precious documents and commemorative medals from past Winter Games. Visitors can gain a deep understanding of traditional Northeast ice and snow culture, as well as the fascinating journey of how Yabuli transformed into a world-class ski resort.", "name": "Yabuli Ski Museum", "transport": "Take the Yabuli Ski Resort shuttle bus, or take a taxi from Yabuli South Railway Station (approx. 10 minutes)."}, {"address": "No. 1 Jinbang Road, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Known as the \u0027Davos of China\u0027, this magnificent building features a futuristic iceberg exterior. In
