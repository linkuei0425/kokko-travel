side, it houses an Entrepreneurship Museum, large art galleries, and a conference center. The site exhibits modern Chinese business development history alongside manuscripts and core ideas from top entrepreneurs. The building itself is a classic cultural landmark blending contemporary sculptural aesthetics with eco-friendly architectural technology.", "name": "Yabuli China Entrepreneurs Forum Permanent Site", "transport": "About a 5-minute drive from Yabuli South Railway Station, or a 15-minute walk from the core area of the resort."}, {"address": "Around the Ski Resort, Yabuli Forestry Bureau, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A themed exhibition area showcasing the early history of forestry pioneering and forest railways in Northeast China. It displays vintage steam locomotives, wooden carriages, and early railway artifacts, transporting visitors back to the glory days of forest clearing and timber transport. Complete with rich photo walls and realistic scene reconstructions, it exudes a strong sense of industrial nostalgia and cultural charm, making it a popular photo spot.", "name": "Yabuli Forest Steam Locomotive Culture Hall", "transport": "Take the Yabuli Forest Mini-Train to the attraction stop, or drive there."}, {"address": "Inside the Forestry Bureau Area, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | A cultural venue dedicated to displaying traditional life in the snowy forest lands. Through lifelike wax figures, recreated Northeast Kang (heated brick beds), traditional paper-cuts, shadow puppet tools, and farming implements, it authentically reproduces winter chores, Chinese New Year celebrations, and forestry workers\u0027 daily routines. Rich in Guandong folk flavor and rustic cultural charm, it\u0027s perfect for families looking to discover local culture.", "name": "Yabuli Northeast Folk Customs Exhibition Museum", "transport": "Take a public bus or taxi from Yabuli Railway Station (approx. 20 minutes)."}, {"address": "Inside Christmas Village, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Nestled at the foot of Yabuli\u0027s snow-capped mountains, this European-style wooden Christmas chapel exudes a fairy-tale romance. Featuring a spire and vintage clock tower covered in thick winter snow, it looks just like a town church in a Nordic forest. The interior exhibits Christmas history and handcrafted arts, with music parties and blessing events frequently held during the snow season\u2014a romantic landmark for couples and travelers alike.", "name": "Yabuli Christmas Village Chapel", "transport": "Take the dedicated Christmas Village resort shuttle, or take a taxi from the resort center."}, {"address": "Core Scenic Area, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | An indoor/outdoor art gallery featuring works by top Heilongjiang ice and snow sculptors. The gallery displays intricately carved ice architecture, fairy-tale characters, and abstract modern sculptures, complemented by vibrant LED lighting to create a magical world of frozen art. Interactive visual exhibits allow visitors to experience the striking beauty and ultimate aesthetics of snow and ice sculptures year-round.", "name": "Yabuli Snow \u0026 Ice Sculpture Art Hall", "transport": "Located near the Ski Resort Tourist Service Center; easily accessible on foot."}, {"address": "Inside the Yabuli Forestry Bureau Site, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.0 stars | This museum provides an in-depth look at the natural ecology and forestry development of the Zhangguangcai Ridge mountains. It displays plant specimens, taxidermy of local wildlife (such as Siberian tigers and red deer), and ancient logging tools. Combining natural science education with historical artifacts, it highlights the profound transformation of Northeast forests from early logging to modern ecological protection.", "name": "Yabuli Forestry Bureau Museum", "transport": "Take a local bus or taxi from Yabuli town center (approx. 10 minutes)."}, {"address": "Inside Sun Resort, Yabuli Ski Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | A contemporary cultural performance and exhibition space located within the Sun Resort. It regularly hosts ice-and-snow-themed painting exhibits, photography shows, musical concerts, and modern art salons. Featuring sleek contemporary architecture, the center seamlessly blends Yabuli\u0027s mountain scenery with an indoor artistic vibe, offering skiers and art lovers a peaceful haven to appreciate refined art.", "name": "Yabuli Sun Resort Cultural \u0026 Art Center", "transport": "Guests staying at Sun Resort hotels can walk directly, or take the resort shuttle bus."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Inside Yabuli Ski Tourism Resort, Yabuli Town, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.6 stars | Guokui Mountain is one of the core natural landscapes of the Yabuli Ski Resort, consisting of three peaks: Daguokui, Erguokui, and Sanguokui. Beautiful in all four seasons, it is blanketed in snow during winter and offers cool, shade-covered greenery in summer. The summit provides breathtaking panoramic views of the entire forest and snowfield of the Yabuli Resort, making it a sanctuary for outdoor hiking, photography, and snow viewing.", "name": "Guokui Mountain Scenic Area", "transport": "Take a taxi from Yabuli South Railway Station for about 15 minutes to reach the scenic area entrance, or catch a shuttle bus from the resort."}, {"address": "Yabuli Forestry Bureau Operating Area, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.5 stars | Yabuli National Forest Park boasts vast virgin mixed coniferous and broad-leaved forests with an exceptional ecological environment. High forest coverage and rich negative oxygen ions make it a natural forest oxygen bar. Enjoy distinct seasonal beauty: vibrant spring buds, cool summer escapes, colorful autumn leaves across Wuhua Mountain, and vast winter snowscapes. Walking along its forest trails offers ultimate tranquility and natural charm.", "name": "Yabuli National Forest Park", "transport": "Drive directly or take a local bus from Yabuli Town to the forest park entrance."}, {"address": "Near Yabuli Forest Hot Springs, Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.4 stars | Nestled among the natural mountains and forests of the Yabuli Ski Resort, Yabuli Panda House is the northernmost panda house in China. Home to adorable giant pandas, its design blends the natural style of Northeast China\u0027s forest areas with modern conservation facilities. Visitors can watch giant pandas play and munch on bamboo in snowy or lush outdoor enclosures, making it a highly educational and fun destination loved by families.", "name": "Yabuli Panda House", "transport": "Take a resort shuttle bus or taxi to arrive directly."}, {"address": "Sanguokui Scenic Area, Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.3 stars | Sanguokui is one of the main skiing and sightseeing peaks in Yabuli Ski Resort, featuring gentle slopes and pleasant views. Reaching the summit rewards you with panoramic views of the Zhangguancai Ridge, a branch of the Changbai Mountains. In winter, cedar trees draped in rime ice turn the peak into a fairytale wonderland, while summer offers a refreshing retreat for hiking and enjoying lush mountain views.", "name": "Yabuli Sanguokui Peak", "transport": "Take the cable car directly to the observation deck at the peak of Sanguokui."}, {"address": "Inside Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.2 stars | Situated between Daguokui and Sanguokui, Erguokui Mountain is renowned for its undulating terrain and natural woodland scenery. Dense vegetation flourishes on the slopes, and in winter, snow-laden treetops create stunning views of the Northeastern snow plain. Traversed by advanced ski slopes and sightseeing cable cars, it offers elevated vistas of rolling green hills in summer and snow-covered landscapes in winter.", "name": "Yabuli Erguokui Mountain", "transport": "Access via the resort\u0027s sightseeing cable cars or ski lifts."}, {"address": "Daguokui Peak, Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.7 stars | Daguokui Mountain is the highest peak in the Yabuli area at approximately 1,374.8 meters above sea level, featuring a long snow cover period and premium natural snow quality. Home to challenging alpine ski runs and magnificent high-mountain views, its summit boasts magnificent rime landscapes and breathtaking vistas where you can feel on top of the world\u2014a paradise for extreme sports and landscape photography enthusiasts.", "name": "Yabuli Daguokui Mountain", "transport": "Take the dedicated Daguokui alpine cable car (ropeway) to reach the summit."}, {"address": "Inside Windmill Village, Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.1 stars | Blending European-style windmill architecture with natural mountain forest views, the Windmill Village Observation Deck is one of the resort\u0027s classic attractions. Surrounded by rolling hills and lush greenery that transform into a romantic snowy European-style scene in winter, it offers sweeping views where the windmill complex meets the endless forest.", "name": "Yabuli Windmill Village Observation Deck", "transport": "Walk within the resort or take an internal shuttle bus."}, {"address": "Forest area surrounding Yabuli Ski Tourism Resort, Shangzhi City, Harbin City, Heilongjiang Province", "feature": "\u2b50 4.0 stars | Built along the mountain slope, Yabuli Alpine Botanical Garden showcases the rich alpine plant ecology and rare tree species of Zhangguancai Ridge. Featuring winding wooden boardwalks and relaxing pavilions, the garden bursts with colorful blooms and greenery from spring through autumn, while winter reveals the serene beauty of snow-clad forests. It is an elegant spot to learn about local forest flora and immerse in nature.", "name": "Yabuli Alpine Botanical Garden", "transport": "Drive or charter a private vehicle from the resort to the botanical garden entrance."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Jinpai Avenue, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.8 Stars | Yabuli Sun Mountain Resort is one of China\u0027s largest and most well-equipped ski resorts, making it a top choice for ski enthusiasts visiting Harbin. It features numerous international-standard beginner, intermediate, and advanced trails. The view from the \u0027Daguokuei\u0027 peak is breathtaking, offering a panoramic look over the snow-covered forests and plains. Beautiful in all four seasons, winter provides the ultimate thrill of gliding through powder snow, seamlessly combining stunning photo opportunities with extreme sports.", "name": "Yabuli Sun Mountain Resort Ski Resort", "transport": "Take the high-speed rail from Harbin Railway Station to Yabuli West Station, then transfer to the resort\u0027s free shuttle bus or take a 15-minute taxi ride."}, {"address": "Inside Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | As the northernmost panda house in China, this is home to the beloved giant pandas \u0027You You\u0027 and \u0027Sijia\u0027. The architecture blends seamlessly into the natural snowy landscape. In winter, visitors can catch rare, adorable glimpses of pandas rolling around and playing in the snow, attracting countless influencers and photographers. With highly interactive and educational facilities, it\u0027s a heartwarming, must-visit spot in the Yabuli Resort area.", "name": "Yabuli Panda House", "transport": "Take a sightseeing bus within the resort area, or walk directly from Sun Mountain Resort."}, {"address": "Inside Forest Park, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.5 Stars | This retro and romantic mini forest train chugs through vast virgin forests and snowfields, standing out as one of Yabuli\u0027s most distinctive attractions. As the whistle blows and the steam train moves slowly forward, snow-draped coniferous forests line both sides, making you feel like you\u0027ve stepped onto a magical snow train in a fairytale. Equipped with great heating facilities, passengers can comfortably capture dreamy snowscapes through the windows, making it the ultimate backdrop for vintage and hipster-style photography.", "name": "Yabuli Forest Mini Train", "transport": "It is recommended to purchase a package ticket at the Yabuli Ski Resort Visitor Center and take the shuttle bus to the train\u0027s starting station."}, {"address": "Summit of Mount Sanguokuei, Yabuli Sun Mountain Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.7 Stars | Perched on the peak of Mount Sanguokuei\u2014one of Yabuli\u0027s highest peaks\u2014this observation deck offers stunning aerial views of the entire ski area and the grand forests of the Greater Khingan Range as you ascend via high-altitude ropeway cable car. The summit enjoys cloud-swirling views or crystal-clear skies, featuring breathtaking winter rime and snow-laden trees. Many visitors come here to make wishes and capture striking photos against the majestic snow-capped mountains, making it the premier high point for admiring northern scenery.", "name": "Mount Sanguokuei Observation Deck", "transport": "Take the sightseeing ropeway cable car right next to the Sun Mountain Resort Ski Rental Hall directly to the summit."}, {"address": "Foot of Mount Daguokuei, Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.4 Stars | Renowned as the \u0027World\u0027s First Alpine Toboggan\u0027, this famous stainless-steel alpine slide stretches 2,680 meters long with a drop of hundreds of meters and features 48 twists and turns. Visitors can drive their own toboggan sled, controlling their speed as they zip through the winding forest and snow paths for an exhilarating thrill. Offering both scenic beauty and high entertainment value, it is a favorite photo and action spot for adventure and outdoor enthusiasts.", "name": "World\u0027s Longest Alpine Toboggan", "transport": "Take the shuttle bus from the entrance of Yabuli Tourist Resort to the ropeway station at the start of the toboggan."}, {"address": "Weisha River Bank, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.3 Stars | Combining Northeastern China\u0027s extreme ice and snow with high-mountain geothermal hot springs, this attraction offers a unique \u0027fire and ice\u0027 experience. Outdoor hot spring pools are surrounded by pristine white snow, allowing you to soak while watching falling snow and forest views\u2014making for amazing photo opportunities. Indoors, you\u0027ll find a large water park and various wellness pools, providing a warm and comfortable setting ideal for relaxing muscles after skiing.", "name": "Yabuli Forest Hot Spring Water World", "transport": "About a 10-minute drive from Yabuli West Station. You can book a hot spring hotel shuttle bus or take a taxi."}, {"address": "Core Area of Yabuli Ski Resort, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.2 Stars | Documenting the origins and glorious moments of winter sports in China, this museum exhibits numerous precious winter sports artifacts, Olympic champions\u0027 equipment, and historical photographs. The modern architecture itself incorporates sleek snow-and-ice design elements, showcasing Yabuli\u0027s evolution as the cradle of Chinese skiing. For visitors who appreciate sports culture and historical depth, it\u0027s an educational and culturally rich destination.", "name": "Heilongjiang Ice and Snow Sports Museum", "transport": "Located in the heart of the resort area; easily accessible on foot or by taking the resort\u0027s free shuttle bus."}, {"address": "East Section of Jinpai Avenue, Yabuli Town, Shangzhi City, Harbin, Heilongjiang Province", "feature": "\u2b50 4.6 Stars | As one of Yabuli\u0027s most historic and professionally acclaimed ski resorts, this venue hosted major international events such as the 24th Winter Universiade. It features high-standard trails and professional lift facilities. Iconic trail landmarks and massive snow sculptures draw countless skiing enthusiasts and tourists for photos. Here, you can enjoy top-tier skiing fun while immersing yourself in a strong atmosphere of competitive winter sports.", "name": "Yabuli Sports Commission Ski Resort", "transport": "Within walking distance from Yabuli South Station, or about a 15-minute taxi ride from Yabuli West Station."}], "name": "Popular Photo Spots"}}, "name": "Yabuli Ski Resort"}};
        const cityName = "Harbin";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
