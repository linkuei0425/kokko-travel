ps, then slow-steamed to sticky perfection. Unwrapping the bamboo leaves releases a mouthwatering aroma: the sticky rice is fully infused with rich meat juices, while the melt-in-your-mouth pork belly is savory without being greasy. Served drizzled with signature sweet soy paste, sweet chili sauce, and fresh cilantro, it offers unforgettable layers of savory and sweet flavor.", "name": "1980 Minnan Roasted Meat Zongzi", "transport": "Take Bus 29 or B2 to \u0027Zengcuo\u0027an Station\u0027, then walk into the center of the Cultural and Creative Village."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Xiamen - Huandao Road and Zengcuo\u0027an Cultural and Creative Village"}, "xiamen_zhongshan": {"categories": {"cat_1": {"items": [{"address": "No. 22 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Founded in 1945, this historic institution is Xiamen\u0027s most iconic traditional dessert landmark. The signature peanut soup features peanuts simmered until velvety soft and melt-in-your-mouth tender, bathed in a sweet, rich, and subtly milky broth. Pair it with a hot, fresh fried dough stick (Youtiao) or sweet fried rice cake soaked in the soup\u2014a sublime contrast of chewy and crispy textures that creates an unforgettable classic flavor. Loved by tourists and locals alike for its decadelong craftsmanship and comforting taste.", "name": "Huang Zehe Peanut Soup", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), and walk for about 5 minutes."}, {"address": "No. 69 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | A legendary street vendor operating for decades on Gulangyu\u0027s Longtou Road (now a fixed stall), and the only officially licensed handmade mochi vendor on the island. Each piece is freshly kneaded by hand, wrapping chewy glutinous rice dough around fragrant black sesame powder and crushed peanuts, then rolled in aromatic peanut powder. One bite reveals a chewy, non-sticky texture bursting with rich nutty flavors\u2014perfectly balanced in sweetness. A must-try street treat when exploring Gulangyu.", "name": "Ye\u0027s Mochi", "transport": "Take a ferry from Xiamen Cruise Center Xiagu Wharf to Gulangyu Sanqiutian Wharf, then walk about 10 minutes upon arrival."}, {"address": "No. 353 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A classic establishment standing in the Zhongshan Road commercial area for decades, famous for its generously stuffed Southern Fujian savory rice dumplings (Zongzi). The sticky rice is pre-steamed in a signature braising liquid, then stuffed with pork belly, shiitake mushrooms, chestnuts, dried scallops, and salted egg yolk. Served steaming hot, the rice is soft and savory, soaked with the rendered fat of the pork belly. Drizzle with their house-made sweet chili and peanut sauces for a deliciously rich, savory-sweet flavor profile beloved by locals and travelers.", "name": "1980 Meat Zongzi", "transport": "Take Xiamen Metro Line 1 to \u0027Zhongshan Park Station\u0027 (Exit 3B), and walk for about 8 minutes."}, {"address": "No. 10 Jukou Cross Lane, Jukou Street, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Tucked away in a narrow alley along Jukou Street near Zhongshan Road, this legendary eatery draws food lovers despite its humble setting. Made with fresh local small pearl oysters, sweet potato starch, garlic chives, and eggs, it is pan-fried on a large flat griddle until crispy and golden on the outside, soft and silky inside. The oysters are delightfully sweet with no fishiness, offering a crispy yet chewy texture topped with traditional Southern Fujian sweet chili sauce\u2014a quintessential Xiamen street food experience.", "name": "Lianhuan Oyster Omelet", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), walk along Zhongshan Road into the alley off Jukou Street."}, {"address": "No. 145 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A hugely popular spot on Gulangyu\u0027s Longtou Road known for long lines and fresh, made-to-order Minnan-style rice noodle rolls. The delicate rice sheets are freshly steamed to paper-thin, silky-smooth perfection. Wrapped inside are generous portions of minced pork, diced shiitake mushrooms, and eggs, topped off with a signature savory broth and spicy sauce. Enjoyed piping hot, the slippery rice sheets absorb the rich, savory broth, leaving a memorable savory aftertaste.", "name": "Shen\u0027s Minnan Rice Noodle Rolls", "transport": "Take a ferry to Gulangyu Sanqiutian Wharf, then walk for about 8 minutes along Longtou Road Commercial Street."}, {"address": "Inside Siming South Road Cross Lane, Jukou Street, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | Hidden in an alleyway along Jukou Street, this iconic night-time food spot comes alive every evening. The signature dry noodles feature chewy flat noodles tossed quickly in a flavorful mix of creamy peanut sauce, sweet chili sauce, and sweet bean sauce. Every bite is packed with aromatic nutty goodness. Foodies typically pair it with a bowl of freshly cooked seafood soup featuring sweet, rich broth\u2014a classic late-night snack pairing cherished by Xiamen locals.", "name": "Jukou Dry Noodles", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), and walk about 6 minutes into the alley along Jukou Street."}, {"address": "No. 8 Jukou Street (Entrance of Jukou Street), Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A tiny stall located at the entrance of Jukou Street, offering traditional spring rolls that generations of Xiamen locals grew up eating. Thin, chewy wrappers encase a savory, slow-simmered filling of cabbage, carrots, dried tofu, seaweed, and shredded pork, finished with a sprinkle of crushed peanuts and cilantro. Bite into it for a chewy shell and tender filling, where natural vegetable sweetness mixes with crunchy peanut aroma for a refreshingly light, non-greasy bite.", "name": "A Qing Spring Roll", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), and walk along Zhongshan Road to the entrance of Jukou Street."}, {"address": "No. 54 Quanzhou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A renowned historic fish ball shop on Gulangyu that preserves generations-old handmade techniques. Fresh sea fish fillet is pounded into a fine paste and wrapped around seasoned minced pork. The springy, translucent fish balls burst with savory meat juices upon taking a bite. Served in a clear broth seasoned with chopped celery and white pepper, the delicate flavor combination delivers a mouthwatering taste of traditional Southern Fujian seafood.", "name": "Lin\u0027s Fish Balls", "transport": "Take a ferry to Gulangyu Sanqiutian Wharf, then walk about 12 minutes along Quanzhou Road."}], "name": "Famous Historic Local Shops"}, "cat_2": {"items": [{"address": "No. 15 Zhonghua Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Located on Zhonghua Road in Gulangyu, this garden cafe is converted from a century-old villa. The environment is quiet and elegant, with lush greenery and blooming flowers in the courtyard. It offers exquisite single-origin pour-over coffee, espresso drinks, freshly baked waffles, and British afternoon tea sets. Sitting in this historic garden while enjoying the sunshine and coffee aroma makes it a top choice for tourists and local hipsters looking to relax.", "name": "Chu\u0027s Garden Cafe", "transport": "About a 10-minute walk from Gulangyu Piano Pier"}, {"address": "5th Floor, No. 116 Kaiyuan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Situated near the entrance of the Eighth Market on Kaiyuan Road, this space is renovated from a five-story historical arcade building. The 5th-floor cafe retains vintage patterned tile floors and antique Xiamen furniture, exuding strong nostalgic charm. Beyond rich coffee and cold drinks, its unique highlight is pairing beverages with famous traditional Ah Ji Zai pastries and pineapple cakes from downstairs. The rooftop terrace offers a panoramic view of the bustling Eighth Market and old town, making it a favorite among creative minds.", "name": "Ji Zhi Department Store Cafe (5th Floor)", "transport": "Take the bus to Kaiyuan Road Entrance Station and walk for about 3 minutes"}, {"address": "No. 34 Haitan Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A cultural space combining historic architecture, an independent bookstore, and specialty coffee. Located on Haitan Road in Gulangyu, the building itself is a nearly century-old retro Western mansion. Intertwining the aromas of books and coffee, it offers custom coffee drinks, single-origin pour-overs, and delicate brunch bites. High ceilings and warm lighting invite visitors to settle down, read, and sip, making it the most artistic retreat on Gulangyu.", "name": "Bug Hole Bookstore Cafe", "transport": "About a 12-minute walk from Gulangyu Neicuo\u0027ao Pier"}, {"address": "No. 12-8 Zhenhai Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A highly popular bakery and brunch spot near the Zhongshan Road Commercial Area, famous for freshly baked artisanal bread and rich cheesecakes. Featuring cozy and minimalist decor, signature items like molten cheese tarts, soft European breads, and freshly brewed lattes are must-orders. Custom sandwiches paired with specialty cold brew coffee during brunch hours attract crowds of young locals and tourists alike.", "name": "JUICY Bakery \u0026 Cafe", "transport": "Take Xiamen Metro Line 1 to Zhenhai Road Station (Exit 1) and walk for about 4 minutes"}, {"address": "No. 41 Zhangzhou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A garden villa cafe on Zhangzhou Road in Gulangyu boasting magnificent sea views. The building retains classic red-brick arcades typical of vintage Western-style residences. The open-air terrace offers distant views of Xiamen Island\u0027s skyline and azure waters. Highlights include British double afternoon tea, freshly made waffles, and signature fruit sparkling coffee. Enjoying the ocean breeze with delicious desserts and brunch here makes for an intensely romantic afternoon.", "name": "No. 41 Seaview Villa Cafe", "transport": "About an 8-minute walk from Gulangyu Piano Pier"}, {"address": "No. 20 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | A famous retro tea and coffee house located on Zhongshan Road Pedestrian Street. Designed in an elegant Republican-era socialite style, it serves carefully roasted specialty coffee, fruit teas, and traditional handmade pastries. A popular brunch combo pairs freshly baked mung bean cakes with rich pour-over coffee, seamlessly blending Southern Fujian pastries with modern coffee culture. A must-visit destination for afternoon tea and vintage ambiance.", "name": "Miss Zhao\u0027s Shop \u0026 Cafe", "transport": "Take Xiamen Metro Line 1 to Zhenhai Road Station and walk about 6 minutes to Zhongshan Road Pedestrian Street"}, {"address": "No. 8 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.1 stars | A landmark trendy cafe on Longtou Road in Gulangyu, featuring the founder\u0027s cat \u0027Zhang San Feng\u0027 as its mascot. Embodying a cozy and cheerful European casual vibe, it highlights signature European milk teas, espresso beverages, and freshly baked scones. The walls are filled with cat-themed creative gifts and postcards, making it a classic spot for tourists to take photos and enjoy a slow-paced brunch.", "name": "Zhang San Feng Milk Tea \u0026 Cafe", "transport": "About a 5-minute walk from Gulangyu Piano Pier"}, {"address": "No. 9 Fuxing Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A French garden-style cafe on Fuxing Road in Gulangyu, reminiscent of a scene from Impressionist painter Monet\u0027s garden. Surrounded by flowers and greenery, it serves premium pour-over coffee, French brunch quiches, and handmade souffle pancakes. Creamy coffee paired with crispy-yet-soft pancakes, together with elegant exotic landscaping, makes it extremely popular among couples and close friends\u2014a top-tier stylish cafe for photos on Gulangyu.", "name": "Monet Garden Cafe", "transport": "About a 10-minute walk from Gulangyu Piano Pier"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 261 Xiahe Road, Siming District, Xiamen City", "feature": "\u2b50 4.7 stars | Tang Yan is an iconic restaurant dedicated to recreating traditional Old Xiamen recipes, having attracted numerous celebrities over the years. The signature \u0027Crispy Taro with Stir-fried Chicken\u0027 is crispy on the outside and tender inside, with fluffy taro absorbing the rich chicken juices. The \u0027Golden Crispy Taro Paste\u0027 boasts a delicate, silky texture that is pleasantly sweet without being cloying. Combining ancient Minnan culinary techniques with refined modern presentation, its rich homestyle flavors and cozy, nostalgic decor transport guests to the charming atmosphere of times past.", "name": "Tang Yan - Old Xiamen Private Kitchen (\u5802\u5bb4\u00b7\u8001\u5ec8\u9580\u79c1\u623f\u83dc)", "transport": "Take Metro Line 1 to Zhenhai Road Station, then walk for about 8 minutes after exiting."}, {"address": "3F, Global Coast Building, No. 2 Lujiang Road, Siming District, Xiamen City", "feature": "\u2b50 4.8 stars | Situated right along the oceanfront of Lujiang Road, this restaurant specializes in authentic Minnan countryside dishes and fresh seafood. The classic \u0027Minnan Pan-Fried Crab\u0027 uses plump female roe crabs, slow-seared with sesame oil and ginger slices to yield sweet, firm crab meat and rich, aromatic roe. The \u0027Original Duck Soup\u0027 is sweet, clear, and refreshing. Featuring an elegant, spacious interior with window seats overlooking the night view of Gulangyu, it is ideal for family gatherings or visitors seeking a deep dive into local flavors.", "name": "Linjia Minnan Restaurant (\u81e8\u5bb6\u95a9\u5357\u83dc)", "transport": "Take Metro Line 1 to Zhenhai Road Station (Exit 1), then walk for about 5 minutes."}, {"address": "No. 74 Siming North Road, Siming District, Xiamen City", "feature": "\u2b50 4.6 stars | A modern Minnan private bistro helmed by renowned chef Hei Ming, infusing creative contemporary flair into traditional Xiamen cuisine. The signature \u0027Satay Abalone Rice\u0027 seamlessly blends rich, spicy-sweet satay sauce with chewy fresh abalone, coating every grain of rice for incredible texture. The \u0027Black Truffle Pan-Fried Oyster Omelet\u0027 boasts a golden crispy crust and juicy, tender oysters. The ambiance fuses the vintage charm of an old mansion with a stylish modern bar vibe, making it a huge hit among young foodies and connoisseurs.", "name": "Hei Ming Restaurant (\u9ed1\u660e\u9910\u5ef3)", "transport": "Take Metro Line 1 to Zhongshan Park Station, then walk for about 10 minutes."}, {"address": "7F, Lujiang Hotel, No. 54 Lujiang Road, Siming District, Xiamen City", "feature": "\u2b50 4.6 stars | One of Xiamen\u0027s most historic oceanfront view restaurants, located on the top floor of the time-honored Lujiang Hotel. Here, you can savor traditional Minnan snacks and exquisite Cantonese dim sum\u2014such as crispy, savory \u0027Shrimp Cakes\u0027 and smooth, sweet \u0027Misua Soup\u0027\u2014while taking in panoramic views of Gulangyu and sunset over the strait. Enjoying authentic local dishes with fine wine while admiring the uniquely romantic harbor night lights makes for an unforgettable experience.", "name": "Lujiang Hotel Harbour View Restaurant (\u9dfa\u6c5f\u8cd3\u9928\u89c0\u666f\u9910\u5ef3)", "transport": "Take Metro Line 1 to Zhenhai Road Station (Exit 1), then walk for about 6 minutes."}, {"address": "No. 167 Siming North Road, Siming District, Xiamen City", "feature": "\u2b50 4.5 stars | A popular local Taiwanese-style seafood stall hidden near the Zhongshan Road commercial district, bursting with vibrant local life. The signature \u0027Crispy Shredded Taro with Savory Sauce\u0027 offers a crisp, sweet-and-savory bite, while the \u0027Stir-fried Abalone\u0027 and \u0027Salt \u0026 Pepper Mantis Shrimp\u0027 feature exceptionally fresh, bouncy, spicy, and succulent seafood. Affordable and brimming with warm hospitality, enjoying these dishes with an ice-cold beer is the ultimate way to experience Xiamen\u0027s lively night food culture.", "name": "Zui Yi Hao Seafood Restaurant (\u9189\u58f9\u865f\u6d77\u9bae\u5927\u6392\u6a94)", "transport": "Take Metro Line 1 to Zhongshan Park Station, then walk for about 8 minutes."}, {"address": "No. 14 Yongchun Road, Gulangyu, Siming District, Xiamen City", "feature": "\u2b50 4.4 stars | A retro, nostalgic bistro housed in a century-old historic building on Gulangyu Island, carrying forward the heritage of Western trading house dining and Minnan private recipes from the late Qing and early Republican eras. The \u0027Black Cat Steak\u0027 is tender and juicy with a rich, aromatic black pepper sauce, while the \u0027Minnan Seafood Pot\u0027 is loaded with fresh ingredients in a sweet, flavorful broth. Decorated with numerous antique furnishings, its elegant, peaceful setting feels like a step back in time to Gulangyu\u0027s golden age.", "name": "Black Cat Restaurant Gulangyu (\u9f13\u6d6a\u5dbc\u9ed1\u8c93\u9910\u5ef3)", "transport": "After arriving at Gulangyu Piano Wharf, walk for about 12 minutes."}, {"address": "No. 66 Quanzhou Road, Gulangyu, Siming District, Xiamen City", "feature": "\u2b50 4.5 stars | Tucked away in a lush, green alleyway on Gulangyu Island, this Western bistro is converted from a century-old mansion. It serves Western light meals fused with local Minnan seafood alongside craft cocktails. The \u0027Seared Sea Urchin \u0026 Scallops\u0027 is rich and sweet, while the \u0027Red Wine Slow-Braised Beef Brisket\u0027 melts in your mouth. Featuring a verdant courtyard and romantic evening lighting, it is ideal for relaxing over a crafted drink and exquisite local dishes after a peaceful stroll on the island.", "name": "1921 Bistro Gulangyu (\u9f13\u6d6a\u5dbc1921\u9910\u9152\u9928)", "transport": "After arriving at Gulangyu Sanqiutian Wharf, walk for about 15 minutes."}, {"address": "No. 127 Zhongshan Road, Siming District, Xiamen City", "feature": "\u2b50 4.5 stars | Located in the heart of Zhongshan Road Pedestrian Street, this restaurant is themed after Teresa Teng\u0027s classic song \u0027Story of Small Town\u0027, creating a rich, nostalgic Minnan vibe. A must-order is the \u0027Xiamen Tong\u0027an Fengrou\u0027 (Braised Pork), cooked until melt-in-your-mouth tender without being greasy, paired with a rich, savory sauce perfect for pouring over rice; the \u0027Minnan Seafood Satay Pot\u0027 offers a rich, spicy broth packed with seafood that absorbs all the flavor. Friendly service and charming antique-style surroundings draw countless tourists to visit.", "name": "Story of Small Town Minnan Cuisine (\u5c0f\u57ce\u6545\u4e8b\u95a9\u5357\u83dc)", "transport": "Take Metro Line 1 to Zhenhai Road Station, then walk for about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Nanputuo Temple, No. 515 Siming South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | A legendary century-old temple vegetarian institution that seamlessly blends traditional Southern Fujian flavors with Zen philosophy. The must-order dish \u0027Treasures Hidden in Taro Paste\u0027 is rich, smooth, and velvety, wrapping fragrant taro around a variety of savory mushrooms for incredible depth of flavor. \u0027Half Moon Sunken in the River\u0027 features seasonal rare mushrooms and wheat gluten slow-simmered to perfection, creating a sweet, clean broth with subtle Angelica notes. Tourists and local foodies alike are captivated by its exquisitely crafted dishes and serene, elegant atmosphere.", "name": "Nanputuo Vegetarian Restaurant", "transport": "Take Xiamen Bus No. 1, 21, or 45 to \u0027Xiamen University (Nanputuo) Station\u0027, then walk about 3 minutes."}, {"address": "No. 22 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Founded in 1945, this iconic historic dessert shop serves Xiamen\u0027s most famous vegan street treat\u2014peanut soup. Peanuts are slow-cooked for hours until silky soft and tender enough to melt in your mouth, served in a piping hot, perfectly sweet, aromatic broth. Pair it with crispy fried dough sticks (Youtiao) or deep-fried sticky rice balls for a sublime contrast of crispy outside and soft inside. A non-negotiable classic when visiting Zhongshan Road.", "name": "Huang Zehe Peanut Soup", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), and walk about 5 minutes along Zhongshan Road."}, {"address": "No. 141 Dazhong Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Tucked inside a retro 5-story historic building, this century-old bakery is famous for its vegan-friendly pastries, freshly baked daily. The \u0027Water Chestnut Pastry\u0027 and \u0027Mung Bean Pastry\u0027 are crowd favorites\u2014featuring flaky, multi-layered crusts and smooth, perfectly sweetened fillings bursting with sesame and bean aromas. Decorated with nostalgic vintage tiles and an artistic vibe, it\u0027s the premier destination to taste authentic Southern Fujian treats and pick up souvenir gifts.", "name": "Ajizai Vegetarian Pastries (Jizhi Store)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027, and walk about 8 minutes to Dazhong Road."}, {"address": "No. 261 Xiahe Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Highly acclaimed locally for its incredible value, this vegan buffet offers dozens of meat- and egg-free fresh vegetable dishes alongside traditional Southern Fujian street snacks. Their classic \u0027Vegetarian Satay Noodles\u0027 features a rich, savory broth infused with peanut and coconut notes, paired with bouncy tofu strips and veggie balls soaked in flavor. Freshly steamed vegetarian dumplings and light side dishes keep things crisp and non-greasy. Its affordable prices and massive variety make it a favorite among local workers and plant-based travelers.", "name": "Sumanxiang Vegetarian Buffet", "transport": "Take Xiamen BRT Line 1 to \u0027Kaihe Road Station\u0027, then walk about 3 minutes."}, {"address": "Stall in front of No. 145 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | The only legally licensed street vendor stall on Gulangyu Island, offering a century-old handmade vegan street food recipe. Handmade fresh to order, chewy sticky rice dough is wrapped around fragrant roasted black sesame and crushed peanuts, then rolled in aromatic peanut powder. Soft and pillowy without sticking to your teeth, every bite delivers a heavenly burst of nutty sweetness. A must-try street treat to stroll with on Gulangyu.", "name": "Gulangyu Ye\u0027s Mochi", "transport": "After arriving at Gulangyu Piano Wharf, walk about 8 minutes along Longtou Road Commercial Street to spot the queueing stall."}, {"address": "No. 172 Hexiang West Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | A cozy, homey vegetarian restaurant near Zhongshan Road shopping district, specializing in light, healthy plant-based meals prepared with low oil and salt. The signature \u0027Sizzling Vegetarian Beef\u0027 uses high-quality Lion\u0027s Mane mushrooms to recreate a juicy, firm texture tossed in aromatic black pepper sauce. The \u0027Three-Cup King Oyster Mushrooms\u0027 offer a savory, savory-sweet flavor perfect with rice. Authentic cooking skills and warm, welcoming service make this a beloved choice for locals and visiting food lovers.", "name": "Miaoxiang Vegetarian Restaurant", "transport": "Take Xiamen Metro Line 1 to \u0027Wenzao Station\u0027, and walk about 10 minutes along Hexiang West Road."}, {"address": "No. 108 Siming North Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A stylish restaurant focused on creative organic vegetarian cuisine, blending classic Southern Fujian culinary elements into modern plant-based dining. The popular \u0027Vegetarian Buddha Jumps Over the Wall\u0027 is slow-simmered for hours with rare mushrooms and Chinese yam, resulting in a rich, flavorful broth with tender ingredients. The \u0027Jade Tofu\u0027 is fresh, silky, and delightfully smooth. Exquisite food presentation and a light, healthy philosophy make it a hit among young locals and wellness-minded travelers.", "name": "Cisu Vegetarian Restaurant", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027, and walk about 6 minutes along Siming North Road."}, {"address": "No. 413 Neicuo\u0027ao Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alley on Gulangyu Island, this decades-old bakery is famous for its traditional, 100% vegan pastries crafted without animal fats. Their iconic \u0027Coconut Tart\u0027 features a buttery, crisp crust filled with chewy, fragrant shredded coconut that is sweetly satisfying without being overwhelming. The \u0027Vegetarian Mung Bean Cake\u0027 melts effortlessly in your mouth with rich bean flavors. Unchanging quality craftsmanship and reasonable prices make these a must-buy nostalgic souvenir before leaving the island.", "name": "Gulangyu Jinlan Bakery", "transport": "After arriving at Gulangyu Neicuo\u0027ao Wharf, walk about 6 minutes along Neicuo\u0027ao Road."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 8 Jukou Street, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Tucked away in the narrow alleyways of Jukou Street, this decades-old shop is a classic street food staple locals grew up with. The runbing (spring roll) wrappers are thin yet delightfully chewy, wrapped around deeply seasoned braised cabbage, carrots, dried tofu, seaweed, and crispy pork lard residue, finished with a generous sprinkle of powdered peanut sugar. The first bite offers a soft, chewy skin followed by the sweetness of vegetables and rich peanut powder\u2014a perfect balance of sweet and savory with crisp, non-greasy textures loved by tourists and local foodies alike.", "name": "A Qing Spring Roll (\u963f\u537f\u6625\u5377)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), then walk for about 8 minutes."}, {"address": "No. 41 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | A legendary century-old handmade mochi stall on Gulangyu Island, insistently made fresh to order. The pure handmade glutinous rice dough is stuffed with fragrant crushed peanuts and black sesame filling, then rolled in a layer of black sesame powder on the outside. Soft, chewy, and dense without sticking to your teeth, the crunchy peanuts and rich sesame flavor burst in your mouth. Perfectly sweetened, it is an indispensable walking dessert while strolling Gulangyu.", "name": "Ye\u0027s Mochi (\u8449\u6c0f\u9ebb\u7cec)", "transport": "After exiting Gulangyu Piano Pier, walk along Longtou Road Commercial Street for about 10 minutes."}, {"address": "No. 10 Jukou Cross Lane, Jukou Street, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A legendary food stall hidden deep in a narrow lane off Jukou Street near Zhongshan Road, renowned for its master-level pan-frying technique. Made with fresh, plump local Pearl Oysters mixed with sweet potato starch batter, green garlic, and eggs, fried on a large flat iron griddle until golden and crisp. Crispy on the outside and tender inside, the fresh oysters burst with juice with zero fishiness. Paired with the store\u0027s signature Southern Fujian sweet and spicy sauce, the sweet, sour, and mild heat elevate the seafood\u0027s natural sweetness\u2014a must-try queue-worthy local delicacy on Zhongshan Road.", "name": "Lianhuan Oyster Omelet (\u84ee\u6b61\u6d77\u86b5\u714e)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027, walk to the entrance of Jukou Street on Zhongshan Road, and turn into the side alley."}, {"address": "No. 22 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | A landmark heritage shop on Zhongshan Road open for over half a century, capturing the town\u0027s heart with its signature peanut soup. Premium peanuts are slow-simmered for hours until the whole kernels achieve an astonishing \u0027melt-in-your-mouth\u0027 tenderness. The milky-white soup is rich, sweet, and velvety smooth. Enjoy it alongside freshly fried Youtiao (crullers) or sweet dates by dipping the crispy cruller into hot peanut soup\u2014a sublime blend of crispiness and creaminess that represents the ultimate Xiamen traditional breakfast or afternoon tea experience.", "name": "Huang Ze He Peanut Soup (\u9ec3\u5247\u548c\u82b1\u751f\u6e6f\u5e97)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 (Exit 1), then walk along Zhongshan Road for about 5 minutes."}, {"address": "No. 145 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | One of the most popular street food stalls on Gulangyu\u0027s Longtou Road, bustling with long lines every day. Unlike Cantonese rice noodle rolls, the Minnan version steams rice batter together with beaten eggs, minced pork, and shiitake mushrooms, then smothers it in secret house soy sauce and custom chili sauce. The steamed rice rolls are silky smooth, absorbing the rich, garlicky, meaty broth. Served piping hot, each bite is velvety, savory, and incredibly refreshing, making customers instant fans.", "name": "Shen\u0027s Minnan Rice Noodles (\u6c88\u5bb6\u95a9\u5357\u8178\u7c89)", "transport": "After disembarking at Gulangyu Sanqiutian Pier, walk towards Longtou Road for about 12 minutes."}, {"address": "No. 1-2 Jukou Street, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | An insanely popular meat skewer stall in the Zhongshan Road commercial district, enticeable from afar by its rich fried aroma. Using fresh pork tenderloin marinated in a proprietary sauce and fried to order, it\u0027s scooped up as soon as the exterior turns light crispy and dusted with cumin and chili powder. Extremely tender and juicy without a hint of dryness, every bite blends savory meat with spicy aromatic seasonings. Highly addictive, drawing endless tourists munching away as they stroll.", "name": "Haoxiang Skewered Pork Tenderloin (\u8c6a\u9999\u91cc\u810a\u8089\u4e32)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 and walk to the intersection of Zhongshan Road and Jukou Street."}, {"address": "No. 353 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A classic Minnan meat zongzi shop passed down for decades, renowned for its hearty portions and rich fillings. Wrapped inside glutinous rice is well-marinated pork belly, shiitake mushrooms, chestnuts, dried scallops, and salted egg yolk. The glutinous rice absorbs the fragrance of bamboo leaves and savory meat juices, giving it a soft, chewy texture that isn\u0027t overly mushy. Drizzle with the stall\u0027s signature sweet-spicy sauce, rich peanut sauce, and a sprinkle of cilantro for an authentically rich, savory, and uniquely delicious Minnan traditional flavor.", "name": "1980 Minnan Meat Zongzi (1980\u71d2\u8089\u7cbd)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhongshan Park Station\u0027 (Exit 3), then walk along Zhongshan Road for about 6 minutes."}, {"address": "No. 54 Quanzhou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A famous old fish ball shop on Gulangyu Island that carries the culinary memories of many islanders. Hand-pounded from fresh shark meat, the outer shell is snowy white, bouncy, and elastic, packed with a savory filling of seasoned minced pork and shiitake mushrooms. Biting into it releases a burst of delicious meat juices, complemented by a clear broth flavored with chopped celery and white pepper. Rich in layers and refreshing, it\u0027s the best comfort food for warming your stomach while exploring Gulangyu.", "name": "Lin\u0027s Fish Balls (\u6797\u6c0f\u9b5a\u4e38)", "transport": "From Gulangyu Longtou Road Commercial Street, turn onto Quanzhou Road and walk for about 5 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Xiamen - Zhongshan Road Shopping District and Gulangyu Island"}, "zhangzhou_tulou": {"categories": {"cat_1": {"items": [{"address": "No. 163 Xianggang Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | The most iconic time-honored Lu Mian (braised noodles) shop in Zhangzhou Ancient City. Rich, velvety broth coats chewy alkaline noodles, topped generously with Five-Spice pork rolls, crispy fried meat, pork intestines, and braised eggs. The noodles absorb the savory broth, offering a silky texture packed with bursts of aromatic pepper and garlic\u2014a nostalgic comfort food for locals and a top choice for travelers.", "name": "\u963f\u82ac\u6ef7\u9eb5 (A Fen Lu Mian)", "transport": "Take Zhangzhou Bus Route 4 or 11 to \u0027Taiwan Lukou Station\u0027, then walk about 5 minutes to Xianggang Road in the Ancient City."}, {"address": "No. 295 Xinhua West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A hugely popular, multi-generational legendary shop famous for traditional-style oyster omelets. Made with plump, fresh rock oysters, sweet potato starch batter, and green garlic, it features a golden, ultra-crispy crust with a tender, juicy interior. Every bite offers a satisfying crunch paired with sweet seafood flavors and a signature sweet-and-sour sauce, highly praised by both locals and visitors.", "name": "\u5efa\u570b\u86b5\u4ed4\u714e (Jian Guo Oyster Omelet)", "transport": "Take Bus Route 14 or 26 to \u0027Xinhua West Road Station\u0027, then walk about 3 minutes."}, {"address": "No. 290 Beijing Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A celebrated institution serving a noodle dish unique to Zhangzhou. Hand-grabbed noodles are cooked, pressed into circular cakes, sliced, slathered with signature sauces, and rolled up to enjoy. The tight, elastic noodle patty is expertly layered with rich peanut sauce, sweet chili sauce, minced garlic, and aromatic spices. Paired with a freshly fried, crispy Five-Spice roll, it makes the ultimate delicious combo.", "name": "\u5b6b\u6c0f\u624b\u6293\u9eb5 (Sun\u0027s Hand-grabbed Noodles)", "transport": "Take Bus Route B1 or 17 to \u0027Jiulong Park West Gate Station\u0027, then walk to Beijing Road."}, {"address": "Next to the Confucian Temple, Xiuwen West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A legendary food stall located next to the ancient city\u0027s Confucian Temple. These triangle pancakes feature a golden, crispy crust similar to thin crackers, packed with delicious fillings like taro paste, red bean, minced pork, or fresh vegetables. Served piping hot, savory options are richly juicy while sweet ones are delightfully creamy\u2014an essential street snack for your ancient city stroll.", "name": "\u5b54\u5edf\u4e09\u89d2\u9905 (Confucian Temple Triangle Pancake)", "transport": "Take Bus Route 5 or 18 to \u0027Zhangzhou Confucian Temple Station\u0027, then walk about 2 minutes."}, {"address": "No. 172 Xinhua West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A time-honored local eatery showcasing Zhangzhou\u0027s distinctive savory tofu pudding. Silky-smooth tofu curd is paired with springy glass noodles, smothered in hot savory braising sauce and minced pork. The soy freshness contrasts deliciously with chewy noodles and rich gravy, offering a marvelous depth of traditional street flavor.", "name": "\u963f\u541b\u8c46\u82b1\u7c89 (A Jun Douhua Fen)", "transport": "Take Bus Route 2 or 11 to \u0027Zhongshan Park Station\u0027, then walk about 4 minutes."}, {"address": "No. 18 Xibian Road, Taxia Village, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | A rustic Hakka establishment located in Taxia Village among the Nanjing Tulou. Famous for authentic Hakka salted chicken and bamboo shoot free-range chicken soup made from locally raised mountain chickens, offering crispy skin and savory tender meat. Complemented by fresh local river fish and Hakka taro dumplings, it delivers pure mountain flavors in a historical earthen-building setting.", "name": "\u5854\u4e0b\u6751\u8001\u5ba2\u5bb6\u83dc\u9928 (Ta Xia Village Old Hakka Restaurant)", "transport": "From the Nanjing Tulou Visitor Center, take the scenic shuttle bus to \u0027Taxia Village Station\u0027, then walk along the stream for about 3 minutes."}, {"address": "Below the Viewpoint, Tianluokeng Village, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | An authentic traditional Hakka eatery situated right next to the iconic \u0027Four Dishes and One Soup\u0027 Tulou cluster. Classic menu items include braised pork belly with preserved mustard greens (Meicai Kourou) and sweet plum ribs\u2014melt-in-your-mouth pork infused with savory sweet flavor. Paired with Hakka savory rice steamed in bamboo tubes, it\u0027s an unmissable feast when visiting the Tulou.", "name": "\u7530\u87ba\u5751\u5ba2\u5bb6\u571f\u6a13\u98ef\u838a (Tianluokeng Hakka Tulou Restaurant)", "transport": "Take the Nanjing Tulou Scenic Sightseeing Bus to \u0027Tianluokeng Scenic Area Station\u0027, then walk about 5 minutes."}, {"address": "No. 292 Beijing Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | A century-old, wildly popular traditional dessert shop in Zhangzhou Ancient City. Si Guo Tang features a shaved ice base packed with agar jelly, grass jelly, chewy sweet potato boba (\u0027A-da-zi\u0027), mung beans, barley, and lotus seeds, finished with special sweet syrup. Refreshing and perfectly balanced, it\u0027s the ultimate traditional cooling dessert to beat the heat.", "name": "\u9054\u8070\u5df7\u56db\u679c\u6e6f (Da Cong Xiang Si Guo Tang)", "transport": "Take Bus Route 14 or 26 to \u0027Xinhua West Road Station\u0027, then walk about 5 minutes to Beijing Road."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "No. 128 Xianggang Road, Zhangzhou Ancient City, Licheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Nestled in a hidden historic residence along the Ming and Qing dynasty streets of Zhangzhou Ancient City, Wushi Coffee seamlessly fuses local Minnan ingredients with specialty coffee. The signature \u0027Zhangzhou Pomelo Americano\u0027 offers a sweet and tart grapefruit-citrus aroma on the first sip, followed by rich nutty and chocolate undertones from deep-roasted coffee beans, creating a wonderfully surprising layered flavor. Another favorite, the \u0027Pianzihuang Herbal Latte,\u0027 incorporates local herbal elements for a velvety smooth texture with subtle floral-herbal notes intertwined with milk. Tourists love sitting under the red-brick courtyard skylight, soaking in the relaxed slow-paced vibe unique to the ancient city.", "name": "Wushi Coffee", "transport": "Take Zhangzhou Bus 4 or 14 to \u0027Zhangzhou Gucheng (Ancient City) Station,\u0027 then walk about 3 minutes to the Xianggang Road historic district."}, {"address": "No. 212 Yan\u0027an South Road, Zhangzhou Ancient City, Licheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Housed in a century-old traditional Minnan mansion, this hipster cafe retains exquisite wooden carvings, beams, and open courtyard views. The cafe highlights pour-over single-origin coffee made from light-medium roasted Ethiopian beans, delivering a bright fruity sweetness with notes of white flowers and tea, finishing smooth and sweet. Paired with freshly baked \u0027Traditional Minnan Taro Paste Waffle\u0027\u2014crispy on the outside, dense and fragrant on the inside\u2014it bursts with taro and milky goodness. It\u2019s one of the ancient city\u2019s most distinctive brunch and dessert combinations, beloved by young travelers and photography enthusiasts alike.", "name": "Yu Hou Ting Quan Coffee", "transport": "Take Bus 25 or B6 to \u0027Yan\u0027an Nan Lu Station,\u0027 get off and walk south for about 200 meters into the ancient city to reach the cafe."}, {"address": "No. 88 Fanghua North Road, Zhangzhou Ancient City, Licheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Located on Fanghua Road in Zhangzhou Ancient City, Floating Life Coffee showcases an aesthetic blend of retro industrial style and traditional Minnan residential charm. Their \u0027All-Day Special Brunch\u0027 comes in very generous portions, featuring pan-seared smoked bacon, velvety American scrambled eggs, freshly toasted French toast, and a fresh local garden salad drizzled with a special passion fruit dressing for a sweet, tangy, and rich flavor profile. Paired with a \u0027Brown Sugar Oat Milk Latte\u0027 topped with silky microfoam, rich nutty aromas and caramelized brown sugar notes melt across your palate\u2014making it an excellent culinary start to your stroll through the old town.", "name": "Floating Life Coffee", "transport": "Take Bus 1 or 8 to \u0027Beijing Lu Kou Station,\u0027 then walk about 5 minutes to Fanghua North Road."}, {"address": "Next to the Big Banyan Tree in Yunshuiyao Ancient Town Scenic Area, Meilin Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | A scenic cafe situated under a thousand-year-old banyan tree in the Yunshuiyao Scenic Area of Nanjing Tulou, offering a quiet and delightful environment. The signature \u0027Ancient Tree Cold Brew\u0027 is low-temperature extracted over 12 hours, yielding an exceptionally smooth taste with lingering notes of dark chocolate and wine, completely devoid of bitterness. The \u0027Hakka Brown Sugar Milk Tea Coffee\u0027 fuses local dark brown sugar with high-quality fresh milk, harmoniously balancing rich dairy creaminess with the bittersweet notes of coffee. Guests can sit beside the pebble stream, listen to flowing water and singing birds, sample aromatic coffee and fresh green glutinous rice balls (Qingtuan), and savor an unparalleled slow-paced mountain life.", "name": "Yunshuiyao Banyan Tree Coffee", "transport": "Take the dedicated tourist bus from Zhangzhou Passenger Transport Center to \u0027Yunshuiyao Scenic Area Entrance\u0027, then transfer to a scenic shuttle car or walk for 10 minutes to Banyan Tree Plaza."}, {"address": "No. 15 Main Street, Taxia Village Scenic Area, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Tucked away in Taxia Village of Nanjing, known as the \u0027Taiji Water Village\u0027, this cafe flawlessly blends traditional Hakka Tulou culture with modern specialty coffee. The signature \u0027Hakka Lei Cha Latte\u0027 integrates hand-ground pounded tea powder (containing sesame, peanuts, and green tea) into espresso and steamed fresh milk, delivering a mouthfeel packed with rich nutty scents and subtle tea bitterness with a satisfying texture. The accompanying brunch item, \u0027Hakka Savory Bamboo Shoot Quiche\u0027, features a flaky crust filled with the fresh sweetness and savory aroma of local bamboo shoots. Its distinctive flavors attract many travelers exploring Tulou culture to make a special trip here.", "name": "Taxia Village Hakka Coffee", "transport": "Take the Taxia Village dedicated shuttle bus from Nanjing Tulou Visitors Center to \u0027Taxia Village Committee Station\u0027, then walk about 2 minutes to spot the wooden signboard."}, {"address": "No. 36 Zhugao Lane, Zhangzhou Ancient City, Licheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 Stars | Located in Zhugao Lane, one of the most historic alleys in Zhangzhou Ancient City, this carefully restored residence retains its original blue bricks, red tiles, and wooden partition screens. The cafe\u0027s \u0027Basque Burnt Cheesecake\u0027 paired with a \u0027Flat White\u0027 is the go-to brunch treat for foodies. The cheesecake has a velvet-smooth texture with rich dairy aromas and subtle caramelized notes that melt in your mouth, while the Flat White wraps the bittersweet espresso in fine microfoam. Quiet and elegant, steeped in authentic Minnan heritage, it\u2019s a wonderful hideaway to escape the hustle and bustle, read peacefully, and savor fine coffee.", "name": "Zhugao Lane Old House Coffee", "transport": "Take Bus 17 or 23 to \u0027Xiuwen Xi Lu Station,\u0027 then walk through Zhugao Lane for about 300 meters to reach the venue."}, {"address": "No. 299 Xinhua South Road, Licheng District, Zhangzhou City, Fujian Province (near the Xinhua Road entrance of the Ancient City)", "feature": "\u2b50 4.5 Stars | A popular American-style indie brunch spot beloved by youth and travelers alike, located near the border of Zhangzhou Ancient City. The signature \u0027Pulled Pork Croissant Platter\u0027 features spiced pork slow-cooked for 8 hours, served with a freshly baked buttery croissant that is crispy outside and soft inside, a sunny-side-up egg, and avocado slices\u2014bursting with savory juices, rich textures, and ultimate satisfaction. Pair it with a freshly made \u0027Passion Fruit Cold Brew Sparkling Coffee\u0027, where fruity acidity and fizz elevate the refreshing notes of the coffee, clearing morning fatigue. It\u2019s the ultimate fuel stop before exploring the ancient city.", "name": "Time Station Coffee \u0026 Brunch", "transport": "Take Bus 3 or 10 to \u0027Xinhua Nan Lu Station,\u0027 and you will see the shop across the street after getting off."}, {"address": "Above the Viewing Deck, Tianluokeng Village, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Set beside the best viewing deck of the famous \u0027Four Dishes and One Soup\u0027 Tianluokeng Tulou Cluster, this unique cafe offers stunning vistas. The \u0027Tulou Cloud Pour-Over Coffee\u0027 uses high-altitude coffee beans featuring elegant citrus acidity and a subtle wine-like complexity, offering a smooth and rounded mouthfeel. Their brunch offering, \u0027West Fujian Brown Sugar Rice Cake with Americano\u0027, features rice cakes grilled to crispy perfection outside and chewy inside, drizzled with rich brown sugar sauce\u2014the sticky sweetness and coffee\u0027s bittersweet aroma beautifully accentuating each other. Overlooking the majestic Tulou architecture while indulging in delicious brunch delivers a magnificent double feast for both eyes and taste buds.", "name": "Tianluokeng Tulou View Coffee", "transport": "Take the scenic tourist shuttle bus from Nanjing Tulou Visitors Center to \u0027Tianluokeng Viewing Deck Station\u0027, and you\u0027ll see the cafe right next to the observation deck."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 18 Hongkong Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Located in the heart of the ancient city, this landmark restaurant offers an authentic fusion of Minnan home-cooked dishes and local snacks. Renowned for freshly caught seafood and ancient slow-stewing methods, the must-order blanched seafood soup is incredibly sweet and fresh. The mini oyster omelets are crispy on the outside, tender on the inside, featuring plump, juicy oysters paired with a special sweet and spicy sauce that leaves an unforgettable aftertaste. The antique ambiance is rich in traditional red-brick mansion charm, making it a favorite among foodies and tourists alike.", "name": "Zhang Gang Wei \u00b7 Minnan Local Cuisine", "transport": "Take a bus to \u0027Zhangzhou Ancient City Stop\u0027 or \u0027Second Hospital Stop\u0027 and walk for about 5 minutes."}, {"address": "Under the Banyan Tree, Yunshuiyao Ancient Town Scenic Area, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Situated beside the century-old banyan trees and picturesque stream of Yunshuiyao, this restaurant specializes in authentic Nanjing Hakka delicacies and country-style cooking. The signature free-range chicken pot features local free-range chicken simmered slowly with Chinese herbs, resulting in a rich, sweet broth and tender yet chewy meat. Other highlights include stir-fried high-mountain wild vegetables and Hakka stuffed tofu with a golden crust and savory, soft filling. Dining by the stream allows you to fully immerse yourself in the relaxed tranquility of the ancient town.", "name": "Yunshuiyao \u00b7 Tulou Family Hakka Restaurant", "transport": "Take Bus Nanjing Route 6 from Nanjing High-speed Railway Station to \u0027Yunshuiyao Tourist Center\u0027, then transfer to the scenic area shuttle bus or walk."}, {"address": "No. 56 Shixing North Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | Tucked away in a quiet alley of the ancient city, this unique restaurant seamlessly combines traditional Minnan cuisine with modern, sophisticated presentation. Highly recommended are the handmade red yeast pork ribs, which boast a crispy, flavorful exterior and succulent, non-greasy meat, as well as the signature ginger duck, infused deeply with aromatic sesame oil and old ginger, featuring tender, flavorful meat. The courtyard setting of an old residence lets guests savor high-quality local delicacies in a charmingly antique atmosphere.", "name": "Impression Minnan \u00b7 Ancient City Private Kitchen", "transport": "Take a bus to \u0027People\u0027s Square Stop\u0027 or \u0027Zhongshan Park Stop\u0027 and walk for about 8 minutes."}, {"address": "No. 22 Yanxi Road, Taxia Village Scenic Area, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Located along the riverbank in Taxia Village, known for its Tai Chi water town layout, this is a charming Hakka bistro. The house-made Hakka rice wine is smooth and sweet, perfectly paired with signature braised pork with dried bamboo shoots\u2014where the bamboo shoots absorb rich savory juices for an appetizing kick, and the pork belly melts in your mouth without being greasy. Sitting at the outdoor tables at night, sipping authentic local wine, enjoying Hakka stir-fries, and admiring the night view of Tulou illuminated by red lanterns along the river is a truly poetic experience.", "name": "Taxia Village \u00b7 Alpine Water Town Hakka Bistro", "transport": "Take a shuttle bus toward Taxia Village from Nanjing Bus Station, or hire a private car from Yunshuiyao (approx. a 20-minute drive)."}, {"address": "No. 102 Taiwan Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Located on vibrant Taiwan Road in the ancient city, this classic time-honored eatery has been a local favorite for generations. Here, you can savor authentic Zhangzhou braised noodles and Five-Spice Pork Rolls (Wuxiang Juan). The braised noodle broth is rich and delicious with generous ingredients, while the five-spice rolls feature bean curd skin stuffed with pork and water chestnuts, fried to a golden crisp that crackles with every bite. With warm, friendly service and reasonable prices, it allows diners to satisfy their cravings for various Minnan snacks all at once.", "name": "Old Neighbors \u00b7 Minnan Flavor Restaurant", "transport": "Take a bus to \u0027Weizhenge Stop\u0027 and walk for about 6 minutes to reach Taiwan Road in Zhangzhou Ancient City."}, {"address": "Below the Viewpoint of Tianluokeng Tulou Cluster, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Located adjacent to the famous \u0027Four Dishes and One Soup\u0027 Tianluokeng Tulou Cluster, this bistro is renowned for its traditional wood-fired, slow-simmered Hakka chicken pot. Premium mountain free-range chickens and local wild shiitake mushrooms are carefully selected to produce a clear, sweet soup with a delicate wood-fired aroma. The local river fish is another specialty\u2014delicate, tender, and devoid of any fishy taste, making it delightfully flavorful when simply steamed. The restaurant preserves the traditional architectural structure of Hakka Earth Buildings, offering a truly unique cultural dining experience.", "name": "Tianluokeng \u00b7 Grandma\u0027s Hakka Chicken Pot Bistro", "transport": "Take the Scenic Area Line A Special Bus from Nanjing Tourist Center directly to \u0027Tianluokeng Stop\u0027."}, {"address": "No. 28 Fanghua Cross Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | Converting a historic Ming-Qing dynasty building into a moody, atmospheric bistro, this spot is a top choice for evening gatherings among young travelers and locals alike. The bar offers craft peach beers and custom Hakka yellow wine cocktails, while the menu features a fusion of Minnan skewers and delicate small bites, such as salt-grilled sea prawns and signature spicy beef skewers\u2014crispy on the outside, tender on the inside, and delightfully zesty. The vintage wooden pavilion combined with soft lighting and light music provides a relaxing and comfortably tipsy experience.", "name": "Ancient City Time \u00b7 Tipsy Bistro", "transport": "Take a bus to \u0027Zhangzhou Ancient City Stop\u0027 and walk about 3 minutes from the Fanghua Cross Road entrance."}, {"address": "Next to Yuchang House, Xiaban Village, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Located next to the historic Yuchang House (famous for its leaning pillars), this restaurant specializes in authentic Hakka farm-style cooking. The house-brewed green plum wine is sweet, sour, and refreshing, pairing perfectly with signature Hakka stir-fry (stir-fried dried tofu, squid, and pork belly), which is savory, flavorful, and great with rice. Another highlight is the fresh mountain bamboo shoot pot, featuring a crisp and sweet texture. The friendly owners eagerly share the century-old history of the Tulou, allowing guests to experience warm Hakka hospitality.", "name": "Yuchang House \u00b7 \u0027Leaning Tower\u0027 Hakka Restaurant", "transport": "Take the Scenic Area Line B Special Bus to \u0027Yuchang House Stop\u0027 and walk for about 2 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Nanshan Temple, No. 88 Nanshan Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Located inside the thousand-year-old Nanshan Temple, this is Zhangzhou\u0027s most iconic Zen vegetarian dining spot. Signature items include vegetarian braised noodles and vegetarian ribs, cooked with high-quality soy products and fresh mushrooms. The springy noodles absorb the rich mushroom broth, while the vegetarian ribs are crispy outside, tender inside, and full of layered texture. Delicately flavored yet savory, it is beloved by both local devotees and visiting tourists.", "name": "Nanshan Temple Vegetarian Restaurant", "transport": "Take Zhangzhou Bus Route 4 or 11 to \u0027Nanshan Si\u0027 (Nanshan Temple) Station, then walk for about 3 minutes."}, {"address": "No. 168 Yanan South Road, Xiangcheng District, Zhangzhou City, Fujian Province (Inside Zhangzhou Ancient City)", "feature": "\u2b50 4.3 stars | An affordable vegetarian buffet located in the heart of the Ancient City, offering dozens of traditional Minnan-style vegetarian dishes. Highlights include handmade vegetarian taro cakes and fried rice with mushrooms and bamboo shoots. The taro cake features a pan-fried crispy skin with a dense, soft interior. High value and healthy, oil-light cooking methods make it a favorite for both residents and visitors.", "name": "Zhangzhou Ancient City Yanan South Road Vegetarian Buffet", "transport": "Take Zhangzhou Bus Route 17 or 23 to \u0027Zhangzhou Gucheng\u0027 (Zhangzhou Ancient City) Station, then walk into Yanan South Road inside the Ancient City."}, {"address": "No. 210 Qingnian Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | A time-honored vegetarian restaurant near the Ancient City, specializing in medicinal herbal vegetarian soups and traditional fried noodles. The herbal soup base is slow-simmered with over a dozen Chinese medicinal herbs and red dates, resulting in a sweet and soothing flavor. The fried noodles feature rich \u0027wok hei\u0027 (breath of the wok) and absorb all the tasty sauce. Simple, homestyle flavors make this a nostalgic comfort food for locals.", "name": "Dazhong Vegetarian Restaurant", "transport": "Take Zhangzhou Bus Route 1 or 8 to \u0027Qingnian Lu\u0027 Station, then walk for about 5 minutes."}, {"address": "Commercial Street next to the Visitor Center, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Located near the entrance of the Nanjing Tulou scenic area, specializing in Hakka-style vegan taro dumplings (Yuzi Bao) and stir-fried high-mountain bamboo shoots. The dumpling wrapper is made from a blend of taro and sweet potato starch, offering a chewy and sticky texture filled with diced mushrooms and bamboo shoots. The crisp, refreshing high-mountain bamboo shoots are a must-try local delicacy before exploring the Tulou.", "name": "Shuyang Town Traditional Vegetarian Snack Stall (Nanjing Tulou)", "transport": "Take the \u0027Zhangzhou to Nanjing Tulou\u0027 tourist express bus from downtown Zhangzhou to Shuyang Visitor Center, then walk a short distance."}, {"address": "Commercial Plaza, No. 288 Xinhua West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A premium vegetarian restaurant combining modern creativity with health philosophies, decorated in a minimalist Zen style. Popular dishes like truffle wild mushroom risotto and mock abalone are presented exquisitely. The risotto is infused with rich mushroom aromas and distinct rice grains. Free from artificial additives, it offers a feast for both the eyes and palate, making it very popular among younger diners.", "name": "Jingxin Vegetarian Restaurant", "transport": "Take Zhangzhou Bus Route 3 or 10 to \u0027Xinhua Xi Lu\u0027 Station, then walk for about 4 minutes."}, {"address": "No. 89 Xianggang Road, Xiangcheng District, Zhangzhou City, Fujian Province (Zhangzhou Ancient City Historic District)", "feature": "\u2b50 4.4 stars | Located in the historic street district of the Ancient City, famous for traditional handmade vegetarian snacks and Minnan-style vegetarian popiah (spring rolls). The freshly made spring roll wrappers are paper-thin yet resilient, wrapped around cabbage, carrots, dried tofu, and crunchy ground peanuts. Every bite bursts with fresh vegetable sweetness and rich nutty aromas, making it the perfect walk-and-eat snack.", "name": "Cixin Vegetarian Handmade Workshop", "transport": "Take Zhangzhou Bus Route 14 or 26 to \u0027Taiwan Lu Kou\u0027 Station, then walk into Xianggang Road in the Ancient City area."}, {"address": "Inside Guanyang Village, Yunshuiyao Ancient Town Scenic Area, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Situated in the Yunshuiyao Ancient Town scenic area, focusing on high-mountain organic vegetables freshly picked daily and natural soy products. The signature steamed organic cabbage is sweet, juicy, and crisp, while the wild mushroom tofu pot offers a rich, flavorful broth with silky tofu. Dining here surrounded by ancient banyan trees and historic Tulou buildings provides a delightful idyllic atmosphere.", "name": "Yunsuiyao Ancient Town Hakka Vegetarian Restaurant", "transport": "Transfer to the scenic shuttle bus at Nanjing Tulou Visitor Center to \u0027Yunshuiyao Scenic Area\u0027, then walk to the ancient street of Guanyang Village."}, {"address": "No. 55 Xiuwen West Road, Xiangcheng District, Zhangzhou City, Fujian Province (Inside Zhangzhou Ancient City)", "feature": "\u2b50 4.3 stars | A popular vegetarian noodle shop in the Ancient City, specializing in specialty sesame paste noodles and vegetarian hot and sour noodle soup. The rich, smooth sesame paste thoroughly coats handmade pulled noodles, delivering intense sesame and peanut flavors in every bite. The hot and sour soup features shredded wood ear mushrooms, bamboo shoots, and mushrooms\u2014tangy, appetizing, and comfortably spicy. A fast, delicious vegetarian option while exploring the Ancient City.", "name": "Zhangzhou Ancient City Xiangke Vegetarian Noodle House", "transport": "Take Zhangzhou Bus Route 5 or 22 to \u0027Xiuwen Lu\u0027 Station, then walk into Xiuwen West Road inside the Ancient City."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 193 Xianggang Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A highly iconic legendary snack in Zhangzhou Ancient City. Fresh, plump oysters are mixed with sweet potato starch batter and eggs, then pan-fried to golden, crispy perfection. The edges are aromatic and crispy, while the juicy oysters inside burst with sweetness. Drizzled with a signature sweet chili sauce and fresh cilantro, it offers rich layers of texture with an addictive contrast of crispy outside and tender inside\u2014a highly recommended walk-around delicacy for both tourists and locals.", "name": "Jianguo Oyster Omelet", "transport": "Take Zhangzhou Bus Route 2 or 4 to \u0027Zhangzhou Ancient City\u0027 Station, then walk for about 3 minutes."}, {"address": "No. 310 Qingnian Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A must-try summer refresher when visiting Zhangzhou Ancient City! Authentic Four-Fruit Soup features a sweet rock sugar water base topped with shaved ice and a rich variety of ingredients like jelly, grass jelly, tapioca pearls (\u0027Adazi\u0027), watermelon, and red beans. The bouncy, chewy \u0027Adazi\u0027 paired with crushed ice creates a smooth, sweet, and cool treat that is delightfully refreshing without being overly sweet, loved by tourists and locals alike.", "name": "Dacong Four-Fruit Soup", "transport": "Walk for about 5 minutes from Taiwan Road in Zhangzhou Ancient City."}, {"address": "Yan\u0027an South Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A traditional Southern Fujian retro pastry cooked fresh in large cast-iron pans and sliced right before your eyes. The skin is fried to a golden, lightly charred crunch, while the honeycomb-like interior remains fluffy and chewy, filled with crushed peanuts, sesame seeds, and brown sugar. Served piping hot, each fragrant bite bursts with rich sugar aromas. Crispy on the outside, soft inside, and deeply satisfying, it is a classic street dessert cherished by locals since childhood.", "name": "Traditional Mianjianpao Pancake", "transport": "Located inside the core pedestrian street of Zhangzhou Ancient City, about a 4-minute walk from the city entrance."}, {"address": "Stalls around Taigu Bridge, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | A piping hot street snack freshly baked to order, shaped like an adorable triangle with a fragrant, crispy crust rich in egg and flour flavor. The popular taro paste with salted egg yolk filling is subtly sweet, dense, and savory. Enjoying it hot unlocks its rich, layered contrast of crispy exterior and soft interior\u2014the perfect grab-and-go snack while strolling through the ancient city.", "name": "Old Street Triangle Cake", "transport": "Take Bus Route 11 or 29 to \u0027Xinhua West Road\u0027 Station and walk into the ancient city to find it."}, {"address": "No. 167 Zhongxing Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Zhangzhou braised noodles are the ultimate local comfort food. The thick, savory broth is slow-cooked with shiitake mushrooms, dried shrimp, and dried squid, yielding a deeply sweet and rich flavor. Smooth noodles soak up the broth and can be customized with various toppings like crispy fried pork, pork intestines, five-spice pork rolls, and marinated eggs. The crispy pork absorbs the soup to become delightfully semi-crispy, creating an explosion of textures loved by foodies and tourists.", "name": "A-Fen Lu Noodle", "transport": "Walk to the East Gate of Zhangzhou Ancient City; it is about a 3-minute walk."}, {"address": "No. 72 Taiwan Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Handcrafted retro mochi freshly made to order. The sticky rice skin is soft, stretchy, and non-sticky, wrapped around a special crispy filling of crushed egg rolls and peanut sugar powder. Rolled in a fragrant layer of black sesame or peanut powder, the chewy exterior gives way to a satisfying crunch inside with a sound of crispiness. This amazing texture contrast makes it a immensely popular street dessert with long lines.", "name": "Sun\u0027s Handmade Mochi", "transport": "Located in the core area of Taiwan Road in the ancient city, easily accessible on foot."}, {"address": "Commercial Street inside Tianluokeng Tulou Cluster Scenic Area, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | A unique specialty snack in the Nanjing Tulou Scenic Area. Local premium taro is steamed, mashed, and kneaded with sweet potato starch into a chewy dough wrapped around shiitake mushrooms, minced pork, dried shrimp, and diced bamboo shoots. Translucent when steamed, the sticky and chewy outer skin holds a juicy, savory filling bursting with natural taro aroma\u2014an authentic Hakka flavor you shouldn\u0027t miss when visiting Nanjing Tulou.", "name": "Nanjing Tulou Hakka Taro Buns", "transport": "Take the scenic area shuttle bus to Tianluokeng Station, then walk to the Folk Snack Street."}, {"address": "Ancient Plank Road Stalls, Yunshuiyao Scenic Area, Meilin Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Traditional Hakka crispy flatbread baked in charcoal jar ovens. Covered in white sesame seeds, it is baked until golden-crisp with a rich charcoal aroma. Stuffed hot with savory Hakka braised pork with preserved mustard greens, the crunchy, wheat-scented bread pairs perfectly with the rich, non-greasy filling. Savory, crispy, and thoroughly satisfying to chew, it is the ultimate snack while strolling through the Tulou area.", "name": "Nanjing Tulou Baked Crispy Flatbread", "transport": "You will come across several freshly baked flatbread stalls while strolling along the riverside ancient plank road in Yunshuiyao Scenic Area."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Zhangzhou - Zhangzhou Ancient City and Nanjing Tulou Scenic Area"}};
        const themeHex = "#65a30d";
        const cityName = "Fujian";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
