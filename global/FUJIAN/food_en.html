    <script>
        const db = {"fuzhou_sanfang": {"categories": {"cat_1": {"items": [{"address": "No. 106 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | Founded during the Guangxu reign of the Qing Dynasty, Tongli Rouyan is a century-old national treasure brand in Fuzhou. Its soul\u2014the \u0027Yanpi\u0027 (swallow wrapper)\u2014is made from selected lean pork hind leg meat pounded into a paste, blended with sweet potato starch, and meticulously rolled out until paper-thin and silk-tough. When cooked, the wrapper is silky, chewy, and tender, offering a unique meaty fragrance and crisp bite. The filling is juicy and delicious, served in a refreshing broth sprinkled with mint leaves or green onions for a rich, layered flavor. It is a legendary street food walk-and-eat delicacy mandatory for both tourists and locals.", "name": "Tongli Meat Swallow (Tongli Rouyan)", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit C, approx. 5 minutes walk."}, {"address": "No. 89 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.5 stars | Founded in 1934, Yonghe Fish Ball is Fuzhou\u0027s most prestigious traditional fish ball eatery. Premium fresh fish is carefully pounded into fine fish paste wrapped around a savory, rich pork belly filling. Fresh out of the pot, the fish balls are plump, white, and round. Taking a bite reveals a snowy white, bouncy outer skin full of seafood sweetness, while the savory pork juice inside bursts into your mouth in a perfect symphony of flavors. This unique dual texture, paired with heart-warming broth, leaves countless visitors craving more.", "name": "Yonghe Fish Ball", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027, walk along Nanhou Street for approx. 6 minutes."}, {"address": "No. 2 Dongjie, Gulou District, Fuzhou City (near Bayiqi North Road)", "feature": "\u2b50 4.7 stars | Established during the Qing Dynasty in 1865, Juchunyuan is the premier flagship restaurant for Fujian Cuisine and the birthplace of the legendary dish \u0027Buddha Jumps Over the Wall\u0027 (Fotiaoqiang). Showcasing top-tier Min culinary craft, its signature dish features dozens of precious ingredients like abalone, sea cucumber, fish maw, and scallops simmered slowly in traditional wine jars over a gentle flame. The broth is rich, aromatic, and velvety, while the ingredients become tender, deeply seasoned, and complexly layered. Beyond formal feasts, its classic Fujianese and Fuzhou pastries are also exceptional, making it a top choice for deeply experiencing Fuzhou\u0027s food culture.", "name": "Juchunyuan Restaurant", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit A, approx. 2 minutes walk."}, {"address": "No. 39 Jibi Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.3 stars | Founded during the Guangxu period of the Qing Dynasty, Antailou is an iconic heritage restaurant in Fuzhou famous for gathering an array of authentic traditional local snacks. Here, you can sample local specialties all in one stop, including Lychee Pork, taro paste, Dingbianhu (pot-side rice paste soup), and oyster omelets. Their traditional taro paste is especially renowned\u2014drizzled with lard and toasted white sesame seeds, it is velvety, aromatic, sweet, and packed with old-school charm. Retaining a classic Fuzhou teahouse ambience, it serves as the ultimate one-stop hub for travelers exploring local flavors.", "name": "Antailou Restaurant", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit D1, approx. 8 minutes walk."}, {"address": "No. 91 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.2 stars | Mujin Meat Ball is one of Fuzhou\u0027s century-old classic snacks. Surprisingly, its signature \u0027meatball\u0027 is not purely meat, but a steamed creation made from shredded betel nut taro, sweet potato starch, brown sugar, diced pork belly, red dates, and sesame seeds. Once steamed, it turns a translucent amber hue with a delightfully springy and chewy texture. The fragrant taro and sweet notes blend harmoniously with a savory kick and rich sesame oil aroma. This unique, sweet-and-savory combination highlights authentic local Fuzhou character and delivers an unforgettable taste.", "name": "Mujin Meat Ball", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit C, walk along Nanhou Street for approx. 6 minutes."}, {"address": "Guanglu Lane, Gulou District, Fuzhou City (within Three Lanes and Seven Alleys)", "feature": "\u2b50 4.4 stars | Ye\u0027s Peanut Soup is a hidden gem for traditional desserts located in the Three Lanes and Seven Alleys district, specializing in classic Fuzhou sweet soups and pastries. The signature peanut soup uses premium peanuts slow-cooked for hours; the peanuts maintain their shape yet melt instantly in your mouth with an extraordinarily velvety smooth texture. The broth is sweet without being cloying, creamy, and deeply comforting when enjoyed warm. Paired with sweet taro paste or freshly fried Youtiao (dough sticks) for dipping, it offers a sweet glimpse into the relaxed lifestyle of old Fuzhou.", "name": "Ye\u0027s Peanut Soup", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit C, walk to Guanglu Lane in approx. 8 minutes."}, {"address": "No. 81 Shengfu Road, Gulou District, Fuzhou City (near Dongjiekou)", "feature": "\u2b50 4.4 stars | Lao Fuzhou is a beloved authentic restaurant deeply cherished by locals for its commitment to fresh ingredients and traditional Fujian cooking techniques. Its signature \u0027Lychee Pork\u0027 is fried to a golden crisp resembling fresh lychees, coated in a special sweet-and-sour glaze that is crispy outside, tender inside, and irresistibly appetizing. The \u0027Guobianhu\u0027 features a flavorful seafood broth loaded with smooth rice flour ribbons. With a lively atmosphere, extensive menu, and unbeatable value, it\u0027s an unmissable destination to experience local Fuzhou daily life and authentic taste.", "name": "Lao Fuzhou Restaurant", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit D1, approx. 7 minutes walk."}, {"address": "No. 117 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.3 stars | Baibingyuan represents the pinnacle of traditional Fuzhou pastry craftsmanship, preserving centuries of Fujian pastry-making traditions. The most acclaimed items are the traditional Fuzhou \u0027Libing\u0027 (ceremonial pastry) and lard cake. The Libing features a golden, crispy crust filled with candied winter melon strips, peanuts, sesame seeds, and cured pork belly lard, offering a rich sweet-and-savory flavor profile with incredible texture. Grabbing a box as a walking snack or souvenir lets you experience the solid, genuine craftsmanship and nostalgic sentiment of old Fuzhou hand-made pastries.", "name": "Baibingyuan Pastry Shop", "transport": "Metro Line 1 \u0027Dongjiekou Station\u0027 Exit C, walk along Nanhou Street for approx. 5 minutes."}], "name": "Iconic Local Heritage Eateries"}, "cat_2": {"items": [{"address": "No. 89 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | Housed inside a heritage historic residence on Nanhou Street in Sanfang Qixiang, this location seamlessly blends Ming and Qing dynasty carved wooden eaves with a modern industrial coffee style. Tourists love sitting by the second-floor courtyard garden, enjoying an ultra-smooth Reserve Cold Brew paired with a steaming hot Truffle Wild Mushroom Panini\u2014crispy on the outside and soft on the inside. With rich layers of texture and the caramel and citrus aromas of coffee beans lingering on the palate, it\u0027s the top choice for a relaxing brunch in a century-old building.", "name": "Starbucks Reserve (Sanfang Qixiang)", "transport": "About a 5-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}, {"address": "No. 18 Huang Lane, Gulou District, Fuzhou City", "feature": "\u2b50 4.7 stars | Nestled inside Huang Lane, this independent bookstore cafe boasts a wonderful atmosphere created by natural sunlight streaming through the courtyard skylight and walls lined with books. Its signature Osmanthus Latte is a favorite among guests, featuring dense milk foam sprinkled with dried osmanthus flowers that release a rich milky texture and elegant floral aroma. Paired with a freshly baked, lightly salted cheese croissant\u2014boasting a crispy shell and a rich, gooey cheese filling\u2014it is a beloved spot for local hipsters and travelers to spend a lovely morning.", "name": "Lusen Bookstore \u0026 Cafe", "transport": "About an 8-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}, {"address": "No. 61 Jibi Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.5 stars | Blending a minimalist industrial concrete style with the classic white walls and black tiles of Sanfang Qixiang, this cafe delivers a striking visual contrast. Its iconic Fresh Coconut Cold Brew and Concrete Cheesecake are huge hits. The cheesecake features a concrete-gray outer layer that gives way to an insanely smooth, dense, and rich cheese flavor that is sweet without being cloying. Paired with refreshing black coffee infused with natural coconut aroma, it is a must-try brunch and dessert combo for young hipsters and tourists alike.", "name": "M-Stand Coffee (Sanfang Qixiang)", "transport": "About a 6-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}, {"address": "No. 22 Gong Lane, Gulou District, Fuzhou City", "feature": "\u2b50 4.8 stars | Hidden deep in Gong Lane, this minimalist pour-over coffee shop blends rustic brick walls of an old courtyard house with lush green gardens. The house-roasted single-origin pour-over coffee features a beautifully balanced sweet and sour profile with bright berry notes. Their signature Avocado \u0026 Smoked Chicken Eggs Benedict brunch is a highlight: piercing the poached egg coats the savory smoked chicken and velvety avocado in golden yolk, creating an extraordinarily rich and multi-layered taste that attracts many local foodies.", "name": "Alley Coffee", "transport": "About a 7-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}, {"address": "5th Floor, Ocean Department Store, No. 133 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.4 stars | Located inside Sisyphe Bookstore at Ocean Department Store in Dongjiekou, its tranquil and elegant British retro style offers a wonderful environment to relax. The signature American Brunch Platter includes pan-fried German sausages, silky scrambled eggs, fragrant garlic baguette slices, and a fresh sweet salad. The sausages are juicy and savory, perfectly complemented by a smooth, dark-roast Flat White with a pleasantly bitter-sweet finish. It\u0027s a popular sanctuary after shopping or for enjoying a peaceful morning reading session.", "name": "Vector Cafe (Sisyphe Bookstore Dongjiekou)", "transport": "Direct access from Exit D3 of Dongjiekou Station, Metro Line 1"}, {"address": "Dongjiekou Commercial Area, No. 88 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | Located in the heart of the Dongjiekou commercial area, Peet\u0027s is famous for its classic dark-roast coffee and high-quality meals. The must-try Major Dickason\u0027s Dark Roast Latte boasts an intensely rich aroma, silky micro-foam, and a lingering sweet aftertaste. Paired with their selected Australian Wagyu Beef Burger brunch, featuring a juicy, charred beef patty, lightly toasted bun, crisp vegetables, and house sauce, every bite delivers pure bliss\u2014highly praised by business professionals and tourists alike.", "name": "Peet\u0027s Coffee (Dongjiekou)", "transport": "About a 2-minute walk from Exit A of Dongjiekou Station, Metro Line 1"}, {"address": "No. 35 Anmin Lane, Gulou District, Fuzhou City", "feature": "\u2b50 4.7 stars | A creative brunch spot set in a traditional old house that cleverly combines local Fuzhou taro paste with French toast. The signature Taro Paste \u0026 Pork Floss Thick Toast is pan-fried to golden crispy perfection; when sliced open, the warm, rich taro filling pours out\u2014smooth and subtly sweet\u2014balancing marvelously with the savory, crisp pork floss. Paired with a freshly ground Americano featuring nutty aromas, it beautifully reimagines Fuzhou\u0027s morning flavors with a modern twist, winning high praise from visiting tourists.", "name": "Gucuo Morning Brunch \u0026 Coffee", "transport": "About an 8-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}, {"address": "No. 12 Langguan Lane, Gulou District, Fuzhou City", "feature": "\u2b50 4.5 stars | Located near Langguan Lane, this cafe features a tranquil wooden courtyard in a traditional home, making guests feel as if they\u0027ve stepped back in time. The hand-poured Yunnan Arabica coffee offers a clean taste with floral and fruity aromas\u2014smooth and gentle. For brunch, the fresh-baked Wild Meat Sauce Sourdough Rye Bread is highly recommended: the slightly sour, chewy rye bread is topped with rich, mildly spicy meat sauce and melted cheese, making for an aromatic and deeply satisfying meal. It\u0027s a prime hidden gem for enjoying slow living and delicious breakfasts in the historic district.", "name": "Time Impression Cafe", "transport": "About a 6-minute walk from Exit C of Dongjiekou Station, Metro Line 1"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 2 Dongjie, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Founded during the Guangxu reign of the Qing Dynasty, this century-old institution is the birthplace of the iconic Fujian dish \u0027Buddha Jumps Over the Wall\u0027. The decor is elegant and grand, exuding an authentic antique banquet atmosphere. The signature Buddha Jumps Over the Wall features a rich, collagen-packed broth loaded with premium ingredients like sea cucumber, abalone, fish maw, and scallops, offering a deep, fragrant taste. The \u0027Lychee Pork\u0027 is crispy on the outside, tender inside, with a perfectly balanced sweet and sour sauce. It is the premier choice for travelers seeking authentic top-tier Fujian cuisine and a royal banquet experience.", "name": "Juchunyuan Restaurant", "transport": "Take Fuzhou Metro Line 1 or Line 2 to \u0027Dongjiekou Station\u0027 Exit C, then walk for about 3 minutes."}, {"address": "No. 56 Wenru Lane, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Located in the quaint Wenru Lane within Three Lanes and Seven Alleys, this restaurant is housed in a restored Ming and Qing dynasty mansion with serene Jiangnan garden aesthetics. It specializes in refined traditional Fujian cuisine and creative private dishes. Highlights include \u0027Red Yeast Drunken Chicken\u0027 with firm yet smooth meat infused with deep wine aroma, and \u0027Southern Fujian Taro Paste\u0027, which is velvety smooth, melt-in-your-mouth, and pleasantly sweet. The courtyard, red bricks, and wood carvings create a sublime dining ambiance loved by gourmets seeking an immersive cultural-culinary journey.", "name": "Wenru Min Cuisine", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, enter Three Lanes and Seven Alleys, and walk to Wenru Lane in about 8 minutes."}, {"address": "No. 61 Jibi Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Highly recommended by locals, this affordable time-honored brand offers a lively, warm atmosphere filled with local everyday charm. Their signature \u0027Southern Fried Pork Liver\u0027 is brilliantly prepared\u2014tender with no gamey smell, evenly sliced, and coated in a rich, sweet-and-savory sauce. \u0027Stir-fried Double Crispy\u0027 combines jellyfish and pork kidney for a refreshingly crunchy, tangy, and mildly spicy kick. It is a favorite among locals and tourists for enjoying authentic, home-style Fuzhou flavors at unbeatable prices.", "name": "Lao Fuzhou Traditional Fujian Cuisine", "transport": "Take Fuzhou Metro Line 1 to \u0027Nanmendou Station\u0027 Exit A1, then walk for about 6 minutes."}, {"address": "No. 158 Hubin Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | A garden-style fine dining establishment near West Lake Park and Three Lanes and Seven Alleys, offering high-end Fujian cuisine and exquisite private recipes. The environment is quiet and private with winding paths and beautiful foliage. \u0027Red Lees Bamboo Shoots\u0027 features tender shoots infused with a subtle red yeast wine aroma, delivering a sweet, fresh crunch. \u0027Wine Lees Pan-fried Yellow Croaker\u0027 boasts a golden crispy skin and juicy, tender meat. With its beautiful setting and meticulous culinary techniques, it is a favorite for business banquets and luxury travelers.", "name": "Xuanhe Yuan Restaurant", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027, then take a taxi for about 5 minutes or walk for about 15 minutes."}, {"address": "No. 3 Zhuzifang, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Tucked away in the Zhuzifang Historical and Cultural Block, this private kitchen is set inside a historic Ming-Qing courtyard house surrounded by lush greenery. The restaurant blends traditional Fujian cooking with modern bistro dining. Signature \u0027Fujian Wine Lees Braised Pork\u0027 is rich without being greasy, paired with small steamed buns for a pillowy, flavorful bite. The \u0027Seafood Taiping Yan Soup\u0027 features a rich seafood broth and paper-thin, springy handmade meat-wrapper dumplings. Its tranquil, historic atmosphere makes it highly praised by culture enthusiasts and foodies.", "name": "Zhuzifang No. 3 Private Kitchen", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit D3, then walk for about 5 minutes to Zhuzifang."}, {"address": "No. 39 Jibi Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.3 Stars | Founded during the Qing Dynasty, this century-old landmark sits beside Antai Bridge and is a premier spot to experience traditional Fuzhou food culture. It serves over a hundred local snacks and classic stir-fries. Signature \u0027Dingbianhu\u0027 (Rice Paste Soup) features a savory broth with smooth, springy rice ribbons; the \u0027Sugarcane Mutton Pot\u0027 offers tender mutton balanced by the natural sweetness of sugarcane, making a soothing broth. Brimming with lively local charm, it\u0027s the ultimate venue to sample Fuzhou\u0027s traditional snacks and home-style dishes all at once.", "name": "Antailou Restaurant", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, then walk for about 7 minutes."}, {"address": "7th Floor, Ocean Department Store, No. 88 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | A chic, modern bistro reinterpreting traditional Southern and Eastern Fujian cuisines with sleek, contemporary Oriental aesthetics. The \u0027Ten-Mile Fragrant Beef\u0027 is stewed until tender and melt-in-your-mouth, brimming with rich aromatics. \u0027Crispy Pan-Fried Rice Cake\u0027 features a golden, crunchy exterior with a soft, sweet rice interior. The menu also includes craft cocktails infused with local tea and fruits, making it a trendy hotspot for young crowds and stylish travelers looking to savor refined Fujian dishes and craft drinks at night.", "name": "Min He Nanan (Dongjiekou Branch)", "transport": "Take Fuzhou Metro Line 1 or Line 2 to \u0027Dongjiekou Station\u0027, which directly connects to Ocean Department Store."}, {"address": "No. 18 Gong Alley, Nanhou Street, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.4 Stars | Set in a historic lane near Three Lanes and Seven Alleys, this retro bistro pairs traditional Fuzhou bar bites with modern craft beers. The ambient, warm lighting fosters a relaxed social atmosphere. Recommended dishes include \u0027Salt \u0026 Pepper Lychee Pork\u0027 and \u0027Spicy Chilled Seafood\u0027, offering sweet, tender seafood with an appetite-stimulating spicy kick. Pair them with their custom \u0027Fuzhou Tangerine Craft Beer\u0027 for a refreshingly crisp, slightly tart finish. It\u2019s the perfect spot for young travelers wanting both local nightlife and authentic food.", "name": "Weixun Alley Min Cuisine Bistro", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, walk into Nanhou Street and turn into Gong Alley, arriving in about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Kaiyuan Temple, No. 28 Kaiyuan Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | A traditional vegetarian restaurant located next to the ancient Kaiyuan Temple, deeply loved by Fuzhou locals and visitors seeking blessings. It seamlessly combines Zen culinary culture with Fujian cuisine techniques. The signature \u0027Vegetarian Buddha Jumps Over the Wall\u0027 features lion\u0027s mane mushrooms, bamboo fungus, shiitake mushrooms, and taro slow-simmered over low heat. The broth is rich and fragrant, layered, and delightfully gelatinous. Another highlight, \u0027Vegetarian Lychee Pork\u0027, uses lion\u0027s mane mushrooms to mimic meat texture; crisp on the outside, coated in a sweet and sour signature sauce, tender inside, vibrant and appetizing.", "name": "Kaiyuan Temple Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, walk about 5 minutes."}, {"address": "No. 12 Daming Road, Gulou District, Fuzhou City (Near Dongjiekou)", "feature": "\u2b50 4.4 stars | Located near Daming Food Street and Three Lanes and Seven Alleys, this is a popular and affordable vegetarian restaurant. It offers a variety of vegetarian stir-fries and dim sum. The \u0027Pan-Fried Vegetarian Buns\u0027 feature a crispy, golden-brown bottom filled with finely chopped cabbage, shiitake mushrooms, and dried tofu, bursting with natural sweetness and aromatic flavors in every bite. The \u0027Stir-Fried Chinese Yam with Lily Bulbs\u0027 is fresh and crunchy, perfectly highlighting the original flavor of natural ingredients, highly recommended by health-conscious tourists and office workers.", "name": "Miaoxiang Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit A, walk about 4 minutes."}, {"address": "Next to Dongjiekou Department Store, No. 188 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.3 stars | A great-value vegetarian buffet restaurant located in the heart of the Dongjiekou commercial district, offering dozens of exquisite plant-based dishes, stir-fries, dim sum, and soups daily. The freshly fried \u0027Vegetable Tempura\u0027 is highly recommended\u2014light and airy with a crisp bite, revealing sweet and soft pumpkin and sweet potato inside. There is also the traditionally brewed \u0027Red Bean and Job\u0027s Tears Sweet Soup\u0027, pleasantly sweet and soothing. Its affordable price and variety make it a top choice for locals and backpackers.", "name": "Su Man Xiang Vegetarian Buffet", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, walk about 2 minutes."}, {"address": "No. 15 Gong Xiang, Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.7 stars | An upscale creative vegetarian restaurant tucked inside the historic Ming and Qing dynasty courtyard homes of Three Lanes and Seven Alleys. It blends elegant historical surroundings with modern molecular plant-based cuisine. The signature \u0027Black Truffle Wild Mushroom Risotto\u0027 uses premium rice infused with rich black truffle sauce; the grains absorb the flavorful mushroom broth, creating a soft yet slightly chewy texture with a captivating aroma. The \u0027Handmade Vegetarian Roast Duck\u0027 is intricately layered with tofu skin, baked until golden and crispy, and served with sweet bean sauce and thin pancakes for exquisite texture\u2014a favorite among diners seeking an elegant dining atmosphere.", "name": "Fanpin Vegetarian Art \u0026 Culture Space", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit D1, walk about 6 minutes into Gong Xiang within Three Lanes and Seven Alleys."}, {"address": "No. 19 Yangqiao East Road, Gulou District, Fuzhou City (Near North Entrance of Three Lanes and Seven Alleys)", "feature": "\u2b50 4.5 stars | An exquisite vegetarian restaurant located on Yangqiao East Road, featuring a Zen wellness concept. The \u0027Golden Soup Vegetarian Bird\u0027s Nest\u0027 is lovingly simmered from pumpkin puree and snow fungus, offering a silky, melt-in-your-mouth texture with a subtle natural sweetness. The \u0027Sizzling Vegetarian Steak\u0027 is crafted from soy protein and konjac, seared on a hot griddle to release a mouthwatering savory aroma, then drizzled with signature black pepper sauce. Its firm yet springy texture impresses even first-time vegetarian diners, making it a popular spot for refined gatherings.", "name": "Yi Ye Pu Ti Vegetarian Restaurant", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C/D, walk about 3 minutes."}, {"address": "No. 68 Jibi Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.2 stars | Located near Jibi Road in Three Lanes and Seven Alleys, this healthy vegetarian restaurant focuses on authentic flavors with low oil and salt. The popular \u0027Three-Cup Mushrooms with Thai Basil\u0027 features king oyster and shiitake mushrooms flash-fried over high heat to lock in moisture; the king oyster mushrooms are juicy, tender, and springy, infused with rich basil aromas. Paired with a bowl of \u0027Five-Grain Rice\u0027, every bite is fragrant and satisfying\u2014perfect for refueling after strolling through Three Lanes and Seven Alleys.", "name": "Yang Su Zhai Vegetarian Cuisine", "transport": "Take Metro Line 1 to \u0027Nanmendou Station\u0027 Exit A1, walk about 7 minutes."}, {"address": "No. 102 Jintai Road, Gulou District, Fuzhou City (Near Dongjiekou)", "feature": "\u2b50 4.4 stars | A cozy vegetarian eatery tucked in the alleyways of Dongjiekou, renowned for its home-style nourishing dishes. The signature \u0027Handmade Vegetarian Dumplings\u0027 feature thin, chewy skins stuffed with shiitake mushrooms, wood ear fungus, carrots, and tofu, releasing sweet vegetable juices with every bite. The \u0027Jade Tofu Soup\u0027 combines tender tofu with fresh green vegetable puree, yielding a clear, delicious, and soothing broth\u2014a favorite among nearby office workers and health-conscious families.", "name": "Jing Xin Vegetarian House", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit B, walk about 5 minutes."}, {"address": "No. 16 Aomen Road, Gulou District, Fuzhou City (Along Antai River)", "feature": "\u2b50 4.6 stars | Situated along the scenic Antai River near Three Lanes and Seven Alleys, offering picturesque riverside views and a relaxed atmosphere. The restaurant specializes in creative wellness vegetarian cuisine. The \u0027Truffle Yam Rolls\u0027 feature steamed fresh Chinese yam mashed and wrapped in seaweed and shredded vegetables, delightfully smooth with a subtle truffle aroma. The \u0027Traditional Bamboo Shoot Soup\u0027 simmers local fresh bamboo shoots and kelp over a gentle flame, resulting in a sweet, refreshing broth and crisp, tender shoots\u2014a perfect display of eastern Fujian\u0027s natural flavors.", "name": "Jue You Qing Vegetarian Cultural Club", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit D1, walk about 8 minutes to Aomen Road by the Antai River."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 108 Nanhou Street, Three Lanes and Seven Alleys, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Tongli Rouyan is the most famous century-old street food shop in Fuzhou\u0027s Three Lanes and Seven Alleys. Its yanpi (swallow skin wrapper) is crafted by pounding fresh lean pork hind leg meat mixed with sweet potato starch, creating a wrapper as thin as paper yet extraordinarily springy and resilient. From the very first bite, the skin delivers a delightfully crisp and tender texture, revealing a juicy, flavorful pork filling inside that is refreshing, smooth, and served in a rich, sweet broth. Locals view it as a symbol of peace and good fortune, while tourists are captivated by the unique \u0027meat wrapping meat\u0027 craftsmanship and double-layered meaty savory aroma.", "name": "Tongli Rouyan Old Shop", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 (Exit C), and walk for about 5 minutes to reach Nanhou Street."}, {"address": "No. 89 Nanhou Street, Three Lanes and Seven Alleys, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Founded in 1934, Yonghe Fish Ball is a classic must-try street snack on Nanhou Street. The outer layer of the fish ball is handmade from fresh eel or shark meat, giving it a springy, chewy texture with a rich natural seafood sweetness. The inside is filled with savory, well-seasoned pork. The moment you bite into it, piping-hot, delicious meat juices burst out, blending fish and meat flavors perfectly in your mouth. This combination of a springy exterior, tender interior, and bursting savory juice keeps foodies from all over the world coming back for more.", "name": "Yonghe Fish Ball", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027, then walk through the underground passage to the main pedestrian street of Nanhou Street in Three Lanes and Seven Alleys."}, {"address": "No. 91 Nanhou Street, Three Lanes and Seven Alleys, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Mujin Meatball is a unique traditional Fuzhou street snack featuring a sweet and savory flavor profile. Unlike typical meatballs, these are not made purely of meat; instead, shredded taro and sweet potato starch are mixed with marbled pork, red dates, sesame seeds, and sugar before being steamed. The outer skin is translucent amber, chewy, and infused with a rich taro aroma. The filling offers a perfect balance of savory and sweet without being greasy. Served piping hot and tender, the first taste delivers sweet taro notes followed by an explosion of savory pork fat, creating an impressively complex layering of flavors.", "name": "Mujin Meatball Store", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 (Exit C), and walk to the middle section of Nanhou Street."}, {"address": "No. 51 Guanglu Lane, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Located at the entrance of Guanglu Lane, Ye Family Peanut Soup is a popular dessert stall in the Three Lanes and Seven Alleys commercial area. Its signature peanut soup features peanuts slow-simmered over low heat for hours, achieving an amazing consistency where they melt in your mouth and the broth becomes milk-like and creamy. The peanuts are soft and fragrant, and the soup is sweet without being overwhelming. Stirring in a fresh hot raw egg adds an even smoother, warmer texture. Additionally, their taro paste is exceptional\u2014topped with fragrant sesame and lard, offering a dense, velvety, warm sweet treat that makes for the ultimate comforting dessert while strolling through the historic streets.", "name": "Ye Family Peanut Soup", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027, and walk along Nanhou Street to the intersection with Guanglu Lane."}, {"address": "No. 35 Wushan Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Zuixianlou is a renowned time-honored Fuzhou bakery and dessert shop located near the Dongjiekou commercial area. Its signature portable snacks include cishi (soft, chewy glutinous rice balls coated in soybean powder and sesame sugar) and traditional Fuzhou taro paste. Cishi offers a delightfully stretchy and elastic chew packed with sweet flavor, while the freshly steamed taro paste is made with traditional lard and powdered sugar, resulting in a velvet-smooth texture with a deep, rich taro aroma. Packed with old-school Fuzhou nostalgic flavor, it is beloved by local neighborhood regulars and visiting foodies alike.", "name": "Zuixianlou Pastry Shop", "transport": "Take Metro Line 1 or Line 2 to \u0027Nanmendou Station\u0027 or \u0027Dongjiekou Station\u0027, and walk for about 8 minutes."}, {"address": "No. 115 Nanhou Street, Three Lanes and Seven Alleys, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Baibingyuan is a specialty bakery in Three Lanes and Seven Alleys offering traditional Fujian-style pastries. The street snacks most loved by tourists are libing (ceremonial cake) and guangbing (Guang cake). Libing features a golden, crispy crust sprinkled with white sesame seeds, stuffed with diced fatty pork, candied winter melon, peanuts, and scallions; taking a bite reveals a crispy yet soft texture, sweet and savory, with rich aromas. Guangbing, on the other hand, is crisp, firm, and boasts a slightly salty charcoal-roasted aroma. These traditional handmade baked goods are not only convenient to eat while walking, but also serve as a quintessential taste of traditional Fuzhou pastry culture.", "name": "Baibingyuan Fuzhou Pastry", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027, and walk about 6 minutes into Nanhou Street."}, {"address": "1F, Antai Building, No. 39 Jipi Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | Located beside Antai Bridge in Dongjiekou, Antai Restaurant\u0027s street-side takeaway window is an ideal spot to experience traditional Fuzhou market cuisine. It gathers a variety of fresh, made-to-order traditional snacks, such as guobianhu (pot-side rice paste soup) and freshly deep-fried hailibing (oyster cakes). The oyster cake boasts a golden, crunchy crust enclosing fresh oysters, cabbage, and seaweed; it produces a satisfying crunch when bitten into, immediately releasing steam and seafood freshness. This striking contrast of crispy exterior and tender filling makes it an endlessly popular street delicacy in the Dongjiekou shopping district.", "name": "Antai Restaurant Snack Station", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 (Exit D1), and walk for about 4 minutes to Jipi Road."}, {"address": "Market Stall Area, Nanhou Street, Three Lanes and Seven Alleys, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Located in the market cluster area of Nanhou Street, this street food known as the \u0027Fuzhou Chinese Burger\u0027\u2014Guangbing Sandwich (Guangbing filled with meat)\u2014is a hot bestseller that almost every tourist holds in hand. Freshly baked Fuzhou guangbing is charcoal-roasted until its crust is extremely crisp, carrying hints of lightly salted flour and sesame aromas. Vendors quickly slice open the baked bun and stuff it with deeply flavorful stewed marbled pork or red-braised pork cooked in lees. The high temperature allows the savory meat juices to soak into the crispy crust. With one bite, the crunchy exterior crackles, opening into a soft, juicy, savory filling\u2014a rich texture profile that keeps you craving more.", "name": "Nanhou Street Guangbing Sandwich Stall", "transport": "Take Metro Line 1 to \u0027Dongjiekou Station\u0027 (Exit C), and walk to the pedestrian market area on Nanhou Street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Fuzhou - Three Lanes and Seven Alleys and Dongjiekou Business District"}, "fuzhou_yantai": {"categories": {"cat_1": {"items": [{"address": "No. 120 Xiahang Road, Shangxiahang Historical and Cultural Block, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 stars | As a century-old heritage branch of the iconic \"Juchunyuan\" located in the historic courtyard houses of Shangxiahang, its most famous dish is undoubtedly Fujian\u0027s top delicacy, \"Buddha Jumps Over the Wall\" (Fotiaoqiang). When opened, its irresistible aroma fills the room; the broth blends sea cucumber, abalone, fish maw, dried scallops, and Huadiao wine into a rich, velvety, collagen-packed delight that coats your lips. Additionally, the sweet-and-sour crispy Lychee Pork and tender, odorless Stir-fried Liver perfectly highlight the delicate flavors of Min cuisine, making it the top choice for tourists to experience an authentic, high-end traditional Fujian banquet and Fuzhou\u0027s deep history.", "name": "Juchunyuan Yiguan", "transport": "Take Metro Line 1 to Dadao Station (Exit C), then walk for about 8 minutes."}, {"address": "No. 102 Zhonghang Road, Shangxiahang Historical and Cultural Block, Taijiang District, Fuzhou City", "feature": "\u2b50 4.5 stars | Founded during the Guangxu reign of the Qing Dynasty, this century-old Chinese time-honored brand passes down the exquisite craft of \"meat wrapping meat.\" The delicate wrapper is made by pounding fresh pork leg into a smooth paste and rolling it with sweet potato starch into paper-thin sheets. Once cooked, it becomes silky, springy, and full of unique meaty aroma. Stuffed with minced mushrooms and fresh pork, each bite is delightfully smooth with a clear, flavorful broth. Served with a dash of white pepper in a signature broth, it offers a satisfyingly crisp chew, making it a beloved food landmark for locals and tourists to experience Fuzhou\u0027s intangible cultural heritage.", "name": "Tongli Rouyan", "transport": "Take Metro Line 1 to Dadao Station, then walk for about 10 minutes."}, {"address": "Shangxiahang Historical and Cultural Block, Nantai Road, Taijiang District, Fuzhou City (near Binde Bridge)", "feature": "\u2b50 4.4 stars | Located beside Binde Bridge in Shangxiahang, this century-old traditional pastry shop is a nostalgic dessert sanctuary locals have loved since childhood. The signature Taro Paste is made by steaming crushed betel nut taro and blending it with lard and sugar, resulting in an exceptionally smooth, dense texture that is rich, sweet, and never cloying. The \"Ciba\" (glutinous rice cake) is coated in crushed peanuts and fragrant sesame powder, offering a chewy, soft texture with a pure rice aroma. Preserving the nostalgic dessert flavors of old Fuzhou street markets at affordable prices, it is highly sought after by foodies seeking retro, traditional treats.", "name": "Bindeqiao Mishigui", "transport": "Take a bus to \"Xingguang Tiandi\" or \"Shangxiahang Historical and Cultural Block\" Station, then walk for about 3 minutes."}, {"address": "No. 182 Laoyaozhou Street, Taijiang District, Fuzhou City (near Shangxiahang)", "feature": "\u2b50 4.6 stars | A legendary time-honored dessert shop near the Shangxiahang historical district, named after its founder who lost his teeth in old age but possessed extraordinary soup-making skills. The signature Peanut Soup is slow-cooked for hours until the peanuts turn milky white, melting instantly in your mouth with a soft, silky texture and a sweet, milky broth. Paired with a warm plate of chewy Taro Paste or Peanut Cake coated in sesame sugar powder, the layers of flavor are rich and comforting. It is a staple afternoon tea favorite for locals and a refreshing treat for visitors strolling the ancient streets.", "name": "Meiyabo Peanut Soup", "transport": "Take Metro Line 1 to Dadao Station, then walk for about 6 minutes."}, {"address": "No. 148 Xiahang Road, Taijiang District, Fuzhou City (inside Shangxiahang Historical District)", "feature": "\u2b50 4.2 stars | Founded in 1868, this famous traditional Fuzhou snack is renowned for its unique steaming technique. The outer casing is crafted from betel nut taro paste mixed with sweet potato starch, giving it a translucent amber appearance wrapped around a savory filling of pork, dried shrimp, and shiitake mushrooms. The texture is springy and chewy on the outside, while the savory-sweet filling bursts with rich taro and seafood flavors. Drizzled with special sweet chili sauce or vinegar, its wonderfully soft-yet-fragrant bite makes it one of the must-visit traditional heritage shops in Shangxiahang.", "name": "Mujin Meatballs", "transport": "Take Metro Line 1 to Dadao Station, then walk for about 9 minutes."}, {"address": "No. 105 Xiahang Road, Shangxiahang Historical and Cultural Block, Taijiang District, Fuzhou City", "feature": "\u2b50 4.3 stars | Founded in 1934, this classic iconic fish ball eatery represents the very soul of traditional Fuzhou snacks. Fresh eel or shark meat is whipped into a light fish paste and wrapped around carefully selected minced pork filling. Once cooked, the plump fish balls are pale, tender, extremely bouncy, and chewy. Biting into one unleashes a burst of rich, savory meat juices blended with fresh seafood flavor. Served in a clean broth sprinkled with chopped celery and aromatic vinegar, it is refreshing and balanced, attracting countless food lovers to savor the most authentic taste of Fuzhou.", "name": "Yonghe Fish Balls", "transport": "Take Metro Line 1 to Dadao Station, then walk for about 8 minutes."}, {"address": "No. 181 Xiahang Road, Taijiang District, Fuzhou City (inside Shangxiahang Historical District)", "feature": "\u2b50 4.4 stars | A comprehensive time-honored restaurant gathering traditional Fuzhou dishes and classic street snacks under one roof. The interior showcases charming retro Fujian architecture. The signature Lychee Pork features score-cut pork fried to a crispy golden shape resembling lychees, coated in a signature sweet-and-sour sauce that is delightfully crunchy outside and tender inside. The Seafood Rice Paste Soup is rich and flavorful, with paper-thin rice slurry sheets that carry a deep rice aroma. Here, you can sample authentic Min cuisine and home-cooked old Fuzhou classics in one go, making it a favorite for tourists and family gatherings alike.", "name": "Lao Fuzhou Restaurant", "transport": "Take Metro Line 1 to Dadao Station, then walk for about 10 minutes."}, {"address": "Near Cangqian Road, Yantai Mountain Historical and Cultural Block, Cangshan District, Fuzhou City", "feature": "\u2b50 4.3 stars | Originating from Fuzhou\u0027s century-old brand Antailou, this location sits near the border between Yantai Mountain and Shangxiahang. It specializes in refined traditional Fuzhou snacks and regional dishes. The signature Oyster Omelet is fried to a golden crisp with plump, juicy oysters, complemented by a unique house sauce that leaves a lasting impression. The Fuzhou Fried Rice Noodles and Red Wine Lees Bamboo Shoots are aromatic, fresh, and savory. Combining traditional culinary arts with the elegant, trendy vibe of Yantai Mountain, diners can enjoy representative Fuzhou delicacies against a picturesque retro Western-style building backdrop.", "name": "An Tai Lou Snack Restaurant - Yantai Mountain", "transport": "Take Metro Line 1 to Shangteng Station (Exit A), then walk for about 12 minutes."}], "name": "Famous Traditional Local Restaurants"}, "cat_2": {"items": [{"address": "No. 2 Cangguanding Lane, Yantai Mountain Historic District, Cangqian Subdistrict, Cangshan District, Fuzhou City", "feature": "\u2b50 4.7 stars | Nestled in a red-brick Western-style building in the historic Yantai Mountain district, SOLO Coffee is one of Fuzhou\u0027s leading brands for exquisite pour-over and signature specialty coffees. Blending classic and modern aesthetics, the ambiance attracts both tourists and local coffee lovers, whose top picks include the \u0027Yantai Mountain Specialty Blend\u0027 or single-origin pour-overs, paired with freshly baked, crispy French croissants. The coffee boasts a rich, creamy aroma, a smooth mouthfeel with subtle citrus acidity, and a nutty finish with rich layers of flavor.", "name": "SOLO Coffee (Yantai Mountain Store)", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027 Exit A, then walk for about 10 minutes."}, {"address": "No. 84 Zhongshi Street, Shangxiahang, Taijiang District, Fuzhou City", "feature": "\u2b50 4.6 stars | Housed inside a quaint traditional mansion in Shangxiahang, this spot seamlessly blends an independent bookstore, creative cultural products, specialty coffee, and delicious brunch. The brunch platter features freshly toasted whole-wheat bread, silky scrambled eggs, and smoked bacon, perfectly accompanied by a rich, aromatic classic latte with silky-smooth microfoam. With its serene and elegant environment steeped in Minnan and Fuzhou water-town culture, it is a favorite pit stop for hipster travelers and strolling tourists.", "name": "Lusen Bookstore \u0026 Cafe (Shangxiahang Store)", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027 Exit C, then walk for about 8 minutes."}, {"address": "Yantai Mountain Historic District, No. 18 Lequn Road, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 stars | Located near the summit of Yantai Mountain, this internet-famous cafe is known for blending a minimalist Korean all-white design with textured industrial red brick. Signature brunch items like the \u0027Avocado Poached Egg Toast\u0027 feature a silky yolk flowing over velvety mashed avocado, crisp toast, and fresh greens, delivering a wonderfully rich textural experience. Paired with a visually striking Dirty Coffee\u2014where hot espresso and chilled milk create a unique sensory burst on the palate\u2014it is immensely popular among young travelers.", "name": "M2ee Coffee (Yantai Mountain Store)", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027, then transfer to a micro-recirculation bus or walk for about 12 minutes."}, {"address": "Yantai Mountain Commercial District, No. 68 Tingxia Road, Cangshan District, Fuzhou City", "feature": "\u2b50 4.8 stars | A specialty storefront in Fuzhou\u0027s Yantai Mountain by the globally renowned specialty coffee brand S.O.E. Focusing on Single Origin Espresso (S.O.E.) beans, it serves top-tier black coffee and inventive signature brews. Their \u0027Dutch Cold Drip Yirgacheffe\u0027 boasts bright floral and fruity aromas with a crisp, sweet finish, highly acclaimed by coffee connoisseurs. Pair it with their daily limited cheesecake or American-style brunch sandwiches for an incredible afternoon treat as creamy cheese and crispy bread melt in your mouth.", "name": "S.O.E COFFEE (Yantai Mountain Store)", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027 Exit B, then walk for about 9 minutes."}, {"address": "No. 2 Aiguo Road, Cangqian Subdistrict, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 stars | Occupying a unique century-old historic building in Yantai Mountain, this lifestyle concept space combines homeware, curated creative products, coffee, and light bites. The brunch menu focuses on healthy, light choices like the \u0027American Club Sandwich\u0027 and \u0027Grilled Chicken Breast Salad\u0027\u2014tender, juicy chicken paired with crisp greens and a house-made vinaigrette that keeps you coming back for more. Their signature \u0027Osmanthus Latte\u0027 blends delicate Oriental floral notes seamlessly with rich espresso for a smooth finish, making it a favorite for visitors exploring the historic district.", "name": "Simple Mill Cafe \u0026 Lifestyle (Yantai Mountain Store)", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027 Exit A, then walk for about 10 minutes."}, {"address": "Shangxiahang Historic and Cultural District, No. 103 Longping Road, Taijiang District, Fuzhou City", "feature": "\u2b50 4.5 stars | Tucked away beside the canal alleys of the Shangxiahang Historic District, this nostalgic retro cafe exquisitely showcases the serene charm of traditional Fuzhou wooden architecture. The crowd favorite is the \u0027Jasmine Tea Coffee Specialty\u0027, which uniquely infuses Fuzhou\u0027s iconic local jasmine tea with cold brew coffee\u2014starting with a delicate floral sweetness followed by a clean, balanced coffee bitterness. Paired with house-made cinnamon rolls (crispy on the outside, soft inside, packed with rich warm spice) and an all-day brunch platter, it is a must-try classic when visiting Shangxiahang.", "name": "Fushengji Cafe (Shangxiahang Store)", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027 Exit C, then walk for about 10 minutes."}, {"address": "No. 12 Lequn Road, Cangshan District, Fuzhou City", "feature": "\u2b50 4.7 stars | A tremendously popular artisanal bakery and brunch cafe in the Yantai Mountain area, specializing in freshly baked Japanese and French pastries daily. The signature \u0027Sea Salt Croissant\u0027 is super crispy on the outside with a satisfying crunch, buttery soft on the inside, and elevated by a subtle touch of sea salt. Pair it with their signature \u0027Oat Milk Latte\u0027 or a hearty \u0027Seared Beef Brunch Platter\u0027\u2014featuring tender, juicy beef served with a soft-poached hot spring egg and fresh produce. It offers a delicious balance of health and flavor, making it a trendy check-in spot for local youth and tourists alike.", "name": "Cherry Bakery \u0026 Cafe (Yantai Mountain Store)", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027, then walk for about 11 minutes."}, {"address": "Shangxiahang Historic Area, No. 25 Santongqiao Lane, Taijiang District, Fuzhou City", "feature": "\u2b50 4.4 stars | Located near Santong Bridge in Shangxiahang, this versatile day-to-night bistro serves high-quality brunch and specialty coffee by day, transforming into a romantic bistro bar by night. A highlight of the brunch menu is the \u0027Eggs Benedict with Smoked Salmon\u0027\u2014piercing the egg yields a rich yolk that coats the English muffin and tender smoked salmon for an incomparably smooth, savory bite. Enjoying it alongside a fruity \u0027Hand-Drip Cold Brew\u0027 with a crisp, lasting finish while sitting at the outdoor riverside seating overlooking ancient bridges creates a deeply romantic ambiance.", "name": "1992 Bistro \u0026 Coffee (Shangxiahang Store)", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027 Exit C, then walk for about 7 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 120 Xiahang Road, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 stars | Located in the quaint and historic Shangxiahang district, this is a branch of Juchunyuan, a century-old Fuzhou institution. Its most famous classic masterpiece is \u0027Buddha Jumps Over the Wall\u0027 (Fo Tiao Qiang), featuring a rich soup simmered for hours with dozens of precious ingredients like abalone, sea cucumber, scallops, and fish maw, yielding a thick, velvety texture with a lingering sweet aftertaste. Additionally, the sweet-and-sour crispy Lychee Pork and flavorful Lees-marinated Chicken are must-try signature dishes, highly praised by foodies and tourists seeking authentic Fuzhou cuisine.", "name": "Juchunyuan Inn (Shangxiahang)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 8 minutes."}, {"address": "No. 19 Lequn Road, Yantaishan Historical and Cultural District, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 stars | Nestled in a historic Western-style building in the Yantaishan Historic District, this elegant bistro presents traditional Fujian cuisine in a modern fine-dining style. The signature \u0027Drunken Pork Ribs\u0027 are crispy outside and tender inside, coated in a sweet-and-sour garlic vinegar sauce that is refreshing and savory. The \u0027Taro Paste\u0027 uses premium betel nut taro, delivering a velvety smooth texture with a rich, aromatic flavor. Blending old-world colonial charm with exquisite cuisine, it is a top choice for business banquets and romantic dates.", "name": "Xuanhe Yuan (Yantaishan)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A) and walk for about 12 minutes."}, {"address": "Phase II, Yantaishan Commercial Pedestrian District, Cangqian Road, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 stars | A highly popular red-brick Western bistro in Yantaishan, combining craft beer with local fusion cuisine. The signature \u0027Red Lees Matsusaka Pork\u0027 pairs local Fuzhou red lees ferment with premium pork\u2014pan-seared to a light crisp on the outside while remaining springy, juicy, and faintly aromatic with wine notes. Paired with house-special Fuzhou-themed cocktails, it is a favorite among young locals and visitors alike. The outdoor seating offers a stunning night view of Cangshan.", "name": "Deertopia Bistro (Yantaishan)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit B) and walk for about 10 minutes."}, {"address": "No. 88 Zhongshi Road, inside Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.4 stars | A highly renowned authentic Fujian restaurant in Shangxiahang, offering high value-for-money and authentic home-style Fuzhou flavors. The \u0027Stir-fried Double Crispy\u0027 (pork kidney and jellyfish skin) demands precise heat control, offering an amazingly crisp texture in a tangy, sweet, and lightly spicy sauce. The \u0027Guobianhu\u0027 (rice slurry soup) has a flavorful broth that pairs perfectly with crispy deep-fried dough sticks. Its lively dining atmosphere and warm hospitality make it an iconic destination for locals and tourists alike.", "name": "Lao Fuzhou Xu Ji (Shangxiahang)", "transport": "Take Metro Line 1 to Dadao Station (Exit C) and walk for about 6 minutes."}, {"address": "No. 202 Xiahang Road, Taijiang District, Fuzhou City", "feature": "\u2b50 4.5 stars | A scenic Fujian restaurant perched along the riverside in the Shangxiahang water town district, boasting prime waterfront views. The signature \u0027Nanri Abalone Soup\u0027 is wonderfully sweet and fresh with pleasantly chewy abalone, while the \u0027Southern Fujian Pan-Fried Crab\u0027 is packed with rich crab roe and seared golden with aromatic goodness. Enjoying delicious dishes inside an ancient historic residence while overlooking the night river views offers immense satisfaction for both sight and taste.", "name": "Linjiangxian Fuzhou Cuisine (Shangxiahang)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 9 minutes."}, {"address": "Phase I, Yantaishan Pedestrian District, Cangqian Road, Cangshan District, Fuzhou City", "feature": "\u2b50 4.3 stars | An American-style bistro and bar located in the heart of Yantaishan, seamlessly blending American pub culture with historic Cangshan architecture. Offering hundreds of craft beers from around the world, food highlights include the \u0027Crispy Fried Chicken\u0027\u2014boasting extra-crispy skin and juicy, tender meat\u2014and the savory, thick \u0027American Wagyu Burger\u0027. With an amazing nighttime vibe, it is the ideal spot for tourists to unwind with a drink after a day of strolling through the historic district.", "name": "COMMUNE Bistro \u0026 Bar (Yantaishan)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit B) and walk for about 11 minutes."}, {"address": "No. 52 Maiyuan Road, Yantaishan Historic District, Cangshan District, Fuzhou City", "feature": "\u2b50 4.4 stars | Tucked away in a leafy, shaded alley in Yantaishan, this charming Fujian restaurant specializes in classic, vintage-style Fujian dishes and delicate snacks. The signature \u0027Taiping Yan\u0027 features handmade Rouyan (meat wrapper dumplings) with smooth, tender, and springy skins in a clear, flavorful broth. The \u0027Eel Claypot\u0027 offers rich savory sauce and firm, tasty eel meat. With its retro artistic interior and delicately prepared medium-sized portions, it is perfect for gatherings with friends to taste local flavors.", "name": "Tangfeng Minwei Restaurant (Yantaishan)", "transport": "Take Metro Line 1 to Shangteng Station (Exit A) and walk for about 10 minutes."}, {"address": "No. 128 Shanghang Road, Taijiang District, Fuzhou City", "feature": "\u2b50 4.6 stars | A private kitchen Fujian bistro housed in a classic residence in Shangxiahang. Featuring a serene, elegant atmosphere, it preserves the traditional wooden structural features of Ming and Qing Dynasty architecture. The signature \u0027Golden Broth Fish Maw Chicken\u0027 has a golden, collagen-rich broth that is velvety smooth, while the \u0027Braised Sea Cucumber\u0027 is tender and deeply flavorful. Offering high-quality teas and specialty liquors alongside dining, it delivers a welcoming and refined private feast experience favored by discerning diners.", "name": "Hang She Private Min Cuisine (Shangxiahang)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 7 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 31 Cangqian Road, Yantai Mountain Historic Area, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Nestled inside an old Western-style building in the historic Yantai Mountain district, this restaurant seamlessly blends traditional Zen aesthetics with modern minimalism. The signature \u0027Black Truffle Wild Mushroom Risotto\u0027 and \u0027Handcrafted Tofu Pot\u0027 are hugely popular among foodies. The tofu is velvety smooth with a subtle soy aroma paired with a delicious house sauce; delicate vegetarian dim sum like the \u0027Truffle Steamed Dumplings\u0027 feature thin skins, generous fillings, and a satisfying chew. Visitors and locals alike are enchanted by how fresh local ingredients are transformed into elegant, light cuisine. Coupled with its charming antique ambiance, it\u0027s a must-visit vegetarian hot spot in Yantai Mountain.", "name": "Wushan Suji Vegetarian Restaurant", "transport": "Take Fuzhou Metro Line 1 to \u0027Shangteng Station\u0027 Exit A, then walk about 10 minutes to reach the Yantai Mountain Commercial District."}, {"address": "No. 128 Xiahang Road, Shangxiahang Historic and Cultural District, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Located next to a traditional courtyard house in the quaint Shangxiahang district, this cafe is famous for its affordable yet exquisite creative vegetarian cuisine. Highly recommended are the \u0027Vegetarian Pickled Fish\u0027 and \u0027Pan-fried Vegetarian Goose\u0027. The \u0027Vegetarian Pickled Fish\u0027 uses special konjac and fried tofu skin to recreate a realistic fish texture, yielding a mouthwatering, sour, spicy, and rich soup; the \u0027Pan-fried Vegetarian Goose\u0027 features a crispy, golden skin wrapping a rich filling of shredded mushrooms and bamboo shoots, offering rich layers with every bite. Its cozy hipster vibe and meticulous cooking techniques attract countless young tourists to experience a unique vegetarian flair.", "name": "Suwei Pingsheng Vegetarian Cafe", "transport": "Take Fuzhou Metro Line 1 to \u0027Dadao Station\u0027 Exit C, then walk about 8 minutes to reach the Shangxiahang District."}, {"address": "No. 58 Maiyuan Road, Cangshan District, Fuzhou City, Fujian Province (Near Yantai Mountain Park)", "feature": "\u2b50 4.5 Stars | A well-established vegetarian restaurant in Fuzhou for many years, located near Yantai Mountain, renowned for preparing vegetarian dishes using traditional Min (Fujian) culinary techniques. The signature \u0027Vegetarian Buddha Jumps Over the Wall\u0027 is a must-order highlight. Carefully selecting premium mushrooms and root vegetables like monkey head mushrooms, bamboo fungus, taro, and shiitake, it is slow-simmered for hours. The broth is rich, mellow, and sweet with complex layers, perfectly recreating the deep flavors of traditional Buddha Jumps Over the Wall while remaining delightfully non-greasy. Its rich variety of dishes and refined craftsmanship win praise from guests of all ages.", "name": "Miaoxiang Vegetarian Restaurant", "transport": "Take Bus 175 or 85 to \u0027Maiyuan Road Station\u0027, then walk about 3 minutes."}, {"address": "Near the intersection of Santongqiao Road and Zhongjiang Road, Taijiang District, Fuzhou City, Fujian Province (South side of Shangxiahang)", "feature": "\u2b50 4.4 Stars | A high-value vegetarian buffet restaurant near the Shangxiahang district, offering over 100 varieties of vegetarian dishes, hot foods, and desserts. Highlights include the freshly pan-fried \u0027Vegetarian Scallion Pancake\u0027 and the \u0027Freshly Cooked Malatang Vegetarian Soup\u0027. The pancake is flaky and crispy, while the malatang soup base is numbing, spicy, and fresh with an incredible variety of toppings to choose from. Additionally, handmade vegetarian steamed buns, fresh salads, and warm sweet soups are available. Using strictly fresh ingredients without artificial colors, its budget-friendly price and diverse selection make it a top choice for locals and budget travelers alike.", "name": "Shuyuan Vegetarian Buffet", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027, then transfer to a bus or walk about 12 minutes."}, {"address": "No. 88 Longping Road, Taijiang District, Fuzhou City, Fujian Province (Inside Shangxiahang Historic and Cultural District)", "feature": "\u2b50 4.8 Stars | Tucked away in the historic architecture cluster of Shangxiahang, this high-end Zen vegetarian restaurant specializes in omakase-style individual set menus. Signature dishes like \u0027Stewed Yam and Lily Bulb with Lotus Seeds\u0027 and \u0027Black Pepper Monkey Head Mushroom Steak\u0027 leave a lasting impression. The \u0027Black Pepper Monkey Head Mushroom Steak\u0027 undergoes a long marinade and special searing process, rendering it crispy on the outside, tender inside, juicy, and substantial\u2014paired with custom black pepper sauce, it tastes even better than real meat. The interior\u0027s wooden decor and flowing water features create an ultra-tranquil atmosphere, while the highly ritualistic presentation is adored by health-conscious and aesthetics-minded travelers.", "name": "Jingxin Pavilion Zen Vegetarian", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027 Exit C, walk along Xiahang Road to Longping Road."}, {"address": "No. 18 Lequn Road, Cangshan District, Fuzhou City, Fujian Province (Yantai Mountain Historic Area)", "feature": "\u2b50 4.6 Stars | A specialty establishment seamlessly combining local Fuzhou tea culture with refined vegetarian cuisine, set among lush greenery halfway up Yantai Mountain. The \u0027Tea-infused Vegetarian Smoked Duck\u0027 and \u0027Organic Vegetarian Rice Noodles\u0027 are widely acclaimed. The \u0027Smoked Duck\u0027 uses smoked soy protein infused with premium Tieguanyin tea leaves, offering a rich tea aroma and smoky charred flavor with a firm, chewy texture; paired with a pot of Fujian Wuyi rock tea, the taste is refreshingly crisp. The quiet courtyard allows guests to enjoy delicious food while immersing themselves in the slow-paced lifestyle of Yantai Mountain.", "name": "Lotus Heart Vegetarian Tea House", "transport": "Take Metro Line 1 to \u0027Shangteng Station\u0027, walk via Meiwu Road and turn onto Lequn Road to arrive."}, {"address": "No. 2 Aiguo Road, Cangshan District, Fuzhou City, Fujian Province (Yantai Mountain Creative Park)", "feature": "\u2b50 4.3 Stars | A trendy vegetarian restaurant focusing on modern fusion and international flavors, located in the Yantai Mountain Creative Park. The signature \u0027Thai Spicy and Sour Vegetarian Hot Pot\u0027 and \u0027Margherita Vegetarian Pizza\u0027 are standout creations. The pizza uses plant-based cheese, fresh tomatoes, and basil baked to perfection with a crispy crust and stretchy, savory cheese; the hot pot broth is simmered with fresh lemongrass and kaffir lime leaves for a zesty, appetite-whetting flavor packed with wild mushrooms and seasonal veggies. Its youthful, artistic decor draws many hipsters and plant-based food lovers for photos and meals.", "name": "Bodhi Tree Vegetarian Space", "transport": "Take Bus 175 or 85 to \u0027Yantaishan Station\u0027, then walk about 5 minutes to arrive."}, {"address": "No. 66 Shanghang Road, Taijiang District, Fuzhou City, Fujian Province (Next to Santong Bridge, Shangxiahang Historic and Cultural District)", "feature": "\u2b50 4.5 Stars | A specialty shop focusing on traditional Fuzhou vegetarian dim sum and street snacks, located next to Santong Bridge in Shangxiahang. The signature \u0027Vegetarian Fuzhou Spring Roll\u0027 features a paper-thin skin fried to a golden crunch, stuffed with cabbage, shiitake mushrooms, vermicelli, and diced dried tofu\u2014offering rich layers without being greasy. Another classic, the \u0027Red Vinasse Vegetarian Meatball\u0027, utilizes traditional Fuzhou red lees seasoning, boasting a subtle sweet fermented wine aroma with a springy, juicy bite. These delicate bite-sized snacks are perfect for enjoying while strolling along the ancient streets, making it an unmissable local vegetarian treat in Shangxiahang.", "name": "Lubo Vegetarian Delights", "transport": "Take Metro Line 1 to \u0027Dadao Station\u0027 Exit C, walk about 10 minutes towards Santong Bridge to find it."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 41 Gongnong Road, Taijiang District, Fuzhou City, Fujian Province (Near Shangxiahang)", "feature": "\u2b50 4.6 stars | A century-old dessert shop near the Shangxiahang Historic District, famous for its signature peanut soup and mashed taro. The peanut soup is simmered until melted in your mouth, rich and creamy without being overly sweet. The mashed taro is drizzled with lard and sesame, offering a heavenly aroma and ultra-smooth texture. Pair them with a piping hot \u0027Shi\u0027 cake coated in crushed peanuts and sesame\u2014sweet, soft, and chewy\u2014a must-try traditional street afternoon tea for both tourists and locals strolling through the ancient streets.", "name": "\u6c92\u7259\u4f2f\u82b1\u751f\u6e6f (Meiyabo Peanut Soup)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 8 minutes."}, {"address": "No. 115 Nanzhong Road, Taijiang District, Fuzhou City, Fujian Province (Inside Shangxiahang District)", "feature": "\u2b50 4.5 stars | Located in the heart of the Shangxiahang Scenic Area, this traditional Fuzhou bakery stall draws crowds with its century-old craftsmanship. Their signature \u0027Shi\u0027 (traditional glutinous rice balls) is rolled in peanut powder and black sesame seeds, offering a springy, firm texture with a rich rice aroma. They also serve lightly sweet, non-sticky nine-layer cake and smooth mashed taro. Grab a box to eat on the go and experience authentic Fuzhou street dessert flavor.", "name": "\u5f6c\u5fb7\u6a4b\u7c73\u6642\u7cbf\u92ea (Bindeqiao Shiguo Pastry Shop)", "transport": "Take Metro Line 1 to Dadao Station (Exit C) and walk for about 10 minutes to reach the Shangxiahang Scenic Area."}, {"address": "No. 139 Shangxiahang Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | One of Fuzhou\u0027s most iconic intangible cultural heritage snacks, perfectly blended into the historic alleyways at its Shangxiahang branch. The outer skin of the fish balls is pounded from fresh eel and shark meat, giving it a delightfully bouncy and chewy texture. Biting into it releases a rich, savory pork filling bursting with juices. The soup is lightly seasoned with chopped celery and white pepper, making it the ultimate hot snack to satisfy your cravings while walking around.", "name": "\u6c38\u548c\u9b5a\u4e38 \u4e0a\u4e0b\u676d\u5e97 (Yonghe Fish Balls - Shangxiahang)", "transport": "Take Metro Line 1 to Dadao Station and walk for about 10 minutes."}, {"address": "No. 102 Xiahang Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A century-old brand famed for its unique technique of \u0027meat wrapping meat\u0027. The swallow skin (\u0027yanpi\u0027) is made from lean pork leg manually pounded thousands of times and kneaded with sweet potato starch, resulting in a paper-thin yet amazingly crisp and bouncy wrapper. When cooked, the meat wontons become translucent. Served in a savory broth with a splash of vinegar, they are silky, crispy, and highly aromatic\u2014a classic hand-held delicacy you shouldn\u0027t miss when strolling around Shangxiahang.", "name": "\u540c\u5229\u8089\u71d5 \u4e0a\u4e0b\u676d\u5e97 (Tongli Rouyan - Shangxiahang)", "transport": "Take Metro Line 1 to Dadao Station (Exit C) and walk along the Shangxiahang Pedestrian Street for about 12 minutes."}, {"address": "No. 182 Xiahang Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | Founded in 1868, this traditional shop serves meatballs unlike any ordinary pure-meat ball. Mujin meatballs are made with shredded taro and sweet potato starch wrapped around brown sugar, diced pork, sesame, and crushed peanuts, then steamed to perfection. The skin is chewy and sticky, while the filling offers a delightful sweet-and-savory flavor bursting with taro and nutty aromas. Grab a piping-hot ball to enjoy on the go\u2014perfect for adventurous foodies exploring local specialties.", "name": "\u6728\u91d1\u8089\u4e38 \u4e0a\u4e0b\u676d\u5e97 (Mujin Meatballs - Shangxiahang)", "transport": "Take Metro Line 1 to Dadao Station and walk for about 10 minutes."}, {"address": "Alleys around Cangqian Road, Yantaishan Historic Area, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A highly popular deep-fried snack stall tucked away in the alleys of the Yantaishan Historic District. This traditional Fuzhou street food features a batter made of soybean and rice flour filled with fresh oysters, seaweed, cabbage, and pork, deep-fried to a golden crisp. It delivers a loud, satisfying crunch with every bite while remaining rich, juicy, and packed with umami inside. Hot and fragrant in hand, it is a must-buy street snack for young travelers visiting Yantaishan\u0027s hip boutique shops.", "name": "\u7159\u81fa\u5c71\u8001\u8857\u6d77\u8823\u9905 (Yantaishan Old Street Oyster Cake)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A) and walk up the hill for about 12 minutes."}, {"address": "No. 42 Linghou Street, Cangshan District, Fuzhou City, Fujian Province (Near Yantaishan Scenic Area)", "feature": "\u2b50 4.3 stars | Located near Linghou Street close to Yantaishan, this old-school Guangbing (Guang cake) stall still preserves the traditional mud-oven charcoal baking method. The baked cake has a golden, crispy crust with a rich sesame and smoky charcoal aroma, giving it a satisfyingly chewy bite. They offer classic fillings like \u0027Guangbing stuffed with red-vinasse pork\u0027 or \u0027Guangbing stuffed with kelp\u0027. The savory, flavorful meat juices soak into the crispy biscuit, creating wonderfully rich layers of flavor\u2014an affordable street treat packed with local character.", "name": "\u5dba\u5f8c\u8857\u50b3\u7d71\u5149\u9905 (Linghou Street Traditional Guangbing)", "transport": "Take Metro Line 1 to Shangteng Station and walk for about 10 minutes."}, {"address": "Near the intersection of Longping Road and Shanghang Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Fuzhou\u0027s most authentic everyday comfort food combination\u2014\u0027tossed noodles and wontons\u0027\u2014can also be enjoyed inside the Shangxiahang Scenic Area. The peanut noodles are tossed evenly with rich peanut sauce and special soy sauce, featuring chewy noodles with an irresistible aroma. The accompanying wontons (\u0027bianrou\u0027) have paper-thin wrappers and generous meat fillings, served in a light, sweet broth sprinkled with scallions and a dash of aged vinegar. Satisfying and refreshing, this classic combo is a favorite for tired travelers looking for a quick energy boost.", "name": "\u5c1a\u5e79\u62cc\u9eb5\u6241\u8089 \u4e0a\u4e0b\u676d\u5e97 (Shanggan Noodles and Wonton - Shangxiahang)", "transport": "Take Metro Line 1 to Dadao Station and walk for about 9 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Fuzhou - Yantai Mountain and Shangxiahang Historic Districts"}, "quanzhou_weststreet": {"categories": {"cat_1": {"items": [{"address": "No. 221 Tumen Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A legendary Quanzhou beef shop. The signature steak infuses rich herbal and curry aromas, slow-stewed until tender and flavorful. Tender, juicy, and falling off the bone effortlessly, it pairs perfectly with a bowl of rich beef soup and savory rice\u2014an irresistible authentic old-school classic for locals and foodies alike.", "name": "Haochengcai Steak House", "transport": "Take Quanzhou Bus K1 or Route 2 to \u0027Guandi Temple Station\u0027, then walk about 2 minutes."}, {"address": "No. 1-3 Tianhou Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A century-old dessert house famous for traditional Shihua Jelly (seaweed jelly). Made from simmered seaweed, this natural jelly is silky, bouncy, and refreshing. Guests can customize their bowl with generous toppings like taro balls, red beans, and jelly, topped with specially crafted honey water. A legendary summer treat you can\u0027t miss!", "name": "Bingzheng Tang Dessert Shop", "transport": "Take Quanzhou Bus 31 or Route K602 to \u0027Tianhou Palace Station\u0027, then walk about 1 minute."}, {"address": "No. 165 Xijie (West Street), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | A legendary West Street institution spanning several generations and recognized as intangible cultural heritage. Paper-thin yet resilient freshly made wrappers envelop cabbage, carrots, dried tofu, peanut powder, seaweed, and crispy pork cracklings. Every bite offers rich layers, vegetable sweetness, and a perfect blend of chewy and crispy textures\u2014a true favorite among longtime Quanzhou residents.", "name": "Yafo Spring Roll Shop (Yafo Runbing)", "transport": "Take the Quanzhou Ancient City Xiaobai Shuttle Car directly to the vicinity of \u0027West Street Kaiyuan Temple\u0027, then walk about 2 minutes."}, {"address": "No. 21 Shuimen Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | An iconic Quanzhou vermicelli soup spot. The broth is slow-simmered for hours with pork bones and seafood, resulting in a semi-translucent, velvety soup paired with silk-thin, melt-in-your-mouth vermicelli. Customize your bowl with toppings like fried pork in vinegar sauce, braised intestine, and tea eggs, and dip fresh crispy dough sticks to soak up the rich, aromatic broth.", "name": "Shuimen Guozi Vermicelli Soup", "transport": "Take Quanzhou Bus 21 or Route 24 to \u0027Confucian Temple Station\u0027, then walk about 5 minutes to Shuimen Lane."}, {"address": "No. 2 Dongjie (East Street), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A century-old Zongzi (rice dumpling) shop next to the iconic Bell Tower. Fragrant stir-fried glutinous rice wraps pork belly, shiitake mushrooms, salted egg yolk, and scallops. Drizzled with signature peanut sauce and sweet chili sauce, the dumpling achieves a perfect tender-chewy balance without feeling overly greasy. A steaming bite bursts with rich savory and nutty flavors!", "name": "Lanshi Bell Tower Pork Zongzi", "transport": "Take the Quanzhou Ancient City Xiaobai Shuttle Car or city bus to \u0027Bell Tower Station\u0027, then walk about 1 minute."}, {"address": "No. 59 Dongjie (East Street), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | A renowned traditional pork zongzi place in Quanzhou. Generously filled with braised pork, mushrooms, chestnuts, dried shrimp, and scallops, the sticky rice is soft yet delightfully chewy. Served with rich peanut sauce and minced garlic, it delivers a deeply layered sweet-and-savory flavor profile that tourists visiting East Street must try.", "name": "Hou Ah Po Pork Zongzi", "transport": "Take Quanzhou Bus 17 or Route K1 to \u0027Nanjun Road Intersection Station\u0027, then walk about 3 minutes."}, {"address": "No. 385 Zhongshan South Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A classic eatery on Zhongshan South Road. Unlike traditional Suzhou paper-thin Xiaolongbao, these buns feature slightly thicker, yeasty skins wrapping savory, juicy pork fillings. Served piping hot, each bite releases a burst of delicious broth. Paired with a bowl of beef thick soup, it forms the most authentic old-street Quanzhou breakfast.", "name": "Yuanfang Steamed Buns (Yuanfang Xiaolongbao)", "transport": "Take the Quanzhou Ancient City Xiaobai Shuttle Car to \u0027Zhongshan South Road Intersection\u0027, then walk about 2 minutes."}, {"address": "No. 207 Xijie (West Street), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | An immensely popular dessert shop on West Street where everything is handcrafted daily. The mochi casing is chewy yet non-sticky, bursting with generous fillings like crushed peanuts, sesame, or taro paste, and coated in fragrant peanut or matcha powder. Soft, sweet, and overflowing with flavor in every bite!", "name": "Wushi Handmade Mochi", "transport": "Take the Quanzhou Ancient City Xiaobai Shuttle Car to \u0027West Street Kaiyuan Temple\u0027, then walk about 3 minutes."}], "name": "Local Traditional Famous Shops"}, "cat_2": {"items": [{"address": "No. 61 Chengtian Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Hidden in the alleyways of Quanzhou\u0027s ancient city, this independent cafe s
