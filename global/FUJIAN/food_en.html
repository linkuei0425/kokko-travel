eamlessly blends local maritime culture with specialty signature coffees. Must-try menu items include the signature \u0027Balang Fish Affogato\u0027 and \u0027Peanut Soup Latte\u0027, which incorporates the sweet richness of traditional Quanzhou peanut soup into a custom latte. It offers a smooth, rich texture with a fragrant peanut aroma balanced by espresso\u0027s subtle bitter-sweet lingering notes. Filled with retro Southern Fujian architecture and an indie artsy vibe, it\u0027s the perfect haven for hipsters and tourists after exploring the ancient town.", "name": "Balang Fish Coffee", "transport": "Walk near Chengtian Temple, take the ancient city\u0027s \u0027Xiaobai\u0027 electric shuttle, and get off at the entrance of Chengtian Alley."}, {"address": "Inside the alley of No. 116 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | A viral courtyard rooftop cafe famous for its unobstructed, prime views of Kaiyuan Temple\u0027s East and West Twin Towers. We recommend pairing a cold drip coffee with seasonal brunch light bites\u2014the coffee offers a well-balanced acidity and sweetness with a smooth, refreshing palate. Sip your coffee on the sun-drenched rooftop terrace while taking in the stunning panorama of red-brick ancient houses and twin towers, immersing yourself in Quanzhou\u0027s charming, laid-back afternoon tea culture.", "name": "Berry Beans Coffee", "transport": "Walk along West Street into the alley opposite Kaiyuan Temple, and follow the signs for about 2 minutes."}, {"address": "Near the intersection of Xinhua North Road and West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Located on an old street in the ancient city, Momin is famous for its innovative \u0027Southern Fujian Fusion Specialty Coffee\u0027. Outstanding signature drinks like the \u0027Shihua Jelly Cold Brew\u0027 and \u0027Mianxian Hu (Noodle Thread Soup) Specialty Coffee\u0027 boast surprisingly harmonious flavors, ingeniously weaving the silky texture of local snacks with fruity coffee notes. With a cozy and relaxed atmosphere serving freshly toasted French toast and classic American brunch, it\u0027s a favorite among local youth and adventurous tourists.", "name": "Momin Coffee", "transport": "Take the ancient city\u0027s Xiaobai electric shuttle to the intersection of West Street and Xinhua North Road, then walk about 100 meters."}, {"address": "No. 4 Xiangfeng Alley, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A unique cultural space integrating an independent bookstore and an old house cafe, steeped in rich literary ambiance. It offers single-origin pour-over coffee and delicate Fujian-style brunch sets. Mostly using house-roasted beans, the coffee presents delicate floral and fruity notes with a pleasant lingering sweetness. Reading a book in the traditional red-brick, wooden-beamed courtyard while savoring fresh pastries and brunch offers a deep taste of Quanzhou\u0027s slow-paced cultural soul.", "name": "Jiezi Bookstore \u0026 Cafe", "transport": "Enter Xiangfeng Alley diagonally across from the main entrance of Kaiyuan Temple on West Street, and walk for about 150 meters."}, {"address": "Rooftop Terrace, Taikui Alley, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A trendy, modern scenic cafe featuring an impressive rooftop terrace that overlooks a sea of traditional red-tile roofs. Known for specialty lattes and exquisite souffl\u00e9 pancake brunch options, the lattes are creamy with long-lasting coffee finishes, while the made-to-order souffl\u00e9s melt in your mouth with balanced sweetness. The sunlit terrace is a prime location for capturing West Street sunsets and taking Instagram-worthy photos.", "name": "1/2 Coffee", "transport": "Walk into Taikui Alley off West Street and follow the signage up to the top floor of the red-brick building."}, {"address": "No. 1 Gouweixia, Chengtian Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | A multifaceted artistic hub combining an indie fashion boutique, vinyl records, and coffee brunch. Their selected pour-over coffee features bright acidity and sweetness, paired perfectly with freshly prepared Australian-style brunch platters and sourdough toast\u2014crispy outside, soft inside, and packed with flavor. Surrounded by industrial-retro vibes and vinyl tunes, guests can submerge themselves in Quanzhou\u0027s coolest local youth culture while enjoying exceptional food and drinks.", "name": "Akiko Space Coffee", "transport": "Walk into Gouweixia Alley from Chengtian Alley; walk about 3 minutes to see the iconic red-brick entrance gate."}, {"address": "No. 53 Jinyu Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | A signature cafe restored from a century-old traditional Southern Fujian courtyard house, preserving iconic swallowtail eaves and an open central courtyard. Highlights include the \u0027Osmanthus Oolong Latte\u0027 paired with Fujian-style brunch sets, offering a silky, refreshing blend of rich tea aroma and robust espresso. Dining beside the courtyard garden as a gentle breeze passes through lets you savor the peaceful timelessness of this historic haven\u2014a perfect spot for experiencing local architectural heritage.", "name": "Yanlinghui Gu Cuo Coffee", "transport": "Walk along Middle Zhongshan Road, turn into Jinyu Alley, and go straight for about 200 meters."}, {"address": "No. 38 Xinjie, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A delicate little cafe tucked away in West Street\u0027s tranquil alleys, themed around the concept of slow living and enjoying life\u0027s fleeting moments. Their satisfying brunch platter features freshly seared sausage, silky scrambled eggs, and handmade baguettes with spot-on seasoning, perfectly paired with a freshly pulled espresso latte. The cozy courtyard filled with greenery offers a quiet retreat from the bustling main street, making it a hidden gem for peaceful mornings and leisurely afternoon coffees.", "name": "Fusheng Yiji Cafe", "transport": "Turn into Xinjie from West Street and walk about 180 meters."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 37 Kuaxia Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Hidden in an alleyway of the ancient city, this hip bistro perfectly blends traditional Quanzhou dried scad (balang fish) with Western-style craft cocktails. The signature spicy dried scad paired with homemade rice wine cocktail is a must-try\u2014savory, delightfully chewy, and sweetening as you chew, enhancing the liquor\u0027s aroma. Highly popular among tourists and local youth for its rich vintage vibe in an ancient courtyard house, it\u0027s the top choice for experiencing Quanzhou\u0027s slow life and night life.", "name": "Balangyu Cafe \u0026 Bistro", "transport": "About an 8-minute walk from West Street into Kuaxia Lane"}, {"address": "No. 116 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Located in the heart of West Street, this classic local restaurant features antique decor full of Minnan traditional mansion charm. The signature Traditional Ginger Duck is slow-simmered in a clay pot with sesame oil and aged ginger; the skin is crispy, the meat tender and juicy with a rich ginger aroma. The Oyster Omelet is crispy outside, tender inside, bursting with fresh seafood flavor. Preserving authentic traditional recipes, it is a favorite for foodies and family gatherings.", "name": "Quanzhou Fuli Minnan Cuisine", "transport": "Take the Ancient City Xiaobai Mini-bus to Kaiyuan Temple Station, then walk about 2 minutes"}, {"address": "No. 68 Chengtian Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Housed in a renovated heritage building, this retro bistro combines a barbershop, bar, and creative Minnan fusion cuisine. Local specialties like Minnan Deep-fried Vinegar Pork feature a golden crispy crust with juicy, slightly tangy pork and Sichuan pepper aroma, light and refreshing. Pair it with craft cocktails infused with local Tieguanyin tea for a harmonized tea and liquor flavor. Its unique trendy vintage house ambiance attracts countless young travelers for photos.", "name": "Akazi Space \u0026 Bistro", "transport": "Walk into Chengtian Lane, near Chengtian Temple, about 5 minutes on foot"}, {"address": "No. 102 Tumen Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | One of the most famous legendary local restaurants in Licheng District, tantalizing streetgoers with aromas of sesame oil and aged ginger from afar. Premium Muscovy duck is braised to order in purple clay pots with copious aged ginger and sesame oil. The meat absorbs all the rich ginger and wine essence, becoming tender enough to fall off the bone. The savory reduction over steamed rice is perfection\u2014a soul-nourishing staple for visitors.", "name": "Sidan Ginger Duck Restaurant", "transport": "Take Bus K1 to Qingjing Mosque Station, then walk about 3 minutes"}, {"address": "No. 23 Zhuangfu Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | An exquisite restaurant focusing on authentic rural Minnan cuisine, emphasizing fresh ingredients and original flavors. Popular dishes include Chewy Sweet Potato Glutinous Rice Balls with a sweet filling, and Sand Worm Jelly (Tusun Dong)\u2014chilled, refreshing, crisp, and smooth when paired with garlic sauce. Its strict ingredient selection and warm hospitality make it a top-tier venue for authentic banquet-style Minnan dining.", "name": "Linjia Minnan Cuisine", "transport": "About a 6-minute walk from West Street Bell Tower to Zhuangfu Lane"}, {"address": "No. 18 Jinyu Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A cozy bistro blending traditional home-cooked Minnan dishes with handcrafted fruit wines. The Pan-seared Wild Boar Pork has a nicely seared exterior with well-balanced fat, perfectly chewy and savory\u2014ideal with rice. Pair it with house-brewed bayberry or lychee wine for a sweet, refreshing palette cleanser. The serene wooden historic building setting and warm service make it very popular with travelers seeking a quiet night with authentic drinks.", "name": "Chunling Minnan Bistro", "transport": "Turn into Jinyu Lane from Zhongshan Middle Road, walk about 3 minutes"}, {"address": "No. 89 Chongfu Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A long-established Minnan local restaurant deep-rooted in Licheng District, famous for great value and authentic home-style flavors. The signature Quanzhou Sweet Potato Starch Balls dish is silky and rich, slow-simmered with oysters, lean pork, and mushrooms for a savory, smooth broth. The Deep-fried Five-Spice Meat Rolls feature crispy tofu skin wrapping a savory pork and water chestnut filling. It\u0027s a beloved local staple that foodies flock to visit.", "name": "Chongfu Local Minnan Restaurant", "transport": "Take Bus 15 to Chongfu Temple Station to arrive directly"}, {"address": "No. 236 Xinhua North Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | A well-known local Minnan seafood restaurant adjacent to Kaiyuan Temple, focusing on traditional Quanzhou seafood and stir-fries. A top must-order is the Steamed Red Crab with Sticky Rice; plump crabs packed with roe are steamed over sticky rice, allowing every grain to absorb the savory crab essence. The Osmanthus Intestine is crispy outside, tender inside, with captivating aroma. Brightly lit with classic Minnan brick carving accents, it is the premier choice for authentic seafood dishes in the West Street district.", "name": "Gudiankou Minnan Restaurant", "transport": "About a 4-minute walk from the West Gate of Kaiyuan Temple"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Kaiyuan Temple, No. 176 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Located inside the thousand-year-old Kaiyuan Temple, this traditional vegetarian restaurant is best known for its signature \"Arhat Vegetarian Noodles\" and \"Mushroom Vegetarian Steamed Buns\". The noodle broth is slow-simmered with a variety of fruits, vegetables, and mushrooms, offering a sweet, refreshing, and umami-rich flavor. The noodles absorb the rich broth while maintaining a springy texture, paired with hearty mock meat and tender wood ear mushrooms for an unforgettable taste. It is not only the top choice for local pilgrims after worshiping, but also a must-visit spot for tourists to experience Quanzhou\u0027s Zen-inspired culinary culture.", "name": "Kaiyuan Temple Vegetarian Restaurant", "transport": "Take Quanzhou Bus K1 or 26 to Kaiyuan Temple Station, then walk to the destination."}, {"address": "Next to Chengtian Temple, Nanjun Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Tucked away next to the peaceful Chengtian Temple amidst the bustling city, this eatery is famous for its ancient-style \"Quanzhou Traditional Vegetarian Braised Noodles\". The rich braised sauce carries subtle hints of five-spice and soy aroma, clinging perfectly to every noodle strand for a smooth, velvety bite. Served with crispy fried tofu skin and savory mushrooms, it offers a rich texture and delightful fragrance. Many tourists praise the tranquil ambiance here, enjoying guilt-free local delicacies surrounded by lush greenery and temple echoes.", "name": "Chengtian Temple Vegetarian Noodle House", "transport": "Take Bus 2 or 25 to Chengtian Temple Station, then walk for about 3 minutes."}, {"address": "No. 151 Chongfu Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Attached to Chongfu Temple\u2014one of Quanzhou\u0027s three major Buddhist temples\u2014this restaurant specializes in exquisite \"imperial-style vegetarian dishes\" and \"ancient-style vegetarian soup thickeners\". Its signature \"Nine-Grade Lotus Vegetarian Soup\" features a silky-smooth texture that melts in your mouth, blending the rich, savory aromas of mushrooms and tofu. Adhering to low-oil and low-salt cooking, the restaurant perfectly presents the natural flavors of fresh ingredients with clear layers of texture, making it a favorite among health-conscious foodies and traveling families.", "name": "Chongfu Temple Vegetarian Restaurant", "transport": "Take Bus 15 or 22 to Chongfu Temple Station, then walk for about 2 minutes."}, {"address": "No. 165 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | A legendary West Street shop operating for decades, renowned for its paper-thin yet chewy spring roll wrappers. The filling is loaded with rich vegetarian ingredients such as shredded carrots, cabbage, dried tofu, seaweed, and peanut powder. Taking a bite reveals a chewy exterior packed with the natural sweetness of fresh vegetables and the aromatic richness of peanut powder. The sweet-and-savory combination offers the most authentic Southern Fujian flavor, making it an insanely popular grab-and-go street snack on West Street.", "name": "Ya Fo Spring Roll", "transport": "Located inside West Street Pedestrian Street, about a 1-minute walk from Kaiyuan Temple Ziyun Screen."}, {"address": "Next to Fuwenmiao Plaza, Baiyuan Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | A refined vegetarian restaurant adjacent to the Confucian Temple (Fuwenmiao), highly acclaimed for its creative plant-based dishes and signature \"Lily \u0026 Bamboo Shoot Vegetarian Soup\". The broth is crystal clear and sweet, with tender, crunchy bamboo shoots and velvety smooth lily bulbs that leave you feeling refreshed. Combining traditional Southern Fujian ingredients with modern vegetarian concepts, the restaurant features artful presentation and gentle seasonings, making it an ideal choice for tourists seeking a serene dining experience after visiting the temple.", "name": "Fuwenmiao Bodhi Vegetarian Restaurant", "transport": "Take Bus 3 or 19 to Fuwenmiao Station, then walk for about 2 minutes."}, {"address": "No. 238 South Zhongshan Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | A great-value vegetarian buffet located in the South Zhongshan Road commercial area, offering dozens of hot stir-fried veggie dishes, handcrafted dim sum, and nourishing soups. The handmade \"Crispy Vegetarian Cutlet\" is highly recommended\u2014fried to a golden crisp on the outside, rich with soybean aroma and juicy mushroom flavor on the inside, delivering a satisfying crunch with every bite. Affordable prices and a wide variety of choices keep this place packed during peak dining hours.", "name": "Jingxinzhai Vegetarian Buffet", "transport": "Take Bus K1 or 21 to Qiaoguang Cinema Station, then walk for about 3 minutes."}, {"address": "No. 58 Huaxiang Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Hidden in the quaint and historic Huaxiang Alley, this time-honored eatery attracts countless food lovers with its famous \"Vegetarian Satay Noodles\". The signature vegetarian satay broth is slightly spicy and aromatic, blended with generous amounts of peanut butter and spices to create a rich, silky flavor that is never greasy. Toppings like fried tofu pockets and veggie meatballs burst with savory broth when bitten into, delivering an amazing flavor explosion\u2014a must-try for vegetarian lovers of bold flavors.", "name": "Huaxiang Traditional Vegetarian Noodles", "transport": "Turn into Huaxiang Alley from Middle Zhongshan Road and walk for about 150 meters."}, {"address": "No. 112 Xinhua North Road (near West Street), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.1 stars | An affordable vegetarian eatery near West Street in the ancient city, featuring \"Herbal Vegetarian Stewed Soup\" and \"Assorted Vegetarian Stir-Fried Noodles\". The stir-fried noodles are masterfully cooked over high heat, imbued with the smoky aroma of mushrooms and seasonal vegetables, remaining chewy and resilient. The herbal soup offers a subtle sweetness from angelica root and red dates\u2014smooth, gentle, and refreshing, giving travelers a comforting boost of energy. Highly popular among independent travelers and local neighbors.", "name": "Cixin Vegetarian Noodle Shop", "transport": "Take Bus 6 or 601 to Kaiyuan Temple West Gate Station, then walk for about 4 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 165 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Hand-wiped wrappers that are paper-thin yet resilient, filled with freshly stir-fried shredded carrots, cabbage, seaweed peanut powder, and crispy gluten. One bite delivers a rich, sweet and savory flavor that is refreshing and non-greasy. Packed with authentic Southern Fujian nostalgic taste, this decades-old establishment on West Street is a must-try street snack.", "name": "Ya Fo Spring Roll", "transport": "Walk to the opposite side across from Kaiyuan Temple on West Street"}, {"address": "No. 19 Shuimen Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Hair-thin vermicelli cooked in rich pork bone and seafood broth, creating a thick, smooth, melt-in-your-mouth texture. Paired with freshly fried, crispy dough sticks (youtiao) soaked in the soup\u2014soft on the outside and crunchy inside\u2014a rich seafood flavor bursts on your tongue. A classic street food favorite for locals and tourists alike.", "name": "Shuimen Guo Zai Vermicelli Paste", "transport": "Take the Ancient City \u0027Xiao Bai\u0027 minibus to Shuimen Lane Entrance and walk about 100 meters"}, {"address": "No. 59 East Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Firm yet tender glutinous rice stuffed with mushrooms, dried shrimp, scallops, braised pork, and egg yolk, drizzled with a secret sweet \u0026 spicy sauce and rich peanut sauce. Dense, aromatic, and perfectly balancing sweet and savory, every bite is filled with rich ingredients and distinctive zongzi aroma. Highly popular among visitors.", "name": "Hou A Po Meat Zongzi", "transport": "Located near the intersection of East Street and the Clock Tower, about a 3-minute walk from the West Street Clock Tower"}, {"address": "No. 1-3 Tianhou Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Made from boiled and set natural sea moss, this crystal-clear jelly is shredded into fine strips that taste delightfully crisp and refreshing. Served with candied taro, red beans, and honey water, it is light, sweet, and cooling\u2014an essential refreshing dessert while strolling through the ancient city on hot summer days.", "name": "Bing Zheng Tang Jelly Sweets", "transport": "Take the Ancient City \u0027Xiao Bai\u0027 minibus to Tianhou Palace Station"}, {"address": "No. 193 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Made-to-order handmade mochi with an ultra-soft and chewy skin coated in fragrant black sesame or peanut powder. Inside lies a crispy filling of crushed thin crackers and sugar, creating a delightful contrast of soft and crunchy textures. Moderately sweet and non-sticky to the teeth.", "name": "Wu\u0027s Handmade Mochi", "transport": "Walk along West Street towards Kaiyuan Temple"}, {"address": "Inside the alley beside Kaiyuan Temple, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | A traditional Southern Fujian snack similar to fried dough twists (mahua), coated in a thin layer of sugar glaze and savory minced garlic. Exceptionally crunchy with every bite, it strikes a perfect balance between savory garlic and mild sweetness. A uniquely addictive nostalgic street snack of the ancient city.", "name": "Zhuang A Yi Garlic Twist Donuts", "transport": "Walk to the alley next to the East Tower of Kaiyuan Temple on West Street"}, {"address": "No. 242 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Made with plump local Quanzhou oysters mixed with sweet potato starch batter, green garlic, and eggs, pan-fried to a golden crisp. Crispy on the outside and chewy inside, rich juices burst in your mouth with every bite. Served with special Southern Fujian sweet and spicy sauce, offering a delightful lingering flavor.", "name": "Qin A Yi Oyster Omelet", "transport": "Located in the core commercial area of West Street; easily accessible on foot along West Street"}, {"address": "Entrance of Jinyu Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | A unique traditional delicacy of Southern Fujian made from collagen-rich sipunculid worms set into a clear jelly. Cool, springy, and refreshing, it is served dipped in mustard, minced garlic, cilantro, and a signature flavored vinegar sauce. With rich layers of texture and a tangy, savory bite, it\u0027s an exciting local flavor for adventurous foodies.", "name": "Zhuang Ji Tuxun Dong (Sipunculid Worm Jelly)", "transport": "Walk from the West Street Clock Tower along Middle Zhongshan Road to the entrance of Jinyu Lane"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Quanzhou - Licheng Ancient City and West Street Commercial District"}, "wuyishan_resort": {"categories": {"cat_1": {"items": [{"address": "No. 16 Dawang Peak North Road, Jiaoting Village, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Located in the heart of the Sangu Resort Area, this is an iconic, long-standing Northern Fujian mountain delicacy restaurant. The signature Dahongpao Tea-Scented Chicken uses local free-range chicken slow-cooked with premium Dahongpao tea leaves; the meat is tender and juicy, bursting with a rich rock tea aroma and a sweet, caramelized finish that lingers on the palate. The Braised Stream Fish features fresh fish caught from the crystal-clear streams of Wuyi Mountain, boasting delicate, tender flesh with zero muddy taste. With its warm, rustic wooden decor and authentic craftsmanship, it is a top choice for both tourists and locals.", "name": "Chuiyan Shanfang Cai Restaurant", "transport": "Take Wuyishan Bus Route 9 to \u0027Jiaoting Village Station\u0027 and walk for about 3 minutes."}, {"address": "No. 128 Sangu Street, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | A legendary local spot in Wuyishan with decades of heritage, specializing in the iconic \u0027Langu Smoked Goose\u0027. Premium local farm-raised geese are marinated in secret Chinese herbal spices and traditionally smoked using sticky rice and tea leaves. The goose skin boasts a mouthwatering golden hue, delivering a chewy, springy texture infused with a distinct smoky, slightly spicy aroma. The meat remains succulent and tender, richly flavorful. This traditional delicacy is not only a holiday must-have for locals, but also the ultimate souvenir tourists rush to buy before leaving Wuyishan.", "name": "Langu Authentic Smoked Goose", "transport": "Take Wuyishan Bus Route 6 to \u0027Sangu Street Station\u0027 and walk for about 2 minutes."}, {"address": "Near Sangu Farmers Market, Old Street, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | A classic pastry stand carrying memories for generations of Wuyishan locals, renowned for its handmade charcoal-baked Guangbing (Guang pancakes). Freshly baked Guangbing feature a golden, crispy crust that crackles delightfully with every bite, stuffed with juicy, savory scallions and minced pork. The wheaty aroma and savory meat blend harmoniously, creating a crisp-outside, soft-inside texture filled with natural sweet yeast flavor. Many tourists queue up specifically to snag a bag of piping-hot, freshly baked pancakes radiating a smoky charcoal fragrance.", "name": "Sangu Old Street Guangbing Shop", "transport": "Take Wuyishan Bus Route 9 or K1 to \u0027Old Street Station\u0027 and walk for about 5 minutes."}, {"address": "No. 108 Dawang Peak Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 stars | A highly rated traditional establishment deeply rooted in Northern Fujian cuisine, presenting authentic Wuyishan rural banquets through master culinary skill. The must-try \u0027Wengong Dish\u0027 (Assorted Egg Dumplings) offers a smooth, silky texture in an extraordinarily savory broth, rich with cultural stories of the Song Dynasty Neo-Confucian scholar Zhu Xi. The Steamed Mountain Frog (Shilin) features meat as tender as egg whites that melts in your mouth, bathed in a rich, sweet broth that keeps you craving more. Using strictly fresh local ingredients set in an elegant ancient-style atmosphere, it is a quintessential representation of Wuyishan\u0027s traditional culinary culture.", "name": "Yan Wuyi Traditional Minbei Restaurant", "transport": "Take Wuyishan Bus Route K1 or 6 to \u0027Shuizhuangye Station\u0027 and walk for about 3 minutes."}, {"address": "No. 5 Gaosuban Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 stars | A classic breakfast and late-night spot beloved by locals since childhood, specializing in super springy Jiangxi Zixi rice noodles. Hand-extruded from high-quality rice, the noodles soak in a rich pork bone broth simmered for hours. Guests can choose toppings such as hot-and-sour pork liver, tripe, or braised pork intestines\u2014the liver is crisp without any gamey taste, and the intestines are tender and flavor-packed. Slurpable and smooth, combined with zesty, spicy secret chili sauce and an appetizing broth, it keeps diners coming back bite after bite.", "name": "Wuyishan Zixi Rice Noodles Shop", "transport": "Take Wuyishan Bus Route 9 to \u0027Gaosuban Station\u0027 and walk for about 2 minutes."}, {"address": "No. 2 Hengjie, National Tourist Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | A famous traditional shop celebrated for slow-simmered health soups, inheriting the nourishing philosophy of Peng Zu, the progenitor of longevity. The signature \u0027Slow-Cooked Old Duck with Dried Bamboo Shoots Soup\u0027 uses local mature ducks aged over two years, combined with Wuyishan alpine dried winter bamboo shoots and herbal medicines, simmered gently for over four hours. The duck meat falls off the bone and melts in your mouth, while the milky white broth tastes sweet, savory, and lightly fragrant with bamboo and rich duck oil without being greasy at all\u2014offering exceptional nourishing value.", "name": "Pengzhu Old Duck Soup Restaurant", "transport": "Take Wuyishan Bus Route 6 to \u0027Resort Hengjie Station\u0027 and walk for about 1 minute."}, {"address": "No. 58 Sangu Street, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | A popular local eatery brimming with rustic warmth and homestyle hospitality, specializing in authentic farm-style dishes. The \u0027Goose Barnacle Pot\u0027 and \u0027Braised Alpine Bamboo Shoots\u0027 are must-order signatures on every table. The small bamboo shoots are delightfully crisp, sweet, and snappy, filled with the fresh aroma of alpine soil, while the barnacles are intensely flavorful and savory. Every dish preserves the signature high-heat wok hei characteristic of Northern Fujian farm cooking, offering generous portions and unique flavors highly praised by tourists and locals alike.", "name": "A\u0027ma Jia Local Farm Cuisine", "transport": "Take Wuyishan Bus Route K1 to \u0027Sangu Street Station\u0027 and walk for about 4 minutes."}, {"address": "No. 1 Huandao Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | A specialty establishment that seamlessly blends Wuyishan\u0027s rich tea culture with traditional cooking techniques. The restaurant infuses precious Dahongpao tea into various classic dishes, such as \u0027Tea-Infused Braised Pork Belly\u0027, where tender, layered pork melts in your mouth and its richness is perfectly balanced by the tea\u0027s lingering sweet finish. Another highlight is the \u0027Tea-Infused Stream Shrimp\u0027, featuring crispy edible shells carrying a bold roasted tea aroma. This ingenious fusion of tea arts and gastronomy leaves an indelible culinary impression on countless food lovers.", "name": "Impression Dahongpao Tea Feast", "transport": "Take Wuyishan Bus Route 9 to \u0027Impression Dahongpao Theater Station\u0027 and walk for about 5 minutes."}], "name": "Local Legendary Restaurants"}, "cat_2": {"items": [{"address": "No. 38 Dahongpao Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 Stars | Located in the heart of Sangu Resort, this trendy hipster-style cafe seamlessly blends famous local Wuyi rock tea with Western espresso. The signature Dahongpao Latte starts with dense milk foam and rich specialty coffee aroma, followed by deep roasted tea notes and a sweet lingering aftertaste, offering incredible depth of flavor. Paired with fresh-baked thick-cut toast and a fresh fruit yogurt brunch platter, the crisp-outside-soft-inside toast spread with rich butter makes it a huge favorite among young travelers and hipsters visiting Wuyi Mountain.", "name": "One Page Coffee", "transport": "Take Wuyishan Bus K1 or Line 9 to Resort Area Roundabout Station, then walk for about 3 minutes."}, {"address": "No. 1 Jinpanting 2nd Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Hidden inside the Old Street Forest Life Hotel, this forest-themed brunch cafe is filled with lush greenery and warm wooden decor. The must-try Rock Tea Tiramisu soaks traditional ladyfingers in Dahongpao tea broth and espresso, creating a moist, dense texture. Combined with balanced bittersweet cocoa powder and rich mascarpone cheese, it is delightfully sweet without being cloying. Brunch features made-to-order American omelets and German sausages; cutting into the omelet reveals soft-melted cheese and savory mushrooms, making it the perfect spot to enjoy a relaxed morning.", "name": "Old Street Forest Life Coffee", "transport": "Take Bus Line 6 to Sangu Old Street Station, then walk for about 5 minutes."}, {"address": "Zone B, Fengqing Business Street, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Located in the Strolling District, this concept cafe highlights the collision of tea and coffee. The popular Cinnamon Tea Americano uses cold brew infused with premium Wuyi Rougui (cinnamon) tea leaves as a base, combined with medium-dark roast coffee beans. It delivers subtle hints of spice and fruit acidity with a long-lasting sweet aftertaste, remarkably unique and smooth. The brunch platter includes freshly baked croissants and smoked salmon salad; the croissant is golden, flaky, and buttery, making it a hit among international tourists.", "name": "Rock Tea Whispers Coffee", "transport": "Take Wuyishan Bus Line 15 to Sangu Manbu Street Station, then walk for about 2 minutes."}, {"address": "No. 22 Wujiu Road, National Tourism Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 Stars | Boasting an outdoor terrace with magnificent views overlooking Dawang Peak, this cafe is a prime photo spot. Its signature \u0027Shuixian Cold Brew Latte\u0027 infuses Rougui and Shuixian tea aromas, blending milk and tea flavor into a velvety texture. Paired with a custom Eggs Benedict brunch\u2014where cutting the poached egg spills rich golden yolk over freshly toasted English muffins and seared bacon, topped with rich hollandaise sauce\u2014it offers a multi-layered taste experience perfect for soaking up sunshine and scenery.", "name": "Meet Wuyi View Cafe \u0026 Brunch", "transport": "Take Bus K1 to Scenic Area Entrance Station, then transfer to a taxi for about 5 minutes."}, {"address": "No. 12 Song Street, Wuyi Palace, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 Stars | Combining traditional Northern Fujian residential architecture with modern minimalism, this courtyard cafe offers a quiet and elegant ambiance. The house-made Basque Cheesecake paired with a Rougui Tea Latte is a perfect match\u2014the cake features a caramelized exterior and a creamy, melt-in-your-mouth center with rich milk flavor and subtle cheese tang. Brunch highlights whole wheat sandwiches and pour-over coffee crafted from carefully selected single-origin beans, delivering bright citrus acidity and floral notes for a crisp, clean finish\u2014ideal for relaxing after a hike.", "name": "Slow Wuyi Courtyard Cafe", "transport": "Take the scenic area shuttle bus to Wuyi Palace Station, then walk into Song Street for about 3 minutes."}, {"address": "Near No. 1 Bend Pier, Jiuqu Stream Bank, Wuyishan Scenic Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 Stars | A cozy wooden cabin cafe set right beside the stream, allowing guests to sip coffee while listening to babbling water. The signature Pulled Pork Burger Brunch set is immensely popular: slow-cooked, juicy tender pulled pork combined with special smoky BBQ sauce and tangy pickles, tucked between toasted brioche buns for an extraordinarily juicy bite. Paired with a freshly ground Dutch cold drip coffee, its subtle fruity acidity and refreshing cold texture perfectly balance the rich burger, making it a top pick for outdoor hikers needing an energy recharge.", "name": "Tingquan Cabin Coffee", "transport": "Take the scenic area bamboo raft to No. 1 Bend Pier, disembark, and walk for about 4 minutes."}, {"address": "No. 88 Jinghua Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Situated at an elevated location in the resort area, this multi-concept cafe features large floor-to-ceiling windows with abundant natural light. The signature \u0027Dahongpao Affogato\u0027 pours hot espresso and concentrated Dahongpao tea syrup over silky cold vanilla ice cream, creating an explosive play of hot and cold, sweet and bitter, and tea aromas on the palate. Paired with a hearty Avocado \u0026 Bacon French Toast brunch, where golden eggy French toast meets fresh mashed avocado, the savory-sweet balance is delightfully addictive.", "name": "Mountain \u0026 Water Journey Cafe", "transport": "Take Bus Line 9 to Resort Area South Intersection Station, then walk for about 6 minutes."}, {"address": "No. 16 Baihua Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Featuring a minimalist white aesthetic, this Instagrammable brunch cafe offers bright lighting and fresh decor. The signature Souffl\u00e9 Pancakes are made-to-order, fluffy as clouds and melting in your mouth with rich egg aroma, sweet maple syrup, and tangy fresh blueberries and strawberries. Paired with a smooth oat milk latte blending nutty coffee notes and creamy oats, this spot is wildly popular for girls\u0027 gatherings and photo sessions.", "name": "Cloud Walk Light Food \u0026 Coffee", "transport": "Take Bus Line 6 or K1 to Sangu Market Station, then walk for about 4 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 16 Jinpan Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 Stars | Located in the heart of the Sangu Resort Area, this is the perfect spot to sample authentic Wuyishan home-cooked meals. The signature \u0027Chuiyan Pork Large Intestine\u0027 is crispy on the outside and tender inside, rich with savory sauce and a pleasant spicy kick; the \u0027Steamed Red-Eye Fish\u0027 preserves the supreme sweetness of spring-water fish, with surprisingly crispy scales after cooking that foodies love. Combining traditional rustic dishes with a warm, modern bistro vibe, paired with a glass of locally brewed yellow wine, it offers an unforgettable experience.", "name": "Jiujie Chuiyan Mountain House Cuisine", "transport": "Take Wuyishan Bus Route 7 or 6 to Sangu Roundabout Station, then walk about 5 minutes."}, {"address": "No. 18 Resort 1st Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 Stars | Famous for its innovative tea-infused dishes and wild red mushroom cuisine. The highly praised \u0027Da Hong Pao Tea-Infused Chicken\u0027 is firm and juicy, with every bite revealing subtle roasty notes of Cliff Tea and a sweet aftertaste; the \u0027Wild Red Mushroom Free-Range Chicken Soup\u0027 features a striking bright red broth that is extraordinarily savory and deeply satisfying. Its refined decor and cozy dining atmosphere make it a top choice for tourists and local gatherings alike.", "name": "Wuyi Sanjue - Heyue Private Kitchen", "transport": "Take Wuyishan Express Bus K1 to Resort Station, then walk about 8 minutes."}, {"address": "No. 111 Dawang Peak Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | A rare stylish modern craft beer bistro in Wuyishan that seamlessly fuses local tea culture with Western bistro dining. Their original \u0027Da Hong Pao Craft Beer\u0027 is smooth and creamy with a unique mineral tea-malt aroma; paired with the \u0027Langu Smoked Goose Platter\u0027\u2014savory, spicy, crispy-skinned, and pleasantly chewy\u2014it makes for an excellent bar snack. With dazzling evening lights and a relaxed vibe, it\u0027s perfect for young travelers to unwind over drinks.", "name": "Captain Mai Craft Beer \u0026 Bistro", "transport": "Take Wuyishan Bus Route 9 to Shuizhuang Station, then walk 3 minutes."}, {"address": "Next to Jiuqu Stream Pier, Xingcun Town, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Situated right by the Jiuqu Stream, this restaurant specializes in authentic mountain stream seafood and deep-mountain farmstead dishes. The signature \u0027Salt \u0026 Pepper Stream Fish\u0027 is fried to a golden crisp, so tender that even the bones can be eaten effortlessly; \u0027Wengong Meatballs\u0027, a heritage recipe traced back to philosopher Zhu Xi, are silky on the outside and juicy on the inside. The elegant wooden architectural setting radiates rustic charm, making it a favorite for traditional food lovers.", "name": "Jiuqu Renjia Traditional Wuyi Restaurant", "transport": "Take Wuyishan Bus Route 15 to Jiuqu Pier Station, then walk about 2 minutes."}, {"address": "No. 56 Gaosuban Village, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Renowned for generous portions and fresh ingredients, this diner specializes in wild mountain vegetables and native mushrooms. The must-try \u0027Stir-fried Cat\u0027s Claw Mushrooms with Pork\u0027 is pleasantly chewy and crisp with wild forest flavors; \u0027Braised Pork with Dried Bamboo Shoots\u0027 uses local seasonal winter bamboo shoots that absorb the rich pork juices, creating a savory dish that goes amazingly well with rice without feeling greasy. Warm service and genuine local hospitality make every visitor feel at home.", "name": "Xunwei Wuyi Farmhouse Cuisine", "transport": "Take Bus Route 6 to Gaosuban Station, then walk about 4 minutes."}, {"address": "Inside Jiuqu Panshan Villa, Jiaoting Village, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 Stars | Nestled at the edge of the mountain forest, this minimalist private kitchen bistro focuses on premium tea cuisine and local craft spirits. The unique signature \u0027Shuixian Tea Steamed Bamboo-Skewered Prawns\u0027 pairs local fresh prawns with Shuixian tea leaves in a steamer, producing sweet, springy meat with a refreshing tea fragrance; paired with house-brewed \u0027Wuyi Glutinous Rice Green Wine\u0027, it offers a pleasantly smooth, mildly sweet sip. Its zen-like atmosphere attracts countless aesthetic lovers and foodies.", "name": "Yinshi Tea Gourmet Bistro", "transport": "Taking a taxi or driving is recommended; about 10 minutes by car from Sangu Resort Area."}, {"address": "No. 45 Baihua Road, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 Stars | Langu Smoked Goose is Wuyishan\u0027s most iconic intangible cultural heritage dish, and this establishment elevates it to perfection. Using plump grass-fed geese smoked over tea leaves and glutinous rice, the skin achieves a beautiful amber sheen with a delightfully chewy texture. The meat delivers rich smoky aromas blended with camphor leaf notes and a satisfying spicy kick. The restaurant also serves homemade hawthorn wine\u2014sweet, sour, and refreshing\u2014making it a top local spot for late-night meals.", "name": "Langu Smoked Goose Local Bistro", "transport": "Take Bus Route 2 to Baihua Road Intersection Station in the city center, then walk about 3 minutes."}, {"address": "No. 8 Manting Peak Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Boasting stunning views of Dawang Peak, this combo venue merges Northern Fujian specialties with a scenic bar experience. \u0027Stir-fried Eggs with Wild Nostoc\u0027 uses mountain wild black fungus, creating a silky texture with rich egg flavor; \u0027Pork Rib Soup with Anoectochilus (Jin Xian Lian)\u0027 offers a subtly sweet, mildly bitter herbal broth known for its health benefits. Sitting on the outdoor terrace, sipping craft tea cocktails while enjoying local cuisine against the Wuyi mountain backdrop makes for an unforgettable experience.", "name": "Camellia Blooms Folk Restaurant", "transport": "Take Bus Route 9 to Manting Peak Road Intersection Station, then walk about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Tianxin Yongle Temple, Wuyishan Scenic Area, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Located deep inside Wuyi Mountain Scenic Area within the Tianxin Yongle Temple, this vegetarian restaurant is famous for its pure, natural dishes infused with Wuyi Rock Tea aromas. The menu focuses on fresh mountain vegetables, tofu, and wild mushrooms. The classic \u0027Rock Tea Tofu\u0027 is crispy on the outside and tender inside, subtly carrying the delicate fragrance of tea. Smooth and refreshing without feeling heavy, it is a favorite among pilgrims and travelers seeking tranquility.", "name": "Tianxin Yongle Temple Vegetarian Restaurant", "transport": "Take the scenic area shuttle bus to Shuiliandong Station or Dahongpao Station, then walk to the temple."}, {"address": "Inside Zhizhi An Hermitage, Southern Foot of Dawang Peak, Wuyishan National Park, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Situated at the southern foot of Dawang Peak inside the Taoist Zhizhi An Hermitage, this spot offers traditional health-focused Taoist vegetarian dishes made according to ancient methods. The signature dish, \u0027Jiuqu Spring Bamboo Shoots,\u0027 uses crisp and sweet local bamboo shoots paired with steamed handmade mushroom balls. Refreshing and full of wild natural flavors, it is an ideal choice to nourish body and mind after a mountain hike.", "name": "Zhizhi An Taoist Vegetarian Cuisine", "transport": "Walk about 15 minutes along the bamboo raft trail from Yiqu Pier in Wuyishan."}, {"address": "No. 108 Sangu Street, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | An exquisite restaurant combining Wuyishan\u0027s Dahongpao tea culture with modern vegetarian concepts. The specialty \u0027Dahongpao Vegetarian Dongpo Pork\u0027 uses konjac and shiitake mushrooms skillfully layered to mimic fatty and lean textures. Bouncy yet velvety on the palate, with a rich roasted rock tea aroma, it successfully reinvents traditional vegetarian cuisine and is immensely popular among young travelers.", "name": "Yi Qu Xiang Si Tea Vegetarian Restaurant", "transport": "Take Wuyishan Bus K1 or Line 6 to Sangu Jiekou Station, then walk for about 3 minutes."}, {"address": "No. 18 Dawangfeng Road, National Tourist Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 stars | Specializing in elegant, minimalist tea-infused vegetarian omakase, this place perfectly blends local Wuyishan tea leaves with organic seasonal vegetables. The \u0027Rougui Tea Vegetarian Tempura\u0027 coats seasonal wild greens in a special tea batter before deep-frying. Golden and crispy without being oily, every bite releases the unique spicy aroma of Rougui cinnamon tea and the juicy sweetness of fresh vegetables.", "name": "Yin Shan Tea Vegetarian Monastery", "transport": "Take Bus Line 9 to Dawangfeng Road Station, then walk 200 meters."}, {"address": "No. 25 Xianguan Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 stars | A down-to-earth local vegetarian eatery located in the resort area, highly praised for its great value and authentic home-style flavors. The signature \u0027Wuyi Sour \u0026 Spicy Vegetarian Rice Noodle\u0027 pairs local thick rice noodles with special pickled bamboo shoots and wood ear mushrooms. The tangy and spicy broth is appetizing, and the chewiness of the noodles makes it a popular quick pick-me-up for hikers after a long trek.", "name": "A Ming Vegetarian Restaurant", "transport": "Take Bus Line 6 to Xianguan Lukou Station, then walk for about 5 minutes."}, {"address": "No. 8 Baihua Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 stars | An affordable buffet restaurant serving dozens of healthy vegetarian dishes. Options range from steamed dim sum and stir-fried vegetables to vegetarian sushi and handmade bean products. The freshly pan-fried \u0027Vegetarian Savory Pancake\u0027 boasts a crispy crust and a sweet, flavorful filling of mushrooms and cabbage. Clean, hygienic, and varied, it is highly recommended by backpackers and tour groups alike.", "name": "Ci Xin Vegetarian Buffet", "transport": "Take Bus K1 to Resort Area Roundabout Station, then walk about 400 meters."}, {"address": "Inside Dahongpao Resort, No. 199 Dawangfeng Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | A serene vegetarian restaurant tucked inside a high-end resort villa, focusing on health-conscious Zen dining. The recommended \u0027Golden Broth Silken Tofu\u0027 uses a rich pumpkin broth base combined with smooth handmade tofu and snow fungus. Delicate, velvety, and melt-in-your-mouth, with a naturally sweet broth, it delivers both a visual and culinary delight\u2014ideal for guests seeking a premium dining experience.", "name": "Dahongpao Resort - Su Xiang Chai", "transport": "It is recommended to take a taxi or the hotel\u0027s private shuttle directly to Dahongpao Resort."}, {"address": "Next to the entrance of Shuiliandong Scenic Area, Wuyishan Scenic Area, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Created by the heritage Wuyishan tea brand Ruiquan, this tea vegetarian canteen infuses rich tea culture into every dish. Must-try item \u0027Shuixian Tea Steamed Vegetarian Dumplings\u0027 features thin, chewy dumpling wrappers stuffed with mushrooms and bamboo shoots infused with floral Shuixian tea aroma. Each bite releases sweet, savory juices followed by a lingering tea sweet aftertaste, making it a favorite among tea lovers and vegetarian foodies alike.", "name": "Ruiquan Tea Vegetarian Canteen", "transport": "Take the scenic area shuttle bus to Shuiliandong Station; the venue is visible right after getting off."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 128 Sangu Street, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 Stars | This is one of Wuyishan\u0027s most iconic spicy street foods. Carefully selected local grass-fed geese are smoked over cinnamon bark and camphor leaves, then marinated in custom glutinous rice wine and secret tea-infused chili oil. Biting into it reveals springy skin packed with rich wood-smoked and tea aromas, paired with firm, juicy, and fiery meat. The more you chew, the tastier it gets\u2014an absolute must-buy snack to pair with drinks or enjoy on a stroll for both tourists and locals.", "name": "Langu Smoked Goose Shop (Langu Guizhua Smoked Goose)", "transport": "Take Bus K1 or 9 to \u0027Sangu Jiekou Station\u0027, then walk for about 2 minutes."}, {"address": "No. 15 Jiujie Street Intersection, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Carrying a century of tradition, these Wuyishan charcoal-baked Guangbing cakes emit an irresistible aroma of roasted dough and sesame seeds fresh out of the oven. The crust is amazingly crispy with a satisfying crunch, while the inside features the subtle tang of fermented dough blended with savory minced meat filling. Compact and perfect for eating on the go, its rich crispy-outside-soft-inside texture and historic backstory draw countless visitors.", "name": "Zhuzi Filial Piety Guangbing Stall (Traditional Charcoal-Baked Cakes)", "transport": "Take City Bus 9 to \u0027Jiujie Station\u0027, then walk for about 1 minute."}, {"address": "No. 8 Gaosuban Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Zixi rice noodles are a distinctive thick rice noodle native to Wuyishan, offering a smoother, springier, and chewier texture than ordinary rice noodles. Soaking up rich broth simmered from pork bones and shiitake mushrooms, then topped with pickled mustard greens, cilantro, and special chili sauce, every bite is sour, spicy, fresh, and delightfully chewy. Locals love starting their day or hitting the night market with a piping hot bowl to wake up their appetite.", "name": "Chuiyan Zixi Rice Noodles (Classic Zixi Rice Noodles)", "transport": "Take Bus 6 to \u0027Gaosuban Station\u0027, then walk for about 3 minutes."}, {"address": "Stall 7, Old Street Food Court, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 Stars | Made with wild mugwort juice kneaded into glutinous rice skin, these treats feature an inviting emerald green color. They come in two flavors: savory (filled with shredded bamboo shoots, dried tofu, and diced mushrooms, delivering a soft and savory bite) and sweet (stuffed with aromatic crushed sesame and peanuts that burst with flavor upon biting). Chewy without sticking to your teeth and infused with a natural herbal aroma, it\u0027s the most popular walking dessert at spring and summer markets.", "name": "Old Street Traditional Qingmingguo", "transport": "Take Bus 9 to \u0027Jiujie Market Station\u0027, then walk for about 2 minutes."}, {"address": "No. 168 Dawangfeng Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 Stars | Prepared using traditional methods with locally harvested Wuyishan grass jelly herb, served with taro balls, red beans, and condensed milk. The grass jelly is silky smooth, gliding over the tongue with a subtle natural herbal bittersweet note, followed by sweet condensed milk and chewy taro balls for a refreshingly chilled bite. Having a bowl after exploring Wuyishan on a hot day is incredibly refreshing, making it a huge hit among young travelers and social media enthusiasts.", "name": "Xue Ting Chang Grass Jelly Dessert Shop", "transport": "Take Bus 1 or K1 to \u0027Dawangfeng Road Station\u0027, then walk for about 4 minutes."}, {"address": "Stall A12, Sanjiaoting Night Market Area, Urban Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 Stars | A wildly popular night market stall serving fresh stir-fried river snails raised in local mountain stream waters. Wok-tossed over high heat with perilla leaves, mint, chili, and Wuyi red rice wine, the snail meat is firm and bouncy\u2014easily picked out to enjoy. The palate is greeted first by the aromatic herbiness of perilla, followed by an explosion of spicy, savory sweetness that keeps you reaching for more. A quintessential delicacy for experiencing local night market culture.", "name": "Sanjiaoting Night Market Stir-Fried River Snails Stall", "transport": "Take Bus 2 to \u0027Sanjiaoting Station\u0027, then walk for about 2 minutes."}, {"address": "No. 88 Jiujie Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Fresh pork leg meat is pounded into paste, blended with sweet potato starch, and hand-scraped straight into boiling broth. The pork dumplings have a delightfully bouncy and crispy bite, bursting with savory juice and texture. Served in a light, sweet broth with seaweed and dried baby shrimp, topped with pickled peppers and cilantro, it offers a warm, sour, and spicy bowl of comfort that warms the soul on Wuyishan\u0027s streets.", "name": "Old Street Traditional Minced Pork Soup", "transport": "Take Bus 9 to \u0027Jiujie Station\u0027, then walk for about 3 minutes."}, {"address": "No. 35 Sangu Food Street, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 Stars | Made using premium tofu crafted from high-quality soybeans native to Wufu Ancient Town in Wuyishan. Pan-fried until the skin turns golden and crispy, the filling features soft, tender tofu mixed with minced shiitake mushrooms and pork. Crunchy on the outside and tender on the inside, it bursts with rich soybean flavor, elevated by a special garlic chili sauce. A savory, flavorful street snack loved by people of all ages.", "name": "Wufu Ancient Town Tofu Cake Stall", "transport": "Take Bus K1 to \u0027Sangu Food Street Station\u0027, then walk for about 1 minute."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Nanping - Wuyishan National Park and Resort Area"}, "xiamen_huandao": {"categories": {"cat_1": {"items": [{"address": "No. 25 Guoguang Li, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | A long-established local open-air seafood stall in Zengcuo\u0027an, famous for its transparent pricing and live seafood prepared to order. The signature \u0027Stir-fried Squid with Sauce\u0027 is springy, firm, sweet, and juicy, while the \u0027Salt and Pepper Mantis Shrimp\u0027 boasts a crispy shell bursting with savory plump meat. Paired with a cold beer, it\u0027s incredibly satisfying\u2014a favorite among night market late-night snackers and seafood connoisseurs.", "name": "Yajian Seafood Restaurant", "transport": "Take Bus 29 or B2 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 312 Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Dedicated to recreating nearly lost classic Xiamen dishes, this restaurant is highly praised by celebrities and food critics alike. The signature dish \u0027Crispy Taro Paste\u0027 uses top-quality Betel Nut Taro, offering an extremely smooth, rich taro flavor with a lightly crispy outer crust. The \u0027Golden Xiangshan Chicken\u0027 features crispy skin and tender, juicy meat. Recreating the quaint dining ambiance of a prominent traditional Southern Fujian household, it is the top choice for authentic Xiamen banquet cuisine.", "name": "Tangyan Vintage Xiamen Cuisine - Huandao Road Branch", "transport": "Take Bus 18 or 29 to \u0027Zhenzhuwan Station\u0027, then walk for about 5 minutes."}, {"address": "Next to Tianhou Temple, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A famous traditional Southern Fujian snack shop featured on the hit food documentary \u0027A Bite of China\u0027. The signature \u0027Five-Spice Pork Roll\u0027 combines premium pork leg meat with water chestnuts and five-spice powder, wrapped in bean curd skin and deep-fried fresh to a golden crispness. Each bite offers a satisfying crunch, revealing a juicy, flavorful filling balanced by crisp water chestnuts. Drizzled with special sweet and spicy sauce, it creates a delicious balance of sweet and savory\u2014a classic street snack you must try while strolling through Zengcuo\u0027an.", "name": "Ajie Five-Spice Pork Rolls - Zengcuo\u0027an Branch", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter through the Cultural and Creative Village archway, and walk for about 200 meters."}, {"address": "No. 111 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A famous classic Southern Fujian savory rice dumpling store adhering to decades of traditional recipe techniques. The rice dumplings are large and satisfyingly dense, packed with braised pork belly, mushrooms, chestnuts, and dried scallops. The glutinous rice absorbs all the savory braising liquid, becoming delightfully chewy and aromatic. Served with special peanut sauce and sweet spicy sauce, the blend of savory richness with subtle peanut sweetness creates a rich, layered flavor that leaves both tourists and local foodies craving more.", "name": "1980 Minnan Meat Dumplings - Zengcuo\u0027an Branch", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the village\u0027s main street, and walk for about 4 minutes."}, {"address": "No. 4567 Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A long-established seafood restaurant located along the prime coastline of Huandao Road, offering panoramic ocean views alongside traditional Southern Fujian and Cantonese dim sum and seafood feasts. The \u0027Steamed Deep-Sea Giant Grouper\u0027 features firm, springy, extremely sweet flesh, while the \u0027Minnan Buddha Jumps Over the Wall\u0027 boasts a rich, savory broth filled with tender abalone and sea cucumber. Elegant and spacious, enjoying authentic seafood while taking in the blue sea makes this the classic top choice for family gatherings and entertaining guests in Xiamen.", "name": "Jiali Seafood Restaurant - Huandao Road Branch", "transport": "Take Bus 29 or B2 to \u0027Huangcuo Beach Station\u0027, then walk for about 2 minutes."}, {"address": "No. 139 Zengcuo\u0027an Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | A classic Shacha noodle shop tucked in the alleyways of Zengcuo\u0027an that insists on traditional methods. The savory and rich Shacha broth is slow-simmered with pork bones, peanut paste, and dozens of spices, creating a mildly spicy, rich, and smooth soup base. Diners can customize their bowl with fresh pig intestine, shrimp, squid, tofu, and other toppings. The oil noodles soak up the rich broth, offering a deliciously satisfying flavor that leaves every guest raving.", "name": "Zongji Shacha Noodles - Zengcuo\u0027an", "transport": "Take Bus 29 or 751 to \u0027Zengcuo\u0027an Station\u0027, and walk about 300 meters from the Cultural and Creative Village entrance."}, {"address": "No. 72 Jiaotang Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A famous traditional Southern Fujian sweet soup shop honoring arkling water and fresh lemon juice, yielding a tangy, bubbly taste that is ultimate thirst-quenching heat relief. Pair it with the house signature \u0027British Scones with Blueberry Jam\u0027\u2014crispy outside, fluffy inside, with rich buttery flavor\u2014making it the perfect light brunch while watching the sunset.", "name": "Kafka by the Sea Cafe", "transport": "Take Bus 29 or B2 to \u0027Zengcuo\u0027an Bathing Beach Station\u0027, then walk for about 2 minutes."}, {"address": "No. 1382 Huandao East Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A relaxing oceanfront haven offering front-row views of the azure sea, where guests can enjoy an exquisite brunch to the sound of waves. The signature \u0027Osmanthus Latte\u0027 blends natural osmanthus syrup with espresso, delivering subtle floral undertones and rich milkiness with a balanced sweetness. The brunch staple \u0027Beef \u0026 Cheese Panini\u0027 is grilled to perfection with a super crispy crust, filled with juicy beef and gooey melted cheese, highly praised by visitors.", "name": "1382 Ocean View Cafe", "transport": "Take Bus 18 to \u0027Xitouxia Station\u0027, then walk along the seaside boardwalk for about 4 minutes."}, {"address": "No. 48 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | A characterful cafe infused with local Minnan fishing village culture, decorated with charming retro vintage items. The signature \u0027Seaweed Jelly Cold Brew Special\u0027 creatively incorporates Xiamen\u0027s local dessert\u2014shihua jelly (agar jelly)\u2014into cold brew coffee. The chewy, refreshing jelly pairs seamlessly with fruity cold brew for a unique, multi-layered mouthfeel. Accompanied by the \u0027Traditional Taro Paste Toast\u0027 featuring smooth, aromatic, moderately sweet taro paste, it is an unbeatable choice for experiencing local creative coffee culture.", "name": "Balangyu Coffee", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, then walk into the creative village for about 4 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Next to Guoguang School, Zengcuo\u0027an, Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 Stars | Tang Yan is an iconic retro Minnan restaurant in Xiamen that has attracted numerous celebrities. The signature dish, \"Crispy Taro Paste Duck,\" features an extraordinarily crispy crust with a smooth, sweet taro paste filling that seamlessly blends with the savory duck meat\u2014rich in layers yet completely non-greasy. The \"Yellow Croaker Noodle Soup\" captures the essence of the ocean in a sweet, rich fish broth, with silky noodles absorbing every drop of flavor. Decorated in a nostalgic Republic-era style, it\u0027s the perfect spot to experience authentic old Xiamen restaurant dining and traditional handmade dishes.", "name": "Tang Yan - Old Xiamen Cuisine", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 312 Huandao South Road, Siming District, Xiamen City, Fujian Province (near Zengcuo\u0027an Waterfront)", "feature": "\u2b50 4.6 Stars | Situated right along the Huandao Road coastline, offering prime front-row ocean views and a romantic dining atmosphere. The bistro highlights traditional Minnan seafood and creative island-inspired cocktails. The must-try \"Seared Crab\" uses full female crabs bursting with roe, seared to golden perfection with fragrant sesame oil and ginger slices\u2014yielding firm, succulent meat and rich, flavorful roe. Paired with the signature \"Xiamen Sea Breeze\" cocktail under a gentle ocean breeze, it is immensely popular among young travelers and couples.", "name": "Linhai No.5 Seafood Bistro", "transport": "Take Bus 18 or 29 to \u0027Shufa Guangchang (Calligraphy Square) Station\u0027, then walk along the coastal boardwalk for about 5 minutes."}, {"address": "Next to Tianhou Temple, Zengcuo\u0027an Cultural Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 Stars | A highly popular local seafood restaurant located in Zengcuo\u0027an Cultural Village, renowned for live seafood caught and cooked on the spot with transparent pricing. The \"Stir-fried Abalone in Rich Sauce\" offers an amazingly springy, crisp texture coated in savory sauce. The \"Blanched Octopus\" is an old Xiamen favorite\u2014blanched to precise perfection for a sweet, crunchy bite, especially refreshing when dipped in custom mustard soy sauce. With a vibrant and lively atmosphere, it showcases authentic local seafood stall and stir-fry culture.", "name": "A-Lang Seafood \u0026 Minnan Cuisine", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the main street of the Cultural Village, and walk for about 200 meters."}, {"address": "No. 193 Jiaotang Street, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 Stars | Housed in a renovated historic Minnan building, this stylish retro bistro blends traditional handmade seafood dishes with a refined bar experience. The popular \"Tong\u0027an Braised Pork\" is slow-cooked until melt-in-your-mouth tender, rich without being greasy, deeply infused with the aromas of mushrooms and dried shrimp. Paired with the signature \"Oolong Tea-infused Whisky,\" the smooth tea notes elegantly balance the richness of the meat, delivering a stunning modern food-and-drink pairing experience. It\u0027s a trendy evening gathering spot for foodies and hipsters alike.", "name": "1932 Seafood \u0026 Wine Bistro", "transport": "Take Bus 47 or 112 to \u0027Zengcuo\u0027an Station\u0027, enter the alley of Jiaotang Street, and walk for about 4 minutes."}, {"address": "No. 18 Qigannei Street, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 Stars | Tucked away in the alleys of ctly with drinks\u2014the squid features a crispy coat locking in fresh juices, matched brilliantly with the signature \"Xiamen Kumquat Craft Beer,\" whose sweet and tangy citrus notes refresh the palate. With outdoor seating bathed in cool evening breezes, it\u0027s the ultimate relaxing spot to enjoy Zengcuo\u0027an nightlife.", "name": "Shihai Craft Beer \u0026 Seafood Bistro", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, then walk into Zhongshan Street in the Cultural Village for about 5 minutes."}, {"address": "3rd Floor, No. 458 Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 Stars | A rooftop open-air bistro along the coast of Huandao Road, boasting an unbeatable 270-degree ocean view. Specializing in Minnan stir-fries that blend tradition and innovation alongside signature cocktails. Highlights include \"Stir-fried Clams with Minnan Basil\"\u2014plump and juicy with rich herbal aromas\u2014and \"Fish Fillets in Golden Pickled Cabbage Soup,\" featuring paper-thin, silky fish in a zesty, appetizing broth. Dining here at dusk allows you to watch stunning sunsets sinking into the horizon while sipping crafted drinks, making it a dream check-in spot for countless travelers.", "name": "Zui Mei Hai An Ocean Bistro", "transport": "Take Bus 18, 29, or B2 to \u0027Tatou Station\u0027, then walk for about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Nanputuo Temple, No. 515 Siming South Road, Siming District, Xiamen City", "feature": "\u2b50 4.6 stars | The pinnacle of century-old Minnan temple vegetarian cuisine, crafted strictly with fresh seasonal vegetables and mushrooms. The signature dish, \u0027Half Moon Sinking into the River\u0027 (Banyue Chenjiang), features a silky-smooth texture with a fresh, sweet, and delicious broth. The aroma of shiitake mushrooms and Angelica sinensis unfolding on your tongue is simply marvelous. The \u0027Nanputuo Vegetarian Pastry\u0027 is an iconic street snack famous nationwide, featuring flaky, multi-layered crust and a melt-in-your-mouth filling of mung bean paste and mushrooms that is perfectly sweet without being cloying. It\u0027s a must-try delicacy that draws queues of both tourists and locals alike.", "name": "Nanputuo Vegetarian Restaurant", "transport": "Take Bus 45, 87, or B7 to \u0027Xiamen University (Nanputuo)\u0027 Station, then walk for about 3 minutes."}, {"address": "No. 268, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City", "feature": "\u2b50 4.4 stars | A cozy vegetarian eatery tucked away in the alleyways of Zengcuo\u0027an Cultural and Creative Village, focusing on creative plant-based meats and Minnan-style snacks. A must-order is the \u0027Vegetarian Oyster Omelet\u0027, made with wakame seaweed and sweet potato flour, pan-fried until golden and crispy on the edges yet soft and chewy inside. Served with a special sweet chili sauce, its realistic texture and aromatic flavor come highly recommended by tourists and plant-based food lovers.", "name": "Zengcuo\u0027an Suwei Xinxiang Veggie Restaurant", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an\u0027 Station, walk into the alleyway along Zhongshan Street inside the village for about 5 minutes."}, {"address": "No. 180 Zengcuo\u0027an Community, Huandao South Road, Siming District, Xiamen City", "feature": "\u2b50 4.3 stars | A budget-friendly, high-value vegetarian buffet restaurant near Huandao South Road, serving over 50 varieties of delicate plant-based dishes and stir-fries daily. The popular \u0027Vegetarian Misua Thick Soup\u0027 features a rich, perfectly thickened broth with sweet potato noodles and shredded shiitake mushrooms. Silky, warming, and comforting, it is a favorite among local residents and budget travelers.", "name": "Jingxin Vegetarian Buffet", "transport": "Take Bus 29 or 751 to \u0027Zengcuo\u0027an Kezhan Street\u0027 Station, then walk balance of sweet and savory leaves an unforgettable lingering taste.", "name": "Bodhi Vegetarian Snacks", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an\u0027 Station, enter via Guoguang Road and walk for about 4 minutes."}, {"address": "Next to Music Square, Huandao South Road, Siming District, Xiamen City", "feature": "\u2b50 4.4 stars | A scenic vegetarian restaurant enjoying prime front-row ocean views along Huandao Road, where guests can dine while feeling the refreshing sea breeze. The classic \u0027Emerald and White Jade Soup\u0027 combines fresh spinach puree with diced tofu and bamboo fungus. Silky, light, and naturally sweet without feeling heavy, it offers a dual feast for both the eyes and palate, making it a favorite for photos and vacationing tourists.", "name": "Guanhai Suxinzhai Vegetarian", "transport": "Take Bus 29 or B2 to \u0027Yinyue Guangchang (Music Square)\u0027 Station, then walk for 2 minutes along the seaside boardwalk."}, {"address": "No. 55 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City", "feature": "\u2b50 4.0 stars | A time-honored vegetarian stall that has accompanied locals for years, renowned for authentic ingredients and reasonable prices. Highly recommended are the \u0027Vegetarian Peanut Soup and Steamed/Fried Vegetarian Taro Bun\u0027. The taro bun skin is made from fresh mashed taro stuffed with shiitake mushrooms and diced bamboo shoots, steamed to soft and fragrant perfection. Paired with a bowl of hot peanut soup simmered until silky, melt-in-your-mouth tender, it forms a quintessential Minnan sweet-and-savory combo.", "name": "Qingxin Vegetarian Traditional Snacks", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an\u0027 Station, walk along the main Zhongshan Street for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 141 Church Street, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A hugely popular viral queue-worthy snack located on Church Street in Zengcuo\u0027an, famous for its made-to-order, generously sized thick toast slices. The toast is baked to a golden crisp on the outside while remaining soft and fluffy inside. Layered with thick custom ice cream, matcha spread, or rich cheese, each bite delivers a striking hot-and-cold sensation. The crispy crust melts together with the rich, sweet spread, making it a favorite among young travelers and dessert lovers\u2014perfect for snacking while walking around.", "name": "Axin Thick Toast", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 163 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | A must-try classic Southern Fujian street food when visiting Xiamen. Fresh, plump local oysters are pan-fried on a large flat griddle with sweet potato starch batter and green garlic until golden and crispy. Crispy on the outside and tender on the inside, the oysters are juicy, sweet, and free of fishiness. Drizzled with a special Southern Fujian sweet and spicy sauce, it offers a savory-sweet flavor with a subtle smoky aroma, complemented by the uniquely chewy starch\u2014a delicious local highlight first-time visitors shouldn\u0027t miss.", "name": "Guoyitang Oyster Omelet", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the Cultural and Creative Village, and walk for about 5 minutes."}, {"address": "No. 178 Zengcuo\u0027an Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | A traditional classic dessert shop nestled in the ancient village of Zengcuo\u0027an. The peanut soup is slow-simmered for hours; the peanuts stay whole yet melt in your mouth, suspended in a creamy, rich, milky-white broth that is satisfyingly sweet without being cloying. Paired with freshly fried, crispy youtiao (Chinese fried dough sticks) dipped into the warm, fragrant soup, the combination of crispy dough absorbing the sweet soup is a beloved nostalgic afternoon tea treat for both Xiamen locals and tourists.", "name": "Zeng\u0027s Family Peanut Soup", "transport": "Take Bus 47 or B2 to \u0027Zengcuo\u0027an Station\u0027, then walk along the main street for about 4 minutes."}, {"address": "No. 27 Guoguang Road, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | An established satay noodle stall on Zengcuo\u0027an Snack Street. The rich broth is painstakingly brewed with dried shrimp, peanut butter, sesame paste, and various aromatic spices, yielding a savory, nutty, mildly spicy, and slightly sweet flavor. Served with smooth, springy alkaline noodles, customers can customize their bowls with fresh prawns, squid, pork liver, tofu strips, and more. Slippery noodles soaked in flavorful satay broth deliver layers of rich aroma\u2014the perfect hot street meal to refuel during a day of shopping.", "name": "Wulan Satay Noodles", "transport": "Take Bus 29 or 112 to \u0027Zengcuo\u0027an Station\u0027, then walk into the alleyway to find the shop."}, {"address": "No. 58 Qigannei Street, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | One of Xiamen\u0027s most distinct traditional seafood street snacks, made from wild sipunculid worms boiled to release natural collagen that cools into a savory jelly. Crystal clear in appearance, it has a bouncy, jelly-like texture with a refreshing crunch and sweet sea flavor inside. Diced and dipped in wasabi, minced garlic, aromatic vinegar, and signature sweet-spicy sauce, it offers a vibrant blend of sour, spicy, and savory notes\u2014chilly, crisp, and highly recommended for adventurous foodies.", "name": "Zengcuo\u0027an Sand Worm Jelly", "transport": "Take Bus 857 or 29 to \u0027Zengcuo\u0027an Station\u0027, then walk into the village\u0027s cultural district for about 6 minutes."}, {"address": "No. 3 Qigannei Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.1 stars | A popular grab-and-go snack in Zengcuo\u0027an infused with Taiwanese night market flair. A juicy, charcoal-grilled black pork sausage is sliced open and nestled inside a grilled, soft, chewy sticky rice sausage. Stuffed with pickled mustard greens, shredded cucumber, garlic slices, and sweet chili sauce, it combines a chewy exterior with savory, juicy meat and refreshing pickled crunch inside. Convenient to eat on the go, it\u0027s an excellent energy-boosting street snack after biking along Huandao Road.", "name": "Alishan Sausage in Glutinous Rice Roll", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, then walk about 2 minutes to the market at the village entrance."}, {"address": "No. 72 Seafood Street, Zengcuo\u0027an, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | An iconic traditional handmade pastry snack along Huandao Road. Featuring a golden, buttery, crumbly crust filled with fresh shredded coconut and a rich, milky filling. Served fresh and warm, the flaky pastry crumbles delightfully while the moist, chewy coconut center offers a pleasantly subtle sweetness and rich coconut aroma. Perfect as a coastal stroll treat or a widely popular boxed souvenir to share with family and friends.", "name": "Zengcuo\u0027an Coconut Cake", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an Station\u0027, then walk along Seafood Street for about 3 minutes."}, {"address": "No. 102 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | A classic Southern Fujian meat rice dumpling made with a time-honored recipe. Stir-fried glutinous rice is wrapped around savory pork belly, dried mushrooms, chestnuts, salted egg yolk, and scallo
