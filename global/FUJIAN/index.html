<script>
    // --- 1. 圖片輪播邏輯 ---
    const track = document.getElementById('carousel-track'); 
    let slide = 0;
    setInterval(() => { 
        slide = (slide + 1) % 3; 
        const translatePercentage = window.innerWidth >= 768 ? 88 : 93; 
        if(track) track.style.transform = `translateX(-${slide * translatePercentage}%)`; 
    }, 3000);

    // --- 2. 即時時間顯示 ---
    function updateTime() {
        const now = new Date();
        const options = { month: 'short', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' };
        const timeDisplay = document.getElementById('datetime-display');
        if(timeDisplay) timeDisplay.innerText = now.toLocaleDateString('zh-TW', options);
    }
    updateTime();
    setInterval(updateTime, 60000);

    // --- 3. 即時天氣 API (開源 wttr.in) - 終極免疫版 ---
    async function fetchWeather() {
        try {
            const city = "Fujian".replace(/\s+/g, ''); 
            // 改回原本的精簡格式請求
            const response = await fetch(`https://wttr.in/${city}?format=%c+%t`);
            
            const weatherDisplay = document.getElementById('weather-display');
            if (response.ok && weatherDisplay) {
                let weatherText = await response.text();
                
                // 1. 第一層防禦：粗暴地移除所有 HTML 標籤
                let cleanText = weatherText.replace(/<[^>]*>?/gm, '');
                
                // 2. 狙擊目標 A：精準抓取「溫度數字與單位」 (例如 +29°C, -5°C, 30°C)
                const tempMatch = cleanText.match(/([+-]?\d+°[CF])/);
                
                // 3. 狙擊目標 B：精準抓取「天氣 Emoji」 (過濾出 Unicode 圖形符號)
                const emojiMatch = cleanText.match(/([\u2600-\u2B55\uD83C-\uD83E\uDC00-\uDFFF\uFE0F]+)/);

                // 4. 組合純淨結果
                if (tempMatch) {
                    const temp = tempMatch[1];
                    const icon = emojiMatch ? emojiMatch[1] : '🌤️'; // 如果抓不到圖示，給個預設太陽
                    weatherDisplay.innerHTML = `${icon} ${temp}`;
                } else {
                    weatherDisplay.innerHTML = '<i class="ph ph-warning-circle"></i> 暫無天氣';
                }
            } else if (weatherDisplay) {
                weatherDisplay.innerHTML = '<i class="ph ph-warning-circle"></i> 暫無天氣';
            }
        } catch (error) {
            const weatherDisplay = document.getElementById('weather-display');
            if (weatherDisplay) {
                weatherDisplay.innerHTML = '<i class="ph ph-warning-circle"></i> 無法連線';
            }
        }
    }
    fetchWeather();
</script>
