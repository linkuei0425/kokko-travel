n skin recovery during travels. Staff are friendly and offer generous samples.", "name": "DR. PLANT (Zhangzhou Ancient City Store)", "transport": "Take Bus Route 4 or 11 to \u0027Ancient City Entrance\u0027 Station, enter Yanan South Road, and walk about 150 meters."}, {"address": "No. 156 Yanan South Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Bird\u0027s Nest Brightening Facial Mask, Collagen Nourishing Hand Cream, Tea Tree Anti-Acne Toner. Located in the core commercial district of Zhangzhou Ancient City, this well-known chain health and beauty store features international brands alongside dedicated \u0027Guochao (Chic Domestic) Beauty\u0027 and \u0027Local Fujian Skincare\u0027 counters. It\u0027s a convenient spot for travelers to restock bath, body, and skincare essentials. The store is bright and clean with a full product range, frequently offering promotions like buy-one-get-one-free or 50% off the second item.", "name": "Watsons (Zhangzhou Ancient City Yanan South Road Branch)", "transport": "Take Bus Route 11 or 29 to \u0027Xinhua West Road Intersection\u0027 Station, then walk for about 3 minutes."}], "name": "Local Iconic Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "No. 120 Hongkong Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional Southern Fujian Zanhuawei floral headwear clothing, modernized Hanfu long dresses, and elegant handmade hairpins. Located in the heart of Zhangzhou Ancient City, this shop offers sales and rental services for traditional Hanfu and Southern Fujian Datoushan attire. Extremely popular among young tourists and ancient-style enthusiasts, it\u0027s the perfect spot to purchase high-quality, characterful traditional garments with authentic historic charm.", "name": "Zhangzhou Ancient City Hanfu Hui Apparel Shop", "transport": "Take Zhangzhou Bus 4 or 14 to \u0027Taiwan Road Intersection\u0027 Station, then walk about 3 minutes."}, {"address": "No. 88 Taiwan Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Ancient city handwoven homespun tote bags, retro kiss-lock coin purses, and traditional indigo-dyed bags. An independent handmade boutique rich in local Southern Fujian folk style. It adheres to traditional hand-weaving and indigo-dyeing techniques, incorporating ancient textile arts into modern bag designs that are both durable and unique.", "name": "Minnan Cloth \u0026 Handmade Bag Studio", "transport": "Take Bus K1 or 25 to \u0027Gucheng Ximen (Ancient City West Gate)\u0027 Station, and walk about 250 meters along Taiwan Road."}, {"address": "No. 45 Shixing North Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Zhangzhou lacquered wooden clogs, delicate handmade embroidered shoes, and traditional Southern Fujian wedding red shoes. A decades-old local shop preserving traditional craftsmanship, specializing in Zhangzhou intangible cultural heritage lacquered wooden clogs and exquisite hand-embroidered shoes. Comfortable to wear and highly collectible as unique gifts, this store is a true showcase of local folk culture.", "name": "Zhangzhou Traditional Embroidered Shoes \u0026 Wooden Clogs Shop", "transport": "Take Bus B6 to \u0027Xinhua West Road\u0027 Station, then walk about 5 minutes into the Ancient City."}, {"address": "No. 18 Pedestrian Street, Tianluokeng Tulou Cluster Scenic Area, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional Hakka blue shirts, Hakka floral print handbags, and handmade large flower headpieces. Located within the Nanjing Tulou Tianluokeng Scenic Area, this studio focuses on promoting traditional Hakka clothing culture. The garments use natural botanical dyes, making them soft, skin-friendly, and breathable\u2014a must-visit local specialty shop when exploring the Tulou.", "name": "Nanjing Tulou Hakka Blue Shirt \u0026 Fabric Shop", "transport": "Take the Nanjing Tulou Tourist Express Bus from downtown Zhangzhou to the Tianluokeng Scenic Area Visitor Center, then transfer to the scenic shuttle bus."}, {"address": "No. 32 Fanghua Cross Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade vegetable-tanned leather shoes, retro genuine leather briefcases, and brass-buckle leather coin purses. Tucked away in an old lane of the Ancient City, this independent leathercraft studio features a master artisan skilled in leather carving and hand-stitching. Offering original design leather shoes and bags, it attracts many visitors looking for artsy, high-quality craftwork.", "name": "Guyi Handmade Leather \u0026 Shoes Studio", "transport": "Take Bus 17 to \u0027Zhongshan Park West Gate\u0027 Station, then walk about 400 meters."}, {"address": "No. 89 Old Street, Meilin Ancient Village, Meilin Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Breathable cotton-linen loose maxi dresses, handwoven plant-dyed crossbody bags, and Hakka-style printed scarves. Located in Meilin Ancient Town of Nanjing, this boutique focuses on natural, comfortable cotton-linen clothing and handmade bags. The casual and relaxed style is especially perfect for strolling through the Tulou scenic area and historic villages.", "name": "Meilin Ancient Town Linen Apparel \u0026 Bag Boutique", "transport": "Drive or take the shuttle bus bound for Meilin Town from Nanjing Bus Station, get off at the entrance of Meilin Ancient Village, and walk right in."}, {"address": "No. 66 Xiuwen West Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Modernized Minnan frog-button blouses, floral patchwork shoulder bags, and vintage printed silk scarves. A women\u0027s apparel and accessories boutique combining traditional Southern Fujian clothing elements with modern tailored cuts. Featuring unique yet wearable designs, it is highly recommended by local women and female travelers alike.", "name": "Yunshang Minnan Fashion Apparel Shop", "transport": "Take Bus 22 to \u0027Zhangzhou No. 2 High School\u0027 Station, then walk about 6 minutes to Xiuwen West Road in the Ancient City."}, {"address": "No. 102 Yan\u0027an South Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Versatile high-quality women\u0027s tote bags, lightweight genuine leather casual shoes, and stylish woven crossbody bags. A trendy shoe and bag boutique frequently visited by locals, selecting high-quality yet affordable daily footwear and fashionable bags. With fast-updating styles, it is perfect for travelers looking to complete their vacation outfits.", "name": "Ancient City Impression Fashion Shoes \u0026 Bags", "transport": "Take Bus 3 or 12 to \u0027Yan\u0027an South Road\u0027 Station and walk right over."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 112 Xianggang Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Pien Tze Huang Savory Biscuits, Garlic Meat Floss Pastries, Traditional Mung Bean Cakes. A time-honored souvenir shop located in Zhangzhou Ancient City. It is famous for its \u0027Pien Tze Huang Savory Biscuits\u0027, which blend local traditional medicine concepts with classic pastry craftsmanship. Crispy, savory, and flavorful, it is an absolute must-buy souvenir for visitors.", "name": "Baizhenxiang Zhangzhou Specialty Souvenir Shop", "transport": "Take Zhangzhou Bus Route 4 or B6 to \u0027Zhangzhou Ancient City Station\u0027, then walk for about 3 minutes."}, {"address": "No. 15 Xiuwen West Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Queen Brand Pien Tze Huang Pearl Cream, Radiance Pearl Cream, Herbal Toothpaste. Pien Tze Huang is Zhangzhou\u0027s most iconic China Time-Honored Brand. Aside from traditional medicine, its pearl cream skincare line is immensely popular among tourists for its deeply moisturizing and skin-soothing properties, offering amazing value for money.", "name": "Zhangzhou Pien Tze Huang Experience \u0026 Cosmetics Store", "transport": "Walk to Xiuwen West Road in Zhangzhou Ancient City, near the intersection with Taiwan Road."}, {"address": "No. 88 Taiwan Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Pinghe Baiya Qilan Tea Gift Sets, Zhangping Shuixian Tea Cakes, Traditional Roasted Tieguanyin. Baiya Qilan is a famous specialty tea from Pinghe County, Zhangzhou, featuring a natural orchid aroma and a refreshingly sweet aftertaste. This historic tea house in the ancient city offers on-site tastings and exquisite gift packaging, making it perfect to bring home for friends and family.", "name": "Yuanshan Old Shop - Baiya Qilan Tea Specialty Store", "transport": "Located on Taiwan Road Pedestrian Street in the heart of Zhangzhou Ancient City; easily accessible on foot."}, {"address": "No. 12 Commercial Street, Tulou Visitor Center, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Tulou Dried Persimmons, Hakka Rice Wine, Low-Temperature Roasted Dried Passion Fruit. Located near the entrance of the Nanjing Tulou Scenic Area, specializing in traditional Hakka mountain specialty products. The sun-dried persimmons are soft, chewy, and delightfully sweet without being cloying, while the dried passion fruit is richly tangy and a super popular snack in the area.", "name": "Nanjing Tulou Hakka Specialty Workshop", "transport": "Located within the commercial area of Nanjing Tulou Visitor Center; convenient to shop around before boarding the scenic park shuttle."}, {"address": "No. 23 Shixing North Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Pillow Biscuits (Zhentou Bing), Duguo Pastries, Traditional Pineapple Cakes. A multi-generational handmade bakery. Its signature \u0027Pillow Biscuits\u0027 are shaped like mini pillows with flaky, crispy outer layers and a fragrant filling of sesame, candied melon, and peanuts\u2014a beloved nostalgia-filled tea snack for locals.", "name": "Zhengxingde Ancient City Handmade Bakery", "transport": "Take the bus to \u0027Zhongshan Park Station\u0027, enter the ancient city, and walk for about 5 minutes."}, {"address": "No. 36 Xiuwen East Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Eight-Treasure Inkpad in Blue and White Porcelain Box, Cinnabar Inkpad Creative Gift Set, Narcissus-themed Seals. Zhangzhou Eight-Treasure Inkpad is a National Intangible Cultural Heritage item renowned for its vibrant cinnabar red color that never fades and resists water damage. This flagship store combines traditional craftsmanship with creative packaging, offering high-value cultural souvenirs.", "name": "Zhangzhou Babao Inkpad Intangible Cultural Heritage Souvenir Shop", "transport": "Located on Xiuwen East Road Pedestrian Street in Zhangzhou Ancient City, about a 2-minute walk from the Confucian Temple."}, {"address": "No. 18 Scenic Area Shop, Yunshuiyao Ancient Town, Meilin Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Taxia Village High-Mountain Aromatic Oolong Tea, Hakka Salt-Free Dried Bamboo Shoots, Farmstead Wild Mushrooms. Surrounded by high-altitude mist, Taxia Village and Yunshuiyao yield oolong tea with an intensely rich aroma. The shop features locally grown bamboo shoots and tea free from chemical additives, hugely popular among health-conscious travelers.", "name": "Tulou High Mountain Organic Tea \u0026 Bamboo Shoots Specialty Shop", "transport": "Located near the Big Banyan Tree attraction in Yunshuiyao Ancient Town; easily reachable while exploring the town on foot."}, {"address": "No. 5 Fanghua Cross Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Narcissus Essential Oil Fragrances, Zhangzhou Woodblock New Year Print Postcards, Carved Narcissus Bulbs. Zhangzhou is celebrated as the \u0027Home of Narcissus\u0027. Centered around the narcissus flower, this creative boutique crafts exquisite fragrances, skincare items, and cultural gifts\u2014perfectly packaged for memorable travel keepsakes.", "name": "Narcissus Rhyme Zhangzhou Creative Gift Shop", "transport": "About a 4-minute walk from the main entrance of Zhangzhou Ancient City."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 201 Shuixian Avenue, Longwen District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Pien Tze Huang Queen Pearl Cream Gift Set, Zhangzhou Woodblock New Year Painting Creative Mug, Yishanhai Specialty Southern Fujian Pastries. Zhangzhou Bihu Wanda Plaza is a large-scale, well-equipped comprehensive department store and shopping mall in downtown Zhangzhou, combining trendy shopping, local food, and leisure entertainment. Featuring a large flagship Pien Tze Huang store and numerous local Southern Fujian brand outlets, it is the top choice for tourists to buy local specialties and modern fashion in one stop.", "name": "Zhangzhou Bihu Wanda Plaza", "transport": "Take Zhangzhou Bus B2 or Line 29 to Bihu Wanda Plaza Station."}, {"address": "No. 258 Yingbin Avenue, Longwen District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Anta hot-sale running shoes, Xtep windproof sports jackets, Erke lightweight down jackets. As one of the most popular outlet centers in Zhangzhou, it gathers discount stores of many well-known local sports and casual brands from Fujian. Year-round discounts range from 50% to 80% off. The domestic sports brand area offers a full variety of items at budget-friendly prices, making it the best choice for buying high-quality sportswear and casual clothes.", "name": "Zhangzhou Brand Outlet Center", "transport": "Take Bus Line 17 or Line 8 to Jilong Hospital Station, then walk about 300 meters."}, {"address": "No. 120 Xianggang Road, Zhangzhou Ancient City, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Zhangzhou Babao Seal Pad Gift Box, Hand-carved Daffodil Ornaments, Pien Tze Huang Pearl Day Cream. Deeply rooted in the heart of Zhangzhou Ancient City, this department store uniquely integrates traditional intangible cultural heritage with modern retail. Bringing together over 20 time-honored local brands and artisan works, it offers highly representative local gifts and is immensely popular with tourists who love traditional culture and unique handicrafts.", "name": "Zhangzhou Ancient City Heritage Department Store", "transport": "Take Zhangzhou Bus Line 4 or A1 to Zhangzhou Ancient City Station, then walk into Xianggang Road inside the ancient city."}, {"address": "No. 28 Shengli West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Lvdi Brand Dried Longans, Local Zhangzhou Banana Chips, Traditional Southern Fujian Handmade Misua (Wheat Noodle Threads). Zhongmin Baihui is a representative time-honored department store chain in Fujian, deeply trusted by local residents. The fresh supermarket and local specialty section offer a rich variety of products at affordable local prices, making it a great spot to buy authentic Zhangzhou agricultural specialties, everyday snacks, and souvenirs while experiencing local daily life.", "name": "Zhangzhou Zhongmin Baihui Department Store", "transport": "Take Bus Line 1, 10, or 11 to Shengli Park Station, then walk for about 2 minutes."}, {"address": "Intersection of Danxia Road and Yingbin Avenue, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Southern Fujian Ancient Dwelling Creative Coasters, Pien Tze Huang Rejuvenating Herbal Face Masks, Zhangzhou Babao Seal Stamp. Zhangzhou Impression City is a modern shopping center featuring trendy youth brands, local independent creative stores, and refined dining. It houses many independent designer brands from Zhangzhou alongside chic beauty and lifestyle boutiques, seamlessly blending traditional Southern Fujian elements with trendy products\u2014an ideal place for young tourists to shop, take photos, and find unique gifts.", "name": "Zhangzhou Impression City", "transport": "Take Bus Line 23 or Line 32 directly to Impression City Station."}, {"address": "Commercial Center, Tulou Visitor Service Center, Shuyang Town, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Nanjing High-Mountain Oolong Tea, Hakka Small Sealed Jars of Rice Wine, Rammed-Earth Tulou-Shaped Tea Pets. Located at the entrance of the Nanjing Tulou Scenic Area, this comprehensive Hakka department mall is the most representative shopping spot in the area. Operated by a local Hakka cooperative, it sells authentic Tulou high-mountain tea, traditional Hakka rice wine, and creative lifestyle products inspired by Tulou architecture, ensuring authentic quality and transparent pricing.", "name": "Nanjing Hakka Tulou Shopping Mall", "transport": "Take the tourist direct bus from Zhangzhou Passenger Transport Center Station bound for Nanjing Tulou Scenic Area, and get off at the Visitor Center terminus."}, {"address": "No. 1 Jianyuan East Road, Longwen District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Peak Taichi Series Casual Shoes, Jiulong River Agarwood Crafts, Southern Fujian Herbal Skincare Sets. Zhangzhou Aegean Shopping Park is a large open-air leisure commercial street featuring numerous brand discount stores and local cultural and creative experience shops. With an elegant and spacious shopping environment, it combines top domestic and international fashion brands with local Zhangzhou specialty shops, offering tourists a one-stop department store experience for shopping, leisure, and local culture.", "name": "Zhangzhou Aegean Shopping Park", "transport": "Take Bus Line 26 or 901 to Aegean Shopping Park Station."}, {"address": "No. 15 Nankeng North Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Pien Tze Huang Toothpaste Premium Gift Box, Zhangzhou Black Face Tsai Starfruit Soft Candies, Pechoin Guochao Co-branded Skincare Products. Zhangzhou Rainbow Department Store is a renowned local upscale chain department store famous for high-quality service and carefully selected merchandise. The first floor features a large domestic beauty section and flagship counters for Fujian local specialties, offering exquisite packaging and excellent after-sales service\u2014making it an ideal choice for purchasing premium gifts for family and friends.", "name": "Zhangzhou Rainbow Department Store", "transport": "Take Bus Line 5 or Line 18 to Rainbow Department Store Station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Zhangzhou - Zhangzhou Ancient City and Nanjing Tulou Scenic Area"}};
        const cityName = "Fujian";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
