artment Store in the heart of Dongjiekou commercial district, this multi-brand beauty store is immensely popular among young people in China. It gathers hundreds of emerging Chinese domestic beauty brands (C-Beauty) in a spacious, futuristic setting. Featuring vibrant colors and stylish design, it\u0027s a must-visit sanctuary to experience contemporary \u0027Guochao\u0027 (China-chic) cosmetics trends.", "name": "WOW COLOUR (Dongjiekou Dayang Department Store Branch)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit A), then walk for about 2 minutes."}, {"address": "1F, Oriental Department Store, No. 103 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | Must-buy list: Judydoll Single Eyeshadow, Carslan Big Eyes Mascara, INTO YOU Lip Mud. Featuring a massive beauty blender display wall and vibrant rainbow-themed decor, this store occupies a lively spot in Dongjiekou. It offers a wide array of cost-effective local and popular Asian beauty items with an open testing space. The pressure-free shopping environment draws trendy youths and tourists eager to discover the latest viral makeup essentials.", "name": "THE COLORIST (Dongjiekou Branch)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit B), then walk for about 3 minutes."}, {"address": "B1, Dayang Crystal Galleria, No. 89 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 stars | Must-buy list: Zhikamei Repair Serum, Natural Essential Oil Handmade Soap, Domestic Centella Asiatica Dressing Mask. Spanning a massive footprint in Dongjiekou, this giant yellow-shipping-container-styled lifestyle and beauty hall offers much more than general merchandise. Its cosmetics and skincare section features a comprehensive range of domestic dermatological skincare brands and essential oils. With bright display walls and affordable prices, it\u0027s a great spot to pick up travel beauty necessities and skincare products.", "name": "KKV (Dayang Crystal Dongjiekou Branch)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit D), directly connected via the underground shopping street."}, {"address": "No. 168 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.4 stars | Must-buy list: Tongren Tang Pearl Whitening Powder, Herbal Acne Repair Ointment, Ejiao Nourishing Mask. Located on the main avenue connecting Dongjiekou and Sanfang Qixiang, this classic heritage pharmacy sells more than just traditional medicine. Its Chinese herbal beauty counter is a hidden gem known to insiders. Pearl powders, herbal moisturizing creams, and beauty-from-within supplements formulated with Chinese herbs are favored by local women and savvy travelers who advocate for holistic beauty.", "name": "Beijing Tongren Tang (Bayiqi North Road Branch)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk for about 4 minutes."}, {"address": "Skincare Zone, 1F, Oriental Department Store, No. 103 Bayiqi North Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.3 stars | Must-buy list: CHANDO Glacial Water, Himalayan Snow Tea Mask, Time Frozen Youth Infusion Cream. As a flagship natural skincare brand in China, CHANDO features a professional counter inside Oriental Department Store at Dongjiekou. Highlighting natural alpine botanicals from the Himalayas, its products are intensely hydrating yet gentle. The counter offers skin analysis and attentive trial services, making it perfect for customers seeking high-quality Chinese botanical skincare.", "name": "CHANDO Counter (Dongjiekou Oriental Department Store)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 22 Yangqiao East Road, Gulou District, Fuzhou City", "feature": "\u2b50 4.2 stars | Must-buy list: Fujian Pianzihuang Toothpaste, Herbal Heat-Relieving Soothing Spray, Lithospermum Repair Cream. Jianmin Pharmacy is a long-standing local chain in Fuzhou, and its Dongjiekou flagship store is impressively large. It features a dedicated area for local Fujian cosmeceuticals and personal care products, bringing together regional herbal ointments, Chinese herbal bath amenities, and mosquito-repellent skincare. With transparent pricing and frequent promotions, it\u0027s a go-to spot for locals stocking up on daily herbal skincare essentials.", "name": "Fuzhou Jianmin Pharmacy (Dongjiekou Flagship Store)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Yangqiao East Road for about 3 minutes."}], "name": "Local Iconic Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 88 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buys: Championship Series Nitro-Tech Running Shoes, Chinese-chic Printed Casual Hoodies. Originated in Fujian and grown into a world-famous sportswear brand, ANTA boasts a spacious flagship store in the Dongjiekou commercial district with an exceptionally full range of products. The store features a dedicated \u0027Guochao\u0027 (Chinese-chic) experience zone and displays for the latest high-tech footwear, seamlessly blending local Fujian sports craftsmanship with modern fashion. Local youth and tourists alike flock here for high-value professional running shoes and trendy streetwear. The staff is professional, and special promotions are frequent.", "name": "ANTA 817 Road Flagship Store", "transport": "Take Fuzhou Metro Line 1 or Line 2 to \u0027Dongjiekou Station\u0027 Exit C, then walk for about 2 minutes."}, {"address": "No. 102 Nanhou Street, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buys: Modernized Ming-style Jacquard Horse-Face Skirt (Mamianqun), Hand-embroidered Silk Qipao. Nestled in the picturesque, historic Sanfang Qixiang (Three Lanes and Seven Alleys), this famous local boutique offers traditional apparel fitting and purchasing. Fusing traditional Eastern aesthetics with modern tailoring, the shop provides high-quality Mamianqun, Xiangyun silk Qipaos, and vintage accessories. Many tourists visit specifically to purchase exquisite Hanfu and pose for photos among the ancient alleys and historic courtyards. Fabrics are fine and embroidery is exquisitely detailed.", "name": "Jinghua Shuiyue Hanfu \u0026 Qipao Boutique", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit AB, then walk along Nanhou Street for about 5 minutes."}, {"address": "No. 130 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buys: Chinese Mandarin Collar Tailored Suits, Natural Hemp Shirts. Seven Brand is a classic Fujian menswear giant, famous worldwide for pioneering Chinese Mandarin collar suits. Located in Dongjiekou, this flagship store features grand d\u00e9cor, showcasing the understated poise of Eastern gentlemen. The Mandarin collar suits are tailored to fit Asian physiques perfectly, crafted from premium fabrics. Equally suited for business meetings or everyday Chinese-chic styling, it is the premier destination for picking up refined menswear or buying gifts for elders.", "name": "Seven Brand Dongjiekou Flagship Store", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit D3, then walk for about 3 minutes."}, {"address": "No. 15 Gong Xiang, Sanfang Qixiang, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.9 stars | Must-Buys: Fuzhou Bodiless Lacquer Genuine Leather Tote, Handcrafted Lacquer-Texture Crossbody Bag. A highly unique local independent shop in Sanfang Qixiang, this boutique cleverly integrates Fuzhou\u0027s intangible cultural heritage\u2014bodiless lacquerware techniques\u2014into modern leather bags and shoes. Each handbag features a one-of-a-kind lacquer texture, making every piece an exclusive work of art that bridges rustic charm and contemporary chic. Unique, unlikely to clash with others, and deeply rich in local cultural keepsake value.", "name": "Qi Yi Gong Fang Lacquer Leather Bag Shop", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027, then walk into Gong Xiang in Sanfang Qixiang for about 7 minutes."}, {"address": "No. 3 Dongjie, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buys: Popcorn Tech Retro Running Shoes, Collaboration Casual Crossbody Bags. As a famous activewear brand hailing from Fujian, 361\u00b0 has made massive waves in trendy Chinese-chic footwear design. Located right in the prime area of Dongjiekou, this flagship store brings together the brand\u0027s latest limited collaborations and tech-infused retro sneakers. Youthful, energetic, and wallet-friendly, it\u2019s a must-visit footwear and bag hub for young students and street fashion enthusiasts in Dongjiekou.", "name": "361 Degrees Guochao Flagship Store", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit B, then walk for about 2 minutes."}, {"address": "No. 68 Nanhou Street, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buys: Handcrafted Vintage Satin Embroidered Shoes, Retro Fabric Handbags. Situated on Nanhou Street, this traditional handcrafted cloth shoe and embroidery store exudes rich Old Fuzhou charm. Inside, you\u0027ll find an array of delicately patterned cloth shoes, wedge embroidered shoes, and soft-soled house shoes. Beyond their beautiful auspicious patterns, they are remarkably comfortable and breathable. Many visitors buy an elegant pair to complement traditional outfits; they are reasonably priced and genuinely practical.", "name": "Buyun Xuan Embroidered Shoes \u0026 Qipao Boutique", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit C, walk into Nanhou Street for about 4 minutes."}, {"address": "Hall A, Dongbai Center, No. 68 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buys: Japanese-Style Heavyweight Cotton T-Shirts, Loose All-Match Cargo Pants. MUMAKE is an independent local Fujian casual brand beloved by youth, advocating simplicity, comfort, and minimalist natural style. The Dongjiekou Concept Store features a sleek, airy layout, stocked with premium cotton and linen apparel alongside artistic canvas totes. Featuring clean cuts and earthy or neutral palettes, its quality rivals top brands at modest price points\u2014ideal for effortlessly comfortable everyday wear.", "name": "MUMAKE Dongjiekou Concept Store", "transport": "Take Fuzhou Metro Line 1 or Line 2 to \u0027Dongjiekou Station\u0027 with direct access into Dongbai Center."}, {"address": "No. 106 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buys: 160X Professional Race Running Shoes, Eco-friendly Low-Carbon Sports Bags. Born in Quanzhou, Fujian, XTEP operates a massive flagship store in Dongjiekou, Fuzhou. Famous nationwide for professional road running shoes, its 160X carbon-plate shoes are the go-to choice for many marathon runners. Bright and spacious, this flagship showcases top-tier athletic footwear alongside trendy sports gear and bags, often featuring exclusive local deals\u2014an unmissable shopping spot for fitness enthusiasts and marathon runners.", "name": "XTEP Dongjiekou Flagship Store", "transport": "Take Fuzhou Metro Line 1 to \u0027Dongjiekou Station\u0027 Exit D1, then walk for about 2 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "No. 108 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade dried Yan wrappers, frozen Rouyan gift boxes, vacuum-packed Yan balls. Tongli Meat Yan is a centuries-old Fuzhou heritage brand founded during the Guangxu reign of the Qing Dynasty, with its craft recognized as an intangible cultural heritage. The Yan wrapper (Yanpi) is made by pounding lean pork leg meat and sweet potato starch tens of thousands of times by hand, resulting in paper-thin sheets with a crisp, silky texture. Besides enjoying a freshly cooked bowl in-store, tourists love buying the dried Yanpi to wrap at home or purchasing frozen gift sets. It is a highly distinctive, must-have souvenir representing Fuzhou.", "name": "Tongli Meat Yan (Tongli Rouyan)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk for about 8 minutes to Nanhou Street in Three Lanes and Seven Alleys."}, {"address": "No. 89 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Eel fish ball gift box, shark fish ball gift box, vacuum-packed mixed fish balls. Founded in 1934, Yonghe Fish Balls is one of Fuzhou\u0027s oldest surviving fish ball brands and an iconic culinary spot on Nanhou Street in Three Lanes and Seven Alleys. Fresh eel or shark meat is beaten into a springy fish paste, stuffed with rich, juicy pork filling that bursts with flavor upon every bite. The shop offers vacuum-sealed gift boxes designed for travelers, making it easy to bring home Fuzhou\u0027s traditional culinary culture of \u0027no feast without fish balls\u0027 to share with friends and family.", "name": "Yonghe Fish Balls", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Nanhou Street for about 6 minutes."}, {"address": "1st Floor, Juchunyuan Hotel, No. 2 Dongjie, Gulou District, Fuzhou City", "feature": "\u2b50 4.8 Stars | Must-Buy List: Ready-to-eat Premium Buddha Jumps Over the Wall gift box, traditional Fuzhou taro paste, Juchunyuan rice cake (Nian Gao). Juchunyuan is the birthplace of Fujian cuisine and a China Time-Honored Brand where the legendary dish \u0027Buddha Jumps Over the Wall\u0027 originated. The store near Three Lanes and Seven Alleys specializes in refined Fujian culinary gifts, particularly the room-temperature or frozen \u0027Buddha Jumps Over the Wall\u0027 gift boxes utilizing high-tech sterilization technology, allowing you to recreate top-tier restaurant luxury at home. Elegantly packaged, it is highly favored for business gifts and premium travel souvenirs.", "name": "Juchunyuan Souvenir Shop", "transport": "Take Metro Line 1 or Line 4 to Dongjiekou Station (Exit A), then walk for about 2 minutes."}, {"address": "No. 127 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Authentic Fuzhou ceremony cake (Li Bing), olive cake, Emperor pastry (Diwang Su). Baibingyuan is a classic local pastry brand that Fuzhou locals grew up eating, inheriting traditional Eastern Fujian baking crafts. The signature \u0027Fuzhou Li Bing\u0027 features a flaky crust filled with candied melon, diced pork fat, peanuts, and sesame seeds, offering a rich, fragrant blend of savory and sweet flavors. The olive cake infuses the refreshing aroma of Fuzhou\u0027s native olives with a soft, non-sticky texture. With individually wrapped items and elegant gift boxes, it makes a perfect teatime souvenir showcasing local flavors.", "name": "Baibingyuan Pastry Shop", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Nanhou Street for about 7 minutes."}, {"address": "No. 61 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Premium Jasmine Needle King, Jasmine tea bag gift box, Jasmine tea cakes. Fuzhou is the birthplace of world jasmine tea, and Chunlun Jasmine Tea is a leading enterprise representing Fujian\u0027s tea industry. Located on Nanhou Street, this flagship store exudes a rich tea culture vibe. Their tea is crafted by repeatedly scenting high-quality green tea with double-petal jasmine flowers, yielding a long-lasting, vibrant aroma and rich taste. Offering exquisite tea gift sets and convenient tea bags, it is a top choice souvenir for elders and tea lovers.", "name": "Chunlun Jasmine Tea (Sanfang Qixiang Branch)", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Nanhou Street for about 5 minutes."}, {"address": "No. 97 Nanhou Street, Gulou District, Fuzhou City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Licorice olives, Clove olives, concentrated olive juice. Known as the \u0027Hometown of Olives\u0027, Fuzhou\u0027s Dashijie Olive Shop is a household name for preserved fruits. Fresh, premium local olives are candied using traditional techniques, preserving their signature bittersweet-to-sweet flavor. The licorice and clove flavors are highly recommended for relieving thirst with a lasting sweet aftertaste. The concentrated olive juice is a refreshing local summer drink, and the neatly packaged preserved olives are super easy to carry and share.", "name": "Dashijie Olive Shop", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Nanhou Street for about 6 minutes."}, {"address": "No. 190 Bayiqi North Road, Gulou District, Fuzhou City (inside Dongjiekou Commercial Area)", "feature": "\u2b50 4.2 Stars | Must-Buy List: Snowflake cake (Xuepian Gao), Fujian lard cake, Wan-character cake. Founded during the Xianfeng reign of the Qing Dynasty, Meiqieyou is a historic Fuzhou bakery whose name translates to \u0027Beautiful and Nutritious\u0027. Its signature \u0027Snowflake Cake\u0027 is sliced paper-thin, snow-white, and melts in your mouth with a rich aroma of rice flour and sesame; the lard cake is soft, chewy, and sweet. Preserving old Fuzhou\u0027s nostalgic, traditional flavors with vintage-style packaging, it is an unmissable snack souvenir for exploring classic Min culture.", "name": "Meiqieyou Pastry Shop", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit D3), then walk for about 3 minutes."}, {"address": "No. 103 Bayiqi North Road, Gulou District, Fuzhou City (near Dongjiekou)", "feature": "\u2b50 4.5 Stars | Must-Buy List: Crispy fried meat floss, Fujian Taicang meat floss, deluxe jerky gift box. Founded during the Guangxu reign of the Qing Dynasty, Dingriyou is the pioneer of Fuzhou meat floss, with its founder inventing a unique roasting technique. Made from fresh lean pork leg meat roasted to a golden crispy finish, their fried meat floss is fluffy, golden-hued, and melts in your mouth. Perfect with porridge, inside bread, or eaten plain as a snack, it is a classic souvenir showcasing Fuzhou\u0027s traditional culinary wisdom.", "name": "Dingriyou Meat Floss", "transport": "Take Metro Line 1 to Dongjiekou Station (Exit C), then walk along Bayiqi North Road for about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 88 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Fuzhou Bodyless Lacquerware cultural tea sets, Minxiang Tea Special Grade Tieguanyin, Tongli Meat Swallow (Rouyan) gift boxes from time-honored brands. Dongbai Center is Fuzhou\u0027s most historic and representative flagship local department store, situated in the prime area of Dongjiekou. Following renovations, it seamlessly connects directly to the Three Lanes and Seven Alleys scenic area, blending modern luxury with historic charm. The store features premium Fujian cultural brands and historic heritage shops. The rooftop observation deck offers a stunning panoramic view of the ancient architecture of Three Lanes and Seven Alleys, making it a top landmark for experiencing Fuzhou\u2019s local fashion and shopping scene.", "name": "Dongbai Center", "transport": "Take Fuzhou Metro Line 1 or Line 2 to Dongjiekou Station; direct access upon exiting."}, {"address": "No. 130 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: ANTA Nitrogen Technology professional running shoes, Guochao (China-chic) collab T-shirts, discounted windproof sportswear. Founded in Fujian, ANTA is a globally renowned sportswear giant featuring a massive outlet area at this location. Year-round discounts start as low as 70% off, covering seasonal clearance running shoes, casual apparel, and kids\u0027 activewear. For travelers seeking high-value athletic gear and trendy local Chinese streetwear, this outlet is a must-visit discount shopping haven in the Dongjiekou commercial district.", "name": "ANTA Outlet Dongjiekou Flagship Store", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit C; walk for about 2 minutes."}, {"address": "No. 133 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Pien Tze Huang Queen Pearl Cream, Fujian High Mountain Oolong Tea gift boxes, local handmade canvas bags. Grand Ocean Department Store is a long-standing department store chain in Fujian, with its Dongjie branch having accompanied generations of locals. In addition to mid-to-high-end international cosmetics and fashion apparel, it features dedicated sections for local Fujian specialties and fine skincare products. The basement food and souvenir court offers a pleasant shopping environment with frequent local member discounts, making it popular among both locals and tourists.", "name": "Grand Ocean Department Store Dongjie Branch", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit D1; walk for about 3 minutes."}, {"address": "No. 11 Yangqiao East Road, Gulou District, Fuzhou City, Fujian Province (at the entrance of Three Lanes and Seven Alleys)", "feature": "\u2b50 4.9 stars | Must-Buy List: Pien Tze Huang Queen Pearl Cream (Ultra-Moisturizing Series), Pien Tze Huang Repair Toothpaste Sets, Reishi Whitening Essence. Pien Tze Huang is Fujian\u0027s most famous national intangible cultural heritage Traditional Chinese Medicine (TCM) brand and skincare legend. This flagship experience store showcases centuries of brand history while offering highly regarded Herbal/TCM skincare and cosmeceuticals. The Pearl Cream series is an absolute must-buy souvenir for visitors to Fujian, prized for its rich moisturizing texture and skin-repairing qualities.", "name": "Pien Tze Huang Flagship Experience Store (Dongjiekou Branch)", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit AB; walk for about 4 minutes."}, {"address": "No. 110 Bayiqi North Road, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Juchunyuan Premium Frozen Buddha Jumps Over the Wall gift boxes, Top-grade Braised Abalone cans, traditional Fuzhou Taro Paste gift cakes. Juchunyuan is the century-old birthplace of Fuzhou\u0027s iconic dish, \u0027Buddha Jumps Over the Wall\u0027. Located in the Dongjiekou commercial district, this souvenir flagship store combines traditional Min cuisine with convenient modern packaging, offering travel-ready packaged Buddha Jumps Over the Wall and various famous Fujian pastries. Vacuum-packed or boxed gift sets make perfect presents, allowing you to bring home authentic, old-fashioned Fuzhou delicacies.", "name": "Juchunyuan Fujian Souvenirs Flagship Store", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit C; walk for about 3 minutes."}, {"address": "No. 87 Nanhou Street, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Needle King Jasmine Tea Canned Gift Boxes, Cold Brew Jasmine Green Tea bags, Jasmine Solid Perfume. Chunlun Tea is a leading enterprise representing Fuzhou\u0027s traditional jasmine tea crafting techniques. Situated near Three Lanes and Seven Alleys, this elegantly designed flagship store merges modern department-style shopping with traditional tea arts. Visitors can taste freshly brewed, premium scented jasmine tea on-site and purchase exquisite tea gifts. Fragrant and refreshingly sweet, jasmine tea is Fuzhou\u0027s most iconic specialty product.", "name": "Chunlun Tea Sanfang Qixiang Flagship Store", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit C; walk for about 5 minutes onto Nanhou Street."}, {"address": "No. 93 Jipi Road, Gulou District, Fuzhou City, Fujian Province (near Three Lanes and Seven Alleys)", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade marble-pattern lacquerware tea sets, delicate bodyless lacquerware bookmarks, lacquer jewelry boxes. Fuzhou Bodyless Lacquerware, alongside Beijing Cloisonn\u00e9 and Jingdezhen Porcelain, is renowned as one of China\u0027s \u0027Three Treasures of Traditional Crafts.\u0027 As a premium local lacquerware brand, Xueyinglan operates a massive flagship gallery-store in the district. From collector-grade fine art to affordable everyday lifestyle goods, it integrates ancient lacquerware techniques into modern aesthetics, offering unique handcrafted pieces.", "name": "Xueyinglan Lacquer Art Flagship Store", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit D1; walk for about 7 minutes."}, {"address": "No. 55 Nanhou Street, Gulou District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Fuzhou handmade oil-paper umbrellas, \u0027Three Treasures\u0027 themed paper-cut postcards, Shoushan stone miniature stamps. Bringing together local independent designers and intangible cultural heritage artisans, this marketplace is the most popular cultural and creative shopping spot on Nanhou Street. Bursting with local charm, it sells handmade oil-paper umbrellas, Shoushan stone carvings, and Fuzhou-style stationery. Accessible prices and unique handcrafted textures draw countless young tourists looking for special treasures.", "name": "Nanhou Street Cultural \u0026 Creative Craft Mall", "transport": "Take Fuzhou Metro Line 1 to Dongjiekou Station, Exit C; walk for about 6 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Fuzhou - Three Lanes and Seven Alleys and Dongjiekou Commercial District"}, "fuzhou_yantai": {"categories": {"cat_1": {"items": [{"address": "No. 39 Cangqian Road, Yantai Mountain Historical and Cultural District, Cangshan District, Fuzhou City", "feature": "\u2b50 4.8 stars | Must-buy list: Pien Tze Huang Pearl Cream, Pien Tze Huang Toothpaste, Reishi Whitening Essence. Fujian\u0027s most proud domestic prestige brand, combining a century-old national secret formula with modern beauty technology. The Yantai Mountain branch integrates historical Western-style architectural aesthetics, showcasing Pien Tze Huang\u0027s unique repairing and whitening skincare products. It attracts many visitors eager to experience and purchase iconic Fujian skincare holy grails.", "name": "Pien Tze Huang Experience Store - Yantai Mountain", "transport": "Take Metro Line 1 to Shangteng Station (Exit A), and walk for about 10 minutes."}, {"address": "No. 88 Xiahang Road, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 stars | Must-buy list: Time-honored Herbal Soothing Ointment, Chinese Herbal Facial Mask Powder, 24-Herbal Cooling Tea Bags. Founded in the Qing Dynasty, this time-honored Fujian traditional Chinese medicine pharmacy is located in the heart of the Shangxiahang Historic District. Blending traditional TCM principles with modern beauty and healthcare, it offers all-natural herbal facial powders and gentle soothing ointments. Frequently visited by local Fuzhou residents, it is a cosmetics and pharmacy haven rich in Min capital culture.", "name": "Huichun Traditional Pharmacy - Shangxiahang", "transport": "Take Metro Line 1 to Dadao Station (Exit C), and walk for about 8 minutes."}, {"address": "No. 12 Lequn Road, Yantai Mountain Commercial Pedestrian Street, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 stars | Must-buy list: Niche salon perfume samples, travel-size designer repairing essences, premium makeup sponge sets. A stylish cosmetic concept store blending Cangshan\u0027s historic Western-style industrial aesthetics with modern warehouse design. Featuring tens of thousands of international luxury brands and domestic independent beauty products, it offers a massive trial area where visitors can purchase big-name travel samples and unique niche fragrances at fantastic value.", "name": "HARMAY - Fuzhou Yantai Mountain", "transport": "Take Metro Line 1 to Shangteng Station, then transfer to a bus or walk about 12 minutes to Yantai Mountain Pedestrian Street."}, {"address": "No. 156 Shanghang Road, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.5 stars | Must-buy list: Duck Egg Scented Powder, Osmanthus Hair Oil, Vintage Solid Rouge. One of China\u0027s oldest classical Eastern cosmetics brands, whose antique interior complements the historic Shangxiahang street perfectly. Crafted with natural fragrant powders and traditional techniques, its solid perfumes and signature duck egg powders are gentle, non-irritating, and exude a classic, elegant floral aroma\u2014making them an iconic cultural souvenir.", "name": "Xie Fuchun Cosmetics - Shangxiahang", "transport": "Take Metro Line 1 to Dadao Station, and walk for about 9 minutes."}, {"address": "No. 18 Aiguo Road, Yantai Mountain Historical and Cultural District, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 stars | Must-buy list: Floral Extract Radiant Hand Cream Gift Set, Camellia Firming Mask, Oriental Solid Perfume. A trendy domestic skincare brand combining herbal floral care with classical aesthetics. The Yantai Mountain store features an elegant, romantic setting, offering a range of skincare products and solid balms extracted from Eastern flowers like camellia and jasmine. Its refreshing and pleasant fragrances make it a favorite among young women.", "name": "Sanshenghua Cosmetics Boutique - Yantai Mountain", "transport": "Take Metro Line 1 to Shangteng Station, and walk for about 10 minutes to Yantai Mountain Historical and Cultural District."}, {"address": "No. 45 Longping Road, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.4 stars | Must-buy list: Minnan Herbal Foot Bath Packs, Mugwort Soothing Balm, Natural Pearl Whitening Powder. A century-old Chinese herbal brand rooted in Fujian, famous for traditional TCM wellness and skin conditioning. The shop specializes in soothing ointments made from authentic Fujian medicinal herbs, herbal foot soak packs, and natural whitening pearl powder. Free of chemical additives, it\u0027s a hidden treasure for tourists seeking natural and healthy beauty solutions.", "name": "Chunshentang Herbal \u0026 Beauty - Shangxiahang", "transport": "Take Metro Line 1 to Dadao Station (Exit C), and walk for about 10 minutes."}, {"address": "No. 66 Tingxia Road, Yantai Mountain Pedestrian Street, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 stars | Must-buy list: Plant Essential Oil Shampoo Bars, Minimalist Ingredient Repairing Moisturizer, Niche Independent Rollerball Fragrances. An original independent beauty and lifestyle store in Yantai Mountain that emphasizes clean, vegan, and sustainable beauty. Curating handmade herbal soaps from local Fujian artisanal workshops alongside high-quality minimalist skincare, it\u0027s a treasure trove for shoppers seeking personalized skincare experiences.", "name": "EASE Cosmetics Select Store - Yantai Mountain", "transport": "Take Metro Line 1 to Shangteng Station, and walk for about 11 minutes to Tingxia Road."}, {"address": "No. 101 Zhongjie, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 stars | Must-buy list: Tong Ren Tang Nano Pearl Powder, Bird\u0027s Nest Beauty Oral Liquid, Qibai Herbal Mask Poultice. A historic and famous TCM pharmacy located within Shangxiahang\u0027s vintage architectural complex. Beyond traditional herbs, it is renowned for premium natural beauty nourishers\u2014especially its ultra-fine natural pearl powder and traditional Qibai whitening face pack, making it a must-visit spot for beauty enthusiasts seeking natural skincare solutions.", "name": "Tong Ren Tang TCM - Shangxiahang Flagship Store", "transport": "Take Metro Line 1 to Dadao Station, and walk for about 7 minutes to Shangxiahang Main Street."}], "name": "Local Iconic Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 39 Cangqian Road, Yantai Mountain Historic and Cultural Area, Cangshan District, Fuzhou City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Original cotton-linen dresses, designer canvas tote bags. Located along the Yantai Mountain Promenade, this independent design concept store is a favorite among Fuzhou\u0027s artistic youth. Featuring minimalist, natural-style clothing and handmade accessories, the pieces offer clean tailoring and comfortable fabrics. Blending seamlessly with the historic eclecticism of the area, it is the premier spot for quality apparel and limited-edition tote bags.", "name": "Wuyou Design Concept Store", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A) and walk for about 10 minutes."}, {"address": "No. 118 Xiahang Road, Shangxiahang Historic and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Fuzhou-themed embroidered canvas bags, original minimalist cotton T-shirts. SIMPLE MILL is a local Fuzhou lifestyle and apparel brand whose store in the Shangxiahang district is housed inside a converted century-old courtyard house. Offering carefully curated, culturally rich daily wear and accessories, it incorporates local Fuzhou elements into everyday fashion\u2014delivering great quality at affordable prices.", "name": "SIMPLE MILL Lifestyle \u0026 Apparel", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 8 minutes."}, {"address": "No. 12 Aiguo Road, Yantai Mountain, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 Stars | Must-Buy List: American retro vintage jackets, upcycled one-of-a-kind leather bags. Tucked away in the historic Western-style villa district of Yantai Mountain, this vintage select shop is beloved by local trendsetters and college students. The owner handpicks vintage clothing, unique leather goods, and classic footwear from around the world, each carrying a unique story and stylish attitude.", "name": "Daydreamer Vintage \u0026 Select", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit B) and walk for about 12 minutes."}, {"address": "No. 68 Shanghang Road, Shangxiahang Historic and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Handmade embroidered cloth shoes, Minnan-style frog-button tops. Situated in the historic water town district of Shangxiahang, this shop fuses traditional textile crafts with modern apparel design. Their embroidered cloth shoes feature breathable natural fabrics and comfortable insoles\u2014stylish and easy to walk in. Combined with distinctive frog-button cotton-linen shirts, it is a popular shopping and photo spot for fans of modern Chinese style.", "name": "Rongcheng Cloth Story", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 6 minutes."}, {"address": "No. 15 Lequn Road, Yantai Mountain Historic and Cultural Area, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 Stars | Must-Buy List: British-style handcrafted genuine leather boots, premium vintage messenger bags. Located in the heart of Yantai Mountain, this refined boutique specializes in niche independent designer clothing, shoes, and bags. Highlighting genuine leather boots and structured retro leather bags with exceptional craftsmanship and unique designs, it attracts stylish young shoppers who appreciate fashion details.", "name": "1728 Vintage Boutique", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A), then transfer to the Holiday Sightseeing Bus Line or walk for 15 minutes."}, {"address": "No. 45 Longping Road, Shangxiahang Historic and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.8 Stars | Must-Buy List: Modernized Chinese Qipao, matching handbags for Mamianqun (horse-face skirts). Located in the traditional historic district of Shangxiahang, this apparel store combines trendy Hanfu with wearable modern Chinese fashion. Exquisitely crafted outfits are paired with matching footwear and accessories. Many visitors come specifically for modernized Mamianqun skirts and matching woven bamboo embroidered bags, creating stunning photos while strolling through the water town.", "name": "Sanshan Jiushi Hanfu \u0026 Apparel", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 7 minutes."}, {"address": "No. 88 Tingxia Road, Yantai Mountain Historic and Cultural Area, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Designer tailored oversized blazers, minimalist geometric leather shoulder bags. SENSORY is a multi-brand select shop featuring emerging domestic and international designers, showcasing sleek urban and modern minimalist styles. Displaying fluid-silhouette clothing and premium leather handbags, it is highly favored by local fashion bloggers and professionals.", "name": "Sensory Designer Boutique", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A) and walk for about 10 minutes."}, {"address": "No. 22 Zhonghang Road, Shangxiahang Historic and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade vegetable-tanned leather wallets, vintage vegetable-tanned cowhide casual shoes. Tucked into a quiet alleyway in Shangxiahang, this workshop and specialty shop features purely handcrafted leather shoes and accessories. The footwear is comfortable and perfectly fitted, with leather that develops a richer patina over time. They also offer custom engraving, making these items memorable, high-quality souvenirs.", "name": "Yimuyiye Handmade Leather \u0026 Shoes", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 9 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 17 Zhongshi Road, Shangxiahang Historical and Cultural District, Taijiang District, Fuzhou City", "feature": "\u2b50 4.7 Stars | Must-Buy List: Dried Rouyan Wrapper Gift Box, Handmade Rouyan Dumplings, Yan Silk Noodles. As a century-old intangible cultural heritage brand in Fuzhou, Tongli Rouyan is famous for its unique technique of using duck eggs and lean pork to pound out delicate meat skins. The dried wrappers are easy to carry and preserve for a long time. Once home, simply wrap them around minced pork to recreate this classic Fuzhou dish\u2014making it the most iconic local souvenir for family and friends.", "name": "Tongli Rouyan Old Shop", "transport": "Take Metro Line 1 to Dadao Station (Exit C), then walk for about 8 minutes to reach the entrance of Shangxiahang."}, {"address": "No. 31 Cangqian Road, Yantai Hill Historical and Cultural District, Cangshan District, Fuzhou City", "feature": "\u2b50 4.8 Stars | Must-Buy List: Premium Needle King Jasmine Tea, Cold Brew Jasmine Tea Bags, Jasmine Pastries. Fuzhou is the birthplace of world jasmine tea. As a leading local tea enterprise, Chunlun combines traditional seven-scenting craftsmanship with modern, stylish packaging. Elegant tea gift sets filled with rich floral aromas are immensely popular among young tourists and tea enthusiasts alike.", "name": "Chunlun Jasmine Tea Cultural Center", "transport": "Take Metro Line 1 to Shangteng Station (Exit A), then walk about 10 minutes to Yantai Hill Commercial Street."}, {"address": "No. 128 Xiahang Road, Shangxiahang, Taijiang District, Fuzhou City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Crispy Pork Floss, Savory Pork Jerky, Fujian-style Meat Strips. Founded during the Guangxu reign of the Qing Dynasty, Dingriyou is the original brand of Fuzhou crispy pork floss. Golden, crispy, and melt-in-your-mouth, it offers a uniquely sweet and savory flavor that is distinctly Fujian. It is exceptionally popular whether paired with rice porridge or enjoyed as a daily snack.", "name": "Dingriyou Meat Floss Shop", "transport": "Take Metro Line 1 to Dadao Station, then walk about 10 minutes to Xiahang Road."}, {"address": "Intersection of Xiahang Road near Santong Bridge, Shangxiahang, Taijiang District, Fuzhou City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Fuzhou Olive Pastry, Fujian-style Ceremonial Cake, Ready-to-Eat Canned Buddha Jumps Over the Wall Gift Box. Juchunyuan is a China Time-Honored Brand and the birthplace of the famous dish \u0027Buddha Jumps Over the Wall\u0027. In addition to premium vacuum-packed room-temperature \u0027Buddha Jumps Over the Wall\u0027, its traditional Fujian ceremonial cakes and olive pastries are true classics\u2014featuring flaky crusts and perfectly balanced sweet fillings that evoke rich memories of old Fuzhou.", "name": "Juchunyuan Traditional Pastry \u0026 Souvenir Store", "transport": "Take Metro Line 1 to Dadao Station (Exit C), then walk towards Santong Bridge for about 7 minutes."}, {"address": "No. 45 Longping Road, Shangxiahang, Taijiang District, Fuzhou City", "feature": "\u2b50 4.4 Stars | Must-Buy List: Clove Olives, Yongtai Dried Furong Plums, Licorice Olives. Fuzhou is known as the \u0027Banyan City\u0027 and the \u0027Hometown of Olives\u0027. This specialty store curates the finest preserved olives and dried plums from Fujian. Thick, chewy, slightly sour yet sweet with a long-lasting aftertaste, these classic snacks are a must-buy treat while exploring the streets.", "name": "Yongtai Specialty \u0026 Fuzhou Preserved Fruit Shop", "transport": "Take Metro Line 1 to Dadao Station, then transfer to a bus or walk about 12 minutes to Longping Road."}, {"address": "No. 18 Lequn Road, Yantai Hill, Cangshan District, Fuzhou City", "feature": "\u2b50 4.6 Stars | Must-Buy List: Fuzhou Raw Lacquer Bookmarks, Handmade Lacquer Jewelry Boxes, Jasmine Scented Handmade Soaps. Combining Fuzhou\u0027s intangible cultural heritage of Bodiless Lacquerware with the international architectural creativity of Yantai Hill, this shop transforms traditional lacquer art into high-texture modern stationery and daily goods that are exquisite, beautiful, and rich in cultural heritage.", "name": "Yantai Hill Lacquer Art \u0026 Crafts Shop", "transport": "Take Metro Line 1 to Shangteng Station, then walk towards Lequn Road, Yantai Hill for about 12 minutes."}, {"address": "No. 88 Shanghang Road, Shangxiahang, Taijiang District, Fuzhou City", "feature": "\u2b50 4.3 Stars | Must-Buy List: Fresh Taro Paste Cups, Handmade Peanut Brittle, Cunzao Sweet Crisp Sticks. Here, the traditional Fuzhou banquet dessert\u2014taro paste\u2014is packed into convenient single-serve cups that are rich and smooth. The peanut brittle and traditional Spring Festival staple \u0027Cunzao\u0027 are sweet and crunchy, making them delightful snacks that showcase old-fashioned Fuzhou flavors.", "name": "Minwei Traditional Handmade Pastry Shop", "transport": "Take Metro Line 1 to Dadao Station (Exit C), then walk for about 9 minutes to Shanghang Road."}, {"address": "No. 2 Aiguo Road, Yantai Hill, Cangshan District, Fuzhou City", "feature": "\u2b50 4.5 Stars | Must-Buy List: Hand-Drawn Yantai Hill Historic Architecture Canvas Tote Bags, Fuzhou Dialect Mugs, Miniature Oil-Paper Umbrella Ornaments. Designed for hipsters and tourists, this local lifestyle creative store integrates elements like Fuzhou oil-paper umbrellas, historic quarters, and Yantai Hill\u0027s Western-style architecture into everyday items, offering stylish and memorable gifts.", "name": "Pagoda Cultural \u0026 Fuzhou Gift Shop", "transport": "Take Metro Line 1 to Shangteng Station, then walk about 11 minutes to the intersection of Aiguo Road and Lequn Road."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 14 Meiwu Road, Cangqian Subdistrict, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Yantai Mountain exclusive cultural \u0026 creative canvas bags, Fuzhou special lacquerware crafts, Fuzhou jasmine tea home fragrances. Blending Western-style historic architecture with modern retail, Yantai Mountain Commercial Walkway is Fuzhou\u0027s most iconic trendy and creative hub. It gathers local designer brands and vintage lifestyle boutiques amid red-brick mansions and lush green trees, making it the top shopping destination for tourists to experience Fuzhou\u0027s contemporary creativity and historical charm.", "name": "Yantai Mountain Commercial Walkway (\u7159\u81fa\u5c71\u5546\u696d\u6f2b\u6b65\u8857\u5340)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station (Exit A) and walk for about 10 minutes."}, {"address": "Inside Shangxiahang Historic and Cultural Block, Santongqiao Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade oil-paper umbrellas, Fuzhou Three Treasures lacquer tea sets, Eastern Fujian handmade pastry gift boxes. The Shangxiahang Historic and Cultural Block has been Fuzhou\u0027s commercial center and the birthplace of trade guilds since ancient times. Hang Street houses numerous time-honored local brands and intangible cultural heritage craft shops. Visitors can shop for traditional lacquer handicrafts and local creative souvenirs in classic, picturesque water-town alleyways while feeling the rich history of Fujian merchant culture.", "name": "Shangxiahang Hang Street Cultural and Creative Block (\u4e0a\u4e0b\u676d\u00b7\u676d\u8857\u6587\u5275\u96c6\u805a\u5340)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station (Exit C) and walk for about 8 minutes."}, {"address": "No. 1 Nantong Town Avenue, Fuzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Discounted Coach leather bags, limited-edition Nike sneakers, Tommy Hilfiger casual wear. As Fuzhou\u0027s most iconic large-scale outlet center, it features Italian town-style architecture and houses over 300 renowned international and domestic brands. Offering year-round discounts from 50% to 90% off, it is perfect for travelers looking to indulge in high-value luxury shopping and athletic wear.", "name": "Sasseur Outlet Fuzhou (\u7802\u4e4b\u8239(\u798f\u5dde)\u5967\u7279\u840a\u65af)", "transport": "Driving is recommended, or take the Outlet Shuttle Bus from Fuzhou city center, or take Bus Line 321 to \u0027Sasseur Outlet Station\u0027."}, {"address": "Intersection of Bayiqi South Road and Taijiang Road, Taijiang District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Affordable Mindu-style apparel, traditional lacquer thread sculpture ornaments, Fuzhou time-honored ox horn combs. Adjacent to Shangxiahang, Zhongting Street is a historic wholesale and retail hub for clothing and general merchandise in Fuzhou, featuring several large department stores. Renowned for budget-friendly fashion, home textiles, and local traditional crafts, it offers an authentic taste of Fuzhou\u0027s bustling street life and everyday local shopping vibe.", "name": "Zhongting Street Shopping Center (\u798f\u5dde\u4e2d\u4ead\u8857\u8cfc\u7269\u4e2d\u5fc3)", "transport": "Take Fuzhou Metro Line 1 to Dadao Station, or take multiple bus lines to \u0027Zhongting Street Station\u0027."}, {"address": "Yantai Mountain Park, No. 18 Lequn Road, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade lacquer accessories, Fuzhou-themed cotton-linen scarves, original historic house-shaped scented candles. Located in the heart of Yantai Mountain, this local independent boutique highlights original design works and innovative heritage crafts by young Fuzhou artists. The interior design boasts refined aesthetic taste, seamlessly integrating traditional lacquer craftsmanship into modern accessories. It is the best place to find unique souvenirs infused with Fuzhou\u0027s authentic cultural memories.", "name": "Rongji Yantai Mountain Independent Designer Boutique (\u6995\u96c6\u00b7\u7159\u81fa\u5c71\u7368\u7acb\u8a2d\u8a08\u5e2b\u9078\u54c1\u5e97)", "transport": "Take Fuzhou Metro Line 1 to Shangteng Station, then transfer to a community bus or walk for about 12 minutes."}, {"address": "Intersection of Jiangnan Shuidu Avenue and Jiangbin West Avenue, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Premium olive wood carvings, Fuzhou exclusive agarwood essential oils, luxury handmade brocade shawls. Situated along the Min River, this high-end waterfront commercial complex is just a few minutes\u0027 drive from Yantai Mountain. Featuring fine lifestyle boutiques, high-end craft workshop studios, and designer fashion, it provides an elegant and luxurious shopping environment where guests can enjoy beautiful night views of the Min River after shopping.", "name": "Rongqiao Riverside ONE (\u878d\u50d1\u5916\u7058\u58f9\u865f)", "transport": "Take Bus 162 or 85 to \u0027Rongqiao Waitan Station\u0027."}, {"address": "No. 198 Pushang Avenue, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Fuzhou independent designer apparel, Fuding white tea premium gift sets, Fuzhou exclusive handmade home fragrances. A flagship modern commercial shopping center in Cangshan District and a gathering place for fashion brands. Beyond international fashion and cosmetics counters, it houses extensive spaces for local lifestyle goods and tea culture experiences, making it an ideal one-stop shopping destination for the whole family.", "name": "Cangshan Aegean Sea Shopping Park (\u5009\u5c71\u611b\u7434\u6d77\u8cfc\u7269\u516c\u5712)", "transport": "Take Fuzhou Metro Line 2 to Jinxiang Station and transfer to a bus, or take various bus lines directly to \u0027Aegean Sea Shopping Park Station\u0027."}, {"address": "No. 274 Pushang Avenue, Cangshan District, Fuzhou City, Fujian Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Fuzhou local specialty tea gifts, Fujian creative stationery \u0026 accessories, Fuzhou delicate local pastry gifts. An immensely popular commercial plaza in Cangshan District combining trendy fashion, chain supermarkets, beauty brands, and Fujian-Taiwanese creative goods. Its Fujian Specialty Zone offers high-quality local teas and traditional pastries, making it a convenient stop for souvenir shopping and experiencing local convenience before leaving Fuzhou.", "name": "Cangshan Wanda Plaza (\u5009\u5c71\u842c\u9054\u5ee3\u5834)", "transport": "Take Bus K3, 125, or 151 to \u0027Cangshan Wanda Plaza Station\u0027."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Fuzhou - Yantai Mountain and Shangxiahang Historic District"}, "quanzhou_weststreet": {"categories": {"cat_1": {"items": [{"address": "No. 128, Zhongshan Middle Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Pien Tze Huang Pearl Cream, Queen Brand Pearl Cream, Pien Tze Huang Skin Nourishing Toothpaste. Fujian\u0027s most famous time-honored traditional medicine skincare brand. It specializes in combining precious Pien Tze Huang ingredients with modern beauty skincare. Its classic pearl cream is highly acclaimed for improving dull skin and acne-prone skin, making it a must-buy local signature skincare souvenir when visiting Fujian.", "name": "Pien Tze Huang Pearl Cream Experience Store", "transport": "Take the Quanzhou Ancient City \u0027Xiaobai\u0027 mini bus, get off at Zhongshan Middle Road Station, and walk for about 1 minute."}, {"address": "No. 246, Zhongshan Middle Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditional Herbal Acne Powder Mask, Chinese Herbal Foot Soak Packs, Hanfang Wellness Scented Sachets. A century-old traditional pharmacy in Quanzhou founded during the Qing Dynasty. It transforms traditional Southern Fujian herbs into natural cosmetics and home care products. Filled with a rich herbal aroma, it is beloved by locals and tourists who value natural care.", "name": "Quanzhou Chunshengtang Time-Honored Pharmacy", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus, get off at Huaxiang Kou Station, and walk for about 2 minutes."}, {"address": "No. 12, Nankuohou Alley, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Zanhuawei Floral Headpiece Themed Solid Perfumes, Jasmine Nourishing Lip Balm, Zaiton (Erythrina) Flower Fragrance Hand Cream. A charming cultural and creative beauty shop hidden in an alley off West Street. Inspired by the traditional Xunpu women\u0027s flower headpiece (\u0027Zanhuawei\u0027) culture of Quanzhou, it infuses local floral scents into solid perfumes and skincare items. The exquisite vintage packaging captures the unique charm of the ancient city.", "name": "Quanzhou Ancient City Solid Perfume \u0026 Cosmetics Shop", "transport": "Enter through the alley next to the West Street Cinema and Theater, and walk for about 150 meters."}, {"address": "No. 116, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Seven-White Whitening Powder, Agarwood Herbal Handmade Soap, Honeysuckle Soothing Hydrating Mist. A distinctive local herbal beauty shop in the Licheng Ancient City area. It insists on using local Minnan herbal botanicals for handcrafted production. The products are gentle with a calming natural fragrance, making it a unique beauty spot in the old town.", "name": "Minnan Botanical Cosmetics \u0026 Handmade Herbal Shop", "transport": "Walk about 3 minutes from the West Tower exit of Kaiyuan Temple."}, {"address": "No. 178, Zhongshan Middle Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Guochao (China-chic) Eyeshadow Palettes, Rainbow Beauty Sponge Sets, Botanical Hydrating Sheet Masks. A massive beauty multi-brand store located inside a historic arcade building on Zhongshan Road. Featuring a visually striking wall made entirely of rainbow beauty sponges, it brings together popular C-beauty brands and emerging cosmetics lines. It is a hotspot for young women to shop and try on makeup.", "name": "THE COLORIST (Quanzhou Zhongshan Road Store)", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus directly to Zhongshan Middle Road Commercial Street, then walk to destination."}, {"address": "No. 58, West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Bird\u0027s Nest Brightening Sheet Masks, Collagen Nourishing Hand Cream, High-SPF Sunscreen Spray. Located adjacent to Kaiyuan Temple and the core commercial district of West Street, offering a wide range of emergency travel makeup, after-sun care, and personal hygiene products. It is the most convenient option for tourists looking to restock daily skincare products while touring the old town.", "name": "Watsons (Quanzhou Xijie Store)", "transport": "Walk to the junction of West Street and Kaiyuan Temple Square, and you will see the main entrance."}, {"address": "No. 152, Tumen Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Pearl Powder Whitening Mask, Ejiao Beauty Paste, Rose Hydrosol Toning Lotion. A time-honored traditional Chinese herbal pharmacy brand that extends classic TCM wellness philosophy into herbal cosmetics. Its fine pearl powder and herbal skincare products are extremely popular among customers seeking holistic beauty routines.", "name": "Beijing Tongrentang (Quanzhou Store)", "transport": "Take bus K1 or K602 to Guandi Temple Station, and walk for about 2 minutes."}, {"address": "No. 32, Zhongshan South Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Explorer 12-Slot Eyeshadow Palette, Read Me Lip Tint, Bionic Film Essence Lipstick. An experience store for one of China\u0027s most popular domestic makeup brands. It offers a full range of cosmetics to try out, along with professional on-site makeup application. The store features a bright and trendy atmosphere, frequently releasing makeup gift sets infused with local cultural elements.", "name": "Perfect Diary Experience Store (Quanzhou Zhongshan Store)", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus, get off at Pangongkou Station, and walk for about 1 minute."}], "name": "Local Signature Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 120 Zhongshan Middle Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Iconic Black Trousers (stretch slim-fit dress pants), Ice Silk Polo Shirts, Lightweight Windproof Jackets. Originating in Quanzhou, JOEONE is hailed as \u0027China\u0027s Men\u0027s Trousers Expert.\u0027 This store in Licheng District boasts a comprehensive selection alongside top-notch local tailoring services. Their classic Black Trousers are breathable, comfortable, and highly elastic\u2014a must-buy staple for local professionals and travelers alike.", "name": "JOEONE Menswear (Licheng Store)", "transport": "Take Bus K1 or 6 to \u0027Bell Tower (Zhonglou) Station\u0027, then walk about 3 minutes."}, {"address": "No. 28 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: 160X Carbon-Plate Professional Running Shoes, Guochao (Chinese Trend) Retro Casual Shoes, Lightweight Sports Backpacks. As a sportswear giant rooted in Quanzhou, Xtep\u0027s West Street flagship blends traditional red-brick architecture with modern design. The top-selling 160X running shoes are a favorite among marathon runners, while their trendy Guochao-inspired apparel makes this a popular check-in spot for young shoppers.", "name": "Xtep Flagship Store (Xijie Branch)", "transport": "Take the Ancient City \u0027Xiaobai\u0027 Shuttle directly to \u0027Xijie Zhonglou Station\u0027, then walk about 2 minutes."}, {"address": "No. 112 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: TAICHI Adaptive Tech Slides, TAICHI Basketball Shoes, Embroidered Sports Hoodies. PEAK is one of Quanzhou\u0027s most internationally recognized sportswear brands. The West Street concept store highlights its signature \u0027TAICHI Tech\u0027, featuring an adaptive sole material that transitions between soft and firm for supreme comfort. The TAICHI slides are an absolute fatigue-relieving must-buy for tourists exploring the old town\u0027s cobblestone streets.", "name": "PEAK Sports Concept Store (Xijie Branch)", "transport": "Take the Ancient City \u0027Xiaobai\u0027 Shuttle to \u0027Kaiyuan Temple Station\u0027, then walk about 1 minute."}, {"address": "No. 210 Zhongshan Middle Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Qidian Tech Running Shoes, Quanzhou-Themed Co-branded T-shirts, Windproof Sports Jackets. ERKE is a popular homegrown sportswear brand known nationwide for its incredible value and patriotic corporate image. In addition to professional footwear, this store features exclusive local apparel printed with Quanzhou paulownia blossoms and Hokkien motif designs, highly favored by travelers.", "name": "ERKE Store (Licheng Branch)", "transport": "Take Bus 2 or 6 to \u0027Huaxiang Kou Station\u0027, then walk about 4 minutes."}, {"address": "No. 18 Jingting Lane, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.9 Stars | Must-Buy List: Handmade Oyster Shell Floral Hairpieces, Traditional Minnan Slanted-Jacket Sets, Vintage Embroidered Cloth Shoes. Nestled in a quiet alleyway of Licheng\u0027s ancient city, this studio is dedicated to preserving the internationally famous Xunpu women\u0027s \u0027Zanhuawei\u0027 (floral headpieces) and traditional Minnan attire. Visitors can rent outfits for photo shoots or purchase handcrafted floral hair ornaments and embroidered shoes to take home a piece of rich Minnan culture.", "name": "Zanhuawei Floral Headdress \u0026 Minnan Hanfu Studio", "transport": "Located in an alley near Kaiyuan Temple; walk from West Street into Jingting Lane to arrive."}, {"address": "No. 56 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Big3 Professional Basketball Shoes, \u0027The Three-Body Problem\u0027 Sun-Protective Clothing, Techwear Crossbody Bags. Born in Quanzhou, 361\u00b0 blends trendy streetwear aesthetics with athletic performance in this flagship location. Their Big3 basketball sneakers are legendary among sneakerheads, while crossover collaborative apparel like \u0027The Three-Body Problem\u0027 sci-fi collection and functional sling bags are top bestsellers.", "name": "361\u00b0 Concept Store (Xijie Branch)", "transport": "Take the Ancient City \u0027Xiaobai\u0027 Shuttle to \u0027Yinjuyuan (Theater) Station\u0027, then walk about 2 minutes."}, {"address": "No. 35 Daxi Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Designer Denim Jackets, Geometric Print T-Shirts, Streetwear Cargo Crossbody Bags. Founded by renowned Quanzhou-born designer Mr. Cabbeen, Cabbeen is a pioneer in Chinese high-street menswear. Featuring avant-garde and streetwear-inspired designs with sharp tailoring and bold personality, this store is hugely popular among young locals and a must-visit for fashion enthusiasts exploring the old town.", "name": "Cabbeen Trend Menswear (Licheng Store)", "transport": "Take Bus 3 or 12 to \u0027Fu Wen Miao (Confucian Temple) Station\u0027, then walk about 5 minutes."}, {"address": "No. 181 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Quanzhou Hokkien Dialect Canvas Bags, Red-Brick Ancient Residence Motif Embroidered Shoes, \u0027Strive to Win\u0027 Cultural Tote Bags. This independent local boutique incorporates Quanzhou\u0027s red-brick architecture, swallowtail roofs, and Hokkien idioms into its handcrafted canvas bags and traditional cloth shoes. Rustic, practical, and packed with local nostalgia, it\u0027s a unique shop for apparel and accessories that shouldn\u0027t be missed on West Street.", "name": "Xijie 181 Cultural Canvas Bags \u0026 Shoes Store", "transport": "Take the Ancient City \u0027Xiaobai\u0027 Shuttle to \u0027Kaiyuan Temple West Side Station\u0027, then walk about 1 minute."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "No. 118 Xijie Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Sweet \u0026 Sour Candied Fruit, Candied Olives, Jihong Cake (Mandarin Orange Cake). A century-old brand, Yuanhe Tang holds fond childhood culinary memories for generations of Quanzhou locals. Famous for preserving candied fruit using traditional ancient methods, its signature \u0027Sweet \u0026 Sour\u0027 blend combines licorice, dried tangerine peel, and pickled plum flavors. Richly layered, refreshing, and thirst-quenching, it is one of the most authentic traditional souvenirs capturing the essence of Quanzhou\u0027s ancient city.", "name": "Yuanhe Tang Candied Fruit (Xijie Branch)", "transport": "Take the Quanzhou \u0027Xiaobai\u0027 mini bus to Xijie Kaiyuan Temple Station, then walk for about 2 minutes."}, {"address": "No. 62 Xijie Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Yilan Peanut Crisp, Traditional Gongtang (Peanut Candy), Garlic Peanuts. Yilan Peanut Crisp is one of Quanzhou\u0027s most famous pastry souvenirs, made by carefully selecting high-quality local peanuts cooked with maltose. Melt-in-your-mouth, rich, non-sticky, and infused with a nutty roasted aroma, it is immensely popular with both domestic and international tourists, often drawing long lines.", "name": "Yilan Peanut Crisp (Xijie Branch)", "transport": "Take the Ancient City community bus \u0027Xiaobai\u0027 to the middle section of Xijie Street, then walk for about 1 minute."}, {"address": "No. 5 Jinyu Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Sesame \u0026 Peanut Lantern Festival Balls, Traditional Mochi, Taro Paste Gift Box. This heritage store in the ancient city is an iconic spot for Quanzhou\u0027s Lantern Festival glutinous rice balls and traditional Southern Fujian desserts. Its rice balls are crafted using traditional flour-rolling techniques, filled with fragrant crushed peanuts, sesame seeds, and candied melon. Once boiled, they feature a chewy skin with a burst of rich filling. Beautifully packaged frozen vacuum packs are also available for tourists to take home.", "name": "Haisi Jinfeng Lantern Festival Glutinous Rice Balls", "transport": "Turn into Jinyu Alley from Zhongshan Middle Road and walk for about 150 meters."}, {"address": "No. 224 Xijie Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Garlic Dough Twists, Sesame Sugar Dough Twists, Spicy Mini Dough Twists. \u0027Suanrongzhi\u0027 (garlic dough twists) is a unique traditional Quanzhou pastry snack shaped like a mini twisted dough roll, coated with a snowy white frosting made from minced garlic and sugar. Crispy, mildly sweet with a subtle garlic aroma, its unique sweet-and-savory flavor makes it an indispensable stroll snack along Xijie Street.", "name": "Meng\u0027s Garlic Dough Twists (Xijie Branch)", "transport": "Take the \u0027Xiaobai\u0027 mini bus to the Xijie section west of Kaiyuan Temple, then walk for about 3 minutes."}, {"address": "No. 160 Xijie Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Red-Brick Shaped Pineapple Cakes, Xunpu Floral Headpiece Tea Bags, Gargoyle-Shaped Mung Bean Cakes. This exquisite store seamlessly blends Southern Fujian\u0027s ancient architectural heritage and intangible cultural elements into gourmet snacks and creative products. The pineapple cakes come in packaging shaped like swallowtail red-brick roofs, while the mung bean cakes are molded like traditional roof gargoyles (\u0027Dishuisheu\u0027), making them visually stunning and rich in local cultural value.", "name": "Quanzhou Story Souvenir \u0026 Creative Cultural Shop", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus to Xijie Kaiyuan Temple Square, then walk for about 100 meters."}, {"address": "No. 235 Xijie Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Signature Salted Egg Yolk Taro Cake, Purple Sweet Potato Taro Cake, Pork Floss Taro Cake. Freshly fried to order, Aunt Zhuang\u0027s Taro Cakes are a wildly popular street food along Xijie. Made from premium Fujian Binglang taro paste, the cakes feature a golden, crispy crust and a smooth, aromatic taro filling. Paired with salted egg yolk or pork floss, they are irresistible, and the store provides custom gift boxes perfect for day-of souvenirs.", "name": "Aunt Zhuang\u0027s Taro Cake (Xijie Branch)", "transport": "Located on the main pedestrian area of Xijie Street. Take the Ancient City \u0027Xiaobai\u0027 mini bus and flag it down along Xijie."}, {"address": "No. 12 Chengzaihou Road (Near Zhongshan South Road), Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Century-Old Traditional Mung Bean Cake, Scallion Mung Bean Cake, Traditional Southern Fujian Spice Cake. Zhengquanmao has preserved its century-old technique of handmade baking. The multi-layered pastry skin is delicate and flaky after baking, while the pure mung bean paste filling is refreshing, silky, and melts in your mouth. It remains an essential traditional tea pairing for locals during holidays and tea gatherings.", "name": "Zhengquanmao Mung Bean Cake", "transport": "Take the bus to Tianhou Temple Station and walk for about 5 minutes to Chengzaihou Road."}, {"address": "No. 18 Jiuguanyi Alley, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Anxi Tieguanyin Gift Box, Wuyi Rock Tea with Little Green Citrus, Southern Fujian Red-Brick Pattern Tea Tray. Tucked away in the historic Jiuguanyi Alley in the ancient city, this shop specializes in premium local tea gifts. In addition to classic charcoal-roasted Anxi Tieguanyin, the teas are packaged in elegant tin boxes themed around traditional Southern Fujian architecture, making them a refined gift for elders or tea enthusiasts.", "name": "Jiuguanyi Handmade Tea \u0026 Souvenir Shop", "transport": "Turn into Jiuguanyi Alley from Xijie Street and walk about 200 meters into the alley."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 155 Xinhua North Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Hui\u0027an maiden folk handmade accessories, Quanzhou Erythrina flower-themed gift boxes, local creative canvas bags. A modern large-scale shopping center located at the intersection of Xijie and Xinhua North Road, right next to Kaiyuan Temple. The plaza integrates traditional Southern Fujian red-brick architecture into its modern mall design. Beyond numerous famous fashion brands, its main draw for tourists is the rich selection of local intangible cultural heritage creative counters and specialty souvenir stores on the B1 and 1st floors\u2014making it the best place to pick up all your local souvenirs after exploring the ancient city.", "name": "Kaiyuan Shengshi Plaza", "transport": "Take the Quanzhou Ancient City \u0027Xiaobai\u0027 mini bus directly to \u0027Kaiyuan Shengshi Plaza Station\u0027, or walk to the west end of West Street."}, {"address": "No. 268 Tumen Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Anxi premium Tieguanyin tea, traditional Southern Fujian peanut gong candy, Shishi local tailored clothing. Zhongmin Baihui is a leading local legacy department store chain in Fujian. The Tumen branch has been deeply rooted in the Licheng ancient city area for years and is well-loved by locals. Instead of overly flashy packaging, the mall focuses on affordability, authentic local flavor, and quality. The basement supermarket is the most comprehensive and reasonably priced place to buy local Quanzhou specialties like Tieguanyin, wheat noodles (mianxian), aromatic biscuits, and pork floss. The 2nd and 3rd floors feature many local Fujian clothing and textile brands.", "name": "Zhongmin Baihui Department Store - Tumen Branch", "transport": "Take bus K1, 4, or 6 to \u0027Qingjing Mosque Station\u0027 or \u0027Guandi Temple Station\u0027, then walk about 150 meters."}, {"address": "No. 85 Sunjiang Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-buy list: Anta flagship discounted sneakers, Peak Taichi series running shoes, Jiumuwang men\u0027s casual pants. This is the closest large outlet shopping center to the core of the ancient city in Licheng District. It brings together factory direct discount stores for many top Fujian footwear and apparel brands (such as Anta, Xtep, 361\u00b0, Septwolves, etc.). Offering year-round discounts from 50% to 80% off, it is a fantastic choice for tourists wanting to experience Fujian\u0027s powerful manufacturing supply chain as the \u0027Shoe Capital of China\u0027 and pick up great value sportswear.", "name": "Xintian City Plaza Outlet Mall", "transport": "Take bus 201 or 24 to \u0027Xintian City Plaza Station\u0027."}, {"address": "No. 666 Fengze Street, Fengze District, Quanzhou City, Fujian Province (adjacent to Licheng East Street Commercial Area)", "feature": "\u2b50 4.7 stars | Must-buy list: Traditional Southern Fujian herbal balm, Quanzhou local designer scented candles, exquisite handmade stained glass tea sets. Located at the eastern gateway of the ancient city, this boutique commercial complex boasts exceptional architectural design and vibe. It features several pop-up stores and curated lifestyle shops from local independent Quanzhou designers, blending contemporary aesthetics with traditional Southern Fujian elements. When tired, you can relax in stylish independent cafes or boutique tea rooms inside the mall to enjoy an elegant, modern shopping experience.", "name": "Nanyi Plaza Mall", "transport": "Take bus 17, 21, or K1 to \u0027Youth Palace Station\u0027, then walk about 200 meters."}, {"address": "No. 39 West Street, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-buy list: Red brick roof-beast ceramic ornaments, hand-drawn architecture postcard set of Quanzhou Ancient City, traditional swallowtail roof ridge bookmarks. Nestled deep in an old red-brick lane on West Street, this independent curated cultural shop is a iconic staple of Quanzhou\u0027s ancient city. The store meticulously curates and designs original goods with rich Southern Fujian flavor\u2014notably transforming traditional roof elements like gargoyle \u0027water spouts\u0027 and \u0027swallowtail ridges\u0027 into stylish daily items. Every product is packed with history and handcrafted warmth.", "name": "Xijie Mustard Seed Cultural \u0026 Creative Store", "transport": "Enter the West Street pedestrian zone and walk for about 3 minutes."}, {"address": "Inside Confucian Temple Plaza, Middle Zhongshan Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Xunpu women\u0027s flower hairpin headpiece set, miniature string puppet handicrafts, Quanzhou intangible cultural heritage Jincang embroidery accessories. Located right next to the Confucian Temple Plaza, this independent store focuses on Quanzhou\u0027s intangible cultural heritage. It showcases and sells handcrafted art adapted by local veteran master craftspeople and young artists. Creative goods based on the Xunpu Village \u0027Zhanhuwei\u0027 flower headwear and handmade string puppets are top sellers, making it the premier spot for supporting local culture and picking up meaningful heritage gifts.", "name": "Confucian Temple Cultural Heritage Store", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus to \u0027Confucian Temple Station\u0027."}, {"address": "Inside Yuanhe 1916 Creative Park, No. 55 Xinhua South Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Yuanhetang traditional paper-wrapped preserved fruits, Quanzhou intangible cultural heritage woven paper paintings, Southern Fujian vintage tile motif floor mats. A creative park concept store renovated from the former site of \u0027Yuanhetang Preserved Fruit Factory\u0027, a century-old Quanzhou brand. The shop sells authentic, traditionally preserved fruits like candied peaches and salted olives, while also featuring creative homeware designed by resident young artists who incorporate traditional Minnan tile patterns and paper-weaving craft into modern decor.", "name": "Yuanhe 1916 Lifestyle \u0026 Selection Store", "transport": "Take bus K702 or K1 to \u0027Xinhua South Road Station\u0027 and walk into the park."}, {"address": "No. 1 South Zhongshan Road, Licheng District, Quanzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Quanzhou lacquer thread sculpture desktop ornaments, traditional Minnan mung bean cake gift boxes, Fujian Anxi tea set. Situated on Zhongshan Road\u2014the most iconic arcade street in Quanzhou\u2014this classic department store is deeply embedded in the daily life of the old town. Combining a traditional department store with local craft displays, its ground floor and specialty souvenir sections showcase exquisite lacquer thread sculptures representing the pinnacle of local craftsmanship, along with traditional pastry sets trusted by locals and travelers alike.", "name": "Zhongmin Baihui Department Store - Zhongshan Road Store", "transport": "Take the Ancient City \u0027Xiaobai\u0027 mini bus along Zhongshan Road to \u0027Shuimen Xiangkou Station\u0027."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Quanzhou - Licheng Ancient City and West Street Commercial District"}, "wuyishan_resort": {"categories": {"cat_1": {"items": [{"address": "No. 168 Dawangfeng Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Queen Brand Pearl Cream, Pearl Whitening Essence, Pianzihuang Toothpaste. As Fujian\u0027s most famous indigenous Traditional Chinese Medicine (TCM) cosmetics brand, Pianzihuang boasts a rich history of secret royal palace formulas. Located in the resort area, this flagship experience store offers a full line of herbal skincare products. Its iconic Pearl Cream is renowned for deep nourishment, spot correction, and skin brightening\u2014an absolute must-buy domestic cosmeceutical when visiting Fujian.", "name": "Pianzihuang Experience Store - Wuyishan Resort (\u7247\u4ed4\u7640\u9ad4\u9a57\u9928 \u6b66\u5937\u5c71\u5ea6\u5047\u5340\u5e97)", "transport": "Take Wuyishan Bus Line 9 or K1 to Resort Area Roundabout Station (\u5ea6\u5047\u5340\u74b0\u5cf6\u7ad9), then walk for about 3 minutes."}, {"address": "No. 25 Shangmao Street, National Tourism Resort, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Pure Wild Camellia Skincare Oil, Camellia Repair Handmade Soap, Camellia Hydrating Lip Balm. Wuyishan is rich in premium camellia seeds. Combining local, high-purity cold-pressed camellia oil with modern moisturizing technology, this shop offers highly hydrating skincare products with distinct local flair. Camellia oil is naturally gentle, lightweight, and easily absorbed\u2014perfect for restoring dry or sensitive skin, earning glowing reviews from travelers.", "name": "Wuyishan Camellia Oil Cosmetics Store (\u6b66\u5937\u5c71\u5c71\u8336\u6cb9\u7279\u8272\u7f8e\u599d\u9928)", "transport": "Take Wuyishan Bus Line 6 to Sangu Street Station (\u4e09\u59d1\u8857\u7ad9), then walk for about 5 minutes."}, {"address": "No. 88 Dujia Street, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Wuyi Tea Polyphenol Hydrating Sheet Mask, Camellia Oil Deep Repair Hand Cream, Green Tea Oil-Control Cleanser. A deeply rooted local Fujian cosmeceutical chain, Yijia specializes in hydrating and antioxidant skincare formulated with tea extracts from Northern Fujian. Packed with affordable local beauty products, its Wuyi Rock Tea Polyphenol Mask leaves the skin refreshed and glowing, making it a top choice for both locals and tourists stocking up.", "name": "Yijia Cosmetics \u0026 Pharmacy - Sangu Store (\u5b9c\u5bb6\u7f8e\u599d\u85e5\u599d\u9023\u9396 \u6b66\u5937\u5c71\u4e09\u59d1\u5e97)", "transport": "Take Bus Line 9 to Sangu Resort Area Station (\u4e09\u59d1\u5ea6\u5047\u5340\u7ad9), then walk about 200 meters."}, {"address": "No. 12 Baihua Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Wuyishan Snake Oil Chapped Skin Repair Ointment, Pianzihuang Pearl Gel Cream, Propolis Body Lotion. Beyond essential medical pharmaceuticals, Sinopharm features a dedicated cosmeceutical section showcasing Wuyishan snake oil products and local Fujian beauty brands. Snake oil ointment is exceptionally soothing and nourishing for dry or chapped skin in autumn and winter. Affordable and practical, it makes a uniquely local souvenir.", "nam
