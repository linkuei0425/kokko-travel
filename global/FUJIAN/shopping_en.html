e": "Sinopharm Pharmacy - Wuyishan Resort (\u570b\u85e5\u63a7\u80a1\u5927\u85e5\u623f \u6b66\u5937\u5c71\u5ea6\u5047\u5340\u5e97)", "transport": "Take Wuyishan Bus Line K1 to Baihua Road Intersection Station (\u767e\u82b1\u8def\u53e3\u7ad9); the store is right at the stop."}, {"address": "No. 18 Tea Culture Street, Jiaoting Village, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Dahongpao Tea Polyphenol Anti-Aging Essence, Rock Tea Soothing Essential Oil, Tea-Infused Exfoliating Body Scrub. An independent beauty boutique blending Wuyishan\u0027s legendary Dahongpao tea with modern aromatherapy, where the store owner handcrafts tea-infused skincare. Made with high-mountain tea extracts rich in antioxidants and soothing properties, the shop also offers a DIY experience where you can blend your own personalized tea-fragranced skincare oils.", "name": "Wuyi Tea Charm Handmade Cosmetics (\u6b66\u5937\u8336\u97fb\u672c\u571f\u7f8e\u599d\u624b\u4f5c\u574a)", "transport": "Take Wuyishan Bus Line 6 to Jiaoting Village Station (\u89d2\u4ead\u6751\u7ad9), then walk for about 4 minutes."}, {"address": "1st Floor, Taiyangcheng Commercial Plaza, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Olive \u0026 Camellia Body Lotion, Green Tea Antioxidant Sheet Mask, Botanical Hydrating Facial Mist. Located in the heart of Wuyishan Resort, this well-known beauty retailer features popular international brands alongside a special dedicated corner for local Fujian botanical and tea-infused skincare. With frequent promotions and easy restocking, it\u0027s a convenient hub for travelers looking to grab daily skincare essentials or travel kits.", "name": "Watsons - Wuyishan Sangu Resort (\u5c48\u81e3\u6c0f \u6b66\u5937\u5c71\u4e09\u59d1\u5ea6\u5047\u5340\u5e97)", "transport": "Take Wuyishan Bus Line 9 to Taiyangcheng Plaza Station (\u592a\u967d\u57ce\u5ee3\u5834\u7ad9); the shop is visible right at the stop."}, {"address": "No. 36 Jinguan Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Wuyi Reishi Mushroom Repair Essence, Snake Gallbladder \u0026 Fritillaria Herbal Ointment, Camellia Repair Mask. A cosmeceutical pharmacy chain incorporating authentic Northern Fujian herbs like Wuyi Reishi mushroom and camellia. Its signature Reishi Repair Essence focuses on anti-aging and strengthening the skin barrier. The safe, gentle herbal formulas are a hit among tourists who value natural ingredients.", "name": "Kangmei Cosmeceutical Pharmacy (\u5eb7\u7f8e\u85e5\u599d\u5927\u85e5\u623f \u6b66\u5937\u5c71\u5ea6\u5047\u5340\u5e97)", "transport": "Take Bus Line 6 or 9 to Jinguan Road Intersection Station (\u91d1\u51a0\u8def\u53e3\u7ad9), then walk about 3 minutes."}, {"address": "No. 208 Wuyi Avenue, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Ancient Method Pearl Whitening Powder, Wuyishan Camellia Oil Gromwell Root Ointment, Mugwort Soothing Foot Soak Bags. A century-old heritage shop preserving traditional Chinese herbal beauty secrets. Its Gromwell Root Ointment, infused with wild camellia oil and gromwell root, works wonders to calm insect bites and sensitive skin. The traditional pearl powder brightens skin when used as a mask\u2014a unique pharmacy steeped in cultural heritage.", "name": "Huichuntang Traditional Cosmeceutical Shop (\u56de\u6625\u5802\u50b3\u7d71\u85e5\u599d\u8001\u5e97 \u6b66\u5937\u5c71\u5e97)", "transport": "Take Wuyishan Bus Line K1 to Wuyi Avenue Station (\u6b66\u5937\u5927\u9053\u7ad9), then walk for about 2 minutes."}], "name": "Local Iconic Beauty \u0026 Pharmacy Stores"}, "cat_2": {"items": [{"address": "No. 168 Dawangfeng Road, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Zen handmade cotton-linen tea attire, indigo-dyed Hakka-style handbags, handmade straw woven sandals. Located in the heart of Wuyi Mountain Resort, this independent boutique focuses on natural, rustic cotton and linen fabrics paired with traditional hand-dyeing techniques. The apparel designs blend Northern Fujian tea culture with Eastern Zen aesthetics\u2014exceptionally comfortable, breathable, and perfect for strolling through forest trails. Local tea masters and hipster travelers highly recommend its original tea clothing and uniquely styled handmade accessories.", "name": "Impression Wuyi Cotton Linen Boutique", "transport": "Take Wuyishan Bus Route 6 or 9 to \u0027Sangu Jiekou Station\u0027, then walk about 3 minutes."}, {"address": "No. 58 Sangu Old Street, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Bamboo-woven genuine leather tote bags, vintage soft leather tea master shoes, bamboo-joint styled handmade leather wallets. Combining premium local moso bamboo weaving crafts with high-quality leather, this shop creates fine shoes and bags that blend modern fashion with classical charm. Handcrafted by experienced local artisans, each piece features a unique bamboo pattern that is durable and exudes Eastern aesthetics, making it a top choice for quality souvenirs and elegant fashion accessories.", "name": "Wuyi Bamboo \u0026 Leather Craft Shop", "transport": "Take Bus K1 or Route 6 to \u0027Sangu Old Street Station\u0027, then walk about 2 minutes."}, {"address": "No. 212 Wuyi Avenue, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Lightweight windproof/waterproof jackets, professional trail hiking shoes, water-repellent outdoor backpacks. Catering to visitors hiking Wuyishan National Park or climbing Tianyou Peak, this professional outdoor outfitters provides comprehensive gear support. The store features apparel and footwear tailored for Danxia landforms and unpredictable mountain weather. Local guides and outdoor enthusiasts frequently gear up here, benefiting from friendly service and frequent discounts.", "name": "Toread Outdoor Wuyi Resort Store", "transport": "Take Bus Route 7 or 9 to \u0027Taiyangcheng Station\u0027, then walk about 4 minutes."}, {"address": "No. 12 Song Street, Wuyi Palace, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Song Dynasty embroidered Beizi (outerwear), traditional Chinese style gold-thread shawls, vintage embroidered handbags for Hanfu. Combining Hanfu rental experiences with original Chinese-style fashion sales, the owner curates Song and Ming Dynasty styled Hanfu that mirror the scenic beauty of Wuyishan. Many tourists visiting Wuyi Palace and Nine-Bend Stream purchase exquisite handmade vintage accessories and original modified Hanfu here, featuring refined quality and intricate embroidery perfect as memorable keepsakes.", "name": "Nishang Wuyi Hanfu Studio \u0026 Boutique", "transport": "Take Wuyishan Bus Route 1 or 6 to \u0027Wuyi Palace Station\u0027, enter Song Street and walk about 150 meters."}, {"address": "No. 20 Jiaoting Village Intersection, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Tea-extract plant-dyed multi-layer cloth shoes, handmade embroidered cloth slippers, Dahongpao tea-dyed tote bags. This workshop insists on traditional plant dyeing and 100% handmade shoemaking, extracting dyes from local Wuyi tea leaves and plants to color fabrics with simple, elegant natural shades. Their traditional cloth shoes are lightweight, breathable, sweat-absorbent, and comfortable\u2014a favorite among locals and vintage lovers. Every pair exudes a subtle, natural aroma of tea and botanicals.", "name": "Minbei Natural Dye \u0026 Fabric Shoes Workshop", "transport": "Take Bus Route 6 to \u0027Jiaoting Station\u0027, then walk about 5 minutes."}, {"address": "Bldg B-105, Shuixiu Square Commercial Street, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Nine-Bend Stream bamboo raft canvas tote bags, Wuyi camellia embroidered baseball caps, original printed pure cotton T-shirts. A vibrant local creative shop that integrates iconic Wuyishan elements like Yunv Peak, Dawang Peak, and tea culture into fashion, shoes, and bag designs. Their canvas totes are spacious and durable, while their baseball caps offer sun protection and stylish face-framing cuts, highly favored by young travelers and independent backpackers.", "name": "Manbu Wuyi Cultural Apparel \u0026 Bags", "transport": "Take the light rail or bus to \u0027Shuixiu Square Station\u0027, then walk about 3 minutes."}, {"address": "No. 18 Impression Dahongpao Theater Commercial District, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Reversible silk cross-collar tea robes, handmade frog-button Chinese jackets, slub linen crossbody bags. Focusing on elegant Oriental tea master apparel and personal accessories, this boutique exudes sophisticated ethereal style. Crafted from premium Gambiered Guangdong Silk and high-mountain ramie fabric, the cuts are fluid and grand. The shoe and bag selections feature natural materials, favored and collected by high-end guests visiting Wuyishan for tea tasting, mindfulness retreats, and cultural experiences.", "name": "Shanshui Chanxin Tea Wear Boutique", "transport": "Take Bus Route 9 or K1 to \u0027Impression Dahongpao Station\u0027, then walk about 3 minutes."}, {"address": "1F, Taiyangcheng Shopping Mall, No. 1 Golf Road, Resort Zone, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Nitrogen technology ultra-light running shoes, high-capacity outdoor travel backpacks, cooling UV-protection casual jackets. As a well-known local Fujian sportswear brand, this flagship store offers a rich selection of outdoor sports shoes and casual bags designed for mountain terrain and outdoor activities. With a comprehensive selection, affordable prices, and frequent local promotions, it is a popular spot for tourists looking to upgrade their footwear and sportswear.", "name": "ANTA Outdoor \u0026 Casual Shoes Wuyi Flagship", "transport": "Take Bus Route 7, 8, or 9 directly to \u0027Taiyangcheng Shopping Mall Station\u0027."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 1 Dahongpao Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-buy list: Jiulongke Dahongpao Gift Box, Zhengshan Xiaozhong (Lapsang Souchong) Wild Tea, Wuyi Rock Tea Cake. As a well-known Fujian tea enterprise, Wuyistar\u0027s flagship store in the resort area offers extremely professional tea tasting and souvenir packaging services. The store features an antique ambience with elegant packaging, making it perfect for purchasing high-quality tea and exquisite tea snacks as gifts for friends and relatives.", "name": "Wuyistar Tea Resort Flagship Store", "transport": "Take Wuyishan Bus K1 or Route 9 to \u0027Sangu Huandao Station\u0027, then walk for about 3 minutes."}, {"address": "No. 58 Dujia Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-buy list: Xigua Haidou Rougui, Laocong Shuixian (Old Bush Shuixian), Handmade Tea-flavored Peanut Crisp. Renowned for its \u0027Xigua\u0027 brand, the Xiangjiang Tea Experience Store is a must-visit for rock tea enthusiasts. Here, you can buy authentic Zhengyan tea from core production areas, as well as exquisite travel-sized individual packs and tea-infused snacks\u2014making it an ideal choice for portable, premium tea gifts.", "name": "Xigua Tea City Experience Store", "transport": "Take Wuyishan Bus Route 9 or Route 6 to \u0027Dujiaqu Rukou Station\u0027 (Resort Entrance), then walk for about 5 minutes."}, {"address": "No. 23 Jiujie (Old Street), Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Vacuum-packed Langu Spicy Smoked Goose, Smoked Goose Wings, Smoked Goose Feet. Langu smoked goose is one of the most iconic traditional delicacies in Wuyishan. Made from local high-mountain grass-fed geese steamed and smoked over glutinous rice, it exhibits a golden color with a rich, savory, and spicy flavor. Professional vacuum packaging is available to preserve its smoky aroma, making it a must-buy edible souvenir for travelers.", "name": "Langu Authentic Smoked Goose Sangu Flagship Store", "transport": "Take Wuyishan Bus Route 9 to \u0027Jiujie Station\u0027, then walk for about 2 minutes."}, {"address": "No. 168 Wuyi Avenue, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Classic Osmanthus Filial Piety Cake, Red Bean Tea Cake, Taro Paste Mochi Pastry. Filial Piety Cake originates from the historical tale of Zhu Xi honoring his mother, serving as a traditional pastry rich in local cultural heritage. Baked according to ancient recipes, it features thin crusts with delicious fillings that are sweet without being greasy, carrying a subtle tea aroma. Beautiful gift boxes make them ideal presents for elders.", "name": "Zhuzi Xiaomu Cake Original Shop", "transport": "Take Wuyishan Bus K1 or Route 9 to \u0027Sangujie Station\u0027, then walk directly."}, {"address": "No. 1 Nanyuanling Village Entrance, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.9 stars | Must-buy list: Zhen Shan Tang Jin Jun Mei, Feizixiao Black Tea, Tea Gummies. Zhen Shan Tang is the pioneer of Jin Jun Mei black tea. This flagship experience center integrates tea art demonstrations with souvenir shopping. Using high-quality fresh tea leaves from Tongmuguan, the tea boasts a high, sharp aroma and sweet taste. Elegant tin cans and gift boxes make it the ultimate choice for top-tier black tea connoisseurs.", "name": "Zhen Shan Tang Black Tea Experience Hall", "transport": "Take Wuyishan Bus Route 9 to \u0027Nanyuanling Station\u0027, then walk for about 1 minute."}, {"address": "No. 12 Gaosuban Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-buy list: Wuyishan Wild Red Mushrooms, Dried Chinquapin Nuts, High-Mountain Dried Bamboo Shoots. A time-honored specialty store operating for decades, trusted by locals and tourists alike. The shop gathers treasures from deep inside the Wuyi Mountains, especially the wild red mushrooms known as \u0027Southern Red Ginseng\u0027 and crispy, sweet dried chinquapin nuts. Unpretentious packaging, fair prices, healthy and additive-free.", "name": "Wuyishan Shanli Renjia Native Specialty Store", "transport": "Take Wuyishan Bus Route 6 to \u0027Gaosuban Station\u0027, then walk for about 4 minutes."}, {"address": "1st Floor, Shuixiu Square, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-buy list: Wuyi Puffed Rice Cake (Dongmigao), Zixi Rice Noodle Instant Packs, Snake Bone Papaya Wine. A comprehensive large supermarket for one-stop shopping for Wuyi specialties, featuring an extremely wide variety of goods. Highly recommended are the traditional handmade puffed rice cakes and portable local Zixi rice noodle packs. Budget-friendly with diverse choices, perfect for stocking up on all authentic local snacks at once.", "name": "Wuyihong Specialty Supermarket", "transport": "Take Wuyishan Bus K1 to \u0027Shuixiu Theater Station\u0027, then walk directly."}, {"address": "No. 8 Jinmen Street, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade Dahongpao Tea Candy, Handmade Tea-infused Mung Bean Cake, Master-crafted Jianzhan Teacups. A cultural and creative souvenir shop combining Wuyishan tea culture with intangible cultural heritage Jianzhan (Jian ware) craftsmanship. The store\u0027s handmade Dahongpao tea candies and mung bean cakes retain a rich tea aroma, paired with unique mini Jianzhan cup gift sets that offer both culinary and collectible value, highly popular among young travelers.", "name": "Yanyun Tea Cake \u0026 Jianzhan Souvenir Store", "transport": "Take Wuyishan Bus Route 9 to \u0027Jinmen Jiekou Station\u0027, then walk for about 3 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Baihua Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Toread outdoor jackets, Anta discounted sneakers, JOEONE men\u0027s casual trousers. As the most famous outdoor and brand outlet shopping center in the Wuyishan region, it blends Northern Fujian architectural style with the international outlet concept. Bringing together numerous well-known sports and outdoor brands, it offers year-round discounts of 50% to 70% off, making it ideal for visitors looking to restock hiking gear after exploring Mount Wuyi.", "name": "Wuyishan Capital Outlets", "transport": "Take Wuyishan Bus No. 6 or K1 and get off at Outlets Station."}, {"address": "Dahongpao Road, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Authentic Dahongpao tea, handcrafted Wuyi bamboo tea sets, traditional Jian Zhan Tenmoku tea bowls. This is the largest tea-culture-themed shopping mall in Northern Fujian, featuring over a hundred time-honored local tea shops and craft stores. It is the top choice for locals and tourists to buy premium Rock Tea and exquisite tea accessories. The mall also features professional tea-tasting areas where you can experience freshly brewed tea before purchasing.", "name": "Wuyi Tea Expo City Commercial Mall", "transport": "Take Wuyishan Bus No. 9 and get off at Tea Expo City Station."}, {"address": "No. 188 Wujiu Road, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Vacuum-packed Langu smoked goose, wild Wuyishan red mushrooms, Northern Fujian dried bamboo shoot gift boxes. A long-established local chain department store in Fujian located in Wuyishan\u0027s central commercial district. The basement supermarket and upper department store floors offer authentic local specialties with reliable quality and transparent pricing, making it the best spot for buying regional food products and daily goods.", "name": "Wuyishan Xinhuadu Shopping Plaza", "transport": "Take Wuyishan Bus No. 2 or 8 and get off at Xinhuadu Plaza Station."}, {"address": "Huandao South Road, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Tea-flavored crispy peanuts, handmade Wuyi Rock Tea cookies, Rougui tea-scented hand cream. Located in the heart of Sangu Resort, this is one of the largest comprehensive commercial centers in the area. It brings together local independent designer shops and unique cosmetics boutiques. Brightly lit at night, it is a great place for visitors to find original handmade crafts and tea-infused derivative products unique to Wuyishan.", "name": "Sangu Resort Commercial Plaza", "transport": "Take Wuyishan Bus No. 9 or K1 to Sangu Huandao Station and walk for about 2 minutes."}, {"address": "Sangu Street, Sangu Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Limited-edition Impression Dahongpao tea sets, tea essential oil gift boxes, Rock Tea-flavored pastries. Located right next to the famous Impression Dahongpao outdoor live theater, this specialty street mall combines cultural experiences with high-end shopping. Featuring exclusive creative gift shops and flagship stores for premium tea brands in an elegant, rustic setting, it sells exquisite Wuyi tea merchandise and artistic souvenirs.", "name": "Impression Dahongpao Commercial Street Mall", "transport": "Take Wuyishan Bus No. 9 and get off at Impression Dahongpao Theater Station."}, {"address": "No. 999 Jianping Avenue, Jianyang District, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Local Northern Fujian handmade cosmetics, specialty bamboo-woven lifestyle products, Li-Ning discounted apparel. The newest large-scale modern shopping complex in the Nanping region, housing a rich variety of domestic and international brand stores alongside outlet discount sections. Equipped with a large fashion department store, trendy local clothing chains, and specialty dining options, it fulfills all your shopping, entertainment, and dining needs under one roof.", "name": "Nanping Jianyang Wanda Plaza", "transport": "Take Bus K1 or the High-Speed Rail Express Line from Wuyishan Resort Area to Jianyang Wanda Plaza Station."}, {"address": "Exhibition Area near Tongmu Village, Xingcun Town, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Lapsang Souchong black tea, black tea extract handmade soap, tea-scented room diffusers. A specialty shopping center dedicated to black tea culture, showcasing and selling authentic black tea directly from Tongmu Pass, the birthplace of Lapsang Souchong. The center features a dedicated creative zone offering beauty care items, handmade soaps, and luxury tea gifts formulated with black tea extracts, highly popular among women and young travelers.", "name": "Lapsang Souchong Cultural Shopping Center", "transport": "Driving or taking the Xingcun Town special bus route to Xingcun Town and transferring to a local shuttle is recommended."}, {"address": "Wuyi Avenue, Resort Area, Wuyishan City, Nanping City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Wuyi bamboo-carved tea trays, premium Jianyang Jian Zhan ceramics, snake venom essence skincare products. Featuring traditional Northern Fujian architectural style, this mall specializes in local handicrafts and regional skincare products. Wuyishan is rich in snake resources, making local snake venom skincare items a very unique native specialty. Master artisans also demonstrate bamboo carving and ceramic crafting live on-site, offering items with great collectible value.", "name": "Wuyishan Folk Customs Street Craft Mall", "transport": "Take Wuyishan Bus No. 6 and get off at Folk Customs Street Station."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Nanping - Wuyishan National Park and Resort Area"}, "xiamen_huandao": {"categories": {"cat_1": {"items": [{"address": "Entrance of Zengcuo\u0027an Cultural and Creative Village, Huandao South Road, Siming District, Xiamen City", "feature": "\u2b50 4.8 stars | Must-buy list: Queen Pianzihuang Pearl Cream, Pianzihuang Toothpaste, Reishi Pearl Radiance Essence. Pianzihuang is Fujian\u0027s legendary national treasure brand, renowned for skincare infused with traditional Chinese medicine. The experience store in Zengcuo\u0027an offers a complete line of domestic skincare products. Its famous Pearl Cream effectively combats acne, nourishes skin, and brightens complexion\u2014a must-buy beauty product when visiting Fujian.", "name": "Pianzihuang Cosmetics Experience Store (Zengcuo\u0027an Branch)", "transport": "Take Bus 29 or 18 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 2 minutes."}, {"address": "No. 1 Jiaotang Street, Zengcuo\u0027an, Siming District, Xiamen City", "feature": "\u2b50 4.6 stars | Must-buy list: Duck Egg Pressed Powder, Classic Solid Perfume Balm, Sweet Osmanthus Hair Oil. A time-honored Chinese beauty brand with nearly 200 years of history. Preserving ancient imperial cosmetics techniques, its products are natural and gentle. The signature Duck Egg Powder features an elegant floral fragrance and excellent oil control, while the retro blue-and-white porcelain and bamboo-woven packaging make it highly collectible and perfect for gifts.", "name": "Xiefuchun Traditional Cosmetics (Zengcuo\u0027an Branch)", "transport": "Take a bus to \u0027Zengcuo\u0027an Station\u0027, enter the Cultural and Creative Village, and walk along the main street for about 4 minutes."}, {"address": "No. 25 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City", "feature": "\u2b50 4.5 stars | Must-buy list: Fo-Ti Hair Conditioner, Pearl Facial Cream, Loofah Water Toner. A traditional Chinese skincare brand originating from the Ming Dynasty, specializing in herbal skincare based on Traditional Chinese Medicine (TCM). The Zengcuo\u0027an store exudes classic charm, where staff provide skin type analysis and recommend tailored herbal skincare products that are gentle, natural, and highly effective.", "name": "Dai Chun Lin Heritage Cosmetics (Zengcuo\u0027an Branch)", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter through the village archway, and walk for about 5 minutes."}, {"address": "No. 18 Qigannei Street, Zengcuo\u0027an, Siming District, Xiamen City", "feature": "\u2b50 4.7 stars | Must-buy list: Ocean Breeze Essential Oil Handmade Soap, Jasmine Hydrosol, Xiamen Sunshine Cold-Process Soap. A charming original independent beauty studio local to Zengcuo\u0027an, featuring natural skincare products infused with ocean vibes and botanical extracts. The handmade soaps release soothing scents of fresh sea salt and fir, containing no artificial chemical additives\u2014hugely popular among hipster travelers and natural skincare lovers.", "name": "Shopkeeper Zhu Handcrafted Beauty Studio", "transport": "Take a bus to \u0027Zengcuo\u0027an Station\u0027, and walk through the village alleyway for about 3 minutes."}, {"address": "No. 12 Zhongshan Street, Zengcuo\u0027an, Siming District, Xiamen City", "feature": "\u2b50 4.4 stars | Must-buy list: \u0027Boiled Water\u0027 Eau de Toilette, \u0027Boiled Water\u0027 Body Lotion, Xiamen Sea Breeze Memory Limited Edition Solid Perfume. A well-known Chinese original fragrance brand, designed with island creative village aesthetics at its Zengcuo\u0027an store. The wildly popular \u0027Boiled Water\u0027 (Liangbai Kai) series nostalgically captures refreshing aquatic notes from Eastern memory, making it an iconic fragrance purchase for young visitors.", "name": "Scent Library (Zengcuo\u0027an Branch)", "transport": "Take a bus to \u0027Zengcuo\u0027an Station\u0027, and walk into Zhongshan Street for about 4 minutes."}, {"address": "No. 8 Guoguang Road, Zengcuo\u0027an, Siming District, Xiamen City", "feature": "\u2b50 4.7 stars | Must-buy list: Concentric Lock Engraved Lipstick, Jade Breathable Setting Powder, Floral Cleansing Balm. A leading Chinese trend (\u0027Guochao\u0027) makeup brand immensely popular worldwide, operating under the philosophy \u0027Oriental Makeup, Nourished by Flowers.\u0027 The Zengcuo\u0027an experience store displays exquisitely sculpted cosmetics; the micro-carvings on lipsticks are stunning works of art, while powders are finely milled and oil-controlling, offering top-tier aesthetics and functionality.", "name": "Florasis Experience Store (Guochao Cosmetics)", "transport": "Take a bus to \u0027Zengcuo\u0027an Station\u0027, and walk for about 3 minutes to reach the center of the village."}, {"address": "No. 23 Wenqing Street, Zengcuo\u0027an, Siming District, Xiamen City", "feature": "\u2b50 4.3 stars | Must-buy list: Eight-Treasure Herbal Mask Powder, Kinmen Moghania Soothing Balm, Pianzihuang Cleansing Foam. Filled with nostalgic Old Xiamen atmosphere, this traditional Chinese medicine beauty shop combines Southern Fujian herbal ingredients with modern skincare technology. The herbal mask powders are exceptionally effective for post-sun repair, welcoming visitors with a soothing, rich herbal aroma upon entering.", "name": "Old Xiamen Herbal Skincare \u0026 Pharmacy", "transport": "Take a bus to \u0027Zengcuo\u0027an Station\u0027, and walk along Wenqing Street for about 5 minutes."}, {"address": "No. 101, Zengcuo\u0027an Village Entrance, Huandao South Road, Siming District, Xiamen City", "feature": "\u2b50 4.2 stars | Must-buy list: Watsons Bird\u0027s Nest Deep Nourishing Facial Mask, Collagen Moisturizing Hand Cream, After-Sun Soothing Aloe Vera Gel. Located at the junction of Huandao Road and Zengcuo\u0027an Cultural and Creative Village, this famous cosmetics \u0026 pharmacy chain provides great convenience for beachgoers. Stocked with a wide variety of sun care products and top-selling face masks, it\u0027s the ideal spot to restock skincare and sun defense essentials during a seaside vacation.", "name": "Watsons (Zengcuo\u0027an Huandao Road Branch)", "transport": "Take Bus 29 or 857 to \u0027Zengcuo\u0027an Station\u0027, then walk for 1 minute."}], "name": "Local Iconic Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 258 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Vintage printed cotton-linen dresses, handmade woven straw bags, hipster solid-color wide-leg pants. Tucked away in the alleys of Zengcuo\u0027an, this charming boutique specializes in breathable cotton and linen apparel infused with island leisure and Southern Fujian charm. The lightweight fabrics are perfect for Xiamen\u0027s mild climate. Curated personally by the owner, the collections blend classic Oriental aesthetics with modern minimalism, making it a favorite for lovers of hipster chic and beach vacation styles.", "name": "A-Dai Cotton \u0026 Linen Wardrobe (Zengcuo\u0027an)", "transport": "Take Bus 29, 47, or 751 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 180 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Hand-drawn Xiamen Huandao Road map canvas bags, vintage canvas tote bags, embroidered eco-friendly drink carriers. Sunny Day is one of Xiamen\u0027s iconic creative fabric brands, renowned for high-quality canvas and unique original illustrations. Many tourists come specifically to purchase canvas bags printed with Xiamen landmarks and island quotes. Durable and spacious, these bags are both practical and memorable souvenirs, making this local gem a must-visit in Zengcuo\u0027an.", "name": "Sunny Day Canvas Bag Store", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the main street of the Cultural and Creative Village, and walk for about 5 minutes."}, {"address": "No. 321 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-buy list: Hand-stitched vegetable-tanned leather long wallets, vintage genuine leather crossbody bags, custom-engraved leather keychains. This independent leather studio radiates handmade warmth. \u0027Cuobian\u0027 means \u0027neighbor\u0027 in Minnan dialect, evoking a warm local feel. All items are hand-cut and stitched by master craftsmen and emerging designers using premium vegetable-tanned leather, which develops a unique patina and texture over time.", "name": "Cuobian Time Handmade Leather Goods", "transport": "Take Bus B2 or 47 to \u0027Zengcuo\u0027an Station\u0027 and walk along Wenqing Street for about 4 minutes."}, {"address": "No. 77 Zengcuo\u0027an Coastal Section, Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-buy list: Bohemian resort-style printed maxi dresses, wide-brim sun straw hats, beach sun-protection kimonos. Located near Huandao Road, this coastal boutique caters to travelers strolling along Xiamen\u0027s beaches. Offering a colorful variety of resort wear and beach accessories at affordable prices with frequently updated styles, it\u0027s a top choice for travelers looking to grab stunning outfits for photo ops.", "name": "Seaside Style Resort Wear", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Bathing Beach Station\u0027, then walk along the Huandao South Road seaside walkway for about 2 minutes."}, {"address": "No. 108 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-buy list: Traditional hand-embroidered shoes, vintage soft-soled leather flats, handmade hemp rope woven sandals. Dedicated to blending traditional shoemaking craft with modern comfort, this workshop features women\u0027s embroidered shoes incorporating Southern Fujian paper-cutting art and floral motifs. With fine stitching and cushioned soft soles, they are beautiful and ideal for long strolls along Huandao Road and through Zengcuo\u0027an.", "name": "Slow Life Handmade Shoes", "transport": "Take Bus 751 or 857 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 432 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-buy list: Modernized Minnan-print Cheongsams (Qipao), classical Hanfu hair accessories, frog-button handmade retro handbags. A flagship for Xiamen\u0027s \u0027Guochao\u0027 (China-chic) fashion, this boutique seamlessly blends traditional Qipao with Southern Fujian red-brick motifs and wave patterns. Featuring sleek, fashionable cuts along with delicate matching accessories, it is hugely popular among visitors interested in new Chinese aesthetics and photography styling.", "name": "Minnan Style Chinese Chic Apparel (Hanfu \u0026 Modern Cheongsam)", "transport": "Take Bus 29 or B2 to \u0027Zengcuo\u0027an Station\u0027, then walk into the Guochao Street district of the village for about 6 minutes."}, {"address": "No. 156 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-buy list: Original ocean-print short-sleeve T-shirts, custom spliced casual jackets, hipster American cargo pants. Founded by young local Xiamen designers, this independent shop blends relaxed island vibes with street fashion trends. Featuring high-grammage, breathable fabrics and limited production runs\u2014ensuring unique finds\u2014it is a must-visit spot for fashion enthusiasts seeking personal style and authentic local original designs.", "name": "Blue Wave Independent Designer Boutique", "transport": "Take Bus 47 or 751 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 4 minutes."}, {"address": "No. 89 Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-buy list: Botanical indigo-dyed tote bags, ocean-themed handmade natural shell bracelets, ethnic-patterned fabric handbags. Tucked into a quiet lane in Zengcuo\u0027an, this artisanal fabric store specializes in plant-based indigo dyeing and handmade fabric bags. Using carefully selected natural textiles combined with coastal elements, the owner creates charming, delicate accessories and bags. Each piece carries unique artisanal touches, perfect for meaningful souvenirs.", "name": "Island Wind Handmade Fabric Bags \u0026 Accessories", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, then walk into the Arts District of the village for about 5 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 190, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Sunlight Rock Pastry, Coconut Tart, Water Chestnut Crisps. Ah Ji Zai is a centuries-old bakery brand with deep historical roots in Xiamen. The Zengcuo\u0027an branch continues the traditional baking craft; the crust is flaky and richly aromatic, while the filling is smooth and not overly sweet. Tourists love buying them as iconic traditional Xiamen souvenirs. The fresh-out-of-the-oven coconut tarts are especially fragrant and beloved by locals and visitors alike.", "name": "Ah Ji Zai", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 3 minutes."}, {"address": "No. 126 Guoguang Li, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Nougat, Flower \u0026 Fruit Tea Gift Boxes, Snowflake Crisps. The store features a romantic, cozy, and trendy French aesthetic, making it a highly popular boutique dessert and gift shop in Zengcuo\u0027an. The shop highlights healthy low-sugar handmade nougat with a chewy texture that doesn\u0027t stick to your teeth, loaded with rich, crunchy nuts. The delightfully fresh packaging design makes it a top choice for artistic snack gifts for best friends and family.", "name": "Su Xiao Tang", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the main street of the Cultural and Creative Village, and walk for about 4 minutes."}, {"address": "No. 110 Zhongshan Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Pineapple Cakes, Classic Southern Fujian Pastries, Tiramisu Black Tea. A famous specialty shop brimming with retro nostalgia, its decor feels like a seamless blend of old Shanghai and Southern Fujian charm. The handmade pineapple cakes offer a perfectly balanced sweet and sour flavor with a buttery crust. Packaged in elegant retro tin boxes, they are not only delicious but also highly collectible.", "name": "Miss Zhao\u0027s Shop", "transport": "Take Bus 29 or 751 to \u0027Zengcuo\u0027an Station\u0027, enter Zhongshan Street in the village, and walk for about 2 minutes."}, {"address": "No. 112, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Original Pork Jerky, Crispy Pork Paper, Spicy Pork Floss. Huang Sheng Ji is a legendary, well-known brand for meat products in Xiamen, and its Zengcuo\u0027an branch offers generous free samples. The jerky is tender and juicy, while the paper-thin crispy pork is aromatic and flavorful\u2014an addictive classic Southern Fujian casual snack.", "name": "Huang Sheng Ji Meat Floss", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter the core snack street area, and walk for about 3 minutes."}, {"address": "No. 180, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Signature European Milk Tea Gift Box, Handmade Cat Cookies, Souvenir Mugs. A famous creative gift shop themed around its cat mascot, featuring a lively and charming storefront in Zengcuo\u0027an. Besides enjoying freshly made milk tea on-site, visitors eagerly purchase its instant milk tea gift boxes and adorable cat-shaped handmade cookies as trendy creative snack gifts.", "name": "Zhang San Feng Milk Tea", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, walk into the pedestrian street of the village for about 5 minutes."}, {"address": "No. 33 Qigan Nei Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Anxi Tieguanyin Mini Tin Cans, Wuyi Da Hong Pao Gift Set, Aged Tea Cakes. Sea Dike Tea is a long-standing state-owned tea brand in Fujian, guaranteed for its high quality and reasonable prices. It offers a variety of famous Southern Fujian teas ranging from strong-aroma to fresh-fragrance styles. The classic compact red tin cans are nostalgic and authentic, making them an excellent tea gift for elders and tea lovers.", "name": "Sea Dike Tea (Zengcuo\u0027an Store)", "transport": "Take Bus 29 or B2 to \u0027Zengcuo\u0027an Station\u0027, then walk for about 4 minutes."}, {"address": "No. 75 Jiaotang Street, Zengcuo\u0027an Cultural and Creative Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Silky Peanut Gongtang (Tribute Candy), Black Sesame Gongtang, Sea Salt Peanut Crisps. Gongtang (peanut tribute candy) is the most iconic traditional peanut sweet in Southern Fujian. This shop often demonstrates the traditional live hand-pounding process. The resulting candy is rich, flaky, melt-in-your-mouth, and non-sticky, bursting with authentic nostalgic flavor\u2014a must-buy traditional snack in Zengcuo\u0027an.", "name": "Minnan Handmade Gongtang Specialty Workshop", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027, enter Jiaotang Street inside the village, and walk for about 3 minutes."}, {"address": "No. 202 Zengcuo\u0027an Coastal Section, Huandao South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Shredded Grilled Squid Strips, Roasted Fish Fillets, First-Harvest Laver \u0026 Scallop Gift Box. As a coastal city, Xiamen offers a rich variety of dried seafood products that make unmissable souvenirs. Located near Huandao Road Beach, this shop carefully selects local fresh seafood for processing. The hand-shredded squid strips are savory and chewy, while the seaweed and dried scallops serve as wonderful seafood options for home cooking or gifting.", "name": "Huandao Road Seafood \u0026 Dry Goods Specialties", "transport": "Take Bus 29 or 857 to \u0027Zengcuo\u0027an Bathing Beach Station\u0027, then walk for about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 2488 Huandao East Road, Huli District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Extra-discounted Nike sneakers, COACH designer leather bags, ADIDAS brand jackets. As Xiamen\u0027s largest and most famous outlet shopping center, it houses hundreds of well-known international and domestic top-tier brands. Offering year-round incredible discounts ranging from 70% to 90% off, it is immensely popular among locals and tourists alike. Designed in a European town style, the shopping center is spacious and comfortable, allowing visitors to enjoy ocean views while shopping\u2014making it the ultimate shopping destination for coastal trips.", "name": "Sassur Outlet Xiamen", "transport": "Take Metro Line 2 to Wetland Park Station, then transfer to a bus or taxi for about 5 minutes."}, {"address": "No. 1697 Huandao East Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: International skincare \u0026 cosmetics, designer clothing, premium dried seafood gift boxes. Located along the golden coastline of Huandao East Road, this is a signature mid-to-high-end oceanfront shopping mall in the area. The interior is bright and luxurious, featuring numerous international fashion brands, exquisite dining, and a cinema. Visitors can indulge in retail therapy while admiring panoramic ocean views through floor-to-ceiling windows, experiencing Xiamen\u0027s elegant modern lifestyle.", "name": "Xiamen Junshang Shopping Center", "transport": "Take Bus 18 or 403 to \u0027Guanyinshan Business District Station\u0027 and walk for about 3 minutes."}, {"address": "No. 180 Yanwu West Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Exclusive Xiamen Twin Towers cultural/creative souvenirs, trendy graphic tees, specialty blended fruit \u0026 flower tea bags. Located at the base of Xiamen\u0027s landmark Twin Towers near the start of Huandao Road, this large-scale mall combines trendy shopping, entertainment, and ocean-view dining. It features fast fashion and streetwear brands, as well as the ticket entrance for the \u0027Above Xiamen\u0027 Observation Deck. After shopping, you can stroll directly along the Huandao Road coastline, making it an iconic shopping destination.", "name": "Xiamen Shimao EMall", "transport": "Take Bus 86 or 71 to \u0027Xiamen University Hospital Station\u0027 or \u0027Yanwu West Road Station\u0027 and walk for about 5 minutes."}, {"address": "No. 116 Kaiyuan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Handmade pastry gift boxes, Ah Ji Zai traditional flower cakes, retro Xiamen tile cultural souvenirs. This is an iconic independent 5-story retro cultural department store in Xiamen. Reimagined by the classic heritage brand Ah Ji Zai, it blends vintage Xiamen tile patterns, tea aromas, and traditional pastries with modern visual design. Each floor features a unique theme\u2014from traditional pastries and reading nooks to pour-over coffee and antique furniture\u2014making it the ultimate spot to buy high-quality local souvenirs.", "name": "Ji Zhi Department Store", "transport": "Take Metro Line 1 to Zhenhai Road Station and walk for about 10 minutes."}, {"address": "No. 107 Guoguang Road, Zengcuo\u0027an Cultural Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade nougat, rose tea gift boxes, cranberry cookies. As a deeply rooted Xiamen brand for cultural handmade snacks and lifestyle goods, Su Xiao Tang is wildly popular in Zengcuo\u0027an Cultural Village. The shop features a romantic, fresh, and chic aesthetic, specializing in low-sugar healthy handmade nougat and fruit/flower teas. Generous with free samples and beautifully packaged, it captures the artistic, slow-paced seaside charm of Xiamen, making it a must-visit souvenir store.", "name": "Su Xiao Tang Local Lifestyle \u0026 Gift Shop", "transport": "Take Bus 29 or 47 to \u0027Zengcuo\u0027an Station\u0027 and walk into the cultural village for about 3 minutes."}, {"address": "No. 52 Jiaotang Street, Zengcuo\u0027an Cultural Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Sea-breeze themed solid perfume, handmade hipster linen tote bags, local original postcards. Tucked away in the alleys of Zengcuo\u0027an, this independent handmade craft shop was founded by local young designers. Inspired by old Xiamen\u0027s cat culture and island vibe, they craft unique ocean-scented solid perfumes and fragrances. All items are original, limited-edition designs, highly favored by tourists seeking unique styles and artistic crafts.", "name": "Black Cat Handmade Perfume \u0026 Crafts", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027 and walk along Jiaotang Street for about 4 minutes."}, {"address": "No. 144 Zengcuo\u0027an Cultural Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Daily special handmade ice cream, Xiamen island-style stickers, hand-drawn canvas bags. One of the most iconic hipster indie shops in Zengcuo\u0027an, boasting an easygoing artistic atmosphere. Beyond serving delicious daily limited handmade ice creams, the store showcases a vast collection of creative goods and trendy merchandise crafted by local designers, embodying the free-spirited and romantic vibe of Zengcuo\u0027an.", "name": "Sunny Day Goods \u0026 Ice Cream Shop", "transport": "Take Bus 29 or 751 to \u0027Zengcuo\u0027an Station\u0027 and walk into the village alleys for about 5 minutes."}, {"address": "No. 3 Qigannei Street, Zengcuo\u0027an Cultural Village, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Minnan brick carving handmade jewelry, ocean wave shaped handmade earrings, hand-drawn coastal maps. Located on the main street of Zengcuo\u0027an, this independent craft store bridges traditional Minnan culture with modern design. Turning red-brick architectural elements and seashells into chic accessories and lifestyle products, every item is infused with island memories, making it a top choice for meaningful local souvenirs.", "name": "Xiamen Imprint Local Crafts \u0026 Accessories", "transport": "Take Bus 29 to \u0027Zengcuo\u0027an Station\u0027 and walk for about 3 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Xiamen - Huandao Road and Zengcuo\u0027an Cultural and Creative Village"}, "xiamen_zhongshan": {"categories": {"cat_1": {"items": [{"address": "No. 128 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Pian Zih Huang Pearl Cream, Pearl Whitening Face Cream, Pian Zih Huang Toothpaste. As Fujian\u0027s most famous national treasure heritage brand, Pian Zih Huang is world-renowned for its exclusive traditional Chinese medicine ingredients. Located on Zhongshan Road, this experience store not only offers a full range of TCM skincare products, but also provides personalized skin analysis and consultation services. Its classic Pearl Cream deeply moisturizes and soothes the skin, making it the top local beauty souvenir choice for tourists visiting Xiamen.", "name": "Pian Zih Huang Experience Store (Zhongshan Road Branch)", "transport": "Take Metro Line 1 to Zhenhai Road Station (Exit 1), and walk along Zhongshan Road for about 5 minutes."}, {"address": "No. 180 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Duck Egg Face Powder, Vintage Solid Perfume, Sweet Osmanthus Hair Oil. Founded during the Qing Dynasty, this China Time-honored Brand masterfully showcases classical scented powder craftsmanship. The store is filled with a rich, classical Guochao charm. The biggest attraction is the Duck Egg Powder, crafted using natural spices and traditional techniques; its texture is ultra-fine with an elegant, delicate fragrance, highly favored by visitors who love retro cosmetics and Oriental scents.", "name": "Xiehuchun Traditional Cosmetics (Zhongshan Road Flagship Store)", "transport": "Take Metro Line 1 to Zhenhai Road Station, and walk along Zhongshan Road for about 6 minutes."}, {"address": "No. 212 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Fo-Ti Hair Darkening Balm, Lotus Beauty Face Cream, Classic Agarwood Face Powder. A legendary beauty brand with history dating back to the Ming Dynasty, specializing in combining traditional herbal extracts with ancient imperial beauty secrets. The Zhongshan Road store features a quaint, antique d\u00e9cor filled with exquisite porcelain jars and boxed skincare products. Promising natural and lightweight formulas, its moisturizing facial creams offer superb hydration, making this store a culturally rich TCM beauty destination.", "name": "Dai Chun Lin Cosmetics (Zhongshan Road Store)", "transport": "Take Metro Line 1 to Zhenhai Road Station, and walk along Zhongshan Road for about 7 minutes."}, {"address": "No. 88 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Fujian Pian Zih Huang Ointment, Southern Fujian Herbal Medicated Oil, Herbal Moisturizing Sheet Mask. Luyan Pharmacy is Fujian\u0027s leading local pharmacy chain, boasting a long history and deep trust from locals. Beyond traditional pharmaceuticals, it features an extensive selection of Southern Fujian specialty cosmeceuticals and herbal skincare sections, offering authentic Pian Zih Huang medicated beauty lines and locally made skincare products at very reasonable prices.", "name": "Luyan Pharmacy (Zhongshan Road Flagship Store)", "transport": "Take Metro Line 1 to Zhenhai Road Station (Exit 1), and walk along Zhongshan Road for about 3 minutes."}, {"address": "No. 34 Quanzhou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Gulangyu Deep Sea Pearl Cream, Cold-Process Essential Oil Soap, Seaweed Hydrating Essence. Tucked away in a street lined with historic Western-style mansions on Gulangyu, this charming independent beauty shop focuses on local skincare formulated with natural seawater pearl powder from the Fujian coast and plant essential oils. The handmade soaps give off a soft, natural floral and fruity aroma, while the pearl cream is gentle with a noticeable brightening effect\u2014an indispensable local skincare experience when visiting Gulangyu.", "name": "Gulangyu Pearl \u0026 Handmade Soap Workshop", "transport": "After arriving at Gulangyu Piano Pier, walk along Huangyan Road to Quanzhou Road for about 10 minutes."}, {"address": "No. 338 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Herbal Pearl Body Cream, Multi-Herbal Cooling Balm, Agarwood Essential Oil Hand Cream. A well-known high-end traditional Chinese medicine hall and pharmacy in Xiamen, blending traditional Chinese medical principles with modern herbal cosmetic technology. The store features an elegant, rustic d\u00e9cor and a dedicated Southern Fujian herbal cosmetics counter, offering refreshing and soothing skincare tailored for the warm, humid southern climate. With lightweight, non-greasy textures, its products enjoy an outstanding reputation.", "name": "Yanlaifu Chinese Pharmacy (Zhongshan Road Branch)", "transport": "Take Metro Line 1 to Zhongshan Park Station, and walk towards Zhongshan Road for about 8 minutes."}, {"address": "1F, South Zone, China City, No. 189 Siming South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Tai Chi Snow Skin Clay Mask, New Seven-White Brightening Lotion, Youth Preserving Firming Essence. As a leading brand in premium Chinese herbal cosmetics, Herborist seamlessly combines traditional herbal beauty with modern technology. Located in the China City shopping hub, this counter offers a complete skincare line alongside attentive sampling services. Its classic \u0027New Seven-White\u0027 whitening series is immensely popular, making it a must-visit counter for customers seeking natural herbal skincare.", "name": "Herborist (Zhongshan Road China City Store)", "transport": "Take Metro Line 1 to Zhenhai Road Station (Exit 3B), which connects directly to China City Shopping Center."}, {"address": "No. 56 Jukou Street (near Zhongshan Road), Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Southern Fujian Honeysuckle Soothing Spray, Traditional Aloe Vera Repair Gel, Agarwood Whitening Mask. Located just off Zhongshan Road Pedestrian Street, this unique independent cosmetics shop focuses on skincare infused with local Fujian botanical extracts like honeysuckle, aloe vera, and agarwood. The shop offers on-site testing and DIY herbal fragrance workshops, exuding strong local cultural charm. With gentle, natural ingredients, it is a hidden gem for consumers who appreciate high-quality skincare.", "name": "Southern Fujian Herbal Beauty Experience Center", "transport": "Take Metro Line 1 to Zhenhai Road Station, walk along Zhongshan Road, turn onto Jukou Street, and walk for about 5 minutes."}], "name": "Local Signature Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 72 Jukou Street, Zhongshan Road Business District, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Wide-leg cotton \u0026 linen pants, vintage frog-button dresses, handmade fabric tote bags. Tucked away in an alley of the Zhongshan Road Business District, this independent original clothing boutique specializes in pure cotton and linen garments that capture an artistic, refreshing vibe and Xiamen\u0027s slow-living lifestyle. The lightweight, breathable fabrics are perfect for the island climate, making it a favorite among local youth and hipster travelers.", "name": "Adai Cotton \u0026 Linen Studio", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk for about 8 minutes."}, {"address": "No. 18 Fujian Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade vegetable-tanned leather coin purses, vintage genuine leather crossbody bags, custom-engraved leather keychains. Located in the old street district of Gulangyu, this independent leather studio insists on 100% hand-cutting and hand-stitching. Using high-quality vegetable-tanned leather that develops a natural patina and warm texture over time, they also offer free on-site engraving services\u2014making for high-quality, highly memorable souvenirs.", "name": "Gulangyu Leather Craftsman Studio", "transport": "Take the ferry from Xiamen Ferry Terminal to Gulangyu Piano Wharf, then walk for about 10 minutes after disembarking."}, {"address": "No. 116 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Classic reversible jackets, minimalist non-iron business shirts, genuine leather business belt gift sets. Founded in Jinjiang, Fujian, SEPTWOLVES is an iconic domestic menswear brand in China. The spacious flagship store on Zhongshan Road Pedestrian Street showcases the latest season of modern business and casual wear tailored for Asian body proportions, offering solid quality and great value for money.", "name": "SEPTWOLVES Zhongshan Road Flagship Store", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk along Zhongshan Road for about 5 minutes."}, {"address": "No. 188 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Nitro Technology professional running shoes, Guochao (Chinese chic) co-branded hoodies, lightweight outdoor crossbody bags. Originating in Quanzhou, Fujian, ANTA has grown into a globally renowned sportswear giant. This prime flagship store on Zhongshan Road features a sleek modern design and full stock, offering cutting-edge sports tech gear and trendy Guochao collaboration sneakers.", "name": "ANTA Zhongshan Road Flagship Store", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk along Zhongshan Road for about 6 minutes."}, {"address": "No. 35 Zhenbang Road (near Zhongshan Road), Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Plant indigo-dyed handkerchiefs, indigo cotton-linen scarves, traditional cultural \u0026 creative canvas bags. This specialty craft shop inherits Fujian\u0027s local intangible cultural heritage of indigo dyeing. All indigo-dyed apparel and bags in the store are hand-dyed using natural plant dyes, giving every piece a unique pattern that perfectly blends traditional Minnan aesthetics with modern creative design.", "name": "Minnan Indigo Dye Apparel \u0026 Bags", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk for about 6 minutes."}, {"address": "No. 142 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: 160X carbon-plate racing shoes, shock-absorbing casual sneakers, Guochao-style printed short-sleeve T-shirts. Xtep is a flagship sportswear brand originating from Jinjiang, Fujian, widely renowned in the marathon community for its high-tech racing shoes. The Zhongshan Road store offers professional gait analysis services and a full range of stylish running shoes, making it a must-visit spot for runners and athleisure enthusiasts.", "name": "Xtep Zhongshan Road Flagship Store", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk along Zhongshan Road for about 5 minutes."}, {"address": "No. 212 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: High-explosive professional basketball shoes, lightweight retro chunky sneakers, high-capacity athletic backpacks. Another famous sports brand hailing from Jinjiang, Fujian, 361\u00b0 focuses on youthful vitality and practical technology. The bright flagship store on Zhongshan Road boasts an extensive product line, ranging from professional athletic gear to trendy footwear, often dropping limited-edition collaboration series popular among youth.", "name": "361 Degrees Zhongshan Road Flagship Store", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk along Zhongshan Road for about 7 minutes."}, {"address": "No. 86 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Taichi technology cushioning running shoes, pro basketball signature sneakers, moisture-wicking athletic shirts. PEAK is a classic athletic shoes and bag brand from Quanzhou, Fujian, highly acclaimed among sneakerheads for its proprietary \u0027Taichi\u0027 adaptive cushioning technology. The store displays a wide array of ultra-comfortable tech footwear and outdoor bags, making it an excellent choice combining budget-friendly prices with top-tier comfort.", "name": "PEAK Zhongshan Road Store", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, then walk along Zhongshan Road for about 4 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 37 Dayuan Road, Siming District, Xiamen City, Fujian Province (Near Zhongshan Road Commercial Area)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Water Chestnut Shortcake, Mung Bean Pastry, Taro Cake. A Ji Zai is a household-name century-old bakery in Xiamen, with queues of local neighbors and visiting tourists outside its doors every day. Its signature Water Chestnut Shortcake has a crispy, fragrant crust and a soft, non-sticky filling with balanced sweetness. The Mung Bean Pastry features a smooth, delicate texture with a subtle nostalgic aroma. Extremely affordable, it\u0027s the ultimate souvenir representing old Xiamen\u0027s nostalgic flavors.", "name": "A Ji Zai Bakery", "transport": "Take Xiamen Metro Line 1 to Zhenhai Road Station (Exit 1), then walk for about 8 minutes."}, {"address": "No. 290 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Handmade Pineapple Cakes, Gulangyu Vegetarian Pastries, Secret-Recipe Rose Black Tea. A charming specialty souvenir shop steeped in vintage Old Shanghai and Southern Fujian charm, featuring refined decor and an artistic atmosphere. The best-selling handmade pineapple cakes use fresh pineapple filling with a perfectly balanced sweet-and-sour taste and visible real fruit fiber. The Gulangyu vegetarian pastries follow traditional craft methods with flaky, layered crusts. Paired with custom rose black tea, both the elegant packaging and taste offer top-tier quality, making it an ideal gift choice.", "name": "Miss Zhao\u0027s Shop", "transport": "Take Xiamen Metro Line 1 to Zhenhai Road Station, then walk along Zhongshan Road Pedestrian Street for about 5 minutes."}, {"address": "No. 95 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Golden Pork Jerky, Satay Beef Strips, Crispy Pork Floss. Founded in 1842, this century-old shop on Gulangyu is renowned for generous portions and uniquely spiced marinated jerky. The owner is incredibly welcoming, offering large free samples on the spot. The pork jerky is thick, juicy, delightfully chewy, and subtly sweet, while the satay beef strips combine Xiamen\u0027s local satay flavor for a savory, spicy, and appetizing bite. A classic delicacy you can\u0027t miss when visiting Gulangyu.", "name": "Huang Sheng Ji Meat Jerky", "transport": "After disembarking at Gulangyu Sanqiutian Wharf, walk along Longtou Road Commercial Street for about 10 minutes."}, {"address": "No. 266 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.1 Stars | Must-Buy List: Signature European Milk Tea Gift Box, Handmade Nougat, Cat-Themed Creative Mugs. A creative lifestyle shop inspired by Zhang Sanfeng, a famous stray cat on Gulangyu, which sparked the island\u0027s trendy, slow-living artistic movement. The signature European milk tea is infused with nuts and raisins for a unique flavor. The souvenir gift boxes feature charming, playful illustrations, while the handmade nougat is richly milky and non-sticky, making it a huge hit among young people and trendy hipsters.", "name": "Zhang Sanfeng Milk Tea", "transport": "Walk from Gulangyu Piano Wharf or Sanqiutian Wharf to the core area of Longtou Road, about 8\u201310 minutes."}, {"address": "No. 413 Neicuo\u0027ao Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Signature Coconut Tarts, Traditional Mung Bean Cake, Crispy Garlic Sticks. Hidden deep within Gulangyu\u0027s residential area, this low-key, century-old bakery lacks flashy decor but is deeply loved by local Xiamen residents. Its signature Coconut Tart features a golden, buttery crust with a moist, richly fragrant coconut filling that isn\u0027t overly sweet. The mung bean cake melts in your mouth and contains zero artificial preservatives. Freshly baked daily, it delivers authentic old-school Xiamen flavor.", "name": "Jinlan Bakery", "transport": "After disembarking at Gulangyu Neicuo\u0027ao Wharf, walk along Neicuo\u0027ao Road for about 6 minutes."}, {"address": "No. 112 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Handmade Floral Nougat, Assorted Snowflake Crisps, Tipsy Fruit \u0026 Flower Tea Bags. Su Xiao Tang is an iconic dessert gift brand in Xiamen known for its fresh, whimsical style, attracting crowds of visitors with its romantic blue-and-white decor. Their handmade nougat uses premium New Zealand milk powder and rich nuts blended with natural floral aromas, offering complex texture layers. The beautifully chic gift packaging makes it the ultimate choice for female friends and besties.", "name": "Su Xiao Tang", "transport": "Take Metro Line 1 to Zhenhai Road Station, then walk to the central section of Zhongshan Road Pedestrian Street."}, {"address": "No. 108 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Riguangyan Mung Bean Pastry, Sweet Coconut Tarts, Red Bean Paste Pastry. Riguangyan Bakery is one of Xiamen\u0027s premier legacy pastry brands, celebrated for its solid reputation and consistent quality. Its traditional mung bean pastry is made from peeled, finely ground mung beans baked through meticulous steps, resulting in paper-thin flaky skin and a soft, sweet, aromatic bean filling. Encased in classic retro boxes, it is both a fond memory for older Xiamen generations and a must-buy traditional gift for tourists.", "name": "Riguangyan Bakery", "transport": "Walk along Longtou Road from Gulangyu Sanqiutian Wharf for about 8 minutes."}, {"address": "No. 127 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Classic Robust Shuixian Oolong Tea, Premium Rougui Tea, Selected Tieguanyin Gift Box. Sea Dyke is Xiamen\u0027s most trusted local tea brand among older Southern Fujianese generations for decades. Local residents prefer Sea Dyke Oolong Tea for daily Kung Fu tea sessions, featuring a deep bright reddish tea soup and rich roasted aroma characteristic of Southern Fujian tea culture. Offering highly cost-effective classic yellow-can teas and exquisite gift sets, it\u0027s the most authentic gift for experiencing genuine Southern Fujian Kung Fu tea or gifting elders.", "name": "Sea Dyke Tea Store", "transport": "Take Metro Line 1 to Zhenhai Road Station, then walk along Zhongshan Road for about 6 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 5188 Haixiang Avenue, Jimei District, Xiamen City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted Nike sneakers, Coach classic signature handbags, Adidas limited-edition jackets. Located in the suburbs of Xiamen, this large Italian town-style outlet center gathers over 200 renowned international and domestic brands. Offering fantastic year-round discounts from 40% to 90% off, it is the top choice outlet shopping center for both tourists and locals hunting for great deals.", "name": "Sun Park Outlets Xiamen", "transport": "Take Xiamen Metro Line 1 to \u0027Tianshui Road Station\u0027, then transfer to a shuttle bus or taxi for about 10 minutes."}, {"address": "No. 37 Dayuan Road, Siming District, Xiamen City, Fujian Province (Near Zhongshan Road Commercial Area)", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade water chestnut pastries, traditional coconut cakes, retro pattern tile paperweights. A five-story independent local department store on Dayuan Road Old Street, created by the decades-old Xiamen heritage brand \u0027Ah Ji Zai\u0027. The store blends old Xiamen tile architecture aesthetics with traditional pastry culture. Far from a typical chain store, it radiates rich Southern Fujian (Minman) local charm and creative arts vibe.", "name": "Ah Ji Zai \u00b7 Ji Zhi Department Store", "transport": "Take a bus to \u0027Zhenhai Road Station\u0027 or \u0027Kaiyuan Road Intersection Station\u0027, and walk for about 5 minutes."}, {"address": "No. 189 Siming South Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Huang Sheng Ji dried pork jerky, traditional Tieguanyin tea gift sets, limited cosmetics sets. Situated at the entrance of Zhongshan Road Pedestrian Street, this large integrated shopping complex retains a traditional arcade (Qi Lou) architecture exterior while housing trendy fashion brands and flagships for Southern Fujian souvenirs inside. It is an unmissable landmark shopping mall in the Zhongshan Road area.", "name": "CHINACITY Shopping Center (Zhongshan Road)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027 Exit 1, and walk for about 3 minutes."}, {"address": "No. 110 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Egret Island brand traditional dried food gift boxes, handmade bamboo handicrafts, vintage handmade cloth shoes. A veteran state-owned department store in Xiamen that retains a strong sense of local lifestyle and down-to-earth charm. Here, you can find popular local clothing brands favored by residents and traditional Minnan specialties at very competitive prices.", "name": "Xiashang Department Store (Zhongshan Branch)", "transport": "Take a bus to \u0027CHINACITY Station\u0027 or \u0027Lundu Post Office Station\u0027, then walk into Zhongshan Road Pedestrian Street."}, {"address": "No. 76-132 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Local designer women\u0027s clothing, Xiamen seawater pearl necklaces, Minnan Kung Fu tea sets. A classic department store located in the heart of the bustling Zhongshan Road, having grown alongside generations of locals. In addition to international beauty counters, it features many high-quality local designer apparel and jewelry brands from Fujian and Xiamen, highly favored by shoppers with refined taste.", "name": "Printemps Department Store (Zhongshan Road Branch)", "transport": "Take a bus to \u0027Lundu Post Office Station\u0027, and walk for about 4 minutes into Zhongshan Road Pedestrian Street."}, {"address": "No. 143 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Miss Zhao\u0027s handmade pineapple cakes, signature Earl Grey black tea, classic English tea tins. A charming lifestyle gift and bakery shop on Gulangyu Island, boasting a nostalgic and elegant vibe. Their thoughtfully developed handmade souvenirs and stylish cultural gifts are a must-buy favorite for visitors exploring Gulangyu.", "name": "Miss Zhao\u0027s Shop (Gulangyu Flagship Store)", "transport": "Take a ferry from Xiamen International Cruise Center (Xiagu Wharf) to Gulangyu Sanqiutian Wharf, then walk for about 10 minutes after disembarking."}, {"address": "No. 193-215 Zhongshan Road, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.1 stars | Must-Buy List: Minnan high-mountain Oolong tea gift sets, local handmade leather shoes, traditional secret-recipe skincare products. A homegrown fashion department store chain in Xiamen known for its accessible pricing and local fashion flair. Counters offer popular clothing, shoe, and bag brands from the southeastern coastal region, often featuring great local promotional sales.", "name": "Laiya Department Store (Zhongshan Branch)", "transport": "Take Xiamen Metro Line 1 to \u0027Zhenhai Road Station\u0027, walk along Siming South Road and turn onto Zhongshan Road for about 6 minutes."}, {"address": "No. 8 Longtou Road, Gulangyu, Siming District, Xiamen City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Zhang San Feng European-style milk tea tins, mascot cat mugs, handmade nougat. Originating on Gulangyu Island, this independent creative lifestyle brand is hugely popular among tourists for its unique aesthetic and cat theme. The cozy shop is filled with originally designed home goods and exquisite gifts, making it an iconic representative of Xiamen\u0027s creative scene.", "name": "Zhang San Feng Grocery \u0026 Gift Shop (Gulangyu Branch)", "transport": "After disembarking at Gulangyu Piano Wharf or Sanqiutian Wharf, walk along Longtou Road Commercial Street for about 8 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Xiamen - Zhongshan Road Shopping District and Gulangyu"}, "zhangzhou_tulou": {"categories": {"cat_1": {"items": [{"address": "No. 1 Xiuwen West Road, Xiangcheng District, Zhangzhou City, Fujian Province (Inside Zhangzhou Ancient City Scenic Area)", "feature": "\u2b50 4.8 stars | Must-Buy List: Queen Brand Pianzihuang Pearl Cream, Pianzihuang Radiance Whitening Cream, Pianzihuang Toothpaste. As Zhangzhou\u0027s proudest national treasure brand, Pianzihuang fuses centuries-old Traditional Chinese Medicine (TCM) wisdom with modern skincare technology. Located in Zhangzhou Ancient City, this flagship experience store displays the brand\u0027s full range of beauty and cosmeceutical products. The signature \u0027Queen Brand Pearl Cream\u0027 has been a classic bestseller for decades, providing deep nourishment and brightening dull skin\u2014a top-tier souvenir you shouldn\u0027t miss when visiting Zhangzhou.", "name": "Pianzihuang Experience Store (Zhangzhou Ancient City Branch)", "transport": "Take Zhangzhou Bus Route 4 or 11 to \u0027Taiwan Road Intersection\u0027 Station, then walk for about 3 minutes."}, {"address": "No. 18 Main Street, Yunshuiyao Ancient Town Scenic Area, Nanjing County, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Hakka Camellia Facial Oil, Mugwort Botanical Handmade Soap, Anoectochilus Soothing Mist. Tucked inside the Yunshuiyao Ancient Town within Nanjing Tulou, this unique shop combines traditional Hakka herbal wisdom with modern natural skincare concepts. The shop uses pure, naturally grown camellia seeds from the Tulou mountains to extract high-purity skincare oil, excellent for repairing dry skin. All herbal handmade soaps are cold-processed by local Hakka women, giving off a subtle, natural herbal aroma.", "name": "Nanjing Tulou Hakka Herbal Shop (Yunshuiyao Branch)", "transport": "Take the special tourist bus from Zhangzhou Passenger Transport Center to \u0027Yunshuiyao Scenic Area\u0027, then walk along the ancient boardwalk for about 5 minutes."}, {"address": "No. 58 Xiuwen West Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Pianzihuang Youth Restorative Cream, Pianzihuang Herbal Acne Control Gel, Pianzihuang Moisturizing Cream. This is an officially authorized flagship pharmacy for Pianzihuang. In addition to traditional Chinese herbs, it features a dedicated counter for the full line of cosmeceuticals. On-site licensed TCM practitioners offer professional skin consultations and recommend herbal skincare tailored to your constitution. The acne gel and restorative cream are particularly effective for sensitive and acne-prone skin\u2014affordable, high quality, and loved by locals and tourists alike.", "name": "Pianzihuang Traditional Chinese Pharmacy (Xiuwen West Road Branch)", "transport": "Walk to the Xiuwen West Road section of Zhangzhou Ancient City, near Xianggang Road Pedestrian Street."}, {"address": "No. 86 Taiwan Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Wild Camellia Carrier Oil, Agarwood Soothing Essential Oil, Pomelo Flower Hydrating Toner. Set inside a Ming and Qing dynasty heritage building in the ancient city, this shop highlights cosmetics made from local Fujian wild camellia oil and Pinghe pomelo flower extracts. Camellia oil is hailed as the \u0027Oriental Olive Oil\u0027 for its small molecules that absorb effortlessly into the skin, while the pomelo hydration toner delivers a refreshing citrus floral scent. Free samples and custom essential oil blending workshops are available, making it an ideal spot to experience Southern Fujian botanical beauty aesthetics.", "name": "Zhangzhou Ancient City Agarwood \u0026 Camellia Skincare Center", "transport": "Take Bus Route 14 or 29 to \u0027Xinhua West Road\u0027 Station, then walk into Taiwan Road in the Ancient City."}, {"address": "No. 120 Yanan South Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural Pearl Powder Facial Mask, Mugwort Warming Patch, Herbal Chinese Medicine Shampoo. Although a century-old nationwide brand, this flagship store incorporates local Southern Fujian wellness and beauty needs, offering various locally developed herbal beauty products. Their ultra-fine natural pearl powder can be mixed directly with milk or honey to create a facial mask that provides excellent whitening and nourishing effects\u2014a must-try for lovers of natural herbal beauty.", "name": "Beijing Tongrentang Pharmacy (Zhangzhou Ancient City Flagship Store)", "transport": "Take Bus Route 5 or 17 to \u0027Yanan South Road\u0027 Station, then walk for about 2 minutes."}, {"address": "No. 205 Yanan South Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Southern Fujian Herbal Anti-Acne Ointment, Snake Oil Anti-Chapping Cream, Peppermint Cooling Soothing Balm. A well-established local pharmacy chain in Zhangzhou. Beyond daily medications, its highlight is stocking a wide range of traditional Fujian local cosmeceuticals and skincare products. The snake oil cream and peppermint balm are highly praised by local elders and tourists alike, performing wonders for repairing autumn/winter dry skin and soothing summer insect bites\u2014offering high value for money with guaranteed quality.", "name": "Zhangzhou Yiyao Huayuan Pharmacy (Yanan South Road Branch)", "transport": "Take Bus Route 1 or 8 to \u0027First Hospital\u0027 Station, then walk 300 meters along Yanan South Road."}, {"address": "No. 88 Yanan South Road, Xiangcheng District, Zhangzhou City, Fujian Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Alpine Dendrobium Orchid Firming \u0026 Anti-Wrinkle Essence, Purple Reishi Multi-Effect Repair Mask, Centella Asiatica Soothing Lotion. A well-known domestic beauty brand specializing in alpine plant skincare. This branch in the ancient city features decor combining Southern Fujian brick-and-wood elements with a natural botanical vibe. The signature \u0027Dendrobium Orchid Essence\u0027 uses high-quality plant extracts for superior hydrating and anti-aging effects; the Purple Reishi mask is a lifesaver for post-su
