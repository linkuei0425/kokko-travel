t": "Take Metro Line 2 directly to People\u0027s Park Station."}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A music and cultural industrial park converted from the old Hongguang Electron Tube Factory, brimming with industrial vintage style and modern creative arts.", "duration": "2-3 hours", "title": "Eastern Suburb Memory", "transport": "Take Metro Line 8 to Dongjiao Memory Station, walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A quaint covered bridge spanning the Jinjiang River. Brilliantly illuminated at night, it is a iconic landmark night spot in Chengdu.", "duration": "1 hour", "title": "Anshun Bridge", "transport": "Take Metro Line 2 to Dongmen Bridge Station, walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | The central hub square of Chengdu, symbolizing the heart of the city, surrounded by museums, science centers, and grand theaters.", "duration": "1 hour", "title": "Tianfu Square", "transport": "Take Metro Line 1 or Line 2 directly to Tianfu Square Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Adjacent to Du Fu Thatched Cottage and Qingyang Palace, featuring exquisite Sichuan-style bonsai and an elegant, peaceful environment.", "duration": "1-2 hours", "title": "Baihuatan Park", "transport": "Take Metro Line 5 to Qingyang Palace Station, walk for about 8 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Cruise along the Jinjiang River in a traditional-style boat to enjoy an immersive light show showcasing Chengdu\u0027s enchanting night charm.", "duration": "1-2 hours", "title": "Jinjiang River Night Cruise", "transport": "Take Metro Line 2 to Dongmen Bridge Station and head to Dongmen Pier to board"}, {"category": "\ud83c\udfdb\uf nch pastries. The signature pistachio mille-cr\u00eape cake and specialty cold brew coffee are popular afternoon tea choices.", "duration": "1 hour", "title": "YeLibre Desserts (Kuixinglou Street Branch)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station, Exit B, and walk about 600 meters"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.7 stars | A popular skewers spot brimming with an 80s nostalgic retro vibe. Their signature original dipping broth combined with tender beef skewers and mini spicy bowls (maocai) will leave you instantly addicted.", "duration": "1.5 hours", "title": "Malubianbian Malatang (Zhimin Road Branch)", "transport": "Take Metro Line 3 to Xinnanmen Station, Exit B, and walk about 200 meters"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.8 stars | An independent camping-themed caf\u00e9 filled with lush greenery. Featuring exceptional signature concoctions like the \"Wilderness Special\" and premium single-origin pour-overs, it is a peaceful sanctuary away from the city hustle.", "duration": "1-1.5 hours", "title": "Wilderness Coffee", "transport": "Take Metro Line 3 or Line 4 to Second People\u0027s Hospital Station, Exit E, and walk about 500 meters"}, {"category": "Leshan", "description": "\u2b50 5 stars | A UNESCO World Cultural and Natural Heritage site. Stand before the awe-inspiring 71-meter-tall stone carved seated Maitreya Buddha and marvel at the grandeur of this thousand-year-old engineering masterpiece.", "duration": "3-4 hours", "title": "Leshan Giant Buddha", "transport": "Take Leshan Bus No. 13 or No. 3 to Giant Buddha Scenic Area Station"}, {"category": "Leshan", "description": "\u2b50 5 stars | One of China\u0027s Four Sacred Buddhist Mountains. Renowned for spectacular Golden Summit sunrises, seas of clouds, and Buddha\u0027s Light, it seamlessly blends breathtaking natural scenery with rich Buddhist heritage.", "duration": "1-2 days", "title": "Mount Emei", "transport": "Take the high-speed train from Leshan Railway Station to Emeishan Station, then transfer to the scenic shuttle bus"}, {"category": "Leshan", "description": "\u2b50 4 stars | A historic waterfront town and the birthplace of the famous \u0027Qiaojiao Beef\u0027 (herbal beef stew). Stroll across old bridges and narrow streets while savoring delicious local traditional snacks.", "duration": "2-3 hours", "title": "Suji Ancient Town", "transport": "Take Leshan Bus No. 8 or No. 801 to Suji Ancient Town Station"}, {"category": "Leshan", "description": "\u2b50 5 stars | A narrow-gauge steam train operating in Bagou Town, Qianwei, known as the \u0027living fossil of the Industrial Revolution.\u0027 It offers an exceptionally romantic ride in spring as it rolls through vibrant golden fields of rapeseed flowers.", "duration": "4-5 hours", "title": "Jiayang Steam Train", "transport": "Drive or take a coach bus from Leshan to Qianwei, then transfer to the local shuttle bus to Yuejin Station"}, {"category": "Leshan", "description": "\u2b50 4 stars | Famous for its unique \u0027Boat-Shaped Street\u0027 lined with traditional Sichuan teahouses. Sip covered-bowl tea under eaves and play cards to experience the ultimate relaxed Sichuan slow lifestyle.", "duration": "2-3 hours", "title": "Luocheng Ancient Town", "transport": "Take a coach bus from Leshan Passenger Transport Center to Luocheng Town, Qianwei"}, {"category": "Leshan", "description": "\u2b50 4 stars | A cliffside sculpture site along the Qingyi River where thousands of Sui and Tang Dynasty Buddha statues are carved into the mountain side, offering a magnificent yet tranquil atmosphere.", "duration": "2-3 hours", "title": "Jiajiang Thousand Buddha Crags", "transport": "Take an intercity train to Jiajiang Station, then take a local taxi to the site"}, {"category": "Leshan", "description": "\u2b50 5 stars | Leshan\u0027s most iconic night market foodie hotspot, featuring sweet-skinned duck, Bobo chicken, grilled fish, ice jelly, and endless delicacies that foodies shouldn\u0027t miss.", "duration": "2-3 hours", "title": "Zhanggongqiao Food Street", "transport": "Take Leshan Bus No. 6, No. 9, or No. 12 to Zhanggongqiao Station"}, {"category": "Leshan", "description": "\u2b50 5 stars | An intangible cultural heritage specialty of Leshan. Featuring crispy skin coated in shiny syrup with tender, flavorful meat inside, its perfect blend of sweet and savory makes it the top must-buy local souvenir.", "duration": "30 mins", "title": "Zhao\u0027s Sweet-Skinned Duck (Main Store)", "transport": "Take Leshan Bus No. 12 to Xinqiao Street Station and walk a short distance"}, {"category": "Leshan", "description": "\u2b50 5 stars | A renowned Bobo Chicken restaurant across Sichuan offering red chili oil and rattan pepper broth styles. Skewered ingredients steeped in rich, aromatic, and numbing sauce make for an unforgettable culinary experience.", "duration": "1-2 hours", "title": "Grandma Ye\u0027s Bobo Chicken (Minjiang No. 1 Branch)", "transport": "Take Leshan Bus No. 2 or No. 14 to Renmin South Road Station, then walk for 3 minutes"}, {"category": "Leshan", "description": "\u2b50 5 stars | A famed restaurant inheriting intangible cultural heritage. Sweet and rich herbal beef broth is served with tender beef and offal, paired with a special dry chili powder dip for an extraordinary flavor.", "duration": "1-2 hours", "title": "Gushixiang Qiaojiao Beef (Suji Main Branch)", "transport": "Take Leshan Bus No. 8 to Suji Town Gushixiang Station"}, {"category": "Leshan", "description": "\u2b50 4.5 stars | A wildly popular local favorite with long queues, famous for its signature garlic and passion fruit hot \u0026 sour chicken feet. The tender meat easily slips off the bone and is packed with flavor, making it the ultimate mouth-watering snack.", "duration": "30 minutes", "title": "Jiumei Chicken Feet", "transport": "Take Leshan Bus Route 1 or 6 to Fujie Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | Hailed as the \"Bermuda of China,\" this park features mysterious primeval forests, alpine meadows, and hot springs. The natural landscapes are breathtakingly stunning and steeped in intriguing legend.", "duration": "1 day", "title": "Heizhugou National Forest Park", "transport": "Driving is recommended, or take a long-distance bus from Leshan Bus Terminal to Ebian County, then transfer to a local shuttle to Heizhugou."}, {"category": "Leshan", "description": "\u2b50 4 stars | The birthplace and childhood home of literary giant Guo Moruo. Designed in a classic West Sichuan courtyard style, it showcases his life story, manuscripts, and rich collection of historical relics.", "duration": "1-2 hours", "title": "Guo Moruo Former Residence", "transport": "Take a passenger bus from Leshan to Shawan and get off at the Shawan Guo Moruo Former Residence Station."}, {"category": "Leshan", "description": "\u2b50 4 stars | A specialized museum combining ebony carving art with natural wonders. It displays tens of thousands of precious ebony artworks in a grand and exquisitely crafted showcase.", "duration": "2-3 hours", "title": "Ebony Culture Museum", "transport": "Take Leshan Bus Route 8 or 10 to Wumu Bowuyuan (Ebony Museum) Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | A century-old establishment serving meticulously cleaned pork intestines prepared through braising, stir-frying, deep-frying, and steaming. The texture is crispy, tender, and savory without any off-odors.", "duration": "1 hour", "title": "Youji Pork Intestines (Suji Branch)", "transport": "Take Leshan Bus Route 8 to Suji Ancient Town, then walk to Suji Street."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | The birthplace of a classic Leshan specialty dish featuring fresh eel shredded finely and cooked with special spices and toon sprouts. Tender, spicy, and deeply satisfying.", "duration": "1-2 hours", "title": "Linjiang Shredded Eel", "transport": "Self-driving is recommended, or take a dedicated shuttle from downtown Leshan to Linjiang Town, Shizhong District."}, {"category": "Leshan", "description": "\u2b50 4 stars | A large modern shopping complex in Leshan featuring movie theaters, international fashion brands, specialty dining, and kids\u0027 entertainment, offering ultimate convenience for shopping and leisure.", "duration": "2-3 hours", "title": "Leshan Wanda Plaza", "transport": "Take Leshan Bus Route 12, 301, or 308 to Wanda Plaza Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | A classic lychee-flavored carbonated soda that Leshan locals grew up with. Served chilled, it is crisp, refreshing, cuts through grease, and serves as the perfect companion to spicy Sichuan dishes.", "duration": "30 minutes", "title": "Emeixue Soda Experience", "transport": "Available at major restaurants, convenience stores, and the Zhanggongqiao Night Market throughout Leshan."}, {"category": "Leshan", "description": "\u2b50 4 stars | Specializes in Leshan-themed creative products and local souvenirs, featuring Giant Buddha memorabilia, Shu embroidery, and beautifully packaged local specialty gift sets.", "duration": "1 hour", "title": "Leshan Gifts (Leshan Giant Buddha Cultural Store)", "transport": "Located inside the Visitor Center of Leshan Giant Buddha Scenic Area; accessible by Bus Route 13."}, {"category": "Leshan", "description": "\u2b50 4 stars | A landscaped plaza adjacent to the main entrance of the Giant Buddha Scenic Area. Blending Buddhist culture with lush green gardens, it is perfect for a leisurely stroll, taking photos, and absorbing the serene vibe.", "duration": "1-2 hours", "title": "Leshan Giant Buddha Cultural Square", "transport": "Take Leshan Bus Route 13 to Dafo Guangchang (Giant Buddha Square) Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | Dong Dajie is a classic culinary hub in Leshan home to historic sweet-skinned duck and Qiao Jiao beef shops, ideal for a one-stop trip to sample local street food and pick up delicious souvenirs.", "duration": "1-2 hours", "title": "Dong Dajie Sweet-Skinned Duck Food Street", "transport": "Take Bus Route 1 or 6, get off at Dong Dajie Station, and walk a short distance."}, {"category": "Leshan", "description": "\u2b50 4.4 stars | Perched atop Mount Wuyou, this serene ancient temple houses an Arhat Hall and Guanyin Hall. It is a tranquil retreat for escaping the crowds, taking in views of the Min River, and feeling the peaceful Zen atmosphere.", "duration": "1.5-2 hours", "title": "Wuyou Temple", "transport": "Walk from the South Gate of the Leshan Giant Buddha Scenic Area across the Wuyouba Bridge."}, {"category": "Leshan", "description": "\u2b50 4.7 stars | Still in operation, this narrow-gauge steam train is celebrated as a living fossil of the Industrial Revolution. In spring, it rolls through vibrant golden rapeseed fields, creating a deeply nostalgic and romantic journey.", "duration": "4-6 hours", "title": "Jiayang National Mine Park \u0026 Steam Train", "transport": "Take a bus from Leshan Bus Terminal to Qianwei County, then transfer to a local shuttle to Yuejin Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | The town\u0027s layout resembles a giant ship docked on a hilltop. Traditional teahouses line Liangting Street, where sitting down for tea and a chat offers an authentic taste of West Sichuan\u0027s slow-paced lifestyle.", "duration": "2-3 hours", "title": "Luocheng Ancient Town Boat-Shaped Street", "transport": "Take a direct intercity bus from Leshan Lianyun Station to Luocheng Ancient Town in Qianwei."}, {"category": "Leshan", "description": "\u2b50 4.3 stars | Located in Shawan District, this Qing Dynasty West Sichuan-style courtyard showcases the life relics and literary works of modern writer Guo Moruo, offering rich cultural and historical depth.", "duration": "1-2 hours", "title": "Guo Moruo Memorial Hall", "transport": "Take Bus Route 204 from downtown Leshan to Shawan Guo Moruo Former Residence Station."}, {"category": "Leshan", "description": "\u2b50 4.2 stars | A cliff tomb stone carving museum from the Eastern Han Dynasty, displaying a rich collection of Han Dynasty tomb bas-reliefs and cultural relics. It holds immense value for understanding ancient Ba-Shu culture and carving arts.", "duration": "1 hour", "title": "Mahao Cliff Tomb Museum", "transport": "Walk within the Leshan Giant Buddha Scenic Area, located next to Mahao Fishing Village between Lingyun Mountain and Wuyou Mountain."}, {"category": "Leshan", "description": "\u2b50 4.8 stars | Situated halfway up Mount Emei, where the Black and White rivers merge. Listening to the rushing water sounds like zither music. Surrounded by lush greenery and gently sloped trails, it is a haven for summer heat escape and scenic hiking.", "duration": "2-3 hours", "title": "Qingyin Pavilion Scenic Area, Mount Emei", "transport": "Take the tourist express line from Leshan Bus Passenger Transport Center to the Wuxiangang Parking Lot at Mount Emei, then walk about 30 minutes to arrive."}, {"category": "Leshan", "description": "\u2b50 4.6 stars | The first temple on Mount Emei and its gateway landmark. The temple bustles with incense and worshipers, featuring towering ancient trees in its courtyard and housing a giant Liankui Wall along with a Ming Dynasty red bronze Huayan Pagoda.", "duration": "1-1.5 hours", "title": "Baoguo Temple, Mount Emei", "transport": "Take a C-series high-speed train from Leshan Railway Station to Mount Emei Station, then transfer to City Bus Line 5 to Baoguo Temple Station."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | An ancient temple hidden deep within dense forests, famous for the wonder of \"crouching tigers hidden in the deep woods, and no fallen leaves on the rooftops.\" The surroundings are tranquil, elegant, and filled with an ethereal atmosphere.", "duration": "1-2 hours", "title": "Fuhu Temple, Mount Emei", "transport": "Walk about 15 minutes from the Baoguo Temple Scenic Area or take a sightseeing bus to the entrance of Fuhu Temple."}, {"category": "Leshan", "description": "\u2b50 4.6 stars | Take a night cruise at the confluence of the Minjiang, Qingyi, and Dadu rivers. Through light show projections, admire the mountain contours of the Sleeping Buddha and the Giant Buddha, offering a breathtaking night view entirely different from the daytime.", "duration": "1-1.5 hours", "title": "Leshan Giant Buddha Night Cruise on Three Rivers", "transport": "Purchase tickets and board at Leshan Port Cruise Terminal or Baxiandong Terminal."}, {"category": "Leshan", "description": "\u2b50 4.7 stars | An iconic Bobo Chicken (skewered cold dish) restaurant in Leshan. It offers two classic flavors: red chili oil and rattan pepper. Skewered ingredients soaked in rich, flavorful broth deliver a delightfully savory, numbing, and spicy taste.", "duration": "1 hour", "title": "Ye Po Po Bobo Chicken", "transport": "Take Bus Line 6 or 9 to Chongqing Road Station, then walk 200 meters."}, {"category": "Leshan", "description": "\u2b50 4.8 stars | The ultimate benchmark for Leshan\u0027s Sweet-Skinned Duck. The skin is crispy with a rich, aromatic sweet glaze, while the meat is tender, flavorful, and non-greasy\u2014a must-try delicacy and souvenir when visiting Leshan.", "duration": "0.5 hours", "title": "Ji Liu Niang Sweet-Skinned Duck", "transport": "Take Bus Line 1 to Dong Dajie Station, then walk 100 meters."}, {"category": "Leshan", "description": "\u2b50 4.6 stars | An immensely popular local snack shop best known for its garlic-flavored and spicy garlic chicken feet. Tender, flavorful, sour, and spicy, they are loved by both tourists and locals alike.", "duration": "0.5 hours", "title": "Jiu Mei Chicken Feet", "transport": "Take Bus Line 2 or 12 to Fujie Station, then walk a short distance."}, {"category": "Leshan", "description": "\u2b50 4.5 stars | A time-honored Shaomai (ste romas, it\u0027s the ultimate late-night food choice.", "duration": "1.5-2 hours", "title": "Fang Fang BBQ", "transport": "Take Bus Line 9 to Xinjie Station, then walk about 150 meters."}, {"category": "Leshan", "description": "\u2b50 4.3 stars | Located near a famous night market area, this market sells various traditional Leshan pastries, vacuum-packed sweet-skinned ducks, Kuding tea, and Shu embroidery handicrafts\u2014perfect for souvenir shopping.", "duration": "1 hour", "title": "Leshan Specialty Local Products Market (Zhanggongqiao Branch)", "transport": "Take Bus Line 6 or 13 to Zhanggongqiao Station."}, {"category": "Leshan", "description": "\u2b50 4.4 stars | Specializing in Leshan\u0027s traditional Suji crispy rice candy and the local childhood nostalgia drink \"Emei Xue Lychee Soda.\" The rice candy is sweet and crunchy, making it a wonderful local gift for friends and family.", "duration": "0.5-1 hour", "title": "Suji Crispy Rice Candy \u0026 Emei Xue Souvenir Shop", "transport": "Take Bus Line 8 to Suji Ancient Town or visit tourist shops in the downtown area."}, {"category": "Dujiangyan", "description": "\u2b50 4.9 Stars | A World Cultural Heritage site and a marvel of ancient hydraulic engineering. It features iconic spots like Yuzui (Fish Mouth Levee), Feishaye (Flying Sand Weir), and Baopingkou (Bottle Neck Opening), offering a firsthand look at ancient water management wisdom.", "duration": "3-4 hours", "title": "Dujiangyan Irrigation System", "transport": "Take the Chengdu-Guanxian High-Speed Railway to Dujiangyan Station, then transfer to Bus Route 4 or take a taxi for about 15 minutes."}, {"category": "Dujiangyan", "description": "\u2b50 4.8 Stars | One of the birthplaces of Taoism, renowned for its lush green slopes and ancient towering trees. Key cultural Taoist attractions include Jianfu Palace, Tianshi Cave, and Shangqing Palace.", "duration": "4-5 hours", "title": "Mount Qingcheng - Front Mountain", "transport": "Take the Chengdu-Guanxian High-Speed Railway to Qingchengshan Station, then transfer to the scenic shuttle bus or Bus Route 101 to reach the entrance."}, {"category": "Dujiangyan", "description": "\u2b50 4.7 Stars | Famous for its deep, serene natural landscapes, featuring cascading waterfalls, crystal streams, and cliffside plank paths. Perfect for hiking and soaking up fresh air.", "duration": "5-6 hours", "title": "Mount Qingcheng - Back Mountain", "transport": "Take the Chengdu-Guanxian High-Speed Railway to Qingchengshan Station, then transfer to a scenic minibus directly to Tai\u0027an Ancient Town in the Back Mountain."}, {"category": "Dujiangyan", "description": "\u2b50 4.8 Stars | Offers up-close views of giant pandas and red pandas undergoing breeding and wild-release training. Peaceful surroundings and fewer crowds make for an outstanding viewing experience.", "duration": "2-3 hours", "title": "Dujiangyan Panda Valley", "transport": "Take Dujiangyan Bus Route 14 or a taxi for about 20 minutes to get there directly."}, {"category": "Dujiangyan", "description": "\u2b50 4.6 Stars | Home to the famous giant selfie panda sculpture designed by a Dutch artist, making it a wildly popular landmark for photos in Dujiangyan.", "duration": "1 hour", "title": "Yangtianwo Square", "transport": "Take the Chengdu-Guanxian High-Speed Railway to Lidui Park Station; the square is right outside the station exit."}, {"category": "Dujiangyan", "description": "\u2b50 4.7 Stars | A grand wooden arch bridge featuring beautifully painted beams and carved rafters. Dazzlingly illuminated at night, it is a magnificent spot to marvel at the famous \u0027Blue Tears\u0027 water phenomenon.", "duration": "1-2 hours", "title": "South Bridge (Nanqiao)", "transport": "Located next to Guanxian Ancient City; about a 10-minute walk from Lidui Park Station."}, {"category": "Dujiangyan", "description": "\u2b50 4.5 Stars | Ancient streets showcasing traditional Ming and Qing architectural styles, filled with authentic Si                     </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
