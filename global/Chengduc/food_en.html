s consistently excellent espresso and rich lattes, the coffee here is silky with deep nutty notes. The classic brunch platter includes crispy-on-the-outside, soft-on-the-inside French Toast, seared Nuremberg sausages, and fluffy scrambled eggs. The toast, soaked in egg wash and fried to golden perfection, balances sweet and savory flavors seamlessly. Comfortable outdoor seating offers views of the Jiaozi Ring, making it a favorite among young crowds.", "name": "Pause Coffee (Jiaozi Avenue)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit B, and walk about 250 meters."}, {"address": "1st Floor, Zone N1, Global Center, No. 1700 North Section Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.4 stars | Located inside the New Century Global Center\u2014Asia\u0027s largest standalone building\u2014this European-style bakery cafe is filled with the enticing aroma of freshly baked French croissants and sourdough. Signature items like the \u0027Elvis Peanut Butter Banana Toast\u0027 and \u0027Big American Breakfast\u0027 offer rich flavors, while the flaky, crispy croissants crunch deliciously with every bite. Paired with a smooth, medium-dark roast hot Americano, it strikes a well-balanced flavor profile. The massive high-ceiling space decorated with lush greenery provides a deeply relaxing atmosphere for shoppers taking a break.", "name": "The Bridge Bakery \u0026 Cafe (Global Center)", "transport": "Take Metro Line 1 to Jincheng Plaza Station, Exit A, which connects directly to the Global Center building."}, {"address": "No. 233 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.8 stars | Yeans Coffee has made a name for itself in Financial City with premium single-origin pour-overs and exquisite Japanese-style brunch items. Baristas brew onsite with precision, highlighting delicate floral and fruity notes and bright acidity with a lingering sweet aftertaste. Food recommendations include the \u0027Japanese Teriyaki Chicken Sandwich\u0027 and \u0027Matcha Pancakes\u0027\u2014juicy, tender chicken thigh paired with soft milk bread and signature sauce creates an irresistibly savory flavor. Its cozy, peaceful atmosphere and friendly service make this a beloved hidden gem among locals.", "name": "Yeans Coffee (Financial City)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit C, and walk about 350 meters."}, {"address": "Level B1, K Avenue, Chengdu SKP, No. 2001 North Section Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 stars | Located inside Chengdu SKP, a high-end sunken landscape park mall, Brunch\u0026Co serves elegant French-Mediterranean style brunch dishes. Signature creations like \u0027Truffle \u0026 Wild Mushroom Poached Eggs\u0027 and \u0027Handcrafted Black Truffle Beef Burger\u0027 offer stunning layers of flavor\u2014cutting into the poached egg reveals a luscious yolk infused with tantalizing truffle aroma, while the beef patty is juicy, tender, and savory. Paired with specialty cold brew coffee, it combines luxurious taste with beautiful presentation, earning high praise from photo-loving tourists.", "name": "Brunch\u0026Co (Chengdu SKP)", "transport": "Take Metro Line 1 or Line 18 to Jincheng Plaza East Station, Exit E for direct access to SKP."}, {"address": "1st Floor Perimeter, M Cube Mall, No. 300 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 stars | Hailing from Berlin, Germany, renowned specialty coffee brand Five Elephant brings top-tier roasting techniques along with German desserts and brunch to the Hi-Tech Zone. Their pour-over coffee tastes exceptionally clean and sweet, perfectly paired with world-famous signature \u0027New York Cheesecake\u0027 featuring a velvety rich filling and a crispy, non-greasy cookie crust. Sleek industrial design and floor-to-ceiling windows draw countless specialty coffee enthusiasts specifically to visit.", "name": "Five Elephant Coffee (Jiaozi Avenue)", "transport": "Take Metro Line 1 to Financial City Station, Exit B, and walk about 500 meters."}, {"address": "Jiaozi Ring Plaza, No. 229 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 stars | Situated beside the Jiaozi Ring pedestrian bridge and right next to the iconic Twin Towers of the Hi-Tech Zone, this location boasts stunning cityscape views. Offering high-quality yet affordable specialty coffee, their hot Osmanthus Latte and Oat Milk Latte are rich, smooth, and naturally sweet. For brunch, the freshly toasted Ham \u0026 Cheese Panini features a golden, crispy crust oozing with gooey melted cheese and savory ham. With sleek, efficient service and a prime location, it\u0027s the perfect pit stop while exploring Financial City or photographing the Twin Towers.", "name": "Manner Coffee (Twin Towers Jiaozi Ring)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit B, and walk about 150 meters."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "Block M6, ICP Global Center, No. 300 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.8 Stars | A benchmark for high-end Sichuan cuisine in Chengdu, Chaimen Hui brings out the full spectrum of Sichuan\u0027s 24 classic flavor profiles. The signature \u0027Tea-Smoked Duck with Caviar\u0027 pairs crisp smoked duck skin and savory meat with rich, bursting caviar, creating a delightful crunch and intricate layers of flavor. Featuring elegant private rooms and attentive sommelier service, it is the premier choice for business banquets and gourmets seeking refined local culinary creations.", "name": "Chaimen Hui", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit D, and walk for about 5 minutes."}, {"address": "8th Floor, Yintai Centre in99, No. 1199 North Section of Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | Dedicated to combining traditional mansion-style Sichuan dishes with modern culinary techniques. The must-order \u0027Nantang Sauerkraut Fish\u0027 features paper-thin, melt-in-your-mouth fish slices, balanced by the natural tang of sauerkraut and the tingling aroma of rattan pepper. The interior blends ancient and contemporary Oriental aesthetics with a sleek modern feel, making it extremely popular among local white-collar workers and tourists alike.", "name": "Nantang Hall - Modern Sichuan Cuisine", "transport": "Take Metro Line 1 to Financial City Station, Exit B, and walk for about 8 minutes."}, {"address": "5th Floor, M.Cube Shopping Center, No. 500 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 Stars | A regular on the Black Pearl Restaurant Guide, Yin Ba excels at integrating molecular gastronomy into traditional Sichuan flavors. The \u0027Green Peppercorn Snowflake Beef\u0027 features premium marbled beef slow-cooked at low temperatures for an exceptionally tender and juicy texture, infused with the fresh, zesty aroma of green peppercorns. With trendy modern decor and professional wine pairing recommendations, it is a favorite among stylish young diners and business professionals.", "name": "Yin Ba - Modern Sichuan Cuisine", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit B, and walk for about 3 minutes."}, {"address": "4th Floor, Overseas Chinese Financial Center, No. 33 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 Stars | A renowned establishment dedicated to authentic aristocratic Sichuan dishes and Western Sichuan folk flavors. The signature \u0027Xu\u0027s Crispy Sea Cucumber\u0027 boasts a golden, crispy exterior with a chewy, tender center soaked in rich, savory broth. The Financial City location offers a grand and elegant environment, seamlessly integrating traditional Oriental garden elements into a modern space\u2014perfect for those seeking a high-end Sichuan dining experience.", "name": "Xu\u0027s Cuisine", "transport": "Take Metro Line 1 to Financial City Station, Exit A, and walk for about 6 minutes."}, {"address": "1st Floor, Wenxuan SOLO100, No. 233 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 Stars | An atmospheric venue that perfectly blends local Chengdu spiciness with a modern bistro concept. The signature \u0027Spicy Secret-Recipe Clam \u0026 Crab\u0027 features sweet, plump crab meat tossed in a rich, mouth-numbing sauce that delivers a balance of sweet and spicy. Pair it with a custom Sichuan-inspired cocktail for the ultimate relaxed vibe. The outdoor seating offers distant views of the Twin Towers\u0027 night lights, making it a hotspot for enjoying Chengdu\u0027s vibrant nightlife and cuisine.", "name": "Ting Xiang - Szechuan Bistro", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit A, and walk for about 4 minutes."}, {"address": "Inside InterContinental Chengdu Global Center, No. 1700 North Section of Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | An upscale bistro located inside the Global Center, the world\u0027s largest standalone building. The signature \u0027Spicy Stir-Fried Lobster\u0027 features large, live lobsters flash-fried to preserve their springy texture, thoroughly infused with the fiery aroma of dried chilies and Sichuan peppercorns. Combining a stylish bar with fine Sichuan cuisine, the venue boasts high ceilings, luxurious decor, and live jazz, drawing foodies who appreciate both visual and culinary indulgence.", "name": "Yun Ya No. 6 Bistro", "transport": "Take Metro Line 1 to Jincheng Plaza Station, Exit A, which connects directly to the Global Center."}, {"address": "1st Floor, No. 233 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 Stars | An iconic open-air Chinese-style bistro in Chengdu\u2014\u0027Erma\u0027 translates to a pleasantly tipsy state in Sichuan dialect. Highlights include signature \u0027Sichuan Skewers\u0027 and \u0027Sichuan Stir-Fried Pork Liver\u0027, which is tender, silky, and devoid of unwanted odors. Pair them with house-crafted low-ABV green plum and fruit wines for a sweet, smooth kick. As night falls, enjoy front-row views of the Twin Towers light show, making it a top gathering spot for young crowds.", "name": "Erma Pub (Jiaozi Avenue)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit A, and walk for about 3 minutes."}, {"address": "1st Floor, ICP Global Center, No. 300 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | A stylish bistro combining live music performances with high-end Sichuan cuisine. The signature \u0027Courtyard Rattan Pepper Chicken\u0027 features free-range chicken with crisp skin and tender meat, infused with the refreshing, subtle numbing aroma of green rattan pepper. As the night band takes the stage, sip on a craft cocktail made with Sichuan\u0027s native Zhuyeqing green tea base, perfectly encapsulating the blend of modern chic and historic charm in Chengdu\u0027s Hi-Tech Zone.", "name": "Lotus Courtyard Szechuan Bistro", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit D, and walk for about 5 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "4F, Zone N2, New Century Global Center, No. 1700 Tianfu Avenue North Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.8 Stars | A renowned Tibetan tea vegetarian hot pot spot inside the Global Center, using rich Ya\u0027an Tibetan tea as its broth base paired with high-mountain wild mushrooms and fresh vegetables. The broth has a sweet aftertaste with light tea aromas and mushroom savoriness, feeling smooth and soothing without any traditional hot pot grease. The signature handmade vegetarian beef and tofu soak up the tea broth completely, bursting with flavorful juice upon every bite with a satisfying texture. Highly popular among health-conscious local professionals and tourists.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hot Pot", "transport": "Metro Line 1 Jincheng Plaza Station, Exit C direct connection to Global Center"}, {"address": "3F, COFCO Unipark, No. 333 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 Stars | An elegant vegetarian restaurant located in the Financial City business district, specializing in a seamless fusion of traditional Sichuan flavors and modern healthy vegetarian cuisine. Its signature dish, \u0027Boiled Vegetarian Fish,\u0027 uses premium monkey head mushrooms and konjac to create a tender, chewy texture that absorbs spicy, tongue-numbing Sichuan red oil\u2014delivering a thrilling flavor without distressing your stomach. The serene, Zen-inspired environment makes it a top choice for business banquets and family gatherings in Financial City.", "name": "Qingshui Hehua Vegetarian Restaurant", "transport": "Metro Line 5 Jiaozi Avenue Station, Exit B, approx. 300m walk"}, {"address": "4F, Renhe Spring Plaza, No. 88 Fucheng Avenue West Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 Stars | An aesthetic restaurant focusing on high-end fine dining vegetarian cuisine, offering set-menu creative plant-based experiences. Every dish is crafted like a work of art. The flagship dish \u0027Black Truffle Bamboo Fungus Rolls\u0027 features tender, crisp bamboo fungus wrapping aromatic black truffle and minced wild mushrooms\u2014creating rich layers and a burst of delicate truffle aroma on the palate. The attentive service and tranquil ambiance away from the city\u0027s hustle attract many gourmets who appreciate slow dining and vegetarian aesthetics.", "name": "Chanyue Vegetarian Restaurant", "transport": "Metro Line 5 Chengdu First People\u0027s Hospital Station, Exit A, approx. 400m walk"}, {"address": "1F, Building A, Meinian Plaza, No. 1388 Tianfu Avenue Middle Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 Stars | A great-value, affordable vegetarian buffet located near the High-Tech Industrial Park, offering over 60 fresh hot stir-fries, steamed dim sum, cold dishes, and vegetable soups daily. The vegetarian Mapo Tofu and vegetarian Xiaolongbao (steamed soup dumplings) are hugely popular\u2014the tofu is tender and savory with an authentic mild Sichuan numbing heat, while the soup dumplings feature thin wrappers and sweet, juicy vegetable fillings. Thanks to fast dish refills and unbeatable prices, it is a hot spot for local tech workers and residents.", "name": "Su Man Xiang Vegetarian Buffet", "transport": "Metro Line 1 Huafu Avenue Station, Exit C, approx. 500m walk"}, {"address": "L6, Yintai Center in99, No. 177 Jiaozi Avenue, Shiyang Sub-district, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 Stars | A nationally famous established vegetarian brand, featuring a modern and natural dining space inside Yintai Center in99. Its signature \u0027Longevity Pine Nut Fish\u0027 uses kelp and seaweed to replicate fish skin, filled with high-quality soy protein and yam, fried to a golden crisp outside while soft inside, dressed in a luscious sweet and sour sauce. Adhering strictly to no eggs, no pungent vegetables (alliums), and low oil/salt, it is an outstanding choice for health-conscious diners seeking light, guilt-free gourmet meals.", "name": "Zaozi Shu Vegetarian Restaurant", "transport": "Metro Line 1 / Line 18 Incubation Park Station, Exit 9, approx. 450m walk"}, {"address": "1F, East Hope Global Center, No. 500 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.4 Stars | A chic modern vegetarian bistro near the Twin Towers Light Show, specializing in creative Asian-Western fusion plant-based dishes. A must-order favorite is the \u0027Black Truffle Wild Mushroom Risotto,\u0027 made with Italian arborio rice and assorted mushrooms\u2014cooked al dente and coated in rich plant-based cream and black truffle sauce for a savory, velvety taste. The outdoor terrace offers views of the Financial City Twin Towers night scene, making it a popular romantic spot for young adults and tourists.", "name": "Green Space Vegetarian Cuisine", "transport": "Metro Line 5 Jiaozi Avenue Station, Exit A, approx. 200m walk"}, {"address": "3F, Zone E2, New Century Global Center, No. 1700 Tianfu Avenue North Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 Stars | A premium vegetarian restaurant inside the Global Center, offering light salads, nourishing vegetable soups, and creative Sichuan vegetarian dishes. Highly recommended is the \u0027Matsutake \u0026 Bamboo Fungus Nourishing Soup,\u0027 slow-simmered for hours using Yunnan mountain matsutake mushrooms. The broth is clear and golden, brimming with fresh pine forest aroma and crisp bamboo fungus. Dedicated to promoting natural flavors and low-carbon plant-based eating, it is a go-to spot for shoppers at the Global Center seeking a refreshing, wholesome meal.", "name": "Shangsu Vegetarian Cuisine", "transport": "Metro Line 1 Jincheng Plaza Station, Exit C direct connection to Global Center"}, {"address": "2F, Chutianfu Shopping Mall, No. 88 Shujin Road, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 Stars | A serene sanctuary combining tea art, Zen meditation, and plant-based aesthetics, serving exquisite private-kitchen vegetarian set menus. The hallmark dish \u0027Kung Pao Lion\u0027s Mane Mushroom\u0027 tears mushrooms into chunks, frying them crispy on the outside and juicy inside before stir-frying with traditional Sichuan Kung Pao technique. It mimics tender chicken effortlessly, offering sweet-savory notes with aromatic peanuts and dried chili. Surrounded by classic bamboo groves and water features, it is a serene haven to relax and relish top-tier vegetarian creations.", "name": "Bodhi Tree Vegetarian Aesthetics", "transport": "Metro Line 1 Financial City Station, Exit B, approx. 600m walk"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Food Street Stalls near Tencent Building, Tianfu 3rd Street, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | Chengdu\u0027s iconic traditional street treat! Golden and crispy on the outside, fluffy and soft like clouds on the inside, offering a rich egg and milk aroma in every bite. Choose from a variety of sweet and savory fillings like spicy beef, pork floss cream, or special sesame peanut. Made fresh to order and served piping hot, it\u0027s the top choice for an afternoon snack among Hi-Tech Zone office workers and tourists alike.", "name": "He Ji Egg Crepes (\u8cc0\u8a18\u86cb\u70d8\u7cd5)", "transport": "Take Metro Line 1 to Tianfu 3rd Street Station, Exit A, and walk about 5 minutes."}, {"address": "Snack Street near Unipark, No. 333 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 Stars | Classic Sichuan-style freshly fried handmade Guokui (crispy meat pie) with distinct, flaky layers. Pan-fried first and then baked using a unique technique, the shell delivers an ultra-satisfying crunch while the meat filling bursts with juicy beef and aromatic Sichuan pepper numbness. Piping hot and deeply satisfying, it\u0027s a must-try grab-and-go snack when visiting the Financial City commercial area.", "name": "Qiu Ji Crispy Meat Pie (\u90b1\u8a18\u8ecd\u5c6f\u934b\u9b41)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit D, and walk about 4 minutes."}, {"address": "Street Corner Stall, No. 88 Zhonghe Avenue Section 2, Zhonghe Street, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.4 Stars | A must-eat classic market snack in Chengdu, skewered on bamboo sticks resembling bright red candied hawthorns. Coated in caramel and white sesame seeds and deep-fried to golden perfection, it features a sweet crunchy shell and a chewy, hollow interior. Perfectly sweet without being greasy, it\u0027s beloved by tourists and locals of all ages.", "name": "Deng Ji Time-Honored Sweet Fried Rice Balls (\u9127\u8a18\u8001\u5b57\u865f\u7cd6\u6cb9\u679c\u5b50)", "transport": "Take Metro Line 6 to Zhonghe Station, Exit B, and walk about 6 minutes."}, {"address": "Food Market, B1 Floor, Zone E2, Global Center, No. 1700 Tianfu Avenue North Section, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 Stars | Famous street-food spot originating from Leshan serving Cold Skewers (Bobo Ji). Sliced fresh meats and vegetables are skewered on bamboo sticks and soaked in rich chili oil with sesame or refreshing rattan pepper broth. The chili oil is bold and spicy, while the rattan pepper broth is crisp and aromatic. Juicy chicken, crisp celtuce, and crunchy potato slices make this an ideal handheld treat for soaking in Chengdu\u0027s relaxed street vibe.", "name": "Ye Po Po Cold Skewers - Global Center (\u8449\u5a46\u5a46\u7f3d\u7f3d\u96de)", "transport": "Take Metro Line 1 to Jincheng Plaza Station, Exit C, leading directly to B1 of Global Center."}, {"address": "Market Area, Phase 1, Tiexiang Temple Water Street, No. 88 Shengbang Street, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | The ultimate palate cleanser and spicy-food antidote in the Water Street market! Hand-rubbed from natural seeds, the crystal-clear jelly is filled with tiny air bubbles and melts smoothly in your mouth. Served with rich traditional brown sugar syrup, fermented glutinous rice, hawthorn flakes, crushed peanuts, and mini rice balls, it offers delightful texture layers\u2014perfect for savoring while strolling through the historic Water Street.", "name": "Chan Quan Traditional Ice Jelly (\u79aa\u6cc9\u53e4\u6cd5\u51b0\u7c89)", "transport": "Take Metro Line 5 to Yongcui Road Station, Exit B, and walk about 10 minutes."}, {"address": "Outdoor Pedestrian Street Stall, Mofa Shopping Center, No. 500 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 Stars | A wildly popular street stall snack featuring braised and deep-fried chicken feet! Prepared using a unique process\u2014braised until tender, flash-fried, then tossed in seasoning\u2014the meat melts in your mouth and effortlessly slides off the bone. Dusted with house-made hotpot chili powder or heavy Chengdu numbing spice, it has a lightly crisp exterior packed with collagen-rich softness inside that keeps you coming back for more.", "name": "Xianglong Hot \u0026 Spicy Chicken Feet (\u964d\u9f8d\u722a\u722a)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit B, and walk about 3 minutes."}, {"address": "Folk Craft Stall, Tiexiang Temple Water Street, No. 699 Tianfu 1st Street, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.3 Stars | A fun traditional folk snack combining culinary art and performance! The vendor throws hot sticky rice balls onto copper plates, creating three loud \u0027clang clang clang\u0027 sounds as they bounce into a basket full of roasted soybean flour, before drizzling them with rich brown sugar syrup. Soft, chewy, and coated in aromatic soybean powder and sweet syrup, it\u0027s a photo-worthy market classic.", "name": "Li Ji Traditional Three Cannons (\u674e\u8a18\u8001\u6210\u90fd\u4e09\u5927\u70ae)", "transport": "Take Metro Line 5 to Yongcui Road Station, Exit B, and walk about 8 minutes."}, {"address": "Outdoor Food Stall Area, Dacheng Xiaoai, No. 288 Tianfu 3rd Street, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.4 Stars | A legendary bold delicacy of Chengdu night markets! Fresh pig brains are baked in foil containers with secret spicy chili oil, pickled green beans, fish mint, and plenty of crushed Sichuan peppercorns. The texture is silky smooth and custard-like\u2014similar to soft tofu\u2014with zero gamey flavor, replaced instead by rich, fiery, and aromatic spices. Highly recommended for late-night foodies and adventurous culinary travelers!", "name": "Jiucun Roasted Pig Brains (\u4e5d\u6751\u70e4\u8166\u82b1)", "transport": "Take Metro Line 1 to Tianfu 3rd Street Station, Exit B, and walk about 6 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "High-Tech Zone, Financial City and Global Center"}, "huanglongxi_ancient_towns": {"categories": {"cat_1": {"items": [{"address": "No. 69 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | The birthplace and most authentic representative of \u0027One-Strand Noodles\u0027! Each bowl contains just a single long, continuous noodle, skillfully stretched, tossed, and flicked by the master chef in a mesmerizing performance. The noodle has a wonderfully chewy, springy texture, served in a rich broth with signature chili oil minced pork\u2014smooth, savory, and spicy. A beloved favorite for both tourists and Chengdu locals.", "name": "Fuxing Old Shop One-Strand Noodles", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus 541 to Huanglongxi Bus Station, then walk about 8 minutes."}, {"address": "No. 112 Zheng Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | A decades-old heritage spot in the ancient town, renowned for its silky stone-ground tofu pudding. The tofu pudding has a tender, jade-like texture and a pure, rich soybean aroma. Dip it in the chef\u0027s special spicy chili oil or fresh scallion dip\u2014it melts instantly in your mouth, bursting with savory, spicy, and numb flavors. A must-try classic taste when visiting Huanglongxi.", "name": "Jiaojia Tofu Pudding Restaurant", "transport": "Walk about 10 minutes from Huanglongxi Bus Station to Zheng Street in the ancient town."}, {"address": "Inside Mochidao Scenic Area, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 Stars | A classic riverside Sichuan restaurant famous for its fresh wild catfish (Huanglading) caught at the confluence of the Fu and Luxi Rivers. The fish meat is extraordinarily tender and smooth with almost no fine bones, thoroughly absorbing the essence of the spicy red oil broth. Balanced with zesty sourness and aromatic spices, accompanied by local wild celery and konjac, it\u0027s an addictive dish you won\u0027t be able to stop eating.", "name": "Mochidao Huanglading Catfish Restaurant", "transport": "Walk along Riverside Road inside Huanglongxi Ancient Town Scenic Area straight to Mochidao."}, {"address": "No. 45 Zhenjiang Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 Stars | A historic traditional tofu pudding eatery in Huanglongxi, named after its \u0027pearl\u0027 douhua that resembles translucent pearls. The tofu pudding is soft and smooth, paired with a unique savory broth and special stir-fried minced pork for unbeatable flavor. They also serve local specialties like steamed pork and intestines with rice flour\u2014soft, savory, and rich in authentic western Sichuan farmhouse flavor.", "name": "Zhenzai Pearl Douhua Restaurant", "transport": "Located in the core area of the ancient town, about a 6-minute walk from the main entrance of Huanglongxi Scenic Area."}, {"address": "No. 147 Shang Street, Luodai Ancient Town, Longquanyi District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | A legendary eatery in nearby Luodai Ancient Town, named \u0027Sad Bean Jelly\u0027 because it\u0027s so spicy it brings tears to your eyes! The springy, refreshing pea starch jelly is topped with extra-spicy signature chili oil, aromatic crushed peanuts, and pickled mustard greens. One bite unleashes an overwhelming sensation of heat and numbness\u2014an exhilarating challenge that draws foodies from all over.", "name": "Luodai Sad Bean Jelly Head Shop", "transport": "Take Metro Line 4 to Xihe Station, transfer to Bus L024 to Luodai Bus Station, then walk about 5 minutes."}, {"address": "No. 56 Shuren Street, Anren Ancient Town, Dayi County, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | A decades-old staple in nearby Anren Ancient Town, acclaimed as a local marvel of western Sichuan. Freshly cooked duck blood curds are even softer and smoother than tofu, melting in your mouth with zero gameyness. Served piping hot in a rich, spicy broth alongside crispy soybeans and pork intestines, this fiery dish goes amazingly well with rice. Highly recommended by locals!", "name": "Anren You Xuewang Old Restaurant", "transport": "Take the direct shuttle bus from Chengdu Chadianzi Bus Station to Anren, then walk to Shuren Street upon arrival."}, {"address": "No. 88 Yingbin Street, Pingle Ancient Town, Qionglai City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | A renowned braised and roasted duck shop in nearby Pingle Ancient Town. Premium local free-range ducks are stewed in dozens of traditional herbal spices and then roasted to perfection. Featuring crispy skin and firm, juicy meat infused with smoky braised aromas, it is perfectly seasoned, savory without being greasy\u2014a beloved staple enjoyed by all ages.", "name": "Pingle Sun Duck Restaurant", "transport": "Take the Pingle Ancient Town special bus line from Qionglai Bus Terminal to Pingle Bus Station, then walk about 6 minutes."}, {"address": "No. 28 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 Stars | One of the most iconic traditional pastry shops in Huanglongxi Ancient Town. Adhering to traditional hand-kneading methods and stone-ground sesame seeds, their sesame cake is delicate, dense, and melts in your mouth. Rich aromas of roasted black and white sesame linger delightfully with a balanced sweetness. Wrapped in vintage-style packaging, it makes a perfect classic souvenir loved by locals and visitors alike.", "name": "Zhangji Ancient Sesame Cake Shop", "transport": "Located within the ancient town, about a 7-minute walk from the Scenic Area Visitor Center."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "No. 58 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.6 Stars | A popular scenic cafe located along the stream in Huanglongxi Ancient Town, specializing in cold brew coffee and Sichuan-style signature drinks. The signature Sichuan Pepper Latte features rich, layered flavors\u2014a subtle numbing warmth perfectly blended with rich milk aroma. Paired with freshly baked crispy caramel waffles, you can relax on tatami mats by the water and enjoy the tranquil water-town charm and pleasant breeze of the ancient town.", "name": "Rivulet Walk Cafe", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk to the destination."}, {"address": "No. 12 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.7 Stars | A retro cafe renovated from a century-old Ming and Qing dynasty quadrangle courtyard (Siheyuan), preserving traditional grey bricks, black tiles, and wooden beams. It serves exquisite British brunch and specialty pour-over coffee. The classic Smoked Salmon Eggs Benedict releases a golden yolk waterfall when sliced. Paired with an aromatic Yirgacheffe pour-over, dining under the open courtyard sky offers a poetic contrast between historic charm and modern relaxation.", "name": "Longxi No.1 Courtyard Cafe", "transport": "Take Metro Line 5 to Huilong Station, then transfer to Shuangliu Bus 810 to Huanglongxi Ancient Town Station."}, {"address": "No. 88 Chuanyin Road, Huanglongxi Town, Shuangliu District, Chengdu (Near Huanglongxi Valley)", "feature": "\u2b50 4.5 Stars | Tucked away in a lush natural garden in Huanglongxi Valley, this is an outdoor picnic-style brunch spot beloved by tourists and local youth. Highly recommended is the generous Aussie All-Day Breakfast, featuring pan-fried sausages, crispy hash browns, mushrooms, and basil tomatoes, paired with a velvety Flat White. With its rich, smooth mouthfeel, it transports you to the relaxing atmosphere of a European estate.", "name": "Oz Garden Brunch \u0026 Coffee", "transport": "Driving is recommended, or take Metro Line 5 to Huilong Station and transfer to a taxi (approx. 15 minutes)."}, {"address": "No. 83 Xia Street, Luodai Ancient Town, Longquanyi District, Chengdu", "feature": "\u2b50 4.6 Stars | A crossover concept store that seamlessly merges Hakka ancient town culture with contemporary specialty coffee. The signature Gaiwan Americano uses specialty Yunnan coffee beans, delivering a mildly acidic, fruity flavor with a sweet aftertaste. Paired with freshly made Hakka \u0027Sad Cold Noodles\u0027 and traditional handmade Hakka mochi for brunch, this unique blend of savory and sweet attracts countless visitors to check in.", "name": "Wei Ming Xuan Tea \u0026 Coffee", "transport": "Take Metro Line 4 to Xihe Station, transfer to Bus L024 to Luodai Bus Station, and walk for 5 minutes."}, {"address": "No. 16 Shuren Street, Anren Ancient Town, Dayi County, Chengdu", "feature": "\u2b50 4.8 Stars | Located in the heart of Anren Ancient Town with a strong Republican-era vibe, the decor oozes modern retro elegance reminiscent of Old Shanghai. The popular brunch choice is French Toast served with fresh berries and honey\u2014the toast is cloud-soft inside from absorbing the egg wash, while fried to a golden crisp outside. Paired with a dark roast espresso, its bittersweet, long-lasting aroma creates a rich historical and cultural mood.", "name": "Anren Wencai Cafe", "transport": "Take a direct coach bus to Anren Ancient Town from Chengdu Chadianzi Bus Station, then walk about 8 minutes after arrival."}, {"address": "No. 102 Jiangcheng Street, Jiezi Ancient Town, Chongzhou City, Chengdu", "feature": "\u2b50 4.7 Stars | A romantic scenic cafe located next to a thousand-year-old ginkgo tree in Jiezi Ancient Town, serving stunning specialty cold brews and handmade tiramisu. The tiramisu is moist, soft, and melt-in-your-mouth, rich with pour-over coffee notes and smooth mascarpone cheese. Sitting under the ginkgo tree in autumn with an osmanthus-infused latte, surrounded by falling golden leaves and rich milky scents, creates the dreamiest ancient town afternoon.", "name": "Jiezi Ginkgo Tree Cafe", "transport": "Take the Chengpu Intercity Railway from Chengdu Xipu Railway Station to Chongzhou Station, then transfer to Chongzhou Bus 102 directly."}, {"address": "No. 299 Section 4, Huanglong Avenue, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.5 Stars | A popular sunlit glasshouse cafe surrounded by greenery with a minimalist white decor, serving as a trendy brunch hotspot near Huanglongxi. Try their house-special Poached Egg and Avocado Rye Toast\u2014cutting into the poached egg releases a rich yolk that layers perfectly with smooth avocado spread and crunchy rye toast. Pair it with a nutty hot cappuccino with velvety foam that you\u0027ll fall in love with at first sip.", "name": "Herbal Sunshine Cafe", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus T40 to Huanglongxi Ancient Town Entrance Station."}, {"address": "No. 45 Xingle Street, Pingle Ancient Town, Qionglai City, Chengdu", "feature": "\u2b50 4.6 Stars | Located right next to the Bamboo Sea scenic area and the Baimo River in Pingle Ancient Town, offering a fresh and serene atmosphere. The cafe features a signature Bamboo Latte infused with local bamboo leaf aromas\u2014smooth on the palate with a light, fresh herbal scent. Pair it with a freshly grilled homemade avocado chicken sandwich, crisp on the outside and juicy on the inside. Listening to the flowing river while enjoying a hearty brunch makes this the ultimate escape from city hustle.", "name": "Pingle Bamboo Sea Cafe", "transport": "Take an express coach directly to Pingle Ancient Town from Xinnanmen Bus Station; it is a short walk upon arrival at the scenic area."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 70 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | A legendary noodle shop you must try in Huanglongxi! The noodle master dances to music while tossing a single long strand of noodle into the pot, creating a highly entertaining visual show. The noodles are incredibly springy, chewy, and firm, fully absorbing the rich, spicy beef broth and fragrant chili oil. Every bite offers the unique charm of Sichuan noodle cuisine, making it immensely popular with tourists and locals alike.", "name": "Huanglongxi One-Strand Noodle Restaurant", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk from there."}, {"address": "No. 45 Huanglong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | A traditional West Sichuan bistro tucked away in a courtyard within the ancient town, preserving a strong Ming and Qing architectural style. The signature yellow catfish soup is extremely delicious with melt-in-your-mouth tender fish, served alongside house-made traditional pickles and cellar-aged rice wine. Smooth and refreshing, the slightly tipsy ambiance makes you feel like traveling back in time\u2014a fantastic place to experience Sichuan\u0027s slow life and traditional home-style flavors.", "name": "Jiao\u0027s Courtyard Local Restaurant", "transport": "Take the free Huanglongxi Scenic Area shuttle bus to the Ancient Town entrance, then walk for about 5 minutes."}, {"address": "No. 12 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.3 stars | A scenic bistro situated along the Jinjiang River, famous for freshly caught and cooked Fu River fish and local West Sichuan dishes. The signature spicy river prawns and numbing-spicy snakehead fish slices are savory, spicy, and perfectly firm and springy. Enjoying traditional yellow wine accompanied by gentle river breezes and night views of the ancient town is truly refreshing, making it a hit among tourists seeking great atmosphere and authentic Sichuan flavors.", "name": "Longfengge River Seafood \u0026 Local Dishes", "transport": "Walk about 600 meters from the Huanglongxi Scenic Area Visitor Center."}, {"address": "No. 88 Pedestrian Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.4 stars | A popular tofu pudding bistro passed down through generations, insisting on using traditional stone mills to grind soybeans. The tofu pudding (douhua) has a silky, smooth texture that melts in your mouth with a rich soybean aroma. Paired with a spicy dipping sauce made from secret red oil, roasted crushed peanuts, and chopped green onions, the flavor profile is exquisitely layered. Paired with a jug of sorghum liquor and cured pork, it is easily one of the most humble yet astonishing delicacies in the ancient town.", "name": "Huanglongxi Stone Mill Douhua Restaurant", "transport": "Take Metro Line 5 to Huilong Station, transfer to the dedicated shuttle bus to Huanglongxi Ancient Town Station, and walk 300 meters."}, {"address": "Inside Boke Building, Boke Town, Luodai Ancient Town, Longquanyi District, Chengdu City", "feature": "\u2b50 4.7 stars | A unique Hakka bistro located inside the core Tulou (earthen building) of Luodai Ancient Town, blending Sichuan spicy flavors with rich Hakka tastes. The signature \u0027Sad Jelly Noodles\u0027 (Shangxin Liangfen) are smooth, springy, sour, and intensely spicy\u2014addictively delicious! Pair them with classic Hakka stuffed tofu and salted chicken, where the tofu is crispy outside, tender inside, and bursting with meat juice. Enjoyed with traditionally brewed green plum wine, it offers foodies a truly unique Hakka-Sichuan culinary experience.", "name": "Luodai Bokelou Hakka Restaurant", "transport": "Take Metro Line 4 to Xihe Station, transfer to Bus 219 or L024 to Luodai Bus Station, and walk from there."}, {"address": "No. 56 Shuren Street, Anren Ancient Town, Dayi County, Chengdu City", "feature": "\u2b50 4.6 stars | A century-old restaurant in Anren Ancient Town, famous for its exquisite blood curd (xuewang) dishes. The signature Mao Xuewang has a pudding-like silky texture with no gamey odor, melting in your mouth while absorbing the rich spicy broth infused with Sichuan pepper and red oil. Accompanied by crispy pork intestines and crunchy roasted peanuts, it delivers fantastic textural contrast\u2014a folk culinary experience you shouldn\u0027t miss when visiting Anren.", "name": "Anren You Xuewang Local Bistro", "transport": "Take a direct coach bus from Chengdu Chadianzi Bus Station to Anren Ancient Town, then walk about 10 minutes upon arrival."}, {"address": "No. 102 Jiangcheng Street, Jiezi Ancient Town, Chongzhou City, Chengdu City", "feature": "\u2b50 4.4 stars | A traditional Sichuan bistro located at the foot of Mount Fengqi in Jiezi Ancient Town, Chongzhou, specializing in rich and flavorful West Sichuan rural cuisine. The signature steamed pork with rice flour (Fenzhengrou) is meltingly tender and rich without being greasy, while the taro underneath absorbs all the fragrant savory juices. Paired with a refreshing crispy sesame cake in soup and local aged yellow wine, it tastes smooth and sweet, highly favored by travelers who love peaceful ancient towns and great food.", "name": "Jiezi Ancient Town Jiangcheng Restaurant", "transport": "Take the Chengpu High-Speed Railway to Chongzhou Station, transfer to Chongzhou Bus 302 to Jiezi Ancient Town Bus Station, and walk from there."}, {"address": "No. 215 Xingle Street, Pingle Ancient Town, Qionglai City, Chengdu City", "feature": "\u2b50 4.5 stars | A natural-style bistro located along the Baimo River in Pingle Ancient Town, Qionglai, highlighting fresh bamboo shoots and local wild flavors. The signature braised chicken with bamboo shoots features freshly harvested bamboo shoots and free-range chicken slow-simmered to perfection; the shoots are crisp and sweet, while the chicken is tender and juicy in a rich, flavorful broth. Accompanied by sweet bamboo tube sticky rice wine with a subtle bamboo fragrance, it is widely praised by visiting families and tourists.", "name": "Pingle Ancient Town Bamboo Sea Restaurant", "transport": "Take a direct tourist bus from Chengdu Xinnanmen Bus Station to Pingle Ancient Town, then walk 5 minutes after arriving."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Zhenjiang Temple, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 Stars | Located inside Zhenjiang Temple in Huanglongxi, this restaurant is famous for its traditional temple vegetarian cuisine. The signature Assorted Vegetarian Delights and Shiitake Mushroom with Tofu Skin offer rich layers of texture\u2014juicy mushrooms combined with springy, silky tofu skin in a light, non-greasy sauce. Tourists love soaking in the tranquil ancient temple atmosphere while savoring clean, delicate vegetarian flavors.", "name": "Huanglongxi Zhenjiang Temple Vegetarian Restaurant", "transport": "Take Shuangliu Bus S18 to Huanglongxi Bus Station, then walk for about 10 minutes."}, {"address": "No. 14 Zheng Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.3 Stars | Specializing in traditional handmade tofu pudding (douhua) and various vegan tofu dishes. The fresh, authentic tofu pudding is silky, dense, and melts in your mouth. Paired with a secret spicy dipping sauce, it delivers a numbingly spicy, savory, and aromatic flavor profile that locals and tourists never tire of.", "name": "Guzhen Handmade Tofu Workshop", "transport": "Located on Main Street in the heart of Huanglongxi Ancient Town, accessible on foot."}, {"address": "Beside Guxiang Temple, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 Stars | A quaint tea house combining Zen tea culture with light vegetarian meals. The specialty vegetarian noodles and handmade taro balls have fantastic textures; the noodle broth is sweet and clear, while the chewy noodles soak up all the flavorful broth. It\u0027s the ultimate relaxing spot after a long walk through the ancient town.", "name": "Guxiang Temple Vegetarian Tea House", "transport": "Inside Huanglongxi Ancient Town scenic area, about an 8-minute walk near the Fu River."}, {"address": "Inside Laojun Temple, No. 1 Laojunshan Road, Xinjin District, Chengdu City", "feature": "\u2b50 4.7 Stars | Nestled inside Laojun Temple on Laojun Mountain near Huanglongxi, this venue specializes in health-conscious Taoist vegetarian cuisine. The braised vegetarian eggplant and stewed Chinese yam soup are fragrant and refreshing\u2014the yam is tender and soft, while the broth is sweet and comforting. A top choice for health-conscious foodies.", "name": "Xinjin Laojun Mountain Taoist Vegetarian Restaurant", "transport": "About a 25-minute drive from Huanglongxi scenic area, or take Xinjin Bus 529 to Laojunshan Station."}, {"address": "No. 28 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.2 Stars | Specializes in steamed corn cakes and leaf-wrapped glutinous rice cakes made purely from natural plant ingredients. Piping hot corn cakes are soft, tender, and subtly sweet, brimming with a rich natural corn flavor. It is a wildly popular vegetarian walking snack in the ancient town.", "name": "Huanglongxi Handmade Corn Cake Shop", "transport": "Located on Fuxing Street in Huanglongxi Ancient Town, reachable by walking along the main thoroughfare."}, {"address": "No. 88 Yingbin Road, Pingle Ancient Town, Qionglai City, Chengdu City", "feature": "\u2b50 4.4 Stars | Tucked away in a bamboo grove in Pingle Ancient Town near Huanglongxi, this restaurant highlights bamboo shoot feasts and wild vegetarian delicacies. Fresh bamboo shoots are crisp, tender, and juicy, perfectly seasoned with house-made vegetarian sauces for a uniquely earthy, delicious culinary experience.", "name": "Pingle Ancient Town Bamboo Vegetarian Restaurant", "transport": "Take the Pingle Ancient Town Direct Bus from Chengdu Chadianzi Bus Terminal."}, {"address": "No. 102 Shang Street, Luodai Ancient Town, Longquanyi District, Chengdu City", "feature": "\u2b50 4.5 Stars | Famous for its vegan Hakka traditional \u0027Sad Tofu Pudding\u0027 (spicy tofu pudding) and jelly noodles. The tofu pudding is silky smooth, drizzled with a custom fiery sauce so tongue-numbingly spicy and addictively flavorful it makes you tear up\u2014a must-try classic local vegetarian snack for visitors.", "name": "Luodai Ancient Town Sad Tofu Pudding", "transport": "Take Metro Line 4 to Xihe Station, then transfer to Bus 858 to Luodai Ancient Town."}, {"address": "No. 45 Jiangfeng Street, Jiezi Ancient Town, Chongzhou City, Chengdu City", "feature": "\u2b50 4.3 Stars | Offers handmade vegan sesame cakes and high-mountain organic tea. Fresh out of the oven, the sesame cakes feature a crispy, aromatic sesame crust with a pleasantly sweet, chewy filling. Paired with a pot of fine green tea, it perfectly embodies Chengdu\u0027s relaxed, slow-paced ancient town lifestyle.", "name": "Jiezi Ancient Town Pure Vegan Sesame Cake \u0026 Tea House", "transport": "Transfer to Bus 102 from Qingcheng Mountain High-speed Rail Station directly to Jiezi Ancient Town."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 1 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A must-try noodle performance snack for visitors in Huanglongxi! The entire bowl features just one single, long noodle with an incredibly springy and chewy texture. Served with rich, spicy minced pork and crushed peanuts, every slurp is smooth and continuous. It\u0027s a visual show and a feast for the tastebuds, hugely popular among tourists.", "name": "Huanglongxi One-Strand Noodle", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 10 minutes."}, {"address": "No. 102 Zheng Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Traditional tofu pudding passed down for generations in the ancient town, melt-in-your-mouth tender with a rich soybean aroma. Paired with the house-made dipping sauce (chili oil, Sichuan peppercorns, scallions, and fermented black beans), the spicy, savory flavors blend seamlessly with the warm tofu pudding. A favorite comforting street snack for locals and tourists strolling through the town.", "name": "Huanglongxi Stone-Ground Tofu Pudding", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 8 minutes."}, {"address": "No. 15 Chuanzu Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Made with fresh river shrimp and small fish freshly caught from tributaries of the Jinjiang River, lightly battered and fried to golden perfection. Dusted with custom chili and Sichuan pepper powder, they deliver a satisfying crunch with a savory, spicy bite\u2014shell and all! A perfect stick-mounted snack to munch on while exploring the ancient town.", "name": "Huanglongxi Crispy River Shrimps", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 12 minutes."}, {"address": "No. 28 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Fragrant sticky rice paired with red beans, cured pork, or purple rice, packed inside fresh green bamboo tubes and slow-roasted over low heat. The rice absorbs the subtle, natural aroma of the bamboo, resulting in a soft, chewy texture with a hint of sweetness. Hugely popular among travelers who enjoy portable traditional flavors.", "name": "Huanglongxi Bamboo Rice", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 10 minutes."}, {"address": "No. 50 Gulao Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.2 stars | Watch artisans hand-pull golden maltose candy on the spot, accompanied by the rhythmic clinking of tools that creates a nostalgic, childlike atmosphere. Sweet and rich at first bite, it slowly melts in your mouth without sticking to your teeth. A classic street treat full of old-town tradition loved by both kids and adults.", "name": "Huanglongxi Hand-Pulled Maltose Candy", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 7 minutes."}, {"address": "No. 7 Boke Street, Luodai Ancient Town, Longquanyi District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | An ultra-popular snack in nearby Luodai Ancient Town, named \u0027sad\u0027 because its fiery spiciness brings tears to your eyes! Made from pea starch, the springy, silky jelly noodles are dressed with special red chili oil, crushed peanuts, cilantro, and fiery seasonings. It offers a sour, spicy, electrifying kick\u2014a must-try for spice-tolerance challengers.", "name": "Luodai Sad Jelly Noodles", "transport": "Take Metro Line 4 to Xihe Station, transfer to Bus 219 to Luodai Bus Terminal Station, and walk for about 5 minutes."}, {"address": "No. 88 Jiangfeng Street, Jiezi Ancient Town, Chongzhou City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A famous traditional steamed cake from neighboring ancient towns. The outer layer is made of sticky rice flour wrapped around savory minced pork with pickled shoots or sweet red bean paste, then wrapped in banana leaves and steamed over high heat. Soft, chewy, and infused with a subtle leaf aroma, the savory filling is rich and juicy, offering a wonderful layered texture ideal for a street snack.", "name": "Jiezi Ancient Town Leaf-Wrapped Rice Cake", "transport": "Drive directly or take a direct shuttle bus to Jiezi Ancient Town from Chengdu Chadianzi Bus Terminal."}, {"address": "No. 42 Xin Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | A signature local flatbread made using traditional baking methods, baked to a golden crisp outside and covered in fragrant white sesame seeds. The filling features spicy Sichuan pepper salt and crispy pork cracklings. Incredibly crispy, savory, and lightly numbing with every crackly bite, it is a uniquely traditional street snack.", "name": "Huanglongxi Crispy Sesame Cake", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Bus Station, and walk for about 9 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Huanglongxi and Surrounding Ancient Towns"}, "jiuyanqiao_dongjiao": {"categories": {"cat_1": {"items": [{"address": "No. 99 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.5 Stars | Founded in 1925, this century-old Sichuan-style braised delicacy restaurant is located near the Mengzhuiwan TV Tower. Its cooked braised meats are a collective memory for old Chengdu locals, particularly the braised duck wings, pork ribs, and pig\u0027s trotters. Slow-simmered in a century-old secret master stock, the meat is delightfully tender, juicy, and infused with aromatics deep to the bone, offering a savory, mildly spicy, and deeply lingering flavor. Tourists and local food lovers alike love grabbing takeout braised meats to pair with a piping hot bowl of Sichuan rice to experience the true essence of century-old Sichuan braised heritage.", "name": "Pansunshi Restaurant", "transport": "Take Metro Line 3 or 4 to Second People\u0027s Hospital Station, or Line 4 or 6 to Yushuang Road Station, and walk for about 10 minutes."}, {"address": "No. 168 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.6 Stars | Established during the Tongzhi reign of the Qing Dynasty, this iconic restaurant is the birthplace of Mapo Tofu, located near Mengzhuiwan TV Tower. Its signature Mapo Tofu perfectly embodies the eight classic characteristics of Sichuan cuisine: numbing, spicy, piping hot, fresh, aromatic, crispy, tender, and smooth. Served bubbling hot in a stone pot, the silky tofu is bathed in vibrant red oil and topped with crispy minced beef and premium Sichuan peppercorn powder. Melt-in-your-mouth tender with a bold numbing kick, it captivates both local foodies and international visitors\u2014a must-visit century-old brand to taste the true soul of Sichuan cuisine.", "name": "Chen Mapo Tofu", "transport": "Take Metro Line 4 or 6 to Yushuang Road Station, and walk for about 8 minutes after exiting."}, {"address": "No. 3, Lane 2, Section 2, Jianshe North Road, Chenghua District, Chengdu", "feature": "\u2b50 4.4 Stars | Hailed as the ultimate pinnacle of Chengdu\u0027s famous street-eatery (\u0027fly restaurant\u0027) scene, this traditional eatery is located near the Eastern Suburb Memory commercial area. For decades, it has insisted on serving classic home-style Sichuan dishes. The signature Tofu Pig Brain combines silky tofu with rich, creamy pig brains, drizzled with spicy red oil sauce for a multi-layered, satisfyingly spicy taste. The brain texture is buttery smooth with zero gamey odor. Exceptional value for money and authentic local hospitality make it a top choice for local youth and culinary adventurers.", "name": "Mingting Restaurant", "transport": "Take Metro Line 8 to Dongjiao Memory Station or Jianshe North Road Station, and walk for about 12 minutes."}, {"address": "No. 2 Taiping South New Street, Wuhou District, Chengdu (Jiuyan Bridge Branch)", "feature": "\u2b50 4.7 Stars | Located by Jiuyan Bridge, this famous traditional beef tallow hotpot restaurant is renowned for its rich, traditionally prepared broth and martial arts (Wuxia)-themed decor. Must-order specialties include the \u0027Taiji Meat Paste Duo\u0027 and \u0027Paper-thin Kidney Slices\u0027. Swirling the paper-thin kidney slices in boiling spicy red broth for a quick flash cook and dipping them into dry chili seasoning yields a remarkably crisp, tender texture with zero gamey taste. The explosive spicy and numbing aroma bursts on the palate, making it a top hotpot pick for late-night foodies exploring Jiuyan Bridge.", "name": "Shudaxia Hotpot", "transport": "Take Metro Line 2 to Niuwangmiao Station or Line 6 to Shunjiang Road Station, and walk for about 10 minutes."}, {"address": "No. 28 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.3 Stars | A multi-generational legendary roast duck spot in the Mengzhuiwan area near the TV Tower. Unlike Peking roast duck, Chengdu\u0027s Zhang Roast Duck follows the traditional Sichuan \u0027Mao Roast Duck\u0027 style: the duck skin is roasted until golden crisp, then chopped and steeped in a signature hot and spicy rich broth. The skin soaks up the savory, spicy broth, delivering a juicy combination of aromatic roasted duck oils and vibrant Sichuan broth flavors. Crisp skin, tender meat, and rich juices make it a beloved favorite for local families and visiting foodies.", "name": "Zhang Roast Duck", "transport": "Take Metro Line 3 or 4 to Second People\u0027s Hospital Station, and walk for about 9 minutes."}, {"address": "No. 128 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.2 Stars | Founded in the 1940s, this iconic traditional Chengdu street food brand sits right next to the Mengzhuiwan TV Tower. Its signature clear-broth Chaoshou (wontons) feature paper-thin wrappers and plump fillings served in a rich white broth simmered from chicken, duck, and pork bones, offering ultimate savory richness. The red-oil Chaoshou are tossed in special spicy chili oil and Sichuan pepper oil\u2014silky, tender, pleasantly spicy without being harsh, with a sweet savory finish. It showcases the fine craftsmanship of traditional Sichuan street food delicacies.", "name": "Long Chaoshou", "transport": "Take Metro Line 4 to Yushuang Road Station or Line 3 to Second People\u0027s Hospital Station, and walk for about 10 minutes."}, {"address": "No. 15 Jianshe South Road, Chenghua District, Chengdu", "feature": "\u2b50 4.4 Stars | A long-standing traditional Sichuan duck specialty restaurant near Eastern Suburb Memory, renowned for decades for its secret-recipe braised duck and crispy duck. The crispy duck is fried to golden perfection\u2014crust shattering at a gentle bite while keeping the meat juicy and succulent inside. Paired with house-made Sichuan pepper salt, the savory, spicy, and numbing flavors burst in your mouth, making it addictive. Locals often stop by to pick up half a duck to pair with drinks, making it a must-try local spot for tourists visiting Eastern Suburb Memory.", "name": "Ye Duck", "transport": "Take Metro Line 8 to Dongjiao Memory Station, and walk for about 6 minutes after exiting."}, {"address": "Haowangjiao Plaza, Jiuyan Bridge, Jinjiang District, Chengdu (Jiuyan Bridge Branch)", "feature": "\u2b50 4.6 Stars | A long-established iconic Sichuan hotpot restaurant located in the Jiuyan Bridge area, acclaimed for its rich, authentic, traditional beef tallow broth. Highly praised signature dishes include handcrafted cilantro meatballs and fresh tripe. The large, crisp tripe swished briefly in the boiling spicy red broth turns incredibly crunchy and juicy, bursting with rich hotpot aromatics without being heavy on the stomach. With consistent top-tier quality and a charming rustic ancient Bashu atmosphere, it remains a timeless classic hotpot destination in Jiuyan Bridge.", "name": "Lomatuo Hotpot", "transport": "Take Metro Line 2 to Niuwangmiao Station or Line 6 to Shunjiang Road Station, and walk for about 8 minutes after exiting."}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "No. 118 Wangping Street, Binhe Road, Chenghua District, Chengdu", "feature": "\u2b50 4.6 stars | An industrial-style independent cafe located along the riverside district of Mengzhuiwan, seamlessly blending old Chengdu\u0027s slow-paced riverside lifestyle with modern specialty coffee. The signature custom brew \u0027Chengdu Fog\u0027 pairs espresso with special Sichuan green plum syrup and sparkling water\u2014slightly sweet and sour with rich fizzy layers. The brunch menu features thick-cut handmade toast with pan-seared smoked bacon and eggs, crispy and hearty, making it a favorite among local youth and travelers alike.", "name": "Lanman Coffee", "transport": "About a 10-minute walk from Exit D of Dongmen Bridge Station, Metro Line 2"}, {"address": "Inside Eastern Suburb Memory Park, Jianshe South Road, Chenghua District, Chengdu", "feature": "\u2b50 4.5 stars | A retro industrial-style cafe located inside Eastern Suburb Memory Creative Park. The interior retains red brick walls and vintage mechanical parts, exuding a rich artistic atmosphere. The popular \u0027Sichuan Spicy Beef Big Breakfast\u0027 cleverly blends sliced local spicy Sichuan beef with a classic English breakfast\u2014flavorful spicy beef accompanied by silky poached eggs. Paired with a dark roast latte, the coffee is rich, aromatic, and smooth.", "name": "Xingpi Coffee \u0026 Brunch", "transport": "About a 5-minute walk from Exit B of Dongjiao Memory Station, Metro Line 8"}, {"address": "No. 12 Siguan Road, Next to Jiuyan Bridge, Jinjiang District, Chengdu", "feature": "\u2b50 4.7 stars | Located by the Jinjiang River near Jiuyan Bridge, this minimalist cafe features magnificent floor-to-ceiling glass windows allowing guests to take in beautiful views of the Funan River while enjoying brunch. The \u0027Avocado \u0026 Smoked Salmon Sourdough Toast\u0027 is a must-try\u2014crispy outside, soft inside, layered with mashed avocado and savory smoked salmon. Their pour-over coffee uses Ethiopian single-origin beans, offering bright floral and fruity notes.", "name": "Sense Coffee", "transport": "About a 12-minute walk from Exit A of Niuwangmiao Station, Metro Line 2"}, {"address": "No. 4 Wangping Binhe Road, Shuangqiaozi Subdistrict, Chenghua District, Chengdu", "feature": "\u2b50 4.4 stars | A spacious cave-style bookstore cafe located near the Chengdu 339 TV Tower, blending reading with specialty brunch. The signature \u0027Black Truffle \u0026 Wild Mushroom Eggs Benedict\u0027 features rich poached eggs over fragrant black truffle saut\u00e9ed mushrooms for an incredibly smooth taste. Their special \u0027Sichuan Pepper Latte\u0027 brilliantly fuses the subtle numbness of local Sichuan peppercorns with sweet steamed milk for a unique flavor adventure.", "name": "Geo-Bookstore Coffee", "transport": "About an 8-minute walk from Exit A of Yushuang Road Station, Metro Line 4"}, {"address": "No. 4 Jianshe South Branch Road, Chenghua District, Chengdu", "feature": "\u2b50 4.6 stars | A lush, plant-themed cafe located at the edge of Eastern Suburb Memory. Filled with tropical plants and wooden furniture, it creates a relaxing urban oasis vibe. It serves a highly creative \u0027Thai Lemongrass Chicken Waffle Brunch\u0027 featuring crisp-outside, soft-inside waffles drizzled with a sweet and tangy chili sauce. Pair it with a \u0027Cold Brew Osmanthus Latte\u0027 for a refreshing, floral, and smooth treat.", "name": "Wilderness Coffee", "transport": "About a 7-minute walk from Exit A of Dongjiao Memory Station, Metro Line 8"}, {"address": "No. 55 Zhimin East Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.3 stars | A poetic and culturally rich artsy cafe near Jiuyan Bridge, featuring warm decor filled with floral arrangements. The \u0027French Caramel Toast Platter\u0027 features thick-cut toast seared golden brown and coated in caramel, offering a crispy exterior and cloud-soft interior. Paired with a sun-dried pour-over coffee carrying hints of tart blueberry, it\u0027s the perfect choice for a leisurely Chengdu afternoon brunch.", "name": "White Night Garden Coffee", "transport": "About a 10-minute walk from Exit C of Dongmen Bridge Station, Metro Line 2"}, {"address": "No. 94 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.5 stars | A trendy indie cafe housed in a renovated factory area behind the 339 TV Tower, renowned for its delicate single-origin pour-overs and low-sugar artisanal brunch. The signature \u0027All-Day Classic European Breakfast\u0027 includes German sausage, roasted tomatoes, and rich scrambled eggs\u2014hearty and well-balanced. Their exclusive \u0027Tangerine Peel Oat Latte\u0027 subtly infuses sweet dried tangerine peel notes into rich oat milk for a warm, smooth taste.", "name": "Floating Life Coffee", "transport": "About a 12-minute walk from Exit 2 of Second People\u0027s Hospital Station, Metro Line 3"}, {"address": "No. 1 Shuijing Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | A bakery cafe tucked in a quiet alley next to Jiuyan Bridge Bar Street, freshly baking sourdough bread and Japanese croissants daily. The \u0027Basque Cheesecake \u0026 Pour-Over Set\u0027 is immensely popular, offering melt-in-your-mouth cheesecake rich in cream and lightly caramelized notes. For brunch, the \u0027Souffl\u00e9 Omelet Croissant\u0027 features a plush, fluffy filling; paired with a light-roast Yirgacheffe, bright fruity notes keep the meal refreshing and well-balanced.", "name": "Slow Garden Bakery \u0026 Coffee", "transport": "About an 8-minute walk from Exit D of Dongmen Bridge Station, Metro Line 2"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "Jiuyanqiao Music Square, Jinjiang Riverfront Park, Wuhou District, Chengdu City", "feature": "\u2b50 4.6 stars | Located at the heart of Jiuyanqiao Bar Street, this is one of Chengdu\u0027s most iconic music bistros. Here, you can enjoy creative Sichuan fusion cuisine and signature cocktails\u2014such as spicy and refreshing tender beef with crispy chili peppers, and unique drinks infused with Zhuyeqing green tea\u2014alongside top-tier live music performances. Crispy-on-the-outside, tender-on-the-inside bar snacks complement the charmingly tipsy vibe, making it a huge hit among young tourists and local trendsetters.", "name": "Lotus Mansion Lounge \u0026 Bistro", "transport": "Metro Line 2 Niuwangmiao Station Exit A, approx. 15 mins walk"}, {"address": "No. 68 Binjiang East Road, Jinjiang District, Chengdu City", "feature": "\u2b50 4.7 stars | In Chengdu dialect, \u0027Erma\u0027 means pleasantly tipsy. This spot is the pioneer bistro combining open-air bar vibes with local street food. Signature drinks like \u0027Rainbow Wine\u0027 and \u0027Dizzy Tea\u0027 blend traditional Chinese rice wine with tea for a smooth, sweet finish. Paired with dishes like \u0027Western Sichuan Nine-Bowl Feast\u0027 and spicy Mao Xue Wang, the flavors are numbingly spicy, fresh, and layered. Front-row river views allow guests to sip fruit wine while taking in the night beauty of the Jinjiang River.", "name": "Erma Pub (Jiuyanqiao Branch)", "transport": "Metro Line 2 Niuwangmiao Station Exit H1, approx. 12 mins walk"}, {"address": "No. 1 Longzhou Road, Jinjiang District, Chengdu City", "feature": "\u2b50 4.5 stars | Combining Liangshan Xichang\u0027s signature giant bamboo skewer BBQ with a stylish bistro setting, this is a hugely popular regional eatery near Jiuyanqiao. The signature miniature pig roast features crispy skin, juicy tender meat, and sizzling fat grilled over open charcoal, served with custom spicy dipping powder for a chewy, non-greasy bite. Offering a variety of local craft beers, pairing grilled meat with cold drinks creates a bold, authentic Western Sichuan atmosphere.", "name": "Zuixichang BBQ \u0026 Bistro", "transport": "Metro Line 2 Niuwangmiao Station or Line 6 Shunjiang Road Station, approx. 10 mins walk"}, {"address": "Inside Eastern Suburb Memory Park, Zhongche Tong Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.6 stars | Located inside the Eastern Suburb Memory industrial creative park, this venue seamlessly blends American industrial style with local Sichuan bistro culture. It boasts a massive self-serve wall of drinks and unique American-Sichuan fusion dishes, such as spicy black pepper beef pizza and crispy fried chicken. The pizza crust is crispy outside, soft inside, infused with subtle wheat aroma and the pleasant numbness of Sichuan peppercorns. Grooving to vintage DJ beats at night, it\u0027s a favorite hotspot for hipsters and foreign visitors.", "name": "COMMUNE Music Bistro (Dongjiao Jiyi)", "transport": "Metro Line 8 Dongjiao Jiyi Station Exit B, approx. 5 mins walk"}, {"address": "Inside Eastern Suburb Memory Park, No. 4 Jianshe South Branch Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.4 stars | A minimalist local-cuisine bistro inside Eastern Suburb Memory, specializing in refined, modern reinterpretations of classic Sichuan dishes. The signature Green Peppercorn Black Pork Ribs are tender and juicy, unleashing delicate citrusy numbness layer by layer. Pair it with the custom \u0027Jincheng Red Plum\u0027 fruit wine to refresh the palate. Converted from an old factory building, the artistic atmosphere makes it extremely popular among photography lovers and refined foodies.", "name": "Chengdu Story Creative Sichuan Bistro", "transport": "Metro Line 8 Dongjiao Jiyi Station Exit F, approx. 6 mins walk"}, {"address": "No. 48 Wangping Riverside Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.8 stars | Situated near the West Pearl Tower and Wangping Street, this late-night eatery specializes in Sichuan Tapas (small tapas-style bowls) and craft cocktails. The classic Numbing Spicy Chicken Tongues are crispy outside, tender inside, and pleasantly spicy without burning. The braised pig intestine pot is rich, melt-in-your-mouth tender, and aromatic. Small, delicately plated portions allow diners to sample a wide variety of local specialties at once. Paired with local sweet osmanthus wine, it delivers a smooth, delightful taste highly praised by local youth and tourists alike.", "name": "Tangguo Sichuan Tapas \u0026 Bistro", "transport": "Metro Line 4 Yushuang Road Station Exit A, approx. 10 mins walk"}, {"address": "Inside Sichuan Radio and TV Tower, No. 94 Mengzhuiwan Street, Chenghua District, Chengdu City", "feature": "\u2b50 4.3 stars | A scenic high-altitude bistro located inside the Sichuan Radio and Television Tower (West Pearl Tower), offering panoramic views of Chengdu and the Jinjiang nightscape from 218 meters up. It features fine French dining infused with local Sichuan flavors alongside handcrafted cocktails. The slow-cooked Sichuan peppercorn beef short ribs are melt-in-your-mouth tender with a mild, aromatic peppercorn accent. Enjoying exquisite flavors and a romantic atmosphere in a revolving tower is a quintessential experience for travelers.", "name": "339 Revolving Restaurant \u0026 Lounge Bar", "transport": "Metro Line 3/4 Second People\u0027s Hospital Station or Line 4 Yushuang Road Station, approx. 12 mins walk"}, {"address": "No. 96 Mengzhuiwan Riverside Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.5 stars | Situated next to the big locust tree along the Mengzhuiwan riverbank below the TV Tower, this place blends classic Chengdu street vibrancy with modern bistro charm. Signature dishes like cold-pot skewers and spicy dry-pot bullfrog feature firm, springy meat infused deeply with spicy, numbing broth. Paired with house-special rice wine and live folk music performances, it creates a magical blend of local market soul and modern chic, highly recommended by locals and travelers alike.", "name": "Dahuaishu Music Bistro", "transport": "Metro Line 4 Yushuang Road Station Exit A, approx. 11 mins walk"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Dongjiao Memory Park, No. 69 Zhongxing Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.7 Stars | The signature Tibetan tea soup base is sweet, rich, and mellow. Paired with fresh wild mushrooms and handcrafted plant-based meatballs, every bite absorbs the delicate tea aroma and rich broth, offering a smooth, tender texture with rich layers of flavor. The restaurant features a serene, Zen-inspired atmosphere highly praised by both tourists and local plant-based food lovers. It is the top choice for experiencing innovative Sichuan vegetarian hotpot.", "name": "A Leaf A World Tibetan Tea Vegetarian Hotpot (Dongjiao Memory Branch)", "transport": "Take Metro Line 8 to Dongjiao Memory Station, Exit F, and walk for about 5 minutes."}, {"address": "No. 54-2 Jianshe Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.5 Stars | Offers dozens of delicate vegetarian stir-fries, steamed dim sum, and handmade noodles. The vegetarian Twice-Cooked Pork and Mapo Tofu have remarkably authentic textures\u2014crispy on the outside, tender inside, spicy, numb, and savory\u2014rivaling real meat dishes. Its high value-for-money and abundant choices keep it constantly bustling, making it a favorite among students and longtime Chengdu locals.", "name": "Sumanxiang Vegetarian Buffet (Jianshe Road Branch)", "transport": "Take Metro Line 6 to Jianshe North Road Station, Exit A, and walk for about 8 minutes."}, {"address": "No. 1-3 Wangjiang Road, Wuhou District, Chengdu City", "feature": "\u2b50 4.6 Stars | Located right next to Jiuyan Bridge and Wangjianglou Park, this restaurant specializes in light, nourishing, and exquisite vegetarian cuisine. Highly recommended is the \u0027Bamboo Fungus and Matsutake Mushroom Soup,\u0027 which boasts a sweet, savory broth and juicy, crisp bamboo fungus soaked in soup. The elegant, classical decor provides a tranquil escape amidst the bustling city, making it a perfect spot to relax after exploring Jiuyan Bridge.", "name": "Qingxin Vegetarian \u0026 Zen Tea House (Wangjiang Branch)", "transport": "Take Metro Line 19 or Line 6 to Sanguantang Station, Exit B, and walk for about 10 minutes."}, {"address": "No. 8 Siguan Road, Jinjiang District, Chengdu City", "feature": "\u2b50 4.4 Stars | A hidden vegetarian gem situated along the Jinjiang River. The specialty dish, \u0027Black Pepper Vegetarian Steak,\u0027 is crafted from soy products and monkey head mushrooms, delivering a firm, juicy texture paired with a rich, savory sauce. Blending traditional tea culture with plant-based dining, its river-view window seats offer a lovely night view of Jiuyan Bridge, making it very popular among young hipsters and couples.", "name": "Miming Hall Vegetarian Zen Tea (Jiuyanqiao Branch)", "transport": "Take Metro Line 2 to Niuwangmiao Station, Exit H, and walk for about 12 minutes."}, {"address": "339 Joy City Shopping Center, No. 94 Mengzhuiwan Street, Chenghua District, Chengdu City", "feature": "\u2b50 4.3 Stars | Located near the Sichuan Radio and TV Tower 339 commercial area, focusing on creative fusion vegetarian cuisine with international flavors. The signature \u0027Thai Spicy and Sour Vegetarian Seafood Soup\u0027 is zesty and appetizing, featuring bouncy, flavorful plant-based shrimp. Its stylish, bright modern decor and innovative dishes attract many young tourists who love taking photos and enjoying healthy food.", "name": "Oz Vegetarian Restaurant (TV Tower Branch)", "transport": "Take Metro Line 4 to Second People\u0027s Hospital Station, Exit E, and walk for about 12 minutes or transfer to a bus."}, {"address": "No. 12 Mengzhuiwan Cross Street, Chenghua District, Chengdu City", "feature": "\u2b50 4.2 Stars | A highly popular street-side vegetarian noodle shop near the TV Tower. The signature \u0027Vegetarian Dan Dan Noodles\u0027 uses handmade chewy high-gluten noodles tossed with a special plant-based meat sauce and rich sesame paste\u2014springy, aromatic, pleasantly spicy, and refreshing. Reasonable prices and authentic Sichuan flavors make it a must-visit spot for local office workers and tourists looking to experience Chengdu noodle culture.", "name": "Zen Vegetarian Noodle House (Mengzhuiwan Branch)", "transport": "Take Metro Line 3 or Line 4 to Chunxi Road Station, transfer to a bus to Mengzhuiwan Street Stop, and walk for about 3 minutes."}, {"address": "No. 160 Jianshe South Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.5 Stars | Emphasizing farm-to-table organic ingredients, the signature \u0027Truffle and Wild Mushroom Fried Rice\u0027 features distinct, fragrant grains of rice, delivering a rich truffle aroma and juicy mushrooms with every crisp, non-greasy bite. Situated on the edge of an industrial-style arts zone, the restaurant seamlessly blends art with healthy dining, winning the hearts of art enthusiasts and families alike.", "name": "Shuxinfang Organic Vegetarian (Dongjiao Branch)", "transport": "Take Metro Line 8 to Dongjiao Memory Station, Exit B, and walk for about 6 minutes."}, {"address": "No. 18 Shuijing Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.3 Stars | Located near Jiuyanqiao Bar Street, offering authentic home-style Sichuan vegetarian dishes. The \u0027Spicy Vegetarian Intestines\u0027 is highly recommended\u2014made from gluten and mushrooms, fried to a crisp exterior and soft interior, then stir-fried to unleash intense spicy and numb flavors with a great chewy texture. Affordable prices and authentic flavors make it a favorite among local foodies and travelers searching for authentic local bites.", "name": "Fuyuan Vegetarian Bistro (Jinjiang Branch)", "transport": "Take Metro Line 2 to Dongmen Bridge Station, Exit D1, and walk for about 8 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 118 Wangping Street, Chenghua District, Chengdu (Near Jinjiang TV Tower)", "feature": "\u2b50 4.6 Stars | Danhonggao (egg-baked cake) is Chengdu\u0027s most iconic grab-and-go sweet snack. Griddled from flour, eggs, and honey, the edges are crispy like a crepe while the center remains soft and spongey like a cake. Heji offers a variety of classic and inventive fillings, such as \u0027savory minced pork with whipped cream\u0027 or \u0027spicy beef with pork floss.\u0027 Crispy on the outside, soft on the inside, and boasting an addictive sweet-and-savory contrast, it\u0027s the ultimate palm-sized street food while exploring the city.", "name": "Heji Danhonggao (Egg-Baked Cakes)", "transport": "Take Metro Line 4 to Taisheng South Road Station, then walk about 10 minutes to Wangping Street Commercial District."}, {"address": "No. 2-8 Wangping Street, Chenghua District, Chengdu", "feature": "\u2b50 4.7 Stars | Yantaipo Guokui is one of the most popular street snacks with long queues in Chengdu markets. Made to order, the dough is deep-fried and then baked until golden, crispy, and delightfully flaky. The top picks are the \u0027Three Shreds Guokui\u0027 and \u0027Beef Guokui,\u0027 packed with shredded bamboo shoots or beef tossed in chili oil, Sichuan pepper, and vinegar. Each crunchy bite is bursting with juicy, spicy, and tangy flavors, making it a layered delight loved by tourists and local youth alike.", "name": "Yantaipo Crispy Meat Pie (Guokui)", "transport": "Take Metro Line 4 to Second People\u0027s Hospital Station, then walk about 8 minutes to the Wangping Riverside section."}, {"address": "Wangping Riverside Night Market Stall, Chenghua District, Chengdu (Next to 339 TV Tower)", "feature": "\u2b50 4.5 Stars | Also known as \u0027Swan Eggs,\u0027 Tangyou Guozi is a time-honored traditional Chengdu street food. Dengji slowly deep-fries glutinous rice dough balls while caramelizing them with rich brown sugar, then skewers and sprinkles them with toasted white sesame seeds. The outer shell is crispy and coated in thick syrup, while the inside remains chewy and soft. Perfectly sweet without being cloying, it is a must-try street treat when visiting Wangping Street near the TV Tower.", "name": "Dengji Sugar Oil Berries (Tangyou Guozi)", "transport": "Take Metro Line 3 or 4 to Second People\u0027s Hospital Station, then walk along the Fu River towar
