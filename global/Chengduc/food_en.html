ds the TV Tower for about 12 minutes."}, {"address": "No. 133 Wangping Street, Chenghua District, Chengdu", "feature": "\u2b50 4.8 Stars | Enjoying a bowl of ice jelly after spicy street food is the ultimate Chengdu luxury. Tangguoguo hand-rubs natural nicandra seeds to make ice jelly packed with tiny bubbles and a silky, jelly-like texture. The signature \u0027Three Fresh Ice Jelly\u0027 features fermented sweet rice, small glutinous rice balls, and lemon slices for a cooling, sweet-and-sour taste with a hint of rice wine. Alternatively, the \u0027Deluxe Ice Jelly\u0027 comes loaded with brown sugar, hawthorn, raisins, and crushed nuts\u2014combining silky and crunchy textures, making it the #1 spicy-food palatability reliever.", "name": "Tangguoguo Handmade Ice Jelly", "transport": "Take Metro Line 4 to Taisheng South Road Station, then walk about 9 minutes."}, {"address": "Snack Market Area, Jiuyan Bridge Bar Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.4 Stars | Located at the junction of Jiuyan Bridge Bar Street and the night market, Sister Gao\u0027s grilled pig brains are an indispensable bold-flavored street delicacy in Chengdu\u0027s nightlife. Pig brains are slow-grilled over charcoal in foil boxes with secret spicy chili oil, fermented black beans, fish mint, crushed peanuts, and generous scallions. The brains have a velvety texture akin to silken tofu that melts in your mouth with zero gaminic odor. Rich, savory, and fiery, it is the perfect late-night snack to pair with drinks while soaking in the vibrant atmosphere of Jiuyan Bridge Night Market.", "name": "Jiuyan Bridge Sister Gao Grilled Pig Brains", "transport": "Take Metro Line 2 to Niuwangmiao Station, then transfer to a bus or walk about 12 minutes to the head of Jiuyan Bridge."}, {"address": "No. 25 Wangping Street, Chenghua District, Chengdu", "feature": "\u2b50 4.6 Stars | Originating from Leshan, Bobo Chicken (cold skewered ingredients) is one of Chengdu\u0027s most popular street snacks for strolls. Skewers of cooked chicken, wood ear fungus, lotus root slices, potato slices, and more are soaked in custom chili oil or green Sichuan pepper broth. Glowing red chili oil studded with white sesame seeds coats each skewer, making every bite spicy, numbing, savory, and crisp. Convenient to grab and eat on the go, it\u0027s a top choice while exploring Wangping Street and Jiuyan Bridge.", "name": "Ye Po Po Skewered Chicken in Chili Oil (Bobo Chicken)", "transport": "Take Metro Line 4 to Second People\u0027s Hospital Station, then walk about 10 minutes."}, {"address": "No. 4 Jianshe South Branch Road, Chenghua District, Chengdu (Inside the Central Creative Market, Eastern Suburb Memory Park)", "feature": "\u2b50 4.5 Stars | Located in a market stall within the Eastern Suburb Memory Creative Park, this spot specializes in traditional rice-based cold cakes (Lianggao) and handmade ice jelly. The Lianggao has a dense yet silky texture with a subtle rice aroma, drenched in thick, slow-cooked traditional brown sugar syrup that melts in your mouth refreshing and sweet. Paired with crispy deep-fried dough twists (sanzi) or cold noodles, the sweet-and-savory contrast creates a unique treat\u2014a classic refreshing stroll snack for hipsters and tourists snapping photos.", "name": "Dongjiao Jiyi Old Chengdu Ice Jelly \u0026 Cold Rice Cake", "transport": "Take Metro Line 8 to Dongjiao Jiyi Station Exit F, then walk about 5 minutes into the park."}, {"address": "Snack Street, 339 TV Tower Commercial District, Shuanglin Road, Chenghua District, Chengdu", "feature": "\u2b50 4.7 Stars | Rabbit head is the ultimate local delicacy and signature street food of Chengdu. Braised for hours with dozens of spices, it is then soaked in custom spicy chili oil or five-spice brine. Eaten hands-on, the meat is firm yet tender, while the marrow and brain absorb the intense spicy sauce. Fiery, fragrant, and deeply savory, the experience becomes more addictive with every bite. It is a must-try local experience around Jiuyan Bridge Night Market and the TV Tower for anyone wanting to dive into Chengdu\u0027s iconic \u0027rabbit-head nibbling\u0027 culture.", "name": "Shuangliu Laoma Rabbit Head", "transport": "Take Metro Line 4 to Yushuang Road Station, then walk about 10 minutes to the side of 339 TV Tower."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Jiuyan Bridge, Dongjiao Memory, and the TV Tower"}, "kuanzhai_tianfu": {"categories": {"cat_1": {"items": [{"address": "Inside People\u0027s Park, No. 12 Shaocheng Road, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Founded in 1923, this century-old teahouse sits by the lake inside People\u0027s Park. It is the ultimate sanctuary to experience Chengdu\u0027s famous slow-paced life and traditional ear-cleaning culture. Its classic Sichuan teas and snacks are local daily favorites. Signature lidded teacup drinks (Gaiwan Tea) like Zhuyeqing and Mengding Piaoxue offer a fresh, fragrant tea liquor with a sweet lingering aftertaste. Pair them with made-to-order, soft, sweet Lai Tangyuan (glutinous rice balls), brown sugar Baba cakes, or thin-skinned, flavorful Zhong dumplings that balance sweet, savory, and gentle spice. Tourists and locals alike sit side-by-side on bamboo chairs at wooden tables, sipping tea and savoring nostalgic treats while soaking in the authentic, lively spirit of old Chengdu.", "name": "Heming Tea House", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station, Exit B, and walk for about 3 minutes."}, {"address": "No. 28 Shaocheng Road, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | As the undisputed birthplace of Mapo Tofu, this century-old brand is an absolute pilgrimage site for Sichuan cuisine lovers. The signature Chen Mapo Tofu features high-quality tender tofu stir-fried to order with house-made chili bean paste, minced beef, and vibrant Hanyuan Sichuan peppercorns. Served bubbling hot in a clay pot, the tofu melts in your mouth while the crispy beef adds a savory chew. It perfectly embodies the eight classic elements of Sichuan cooking: numb, spicy, hot, fragrant, crispy, tender, fresh, and lively. The numbing sensation explodes on your tongue, making it impossibly addictive when paired with steaming white rice. The traditional Chinese decor adds a historic charm that complements this culinary masterpiece.", "name": "Chen Mapo Tofu (Shaocheng Road Branch)", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station, Exit D1, and walk for about 5 minutes."}, {"address": "No. 62 Citang Street, Qingyang District, Chengdu", "feature": "\u2b50 4.2 stars | A revered historic Chinese snack brand dating back to the Guangxu Emperor era, famous for its pure pork dumplings. Unlike ordinary dumplings, Zhong Dumplings contain no added vegetables\u2014just plump, firm, juicy pork filling. The soul of the dish lies in its signature seasoning: fragrant chili oil that isn\u0027t overly harsh, paired with a boiled secret sweetened soy sauce and crushed garlic poured over piping hot dumplings. One bite reveals a springy wrapper with a rich blend of subtle sweetness, garlic, and mild spice\u2014a beloved nostalgic comfort food for generations of Chengdu locals.", "name": "Zhong Dumplings (Citang Street Branch)", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station, Exit B, and walk for about 2 minutes."}, {"address": "No. 54 Citang Street, Qingyang District, Chengdu", "feature": "\u2b50 4.3 stars | Located next to People\u0027s Park, this famous noodle house is renowned for serving authentic old-Chengdu street food. The signature Sweet Water Noodles (Tianshui Noodles) feature thick, chopstick-sized noodles that are wonderfully chewy and bouncy, coated in a rich mixture of sweetened soy sauce, sesame paste, chili oil, and crushed peanuts for a sweet, spicy, and nutty kick. Their Dandan Noodles are silky smooth with savory minced pork topping. Other favorites like Bobo Chicken (skewers in spicy broth) and sweet/savory tofu pudding make it easy to sample the best of traditional Chengdu noodles under one roof.", "name": "Xiaomingtang Dandan \u0026 Tianshui Noodles (Citang Street Branch)", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station, Exit B, and walk for about 2 minutes."}, {"address": "No. 16 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | Nestled in the historic Kuanzhai Alley (Wide and Narrow Alleys), this landmark restaurant beautifully combines traditional Chengdu courtyard architecture with refined Sichuan dining. The venue retains historic grey brick and dark tile aesthetics, featuring live Sichuan Opera face-changing and traditional tea ceremony performances. Signature dishes include Mao Xue Wang (spicy duck blood and tripe stew) with a rich, fiery broth, and authentic Kung Pao Chicken with its tender meat, crunchy peanuts, and perfectly balanced sweet-savory glaze. Creative pastries like the calligraphy brush pastry are both charming and delicious, making this cultural feast popular with travelers worldwide.", "name": "Chengdu Impression (Zhai Alley Branch)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station, Exit B, and walk for about 3 minutes."}, {"address": "No. 28 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | Located inside Zhai Alley, this premier cultural theme hotpot restaurant is famous for its breathtaking giant dragon sculpture and grand Chinese palace-style decor. The hotpot broth uses a traditional pure tallow base that is rich, aromatic, intensely spicy, and stays flavorful without turning bitter. Signature dishes like Dragon Boat Pork Tongue, Goose Intestines in Ice Spheres, and Handmade Shrimp Paste feature ultra-fresh ingredients served like works of art. A brief swish of crunchy goose intestines in the spicy broth offers incredible satisfaction. Guests can also enjoy live Sichuan Opera face-changing performances, offering a feast for both eyes and palate.", "name": "Xiaolong Fandajiang Hotpot (Zhai Alley Branch)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station, Exit B, and walk for about 4 minutes."}, {"address": "No. 27 Zongfu Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.1 stars | Founded in 1894, this century-old sweet dumpling institution is located near the Tianfu Square shopping district. Lai Tangyuan is famed for four hallmarks: holding shape without disintegrating, thin chewy skin, generous filling, and a silky, non-sticky texture. Biting into the classic black sesame or lard red bean paste dumplings releases a rich, aromatic filling that flows smoothly. Alongside their signature tangyuan, they also serve Zhong dumplings, cold jelly noodles, and other local snacks, making it a great stop to experience Chengdu\u0027s traditional desserts.", "name": "Lai Tangyuan (Zongfu Road Branch)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station and walk for about 8 minutes."}, {"address": "No. 64 Huaxing Front Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.3 stars | Founded in 1925, this historic establishment specializes in traditional Sichuan braised delicacies and regional dishes, taking its name from a famous line by poet Du Fu. Renowned for its master braising techniques, its master stock has developed deep, complex spice aromas over decades. Signature items like braised duck wings, braised pig feet, and braised pork ribs boast a glossy reddish sheen, tender fall-off-the-bone meat, and a rich spice profile with a hint of numbing spice. Additionally, their freshly steamed braised pork buns sold at the front counter feature fluffy dough and savory, juicy fillings, drawing daily crowds.", "name": "Pansunshi Braised Food (Huaxing Street Branch)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station and walk for about 10 minutes."}], "name": "Local Traditional Legendary Eateries"}, "cat_2": {"items": [{"address": "No. 16 Jing Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 Stars | This globally renowned specialty coffee brand seamlessly blends traditional western Sichuan courtyard architecture with modern minimalist design. Tourists love sitting in the quaint courtyard, sipping on the signature Spanish Latte\u2014rich espresso mixed with sweet condensed milk and velvety microfoam, smooth on the palate with a unique caramel aroma. Paired with a freshly baked croissant that\u0027s crispy on the outside and soft inside, enjoy the ultimate brunch experience bridging the old and new beneath towering brick walls.", "name": "% Arabica (Chengdu Kuanzhai Alley)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 300 meters."}, {"address": "No. 9 Kuixinglou Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 Stars | As the pioneer of American vintage industrial-style cafes in Chengdu, UID Cafe is a favorite among coffee enthusiasts and hipsters. With strict bean selection, their pour-over single-origin options are remarkably diverse, offering bright acidity and a lingering sweet finish. Popular brunch items include freshly grilled American burgers and custom Smoked Bacon Eggs Benedict\u2014buttery English muffins topped with runny poached eggs and silky Hollandaise sauce create rich layers of flavor, making it a can\u0027t-miss landmark in the Kuixinglou neighborhood.", "name": "UID Cafe (Kuixinglou Flagship)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 600 meters."}, {"address": "No. 37 Jixiang Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 Stars | Tucked away on vibrant Jixiang Street near Kuanzhai Alley, Pause Coffee draws crowds of young locals with its minimalist white tones and warm wooden accents. Its signature specialty, the \u0027Sichuan Peppercorn Latte\u0027, ingeniously fuses subtle numbing peppercorn aroma with creamy milk coffee. The first sip brings rich milk foam, followed by a unique herbal spice, creating a novel yet surprisingly harmonious taste. Paired with freshly baked scones\u2014crispy outside, fluffy inside\u2014and homemade jam, it highlights Chengdu\u0027s distinctively relaxed brunch culture.", "name": "Pause Coffee (Jixiang Street)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 500 meters."}, {"address": "No. 30 Zhai Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.3 Stars | A veteran artsy cafe nestled among historical architecture in Zhai Alley, preserving original Chengdu tile roofs, gray brick, and wooden doors. Their Yunnan pour-over coffee offers a smooth body with nutty and dark chocolate notes. A must-order brunch item is the signature Avocado \u0026 Smoked Chicken Sandwich\u2014golden toasted bread stuffed with creamy avocado and tender chicken. Sitting in the lush, green courtyard while dining captures the quintessential charm of Chengdu\u0027s slow-paced lifestyle where past meets present.", "name": "Wadang Maitian Cafe", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 200 meters."}, {"address": "No. 1 Citang Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 Stars | Located right next to People\u0027s Park and the Citang Street Historic District, this corner specialty cafe offers quality coffee with great value. The signature \u0027Iced Shaken Oat Milk Latte\u0027 uses house-roasted dark beans, blending seamlessly with oat milk for a nutty, malty flavor and silky texture. Served alongside a daily limited French Croissant Brunch Platter\u2014crispy, flaky, and buttery\u2014it attracts many visitors who come to savor modern coffee after exploring traditional teahouses in People\u0027s Park.", "name": "1 Gram Coffee (People\u0027s Park)", "transport": "Take Metro Line 2 to People\u0027s Park Station (Exit A), walk about 200 meters."}, {"address": "No. 16 Kuixinglou Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 Stars | A iconic Instagram-worthy brunch spot in the Kuixinglou area, specializing in all-day gourmet brunch and specialty coffee. The must-try item is the signature \u0027Australian Wagyu Brunch Platter\u0027, featuring grilled Wagyu sausages, fluffy scrambled eggs, seared button mushrooms, and French garlic toast\u2014hearty, savory, and satisfying. Paired with a Cold Brew White Peach Oolong Coffee, the crisp fruity notes perfectly balance the richness of the meat, making it hugely popular with young travelers and locals alike.", "name": "Nuomi Brunch \u0026 Coffee", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 550 meters."}, {"address": "Underground Commercial Street, Tianfu Square, No. 8 Xiyu Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 Stars | Located in the heart of Chengdu at the Tianfu Square hub, famous for its sleek, chic style and premium beans. The signature \u0027Coconut Dirty\u0027 extracts hot espresso directly over chilled thick coconut milk, creating distinct layers. The first sip delivers rich, bold espresso, followed by cool, sweet coconut flavors\u2014a thrilling contrast of temperatures and textures. Paired with freshly made fluffy American pancakes, rich in egg flavor, it\u0027s a popular morning power boost near Tianfu Square.", "name": "SING COFFEE (Tianfu Square)", "transport": "Take Metro Line 1 or 2 to Tianfu Square Station; direct access to the underground commercial area upon exit."}, {"address": "No. 32 Zhai Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 Stars | Founded by famous poet Zhai Yongming, this iconic poetic-cultural cafe is located in the heart of Zhai Alley. Steeped in a rich literary and artistic atmosphere, it has long been a gathering spot for scholars and writers. Enjoy their signature pour-over single-origin coffee paired with house-made Tiramisu, which melts in your mouth with rich mascarpone cheese and a subtle kick of coffee liqueur. Reading a book or soaking up sunshine under the historic courtyard skylight is the best way to soak in Kuanzhai Alley\u0027s deep cultural roots over brunch.", "name": "White Night Cafe \u0026 Bar", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), walk about 220 meters."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 6 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Tucked deep inside Kuan Alley, this standalone Sichuan-style courtyard bistro seamlessly blends classical western Sichuan architecture with modern refined dining. Signature dishes like \u0027Spicy Crab\u0027 and \u0027Camphor Tea Duck\u0027 offer rich layers of taste\u2014the duck features crispy skin and juicy meat infused with subtle notes of camphor wood and tea. At night, it transforms into an atmospheric bar serving craft cocktails infused with Sichuan peppercorn and Zhuyeqing green tea, making it a favorite for romantic tourists and trendy foodies.", "name": "Taste \u0026 Savor", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 32 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | Crafted by a master chef of Sichuan cuisine, this traditional refined local restaurant is set in a charming, antique courtyard in Zhai Alley. It specializes in classic Sichuan dishes such as \u0027Braised Jiepai Rabbit\u0027 and \u0027Handmade Steamed Pork with Rice Flour\u0027\u2014tender, flavorful, spicy, and melt-in-your-mouth. Lush greenery, bamboo chairs, and wooden tables fill the courtyard, capturing the laid-back rhythm of old Chengdu life. An exceptional spot to experience authentic Sichuan culinary roots and courtyard culture.", "name": "Xuanxuan Courtyard", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 5 minutes."}, {"address": "No. 85 Citang Street, Qingyang District, Chengdu (Near People\u0027s Park)", "feature": "\u2b50 4.4 stars | Located near People\u0027s Park, this century-old time-honored Sichuan restaurant was founded by revolutionary martyr Che Yaoxian. Rich in historical ambiance, its signature \u0027Yuxiang Shredded Pork\u0027 offers a harmonious mix of sweet, sour, savory, and spicy flavors with tender pork strips, while the \u0027Kung Pao Chicken\u0027 features succulent meat paired with crunchy peanuts. Affordable yet steeped in history, it is beloved by both local regulars and visiting tourists.", "name": "Nuli Can Restaurant", "transport": "Take Metro Line 2 to People\u0027s Park Station (Exit A), then walk for about 2 minutes."}, {"address": "No. 18 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | A trendy bistro blending Chinese chic style with modern Sichuan fusion, offering an elegant, tipsy nightlife vibe. The signature \u0027Green Peppercorn Spicy Fish\u0027 uses fresh grass carp, yielding tender, silky flesh elevated by the vibrant aroma and numbing tingle of green peppercorns. Paired with house-blended \u0027Chengdu Whiskey\u0027 and artisanal fruit wines, it perfectly fuses spicy flavors with sophisticated drinking, making it a popular hotspot for young crowds.", "name": "Zui Xi Xiang Bistro", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 4 minutes."}, {"address": "No. 11 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | Tucked away in Kuan Alley, this traditional folk music bistro occupies a two-story wooden building brimming with classic Chinese nostalgic charm. It serves traditional Chengdu cuisine and robust \u0027Jianghu\u0027 dishes like \u0027Signature Spicy Shrimp\u0027 and \u0027Mao Xue Wang\u0027 (spicy blood curd dish), featuring rich ingredients with bold, aromatic heat that isn\u0027t overly dry. With live folk music performances in the evening, enjoying a pot of peach blossom wine along with delicious bar bites is a fantastic way to soak in Chengdu\u0027s cozy, slow-paced nightlife.", "name": "Lotus Lounge \u0026 Bistro", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 8 Xiyu Street, Qingyang District, Chengdu (Near Tianfu Square)", "feature": "\u2b50 4.3 stars | Located near Tianfu Square, this contemporary Sichuan bistro specializes in modern, refined interpretations of traditional Sichuan classics. Must-try dishes include \u0027Mapo Tofu with Wagyu\u0027 and \u0027Sichuan Pickled Vegetable Grilled Fish\u0027\u2014featuring tender, savory tofu and crispy fish enhanced by tangy, spicy pickles. The sleek, minimalist decor combined with an extensive drinks menu featuring Sichuan craft beers and fruit cocktails makes it a popular dining choice for both business gatherings and tourists near Tianfu Square.", "name": "Rong Rong Ji Bistro", "transport": "Take Metro Line 1 or Line 2 to Tianfu Square Station (Exit F), then walk for about 5 minutes."}, {"address": "No. 22 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Situated in Kuan Alley, this garden-style Sichuan restaurant boasts a serene, charming ambiance reflecting the grand residence style of historic western Sichuan nobility. The menu focuses on traditional high-end \u0027Official\u0027 Sichuan cuisine and local specialties, such as \u0027Consomm\u00e9 Cabbage\u0027\u2014crystal clear yet packed with umami\u2014and \u0027Dongpo Pork Knuckle,\u0027 tender enough to melt in your mouth without being greasy. With attentive service and exquisitely prepared dishes, it is ideal for food lovers seeking to appreciate the rich depth and elegant culture of authentic Sichuan cooking.", "name": "Kuan Ting Sichuan Restaurant", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 4 minutes."}, {"address": "No. 9 Shaocheng Road, Qingyang District, Chengdu (Near main entrance of People\u0027s Park)", "feature": "\u2b50 4.4 stars | A trendy local cuisine bistro near People\u0027s Park focusing on creative Sichuan fusion and modern bar experiences. Highlights include \u0027Crispy Spicy Chicken with Molecular Chili Caviar\u0027 and \u0027Drunken Hairy Crab\u0027\u2014the chicken is crispy on the outside, tender inside, and packed with fiery flavor, perfectly complemented by house-made plum wine that balances out the spice. Comfortable outdoor seating allows guests to enjoy delicious dishes while soaking in the relaxed lifestyle of the People\u0027s Park neighborhood.", "name": "Mo Fang Sichuan Bistro", "transport": "Take Metro Line 2 to People\u0027s Park Station (Exit B), then walk for about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 125 Changshun Upper Street, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | Featuring a unique Tibetan tea soup base with a subtle, refreshing sweetness. Cook fresh wild mushrooms and seasonal vegetables in the fragrant tea broth to absorb its delicate flavor\u2014unbelievably savory, fresh, and non-greasy. The decor is antique, warm, and serene, making it ideal for health-conscious foodies and travelers seeking layered flavors.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hotpot (Kuanzhai Alley Branch)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk about 300 meters."}, {"address": "No. 100 Changshun Middle Street, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | An elegant vegetarian restaurant themed around lotus culture, expertly transforming classic Sichuan flavors into meat-free delicacies. Their signature \u0027Black Pepper Veggie Steak\u0027 is crispy outside, tender inside, and served with a rich black pepper sauce that impresses even non-vegetarians.", "name": "Qingshui Hehua Vegetarian Art Restaurant (Kuanzhai Alley Branch)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk about 250 meters."}, {"address": "No. 189 Qingyang Main Street, Qingyang District, Chengdu (near Qingyang Palace \u0026 People\u0027s Park)", "feature": "\u2b50 4.6 stars | A long-standing, renowned refined vegetarian brand in Chengdu specializing in creative vegan dishes (egg-free and dairy-free). The popular \u0027Vegetarian Roast Duck\u0027 uses bean curd sheets baked to golden crispness, wrapped in thin pancakes with sweet bean sauce and scallions for a rich, delightfully textured bite.", "name": "Zaozishu Vegetarian Restaurant (Qingyang Branch)", "transport": "Take Chengdu Metro Line 5 to Qingyang Palace Station (Exit C), then walk about 400 meters."}, {"address": "Near the intersection of Citang Street and Shaocheng Road, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | A highly budget-friendly vegetarian buffet serving dozens of delicate plant-based dishes and Sichuan-style snacks daily. From fluffy steamed twisted rolls to spicy stir-fried konjac and refreshing wood ear mushroom salad, it offers vibrant flavors loved by locals and tourists alike.", "name": "Sumanxiang Vegetarian Buffet (People\u0027s Park Branch)", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station (Exit A), then walk about 200 meters."}, {"address": "Underground Commercial Street, Tianfu Square, No. 18 Dongyu Street, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | A serene dining space in the heart of Tianfu Square, known for Zen aesthetics and wholesome ingredients. The \u0027Kung Pao Veggie Dices\u0027 substitutes chicken with lion\u0027s mane mushroom\u2014chewy, flavorful, and paired with crunchy peanuts and a classic sweet, sour, spicy sauce that keeps you coming back for more.", "name": "Chanxinju Vegetarian Restaurant (Tianfu Square Branch)", "transport": "Take Chengdu Metro Line 1 or Line 2 directly to Tianfu Square Station."}, {"address": "No. 36 Xiaonan Street, Qingyang District, Chengdu", "feature": "\u2b50 4.3 stars | A charming spot reimagining classic Sichuan street food into vegetarian delights. The signature \u0027Vegetarian Sweet and Spicy Noodles\u0027 (Tian Shui Mian) feature thick, chewy noodles tossed in rich soy sauce, sesame paste, and chili oil for a delightfully addictive sweet-spicy taste. A perfect snack after strolling through People\u0027s Park!", "name": "Shusuxiangzhai Vegetarian Snacks (People\u0027s Park Branch)", "transport": "Take Chengdu Metro Line 2 to People\u0027s Park Station (Exit B), then walk about 500 meters."}, {"address": "No. 28 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Combining modern creative flair with plant-based cuisine, this trendy spot presents traditional Sichuan culinary elements with a twist. The \u0027Crispy Numb-Spicy Veggie Pork\u0027 is fried to golden perfection\u2014crunchy on the outside, tender inside, and sprinkled with green Sichuan pepper powder for a uniquely tingling, savory flavor popular with younger crowds.", "name": "Shuxin Shushi Cultural Vegetarian Restaurant (Kuanzhai Alley Branch)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit D), then walk about 150 meters."}, {"address": "No. 8 Xiyu Street, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | Serving traditional, temple-style vegetarian dishes prepared with ancient recipes that highlight natural flavors. The popular \u0027Claypot Tofu with Wild Mushrooms\u0027 simmers artisanal tofu with assorted wild mushrooms, allowing the silky-soft tofu to absorb every drop of the rich, savory broth.", "name": "Dayuantong Vegetarian Hall (Tianfu Square Branch)", "transport": "Take Chengdu Metro Line 1 or Line 2 to Tianfu Square Station (Exit F), then walk about 300 meters."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 18, Section 1, Renmin Middle Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 Stars | An iconic street food hit in Chengdu. These freshly made guokui (stuffed flatbreads) are baked and fried to achieve an insanely crispy outer crust that crackles with every bite. The most popular shredded bamboo shoot and beef filling is numbing, spicy, fresh, and savory. The unique texture contrast\u2014hot on the outside, cool on the inside\u2014drives tourists and locals crazy, drawing endless queues daily.", "name": "Yan Tai Po Guokui", "transport": "About an 8-minute walk from Tianfu Square Station on Metro Line 1 or Line 2"}, {"address": "No. 116 Changshun Upper Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 Stars | Egg pancakes (Danhonggao) are Chengdu\u0027s most classic traditional stroll snack. Freshly made in hot little copper pans, they feature a golden, slightly crispy edge and a center as soft as a marshmallow. With an incredible variety of fillings\u2014from classic pork floss with egg yolk, sesame peanut, and sweet cream to spicy beef\u2014the unique blend of sweet and savory flavors infused with rich milk and egg aromas makes it a soul-satisfying snack for all ages.", "name": "He Ji Egg Cake", "transport": "About a 5-minute walk from Kuanzhai Alley Station on Metro Line 4"}, {"address": "No. 130 Shiye Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 Stars | Originating from Leshan but perfected on the streets of Chengdu, this famous skewered delicacy features chicken, offal, potato slices, and black fungus steeped in custom chili-sesame or rattan pepper broth. The rich sesame aroma and spicy chili oil hit you first, followed by a burst of savory, numbing juices from the crisp ingredients. Served cool and refreshing, it\u2019s the perfect grab-and-go street food experience.", "name": "Ye Po Po Bo Bo Chicken", "transport": "About a 6-minute walk from Kuanzhai Alley Station on Metro Line 4"}, {"address": "No. 22 Kuan Alley, Qingyang District, Chengdu City (Inside Kuanzhai Alley Scenic Area)", "feature": "\u2b50 4.2 Stars | Iconic snacks representing the collective memory of Chengdu\u0027s traditional folk markets. \u0027San Da Pao\u0027 (Three Cannons) are sticky rice balls thrown against a metal tray with three loud bangs before landing in soybean powder; they are delightfully soft, chewy, and drizzled with sweet brown sugar syrup. \u0027Sugar Oil Fruit\u0027 are golden, hollow fried rice balls glazed with rich caramel and white sesame\u2014crispy on the outside, chewy on the inside, offering both visual entertainment and classic nostalgic flavor.", "name": "Sugar Oil Fruit \u0026 San Da Pao", "transport": "Direct access from Exit B of Kuanzhai Alley Station on Metro Line 4"}, {"address": "Section 1, Renmin Middle Road, near Tianfu Square area, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 Stars | A time-honored traditional Chinese bakery in Chengdu with queues perpetually wrapped around the block. Their signature salt-and-pepper walnut pastry (Taosu) melts in your mouth with a crispy, savory-sweet flavor and rich aroma. The Napoleon cake features clear layers, soft pastry, and light cream. Shelf-stable yet authentic, these walk-and-eat treats are everyday comfort foods for locals and must-buy street souvenirs for tourists.", "name": "Gong Ting Pastry Bakery", "transport": "About a 10-minute walk from Tianfu Square Station on Metro Line 1"}, {"address": "No. 32, Section 1, Renmin Middle Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.3 Stars | A century-old snack stall near Tianfu Square, famous for its thick, chewy \u0027Sweet Water Noodles\u0027 and silky \u0027Yellow Jelly Noodles\u0027. The sweet water noodles are intensely springy, tossed in thick soy sauce, sesame paste, minced garlic, and chili oil\u2014starting sweet before bursting with spicy and numbing flavors. The yellow jelly noodles are delicate and soft, with chili oil smoothly coating each bite for an addictively spicy kick.", "name": "Zhang Lao Wu Cold Noodles", "transport": "About a 7-minute walk from Tianfu Square Station on Metro Line 1 or Line 2"}, {"address": "No. 62 Citang Street, Qingyang District, Chengdu City (Next to the main entrance of People\u0027s Park)", "feature": "\u2b50 4.3 Stars | A famous traditional snack stall located next to People\u0027s Park. These pure pork dumplings feature thin wrappers and tender, savory fillings with a satisfying texture. The soul of the dish lies in its secret sauce made from special sweet aromatic soy sauce and blended chili oil. Sweet, spicy, and deeply aromatic, the clean pork flavor combined with rich sauce creates a delightful sensation\u2014a must-try historic taste after visiting People\u0027s Park.", "name": "Zhong Dumplings", "transport": "About a 2-minute walk from Exit B of People\u0027s Park Station on Metro Line 2"}, {"address": "No. 116-1 Changshun Upper Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 Stars | Chengdu\u0027s most daring yet authentic street food specialty. The spicy rabbit heads are slow-braised until tender, allowing the meat to easily pull off the bone. The meat is extremely tender and flavorful, with the brain and cheek meat absorbing the deep essence of red oil, Sichuan peppercorns, and aromatic spices. Numbing, spicy, fresh, and savory, it gets more addictive as you pick at it\u2014a wildly popular classic beer snack at Chengdu\u0027s night markets and street stalls.", "name": "Lao Ma Spicy Rabbit Head", "transport": "About a 5-minute walk from Kuanzhai Alley Station on Metro Line 4"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Kuanzhai Alley, People\u0027s Park, and Tianfu Square"}, "panda_wenshu": {"categories": {"cat_1": {"items": [{"address": "No. 39 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A century-old traditional noodle shop next to Wenshu Monastery in Chengdu, best known for its Sweet Water Noodles and Yellow Jelly (Huang Liangfen). The Sweet Water Noodles feature thick, springy noodles with an incredible chewy texture, coated in soy sauce, sugar syrup, Sichuan pepper, and chili oil. Every bite starts sweet, followed by a kick of heat and a burst of numb aromatics on the tongue; the Yellow Jelly is soft, silky, and rich in soybean flavor. Always packed with foodies and old Chengdu locals, it\u2019s a wonderful spot to experience traditional Chengdu street noodle culture.", "name": "Dongzikou Zhang Lao Er Liangfen", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 5 minutes."}, {"address": "No. 19 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | An extremely popular, queue-worthy traditional Sichuan crispy flatbread shop in the Wenshu Monastery shopping district. Freshly made and fried to order, the golden crust delivers a satisfying crunch with every bite, packed full of fillings like shredded beef with bamboo shoots, seasoned pig ears, or cold shredded vegetables. Soaked in aromatic spicy chili oil and Sichuan pepper powder, the fillings are savory, spicy, numbing, and juicy, creating a brilliant textural contrast with the crispy outer shell. Both locals and tourists are more than willing to line up for a taste.", "name": "Yan Tai Po Guokui", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 3 minutes."}, {"address": "No. 174 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A legendary time-honored pastry shop carrying on Qing Dynasty imperial baking techniques, adhering to traditional handmade methods for decades. Its signature Walnut Crisp (Taosu) is fragrant, crispy, melt-in-your-mouth tender, and rich in milky and sesame aromas. Their Napoleon cake and cold rice cakes are perfectly sweet without being cloying. Every day, long queues of Chengdu locals purchase full boxes of pastries. With budget-friendly prices and unwavering quality over the years, it is Chengdu\u2019s most iconic traditional vintage bakery.", "name": "Gongting Pastry Shop", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 4 minutes."}, {"address": "No. 197 Xiyulong Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Founded during the Tongzhi era of the Qing Dynasty, this is the original birthplace of Mapo Tofu and Chengdu\u0027s most historically iconic Sichuan restaurant. The signature Mapo Tofu arrives piping hot in an iron skillet, featuring silky intact tofu cubes glistening in red chili oil, cooked with premium minced beef and ground Sichuan pepper. It embodies the eight classic characteristics: numbing, spicy, piping hot, aromatic, crispy, tender, fresh, and lively. Silky smooth upon entry with a lingering spicy-numbing aftertaste, it is the ultimate rice-pairing dish and a must-visit legendary spot for foodies worldwide.", "name": "Chen Mapo Tofu (Wenshu Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit B, and walk for about 8 minutes."}, {"address": "No. 64 Huaxing Zheng Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Founded in 1925, this time-honored braised delicacy (Lu Wei) shop takes its name from a classic poetic line. The shop uses a master century-old brine to slow-simmer offal, meats, and poultry. Signature items like braised duck, braised pig ears, and braised pork ribs display a deep reddish color, tender texture, and rich, savory aroma that is neither gamey nor greasy. Additionally, their traditional braised pork buns\u2014sold in limited quantities during the evening\u2014boast thin skin, rich filling, and savory juice, highly beloved by long-time neighbors and food lovers.", "name": "Pan Sun Shi", "transport": "Take Chengdu Metro Line 3 or Line 4 to Second People\u0027s Hospital Station, Exit E, and walk for about 7 minutes."}, {"address": "Inside Wenshu Fang Block, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.1 stars | Established in the 1940s, this iconic Sichuan traditional snack brand is famous for its paper-thin wrapper chaoshou (wontons) packed with tender filling and served in flavorful broth. The original broth chaoshou features a soup slow-simmered for hours from chicken and pork bones, giving it a rich, savory taste; the chili oil chaoshou is coated in rich, numbingly spicy house-made chili oil and minced garlic, delivering a silky bite with plump filling and fragrant heat. The shop also offers various traditional Chengdu snack combo sets, allowing diners to sample multiple flavors at once.", "name": "Long Chaoshou (Wenshu Fang Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 6 minutes."}, {"address": "No. 18 Ma\u0027an North Road, Jinniu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A classic, time-honored Chengdu eatery famous for pork intestine noodles made with fresh, hand-pulled sweet potato starch noodles. The noodles are translucent, bouncy, and delightfully chewy. The pork intestines are meticulously cleaned and slow-cooked to tender, flavorful perfection with zero gameyness. Served in a rich, spicy broth topped with roasted soybeans and chopped scallions, it is best paired with a fresh, hot crispy beef cake dipped into the soup\u2014a true representation of authentic Chengdu street comfort food.", "name": "Gan Ji Sweet Potato Noodles with Pork Intestines", "transport": "Take Chengdu Metro Line 3 to Simaqiao Station, then transfer to a bus or walk for about 10 minutes."}, {"address": "Inside Gongren Village, Caojia Alley, Jinniu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Hidden in an alleyway, this iconic legendary stall serves traditional Chengdu egg-baked pancakes (Dan Hong Gao), made over traditional mini copper pans and charcoal fires. The crust edges are golden and crispy while the center is soft and cake-like with a rich egg and milk fragrance. The filling choices are remarkably diverse, ranging from classic pork floss with cream, sweet and spicy beef, to sweet sesame and peanut sugar. Biting into a piping-hot, freshly baked cake offers delightful layers of texture and a nostalgic comfort.", "name": "Lu Ji Dan Hong Gao (Egg Baked Pancakes)", "transport": "Take Chengdu Metro Line 3 to Hongxing Bridge Station, Exit A, and walk for about 10 minutes."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "No. 28 Wenshufang Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | Located inside an antique West Sichuan residence in Wenshufang, this spot uniquely blends the ambiance of an old Chengdu teahouse with modern specialty coffee. Their signature Covered Bowl (Gaiwan) Coffee combines espresso with locally crafted flavored milk, creating a dense and smooth texture. The palate opens with rich nut and dark chocolate aromas, followed by subtle fruity-floral acidity. Sitting on bamboo chairs while sipping a latte from a gaiwan is a favorite leisurely experience for tourists and local youth alike.", "name": "Tai Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 5 minutes."}, {"address": "Inside Wenshu Monastery, No. 66 Wenshuyuan Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | A Zen-inspired cafe attached to Wenshu Monastery, offering exquisite vegetarian brunch and custom plant-based milk coffees. The oat milk latte is exceptionally silky and rich, pairing delightfully with homemade pine nut tiramisu and whole-wheat nut bread\u2014pleasantly sweet without being greasy, with rich layers of flavor. The quiet, elegant garden setting and soft Buddhist chants make it a top choice for tourists seeking peace of mind and a slow-paced brunch.", "name": "Xiangji Kitchen \u0026 Zen Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit B, and walk for about 6 minutes."}, {"address": "No. 99 Caoshi Street, Wenshufang, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | A popular themed cafe seamlessly fusing Chengdu\u0027s iconic panda culture with postal elements. Its signature \u0027Panda Latte Art\u0027 features an adorable panda in a bamboo forest; the milk foam is velvety smooth, delivering rich milky notes and a caramelized finish. Paired with a cute panda-shaped mousse cake that is moist, soft, and moderately sweet, it is a big hit among tourists and Instagrammers.", "name": "Panda Post Cafe", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 4 minutes."}, {"address": "No. 58 Jinsi Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.8 stars | Tucked away in an alley of Wenshu Monastery\u0027s historic district, this independent specialty cafe retains the traditional tile-roof architecture of old Chengdu. Specializing in pour-over single-origin coffees and Japanese-style brunch, their Ethiopian pour-over boasts bright citrus and white flower aromas with a clean finish. Paired with freshly made thick toast and a soft-boiled egg salad, it is satisfying and delicious\u2014highly recommended by coffee connoisseurs and hipsters looking for a quiet retreat.", "name": "Wadang Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit B, and walk for about 7 minutes."}, {"address": "No. 18 Jiangyuan Gongsuo Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | A floral cafe combining flower aesthetics with specialty coffee, located near the Wenshu Monastery commercial area. Signature creations like the \u0027Rose Cold Brew\u0027 blend premium cold brew with natural rose water, offering a refreshing taste with a lingering sweet aftertaste and subtle floral aromas filling the palate. Their hearty Aussie brunch platter, served with fresh avocado and smoked salmon, is widely popular among health-conscious foodies for its rich textures.", "name": "Xinghua Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 8 minutes."}, {"address": "No. 12 Baiyun Si Street, Wenshufang, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | A unique cafe blending modern minimalist industrial style with traditional West Sichuan blue roof tiles, specializing in house-roasted coffee beans and European baked brunch items. The signature Sweet Osmanthus Latte seamlessly merges local osmanthus syrup with rich coffee, smooth and sweet with a fragrant floral finish. Paired with freshly baked flaky croissants and sausage-and-egg quiche, it offers a blissfully satisfying bite that draws many tourists to spend a relaxed afternoon.", "name": "More Fun Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 6 minutes."}, {"address": "Commercial Street outside the Panda Base, No. 1375 Panda Avenue, Chenghua District, Chengdu City", "feature": "\u2b50 4.4 stars | A cozy specialty cafe near the entrance of the Chengdu Research Base of Giant Panda Breeding, featuring drinks served in fresh natural bamboo trunks. The popular \u0027Chengdu-branded Bamboo Milk Latte\u0027 is topped with dense whipped cream and crunchy crushed nuts. The rich milk aroma intermingles with subtle fresh bamboo scents, offering multi-layered flavors\u2014making it the ultimate photo prop and refreshing pick-me-up after visiting the pandas.", "name": "Zhuyun Bamboo Coffee", "transport": "Take Chengdu Metro Line 3 to Panda Avenue Station, then transfer to the Panda Scenic Express Bus to Panda Base Station."}, {"address": "No. 22 Toudao Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | A retro hipster cafe near Wenshu Monastery, crafting a dreamily peaceful resting space. Its pour-over coffee and British scone brunch combo are crowd favorites. Freshly baked scones are crispy on the outside and soft inside, melting in your mouth when spread with homemade clotted cream and jam. Paired with a well-balanced, fruity Colombian pour-over, it delivers an exquisite taste experience that coffee lovers shouldn\u0027t miss when visiting the Wenshu Monastery area.", "name": "Floating Life Coffee", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit B, and walk for about 8 minutes."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 28 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | As the birthplace of Mapo Tofu, this century-old institution is the definitive masterpiece showcasing authentic Sichuan cuisine\u0027s eight hallmark characteristics: numbing, spicy, fresh, aromatic, hot, tender, soft, and crispy. Served piping hot in a bubbling stone pot with a glossy layer of chili oil, the silky-smooth tofu is combined with crispy minced beef and freshly ground Sichuan peppercorns. Each bite unleashes rich soy and spicy aromas, followed by an electrifying numbing sensation on the tongue that ignites your appetite. Both tourists and longtime locals willingly line up just to pair a hot bowl of Mapo Tofu with steamed rice.", "name": "Chen Mapo Tofu (Wenshu Monastery Branch)", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit K), then walk about 300 meters."}, {"address": "No. 23 Zhangjia Alley, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Hidden in an alleyway near the Wenshu Monastery shopping district, this private-kitchen Sichuan restaurant is famous for its meticulously crafted home-style dishes. Signature offerings include \u0027Perilla Governor Fish\u0027 and \u0027Tender Beef with Fresh Chilies\u0027. The paper-thin, tender beef slices are coated in a bright green sauce made with fresh green Sichuan peppercorns and millet chilies, offering a burst of savory, spicy, and zesty citrus-like pepper aroma that keeps you coming back for more. The cozy, lively neighborhood atmosphere perfectly reflects Old Chengdu\u0027s obsession with fresh ingredients and layered seasonings.", "name": "Ba Shu Wei Yuan Local Bistro", "transport": "Take Metro Line 3 to Hongxing Bridge Station (Exit C), then walk about 800 meters."}, {"address": "Near Caojia Alley Workers\u0027 Village, near Wenshu Monastery Shopping District, Jinniu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Upgraded from Chengdu\u0027s legendary \u0027fly-restaurant\u0027 Ming Ting Hotel, this specialty Sichuan bistro retains the high-heat stir-fry soul of traditional rustic cuisine while infusing a modern bistro style. The signature \u0027Pork Brain Tofu\u0027 seamlessly blends silky pork brains with tender tofu in a rich, numbing-spicy, fermented broad bean sauce; the \u0027Spicy Marrow\u0027 is wonderfully crispy and savory. Paired with house-brewed peach blossom rice wine or craft beer, it is an exceptional spot to experience Chengdu\u0027s authentic nightlife and fiery cuisine.", "name": "Ming Ting Bistro", "transport": "Take Metro Line 3 to Hongxing Bridge Station (Exit D), then walk about 600 meters."}, {"address": "Inside Wenshu Monastery, No. 63 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Nestled inside the thousand-year-old Wenshu Monastery, this specialty vegetarian bistro ingeniously combines traditional Buddhist vegetarian cuisine with Sichuan cooking techniques. Popular dishes like \u0027Kung Pao Chicken (made with lion\u0027s mane mushrooms)\u0027 and \u0027Handmade Vegetarian Twice-Cooked Pork\u0027 closely mimic the real textures and flavors. The mushrooms absorb all the sweet, sour, numbing, and spicy Kung Pao sauce, bursting with savory juice in every bite. Surrounded by antique d\u00e9cor, the rhythmic sound of wooden fish drums, and swaying bamboo shadows, diners can savor delectable food while enjoying inner peace and tranquility.", "name": "Wenshu Temple Xiangzhaitang Vegetarian Bistro", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit B), then walk about 400 meters into Wenshu Monastery."}, {"address": "No. 64 Huaxing Main Street, Jinjiang District, Chengdu City, Sichuan Province (Near Wenshu Monastery South District)", "feature": "\u2b50 4.3 stars | Founded in 1925, this historic Sichuan restaurant and braised food house draws its name from a poem by Du Fu. Famous for its exquisite braised delicacies and traditional Sichuan fare, top picks include \u0027Braised Duck Wings\u0027, \u0027Braised Pig Trotters\u0027, and \u0027Saut\u00e9ed Eel Segments\u0027. The master braising stock, aged for decades, infuses the meats deeply with herbal and savory aromas, resulting in springy skin, tender meat, and a delightful lingering sweetness. Many local gourmets love ordering a few plates of braised delights paired with a sip of Sichuan Daqu liquor to savor the purest old Chengdu dining culture.", "name": "Pan Sun Shi Restaurant", "transport": "Take Metro Line 3 or 4 to Second People\u0027s Hospital Station, then walk about 500 meters."}, {"address": "No. 39 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Located directly opposite the main gate of Wenshu Monastery, this famous classic snack eatery has been packed for decades. The signature \u0027Sweet Water Noodles\u0027 feature thumb-thick noodles with an amazingly chewy, springy texture, coated in red chili oil, sesame paste, and thick brown sugar syrup for a savory, sweet-and-spicy indulgence. The \u0027Yellow Jelly Noodles\u0027, made from pea starch, are soft and melt-in-your-mouth tender, served with a special fermented black bean sauce. This rich, layered sweet-and-spicy profile is a memorable Chengdu classic that first-time visitors will never forget.", "name": "Dong Zikou Zhang Lao Er Local Cuisine", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit K), then walk about 350 meters."}, {"address": "Next to Beihu Ecological Park, near Chengdu Research Base of Giant Panda Breeding, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Located in northern Chengdu along the axis near the Giant Panda Breeding Base, this unique bistro features Liangshan Yi ethnic-style barbecue. It is famous for its \u0027Bamboo Skewered Mountain Pork\u0027, grilled over charcoal flames on long skewers. The bone-in pork with skin becomes golden and crispy on the outside while remaining juicy and chewy on the inside, releasing an explosion of rich aroma best enjoyed with spicy dipping powder. Combining industrial chic with ethnic decor and serving local Sichuan craft beers and handcrafted cocktails, it is a hugely popular spot for a hearty feast after visiting the Panda Base.", "name": "Zui Xi Chang Bistro", "transport": "It is recommended to take a taxi, or take Metro Line 3 to Panda Avenue Station and transfer to a bus."}, {"address": "No. 110 Caoshi Street, Wenshu Monastery Area, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | A charming local restaurant that blends Old Chengdu teahouse culture with authentic Sichuan cuisine, located near the Wenshu Monastery cultural area. The signature \u0027Mao Xue Wang\u0027 (Spicy Broth with Duck Blood and Tripe) is packed with generous ingredients\u2014silky duck blood absorbs the flavorful broth while crunchy tripe adds fantastic texture in a bright red, spicy-numbing yet non-greasy soup. The \u0027Camphor and Tea Smoked Duck\u0027 features crispy skin and tender meat infused with a subtle tea and wood aroma. Outfitted with classic wooden tables and bamboo chairs, guests can enjoy covered-bowl tea alongside their meal, immersing themselves in Old Chengdu\u0027s relaxed slow-life tradition mixed with fiery culinary passion.", "name": "Shu Xiao Qi Local Sichuan Restaurant", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit H), then walk about 450 meters."}], "name": "Specialty Bistros \u0026 Local Sichuan Cuisine"}, "cat_4": {"items": [{"address": "Inside Wenshu Monastery, No. 68 Wenshuyuan Street, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Nestled inside the ancient Wenshu Monastery, Xiangzhaitang offers distinctive temple vegetarian dishes and delicate pastries. Signature dishes like the \u0027Kung Pao Chicken\u0027 and \u0027Sweet-Skinned Vegetarian Duck\u0027 are made entirely from soy protein and mushrooms, yet offer succulent, rich, and remarkably convincing textures. Desserts such as the sweet, soft Wenshu Pastry and chilled jelly cakes are refreshing and melt in your mouth. Beyond attracting pilgrims, its authentic Sichuan vegetarian cuisine and tranquil Zen ambiance make it a highly recommended culinary destination for both foreign tourists and Chengdu locals.", "name": "Xiangzhaitang Vegetarian Restaurant (Wenshu Monastery)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 8 minutes."}, {"address": "2nd Floor, No. 26 Jiangyuangongsuo Street, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | A nationally renowned high-end vegetarian restaurant that strictly adheres to no smoking, alcohol, eggs, or pungent alliums, highly favored by health-conscious and eco-friendly diners. The kitchen ingeniously uses monkey head mushrooms, tofu skin, and special broths to recreate Sichuan classics. The must-try \u0027Black Pepper Veggie Steak\u0027 is chewy and flavorful with a rich pepper aroma, while the \u0027Longevity Noodles\u0027 feature a sweet, comforting broth and silky noodles. With its elegant, traditional decor and attentive service, it is a top choice for experiencing refined Sichuan vegetarian dining.", "name": "Jujube Tree Vegetarian Restaurant (Wenshu Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 5 minutes."}, {"address": "2nd Floor, No. 22 Renmin Middle Road Section 3, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | An innovative vegetarian hot pot restaurant that seamlessly blends traditional Ya\u0027an Tibetan tea with Sichuan hot pot culture. The broth, slow-simmered with aged Tibetan tea, emits a subtle tea aroma and sweet finish, remaining light, non-greasy, and easy on the stomach. Handmade vegetarian meatballs and various organic wild mushrooms simmered in the tea soup become tender, sweet, and aromatic. Paired with unique sesame and sesame oil dipping sauces that elevate the natural flavors, it is wildly popular among tourists and health-conscious foodies alike.", "name": "Yiye Yishijie Tibetan Tea Vegetarian Hotpot (Wenshu Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 57 Wenshuyuan Street, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | An exquisite vegetarian restaurant brimming with Zen elegance, featuring lotus motifs and warm wooden decor that create a peaceful dining environment. The \u0027Lotus Leaf Sticky Rice\u0027 absorbs the delicate lotus fragrance and savory diced mushrooms, resulting in soft, chewy rice with distinct layers of flavor. The \u0027Vegetarian Twice-Cooked Pork\u0027 uses konjac and soy protein to recreate the perfect marbled texture, stir-fried with green garlic for a savory, spicy, and perfectly seasoned dish that goes wonderfully with rice. A staple spot for modern, creative vegetarian dining.", "name": "Qingshui Hehua Vegetarian Restaurant", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 6 minutes."}, {"address": "No. 88 Caoshi Street, Qingyang District, Chengdu", "feature": "\u2b50 4.3 stars | An immensely popular and budget-friendly vegetarian buffet near Wenshu Monastery, offering dozens of hot stir-fries, staple foods, cold dishes, and traditional pastries daily. The top-selling \u0027Vegetarian Mapo Tofu\u0027 is spicy, numb, and aromatic, with silky tofu that pairs perfectly with rice; the \u0027Freshly Fried Spring Rolls\u0027 feature a golden, crispy skin with a juicy vegetable filling. Offering great value and a wide variety of Sichuan vegetarian flavors, it receives rave reviews from local seniors, office workers, and backpackers alike.", "name": "Sumanxiang Vegetarian Buffet (Wenshu Shop)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 7 minutes."}, {"address": "K1-1, Zone B, Wenshufang, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | A premier vegetarian restaurant located within a boutique Zen hotel, designed in traditional Western Sichuan residential style. The culinary team excels in imperial and temple vegetarian traditions. The signature \u0027Zen Tea Harmony\u0027 set meal features exquisite small plates, including a rich, savory \u0027Truffle Wild Mushroom Soup\u0027 and realistic \u0027Vegetarian Abalone in Golden Soup\u0027 with a firm, chewy texture served in a tangy broth. An exceptional choice for foodies seeking fine dining with a serene atmosphere.", "name": "Yuanheyuan Buddha Zen Hotel Vegetarian Restaurant", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 5 minutes."}, {"address": "No. 56 Da\u0027an West Road, Qingyang District, Chengdu", "feature": "\u2b50 4.8 stars | An upscale fine-dining restaurant specializing in private-kitchen set-menu vegetarian cuisine, advocating natural, pure ingredients. The signature \u0027Boiled Vegetarian Fish\u0027 uses konjac and soy products to achieve a tender texture soaked in authentic spicy Sichuan chili oil\u2014delivering a bold kick without being harsh. The \u0027Handmade Walnut Buns\u0027 are soft and fluffy with a rich, smooth filling. Each dish is crafted like a work of art, which, combined with the tranquil garden setting, offers a luxurious feast for both the eyes and palate.", "name": "Chanyue Vegetarian Cuisine", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 10 minutes."}, {"address": "No. 37 Renmin Middle Road Section 3, Qingyang District, Chengdu", "feature": "\u2b50 4.2 stars | A cozy eatery combining modern light-dining concepts with traditional vegetarian cooking, well-received by young diners and tourists. The must-try \u0027Sour and Spicy Vegetarian Fish\u0027 pairs custom pickled vegetables with handmade veggie fish slices in an appetizing sour broth; the \u0027Pan-Fried Veggie Goose\u0027 features a super crispy skin with a savory, juicy mushroom filling. Bright and minimal, the restaurant offers refined portions with lower oil and salt, balancing authentic Sichuan flavor with healthy living.", "name": "Qingsu Vegetarian Delights", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 4 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 39 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Located right opposite the main gate of Wenshu Monastery, this century-old classic shop is the ultimate pilgrimage site for experiencing Sweet Water Noodles (Tianshuimian) and Yellow Jelly Noodles (Huang Liangfen). The signature Sweet Water Noodles are as thick as a pinky finger, boasting an incredibly chewy, springy texture, fully coated in a rich sauce of chili oil, sesame paste, soy sauce, and Sichuan peppercorns. It hits the palate sweet first, then spicy, bursting with numbing aroma that keeps you hooked. The Yellow Jelly Noodles are soft, smooth, and rich in soy flavor. This uniquely bold street food is loved by tourists and local foodies alike\u2014a must-try classic snack while strolling around Wenshu Monastery.", "name": "Dongzikou Zhang Lao Er Liangfen (Dongzikou Zhang Lao Er Jelly Noodles)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 5 minutes."}, {"address": "No. 19, Section 3, Renmin Middle Road, Qingyang District, Chengdu City, Sichuan Province (near Wenshu Monastery Metro Station)", "feature": "\u2b50 4.7 stars | A legendary Guokui shop in Chengdu with year-round queues. Made fresh to order, the crust is pan-fried and oven-baked to crisp perfection outside while staying soft and aromatic inside. The most popular item, Spicy Beef Guokui, is stuffed to the brim with tender beef slices tossed in spicy, flavorful chili oil. Every bite delivers a perfect harmony of crispy pastry and juicy, fiery beef. Other rich fillings include shredded vegetables (Bansansi) and pork with sea delicacies (Sanxian). With its incredible value for money and explosive flavor, this grab-and-go street snack is an absolute must-eat when visiting Wenshu Monastery.", "name": "Yan Tai Po Guo Kui (Yan\u0027s Stuffed Crispy Flatbread)", "transport": "Take Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 2 minutes."}, {"address": "No. 67 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A legendary traditional bakery right next to Wenshu Monastery, always bustling with locals and tourists carrying big bags of treats. The signature Taosu (walnut crunchy cookies) are immensely crispy, melt-in-your-mouth, and packed with buttery egg aroma. Their Napoleon cake is beautifully layered and subtly sweet, while the Salt \u0026 Pepper Crisps offer a captivating savory-sweet flavor profile. Adhering to time-honored baking methods, this shop offers generous portions at very affordable prices\u2014a fantastic spot to grab traditional Chinese sweets to enjoy while strolling around.", "name": "Gongting Pastry Shop (Imperial Pastry Shop)", "transport": "Take Metro Line 1 to Wenshu Monastery Station and walk for about 6 minutes."}, {"address": "No. 88 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Standing shoulder-to-shoulder with Gongting Pastry Shop, this historic bakery near Wenshu Monastery is famous for its flaky pastries and traditional Chinese treats. Highly recommended are the Egg Yolk Pastry and Mille-Feuille Crisps\u2014boasting ultra-flaky, buttery crusts filled with dense, fragrant sweet paste. They also serve freshly made multi-layered scallion pancakes and cold rice cakes, catering to both savory and sweet cravings. Built on genuine ingredients and authentic old-school flavors, it\u2019s a hidden gem for street pastry lovers around Wenshu Monastery.", "name": "Wen Su Yuan Bakery", "transport": "Take Metro Line 1 to Wenshu Monastery Station, Exit K, and walk for about 6 minutes."}, {"address": "Inside Gongren Village, Caojia Lane, Jinniu District, Chengdu City, Sichuan Province (near Wenshu Monastery area)", "feature": "\u2b50 4.5 stars | Tucked away in an old lane near Wenshu Monastery, this legendary Danhonggao (egg crepe) stall carries the childhood memories of countless Chengdu locals. Freshly cooked in small copper pans upon ordering, the edges are paper-thin and crispy while the center remains fluffy and spongey like cake, rich with egg fragrance. The filling options are wide-ranging: savory pickled cowpea with minced pork is appetizing, while whipped cream peanut or \u0027exotic sweet\u0027 flavors offer balanced sweetness. This portable, handcrafted street dessert is a favorite for travelers seeking authentic hidden street eats.", "name": "Lu Ji Dan Hong Gao (Lu\u0027s Egg Crepes)", "transport": "Take a 5-minute taxi ride from Metro Line 1 Wenshu Monastery Station, or walk for about 15 minutes."}, {"address": "Food Stalls inside Wenshufang Commercial District, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | One of Chengdu\u0027s most iconic traditional walk-and-eat treats, served as skewers of glossy, caramelized rice balls. Premium glutinous rice dough is rolled into spheres and slowly deep-fried until golden and puffed, then coated in hot brown sugar syrup and toasted sesame seeds. The shell breaks with a satisfying crunch, revealing a chewy, fragrant rice interior infusing caramelized sweetness without being cloying. This delightful contrast of crispy and chewy makes it a popular market snack that nearly every visitor around Wenshu Monastery holds in hand for a photo.", "name": "Deng Ji Tang You Guo Zi (Deng\u0027s Fried Brown Sugar Rice Balls)", "transport": "Take Metro Line 1 to Wenshu Monastery Station and walk directly to Wenshufang Pedestrian Street."}, {"address": "No. 107 Denglong Street, Qingyang District, Chengdu City, Sichuan Province (near Wenshu Monastery)", "feature": "\u2b50 4.4 stars | A heartwarming classic shop insisting on traditional hand-baked sourdough Guokui filled with brown sugar or red bean. The signature Brown Sugar Guokui uses naturally leavened dough stuffed generously with brown sugar, baked inside a hot clay oven until slightly charred. Hot out of the oven, the crust is delightfully crispy and chewy; a single bite unleashes a burst of molten brown sugar syrup that leaves a rich, lingering sweetness. Their balanced savory-sweet Salt \u0026 Pepper Guokui is equally distinctive. A truly special vintage hand-crafted snack to enjoy while exploring near Wenshu Monastery.", "name": "Qiu Er Ge Guo Kui (Brother Qiu\u0027s Guokui)", "transport": "Take Metro Line 1 to Wenshu Monastery Station, Exit H, and walk for about 8 minutes."}, {"address": "No. 1375 Waibei Panda Avenue, Chenghua District, Chengdu City, Sichuan Province (Food Market at the Exit of Chengdu Panda Base)", "feature": "\u2b50 4.2 stars | Located in the market area at the exit of the Chengdu Research Base of Giant Panda Breeding, these charming snack stalls combine adorable panda motifs with authentic Sichuan treats. The handmade Bingfen (Ice Jelly) is uniquely silky and bouncy with fine air bubbles, topped with rich brown sugar syrup, hawthorn flakes, crushed peanuts, and sweet fermented rice\u2014refreshingly cool and comforting. The panda-stamped egg crepes (Danhonggao) are baked fresh on the spot, offering a milky, crispy-outside, soft-inside treat. Blending creativity with tradition, it\u2019s the perfect strolling snack to recharge after visiting the giant pandas.", "name": "Panda Base Handmade Bingfen \u0026 Panda Danhonggao", "transport": "Take Metro Line 3 to Panda Avenue Station, transfer to the scenic shuttle bus to the Panda Base main gate, and walk to the exit market."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Giant Panda Base and Wenshu Monastery"}, "wuhou_jinli": {"categories": {"cat_1": {"items": [{"address": "No. 247 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.6 stars | A century-old herbal cuisine establishment near Wuhou Shrine, seamlessly blending traditional Chinese herbs with Sichuan cuisine. The signature Herbal Black Chicken Pot features a rich, sweet, and comforting broth with tender, melt-in-your-mouth silky chicken infused with subtle herbal aromas and zero bitterness. Tourists love its unique combination of health benefits and delicious taste, while locals often host family gatherings here to immerse themselves in ancient Shu-Han culture and wellness dining philosophy.", "name": "Qinshan Zhai Herbal Cuisine", "transport": "Take Metro Line 3 or 5 to Gaoshengqiao Station (Exit D), walk about 8 minutes."}, {"address": "No. 198 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.5 stars | A branch from the birthplace of classic Mapo Tofu, carrying on century-old authentic Sichuan flavors. Served piping hot in a clay pot, the signature Mapo Tofu features silky, whole tofu thoroughly infused with savory flavors, paired with crispy minced meat. The numbing sensation of Sichuan peppercorns and aromatic chili oil explode on your tongue\u2014savory, spicy, tender, hot, and insanely satisfying with rice. Tourists consider it a culinary pilgrimage site, while local foodies praise its commitment to traditional, bold, and heavily spiced recipes.", "name": "Chen Mapo Tofu (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), walk along Wuhouci Street for about 10 minutes."}, {"address": "No. 17 Caotang North Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | An iconic Time-Honored Chinese Brand snack shop right next to Du Fu Thatched Cottage, famous for its signature sweet and spicy sauce. The pure pork dumplings have thin wrappers loaded with filling, cooked to springy perfection. The real highlight is the signature red chili oil and custom sweet soy sauce drizzle, delivering a rich blend of sweet, savory, and spicy notes with a lingering sweet finish. Tourists are amazed by its unique sweet-spicy twist, while locals see it as a nostalgic, lifelong classic afternoon snack.", "name": "Zhong Dumplings (Caotang Branch)", "transport": "Take Metro Line 5 to Qingyang Palace Station (Exit B), walk about 12 minutes or transfer to a bus to Du Fu Thatched Cottage Station."}, {"address": "No. 258 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.3 stars | A century-old spot gathering dozens of traditional Chengdu snacks, making it the ultimate one-stop shop for authentic Sichuan street food. Their Sweet Water Noodles are thick and delightfully chewy, coated in thick sesame paste and chili oil with a sweet-spicy bite; the Sichuan Dandan Noodles are silky, savory, and perfectly spiced. Tourists adore the rustic teahouse ambiance and variety, while locals appreciate the decades-unchanged authentic taste and affordable prices.", "name": "Huangchengba Snacks (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), walk about 7 minutes."}, {"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.1 stars | A landmark eatery inside Jinli Ancient Street, famous nationwide for its paper-thin wrappers and tender wonton fillings. The Original Broth Wontons feature a milky white broth simmered for hours\u2014rich, flavorful, and soul-soothing. The Red Oil Wontons offer silky wrappers, juicy meat, and a fiery kick from aromatic chili oil. Tourists consider a bowl here a must-try experience while strolling through the historic street, while locals respect their fresh broth and authentic hand-craftsmanship.", "name": "Long Chaoshou (Jinli Branch)", "transport": "Take Metro Line 3 or 5 to Gaoshengqiao Station, walk along Wuhouci Street to enter Jinli Ancient Street."}, {"address": "No. 180-4 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.5 stars | One of Chengdu\u0027s most iconic local delicacies\u2014they say you haven\u0027t truly experienced Chengdu until you try rabbit head. The Spicy Rabbit Head undergoes extensive slow-braising; the meat is tender, easily coming off the bone, while infused with deep spicy flavors. The Five-Spice version is richly aromatic and non-spicy. Tourists go from hesitant to thoroughly conquered by the incredible flavor, while locals revere it as the ultimate late-night snack with drinks.", "name": "Shuangliu Laoma Rabbit Head (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), walk about 9 minutes."}, {"address": "No. 39 West Section 2 of 1st Ring Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | A renowned traditional Sichuan hot pot restaurant near Du Fu Thatched Cottage and Baihuatan Park, famed for its authentic nine-grid beef tallow hot pot. The soup base is rich, fragrant, and boldly spicy without irritating the stomach. The signature Jiuxiang Beef is thick, tender, and stays succulent even after long boiling, while the garlic sesame oil dipping bowl locks in all the rich flavors. Tourists love the early 20th-century traditional ambiance and service, while local hot pot purists return again and again for the deep tallow aroma and fresh ingredients.", "name": "Shujiuxiang Hotpot (Baihua Branch)", "transport": "Take Metro Line 5 to Qingyang Palace Station (Exit C), walk about 5 minutes."}, {"address": "No. 2 Caotang Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.8 stars | An exquisite, high-end traditional Sichuan restaurant near Du Fu Thatched Cottage, infusing poetic cultural heritage into classic cuisine. The signature Dongpo Pork is velvety, tender, melt-in-your-mouth perfection with a balanced sweet and savory glaze. The classic Kung Pao Chicken features tender diced chicken and crunchy peanuts with the textbook classic lychee-sweet and spicy flavor profile. Tourists are captivated by the elegant garden dining atmosphere, while local gourmets praise its masterful preservation and refinement of classic Sichuan culinary techniques.", "name": "Chaimen Shujun (Caotang Branch)", "transport": "Take Metro Line 5 to Qingyang Palace Station, transfer to Bus 58 to Du Fu Thatched Cottage Station, walk about 3 minutes."}], "name": "Local Heritage Restaurants"}, "cat_2": {"items": [{"address": "No. 2-14, Xiashuangnan Street, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | One of the pioneers of Chengdu\u0027s independent cafe and indie bookstore scene, filled with cozy Japanese aesthetics and an artistic vibe. The cafe offers exquisite pourover coffee and specialty drinks. Brunch options include freshly baked Japanese pancakes, mentaiko toast, and handmade scones that are crispy on the outside and soft inside. Paired with rich butter and homemade jam, it delivers an exceptional taste beloved by hipsters and travelers alike.", "name": "NOO-HOO Cafe", "transport": "About a 10-minute walk from Exit B of Caotang North Road Station, Metro Line 4"}, {"address": "No. 38-6, Qinghua Road, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Adjacent to Du Fu Thatched Cottage, known for its vintage French style. Offers high-quality single-origin pourover coffee and a hearty English all-day breakfast. The signature Eggs Benedict features smooth runny yolks served over crispy yet soft sourdough bread and savory bacon. The slightly tangy Hollandaise sauce adds rich layers of flavor, making it the top choice for a relaxing brunch after strolling through the cottage grounds.", "name": "L\u0027EST COFFEE", "transport": "About an 8-minute walk from Exit B of Caotang North Road Station, Metro Line 4"}, {"address": "No. 76 Caotang East Road, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | A high-quality specialty coffee shop with a minimalist industrial aesthetic. Its dark roast latte boasts rich nutty aromas and dark chocolate undertones, complemented by extremely fine, dense milk foam. For brunch, the smoked salmon and avocado toast is highly recommended\u2014the tender salmon and creamy avocado blend perfectly in every smooth bite, attracting countless coffee enthusiasts.", "name": "INVISIBL3 COFFEE", "transport": "About a 12-minute walk from Exit A of Provincial Orthopedic Hospital Station, Metro Line 5"}, {"address": "No. 234 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.4 stars | Located in the Wuhou Shrine commercial area, seamlessly blending traditional architecture with modern specialty coffee. The signature specialty drink \u0027Chengdu Cold Brew\u0027 features a delicate osmanthus aroma, smooth with a lingering sweet floral-fruity note. Paired with crisp, delicious French croissants and freshly made omelets, the savory cheese and tender eggs are irresistible\u2014the perfect place to relax after exploring Jinli.", "name": "Pause Coffee (Jinli Branch)", "transport": "About a 10-minute walk from Exit D of Gaoshengqiao Station, Metro Line 3"}, {"address": "No. 10-2, Qinghua Road, Qingyang District, Chengdu", "feature": "\u2b50 4.8 stars | A Japanese kissaten filled with retro Showa-era charm. Its classic dark roast pourover coffee features a balanced bittersweet profile with
