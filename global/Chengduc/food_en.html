 a lingering finish. Top brunch picks include Japanese thick-cut French toast and pork cutlet curry sandwiches. The toast, soaked in egg wash and seared golden brown, has a lightly caramelized sweet crust and a pudding-soft interior that melts in your mouth\u2014a huge favorite among local youth and visitors.", "name": "Kissa Omiya", "transport": "About a 9-minute walk from Exit B of Caotang North Road Station, Metro Line 4"}, {"address": "No. 15 Tiyu Road, Wuhou District, Chengdu", "feature": "\u2b50 4.3 stars | A cozy spot tucked away near Wuhou Shrine, renowned for its homemade artisanal sourdough bread and healthy brunch options. The signature avocado and chicken sandwich uses freshly toasted multigrain bread filled with tender chicken breast and fresh avocado, rich in texture yet light on the stomach. Pair it with a specialty cold brew featuring sweet and tangy berry notes for a refreshing meal.", "name": "Wheat \u0026 Coffee Brunch", "transport": "About an 11-minute walk from Exit B of Yiguanmiao Station, Metro Line 3"}, {"address": "No. 8 Huanhua North Road, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Located near Huanhuaxi Park and Du Fu Thatched Cottage, offering a poetic space surrounded by lush greenery. The curated single-origin pourover coffees feature excellent layers of flavor, starting with elegant floral notes and finishing with honeyed sweetness. Paired with the popular Basque burnt cheesecake and light salads\u2014the rich, creamy cheesecake is smooth and satisfying without being overwhelming, refreshing the soul.", "name": "YEATS COFFEE", "transport": "About a 12-minute walk from Exit A of Caotang North Road Station, Metro Line 4"}, {"address": "No. 12 Wuhouci Heng Street, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | A popular American-style brunch spot and specialty cafe near Wuhou Shrine. The hearty classic American breakfast includes seared sausages, sunny-side-up eggs, crispy hash browns, and homemade pancakes. The pancakes, drizzled with maple syrup, are fluffy and soft with a delicious sweet and savory balance. Enjoyed alongside a medium-dark roast latte, the fusion of rich milk and roasted coffee beans offers total satisfaction.", "name": "Five Pecks Coffee \u0026 Brunch", "transport": "About an 8-minute walk from Exit D of Gaoshengqiao Station, Metro Line 3"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 247 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.6 stars | Situated right next to Wuhou Shrine, this wellness medicinal cuisine and classic Sichuan restaurant seamlessly blends traditional Chinese herbs into classic Sichuan dishes, resulting in a gentle, comforting flavor profile. Signature dishes include the \u0027Angelica Black Chicken Soup\u0027, which boasts a rich, savory broth and ultra-tender chicken, and the \u0027Nourishing Beef Brisket\u0027, melting in your mouth with a subtle herbal aroma\u2014a favorite among health-conscious travelers and local elders.", "name": "Qin Shan Zhai Medicinal Cuisine", "transport": "Take Chengdu Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 800 meters."}, {"address": "No. 231 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.7 stars | Combining a trendy bistro vibe with exquisite modern Sichuan cuisine, this spot features elegant evening lighting and professional mixologists. The signature \u0027Tingxiang Mao Xue Wang\u0027 is spicy, numbing, and loaded with rich ingredients, featuring silky smooth duck blood. Paired with their house-crafted \u0027Shu Spice Cocktail\u0027, it perfectly balances intense spice with refreshing botanical aromas, making it a late-night hotspot for young foodies and tourists.", "name": "Tingxiang Sichuan Bistro", "transport": "Take Chengdu Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 850 meters."}, {"address": "No. 242 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.5 stars | A stylish, modern Sichuan restaurant under a renowned Chengdu culinary group, featuring a bright atmosphere infused with elements of Shu brocade and bamboo weaving art. The must-order \u0027Cherry Pork\u0027 boasts a crispy exterior with juicy, non-greasy meat coated in an explosive sweet-and-sour sauce. The \u0027Poached Beef in Hot Chili Oil\u0027 offers velvety smooth slices of beef with rich, distinct layers of spicy and numbing flavors\u2014a great value choice for exploring authentic local comfort food.", "name": "Chaimen Fan\u0027er (Wuhouci Branch)", "transport": "Take Chengdu Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 820 meters."}, {"address": "No. 35 Qinghua Road, Qingyang District, Chengdu City (Near the North Gate of Du Fu Thatched Cottage)", "feature": "\u2b50 4.8 stars | Set in a serene garden near Du Fu Thatched Cottage, this fine-dining Sichuan establishment specializes in reviving ancient culinary methods and aristocratic court cuisine. Their signature \u0027Snowflake Chicken Paste\u0027 demonstrates the master technique of \u0027tasting chicken without seeing chicken\u0027, featuring a texture as smooth and light as egg whites immersed in delicious broth. The \u0027Dongpo Pork\u0027 is melt-in-your-mouth tender with a glossy red glaze. Surrounded by rustic, elegant decor, it offers a deeply immersive cultural experience.", "name": "Yinlu Traditional Sichuan Cuisine", "transport": "Take Chengdu Metro Line 4 to Caotang North Road Station (Exit B), then walk about 900 meters."}, {"address": "No. 16 Caotang East Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Tucked away near Thatched Cottage Park, this cozy private-kitchen restaurant radiates authentic local Sichuan charm and home-style warmth. The signature \u0027Caotang Spicy Crab\u0027 features firm, sweet crab meat steeped in a rich, savory chili sauce, while the \u0027Braised Duck with Green Peppers\u0027 offers tender, springy meat infused with aromatic green peppers and a mildly spicy, sweet finish\u2014an exceptional spot to savor local lifestyle dining after touring Du Fu Thatched Cottage.", "name": "Xunwei Caotang Local Restaurant", "transport": "Take Chengdu Metro Line 5 to Provincial Orthopedic Hospital Station (Exit A), then walk about 1 km."}, {"address": "No. 104 Jinli West Road, Wuhou District, Chengdu City", "feature": "\u2b50 4.5 stars | Located near Jinli Ancient Street and the Jinjiang River, this restaurant offers an antique dining atmosphere and authentic regional dishes. The \u0027Old Chengdu Mapo Tofu\u0027 comes highly recommended, featuring silky intact tofu paired with a powerful kick of Sichuan peppercorns\u2014perfect over hot steamed rice. The \u0027Kung Pao Chicken\u0027 achieves a flawless balance of sweet, sour, salty, and spicy notes with tender chicken and crunchy peanuts, displaying impressive traditional wok mastery.", "name": "Jinli Impression Sichuan Restaurant", "transport": "Take Chengdu Metro Line 2 to Tonghuimen Station (Exit C), then walk about 700 meters."}, {"address": "No. 8 Huanhua North Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | A creative fusion bistro that integrates French bistro concepts with traditional Sichuan ingredients. The signature \u0027Sichuan Peppercorn Crispy Squab\u0027 features crispy skin, juicy meat, and a subtle mouth-numbing heat from wild mountain peppers and green peppercorns. Paired with curated natural wines and unique cold-brew tea cocktails in a relaxed, comfortable setting, it draws many adventurous young travelers seeking innovative gastronomy.", "name": "Mo Fang Bistro", "transport": "Take Chengdu Metro Line 4 to Caotang North Road Station (Exit B), then walk about 1.1 km."}, {"address": "No. 180 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.3 stars | A unique bistro combining traditional local dishes with authentic Sichuan Opera Face-Changing performances. The classic \u0027Camphor and Tea-Smoked Duck\u0027 features golden, crispy skin and meat delicately scented with camphorwood and tea leaves, deliciously rich without feeling greasy. The \u0027Hand-Kneaded Brown Sugar Rice Cakes\u0027 are crispy on the outside and soft inside, brimming with aromatic brown sugar syrup. Enjoying fine food alongside traditional Shu cultural arts makes for a memorable experience.", "name": "Shucui Dianshang Chengdu Memory Bistro", "transport": "Take Chengdu Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 650 meters."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 2 Caotang Road, Qingyang District, Chengdu City, Sichuan Province (Near Du Fu Thatched Cottage)", "feature": "\u2b50 4.6 stars | Located right next to Huanhuaxi Park and Du Fu Thatched Cottage, this restaurant is famous for its elegant lotus theme and traditional Sichuan-style vegetarian dishes. The signature \u0027Vegetarian Mapo Tofu\u0027 uses specially made brine tofu paired with soy protein crumbles\u2014tender, silky, smooth, and packing rich layers of numbingly spicy and savory flavors that easily rival authentic meat Mapo Tofu. The \u0027Handmade Vegetarian Steamed Dumplings\u0027 feature translucent, chewy skins stuffed with minced shiitake mushrooms and black fungus, offering a delightfully chewy, light, and non-greasy bite. Highly favored by local gourmets and tourists who appreciate light and healthy dining.", "name": "Qingshui Hehua Vegetarian Restaurant", "transport": "Take Metro Line 4 to North Caotang Road Station, then walk for about 10 minutes."}, {"address": "No. 266 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Situated in the Wuhou Shrine commercial district, this hotpot spot perfectly combines Tibetan tea culture with a unique vegetarian hotpot experience. The signature \u0027Tibetan Tea Broth\u0027 is warm, smooth, and naturally sweet; when infused with a variety of rare wild mushrooms, it creates a rich, umami-packed soup. The must-order \u0027Bamboo Fungus Mock Shrimp Paste\u0027 has a snappy and crisp texture, bursting with tea-infused broth upon biting and leaving a subtle herbal sweetness. The \u0027Handmade Black Tofu\u0027 is dense, smooth, and rich in soybean flavor. This healthy, guilt-free hotpot is highly praised by female travelers and health-conscious diners.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hotpot", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station (Exit D), then walk for about 8 minutes."}, {"address": "No. 66 Qingyang Zheng Street, Qingyang District, Chengdu City, Sichuan Province (Near Du Fu Thatched Cottage and Qingyang Palace)", "feature": "\u2b50 4.5 stars | A renowned strict vegetarian restaurant near Du Fu Thatched Cottage, adhering strictly to egg-free, dairy-free, and MSG-free principles. The \u0027Black Pepper Vegetarian Steak\u0027 is crafted from monkey head mushrooms (lion\u0027s mane); after pan-searing, it becomes firm, juicy, and carries a unique mushroom aroma with a spicy kick of black pepper, boasting an impressively realistic fibrous texture. The \u0027Longevity Pine Nut Fish\u0027 creatively shapes Chinese yam and seaweed into a fish format, fried until golden crispy and drizzled with a balanced sweet-and-sour sauce\u2014crispy outside, tender inside, tangy, and appetizing. Beloved by international tourists and family gatherings alike.", "name": "Jujube Tree Vegetarian Restaurant", "transport": "Take Metro Line 5 to Qingyang Palace Station (Exit B), then walk for about 5 minutes."}, {"address": "No. 8 Tiyu Road, Wuhou District, Chengdu City, Sichuan Province (Near Wuhou Shrine)", "feature": "\u2b50 4.7 stars | Located close to Wuhou Shrine and Jinli Ancient Street, this venue features a tranquil, Zen-inspired atmosphere with classic antique decor. Specializing in refined set-course vegetarian dining, their \u0027Guanyin Hand-Pulled Mushroom\u0027 uses premium large lion\u0027s mane mushrooms simmered slowly to achieve a thick, juicy texture as tender and springy as top-grade abalone. The \u0027Slow-Simmered Wild Mushroom Soup\u0027 is clear yet exceptionally rich in taste, offering a smooth warmth and earthy forest aromas. The artistic presentation and peaceful dining ambiance attract many trendy hipsters and travelers seeking inner peace.", "name": "Chanyue Vegetarian Restaurant", "transport": "Take Metro Line 3 to Yiguanmiao Station (Exit A), then walk for about 12 minutes."}, {"address": "No. 180 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province (Next to Jinli Ancient Street)", "feature": "\u2b50 4.4 stars | Located near Jinli Ancient Street, this eatery reinvents traditional Sichuan vegetarian food into modern light meals. The \u0027Sichuan Spicy Vegetarian Twice-Cooked Pork\u0027 is crafted from konjac and soy fiber, delivering flavorful, springy, and chewy slices infused with the charred aroma of stir-fried garlic sprouts and Pixian doubanjiang\u2014flawlessly recreating the savoriness of traditional twice-cooked pork without the grease. The \u0027Quinoa Wild Mushroom Warm Salad\u0027 offers a rich yet refreshing palate, pairing warm mushrooms with crunchy quinoa and fresh greens for a refreshing multi-layered bite. It\u0027s the top choice for young tourists looking to recharge after exploring Jinli.", "name": "Su Shang Light Vegetarian Restaurant", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then transfer to a bus or walk for about 10 minutes."}, {"address": "No. 98 Jule Road, Wuhou District, Chengdu City, Sichuan Province (Near Huanhuaxi Park and Du Fu Thatched Cottage)", "feature": "\u2b50 4.3 stars | Located in Wuhou District near Huanhuaxi Park, this restaurant is renowned for its high-quality, health-nourishing vegetarian dishes. The signature \u0027Steamed Pumpkin with Lily Bulbs\u0027 features sweet mountain pumpkin and fresh lily bulbs\u2014soft, dense, melting in your mouth with a pleasant, subtle sweetness. The \u0027Golden Broth Vegetarian Lion\u0027s Head Meatball\u0027 is made from finely minced tofu, shiitake mushrooms, and bean curd skin, fully absorbing a golden vegetable broth; it bursts with juicy flavors upon biting, offering a soft and exceptionally delicate texture. With its quiet and elegant ambiance, it is a local secret spot for old Chengdu residents taking out-of-town friends to taste refined, healthy Sichuan vegetarian cuisine.", "name": "Baihe Tianguan Vegetarian Restaurant", "transport": "Take Metro Line 5 to Provincial Orthopedic Hospital Station (Exit B), then walk for about 7 minutes."}, {"address": "No. 16 East Caotang Road, Qingyang District, Chengdu City, Sichuan Province (Near East Gate of Du Fu Thatched Cottage)", "feature": "\u2b50 4.5 stars | Adjacent to the Du Fu Thatched Cottage scenic area, the restaurant takes its name from the Daoist philosophy of Wu Wei (effortless action), emphasizing the natural flavor of ingredients. The \u0027Steamed Vegetarian Crab Meat\u0027 blends carrots, potatoes, and tofu perfectly, paired with ginger-vinegar dipping sauce for a tender, savory, smooth flavor with astonishingly realistic texture that remains light and clean. The \u0027Handmade Bamboo Shoot Vegetarian Spring Rolls\u0027 are fried to a golden crunch, packed with sweet, crisp fresh bamboo shoots that crackle loudly with every bite. The antique decor and exquisite craftsmanship are highly praised by culture enthusiasts and international tourists.", "name": "Wuwei Vegetarian Restaurant", "transport": "Take Metro Line 4 to North Caotang Road Station, then walk for about 12 minutes."}, {"address": "No. 33 Ximianqiao Street, Wuhou District, Chengdu City, Sichuan Province (Near Wuhou Shrine)", "feature": "\u2b50 4.2 stars | Located near the Wuhou Shrine scenic area, this spot offers a great value-for-money and incredibly diverse vegetarian buffet. Featuring dozens of freshly cooked Sichuan vegetarian dishes, the signature \u0027Spicy Vegetarian Kung Pao Chicken\u0027 uses lion\u0027s mane mushrooms stir-fried with peanuts and dried chili peppers\u2014crispy outside, tender inside, tangy, mild spicy, and wonderfully chewy. The \u0027Freshly Made Vegetarian Dim Sum and Wontons in Chili Oil\u0027 have smooth, springy skins with flavorful fillings, drizzled with special spicy chili oil for a mouthwatering hit. Reasonable prices and abundant choices make it a frequent haunt for budget travelers and locals.", "name": "Lianpu Fanyin Vegetarian Buffet", "transport": "Take Metro Line 3 to Yiguanmiao Station (Exit B), then walk for about 6 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Zhangfei Beef is an iconic local snack in Jinli Ancient Street. Black and shiny on the outside, it reveals a rosy red meat when sliced. Each bite is dry-cured, savory, and wonderfully chewy, unleashing layers of spicy, numb, and salty flavors in your mouth. Traditionally cured and roasted, the beef is satisfyingly chewy without being dry or tough, packed with rich aromatic spices. Tourists love the exquisite packaging and live slicing/tasting samples. There are even performers dressed as Zhang Fei from the Three Kingdoms slicing meat on-site, offering a double delight for both the eyes and taste buds.", "name": "Jinli Zhangfei Beef", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station (Exit D), then walk about 10 minutes to reach Jinli."}, {"address": "Jinli Snack Street, No. 231 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.1 stars | Sandapao is one of Chengdu\u0027s most famous traditional handcrafted glutinous rice snacks. During preparation, the artisan forcefully throws sticky rice balls against copper trays, creating three loud \u0027clang clang clang\u0027 sounds before they bounce into a bamboo basket filled with roasted soybean powder, topped off with rich brown sugar syrup. Soft, chewy, and non-sticky, the sweet brown sugar and fragrant soybean powder melt on your tongue in beautiful layers. Its fun, performance-like preparation makes it a huge hit among tourists.", "name": "Jinli Traditional Sandapao (Three Cannon Rice Balls)", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then walk about 10 minutes to enter Jinli Ancient Street."}, {"address": "No. 2-8, Caotang North Road, Qingyang District, Chengdu City, Sichuan Province (near Du Fu Thatched Cottage)", "feature": "\u2b50 4.6 stars | Danhonggao (egg pancake) is a legendary street snack that Chengdu locals grew up with, and He Ji is a highly popular time-honored shop near Du Fu Thatched Cottage. Made fresh to order, the small round pancakes are slightly crispy on the outside and soft and fluffy inside, bursting with rich milk and egg aromas. Filling choices are remarkably diverse\u2014ranging from classic cream pork floss and peanut sesame to spicy cowpea beef. The delightful mix of sweet and savory flavors is instantly addictive, making it a must-try walking snack after exploring the cottage.", "name": "He Ji Danhonggao (Egg Pancakes)", "transport": "Take Metro Line 4 to Caotang North Road Station (Exit B), then walk about 5 minutes."}, {"address": "No. 180-1 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A hugely popular cold-pot skewer shop near Wuhou Shrine. Fresh meats and vegetables are skewered on bamboo sticks and steeped in specially crafted red chili oil or rattan pepper broth. The red oil flavor is rich, spicy, and fragrant with white sesame, while the rattan pepper flavor is fresh, numbly tingling, and refreshing. The skewers absorb all the savory broth\u2014vegetables stay crunchy, chicken remains tender, and gizzards give a delightful snap. It\u0027s the ultimate choice for experiencing Chengdu\u0027s famous street skewers.", "name": "Ye Popo Bobo Chicken (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 8 minutes."}, {"address": "Snack Stall next to the Stage, Jinli Ancient Street, No. 231 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.2 stars | Also known as \u0027Swan Eggs,\u0027 Tangyou Guozi is one of Chengdu\u0027s most historic fried desserts. Glutinous rice dough balls are slow-fried in caramel-infused oil until golden and puffed up, coated with a sweet brown sugar glaze, and sprinkled with white sesame seeds. Taking a bite yields a satisfyingly loud crunch on the outside, revealing a light, hollow, and soft chewy center. The aromas of caramel and sticky rice burst together in a perfectly balanced sweetness\u2014a classic street food served on bamboo skewers to enjoy on the go.", "name": "Jinli Traditional Tangyou Guozi (Sugar Oil Fruit)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), then walk into Jinli Ancient Street near the stage."}, {"address": "Jinli Folk Cultural Zone, No. 231 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Hand-rubbed using natural nicandra seeds, this traditional ice jelly features delicate natural micro-bubbles in the bowl. It boasts a silky-smooth, melt-in-your-mouth texture far superior to ordinary gelatin-based jellies. Served with thick traditional brown sugar syrup, hawthorn flakes, raisins, sweet fermented rice wine, and crushed peanuts, it delivers a refreshing mix of cool, sweet, tangy, and crunchy notes\u2014the ultimate refreshing dessert for hot summer days or cooling down after spicy Sichuan food.", "name": "Jinli Hand-Rubbed Ice Jelly", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station, then walk about 10 minutes into Jinli Ancient Street."}, {"address": "Snack Alley, Jinli Ancient Street, No. 231 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.0 stars | Ye\u0027er Ba is a traditional Sichuan steamed cake made by wrapping glutinous rice dough in pomelo or banana leaves before steaming. The outer skin is delightfully sticky and chewy, infused with a subtle natural leaf aroma. The most popular savory filling\u2014pork with preserved mustard greens\u2014bursts with savory juices upon biting, seamlessly blending rich pork fat with chewy rice dough. With its rustic local flavor and convenient handheld format, it remains a favorite choice for visitors sampling authentic Sichuan steamed snacks in Jinli.", "name": "Jinli Traditional Ye\u0027er Ba (Leaf-Wrapped Rice Dumpling)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 10 minutes to Jinli Snack Alley."}, {"address": "No. 242 Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | A classic hot and sour pork intestine noodle shop located near the Wuhou Shrine commercial district. Made primarily from pure sweet potato starch, the noodles are silky, springy, and nicely chewy. The rich broth is slow-simmered, and the pork intestines are impeccably cleaned, tender, rich, and entirely odor-free. Pairing it with a freshly fried crispy beef Guankun Guokui (savory stuffed flatbread) dipped into the spicy, tangy broth allows the crust to absorb the flavorful soup while staying partially crispy\u2014a savory delight loved by locals and tourists alike.", "name": "Baijia Gaoji Pork Intestine Noodles", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then walk about 7 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Wuhou Shrine, Jinli, and Du Fu Thatched Cottage"}};
        const themeHex = "#d97706";
        const cityName = "Chengdu";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
