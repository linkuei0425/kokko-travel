          "@type": "Restaurant",
          "name": "Pan Sun Shi Restaurant",
          "description": "⭐ 4.5 stars | Founded in 1925, this century-old braised delicacy brand takes its name from a classic poem line meaning 'Though the dishes are served on simple platters from afar, the cuisine is exquisite.' It is most famous for its secret-recipe braised meats and braised duck, featuring a vibrant reddish color and rich aroma. The skin is crispy, the meat tender, and the rich, savory braised flavor penetrates to the bone, creating a complex, classic Sichuan taste. Old Chengdu locals highly praise their takeout braised food packs and large steamed buns. Every afternoon, a queue of eager local foodies and tourists forms outside, making it a premier landmark to experience traditional Chengdu food culture.",

        "item": {
          "@type": "Restaurant",
          "name": "Chen Mapo Tofu (Daqiang East Street Branch)",
          "description": "⭐ 4.6 stars | As the birthplace of world-renowned Mapo Tofu, Chen Mapo Tofu carries over a century of traditional culinary craftsmanship. Its classic Mapo Tofu is famed for eight defining traits: numbing, spicy, scalding, aromatic, crispy, tender, fresh, and lively. The tofu is silky smooth yet intact, deeply infused with flavor. Specially selected Hanyuan Sichuan pepper and Pixian broad bean paste combine to create an exhilarating balance of numbing spice and rich aroma, with every bite bursting with crispy minced beef and savory red oil. Paired with a bowl of steamed white rice, it is a match made in heaven, highly recommended by food lovers of authentic heavy-flavor Sichuan cuisine and global tourists alike.",

          "description": "⭐ 4.3 stars | A century-old China Time-Honored Brand dessert shop, famous far and wide for its sticky rice balls (tangyuan) that 'never break while boiling, feature thin skins with rich fillings, and are sweet without being cloying.' Made from high-quality water-milled glutinous rice flour, the skin is fine, chewy, and non-sticky. The filling blends black sesame, pork lard, and white sugar seamlessly. One bite releases a piping hot, fragrant black sesame filling that coats the palate. Locals love coming here after spicy Sichuan meals to enjoy a hot bowl of black sesame or fermented glutinous rice tangyuan to soothe their taste buds with subtle sweetness—a must-visit spot to experience Chengdu's slow-paced dessert culture.",

      },
      {
        "@type": "ListItem",

        "item": {
          "@type": "Restaurant",
          "name": "Zhong Dumplings (Tidu Street Branch)",
          "description": "⭐ 4.1 stars | A famous traditional Chengdu street snack created in 1893. Unlike ordinary boiled dumplings, Zhong Dumplings feature an all-pork filling with no added vegetables. Once boiled, the dumplings are doused in a special red chili oil sauce and house-made sweet aromatic soy sauce. Thin-skinned, packed with meat, and satisfyingly chewy, they deliver a uniquely rich, slightly sweet, and aromatic spicy flavor without feeling greasy. This distinctive blend of sweet, savory, numbing, and spicy represents quintessential old Chengdu taste. With excellent value for money and a century-long record of consistent quality, it is a must-try local snack when strolling around Chunxi Road.",

            "@type": "PostalAddress",

        const db = {"chunxi_taikooli": {"categories": {"cat_1": {"items": [{"address": "No. 64 Huaxing Front Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.5 stars | Founded in 1925, this century-old braised delicacy brand takes its name from a classic poem line meaning \u0027Though the dishes are served on simple platters from afar, the cuisine is exquisite.\u0027 It is most famous for its secret-recipe braised meats and braised duck, featuring a vibrant reddish color and rich aroma. The skin is crispy, the meat tender, and the rich, savory braised flavor penetrates to the bone, creating a complex, classic Sichuan taste. Old Chengdu locals highly praise their takeout braised food packs and large steamed buns. Every afternoon, a queue of eager local foodies and tourists forms outside, making it a premier landmark to experience traditional Chengdu food culture.", "name": "Pan Sun Shi Restaurant", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit D and walk for about 8 minutes."}, {"address": "No. 61 Chengshou Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.2 stars | Founded in the 1940s, this is the iconic representative of Chengdu\u0027s thin-skinned, tender-filled chao shou (wontons), located in the heart of the Chunxi Road commercial district. Long Chao Shou\u0027s specialty lies in its paper-thin, silky, yet pliable wrappers wrapping fresh, juicy pork filling, served in a rich broth slow-simmered from old hens and pork marrow bones. The spicy red-oil wontons are fiery without being harsh, with a deep, numbing aroma. You can also order a set menu featuring dozens of classic local snacks like Zhong Dumplings and Lai Tangyuan, allowing tourists to savor authentic traditional Chengdu flavors all in one go.", "name": "Long Chao Shou (Main Store)", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit D and walk for about 3 minutes."}, {"address": "No. 9 Daqiang East Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | As the birthplace of world-renowned Mapo Tofu, Chen Mapo Tofu carries over a century of traditional culinary craftsmanship. Its classic Mapo Tofu is famed for eight defining traits: numbing, spicy, scalding, aromatic, crispy, tender, fresh, and lively. The tofu is silky smooth yet intact, deeply infused with flavor. Specially selected Hanyuan Sichuan pepper and Pixian broad bean paste combine to create an exhilarating balance of numbing spice and rich aroma, with every bite bursting with crispy minced beef and savory red oil. Paired with a bowl of steamed white rice, it is a match made in heaven, highly recommended by food lovers of authentic heavy-flavor Sichuan cuisine and global tourists alike.", "name": "Chen Mapo Tofu (Daqiang East Street Branch)", "transport": "Take Chengdu Metro Line 1 or Line 4 to Luomashi Station, and walk about 7 minutes from the exit; or walk about 10 minutes from the Chunxi Road Commercial Area."}, {"address": "No. 27 Zongfu Road, Jinjiang District, Chengdu City", "feature": "\u2b50 4.3 stars | A century-old China Time-Honored Brand dessert shop, famous far and wide for its sticky rice balls (tangyuan) that \u0027never break while boiling, feature thin skins with rich fillings, and are sweet without being cloying.\u0027 Made from high-quality water-milled glutinous rice flour, the skin is fine, chewy, and non-sticky. The filling blends black sesame, pork lard, and white sugar seamlessly. One bite releases a piping hot, fragrant black sesame filling that coats the palate. Locals love coming here after spicy Sichuan meals to enjoy a hot bowl of black sesame or fermented glutinous rice tangyuan to soothe their taste buds with subtle sweetness\u2014a must-visit spot to experience Chengdu\u0027s slow-paced dessert culture.", "name": "Lai Tangyuan (Zongfu Road Branch)", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit A and walk for about 6 minutes."}, {"address": "Shop 2306, 2F, East Lane, Sino-Ocean Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.7 stars | Originating in 1923 in Meishan, Leshan, this century-old Sichuan culinary legend seamlessly merges traditional cooking techniques with refined modern presentation, earning a spot on the Michelin Bib Gourmand list. Its signature dish, Xuewang (spicy duck blood pudding), is as silky smooth as tofu, cooked in fresh spicy red oil with crisp bean sprouts for a perfectly numbing and savory delight. The Traditional Crispy Steamed Pork with Rice Flour and Kung Pao Chicken also demonstrate deep culinary mastery, boasting precise balances of sweet, sour, spicy, and numbing flavors. Combining classic teahouse culture with a chic modern aesthetic, the restaurant is immensely popular among younger generations and travelers, drawing huge crowds lining up for queue numbers long before doors open every day.", "name": "Mawangzi Sichuan Restaurant", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Exit C leads directly into Taikoo Li; walk about 3 minutes to reach the restaurant."}, {"address": "No. 99 Tidu Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.1 stars | A famous traditional Chengdu street snack created in 1893. Unlike ordinary boiled dumplings, Zhong Dumplings feature an all-pork filling with no added vegetables. Once boiled, the dumplings are doused in a special red chili oil sauce and house-made sweet aromatic soy sauce. Thin-skinned, packed with meat, and satisfyingly chewy, they deliver a uniquely rich, slightly sweet, and aromatic spicy flavor without feeling greasy. This distinctive blend of sweet, savory, numbing, and spicy represents quintessential old Chengdu taste. With excellent value for money and a century-long record of consistent quality, it is a must-try local snack when strolling around Chunxi Road.", "name": "Zhong Dumplings (Tidu Street Branch)", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit D and walk for about 10 minutes."}, {"address": "No. 103 Huaxing Front Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.0 stars | Established during the Guangxu reign of the late Qing Dynasty, this historic pastry and steamed bun house boasts over a century of heritage. Han Baozi is famous for its \u0027delicate white dough, neat pleats, thin skin with abundant filling, and tender succulent meat.\u0027 Its classic fresh pork baozi uses premium front-leg pork blended with bone broth filling; biting into the pillowy dough releases a burst of savory, rich broth. Other delicious options include yacai (pickled mustard greens) shaomai and char siu buns. Local neighbors love coming here in the morning for a steamer basket of piping hot baozi paired with a bowl of rice porridge to enjoy the most authentic old Chengdu morning atmosphere.", "name": "Han Baozi (Huaxing Street Branch)", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit D and walk for about 7 minutes."}, {"address": "No. 14 Nanxin Street, Jinjiang District, Chengdu City", "feature": "\u2b50 4.4 stars | An iconic time-honored eatery representing one of Chengdu\u2019s most famous traditional street delicacies, renowned throughout Sichuan for authentic spicy and spiced (five-spice) braised rabbit heads. Braised painstakingly with dozens of Chinese herbs and spices, the meat is tender, succulent, and deeply seasoned, effortlessly pulling off the bone. The red-oil spicy flavor packs a fiery, exhilarating kick, while the five-spice version is rich, savory, and lingeringly sweet. This unique dining experience and irresistible taste often turn hesitant first-timers into lifelong addicts. It is a must-visit destination to experience old Chengdu\u0027s late-night food scene and authentic street food culture.", "name": "Shuangliu Laoma Rabbit Head (Chunxi Road Branch)", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station. Take Exit E1 and walk for about 5 minutes."}], "name": "Famous Traditional Local Eateries"}, "cat_2": {"items": [{"address": "Shop 1225b, 1F, Chengdu Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | Situated within the traditional Western Sichuan-style architecture of Chengdu Taikoo Li, % Arabica seamlessly blends Japanese minimalism with local green tiles and wooden structures. The signature Spanish Latte is smooth and delightfully sweet, striking a perfect balance between rich espresso and subtle condensed milk. Their classic Latte boasts deep nutty and dark chocolate notes with velvety microfoam. Tourists love sitting at the outdoor tables, sipping rich coffee while taking in the vibrant streetscape where history meets modernity\u2014making it one of Taikoo Li\u0027s most iconic check-in spots.", "name": "% Arabica (Chengdu Taikoo Li)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 5 minutes."}, {"address": "No. 39 Huatangjing Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.7 stars | Founded by a champion of the China Barista Championship, this specialty coffee shop is tucked away on quiet Huatangjing Street next to Taikoo Li. The signature \u0027Dirty\u0027 uses a medium-dark roast espresso poured over chilled, rich milk. The first sip delivers a thrilling contrast of hot, intense cocoa notes meeting cold milk, followed by rich, layered undertones of hazelnut and butter. Their unyielding dedication to coffee bean quality makes this a holy grail for local coffee lovers and visiting geeks alike.", "name": "Let\u0027s Grind Specialty Coffee", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit E2), and walk for about 8 minutes."}, {"address": "No. 62 Huatangjing Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.5 stars | Combining industrial concrete aesthetics with an ultimate sensory experience, this independent cafe focuses on in-house roasted single-origin pour-overs. Their signature light-roast sun-dried Ethiopian pour-over opens with bright, refreshing citrus acidity and elegant jasmine aromas, finishing with a clean body and peach-like sweetness. Beyond excellent coffee, their freshly baked buttery croissants are crispy, flaky, and rich in flavor. It\u0027s a favorite spot for trendy youth and travelers looking for an exquisite brunch or afternoon tea.", "name": "Sensory Bunker", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit E2), and walk for about 7 minutes."}, {"address": "No. 100 Huatangjing Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | Tucked away in an alley off Huatangjing Street, this hip cafe is famous for its clean, modern space and creative signature drinks. The smash-hit \u0027Chengdu Special\u0027 blends local pomelo jam with cold brew coffee, creating a refreshing bubbly sensation with sweet-and-sour citrus notes\u2014perfect for summer. Their signature Flat White features silky microfoam and a lingering coffee aroma. With its relaxed atmosphere, it serves as a cozy secret hideaway for locals escaping the hustle and bustle of Chunxi Road for a leisurely brunch.", "name": "INVISIBLE COFFEE", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit E2), and walk for about 9 minutes."}, {"address": "Shop 1112b, 1F, Chengdu Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.4 stars | Located in the heart of Taikoo Li, this retro American specialty cafe exudes preppy ivy-league style with its signature green-and-white color palette. The signature Ralph\u0027s Espresso pairs wonderfully with their specialty chocolate cake\u2014moist, rich, and balanced\u2014complemented by a nutty latte. During brunch hours, the freshly toasted Avocado \u0026 Egg Toast features crispy bread topped with creamy mashed avocado and a soft-boiled egg, offering a smooth, flavorful bite that draws fashionistas and tourists alike for photogenic moments and chic American brunch.", "name": "Ralph\u0027s Coffee (Chengdu Taikoo Li)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 4 minutes."}, {"address": "No. 166 Xiadong Avenue, Jinjiang District, Chengdu", "feature": "\u2b50 4.7 stars | As one of the early pioneers that kicked off Chengdu\u0027s specialty coffee wave, UID Cafe features a vintage American biker and workwear aesthetic. They offer an extensive menu of single-origin pour-overs. Their signature Iced Americano uses dark roast beans, offering a pleasant bitterness balanced with deep cocoa and caramel sweetness. Pair it with their impressive homemade savory quiche\u2014featuring a flaky crust and rich, velvety egg-and-cheese filling\u2014which explains why this venue remains an enduring icon in Chengdu\u0027s coffee scene.", "name": "UID Cafe (Taikoo Li)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit E2), and walk for about 6 minutes."}, {"address": "No. 5 Shuanglaojing Lane, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | Hailing from Berlin, Germany, this acclaimed specialty coffee brand brings top-tier European roasting craftsmanship to the Taikoo Li neighborhood. Their signature Cheesecake is widely celebrated as top-tier\u2014velvety smooth and dense, harmonizing rich cheese flavors with a buttery biscuit crust. Pair it with a warm Oat Milk Latte, where natural oat sweetness nicely complements subtle coffee bitterness for a comforting, multi-layered sip. An unmissable European treat for visitors and coffee aficionados.", "name": "Five Elephant Coffee (Chengdu)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit E2), and walk for about 10 minutes."}, {"address": "Shop 1243, 1F, Chengdu Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.3 stars | A hugely popular health-focused brunch eatery in Taikoo Li, serving fresh, wholesome dishes and premium coffee. Their signature Acai Bowl is vibrant and refreshing, loaded with tangy berry puree, sliced banana, blueberries, and crunchy nuts. Pair it with a freshly blended fruit smoothie or a warm Cappuccino topped with rich, thick foam. The lively, relaxed outdoor seating area makes it a top choice for health-conscious travelers and expats soaking up a sunny brunch.", "name": "Moka Bros (Chengdu Taikoo Li)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 5 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "At Dongfeng Bridge Head, No. 1 Dacisi Road, Jinjiang District, Chengdu (near Sino-Ocean Taikoo Li)", "feature": "\u2b50 4.8 stars | Originating from Meishan as a century-old Sichuan cuisine establishment, Mawangzi seamlessly blends traditional Sichuan essence with modern bistro style. Their signature \u0027Mao Xue Wang\u0027 (Spicy Duck Blood \u0026 Tripe Stew) features a numbingly spicy, aromatic broth with silky duck blood, crunchy tripe, and spam, creating rich layers of texture. The \u0027Kung Pao Chicken\u0027 is tender and juicy with a perfect balance of sweet, sour, spicy, and numbing flavors, complemented by crunchy cashews for an irresistible bite. Beyond top-tier local Sichuan dishes, they offer infused flower/fruit rice wines and handcrafted cocktails inspired by Sichuan flavors. Featuring antique-chic yet stylish decor, it is the top recommended bistro for both tourists and local foodies.", "name": "Mawangzi Sichuan Bistro", "transport": "Take Chengdu Metro Line 2 or Line 3 to Chunxi Road Station (Exit C), and walk for about 8 minutes."}, {"address": "Shop 2207, L2 Floor, Sino-Ocean Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | A trendy Sichuan restaurant brand located in Sino-Ocean Taikoo Li, famous for creative culinary presentations and a modern, sleek dining environment. Its signature dish, \u0027Cherry Pork\u0027 (braised pork belly), looks ruby-red and translucent like real cherries; the melt-in-your-mouth fat-and-lean pork belly is sweet without being greasy, making it appetizingly tangy and sweet. The \u0027Chengdu Saliva Chicken\u0027 features a rich, spicy, and sesame-laden sauce over crispy-skinned, tender chicken. Combining craft beers with unique local cocktails, it satisfies young diners\u0027 quest for refined food and beverage pairings\u2014ideal for both friend gatherings and romantic dates.", "name": "Chaimen Fan\u0027er", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit C), enter Sino-Ocean Taikoo Li, and walk for about 5 minutes."}, {"address": "2F, No. 36 Xiadongdajie Section, Dongdajie, Chunxi Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.7 stars | Taode Casserole is a long-beloved local specialty Sichuan restaurant in Chengdu, renowned for its piping-hot clay pot stews and exceptionally warm service. A must-order, the \u0027Garlic Pork Ribs\u0027 are slow-simmered in clay pots until the meat effortlessly falls off the bone, packed with robust garlic aroma and melt-in-your-mouth tender flavor. The \u0027Braised Beef with Lettuce Stem and Potatoes\u0027 features large, tender chunks of savory beef and velvety potatoes, served with a rich gravy perfect for pouring over rice. The house-brewed rice and fruit wines are sweet and lightly boozy, offering a refreshing contrast to the hot dishes\u2014a massive hit among both tourists and locals.", "name": "Taode Casserole (Chunxi Road Branch)", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit E1), and walk for about 3 minutes."}, {"address": "No. 15 Dacisi Road, Jinjiang District, Chengdu (near Sino-Ocean Taikoo Li)", "feature": "\u2b50 4.7 stars | Xu\u0027s Cuisine represents fine dining in Chengdu\u0027s culinary scene, specializing in innovative fusions of high-end and refined regional Sichuan dishes. The signature \u0027Green Sichuan Pepper Squab\u0027 features crispy skin and juicy meat with a subtle refreshing numb from green peppercorns, leaving a memorable finish. The \u0027Sichuan Camphor Tea Duck\u0027 boasts crispy skin, tender meat, delicate smoky tea notes, and rich aromatic spices. The elegant and peaceful interior offers high-end sommelier service with a curated selection of fine wines and specialty Chinese spirits, beautifully highlighting the sophistication of modern Sichuan culinary art.", "name": "Xu\u0027s Cuisine (Taikoo Li Branch)", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit C), and walk for about 6 minutes."}, {"address": "No. 25 Beixin Street, Jinjiang District, Chengdu (near Chunxi Road Pedestrian Street)", "feature": "\u2b50 4.5 stars | Tucked away next to the Chunxi Road and Taikoo Li shopping precincts, this garden-courtyard bistro blends scenic greenery with refined local Sichuan cuisine. Their signature \u0027Boiled Fish with Fresh Green Peppers\u0027 uses live fresh fish sliced wafer-thin and silky tender, elevated by the bright numbing kick of green peppercorns. The \u0027Pork Slices with Garlic Sauce\u0027 are sliced paper-thin with balanced fat and lean meat, thoroughly coated in a rich red-oil sauce for a smooth, savory bite. At night, sparkling lights paired with bartenders crafting unique Zhuyeqing green tea liquor cocktails create a romantic and magical ambiance.", "name": "Titian Courtyard Bistro", "transport": "Take Metro Line 1 or Line 2 to Tianfu Square Station or Chunxi Road Station, and walk for about 7 minutes."}, {"address": "Shop 1105, 1F, West Lane, Sino-Ocean Taikoo Li, No. 8 Zhongshamao Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.4 stars | The flagship Chengdu store of a nationwide popular hybrid bistro-bar brand in Taikoo Li, combining an American-style casual bistro with a drink supermarket concept. The menu spans delicious American classics and Sichuan-fusion bar snacks, such as \u0027Sichuan Spicy Crispy Chicken Wings\u0027\u2014crispy on the outside, juicy inside, with a deeply satisfying spicy kick\u2014and the \u0027Black Pepper \u0026 Onion New York Strip Steak\u0027, cooked to precise perfection for a hearty, juicy bite. Featuring a massive self-serve alcohol wall stocked with hundreds of craft beers and wines from around the world, its expansive layout and vintage industrial style make it a night-out favorite for young crowds and social gatherings.", "name": "COMMUNE Bistro \u0026 Bar (Taikoo Li)", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit C), and walk for about 4 minutes into Taikoo Li West Lane."}, {"address": "2F, Champagne Plaza, No. 21 Xiadongdajie, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | A bistro specializing in Xichang-style bamboo skewers BBQ and local specialty liquors, bringing rich Liangshan Yi ethnic flavor to Chengdu\u0027s commercial area. The signature \u0027Highland Dayingpan Suckling Pork\u0027 uses authentic alpine piglets, grilled in large chunks until golden and crispy with rich, fragrant fat and collagen; dipped in spicy dry rub, it is tender and pleasantly chewy. The \u0027Grilled Oysters\u0027 are plump and fresh, topped with a spicy, savory garlic sauce. Paired with Xichang\u0027s native \u0027Kujiu\u0027 (bitter buckwheat liquor) or crisp craft beer, it cleanses the palate while enhancing the flavors in a lively, electric atmosphere.", "name": "Zui Xichang BBQ \u0026 Bistro", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit E2), and walk for about 2 minutes."}, {"address": "No. 15 Zongfu Road, Jinjiang District, Chengdu (near the entrance of Chunxi Road Pedestrian Street)", "feature": "\u2b50 4.5 stars | Shufu Yanyu is an upgraded concept of a highly reputable long-standing Sichuan restaurant brand in Chengdu, cleverly merging traditional Sichuan dishes with modern wine-and-dine culture. The signature \u0027Rattan Pepper Bobo Chicken\u0027 features firm, juicy chicken steeped in vivid green rattan pepper oil, offering an addictively fresh, tingling kick. The \u0027Dongpo Roasted Pork Knuckle\u0027 has a crispy outer skin and melt-in-your-mouth tender interior; dipped in spicy chili powder, it is utterly satisfying. Featuring an independent bar serving fruit wines brewed from local Sichuan fruits like green plum and pomegranate along with specialty cocktails, it is widely praised for family reunions and tourist visits.", "name": "Shufu Yanyu Restaurant \u0026 Bistro", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station (Exit D), and walk for about 5 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside The Temple House, No. 81 Bitieshi Street, Jinjiang District, Chengdu (Near Sino-Ocean Taikoo Li)", "feature": "\u2b50 4.7 stars | A Michelin-starred vegetarian restaurant located in The Temple House at Taikoo Li. It seamlessly blends classic courtyard architecture with modern minimalist design. Signature dishes like the \u0027Mi Xun Vegetarian Sea Urchin\u0027 and \u0027Truffle \u0026 Wild Mushroom Soup Dumplings\u0027 feature delicate, chewy skins that burst with rich, savory mushroom aromas and juicy, multi-layered textures\u2014exquisitely seasoned without being greasy. Their special Tibetan tea-infused vegetarian dim sum is a treat for both the eyes and taste buds, highly favored by discerning tourists and local foodies alike.", "name": "Mi Xun Tea House", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 5 minutes."}, {"address": "Inside Daci Temple, No. 23 Dacisi Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.3 stars | Nestled inside the historic Daci Temple in the heart of Taikoo Li, this is an excellent spot to experience Chengdu\u0027s thousand-year-old Zen culture alongside traditional vegetarian cuisine. Signature dishes like \u0027Vegetarian Double-Cooked Pork\u0027 and \u0027Mapo Tofu\u0027 use konjac, soy products, and wild mushrooms to replicate a remarkably chewy, meat-like texture. Stir-fried with authentic Pixian Doubanjiang (chili bean paste), they offer a bold, spicy, savory, and satisfying flavor that rivals real meat. Affordable prices and a warm local vibe make this a must-visit for tourists and temple-goers alike.", "name": "Daci Temple Vegetarian Restaurant", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk about 3 minutes into Daci Temple at Taikoo Li."}, {"address": "4th Floor, Times Square, No. 2 Zongfu Road, Chunxi Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | A pioneer in modern vegetarian hot pot using Ya\u0027an Tibetan tea as its soup base, perfectly combining healthy wellness with Sichuan spicy flavors. The broth is smooth and soothing, featuring subtle tea aromas and mushroom sweetness without feeling overly heavy or inflammatory. Highlights like the \u0027Cauliflower Mushroom\u0027 and \u0027Handmade Vegetarian Meatballs\u0027 are tender, crisp, and deeply flavorful. The cozy, elegant wooden decor and individual hot pot setup make it exceptionally popular among young diners and female travelers.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hot Pot", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit D), and walk for about 4 minutes."}, {"address": "No. 40 Beixin Street, Jinjiang District, Chengdu (Near Chunxi Road Commercial Area)", "feature": "\u2b50 4.4 stars | An incredibly budget-friendly vegan buffet in Chengdu offering dozens of refined plant-based dishes, handmade snacks, and nourishing soups daily. Popular items include the \u0027Vegetarian Zha Jiang Noodles\u0027 with chewy noodles in a rich, savory bean sauce, and the \u0027Crispy Vegetarian Cutlet\u0027 with a golden, crunchy exterior and soft, tender interior. The unbeatable price and wide variety attract crowds of students, office workers, and travelers looking to taste local plant-based comfort food.", "name": "Su Man Xiang Vegetarian Buffet", "transport": "Take Metro Line 1 or 2 to Tianfu Square Station, or Line 2/3 to Chunxi Road Station, and walk for about 7 minutes."}, {"address": "No. 8 Zhongsha Street, Jinjiang District, Chengdu (East side of Taikoo Li)", "feature": "\u2b50 4.5 stars | A long-standing, famous Sichuan-style vegetarian restaurant that infuses traditional culinary techniques into plant-based ingredients. The signature \u0027Spicy Poached Vegetarian Fish\u0027 uses premium konjac and tofu skin to create delicate, springy \u0027fish\u0027 slices simmered in a vibrant, numbing red-oil broth that is deeply satisfying without irritating the stomach. Surrounded by serene traditional decor and gentle Guzheng music, it offers both exquisite dishes and traditional tea service\u2014a top choice for experiencing Sichuan vegetarian dining.", "name": "Qingshui Hehua Vegetarian \u0026 Tea House", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 6 minutes."}, {"address": "3rd Floor, Languang Building, No. 45 Qingshiqiao North Street, Jinjiang District, Chengdu (Near Chunxi Road)", "feature": "\u2b50 4.5 stars | A nationally renowned, high-end vegetarian chain famous for its healthy philosophy: no MSG, no eggs, no smoking, and no alcohol. The signature \u0027Black Pepper Vegetarian Steak\u0027 is seared outside and juicy inside, packed with savory flavor and topped with a rich black pepper sauce. The \u0027Black Truffle Fried Rice\u0027 features distinct, fluffy grains infused with earthy mushroom aromas. With an elegant modern Chinese ambiance and warm service, it earns rave reviews from families and visiting tourists alike.", "name": "Date Tree Vegetarian Restaurant", "transport": "Take Metro Line 1 or 2 to Tianfu Square Station (Exit E), and walk for about 6 minutes."}, {"address": "Near IFS International Finance Center, No. 16 Section 3, Hongxing Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.8 stars | An upscale restaurant specializing in omakase-style fine dining plant-based set menus, tucked away in a quiet lane near Chunxi Road. Each dish is crafted like a work of art; the \u0027Monkey Head Mushroom Steak\u0027, slow-cooked for hours at low temperatures, is thick, juicy, and rich in earthy flavors with a tender texture comparable to fine cut meat. Paired with organic seasonal greens and herbal teas, every course offers a captivating tasting journey. The Zen-inspired private dining experience is truly unforgettable.", "name": "Chan Yue Vegetarian Restaurant", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (IFS Exit), and walk for about 3 minutes."}, {"address": "No. 54 Dacisi Road, Jinjiang District, Chengdu (Around Sino-Ocean Taikoo Li)", "feature": "\u2b50 4.4 stars | A modern plant-based restaurant tailored for the younger generation, fusing western cooking techniques with Asian ingredients. The popular \u0027Truffle \u0026 Wild Mushroom Veggie Burger\u0027 features a plant-based patty, saut\u00e9ed mushrooms, and vegan cheese\u2014delivering a crispy, juicy, flavor-packed bite. The \u0027Thai Tom Yum Veggie Noodle Soup\u0027 offers a zesty, appetite-stimulating broth with noodles that absorb all the delicious flavors. Its trendy industrial-style decor makes it a hit among young foodies and international travelers.", "name": "Shu Shi Jie Modern Vegetarian", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station (Exit C), and walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Shudian Street, Jinjiang District, Chengdu (Near Taikoo Li)", "feature": "\u2b50 4.6 Stars | Chengdu\u0027s iconic nostalgic street snack to enjoy while strolling. Made freshly to order, these small round pancakes feature a golden crispy exterior and a soft, cake-like interior. They offer a rich variety of sweet and savory fillings like spicy beef, pork floss, cream, and hazelnut spread. Fragrant, crispy on the outside, and soft inside, it is immensely popular among tourists and local youth.", "name": "He Ji Egg Pancake", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit E, about a 5-minute walk"}, {"address": "Snack Alley, Chunxi Road Pedestrian Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.5 Stars | A classic skewered street treat you can\u0027t miss in Chengdu\u0027s traditional markets. Glutinous rice balls are deep-fried at low temperature until golden and puffed, then coated in rich caramel and white sesame seeds. Extra crispy on the outside and chewy inside, sweet without being greasy, eating them hot while strolling offers the most authentic local experience.", "name": "Qiu Ji Sugar Oil Rice Balls", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit D, about a 3-minute walk"}, {"address": "No. 21, Xiadongdacai Street Section, Jinjiang District, Chengdu", "feature": "\u2b50 4.7 Stars | A wildly popular street snack in the Taikoo Li shopping area with huge queues. Famous for its braised chicken feet cooked until ultra-tender, where the meat effortlessly separates from the bone, melting in your mouth packed with collagen. Served with signature hot pot or spicy braised sauces, it\u0027s numbingly spicy, savory, and aromatic\u2014the ultimate walk-and-eat bowl while shopping.", "name": "Xianglong Zhuazhua - Dragon Chicken Feet (Taikoo Li Branch)", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit B, about a 4-minute walk"}, {"address": "No. 15 Zongfu Road, Jinjiang District, Chengdu", "feature": "\u2b50 4.8 Stars | An immensely popular time-honored bakery for freshly baked Guokui (crispy meat pie) in Chengdu. The freshly baked flatbread is golden and flaky with a wonderful wheat aroma. Split open and stuffed generously with cold sliced spicy beef, shredded bamboo shoots, or savory spicy pork. Each bite delivers a satisfying crunch, combining spicy, refreshing fillings with crispy crust for maximum satisfaction.", "name": "Yan Taipo Guokui - Yan\u0027s Crispy Meat Pie", "transport": "Metro Line 2 \u0027Chunxi Road Station\u0027 Exit A, about a 7-minute walk"}, {"address": "No. 48 Youzha Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 Stars | Hailing from Leshan, this cold skewered chicken is hugely popular in the Chunxi Road shopping district. Various meats and vegetables on bamboo skewers are soaked in a special cold broth topped with a rich layer of chili oil and white sesame seeds. Tender, refreshing, spicy without harshness, and rich in numbing aroma\u2014grabbing a bundle of skewers to eat while exploring offers the authentic lively vibe of Chengdu\u0027s markets.", "name": "Grandma Ye\u0027s Cold Skewers (Yebopo Boboji - Taikoo Li Branch)", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit E, about a 6-minute walk"}, {"address": "Daci Temple Road, Jinjiang District, Chengdu (Outer Block of Daci Temple, Taikoo Li)", "feature": "\u2b50 4.5 Stars | Chengdu\u0027s best refreshing dessert to soothe the heat and spice. Made from naturally hand-rubbed seeds, the ice jelly has a silky, cool, jelly-like texture. It\u0027s topped with rich brown sugar syrup, crushed peanuts, hawthorn flakes, raisins, and sweet fermented rice. It melts in your mouth\u2014sweet, delightfully cool, and an essential refreshing treat when wandering around commercial districts.", "name": "Old Chengdu Handcrafted Bingfen (Ice Jelly)", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit C, about a 5-minute walk"}, {"address": "No. 64 Huaxing Zheng Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.4 Stars | A century-old brand famed for its takeout street food lines. Their takeaway window serves freshly baked signature braised pork big buns and classic Sichuan braised delicacies daily. The bun dough is soft yet chewy, filled with uniquely seasoned braised pork bursting with rich savory juice. Braised items like duck wings and pig ears are savory, flavorful, and addictively chewy\u2014a classic local taste enjoyed since childhood.", "name": "Pansunshi Braised Delicacies \u0026 Buns", "transport": "Metro Lines 3/4 \u0027Second People\u0027s Hospital Station\u0027 Exit E, about a 6-minute walk"}, {"address": "Xiangbin Street Snack Street, Jinjiang District, Chengdu (Near Chunxi Road)", "feature": "\u2b50 4.3 Stars | A bold signature of Chengdu\u0027s night markets and street food stalls. Pig brains are grilled in tin foil boxes with chili peppers, Sichuan peppercorns, fish mint, and fermented black beans. The texture is silky and smooth like tofu, melting in your mouth without any gamey smell. The charcoal-grilled pig trotters have a crispy charred skin and a soft, chewy interior, generously dusted with spicy powder\u2014extremely popular among adventurous foodies.", "name": "Nao Hua Kao Guan - Roasted Pig Brains", "transport": "Metro Lines 2/3 \u0027Chunxi Road Station\u0027 Exit D, about a 4-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Chunxi Road, Taikoo Li and IFS"}, "dujiangyan_qingcheng": {"categories": {"cat_1": {"items": [{"address": "No. 128 Yangliuhe Street, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.6 stars | A classic noodle shop operating in Dujiangyan for decades, famous for its \u0027Red Oil Dumplings\u0027 and \u0027Mushroom Noodles\u0027. The red oil is rich and aromatic, paired with a deep, sweet aromatic soy sauce base. The dumplings have thin wrappers with generous fillings and a great chew, while the smooth noodles absorb every drop of flavorful sauce\u2014a nostalgic local comfort food.", "name": "Zhao\u0027s Noodle Shop", "transport": "Take Dujiangyan City Bus Route 4 or 7, get off at \u0027Lidui Park Station\u0027, and walk about 5 minutes to Yangliuhe Street."}, {"address": "No. 152 Jianshe Road, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.7 stars | Dujiangyan\u0027s most famous legendary spot for \u0027Sweet-Skinned Duck\u0027. Basted with special maltose syrup and roasted to a golden, crispy perfection, the skin is delightfully crunchy, while the meat remains tender, juicy, and game-free. Perfectly balancing sweet and savory without feeling greasy, it redefines roast duck and comes highly recommended by both tourists and local foodies.", "name": "Zhong Roast Duck", "transport": "Take Bus Route 1, 2, or 19 to \u0027Jianshe Road Station\u0027, then walk about 2 minutes."}, {"address": "No. 412 Jiangan Road, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.5 stars | A highly iconic legendary snack in Chengdu and Dujiangyan, offering classic Spicy and Five-Spice flavors. The rich, fiery house marinade deeply penetrates every bite, rendering the meat tender, juicy, and full of numbing spice. Nibbling on these flavorful snacks is finger-licking fun, making it the ultimate local late-night treat paired with beer.", "name": "You\u0027s Rabbit Head", "transport": "Take Bus Route 8 or 14 to \u0027Jiangan Road Intersection Station\u0027, then walk about 3 minutes."}, {"address": "Yaowang Village, Daguan Town, Dujiangyan City, Chengdu, Sichuan Province (Near the entrance of Mount Qingcheng Outer Area)", "feature": "\u2b50 4.8 stars | A legendary hidden dessert shop at the foot of Mount Qingcheng, famous for its ultra-soft and smooth \u0027Brown Sugar Sweet Fermented Rice\u0027 and \u0027Soft-Boiled Egg Sweet Fermented Rice\u0027. The rich brown sugar sweet broth is smooth, while the handcrafted fermented rice offers a delicate alcohol and fragrant rice aroma. Served warm and comforting, many hikers make a special detour here after climbing Mount Qingcheng.", "name": "Zhang\u0027s Fermented Rice", "transport": "It is recommended to take a 15-minute taxi ride from Qingcheng Mountain High-Speed Railway Station; or take the Qingcheng Mountain Scenic Area shuttle bus to Daguan Town and transfer to a local minibus."}, {"address": "Near the intersection of Yangliuhe Street and Xuanhua Street, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.4 stars | A unique, nostalgic traditional snack exclusive to Dujiangyan. Paper-thin handmade wrappers enclose crisp, shredded celtuce and kelp into cute mini rolls. Dipped in the shop\u0027s secret sweet-and-sour spicy sauce, every bite is refreshingly tangy, zesty, and addictively crunchy\u2014you won\u0027t be able to stop eating!", "name": "Guo\u0027s Cong Cong Juan", "transport": "Take Bus Route 4 or 7 to \u0027Yangliuhe Station\u0027, then walk about 3 minutes along the Yangliuhe Pedestrian Street."}, {"address": "No. 189 Puyang Road, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.5 stars | A classic noodle house that has nourished generations of locals, renowned for its \u0027Zajiang Noodles\u0027 (minced pork noodles) and \u0027Beef Noodles\u0027. Made fresh to order, the chewy, springy noodles are coated in savory minced meat sauce and vibrant chili oil. Richly aromatic yet pleasantly spicy, it captures the purest authentic traditional flavors of Western Sichuan.", "name": "Guo Lian Noodles", "transport": "Take Bus Route 1, 6, or 10 to \u0027Puyang Road Station\u0027, then walk about 1 minute."}, {"address": "No. 188 Qingcheng Road, Qingchengshan Town, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.6 stars | An atmospheric restaurant specializing in \u0027Qingcheng Cured Pork\u0027, one of Mount Qingcheng\u0027s four famous specialties. Carefully selected farm pork is secret-cured and smoked over pine and cypress branches. Thinly sliced, translucent, and luscious without being greasy, the bacon bursts with woody smoky aromas and savory sweetness. Paired with local Qingcheng milk wine and steamed rice, it\u0027s sheer perfection.", "name": "Qingcheng Mountain Wine \u0026 Cured Meat Restaurant", "transport": "Take the Chengdu Intercity Railway to \u0027Qingchengshan Railway Station\u0027, transfer to Qingcheng Mountain Scenic Area Bus Route 101, get off at \u0027Qingcheng Mountain Scenic Area Station\u0027, and walk about 8 minutes."}, {"address": "No. 68 Guanfeng Road, Dujiangyan City, Chengdu, Sichuan Province", "feature": "\u2b50 4.3 stars | Famous for Western Sichuan\u0027s traditional \u0027Zhazha Noodles\u0027, where a generous heap of crispy, dry-fried minced pork crumble (\u0027zhazha\u0027) tops dry-tossed noodles. Tossed thoroughly, the silky, springy noodles blend with crunchy, savory pork bits to create a delightful contrast of textures. Rich, savory, and brimming with local heritage.", "name": "Xindongji Zhazha Noodles", "transport": "Take Bus Route 2 or 13 to \u0027Guanfeng Road Station\u0027, then walk about 2 minutes."}], "name": "Local Heritage \u0026 Iconic Eateries"}, "cat_2": {"items": [{"address": "Inside Yangtianwo Square, Tianfu Avenue, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Located right next to the popular Dujiangyan landmark Yangtianwo Square, set against the backdrop of the massive reclining selfie panda sculpture. Famous for its signature panda latte art and freshly baked panda-shaped waffles. The lattes use dark roast beans for a rich, nutty flavor, while the waffles are crispy outside, soft inside, and packed with a rich milky and egg aroma\u2014making it the top choice for tourists to take photos and enjoy an exquisite brunch.", "name": "Yangtianwo Selfie Panda Cafe", "transport": "Take the Dujiangyan High-Speed Railway to \u0027Lidui Park Station\u0027, exit, and walk for about 3 minutes."}, {"address": "No. 120 Yangliuhe Street, Xingfu Subdistrict, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A cozy, stylish independent cafe tucked deep within the old streets of Guanxian Ancient Town, featuring a warm handcrafted wooden interior. Its signature specialty drink, \u0027Qingcheng Tundra,\u0027 creatively combines local Mount Qingcheng green tea matcha powder with espresso. It starts with the refreshing aroma of green tea and silky foam, followed by the rich fruity acidity of coffee for a deliciously layered experience. Pair it with freshly made avocado smoked chicken toast for a light, refreshing, and guilt-free meal.", "name": "Mo Ping Coffee", "transport": "Take Dujiangyan City Bus No. 4 or 6 to \u0027Xuanhuamen Station\u0027, and walk for about 5 minutes."}, {"address": "Group 3, Tai\u0027an Community, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | A mountain-view cafe situated next to Tai\u0027an Ancient Town on the Back Mountain of Mount Qingcheng, boasting stunning views of lush greenery. The cafe serves an exquisite \u0027Mountain-Style Brunch\u0027, featuring freshly toasted sourdough with Eggs Benedict, rich butter aroma, and perfectly runny poached eggs. The pour-over coffee carefully selects specialty Yunnan coffee beans, offering bright citrus acidity and a sweet aftertaste, allowing guests to enjoy a relaxing morning surrounded by fresh, oxygen-rich air.", "name": "Yugong Coffee Qingcheng", "transport": "Take the scenic minibus from Qingchengshan High-Speed Railway Station to \u0027Mount Qingcheng Back Mountain Tai\u0027an Ancient Town\u0027, then walk for about 8 minutes."}, {"address": "No. 18 Fuxing Street (near Nanqiao Bridge), Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Located right by the Min River and the Nanqiao Bridge scenic area, offering prime riverside outdoor seating where you can savor delicious food while listening to the rushing waters. The \u0027Shuise Classic All-Day Breakfast\u0027 is highly recommended, featuring pan-fried bacon, German sausage, scrambled eggs, and American pancakes in generous portions. Pair it with a smooth iced shaken raw coconut latte, where the sweetness of coconut milk perfectly balances the coffee\u0027s bitterness, drawing many vacationers looking to unwind.", "name": "Shuise Riverview Cafe", "transport": "Take Bus No. 2 or 19 to \u0027Nanqiao Station\u0027, and walk for about 2 minutes."}, {"address": "Group 1, Suxian Village, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Tucked into a serene bamboo valley at the foot of Mount Qingcheng, blending traditional Sichuan bamboo culture with modern coffeecraft. The signature \u0027Bamboo Tube Latte\u0027 pours freshly extracted espresso into a fresh bamboo stalk, infusing it with a unique, subtle bamboo aroma that is slightly sweet and velvety. The brunch feature, \u0027Handcrafted Souffl\u00e9 Pancakes\u0027, is made to order with a cloud-like, melt-in-your-mouth texture, drizzled with special brown sugar syrup for an unforgettable treat.", "name": "Zhuli Cafe Qingcheng", "transport": "Driving is recommended, or take a taxi from Qingchengshan High-Speed Railway Station (approx. 10 minutes)."}, {"address": "Huanshan Road Section, Lingyanshan Scenic Area, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | A hidden gem cafe halfway up Lingyan Mountain, featuring an antique courtyard surrounded by evergreen trees. The owner roasts single-origin beans in-house; the Yirgacheffe pour-over boasts elegant floral aromas and smooth lemon acidity. Pair it with the fusion \u0027Qingcheng Aged Cured Pork Sandwich\u0027, where rich, savory cured pork is lightly seared and melted with cheese for a surprising taste packed with local flavor.", "name": "Lingyan Grass Cottage Cafe", "transport": "Driving or taking a taxi from downtown Dujiangyan up the mountain is recommended (approx. 20 minutes)."}, {"address": "No. 108 Damianji Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.9 stars | A premium cafe combining elevated mountain views with artistic space, serving as the best spot to gaze at Mount Qingcheng\u0027s sea of clouds in the early morning. For brunch, the \u0027Smoked Salmon Baguette\u0027 is recommended\u2014crispy on the outside, chewy inside, with fresh salmon enhanced by capers and spread. After your meal, enjoy a warm Osmanthus Oat Latte, where the rich, sweet scent of osmanthus wafts up with the steam for a deeply comforting experience.", "name": "Xunyin Mountain Cafe \u0026 Brunch", "transport": "Take a taxi from Qingchengshan High-Speed Railway Station for about 12 minutes."}, {"address": "No. 66 Xijie (West Street), Guanxian Ancient Town Scenic Area, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A nostalgic, retro-style cafe converted from an old residence, showcasing traditional West Sichuan architectural details with green tiles and wooden beams. The popular brunch dish here is \u0027Brown Sugar Ciba French Toast\u0027, incorporating the local traditional dessert\u2014brown sugar ciba\u2014into French toast. Golden and crispy on the outside, soft and chewy inside, topped with crushed peanuts and brown sugar syrup, sweet yet balanced. Paired with a medium-roast Americano, the play between sweet and bitter is deeply satisfying.", "name": "Guancheng Inn Cafe", "transport": "Take Dujiangyan City Bus No. 1 or 4 to \u0027Lidui Park Station\u0027, and walk through Xuanhuamen into West Street."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 128 Qingcheng Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | A renowned specialty bistro located at the foot of Mount Qingcheng, famous for its house-brewed fruit wines and refined local Qingcheng dishes. The signature Stir-fried Aged Cured Pork with Heartleaf Houttuynia and Ginkgo Chicken Soup are absolute masterpieces. The aged cured pork is savory and rich without being greasy, pairing wonderfully with sweet, refreshing green plum wine or kiwi wine for a multi-layered taste experience. The rustic wooden dining space complemented by elegant music makes it a favorite among travelers and foodies seeking tranquility and flavor.", "name": "Zhao Mai Jiu Local Bistro", "transport": "Take Dujiangyan City Bus 101 to \u0027Qingchengshan Scenic Area Station\u0027, then walk for about 5 minutes."}, {"address": "No. 132 Jianshe Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | An iconic local restaurant in Dujiangyan featuring intangible cultural heritage-grade cuisine. Its signature Sweet-skinned Duck boasts crispy skin and tender meat; brushed with a layer of rich, sweet syrup and fried to a golden crunch, every bite offers juicy flavor infused with complex spices. Beyond duck, its handmade braised dishes and Sichuan stir-fries are also highly praised by locals and tourists alike, making it a must-visit for authentic traditional flavors.", "name": "Zhong Duck Traditional Restaurant", "transport": "Take Dujiangyan Bus 4 or 9 to \u0027Jianshe Road Station\u0027, then walk for about 2 minutes."}, {"address": "No. 300 Jiang\u0027an Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A legendary culinary brand in Dujiangyan famous across Sichuan for its numbingly spicy and savory rabbit heads alongside local Sichuan cuisine. The rabbit heads undergo a meticulous multi-step braising process, rendering the meat incredibly flavorful and tender enough to easily fall off the bone. Available in Five-Spice and Numbing Spicy flavors: the spicy option is intense and aromatic, while the five-spice offers a sweet, savory depth. Paired with local beer or house brews, it offers an addictive, quintessential Shu-region dining experience.", "name": "You Tu Tou Local Sichuan Cuisine", "transport": "Take Dujiangyan Bus 1 or 8 to \u0027Jiang\u0027an Road Station\u0027, then walk to arrive."}, {"address": "No. 88 Qushan Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | A well-established local bistro in Mount Qingcheng that perfectly combines local farmhouse ingredients with a bistro concept. The signature sweet fermented glutinous rice wine is aromatic, pleasantly sweet, and smoothly intoxicating. It pairs perfectly with the signature Ginkgo Stewed Chicken Soup, slow-simmered with high-quality local free-range chicken and native ginkgo nuts to yield a rich, flavorful broth and firm, springy meat. Authentic flavors and a warm ambiance make it the ultimate haven to recharge and savor a slow-paced lifestyle after hiking Mount Qingcheng.", "name": "Zhang Lao Lao Local Culinary House", "transport": "Take the Chengdu-Guanxian High-Speed Railway to \u0027Qingchengshan Station\u0027, then transfer to a taxi for about 7 minutes."}, {"address": "No. 168 Shuimogou Section, Daqingcheng Tourist Ring Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A nostalgic, rustic local restaurant famous for its traditional big iron wok Firewood Chicken. Free-range chicken is stir-fried over an open wood fire with a secret spicy sauce and accompanied by handmade corn cakes stuck to the side of the wok. The chicken is tender, juicy, and infused with rich flavors, while the corn cakes have a crispy bottom and soft top. Also offering local house-brewed fruit wines and wild mountain vegetables, its vibrant atmosphere and hearty big-pot dining culture leave a lasting impression.", "name": "Chaimen Commune Restaurant", "transport": "Driving is recommended, or take a taxi from Qingchengshan High-Speed Railway Station for about 10 minutes."}, {"address": "No. 45 West Street, Guanxian Ancient Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | A trendy bistro located on West Street in Guanxian Ancient Town, Dujiangyan, seamlessly blending traditional architecture with modern pub vibes. It features creative Sichuan snacks, craft beer, and Qingcheng Mountain fruit wines. Signature dishes like Spicy Cold-braised Rabbit and House-special Grilled Fish offer explosive spicy flavors, pairing wonderfully with smooth, fruity local signature cocktails. At night, enjoy views of ancient town lights and the distant sound of the Min River, creating an immensely romantic atmosphere.", "name": "Xi Xiang Wei Xun Bistro", "transport": "Take Dujiangyan Bus 2 or 6 to \u0027Lidui Park Station\u0027, then walk into West Street of Guanxian Ancient Town."}, {"address": "No. 56 Yaomu Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | A highly praised establishment focusing on traditional Qingcheng Mountain delicacies and local farmhouse cooking. The aged cured pork is smoked using traditional methods, featuring a bright red luster with savory, chewy lean meat and translucent, non-greasy fat. Stir-fried with high-altitude wild vegetables or bamboo shoots, the aroma is irresistible. Additionally, the house-brewed sweet osmanthus wine is delightfully smooth, offering a harmonious blend of Qingcheng\u0027s Taoist wellness philosophy and wild mountain flavors.", "name": "Xunwei Qingcheng Local Cuisine", "transport": "Take the park shuttle from the Qingchengshan Scenic Area entrance or walk for about 10 minutes."}, {"address": "No. 8 Haohua Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.9 stars | A premium specialty bistro hidden deep within the bamboo forests of Mount Qingcheng, boasting an elegant and serene atmosphere akin to a hidden paradise. It serves refined Sichuan cuisine and local health-boosting wines. The signature Tai Chi Cold Platter and Cold-water Rainbow Trout prepared two ways are standout dishes, featuring springy, succulent fish without any muddy taste. Paired with house-brewed milk wine\u2014one of the \u0027Four Treasures of Qingcheng\u0027\u2014it provides a rich, pleasantly sweet and sour flavor that lingers, making it the top choice for discerning diners seeking exquisite food and tranquility.", "name": "Yin Shan Qingcheng Mountain House Bistro", "transport": "Taking a taxi directly is recommended, or hire a scenic route shuttle from Qingchengshan High-Speed Railway Station."}], "name": "Specialty Bistros \u0026 Local Sichuan Cuisine"}, "cat_4": {"items": [{"address": "Shangqing Palace, Qingcheng Mountain Scenic Area, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Located at the peak of Mount Qingcheng\u0027s Front Mountain, Shangqing Palace Vegetarian Restaurant is renowned for its Taoist health philosophy. The must-try \u0027Qingcheng Ginkgo Stewed Chicken\u0027 (simulating chicken with lily bulbs and wheat gluten) features a sweet, rich broth and a rich, layered mock-meat texture. Paired with freshly picked wild mountain vegetables and specially made tofu, it is smooth, tender, and subtly smoky with charcoal notes, making it a favorite among tourists and health-conscious locals alike.", "name": "Shangqing Palace Vegetarian Restaurant (Qingcheng Mountain)", "transport": "Take the Front Mountain Cable Car of Mount Qingcheng to the upper station, then walk for about 15 minutes."}, {"address": "Inside Tai\u0027an Temple, Tai\u0027an Ancient Town, Back Mountain of Mount Qingcheng, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Tucked away in Tai\u0027an Ancient Town on the Back Mountain of Mount Qingcheng, Tai\u0027an Temple Vegetarian Restaurant serves affordable and authentic temple vegetarian cuisine. The signature \u0027Mapo Tofu Vegetarian Style\u0027 uses handmade tofu made with mountain spring water, offering a cloud-like tender texture. Paired with a secret spicy Sichuan pepper sauce, it is numbingly spicy, savory, and perfect with rice. The \u0027Steamed Yam and Bamboo Shoot Slices\u0027 provides a crisp, sweet contrast that perfectly balances the spiciness, making it the top choice for hikers to replenish their energy.", "name": "Tai\u0027an Temple Vegetarian Restaurant", "transport": "Take the Back Mountain shuttle bus from Dujiangyan High-Speed Railway Station to Tai\u0027an Ancient Town, then walk into Tai\u0027an Temple."}, {"address": "Inside Puzhao Temple, Dobei Road, Daguan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Highly renowned in Chengdu, Puzhao Temple Vegetarian Restaurant specializes in exquisite vegetarian buffets and Zen tea experiences. The classic \u0027Vegetarian Twice-Cooked Pork\u0027 is crafted from soy protein and konjac, seared to a slight crispiness on the outside with a springy, chewy texture; its mildly spicy sauce perfectly captures the soul of Sichuan cuisine. Paired with a rich soup made from fresh high-mountain wild mushrooms, the broth is deliciously sweet and soothing, drawing even non-vegetarians to visit.", "name": "Puzhao Temple Vegetarian Restaurant", "transport": "It is recommended to drive or take a taxi from downtown Dujiangyan; the ride takes about 30 minutes."}, {"address": "Next to Jianfu Palace at the entrance of Mount Qingcheng Scenic Area, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Located at the foot of Mount Qingcheng\u0027s Front Mountain, Jianfu Palace is the first vegetarian stop for visitors. The \u0027Taoist Longevity Noodles\u0027 feature chewy noodles in a broth slow-simmered with Chinese yam, goji berries, and various herbs, making it smooth and sweetly lingering. The \u0027Pan-Fried Wild Mushroom Pancakes\u0027 are crispy outside and tender inside, bursting with intense wild mushroom aroma, making them extremely popular among health-conscious travelers.", "name": "Jianfu Palace Taoist Vegetarian Restaurant", "transport": "Take the Chengdu Metro or high-speed rail to Qingcheng Mountain Station, transfer to Bus 101 to the entrance gate of Mount Qingcheng Scenic Area, and walk from there."}, {"address": "Inside Lingyan Temple, Lingyan Mountain Scenic Area, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Nestled in the Lingyan Mountain Scenic Area, Lingyan Temple serves humble yet deeply delicious vegetarian meals. The \u0027Braised Vegetarian Ribs\u0027 are highly recommended\u2014made with lotus root inserted into wheat gluten to simulate bones, crispy outside and soft inside, tossed in a rich, appetizing sweet-and-sour sauce. Paired with stir-fried local mountain celery and dried tofu, the dish is crisp, tender, and fragrant, earning high praise from diners.", "name": "Lingyan Temple Vegetarian Restaurant", "transport": "Take Bus 12 from downtown Dujiangyan to the foot of Lingyan Mountain, then hike or take a local shuttle up the mountain."}, {"address": "Inside Yuanming Palace, Front Mountain Scenic Area of Mount Qingcheng, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Yuanming Palace offers a serene and elegant environment, with vegetarian dishes following traditional Taoist dietary philosophy. The signature dish is the \u0027Qingcheng Four Treasures Stir-Fry\u0027, featuring local cured-pork-flavored mock meat, bamboo shoots, ginkgo nuts, and wood ear mushrooms stir-fried over high heat. It is crisp, rich in texture, and carries a subtle smoky and herbal forest aroma. Pair it with a bowl of \u0027Tai Chi Bagua Thick Soup\u0027 for a velvety, smooth dish that warms the stomach.", "name": "Yuanming Palace Taoist Vegetarian Restaurant", "transport": "Walk for about 1 hour along the hiking trail from the gate of Mount Qingcheng Front Mountain to reach Yuanming Palace."}, {"address": "No. 168 Huanshan Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | This refined vegetarian restaurant combines modern wellness aesthetics with Taoist culinary culture. The popular \u0027Black Truffle and Wild Mushroom Pot\u0027 features wild high-mountain black truffles and rare mushrooms, stewed into a rich, flavorful broth with tender, juicy mushrooms. The \u0027Handcrafted Mountain Gastrodia Tofu\u0027 is silk-smooth, melting in your mouth with a delicate herbal fragrance. Its exquisite presentation and rich layers of flavor are praised by tourists.", "name": "Yinsu Taoist Health Vegetarian Restaurant (Mount Qingcheng)", "transport": "Take the high-speed rail to Qingcheng Mountain Station, then take a taxi for about 5 minutes."}, {"address": "Inside Yuqing Palace, Front Mountain Scenic Area of Mount Qingcheng, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Perched on a quiet hillside of Mount Qingcheng, Yuqing Palace serves simple and rustic Taoist vegetarian dishes. A must-order is the \u0027Shiitake Mushroom Vegetarian Rice Noodles\u0027, where smooth noodles soak up a rich broth simmered with deep mushroom flavors. The \u0027Salt \u0026 Pepper Yam Strips\u0027 are fried golden and crispy outside while tender and soft inside, dusted with special Sichuan pepper salt\u2014a savory, refreshing snack that provides ultimate comfort during a hike.", "name": "Yuqing Palace Taoist Vegetarian Restaurant", "transport": "Walk for about 40 minutes along the Front Mountain trail toward the Natural Picture spot to arrive."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Qingcheng Outer Mountain Market Town, Daguan Town, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.6 stars | Located at the foot of Mount Qingcheng, this time-honored dessert stall is a must-visit for tourists and hikers alike. The signature Sweet Fermented Rice with Rice Balls and Egg is warm, sweet, and comforting, featuring a gentle, subtle wine aroma, chewy rice balls, and a soft poached egg with a runny yolk for a delightful sweet-and-savory blend. The Spicy Chili Oil Dumplings feature silky skins, flavorful meat filling, and a rich, tongue-tingling chili oil that keeps you coming back for more.", "name": "Zhang Lao Zao (Sweet Fermented Rice)", "transport": "Take Dujiangyan City Bus 102 to \"Daguan Town Station\" (\u5927\u89c0\u93ae\u7ad9) and walk for about 3 minutes."}, {"address": "No. 126 Yangliuhe Street, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.4 stars | Cong Cong Juan is a unique, iconic street snack native to Dujiangyan. Paper-thin dough wrappers roll around fresh, crunchy shredded celtuce and radish into neat, finger-sized rolls. Dip them in the house-made sweet, sour, and spicy sauce\u2014first comes an appetizing kick of tang and spice, followed by the sweet crispness of the veggies and the chewy wrapper. It\u2019s irresistibly crunchy and addictive!", "name": "Gao Ji Cong Cong Juan (Scallion Spring Rolls)", "transport": "About a 10-minute walk from Lidui Park Station at the Dujiangyan Scenic Area to Yangliuhe Snack Street."}, {"address": "No. 152 Jianshe Road, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.7 stars | A legendary Dujiangyan food institution renowned for its \"Sweet Skin Duck.\" Brushed with maltose and roasted to a rich amber caramel glaze, the duck skin is delightfully crispy and subtly sweet without being greasy. Inside lies tender, juicy meat infused with aromatic braising spices. Perfectly balanced and deeply savory, it makes a fabulous walk-and-eat snack or edible souvenir.", "name": "Zhong Duck (Sweet Skin Duck)", "transport": "Take Dujiangyan Bus 4 or 9 to \"Jianshe Road Station\" (\u5efa\u8a2d\u8def\u7ad9) and walk for about 2 minutes."}, {"address": "No. 12 Yangliuhe Street, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.5 stars | A classic noodle spot deeply rooted in Dujiangyan for years, famous for its handmade chili oil wontons and small-bowl noodles. The signature red oil mini wontons feature paper-thin wrappers and bouncy, flavorful fillings tossed in aromatic house chili oil and Sichuan peppercorns for a mouth-numbing, spicy, silky bite. The small-bowl noodles are perfectly springy and coated in rich sauce, capturing authentic old Chengdu flavors.", "name": "Zhao Mai Mian (Zhao\u0027s Noodles \u0026 Wontons)", "transport": "Located on Yangliuhe Pedestrian Street, about an 8-minute walk from the main entrance of the Dujiangyan Irrigation System Scenic Area."}, {"address": "No. 26 Puyang Road, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.3 stars | A beloved comfort snack that locals in Dujiangyan have grown up with. The thin rice noodles are cooked to silky, elastic perfection in a rich, flavorful bone broth simmered for hours. The popular Braised Beef Rice Noodles feature melt-in-your-mouth chunks of tender beef, pickled greens, and scallions, filling every bite with a tangy, savory warmth.", "name": "Bei Jie Rice Noodles", "transport": "Take Dujiangyan Bus 1 or 7 to \"Xuanhuamen Station\" (\u5ba3\u5316\u9580\u7ad9) and walk for about 4 minutes."}, {"address": "Tai\u0027an Ancient Town Area, Qingcheng Mountain Scenic Area, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.6 stars | A top-tier cured meat stall located in Tai\u0027an Ancient Town Market at Mount Qingcheng. Smoked traditionally over pine and cypress branches, the cured pork slices display a translucent ruby glow, rich and savory without being greasy. Freshly grilled meat skewers or stuffed Chinese flatbreads pack a hearty, aromatic punch of woody smoke and rustic mountain flavor\u2014the ultimate energy-boosting street food while exploring Mount Qingcheng.", "name": "Wenjun Qingcheng Mountain Cured Meat", "transport": "Located directly inside Tai\u0027an Ancient Town Pedestrian Street at the foot of Rear Mount Qingcheng."}, {"address": "No. 58 Taiping Street, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.4 stars | A perfect execution of Chengdu\u2019s classic street dessert right in Dujiangyan. Baked fresh to order in small copper pans, these egg pancakes feature crispy crepe-like edges and a fluffy, cake-like center infused with buttery egg aroma. Fillings range from sweet to savory, such as cream with pork floss, spicy beef, or tangy pickled cowpeas. Served hot, each crispy-yet-fluffy bite offers pure satisfaction!", "name": "Taiping Zhang Ji Egg Pancakes (Dan Hong Gao)", "transport": "Take Dujiangyan Bus 2 to \"Taiping Street Station\" (\u592a\u5e73\u8857\u7ad9) and walk for about 1 minute."}, {"address": "No. 88 Yangliuhe Street, Dujiangyan City, Chengdu City", "feature": "\u2b50 4.5 stars | A specialty noodle dish that is a must-try while strolling along the Yangliu River. The term \"Zha Zha\" refers to crispy, seasoned minced pork toppings scattered generously over freshly cooked handmade noodles, sprinkled with chopped green onions and rich chili oil. Toss everything well before eating\u2014the chewy noodles paired with crunchy, flavorful pork bits and savory, spicy sauce deliver an unforgettable texture and authentic local flavor.", "name": "Yangliu River Zha Zha Noodles", "transport": "Located inside Yangliuhe Snack Pedestrian Street, about a 7-minute walk from Dujiangyan Lidui Park Station."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dujiangyan and Mount Qingcheng"}, "gaoxin_globalcenter": {"categories": {"cat_1": {"items": [{"address": "China Huashang Financial Center, No. 33 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | As a centuries-old flagship of Sichuan cuisine, the Mapo Tofu here perfectly embodies the eight classic characteristics: numb, spicy, hot, fresh, fragrant, crispy, tender, and rich. The silky tofu absorbs all the rich flavors, complemented by golden, crispy minced beef, vibrant red chili oil, and layered Sichuan pepper numbness. Scooped over steaming hot rice, the spicy and numbing sensation bursts on your tongue\u2014pure bliss. Foodies and tourists alike flock here to savor this most authentic, traditional Chengdu home-style flavor.", "name": "Chen Mapo Tofu (Financial City Branch)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station (Exit C), walk for about 5 minutes."}, {"address": "4F, China Huashang Financial Center, No. 33 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 stars | A renowned restaurant that inherits the essence of classic Sichuan cuisine and elevates it with refined presentation. The signature \u0027Official Style Camphor Tea Duck\u0027 features crispy skin and tender meat with subtle aromas of camphor wood and tea leaves\u2014rich without being greasy. The \u0027Old Chengdu Spicy Abalone\u0027 showcases the full spectrum of Sichuan cuisine\u0027s 24 traditional flavor profiles. The elegant dining atmosphere and delicate taste allow diners to truly appreciate the rich heritage of Sichuan cuisine, where \u0027each dish has its own style, and a hundred dishes have a hundred flavors.\u0027", "name": "Xu\u0027s Cuisine (Financial City Branch)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station (Exit D), walk for about 3 minutes."}, {"address": "4F, New Century Global Center, No. 1700 North Section Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.2 stars | A China Time-Honored Brand specializing in traditional Chengdu snacks, famous for its pure pork filling made without vegetables. The dumpling skins are delightfully chewy and tossed in a special sweet red chili oil and minced garlic sauce. The result is a savory-sweet, numbingly spicy, and deeply aromatic flavor profile. Thin skin, rich filling, and savory sauce make it endlessly satisfying without being overly fiery. Located inside the Global Center, it offers tourists the most convenient way to experience Old Chengdu\u0027s classic snack and noodle culture.", "name": "Zhong Dumplings (Global Center Branch)", "transport": "Take Metro Line 1 to Jincheng Plaza Station; the exit connects directly to the Global Center."}, {"address": "1F, Mube Mall, No. 500 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.8 stars | A benchmark for high-end traditional Sichuan fine dining in Chengdu, blending refined Sichuan flavors with local seasonal ingredients. Signature dishes like \u0027Dongpo Pork\u0027 and \u0027Handcrafted Sichuan Pickled Vegetables Stewed Yellow Croaker\u0027 recreate classic sour, spicy, fresh, and savory notes using modern techniques. The Dongpo Pork melts in your mouth with a perfect balance of lean and fat, bathed in a balanced savory-sweet sauce, while the yellow croaker features tender flesh in a tangy, mouthwatering broth. With an atmosphere full of Oriental aesthetics, it is immensely popular with foodies seeking quality.", "name": "Chaimen Hui (Financial City Branch)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station (Exit B), walk for about 6 minutes."}, {"address": "L1, Ufun Mall, No. 288 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 stars | Hailing from Meishan, this century-old traditional Sichuan brand remains insanely popular after nearly 100 years. The signature \u0027Wangzi Duck Blood Curd\u0027 features blood curd as smooth as tofu, soaked in vibrant red chili oil that is aromatic, numb, and spicy. The \u0027Crispy Steamed Pork with Rice Flour\u0027 is crispy outside and soft inside, reinventing the greasy impression of traditional steamed pork. Delicate yet rich in nostalgic flavor, it offers top-notch quality at reasonable prices, making it one of the most beloved Sichuan dining spots in the Financial City commercial district.", "name": "Mawangzi Sichuan Restaurant (Financial City Branch)", "transport": "Take Metro Line 1 or Line 5 to Incubation Park Station (Exit W2), walk for about 8 minutes."}, {"address": "No. 52 Zijing South Road, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 stars | One of the pioneers of traditional Sichuan fusion cuisine in Chengdu, maintaining exceptional standards for years. The signature \u0027Ronghe Kai Men Hong\u0027 (Spicy Fish Head) features tender, spicy fish head topped with savory pickled peppers; the \u0027Stone Pot Catfish\u0027 serves tender, silky fish in a rich, numbing broth. The menu retains the robust essence of classic Sichuan flavor while elevating it for elegant family banquets and gatherings, making it a top pick for visitors craving an authentic local feast.", "name": "Daronghe Restaurant (Gaoxin Branch)", "transport": "Take Metro Line 8 to Shenxianshu Station (Exit A), walk for about 10 minutes."}, {"address": "No. 399 West Section Fucheng Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | A legendary ambassador of classic Chengdu beef tallow hotpot, famous for its signature 9-grid pot. The rich beef tallow broth delivers the deep, fragrant, spicy, and numbing heat of traditional Sichuan hotpot, filling the air with aroma as it boils. The signature \u0027Jiuxiang Beef\u0027 is thick, well-marinated, and tender-juicy after dipping; the \u0027Jiuxiang Tripe\u0027 is wonderfully crisp and flavor-absorbing. Authentic hotpot punch combined with genuine ingredients draws crowds of visitors seeking the soul of Chengdu hotpot.", "name": "Shujiuxiang Hotpot (South Gaoxin Branch)", "transport": "Take Metro Line 5 to Chengdu First People\u0027s Hospital Station (Exit B), walk for about 7 minutes."}, {"address": "B1, China Huashang Financial Center, No. 33 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | A highly popular spot that seamlessly fuses traditional Chengdu street-style \u0027Jianghu\u0027 dishes with modern creative flair. The signature \u0027Peeled Spicy Prawns\u0027 are deshelled and drenched in fiery red oil and Sichuan peppercorns, rendering a bouncy, spicy kick; the \u0027Paper-Wrapped Grilled Fish\u0027 has crisp skin, tender flesh, and deeply infused flavors. Featuring nostalgic Chengdu presentation and authentic kick, it keeps locals coming back and is a must-visit destination for young food travelers exploring Chengdu\u0027s spicy food scene.", "name": "Chengdu Chike (Jiaozi Avenue Branch)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station (Exit D), walk for about 3 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "1st Floor, Jiaozi Market, No. 500 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 stars | Located on Jiaozi Avenue in the High-Tech Zone, UID CAFE boasts a striking retro American industrial style, making it a beloved classic among Chengdu coffee enthusiasts. Featuring specialty beans roasted in-house, their signature pour-over coffee offers rich, nuanced flavors. Pair it with the classic Full English Breakfast or the pan-fried Bacon Eggs Benedict\u2014one bite of the runny yolk perfectly blending with sourdough yields a delightfully full and layered texture. High ceilings and vintage leather sofas make this spot popular with both business professionals and tourists, standing out as one of the most stylish brunch venues in the High-Tech Zone.", "name": "UID CAFE (Jiaozi Avenue)", "transport": "Take Metro Line 5 to Jiaozi Avenue Station, Exit D, and walk about 300 meters."}, {"address": "1st Floor Perimeter, M.Cube Shopping Center, No. 33 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 stars | Situated in the heart of the Financial City commercial district, INVISIBLE COFFEE attracts architectural and coffee lovers alike with its minimalist pure white aesthetic and transparent glass design. Their specialty coffee drinks, such as the \u0027Brown Sugar Boba Latte\u0027 and \u0027Sparkling Cold Brew,\u0027 feature extremely delicate, smooth textures, blending light fruity acidity with milky aromas for a refreshing flavor. Brunch highlights freshly prepared Aussie Avocado Sourdough and Seared Smoked Salmon Salad\u2014crisp, sweet veggies paired with tender, rich salmon make it an excellent choice for local office workers and tourists to enjoy a sunny morning.", "name": "INVISIBLE COFFEE (Jiaozi Avenue)", "transport": "Take Metro Line 1 or Line 18 to Financial City Station, Exit 9, and walk about 400 meters."}, {"address": "No. 181 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 stars | Pause Coffee advocates taking a breather in the bustling Hi-Tech Zone, featuring a warm, wood-toned interior. Famous for it
