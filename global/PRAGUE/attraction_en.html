on (approx. 5 min walk)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m. 68, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The National Museum in Prague is one of the largest and oldest museums in the Czech Republic. Perched grandly at the top of Wenceslas Square, its magnificent Neo-Renaissance building is a masterpiece in itself. Housing millions of artifacts spanning natural history, history, art, and music, the museum offers visitors a captivating deep dive into the rich cultural heritage of the Czech lands. Reopened in 2018 after extensive renovations, its stunning interior, exquisite frescoes, and awe-inspiring central dome are truly sights to behold. From prehistoric relics and modern history exhibits to mineralogy and zoology, its vast collections cater exceptionally well to history buffs, science enthusiasts, and art lovers alike. The museum also hosts frequent temporary exhibitions and connects to its modern new building via an underground corridor.", "name": "National Museum (N\u00e1rodn\u00ed muzeum)", "transport": "Metro lines A, C at Muzeum station; multiple tram lines stop at V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station."}, {"address": "Pansk\u00e1 7, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Mucha Museum is the world\u0027s only museum dedicated exclusively to the life and works of Alfons Mucha, the Czech master of Art Nouveau. Housed within the historic Kaunick\u00fd Palace in Prague\u0027s New Town, it features a curated collection of posters, decorative panels, oil paintings, sketches, sculptures, and personal photographs from his iconic Paris and American periods. Visitors can gain intimate insights into Mucha\u0027s distinctive style, exploring how he elegantly blended Slavic mythology, symbolism, and graceful Art Nouveau lines. Though intimate in size, the museum is beautifully curated with detailed English commentary, making it a must-visit cultural pilgrimage for art lovers and Mucha fans.", "name": "Mucha Museum", "transport": "Metro lines A, B at M\u016fstek station; Metro line A at Muzeum station; Tram lines 3, 9, 14, 24 at Jind\u0159i\u0161sk\u00e1 station."}, {"address": "Jungmannovo n\u00e1m. 753/18, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Church of Our Lady of the Snows is an impressive Gothic sanctuary in Prague\u0027s New Town. Founded by Emperor Charles IV in 1347, it was originally planned to be the tallest church in Prague, though only the choir section was ever completed. Nevertheless, it boasts one of the highest vaults in Prague, soaring to 34 meters, creating a grand and airy interior. The church is renowned for its magnificent Baroque altar\u2014one of the largest in the Czech Republic\u2014standing at a remarkable 29 meters with intricate decorative details. Closely tied to the Hussite Wars, it once served as a stronghold for radical Hussites. Today, it remains a peaceful oasis offering regular masses and classical concerts, allowing visitors to experience sacred solemnity and deep historical roots right in the heart of the city.", "name": "Church of Our Lady of the Snows (Kostel Panny Marie Sn\u011b\u017en\u00e9)", "transport": "Metro lines A, B at M\u016fstek station; Tram lines 3, 9, 14, 24 at Vodi\u010dkova or Lazarsk\u00e1 station."}, {"address": "Je\u010dn\u00e1 2, 120 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.6 stars | The Church of St. Ignatius is a grand Baroque landmark on Charles Square (Karlovo n\u00e1m\u011bst\u00ed) in Prague\u0027s New Town. Built by the Jesuits in the late 17th century, it stands as one of the city\u0027s most significant Baroque structures. The impressive facade features a monumental statue of St. Ignatius of Loyola (founder of the Jesuit order) alongside sculptures of other Jesuit saints. Inside, the church is opulently decorated with breathtaking frescoes, gilded altars, and ornate stucco work designed to evoke visual wonder. The central altar painting depicting the assumption of St. Ignatius is an artistic highlight. Built to inspire intense devotion, its rich artistic details and solemn ambiance make it an essential stop for enthusiasts of Baroque art and history.", "name": "Church of St. Ignatius (Kostel svat\u00e9ho Ign\u00e1ce)", "transport": "Metro line B at Karlovo n\u00e1m\u011bst\u00ed station; Tram lines 3, 6, 10, 16, 18, 22, 24 at Karlovo n\u00e1m\u011bst\u00ed station."}, {"address": "Resslova 9a, 120 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.7 stars | The Cathedral of Saints Cyril and Methodius is not only a beautiful Baroque Orthodox church but also a poignant national cultural monument rooted in dramatic WWII history. In 1942, heroic Czech paratroopers hid here after successfully executing Operation Anthropoid\u2014the assassination of Reinhard Heydrich, the Nazi Reich Protector of Bohemia and Moravia. The church crypt now houses the National Memorial to the Heroes of the Heydrich Assassination, telling this heroic and tragic story in vivid detail. Visitors can explore the underground crypt, feel the palpable historic tension, and pay tribute to the fallen freedom fighters. The upper church itself is equally worthy of appreciation, featuring lovely interiors that mark it as a powerful landmark where faith and history intertwine.", "name": "Cathedral of Saints Cyril and Methodius (Chr\u00e1m svat\u00fdch Cyrila a Metod\u011bje)", "transport": "Metro line B at Karlovo n\u00e1m\u011bst\u00ed station; Tram lines 3, 6, 10, 16, 18, 22, 24 at Karlovo n\u00e1m\u011bst\u00ed station."}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Church of St. Stephen is one of the oldest parish churches in Prague\u0027s New Town, with roots tracing back to the mid-14th century when it was founded by Charles IV. This Gothic church is famous for its sturdy stone masonry and clean, unpretentious lines. While the exterior appears austere, the interior holds a wealth of historical and artistic treasures. A prominent feature of the church is its towering bell tower, and the interior preserves precious Gothic and Baroque artwork, including fine altarpieces and sculptures. Having witnessed centuries of Prague\u0027s evolution, it serves as an excellent site to learn about medieval religious life and architectural styles, while providing a quiet space for contemplation away from the city crowds.", "name": "Church of St. Stephen (Kostel svat\u00e9ho \u0160t\u011bp\u00e1na)", "transport": "Metro line B at Karlovo n\u00e1m\u011bst\u00ed station; Tram lines 3, 6, 10, 16, 18, 22, 24 at Karlovo n\u00e1m\u011bst\u00ed station."}, {"address": "Jind\u0159i\u0161sk\u00e1, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Henry\u0027s Tower is a standalone Gothic bell tower in Prague\u0027s New Town. Soaring to a height of 65 meters, it holds the title of the tallest free-standing bell tower in the city. Originally constructed in the 15th century to serve the nearby Church of St. Henry and St. Kunhuta, this historic tower has been thoughtfully converted into a multifunctional cultural space. Today, it houses a small museum, art galleries, a restaurant, and a top-floor observation deck. Visitors can ride the elevator or climb up to enjoy sweeping panoramic views over New Town and beyond. The exhibits detail the tower\u0027s history and Prague\u0027s urban development, while the top-floor restaurant offers a memorable dining environment, making it a wonderful stop for architecture fans and sightseers alike.", "name": "Henry\u0027s Tower (Jind\u0159i\u0161sk\u00e1 v\u011b\u017e)", "transport": "Metro line C at Hlavn\u00ed n\u00e1dra\u017e\u00ed station; Tram lines 3, 5, 9, 14, 24 at Jind\u0159i\u0161sk\u00e1 station."}, {"address": "Jind\u0159i\u0161sk\u00e1 972/3, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Church of St. Henry and St. Kunhuta is a historic Gothic parish church closely linked with the famous Henry\u0027s Tower (Jind\u0159i\u0161sk\u00e1 v\u011b\u017e). Established by Emperor Charles IV in the mid-14th century, it was built as one of the primary parish churches for the newly expanded New Town. Although it underwent several remodelings over the centuries\u2014including Baroque interior additions\u2014its core Gothic structure remains clearly recognizable. The interior is relatively understated yet exudes a peaceful atmosphere filled with lovely details, such as stained-glass windows and historic altars. It offers a tranquil retreat from the bustling city streets, inviting visitors to immerse themselves in Prague\u0027s rich religious heritage and architectural beauty.", "name": "Church of St. Henry and St. Kunhuta (Kostel svat\u00e9ho Jind\u0159icha a Kunhuty)", "transport": "Metro line C at Hlavn\u00ed n\u00e1dra\u017e\u00ed station; Tram lines 3, 5, 9, 14, 24 at Jind\u0159i\u0161sk\u00e1 station."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Jungmannovo n\u00e1m\u011bst\u00ed 753/18, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Hidden just behind Wenceslas Square, this peaceful oasis and historic garden is a true gem of Prague\u0027s New Town. Famous for its manicured flowerbeds, rose gardens, fruit trees, and fountains, it offers a perfect retreat from the hustle and bustle of the city. Visitors can relax on benches, admire the surrounding architecture, or stroll along quaint pathways. Thoughtfully designed to bring a touch of nature right into the city center, it\u0027s a beloved secret garden for locals and tourists alike.", "name": "Franciscan Garden", "transport": "Metro Line A/B M\u016fstek Station; Tram Lines 3, 9, 14, 24 V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed Station"}, {"address": "Karlovo n\u00e1m\u011bst\u00ed, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.0 stars | As one of Prague\u0027s largest squares, Charles Square features a vast and lovely park at its center. The park boasts majestic ancient trees, neatly manicured lawns, vibrant flowerbeds, and several sculptures, including a monument to Charles IV. It\u0027s a popular spot for locals to stroll, picnic, and unwind. Seamlessly blending history with nature, it serves as a vital green lung for the city, bursting with blooming flowers and vibrant scenery in spring and summer.", "name": "Park on Charles Square", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed Station; Tram Lines 3, 6, 10, 14, 16, 18, 22, 24 Karlovo n\u00e1m\u011bst\u00ed Station"}, {"address": "Na Slupi 16, 128 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.5 stars | Part of the Faculty of Science at Charles University, this botanical garden boasts an impressive variety of plant species, including rare specimens from all over the world. The grounds feature outdoor gardens and several greenhouses, each simulating different climate zones to display tropical, subtropical, and desert flora. Visitors can learn about botany, admire unique plant landscapes, and marvel at the wonders of nature. Combining education with leisure, it\u0027s a delightful destination, especially for plant enthusiasts.", "name": "Botanical Garden of Charles University Faculty of Science", "transport": "Tram Lines 3, 14, 18, 24 Botanick\u00e1 zahrada Station"}, {"address": "Slovansk\u00fd ostrov 226, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Located on the Vltava River, this picturesque island is renowned for the elegant \u017dof\u00edn Palace and its expansive green spaces. Featuring manicured lawns, mature trees, and charming gardens, it\u0027s an ideal spot for walking, renting pedal boats, and taking in riverside views. \u017dof\u00edn Palace frequently hosts concerts and balls, adding a touch of cultural flair. The island also offers breathtaking panoramas of Prague Castle and the National Theatre, making it a peaceful sanctuary right in the city center.", "name": "Slavic Island / \u017dof\u00edn Palace", "transport": "Metro Line B N\u00e1rodn\u00ed t\u0159\u00edda Station; Tram Lines 2, 9, 17, 18, 22 N\u00e1rodn\u00ed divadlo Station, then walk across the bridge"}, {"address": "St\u0159eleck\u00fd ostrov, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Nestled in the middle of the Vltava River connecting New Town and Lesser Town, this vibrant island park features leafy trees and open lawns. In the summer, it becomes a buzzing hotspot for music festivals, open-air movie screenings, and outdoor events. Visitors can enjoy picnics, leisurely walks, or rent rowboats on the river. The island offers stellar views of the Charles Bridge, Prague Castle, and the National Theatre, serving as a unique natural escape in the heart of the city.", "name": "Shooter\u0027s Island", "transport": "Metro Line A/B M\u016fstek Station; Tram Lines 2, 9, 17, 18, 22 N\u00e1rodn\u00ed divadlo Station, then walk across Legi\u00ed Bridge"}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.3 stars | While primarily a waterfront promenade, Ra\u0161\u00edn Embankment stands out as a key scenic spot in New Town thanks to its green borders, picturesque walkways, and proximity to the famous Dancing House. It is a fantastic venue for strolling, jogging, and cycling, while enjoying sweeping views of the Vltava River, Prague Castle, and Pet\u0159\u00edn Hill. The bustling weekend farmers\u0027 market adds vibrant energy, allowing visitors to immerse themselves in local life alongside the scenic views.", "name": "Ra\u0161\u00edn Embankment", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed Station; Tram Lines 2, 3, 5, 17 Palack\u00e9ho n\u00e1m\u011bst\u00ed Station"}, {"address": "Masarykovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 3.8 stars | A charming, compact park nestled along the banks of the Vltava River in New Town. Loved by locals for its tranquil vibe and well-kept greenery, it features comfortable benches, lush trees, and colorful flowerbeds\u2014making it a perfect spot for a quick rest or enjoying the refreshing river breeze. Located near the National Theatre and Slavic Island, it offers a convenient and pleasant scenic stop while exploring the area.", "name": "Z\u00edtka Gardens", "transport": "Metro Line B N\u00e1rodn\u00ed t\u0159\u00edda Station; Tram Lines 2, 9, 17, 18, 22 N\u00e1rodn\u00ed divadlo Station"}, {"address": "Wilsonova 300/8, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 3.9 stars | A cozy urban park situated right next to the National Museum and Wenceslas Square. Offering a refreshing patch of green with manicured lawns, shady trees, and classic sculptures, it provides an ideal spot to unwind after touring the museum or shopping nearby. Though smaller than Prague\u0027s grander parks, its central location and inviting ambiance make it a popular green nook in New Town.", "name": "\u010celakovsk\u00fd Gardens", "transport": "Metro Line A/C Muzeum Station; Tram Lines 3, 9, 14, 24 Muzeum Station"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Wenceslas Square is the vibrant heart of Prague\u0027s New Town, serving as a lively commercial and cultural hub. This elongated square has witnessed numerous pivotal moments in Czech history, from the National Revival movement to the Velvet Revolution, with every stone telling a story. Grand buildings, boutiques, restaurants, and hotels line both sides, while the top is crowned by the magnificent National Museum and the equestrian statue of St. Wenceslas\u2014making for a fantastic photo backdrop. Whether it\u0027s the daytime bustle or the illuminated evening scene, it offers rich inspiration for photographers. The view looking down over the square from the steps of the National Museum is particularly breathtaking, capturing both Prague\u0027s urban pulse and historic depth. Featuring a diverse range of architectural styles from Neo-Renaissance to Art Nouveau, every single building here is worth appreciating.", "name": "Wenceslas Square", "transport": "Metro lines A \u0026 B M\u016fstek Station; Metro lines A \u0026 C Muzeum Station; multiple tram lines"}, {"address": "Jir\u00e1skovo n\u00e1m. 6, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.4 stars | The Dancing House, also known as Fred and Ginger, is one of Prague\u0027s most iconic modern architectural landmarks, designed by Frank Gehry and Vlado Miluni\u0107. Its unique, dynamic shape resembles a pair of dancers twirling by the Vltava River, seamlessly blending glass and concrete to shatter traditional architectural conventions. The building is especially enchanting at sunset or lit up at night, making it a favorite photo spot for photographers and tourists alike. The top floor features an observation deck and restaurant, offering panoramic views of Prague Castle and the Vltava River\u2014a must-visit to experience Prague\u0027s modern art alongside its cityscape. Its irregular curves and staggered windows add infinite fun and artistic flair to any photo.", "name": "Dancing House", "transport": "Tram 17 or 18 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed Station"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 68, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Located at the top of Wenceslas Square, the National Museum is a grand Neo-Renaissance building whose magnificent facade and massive dome are works of art in themselves. As the largest museum in the Czech Republic, it houses rich collections of natural science, history, and art, while standing as an iconic Prague landmark. From the broad steps in front of the museum, you can take in the bustling panorama of Wenceslas Square, offering an incredible vantage point for photographing cityscapes and crowd scenes. The interior is equally lavish, adorned with marble, frescoes, and sculptures; even if you don\u0027t step inside, taking photos outside lets you feel its imposing grandeur and deep historical roots. Under the night lights, the museum glows with golden brilliance, exuding a distinct charm.", "name": "National Museum", "transport": "Metro lines A \u0026 C Muzeum Station"}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1 61, 116 02 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Lucerna Palace Passage is an artistic hidden gem in Prague\u0027s New Town, famous for its unique upside-down equestrian statue of St. Wenceslas. Created by the renowned Czech artist David \u010cern\u00fd, this subversive piece depicts St. Wenceslas riding an upside-down dead horse suspended beneath a vaulted ceiling, full of satire and humor, making it one of Prague\u0027s most popular modern art spots. Beyond this sculpture, Lucerna Palace itself is a grand Art Nouveau building containing a cinema, concert hall, and shops, with gorgeous glass skylights and decorative details worth savoring. Sunlight streaming through the glass roof creates a unique atmosphere for photography, making it a great location to capture the intersection of art and culture in Prague.", "name": "Lucerna Palace Passage", "transport": "Metro lines A \u0026 B M\u016fstek Station; Tram 3, 9, 14, 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed Station"}, {"address": "Jind\u0159i\u0161sk\u00e1, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Jind\u0159i\u0161sk\u00e1 Tower is a Gothic bell tower located in Prague\u0027s New Town, originally built as a standalone belfry for the Church of St. Henry and St. Kunigunde. Standing 65 meters high, this carefully restored stone tower now houses restaurants, a caf\u00e9, and an observation deck offering 360-degree panoramic views of Prague. Looking down from the top, you can take in Prague Castle, Old Town Square, Wenceslas Square, and the red-tiled roofs of New Town, making it a prime spot for photographing cityscape shots and sunsets. Its ancient stone walls and delicate details are great subjects in their own right. Whether under the bright daytime sun or the romantic evening lights, Jind\u0159i\u0161sk\u00e1 Tower delivers breathtaking perspectives that photography enthusiasts shouldn\u0027t miss.", "name": "Jind\u0159i\u0161sk\u00e1 Tower", "transport": "Metro lines A \u0026 B M\u016fstek Station; Tram 3, 9, 14, 24 to Jind\u0159i\u0161sk\u00e1 Station"}, {"address": "Jungmannovo n\u00e1m. 753/18, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | The Church of Our Lady of the Snows is a grand Gothic church in Prague\u0027s New Town, founded by Charles IV in the 14th century with plans to make it the largest church in Prague\u2014though it remained unfinished due to the Hussite Wars. Nevertheless, its surviving sections, including a soaring vaulted ceiling, a massive high altar, and exquisite stained-glass windows, reveal breathtaking scale and artistic value. Light filtering through tall windows creates a solemn, sacred atmosphere, providing a wonderful venue for architectural and light-and-shadow photography. Its simple yet lofty facade contrasts sharply with surrounding modern buildings, offering unique composition opportunities. Though less famous than Old Town\u0027s churches, its distinct history and architectural aesthetics make it well worth a visit.", "name": "Church of Our Lady of the Snows", "transport": "Metro lines A \u0026 B M\u016fstek Station; Tram 3, 9, 14, 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed Station"}, {"address": "Jungmannovo n\u00e1m., 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Franciscan Garden is a tranquil oasis in the heart of Prague\u0027s New Town, tucked away between Wenceslas Square and Jungmannovo Square. Originally belonging to the Franciscan monastery of the Church of Our Lady of the Snows, this lovely garden is now open to the public, offering a peaceful sanctuary from urban bustle. Planted with a variety of roses, herbs, and fruit trees, it features a central fountain, sculptures, and plenty of benches for relaxation. Whether lush with spring blossoms, vibrant summer greenery, or colorful autumn foliage, it makes a stunning backdrop for nature and portrait photography. Its quiet charm and refined landscape design offer photographers a rare chance to capture Prague\u0027s romantic, idyllic side.", "name": "Franciscan Garden", "transport": "Metro lines A \u0026 B M\u016fstek Station; Tram 3, 9, 14, 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed Station"}, {"address": "Karlovo n\u00e1m. 1/23, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.2 stars | The New Town Hall is a historically significant landmark in Prague\u0027s New Town, situated at the northeast corner of Charles Square. This magnificent Gothic building, with its soaring tower and intricate facade, was the site of the first Defenestration of Prague, marking the start of the Hussite Wars. Its solemn, historic architectural style stands out with red roofing and grey stone walls under the sunlight. You can capture the majestic silhouette of the town hall from various angles across Charles Square, with its tower serving as a fantastic element for cityscape and historic architecture photography. Though quieter than its counterpart in Old Town Square, its rich history and distinct architectural aesthetic make it a rewarding stop for photography enthusiasts seeking Prague\u0027s historical depth.", "name": "New Town Hall", "transport": "Metro line B Karlovo n\u00e1m\u011bst\u00ed Station; multiple tram lines"}], "name": "Top Photo Spots"}}, "name": "\u65b0\u57ce\u5340 (Nov\u00e9 M\u011bsto)"}, "old_town": {"categories": {"cat_1": {"items": [{"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Charles Bridge is one of Prague\u0027s most iconic landmarks, spanning the Vltava River to connect the Old Town with Mal\u00e1 Strana (Lesser Town). Commissioned by Charles IV in 1357, this Gothic stone bridge took centuries to complete. It is lined with 30 exquisite Baroque statues, the most famous being the Statue of St. John of Nepomuk\u2014touching its base is said to bring good luck. Strolling across the bridge offers breathtaking views of Prague Castle, the Old Town, and the Vltava River, surrounding you with rich history and an artistic atmosphere. Bridge towers stand at both ends; the Old Town Bridge Tower is considered one of Europe\u0027s finest Gothic structures, offering magnificent panoramic views. It is also a lively hub for street performers, painters, and souvenir vendors, oozing charm day and night.", "name": "Charles Bridge (Karl\u016fv most)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk for about 5 minutes; or take Tram 17 or 18 to Karlovy l\u00e1zn\u011b Station and walk from there."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.9 stars | Old Town Square is Prague\u0027s oldest and largest square, as well as one of the most beautiful in Europe. Serving as the heart of Prague since the 12th century, it has witnessed countless historical events. The square is ringed by diverse historic architecture, including the grand Church of Our Lady before T\u00fdn, the Baroque St. Nicholas Church, and the Old Town Hall featuring the famous Astronomical Clock. At the center stands the Jan Hus Memorial, surrounded by open-air cafes and restaurants perfect for relaxing and watching street performances. Vibrant markets are held here every Christmas and Easter, brimming with festive cheer. Whether admiring architecture, sensing history, or simply taking in Prague\u0027s relaxed vibe, the square is a must-visit.", "name": "Old Town Square (Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk for about 5 minutes; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 Station and walk from there."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 1/3, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Located on the southern wall of the Old Town Hall, the Prague Astronomical Clock is one of the oldest operating astronomical clocks in the world, renowned for its intricate mechanical artistry and complex design. It consists of three main components: the astronomical dial showing the positions of the sun and moon and various astronomical data; the \u0027Walk of the Apostles\u0027 mechanical show where statues of the Twelve Apostles appear sequentially at the windows on the hour; and a calendar dial representing months and holy days. Dating back to 1410, its unique Gothic style and masterful craftsmanship make it an iconic Prague attraction. Every hour, crowds gather in the square to witness this captivating performance, feeling the tick of time and the wisdom of history.", "name": "Prague Astronomical Clock (Pra\u017esk\u00fd orloj)", "transport": "Located in Old Town Square. Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Church of Our Lady before T\u00fdn is the most striking building in Old Town Square, its soaring twin towers and Gothic spires defining the Prague skyline. Construction began in the 14th century and spanned centuries, blending Gothic and early Baroque architectural elements. The interior is lavishly decorated with fine altars, sculptures, and a magnificent pipe organ, with the tomb of Danish astronomer Tycho Brahe being a key highlight. Illumined by night lights, its exterior takes on a mystical, fairytale-like quality. A symbol of Prague\u0027s history and faith, this masterpiece of Gothic architecture draws countless visitors eager to admire its grandeur and intricate craftsmanship.", "name": "Church of Our Lady before T\u00fdn (T\u00fdnsk\u00fd chr\u00e1m)", "transport": "Located in Old Town Square. Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Located in Old Town Square, St. Nicholas Church is a stunning masterpiece of Baroque architecture. Distinct from its namesake in Mal\u00e1 Strana, this church is famous for its bright white exterior and vibrant green dome. Built in the 18th century and designed by renowned Baroque architect Kili\u00e1n Ign\u00e1c Dientzenhofer, the interior is opulently decorated with exquisite frescoes, sculptures, and crystal chandeliers, creating a solemn yet grand ambiance. The church boasts exceptional acoustics and frequently hosts classical concerts, allowing visitors to enjoy wonderful music alongside magnificent architecture. It stands as a paradigm of Prague Baroque art and an unmissable architectural jewel on Old Town Square.", "name": "St. Nicholas Church (Kostel svat\u00e9ho Mikul\u00e1\u0161e)", "transport": "Located in Old Town Square. Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes."}, {"address": "Na P\u0159\u00edkop\u011b 859/20, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | The Powder Tower marks the eastern entrance to Prague\u0027s Old Town and is one of the city\u0027s most famous Gothic city gates. Built in the 15th century, it originally served as a ceremonial entrance to the royal palace before being used to store gunpowder in the 17th century, which gave it its name. Adorned with delicate sculptures and coats of arms, this towering dark Gothic building exudes a sense of historical grandeur. Visitors can climb to the top for sweeping views of the Old Town, Municipal House, and the distant T\u00fdn Church. More than just a fortress gate, the Powder Tower is an iconic portal into history and a must-see for photography enthusiasts and history buffs.", "name": "Powder Tower (Pra\u0161n\u00e1 br\u00e1na)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station, exit right at the station; or take Tram 5, 8, 14, or 26 to N\u00e1m\u011bst\u00ed Republiky Station and walk from there."}, {"address": "K\u0159i\u017eovnick\u00e9 n\u00e1m\u011bst\u00ed 3, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Standing at the eastern end of Charles Bridge, the Old Town Bridge Tower is a grand Gothic gate connecting the Old Town with the bridge. Widely praised as one of Europe\u0027s most beautiful Gothic structures, it was commissioned by Charles IV in the 14th century. Its exterior is decorated with fine sculptures of St. Vitus, Charles IV, and Wenceslaus IV, alongside various coats of arms and symbolic motifs. Climbing to the top rewards you with a 360-degree panoramic view of Charles Bridge, the Vltava River, Prague Castle, and the Old Town\u2014an unbeatable spot for classic Prague photography. Beyond its defensive role, the tower was crafted to display the glory of the Kingdom of Bohemia, impressing all with its history and aesthetics.", "name": "Old Town Bridge Tower (Starom\u011bstsk\u00e1 mosteck\u00e1 v\u011b\u017e)", "transport": "Located at the eastern end of Charles Bridge. Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes."}, {"address": "Maiselova 18, 110 00 Josefov, Czechia", "feature": "\u2b50 4.3 stars | Located in Prague\u0027s Jewish Quarter, the Old-New Synagogue is Europe\u0027s oldest active synagogue and the world\u0027s oldest surviving Gothic synagogue. Built in the late 13th century, its unique early Gothic style and twin-nave design set it apart from other synagogues. The interior is simple yet solemn, steeped in history, and is rumored to be the hiding place of the legendary Golem. As the heart of Prague\u0027s Jewish community, it stands as a testament to centuries of resilience and history. Visiting the Old-New Synagogue offers a deep dive into Jewish history and culture, allowing visitors to feel the profound emotion and enduring faith bound to this ancient structure.", "name": "Old-New Synagogue (Staronov\u00e1 synagoga)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 10 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m. 604, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | The Church of Our Lady before T\u00fdn is one of the most striking Gothic buildings in Prague\u0027s Old Town Square, with its towering twin spires forming an iconic feature of the city skyline. Dating back to the 14th century, this church was once a center of the Hussite movement and was later reclaimed by Catholics during the Counter-Reformation, undergoing Baroque modifications. The interior houses a rich collection of artwork, including Gothic, Renaissance, and Baroque altarpieces, sculptures, and tombstones, most famous of which is the tomb of Danish astronomer Tycho Brahe. Its grand organ is also one of the oldest in the Czech Republic and is still used for concerts today. The architectural details are breathtaking, from the intricate exterior carvings to the opulent interior decorations, showcasing artistic excellence across different eras\u2014a must-visit for exploring Prague\u0027s religious art and history.", "name": "Church of Our Lady before T\u00fdn", "transport": "Metro Line A or B to M\u016fstek station, about a 5-7 minute walk; or take a tram to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m., 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Located in the Old Town Square, St. Nicholas Church is one of Prague\u0027s most outstanding Baroque buildings, standing out with its green dome and white exterior. Designed by renowned Baroque architects Christoph Dientzenhofer and his son Kilian Ignaz Dientzenhofer, it was completed in the mid-18th century. The interior is lavishly decorated with stunning frescoes, sculptures, and a resplendent altar. Notably, the ceiling fresco depicting the life of Saint Nicholas is one of the largest Baroque frescoes in Europe. The church\u0027s organ is also world-famous; Mozart once played it here. Today, St. Nicholas Church is not only an important place of worship but also frequently hosts classical music concerts, allowing visitors to enjoy wonderful music while admiring its architectural art.", "name": "St. Nicholas Church (Old Town Square)", "transport": "Metro Line A or B to M\u016fstek station, about a 5-7 minute walk; or take a tram to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Mari\u00e1nsk\u00e9 n\u00e1m. 5, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | The Klementinum is the second-largest building complex in Prague after the Castle, formerly a Jesuit college and now home to the National Library of the Czech Republic. Founded in the 16th century, this magnificent Baroque complex blends multiple architectural styles. Its most breathtaking feature is the Baroque Library Hall, widely considered one of the world\u0027s most beautiful libraries, where ceiling frescoes and antique globes leave visitors spellbound. The complex also houses the Church of St. Clement and the Mirror Chapel, the latter known for its unique mirrored decorations and exquisite frescoes, frequently hosting classical music concerts. Visitors can join guided tours to explore this historic academic and religious center and experience its rich cultural heritage and sublime artistic charm.", "name": "Klementinum", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, about a 3-minute walk; or take a tram to Starom\u011bstsk\u00e1 station."}, {"address": "Mal\u00e1 \u0160tupartsk\u00e1 635/6, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | St. James\u0027s Church is a magnificent Baroque church in Prague\u0027s Old Town, renowned for its exceptional acoustics and rich art collection. Originally built in the 13th century in Gothic style, it was rebuilt in its current Baroque style after a major fire in the late 17th century. The interior is opulently decorated, featuring impressive altars, sculptures, and frescoes, most famous of which is the depiction of Saint James\u0027s Assumption on the main altar. The church also houses one of the largest pipe organs in the Czech Republic, known for its resonant sound, frequently hosting international organ concerts. An intriguing detail is a mummified human arm hanging near the entrance, said to belong to a medieval thief as a grim warning. This church is not only an important religious site but also a premier destination for classical music and art enthusiasts in Prague.", "name": "St. James\u0027s Church", "transport": "Metro Line A or B to M\u016fstek station, about a 7-10 minute walk; or take a tram to Dlouh\u00e1 t\u0159\u00edda station, about a 5-minute walk."}, {"address": "Martinsk\u00e1 8, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | The Church of St. Martin in the Wall is a historic Gothic church in Prague\u0027s Old Town, named after its unique former position built right against the old city wall. Dating back to the 12th century as a Romanesque structure, it was later rebuilt in Gothic style during the reign of Charles IV in the 14th century. It is one of the few churches in Prague that retains remnants of medieval city walls, bearing witness to centuries of urban evolution. While its interior is less ornate than Baroque churches, its simple Gothic vaults and frescoes exude a distinct solemn beauty. It was an important site for Hussite reforms and where Holy Communion under both kinds was first served in Czech history. Today, besides religious services, the church regularly hosts classical music concerts and art exhibitions, allowing visitors to appreciate ancient architecture while immersing in its rich historic atmosphere.", "name": "Church of St. Martin in the Wall", "transport": "Metro Line A or B to M\u016fstek station, about a 5-minute walk; or take a tram to N\u00e1rodn\u00ed t\u0159\u00edda station, about a 3-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 606/12, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Kinsk\u00fd Palace is a gorgeous Rococo palace located in Prague\u0027s Old Town Square, now part of the National Gallery Prague, mainly used for temporary art exhibitions. Built in the mid-18th century, its delicate pink facade and exquisite stucco decorations make it stand out on the square. The interior retains many original Rococo details and is a work of art in itself. As a venue for the National Gallery, Kinsk\u00fd Palace frequently displays works by Czech and international artists across various art forms from antiquity to modern times, offering a rich visual feast for art lovers. Furthermore, this was once the site of Franz Kafka\u0027s father\u0027s shop, adding a layer of literary significance. Visiting Kinsk\u00fd Palace offers not only high-caliber art exhibitions but also a glimpse into the luxury and taste of Prague\u0027s nobility.", "name": "National Gallery Prague - Kinsk\u00fd Palace", "transport": "Metro Line A or B to M\u016fstek station, about a 5-7 minute walk; or take a tram to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Charles Bridge is one of Prague\u0027s most iconic landmarks, spanning the Vltava River to connect the Old Town with Mal\u00e1 Strana (Lesser Town). Commissioned by Charles IV in the 14th century, this medieval stone bridge is one of Europe\u0027s oldest and most beautiful bridges. Adorned with 30 exquisite Baroque sculptures\u2014mostly depicting saints\u2014it serves as an open-air art gallery. These sculptures carry religious significance while showcasing the peak of 17th- and 18th-century Czech sculpture art. Strolling along the bridge, visitors can admire stunning views of Prague Castle, the Old Town, and the Vltava River while soaking in historical depth and artistic charm. Street performers, painters, and souvenir stalls line the path, adding lively energy to this ancient bridge and making it a premier spot to experience Prague\u0027s romantic aura.", "name": "Charles Bridge", "transport": "Metro Line A to Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take a tram to Karlovy l\u00e1zn\u011b station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | The Prague Astronomical Clock is one of the oldest operating mechanical clocks in the world, mounted on the southern wall of the Old Town Hall in Old Town Square. First installed in 1410, this medieval masterpiece astounds visitors with its complex mechanism and beautiful artwork. The clock consists of three main components: the astronomical dial representing the positions of the sun and moon in the sky along with astronomical details; the \u0027Walk of the Apostles\u0027 where statues of the Twelve Apostles appear in the windows every hour; and a calendar dial depicting scenes of rural life representing the months of the year. Far more than a precision timepiece, it is a masterpiece combining science, art, and philosophy, serving as a key symbol of Prague\u0027s history and culture. Whenever the clock strikes the hour, large crowds gather in the square to witness this unique mechanical performance.", "name": "Prague Astronomical Clock", "transport": "Metro Line A or B to M\u016fstek station, about a 5-minute walk; or take a tram to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Mal\u00e1 Strana, 118 00 Praha 1", "feature": "\u2b50 4.7 stars | Known as the \u0027Venice of Prague,\u0027 Kampa Island is a charming island on the Vltava River. Although administratively part of the Lesser Town (Mal\u00e1 Strana), its location is closely connected to Charles Bridge, making it an essential nature spot for Old Town visitors. The island is lush with greenery, featuring broad lawns, winding paths, and the gently flowing Devil\u0027s Stream (\u010certovka), creating a tranquil and romantic atmosphere. Visitors can take in breathtaking views of Charles Bridge, the Old Town, and Prague Castle, as well as see the famous water mill and the Kampa Museum. It\u2019s a wonderful spot to unwind, have a picnic, or take a stroll, especially at sunset when the picturesque scenery leaves a lasting impression.", "name": "Kampa Island", "transport": "Walk down directly from Charles Bridge (Karl\u016fv most); or take Metro Line A to Starom\u011bstsk\u00e1 Station, followed by a 10-15 minute walk."}, {"address": "Na Franti\u0161ku, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.0 stars | Located in the northeastern part of the Old Town along the Vltava River, Na Franti\u0161ku Park is a cozy green space offering a tranquil escape from busy city life. With manicured lawns, tall trees, and comfortable benches, it\u0027s an ideal spot for locals and visitors to stroll, read, or soak up the sun. The park overlooks Letn\u00e1 Park on the opposite bank and offers refreshing views and breezes along the Vltava River. It also serves as a convenient starting point for exploring the Jewish Quarter or walking along the riverfront, making this simple yet practical park an inviting urban oasis in the Old Town.", "name": "Na Franti\u0161ku Park", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 10 minutes; or take Tram 17 to Pr\u00e1vnick\u00e1 fakulta Station."}, {"address": "Smetanovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.6 stars | Smetana Embankment is one of the most famous riverfront promenades along the Vltava in Prague\u0027s Old Town, renowned for its incomparable vistas. It offers one of the best viewpoints for admiring Charles Bridge, Prague Castle, and St. Vitus Cathedral, making it a fantastic spot to feel the heartbeat of the river. Featuring wide tree-lined sidewalks, it is a popular choice for walking, jogging, or simply sitting back to enjoy the scenery. Sunrise and sunset are particularly magical when sunlight bathes the castle and the water, attracting countless photographers and couples. It is also a docking point for many river cruises, offering a unique perspective of Prague from the water.", "name": "Smetana Embankment (Smetanovo n\u00e1b\u0159e\u017e\u00ed)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes; or take Tram 2, 17, or 18 to Karlovy l\u00e1zn\u011b Station."}, {"address": "Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.3 stars | Located north of Smetana Embankment, Dvo\u0159\u00e1k Embankment is another significant waterfront stretch along the Vltava in the Old Town, named after the famous Czech composer Anton\u00edn Dvo\u0159\u00e1k. This promenade offers a different perspective, featuring side views of Charles Bridge, the grand architecture of the Rudolfinum, and scenery across to Mal\u00e1 Strana. The spacious walkway is perfect for a leisurely stroll in a relaxing riverfront atmosphere. With relatively fewer tourists, it feels quieter\u2014a great spot to step away from crowds, meditate, or take in the cityscape. Numerous caf\u00e9s and restaurants line the way, allowing you to enjoy delicious food accompanied by beautiful river views.", "name": "Dvo\u0159\u00e1k Embankment (Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 5 minutes; or take Tram 17 to Starom\u011bstsk\u00e1 Station."}, {"address": "St\u0159eleck\u00fd ostrov, 110 00 Praha 1", "feature": "\u2b50 4.5 stars | St\u0159eleck\u00fd Island is a green jewel on the Vltava River, nestled between the Old Town and the Lesser Town, easily accessible via Legions Bridge (Most Legi\u00ed). Although technically part of Mal\u00e1 Strana, its location makes it an excellent choice for Old Town visitors looking to experience nature. The island boasts sprawling lawns, tall shade trees, and playgrounds, making it a rare peaceful oasis in central Prague. Visitors can picnic, sunbathe, stroll, or rent rowboats to explore the river. It offers spectacular panoramic views of Charles Bridge, Prague Castle, and the National Theatre. In summer, the island comes alive with various cultural events and concerts.", "name": "St\u0159eleck\u00fd Island (St\u0159eleck\u00fd ostrov)", "transport": "Take Tram 2, 9, 12, 15, 18, 22, or 23 to N\u00e1rodn\u00ed divadlo Station and walk across Legions Bridge; or take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda Station, followed by a 10-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Curieov\u00fdch, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 3.8 stars | Curie Square is a small and charming green space in the Old Town, located near the Vltava riverfront close to the Jewish Quarter. Centered around a small park surrounded by historic architecture, it offers a refreshing breather from urban hustle. The park features manicured shrubs, vibrant flowerbeds, mature trees, and cozy benches. Though modest in size, its elegant design and peaceful ambiance make it an ideal spot for locals and tourists to pause and enjoy a quiet moment. Visitors can catch the gentle river breeze while admiring the classical beauty of the surrounding buildings.", "name": "Curie Square (N\u00e1m\u011bst\u00ed Curieov\u00fdch)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 7 minutes; or take Tram 17 to Pr\u00e1vnick\u00e1 fakulta Station."}, {"address": "Lannova, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 3.9 stars | Lannova Park is a relatively hidden small park in the eastern part of the Old Town, offering a precious green space for local residents. Though compact, it is thoughtfully designed with lush green lawns, tall trees, and a children\u0027s playground, making it a pleasant getaway for families and peace-seekers. Away from the bustle of main tourist routes, it provides a chance to relax and breathe in a bit of nature. With a very local vibe, it offers a glimpse into the daily life of Prague residents\u2014proof that comforting green corners can exist even in dense city centers.", "name": "Lannova Park (Park Lannova)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station and walk about 5 minutes; or take Tram 3, 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station and walk about 5 minutes."}, {"address": "Anensk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.1 stars | St. Anne\u0027s Square is a historic and charming square in the Old Town. While famous primarily for the Church of St. Anne after which it is named, the small green spot at its center and its surrounding quiet atmosphere make it a delightful addition to nature and park spots. A few large trees offer welcoming shade over benches where visitors can rest. Tucked away from the crowds of Old Town Square, it provides a more intimate and relaxing setting. Visitors can soak in Prague\u0027s historical charm while enjoying a bit of greenery and serenity, surrounded by distinctive architecture.", "name": "St. Anne\u0027s Square (Anensk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk about 7 minutes; or take Tram 2, 17, or 18 to Karlovy l\u00e1zn\u011b Station and walk about 3 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Prague\u0027s Old Town Square is one of Europe\u0027s most beautiful and historically significant squares, surrounded by breathtaking Gothic, Renaissance, and Baroque architecture. As the heart of Prague, it is an absolute must-visit to capture the city\u0027s essence. The Jan Hus Memorial stands at the center, framed by the Church of Our Lady before T\u00fdn, St. Nicholas Church, and the Old Town Hall Astronomical Clock. Whether it\u0027s the bustling daytime crowds, lively street performers, or the romantic evening ambiance, every angle tells a story, making it a dream location for photography enthusiasts.", "name": "Old Town Square", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 5-minute walk; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 Station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 1/3, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Mounted on the southern wall of the Old Town Hall, the Prague Astronomical Clock is one of the world\u0027s oldest operating astronomical clocks. Its intricate mechanics and hourly \u0027Walk of the Apostles\u0027 performance draw crowds of admiring visitors. Beyond telling time, it displays lunar phases, solar positions, and astronomical cycles, making it a living piece of art. On the hour, figures of the Twelve Apostles appear as a skeleton tolls the bell\u2014a captivating spectacle. Looking up from the square or down from the Town Hall Tower, this medieval marvel is one of Prague\u0027s most iconic photo spots.", "name": "Prague Astronomical Clock", "transport": "Located in Old Town Square. Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 5-minute walk."}, {"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.9 stars | Charles Bridge is Prague\u0027s most iconic landmark, spanning the Vltava River to connect Old Town with Lesser Town (Mal\u00e1 Strana). Lined with 30 exquisite Baroque statues, its most famous figurine is St. John of Nepomuk\u2014touching its base is said to bring good luck. Early morning or twilight offers fewer crowds and the best lighting to capture Prague Castle, the river, and the picturesque shorelines. Street musicians, painters, and souvenir stalls breathe vibrant life into this ancient stone bridge, making it a dream destination for photographers and travelers alike.", "name": "Charles Bridge", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 or Malostransk\u00e1 Station, about a 10-minute walk; or take Tram 17 or 18 to Karlovy l\u00e1zn\u011b Station."}, {"address": "Na P\u0159\u00edkop\u011b 859/1, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Serving as the eastern entrance to Old Town, the Powder Tower is one of Prague\u0027s premier Gothic gates. Built in the 15th century, it originally marked the start of the Royal Coronation Route and earned its name in the 17th century when used as a gunpowder storehouse. Its towering silhouette and intricate carvings make for a grand photo backdrop. Visitors can climb to the top for sweeping views of Old Town\u0027s red-tiled roofs and Prague Castle in the distance. Beautiful under sunlight and illuminated at night, it\u0027s a magnificent spot to capture the city\u0027s rich history.", "name": "Powder Tower", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station, right outside the exit; or take Tram 3, 5, 6, 9, 14, 24, or 26 to N\u00e1m\u011bst\u00ed Republiky Station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Dominating the skyline of Old Town Square, the Church of Our Lady before T\u00fdn features iconic twin Gothic spires that capture Prague\u0027s signature skyline.", "name": "Old Town Hall Tower", "transport": "Located in Old Town Square. Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 5-minute walk."}, {"address": "Mari\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed 5, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Klementinum is one of Prague\u0027s largest architectural complexes, second only to Prague Castle. It features a breathtaking Baroque Library, the Mirror Chapel, and an Astronomical Tower. The Baroque Library, often acclaimed as one of the world\u0027s most beautiful, boasts ornate frescoes, historic globes, and rare manuscripts, creating a dreamscape for photography lovers. The Mirror Chapel is famous for its elegant mirrors and frescoes, frequently hosting classical concerts. Climbing the Astronomical Tower offers sweeping views over the city, making the entire complex a treasure trove of Baroque art and architectural beauty.", "name": "Klementinum", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}], "name": "Top Photo Hotspots"}}, "name": "\u8001\u57ce\u5340 (Star\u00e9 M\u011bsto)"}, "vinohrady_zizkov": {"categories": {"cat_1": {"items": [{"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 120 00 Praha 3-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Located in the heart of Vinohrady, the Church of the Most Sacred Heart of Our Lord was designed by Slovenian architect Jo\u017ee Ple\u010dnik and stands as a masterpiece of early 20th-century modern architecture. Its distinctive ship-like body, massive circular clock tower, and simple yet grand facade make it stand out among surrounding buildings. The spacious interior, bathed in light streaming through tall windows, creates a serene and sacred atmosphere. Serving as both a spiritual sanctuary for locals and a must-visit artistic landmark for architecture lovers, it seamlessly blends functionalism with classical elements and is widely regarde  vibe and playground facilities. Tree-lined paths, inviting benches, and a modern playground offer recreation for visitors of all ages. Though modest in size, it serves as an essential green space for nearby residents\u2014ideal for a stroll, dog walking, or letting kids play. Its clean, practical layout captures the authentic charm of local community life.", "name": "Heroldovy Sady", "transport": "Take Tram 7, 22, or 24 to \u0027Rusk\u00e1\u0027 station and walk about 2 minutes; or take Metro Line A to \u0027N\u00e1m\u011bst\u00ed M\u00edru\u0027 station and walk about 15 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Mahlerovy sady 2699/1, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.2 stars | One of the most controversial yet eye-catching landmarks in the Prague skyline, the \u017di\u017ekov Television Tower is famous for its unique surrealist design. Crawling up the tower body are giant \u0027Baby\u0027 sculptures by Czech artist David \u010cern\u00fd, adding a touch of eerie playfulness to this tall structure. Visitors can take a high-speed elevator directly to the observatory deck to enjoy a 360-degree panoramic view of downtown Prague from 93 meters above, capturing stunning cityscape views whether by day or night. Inside, the tower also features a fine dining restaurant and a luxury suite offering a one-of-a-kind accommodation experience. It is definitely a photo spot not to be missed by photography enthusiasts seeking a unique perspective and modern architectural aesthetics.", "name": "\u017di\u017ekov Television Tower (\u017di\u017ekovsk\u00e1 televizn\u00ed v\u011b\u017e)", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad Station and walk for about 10 minutes; or take Tram 9 or 15 to Lipansk\u00e1 Station."}, {"address": "Riegrovy sady, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.6 stars | Riegrovy Sady Park is one of Prague\u0027s most popular urban oases, famous f
