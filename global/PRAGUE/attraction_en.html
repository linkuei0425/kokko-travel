aroque facade that contrasts beautifully with its Romanesque interior, highlighting layers of deep history. Founded around 920 AD by Vratislaus I of Bohemia, the interior is serene and austere, housing the tomb of Saint Ludmila\u2014the resting place of early Bohemian rulers. Its unique Romanesque style, particularly its twin white marlstone towers, makes it stand out within the castle complex, offering a historically serene atmosphere distinct from St. Vitus Cathedral.", "name": "St. George\u0027s Basilica", "transport": "Located inside Prague Castle; take Tram 22 to Pra\u017esk\u00fd hrad station and walk in."}, {"address": "Zlat\u00e1 uli\u010dka u Daliborky 10, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | Situated in the northeastern corner of Prague Castle, this narrow, fairytale-like lane is lined with charming, brightly painted tiny houses. Originally built to house castle guards, goldsmiths, and servants, it later attracted alchemists and artists\u2014most famously Franz Kafka, who resided here for a time. Today, these miniature houses serve as gift shops or small museums reproducing historical living conditions, offering visitors a fascinating glimpse into everyday medieval life in Prague.", "name": "Golden Lane", "transport": "Located inside Prague Castle; take Tram 22 to Pra\u017esk\u00fd hrad station and walk in."}, {"address": "Hrad\u010dany, 119 01 Praha 1, Czechia (within Prague Castle complex)", "feature": "\u2b50 4.0 stars | Located on the eastern side of Prague Castle, this was originally a Renaissance residence for the noble Rosenberg family before being transformed by Empress Maria Theresa into an institute for noblewomen. Renowned for its exquisite interior decor and rich historical background, it showcases both 16th-century aristocratic luxury and subsequent monastic living. Visitors can explore the magnificent chapel, former rooms of noblewomen, and exhibits detailing historical everyday objects, making it a quieter yet deeply rich historic corner of the castle district.", "name": "Rosenberg Palace", "transport": "Located inside Prague Castle; take Tram 22 to Pra\u017esk\u00fd hrad station and walk in."}, {"address": "Vik\u00e1\u0159sk\u00e1 39/1, 119 01 Praha 1-Hrad\u010dany, Czechia (within Prague Castle complex)", "feature": "\u2b50 4.1 stars | Built in the 15th century, this imposing Gothic tower is one of Prague Castle\u0027s oldest fortifications. Originally serving as a cannon tower, it later housed an alchemist\u0027s laboratory and a gunpowder depot, giving it its name. Inside, visitors can explore exhibits on alchemy, astronomy, and castle defense history, as well as climb to the top for sweeping panoramic views of the castle grounds and surrounding city. Its robust architecture and intriguing lore make it a compelling landmark.", "name": "Mihulka Powder Tower", "transport": "Located inside Prague Castle; take Tram 22 to Pra\u017esk\u00fd hrad station and walk in."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m. 2, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | Situated right outside the Prague Castle entrance, this grand Renaissance palace is famous for its striking sgraffito facade, whose black-and-white geometric patterns create an optical illusion of 3D depth. Built in the 16th century as a residence for the Schwarzenberg family, it is now part of the National Gallery, displaying exquisite 16th to 18th-century Baroque artwork. Its magnificent exterior and rich artistic collection make it an unmissable landmark.", "name": "Schwarzenberg Palace", "transport": "Located opposite the main entrance of Prague Castle; take Tram 22 to Poho\u0159elec or Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1/132, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.7 stars | Perched on a hill west of the castle district, this is one of the Czech Republic\u0027s oldest and most significant monasteries, founded by the Premonstratensian order in the 12th century. It is world-famous for its spectacular library, featuring the Philosophical Hall and Theological Hall, which house hundreds of thousands of rare ancient texts beneath breathtaking ceiling frescoes. Beyond the library, the monastery features the Basilica of the Assumption of Our Lady, a picture gallery, and an active brewery, offering a rich tapestry of history, art, and tradition along with sweeping panoramic views of Prague from its gardens.", "name": "Strahov Monastery", "transport": "Take Tram 22 to Poho\u0159elec station and walk for about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "III. n\u00e1dvo\u0159\u00ed 48/2, 119 01 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.8 stars | A grand landmark in the Prague Castle complex, St. Vitus Cathedral is the largest and most important church in the Czech Republic, as well as a masterpiece of Gothic architecture. Its history dates back to 925 AD, and through centuries of expansion and restoration, it blends Gothic, Renaissance, and Baroque styles. The interior is solemn and grand, featuring breathtaking stained glass windows, the most famous of which is the work of Alfons Mucha depicting the legend of Saints Cyril and Methodius. Furthermore, the cathedral serves as the final resting place for many Bohemian kings, Holy Roman Emperors, and saints, including the tomb of St. Wenceslas, whose chapel is ornately decorated with semi-precious stones\u2014a true gem of Czech art. Visitors can climb the Great South Tower for a sweeping panoramic view of Prague, experiencing the historic depth and artistic charm of this millennium-old capital.", "name": "St. Vitus Cathedral", "transport": "Take Metro Line A to Malostransk\u00e1 station, then transfer to Tram 22 to Pra\u017esk\u00fd hrad or Poho\u0159elec station; the castle entrance is a short walk away."}, {"address": "Hrad\u010dany, 119 01 Praha 1, Czechia (Located in the 3rd Courtyard of Prague Castle)", "feature": "\u2b50 4.5 stars | As one of the oldest parts of Prague Castle, the Old Royal Palace served as the residence for Bohemian kings and Holy Roman Emperors, witnessing countless key moments in Czech history. The heart of the palace is the magnificent Vladislav Hall, a Late Gothic architectural marvel famous for its unique vaulted ceiling, historically used for coronations, jousting tournaments, and parliamentary meetings. Visitors can stroll through the Bohemian Chancellery and feel the atmosphere of royal daily life and past politics. The palace also houses the \u0027Story of Prague Castle\u0027 exhibition, offering deep insights into a thousand years of Czech history through artifacts and multimedia. From the palace\u0027s observation deck, enjoy charming views of the Castle District and Lesser Town.", "name": "Old Royal Palace", "transport": "Take Metro Line A to Malostransk\u00e1 station, transfer to Tram 22 to Pra\u017esk\u00fd hrad station, and walk into the castle complex to find it."}, {"address": "Ji\u0159sk\u00e1 33/7, 119 01 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.4 stars | St. George\u0027s Basilica is the oldest surviving church building inside Prague Castle, dating back to the 10th century and serving as a prime example of Romanesque architecture. Its striking red Baroque facade and twin white steeples are iconic features. The interior is simple yet solemn, preserving original Romanesque vaults and frescoes that exude an ancient ambiance. The basilica is the final resting place of several Bohemian rulers, including the remains of Bo\u0159ivoj I, the first Christian ruler of Bohemia. Today, St. George\u0027s Basilica is frequently used as a concert venue, where its unique acoustics add extraordinary charm to classical music performances. Here, visitors can feel the accumulation of a thousand years of history and the serenity of religious art.", "name": "St. George\u0027s Basilica", "transport": "Located between the 2nd and 3rd courtyards of Prague Castle. Take Tram 22 to Pra\u017esk\u00fd hrad station and walk from there."}, {"address": "Ji\u0159sk\u00e1 3, 119 01 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | The Lobkowicz Palace is the only privately owned palace inside the Prague Castle complex. Now open to the public as a museum, it showcases the priceless art collection accumulated by the Lobkowicz family over centuries. The rich and diverse collection includes original manuscripts by Beethoven and Mozart, paintings by masters like Canaletto and Vel\u00e1zquez, exquisite decorative art, royal portraits, and historic weaponry. The palace itself is an architectural treasure, with its Baroque hall and ornate decorations offering a visual feast. Visitors can also enjoy delicious dining at the palace caf\u00e9 while overlooking stunning panoramic views of Prague. It is not only a paradise for art lovers but also an excellent place to understand European noble history and culture.", "name": "Lobkowicz Palace", "transport": "Located on the east side of Prague Castle. Take Tram 22 to Pra\u017esk\u00fd hrad or Malostransk\u00e1 station, enter the castle, and follow the signs."}, {"address": "II. n\u00e1dvo\u0159\u00ed 48/2, 119 01 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.0 stars | Located in the castle\u0027s 2nd Courtyard, the Prague Castle Picture Gallery houses the art treasures of Holy Roman Emperor Rudolf II, along with additions from later Bohemian rulers. Although much of Rudolf II\u0027s original collection was looted during the Thirty Years\u0027 War, the gallery still displays many important 16th to 18th-century works by European masters such as Titian, Rubens, and Tintoretto. Spanning artistic styles from the Late Renaissance to the Baroque period, the exhibits offer visitors an artistic journey through time. Though modest in size, every painting carries rich historical and artistic value, making it an unmissable cultural spot in the Castle District.", "name": "Prague Castle Picture Gallery", "transport": "Located in the 2nd Courtyard of Prague Castle. Take Tram 22 to Pra\u017esk\u00fd hrad station and walk."}, {"address": "Zlat\u00e1 uli\u010dka u Daliborky 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.3 stars | Golden Lane is a legendary narrow street inside Prague Castle, lined with colorful, tiny homes straight out of a fairy tale. Originally built for castle guards, these houses later accommodated goldsmiths, alchemists, and even the writer Franz Kafka, who briefly lived at No. 22. Today, most of these small houses have been transformed into souvenir shops, mini-museums, or exhibits depicting life in centuries past. Visitors can step inside to imagine life long ago and soak in the rich historical ambiance. At the end of the lane stands Daliborka Tower, a former prison. With its unique charm and rich stories, Golden Lane is one of the most popular attractions in Prague Castle.", "name": "Golden Lane", "transport": "Located on the northeast side of Prague Castle; enter from behind St. George\u0027s Basilica or near Lobkowicz Palace."}, {"address": "U Pra\u0161n\u00e9 v\u011b\u017ee, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 3.9 stars | The Powder Tower, also known as Mihulka Tower, is one of the oldest defense towers in Prague Castle, built in the 15th century. It served as a gunpowder storehouse, an alchemist\u0027s laboratory, and legends even say Emperor Rudolf II conducted mystical alchemy research here. Today, the tower features small exhibits introducing castle history, fortifications, and alchemy lore. Visitors can explore various levels of the tower, absorb its heavy sense of history, and enjoy a unique perspective of the castle district from the top. Though compact in scale, its mysterious historical background and distinctive architectural style add a captivating cultural touch to any castle visit.", "name": "Powder Tower Mihulka", "transport": "Located on the north side of Prague Castle, near the Royal Garden entrance. Reachable on foot from the 2nd Courtyard or the Royal Garden."}, {"address": "Hrad\u010dany, 119 01 Praha 1, Czechia (Located on the east side of the Old Royal Palace)", "feature": "\u2b50 4.1 stars | Located on the east side of the Old Royal Palace, All Saints Chapel is an exquisite Gothic chapel dating back to the 14th century. Originally founded by Emperor Charles IV, it was rebuilt after a 16th-century fire and incorporates Baroque elements. Although attached to the Old Royal Palace externally, its interior is sumptuously decorated with fine frescoes and sculptures, especially renowned for its rich collection of holy relics. The chapel\u0027s altar and ceiling decorations are intricately crafted, showcasing artistic styles from the Late Middle Ages and Renaissance. While typically included as part of the Old Royal Palace tour route rather than ticketed separately, it offers profound insights into Czech religious history and art as a standalone religious space.", "name": "All Saints Chapel", "transport": "Located inside the Old Royal Palace; can be visited while touring the Old Royal Palace."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kr\u00e1lovsk\u00e1 zahrada, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | One of the oldest and most beautiful gardens in the Prague Castle complex, founded in 1534, featuring primarily Renaissance style blended with Baroque elements. Once a leisure resort for the Habsburg dynasty, it is home to rare plants from around the world, including Europe\u0027s first tulips. The garden houses the famous Singing Fountain, whose unique bronze structure produces a melodious sound in the wind. Strolling through, visitors can enjoy exquisite sculptures, fountains, and manicured hedges, along with breathtaking views overlooking the north side of the castle from an elevated sible via the castle\u0027s Third Courtyard or the pathway next to St. Vitus Cathedral."}, {"address": "Hartigovsk\u00e1 zahrada, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.4 stars | Located at the eastern end of Prague Castle\u0027s South Gardens, Hartig Garden is a relatively small yet exquisite Baroque garden. It is renowned for its unique Music Pavilion and elegant sculptures; small concerts were once held inside the pavilion. Designed with symmetrical aesthetics, its manicured hedges, fountains, and flowers create an elegant and tranquil atmosphere. Although compact in size, its intricate beauty and wonderful views of the castle and city make it an unmissable part of the South Gardens. The sense of intimacy and artistic aura allows visitors to deeply experience the history and culture of Prague Castle.", "name": "Hartig Garden", "transport": "Located inside the South Gardens of Prague Castle, accessible via the castle\u0027s Third Courtyard or the pathway next to St. Vitus Cathedral."}, {"address": "Jelen\u00ed p\u0159\u00edkop, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.3 stars | The Deer Moat is a natural ravine below Prague Castle that once served as a defensive barrier and royal hunting ground where deer were kept. Today, it has been transformed into a scenic park with a winding path that lets visitors appreciate the castle\u0027s grandeur from different angles. Shaded by lush trees in a peaceful environment, it is an ideal place to escape urban noise and enjoy nature. Inside the moat, there is also a wooden bridge designed by the famous architect Jo\u017ee Ple\u010dnik that connects two parts of the castle. In summer, various cultural events and exhibitions are held here, adding to its charm.", "name": "Deer Moat", "transport": "Accessible from the North or East Gates of Prague Castle, or via a short walk from Kl\u00e1rov Metro Station."}, {"address": "Strahovsk\u00e1 zahrada, Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1/132, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | Located next to the Strahov Monastery, this expansive garden is a green oasis on the western side of the Prague Castle district. The garden is divided into several areas, including the monastery garden, vineyards, and observation platforms. From here, you can overlook the entire city of Prague, including Mal\u00e1 Strana, Old Town, and the Vltava River, offering truly breathtaking views. The monastery\u0027s vineyard is particularly picturesque and produces local wine. Paths and benches throughout the garden provide quiet places for visitors to rest and reflect. Its serene atmosphere and stunning panoramic city views make it a popular spot for photography enthusiasts and travelers seeking a quiet moment.", "name": "Strahov Monastery Garden", "transport": "Take Tram 22 to Poho\u0159elec Station, and walk about 5 minutes to reach the garden."}, {"address": "Chotkovy sady, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.3 stars | Established in 1833, Chotek Gardens is Prague\u0027s first public park, connected to the eastern side of the Royal Garden at Prague Castle. This English-style park is famous for its winding paths, dense woods, and open lawns. The park features numerous sculptures and monuments, including a memorial to the poet Julius Zeyer, as well as a charming pond. Certain vantage points in the park offer views of the castle and the Vltava River. It is a favorite relaxation spot for locals and tourists alike, ideal for strolling, picnic outings, and enjoying natural tranquility.", "name": "Chotek Gardens", "transport": "Take Tram 22 to Kr\u00e1lovsk\u00fd letohr\u00e1dek Station, or walk for about 10 minutes from Malostransk\u00e1 Metro Station."}, {"address": "Pet\u0159\u00ednsk\u00e9 sady, 118 00 Praha 1-Mal\u00e1 Strana (accessible from Hrad\u010dany/Strahov side), Czechia", "feature": "\u2b50 4.7 stars | Pet\u0159\u00edn Hill is one of Prague\u0027s largest green spaces. Although mostly situated in Mal\u00e1 Strana, its northern slopes and the areas leading to Strahov Monastery connect closely with the castle district, offering magnificent elevated views of Prague Castle and the entire city. Pet\u0159\u00edn Gardens include several themed areas, such as a rose garden, a mirror maze, and an observation tower. Visitors can take the funicular up the hill or hike along scenic trails. Combining nature and city views seamlessly, it is one of Prague\u0027s most popular outdoor recreation spots. From the summit, you get a clear full view of Prague Castle and the city skyline beyond, making it an excellent spot for photography and enjoying natural beauty.", "name": "Pet\u0159\u00edn Gardens", "transport": "Walkable from the northern entrance in the Hrad\u010dany/Strahov area, or take Tram 22 to Poho\u0159elec Station and walk. You can also take the funicular up from \u00dajezd Station."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Hrad\u010dany, 119 01 Prague 1, Czechia", "feature": "\u2b50 4.7 stars | Prague Castle is the largest ancient castle complex in the world, perched on a hill by the Vltava River overlooking the entire city of Prague. It is not only a symbol of the Czech Republic, but also the heart of its history and culture. This magnificent complex comprises palaces, churches, a monastery, gardens, and defense towers, each steeped in rich history. From the Gothic spires of St. Vitus Cathedral to the fairytale cottages of Golden Lane, every corner offers incredible photo opportunities. Visitors can stroll through historic courtyards, admire striking architectural details, and capture breathtaking panoramas of Prague\u0027s red-tiled roofs from multiple viewpoints. Radiating an incredible charm both day and night, Prague Castle is an absolute must-visit spot for anyone traveling to Prague.", "name": "Prague Castle", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad or Poho\u0159elec stop; or take Metro L ue Castle complex, belonging to the Lobkowicz family. The palace itself features stunning architecture and houses centuries of priceless family artwork, musical instruments, military artifacts, and original manuscripts by Beethoven and Mozart. Audio guides allow visitors to dive deep into the history of this prominent family and the significance of their collections. One of its main highlights is the balcony, offering breathtaking panoramic views of the Lesser Town (Mal\u00e1 Strana) and the Vltava River\u2014a perfect vantage point for city photography. The palace cafe also offers a delightful opportunity to enjoy food and scenery in a historical ambiance, making it a popular hotspot blending culture, history, and scenery.", "name": "Lobkowicz Palace", "transport": "Located within Prague Castle; accessible on foot."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1/132, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.7 stars | Renowned as one of the world\u0027s most beautiful historic libraries, the Strahov Monastery Library is located at the edge of the Prague Castle district. It comprises the Theological Hall and the Philosophical Hall, both famed for their breathtaking Baroque ceiling frescoes, intricately carved wooden bookshelves, and hundreds of thousands of ancient books. The Theological Hall\u0027s ceiling painting depicts humanity\u0027s quest for wisdom, while the Philosophical Hall showcases the evolution of human knowledge. Although visitors typically view the halls from the doorways, the breathtaking sight of these two rooms is enough to take your breath away. Its unique historical ambience and incredible architectural aesthetics make it an immensely popular photography location, perfect for capturing magnificent interiors and rich details.", "name": "Strahov Monastery Library", "transport": "Take Tram 22 to Poho\u0159elec station, then walk a short distance."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m., 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | Hrad\u010dansk\u00e9 Square is a grand public square directly in front of Prague Castle, serving as the main gateway to the castle grounds. The square is framed by several historic palaces, including the Schwarzenberg Palace and the Archbishop\u0027s Palace, whose ornate facades lend a majestic atmosphere to the area. At its center stands the Marian Plague Column, an iconic landmark. From the square, visitors can enjoy stunning views of the main entrance to Prague Castle, making it a prime spot for taking panoramic photos of the castle and surrounding architecture. It\u0027s also the best location to watch the Changing of the Guard ceremony, providing rich photo opportunities and an immersive experience to feel the historical heart of Prague.", "name": "Hrad\u010dansk\u00e9 Square (Hrad\u010dansk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad stop; or take Metro Line A to Malostransk\u00e1 station and walk up the hill."}], "name": "Popular Photo Spots"}}, "name": "\u57ce\u5821\u5340 (Hrad\u010dany)"}, "jewish_quarter": {"categories": {"cat_1": {"items": [{"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | One of the oldest and most significant historical monuments in the Prague Jewish Quarter, this cemetery dates back to the early 15th century and is one of the oldest surviving Jewish burial grounds in Europe. Due to limited space, tombstones are layered up to 12 deep, with an estimated 100,000+ people buried here, including prominent figures like Rabbi Loew and Mordecai Maisel. Strolling through, you can feel the weight of history and the cycle of life\u2014each tilted headstone tells an ancient story, serving as a silent witness to centuries of Jewish history in Prague. Its unique landscape and profound historical importance make it a must-visit destination.", "name": "Old Jewish Cemetery", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 5 minutes; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 station, then walk about 5 minutes."}, {"address": "\u010cerven\u00e1 2, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Built in the late 13th century, this is Europe\u0027s oldest active synagogue and one of Prague\u0027s earliest Gothic buildings. Its name, \u0027Old-New,\u0027 stems from its 16th-century name \u0027New Synagogue\u0027 to distinguish it from an even older one, though over time it became the \u0027Old\u0027 one again. Famous for its unique twin-nave design and the legendary story of the Golem, it remains an active place of worship for Prague\u0027s Jewish community. Having withstood centuries of storms and wars, its robust structure stands tall as a symbol of the Jewish people\u0027s resilience.", "name": "Old-New Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 5 minutes; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 station, then walk about 5 minutes."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | Built in 1535, this synagogue now serves as a deeply moving memorial. Its walls are inscribed with the names of nearly 80,000 Bohemian and Moravian Jewish victims of the Holocaust during WWII, each name honoring a lost life with solemn reverence. Inside, an exhibition features children\u0027s drawings from the Terez\u00edn concentration camp\u2014artworks filled with innocent yearning for life yet tinged with profound sorrow. More than just a building, the Pinkas Synagogue stands as a witness to history, reminding the world never to forget these tragic moments.", "name": "Pinkas Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 5 minutes; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 station, then walk about 5 minutes."}, {"address": "V\u011bze\u0148sk\u00e1 1, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Acclaimed as one of Europe\u0027s most beautiful synagogues, its lavish interior features a Moorish Revival style inspired by Spain\u0027s Alhambra Palace. Built in 1868 on the site of the former \u0027Old School\u0027 synagogue, its dazzling gilded carvings, intricate geometric patterns, and stained glass windows showcase exquisite craftsmanship in every detail. Beyond being a place of worship, it serves as an exhibition space for the Jewish Museum in Prague, detailing Jewish history from the 19th century to the present. Its unique architectural flair and artistic value make it a sparkling gem of the Jewish Quarter.", "name": "Spanish Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 7 minutes; or take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station, then walk about 3 minutes."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | As the largest synagogue in the Prague Jewish Quarter, it was built in 1694 to replace three smaller buildings (\u0027Klausen\u0027) destroyed in the 1689 fire. Its Baroque interior is ornate and grand, featuring exquisite frescoes painted on the ceiling. Today, the Klausen Synagogue is part of the Jewish Museum in Prague, primarily focusing on Jewish customs and holidays as well as major life-cycle ceremonies like circumcisions, weddings, and funerals. Offering a deep insight into Jewish culture and traditions, it is an essential cultural landmark in the district.", "name": "Klausen Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 5 minutes; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 station, then walk about 5 minutes."}, {"address": "Maiselova 10, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.2 stars | Funded by Mordecai Maisel, mayor of the Jewish Quarter in the late 16th century, this synagogue was originally built in Renaissance style, rebuilt in Baroque after the 1689 fire, and later renovated with Neo-Gothic features in the early 20th century. Today, it forms another crucial part of the Jewish Museum in Prague, exhibiting Jewish history in Prague from the 10th to the 18th century through precious artifacts, manuscripts, and historical documents. Its multimedia displays vividly present the story of the Jewish community\u0027s rise and fall in Prague.", "name": "Maisel Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 7 minutes; or take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station, then walk about 3 minutes."}, {"address": "Maiselova 18, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Built in the 16th century, this town hall served as the administrative center of Prague\u0027s Jewish Quarter, also funded by Mordecai Maisel. Its most famous feature is the pair of clock towers on the roof\u2014one of which has a dial with Hebrew numerals and hands that turn counterclockwise, reflecting the unique nature of the Hebrew calendar. Blending Renaissance and Baroque architectural elements, it symbolizes the autonomy of the Jewish community. Though the interior is not open to visitors, its distinctive exterior and rich history make it an unmissable landmark in the Jewish Quarter.", "name": "Jewish Town Hall", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk about 7 minutes; or take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station, then walk about 3 minutes."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.1 stars | Built between 1911 and 1912, this Neo-Romanesque building originally served as the headquarters and mortuary for the Jewish Burial Society (Chevra Kadisha). Beautifully decorated inside, it is now part of the Jewish Museum in Prague, focusing on Jewish burial customs, history, and traditions. Through artifacts, photographs, and texts, l Synagogue", "transport": "Metro Line A Starom\u011bstsk\u00e1 Station, approx. 5-min walk; Tram lines 17, 18 Starom\u011bstsk\u00e1 Station, approx. 5-min walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | The largest synagogue in Prague\u0027s Jewish Quarter, built in the late 17th century as a fine example of Baroque architecture. The interior features ornate decorations and beautiful ceiling frescoes depicting Jewish holidays and rituals. Now part of the Jewish Museum in Prague, it hosts a permanent exhibition on Jewish holidays, customs, and traditions\u2014including lifecycle rituals such as circumcision, weddings, and the Sabbath, alongside introductions to Jewish tenets. Rich displays and detailed explanations provide a comprehensive look at Jewish daily life and belief systems.", "name": "Klausen Synagogue", "transport": "Metro Line A Starom\u011bstsk\u00e1 Station, approx. 6-min walk; Tram lines 17, 18 Starom\u011bstsk\u00e1 Station, approx. 6-min walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Constructed in the early 20th century, this Neo-Romanesque building originally served as the headquarters and mortuary hall of the Prague Burial Society. Today, as part of the Jewish Museum in Prague, it hosts exhibitions on Jewish burial customs, history, and the Prague Jewish community. The exhibits detail Jewish perspectives on death, funeral rites, and the historical contributions of the Burial Society. Its distinctive architectural style and solemn atmosphere offer visitors a window into end-of-life Jewish rituals and the spirit of mutual community support.", "name": "Jewish Ceremonial Hall", "transport": "Metro Line A Starom\u011bstsk\u00e1 Station, approx. 6-min walk; Tram lines 17, 18 Starom\u011bstsk\u00e1 Station, approx. 6-min walk."}, {"address": "U Star\u00e9 \u0161koly 3, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Part of the Jewish Museum in Prague, this gallery is named after the Czech-Jewish painter Robert Guttmann and specializes in temporary exhibitions on Jewish history, culture, and art. Located near the Spanish Synagogue, its diverse exhibits range from ancient artifacts to contemporary artwork, along with photography and documents related to Jewish life. It offers visitors a dynamic platform to deeply explore various facets of Jewish culture and its unique artistic expressions.", "name": "Robert Guttmann Gallery", "transport": "Metro Line A Starom\u011bstsk\u00e1 Station, approx. 7-min walk; Tram lines 17, 18 Pr\u00e1vnick\u00e1 fakulta Station, approx. 3-min walk."}, {"address": "\u010cerven\u00e1 98/2, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | Built in the 16th century, this synagogue gets its name \u0027High\u0027 from being located on the second floor of the Jewish Town Hall. It was originally built as a private place of worship for town councilors and wealthy merchants. The interior features a simple yet elegant design with beautiful vaulted ceilings and painted decorations. Historically used as an exhibition space for the Jewish Museum to display valuable Jewish textiles and silverware, its compact scale, unique background, and exquisite decor make it a hidden gem in the Jewish Quarter worth exploring.", "name": "High Synagogue", "transport": "Metro Line A Starom\u011bstsk\u00e1 Station, approx. 6-min walk; Tram lines 17, 18 Starom\u011bstsk\u00e1 Station, approx. 6-min walk."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "\u0160irok\u00e1 3, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | One of the most unique and unforgettable attractions in Prague\u0027s Jewish Quarter, this ancient cemetery is famous for its layered headstones and lush vegetation. Due to space constraints over centuries, gravesto alk; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 Station, about a 5-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Franze Kafky, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | Tucked into the heart of the Jewish Quarter, this charming and quiet square honors Prague\u0027s most famous writer, Franz Kafka. Dotted with a few trees and benches, it offers visitors a cozy spot to take a short break and reflect. While not a large park, its pleasant greenery and open feel are particularly precious in the densely built Jewish Quarter, providing a quiet corner to catch fresh air and feel the city\u0027s heartbeat between exploring historic buildings.", "name": "Franz Kafka Square (N\u00e1m\u011bst\u00ed Franze Kafky)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 7-minute walk; or take Tram 17 or 18 to Starom\u011bstsk\u00e1 Station, about a 7-minute walk."}, {"address": "\u010cech\u016fv most, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia (Jewish Quarter side)", "feature": "\u2b50 4.2 stars | \u010cech Bridge is a striking bridge across the Vltava River, and the riverside area on its Jewish Quarter side offers unobstructed water views. The open spaces and shoreline trees provide a great perspective to watch passing boats, admire the river, and gaze at the lush greenery of Letn\u00e1 Park across the water. The bridge\u0027s Art Nouveau decorations blend beautifully with the natural surroundings, making it an ideal spot for a walk, taking photos, or simply enjoying the unique charm of Prague\u0027s riverbanks.", "name": "Riverside Viewpoint at \u010cech Bridge", "transport": "Take Tram 17 to Pr\u00e1vnick\u00e1 fakulta Station, about a 2-minute walk; or take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 10-minute walk."}, {"address": "Lannova, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Situated on the edge of the Jewish Quarter near the Vltava River, Lannova Par per notes left by visitors. Mysterious and reverent, it offers photographers a uniquely poetic atmosphere.", "name": "Old Jewish Cemetery (Star\u00fd \u017eidovsk\u00fd h\u0159bitov)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 7 minutes."}, {"address": "Maiselova 18, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 Stars | As Europe\u0027s oldest active synagogue, the Old-New Synagogue carries over 700 years of history with its austere Gothic architecture. Beyond being the spiritual heart of the Jewish Quarter, it is famously known as the resting place of the legendary Golem, adding a layer of mystery. The dim lighting and original medieval stone walls evoke a sense of stepping back in time\u2014a compelling spot for history buffs and seekers of deep cultural immersion.", "name": "Old-New Synagogue (Staronov\u00e1 synagoga)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 Stars | Serving today as a deeply moving memorial, the walls of the Pinkas Synagogue are inscribed with the names of nearly 80,000 Bohemian and Moravian Jewish victims of the Holocaust. The synagogue also houses an exhibition of drawings created by children in the Terez\u00edn concentration camp\u2014heartrending pieces full of innocent despair. It stands not only as a historical site, but as a profound reminder to cherish peace, making it a powerful and thought-provoking stop.", "name": "Pinkas Synagogue (Pinkasova synagoga)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 7 minutes."}, {"address": "Du\u0161n\u00ed, 110 00 Star\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.5 Stars | Created by artist Jaroslav R\u00f3na, this striking sculpture honors Prague\u0027s most celebrated literary icon, Franz Kafka. Depicting a small Kafka riding on the shoulders of a headless empty suit, its surrealist design perfectly captures the themes of existentialism and absurdity found in his work. Located on the border of the Jewish Quarter and Old Town, its captivating design makes it an iconic photo landmark.", "name": "Franz Kafka Monument (Pomn\u00edk Franze Kafky)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 3 minutes."}, {"address": "Maiselova 18, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.3 Stars | The administrative center of the Jewish Quarter, this landmark is famous for its two tower clocks: one with traditional Roman numerals and another with unique Hebrew numerals whose hands turn counter-clockwise, reflecting the direction Hebrew is written. This Renaissance building topped with a Baroque tower stands as a story-filled symbol of local Jewish heritage, drawing crowds who pause to marvel at its fascinating facade.", "name": "Jewish Town Hall (\u017didovsk\u00e1 radnice)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "Maiselova 10, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.2 Stars | Originally constructed in the late 16th century by Mordecai Maisel, mayor of the Jewish Town, this was once the grandest building in the quarter. Rebuilt in Neo-Gothic style following fires, it now houses permanent historical exhibitions from the Jewish Museum. Blending architectural aesthetics with cultural education, it is an essential stop for travelers wishing to gain a deeper understanding of Prague\u0027s Jewish history.", "name": "Maisel Synagogue (Maiselova synagoga)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.1 Stars | The largest synagogue in Prague\u0027s Jewish Quarter sits right by the entrance to the Old Jewish Cemetery. It is renowned for its Baroque interior decoration, complete with painted vaulting depicting scenes of Jewish traditions and holidays. Inside, exhibitions covering life-cycle events\u2014such as birth, weddings, and funerals\u2014offer visitors an insightful glimpse into Jewish heritage and customs.", "name": "Klausen Synagogue (Klausov\u00e1 synagoga)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 7 minutes."}], "name": "Popular Photo Hotspots"}}, "name": "\u7336\u592a\u5340 (Josefov)"}, "lesser_town": {"categories": {"cat_1": {"items": [{"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Spanning the Vltava River and connecting Prague\u0027s Old Town with the Lesser Town (Mal\u00e1 Strana), this is one of the most beautiful bridges in Europe. Commissioned by Charles IV in 1357, this Gothic stone bridge features 30 exquisite Baroque sculptures lining its sides, each steeped in rich history and legend. The views are particularly enchanting at dawn or dusk, making it a photographer\u0027s paradise and a magnificent spot to experience Prague\u0027s romantic charm. Twin towers stand guard at both ends of the bridge, with the Lesser Town Bridge Tower serving as a grand gateway to the Lesser Town, bearing witness to centuries of historic transformation.", "name": "Charles Bridge", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk about 5 minutes; or take Tram 17 or 18 to Karlovy l\u00e1zn\u011b station and walk."}, {"address": "Malostransk\u00e9 n\u00e1m., 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Situated at the heart of Lesser Town Square, this is one of Prague\u0027s most outstanding examples of Baroque architecture. Designed and built by famous architects Christoph Dientzenhofer, his son Kilian Ignaz Dientzenhofer, and Anselmo Lurago, its green dome and belfry define the Mal\u00e1 Strana skyline. The interior is lavishly decorated with breathtaking frescoes, sculptures, and altars, boasting a grand pipe organ once played by Mozart. Known for its exceptional acoustics, the church frequently hosts classical concerts, offering visitors a feast for both the eyes and ears.", "name": "St. Nicholas Church", "transport": "Take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station; the church is right on the square."}, {"address": "Malostransk\u00e9 n\u00e1m., 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The heart of Mal\u00e1 Strana, this vibrant historical square is surrounded by ornate Baroque palaces, churches, and historic buildings. At its center stands the Holy Trinity Column, erected to commemorate the end of the 18th-century plague. It is not only a fantastic spot to relax and watch street performers, but also a central hub leading to major attractions like the Charles Bridge, St. Nicholas Church, and Prague Castle. Trams crisscrossing the square add a lively modern contrast to the ancient surroundings, making it a perfect starting point to explore Mal\u00e1 Strana.", "name": "Lesser Town Square (Mal\u00e1 Strana Square)", "transport": "Take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, and the square will be right in front of you."}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m. 4, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Home to the Senate of the Czech Republic, this is one of Prague\u0027s grandest Baroque palace complexes. Built in the early 17th century by Albrecht von Wallenstein, a famous general of the Thirty Years\u0027 War, it was designed to rival the magnificence of Prague Castle. Its expansive Baroque gardens are among Europe\u0027s finest, featuring exquisite fountains, sculptures, an artificial grotto, and a dramatic dripstone wall. In summer, open-air concerts and theatrical performances are held here, offering a serene escape steeped in history.", "name": "Wallenstein Palace and Gardens", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 2 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e1 station."}, {"address": "Nerudova, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.4 stars | A winding, uphill cobblestone street connecting Lesser Town Square to Prague Castle, Nerudova Street is one of the most historic thoroughfares in Prague. Named after the famous Czech writer Jan Neruda who once lived here, the street is lined with well-preserved Baroque and Renaissance buildings. Many doorways feature unique historic house signs\u2014such as the \u0027House of the Three Fiddles\u0027 or \u0027At the Golden Lion\u0027\u2014which were used to identify houses before house numbers existed. Strolling along this street feels like stepping back in time to experience Prague\u0027s aristocratic past and vibrant local history.", "name": "Nerudova Street", "transport": "Take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk uphill from the northwest corner of the square."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m\u011bst\u00ed, 100 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Located on Kampa Island in the Lesser Town, this site originated in the 1980s as a graffiti wall where Czech youth expressed their grievances against the communist regime, inspired by John Lennon\u0027s portrait and Beatles lyrics. Although Lennon never visited Prague, his message of peace and freedom became a powerful symbol of resistance. Continuously covered with fresh layers of colorful graffiti, it remains an iconic landmark of love, peace, and freedom. More than just an art wall, it stands as a moving historical witness, drawing visitors from around the globe to take photos and soak in its unique cultural vibe.", "name": "Lennon Wall", "transport": "Take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 5-7 minutes; located near the Kampa Museum."}, {"address": "Mosteck\u00e1 1, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Standing guard at the Mal\u00e1 Strana entrance of the Charles Bridge, these two magnificent towers mark the gateway to the Lesser Town. The higher Gothic tower, built in the 15th century and modeled after the Old Town Bridge Tower, features a viewing platform offering sweeping views of the Charles Bridge, the Vltava River, Prague Castle, and the surrounding rooftops. The lower tower is older, showcasing Romanesque origins. Together, these towers served as crucial defense fortifications and stand as majestic monuments to Prague\u0027s rich historical legacy.", "name": "Lesser Town Bridge Tower", "transport": "Located at the Lesser Town end of Charles Bridge; accessible on foot across the bridge, or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 3 minutes."}, {"address": "Karmelitsk\u00e1 9, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | This Baroque church in Mal\u00e1 Strana is world-famous for housing the statue of the Infant Jesus of Prague. Believed to possess miraculous powers, this small wax-coated wooden statue draws pilgrims and tourists from across the globe. The church\u0027s opulent interior features stunning altars and exquisite frescoes filled with sacred artistry. An onsite museum showcases a collection of hundreds of intricate vestments donated by faithful believers worldwide, each representing different cultures and honoring a unique religious heritage.", "name": "Church of Our Lady Victorious and the Infant Jesus of Prague", "transport": "Take Tram 12, 15, 20, 22, or 23 to Hellichova station and walk about 1 minute."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | A Baroque architectural jewel in Prague\u0027s Lesser Town, designed by the famous Dientzenhofer family. Its striking green dome is an iconic fixture of the Prague skyline. The lavish interior boasts breathtaking frescoes, sculptures, and murals\u2014most notably the massive dome ceiling fresco portraying the life of St. Nicholas and the main altarpiece painted by Karel \u0160kr\u00e9ta, representing the peak of 18th-century Central European Baroque art. Mozart once played the magnificent pipe organ here, which is still in use today for regular classical concerts, offering visitors a feast for both eyes and ears. More than just a place of worship, it stands as a sanctuary of art and history that has witnessed centuries of Prague\u0027s transformation.", "name": "St. Nicholas Church (Mal\u00e1 Strana)", "transport": "Take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station"}, {"address": "Karmelitsk\u00e1 9, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Located in the Lesser Town, this church is world-famous for housing the statue of the Infant Jesus of Prague, drawing pilgrims from all across the globe. An early Baroque building, its simple exterior contrasts with a richly decorated interior. The miraculous statue features an extensive wardrobe of hundreds of beautiful vestments donated by devotees worldwide, each representing different cultures and prayers. These vestments are changed regularly to dress the Infant Jesus in varying styles. The church also houses a small museum showcasing the history, garments, and religious artifacts of the statue. It is not only an important sacred site, but also a warm and inspiring cultural landmark radiating peace and faith.", "name": "Church of Our Lady Victorious and the Infant Jesus of Prague", "transport": "Take Tram 12, 15, 20, 22, or 23 to Hellichova station"}, {"address": "Letensk\u00e1 10, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.4 stars | Another historic Baroque church in the Lesser Town, originally founded by an Augustinian monastery in the 13th century and rebuilt in the 18th century by the famed Baroque architect Kilian Ignaz Dientzenhofer. The interior features ornate frescoes, sculptures, and altarpieces, most notably two replica altarpieces by Peter Paul Rubens (the originals are kept in the National Gallery in Prague). The church\u0027s historic organ boasts a beautiful tone and is frequently played during concerts. Offering a serene atmosphere away from the crowds, it is a wonderful place to soak in history and art while appreciating delicate details and rich artistic collections.", "name": "Church of St. Thomas", "transport": "Take Metro Line A to Malostransk\u00e1 station, or Tram 2, 12, 15, 18, 20, 22, or 23 to Malostransk\u00e1 station"}, {"address": "U Sovov\u00fdch ml\u00fdn\u016f 2, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Set on Kampa Island along the Vltava River\u2014often dubbed the \"Venice of Prague\"\u2014this museum focuses on Central European modern art. It holds an extensive collection of works by Czech abstract artist Franti\u0161ek Kupka, alongside 20th-century Czech and Slovak sculptures and paintings. Converted from a historic mill, the building harmoniously blends into its natural surroundings. The outdoor lawn is adorned with modern sculptures, most famously David \u010cern\u00fd\u0027s playful and intriguing \"Crawling Babies.\" It\u0027s a paradise for modern art enthusiasts and a scenic spot to enjoy river views and Prague\u0027s unique creative atmosphere.", "name": "Museum Kampa", "transport": "Take Tram 12, 15, 20, 22, or 23 to Hellichova station, then walk about 5 minutes"}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 4, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | One of the most magnificent Baroque palaces in Prague\u0027s Lesser Town, built in the early 17th century by Duke Albrecht von Wallenstein and now home to the Czech Senate. The palace is renowned for its grand architecture, elaborate frescoes, and fine sculptures, particularly the main hall\u0027s ceiling fresco depicting Wallenstein as Mars, the god of war. Select areas of the interior are open to the public, showcasing its opulent historical ambience. The adjacent Wallenstein Garden is a major highlight, featuring fountains, classic sculptures, an artificial grotto, and a large open-air sala terrena host to summer cultural events. An essential visit for understanding aristocratic life and architectural art of the Baroque era.", "name": "Wallenstein Palace", "transport": "Take Metro Line A to Malostransk\u00e1 station, or Tram 2, 12, 15, 18, 20, 22, or 23 to Malostransk\u00e1 station"}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed 7, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | An important Baroque pilgrimage destination situated near the edge of the Castle District above the Lesser Town, famous for its magnificent complex and rich collection of religious treasures. At its heart is an exact replica of the Santa Casa (the Holy House of the Virgin Mary). The complex comprises the Holy House, the Church of the Nativity of Our Lord, a clock tower, and cloisters adorned with lavish frescoes and altars. The Treasury is the ultimate highlight, housing priceless religious artifacts including the world-famous \"Prague Sun\" monstrance adorned with 6,222 diamonds. The hourly chime of the carillon bells adds a magical touch to this holy sanctuary.", "name": "Loreta Prague", "transport": "Take Tram 22 or 23 to Poho\u0159elec station, then walk about 5 minutes"}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1/132, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Widely considered one of the most beautiful libraries in the world, located inside the Strahov Monastery above the Lesser Town. It consists of two grand Baroque halls: the Theological Hall and the Philosophical Hall. The Theological Hall is famous for its elaborate ceiling frescoes and tens of thousands of antique volumes, radiating a scholarly charm. The grander Philosophical Hall boasts soaring walnut bookshelves and a monumental ceiling painting by Franz Anton Maulbertsch illustrating the intellectual development of mankind. Housing over 200,000 rare books, manuscripts, and historical globes, it is an invaluable treasure trove of knowledge and art.", "name": "Strahov Monastery Library", "transport": "Take Tram 22 or 23 to Poho\u0159elec station, then walk about 5 minutes"}, {"address": "III. n\u00e1dvo\u0159\u00ed 48/2, 119 01 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | The grandest and most essential architectural masterpiece inside Prague Castle, serving as the national symbol and spiritual heart of the Czech Republic. Soaring above the castle walls, its impressive silhouette overlooks the Lesser Town and dominates the city skyline. Built over nearly a millennium, this majestic Gothic cathedral integrates multiple architectural influences, featuring soaring spires, stunning stained glass windows (including a masterpiece by Alphonse Mucha), the magnificent St. Wenceslas Chapel, and royal crypts. It is the historic coronation venue for Czech kings and the final resting place of saints, sovereigns, and nobles\u2014an absolute must-see highlight of any trip to Prague.", "name": "St. Vitus Cathedral", "transport": "Take Tram 22 or 23 to Pra\u017esk\u00fd hrad station, or take Metro Line A to Malostransk\u00e1 station and walk uphill"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Letensk\u00e1 123/10, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | One of the most magnificent Baroque gardens in Prague\u0027s Lesser Town (Mal\u00e1 Strana), Wallenstein Garden was built in the 17th century as part of the Wallenstein Palace complex. It is famous for its intricate sculptures, fountains, an artificial grotto, and a grand salla terrena (pavilion). Peacocks roam freely around the grounds, which also feature a large pond with a statue of Hercules at its center. Blending lush greenery with artistic elegance, it offers a peaceful escape from the hustle and bustle of the city. Visitors can admire stunning architectural details and manicured landscapes, especially during spring and summer when the gardens bloom in full color. Its geometric design reflects aristocratic luxury and taste, seamlessly combining history with nature.", "name": "Wallenstein Garden", "transport": "Take Metro Line A to Malostransk\u00e1 Station and walk about 2 minutes from the exit."}, {"address": "Karmelitsk\u00e1 373/25, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Renowned as one of Prague\u0027s most beautiful Baroque terraced gardens, Vrtba Garden is part of a UNESCO World Heritage site. This hidden gem in the heart of Mal\u00e1 Strana offers breathtaking panoramic views of Prague Castle and St. Nicholas Church. Designed by Italian architects, it features ornate sculptures, grand frescoes, and meticulously trimmed greenery. As visitors ascend the winding staircases, each tier reveals a unique perspective, leading up to an observation platform with views well worth the climb. Though compact, the garden is exquisitely detailed and exudes a romantic, tranquil atmosphere, making it a favorite spot for couples and photography enthusiasts alike.", "name": "Vrtba Garden", "transport": "Take Tram 12, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 5 minutes."}, {"address": "Pet\u0159\u00ednsk\u00e9 sady, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Pet\u0159\u00edn Hill is a vast green oasis in central Prague, offering visitors a peaceful sanctuary and sweeping panoramic views of the city. Covered in beautiful gardens, orchards, and walking trails, it is a popular spot for locals and tourists to enjoy leisurely strolls, picnics, and sunset views. At its peak stands the iconic Pet\u0159\u00edn Lookout Tower, often called Prague\u0027s mini Eiffel Tower, where you can take in incredible city vistas. Other highlights on the hill include a Mirror Maze, a lush Rose Garden, St. Lawrence Church, and the Strahov Monastery. Riding the Pet\u0159\u00edn funicular is a scenic and convenient way to reach the top. Whether you are seeking nature, historical landmarks, or grand views, Pet\u0159\u00edn Hill is an essential stop on any trip to Prague.", "name": "Pet\u0159\u00edn Hill", "transport": "Take the Pet\u0159\u00edn funicular up from \u00dajezd station, or take Tram 12, 20, or 22 to \u00dajezd station and walk up the hill."}, {"address": "Na Kamp\u011b, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Often dubbed the \u0027Venice of Prague,\u0027 Kampa Island is a charming island on the Vltava River, nestled right beneath the Charles Bridge. This picturesque area is famous for its serene park, historic watermills, and romantic pathways along the Devil\u0027s Stream (\u010certovka). Shaded by lush trees and featuring broad green lawns, it is an ideal spot to relax, enjoy a picnic, or take a gentle stroll. Nearby attractions include the Franz Kafka Museum and David \u010cern\u00fd\u0027s famous Giant Babies sculptures. Combining natural beauty with rich art and culture, Kampa Island provides fantastic perspectives of Charles Bridge and the surrounding architecture. Its unique charm shines day and night, making it a quiet haven in the Lesser Town.", "name": "Kampa Island", "transport": "Walk down the steps directly from Charles Bridge, or take Tram 12, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 10 minutes."}, {"address": "Vald\u0161tejnsk\u00e1 14, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Ledebour Garden is the grandest and most popular of the Baroque palace gardens situated below Prague Castle. This exquisite terraced garden is renowned for its symmetrical design, ornate fountains, sculptures, and stunning terraces that overlook the Vltava River and Mal\u00e1 Strana. The design reflects Italian Renaissance and Baroque influences, with manicured hedges and vibrant flowers creating an elegant and peaceful atmosphere. Visitors can wander along winding pathways to discover hidden corners and scenic viewpoints. Ledebour Garden is not only a masterpiece of landscape design but also a prime spot to admire Prague\u0027s skyline, especially on a bright sunny day.", "name": "Ledebour Garden", "transport": "Take Metro Line A to Malostransk\u00e1 Station and walk about 5 minutes from the exit."}, {"address": "U Lu\u017eick\u00e9ho semin\u00e1\u0159e 17, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Vojanovy Sady is one of Prague\u0027s oldest gardens and a quiet green sanctuary in the heart of Mal\u00e1 Strana. Originally a monastery orchard, this historic location is now a charming public park known for its mature trees, tranquil pond, free-roaming peacocks, and a unique grotto dedicated to the Virgin Mary. Secluded benches throughout the park offer perfect spots to escape city noise and enjoy a moment of quiet reflection. In spring, the blooming magnolia trees render the scenery truly magical. Its timeless atmosphere and rich heritage make it a unique destination for experiencing a softer, quieter side of Prague.", "name": "Vojanovy Sady", "transport": "Take Metro Line A to Malostransk\u00e1 Station and walk about 3 minutes from the exit."}, {"address": "Vald\u0161tejnsk\u00e1 14, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Sitting adjacent to Ledebour Garden, the Small F\u00fcrstenberg Garden is another shining gem among the palace gardens below Prague Castle. This delicate Baroque terraced garden features distinctive terrace layouts, ornate pavilions, and breathtaking vistas of the city. Each level is carefully planted with flowers and greenery, adorned with classical sculptures and fountains. As you climb the winding steps, you are rewarded with varying perspectives of Mal\u00e1 Strana, Charles Bridge, and the Vltava River. Intimate and refined, its elegant atmosphere makes it an ideal spot for photography lovers and travelers seeking a quiet retreat.", "name": "Small F\u00fcrstenberg Garden", "transport": "Take Metro Line A to Malostransk\u00e1 Station and walk about 5 minutes from the exit."}, {"address": "Pet\u0159\u00ednsk\u00e9 sady 411/1, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Neboz\u00edzek Garden forms part of Pet\u0159\u00edn Hill and is celebrated for its glorious panoramic vistas over Prague. Besides being a lovely park, it houses a famous restaurant of the same name, allowing visitors to enjoy fine dining while gazing out over Prague Castle, Charles Bridge, and the Old Town. Winding paths lined with fruit trees and seasonal flowers make it a delightful place for a relaxed walk. The atmosphere is enchanting at any time of day, but especially at sunset when the city turns a radiant golden hue. It is an unforgettable viewpoint that perfectly captures Prague\u0027s romance and charm.", "name": "Neboz\u00edzek Garden", "transport": "Take the Pet\u0159\u00edn funicular to Neboz\u00edzek station, or walk up from \u00dajezd station in about 15\u201320 minutes."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Karl\u016fv most, 110 00 Praha 1-Star\u00e9 M\u011bsto (Mal\u00e1 Strana entrance)", "feature": "\u2b50 4.8 stars | One of Prague\u0027s most iconic landmarks, connecting Old Town with Lesser Town (Mal\u00e1 Strana). The bridge is lined with 30 exquisite Baroque statues, each filled with rich history and stories. The breathtaking views of Prague Castle and the Vltava River from the bridge are mesmerizing at any hour\u2014whether shrouded in morning mist, bustling during the day, or glittering with night lights. The Lesser Town Bridge Tower offers an exceptional vantage point; climbing to the top rewards you with a panoramic view of the bridge, castle district, and red-tiled roofs of Mal\u00e1 Strana, making it a must-visit destination for photographers and travelers alike.", "name": "Charles Bridge", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 5 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 3 minutes."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.3 stars | Bursting with vibrant colors and messages of peace, this wall was originally created to honor John Lennon and has since evolved into a powerful symbol of freedom and resistance. Covered in graffiti, song lyrics, and peace slogans, new artwork continuously overlays older creations, keeping it in a constant state of transformation. Visitors can leave their own mark here and feel the creative, energetic spirit of Prague\u0027s younger generations. It serves not only as a fantastic backdrop for photos, but also as a cultural landmark carrying history and hope.", "name": "Lennon Wall", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 10 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 5 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.7 stars | Located in Lesser Town, St. Nicholas Church is one of Prague\u0027s most grand Baroque masterpieces, with its iconic green dome and soaring belfry shaping the district\u0027s skyline. The lavish interior is truly breathtaking, adorned with opulent frescoes, delicate sculptures, and a magnificent gilded altar. Mozart once played the pipe organ here, and its acoustics are still celebrated as world-class. Whether admiring its monumental exterior or stepping inside to absorb its sacred, awe-inspiring atmosphere, it offers an unforgettable experience for architecture enthusiasts and history buffs.", "name": "St. Nicholas Church", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 5 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station\u2014the church sits right in the center of the square."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Lesser Town Square is the vibrant heart of Mal\u00e1 Strana, divided into two sections by St. Nicholas Church. Flanked by historic grand palaces, embassies, and charming cafes, the square radiates an authentic old-world ambiance. It is an ideal spot to marvel at Baroque architecture and feel the rhythm of daily local life. The historic Plague Column at its center and the passing classic trams together create a postcard-perfect scene of Prague, making it a great place to relax, snap photos, and people-watch.", "name": "Lesser Town Square (Malostransk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 5 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station\u2014the square is right in front of you."}, {"address": "Pet\u0159\u00ednsk\u00e9 sady 633, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Perched atop Pet\u0159\u00edn Hill, this tower is affectionately called \u0027Prague\u0027s Eiffel Tower\u0027 and is one of the best locations for panoramic views of the city. Climb the 299 steps or ride the elevator to the top observation deck for an unobstructed view of Prague Castle, Charles Bridge, Old Town, Lesser Town, and distant rolling hills. The surrounding Pet\u0159\u00edn Park is a delightful spot for strolls and picnics, featuring romantic cherry blossoms in spring and vibrant golden foliage in autumn, making it a favorite for couples and families.", "name": "Pet\u0159\u00edn Lookout Tower", "transport": "Take the Pet\u0159\u00edn Funicular from \u00dajezd station directly to the top; or take Tram 12, 15, 20, 22, or 23 to \u00dajezd station and walk to the funicular station."}, {"address": "Letensk\u00e1 123/4, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.7 stars | Part of the magnificent Wallenstein Palace, this grand Baroque garden is widely regarded as one of the most stunning gardens in Prague. It features immaculately manicured hedges, ornate fountains, classical statues, an artificial grotto, and a large pond filled with koi fish and ducks. Its most intriguing feature is the mysterious dripstone wall, designed to mimic a cavernous stalactite formation. Hosting outdoor concerts and cultural events during summer, it\u0027s a perfect sanctuary to escape city noise and immerse yourself in peace and art.", "name": "Wallenstein Garden", "transport": "Take Metro Line A to Malostransk\u00e1 station\u2014the garden entrance is right beside the exit; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e1 station."}, {"address": "Na Kamp\u011b, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.4 stars | Enclosed by the Vltava River and the tranquil Devil\u0027s Stream (\u010certovka), Kampa Island is often praised as the \u0027Venice of Prague\u0027. Lined with lush trees, picturesque houses, historic water mills, and cozy outdoor cafes, it exudes quiet charm. Museum Kampa on the island houses impressive Central European modern art collections, while a walk along the riverfront presents spectacular views of Charles Bridge and Old Town. Featuring famous art installations like the giant infant sculptures and a love-lock bridge, it is a favorite romantic hotspot.", "name": "Kampa Island", "transport": "Step down from the Mal\u00e1 Strana side of Charles Bridge and walk about 2 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk 5 to 7 minutes."}, {"address": "Nerudova ulice, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | This winding, ascending cobblestone street is one of the historic main routes leading up to Prague Castle, famous for its remarkably preserved Baroque townhouses. Before house numbering existed, buildings were distinguished by ornate heraldic signs above their doors, such as \u0027At the Three Little Violins\u0027 or \u0027At the Golden Lion\u0027, brimming with historical romanticism. Lined with boutiques, art galleries, and traditional Czech taverns, it is a fabulous place to soak up old Prague\u0027s timeless charm and capture dramatic photos of Prague Castle from various elevations.", "name": "Nerudova Street", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk about 7 minutes; or take Tram 12, 15, 20, 22, or 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk about 3 minutes to the foot of the street."}], "name": "Popular Photo Spots"}}, "name": "\u5c0f\u57ce\u5340 (Mal\u00e1 Strana)"}, "new_town": {"categories": {"cat_1": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Wenceslas Square is the vibrant heart of Prague\u0027s New Town, serving as a lively commercial and cultural hub, as well as the setting for many pivotal events in Czech history. Originally laid out by Charles IV as a horse market, this long boulevard-style square is today lined with grand architecture, including Art Nouveau hotels, department stores, and office buildings. At the top of the square sits the majestic National Museum, fronted by the equestrian statue of St. Wenceslas, the patron saint of the Czech nation. More than just a hotspot for shopping and entertainment, the square is a gathering place for public rallies, demonstrations, and celebrations, having witnessed the rise and struggles of the Czech nation from the Czechoslovak Declaration of Independence to the Velvet Revolution. Strolling through, you can feel the pulse of Prague, admire various architectural styles across eras, and immerse yourself in its rich historical atmosphere.", "name": "Wenceslas Square", "transport": "Metro Line A/B M\u016fstek Station; Metro Line A/C Muzeum Station"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 68, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | As one of the largest and oldest museums in the Czech Republic, the National Museum sits prominently at the top of Wenceslas Square, housed in a magnificent Neo-Renaissance building that is a masterpiece in itself. Designed by Josef Schulz and opened in 1891, its ornate facade, massive dome, and exquisite interior decorations are truly breathtaking. The museum houses millions of exhibits spanning natural history, history, art, and music\u2014ranging from paleontology and ethnography to medieval artifacts and modern art. Its natural history and Czech history exhibitions offer visitors deep insights into the country\u0027s rich cultural heritage and natural landscape. Ascending to the museum\u0027s viewing deck rewards visitors with sweeping panoramic views of Wenceslas Square and downtown Prague, making it an unmissable landmark for history buffs and architecture enthusiasts.", "name": "National Museum", "transport": "Metro Line A/C Muzeum Station"}, {"address": "N\u00e1rodn\u00ed 2, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | Standing proudly on the banks of the Vltava River, the National Theatre is a stunning Neo-Renaissance structure and a symbol of the Czech National Revival. Funded largely by donations from the Czech public, its construction reflected the nation\u0027s passion for cultural independence. First opened in 1881, it tragically suffered a fire two years later but was swiftly rebuilt with renewed nationwide support and reopened in 1883. Its golden roof, exquisite sculptures, frescoes, and lavish interior decorations underscore its high status as a national cultural temple. Hosting opera, ballet, and drama performances, it is the premier venue to experience top-tier Czech arts. Even without seeing a show, admiring its architectural beauty offers a deep appreciation for its profound historical significance and artistic value.", "name": "National Theatre", "transport": "Tram 2, 9, 17, 18, 22, 23, 93 to N\u00e1rodn\u00ed divadlo Stop"}, {"address": "Jir\u00e1skovo n\u00e1m\u011bst\u00ed 6, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.5 stars | Also known as \u0027Fred and Ginger,\u0027 the Dancing House is a controversial yet highly acclaimed modern architectural landmark located along the Vltava River in Prague\u0027s New Town. Designed by Croatian-Czech architect Vlado Miluni\u0107 and Canadian-American architect Frank Gehry, it was completed in 1996. Renowned for its unique deconstructivist style, the building features two towers symbolizing a pair of dancers\u2014Fred Astaire and Ginger Rogers\u2014where a glass tower appears to be swirling into an embrace with a more stable stone tower. It breaks away from Prague\u0027s traditional Baroque, Gothic, and Art Nouveau architecture, adding a bold touch of modern flair to the cityscape. Though it sparked debate upon launch, it has become one of Prague\u0027s most popular photo spots, with a rooftop restaurant and observation deck offering fantastic panoramic views of the city.", "name": "Dancing House", "transport": "Tram 17 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed Stop; Metro Line B Karlovo n\u00e1m\u011bst\u00ed Station (approx. 5 min walk)"}, {"address": "Karlovo n\u00e1m\u011bst\u00ed 1/23, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.4 stars | Located on the corner of the expansive Charles Square, the New Town Hall is one of the most significant historical buildings in Prague\u0027s New Town. Built in the late 14th century, this Gothic structure served as the core administrative center when Charles IV founded the New Town. Its soaring tower and sturdy stone walls have witnessed centuries of Prague\u0027s history. Historically serving as the administrative, judicial, and political center of New Town, it was also the site of the First Defenestration of Prague during the Hussite Wars, an event with profound impacts on Czech history. Today, it hosts cultural events, exhibitions, and weddings, while preserving many original Gothic and Renaissance architectural details inside. Climbing its tower offers magnificent views of Charles Square and the surrounding area, evoking the grandeur and historical weight of this ancient building.", "name": "New Town Hall", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed Station; Tram 3, 6, 10, 14, 16, 18, 22, 24 to Karlovo n\u00e1m\u011bst\u00ed Stop"}, {"address": "Karlovo n\u00e1m\u011bst\u00ed 9, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.6 stars | The Church of St. Ignatius of Loyola is one of the most striking Baroque buildings on Charles Square. Built by the Jesuits in the late 17th century, it stands as one of Central Europe\u0027s most significant Jesuit churches. Renowned for its grand facade, fine sculptures, and lavishly decorated interior, the church\u0027s design was inspired by the Church of Sant\u0027Ignazio in Rome. Inside, a wealth of frescoes, altars, and statues showcase the height of Baroque artistic extravagance and religious passion. Notably, the trompe-l\u0027\u0153il ceiling fresco creates an incredible visual effect of infinite space. Together with the adjacent Jesuit College, it forms a bright highlight on Charles Square, offering an excellent window into Prague\u0027s Baroque art and religious history. Its serene, solemn atmosphere and exquisite artistic details draw countless visitors and art lovers.", "name": "Church of St. Ignatius of Loyola", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed Station; Tram to Karlovo n\u00e1m\u011bst\u00ed Stop"}, {"address": "Jeruzal\u00e9msk\u00e1 7, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | The Jerusalem Synagogue, also known as the Jubilee Synagogue, is the youngest and most colorful synagogue in Prague, as well as one of the most beautiful in Europe. Built in 1906, it is famous for its unique blend of Moorish Revival and Art Nouveau styles. The exterior is decorated with vivid red brick, white stone, and gold details, while the interior is breathtakingly ornate with intricate stained glass windows, mosaic patterns, and rich geometric motifs creating an incredible visual display. Serving not only as an active house of worship for Prague\u0027s Jewish community, it also functions as a museum showcasing Jewish culture and history. Its unique architectural style and vibrant colors make it stand out among Prague\u0027s historical landmarks, attracting visitors from all over the world.", "name": "Jubilee Synagogue", "transport": "Metro Line C Hlavn\u00ed n\u00e1dra\u017e\u00ed Station (approx. 5 min walk); Tram 3, 5, 9, 14, 24 to Jind\u0159i\u0161sk\u00e1 Stop"}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1 61, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Lucerna Palace is a grand Art Nouveau complex located near Wenceslas Square in Prague\u0027s New Town, built in the early 20th century by the grandfather of V\u00e1clav Havel. This multipurpose complex includes a concert hall, cinema, gallery, caf\u00e9, and shops, making it an essential cultural and social hub in Prague. One of its most famous features is the upside-down statue of \u0027St. Wenceslas Riding a Dead Horse\u0027 hanging in the atrium\u2014a satirical sculpture by artist David \u010cern\u00fd that has become the emblem of the passage. The palace boasts lavish interior decor, a massive glass atrium ceiling, and delicate wrought-iron details showcasing Art Nouveau elegance and innovation. More than an architectural landmark, Lucerna Palace is a wonderful place to experience Prague\u0027s cultural scene, catch a film, or enjoy a concert amid historical charm and artistic flair.", "name": "Lucerna Palace", "transport": "Metro Line A/B M\u016fstek Station; Metro Line A Muzeum Stati
