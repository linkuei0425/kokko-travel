ad Station, right outside the station."}, {"address": "Havl\u00ed\u010dkovy sady 2188, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Havl\u00ed\u010dkovy Sady, commonly known as Gr\u00e9bovka Park, is one of Prague\u0027s most beautiful English-style parks, combining natural beauty, historic architecture, and unique vineyard scenery. The park\u0027s most famous attractions include the Renaissance-style Gr\u00e9bovka Villa, a romantic grotto (Grotta), and Prague\u0027s only urban vineyard. Strolling through the vineyard offers charming views of Prague Castle and the southern part of the city. The park\u0027s design is full of romanticism, with fountains, sculptures, and winding paths providing rich subjects for photography. Every autumn, a wine harvest festival is held here, making it a fantastic spot to experience Prague\u0027s wine culture and capture idyllic scenery.", "name": "Havl\u00ed\u010dkovy Sady / Gr\u00e9bovka Park", "transport": "Take Tram 7, 22, or 24 to Jana Masaryka Station, or Tram 4, 13, or 22 to N\u00e1m\u011bst\u00ed M\u00edru Station, then walk for about 10-15 minutes."}, {"address": "U Pam\u00e1tn\u00edku 1900, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.4 stars | Perched atop V\u00edtkov Hill, the National Monument on V\u00edtkov is one of Prague\u0027s most iconic national monuments, commemorating key events and figures in Czech history. Its most striking features are its grand architectural style and the colossal equestrian statue of Jan \u017di\u017eka, one of the largest equestrian statues in the world. The plaza in front of the monument offers stunning panoramic views over Prague, particularly the red-tiled roofs of the \u017di\u017ekov district and Prague Castle in the distance\u2014an ideal spot for urban landscape and sunset photography. Inside, there is a museum showcasing the history of the Czech Republic and providing detailed information about the monument itself. It is a must-visit for history buffs and photographers looking to capture Prague\u0027s grand vistas.", "name": "National Monument on V\u00edtkov (N\u00e1rodn\u00ed pam\u00e1tn\u00edk na V\u00edtkov\u011b)", "transport": "Take Tram 1, 3, 5, 9, 15, or 25 to Husineck\u00e1 Station, then walk uphill for about 10-15 minutes."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.5 stars | Peace Square (N\u00e1m\u011bst\u00ed M\u00edru) is the heart of Prague\u0027s Vinohrady district. Anchored by the grand Church of St. Ludmila, it is one of the neighborhood\u0027s most beautiful and vibrant squares. The Church of St. Ludmila is an impressive Neo-Gothic building with twin spires reaching into the sky; its intricate facade and stained glass windows gleam brilliantly in the sunlight, making it a great photographic subject. The square is surrounded by elegant historic buildings and offers convenient transport options via tram and metro. Especially during Christmastime, a lively Christmas market takes place here with glittering lights and a warm atmosphere\u2014a popular spot to capture the festive vibe and Prague\u0027s winter charm. Whether admiring architectural details or soaking up local life, this spot offers abundant photo opportunities.", "name": "Peace Square \u0026 Church of St. Ludmila (N\u00e1m\u011bst\u00ed M\u00edru \u0026 Kostel svat\u00e9 Ludmily)", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru Station, right outside the station."}, {"address": "Vinohradsk\u00e1 1835/153, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.6 stars | Ol\u0161any Cemetery is one of Prague\u0027s largest and oldest cemeteries, serving as an open-air museum filled with Gothic romance and a serene ambiance. Many famous figures from Czech history are buried here, including writers, artists, and politicians. The cemetery contains thousands of exquisite gravestones, sculptures, and mausoleums spanning various styles from Art Nouveau to Neo-Gothic, each filled with a sense of story. Lush trees and winding paths create a uniquely tranquil atmosphere\u2014especially in autumn when fallen leaves add to its mystery and beauty. For visitors who love history, architecture, or seek unique photography subjects, Ol\u0161any Cemetery is a rare gem that captures a side of Prague far removed from the bustling city center.", "name": "Ol\u0161any Cemetery (Ol\u0161ansk\u00e9 h\u0159bitovy)", "transport": "Take Tram 5, 9, 10, 15, 16, or 26 to Ol\u0161ansk\u00e9 h\u0159bitovy Station, or Metro Line A to \u017delivsk\u00e9ho Station."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru 1450/7, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.3 stars | The Vinohrady Theatre is a cultural landmark in Prague\u0027s Vinohrady district\u2014a magnificent Art Nouveau building with an ornate facade and delicate decorative details that leave a lasting impression. Built in 1907, it is one of Czechia\u0027s most important theaters, renowned for its rich theatrical tradition and high-quality performances. The exterior design blends classical elegance with the fluid lines of Art Nouveau, with its entrance sculptures and ornamentation serving as prime subjects for architecture photography. Whether admiring its refined details under the daytime sun or appreciating its grand presence under night lighting, Vinohrady Theatre provides a unique photographic backdrop reflecting Prague\u0027s rich cultural and artistic atmosphere.", "name": "Vinohrady Theatre (Vinohradsk\u00e9 divadlo)", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru Station, right outside the station."}], "name": "Popular Photo Spots"}}, "name": "\u8461\u8404\u9152\u838a\u5340\u8207\u9f4a\u8332\u79d1\u592b (Vinohrady \u0026 \u017di\u017ekov)"}, "vysehrad": {"categories": {"cat_1": {"items": [{"address": "\u0160tulcova 1000/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | This grand Gothic church is the most prominent landmark in the Vy\u0161ehrad district, with its twin spires soaring into the sky\u2014an iconic feature of Prague\u0027s skyline. The interior is lavishly decorated with exquisite frescoes, stained glass windows, and a breathtaking altar that tell the rich story of Czech history and religion. Originally built in the 11th century, it underwent multiple rebuilds and expansions to achieve today\u0027s magnificent Neo-Gothic appearance. Serving as both a place of worship and a realm of culture and art, its solemn atmosphere and delicate artistic details leave a lasting impression.", "name": "Basilica of St. Peter and St. Paul", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "K rotund\u011b 1000/10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.8 stars | Adjacent to the Basilica of St. Peter and St. Paul, this cemetery is the final resting place of the Czech nation\u0027s most distinguished figures, including artists, writers, musicians, and scientists such as Anton\u00edn Dvo\u0159\u00e1k and Alphonse Mucha. The cemetery itself resembles an open-air sculpture museum, featuring beautifully crafted artistic tombstones that each look like a unique work of art. Strolling through offers a profound sense of history alongside superb sculptured art, making it an essential site for understanding Czech culture and heritage.", "name": "Vy\u0161ehrad Cemetery", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "K rotund\u011b 1000/10, 128 00 Praha 2-Vy\u0161ehrad, Czechia (within Vy\u0161ehrad Cemetery)", "feature": "\u2b50 4.7 stars | Located inside Vy\u0161ehrad Cemetery, Slav\u00edn is a grand pantheon serving as a collective tomb to honor the greatest figures of the Czech nation. Designed by architect Anton\u00edn Wiehl and completed in 1890, this Neo-Renaissance monument features a large statue representing the \u0027Winged Genius\u0027 at its top, symbolizing the spirit and glory of the Czech people. Inscribed with the names of many Czech luminaries, it stands as a symbol of national identity and cultural legacy, as well as one of Vy\u0161ehrad\u0027s most iconic landmarks.", "name": "Slav\u00edn Monument", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "V Pevnosti 16/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | The Rotunda of St. Martin is one of Prague\u0027s oldest surviving Romanesque buildings, dating back to the late 11th century. This compact yet sturdy rotunda church is famous for its unique architectural style and long history. Though modest in appearance, it has witnessed a millennium of Prague\u0027s history, serving variously as a church, a warehouse, and even a gunpowder storehouse during the Napoleonic Wars. Today, as a precious historical treasure of Vy\u0161ehrad, it showcases the medieval architectural charm of Prague to visitors.", "name": "Rotunda of St. Martin", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (General area of the walls)", "feature": "\u2b50 4.6 stars | An essential part of Prague\u0027s historical defense system, the Vy\u0161ehrad Walls trace their roots back to the 10th century. Encircling the entire Vy\u0161ehrad area, these formidable ramparts offer breathtaking panoramic views of the city, including the Vltava River, Prague Castle, and the surrounding neighborhoods. Strolling along the walls allows visitors to imagine ancient battles and feel the passage of time. Exceptionally well-preserved, the fortifications are a magnificent architectural masterpiece and a textbook example of medieval defense works.", "name": "Vy\u0161ehrad Walls", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Entrance near Brick Gate)", "feature": "\u2b50 4.4 stars | The Vy\u0161ehrad Casemates are an intricate network of underground passages and vaulted chambers built in the 17th century for military defense and storage. Once housing soldiers and ammunitions, these dark and mysterious subterranean corridors are now open to the public via guided tours. Visitors can venture underground to explore these historic tunnels, gain insight into past military life, and view original Baroque statues from the Charles Bridge housed inside the massive Gorlice hall.", "name": "Vy\u0161ehrad Casemates", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | Built in 1841, the Brick Gate is one of the best-preserved city gates in the Vy\u0161ehrad complex and a vital component of its fortifications. Built in Neo-Classical style, it is known for its sturdy brick-and-stone structure and arched passageways. Serving as one of the primary entrances to Vy\u0161ehrad, it also houses an exhibition space for the Vy\u0161ehrad Museum, showcasing local history and archaeological finds. The gate itself stands as an architectural gem reflecting centuries of transformation.", "name": "Brick Gate (Ciheln\u00e1 br\u00e1na)", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Within Vy\u0161ehrad Park/Gardens)", "feature": "\u2b50 4.2 stars | Although the original castle no longer stands intact, its ruins and archaeological remains are significant historical landmarks in Vy\u0161ehrad. These sites include foundations of early Romanesque palaces and fortifications, bearing witness to Vy\u0161ehrad\u0027s glorious era as the royal residence of Vratislaus II, the first King of Bohemia. Visitors can discover these marked sites throughout Vy\u0161ehrad Park, reimagining the former splendor of the royal stronghold while soaking in Prague\u0027s ancient regal atmosphere.", "name": "Remains of the Old Vy\u0161ehrad Castle", "transport": "Take Metro Line C to Vy\u0161ehrad Station and walk for about 10\u201315 minutes; or take Tram 3, 7, 17, or 21 to V\u00fdto\u0148 Station, then walk uphill along the riverbank."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "\u0160tulcova 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | The most majestic landmark in Prague\u0027s Vy\u0161ehrad district, this Neo-Gothic basilica stands proud with its iconic twin spires and is designated as a Czech national cultural monument. The interior is lavishly decorated, featuring breathtaking stained-glass windows that depict Biblical stories and the lives of Czech saints, with sunlight streaming through to create a sacred and solemn atmosphere. The ceilings and walls are filled with delicate frescoes and murals, showcasing the exquisite craftsmanship of late 19th and early 20th-century Czech artists. The main altar was designed by Josef Mocker, while the side altars are adorned with precious Baroque paintings. The basilica also houses relics of St. Peter and St. Paul, as well as an image of \u0027Our Lady of Vy\u0161ehrad,\u0027 believed to have been painted by St. Luke. The building itself is a masterpiece blending deep history and faith, making it a must-visit destination for exploring Czech religious art and architecture.", "name": "Basilica of St. Peter and Paul", "transport": "Metro Line C to Vy\u0161ehrad Station, about a 10-15 minute walk; or take Tram 7, 17, or 3 to V\u00fdto\u0148 Station and walk uphill."}, {"address": "K rotund\u011b 100/10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.6 stars | Vy\u0161ehrad Cemetery is not only one of Prague\u0027s oldest and most revered burial grounds, but also an open-air art gallery known as the \u0027Pantheon\u0027 of the Czech nation. Resting here are hundreds of prominent figures in Czech history, including composers Anton\u00edn Dvo\u0159\u00e1k and Bed\u0159ich Smetana, writer Karel \u010capek, and painter Alphonse Mucha. Every tombstone is a unique work of art, ranging from grand sculptures to intricate bas-reliefs in various styles that reflect the evolution of Czech art from the late 19th to early 20th centuries. Strolling through feels like traveling through time, engaging in a silent dialogue with these great souls. With its elegant design, shady trees, and peaceful environment, it is an ideal place to remember history, admire art, and feel the spirit of the Czech nation.", "name": "Vy\u0161ehrad Cemetery", "transport": "Located next to the Basilica of St. Peter and Paul; same transport directions as above."}, {"address": "K rotund\u011b 100/10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | The Slav\u00edn Monument is the centerpiece and highlight of Vy\u0161ehrad Cemetery\u2014a magnificent Neo-Renaissance tomb designed by architect Anton\u00edn Wiehl and completed in 1897. It is not only the final collective resting place for the Czech national elite, but also an awe-inspiring artistic masterpiece. Atop the monument stands a massive statue of \u0027Winged Victory\u0027, symbolizing the eternal immortality of the Czech national spirit. It is surrounded by exquisite sculptures created by renowned sculptors, each filled with symbolic meaning celebrating art, science, and patriotism. The Slav\u00edn Monument stands as a proud symbol of Czech national identity and a tribute of the highest order to those who contributed greatly to the nation\u0027s culture and science. Its solemn atmosphere and extraordinary artistic value make it an unmissable cultural landmark in Vy\u0161ehrad.", "name": "Slav\u00edn Monument", "transport": "Located inside Vy\u0161ehrad Cemetery; same transport directions as above."}, {"address": "V Pevnosti 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | The Rotunda of St. Martin is one of Prague\u0027s oldest surviving Romanesque buildings, with a history dating back to the second half of the 11th century. This compact yet sturdy rotunda, with its distinctive cylindrical structure and thick stone walls, stands as a witness to a thousand years of Prague\u0027s changing history. Though its exterior is modest and unpretentious, the interior retains precious remnants of murals and a 17th-century Baroque altar. Historically used as a powder magazine and even damaged during the Prussian siege of the 18th century, it was eventually restored. It serves not only as the oldest architectural gem in the Vy\u0161ehrad area but also as a crucial example for studying early medieval architecture and religious art, representing an enduring mark of Prague\u0027s origins.", "name": "Rotunda of St. Martin", "transport": "Metro Line C to Vy\u0161ehrad Station, about a 15-minute walk; or take Tram 7, 17, or 3 to V\u00fdto\u0148 Station and walk uphill."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.0 stars | Located within the Vy\u0161ehrad grounds, usually housed in the historic building of the New Deanery (Nov\u00e9 d\u011bkanstv\u00ed), Galerie Vy\u0161ehrad offers visitors a platform to appreciate contemporary art. The gallery regularly hosts themed exhibitions focusing primarily on local Czech artists, spanning various art forms including painting, sculpture, and photography. The exhibitions are rich and diverse, ranging from abstract expressionism to figurative realism. Galerie Vy\u0161ehrad not only offers emerging artists an opportunity to showcase their talent but also allows visitors to experience the vitality and creativity of modern art amid Vy\u0161ehrad\u0027s historic ambiance. It forms an essential component of the district\u0027s cultural landscape, adding a vibrant touch of modern art to the ancient site.", "name": "Galerie Vy\u0161ehrad", "transport": "Metro Line C to Vy\u0161ehrad Station, about a 15-minute walk; or take Tram 7, 17, or 3 to V\u00fdto\u0148 Station and walk uphill."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | Located inside the historic Brick Gate (Ciheln\u00e1 br\u00e1na), the Vy\u0161ehrad Museum is an excellent venue for gaining deep insight into the rich history of the Vy\u0161ehrad fortress. Through a rich array of exhibits, models, photographs, and text, the museum details Vy\u0161ehrad\u0027s development from prehistoric times to the modern era. It showcases the glorious past of Vy\u0161ehrad as an early seat of Czech dukes and kings, as well as its evolution into a military fortress and religious center. Visitors can learn about archeological discoveries, architectural transformations, and associated legendary tales. The engaging exhibition design helps explain the strategic importance and cultural value of Vy\u0161ehrad, while also providing a starting point for exploring the underground Casemates and Gorlice Hall.", "name": "Vy\u0161ehrad Museum at Brick Gate", "transport": "Metro Line C to Vy\u0161ehrad Station, about a 15-minute walk; or take Tram 7, 17, or 3 to V\u00fdto\u0148 Station and walk uphill."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | Gorlice Hall is the largest hall within the underground Casemates network of Vy\u0161ehrad, made unique by its use as an extraordinary exhibition space. Here, original Baroque statues from Charles Bridge are preserved and displayed. These statues originally stood on Charles Bridge; to protect the originals from weathering and erosion, they were moved here for safe keeping and exhibition. Visitors can appreciate these exquisite Baroque masterpieces up close inside this mysterious underground space, taking in their delicate craftsmanship and rich expression. Gorlice Hall is not only a piece of Vy\u0161ehrad\u0027s history but also a unique \u0027underground art museum\u0027 providing visitors with an unforgettable cultural experience.", "name": "Gorlice Hall", "transport": "Metro Line C to Vy\u0161ehrad Station, about a 15-minute walk; or take Tram 7, 17, or 3 to V\u00fdto\u0148 Station and walk uphill."}, {"address": "V Pevnosti 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 3.8 stars | The Remains of the Church of the Virgin Mary constitute an important archaeological site in Vy\u0161ehrad, standing as evidence of its early history. Originally built in the 10th century, this church is one of the oldest in Vy\u0161ehrad, pre-dating even the Basilica of St. Peter and Paul. Although only foundations and partial wall remnants remain today, these ruins offer valuable clues to archaeologists and historians, revealing Vy\u0161ehrad\u0027s significance as an early center of the Czech state. Visitors can view the floor plan of the church, imagine its former grand scale, and learn about the architectural evolution of Vy\u0161ehrad during the Romanesque and Gothic periods. Though no longer a complete church, its historical and archaeological value makes it a key piece in understanding the evolution of Vy\u0161ehrad\u0027s religious architecture and an unmissable heritage site for history enthusiasts.", "name": "Remains of the Church of the Virgin Mary", "transport": "Located within the Vy\u0161ehrad complex; same transport directions as above."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | Serving as the green lungs of the Vy\u0161ehrad area, Vy\u0161ehrad Gardens is a vast oasis featuring manicured lawns, ancient trees, winding paths, and impressive sculptures. It offers a tranquil escape from the bustling city. A popular spot among locals for strolling, jogging, and picnics, it\u0027s also a great starting point for history lovers to explore the fortress\u0027s rich past. Benches scattered throughout the park invite visitors to sit back, feel the gentle breeze, and admire breathtaking views of the Vltava River. With vibrant blooms in spring and golden foliage in autumn, Vy\u0161ehrad Gardens showcases unique charm in every season, making it a perfect spot to experience Prague\u0027s natural beauty and rich history.", "name": "Vy\u0161ehrad Gardens (Vy\u0161ehradsk\u00e9 sady)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.8 stars | Encircling the entire fortress complex, the Vy\u0161ehrad Walls Promenade offers a scenic walking route with panoramic views of Prague from various angles. As you stroll along the historic ramparts, enjoy sweeping vistas of the meandering Vltava River, iconic Charles Bridge, red-tiled roofs of Lesser Town (Mal\u00e1 Strana), and even Prague Castle in the distance. The promenade is not only a fantastic viewpoint but also a testament to history, with ancient stone walls echoing centuries of stories. Lined with leafy trees and fresh air, it\u0027s a favorite spot for photographers capturing Prague\u0027s skyline and couples seeking a romantic walk. Truly mesmerizing at sunrise or sunset, it\u2019s a must-visit destination to soak in Prague\u0027s enchanting charm.", "name": "Vy\u0161ehrad Walls Promenade (Vy\u0161ehradsk\u00e9 hradby)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.9 stars | Scattered throughout the Vy\u0161ehrad area are several stunning lookout spots, each providing a unique perspective of Prague\u0027s panoramic skyline. The most famous viewpoints are located behind the Basilica of St. Peter and St. Paul and along the ramparts, offering breathtaking vistas of the Vltava River, Charles Bridge, Prague Castle, Lesser Town, and New Town. Set amidst lush greenery, these viewpoints offer fantastic opportunities for photos. Whether bathed in daytime sunshine or illuminated by romantic night lights, the views from Vy\u0161ehrad deliver an unparalleled visual feast. Here, history seamlessly blends with natural beauty\u2014an absolute must-see for every visitor to Prague.", "name": "Vy\u0161ehrad Viewpoints (Vyhl\u00eddky na Vy\u0161ehrad\u011b)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | Vy\u0161ehrad Rock is a striking natural landmark whose steep cliffs tower over the Vltava River, adding a majestic air to the entire complex. Nearby stands the \u0027Devil\u0027s Column\u0027, a mysterious geological curiosity made of three large stone pillars. Local legend has it that the devil threw them here from Rome after losing a wager to a priest. Beyond its unique geological nature, this spot carries rich folklore and historic tales that intrigue visitors. Surrounded by peaceful green spaces and ancient trees, it offers a serene atmosphere where you can soak up natural scenery while delving into Prague\u0027s enchanting legends. A fantastic spot to explore the mystique of Vy\u0161ehrad.", "name": "Devil\u0027s Column \u0026 Vy\u0161ehrad Rock (\u010cert\u016fv sloup \u0026 Vy\u0161ehradsk\u00e1 sk\u00e1la)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "K rotund\u011b 10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | Far more than just the final resting place of Czech national heroes, artists, and scientists, Vy\u0161ehrad Cemetery is a beautifully designed open-air museum surrounded by lush greenery. The cemetery is adorned with intricate sculptures, ornate gravestones, and neatly kept gardens, creating a solemn yet serene atmosphere. As you walk through, you\u0027ll admire remarkable tomb art crafted by famous Czech artists, each telling a story of passion and memory. At its center stands Slav\u00edn, a grand pantheon and tomb honoring the nation\u0027s most distinguished cultural figures. Resembling a peaceful park filled with shady trees and singing birds, it\u2019s an ideal place to reflect on history, appreciate fine art, and enjoy a quiet moment.", "name": "Vy\u0161ehrad Cemetery \u0026 Slav\u00edn Monument (Vy\u0161ehradsk\u00fd h\u0159bitov a Slav\u00edn)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti 16/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | St. Martin\u0027s Rotunda is one of Prague\u0027s oldest surviving Romanesque structures, surrounded by a peaceful and scenic green lawn. Though intimate in size compared to the main Vy\u0161ehrad Gardens, this space charms visitors with its quiet ambiance and rich history. Framed by mature trees and soft grass, the ancient rotunda appears even more elegant, providing an ideal spot for peaceful reflection away from the crowds. Visitors love to sit here to read, rest, or simply bask in the sun. This harmony of historic architecture and nature offers a wonderful way to experience Prague\u0027s deep cultural roots and refreshing natural beauty.", "name": "Green Area around St. Martin\u0027s Rotunda (Rotunda sv. Martina)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti 16/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | The open lawn surrounding the Vy\u0161ehrad Summer Stage is a lively yet relaxing green space. While the stage itself hosts outdoor theater performances, the surrounding grounds serve as a popular leisure spot for visitors and locals when no shows are taking place. The flat, soft lawn is perfect for picnics, sunbathing, reading, or simply unwinding. Kids can run and play freely while adults lounge on the grass, enjoy gentle breezes, and admire the surrounding historic architecture. In warmer months, it becomes a favorite spot for casual outdoor gatherings, adding a cheerful and leisurely vibe to Vy\u0161ehrad.", "name": "Lawn Area around Vy\u0161ehrad Summer Stage (Letn\u00ed sc\u00e9na Vy\u0161ehrad)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.6 stars | Designed specifically for families visiting Vy\u0161ehrad, this playground offers a safe, fun, and energetic green environment for kids. It comes well-equipped with well-maintained play structures including slides, swings, and climbing frames suitable for children of various ages. Surrounded by leafy trees and fresh lawns, the playground allows kids to connect with nature while letting off steam. Parents can relax on nearby benches while keeping a watchful eye, making it a delightful family bonding spot. It\u0027s the perfect stop for families needing a refreshing break during their tour of Vy\u0161ehrad.", "name": "Vy\u0161ehrad Children\u0027s Playground (D\u011btsk\u00e9 h\u0159i\u0161t\u011b Vy\u0161ehrad)", "transport": "Metro Line C (Vy\u0161ehrad station), approx. 10\u201315 min walk; Tram lines 7, 17, or 3 (V\u00fdto\u0148 stop), then walk uphill along the riverbank."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "V Pevnosti 159/5B, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | The Vy\u0161ehrad Fortress Walls are not only witnesses to history but also one of Prague\u0027s most breathtaking viewpoints. Strolling along the ancient ramparts, you can enjoy sweeping panoramic views of the Vltava River, Prague Castle, Lesser Town, and New Town. At dusk, the setting sun bathes the entire city in a golden glow, creating a picturesque setting perfect for photography enthusiasts to capture Prague\u0027s magical moments. With open vistas and a gentle breeze, it offers a serene and wonderful atmosphere whether you\u0027re on a romantic date, a family outing, or a solo contemplation. Many visitors linger here for a long time to enjoy the unique cityscape and snap countless unforgettable photos.", "name": "Vy\u0161ehrad Fortress Walls and Viewpoints", "transport": "Take Metro Line C to Vy\u0161ehrad Station, then walk about 10\u201315 minutes to reach the fortress entrance."}, {"address": "\u0160tulcova, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | This grand Neo-Gothic basilica is an iconic landmark of the Vy\u0161ehrad area, with its towering twin spires standing out strikingly against the Prague skyline. The ornate exterior and exquisite details make a perfect photo backdrop. Stepping inside, you\u0027ll be awed by the stained glass windows, murals, and intricate altar. Sunlight streaming through the stained glass creates a sacred and solemn ambiance. The square in front of the basilica is also a popular photo spot, allowing you to capture the full grandeur of the building. Whether you\u0027re an architecture enthusiast or seeking inner peace, you\u0027ll be captivated by its artistic and historic charm.", "name": "Basilica of St. Peter and St. Paul", "transport": "Located in the center of Vy\u0161ehrad, about a 5\u20137 minute walk from the fortress entrance."}, {"address": "K rotund\u011b 10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.8 stars | Vy\u0161ehrad Cemetery is a sacred resting place for the Czech nation, housing famous artists, writers, scientists, and politicians, including Anton\u00edn Dvo\u0159\u00e1k and Alphonse Mucha. The uniquely designed tombstones are filled with artistic flair, each resembling a delicate sculpture worth appreciating. The grand Slav\u00edn Monument at the cemetery\u0027s center symbolizes the glory and immortality of the Czech nation. Strolling through the cemetery, you can feel the depth of history and art while taking storytelling photographs. It is not only a place to honor historical luminaries but also an open-air art museum.", "name": "Vy\u0161ehrad Cemetery and Slav\u00edn Monument", "transport": "Located next to the Basilica of St. Peter and St. Paul, easily accessible on foot."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | The Rotunda of St. Martin is Prague\u0027s oldest surviving Romanesque rotunda, dating back to the 11th century. With its unique circular structure and red-tiled roof, this quaint ancient building stands out strikingly amidst the greenery of Vy\u0161ehrad. Although the interior is generally not open to the public, its rustic exterior makes for a fantastic photo spot. Witnessing a millennium of Prague\u0027s history, it is an ideal location for history buffs and photographers looking to capture ancient Prague vibes. Under the sunlight, the brick-red walls contrast beautifully with the surrounding green trees, creating a picture-perfect scene.", "name": "Rotunda of St. Martin", "transport": "Located inside Vy\u0161ehrad near the T\u00e1bor Gate, accessible on foot."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Widespread park area with statues scattered throughout)", "feature": "\u2b50 4.6 stars | The expansive park grounds of Vy\u0161ehrad feature statues created by the famous Czech sculptor Josef Myslbek, depicting mythical Czech heroes such as Princess Libu\u0161e and P\u0159emysl. These statues hold immense artistic value and infuse the park with rich history and folklore. Take a stroll along tree-lined paths, snap photos with these legendary figures, and immerse yourself in Czech folklore. The park also offers secluded nooks and benches, making it an ideal place to relax, enjoy nature, and capture evocative photos.", "name": "Vy\u0161ehrad Park and Statues", "transport": "Located throughout Vy\u0161ehrad, easily explored on foot."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Located at the edge of the Vy\u0161ehrad walls)", "feature": "\u2b50 4.3 stars | Libu\u0161e\u0027s Bath is a legendary rocky outcrop where, according to Czech myth, Princess Libu\u0161e bathed and prophesied the founding of Prague. Although not an actual bathhouse, this jutting rock offers a unique vantage point overlooking the Vltava River and surrounding scenery. Mysterious and romantic, it\u0027s a great spot for unique backdrops and capturing Prague\u0027s folklore. Many visitors stop here to snap photos and feel the ancient legends and natural beauty. It becomes especially enchanting at sunset when the soft light illuminates the landscape.", "name": "Libu\u0161e\u0027s Bath", "transport": "Located inside Vy\u0161ehrad behind the Basilica of St. Peter and St. Paul; follow the rampart path to find it."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Near Libu\u0161e\u0027s Bath)", "feature": "\u2b50 4.4 stars | Who would guess that a charming, compact vineyard is hidden inside the historic Vy\u0161ehrad fortress? Perched at the edge of the ramparts facing the Vltava River, Vy\u0161ehrad Vineyard is one of Prague\u0027s oldest vineyards and offers a unique photo backdrop. Framed by grapevine tendrils, Prague Castle and the river appear in the distance, forming an idyllic, pastoral scene. The peaceful, romantic vibe makes it a wonderful getaway from the hustle and bustle. Whether showing tender greens in spring, lush foliage in summer, or golden hues in autumn, the vineyard exudes seasonal beauty ideal for photographers.", "name": "Vy\u0161ehrad Vineyard", "transport": "Located inside Vy\u0161ehrad; walk from the Basilica of St. Peter and St. Paul towards Libu\u0161e\u0027s Bath."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia (Near the Vy\u0161ehrad entrance)", "feature": "\u2b50 4.2 stars | The Leopold Gate is one of Vy\u0161ehrad\u0027s oldest and best-preserved gates. Built in the 17th century, it stands as a fine example of Baroque architecture. With intricate carvings and a sturdy structure, this grand stone gate showcases the fortress\u0027s past defensive might. Walking through it feels like stepping back in time into an ancient world. The gate itself is an excellent photo spot; its profound sense of history and fine artistic details draw countless visitors to pause and take pictures. The deep archway with playing light and shadows creates rich layers for photography, perfectly blending history and architectural beauty.", "name": "Leopold Gate", "transport": "From Vy\u0161ehrad Metro Station, walk to one of the main entrances of the Vy\u0161ehrad area."}], "name": "Popular Photo Spots"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};
        const cityName = "Prague";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
