          "description": "⭐ 4.7星 | 查理大橋是布拉格最具代表性的地標之一，橫跨伏爾塔瓦河，連接老城與小城。這座中世紀石橋始建於14世紀，由查理四世下令建造，是歐洲最古老、最美麗的橋樑之一。橋上矗立著30尊精美的巴洛克式雕塑，大多是聖徒的雕像，使其成為一座露天藝術畫廊。這些雕塑不僅具有宗教意義，也展現了17至18世紀捷克雕塑藝術的巔峰。漫步橋上，遊客可以欣賞到布拉格城堡、老城區和伏爾塔瓦河的壯麗景色，同時感受歷史的厚重與藝術的魅力。橋上還有街頭藝人、畫家和紀念品攤販，為這座古老的橋樑增添了生動的氣息，是體驗布拉格浪漫氛圍的絕佳地點。",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Karlův most, 110 00 Praha 1, Czechia"
          }
        }
      },
      {
        "@type": "ListItem",

        "item": {
          "@type": "TouristAttraction",
          "name": "舊市政廳天文鐘 (Prague Astronomical Clock)",
          "description": "⭐ 4.6星 | 布拉格天文鐘是世界上最古老且仍在運作的機械鐘之一，位於老城廣場的舊市政廳南牆上。這座中世紀的傑作於1410年首次安裝，其複雜的機械裝置和精美的藝術裝飾令人嘆為觀止。天文鐘由三個主要部分組成：天文錶盤顯示太陽和月亮在天空中的位置以及各種天文數據；「使徒行進」是每小時整點報時時，十二使徒雕像會依次從窗戶中出現；以及日曆錶盤，描繪了鄉村生活的場景，代表著一年中的月份。天文鐘不僅是精密的計時工具，更是融合了科學、藝術和哲學的傑作，是布拉格歷史和文化的重要象徵。每當整點報時，廣場上都會聚集大量遊客，共同見證這場獨特的機械表演。",

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">此分類目前無資料</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-shadow duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 詳細地址：</span><br>${item.address || '詳見導航'}<br><br>
                                <span class="font-bold text-rose-600">🚇 自由行交通：</span><br>${item.transport || '請參考地圖'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> 開啟地圖導航
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
