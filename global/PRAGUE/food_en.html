istening to the sound of the water wheel makes for an unforgettable morning.", "name": "Caf\u00e9 Velkop\u0159evorsk\u00fd Ml\u00fdn", "transport": "Take tram 12, 15, 20, or 22 to Hellichova station, walk through Kampa Park for about 4 minutes to arrive."}], "name": "Popular Caf\u00e9s \u0026 Brunch"}, "cat_3": {"items": [{"address": "J\u00e1nsk\u00fd vr\u0161ek 321/4, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.6 stars | Hidden in the alleys of Lesser Town, this cozy bistro named after a famous alchemist exudes a nostalgic, Bohemian atmosphere. The menu focuses on authentic Czech home-style cooking. The classic goulash (\u0027Gul\u00e1\u0161\u0027) features tender, melt-in-your-mouth beef paired with a rich red wine sauce and fluffy bread dumplings (\u0027Knedl\u00edky\u0027) for a richly layered taste. The roasted pork knuckle has crispy skin and juicy meat that crackles with every bite. Friendly service and affordable prices make it not only popular with tourists, but also a beloved hidden gem among locals.", "name": "U Magistra Kelly", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 6 minutes."}, {"address": "M\u00ed\u0161e\u0148sk\u00e1 66/12, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.5 stars | Part of the renowned Czech dining group Ambiente\u0027s Lok\u00e1l series, this branch is located in Lesser Town near the Charles Bridge. It is famous for its freshly poured premium Pilsner Urquell beer, featuring cloud-like dense foam with a delicate malt sweetness and subtle hop bitterness. The menu offers exquisite traditional Czech pub snacks, such as fried cheese (\u0027Sma\u017een\u00fd s\u00fdr\u0027)\u2014crispy on the outside with gooey, stretchy cheese inside that bursts with flavor. Schnitzel and pickled sausages are also must-try items, set in a lively and merry local pub atmosphere.", "name": "Lok\u00e1l U B\u00edl\u00e9 ku\u017eelky", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 3 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 266/5, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.4 stars | A historic cellar restaurant with over 700 years of history, located right off Lesser Town Square. The basement retains a stunning vaulted stone cave architecture with an authentic antique atmosphere. Known as one of the most budget-friendly pub-restaurants in Lesser Town, it serves top-quality yet affordable Czech dark beer. A must-try is the Czech roast duck (\u0027Pe\u010den\u00e1 kachna\u0027) with golden, crispy skin and tender, juicy meat, served alongside sweet-and-sour red cabbage and traditional dumplings for a full taste of Bohemian flavor in every bite.", "name": "U Glaubic\u016f", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop; it is right by the square, just a 1-minute walk."}, {"address": "Thunovsk\u00e1 198/15, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.3 stars | One of Prague\u0027s oldest taverns, operating since 1375. The interior creates an immersive medieval vibe with skulls, candlelight, and rustic wooden tables. Its classic local dishes are famous for open-flame grilled meats and large meat platters. The grilled pork ribs (\u0027Grilovan\u00e1 \u017eebra\u0027) are savory-sweet and fall-off-the-bone tender. Paired with traditional Czech dark beer and live medieval performances, it offers a wildly unique and retro dining experience.", "name": "Medieval Tavern U Kr\u00e1le Brabantsk\u00e9ho (St\u0159edov\u011bk\u00e1 kr\u010dma U Kr\u00e1le Brabantsk\u00e9ho)", "transport": "Take tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk uphill along Thunovsk\u00e1 alley for about 5 minutes."}, {"address": "Nebovidsk\u00e1 460/6, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.5 stars | An upscale specialty bistro tucked away in a quiet alley of Lesser Town, featuring elegant vintage decor reminiscent of a 1920s aristocratic salon. Renowned for its superb game meat and traditional duck dishes, its signature roasted wild duck with orange-blueberry sauce boasts crispy skin and tender, succulent meat without any gamey odor. Paired with selected Moravian wines from the Czech Republic, it offers a refined sophistication rarely seen in traditional Czech cuisine, making it highly favored by gourmets.", "name": "U Modr\u00e9 kachni\u010dky", "transport": "Take tram 12, 15, 20, or 22 to Hellichova stop, then walk about 3 minutes."}, {"address": "Nerudova 213/18, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.4 stars | Located on Nerudova Street, a famous route leading up to Prague Castle, this cozy traditional pub focuses on classic Czech comfort food. Highly recommended is the legendary Sv\u00ed\u010dkov\u00e1\u2014braised beef served with a rich, creamy root vegetable sauce made from celeriac and carrots, topped with cranberry jam and whipped cream. The beef is tender, and the sauce is sweet, savory, and silky smooth, making it an excellent choice to experience authentic Czech flavors.", "name": "Restaurace U Mlyn\u00e1\u0159e", "transport": "Take tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk uphill along Nerudova Street for about 4 minutes."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m. 4, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.5 stars | A French-style specialty bistro located near the Lennon Wall and John Lennon Square, offering a relaxed and romantic atmosphere. The house signature is the famous \u0027Le St\u00e9ak de Paris\u0027\u2014Angus steak seared to perfection with a crispy exterior and tender interior, served with a secret-recipe herb butter sauce and golden, crispy French fries. Juicy, flavorful beef combined with the rich, aromatic sauce draws countless visitors in Lesser Town specifically to try it.", "name": "Caf\u00e9 de Paris", "transport": "Take tram 12, 15, 20, or 22 to \u00dajezd or Hellichova stop, then walk about 5 minutes towards Kampa Island."}, {"address": "Malostransk\u00e9 n\u00e1m. 35/21, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.3 stars | Situated in a historic building at the heart of Lesser Town Square, this venue combines a cultural center with a traditional Czech pub. It offers top-tier classic Czech dishes alongside exceptionally fresh draft Pilsner Urquell. Highly recommended is the Czech beef tartare (\u0027Hov\u011bz\u00ed tatar\u00e1k\u0027)\u2014minced fresh beef mixed with egg yolk and spices, spread onto toasted dark rye bread rubbed with fresh garlic. Bursting with garlic aroma and fresh, savory beef flavor, it is a favorite beer snack among locals.", "name": "Malostransk\u00e1 Beseda", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop; the building is right outside the station."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Nerudova 221/36, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.7 stars | Housed in an ancient building near the Castle Stairs in Lesser Town (Mal\u00e1 Strana), this is an iconic vegan restaurant in Prague. The restaurant reinvents hearty Czech classics into pure vegan delights. Their signature \"Vegan Goulash\" features slow-cooked mushrooms and plant-based meat that are tender and juicy, paired with soft, sauce-absorbing traditional Czech bread dumplings (Kn\u00f6del) in a rich, flavorful gravy. The \"Vegan Sv\u00ed\u010dkov\u00e1\" offers a silky golden sauce simmered from root vegetables, perfectly balanced with sweet and savory notes. Dining on the top floor of this historic building offers stunning views of Prague Castle, making it a favorite for vegans and foodies worldwide.", "name": "Vegan\u0027s Prague", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk uphill along Nerudova Street for about 5 minutes."}, {"address": "\u00dajezd 423/19, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.5 stars | A highly popular, affordable vegetarian buffet chain loved by local office workers and tourists alike. Located right next to the \u00dajezd tram stop in Lesser Town, this branch serves a rich daily selection of South Asian and Indian vegetarian dishes, including creamy lentil Dal, aromatic coconut vegetable curries, and fragrant rice. A must-try snack is the \"Samosa\", featuring a crispy, crunchy crust filled with spiced potatoes and peas. Charged by weight, it offers incredible value with evening discounts, making it a top pick for a quick, nutritious plant-based meal.", "name": "Dhaba Beas \u00dajezd (Indian-style Vegetarian Buffet)", "transport": "Take tram 9, 12, 15, 20, or 22 to \u00dajezd stop, then walk for about 1 minute."}, {"address": "\u00dajezd 407/11, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.8 stars | Founded by Icelandic bakers, this top-rated artisanal bakery offers high-quality pastries and breads, many of which are vegan and vegetarian friendly. Their signature \"Nordic Cinnamon Roll\" and \"Vegan Sourdough\" feature a super crispy crust while remaining incredibly soft, chewy, and moist inside, bursting with rich cinnamon and natural wheat aromas. Grabbing a warm, fresh baked treat while strolling through Lesser Town is a cherished ritual for both tourists and locals.", "name": "Artic Bakehouse \u00dajezd (Nordic Artisanal Bakery)", "transport": "Take tram 9, 12, 15, 20, or 22 to \u00dajezd stop, then walk for about 2 minutes."}, {"address": "L\u00e1zensk\u00e1 287/7, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.4 stars | Tucked away in an ancient alley of Lesser Town, this cozy caf\u00e9 boasts beautiful wooden ceilings and an elegant atmosphere. While not fully vegan, it offers a fantastic selection of vegetarian dishes. The \"Handmade Vegetarian Pasta\" and \"Roasted Herb Vegetable Salad\" are highly recommended\u2014al dente pasta soaking up flavorful sauce paired with sweet, local organic veggies and rich cheese. Their homemade vegan tarts feature a crispy crust and silky filling, making this a popular spot for a relaxed afternoon tea in Lesser Town.", "name": "Cukrk\u00e1valimon\u00e1da", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk for about 3 minutes."}, {"address": "Mosteck\u00e1 45/20, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.7 stars | A hidden gem right next to the Charles Bridge on the Mal\u00e1 Strana side, combining Czech craft beer with high-quality vegetarian bites. They freshly bake vegetarian and vegan treats daily, such as \"Vegan Nut Brownies\" and \"Avocado Toast\". The brownie is dense, fudgy, and intensely chocolatey, while the sourdough toast topped with homemade plant-based spread is crispy outside and soft inside. Guests love relaxing in the hidden courtyard, sipping refreshing craft beer while enjoying sweet treats away from the crowds.", "name": "Roesel - Beer \u0026 Cake", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk along Mosteck\u00e1 Street toward Charles Bridge for about 2 minutes."}, {"address": "V\u00edt\u011bzn\u00e1 124/5, 150 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.6 stars | A century-old landmark in a Neo-Renaissance style located at the edge of Lesser Town, famous for its magnificent painted ceiling and exquisite cuisine. The menu offers various premium vegetarian brunch options, such as \"Truffle Omelet with Toasted Sourdough\" and \"Vegan Oat Yogurt Bowl\". Their French-style vegetarian pastries and traditional Czech desserts are absolute masterpieces\u2014flaky, crispy puff pastries paired with silky custard fillings that melt in your mouth, ideal for diners seeking a sophisticated culinary experience.", "name": "Caf\u00e9 Savoy", "transport": "Take tram 9, 12, 15, 20, or 22 to \u00dajezd stop, then walk for about 3 minutes."}, {"address": "Plask\u00e1 615/8, 150 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.6 stars | A highly acclaimed specialty coffee shop and vegetarian brunch spot in Lesser Town, featuring a lush, green courtyard garden. The \"Vegetarian Eggs Benedict\" and \"Caramelized Fruit Vegan Oatmeal\" come highly recommended\u2014the oatmeal is cooked to silky perfection, topped with caramelized fresh fruit and crunchy nuts for a rich, balanced texture. Paired with high-quality house-roasted specialty coffee and a variety of vegetarian sweet and savory options, it is a local secret favorite.", "name": "Caf\u00e9 Lounge", "transport": "Take tram 9, 12, 15, 20, or 22 to \u00dajezd stop, then walk for about 3 minutes."}, {"address": "Mosteck\u00e1 55/3, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.3 stars | A traditional street dessert stand near Lesser Town Square specializing in Prague\u0027s most iconic cinnamon chimney cake (Trdeln\u00edk). The plant-based dough is wrapped around spit rollers and grilled over charcoal until golden and crispy, then rolled in fragrant cinnamon powder, sugar, and crushed walnuts. Crispy on the outside, warm and pleasantly chewy on the inside, eating this while walking through the streets filled with cinnamon aroma is a quintessential Prague experience.", "name": "Tradi\u010dn\u00ed Trdeln\u00edk Mal\u00e1 Strana (Traditional Chimney Cake)", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk for about 1 minute."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Nerudova 248/17, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.6 stars | Located on bustling Nerudova Street in Lesser Town, this shop is famous for its freshly baked traditional cinnamon chimney cakes (Trdeln\u00edk). The exterior is roasted to a golden, crispy crunch dusted with rich sugar and cinnamon, while the interior remains pillowy-soft, buttery, and satisfyingly chewy. Tourists love adding vanilla ice cream and Nutella\u2014the piping-hot pastry paired with velvety cold ice cream creates a delightful hot-and-cold sensation with rich layers of flavor. It\u0027s the ultimate iconic sweet treat to enjoy on your stroll up to Prague Castle.", "name": "U Kajet\u00e1na Traditional Trdeln\u00edk (Trdeln\u00edk U Kajet\u00e1na)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 3 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.3 stars | A traditional Czech street food stand located in the heart of Lesser Town Square, specializing in authentic Czech grilled sausages (Klob\u00e1sa). Sizzling over charcoal grills, the sausages feature a crispy, lightly charred casing that bursts with rich, savory juices and spices upon first bite. Served with sauerkraut, yellow mustard, and thick slices of dark rye bread, the tangy sauerkraut perfectly balances the rich sausage. Beloved by locals and tourists alike, it\u0027s the perfect choice for experiencing traditional Czech quick bites and night street food culture.", "name": "Malostransk\u00e9 N\u00e1m\u011bst\u00ed Sausage Stand (Klob\u00e1sy Malostransk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, right outside the stop."}, {"address": "Nerudova 254/9, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.7 stars | Tucked away on Nerudova Street, this artisanal gingerbread shop feels straight out of a fairytale. All traditional Czech gingerbread cookies here are meticulously handcrafted and decorated, releasing a warm aroma of honey, cloves, cinnamon, and ginger fresh out of the oven. Soft yet delightfully chewy, the subtle spices pair in perfect balance with the natural sweetness of honey. With their visually stunning designs, portable nature, and authentic taste, they are a favorite treat to nibble on while walking or to take home as souvenirs.", "name": "Gingerbread Museum Handcrafted Cookies (Pern\u00edkov\u00fd pan\u00e1\u010dek)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 2 minutes."}, {"address": "M\u00ed\u0161ensk\u00e1 66/12, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.5 stars | Located near Charles Bridge in Lesser Town, this famous spot features a takeaway window serving authentic Czech street snacks. A must-try classic is the Fried Cheese Bun (Sma\u017een\u00fd s\u00fdr v bulce)\u2014a thick cut of golden Czech cheese breaded and fried until crispy outside and gooey inside, tucked into a soft burger bun and slathered with house-made tartar sauce. Taking a bite reveals gooey, piping-hot cheese pull with rich creamy flavors. Paired with a fresh, crisp takeaway Pilsner, it\u0027s a blissfully authentic street food combo to enjoy along the cobblestone streets.", "name": "Lok\u00e1l U B\u00edl\u00e9 ku\u017eelky Takeaway Window", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 4 minutes."}, {"address": "\u00dajezd 425/24, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.8 stars | Widely hailed as the best gelato in Prague, located at the foot of Pet\u0159\u00edn Hill in Lesser Town. Handcrafted daily using carefully selected fresh ingredients, its texture is ultra-silky and smooth without a trace of ice crystals. Popular flavors include rich Pistachio, dark bittersweet chocolate, and seasonal sorbets incorporating local Czech fruits. Refreshing and balanced, it draws long lines in summer. Locals and tourists alike love grabbing a double scoop and taking a relaxing stroll towards nearby Kampa Island Park.", "name": "Angelato Artisanal Gelato (Angelato \u00dajezd)", "transport": "Take Tram 9, 12, 15, 20, or 22 to \u00dajezd station, then walk about 1 minute."}, {"address": "Mosteck\u00e1 273/21, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.2 stars | Situated on Mosteck\u00e1 Street, the main thoroughfare leading to Charles Bridge, this is a top street snack stop on the way to the bridge tower. The shop insists on open-flame charcoal roasting, coating the chimney cake with crunchy crushed walnuts and caramel for a crispy outer layer and fluffy, soft interior. Beyond classic flavors, their decadent pistachio cream and custard fillings are famously overflowing. Each bite releases a burst of sweet, rich filling, making it a photo-worthy and thoroughly satisfying treat.", "name": "Mosteck\u00e1 Trdeln\u00edk \u0026 Cr\u00eapes (Trdeln\u00edk \u0026 Cr\u00eapes Mosteck\u00e1)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 2 minutes."}, {"address": "Na Kamp\u011b 515/8, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.4 stars | Located in Kampa Island Park right beneath Charles Bridge, these riverside stalls feature a lively collection of traditional Czech street foods. The crowd favorite is fresh-fried Czech L\u00e1ngos\u2014a golden fried flatbread with a crispy exterior and chewy interior, brushed with garlic oil and topped with a generous layer of grated Czech cheese and ketchup. Savory, rich, and wonderfully chewy, enjoying one hot off the fryer while taking in Vltava River views offers an authentic taste of Czech riverside market atmosphere.", "name": "Kampa Riverside Food Stalls", "transport": "Take Tram 12, 15, 20, or 22 to Hellichova station, then walk about 5 minutes."}, {"address": "Nosticova 470/8, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.6 stars | Helmed by a renowned master Czech pastry chef, this gourmet takeaway window reimagines traditional Czech pastries into convenient street treats. Their signature Czech Cream Roll (Kremroli) features delicate, ultra-crispy layers of puff pastry filled with light, silky French meringue cream. Perfectly sweet, crisp, and melt-in-your-mouth, its exquisite craftsmanship and complex textures make it an unmissable artisanal street dessert in Lesser Town.", "name": "Cukr\u00e1\u0159 Sk\u00e1la - Mal\u00e1 Strana Window", "transport": "Take Tram 12, 15, 20, or 22 to Hellichova station, then walk about 3 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "\u5c0f\u57ce\u5340 (Mal\u00e1 Strana)"}, "new_town": {"categories": {"cat_1": {"items": [{"address": "N\u00e1rodn\u00ed 22, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | A century-old cafe operating since 1902, once a meeting spot for Franz Kafka and Albert Einstein. Their traditional Czech beef goulash features a rich, velvety sauce served with amazingly fluffy bread dumplings (Knedl\u00edky) that melt in your mouth. The signature Sv\u00ed\u010dkov\u00e1\u2014combining sweet and sour cranberry sauce, delicate whipped cream, and rich beef gravy\u2014offers wonderful layers of flavor, making it a favorite among locals and tourists alike.", "name": "Kav\u00e1rna Louvre", "transport": "About a 2-minute walk from N\u00e1rodn\u00ed t\u0159\u00edda Metro Station (Line B)"}, {"address": "K\u0159emencova 11, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Founded in 1499, this is one of Prague\u0027s oldest breweries with over 500 years of uninterrupted brewing history. Its signature house-brewed dark lager is rich and creamy, featuring roasted malt notes and a slightly sweet finish. Pair it with their roasted pork knee (Koleno)\u2014crispy skin, tender meat, and rich flavor served with sauerkraut and mustard to cut through the richness. It\u0027s the ultimate spot to experience Czech pub culture.", "name": "Brewery and Restaurant U Flek\u016f", "transport": "About a 3-minute walk from Mysl\u00edkova Tram Stop (Lines 5, 15)"}, {"address": "Jungmannovo n\u00e1m. 16, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Established in 1843, this legendary establishment was the first in Prague to serve classic Pilsner Urquell beer. Their Czech goulash features tender, flavorful beef infused with aromatic onions and spices. The fried pork schnitzel (\u0158\u00edzek) is golden and crispy on the outside while staying juicy inside, delivering a satisfying crunch with every bite. Highly praised by both local foodies and tourists seeking authentic traditional flavors.", "name": "Restaurace U Pinkas\u016f", "transport": "About a 1-minute walk from Exit B of M\u016fstek Metro Station (Lines A/B)"}, {"address": "Politick\u00fdch v\u011bz\u0148\u016f 5, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Housed in a former bank hall, this meat lover\u0027s paradise blends traditional butcher shop culture with modern flair, offering premium local meats. The freshly carved aged roast beef and traditional Czech beef tartare (Tatar\u00e1k) are remarkably smooth, savory, and fresh, perfectly paired with garlic-rubbed toasted bread. Fresh beer poured straight with dense foam completes the ultimate culinary indulgence praised by discerning foodies.", "name": "Kant\u00fdna", "transport": "About a 4-minute walk from Hlavn\u00ed n\u00e1dra\u017e\u00ed Metro Station (Line C)"}, {"address": "Na Po\u0159\u00ed\u010d\u00ed 15, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | A dream restaurant boasting a century of history and stunning ceramic mosaic decor, helmed by a famous Czech chef. The traditional braised beef cheek (Hov\u011bz\u00ed l\u00ed\u010dka) is slow-cooked for hours until fork-tender, served alongside silky smooth mashed potatoes and a rich red wine reduction. Rich in layers and remarkably memorable, it elegantly highlights the classic refined side of Czech cuisine.", "name": "Caf\u00e9 Imperial", "transport": "About a 5-minute walk from Florenc or N\u00e1m\u011bst\u00ed Republiky Metro Station (Line B)"}, {"address": "Politick\u00fdch v\u011bz\u0148\u016f 9, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | An immensely popular traditional Czech pub in New Town, famous for fresh Pilsner tank beer and generous portions of comfort food. The signature roasted duck (Pe\u010den\u00e1 kachna) features crispy golden skin and tender, juicy meat, served with sweet-and-sour red cabbage and soft potato dumplings. The perfect balance of savory, sweet, and tangy flavors delivers an authentic Czech dining experience.", "name": "Restaurace Bredovsk\u00fd Dv\u016fr", "transport": "About a 5-minute walk from Muzeum Metro Station (Lines A/C)"}, {"address": "\u017ditn\u00e1 15, 120 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | A cozy, long-established bistro loved by locals since the 19th century, preserving a warm retro charm. The traditional roasted pork ribs are crispy outside and tender inside, infused with subtle smoky sweetness and garlic aromas that fall right off the bone. Paired with house pickles and rich Czech beer, it provides a delightful taste profile\u2014a top choice to experience everyday local food culture.", "name": "Restaurace U Pravd\u016f", "transport": "About a 5-minute walk from Karlovo n\u00e1m\u011bst\u00ed Metro Station (Line B)"}, {"address": "Sp\u00e1len\u00e1 51/5, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Tucked away in an alleyway in New Town, this century-old traditional eatery offers reasonable prices and pure Czech home-cooked flavors. The traditional garlic soup (\u010cesne\u010dka) is served piping hot and aromatic, topped with melted gooey cheese and crispy croutons for a deeply comforting feel. Paired with classic grilled meat skewers and savory beef broth, it comes highly recommended for diners seeking authentic, foolproof local tastes.", "name": "Restaurace U Brej\u0161k\u016f", "transport": "About a 1-minute walk from N\u00e1rodn\u00ed t\u0159\u00edda Metro Station (Line B)"}], "name": "Authentic Local Classic Restaurants"}, "cat_2": {"items": [{"address": "N\u00e1rodn\u00ed 22, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.5 stars | A legendary caf\u00e9 with over a century of history, once a meeting spot for luminaries like Albert Einstein and Franz Kafka. The brunch here exudes pink elegant charm, featuring popular items like freshly made French toast and traditional Czech egg dishes. The hot chocolate is rich and smooth, like a melted block of chocolate, paired with crispy, crackling classic Viennese pastries\u2014a timeless culinary classic highly praised by both tourists and locals alike.", "name": "Caf\u00e9 Louvre", "transport": "Take Tram 9, 18, or 22 to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk about 2 minutes."}, {"address": "Na Po\u0159\u00ed\u010d\u00ed 1042/15, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.6 stars | Renowned as one of the world\u0027s most beautiful caf\u00e9s, enveloped in extravagantly gorgeous Art Nouveau mosaic tiles. Beyond serving top-tier specialty coffee, its brunch and Eggs Benedict are sensational\u2014runny poached egg yolks paired with rich, velvety Hollandaise sauce. Flaky croissants and fragrant Czech sausage brunch platters offer a wonderfully crispy yet tender texture, allowing foodies to savor ultimate delicacies in an affordable, palace-like atmosphere.", "name": "Caf\u00e9 Imperial", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk about 3 minutes."}, {"address": "N\u00e1rodn\u00ed 1012/1, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.3 stars | Located along the Vltava River right opposite the National Theatre, offering stunning panoramic views overlooking Prague Castle. This historic caf\u00e9 is celebrated for its artistic vibe and traditional Czech brunch. Try their freshly baked traditional Czech pancakes and cr\u00eapes\u2014crispy on the outside with a soft, sweet filling\u2014paired with pour-over specialty coffee, letting you savor old-world romance and a leisurely pace in every bite.", "name": "Caf\u00e9 Slavia", "transport": "Take Tram 2, 9, 18, or 22 to N\u00e1rodn\u00ed divadlo station; the caf\u00e9 is right there upon arrival."}, {"address": "Na Florenci 1420/3, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.7 stars | A pioneer of minimalist, modern specialty coffee in Prague, renowned for its ultra-high-quality, house-roasted single-origin beans. The piccolos and oat milk lattes here are intensely aromatic, smooth, and velvety. The brunch menu offers freshly toasted sourdough topped with fresh avocado and poached eggs\u2014crusty outside, tender inside, with a natural fermented tangy aroma\u2014making it a favorite among youth and hardcore coffee lovers.", "name": "EMA Espresso Bar", "transport": "Take Metro Line B or C to Florenc station, or take a tram to Masarykovo n\u00e1dra\u017e\u00ed station and walk about 2 minutes."}, {"address": "Jungmannova 31, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.4 stars | Tucked away on the second floor of the Cubist-style Adria Palace, featuring an elegant outdoor terrace and classic decor. Serving unique European brunch dishes and house-baked pastries, its signature pressed ham and cheese sandwich bursts with gooey cheese inside a golden, crispy crust. Paired with a rich Czech-style black coffee, it feels like stepping back into the Golden Prague of the 1920s.", "name": "Kav\u00e1rna Adria", "transport": "Take Metro Line A or B to M\u016fstek station, then walk about 2 minutes."}, {"address": "Smetanovo n\u00e1b\u0159. 334/4, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.5 stars | A combination of an arts gallery space and a riverside caf\u00e9, boasting fantastic natural light and a modern, hipster ambiance. The hearty brunch platter features house slow-fermented sourdough, seared bacon, buttery scrambled eggs, and fresh salad\u2014bursting with egg flavor and silky-smooth texture. For dessert, the freshly made waffles are crispy on the outside, fluffy inside, drizzled with local wild berry jam for an unforgettable sweet-and-sour taste.", "name": "SmetanaQ Caf\u00e9 \u0026 Bistro", "transport": "Take Tram 2, 17, or 18 to Karlovy l\u00e1zn\u011b or N\u00e1rodn\u00ed divadlo station, then walk about 3 minutes."}, {"address": "Opatovick\u00e1 160/18, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.6 stars | A hidden gem tucked deep inside a quiet courtyard in New Town, brimming with industrial vibes and indie charm. Alongside top-notch pour-over single-origin coffee, their freshly baked daily limited-edition cinnamon rolls are a must-try\u2014crispy glazed exterior, moist and soft interior, packed with rich cinnamon flavor. Paired with a cold brew, it\u2019s the ultimate choice for a serene brunch moment.", "name": "Super Tramp Coffee", "transport": "Take Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk about 4 minutes into the courtyard alley."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 804/58, 110 00 Nov\u00e9 M\u011bsto", "feature": "\u2b50 4.4 stars | Located on the second floor of a stylish shopping arcade right next to Wenceslas Square, boasting large floor-to-ceiling windows overlooking the bustling square. Renowned for its exquisite brunch options, the quiches and acai bowls are highly recommended\u2014the quiche crust is buttery and crisp with a rich filling, while the acai bowl is refreshing and layered with texture. Paired with an aromatic house-blend latte, it\u2019s a perfect spot to rest and indulge before or after shopping.", "name": "Oliver\u0027s Coffee Cup", "transport": "Take Metro Line A or C to Muzeum station, then walk about 2 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "K\u0159emencova 11, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.4 stars | An ancient pub with over 500 years of history, continuously brewing dark beer since 1499. The signature roasted pork knuckle features crispy skin, tender juicy meat, and rich flavor. Served with tangy sauerkraut and soft Czech dumplings (Knedl\u00edky), alongside a smooth sip of their homemade 13\u00b0 dark beer with caramelized malt sweetness, it promises an unforgettable feast.", "name": "Pivovar U Flek\u016f", "transport": "Take tram line 5 or 15 to Mysl\u00edkova station, then walk for about 3 minutes."}, {"address": "Pansk\u00e1 5, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.6 stars | A meat lover\u0027s paradise housed in a converted old bank hall. Operating on a self-service model, it offers mouthwatering aged beef and sausages carved and seared to order. The beef tartare (Tatar\u00e1k) is highly recommended\u2014exceptionally fine and smooth, spread over dry-toasted garlic bread, the garlic aroma and savory beef melt together perfectly. Paired with fresh Pilsner draft beer, it is nothing short of perfection.", "name": "Kant\u00fdna Meat Bistro \u0026 Pub", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 4 minutes."}, {"address": "Na Po\u0159\u00ed\u010d\u00ed 15, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.5 stars | Run by a famous Czech celebrity chef, the interior boasts stunningly luxurious early 20th-century Art Nouveau ceramic wall murals. Elevating traditional local Czech cuisine into a refined dining experience, the signature duck confit features ultra-crispy skin and meat so tender it falls off the bone. Paired with red cabbage and creamy mashed potatoes, it offers rich layers of flavor, making it a top landmark eagerly booked by locals and tourists alike.", "name": "Caf\u00e9 Imperial", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk for about 3 minutes."}, {"address": "Politick\u00fdch v\u011bz\u0148\u016f 13, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.3 stars | A popular local pub near Wenceslas Square, famous for serving extremely fresh Pilsner tank beer and classic hot Czech dishes. The classic goulash features tender, fall-apart beef in a rich, smooth sauce that makes dipping soft bread dumplings irresistible. The vibrant, cheerful atmosphere makes it a favorite among office workers for gatherings.", "name": "Restaurace Bredovsk\u00fd Dv\u016fr", "transport": "Take Metro Line A or C to Muzeum station, then walk for about 5 minutes."}, {"address": "Jind\u0159i\u0161sk\u00e1 22, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.4 stars | A unique bistro converted from a former national bank note printing plant, with a menu honoring traditional recipes from the First Republic era. Try the classic roasted pork with sauerkraut and dumplings (Vep\u0159o knedlo zelo)\u2014the pork is juicy and flavorful, while the balanced sweet-and-sour sauerkraut perfectly cuts through the richness. Pair it with their signature crispy ribs for a delightfully nostalgic Czech local flavor.", "name": "Restaurace Tisk\u00e1rna", "transport": "Take tram line 3, 9, 14, or 24 to Jind\u0159i\u0161sk\u00e1 station, then walk for about 1 minute."}, {"address": "Hybernsk\u00e1 5, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.5 stars | Located inside \u0160pork Palace, this ultra-high-ceiling modern beer hall boasts the tallest draft beer tower in Europe. It specializes in red oak charcoal-grilled meats, such as grilled venison steaks and roasted pork ribs, featuring juicy meat with a captivating smoky flavor. Paired with freshly poured premium Pilsner beer, the food tastes amazing in a modern, vibrant atmosphere.", "name": "\u010cerven\u00fd Jelen", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk for about 3 minutes."}, {"address": "Jungmannovo n\u00e1m. 16, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.2 stars | Founded in 1843, this historic pub was the first place in Prague to pour Pilsner Urquell beer. The pickled cheese (Nakl\u00e1dan\u00fd Hermel\u00edn) here is a specialty\u2014soft white cheese marinated in spiced oil and spread on dark bread, offering a smooth, rich, and slightly zesty flavor. Accompanied by perfectly poured beer foam, it is an ideal spot to experience Old Prague\u0027s local drinking culture.", "name": "Restaurace U Pinkas\u016f", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 2 minutes."}, {"address": "N\u00e1rodn\u00ed 28, 110 00 Nov\u00e9 M\u011bsto, Prague", "feature": "\u2b50 4.3 stars | A flagship pub under the famous Staropramen beer brand, combining modern industrial design with traditional pub fare. Popular dishes like crispy roasted duck breast and fried cheese balls\u2014golden and crispy on the outside with gooey, flavorful cheese inside\u2014offer a satisfying crunch. Highly popular with young locals and foreign tourists alike, it\u0027s a great spot for refined Czech pub snacks and beer.", "name": "Potrefen\u00e1 Husa N\u00e1rodn\u00ed", "transport": "Take Metro Line B or tram line 9 or 18 to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk for about 2 minutes."}], "name": "Specialty Pubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "\u017ditn\u00e1 1431/44, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 Stars | Located in Prague\u0027s New Town, Palo Verde is a distinctive all-vegan, plant-based bistro hidden next to a classic courtyard garden. Foodies rave about their vegan croissants and Danish pastries, crispy on the outside and soft inside, with distinct flaky layers and a rich plant butter aroma that crunches satisfyingly with every bite. Main dishes like vegan creamy pasta and vegan cheese platters are rich and delicate, rivaling traditional dairy and egg dishes. Its elegant and romantic dining environment makes it a favorite spot for young locals and tourists alike.", "name": "Palo Verde Vegan Bistro", "transport": "Take Metro Line B to Karlovo n\u00e1m\u011bst\u00ed station and walk for about 5 minutes; or take Tram 6 or 22 to \u0160t\u011bp\u00e1nsk\u00e1 station."}, {"address": "K\u0159emencova 178/10, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 Stars | Nestled in an alley on K\u0159emencova, St\u0159echa is a heartwarming, socially conscious vegan bistro that transforms traditional Czech classics into delicious plant-based dishes at affordable prices. Their signature Czech Goulash features tender tofu and mushrooms slow-cooked into a rich, fragrant gravy, paired with fluffy, sauce-absorbing Czech dumplings (Knedl\u00edky) that melt in your mouth. Another standout, the vegan schnitzel, is made with soy protein, boasting a golden, crispy crust and a juicy, chewy interior\u2014an absolute top choice for experiencing authentic local vegetarian flavors.", "name": "Bistro St\u0159echa (Vegan Cooperative Bistro)", "transport": "Take Tram 5 or 17 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed station, then walk for about 3 minutes."}, {"address": "Purky\u0148ova 2121/3, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 Stars | Dhaba Beas is Prague\u0027s most popular Indian vegetarian buffet chain, with its Purky\u0148ova branch located near the commercial district. Priced by weight, the restaurant offers dozens of aromatic North Indian vegetarian curries, soy cakes, chickpea stews, and basmati rice. Their classic spiced lentil soup (Dahl) is thick and creamy, perfect when paired with fresh, piping-hot Naan that is slightly charred on the outside, soft on the inside, and full of wheat aroma. Great value, fast service, and a hygienic setting make it a hit among office workers and vegetarian backpackers.", "name": "Dhaba Beas Purky\u0148ova (Indian Vegetarian Buffet)", "transport": "Take Metro Line B or Tram 9 or 18 to N\u00e1rodn\u00ed t\u0159\u00edda station, then walk for about 2 minutes."}, {"address": "Jungmannova 1, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 Stars | Country Life is a pioneering Czech brand promoting healthy organic plant-based food. Its location on Jungmannova Street combines an organic supermarket with a vegetarian buffet. Emphasizing whole foods with low oil and salt, it features an abundant fresh salad bar, fragrant mixed-grain rice, rich vegetable soups, and grilled tofu steaks. The salad greens and fruits are crisp and juicy, paired with rich, appetizing special nut dressings. Offering healthy, guilt-free natural flavors, it\u0027s a delicious pitstop to recharge fiber and energy while exploring Prague.", "name": "Country Life Jungmannova (Organic Vegetarian Restaurant)", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 3 minutes."}, {"address": "Vodi\u010dkova 704/36, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 Stars | Forky\u0027s is a highly popular, trendy home-grown Czech vegan fast-food chain focusing on modern plant-based meats and American-style vegan comfort food. Its signature \u0027Forky\u0027s Burger\u0027 features an exclusive plant-based patty grilled to perfection\u2014lightly charred on the outside, juicy and satisfyingly meaty inside\u2014topped with rich plant-based cheese and special sauce. Additionally, the crispy \u0027Not-Fish \u0026 Chips\u0027 boasts a golden, crunchy crust and a delicately realistic fish-like texture, redefining traditional perceptions of vegetarian food and winning high praise from younger crowds.", "name": "Forky\u0027s Vodi\u010dkova (Vegan Fast Food)", "transport": "Take Tram 3, 9, 14, or 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station, then walk for about 1 minute."}, {"address": "Soukenick\u00e1 1188/27, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 Stars | Filled with a serene and peaceful Indian cultural atmosphere, Govinda specializes in traditional Ayurvedic vegetarian and Hare Krishna-style cuisine. The restaurant serves freshly made Indian Thali platters daily, including uniquely fragrant coconut vegetable curries, golden crispy Samosas, and special handmade desserts. The samosas feature a solid, crispy crust stuffed with flavorful potatoes and peas, while the homemade Lassi (yogurt drink) is sweet, tangy, smooth, and refreshing. It is a unique and high-value spiritual food haven in New Town.", "name": "Govinda Soukenick\u00e1 (Indian Vegetarian Restaurant)", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station, then walk for about 5 minutes."}, {"address": "Krakovsk\u00e1 1250/9, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 Stars | Located near Wenceslas Square, Paprika specializes in authentic Mediterranean and Middle Eastern vegetarian cuisine. Their smooth, velvety hummus carries rich notes of tahini and olive oil, while the freshly fried falafels feature an incredibly crispy exterior and a filling bursting with fresh herbs and spices. Wrapped in steaming hot pita bread, every bite offers rich layers of texture and satisfying flavor\u2014a dream destination for Mediterranean food lovers.", "name": "Paprika Mediterranean Bistro Krakovsk\u00e1", "transport": "Take Metro Line A or C to Muzeum station, then walk for about 3 minutes."}, {"address": "Na P\u0159\u00edkop\u011b 853/12, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 Stars | Located inside the \u010cern\u00e1 R\u016f\u017ee shopping center on Na P\u0159\u00edkop\u011b street, Loving Hut is a classic representative of Asian-style vegan buffets. The restaurant offers a wide variety of Asian stir-fried vegetables, vegan roast duck, crispy spring rolls, and coconut milk red curry. The vegan roast duck, made from soy protein, features crispy skin and firm, smoky meat, best enjoyed with their special sweet bean sauce. Its fast-paced buffet format with diverse choices allows shoppers and tourists to quickly enjoy a piping-hot vegan feast tailored to Asian palates.", "name": "Loving Hut \u010cern\u00e1 R\u016f\u017ee", "transport": "Take Metro Line A or B to M\u016fstek station, then walk for about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m. 846/1, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 Stars | An iconic street food stand on Wenceslas Square, popular with foreign tourists and late-night locals alike. Their freshly grilled traditional Czech sausages (Klob\u00e1sa) feature crisp, golden-brown skin that snaps with rich, juicy flavor. Served with sauerkraut, yellow mustard, and thick Czech dark bread, it offers a rich blend of textures and bold savory flavors\u2014an affordable delicacy you shouldn\u0027t miss while strolling through New Town.", "name": "V\u00e1clavsk\u00e9 Klob\u00e1sy Sausage Stand", "transport": "Metro Line A/B to M\u016fstek station, about a 1-minute walk"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 837/11, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 Stars | Prague\u0027s dreamiest strolling dessert! Golden dough spinning on the grill fills the air with rich cinnamon and nutty aromas. Freshly baked chimney cakes are coated in sugar and cinnamon, featuring a crispy, slightly caramelized exterior and a soft, chewy bread-like interior. Pair it with rich vanilla ice cream and chocolate drizzle for a hot-and-cold sensation that delights the tastebuds\u2014a top choice for photos and satisfying sweet cravings.", "name": "Traditional Trdeln\u00edk Wenceslas Square (Tradi\u010dn\u00ed Trdeln\u00edk V\u00e1clavsk\u00e9 N\u00e1m\u011bst\u00ed)", "transport": "Metro Line A/B to M\u016fstek station, about a 2-minute walk"}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 120 00 Praha 2-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 Stars | A premier Saturday farmers\u0027 market along the Vltava riverbank in New Town, bringing together Prague\u0027s most authentic street food. Stalls serve freshly fried Czech flatbread (Lango\u0161)\u2014crispy golden dough brushed with rich garlic sauce, ketchup, and smothered in melted cheese. You\u0027ll also find freshly fried traditional potato pancakes (Brambor\u00e1ky), crispy outside and soft inside with herbs and garlic, loved by locals and visitors alike.", "name": "N\u00e1plavka Farmers\u0027 Market Food Stalls (Farm\u00e1\u0159sk\u00e9 Trhy N\u00e1plavka)", "transport": "Tram 3, 7, 17, 21 to V\u00fdto\u0148 stop, about a 3-minute walk"}, {"address": "Sp\u00e1len\u00e1 2121/22, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 Stars | A famous takeaway spot that elevates the traditional Czech staple \u0027Chleb\u00ed\u010dky\u0027 (open-faced sandwiches). Served on sliced baguette or dark bread, topped generously with potato salad, smoked salmon, beetroot, or cured ham, offering a delightful mix of creamy and crisp textures. Visually appealing and light, it\u0027s perfect to grab for a stroll around the New Town square and experience authentic Czech light bites.", "name": "Sisters Bistro Quadrio", "transport": "Metro Line B to N\u00e1rodn\u00ed t\u0159\u00edda station, about a 1-minute walk"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 772/2, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 Stars | An iconic long-standing Czech bakery chain renowned for handcrafted traditional breads. Their traditional Czech jam donut (Kobliha) is soft and fluffy, stuffed with sweet and tangy apricot jam. You\u0027ll also find pretzels and cheese rolls flavored with savory salt and caraway. Affordable and fresh out of the oven, it\u0027s the ultimate street food pick for a quick energy boost.", "name": "Pek\u00e1rna Kab\u00e1t Wenceslas Square", "transport": "Metro Line A/B to M\u016fstek station, about a 1-minute walk"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. (Stanice metra M\u016fstek), 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 Stars | A popular grab-and-go bakery stall inside the metro station in New Town, drawing passersby with great value and hot baked savory and sweet pastries. Must-tries include the freshly baked meat pastries and warm cabbage pies\u2014flaky and crisp on the outside, hearty and savory inside. For sweets, try the traditional Czech round pastry (Kol\u00e1\u010d), buttery and fruit-sweet, full of local everyday charm.", "name": "Peka\u0159stv\u00ed Je\u010dm\u00ednek (M\u016fstek Station)", "transport": "Inside Metro Line A/B M\u016fstek station"}, {"address": "Na Po\u0159\u00ed\u010d\u00ed 1047/26, 110 00 Praha 1-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 Stars | A long-established takeaway bakery and snack stall on a bustling New Town commercial street, serving freshly baked traditional Czech sandwiches and meatloaf rolls daily. Highly recommended is the \u0027Sekan\u00e1 v housce\u0027\u2014a thick, juicy Czech-style baked meatloaf tucked inside a crispy bun with mustard and pickles. Bursting with juices and rich spices, it\u0027s a classic and deeply satisfying hot street meal.", "name": "N\u00e1\u0161 Chl\u00e9b Na Po\u0159\u00ed\u010d\u00ed", "transport": "Tram 3, 8, 14, 24 to B\u00edl\u00e1 labu\u0165 stop, about a 1-minute walk"}, {"address": "Karlovo n\u00e1m\u011bst\u00ed, 120 00 Praha 2-Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 Stars | Traditional street food carts next to leafy Charles Square in New Town, loved by local students and office workers. Specializing in freshly fried Czech flatbread (Lango\u0161) and crispy potato pancakes (Brambor\u00e1k)\u2014piping hot with an ultra-crisp exterior, soft interior, and savory garlic sauce that keeps you coming back for more. They also serve Czech-style hot dogs (P\u00e1rky v rohl\u00edku) for a quick on-the-go bite.", "name": "Karlovo N\u00e1m\u011bst\u00ed Food Stalls (St\u00e1nky Karlovo n\u00e1m\u011bst\u00ed)", "transport": "Metro Line B to Karlovo n\u00e1m\u011bst\u00ed station, about a 1-minute walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "\u65b0\u57ce\u5340 (Nov\u00e9 M\u011bsto)"}, "old_town": {"categories": {"cat_1": {"items": [{"address": "Dlouh\u00e1 33, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Renowned as one of Prague\u0027s most authentic Czech pubs, its long corridor-style dining hall stretches dozens of meters and is always packed with enthusiastic patrons. The tavern focuses on daily fresh, additive-free traditional Czech cuisine. Highlights include the \u0027Sv\u00ed\u010dkov\u00e1\u0027 (marinated beef sirloin in creamy vegetable sauce with Czech dumplings), featuring tender meat and a rich sauce balanced with sweet root vegetables and sour cream, paired perfectly with dense dumplings to soak up every drop. Additionally, their golden, crispy \u0027Sma\u017een\u00fd s\u00fdr\u0027 (fried cheese) with a gooey melted center goes fantastically with a freshly poured Pilsner\u2014a beloved combination for locals and tourists alike.", "name": "Lok\u00e1l Dlouh\u00e1\u00e1\u00e1", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station, then walk about 5 minutes."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 1/6, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Situated in the heart of Old Town Square in a former historic mint, this restaurant seamlessly blends classic industrial style with modern aesthetics. The must-try signature dish is the \u0027Pe\u010den\u00e1 kachna\u0027 (Roast Duck), featuring golden, crispy skin and succulent meat that effortlessly slides off the bone. Served alongside tangy red cabbage and two types of traditional dumplings, it offers rich, well-balanced flavors without feeling heavy. Their draft beer is exceptional, poured expertly by bartenders to yield a thick, milky head that seals in the rich malt flavor with every sip.", "name": "Restaurace Mincovna", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk about 3 minutes into Old Town Square."}, {"address": "Valentinsk\u00e1 52/8, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | A hidden gem among locals, students, and office workers, tucked away from the main tourist are. Live accordion performances in the evening add to the vibrant, festive atmosphere.", "name": "Restaurace U Vejvod\u016f", "transport": "Take Metro Line B to M\u016fstek Station, then walk about 4 minutes."}, {"address": "Husova 232/10, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Housed in a 15th-century historic building, this microbrewery and traditional restaurant serves refined takes on classic Czech comfort food. Their slow-cooked pork ribs are basted in a dark beer and honey glaze, roasted until tender enough to fall off the bone with a rich sweet-and-savory finish. Pair them with house-brewed dark lager boasting rich notes of caramel and coffee, alongside their signature roasted sausages\u2014crispy on the outside and tender inside\u2014making it a haven for craft beer and authentic food lovers.", "name": "U T\u0159\u00ed r\u016f\u017e\u00ed", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk about 5 minutes."}, {"address": "V Kolkovn\u011b 910/8, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | As the flagship location of the famous Kolkovna restaurant group, this venue represents the gold standard for blending modern quality with traditional Czech gastronomy. The signature mixed platter featuring roast chicken and pork chops offers charred, crispy skin and juicy, tender meat, complemented by tangy sauerkraut to elevate the meal. With strict pour quality control, their draft beer features a velvety, cream-like foam that locks in hop aromas, making this an ideal spot for classic Czech dishes paired with top-tier Pilsner.", "name": "Kolkovna V Kolkovn\u011b", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk about 6 minutes."}, {"address": "Husova 228/17, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | A legendary pub considered the true heart of Prague\u0027s beer culture, famously visited by former Czech President V\u00e1clav Havel and former US President Bill Clinton. Communal seating creates a vibrant, authentic local atmosphere. The menu sticks to simple classics, headlined by the iconic beer pairing dish \u0027Tatar\u00e1k\u0027 (Beef Tartare). Finely chopped premium beef is mixed with fresh egg yolk, onions, and seasonings, then spread on crunchy fried bread rubbed with fresh garlic cloves\u2014rich, savory, and bursting with flavor. Paired with a flawlessly poured Pilsner Urquell, it\u0027s an absolute classic.", "name": "U Zlat\u00e9ho tygra", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk about 4 minutes."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Michalsk\u00e1 435/19, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | A highly popular brunch spot tucked away in a core alley of Old Town, featuring fresh, healthy, and refined dishes. Highly recommended are the Poached Egg Avocado Toast and French Toast\u2014freshly made with bread that is crispy on the outside and soft inside, paired with rich specialty butter and fresh fruit for a wonderfully layered texture. Bright, modern, and filled with lush greenery, it\u0027s the favorite morning spot for tourists and local youth alike to pair a dish with a rich house-roasted espresso or oat milk latte.", "name": "Bistro Monk", "transport": "Take Metro Line A or B to M\u016fstek station, about a 4-minute walk away."}, {"address": "Koz\u00ed 918/1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | One of Star\u00e9 M\u011bsto\u0027s most iconic American and European bakeries, loved by locals and visitors since opening in 1998. Their sourdough, croissants, and handmade quiches are exceptional\u2014the croissants are delightfully flaky on the outside and airy with buttery goodness on the inside. Brunch features hearty freshly made egg dishes and exquisite cakes, served alongside fragrant, smooth, freshly ground coffee. Perfect for enjoying the lively vibe indoors or taking away for a picnic in Old Town Square.", "name": "Bakeshop", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 6-minute walk away."}, {"address": "Valentinsk\u00e1 56/11, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | A cozy cafe near Charles Bridge that retains a rare, tranquil atmosphere. The interior features a fresh, minimalist wooden aesthetic adorned with green plants, creating an exceptionally comfortable dining space. Must-orders for brunch include the Full English Breakfast and Freshly Baked Waffles\u2014the waffles are lightly sweet, crispy outside and tender inside, served with sweet-and-sour jam or fresh cream. With carefully selected coffee beans and silky, velvety milk foam on lattes, it is very popular among travelers seeking relaxation and a premium brunch experience.", "name": "Mistral Caf\u00e9", "transport": "Take Metro Line A or Tram 2, 17, 18 to Starom\u011bstsk\u00e1 station, about a 2-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 4/1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | A hidden cultural gem of a cafe next to Old Town Square, located on the second floor of a quaint historical building. Bursting with artsy, hipster vibes and offering budget-friendly prices, it serves high-quality single-origin pour-over coffee, specialty cold brews, and house-baked traditional Czech desserts like Lemon Tart and Red Velvet Cake. The moist, perfectly balanced cakes paired with the rich, slightly bitter-sweet dark roast coffee make this the ultimate secret sanctuary to escape the crowds and immerse yourself in Old Town\u0027s serene historical atmosphere.", "name": "Skautsk\u00fd institut v Klementinu", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 3-minute walk to the Old Town Square entrance."}, {"address": "Kaprova 11/12, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | One of the pioneer cafes in Old Town focusing on specialty single-origin coffee. Warm and welcoming, the shop is filled with the rich aroma of freshly ground beans. Highlights include pour-overs and espressos expertly brewed by skilled baristas, offering a well-balanced acidity and sweetness with a lingering finish. Brunch includes freshly pressed panini, bagels, and homemade carrot cake. With crispy panini crusts and gooey melt-in-your-mouth cheese, this quality spot is a must-visit for coffee enthusiasts.", "name": "Caf\u00e9 Ebel", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, Exit 2, about a 1-minute walk."}, {"address": "Liliov\u00e1 250/4, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | A family-run cafe famous for its decadent hot chocolate and exquisite coffee. Instead of using standard cocoa powder, their hot chocolate is melted directly from high-purity, single-origin chocolate beans, delivering a silky, thick, and beautifully bittersweet flavor. For brunch, pair it with freshly baked artisanal croissants and cheese platters; dipping a crispy croissant into the rich hot chocolate is an unforgettable treat highly praised by dessert lovers and tourists.", "name": "Choco Caf\u00e9 U \u010cerven\u00e9 \u017eidle", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Smetanovo n\u00e1b\u0159. 334/4, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | An art and design cafe located along the Vltava River, featuring large floor-to-ceiling windows with panoramic views of Prague Castle and the Castle District. The brunch menu is refined and varied, with Eggs Benedict and Handmade American Pancakes as top recommendations. The poached eggs release golden yolks when sliced, harmonizing beautifully with hollandaise sauce and toasted English muffins. Using high-quality specialty coffee beans with fruity, bright notes, this cafe delivers a delight for both eyes and palate.", "name": "SmetanaQ Caf\u00e9 \u0026 Bistro", "transport": "Take Tram 2, 17, 18 to N\u00e1rodn\u00ed divadlo station, about a 2-minute walk."}, {"address": "Michalsk\u00e1 438/15, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | A trendy brunch hotspot nestled in a bustling Old Town alley, famous for its vibrant and generous modern brunch platters. The immensely popular Savory French Toast comes with bacon, soft-boiled eggs, and house-made sauce, perfectly balancing sweet and savory flavors with a crispy-yet-tender texture; the Chia Oatmeal Bowl offers both health benefits and stunning visual appeal. Using quality local coffee beans with finely frothed cappuccinos, its sunlit decor and warm service keep it consistently at the top of local recommendation lists.", "name": "Venue", "transport": "Take Metro Line A or B to M\u016fstek station, about a 4-minute walk."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Dlouh\u00e1 33, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | This is one of the most popular modern classic pub halls in Prague\u0027s Old Town, famous for its sprawling, long hallway space stretching over a hundred meters. It serves exceptionally fresh, perfectly temperature-controlled Pilsner Urquell tank beer paired with made-to-order traditional Czech comfort food. The must-try signature Goulash features a rich, savory sauce with melt-in-your-mouth beef tenderloin chunks, accompanied by fluffy, juice-absorbing Czech bread dumplings (Knedl\u00edky). Every bite delivers a heartwarming local flavor loved by locals and tourists alike.", "name": "Lok\u00e1l Dlouh\u00e1\u00e1\u00e1", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky station; it is about a 5-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 1/0, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Located next to Old Town Square, Mincovna is housed in a former historic mint, now transformed into a highly rated gastropub that blends traditional Czech cuisine with modern refined style. Their exquisite roasted pork knuckle boasts a golden, crispy skin that crackles with every bite, revealing tender and juicy meat inside. Dipped in house mustard and horseradish, it offers deep layers of flavor. Paired with fresh Czech draught beer to perfectly cut through the richness, it\u0027s the top choice in Old Town for experiencing classic Czech delicacies.", "name": "Restaurace Mincovna", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station; it is about a 3-minute walk."}, {"address": "Ko\u017en\u00e1 488/14, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Tucked away in a narrow alley of Old Town, Mlejnice features rustic, nostalgic decor with wooden beams and farming tools, creating a warm and lively atmosphere. It is best known for its rich garlic beef soup served inside a whole baked loaf of bread, which gets flavorfully chewy as it soaks up the savory broth. Their large roasted pork knee with a crispy charred exterior is a visual highlight, featuring juicy, tender meat infused with deep aromas. It is an extremely popular hot spot in Old Town where reservations are a must.", "name": "Restaurace Mlejnice", "transport": "Take Metro Line A or B to M\u016fstek station; it is about a 4-minute walk."}, {"address": "Koste\u010dn\u00e1 925/4, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Hidden in an Old Town basement, this medieval tavern-style pub features vaulted brick ceilings and dim candlelight, creating a marvelous vintage adventure ambiance. Famous for its open-fire charcoal-grilled meats, the grilled pork ribs are incredibly aromatic, fall off the bone tender, juicy, and infused with rich smoky flavor. Paired with authentic Czech dark beer, it feels like traveling back in time to the Kingdom of Bohemia.", "name": "Kr\u010dma", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station; it is about a 5-minute walk."}, {"address": "Husova 228/17, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | The legendary Golden Tiger is one of Prague\u0027s oldest and most historic Czech beer halls, having hosted iconic figures like Czech literary master Bohumil Hrabal and former US President Bill Clinton. It maintains the vibrant, uninhibited bustle of a traditional pub, serving top-tier freshly poured draught beer alongside classic beer snacks. Highly recommended is the fresh Beef Tartare (Tatar\u00e1k); mixed with egg yolk and seasonings, then spread on toasted bread rubbed with raw garlic, it delivers a zesty, silky flavor rich in local character.", "name": "U Zlat\u00e9ho Tygra", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station; it is about a 4-minute walk."}, {"address": "Husova 232/10, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Situated in a prime location in Old Town, At the Three Roses combines an in-house microbrewery with a traditional Czech pub, housed in a building adorned with antique wall murals. They brew a wide variety of malty, flavor-rich craft beers, perfect when paired with the iconic Czech dish Sv\u00ed\u010dkov\u00e1 (Beef in Cream Sauce). The tender beef is complemented by sweet-and-tart cranberry sauce, whipped cream, and custom dumplings, offering a memorable sweet and savory flavor balance.", "name": "U T\u0159\u00ed r\u016f\u017e\u00ed", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station; it is about a 3-minute walk."}, {"address": "Kamz\u00edkov\u00e1 543/6, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | This elegant and cozy small restaurant exudes the warm charm of old Prague, offering iconic traditional Bohemian dishes. The signature Roasted Duck Leg (Pe\u010den\u00e1 kachna) is slow-roasted at low temperatures for hours, yielding crispy thin skin and tender, juicy duck meat that effortlessly slides off the bone. Served with sweet-and-sour red cabbage and potato dumplings, the refreshing sides balance the rich duck meat perfectly, making it a favorite for travelers who love hearty classic European meals.", "name": "Restaurace U \u010cerven\u00e9ho P\u00e1va", "transport": "Take Metro Line A or B to M\u016fstek station; it is about a 3-minute walk."}, {"address": "Maiselova 60/3, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Hostinec U Pivrnce is famous for its walls covered in humorous satirical cartoons by renowned Czech artist Petr Urban, creating a fun and relaxed atmosphere. The pub serves hearty, authentic Czech traditional dishes and pub snacks, such as classic Fried Cheese (Sma\u017een\u00fd s\u00fdr)\u2014golden and crispy on the outside, gooey and rich on the inside. Served with tartar sauce and a cold Czech draught beer, it is an excellent spot to experience local pub culture.", "name": "Hostinec U Pivrnce", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station; it is about a 2-minute walk."}], "name": "Featured Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "T\u00fdnsk\u00e1 uli\u010dka 1064/6, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | An elegant Feng Shui-themed refined vegetarian restaurant located behind the Church of Our Lady before T\u00fdn. The interior features warm wood and flowing water features, creating a calm and peaceful dining atmosphere. Their signature dish is a vegan twist on traditional Czech Goulash, using high-quality tofu and wild mushrooms to replicate a tender and juicy meat texture, paired with a rich, fragrant red wine paprika sauce and dense, chewy traditional Czech dumplings. Rich, savory, and perfectly seasoned without any unwanted soy flavor, it is immensely popular with both tourists and local vegetarians.", "name": "Maitrea", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk for about 5 minutes; or walk about 2 minutes from Old Town Square."}, {"address": "Bor\u0161ov 280/2, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | A popular plant-based restaurant tucked away in a cobbled lane of the Old Town, featuring an enchanting starry-night interior ceiling. A fan-favorite dish, the \u0027Baked Parmesan with Plant Patties\u0027, is crispy on the outside and soft inside. Every bite bursts with rich melted cheese, nut sauce, and roasted vegetable aromas. Served with smooth, creamy mashed potatoes, it\u0027s hearty, satisfying, and one of the highest-rated trendy vegetarian spots in the Old Town.", "name": "Lehk\u00e1 hlava", "transport": "Take Tram 2, 17, or 18 to Karlovy l\u00e1zn\u011b Station, then walk for about 3 minutes."}, {"address": "Melantrichova 463/15, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | An iconic, long-standing organic vegetarian buffet restaurant in Prague. Operating on a pay-by-weight basis, it offers a wide variety of hot dishes, fresh salads, and whole-wheat baked goods. Must-try plant-based meatballs are firm and bouncy, while roasted root vegetables retain their natural sweetness and slight crunch. Lightly seasoned and guilt-free, it\u0027s the top choice for a quick, healthy, and budget-friendly vegetarian meal while exploring Old Town.", "name": "Country Life Melantrichova", "transport": "Take Metro Line A or B to M\u016fstek Station and walk along Melantrichova Street for about 3 minutes."}, {"address": "T\u00fdnsk\u00e1 1053/19, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | An affordable North Indian-style vegetarian buffet right next to Old Town Square. The menu features various spiced curries, chickpea stews, and freshly baked Indian breads. The piping-hot chickpea curry is rich and velvety, with beans simmered until melt-in-your-mouth tender. Paired with chewy, fresh-baked roti that is crisp on the outside and soft inside, the aromatic spices unfold wonderfully in every bite. Highly popular among students and budget travelers.", "name": "Dhaba Beas T\u00fdnsk\u00e1", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk east from Old Town Square for about 4 minutes."}, {"address": "Veleslav\u00ednova 93/10, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | A trendy, modern vegan fast-food spot bringing a plant-based revolution to classic hearty American comfort food. Highly recommended is the \u0027Vegan American Beef Burger\u0027, featuring a juicy, chewy patty crafted from pea and soy protein, dressed with signature smoky sauce, crunchy pickles, and crispy plant-based bacon. Richly textured and every bit as satisfying as real meat, even non-vegetarians rave about it.", "name": "Forky\u0027s Starom\u011bstsk\u00e1", "transport": "Take Metro Line A or Tram 2, 17, or 18 to Starom\u011bstsk\u00e1 Station, then walk for about 2 minutes."}, {"address": "Dlouh\u00e1 741/39, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | An exquisite raw vegan dessert caf\u00e9 nestled in the Gourmet Passage arcade of Old Town. All menu items are non-heat treated, gluten-free, and contain no refined sugars. The signature \u0027Raw Vegan Chocolate Tart\u0027 features a dense, nutty crust pressed from nuts and dates, filled with a velvety smooth raw chocolate filling that balances bitter and sweet perfectly. The ultimate spot for an indulgent, guilt-free afternoon sweet treat.", "name": "MyRaw Caf\u00e9", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for about 3 minutes."}, {"address": "Karlova 160/8, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | A famous grab-and-go sweet shop located on Karlova Street right next to Charles Bridge. Famous for offering a vegan version of Trdeln\u00edk, the traditional Czech chimney cake. Freshly baked with a golden, crispy outer layer coated in aromatic cinnamon sugar and a soft, fluffy interior, it can be filled with vegan coconut ice cream and fresh strawberries. The warm cinnamon flavor combined with cool, sweet-and-sour ice cream makes it an iconic Old Town street food must-try.", "name": "Good Food Coffee \u0026 Bakery - Vegan Chimney Cake", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station and walk along Karlova Street towards Charles Bridge for about 4 minutes."}, {"address": "N\u00e1m\u011bst\u00ed Republiky 656/8 (OD Kotva 4. patro), 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | A hugely popular Asian vegan buffet inside the Kotva Department Store in Old Town. Offers a wide selection of Asian stir-fries, Vietnamese pho, and crispy plant-based nuggets. The signature crispy plant-based nuggets are golden, crunch-worthy, and non-greasy, paired with juicy interiors, special sweet-and-sour dipping sauce, and chewy vegan stir-fried noodles. Hearty, flavorful, and a favorite among local office workers.", "name": "Loving Hut Kotva", "transport": "Take Metro Line B or Tram 6, 8, 15, or 26 to N\u00e1m\u011bst\u00ed Republiky Station, enter Kotva Department Store, and take the elevator to the 4th floor."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Karlova 160/8, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Located next to the Charles Bridge, this popular spot modernized the traditional Czech chimney cake (Trdeln\u00edk), introducing visually striking black charcoal chimney cakes and spiral ice creams. The outer layer is baked to crisp perfection and rolled in generous cinnamon sugar, while the inside is coated with a thick layer of hazelnut cocoa spread or jam, then filled with rich milk soft-serve ice cream and fresh fruit. Taking a bite offers a delightful hot-and-cold contrast between the chewy, fresh-out-of-the-oven dough and the cool, creamy ice cream. Sweet without being cloying, it\u0027s the number one takeaway treat you shouldn\u0027t miss while strolling through Prague\u0027s Old Town.", "name": "Good Food Creative Trdeln\u00edk (Good Food Coffee \u0026 Bakery)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "Dlouh\u00e1 727/39, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | Located on the famous foodie street Dlouh\u00e1, Krusta Bakery is known for its commitment to hand-kneading dough on-site and traditional charcoal baking. Their traditional chimney cakes have a chewier texture than typical street stalls, with a perfectly caramelized crust that brings out the most authentic wheat and cinnamon aromas. Crispy on the outside and soft on the inside, the chewy dough combines with the rich butter and vanilla fragrance released fresh from the oven, making it a favorite among locals and foodies who love authentic traditional flavors. Savory fillings and traditional Czech pastries are also available, perfect for grab-and-go eating.", "name": "Krusta Traditional Trdeln\u00edk (Krusta Bakery)", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for about 3 minutes."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m., 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | Located in Old Town Square, this traditional open-air charcoal grill stall catches your nose from afar with the mouthwatering scent of smoked meat. The famous Prague Ham (Pra\u017esk\u00e1 \u0161unka) uses large pork hocks slow-roasted over charcoal fires, dripping fat into the embers to release an incredible aroma. Carved to order, the skin is roasted golden and crispy with a hint of smoky char, while the meat inside remains juicy, tender, and savory. Paired with a slice of dark rye bread, sauerkraut, pickles, and a freshly poured Czech beer, it is the ultimate classic street food snack to enjoy while taking in the bustling atmosphere of Old Town Square.", "name": "Old Town Square Prague Ham Stall (Pra\u017esk\u00e1 \u0161unka)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 3 minutes to Old Town Square."}, {"address": "Dlouh\u00e1 727/39, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Hidden away in the Old Town foodie district, this exquisite butcher shop is renowned as a paradise for carnivores in Prague. Besides selling high-quality fresh meats, its made-to-order street food takeaways are wildly popular. The most beloved item, the \u0027Traditional Czech Hot Dog\u0027 (P\u00e1rky v rohl\u00edku), uses sausages made from 100% premium meat. One bite pops the casing open, bursting with delicious, rich juice and smoky flavor. Tucked into a lightly toasted, soft baguette spread with custom mustard, it offers a hearty, multi-layered texture that attracts long lines of food lovers and tourists daily.", "name": "Na\u0161e Maso Gourmet Butchery Street Hot Dog (Na\u0161e Maso)", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for about 3 minutes."}, {"address": "Havelsk\u00e1 13, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Havel\u0027s Market is one of Prague\u0027s oldest open-air markets, hiding several unique Czech street food stalls inside. A must-try here is the freshly fried \u0027Czech Garlic Potato Pancake\u0027 (Brambor\u00e1ky), made by mixing shredded potatoes with minced garlic, oregano, and egg batter, then pan-frying until golden and crispy. Crisp on the outside and tender on the inside, it packs a savory garlic punch. Additionally, market vendors serve freshly brewed mulled wine, various berry tarts, and freshly grilled artisanal sausages, allowing visitors to easily sample authentic Czech street flavors while browsing handicrafts and fresh produce.", "name": "Havel\u0027s Market Czech Street Food Stalls (Havelsk\u00e9 Tr\u017ei\u0161t\u011b)", "transport": "Take Metro Line A or B to M\u016fstek Station, then walk for about 3 minutes."}, {"address": "Melantrichova 471/10, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | Located on the busy Melantrichova thoroughfare in the Old Town, this traditional Czech hot dog kiosk is a go-to spot for local commuters and tourists seeking a quick energy boost. Unlike American hot dogs, the Czech-style hot dog (P\u00e1rky v rohl\u00edku) features a whole roll hollowed out, filled with hot yellow mustard or ketchup, and stuffed with a steaming hot Frankfurters sausage. The bread is fragrant and soft, followed by a juicy sausage that bursts with flavor in your mouth\u2014a perfect balance of savory, sweet, and tangy. Highly convenient to hold without making a mess, it\u0027s a budget-friendly and fantastic bite to experience the local pace of life.", "name": "Melantrichova Street Czech Hot Dog Kiosk (P\u00e1rky v rohl\u00edku)", "transport": "Take Metro Line A or B to M\u016fstek Station, then walk for about 2 minutes."}, {"address": "Ha\u0161talsk\u00e1 757/21, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | Tucked away in a quiet alley of the Old Town, \u0027Pern\u00ed\u010dk\u016fv sen\u0027 (Gingerbread Dream) is a fairytale-like handmade gingerbread specialty shop. Pushing open the door greets you with a warm aroma woven from honey, cloves, cinnamon, and ginger. Following centuries-old traditional recipes, the shop freshly bakes beautiful patterned gingerbread treats daily. The bite falls between a hard cookie and a soft cake, rich and dense in texture, accompanied by the natural sweetness of honey and layered spice notes that aren\u0027t overly sweet. With beautifully detailed packaging, taking a few pieces to eat on the go or as souvenirs offers a deep appreciation for the romantic, ancient charm of Prague\u0027s Old Town.", "name": "Gingerbread Dream Traditional Handmade Gingerbread Shop (Pern\u00ed\u010dk\u016fv sen)", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for
