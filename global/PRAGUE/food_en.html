          "description": "⭐ 4.4 stars | Renowned as one of Prague's most authentic Czech pubs, its long corridor-style dining hall stretches dozens of meters and is always packed with enthusiastic patrons. The tavern focuses on daily fresh, additive-free traditional Czech cuisine. Highlights include the 'Svíčková' (marinated beef sirloin in creamy vegetable sauce with Czech dumplings), featuring tender meat and a rich sauce balanced with sweet root vegetables and sour cream, paired perfectly with dense dumplings to soak up every drop. Additionally, their golden, crispy 'Smažený sýr' (fried cheese) with a gooey melted center goes fantastically with a freshly poured Pilsner—a beloved combination for locals and tourists alike.",

    <script>
        const db = {"castle_district": {"categories": {"cat_1": {"items": [{"address": "Hrad\u010dansk\u00e9 n\u00e1m. 186/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.5 stars | Located in the Salm Palace right in front of Castle Square, Kuchy\u0148 specializes in unique traditional Czech home-style cooking. The highlight here is that guests can walk straight into the kitchen, lift the pot lids, and choose what they\u0027d like to eat! The signature duck leg confit is tender and juicy, falling off the bone with ease. It\u0027s served with sweet-and-sour red cabbage, chewy Czech dumplings (Knedl\u00edky), and a rich savory gravy for a wonderfully layered flavor. Highly praised by both tourists and locals, its elegant outdoor terrace allows you to savor authentic Czech cuisine while taking in panoramic views of Prague\u0027s iconic red-tiled roofs.", "name": "Kuchy\u0148", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad stop, then walk about 5 minutes"}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 stars | Operating since 1965, this legendary pub is steeped in nostalgic Czech charm. It is famous for serving exceptionally fresh, top-tier Pilsner Urquell and Velkopopovick\u00fd Kozel Dark beer. A must-try beer snack is the traditional \u0027Beer Cheese\u0027 (Pivn\u00ed s\u00fdr)\u2014rich cheese mixed with a splash of beer and diced onions, spread over crispy toasted rye bread. Creamy, savory, and subtly infused with malty goodness, it\u2019s a favorite among local connoisseurs and travelers seeking an authentic Czech pub experience.", "name": "U \u010cern\u00e9ho Vola (At the Black Ox)", "transport": "Take Tram 22 to Poho\u0159elec stop, then walk about 3 minutes"}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 601/10, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.7 stars | Located within the historic Strahov Monastery complex, this tavern features cozy stone vaulted ceilings and warm wooden decor. It is best known for its traditional roasted pork knuckle (Pe\u010den\u00e9 vep\u0159ov\u00e9 koleno), featuring golden, crackling skin and tender, juicy meat rich in collagen. Paired with mustard and sauerkraut, it is satisfyingly flavorful without feeling greasy. Paired with their home-brewed St. Norbert beer, the rich malt aroma leaves a lasting impression\u2014making this spot perpetually packed.", "name": "Kl\u00e1\u0161tern\u00ed \u0160enk (Strahov Monastery Restaurant)", "transport": "Take Tram 22 to Poho\u0159elec stop, then walk about 4 minutes"}, {"address": "Nov\u00fd Sv\u011bt 77/3, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.4 stars | Tucked away in the picturesque Nov\u00fd Sv\u011bt (New World) alley in the Castle District, this historic fine-dining restaurant specializes in classic Bohemian court cuisine. The slow-braised venison and game dishes are highly recommended; long-simmered to perfection, the meats are meltingly tender and deep in flavor, paired with rich wild berry sauces and special dumplings for a complex balance of sweet and savory notes. Its elegant, classical interior and refined plating draw gourmets looking for elevated, authentic Czech flavors.", "name": "U Zlat\u00e9 Hru\u0161ky (At the Golden Pear)", "transport": "Take Tram 22 to Brusnice stop, then walk about 3 minutes"}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 4, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.3 stars | Located near Loret\u00e1nsk\u00e9 Square, this warm, rustic restaurant was once an ancient cobbler\u0027s workshop. The kitchen shines with authentic Czech steaks and classic Sv\u00ed\u010dkov\u00e1 (sirloin in cream sauce). The beef is braised until tender enough to melt in your mouth, served with a velvety golden sauce made from root vegetables and cream, topped with a dollop of cranberry sauce and whipped cream. Perfectly balanced between rich, savory, and sweet-tart flavors, it is accompanied by hearty traditional Czech dumplings for genuine Bohemian comfort food.", "name": "U \u0160evce Matou\u0161e (At Cobbler Matou\u0161)", "transport": "Take Tram 22 to Poho\u0159elec stop, then walk about 3 minutes"}, {"address": "\u00davoz 44, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.2 stars | Perched on the slope connecting the Castle and Mal\u00e1 Strana, this historic restaurant features Gothic vaulted ceilings and a warm wooden atmosphere. Their roasted goose leg is particularly celebrated\u2014boasting crispy skin, rich aromatics, and tender, juicy meat. It is served alongside red cabbage and traditional Czech potato pancakes (Brambor\u00e1ky), which are garlicky, crispy on the outside, and soft on the inside. Thanks to its fantastic location and consistently authentic dishes, it is a beloved stop for Castle explorers.", "name": "Restaurace U Labut\u00ed (At the Swans)", "transport": "Take Tram 22 to Poho\u0159elec stop, walk downhill along \u00davoz street for about 4 minutes"}, {"address": "Loret\u00e1nsk\u00e1 108/7, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.1 stars | Situated near Loreta Church, this local-favorite traditional Czech pub serves great-value home-style classics. Their Czech schnitzel (\u0158\u00edzek) features a golden, crispy coating around a thick, juicy pork cutlet that delivers a satisfying crunch in every bite, paired with a refreshing traditional potato salad. The humble and friendly atmosphere perfectly showcases the simple, satisfying soul food of local Czech culinary culture.", "name": "Restaurace U Kanovn\u00edk\u016f", "transport": "Take Tram 22 to Poho\u0159elec stop, then walk about 4 minutes"}, {"address": "Pra\u017esk\u00fd hrad 4. n\u00e1dvo\u0159\u00ed, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.0 stars | Located directly in the 4th Courtyard of Prague Castle, this restaurant occupies a former part of the castle\u2019s defensive bastions. It offers authentic Czech grilled meat platters complete with sausages, smoked pork, and grilled chicken legs. Generous in portion with a rich smoky flavor, the meats are juicy and savory, complemented by refreshing sauerkraut and tangy horseradish sauce. Enjoying a hearty, traditional meal here after touring the majestic castle architecture lets you deeply feel the rich echoes of history.", "name": "Restaurace Na Ba\u0161t\u011b", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad stop, then walk about 2 minutes into the 4th courtyard of the Castle"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "Nov\u00fd Sv\u011bt 2, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.7 stars | Hidden in the most romantic and quiet historic neighborhood of \u0027Nov\u00fd Sv\u011bt\u0027 near the Castle area, this small and exquisite roastery caf\u00e9 is beloved by locals and savvy tourists alike. Featuring carefully selected single-origin beans, their pour-over coffee offers a rich aroma with a perfectly balanced sweetness and acidity. Pair it with homemade banana cake or dense, smooth cheesecake. Brunch features fresh avocado toast and warm oatmeal. Sit in the cozy wooden interior or on the cobblestone street outside to enjoy a peaceful morning away from the castle crowds.", "name": "Kav\u00e1rna Nov\u00fd Sv\u011bt", "transport": "Take Tram 22 to Brusnice station, then walk about 3 minutes."}, {"address": "Ji\u0159sk\u00e1 3, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.5 stars | Situated on the terrace of Lobkowicz Palace within Prague Castle, this caf\u00e9 boasts stunning views overlooking Prague\u0027s red-tiled roofs and the Vltava River. Popular for brunch and afternoon tea, highlights include traditional Czech treats like royal apple strudel served with whipped cream, rich hot chocolate, and freshly made sandwiches. Elegant European palace d\u00e9cor combined with a sun-drenched terrace lets you soak in a grand sense of aristocratic history as you sip your coffee.", "name": "Lobkowicz Palace Caf\u00e9", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, enter Prague Castle, and walk to Lobkowicz Palace on the eastern side."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m. 186/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.4 stars | Located at the entrance of Hrad\u010dany Square, this unique restaurant-caf\u00e9 operated by the famous Ambiente restaurant group is known for its interactive experience of letting guests order directly at the stove. Morning and brunch menus offer delicate Czech-style breakfasts, including rich milk coffee, freshly baked rye bread with house butter and spreads, and traditional warm stews. The expansive outdoor terrace perched high above offers panoramic views of the \u0027City of a Hundred Spires\u0027 while you dine.", "name": "Kuchy\u0148", "transport": "Take Tram 22 to Poho\u0159elec or Pra\u017esk\u00fd hrad station, and walk to the entrance of Castle Square."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 132/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.2 stars | Situated next to Strahov Monastery on the edge of the castle district, the view here is as breathtaking as its name \u0027Bellavista\u0027 suggests. The caf\u00e9 serves a variety of brunch options, including omelets, freshly baked croissants, and a classic English breakfast, paired with quality espresso or fruit-infused teas. Relaxing in the outdoor garden, you can savor crispy-on-the-outside, soft-on-the-inside French toast and rich coffee while taking in sweeping views of the Castle area and St. Vitus Cathedral.", "name": "Caf\u00e9 Bellavista", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 5 minutes into the Strahov Monastery grounds."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 92/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.3 stars | Facing the famous Loreta sanctuary, this caf\u00e9 radiates rustic and romantic Bohemian charm. Brunch features fresh local ingredients, including hot, freshly prepared Eggs Benedict with velvety hollandaise sauce served alongside crispy-crusted Czech bread. The cappuccino here has dense, creamy foam, and in the afternoon, you can hear the delightful chimes from the Loreta clock tower, making it an atmospheric spot to relax near the castle.", "name": "Caf\u00e9 Loreta", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 3 minutes to Loret\u00e1nsk\u00e9 Square."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 109/4, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 stars | Located right next to Loret\u00e1nsk\u00e9 Square, this cozy non-profit caf\u00e9 is dedicated to providing employment opportunities for people with disabilities. The atmosphere is warm and welcoming, offering affordable and high-quality homemade brunch items and pastries. Pressed panini toasts are crispy on the outside and melted with gooey cheese inside, while the homemade carrot cake is moist, rich, and perfectly sweet. Enjoying a rich latte here guarantees a delightful morning while supporting a great local cause.", "name": "Kav\u00e1rna Caf\u00e9 Martin", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 4 minutes."}, {"address": "Star\u00e9 z\u00e1meck\u00e9 schody 6/251, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.5 stars | Situated in St. Wenceslas Vineyard on the southern slope of Prague Castle, this historic villa caf\u00e9 terrace is surrounded by lush green vines. Brunch and afternoon tea menus feature fresh juices, specialty coffee, and exquisite pastries or quiches inspired by the vineyard. Relax under an umbrella with a freshly baked lemon tart and a smooth flat white while enjoying grand, unobstructed views of the city skyline below the castle.", "name": "Villa Richter Terrace", "transport": "Take Metro Line A to Malostransk\u00e1 station, then walk up the Old Castle Stairs (Star\u00e9 z\u00e1meck\u00e9 schody)."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.4 stars | Housed in the historic stone walls of Strahov Monastery, this spot seamlessly blends traditional Czech baking crafts with modern coffee culture. Freshly baked Czech pastries emerge every morning, filling the air with aromas of cinnamon apple bread rolls and rich blueberry tarts. For brunch, try the made-to-order ham and cheese croissants paired with single-origin cold brew. The hearty pastries and rich coffee make this an ideal stop to fuel up before exploring the Castle area.", "name": "Pek\u00e1rna a Kav\u00e1rna Strahov", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 4 minutes into the Strahov Monastery grounds."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Hrad\u010dansk\u00e9 n\u00e1m. 186/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.4 Stars | Situated right beside Prague Castle Square, the defining highlight of this pub-restaurant is that guests can walk straight into the kitchen, lift open heavy pot lids, smell the rich aromas, and choose their dishes directly! Specializing in authentic, slow-stewed Czech home cooking, their signature beef stew (Sv\u00ed\u010dkov\u00e1) features a rich, creamy sauce with hints of sour cream and sweet butter, paired with soft Czech dumplings (Knedl\u00edky) that soak up all the sauce. The melt-in-your-mouth beef delivers a wonderfully complex texture. Combined with an outdoor terrace overlooking stunning views of Prague\u0027s red roofs, it comes highly recommended by both tourists and locals.", "name": "Kuchy\u0148 - Traditional Czech Bistro (Kuchy\u0148)", "transport": "Take Tram 22 to Poho\u0159elec or Pra\u017esk\u00fd hrad station, then walk for about 5 minutes."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 301/10, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.6 Stars | A classic brewery pub with a brewing heritage dating back to the 14th century, famous citywide for its craft St. Norbert (Svat\u00fd Norbert) beer. The roasted pork knuckle (Koleno) here features a crackling, golden-crisp skin and succulent, tender meat that stays wonderfully juicy. Served with sauerkraut and mustard sauce to perfectly balance the richness, pairing it with a glass of smoky, fruity amber dark beer is pure perfection\u2014a heavenly treat beloved by beer lovers and foodies worldwide.", "name": "Strahov Monastery Brewery Restaurant (Kl\u00e1\u0161tern\u00ed pivovar Strahov)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk for about 3 minutes."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 107/1, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.5 Stars | A traditional Czech pub that has maintained the authentic vibe of old Prague for decades, remaining steadfast in its offering of affordable prices and top-tier quality. It serves what is widely considered the best Pilsner Urquell in the Castle District, complete with a dense, creamy foam and a crisp, bittersweet finish. Signature pub snacks include pickled sausage (Utopenec) and beer cheese (Pivn\u00ed s\u00fdr)\u2014a rich, slightly spicy cheese spread onto dark bread for an intensely aromatic bite. It is the ultimate spot to soak in old-school local life and a cozy, tipsy atmosphere.", "name": "At the Black Ox Tavern (U \u010cern\u00e9ho vola)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 4 minutes to Loret\u00e1nsk\u00e9 Square."}, {"address": "Nov\u00fd Sv\u011bt 77/3, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.3 Stars | Tucked away in the quietest, most romantic historic alleyway of the Castle District\u2014the \u0027Nov\u00fd Sv\u011bt\u0027\u2014this historic pub-restaurant offers a refined twist on traditional Czech royal court cuisine. The signature pan-seared duck breast with wild berry sauce features golden, crispy skin and tempting pink, juicy meat infused with subtle woodsmoke aromas, served alongside rich red cabbage for an extraordinary balance of flavors. Its elegant, rustic decor and intimate setting make it a must-visit fine dining venue for couples and connoisseurs.", "name": "At the Golden Pear Fine Czech Bistro (U Zlat\u00e9 hru\u0161ky)", "transport": "Take Tram 22 to Brusnice station, then walk about 3 minutes into the Nov\u00fd Sv\u011bt alleyway."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 302/11, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.1 Stars | Located within the Strahov Monastery grounds, this restaurant boasts a classic dining hall seamlessly blending Gothic and Baroque architectural styles. It specializes in generous portions of traditional game meats and Czech regional specialties\u2014the roasted rabbit and tender pan-seared venison steak come highly recommended. The meat is sweet and firm, drizzled with a rich forest mushroom sauce that offers a distinct earthy aroma and deep flavor. Its elegant vaulted arches and extensive wine collection draw travelers enamored with medieval old-world charm and authentic European game dishes.", "name": "Great Monastery Restaurant (Velk\u00e1 Kl\u00e1\u0161tern\u00ed restaurace)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk for about 3 minutes."}, {"address": "Nov\u00fd Sv\u011bt 2/87, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.7 Stars | Situated in the fairytale-like Nov\u00fd Sv\u011bt neighborhood away from the bustling crowds of the Castle, this charming little bistro-caf\u00e9 prepares daily handmade traditional Czech quiches, rich homemade beef consomm\u00e9, and limited-edition specialty snacks. The quiche features a flaky, buttery crust filled generously with cheese and seasonal vegetables, offering a crispy outer shell and a soft, flavorful center. Paired with carefully selected wines from local boutique wineries, it offers a blissfully relaxing taste of everyday Bohemian life.", "name": "Caf\u00e9 Nov\u00fd Sv\u011bt (Kav\u00e1rna Nov\u00fd Sv\u011bt)", "transport": "Take Tram 22 to Brusnice station, then walk for about 3 minutes."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 92/7, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.2 Stars | Positioned directly across from the famous Loreto Church, this long-standing bistro-restaurant is celebrated for its affordable prices and highly representative traditional Bohemian regional cooking. Don\u0027t miss their signature roasted Bohemian half-duck: the skin is roasted to crisp perfection while the tender meat falls easily off the bone. Paired with sweet-and-sour white cabbage and potato dumplings (Bramborov\u00e9 knedl\u00edky) soaked in rich roasting juices, it is a hearty, deeply satisfying meal that never feels greasy\u2014an authentic taste not to be missed in the Loreto area.", "name": "At the Loreto Restaurant (Restaurace U Lorety)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk about 4 minutes to Loret\u00e1nsk\u00e9 Square."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 109/4, 118 00 Praha 1-Hrad\u010dany", "feature": "\u2b50 4.1 Stars | Housed in the former 18th-century home of a legendary local shoemaker, this building has transformed into a unique Czech steakhouse and regional bistro bursting with historic charm. Their dry-aged Czech ribeye steak and red wine-braised beef knuckle are immensely popular. The beef knuckle is slow-cooked for hours, infusing collagen into the sauce so the meat becomes so ridiculously tender it flakes apart at the touch of a fork. Enveloped in rich sauce and velvety meat, every bite is stunning. Complemented by rustic vaulted brick walls, it creates a cozy, deeply nostalgic historical mood.", "name": "At Shoemaker Matou\u0161 Restaurant (Restaurace U \u0160evce Matou\u0161e)", "transport": "Take Tram 22 to Poho\u0159elec station, then walk for about 4 minutes."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Nerudova 221/36, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.7 stars | Located on the slope leading up to the castle, this is one of Prague\u0027s most popular fully vegan restaurants. The kitchen brilliantly reinterprets heavy, traditional Czech meat dishes into vegan masterpieces. The signature Vegan Goulash and plant-based Sv\u00ed\u010dkov\u00e1 (creamy vegetable sauce served with bread dumplings) are rich, smooth, and full of natural sweetness, easily rivaling meat versions. The rooftop terrace offers stunning views over the Castle District with a fantastic atmosphere.", "name": "Vegans Prague", "transport": "Take Tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 5-minute walk"}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 109/4, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.6 stars | Tucked away near Loreto Square in the Castle District, this peaceful tea house offers an elegant and relaxing vegetarian setting. Highlighting natural and organic light meals, their homemade hummus served with warm pita bread is highly recommended\u2014silky smooth with hints of nutty sesame and bright lemon. The spiced couscous with roasted seasonal vegetables is also wonderfully layered, making it the perfect spot for a light, guilt-free afternoon tea after exploring the castle.", "name": "\u010cajovna na Hrad\u010danech (Hrad\u010dany Tea Room)", "transport": "Take Tram 22 to Poho\u0159elec station, about a 3-minute walk"}, {"address": "Vla\u0161sk\u00e1 358/7, 118 00 Mal\u00e1 Strana, Praha 1", "feature": "\u2b50 4.5 stars | Nestled at the foot of Castle Hill, this cozy bistro is renowned for its diverse, high-quality vegetarian and vegan offerings. A must-try is their vegan beetroot burger\u2014the patty is crafted from beetroot, oats, and fragrant spices, delivering a crispy exterior with a juicy, tender center. Paired with house nut sauce and crispy fries, it\u0027s delightfully satisfying. Their rich and creamy pumpkin coconut soup is another comforting favorite.", "name": "St. Martin Restaurant", "transport": "Take Tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 6-minute walk"}, {"address": "Kanovnick\u00e1 5, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.4 stars | A hidden vegetarian-friendly gem on a quiet street in the Castle District, beloved by local artists and travelers alike. They serve freshly baked vegetarian quiches daily, featuring a buttery, flaky crust stuffed with fresh spinach, wild mushrooms, and plant cheese for a tender, savory filling. Pair it with an oat milk latte and a slice of raw vegan house-baked cake for a perfect slow-paced afternoon in the castle area.", "name": "Bistro Caf\u00e9 U Kanovn\u00edka", "transport": "Take Tram 22 to Brusnice station, about a 4-minute walk"}, {"address": "Z\u00e1meck\u00e9 schody, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.3 stars | A popular sweet snack stall right next to the Castle Stairs, offering dairy- and egg-free vegan chimney cakes (Trdeln\u00edk). The freshly baked dough is charcoal-grilled to golden-crisp perfection, coated in fragrant cinnamon sugar and crushed nuts\u2014crispy on the outside, soft and chewy on the inside. You can customize it with vegan coconut ice cream or fresh berry jam, making it an essential street food snack while taking in panoramic castle views.", "name": "Tradi\u010dn\u00ed Trdeln\u00edk - Z\u00e1meck\u00e9 schody (Traditional Vegan Chimney Cake)", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk up the Castle Stairs"}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m. 186/1, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.5 stars | Situated right at the main entrance square of Prague Castle, Kuchy\u0148 specializes in recreating traditional Bohemian royal pan-cooked dishes. Thoughtfully catering to vegetarians, they offer a traditional wild mushroom soup cooked with a rich vegetable stock, local Bohemian mushrooms, dill, and potatoes\u2014hearty, aromatic, and comforting. Another highlight is the roasted root vegetables served with herb plant butter, beautifully caramelized to retain the veggies\u0027 natural sweetness for an authentic Czech court dining experience.", "name": "Kuchy\u0148", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station, about a 3-minute walk"}, {"address": "Star\u00e9 z\u00e1meck\u00e9 schody 6/251, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.6 stars | A scenic restaurant set within St. Wenceslas Vineyard on the southern slope of the Castle District, serving refined vegetarian cuisine. The signature dish, pan-seared porcini mushroom risotto with truffle and quinoa, features rice simmered in rich vegetable stock and infused with aromatic truffle, paired with juicy, tender porcini mushrooms. Enjoying this delicate meal on the terrace while taking in sweeping views of Prague\u0027s red-tiled roofs makes for a truly romantic experience.", "name": "Caf\u00e9 Villa Richter", "transport": "Take Metro Line A to Malostransk\u00e1 station, walk along the Old Castle Stairs for about 7 minutes"}, {"address": "\u00davoz 169/6, 118 00 Hrad\u010dany, Praha 1", "feature": "\u2b50 4.4 stars | A legendary Bohemian-style cafe perched at the top of the Castle Hill slope, long favored by local writers and intellectuals. They serve several traditional Czech vegetarian options, including a hearty Bohemian lentil soup served with crispy rye bread. It\u0027s thick, fragrant, slightly tangy, and wonderfully energizing. Their pan-fried vegetarian sausages and warm roasted vegetable salad are also popular house favorites with authentic local flavor.", "name": "U Zav\u011b\u0161en\u00fdho Kafe (The Hanging Coffee Bar)", "transport": "Take Tram 22 to Poho\u0159elec station, walk downhill for about 5 minutes"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Vik\u00e1\u0159sk\u00e1 37, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.5 stars | A popular chimney cake stand located right in the Prague Castle district. Made fresh to order, these chimney cakes are coated in fragrant cinnamon sugar and crushed peanuts. Crispy on the outside yet soft and chewy like warm bread on the inside, they can be filled with rich hazelnut cocoa spread or vanilla ice cream. This sweet hot-and-cold treat is a favorite for tourists and locals alike\u2014the perfect hand-held snack while strolling through the castle grounds.", "name": "Castle District Golden Trdeln\u00edk (Tradi\u010dn\u00ed Trdeln\u00edk U Pra\u017esk\u00e9ho Hradu)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station and walk for about 3 minutes."}, {"address": "N\u00e1m\u011bst\u00ed U Svat\u00e9ho Ji\u0159\u00ed, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.3 stars | A star stall at the heart of the St. George\u0027s Square market inside Prague Castle. The main attraction here is authentic Czech grilled sausage (Pra\u017esk\u00e1 klob\u00e1sa), made from a juicy mix of pork, beef, and aromatic spices before being smoked. Sizzling on the flat-top grill, it boasts a crispy, charred skin that bursts with savory, smoky juices at first bite. Served with traditional dark bread, yellow mustard, and sauerkraut, it\u0027s an invigorating local feast when you need a break from walking.", "name": "St. George Market Czech Grilled Sausage Stand (Pra\u017esk\u00e1 Klob\u00e1sa - St. George Market)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station and head into St. George\u0027s Square inside Prague Castle."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m\u011bst\u00ed, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.2 stars | A classic Czech street food stand located right next to the Castle Square viewpoint. They specialize in fresh-fried Czech potato pancakes (Brambor\u00e1k) and fried cheese (Sma\u017een\u00fd S\u00fdr). Packed with garlic and herbs, the potato pancakes are fried to golden perfection, bursting with savory garlic aroma and sweet potato flavors. The fried cheese is crispy on the outside with an irresistibly stretchy, gooey center. Enjoying these hot snacks while overlooking Prague\u0027s sea of red-tiled roofs is a quintessential experience.", "name": "Castle Lookout Fried Cheese \u0026 Potato Pancake Stand (Sma\u017een\u00fd S\u00fdr \u0026 Brambor\u00e1k Stand - Hrad\u010dansk\u00e9 N\u00e1m\u011bst\u00ed)", "transport": "Take Tram 22 to Poho\u0159elec station and walk uphill to Castle Square."}, {"address": "Nerudova 236/11, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.6 stars | Located along Nerudova Street leading up to the castle, this cozy bakery offers mouthwatering traditional Czech hand-held pastries and blueberry tarts (Kol\u00e1\u010de). Their blueberry tart features a rich, flaky crust filled with perfectly sweet-and-sour blueberry jam and topped with a buttery crumble. The buttery aroma wafting from the shop is irresistible\u2014grab a pastry and a hot coffee to enjoy as you walk up the charming cobblestone slopes.", "name": "Krusta Bakery - Nerudova", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk up Nerudova Street for about 5 minutes."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 100/3, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.4 stars | A charming food kiosk situated in front of the Loreto Church plaza, famous for piping hot Czech spiced mulled wine (Sva\u0159\u00e1k) and freshly made crepes (Pala\u010dinky). The mulled wine is simmered with cloves, cinnamon, and citrus peel, making it fruity and comforting. The tender crepes carry a lovely egg flavor and can be filled with homemade strawberry jam or chocolate hazelnut spread. In autumn and winter, it\u0027s a favorite stop for travelers looking to warm both hands and heart.", "name": "Loreto Traditional Mulled Wine \u0026 Crepe Stand (Sva\u0159\u00e1k \u0026 Pala\u010dinky - Loret\u00e1nsk\u00e9 N\u00e1m\u011bst\u00ed)", "transport": "Take Tram 22 to Poho\u0159elec station and walk about 3 minutes to Loret\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 301/10, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.7 stars | A takeout window attached to the Strahov Monastery Brewery at the top of the Castle District. Here, you can grab famous craft beers (St. Norbert) to go alongside quintessential Czech pub snacks like pickled Camembert-style cheese (Hermel\u00edn) and pickled sausages (Utopenci). The soft, creamy pickled cheese is infused with herbs and chili for a rich, smooth flavor. Pairing it with a cold draft beer to-go is an essential way to taste authentic Czech food culture.", "name": "Strahov Monastery Brewery To-Go Window (Strahov Brewery Street Snack Window)", "transport": "Take Tram 22 to Poho\u0159elec station and walk about 5 minutes into the monastery courtyard."}, {"address": "Loret\u00e1nsk\u00e9 n\u00e1m. 107/1, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.5 stars | This historic local pub features a convenient takeaway window serving traditional Czech panini-style pressed sandwiches and sliced Prague ham. The pressed smoked meat and sauerkraut sandwich comes highly recommended\u2014golden toasted bread filled with savory smoked pork and zesty sauerkraut that delivers an explosion of flavor. Affordable, quick, and thoroughly authentic, it\u0027s perfect for travelers on the go who prefer not to sit down for a long meal.", "name": "U \u010cern\u00e9ho Vola Takeaway Window - Pressed Sandwiches \u0026 Cold Cuts", "transport": "Take Tram 22 to Poho\u0159elec station and walk for about 4 minutes."}, {"address": "Zlat\u00e1 uli\u010dka u Daliborky, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.1 stars | A charming wooden snack kiosk located near the exit of Golden Lane in Prague Castle. It sells beautifully decorated Czech handmade gingerbread and hot, steamed sausages (Pra\u017esk\u00e9 p\u00e1rky). The sausages have a satisfying snappy casing and rich, juicy meat, while the gingerbread features deep honey and ginger notes with a firm, rewarding texture. A delicious quick bite to enjoy after exploring Golden Lane.", "name": "Golden Lane Gingerbread \u0026 Hot Dog Kiosk (Zlat\u00e1 Uli\u010dka Gingerbread \u0026 Hot Dog Kiosk)", "transport": "Take Tram 22 to Pra\u017esk\u00fd hrad station and enter the Golden Lane area inside Prague Castle."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "\u57ce\u5821\u5340 (Hrad\u010dany)"}, "jewish_quarter": {"categories": {"cat_1": {"items": [{"address": "V Kolkovn\u011b 910/8, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.4 stars | As Pilsner Urquell\u0027s famous first flagship concept restaurant, V Kolkovn\u011b serves exceptionally authentic, classic Czech dishes. A must-order is the roasted pork knuckle\u2014golden and crispy on the outside, succulent and tender on the inside, with a caramelized skin and rich collagen, served alongside sauerkraut and horseradish for a thoroughly satisfying feast. Additionally, the beef goulash features a rich, savory sauce, accompanied by melt-in-your-mouth bread dumplings (Knedl\u00edky) that soak up all the broth, making it a favorite among both locals and tourists.", "name": "V Kolkovn\u011b", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 5 minutes."}, {"address": "Maiselova 62/18, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.1 stars | Named after Prague\u0027s legendary Jewish creature \u0027Golem\u0027, this traditional restaurant is nestled in the heart of the Jewish Quarter. Blending Eastern European Jewish flavors with classic Czech cuisine, its signature roasted duck leg boasts crisp skin and tender meat, complemented by red cabbage and homemade dumplings for a rich multi-layered taste. Decorated in an antique style with a mysterious medieval ambiance, it is a fantastic spot to experience local folklore and traditional gastronomy.", "name": "Restaurace U Golema", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 3 minutes."}, {"address": "\u0160irok\u00e1 55/8, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.3 stars | Prague\u0027s oldest and most iconic strictly Kosher restaurant, located right next to the Jewish Cemetery and Old-New Synagogue. The restaurant specializes in high-quality traditional Central and Eastern European Jewish cuisine, such as chicken soup with handmade Matzo balls featuring a rich, flavorful broth. The roasted duck and traditional beef dishes are exquisitely tender and aromatic, making it a beloved destination for food enthusiasts worldwide seeking authentic Jewish gastronomy and fine traditional dining.", "name": "Restaurant King Solomon", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 4 minutes."}, {"address": "Koste\u010dn\u00e1 925/4, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.6 stars | Tucked away on the edge of the Jewish Quarter, this cellar restaurant features centuries-old stone walls and romantic candlelight, transporting diners back to the Middle Ages. Its open-fire grilled pork ribs are charred on the outside, juicy on the inside, and infused with a rich smoky flavor. The traditional Czech grilled sausages have a snappy casing, perfectly paired with house mustard and dark beer for a hearty bite. Locals and travelers flock here to enjoy this rustic, vibrant, and authentic Czech culinary experience.", "name": "Restaurace Kr\u010dma", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 6 minutes."}, {"address": "B\u00edlkov\u00e1 861/14, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.2 stars | A highly popular, authentic Kosher grill spot in the Jewish Quarter offering traditional Jewish dishes infused with Mediterranean and Middle Eastern influences. Freshly grilled beef and lamb skewers are wonderfully aromatic, tender, and juicy with a delicate char. Served with smooth, creamy hummus and freshly baked, soft pita bread, the meal is refreshing and gratifying\u2014making it a favorite among travelers adhering to dietary practices and seeking authentic flavors.", "name": "Chabad Grill Prague", "transport": "Take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station and walk for about 3 minutes."}, {"address": "U Milosrdn\u00fdch 12, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.7 stars | Awarded a Michelin star, Field Restaurant seamlessly merges traditional Czech farm ingredients with modern, top-tier culinary technique. The chef reinvents classic Czech cuisine using ultra-fresh local produce; signature game meats and foie gras dishes offer sophisticated textures with smooth, intensely flavorful sauces. Artfully presented like fine artworks, the meals embody both a traditional soul and modern flair, making this the premier venue in the Jewish Quarter for sophisticated, newly interpreted classic cuisine.", "name": "Field Restaurant", "transport": "Take Tram 17 to Dlouh\u00e1 t\u0159\u00edda station and walk for about 5 minutes."}, {"address": "Eli\u0161ky Kr\u00e1snohorsk\u00e9 2/10, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.6 stars | A long-established, top-tier Continental restaurant in the Jewish Quarter committed to sourcing fresh ingredients directly from local farms. Its popular pan-seared veal and roasted seafood dishes feature incredibly tender meat locked with natural juices, paired with specialty herb sauces and velvety mashed potatoes for an elegant taste. With a warm, sophisticated ambiance and high culinary standards, it remains a beloved classic destination for local celebrities and gourmets alike.", "name": "La Veranda", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 5 minutes."}, {"address": "Koz\u00ed 918/1, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.4 stars | The most prestigious traditional European bakery and pastry shop in Prague\u0027s Jewish Quarter, greeting visitors with rich aromas of butter and wheat upon entry. Specializing in daily fresh handcrafted traditional Czech desserts and European pastries, their classic cinnamon sourdough bread is crispy outside, soft inside, and increasingly fragrant as you chew. Cheese tarts and traditional fruit pies are perfectly sweetened with flaky, sturdy crusts, enticing countless locals and tourists for a relaxing, authentic traditional afternoon tea.", "name": "Bakeshop", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 5 minutes."}], "name": "Local Traditional Famous Restaurants"}, "cat_2": {"items": [{"address": "Koz\u00ed 918/1, 110 00 Josefov, Czechia", "feature": "\u2b50 4.5 stars | Located in the heart of the Jewish Quarter, this famous American and European bakery-cafe is renowned for its fresh daily artisanal pies, sourdough bread, and exquisite pastries. Their French croissants are delightfully flaky with a rich buttery aroma, amazing with every crispy bite. Paired with a rich espresso, it\u0027s a top choice for tourists and locals alike seeking a refined brunch.", "name": "Bakeshop Praha", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 6-minute walk."}, {"address": "V\u011bze\u0148sk\u00e1 918/6, 110 00 Josefov, Czechia", "feature": "\u2b50 4.6 stars | Tucked away in the classical alleys of the Jewish Quarter, this hidden gem caf\u00e9 is filled with elegant, romantic French floral decorations. It offers high-quality specialty pour-over coffee and exquisite brunch platters. The richly layered avocado toast with freshly made poached eggs served on sourdough bread\u2014crispy on the outside and soft inside\u2014delivers a visual and flavor delight as the creamy yolk runs.", "name": "Caf\u00e9 Fleur", "transport": "Take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta Station, about a 3-minute walk."}, {"address": "Ha\u0161talsk\u00e1 1072/1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | A highly popular pancake specialty shop near the Jewish Quarter, famous for its made-to-order fluffy American-style thick pancakes. Whether it\u0027s the savory smoked salmon cream cheese pancake or the sweet custard berry pancake, they melt in your mouth with a moist, soft texture. Paired with a carefully crafted latte, it\u0027s a famous hotspot drawing eager crowds of tourists.", "name": "Den Noc", "transport": "Take Metro Line B to N\u00e1m\u011bst\u00ed Republiky Station, about a 7-minute walk."}, {"address": "J\u00e1chymova 63/3, 110 00 Josefov, Czechia", "feature": "\u2b50 4.4 stars | A trendy caf\u00e9 combining literary vibes with the rich history of the Jewish Quarter, seamlessly merging an independent bookstore with specialty coffee. It serves high-quality espresso drinks and local traditional Czech homemade pastries. The cakes are rich and perfectly balanced in sweetness. With a quiet, elegant, and artsy ambiance, it is an ideal resting spot for travelers who love peaceful corners.", "name": "Kafky \u0026 Co.", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 3-minute walk."}, {"address": "Kaprova 42/11, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | A cozy, long-standing caf\u00e9 located on the edge of the Jewish Quarter, roasting its own high-quality single-origin coffee beans since the 1990s. The cheesecake is creamy and smooth, while the gooey melted cheese in their grilled paninis offers an irresistible aroma. The coffee finishes with rich nutty and chocolaty notes, making it a favorite among those who adore Old Prague charm.", "name": "Caf\u00e9 Ebel", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 1-minute walk from the exit."}, {"address": "Michalsk\u00e1 440/20, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | A stylish, modern bistro near the Jewish Quarter, known for its creative and healthy all-day brunch. Their classic Eggs Benedict, topped with signature hollandaise sauce and crispy bacon, offers rich textures and a creamy aroma. Paired with freshly squeezed juice or a specialty oat milk latte, it provides a vibrant burst of energy to start your morning.", "name": "Bistro Monk", "transport": "Take Metro Line A or B to M\u016fstek Station, about a 4-minute walk."}, {"address": "Valentinsk\u00e1 56/11, 110 00 Josefov, Czechia", "feature": "\u2b50 4.3 stars | A charming brunch spot located on Valentinsk\u00e1 Street in the Jewish Quarter, specializing in freshly baked Belgian-style waffles and specialty coffee. The waffles are golden and crispy on the outside with a chewy center, drizzled with rich Czech honey or special hazelnut cocoa sauce that is deliciously sweet without being overpowering. Its playful decor and great flavors come highly recommended by young travelers and families alike.", "name": "Coffee \u0026 Waffles", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 2-minute walk."}, {"address": "Michalsk\u00e1 438/15, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | A highly popular and trendy brunch spot near the Jewish Quarter, focusing on artisanal brunch dishes that incorporate traditional ingredients into modern cooking. The French toast and pulled pork burger are highly recommended\u2014the French toast soaked in egg custard is seared until soft and caramelized, while the pulled pork is juicy and flavorful. Generous portions and exquisite presentation keep foodies coming back for more.", "name": "Venue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, about a 5-minute walk."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "\u0160irok\u00e1 55/8, 110 00 Josefov, Czechia", "feature": "\u2b50 4.5 stars | As the oldest and premier Glatt Kosher restaurant in Prague\u0027s Jewish Quarter, King Solomon is famous for its strictly selected high-quality ingredients. Its signature roasted duck features crispy skin and tender meat, paired with traditional Jewish rye bread and sweet gravy, creating a rich yet non-greasy profile. The beef goulash is melt-in-your-mouth tender, packed with rich aromatics and warm homemade flavors. The elegant and solemn interior is steeped in deep Jewish history, making it a favorite among food lovers who appreciate history and authentic Kosher cuisine.", "name": "King Solomon Kosher Restaurant", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 3 minutes."}, {"address": "B\u00edlkova 855/12, 110 00 Josefov, Czechia", "feature": "\u2b50 4.4 stars | Combining a modern vibe with strict traditional Kosher standards, this specialty bistro is one of the rare spots in the Jewish Quarter offering full meat dishes paired with Kosher beer. The grilled beef skewers and Middle Eastern hummus are crowd favorites\u2014the hummus boasts an incredibly smooth, creamy texture drizzled with fine olive oil and spices, served alongside fresh, hot pita bread that is delightfully chewy with a pure wheat aroma. Tourists love the warm, lively service and the bright, comfortable dining environment.", "name": "Dinitz Kosher Restaurant", "transport": "Take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station, then walk for about 4 minutes."}, {"address": "V Kolkovn\u011b 910/8, 110 00 Josefov, Czechia", "feature": "\u2b50 4.3 stars | Located in the heart of the Jewish Quarter, this is the flagship restaurant of Pilsner Urquell. It serves authentic, hearty traditional Czech feasts, featuring the iconic roasted pork knee with a golden, crispy skin that crackles with every bite. The meat inside is succulent and flavorful, perfectly balanced by horseradish and sauerkraut. Paired with a freshly poured, foamy draft beer, it brilliantly encapsulates Czech nightlife and culinary soul.", "name": "Restaurace V Kolkovn\u011b", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "Maiselova 62/18, 110 00 Josefov, Czechia", "feature": "\u2b50 4.1 stars | A traditional tavern themed around the legendary Jewish creature, the Golem. The interior feels like a mystical medieval cellar. The menu highlights regional dishes fusing Czech tradition and Jewish flavors, with a strong recommendation for the beef goulash served with traditional Czech bread dumplings (Knedl\u00edky). The tender, fall-off-the-bone beef is rich in aroma, while the fluffy dumplings soak up every bit of the thick sauce. Pair it with a smooth local dark beer featuring subtle caramel notes\u2014it\u0027s the best place to experience the legends and cuisine of the Jewish Quarter.", "name": "Restaurace U Golema", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 3 minutes."}, {"address": "Eli\u0161ky Kr\u00e1snohorsk\u00e9 10/2, 110 00 Josefov, Czechia", "feature": "\u2b50 4.6 stars | Tucked away in a charming neighborhood of the Jewish Quarter, this modern bistro features French-Czech fusion cuisine made with organic ingredients sourced from local farms. The slow-cooked lamb shoulder is remarkably delicate, tender, and flavor-rich, perfectly complemented by smooth mashed potatoes and sweet seasonal produce. Every bite offers a dual delight for both sight and palate. The romantic, cozy ambiance is ideal for travelers seeking an elegant and relaxing meal amid the bustling quarter.", "name": "La Veranda", "transport": "Take Tram 17 to Starom\u011bstsk\u00e1 station, then walk for about 4 minutes."}, {"address": "B\u0159ehov\u00e1 208/8, 110 00 Josefov, Czechia", "feature": "\u2b50 4.2 stars | This cozy small eatery combines Kosher bakery treats with traditional home-cooked dishes, renowned for its freshly baked Challah and Mediterranean stews. The Challah features a golden crispy crust and a pillowy, marshmallow-soft interior with a subtle sweet eggy aroma. Paired with aromatic Shakshuka, the tangy tomato sauce blends effortlessly with runny egg yolks, making it irresistibly delicious. Many visitors praise the friendly, home-like service and welcoming atmosphere.", "name": "Shelanu Kosher Restaurant \u0026 Bakery", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 4 minutes."}, {"address": "U Milosrdn\u00fdch 12, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | A Michelin-starred fine dining establishment located on the edge of the Jewish Quarter, celebrated for transforming traditional Czech farm ingredients into high-end modern culinary masterpieces. Its signature duck liver and wild mushroom dish seamlessly merges earthy aromas with a buttery rich texture, melting in your mouth with an enduring finish. Paired with curated local wines, the dining experience is truly sensational. Emphasizing uninhibited, natural flavors, it is adored by food lovers seeking the ultimate gourmet journey.", "name": "Field Restaurant", "transport": "Take Tram 17 to Dlouh\u00e1 t\u0159\u00edda station, then walk for about 5 minutes."}, {"address": "U Milosrdn\u00fdch 848/6, 110 00 Josefov, Czechia", "feature": "\u2b50 4.3 stars | An authentic Kosher grill restaurant operated by the Jewish community, specializing in aromatic charcoal-grilled meats and Middle Eastern mezze. The charcoal-grilled chicken skewers are charred on the outside, tender on the inside, locking in rich juices alongside subtle notes of cumin and coriander. Served with a variety of freshly pickled sides and traditional hummus, the layered flavors make for a memorable feast. It is the perfect spot to experience contemporary Jewish food culture and a hearty meat banquet.", "name": "Chabad Grill Kosher Restaurant", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Koz\u00ed 857/1, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.4 stars | A classic organic vegetarian buffet in the heart of the Jewish Quarter. Founded in 1991, it is a pioneer in promoting healthy plant-based eating in Prague. Operating on a pay-by-weight system, it offers a rich variety of international vegetarian dishes, such as savory baked tofu, fresh mixed salads, hummus, and enticing homemade whole-wheat bread. Its signature plant-based cutlet is crispy on the outside and tender inside, served with a rich herb sauce that completely overturns the stereotype of bland vegetarian food. With a cozy and natural environment, it is deeply loved by health-conscious local workers and international travelers alike.", "name": "Country Life - Koz\u00ed (Jewish Quarter)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "B\u00edlkova 855/19, 110 00 Josefov, Praha 1", "feature": "\u2b50 4.5 stars | Tucked away on a quiet street corner in the Jewish Quarter, this 100% vegan Asian restaurant specializes in fusion dishes free of eggs and dairy. The popular signature dish, \u0027Vegan Pho,\u0027 features a clear, refreshing broth slow-simmered for hours with fresh vegetables and spices, paired with chewy rice noodles and pan-fried mock meat for rich layered flavors. Another favorite, the \u0027Crispy Vegan Spring Rolls,\u0027 boasts a golden crunchy shell filled with sweet cabbage and wood ear mushrooms\u2014light, non-greasy, and a top budget-friendly culinary choice in the Jewish Quarter.", "name": "Loving Hut - B\u00edlkova", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 6 minutes."}, {"address": "T\u00fdnsk\u00e1 uli\u010dka 1064/6, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Located just east of the Jewish Quarter, this Feng Shui-themed vegetarian restaurant is renowned for its exquisite Oriental Zen decor and dreamy water features. The chef skillfully transforms traditional Czech dishes into fully vegan versions; the \u0027Vegan Czech Goulash Style Rice\u0027 is especially recommended, made with premium wheat gluten and rich mushrooms served in a flavorful red wine and paprika sauce. Paired with house-made raw strawberry tart and herbal tea, it offers a truly relaxing and delightful dining atmosphere.", "name": "Maitrea Vegetarian Restaurant", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 4 minutes."}, {"address": "T\u00fdnsk\u00e1 1053/19, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | Just a few steps from the Jewish Quarter, this is a highly popular North Indian vegetarian buffet in Prague. The restaurant serves freshly prepared Indian curries, basmati rice, chickpea soup (Dal), and freshly baked naan every day. Their \u0027Vegetable Masala Curry\u0027 features a rich texture and deeply layered spices, lightly spicy with a touch of sweet coconut milk\u2014perfect when paired with fluffy turmeric rice. Special discount hours before dinner draw countless backpackers and locals for a satisfying feast.", "name": "Dhaba Beas - T\u00fdnsk\u00e1", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 5 minutes."}, {"address": "Veleslav\u00ednova 93/10, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | A modern vegan American fast-food spot located near the entrance to the Jewish Quarter that completely transforms the perception of plant-based dining. Their flagship \u0027Cheez Burger\u0027 uses a 100% plant protein patty, grilled at high heat to be juicy and flavorful with an inviting smoky aroma, topped with melted vegan cheese and special house sauce for a hearty bite remarkably close to real meat. Paired with crispy, sweet fresh-cut sweet potato fries, it\u0027s the ultimate quick energy fix while exploring the area.", "name": "Forky\u0027s - Veleslav\u00ednova", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station (Exit 1), then walk for about 1 minute."}, {"address": "Dlouh\u00e1 727/39 (Gourmet Pas\u00e1\u017e), 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Located inside Gourmet Pas\u00e1\u017e on the border of the Jewish Quarter, this cafe specializes in raw vegan treats and light meals prepared below 42\u00b0C. The signature \u0027Raw Pistachio Cheesecake\u0027 contains no flour or refined sugar; built on a crushed nut crust, the filling is rich, smooth, and naturally sweet with a nutty aroma. Paired with a quality oat milk latte, it is an absolute hidden gem for vegan dessert lovers.", "name": "MyRaw Caf\u00e9", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for about 3 minutes."}, {"address": "Karlova 160/8, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Located near the southern edge of the Jewish Quarter, this shop elevates Prague\u0027s most iconic street dessert, the chimney cake (Trdeln\u00edk), to a brand new vegan dimension. Its specially crafted vegan dough is roasted on spit rollers until golden and crispy outside while remaining cloud-soft inside, dusted generously with cinnamon sugar. The signature \u0027Vegan Chimney\u0027 is filled with vegan coconut ice cream and fresh berries\u2014a delicious contrast of hot and cold, sweet and tangy that makes it a must-try street treat.", "name": "Good Food Coffee \u0026 Bakery (Vegan Chimney Cake)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 3 minutes."}, {"address": "Dlouh\u00e1 727/39, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.2 stars | A popular bistro near the Jewish Quarter that gives traditional Czech open-faced sandwiches (Chleb\u00ed\u010dky) a modern vegetarian twist. The most popular option, the \u0027Vegan Beetroot Spread with Walnut Chleb\u00ed\u010dek,\u0027 features a fragrant sourdough bread base topped with smooth beetroot puree and crunchy walnuts, delivering a refreshing balance of flavors and artful presentation. It offers vegans an authentic taste of Czech light dining culture.", "name": "Sisters Bistro v Dlouh\u00e9", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda Station, then walk for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "\u0160irok\u00e1 12, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.3 stars | A classic walking dessert you can\u0027t miss when visiting Prague\u0027s Jewish Quarter! The freshly baked cinnamon chimney cake (Trdeln\u00edk) features a caramelized, crispy outer shell coated in sweet sugar and aromatic cinnamon, while the inside remains pillowy soft. You can enjoy it drizzled with rich hazelnut chocolate sauce or filled to the brim with fresh milk ice cream. The delightful interplay of hot and cold melts on your tongue with overflowing sweet aromas, making it a beloved street treat held by almost every tourist exploring the ancient lanes of the Jewish Quarter.", "name": "Classic Crispy \u0026 Soft Chimney Cake Kiosk (Trdeln\u00edk Kiosk \u0160irok\u00e1)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 3 minutes."}, {"address": "\u0160irok\u00e1 6, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.4 stars | Located in the Jewish Quarter, this classic local delicatessen offers authentic traditional Czech open-faced sandwiches (Chleb\u00ed\u010dky). Freshly baked baguette slices are spread with a thick layer of creamy potato salad, then layered with tender slices of ham, hard-boiled eggs, and pickles. Each bite offers rich layers where savory ham perfectly blends with refreshing potato salad. With a slightly crispy crust and soft bread center, this delicious and affordable spot is loved by both local office workers and tourists eager to experience genuine Czech food culture.", "name": "Libe\u0159sk\u00e9 Lah\u016fdky Traditional Czech Open-Face Sandwiches (Libe\u0159sk\u00e9 Lah\u016fdky \u0160irok\u00e1)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 2 minutes."}, {"address": "Koz\u00ed 1, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.5 stars | A famous bakery located in the heart of the Jewish Quarter, renowned for its exquisitely handcrafted baked goods. Popular street-style takeaway items include golden, flaky French quiches and American-style cinnamon rolls. The quiche has a buttery, layered crust packed with rich egg flavor, spinach, and savory bacon served hot and smooth; the sweet cinnamon rolls are pleasantly dense and chewy, coated in thick icing and fragrant cinnamon. It\u0027s the perfect energy-boosting grab-and-go option while strolling through the Jewish Quarter.", "name": "Bakeshop Artisanal European Bakery \u0026 Quiches (Bakeshop Prague)", "transport": "Take Tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta stop and walk for about 4 minutes."}, {"address": "Dlouh\u00e1 39, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.6 stars | A premier butcher shop located on Dlouh\u00e1 Street at the edge of the Jewish Quarter, famous for serving extraordinarily fresh Czech meat delicacies. Their most popular takeaway street bites include made-to-order beef tartare served with crispy garlic toast and juicy, freshly grilled traditional Czech sausages. The sausage casing is grilled to a satisfying, juicy snap, enclosing firm, flavorful, heavily smoked meat. Paired with tangy yellow mustard, it leaves an unforgettable impression, drawing foodies from all across Europe to queue up.", "name": "Na\u0161e Maso Gourmet Butcher Shop (Na\u0161e Maso)", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda stop and walk for about 3 minutes."}, {"address": "Dlouh\u00e1 39, 110 00 Praha 1-Star\u00e9 M\u011bsto", "feature": "\u2b50 4.5 stars | A stylish bistro specializing in modern, creative versions of Czech open-faced sandwiches (Chleb\u00ed\u010dky). The most eye-catching offering is the smoked salmon with beetroot spread sandwich: soft and chewy bread topped with ultra-smooth spread, sweet-and-sour pickled veggies, and fresh herbs. It\u0027s refreshing, light, and wonderfully textured. Combining visual elegance with authentic taste, it\u0027s a must-try street eat for light-meal lovers and photo enthusiasts visiting the Jewish Quarter.", "name": "Sisters Bistro Modern Czech Open-Face Sandwiches (Sisters Bistro v Dlouh\u00e9)", "transport": "Take Tram 6, 8, 15, or 26 to Dlouh\u00e1 t\u0159\u00edda stop and walk for about 3 minutes."}, {"address": "U Milosrdn\u00fdch 6, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.2 stars | An authentic Kosher street food spot tucked away in the alleys of the Jewish Quarter. The most popular grab-and-go favorites here are piping-hot made-to-order Falafel Pitas and Shawarmas. The freshly fried falafels are golden and crispy outside, soft and filled with aromatic herbs inside, paired with creamy tahini sauce and crisp fresh salad wrapped in a chewy pita. Extremely satisfying in every bite, it\u0027s an excellent choice for experiencing the unique culinary culture of the Jewish Quarter.", "name": "Chabad Kosher Grill \u0026 Street Food Takeaway", "transport": "Take Tram 17 to Pr\u00e1vnick\u00e1 fakulta stop and walk for about 5 minutes."}, {"address": "Maiselova 15, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.1 stars | A classic street food stall located right next to the synagogue, specializing in piping-hot traditional Czech potato pancakes (Brambor\u00e1ky) and grilled sausages. The potato pancakes are seasoned with plenty of minced garlic and marjoram, pan-fried to a golden crisp on both sides that crunch with every bite, revealing a soft, savory interior full of garlic aroma. Paired with a freshly grilled sausage, it radiates cozy Bohemian street food charm, making it a comforting popular snack during cold winter days or a quick walk-by treat.", "name": "Prague Sausage \u0026 Potato Pancake Stall (Pra\u017esk\u00e1 Klob\u00e1sa \u0026 Brambor\u00e1k Stall Maiselova)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 3 minutes."}, {"address": "\u0160irok\u00e1 9, 110 00 Praha 1-Josefov", "feature": "\u2b50 4.3 stars | A fresh cr\u00eape and artisanal gelato stand located on \u0160irok\u00e1 Street in the Jewish Quarter. Their signature made-to-order French cr\u00eapes feature crisp, caramelized edges filled with warm caramelized apples or rich chocolate hazelnut spread, offering a soft, sweet treat with every bite. In summer, pair it with a scoop of artisanal gelato\u2014smooth, rich, and perfectly sweet\u2014making it a favorite walking dessert for tourists after exploring the Jewish Museum.", "name": "Jewish Quarter Cr\u00eaperie \u0026 Gelato Stand (Cr\u00eaperie \u0026 Gelato Josefov)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station and walk for about 3 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "\u7336\u592a\u5340 (Josefov)"}, "lesser_town": {"categories": {"cat_1": {"items": [{"address": "Thunovsk\u00e1 178/10, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.6 stars | Hidden in a quiet alley of Mal\u00e1 Strana, \u0027Restaurace U Hrocha\u0027 is a legendary beer sanctuary for local Praguers and beer connoisseurs. It retains an extraordinarily cozy, down-to-earth traditional Czech pub charm, with vaulted ceilings and long wooden tables evoking a rich sense of history. The pub\u0027s top attraction is its exquisitely fresh, velvety-foamed Pilsner Urquell, paired perfectly with signature roasted pork knuckle and pickled cheese (Nakl\u00e1dan\u00fd Hermel\u00edn). The pork knuckle features crackling, ultra-crispy skin that crunches with every bite while the meat stays tender and juicy. The pickled cheese offers a rich, creamy flavor with a subtle hint of spice, spreading smoothly over dark rye bread. Both tourists and locals love the uninhibited, cheerful atmosphere and unbeatable value.", "name": "Restaurace U Hrocha (The Hippo Pub)", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 3 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 266/5, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.5 stars | Boasting over 700 years of history, \u0027Restaurace U Glaubic\u016f\u0027 is located in the heart of Lesser Town Square, featuring preserved medieval cellar architecture below ground. It is famous for serving some of the most reasonably priced yet finest quality freshly poured Pilsner beer in all of Prague. The must-try traditional Czech Goulash features a rich, savory gravy paired with soft yet chewy Czech bread dumplings (Knedl\u00edky) that melt in your mouth after soaking up the rich beef essence. The roasted duck meal is equally impressive with crispy skin, tender meat, and sauerkraut that nicely cuts through the richness. Its stunning historic cellar vibe and incredible affordability make it a top pick for experiencing authentic Czech culinary culture.", "name": "Restaurace U Glaubic\u016f", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 1 minute."}, {"address": "Nebovick\u00e1 460/6, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.5 stars | Tucked away in a peaceful alley of Mal\u00e1 Strana, \u0027U Modr\u00e9 Kachni\u010dky\u0027 is a premier establishment for sampling refined traditional wild game and classic Czech cuisine. The interior is decorated in 1930s retro luxury, with crystal chandeliers and antique furniture weaving a warm, elegant atmosphere. The signature roasted duck features temptingly crisp golden skin and succulent, never-dry meat, served with a special cranberry sauce and two-color sauerkraut that harmoniously blend sweet, savory, and tangy notes. Traditional venison and wild boar chops are equally hearty and robust with complex sauces, making it perfect for foodies who appreciate authentic, old-world Czech recipes.", "name": "U Modr\u00e9 Kachni\u010dky (At the Blue Duckling)", "transport": "Take Tram 12, 15, 20, or 22 to Hellichova stop, then walk about 2 minutes."}, {"address": "Tr\u017ei\u0161t\u011b 23, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.4 stars | Tucked behind the steep alleys of Mal\u00e1 Strana, \u0027Bar\u00e1\u010dnick\u00e1 Rychta\u0027 is a hidden-gem old-school Czech restaurant where you can escape the crowds. Once a local neighborhood association hall, it boasts nostalgic wooden decor and historic murals. Their Czech pork ribs and garlic soup (\u010cesne\u010dka) come highly praised. The hot, spicy garlic soup with crunchy croutons and melted cheese instantly warms you up from head to toe. The signature roasted pork ribs are glazed with honey and dark beer sauce, baked until the meat falls effortlessly off the bone\u2014tender inside, flavorful outside, and perfectly balanced between sweet and savory.", "name": "Bar\u00e1\u010dnick\u00e1 Rychta", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 4 minutes."}, {"address": "\u0160porkova 521/5, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.6 stars | Located halfway up the hill leading to Prague Castle in Mal\u00e1 Strana, \u0027Hostinec U Magistra Kellyho\u0027 is named after the 16th-century alchemist from King Rudolf II\u0027s era, exuding a rustic and heartwarming family tavern feel. Its Czech grilled sausages (Klob\u00e1sa) and pork knuckle dishes are famous throughout the district. The sausages are pan-grilled to achieve a crispy snap, bursting with juicy, spiced flavor alongside a slightly spicy dipping sauce. The beef tenderloin in rich cream sauce (Sv\u00ed\u010dkov\u00e1) is velvety smooth, featuring a subtly sweet sauce paired with sourdough bread dumplings for a deliciously complex meal. It is a fantastic traditional spot to refuel before heading up to the castle.", "name": "Hostinec U Magistra Kellyho", "transport": "Take Tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk uphill along Nerudova Street for about 5 minutes."}, {"address": "Nerudova 213/18, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.3 stars | Situated on bustling Nerudova Street in Mal\u00e1 Strana, \u0027Restaurace U Mlyn\u00e1\u0159e\u0027 (The Miller\u0027s Restaurant) features historic mill woodcarvings and warm lighting, radiating a charming Bohemian countryside charm. The restaurant is renowned for its generous traditional Czech meat platters, featuring roasted pork knuckle, sausages with sauerkraut, and roasted chicken drumsticks. The pork knuckle skin is fragrant and crisp with a juicy, tender texture that isn\u0027t greasy. The special Czech bread dumplings are dense and absorbent, capturing every drop of savory pan juices. Offering very reasonable prices along a major tourist thoroughfare, it comes highly recommended by global travelers.", "name": "Restaurace U Mlyn\u00e1\u0159e", "transport": "Take Tram 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk uphill along Nerudova Street for about 4 minutes."}, {"address": "Tom\u00e1\u0161sk\u00e1 27/2, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.3 stars | Founded in 1870, \u0027Restaurace U Schnell\u016f\u0027 is an iconic historic Czech beer tavern in Mal\u00e1 Strana. The interior features historic vaulted architecture and has welcomed countless celebrities, writers, and artists over the years. Their classic Czech schnitzel (\u0158\u00edzek) is coated in golden breadcrumbs and fried to crispy perfection, locking in tender, juicy pork that pairs exquisitely with refreshing potato salad. Furthermore, their beer goulash boasts a rich, fragrant broth with hints of roasted malty flavors that keep you coming back for more\u2014a hearty, comforting taste of Bohemian home cooking.", "name": "Restaurace U Schnell\u016f", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop, then walk about 2 minutes."}, {"address": "Malostransk\u00e9 n\u00e1m. 261/10, 118 00 Mal\u00e1 Strana, Prague", "feature": "\u2b50 4.5 stars | Dating back to 1620, \u0027Restaurace U Mecen\u00e1\u0161e\u0027 located right next to Lesser Town Square is one of Prague\u0027s oldest Gothic vaulted restaurants. It masterfully combines centuries-old cellar architecture with modern refined Czech cuisine. The signature roasted lamb chops and classic marinated beef in cream sauce (Sv\u00ed\u010dkov\u00e1 na smetan\u011b) are phenomenal. The beef is slow-simmered until melt-in-your-mouth tender, drizzled with a velvety golden sauce crafted from root vegetables and fresh cream, and served with tangy-sweet cranberry jam and soft bread dumplings. Richly layered and remarkably smooth, it perfectly delivers a royal-worthy taste of traditional Czech feasting.", "name": "Restaurace U Mecen\u00e1\u0161e", "transport": "Take Tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop; right outside the station."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "V\u00edt\u011bzn\u00e1 124/5, 150 00 Praha 5-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Featuring a grand Neo-Renaissance ceiling dating back to the First Republic era, Caf\u00e9 Savoy is Prague\u0027s most famous century-old temple of breakfast and brunch. The Savoy Breakfast set is exceptionally lavish, featuring freshly baked croissants, handmade butter, French omeletes, and aromatic single-origin pour-over coffee. The croissants have a paper-thin, crispy crust that crackles when sliced, opening up to a soft, moist honeycomb structure with rich buttery notes. Paired with their signature hot chocolate\u2014silky-smooth and perfectly balanced in bittersweetness\u2014it is highly favored by tourists and local yuppies seeking an elegant palace-like atmosphere.", "name": "Caf\u00e9 Savoy", "transport": "Take tram 9, 12, 15, 20, or 22 to \u00dajezd station, then walk about 2 minutes."}, {"address": "L\u00e1ze\u0148sk\u00e1 287/7, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.4 stars | Translating to \u0027Sugar, Coffee, Lemonade,\u0027 this spot is tucked away in a quiet cobblestone alley of Mal\u00e1 Strana, boasting unique painted wooden ceilings alongside sleek modern decor. Famous for serving fresh all-day brunch and signature Eggs Benedict, the poached eggs burst with golden yolk over homemade hollandaise sauce and crispy toasted sourdough bread, creating a rich, non-greasy flavor profile. Their artisanal fruit pies and cappuccinos are also top-tier, featuring velvety microfoam and beans infused with refreshing citrus notes\u2014the perfect retreat to escape the crowds and enjoy a relaxed morning.", "name": "Cukrk\u00e1valimon\u00e1da", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk about 3 minutes."}, {"address": "M\u00ed\u0161e\u0148sk\u00e1 273/6, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.8 stars | Hidden in a quiet lane beside Charles Bridge, this hidden gem effortlessly combines local Czech craft beer with exquisite handmade cakes and pour-over coffee. For brunch, the toasted paninis and homemade quiches are highly recommended, featuring buttery, flaky crusts and rich, cheesy fillings. What guests rave about most is the homemade cinnamon cheesecake paired with custom pour-over coffee, which offers fruity and nutty undertones while the dessert is dense, smooth, and perfectly sweet. The charming courtyard garden offers a quaint, rustic vibe, making it a top choice to experience Prague\u0027s slow life.", "name": "Roesel - Beer \u0026 Cake", "transport": "A 2-minute walk from the Lesser Town Bridge Tower on Charles Bridge; or take the tram to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station and walk for 4 minutes."}, {"address": "Vla\u0161sk\u00e1 358/7, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Situated along the slope leading up to Prague Castle, St. Martin is a cozy, highly-rated small bistro-caf\u00e9. Its brunch menu blends Czech traditions with modern French flair, highlighting poached egg avocado toast and handmade French toast. The French toast is seared to a golden, lightly caramelized crunch on the outside while remaining custard-soft inside, topped with fresh blueberries and maple syrup that melts in your mouth. Paired with a freshly poured latte, the dark-roasted beans blend seamlessly with fresh milk to deliver a rich, dark-chocolate aroma\u2014a favorite stop before heading up to the castle.", "name": "St. Martin", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk uphill along Vla\u0161sk\u00e1 street for about 4 minutes."}, {"address": "M\u00ed\u0161e\u0148sk\u00e1 71/3, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.6 stars | Nestled on historic M\u00ed\u0161e\u0148sk\u00e1 street, this independent hipster caf\u00e9 preserves original 18th-century Baroque architecture and exposed brick walls, emanating nostalgia and vintage artistic charm. They exclusively source beans from local Czech specialty roasters; their espressos are bold with rich crema, while the oat milk lattes are exceptionally silky. Their homemade carrot cake and pecan pie are local favorites among students and artists, featuring a moist sponge infused with natural warm spices, topped with smooth cream cheese icing for a comforting, homemade sweetness.", "name": "Caf\u00e9 Club M\u00ed\u0161e\u0148sk\u00e1", "transport": "Take Metro Line A to Malostransk\u00e1 station and walk for about 5 minutes; or a 2-minute walk from the end of Charles Bridge."}, {"address": "Mosteck\u00e1 283/17, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.5 stars | Famous in Mal\u00e1 Strana for its hyper-realistic fruit-shaped desserts that are true visual works of art. The brunch menu offers freshly made souffl\u00e9 pancakes and gourmet sandwiches; the pancakes are cloud-like, light, and airy, melting instantly with rich egg flavors complemented by sweet and tangy fresh strawberry jam. Hyper-realistic desserts like \u0027Lemon\u0027 or \u0027Apple\u0027 feature a thin chocolate shell encasing delicate mousse and fruity filling, balancing sweet and tart notes effortlessly. Paired with a delicate single-origin pour-over coffee that cleanly palate-cleanses, this spot is an ultra-popular foodie destination on social media.", "name": "IPPA Caf\u00e9 Mosteck\u00e1", "transport": "Take tram 12, 15, 20, or 22 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk along Mosteck\u00e1 street for about 2 minutes."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m. 4, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.3 stars | Located on Malt\u00e9zsk\u00e9 Square near the John Lennon Wall, this caf\u00e9 exudes quintessential French bistro charm, complete with outdoor seating where you can sip coffee while enjoying street music. Their French brunch features freshly baked baguettes, special French spreads, and rich garlic-cheese soup. The croissants radiate natural cultured butter aromas with a light, crispy texture; paired with a bold French espresso, the blend of caffeine and pastry aromas transports you straight to Paris\u0027s Left Bank, making it a favorite for lovers of romantic ambience.", "name": "Caf\u00e9 de Paris", "transport": "Take tram 12, 15, 20, or 22 to Hellichova station, then walk about 3 minutes."}, {"address": "Hroznov\u00e1 489/3, 118 00 Praha 1-Mal\u00e1 Strana", "feature": "\u2b50 4.4 stars | Located next to Kampa Island and an ancient watermill in Mal\u00e1 Strana, this caf\u00e9 boasts excellent waterfront garden views surrounded by lush greenery. Serving fine English and Czech brunch sets, their standout dish is the freshly made apple strudel (\u0160tr\u00fadl) served with vanilla ice cream. The pastry is paper-thin yet tender, packed with cinnamon-spiced diced apples and crunchy nuts; the warm, sweet-tart strudel paired with cold, velvety ice cream creates pure deliciousness. Sipping a smooth Americano or fresh mint tea while l
