 about 5 minutes."}, {"address": "Koz\u00ed 918/1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | Bakeshop is a highly acclaimed boutique bakery in Prague\u0027s Old Town, attracting countless foodies with its daily fresh-baked sweet and savory tarts, pies, and sourdough European breads. Its display windows present a dazzling array of delicious takeaway options; the Spinach \u0026 Feta Quiche and freshly baked beef pies come especially recommended. The pastry crust is flaky and delicate, melting in your mouth, while the rich, juicy fillings are seasoned to perfection. Sweets like croissants and carrot cake are equally exquisite. Grabbing a freshly baked treat in a stylish paper bag along with a specialty coffee while walking along the cobblestone streets of Old Town is the epitome of refined street food enjoyment.", "name": "Bakeshop Classic European Takeaway Bakery (Bakeshop Prague)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 Station, then walk for about 6 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "\u8001\u57ce\u5340 (Star\u00e9 M\u011bsto)"}, "vinohrady_zizkov": {"categories": {"cat_1": {"items": [{"address": "Korunn\u00ed 810/1, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 Stars | A renowned traditional institution located in the heart of the Vinohrady district, famous for elevating traditional Czech dumplings (Knedl\u00edky) to perfection. The Czech goulash and roasted pork knuckle here boast a crispy skin and tender, juicy meat, served with rich special sauce and soft, flavor-absorbing dumplings, making every bite rich and full of flavor. The lively, modern yet cozy atmosphere, paired with a freshly poured, unfiltered Pilsner Urquell, makes this a classic culinary experience that neither tourists nor locals should miss.", "name": "Vinohradsk\u00fd Parlament", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru station, then walk for about 3 minutes."}, {"address": "\u0160kroupovo n\u00e1m. 1282/5, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.3 Stars | A legendary vintage pub in the \u017di\u017ekov district, featuring ceilings adorned with retro toys and antiques for a wild Bohemian feel. It serves highly authentic Czech comfort food perfect for pairing with beer, such as rich tavern goulash, zesty pickled sausages, and roasted pork ribs crispy on the outside and tender inside. The succulent ribs are elevated with horseradish and yellow mustard; served in generous portions with rich flavor layers, it\u0027s a beloved spot for late-night foodies and local beer enthusiasts.", "name": "U Sadu", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 5 minutes."}, {"address": "Tachovsk\u00e9 n\u00e1m. 288/6, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.6 Stars | Renowned as the oldest pub-restaurant in the \u017di\u017ekov area, with history dating back to the 19th century. It insists on serving the purest homemade Czech dishes. Highly recommended is the traditional roasted duck with sauerkraut and two-color dumplings; the duck skin is crispy without being greasy, the meat falls off the bone easily, and the refreshing sauerkraut perfectly balances the rich meat flavors. With its unpretentious vibe and packed house at mealtimes, it\u0027s a dream spot for experiencing authentic Czech dining culture.", "name": "U Slovansk\u00e9 l\u00edpy", "transport": "Take bus 133, 175, or 207 to Tachovsk\u00e9 n\u00e1m\u011bst\u00ed stop, and you will arrive immediately upon exiting."}, {"address": "Jagellonsk\u00e1 2426/16, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.4 Stars | Hidden in the alleys of \u017di\u017ekov, this famous traditional restaurant is locally renowned for exquisite handmade Czech dishes and carefully selected craft beers from regional microbreweries. Its signature beef in cream sauce (Sv\u00ed\u010dkov\u00e1 na smetan\u011b) is legendary\u2014melt-in-your-mouth tender beef coated in a rich, smooth cranberry cream sauce with an irresistible sweet and sour balance. The warm, wood-toned decor and friendly service make you feel as if you\u0027ve stepped into a Czech grandmother\u0027s cozy kitchen.", "name": "Restaurace U Vodoucha", "transport": "Take Metro Line A to Flora station, then walk for about 6 minutes."}, {"address": "Korunn\u00ed 2506/106, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.5 Stars | Converted from a century-old brewery, this traditional brewpub seamlessly combines classic brewing craftsmanship with delicious traditional food. The brewery roasted pork knuckle and beer goulash are must-orders for foodies. Marinated in house craft beer and roasted to a golden, crispy perfection, the pork knuckle retains juicy tender meat with malt aromas, pairing flawlessly with their house-brewed draft beer. The spacious, vaulted ceiling space and vibrant atmosphere draw countless local food lovers.", "name": "Vinohradsk\u00fd Pivovar", "transport": "Take Tram 10 or 16 to Orionka stop; it will be visible right as you get off."}, {"address": "Vinohradsk\u00e1 122/103, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.2 Stars | A highly popular local traditional restaurant tucked away in the alleys of Vinohrady. Its name means \u0027Three Little Pigs\u0027, and as expected, it specializes in various high-quality traditional pork dishes. The roasted pork ribs and traditional Czech schnitzel are widely praised; the schnitzel features a thin, crispy golden coating over juicy, tender meat, served with refreshing potato salad for distinct flavor layers. Affordable prices and generous portions make it an excellent choice for experiencing everyday local dining.", "name": "Restaurace U T\u0159\u00ed pras\u00e1tek", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 3 minutes."}, {"address": "Lu\u017eick\u00e1 1637/31, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.3 Stars | A highly authentic family-run traditional eatery in Vinohrady, far from the bustling tourist areas, serving cozy and genuine Czech classics. Highly recommended are the traditional goulash and traditional potato pancakes (Brambor\u00e1ky). The potato pancakes are pan-fried with herbs and garlic until golden and crisp on both sides\u2014fragrant, crispy outside and soft inside, leaving a lasting impression when paired with rich gravy. Friendly service and reasonable prices make this a favorite secret spot for locals returning time and again.", "name": "Restaurace Na Pasece", "transport": "Take Tram 22 to Jana Masaryka stop, then walk for about 4 minutes."}, {"address": "Krkono\u0161sk\u00e1 1607/11, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.4 Stars | A hidden traditional gem specializing in regional mountain cuisine from northern Czechia, offering a cozy rustic mountain vibe. Signature dishes include rich Czech garlic soup (\u010cesne\u010dka) and dark beer pork stew. The garlic soup, topped with cheese and crispy croutons, is sweet, rich, and deeply comforting; the pork stew is melt-in-your-mouth tender, with sauce carrying bittersweet undertones of rye and malt. A must-visit spot for foodies eager to sample mountain-style Czech dishes rare in Prague.", "name": "Krkono\u0161sk\u00e1 hospoda", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 5 minutes."}], "name": "Local Traditional Classics"}, "cat_2": {"items": [{"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad 1399/12, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.6 stars | Combining Vietnamese flavors with continental European style, this trendy cafe is one of the most popular brunch spots in the Vinohrady area. The signature Vietnamese avocado toast paired with a poached egg features sourdough bread that absorbs the rich yolk and special spiced sauce, delivering a multi-layered texture with a subtle hint of spice. Filled with green plants and vintage industrial charm, it draws countless youngsters and tourists. Pair it with a rich Vietnamese iced coffee infused with sweet condensed milk for a highly recommended experience.", "name": "Caf\u00e9 Fin", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad station, about a 2-minute walk."}, {"address": "S\u00e1zavsk\u00e1 13, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | A hidden brunch gem with a cozy, homey feel, specializing in homemade dishes crafted from local organic ingredients. The popular freshly made pancakes and oatmeal receive constant praise; the pancakes are lightly crisp on the outside, fluffy and soft inside, topped with slightly tart fruit jam and rich maple syrup for a sweetness that never overwhelms. Beautifully plated like a piece of art and paired with smooth pour-over specialty coffee, it\u0027s an ideal spot to experience Prague\u0027s slow-paced lifestyle and local warmth.", "name": "Mezi Srnky", "transport": "Take Tram 4, 10, 16, or 22 to \u0160umavsk\u00e1 station, about a 3-minute walk."}, {"address": "S\u00e1zavsk\u00e1 2031/32, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Renowned as the most beautiful specialty cafe in Vinohrady, its high-ceiling space is filled with fresh flowers and vintage furniture. The single-origin coffees offer distinct layers of flavor, pairing seamlessly with freshly baked French peach tart or chocolate tart\u2014where the crispy crust and rich filling melt together in an elegant, refined bite. Its aesthetically stunning atmosphere and high-quality house-roasted beans make it a favorite gathering place for local hipsters and photography enthusiasts.", "name": "La Boheme Caf\u00e9", "transport": "Take Tram 4, 10, 16, or 22 to \u0160umavsk\u00e1 station, about a 3-minute walk."}, {"address": "Korunn\u00ed 86, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.5 stars | A vintage cafe adorned with gorgeous botanical murals on its walls, offering a warm and inviting atmosphere. The flagship brunch platter includes fresh sourdough bread, artisanal sausage, and soft scrambled eggs; the toast yields a satisfying crunch with every bite while the eggs remain rich and silky smooth. The freshly baked homemade cakes served in the afternoon fill the air with aroma, creating a dream space for neighbors and travelers to relax over brunch or afternoon tea.", "name": "Spi\u017e\u00edrna 1902", "transport": "Take Tram 10 or 16 to Perunova station, about a 1-minute walk."}, {"address": "Korunn\u00ed 1208/74, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.6 stars | A pioneer small cafe that ignited the specialty coffee wave in Vinohrady, always packed despite its cozy size. The avocado poached egg toast here is legendary\u2014rich, smooth avocado spread sprinkled with shichimi pepper and chopped nuts, served alongside a soft-boiled poached egg on crispy rye bread for a truly sensational bite. Coffee beans are sourced directly from top European roasteries, producing Flat Whites with velvety foam and rich coffee aromas.", "name": "Coffee Room", "transport": "Take Tram 10 or 16 to Vinohradsk\u00e1 vod\u00e1rna station, about a 2-minute walk."}, {"address": "Korunn\u00ed 31, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | A renowned specialty coffee house with its own roastery, famous for its iconic swing seats and bright, modern decor. Beyond high-quality light-roast single-origin pour-overs, the brunch pressed paninis and cheese croissants are standout items\u2014the golden, crispy toasted croissant melts with cheese and ham inside, offering a wonderfully savory flavor. It\u0027s a paradise for coffee lovers looking to discover exceptional brews.", "name": "Dos Mundos Cafe", "transport": "Take Tram 10 or 16 to Vinohradsk\u00e1 vod\u00e1rna station, about a 3-minute walk."}, {"address": "Slav\u00edkova 1558/21, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 stars | A specialty coffee chain boasting a clean, ultra-modern style that is a hit with young digital nomads. Their signature cinnamon rolls feature a slightly crisp exterior and a fluffy, moist interior, generously coated in cinnamon frosting and nut crunchies for a rich, sweet indulgence. Paired with a smooth oat milk latte, it\u0027s the perfect choice to kick start a vibrant, minimalist morning in Prague.", "name": "The Miner\u0027s Coffee \u0026 Bakery", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad station, about a 2-minute walk."}, {"address": "Lond\u00fdnsk\u00e1 135/21, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 stars | A trailblazer for Fairtrade coffee in Prague, featuring a cozy two-story wooden space that invites instant relaxation. Focusing on house-roasted Fairtrade organic beans, the menu boasts rich vegetarian and vegan brunch options, such as hummus with grilled vegetable toast and banana pancakes. The pancakes are golden on the outside, thick and moist inside with natural fruity sweetness, adored by health-conscious locals and expats alike.", "name": "Mamacoffee Lond\u00fdnsk\u00e1", "transport": "Take Metro Line C to I. P. Pavlova station, about a 5-minute walk."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Korunn\u00ed 2506/106, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.6 stars | A classic microbrewery gastropub located in the Vinohrady district, housed in a historic former brewery brew house. The signature Czech Goulash is served with soft, airy Karlovy Vary bread dumplings; the beef is melt-in-your-mouth tender, bathed in a rich sauce infused with the malty aroma of dark beer. Another highlight is the roasted pork knuckle\u2014crispy and crackling on the outside, juicy and tender on the inside. Highly popular among locals and beer enthusiasts alike, paired with their house-brewed unfiltered lager, offering an authentic Czech pub dining experience.", "name": "Vinohradsk\u00fd Pivovar (Vinohradsk\u00e1 Brewery Gastropub)", "transport": "Take Tram 10 or 16 to Orionka stop, about a 2-minute walk."}, {"address": "\u0160kroupovo n\u00e1m. 5, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.4 stars | A legendary gastropub in \u017di\u017ekov featuring a quirky retro ambiance with antiques hanging from the ceiling. A must-try local specialty is pickled cheese (Nakl\u00e1dan\u00fd hermel\u00edn)\u2014smooth, rich Camembert-style cheese marinated in spiced oil and chili peppers, creating a creamy, buttery texture that pairs perfectly with rye bread crisp on the outside and soft inside. Another classic, the grilled sausage, boasts a charred casing bursting with juice. Whether stopping by for a late-night craft beer or traditional pub snacks, it retains a lively and welcoming neighborhood vibe.", "name": "U Sadu Traditional Gastropub", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, about a 5-minute walk."}, {"address": "Vinohradsk\u00e1 66, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.7 stars | An immensely popular modern creative gastropub near N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, blending traditional Czech ingredients with French rotisserie techniques. The signature slow-roasted chicken features golden, crispy skin and juicy, tender meat, drizzled with savory pan drippings and a custom sweet-and-sour sauce for layers of rich flavor; served with smooth, buttery homemade mashed potatoes that leave you craving more. Elevating traditional Czech comfort food into elevated pub dining, this spot has become a top-queue destination for young tourists and foodies in Vinohrady.", "name": "Kro Kitchen Vinohrady (Modern Rotisserie Gastropub)", "transport": "Take Metro Line A or Tram 11, 13 to Ji\u0159\u00edho z Pod\u011bbrad station, about a 2-minute walk."}, {"address": "Jagellonsk\u00e1 2426/16, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.5 stars | A nostalgic home-style Czech tavern tucked between Vinohrady and \u017di\u017ekov, famous for serving microbrewery craft beers alongside authentic local classics. Their beer goulash and crispy pork schnitzel (\u0158\u00edzek) come highly recommended; the schnitzel features a thick, juicy pork cutlet breaded and fried to golden perfection without feeling greasy, served with refreshingly tangy homemade potato salad. With its authentic old-world Czech pub d\u00e9cor and friendly, unpretentious service, guests can relax and enjoy pure, old-fashioned Czech comfort food.", "name": "Hostinec U Vodoucha Classic Czech Gastropub", "transport": "Take Tram 11 or 13 to Radho\u0161\u0165sk\u00e1 stop, about a 3-minute walk."}, {"address": "\u0158\u00edmsk\u00e1 1196/29, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Renowned as one of Prague\u0027s best gourmet burger bistros, located in a quiet alley of the elegant Vinohrady district. The signature Dish Burger features premium Czech beef patties seared to a slight crisp while remaining juicy and pink inside, topped with rich cheddar cheese, smoky bacon, and homemade smoky chili sauce for an incredibly flavorful bite. Paired with crispy, herb-seasoned fries, it\u0027s a fantastic upscale casual dining choice when looking for a break from heavy Czech cuisine.", "name": "Dish Fine Burger Bistro", "transport": "Take Metro Line A or C to Muzeum station, or Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru station, about a 5-minute walk."}, {"address": "Korunn\u00ed 92, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.6 stars | An upscale gastropub elegantly reinterpreting traditional local dishes from Wallachia, Czechia with modern culinary techniques. Signature offerings like slow-braised beef with rich horseradish cream sauce feature silky-tender meat in a fiery yet velvety sauce, paired with house-fermented pickles and dense traditional dumplings\u2014striking a balance between deep heritage and modern presentation. Offering curated draft beers and a broad Czech wine list, its chic, cozy interior attracts discerning foodies and travelers alike.", "name": "V\u00fd\u010dep Modern Czech Gastropub", "transport": "Take Tram 10 or 16 to Perunova stop, about a 1-minute walk."}, {"address": "Chvalova 1032/11, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | A unique gastropub in \u017di\u017ekov blending American retro flair with local Czech pub vibes, popular with both international travelers and young locals. Specialties include low-and-slow pulled pork burgers and spicy wings; the shredded pork is smoked for hours to achieve a tender, moist texture with rich aromas, complemented by crisp, zesty coleslaw. Paired with a curated selection of microbrewery stouts and IPAs, it offers a vibrant yet laid-back evening dining experience.", "name": "U Kurel\u016f American-Style Gastropub", "transport": "Take Tram 5, 9, 15, or 26 to Lipansk\u00e1 stop, about a 4-minute walk."}, {"address": "Kubel\u00edkova 1150/9, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | A Mediterranean gastropub boasting a lush courtyard garden near the \u017di\u017ekov Television Tower, serving flavorful regional specialties. Signature charcoal-grilled lamb chops and souvlaki skewers are freshly grilled over open embers, locking in rich flavors with a smoky exterior and tender, succulent meat; served alongside creamy tzatziki and freshly baked pita bread. Dining in the leafy courtyard offers a relaxing atmosphere, making it a beloved local dining destination in \u017di\u017ekov.", "name": "Taverna Olympos Mediterranean Garden Gastropub", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, about a 6-minute walk."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Slezsk\u00e1 130/62, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Located in the Vinohrady district, this classic vegan bistro is famous for its cozy Nordic aesthetic and high-quality plant-based dishes. Its vegan brunch is hugely popular among young locals and tourists alike. The \u0027Vegan American Pancakes\u0027 and \u0027Oat Milk Cappuccino\u0027 are highly recommended\u2014the pancakes are slightly crispy on the outside, light and fluffy on the inside, served with plant-based whipped cream and maple syrup for a velvety, sweet, guilt-free treat. Additionally, their daily fresh \u0027Plant-Based Cheeseburger\u0027 features a juicy plant-protein patty with custom smoked sauce on soft brioche, completely revolutionizing traditional impressions of vegetarian food. It\u0027s an ideal spot for a relaxing afternoon tea and healthy dining.", "name": "Moment Vegan Bistro", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 3 minutes."}, {"address": "Lond\u00fdnsk\u00e1 216/29, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | Forrest Bistro is an immensely popular 100% vegan cafe in Prague\u0027s Vinohrady district, combining specialty pour-over coffee with comforting Japanese and European plant-based dishes. Their signature \u0027Vegan Pho\u0027 features a broth slow-cooked with fresh vegetables and herbs, resulting in a sweet, aromatic flavor layered with Thai basil and lemon. Smooth rice noodles soak up the broth, complemented by seared tofu and plant-based slices for a comforting meal. Don\u0027t miss their divine vegan desserts like the \u0027Matcha Cheesecake\u0027, which is rich, silky, perfectly balanced in sweetness, and loved by health-conscious foodies.", "name": "Forrest Bistro", "transport": "Take Metro Line A/C to I. P. Pavlova station, then walk for about 5 minutes."}, {"address": "Voron\u011b\u017esk\u00e1 564/19, 101 00 Praha 10-Vinohrady", "feature": "\u2b50 4.6 stars | Specializing in plant-based American fast food and gluten-free Italian pizzas, Chutnej is a haven for vegan enthusiasts in Vinohrady. Their crowd-favorite \u0027Deluxe Vegan Cheeseburger\u0027 features a thick, juicy plant patty flame-grilled to smoky perfection, topped with melted vegan cheese, pickles, and crisp lettuce for a truly satisfying bite. Additionally, their \u0027Vegan Gluten-Free Pizza\u0027 is crafted from naturally fermented dough, creating a chewy crust that\u0027s crispy on the outside and soft inside. Generously topped with creamy vegan cheese and colorful veggies, it hits the sweet spot between ultimate indulgence and healthy eating.", "name": "Chutnej Vegan American Restaurant", "transport": "Take Tram 4, 13, or 22 to Rusk\u00e1 stop, then walk for about 2 minutes."}, {"address": "Italsk\u00e1 1219/2, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 stars | Dhaba Beas is Prague\u0027s most famous Indian-inspired vegan and vegetarian buffet chain. The cozy Italsk\u00e1 branch is a favorite among local residents and office workers. Food is sold by weight, offering dozens of authentic Indian and Asian vegetarian hot dishes, curries, and fresh salads. Popular options like the \u0027Dal\u0027 (herb lentil curry) and \u0027Palak Paneer\u0027 are richly spiced with a smooth texture. Paired with fresh-baked aromatic naan or fragrant turmeric rice, it provides a deeply comforting and filling meal. Great value for money, with extra discounts offered in the late afternoon/evening!", "name": "Dhaba Beas Vegetarian Buffet - Italsk\u00e1", "transport": "Take Metro Line A/C to I. P. Pavlova station, then walk for about 4 minutes."}, {"address": "Rumunsk\u00e1 16, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | This cozy, welcoming bistro specializes in authentic Mediterranean and Middle Eastern vegetarian cuisine and is acclaimed by foodies as serving Prague\u0027s best falafel and hummus. The signature \u0027Freshly Fried Falafel\u0027 boasts a golden, crispy exterior with a smooth, herb-infused chickpea center\u2014delightfully crunchy without being oily. Pair it with silky-smooth signature hummus and freshly baked, pillowy pita bread for an explosion of vibrant spice flavors. Many dishes can be made 100% vegan, making this a must-visit spot for authentic Mediterranean eats.", "name": "Paprika - Mediterranean Bistro \u0026 Bar", "transport": "Take Metro Line C or Tram to I. P. Pavlova station, then walk for about 3 minutes."}, {"address": "B\u011blehradsk\u00e1 82/47, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.3 stars | Located in Vinohrady, this branch of the globally renowned Loving Hut serves a diverse array of Asian-style vegan dishes and a pay-by-weight buffet. Highlights include the \u0027Vegan Hot and Sour Soup\u0027 and \u0027Crispy Vegan Roast Duck\u0027. The plant-based \u0027roast duck\u0027 features a golden, crispy skin with a juicy, chewy texture, wrapped in thin pancakes with sweet bean sauce and fresh cucumber slices for a delicious savory-sweet crunch. The buffet bar offers fresh stir-fried seasonal vegetables, vegan sushi, and crispy spring rolls at budget-friendly prices, making it a great haven for vegetarians craving hot Asian comfort food.", "name": "Loving Hut Vegan Asian Cuisine - B\u011blehradsk\u00e1", "transport": "Take Tram 6 or 11 to Bruselsk\u00e1 stop, then walk for about 1 minute."}, {"address": "U Rajsk\u00e9 zahrady 804/14, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | Tucked away in the \u017di\u017ekov district, Belzepub is a unique vegan bar and bistro steeped in rock and underground culture, renowned for its epic, oversized vegan comfort food. Their specialty lies in \u0027100% Vegan Jumbo Burgers\u0027 featuring house-made plant patties, oozing melted vegan cheese, crispy vegan bacon, and signature spicy sauce, all sandwiched inside toasted buns. Every bite is juicy, flavor-packed, and wonderfully indulgent! Pair your meal with a generous portion of golden fries and local Czech craft beer\u2014it\u0027s the perfect night-out spot to hang out with friends and experience \u017di\u017ekov\u0027s vibrant nightlife.", "name": "Belzepub Vegan American Bar \u0026 Restaurant", "transport": "Take Tram 5, 9, 15, or 26 to Viktoria \u017di\u017ekov stop, then walk for about 5 minutes."}, {"address": "B\u011blehradsk\u00e1 234/120, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.1 stars | Opened in the 1990s, Radost FX is Prague\u0027s legendary and oldest vegetarian restaurant-meets-nightclub, famously visited by stars like Madonna. The venue features extravagant, Moroccan-inspired exotic decor and serves a fully vegetarian menu blending Mexican, Indian, and Mediterranean flavors. Their \u0027Vegetarian Burrito\u0027 comes highly recommended\u2014stuffed with savory black beans, fragrant rice, grilled vegetables, and melted cheese, served with fresh salsa and sour cream for a rich, satisfying feast. Operating from early morning brunch late into the night, it\u0027s an iconic landmark to experience Prague\u0027s stylish vegetarian culture.", "name": "Radost FX Vegetarian Club \u0026 Restaurant", "transport": "Take Metro Line C or Tram to I. P. Pavlova station, then walk for about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.7 stars | Traditional Czech smoked sausages (Klob\u00e1sa) pan-fried right at the market stand. The casing is crisp and nicely charred, bursting with rich juices and herbal aromas with every bite. Served on fresh rye bread smeared with sauerkraut and spicy yellow mustard, it offers rich and satisfying layers of texture. A top choice for weekend picnics and casual snacking for locals and tourists alike.", "name": "Ji\u0159\u00e1k Farmers Market Sausage Stand (Trhy na Ji\u0159\u00e1ku)", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station; the market is right outside the exit."}, {"address": "Laubova 1689/4, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.6 stars | Offers authentic Czech grab-and-go treats and open-faced sandwiches (Chleb\u00ed\u010dky). Freshly baked cinnamon pastries and fluffy kol\u00e1\u010de feature a crispy exterior, soft interior, and rich milky butter flavors intertwined with fruit jam fillings. The freshly made potato salad open sandwiches are creamy yet refreshing\u2014a quintessential grab-and-go snack in the Vinohrady district.", "name": "Anton\u00ednovo peka\u0159stv\u00ed - Laubova", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, about a 2-minute walk."}, {"address": "Vinohradsk\u00e1 66, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.5 stars | A hugely popular innovative street food spot in Vinohrady. Their signature slow-roasted chicken features golden crisp skin and tender, juicy meat. Drizzled with a custom herb chili sauce and served inside a soft brioche bun toasted to perfection, every bite bursts with rich flavor and amazing texture. Perfect for grabbing to take to the park for a picnic.", "name": "Kro Kitchen Vinohrady", "transport": "Take Metro Line A or Tram 11, 13 to Ji\u0159\u00edho z Pod\u011bbrad station, about a 3-minute walk."}, {"address": "Slav\u00edkova 1, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.4 stars | A legendary standing-only Vietnamese food stall in Prague. Freshly rolled shrimp spring rolls feature translucent, chewy wrappers packed with rice vermicelli and aromatic herbs, wonderfully refreshing when dipped in custom peanut sauce. The freshly fried spring rolls are golden, crispy, and crackle with every bite. This fast-paced standing street food culture is beloved by locals and foodies alike.", "name": "Pho Vietnam Tuan \u0026 Lan - Slav\u00edkova", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, about a 2-minute walk."}, {"address": "B\u011blehradsk\u00e1 934/66, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | A cozy bakery famous for handcrafted sourdough bread made from premium wheat. Their freshly baked cinnamon buns are perfectly layered, crisp on the outside and moist inside, filled with rich brown sugar and warm cinnamon aromas. Satisfyingly dense without being overly sweet, it pairs perfectly with a specialty takeaway coffee for a stroll around town.", "name": "Pek\u00e1rna Praktika B\u011blehradsk\u00e1", "transport": "Take Tram 6 or 11 to Pod Karlovom station, about a 1-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.5 stars | A popular made-to-order crepe stand at the market. Savory buckwheat galettes are cooked until golden and slightly crispy, stuffed with rich cheese, ham, and a runny egg that blends delightfully with the melted cheese. Sweet crepes are spread with warm hazelnut cocoa spread and banana slices\u2014soft, sweet, and immensely popular as a market walk-around snack.", "name": "Galetka \u0026 Cr\u00eapes - Trhy na Ji\u0159\u00e1ku", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station; the market is right outside the exit."}, {"address": "Seifertova 571/7, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.2 stars | A wildly popular late-night street food spot in \u017di\u017ekov\u0027s nightlife district. Freshly shaved beef and chicken from the vertical rotisserie boast a rich, charred aroma, paired with shredded cabbage, fresh tomatoes, and garlic yogurt sauce, all tightly wrapped in warm, toasted flatbread. Hearty and juicy, it\u0027s a must-try taste of the local late-night food culture.", "name": "Can Kebap Seifertova", "transport": "Take Tram 5, 9, 15, or 26 to Husineck\u00e1 station, about a 1-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.3 stars | A classic Prague street snack, \u0027sausage in a roll\u0027 (P\u00e1rky v rohl\u00edku). A long, juicy beef sausage is inserted into a hollowed, toasted warm crusty roll and squirted with plenty of yellow mustard. The sausage snaps with juicy flavor with every bite, pairing perfectly with the bread\u0027s crispy exterior and soft interior\u2014a convenient and authentic local snack.", "name": "P\u00e1rky v rohl\u00edku - Ji\u0159\u00e1k Market", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station; the market is right outside the exit."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "\u8461\u8404\u9152\u838a\u5340\u8207\u9f4a\u8332\u79d1\u592b (Vinohrady \u0026 \u017di\u017ekov)"}, "vysehrad": {"categories": {"cat_1": {"items": [{"address": "Vratislavova 28/12, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | Established in 1895, this century-old institution is one of the most revered traditional Czech restaurants in the Vy\u0161ehrad district. Its signature roasted duck leg with red cabbage and Czech dumplings features crispy skin and tender meat that easily falls off the bone. Paired with sweet and sour red cabbage and chewy steamed bread dumplings (Knedl\u00edky) soaked in rich gravy, the flavor layers are extraordinary. Locals love grabbing a freshly poured Pilsner Urquell here to soak up the cozy, historic pub vibe, drawing food lovers from near and far.", "name": "Restaurace U Kroka", "transport": "Take tram 2, 3, 17, or 21 to V\u00fdto\u0148 stop and walk about 5 minutes; or take tram 14 or 18 to Ostr\u010dilovo n\u00e1m\u011bst\u00ed stop and walk 3 minutes."}, {"address": "Vratislavova 16/4, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Nestled on the slope leading up to Vy\u0161ehrad Castle, this warm and cozy spot serves authentic Czech comfort food. A must-try is the Czech Beef Goulash, featuring beef shank slow-cooked for hours in a rich, thick sauce infused with paprika and onion sweetness. The melt-in-your-mouth beef is served with fluffy yeast dumplings that soak up all the delicious sauce. Honest prices and friendly service make this place a beloved favorite among tourists and locals alike.", "name": "Restaurace Pod Vy\u0161ehradem", "transport": "Take tram 14 or 18 to Ostr\u010dilovo n\u00e1m\u011bst\u00ed stop, about a 2-minute walk."}, {"address": "Vratislavova 33/16, 128 00 Praha 2", "feature": "\u2b50 4.3 stars | Named after the legendary Czech mythical horse \u0160em\u00edk, this traditional restaurant sits right next to the Vy\u0161ehrad gates, boasting an elegant and historic atmosphere. Its traditional beef tenderloin with cream sauce (Sv\u00ed\u010dkov\u00e1 na smetan\u011b) is absolute perfection\u2014a velvety root-vegetable cream sauce topped with a dollop of sweet-and-sour cranberry sauce and whipped cream poured over thick slices of tender beef. Perfect for family dinners or romantic dates, offering a regal yet welcoming traditional Czech feast.", "name": "Restaurace U \u0160em\u00edka", "transport": "Take tram 14 or 18 to Ostr\u010dilovo n\u00e1m\u011bst\u00ed stop, about a 4-minute walk."}, {"address": "V Pevnosti 159/5, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Perched atop the Vy\u0161ehrad ramparts, this immensely popular open-air pub is a hidden gem for catching sweeping panoramic views of Prague and stunning sunsets. The outdoor charcoal grill fills the air with mouthwatering aromas, offering signature Balkan grilled sausages (\u0106evapi) and smoked pork ribs with crispy exteriors and juicy, tender centers. Pair your food with a freshly opened dark beer or Kozel draft beer in a relaxed, vibrant atmosphere. It\u0027s the ultimate sunny afternoon hangout for local youths and savvy travelers.", "name": "Hosp\u016fdka Na Hradb\u00e1ch", "transport": "Take Metro Line C to Vy\u0161ehrad station, walk about 8 minutes through Vy\u0161ehrad Park to reach the ramparts."}, {"address": "T\u00e1borsk\u00e1 389/49, 140 00 Praha 4", "feature": "\u2b50 4.5 stars | Located east of Vy\u0161ehrad, this century-old traditional pub and microbrewery has won numerous Czech culinary awards. It is world-renowned for its traditional slow-roasted half duck, featuring paper-thin crispy skin and juicy, herb-infused meat. Served alongside homemade potato dumplings (Bramborov\u00e9 knedl\u00edky) and tangy sauerkraut, it\u0027s rich yet delightfully balanced. Wash it down with a glass of their home-brewed, unfiltered semi-dark beer for an authentic, unrepeatable Czech classic experience.", "name": "Sousedsk\u00fd pivovar Ba\u0161ta / U Ban\u0161eth\u016f", "transport": "Take tram 18 to N\u00e1m\u011bst\u00ed Brat\u0159\u00ed Synk\u016f or Nuselsk\u00e1 radnice stop, about a 2-minute walk."}, {"address": "Svobodova 144/4, 128 00 Praha 2", "feature": "\u2b50 4.2 stars | A classic Czech bistro tucked between the Vltava River and Vy\u0161ehrad, away from the hustle and bustle of Old Town, preserving a pure local charm. The chef highly recommends the Pork Schnitzel (\u0158\u00edzek), made with premium pork loin breaded and fried to a golden, crispy crunch without feeling greasy. It comes paired with a traditional Czech potato salad mixed with pickles and mayonnaise, offering a rich yet refreshing side. Generous portions make it a go-to spot for neighborhood office workers and local foodies.", "name": "Restaurace U San\u00ed", "transport": "Take tram 2, 3, 17, or 21 to V\u00fdto\u0148 stop, about a 3-minute walk."}, {"address": "Vy\u0161ehradsk\u00e1 1425/37, 128 00 Praha 2", "feature": "\u2b50 4.2 stars | A nostalgic, retro-style local pub featuring wooden interiors and walls adorned with historical photos, exuding classic Old Prague charm. Their Czech Beef Tartare with Garlic (Tatarsk\u00fd biftek) is extremely popular\u2014fresh, seasoned raw beef spread onto golden, crispy garlic-rubbed toasted bread, delivering an amazing contrast of textures and robust garlic aromas. Paired with an ice-cold draft beer, it is the ultimate traditional pub bite experience.", "name": "Hostinec U Podskal\u00e1ka", "transport": "Take tram 14 or 18 to Botanick\u00e1 zahrada stop, about a 2-minute walk."}, {"address": "K Rotund\u011b 100/10, 128 00 Praha 2", "feature": "\u2b50 4.1 stars | Situated next to the Basilica of St. Peter and St. Paul inside Vy\u0161ehrad, this classic traditional caf\u00e9 offers authentic Czech savory dishes and traditional handmade desserts. Highlights include the traditional Czech Honey Cake (Medovn\u00edk) and Apple Strudel (\u0160tr\u00fadl). The honey cake features delicate layers filled with crushed nuts and honey cream, yielding a soft, moist, and delightfully balanced sweetness. Enjoying it with a freshly brewed espresso or herbal tea after strolling through the ancient fortress grounds offers a warm, timeless European atmosphere.", "name": "Kav\u00e1rna A Cukr\u00e1rna Na Vy\u0161ehrad\u011b", "transport": "Take Metro Line C to Vy\u0161ehrad station, walk about 7 minutes to reach the interior of the fortress."}], "name": "Local Traditional Classics"}, "cat_2": {"items": [{"address": "Vratislavova 30/8, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.7 Stars | Nestled on a path halfway up to Vy\u0161ehrad Castle, this cozy hidden gem features a lush, green back garden. Famous for its exquisite single-origin pour-over coffee and homemade pastries\u2014especially the crispy, fluffy quiche and rich, velvety crepe cake. Enjoying a hearty European brunch platter paired with a smooth oat milk latte amid old brick walls and garden greenery offers a wonderfully layered taste experience, making it a secret sanctuary for locals and savvy travelers seeking a relaxed morning.", "name": "Kav\u00e1rna \u010cek\u00e1rna", "transport": "Take tram 14, 18, or 24 to Divadlo Na H\u0159ebenech or Albertov station, then walk about 5 minutes."}, {"address": "K \u0160tulcovn\u011b 42/1, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.5 Stars | Situated right in the lush center of Vy\u0161ehrad Park near the Basilica of St. Peter and St. Paul, this cafe boasts fantastic outdoor seating. It serves classic Czech-style brunch and freshly baked breads. Their most popular cinnamon apple pie features a thin, crispy crust with a deliciously sweet and tangy filling, topped with a generous dollop of whipped cream. Sipping an aromatic espresso under the shade of trees while admiring views of the Vltava River creates a poetic and leisurely vibe.", "name": "Kav\u00e1rna Na Vy\u0161ehrad\u011b", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk through the park for about 8 minutes."}, {"address": "Neklanova 107/18, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.6 Stars | Located on a charming street at the foot of Vy\u0161ehrad, this cozy retro cafe attracts food lovers with its warm, handmade touch. The brunch sets offer incredible value, featuring golden freshly baked croissants, soft organic scrambled eggs, and fresh jam. The signature cheesecake is highly recommended\u2014silky smooth, melt-in-your-mouth soft, with a subtle hint of lemon and rich cream flavor, making it a favorite among local hipsters.", "name": "Kaf\u00e1rna pod Vy\u0161ehradem", "transport": "Take tram 14, 18, or 24 to Svatoplukova station, then walk about 3 minutes."}, {"address": "V Pevnosti 16/2, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.4 Stars | Tucked away right along the edge of Vy\u0161ehrad\u0027s ancient ramparts, this casual cafe offers some of the most breathtaking sunset and panoramic city views in Prague. In addition to quality coffee, it is famous for its light bites and traditional grilled meats. The classic handmade grilled sausage is snappy and juicy, served with fresh pickles and freshly baked rye bread for a perfectly savory, crisp-yet-tender bite. It draws crowds of visitors who gather at outdoor tables from late afternoon to evening, sipping coffee while gazing over the Vltava River and red-tiled roofs.", "name": "Hosp\u016fdka a Kav\u00e1rna Na Hradb\u00e1ch", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk along the castle walls for about 10 minutes."}, {"address": "Podolsk\u00e9 n\u00e1b\u0159. 34/6, 147 00 Praha 4-Podol\u00ed", "feature": "\u2b50 4.5 Stars | Situated along the Vltava riverbank right below the Vy\u0161ehrad cliff, this cafe features an unbeatable waterfront terrace. It specializes in healthy vegetarian and gluten-free brunch options. The signature poached egg and avocado toast uses artisan sourdough bread that\u0027s crispy outside and soft inside, paired with a rich runny yolk and smooth guacamole for incredible texture. Watching swans float by while sipping a custom berry cold brew makes it the ultimate relaxing brunch destination in the Vy\u0161ehrad area.", "name": "Caf\u00e9 Resto Podolka", "transport": "Take tram 2, 3, or 17 to Kublov station, then walk about 2 minutes."}, {"address": "Na Mor\u00e1ni 1957/7, 128 00 Nov\u00e9 M\u011bsto (near Vy\u0161ehrad)", "feature": "\u2b50 4.6 Stars | Located near the riverbank on the northwest side of the Vy\u0161ehrad district, this spot is one of the pioneers of Prague\u0027s specialty coffee scene. With a minimalist aesthetic, it focuses on showcasing light-roast single-origin coffees with exquisite flavors. For brunch, the fresh-to-order sourdough with homemade butter and smoked salmon is highly recommended; the bread is delightfully chewy with a natural tang, while the salmon is rich and buttery. Paired with a pour-over Ethiopian coffee offering fruity and floral notes, it delivers a marvelous balance of flavors.", "name": "I Need Coffee!", "transport": "Take Metro Line B or tram to Karlovo n\u00e1m\u011bst\u00ed station, then walk about 3 minutes."}, {"address": "Sekaninova 488/16, 128 00 Praha 2-Nusle", "feature": "\u2b50 4.7 Stars | Nestled at the foot of Vy\u0161ehrad\u0027s southern slope, this cafe run by a professional roastery features a spacious garden and an industrial-chic interior. Renowned for its fresh brunch offerings, its black truffle wild mushroom Eggs Benedict is a standout\u2014a rich burst of runny egg yolk and truffle aroma with every bite, set atop a crispy-yet-soft English muffin. The velvety cappuccino foam feels like a dense cloud, blending perfectly with the espresso\u0027s dark chocolate finish.", "name": "Coffee Source Nusle", "transport": "Take tram 7, 14, 18, or 24 to Svatoplukova station, then walk about 2 minutes."}, {"address": "Jarom\u00edrova 530/28, 128 00 Praha 2-Nusle", "feature": "\u2b50 4.8 Stars | A famous traditional bakery cafe located at the foot of Vy\u0161ehrad, filled at all hours with the irresistible aroma of freshly baked bread. Brunch highlights include traditional Czech handmade pastries and fresh sandwiches. The traditional Vy\u0161ehrad-style glazed tart (Kol\u00e1\u010d) comes highly recommended\u2014soft and fluffy with a rich, perfectly sweet custard filling. Paired with a rich, aromatic caffe latte, it is one of the most authentic and popular breakfast spots in the area.", "name": "Anton\u00ednovo peka\u0159stv\u00ed (Jarom\u00edrova)", "transport": "Take tram 7, 14, 18, or 24 to Svatoplukova station, then walk about 1 minute."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Vratislavova 28/12, 128 00 Praha 2", "feature": "\u2b50 4.7 stars | Nestled at the foot of Vy\u0161ehrad, U Kroka is a renowned traditional Czech pub-restaurant founded in 1911. Their roasted pork knuckle and tender beef sirloin with dumplings in cream sauce (Sv\u00ed\u010dkov\u00e1) are absolute masterpieces. The pork skin is roasted to an irresistibly crackling crunch, while the meat inside remains juicy and tender. Drizzled with a signature sweet-and-sour cranberry sauce and rich cream sauce, every bite offers complex layers of flavor. With warm service and cozy wooden decor, tables are always in high demand among both tourists and locals. Booking in advance is strongly recommended.", "name": "Restaurace U Kroka (Traditional Czech Bistro)", "transport": "Take tram 7, 14, 18, or 24 to V\u00fdto\u0148 stop, then walk about 5 minutes."}, {"address": "V Pevnosti 16/2, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Tucked along the ancient stone walls of Vy\u0161ehrad, this open-air beer bistro offers breathtaking views of Prague\u0027s Old Town and the Vltava River. It specializes in Balkan-style freshly grilled minced meat skewers (\u010cevab\u010di\u010di) and Czech craft beer. The skewers sizzle with a rich charcoal aroma, perfectly charred on the outside and juicy on the inside. Paired with a cold, crisp Pilsner Urquell, relaxing in the outdoor seating during sunset is the absolute best way to experience Czech slow-life pub culture.", "name": "Hospod\u016flka Na Hradb\u00e1ch (Rampart Bistro)", "transport": "Take Metro Line C to Vy\u0161ehrad station and walk about 8 minutes through Vy\u0161ehrad Park."}, {"address": "Vratislavova 21/4, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | A cozy, authentic Czech pub located near the entrance to the Vy\u0161ehrad walking trail. Local favorites include traditional Czech schnitzel (\u0158\u00edzek) and slow-roasted duck leg with sauerkraut. The duck is slow-roasted until the meat effortlessly falls off the bone, featuring crispy skin, tender juicy meat, and rich flavor. Served alongside smooth mashed potatoes, every bite delivers genuine Bohemian home-cooked comfort. With very affordable prices, it draws a steady stream of food lovers craving classic Czech cuisine.", "name": "Restaurace Pod Vy\u0161ehradem", "transport": "Take tram 7, 14, or 18 to Albertov stop, then walk about 4 minutes."}, {"address": "Vratislavova 36/16, 128 00 Praha 2", "feature": "\u2b50 4.3 stars | Situated next to the statue of \u0160em\u00edk, the legendary horse of Vy\u0161ehrad, this unique bistro serves traditional Czech regional cuisine with a modern twist. Highly recommended is their classic Czech beef goulash (Hov\u011bz\u00ed gul\u00e1\u0161), featuring tender beef chunks bathed in a rich, savory onion gravy, served with fluffy handmade bread dumplings (Knedl\u00edky) that soak up every bit of delicious sauce. The restaurant features a charming green garden court, allowing guests to savor Bohemian flavors in a serene and elegant setting.", "name": "Restaurace U \u0160em\u00edka", "transport": "Take tram 7, 14, 18, or 24 to V\u00fdto\u0148 stop, then walk about 6 minutes."}, {"address": "\u0160tulcova 89/1, 128 00 Praha 2", "feature": "\u2b50 4.2 stars | Located in the heart of Vy\u0161ehrad Park near the Basilica of St. Peter and St. Paul, this refined upscale bistro effortlessly fuses traditional Czech ingredients with modern French culinary techniques. Signature dishes like pan-seared venison steak and red-wine braised short ribs are crowd-pleasers\u2014tender, melt-in-your-mouth juicy, and infused with subtle herbal game notes. Featuring classical Gothic architecture paired with elegant luxury decor, it is the perfect spot for a romantic candlelight dinner after a day of sightseeing.", "name": "Rio\u0027s Vy\u0161ehrad", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk about 10 minutes to the Basilica of St. Peter and St. Paul."}, {"address": "V Pevnosti 159/5, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Housed in the historical Old Burgrave\u0027s House within Vy\u0161ehrad, this heritage cafe-bistro showcases a unique blend of Renaissance and Baroque architecture. In addition to aromatic Czech single-origin coffees and exquisite handmade desserts, light bistro bites like the Prague ham platter and pickled cheese (Nakl\u00e1dan\u00fd Hermel\u00edn) are absolute must-tries. The pickled Camembert-style cheese is smooth on the outside and creamy within, bursting with subtle garlic and chili spice. Paired with local white wine, it makes for a delightful taste experience.", "name": "Kav\u00e1rna U Star\u00e9ho Purkrabstv\u00ed", "transport": "Take Metro Line C to Vy\u0161ehrad station and walk about 7 minutes into the fortress area."}, {"address": "Podolsk\u00e9 n\u00e1b\u0159. 34/6, 147 00 Praha 4", "feature": "\u2b50 4.6 stars | Situated along the Vltava River at the foot of Vy\u0161ehrad, this modern fine bistro is famous for its creative Mediterranean-Czech fusion cuisine. The warm octopus salad and roasted rack of lamb are spectacular; the octopus is tender yet chewy with a crisp outer sear, balanced perfectly by a refreshing homemade lemon-herb dressing. Combining industrial chic with cozy, homelike decor, large floor-to-ceiling windows offer charming river views, making it a hotspot for young crowds and food enthusiasts.", "name": "Rest.", "transport": "Take tram 2, 3, 17, or 21 to Kublov stop, then walk about 3 minutes."}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159. 383/58, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Located near the V\u00fdto\u0148 pier at the foot of Vy\u0161ehrad, this atmospheric bistro and wine bar offers curated European wines and delightful wine-pairing bites. Trying their Flammkuchen (German-style flatbread pizza) and aged cheese and charcuterie platters comes highly recommended. The Flammkuchen features a paper-thin, incredibly crispy crust topped with savory bacon bits and rich sour cream\u2014rich without feeling greasy. Sitting outdoors by the river, sipping chilled white wine while gazing at the grand silhouette of Vy\u0161ehrad Castle, offers an unmatched Bohemian romance.", "name": "Na B\u0159ehu R\u00fdna - V\u00fdto\u0148", "transport": "Take tram 2, 3, 7, or 17 to V\u00fdto\u0148 stop, then walk about 1 minute."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed 383/58, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | Situated along the Vltava River at the foot of Vy\u0161ehrad, this vegan bistro features a fresh organic plant-based buffet and made-to-order acai bowls. Dishes like house-baked brown rice vegetable wraps and nut cheese salads offer rich, layered textures\u2014crisp, refreshing, and subtly herb-infused. Both local joggers and Vy\u0161ehrad visitors love sitting at the outdoor tables to enjoy good food alongside scenic river views.", "name": "Herbivore Vegan Bistro", "transport": "Take tram 2, 3, 7, or 17 to V\u00fdto\u0148 station, then walk for about 3 minutes."}, {"address": "Plaveck\u00e1 12, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | Located near the foot of the Vy\u0161ehrad hill, this highly popular Asian vegan restaurant is a favorite among local plant-based diners. The must-try fried Vietnamese spring rolls have an ultra-crispy shell that crackles with every bite, filled with savory mushrooms and juicy vegetables. The vegan Pho features a delightfully clear, sweet broth paired with chewy rice noodles and fresh herbs, offering a deeply satisfying and cozy meal.", "name": "Loving Hut Plaveck\u00e1", "transport": "Take tram 2, 3, 7, or 17 to V\u00fdto\u0148 station, then walk for about 4 minutes."}, {"address": "Vy\u0161ehradsk\u00e1 320/49, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | Located on Vy\u0161ehradsk\u00e1 Avenue leading to Vy\u0161ehrad, this spot serves traditional North Indian vegetarian and vegan cuisine. Operating as a pay-by-weight buffet, it offers a variety of rich, fragrant Indian curries, creamy chickpea stews, and steamed turmeric rice. The curries are smooth and flavorful, perfectly paired with freshly baked naan. Affordable, nutritious, and filling, it\u2019s a favorite everyday canteen for local students and residents.", "name": "Dhaba Beas Vy\u0161ehradsk\u00e1", "transport": "Take tram 14, 18, or 24 to Botani\u010dka zahrada station, then walk for about 2 minutes."}, {"address": "N\u00e1dra\u017en\u00ed 54/102, 150 00 Praha 5", "feature": "\u2b50 4.7 stars | Just a short stroll across the railway bridge from Vy\u0161ehrad, this exquisite vegan restaurant is famous for its creative plant-based dishes. The signature vegan cheeseburger is impressive, featuring a hearty, juicy beetroot-and-bean patty infused with smoky aromas. The vegan tiramisu is silky, moist, and perfectly recreates the traditional flavor. Outstanding food quality and a hip, cozy ambiance draw countless foodies here after exploring Vy\u0161ehrad.", "name": "Pastva Vegan Restaurant", "transport": "Walk across the railway bridge from Vy\u0161ehrad for about 10 minutes, or take tram 4, 5, 12, or 20 to Zborovsk\u00e1 station."}, {"address": "N\u00e1dra\u017en\u00ed 3, 150 00 Praha 5", "feature": "\u2b50 4.6 stars | Situated near the river bridge by Vy\u0161ehrad, this retro-punk style vegan diner excels at turning classic street food into plant-based delights. Highlights include vegan hot dogs, plant-based cheeseburgers, and traditional Czech fried cheese sandwiches. The plant patties are crispy outside and tender inside, oozing rich vegan cheese flavor\u2014tasting every bit as good as real meat. A massive hit among youth and vegan lovers.", "name": "Eaternia Vegan Bistro", "transport": "Walk down from Vy\u0161ehrad across the railway bridge for about 8 minutes, or take tram 12 or 20 to Plze\u0148sk\u00e1 station."}, {"address": "B\u011blehradsk\u00e1 120, 120 00 Praha 2", "feature": "\u2b50 4.3 stars | Located not far from the Vy\u0161ehrad metro station, this legendary venue was Prague\u0027s very first to combine a vegetarian restaurant with a lounge bar. It serves global vegetarian cuisine, such as vegan quesadillas and veggie Pad Thai. The quesadilla tortilla is grilled to golden perfection, stuffed with melted plant-based cheese and lightly spiced black beans for rich layers of flavor. Complemented by its psychedelic, comfortable decor, it\u0027s a great spot to enjoy nightlife near Vy\u0161ehrad.", "name": "Radost FX Veggie Restaurant", "transport": "Take Metro Line C to I. P. Pavlova station, then walk for about 3 minutes."}, {"address": "Lond\u00fdnsk\u00e1 216/29, 120 00 Praha 2", "feature": "\u2b50 4.7 stars | A trendy vegan bistro northeast of the Vy\u0161ehrad area, specializing in daily-changing light, healthy lunch sets and refined vegan desserts. The vegan tofu patty curry features a rich, savory sauce over tofu that\u0027s golden-crisp outside and silky smooth inside. The handmade vegan cinnamon rolls are an afternoon tea highlight\u2014sweet without being cloying, soft, and moist, drawing crowds of plant-based food lovers.", "name": "Forrest Bistro", "transport": "Take Metro Line C to I. P. Pavlova station, then walk for about 6 minutes."}, {"address": "\u017ditn\u00e1 1431/45, 110 00 Praha 2", "feature": "\u2b50 4.7 stars | An elegant vegan eatery filled with greenery near the Vy\u0161ehrad commercial district, boasting a beautiful courtyard garden. The must-try vegan croissant is crisp on the outside, flaky and layered on the inside with a rich plant-butter aroma. The vegan Eggs Benedict comes topped with a velvety, tangy house-made hollandaise sauce, paired perfectly with aromatic single-origin coffee for an exquisite, comfortable dining experience during your Vy\u0161ehrad trip.", "name": "Palo Verde Bistro", "transport": "Take Metro Line C to I. P. Pavlova station, then walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "V Pevnosti 16/2, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.5 stars | A super popular open-air snack beer garden right along the Vy\u0161ehrad walls. The Balkan-style grilled sausages (Klob\u00e1sa) and meat patties (Pljeskavica) are freshly grilled to order, featuring a slightly crispy, charred exterior that bursts with juicy, spiced goodness with every bite. Paired with a cold Czech draft beer, it\u2019s the perfect spot for locals and tourists to relax and enjoy authentic street food.", "name": "Vy\u0161ehrad Ramparts Open-Air Beer Garden (Hospod\u016fdka Na Hradb\u00e1ch)", "transport": "Take Metro Line C to Vy\u0161ehrad Station, then walk about 8 minutes into the park area."}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 128 00 Praha 2", "feature": "\u2b50 4.6 stars | A wildly popular handmade chimney cake stall located at the riverside market at the foot of Vy\u0161ehrad. Freshly baked, the chimney cakes are coated in powdered sugar and cinnamon, then brushed with rich vanilla butter. Served piping hot, the exterior offers a crunchy bite while the inside remains soft as toast. You can even top it with rich vanilla ice cream or hazelnut cocoa spread\u2014an essential takeaway treat while strolling along the Vltava River.", "name": "N\u00e1plavka Market - Traditional Trdeln\u00edk Stall (Trhy na N\u00e1plavce - Trdeln\u00edk Stall)", "transport": "Take Tram 2, 3, 7, or 17 to V\u00fdto\u0148 Station, then walk about 3 minutes to the riverside market."}, {"address": "V Pevnosti 11, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.2 stars | A street snack kiosk near the historic \u0160pi\u010dka Gate in Vy\u0161ehrad, famous for the traditional Czech comfort food, garlic fried bread (Lango\u0161). The freshly fried bread is golden and crispy, generously brushed with garlic water, drizzled with ketchup, and topped with a thick layer of shredded Czech hard cheese. Crispy on the outside and chewy inside, the savory garlic and creamy cheese explode with flavor\u2014a guilty pleasure you won\u0027t be able to stop eating.", "name": "Vy\u0161ehrad Gate Garlic Lango\u0161 Kiosk (Ob\u010derstven\u00ed U \u0160pi\u010dky)", "transport": "Take Metro Line C to Vy\u0161ehrad Station, then walk 3 minutes past the \u0160pi\u010dka Gate."}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 128 00 Praha 2", "feature": "\u2b50 4.4 stars | A bustling sausage stand at the foot of Vy\u0161ehrad that draws long lines every weekend. Featuring authentic large Czech pork and beef sausages sizzling on the griddle, they have a snapping crispy skin and juicy, hearty meat. Served inside sourdough bread with a generous scoop of sauerkraut and special yellow mustard, it offers a perfectly balanced, savory, and satisfying bite\u2014the most down-to-earth street delicacy in the area.", "name": "Vltava Riverbank Market - Czech Sausage Stand (N\u00e1plavka Klob\u00e1sa Stand)", "transport": "Take Tram 17 to V\u00fdto\u0148 Station; the riverside market area is right there upon getting off."}, {"address": "\u0160tulcova, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.3 stars | A scenic snack kiosk adjacent to the Basilica of St. Peter and St. Paul in Vy\u0161ehrad, serving artisanal gelato made with fresh seasonal fruits and traditional Czech soft-serve ice cream. The ice cream is smooth and velvety; elderflower and wild berry flavors are highly recommended for their refreshing, tangy-sweet balance. Grabbing a cone on a sunny afternoon while strolling amidst lush greenery and Vltava River views is pure bliss.", "name": "Vy\u0161ehrad Basilica Ice Cream Kiosk (Zmrzlina U Baziliky)", "transport": "Take Tram 7, 14, or 18 to Albertov Station, then walk up the hill along the Vy\u0161ehrad pathway for about 10 minutes."}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed, 128 00 Praha 2", "feature": "\u2b50 4.5 stars | A classic snack stand along the riverbank beneath Vy\u0161ehrad, selling the soul food of the Czech Republic\u2014the fried cheese sandwich (Sma\u017een\u00fd S\u00fdr). Thick slices of Edam cheese are breaded and fried to golden crispness, tucked into a soft burger bun spread with homemade tartar sauce. Taking a bite reveals gooey, stretchy melted cheese perfectly blended with a crunchy crust and rich milky aroma\u2014an affordable, beloved favorite among tourists and local youth.", "name": "N\u00e1plavka Riverside - Fried Cheese Burger Stand (N\u00e1plavka Sma\u017een\u00fd S\u00fdr Stand)", "transport": "Take Tram 2, 3, or 17 to V\u00fdto\u0148 Station, then walk down to the riverbank in about 2 minutes."}, {"address": "K Rotund\u011b, 128 00 Praha 2-Vy\u0161ehrad", "feature": "\u2b50 4.1 stars | A mobile food cart perched high in Vy\u0161ehrad Park overlooking stunning red-tiled rooftops, serving irresistible made-to-order Czech crepes (Pala\u010dinky). Thin, soft, and eggy, the crepes are filled with homemade blueberry jam or rich strawberry spread for a perfectly balanced sweetness. On chilly days, pair one with a cup of aromatic mulled wine (Sva\u0159\u00e1k) as you gaze out over the beautiful Vltava River bend\u2014a delight for both taste buds and eyes.", "name": "Vy\u0161ehrad Park Lookout Crepe Cart (Pala\u010dinky \u0026 Sva\u0159\u00e1k Vy\u0161ehrad)", "transport": "Take Metro Line C to Vy\u0161ehrad Station, then walk about 7 minutes to the park lookout platform."}, {"address": "Vratislavova 2/1, 128 00 Praha 2", "feature": "\u2b50 4.3 stars | A classic Czech snack stall near the tram stop at the foot of Vy\u0161ehrad Hill, specializing in traditional Czech potato pancakes (Brambor\u00e1ky). Shredded potatoes are mixed with garlic paste, marjoram, and egg, then fried until golden brown on both sides. Extremely crispy on the outside and soft inside, with a rich garlicky and herbal aroma, served piping hot in paper wrapping\u2014an authentic treat to enjoy on the go.", "name": "Foot of Vy\u0161ehrad Hill Potato Pancake Stall (Brambor\u00e1ky u V\u00fdton\u011b)", "transport": "Take Tram 2, 3, or 17 to V\u00fdto\u0148 Station, then walk about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};
        const themeHex = "#2563eb";
        const cityName = "Prague";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
