ee3\u5927\u7684\u6885\u7530\u5730\u4e0b\u8857\u6771\u5074\u6838\u5fc3\uff0c\u300e\u6cc9\u4e4b\u5ee3\u5834\u300f\u6b77\u53f2\u60a0\u4e45\uff0c\u5728\u7d93\u904e\u5168\u9762\u7ffb\u65b0\u5f8c\uff0c\u4ee5\u6975\u5177\u79d1\u6280\u7f8e\u611f\u7684\u300eWater Tree\u300f\u71c8\u5149\u85dd\u8853\u88dd\u7f6e\u91cd\u5851\u4eae\u76f8\u3002\u9019\u5ea7\u7531\u6578\u5343\u500b LED \u71c8\u73e0\u7d44\u6210\u7684\u5de8\u578b\u767c\u5149\u6a39\uff0c\u80fd\u5448\u73fe\u96a8\u56db\u5b63\u8b8a\u5316\u8207\u6642\u9593\u6d41\u8f49\u7684\u5e7b\u5f69\u5149\u5f71\u79c0\uff0c\u5b9b\u5982\u5922\u5e7b\u7684\u5730\u4e0b\u4ed9\u5883\uff0c\u5438\u5f15\u7121\u6578\u8def\u904e\u904a\u5ba2\u8207\u7576\u5730\u6c11\u773e\u99d0\u8db3\u6253\u5361\u62cd\u7167\u3002", "name": "Whity\u6885\u7530 \u6cc9\u4e4b\u5ee3\u5834 (Whity Umeda Izumi no Hiroba)", "transport": "\u76f4\u901a\u5730\u4e0b\u9435\u8c37\u753a\u7dda\u300e\u6771\u6885\u7530\u7ad9\u300f\uff0c\u7531 Whity \u6885\u7530\u5730\u4e0b\u8857\u76f4\u9054"}, {"address": "\u5927\u962a\u5e9c\u5927\u962a\u5e02\u5317\u5340\u4e2d\u4e4b\u5cf61-1-27", "feature": "\u2b50 4.4\u661f | \u4f4d\u65bc\u6885\u7530\u5357\u5074\u4e2d\u4e4b\u5cf6\u5340\u57df\u7684\u65b0\u53e4\u5178\u4e3b\u7fa9\u7d05\u78da\u5efa\u7bc9\uff0c\u7ae3\u5de5\u65bc1918\u5e74\uff0c\u70ba\u65e5\u672c\u570b\u5bb6\u91cd\u8981\u6587\u5316\u8ca1\u3002\u5f37\u70c8\u7684\u897f\u65b9\u53e4\u5178\u5efa\u7bc9\u98a8\u683c\u3001\u7cbe\u7f8e\u7684\u5713\u9802\u8207\u62f1\u9580\uff0c\u8207\u5468\u570d\u73fe\u4ee3\u9ad8\u6a13\u548c\u4e2d\u4e4b\u5cf6\u6c34\u5cb8\u516c\u5712\u4ea4\u7e54\u6210\u7d55\u7f8e\u666f\u81f4\u3002\u4e0d\u8ad6\u662f\u767d\u5929\u967d\u5149\u4e0b\u7684\u7d05\u78da\u53e4\u8e5f\uff0c\u9084\u662f\u591c\u665a\u9ede\u71c8\u5f8c\u7684\u83ef\u9e97\u8cea\u611f\uff0c\u90fd\u662f\u6975\u5177\u6b50\u98a8\u6d6a\u6f2b\u60c5\u8abf\u7684\u71b1\u9580\u6253\u5361\u52dd\u5730\u3002", "name": "\u5927\u962a\u5e02\u4e2d\u592e\u516c\u6703\u5802 (Osaka City Central Public Hall)", "transport": "\u5f9e\u5730\u4e0b\u9435\u5fa1\u5802\u7b4b\u7dda\u300e\u6dc0\u5c4b\u6a4b\u7ad9\u300f\u6b65\u884c\u7d04 5 \u5206\u9418\uff0c\u6216\u5f9e\u300e\u6885\u7530\u7ad9\u300f\u6b65\u884c\u7d04 12 \u5206\u9418"}, {"address": "\u5927\u962a\u5e9c\u5927\u962a\u5e02\u5317\u5340\u6885\u75303-2-2", "feature": "\u2b50 4.2\u661f | 2024\u5e74\u5168\u65b0\u958b\u5e55\u7684\u6885\u7530\u9802\u7d1a\u65b0\u5730\u6a19\uff0c\u9023\u7d50\u820a\u5927\u962a\u4e2d\u592e\u90f5\u5c40\u539f\u5740\u3002\u9928\u5167\u6253\u9020\u4e86\u9ad8\u9054\u6578\u5c64\u6a13\u7684\u6311\u9ad8\u4e2d\u5ead\uff0c\u642d\u914d\u878d\u5408\u73fe\u4ee3\u7f8e\u5b78\u8207\u65e5\u672c\u50b3\u7d71\u5de5\u85dd\u7684\u9f90\u5927\u6728\u8cea\u8207\u91d1\u5c6c\u85dd\u8853\u88dd\u98fe\uff0c\u9707\u64bc\u611f\u5341\u8db3\u3002\u4e2d\u5ead\u516c\u5171\u7a7a\u9593\u8a2d\u6709\u6975\u5177\u8a2d\u8a08\u611f\u7684\u5de8\u578b\u85dd\u8853\u96d5\u5851\u8207\u4f11\u61a9\u7da0\u610f\u7a7a\u9593\uff0c\u8fc5\u901f\u8e8d\u5347\u70ba\u6885\u7530\u5730\u5340\u6700\u65b0\u6f6e\u3001\u6700\u5177\u8a71\u984c\u6027\u7684\u6587\u9752\u8207\u5efa\u7bc9\u6253\u5361\u71b1\u9ede\u3002", "name": "KITTE\u5927\u962a JP Tower (KITTE Osaka \u0026 JP Tower Osaka)", "transport": "\u76f4\u901a JR\u300e\u5927\u962a\u7ad9\u300f\u897f\u53e3\uff0c\u6b65\u884c\u7d04 1 \u5206\u9418"}], "name": "\u71b1\u9580\u6253\u5361\u52dd\u5730"}}, "name": "\u6885\u7530\u30fb\u5927\u962a\u8eca\u7ad9\u5546\u5708"}};
        const districtContainer = document.getElementById('district-buttons');
        const categoryContainer = document.getElementById('category-buttons');
        const contentArea = document.getElementById('content-area');
        const cityName = "\u5927\u962a";
        let curDist = null, curCat = null;

        // 左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                districtContainer.appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], districtContainer.children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(districtContainer.children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active transition-colors duration-200 shadow-md';
            categoryContainer.classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            categoryContainer.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                categoryContainer.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], categoryContainer.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(categoryContainer.children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200');
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active transition-colors duration-200 shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">此分類目前無資料</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-shadow duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 詳細地址：</span><br>${item.address || '詳見導航'}<br><br>
                                <span class="font-bold text-rose-600">🚇 自由行交通：</span><br>${item.transport || '請參考地圖'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> 開啟地圖導航
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
