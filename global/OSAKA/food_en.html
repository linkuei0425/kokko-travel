        const db = {"bay-area-usj": {"categories": {"cat_1": {"items": [{"address": "Tempozan Marketplace 2F, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | Founded in 1922, Hokkokusei is a historic Western-style restaurant (yoshoku) famed as the birthplace of Japanese omurice. The branch located in Tempozan Naniwa Kuishinbo Yokocho recreates a nostalgic Showa-era atmosphere. Its classic chicken omurice features silky, soft-cooked eggs wrapping fragrant ketchup fried rice, topped with a perfectly balanced sweet-and-sour signature sauce. Melting in your mouth with rich layers of flavor, it has captured the hearts of countless tourists and local foodies alike.", "name": "Hokkokusei Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "Tempozan Marketplace 2F, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.9 Stars | Established in 1910, Jiyuken is one of Osaka\u0027s oldest Western-style restaurants, renowned far and wide for its original \u0027Famous Curry\u0027 (Meibutsu Curry). This signature dish thoroughly mixes piping hot curry sauce into the rice for a moist, creamy texture, topped off with a fresh raw egg right in the center. Stirring the raw egg and special Worcestershire sauce into the rice before eating yields a smooth, rich flavor with a subtly spicy finish, perfectly embodying the traditional heritage flavor passed down from old Namba.", "name": "Jiyuken Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "Tempozan Marketplace 2F, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 Stars | Aizuya is the pioneer of takoyaki, having invented Osaka\u0027s iconic street food back in 1935. Unlike modern takoyaki drizzled with heavy sauce and bonito flakes, Aizuya adheres to traditional methods by infusing flavorful dashi broth directly into the batter and filling each ball with tender octopus pieces. Cooked to a light crisp outside and a rich, melt-in-your-mouth inside, you can enjoy them straight without sauce to savor the deep savory broth and natural sweetness of the octopus.", "name": "Aizuya Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "1-5-25 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Located near Osakako Station, Chikko Men Kobo is an iconic traditional handmade udon shop in the port area. Housed in an elegant space renovated from an old wooden building, the shop kneads its dough fresh by hand every day. The broth for their signature Beef Udon is meticulously simmered using Hokkaido kombu and various bonito flakes, giving it a sweet, rich savory flavor. The udon noodles are wonderfully chewy and bouncy, pairing perfectly with tender, flavorful beef slices for a comforting and unforgettable meal.", "name": "Chikko Men Kobo", "transport": "About a 3-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "3-9-2 Namiyoke, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Founded in 1968, Grill Miyako is a traditional Western-style restaurant known to every local in Osaka\u0027s port area. Its signature Kobe beef stew and thick, juicy premium hamburger steaks are highly acclaimed. The soul of their cooking\u2014a mysterious demiglace sauce\u2014is slow-simmered over two weeks to achieve a deep, rich, and velvety sweet aroma. The beef chunks melt effortlessly in your mouth, delivering the profound culinary craftsmanship of Showa-era yoshoku cuisine.", "name": "Grill Miyako", "transport": "About a 4-minute walk from Bentencho Station on the JR Loop Line or Osaka Metro Chuo Line"}, {"address": "3-8-7 Chikko, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Tancho is a long-standing traditional ramen shop in the Osaka Bay area, famous for its mouthwatering and hearty \u0027Champon Ramen with Chamiton Pork\u0027. High heat is used to stir-fry premium Kagoshima Chamiton pork and a heap of fresh vegetables before simmering them in a rich white broth. The soup combines the natural sweetness of veggies with the deep richness of pork bone broth. Thick, straight traditional noodles absorb all the flavorful broth for a satisfying meal that has been beloved by local residents and dockworkers for decades.", "name": "Ramen Tancho", "transport": "About a 2-minute walk from Exit 2 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "Tempozan Marketplace 2F, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 Stars | Bashoan is a century-old traditional Japanese confectionery (wagashi) shop in Osaka, renowned for its handmade warabimochi (bracken starch jelly). At the Tempozan branch, guests can enjoy grinding fresh soybean powder (kinako) using a traditional stone mill. The freshly made warabimochi is cool, delightfully chewy, and melts in your mouth. Coated with your freshly ground, nutty soybean powder and special black sugar syrup, it offers an elegantly sweet taste of traditional charm\u2014a must-visit dessert spot after exploring the Kaiyukan Aquarium.", "name": "Bashoan Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "Universal Citywalk Osaka 5F, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | Tsuruhashi Fugetsu is a historic okonomiyaki establishment boasting over 70 years of heritage. Although located in the bustling Universal Citywalk area, this branch preserves authentic, traditional pancake-making techniques. Using abundant shredded fresh cabbage and high-quality batter, staff grill the okonomiyaki right at your table grill to produce a crisp outer skin while keeping the inside delightfully soft and juicy. Finished with signature sweet-and-savory sauce, mayonnaise, and dancing bonito flakes, it delivers the ultimate authentic Osaka soul food experience.", "name": "Tsuruhashi Fugetsu Universal Citywalk", "transport": "About a 1-minute walk from Universal City Station on the JR Sakurajima Line (Yumesaki Line)"}], "name": "Historic Local Eateries"}, "cat_2": {"items": [{"address": "1-4-14 Chikko, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 Stars | An immensely popular, cozy American brunch spot near the Kaiyukan Aquarium, run by a friendly foreign owner. Their signature pancakes feature crisp edges with an extremely moist, fluffy center, served with rich whipped cream and fresh fruit that is delightfully sweet without being overwhelming. The grand brunch platter includes crispy bacon, silky scrambled eggs, and custom sausages for ultimate satisfaction. With a cozy interior filled with adorable bear-themed decor, it\u0027s a favorite among both solo travelers and local residents.", "name": "KUMA Kafe", "transport": "Approx. 2-minute walk from Exit 1 of Osakako Station on the Subway Chuo Line"}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Universal Studios Japan)", "feature": "\u2b50 4.3 Stars | A French bistro cafe located right at the entrance of the Hollywood area in Universal Studios Japan, making it the top choice for an early brunch right when the park opens. Offering freshly baked gourmet sandwiches and delicate French pastries, their signature croissant sandwich features a flaky, buttery crust filled with crisp lettuce and thick-cut bacon for rich layers of texture. Exquisite French tart desserts offer a refreshing balance of sweet and tangy flavors, providing an elegant moment of relaxation during your park adventure.", "name": "Beverly Hills Boulangerie", "transport": "Approx. 5-minute walk from Universal-City Station on the JR Sakurajima Line into the park"}, {"address": "3F Universal Citywalk Osaka, 6-2-52 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | A famous Hawaiian brunch brand located in Universal Citywalk Osaka, right outside USJ. Their iconic whipped cream volcano pancakes feature a towering mound of airy, light-as-air whipped cream that melts in your mouth, served alongside freshly made fluffy pancakes and tangy berries\u2014never feeling heavy or greasy. The Eggs Benedict reveals a rich, oozing yolk when sliced, paired with hollandaise sauce and crispy potatoes, making it the ultimate energizing breakfast before entering the park.", "name": "Eggs \u0027n Things Universal Citywalk Osaka", "transport": "Direct access, approx. 1-minute walk from Universal-City Station on the JR Sakurajima Line"}, {"address": "2-6-39 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | An elegant retro cafe located inside the Red Brick Warehouse (GLION MUSEUM) in the Osaka Bay Area, evoking a nostalgic 1920s American aesthetic. Serving refined French brunch options and specialty pour-over coffees, their signature aged beef sandwich features bread toasted to crispy-outside, soft-inside perfection with tender, juicy beef carrying a delightful grilled aroma. Dining among classic vintage cars inside a historic red-brick building makes it a favorite spot for visitors who appreciate aesthetics and artsy vibes.", "name": "CAF\u00c9 1923", "transport": "Approx. 5-minute walk from Exit 4 of Osakako Station on the Subway Chuo Line"}, {"address": "3F Universal Citywalk Osaka, 6-2-52 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A popular dessert cafe specializing in Hawaiian-style souffl\u00e9 and thin pancakes. Made fresh to order, the pancakes are amazingly light and airy with a rich milky flavor, topped generously with tropical fruits like mango, strawberries, and bananas, then drizzled with special coconut cream or maple syrup for a delightfully moist, sweet-and-sour profile. Overflowing with island resort charm, it\u0027s a popular hangout for a relaxed brunch or afternoon tea before or after hitting the park.", "name": "Hawaiian Pancake Factory Universal Citywalk Osaka", "transport": "Direct access, approx. 1-minute walk from Universal-City Station on the JR Sakurajima Line"}, {"address": "2F ITM Building, ATC, 2-1-10 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 Stars | A classic Japanese cafe chain branch located in the Nanko ATC commercial center, overlooking Osaka Bay. Famous for the beloved Nagoya-style brunch culture of \u0027free breakfast with any drink purchase,\u0027 ordering a dark-roast aromatic coffee in the morning comes with freshly toasted thick bread and a boiled egg or egg salad. The toast is crispy on the outside, ultra-soft inside, and spread with rich butter\u2014simple yet exceptionally delicious. Outdoor sea views and spacious booth seats let guests enjoy an affordable, relaxing morning soothed by the ocean breeze.", "name": "Komeda\u0027s Coffee Nanko ATC", "transport": "Directly connected, approx. 3-minute walk from Trade Center-mae Station on the Nanko Port Town Line (New Tram)"}, {"address": "1-6-16 Chikko, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A hidden gem cafe near Tempozan and Kaiyukan Aquarium, serving exquisite American and Japanese Western-style brunch. Their signature thick-cut French toast is soaked thoroughly in egg custard before being seared to golden perfection\u2014delicately tender like pudding inside, infused with rich egg flavor and maple sweetness. Savory dishes like custom Salisbury steak platters are juicy and delicious, beautifully plated for fantastic visual appeal, making this a top choice for a slow-paced brunch while exploring the bay area.", "name": "Cafe\u0026Dining B-SIDE", "transport": "Approx. 3-minute walk from Exit 1 of Osakako Station on the Subway Chuo Line"}, {"address": "3F Universal Citywalk Osaka, 6-2-52 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 Stars | A classic cafe renowned for fresh-baked pastries and its iconic \u0027ChocoCro\u0027 (chocolate croissant), conveniently located near the park. The signature ChocoCro boasts an ultra-crispy, flaky crust filled with warm, gently melted bittersweet chocolate that delivers a satisfying crunch and irresistible aroma in every bite. Morning combo meals pair croissants with rich lattes or fresh juice for a quick, consistent, and great-value option\u2014perfect for refueling fast before heading into Universal Studios.", "name": "St. Marc Cafe Universal Citywalk Osaka", "transport": "Direct access, approx. 1-minute walk from Universal-City Station on the JR Sakurajima Line"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Tsuruhashi Fugetsu is a highly iconic local okonomiyaki specialty restaurant in Osaka. Located in the Universal Citywalk shopping district, this branch offers authentic, traditional Osaka iron-plate delicacies. Loaded with generous helpings of cabbage, it releases a natural sweetness when grilled on the hot teppan iron plate, perfectly complemented by rich house-made bonito flakes and a special savory sauce for a crispy-outside, tender-inside flavor profile. The bustling and cheerful bistro vibe makes it a favorite spot for tourists and local families alike to enjoy hot okonomiyaki and yakisoba paired with an ice-cold beer after a fun day at USJ.", "name": "Tsuruhashi Fugetsu Universal Citywalk", "transport": "About a 1-minute walk from Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | An American seafood bistro themed after the movie \"Forrest Gump\", located inside Universal Citywalk. The decor recreates classic scenes and American country vibes, serving a variety of fresh, flavorful shrimp dishes and handcrafted American cocktails. The signature \"Coconut Shrimp\" and \"Peel \u0027n\u0027 Eat Shrimp\" are highly recommended\u2014crispy and golden on the outside with sweet, tender shrimp inside, paired with special zesty sauces that awaken the palate. With enthusiastic service and lively background music, it is a fantastic choice for a vibrant dining experience.", "name": "Bubba Gump Shrimp Co. Osaka", "transport": "About a 1-minute walk from Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "3F/4F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A world-famous rock-and-roll-themed bistro seamlessly blending American music culture with vibrant local passion. The restaurant showcases rare memorabilia from legendary rock stars while serving juicy, classic American beef burgers, signature ribs, craft beers, and fancy cocktails. Fire-grilled at high temperatures, the beef patties are lightly charred on the outside and bursting with juice on the inside. Paired with rich melted cheese and crispy fries, every bite is pure indulgence\u2014a standout upscale American bistro in the bay area.", "name": "Hard Rock Cafe Universal Citywalk Osaka", "transport": "Directly accessible upon exiting Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "Naniwa Kuishinbo Yokocho 2F, Tempozan Marketplace, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Hailed as the creator of Japanese omurice, Hokkyokusei offers an iconic local specialty that visitors to Osaka should not miss. The Tempozan branch is situated in Naniwa Kuishinbo Yokocho inside the Tempozan Marketplace. Its signature omurice features tender, silky half-cooked egg wrapped around fragrant chicken ketchup fried rice, finished with a secret tomato red sauce. Soft, creamy, and perfectly balanced in sweet and savory flavors, it revives a century-old classic taste beloved by international tourists and Osaka locals alike.", "name": "Hokkyokusei Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "Naniwa Kuishinbo Yokocho 2F, Tempozan Marketplace, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.9 stars | Founded during the Meiji era, Jiyuken is a legendary Osaka institution famed for its unique \"Meibutsu Curry\" (Famous Curry). This branch in the Tempozan bay area offers a nostalgic diner ambience. Unlike traditional Japanese curry where rice and sauce are served separately, Jiyuken mixes its signature spicy curry sauce directly with hot Kochi rice before topping it off with a raw egg nestled in the center. Stirring the raw yolk into the warm curry creates a silky, rich, and mildly spicy texture\u2014an enduring local classic of old-school Osaka cuisine.", "name": "Jiyuken Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Ganko is a renowned local Japanese restaurant and sushi izakaya in the Kansai region. It offers fresh market-direct sashimi, nigiri sushi, tempura, and various Japanese small plates, alongside an extensive selection of sake and shochu. The fresh fish slices are thick, tender, and rich in sweet oils, while the tempura boasts a light, crispy batter without being greasy. The comfortable, authentic Japanese-style atmosphere provides the ideal spot for travelers to unwind with traditional Osaka izakaya culture and authentic Japanese dishes after an exciting day.", "name": "Ganko Universal Citywalk", "transport": "About a 2-minute walk from Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "3F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A California-style pizza bistro founded by Oscar gala chef Wolfgang Puck. Featuring a large wood-fired oven, the crisp, chewy California thin-crust pizzas are made to order and topped with flavorful combinations like tender grilled chicken, smoked salmon, or specialty cheeses. Beyond pizza, the menu includes high-quality pasta dishes, exquisite steaks, and a rich selection of wines. With its stylish yet relaxed vibe, it is a popular modern Western bistro in the bay area.", "name": "Wolfgang Puck Pizza Bar Universal Citywalk Osaka", "transport": "About a 1-minute walk from Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An upscale seafood bistro located in the Universal Citywalk commercial district, specializing in famous live American lobsters and seafood platters. Live Canadian lobsters are showcased in on-site tanks and expertly steamed or baked to lock in their sweet, snappy flavor. Served alongside freshly baked warm Cheddar Bay Biscuits and chilled white wine, it promises a lavish feast. Combining welcoming American casual warmth with refined food and drink culture, it is the top choice for celebrations and gatherings in the bay area.", "name": "Red Lobster Universal Citywalk Osaka", "transport": "About a 2-minute walk from Universal City Station on the JR Sakurajima Line (JR Yumesaki Line)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Universal Studios Japan)", "feature": "\u2b50 4.3 stars | A popular movie-themed restaurant located inside Universal Studios Japan in Osaka, offering high-quality plant-based meat curry rice specifically for vegetarian and plant-based food lovers. The curry sauce is rich and fragrant, with subtle fruity and spicy notes, paired with tender stewed potatoes, carrots, and a thick, soft plant-based patty that easily rivals real meat. Perfect for enjoying a hearty, guilt-free plant-based meal when taking a break from theme park fun, receiving high praise from international tourists and vegetarian diners alike.", "name": "Universal Studios Japan - Studio Stars Restaurant", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 5-minute walk inside the park."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Jurassic Park, Universal Studios Japan)", "feature": "\u2b50 4.1 stars | An adventure-themed restaurant located in the Jurassic Park area, offering exquisite plant-protein meal boxes. Built on a base of fresh lettuce, roasted wild mushrooms, red beans, and nuts, topped with a juicy and chewy plant-based patty, and drizzled with a sweet-and-sour sauce, the dish boasts rich layers of flavor and a refreshing taste. This healthy, guilt-free vegetarian option is not only photogenic but also recharges plant-based explorers in a fun-filled atmosphere.", "name": "Universal Studios Japan - Jurassic Park Discovery Restaurant", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about an 8-minute walk inside the park."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside New York Area, Universal Studios Japan)", "feature": "\u2b50 4.5 stars | The most upscale full-service dining restaurant inside Universal Studios Japan, offering high-end vegetarian set meals tailored for vegan and lacto-ovo vegetarian guests. The chef selects seasonal vegetables and charcoal-grilled wild mushrooms to pair with slow-roasted thick-cut plant-based patties\u2014crispy and slightly charred on the outside, juicy and tender on the inside. The side fresh vegetable salad with house-made vinaigrette is delightfully refreshing. Elegant window views and delicate cuisine leave many visitors celebrating special occasions thoroughly impressed.", "name": "Universal Studios Japan - Park Side Grille", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 6-minute walk inside the park."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside New York Area, Universal Studios Japan)", "feature": "\u2b50 4.2 stars | A cozy pub-style restaurant rich in Irish flair, serving featured vegetarian burgers and fried delicacies. The veggie burger features a thick, juicy plant-based patty topped with crispy onion rings, fresh tomatoes, and crisp lettuce nestled between toasted buns\u2014delivering a delightfully savory and smoky flavor with every bite. Paired with a cold draft beer or non-alcoholic beverage, it is a top choice for international visitors wanting to soak up a merry Irish pub atmosphere while enjoying delicious plant-based food.", "name": "Universal Studios Japan - Finnegan\u0027s Bar \u0026 Grill", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 5-minute walk inside the park."}, {"address": "1F Hotel Universal Port, 1-1-111 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A popular buffet restaurant located inside a hotel adjacent to USJ, highly praised for thoughtfully labeling vegan and vegetarian options. It offers an exceptionally rich selection of plant-based dishes, including freshly steamed seasonal vegetables, mushroom and tofu slow-simmered in dashi, smooth and creamy veggie curry, and various fresh organic salad greens. Light and non-greasy, the dishes preserve the natural sweetness of the ingredients, making it an ideal healthy vegetarian feast for the whole family before or after visiting the park.", "name": "Hotel Universal Port - Cafe Rico Rico", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 3-minute walk."}, {"address": "3F Tempozan Marketplace, 1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A traditional Japanese restaurant inside Tempozan Marketplace, offering exquisite tofu and Shojin Ryori (Buddhist vegetarian cuisine)-style set meals designed specifically for vegetarians. The signature \u0027Yuba Tofu Set\u0027 includes smooth, fresh yuba (tofu skin), vegetable tempura with a crispy coating and tender inside, and aromatic sesame tofu. The light tempura batter is delightfully non-greasy, paired with a custom kelp-based vegetarian dipping sauce that showcases an elegant Kyoto flavor. It is a healthy Japanese delicacy you shouldn\u0027t miss when strolling through the Osaka Bay area.", "name": "Tempozan - Ganko Sushi", "transport": "Osaka Metro Chuo Line Osakako Station (Exit 1), about a 5-minute walk."}, {"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A casual American-style cafe located in the shopping complex outside Universal Studios Japan, featuring vegetarian meals made with carefully selected fresh vegetables from Awaji Island. The popular vegetarian tomato pasta features al dente noodles coated in sauce, paired with roasted eggplant, sweet bell peppers, and zucchini, where garlic aroma blends perfectly with sweet and tangy tomatoes for a delicious taste. The cafe also serves dairy-free and egg-free plant-based desserts and fresh smoothies, loved by many female guests and vegetarian foodies for their light, guilt-free flavors.", "name": "Universal Citywalk - Mother Moon Cafe", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 1-minute walk."}, {"address": "5F Universal Citywalk Osaka, 6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.9 stars | A stylish Chinese restaurant located in Universal Citywalk, offering various tofu and stir-fried vegetable dishes that can be customized for vegetarians. Highly recommended are the \u0027Vegetarian Mapo Tofu\u0027 and \u0027Assorted Vegetable Stir-Fried Noodles\u0027. The tofu is silky and tender with a bold, aromatic Sichuan pepper kick, while the stir-fried noodles are packed with wok hei (smokiness), crisp cabbage, and crunchy wood ear mushrooms. For visitors who enjoy flavorful, piping-hot Chinese vegetarian food, this is a fantastic spot to recharge after a fun day.", "name": "Universal Citywalk - Dragon Red River", "transport": "JR Sakurajima Line (JR Yumesaki Line) Universal City Station, about a 1-minute walk."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Hollywood Area, Universal Studios Japan)", "feature": "\u2b50 4.3 stars | Located in the Hollywood area of Universal Studios Japan, this ultra-popular walk-up dessert shop is a crowd favorite. The most famous offering is the Mario Hat Pancake Sandwich\u2014the fluffy, dense pancake shell has a pleasant chew, filled with rich strawberry whipped cream and fresh fruit slices, delivering a deliciously sweet, creamy bite. The Luigi version features refreshing green apple custard with a balanced sweet-and-sour taste. Its vibrant colors and creative design make it a must-visit spot for photos and sweet treats.", "name": "Mario Cafe \u0026 Store", "transport": "Take the JR Sakurajima Line (JR Yumesaki Line) to Universal-City Station, walk approx. 10 minutes into the park, then head straight down Hollywood Boulevard."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Minion Park, Universal Studios Japan)", "feature": "\u2b50 4.2 stars | An adorable dessert stand located right at the entrance of Minion Park in Universal Studios Japan. Their signature Minion Cookie Sandwich features an extra crispy, fragrant outer cookie rich with butter and egg flavors. Seasonal fillings range from banana ice cream to fruit custard or fruit puffs. Crispy on the outside and coolly smooth inside, the banana and rich whipped cream melt together deliciously\u2014making it a perfect street snack for cooling off and taking photos.", "name": "Delicious Me! The Cookie Kitchen", "transport": "Take the JR Sakurajima Line to Universal-City Station, enter the park, and head straight to the entrance of Minion Park."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Jurassic Park Area, Universal Studios Japan)", "feature": "\u2b50 4.4 stars | The most classic and constantly queued hearty meat snack in USJ\u0027s Jurassic Park area. The gigantic smoked turkey legs feature a golden, lightly charred, temptingly glossy skin. Biting into it reveals crispy skin and tender, juicy meat bursting with smoky hardwood aroma and savory spices. Extremely juicy and filling, it lets adults and kids alike channel their inner caveman\u2014the perfect street food pick-me-up after lots of walking.", "name": "Jurassic Park Smoked Turkey Leg Cart", "transport": "Take the JR Sakurajima Line to Universal-City Station, enter the park, and walk towards the Jurassic Park area."}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (In front of Minion Park, Universal Studios Japan)", "feature": "\u2b50 4.5 stars | Located near Minion Park, this specialized popcorn cart is famous for its unique Banana Caramel flavor. Each popcorn kernel is evenly coated in a crunchy golden caramel shell. One bite releases a warm, sweet caramel aroma fused with refreshing banana fruity notes\u2014sweet without being cloying, and increasingly flavorful as you chew. They also sell limited-edition Minion popcorn buckets that combine great looks with delicious tastes, making it a must-have snack while exploring the park.", "name": "Pop-A-Nana Popcorn Cart", "transport": "Take the JR Sakurajima Line to Universal-City Station, enter the park, and head towards the front of Minion Park."}, {"address": "6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture (Inside TAKOPA, 4F Universal Citywalk Osaka)", "feature": "\u2b50 4.1 stars | A famous shop located inside \u0027TAKOPA Takoyaki Park\u0027 at Universal Citywalk. Kukuru\u0027s takoyaki is best known for its silky, tender texture. The batter is seasoned with rich dashi stock and a touch of white wine, resulting in a delicate, soft outer layer and a creamy, molten center wrapping a large piece of chewy, fresh octopus. Drizzled with signature sweet-and-savory sauce, mayonnaise, and heaps of dancing bonito flakes, each bite offers an explosion of flavor favored by fans of traditional soft-style Osaka takoyaki.", "name": "Takoyaki Dotonbori Kukuru Universal Citywalk", "transport": "Exit at Universal-City Station on the JR Sakurajima Line directly into the 4th floor of Universal Citywalk."}, {"address": "6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture (Inside TAKOPA, 4F Universal Citywalk Osaka)", "feature": "\u2b50 4.0 stars | The Universal Citywalk branch of Aizuya, the pioneer of Osaka takoyaki. Unlike standard takoyaki smothered in sauce and mayo, Aizuya features bite-sized pieces served plain without sauce. The batter is directly seasoned with soy sauce and rich beef dashi broth, creating a lightly charred, fragrant crispy exterior with a piping-hot, savory interior. Each bite delivers tender octopus chunks filled with broth flavor. It remains delicious even when cold\u2014a historic, guilt-free street snack perfect for eating on the go.", "name": "Ganso Takoyaki Aizuya Universal Citywalk", "transport": "Exit at Universal-City Station on the JR Sakurajima Line directly into the 4th floor of Universal Citywalk."}, {"address": "6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture (Inside TAKOPA, 4F Universal Citywalk Osaka)", "feature": "\u2b50 4.2 stars | A branch of the Michelin Bib Gourmand-recommended shop located at Universal Citywalk. Yamachan takes immense pride in its secret dashi batter, slow-simmered for hours with chicken bones, vegetables, and kelp. The takoyaki is grilled to a light golden crisp on the outside, while the inside retains a rich, creamy texture that bursts in your mouth with deep savory broth flavor. The shop recommends trying them completely sauce-free to savor the pure harmony between rich broth and tender octopus.", "name": "Abeno Takoyaki Yamachan Universal Citywalk", "transport": "Exit at Universal-City Station on the JR Sakurajima Line directly into the 4th floor of Universal Citywalk."}, {"address": "1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture (3F Tempozan Marketplace)", "feature": "\u2b50 4.3 stars | A hugely popular gourmet American-style popcorn shop adjacent to the Osaka Aquarium Kaiyukan and Tempozan Giant Ferris Wheel. The shop offers over 30 surprising original flavors, ranging from savory Japanese favorites like mentaiko (spicy cod roe), plum bonito, and natto, to sweet treats like rich caramel and strawberry milk. Made from premium non-GMO corn kernels, each piece pops up plump and round with a light, crispy crunch that won\u0027t get stuck in your teeth. It is a hit both as a stroll snack after visiting the aquarium and as colorful packaged souvenirs.", "name": "Popcorn Papa Tempozan", "transport": "Approx. 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Osaka Bay Area \u0026 Universal Studios"}, "nakanoshima-kitahama": {"categories": {"cat_1": {"items": [{"address": "2-5-2 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Founded in 1702 during the Kyoho era of the Edo period, this legendary eel restaurant boasts a history of over 300 years. The establishment insists on using top-tier domestic eel paired with a secret, rich sauce passed down through generations that is flavorful without being overly sweet. The signature \u0027Osaka Unajyu\u0027 follows traditional Kansai-style preparation\u2014sliced open from the belly and grilled directly over open flames without steaming. The skin is lightly charred and crispy, while the meat remains tender, juicy, and rich in natural oils. Paired with aromatic sauce and high-grade rice with distinct grains, every bite offers an exquisite taste spanning three centuries, highly praised by local business professionals and international tourists alike.", "name": "Honke Shibato", "transport": "About a 2-minute walk from Exit 6 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-3-1 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | Located in the historic district of Kitahama, this premier traditional wagashi (Japanese confectionery) shop was founded at the end of the Edo period. The atmosphere inside feels delightfully vintage, as if time has frozen. The standout signatures are the \u0027Rikyu Manju\u0027 and handmade \u0027Daifuku\u0027, featuring thin, chewy, soft skins filled with sweet paste crafted from Tanba Dainagon red beans\u2014offering an elegant sweetness with a rich bean aroma. Paired with freshly whisked hot Uji matcha, it presents a complex balance of sweet and bitter notes. With only a few seats available, the intimate atmosphere draws lovers of traditional Japanese tea ceremony and classic wagashi culture to make special visits to this historic gem.", "name": "Kikujudo Yoshinobu", "transport": "About a 3-minute walk from Exit 6 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-4-6 Doshomachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Originating in Osaka 200 years ago, this historic restaurant is the birthplace of the famous Japanese dish \u0027Udonsuki\u0027 (udon hotpot). The restaurant carefully selects Soda bonito flakes and Rishiri kelp to simmer a sweet, clear broth, packed with thick, chewy homemade udon noodles, fresh live shrimp, chicken, seasonal vegetables, and clams. Once cooked, the noodles absorb the savory broth, sliding smoothly onto the palate with a rich dashi fragrance. Located on the traditional pharmaceutical street of Doshomachi, the serene atmosphere makes it the ultimate choice for experiencing Osaka\u0027s authentic dashi culture and comforting traditional hotpot cuisine.", "name": "Mimiu Doshomachi", "transport": "About a 3-minute walk from Exit 6 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-6-11 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | Representing the pinnacle of Japanese high-end ryotei dining culture, this establishment was founded here in 1930 by Teiichi Yuki. For decades, it has adhered to the purest traditions of Kaiseki cuisine, displaying ultimate aesthetics from its elegant Sukiya-style architecture and seasonal floral arrangements to its exquisite tableware. The menu features the finest seasonal ingredients, bringing out the sweet umami of dashi and the natural flavors of the ingredients to perfection. The sashimi is sweet and firm, while the grilled dishes are intensely fragrant\u2014each course a masterpiece for both eyes and palate. It stands as the quintessential sanctuary to experience traditional Japanese fine dining.", "name": "Kouraibashi Kitcho Honten", "transport": "About a 3-minute walk from Exit 6 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "1-5-14 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Founded in the Meiji period (1867), this famous restaurant specializes in Kansai-style charcoal-grilled eel. The chefs insist on open-fire grilling using Binchotan charcoal, relying on decades of experience to master the heat precisely while repeatedly turning and basting the eel in a century-old secret sweet-savory sauce. The grilled eel features crispy skin bursting with fatty aromas, while the meat inside remains remarkably tender and juicy. The signature \u0027Unaju\u0027 (eel over rice box) and the savory \u0027Umaki\u0027 (eel wrapped in rolled omelet) are customer favorites, leaving a lingering, rich smoky flavor.", "name": "Unagi Uoi Kitahama", "transport": "About a 2-minute walk from Exit 4 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "Arai Building, 2-1-1 Imabashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Housed inside the Arai Building (a Taisho-era architectural landmark registered as a Tangible Cultural Property), this iconic Osaka patisserie exudes nostalgic splendor with high ceilings, classical stone pillars, and elegant wooden staircases. Emphasizing \u0027harmony between people and nature\u0027, the shop uses premium local Japanese rice flour, Hokkaido black beans, and top-quality fresh cream. The signature \u0027Black Bean Rice Flour Roll Cake\u0027 is incredibly light and moist, with fresh cream that is light and not overly sweet. Paired with dark roast coffee or black tea, it offers an exceptional afternoon tea experience inside a historic landmark.", "name": "Gokan Kitahama Main Store", "transport": "About a 1-minute walk from Exit 2 of Kitahama Station on the Osaka Metro Sakaisuji Line"}, {"address": "4-7-28 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A renowned traditional spot in Kitahama famous for stone-ground 100% buckwheat (Ju-wari) soba noodles. The interior features a refined, minimalist Japanese wooden design creating a calm and comfortable atmosphere. High-quality buckwheat grains sourced daily from across Japan are stone-ground on-site and hand-crafted into noodles. The fine noodles are springy with a rich, natural buckwheat fragrance. The dipping sauce is simmered from top-grade kelp and bonito, delivering a deep, sweet aftertaste. Highly recommended dishes include the flavorful \u0027Kamo-jiru Soba\u0027 (duck dipping noodles) and crispy light \u0027Duck Tempura\u0027, highly praised by local gourmets and office workers.", "name": "Suhari Kitahama", "transport": "About a 3-minute walk from Yodoyabashi Station on the Osaka Metro Midosuji Line / About a 5-minute walk from Kitahama Station on the Sakaisuji Line"}, {"address": "2-4-4 Fushimimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A famous authentic Naniwa Kappo restaurant deeply rooted in the Kitahama district for years, known for sourcing fresh wild seafood daily from the Osaka Central Wholesale Market. The head chef adheres to traditional Kappo craftsmanship, exquisitely serving dishes counter-side. The signature \u0027Seasonal Sashimi Platter\u0027 features firm, sweet fish, while the \u0027Simmered Sea Bream Head\u0027 and \u0027Seasonal Tempura\u0027 bring out the natural flavors of the ingredients to perfection. Combining the warm intimacy of a traditional izakaya with the elegance of a ryotei, it allows diners to enjoy high-level authentic Osaka Kappo cuisine at reasonable prices.", "name": "Kitahama Okimura", "transport": "About a 4-minute walk from Exit 6 of Kitahama Station on the Osaka Metro Sakaisuji Line"}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "2-1-1 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located along the Tosabori River in Kitahama, this minimalist white caf\u00e9 is a favorite riverside spot for tourists and local youth. The outdoor terrace offers direct views of the Nakanoshima City Hall and lush greenery. The signature toast is crispy on the outside and soft on the inside, perfectly paired with a delicate Mont Blanc chestnut tart or rich tiramisu for a well-layered, perfectly balanced sweetness. Sipping a medium-dark roast pour-over coffee in the gentle breeze brings a relaxing and refined experience.", "name": "MOTO COFFEE", "transport": "Approx. 1-minute walk from Exit 26 of Kitahama Station on the Osaka Metro Sakaisuji Line or Keihan Main Line"}, {"address": "2-1-16 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A bold American coffee brand straight from Brooklyn, NY, seamlessly blending New York industrial chic with Osaka\u0027s riverside views. The spacious high-ceiling interior and wooden deck along the river attract countless brunch lovers. Their latte is rich, velvety, and creamy, paired beautifully with freshly baked flaky croissants or warm avocado toast. Whether bathed in morning light or sunset glow, you\u0027ll immerse yourself in trendy energy and a relaxed American vibe.", "name": "Brooklyn Roasting Company Kitahama", "transport": "Approx. 2-minute walk from Exit 22 of Kitahama Station on the Osaka Metro Sakaisuji Line or Keihan Main Line"}, {"address": "2F Osaka Prefectural Nakanoshima Library, 1-2-10 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Tucked inside the Osaka Prefectural Nakanoshima Library\u2014a designated Important Cultural Property\u2014this caf\u00e9 specializes in traditional Nordic open-faced sandwiches (Sm\u00f8rrebr\u00f8d). Fresh local vegetables from West Japan and premium ingredients are layered on dense, chewy rye bread, creating a visual and culinary feast. The classic smoked salmon with dill yogurt is crisp, refreshing, and beautifully balanced. Enjoying brunch inside a century-old building steeped in classical literary charm makes for an elegant, romantic experience.", "name": "Sm\u00f8rrebr\u00f8d Kitchen Nakanoshima", "transport": "Approx. 5-minute walk from Exit 1 of Yodoyabashi Station on the Osaka Metro Midosuji Line, or approx. 3-minute walk from Oebashi Station on the Keihan Nakanoshima Line"}, {"address": "1-2-2 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Hidden in a Kitahama alleyway, this four-story caf\u00e9 converted from an old townhouse features striking blue accents and vintage antique furniture, radiating a whimsical British vibe. The signature Minoh Beer beef curry is deeply aromatic, pairing perfectly with freshly baked homemade scones that are crisp on the outside and warm, moist inside\u2014divine when slathered with butter and house-made jam. The basement and upper floors offer cozy, hideaway-like spots popular among young women and hipsters.", "name": "Spectacle Kitahama", "transport": "Approx. 2-minute walk from Exit 29 of Kitahama Station on the Osaka Metro Sakaisuji Line or Keihan Main Line"}, {"address": "1-5-8 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Styled around American school buses, this renovated caf\u00e9 blends retro industrial chic with warm wooden accents. Highly recommended are their espresso and beautifully poured latte art, offering a silky texture with nutty undertones. The brunch pressed hot sandwich is toasted to perfection\u2014stuffed with melted cheese and thick-cut bacon, savory and juicy in every bite. With its friendly and relaxed atmosphere, it\u0027s a top choice for a vibrant brunch in Kitahama.", "name": "SCHOOL BUS COFFEE STOP Kitahama", "transport": "Approx. 3-minute walk from Exit 30 of Kitahama Station on the Osaka Metro Sakaisuji Line or Keihan Main Line"}, {"address": "1-1-23 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A minimalist pure-white caf\u00e9 directly on the waterfront, specializing in light roast single-origin coffees. Using house-roasted premium beans, they perfectly preserve floral and fruity aromas, yielding a tea-like crispness with an exquisite balance of sweetness and acidity. Pair your brew with freshly baked natural yeast cinnamon rolls or caramel banana pie. The pleasant waterfront deck allows guests to savor specialty coffee amidst shimmering river light.", "name": "Embankment Coffee", "transport": "Approx. 2-minute walk from Exit 26 of Kitahama Station on the Osaka Metro Sakaisuji Line or Keihan Main Line"}, {"address": "Inside Nakanoshima Park, 1-1-29 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A scenic restaurant and caf\u00e9 tucked inside Nakanoshima Park, surrounded by lush trees and afted cocktails, it allows guests to indulge in Nakanoshima\u0027s unique nighttime romance amid a rich artistic ambiance\u2014a favorite among hipsters and tourists alike.", "name": "Nakanoshima Social Eat AWAKE", "transport": "About a 1-minute walk from Exit 1 of Yodoyabashi Station (Midosuji Subway Line) / About a 1-minute walk from Naniwabashi Station (Keihan Nakanoshima Line)"}, {"address": "Inside Nakanoshima Park, 1-1-29 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated by the lush riverside of Nakanoshima Park, this iconic semi-open-air waterfront bistro is renowned for its signature wood-fired pizzas and charcoal-grilled meats. Made-to-order, the pizza crust is crispy with an enticing smoky char, while soft and chewy inside. Paired with juicy roasted chicken and craft beer, it is the ultimate spot for office workers and travelers to relax with a light buzz while enjoying the cool river breeze.", "name": "GARB weeks", "transport": "About a 1-minute walk from Exit 4 of Naniwabashi Station (Keihan Nakanoshima Line) / About a 3-minute walk from Yodoyabashi Station (Midosuji Subway Line)"}, {"address": "1-8-5 Hiranomachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A highly popular Western-style bistro in the Kitahama financial district offering both standing and seated areas. Renowned for great-value fresh seafood tapas and perfectly grilled aged beef dishes, its low-temperature aged steak is crispy on the outside and tender on the inside, overflowing with sweet juices. Paired with an affordable and vast selection of natural wines, it showcases the sophisticated night energy of Kitahama\u0027s business district and is packed every evening.", "name": "Kitahama Diner", "transport": "About a 3-minute walk from Exit 5 of Kitahama Station (Sakaisuji Subway Line)"}, {"address": "2-2-15 Doshomachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A wildly popular, lively bistro known for its timed all-you-can-drink select bottled wines and top-tier charcoal-grilled meats. The slow-grilled Kuroge Wagyu beef and tender duck breast feature a lightly charred exterior with soft, juicy meat. Served with custom savory garlic sauce and refreshing red wine, the rich, addictive flavors and vibrant dining atmosphere make it a huge favorite among young crowds and foodies.", "name": "Sumibi to Wine Kitahama", "transport": "About a 2-minute walk from Exit 6 of Kitahama Station (Sakaisuji Subway Line)"}, {"address": "2-4-4 Fushimimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | An ultimate meat lovers\u0027 bistro dedicated to Kuroge Wagyu and premium meat dishes. The signature low-temperature slow-roasted beef slices are thick yet silky-soft, offering deep flavor when drizzled with a rich red wine reduction. Paired with selected red wines and delicate French-style small plates made with seasonal local veggies, the lingering meat and wine aromas make this a hidden local gem for carnivores.", "name": "Bistro 29 Kitahama", "transport": "About a 3-minute walk from Exit 6 of Kitahama Station (Sakaisuji Subway Line) / About a 5-minute walk from Yodoyabashi Station (Midosuji Subway Line)"}, {"address": "1F, Kitahama K2 Bldg., 2-1-3 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An exquisite bistro boasting stunning outdoor terrace seating along the Tosabori River. It specializes in Italian-French fusion dishes made with local Osaka fresh fish and seasonal vegetables. Pan-seared fish with crispy skin and tender meat paired with rich, sweet seafood broth combine with nighttime river reflections and lights from the Central Public Hall to create a high-quality, romantic feast for both the eyes and tastebuds.", "name": "Buon Grande Aria Waterfront Italian \u0026 French Bistro", "transport": "Directly connected or about a 1-minute walk from Exit 26 of Kitahama Station (Sakaisuji Subway Line / Keihan Main Line)"}, {"address": "2-2-2 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A cozy, hidden gem bistro seamlessly fusing Kansai sake culture with French cuisine. Fresh local sashimi and aged duck meat are paired with delicate French sauces, creating rich, creative, and multi-layered flavors. The owner\u0027s curated Junmai Daiginjo selections enhance the natural sweetness and savory taste of the ingredients, making it a favorite among foodies who love culinary innovation.", "name": "Sake Bistro Den", "transport": "About a 2-minute walk from Exit 6 of Kitahama Station (Sakaisuji Subway Line)"}, {"address": "2-2-11 Imabashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A renowned local establishment blending traditional Osaka Naniwa flavors with a modern Japanese bistro ambiance. It serves crispy, non-greasy Kansai-style kushikatsu, rich and smooth clay-pot beef tendon stewed in savory dashi, and daily fresh sashimi. Paired with top-tier sake sent directly from regional breweries, it embodies Osaka\u0027s genuine local warmth and refined dining philosophy.", "name": "Kitahama Kuramoto", "transport": "About a 1-minute walk from Exit 2 of Kitahama Station (Sakaisuji Subway Line)"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "1F, 2-1-14 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A scenic vegan cafe located along the Kitahama Canal, featuring 100% plant-based cuisine. Signature dishes like the vegan tofu burger and cheesy plant-based taco rice offer a rich, hearty texture with mouthwatering aromas and no soy aftertaste. Paired with flavorful house-made vegan sauces and crisp fresh greens, it is light and refreshing. The outdoor terrace offers sweeping views of Nakanoshima Park and the river, making it a favorite for health-conscious tourists and local trendsetters.", "name": "Optimus Cafe (\u30aa\u30d7\u30c6\u30a3\u30de\u30b9\u30ab\u30d5\u30a7)", "transport": "Approx. 1 min walk from Exit 26 of Kitahama Station (Subway Sakaisuji Line / Keihan Main Line)"}, {"address": "1F/2F, 1-1-28 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Famous for its rainbow-colored, generous salad plates and fresh fruit sandwiches. The shop carefully selects organic, pesticide-free vegetables from across Japan; the crispy, juicy salad plates paired with custom nut dressing leave a delightfully sweet finish. Whole-wheat vegetarian sandwiches are packed with hearty soy protein, avocado, and fresh tomatoes, delivering the pure sweetness of natural ingredients in every bite. With stunning waterfront views, it is Kitahama\u0027s top landmark for morning vegetarian brunch.", "name": "NORTHSHORE Kitahama (\u30ce\u30fc\u30b9\u30b7\u30e7\u30a2 \u5317\u6d5c\u5e97)", "transport": "Approx. 1 min walk from Exit 29 of Kitahama Station (Subway Sakaisuji Line / Keihan Main Line)"}, {"address": "B1F, Osaka City Central Public Hall, 1-1-27 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A retro-chic restaurant located in the basement of the Osaka City Central Public Hall, a Nationally Designated Important Cultural Property. It offers a colorful vegetable curry and grilled seasonal vegetable platter showcasing local organic Kansai produce. The rich, smooth curry sauce is slow-cooked with dozens of spices and sweet onions, delivering a sweet yet spicy kick. Paired with perfectly charred, tender pumpkin, eggplant, and lotus root, vegetarian diners can enjoy a Michelin-level gourmet plant-based meal in an elegant historic setting.", "name": "Nakanoshima Social Eat AWAKE (\u4e2d\u4e4b\u5cf6 \u30bd\u30fc\u30b7\u30e3\u30eb \u30a4\u30fc\u30c8 \u30a2\u30a6\u30a7\u30a4\u30af)", "transport": "Approx. 1 min walk from Exit 1 of Naniwabashi Station (Keihan Nakanoshima Line), or 5 min walk from Exit 1 of Yodoyabashi Station (Subway Midosuji Line)"}, {"address": "1F, 2-1-17 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A stylish cafe along the Tosabori River, known for its freshly made daily handmade vegan donuts. Golden and crispy on the outside, soft and fluffy inside with a delicate aroma of wheat and soy milk, these egg- and dairy-free treats are delightfully non-greasy. Popular flavors like organic matcha and caramel vanilla paired with an oat milk latte make for the perfect strolling sweet after exploring Nakanoshima Park\u2014a true hit with vegans and dessert lovers alike.", "name": "MOUNT Kitahama (\u30de\u30a6\u30f3\u30c8 \u5317\u6d5c)", "transport": "Approx. 2 min walk from Kitahama Station (Subway Sakaisuji Line / Keihan Main Line)"}, {"address": "Inside Nakanoshima Park, 1-1-29 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A scenic restaurant nestled amidst the greenery of Nakanoshima Park, featuring a giant Neapolitan wood-fired oven. It serves an array of delightful vegetarian-friendly options, with the meatless Margherita pizza and grilled seasonal vegetable platter being crowd favorites. The pizza crust is crispy outside, chewy inside, with an enticing smoky aroma, topped with juicy Neapolitan tomato sauce and fresh basil. Dining under the park\u0027s lush canopy offers an exceptionally relaxing experience.", "name": "GARB weeks (\u30ac\u30fc\u30d6\u30a6\u30a3\u30fc\u30af\u30b9)", "transport": "Approx. 1 min walk from Exit 4 of Naniwabashi Station (Keihan Nakanoshima Line), or 3 min walk from Kitahama Station (Keihan Main Line)"}, {"address": "1F, The Kitahama Plaza, 1-7-3 Koraibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A minimalist cafe inside Kitahama Plaza offering a rich selection of meatless light bites and plant-based options. The popular thick-cut avocado sourdough toast uses perfectly ripe, creamy avocados drizzled with sea salt, black pepper, and cold-pressed olive oil, pairing the crispy sourdough with silky avocado for a pure, rich taste. Serving house-roasted specialty coffee customizable with oat milk, it is a daily go-to spot for local office workers and plant-based foodies.", "name": "ELMERS GREEN CAFE (\u30a8\u30eb\u30de\u30fc\u30ba\u30b0\u30ea\u30fc\u30f3\u30ab\u30d5\u30a7)", "transport": "Directly connected to Exit 4 of Kitahama Station (Subway Sakaisuji Line)"}, {"address": "1F, 2-1-1 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A wildly popular trendy cafe located by Naniwa Bridge, famous for its exquisite plant-based light meals and vegan baked goods. The signature house-made organic wheat toast features a light crisp crust and a soft, fluffy interior, served with natural artisan jams. The vegan carrot cake offers a hearty, moist texture infused with natural cinnamon and walnut aromas. Enjoying light bites on the open-air river terrace overlooking the water is the ultimate dream afternoon experience in Nakanoshima/Kitahama.", "name": "MOTO COFFEE (\u30e2\u30c8\u30b3\u30fc\u30d2\u30fc)", "transport": "Approx. 1 min walk from Exit 26 of Kitahama Station (Subway Sakaisuji Line / Keihan Main Line)"}, {"address": "1F/2F, 2-1-17 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A long-established traditional soba noodle restaurant offering great choices for vegetarians seeking authentic Japanese cuisine. The cold soba with vegetable tempura is highly recommended: the handcrafted buckwheat noodles are springy and smooth with a rich wheat aroma, while the light, crispy tempura features seasonal vegetables like pumpkin, shiitake mushroom, shiso leaf, and eggplant. Served with a refreshing kombu and mushroom dashi dipping sauce, it showcases the pinnacle of understated, exquisite Japanese vegetarian dining.", "name": "\u6d6a\u82b1\u854e\u9ea5 \u5317\u6d5c\u5e97 (Naniwa Soba Kitahama)", "transport": "Approx. 1 min walk from Exit 26 of Kitahama Station (Subway Sakaisuji Line / Keihan Main Line)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1-1-7 Imabashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | A famous hotspot housed in a classic historic building. The takeaway counter\u0027s must-buy \u0027Eemon\u0027 black soybean madeleines and seasonal soft-serve ice cream are perfect walking treats. The madeleines feature a crisp exterior and a dense, bouncy center, packed with rich soybean aroma and warm buttery flavor from Tanba black soybeans. Strolling along the Nakanoshima waterfront with one in hand is immensely relaxing, making it a beloved favorite among local office workers and tourists alike.", "name": "GOKAN Kitahama Main Store", "transport": "Approx. 1-minute walk from Exit 3 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "Inside Nakanoshima Park, 1-1-29 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A popular Italian light bite takeaway spot nestled in the lush greenery of Nakanoshima Park, famous for its fresh wood-fired Neapolitan pizzas and artisanal Italian gelato. The pizza crust is crispy on the outside, soft on the inside, and filled with a smoky wheat aroma, while the gelato is exceptionally smooth and creamy. Enjoying a treat while browsing the rose garden in a gentle breeze offers the most authentic outdoor market vibe in Nakanoshima.", "name": "GARB weeks", "transport": "Approx. 3-minute walk from Exit 26 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "2-1-17 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A highly popular fried doughnut and bakery shop along the Tosabori River in Kitahama. Dusted with fine powdered sugar, their doughnuts feature a crispy outer shell that yields to a cloud-like, airy, and delightfully chewy center that never feels greasy. Grabbing a warm, fresh doughnut with an iced latte to enjoy on the riverbank steps is a staple pilgrimage for tourists.", "name": "Mount", "transport": "Approx. 2-minute walk from Exit 22 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1-1-22 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | An artisanal dessert shop hidden in a vintage building, renowned for serving the best takeaway Canel\u00e9s in Kitahama! The outer shell is perfectly caramelized to an ultra-crispy crunch, opening up to a moist, rich custard center infused with vanilla and liquor for a striking contrast of textures. Holding one in hand during a walk, every crunchy bite bursts with sweet fragrance for pure bliss.", "name": "Spectacle KITAHAMA", "transport": "Approx. 2-minute walk from Exit 29 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "2-1-1 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | The most striking minimalist white cafe at the foot of Kitahama Bridge, offering exquisite takeaway baked goods and specialty coffee. The takeaway cinnamon rolls and French croissants come highly recommended; the croissant layers are distinct, light, and shatteringly flaky with a rich buttery aroma, while the cinnamon roll is delightfully fragrant and perfectly sweet without being sticky. Grabbing an order to sit near Naniwa Bridge and admire the Nakanoshima skyline makes for a perfect street stroll experience.", "name": "MOTO COFFEE", "transport": "Right outside Exit 26 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1-1-26 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | An English tearoom located inside a Registered Tangible Cultural Property building, featuring freshly baked classic English scones and handmade pies at its takeaway window. The scones are dense yet soft, packed with rich buttery flavor and a lightly crisp exterior, perfect to pair with clotted cream and jam while walking along. The contrast between its elegant historic facade and enjoying handheld English treats makes it a hot spot for strolling and photo-taking in Nakanoshima.", "name": "Kitahama Retro", "transport": "Approx. 1-minute walk from Exit 26 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1F Hauser Kitahama Bldg., 1-1-9 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A gourmet coffee hub dripping with American industrial style, loved by strollers for its American-style big cookies, bagels, and hot-pressed sandwiches. Freshly baked bagels are satisfyingly chewy, releasing sweet wheat flavors as you chew, while the soft cookies are tender inside with decadent melted chocolate chunks. Taking these generous American snacks to the Nakanoshima waterfront boardwalk lets you fully immerse in Osaka\u0027s uniquely laid-back riverside vibe.", "name": "BROOKLYN ROASTING COMPANY KITAHAMA", "transport": "Approx. 1-minute walk from Exit 22 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1-7-2 Tenma, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | A super popular takeaway street food spot specializing in nostalgic Japanese coppepan (sub rolls), located near Nakanoshima Waterfront Park. The bread itself is extraordinarily soft and pillowy with a delicate milky aroma, filled with savory options like stir-fried noodles and croquettes, or sweet fillings like red bean butter and fruit custard. Overflowing with delicious fillings at every bite, its cute retro packaging and ultimate convenience make it a top hit for picnics and walks in Nakanoshima Park.", "name": "COBATO PAN KOUJOU", "transport": "Approx. 5-minute walk from Tenmabashi Station on the Subway Tanimachi Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Nakanoshima and Kitahama"}, "namba-shinsaibashi": {"categories": {"cat_1": {"items": [{"address": "2-7-27 Nishi-Shinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1922, this is the birthplace of Japanese omurice, housed in a traditional machiya building steeped in decades of history. The signature chicken omurice features distinct, sweet-and-sour ketchup fried rice wrapped in a golden, silky thin egg layer rich with egg flavor. Drizzled with a secret homemade tomato sauce, it delivers an incredibly smooth texture\u2014a nostalgic Osaka classic beloved by both tourists and locals alike.", "name": "Hokkyokusei Shinsaibashi Main Store", "transport": "About a 5-minute walk from Exit 7 of Shinsaibashi Station on the Osaka Metro Midosuji Line"}, {"address": "3-1-34 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.9 stars | Opened in 1910, this is one of Osaka\u0027s oldest Western-style (Yoshoku) restaurants, famous for its unique \u0027Famous Curry\u0027. Hot, rich curry rice and sauce are pre-mixed before a fresh raw egg is cracked right into the center. Breaking the yolk and mixing it in creates an extraordinarily creamy texture that tones down the spice while adding a delightful rich milkiness\u2014a memorable dish full of culinary history.", "name": "Jiyuken Namba Main Store", "transport": "About a 2-minute walk from Exit 11 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-4-15 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A wildly popular okonomiyaki spot in Dotonbori for decades and a multi-year Michelin Bib Gourmand recipient. The signature \u0027Yamaimoyaki\u0027 (Yam Pancake) uses zero flour, relying entirely on 100% grated mountain yam for the batter. Griddled to achieve a lightly seared, crispy exterior and an incredibly soft, melt-in-your-mouth interior, it\u0027s packed with plump scallops and succulent pork\u2014a perfectly balanced sweet-and-savory masterpiece loved by foodies.", "name": "Mizuno Okonomiyaki", "transport": "About a 5-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-6-4 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1929, this is the pioneer of Osaka kushikatsu (deep-fried skewers), complete with its iconic giant angry-boss statue that has become a Dotonbori landmark. Fried in high-quality beef tallow with a fine, light batter, each skewer bites with a satisfying crunch that feels surprisingly non-greasy. Juicy beef, fresh shrimp, and gooey cheese stay tender inside, coming alive when dipped into their signature sweet dipping sauce.", "name": "Kushikatsu Daruma Dotonbori", "transport": "About a 5-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-7-11 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1946 (Showa 21), this historic Kansai-style udon eatery offers an elegant haven amidst the bustling shopping district. The signature Kitsune Udon features a golden broth brewed from Hokkaido kelp and Kyushu mackerel flakes, offering a refined, gentle sweetness. Chewy, bouncy udon noodles soak up the soup alongside two thick, juicy fried tofu patties infused with sweet sauce that burst with flavor in every bite.", "name": "Dotonbori Imai Main Store", "transport": "About a 7-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-4-16 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.8 stars | Established in 1972, this legendary Dotonbori takoyaki stand is famous for its generous, giant octopus chunks. Freshly cooked, the octopus balls feature a slightly crisp exterior and a creamy, gooey Kansai-style soft interior. The star of the show is the huge piece of tender, bouncy octopus inside. Topped with bonito flakes and special sauce, it\u2019s the ultimate local street-food treat to enjoy on the move.", "name": "Honke Otako", "transport": "About a 6-minute walk from Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-9-17 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Founded in 1919, this century-old institution specializes in Kuroge Wagyu sukiyaki and Western cuisine within a sophisticated, Showa-era high-end ryokan ambiance. Exclusively featuring premium female Kuroge Wagyu beef with exquisite marbling, the meat is lightly simmered in a rich sweet-and-savory warishita sauce and dipped in raw egg. Ultra-tender and practically melting on your tongue, it offers an unforgettably luxurious Osaka Wagyu experience.", "name": "Hariju Dotonbori Main Store", "transport": "About a 1-minute walk from Exit 25 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-4F Chibo Dotonbori Bldg., 1-5-5 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in Sennichimae in 1973, Chibo is an iconic okonomiyaki brand renowned across Japan for its theatrical teppan cooking show. Their flagship \u0027Dotonbori-yaki\u0027 is loaded with large shrimp, squid, beef, and pork, cooked to crisp perfection on the outside while staying light and fluffy inside. Finished with a dramatic high-drizzle mayonnaise flourish, the rich combination of savory-sweet sauce and hearty ingredients delivers an explosion of flavor.", "name": "Chibo Dotonbori Building Store", "transport": "About a 5-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}], "name": "Famous Local Classic Eateries"}, "cat_2": {"items": [{"address": "1-2-1 Saiwaicho, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | A famous brunch spot in Osaka that took the city by storm with its ultra-fluffy signature Ricotta Pancakes. Served three layers high, these pancakes wobble gently when brought to your table and melt in your mouth immediately. Rich with vanilla and savory cheese aromas, paired with salted butter and maple syrup, the balance of sweet and savory flavors is mind-blowing\u2014a dream breakfast highly praised by tourists and locals alike.", "name": "Micasadeco \u0026 Cafe Osaka", "transport": "About a 3-minute walk from Exit 26-C of Subway / JR Namba Station"}, {"address": "1-10-28 Nishishinsaibashi, Chuo Ward, Osaka, amba Shopping Street"}, {"address": "Namba EKIKAN, 1-1-21 Shikitsuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A trendy cafe originating from Brooklyn, New York, located in a spacious industrial-style venue beneath the elevated train tracks. The shop selects high-quality fair-trade coffee beans; its espresso is bold and deep, while lattes crafted with steamed milk feature velvety, fine foam. During brunch, they serve handmade bagels and freshly baked American pastries. The bagels are crispy on the outside, soft and chewy on the inside, and spread with thick cream cheese, making them a huge hit with foreign tourists and hipsters.", "name": "Brooklyn Roasting Company Namba EKIKAN", "transport": "About an 8-minute walk from the South Exit of Nankai Electric Railway Namba Station"}, {"address": "4-11-23 Minamisenba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | A West Coast-style American brunch bakery serving additive-free naturally fermented bread baked fresh daily. The popular \u0027Bacon and Sunny-Side Up Egg Pancake\u0027 pairs thick-cut, savory crispy bacon with a soft-boiled egg. Cutting into the yolk to coat the slightly sweet, dense pancake creates a moist, complex, and incredibly smooth sweet-and-savory flavor profile. Paired with house-roasted pour-over coffee, their toast desserts\u2014crispy outside and chewy inside\u2014are a must-try delicacy.", "name": "West Wood Bakers", "transport": "About a 6-minute walk from Exit 3 of Subway Shinsaibashi Station"}, {"address": "1-10-35 Nishishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | A top-tier representative of American brunch and gourmet burgers in Shinsaibashi, highly acclaimed by lovers of American cuisine. The signature burgers feature house-baked natural yeast buns with a lightly crispy, buttery crust. The patties are made from freshly seared coarse-ground beef that bursts with juice upon first bite, offering a tender and meaty texture. Layered with melted cheddar cheese and fresh vegetables, it is a hearty, juicy, and legendary brunch choice in the area.", "name": "Critters Burger", "transport": "About a 3-minute walk from Exit 7 of Subway Shinsaibashi Station"}, {"address": "1-10-1 Nishishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A stylish cafe filled with a minimalist Nordic forest vibe, famous for its thick three-layer souffl\u00e9 pancakes and 3D latte art. The pancakes use delicately whipped meringue, giving them an exceptionally light, fluffy texture that melts like snowflakes in your mouth. Served with fresh fruit and vanilla ice cream, the sweet and tangy flavor avoids feeling greasy, offering pure bliss for both the eyes and tastebuds\u2014a favorite Instagram-worthy brunch spot in the Shinsaibashi shopping district.", "name": "elk Osaka Shinsaibashi", "transport": "About a 4-minute walk from Exit 7 of Subway Shinsaibashi Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1-7-11 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Located in the nostalgic Hozenji Yokocho, this is the premier choice to experience authentic, traditional Osaka \"Naniwa Kappo\" local cuisine. The restaurant perfectly blends traditional Kansai flavors with innovative culinary techniques, featuring seasonal seafood and vegetable dishes elevated by flavorful dashi broth. Richly layered textures, sweet aromatic broth, smooth and non-greasy flavors\u2014every dish showcases supreme craftsmanship. The elegant and peaceful ambiance makes it a favorite among food lovers seeking fine dining and authentic tastes.", "name": "Naniwa Kappo Kigawa", "transport": "About a 5-minute walk from Kintetsu/Hanshin \u0027Osaka-Namba Station\u0027, or a 3-minute walk from Exit 14 of Subway \u0027Namba Station\u0027."}, {"address": "1-1-20 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A super popular, budget-friendly robatayaki izakaya right next to Hozenji Temple. The restaurant offers a wide variety of classic skewers and seafood, mostly priced around 300 yen each. Chefs grill over open charcoal flames in the center and serve piping-hot dishes to guests on long wooden paddles, creating a fun sense of ceremony. Raw oysters and scallops are crispy on the outside and tender inside, bursting with fresh juices, while beef skewers are juicy with a rich charcoal aroma. Paired with a cold beer, it\u0027s an incredibly refreshing and lively experience loved by tourists and local office workers alike.", "name": "Mizukake Chaya (Robatayaki)", "transport": "About a 3-minute walk from Subway Midosuji Line \u0027Namba Station\u0027."}, {"address": "1-5-12 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A classic Japanese yakitori izakaya tucked in the alleys of Namba, famous for high-quality chicken skewers charcoal-grilled to order. The signature \"Shiso Chicken Roll\" features tender, juicy meat balanced by the refreshing fragrance of shiso leaves, while the \"Negima\" (chicken and green onion skewer) offers a rich, charred flavor blended with a savory-sweet sauce. Filled with a joyful and cozy izakaya vibe, reasonable prices, and exceptionally high-quality food, it\u0027s a must-visit local bistro for anyone visiting Namba.", "name": "Nanbantei Namba Main Store", "transport": "About a 2-minute walk from Exit 14 of Subway \u0027Namba Station\u0027."}, {"address": "2-3-15 Sennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A lively food alley complex combining multiple local Osaka food stalls, filled with retro Showa nostalgia and red lanterns. Here, you can order local specialties like kushikatsu (fried skewers), takoyaki, grilled offal, and offal hot pot all in one place. Dishes are made to order: crispy fried skewers paired with custom dipping sauce stimulate the appetite, while hot takoyaki are soft and dense on the inside with a crisp exterior. Full of authentic Osaka street culture, it\u0027s hugely popular among visitors looking for a fun and energetic atmosphere.", "name": "Ura-Namba Torame Yokocho", "transport": "About a 3-minute walk from Exit 5 of Subway/Kintetsu \u0027Nippombashi Station\u0027, or a 5-minute walk from \u0027Namba Station\u0027."}, {"address": "1-5-32 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1925, this legendary Western-style bistro (Yoshoku) in Shinsaibashi seamlessly blends Western cuisine with Osaka\u0027s local food culture. Their signature omurice served with crispy beef cutlet is a must-try: the omurice features silky, tender eggs and rice infused with rich onion-beef demi-glace sauce, while the beef cutlet is crispy on the outside and tender inside. With a strong retro Showa charm and secret recipes passed down through generations, it\u0027s a famous local institution for foodies and tourists alike.", "name": "Meijiken Shinsaibashi", "transport": "About a 3-minute walk from Exit 6 of Subway Midosuji Line \u0027Shinsaibashi Station\u0027."}, {"address": "1-7-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A Michelin-recommended long-established Okonomiyaki restaurant in Dotonbori, specializing in authentic local okonomiyaki and modan-yaki. Made with generous portions of premium cabbage and fresh seafood, it\u0027s grilled until golden and crisp on the outside while staying incredibly soft and airy on the inside. Topped with special savory-sweet sauce, bonito flakes, and mayonnaise, every bite bursts with rich layers of egg aroma and fresh seafood sweetness. Warm tableside service and authentic flavors keep it packed year-round.", "name": "Ajinoya Honten", "transport": "About a 2-minute walk from Exit 14 of Subway \u0027Namba Station\u0027."}, {"address": "1-1-4 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Tucked away in the alleys of Hozenji Temple, this refined kushikatsu bistro elevates Osaka\u0027s beloved street food to fine dining. Featuring Japanese Kuroge Wagyu beef, seasonal seafood, and fresh vegetables lightly coated in an ultra-thin batter before frying. Crisp and light without a hint of grease, the ingredients retain all their natural juices and sweetness inside. Paired with a variety of specialty dipping sauces and curated sake, it offers an elegant and romantic local night experience.", "name": "Kushinobo Hozenji Main Store", "transport": "About a 3-minute walk from Subway \u0027Namba Station\u0027, located within Hozenji Temple grounds."}, {"address": "2-3-2 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A beloved local seafood izakaya in Shinsaibashi, famous for its high value and thick-cut fresh sashimi. The signature \"Assorted Sashimi Platter\" features rich, melt-in-your-mouth fat with fresh, tender textures. The crispy garlic-fried seafood and simmered fish dishes are also packed with rich flavor. With a vibrant, casual bistro atmosphere and affordable regional sake, it\u0027s an incredible spot to experience Osaka\u0027s local late-night izakaya culture.", "name": "Sakaba Anaba Shinsaibashi", "transport": "About a 5-minute walk from Subway \u0027Shinsaibashi Station\u0027 or \u0027Namba Station\u0027."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "1-15-15 Higashishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.8 stars | This is the most highly acclaimed vegan okonomiyaki spot in the Shinsaibashi area among foreign tourists and plant-based diners! Their signature vegan okonomiyaki is cooked to perfection\u2014crispy and golden on the outside, tender and juicy cabbage on the inside\u2014topped with a rich savory-sweet vegan sauce and vegan mayo. The rich depth of flavor easily rivals traditional okonomiyaki. Featuring a fun, rock-and-roll vibe, the owner is ext
