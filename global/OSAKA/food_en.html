remely attentive to gluten-free and vegan needs, allowing plant-based diners to fully savor Osaka\u0027s iconic street food classic.", "name": "OKO Funky Vegan Okonomiyaki", "transport": "About a 5-minute walk from Exit 6 of Shinsaibashi Station on the Osaka Metro Midosuji Line"}, {"address": "1-9-9 Shinmachi, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A hugely popular vegan international restaurant located in the bustling Shinmachi shopping district on the west side of Shinsaibashi. Their famous vegan fried chicken is incredible\u2014golden and crispy on the outside, made from soy protein yet surprisingly juicy and tender inside, paired brilliantly with homemade tartar sauce. Vegan cheese pizzas and brown rice set meals are also top choices. The relaxed, cozy organic wood-toned space draws countless health-conscious locals and tourists alike.", "name": "Paprika Shokudo Vegan Shinsaibashi", "transport": "About a 2-minute walk from Exit 2 of Yotsubashi Station on the Osaka Metro Yotsubashi Line"}, {"address": "4-5-11 Kitakyuhojimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Open since 1991, this is one of Osaka\u0027s oldest vegan Western restaurants, located near the Honmachi and Shinsaibashi commercial districts. Their vegan burger patty is firm, tender, and juicy, smothered in a delicious custom red wine demi-glace. Lunch sets include a generous pesticide-free fresh salad and homemade vegan soup. Don\u0027t miss their handcrafted dairy-free/egg-free vegan cheesecake and apple pie\u2014smooth, rich, and the perfect guilt-free afternoon treat.", "name": "Green Earth Vegan Restaurant", "transport": "About a 4-minute walk from Exit 13 of Honmachi Station on the Osaka Metro Midosuji Line"}, {"address": "1-10-13 Kitahorie, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A trendy spot specializing in vegan Korean cuisine and plant-based sushi, located in the hip Kitahorie area. Highly recommended are their vegan gimbap and plant-based fried chicken. The gimbap features sweet, chewy rice wrapped around pickled radish and homemade plant meat for a crisp, refreshing, and flavorful bite. The vibrant vegan sushi platter is also a social media favorite, offering a guilt-free way to enjoy a Korean-Japanese fusion feast.", "name": "Mercy Vegan Factory - Vegan Korean \u0026 Sushi", "transport": "About a 3-minute walk from Exit 6 of Yotsubashi Station on the Osaka Metro Yotsubashi Line"}, {"address": "1-16-16 Kitahorie, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.7 stars | Tucked away in an alley near Nishi-Shinsaibashi, this specialty vegan curry shop serves up Caribbean and Jamaican-spiced delights. The signature spiced chickpea curry blends proprietary roasted spices into a rich, velvety sauce with a gentle lingering heat, paired wonderfully with fragrant coconut turmeric rice. With relaxed reggae tunes playing in the background, its vibrant atmosphere makes it a hit with plant-based foodies craving bold, flavorful eats.", "name": "Base Island Kitchen - Caribbean Spiced Vegan Curry", "transport": "About a 4-minute walk from Exit 4 of Yotsubashi Station on the Osaka Metro Yotsubashi Line"}, {"address": "1-19-8 Higashishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located in vibrant Higashi-Shinsaibashi, this restaurant focuses on pesticide-free fresh vegetables and vegan Italian dishes. Their vegan wild mushroom truffle risotto comes highly recommended; cooked with high-quality brown rice that absorbs rich mushroom essence and plant milk, it\u0027s creamy, satisfying, and deeply aromatic. The salad bar features a variety of seasonal fresh greens and house-made vegan dressings, perfect for recharging with fresh vitamins after shopping in Shinsaibashi.", "name": "Vegeble Kitchen Shinsaibashi - Healthy Vegan Risotto \u0026 Italian", "transport": "About a 3-minute walk from Exit 6 of Shinsaibashi Station on the Osaka Metro Midosuji Line"}, {"address": "1-3-12 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | An exquisite vegetarian restaurant honoring traditional Kyoto and Osaka temple cuisine (Shojin Ryori). Completely free of animal ingredients and pungent roots (alliums), the broth is simmered slowly from kelp and shiitake mushrooms for a natural sweet savoriness. The signature sesame tofu melts in your mouth with an intensely rich sesame aroma, while seasonal vegetable tempura is light, crispy, and non-greasy. Set in an elegant wooden garden environment, it offers a peaceful retreat for mind and palate right in busy Shinsaibashi.", "name": "Bon Vegan Shojin Ryori Shinsaibashi", "transport": "Direct access from Exit 5 of Shinsaibashi Station on the Osaka Metro Midosuji Line"}, {"address": "1-13-21 Kitahorie, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A vegan and gluten-free cafe centered around coconut products, located near Yotsubashi and Shinsaibashi. Their vegan coconut soft-serve ice cream is remarkably creamy and smooth, filled with fresh coconut aroma without being overly sweet. The vegan gluten-free chocolate cake is rich, deep, moist, and melt-in-your-mouth delicious. Using coconut nectar instead of refined sugars makes it healthy and low-GI, offering a top guilt-free afternoon tea spot for plant-based foodies and dessert lovers alike.", "name": "Cocowell Cafe Shinsaibashi - Coconut Vegan Cafe", "transport": "About a 3-minute walk from Exit 5 of Yotsubashi Station on the Osaka Metro Yotsubashi Line"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "11-19 Nambasennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular shop with long lines in the Sennichimae Shopping Street. The takoyaki here features a slightly crispy outer shell and a rich, creamy, lava-like soup-like texture on the inside. With one bite, piping hot batter wraps around large, bouncy chunks of octopus, drizzled with a secret signature sauce and topped with generous bonito flakes that dance in the steam. Its savory-sweet combination smells incredible. Beloved by both tourists and locals alike, its batter is crafted with a special dashi broth, making it packed with umami flavor even if eaten plain without any sauce.", "name": "Takoyaki Douraku Wanaka Sennichimae Main Store", "transport": "About a 4-minute walk from Nankai Electric Railway \u0027Namba Station\u0027, or a 5-minute walk from Exit 5 of Subway \u0027Nippombashi Station\u0027"}, {"address": "1F Hakua Building, 1-10-5 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | The giant 3D octopus sign above the entrance is one of Dotonbori\u0027s iconic landmarks. Their takoyaki highlights an ultra-soft, melt-in-your-mouth texture, enhanced by a dash of white wine just before finishing for extra aroma. The outer skin practically dissolves on contact, revealing a smooth batter rich with kelp and bonito dashi essence. Inside are giant, pleasantly chewy octopus chunks that burst with sweet juices in every bite. A must-visit spot to experience authentic, silky-soft Osaka takoyaki.", "name": "Takoyaki Kukuru Dotonbori Main Store", "transport": "About a 3-minute walk from Exit 14 of Osaka Metro Midosuji Line \u0027Namba Station\u0027"}, {"address": "1-6-4 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | The exaggerated doll mascot sign is an iconic symbol of Osaka\u0027s kushikatsu culture. The skewer fried food here stands out with its ultra-thin, golden batter fried in special beef tallow, resulting in an exceptionally crispy crunch that feels remarkably non-greasy. Biting through the crisp exterior reveals tender beef, juicy king prawns, or soft rice cakes that retain all their moisture and natural sweetness. Paired with a sweet and tangy signature sauce, its piping-hot, satisfying taste makes it a hit with tourists and office workers after work alike.", "name": "Kushikatsu Daruma Dotonbori", "transport": "About a 5-minute walk from Osaka Metro Midosuji Line \u0027Shinsaibashi Station\u0027 or \u0027Namba Station\u0027"}, {"address": "3-2-28 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A legendary street-walk dessert where every ring of the oven bell draws a long queue. Freshly baked, this cheesecake boasts a cloud-like, fluffy texture that jiggles irresistibly and melts instantly on the tongue, releasing gentle milky notes and rich egg aromas without feeling heavy like traditional dense cheesecake. The bottom is lined with sweet syrup-stewed raisins, offering a sweet-and-sour accent that perfectly balances the velvety cake. Whether enjoyed warm for an airy souffl\u00e9-like feel or chilled for a denser treat, it promises an unforgettable experience.", "name": "Rikuro Ojisan no Mise Namba Main Store", "transport": "About a 1-minute walk from Exit 11 of Osaka Metro Midosuji Line \u0027Namba Station\u0027"}, {"address": "3-6-3 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | The ultimate soul food in the hearts of Kansai locals. Freshly steamed pork buns feature a thick, springy dough with a natural wheat sweetness that soaks up every drop of savory juice. The filling combines premium pork with coarsely chopped onions, delivering a juicy burst of rich savory flavor and sweet onion notes with fantastic bite and aroma. Paired with the provided mustard, the mild spicy kick elevates the rich flavors to a whole new level\u2014a street snack you absolutely cannot miss when visiting Namba.", "name": "551 Horai Ebisubashi Main Store", "transport": "About a 1-minute walk from Exit 11 of Osaka Metro Midosuji Line \u0027Namba Station\u0027"}, {"address": "1-4-15 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A long-established okonomiyaki spot awarded Michelin Bib Gourmand status for consecutive years. Their most famous dish, the \u0027Yamaimo-yaki\u0027 (yam pancake), uses zero flour, relying entirely on 100% freshly grated nagaimo yam batter. Grilled over high heat on a teppan iron griddle, the exterior gets delightfully charred while the inside stays incomparably soft, creamy, and juicy. Packed with thick-cut pork belly and generous seafood like scallops, then brushed with savory-sweet sauce and mayonnaise, its rich layers revolutionize the traditional concept of savory pancakes.", "name": "Mizuno Okonomiyaki", "transport": "About a 5-minute walk from Exit 14 of Osaka Metro Midosuji Line \u0027Namba Station\u0027"}, {"address": "2-18-4 Nishishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located right next to Sankaku Park in youthful Amerikamura, this is a classic street-food favorite for trendy locals and tourists. Using high-quality yam and rich dashi broth in the batter, their takoyaki is exceptionally soft and moist inside. The crowd-favorite \u0027Mayo-net \u0026 Dark Sauce\u0027 option features a drizzle of sweet-and-sour sauce, a light lattice of signature mayo, and a mountain of green onions for a smooth, non-greasy bite. Grab a box, sit along the park railing, and soak in the vibrant street culture for an authentic local Osaka vibe.", "name": "Kogaryu Amerikamura Main Store", "transport": "About a 3-minute walk from Exit 5 of Osaka Metro Yotsubashi Line \u0027Yotsubashi Station\u0027, or a 5-minute walk from Exit 7 of Midosuji Line \u0027Shinsaibashi Station\u0027"}, {"address": "2-11-9 Sennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A renowned taiyaki shop committed to traditional \u0027Ittoyaki\u0027 technique, baking each fish pastry individually over high open flame in single iron molds. The skin is paper-thin and immensely crispy, brimming with a subtle toasted aroma. Whether filled with Hokkaido Tokachi red bean paste or Naruto Kintoki sweet potato puree, the filling is generously packed from head to tail. The Tokachi red bean is delicately sweet and velvety, while the sweet potato filling is smooth and naturally rich. The satisfying crunch of the crispy skin combined with the hot, luscious filling makes it the ultimate treat during a winter walk or evening stroll.", "name": "Naruto Taiyaki Honpo Sennichimae", "transport": "About a 3-minute walk from Exit 5 of Osaka Metro \u0027Nippombashi Station\u0027, or a 5-minute walk from \u0027Namba Station\u0027"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Namba, Shinsaibashi, Dotonbori"}, "nippombashi-kuromon": {"categories": {"cat_1": {"items": [{"address": "2-4-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in the Showa era, this fresh fish and seafood specialty shop is the most iconic landmark for fresh seafood feasts in Kuromon Market. Famous for its thick-cut fresh sashimi, sea urchin, and king crab legs cut on the spot, the fatty tuna melts in your mouth with a rich aroma spreading across your palate. The Spiny Lobster is springy, juicy, and full of sweetness. Featuring a spacious indoor dining area, both tourists and gourmets flock here to experience the most authentic market sashimi culture.", "name": "Kuromon Sanpei", "transport": "Approx. 3 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro Sakaisuji \u0026 Sennichimae Lines"}, {"address": "2-2-20 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A renowned spot for traditional Japanese home cooking and oden, operating for over 40 years. A large, bubbling pot of piping hot oden at the storefront emits a rich bonito broth aroma. The amber-colored soup infuses deeply into every piece of daikon radish and konjac. A single bite of the radish bursts with juicy, velvety tenderness, while the handmade beef tendon is soft, smooth, and richly flavored. Offering the nostalgic warmth of home cooking, both locals and international travelers find comforting, authentic classic flavors here.", "name": "Ishibashi Shokuhin (Sozai)", "transport": "Approx. 4 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-10-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A centennial tofu and soy milk shop founded in the Taisho era. The shop insists on handcrafted production every morning using 100% domestic premium Japanese soybeans. Its signature rich soy milk contains zero added sugar or water, delivering an extraordinarily velvety, smooth texture with a natural, silky bean aroma and sweet finish. Their freshly made fried tofu has a crispy skin and a cloud-like tender interior that melts in your mouth. Pure and additive-free, this supreme flavor deeply wins the hearts of local regulars and health-conscious traditional food lovers.", "name": "Takahashi Tofu Shop", "transport": "Approx. 5 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro"}, {"address": "2-11-2 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A traditional butcher shop and teppanyaki spot specializing in top-tier Kuroge Wagyu and Kobe beef. Customers can personally select beautifully marbled beef, which skilled chefs sear on a high-temperature iron griddle right in front of them. The exterior is lightly charred and fragrant while the interior remains tender and pink. With one bite, the luscious, sweet fats explode in your mouth, offering an incredibly tender texture that barely requires chewing. Simply paired with rock salt and garlic chips, it is the ultimate delicacy\u2014a must-visit spot for meat lovers in Kuromon Market.", "name": "Maruzen Meat Shop (Maruzen Shokuniku-ten)", "transport": "Approx. 5 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro"}, {"address": "1-22-20 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A historic butcher shop with nearly a century of meat craftsmanship, famous for its carefully selected premium female Wagyu beef with fine texture and an exceptionally low melting point. They offer grilled Wagyu skewers and premium Yakiniku slices grilled fresh to order. The seared beef exudes an alluring smoky charcoal aroma and rich juices; each bite is tender, juicy, and flavorful without feeling greasy, showcasing an exquisitely soft and multi-layered meat texture highly praised by local gourmets and international foodies alike.", "name": "Kuromon Manno Sohonten", "transport": "Approx. 2 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro"}, {"address": "1-21-8 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Established in the 1920s, this historic fugu (pufferfish) restaurant specializes in top-grade Torafugu (tiger pufferfish). The signature fugu sashimi is sliced paper-thin and translucent, offering a wonderfully springy texture and delicate sweetness. The fugu hot pot simmers fugu meat, bones, and seasonal vegetables in a rich kombu dashi broth, creating an amazingly flavorful soup. The meal finishes perfectly with fugu zosui (rice porridge cooked in the broth), absorbing all the rich essence into a silky, savory dish. Warmly accompanying generations of locals through Osaka winters, it is the top choice to experience authentic Kansai fugu culture.", "name": "Hamafuji Kuromon", "transport": "Approx. 3 mins walk from Exit 10 of Nipponbashi Station on the Osaka Metro"}, {"address": "2-3-17 Sennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A famous long-queue spot near Nipponbashi Station, renowned for traditional Osaka negiyaki (green onion pancake) and okonomiyaki. Generous amounts of fresh green onions from Kochi Prefecture are piled onto a special batter and grilled until golden and crispy outside, soft and moist inside. Drizzled with a slightly tangy special sauce and soy sauce, every bite bursts with sweet scallions and savory batter. Their pork and seafood okonomiyaki is crispy on the outside and tender inside, filled with crunchy cabbage. The commitment to tradition and sizzling teppan performances attract countless food lovers.", "name": "Fukutaro Main Store", "transport": "Approx. 3 mins walk from Exit 5 of Nipponbashi Station on the Osaka Metro"}, {"address": "1-2-1 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A classic 24-hour traditional ramen shop in the Nipponbashi shopping district, famous locally for its impressively portioned \u0027Pork Soft Bone Ramen\u0027 (Shiawase Ramen). The rich pork bone broth, simmered for hours, is deeply flavorful and savory. The massive pork soft bone topping, slow-braised for hours, turns gelatinous, soft, and jelly-like, melting in your mouth at the slightest touch. Paired with chewy, springy medium-thin noodles, it is the most authentic traditional comfort food choice to satisfy your cravings late at night or early in the morning.", "name": "Hanamaruken Nipponbashi", "transport": "Approx. 3 mins walk from Exits B18/B20 of Nipponbashi Station on the Osaka Metro"}], "name": "Famous Local Heritage Shops"}, "cat_2": {"items": [{"address": "1-9-1 Sennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A famous Showa-style retro cafe founded in 1934 (Showa 9), located just a few minutes\u0027 walk from Nippombashi Station. The interior retains an elegant Western-style and classical atmosphere. It is most famous for its dark roast pour-over coffee, which is extremely rich and fragrant with a unique charcoal-roasted bittersweet aroma. Paired with special thick-cut French toast or fluffy pancakes that are crispy on the outside and soft inside, combining caramel notes with rich butter, it offers the ultimate brunch experience loved by both tourists and long-time Osaka locals.", "name": "Marufuku Coffee Shop Main Store", "transport": "Approx. 3-minute walk from Exit B26 of Nippombashi Station on the Subway Sakaisuji Line"}, {"address": "2-3-2 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located inside the bustling Kuromon Market, this specialized siphon coffee shop is one of the few spots offering a quiet and comfortable space in the market. It serves traditional Japanese breakfast sets, including freshly toasted thick butter toast, a boiled egg, and house-blend coffee. The toast features a crispy crust and a marshmallow-soft interior spread with a generous layer of pure butter. Paired with smooth, perfectly balanced hot coffee, it attracts countless shoppers looking to relax and take a break.", "name": "Kuromon Coffee", "transport": "Approx. 2-minute walk from Exit 10 of Nippombashi Station on the Subway Sennichimae Line"}, {"address": "2-14-31 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Tucked away in a quiet alley next to Kuromon Market, this long-standing traditional kissaten exudes a warm, peaceful, nostalgic atmosphere. Its signature breakfast set is famous for impressively thick toast and bursting egg salad sandwiches. The sandwich features fresh, silky-smooth eggs blended with mayonnaise in a golden ratio, yielding an exceptionally smooth texture that bursts with flavor inside soft bread. Paired with a rich glass of cold brew coffee, it is highly rated by both locals and backpackers.", "name": "Kissaten Mon", "transport": "Approx. 4-minute walk from Exit 10 of Nippombashi Station on the Subway Sakaisuji Line"}, {"address": "2-11-5 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A charming Showa-style cafe located on the edge of the Nipponbashi shopping district, featuring dark wood tones and antique decor that create a serene space. The shop is meticulous about coffee bean roasting, filling the entire venue with the aroma of in-house roasted coffee. Recommended brunch items include their specialty Japanese Neapolitan spaghetti and cheese \u0026 egg toast. The toast is grilled to golden crispness; when sliced open, gooey melted cheese blends seamlessly with rich egg yolk, delivering a savory flavor that keeps you coming back for more. It\u0027s a popular local spot filled with authentic neighborhood charm.", "name": "Coffee Shop Kohaku", "transport": "Approx. 5-minute walk from Exit 5 of Nippombashi Station on the Subway Sakaisuji Line"}, {"address": "1-21-29 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A high-quality chain cafe near Nippombashi Station, highly praised for its charcoal-roasted coffee and made-to-order thick copper-plate pancakes. The signature pancakes are slightly crispy on the outside, moist and fluffy inside, rich with egg and grain aromas. Drizzled with pure maple syrup and topped with rich butter, they are sweet without being cloying. The brunch menu also offers hot-pressed sandwiches and fresh salad sets. With a bright, clean environment, it\u0027s an ideal spot to relax and enjoy a peaceful morning.", "name": "Kohikan Nipponbashi Branch", "transport": "Approx. 1-minute walk from Exit 5 of Nippombashi Station on the Subway Sennichimae Line"}, {"address": "4-11-4 Nipponbashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A modern anime-themed cafe located in the heart of Nipponbashi\u0027s Otaku Road, serving exceptionally high-quality food and coffee. The brunch menu offers hearty portions of house-special omurice and hot-pressed ham \u0026 cheese sandwiches. The silky, flavorful omelet melts in your mouth, perfectly paired with rich tomato sauce and a signature iced latte that blends creamy milk with bittersweet coffee. Highly recommended for both tourists and anime enthusiasts.", "name": "CAFE D-Style Nipponbashi Branch", "transport": "Approx. 5-minute walk from Exit 1-B of Ebisucho Station on the Subway Sakaisuji Line"}, {"address": "1-20-9 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A nostalgic kissaten near the National Bunraku Theatre in Nipponbashi, filled with unpretentious French retro charm. The wildly popular signature breakfast items include handmade pork cutlet (katsu) sandwiches and thick-cut fruit toast. The pork cutlet is fried to golden crispness and bursting with juice, drizzled with a special sweet and sour sauce inside soft bread\u2014rich in layers and extremely satisfying. The coffee is medium-roasted pour-over, smooth and non-astringent, making it a wonderful hidden spot to enjoy a relaxed Osaka morning.", "name": "Kissaten Le Blanc Nipponbashi", "transport": "Approx. 3-minute walk from Exit 7 of Nippombashi Station on the Subway Sennichimae Line"}, {"address": "2-5-10 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A charming, compact cafe right next to the Kuromon Market exit, specializing in house-roasted single-origin pour-over coffee and handmade Japanese breakfast items. The hot-pressed golden tuna and cheese toast features an ultra-crispy crust packed with savory, juicy filling. The owner carefully selects specialty coffee beans from around the world, grinding and brewing them fresh to highlight rich fruity and floral notes\u2014a favorite among hipster tourists who care about coffee quality.", "name": "Namiji Coffee Nipponbashi", "transport": "Approx. 3-minute walk from Exit 10 of Nippombashi Station on the Subway Sakaisuji Line"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1-22-25 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular seafood izakaya inside Kuromon Market, specializing in ultra-fresh seafood dishes. Both tourists and locals highly recommend the \u0027Extra-Large Raw Botan Shrimp\u0027 and \u0027Otoro (Fatty Tuna) Sashimi\u0027. The seafood melts in your mouth with a rich aroma, pairing perfectly with the curated sake selection. They offer on-the-spot slicing and grilling services\u2014plump grilled scallops drizzled with special butter soy sauce burst with savory juices in every bite. A must-visit to experience Osaka\u0027s local seafood pub culture.", "name": "Kuromon Sanpei", "transport": "Osaka Metro Sakaisuji Line / Sennichimae Line \u0027Nipponbashi Station\u0027 Exit 10, about a 2-minute walk"}, {"address": "1-20-11 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A traditional local izakaya oozing retro Showa nostalgia, beloved by Osaka office workers and veteran foodies alike. The must-order local specialty is \u0027Dotesyaki\u0027 (miso-simmered beef tendon), slow-cooked for hours until tender and gelatinous, thoroughly infused with a perfectly balanced sweet and savory red miso sauce. It pairs impeccably with a cold draft beer or local sake. Vibrant and bustling, it showcases authentic Osaka tavern culture.", "name": "Masamuneya Nipponbashi", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 5, about a 1-minute walk"}, {"address": "2-4-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A high-end Wagyu bistro directly operated by a long-established butcher, famous for its top-quality Kuroge Wagyu local specialties. Highlights include the \u0027Freshly Grilled Wagyu Steak Skewers\u0027 and \u0027Seared Wagyu Nigiri\u0027, featuring beautifully marbled pink beef that melts instantly in your mouth, bursting with rich, buttery flavor. Paired with selected red wines and sakes, it offers a luxurious yet accessible feast for meat lovers.", "name": "Manno Meat Kuromon", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 10, about a 3-minute walk"}, {"address": "2-3-7 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A specialty market stall centered around grilled seafood, renowned for its open-flame charcoal-grilled live sea urchin and giant scallops. The signature \u0027Charcoal-Grilled Sea Urchin\u0027 is torched right in its shell to a delicate char, offering a cloud-like, rich texture with zero fishiness. The \u0027Soy Sauce Grilled Scallop\u0027 is juicy and springy, packed with smoky charcoal and ocean flavors. Enjoying fresh seafood with a cold beer standing by the stall is the quintessential Kansai market dining experience.", "name": "Kuromon Uofuku", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 10, about a 3-minute walk"}, {"address": "2-8-16 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A popular casual pub located on the edge of Nipponbashi, featuring traditional Kansai classics and signature oden. The \u0027Oden\u0027 broth is slow-simmered with bonito and kelp stock; the daikon radish fully absorbs the rich broth and melts in your mouth with natural sweetness. The \u0027Kansai-style Grilled Offal\u0027 is crispy on the outside and tender inside, served with an addictive spicy sauce. Friendly service and affordable prices make this a fantastic spot for everyday Osaka pub eats.", "name": "Ajino-mise Nonoya Honten", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 5, about a 4-minute walk"}, {"address": "1-21-8 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A century-old fugu (blowfish) restaurant and an iconic fine-dining spot in Nipponbashi. Signature dishes include \u0027Fugu Hot Pot\u0027 and \u0027Thinly Sliced Fugu Sashimi\u0027. The sashimi boasts an elastic, chewy texture paired with a refined ponzu sauce for a light, elegant flavor. The hot pot soup is intensely flavorful, culminating in a heavenly \u0027Fugu Zosui\u0027 (rice porridge cooked in the broth). Pair it with warm \u0027Hire-zake\u0027 (hot sake infused with grilled fin) for a deeply satisfying, unique culinary experience.", "name": "Kuromon Hamafuji", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 10, about a 2-minute walk"}, {"address": "15-15 Nambasennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | A highly acclaimed standing bar hidden on the border between Nipponbashi and Ura-Namba, famous for creative local dishes and an extensive selection of fine sake. The menu changes daily with items like \u0027Seared Mackerel Pressed Sushi\u0027, \u0027Truffle Potato Salad\u0027, and \u0027Special Stewed Wagyu Tendon\u0027, each prepared with ryotei-level craftsmanship. Paired with handpicked Junmai Ginjo sakes from across Japan, it\u0027s a hotspot for local connoisseurs.", "name": "Tachinomi Ushitora", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 5, about a 4-minute walk"}, {"address": "8-1 Nambasennichimae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A legendary Osaka establishment that created the nationwide famous local dish \u0027Niku-sui\u0027 (beef soup). Legend has it that a comedian requested udon soup without noodles, creating this comforting soul food. Thin slices of tender beef and a soft-boiled poached egg swim in a clear bonito-kelp broth that is sweet and infused with fresh scallions. Served alongside a bowl of \u0027Raw Egg Rice\u0027 (Tamago Kake Gohan) with special soy sauce, this is a top bucket-list dining spot for locals and tourists alike.", "name": "Chitose Honten", "transport": "Osaka Metro \u0027Nipponbashi Station\u0027 Exit 5, about a 5-minute walk"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "2-14-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Tucked away in an alley near Nipponbashi, this takeout-focused vegan workshop specializes in Taiwanese-style vegan egg rolls, rice balls, and handmade oat milk soft French bread. The signature vegan pork floss rice ball features chewy, fragrant rice packed with rich custom vegan cheese and handmade fillings. Its multi-layered savory flavor makes it an absolute hit among vegetarian tourists!", "name": "Mercy Vegan Factory", "transport": "Approx. 5-minute walk from Exit 10 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "1-15-15 Higashishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.7 stars | Located near Nipponbashi and Sennichimae shopping districts, this hugely popular vegetarian teppanyaki spot specializes entirely in vegan and gluten-free okonomiyaki and yakisoba. Made fresh to order, the shredded cabbage in the okonomiyaki is crisp and sweet, drizzled with special egg-free/dairy-free savory-sweet sauce and vegan mayo. Crispy on the outside, soft on the inside, and bursting with aroma, it\u0027s a top choice for tourists!", "name": "OKO - Funky Gourmet Okonomiyaki", "transport": "Approx. 8-minute walk from Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "2-3-3 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A long-standing tofu shop at the heart of Kuromon Market offering completely natural, additive-free vegan soy delicacies. The freshly pressed soy milk is rich, velvety, and deeply aromatic. Pair it with their signature okara (soy pulp) donuts and vegan fried tofu\u2014crispy outside, tender inside\u2014for a healthy street food snack you can\u0027t miss!", "name": "Kuromon Market Inoue Tofu Shop - Rich Soy Milk \u0026 Tofu Snacks", "transport": "Approx. 3-minute walk from Exit 10 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "3-8-14 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated at the entrance of Nipponbashi Electric Town, this location offers certified 100% plant-based vegan curry. The rich Japanese curry sauce contains no animal fats or meat ingredients, delivering a delightfully sweet and fragrant flavor. Served with fried vegetables or soy meat cutlets, it provides a hearty and satisfying meal loved by local office workers and international tourists alike.", "name": "CoCo Ichibanya Nipponbashi 3-chome - Vegan Curry", "transport": "Approx. 4-minute walk from Exit 5 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "2-3-4 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A famous century-old fruit stall inside Kuromon Market offering top-grade Japanese fruits and vegan treats. Freshly sliced Kochi melons and Kumamoto strawberries are bursting with juicy sweetness, alongside warm roasted Beni Haruka sweet potatoes that boast a rich, creamy, butter-like texture. It\u0027s the ultimate natural vegan dessert while exploring the market!", "name": "Kuromon Market Nakagawa Fruit \u0026 Roasted Sweet Potato", "transport": "Approx. 3-minute walk from Exit 10 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "1-16-2 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A hidden gem of a Jamaican-style vegan curry shop near the Nipponbashi shopping district. Their plant-based curries are slow-cooked with natural spices, coconut milk, and plenty of organic vegetables. Served with high-quality brown rice, the sauce features complex layers with a gentle kick of spice. Loaded with chickpeas and seasonal veggies, it offers a healthy, refreshing, and deeply satisfying feast.", "name": "Base Island Kitchen Vegan Curry", "transport": "Approx. 2-minute walk from Exit 8 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "2-8-6 Kozu, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Located just minutes from Nipponbashi Station, this authentic North Indian vegetarian restaurant serves 100% meat-free vegan and plant-milk curry Thali sets. The handmade tandoor-baked vegan roti is crispy outside and soft inside, perfectly paired with fragrant dal (lentil/soy) curry and house vegetable gravies. The complex aromas and subtle spicy kick are simply irresistible!", "name": "Ganga Vegan \u0026 Vegetarian Indian Restaurant Nipponbashi", "transport": "Approx. 5-minute walk from Exit 7 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "1-21-16 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A well-established Chinese restaurant in the Nipponbashi area that has crafted special vegan dumplings and mushroom vegetable buns for veggie lovers. The steamed dumpling wrappers are delightfully chewy, packed with wood ear mushrooms, vermicelli, and cabbage. A bite unleashes a burst of sweet, crisp vegetable juices\u2014a rare find for authentic Chinese vegetarian dim sum in Nipponbashi.", "name": "Rokusenro Nipponbashi Veggie Dim Sum", "transport": "Approx. 2-minute walk from Exit 10 of Kintetsu / Osaka Metro Nipponbashi Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-4-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An immensely popular seafood sashimi and sea urchin shop inside Osaka\u0027s Kuromon Market! Tourists love sitting at the dedicated dining tables to savor fresh-cut fatty tuna chu-toro, seared seafood skewers, and plump raw oysters. The tuna sashimi is rich in healthy fats and tender, while the sea urchin melts in your mouth with an explosion of rich sweetness. Enhanced with a drop of soy sauce, this seafood feast is an absolute must-visit when exploring Kuromon Market.", "name": "Kuromon Sanpei", "transport": "About a 3-minute walk from Exit 10 of Kintetsu / Osaka Metro Nipponbashi Station"}, {"address": "2-11-2 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A famous stall serving freshly grilled Kobe beef and top-grade Kuroge Wagyu skewers! Staff sear the Wagyu on a high-temperature teppan griddle to form a delicate caramelized crust, locking in juices. Crispy on the outside and velvety soft on the inside, the rich fat melts into a deeply savory beef aroma, seasoned perfectly with salt and pepper. It\u0027s a meat-lover\u0027s dream snack while strolling through the market.", "name": "Maruzen Shokunikuten", "transport": "About a 4-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-2-20 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A classic oden shop with over 70 years of history! The huge oden pot at the storefront wafts tempting dashi aromas. Translucent daikon radish fully absorbs the sweet bonito and kelp broth, melting in your mouth with juicy sweetness. The chewy chikuwa and homemade fish cakes offer a satisfying texture and comforting homestyle warmth, loved by locals and international visitors alike.", "name": "Ishibashi Shokuhin", "transport": "About a 3-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-3-7 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A seafood stall famous for grilled jumbo butter scallops and freshly cracked sea urchin! Giant scallops are seared over open flames with butter and Japanese soy sauce, releasing an irresistible aroma. The scallop meat is delightfully springy, sweet, and juicy, blending rich butter with savory soy sauce. The fresh sea urchin is golden, silky, sweet, and free of fishiness\u2014simply irresistible.", "name": "Uofuku", "transport": "About a 3-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-10-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A renowned historic soy product shop in Kuromon Market, highly praised for its ultra-rich fresh soy milk and signature soy milk donuts! The extra-thick soy milk is smooth, creamy, and packed with natural soybean flavor without being overly sweet. The freshly fried soy milk donuts feature a lightly crisp exterior and cloud-like soft interior with a delicate soy fragrance, making it the ultimate guilt-free treat while market walking.", "name": "Takahashi Tofu-ten", "transport": "About a 4-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-11-5 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A live Wagyu searing stall operated directly by a century-old butcher shop! Premium A5-grade Kuroge Wagyu is expertly diced and flash-seared on a teppan griddle before your eyes. Featuring a delightfully smoky outer crust and tender, pink center, every bite bursts with rich fat that melts like butter. Paired with a signature sauce, it draws long lines of eager foodies.", "name": "Kuromon Manno Sounhonten", "transport": "About a 4-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-3-4 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A classic market stall specializing in grilled eel skewers and seafood skewers! Premium eel slices are skewered, coated in a secret ancestral kabayaki sauce, and charcoal-grilled to perfection. The skin is lightly charred and crispy, while the meat remains tender, thick, and juicy, brimming with sweet and savory flavor. They also serve seared jumbo shrimp and squid skewers, making it an iconic local street snack in Kuromon Market.", "name": "Kuromon Uoe", "transport": "About a 3-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}, {"address": "2-2-22 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A popular market stall offering traditional Japanese wagashi sweets and market desserts! The favorites are freshly handmade strawberry daifuku and sweet soy-glazed grilled dango skewers. The daifuku features soft, chewy mochi wrapped around silky red bean paste and a juicy fresh strawberry, offering a delightful sweet-and-sour balance. The grilled dango has a pleasant smoky aroma, crispy exterior, chewy center, and an addictive savory-sweet glaze.", "name": "Kuromon Shokufukuan", "transport": "About a 3-minute walk from Exit 10 of Osaka Metro Nipponbashi Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Nipponbashi and Kuromon Market"}, "osaka-castle": {"categories": {"cat_1": {"items": [{"address": "2-2-22 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | As an iconic curry udon staple in Osaka, Tokumasa Tanimachi has faithfully preserved its secret rich broth for decades. The heart of the dish lies in its thick, velvety mild European-style curry sauce, which opens with a gentle sweetness from fruit and vegetables before unfolding into a deep, warm spice finish. Made from carefully selected wheat, the springy noodles hold the rich curry perfectly. Paired with melt-in-your-mouth tender stewed beef and crispy fried tofu skin, every bite bursts with rich flavor. This exquisite balance of sweet and spicy, combined with chewy noodles, makes it a must-visit traditional local favorite for both neighborhood office workers and tourists.", "name": "Tokumasa Tanimachi", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027, Exit 1, approx. 2 mins walk"}, {"address": "4-3-11 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Tucked away on a stylish street in Tanimachi, this classic Japanese soba spot adheres to traditional stone-mill grinding, freshly making Towari (100% buckwheat) and Ni-Hachi (80% buckwheat) soba daily. The delicate, light-brown noodles are smooth and refreshingly firm, releasing a rich, pure aroma of wheat and buckwheat as you chew. Paired with a dipping sauce slow-simmered with aged soy sauce and bonito flakes, the perfectly balanced savory-sweet tsuyu highlights the sweet grain flavor of the noodles. Their acclaimed shrimp tempura soba features a light, golden, crispy batter encasing sweet, succulent king prawns\u2014a true showcase of traditional Japanese noodle craftsmanship.", "name": "Soba Shuhari Tanimachi", "transport": "Osaka Metro Tanimachi Line/Chuo Line \u0027Tanimachi 4-chome Station\u0027, approx. 3 mins walk"}, {"address": "1-1-17 Tokui-cho, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Exuding classic Showa-era charm, this legendary yoshoku (Western-style Japanese) restaurant seamlessly blends Japanese artisan precision with Western cuisine. The signature beef cutlet (Gyukatsu) uses top-tier Kuroge Wagyu, flash-fried at high heat to achieve a crispy, delicate crust while preserving a tender, luscious pink center that melts in your mouth with every juicy bite. Their specialty hamburg steak, smothered in a rich red wine demi-glace simmered for days, is thick, succulent, and packed with nostalgic flavors cherished by locals for generations.", "name": "Yoshoku Katsui", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027, Exit 4, approx. 5 mins walk"}, {"address": "5-1-11 Uehonmachinishi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Tucked into an alley near Tanimachi 6-chome, Men no Ya is a cherished traditional ramen shop that has served locals for years. Refusing chemical additives, the chef slow-simmers chicken and pork bones with generous amounts of kelp and dried scallops to craft a clear, deeply flavorful soy sauce broth. Their custom handmade medium-thick straight noodles absorb the savory soup beautifully, complemented by perfectly seared, melt-in-your-mouth chashu pork with just the right balance of lean and fat. Refreshing and gentle on the palate, every bowl reflects the timeless dedication to pure, unadulterated ingredients.", "name": "Men no Ya", "transport": "Osaka Metro Tanimachi Line / Nagahori Tsurumi-ryochi Line \u0027Tanimachi 6-chome Station\u0027, approx. 5 mins walk"}, {"address": "2-3-6 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A landmark shop representing Osaka\u0027s classic Takaida-style black shoyu ramen, famous for its bold dark broth and ultra-thick noodles. The pitch-black soup, brewed from chicken bones and robust dark soy sauce, opens with a distinctive smoky aroma and subtle tangy sharpness that softens into a deep, savory sweetness. The thick, udon-like straight noodles offer an amazingly satisfying chew, topped with a mountain of fresh green scallions and old-school thin-sliced chashu. Bold, hearty, and uniquely flavorful, it continues to draw ramen purists on pilgrimage from all over.", "name": "Menya 7.5Hz Tanimachi", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027, Exit 4, approx. 3 mins walk"}, {"address": "6-14-14 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Preserving the old-school warmth and craftsmanship of Osaka\u0027s downtown neighborhood, this classic sushi restaurant showcases master-level handling of seasonal fish. Fresh seafood is hand-selected daily from the market and paired with warm, perfectly balanced red-vinegared sushi rice (akazu shari). Their signature press sushi (oshi-zushi) and Kansai-style kelp-cured mackerel sushi are rich, velvety, and melt seamlessly with the rice into an explosion of umami. Unpretentious yet deeply satisfying, it is celebrated in the Tanimachi district for its heartfelt hospitality and authentic flavors.", "name": "Sushi Kanechika", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 6-chome Station\u0027, Exit 3, approx. 4 mins walk"}, {"address": "6-10-18 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Deeply rooted in the Tanimachi neighborhood, this classic handmade udon shop excels at blending Kansai-style kelp dashi broth with fresh, hand-kneaded noodles. Prepared daily, the smooth noodles offer a delightfully chewy texture and a gentle wheat aroma. The crystal-clear broth, simmered delicately with Hokkaido Rishiri kelp and various dried bonito flakes, tastes naturally sweet, rich, and soothing. Whether enjoying hot tempura udon immersed in flavorful broth or chilled zaru udon dipped in sauce, the interplay of springy noodles and savory soup creates an unforgettable taste of nostalgic tradition.", "name": "Teuchi Udon Nishiki", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 6-chome Station\u0027, approx. 3 mins walk"}, {"address": "1-6-4 Otemae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located near Osaka Castle Park, this classic Showa-style European curry eatery has attracted locals and tourists alike for decades. The signature curry sauce starts with a mountain of onions caramelized over hours, combined with over a dozen secret spices and rich beef broth, slow-simmered to perfection. Smooth and thick, it opens with sweet, rich vegetable notes before building into a gentle, lingering warmth. Served piping hot with golden-crisp tonkatsu or tender beef, every spoonful embodies the passion and heritage of authentic Japanese-style European curry.", "name": "Curry House Morin", "transport": "Osaka Metro Tanimachi Line \u0027Temmabashi Station\u0027 or \u0027Tanimachi 4-chome Station\u0027, approx. 5 mins walk"}], "name": "Local Traditional Famous Restaurants"}, "cat_2": {"items": [{"address": "JO-TERRACE OSAKA, 3-1 Osakajo, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A highly popular bakery cafe located in JO-TERRACE inside Osaka Castle Park, famous for its baked goods made with home-cultivated yeast and rice flour. Its signature giant toast (\"Oban Toast\") and various sweet and savory French breads are crispy on the outside and soft inside, offering a springy, chewy texture with a rich fresh milk aroma in every bite. Affordable brunch sets are available in the morning, served with a cup of freshly brewed aromatic black coffee. Guests can enjoy their meal in the lush green outdoor seating area while gazing at Osaka Castle Keep, making it a favorite relaxed spot for both tourists and local morning runners.", "name": "R Baker Osaka Castle Park", "transport": "Approx. 2-minute walk from JR Osakajokoen Station"}, {"address": "JO-TERRACE OSAKA, 3-1 Osakajo, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A wildly popular Hawaiian brunch brand nestled in a cozy, tree-shaded setting within Osaka Castle Park. The iconic signature item is its mountain-high whip cream pancakes, topped with rich custom whipped cream and fresh fruits. The pancakes are dense, moist, and melt-in-your-mouth, while the whipped cream is light and delicately sweet without being overpowering. Their savory Eggs Benedict is another must-try masterpiece; cutting open the poached egg releases a golden yolk that flows over crispy English muffins and rich Hollandaise sauce for an indulgence like no other.", "name": "Eggs \u0027n Things Osaka Castle Park", "transport": "Approx. 3-minute walk from JR Osakajokoen Station"}, {"address": "1-4-8 Temma, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A retro European-style kissaten cafe near Tenmabashi and the origin of the Tanimachi Line, featuring nostalgic classic wooden interior decor and exquisite vintage wallpaper. Its thick-cut toast brunch comes highly recommended: specially selected bread sliced generously thick, toasted to a golden crisp outside while remaining extraordinarily soft and pillowy inside. A generous spread of fermented butter melts quickly into the bread, filling every bite with rich milky aroma and wheat sweetness. Paired with a dark roast pour-over coffee made using traditional methods, it is the top choice for a morning ritual in the Tanimachi area.", "name": "Cafe Tokiona", "transport": "Approx. 5-minute walk from Tenmabashi Station on the Subway Tanimachi Line"}, {"address": "6-17-27 Tanimachi, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Tucked away in a hip, trendy alley in Tanimachi 6-chome, this minimalist pour-over cafe is a secret sanctuary for local coffee lovers and those seeking a quiet brunch. The shop focuses on home-roasted single-origin pour-over coffee and homemade dessert toasts. The signature toast is slathered with a thick layer of artisanal jam or custom cream cheese; the toast itself is dense with a pleasant chew, releasing more flavor as you chew. Their in-house roasted beans yield a clean, elegant cup with subtle acidity and sweet notes, creating an unforgettable pair with the toast that wins over travelers who appreciate a refined lifestyle.", "name": "Coffee Hut", "transport": "Approx. 4-minute walk from Tanimachi 6-chome Station on the Subway Tanimachi Line"}, {"address": "6-11-30 Tanimachi, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A highly rated bakery cafe situated in the historic neighborhood of Tanimachi 6-chome, filled every morning with the enticing aroma of freshly baked bread. The signature French croissant is crafted with layers of high-purity fermented butter, making the golden crust so flaky that it shatters at the gentlest bite, while the interior maintains a delightfully moist and chewy honeycomb structure packed with rich butter aroma. Dine-in brunch platters served with fresh salad and specialty soup offer a perfect balance of texture and taste that receives rave reviews from local foodies and travelers alike.", "name": "Boulangerie Aimer", "transport": "Approx. 3-minute walk from Tanimachi 6-chome Station on the Subway Tanimachi Line"}, {"address": "1-16-18 Morinomiya Chuo, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A specialty coffee brand originating from Virginia, USA, located right next to Morinomiya Station on the south side of Osaka Castle Park\u2014making it an ideal stop for a relaxed brunch after exercise or a walk. The shop\u0027s highlights include Nitro cold brew coffee and freshly baked handmade scones. The Nitro cold brew features a creamy, silky texture with micro-bubbles that bring out the natural sweetness of the coffee. The freshly baked scones are crispy outside and moistly crumbly inside, paired perfectly with custom cinnamon rolls or savory quiche brunch platters. Packed with hearty American flavor, it is very popular among tourists and families.", "name": "Greenberry\u0027s Coffee Morinomiya", "transport": "Approx. 2-minute walk from JR/Subway Morinomiya Station"}, {"address": "1-1-10 Uchihonmachi, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | An iconic and immensely popular bakery in Tanimachi 4-chome, where locals, office workers, and tourists line up early every morning for brunch. The bakery takes flour selection and fermentation time very seriously. Its famous Mentaiko baguette boasts a hard, crispy crust stuffed generously with savory, rich mentaiko (spicy cod roe) spread, offering a fantastic contrast between popping flavorful roe and chewy bread. Meanwhile, the custard cream bun features a silky-smooth cream filling with balanced sweetness. Paired with carefully selected hot coffee, this is one of Tanimachi\u0027s ultimate local brunch spots.", "name": "Boulangerie gouts Tanimachi 4-chome", "transport": "Approx. 2-minute walk from Tanimachi 4-chome Station on the Subway Tanimachi Line"}, {"address": "KEIHAN CITY MALL 1F, 1-1 Temmabashikyo-machi, Chuo-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An exquisite dessert cafe on the 1st floor of Keihan City Mall at Tenmabashi, taking social media by storm with its creative and hyper-realistic fruit-shaped cakes. The most popular peach and apple cakes feature a smooth chocolate shell concealing sweet and tangy fruit jam paired with velvety mousse inside, providing rich flavor layers and perfectly balanced sweetness. The cafe also serves specialty cold brew coffee and custom drinks. Enjoying an afternoon dessert brunch in its chic, minimalist seating area is hugely popular with social media enthusiasts and travelers looking for refined sweets.", "name": "Fujifrance", "transport": "Directly connected to Tenmabashi Station on the Subway Tanimachi Line"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "2-3-25 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A well-known classic teppanyaki gastropub located in Tanimachi 6-chome, frequented by many celebrities and movie stars. The most popular menu items are the \u0027Creative Specialty Taro Okonomiyaki\u0027 and \u0027Kimchi Cheese Modern-yaki.\u0027 The crust is seared until golden and crisp, while the inside is loaded with soft, fluffy taro paste and piping-hot melted cheese, offering an intensely rich, milky flavor and multifaceted textures. Combining traditional okonomiyaki with innovative ingredients, this local specialty is loved by locals and draws countless international tourists seeking a warm, nostalgic atmosphere and delicious flavors.", "name": "Fusaya Honten", "transport": "Approx. 2-minute walk from Exit 4 of Tanimachi 6-chome Station on the Osaka Metro Tanimachi Line"}, {"address": "2-2-1 Yariyacho, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A Michelin-starred top innovative gastropub in Osaka, renowned for its exquisite dishes combining Spanish techniques with Japanese ingredients. Signature items like \u0027Cold Smoked Wagyu Beef with Seasonal Vegetables\u0027 and various characteristic foam soups are light, airy, and bursting with natural sweetness. The chef masterfully controls the temperature and texture contrasts of every dish, from crisp seasonal vegetables to melt-in-your-mouth premium Wagyu, offering a sensational visual and dining experience. Its luxurious yet relaxed ambiance earns glowing reviews from tourists and couples who love fine French and modern cuisine.", "name": "Fujiya 1988", "transport": "Approx. 5-minute walk from Exit 6 of Tanimachi 4-chome Station on the Osaka Metro Tanimachi/Chuo Lines"}, {"address": "3-2-12 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A highly popular casual seafood gastropub in the Tanimachi area, serving fresh seasonal seafood delivered daily from the Central Market. The must-order \u0027Assorted Sashimi Platter\u0027 features thick, succulent slices with rich fats and a natural springy texture, paired with lightly torched scallops for a delightful aroma that keeps you coming back for more. Offering dozens of local Japanese sakes and regional shochu at wallet-friendly prices, its lively atmosphere makes it a top choice for Tanimachi office workers unwinding after work and tourists looking for an authentic Osaka izakaya experience.", "name": "Sake to Sakana Tanimachi Niba", "transport": "Approx. 3-minute walk from Exit 1 of Tanimachi 4-chome Station on the Osaka Metro Tanimachi Line"}, {"address": "1-16-22 Morinomiya Chuo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located near Osaka Castle Park, this specialty spot serves ultimate curry udon and local side dishes. The signature \u0027Specialty Curry Udon\u0027 features a smooth, rich broth with a subtle sweetness and a satisfying spicy kick, paired with springy, silky handmade udon noodles that cling perfectly to the soup. Accompanied by freshly fried, golden-crisp beef skewers or fried shrimp, the contrast between crispy exterior and tender interior is exceptional. Thanks to its convenient location and authentic taste, it\u0027s a great spot to recharge with hearty local noodles and drinks after visiting Osaka Castle Park.", "name": "Tokumasa Morinomiya Branch", "transport": "Approx. 1-minute walk from Exit 7 of Morinomiya Station on the JR Loop Line / Osaka Metro"}, {"address": "JO-TERRACE OSAKA E TERA 2F, 3-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A high-end Japanese-Western gastropub located inside JO-TERRACE in Osaka Castle Park. The house signature \u0027Fried Wagyu Beef Cutlet\u0027 uses premium Kuroge Wagyu, coated in a thin, crispy batter with an alluring pink center\u2014extremely tender and juicy, elevated further when dipped in special black sauce. Diners can enjoy views of Osaka Castle Park\u0027s lush greenery from the warm, bright interior, pairing traditional Yoshoku dishes perfectly with selected red wines. It\u0027s an ideal spot for tourists seeking a luxurious yet cozy lunch or dinner around Osaka Castle.", "name": "Yoshoku Katsui JO-TERRACE OSAKA", "transport": "Approx. 3-minute walk from Osakajokoen Station on the JR Loop Line"}, {"address": "5-6-4 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A local tempura seafood gastropub that won the National Tendon Gold Award. The signature \u0027Seafood Tempura Donburi\u0027 and various freshly fried dishes are cooked using high-temperature aromatic sesame oil. The batter is light and crispy without being greasy, while plump, juicy prawns and conger eel inside deliver a satisfying crunch with every bite. In the evening, it turns into a vibrant local izakaya offering fantastic-value seafood stir-fries and sake pairings, popular with both locals and foodies.", "name": "Ichimi Zen Tanimachi", "transport": "Approx. 4-minute walk from Exit 6 of Tanimachi 6-chome Station on the Osaka Metro Tanimachi / Nagahori Tsurumi-ryokuchi Lines"}, {"address": "3-4-9 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Hidden in the alleys of Tanimachi, this local sake gastropub exudes classic Japanese charm. It highlights selected craft sakes from across Japan paired with traditional Kansai regional cuisine. A must-try is the \u0027Kansai-Style Donabe Stewed Kuroge Wagyu Beef Tendon,\u0027 slow-simmered until melt-in-your-mouth tender, absorbing a rich, sweet-savory broth. Pair it with crisp-on-the-outside, tender-on-the-inside \u0027Grilled Duck and Green Onion Skewers\u0027 for an unforgettable combination. The rustic wooden decor and intimate setting offer a quiet escape from busy commercial districts to experience Osaka\u0027s unique nightlife and sake pairings.", "name": "Tanimachi Kura", "transport": "Approx. 3-minute walk from Exit 4 of Tanimachi 4-chome Station on the Osaka Metro Tanimachi Line"}, {"address": "6-3-26 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A retro-chic casual gastropub showcasing the nostalgic shopping street style of Tanimachi 6-chome. The menu features creative Osaka dishes and traditional snacks, including the soft and juicy \u0027Torched Cheese Mentaiko Tamagoyaki,\u0027 where egg aroma and spicy-savory mentaiko burst in your mouth. Pair it with the ultra-crispy \u0027Old-school Fried Ham Cutlet\u0027 for a rich aroma. With a relaxed layout offering both standing and seated areas, it attracts young crowds and foreign visitors looking to enjoy affordable, down-to-earth local nightlife.", "name": "Taishu Sakaba Taniroku Stand", "transport": "Approx. 2-minute walk from Exit 3 of Tanimachi 6-chome Station on the Osaka Metro Tanimachi Line"}], "name": "Specialty Gastropubs \u0026 Local Dishes"}, "cat_4": {"items": [{"address": "4-2-9 Kitakyuhojimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | Osaka\u0027s oldest vegan restaurant! Famous for its signature veggie burgers and vegetable pizzas featuring rich, multi-layered flavors. The crispy handmade crust paired with rich plant-based cheese is delightfully savory without any raw vegetarian taste, making it a favorite among international tourists and health-conscious locals alike.", "name": "Green Earth Vegan Restaurant", "transport": "Approx. 10 mins walk from Tanimachi 4-chome Station (Osaka Metro Tanimachi/Chuo Line), or 5 mins walk from Exit 15 of Hommachi Station"}, {"address": "1-5-7 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | A cozy cafe specializing in organic brown rice and seasonal vegetables. Their signature organic brown rice set meal features delightfully chewy, aromatic brown rice served alongside tender, flavorful simmered seasonal root vegetables and house-brewed miso soup. Gentle, comforting, and packed with dietary fiber, it\u0027s a beloved spot for local office workers and tourists in the Tanimachi area.", "name": "Genmai Cafe Minori", "transport": "2 mins walk from Exit 3 of Temmabashi Station (Osaka Metro Tanimachi Line)"}, {"address": "6-14-15 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Tucked away in a traditional townhouse (Nagaya) on the historic streets of Tanimachi 6-chome, this macrobiotic vegetarian cafe offers exquisite vegan desserts like tofu cheesecake and rice flour tarts. Smooth, creamy, and gently sweet without being overpowering, its guilt-free natural sweetness keeps female patrons and dessert lovers coming back for more.", "name": "Organic Cafe Meguri", "transport": "3 mins walk from Exit 4 of Tanimachi 6-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "6-15-19 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Serving vegan cuisine made with pesticide-free organic vegetables and additive-free seasonings. The signature vegetable curry blends various natural spices for a rich, aromatic, and exceptionally smooth taste. Paired with sweet, juicy roasted vegetables, even those who usually dislike veggies will devour every last bite!", "name": "Organic Cafe Sora", "transport": "4 mins walk from Tanimachi 6-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "4-8-2 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 Stars | Specializing in exotic vegan South Indian curries and vegetarian tacos. Slow-cooked with abundant legumes and fresh vegetables, the dishes boast a rich, velvety texture infused with complex, layered spice flavors. Paired with handcrafted flatbread\u2014crispy on the outside and soft inside\u2014that absorbs all the delicious sauce, it attracts a huge following of international travelers.", "name": "Bhakti Vegan Cafe", "transport": "3 mins walk from Exit 8 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "6-17-11 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A serene vegetarian dining space set in a renovated traditional Japanese home. Highlighting fermented foods and seasonal vegetable set meals, the handmade tofu and fermented vegetables are delightfully crisp and refreshing with subtle, natural tangy-sweet notes. Served with special brown rice, it offers the pure, authentic essence of ingredients\u2014perfect for travelers looking to experience traditional Japanese plant-based dining.", "name": "Shokudo \u0026 Cafe Shiro", "transport": "5 mins walk from Tanimachi 6-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "3-2-12 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A healthy curry shop combining traditional herbal medicine concepts with 100% plant-based ingredients. The curry sauce is smooth and soothing, offering a subtle spiciness balanced with natural plant sweetness. Packed with melt-in-your-mouth legumes and root vegetables, it leaves you feeling warmed and completely refreshed\u2014a highly rated healthy dining spot near Osaka Castle.", "name": "Yakuzen Curry Shin-Shin (Tanimachi Branch)", "transport": "2 mins walk from Exit 1 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "5-6-9 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | A plant-based Japanese soba noodle shop strictly committed to using animal-free broth (no bonito flakes). The 100% buckwheat (ju-wari) soba noodles have a firm, springy texture with a rich grain aroma, served alongside a savory dipping sauce meticulously brewed from kelp and shiitake mushrooms. Refreshing and smooth, it beautifully showcases the refined elegance of traditional Japanese vegan cuisine.", "name": "Ryu-Gin An Vegan Soba", "transport": "6 mins walk from Exit 6 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "JO-TERRACE OSAKA F-TERRACE 1F, 3-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located inside JO-TERRACE OSAKA, this is a classic must-try takoyaki spot when visiting Osaka Castle Park. The exterior is lightly crispy while the inside is piping hot, gooey, and rich with savory dashi broth. Generous chunks of fresh octopus provide a satisfying chew, topped with special sauce and bonito flakes dancing in the steam. Its savory-sweet balance captivates both tourists and locals alike.", "name": "Takoyaki Douraku Wanaka Osaka Castle Park Branch", "transport": "Approx. 2-minute walk from JR Osakajokoen Station"}, {"address": "6-2-15 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A famous taiyaki shop that bakes each fish-shaped cake individually using traditional single-mold irons (tennen-yaki). The paper-thin crust is exceptionally crispy, bursting with piping-hot fillings like smooth Tokachi red bean paste or sweet Naruto Kintoki sweet potato. It\u0027s the ultimate cozy treat while strolling through the historic Tanimachi neighborhood.", "name": "Naruto Taiyaki Honpo Tanimachi 6-chome Branch", "transport": "Approx. 1-minute walk from Exit 3 of Osaka Metro Tanimachi 6-chome Station"}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture (Main Keep Plaza)", "feature": "\u2b50 4.0 stars | Situated right in the plaza in front of Osaka Castle Keep, this teahouse serves quintessential traditional Japanese snacks. Their mitarashi dango (grilled rice dumplings) are made fresh with a delightfully chewy texture and coated in a rich savory-sweet glaze. Paired with intense, fragrant Uji matcha soft-serve ice cream, the hot-and-cold combination is loved by visitors from around the world.", "name": "Osaka Castle Honmaru Chaya", "transport": "Approx. 15-minute walk to the Main Keep Plaza from Osaka Metro Tanimachi 4-chome Station or Morinomiya Station"}, {"address": "7-1-45 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A popular takeaway bakery in Tanimachi 7-chome, famous for its made-to-order filled focaccia sandwiches. Baked to crispy perfection on the outside and soft inside with aromatic herbs and olive oil, they offer rich savory and sweet options like whipped cream, red bean butter, or savory fillings. A trendy street snack loved by youngsters in the back alleys.", "name": "Panya Focaccia Bakery", "transport": "Approx. 5-minute walk from Exit 4 of Osaka Metro Tanimachi 6-chome Station"}, {"address": "3-2-13 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An award-winning takeaway spot recognized at the Japan Karaage Grand Prix. The golden, crispy coating encases juicy, tender chicken that bursts with flavor with every bite. Marinated in a secret sauce, it is flavorful without being greasy\u2014perfect for grabbing a bag to eat on the go and enjoying authentic Japanese street-style fried chicken.", "name": "Torisho Tanimachi", "transport": "Approx. 2-minute walk from Exit 3 of Osaka Metro Tanimachi 4-chome Station"}, {"address": "5-6-4 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A famous restaurant that won Gold at the Japan Tendon Awards. Beyond dining in, its freshly fried tempura skewers for takeaway are immensely popular. Large pieces of conger eel, succulent shrimp, and seasonal vegetables are coated in light, crispy batter and fried to a golden crunch, then drizzled with a rich savory-sweet sauce. Crispy, tender, and ungreasy, it offers incredible value for street food in Tanimachi.", "name": "Ichimi Zen Tanimachi", "transport": "Approx. 5-minute walk from Osaka Metro Tanimachi 6-chome Station or Tanimachi 4-chome Station"}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture (Inside Osaka Castle Park)", "feature": "\u2b50 3.9 stars | A popular pit stop for tourists enjoying flower viewing and strolls through the lush park. Their highlights include shaved matcha ice alongside giant grilled octopus skewers. The octopus tentacles are chewy and bouncy, brushed with savory sauce and flame-grilled for a delicious smoky aroma. Pairing them with a refreshing bowl of fluffy matcha shaved ice in summer offers ultimate satisfaction.", "name": "Sakura Chaya Osaka Castle Park", "transport": "Approx. 8-minute walk from JR Morinomiya Station or Osaka Metro Morinomiya Station"}, {"address": "6-13-18 Tanimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A traditional butcher shop near Tanimachi Shopping Street that is deeply loved by locals and visitors alike. Their piping-hot, freshly fried croquettes (korokke) feature a delightfully crunchy panko exterior wrapped around soft, creamy mashed potatoes infused with rich beef flavor. This savory-sweet nostalgia will keep you taking bite after bite\u2014a local street snack full of heartwarming neighborhood charm.", "name": "Yamaguchi Chikusan Croquette Tanimachi", "transport": "Approx. 4-minute walk from Exit 4 of Osaka Metro Tanimachi 6-chome Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Osaka Castle / Tanimachi"}, "tennoji-shinsekai": {"categories": {"cat_1": {"items": [{"address": "2-3-9 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1929, this is the iconic birthplace of Osaka kushikatsu. The specially made thin batter is fried to a golden crunch and dipped into a secret sweet-and-savory sauce. Each crispy bite locks in the juicy flavor of the ingredients without feeling greasy, making it a beloved staple for locals and tourists alike.", "name": "Kushikatsu Daruma Shinsekai Main Store", "transport": "About a 5-minute walk from Exit 5 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "3-4-13 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular spot located in Janjan Yokocho that regularly draws long lines. By uniquely adding nagaimo (yam) to the batter, the kushikatsu achieves a distinct dual texture\u2014crispy on the outside and soft on the inside. Their signature beef tendon Dotesyaki is slow-cooked in sweet miso until tender, rich, and melt-in-your-mouth.", "name": "Yaekatsu Kushikatsu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "3-4-12 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A classic kushikatsu establishment standing shoulder to shoulder with Yaekatsu. Its thinner, extra-crispy batter highlights the natural flavors of the fresh seafood and beef. The signature Dotesyaki beef tendon skewers are deeply flavorful, offering a rich sweet-and-savory balance that pairs perfectly with drinks.", "name": "Tengu Kushikatsu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "2-3-18 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A historic eatery in Shinsekai established in 1949. Unlike typical thin-crust kushikatsu, Omiya features an original thick, fluffy batter reminiscent of an American corndog crust\u2014lightly crisp on the outside and chewy on the inside, wrapping around thick, juicy chunks of beef for a deeply satisfying bite.", "name": "Ganso Kushikatsu Omiya Main Store", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "10-45 Hidenincho, Tennoji Ward, Osaka, Osaka Prefecture (Inside Tennoji MIO)", "feature": "\u2b50 4.0 stars | The undisputed birthplace of takoyaki! Preserving its original 1935 recipe, the outer shell is lightly seared while the inside bursts with savory dashi broth and tender octopus chunks. Enjoyed plain without sauce or bonito flakes, it delivers pure, traditional flavor in every savory bite.", "name": "Ganso Takoyaki Aizuya Tennoji", "transport": "Directly connected to JR Tennoji Station"}, {"address": "1-17-9 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A classic Yoshoku (Western-style Japanese) restaurant opened in 1927 (Showa 2). Its crown jewel, the \u0027Ultimate Thick-Cut Tenderloin Beef Cutlet Sandwich\u0027, features premium beef tenderloin breaded and fried medium-rare. Remarkably tender and juicy, it comes paired with toasted bread and a secret sweet-and-sour sauce for a decadent nostalgic treat.", "name": "Grill Bon Shinsekai Main Store", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-4-37 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A traditional sweet potato dessert shop founded in 1948. Their signature candied sweet potatoes are glazed in a secret, extra-thick malt syrup. Soft, fluffy, and naturally sweet inside, they offer a rich, moist texture full of comforting nostalgic charm.", "name": "Shimaya Abeno Main Store", "transport": "About a 1-minute walk from Exit 1 of Abeno Station on the Osaka Metro Tanimachi Line"}, {"address": "1-6-1 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Renowned as one of Japan\u0027s top three classic izakayas, this must-visit spot in Osaka oozes rustic Showa-era charm with its aged wooden interior. Highlights include silky, flavorful dashi-simmered tofu and authentic, rich Dotesyaki, making it an incredible destination to experience Osaka\u0027s down-to-earth pub culture.", "name": "Meijiya", "transport": "About a 3-minute walk from JR / Osaka Metro Tennoji Station"}], "name": "Iconic Traditional Local Spots"}, "cat_2": {"items": [{"address": "1-3 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Created by the family behind the famous Fujiyama Coffee Roasters, this minimalist wooden-style cafe is tucked away next to Tennoji Park. The cafe specializes in specialty pour-over coffee and exquisite homemade desserts\u2014most notably the brown sugar scones (crispy outside, soft inside) and the rich, multi-layered matcha chiffon cake that perfectly blends milky sweetness with subtle tea bitterness. Its quiet, relaxing atmosphere makes it a favorite for travelers seeking a leisurely morning and artistic vibes.", "name": "YARD Coffee \u0026 Craft", "transport": "Approx. 5-minute walk from JR Tennoji Station or Osaka Metro Dobutsuen-mae Station"}, {"address": "Inside Tenshiba, 5-55 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located right at the entrance of Tennoji Park\u0027s Tenshiba lawn area, this plant-themed cafe is surrounded by lush greenery and flowers. It serves hearty brunch platters, including French toast that is golden-crisp on the outside and soft inside, paired with smoked bacon and fresh garden salad for a perfectly satisfying sweet-and-savory bite. With abundant sunlight streaming through large floor-to-ceiling windows, it\u2019s a popular spot for tourists to soak up the sun and snap photos, as well as local families enjoying relaxing weekends.", "name": "SPOONBILL Tenshiba", "transport": "Approx. 1-minute walk from Exit 21 of JR / Osaka Metro Tennoji Station"}, {"address": "1-18-8 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located directly beneath Tsutenkaku Tower, this retro Showa-style kissaten (traditional coffee shop) was founded in 1967. The signature thick pancakes are baked fresh to order\u2014slightly crispy on the outside and cloud-like soft inside\u2014topped with a generous slab of butter and drizzled with maple syrup for a rich, sweet egg flavor. Paired with a dreamy melon soda float, it makes for a refreshing treat. Preserving a nostalgic ambiance, it draws large crowds eager to experience the classic charm of old Osaka.", "name": "Kissa Doremi", "transport": "Approx. 2-minute walk from Exit 3 of Osaka Metro Sakaisuji Line Ebisucho Station"}, {"address": "1-2-16 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A highly popular healthy brunch spot specializing in organic brown rice and additive-free, enzyme-rich meals. Their daily special meal set featuring brown rice, three
