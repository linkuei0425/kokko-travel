side dishes, and soup uses abundant fresh seasonal vegetables dressed with homemade enzyme sauces, delivering a naturally sweet, crisp taste packed with dietary fiber. The chewy brown rice paired with warm, comforting miso soup makes for a soothing, guilt-free meal loved by health-conscious women and families.", "name": "Sangmi Tennoji", "transport": "Approx. 3-minute walk from JR / Osaka Metro Tennoji Station"}, {"address": "8-11 Hideninch\u014d, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A popular Japanese-style cafe blending traditional sweets parlor vibes with modern cafe culture. Their signature grilled dango (rice dumplings) served with rich kuromitsu (black sugar syrup) and aromatic roasted soybean flour (kinako) are delightfully chewy and flavorful. The Japanese-style brunch options include fresh chazuke (rice with tea) and delicate matcha pancakes, where bittersweet matcha seamlessly blends with fluffy pancakes. Highly recommended by locals and visitors alike for breakfast or afternoon tea.", "name": "MARUFUJI CAFE Tennoji Kitaguchi", "transport": "Approx. 1-minute walk from the North Exit of JR Tennoji Station"}, {"address": "4F Tennoji MIO Main Building, 10-39 Hideninch\u014d, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Originating from Kobe, this American-style aesthetic cafe is located inside the MIO Department Store. A popular brunch choice is the buttermilk American pancake platter, featuring light, fluffy pancakes with a hint of savoriness, served alongside crispy bacon and fluffy scrambled eggs. Additionally, their signature chiffon cake is moist and airy, complemented by smooth, non-greasy whipped cream\u2014making it an ideal stop for brunch or dessert during a shopping trip.", "name": "Mother Moon Caf\u00e9 Tennoji MIO", "transport": "Directly connected to Tennoji MIO Main Building from JR Tennoji Station"}, {"address": "17F Abeno Harukas, 1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located on the 17th floor of Abeno Harukas, this high-altitude Italian cafe offers stunning panoramic views of Osaka city. In the morning, it serves freshly toasted paninis and buttery croissants. The crisp panini is stuffed with melted cheese and prosciutto, oozing flavor with every hot bite. Paired with a high-quality espresso featuring fine latte art, it allows guests to enjoy a relaxing breakfast alongside breathtaking views, attracting countless tourists.", "name": "Caf\u00e9 CIAO PRESSO Abeno Harukas", "transport": "Directly connected to Abeno Harukas from JR / Osaka Metro Tennoji Station"}, {"address": "1-3-19 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Exuding old-school romance, this three-story Showa-era kissaten is beloved by local regulars for its morning breakfast sets. The classic thick-cut buttered toast is golden and crispy on the outside yet soft inside, slathered in rich butter. Paired with a boiled egg and a house-blend dark roast hot coffee, it offers a beautifully balanced bittersweet taste. The elegant, retro interior makes it an ideal spot to deeply experience local South Osaka life and Showa nostalgia.", "name": "Kissa Swan Abeno", "transport": "Approx. 2-minute walk from JR / Osaka Metro Tennoji Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "3-4-13 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A popular, historic kushikatsu (fried skewers) spot located in Shinsekai\u0027s famous \u0027Jan Jan Yokocho\u0027. The crowd favorites are the light, non-greasy beef skewers and the rich, melt-in-your-mouth Dotesyaki (miso-braised beef sinew). The coating is ultra-thin and crispy, encapsulating tender and juicy ingredients. Dipped in their secret sweet-and-sour sauce, it is addictively delicious. Combined with skilled chefs and a lively pub atmosphere, this is a must-visit spot to experience Osaka\u0027s authentic food culture.", "name": "Yaekatsu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line / Sakaisuji Line"}, {"address": "3-4-12 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A beloved local izakaya standing shoulder-to-shoulder with Yaekatsu as one of the two legendary spots in the alleyway. Their Dotesyaki is slow-simmered in sweet Osaka white miso, resulting in rich, gooey beef tendon that melts in your mouth. The kushikatsu batter is chewier than usual with a subtle milky aroma, pairing perfectly with a cold beer. It is deeply favored by local foodies and visiting tourists alike.", "name": "Tengu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line / Sakaisuji Line"}, {"address": "2-3-9 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1929, this is the birthplace of Osaka\u0027s original kushikatsu, with its main store preserving a rich retro Showa-era tavern vibe. Deep-fried in carefully selected beef tallow, the skewers boast a uniquely rich aroma with a golden, non-greasy crispy crust that blends sweet and savory when dipped in their iconic secret sauce. The original beef skewer is tender and juicy, accompanied by free raw cabbage leaves, perfectly showcasing the authentic comfort food charm of Shinsekai.", "name": "Kushikatsu Daruma Shinsekai Flagship Store", "transport": "About a 5-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "1F Tennoji Via Abeno Walk, 1-6-1 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Hailed as one of Japan\u0027s top three legendary izakayas, this century-old tavern steeps in nostalgic Showa-era history. It offers a wide variety of traditional Kansai regional dishes, such as flavorful simmered oden, fresh sashimi, and homemade tofu. The sake selection is incredibly extensive yet affordable, while the quiet, serene atmosphere inside a classic wooden interior lets diners fully immerse themselves in the unique charm of an old-school Osaka tavern.", "name": "Meiji-ya", "transport": "About a 3-minute walk from JR / Osaka Metro Tennoji Station"}, {"address": "B1F Abeno Lucias, 1-5-1 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An immensely popular bistro in Tennoji renowned for \u0027delicious seafood at incredibly affordable prices.\u0027 Directly operated by a seafood wholesaler, it offers exceptionally fresh sashimi platters, seafood tempura, and various regional specialties. The thick, juicy sashimi slices paired with sake sourced directly from breweries offer incredible value for money, drawing long queues of local office workers and food lovers as soon as it opens every day.", "name": "Stand Fuji Main Store", "transport": "About a 3-minute walk via underground connection from JR / Osaka Metro Tennoji Station"}, {"address": "2-3-18 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A historic kushikatsu shop in Shinsekai, famous for its unique batter coating that is fluffy and soft like an American corndog. Crispy on the outside and soft on the inside with a subtle sweetness, the thick batter wraps around large chunks of juicy beef and fresh seafood. Soaking up the delicious sauce, it provides a very satisfying and filling bite\u2014a distinct local old-school flavor in Shinsekai.", "name": "Ganso Kushikatsu Omiya Main Store", "transport": "About a 5-minute walk from Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "3-4-5 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away in the Shinsekai shopping arcade, this traditional tachinomi (standing bar) overflows with warm, old-town Osaka hospitality. The soul food here includes long-simmered Dotesyaki and various oden items\u2014tender beef sinew soaked in flavor and daikon radish absorbing rich pork bone and kelp broth. Paired with a cup of sake or a Highball cocktail, it\u0027s the ultimate spot to experience authentic working-class Shinsekai nightlife.", "name": "Nonkiya", "transport": "About a 2-minute walk from Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "B1F Abeno Lucias, 1-5-1 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A lively, budget-friendly izakaya featuring creative dishes and daily secret seafood specials. Their famous \u0027Pandora\u0027s Treasure Box\u0027 sashimi platter offers a variety of thick, fresh slices at an incredibly bargain price. Complemented by diverse bar bites and local stir-fries, the vibrant atmosphere makes it hugely popular among young crowds and office workers.", "name": "Sakatoki Abeno Lucias", "transport": "About a 3-minute walk via underground connection from JR / Osaka Metro Tennoji Station"}], "name": "Specialty Izakayas \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "14F Abeno Harukas Kintetsu Main Store, 1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A famous Japanese Kaiseki restaurant renowned for its tofu and yuba (tofu skin) dishes. The restaurant offers fully plant-based yuba tofu set menus, featuring rich, velvety fresh-boiled soy milk tofu, tender seared yuba with a delicate soy aroma, and crispy-on-the-outside, tender-on-the-inside fried tofu croquettes. Highly praised by both tourists and locals for its artful presentation and pure bean flavor, it is the top choice for sampling Japanese vegetarian and wellness cuisine.", "name": "Ume no Hana Abeno Harukas", "transport": "Direct access from JR/Subway Tennoji Station, located on the 14th floor of Abeno Harukas Kintetsu Main Store"}, {"address": "13F Abeno Harukas Kintetsu Main Store, 1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A spacious buffet restaurant featuring farm-fresh organic vegetables. Daily selections include dozens of pesticide-free fresh greens delivered straight from farms in Mie Prefecture, simmered root vegetables, high-fiber brown rice, and special handmade tofu. Offering fresh, naturally sweet flavors\u2014such as light and crispy fried burdock strips and dense, sweet steamed pumpkin\u2014it is immensely popular among health-conscious travelers and vegetarians looking for a wide variety of fresh produce.", "name": "Agricultural Restaurant Moku Moku Abeno", "transport": "Direct access from JR/Subway Tennoji Station, located on the 13th floor of Abeno Harukas"}, {"address": "2F Tennoji MIO Main Building, 10-39 Hidenincho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Embodying MUJI\u0027s philosophy of natural and wholesome flavors, this themed restaurant offers a variety of vegan and plant-based hot and cold dishes. A highlight is the \u002710-Grain Rice with Roasted Seasonal Warm Vegetables\u0027\u2014sweet potatoes and lotus roots lightly caramelized on the outside yet soft inside, paired with a custom sesame dressing that enhances their natural sweetness. Its minimalist and elegant ambience draws tourists and trendy crowds alike, making it a wonderful spot near Tennoji Station for a light, healthy meal.", "name": "Cafe \u0026 Meal MUJI Tennoji MIO", "transport": "Direct access from JR Tennoji Station Central Gate to 2F Main Building of MIO"}, {"address": "4F Abeno Q\u0027s Mall, 1-6-1 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An authentic Indian restaurant in the Abeno area featuring an extensive menu of vegan and vegetarian curries. Highly recommended dishes include the flavorful \u0027Chana Masala\u0027 and \u0027Palak Paneer\u0027; the chickpeas are cooked until melt-in-your-mouth tender, soaking up rich, spice-infused sauce, served alongside freshly baked, aromatic whole-wheat roti. Rich in texture and flavor, it is a favorite for exotic food enthusiasts and vegan travelers.", "name": "Ganesh Abeno", "transport": "1-minute walk from Subway Tanimachi Line Abeno Station, or 3-minute walk from Tennoji Station (inside Abeno Q\u0027s Mall)"}, {"address": "1-12-11 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A traditional handmade soba noodle shop located near the ancient Shitennoji Temple, beloved by temple visitors and vegetarian foodies alike. It offers Buddhist Shojin-ryori style vegetarian soba free of meat and heavy condiments. Their signature \u0027Vegetable Tempura Soba\u0027 features seasonal vegetables like perilla leaf, maitake mushrooms, and sweet potatoes. The noodles are chewy and smooth, the tempura coating light and crispy without being greasy, and the broth offers a deep umami flavor from kombu kelp\u2014a true showcase of traditional Japanese vegetarian craftsmanship.", "name": "Shitennoji Yabu Soba", "transport": "3-minute walk from Exit 4 of Shitennoji-mae Yuhigaoka Station on the Subway Tanimachi Line"}, {"address": "1-11-18 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A Japanese wellness teahouse near Shitennoji Temple, designed for visitors seeking mindful and healthy dining. The signature \u0027Shojin Red Bean Porridge \u0026 Sesame Tofu Set\u0027 features velvety, rich sesame tofu with a delicate bittersweet nutty finish, paired with warm, melt-in-your-mouth red bean porridge. Its peaceful ambience and natural, authentic flavors make it a must-visit vegetarian sanctuary when strolling around Shinsekai and the Tennoji area.", "name": "Kissa Wa - Shitennoji", "transport": "4-minute walk from Shitennoji-mae Yuhigaoka Station on the Subway Tanimachi Line"}, {"address": "2-1-34 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | This location of the world-famous curry chain offers a dedicated 100% plant-based \u0027Veggie Curry\u0027. The curry sauce contains no animal ingredients, ood snack that shouldn\u0027t be missed when visiting Tennoji.", "name": "Abeno Takoyaki Yamachan Main Store", "transport": "About a 1-minute walk from Kintetsu Osaka-Abenobashi Station, or a 3-minute walk from JR Tennoji Station"}, {"address": "3-4-13 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A famous historic kushikatsu joint tucked in Shinsekai\u0027s Janjan Yokocho alley. What sets their skewered deep-fried bites apart is the addition of grated mountain yam in the batter, producing a golden crust that is light, airy, remarkably crispy, and never greasy. Beneath the crunchy coating, ingredients like beef skewers, giant tiger prawns, and fried yam stay wonderfully juicy. Don\u0027t miss their Doteyaki (miso-braised beef sinew)\u2014stewed until tender and melt-in-your-mouth soft with a rich sweet-and-savory white miso sauce. A legendary spot drawing endless queues of tourists and local foodies alike.", "name": "Yaekatsu Kushikatsu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "2-5-15 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Michelin Bib Gourmand recommended as the birthplace of takoyaki! Unlike modern takoyaki smothered in sauce and mayonnaise, Aizuya\u0027s original style consists of bite-sized, sauce-free octopus balls. A lightly charred crust opens into smooth, creamy batter seasoned with soy sauce and dashi broth, loaded with chewy, flavorful octopus chunks that taste even better as you chew. Additionally, their \u0027Radioyaki\u0027\u2014stuffed with beef sinew and konjac\u2014is a nostalgic old-Osaka street treat offering rich, layered textures.", "name": "Aizuya Tsutenkaku", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "2-3-22 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A traditional butcher shop in the Tsutenkaku shopping district of Shinsekai, serving freshly fried street meat snacks to-go. Their most popular item, the \u0027Kuroge Wagyu Minced Meat Cutlet\u0027 (Menchi-katsu), features a delicate coating of panko breadcrumbs fried to a golden crunch. One bite yields a satisfying crunch followed by a burst of juicy, flavorful black-haired Wagyu beef and sweet onion. Piping hot and perfect for eating on the go, it\u0027s the ultimate casual street bite to soak in Shinsekai\u0027s vintage, working-class charm.", "name": "Niku no Sakamoto Shinsekai", "transport": "About a 4-minute walk from Ebisucho Station on the Osaka Metro Sakaisuji Line, or a 3-minute walk from Tsutenkaku-mae Station on the Hankai Tramway"}, {"address": "1-7-11 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A century-old confectionery shop founded in the Meiji era, famous for its iconic street dessert \u0027Tsurigane Manju,\u0027 shaped like the great bell of Shitennoji Temple. Freshly baked, the cake shell resembles a soft, delicate sponge cake infused with rich egg and honey aromas, wrapped around smooth, creamy red bean paste made from Hokkaido Tokachi red beans. Eaten warm, the fluffy exterior and sweet bean filling blend perfectly in your mouth, making it a historic classic treat of the Tennoji and Shinsekai areas.", "name": "Tsuriganeya Honpo Main Store", "transport": "About a 1-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "3-4-12 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Standing side-by-side with Yaekatsu as one of the two giants in Janjan Yokocho, this popular eatery is beloved by locals and beer fans alike. Tengu\u0027s kushikatsu features a slightly thicker batter that delivers a satisfyingly hefty crunch, locking in all the natural flavors of the ingredients. Their signature \u0027Doteyaki\u0027 is slow-simmered in special white miso, resulting in beef sinew so tender it melts in your mouth with a rich, savory-sweet flavor. Dip piping hot fried onion or beef skewers into their signature sauce and pair with an ice-cold beer for the ultimate authentic Shinsekai street food experience.", "name": "Tengu Kushikatsu", "transport": "About a 2-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "3-4-15 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Famed as the birthplace of Osaka\u0027s iconic \u0027Mix Juice\u0027! Located in Shinsekai, this nostalgic Showa-style kissaten features a walk-up takeout window serving the most authentic traditional Osaka mixed juice. Blended with golden proportions of ripe yellow peaches, apples, bananas, milk, and crushed ice, the drink is exceptionally smooth and rich, offering a subtle fruity tartness and creamy sweetness without being cloying. Grabbing a cup while strolling through the lively streets of Shinsekai brings a refreshing taste of nostalgic Showa charm.", "name": "Sennariya Coffee Shinsekai", "transport": "About a 3-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}, {"address": "3-2-23 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A teppanyaki-style counter diner exuding retro Showa charm, specializing in fresh beef and pork offal. Their classic \u0027Teppan Offal\u0027 is stir-fried over high heat on a flat-top grill right before your eyes with secret garlic sauce and plenty of onions. The offal is tender, pleasantly chewy, and free of unpleasant odors, sizzling loudly on the griddle to produce a mouthwatering charred aroma and rich savory depth. A quintessentially authentic street snack for beer lovers looking to experience old Osaka nightlife.", "name": "Horumon Dojo Shinsekai", "transport": "About a 3-minute walk from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Tennoji and Shinsekai"}, "umeda": {"categories": {"cat_1": {"items": [{"address": "B1F Takimi-koji, Umeda Sky Building, 1-1-90 Oyodonaka, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A classic okonomiyaki spot tucked away in the retro Takimi-koji alley on the basement floor of the Umeda Sky Building. Their signature Modern-yaki features noodles seared until crispy on the outside and soft inside, mixed with rich green laver seaweed, sweet savory sauce, and plenty of shredded cabbage for an incredibly flavorful bite. Highly acclaimed by local foodies and tourists alike.", "name": "Okonomiyaki Kiji", "transport": "Approx. 9-min walk from JR Osaka Station / 10-min walk from Subway Umeda Station"}, {"address": "1F Shin-Umeda Shokudogai, 9-26 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A hugely popular standing-only takoyaki classic located in Shin-Umeda Shokudogai. Their top seller, Negimayo Takoyaki, comes piled high with a mountain of fresh green onions. Slightly crispy on the outside and piping hot inside, each bite delivers tender, chewy octopus chunks balanced by the refreshing crunch of scallions\u2014a daily staple street food for Umeda locals.", "name": "Hanadako", "transport": "Approx. 1-min walk from JR Osaka Station Midosuji South Exit / 1-min walk from Hankyu Osaka-Umeda Station"}, {"address": "EST E27 Zone, 3-25 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A branch of the legendary pioneer that invented negiyaki in Osaka. Unlike standard okonomiyaki, it replaces cabbage with generous green onions, cooked with tender beef tendon and konjac until nicely charred, then brushed with a special lemon soy sauce. Crispy outside, savory inside, with a refreshing tangy finish\u2014a truly unique Osakan flavor.", "name": "Negiyaki Yamamoto Umeda EST Branch", "transport": "Approx. 5-min walk from JR Osaka Station / 3-min walk from Hankyu Osaka-Umeda Station"}, {"address": "2-14-2 Sonezaki, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1954, this iconic neighborhood sushi joint in Sonezaki, Umeda offers thick, generous cuts of fresh raw fish hand-pressed right before your eyes. The balanced sushi rice melts seamlessly with silky sashimi in your mouth. Excellent value for money and a lively downtown vibe attract endless streams of hungry diners.", "name": "Kame Sushi Main Shop (Kame Sushi Sohonten)", "transport": "Approx. 2-min walk from Subway Tanimachi Line Higashi-Umeda Station / 8-min walk from JR Osaka Station"}, {"address": "LUCUA 10F, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Founded in 1929, this legendary chain is the pioneer of Osaka kushikatsu. A light, golden-crisp batter coats fresh ingredients like beef, shrimp, and quail eggs, delivering a satisfying crunch without feeling greasy. Paired with secret sauce and crisp raw cabbage, it\u0027s the ultimate way to experience Osaka\u0027s deep-fried street food culture.", "name": "Kushikatsu Daruma LUCUA Osaka Branch", "transport": "Directly connected to JR Osaka Station (10F, LUCUA Shopping Mall)"}, {"address": "2-10-13 Sonezaki, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A famous retro western-style eatery in Umeda underground renowned for its thick-cut garlic sauce pork steaks (tonteki). Thick pork loin is seared to perfection to lock in juices, then smothered in a sweet, savory black garlic sauce. Tender yet hearty, this rich, garlic-infused classic is a hearty local comfort favorite among office workers.", "name": "Osaka Tonteki Sonezaki", "transport": "Approx. 2-min walk from Subway Higashi-Umeda Station / 7-min walk from JR Osaka Station"}, {"address": "Outside East Gate, Hanshin Osaka-Umeda Station, 1-13-13 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A legendary juice stand operating inside Umeda station since 1969. Blending yellow peaches, satsuma oranges, bananas, fresh milk, and shaved ice in secret proportions, it delivers a rich, slushy texture with a perfectly balanced sweet and tangy flavor. A nostalgic street staple loved by daily commuters and tourists alike.", "name": "Hanshin Umeda Station Famous Mixed Juice", "transport": "Right outside Hanshin Electric Railway Osaka-Umeda Station East Gate"}, {"address": "28F Hankyu Grand Building (Hankyu 32 Bangai), 8-47 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A household classic tonkatsu brand in Kansai. Premium Berkshire pork is coated in crispy panko and fried to a brilliant golden brown, bursting with flavor and juiciness with every bite. Served with unlimited fresh shredded cabbage and rice, this dining experience is complemented by sweeping high-floor night views of bustling Umeda.", "name": "Tonkatsu KYK Hankyu 32 Bangai Branch", "transport": "Approx. 3-min walk from Hankyu Osaka-Umeda Station / 5-min walk from JR Osaka Station"}], "name": "Local Iconic Classic Restaurants"}, "cat_2": {"items": [{"address": "7F, South Building, Grand Front Osaka, 4-20 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located on the 7th floor of Grand Front Osaka South Building, this ultra-popular bakery restaurant hails from New York. Its signature \u0027Pretzel Croissant\u0027 features a delightfully crispy, multi-layered crust with a rich buttery aroma, where a pinch of savory pretzel salt perfectly balances the richness, releasing incredible buttery layers with every bite. The morning and lunch sets offer generous plates with thick-cut bacon, sunny-side-up eggs, and unlimited freshly baked house bread. Enjoy a lazy, sun-drenched breakfast in a soaring, modern, comfortable space\u2014it is the top choice for classic American brunch in the Umeda shopping district.", "name": "The City Bakery Brasserie Rubin Grand Front Osaka", "transport": "About a 3-minute walk from JR Osaka Station, directly connected to Grand Front Osaka South Building"}, {"address": "7F, LUCUA 1100, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Hailed as \u0027the best breakfast in the world,\u0027 Bills is located on the 7th floor of LUCUA 1100, attracting foodies with its bright, warm, and stylish space. Its iconic signature \u0027Ricotta Pancakes with Fresh Bananas and Honeycomb Butter\u0027 are cloud-like, fluffy, and melt-in-your-mouth, rich with milk and ricotta flavors, perfectly paired with fresh bananas and unique honeycomb butter without being overly sweet. Another classic, the \u0027Organic Scrambled Eggs,\u0027 showcases an exceptionally silky, smooth texture paired with sourdough toast that is crispy on the outside and soft inside. A must-visit destination for those seeking a luxurious brunch experience.", "name": "Bills Osaka (LUCUA 1100)", "transport": "Directly connected to LUCUA 1100 7F from JR Osaka Station, about a 1-minute walk"}, {"address": "1F, Umekita Plaza, Grand Front Osaka, 4-1 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated in Umekita Plaza right in front of JR Osaka Station, this panoramic glass-house cafe offers stunning views of water features and lush greenery. Serving refined brunch starting from 7:30 AM, its signature \u0027Soup Breakfast Plate\u0027 includes freshly toasted crispy bread, rich house-made vegetable soup, and a fresh salad\u2014refreshing and satisfying without feeling heavy. In the afternoon, enjoy fragrant pour-over coffee and fresh desserts. The outdoor terrace seating makes you feel like you\u0027re on a European street corner, perfect for enjoying a delicious meal while taking in the vibrant cityscape of Umeda. It\u0027s a favorite morning spot for locals and tourists alike.", "name": "GARB MONAQUE (Umekita Plaza)", "transport": "About a 1-minute walk from JR Osaka Station Central North Exit"}, {"address": "1F, Chayamachi Applause, 19-19 Chayamachi, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A popular Hawaiian pancake spot located in the trendy, artistic Chayamachi area. The most eye-catching feature is the signature \u0027Fresh Whipped Cream Pancakes with Strawberries and Macadamia Nuts\u0027 piled high like a mountain. The volcano-like whipped cream is exceptionally light and airy, never too sweet, perfectly complementing soft, chewy thin pancakes and sweet-and-sour strawberry jam. Additionally, their classic \u0027Eggs Benedict\u0027 pairs crispy English muffins with perfectly runny poached eggs and rich Hollandaise sauce, offering rich layers of flavor\u2014making it one of the absolute best brunch spots in the Chayamachi area.", "name": "Eggs \u0027n Things (Umeda Chayamachi)", "transport": "About a 3-minute walk from Hankyu Osaka-Umeda Station Chayamachi Exit"}, {"address": "1F, North Building, Grand Front Osaka, 3-1 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A stylish cafe integrated with a Nordic furniture brand, located on the 1st floor of Grand Front Osaka North Building. Featuring a Scandinavian theme, its signature \u0027Swedish Meatballs\u0027 are tender and juicy, served with sweet-and-tart lingonberry jam and rich savory gravy for an authentic Nordic taste. The made-to-order \u0027Nordic-style Pancakes\u0027 are lightly crispy outside, soft and moist inside, pairing delightfully with fresh berries and whipped cream. Spacious, comfortable sofa seating and sleek wood accents invite guests to slow down and enjoy an elegant, high-quality brunch.", "name": "SOHOLM CAFE+ALFLEX (Grand Front Osaka)", "transport": "About a 5-minute walk via connecting walkway from JR Osaka Station to Grand Front Osaka North Building"}, {"address": "1F, South Gate Building, JR Osaka Station, 3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | An ultra-convenient cafe located just outside the South Exit gates of JR Osaka Station, specializing in professional drip coffee and high-quality light meals. The morning-exclusive \u0027Thick-Cut French Toast and Overflowing Egg Salad Sandwich\u0027 is a favorite among early travelers; the egg salad is exceptionally smooth with a rich savory flavor, while the French toast is pan-seared to crispy-outside, tender-inside perfection. Using carefully selected specialty coffee beans, their custom drip machines extract a rich, aromatic brew with a sweet finish. It\u0027s the perfect spot to recharge with a delightful brunch during a quick layover at busy Osaka Station.", "name": "Drip-X-Cafe (JR Osaka Station)", "transport": "1F South Gate Building, JR Osaka Station, directly accessible from ticket gates"}, {"address": "1F, Plaza Umeda Building, 8-17 Taiyujicho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A popular kissaten chain full of nostalgic Showa-era charm, famous for its thick, soft signature \u0027Souffl\u00e9 Pancakes\u0027. Baked fresh to order with a 20-minute wait, they arrive at the table releasing a rich egg and butter aroma. The exterior is lightly crispy, while the inside is light and moist like a marshmallow\u2014drizzled with Canadian maple syrup or black sugar syrup, every bite melts in your mouth. Paired with a meticulously hand-drip \u0027Hoshino Blend Coffee\u0027 crafted by professional baristas, the deep balance of sweet and bitter notes makes this the top choice in Umeda for experiencing retro Japanese brunch and afternoon tea.", "name": "Hoshino Coffee (Umeda Taiyuji)", "transport": "About a 5-minute walk from Higashi-Umeda Station on the Osaka Metro Tanimachi Line / About an 8-minute walk from Hankyu Osaka-Umeda Station"}, {"address": "2F, South Building, Grand Front Osaka, 4-20 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A renowned luxury fruit tart specialty shop in Japan, located on the 2nd floor of Grand Front Osaka South Building. Beyond afternoon tea, it is also a beloved decadent brunch and dessert boutique for sweet lovers. The signature \u0027Seasonal Fresh Fruit Tart\u0027 features the finest seasonal fruits resting on rich, velvety custard and an extremely flaky, buttery tart shell. The sweet-and-sour juicy fruit blends seamlessly with the buttery pastry, delivering exquisite layers of flavor and texture. Paired with fine black tea or single-origin coffee in a stylish, romantic setting, this cafe offers an unmissable gourmet dessert experience in Umeda.", "name": "Qu\u0027il Fait Bon (Grand Front Osaka)", "transport": "Directly connected to Grand Front Osaka South Building 2F from JR Osaka Station, about a 2-minute walk"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "B2F LUCUA Osaka, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Kohaku is an immensely popular French fusion bistro in Umeda, skillfully blending high-end French cuisine with casual Japanese izakaya culture. The must-order signature dish, \u0027French Sauce Braised Daikon Radish\u0027, absorbs rich savory broth and is topped with a creamy garlic truffle cream sauce. The melt-in-your-mouth radish explodes with flavor alongside the silky sauce, creating an astonishing layer of tastes. Offering exceptional value with a wide selection of wines by the glass and French savory tartlets, its lively and relaxed atmosphere makes it a favorite among both local office workers and tourists.", "name": "Kohaku French Bistro - LUCUA Osaka", "transport": "Directly connected to JR Osaka Station, about 1 minute walk"}, {"address": "10F LUCUA Osaka, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | Kushikatsu Daruma is one of Osaka\u0027s most iconic local comfort food eateries. Fresh meats, seafood, and vegetables are coated in an ultra-thin custom batter and fried to golden perfection. Each freshly fried skewer offers a satisfying crunchy bite\u2014crispy on the outside, tender on the inside, and not greasy at all. Paired with a perfectly balanced sweet-and-savory sauce, refreshing raw cabbage leaves, and an ice-cold draft beer, it captures the authentic spirit of Osaka\u0027s Naniwa district, drawing food lovers from all over.", "name": "Kushikatsu Daruma - LUCUA Osaka", "transport": "Directly connected to JR Osaka Station, about 1 minute walk"}, {"address": "B1F Takimi-koji, Umeda Sky Building, 1-1-90 Oyodonaka, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Located in the retro Takimi-koji alley in the basement of the Umeda Sky Building, Kiji is a historic and authentic local okonomiyaki eatery. The master chef insists on making batter fresh to order with generous amounts of fresh cabbage and rich dashi broth. The signature \u0027Pork and Shiso Okonomiyaki\u0027 features a lightly charred, crispy exterior and a fluffy, tender interior, bursting with rich dashi flavor and refreshing perilla leaf fragrance. The enthusiastic owner and cozy izakaya vibe make guests feel the warm, hearty hospitality of Osaka.", "name": "Okonomiyaki Kiji - Umeda Sky Building", "transport": "About 9 minutes walk from JR Osaka Station"}, {"address": "1F Umekita Plaza, Grand Front Osaka, 4-1 Ofukacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Situated in Umekita Plaza, GARB MONAQUE is an open-concept bistro oozing modern urban charm. Panoramic glass windows and spacious outdoor patio seating offer fantastic views. The restaurant highlights European fusion dishes prepared with fresh, locally sourced Kansai ingredients. The signature \u0027Duck Confit\u0027 features crispy skin and tender, juicy meat paired perfectly with a special red wine reduction. Whether enjoying a sunlit lunch by day or sipping curated wines under the evening glow, it is a premier gathering spot in Umeda.", "name": "GARB MONAQUE French Bistro - Umekita Plaza", "transport": "About 1 minute walk from JR Osaka Station North Exit"}, {"address": "2-8-9 Fukushima, Fukushima-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | Hanakuji is a legendary oden specialist near Umeda, drawing crowds with its deeply savory kelp and bonito broth. The signature \u0027Whale Tail Flank\u0027 and \u0027Braised Daikon Radish\u0027 are absolute must-try items. Slow-simmered for hours, the radish fully absorbs the dashi essence, melting instantly in your mouth with natural sweetness, while the whale tail meat offers a bouncy texture and rich, savory aroma. Paired with warm sake, its cozy, steaming rustic atmosphere delivers an authentic Osaka midnight diner experience.", "name": "Hanakuji Oden Main Store", "transport": "About 12 minutes walk from JR Osaka Station or 3 minutes walk from JR Fukushima Station"}, {"address": "B2F LUCUA Osaka, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Bokukoku Rotisserie Chicken is a unique exotic spot blending Mexican-Colombian roast chicken culture with Osaka\u0027s lively dining scene. Whole chickens are marinated in dozens of spices and slow-roasted on a spit, producing thin, crispy skin and juicy, tender meat infused with herbal goodness. Diners can wrap the chicken with salsa and homemade guacamole in soft corn tortillas for a refreshing, zesty, multi-textured delight. Complemented by craft beers or signature cocktails, its vibrant music and electric vibe make it a top hangout for Umeda\u0027s youth.", "name": "Bokukoku Mexican Rotisserie Chicken - LUCUA Osaka", "transport": "Directly connected to JR Osaka Station, about 1 minute walk"}, {"address": "B2F Osaka Umeda Ekimae Daiichi Building, 1-3-1 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Located in the underground food hall of Umeda Ekimae Building No. 1, Craft Beer Market is a must-visit gastropub for craft beer lovers. It features over 30 varieties of local Japanese and international draft craft beers, all offered at a flat, affordable price. The food menu focuses on high-end izakaya-style bites, such as \u0027Roasted Pork Belly Confit\u0027 and \u0027House-made Sausages\u0027. With crispy skin, sweet fat, and juicy meat, paired with crisp, flavorful craft beers, it\u2019s the top choice for unwinding and savoring great food after work.", "name": "Craft Beer Market - Umeda Ekimae Building No. 1", "transport": "About 3 minutes walk from Subway Tanimachi Line Higashi-Umeda Station, about 6 minutes walk from JR Osaka Station"}, {"address": "1F Dojima Mirai Building, 1-3-16 Dojima, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 Stars | Located in Umeda\u0027s upscale dining district Kitashinchi, Kushikatsu Bon is a Michelin-starred fine-dining kushikatsu establishment. Elevating traditional Osaka street-food skewers to fine kappo dining, it uses premium ingredients like Kuroge Wagyu beef, kuruma prawn, foie gras, and truffles. The paper-thin batter is flash-fried at high heat to lock in moisture, creating a feather-light, crispy skewer that is never greasy. Paired with champagne and wines curated by an expert sommelier, guests can indulge in refined, innovative local cuisine in an elegant and luxurious dark-toned counter seating atmosphere.", "name": "Kushikatsu Bon - Kitashinchi", "transport": "About 3 minutes walk from JR Tozai Line Kitashinchi Station, about 8 minutes walk from JR Osaka Station"}], "name": "Featured Bistro Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Hankyu Sanbangai South Wing B2F, 1-1-3 Shibata, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Specializing in \u0027body-friendly\u0027 healthy organic vegetarian food, the main attraction here is their soft, chewy, and highly nutritious \u0027enzymatic brown rice\u0027. The restaurant serves three or more fresh seasonal vegetable side dishes daily, prepared with a light, non-greasy touch that highlights the natural sweetness and crispness of the ingredients. Free from chemical additives, their signature homemade sweet-and-sour raw dressing is strongly praised by health-conscious diners, beauty enthusiasts, and travelers alike.", "name": "Sangmi Hankyu Sanbangai", "transport": "Directly connected to Hankyu Osaka-Umeda Station / approx. 3 mins walk from JR Osaka Station"}, {"address": "4F Hankyu Umeda Main Store, 8-7 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A stylish organic restaurant dedicated to \u0027tasty yet healthy\u0027 dining, offering a wide selection of vegan and gluten-free meals. Highly recommended are the meat-, egg-, and dairy-free Vegan Rainbow Salad Bowl and the Vegan Cheese Buddha Bowl. They feature rich, layered textures filled with nutty aromas and the crisp sweetness of organic vegetables. Even their vegan desserts, such as plant-based parfaits and rich matcha tarts, are remarkably smooth and completely guilt-free.", "name": "Cosme Kitchen Adaptation Hankyu Umeda", "transport": "approx. 2 mins walk from Hankyu Osaka-Umeda Station / approx. 3 mins walk from JR Osaka Station"}, {"address": "5F LUCUA 1100, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located inside LUCUA 1100, this stylish and healthy teishoku (set meal) spot serves several vegetarian-friendly options based on the traditional Japanese \u0027Ichiju-Sansai\u0027 (one soup, three dishes) concept. The fragrant black and brown rice has a rich, hearty texture, perfectly paired with silky organic tofu, pan-seared seasonal root vegetables, and a flavorful homemade miso soup. The tasteful, relaxing white-and-wood space offers a calm, peaceful refuge in the bustling Umeda area to enjoy guilt-free plant-based deliciousness.", "name": "24/7 Cafe Apartment Umeda", "transport": "Directly connected to JR Osaka Station / approx. 2 mins walk from Hanshin Osaka-Umeda Station"}, {"address": "B2F Osaka Ekimae No. 3 Building, 1-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | An established, authentic Indian restaurant located in the Osaka Ekimae No. 3 Building, offering an extensive and authentic vegetarian menu. Signature dishes like Chana Masala (chickpea curry) and Palak Paneer (spinach cheese curry) burst with rich aromas and deep, layered spices. Paired with warm, freshly baked naan that is crispy on the outside and soft on the inside, the flavor is phenomenal. Both vegetarians and curry lovers will find complete satisfaction in this authentic Indian feast.", "name": "Indian Restaurant Ashoka Osaka", "transport": "approx. 2 mins walk from JR Kitashinchi Station / approx. 8 mins walk from JR Osaka Station"}, {"address": "10F LUCUA, 3-1-3 Umeda, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A Korean plant-based eatery focused on health and radiant skin, offering meatless vegetable stone-bowl bibimbap and soft tofu stew (sundubu) set meals. Savor the sizzling hot bibimbap with crispy rice crust, packed with shredded carrots, spinach, bean sprouts, and rich plant-based gochujang. Once stirred, it offers a spicy, savory, deliciously chewy, and deeply satisfying meal. The wide variety of plant-based side dishes (banchan) is also a major highlight, making it a favorite hotspot for young women and health-conscious diners.", "name": "VEGE GO LUCUA Osaka", "transport": "Directly connected to JR Osaka Station / approx. 2 mins walk from Osaka Metro Midosuji Line Umeda Station"}, {"address": "29F Hankyu Grand Building, 8-47 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Perched on the 29th floor of the Hankyu Grand Building, this high-altitude Indian restaurant with stunning city views specializes in authentic North Indian vegetarian and vegan Curry Thali sets. The rich Dal Curry melts in your mouth with gentle notes of cumin and turmeric, paired delightfully with warm flatbreads and flavorful vegetable coconut curry. Every bite showcases refined spice artistry, complemented by breathtaking panoramic views over Osaka\u0027s Umeda district.", "name": "Maharaja Indian Restaurant Umeda", "transport": "approx. 3 mins walk from Hankyu Osaka-Umeda Station / approx. 5 mins walk from JR Osaka Station"}, {"address": "1-9-18 Nakazakinishi, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A hidden vegan dessert and organic food cafe nestled in the cozy alleyways of Nakazakicho, near Umeda. Completely free from refined sugar, eggs, dairy, and artificial additives, their organic brown rice set meals are naturally sweet and delicately seasoned. Must-try menu items include the vegan tiramisu and tofu cheesecake, featuring silky-smooth textures with natural soy fragrance and rich nutty undertones. It\u0027s hard to believe these delightful desserts are completely guilt-free, earning top praise from local trendsetters and tourists.", "name": "Brown Rice Cafe Meguri Nakazakicho", "transport": "approx. 3 mins walk from Osaka Metro Tanimachi Line Nakazakicho Station / approx. 8 mins walk from Hankyu Osaka-Umeda Station"}, {"address": "6-7 Kakudacho, Kita-ku, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Famous ramen chain Ippudo introduces its revolutionary \u0027Plant-Based Ramen\u0027 at the Umeda location, delivering an incredible ramen experience for vegetarians. The rich broth crafted from soy milk, shiitake mushrooms, and plant oils is smooth, velvety, and delightfully savory, easily competing with traditional tonkotsu (pork bone) broth. Served with plant-protein \u0027chashu\u0027 and springy, egg-free noodles that absorb the flavorful soup, it receives enthusiastic praise from plant-based diners and international travelers alike.", "name": "Ippudo Umeda", "transport": "approx. 3 mins walk from Hankyu Osaka-Umeda Station / approx. 4 mins walk from Osaka Metro Midosuji Line Umeda Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1F Shin-Umeda Shokudogai, 9-16 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | The #1 most popular takoyaki stall in Shin-Umeda Shokudogai. Their signature \u0027Negimayo Takoyaki\u0027 comes piled high with a thick layer of fresh green scallions. Crispy on the outside and velvety-soft on the inside, the molten center is packed with rich flavor. The hot, chewy octopus pieces pair perfectly with the crisp freshness of green onions and rich mayonnaise, creating a delicious balance of sweet and savory that isn\u0027t greasy at all. A sensational street snack well worth standing in line for, beloved by tourists and local office workers alike.", "name": "Hanatako", "transport": "Approx. 1-min walk from JR Osaka Station Midosuji South Exit / Approx. 2-min walk from Hankyu Osaka-Umeda Station"}, {"address": "B1F Hanshin Department Store Umeda Main Store, 1-13-13 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | A local soul food beloved by Osaka locals! Located in the Hanshin Department Store basement food hall, this specialty uses a custom batter mixed with tender chopped squid, pressed and cooked rapidly under high heat on hot iron plates. The result is irresistibly springy and chewy. Brushed with a sweet-and-savory secret takoyaki-style sauce while piping hot, every bite is filled with squid sweetness and subtle charred aroma. Affordable, portable, and utterly satisfying to eat on the go.", "name": "Hanshin Meibutsu Ikayaki", "transport": "Directly connected to Hanshin Osaka-Umeda Station / Approx. 3-min walk from JR Osaka Station"}, {"address": "1F Shin-Umeda Shokudogai, 9-20 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A classic standing kushikatsu (skewered fried foods) bar in Shin-Umeda Shokudogai boasting nostalgic Showa-era charm. Fresh out of the fryer, the skewers are golden and crispy, coated in a paper-thin, light-as-air batter that locks in the juicy flavor of ingredients like beef, octopus, and lotus root. Paired with a secret sweet-and-sour dipping sauce, it enhances every bite. Standing at the counter alongside locals to enjoy piping hot skewers is one of the best ways to experience authentic Umeda street food culture.", "name": "Matsuba Sohten", "transport": "Approx. 1-min walk from JR Osaka Station Midosuji South Exit"}, {"address": "Inside Eki March\u00e9 Umeda, 3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | The Michelin Bib Gourmand-recommended birthplace of takoyaki! Unlike modern versions drenched in sauce and mayonnaise, Aizuya serves takoyaki in its original form without any toppings. The bite-sized balls feature a batter seasoned with soy sauce and dashi beef stock\u2014crispy on the outside, molten and melt-in-your-mouth on the inside. Bursting with savory stock flavor and big chunks of chewy octopus, these delightfully simple bites are addictively delicious.", "name": "Aizuya Umeda", "transport": "Directly connected to Eki March\u00e9 from JR Osaka Station Sakurabashi Exit"}, {"address": "B1F Daimaru Umeda, 3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | Osaka\u0027s quintessential grab-and-go dessert that always draws a line! Whenever the chime rings, a fresh batch of Uncle Rikuro\u0027s famous cheesecake hot from the oven is ready. Made with imported Danish cream cheese, rich milk, and sweet plump raisins at the bottom, it boasts a cloud-like, airy texture that melts instantly in your mouth with gentle sweetness and rich dairy aroma. Whether eaten immediately or enjoyed back at your hotel as a late-night treat, it\u0027s an absolute must-try.", "name": "Rikuro-ojisan no Mise Daimaru Umeda", "transport": "Approx. 1-min walk from JR Osaka Station Central Exit, directly connected to Daimaru Department Store"}, {"address": "B1F Hanshin Department Store Umeda Main Store, 1-13-13 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 Stars | A legendary takoyaki chain famous for huge octopus chunks and an insanely creamy, molten interior. A splash of white wine is sprayed right before finishing to add a fragrant aroma. The velvety batter is infused with rich dashi stock, wrapping around extra-large octopus pieces. Brushed with signature savory sauce and topped with dancing bonito flakes that sway in the heat, it offers dynamic textures and depth\u2014a must-buy street snack while wandering through Umeda\u0027s underground street.", "name": "Takoya Dotonbori Kukuru Hanshin Umeda", "transport": "Directly connected to Hanshin Osaka-Umeda Station / Approx. 3-min walk from JR Osaka Station"}, {"address": "10F LUCUA Osaka, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | The iconic Tsutenkaku kushikatsu brand brings its fast and easy street food dining experience to the LUCUA mall in Umeda. Using custom fine flour batter and signature beef tallow frying oil, they create an ultra-crispy, non-greasy crust that seals in classic beef skewers, quail eggs, cheese, fresh shrimp, and more. Crispy on the outside and tender on the inside, dipping them into the savory-sweet signature sauce makes every bite addictively flavorful\u2014a huge hit with tourists.", "name": "Kushikatsu Daruma LuCua Osaka", "transport": "Directly connected to LUCUA Department Store from JR Osaka Station Bridge Gate"}, {"address": "B1F Hanshin Department Store Umeda Main Store, 1-13-13 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | A stellar croquette specialist located in Umeda\u0027s underground food market. Crafted from premium Hokkaido Danshaku potatoes and Japanese Black Wagyu beef, then coated in fresh breadcrumbs and fried to order. The golden shell delivers a satisfying crunch, revealing silky, sweet mashed potatoes infused with rich beef flavors inside. Piping hot and perfect for munching on the move, its natural potato and meat sweetness makes it a standout favorite in the underground food market.", "name": "Kobe Croquette Hanshin Umeda", "transport": "Directly connected to Hanshin Osaka-Umeda Station / Approx. 3-min walk from JR Osaka Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delights"}}, "name": "Umeda and Osaka Station Shopping District"}};
        const themeHex = "#dc2626";
        const cityName = "Osaka";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
