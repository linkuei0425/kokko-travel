    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | Osaka\u0027s most iconic historical landmark, built in the 16th century by Toyotomi Hideyoshi. The interior displays rich Sengoku period artifacts, and the top floor offers panoramic views of Osaka city.", "duration": "2-3 hours", "title": "Osaka Castle Main Keep", "transport": "Take the Osaka Metro Tanimachi Line to Tanimachi 4-chome Station, Exit 1B, then walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | Osaka\u0027s most vibrant district, famous for its giant 3D signboards and the iconic \"Glico Running Man\" landmark. A must-visit destination to experience Osaka\u0027s food culture and lively nightlife.", "duration": "2-3 hours", "title": "Dotonbori", "transport": "Take the Osaka Metro Midosuji Line to Namba Station, Exit 14, then walk for about 3 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | An iconic observation tower in the Shinsekai area, filled with nostalgic Showa-era charm. The top floor houses the statue of \"Billiken\", a deity believed to bring good luck.", "duration": "1-2 hours", "title": "Tsutenkaku Tower", "transport": "Take the Osaka Metro Sakaisuji Line to Ebisucho Station, Exit 3, then walk for about 3 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A world-class theme park featuring highly popular areas like \"Super Nintendo World\" and \"The Wizarding World of Harry Potter\", offering immensely immersive entertainment experiences.", "duration": "6-8 hours", "title": "Universal Studios Japan", "transport": "Take the JR Sakurajima Line (JR Yumesaki Line) to Universal City Station and walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | A circular open-air observation deck atop twin towers, offering breathtaking 360-degree views at a height of 170 meters. It\u0027s the ultimate spot to enjoy Osaka\u0027s stunning sunsets and dazzling nightscapes.", "duration": "1-2 hours", "title": "Umeda Sky Building Floating Garden Observatory", "transport": "Take the JR to Osaka Station or the Osaka Metro to Umeda Station, then walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Founded by Prince Shotoku in 593 AD, it is one of Japan\u0027s oldest officially administered temples, showcasing Asuka-style architectural design and a serene atmosphere.", "duration": "1-2 hours", "title": "Shitennoji Temple", "transport": "Take the Osaka Metro Tanimachi Line to Shitennoji-mae Yuhigaoka Station, Exit 4, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | The head shrine of over 3,000 Sumiyoshi shrines across Japan. Its unique \"Sumiyoshi-zukuri\" main hall is designated as a National Treasure, and the arched Sorihashi Bridge (Taiko Bridge) is a famous photo landmark.", "duration": "1-2 hours", "title": "Sumiyoshi Taisha Shrine", "transport": "Take the Hankai Tramway Hankai Line to Sumiyoshi-Torii-mae Station, located right outside"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | One of the world\u0027s largest aquariums, themed around recreating the ecosystems of the Pacific Rim Ring of Fire. Its massive central tank features magnificent whale sharks and diverse marine life.", "duration": "2-3 hours", "title": "Osaka Aquarium Kaiyukan", "transport": "Take the Osaka Metro Chuo Line to Osakako Station, Exit 1, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Known as \"Osaka\u0027s Kitchen\" with nearly 200 years of history, it hosts over a hundred stalls serving fresh seafood, Wagyu beef, sea urchin, and authentic local street food.", "duration": "1-2 hours", "title": "Kuromon Ichiba Market", "transport": "Take the Osaka Metro Sennichimae Line or Sakaisuji Line to Nippombashi Station, Exit 10, then walk for about 2 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | A charming riverfront park nestled between Dojima River and Tosabori River, featuring a gorgeous rose garden and classic red-brick retro architecture like the Osaka City Central Public Hall.", "duration": "1-2 hours", "title": "Nakanoshima Park", "transport": "Take the Osaka Metro Midosuji Line or Keihan Main Line to Yodoyabashi Station, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Adjacent to Osaka Castle, the museum features life-size 1:1 scale recreations of various historical periods, such as the ancient Naniwa Palace, offering visitors an immersive journey through Osaka\u0027s history.", "duration": "1-2 hours", "title": "Osaka Museum of History", "transport": "Take the Osaka Metro Tanimachi Line to Tanimachi 4-chome Station, Exit 9 for direct access"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Located within Tennoji Park, it houses thousands of precious artworks including ancient Japanese art, Chinese calligraphy, paintings, and stone Buddhist statues, offering deep cultural richness.", "duration": "1-2 hours", "title": "Osaka City Museum of Fine Arts", "transport": "Take the Osaka Metro Midosuji Line to Tennoji Station, Exit 5, then walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 5 Stars | Osaka\u0027s quintessential covered shopping arcade spanning approximately 600 meters. Packed with fashion brands, cosmetics shops, and local delicacies, it is the top spot to experience modern Osaka trend culture.", "duration": "2-3 hours", "title": "Shinsaibashisuji Shopping Street", "transport": "Take the Osaka Metro Midosuji Line to Shinsaibashi Station, directly connected"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | Dedicated to Sugawara no Michizane, the deity of learning, it is a sacred spot for students praying for academic success and the host location for the Tenjin Matsuri, one of Japan\u0027s top three festivals.", "duration": "1 hour", "title": "Osaka Tenmangu Shrine", "transport": "Take the Osaka Metro Tanimachi Line to Minamimorimachi Station or the JR Tozai Line to Osakatenmangu Station, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4 Stars | An urban zoo with over a century of history that recreates the natural habitats of its animals, making it perfect for family outings to embrace the beauty of nature.", "duration": "2-3 hours", "title": "Tennoji Zoo", "transport": "Take the Osaka Metro Midosuji Line to Dobutsuen-mae Station, Exit 1, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | Japan\u0027s first museum themed around housing history and culture, featuring life-sized recreations of Edo-period Osaka streetscapes and kimono experiences.", "duration": "1-2 hours", "title": "Osaka Museum of Housing and Living", "transport": "Directly connected to Exit 3 of Tenjinbashisuji 6-chome Station via Osaka Metro Sakaisuji or Tanimachi Line"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4 Stars | A distinctive shrine famous for its massive Shishiden (Lion Stage). The 12-meter-tall giant lion head opens its mouth wide, symbolizing swallowing bad luck and bringing good fortune.", "duration": "0.5-1 hour", "title": "Namba Yasaka Shrine", "transport": "About a 6-minute walk from Namba Station on the Osaka Metro Midosuji Line"}, {"category": "\ud83c\ud nute Shinki Bus ride from JR Himeji Station"}, {"category": "Himeji", "description": "\u2b50 4.3 stars | Take the scenic ropeway straight to Engyo-ji Temple at the summit, taking in breathtaking panoramic views of Himeji City and the Harima Plain along the way.", "duration": "1.5 hours", "title": "Mt. Shosha Ropeway", "transport": "Take a Shinki Bus from JR Himeji Station and get off at Shosha Ropeway"}];
        const intercityPool = [{"boarding_location": "JR Osaka Station, Hankyu Osaka-Umeda Station, Keihan Yodoyabashi Station", "method": "JR Special Rapid Service / Hankyu Railway Limited Express / Keihan Railway Limited Express", "route": "Osaka \u2794 Kyoto", "schedule": "First train around 05:00, last train around 23:45; departs every 5-10 minutes during peak hours", "tickets": ["JR Train Ticket (approx. \u00a5570 one-way)", "Hankyu Tourist Pass", "Kansai Thru Pass", "ICOCA / Suica IC Cards"], "time": "Approx. 29 - 45 minutes"}, {"boarding_location": "Kintetsu Osaka-Namba Station", "method": "Kintetsu Nara Line Rapid Express", "route": "Osaka \u2794 Nara", "schedule": "First train around 05:15, last train around 23:30; departs every 10-15 minutes", "tickets": ["Kintetsu One-way Ticket (approx. \u00a5680)", "Kintetsu Rail Pass", "ICOCA / Suica IC Cards"], "time": "Approx. 35 - 40 minutes"}, {"boarding_location": "JR Shin-Osaka Station", "method": "Tokaido Shinkansen (Nozomi Bullet Train)", "route": "Osaka \u2794 Tokyo", "schedule": "First train at 06:00, last train at 21:24; departs every 5-10 minutes", "tickets": ["Shinkansen Ordinary Car Reserved/Non-Reserved Seat Ticket (approx. \u00a513,870 - \u00a514,720 one-way)", "Whole Japan Rail Pass (JR Pass)"], "time": "Approx. 2 hours 30 minutes"}];
        const cityName = "Osaka";
        const dynamicCats = ["\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "\ud83c\udf5c Food \u0026 Cafe", "\ud83c\udf5c Food \u0026 Coffee", "Kyoto", "Nara", "Kobe", "Himeji"];
        
        let myTrip = { 1: [] }; 
        let currentDay = 1;
        let totalDays = 1;
        let activeTab = 'schedule';
        let currentFilter = 'All';

        const poolContainer = document.getElementById('pool-container');
        const cartContainer = document.getElementById('cart-container');
        const emptyState = document.getElementById('empty-state');
        const tripCount = document.getElementById('trip-count');
        const fabCount = document.getElementById('fab-count'); 
        const daySelector = document.getElementById('day-selector');
        const tabSchedule = document.getElementById('tab-schedule');
        const tabIntercity = document.getElementById('tab-intercity');
        const filterWrapper = document.getElementById('filter-wrapper'); 
        const cartDrawer = document.getElementById('cart-drawer');
        const mobileOverlay = document.getElementById('mobile-overlay');

        // Toggle Mobile Cart Drawer
        function toggleMobileCart() {
            if (cartDrawer.classList.contains('drawer-closed')) {
                cartDrawer.classList.remove('drawer-closed');
                cartDrawer.classList.add('drawer-open');
                mobileOverlay.classList.remove('hidden');
            } else {
                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }
        }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {
            const container = document.getElementById('filter-bar');
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function switchTab(tab) {
            activeTab = tab;
            if(tab === 'schedule') {
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                filterWrapper.style.display = 'block'; 
            } else {
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                filterWrapper.style.display = 'none'; 
            }
            renderPool();
        }

        function filterCategory(category) {
            currentFilter = category;
            ['All', '🏛️ Attractions', '🛍️ Shopping', '🍜 Dining', ...dynamicCats].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
