            "@type": "PostalAddress",

        const dbData = {"bay-area-usj": {"categories": {"cat_1": {"items": [{"address": "2-6-39 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Built in 1923 (Taisho 12), the Chikko Red Brick Warehouse in Osaka\u0027s Minato Ward stands as an essential witness to Osaka Port\u0027s history and a century-old architectural landmark. Rich in retro charm with its red bricks and tiles, this historic complex has been repurposed into a multi-cultural venue combining a classic car museum, an English garden, and fine dining restaurants. Rare vintage automobiles from around the world are displayed inside, where red brick walls and metallic structural elements weave a striking modern industrial vibe. It is one of the few historical sites in the Osaka Bay area that perfectly preserves the port area\u0027s Taisho-era ambiance.", "name": "GLION MUSEUM / Red Brick Warehouse", "transport": "Take the Osaka Metro Chuo Line to Osaka-ko Station, Exit 4, and walk for about 5 minutes."}, {"address": "Between 2-chome Nishikujo, Konohana Ward and 1-chome Ajigawa, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Completed in 1944 (Showa 19), the Ajigawa Tunnel is Japan\u0027s first submerged-tube pedestrian riverbed tunnel, holding immense value in modern engineering history and hydraulic architecture. Connecting Konohana Ward and Minato Ward, the design opted for a 12-meter-deep under-river tunnel instead of a bridge to avoid impeding large ships on the Aji River. Today, both ends still retain their elevator tower buildings featuring early Showa-era classic industrial aesthetics. Visitors can take large elevators or walk down the stairs deep underground to experience the unique historic feeling of walking beneath a riverbed.", "name": "Ajigawa Tunnel", "transport": "Take the JR Loop Line or Hanshin Namba Line to Nishi-Kujo Station, and walk for about 10 minutes."}, {"address": "3-2 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Tempozan Park traces its origins to the Aji River dredging project during the Edo Period in 1831 (Tenpo 2), where excavated soil was piled up into a hill to serve as a navigation marker, birthing Tempozan\u0027s history. Once a famed scenic spot of Osaka Port during the Edo and Meiji eras, Emperor Meiji reviewed Japan\u0027s first modern naval fleet review here in 1868. The \u0027Emperor Meiji Monument\u0027 stands within the park to commemorate this historical milestone. Standing at an elevation of just 4.53 meters, Mount Tempo was long known as Japan\u0027s lowest natural mountain, combining historical significance with local landmark cultural value.", "name": "Tempozan Park \u0026 Emperor Meiji Monument", "transport": "Take the Osaka Metro Chuo Line to Osaka-ko Station, Exit 1, and walk for about 7 minutes."}, {"address": "1-14-16 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Completed in 1995 and standing 256 meters tall, Sakishima Cosmo Tower is an iconic modern landmark and high-altitude observatory in the Osaka Bay area. Featuring striking geometric aesthetics and futuristic facade lines, the building stands at the heart of Sakishima New Town. A transparent slanted elevator takes visitors directly to the 55th-floor 360-degree panoramic observatory deck, offering sweeping views of Osaka Bay, Kansai International Airport, Akashi Kaikyo Bridge, and the glowing night cityscape of Universal Studios Japan. It perfectly embodies Osaka\u0027s late-20th-century architectural ambition to become an international port metropolis.", "name": "Sakishima Cosmo Tower Observatory", "transport": "Take the Osaka Metro Nanko Port Town Line (New Tram) to Nakafuto Station or Trade Center-mae Station, and walk for about 5 minutes."}, {"address": "3-chome Kaigandori, Minato Ward, Osaka, Osaka Prefecture (Tempozan Boarding Pier)", "feature": "\u2b50 4.3 stars | The Tempozan Ferry is the most iconic route in Osaka\u0027s municipal public ferry system. Dating back to the Meiji era, it serves as a historic living fossil of Osaka\u0027s traditional \u0027Aqua Metropolis\u0027 transit network. Cruising back and forth between Tempozan in Minato Ward and Sakurajima in Konohana Ward, the ferry remains completely free for both locals and tourists. As it crosses the mouth of the Aji River, passengers can look up closely at the grand structures of the Tempozan Bridge and the Tempozan Giant Ferris Wheel, making it a wonderful cultural spot to experience Osaka\u0027s modern port development history and unique water transport culture.", "name": "Tempozan Ferry Terminal", "transport": "Take the Osaka Metro Chuo Line to Osaka-ko Station, and walk for about 10 minutes to the ferry terminal next to Tempozan Park."}, {"address": "Between 2-chome Tsurumachi, Taisho Ward and 2-chome Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Completed in 2003, Chitose Bridge is a bright blue double-arch steel bridge spanning the Taisho Waterway between Taisho Ward and Minato Ward. Celebrated as one of the most beautiful modern bridge engineering marvels in the Osaka Bay area, the 365-meter-long bridge features gracefully curved tied-arch structures. Its vibrant royal blue frame creates a dramatic visual impact against the blue sky and bay waters. Equipped with well-designed pedestrian walkways and viewing platforms, walking across offers distant views of bustling ship traffic along Osaka Port and the city\u0027s waterways, showcasing a harmonious blend of modern steel bridge engineering and harbor landscape.", "name": "Chitose Bridge", "transport": "Take the Osaka City Bus (No. 87 or No. 91) to Tsurumachi 2-chome stop, and walk for about 3 minutes to reach the bridge."}, {"address": "1-chome Kaigandori, Minato Ward, Osaka, Osaka Prefecture (Central Jetty)", "feature": "\u2b50 4.2 stars | Located at the tip of the Central Jetty of Osaka Port, \u0027Diamond Point\u0027 is a waterfront scenic landmark steeped in modern maritime port history. Ever since the port redevelopment in the 1970s, it has been renowned as the ultimate spot for taking in Osaka Bay\u0027s glorious sunsets and has been selected as one of \u0027Japan\u0027s Top 100 Sunset Spots.\u0027 Featuring a unique symbolic sculpture celebrating the sun and ocean, visitors can gaze out at the Hanshin Expressway Wangan Route Tempozan Bridge and passing cargo ships\u2014a location that seamlessly blends Osaka Port\u0027s modern industrial history with contemporary coastal views.", "name": "Osaka Port Diamond Point", "transport": "Take the Osaka Metro Chuo Line to Osaka-ko Station, Exit 1 or 2, and walk west for about 12 minutes."}, {"address": "Between 4-chome Kaigandori, Minato Ward and 1-chome Tsurumachi, Taisho Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Spanning the waters of Osaka Port between Taisho Ward and Minato Ward, Namihaya Bridge opened to traffic in 1995 and went viral for its thrillingly steep, roller-coaster-like incline, making it one of the most breathtaking highway bridge engineering wonders in the Osaka Bay area. Totaling 1.7 km in length with its peak reaching 45 meters above the water level, it was specifically engineered to allow large cargo ships to navigate underneath effortlessly. Strolling along the pedestrian walkway feels like walking into the sky; from the top, visitors are treated to breathtaking panoramas of Osaka Bay, the Tempozan Giant Ferris Wheel, and distant harbor vistas\u2014a masterpiece of civil engineering.", "name": "Namihaya Bridge", "transport": "Take the Osaka Metro Chuo Line to Osaka-ko Station and walk for about 15 minutes, or take the Osaka City Bus to Tsurumachi 1-chome stop."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "2-6-39 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Located inside the nearly century-old Chikko Red Brick Warehouse complex in Osaka\u0027s Port Area, GLION MUSEUM is a retro classic car museum lovingly restored from historic red brick warehouses. The facility cleverly blends traditional Japanese red brick architecture with British vintage flair, displaying rare classic and vintage cars from around the world. In addition to static car exhibits, the site features a refined steakhouse and a vintage caf\u00e9. Steeped in nostalgic and exotic artistic vibes, it is an unmissable Osaka Bay landmark for car enthusiasts and photography lovers.", "name": "GLION MUSEUM Classic Car Museum", "transport": "About a 5-minute walk from Exit 4 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "1-5-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Formerly the famous Suntory Museum, this impressive structure was designed by renowned Japanese architect Tadao Ando. The building prominently features exposed concrete and geometric 3D glass structures, showcasing a bold modernist architectural aesthetic. Inside, it houses world-class exhibition spaces and a 3D IMAX Theater, regularly hosting international contemporary art exhibitions, Ukiyo-e special displays, anime visual art shows, and design craft exhibitions, making it a prominent cultural landmark in the Osaka Bay Area.", "name": "Osaka Culturarium at Tempozan", "transport": "About a 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "2-2-15 Hokkoryokuchi, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated within the Maishima Seaside Park in Osaka Bay, this contemporary pottery cultural center focuses on ceramic art created using \u0027Naniwazu clay\u0027 harvested from the Osaka Bay seabed. The facility features professional wood-fired climbing kilns and pottery workshops. Beyond displaying ceramic works inspired by the sea and nature, it offers hands-on pottery wheel and clay sculpting workshops. Travelers can shape their own unique ceramic souvenirs amidst the quiet greenery surrounded by sea breezes, experiencing the distinctive cultural craft charm of Osaka Bay.", "name": "Maishima Pottery Village", "transport": "Take the Maishima Active Bus from JR Sakurajima Station on the JR Sakurajima Line and get off at \u0027Maishima Togeikan-mae\u0027 stop"}, {"address": "1-3-5 Takami, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located in Konohana Ward near the bay area, this is an immersive tech and ecology museum. Following a comprehensive upgrade, the museum utilizes interactive multimedia, 3D videos, and underground exploration zones to present urban water recycling, environmental protection, and the evolution of modern civilization in a fun and engaging way. The high-tech architecture and educational interactive exhibits make it a fantastic destination for families and art/culture-minded travelers interested in urban engineering.", "name": "Osaka Sewerage Science Museum", "transport": "About a 5-minute walk from Fuku Station on the Hanshin Namba Line"}, {"address": "1-13-11 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A freestanding artistic chapel located within an upscale hotel in Nanko, Osaka Bay, crafted by a renowned architectural team. Centered around the concept of \u0027wood grain and natural light,\u0027 the geometrically interwoven wooden structures create a warm and romantic atmosphere reminiscent of dappled sunlight in a forest. Large floor-to-ceiling glass windows flood the interior with bright natural light from the bay, making it a chapel landmark of high architectural aesthetic value and fairytale wedding charm in the Osaka Bay area.", "name": "Eternite Chapel at Grand Prince Hotel Osaka Bay", "transport": "About a 3-minute walk from Nakafuto Station on the Nanko Port Town Line (New Tram)"}, {"address": "2-1-10 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A large-scale venue for arts, culture, and exhibitions located within the Asia \u0026 Pacific Trade Center (ATC) in Sakishima. It hosts a diverse array of creative markets, picture book art displays, digital light art shows, and international cultural expos year-round. Built along the coast, the surrounding area features a spacious seaside wooden boardwalk and waterfront plaza. After enjoying the exhibitions, visitors can stroll along the shore and indulge in a relaxing time surrounded by both art and coastal scenery.", "name": "ATC Hall", "transport": "Directly connected to Trade Center-mae Station on the Nanko Port Town Line (New Tram)"}, {"address": "1-14-16 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located inside one of Western Japan\u0027s iconic skyscrapers, the Sakishima Cosmo Tower. Beyond the 360-degree panoramic observatory on the 55th floor, the upper levels frequently host art photography exhibits, architectural design shows, and high-altitude visual art exhibitions. While taking in contemporary visual art displays, visitors can also look out over breathtaking views of Osaka Bay, the Akashi Kaikyo Bridge, and Kansai International Airport, perfectly blending visual art with harbor vistas.", "name": "Osaka Sakishima Cosmo Tower Art Space", "transport": "About a 3-minute walk from Exit 2 of Trade Center-mae Station on the Nanko Port Town Line (New Tram)"}, {"address": "2-3-20 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | A massive hemispherical glass structure sitting on the waters of Osaka Bay, designed by famed French architect Paul Andreu. Although the museum itself is currently inactive and undergoing transition/restoration plans, its stunning glass dome remaining on the water is still a visually striking landmark in Osaka Bay. Gazing out from the shore at this artistic crystal sphere floating on the sea is a pilgrimage-worthy bay view for many architecture and photography enthusiasts.", "name": "Former Maritime Museum Osaka (Naniwa-no-Umi no Jikukan Dome)", "transport": "About a 10-minute walk from Cosmosquare Station on the Nanko Port Town Line (New Tram) to the waterfront for a view"}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "3-2 Chikko, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located next to Tempozan Harbor Village in the Osaka Bay Area, Tenpozan Park features Mount Tenpo, famous for being Japan\u0027s lowest natural peak (at just 4.53 meters high). Originally created during the Edo period as an artificial hill from soil dredged during the cleanup of the Aji River, it has been transformed into a unique urban oasis. The park is planted with abundant cherry blossom trees and greenery, making it a popular cherry blossom viewing spot every spring. Visitors can ascend to the 4.53-meter summit of Mount Tenpo and head to the park\u0027s observation deck to enjoy bright views of the Osaka Bay area. You can also admire the unique coastal scenery created by the Tenpozan Bridge and large harbor sightseeing ships. It is an urban park that seamlessly blends history, nature, and a relaxing atmosphere.", "name": "Tenpozan Park", "transport": "About a 7-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "2-1-87 Hokukoryokuchi, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Osaka Maishima Seaside Park is one of the premier scenic natural parks in the Osaka Bay Area, most famous for its grand Nemophila Festival held annually from April to May. Spanning a vast 4.4-hectare hill, the park features over 1 million blooming baby blue eyes (Nemophila). In full bloom, the azure flowers blend seamlessly with the blue sky and Osaka Bay, creating a dreamlike landscape akin to a vast blue carpet. Beyond the spring blue sea of flowers, autumn brings beautiful displays of sunflowers and lilies. Right along the coast, the park offers extremely wide open views and is selected as one of Japan\u0027s Top 100 Sunset Spots. Strolling along the breezy coastal paths, visitors can take in panoramic views of the Akashi Kaikyo Bridge, making it a top choice for photographers and nature lovers.", "name": "Osaka Maishima Seaside Park", "transport": "From Sakurajima Station on the JR Sakurajima Line, take the Maishima Active Bus and get off at \u0027Hotel Lodge Maishima-mae\u0027 stop"}, {"address": "3-5-30 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Covering about 19 hectares on the artificial island of Sakishima in Osaka Bay, Osaka Nanko Bird Sanctuary is a nationally important wetland reserve. It stands as a classic example of a reclaimed wetland successfully transformed into a thriving wildlife habitat, serving as a crucial stopover on international migratory bird routes. The sanctuary preserves rich ecosystems of mangroves, mudflats, and freshwater ponds, attracting over 200 species of waterfowl and raptors every year. It features a large, professional Observation Hide equipped with high-powered telescopes and detailed ecological displays, allowing visitors to observe sandpipers, plovers, and various waterbirds foraging and resting without disturbing them. Walking along the lush wooden boardwalks offers a pure, refreshing nature experience far away from the hustle and bustle of the city.", "name": "Osaka Nanko Bird Sanctuary", "transport": "About a 15-minute walk from Exit 2 of Nakafuto Station on the Osaka New Tram"}, {"address": "2-1 Hokukoryokuchi, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Maishima Ryokuchi Park is a spacious, vibrant coastal park located on the western side of Maishima artificial island in Osaka Bay. Featuring artistic giant windmills and expansive lawn plazas, it is a favorite spot for local residents to enjoy outdoor picnics, kite flying, and family activities. The park\u0027s highlight is its stone-paved coastal promenade that stretches along the shoreline, complete with uniquely designed observation towers and waterfront recreational amenities. Breezy and open, it offers direct views of the wide Osaka Bay, with stunning sunsets that paint the entire skyline crimson. The park also houses an all-weather BBQ area and campsites, blending rich natural greenery with a relaxed harbor vibe that showcases the unique coastal energy of Osaka Bay.", "name": "Maishima Ryokuchi Park", "transport": "From Nishikujo Station on the JR Loop Line, take Osaka City Bus No. 81 and get off at \u0027Maishima Sports Island\u0027 stop"}, {"address": "2-1 Nankonaka, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located at the heart of the Sakishima residential district in Osaka, Nanko Port Town Central Park is a core ecological park connecting the entire green belt of the port town. The park features a vast pond, tree-lined avenues, and large flower plazas that change beautifully with the seasons. Its main attraction is the winding waterfront path and artificial stream that flow through the grounds, offering distinct seasonal charm\u2014cherry blossoms bloom along the pond in spring, while summer brings vibrant greenery and cool waterscapes. Car-free, quiet, and safe, it provides local residents and travelers an excellent venue for strolling and birdwatching. The spacious lawns are perfect for laying out a picnic blanket to enjoy a relaxed afternoon in the sun, showcasing the harmonious, livable side of the Osaka Bay Area.", "name": "Nanko Port Town Central Park", "transport": "Located right outside Port Town Chuo Station on the Osaka New Tram"}, {"address": "1-chome Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Stretching along the Sakishima coastline, Cosmo Square Seaside Park is a modern waterfront green space boasting stunning ocean views. The park features broad, paved wooden boardwalks, manicured grassy areas, and cozy benches, allowing visitors to get right up close to Osaka Bay. Facing the mouth of the Aji River and the main channel of Osaka Port, it offers broad, unobstructed views of large cargo ships, cruise boats, and sailboats entering and leaving the harbor. As evening falls, the park transforms into a hidden haven for watching the sun sink below the horizon, with the silhouette of the distant Akashi Kaikyo Bridge glowing in the twilight. At night, the brilliant lights of Universal Studios Japan and the harbor area across the water create an incredibly romantic atmosphere.", "name": "Cosmo Square Seaside Park", "transport": "About a 3-minute walk from Exit 3 of Cosmosquare Station on the Osaka Metro Chuo Line or New Tram"}, {"address": "1-3 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Situated right along the southern shore next to the famous Universal Studios Japan (USJ), Sakurajima Park is a charming park that blends lush greenery with coastal bay views. It features well-maintained lawns, coastal flora, and a seaside walking path extending for several hundred meters. Thanks to its position near the mouth of the Aji River, visitors can enjoy cool sea breezes with a hint of ocean salt while taking in views of the massive Tempozan Giant Ferris Wheel and passing ships across the water. Considerably quieter and more serene than the nearby theme park area, it serves as a wonderful hidden gem for USJ visitors to take a quick rest, catch a breath of fresh air, and enjoy the sunset over Osaka Bay before entering or after leaving the park.", "name": "Sakurajima Park", "transport": "About a 5-minute walk from the exit of Sakurajima Station on the JR Sakurajima Line"}, {"address": "Along the riverbank from Kunijima to Takami, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located in the Konohana section where the Yodo River meets Osaka Bay, the Left Bank Area of Yodogawa Riverside Park is a key green space extending the national park down to the river mouth. It boasts vast natural lawns and open, unobstructed views, with miles of dedicated cycling paths and pedestrian trails along the river embankment\u2014a true paradise for cyclists and runners. The park features a variety of seasonal flowers, with wildflowers and cherry blossoms bursting into life along the embankment in spring. Sitting on the sprawling grassy riverbank, visitors can gaze out at the majestic mouth of Osaka Bay and the harbor bridges, experiencing the grand, open natural charm of a major river reaching the sea. It is a quintessential natural park for experiencing the unique interplay of water and land in the Osaka Bay area.", "name": "Yodogawa Riverside Park Konohana Area", "transport": "About a 10-minute walk from Chidoribashi Station or Dempo Station on the Hanshin Main Line"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Located right in front of the entrance to Universal Studios Japan, this giant rotating globe is a classic landmark that every visitor to USJ must take a photo with. The massive oasis pool combined with the spinning globe featuring the glowing \u0027UNIVERSAL\u0027 text creates an impressive and memorable backdrop, whether under the bright daytime sky or lit up at night. It is an iconic photo spot you cannot miss when visiting the Osaka Bay area.", "name": "Universal Studios Japan Globe", "transport": "Approx. 3-minute walk from Universal-City Station on the JR Sakurajima Line (JR Yumesaki Line)"}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Universal Studios Japan)", "feature": "\u2b50 4.8 stars | Super Nintendo World perfectly recreates scenes from Nintendo\u0027s classic Mario games, with the massive Bowser stone statue and stone castle walls at the entrance of Bowser\u0027s Castle serving as an ultimate photo spot. Step inside and feel as though you\u0027ve been transported directly into a game stage. Featuring giant Bowser trophies, mysterious lighting design, vivid colors, and rich details, it attracts countless gamers to capture memorable photos.", "name": "Super Nintendo World - Bowser\u0027s Castle", "transport": "Walk from inside Universal Studios Japan after arriving at Universal-City Station on the JR Sakurajima Line"}, {"address": "2-1-33 Sakurajima, Konohana Ward, Osaka, Osaka Prefecture (Inside Universal Studios Japan)", "feature": "\u2b50 4.8 stars | Majestically looming over the lakeside, Hogwarts Castle\u2014along with its stunning reflection mirrored on the surface of the Black Lake\u2014is one of the most popular photo spots in Universal Studios Japan. Whether capturing the grand architectural details under a clear daytime sky or the magical, mysterious atmosphere illuminated at dusk and night, you can take dreamlike photos that look straight out of a movie scene.", "name": "The Wizarding World of Harry Potter - Hogwarts Castle", "transport": "Walk from inside Universal Studios Japan after arriving at Universal-City Station on the JR Sakurajima Line"}, {"address": "1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Standing at 112.5 meters tall, the Tempozan Giant Ferris Wheel was once the world\u0027s tallest Ferris wheel, offering a 15-minute ride. At night, colorful LED illuminations light up the wheel to display weather forecasts or fireworks patterns. Whether capturing the brilliant lights from the ground or gazing down at the night view of Osaka Bay and Universal Studios from inside the fully transparent glass cabin, this is an exceptionally popular spot for photos.", "name": "Tempozan Giant Ferris Wheel", "transport": "Approx. 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "1-1-10 Kaigandori, Minato Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | As one of the world\u0027s largest aquariums, its most famous photo spot is the giant \u0027Pacific Ocean\u0027 tank spanning multiple stories. As massive, graceful whale sharks and manta rays glide past beside or above you, the deep blue underwater light shines onto your silhouette, creating dreamlike, mysterious deep-sea style photos.", "name": "Osaka Aquarium Kaiyukan - Giant Whale Shark Tank", "transport": "Approx. 5-minute walk from Exit 1 of Osakako Station on the Osaka Metro Chuo Line"}, {"address": "1-14-16 Nankokita, Suminoe Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Located on the top floor of the tallest building in the Osaka Bay area, the 55th-floor observatory offers a 360-degree ultra-wide panoramic view. The sloped glass design allows visitors to get up close to watch the golden sunset over Osaka Bay and the sparkling night lights of the Osaka Port area and USJ. It is a hidden gem photo spot that photography enthusiasts should not miss.", "name": "Osaka Sakishima Cosmo Tower Observatory", "transport": "Approx. 5-minute walk from Nakafuto Station on the Nanko Port Town Line (New Tram)"}, {"address": "6-2-61 Shimaya, Konohana Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | An American-style commercial street connecting JR Universal-City Station to the entrance of USJ, filled with vibrant neon signs, giant takoyaki statues, and a giant King Kong figure. The entire street glows brightly at night with a lively entertainment vibe, making it a popular photo and dining spot to sample local Osaka delicacies after leaving the park.", "name": "Universal CityWalk Osaka", "transport": "Located right outside Universal-City Station on the JR Sakurajima Line"}, {"address": "3-5 Kaigandori, Minato Ward, Osaka, Osaka Prefecture (Around Tempozan Passenger Terminal)", "feature": "\u2b50 4.3 stars | Located on the waterfront edge of Osaka Port, Diamond Point has been selected as one of \u0027Japan\u0027s Top 100 Sunsets\u0027. Offering a wide, unobstructed ocean view, as the setting sun slowly sinks into the Osaka Bay horizon, the sea and sky are painted in blending gradients of gold and purple-red. Paired with the distant silhouette of the Hanshin Expressway Minato Bridge, it is an exceptionally romantic photo spot for couples and photographers.", "name": "Diamond Point at Osaka Port - Sunset View", "transport": "Approx. 10-minute walk from Osakako Station on the Osaka Metro Chuo Line"}], "name": "Top Photo-Worthy Spots"}}, "name": "Osaka Bay Area \u0026 Universal Studios"}, "nakanoshima-kitahama": {"categories": {"cat_1": {"items": [{"address": "1-1-27 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Osaka City Central Public Hall is Nakanoshima\u0027s most iconic red-brick Western-style building. Built in 1918 (Taisho 7) with donations from stockbroker Einosuke Iwamoto, it was designed by a team of master architects including Kingo Tatsuno. This Neo-Baroque and Renaissance-style structure is designated an Important Cultural Property of Japan. Its interior features exquisite ceiling paintings and stained glass (particularly in the Special Conference Room accessible during special guided tours), showcasing the prosperity and peak craftsmanship of the Taisho Romanticism era. Illuminated at night, its classic dome and red-brick facade glow brilliantly along the canal, making it an unmissable landmark for photography enthusiasts and travelers visiting Osaka.", "name": "Osaka City Central Public Hall", "transport": "About a 5-minute walk from Exit 1 of Yodoyabashi Station on the Osaka Metro Midosuji Line, or a 1-minute walk from Exit 1 of Naniwabashi Station on the Keihan Nakanoshima Line."}, {"address": "1-2-10 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Completed in 1904 (Meiji 37), the Osaka Prefectural Nakanoshima Library is a Neoclassical architectural masterpiece funded and donated by the Sumitomo family. Its exterior boasts grand Neoclassical stone pillars reminiscent of a majestic Greek temple, while the central hall inside features a magnificent domed wooden structure and a Renaissance-style staircase\u2014designated an Important Cultural Property of Japan. To this day, the library houses a vast collection of precious historical and commercial documents about Osaka, alongside a charming cafe where visitors can savor delicious meals immersed in an atmosphere of classic art and literature.", "name": "Osaka Prefectural Nakanoshima Library", "transport": "About a 3-minute walk from Exit 1 of Yodoyabashi Station on the Osaka Metro Midosuji Line, or a 3-minute walk from Oebashi Station on the Keihan Nakanoshima Line."}, {"address": "2-1-45 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located at the intersection of Midosuji and Dojima River, the former building of the Bank of Japan Osaka Branch was built in 1903 (Meiji 36) and designed in Neoclassical style by Kingo Tatsuno, the father of modern Japanese architecture. Crafted from robust bluish-gray granite, the exterior features grand triangular pediments and a green copper dome, exuding a breathtaking and solemn beauty. This building bears witness to Osaka\u0027s glorious history as the \u0027Manchester of the Orient\u0027\u2014the commercial and financial heart of modern Japan. Beautifully illuminated at night, it serves as one of the most prominent historic facades in the Kitahama and Nakanoshima financial district.", "name": "Bank of Japan Osaka Branch (Old Building)", "transport": "Directly accessible from Exit 7 of Yodoyabashi Station on the Osaka Metro Midosuji Line."}, {"address": "1-8-16 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located directly above Kitahama Subway Station, the Osaka Exchange (formerly the Osaka Stock Exchange) stands as a symbol of Osaka\u0027s status as a commercial and financial capital. Although the current structure has been rebuilt, it perfectly preserves the classic semi-circular white facade and pillared portico built in 1935 (Showa 10), seamlessly blending historic charm with a modern skyscraper. A bronze statue of Tomoatsu Godai, revered as the \u0027Father of Osaka\u0027s Modern Economy,\u0027 stands at the entrance in honor of his immense contributions to Osaka\u0027s modernization. The 1st floor houses an exhibition area showcasing the history of Osaka\u0027s stock market, making it an ideal visit for travelers interested in business history and modern architecture.", "name": "Osaka Exchange Building", "transport": "Direct access from Exit 1B of Kitahama Station on the Osaka Metro Sakaisuji Line, or direct access from Kitahama Station on the Keihan Main Line."}, {"address": "3-3-8 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Tekijuku was a private academy founded in 1838 (Tenpo 9) by Ogata Koan, a scholar of Rangaku (Western learning), and served as the cradle for many prominent figures of the Meiji Restoration (such as Yukichi Fukuzawa and Masajiro Omura). This traditional merchant townhome (machiya) is the only surviving Rangaku school building in Japan and is designated an Important Cultural Property. Step inside to see actual sword marks left on pillars by students competing for study space, alongside preserved study rooms, lecture halls, and medicine chests. Imbued with a rich sense of history and academic atmosphere, it is an essential historical landmark for understanding the dawn of modern Japan.", "name": "Tekijuku Historical Site", "transport": "About a 3-minute walk from Exit 11 of Yodoyabashi Station on the Osaka Metro Midosuji Line, or a 5-minute walk from Exit 2 of Kitahama Station on the Sakaisuji Line."}, {"address": "3-3-3 Fushimimachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Situated between Yodoyabashi and Kitahama, the Shibakawa Building was constructed in 1927 (Showa 2) by wealthy merchant Matashiro Shibakawa as a fireproof and earthquake-resistant reinforced concrete structure. Its facade blends decorative elements inspired by Maya and Inca civilizations, incorporating exquisite tiles and geometric patterns that make it stand out art-wise among Western classic architecture. Recognized as a Registered Tangible Cultural Property, it formerly served as a school for women\u0027s education and various commercial offices. Today, it houses charming lifestyle boutiques, retro cafes, and gourmet chocolate shops, making it a fantastic destination to experience the nostalgic atmosphere of Kitahama\u0027s early Taisho and Showa eras.", "name": "Shibakawa Building", "transport": "About a 1-minute walk from Exit 11 of Yodoyabashi Station on the Osaka Metro Midosuji Line."}, {"address": "1-1-26 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Built in 1912 (Meiji 45), the Kitahama Retro Building originally served as the office for a British stockbroker, radiating authentic English historical charm and designated a Registered Tangible Cultural Property. This classic two-story red-brick building features an adorable giant teapot sign hanging on its facade. The first floor houses a shop selling English tea and scones, while the second floor is home to the highly popular British afternoon tea salon, \u0027Kitahama Retro.\u0027 Sitting by the window on the second floor, you can relish authentic English scones and tea while taking in beautiful waterfront views of Nakanoshima Park and the Tosabori River, offering one of Kitahama\u0027s most beloved historic building experiences.", "name": "Kitahama Retro Building", "transport": "About a 1-minute walk from Exit 26 of Kitahama Station on the Osaka Metro Sakaisuji Line, or directly accessible from Exit 26 of Kitahama Station on the Keihan Main Line."}, {"address": "3 Kitahama, Chuo Ward / 1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Spanning across Midosuji, the main southern artery running between the Dojima and Tosabori rivers, Yodoyabashi Bridge was originally built by the wealthy Edo-period merchant family Yodoya. The current stone arch bridge structure was completed in 1935 (Showa 10) and, together with Oebashi Bridge on the north side of Nakanoshima, is designated an Important Cultural Property. Yodoyabashi\u0027s design combines elegant European-style lamp posts with sleek stone arch curves, offering high functional utility and immense urban aesthetic value. Serving as the gateway connecting Osaka\u0027s Umeda and Shinsaibashi financial-commercial axes, standing on the bridge offers sweeping views of Nakanoshima\u0027s stunning waterfront architecture and lush green parks\u2014a classic spot to feel the rhythm of Osaka\u0027s historic water capital harmonizing with modernity.", "name": "Yodoyabashi Bridge", "transport": "Direct access from Yodoyabashi Station on the Osaka Metro Midosuji Line, or direct access from Yodoyabashi Station on the Keihan Main Line."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "4-3-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 | Opened with great fanfare in 2022, Nakanoshima Museum of Art, Osaka boasts a visually striking, avant-garde black-box exterior. The museum primarily collects and exhibits modern and contemporary Japanese and Western art from the late 19th century onward, featuring masterpieces by masters like Yuzo Saeki and Jackson Pollock. Outside, the immensely popular giant cat sculpture \u0027SHIP\u2019S CAT (Crew/Red)\u0027 is a top photo spot. The spacious and bright interior regularly hosts high-caliber special exhibitions, making it a must-visit cultural landmark for contemporary art enthusiasts.", "name": "Nakanoshima Museum of Art, Osaka", "transport": "About a 5-minute walk from Exit 2 of Watanabebashi Station on the Keihan Nakanoshima Line, or a 10-minute walk from Exit 4 of Higobashi Station on the Subway Yotsubashi Line."}, {"address": "1-1-26 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 | An internationally renowned sanctuary of ceramic art, this museum houses top-tier ancient ceramics from China, Korea, and Japan, primarily based on the Ataka Collection. Highlights include National Treasures such as the \u0027Oil-Spot Tenmoku Tea Bowl\u0027 and the \u0027Celadon Vase with Phoenix-Ear Handles\u0027. Reopened in 2024 after a major renovation, it features advanced LED lighting and non-reflective glass display cases, allowing visitors to appreciate the subtle nuances and luster of the glazes up close. The on-site glass-curtain caf\u00e9 offers views of the lush greenery of Nakanoshima Park, perfectly blending culture and leisure.", "name": "Museum of Oriental Ceramics, Osaka", "transport": "Right outside Exit 1 of Naniwabashi Station on the Keihan Nakanoshima Line, or about a 5-minute walk from Exit 1 of Yodoyabashi Station on the Subway Midosuji Line."}, {"address": "4-2-55 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 | Designed by master architect C\u00e9sar Pelli, this is one of the few contemporary art museums in the world built entirely underground. Its above-ground entrance features an iconic titanium-coated steel framework inspired by the growth of bamboo, making it instantly recognizable. Spanning three underground levels, the museum primarily exhibits post-WWII modern and contemporary art masterpieces from Japan and abroad. It also frequently hosts world-class touring exhibitions that are both avant-garde and deeply inspiring.", "name": "The National Museum of Art, Osaka", "transport": "About a 5-minute walk from Exit 2 of Watanabebashi Station on the Keihan Nakanoshima Line, or a 10-minute walk from Exit 3 of Higobashi Station on the Subway Yotsubashi Line."}, {"address": "1-1-27 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 | Built in 1918 and designated an Important Cultural Property of Japan, this Neo-Baroque red-brick hall is Nakanoshima\u0027s most iconic classical landmark. Funded by entrepreneur Einosuke Iwamoto, it has hosted famous historical figures such as Albert Einstein and Helen Keller. The grand red-brick arch and splendid main hall showcase the height of Taisho Roman aesthetic romance. The basement houses a historical display room and the famous omurice restaurant \u0027Nakanoshima Social Eat AWAKE\u0027, and the building looks enchantingly romantic when illuminated at night.", "name": "Osaka City Central Public Hall", "transport": "About a 1-minute walk from Exit 1 of Naniwabashi Station on the Keihan Nakanoshima Line, or a 5-minute walk from Exit 1 of Yodoyabashi Station on the Subway Midosuji Line."}, {"address": "1-2-10 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 | Opened in 1904, this Neoclassical Renaissance-style building is an Important Cultural Property of Japan. Reminiscent of a Greek temple, its exterior boasts a grand Doric portico, while the central hall impresses with a wooden Gothic dome and an elegant central staircase. In addition to preserving rich historical archives of Osaka, it houses \u0027Sm\u00f8rrebr\u00f8d Kitchen\u0027, a highly popular Nordic-style open-sandwich caf\u00e9, seamlessly blending historical heritage with modern lifestyle culture.", "name": "Osaka Prefectural Nakanoshima Library", "transport": "About a 3-minute walk from Oebashi Station or Naniwabashi Station on the Keihan Nakanoshima Line, or a 3-minute walk from Exit 1 of Yodoyabashi Station on the Subway Midosuji Line."}, {"address": "1-1-28 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 | Designed by world-renowned architect Tadao Ando and donated to Osaka City, this architectural gem is dedicated to children\u0027s culture. Floor-to-ceiling wooden bookshelves line the entire interior, housing tens of thousands of curated picture books and children\u0027s literature to create the feeling of a magical forest made of books. Outside stands a giant \u0027Green Apple\u0027 sculpture symbolizing youthful dreams. It is not only a reading paradise for kids, but its unique spatial aesthetics also attract countless architecture and art lovers (advance online reservation required for entry).", "name": "Nakanoshima Children\u0027s Book Forest", "transport": "Right outside Exit 3 of Naniwabashi Station on the Keihan Nakanoshima Line, or about a 5-minute walk from Yodoyabashi Station on the Subway Midosuji Line."}, {"address": "3-3-9 Hiranomachi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 | Located in an upscale financial and cultural district near Kitahama, this exquisite private museum was founded by Teiichi Yuki, founder of the famous Japanese ryotei \u0027Kitcho\u0027. The museum specializes in masterpieces of fine art and crafts related to the Japanese tea ceremony, including several Important Cultural Properties such as rare tea bowls, tea caddies, hanging scrolls, and kaiseki tableware. Displays change thoughtfully with the seasons to express the essence of Japanese harmony and tea ceremony philosophy, making it a serene haven for experiencing traditional Japanese aesthetics deeply.", "name": "Yuki Museum of Art", "transport": "About a 5-minute walk from Exit 11 of Yodoyabashi Station on the Subway Midosuji Line, or a 7-minute walk from Exit 6 of Kitahama Station on the Subway Sakaisuji Line."}, {"address": "1-22-22 Edobori, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 | Situated near Nakanoshima in Edobori, Nishi Ward, this century-old church was designed by renowned architect W.M. Vories and built in 1928 as a Registered Tangible Cultural Property. This Gothic Revival red-brick church features elegant pointed arch windows, a beautiful rose window, and a solemn bell tower, exuding a warm and dignified historical character. The interior retains rich wooden craftsmanship, serving as a sacred site of spiritual and architectural beauty along Osaka\u0027s waterways.", "name": "Osaka Church, United Church of Christ in Japan", "transport": "About a 5-minute walk from Exit 8 of Higobashi Station on the Subway Yotsubashi Line, or an 8-minute walk from Watanabebashi Station on the Keihan Nakanoshima Line."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Opened in 1891, this was the very first urban park established in Osaka City. Located on the eastern side of Nakanoshima between the Dojima and Tosabori Rivers, it boasts vast green lawns, historic red-brick architectural landmarks, and a famous rose garden. Picturesque in all four seasons, it is a top choice for locals and tourists alike to stroll, picnic, and soak in the laid-back atmosphere of Osaka, the Aqua Metropolis.", "name": "Nakanoshima Park", "transport": "About a 1-minute walk from Kitahama Station on the Subway Sakaisuji Line or Keihan Main Line; about a 3-minute walk from Yodoyabashi Station on the Subway Midosuji Line or Keihan Main Line."}, {"address": "1-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Nestled inside Nakanoshima Park, this garden features around 3,700 rose bushes spanning 310 varieties. During peak bloom\u2014spring roses from mid-May to early June, and autumn roses from early October to mid-November\u2014the entire area bursts into a colorful, fragrant spectacle. With elegant arches and benches lining the paths against a backdrop of retro and modern architecture, it is a paradise for photography enthusiasts.", "name": "Nakanoshima Rose Garden", "transport": "Right outside Naniwabashi Station on the Keihan Nakanoshima Line; about a 3-minute walk from Kitahama Station on the Subway Sakaisuji Line."}, {"address": "1-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture (Easternmost end of Nakanoshima Park)", "feature": "\u2b50 4.3 stars | Situated at the easternmost tip of Nakanoshima, this park gets its name from its sword-tip shape (\u0027Kensaki\u0027). Located where the Kyu-Yodo River splits into the Dojima and Tosabori Rivers, it features a large arched fountain with impressive fountain shows on the hour. From the viewing platform extending at the tip, visitors can enjoy 360-degree views of the rivers and surrounding historic bridges, making it exceptionally romantic at sunset.", "name": "Nakanoshima Kensaki Park", "transport": "About a 5-minute walk from Kitahama Station on the Keihan Main Line or Subway Sakaisuji Line."}, {"address": "Along the river from 1-Chome to 5-Chome Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A well-paved, tree-lined waterfront promenade along the Dojima River on the north side of Nakanoshima. It seamlessly connects cultural landmarks like the Nakanoshima Museum of Art and the National Museum of Art, Osaka, with historic bridges such as Suisho Bridge and Oe Bridge. At night, warm ambient lights illuminate both banks, reflecting the stunning silhouettes of skyscrapers and historic sites onto the water for a delightfully romantic evening stroll.", "name": "Dojimagawa River Promenade", "transport": "Right outside Oebashi Station or Watanabebashi Station on the Keihan Nakanoshima Line."}, {"address": "Along the river from 1-Chome Kitahama, Chuo Ward to Nakanoshima area, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located on the south side of Nakanoshima along the Tosabori River, this waterfront path offers picturesque views of Kitahama\u0027s stylish riverside cafes and Western-style historic buildings across the water. Lined with seasonal flora, lush trees, accessible ramps, and comfortable seating, it is a serene spot to watch river cruises pass by while taking in Osaka\u0027s blend of historic depth and modern vitality.", "name": "Tosaborigawa River Promenade", "transport": "Right by the riverbank upon exiting Kitahama Station on the Subway Sakaisuji Line or Keihan Main Line."}, {"address": "3-3-23 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An urban oasis nestled between Nakanoshima Mitsui Building and Nakanoshima Daibiru. Featuring native Japanese flora and rich plant ecology, this park offers gently sloping green pathways designed to highlight the changing seasons. It provides a peaceful, nature-infused sanctuary for relaxation in the heart of a bustling skyscraper-filled financial district.", "name": "Nakanoshima Shiki no Oka (Hills of Four Seasons)", "transport": "About a 2-minute walk from Watanabebashi Station on the Keihan Nakanoshima Line; about a 4-minute walk from Higobashi Station on the Subway Yotsubashi Line."}, {"address": "Around 2-Chome to 3-Chome Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A linear green park stretching across central and western Nakanoshima, connecting educational, cultural, and commercial landmarks. Lined with tall camphor trees and seasonal foliage, it offers a shady canopy year-round. Contemporary sculptures are artfully placed along the walkway, seamlessly blending nature and public art to create a refreshing green corridor for local workers and visitors.", "name": "Nakanoshima Promenade Park", "transport": "About a 5-minute walk from Yodoyabashi Station on the Subway Midosuji Line; about a 3-minute walk from Nakanoshima Station on the Keihan Nakanoshima Line."}, {"address": "1-Chome Nakanoshima, Kita Ward, Osaka, Osaka Prefecture (Between Oebashi and Yodoyabashi)", "feature": "\u2b50 4.4 stars | Running through central Osaka, Midosuji Boulevard features a magnificent avenue of ginkgo trees around Nakanoshima\u0027s Osaka City Hall and Central Public Hall. From late November to early December, the ginkgo leaves turn brilliant golden, creating a shimmering yellow tunnel. In winter, the boulevard hosts the grand Osaka Festival of the Lights, combining nature and illuminations into a world-class urban spectacle.", "name": "Midosuji Boulevard Greenery - Nakanoshima Section", "transport": "Right from Exit 1 of Yodoyabashi Station on the Subway Midosuji Line or Keihan Main Line."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | An urban oasis nestled between the Dojima and Tosabori Rivers, featuring over 3,700 rose bushes across 310 varieties blooming every May and October. The vibrant ocean of flowers set against European-style historic architecture creates a gorgeous backdrop that content creators and photography enthusiasts shouldn\u0027t miss.", "name": "Nakanoshima Rose Garden", "transport": "Directly outside Naniwabashi Station on the Keihan Nakanoshima Line; approx. 3-min walk from Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1-1-27 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Built in 1918, this Neo-Baroque red-brick landmark boasts an extraordinarily grand classical dome and stained glass inside. Magnificent by day with its Neoclassical facade and magical when illuminated at night, it stands as Kitahama\u0027s most iconic historical photo spot.", "name": "Osaka City Central Public Hall", "transport": "Approx. 1-min walk from Naniwabashi Station on the Keihan Nakanoshima Line; approx. 5-min walk from Yodoyabashi Station on the Subway Midosuji Line"}, {"address": "1-2-10 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Designated as an Important Cultural Property built in 1904, this magnificent building features a classical Greek temple facade with massive Corinthian columns and a copper dome. The grand wooden central hall and vintage staircases make you feel like you\u0027ve stepped into a classic movie scene. Inside, \u0027Sm\u00f8rrebr\u00f8d Kitchen\u0027 is also a wildly popular trendy dining spot.", "name": "Osaka Prefectural Nakanoshima Library", "transport": "Approx. 3-min walk from Exit 1 of Yodoyabashi Station on the Subway Midosuji Line"}, {"address": "1-1-26 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Housed in a registered Tangible Cultural Property with British-style architecture, this is renowned as Kitahama\u0027s most romantic spot for English afternoon tea. Steeped in vintage British charm, it features an iconic giant teapot sign and prime riverside window seats. Enjoying a classic three-tier high tea with views of the river yields picture-postcard photos every time.", "name": "Kitahama Retro", "transport": "Approx. 1-min walk from Exit 26 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "4-3-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Opened in 2022, this modern art landmark boasts an imposing minimalist \u0027Black Box\u0027 exterior. The giant spacesuit-clad black cat sculpture \u0027SHIP\u0027S CAT (Crew/Black)\u0027 at the entrance is an absolute Instagram superstar, while the airy geometric architecture and interplay of light and shadow inside provide equally striking visuals.", "name": "Nakanoshima Museum of Art, Osaka", "transport": "Approx. 5-min walk from Exit 2 of Watanabebashi Station on the Keihan Nakanoshima Line"}, {"address": "1-2-2 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An iconic white, minimalist roastery cafe along the Kitahama riverfront. Its most popular feature is the first-floor outdoor wooden deck seating over the river, offering uninterrupted views of the water and Osaka City Central Public Hall across the bank. Sipping exquisite pour-over coffee while taking in the graceful riverside scenery makes for a beautifully memorable photo backdrop.", "name": "MOTO COFFEE Kitahama", "transport": "Approx. 1-min walk from Exit 26 of Kitahama Station on the Subway Sakaisuji Line"}, {"address": "Border of 1-chome Kitahama, Chuo Ward and 1-chome Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A classic bridge spanning the Dojima and Tosabori Rivers, affectionately known as \u0027Lion Bridge\u0027 thanks to four imposing stone lion sculptures guarding both ends. With retro round lanterns and intricate handrails, it offers fantastic vantage points capturing Nakanoshima\u0027s waterfront architecture and flowing rivers.", "name": "Naniwa Bridge", "transport": "Directly outside Naniwabashi Station on the Keihan Nakanoshima Line; approx. 2-min walk from Kitahama Station on the Subway Sakaisuji Line"}, {"address": "1F Hauser Kitahama Bldg., 1-1-9 Kitahama, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A famous New York-born coffee spot with a bohemian industrial vibe, boasting a prime riverfront location. Featuring high-ceilinged American industrial interiors and a spacious outdoor terrace over the water, you can sit by the river, take in the greenery of Nakanoshima Park and passing water buses, and snap stylish photos with your coffee for effortless NYC chic.", "name": "Brooklyn Roasting Company Kitahama", "transport": "Approx. 1-min walk from Exit 22 of Kitahama Station on the Subway Sakaisuji Line"}], "name": "Popular Photo Spots"}}, "name": "Nakanoshima / Kitahama"}, "namba-shinsaibashi": {"categories": {"cat_1": {"items": [{"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in the narrow alleys of the bustling Namba shopping district, Hozenji is a centuries-old Jodo Sect Buddhist temple. Its most famous feature is the \u0027Mizukake Fudo\u0027 (Water-Splashing Fudo Myoo). Because countless worshipers have poured water over the statue while praying for blessings, it has become completely covered in a thick layer of lush green moss, creating a rare and sacred sight. Walking through the quaint Hozenji Yokocho alley, with its stone-paved paths lit by traditional lanterns, offers a charming glimpse into the atmosphere of old Kansai.", "name": "Hozenji Temple", "transport": "Approx. 3-minute walk from Exit 14 of Namba Station on the Osaka Metro"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | An iconic historic shrine in the Namba area, Namba Yasaka Shrine\u0027s most eye-catching feature is its massive \u0027Shishiden\u0027 (Lion Head Stage), standing 12 meters tall and 11 meters wide. The giant lion head features lights for eyes and speakers for nostrils. Its wide-open mouth is said to swallow evil spirits and bring good fortune, making it exceptionally popular among those praying for academic progress, career success, and business prosperity. It is a must-visit landmark offering both historical depth and visual awe.", "name": "Namba Yasaka Shrine", "transport": "Approx. 6-minute walk from Namba Station on the Osaka Metro"}, {"address": "1-9-19 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Opened in 1923 (Taisho 12), Osaka Shochikuza Theatre was the Kansai region\u0027s first grand theater built in a purely Western style. The exterior features elegant Neo-Renaissance arch designs, reflecting the rich Western influences of the Taisho Roman era. Today, it remains a sanctuary for traditional Kabuki performances while also hosting musicals and various theatrical productions. Even if you don\u0027t step inside for a show, simply admiring its dignified main archway and nighttime illuminations from Dotonbori Street lets you feel the long history of Osaka\u0027s modern theatrical culture.", "name": "Osaka Shochikuza Theatre", "transport": "Approx. 1-minute walk from Exit 14 of Namba Station on the Osaka Metro"}, {"address": "1-7-1 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Originally designed in 1933 by famed American architect William Merrell Vories, the main building of Daimaru Shinsaibashi is an architectural masterpiece blending Art Deco and Neo-Gothic styles. Although it underwent major renovations, iconic historical elements\u2014such as the exterior relief carvings, geometric ceiling patterns, and intricate peacock reliefs\u2014were perfectly preserved and restored, allowing shoppers to admire nearly a century of refined, luxurious architectural art while browsing.", "name": "Daimaru Shinsaibashi Main Building", "transport": "Directly connected to the underground shopping avenue from Shinsaibashi Station on the Osaka Metro"}, {"address": "2-2-12 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Commonly known as \u0027Mitsu Hachimangu\u0027, Mitsudera Temple was founded in 744 AD (Tenpyo 16) and is an ancient Shingon Sect Buddhist temple with over a millennium of history. What makes this temple unique is how seamlessly it is integrated into the vibrant Shinsaibashi commercial district\u2014its main hall is built directly into a modern commercial building, creating a fascinating architectural blend. Dedicated to the Eleven-Headed Kannon Bodhisattva, the interior is opulently decorated and houses precious Buddhist sculptures, serving as a rare spiritual sanctuary amidst the lively shopping district.", "name": "Mitsudera Temple", "transport": "Approx. 5-minute walk from Exit 7 of Shinsaibashi Station on the Osaka Metro"}, {"address": "5-1-5 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Completed in 1932 (Showa 7) and designed by renowned architect Setsu Kuno, the current Nankai Namba Station Building (which also houses Takashimaya Osaka) is one of the most iconic modern Neo-Classical buildings in southern Osaka. Its grand arched windows and exquisite classical stone carvings reflect the prosperous spirit of the early Showa period. Standing strong for nearly a century, this station building remains a crucial transit hub connecting Osaka with Kansai International Airport and Mount Koya.", "name": "Nankai Namba Station Building", "transport": "Directly connected to Nankai Namba Station / Approx. 1-minute walk from Namba Station on the Osaka Metro"}, {"address": "1-6-4 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Housed in a charming wooden building across from Hozenji Temple, the Kamigata Ukiyoe Museum is the world\u0027s only private museum dedicated to a permanent exhibition of Kamigata Ukiyo-e woodblock prints. \u0027Kamigata\u0027 refers to the Kyoto-Osaka region during the Edo period; the prints displayed here primarily focus on popular Kabuki actors of the Dotonbori theaters of that era, rich in color and expressive detail. The building itself recreates the atmosphere of an Edo-period Machiya townhouse, transporting visitors back to the golden era of Dotonbori\u0027s thriving performing arts culture.", "name": "Kamigata Ukiyoe Museum", "transport": "Approx. 3-minute walk from Exit 14 of Namba Station on the Osaka Metro"}, {"address": "1-chome Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Excavated in 1612 by merchant Yasui Doton, the Dotonbori Canal boasts over 400 years of history and served as a foundational engineering feat that established Osaka as a \u0027City of Water\u0027 and \u0027The Nation\u0027s Kitchen\u0027. Ebisubashi Bridge was originally built during the Edo period as an approach bridge for pilgrims traveling to Imamiya Ebisu Shrine. Rebuilt several times throughout history, it is now a bustling pedestrian landmark. Standing on the bridge offers an iconic view of the famous Glico Running Man sign while immersing visitors in four centuries of historical transformation from a traditional theater street into a world-famous commercial district.", "name": "Ebisubashi Bridge \u0026 Dotonbori Canal Historic Area", "transport": "Approx. 3-minute walk from Exit 14 of Namba Station on the Osaka Metro"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-6-4 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located in front of Hozenji Temple near Dotonbori, this is the world\u0027s only private art museum dedicated to permanently exhibiting Kamigata Ukiyoe (Ukiyo-e woodblock prints from the Kansai region). Unlike Edo (Tokyo) prints that focused on beauties and landscapes, Kamigata Ukiyoe mainly featured Dotonbori Kabuki actors rendered with highly dramatic brushwork. The museum houses rare original woodblock prints from the late Edo period and offers printmaking workshops where visitors can create their own Ukiyo-e artwork.", "name": "Kamigata Ukiyoe Museum", "transport": "About a 3-minute walk from Exit 14 of Namba Station on the Midosuji Subway Line"}, {"address": "3F, 2-2-22 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Nestled inside the bustling Shinsaibashi-suji Shopping Street, this museum displays masterpieces by four renowned Ukiyo-e masters: Hokusai Katsushika, Kuniyoshi Utagawa, Hiroshige Utagawa, and Utamaro Kitagawa. It houses a large collection of well-preserved original woodblock prints of high artistic value, complete with detailed commentary showcasing Edo-period Japanese life and exquisite craftsmanship. With a lovely gift shop on-site, it is perfect for art lovers seeking an in-depth visit.", "name": "Osaka Ukiyoe Museum", "transport": "About a 5-minute walk from Exit 6 of Shinsaibashi Station on the Midosuji Subway Line"}, {"address": "1-12-10 Nippombashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A premier national venue dedicated to traditional Japanese performing arts, preserving and promoting Ningyo Joruri (Bunraku), an UNESCO Intangible Cultural Heritage. In addition to regular live performances of masterful three-person puppetry, the theatre features a rich exhibition room displaying elaborate Bunraku puppets, shamisen instruments, stage costumes, and historical documents, offering visitors a fascinating look into the history and allure of classical Japanese puppet theater.", "name": "National Bunraku Theatre", "transport": "About a 1-minute walk from Exit 7 of Nippombashi Station on the Sakaisuji or Sennichimae Subway Line"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | One of the most iconic religious and cultural landmarks in Osaka\u0027s Namba area, famous for its massive lion-head stage (Shishiden) standing 12 meters high and 11 meters wide. The gaping mouth of the lion is said to swallow evil spirits and bring good fortune, making it a popular spot to pray for academic success, business prosperity, and victory. During New Year\u0027s and the July Summer Festival, the lion stage becomes the center of lively rituals and performances, drawing crowds of local and international visitors.", "name": "Namba Yasaka Shrine", "transport": "About a 6-minute walk from Namba Station on the Midosuji or Yotsubashi Subway Line"}, {"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1637, this serene Jodo-shu Buddhist temple offers a quiet haven right next to the vibrant energy of Dotonbori. It is famous for its \u0027Mizukake Fudo\u0027 statue, over which worshippers splash water while offering prayers. Decades of this ritual have covered the statue in a thick, lush layer of vibrant green moss, creating a striking sight. The surrounding cobblestone alleyway, Hozenji Yokocho, retains a charming old-world Osaka atmosphere rich in artistic nostalgia.", "name": "Hozenji Temple", "transport": "About a 5-minute walk from Namba Station on the Midosuji Subway Line"}, {"address": "2-7-12 Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Affectionately known as \u0027Mitsu no Kusunoki-san\u0027, this historic Shingon sect temple located in the heart of Shinsaibashi-suji Shopping Street dates back over 1,300 years\u2014a rare ancient shrine in downtown Osaka. The main hall houses an Eleven-Headed Kannon statue, and its architecture creatively blends traditional temple aesthetics with modern design. Surrounded by stylish fashion boutiques and shopping malls, the temple maintains a peaceful, sacred atmosphere, offering a tranquil sanctuary amidst the bustling shopping district.", "name": "Mitsudera Temple", "transport": "About a 4-minute walk from Exit 7 of Shinsaibashi Station on the Midosuji Subway Line"}, {"address": "4-1-3 Bakurocho, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An ancient shrine situated between Shinsaibashi and Honmachi, tracing its heritage back to the reign of Emperor Nintoku, to whom it is dedicated. The shrine grounds are home to a majestic ginkgo tree over 400 years old, designated as a Natural Monument of Osaka City, which turns into a breathtaking golden canopy in autumn. Rebuilt after WWII, the complex seamlessly combines traditional shrine architecture with modern concrete structures, hosting artisan markets and traditional festivals that reflect Kansai\u0027s warm local culture.", "name": "Namba Shrine", "transport": "About a 5-minute walk from Exit 3 of Shinsaibashi Station on the Midosuji Subway Line"}, {"address": "1-12-11 Higashishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 1882 (Meiji 15), this historic century-old Christian church is situated in the Unagidani area east of Shinsaibashi. Featuring an elegant and solemn Gothic-inspired design, the building stands as a testament to Osaka\u0027s modern history and cultural exchange. The interior retains beautiful artistic stained-glass windows and a classic wooden pulpit, hosting warm gospel concerts and religious services that bring a touch of grace and artistic serenity to the lively city center.", "name": "Osaka Minami Church (United Church of Christ in Japan)", "transport": "About a 2-minute walk from Exit 5 of Nagahoribashi Station on the Nagahori Tsurumi-ryokuchi Subway Line"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "2-10-70 Nambanaka, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Nestled in the heart of the Namba shopping district, Namba Parks is a massive terraced rooftop garden that seamlessly blends modern commerce with natural ecology. Extending from the 2nd to the 9th floor, the lush green terraces feature hundreds of plant and flower species, complete with winding paths, cozy benches, and cascading waterfalls. Strolling through feels like entering an urban oasis valley where you can appreciate seasonal blooms up close while overlooking the bustling streets of Namba. It is an ideal spot to unwind and recharge after a day of shopping.", "name": "Namba Parks Garden", "transport": "Directly connected to Nankai Electric Railway \"Namba Station\", or approx. 5 mins walk from Osaka Metro Midosuji Line \"Namba Station\""}, {"address": "Riverwalk area around 1-Chome Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Running along both banks of the Dotonbori River between Shinsaibashi and Dotonbori, this wooden boardwalk is a popular waterfront promenade that captures Osaka\u0027s charm as a water metropolis. Equipped with comfortable seating and scenic illumination, the boardwalk becomes romantically vibrant at night as colorful neon lights reflect on the river\u0027s surface. Visitors can take a relaxing stroll, enjoy the river breeze, watch sightseeing boats pass by, or snap memorable photos, immersing themselves in Namba\u0027s unique, laid-back waterfront lifestyle.", "name": "Dotonbori Riverwalk", "transport": "Approx. 3 to 5 mins walk from Osaka Metro Midosuji Line \"Namba Station\" or \"Shinsaibashi Station\""}, {"address": "1-13 Minamihorie, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Centrally located in the trendsetting Horie district just west of Shinsaibashi, Horie Park is a neighborhood oasis beloved by local residents and hipsters alike. Shaded by green trees, the park offers a spacious lawn area, children\u0027s playground equipment, and resting benches. Surrounded by unique cafes, independent boutiques, and vintage clothing stores, it\u0027s a favorite spot for visitors to grab takeaway coffee and desserts, relax in the sunshine, and enjoy a rare slice of leisurely urban greenery around Namba.", "name": "Horie Park", "transport": "Approx. 3 mins walk from Osaka Metro Yotsubashi Line \"Yotsubashi Station\", or approx. 8 mins walk from Midosuji Line \"Shinsaibashi Station\""}, {"address": "2-11 Nishishinsaibashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.8 stars | Officially named Mitsu Park, Triangular Park (Sankaku Park) sits right in the center of Amerikamura and serves as the most iconic street-culture gathering spot and plaza in the Shinsaibashi area. This small, triangular urban park features terraced seating surrounded by lush street trees. It serves as a vibrant hub for Osaka\u0027s youth, street performers, and fashion enthusiasts. With famous takoyaki stalls and trendy clothing shops nearby, sitting here with street food while people-watching offers a deep taste of Shinsaibashi\u0027s energetic yet breezy vibe.", "name": "Sankaku Park / Mitsu Park", "transport": "Approx. 5 mins walk from Exit 7 of Osaka Metro Midosuji Line \"Shinsaibashi Station\""}, {"address": "1-9 Utsubohonmachi, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located just north of Shinsaibashi, Utsubo Park is a sprawling urban forest park stretching east to west through central Osaka. The park is split into East and West sections; the East Park is famous for its renowned rose garden and zelkova-lined avenue, blooming with thousands of colorful roses in spring and autumn alongside water features and pavilions. The West Park houses world-class tennis courts and dense woodlands. Surrounded by artisan bakeries and cafes, the park attracts many visitors for picnics and walks as the leaves change color or roses bloom.", "name": "Utsubo Park", "transport": "Approx. 3 mins walk from Exit 28 of Osaka Metro Yotsubashi Line \"Hommachi Station\", or approx. 15 mins walk from Shinsaibashi"}, {"address": "1-9 Kouzu, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Adjacent to the Namba and Nipponbashi commercial districts, Kozu Park sits right next to the historic Kozu-gu Shrine, offering a tranquil space that blends history, culture, and natural scenery. Dense trees, walking paths, and a children\u0027s play area fill the park, which is also a renowned cherry blossom viewing spot in Osaka. Every spring, hundreds of sakura trees burst into bloom, creating a pink sea of flowers that draws crowds for flower-viewing picnics. Its peaceful environment offers a refreshing retreat from the lively, bustling streets of Namba.", "name": "Kozu Park", "transport": "Approx. 5 mins walk from Osaka Metro Tanimachi/Sennichimae Line \"Tanimachi 9-chome Station\", or approx. 12 mins walk from Namba Station"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located near Namba Station, Namba Yasaka Shrine is world-famous for its striking 12-meter-tall giant lion head building. The lush greenery and gardens within the shrine grounds lend a peaceful, natural beauty to the surrounding urban noise. Planted with ginkgo, cherry blossoms, and various flora, the grounds transform with the seasons\u2014especially in autumn when the ginkgo leaves turn brilliant gold, creating a breathtaking contrast against the powerful lion head. Beyond being a sacred place to pray for academic and business success, it\u0027s a wonderful spot to experience Japanese spirituality and natural beauty.", "name": "Namba Yasaka Shrine Grounds", "transport": "Approx. 6 mins walk from Nankai Electric Railway or Osaka Metro Midosuji Line \"Namba Station\""}, {"address": "2-16 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.7 stars | Situated east of Namba and Kuromon Market, Nipponbashi Park is a small community park offering a quick resting spot for locals and tourists. Shaded by several large trees, it comes equipped with basic benches and simple amenities. After exploring Osaka\u0027s bustling anime street (Den Den Town) or Kuromon Market, many visitors stop by to catch their breath and enjoy street food under the shade. Though compact, it provides a valuable touch of greenery and fresh air amidst a dense cluster of commercial buildings.", "name": "Nipponbashi Park", "transport": "Approx. 5 mins walk from Exit 10 of Osaka Metro Sennichimae/Sakaisuji Line \"Nipponbashi Station\""}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-10-2 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Without a doubt, the most iconic landmark in Osaka! Located right beside Ebisubashi Bridge, this giant LED signboard depicts an athlete crossing the finish line. Dazzling brightly at night, countless tourists from around the world gather on Ebisubashi Bridge every day, spreading their arms to mimic the classic Glico Running Man pose. Capturing photos from the canal promenade below also offers fantastic angles, making it an absolute must-visit signature photo spot when visiting Osaka.", "name": "Dotonbori Glico Sign", "transport": "About a 3-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | A striking hidden gem tucked away in the back alleys of Namba, famous for its massive 12-meter-tall and 11-meter-wide \u0027Shishiden\u0027 (Lion Hall). The grand lion head with its wide-open mouth looks imposing, and local legend says it swallows evil spirits while bringing good fortune for business and studies. Its visually stunning appearance draws crowds of international tourists for photo ops, making it a wildly popular trending spot across social media platforms.", "name": "Namba Yasaka Shrine - Shishiden (Lion Head Building)", "transport": "About a 6-minute walk from Namba Station on the Osaka Metro Midosuji Line / Yotsubashi Line"}, {"address": "1-6-18 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | A core landmark along the Dotonbori foodie street, featuring a huge 6.5-meter-long red snow crab model mounted prominently above the storefront entrance. The crab\u0027s eyes and legs actually move, offering a realistic dynamic display that has become a symbol of Dotonbori\u0027s iconic 3D sign culture. Many visitors love taking playful or foodie photos with this moving giant crab as their backdrop, perfectly capturing Osaka\u0027s energetic and lighthearted street character.", "name": "Kani Doraku Main Store - Giant Crab Sign", "transport": "About a 2-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "7-13 Soemoncho, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Built onto the outer wall of the Don Quijote flagship store along the Dotonbori canal, this features \u0027Ebisu Tower\u0027, the world\u0027s first oval-shaped Ferris wheel. The center of the wheel prominently showcases Ebisu, the god of business prosperity, along with Don Quijote\u0027s penguin mascot, creating an eye-catching visual statement. Riding the wheel takes you up into the sky for a panoramic view of the bustling Dotonbori area, standing out as a premier canal-side landmark day and night.", "name": "Ebisu Tower Ferris Wheel at Don Quijote Dotonbori", "transport": "About a 5-minute walk from Shinsaibashi Station or Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1F Nakaza CUI-DAORE Bldg., 1-7-21 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Kuidaore Taro is Osaka Dotonbori\u0027s most legendary mascot, dressed in a red-and-white striped clown costume, wearing glasses, and playing a snare drum. Loved by locals and tourists alike since making his debut in 1950, he now stands in t
