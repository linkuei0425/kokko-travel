ARUKAS 300\u0027 sign for a magical, cloud-walking atmosphere.", "name": "ABENO HARUKAS 300 Observatory", "transport": "Directly connected to JR / Osaka Metro Tennoji Station and Kintetsu Osaka-Abenobashi Station."}, {"address": "Near 2-chome Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Stepping into the bustling shopping street of Shinsekai feels like traveling back in time to the vibrant, wild Osaka of the Showa era! The biggest eye-catchers are the exaggerated, visually striking 3D giant signboards outside kushikatsu (skewered fried food) shops and storefronts, including massive blowfish balloons, dramatic chef figures, and gleaming golden statues. When night falls, colorful neon lights illuminate the area. Snapping photos with Tsutenkaku Tower in the background captures a unique blend of retro nostalgia and local Osaka energy\u2014a must-visit for Instagrammers and photography enthusiasts worldwide.", "name": "Shinsekai Giant Signboard Street", "transport": "About a 3-minute walk from Exit 5 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line."}, {"address": "5-55 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Tenshiba is a vast green lawn plaza located at the entrance of Tennoji Park, featuring cozy outdoor cafes, scenic restaurants, and stylish lifestyle shops. The classic photo opportunity here is standing on the open green lawn with the soaring ABENO HARUKAS skyscraper looming grandly in the background\u2014a striking contrast between lush park greenery and sleek modern architecture. Whether relaxing with a sunny picnic or enjoying the evening skyline lighting, it radiates chic urban elegance and laid-back charm.", "name": "Tennoji Park Tenshiba Area", "transport": "Immediately accessible from Exit 21 of JR / Osaka Metro Tennoji Station."}, {"address": "1-11-18 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 593 AD by Prince Shotoku, Shitennoji is one of Japan\u0027s oldest officially administered temples. Its symmetrically aligned Asuka-period architecture and grand five-story pagoda draw countless culture and history lovers. Visitors can climb the pagoda to admire the serene surroundings, or capture timeless photos where the historic temple structures harmonize with seasonal blooms (like cherry blossoms and autumn foliage) in the Gokuraku-jodo Garden and near the Main Hall, yielding deeply Zen and evocative imagery.", "name": "Shitennoji Temple \u0026 Five-Story Pagoda", "transport": "About a 5-minute walk from Exit 4 of Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line."}, {"address": "1-108 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture (inside Tennoji Park)", "feature": "\u2b50 4.4 stars | Tucked away inside Tennoji Park, Keitakuen Garden is a traditional Japanese chisen-kaiyushiki (pond-strolling) garden originally crafted for the Sumitomo family residence. Centered around a large main pond, the garden is filled with unique rock formations, wooden bridges, teahouses, and lush seasonal foliage. Standing on the wooden bridge or shooting from the teahouse offers breathtaking reflections on the water and a serene, classical Japanese landscape aesthetic\u2014a tranquil hidden gem that contrasts beautifully with the surrounding city bustle.", "name": "Keitakuen Garden", "transport": "About a 6-minute walk from JR / Osaka Metro Tennoji Station."}, {"address": "Near 3-chome Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Janjan Yokocho (Nanyodori Shopping Street) is a narrow retro alley connecting Shinsekai and Dobutsuen-mae Station. Its name comes from the \u0027jan-jan\u0027 strumming sound of shamisen instruments played by merchants in the past to attract customers. Packed with vibrant Showa-era working-class nostalgia, the alley is lined with traditional kushikatsu eateries, standing bars, Japanese shogi parlors, and nostalgic carnival shooting stalls. The dense signboards and authentic local atmosphere make it an outstanding spot for evocative street photography.", "name": "Janjan Yokocho Alley", "transport": "Immediately accessible from Exit 1 of Dobutsuen-mae Station on the Osaka Metro Midosuji Line or Sakaisuji Line."}, {"address": "1-18-6 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture (inside Tsutenkaku Tower)", "feature": "\u2b50 4.5 stars | Located within Tsutenkaku Tower, the \u0027TOWER SLIDER\u0027 is one of Shinsekai\u0027s hottest thrill attractions. This 60-meter-long transparent spiral tube slide drops 26.5 meters from the 3rd-floor observatory down to the B1 level in just about 10 seconds. Sliders can look up through the translucent ceiling to see the tower\u0027s architectural structure spinning past\u2014a thrilling visual rush. Both the entrance and the finish-line photo area are viral photo hotspots among young travelers.", "name": "Tsutenkaku TOWER SLIDER", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line."}], "name": "Top Instagrammable Spots"}}, "name": "Tennoji and Shinsekai"}, "umeda": {"categories": {"cat_1": {"items": [{"address": "1-1-88 Oyodonaka, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Designed by renowned architect Hiroshi Hara and completed in 1993, this is Osaka Umeda\u0027s most iconic ultra-modern landmark. Rising 173 meters tall, this twin-tower skyscraper\u0027s highlight is the open-air corridor connecting the two towers at the top, forming the unique Floating Garden Observatory. Built using a specialized \u0027Lift-Up\u0027 construction technique, the circular observatory was fully assembled on the ground before being hoisted to the top. As visitors ride the transparent cylindrical glass escalator ascending into the sky, they experience a surreal, futuristic visual rush. The top-floor 360-degree open-air deck offers panoramic views of downtown Osaka and the Yodo River; its sunsets and nightscapes are recognized as official Japan Night-View Heritage sites, making it a masterclass in architectural aesthetics and breathtaking views.", "name": "Umeda Sky Building", "transport": "Approx. 9-minute walk from JR Osaka Station or Osaka Metro Midosuji Line Umeda Station"}, {"address": "3-1-1 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Osaka Station City is one of Japan\u0027s largest and most beautifully designed multi-functional station complexes, comprising the South Gate Building and North Gate Building spanned by a majestic, sloping glass roof. Its standout architectural highlight is Toki no Hiroba (Time and Space Plaza), located directly above the train tracks. The open-air arched steel frame and luminous glass weave a spacious modern urban setting, allowing visitors to look down upon dynamic panoramic views of trains coming and going. Furthermore, the upper levels host eight themed sky gardens\u2014such as Wind Garden and Sun Garden\u2014seamlessly fusing sustainable green architectural philosophy with a cutting-edge transit hub.", "name": "Osaka Station City", "transport": "Directly connected to JR Osaka Station"}, {"address": "2-5-4 Sonezaki, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Boasting over 1,300 years of history, Tsuyu no Tenjinja is the most iconic ancient historical landmark tucked inside Umeda\u0027s bustling commercial hub. The shrine\u0027s formal name stems from an 888 AD legend of Sugawara no Michizane shedding tears here while in exile, but it achieved legendary status in later times as the tragic setting of Chikamatsu Monzaemon\u0027s famous puppet play \u0027The Love Suicides at Sonezaki\u0027. The drama tells the heartbreaking love story of Ohatsu and Tokubei, turning the shrine into a nationwide sanctuary for matchmaking and romantic harmony affectionately nicknamed \u0027Ohatsu Tenjin\u0027. Rebuilt after WWII air raids, the shrine grounds still exude rich Edo-period charm, striking a dramatic contrast against the surrounding skyscrapers.", "name": "Tsuyu no Tenjinja Shrine / Ohatsu Tenjin", "transport": "Approx. 3-minute walk from Osaka Metro Tanimachi Line Higashi-Umeda Station, or an 8-minute walk from JR Osaka Station"}, {"address": "1-6-20 Dojima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located in the Dojima district south of Umeda, Dojima AVANZA is a unique landmark that seamlessly blends ancient religious heritage with modern glass-curtain wall architecture. The site\u0027s history dates back to the era of Prince Shotoku, when Dojima Yakushido was reportedly built to pray for healing. Amid modern urban redevelopment in 1999, architects redesigned the shrine into a stunning glass-encased structure resembling a giant crystal sphere, beautifully preserving the ancient Yakushi Nyorai Buddha statue and stone steles inside. During the annual Setsubun Festival, traditional \u0027Demon Dances\u0027 and blessing ceremonies take place here, where the central reflection pool reflects the glass hall\u2014a breathtaking harmony between contemporary architectural design and enduring spiritual traditions.", "name": "Dojima Yakushido \u0026 Dojima AVANZA", "transport": "Approx. 3-minute walk from JR Tozai Line Kitashinchi Station, or a 5-minute walk from Osaka Metro Yotsubashi Line Nishi-Umeda Station"}, {"address": "8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Since opening in 1929 as the world\u0027s first railway terminal department store, Hankyu Umeda Main Store has been a cornerstone of modern commercial architecture in Umeda. While the current building underwent extensive renovation, it meticulously preserved and recreated early-Showa Neo-Gothic and Art Deco aesthetics. Architectural enthusiasts will be captivated by the 1st-floor central concourse vaulting, which faithfully recreates the original designs of architect Chuta Ito\u2014complete with exquisite stained glass, Gothic vaulted arches, and carved mythical beast relief sculptures. The breathtaking 7-story indoor atrium, \u0027Festival Plaza,\u0027 showcases grand amphitheater-style spatial design, serving as a masterclass in elevating retail commercial space into architectural art.", "name": "Hankyu Department Store Umeda Main Store (Art Deco Ceiling Vault)", "transport": "Approx. 1-minute walk from Hankyu Osaka-Umeda Station, or directly connected to Osaka Metro Midosuji Line Umeda Station"}, {"address": "1-1, 1-2, 1-3, 1-11 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Constructed between the late 1960s and 1981, Osaka Ekimae Buildings No. 1 through No. 4 are iconic modern urban redevelopment complexes representing Japan\u0027s post-war Showa economic boom. These four interconnected modernist towers feature miles of sprawling underground labyrinths that perfectly preserve the retro atmosphere of Showa-era commercial streets. The exteriors highlight clean geometric lines, while the interiors feature vintage mosaic tiles, classic brass handrails, and nostalgic light fixtures. Packed with hundreds of traditional izakayas, retro kissaten cafes, and antique shops, this complex is hailed as a \u0027living architectural fossil of the Showa era\u0027\u2014an ideal spot to dive into Osaka\u0027s modern urban history and authentic everyday working-class culture.", "name": "Osaka Ekimae Buildings (No. 1 to No. 4)", "transport": "Approx. 2 to 5-minute walk from Osaka Metro Tanimachi Line Higashi-Umeda Station or Hanshin Osaka-Umeda Station"}, {"address": "4-1 Ofukacho (South Building), 3-1 Ofukacho (North Building), Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Opened in 2013, Grand Front Osaka serves as the flagship centerpiece of the Umekita redevelopment project. Designed by Nikken Sekkei alongside top international firms, it represents the pinnacle of 21st-century contemporary minimalism and eco-friendly architecture. Comprising North and South buildings alongside sleek skyscrapers, the complex features streamlined glass curtain walls and dark metal louvers echoing Osaka\u0027s theme of \u0027Water and Greenery\u0027. The center of the layout boasts a 500-meter green promenade and terraced water plaza, while inside houses \u0027Knowledge Capital\u0027, Japan\u0027s largest intellectual exchange hub. Its open spatial flow and daylighting design completely reshaped the urban skyline north of Osaka Station.", "name": "Grand Front Osaka", "transport": "Approx. 1-minute walk from JR Osaka Station North Gate via direct elevated walkway"}, {"address": "12-5 Chayamachi, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Tucked into a corner of Umeda\u0027s trendy Chayamachi shopping district, Tsunashiki Tenjinja Shrine Otabisha is a prime example of a thousand-year-old shrine harmoniously integrated into a sleek modern urban environment. Dedicated to Sugawara no Michizane, its heritage dates back to the Emperor Saga era. As Chayamachi evolved into a hip fashion and commercial district, the shrine retained its traditional structures\u2014vermilion torii gate, wooden main hall, and purification fountain\u2014while framed by high-rise residential towers and glass facades. Famous within its compact grounds are the vivid Beni-Inari fox shrine and charms for romantic relationships. Its miniature footprint creates a captivating contrast with surrounding avant-garde architecture, showcasing Osaka\u0027s deep respect for historical preservation amidst urban growth.", "name": "Tsunashiki Tenjinja Shrine Otabisha", "transport": "Approx. 3-minute walk from Hankyu Osaka-Umeda Station Chayamachi Exit"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "27F, West Tower, Umeda Sky Building, 1-1-30 Oyodonaka, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Located on the 27th floor of the Umeda Sky Building West Tower, this municipal art museum is dedicated to the works of contemporary Japanese art master Koji Kinutani. Its standout feature is an immersive theater utilizing state-of-the-art 3D audio-visual technology. Put on dedicated 3D glasses and dive right into the vibrant colors and awe-inspiring universe of his paintings. The museum also showcases numerous vivid, dynamic frescoes and sculptures, alongside a Sky Cafe offering sweeping views of Osaka Bay and the city skyline\u2014a popular cultural landmark combining visual impact with romantic scenery.", "name": "Koji Kinutani Tenku Art Museum", "transport": "Approx. 9-minute walk from JR Osaka Station, or 11-minute walk from Hankyu Osaka-Umeda Station"}, {"address": "4-3-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Grandly opened in 2022, this state-of-the-art modern art museum features an iconic futuristic exterior designed as a massive black cube. Its collection boasts over 6,000 modern and contemporary artworks from Japan and abroad, including masterpieces by Yuzo Saeki, Claude Monet, Salvador Dal\u00ed, and Takashi Murakami, as well as design furniture and graphic design posters highlighting Osaka\u0027s unique cultural heritage. Outside on the lawn stands Kenji Yanobe\u0027s giant cat astronaut sculpture, \u0027SHIP\u0027S CAT (Crew/Osaka)\u0027, which has become a hugely popular photo spot near Umeda.", "name": "Nakanoshima Museum of Art, Osaka", "transport": "Approx. 5-minute walk from Keihan Nakanoshima Station, or 10-minute walk from JR Osaka Loop Line Fukushima Station"}, {"address": "4-2-55 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A rare entirely subterranean museum in Japan, its above-ground entrance features an intricate weave of stainless steel tubes inspired by the vitality and growth energy of bamboo, showcasing a unique architectural aesthetic. The exhibition spaces are completely underground on the B2 and B3 levels, focusing on post-WWII modern and contemporary art from masters like Picasso, C\u00e9zanne, Andy Warhol, and prominent Japanese artists. The museum frequently hosts forward-looking international special exhibitions, making it an unmissable cultural landmark for contemporary art lovers in the Umeda area.", "name": "The National Museum of Art, Osaka", "transport": "Approx. 5-minute walk from Keihan Watanabebashi Station, or 10-minute walk from Subway Yotsubashi Line Higobashi Station"}, {"address": "1-1-26 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Internationally recognized as a premier center for Oriental ceramics, this museum is world-famous for its thousands of top-tier ancient Chinese, Korean, and Japanese ceramic masterpieces centered around the Ataka Collection, including two National Treasures of Japan and numerous Important Cultural Properties. Reopened recently after a comprehensive upgrade, it features high-tech frameless low-reflection glass cases and 360-degree digital display technology, allowing visitors to appreciate the warm luster and intricate craftsmanship of celadon and porcelain up close. Nestled near Nakanoshima Park, it offers a remarkably elegant and relaxing setting.", "name": "Museum of Oriental Ceramics, Osaka", "transport": "Right outside Keihan Naniwabashi Station, or approx. 5-minute walk from Subway Midosuji Line Yodoyabashi Station"}, {"address": "9F, Hankyu Department Store Umeda Main Store, 8-7 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | An elegant exhibition space on the 9th floor of the Hankyu Department Store Main Store Umeda, serving as one of the most iconic department store art venues in Umeda\u0027s bustling commercial district. It regularly hosts high-caliber cultural and artistic special exhibitions covering diverse themes, such as contemporary painter retrospectives, traditional craft masterworks, anime visual arts, and international luxury brand craft heritage. The spacious, well-planned venue is adjacent to the 9th-floor Festival Plaza and various unique cafes, allowing visitors to seamlessly immerse themselves in art and culture while shopping.", "name": "Hankyu Umeda Gallery", "transport": "Approx. 2-minute walk from JR Osaka Station or Hankyu Osaka-Umeda Station"}, {"address": "4F, Grand Front Osaka North Building, 3-1 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located in the North Building of Grand Front Osaka, this is a cross-disciplinary venue combining technology, sensory experiences, and creative arts. Themed around the \u0027Fusion of Sensitivity and Technology,\u0027 Event Lab collaborates regularly with artists, research institutes, and global corporations to hold interactive digital art exhibits, future tech showcases, and contemporary media art exhibitions. Featuring many interactive art installations that invite hands-on participation, it breaks free from traditional static museum formats, making it perfect for visitors eager to explore cutting-edge technology and avant-garde art.", "name": "Knowledge Capital Event Lab", "transport": "Directly connected to JR Osaka Station, approx. 3-minute walk via pedestrian walkway"}, {"address": "10-12 Chayamachi, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Tucked away on the edge of the bustling Chayamachi district in Umeda, this historic church was established in the early 20th century. The current sanctuary building exudes a charming Gothic Revival aesthetic; its red brick walls and solemn spire stand out with quiet elegance amid modern commercial skyscrapers. Inside, the church boasts beautiful stained-glass windows and a timber vault, with graceful pipe organ music echoing during services and special concerts. An oasis of tranquility in downtown Umeda, it serves not only as a spiritual sanctuary for local worshipers but also draws visitors who appreciate classic architecture and religious art.", "name": "Osaka St. Paul\u0027s Church", "transport": "Approx. 3-minute walk from Hankyu Osaka-Umeda Station (Chayamachi Exit)"}, {"address": "1-23-13 Edobori, Nishi Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Just a short walk or a single subway stop from the Umeda commercial area, this is one of Osaka\u0027s most historically significant Romanesque-style church buildings and a registered Tangible Cultural Property of Japan. Designed by renowned architect Jin Nakamura and completed in 1928, its exterior features dignified stone masonry with elegant Gothic details, while the interior houses rich wooden structures and a serene chapel. Its timeless elegance and deep sense of heritage add a rich layer of history and culture to the surrounding Umeda area.", "name": "Osaka Church, United Church of Christ in Japan", "transport": "Approx. 3-minute walk from Subway Yotsubashi Line Higobashi Station, or 15-minute walk from JR Osaka Station"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-1-88 Oyodonaka, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Nestled at the base of the Umeda Sky Building, Shin-Satoyama is a thoughtfully designed urban native forest and ecological park. Spanning thousands of square meters, this green space faithfully recreates the traditional Japanese satoyama (rural countryside) landscape, complete with streams, rice paddies, mixed woodlands, and seasonal flowers. Serving as a sanctuary for urban birds and insects, it offers a rare, peaceful oasis amid Umeda\u0027s bustling skyscrapers\u2014a perfect spot for a tranquil stroll before or after visiting the observatory to experience the unique harmony of nature and modern architecture.", "name": "Shin-Satoyama Garden \u0026 Wonder Forest", "transport": "Approx. 9-minute walk from JR Osaka Station or Hankyu Umeda Station"}, {"address": "14F South Gate Building, Osaka Station City, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Tucked away on the 14th-floor rooftop of the South Gate Building at Osaka Station City, Tenku no Noen Sky Farm is a rare high-altitude ecological farm in the heart of Osaka. It cultivates a variety of vegetables, fruit trees, flowers, and herbs using eco-friendly organic methods. As you walk up the stairs section by section, you can observe seasonal crops growing and enjoy panoramic views of the northern Umeda and Shin-Osaka skyline at the top. It\u0027s a fantastic elevated getaway to escape the ground-level bustle and soak in fresh air and sunshine.", "name": "OSAKA STATION CITY - Tenku no Noen Sky Farm", "transport": "Directly connected to JR Osaka Station; accessible via the staircase going up from the 11th floor of the North Gate Building"}, {"address": "11F North Gate Building, Osaka Station City, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located on the 11th floor of Osaka Station City\u0027s North Gate Building, Kaze no Hiroba (Wind Plaza) is a stylishly designed open-air rooftop plaza. The plaza features splashing water fountains, artistic sculptures, comfortable wooden benches, and seasonal flower beds, all bathed in a refreshing, cool breeze. Offering panoramic views over the North Umeda skyline and busy railway tracks, it is a hugely popular spot for office workers, couples, and family travelers looking for an elegant outdoor garden to relax in.", "name": "OSAKA STATION CITY - Kaze no Hiroba (Wind Plaza)", "transport": "Directly connected to JR Osaka Station; take the elevator straight to the 11th floor"}, {"address": "Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Umekita Park is one of the world\u0027s largest urban parks directly connected to a major station. As the flagship core of the Grand Green Osaka development, the park features expansive open lawn areas, water features, seasonal tree-lined walkways, and avant-garde cultural event spaces. Blurring the boundary between city and nature, it offers locals and tourists a vast green space to picnic, relax, or join outdoor activities, successfully transforming North Umeda into a futuristic yet eco-sustainable urban forest.", "name": "GRAND GREEN OSAKA - Umekita Park", "transport": "Directly connected to JR Osaka Station (Umekita Underground Exit), or approx. 5-minute walk from Hankyu Umeda Station"}, {"address": "1-1 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Established in 1891, Nakanoshima Park is Osaka\u0027s very first urban public park, nestled as a narrow waterfront oasis between the Dojima and Tosabori Rivers. It is most famous for the Nakanoshima Rose Garden, housing thousands of rose bushes across hundreds of varieties that burst into vibrant, fragrant blooms during spring and autumn. Surrounded by classic red-brick landmarks like Osaka City Central Public Hall and Nakanoshima Library, the park boasts a distinct European charm, making it a top scenic spot near Umeda to soak in the romantic vibe of Osaka, the Aqua Metropolis.", "name": "Nakanoshima Park", "transport": "Approx. 1-minute walk from Kitahama Station (Subway Sakaisuji Line / Keihan Main Line), or approx. 15-minute walk from Umeda Station"}, {"address": "1-1 Ogimachi, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located near the east side of Umeda, Ogimachi Park is a comprehensive urban park featuring sprawling green spaces and extensive recreational facilities. It boasts lush green lawns, impressive fountains, and diverse trees that change beautifully with the seasons. Its highlight is a massive children\u0027s playground equipped with giant slides and climbing structures. Also a favorite spot for locals to walk, exercise, and picnic, the park bubbles with vibrant energy and a cozy family-friendly atmosphere.", "name": "Ogimachi Park", "transport": "Directly connected to Ogimachi Station (Subway Sakaisuji Line), or approx. 3-minute walk from JR Loop Line Tenma Station"}, {"address": "10F North Gate Building, Osaka Station City, 3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located on the 10th floor of Osaka Station City\u0027s North Gate Building, Yawaragi no Niwa Garden is a serene rooftop garden blending traditional Japanese aesthetic elements with modern landscape design. It features elegant wooden corridors, meticulously pruned pine trees, and seasonal blooms, creating a tranquil and peaceful vibe. Compared to the bustling streets of Umeda below, this offers a secluded haven to slow down, catch a refreshing breeze, and appreciate refined Japanese garden aesthetics.", "name": "OSAKA STATION CITY - Yawaragi no Niwa Garden", "transport": "Directly connected to JR Osaka Station; take the Lucua elevator up to the 10th floor"}, {"address": "1-chome Nakanoch\u014d, Miyakojima Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Stretching several kilometers along the Okawa River, Kema Sakuranomiya Park is one of Osaka\u0027s premier waterfront parks and iconic cherry blossom viewing spots. Nearly 4,800 cherry trees line the banks, blossoming into a magnificent canopy tunnel in spring that beautifully reflects on the river water. Even outside cherry blossom season, its well-paved shade-draped paths, waterfront terraces, and lush greenery make it a fantastic natural haven for strolling, jogging, or taking in river sunsets\u2014all conveniently located just northeast of Umeda.", "name": "Kema Sakuranomiya Park", "transport": "Approx. 1-minute walk from JR Loop Line Sakuranomiya Station, or a 5-minute JR train ride from Umeda"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-1-88 Oyodonaka, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | One of Osaka\u0027s most iconic landmarks, the Umeda Sky Building features a circular open-air Kuchu Teien Observatory suspended 173 meters above ground between its twin towers, offering a 360-degree panoramic view. At night, the open-air deck\u0027s floor glows with the magical Lumi Sky Walk\u2014a walkway sparkling like the Milky Way. Paired with stunning sunset views and the dazzling city skyline, it\u2019s a dream spot for couples and photography enthusiasts.", "name": "Umeda Sky Building Kuchu Teien Observatory", "transport": "About a 7 to 9-minute walk from JR Osaka Station or Midosuji Subway Line Umeda Station"}, {"address": "7F HEP FIVE, 5-15 Kakudacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Rising directly through the HEP FIVE shopping complex, this giant bright red Ferris wheel is an iconic piece of public art on the Umeda skyline. Ascending to a peak height of 106 meters, riders get sweeping views stretching from the Umeda commercial district all the way to Osaka Bay. Each cabin is equipped with Bluetooth speakers so you can play your favorite songs for a personalized romantic ride. Don\u0027t miss the giant red whale sculpture suspended inside the 1st floor atrium!", "name": "HEP FIVE Ferris Wheel", "transport": "About a 3-minute walk from Hankyu Osaka-Umeda Station, or a 4-minute walk from Midosuji Subway Line Umeda Station"}, {"address": "3-1-3 Umeda, Kita Ward, Osaka, Osaka Prefecture (5F JR Osaka Station)", "feature": "\u2b50 4.2 stars | Located on the 5th floor of the overpass building at JR Osaka Station, this elevated open-air plaza features a striking, modern arched metal roof. Visitors can look down at trains constantly pulling in and out and crowds bustling through the platforms below. Anchored by impressive giant gold and silver clocks, the plaza is beautifully decorated with seasonal floral arrangements or Christmas illuminations, making it a fantastic spot to snap photos and feel the energetic pulse of modern Osaka.", "name": "Osaka Station City Toki-no-Hiroba Plaza", "transport": "Directly connected to JR Osaka Station (located on 5F inside the station complex)"}, {"address": "4-1 Ofukacho, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Co-designed by world-renowned architect Tadao Ando, this open-air waterscape plaza spans approximately 3,300 square meters. Featuring expansive pools, waterfall walls, and terraced steps near the water, it creates a surprisingly serene waterfront vibe right in the middle of the city. Notable highlights include the famous giant green bear sculpture \u0027Ted Hyber\u0027 and nearby water clock, seamlessly blending art, technology, and architectural aesthetics into a beloved photo backdrop.", "name": "Grand Front Osaka Umekita Plaza", "transport": "Directly connected to the North Exit of JR Osaka Station, about a 1-minute walk"}, {"address": "2-5-4 Sonezaki, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Steeped in over 1,300 years of history, this shrine became famous as the setting of Chikamatsu Monzaemon\u0027s famous puppet play \u0027The Love Suicides at Sonezaki\u0027. Revered as a sacred site for love and matchmaking, it features cute heart-shaped ema (votive plaques) and photo spots featuring the tragic lovers Ohatsu and Tokubei. The bright vermilion torii gate set against surrounding modern skyscrapers offers a captivating contrast filled with historic romantic charm.", "name": "Tsuyu no Tenjinja Shrine (Ohatsu Tenjin)", "transport": "About a 3-minute walk from Tanimachi Subway Line Higashi-Umeda Station, or a 7-minute walk from Hankyu Osaka-Umeda Station"}, {"address": "Komatsubaracho, Kita Ward, Osaka, Osaka Prefecture (Whity Umeda Underground Mall)", "feature": "\u2b50 4.0 stars | Located at the eastern core of the vast Whity Umeda underground mall, the historic \u0027Izumi no Hiroba\u0027 (Fountain Plaza) was completely revamped into a high-tech illuminated art showcase called the \u0027Water Tree\u0027. Composed of thousands of LED lights, this majestic glowing tree produces mesmerizing light shows that change with the seasons and time of day, transforming the subterranean plaza into a magical wonderland and a popular spot for photos.", "name": "Whity Umeda Izumi no Hiroba (Fountain Plaza)", "transport": "Directly connected to Tanimachi Subway Line Higashi-Umeda Station via Whity Umeda Underground Mall"}, {"address": "1-1-27 Nakanoshima, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Completed in 1918 in the Nakanoshima area just south of Umeda, this iconic neo-classical red-brick landmark is designated as an Important Cultural Property of Japan. Its elegant Western architecture, majestic dome, and vaulted arches create a picturesque backdrop alongside modern high-rises and Nakanoshima Waterfront Park. Beautiful under the daytime sun and grand when illuminated at night, it\u2019s a favorite photo spot for romantic European-style flair.", "name": "Osaka City Central Public Hall", "transport": "About a 5-minute walk from Midosuji Subway Line Yodoyabashi Station, or a 12-minute walk from Umeda Station"}, {"address": "3-2-2 Umeda, Kita Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Opened in 2024 on the historic site of the former Osaka Central Post Office, this premier landmark features an impressive multi-story soaring atrium seamlessly combining modern aesthetics with traditional Japanese crafts through grand wood and metal installations. With stylish art sculptures and relaxing green public spaces, it has quickly emerged as one of Umeda\u0027s trendiest hotspots for architecture lovers and social media photos.", "name": "KITTE Osaka \u0026 JP Tower Osaka", "transport": "Directly connected to the West Exit of JR Osaka Station, about a 1-minute walk"}], "name": "Popular Photo Spots"}}, "name": "Umeda and Osaka Station Shopping District"}};

            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
