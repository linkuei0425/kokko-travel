he 1st-floor lobby of the Nakaza CUI-DAORE Building. Full of nostalgic charm and comedic flair, Kuidaore Taro changes his movements periodically. Taking a photo with him is a staple activity when visiting Dotonbori, and plenty of gift shops are located nearby.", "name": "Kuidaore Taro Doll", "transport": "About a 3-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Step away from the lively bustle of Dotonbori into this stone-paved alleyway to feel as though you have been instantly transported back to the Edo period. Hozenji Yokocho brims with nostalgic atmosphere and houses Hozenji Temple, home to the moss-covered \u0027Mizukake Fudo\u0027 statue. Legend has it that splashing water on the statue while praying will make your wishes come true. The cobblestone paths, traditional lanterns, and mossy Buddha statues make incredible photo subjects for photography enthusiasts and travel influencers.", "name": "Hozenji Yokocho \u0026 Mizukake Fudo", "transport": "About a 3-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-chome to 2-chome Shinsaibashisuji, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Serving as the main shopping bridge connecting Dotonbori and Shinsaibashi, this grand covered arcade features a prominent \u0027Shinsaibashi\u0027 sign overhead and represents one of Osaka\u0027s premier cityscapes. Packed with shoppers from around the globe all day long, whether shooting the glowing neon arcade stretching into the distance from Ebisubashi or posing right under the entrance sign, it perfectly captures the vibrant energy of Osaka\u0027s ultimate retail haven.", "name": "Shinsaibashi-suji Shopping Street Arcade Entrance", "transport": "Directly connected from Shinsaibashi Station or Namba Station on the Osaka Metro Midosuji Line"}, {"address": "1-6-4 Dotonbori, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located in the heart of Dotonbori\u0027s competitive dining strip, Kushikatsu Daruma\u0027s main outlet features a giant 3D \u0027Angry Boss\u0027 figure mounted above the entrance. With a stern face and tightly clutching skewers, the statue hilariously serves as a constant reminder of the famous rule: \u0027No double-dipping the sauce!\u0027 Its vivid expression and bold colors make it one of Dotonbori\u0027s funniest and most authentically local photo spots.", "name": "Kushikatsu Daruma Dotonbori Angry Boss Sign", "transport": "About a 3-minute walk from Exit 14 of Namba Station on the Osaka Metro Midosuji Line"}], "name": "Popular Photo Spots"}}, "name": "Namba, Shinsaibashi, Dotonbori"}, "nippombashi-kuromon": {"categories": {"cat_1": {"items": [{"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Tucked away in a stone-paved alley right next to Osaka\u0027s bustling shopping district, Hozen-ji is an ancient temple with centuries of history. Its most famous landmark is the Mizukake Fudo statue, which worshippers splash water on to pray for good fortune. Over many decades, this practice has covered the statue in a thick coat of lush green moss, creating a truly unique aesthetic of passed time and serene tranquility.", "name": "Hozen-ji Temple", "transport": "About a 6-minute walk from Exit 5 of Nipponbashi Station (Osaka Metro / Kintetsu)"}, {"address": "13-9 Ikutamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Affectionately known by locals as \u0027Ikutama-san,\u0027 Ikukunitama Shrine boasts over a thousand years of history and stands as one of Osaka\u0027s oldest shrines. Its unique architecture, known as \u0027Ikutama-zukuri,\u0027 is extremely rare in Japan. The expansive grounds feature several auxiliary shrines, where visitors can stroll and deeply experience its rich history and sacred, peaceful ambiance.", "name": "Ikukunitama Shrine", "transport": "About a 10-minute walk from Nipponbashi Station (Osaka Metro) or a 3-minute walk from Exit 3 of Tanimachi 9-chome Station"}, {"address": "1-4-12 Kouzu, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Dedicated to Emperor Nintoku, Kotsu Shrine is an iconic landmark in Osaka and a famous backdrop in classical Rakugo (storytelling). Perched on a gentle hill, it features elegant traditional wooden architecture and serene shrine gardens. It becomes a prime cherry blossom viewing spot in spring, offering a tranquil and graceful atmosphere for travelers seeking a peaceful escape with a touch of old-world charm.", "name": "Kotsu Shrine", "transport": "About an 8-minute walk from Exit 7 of Nipponbashi Station (Osaka Metro)"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | World-renowned for its massive \u0027Shishiden\u0027 (Lion Stage), this 12-meter-tall building shaped like a giant lion\u0027s head delivers a powerful visual impact. The lion\u0027s gaping mouth is believed to swallow bad luck and bring success in business. As one of Osaka\u0027s most distinctive and recognizable shrine structures, it is a huge hit among international tourists and history buffs alike.", "name": "Namba Yasaka Shrine", "transport": "About a 12-minute walk from Nipponbashi Station (Osaka Metro) or a 6-minute walk from Namba Station"}, {"address": "2-3-22 Osaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Rich in history, Yasui Shrine (also known as Yasui Tenmangu) is the solemn site where the famous Sengoku warlord Sanada Yukimura (Sanada Nobushige) met his end during the Siege of Osaka (Summer Campaign). Home to a bronze statue and memorial monument dedicated to Yukimura, the quiet, rustic grounds shaded by ancient trees make it an unmissable sacred spot for Sengoku history enthusiasts.", "name": "Yasui Shrine", "transport": "About a 6-minute walk from Exit 1-B of Ebisucho Station (Osaka Metro), or about a 12-minute walk south from Nipponbashi Station via Kuromon Market"}, {"address": "5-36 Yuhigaokacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded by Prince Shotoku during the Asuka period, this is one of Japan\u0027s oldest Buddhist temples. Its famous \u0027Tahoto\u0027 (pagoda), built in the Azuchi-Momoyama period, is designated as an Important Cultural Property of Japan, showcasing exquisite wooden craftsmanship of that era. It is also a renowned sacred spot for praying for matchmaking and love.", "name": "Shoman-in Aizendo Temple", "transport": "About an 8-minute walk from Ebisucho Station (Osaka Metro) or a 3-minute walk from Shitennoji-mae Yuhigaoka Station"}, {"address": "1-20 Rokumantai-cho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated among the historical cluster of temples in Shitaderamachi, Kissho-ji features an elegant main gate and a wooden main hall filled with historical charm. The temple shares a deep connection with Japan\u0027s famous \u0027Chushingura\u0027 (the 47 Ronin), housing memorial tombstones for the Ako warriors. It stands as an impressive architectural and historic landmark for understanding Edo-period samurai spirit.", "name": "Kissho-ji Temple Osaka", "transport": "About a 5-minute walk from Shitennoji-mae Yuhigaoka Station (Osaka Metro), or a 10-minute walk south from Kuromon Market in Nipponbashi"}, {"address": "Nipponbashi 1-chome, Chuo Ward, Osaka, Osaka Prefecture / Dotonbori River Intersection", "feature": "\u2b50 4.0 stars | The history of Nipponbashi Bridge itself dates back to the Edo period, when it served as a vital transportation hub connecting Osaka\u0027s Minami district to the Kishu Kaido highway. Today, historical monuments and vintage lamp posts stand at the bridgeheads, recording the century-long transformation of this area from a water transit center and post town into today\u0027s vibrant hub for Kuromon Market and anime culture.", "name": "Historic Site of Nipponbashi Bridge \u0026 Kishu Kaido", "transport": "Right outside Exit 10 of Nipponbashi Station (Osaka Metro / Kintetsu)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-12-10 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | As the headquarters of Bunraku\u2014Japan\u2019s traditional puppet theater recognized as a UNESCO Intangible Cultural Heritage\u2014the National Bunraku Theatre is the premier venue to experience this timeless art form. The facility features a large main theater and a smaller auditorium, regularly hosting captivating performances of classic Bunraku, traditional Japanese dance, and classical music. In the foyer and exhibition room, exquisite puppet heads, costumes, and historical documents are displayed, allowing visitors to delve deep into the essence of Bunraku\u2019s three-part harmony: Tayu (narration), Shamisen (music), and Ningyoshi (puppetry).", "name": "National Bunraku Theatre", "transport": "Approx. 1-minute walk from Exit 7 of Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}, {"address": "7F YES-NAMBA Building, 12-7 Nambasenbonmae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located at the intersection of Nipponbashi and Namba, the Osaka Prefectural Museum of Kamigata Performing Arts (commonly known as Wahha Kamigata) is dedicated to Kansai\u0027s unique comedy culture and traditional Kamigata performing arts. The museum houses a rich collection of valuable historical materials, scripts, notes, and audio-visual recordings of Rakugo (comic storytelling), Manzai (stand-up comedy), Rokyoku, and Naniwa comedy. With highly interactive exhibits, including a comedy stage experience area and an audio-visual room, visitors can immerse themselves in Osaka\u0027s vibrant local entertainment history amidst plenty of laughs.", "name": "Osaka Prefectural Museum of Kamigata Performing Arts (Wahha Kamigata)", "transport": "Approx. 5-minute walk from Exit 5 of Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}, {"address": "1-4-12 Kozu, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Kozu Gu is an ancient, historic shrine dedicated to Emperor Nintoku and revered since ancient times as the guardian deity of Naniwa (Osaka). Perched on a hill east of Nipponbashi, the shrine grounds feature towering, leafy trees that create a solemn and serene atmosphere. It famously served as the setting for the popular Rakugo story \u0027Kozugu\u0027. Within the grounds, you\u0027ll find a Kamigata Rakugo monument and an Ema hall, and regular Rakugo events and arts performances are held here, making it a sacred cultural site blending Shinto beliefs with Osaka\u0027s storytelling heritage.", "name": "Kozu Gu Shrine", "transport": "Approx. 5-minute walk from Exit B28 of Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}, {"address": "13-9 Ikutamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Affectionately known by locals as \u0027Ikutama-san,\u0027 Ikukunitama Shrine is one of Osaka\u0027s oldest shrines, boasting a history of over 2,000 years. The shrine has deep ties to Kamigata performing arts, featuring a statue of author Saikaku Ihara and a monument dedicated to Hikohachi Yonezawa, the founder of Kamigata Rakugo. Every year, the grand Hikohachi Festival is held here, drawing numerous Rakugo performers and traditional artists. The grand shrine architecture and rich cultural heritage offer immense historical and humanistic value.", "name": "Ikukunitama Shrine", "transport": "Approx. 10-minute walk from Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located not far from Nipponbashi and Kuromon Market, Namba Yasaka Shrine is world-famous for its striking, 12-meter-tall giant lion head stage. The lion\u0027s wide-open mouth is said to swallow evil spirits and bring good fortune, victory, and prosperity into your life, making it a spectacular photo spot. The shrine holds an ancient Tug-of-War ritual (Tsunahiki Shinji) every year and preserves traditional Kagura dances and cultural properties related to sacred rituals, offering a captivating blend of visual drama and Shinto cultural traditions.", "name": "Namba Yasaka Shrine", "transport": "Approx. 12-minute walk from Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}, {"address": "2-3-20 Osaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Nestled in the Teramachi district south of Nipponbashi, Yasui Shrine is a historic landmark where the famous Sengoku warlord Sanada Yukimura (Sanada Nobushige) heroically fell during the Summer Siege of Osaka. A monument marking his death site and a bronze statue of Sanada Yukimura stand on the grounds, drawing crowds of history buffs and Sengoku period fans. With an ancient single pine tree (\u0027Ipponmatsu\u0027) and rustic wooden shrine buildings, it exudes a deep sense of historical gravity, making it a wonderful stop to explore Osaka\u0027s samurai heritage and Shinto traditions.", "name": "Yasui Shrine", "transport": "Approx. 6-minute walk from Exit 1-B of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "5-36 Yuhigaokacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Founded by Prince Shotoku as one of the four original welfare institutes (Kyoden-in) of Shitennoji Temple, Shoman-in Aizendo boasts an extraordinarily long history. The temple enshrines Aizen Myoo, the deity of good matches and artistic fulfillment. Its multi-tiered pagoda (Tahoto) is the oldest existing wooden structure in Osaka City and is designated as a National Important Cultural Property. Offering incredible architectural value from the Momoyama period, the temple also hosts the annual Aizen Festival\u2014one of Osaka\u0027s top three summer festivals\u2014recreating traditional palanquin parades and geisha culture.", "name": "Shoman-in Aizendo Temple", "transport": "Approx. 3-minute walk from Exit 5 of Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Tucked away in the lively Sennichimae shopping district northwest of Nipponbashi, Hozen-ji is a peaceful Jodo-shu Buddhist temple offering a tranquil escape. It is best known for \u0027Mizukake Fudo\u0027\u2014a statue of Fudo Myoo covered entirely in soft green moss, created by countless worshippers and tourists splashing water over it as they pray. The temple and the surrounding Hozenji Yokocho alley brim with charming Showa-era nostalgia, famously featured in Sakunosuke Oda\u0027s literary work \u0027Meoto Zenzai.\u0027 It stands as an iconic landmark combining Buddhist art, literary history, and local folklore.", "name": "Hozen-ji Temple", "transport": "Approx. 5-minute walk from Exit B16 of Nipponbashi Station on the Osaka Metro Sakaisuji and Sennichimae Lines"}], "name": "Cultural Museums \u0026 Shrines"}, "cat_3": {"items": [{"address": "2-10-70 Nambanaka, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Namba Parks is a multi-level, sloped urban park that seamlessly blends a modern shopping center with natural ecology. Its terraced rooftop garden extends from ground level up to the 8th floor, featuring tens of thousands of plants and hundreds of floral species. Offering a fantastic relaxing environment with stream features, wooden boardwalks, and open-air seating, it creates a precious urban oasis amidst the bustling Nipponbashi and Namba shopping districts\u2014a perfect place to stroll, enjoy the views, and gaze over Osaka\u0027s cityscape when taking a shopping break.", "name": "Namba Parks Rooftop Garden", "transport": "Directly connected to the Central Exit of Nankai Electric Railway \u0027Namba Station\u0027, or about an 8-minute walk from Exit 5 of \u0027Nippombashi Station\u0027 on the Subway Midosuji/Sennichimae Line."}, {"address": "1-4 Kozu, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Located right next to the historic Kozu Shrine and just a few minutes\u0027 walk from Kuromon Market, Kozu Park is famous for its lush greenery and vibrant spring cherry blossoms. Packed with cherry trees, it is a popular hidden gem for locals and tourists enjoying spring hanami picnics. With a tranquil atmosphere, playground equipment, and comfortable shaded benches, it is the perfect spot for a post-feast stroll after visiting Kuromon Market to experience the peaceful harmony of a historic shrine and lush nature.", "name": "Kozu Park", "transport": "About a 5-minute walk from Exit 8 of Osaka Metro Sennichimae Line / Sakaisuji Line \u0027Nippombashi Station\u0027."}, {"address": "Dotonbori 1-chome, Chuo Ward, Osaka, Osaka Prefecture (Riverbank section from Nippombashi to Minatomachi)", "feature": "\u2b50 4.2 stars | Built along the Dotonbori River running through central Osaka\u0027s commercial hub, this wooden waterfront boardwalk begins near iconic landmarks in Nippombashi. Lined with green plantings and decorative streetlights, the illuminated riverfront glows at night with vibrant neon reflections. Visitors can stroll peacefully along the bank, enjoying the lively streetscape and passing sightseeing boats\u2014an excellent spot to experience Osaka\u0027s charm as a water metropolis and enjoy its accessible urban waterfront.", "name": "Tombori River Walk", "transport": "Immediate access from Exit 2 of Osaka Metro Sakaisuji Line / Sennichimae Line \u0027Nippombashi Station\u0027."}, {"address": "1 Ikutamateramachi, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located behind the ancient Ikukunitama Shrine (Ikutama Shrine), this park rests on the western slope of the Uemachi Plateau. Featuring lush vegetation, towering trees, and dynamic, undulating terrain, Ikutama Park offers an observation deck with views of the Osaka skyline and sunsets. Tucked away from the hustle and bustle of the Nippombashi shopping district, it exudes a tranquil historical atmosphere and elevated natural beauty\u2014a hidden green retreat in the heart of the city for relaxing and unwinding.", "name": "Ikutama Park", "transport": "About a 5-minute walk from Osaka Metro Sennichimae Line \u0027Tanimachi 9-chome Station\u0027, or about a 10-minute walk from \u0027Nippombashi Station\u0027."}, {"address": "4-12 Nippombashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.7 stars | A cozy neighborhood pocket park tucked right behind the core area of Osaka\u0027s famous electronics district, Nippombashi Den Den Town. Equipped with comfortable pavilions, seating, green trees, and flower beds, it provides a rare outdoor breather amidst the bustling anime and electronics hub. Anime fans and tourists looking for a quick rest after treasure hunting can sit back, organize their shopping hauls, and savor the warm, relaxed local pace of life.", "name": "Nippombashi Park", "transport": "About a 6-minute walk from Exit 10 of Osaka Metro Sakaisuji Line \u0027Nippombashi Station\u0027."}, {"address": "1-3-1 Minatomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | An open riverside space situated around Minatomachi Plaza west of the Dotonbori River, combining modern architectural design with a sleek, water-friendly green park. Expansive wooden decks and terraced steps provide comfortable spots to pause and relax amidst seasonal flora and flowers. Frequent outdoor musical performances and creative craft markets infuse the waterfront with art and vitality, making it a fantastic destination to reach while strolling along the river from Nippombashi.", "name": "Minatomachi River Place Park", "transport": "About a 1-minute walk from JR \u0027JR Namba Station\u0027, or about a 12-minute walk along Dotonbori River from \u0027Nippombashi Station\u0027."}, {"address": "3 Yuhigaokacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.9 stars | Located near Shoman-in Aizendo Temple and the Yuhiogaoka area, this community park south of Nippombashi blends historical context with natural greenery. Immaculately maintained and surrounded by towering mature trees and seasonal blooms, it offers a peaceful and serene atmosphere. Featuring a spacious lawn and play equipment, it serves as a cherished haven for local strollers and playing children, as well as a wonderful rest stop for travelers exploring Osaka\u0027s temple town culture and natural landscapes.", "name": "Aizen Park", "transport": "About a 4-minute walk from Osaka Metro Tanimachi Line \u0027Shitennoji-mae Yuhigaoka Station\u0027, or about a 12-minute walk from \u0027Nippombashi Station\u0027."}, {"address": "1-1 Shiokusa, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 3.8 stars | A large comprehensive urban park southwest of the Nippombashi and Namba areas, featuring a vast central lawn, tree-lined walking paths, and lush foliage across four seasons. Abundant park benches offer places to rest, with spring cherry blossoms harmonizing with fresh foliage, and summer supplying plenty of cooling shade. Open and expansive, it frees visitors from the dense architectural feeling of central Osaka, making it a great natural haven for local runners, picnickers, and anyone seeking relaxation.", "name": "Naniwa Park", "transport": "About a 7-minute walk from the South Exit of JR \u0027JR Namba Station\u0027, or about a 15-minute walk from Osaka Metro \u0027Nippombashi Station\u0027."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "2-4-1 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Known as \u0027Osaka\u0027s Kitchen,\u0027 Kuromon Market features visually striking 3D signboards at its entrance, including a giant Pacific bluefin tuna, huge octopus, and sea urchins\u2014making it a classic must-visit photo spot in Osaka. The nearly 600-meter-long shopping street is packed with around 150 shops, filled with enticing aromas of freshly steamed king crab legs, grilled A5 Wagyu beef, freshly opened sea urchins, and raw oysters. Here, visitors can snap vibrant photos capturing the authentic hustle and bustle of a local Japanese market while enjoying an unforgettable street-food crawl.", "name": "Kuromon Market - Giant Seafood Landmarks", "transport": "About a 2-minute walk from Exit 10 of Nippombashi Station on the Osaka Metro Sennichimae or Sakaisuji Line"}, {"address": "2-9-19 Motomachi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Tucked away in the alleys between Nippombashi and Namba, the shrine\u0027s most eye-catching feature is its massive 12-meter-high, 11-meter-wide \u0027Shishiden\u0027 (Lion Head stage). The golden lion head with its wide-open mouth is said to swallow bad luck while bringing good fortune, academic success, and business prosperity. Its awe-inspiring design has made it a viral sensation on social media and a must-visit spot in Osaka. During New Year\u0027s or festivals, the lion\u0027s eyes even glow, and pairing a photo with a limited-edition lion head charm from the shrine office creates an unforgettable travel memory.", "name": "Namba Yasaka Shrine", "transport": "About a 6-minute walk from Namba Station on the Osaka Metro Midosuji/Yotsubashi Line, or a 12-minute walk from Nippombashi Station"}, {"address": "Around 4-chome to 5-chome, Nipponbashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | The largest sanctuary for subculture and electronics in the Kansai region, widely known as the \u0027Akihabara of the West.\u0027 Extending from Ebisucho all the way to Nippombashi Station, the streets are lined with giant anime billboards, figure and toy shops, maid cafes, and arcades. The cityscape is bursting with vibrant neon colors and an immersive ACG (Anime, Comic, Games) vibe. The dramatic anime poster walls along \u0027Ota Road\u0027 are especially popular spots for anime fans and trendy youth looking to capture edgy, futuristic, and graffiti-style photos.", "name": "Nippombashi Den Den Town Anime Street", "transport": "Directly outside Exit 1B of Ebisucho Station on the Osaka Metro Sakaisuji Line, or about a 5-minute walk from Exit 5 of Nippombashi Station"}, {"address": "14-5 Nambasenbonmae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | A specialized shopping street catering to restaurant and kitchen supplies, marked by a prominent, giant illuminated sign with the character \u0027\u9053\u0027 (Do) at its entrance. The arcades are packed with hyper-realistic food replicas, traditional lanterns, takoyaki grills, and Japanese kitchen knives. A favorite activity for visitors is taking photos with oversized takoyaki props or shiny sets of Japanese tableware\u2014feeling like stepping into a whimsical toy kingdom that showcases Osaka\u0027s vibrant commercial energy and food culture.", "name": "Sennichimae Doguyasuji Shopping Street", "transport": "About a 5-minute walk from Exit 5 of Nippombashi Station on the Osaka Metro Sennichimae Line, or a 3-minute walk from Nankai Electric Railway Namba Station"}, {"address": "1-22-25 Nipponbashi, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A famous seafood spot located in the heart of Kuromon Market, featuring an iconic giant tuna graphic and live bluefin tuna cutting demonstration area at its entrance, making it one of the market\u0027s premier photo locations. Inside, a spacious dining area showcases an impressive display of glistening salmon roe rice bowls, premium otoro (fatty tuna) sashimi, and oversized raw oysters. Every photo captured here looks mouthwateringly delicious, capturing the ultimate seafood charm of Osaka\u0027s Kitchen.", "name": "Kuromon Sanpei - Giant Seafood Photo Area", "transport": "About a 3-minute walk from Exit 10 of Nippombashi Station on the Osaka Metro Sennichimae or Sakaisuji Line"}, {"address": "1-2-16 Namba, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | A serene historic temple tucked away in the stone-paved alleyways of Hozenji Yokocho near Nippombashi and Sennichimae. The revered deity \u0027Mizukake Fudo\u0027 is covered in a thick blanket of lush green moss due to years of worshippers splashing water while praying, giving it a mysterious and timeless beauty. As night falls and red lanterns flicker on, illuminating the mossy statue and vintage cobblestone street, a nostalgic Showa-era atmosphere takes over, drawing photography enthusiasts to capture its unique, tranquil charm.", "name": "Hozenji Temple - Moss-Covered Mizukake Fudo", "transport": "About a 6-minute walk from Nippombashi Station on the Osaka Metro Sennichimae Line, or a 3-minute walk from Exit 14 of Namba Station"}, {"address": "4-15-17 Nipponbashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Located in the heart of Ota Road, this anime cultural haven boasts a multi-story building featuring its signature grand blue storefront. Giant wall posters displaying the latest popular anime are constantly updated, while the ground floor offers an impressive selection of trading cards, figures, and exclusive merchandise. With life-sized character standees and limited-time pop-up exhibitions at the entrance and across various floors, it is an essential pop-culture spot where anime fans worldwide gather to take souvenir photos.", "name": "Animate Osaka Nipponbashi Flagship Store", "transport": "About a 5-minute walk from Ebisucho Station on the Osaka Metro Sakaisuji Line, or an 8-minute walk from Nippombashi Station"}, {"address": "13-9 Ikutamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | An ancient shrine within walking distance of Nippombashi, affectionately known as \u0027Ikutama Shrine,\u0027 boasting a history of over 2,000 years. Its most striking features are the grand vermilion torii gate and the unique \u0027Ikukunitama-zukuri\u0027 architectural style of its main hall. The lush, expansive grounds blend a solemn historical atmosphere with seasonal floral beauty. Particularly during spring cherry blossoms and autumn ginkgo foliage, the grand torii pairs beautifully with nature, making it a hidden gem for capturing timeless, classic Japanese-style photos away from the bustling shopping districts.", "name": "Ikukunitama Shrine", "transport": "About a 3-minute walk from Exit 3 of Tanimachi 9-chome Station on the Osaka Metro Sennichimae Line, or a 10-minute walk from Nippombashi Station"}], "name": "Popular Photo Spots"}}, "name": "Nihonbashi and Kuromon Market"}, "osaka-castle": {"categories": {"cat_1": {"items": [{"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | Osaka Castle Main Keep is Osaka\u0027s most iconic historical landmark. Originally built by Toyotomi Hideyoshi in 1583, it underwent destruction by war and multiple reconstructions. The current third-generation main keep was rebuilt in 1931, blending architectural styles from the Azuchi-Momoyama and Edo periods. Its grand exterior features white walls adorned with gold leaf, showcasing past glory. The eight-story interior has been converted into a modern history museum housing countless precious artifacts, armor, and folding screen paintings from the Sengoku period. Ascending to the 8th-floor observation deck offers a 360-degree panoramic view of downtown Osaka and the vast Osaka Castle Park, making it a must-visit destination to experience Japan\u0027s Sengoku history and architectural craftsmanship.", "name": "Osaka Castle Main Keep", "transport": "Approx. 10-min walk from Exit 1B or 9 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line), or approx. 15-min walk from Osakajokoen Station (JR Osaka Loop Line)"}, {"address": "Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Otemon Gate is the main entrance of Osaka Castle. Built in 1628, it is designated as a National Important Cultural Property. This massive gate towers with an extremely sturdy \u0027Masugata\u0027 (square compound) defensive structure designed to thwart direct enemy intrusions. Its tight, imposing construction reflects the powerful engineering prowess and authority of the Tokugawa Shogunate during the castle\u0027s Edo-period restoration. Passing through, you can admire adjacent turreted walls and seamlessly fitted giant stones, perfectly showcasing the peak stone wall construction craftsmanship of the era\u2014an essential historic gate to explore when visiting Osaka Castle.", "name": "Osaka Castle Otemon Gate", "transport": "Approx. 5-min walk from Exit 9 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "4-1-32 Otemae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located right next to Naniwa Palace Site Park and Osaka Castle Park, the Osaka Museum of History seamlessly combines modern architecture with ancient history. Using high-tech interactive exhibits and life-sized reconstructed models, the museum takes visitors on a journey through time\u2014from the ancient Naniwa Palace of the Asuka period, through medieval and early modern Osaka as the \u0027Water Capital\u0027, to the Showa era streetscapes. Looking out from the upper floor exhibition halls, visitors can enjoy a magnificent bird\u0027s-eye view of Osaka Castle and surrounding parks. Its elegant glass curtain wall exterior connects seamlessly with the neighboring NHK Osaka Hall, serving as a key cultural landmark to explore Osaka\u0027s thousand-year evolution.", "name": "Osaka Museum of History", "transport": "Directly accessible from Exit 9 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line or Chuo Line)"}, {"address": "2-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located in the Ninomaru compound of Osaka Castle Park, Hokoku Shrine is primarily dedicated to Toyotomi Hideyoshi\u2014the great warlord who unified Sengoku-period Japan\u2014as well as his son Hideyori and brother Hidenaga. A grand bronze standing statue of Toyotomi Hideyoshi stands within the shrine grounds, serving as a popular photo spot for history enthusiasts. It is also famous as a shrine for praying for success in life, good luck, and victory. The serene surroundings showcase distinct seasonal beauty, with spring cherry blossoms and autumn maple leaves framing the sacred torii gate and main hall, exuding a quaint and solemn historical atmosphere.", "name": "Hokoku Shrine", "transport": "Approx. 10 to 12-min walk from Tanimachi 4-chome Station or Tanimachi 6-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | The Sengan Turret is one of the oldest surviving Important Cultural Properties of Osaka Castle. Built in 1620 and situated on the northwest side of Otemon Gate, it served as a defense fortress to monitor both Otemon Gate and the Nishinomaru area. Legend has it that during Oda Nobunaga\u0027s assault on Ishiyama Hongan-ji, this turret\u0027s exceptional firing range inflicted heavy casualties on his forces, prompting Nobunaga to lament that he would take it \u0027even if it cost a thousand kan (Sengan)\u0027, hence its name. With white lacquered outer walls and a compact two-story structure, it brilliantly demonstrates the craftsmanship and tactical ingenuity of traditional Japanese castle defense.", "name": "Osaka Castle Sengan Turret", "transport": "Approx. 7-min walk from Exit 9 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}, {"address": "1 Hoenzaka, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Naniwa Palace Site Park preserves the ruins of Naniwa Palace, the imperial capital of Japan from the Asuka to Nara periods (7th to 8th centuries), and marks a highly significant location following the historic Taika Reforms. After extensive archaeological excavations, the area was designated a National Historic Site and transformed into a spacious green park. The foundation platforms and massive pillar bases of the ancient Daigokuden (Great Hall of State) have been preserved and restored, allowing visitors to experience the grand scale of an ancient Japanese capital. It serves as a soulful location for history buffs exploring ancient Osaka, as well as a popular recreational spot for local residents to stroll and enjoy cherry blossoms.", "name": "Naniwa Palace Site Park", "transport": "Approx. 3-min walk from Exit 10 of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line or Chuo Line)"}, {"address": "Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Located at the northwest corner (\u0027Inui\u0027 direction) of Osaka Castle, the Inui Yagura Turret is one of the defensive turrets reconstructed by the Tokugawa Shogunate in 1620 and is designated as a National Important Cultural Property. Featuring a rare L-shaped two-story corner turret architecture, it presents a simple, elegant appearance with fire-resistant white lacquered walls. As a crucial defensive barrier protecting the castle\u0027s northwest flank, its structural design exhibits great military ingenuity. Since its interior is generally closed to the public\u2014viewable mainly from outside the moat or during special seasonal openings\u2014it carries an added aura of mystery and precious historic charm.", "name": "Osaka Castle Inui Yagura Turret", "transport": "Approx. 10-min walk from Exit 3 of Temmabashi Station (Osaka Metro Tanimachi Line)"}, {"address": "2-1-22 Otemae, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Completed in 1926 (Taisho 15), the Osaka Prefectural Government Main Building is Japan\u0027s oldest modern administrative building still in active use as a main prefectural headquarters. Built in the Neoclassical style popular during the Taisho period, it boasts a dignified and majestic exterior, while its interior features a magnificent marble central hall and classical staircase, often used as a filming location for movies and TV dramas. Having witnessed the ups and downs of Osaka\u0027s modern political and economic development, this building holds great architectural artistic value and stands as a representative modern cultural asset of the Tanimachi area.", "name": "Osaka Prefectural Government Main Building", "transport": "Approx. 3-min walk from Exit 1A of Tanimachi 4-chome Station (Osaka Metro Tanimachi Line)"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.4 stars | Standing proudly in the center of Osaka Castle Park, the Osaka Castle Main Keep is not only Osaka\u0027s most iconic landmark, but also houses a modern history museum inside. Spanning eight floors, it showcases a wealth of precious historical artifacts from the Toyotomi Hideyoshi era, Sengoku period weaponry, battle screen paintings, and replica armor. The 3rd and 4th floors serve as Important Cultural Property exhibition areas with rotating displays; the 5th floor faithfully recreates the fierce battle of the \u0027Summer Siege of Osaka\u0027 through exquisite miniature models and 3D dynamic imagery; and the top 8th floor features an observation deck offering a 360-degree panoramic view of Osaka city and the sprawling park from 50 meters above ground. It is a must-visit destination for anyone wanting to delve into Kansai\u0027s Sengoku history and Osaka\u0027s origins.", "name": "Osaka Castle Main Keep Museum", "transport": "About a 15-minute walk from JR Osakajokoen Station or Subway Tanimachi 4-chome Station"}, {"address": "4-1-32 Otemae, Chuo Ward, Osaka, 540-0008", "feature": "\u2b50 4.3 stars | Located next to Tanimachi 4-chome Station and sharing a building with the NHK Osaka Broadcasting Station, the Osaka Museum of History is a three-dimensional historical experience that takes you back through a thousand years of time. Operating on a \u0027past-to-present\u0027 tour flow, visitors take an elevator directly to the 10th floor, where they are greeted by a full-scale 1:1 reconstruction of the Taiyokuden (Grand Hall of State) of Naniwa Palace from the Asuka Period, complete with towering red pillars and light projections that recreate ancient royal court splendor. The 9th floor features the Edo Period streetscapes of the \u0027Water Capital Osaka\u0027 alongside Bunraku puppets; the 8th floor has an interactive archaeological hands-on zone; and the 7th floor recreates the bustling modern commercial streets of Osaka during the Taisho and early Showa eras. Large windows on the upper floors also offer a breathtaking vantage point overlooking Osaka Castle Main Keep.", "name": "Osaka Museum of History", "transport": "Directly connected to Exit 9 of Tanimachi 4-chome Station on the Subway Chuo and Tanimachi Lines"}, {"address": "2-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.2 stars | Situated on the south side of Osaka Castle Park, Peace Osaka is a memorial museum dedicated to reflecting on World War II and praying for world peace. The museum meticulously documents the history of multiple large-scale air raids suffered by Osaka during WWII, displaying bomb replicas, everyday belongings of affected citizens, historical photographs, and a simulated air-raid shelter that profoundly convey the tragic cost of war. Beyond documenting the local air raids, the museum includes a picture book reading corner and special topic exhibition rooms aimed at promoting peace, making it a meaningful cultural venue combining historical education with deep humanistic reflection.", "name": "Peace Osaka (Osaka International Peace Center)", "transport": "About a 5-minute walk from Morinomiya Station on the JR Loop Line or Subway Nagahori Tsurumi-ryokuchi Line"}, {"address": "1-3-6 Tokui-cho, Chuo Ward, Osaka, 540-0028", "feature": "\u2b50 4.4 stars | Tucked away among the office towers of Tanimachi, Yamamoto Noh Theater was established in 1927 and is Osaka\u0027s oldest surviving traditional Noh theater registered as a National Registered Tangible Cultural Property. This three-story wooden building seamlessly blends early Showa period craftsmanship with classical Noh stage design, featuring unique acoustic resonating jars beneath the stage to enhance sound projection. In addition to regularly hosting traditional Noh and Kyogen performances, the theater actively promotes cultural experiences by offering innovative \u0027LED Noh\u0027 shows that blend cutting-edge lighting tech with tradition, as well as Noh mask and costume workshops tailored for international visitors, breathing fresh vitality into classic art.", "name": "Yamamoto Noh Theater", "transport": "About a 2-minute walk from Exit 4 of Tanimachi 4-chome Station on the Subway Tanimachi and Chuo Lines"}, {"address": "10-32 Amijima-cho, Miyakojima Ward, Osaka, 534-0026", "feature": "\u2b50 4.4 stars | Located in Amijima-cho north of Osaka Castle, the Fujita Museum is a renowned private art museum housing tens of thousands of ancient East Asian art treasures assembled by Meiji-era industrialist Baron Denzaburo Fujita and his sons. The collection boasts 9 National Treasures of Japan\u2014including the world-famous \u0027Yohen Tenmoku Tea Bowl\u0027\u2014and 53 Important Cultural Properties. Fully renovated in 2022, the museum re-emerged as a minimalist architectural space filled with modern Zen aesthetics and natural light, beautifully integrated with its surrounding garden scenery. Alongside exquisite ceramics, painting scrolls, and tea ceremony utensils, the on-site teahouse serves freshly whisked traditional Japanese matcha and grilled dango, making it a hidden gem for enjoying world-class fine art and refined culture.", "name": "Fujita Museum", "transport": "About a 1-minute walk from Exit 3 of Osakajokitazume Station on the JR Tozai Line"}, {"address": "2-24-22 Tamatsukuri, Chuo Ward, Osaka, 540-0004", "feature": "\u2b50 4.3 stars | Located in the Tamatsukuri area, the Osaka Cathedral St. Mary of the Immaculate Conception (Tamatsukuri Catholic Church) is Osaka\u0027s premier Gothic Catholic cathedral. The site originally housed the estate of famous Sengoku period warlord Hosokawa Tadaoki and his wife Hosokawa Gracia (Tama Hosokawa), and memorial stone statues of Gracia and Takayama Ukon stand solemnly in front of the church. The grand structure features soaring vaulted ceilings and magnificent stained-glass windows, highlighted by a breathtaking mural depicting Hosokawa Gracia and the Virgin Mary behind the main altar. Outfitted with a pipe organ, its quiet and sacred ambiance cleanses the soul, representing a stunning architectural synthesis of Japanese feudal history and Western religious art.", "name": "Osaka Cathedral St. Mary of the Immaculate Conception", "transport": "About a 10-minute walk from Morinomiya Station on the Subway Nagahori Tsurumi-ryokuchi Line or JR Line"}, {"address": "Osakajo, Chuo Ward, Osaka, 540-0002 (Tamon Yagura \u0026 Sengan Yagura Area)", "feature": "\u2b50 4.4 stars | Osaka Castle preserves several defensive \u0027Yagura\u0027 (corner turrets) dating back to the Edo period\u2014including Tamon Yagura, Sengan Yagura, and Inui Yagura\u2014all designated as National Important Cultural Properties. During designated seasonal public openings, visitors can step inside these turrets, which are normally closed to the general public, for an immersive tour. Tamon Yagura is Japan\u0027s largest surviving gate turret, featuring intricate defensive arrow slits (hazama) and stone-drop chutes, while Sengan Yagura guards the main Otemon Gate from strategic angles. Guided explanations and historical document displays inside transport visitors back to the early Tokugawa Shogunate, revealing the defensive genius behind Japan\u0027s grandest castle.", "name": "Osaka Castle Yagura Turrets Special Exhibition", "transport": "About a 10-minute walk from Exit 1B or 9 of Tanimachi 4-chome Station on the Subway Tanimachi Line"}, {"address": "2-27-18 Tamatsukuri, Chuo Ward, Osaka, 540-0004", "feature": "\u2b50 4.1 stars | Situated south of Osaka Castle, Tamatsukuri Inari Shrine has been a sacred site for crafting magatama (curved beads) and praying for good relationships since ancient times, sharing deep historical ties with Toyotomi Hideyoshi and Osaka Castle. The shrine\u0027s on-site \u0027Naniwazu Treasure House\u0027 and \u0027Magatama Gallery\u0027 display raw magatama stones excavated from the ancient local ruins, ancient pottery, handwritten calligraphy and paintings by Toyotomi Hideyoshi and his son Hideyori, and excavated historical artifacts. The exhibits offer a detailed look into the history of the Tamatsukuri district as an artisan settlement during the Naniwa Palace era and the religious devotion of the Toyotomi clan, making it a charming and deeply historical museum experience.", "name": "Tamatsukuri Inari Shrine Museum (Naniwazu Treasure House)", "transport": "About an 8-minute walk from Morinomiya Station on the Subway Nagahori Tsurumi-ryokuchi Line or JR Line"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 Stars | Spanning approximately 105.6 hectares, Osaka Castle Park is the most iconic urban park in Osaka. Surrounding the historic symbol of Osaka\u2014the Main Keep of Osaka Castle\u2014the park offers breathtaking natural beauty across all four seasons. In spring, thousands of cherry blossoms bloom, drawing crowds of flower-viewing enthusiasts, while autumn paints the landscape with golden ginkgo-lined avenues and vibrant red foliage. Featuring moats, massive stone walls, and expansive lawns, it is ideal for strolling, picnics, and morning jogs\u2014a perfect retreat combining rich history with natural scenery.", "name": "Osaka Castle Park", "transport": "Directly accessible from JR Loop Line \u0027Osakajokoen Station\u0027, or a 5-minute walk from Exit 1B/9 of Tanimachi 4-chome Station on the Subway Tanimachi Line."}, {"address": "2 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Located within Osaka Castle Park, Nishinomaru Garden spans roughly 6.5 hectares as a spacious lawn garden surrounded by lush greenery and historic ruins. Renowned for its ~300 Somei Yoshino cherry trees, it is one of Osaka\u2019s premier cherry blossom viewing locations. During the spring night-time light-up event, visitors can admire illuminated nighttime blossoms set against the magical backdrop of the lit-up main keep. Offering wide open views, on clear days you can take in panoramic views of the castle keep from the lush green lawn in an elegant, peaceful ambiance.", "name": "Nishinomaru Garden (Osaka Castle)", "transport": "About a 10-minute walk from Exit 9 of Tanimachi 4-chome Station on the Subway Tanimachi Line."}, {"address": "1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 Stars | Located on the east side of the Main Keep, Osaka Castle Plum Grove covers roughly 1.7 hectares and is one of the largest plum-blossom spots in the Kansai region. It features over 1,200 plum trees across roughly 100 varieties\u2014including early and late-blooming types\u2014ensuring continuous blooms from mid-January to mid-March. In full bloom, a delicate fragrance fills the air as shades of pink, pure white, and deep crimson blend together against the grand backdrop of Osaka Castle, making it a quintessentially classic Japanese scene for photos.", "name": "Osaka Castle Plum Grove", "transport": "About a 10-minute walk from JR Loop Line \u0027Osakajokoen Station\u0027, or a 12-minute walk from Morinomiya Station on the Subway Nagahori Tsurumi-ryokuchi Line."}, {"address": "1-6 Hoenzaka, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 Stars | Situated south of Tanimachi 4-chome Station, Naniwa Palace Site Park marks the historic location of the ancient Naniwa Palace from Japan\u0027s Asuka to Nara periods. Today, it has been transformed into a sprawling open historical park preserving massive palace foundation ruins and a reconstructed Daigokuden (Audience Hall) platform. Featuring extensive grassy lawns, it\u2019s a popular retreat for locals and tourists alike to stroll, walk dogs, or exercise. From the park, you can enjoy a unique urban vista where ancient palace foundations meet modern skyscrapers.", "name": "Naniwa Palace Site Park", "transport": "About a 3-minute walk from Exit 10 of Tanimachi 4-chome Station on the Subway Tanimachi and Chuo Lines."}, {"address": "3 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Located on the northern side of Osaka Castle Park, the Peach Grove is an insider secret compared to the cherry and plum blossoms. The orchard features over 200 peach trees across roughly 12 varieties, blooming sequentially from mid-March to mid-April. The peach blossoms come in a rich spectrum of colors, ranging from pure white and soft pink to vivid crimson. It even includes rare double-flowering varieties like \u0027Genjiguruma\u0027, where different colored blossoms bloom on the very same tree, creating a romantic, paradise-like fairy tale setting when in full bloom.", "name": "Osaka Castle Peach Grove", "transport": "About a 10-minute walk from Kyobashi Station (JR/Keihan Main Line), or a 5-minute walk from Osaka Business Park Station on the Subway Nagahori Tsurumi-ryokuchi Line."}, {"address": "1 Chome Nakanochou, Miyakojima Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 Stars | Kema Sakuranomiya Park is a 4.2 km riverside park stretching along the Ogawa River, with the section from Temmabashi to the north of Osaka Castle being its highlight. Nearby, nearly 4,000 cherry blossom trees line the riverbanks, forming a seemingly endless tunnel of pink blossoms in spring. Visitors can walk or bike along the gentle riverside pathways, or board a water bus to take in the spectacular view of water-bound Osaka intertwined with cherry blossoms from the river. Equipped with accessible waterfront platforms, it\u2019s the best place to experience Osaka\u0027s aqua-metropolis charm and natural beauty.", "name": "Kema Sakuranomiya Park - Temmabashi Area", "transport": "Directly accessible upon exiting Temmabashi Station on the Keihan Main Line or Subway Tanimachi Line."}, {"address": "3 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Situated at the Morinomiya entrance in the southeastern corner of Osaka Castle Park, this fountain plaza was recently renovated into an inviting open space that merges lush greenery with modern leisure amenities. A large fountain sits at its center, surrounded by leafy trees and grassy walkways. Home to charming landscape cafes, bakeries, and family-friendly play areas, it retains a natural forest feel while providing excellent recreational convenience\u2014making it a perfect starting point or resting spot when visiting Osaka Castle Park.", "name": "Morinomiya Fountain Plaza \u0026 Greenery", "transport": "Directly accessible from Exit 1/3B of Morinomiya Station on the JR Loop Line or Subway Chuo/Nagahori Tsurumi-ryokuchi Lines."}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 Stars | Tucked away within the Honmaru (inner citadel) area in front of the eastern side of the Main Keep, this exquisite Japanese garden is crafted in the traditional chisen-kaiyushiki (pond-strolling) landscape style. The garden features a pond, stone lanterns, carefully pruned black pines, and arched bridges, masterfully framing the majestic castle keep in the background. The reflection of the keep and seasonal foliage dancing on the water embodies a tranquil, profound Japanese Zen aesthetic. It\u0027s a marvelous spot for visitors to pause after exploring the castle keep and appreciate traditional garden craft alongside natural serenity.", "name": "Osaka Castle Japanese Garden", "transport": "About a 15-minute walk from Tanimachi 4-chome Station on the Subway Tanimachi Line to reach the Honmaru area."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.5 Stars | Osaka Castle Main Keep is Osaka\u0027s most iconic landmark, standing majestically at the heart of the lush green Osaka Castle Park. The white walls, gold leaf embellishments, and blue-green roof tiles blend to evoke the grand majesty of the Sengoku era, while the top-floor observation deck offers a 360-degree panoramic view of the entire Osaka cityscape. The plaza in front of the keep and the surrounding moat are prime spots for photography lovers to capture reflections and seasonal flowers, drawing countless visitors to snapshot beautiful moments especially during the spring cherry blossoms and autumn golden ginkgo seasons.", "name": "Osaka Castle Main Keep", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027 Exit 1B, approx. 10 mins walk"}, {"address": "3-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.2 Stars | Located next to Osakajokoen Station, this commercial complex seamlessly blends warm wooden textures with modern architectural aesthetics. Tree-lined walkways are lined with stylish cafes, trendy restaurants, and boutique shops, making it a perfect spot to rest and snap photos on your way to the main castle keep. The complex features specially designed geometric seating and the \u0027F TANK\u0027 photo setup, which, combined with the lush greenery and views of Osaka Castle in the distance, makes for stunning, hipster-chic travel photos.", "name": "JO-TERRACE OSAKA", "transport": "JR Loop Line \u0027Osakajokoen Station\u0027, right outside the station"}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.1 Stars | Situated right next to Osaka Castle Main Keep, this Romanesque historic building constructed in 1931 was formerly the Headquarters of the 4th Division of the Imperial Japanese Army. The exterior maintains a rich modern Western castle aesthetic, with red brick and stonework creating a classic, dignified ambience. Inside, modern dining and souvenir shops coexist with a preserved vintage grand central staircase and ornate light fixtures, providing a dream scenario for vintage-style photos and classic portraits.", "name": "MIRAIZA OSAKA-JO", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027 Exit 9, approx. 12 mins walk"}, {"address": "2 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.3 Stars | Spanning a grand 6.4 hectares, this sprawling lawn garden is famous for its nearly 300 Somei Yoshino cherry trees. Offering an unobstructed view of the castle keep and majestic moat free from surrounding skyscrapers, the wide open green lawns and blue skies perfectly highlight the castle\u0027s grand presence. During the spring cherry blossom season, a dazzling night illumination event is held, where soft pink blossoms and the illuminated golden keep complement each other, making it an insanely popular social media spot.", "name": "Nishinomaru Garden", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027 Exit 9, approx. 10 mins walk"}, {"address": "1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.4 Stars | Spanning 54 meters across Osaka Castle\u0027s inner moat, Gokurakubashi Bridge is a key passage connecting Ninomaru and Honmaru. Looking toward the main keep from the bridge, its elegant lines, emerald moat waters, and grand castle keep form a beautifully layered panorama. At dawn or dusk, the sky and castle reflect on the water\u0027s surface, creating a peaceful, painting-like scene that makes this an essential photography spot when visiting Osaka Castle.", "name": "Gokurakubashi Bridge", "transport": "Osaka Metro Nagahori Tsurumi-ryochi Line \u0027Osaka Business Park Station\u0027, approx. 10 mins walk"}, {"address": "1-1 Osakajo, Chuo Ward, Osaka, 540-0002", "feature": "\u2b50 4.3 Stars | Otemon Gate is the main entrance to Osaka Castle, featuring grand and rustic architecture that highlights ancient defensive strength. After passing through the gate, you will spot the famous \u0027Takoishi\u0027 (Octopus Stone), a mega monolith weighing nearly 108 metric tons\u2014the largest stone in Osaka Castle\u0027s walls, named for the natural octopus-shaped pattern faintly visible on its surface. Posing before this astonishing giant stone and grand gate creates a visually striking contrast, making it a top photo spot for history buffs and tourists alike.", "name": "Otemon Gate \u0026 Takoishi Giant Stone", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027 Exit 1B, approx. 5 mins walk"}, {"address": "3-chome Tanimachi, Chuo Ward, Osaka, 540-0012", "feature": "\u2b50 4.0 Stars | A spacious historic park right next to Tanimachi 4-chome Station, this is the ancient site of Naniwa Palace dating back to the Asuka and Nara periods. The park reconstructs the foundation platform of the ancient Daigokuden (Great Hall), evoking a sense of historical grandeur and expansive space. Looking north from the foundation platform, you can capture Osaka Castle Keep alongside modern skyscrapers in a single frame, displaying a unique skyline where ancient and modern intersect\u2014a hidden spot prized by locals and savvy photographers for sunset and city panorama shots.", "name": "Naniwa Palace Site Park", "transport": "Osaka Metro Tanimachi Line \u0027Tanimachi 4-chome Station\u0027 Exit 10, right outside the exit"}, {"address": "10-32 Amijimacho, Miyakojima Ward, Osaka, 534-0026", "feature": "\u2b50 4.5 Stars | Situated on the east side of Osaka Castle Park, this modern museum converted from an old collector\u0027s historic residence reshapes traditional Japanese aesthetics with sleek dark-grey steel framing and large transparent glass walls. Outside, there is a tranquil Japanese garden and a popular teahouse serving freshly whisked matcha alongside delicious grilled dango. The minimalist black-and-white architectural lines, swaying green bamboo, and sleek modern glass walkways draw stylish youth and minimalism lovers seeking high-quality, aesthetic photo opportunities.", "name": "Fujita Museum", "transport": "JR Tozai Line \u0027Osakajokitazume Station\u0027 Exit 3, approx. 1 min walk"}], "name": "Popular Instagrammable Spots"}}, "name": "Osaka Castle / Tanimachi"}, "tennoji-shinsekai": {"categories": {"cat_1": {"items": [{"address": "1-11-18 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Founded in 593 AD by Prince Shotoku, Shitennoji is one of Japan\u0027s oldest officially administered temples. Its Asuka-period architectural layout, known as the \u0027Shitennoji-style Garan\u0027, features the Central Gate, Five-Story Pagoda, Main Hall, and Lecture Hall lined up in a straight line, displaying immense historical and architectural value. The temple grounds also feature a Japanese garden and a treasure house, while the monthly \u0027Daishi-kai\u0027 flea market attracts countless visitors seeking a rich, historic atmosphere.", "name": "Shitennoji Temple", "transport": "About a 5-minute walk from Exit 4 of Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "1-18-6 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | An iconic landmark of Shinsekai. The original tower was built in 1912, combining design elements of Paris\u0027s Eiffel Tower and the Arc de Triomphe; the current second-generation tower was rebuilt in 1956 and stands about 108 meters tall. Ascending to the observation deck offers panoramic views of Osaka\u0027s cityscape. Inside, you\u0027ll find Billiken, the god of good fortune. It is a must-visit spot to experience Osaka\u0027s retro Showa-era charm and nostalgic history.", "name": "Tsutenkaku Tower", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line, or about a 6-minute walk from Shin-Imamiya Station on the JR Loop Line"}, {"address": "2-8-69 Osaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Founded in 1185 AD, this historic Jodo Sect temple is famous for serving as Tokugawa Ieyasu\u0027s encampment during the Summer Siege of Osaka in the Warring States period. Its most unique feature is the \u0027Okotsu Butsu\u0027 (Bone Buddha statues), created every ten years by mixing the resin and ashes of hundreds of thousands of deceased devotees. Additionally, the grand black entrance gate designed by a modern architect features reinforced concrete and contemporary sculptures, creating a striking blend of traditional and modern architectural arts.", "name": "Isshinji Temple", "transport": "About a 10 to 15-minute walk from Tennoji Station or Ebisucho Station on the JR/Osaka Metro lines"}, {"address": "1-3-24 Osaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | A historic ancient shrine, also known as \u0027Yasui Tenmangu\u0027. It is historically renowned as the site where the famous Warring States general Sanada Yukimura (Sanada Nobushige) heroically died in battle during the 1615 Summer Siege of Osaka. The grounds feature a statue and monument dedicated to Sanada Yukimura. Surrounded by towering ancient trees, this serene sanctuary is the ultimate pilgrimage site for fans of Warring States history and Sanada Yukimura.", "name": "Yasui Shrine", "transport": "About a 6-minute walk from Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "5-36 Yuhigaokacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | An ancient temple established during the reign of Prince Shotoku as one of the four original institutes of Shitennoji. Its most significant structure, the Tahoto (Tahoto Pagoda), was rebuilt in 1597 by Toyotomi Hideyoshi and is the oldest surviving wooden building in Osaka City, designated as an Important Cultural Property of Japan. Enshrining Aizen Myoo, the deity of love and matchmaking, the temple hosts the annual \u0027Aizen Matsuri\u0027 every summer, one of Osaka\u0027s three major summer festivals.", "name": "Aizendo Shomanin Temple", "transport": "About a 3-minute walk from Exit 5 of Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "1-108 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture (Inside Tennoji Park)", "feature": "\u2b50 4.3 stars | A modern Japanese stroll garden (chisen-kaiyushiki) located inside Tennoji Park, designed during the Taisho era by renowned master gardener Jihei Ogawa (Ueji) for the Sumitomo family estate and later donated to Osaka City. Centered around a large pond, the garden expertly utilizes \u0027borrowed scenery\u0027 techniques to create a tranquil, deep natural landscape. Featuring a teahouse and elegant wooden verandas along the pond, it showcases the exquisite craftsmanship of traditional Japanese landscape design and modern estate gardens.", "name": "Keitakuen Garden", "transport": "About a 5-minute walk from Tennoji Station on the JR/Osaka Metro lines"}, {"address": "1-8 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | One of the \u0027Seven Shrines of Shitennoji\u0027 built simultaneously by Prince Shotoku when establishing Shitennoji Temple, long serving as a sacred guardian shrine. It is famous for the belief that it grants \u0027one wish in a lifetime\u0027, drawing countless worshippers. The grounds house a centuries-old camphor tree emanating a mystical vibe, along with serene classical shrine architecture, making it a peaceful historical retreat in the bustling city.", "name": "Horikoshi Shrine", "transport": "About a 10-minute walk from Tennoji Station on various JR/Osaka Metro lines"}, {"address": "4-30-12 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Legend has it that this shrine, established in 1007 AD, is the birthplace of Abeno Seimei, the famous Onmyoji (diviner) of the Heian period. The shrine grounds preserve the sacred well where Seimei was bathed as a newborn, along with a statue of him. Featuring refined classical shrine architecture and iconic pentagram motifs (Seimei Kikyoin), the site exudes a mystical historical charm, making it a must-visit for enthusiasts of Heian-period history and Onmyodo folklore.", "name": "Abeno Seimei Shrine", "transport": "About a 3-minute walk from Higashi-Tengachaya Station on the Hankai Tramway Uemachi Line, or about a 10-minute walk from Abeno Station on the Osaka Metro Tanimachi Line"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "1-48 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture (Inside Tennoji Park)", "feature": "\u2b50 4.3 stars | Built in 1936 inside Tennoji Park, the Osaka City Museum of Fine Arts sits on the former site of Keitakuen, the estate of the Sumitomo family, and is designated as a Registered Tangible Cultural Property of Japan. Its collection houses thousands of artworks, including ancient Chinese paintings and calligraphy, stone carvings, modern Japanese paintings, and various handicrafts. Among these, the ancient Chinese calligraphy and painting collection donated by Fusajiro Abe is world-renowned. Hosting high-profile international and special exhibitions regularly, it is a magnificent venue for delving deep into East Asian art and Japanese cultural heritage.", "name": "Osaka City Museum of Fine Arts", "transport": "Approx. 10-minute walk from Tennoji Station on the Osaka Metro Midosuji/Tanimachi Lines or JR Lines"}, {"address": "16F Abeno Harukas, 1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Opened in 2014, this urban museum is located on the 16th floor of ABENO HARUKAS. Guided by the philosophy of making art accessible to everyone, it has no permanent collection; instead, it curates a dynamic variety of special exhibitions ranging from East Asian art and Western modern art to National Treasure-level temple treasures, contemporary art, and anime exhibitions. Extremely convenient and open into the evening, visitors can easily indulge in a high-quality artistic feast right after enjoying the panoramic views from the top-floor observation deck.", "name": "Abeno Harukas Art Museum", "transport": "Directly connected to Kintetsu Osaka-Abenobashi Station or Osaka Metro/JR Tennoji Station"}, {"address": "1-11-18 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.1 stars | Situated within Shitennoji\u2014Japan\u0027s oldest officially established temple\u2014the Treasure House preserves and displays priceless artifacts associated with Prince Shotoku, alongside thousand-year-old Buddhist statues, National Treasure crafts, ancient sutras, and ritual paraphernalia. The permanent exhibition features sacred relics related to the 700th memorial anniversary of Prince Shotoku, rotated seasonally with special exhibits. It is an unmissable cultural sanctuary for lovers of ancient Japanese history, Buddhist art, and Asuka period craftsmanship.", "name": "Shitennoji Temple Treasure House", "transport": "Approx. 5-minute walk from Exit 4 of Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "1-26 Ikutamateramachi, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.5 stars | A major church in the Catholic Archdiocese of Osaka, Catholic Tennoji Church boasts a solemn and elegant architectural style blending Gothic and modern designs. The main sanctuary features magnificent stained-glass windows; as sunlight streams through onto the pews, it creates an atmosphere of incomparable sacredness and tranquility. Open to the public for quiet visits, it serves as a central place of worship and community for local believers, highlighting the rich religious and cultural tapestry of the Tennoji area.", "name": "Catholic Tennoji Church", "transport": "Approx. 7-minute walk from Shitennoji-mae Yuhigaoka Station on the Osaka Metro Tanimachi Line"}, {"address": "2-16-7 Katsuyama, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Founded in the 1920s, this historic Protestant church boasts over a century of heritage. Its architecture merges modern Western red-brick construction with geometric lines, exuding a rich nostalgic artistic charm. The pipe organ inside produces beautifully serene tones, serving as the centerpiece for regular organ concerts and community lectures. Standing elegantly on a street corner, it attracts visitors interested in modern Western architecture and church music arts.", "name": "UCCJ Tennoji Church", "transport": "Approx. 12-minute walk from Momodani Station or Tennoji Station on the JR Osaka Loop Line"}, {"address": "2-5-12 Osaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Although Isshinji is a centuries-old ancient temple, its main gate is a striking modern structure of reinforced concrete and bronze sculptures, designed by the current chief priest (who is also an architect). Flanked by massive A-gyo and Un-gyo Nio guardian statues, it seamlessly blends traditional Buddhist faith with avant-garde contemporary art. The temple grounds also feature the Sonsodo Hall and a performing arts theater, \u0027Isshinji Theater Aco Arts Space,\u0027 hosting regular plays, musical performances, and art exhibitions, making it an iconic landmark where temple heritage meets contemporary arts.", "name": "Isshinji Temple Modern Gate \u0026 Art Space", "transport": "Approx. 8\u201310 minute walk from Tennoji Station (Osaka Metro/JR) or Ebisucho Station"}, {"address": "1-18-6 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture (Inside Tsutenkaku Tower)", "feature": "\u2b50 4.2 stars | Located inside the iconic Tsutenkaku Tower in Shinsekai, this exhibition space showcases over a century of history in Shinsekai since the Meiji period. Highlights include intricate dioramas of the original Tsutenkaku Tower and the historic \u0027Luna Park\u0027 amusement park, nostalgic Showa-era streetscape recreations, and anime pop-culture exhibits like the Kinnikuman Museum. It is a fantastic venue to experience the blend of Shinsekai\u0027s working-class heritage, retro charm, and contemporary pop culture.", "name": "Tsutenkaku Exhibition Space", "transport": "Approx. 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line"}, {"address": "3-13-23 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture (Abeno Disaster Prevention Center)", "feature": "\u2b50 4.6 stars | Located in Abeno Ward, this interactive experiential hall is a modern facility combining popular science with disaster prevention technology. Through high-tech 3D theaters, earthquake intensity simulators, and smoke evacuation zones, it conveys disaster preparedness and safety education in a deeply immersive way. With a design steeped in modern technological aesthetics, it stands out as an educational and fun museum in the Tennoji-Abeno area.", "name": "Abeno Life Safety Learning Center", "transport": "Approx. 3-minute walk from Exit 2 of Abeno Station on the Osaka Metro Tanimachi Line"}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "5-55 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Opened in 1909, Tennoji Park is one of Osaka\u0027s most iconic urban oases, covering a vast area. The park integrates rich natural ecology with diverse cultural facilities, including an expansive lawn plaza, the traditional Japanese garden Keitakuen, and Tennoji Zoo. Offering delightful scenery in every season\u2014cherry blossoms in spring, lush greenery in summer, and vibrant foliage in autumn\u2014it is a top choice for locals and tourists to relax, sunbathe, picnic, and enjoy outdoor activities.", "name": "Tennoji Park", "transport": "Take the Osaka Metro Midosuji Line or Tanimachi Line to \u0027Tennoji Station\u0027, take Exit 5, and walk about 2 minutes."}, {"address": "1-108 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture (Inside Tennoji Park)", "feature": "\u2b50 4.4 stars | Located inside Tennoji Park, Keitakuen Garden is an authentic traditional Japanese garden featuring a classic \u0027chisen-kaiyushiki\u0027 (pond-strolling) design. It was meticulously crafted during the Meiji to Taisho eras by Ogawa Jihei VII (Ueji), a master of modern Japanese landscape gardening. At the heart of the garden lies a grand pond surrounded by artfully sculpted rockeries, waterfalls, stone lanterns, and seasonal plantings. Colorful koi swim in the pond, while graceful bridges cross the water, creating a serene, Zen-like atmosphere. Each season brings unique charm\u2014especially autumn\u0027s red maples and early summer\u0027s blooming irises\u2014drawing endless photography enthusiasts.", "name": "Keitakuen Garden", "transport": "Take the JR or Osaka Metro to \u0027Tennoji Station\u0027 and walk about 6 minutes through the Tenshiba Lawn Area inside Tennoji Park."}, {"address": "5-55 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | \u0027Tenshiba\u0027 is a massive redeveloped natural lawn area at the entrance of Tennoji Park, offering a stylish modern urban outdoor leisure space. Spanning nearly 7,000 square meters of lush green grass, it is surrounded by trendy cafes, restaurants, a pet park, and outdoor sports facilities. Many visitors and families spread out picnic blankets to soak up the sun while admiring the towering Abeno Harukas in the background, enjoying a unique cityscape where skyscrapers meet nature.", "name": "Tennoji Park Tenshiba Lawn Area", "transport": "Take the Osaka Metro Midosuji Line to \u0027Tennoji Station\u0027, Exit 21; the park is right outside."}, {"address": "1-108 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Located on the northwest side of Tennoji Park, Mount Chausu is one of Osaka\u0027s famous five hill mounds, standing at an elevation of about 26 meters. Beyond its dense woodlands and quiet forest trails, it plays a pivotal role in Japanese history, having served as the main encampment for Tokugawa Ieyasu during the Siege of Osaka (Winter Campaign) and Sanada Yukimura during the Summer Campaign. At the foot of the hill lies Kabuto Pond (Soko-ike), offering picturesque lake views enhanced by the striking vermilion Wake Bridge and its reflections\u2014a hidden oasis blending nature with rich historical heritage.", "name": "Mount Chausu (Chausuyama)", "transport": "Take the Osaka Metro Tanimachi Line to \u0027Shitennoji-mae Yuhigaoka Station\u0027, Exit 4, and walk about 5 minutes."}, {"address": "1-11-18 Shitennoji, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.3 stars | Located within the main quarters of the ancient Shitennoji Temple, the Gokuraku-jodo Garden is a mound-and-pond traditional garden symbolizing the Pure Land in Buddhist philosophy. Designed around natural spring waters, it features the Yuensen and Rurikou Ponds, surrounded by shady trees, majestic rock formations, and seasonal flora\u2014cherry blossoms in spring, lotus and azaleas in early summer, and vibrant maples in late autumn. Strolling along elegant stone bridges and peaceful pathways accompanied by gentle water flows and temple bells instantly washes away city noise, offering a sense of sacred natural tranquility.", "name": "Gokuraku-jodo Garden at Shitennoji Temple", "transport": "Take the Osaka Metro Tanimachi Line to \u0027Shitennoji-mae Yuhigaoka Station\u0027, Exit 4, and walk about 5 minutes."}, {"address": "1-8 Chausuyamacho, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.4 stars | Horikoshi Shrine is an ancient shrine in Tennoji renowned for its spiritual atmosphere and the tradition of \u0027granting one wish in a lifetime.\u0027 The grounds are filled with lush foliage, resembling a small eco-forest hidden within the city. Its most famous natural feature is a centuries-old sacred camphor tree (Shinboku) that has survived disasters and wars, revered by locals as a divine symbol of vitality. The quiet, graceful shrine grounds offer a peaceful escape for visitors seeking fresh air and inner tranquility.", "name": "Horikoshi Shrine Sacred Tree \u0026 Ancient Tree Grounds", "transport": "Take the JR or Osaka Metro to \u0027Tennoji Station\u0027, exit through the underground passage towards Tanimachi-suji, and walk about 5 minutes."}, {"address": "2-3-22 Aisaka, Tennoji Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Perched on a hill in Tennoji, Yasui Shrine is famously known as the site of legendary Sengoku samurai Sanada Yukimura\u0027s last stand. The shrine grounds encompass rolling green terrain and old-growth trees, exuding a serene and solemn atmosphere. In spring, delicate cherry blossoms bloom across the hill, transforming the grounds into a sea of soft pink. Summer brings dense shade and refreshing breezes. The observation spot behind the shrine offers a fantastic view overlooking the Shinsekai and Tsutenkaku area, making it a hidden gem for history buffs and nature lovers alike.", "name": "Yasui Shrine Greenery \u0026 Cherry Blossom Grounds", "transport": "Take the Osaka Metro Tanimachi Line to \u0027Shitennoji-mae Yuhigaoka Station\u0027 and walk about 6 minutes."}, {"address": "3-4 Matsumushidori, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.0 stars | Nestled on the Shotenyama hill south of the Tennoji area, Shotenyama Park is a hidden park that preserves rugged terrain and lush native flora. Towering trees shade winding stone steps and viewing pavilions. Distinct seasonal beauty\u2014especially cherry blossoms in spring and fresh green foliage in early summer\u2014provides local residents and visitors with a quiet spot for walks and cooling off away from the urban hustle, showcasing a peaceful side of Tennoji where history and nature harmonize.", "name": "Shotenyama Park", "transport": "Take the Hankai Tramway Hankai Line to \u0027Shotensaka Station\u0027 and walk about 4 minutes."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "1-18-6 Ebisuhigashi, Naniwa Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.2 stars | Tsutenkaku Tower is the most iconic landmark in Osaka\u0027s Shinsekai district, standing 108 meters tall. The observation deck at the top offers panoramic views of the Osaka cityscape, while inside, the statue of \u0027Billiken, the God of Good Luck\u0027 is a must-photo spot\u2014rubbing the soles of his feet is said to bring good fortune! The giant high-altitude slide, \u0027TOWER SLIDER,\u0027 attracts countless thrill-seekers. Combining nostalgic Showa-era charm with exciting modern attractions, this is a classic spot you cannot miss when visiting Shinsekai.", "name": "Tsutenkaku Tower", "transport": "About a 3-minute walk from Exit 3 of Ebisucho Station on the Osaka Metro Sakaisuji Line, or a 5-minute walk from Exit 1 of Dobutsuen-mae Station on the Midosuji Line."}, {"address": "1-1-43 Abenosuji, Abeno Ward, Osaka, Osaka Prefecture", "feature": "\u2b50 4.6 stars | Located on floors 58 to 60 of Japan\u0027s tallest skyscraper, the ABENO HARUKAS 300 Observatory features a 360-degree glass-walled corridor. It offers unmatched views of Osaka Castle, Tsutenkaku Tower, and even Kansai International Airport. The stunning sunset and dazzling million-dollar night views make it a top Instagram backdrop. We highly recommend grabbing a signature ice cream at the 58th-floor sky garden and taking a photo in front of the giant \u0027H
