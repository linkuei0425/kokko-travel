or hours. The broth carries hints of saut\u00e9ed garlic and rich beef aromatics, while chewy noodles absorb the savory soup\u2014offering the ultimate classic taste of old Hanoi in every bite.", "name": "Ph\u1edf Th\u00ecn 139 \u0110\u1ed9i C\u1ea5n", "transport": "About a 12-minute walk or a 3-minute taxi ride from Ba \u0110\u00ecnh Square."}, {"address": "120 K1 Gi\u1ea3ng V\u00f5, Ch\u1ee3 D\u1eeba, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | An iconic traditional pan-fried fish (Ch\u1ea3 C\u00e1) restaurant in the Gi\u1ea3ng V\u00f5 area of Ba \u0110\u00ecnh District. Fresh boneless fish fillets marinated in turmeric and shallots are sizzled right at your table in a cast-iron skillet with generous dill and scallions. The mouthwatering aroma fuses with rice vermicelli, roasted peanuts, and savory shrimp paste to create an explosion of crispy, tender, and herbal flavors\u2014an exceptional choice to experience Hanoi\u0027s historic royal cuisine.", "name": "Ch\u1ea3 C\u00e1 Anh V\u0169", "transport": "About a 7-minute taxi ride from Ba \u0110\u00ecnh Square."}, {"address": "11 H\u00e0ng Than, Nguy\u1ec5n Trung Tr\u1ef1c, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A historic pastry shop dating back to 1865, located on H\u00e0ng Than Street in Ba \u0110\u00ecnh District. Its iconic green sticky rice cake (B\u00e1nh C\u1ed1m) features a soft, chewy outer skin made from young green rice flakes, filled with sweet, smooth mung bean paste and coconut shreds. Boasting subtle aromas of pandan leaves and fresh rice, it is an indispensable signature dessert for traditional Hanoi weddings and festivities.", "name": "B\u00e1nh C\u1ed1m Nguy\u00ean Ninh", "transport": "About a 5-minute taxi ride from the northeast side of the Imperial Citadel of Th\u0103ng Long."}, {"address": "18 Ng\u00f5 158 Ng\u1ecdc H\u00e0, Ng\u1ecdc H\u00e0, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A hidden local gem tucked away in an alley of Ng\u1ecdc H\u00e0 Street. It serves a refreshing broth simmered slowly with pork bones and tomatoes, loaded with chewy pork meatballs, tender pork trotters, and crunchy green taro stems (D\u1ecdc M\u00f9ng). The taro stems absorb the essence of the broth, bursting with juicy, tangy, and non-greasy flavors with every bite, showcasing the unique charm of authentic Hanoi home-style traditional street food.", "name": "B\u00fan D\u1ecdc M\u00f9ng 18 Ng\u1ecdc H\u00e0", "transport": "About an 8-minute walk from behind the Ho Chi Minh Mausoleum / Ba \u0110\u00ecnh Square."}, {"address": "16 D\u1ed1c H\u00f2e Nhai, Nguy\u1ec5n Trung Tr\u1ef1c, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | A famous traditional steamed rice roll shop located on the H\u00f2e Nhai slope in Ba \u0110\u00ecnh District. Using stone-ground rice batter, paper-thin, translucent rice sheets are freshly steamed on cloth, wrapped around wood-ear mushrooms and minced pork, and topped with crispy fried shallots. Paired with warm dipping fish sauce and Vietnamese pork sausage (Gi\u00f2 l\u1ee5a), every bite is silky, tender, and delicate\u2014making it a morning favorite packed with local foodies.", "name": "B\u00e1nh Cu\u1ed1n B\u00e0 Xu\u00e2n", "transport": "About a 10-minute walk from the north side of the Imperial Citadel of Th\u0103ng Long."}, {"address": "415 \u0110\u1ed9i C\u1ea5n, V\u0129nh Ph\u00fac, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | An old-school sticky rice shop on \u0110\u1ed9i C\u1ea5n Street, famous for its aromatic turmeric sticky rice (X\u00f4i X\u00e9o) and various braised meats. The glossy, chewy sticky rice is topped with smooth shaved mung bean paste, crispy fried shallots, and drizzled with fragrant chicken fat or braised pork gravy. Served with braised eggs and char siu, the rich savory-sweet flavors offer a deeply satisfying traditional meal beloved by locals.", "name": "X\u00f4i Hi\u1ec7p H\u00f2a", "transport": "About an 8-minute taxi ride from Ba \u0110\u00ecnh Square."}], "name": "Legendary Local Eateries"}, "cat_2": {"items": [{"address": "32 \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | C\u1ed9ng C\u00e0 Ph\u00ea is Vietnam\u0027s most iconic retro chain cafe, and this branch located on \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Street in Ba \u0110\u00ecnh District boasts a particularly rich historical vibe. The interior d\u00e9cor is themed around 1980s North Vietnamese military style, featuring dark green walls paired with vintage collectibles and old books that create a deep sense of nostalgia. The signature Coconut Milk Coffee (C\u00e0 Ph\u00ea C\u1ed1t D\u1eeba) and Coconut Green Tea are loved by tourists and locals alike; smooth, slushie-like coconut cream pairs with rich, bittersweet Vietnamese Robusta coffee for a velvety, perfectly balanced sip. Sitting in the outdoor covered porch while sipping coffee and gazing across at the Vietnam Military History Museum and Flag Tower is one of the best ways to take a relaxing break when exploring Ba \u0110\u00ecnh.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 Branch", "transport": "Located directly opposite the Vietnam Military History Museum, about a 5-minute walk from the south exit of the Imperial Citadel of Th\u0103ng Long."}, {"address": "14 Phan Huy \u00cdch, Nguy\u1ec5n Trung Tr\u1ef1c, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Tucked away in a quiet alleyway in Ba \u0110\u00ecnh District, Manzi is a hybrid art space and cafe housed in a restored early 20th-century French colonial villa. The first floor houses a cafe and independent bookstore, while the second floor is an exhibition space frequently hosting contemporary art shows, book launches, and intimate concerts. They serve high-quality pour-over coffees, freshly pulled espressos, and delicate European light brunch options like avocado smoked salmon sourdough toast and French croissants. Steeped in elegance and cultural depth, it is a beloved sanctuary for Hanoi\u0027s hipsters and local expats.", "name": "Manzi Art Space \u0026 Cafe", "transport": "About a 6-minute Grab taxi ride from Ba \u0110\u00ecnh Square, or a 12-minute walk from Tr\u1ea5n Qu\u1ed1c Pagoda."}, {"address": "21 Ng\u00f5 42 Giang V\u0103n Minh, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | C\u00e0 Ph\u00ea Y\u00ean is a dark horse in Hanoi\u0027s specialty coffee scene, taking the youth by storm with its signature cold brews and specialty lattes. Hidden in an alleyway in Ba \u0110\u00ecnh District, this branch features a minimalist industrial design accented with lush green plants, radiating a lively vibe. The all-time favorite \u0027Sapa Coffee\u0027 blends high-quality Vietnamese coffee beans with rich milk and vanilla flavors, delivering a silky-smooth, perfectly harmonious drink. Paired with a freshly baked croissant or Basque cheesecake, it offers an authentically modern Hanoi-style morning.", "name": "C\u00e0 Ph\u00ea Y\u00ean - Giang V\u0103n Minh Branch", "transport": "About a 7-minute Grab ride from Ba \u0110\u00ecnh Square, or a 12-minute walk from Ho Chi Minh Museum."}, {"address": "91B Phan \u0110\u00ecnh Ph\u00f9ng, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Hailed by The New York Times as \u0027the best bean-to-bar chocolate,\u0027 Maison Marou opened a gorgeous flagship store along Hanoi\u0027s most beautiful tree-lined street, Phan \u0110\u00ecnh Ph\u00f9ng. Housed in a converted French colonial heritage building, it not only serves premium chocolate crafted from top-tier Vietnamese cocoa beans, but also offers impressive brunch and coffee menus. Try their signature cocoa-infused coffee paired with freshly made croissants, quiches, or hot chocolate waffles. The sunlit glasshouse area and elegant outdoor courtyard let you immerse yourself in the rich aroma of chocolate while soaking in the romantic French leisure unique to Ba \u0110\u00ecnh.", "name": "Maison Marou Phan \u0110\u00ecnh Ph\u00f9ng", "transport": "Located on Phan \u0110\u00ecnh Ph\u00f9ng Boulevard, just a 3-minute walk from the North Gate (B\u1eafc M\u00f4n) of the Imperial Citadel of Th\u0103ng Long."}, {"address": "12 \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | All Day Coffee creates a cozy British conservatory vibe with its warm red-brick exterior, wooden furnishings, and soft lighting, making it a highly popular spot for brunch and specialty coffee in Ba \u0110\u00ecnh. It offers a rich variety of European brunch items, including generous English full breakfasts, strawberry cream waffles, and pressed paninis. For coffee, their Egg Coffee is strongly recommended; the golden, silky egg cream is as sweet and velvety as mousse without any fishiness, blending with rich black coffee for an unforgettable depth of flavor.", "name": "All Day Coffee - \u0110\u1ed9i C\u1ea5n Branch", "transport": "Located at the start of \u0110\u1ed9i C\u1ea5n Street, near the Ho Chi Minh Museum and One Pillar Pagoda, about a 6-minute walk away."}, {"address": "23 L\u00ea H\u1ed3ng Phong, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | If you want to experience Hanoi\u0027s authentic street stool coffee culture in a clean, comfortable environment, Kafa Caf\u00e9 is an excellent choice. Located on an elegant tree-lined avenue in Ba \u0110\u00ecnh District, this branch features spacious covered sidewalk seating. They specialize in traditional Vietnamese phin filter coffee (C\u00e0 Ph\u00ea Phin), iced condensed milk coffee, and freshly blended fruit smoothies. Sitting on iconic little bamboo stools, sipping rich iced condensed milk coffee while watching the leafy streets and bustling crowds, offers a true taste of Hanoi\u0027s relaxed daily coffee life.", "name": "Kafa Caf\u00e9 - L\u00ea H\u1ed3ng Phong Branch", "transport": "Located near the intersection of L\u00ea H\u1ed3ng Phong and Tr\u1ea7n Ph\u00fa streets, just a 5-minute walk from the south side of Ba \u0110\u00ecnh Square."}, {"address": "19 \u0110\u1eb7ng Dung, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Dreamers is a hidden gem blending exquisite French pastries with aesthetic cafe culture, beloved by local women and tourists alike. The interior features Nordic minimalist white and wooden tones complemented by abundant natural light and fresh greenery. The menu spotlights fresh daily French tarts, mille-feuille cakes, and delicate quiches, paired with selected single-origin pour-over coffees or herbal teas. The desserts are wonderfully layered with perfectly balanced sweetness\u2014especially the matcha mille-feuille and lemon tart\u2014making it an elegant, guilt-free afternoon tea treat after strolling through the Imperial Citadel of Th\u0103ng Long.", "name": "Dreamers Dessert \u0026 Coffee", "transport": "About an 8-minute walk from the North Gate of the Imperial Citadel of Th\u0103ng Long, or take a bus and get off at the Qu\u00e1n Th\u00e1nh stop."}, {"address": "9A Tr\u1ea7n Ph\u00fa, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Nestled under the shade of trees along Tr\u1ea7n Ph\u00fa Street, L\u1ed1i C\u0169 Cafe (meaning \u0027Old Road\u0027) is a retro cafe full of vintage Hanoi charm. Housed in a classic French-style residence featuring yellow walls and weathered wooden window frames, the interior is decorated with 1970s radios, black-and-white TVs, and antique furniture. Signature offerings include traditional Hanoi Egg Coffee and Salt Coffee (C\u00e0 Ph\u00ea Mu\u1ed1i)\u2014where a slightly salty milk foam perfectly balances condensed milk sweetness and coffee bitterness, delivering a delightfully smooth taste. The outdoor seating under tree cover makes it a lovely spot to slow down and savor peaceful Hanoi vibes after visiting Ba \u0110\u00ecnh Square and the Imperial Citadel.", "name": "L\u1ed1i C\u0169 Cafe - Tr\u1ea7n Ph\u00fa Branch", "transport": "Located on Tr\u1ea7n Ph\u00fa Street, about a 4-minute walk from the south entrance of the Imperial Citadel of Th\u0103ng Long and the Vietnam Military History Museum."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "101 Ch\u00e2u Long, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Housed in a yellow French colonial villa in the prime area of Ba Dinh District, this restaurant seamlessly blends classic Vietnamese dishes with fine dining and wine. Signature dishes like \"Braised Seafood in Lemongrass and Coconut Milk\" and \"Vietnamese Herb Roasted Duck\" feature tender meat infused with rich herbal aromas, offering rich layers of flavor. The elegant nostalgic atmosphere and warm service make it a favorite gathering spot for tourists and local trendsetters alike.", "name": "HOME Hanoi Restaurant", "transport": "Take a Grab or taxi to the intersection of Ch\u00e2u Long and Nguy\u1ec5n Tr\u01b0\u1eddng T\u1ed9 streets; about a 5-minute walk from Tr\u00fac B\u1ea1ch Lake."}, {"address": "37 H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Adjacent to Ba Dinh Square and the National Assembly Building, this is one of Hanoi\u0027s most iconic high-end local cuisine restaurants. It serves authentic Northern Vietnamese royal court and traditional home-style dishes, with special recommendations including \"Ancient Recipe Grilled Herb Fish\" and \"Vietnamese Golden Soup Sea Cucumber.\" The broths are sweet, rich, and made with meticulously selected ingredients. Featuring an elegant and grand ambiance steeped in Northern Vietnamese history, it is highly favored by business travelers and fine-dining connoisseurs.", "name": "37 H\u00f9ng V\u01b0\u01a1ng Restaurant", "transport": "About a 6-minute walk from Ba Dinh Square, located on the main H\u00f9ng V\u01b0\u01a1ng avenue."}, {"address": "120 K1 Gi\u1ea3ng V\u00f5, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A famous local spot near Gi\u1ea3ng V\u00f5 Lake in Ba Dinh District, specializing in authentic snakehead fish hotpot (Ch\u1ea3 C\u00e1). Fresh golden chunks of snakehead fish are sizzled in hot oil with plenty of dill and scallions. The fish is crispy outside, tender inside, bouncy, and completely free of fishiness. Paired with shrimp paste, peanuts, and rice vermicelli, every bite is a flavor explosion. This classic century-old Hanoi specialty is served here to high standards, attracting a steady stream of local foodies and tourists.", "name": "Ch\u1ea3 C\u00e1 Anh V\u0169", "transport": "Take the bus to Gi\u1ea3ng V\u00f5 stop, then walk about 3 minutes to arrive."}, {"address": "1 Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.0 stars | Located on the breezy lakeside at the border of Ba Dinh District and West Lake, this restaurant holds a collective culinary memory for generations of Hanoians. The signature \"West Lake Fried Shrimp Cakes\" feature sweet little freshwater shrimp fried shell-on in batter until golden and crispy. Paired with fresh lettuce, herbs, and pickled radish soaked in sweet and sour fish sauce, the crunch is delightfully refreshing and non-greasy\u2014a fantastic local experience while enjoying lakeside views.", "name": "B\u00e1nh T\u00f4m H\u1ed3 T\u00e2y", "transport": "Take bus 33 or 50 to Ch\u00f9a Tr\u1ea5n Qu\u1ed1c (Tr\u1ea5n Qu\u1ed1c Pagoda) stop; located right along Thanh Ni\u00ean Avenue."}, {"address": "14 Phan Huy \u00cdch, Nguy\u1ec5n Trung Tr\u1ef1c, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Housed in a converted 1920s French villa, this artsy bistro combines contemporary art exhibitions with refined light meals. It offers unique craft beers, custom cocktails, homemade appetizers infused with Vietnamese spices, and flatbreads. The spiced Vietnamese baguette bites, crispy outside and soft inside, complement the custom passion fruit cocktail perfectly. Its hip, artistic vibe attracts countless travelers who love art and quiet atmospheres.", "name": "Manzi Art Space \u0026 Bistro", "transport": "Tucked in a quiet alley on Phan Huy \u00cdch; about a 12-minute walk from the northeast side of the Imperial Citadel of Th\u0103ng Long."}, {"address": "5 Phan K\u1ebf B\u00ednh, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Vietnam\u0027s legendary Japanese wood-fired pizza bistro. The Ba Dinh branch blends lush greenery with modern industrial design. It highlights fresh house-made Burrata cheese from their own farm, paired with Vietnamese fusion creations like \"House-cured Beef Pizza\" or \"Salted Egg Yolk Shrimp Spaghetti.\" With chewy, crispy crusts, bursting creamy cheese, and a cold craft beer, it\u0027s a top culinary feast beloved by local youth and expats alike.", "name": "Pizza 4P\u0027s Phan K\u1ebf B\u00ednh", "transport": "Take a Grab to Phan K\u1ebf B\u00ednh Street; near the Japanese Embassy and Lotte Center, about an 8-minute walk."}, {"address": "1 Phan \u0110\u00ecnh Ph\u00f9ng, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located on Hanoi\u0027s most beautiful tree-lined street, Phan \u0110\u00ecnh Ph\u00f9ng, this restaurant specializes in traditional Northern Vietnamese home-style dishes and classic banquets. Must-try items like the \"Vietnamese Sweet and Sour Seafood Soup\" and \"Pan-fried Taro Cake\" showcase old-school Hanoi flavors at their finest. Featuring rustic wooden decor, diners can gaze through the windows at the century-old trees outside\u2014a dual feast for the eyes and palate.", "name": "M\u00f3n Ngon H\u00e0 N\u1ed9i - Phan \u0110\u00ecnh Ph\u00f9ng", "transport": "Located at the intersection of Phan \u0110\u00ecnh Ph\u00f9ng and H\u00e0ng C\u00f3t streets; only a 5-minute walk from the North Gate of the Imperial Citadel of Th\u0103ng Long."}, {"address": "F5, Lotte Center, 54 Li\u1ec5u Giai, C\u1ed1ng V\u1ecb, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A highly rated regional restaurant located inside the iconic Lotte Center in Ba Dinh District, specializing in royal and folk flavors from Hu\u1ebf in Central Vietnam. The signature \"B\u00fan B\u00f2 Hu\u1ebf\" features a broth simmered from lemongrass and beef bones, richly spiced and aromatic. Don\u0027t miss the delicate \"Tapioca Dumplings (B\u00e1nh B\u1ed9t L\u1ecdc)\", with a chewy skin filled with savory shrimp for rich layers of texture. Modern and comfortable, it\u0027s a premier choice for tasting traditional Central Vietnamese cuisine.", "name": "N\u00e9t Hu\u1ebf - Lotte Center Ba \u0110\u00ecnh", "transport": "Take bus 09A, 25, or 38 to Lotte Center stop, then take the elevator up to the 5th-floor food court area."}], "name": "Specialty Bistro \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "4 \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | A highly popular and refined vegetarian buffet in Hanoi, offering dozens of freshly prepared traditional Vietnamese vegetarian dishes and delicate desserts daily. The freshly fried vegetarian spring rolls are wonderfully crispy, stuffed with savory shiitake mushrooms, wood ear fungus, and glass noodles for a satisfying bite. Their piping hot vegetarian ph\u1edf features a sweet, clear vegetable broth with zero oiliness\u2014highly recommended by local vegetarians and travelers alike.", "name": "Vegito Vegetarian Buffet (\u0110\u1ed9i C\u1ea5n)", "transport": "Take a Grab or bus routes 09A or 14CT to the 09 \u0110\u1ed9i C\u1ea5n stop, then walk about 2 minutes."}, {"address": "26 Ch\u00e2u Long, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Tucked away in a quiet alley in the Ba \u0110\u00ecnh District, this Zen-inspired upscale vegetarian restaurant specializes in high-quality, healthy vegetarian cuisine free of added MSG. The signature Mushroom Tofu Claypot features silky tender tofu simmered with a rich secret sauce and an array of fresh mushrooms, creating a deeply aromatic flavor profile. With its tranquil ambiance and artistic presentation, it is the top choice for a refined vegetarian dining experience near Ba \u0110\u00ecnh Square.", "name": "Aummee Vegetarian Restaurant", "transport": "Take bus routes 31 or 50 to the 115 Ch\u00e2u Long stop, then walk about 3 minutes."}, {"address": "147 Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | A popular branch of the globally renowned vegetarian chain located in Ba \u0110\u00ecnh, offering authentic and affordable Vietnamese plant-based snacks. The Vegetarian B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Chay) comes highly recommended\u2014crispy freshly toasted bread packed with fresh herbs, house-made vegan ham, and tangy pickled daikon and carrots. Loved by backpackers for its vibrant flavors, budget-friendly prices, and friendly service.", "name": "Loving Hut Qu\u00e1n Th\u00e1nh", "transport": "Take bus routes 14CT, 22A, or 50 to the 180 Qu\u00e1n Th\u00e1nh stop, then walk about 1 minute."}, {"address": "204 \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | An affordable and generous vegan buffet beloved by local office workers and tourists alike. Their specialty vegan skewers are brushed with a savory golden sauce and grilled to subtle perfection, offering a delightfully chewy texture. Paired with crisp, refreshing green papaya salad and freshly made vegetable soup, it delivers a comforting home-cooked Hanoi flavor that is both healthy and filling.", "name": "Peace Vegan (\u0110\u1ed9i C\u1ea5n)", "transport": "Take bus routes 09A or sticky rice is paired with refreshing, creamy vanilla-coconut ice cream and topped with crunchy toasted coconut flakes. The contrast between warm and icy temperatures creates a surprisingly delicious, well-balanced treat\u2014the perfect refreshing snack while strolling through Ba Dinh.", "name": "Thu Nga Sticky Rice Ice Cream (Kem X\u00f4i Thu Nga)", "transport": "Take bus route 08 or 22A to Nguy\u1ec5n Tr\u01b0\u1eddng T\u1ed9 station, then walk about 1 minute."}, {"address": "415 \u0110\u1ed9i C\u1ea5n, V\u0129nh Ph\u00fac, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located on \u0110\u1ed9i C\u1ea5n Street, this famous traditional sticky rice stall is a fantastic place to experience Hanoi\u0027s hearty street food. Perfectly steamed, chewy mung bean sticky rice is topped with melt-in-your-mouth braised pork belly, rich p\u00e2t\u00e9, fried egg, and Vietnamese sausage, finished with a drizzle of savory braising gravy. Packed with rich, savory layers of flavor, it is a big favorite among local food lovers.", "name": "Hiep Hoa Savory Sticky Rice (X\u00f4i Hi\u1ec7p H\u00f2a)", "transport": "Take bus route 09A or 144 to \u0110\u1ed9i C\u1ea5n station."}, {"address": "12 H\u00e0ng Than, Nguy\u1ec5n Trung Tr\u1ef1c, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Located on H\u00e0ng Than Street in Ba Dinh District, this century-old brand specializes in \u0027B\u00e1nh C\u1ed1m\u0027 (green young rice cake), an iconic traditional Hanoi pastry. Made from fresh young green rice harvested in autumn using traditional techniques, it is filled with sweet, velvety mung bean paste and shredded coconut. Chewy, soft, slightly sweet with a subtle grassy aroma, it is a classic street snack and a must-buy souvenir for tourists.", "name": "Bao Minh Green Rice Cake (B\u00e1nh C\u1ed1m B\u1ea3o Minh)", "transport": "Take the bus and get off at Y\u00ean Ph\u1ee5 station, then walk about 4 minutes."}, {"address": "16 Ng\u cuss Hanoi\u0027s iconic cuisine without mentioning traditional beef ph\u1edf, and this L\u00fd Qu\u1ed1c S\u01b0 branch in C\u1ea7u Gi\u1ea5y carries on decades of culinary legacy. The broth is slow-simmered for over ten hours using generous amounts of beef bones, resulting in a clear, pure soup infused with deep beef aromas and natural sweetness. Freshly sliced rare beef cooks to a tender pink the moment the scalding broth is poured over it, yielding juicy, melt-in-your-mouth perfection. Paired with chewy rice noodles and a liberal handful of chopped green onions, every bite delivers authentic Hanoi flavor\u2014making it a daily breakfast and lunch staple for local professionals and foodies alike.", "name": "Ph\u1edf L\u00fd Qu\u1ed1c S\u01b0 - C\u1ea7u Gi\u1ea5y", "transport": "Take bus 26, 28, or 38 to the 48 Nguy\u1ec5n Phong S\u1eafc stop, then walk about 2 minutes."}, {"address": "48 Nguy\u1ec5n Phong S\u1eafc, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | B\u00fan Ch\u1ea3 Sinh T\u1eeb is a historic Hanoi brand for grilled pork rice noodles, featuring a spacious, modern branch in the C\u1ea7u Gi\u1ea5y commercial district. Its signature lies in using fresh pork marinated according to a secret traditional recipe, slowly charcoal-grilled until golden brown with caramelized edges, filling every bite with delightful smoky aroma and rich juices. Served alongside a sweet and tangy warm fish sauce dipping bowl, fresh herbs, crisp green papaya slices, and silky rice vermicelli dipped into the broth, the multi-layered texture is immensely satisfying yet light\u2014a top favorite among both tourists and locals.", "name": "B\u00fan Ch\u1ea3 Sinh T\u1eeb - Nguy\u1ec5n Phong S\u1eafc", "transport": "Take bus 26, 28, or 38 to the 48 Nguy\u1ec5n Phong S\u1eafc stop, then walk about 1 minute."}, {"address": "Nh\u00e0 A2, Khu t\u1eadp th\u1ec3 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars eet, this crab paste noodle shop is a decades-old gem highly recommended by local residents. The broth is simmered from crushed fresh paddy crabs to form a vibrant reddish, sweet-and-sour soup accented by natural tomato tang and rich seafood sweetness. The bowl is packed with juicy fried tofu puff, tender crab paste cakes, and handmade meatballs that burst with flavorful broth upon every bite. Paired with shredded raw greens and fresh mint leaves, it offers a light, refreshing meal that stands as a must-try classic Hanoi noodle staple.", "name": "B\u00fan Ri\u00eau Cua T\u00f4 Hi\u1ec7u", "transport": "Take bus 28 or 38 to the T\u00f4 Hi\u1ec7u stop, then walk about 3 minutes."}, {"address": "105 C3 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Inheriting traditional culinary techniques from Hanoi\u0027s Old Quarter, this historic sticky rice and sweet soup dessert shop enjoys immense popularity in the Ngh\u0129a T\u00e2n area. The signature green bean sticky rice features premium glutinous rice steamed to fluffy perfection, topped with a thick layer of silky mashed green beans and crispy fried shallots, finished with a drizzle of savory chicken fat for a luscious aroma. Additionally, the traditional mung bean soup and lotus seed sweet soup are exquisite\u2014sweet without being cloying and silky smooth, making this an essential stop to experience Hanoi\u0027s traditional dessert culture.", "name": "X\u00f4i Ch\u00e8 B\u00e0 Th\u00ecn - Ngh\u0129a T\u00e2n", "transport": "Take bus 14CT or 28 to the Ngh\u0129a T\u00e2n stop, then walk about 4 minutes."}, {"address": "101 A15 T\u00f4 Hi\u1ec7u, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 Stars | Setting itself apart from standard Hanoi-style steamed rice rolls served with fish sauce, this legendary spot specializes in Cao B\u1eb1ng-style rice rolls served dipped in a rich, warm pork bone broth. Paper-thin yet delightfully springy steamed rice sheets enclose savory saut\u00e9ed minced pork and wood ear mushrooms. Dipping the rolls into hot broth topped with scallions and Vietnamese pork sausage creates a soothing blend of sweet rice aroma and savory meat juices\u2014a uniquely comforting warm delicacy especially popular on cool days.", "name": "B\u00e1nh Cu\u1ed1n Cao B\u1eb1ng - T\u00f4 Hi\u1ec7u", "transport": "Take bus 28 or 38 to the T\u00f4 Hi\u1ec7u stop, then walk about 3 minutes."}, {"address": "12 Nguy\u1ec5n Ho\u00e0ng, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Located near the modern M\u1ef9 \u0110\u00ecnh commercial hub, B\u00fan B\u00f2 Hu\u1ebf Tr\u1ea7m brings the authentic flavors of Central Vietnam\u0027s classic Hu\u1ebf dish to Hanoi. The broth is long-simmered with beef bones, fresh lemongrass, and fermented shrimp paste, creating an enticing deep-red color with a bold, spicy, and fragrant herbal broth. Generously topped with tender beef shank slices, chewy pork trotters, rich blood pudding, and handmade beef balls, the thick rice noodles absorb the spicy and aromatic soup fully, delivering a immensely satisfying bowl loved by locals and expats alike.", "name": "B\u00fan B\u00f2 Hu\u1ebf Tr\u1ea7m - M\u1ef9 \u0110\u00ecnh", "transport": "Take bus 05, 16, 29, or 30 to M\u1ef9 \u0110\u00ecnh Bus Station (B\u1ebfn xe M\u1ef9 \u0110\u00ecnh), then walk about 5 minutes."}], "name": "Iconic Local Eateries"}, "cat_2": {"items": [{"address": "101 D8 Tr\u1ea7n Th\u00e1i T\u00f4ng, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A popular cafe filled with nostalgic military style and retro vibes. The classic must-try is the Coconut Smoothie Coffee (C\u00e0 ph\u00ea c\u1ed1t d\u1eeba), where rich, velvety coconut slushie seamlessly blends with dark-roast Vietnamese coffee to deliver a perfectly balanced sweet and bitter flavor. Paired with freshly toasted bread and condensed milk, it offers an authentic local brunch experience.", "name": "Cong Caphe (Tr\u1ea7n Th\u00e1i T\u00f4ng)", "transport": "Take bus 26, 34, or 38 to Tr\u1ea7n Th\u00e1i T\u00f4ng station, then walk for about 3 minutes."}, {"address": "2A H\u1ed3 T\u00f9ng M\u1eadu, Mai D\u1ecbch, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | An iconic Instagram-worthy Korean-style scenic cafe in the C\u1ea7u Gi\u1ea5y District, featuring stunning views and abundant natural light. The cafe serves delicate brunch platters, freshly made waffles, and various fruit teas. The pressed toasts, with crispy exteriors and rich, oozing cheese fillings, are hugely popular among young people and students.", "name": "Lofita Tea \u0026 Coffee - H\u1ed3 T\u00f9ng M\u1eadu", "transport": "Take bus 16, 20A, or 32 to 2A H\u1ed3 T\u00f9ng M\u1eadu station, then walk for about 1 minute."}, {"address": "259 Tr\u1ea7n \u0110\u0103ng Ninh, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | One of Vietnam\u0027s iconic modern chain cafes, offering a bright and spacious setting ideal for working or catching up with friends. Signature drinks like Peach Vanilla Tea and cold brew are smooth and refreshing. Paired with freshly baked French croissants or egg tarts\u2014crispy outside, soft inside, with a rich buttery aroma\u2014it is a popular pick for a relaxing brunch.", "name": "The Coffee House - Tr\u1ea7n \u0110\u0103ng Ninh", "transport": "Take bus 28 or 39 to Tr\u1ea7n \u0110\u0103ng Ninh station, then walk for about 2 minutes."}, {"address": "102 C9 Tr\u1ea7n Th\u00e1i T\u00f4ng, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | A popular coffee chain known for its open-air, street-side seating style, deeply favored by local office workers. The signature iced milk coffee (C\u00e0 ph\u00ea s\u1eefa \u0111\u00e1) is rich and bold, featuring deep nutty undertones and caramel sweetness. Enjoying it alongside a simple banh mi or mung bean cake offers an authentic taste of Hanoi\u0027s modern street coffee culture.", "name": "Aha Caf\u00e9 - Tr\u1ea7n Th\u00e1i T\u00f4ng", "transport": "Take bus 26 or 34 to Tr\u1ea7n Th\u00e1i T\u00f4ng station, then walk for about 3 minutes."}, {"address": "91 Tr\u1ea7n Duy H\u01b0ng, Trung H\u00f2a, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Flagship store of Vietnam\u0027s premium chocolate brand, dubbed by The New York Times as \u0027The Best Chocolate You\u0027ve Never Tasted\u0027. Beyond their signature hot chocolate and specialty pour-over coffee, the extensive brunch pastries\u2014such as chocolate croissants, French tarts, and gourmet sandwiches\u2014are exceptional, featuring flaky, buttery layers and ultimate crispness.", "name": "Maison Marou - Tr\u1ea7n Duy H\u01b0ng", "transport": "Take bus 50, 60A, or 107 to Tr\u1ea7n Duy H\u01b0ng station, then walk for about 4 minutes."}, {"address": "Ng\u00f5 68 C\u1ea7u Gi\u1ea5y, S\u1ed1 4 Ng\u00e1ch 78, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | A quaint retro cafe hidden deep in an alley of C\u1ea7u Gi\u1ea5y District, adorned with traditional North Vietnamese red brick walls and antique decor. Their signature Egg Coffee (C\u00e0 ph\u00ea tr\u1ee9ng) boasts a fine, velvety custard-like foam that is rich without any fishiness, perfectly balancing the dark coffee below. Enjoyed with a plate of roasted sunflower seeds and hot tea, it radiates a poetic, indie vibe.", "name": "Caf\u00e9 Cu\u1ed1i Ng\u00f5 - C\u1ea7u Gi\u1ea5y", "transport": "Take bus 09B, 16, or 20A to C\u1ea7u Gi\u1ea5y station, turn into Alley 68 (Ng\u00f5 68), and walk for about 5 minutes."}, {"address": "T\u1ea7ng 1, Keangnam Hanoi Landmark Tower, Ph\u1ea1m H\u00f9ng, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | An upscale Korean bakery cafe located inside Keangnam Landmark 72 in M\u1ef9 \u0110\u00ecnh, highly favored by business professionals and Korean expats for brunch. Freshly baked daily quiches, garlic butter bread, and rich, dense cheesecakes pair wonderfully with high-quality espresso lattes, delivering an elegant and relaxing morning experience.", "name": "Tous Les Jours - Keangnam Landmark 72", "transport": "Take bus 21B, 33, 44, or 50 to Keangnam station and enter the building\u0027s 1st floor."}, {"address": "T\u1ea7ng 1, Keangnam Landmark 72, Ph\u1ea1m H\u00f9ng, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A central spot for relaxation in the modern M\u1ef9 \u0110\u00ecnh commercial district, featuring high ceilings and comfy seating. Serving international-standard specialty coffee along with local limited-edition drinks, it also offers rich brunch options such as pressed beef \u0026 cheese paninis and pancakes. Savory and delicious, it is the perfect place for business chats or a leisure break.", "name": "Starbucks - Keangnam Landmark 72", "transport": "Take bus 21B, 33, or 50 to Keangnam station, then walk 2 minutes to enter the building\u0027s 1st floor."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1, Alley 62 Tr\u1ea7n Th\u00e1i T\u00f4ng, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Tucked away in a vibrant alley in the C\u1ea7u Gi\u1ea5y District, Pao Qu\u00e1n is famous for recreating the authentic bamboo and wooden charm of the Northwestern Vietnam highlands. It specializes in unique local Northwestern dishes such as fragrant grilled wild boar, herb-roasted chicken, and signature bamboo-tube rice. The meats are tender, infused with rich herbal and charcoal aromas, perfectly complemented by homemade wild fruit wines and specialty liquors. Surrounded by lush greenery and peaceful water ponds, this rustic wooden venue immerses both tourists and local office workers in a rich, traditional Vietnamese countryside atmosphere.", "name": "Pao Qu\u00e1n - Tr\u1ea7n Th\u00e1i T\u00f4ng (Northwestern Vietnamese Cuisine)", "transport": "Take a Grab taxi to the entrance of Alley 62, Tr\u1ea7n Th\u00e1i T\u00f4ng Street."}, {"address": "259 T\u00f4 Hi\u1ec7u, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located on the bustling T\u00f4 Hi\u1ec7u food street in C\u1ea7u Gi\u1ea5y, G\u00f3c H\u00e0 N\u1ed9i is a hugely popular local eatery that serves classic Hanoi street food and hot dishes on exquisite round bamboo platters (\u0027M\u1eb9t\u0027). The signature \u0027Hanoi Combo Platter\u0027 features pan-fried fish fillets, fried spring rolls, grilled pork patties, and special cilantro dipping sauce. Crispy on the outside and tender juicy inside, each bite delivers a flawless balance of sweet, sour, salty, and savory flavors. Decorated with yellow walls and wooden windows reminiscent of old Hanoi, the restaurant offers a warm, inviting atmosphere that beautifully showcases local dining culture.", "name": "G\u00f3c H\u00e0 N\u1ed9i - T\u00f4 Hi\u1ec7u (Old Hanoi Flavor Restaurant)", "transport": "Take bus No. 28 or 38 to T\u00f4 Hi\u1ec7u Stop, then walk for about 3 minutes."}, {"address": "2 Hoa B\u1eb1ng, Y\u00ean Ho\u00e0, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Designed to recreate the streetscapes of 1980s old Hanoi, B\u00f2 T\u01a1 Qu\u00e1n M\u1ed9c is a specialty bistro that combines nostalgic retro aesthetics with refined local beef dishes. The restaurant uses extremely tender young beef, cooked in various styles such as steaming, stewing, lemon-cured salads, or charcoal grilling. Thinly sliced tender beef dipped in special shrimp paste or soy sauce offers a sweet, juicy, and bouncy bite. It pairs wonderfully with local Vietnamese beer or white wine, making it a favorite spot for family gatherings and business dinners.", "name": "B\u00f2 T\u01a1 Qu\u00e1n M\u1ed9c - Hoa B\u1eb1ng (Retro Veal \u0026 Beef Bistro)", "transport": "Take a Grab taxi to the intersection of Hoa B\u1eb1ng and Nguy\u1ec5n Kang Streets."}, {"address": "99 L\u00ea \u0110\u1ee9c Th\u1ecd, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Situated near the M\u1ef9 \u0110\u00ecnh National Stadium commercial area, iBiero is an original Vietnamese craft beer bistro that infuses local ingredients\u2014such as red mac khen pepper and indigenous herbs\u2014into its brewing process. It offers a wide selection of top-notch craft beers along with creative Vietnamese fusion dishes, such as grilled salt \u0026 pepper lamb chops, spicy grilled fish, and Vietnamese bar bites. The juicy meats paired with fruity or floral beers create a brilliant culinary taste. The modern and stylish interior attracts many expat professionals and young locals.", "name": "iBiero Craft Beer Station - L\u00ea \u0110\u1ee9c Th\u1ecd", "transport": "Take bus No. 26 or 84 to L\u00ea \u0110\u1ee9c Th\u1ecd Stop, then walk for about 2 minutes."}, {"address": "25T2 Ho\u00e0ng \u0110\u1ea1o Th\u00fay, Trung Ho\u00e0, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located at the boundary between C\u1ea7u Gi\u1ea5y and the emerging Trung Ho\u00e0 commercial area, Qu\u00e1n \u0102n Ngon brings together traditional street foods from all across Vietnam into a spacious, modern garden setting. Diners can taste classic Northern grilled pork vermicelli (B\u00fan Ch\u1ea3), Southern Vietnamese crispy pancakes (B\u00e1nh X\u00e8o), and Central Hue beef noodle soup all in one place. The made-to-order sizzling pancakes feature an ultra-crispy crust filled with fresh shrimp and bean sprouts; wrapped in fresh lettuce and dipped in fish sauce, they offer a rich, refreshing bite. It\u0027s a premier dining choice for first-time visitors looking to experience Vietnam\u0027s diverse culinary culture.", "name": "Qu\u00e1n \u0102n Ngon - Ho\u00e0ng \u0110\u1ea1o Th\u00fay", "transport": "Take bus No. 60A or 60B to Ho\u00e0ng \u0110\u1ea1o Th\u00fay Stop."}, {"address": "20 Nguy\u1ec5n V\u0103n Huy\u00ean, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Located in C\u1ea7u Gi\u1ea5y, this stylish restaurant elevates Hanoi\u0027s classic iconic dish, Ch\u1ea3 C\u1ea3 (turmeric grilled fish), to a sophisticated bistro experience. Boneless fresh snakehead fish chunks are marinated in dill and turmeric, then pan-fried tableside until golden and crispy alongside generous amounts of fresh dill and scallions. Crispy on the outside and tender inside, the fish is highly aromatic. Served with rice vermicelli, crushed peanuts, and special fermented shrimp paste or fish sauce, and accompanied by a refreshing Vietnamese cocktail or draft beer, it is an iconic Hanoi dining feast.", "name": "Ch\u1ea3 C\u1ea3 H\u00e0 Th\u00e0nh - Nguy\u1ec5n V\u0103n Huy\u00ean", "transport": "Take bus No. 07 or 38 to Nguy\u1ec5n V\u0103n Huy\u00ean Stop, then walk for about 3 minutes."}, {"address": "100 D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | L\u1ea9u \u0110\u1ee9c Tr\u1ecdc is an immensely popular local bistro serving stir-fries and hotpots near M\u1ef9 \u0110\u00ecnh and C\u1ea7u Gi\u1ea5y, radiating the lively energy of Vietnamese \u0027Nh\u1eadu\u0027 (drinking \u0026 dining) culture. Its signature spicy-sour seafood hotpot and Thai-style spicy beef hotpot feature rich, savory broths paired with abundant fresh vegetables and meat platters. A wide variety of Vietnamese stir-fries, such as salt \u0026 pepper soft-shell crab and charcoal-grilled pork ribs, make perfect bar snacks. The crispy-yet-tender meats and bold flavors invite you to enjoy cold beers alongside great food, making it extremely popular among local university students and office workers.", "name": "L\u1ea9u \u0110\u1ee9c Tr\u1ecdc - D\u1ecbch V\u1ecdng H\u1eadu (Hotpot \u0026 Stir-fry Bistro)", "transport": "Take a Grab taxi to 100 D\u1ecbch V\u1ecdng H\u1eadu Street."}, {"address": "105B C3 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | Originating in the Ngh\u0129a T\u00e2n area of C\u1ea7u Gi\u1ea5y, C\u1ed9t \u0110i\u1ec7n Qu\u00e1n is an affordable cozy bistro that popularized the classic Vietnamese street food \u0027Skillet B\u00e1nh M\u00ec\u0027 (B\u00e1nh M\u00ec Ch\u1ea3o). A sizzling cast-iron skillet comes loaded with marinated beef slices, pan-fried pate, sunny-side-up eggs, and a rich signature sauce. Dipping warm, crispy-on-the-outside, soft-on-the-inside French baguettes into the runny egg yolk and savory sauce offers a velvety, intensely satisfying taste. Paired with a glass of iced Vietnamese lemon tea or beer, it is both delicious and budget-friendly.", "name": "C\u1ed9t \u0110i\u1ec7n Qu\u00e1n - Ngh\u0129a T\u00e2n (Skillet B\u00e1nh M\u00ec Bistro)", "transport": "Take bus No. 13 or 22A to Ngh\u0129a T\u00e2n Market Stop, then walk for about 4 minutes."}], "name": "Featured Bistros \u0026 Local Specialties"}, "cat_4": {"items": [{"address": "70 V\u0169 Ph\u1ea1m H\u00e0m, Y\u00ean H\u00f2a, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Embracing a bohemian vintage vibe, this all-you-can-eat vegetarian buffet is hugely popular among local youth and foreign tourists for its incredible value. Every day, the kitchen serves over a dozen exquisite vegetarian stir-fries, traditional Vietnamese salads, and specialty soups. Don\u0027t miss the vegetarian rice noodle soup\u2014the broth is slow-simmered with plenty of fruits and vegetables for a subtle sweet taste infused with a hint of lemongrass aroma. The crispy vegetarian spring rolls feature delicate, crunchy wrappers stuffed with wood ear mushrooms, shiitake, and taro, offering a delightful crunch and rich layers of flavor with every bite.", "name": "Veggie Castle - Veggie Buffet V\u0169 Ph\u1ea1m H\u00e0m", "transport": "Take a Grab or taxi to V\u0169 Ph\u1ea1m H\u00e0m Street, located near the emerging Trung H\u00f2a - C\u1ea7u Gi\u1ea5y residential area."}, {"address": "109 Tr\u1ea7n Qu\u1ed1c V\u01b0\u1ee3ng, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Located near the student hub in C\u1ea7u Gi\u1ea5y District, this budget-friendly vegetarian buffet is a favorite among local office workers and students. Famous for its vegetarian braised beef soup and deep-fried specialties, the plant-based meats are wonderfully tender and absorb the rich juices, paired with fresh basil and greens for a crisp, light bite. The dessert bar\u0027s traditional Vietnamese sweet soup (Ch\u00e8) is the true highlight\u2014rich coconut milk with chewy jelly makes for a perfectly balanced finish.", "name": "An L\u1ea1c Vegetarian Buffet", "transport": "Take Bus 26, 34, or 49 to Xu\u00e2n Th\u1ee7y Station, then walk about 5 minutes into the alley of Tr\u1ea7n Qu\u1ed1c V\u01b0\u1ee3ng."}, {"address": "B10-05, Vinhomes Gardenia, H\u00e0m Nghi, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 Stars | Nestled in the upscale Vinhomes community in M\u1ef9 \u0110\u00ecnh, this refined vegetarian establishment specializes in high-quality, natural plant-based cuisine free from added MSG. Their signature \u0027Nourishing Wild Mushroom Hotpot\u0027 slow-simmering fresh mushrooms with herbs produces a velvety, savory broth with juicy mushrooms that burst with flavor. The house-made tofu melts in your mouth with a rich soy aroma. With its elegant and serene setting, it attracts health-conscious professionals and families seeking a clean, guilt-free meal.", "name": "T\u00e2m An Natural Vegetarian Restaurant", "transport": "Take a Grab to the Vinhomes Gardenia community in M\u1ef9 \u0110\u00ecnh, located near the H\u00e0m Nghi commercial street."}, {"address": "TT01-26, Mon City, Ng\u00f5 4 L\u00ea \u0110\u1ee9c Th\u1ecd, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Tucked away in the Mon City area of M\u1ef9 \u0110\u00ecnh, this cozy restaurant is famous for authentic Vietnamese home-cooked vegetarian dishes. The \u0027Glazed Lion\u0027s Mane Mushrooms\u0027 are highly recommended\u2014seared to a golden crisp on the outside while tender and juicy inside, mimicking tender meat and coated in a savory-sweet glaze that pairs wonderfully with rice. Their vegetarian Pho features a surprisingly clear yet deeply flavorful broth with silky rice noodles, making it an excellent choice for vegans craving traditional Vietnamese flavors.", "name": "T\u1eeb T\u00e2m Vegetarian Restaurant M\u1ef9 \u0110\u00ecnh", "transport": "Take Bus 26 or 84 to L\u00ea \u0110\u1ee9c Th\u1ecd Station, then walk about 3 minutes into the Mon City complex."}, {"address": "21 Duy T\u00e2n, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Located near the Duy T\u00e2n Tech Park, this well-known vegetarian restaurant offers exquisite set meals and \u00e0 la carte dishes. The crowd-favorite \u0027Thai Sour and Spicy Soup\u0027 hits the perfect balance of heat and tanginess, rich with lemongrass and galangal aromatics, loaded with fresh tofu and crisp vegetables. Their \u0027Crispy Vegetarian Fish Fillet\u0027, cleverly crafted from seaweed and bean curd skin, boasts a crackling exterior served with a custom sweet-and-sour dip that makes it utterly irresistible.", "name": "B\u00e1ch Th\u1ea3o Vegetarian Restaurant", "transport": "Take Bus 34, 39, or the C\u1ea7u Gi\u1ea5y Metro Line (Line 3) to C\u1ea7u Gi\u1ea5y Station, then take a 5-minute Grab ride."}, {"address": "80 Nguy\u1ec5n Kh\u00e1nh To\u00e0n, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Steeped in Zen ambiance, this quiet sanctuary offers a calm and elegant dining experience away from the city hustle. The \u0027Steamed Rice in Lotus Leaf\u0027 is a must-try\u2014fragrant rice infused with the delicate scent of lotus leaves and natural sweetness from shiitake mushrooms and lotus seeds, perfectly cooked to be chewy yet tender. Pair it with fresh stir-fried seasonal vegetables with lily bulbs for a light, refreshing, and juicy dish highly favored by health-conscious travelers and seniors.", "name": "Thi\u1ec1n T\u00e2m Vegetarian Restaurant", "transport": "Take Bus 12, 38, or 09B to Nguy\u1ec5n Kh\u00e1nh To\u00e0n Station, then walk 2 minutes to arrive."}, {"address": "9A ng\u00f5 121 Ch\u00f9a L\u0103ng, L\u00e1ng Th\u01b0\u1ee3ng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 Stars | The C\u1ea7u Gi\u1ea5y branch of the famous global vegan chain, serving 100% plant-based, egg-free, and dairy-free cuisine. Their popular \u0027Vegan B\u00e1nh M\u00ec\u0027 features a toasted crisp baguette packed with house-made vegan char siu, pickled radish, and fresh cilantro. Delivering a burst of savory, sweet, and tangy flavors in every bite without being greasy, it\u0027s an unmissable grab-and-go snack when visiting the area.", "name": "Loving Hut C\u1ea7u Gi\u1ea5y", "transport": "Take Bus 09B or 27 to Ch\u00f9a L\u0103ng Station, enter Alley 121, and walk about 150 meters."}, {"address": "11 Ng\u00f5 133 Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | A long-standing traditional vegetarian eatery near the Xu\u00e2n Th\u1ee7y university area, celebrated for its cozy home-cooked vibe and fantastic value. A must-try dish is the \u0027Mock Braised Pork with Turmeric \u0026 Galangal (Gi\u1ea3 c\u1ea7y chay)\u0027, slow-simmered with mustard greens, mushrooms, and turmeric until tender and deeply savory with surprising richness. Additionally, their crispy fried vegetarian spring rolls\u2014crispy outside and soft inside\u2014paired with seasoned dipping vinegar offer a tangy, refreshing bite loved by locals.", "name": "An Ph\u00fac Vegetarian Restaurant", "transport": "Take Hanoi Metro Line 3 to National University Station, then walk about 4 minutes into Alley 133."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "105B C3 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located in Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y District, this popular eatery is famous for its sizzling pan-fried b\u00e1nh m\u00ec (B\u00e1nh M\u00ec Ch\u1ea3o). A crispy Vietnamese baguette is smothered in rich, specially blended tomato gravy and served with a sunny-side-up egg, pan-seared pork patty, and a thick slice of mini steak. The bread soaks up the hot, savory sauce while maintaining a wonderful texture contrast between its crispy crust and soft interior. Full of lively local atmosphere, it is a budget-friendly must-try beloved by university students and tourists alike.", "name": "Ngh\u0129a T\u00e2n Pan-Fried B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Ch\u1ea3o C\u1ed9t \u0110i\u1ec7n Ngh\u0129a T\u00e2n)", "transport": "Take Bus 26 or 28 to B\u01b0u \u0111i\u1ec7n C\u1ea7u Gi\u1ea5y stop, then walk about 5 minutes."}, {"address": "106 C2 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Located near Ngh\u0129a T\u00e2n Market, this traditional tofu pudding stall is one of the most iconic takeaway dessert spots in C\u1ea7u Gi\u1ea5y District. The hand-crafted tofu pudding is silky, smooth, and melts in your mouth, served with aromatic jasmine sugar syrup, chewy boba pearls, and refreshing grass jelly. Sweet, cool, and fragrant with floral and soy aromas, it is an affordable, refreshing treat popular with local youth and travelers.", "name": "Ngh\u0129a T\u00e2n Tofu Pudding \u0026 Grass Jelly (T\u00e0o Ph\u1edb Ngh\u0129a T\u00e2n)", "transport": "Take Bus 38 or 45 to Ngh\u0129a T\u00e2n stop, enter the Ngh\u0129a T\u00e2n residential area, and walk about 3 minutes."}, {"address": "3 Ng\u00f5 105 Ngh\u0129a T\u00e2n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Steamed rice pyramids (B\u00e1nh Gi\u00f2) are a classic Hanoi street food comfort, and this long-standing stall in C\u1ea7u Gi\u1ea5y is famous for its generous portions. Wrapped in banana leaves, rice flour batter is filled with mushrooms, minced pork, and wood ear fungus. Once steamed, the cake achieves a cloud-like, silky texture surrounding savory meat filling. Topped with sliced Vietnamese pork sausage (ch\u1ea3), pickled cucumbers, and a drizzle of spicy sauce, it\u0027s addictively delicious.", "name": "Ngh\u0129a T\u00e2n Aunty B\u00e9o\u0027s Steamed Rice Pyramids (B\u00e1nh Gi\u00f2 C\u00f4 B\u00e9o Ngh\u0129a T\u00e2n)", "transport": "Take Bus 28 or 35A to C\u00f4ng vi\u00ean Ngh\u0129a \u0110\u00f4 stop, then walk about 6 minutes."}, {"address": "Ng\u00f5 130 Xu\u00e2n Th\u1ee7y, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | Tucked inside a university district alley on Xu\u00e2n Th\u1ee7y Street, this fried fermented pork stall serves a highly praised after-school snack beloved by local students. Freshly battered and fried to a golden crunch, the outer shell gives way to a chewy, delightfully tangy pork center. Each crunchy bite bursts with warm juices, especially when dipped in the house-made kumquat chili sauce\u2014creating a layered blend of sour, spicy, and savory flavors that is impossible to resist.", "name": "Xu\u00e2n Th\u1ee7y Alley 130 Deep-Fried Fermented Pork Rolls (Nem Chua R\u00e1n Ng\u00f5 130 Xu\u00e2n Th\u1ee7y)", "transport": "Take Hanoi Metro Line 3 to C\u1ea7u Gi\u1ea5y Station, transfer to Bus 26 to \u0110\u1ea1i h\u1ecdc Qu\u1ed1c Gia stop, then walk to destination."}, {"address": "107 Tr\u1ea7n Qu\u1ed1c Ho\u00e0n, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Cubed soft yogurt (S\u1eefa Chua D\u1ebbo) is a unique signature dessert in the modern C\u1ea7u Gi\u1ea5y shopping area. The house-made yogurt is set into firm yet tender blocks, sliced into neat cubes, and dusted heavily with pure cocoa or fresh matcha powder. Chewier and richer than standard yogurt with a texture akin to French mousse, the slightly bitter cocoa perfectly balances the sweet-and-sour milky flavor. Refreshing and light, it makes the perfect palate cleanser while strolling around.", "name": "Tr\u1ea7n Qu\u1ed1c Ho\u00e0n Cubed Yogurt (S\u1eefa Chua D\u1ebbo Tr\u1ea7n Qu\u1ed1c Ho\u00e0n)", "transport": "Take Bus 16, 26, or 27 to Tr\u1ea7n Qu\u1ed1c Ho\u00e0n stop; the shop is right there."}, {"address": "48 \u0110\u00ecnh Th\u00f4n, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located in the heart of the M\u1ef9 \u0110\u00ecnh area, this street stall specializes in \u0027Vietnamese Pizza\u0027\u2014grilled rice paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng). Thin rice sheets cooked over charcoal are topped with scallions, quail eggs, pork floss, and cheese, grilled until biscuit-crisp and intensely aromatic. They also serve tangy, spicy mixed rice paper salad (B\u00e1nh Tr\u00e1ng Tr\u1ed9n), featuring chewy rice paper shreds, attracting many local office workers and international tourists.", "name": "\u0110\u00ecnh Th\u00f4n Grilled \u0026 Mixed Rice Paper (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng \u0110\u00ecnh Th\u00f4n)", "transport": "Take Bus 84 or 103A to \u0110\u00ecnh Th\u00f4n stop, then walk about 3 minutes."}, {"address": "22 Ng\u00f5 39 \u0110\u00ecnh Th\u00f4n, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.0 stars | Tucked away in an alley near M\u1ef9 \u0110\u00ecnh Stadium, this charcoal grill stall advertises its presence with smoky aromas long before you reach it. Pork shoulder cuts are marinated in fish sauce, lemongrass, and honey before sizzling over hot coals until golden and charred. Crispy on the outside, tender and juicy inside, with a hint of sweet lemongrass fragrance, these skewers are often served inside warm baguettes, making for an iconic local street snack.", "name": "M\u1ef9 \u0110\u00ecnh Grilled Pork Skewers (Th\u1ecbt Xi\u00ean N\u01b0\u1edbng M\u1ef9 \u0110\u00ecnh)", "transport": "Take Bus 74 or 88 to S\u00e2n v\u1eadn \u0111\u1ed9ng M\u1ef9 \u0110\u00ecnh stop, then walk about 8 minutes."}, {"address": "12 Ng\u00f5 52 M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | This long-standing dessert shop in M\u1ef9 \u0110\u00ecnh is renowned for its delicate traditional Vietnamese pomelo sweet soup (Ch\u00e8 B\u01b0\u1edfi). The inner rind of pomelo peel is meticulously prepared to remove bitterness while retaining a chewy texture, then cooked with mung beans and rich coconut cream. Thick, smooth, and delightfully crunchy from the pomelo pith, it offers rich coconut and sweet mung bean notes. Served chilled, it is a refreshing, classic dessert highly praised by travelers.", "name": "M\u1ef9 \u0110\u00ecnh Pomelo Sweet Soup (Ch\u00e8 B\u01b0\u1edfi M\u1ef9 \u0110\u00ecnh)", "transport": "Take Bus 26 or 39 to M\u1ef9 \u0110\u00ecnh stop, then walk into Alley 52 for about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Cau Giay and My Dinh Modern Commercial District"}, "dong_da": {"categories": {"cat_1": {"items": [{"address": "57 Nguy\u1ec5n Khuy\u1ebfn, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | One of Hanoi\u0027s most iconic B\u00fan Ch\u1ea3 joints, originating from Sinh T\u1eeb Street (now Nguy\u1ec5n Khuy\u1ebfn Street) near the Temple of Literature. The charcoal-grilled pork patties are slightly charred, sweet, and well-marinated, served with a balanced sweet-and-sour fish sauce dipping broth, soft yet springy fresh rice vermicelli, and fresh herbs. Rich in flavor and texture, it is a favorite among locals and visiting tourists alike, making it a must-try classic after exploring the Temple of Literature.", "name": "Sinh T\u1eeb Grilled Pork Noodles (B\u00fan Ch\u1ea3 Sinh T\u1eeb - Nguy\u1ec5n Khuy\u1ebfn)", "transport": "About a 3-minute walk from the Temple of Literature (V\u0103n Mi\u1ebfu - Qu\u1ed1c T\u1eed Gi\u00e1m)."}, {"address": "61 V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located right next to the Temple of Literature, this traditional Ph\u1edf shop is famous for its rich yet clear and sweet broth, slow-cooked from beef bones for dozens of hours. Thinly sliced medium-rare beef stays incredibly tender when scalded by the hot soup, paired with smooth flat rice noodles and plenty of scallions. Every bite captures the authentic, rustic flavor of Northern Vietnamese Ph\u1edf\u2014a classic breakfast choice for locals.", "name": "Ph\u1edf Y\u1ebfn Beef Noodle Soup (Ph\u1edf Y\u1ebfn - V\u0103n Mi\u1ebfu)", "transport": "Located right across the street from the main entrance of the Temple of Literature, just a 1-minute walk away."}, {"address": "19 V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Serving traditional Hanoi turmeric fried fish (Ch\u1ea3 C\u00e1), made with firm, boneless snakehead fish marinated in turmeric, shrimp paste, and spices. It is sizzled right at your table in hot oil with plenty of fresh dill and spring onions. Crisp on the outside, tender inside, and bursting with aroma, it is served with rice vermicelli, crushed peanuts, and savory shrimp paste dipping sauce. A unique local culinary masterpiece that draws foodies from all over.", "name": "Ch\u1ea3 C\u00e1 Ngon V\u0103n Mi\u1ebfu (Fried Fish with Dill)", "transport": "Just a 2-minute walk from the Temple of Literature."}, {"address": "111 C3 Gi\u1ea3ng V\u00f5, Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | A famous local brand known for authentic steamed rice rolls (B\u00e1nh Cu\u1ed1n). Made freshly to order with pure rice batter, the sheets are paper-thin, soft, and delicately elastic. Wrapped with minced pork and wood ear mushrooms, these rolls melt smoothly in your mouth. Served with signature warm fish sauce dipping liquid and crispy fried shallots, its sweet and savory profile is addictive\u2014an excellent introduction to refined Northern Vietnamese rice delicacies.", "name": "B\u00e1nh Cu\u1ed1n Gia An Steamed Rice Rolls (Gi\u1ea3ng V\u00f5)", "transport": "Take a Grab or bus to Gi\u1ea3ng V\u00f5 Street; it\u0027s just a 2-minute walk from there."}, {"address": "180 T\u00f4n \u0110\u1ee9c Th\u1eafng, H\u00e0ng B\u1ed9t, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | A decades-old traditional dessert shop specializing in classic Vietnamese sticky rice with mung bean sweet soup (X\u00f4i Ch\u00e8). Fluffy, chewy sticky rice infused with mung bean is drenched in warm, velvety smooth sweet mung bean pudding, creating a rich texture that is sweet yet perfectly light. Warm and subtly fragrant, it offers a heartwarming taste of old Hanoi tradition and is highly cherished by locals.", "name": "X\u00f4i Ch\u00e8 B\u00e0 T\u00e1m Traditional Sticky Rice \u0026 Dessert (T\u00f4n \u0110\u1ee9c Th\u1eafng)", "transport": "Walk south along T\u00f4n \u0110\u1ee9c Th\u1eafng Road from the Temple of Literature for about 8 minutes."}, {"address": "110 T\u00f4n \u0110\u1ee9c Th\u1eafng, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | A well-established crab noodle soup stall located on a lively street corner in \u0110\u1ed1ng \u0110a, famous for its savory, gently tangy broth. Made with real freshwater crab meat cakes cooked alongside fresh tomatoes and tofu, the soup has a naturally refreshing flavor. Thin rice vermicelli absorbs the rich crab-infused broth, while fried tofu and fresh herbs add crispness and aroma\u2014a comforting and refreshing local street food staple.", "name": "T\u00f4n \u0110\u1ee9c Th\u1eafng Crab \u0026 Tomato Noodle Soup (B\u00fan Ri\u00eau Cua)", "transport": "Located on the main T\u00f4n \u0110\u1ee9c Th\u1eafng thoroughfare, about a 5-minute walk from the Temple of Literature."}, {"address": "11 Nguy\u1ec5n Khuy\u1ebfn, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | A traditional eatery specializing in home-style Vietnamese meals (C\u01a1m Ph\u1ed1 C\u1ed5) full of nostalgic flavors. Signature dishes include caramelized braised pork belly, pan-fried tofu with shrimp paste, and caramelized stewed fish. The pork belly is tender, melt-in-your-mouth, and coated in a savory-sweet glaze perfect over steamed white rice. Paired with traditional vegetable soups, it offers an authentic taste of Northern home cooking, popular with both office workers and tourists.", "name": "C\u01a1m Ph\u1ed1 C\u1ed5 Traditional Home Cooking (Nguy\u1ec5n Khuy\u1ebfn)", "transport": "About a 4-minute walk from the Temple of Literature."}, {"address": "22 T\u00f4n \u0110\u1ee9c Th\u1eafng, C\u00e1t Linh, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | A highly popular local noodle shop in \u0110\u1ed1ng \u0110a, famous for its B\u00fan M\u1ecdc featuring handmade pork meatballs with wood ear mushrooms alongside chewy sea snails. The slow-simmered bone broth is clear, clean, and naturally sweet. The juicy pork balls are packed with fragrant mushroom flavor, while the snails provide a fresh, crunchy texture. Paired with fine rice vermicelli and fresh mint leaves, it\u0027s a refreshing street delicacy beloved by locals.", "name": "B\u00fan M\u1ecdc Th\u1ee7y Pork Meatball \u0026 Snail Noodles (T\u00f4n \u0110\u1ee9c Th\u1eafng)", "transport": "Located just west of the Temple of Literature, about a 3-minute walk away."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "35A Ph\u1ed1 V\u0103n Mi\u1ebfu, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A classic nostalgic cafe located diagonally across from the main entrance of the Temple of Literature. The interior design features a Vietnam War-era army green style paired with vintage wooden furniture. The signature \u0027Coconut Condensed Milk Coffee Smoothie\u0027 perfectly blends rich, bittersweet Vietnamese black coffee with smooth coconut slush, offering a delightfully sweet, refreshing, and layered taste. Sitting by the window in the morning with a hot, freshly baked baguette dipped in condensed milk while admiring the quaint streetscape of the Temple of Literature is the perfect way to experience old Hanoi\u0027s leisurely vibe. A must-visit landmark for tourists.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea - Temple of Literature Branch (C\u1ed9ng C\u00e0 Ph\u00ea - V\u0103n Mi\u1ebfu)", "transport": "About a 1-minute walk from the main entrance of the Temple of Literature (Qu\u1ed1c T\u1eed Gi\u00e1m)"}, {"address": "88 Nguy\u1ec5n Khuy\u1ebfn, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | A cozy multi-story cafe near the historic Temple of Literature district, decorated with warm wooden tones and lush green plants. It offers not only high-quality specialty pour-over coffee and rich egg coffee, but also a popular brunch menu featuring items like \u0027Avocado Poached Egg Toast\u0027 and \u0027American Pancakes\u0027 loved by local expats and hipsters. The spacious, well-lit environment makes it an ideal spot to enjoy a refined, hearty brunch after exploring historic landmarks.", "name": "The Woodpecker Coffee - Nguy\u1ec5n Khuy\u1ebfn", "transport": "About a 3-minute walk from the back of the Temple of Literature"}, {"address": "Ng\u00f5 198 Th\u00e1i H\u00e0, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | A minimalist, industrial-style independent cafe hidden in the alleys of Dong Da District, centered around the philosophy of \u0027mindfully enjoying quality coffee.\u0027 They are extremely meticulous about bean roasting and brewing techniques. Popular items like the \u0027Special Cold Brew\u0027 and \u0027Brown Sugar Milk Latte\u0027 are remarkably smooth, balanced, and lingering in aroma. The quiet, elegant space features comfortable sofa seating and a green outdoor courtyard\u2014a hidden sanctuary cherished by local freelancers and coffee enthusiasts.", "name": "KA Cafe - Th\u00e1i H\u00e0", "transport": "Take a taxi to the entrance of Alley 198, Th\u00e1i H\u00e0 Street, then walk about 1 minute"}, {"address": "360 X\u00e3 \u0110\u00e0n, Nam \u0110\u1ed3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | An Instagram-worthy rooftop scenic cafe located on a bustling street in Dong Da District, featuring floor-to-ceiling windows and an outdoor rooftop terrace with views of Hanoi\u0027s vibrant skyline. Beyond the picturesque backdrops, its brunch dishes and signature fruit teas are equally impressive. The signature \u0027British Afternoon Tea Set for Two\u0027 and fluffy \u0027Souffl\u00e9 Pancakes\u0027 are light, creamy, and deliciously balanced, making it a favorite among fashionable young locals.", "name": "Lofita Tea \u0026 Coffee - X\u00e3 \u0110\u00e0n", "transport": "Take bus 21A, 26, or 28 and get off at 360 X\u00e3 \u0110\u00e0n stop"}, {"address": "5 Tr\u1ecbnh Ho\u00e0i \u0110\u1ee9c, C\u00e1t Linh, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | A renowned independent bookish cafe near the Temple of Literature and H\u00e0ng \u0110\u1eaby Stadium, boasting a quiet, classic, and cultured atmosphere. Floor-to-ceiling bookshelves, comfy vintage sofas, and soft jazz music fill the space. Their \u0027Traditional Hanoi Egg Coffee\u0027 features an ultra-fine, creamy egg yolk foam without any fishy note, tasting as rich and velvety as cr\u00e8me br\u00fbl\u00e9e. Paired with aromatic hand-poured coffee, it is the perfect sanctuary to get lost in books and thought.", "name": "Tranquil Books \u0026 Coffee - Tr\u1ecbnh Ho\u00e0i \u0110\u1ee9c", "transport": "About a 7-minute walk from C\u00e1t Linh Metro Station"}, {"address": "114 Tr\u1ea7n H\u1eefu T\u01b0\u1edbc, Nam \u0110\u1ed3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | An independent cafe exuding strong vintage Hanoi artistic vibes and casual street charm, highly popular among local university students and artists. Its specialty lies in blending traditional Vietnamese phin drip coffee with modern flavors, such as \u0027Salted Cream Foam Black Coffee\u0027 and \u0027Espresso Oat Milk Latte\u0027\u2014striking a delicious savory-sweet balance with rich aromas. Patrons love sitting on low wooden stools outside, sipping coffee and chatting, fully immersing in authentic Hanoi street coffee culture.", "name": "G\u1ea1t T\u00e0n Coffee", "transport": "Turn from X\u00e3 \u0110\u00e0n Road onto Tr\u1ea7n H\u1eefu T\u01b0\u1edbc Street and walk about 3 minutes"}, {"address": "59 Ph\u1ed1 V\u0103n Mi\u1ebfu, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | A famous local Vietnamese open-air cafe chain, with the Temple of Literature branch boasting a prime corner location. The fully open-air space directly overlooks the historic walls of the Temple. The signature \u0027B\u1ea1c X\u1ec9u\u0027 (Vietnamese white coffee) is rich and sweet, with a perfect balance of milk and coffee aromas. Many locals love coming here early in the morning to order an iced milk coffee and a bag of sunflower seeds, sitting on wooden stools to soak up the everyday joy of Hanoi street life.", "name": "Aha Caf\u00e9 - V\u0103n Mi\u1ebfu", "transport": "Located at the intersection of V\u0103n Mi\u1ebfu Street and Nguy\u1ec5n Khuy\u1ebfn Street, directly opposite the Temple of Literature"}, {"address": "33 Y\u00ean Th\u1ebf, V\u0103n Mi\u1ebfu, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | A garden cafe set in an old French villa, tucked away in a quiet alley near the historic Temple of Literature district. Converted from a century-old yellow French-colonial building rich in character, its leafy courtyard exudes an elegant and tranquil atmosphere. The menu features French light brunch items, croissants, and exquisite \u0027Cold Brew Flower \u0026 Fruit Tea\u0027 with a pleasantly sweet and tangy flavor. Whether sunbathing under the garden trees or gazing at the streetscape from the second floor, it offers ultimate relaxation.", "name": "De.T\u1ea7m Cafe - Y\u00ean Th\u1ebf", "transport": "About a 5-minute walk from the Temple of Literature into the quiet alley of Y\u00ean Th\u1ebf"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "109 Y\u00ean L\u00e3ng, Th\u1ecbnh Quang, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A refined regional restaurant specializing in the flavors of Qu\u1ea3ng Nam Province in Central Vietnam, elevating traditional central street eats into an elegant bistro experience. The signature Qu\u1ea3ng-style noodles (M\u00ec Qu\u1ea3ng) feature a rich, aromatic broth served with chewy rice noodles, fragrant turmeric, and crunchy peanuts, creating a wonderfully layered texture. The interior embraces bamboo weaving and lantern elements paired with house-made specialty fruit liqueurs, making it a top choice for foodies seeking authentic regional flavors in a sophisticated setting.", "name": "V\u1ecb Qu\u1ea3ng Restaurant - Yen Lang (Central Vietnamese Bistro)", "transport": "Take bus 84 or 144 to 109 Y\u00ean L\u00e3ng stop, then walk about 1 minute."}, {"address": "160 \u00d4 Ch\u1ee3 D\u1eeba, Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located on a bustling street in the \u0110\u1ed1ng \u0110a District, this spot is famous for its signature Hanoi Platter (M\u1eb9t H\u00e0 N\u1ed9i) served on large round bamboo trays. The ste aromas, served with tender sliced beef, handmade beef balls, and smooth, chewy thick rice noodles. With its vintage wooden decor and budget-friendly prices, it is a popular spot near the Temple of Literature to sample Central Vietnamese flavors.", "name": "N\u00e9t Hu\u1ebf Restaurant - Thai Ha (Hue Imperial \u0026 Regional Cuisine)", "transport": "Take bus 12, 26, or 35A to 33 Th\u00e1i H\u00e0 stop, then walk about 1 minute."}, {"address": "18 Ng\u00f5 19 \u0110\u00f4ng T\u00e1c, Kim Li\u00ean, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Tucked away in a quiet alley in \u0110\u1ed1ng \u0110a District, this gorgeous water-country-themed restaurant features little wooden bridges, flowing streams, lotus ponds, and bamboo shacks, recreating the serene countryside charm of Northern Vietnam. Highlighting Northern regional comfort food, its top recommendations include Country-Style Grilled Frog and House-Brewed Green Plum Wine. The frog meat is incredibly tender and springy, grilled to golden perfection with fresh spices. Paired with refreshing, mildly sweet house-made fruit wine, it offers an immersive, authentic countryside dining feast.", "name": "Ao Qu\u00e1n - Dong Tac (Country-Style Waterside Bistro)", "transport": "Take bus 21A, 26, 28, or 35A to Ch\u00f9a B\u1ed9c stop, turn into Alley 19 \u0110\u00f4ng T\u00e1c, and walk about 3 minutes."}, {"address": "151\u2013161 Ho\u00e0ng C\u1ea7u, Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Situated by the scenic Ho\u00e0ng C\u1ea7u Lake, this vibrant bistro brings the regional delicacies of the Central Highlands and Mekong Delta right to Hanoi. The signature Chili-Salt Grilled Kumquat Chicken (G\u00e0 n\u01b0\u1edbng mu\u1ed1i \u1edbt) boasts crisp, golden skin and juicy, flavorful meat with a delightful citrus kick and spicy kick. Surrounded by lush outdoor garden greenery, it offers a wide array of regional snacks and specialty cocktails in a relaxed, laid-back setting\u2014making it a favorite among foodies and trendy locals alike.", "name": "H\u1ebbm Qu\u00e1n Restaurant - Hoang Cau (Southern Regional Bistro)", "transport": "Take Hanoi Metro Line 2A to Ho\u00e0ng C\u1ea7u Station, then walk about 3 minutes."}, {"address": "102 Th\u00e1i Th\u1ecbnh, Th\u1ecbnh Quang, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | A immensely popular themed bistro recreating the nostalgic retro charm of 1980s Old Hanoi, specializing in premium young beef and tender veal (B\u00f2 T\u01a1) delicacies. Must-try dishes include Lemon-Dressed Rare Veal (B\u00f2 t\u01a1 t\u00e1i chanh) and Steamed Lemongrass Veal. The meat is exceptionally soft, juicy, and milky-sweet, perfectly complemented when wrapped in fresh greens with a side of special fermented bean curd dip. Refreshing, flavorful, and incredibly photogenic, it\u0027s a memorable local culinary experience.", "name": "B\u00f2 T\u01a1 Qu\u00e1n M\u1ed9c - Thai Thinh (80s Vintage Veal Bistro)", "transport": "Take bus 09B, 12, or 26 to 102 Th\u00e1i Th\u1ecbnh stop."}, {"address": "71 \u0110\u1eb7ng V\u0103n Ng\u1eef, Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located in \u0110\u1ed1ng \u0110a\u2019s famous youth commercial district, this famous pioneer elevated Hanoi\u0027s classic street food \u0027Sizzling Skillet B\u00e1nh M\u00ec\u0027 (B\u00e1nh m\u00ec ch\u1ea3o) into a polished regional bistro experience. Served piping hot on a sizzling skillet, it comes loaded with sunny-side-up eggs, rich pate, juicy meatballs, and thick-cut ham. Paired with warm, crispy baguettes to soak up the savory-sweet sauce, every bite is pure satisfaction\u2014a brilliant showcase of Hanoi\u0027s seamless fusion of modern food culture and classic street flavors.", "name": "C\u1ed9t \u0110i\u1ec7n Qu\u00e1n - Dang Van Ngu (Sizzling Pan B\u00e1nh M\u00ec \u0026 Local Bistro)", "transport": "Take bus 21A, 26, 28, or 35A to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch stop, then walk about 5 minutes onto \u0110\u1eb7ng V\u0103n Ng\u1eef Street."}], "name": "Specialty Bistros \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "117 Nguy\u1ec5n Khuy\u1ebfn, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located right next to the Temple of Literature, this established local spot is well-known for affordable vegetarian dining. Highly recommended are the \u0027Vegetarian Pho\u0027 and \u0027Vegetarian Vietnamese Spring Rolls.\u0027 The pho broth is slow-cooked with corn, radish, and sugarcane, resulting in a light, naturally sweet, and guilt-free broth. The fried spring rolls feature a golden, crispy skin stuffed with wood ear mushrooms, glass noodles, and shiitake mushrooms, offering rich textures that are immensely popular with tourists visiting the Temple of Literature and local vegetarians alike.", "name": "H\u00e0 Th\u00e0nh Vegetarian Restaurant (C\u01a1m Chay H\u00e0 Th\u00e0nh)", "transport": "About a 3-minute walk from the Temple of Literature"}, {"address": "20 Ng\u00f5 113 Ho\u00e0ng C\u1ea7u, Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Tucked away near Ho\u00e0ng C\u1ea7u Lake, this cozy vegetarian diner is famous for home-style stir-fries and exquisite vegetarian hot pots. The signature \u0027Deep-Fried Oyster Mushrooms with Salt and Pepper\u0027 are crispy outside and tender inside, offering a savory, satisfying texture reminiscent of chicken. Paired with the perfectly balanced \u0027Vegetarian Hot and Sour Hotpot,\u0027 where various wild mushrooms soak up the rich, flavorful broth, it\u0027s the best place to experience the warm atmosphere of authentic Vietnamese home-style vegetarian dining.", "name": "An Ph\u00fac Vegetarian Restaurant (C\u01a1m Chay An Ph\u00fac)", "transport": "Take Hanoi Metro Line 2A to C\u00e1t Linh Station, then transfer to a taxi for about 5 minutes"}, {"address": "7 C\u00e1t Linh, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | A modern, hipster-style vegetarian all-you-can-eat restaurant located near C\u00e1t Linh Metro Station. It serves over 20 exquisite plant-based dishes daily. Highlights include the \u0027Banana Flower Salad,\u0027 featuring crunchy shredded banana flower tossed with rich crushed peanuts and a tangy sweet-and-sour dressing that is incredibly appetizing. They also offer fresh fruit and vegetable hotpot broths accompanied by a variety of fresh organic greens. The bright and clean environment makes it extremely popular among young adults and foreign tourists.", "name": "Vegito Vegetarian Buffet - C\u00e1t Linh (Nh\u00e0 h\u00e0ng Buffet Chay Vegito C\u00e1t Linh)", "transport": "Take Hanoi Metro Line 2A to C\u00e1t Linh Station, then walk for about 2 minutes"}, {"address": "34 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch, Kim Li\u00ean, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | An exquisite vegetarian restaurant steeped in Zen tranquility and Oriental aesthetics. A must-order is the \u0027Lotus Leaf Wrapped Rice with Lotus Seeds,\u0027 where the rice absorbs the subtle fragrance of fresh lotus leaves, accompanied by soft, powdery lotus seeds, tender lily bulbs, and diced shiitake mushrooms\u2014delivering a burst of natural sweetness in every bite. The tranquil and elegant atmosphere makes it perfect for diners looking to escape the hustle and bustle to quietly enjoy an elegant plant-based feast.", "name": "B\u1ed3 \u0110\u1ec1 T\u00e2m Vegetarian Restaurant (Nh\u00e0 h\u00e0ng Chay B\u1ed3 \u0110\u1ec1 T\u00e2m)", "transport": "Take bus 21A, 26, or 35A and get off at 34 Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch station"}, {"address": "147 Ch\u00f9a L\u00e1ng, L\u00e1ng Th\u01b0\u1ee3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | The \u0110\u1ed1ng \u0110a branch of the globally renowned vegan chain, fe
