aturing affordable and diverse Vietnamese plant-based snacks. Their \u0027Vegetarian B\u00e1nh M\u00ec\u0027 is exceptional\u2014baked to a delightful crackling crunch and stuffed with special vegetarian pat\u00e9, pickled radishes, and fresh cilantro, offering a juicy mix of sweet, tangy, and savory flavors. It is a favorite among local university students and takeaway customers.", "name": "Loving Hut - Ch\u00f9a L\u00e1ng (Loving Hut Ch\u00f9a L\u00e1ng)", "transport": "Take bus 09B or 16 to 1150 \u0110\u01b0\u1eddng L\u00e1ng station, then walk for about 6 minutes"}, {"address": "79 Ng\u00f5 360 X\u00e3 \u0110\u00e0n, Nam \u0110\u1ed3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Tucked away in an alley off X\u00e3 \u0110\u00e0n Street, this refined vegetarian buffet emphasizes healthy, low-oil, low-sodium cooking. Highly recommended is the \u0027Vegetarian Cod with Passion Fruit Sauce\u0027\u2014mock fish fillets made from tofu and seaweed tossed in a rich, tangy passion fruit sauce, featuring a crispy exterior and soft interior. Paired with a variety of freshly made Vietnamese pastries and cold salads, it is a local gem health-conscious vegetarians shouldn\u0027t miss.", "name": "Vege T Vegetarian Buffet (Buffet Chay Vege T)", "transport": "Take bus 25, 28, or 142 to 360 X\u00e3 \u0110\u00e0n station, then walk into the alley for about 3 minutes"}, {"address": "49 Nguy\u1ec5n Hy Quang, \u00d4 Ch\u1ee3 D\u1eeba, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A creative vegetarian restaurant combining Southeast Asian flavors with modern culinary techniques. The signature dish, \u0027Grilled Eggplant with Scallion Oil,\u0027 features whole eggplants roasted until melt-in-your-mouth soft, drizzled with aromatic scallion oil and crushed peanuts for a smooth, rich, and layered texture. Featuring a minimalist industrial d\u00e9cor, it is a popular veggie dining spot for young people\u0027s dates and gatherings.", "name": "Kasa Creative Vegetarian Restaurant (Nh\u00e0 h\u00e0ng Chay Kasa)", "transport": "Take bus 02 or 09B to 160 Kh\u00e2m Thi\u00ean station, then walk for about 5 minutes"}, {"address": "Ng\u00f5 205 T\u00e2y S\u01a1n, Ng\u00e3 T\u01b0 S\u1edf, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | A traditional vegetarian rice box and stir-fry eatery full of authentic Hanoi charm. The most popular dish is the \u0027Braised Tofu and Shiitake Mushroom Claypot,\u0027 where silky tofu absorbs rich vegetarian shacha sauce and mushroom broth, paired with the meaty bite of mushrooms that goes perfectly with rice. With very affordable prices, it offers a pure taste of daily life for Hanoi locals.", "name": "T\u1ecbnh T\u00e2m Vegetarian Restaurant (C\u01a1m Chay T\u1ecbnh T\u00e2m)", "transport": "Take bus 01, 02, or 09B to 221 T\u00e2y S\u01a1n station, then walk for about 3 minutes"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "C7 Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Tucked away in the Trung T\u1ef1 residential complex, this time-honored hot tapioca cake stall serves a comforting street food classic local residents grew up with. Scooped fresh and warm, the tapioca cake is dense, smooth, and melts in your mouth. It\u0027s generously topped with savory stir-fried minced pork, wood ear mushrooms, crispy fried shallots, and fresh cilantro, then drizzled with a warm, sweet-and-savory fish sauce broth. Each spoonful bursts with rich rice aroma and savory pork fat, offering a wonderful interplay of chewy and crunchy textures loved by local students and tourists alike.", "name": "C7 Trung T\u1ef1 Hot Tapioca Cake (B\u00e1nh \u0110\u00fac N\u00f3ng C7 Trung T\u1ef1)", "transport": "Take bus 21A or 26 to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch stop, then walk about 3 minutes to arrive."}, {"address": "29 T\u00f4n \u0110\u1ee9c Th\u1eafng, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located near the Temple of Literature on T\u00f4n \u0110\u1ee9c Th\u1eafng Street, this incredibly popular Vietnamese crispy pancake stall is a hidden gem. The golden, crispy turmeric rice batter is cooked hot in a pan and wrapped around generous fillings of fresh shrimp, pork belly slices, and crunchy bean sprouts. Every bite delivers a satisfying crunch with a juicy, sweet savory center. Enjoy it the authentic way: cut into pieces, wrap in fresh lettuce, perilla leaves, and rice paper, then dip into sweet, sour, and spicy garlic-lime fish sauce. Crispy on the outside, tender on the inside, and delightfully refreshing without being greasy, making it an unmissable afternoon snack in the area.", "name": "C\u00f4 Nga T\u00f4n \u0110\u1ee9c Th\u1eafng Vietnamese Crispy Pancake (B\u00e1nh X\u00e8o C\u00f4 Nga T\u00f4n \u0110\u1ee9c Th\u1eafng)", "transport": "Walk about 4 minutes along T\u00f4n \u0110\u1ee9c Th\u1eafng Street from the main entrance of the Temple of Literature."}, {"address": "Ch\u1ee3 Nam \u0110\u1ed3ng, H\u1ed3 \u0110\u1eafc Di, Nam \u0110\u1ed3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Located at the entrance of the traditional Nam \u0110\u1ed3ng Market, this classic sweet soup stall is a cool haven for Hanoi\u0027s youth and foodies. The signature Thai sweet soup (Ch\u00e8 Th\u00e1i) is packed with colorful toppings including silky jackfruit, emerald green jelly, sweet tapioca pearls, and rich coconut milk. Served over shaved ice, every icy bite blends tropical fruit notes with coconut cream, delivering a chewy, smooth texture that is delightfully sweet without feeling heavy. Affordable and delicious, this walk-and-eat dessert is a perfect way to experience Hanoi\u0027s traditional market food culture.", "name": "Nam \u0110\u1ed3ng Market Thai Sweet Soup (Ch\u00e8 Th\u00e1i Nam \u0110\u1ed3ng)", "transport": "Take bus 35A or 44 to H\u1ed3 \u0110\u1eafc Di stop, then walk into Nam \u0110\u1ed3ng Market to find it."}, {"address": "Ng\u00f5 4C \u0110\u1eb7ng V\u0103n Ng\u1eef, Trung T\u1ef1, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | \u0110\u1eb7ng V\u0103n Ng\u1eef Street is a favorite street food hotspot among students in \u0110\u1ed1ng \u0110a District. This innovative b\u00e1nh m\u00ec combines crispy fried fermented pork rolls with French fries for a truly unique treat. Freshly toasted to a golden crisp, the baguette is stuffed with crispy-on-the-outside, soft-on-the-inside fried fermented pork, golden French fries, and a special spicy mayonnaise sauce. Taking a bite unleashes a crunch of baguette flakes, followed by a savory, slightly tangy pork flavor paired with the soft, fluffy fries\u2014a multi-layered, savory delight that young travelers love to try.", "name": "\u0110\u1eb7ng V\u0103n Ng\u1eef Fried Fermented Pork \u0026 French Fry B\u00e1nh M\u00ec (B\u00e1nh M\u00ec Nem Khoai \u0110\u1eb7ng V\u0103n Ng\u1eef)", "transport": "Take bus 28 or 99 to Ph\u1ea1m Ng\u1ecdc Th\u1ea1ch stop, then walk about 5 minutes into the alley at \u0110\u1eb7ng V\u0103n Ng\u1eef."}, {"address": "213 X\u00e3 \u0110\u00e0n, Nam \u0110\u1ed3ng, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Located on X\u00e3 \u0110\u00e0n Boulevard, this pork cartilage congee stall draws eager crowds every evening. The smooth rice porridge is made from finely ground rice slow-cooked in a rich pork bone broth, creating a silky, velvety texture. It\u0027s topped with tender, slow-simmered pork cartilage that retains a delightful crunch, flavorful pork floss, and freshly fried crispy dough sticks (qu\u1ea9y). Served hot and comforting, the natural sweetness of the pork bone broth unfolds on your tongue, contrasting wonderfully with the chewy cartilage and crunchy dough\u2014a comforting street food cherished by food lovers.", "name": "X\u00e3 \u0110\u00e0n Pork Cartilage Congee (Ch\u00e1o S\u01b0\u1eddn S\u1ee5n 213 X\u00e3 \u0110\u00e0n)", "transport": "Take bus 25, 28, or 142 to 213 X\u00e3 \u0110\u00e0n stop and you will arrive right there."}, {"address": "105 A5 C\u1ee5m 5 Trung T\u1ef1, Th\u00e1i H\u00e0, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Located on Th\u00e1i H\u00e0 Street, this traditional tofu pudding shop is famous for its handmade, ultra-tender tofu pudding. Silky smooth and melting in your mouth, it radiates pure soybean fragrance. It is served with house-brewed jasmine-infused syrup, black grass jelly, sweet mung bean paste, and chewy boba pearls. The subtle jasmine sweetness flows over crushed ice, offering a light, non-greasy treat with alternating smooth and springy textures\u2014the perfect refreshing dessert while strolling around \u0110\u1ed1ng \u0110a District after visiting the Temple of Literature.", "name": "Th\u00e1i H\u00e0 Tofu Pudding \u0026 Grass Jelly (T\u00e0o Ph\u1edb Jelly Th\u00e1i H\u00e0)", "transport": "Take bus 12, 26, or 35A to Th\u00e1i H\u00e0 stop, then walk about 3 minutes to arrive."}, {"address": "Ng\u00f5 298 T\u00e2y S\u01a1n, Trung Li\u1ec7t, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Surrounded by clothing boutiques and street vendors, Ch\u00f9a B\u1ed9c Street is home to this night-time street food hot spot featuring fried fermented pork. Made to order, the pork rolls are coated in a thin batter and fried to golden perfection\u2014crispy on the outside, springy and chewy on the inside. Each bite offers a juicy, slightly tangy flavor that pairs perfectly with the house-made sweet chili sauce. The stall also offers grilled pork skewers and fried rice cakes, creating a lively street-snack atmosphere ideal for young people hanging out in Hanoi.", "name": "Ch\u00f9a B\u1ed9c Fried Fermented Pork \u0026 Skewers (Nem Chua R\u00e1n Ch\u00f9a B\u1ed9c)", "transport": "Take bus 18, 21A, or 23 to Ch\u00f9a B\u1ed9c stop, then walk to the entrance of Alley 298 T\u00e2y S\u01a1n Street to see it."}, {"address": "68 \u0110\u01b0\u1eddng L\u00e1ng, Th\u1ecbnh Quang, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | Situated near \u0110\u01b0\u1eddng L\u00e1ng in \u0110\u1ed1ng \u0110a District, this street food stall brought Southern Vietnam\u0027s famous \"Vietnamese Pizza\" (grilled rice paper) to Hanoi to great acclaim. Thin rice paper is grilled over charcoal until crispy, brushed with butter, quail eggs, green onions, pork floss, and minced pork, then drizzled with chili sauce and mayonnaise before being rolled up. Freshly made and intensely crispy, every crunchy bite combines savory egg, fragrant green onions, and flavorful sauces for a delicious mix of sweet, salty, and spicy notes\u2014a top recommendation for travelers experiencing Hanoi\u0027s night market food culture.", "name": "\u0110\u01b0\u1eddng L\u00e1ng Grilled Rice Paper \u0026 Quail Eggs (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng \u0110\u01b0\u1eddng \u0110\u01b0\u1eddng)", "transport": "Take bus 09B, 16, or 24 to \u0110\u01b0\u1eddng L\u00e1ng stop, then walk about 4 minutes to arrive."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Dong Da and Temple of Literature Historic District"}, "french_quarter": {"categories": {"cat_1": {"items": [{"address": "34 Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.3 Stars | Set inside a romantic French colonial garden, this iconic eatery brings together traditional street food delicacies from all across Vietnam. The sizzling B\u00e1nh X\u00e8o features a golden, crispy shell stuffed with flavorful shrimp and pork, served alongside fresh herbs and house-made dipping sauce. Bursting with rich, sweet, and fresh flavors, it\u0027s the ultimate go-to spot for both locals and tourists seeking authentic Vietnamese food.", "name": "Qu\u00e1n \u0102n Ngon (Phan Chu Trinh)", "transport": "About a 5-minute walk from the Hanoi Opera House"}, {"address": "24 L\u00ea V\u0103n H\u01b0u, Hai B\u00e0 Tr\u01b0ng, Hanoi", "feature": "\u2b50 4.2 Stars | Made world-famous by the visit of former U.S. President Barack Obama, this legendary spot serves time-honored traditional flavors. Charcoal-grilled pork slices and patties boast a rich smoky aroma, steeped in a warm, sweet, and tangy fish sauce broth. Served with tender rice vermicelli and generous fresh herbs, every bite delivers a rich, savory burst without being overly greasy\u2014an unforgettable Hanoi classic.", "name": "B\u00fan Ch\u1ea3 H\u01b0\u01a1ng Li\u00ean (Obama B\u00fan Ch\u1ea3)", "transport": "About a 4-minute taxi ride from the Hanoi Opera House (approx. 1.2 km)"}, {"address": "13 L\u00f2 \u0110\u00fac, Ph\u1ea1m \u0110\u00ecnh H\u1ed5, Hai B\u00e0 Tr\u01b0ng, Hanoi", "feature": "\u2b50 4.1 Stars | Established in 1979, this iconic ph\u1edf spot is famous for its unique wok-seared beef broth. Beef is stir-fried over high heat to lock in juice before being piled high with fresh scallions. The broth is rich, savory, and infused with robust garlic and scallion flavors. With tender rice noodles absorbing every drop, this is an absolute must-try traditional delicacy for meat lovers in Hanoi.", "name": "Ph\u1edf Th\u00ecn (13 L\u00f2 \u0110\u00fac)", "transport": "About a 10-minute walk from the French Quarter, or a 3-minute taxi ride"}, {"address": "66 T\u00f4 Hi\u1ebfn Th\u00e0nh, B\u00f9i Th\u1ecb Xu\u00e2n, Hai B\u00e0 Tr\u01b0ng, Hanoi", "feature": "\u2b50 4.3 Stars | A famous decades-old establishment serving stone-ground steamed rice rolls made fresh to order. Paper-thin, translucent, and delightfully springy, the rolls encase seasoned minced pork and wood ear mushrooms. Topped with crispy fried shallots and dipped in a warm, sweet-and-savory fish sauce with thick grilled pork slices, its silky texture and aromatic profile make it a daily breakfast favorite among locals.", "name": "B\u00e1nh Cu\u1ed1n B\u00e0 Ho\u00e0nh", "transport": "About a 6-minute taxi ride from the Hanoi Opera House"}, {"address": "64 Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.4 Stars | An upscale traditional fish restaurant near the Hanoi Opera House. Tender fish fillets marinated in turmeric are sizzlingly pan-fried at your table until golden and crisp, then tossed with abundant fresh dill and spring onions. Enjoyed alongside rice vermicelli, roasted peanuts, and rich fermented shrimp paste, the fish is crispy outside, tender inside, and aromatic throughout\u2014a true masterclass in classic Hanoi cuisine.", "name": "Ch\u1ea3 C\u1ea3 L\u1eadp Ph\u1ed1", "transport": "About a 4-minute walk from the Hanoi Opera House"}, {"address": "5B Ph\u1ee7 Do\u00e3n, H\u00e0ng B\u00f4ng, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.3 Stars | A Michelin Bib Gourmand-recommended spot serving traditional chicken ph\u1edf made with tender free-range chicken boasting juicy, springy bites. Choose between soup noodles or dry mixed noodles. The dry noodle version is tossed in a signature tangy sauce with roasted peanuts and crispy garlic, while the soup version features a clean, sweet, and comforting broth\u2014keeping customers coming back for more.", "name": "Ph\u1edf G\u00e0 Nguy\u1ec7t", "transport": "About an 8-minute walk from the southern end of Hoan Kiem Lake"}, {"address": "34 L\u00f2 S\u0169, L\u00fd Th\u00e1i T\u1ed5, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.2 Stars | Founded in 1979, this legendary street food stall serves authentic Vietnamese b\u00e1nh m\u00ec with crisp crusts and soft interiors. Slathered with rich homemade pork liver p\u00e2t\u00e9 and stuffed with thick braised pork, fresh cucumber, and cilantro, every bite blends savory sauces with crispy-soft textures for a quintessential traditional Hanoi street food experience.", "name": "B\u00e1nh M\u1ef3 B\u00e0 D\u1ea7n", "transport": "About a 3-minute walk from the northeast edge of Hoan Kiem Lake, near the northern border of the French Quarter"}, {"address": "39 Nguy\u1ec5n H\u1eefu Hu\u00e2n, L\u00fd Th\u00e1i T\u1ed5, Ho\u00e0n Ki\u1ebfm, Hanoi", "feature": "\u2b50 4.4 Stars | Founded in 1946, this is the original birthplace of Hanoi\u0027s legendary egg coffee. Whisked fresh egg yolks and condensed milk create a silky, tiramisu-like cream top floating over robust, bittersweet Vietnamese espresso. The first sip yields warm, velvety custard flavors followed by deep, bold coffee notes\u2014a harmonious blend of sweet and bitter that makes it Hanoi\u0027s most iconic beverage.", "name": "Gi\u1ea3ng C\u00e0 Ph\u00ea (Original Egg Coffee)", "transport": "About an 8-minute walk from the Hanoi Opera House"}], "name": "Iconic Local Classics"}, "cat_2": {"items": [{"address": "15 Ng\u00f4 Quy\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Inheriting the luxurious romance of Parisian sidewalk cafes, this spot is located on the open-air veranda of a century-old luxury French hotel. The signature Caf\u00e9 au Lait is smooth and silky, combining rich milky aromas with the bittersweet finish of dark roasted coffee beans. Paired with freshly baked French croissants\u2014crispy on the outside with a honeycomb interior packed with rich buttery flavor\u2014it is the ultimate choice for experiencing an elegant, relaxed morning in the French Quarter.", "name": "La Terrasse at Sofitel Legend Metropole", "transport": "Take Bus 02, 08A, or 09A to Ng\u00f4 Quy\u1ec1n Station, then walk about 2 minutes."}, {"address": "6 Phan Chu Trinh, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Located near the Hanoi Opera House, this bistro seamlessly blends traditional Vietnamese drip coffee with modern French bistro style. Their signature \u0027RuNam Special Drip Coffee\u0027 is exceptionally rich and aromatic, offering subtle bitterness balanced with notes of dark chocolate and nuts. For brunch, the Eggs Benedict with Smoked Salmon comes highly recommended\u2014runny egg yolk and tangy Hollandaise sauce burst on the palate for a velvety, refined flavor popular among tourists and young professionals alike.", "name": "RuNam Bistro Phan Chu Trinh", "transport": "Walk about 3 minutes from the side entrance of the Hanoi Opera House."}, {"address": "4 Ng\u00f5 Phan Chu Trinh, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Tucked away in a quiet alley of the French Quarter, this minimalist venue serves top-tier specialty pour-over coffee and ultimate brunch creations. Featuring carefully selected single-origin beans, their pour-over coffee boasts a clean taste with vivid floral and fruity acidity and a long-lasting sweet aftertaste. The signature Sourdough Toast with Avocado and Poached Egg pairs crusty-yet-soft sourdough with creamy avocado spread and a runny egg for a beautifully layered, refined dish.", "name": "Habakuk Fine Coffee \u0026 Bistro", "transport": "Take Bus 02, 34, or 40 to Phan Chu Trinh Station, enter Alley 4, and walk about 1 minute."}, {"address": "91B Th\u1ee3 Nhu\u1ed9m, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Founded by French artisans and dubbed the \u0027Valrhona of Vietnam,\u0027 this flagship bean-to-bar store crafts fine single-origin cocoa treats. Using locally sourced Vietnamese cocoa beans, their signature hot chocolate and specialty mocha coffee offer a rich, bittersweet profile with distinct fruity acidity. Paired with freshly made chocolate mille-feuille\u2014crispy, multi-layered, and filled with rich, perfectly balanced chocolate cream\u2014it is a haven chocolate and coffee lovers cannot miss.", "name": "Maison Marou Flagship Hanoi", "transport": "Take Bus 38 or 40 to Th\u1ee3 Nhu\u1ed9m Station, then walk about 3 minutes."}, {"address": "55 Quang Trung, Nguy\u1ec5n Du, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Housed in a charming red-brick heritage building in the French Quarter, this highly popular aesthetic cafe is known for exquisite pour-over coffee and all-day brunch. The signature Coconut Egg Coffee fuses traditional Vietnamese egg foam with rich coconut notes, delivering a velvety, custard-like texture. Paired with a hearty Full English Breakfast\u2014featuring juicy sausages, crispy bacon, and fluffy scrambled eggs\u2014it offers a satisfying, flavorful meal beloved by young travelers.", "name": "All Day Coffee Quang Trung", "transport": "Take Bus 31, 38, or 52A to Quang Trung Station, then walk about 2 minutes."}, {"address": "11 Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Located directly opposite the historic Tr\u00e0ng Ti\u1ec1n Plaza and Opera House quarter, this iconic spot features nostalgic Viet Cong-themed retro green decor. The classic must-order \u0027Coconut Ice Blended Coffee\u0027 swirls bold Vietnamese dark coffee into sweet, creamy frozen coconut slush. Cool, refreshing, and perfectly balancing bitter and sweet notes, it makes for an ideal refreshing drink while strolling through the French Quarter.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea Tr\u00e0ng Ti\u1ec1n", "transport": "Located near the intersection of Tr\u00e0ng Ti\u1ec1n and Ng\u00f4 Quy\u1ec1n, about a 2-minute walk from the Hanoi Opera House."}, {"address": "24 Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located on Tr\u00e0ng Ti\u1ec1n Street, this authentic French bakery cafe exudes Parisian street charm. Their classic baguette sandwiches feature an ultra-crispy crust with a soft interior, spread with rich pate and topped with fresh ham for a savory, irresistible flavor. Paired with a bold, aromatic espresso, it offers an elegant and authentic French brunch experience.", "name": "Saint Honor\u00e9 Bakery \u0026 Cafe Tr\u00e0ng Ti\u1ec1n", "transport": "Walk about 2 minutes from the main entrance of Tr\u00e0ng Ti\u1ec1n Plaza."}, {"address": "15B Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Hidden along a tree-lined avenue in the French Quarter, this serene heritage cafe radiates a cozy literary vibe filled with retro jazz tunes. Known for specialty pour-over coffee and traditional Vietnamese egg coffee, the egg coffee features a cloud-like, silky-smooth texture with no egginess, blending natural vanilla and rich milky coffee flavors. It is the perfect haven for a peaceful, relaxing morning.", "name": "Tranquil Books \u0026 Coffee Tr\u1ea7n H\u01b0ng \u0110\u1ea1o", "transport": "Take Bus 03A, 11, 40, or 43 to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Station, then walk about 3 minutes."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "4 Le Phung Hieu, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.4 stars | Housed in a luxurious French colonial-style mansion, Ly Club reinterprets traditional Northern Vietnamese local dishes as contemporary fine dining. Highly recommended is their signature \u0027Vietnamese Herb-Grilled Cod\u0027\u2014tender, smooth cod infused with subtle aromas of lemongrass and turmeric, featuring a lightly charred crispy skin and served with a delicious custom fish sauce blend for incredible depth of flavor. Its elegant garden setting and melodious background music make it a favorite among tourists seeking a romantic atmosphere, as well as local dignitaries.", "name": "Ly Club Hanoi", "transport": "About a 3-minute walk from the Hanoi Opera House."}, {"address": "15 Ngo Quyen, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.5 stars | Located inside the legendary Sofitel Legend Metropole, this is one of Hanoi\u0027s oldest and finest French bistros. The restaurant specializes in exquisite haute French cuisine and an extensive wine collection. The signature \u0027Pan-Seared Foie Gras with Roasted Figs\u0027 boasts a buttery, melt-in-your-mouth texture, perfectly balanced by the sweet and tangy figs. The opulently classic French colonial decor transports guests back to the golden era of the 1920s.", "name": "Le Beaulieu - Sofitel Legend Metropole Hanoi", "transport": "Only 200 meters from the Hanoi Opera House, about a 3-minute walk."}, {"address": "15 Ngo Quyen, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.3 stars | Also tucked away in the Sofitel Legend Metropole, Spice Garden focuses on refined Northern Vietnamese local dishes. Its \u0027Vietnamese Sizzling Crepe (B\u00e1nh X\u00e8o)\u0027 features an ultra-crispy crust with a satisfying crunch, stuffed with sweet shrimp, pork, and fresh bean sprouts. Wrapped in leafy herbs and dipped in sweet and sour fish sauce, it is refreshingly juicy without being greasy. The elegant courtyard view enhances the dining experience, making it a top choice for high-end, authentic Vietnamese cuisine.", "name": "Spice Garden Restaurant", "transport": "Located inside Sofitel Legend Metropole, about a 3-minute walk from the Hanoi Opera House."}, {"address": "6 Ngo Quyen, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.2 stars | Housed in a century-old French building, this garden specialty bistro offers a tranquil and sophisticated atmosphere. Be sure to try the \u0027Grilled Lemongrass Beef Skewers\u0027\u2014thick yet tender beef slices packed with flavorful lemongrass and garlic marinade, grilling up to emit an irresistible aroma. Paired with a curated selection of red wines, the flavors complement each other beautifully. The elegant design blends French arches with Vietnamese bamboo craft, making it a highly popular spot for local cuisine.", "name": "Wild Rice Restaurant", "transport": "About a 4-minute walk along Ngo Quyen Street from the Hanoi Opera House."}, {"address": "22 Ngo Quyen, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.2 stars | A refined local bistro infused with Oriental mystique, featuring an open kitchen where guests can admire the chefs\u0027 skills. The signature \u0027Claypot Braised Fish (C\u00e1 Kho T\u1ed9)\u0027 uses fresh local snakehead fish, slow-simmered in a rich caramel soy sauce and black pepper. The firm fish absorbs the savory-sweet sauce, making it deeply flavorful and perfect with rice. The richly textured wooden interior makes it a favorite for foodies seeking traditional Vietnamese flavors and cocktails.", "name": "Club De L\u0027Orientale", "transport": "About a 5-minute walk from the Hanoi Opera House."}, {"address": "2B Phan Chu Trinh, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.2 stars | A cozy and exquisite French bistro located in the heart of the French Quarter, serving authentic French home-style cooking and cheese platters. The must-order \u0027Duck Confit (Confit de Canard)\u0027 boasts a golden, crispy skin while keeping the meat exceptionally tender and juicy, falling off the bone with ease. Paired with a glass of mature Bordeaux wine, the rich and cozy bistro vibe attracts many expats and travelers in Hanoi.", "name": "Au Delice French Restaurant", "transport": "Located right behind the Hanoi Opera House, about a 2-minute walk."}, {"address": "27J Hai Ba Trung, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.4 stars | An iconic upscale American and European steakhouse bistro in the French Quarter, renowned for its premium imported steaks and professional sommelier service. The signature \u0027Australian Angus Ribeye\u0027 is grilled to perfection, searing in juicy goodness while leaving a rosy-pink interior. Tender and bursting with rich beef flavor, it pairs luxuriously with truffle mashed potatoes and a robust red wine. The atmosphere is elegant and refined, ideal for business dinners or romantic dates.", "name": "Jacksons Steakhouse", "transport": "About a 6-minute walk from the Hanoi Opera House."}, {"address": "59A Ly Thai To, Trang Tien, Hoan Kiem, Ha Noi", "feature": "\u2b50 4.3 stars | A classic bistro combining gourmet French culinary creations with an upscale bar, complete with an open-air balcony overlooking the tree-lined avenues of the French Quarter. Highly recommended is the \u0027Pan-Seared French Scallops with Green Pea Pur\u00e9e\u0027\u2014lightly golden on the outside, tender and sweet inside, served over a smooth green pea pur\u00e9e with lemon butter sauce for a fresh, layered taste of the sea. Featuring live music and signature cocktails in the evening, it is a premier spot to soak up Hanoi\u0027s French romance and nightlife.", "name": "Press Club Hanoi", "transport": "Just about a 3-minute walk from the Hanoi Opera House."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "34 H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Located in the heart of the French Quarter, this upscale vegetarian restaurant seamlessly blends Buddhist philosophy with modern French architecture. Its signature \u0027Special Plant-based Pho\u0027 features a rich broth slow-cooked with sweet corn, radishes, and botanical spices, offering a warm and naturally sweet taste. Served with silky handmade rice noodles and flavorful vegetarian meat slices, it is light, refreshing, and guilt-free. The exquisite French garden landscaping and tranquil atmosphere make it a sanctuary away from the hustle and bustle for both tourists and local business professionals.", "name": "Uu Dam Chay (\u01afu \u0110\u00e0m Chay)", "transport": "About a 7-minute walk from the Hanoi Opera House; walk along Tr\u00e0ng Ti\u1ec1n Street and turn onto H\u00e0ng B\u00e0i Street."}, {"address": "67 L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Situated on an elegant, tree-lined French boulevard, this restaurant is famous for its floating lotus-themed private dining rooms and natural elements. The must-try \u0027Grilled Lion\u0027s Mane Mushroom with Special Sauce\u0027 is meaty and juicy; perfectly charred on the outside, it mimics a premium steak with a tender interior. Meanwhile, the \u0027Thai-style Tom Yum Vegetarian Soup\u0027 is tangy, appetizing, and rich in herbal aromas. Its unique Oriental aesthetics and brilliant culinary techniques make it one of Hanoi\u0027s most acclaimed fine dining vegetarian landmarks.", "name": "Vi Lai Vegetarian Restaurant (Chay V\u1ecb Lai)", "transport": "Take a Grab or taxi to the intersection of L\u00fd Th\u01b0\u1eddng Ki\u1ec7t and Qu\u00e1n S\u1ee9 streets; located inside a historic French building."}, {"address": "87 L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | \u0027Sadhu\u0027 means \u0027goodness/blessing,\u0027 and this spot specializes in an elegant \u00e0 la carte vegetarian buffet. Their \u0027Vietnamese Vegetarian Fried Spring Rolls\u0027 feature a crispy, golden-brown crust that yields a satisfying crunch, filled with shredded wood ear mushrooms, taro, and sweet potato that offer a fluffy, naturally sweet interior. Paired with a special sweet-and-sour dipping sauce, the flavor layers are incredibly rich. Elegant wooden d\u00e9cor and warm service make it a favorite for lovers of refined Asian vegetarian dining.", "name": "Sadhu Vegetarian Restaurant", "transport": "About an 8-minute walk from Hanoi Railway Station, or a 5-minute Grab ride from the center of the French Quarter."}, {"address": "79B L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Established in 1995, this is Hanoi\u0027s very first restaurant dedicated to traditional Vietnamese vegetarian cuisine, tucked away in a quiet courtyard of an old French house. The signature \u0027Vegetarian Sugarcane Shrimp\u0027 wraps sugarcane sticks in seasoned bean curd skin and mashed taro before deep-frying; it\u0027s crispy on the outside, chewy inside, and infused with natural sweetness from the sugarcane. Their \u0027Stir-fried Seasonal Vegetables with Mushrooms\u0027 bursts with wok hei. Both old-time Hanoians and travelers seeking authentic flavors cherish its simple yet highly skilled traditional cooking.", "name": "Nang Tam Vegetarian Restaurant (C\u01a1m Chay N\u00e0ng T\u1ea5m)", "transport": "Located in an alley off L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Boulevard, about a 12-minute walk from the Opera House."}, {"address": "48 Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Located right next to the Hanoi Opera House, this modern hipster-style organic vegetarian eatery is immensely popular with Western tourists and young locals. Highly recommended is the \u0027Hummus and Grilled Vegetable Quesadilla\u0027\u2014the tortilla is toasted to a slight crisp, stuffed with silky-smooth hummus that pairs seamlessly with sweet grilled bell peppers and herbs. Every bite is packed with pure, natural flavor. Its lively neighborhood vibe and low-oil cooking philosophy make it a perfect refuel stop after sightseeing.", "name": "The Veg - Organic Vibe", "transport": "Just a 3-minute walk from the main entrance of the Hanoi Opera House, walking straight along Tr\u00e0ng Ti\u1ec1n main street."}, {"address": "109 Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, C\u1eeda Nam, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Situated on a broad, tree-lined avenue in the French Quarter, this spot offers an incredibly budget-friendly and abundant vegetarian buffet. The made-to-order \u0027Vegetarian B\u00e1nh X\u00e8o\u0027 features an ultra-crispy golden crepe filled with juicy bean sprouts, mung beans, and mushrooms. Wrapped in fresh lettuce and drizzled with custom vegan fish sauce, it\u0027s crunchy, savory, and non-greasy. With a vast array of traditional Vietnamese vegetarian dishes and a warm, homey atmosphere, it draws lively crowds at both lunch and dinner.", "name": "An Lac Vegetarian Buffet (Nh\u00e0 H\u00e0ng Chay An L\u1ea1c)", "transport": "Take a bus or taxi to Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Street, near the C\u1eeda Nam intersection."}, {"address": "21 Ng\u00f4 V\u0103n S\u1edf, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Tucked away in an artistic alley of the French Quarter, this refined vegetarian buffet restaurant rotates its creative selection of Vietnamese and Western dishes daily. The \u0027Crispy Fried Mushrooms with Passion Fruit Sauce\u0027 comes highly recommended\u2014lightly battered and fried to perfection, releasing hot mushroom juices upon bite, complemented by a tangy, fragrant passion fruit dip. Its sleek Nordic-style d\u00e9cor and exceptionally fresh ingredients draw a steady stream of international travelers and local professionals.", "name": "Vegito Vegetarian Buffet (Nh\u00e0 H\u00e0ng Chay Vegito)", "transport": "Turn into the quiet alley of Ng\u00f4 V\u0103n S\u1edf from Tr\u1ea7n H\u01b0ng \u0110\u1ea1o Boulevard; walk for about 2 minutes to spot the sign surrounded by greenery."}, {"address": "65 Qu\u00e1n S\u1ee9, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located near Qu\u00e1n S\u1ee9 Pagoda on the edge of the French Quarter, this classic vegetarian eatery radiates a serene Buddhist vibe. The must-try \u0027Braised Bamboo Shoots and Tofu Pot\u0027 slow-simmers fresh bamboo shoots and tofu; the bamboo is crisp and naturally sweet, while the tender tofu soaks up the savory mushroom broth, bursting with comforting flavor in every bite. With its unpretentious, natural dishes and affordable prices, it is the top choice to experience Hanoi\u0027s authentic temple-style vegetarian culture.", "name": "Bo De Chay Restaurant (B\u1ed3 \u0110\u1ec1 Chay)", "transport": "Located on Qu\u00e1n S\u1ee9 Street, directly opposite the famous ancient Qu\u00e1n S\u1ee9 Pagoda; about a 3-minute drive from the center of the French Quarter."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "35 P. Tr\u00e0ng Ti\u1ec1n, Tr\u00e0ng Ti\u1ec1n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Founded in 1958, Tr\u00e0ng Ti\u1ec1n Ice Cream is undeniably the most iconic walking dessert around the French Quarter and Hanoi Opera House! Drawing massive crowds of locals and tourists daily, its most legendary offerings are the classic popsicles in Mung Bean (\u0110\u1eadu Xanh), Taro (Khoai M\u00f4n), and Coconut (D\u1eeba) flavors. Each bite offers a rich, dense, and creamy texture where bean and milky aromas melt seamlessly\u2014refreshing without being overly sweet. Their custom waffle cones are freshly made and crispy, making a perfect match with the creamy ice cream. Grab a popsicle and stroll along the French-inspired tree-lined boulevards by the Opera House for an authentic taste of Hanoi\u0027s romantic, nostalgic charm.", "name": "Iconic Tr\u00e0ng Ti\u1ec1n Ice Cream (Kem Tr\u00e0ng Ti\u1ec1n)", "transport": "About a 3-minute walk from the Hanoi Opera House."}, {"address": "31 P. L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Tucked away on a street corner along L\u00fd Th\u01b0\u1eddng Ki\u1ec7t in the French Quarter, this humble stall is celebrated as one of Hanoi\u0027s finest street breakfasts. Specializing in traditional sticky rice with mung bean paste (X\u00f4i X\u00e9o), the piping-hot steamed sticky rice is delightfully chewy and distinct. Watch in awe as the vendor swiftly shaves a generous layer of steamed mung bean paste over the rice, topped off with a drizzle of fragrant chicken fat and crispy fried golden shallots. Soft, aromatic, and savory, you can also add Chinese sausage or barbecue pork for an extra rich kick. Simple yet deeply satisfying, it\u0027s a staple for local office workers and foodies alike\u2014a must-try breakfast to experience Hanoi\u2019s morning vitality.", "name": "X\u00f4i M\u00e2y Sticky Rice (X\u00f4i M\u00e2y L\u00fd Th\u01b0\u1eddng Ki\u1ec7t)", "transport": "Take bus 02, 08A, or 09A to L\u00fd Th\u01b0\u1eddng Ki\u1ec7t station, then walk about 1 minute."}, {"address": "28 P. H\u00e0m Long, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Situated directly opposite H\u00e0m Long Church, this iconic snack spot is highly favored by Hanoi\u0027s youth and visitors. The signature dried beef salad features shredded green papaya and carrots as a crisp base, topped with generous slices of seasoned dried beef, beef offal, fresh cilantro, crushed roasted peanuts, and a splash of tangy, sweet, and lightly spiced signature fish sauce dressing. Amazingly crunchy, juicy, and flavorful with a chewy savory beef punch, it bursts with layered tastes. Though the setup is humble, it offers a slice of local street life and makes an incredible refreshing afternoon snack.", "name": "H\u00e0m Long Dried Beef Salad (N\u1ed9m B\u00f2 Kh\u00f4 H\u00e0m Long)", "transport": "Just a 1-minute walk from H\u00e0m Long Church in the French Quarter."}, {"address": "16 P. Ng\u00f4 Th\u00ec Nh\u1eadm, Ph\u1ea1m \u0110\u00ecnh H\u1ed5, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Nestled on Ng\u00f4 Th\u00ec Nh\u1eadm Street at the edge of the French Quarter, Ch\u00e8 M\u01b0\u1eddi S\u00e1u is a historic sweet soup shop carrying decades of culinary tradition. It specializes in authentic Vietnamese sweet soups (Ch\u00e8), with crowd favorites including sweet mung bean with water chestnut, lotus seed, and black bean soups. The beans are slow-cooked to silky, melt-in-your-mouth perfection with a subtle sweetness that never feels overwhelming. Served over crushed ice in the summer for a cooling treat, or hot with rice balls and glutinous rice porridge in the winter, locals love its unpretentious, time-tested nostalgic flavor. Affordable and wholesome, it\u0027s a charming gem for traditional desserts.", "name": "Ch\u00e8 M\u01b0\u1eddi S\u00e1u Traditional Dessert (Ch\u00e8 M\u01b0\u1eddi S\u00e1u)", "transport": "About a 5-minute taxi ride from Hanoi Opera House, or a 10-minute walk down Ng\u00f4 Th\u00ec Nh\u1eadm Street."}, {"address": "30 P. H\u00e0n Thuy\u00ean, Ph\u1ea1m \u0110\u00ecnh H\u1ed5, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located on H\u00e0n Thuy\u00ean Street, this popular stall seamlessly blends French beef stew traditions with Vietnamese local street dining. Their signature Red Wine Beef Stew (B\u00e1nh M\u00ec S\u1ed1t Vang) features tender beef brisket simmered for hours with aromatic herbs, spices, and red wine, yielding a rich, savory dark-red gravy infused with fragrant wine notes. Paired with a freshly toasted Vietnamese baguette\u2014crispy on the outside and airy inside\u2014tearing a piece off and dipping it into the piping-hot stew creates a burst of deep flavor. Enjoying this French-influenced street delight in the French Quarter offers a wonderfully atmospheric culinary experience.", "name": "H\u00e0n Thuy\u00ean Red Wine Beef Stew B\u00e1nh M\u00ec (B\u00e1nh M\u00ec S\u1ed1t Vang H\u00e0n Thuy\u00ean)", "transport": "About a 6-minute walk south from the Hanoi Opera House."}, {"address": "66 P. T\u00f4 Hi\u1ebfn Th\u00e0nh, L\u00ea \u0110\u1ea1i H\u00e0nh, Hai B\u00e0 Tr\u01b0ng, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | A legendary spot operating for decades, B\u00e0 Ho\u00e0nh is celebrated for its exquisite craft of traditional steamed rice rolls. Made from fine ground rice batter and steamed fresh to order, the delicate rice sheets are paper-thin and translucent, filled with minced pork and wood ear mushrooms (or served plain vegetarian style). Accompanied by warm house-made dipping fish sauce, crispy fried shallots, and sliced Vietnamese pork sausage (Ch\u1ea3 L\u1ee5a), each bite is silky smooth with a subtle rice aroma and a delightful sweet-savory crunch. Tucked along a leafy avenue, it draws crowds every morning and lunch hour and is widely considered an indispensable Hanoi street food milestone.", "name": "B\u00e0 Ho\u00e0nh Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n B\u00e0 Ho\u00e0nh)", "transport": "About a 7-minute taxi ride from the Hanoi Opera House."}, {"address": "28 P. H\u00e0m Long, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | This vibrant stall on H\u00e0m Long Street is a fantastic spot to experience Hanoi\u0027s traditional fried treats and chewy dumplings. The star item, Fried Shrimp Cakes (B\u00e1nh T\u00f4m), features whole shell-on fresh shrimp battered and deep-fried to golden perfection, offering an insanely crunchy bite filled with sweet shrimp flavor. Another standout, Tapioca Dumplings (B\u00e1nh B\u1ed9t L\u1ecdc), boasts translucent, delightfully chewy skins wrapping seasoned shrimp and pork fillings. Wrap them in fresh herbs and lettuce leaves, then dip into their sweet-tangy signature fish sauce for a light, multi-textured, irresistibly crisp-and-chewy afternoon bite beloved by local youth.", "name": "H\u00e0m Long Fried Shrimp Pancakes \u0026 Tapioca Dumplings (B\u00e1nh T\u00f4m \u0026 B\u00e1nh B\u1ed9t L\u1ecdc H\u00e0m Long)", "transport": "Located on H\u00e0m Long Street, just a 1-minute walk from the famous H\u00e0m Long Church in the French Quarter."}, {"address": "35 P. L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Tucked into an alley corner along L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Street, this vendor specializes in piping-hot Vietnamese fried rice donuts (B\u00e1nh R\u00e1n). The signature savory fried donuts feature a crust crafted from glutinous rice flour and mashed potatoes, deep-fried until golden and crispy on the outside while delightfully chewy within. The generous filling combines wood ear mushrooms, glass noodles, seasoned minced pork, and aromatic spices. Taking a bite straight out of the fryer yields a juicy, savory burst, accompanied by a bowl of tangy green papaya dipping fish sauce to balance out the richness. Especially popular on breezy afternoons and cooler months, it consistently draws long queues of eager food lovers.", "name": "L\u00fd Th\u01b0\u1eddng Ki\u1ec7t Savory Fried Rice Balls (B\u00e1nh R\u00e1n M\u1eb7n L\u00fd Th\u01b0\u1eddng Ki\u1ec7t)", "transport": "Take bus 02, 08A, or 09A to L\u00fd Th\u01b0\u1eddng Ki\u1ec7t station, then walk about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "French Quarter and Opera District"}, "gia_lam_ocean_park": {"categories": {"cat_1": {"items": [{"address": "S\u1ed1 8, Ng\u00f5 1, Giang Cao, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Located in the Bat Trang Ceramic Village of Gia Lam, Hanoi, this iconic restaurant serves \u0027Canh M\u0103ng M\u1ef1c\u0027 (Dried Squid and Bamboo Shoot Soup), a unique century-old traditional dish. Adhering strictly to traditional methods, hand-shredded dried squid and finely shredded mountain bamboo shoots are slow-simmered for hours. The broth is exceptionally sweet and savory, blending rich ocean notes with the fresh aroma of bamboo shoots. The squid strips are pleasantly chewy while the bamboo shoots remain crisp and flavorful. Highly beloved by local foodies and tourists alike, it represents the absolute pinnacle of Hanoi\u0027s traditional banquet culinary culture.", "name": "Bat Trang Traditional Dried Squid \u0026 Bamboo Shoot Soup - Xuan Thuyet (Nh\u00e0 H\u00e0ng M\u0103ng M\u1ef1c B\u00e1t Tr\u00e0ng - Xu\u00e2n Thuy\u1ebft)", "transport": "Take Bus 47A from central Hanoi to B\u00e1t Tr\u00e0ng station, then walk for about 5 minutes."}, {"address": "X\u00f3m 1, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A longstanding local pho institution nestled inside the ancient ceramic village. For decades, they have insisted on simmering pure beef bones with a blend of traditional Northern Vietnamese spices in huge pots for over 12 hours. The rich yet clear broth bursts with natural sweetness and aromatic beef tallow aroma, complemented by hand-sliced thick tender beef slices, silky smooth rice noodles, and a fresh sprinkle of scallions and cilantro. Locals and travelers gather here every morning for an authentic Northern Vietnamese breakfast experience.", "name": "Bat Trang Traditional Beef Pho (Ph\u1edf C\u1ed5 Truy\u1ec1n B\u00e1t Tr\u00e0ng)", "transport": "Take a Grab taxi or Bus 47A to the entrance of B\u00e1t Tr\u00e0ng Village, then walk into the Old Street Market."}, {"address": "154 Ng\u00f4 Xu\u00e2n Qu\u1ea3ng, Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A hidden gem for Bun Cha tucked away in Trau Quy Town, Gia Lam District. Fresh pork is marinated in a secret blend of spices and grilled over traditional glowing charcoal, imparting a rich smoky flavor. The grilled pork patties are charred on the outside and tender inside, while the slices of pork belly are juicy and flavorful without being overly greasy. Paired with a perfectly balanced sweet-and-sour fish sauce dipping broth, fresh herbs, and soft rice vermicelli, every bite offers rich layerings of taste. An exceptional spot to experience authentic local comfort food.", "name": "Co Hang Traditional Bun Cha - Trau Quy (B\u00fan Ch\u1ea3 C\u00f4 H\u1eb1ng - Tr\u00e2u Qu\u1ef3)", "transport": "Take electric bus E01 or E03 to Ng\u00f4 Xu\u00e2n Qu\u1ea3ng station, then walk for about 2 minutes."}, {"address": "Th\u00f4n Giang Cao, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Steeped in classic Northern Vietnamese rustic charm, this renowned restaurant is famous for recreating traditional home-style cooking from the Gia Lam area. Signature dishes include pan-fried squid cakes, braised stream fish, and traditional Bat Trang duck soup with bamboo shoots. Using fresh local ingredients, the squid cakes are incredibly springy and packed with sweet juices, while the stewed soups are savory and comforting. Rustic bamboo decor combined with ceramic tableware creates an authentic vintage ambiance for savoring genuine Hanoi rural flavors.", "name": "Don Ganh Traditional Vietnamese Restaurant (Nh\u00e0 H\u00e0ng \u0110\u00f2n G\u00e1nh B\u00e1t Tr\u00e0ng)", "transport": "Drive or take Bus 47A to the entrance of B\u00e1t Tr\u00e0ng Ceramic Village, then transfer to an electric buggy or walk for 6 minutes."}, {"address": "K\u0110T H\u00e0 Quang, Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | A legendary restaurant in Gia Lam specializing in traditional buffalo and yellow beef dishes. Using strictly selected fresh local meat, they excel in signature grilling and garlic stir-fry techniques. Must-try dishes include stir-fried tender beef with garlic\u2014succulent and aromatic\u2014and hot-stone grilled beef that locks in rich juices and offers satisfying chewiness. Always packed with local families and visiting food lovers, this is a must-visit destination for tasting traditional Red River Delta meat delicacies.", "name": "Trau Ngon Quan Hot Stone Beef \u0026 Buffalo Restaurant (Tr\u00e2u Ngon Qu\u00e1n - Tr\u00e2u Qu\u1ef3 Gia L\u00e2m)", "transport": "Take Bus E02 to Tr\u00e2u Qu\u1ef3 People\u0027s Committee station, then take a 5-minute Grab ride."}, {"address": "Ch\u1ee3 B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | A historic food stall serving handcrafted steamed rice rolls across generations. Using stone-ground rice batter spread thinly over cloth steamers, the delicate sheets are paper-thin and translucent, wrapping a savory filling of stir-fried minced pork and wood ear mushrooms. Steamed fresh to order, these smooth, melt-in-your-mouth rolls are drizzled with homemade scallion oil and served with warm seasoned fish sauce and crispy fried shallots. Highly addictive with its subtle sweet-and-sour profile, it remains a nostalgic local favorite.", "name": "Bat Trang Traditional Steamed Rice Rolls (B\u00e1nh Cu\u1ed1n N\u00f3ng C\u1ed5 Truy\u1ec1n B\u00e1t Tr\u00e0ng)", "transport": "Take Bus 47A to the B\u00e1t Tr\u00e0ng terminus and enter the B\u00e1t Tr\u00e0ng Traditional Market."}, {"address": "88 Giang Cao, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | A famous local spot in Giang Cao Village, Gia Lam, serving classic crispy tofu with vermicelli and fermented shrimp paste (Bun Dau Mam Tom). The tofu is fried to golden crisp perfection while remaining silky-soft like tofu pudding inside. Served alongside freshly fried pork intestine, blood sausage, and homemade pork patties, it is paired with thick fermented shrimp paste whipped with fresh kumquat juice and chili. The rich mix of savory, tangy, and spicy flavors delivers an authentic Northern Vietnamese taste sensation that attracts devoted foodies from afar.", "name": "Giang Cao Bun Dau Mam Tom (B\u00fan \u0110\u1eadu M\u1eafm T\u00f4m Giang Cao)", "transport": "Take Bus 47A to B\u00e1t Tr\u00e0ng station, then walk for about 8 minutes."}, {"address": "\u0110\u01b0\u1eddng L\u00fd Th\u00e1nh T\u00f4ng, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Famous for bringing traditional Ninh Binh-style goat hotpot and scorched rice dishes to Gia Lam. The goat meat is slow-stewed with traditional herbs and sugarcane, yielding tender, melt-in-your-mouth meat without gameiness, and a nourishing, naturally sweet broth. Dipping golden, crispy rice crusts into the thick goat meat broth creates an irresistible texture and intense savory aroma. Highly acclaimed by both locals and visitors.", "name": "Gia Lam Ninh Binh Style Goat Hotpot \u0026 Crispy Rice (L\u1ea9u D\u00ea \u0026 C\u01a1m Ch\u00e1y Ninh B\u00ecnh - Gia L\u00e2m)", "transport": "Take VinBus E01 or E03 from Vinhomes Ocean Park to the L\u00fd Th\u00e1nh T\u00f4ng intersection, then walk for 3 minutes."}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "S2.08, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | An Instagram-worthy scenic cafe located inside Ocean Park, featuring a Korean-inspired light luxury style and incredible views. Their signature French toast platter is crispy on the outside and soft inside, paired with a special vanilla egg wash and maple syrup for a velvety smooth texture. The distinctive emerald fruit tea and smooth caffe latte are hugely popular among tourists and local youth, making it an excellent choice for morning relaxation and enjoying brunch.", "name": "Lofita Tea \u0026 Coffee (Vinhomes Ocean Park)", "transport": "Take Oceanbus route 02 to the S2.08 Building station, then walk for about 2 minutes."}, {"address": "Bi\u1ec3n H\u1ed3 01, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | A popular cafe chain filled with retro Viet Cong hipster aesthetics, located along the lake in Ocean Park. A must-try here is the signature Coconut Smoothie Coffee, blending rich authentic Vietnamese coffee with sweet, creamy coconut smoothie for a cool, perfectly balanced bittersweet taste. Pair it in the morning with hot freshly baked baguette dipped in condensed milk to fully enjoy an authentic Vietnamese morning brunch.", "name": "C\u1ed9ng C\u00e0 Ph\u00ea (Vinhomes Ocean Park)", "transport": "Take VinBus E02 to Vincom Mega Mall station, then walk about 5 minutes to the lakeside near the artificial beach."}, {"address": "1st Floor, Vincom Mega Mall Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | One of Vietnam\u0027s most famous domestic coffee brands, located inside the large shopping mall in Gia L\u00e2m district. Their signature iced milk coffee uses dark-roasted Robusta beans, offering a bold and robust body with chocolate and nutty roasted aromas, perfectly balanced with sweet condensed milk. Morning options include classic B\u00e1nh M\u00ec and various cheesecakes\u2014the crispy Vietnamese baguette stuffed with savory pate and pickled veggies is a favorite breakfast combo among locals.", "name": "Highlands Coffee (Vincom Mega Mall Ocean Park)", "transport": "Take VinBus E01 or E03 directly to Vincom Mega Mall Ocean Park station, located on the 1st floor of the mall."}, {"address": "Shophouse S1.01, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A popular cafe featuring a spacious, bright environment and modern wooden design, highly favored by independent travelers and business guests. Their signature Peach Orange Lemongrass Tea is refreshingly flavorful, and their morning coffee is top-notch. Paired with a pressed ham and cheese sandwich\u2014crispy golden toasted bread filled with gooey, savory melted cheese\u2014every bite brings pure delight, making it a benchmark spot for a relaxing brunch in Gia L\u00e2m.", "name": "The Coffee House (Vinhomes Ocean Park)", "transport": "Take VinBus E02 to the bus stop in front of Building S1.01, then walk for 1 minute."}, {"address": "Ph\u1ed1 San H\u00f4, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | A trendy coffee brand that took Saigon by storm, equally popular at its Gia L\u00e2m Ocean Park branch. Their specialty Avocado Cream Cheese Coffee seamlessly blends smooth fresh avocado with dark roast coffee, rich and sweet without being heavy. Their brunch French croissants feature flaky layers with a soft, airy interior that releases a rich buttery aroma with every bite, loved by young locals and tourists alike.", "name": "Katinat Saigon Kafe (Ocean Park)", "transport": "Take Oceanbus route 01 to the San H\u00f4 (Coral Zone) station, then walk for about 3 minutes."}, {"address": "Shophouse Ng\u1ecdc Trai 06, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | A local Vietnamese coffee chain emphasizing open-air street corner vibes with a lively street social atmosphere. Their signature B\u1ea1c X\u1ec9u (white coffee) is rich in milk with balanced bitterness, refreshing and thirst-quenching. They also offer traditional toasted B\u00e1nh M\u00ec and snacks with extra crispy crusts and savory fillings\u2014perfect for tourists looking to experience authentic Hanoi street cafe culture for brunch.", "name": "Aha Coffee (Ocean Park Gia L\u00e2m)", "transport": "Take VinBus E03 to the Ng\u1ecdc Trai (Pearl Zone) station, then walk about 2 minutes to spot the green sign."}, {"address": "Ph\u1ed1 H\u1ea3i \u00c2u, Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | A specialty cafe combining Hanoi\u0027s traditional street coffee stool culture with modern comfort. Their classic egg coffee features meticulously whipped fresh egg yolks creating a custard-like smooth foam over strong hot coffee\u2014sweet, velvety, and completely odorless. Paired with freshly toasted buttered toast in the morning, the sweet caramelized flavor is unforgettable, making it a top choice for an authentic Hanoi coffee breakfast.", "name": "Kafa Caf\u00e9 (Gia L\u00e2m Ocean Park)", "transport": "Take Oceanbus 02 to the H\u1ea3i \u00c2u (Seagull Zone) station, then walk along the lakeside for about 4 minutes."}, {"address": "G Floor, Vincom Mega Mall Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A century-old heritage tea and coffee brand renowned across Vietnam, featuring a spacious and bright modern branch in Gia L\u00e2m. Their signature High-Mountain Oolong Milk Tea and concentrated Vietnamese black coffee boast rich, lasting aromas. Paired with specialty toasted bread topped with pork floss and French spreads, offering a crispy exterior and savory-sweet filling, it delivers a deeply satisfying brunch experience highly praised by local residents and travelers alike.", "name": "Ph\u00fac Long Coffee \u0026 Tea (Ocean Park Gia L\u00e2m)", "transport": "Take VinBus E01 or E02 to the Vincom Mega Mall station, then enter the G Floor lobby to find it."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Villa 01-02, San H\u1ea1n 1, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Located in the Ocean Park special zone, this highly prestigious Hanoi specialty restaurant presents Northern Vietnamese traditional country buffalo dishes in a modern, sophisticated bistro setting. Popular signature items include Stir-fried Buffalo Beef with Scallions, featuring firm, juicy meat with rich aromas of local herbs and lemongrass, as well as the Hot \u0026 Sour Buffalo Hotpot with an appetizing, flavorful broth. High ceilings and a spacious atmosphere make it a favorite for local families and foreign tourists alike.", "name": "Tr\u00e2u Ngon Qu\u00e1n - Buffalo Cuisine Specialty Restaurant (Tr\u00e2u Ngon Qu\u00e1n - Vinhomes Ocean Park)", "transport": "About 30 minutes by Grab or private car from Hanoi city center, or take VinBus E01 or E03 to Vinhomes Ocean Park station and walk."}, {"address": "1st Floor, Vincom Mega Mall Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Bringing classic Central Vietnamese royal and local dishes to Gia L\u00e2m, combined with a comfortable bistro atmosphere. The signature B\u00fan B\u00f2 Hu\u1ebf (Hue Beef Noodle Soup) features a rich, spicy broth with tender beef and chewy rice noodles for incredible texture. The crispy Vietnamese Pancake (B\u00e1nh X\u00e8o) is fried to golden perfection, stuffed with fresh shrimp and pork, and served with a special dipping fish sauce that keeps you coming back for more.", "name": "N\u00e9t Hu\u1ebf - Ancient Capital Cuisine (N\u00e9t Hu\u1ebf - Ocean Park)", "transport": "Take VinBus E02 or E03 directly to Vincom Mega Mall Ocean Park; it is located on the 1st floor inside the mall."}, {"address": "Shop S2.08, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | A refined claypot rice bistro blending Southeast Asian flavors with local Vietnamese spices. The signature double-sided crispy rice crust offers a satisfying crunch, paired with tender beef or seafood in a special black pepper sauce that is savory, rich, and delightfully smoky. The modern, bright interior makes it a perfect spot to enjoy a piping hot meal after spending time at the artificial beach.", "name": "C\u01a1m Ni\u00eau Singapore Lion City - Claypot Rice \u0026 Specialties (C\u01a1m Ni\u00eau Singapore - Ocean Park)", "transport": "Take VinBus to Ocean Park S2 Zone bus stop, then walk for about 3 minutes."}, {"address": "Shophouse HA02-28, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | An exquisite specialty restaurant dedicated to Hanoi\u0027s century-old classic dish, Grilled Fish (Ch\u1ea3 C\u1ea3). Fresh sturgeon pieces are marinated in turmeric and a special sauce, then pan-seared tableside in a small copper pan with plenty of dill and scallions. Crispy on the outside, tender and juicy on the inside, it is served alongside rice vermicelli, peanuts, and fermented shrimp paste (M\u1eafm T\u00f4m)\u2014an essential northern traditional flavor you shouldn\u0027t miss in Gia L\u00e2m.", "name": "Ch\u1ea3 C\u1ea3 H\u00e0 Th\u00e0nh - Traditional Grilled Fish Restaurant (Ch\u1ea3 C\u1ea3 H\u00e0 Th\u00e0nh - Gia L\u00e2m)", "transport": "Take VinBus E01 or Grab taxi directly to the H\u1ea3i An zone in Ocean Park."}, {"address": "Hamlet 3 (X\u00f3m 3), B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Located in the famous B\u00e1t Tr\u00e0ng Ceramic Village in Gia L\u00e2m, this restaurant deeply integrates traditional ceramic craft with Northern farm-style local cuisine. Dishes are served in beautiful ceramic tableware. Signature highlights include Dried Bamboo Shoot \u0026 Squid Stewed Pork Trotters Soup (Canh M\u0103ng M\u1ef1c), known for its rich, sweet broth and savory squid aroma, as well as Traditional Bamboo Tube Roasted Chicken, infused with bamboo leaf fragrance, featuring crispy golden skin and tender, juicy meat.", "name": "Nh\u00e0 H\u00e0ng B\u00e1t Tr\u00e0ng - Ceramic Village Heritage Cuisine (Nh\u00e0 H\u00e0ng \u1ea8m Th\u1ef1c B\u00e1t Tr\u00e0ng)", "transport": "Take Bus 47A from Hanoi city center directly to B\u00e1t Tr\u00e0ng Terminal and walk about 5 minutes; or take a taxi from Ocean Park for about 15 minutes."}, {"address": "San H\u01a1 16, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | Situated right next to the giant saltwater lagoon and artificial beach at Ocean Park, offering wonderful views and a relaxing vibe. Featuring live fresh seafood and craft beer, popular items include Salt \u0026 Pepper Baked Flower Crab\u2014sweet, firm, and deliciously spiced\u2014paired with Thai-style Hot \u0026 Sour Steamed Clams. Sitting outdoors in the evening with a refreshing breeze and illuminated surroundings feels like a true vacation getaway.", "name": "Gi\u00f3 Bi\u1ec3n Seafood \u0026 Bistro - Artificial Beach Seafood Bistro (Nh\u00e0 H\u00e0ng H\u1ea3i S\u1ea3n Gi\u00f3 Bi\u1ec3n)", "transport": "Take VinBus to Ocean Park Water Park/Beach stop, then walk for 2 minutes."}, {"address": "TCV-02, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | An elegant and refined hotpot bistro specializing in premium wellness mushrooms and top-tier meats. The broth is slow-simmered for hours using over a dozen wild mushroom varieties, rendering a rich, sweet, and aromatic base. Dipping prime Angus beef and truffle mushrooms yields tender textures coated in flavorful essence\u2014refreshing, hearty, and highly acclaimed by health-conscious food lovers.", "name": "L\u1ea9u N\u1ea5m Ashima - Wellness Mushroom Hotpot Bistro (Ashima Mushroom Hotpot - Ocean Park)", "transport": "Take VinBus E03 to Vinhomes Ocean Park Commercial Zone and walk to the destination."}, {"address": "Shophouse S1.01, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | A cozy bistro combining comforting Northern Vietnamese home-cooked comfort food with a modern lounge vibe. Popular options include Braised Pork Belly with Quail Eggs\u2014melt-in-your-mouth tender pork belly soaked in a flavorful, savory sauce\u2014and Roasted Herb Fish featuring crispy skin and juicy, tender meat. The bar also serves unique craft cocktails infused with local herbs and tropical fruits, making it a great spot for regional flavors and evening relaxation.", "name": "B\u1ebfp M\u1eb9 Ngo\u1eafc - Northern Home-Style Cooking \u0026 Craft Cocktails (B\u1ebfp M\u1eb9 Ngo\u1eafc Bistro - Ocean Park)", "transport": "Take VinBus E01 or E02 to Ocean Park S1 Zone, then walk for about 1 minute."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "S2.02 Vinhomes Ocean Park, Gia Lam, Hanoi", "feature": "\u2b50 4.7 stars | A top-tier fine dining vegetarian restaurant located inside Ocean Park, specializing in reshaping traditional Vietnamese ingredients with contemporary aesthetics. The signature shiitake mushroom and tofu claypot is rich and flavorful, with silky smooth tofu absorbing the special herbal sauce. Paired with crispy vegetarian spring rolls\u2014golden-crisp on the outside and packed with fresh wood ear mushrooms and shredded taro on the inside\u2014the multi-layered textures are amazing. Highly favored by tourists and families seeking an elegant dining environment.", "name": "Sadhu Vegetarian Restaurant - Ocean Park", "transport": "Take VinBus E01 or E03 to Vinhomes Ocean Park station, then walk for 3 minutes"}, {"address": "45 Nguyen Mau Tai, Trau Quy, Gia Lam, Hanoi", "feature": "\u2b50 4.5 stars | A cozy family-style vegetarian restaurant near Gia Lam, famous for its rich vegetable hot pot and vegetarian pho. The vegetarian pho broth is slow-simmered for 6 hours using sugarcane, radishes, and various herbs, making it refreshingly sweet. Served with chewy rice noodles and juicy plant-based beef slices, it feels warm, soothing, and light. Many locals visit on the 1st and 15th of the lunar month, making it a great spot to taste authentic Vietnamese home-cooked vegetarian food.", "name": "Nhat Tam Chay - Gia Lam", "transport": "Take a taxi from Gia Lam Railway Station, approximately 10 minutes away"}, {"address": "Shop TDH, Vinhomes Ocean Park, Gia Lam, Hanoi", "feature": "\u2b50 4.6 stars | An affordable, high-quality vegetarian buffet inside Ocean Park offering over 30 fresh, daily-prepared dishes. The freshly fried vegetarian fish cutlet is a must-try; lightly battered and fried to golden perfection, it uses bean curd skin and seaweed to brilliantly replicate the tenderness and ocean flavor of fish\u2014crispy on the outside, tender inside, and full of aroma. Highly praised by health-conscious visitors and budget travelers seeking great value.", "name": "An Lac Chay - Ocean Park", "transport": "Take the free Ocean Park shuttle bus to Megamall station, then walk for 5 minutes"}, {"address": "120 Ngo Xuan Quang, Trau Quy, Gia Lam, Hanoi", "feature": "\u2b50 4.4 stars | A long-standing local vegetarian eatery in Gia Lam, famed among neighbors for its handmade vegetarian Banh Mi (B\u00e1nh M\u00ec Chay). The baguette is toasted to ultimate crispiness, packed with special vegetarian pate, crispy vegan meat floss, and refreshing sweet and sour pickled radishes. Every bite produces a satisfying crunch with rich, layered textures\u2014a must-try street food snack while exploring Gia Lam.", "name": "Quan Chay Bo De - Gia Lam", "transport": "Take Bus 11 to Hoc vien Nong nghiep station, then walk for 2 minutes"}, {"address": "Ly Thanh Tong Street, Trau Quy, Gia Lam, Hanoi", "feature": "\u2b50 4.3 stars | A stylish vegetarian spot with a serene Zen vibe, specializing in herbal vegetarian soups and exquisite tofu creations. The herbal wild mushroom pot is highly recommended; its rich broth carries subtle sweet notes of goji berries and red dates, while the mushrooms remain chewy and juicy\u2014nourishing and warming. Tourists especially love its quiet escape from the hustle and bustle alongside artistic dish presentations.", "name": "Thien Tam Vegetarian Restaurant - Gia Lam", "transport": "Take a taxi from the main gate of Vinhomes Ocean Park, approximately 5 minutes away"}, {"address": "S1.08 Vinhomes Ocean Park, Gia Lam, Hanoi", "feature": "\u2b50 4.5 stars | Offering fast-paced yet delicate vegetarian fast food and traditional snacks, this spot is popular among Ocean Park residents and tourists alike. Its signature vegetarian spring roll vermicelli (B\u00fan Chay Ch\u1ea3 Gi\u00f2) pairs smooth rice vermicelli with a sweet-and-sour custom sauce and hot fried spring rolls, creating a fresh, crispy, and mouthwatering texture. Efficient service and authentic Vietnamese seasonings account for its rave reviews.", "name": "Com Chay Tu Tam - Ocean Park", "transport": "Take VinBus E02 to Ocean Park S1 Building Cluster station, then walk for 1 minute"}, {"address": "TechnoPark Tower, Vinhomes Ocean Park, Gia Lam, Hanoi", "feature": "\u2b50 4.6 stars | A fusion restaurant combining healthy vegetarian dining with organic Vietnamese tea. The popular snack \u0027Vegetarian Lotus Seed Sticky Rice\u0027 features sweet, chewy glutinous rice mixed with soft lotus seeds and diced shiitake mushrooms, offering a delightful chewiness and subtle lotus leaf aroma. Whether dropping by for lunch or afternoon tea, guests can enjoy a deep sense of peace and satisfaction\u2014an ideal spot for international travelers to unwind.", "name": "Tinh Sac Chay \u0026 Tea - Ocean Park", "transport": "Take VinBus to TechnoPark Tower station, right upon arrival"}, {"address": "88 Ha Huy Tap, Yen Vien, Gia Lam, Hanoi", "feature": "\u2b50 4.4 stars | A highly recommended authentic vegetarian diner among locals, drawing foodies with its traditional Vietnamese crispy vegetarian pancake (B\u00e1nh X\u00e8o Chay). The edges are fried extra crispy, while the inside is packed with mung bean sprouts, mushrooms, and tofu cubes. Wrapped in fresh lettuce and herbs and dipped in special ginger vinegar sauce, it is refreshing, non-greasy, and satisfyingly chewy. Brimming with lively market vibes and simple deliciousness, it is the top choice for experiencing local life.", "name": "Quan Chay An Phuc - Gia Lam", "transport": "Take Bus 54 from Gia Lam Station to Yen Vien station, then walk for 3 minutes"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "S2.08 Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.5 stars | This famous Hanoi night-owl b\u00e1nh m\u00ec can also be enjoyed right in Ocean Park! Its biggest feature is the rich, juicy filling\u2014onions, sausage, canned pork p\u00e2t\u00e9, eggs, and pork floss stir-fried together over high heat in a pan, then stuffed into a warm, piping-hot baguette that is extremely crispy on the outside and soft inside. One bite bursts with buttery, spiced savory flavors, offering a moist, rich, and layered texture that makes it an ideal grab-and-go snack for both locals and tourists.", "name": "B\u00e1nh M\u00ec D\u00e2n T\u1ed5 - Ocean Park Branch", "transport": "Take VinBus route E01 or E03 to Building S2.08 stop, then walk about 2 minutes."}, {"address": "S1.01 Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.3 stars | A hugely popular new-generation dessert chain in Vietnam, emphasizing low sugar and healthy recipes. The signature Coconut Durian Dessert (Ch\u00e8 D\u1eeba D\u1ea7m) and Soft Tofu Pudding (T\u00e0o Ph\u1edb) feature ultra-smooth textures, paired with chewy sago, crispy coconut flesh, and rich coconut milk. Refreshingly sweet without being heavy, a bowl of crushed ice mixed with tender toppings is the top choice for tourists looking to beat the heat while strolling around sunny Ocean Park.", "name": "Ch\u00e8 Chang Hi - Vinhomes Ocean Park Branch", "transport": "Take VinBus E02 to S1.01 stop, then walk for about 1 minute."}, {"address": "Vinhomes Ocean Park Night Market Walking Street, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.4 stars | The lively Ocean Park Night Market brings together numerous traditional and innovative street snacks, with Vietnamese Pizza (B\u00e1nh Tr\u00e1ng N\u01b0\u1edbng) being the crowd favorite. Thin, crispy rice paper is grilled over hot charcoal, brushed with egg wash, and topped with quail eggs, scallions, pork floss, and special chili sauce. Crispy on the outside, savory and mildly spicy, eating your way through the night market walkway immerses tourists from around the world in a vibrant local street food atmosphere.", "name": "Ocean Park Night Market Street Food Stalls", "transport": "Take the dedicated VinBus line to the Ocean Park Night Market Walking Street entrance."}, {"address": "Ph\u1ed1 Bi\u1ec3n Zone, Vinhomes Ocean Park, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.6 stars | A national-treasure ice cream brand carrying decades of Hanoi history, now with a specialty store in the new Ocean Park area. The must-try Taro Ice Bar and Mung Bean Sticky Rice Ice Bar preserve authentic traditional flavors\u2014creamy, rich in milk aroma, and subtly infused with natural grain flavors. Freshly scooped waffle cone ice creams are also available, crispy on the outside and smooth inside, bringing nostalgic childhood memories to kids and adults alike.", "name": "Kem Tr\u00e0ng Ti\u1ec1n - Vinhomes Ocean Park Branch", "transport": "Take VinBus E03 to Ph\u1ed1 Bi\u1ec3n stop, then walk about 3 minutes."}, {"address": "B\u00e1t Tr\u00e0ng Ceramic Market, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.5 stars | A traditional century-old street food stall located inside the B\u00e1t Tr\u00e0ng Pottery Village Market in Gia L\u00e2m. The signature B\u00e1nh T\u1ebb (steamed leaf-wrapped rice cake) features a silky-smooth outer layer made of rice flour wrapped around a savory filling of stir-fried wood ear mushrooms, minced pork, and pepper. Steamed in banana leaves, it is delightfully springy, piping hot, and lightly infused with herbal fragrance. Dipped in fish sauce with chili, it is a delicious street snack you shouldn\u0027t miss while exploring the pottery village.", "name": "Traditional Leaf-Wrapped Rice Cakes (B\u00e1nh T\u1ebb \u0026 B\u00e1nh N\u00edt B\u00e1t Tr\u00e0ng)", "transport": "Take bus 47A from central Hanoi to the B\u00e1t Tr\u00e0ng terminus, then walk into the ceramic market."}, {"address": "32 Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.3 stars | A favorite snack stall among local students and residents in Tr\u00e2u Qu\u1ef3, Gia L\u00e2m. The signature Vietnamese Dried Beef Salad (N\u1ed9m B\u00f2 Kh\u00f4) is tangy, spicy, and crunchy, featuring shredded green papaya, flavorful beef jerky, crushed peanuts, and fresh Thai basil tossed in a sweet and sour fish sauce dressing. Pair it with Tapioca Shrimp Dumplings (B\u00e1nh B\u1ed9t L\u1ecdc), which have translucent, chewy skins and sweet shrimp filling that burst with rich savory sauce in every bite.", "name": "\u0102n V\u1eb7t Th\u00e1ng 9 - Dried Beef Salad \u0026 Tapioca Dumplings (N\u1ed9m B\u00f2 Kh\u00f4 \u0026 B\u00e1nh B\u1ed9t L\u1ecdc)", "transport": "Take bus 11 or 59 to H\u1ecdc vi\u1ec7n N\u00f4ng nghi\u1ec7p Vi\u1ec7t Nam stop, then walk about 4 minutes."}, {"address": "88 Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.4 stars | A highly popular, affordable street food spot in Gia L\u00e2m. The signature Vietnamese Crispy Pancake (B\u00e1nh X\u00e8o) is fried to a golden, crispy perfection filled with shrimp, pork, and bean sprouts. Pair it with Lemongrass Pork Skewers (Nem L\u1ee5i) grilled over charcoal for a juicy, smoky taste. Wrap the pancake and fresh herbs in rice paper and dip into their special peanut-p\u00e2t\u00e9 dipping sauce for a delightful mix of savory, sweet, and tangy flavors.", "name": "B\u00e1nh X\u00e8o Nem L\u1ee5i 88 - Tr\u00e2u Qu\u1ef3 Gia L\u00e2m", "transport": "Take bus 11 to Tr\u00e2u Qu\u1ef3 stop, then walk about 2 minutes."}, {"address": "Venice Zone, Mega Grand World Ocean City, Gia L\u00e2m, Hanoi", "feature": "\u2b50 4.2 stars | Popular street food stalls located alongside the canal at Mega Grand World Ocean City. Featuring trendy snacks with a unique Vietnamese twist, such as Shaken Spicy Rice Paper (B\u00e1nh Tr\u00e1ng L\u1eafc) and Grilled Corn with Scallion Oil \u0026 Cheese (Ng\u00f4 N\u01b0\u1edbng M\u1ee1 H\u00e0nh). The corn kernels are plump and juicy, brushed with scallion butter and melted cheese, while the shaken rice paper mixed with chili sauce, beef jerky, and quail eggs is spicy and appetizing\u2014perfect for enjoying while taking in the magnificent water show.", "name": "Mega Grand World Venice Street Snack Stalls", "transport": "Take the free VinBus Mega Grand World line (Grand World 01/02) directly to the Venice Zone."}], "name": "\ud83c\udf2d Street Food \u0026 Market Bites"}}, "name": "Gia Lam District and Ocean Park Resort"}, "old_quarter_hoan_kiem": {"categories": {"cat_1": {"items": [{"address": "49P. B\u00e1t \u0110\u00e0n, C\u1eeda \u0110\u00f4ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 Stars | Hanoi\u0027s most iconic century-old ph\u1edf establishment, drawing long queues from early morning. The clear broth is slow-simmered with beef bones for dozens of hours, yielding an intensely rich beef aroma. Served with freshly sliced thick raw beef cuts and silky-smooth rice noodles, every bite melts in your mouth with rich, layered textures. Locals love pairing it with a crispy fried dough stick (qu\u1ea9y) dipped into the flavorful broth\u2014an essential authentic taste you cannot miss when visiting the Old Quarter.", "name": "Ph\u1edf Gia Truy\u1ec1n B\u00e1t \u0110\u00e0n", "transport": "Located on B\u00e1t \u0110\u00e0n Street, about a 10-minute walk from Hoan Kiem Lake."}, {"address": "1 H\u00e0ng M\u00e0nh, H\u00e0ng Gai, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 Stars | Founded in 1966, this half-century-old eatery is the most renowned b\u00fan ch\u1ea3 spot in the Old Quarter. The soul of the dish lies in the freshly charcoal-grilled pork belly slices and patties, delightfully crispy on the outside and bursting with juice inside. It comes served with a sweet and tangy dipping fish sauce, green papaya slices, and fresh herbs. Dip the springy rice vermicelli into the warm dipping sauce for an irresistible combination of savory, sweet, and smoky flavors that will tantalize your appetite.", "name": "B\u00fan Ch\u1ea3 \u0110\u1eafc Kim", "transport": "Walk to the intersection of H\u00e0ng M\u00e0nh and H\u00e0ng Gai streets; you will easily see its prominent sign."}, {"address": "14 P. Ch\u1ea3 C\u1ea3, H\u00e0ng B\u1ed3, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.0 Stars | A century-old national treasure eatery so legendary that the entire street was named after it. Succulent snakehead fish fillets are marinated in turmeric juice, shallots, and fish sauce, then sizzled at your table in a small skillet with generous heaps of fresh dill and scallions. Crispy on the outside and tender inside, the fish bursts with herb aromas. Served with rice vermicelli, crunchy peanuts, and fermented shrimp paste, this dish offers an astonishingly rich blend of
