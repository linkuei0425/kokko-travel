oda", "transport": "Located in Da Ton Commune near Ocean Park, just a 5 to 8-minute taxi ride away."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.7 stars | Spanning 6.1 hectares, this artificial saltwater lagoon is a renowned urban marvel in Hanoi, featuring world-leading water purification technology to create crystal-blue waters and fine white sand beaches reminiscent of a tropical island resort. Surrounded by lush coconut trees, strolling here feels like being instantly transported to My Khe Beach in Central Vietnam. At sunset, the golden rays reflect on the blue water, creating a breathtaking sparkle, making it a top choice for relaxing, taking photos, and soaking in the southern coastal vibes.", "name": "Crystal Lagoons Vinhomes Ocean Park", "transport": "About a 30-minute Grab taxi ride from Hanoi city center, or take VinBus route E01 or E03 to the Vinhomes Ocean Park stop and walk."}, {"address": "K\u0110T Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.8 stars | Covering 24.5 hectares, this freshwater lake is known as the green heart of Ocean Park. The lake features crystal-clear waters surrounded by expansive white sand beaches and dense tropical greenery. It boasts well-paved trails and bike paths around the perimeter, perfect for morning runs or evening walks. Visitors can enjoy water sports like kayaking and SUP (stand-up paddleboarding), or host a picnic with friends and family at the lakeside BBQ areas while taking in the tranquility and vast natural scenery away from the city bustle.", "name": "Pearl Lake (H\u1ed3 Ng\u1ecdc Trai - Vinhomes Ocean Park)", "transport": "Take VinBus E02 or E03 to Vinhomes Ocean Park, then transfer to the free internal shuttle bus or walk to the lake area."}, {"address": "Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Gia Lam Park is a key green space for local residents in Gia Lam District to unwind and exercise. It features broad lawns, towering mature trees, and peaceful scenic ponds. The park offers walking paths, children\u0027s playgrounds, and outdoor fitness equipment amidst lush greenery and singing birds year-round. Well-maintained and vibrant with local life, it regularly attracts families for weekend picnics, making it an ideal spot to experience the laid-back local lifestyle of Hanoi\u0027s suburbs.", "name": "Gia Lam Park (C\u00f4ng vi\u00ean Gia L\u00e2m)", "transport": "Take bus 11 or 34 to Trau Quy stop, then walk about 5 minutes to arrive."}, {"address": "Ph\u00f9 \u0110\u1ed5ng, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Located in the historic Phu Dong commune, this large eco-park cleverly blends natural greenery with traditional Vietnamese culture. The park covers wide expanses of green grass, flower gardens, and natural ponds, alongside farm experience areas and eco-education grounds. Strolling along fragrance-filled garden paths, visitors can admire diverse plant life and rustic-style architecture. It is a wonderful natural hidden gem in Hanoi\u0027s eastern suburbs, perfect for family trips and refreshing outings.", "name": "Phu Dong Green Park (Ph\u00f9 \u0110\u1ed5ng Green Park)", "transport": "Driving or taking a taxi is recommended; it takes about 35 minutes from Hanoi city center via the 5B Expressway."}, {"address": "Ph\u00e2n khu San H\u00f4, Vinhomes Ocean Park, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | San Ho Park is a sprawling linear green park extending along the water features within Ocean Park, offering diverse landscape facilities. Planted with abundant tropical foliage and colorful flowers, it boasts multi-kilometer scenic jogging tracks, unique picnic BBQ campsites, and various outdoor sports fields. With fresh air and open scenic views, it provides a refreshing escape whether you\u0027re soaking up the sunshine or watching the sunset.", "name": "San Ho Park (San H\u00f4 Park - Vinhomes Ocean Park)", "transport": "Take VinBus E01 or E02 into the Ocean Park community, then walk to the San Ho Park precinct."}, {"address": "Tr\u00e2u Qu\u1ef3, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | Located near the Vietnam National University of Agriculture, Trau Quy Eco Garden is a popular horticulture and botanical observation hub in Gia Lam. The park cultivates numerous varieties of tropical flowers, foliage plants, and delicate bonsai, with different blooms coming alive across all four seasons. Shaded trees paired with meticulously crafted landscape design create a serene and charming natural scene. It is highly favored by photography enthusiasts and gardening hobbyists who can breathe in fresh oxygen and subtle floral aromas among the lush greenery.", "name": "Trau Quy Eco Garden (Tr\u00e2u Qu\u1ef3 Eco Garden)", "transport": "Take bus 11 to the Vietnam National University of Agriculture (HV N\u00f4ng nghi\u1ec7p Vi\u1ec7t Nam) stop and walk about 8 minutes."}, {"address": "B\u00e3i b\u1ed3i S\u00f4ng H\u1ed3ng, Ph\u01b0\u1eddng C\u1ef1 Kh\u1ed1i, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Situated on the Gia Lam stretch of the Red River, this natural alluvial sandbar showcases Hanoi\u0027s most pristine and wild riverside scenery. Every autumn and early winter, vast fields of silver miscanthus grass and reeds bloom on the sandbar, swaying gently in the breeze to create a poetic sea of white flowers. Free from excessive modern artificial embellishments, it preserves pure natural ecology, making it a favorite secret spot for local youth to camp, watch the sunset dip over the Red River, and take wedding photos.", "name": "Red River Gia Lam Alluvial Sandbar (B\u00e3i b\u1ed3i S\u00f4ng H\u1ed3ng Gia L\u00e2m)", "transport": "It is recommended to ride a motorbike or take a Grab car to the Cu Khoi dike segment, then follow the trail down to the Red River sandbar area."}, {"address": "C\u1ed5 Bi, Gia L\u00e2m, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.0 stars | Co Bi Green Park is a community green space located in Co Bi Commune, Gia Lam, featuring a relaxed, peaceful atmosphere and vibrant tree vegetation. The park features simple, bright walking paths, pavilions, and scenic ponds, offering a cozy space for neighborhood residents to walk, do morning exercises, and connect with nature. Free from tourist crowds, it offers a tranquil and authentic local rural charm, ideal for travelers seeking a quiet corner to unwind.", "name": "Co Bi Green Park (C\u00f4ng vi\u00ean C\u1ed5 Bi)", "transport": "From Gia Lam Bus Station, take bus 40 to Co Bi stop, then walk about 6 minutes to arrive."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Spanning an impressive 6.1 hectares, this massive artificial crystal saltwater lagoon is the most iconic landmark in Vinhomes Ocean Park. The lakeside is lined with fine white sand brought all the way from Phu Quoc Island and flanked by lush coconut palms, creating a vibrant tropical beach resort vibe. Visitors can enjoy stand-up paddleboarding (SUP), kayaking, or taking photos along the shore. As the sun sets, the glowing orange twilight reflects off the water against the backdrop of modern skyscrapers\u2014perfect for capturing stunning urban-beach aesthetic shots.", "name": "Crystal Lagoon (Vinhomes Ocean Park)", "transport": "Take VinBus routes E01, E02, or E03 to Vinhomes Ocean Park station; it is a short walk from there."}, {"address": "S\u1ed1 28, th\u00f4n 5, B\u00e1t Tr\u00e0ng, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.7 stars | Located in the B\u00e1t Tr\u00e0ng Pottery Village of Gia L\u00e2m district, this striking building features seven giant spiral structures inspired by pottery wheels. Its futuristic and artistic design has quickly turned it into one of Hanoi\u0027s newest viral landmarks. Inside, visitors can explore exquisite traditional Vietnamese ceramics and contemporary crafts, participate in hands-on pottery workshops, or relax at a chic caf\u00e9. The rooftop offers sweeping views of the ancient ceramic village and the Red River, providing incredible photo backdrops both inside and out.", "name": "Center for the Essence of Vietnamese Craft Villages / B\u00e1t Tr\u00e0ng Museum (Trung t\u00e2m Tinh hoa L\u00e0ng ngh\u1ec1 Vi\u1ec7t)", "transport": "Take Bus 47A from central Hanoi to the B\u00e1t Tr\u00e0ng terminal, or take a taxi/Grab ride (approx. 30 minutes)."}, {"address": "Grand World, Ocean City, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.8 stars | Grand World in Ocean City features an ultra-romantic European-style \u0027Venice Zone\u0027. A canal extending hundreds of meters flows between vibrantly colored Italian-style townhouses, dotted with elegant gondolas. Visitors can ride a gondola down the canal or take photos by the arched bridges and classic statues. At night, spectacular light shows and the live-action water extravaganza \u0027The Grand Voyage\u0027 deliver a breathtaking visual feast, making it Hanoi\u0027s hottest exotic photo destination.", "name": "Grand World Ocean City - Venice Zone", "transport": "Take a free or paid VinBus Grand World shuttle route (such as OCT1 or OCT2) directly from central Hanoi."}, {"address": "Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Rising 45 stories high, TechnoPark Tower is an iconic centerpiece of Vinhomes Ocean Park and a top-tier smart office building awarded LEED Platinum green certification. Its sleek, all-glass curtain wall and geometric fluid design exude a sharp, futuristic vibe. The landscaped gardens and large geometric sculpture fountain in front attract countless photography enthusiasts aiming for modern architectural shots. At night, dynamic LED displays light up the facade, combining with the surrounding lake to create a stunning cityscape.", "name": "TechnoPark Tower", "transport": "Take VinBus E01 or E03 and get off at TechnoPark station."}, {"address": "K-Town, Grand World Ocean City, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Located right next to the Venice Zone, K-Town recreates the lively street vibe of Seoul\u0027s Myeongdong and Hongdae alongside traditional Korean Hanok architecture. The district is packed with Hangul neon signs, trendy Korean-style cafes, chimaek (fried chicken \u0026 beer) spots, and adorable photo installations. Regular K-POP dance performances and Korean cultural markets take place here, making it a favorite spot for youth and influencers to snap stylish street photos or pose in Hanbok.", "name": "K-Town (Grand World Ocean City)", "transport": "Take the VinBus Grand World shuttle service to Grand World; it is a short walk from there."}, {"address": "Vinhomes Ocean Park, \u0110a T\u1ed1n, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Spanning 24.5 hectares, Pearl Lake (H\u1ed3 Ng\u1ecdc Trai) serves as the heart of Vinhomes Ocean Park. It is surrounded by kilometers of white sandy shores, lush landscaped parks, outdoor BBQ zones, and glamping tent setups. In the evening, youth gather at open-air beach cafes, sitting under palm trees with a drink to watch the sunset over the water. The cozy, romantic vibe makes it an absolute favorite for sunset shots and aesthetic lifestyle photos.", "name": "Pearl Lake (H\u1ed3 Ng\u1ecdc Trai Vinhomes Ocean Park)", "transport": "Take VinBus E01 or E02 and get off at the Central Lake station inside Vinhomes Ocean Park."}, {"address": "Th\u00f4n Keo, x\u00e3 Kim S\u01a1n, huy\u1ec7n Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Keo Temple is a historic ancient temple dating back over a thousand years (formerly known as Ph\u00e1p V\u00e2n Temple), belonging to the famous Four Dharma Buddhas belief system in the Red River Delta. The temple preserves the rustic traditional style of Northern Vietnam, featuring ancient brick pagodas, intricately carved wooden beams, and serene leafy courtyards. Standing in peaceful contrast to the neighboring modern Ocean Park, it attracts visitors seeking blessings as well as fans of historical culture and traditional costume photography.", "name": "Keo Temple Gia L\u00e2m (Ch\u00f9a Keo)", "transport": "Drive or take a Grab taxi along Route 179 from Ocean Park; it takes about 15 minutes."}, {"address": "Vinhomes Ocean Park, Ki\u00eau K\u1ef5, Gia L\u00e2m, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | As one of Northern Vietnam\u0027s largest shopping malls, this complex boasts a sleek geometric facade that lights up brilliantly at night. Inside, it houses international brands, creative themed zones, and a rooftop garden terrace. Features include an aquarium-themed photo wall, seasonal large-scale art installations in the main atrium, and panoramic views of the artificial lagoon from the top terrace\u2014a complete lifestyle hub for shopping, dining, and photography.", "name": "Vincom Mega Mall Ocean Park", "transport": "Take VinBus E01, E02, or E03 directly to Vincom Mega Mall Ocean Park station."}], "name": "Popular Instagrammable Spots"}}, "name": "Gia Lam District and Ocean Park Resort"}, "old_quarter_hoan_kiem": {"categories": {"cat_1": {"items": [{"address": "40 Nh\u00e0 Chung, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Built in 1886, St. Joseph\u0027s Cathedral is Hanoi\u0027s oldest church, featuring a Neo-Gothic design inspired by Notre-Dame de Paris. Its weathered gray-black exterior exudes historical charm, while the interior boasts magnificent stained-glass windows and a splendid main altar. As a vibrant hub for locals and tourists alike, the surrounding area is lined with hip cafes and boutique shops. Enjoying a glass of lemon tea in the cathedral plaza at sunset is a wonderful way to experience Hanoi\u0027s relaxed lifestyle.", "name": "St. Joseph\u0027s Cathedral", "transport": "About a 5-minute walk from the west side of Hoan Kiem Lake."}, {"address": "1 Tr\u00e0ng Ti\u1ec1n, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Constructed during the French colonial era in the early 20th century, this grand neoclassical landmark was modeled after the Palais Garnier in Paris. The yellow-and-white facade, paired with exquisite Gothic arches and Ionic columns, exudes luxury and elegance. With an 870-seat auditorium, it frequently hosts high-caliber ballet, symphony, and traditional Vietnamese cultural performances. Lit up at night, it becomes a breathtaking sight and a must-visit spot for photos.", "name": "Hanoi Opera House", "transport": "Located east of the southern end of Hoan Kiem Lake; about an 8-minute walk along Tr\u00e0ng Ti\u1ec1n Street from the lake\u0027s southeast corner."}, {"address": "Ho\u00e0n Ki\u1ebfm Lake, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Standing on a small islet in the middle of Hoan Kiem Lake, Turtle Tower was built in 1886 and serves as one of Hanoi\u0027s most iconic spiritual symbols. This three-tiered stone tower blends traditional Vietnamese and French architectural styles and is tied to the 15th-century legend of King L\u00ea L\u1ee3i returning a sacred sword to the Golden Turtle God. Although visitors cannot land on the island, viewing the ancient tower surrounded by water from any lakeside angle offers a poetic sense of mystery and tranquility, especially during misty mornings or illuminated at night.", "name": "Turtle Tower (Th\u00e1p R\u00f9a)", "transport": "Located in the center of Hoan Kiem Lake, clearly visible from anywhere along the lakeside promenade."}, {"address": "\u0110inh Ti\u00ean Ho\u00e0ng, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Situated on an island at the northern end of Hoan Kiem Lake, Ngoc Son Temple was built in the 19th century and honors Wenchang Dijun and national hero Tr\u1ea7n H\u01b0ng \u0110\u1ea1o. Reaching the temple requires crossing the vibrant scarlet wooden H\u00fac Bridge (The Wooden Bridge of the Rising Sun), which reflects beautifully on the lake. Inside, a preserved giant specimen of a sacred turtle adds to the solemn and ancient atmosphere. It is not only a spiritual center but also a fantastic spot for panoramic views of Hoan Kiem Lake, steeped in rich Confucian and Taoist heritage.", "name": "Ngoc Son Temple", "transport": "Located on the northern end of Hoan Kiem Lake; about a 3-minute walk from the southern edge of the Old Quarter to the entrance of H\u00fac Bridge."}, {"address": "87 P. M\u00e3 M\u00e2y, H\u00e0ng Bu\u1ed3m, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Built in the late 19th century, this traditional \u0027tube house\u0027 is one of the best-preserved heritage buildings in Hanoi\u0027s Old Quarter. Featuring a long, narrow two-story wooden frame structure with inner courtyards for natural light and ventilation, it perfectly showcases the classic lifestyle of merchants who operated a shop in the front and lived in the back. Stepping inside allows you to admire intricate wood carvings, antique furniture, and traditional tea ceremony demonstrations, transporting you back to Hanoi\u0027s vibrant history a century ago.", "name": "Ancient House (87 M\u00e3 M\u00e2y)", "transport": "Located in the heart of the 36 Old Streets area, within easy walking distance of surrounding attractions on M\u00e3 M\u00e2y Street."}, {"address": "P. \u00d4 Quan Ch\u01b0\u1edfng, \u0110\u1ed3ng Xu\u00e2n, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Also known as the Gate of \u00d4 Quan Ch\u01b0\u1edfng, this is the only intact city gate remaining from the original five gates of Hanoi\u0027s old city walls. Built in 1749 and rebuilt in 1817, this two-story arched gate features a guard observation deck on top, with ancient inscriptions still visible on the walls. Having witnessed Hanoi\u0027s resilient history through foreign invasions and changing times, today bustling traffic flows through its arched opening, creating a seamless blend of past and present.", "name": "\u00d4 Quan Ch\u01b0\u1edfng (Old City Gate)", "transport": "Located east of \u0110\u1ed3ng Xu\u00e2n Market, about a 5-minute walk from the Ancient House on M\u00e3 M\u00e2y Street."}, {"address": "76 P. H\u00e0ng Bu\u1ed3m, H\u00e0ng Bu\u1ed3m, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Believed to be the oldest temple in Hanoi, Bach Ma Temple was originally built in the 11th century during the L\u00fd Dynasty to honor a legendary white horse that guided the construction of the city walls. Although renovated several times, its interior retains a deeply serene and rustic atmosphere with carved wooden beams, ornate calligraphic plaques, and ceremonial palanquins. Active with worshipers yet peacefully quiet, it is a vital cultural landmark for exploring Hanoi\u0027s ancient mythology and traditional beliefs.", "name": "Bach Ma Temple", "transport": "Located on H\u00e0ng Bu\u1ed3m Street in the 36 Old Streets area, about a 6-minute walk from \u0110\u1ed3ng Xu\u00e2n Market."}, {"address": "1 P. H\u1ecfa L\u00f2, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Built by French colonial authorities in 1896 to incarcerate Vietnamese revolutionaries, Hoa Lo Prison was later used during the Vietnam War to hold American POW pilots (who sarcastically nicknamed it the \u0027Hanoi Hilton\u0027). The museum preserves original iron-barred cells, cramped solitary rooms, a guillotine, and various instruments of punishment. Through powerful historical photographs and artifact displays, it vividly conveys the arduous struggle for Vietnamese independence, leaving a lasting impression on visitors.", "name": "Hoa Lo Prison Museum", "transport": "Located southwest of Hoan Kiem Lake, about a 10-minute walk from St. Joseph\u0027s Cathedral."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "40 Nh\u00e0 Chung, H\u00e0ng Tr\u1ed1ng, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 Stars | Built in 1886, St. Joseph\u0027s Cathedral is a Gothic-style cathedral and the oldest Catholic church in Hanoi, bearing a striking resemblance to Notre-Dame de Paris. Its weathered greyish-white walls reflect over a century of history, while the interior features exquisite stained glass windows and soaring vaulted ceilings. It serves as a religious center for local Catholics and is a must-visit classic landmark for tourists exploring the Old Quarter. Surrounded by numerous stylish cafes, sitting roadside in the evening with a Vietnamese iced lemon tea while admiring the cathedral\u0027s silhouette offers a delightful experience.", "name": "St. Joseph\u0027s Cathedral", "transport": "About a 3-minute walk from the west side of Hoan Kiem Lake"}, {"address": "1 P. Ho\u1ea3 L\u00f2, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | Built by French colonial authorities in the late 19th century, Hoa Lo Prison was initially used to detain Vietnamese revolutionaries seeking independence, and later housed American POWs (famously nicknamed the \u0027Hanoi Hilton\u0027) during the Vietnam War. The museum faithfully preserves original cell blocks, instruments of torture (including a guillotine), as well as rare historical photos and artifacts. Through immersive audio guides and realistic models, it deeply conveys the arduous journey and resilient spirit of the Vietnamese people in their struggle for independence, making it an essential venue for understanding Vietnam\u0027s modern history.", "name": "Hoa Lo Prison Relic", "transport": "About a 10-minute walk from the south end of Hoan Kiem Lake, or a 5-minute taxi ride"}, {"address": "36 P. L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, H\u00e0ng B\u00e0i, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 Stars | This museum highlights the crucial role of Vietnamese women in historical development, social culture, and family life. The exhibition is divided into three main themes: \u0027Women in History,\u0027 \u0027Family Life,\u0027 and \u0027Women\u0027s Fashion and Arts.\u0027 Displayed artifacts include exquisite traditional ethnic minority costumes, wedding items, and moving stories of female heroes during the Vietnam War. Modern and inspiring, it has been named one of the best museums to visit in Hanoi by various international travel media.", "name": "Vietnamese Women\u0027s Museum", "transport": "About an 8-minute walk from the south end of Hoan Kiem Lake"}, {"address": "1 P. Tr\u00e0ng Ti\u1ec1n, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | The building itself is a blend of French colonial and traditional Vietnamese architectural elements (Indochina style), formerly housing the \u00c9cole fran\u00e7aise d\u0027Extr\u00eame-Orient. The museum houses tens of thousands of precious artifacts spanning from prehistoric times, the Champa Kingdom, and glorious dynasties to the modern independence movement, including intricate bronze drums, ceramics, royal gold seals, and Buddha statues. For history and archaeology enthusiasts, this is a treasure trove for exploring thousands of years of Vietnamese cultural heritage.", "name": "Vietnam National Museum of History", "transport": "Located southeast of Hoan Kiem Lake, about a 3-minute walk from the Hanoi Opera House"}, {"address": "87 P. M\u00e3 M\u00e2y, H\u00e0ng Bu\u1ed3m, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 Stars | Located at 87 Ma May, this heritage house is one of the best-preserved traditional tube-style merchant residences in the Old Quarter, built in the late 19th century. Featuring a shop at the front, living quarters at the back, and an open courtyard lightwell in between, it showcases a classic Hanoi ancient house layout that optimizes ventilation and natural light. Furnished with traditional wooden furniture, antique tea sets, and daily household items, it recreates the daily life of wealthy Hanoi merchants from the past. Occasionally hosting traditional craft demonstrations or tea ceremony performances, it offers visitors a captivating glimpse back into old Hanoi.", "name": "Heritage House (87 Ma May)", "transport": "Located in the heart of the Old Quarter, about a 7-minute walk from the north end of Hoan Kiem Lake"}, {"address": "42-44 P. H\u00e0ng B\u1ea1c, H\u00e0ng B\u1ea1c, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Situated on famous Hang Bac (Silverware) Street, Kim Ngan Communal House was established by silversmiths who settled here, making it the largest and remarkably well-preserved traditional communal house in the Old Quarter. The interior honors the founding ancestor of silver crafting, showcasing traditional wood carvings and exquisite architectural structure. Serving as more than a place of worship, it also functions as a space for showcasing traditional crafts and cultural performances, allowing visitors to deeply appreciate the artisan heritage of the 36 Old Streets.", "name": "Kim Ngan Communal House", "transport": "About a 5-minute walk from the north end of Hoan Kiem Lake"}, {"address": "21 P. H\u00e0m Long, Phan Chu Trinh, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 Stars | Built in 1934 and designed by a local Vietnamese architect, Ham Long Church uniquely blends French Romanesque architecture with traditional Vietnamese decorative elements, constructed using local materials such as bamboo, lime, and paper pulp. Compared to the bustling St. Joseph\u0027s Cathedral, Ham Long Church offers a solemn and serene atmosphere, featuring a statue of St. Francis in its courtyard. During Christmas or Sunday Mass, local devotees gather here, exuding a rich sense of religious devotion.", "name": "Ham Long Church", "transport": "About a 5-minute drive or a 12-minute walk from the south side of Hoan Kiem Lake"}, {"address": "67 P. L\u00fd Th\u01b0\u1eddng Ki\u1ec7t, Tr\u1ea7n H\u01b0ng \u0110\u1ea1o, Ho\u00e0n Ki\u1ebfm, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 Stars | The Hanoi Police Museum showcases the development history and major case archives of the Hanoi police force since its establishment in 1945. The museum displays an extensive collection of historical photographs, police uniforms, vehicles, weapons, and memorabilia from crime-fighting efforts. The exhibition highlights the contributions of the People\u0027s Police in maintaining capital security and resisting foreign aggression. Housed in an elegant French-style building, it is a unique cultural spot to gain insight into the social history of Vietnam\u0027s capital.", "name": "Hanoi Police Museum", "transport": "About a 3-minute walk from Hoa Lo Prison Relic"}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Hang Trong, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.7 stars | Hoan Kiem Lake is the most iconic natural and historical landmark in the heart of Hanoi, featuring clear waters and picturesque scenery year-round. Surrounded by tree-lined shaded promenades, it is a favorite spot for locals strolling and doing morning exercises, as well as tourists snapping photos. On weekends, the surrounding roads transform into a vibrant pedestrian zone filled with street performers and cultural activities, exuding Hanoi\u0027s relaxed and charming atmosphere.", "name": "Hoan Kiem Lake (H\u1ed3 Ho\u00e0n Ki\u1ebfm)", "transport": "Located in the heart of the Old Quarter, easily accessible on foot; or take a bus to the H\u1ed3 Ho\u00e0n Ki\u1ebfm stop."}, {"address": "Dinh Tien Hoang Street, Ly Thai To, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.4 stars | Located on the east side of Hoan Kiem Lake, this park features a massive bronze statue of Emperor Ly Thai To, commemorating the legendary monarch who moved Vietnam\u0027s capital to Hanoi (then known as Thang Long). Spacious, flat, and shaded by leafy trees, it is a bustling square for local leisure, youth roller-blading, and major cultural festivals, vibrant with local life.", "name": "Ly Thai To Park (V\u01b0\u1eddn hoa L\u00fd Th\u00e1i T\u1ed5)", "transport": "A 2-minute walk from the eastern side of Hoan Kiem Lake."}, {"address": "Ngo Quyen, Ly Thai To, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.3 stars | Commonly known as the Toad Garden (Con Coc Garden), this charming French colonial-era park features Hanoi\u0027s oldest French-style fountain, adorned with exquisite green frogs and stone carvings at its base. Surrounded by lush greenery and located directly opposite the historic Sofitel Legend Metropole Hotel, it is a romantic and tranquil green oasis near the Old Quarter.", "name": "Dien Hong Park - Con Coc Garden (V\u01b0\u1eddn hoa Di\u00ean H\u1ed3ng)", "transport": "A 5-minute walk from the southern end of Hoan Kiem Lake, or a 3-minute walk from the Hanoi Opera House."}, {"address": "Quan Thanh, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.2 stars | Formerly known as Hang Dau Garden, this park sits adjacent to the historic Hang Dau Water Tower and the northern entrance of the Old Quarter. Featuring dense greenery, ample seating, and a monument dedicated to martyrs who resisted French colonial rule, it is a perfect natural spot to take a break while exploring the northern Old Quarter or heading toward Long Bien Bridge.", "name": "Van Xuan Flower Garden (V\u01b0\u1eddn hoa V\u1ea1n Xu\u00e2n)", "transport": "Located at the northern edge of the Old Quarter, about a 5-minute walk from Dong Xuan Market."}, {"address": "Le Lai, Ly Thai To, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.3 stars | Nestled behind Ly Thai To Park along the banks of Hoan Kiem Lake, the Octagonal Pavilion is a classic French colonial-era wooden gazebo surrounded by manicured flowerbeds and centuries-old trees. Locals often gather here to play chess or enjoy brass band performances, creating a picturesque scene where Old Hanoi\u0027s vibrant culture meets natural beauty.", "name": "Octagonal Pavilion Park (Nh\u00e0 B\u00e1t Gi\u00e1c \u0026 V\u01b0\u1eddn hoa H\u1ed3 Ho\u00e0n Ki\u1ebfm)", "transport": "Located on the east bank of Hoan Kiem Lake; a 1-minute walk toward the lakeside from Ly Thai To Park."}, {"address": "Trang Tien, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.3 stars | Situated right in front of the Hanoi Opera House, this elegant garden square was named to commemorate the August Revolution of 1945. Filled with seasonal flowers and towering trees, the park boasts a clean and sophisticated environment with pleasant walkways, making it the ideal spot to admire panoramic views of the French colonial architecture and enjoy Parisian-style street greenery.", "name": "August 19 Flower Garden (V\u01b0\u1eddn hoa 19-8)", "transport": "About a 6-minute walk along Trang Tien Street from the southern end of Hoan Kiem Lake."}, {"address": "Co Tan, Phan Chu Trinh, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.3 stars | Tucked away behind the Hanoi Opera House, this delicate garden offers a peaceful and lush oasis. At its center stands an elegant fountain and a small historic monument, encircled by mature trees and French colonial buildings. Far from the bustling Old Quarter, it is a hidden gem for photography and enjoying a quiet moment.", "name": "Co Tan Flower Garden (V\u01b0\u1eddn hoa C\u1ed5 T\u00e2n)", "transport": "A 1-minute walk from behind the Hanoi Opera House."}, {"address": "Cau Long Bien, Hoan Kiem, Hanoi, Vietnam", "feature": "\u2b50 4.1 stars | Located at the northeastern edge of the Old Quarter beneath Long Bien Bridge, this natural area stretches to the banks of the Red River. Featuring vast grassy banks and scenic seasonal views, the sunset here casts a golden glow over the century-old steel bridge and glowing river waters. Majestic yet rustic, it is a unique off-the-beaten-path destination to experience Hanoi\u0027s striking landscape.", "name": "Long Bien Bridge Riverside Area (B\u00e3i S\u00f4ng H\u1ed3ng)", "transport": "Walk from the northeastern edge of the Old Quarter, or take a Grab motorbike to the foot of Long Bien Bridge to reach the riverside trail."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Dinh Tien Hoang, Hang Trong, Hoan Kiem, Hanoi", "feature": "\u2b50 4.6 Stars | The vibrant red Huc Bridge spans Hoan Kiem Lake like a crimson ribbon, connecting the shore to Jade Island. Meaning \u0027the place touched by morning sunlight,\u0027 the bridge is one of Hanoi\u0027s most iconic landmarks. Leading up to Ngoc Son Temple, the red bridge complements the Turtle Tower in the lake. Whether enveloped in early morning mist or illuminated at night, it exudes a profound classic Oriental charm, making it a top choice for photos.", "name": "The Huc Bridge \u0026 Ngoc Son Temple", "transport": "Located on the northeast side of Hoan Kiem Lake, about a 5-10 minute walk from the Old Quarter."}, {"address": "40 Nha Chung, Hang Trong, Hoan Kiem, Hanoi", "feature": "\u2b50 4.5 Stars | Built in 1886, St. Joseph\u0027s Cathedral is the oldest Catholic church in Hanoi, modeled after the Neo-Gothic architecture of Notre-Dame de Paris. Its weathered gray-white stone walls bear the marks of time, while its twin towers and stained-glass windows create a striking visual impact. Surrounding the plaza are numerous open-air cafes where locals and tourists love sipping Vietnamese lemon tea while taking photos with the castle-like cathedral in the background.", "name": "St. Joseph\u0027s Cathedral", "transport": "Located on the west side of Hoan Kiem Lake, about a 5-minute walk from the lake."}, {"address": "Phung Hung Street, Hang Ma, Hoan Kiem, Hanoi", "feature": "\u2b50 4.4 Stars | A visual art street created jointly by Vietnamese and Korean artists, bringing the historical memories of Hanoi\u0027s Old Quarter back to life through murals on the stone arches beneath the railway viaduct. Over 20 3D-style painted artworks depict scenes of daily life\u2014such as street porters, old-fashioned trams, and traditional Lunar New Year stalls\u2014blending artistic creativity with vintage nostalgia. It attracts countless photography enthusiasts and influencers.", "name": "Phung Hung Mural Street", "transport": "Located on the northwest side of the Old Quarter, about a 7-minute walk from Dong Xuan Market."}, {"address": "Tr\u1ea7n Ph\u00fa / Ph\u00f9ng H\u01b0ng, Hoan Kiem, Hanoi", "feature": "\u2b50 4.7 Stars | A century-old railway track running through a narrow residential alley creates a globally unique sight. Lined with cozy cafes and creative shops, the alley offers a thrilling experience as trains rumble past, just inches away from buildings and outdoor seating. Grabbing a cup of Vietnamese egg coffee here and capturing the moment a train speeds by has become a quintessential Hanoi photo spot.", "name": "Hanoi Train Street", "transport": "About a 10-minute walk from St. Joseph\u0027s Cathedral, or easily accessible via Grab car/motorbike."}, {"address": "Ta Hien, Hang Buat, Hoan Kiem, Hanoi", "feature": "\u2b50 4.3 Stars | Known as Hanoi\u0027s \u0027sleepless street\u0027 and a backpacker\u0027s paradise, Ta Hien Street is a quaint French-influenced historic alley by day and transforms into the city\u0027s liveliest open-air bar district at night. Low plastic stools line the street as travelers from around the world huddle together to enjoy cheap draught beer (Bia Hoi) and local snacks. The neon lights and bustling crowds create the most vibrant backdrop for Hanoi night photos.", "name": "Ta Hien Beer Street", "transport": "Located in the heart of the Old Quarter, just a 6-minute walk from the northern end of Hoan Kiem Lake."}, {"address": "64 Luong Van Can, Hang Trong, Hoan Kiem, Hanoi", "feature": "\u2b50 4.6 Stars | An immensely popular Instagrammable cafe overlooking Hoan Kiem Lake, where all four floors\u2014including walls, ceilings, tables, chairs, and lamp shades\u2014are covered in colorful sticky notes left by visitors worldwide. The atmosphere is warm and joyful, inviting guests to leave their own wishes and messages on the walls. The view of Hoan Kiem Lake from the upper floor windows, framed by colorful sticky notes, makes for uniquely stunning photos.", "name": "The Note Coffee", "transport": "Located right by the roundabout on the northwest corner of Hoan Kiem Lake, easily accessible on foot."}, {"address": "1 Trang Tien, Phan Chu Trinh, Hoan Kiem, Hanoi", "feature": "\u2b50 4.5 Stars | Built during the French colonial period in the early 20th century, the Hanoi Opera House perfectly inherits the Neoclassical architectural aesthetic of Palais Garnier in Paris. Its yellow-and-white facade, elegant Corinthian columns, and carved arched windows embody ultimate French romantic charm. The spacious plaza in front lights up magnificently at night, making it the perfect backdrop to capture Hanoi\u0027s elegant, vintage French vibe.", "name": "Hanoi Opera House", "transport": "About an 8-minute walk east along Trang Tien Street from the southern end of Hoan Kiem Lake."}, {"address": "76 Hang Buat, Hang Buat, Hoan Kiem, Hanoi", "feature": "\u2b50 4.5 Stars | Bach Ma Temple is widely considered the oldest and most sacred temple in the Old Quarter, with a history dating back to the Ly Dynasty in the 11th century. Featuring an exquisite entrance gate, its interior houses red-lacquered carved wooden beams, sacred horse statues, and ancient palanquins with rich Oriental charm. The lingering incense and tranquil atmosphere reveal the deep cultural heritage of Old Hanoi, making it a fantastic spot for travelers seeking historic and cultural charm.", "name": "Bach Ma Temple", "transport": "Located inside the Old Quarter, just a 1-minute walk from Ta Hien Street."}], "name": "Top Photo Spots"}}, "name": "Hoan Kiem Lake and the Old Quarter"}, "west_lake_tay_ho": {"categories": {"cat_1": {"items": [{"address": "46 \u0110. Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Built in the 6th century during the Early Ly Dynasty, Tran Quoc Pagoda is Hanoi\u0027s oldest Buddhist temple, situated on a small islet on the southeastern shore of West Lake. Its iconic landmark is a grand 15-story red brick stupa, with each level enshrining a white Buddha statue. The pagoda also houses numerous precious ancient Buddha statues and a sacred Bodhi tree offshoot from Bodh Gaya, India. It is not only a pilgrimage site for devout believers but also a fantastic spot to watch the West Lake sunset, exuding a serene and elegant historical charm.", "name": "Tran Quoc Pagoda", "transport": "Take bus 50, E05, or 33 to Thanh Nien Road stop, then walk for about 3 minutes."}, {"address": "52 \u0110. \u0110\u1eb7ng Thai Mai, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Perched on the tip of a peninsula in West Lake, Phu Tay Ho is a renowned temple dedicated to Princess Lieu Hanh, one of the Holy Mothers in Vietnam\u0027s traditional Mother Goddess (Dao Mau) worship. Featuring classic Vietnamese temple architecture, it boasts exquisite wood carvings and painted beams. On the 1st and 15th days of the lunar month and during Tet (Lunar New Year), tens of thousands of pilgrims flock here to pray for luck and wealth. Offering sweeping views of West Lake, the temple presents a solemn atmosphere rich in local religious and folk traditions.", "name": "Phu Tay Ho Temple", "transport": "It is recommended to take a Grab ride directly to the end of Dang Thai Mai Street, or take bus 31 to Tay Ho station and walk for about 10 minutes."}, {"address": "\u0110. Thanh Ni\u00ean, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Built in the 11th century during the reign of Emperor Ly Thai To, Quan Thanh Temple guards the north among the \u0027Four Sacred Temples of Thang Long\u0027 and holds immense historical significance. Dedicated to Tran Vu (Huyen Thien Thuong De), deity of the North, its main highlight is a massive 4-ton black bronze seated statue of the deity cast in 1677, showcasing the pinnacle of 17th-century Vietnamese bronze casting skills. With ancient trees shading its quiet courtyard, it is a must-visit landmark for exploring Vietnamese Taoist culture and historical architecture.", "name": "Quan Thanh Temple", "transport": "Take bus 50, E05, or 33 to the intersection of Thanh Nien and Quan Thanh streets, then walk for 1 minute."}, {"address": "1 \u0110. Nghi T\u00e0m, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Located in Nghi Tam village on the northeastern shore of West Lake, Kim Lien Pagoda was originally built in the 12th century as a palace for the daughter of Emperor Ly Than Tong before being converted into a temple. Blending royal palace aesthetics with traditional temple design, its three parallel three-tiered wooden halls feature rustic yin-yang tiled roofs and upturned eaves, showcasing extraordinary woodwork and understated elegance. Housing fine 18th-century Buddha statues and steles, it feels like a tranquil museum of history and art hidden right beside a bustling commercial area.", "name": "Kim Lien Pagoda", "transport": "Take bus 31, 41, or 55A to Nghi Tam Road, then walk down the alley for about 5 minutes."}, {"address": "364 \u0110. L\u1ea1c Long Qu\u00e2n, Xu\u00e2n La, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Founded in 1011 AD during the reign of Emperor Ly Thai To, Van Nien Pagoda boasts a history of over a thousand years and is one of the oldest and most iconic temples on the western shore of West Lake. Constructed primarily from high-quality ironwood that remains unmarred by modern alterations, it preserves a rustic and authentic wooden aesthetic. The temple houses a rare and precious Buddha statue carved from natural emerald. Strolling through the grounds amidst West Lake breezes and temple chimes offers a profound sense of timeless peace and serenity.", "name": "Van Nien Pagoda", "transport": "Take bus 13, 25, or 55A to Lac Long Quan stop, then walk for about 3 minutes."}, {"address": "386 \u0110. L\u1ea1c Long Qu\u00e2n, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Situated on the southeastern shore of West Lake, Tao Sach Pagoda dates back to the Early Le or Ly Dynasty and holds immense historical and artistic value. The name \u0027Tao Sach\u0027 signifies a place for gathering to study Buddhist scriptures. Facing the vast expanse of West Lake, the ancient temple features lush green courtyards adorned with bonsai plants and classical stone sculptures, creating an extraordinarily elegant vibe. It houses a precious collection of woodblock scriptures, Nom-script couplets, and calligraphic plaques from the Le and Nguyen Dynasties, making it a treasure trove for studying Vietnamese Buddhist literature and ancient calligraphy.", "name": "Tao Sach Pagoda", "transport": "Take bus 25, 55A, or 55B to Lac Long Quan Road; it is located near West Lake Water Park and within short walking distance."}, {"address": "353 \u0110. Th\u1ee5y Khu\u00ea, B\u01b0\u1edfi, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Located on Thuy Khue Street along the southern shore of West Lake, Dong Co Temple was founded in 1028 AD during the Ly Dynasty. It served as a vital sacred site where ancient Vietnamese kings and officials performed solemn oaths of loyalty. Dedicated to the Bronze Drum Deity of the Mountain, who reportedly aided King Ly Thai Tong in suppressing rebellions, the temple preserves traditional double-eaved hip-and-gable roof architecture. Inside, visitors can find ancient bronze drum replicas and historic stone steles. The temple uniquely embodies the blend of ancient state loyalty rites and mountain deity worship.", "name": "Dong Co Temple", "transport": "Take bus 45 to Thuy Khue Road, then walk for about 2 minutes."}, {"address": "67 \u0110. Qu\u1ea3ng B\u00e1, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Located in Quang Ba village at the heart of Tay Ho\u0027s upscale residential area, Quang Ba Pagoda is a serene, elegant, and secluded thousand-year-old temple. With history tracing back to the Ly Dynasty, its architecture features red tiles, wooden beams, and intricately carved dragon-and-phoenix lintels, complemented by ancient towering trees and stone stupas in the courtyard. Surrounded by ex-pat friendly luxury housing and boutique restaurants, the pagoda remains a pure sanctuary of peace, offering visitors a striking contrast between modern luxury and ancient faith.", "name": "Quang Ba Pagoda", "transport": "Taking a Grab ride or cycling via Dang Thai Mai to Quang Ba Street is recommended."}], "name": "Historic Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Tran Quoc Pagoda is the oldest Buddhist temple in Hanoi, with a history dating back to the 6th century during the Ante-L\u00ea Dynasty. Located on a scenic island on the southeastern shore of West Lake, it is connected to the lakefront by a lovely causeway. The temple\u0027s most striking feature is a soaring 15-story red brick stupa, with each tier housing a white Amitabha Buddha statue. Storing precious ancient statues and steles amidst captivating lake scenery, it remains one of the most iconic and vibrant cultural and religious landmarks in the West Lake area.", "name": "Tran Quoc Pagoda (Ch\u00f9a Tr\u1ea5n Qu\u1ed1c)", "transport": "Take a Grab taxi or Bus 50 and get off at the Ch\u00f9a Tr\u1ea5n Qu\u1ed1c stop."}, {"address": "52 \u0110\u1eb7ng Thai Mai, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Situated on a prime peninsula jutting into West Lake, Phu Tay Ho is dedicated to Princess Lieu Hanh, one of the Mother Goddesses in Vietnamese folk religion, making it an ancient and revered local shrine. The complex blends traditional Vietnamese wooden architecture with fine carvings. It attracts vast crowds of worshippers during the 1st and 15th days of the lunar month and Lunar New Year. With open waterfront views and poetic sunset vistas, it is a fantastic destination to experience native Vietnamese faith and lakeside traditions.", "name": "Phu Tay Ho Temple (Ph\u1ee7 T\u00e2y H\u1ed3)", "transport": "Taking a Grab taxi directly to the end of \u0110\u1eb7ng Thai Mai Street is recommended."}, {"address": "1 T\u1eeb Hoa, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Nestled in the historic Nghi Tam village on the eastern shore of West Lake, Kim Lien Pagoda was originally built in the 12th century as a palace for Princess Tu Hoa, daughter of King Ly Sinh Tong, before being converted into a temple. It is famous for its unique three-tiered parallel layout (resembling the Chinese character \u0027\u4e09\u0027), built entirely from precious timber. The graceful sweeping eaves and intricate wood carvings represent the peak of 18th-century Later L\u00ea Dynasty architectural art. Its serene, flower-filled courtyard makes it a hidden jewel for lovers of royal heritage and Buddhist art.", "name": "Kim Lien Pagoda (Ch\u00f9a Kim Li\u00ean)", "transport": "Easily accessible on foot or via Grab motorbike along T\u1eeb Hoa Street on the eastern shore of West Lake."}, {"address": "364 L\u1ea1c Long Qu\u00e2n, Xu\u00e2n La, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Located on the western bank of West Lake, Van Nien Pagoda boasts over a thousand years of history, dating back to 1005 AD during the Ly Dynasty. The temple is celebrated for its all-wood structure and historical artifacts, most notably a rare Shakyamuni Buddha statue carved from a single block of natural jade in the main hall, radiating a serene and gentle luster. Its quiet, classic courtyard offers a peaceful getaway, making it a rare artistic and spiritual sanctuary by West Lake.", "name": "Van Nien Pagoda (Ch\u00f9a V\u1ea1n Ni\u00ean)", "transport": "Take Bus 13, 25, 33, or 55A to the 364 L\u1ea1c Long Qu\u00e2n stop."}, {"address": "275 \u00c2u C\u01a1, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Serving as a cultural hub for literary exploration in the West Lake district, the Vietnam Literature Museum features an extensive 3,000-square-meter exhibition space. It comprehensively documents the evolution of Vietnamese literature, from oral folklore and Sino-Vietnamese Han/N\u00f4m texts to modern realism and contemporary works. Highlights include precious original manuscripts, vintage publications, re-created author studies, and personal belongings. Coupled with rich historical displays, it provides a unique intellectual sanctuary for culture lovers seeking deep insight into the Vietnamese soul.", "name": "Vietnam Literature Museum (B\u1ea3o t\u00e0ng V\u0103n h\u1ecdc Vi\u1ec7t Nam)", "transport": "About a 5-minute Grab taxi ride from the West Lake ring road to \u00c2u C\u01a1 Street."}, {"address": "1 Y\u00ean Hoa, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Set in a leafy residential neighborhood of Tay Ho, Nghi Tam Church is a peaceful center of faith and community for local Catholics. The architecture combines French colonial style with Vietnamese touches, featuring pastel walls, delicate Gothic arched windows, and a quaint bell tower that brings serenity to the urban bustle. Surrounded by lush gardens, the church sounds its sweet bells during Sunday mass, making it a charming architectural landmark in the Tay Ho district.", "name": "Nghi Tam Church (Nh\u00e0 th\u1edd Gi\u00e1o x\u1ee9 Nghi T\u00e0m)", "transport": "Recommended to take a Grab or ride a bicycle along the lakeside Y\u00ean Hoa Road."}, {"address": "67 \u0110\u1eb7ng Thai Mai, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Tucked away on the Quang An peninsula in an upscale residential area near the famous Quang Ba Flower Market, this ancient temple was built during the Later L\u00ea Dynasty. Dedicated to the Buddha and historically revered local monks, the pagoda houses numerous Ming and Qing dynasty vertical plaques, poetic couplets, and finely cast bronze bells. Shaded by ancient trees, its peaceful courtyard offers a glimpse into classic Northern Vietnamese village temple heritage, ideal for travelers seeking calm and culture.", "name": "Quang Ba Pagoda (Ch\u00f9a Qu\u1ea3ng B\u00e1)", "transport": "Located on \u0110\u1eb7ng Thai Mai Street, easily reached on foot or by Grab taxi."}, {"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Built in the 11th century when Emperor Ly Thai To established Thang Long as the capital, Quan Thanh Temple is one of the \u0027Four Sacred Temples\u0027 guarding the northern gate of the ancient citadel. Situated right by the southern edge of West Lake near Thanh Nien Road, this grand Taoist temple is famous for its nearly 4-ton black bronze statue of Tran Vu (Huyen Thien Thuong De) cast in 1677, showcasing the pinnacle of ancient Vietnamese metal casting and sculpture. Shaded by towering trees and decorated with royal plaques, it is a national treasure blending Taoist traditions, historic heritage, and fine metalwork.", "name": "Quan Thanh Temple (\u0110\u1ec1n Qu\u00e1n Th\u00e1nh)", "transport": "Located at the intersection of Thanh Ni\u00ean Boulevard and Qu\u00e1n Th\u00e1nh Street; easily accessible via Bus 50 or Grab."}], "name": "Arts Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | West Lake is Hanoi\u0027s largest natural lake, featuring a stunning 17-kilometer lakeside promenade with breathtaking waterfront scenery. Shaded by lush trees, the pathway is lined with upscale scenic cafes, French restaurants, and romantic sunset-viewing spots. In the early morning and evening, locals and expats flock here to walk, jog, and cycle while enjoying the cool lake breeze. As sunset bathes the lake in golden light, it serves as the romantic and relaxing natural heart of Hanoi.", "name": "West Lake Promenade (H\u1ed3 T\u00e2y)", "transport": "Take a Grab taxi or bus 55A or 55B to the \u0110\u01b0\u1eddng Thanh Ni\u00ean stop to arrive at the starting point of the lake promenade."}, {"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, Tr\u00fac B\u1ea1ch, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Thanh Nien Road is a tree-lined boulevard running between West Lake and Truc Bach Lake, flanked by lush flame trees and towering ancient trees, earning it a reputation as one of Hanoi\u0027s most romantic streets. Truc Bach Lake offers well-paved pathways and benches along its calm, mirror-like waters, where visitors can rent swan paddle boats in the evening. Combining natural waterscapes with a rich French historic ambience, plus charming dessert shops and cafes, it is a quintessential urban oasis.", "name": "Thanh Nien Road \u0026 Truc Bach Lake Park Area (\u0110\u01b0\u1eddng Thanh Ni\u00ean \u0026 H\u1ed3 Tr\u00fac B\u1ea1ch)", "transport": "Take bus 50, E05, or a Grab to the \u0110\u01b0\u1eddng Thanh Ni\u00ean bus stop, then walk to explore both lakes."}, {"address": "Ng\u00e3 3 Nh\u1eadt Chi\u00eau, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located on the northwest side of West Lake, West Lake Flower Valley is a colorful floral themed garden blooming year-round. It features vast fields of canola flowers, sunflowers, roses, cosmos, and Hanoi\u0027s signature peach blossoms, creating stunning landscapes and beautiful photo installations. Equipped with pavilions, a children\u0027s play area, and dining options, it is a dream destination for families, couples, and photography enthusiasts.", "name": "West Lake Flower Valley (Thung l\u0169ng hoa H\u1ed3 T\u00e2y)", "transport": "Take a Grab taxi to the end of Nh\u1eadt Chi\u00eau Road; or take bus 13 or 55A to L\u1ea1c Long Qu\u00e2n and walk for about 10 minutes."}, {"address": "Ph\u1ed1 Sen H\u1ed3 T\u00e2y, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Nestled near the Nhat Tan area of West Lake, these traditional lotus ponds burst into full bloom with pink lotus flowers every summer (May to July), filling the air with a delicate fragrance. It is not only Hanoi\u0027s premier lotus-viewing spot but also the cradle of traditional lotus tea culture, where local farmers harvest fresh flowers to make premium West Lake lotus tea. During peak season, wooden boardwalks and raised pavilions allow visitors\u2014often dressed in traditional \u00c1o D\u00e0i\u2014to capture magical photos and soak in the serene natural charm.", "name": "West Lake Lotus Ponds (\u0110\u1ea7m Sen H\u1ed3 T\u00e2y)", "transport": "Search for \u0027\u0110\u1ea7m Sen H\u1ed3 T\u00e2y\u0027 on Grab to get there directly, or take bus 55A or 55B to the \u00c2u C\u01a1 stop and walk for about 8 minutes."}, {"address": "\u0110\u01b0\u1eddng Qu\u1ea3ng An, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Extending along the eastern shore of West Lake, Quang An Road is the premier lakeside promenade in the upscale Tay Ho residential district. Away from the bustle of the Old Quarter, it features wide pedestrian paths, soaring palm trees, and platforms looking out over the water. The golden sunset reflecting on the lake is mesmerizing, and the area is dotted with chic cafes, stylish bars, and art galleries, showcasing West Lake\u0027s sophisticated, relaxed, and international lifestyle.", "name": "Quang An Promenade (\u0110\u01b0\u1eddng Qu\u1ea3ng An)", "transport": "It is recommended to take a Grab taxi to the Qu\u1ea3ng An neighborhood, or take bus 31 or 55A to \u00c2u C\u01a1 road and walk for about 5 minutes."}, {"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Tran Quoc Pagoda sits on a small island on the southeastern side of West Lake, connected to the mainland by a tree-shaded causeway. The promenade surrounding the ancient temple is framed by sparkling blue waters and century-old banyan trees, creating a serene waterfront setting filled with Zen beauty. Here, visitors can enjoy expansive views of West Lake and capture stunning sunset reflections against the backdrop of the iconic pagoda, offering a perfect harmony of nature and ancient heritage.", "name": "Tran Quoc Pagoda Lakeside Promenade (Ch\u00f9a Tr\u1ea7n Qu\u1ed1c)", "transport": "Take bus 50, E05, or a Grab to the \u0110\u01b0\u1eddng Thanh Ni\u00ean bus stop; the lakeside promenade in front of the temple is just a short walk away."}, {"address": "Ng\u00f5 264 \u00c2u C\u01a1, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Located adjacent to the northern shore of West Lake, Nhat Tan Flower Village is Hanoi\u0027s most historic horticulture and flower-growing hub. It boasts lush agricultural fields, renowned especially for pink peach blossoms (Hoa \u0110\u00e0o) and kumquat trees during Lunar New Year. The village preserves an idyllic rural landscape alongside vibrant private gardens, attracting visitors looking to stroll among green fields and blooming flowers in a peaceful countryside atmosphere.", "name": "Nhat Tan Flower Village (L\u00e0ng hoa Nh\u1eadt T\u00e2n)", "transport": "Take a Grab to Ng\u00f5 264 \u00c2u C\u01a1, or take bus 31, 55A, or 55B to the \u00c2u C\u01a1 (L\u00e0ng hoa Nh\u1eadt T\u00e2n) stop and walk in."}, {"address": "614 L\u1ea1c Long Qu\u00e2n, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | A massive recreational area on the northern shore of West Lake, offering expansive green parks and lakeside pathways alongside its water park rides. Shaded by abundant trees, the park features a giant Ferris wheel that provides sweeping views of West Lake and the Hanoi skyline. In the evening, the outdoor seating and waterfront plazas around the green area attract crowds relaxing, enjoying the cool breeze, and soaking in the lively outdoor atmosphere.", "name": "West Lake Water Park Green Area (C\u00f4ng vi\u00ean N\u01b0\u1edbc H\u1ed3 T\u00e2y)", "transport": "Take bus 13, 55A, or 55B to the C\u00f4ng vi\u00ean N\u01b0\u1edbc H\u1ed3 T\u00e2y stop, or take a Grab directly to the main park entrance."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "46 \u0110. Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Situated on a small island on the southeastern side of West Lake, Tran Quoc Pagoda is the oldest temple in Hanoi, boasting a history of over 1,400 years. The pagoda\u0027s most striking landmark is a 15-story red hexagonal stupa, where each tier enshrines a white Buddha statue and the top is crowned with a magnificent lotus motif. At sunset, the stupa casts a breathtaking reflection on the shimmering waters of West Lake, making it an essential photo spot for every visitor to Hanoi. The grounds also feature a Bodhi tree gifted by the former Prime Minister of India, grown from a cutting of the original tree under which the Buddha achieved enlightenment, exuding a peaceful atmosphere.", "name": "Tran Quoc Pagoda", "transport": "Take Bus 50 and get off at the Ch\u00f9a Tr\u1ea5n Qu\u1ed1c stop, or take a Grab taxi from Hanoi\u0027s Old Quarter for about 10 minutes."}, {"address": "614 \u0110. L\u1ea1c Long Qu\u00e2n, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Located near the West Lake Water Park, these two giant colorful ceramic dragons are iconic artistic landmarks built to commemorate Hanoi\u0027s millenary anniversary. Spanning tens of meters, the dragons are intricately mosaic-tiled with countless vibrant ceramic shards, facing the lake with grand majesty that showcases incredible craftsmanship. This spot is not only a fantastic backdrop for photos, but also a popular location for local youth and photography enthusiasts to capture sunsets and lake views, offering a unique blend of traditional craft and modern design.", "name": "Tay Ho Ceramic Dragons", "transport": "It is recommended to take a Grab car or bike directly from the Old Quarter to the Tay Ho Ceramic Dragons, which takes about 15 to 20 minutes."}, {"address": "\u0110. Sen H\u1ed3 T\u00e2y, Nh\u1eadt T\u00e2n, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | The West Lake Flower Valley is the largest themed garden in the West Lake district. Flowers bloom across all four seasons\u2014such as sunflowers, cosmos, lotuses, and violets\u2014decorating the lakeside into a picturesque paradise. The park features exotic themed scenery including Dutch windmills, Japanese-style bridges, wooden swings, and romantic flower-lined walkways, making it a hotspot for wedding photography and Instagram influencers. Visitors can take vibrant photos amid a sea of blossoms while enjoying serene, sweeping views of West Lake away from the hustle and bustle of the city.", "name": "West Lake Flower Valley (Thung Lung Hoa Ho Tay)", "transport": "Take Bus 13 or 55A to 614 L\u1ea1c Long Qu\u00e2n and walk for about 10 minutes, or take a Grab ride directly."}, {"address": "52 \u0110. \u0110\u1eb7ng Thai Mai, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Situated at the tip of a peninsula extending into West Lake, Phu Tay Ho is a renowned and bustling shrine dedicated to Princess Lieu Hanh, central to Taoist and Mother Goddess worship in Hanoi. Featuring elegant, traditional architecture surrounded by tranquil waters, it boasts an incredible location and breathtaking views. During the 1st and 15th days of the lunar month or the Lunar New Year, crowds gather here to pray for blessings and fortune. Beyond its cultural depth, the surrounding lakeside promenade is a prime photo spot where you can enjoy local delicacies like West Lake shrimp cakes while watching sunset reflections over fishing boats.", "name": "Phu Tay Ho Temple", "transport": "Take a Grab taxi to the end of \u0110\u1eb7ng Thai Mai Street; it takes about 15 minutes from the Old Quarter."}, {"address": "\u0110. Thanh Ni\u00ean, Y\u00ean Ph\u1ee5, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Thanh Nien Street is a tree-lined causeway separating West Lake and Truc Bach Lake, celebrated as one of the most romantic streets in Hanoi. Flanked by tall flame trees and ancient greenery, cool lake breezes add a poetic vibe to your stroll. Along the way, French-inspired benches and viewing platforms offer magical photo spots, especially when afternoon sunlight filters through the leaves. At dusk, as sunset paints the water in golden hues, the avenue becomes an unmissable location to experience Hanoi\u0027s relaxed and romantic lifestyle.", "name": "Thanh Nien Street Promenade (Duong Thanh Nien)", "transport": "Located southeast of West Lake, it is a 20-minute walk from the Old Quarter, or take Bus 50 directly to the \u0110. Thanh Ni\u00ean stop."}, {"address": "Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | Located on the northwestern side of West Lake, these two lakeside causeway paths are affectionately named \u0027Korean Dock\u0027 and \u0027Japanese Dock\u0027 by local youth. Offering unobstructed 180-degree lake views, colorful graffiti walls, and romantic lakeside railings, the area oozes a hip, artistic vibe. It is also one of the prime spots in Hanoi to watch the sunset dip below the horizon. Every evening, young locals gather with coffee along the embankment to chat and snap photos. After dark, city lights shimmer on the water, creating a captivating night view.", "name": "Korean \u0026 Japanese Docks (Ben Han Quoc \u0026 Ben Nhat Ban)", "transport": "It is recommended to take a Grab bike or car to the lakeside of the Qu\u1ea3ng An area; set your destination to \u0027B\u1ebfn H\u00e0n Qu\u1ed1c\u0027."}, {"address": "\u0110. Nghi T\u00e0m, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Nestled in Nghi T\u00e0m village along the northeastern shore of West Lake, Kim Lien Pagoda dates back to the 12th century, originally serving as a royal palace for a Ly Dynasty princess before becoming a temple. Renowned for its well-preserved traditional triple gate (Tam Quan) and intricate wooden carvings, its architecture seamlessly blends royal elegance with spiritual art. Sitting quietly by the water surrounded by lush greenery, this tranquil gem is a perfect hidden spot for fans of traditional architecture, cultural photography, and peaceful reflection.", "name": "Kim Lien Pagoda", "transport": "Take Bus 31, 41, or 55A to the Nghi T\u00e0m stop and walk for about 5 minutes."}, {"address": "\u0110. Qu\u1ea3ng An, Qu\u1ea3ng An, T\u00e2y H\u1ed3, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Situated on the eastern shore of West Lake, the Quang An area is the heart of Hanoi\u0027s premier expat hub and upscale district. Lined along the lakeside are numerous stylish open-air cafes, refined bistros, and rooftop bars. It is famous for offering unobstructed sunset views over West Lake while sipping authentic Vietnamese egg coffee or specialty pour-overs. From French vintage and Bohemian to modern minimalist chic, every caf\u00e9 offers a trendy backdrop for stunning photos, making it the most stylish hotspot in the West Lake area.", "name": "Quang An Sunset Cafe Street", "transport": "Take a Grab car from the Old Quarter for about 15 minutes to reach the Qu\u1ea3ng An lakeside street, and get off at any caf\u00e9 that catches your eye."}], "name": "Popular Photo Spots"}}, "name": "West Lake District and Taihu Upscale Commercial District"}};
        const cityName = "Hanoi";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
