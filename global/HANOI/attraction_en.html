    <script>
        const dbData = {"ba_dinh": {"categories": {"cat_1": {"items": [{"address": "19 Ho\u00e0ng Di\u1ec7u, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | A UNESCO World Heritage Site with over a thousand years of rich history. Once the political and power hub of multiple Vietnamese dynasties, the citadel preserves architectural ruins and archaeological findings spanning from the Ly and Tran dynasties to the Later Le dynasty. Visitors can explore the Doan Mon Gate, the foundations of Kinh Thien Palace, and underground wartime command bunkers, showcasing a fusion of deep history and culture that makes it an essential landmark for understanding Hanoi\u0027s past and present.", "name": "Imperial Citadel of Thang Long", "transport": "Take bus 22A, 33, 45, or 50 to Ho\u00e0ng Di\u1ec7u station, then walk for about 3 minutes."}, {"address": "2 H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Located at the center of Ba Dinh Square, the Ho Chi Minh Mausoleum is the final resting place of Vietnam\u0027s national hero, President Ho Chi Minh. The grand granite building blends traditional Vietnamese design with the architectural style of Lenin\u0027s Mausoleum in Moscow. Every day, locals and international visitors gather to pay their respects to President Ho Chi Minh. Featuring high security and a captivating guard-changing ceremony, it is a must-visit political and historic landmark in Hanoi.", "name": "Ho Chi Minh Mausoleum", "transport": "Take bus 09A, 18, or 33 to 18A Cao B\u00e1 Qu\u00e1t station or nearby stops around Ba Dinh Square, then walk."}, {"address": "H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Ba Dinh Square is the most historically significant gathering place in modern Vietnam, where President Ho Chi Minh proclaimed the Declaration of Independence and founded the Democratic Republic of Vietnam on September 2, 1945. The expansive square features lush green lawns, wide tree-lined avenues, and surrounding government institutions. Locals often stroll and exercise here in the morning and evening, while daily flag-raising and lowering ceremonies attract onlookers with their solemn yet welcoming atmosphere.", "name": "Ba Dinh Square", "transport": "Take bus 09A, 14CT, 22A, or 33 to stops in the Ba Dinh district, then walk."}, {"address": "Ph\u1ed1 Ch\u00f9a M\u1ed9t C\u1ed9t, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Built in 1049 by Emperor Ly Thai Tong, the One Pillar Pagoda is an iconic ancient temple and architectural marvel in Hanoi. The entire temple rests upon a single stone pillar measuring 1.25 meters in diameter, set in the middle of a lotus pond to resemble a blossoming lotus flower\u2014a symbol of purity and good fortune. Despite several reconstructions over the centuries, its unique single-pillar wooden structure and serene, sacred charm have been beautifully preserved.", "name": "One Pillar Pagoda", "transport": "Located next to the Ho Chi Minh Mausoleum and Ho Chi Minh Museum; about a 3-minute walk."}, {"address": "28A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Built in 1812 during the Nguyen Dynasty, the Hanoi Flag Tower stands approximately 33 meters tall and is one of the few intact structures of the Imperial Citadel that survived the French colonial era. Consisting of three square base tiers and an octagonal tower topped with the national flag of Vietnam, this grand structure features a spiral staircase leading to top-tier viewing ports. Today, it is recognized as a National Historic Landmark and a highlight of the Vietnam Military History Museum grounds.", "name": "Hanoi Flag Tower", "transport": "Take bus 02, 09A, 18, or 41 to \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 station."}, {"address": "2 H\u00f9ng V\u01b0\u01a1ng, Ng\u1ecdc H\u1ed3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Constructed between 1900 and 1906 as the former Palace of the Governor-General of French Indochina, this striking bright-yellow mansion is a classic example of French colonial architecture inspired by European palace styles. While the main building interior is generally closed to the public, visitors can purchase tickets to explore the manicured French-style gardens, President Ho Chi Minh\u0027s modest stilt house, and peaceful garden pond.", "name": "Presidential Palace", "transport": "Located on the north side of Ba Dinh Square. Take bus 22A, 33, 45, or 50 to H\u00f9ng V\u01b0\u01a1ng station, then walk."}, {"address": "Phan \u0110\u00ecnh Ph\u00f9ng, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | The North Gate (C\u1eeda B\u1eafc) was constructed during the Nguyen Dynasty and remains one of the few surviving original gate towers of the Imperial Citadel\u0027s defensive walls. Built with heavy stone and brick in a double-tiered structure, the upper level houses an altar honoring national heroes who resisted French invasion. Notably, cannonball marks from French artillery attacks in 1882 are still visible on the walls, offering a poignant testament to Hanoi\u0027s modern history.", "name": "North Gate of Thang Long Citadel (C\u1eeda B\u1eafc)", "transport": "Take bus 22A, 33, 45, or 50 to Phan \u0110\u00ecnh Ph\u00f9ng station, then walk for about 2 minutes."}, {"address": "19 Ho\u00e0ng Di\u1ec7u, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam (Located inside the Imperial Citadel of Thang Long grounds)", "feature": "\u2b50 4.5 stars | K\u00ednh Thi\u00ean Palace was the central and most supreme royal palace within the Imperial Citadel of Thang Long, built in 1428 during the Later Le Dynasty as the venue for major imperial ceremonies and court assemblies. Although the main hall was destroyed during wartime, the surviving Ming-era carved dragon stone steps are of immense historical and artistic value. Featuring intricately sculpted green-stone dragons flanking the staircase, this national treasure is a essential highlight when visiting the citadel.", "name": "K\u00ednh Thi\u00ean Palace Ruins", "transport": "Walk to the central area after entering the Imperial Citadel of Thang Long complex."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "66 Nguy\u1ec5n Th\u00e1i H\u1ecdc, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Housed in an exquisite French colonial building from the 1930s that formerly served as a French girls\u0027 boarding school, the Vietnam Fine Arts Museum features over 20,000 artworks spanning from the Stone Age to the present day. Collections include ancient lacquerware, wood carvings, Cham stone sculptures, folk prints, and modern paintings reflecting Vietnam\u0027s war of independence and rural life. Must-see highlights include the multi-armed and multi-eyed Avalokiteshvara wooden statue and lacquer masterpieces by artist Nguy\u1ec5n Gia Tr\u00ed. With its serene and elegant atmosphere, it is the premier destination to explore the evolution of Vietnamese visual arts and contemporary culture.", "name": "Vietnam Fine Arts Museum", "transport": "Take bus 02, 18, 32, or 34 to Nguy\u1ec5n Th\u00e1i H\u1ecdc station and walk for about 2 minutes, or walk about 10 minutes from Ba Dinh Square."}, {"address": "28A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | As one of Vietnam\u0027s seven national museums, the Vietnam Military History Museum is located adjacent to the Imperial Citadel of Thang Long and the Hanoi Flag Tower. The outdoor exhibition showcases real weaponry and war trophies from the French and American wars, including B-52 bomber wreckage, MiG-21 fighters, and T-54 tanks. Indoor galleries detail Vietnam\u0027s military history and strategic warfare tactics from ancient times to the present. The historic Hanoi Flag Tower within the grounds is one of the city\u0027s few intact historic structures, offering panoramic views of Ba Dinh District from the top\u2014a must-visit for military buffs and history lovers.", "name": "Vietnam Military History Museum", "transport": "Take bus 09A or 18 to \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 station, or walk south for about 5 minutes from the Doan Mon Gate of the Imperial Citadel of Thang Long."}, {"address": "19 Ng\u1ecdc H\u00e0, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Built in 1990 to commemorate the centennial birthday of Vietnam\u0027s founding leader, Ho Chi Minh, the museum features a striking modernist architectural design resembling a giant blooming white lotus. Inside, the avant-garde exhibition uses cubism, symbolism, and modern lighting effects to blend Ho Chi Minh\u0027s life, revolutionary philosophy, and international historical context seamlessly. Displays include handwritten manuscripts, personal items, revolutionary replicas, and symbolic sculptures created by international artists, offering intense visual impact and historical depth.", "name": "Ho Chi Minh Museum", "transport": "Take bus 09A, 09B, or 14 to L\u00ea H\u1ed3ng Phong station, then walk about 3 minutes to reach the museum within the Ba Dinh Square complex."}, {"address": "56 Phan \u0110\u00ecnh Ph\u00f9ng, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Built in 1932 during the French colonial period and designed by French architect Ernest H\u00e9brard, Cua Bac Church is a prime example of Indochina Architecture, blending European Romanesque and Gothic elements with traditional Vietnamese roofs. Featuring an asymmetrical bell tower and yellow-and-white exterior, it stands elegantly amid the leafy canopy of Phan \u0110\u00ecnh Ph\u00f9ng Street. The interior boasts stunning stained glass windows and soaring vaulted ceilings; notably, US President George W. Bush attended a service here in 2006. Located directly across from the North Gate of the Imperial Citadel of Thang Long, it radiates unique historical charm.", "name": "Cua Bac Church", "transport": "Take bus 14 or 22A to Phan \u0110\u00ecnh Ph\u00f9ng station; located directly opposite the North Gate of the Imperial Citadel of Thang Long."}, {"address": "157 \u0110\u1ed9i C\u1ea5n, Ng\u1ecdc H\u00e0, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | The B-52 Victory Museum commemorates the defense victory of Vietnamese air defense forces during the US bombing raids on Hanoi in late 1972 (known as the \u0027Dien Bien Phu in the Air\u0027 battle). The outdoor area displays the massive wreckage of a downed US B-52 bomber, anti-aircraft missiles, artillery, and MiG fighter jets. Indoor exhibits detail historical photos, tactical maps, air-raid shelters, and personal artifacts of air defense heroes. The museum offers a vivid visual testimony to the resilience of Hanoi\u0027s citizens during the war and the late-stage aerial history of the Vietnam War.", "name": "B-52 Victory Museum", "transport": "Take bus 09A to \u0110\u1ed9i C\u1ea5n station and walk about 3 minutes; located southwest of the Ho Chi Minh Mausoleum."}, {"address": "18 Ho\u00e0ng Di\u1ec7u, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Located within the 18 Ho\u00e0ng Di\u1ec7u Archaeological Site inside the UNESCO World Heritage Imperial Citadel of Thang Long, this center is the core exhibition hall showcasing royal palace remains and artifacts spanning thousands of years across various Vietnamese dynasties (L\u00fd, Tr\u1ea7n, L\u00ea, and Nguy\u1ec5n). Divided into underground and ground-level zones, it utilizes advanced lighting, projections, and transparent glass walkways, allowing visitors to view overlapping ancient palace foundations, drainage systems, and wells. Thousands of excavated royal ceramics, carved roof tiles, gold/silver ornaments, and dragon-and-phoenix architectural elements are displayed, making it an essential visit to discover Hanoi\u0027s thousand-year imperial heritage.", "name": "Thang Long Citadel Archaeological Exhibition Center", "transport": "Take bus 22A, 45, or 50 to Ho\u00e0ng Di\u1ec7u station; the entrance to the archaeological exhibition center is right there."}, {"address": "37 Tr\u1ea7n Ph\u00fa, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Nestled among the leafy shade of Tr\u1ea7n Ph\u00fa Street in Ba Dinh District, St. Paul Convent Chapel belongs to the Sisters of St. Paul of Chartres and was built between the late 19th and early 20th centuries. Featuring elegant Neo-Gothic architectural language with pure white and pale yellow exterior walls, the chapel feels solemn yet welcoming. Inside, intricate ribbed vaults, a beautiful wooden altar, and bright stained-glass windows create a serene and sacred atmosphere. Though small in scale, its long history of charitable care and well-preserved classic French convent style make it a hidden cultural and spiritual gem in Ba Dinh.", "name": "St. Paul Convent Chapel Hanoi", "transport": "Take bus 09A, 18, or 32 to Tr\u1ea7n Ph\u00fa station, then walk for about 2 minutes."}, {"address": "18 Ho\u00e0ng Di\u1ec7u, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Located inside the Imperial Citadel of Thang Long, the D67 House was built in 1967 during the Vietnam War as the secret command headquarters for the High Command of the Vietnam People\u0027s Army, including General V\u00f5 Nguy\u00ean Gi\u00e1p. Designed as a single-story modernist building with bomb- and chemical-proof reinforced structures, its interior faithfully preserves military meeting rooms, map analysis spaces, cipher communications equipment, and leadership desks. Stairs lead down to deep reinforced concrete underground bunkers. Combining ancient imperial heritage with modern military geopolitics, it holds immense historical and educational value.", "name": "D67 House and Bunker Museum", "transport": "Take bus 22A to Ho\u00e0ng Di\u1ec7u station, enter through the main entrance of the Imperial Citadel of Thang Long, and walk to the area behind K\u00ednh Thi\u00ean Palace."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "3 Ho\u00e0ng Hoa Th\u00e1m, Ng\u1ecdc H\u1ed3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 stars | Founded in 1890 during the French colonial era, this is one of the oldest green oases in central Hanoi. Spanning a vast area, it features hundreds of rare century-old trees, tropical plants, tranquil lakes, and rolling hillocks, earning it the nickname \u0027The Green Lung of Hanoi.\u0027 The environment here is extremely peaceful, just steps away from Ba Dinh Square, making it a fantastic spot for local residents to enjoy morning exercise, take strolls, and escape the hustle and bustle of the city.", "name": "Hanoi Botanical Garden (C\u00f4ng vi\u00ean B\u00e1ch Th\u1ea3o)", "transport": "Take bus 09A, 14CT, or 45 to the 12 Ho\u00e0ng Hoa Th\u00e1m stop, then walk for about 3 minutes."}, {"address": "28A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | Located in the heart of Ba Dinh District, right next to the Vietnam Military History Museum and the Flag Tower of Hanoi. The park is lush with trees and features a bronze statue of Lenin at its center. Brimming with authentic local life, you\u0027ll often see locals skateboarding, roller-skating, square dancing, or taking leisurely walks in the afternoon. It\u0027s a prime location to observe everyday life in Hanoi while relaxing under the shade of mature trees.", "name": "Lenin Park (C\u00f4ng vi\u00ean L\u00ea Nin)", "transport": "Take bus 18, 09A, or 41 to the C\u1ed9t C\u1edd H\u00e0 N\u1ed9i stop, then walk for about 2 minutes."}, {"address": "\u0110\u01b0\u1eddng Thanh Ni\u00ean, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Truc Bach Lake was originally part of West Lake until it was separated by the construction of a causeway in the 17th century. Thanh Nien Road (\u0110\u01b0\u1eddng Thanh Ni\u00ean), which divides the two lakes, is lined with tall flamboyant trees and golden trumpet trees, offering magnificent views of the sparkling waters on both sides. Strolling along the lakeside promenade, you can admire swan boats gliding across the water and beautiful sunsets. Shaded stone benches and charming cafes are scattered everywhere, making this one of the most romantic natural scenic spots in Ba Dinh District.", "name": "Truc Bach Lake \u0026 Thanh Nien Road Greenbelt (H\u1ed3 Tr\u00fac B\u1ea1ch)", "transport": "Take bus 33 or 50 to the 167 Th\u1ee5y Khu\u00ea stop or a bus stop near Tran Quoc Pagoda, then walk for about 3 minutes."}, {"address": "2 H\u00f9ng V\u01b0\u01a1ng, Ng\u1ecdc H\u1ed3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 stars | Located inside the Presidential Palace complex next to the Ho Chi Minh Mausoleum, this park features impeccably landscaped French-style gardens and a grand Mango Avenue. At the heart of the garden lies a clear, year-round carp pond surrounded by lush tropical trees and a traditional stilt house. Teeming with vibrant flowers and singing birds, it beautifully showcases a unique blend of French landscape art and Vietnam\u0027s tropical natural beauty.", "name": "Presidential Palace Gardens \u0026 Carp Pond (V\u01b0\u1eddn Ph\u1ee7 Ch\u1ee7 T\u1ecbch)", "transport": "Take bus 09A, 18, or 22A to the Qu\u1ea3ng Tr\u01b0\u1eddng Ba \u0110\u00ecnh stop, then walk about 5 minutes into the grounds."}, {"address": "19C Ho\u00e0ng Di\u1ec7u, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | The Imperial Citadel of Thang Long grounds encompass vast green spaces and ancient tree gardens. Blending a thousand-year-old archaeological site with serene natural landscapes, its walkways are lined with century-old trees and exquisite bonsai displays. Strolling through the grounds allows you to soak in both the rich history of a UNESCO World Heritage site and the fresh breeze and sunshine across open lawns and peaceful green spaces\u2014a wonderful harmony of culture and nature.", "name": "Thang Long Imperial Citadel Park Grounds (C\u00f4ng vi\u00ean Ho\u00e0ng Th\u00e0nh Th\u0103ng Long)", "transport": "Take bus 22A, 33, or 45 to the 18 Ho\u00e0ng Di\u1ec7u stop, then walk for about 2 minutes to enter."}, {"address": "Ph\u1ed1 Ng\u1ecdc H\u00e0, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.1 stars | Historically, Ngoc Ha Village was a famous flower-growing village supplying blooms to the royal court and Hanoi city. Although transformed into a modern residential neighborhood today, its alleys still harbor numerous private gardens, bonsai workshops, and lush green ponds (including the famous B-52 Wreckage Lake). Wandering through its winding alleyways, you can see courtyards filled with blooming flowers and greenery, experiencing the rich horticultural traditions and quiet, natural lifestyle of this historic flower village.", "name": "Ngoc Ha Flower Village \u0026 Gardens (L\u00e0ng Hoa Ng\u1ecdc H\u00e0)", "transport": "Take bus 09A to the B\u1ea3o T\u00e0ng H\u1ed3 Ch\u00ed Minh stop, then walk along Ng\u1ecdc H\u00e0 Street for about 8 minutes to reach the village area."}, {"address": "H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | More than just a political hub, the area surrounding Ba Dinh Square consists of 240 evergreen grass squares, forming the largest open green space park in Hanoi. The vast, stretching lawns blend beautifully with towering bamboo groves, pine trees, and tropical blooms surrounding the area. In the morning and evening, the refreshing breeze and wide open skies make this urban green space one of the freshest and most expansive places in all of Hanoi.", "name": "Ba Dinh Lawn \u0026 Park Grounds (Qu\u1ea3ng tr\u01b0\u1eddng Ba \u0110\u00ecnh Park Zone)", "transport": "Take bus 09A, 18, or 22A to the Qu\u1ea3ng Tr\u01b0\u1eddng Ba \u0110\u00ecnh stop."}, {"address": "\u0110\u01b0\u1eddng Nguy\u1ec5n \u0110\u00ecnh Thi, Th\u1ee5y Khu\u00ea, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Situated along the northwestern edge of Ba Dinh District, the West Lake South Shore Promenade is one of Hanoi\u0027s most popular waterfront park areas. Extending along Nguy\u1ec5n \u0110\u00ecnh Thi Street, this lakeside park is planted with numerous weeping willows and tropical greenery, featuring wide wooden boardwalks and water-facing platforms. Offering panoramic views of West Lake\u0027s sprawling waters and surrounding landscape, it is a delightful natural spot for watching sunsets, breathing fresh air, and taking relaxing walks.", "name": "West Lake South Shore Park Promenade (\u0110\u01b0\u1eddng Nguy\u1ec5n \u0110\u00ecnh Thi)", "transport": "Take bus 45 or 144 to the Th\u1ee5y Khu\u00ea stop, then walk north for about 5 minutes to the lakeside promenade."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 Stars | Ba Dinh Square is the most important historical landmark in modern Vietnam, where President Ho Chi Minh read the Declaration of Independence in 1945 to found the Democratic Republic of Vietnam. The lush green lawn set against grand government buildings makes it a must-visit spot to capture breathtaking photos and experience rich political history.", "name": "Ba Dinh Square (Qu\u1ea3ng tr\u01b0\u1eddng Ba \u0110\u00ecnh)", "transport": "Take bus 09A or 22A to H\u00f9ng V\u01b0\u01a1ng stop, then walk to arrive."}, {"address": "19C Ho\u00e0ng Di\u1ec7u, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 Stars | A UNESCO World Heritage site with over a thousand years of history, the Imperial Citadel of Thang Long preserves ancient structures such as Doan Mon Gate, the foundation of Kinh Thien Palace, and Hau Lau. Its ancient red brick walls and quaint parklands attract countless visitors for photos, making it a popular hotspot for taking stunning pictures in traditional Vietnamese Ao Dai.", "name": "Imperial Citadel of Thang Long (Ho\u00e0ng th\u00e0nh Th\u0103ng Long)", "transport": "About a 10-minute walk from Ba Dinh Square, or take bus 22A to Ho\u00e0ng Di\u1ec7u stop."}, {"address": "2 H\u00f9ng V\u01b0\u01a1ng, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 Stars | Located on the west side of Ba Dinh Square, the mausoleum features a solemn granite architectural style. Surrounded by flora from across Vietnam, the Changing of the Guard ceremony is a classic moment for visitors to photograph, reflecting the profound respect Vietnamese people hold for their founding father.", "name": "Ho Chi Minh Mausoleum (L\u0103ng Ch\u1ee7 t\u1ecbch H\u1ed3 Ch\u00ed Minh)", "transport": "Take bus 09A, 18, or 33 to L\u00ea H\u1ed3ng Phong stop."}, {"address": "Ch\u00f9a M\u1ed9t C\u1ed9t, \u0110\u1ed9i C\u1ea5n, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 Stars | Built in 1049, this ancient temple stands gracefully on a single stone pillar, resembling a blooming lotus rising out of a pond. As one of Hanoi\u0027s iconic landmarks, legend has it that praying here for children is especially efficacious. Its unique architecture makes it a fantastic photography spot.", "name": "One Pillar Pagoda (Ch\u00f9a M\u1ed9t C\u1ed9t)", "transport": "Located right next to Ho Chi Minh Mausoleum, about a 3-minute walk from Ba Dinh Square."}, {"address": "28A \u0110i\u1ec7n Bi\u00ean Ph\u1ee7, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 Stars | Standing next to the Vietnam Military History Museum, the Hanoi Flag Tower was built in the early 19th century and is one of the few intact structures left from the Imperial Citadel of Thang Long. Its majestic octagonal tower topped with the flying Vietnamese flag against a clear blue sky creates a breathtaking view, making it an iconic photo spot.", "name": "Hanoi Flag Tower (C\u1ed9t c\u1edd H\u00e0 N\u1ed9i)", "transport": "Take bus 02, 18, or 34 to \u0110i\u1ec7n Bi\u00ean Ph\u1ee7 stop, then walk for about 2 minutes."}, {"address": "2 H\u00f9ng V\u01b0\u01a1ng, Ng\u1ecdc H\u1ed3, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.3 Stars | Built in the early 20th century, this classic French colonial building features vibrant yellow walls, elegant arches, and French wooden windows that radiate European charm. Although the main building interior is closed to the public, its ornate exterior and lush surrounding gardens draw countless photography enthusiasts.", "name": "Presidential Palace (Ph\u1ee7 Ch\u1ee7 t\u1ecbch)", "transport": "Adjoining the Ho Chi Minh Mausoleum, about a 2-minute walk from Ba Dinh Square."}, {"address": "\u0110. Thanh Ni\u00ean, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 Stars | Located near West Lake and Truc Bach Lake, this 11th-century Taoist temple houses a massive four-ton black bronze statue of Xuanwu. Featuring ornate wooden gate carvings and an atmosphere filled with incense smoke, it offers deep cultural roots and is a wonderful spot to experience Hanoi\u0027s Taoist history while taking traditional-style photos.", "name": "Quan Thanh Temple (\u0110\u1ec1n Qu\u00e1n Th\u00e1nh)", "transport": "Take bus 50 to \u0110\u1ed9i C\u1ea5n stop, or walk along Thanh Ni\u00ean Road."}, {"address": "56 Phan \u0110\u00ecnh Ph\u00f9ng, Qu\u00e1n Th\u00e1nh, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.4 Stars | Built in the 1930s, Cua Bac Church blends Art Deco design with traditional Vietnamese architectural elements. Its unique pale yellow walls, turquoise roof tiles, and towering belfry make it instantly recognizable. Nestled on a tree-lined street, its serene and elegant ambiance makes it a favorite hidden gem for photo lovers and aesthetic seekers.", "name": "Cua Bac Church (Nh\u00e0 th\u1edd C\u1eeda B\u1eafc)", "transport": "Take bus 22A to Phan \u0110\u00ecnh Ph\u00f9ng stop, then walk for 1 minute."}], "name": "Top Photo Spots"}}, "name": "Ba Dinh Square and the Imperial Citadel of Thang Long Area"}, "cau_giay_my_dinh": {"categories": {"cat_1": {"items": [{"address": "Khu \u0111\u00f4 th\u1ecb m\u1edbi C\u1ea7u Gi\u1ea5y, Ph\u1ea1m H\u00f9ng, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.4 stars | Formerly Vietnam\u0027s tallest building, Keangnam Hanoi Landmark 72 is situated in the heart of the emerging M\u1ef9 \u0110\u00ecnh commercial district, showcasing Hanoi\u0027s architectural ambitions toward modernization and internationalization. The complex consists of several soaring skyscrapers featuring futuristic steel-and-glass curtain walls that shimmer under the sunlight. Inside, it houses premium office spaces, a 5-star hotel, and luxury residences. Its top floor previously featured an observation deck offering sweeping views of Hanoi\u0027s bustling new city center, making it an unmissable landmark to experience the city\u0027s modern skyline.", "name": "Keangnam Hanoi Landmark 72", "transport": "Take bus 21B, 22A, 33, 39, or 44 and get off at Landmark 72 station."}, {"address": "Ph\u1ea1m H\u00f9ng, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.3 stars | Located next to the National Convention Center in M\u1ef9 \u0110\u00ecnh, the Hanoi Museum is a modern architectural masterpiece built to commemorate the 1,000th anniversary of Hanoi\u0027s founding. Its most striking feature is its unique inverted pyramid design\u2014broad at the top and narrow at the bottom\u2014delivering a bold visual impact and contemporary avant-garde aesthetic. Surrounded by lush gardens and artificial lakes, the museum houses tens of thousands of precious artifacts documenting a millennium of Hanoi\u0027s historical evolution. From its striking geometric lines to the seamless spiral corridors inside, it is truly a sight to behold.", "name": "Hanoi Museum (B\u1ea3o t\u00e0ng H\u00e0 N\u1ed9i)", "transport": "Take bus 21B, 22A, 33, 35A, 39, or 50 to Trung t\u00e2m H\u1ed9i ngh\u1ecb Qu\u1ed1c gia station and walk for about 3 minutes."}, {"address": "Nguy\u1ec5n V\u0103n Huy\u00ean, Quan Hoa, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.6 stars | Located in the C\u1ea7u Gi\u1ea5y District, the Vietnam Museum of Ethnology is widely regarded as one of the finest museums and cultural architectural complexes in Vietnam. It is divided into three main exhibition areas: the circular main building \u0027Drum\u0027 designed by a Vietnamese architect, an outdoor traditional architecture park, and the Southeast Asian Cultural Exhibition Hall. The outdoor section features faithful reconstructions of traditional homes from Vietnam\u0027s 54 ethnic groups, including towering communal houses (R\u00f4ng), Bahnar stilt houses, and traditional woven bamboo structures. Seamlessly blending historical landscapes with modern museum functions, it is an outstanding landmark for discovering Vietnam\u0027s rich ethnic diversity and traditional architecture.", "name": "Vietnam Museum of Ethnology (B\u1ea3o t\u00e0ng D\u00e2n t\u1ed9c h\u1ecdc Vi\u1ec7t Nam)", "transport": "Take bus 07, 38, 85, or 96 and get off at B\u1ea3o t\u00e0ng D\u00e2n t\u1ed9c h\u1ecdc Vi\u1ec7t Nam station."}, {"address": "L\u00ea \u0110\u1ee9c Th\u1ecd Street, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.4 stars | Completed in 2003, M\u1ef9 \u0110\u00ecnh National Stadium is Vietnam\u0027s largest and most iconic sports landmark, serving as the main venue for major international sporting events, such as the SEA Games, as well as mega concerts. Designed with a sleek modern aesthetic, its massive semi-open arched roof and imposing grandstands evoke grandeur and power. With a seating capacity of over 40,000 spectators, the stadium is surrounded by expansive plazas and lush green spaces. On game nights or celebratory events, brilliant lighting illuminates this modern sports sanctuary in spectacular fashion.", "name": "M\u1ef9 \u0110\u00ecnh National Stadium (S\u00e2n v\u1eadn \u0111\u1ed9ng Qu\u1ed1c gia M\u1ef9 \u0110\u00ecnh)", "transport": "Take bus 26, 50, 84, or 104 and get off at S\u00e2n v\u1eadn \u0111\u1ed9ng Qu\u1ed1c gia M\u1ef9 \u0110\u00ecnh station."}, {"address": "Ch\u00f9a H\u00e0 Street, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.5 stars | Ha Pagoda (also known as Th\u00e1nh \u0110\u1ee9c Temple) is the most famous centuries-old temple and historic religious landmark in C\u1ea7u Gi\u1ea5y District, with origins dating back to the L\u00fd Dynasty. Renowned for granting luck in romance and love, it attracts countless young men and women seeking blessings. The architecture preserves traditional Northern Vietnamese wooden carving artistry, complemented by an elegant triple-arched gate, a serene crescent pond, and a courtyard shaded by ancient trees. Amidst the bustling modern C\u1ea7u Gi\u1ea5y commercial district, it offers a remarkably tranquil and atmospheric retreat.", "name": "Ha Pagoda (Ch\u00f9a H\u00e0)", "transport": "Take bus 07, 26, 27, 32, 34, 38, or 49 to C\u1ea7u Gi\u1ea5y Transfer Station, then walk for about 8 minutes."}, {"address": "Ph\u1ea1m H\u00f9ng, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.5 stars | The National Convention Center is Vietnam\u0027s largest convention complex and one of the most iconic national landmarks in the modern M\u1ef9 \u0110\u00ecnh commercial hub. Its main building features an elegantly swooping wave-shaped roofline, symbolizing the rolling waves of the East Sea and the vibrant dynamism of Vietnam\u0027s growth. Constructed with high-specification glass curtain walls and majestic white pillars, it is surrounded by sprawling water gardens, fountain plazas, and lush green lawns, showcasing a magnificent contemporary architectural aesthetic and futuristic feel.", "name": "National Convention Center (Trung t\u00e2m H\u1ed9i ngh\u1ecb Qu\u1ed1c gia)", "transport": "Take bus 21B, 22A, 33, 39, 50, or 103A and get off at Trung t\u00e2m H\u1ed9i ngh\u1ecb Qu\u1ed1c gia station."}, {"address": "Y\u00ean H\u00f2a Street, Y\u00ean H\u00f2a, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.3 stars | Tucked away in an ancient neighborhood of Y\u00ean H\u00f2a Ward, C\u1ea7u Gi\u1ea5y District, Cot Pagoda (formerly known as Ng\u1ecdc Qu\u00e1n Pagoda) is a historic traditional Buddhist sanctuary. Founded centuries ago, its architectural layout follows the classic \u0027T\u0027-shape (\u0110inh shape) typical of temples in the Red River Delta. The interior houses numerous wooden Buddha statues along with intricately carved couplets and plaques. With an elegant bell tower and mountain gate adornments, the marks of time give this ancient pagoda a deep sense of historical character\u2014a wonderfully preserved heritage corner beside the modern skyscrapers of C\u1ea7u Gi\u1ea5y.", "name": "Cot Pagoda (Ch\u00f9a C\u00f3t)", "transport": "Take bus 51, 84, or 104 to Ph\u1ed1 Y\u00ean H\u00f2a station, then walk down the alleyway for about 5 minutes."}, {"address": "D\u1ecbch V\u1ecdng Street, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.2 stars | Dich Vong Communal House is a vital spiritual center of traditional village culture in C\u1ea7u Gi\u1ea5y District, showcasing the unique structure and social role of a traditional Vietnamese communal house (\u0110\u00ecnh). Built with double-eaved hip roofs and sturdy precious hardwood beams, the interior features intricate, lifelike carvings of dragons playing with pearls and auspicious clouds. Dedicated to local guardian deities and historical figures, it hosts vibrant traditional festivals and folk activities during village celebrations, making it an indispensable piece of heritage for exploring the history and wooden architecture of the C\u1ea7u Gi\u1ea5y area.", "name": "Dich Vong Communal House (\u0110\u00ecnh D\u1ecbch V\u1ecdng)", "transport": "Take bus 28, 85, or 96 to Ph\u1ed1 D\u1ecbch V\u1ecdng station and walk for about 4 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Nguy\u1ec5n V\u0103n Huy\u00ean Street, Quan Hoa, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.6 stars | The Vietnam Museum of Ethnology is the most iconic cultural landmark in C\u1ea7u Gi\u1ea5y District, highly acclaimed by international travelers and scholars. Covering a vast area, it is divided into two core sections: an indoor exhibition hall and an outdoor display area. The indoor galleries detailedly display traditional costumes, religious ritual artifacts, everyday utensils, and precious historical photographs of Vietnam\u0027s 54 ethnic groups, complemented by multilingual explanations and video introductions that offer deep insights into the evolution of Vietnam\u0027s diverse ethnic heritage. The outdoor area features 1:1 scale full-size reconstructions of stilt houses, Bahnar communal houses, Ede longhouses, and unique tomb structures\u2014visitors can even step inside to experience traditional living spaces. On weekends, the museum also hosts water puppet shows and traditional craft workshops, offering immense educational and cultural value.", "name": "Vietnam Museum of Ethnology", "transport": "Take a taxi or Grab (approx. 15-minute ride); or take bus No. 07 or 38 to Nguy\u1ec5n V\u0103n Huy\u00ean stop and walk for about 3 minutes."}, {"address": "Ph\u1ea1m H\u00f9ng Street, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.4 stars | Located in the heart of the M\u1ef9 \u0110\u00ecnh commercial district, the Hanoi Museum is renowned for its avant-garde inverted pyramid architectural structure, standing as an impressive modern landmark. The interior features a stairless, gently sloping spiral ramp where visitors can walk upwards to explore Hanoi\u0027s historical evolution from the ancient capital of Th\u0103ng Long to the present day. The museum houses tens of thousands of precious artifacts, including bronzeware, ancient ceramics, folk arts, traditional weapons, as well as large 3D dioramas replicating old Hanoi streetscapes alongside interactive multimedia displays. Beyond permanent historical exhibits, the surrounding expansive gardens and scenic lakeside grounds frequently host large sculpture installations, making it an unmissable destination for history buffs and modern architecture photography enthusiasts.", "name": "Hanoi Museum", "transport": "Take bus 21B, 22A, 33, 39, or 30 to Trung t\u00e2m H\u1ed9i ngh\u1ecb Qu\u1ed1c gia (National Convention Center) stop, then walk for about 5 minutes."}, {"address": "Th\u0103ng Long Avenue, T\u00e2y M\u1ed7, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.7 stars | Recently built and relocated to the Nam T\u1eeb Li\u00eam District (adjacent to the modern M\u1ef9 \u0110\u00ecnh commercial hub), the new site of the Vietnam Military History Museum features breathtaking modern architecture and massive exhibition space. The new museum cleverly integrates high-tech digital multimedia, massive historical terrain models, and realistic combat scene recreations. The outdoor plaza displays an impressive array of heavy weaponry used during the Vietnam War, including fighter jets, MiG aircraft, tanks, anti-aircraft guns, and Mi-24 helicopters, creating an extraordinarily striking visual impact. Inside, the museum meticulously documents Vietnam\u0027s arduous struggle for independence against foreign aggression and its modern defense development. Its grand scale and sophisticated display design have made it one of Hanoi\u0027s newest and most popular cultural attractions.", "name": "Vietnam Military History Museum (New Site)", "transport": "Taking a Grab or taxi directly is recommended; alternatively, take VinBus electric bus E05, E07, or E09 to the Smart City stop and walk to the museum."}, {"address": "72nd Floor, Keangnam Hanoi Landmark Tower, Ph\u1ea1m H\u00f9ng, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.3 stars | Located on the top floor of Keangnam Landmark 72, the tallest skyscraper in the M\u1ef9 \u0110\u00ecnh commercial district, Sky72 combines a high-altitude art gallery, 3D trick art museum, and city observatory. The gallery regularly invites local Vietnamese contemporary artists and international creators to host painting exhibitions, photography shows, and special visual art exhibits. While appreciating modern visual art creations, guests can enjoy panoramic glass-window views over the sprawling cityscape of C\u1ea7u Gi\u1ea5y and M\u1ef9 \u0110\u00ecnh. The venue also features uniquely styled art installations and interactive photo zones, seamlessly blending modern luxury with a sky-high cultural art experience\u2014making it perfect for art lovers and photography enthusiasts.", "name": "Sky72 Art Gallery \u0026 Observatory (Keangnam Landmark)", "transport": "Take a Grab or taxi directly to the Keangnam Landmark 72 tower; or take bus No. 21B, 33, 39, or 44 to Ph\u1ea1m H\u00f9ng stop and enter the building."}, {"address": "88 Nguy\u1ec5n Kh\u00e1nh To\u00e0n Street, Quan Hoa, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.4 stars | C\u1ea7u Gi\u1ea5y Parish Church is one of the few well-preserved historic Catholic churches in the bustling C\u1ea7u Gi\u1ea5y area, offering a serene religious atmosphere. Its exterior blends French Gothic architectural language with traditional Vietnamese decorative motifs. The elegant twin towers and pointed arch windows stand out distinctly amid the surrounding high-rises. Inside, warm wooden pews line the nave, and exquisite stained-glass religious artworks above the altar cast brilliant, colorful patterns of light when sunlight filters through. It serves not only as a central place of prayer and Sunday Mass for local Catholics, but its peaceful, beautiful courtyard and tranquil ambiance also offer a spiritual refuge and a glimpse of Gothic architecture amid the vibrant district.", "name": "C\u1ea7u Gi\u1ea5y Parish Church", "transport": "Take bus No. 12, 38, or 07 to Nguy\u1ec5n Kh\u00e1nh To\u00e0n stop, then walk for about 3 minutes."}, {"address": "1st Floor, Dolphin Plaza, 2 Nguy\u1ec5n Ho\u00e0ng, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.3 stars | Tucked away inside Dolphin Plaza in the M\u1ef9 \u0110\u00ecnh area, Heritage Space is a highly influential independent contemporary art center in Hanoi. It is dedicated to promoting interdisciplinary avant-garde art across Vietnam and Southeast Asia, spanning contemporary painting, installation art, experimental music, physical theater, and video art. Beyond hosting high-caliber art exhibitions, it regularly runs artist residencies, cultural salon lectures, and workshops, drawing numerous local young artists and international art enthusiasts for creative exchange. With a modern industrial design and an open, creative atmosphere, it is a top spot for exploring Hanoi\u0027s contemporary avant-garde culture and alternative art trends.", "name": "Heritage Space Contemporary Art Center", "transport": "Located near M\u1ef9 \u0110\u00ecnh Bus Station; take a taxi directly to Dolphin Plaza, or take bus No. 16, 30, 34, or 46 to B\u1ebfn xe M\u1ef9 \u0110\u00ecnh (M\u1ef9 \u0110\u00ecnh Bus Station) stop and walk for 5 minutes."}, {"address": "2nd Floor, Roman Plaza, T\u1ed1 H\u1eefu, \u0110\u1ea1i M\u1ed7, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.6 stars | The Outpost is an emerging private modern art center near the M\u1ef9 \u0110\u00ecnh commercial district, focusing on collecting, preserving, and exhibiting outstanding works by contemporary Vietnamese artists. Featuring a minimalist and abstract architectural style, the venue cleverly utilizes light and shadow to create a tranquil, contemplative viewing environment. The exhibitions offer profound depth, exploring themes such as urban-rural transformation, personal identity, ecological environment, and social transitions through oil paintings, mixed-media sculptures, 3D installations, and moving image art. The space also includes an exquisite art bookstore and coffee lounge, making it a favorite spot for young art lovers and designers.", "name": "The Outpost Art Space", "transport": "Take Hanoi Metro Line 2A to Ph\u00f9ng Khoang Station, then transfer to a Grab for about 5 minutes; or take BRT 01 to Trung V\u0103n stop and walk."}, {"address": "144 Xu\u00e2n Th\u1ee7y Street, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.2 stars | Located on the C\u1ea7u Gi\u1ea5y campus of Vietnam National University, the Museum of Biology is an academic museum rich in scholarly heritage and natural history value. It preserves and displays tens of thousands of precious biological specimens from across Vietnam, including rare mammals, birds, reptiles, insects of significant research value, as well as abundant marine life and plant specimens. The display space maintains the rigorous style of a classical academic institution, offering detailed insights into Vietnam\u0027s rich biodiversity, tropical rainforest ecosystems, and environmental conservation history. It serves as an educational and cultural treasure trove in the C\u1ea7u Gi\u1ea5y academic district, perfect for a quiet and insightful exploration.", "name": "Museum of Biology - VNU Hanoi", "transport": "Take Hanoi Metro Line 3 (Nh\u1ed5n - Hanoi Station) to \u0110\u1ea1i h\u1ecdc Qu\u1ed1c gia (National University Station), enter the campus, and walk about 3 minutes."}], "name": "Arts \u0026 Cultural Museums and Churches"}, "cat_3": {"items": [{"address": "Duy T\u00e2n Street, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.5 Stars | C\u1ea7u Gi\u1ea5y Park is the largest and most iconic green oasis in Hanoi\u0027s burgeoning C\u1ea7u Gi\u1ea5y commercial area. Lush trees cast ample shade over crystal-clear artificial lakes, and the park features a rare Japanese-imported padded safety playground\u2014a unique touch in Vietnam. Beyond serving as a favorite spot for locals\u0027 morning and evening workouts, walks, and family picnics, its expansive lawns and clean lakeside paths are perfect for visitors seeking relaxation and a taste of local life amidst Hanoi\u0027s modern residential vibrant charm.", "name": "C\u1ea7u Gi\u1ea5y Park (C\u00f4ng vi\u00ean C\u1ea7u Gi\u1ea5y)", "transport": "Take bus 34, 38, or 44 to Duy T\u00e2n Station, then walk for about 5 minutes."}, {"address": "Ch\u00f9a H\u00e0 Street, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.4 Stars | Located in the heart of the C\u1ea7u Gi\u1ea5y District, Ngh\u0129a \u0110\u00f4 Park is a spacious, tranquil park featuring a large central lake surrounded by scenic walking paths. Dense foliage and ancient trees provide plenty of shade, making it a wonderful sanctuary to escape the Hanoi summer heat. Equipped with outdoor fitness equipment, children\u0027s slides, and elegant arched bridges, it attracts numerous families, fitness enthusiasts, and photographers alike.", "name": "Ngh\u0129a \u0110\u00f4 Park (C\u00f4ng vi\u00ean Ngh\u0129a \u0110\u00f4)", "transport": "Take bus 07, 26, or 27 to Ch\u00f9a H\u00e0 Station."}, {"address": "Mai D\u1ecbch Ward, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.3 Stars | Mai D\u1ecbch Lake Park is one of the newest large-scale urban ecological parks in the M\u1ef9 \u0110\u00ecnh and Mai D\u1ecbch area, centered around a multi-hectare retention lake. Its design incorporates modern landscape bridges, waterfront decks, and a perimeter running track. At night, shimmering light reflections on the water create an enchanting ambiance. With fresh air and insulation from main road traffic, it\u0027s a top choice for locals to enjoy evening runs, leisurely strolls, and stunning sunsets.", "name": "Mai D\u1ecbch Retention Lake Park (C\u00f4ng vi\u00ean h\u1ed3 \u0111i\u1ec1u h\u00f2a Mai D\u1ecbch)", "transport": "Take bus 29 or 60A to H\u1ed3 \u0110i\u1ec1u H\u00f2a Mai D\u1ecbch Station."}, {"address": "Ph\u1ea1m H\u00f9ng Street, M\u1ef9 \u0110\u00ecnh 1, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.4 Stars | Located near iconic landmarks like Keangnam Landmark 72 and the Skylake skyscraper complex, this modern retention park boasts stylish landscape design, a scenic lake, and waterfront greenery. Featuring elevated walkways, open plazas, and wooden boardwalks set against a striking modern skyline, it represents Hanoi\u0027s international urban oasis vibe\u2014ideal for casual walks and city landscape photography.", "name": "CV1 Skylake Park (C\u00f4ng vi\u00ean H\u1ed3 \u0111i\u1ec1u h\u00f2a CV1)", "transport": "Take bus 21B, 33, or 39 to Keangnam Station, then walk for about 5 minutes."}, {"address": "Nguy\u1ec5n V\u0103n Huy\u00ean Street, Quan Hoa, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.6 Stars | Although part of the museum grounds, these expansive outdoor gardens stretch across several hectares, making them one of C\u1ea7u Gi\u1ea5y\u0027s most beautiful natural sanctuaries. Recreating traditional stilt houses, soaring Ba Na communal houses, and quiet bamboo paths alongside gently flowing streams, walking here feels like journeying through Vietnam\u0027s diverse mountain villages. A perfect harmony of landscape and heritage, it offers exceptional depth for travelers.", "name": "Vietnam Museum of Ethnology Outdoor Gardens (Khu khu\u00f4n vi\u00ean ngo\u00e0i tr\u1eddi B\u1ea3o t\u00e0ng D\u00e2n t\u1ed9c h\u1ecdc)", "transport": "Take bus 07 or 38 to Nguy\u1ec5n V\u0103n Huy\u00ean Station, then walk for about 3 minutes."}, {"address": "C\u1ea7u Gi\u1ea5y Street, Ng\u1ecdc Kh\u00e1nh, Ba \u0110\u00ecnh, Hanoi", "feature": "\u2b50 4.1 Stars | Situated on the border between C\u1ea7u Gi\u1ea5y and Ba \u0110\u00ecnh districts, Thu L\u1ec7 Park surrounds the expansive Thu L\u1ec7 Lake, flanked by towering trees and scenic views. The park houses the Hanoi Zoo, featuring various rare wildlife species, and offers swan pedal boat rentals for cruising on the lake. Rich in history and beloved by locals, this comprehensive nature park provides a refreshing lakeside stroll experience.", "name": "Thu L\u1ec7 Park \u0026 Lake (C\u00f4ng vi\u00ean Thu L\u1ec7)", "transport": "Take bus 09A, 27, or 28 to C\u00f4ng vi\u00ean Thu L\u1ec7 Station."}, {"address": "L\u00ea \u0110\u1ee9c Th\u1ecd Street, M\u1ef9 \u0110\u00ecnh 1, Nam T\u1eeb Li\u00eam, Hanoi", "feature": "\u2b50 4.3 Stars | Surrounding the M\u1ef9 \u0110\u00ecnh National Stadium, this large open green space with tree-lined boulevards is the signature outdoor green hub of the M\u1ef9 \u0110\u00ecnh area. With expansive lawns and wide shaded paths, afternoons see locals gathering to fly kites, ride bicycles, and play sports, exuding an energetic and open modern urban park vibe.", "name": "M\u1ef9 \u0110\u00ecnh Sports Complex Park (V\u01b0\u1eddn hoa Khu li\u00ean h\u1ee3p th\u1ec3 thao M\u1ef9 \u0110\u00ecnh)", "transport": "Take bus 26 or 50 to S\u00e2n v\u1eadn \u0111\u1ed9ng M\u1ef9 \u0110\u00ecnh Station."}, {"address": "Y\u00ean H\u00f2a Ward, C\u1ea7u Gi\u1ea5y, Hanoi", "feature": "\u2b50 4.2 Stars | Tucked away in the Y\u00ean H\u00f2a neighborhood of C\u1ea7u Gi\u1ea5y District, this charming community park features an elegant layout with flower lawns, relaxing pavilions, and shady pathways. Well-maintained and peaceful away from main street traffic, it offers a serene spot to experience the relaxed pace of modern Hanoi residential life amidst lush greenery.", "name": "Y\u00ean H\u00f2a Park (V\u01b0\u1eddn hoa Y\u00ean H\u00f2a)", "transport": "Take bus 51 or 104 to Y\u00ean H\u00f2a Station, then walk for about 3 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Khu E6, Khu \u0111\u00f4 th\u1ecb m\u1edbi C\u1ea7u Gi\u1ea5y, Ph\u1ea1m H\u00f9ng, M\u1ec5 Tr\u00ec, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Once Vietnam\u0027s tallest building, Keangnam Hanoi Landmark 72 features the Sky72 Observatory on its 72nd floor, offering an incredible vantage point to overlook Hanoi\u0027s modern skyline. Inside, you\u0027ll find a 3D art museum, a wishing wall, and a sleek high-altitude cafe. As dusk falls and city lights illuminate, the dazzling night view draws countless youngsters and travelers for photos, making it the most iconic landmark check-in spot in the C\u1ea7u Gi\u1ea5y area.", "name": "Keangnam Hanoi Landmark 72 Sky72 Observatory", "transport": "Take a Grab taxi or bus routes 21B, 33, or 44 and get off at the Keangnam station."}, {"address": "Ph\u1ed1 Duy T\u00e2n, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Cau Giay Park is a beautifully maintained and immensely popular green oasis in downtown Hanoi. It features a large artificial lake surrounded by vast green lawns, along with whimsical yet artistic climbing structures and installations. At dawn and dusk, sunlight dances on the lake while wooden boardwalks and picturesque bridges offer a charming aesthetic\u2014making it a favorite spot for fresh, natural photography and snapshots of local life.", "name": "Cau Giay Park", "transport": "Take bus routes 51 or 61 to Ph\u1ed1 Duy T\u00e2n station, then walk for about 3 minutes."}, {"address": "\u0110. Nguy\u1ec5n V\u0103n Huy\u00ean, Quan Hoa, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Though a museum, its expansive outdoor area showcases full-scale 1:1 traditional stilt houses of Vietnam\u0027s 54 ethnic groups, tall Bahnar communal houses, and a water puppet theater, delivering immense visual impact and cultural depth. Combining lush gardens with authentic bamboo and timber structures, it is a premier photo location for capturing rich Vietnamese heritage and vintage aesthetic portraits.", "name": "Vietnam Museum of Ethnology", "transport": "Take bus routes 07, 38, or 96 directly to the B\u1ea3o t\u00e0ng D\u00e2n t\u1ed9c h\u1ecdc Vi\u1ec7t Nam station."}, {"address": "\u0110. M\u1ec5 Tr\u00ec, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Known as Hanoi\u0027s \u0027Little Paris,\u0027 The Manor is the most distinct luxury French-European architectural complex in the My Dinh area. Featuring elegant classical arches, yellow and white neoclassical facades, and romantic cobblestone streets, it hosts numerous stylish Korean-style cafes and exquisite restaurants, attracting photography enthusiasts and fashion influencers for European-flavored street photos.", "name": "The Manor My Dinh", "transport": "Take bus routes 29, 30, or 50 to M\u1ec5 Tr\u00ec station, then walk for about 5 minutes."}, {"address": "\u0110. L\u00ea \u0110\u1ee9c Th\u1ecd, M\u1ef9 \u0110\u00ecnh, Nam T\u1eeb Li\u00eam, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | As Vietnam\u0027s largest and most iconic sports arena, My Dinh National Stadium boasts a futuristic, dynamic roof structure. The expansive plaza in front is a vibrant hangout spot for local youth and events. Framed by clear blue skies or golden sunset light, the grand stadium backdrop delivers striking visual impact, making it an ideal location for sleek, architectural photography.", "name": "My Dinh National Stadium", "transport": "Take bus route 26 or BRT01 and get off at S\u00e2n v\u1eadn \u0111\u1ed9ng M\u1ef9 \u0110\u00ecnh station."}, {"address": "302 \u0110. C\u1ea7u Gi\u1ea5y, D\u1ecbch V\u1ecdng, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Discovery Complex is a landmark twin-tower skyscraper in C\u1ea7u Gi\u1ea5y featuring shopping, dining, and entertainment. Inside, the mall boasts a sleek geometric steel skylight and a high transparent glass dome that cast stunning light-and-shadow effects when sunlight streams through. The modern outdoor plaza landscape is also a favored urban check-in spot for fashion bloggers.", "name": "Discovery Complex Cau Giay Atrium", "transport": "Take bus routes 20A, 26, 27, or 32 directly to 302 C\u1ea7u Gi\u1ea5y station."}, {"address": "\u0110. M\u1ea1c Th\u00e1i T\u1ed5, Y\u00ean H\u00f2a, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.1 stars | Located near the Keangnam tower, Nam Trung Yen Lake Park is an emerging urban oasis for photo lovers. It features a spacious artificial lake encircled by geometric wooden waterfront walkways, minimalist white landscape bridges, and evening illumination displays. At sunset, the lake reflects the surrounding skyscrapers, offering a perfect backdrop for high-quality shots showcasing the harmonious blend of modern architecture and nature.", "name": "Nam Trung Yen Lake Park", "transport": "Take bus routes 51 or 104 to \u0110. M\u1ea1c Th\u00e1i T\u1ed5 station, then walk for about 4 minutes."}, {"address": "241 \u0110. Xu\u00e2n Th\u1ee7y, D\u1ecbch V\u1ecdng H\u1eadu, C\u1ea7u Gi\u1ea5y, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Formerly Indochina Plaza Hanoi (IPH) and revamped as The Loop, this is a trendy lifestyle hub popular among local youth and expats in C\u1ea7u Gi\u1ea5y. Its expansive open-air central plaza frequently hosts seasonal art installations, light displays, and craft markets. Surrounded by stylish outdoor seating cafes, the space vibrates with youthful energy and international chic.", "name": "The Loop Shopping Center Plaza (formerly IPH)", "transport": "Take Hanoi Metro Line 3 and get off at Xu\u00e2n Th\u1ee7y station, or take bus routes 16, 20A, 26, 27, or 32 directly."}], "name": "Top Instagrammable Spots"}}, "name": "Cau Giay and My Dinh Modern Commercial District"}, "dong_da": {"categories": {"cat_1": {"items": [{"address": "58 P. Qu\u1ed1c T\u1eed Gi\u00e1m, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.6 stars | Built in 1070, the Temple of Literature was home to Vietnam\u0027s first national university, Imperial Academy (Qu\u1ed1c T\u1eed Gi\u00e1m). It is the most well-preserved Confucian architectural complex and sacred Confucian site in Vietnam. Divided into five courtyards extending along a central axis, its architectural style blends traditional wooden craftsmanship from the L\u00fd and Tr\u1ea7n dynasties. The most famous feature is the 82 Doctor Laureate Stelae resting on stone turtles, which record the names and birthplaces of scholars who passed imperial examinations between 1442 and 1779\u2014recognized as a UNESCO Memory of the World site. With its peaceful garden ponds, Khu\u00ea V\u0103n Pavilion, and \u0110\u1ea1i Th\u00e0nh Hall housing statues of Confucius and his four disciples, it offers deep historical and cultural resonance, making it an essential landmark for understanding Vietnam\u0027s thousand-year literary tradition and architectural legacy.", "name": "Temple of Literature / V\u0103n Mi\u1ebfu - Qu\u1ed1c T\u1eed Gi\u00e1m", "transport": "Take Hanoi City Bus 02, 23, 32, 38, or 41 to V\u0103n Mi\u1ebfu Station, then walk for about 2 minutes."}, {"address": "P. T\u00e2y S\u01a1n, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Dong Da Mound is a historic ancient battlefield site in Hanoi, commemorating the glorious victory of 1789 when national hero Emperor Quang Trung (Nguy\u1ec5n Hu\u1ec7) led his army to defeat the Qing forces in the Ng\u1ecdc H\u1ed3i - \u0110\u1ed1ng \u0110a Battle. Originally a 10-meter-high earthen mound created to bury enemy forces after the war, it has been transformed into a lush, solemn memorial park. At its center stands a majestic bronze statue of Emperor Quang Trung alongside relief murals depicting the battle, accompanied by a history exhibition hall showcasing weapons and artifacts from the era. Every year on the 5th day of the Lunar New Year, the vibrant \u0110\u1ed1ng \u0110a Festival takes place here, featuring dragon and lion dances, traditional theater, and ritual ceremonies, making it a key landmark for experiencing Vietnamese patriotism and heritage.", "name": "Dong Da Mound \u0026 Quang Trung Monument (G\u00f2 \u0110\u1ed1ng \u0110a)", "transport": "Take Bus 01, 02, 09B, or 21A to G\u00f2 \u0110\u1ed1ng \u0110a Station, then walk for about 1 minute."}, {"address": "178 P. Kim Hoa, Ph\u01b0\u01a1ng Li\u00ean, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.5 stars | Also known as Tr\u1ea5n Nam Temple, Kim Lien Temple is one of the famous \u0027Four Sacred Temples of Th\u0103ng Long\u0027 (ancient Hanoi), built to guard the southern gate of the citadel and pray for national peace. Originally founded during the L\u00fd Dynasty, it primarily honors Cao S\u01a1n \u0110\u1ea1i V\u01b0\u01a1ng. The architectural complex exhibits exquisite wooden carvings from the Later L\u00ea and Nguy\u1ec5n Dynasties. Its triple-arched gate (Tam Quan) features vivid carvings of auspicious dragons and mythical beasts, while the interior preserves nine historically significant imperial decree stelae and ancient statues. Compared to busier attractions, Kim Lien Temple offers a tranquil setting shaded by ancient trees, rich with religious atmosphere and imperial charm\u2014an ideal spot for exploring Hanoi\u0027s sacred geography and ancient carving arts.", "name": "Kim Lien Temple (\u0110\u1ec1n Kim Li\u00ean)", "transport": "Take Bus 21A, 26, 28, 35A, or 44 to \u0110\u00e0o Duy Anh Station, turn onto Kim Hoa Street, and walk for about 5 minutes."}, {"address": "14 P. Ch\u00f9a B\u1ed9c, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Boc Pagoda is an ancient temple closely linked to the 1789 Battle of \u0110\u1ed1ng \u0110a. Founded in the 15th century (Quang Thu\u1eadn era) under the name S\u00f9ng Ph\u00fac Pagoda, it was destroyed by war and later rebuilt during Emperor Quang Trung\u0027s reign, acquiring its current name. Its unique historical feature lies in secretly housing a carved wooden statue of Emperor Quang Trung (Nguy\u1ec5n Hu\u1ec7) on the right side of the main hall, alongside memorial tablets for fallen soldiers, alongside traditional Buddha and Bodhisattva statues. The temple preserves precious artifacts, including a massive bronze bell cast in 1800, ancient stone stelae, and intricate gilded statues. With its quiet, lush courtyard, the pagoda reflects a solemn history of war, rebuilding, and religious devotion.", "name": "Boc Pagoda (Ch\u00f9a B\u1ed9c)", "transport": "Take Bus 18, 21A, 23, 26, or 35A to Ch\u00f9a B\u1ed9c Station, then walk for about 1 minute."}, {"address": "382 P. T\u00e2y S\u01a1n, Th\u1ecbnh Quang, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.4 stars | Also known as Ch\u00f9a S\u1edf, Phuc Khanh Pagoda is an ancient Buddhist temple founded during the late L\u00ea Dynasty and a vital spiritual center for the \u0110\u1ed1ng \u0110a district community. Having survived multiple wars and restorations, it retains refined traditional architecture from the L\u00ea and Nguy\u1ec5n eras, including a hip-and-gables roof main hall, ornate wooden beams, and numerous golden Buddha statues. Famous throughout Hanoi for its powerful blessing ceremonies, tens of thousands of worshippers flood the surrounding streets during Lunar New Year and the Lantern Festival (15th day of the 1st lunar month) to pray for peace and ward off bad luck. Shaded by ancient trees and enveloped in incense smoke, it showcases the deep roots of folk Buddhism in Vietnam.", "name": "Phuc Khanh Pagoda (Ch\u00f9a Ph\u00fac Kh\u00e1nh)", "transport": "Take Bus 01, 02, 09B, 21A, or 27 to Ng\u00e3 T\u01b0 S\u1edf Station, then walk for about 3 minutes."}, {"address": "14 P. C\u00e1t Linh, Qu\u1ed1c T\u1eed Gi\u00e1m, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located near the Temple of Literature, Bich Cau Taoist Temple is a rare and iconic sanctuary for Taoism and folk worship in Hanoi, dating back to the 15th century under King L\u00ea Th\u00e1nh T\u00f4ng. The shrine holds a romantic legend: scholar Tr\u1ea7n T\u00fa Uy\u00ean met a fairy goddess here and married her, prompting later generations to build this sanctuary. The structure blends Taoist and traditional Vietnamese temple design, featuring a front hall, rear sanctuary, and garden dedicated to immortals and Taoist deities. Elegant and serene with rustic woodcraft and shady trees, it is a wonderful spot to discover Vietnamese Taoist lore, fairy legends, and a moment of peaceful antiquity amid the bustling city.", "name": "Bich Cau Taoist Temple (B\u00edch C\u00e2u \u0110\u1ea1o Qu\u00e1n)", "transport": "Take Hanoi Metro Line 2A to C\u00e1t Linh Station, then walk for about 4 minutes; or take Bus 18, 23, 25, or 38 to C\u00e1t Linh Station."}, {"address": "119 P. T\u00e2y S\u01a1n, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.2 stars | Located directly opposite Dong Da Mound, Dong Quang Temple was founded in 1846 during the Nguy\u1ec5n Dynasty as a place of both religious worship and historical commemoration. It was established to honor folk deities like Princess Li\u1ec5u H\u1ea1nh while simultaneously commemorating the innocent lives and fallen soldiers from both sides of the 1789 Battle of Ng\u1ecdc H\u1ed3i - \u0110\u1ed1ng \u0110a. The temple features a classic three-courtyard layout with refined interior woodcarvings and active worship. Dong Quang Temple captures 19th-century religious life in Hanoi while reflecting the compassionate traditional Vietnamese spirit of offering solace to victims of war, making it a meaningful historical landmark.", "name": "Dong Quang Temple (\u0110\u1ec1n \u0110\u1ed3ng Quang)", "transport": "Take Bus 01, 02, 09B, or 21A to 161 T\u00e2y S\u01a1n Station, cross the street, and walk for about 1 minute."}, {"address": "P. Qu\u1ed1c T\u1eed Gi\u00e1m, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i", "feature": "\u2b50 4.3 stars | Located directly across from the Temple of Literature, Van Lake (also known as Minh \u0110\u01b0\u1eddng Lake) is an essential historical, ecological, and cultural extension of the Temple of Literature complex. In the center of the lake lies Kim Ch\u00e2u Islet (G\u00f2 Kim Ch\u00e2u), home to the elegant V\u0103n Hoa Hall, where scholars and poets historically gathered to compose poetry and discuss philosophy. Beautifully restored in recent years, the lakeside park recreates the charm of classic pavilions over water, shaded by greenery with winding paths. During Calligraphy Festivals or Lunar New Year, it hosts lively calligraphy gifting, traditional Vietnamese performances, and cultural markets, making it the ideal spot to experience ancient literary traditions and local festivities.", "name": "Van Lake \u0026 Temple Grounds (H\u1ed3 V\u0103n - V\u0103n Mi\u1ebfu)", "transport": "Take Bus 02, 23, 32, 38, or 41 to V\u0103n Mi\u1ebfu Station; located directly across from the main entrance of the Temple of Literature."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "58 P. Qu\u1ed1c T\u1eed Gi\u00e1m, V\u0103n Mi\u1ebfu, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.6 stars | Built in 1070, the Temple of Literature was Vietnam\u0027s first national university and is dedicated to Confucius and his disciples. The entire complex consists of five courtyards, preserving a rich Confucian heritage and rustic Dai Viet architectural styles. Most famous within the grounds are the 82 Doctors\u0027 stelae\u2014a UNESCO Memory of the World\u2014which record the names of successful candidates in royal examinations. Strolling by the Well of Heavenly Clarity, Khue Van Pavilion, and ancient shaded courtyards offers a deep appreciation for Vietnam\u0027s rich academic traditions and historical roots.", "name": "Temple of Literature (V\u0103n Mi\u1ebfu - Qu\u1ed1c T\u1eed Gi\u00e1m)", "transport": "Take bus 02, 23, 38, or 41 to the V\u0103n Mi\u1ebfu stop; it is about a 2-minute walk from there."}, {"address": "66 P. Nguy\u1ec5n Th\u00e1i H\u1ecdc, \u0110i\u1ec7n Bi\u00ean, Ba \u0110\u00ecnh, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Housed in an elegant French colonial building near the Temple of Literature\u2014originally a boarding school for French girls\u2014this national museum showcases the essence of Vietnamese art. The collections range from prehistoric stone art, Champa kingdom sculptures, and Ly and Tran Dynasty lacquerware, to modern resistance art and contemporary works. The lacquer art exhibition is particularly renowned, highlighting Vietnam\u0027s distinctive craft and unique aesthetics\u2014a must-visit for art lovers eager to explore Vietnamese artistic evolution.", "name": "Vietnam National Fine Arts Museum (B\u1ea3o t\u00e0ng M\u1ef9 thu\u1eadt Vi\u1ec7t Nam)", "transport": "About a 5-minute walk from the main entrance of the Temple of Literature (walk east along Nguy\u1ec5n Th\u00e1i H\u1ecdc Street for about 400 meters)."}, {"address": "180 P. Nguy\u1ec5n L\u01b0\u01a1ng B\u1eb1ng, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N lion, and elegant historic gates showcase the peak of ancient Vietnamese woodcarving and architecture. Free from heavy commercialization, moss-covered surfaces and timeless tones make it an ideal backdrop for moody, Zen-inspired aesthetic photos.", "name": "L\u00e1ng Temple (Ch\u00f9a L\u00e1ng)", "transport": "Take bus 09B, 16, 24, or 27 to the Ch\u00f9a L\u00e1ng stop, then walk down Ch\u00f9a L\u00e1ng Street."}, {"address": "P. T\u00e2y S\u01a1n, Quang Trung, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.2 stars | This lush green park honors Emperor Quang Trung\u0027s historic victory over Qing forces at the Battle of Ng\u1ecdc H\u1ed3i - \u0110\u1ed1ng \u0110a in 1789. At its center stands a massive grassy mound alongside an imposing bronze statue of Emperor Quang Trung. Surrounded by quiet greenery and ancient trees, its grand statue and grand sweeping staircases attract history buffs and photographers looking for impressive backdrops.", "name": "\u0110\u1ed1ng \u0110a Mound Park (G\u00f2 \u0110\u1ed1ng \u0110a)", "transport": "Take bus 01, 02, 09B, or 21A to the G\u00f2 \u0110\u1ed1ng \u0110a stop to arrive right at the park entrance."}, {"address": "382 P. T\u00e2y S\u01a1n, Th\u1ecbnh Quang, \u0110\u1ed1ng \u0110a, H\u00e0 N\u1ed9i, Vietnam", "feature": "\u2b50 4.5 stars | Located next to the busy Ng\u00e3 T\u01b0 S\u1edf overpass, Ph\u00fac Kh\u00e1nh Temple is one of \u0110\u1ed1ng \u0110a District\u0027s most vibrant ancient temples. Despite sitting beside a bustling main road, its majestic gates and grand halls inspire awe. At night, golden lights and red lanterns glow together in striking artistic harmony. During Lunar New Year and major Buddhist festivals, the sea of lantern lights and faithful devotees form a uniquely Hanoi cultural scene.", "name": "Ph\u00fac Kh\u00e1nh Temple (Ch\u00f9a Ph\u00fac Kh\u00e1nh)", "transport": "Take bus 01, 02, 19, 21A, or 27 to the Ng\u00e3 T\u01b0 S\u1edf stop, followed by a short walk to t
