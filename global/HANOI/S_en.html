    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | The spiritual heart of Hanoi\u0027s city center, surrounded by beautiful lakeside scenery. Cross the vibrant red Huc Bridge to visit Ngoc Son Temple on the islet and immerse yourself in its timeless ancient charm.", "duration": "1-2 hours", "title": "Hoan Kiem Lake \u0026 Ngoc Son Temple", "transport": "About a 5-minute walk from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Built in 1070, this Confucian sanctuary was Vietnam\u0027s first national university. Well-preserved ancient gates, doctor\u0027s stelae, and exquisite gardens ooze rich cultural heritage.", "duration": "1.5-2 hours", "title": "Temple of Literature (Imperial Academy)", "transport": "About a 10-minute Grab ride from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | The final resting place of President Ho Chi Minh, the founding father of Vietnam. This grand, solemn stone monument is a must-visit to understand Vietnam\u0027s modern history and political journey.", "duration": "2-3 hours", "title": "Ho Chi Minh Mausoleum", "transport": "About a 15-minute taxi ride from the Old Quarter to Ba Dinh Square"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A century-old church showcasing striking Neo-Gothic architecture with a beautifully weathered facade. Surrounded by cozy local cafes, it is a highly popular spot for photos.", "duration": "1 hour", "title": "St. Joseph\u0027s Cathedral (Hanoi Cathedral)", "transport": "Located west of Hoan Kiem Lake, about an 8-minute walk from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Built during the French colonial era, this prison powerfully documents the history of political prisoners and captured American pilots during the Vietnam War. The exhibits are rich, poignant, and deeply moving.", "duration": "1.5-2 hours", "title": "Hoa Lo Prison", "transport": "About a 15-minute walk or a 5-minute drive from Hoan Kiem Lake"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A UNESCO World Heritage site that served as the center of political power for consecutive Vietnamese dynasties. Featuring ancient gates, underground bunkers, and palace ruins, it offers a deep leap into history.", "duration": "2-3 hours", "title": "Imperial Citadel of Thang Long", "transport": "About a 10-minute walk or 5-minute taxi ride from the Temple of Literature"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | The oldest temple in Hanoi, standing gracefully on an islet in West Lake. Its towering red hexagonal stupa against the tranquil lakeside scenery creates a serene atmosphere.", "duration": "1 hour", "title": "Tran Quoc Pagoda", "transport": "About a 10-15 minute taxi ride to the eastern shore of West Lake"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | Built in 1049, this unique structure rests entirely on a single stone pillar, resembling a lotus blooming out of the water\u2014a symbol of fertility and good fortune.", "duration": "0.5-1 hour", "title": "One Pillar Pagoda", "transport": "Located within the Ho Chi Minh Mausoleum complex, easily reachable on foot"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A traditional Vietnamese folk art performance where puppeteers control wooden puppets behind a water screen, accompanied by live traditional music to vividly bring rural folklore and myths to life.", "duration": "1 hour", "title": "Thang Long Water Puppet Theatre", "transport": "Located at the northeast corner of Hoan Kiem Lake, easily walkable from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Beautifully curated and thoughtfully designed, this museum provides deep insights into the crucial roles and contributions of Vietnamese women throughout history, wartime, family life, and culture.", "duration": "1.5-2 hours", "title": "Vietnamese Women\u0027s Museum", "transport": "About a 10-minute walk from the south side of Hoan Kiem Lake"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A bustling commercial hub preserving the character of ancient artisan trade streets. Each street originally specialized in a specific trade, overflowing with vibrant local energy and delicious street food stalls.", "duration": "2-4 hours", "title": "Hanoi Old Quarter (36 Ancient Streets)", "transport": "Located in the heart of Hanoi, best explored on foot or by cyclo"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A narrow alleyway where railway tracks run right past homes and local cafes. Watching the train squeeze through offers a thrilling visual experience, making it a top spot for capturing Hanoi\u0027s unique streetscape.", "duration": "1-1.5 hours", "title": "Hanoi Train Street", "transport": "Located around Hoan Kiem District, about a 15-minute walk from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | Showcasing the diverse cultures and traditions of Vietnam\u0027s 54 ethnic groups. The outdoor section features authentic, full-scale reconstructions of traditional stilt houses and tribal dwellings.", "duration": "2-3 hours", "title": "Vietnam Museum of Ethnology", "transport": "About a 20-25 minute taxi ride from the Old Quarter"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A magnificent Neo-Baroque French colonial landmark modeled after the Palais Garnier in Paris. Perfect for photos during the day and beautifully illuminated at night for a romantic touch.", "duration": "0.5-1 hour", "title": "Hanoi Opera House", "transport": "About a 10-minute walk from the southeast corner of Hoan Kiem Lake"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | The largest natural lake in Hanoi, featuring a relaxed waterfront vibe lined with scenic cafes and fine dining options. It is an ideal spot for leisurely strolls and stunning sunset views.", "duration": "2-3 hours", "title": "West Lake (Ho Tay)", "transport": "About a 15-minute taxi ride from the Old Quarter to the shores of West Lake"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.2 Stars | Hanoi\u0027s largest indoor traditional wholesale market, selling fabrics, food, daily necessities, and souvenirs. It\u0027s the perfect place to experience the authentic energy of a traditional Vietnamese market.", "duration": "1.5-2 hours", "title": "Dong Xuan Market", "transport": "Located at the northern end of the Old Quarter; accessible on foot or by cyclo"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.4 Stars | One of Hanoi\u0027s Four Sacred Temples and the oldest in the Old Quarter. Dedicated to the legendary horse that guarded Thang Long Citadel, it features exquisite wood carvings and an atmosphere rich in worship.", "duration": "0.5-1 hour", "title": "Bach Ma Temple", "transport": "Located on Hang Buom Street in the Old Quarter, easily accessible on foot"}, {"category": "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "description": "\u2b50 4.5 Stars | Combining French and Indochinese architectural styles, this museum showcases rich artifacts spanning from prehistoric times to modern Vietnam, including ancient bronzes and royal treasures.", "duration": "1.5-2 hours", "title": "National Museum of Vietnamese History", "transport": "About a 5-minute walk from the H , "duration": "1 hour", "title": "C\u1ed9ng C\u00e0 Ph\u00ea (Nh\u00e0 Th\u1edd Branch)", "transport": "Located directly opposite St. Joseph\u0027s Cathedral, a 1-minute walk"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.7 stars | A charming caf\u00e9 with every wall covered in colorful sticky notes left by travelers from around the globe. The staff is warm and welcoming, serving delicious egg coffee and coconut coffee in a vibrant, heart-warming atmosphere across all floors.", "duration": "1 hour", "title": "The Note Coffee", "transport": "Located along the Hoan Kiem Lake ring road, easily reachable on foot"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.0 stars | An iconic Hanoi institution serving Vietnamese sticky rice (X\u00f4i). The chewy golden sticky rice can be customized with mung bean paste, char siu pork, braised pork, fried shallots, or fried eggs\u2014incredibly hearty and satisfying.", "duration": "45 minutes", "title": "X\u00f4i Y\u1ebfn", "transport": "About a 5-minute walk from the Old Quarter Night Market"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.3 stars | A Michelin-recommended night spot famous for chicken pho. The chicken is tender and juicy; besides classic soup pho, their signature dry mixed chicken pho topped with savory sauce and crushed peanuts is an absolute masterpiece.", "duration": "45 minutes", "title": "Ph\u1edf G\u00e0 Nguy\u1ec7t", "transport": "About a 10-minute walk from Hoan Kiem Lake"}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.5 Stars | A nostalgic, hipster-chic balcony cafe housed in a lovingly renovated French colonial building. Featuring a lush garden balcony overlooking the bustling street view, it offers exquisite Vietnamese coffee and light bites.", "duration": "1.5 hours", "title": "Caf\u00e9 Ban C\u00f4ng", "transport": "Located in the heart of the Old Quarter, about a 3-minute walk from the East G .5 Stars | A hugely popular local favorite, famous for its signature filling stir-fried with onions, pork, eggs, cheese, and sausage, packed inside a hot, golden-crispy baguette.", "duration": "30 minutes", "title": "B\u00e1nh M\u00ec D\u00e2n T\u1ed5", "transport": "Located in Hoan Kiem District; take a Grab ride to the intersection of Tr\u1ea7n Nh\u1eadt Du\u1eadt Street."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.4 Stars | Opened by the daughter of the original egg coffee creator, hidden on the second floor of an old apartment. Preserves the authentic vintage vibe of Old Hanoi alongside rich, velvety egg coffee.", "duration": "45 minutes", "title": "Caf\u00e9 \u0110inh", "transport": "Located on \u0110inh Ti\u00ean Ho\u00e0ng Street north of Hoan Kiem Lake, about a 2-minute walk from the lake."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.3 Stars | Recommended by the Michelin Bib Gourmand, featuring tender beef in a naturally sweet, clear broth. It is one of the most iconic clear broth beef pho spots in the Old Quarter.", "duration": "45 minutes", "title": "Ph\u1edf 10 L\u00fd Qu\u1ed1c S\u01b0", "transport": "Located near St. Joseph\u0027s Cathedral, about a 3-minute walk."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.4 Stars | A Michelin-recommended century-old spot for pan-fried fish (Ch\u1ea3 C\u1ea3). Turmeric-marinated fish chunks are sizzled right at your table with fresh dill and scallions, served with rice vermicelli and shrimp paste for a uniquely flavorful dish.", "duration": "1 hour", "title": "Ch\u1ea3 C\u1ea3 Th\u0103ng Long", "transport": "Located on \u0110\u01b0\u1eddng Th\u00e0nh Street in Hoan Kiem District; reachable directly by Grab."}, {"category": "\ud83c\udf5c Food \u0026 Coffee", "description": "\u2b50 4.2 Stars | A famous historic sticky rice spot in Hanoi. Chewy sticky rice paired with savory mung bean paste, braised pork, sausage, and crispy fri tory and spectacular scenery.", "duration": "2-3 hours", "title": "Bach Dang River Historical Relics Zone", "transport": "About 20 km from the city center; taking a private car or taxi is recommended (approx. 35-minute drive)"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | A cultural heritage site honoring Nguyen Binh Khiem, the great 16th-century Vietnamese thinker and prophet. Surrounded by ancient trees, the serene atmosphere is steeped in profound philosophical and cultural depth.", "duration": "2 hours", "title": "Nguyen Binh Khiem Shrine", "transport": "Located in V\u0129nh B\u1ea3o District; private car hire is recommended (approx. 45-minute drive)"}, {"category": "Haiphong", "description": "\u2b50 4.7 Stars | Featuring the world\u0027s tallest cable car tower according to Guinness World Records, this ride offers breathtaking aerial views over the Cat Ba Archipelago and lush coastal mangroves.", "duration": "1 hour", "title": "Cat Hai to Cat Ba Island Cable Car", "transport": "Head to Cat Hai Cable Car Station (Ga C\u00e1p Treo C\u00e1t H\u1ea3i), reachable via dedicated shuttle bus or taxi"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | Haiphong\u0027s authentic local favorite \"B\u00fan C\u00e1 Cay\" features golden, crispy-yet-tender fish chunks served in a spicy and sour bone broth over tender rice noodles\u2014beloved by local foodies.", "duration": "1 hour", "title": "Le Lai Spicy Fish Cake Noodle Soup", "transport": "Located near L\u00ea L\u1ee3i Street, easily reached by taxi or motorbike"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | Named for its striking resemblance to a giant elephant, this scenic mountain is rich with limestone karst caves and ancient temples. Summiting offers sweeping views of the lush countryside.", "duration": "2-3 hours", "title": "Elephant Mountain (Voi Mountain) Scenic Area", "transport": "Located in An L\u00e3o District, about a 30-minute taxi ride from downtown Haiphong"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | One of Haiphong\u0027s liveliest night food streets, packed with local street vendors serving savory snails, grilled skewers, seafood porridge, and a wide array of Vietnamese late-night desserts.", "duration": "1-2 hours", "title": "Lach Tray Food Street", "transport": "Located on the main thoroughfare of L\u1ea1ch Tray, about 5-10 minutes by car from the city center"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | A renowned natural attraction in Haiphong featuring peaks shaped like a giant elephant resting on water. Home to fascinating limestone caves and historical relics, it is ideal for hiking and exploration.", "duration": "3-4 hours", "title": "Elephant Mountain Scenic Spot", "transport": "Drive southwest about 20 km from downtown Haiphong by taxi or rented motorbike"}, {"category": "Haiphong", "description": "\u2b50 4.3 Stars | A hidden blue lagoon formed by limestone quarrying. Featuring dreamy turquoise waters enclosed by sheer cliffs, it is a hugely popular photo spot.", "duration": "1-2 hours", "title": "Tuyet Tinh Coc Blue Lagoon (Thuy Nguyen)", "transport": "Drive about 45 minutes from downtown Haiphong over An L\u00e3o Bridge toward Th\u1ee7y Nguy\u00ean District"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | An ancient temple built inside a natural limestone cave, regarded as one of the birthplaces of Buddhism in Vietnam. Serene and infused with mystical religious charm.", "duration": "1-2 hours", "title": "Hang Pagoda (Long Son Temple, Do Son)", "transport": "Located in Zone 1 of Do Son Peninsula; take a taxi directly along Highway 353 to Do Son"}, {"category": "Haiphong", "description": "\u2b50 4.2 Stars | One of the summer palaces of Emperor Bao Dai, Vietnam\u0027s last monarch. Sitting atop a hill overlooking the sweeping Do Son coastline, it displays royal antiques and historical artifacts.", "duration": "1-2 hours", "title": "Bao Dai Villa (Do Son)", "transport": "Perched on the hilltop in Zone 2 of Do Son Peninsula, about a 30-minute taxi ride from downtown Haiphong"}, {"category": "Haiphong", "description": "\u2b50 4.1 Stars | The legendary starting point of the sea-based Ho Chi Minh Trail during the Vietnam War. Holding profound historical memorial significance, it is also a fantastic spot for watching sunset over the sea.", "duration": "1 hour", "title": "K15 Unnumbered Ships Pier Relic Site", "transport": "Located at the end of Zone 3 on Do Son Peninsula; accessible by motorbike or taxi"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | Built in the late 19th century, this Gothic cathedral features elegant red-brick walls and a soaring bell tower, making it one of Haiphong\u0027s most iconic religious and historical landmarks.", "duration": "1 hour", "title": "Haiphong Cathedral", "transport": "Located on Hoang Van Thu Street in the city center; easily accessible on foot or via Grab"}, {"category": "Haiphong", "description": "\u2b50 4.6 Stars | A centuries-old ancient temple housing exquisite woodcarvings, antique bells, and precious Buddha statues. Towering trees fill the courtyard, creating a tranquil and serene atmosphere.", "duration": "1-2 hours", "title": "Du Hang Pagoda", "transport": "Located on Du Hang Street, Hai An District, just about 2 km from the city center\u2014a 5-minute drive"}, {"category": "Haiphong", "description": "\u2b50 4.3 Stars | An ancient temple dedicated to Female General Le Chan, the legendary founder of Haiphong. Featuring ornate carvings and bustling with incense, it is a key site to explore the city\u0027s origins and traditional beliefs.", "duration": "1 hour", "title": "Nge Temple (General Le Chan Temple)", "transport": "Located in An Bien Ward in central Haiphong, about a 10-minute walk from the Haiphong Opera House"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | The newly renovated lakeside promenade features lush greenery and artistic sculptures. Delightful at dusk when the lights turn on, it is a favorite spot for locals to stroll and unwind.", "duration": "1-2 hours", "title": "Tam Bac Lake \u0026 Flower Street Promenade", "transport": "Located in the city center near the Haiphong Opera House and Cho Sat Market, within easy walking distance"}, {"category": "Haiphong", "description": "\u2b50 4.6 Stars | Haiphong\u0027s liveliest street food heaven, featuring authentic local delicacies like crab noodle soup, grilled pork skewers, and coconut desserts. Affordable and bursting with local energy!", "duration": "2-3 hours", "title": "Cat Bi Night Market \u0026 Food Street", "transport": "Located on Cat Bi Road, Hai An District, about a 15-minute taxi ride from the city center"}, {"category": "Haiphong", "description": "\u2b50 4.0 Stars | One of Haiphong\u0027s oldest and largest traditional trading markets, selling electronic parts, hardware, and local produce, offering a vivid glimpse into old Haiphong\u0027s commercial heritage.", "duration": "1-2 hours", "title": "Cho Sat Market (Iron Market)", "transport": "Located along the Tam Bac River, about a 5-minute drive from Haiphong Railway Station"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | Haiphong\u0027s newest premier integrated resort, featuring artificial white-sand beaches, a water park, a golf course, and 5-star hotels\u2014perfect for a relaxing family vacation.", "duration": "4-6 hours", "title": "Dragon Ocean Do Son International Tourist Area", "transport": "Located in Do Son District, about a 40-minute taxi ride from Haiphong city center"}, {"category": "Haiphong", "description": "\u2b50 4.7 Stars | Haiphong\u0027s legendary spot for red crab noodle soup. The savory, rich broth served with signature brown flat noodles, crab cakes, and water spinach makes it an absolute must-try local iconic dish.", "duration": "1 hour", "title": "Banh Da Cua Ba Cu (Ba Cu Crab Noodle Soup)", "transport": "Located at 179 Cau Dat Street in the city center, easily accessible by walking or driving"}, {"category": "Haiphong", "description": "\u2b50 4.6 Stars | A famous shop for Haiphong\u0027s signature spicy baguette sticks. Baked to perfection with an extra-crispy crust, slathered with rich pate and house-made chili sauce, every bite is a burst of flavor!", "duration": "30 mins", "title": "Banh Mi Que Khanh Lap (Spicy Breadstick)", "transport": "Located at 181 Hang Kenh Street, about a 5-minute drive from the city center"}, {"category": "Haiphong", "description": "\u2b50 4.6 Stars | A must-visit spot for sweet lovers! Rich coconut milk blended with silky coconut shreds, fresh coconut meat, and signature tapioca pearls\u2014refreshingly sweet without being overwhelming.", "duration": "30 mins", "title": "Co Hang Coconut Dessert Shop", "transport": "Located at 124 Le Loi Street, about a 10-minute walk from Haiphong Railway Station"}, {"category": "Haiphong", "description": "\u2b50 4.5 Stars | Made with fresh sea shrimp simmered into a sweet, rich broth, paired with chewy rice noodles, wood-ear pork meatballs, and fresh herbs. A traditional and flavorful Haiphong brunch choice!", "duration": "1 hour", "title": "Phan Chu Trinh Noodle Soup with Shrimp", "transport": "Located at 16 Phan Chu Trinh Street, just a 5-minute walk from the Haiphong Opera House"}, {"category": "Haiphong", "description": "\u2b50 4.3 Stars | Preserving French colonial architecture and classic yellow-walled heritage houses, a stroll along the river offers a nostalgic vibe and a glimpse into the relaxed pace of life in this historic port town.", "duration": "1-2 hours", "title": "Hang Kenh Old Street", "transport": "Located along the banks of the Tam Bac River, easily explored on foot through quaint alleys"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | Built in 1902, this French colonial-style railway station boasts distinct yellow walls and classic window frames. Still fully operational today, it serves as a key terminus on the Hanoi\u2013Haiphong line.", "duration": "1 hour", "title": "Haiphong Railway Station", "transport": "Located on Luong Khanh Thien Street in the city center, easily reached by car or ride-hailing"}, {"category": "Haiphong", "description": "\u2b50 4.2 Stars | A primary venue for large cultural events and artistic performances in Haiphong. The expansive square out front is a bustling evening hotspot for locals to stroll, exercise, and socialize.", "duration": "1 hour", "title": "August Cinema \u0026 Cultural Square", "transport": "Located in the central square area, right next to the Haiphong Opera House"}, {"category": "Haiphong", "description": "\u2b50 4.4 Stars | A popular local wholesale market for fresh seafood, packed every morning with freshly caught flower crabs, shrimp, squid, and more. You can buy on-site and have nearby eateries cook it to order for you!", "duration": "1-2 hours", "title": "Chao Kou Seafood Market", "transport": "Located near the Haiphong Port area, about a 10\u201315 minute taxi ride"}];
        const intercityPool = [{"boarding_location": "Door-to-door hotel pickup in the Hanoi Old Quarter, or at designated meeting points (such as in front of the Hanoi Opera House)", "method": "Luxury Limousine Bus / Sightseeing Minivan", "route": "Hanoi City Center -\u003e Ha Long Bay", "schedule": "Daily from 07:30 to 18:30, departing roughly every 30 to 60 minutes", "tickets": ["Online booking via Klook / KKday", "12Go.asia transport booking site", "Local travel agencies in the Old Quarter or hotel concierge booking"], "time": "Approx. 2.5 - 3 hours (via the new express highway)"}, {"boarding_location": "Bus: Travel agency storefronts in the Old Quarter or My Dinh Bus Station; Train: Hanoi Railway Station (Ga H\u00e0 N\u1ed9i, 120 L\u00ea Du\u1ea9n)", "method": "Sleeper Bus or Overnight Sleeper Train", "route": "Hanoi -\u003e Sapa", "schedule": "Bus: Multiple daily departures including 07:00, 13:00, and 22:00; Train: Daily overnight services like SP1 (departs 21:35) and SP3 (departs 22:00)", "tickets": ["Sao Viet / Sapa Group Bus official websites", "Vietnam Railways official website (dsvn.vn)", "Baolau / 12Go.asia booking portals"], "time": "Sleeper bus: approx. 5.5 - 6 hours; Sleeper train: approx. 8 hours (requires a transfer to a bus/minivan at Lao Cai Station to head up the mountain)"}, {"boarding_location": "Limousine Van: Hotel pickup in Hanoi Old Quarter; Train: Hanoi Railway Station (Ga H\u00e0 N\u1ed9i)", "method": "Limousine Van or Train", "route": "Hanoi -\u003e Ninh Binh / Tam Coc", "schedule": "Limousine Van: Hourly departures between 07:00 and 17:00; Train: Daily departures such as SE7 (departs 06:00) and SE5 (departs 08:50)", "tickets": ["Klook / KKday online booking for day tours or shuttle buses", "12Go.asia transport site", "Vietnam Railways official website (dsvn.vn)"], "time": "Approx. 1.5 - 2 hours"}];
        const cityName = "Hanoi";
        const dynamicCats = ["\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "\ud83c\udfdb\ufe0f Sights \u0026 Culture", "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "\ud83c\udfdb\ufe0f Attractions \u0026 Arts", "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "\ud83c\udf5c Food \u0026 Coffee", "Ha Long Bay", "Ninh Binh", "Mysore", "Mai Chau", "Haiphong"];
        
        let myTrip = { 1: [] }; 
        let currentDay = 1;
        let totalDays = 1;
        let activeTab = 'schedule';
        let currentFilter = 'All';

        const poolContainer = document.getElementById('pool-container');
        const cartContainer = document.getElementById('cart-container');
        const emptyState = document.getElementById('empty-state');
        const tripCount = document.getElementById('trip-count');
        const fabCount = document.getElementById('fab-count'); 
        const daySelector = document.getElementById('day-selector');
        const tabSchedule = document.getElementById('tab-schedule');
        const tabIntercity = document.getElementById('tab-intercity');
        const filterWrapper = document.getElementById('filter-wrapper'); 
        const cartDrawer = document.getElementById('cart-drawer');
        const mobileOverlay = document.getElementById('mobile-overlay');

        // Toggle Mobile Cart Drawer
        function toggleMobileCart() {
            if (cartDrawer.classList.contains('drawer-closed')) {
                cartDrawer.classList.remove('drawer-closed');
                cartDrawer.classList.add('drawer-open');
                mobileOverlay.classList.remove('hidden');
            } else {
                cartDrawer.classList.remove('drawer-open');
                cartDrawer.classList.add('drawer-closed');
                mobileOverlay.classList.add('hidden');
            }
        }

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {
            const container = document.getElementById('filter-bar');
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function switchTab(tab) {
            activeTab = tab;
            if(tab === 'schedule') {
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                filterWrapper.style.display = 'block'; 
            } else {
                tabIntercity.className = "flex-1 py-3.5 md:py-4 tab-active transition-colors flex justify-center items-center gap-2 text-sm md:text-base border-l border-slate-50";
                tabSchedule.className = "flex-1 py-3.5 md:py-4 tab-inactive transition-colors flex justify-center items-center gap-2 text-sm md:text-base";
                filterWrapper.style.display = 'none'; 
            }
            renderPool();
        }

        function filterCategory(category) {
            currentFilter = category;
            ['All', '🏛️ Attractions', '🛍️ Shopping', '🍜 Dining', ...dynamicCats].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";
                    }
                }
            });
            renderPool();
        }

        function renderPool() {
            poolContainer.innerHTML = '';
            let data = activeTab === 'schedule' ? schedulePool : intercityPool;
            
            if(activeTab === 'schedule' && currentFilter !== 'All') {
                data = data.filter(item => {
                    const cat = item.category || '';
                    const title = item.title || '';
                    const desc = item.description || '';
                    const fullText = (cat + ' ' + title + ' ' + desc).toLowerCase();
                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {
                let title = activeTab === 'schedule' ? item.title : item.route;
                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
                if(dynamicCats.some(dynCat => catLower.includes(dynCat.toLowerCase()))) badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";

                let searchKeyword = encodeURIComponent(`${cityName} ${title}`);
                let formattedDesc = desc.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-2xl p-5 md:p-6 hover:border-sky-200 hover:shadow-md transition-all fade-in group shadow-sm";
                card.style.animationDelay = `${index * 0.02}s`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-3 mb-4">
                        <h3 class="text-lg md:text-xl font-bold text-gray-800 leading-tight">${title}</h3>
                        <button onclick="addToTrip('${activeTab}', '${(item.title || item.route).replace(/'/g, "\\'")}')" class="shrink-0 bg-sky-50 text-sky-600 hover:bg-sky-600 hover:text-white rounded-xl px-4 py-2 font-bold transition-colors border border-sky-100 text-sm shadow-sm">
                            <i class="fa-solid fa-plus mr-1"></i>Add
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        <span class="${badgeColor} border text-xs px-2.5 py-1 rounded-md font-bold">${category}</span>
                        <span class="bg-rose-50 text-rose-600 border border-rose-100 text-xs px-2.5 py-1 rounded-md font-bold flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${duration}</span>
                    </div>
                    <p class="text-sm md:text-base text-gray-600 mb-5 leading-relaxed">${formattedDesc}</p>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-sm md:text-base text-gray-700 flex items-start gap-3">
                        <span class="${activeTab === 'schedule' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                            <i class="fa-solid ${activeTab === 'schedule' ? 'fa-train-subway' : 'fa-ship'}"></i>
                        </span>
                        <span class="leading-snug font-medium">${transport}</span>
                    </div>
                `;
                poolContainer.appendChild(card);
            });
        }

        function addDay() {
            totalDays++;
            myTrip[totalDays] = [];
            const option = document.createElement('option');
            option.value = totalDays;
            option.text = `Day ${totalDays}`;
            daySelector.appendChild(option);
            daySelector.value = totalDays;
            changeDay(totalDays);
        }

        function changeDay(day) {
            currentDay = parseInt(day);
            renderCart();
        }

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let currentDayTrips = myTrip[currentDay];
            
            // Calculate total items across all days for the FAB
            let totalItemsCount = 0;
            for(let d in myTrip) totalItemsCount += myTrip[d].length;
            fabCount.innerText = totalItemsCount;
            tripCount.innerText = `${currentDayTrips.length} Items`;
            
            if(currentDayTrips.length === 0) {
                emptyState.style.display = 'flex';
                Array.from(cartContainer.children).forEach(child => {
                    if(child.id !== 'empty-state') child.remove();
                });
                return;
            }

            emptyState.style.display = 'none';
            Array.from(cartContainer.children).forEach(child => {
                if(child.id !== 'empty-state') child.remove();
            });

            currentDayTrips.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `bg-white border ${item.borderStyle} rounded-2xl p-5 mb-5 shadow-sm hover:shadow-md transition-shadow relative fade-in`;
                
                const line = index !== currentDayTrips.length - 1 ? `<div class="absolute left-[33px] top-[50px] bottom-[-28px] w-0.5 bg-slate-100 z-0"></div>` : '';

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
