dmark witnessing Niseko\u0027s railway and pioneer history.", "name": "JR Niseko Station", "transport": "Take the JR Hakodate Main Line to JR Niseko Station; located immediately outside the exit."}, {"address": "North 4 Higashi 4-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | The Kutchan Natural and Cultural Museum offers one of the most comprehensive historical and natural exhibits in the Niseko region. It highlights the pioneer history, cultural evolution, and local ecology of Kutchan and the Mount Yotei area. The museum houses a vast collection of farm tools from the Meiji and Taisho eras, household items designed for heavy snowfall, early railway construction records, and historic agricultural association archives. Recreated scenes of early pioneer life allow visitors to truly appreciate the resilience of early settlers in this subarctic climate. It is both a treasure trove of regional heritage and an authoritative institution preserving local history.", "name": "Kutchan Natural and Cultural Museum", "transport": "About a 15-minute walk or a 4-minute drive from JR Kutchan Station."}, {"address": "464 Yahata, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Founded in 1893 (Meiji 26), Kutchan Shrine is an iconic century-old landmark in Niseko. Originally a modest shrine established by pioneers praying for safe and prosperous land reclamation, it has grown over a century into the region\u0027s spiritual heart. Dedicated to the three deities of Hokkaido\u0027s reclamation, the shrine features an impressive wooden Torii gate and a main hall built with exquisite traditional Japanese craftsmanship. Surrounded by towering trees over a century old, the serene grounds host vibrant autumn festivals and New Year\u0027s visits (Hatsumode), reflecting deep cultural roots and Shinto traditions.", "name": "Kutchan Shrine", "transport": "About a 6-minute drive from JR Kutchan Station."}, {"address": "Soga, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Located in the Soga district of Niseko, Soga Shrine is an important local sanctuary witnessing the early agricultural settlement of the area. Built in the late Meiji period by pioneer farming families to pray for bountiful harvests and community peace, the shrine remains a charming and tranquil site. Its classic wooden architecture and shaded approach path are beautifully preserved, exuding a rustic historical serenity. Away from the bustle of the ski resorts and nestled near scenic views of Mt. Yotei, it offers visitors a peaceful retreat filled with countryside charm.", "name": "Soga Shrine", "transport": "About a 7-minute drive from JR Niseko Station."}, {"address": "412 Niseko, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Located near the Niseko Konbu Onsen area, the Kanrosui Memorial Stone marks a notable historic visit by Emperor Showa. In 1954 (Showa 29), Emperor Showa and Empress Kojun inspected Hokkaido and tasted the natural spring water flowing from Mount Yotei here. Impressed by its cool, sweet taste like heavenly nectar (\u0027Kanro\u0027), the spring was officially bestowed the name \u0027Kanrosui\u0027. A simple yet dignified stone monument stands by the spring, surrounded by dense virgin forest. Today, this historic spring continues to yield pure, sweet mineral water, drawing locals and travelers alike.", "name": "Kanrosui Memorial Stone \u0026 Historic Spring", "transport": "About a 15-minute drive from JR Niseko Station, or take a bus bound for Konbu Onsen and get off at the Kanrosui-mae bus stop."}, {"address": "258 Rankoshi-cho, Isoya-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Located in the Rankoshi area adjacent to Niseko, the Rankoshi Pioneer Museum comprehensively showcases the settlement history of the Shiribetsu River basin and western Niseko. The building preserves the elegant architectural style of old government offices. Inside, exhibits display pioneer ice and land reclamation tools from the Meiji era onward, antique horse-drawn carriages, early Showa household items, and rare black-and-white photographs. These artifacts vividly tell the story of how early settlers endured Hokkaido\u2019s harsh winters to turn wild forests into a thriving agricultural land known today for rice and produce.", "name": "Rankoshi Pioneer Museum", "transport": "About a 10-minute walk or a 3-minute drive from JR Rankoshi Station."}, {"address": "Futaba, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | The Former Futaba Elementary School Historic Building is one of the best-preserved wooden school buildings from the early Showa period near Niseko, reflecting the evolution of early rural education. Built in the Showa era, this classic two-story wooden structure showcases popular school architecture from the Taisho to early Showa periods, featuring nostalgic wooden hallways, tall windows, and weathered classrooms. Beautifully restored as an art, cultural, and historical display space, it preserves old blackboards, desks, chairs, and school memorabilia, allowing visitors to step back in time and experience the nostalgic atmosphere of school life in historic Niseko.", "name": "Former Futaba Elementary School Historic Building", "transport": "About a 12-minute drive from JR Kutchan Station."}], "name": "Historic Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "57 Arishima, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Dedicated to Takeo Arishima, a representative writer of Japan\u0027s Shirakaba school, this cultural facility showcases his manuscripts, rare photographs, paintings, and historical records of him giving his farm to local farmers free of charge. Combining modern architectural design with Hokkaido\u0027s rich natural surroundings, the museum is encircled by a lush farm park. Large floor-to-ceiling windows offer distant views of majestic Mt. Yotei and Mt. Konbu. It is not only a haven for literature lovers but also the best place to experience Niseko\u0027s pioneering history and cultural heritage.", "name": "Arishima Takeo Memorial Museum", "transport": "About a 5-minute taxi ride or a 25-minute walk from JR Niseko Station."}, {"address": "134-1 Kabayama, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Located in Kutchan Town, this art museum is dedicated to the works of Shu Ogawara, a famous local avant-garde painter. Ogawara depicted Hokkaido\u0027s harsh nature, snowscapes, and Asian life and culture with unique brushstrokes. The museum building blends seamlessly with the surrounding scenery of Mt. Yotei, featuring well-lit exhibition halls and a tranquil outdoor sculpture park. Visitors can marvel at powerful artworks while taking in the magnificent seasonal views of Mt. Yotei through large glass windows.", "name": "Shu Ogawara Museum of Art", "transport": "About a 10-minute taxi ride from JR Kutchan Station."}, {"address": "134-6 Kabayama, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | The Kutchan Town Museum (Fudokan) is a comprehensive museum introducing the natural environment, historical development, and lifestyle in the heavy snow zone of the Niseko region. Exhibits rich in variety include taxidermy specimens of Ezo deer and brown bears, Paleolithic artifacts, pioneer-era farming tools, and snow country lifestyle equipment. In particular, the special exhibition area on Kutchan\u0027s snowy climate and the history of ski sports allows visitors to understand how Niseko transformed from a snowy farming village into a world-class ski resort.", "name": "Kutchan Town Museum (Fudokan)", "transport": "Take a bus bound for Niseko Hirafu from JR Kutchan Station and get off at the \u0027Fudokan-mae\u0027 stop."}, {"address": "41-2 Kabayama, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.7 stars | Hidden in the old-growth forests of Niseko, Somoza is a premier art and cultural space set in a renovated traditional kominka building. It seamlessly blends 150-year-old Japanese timber construction with minimalist modern aesthetics. The gallery exhibits contemporary art, indigenous Ainu crafts from Hokkaido, and exquisite ceramics. In addition to admiring art, visitors can enjoy refined matcha and local seasonal cuisine while taking in views of the Anketsu River valley and forest through massive panoramic windows for a soul-soothing artistic experience.", "name": "Somoza Gallery \u0026 Tea House", "transport": "About a 12-minute taxi ride from JR Kutchan Station. Advance shuttle reservation or driving by car is recommended."}, {"address": "762-22 Weiss, Kyowa-cho, Iwanai-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Located in Kyowa Town near Niseko, the Arai Memorial Art Museum is a private museum renowned for its collection of prints by Pablo Picasso, housing over 300 prints from various periods of his career. Additionally, the museum features dedicated areas showcasing paintings by local and international artists like Keiyo Nishimura. Surrounded by lush green forests and sprawling lawns, the museum offers an elegant and quiet environment, making it a highly rated spot of immense artistic value and cultural depth near the Niseko resort area.", "name": "Arai Memorial Art Museum", "transport": "About a 20-minute drive or taxi ride from JR Kutchan Station."}, {"address": "132 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Situated in the Niseko Hirafu area, St. Moritz Church is built in a classic Swiss mountain village style with a charming Nordic fairytale flair. Its white exterior and elegant spire look sacred and graceful whether covered in winter snow or surrounded by summer greenery. Inside, the church features classic handcrafted wooden pews and beautiful stained glass, creating a solemn yet warm atmosphere. It is a popular spot for couples dreaming of a fairytale snow wedding and a tranquil landmark not to be missed when strolling through Hirafu.", "name": "Niseko St. Moritz Church", "transport": "Take a bus from JR Kutchan Station to the \u0027Hirafu Intersection\u0027 (Hirafu Juji-gai) stop, then walk for about 8 minutes."}, {"address": "95 Fujimi, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.0 stars | The Niseko Town Historical Center displays the rich historical and cultural heritage of Niseko Town from its early pioneer era to the present day. Exhibits include numerous antique daily tools used by Hokkaido\u0027s early settlers, farm machinery, and valuable historical photos and documents covering early Niseko railway construction and Tondenhei (pioneer soldier) life. Through thoughtful displays and artifacts, travelers can gain a deep appreciation for the moving stories of farmers and pioneers fighting harsh nature before this land became a world-famous ski resort.", "name": "Niseko Town Historical Center", "transport": "About a 10-minute walk from JR Niseko Station."}, {"address": "2-2 Makkari, Makkari-mura, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Located in Makkari Village at the foot of Mt. Yotei, the Hosokawa Takashi Memorial Hall was established to celebrate the musical achievements of Japan\u0027s national treasure Enka superstar Takashi Hosokawa. The hall exhibits his numerous music awards, stage costumes, vinyl records, and personal collections accumulated over the years. Outside in the park, there is a singing statue that plays his iconic songs against the backdrop of majestic Mt. Yotei, making it a favorite spot for Enka fans and lovers of Japanese pop music culture.", "name": "Makkari Hosokawa Takashi Memorial Hall", "transport": "About a 15-minute drive or taxi ride from JR Niseko Station."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kutchan Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.7 stars | Affectionately known as \u0027Ezo Fuji,\u0027 Mount Yotei is one of Hokkaido\u0027s most iconic solitary peaks, standing at an elevation of 1,898 meters. It displays breathtaking grandeur in every season: summer brings wild alpine flowers blooming at its base, drawing hikers to conquer the massive crater at the summit; winter cloaks it in pure white powder snow, creating a stunning backdrop for Niseko\u0027s ski resorts. At dawn or dusk, the peak is often enveloped in a sea of clouds or bathed in the glowing crimson of \u0027Aka Fuji,\u0027 making it a sacred spot for photographers seeking Hokkaido\u0027s ultimate natural landscapes.", "name": "Mount Yotei", "transport": "About a 15-minute bus or taxi ride from JR Kutchan Station to the trailhead."}, {"address": "Near Oyunuma, Rankoshi Town, Isoya District, Hokkaido, Japan", "feature": "\u2b50 4.6 stars | Situated in the Niseko Highlands, this alpine marshland is widely considered the most enchanting and mysterious body of water in the Niseko region. A well-maintained wooden boardwalk winds through alpine flora and virgin forests, leading to the crystal-clear Shinsen Numa Marsh, which perfectly mirrors the surrounding vegetation, blue skies, and white clouds. In autumn, the highland foliage turns brilliant shades of gold and deep red, transforming the area into a fairytale wonderland\u2014ideal for casual trail hikes and nature watching.", "name": "Shinsen Numa Marsh", "transport": "About a 40-minute drive or seasonal bus ride from JR Kutchan Station."}, {"address": "Yamada, Kutchan Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.4 stars | Located at the western foot of Mount Yotei, this crescent-shaped volcanic crater lake gets its name from its moon-like contour. Encircled by virgin forests and rich alpine ecosystems, the park features a 3-kilometer loop hiking trail around the lake. The four seasons offer distinct beauty: fresh green buds in spring, pleasantly cool breezes in summer, and vibrant red foliage reflecting on the tranquil lake surface in autumn. This quiet haven is a hidden gem perfect for escaping crowds and immersing yourself in a refreshing forest bath.", "name": "Hangetsu Lake Nature Park", "transport": "About a 15-minute drive from JR Kutchan Station."}, {"address": "Niseko Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.5 stars | Consistently ranked among Japan\u0027s purest rivers, the 126-kilometer Shiribetsu River meanders through the Niseko region, embracing Mount Yotei along its course. More than just a crystal-clear stream, it is a haven for outdoor water sports. Summer attracts countless visitors for thrilling white-water rafting, kayaking, and stand-up paddleboarding (SUP), all while taking in the lush greenery and dramatic mountain scenery. The snowmelt season in late winter and spring offers the most exhilarating rafting experiences.", "name": "Shiribetsu River", "transport": "5 to 10 minutes by foot or car from JR Niseko Station to main activity spots."}, {"address": "Yamada, Kutchan Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.3 stars | Hidden on the northeastern slopes of Mount Niseko Annupuri, this alpine marsh gets its name (\u0027Mirror Marsh\u0027) from its exceptionally still waters that reflect the surrounding landscape like a giant mirror. Even quieter and less crowded than Shinsen Numa, the trail to Kagami Numa weaves through dense bamboo groves and ancient forests (about a 30-minute one-way hike), featuring rich wild flora and birdlife along the path. In autumn, brilliant fall leaves and golden larches weave together, creating breathtaking mirrored reflections.", "name": "Kagami Numa Marsh", "transport": "About a 20-minute drive from JR Kutchan Station to the trailhead, followed by a 30-minute hike."}, {"address": "Yusato, Rankoshi Town, Isoya District, Hokkaido, Japan", "feature": "\u2b50 4.2 stars | Nestled at the foot of Mount Chisenupuri, this natural hot spring pond boasts water temperatures exceeding 60\u00b0C (140\u00b0F), with rich sulfur spring water and steam continuously bubbling up from the bottom. Strolling along the surrounding boardwalks allows visitors to marvel up close at the grand spectacle of boiling yellow water sending up thick plumes of white steam. The surrounding foliage transforms vividly with the seasons; autumn brings striking hues of crimson and gold that contrast dramatically with the billowy white clouds of steam.", "name": "Niseko Oyunuma Pond", "transport": "About a 15-minute drive from JR Konbu Station or a 25-minute drive from Niseko resort areas."}, {"address": "Kawanishi, Kyogoku Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.6 stars | Located at the eastern foot of Mount Yotei, this park is celebrated for its natural spring water sourced from Mount Yotei\u0027s melted snow and is designated as one of Japan\u0027s 100 Remarkable Waters. The crystal-clear spring pool pours forth tens of thousands of tons of fresh water daily, with dedicated collection areas where visitors can freely sample the sweet, refreshing spring water. Lush green scenery, suspension bridges, boardwalks, and gazebos adorn the park, while vibrant autumn leaves make it a scenic sanctuary for relaxation and natural beauty.", "name": "Kyogoku Fukidashi Park", "transport": "About a 25-minute drive from JR Kutchan Station or reachable by local bus lines."}, {"address": "57 Arishima, Niseko Town, Abuta District, Hokkaido, Japan", "feature": "\u2b50 4.3 stars | Dedicated to the acclaimed Japanese literary figure Takeo Arishima, this park rests on rolling hills offering sweeping views of Mount Yotei and the Niseko Annupuri range. The grounds boast expansive green lawns, artistic sculptures, and lovely woodland scenery. Picturesque year-round, it features blooming flowers in spring, lush turf in summer, and rich foliage in autumn. The on-site Arishima Memorial Museum exhibits his literary works and historical archives, making it an ideal destination to blend a tranquil nature walk with cultural discovery.", "name": "Arishima Memorial Park", "transport": "About a 5-minute drive or a 25-minute walk from JR Niseko Station."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "888-1 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.4 Stars | Takahashi Dairy Farm is one of Niseko\u0027s most popular Instagrammable spots, featuring majestic Mt. Yotei as its backdrop, vast green lawns, and giant straw bale displays. Beyond capturing dreamlike photos of Hokkaido\u0027s countryside scenery, you can savor exquisite soft-serve ice cream, cream puffs, and cheesecake made with fresh local milk. In summer, you can photograph sunflower fields and hay bales, while winter blankets the area in thick snow\u2014offering breathtaking scenery in every season.", "name": "Niseko Takahashi Dairy Farm Milk Kobo", "transport": "About a 10-minute taxi or bus ride from JR Niseko Station."}, {"address": "Maeda, Kyowa, Iwanai District, Hokkaido", "feature": "\u2b50 4.6 Stars | Renowned as the most beautiful and mysterious alpine marsh in the Niseko mountain range. Each season brings unique charm, with autumn foliage being the most popular time to visit. Stroll along well-maintained wooden boardwalks through primeval forests and alpine wetlands to reach a fairytale-like marshland. The mirror-like lake surface perfectly reflects the blue sky, white clouds, and surrounding alpine plants, drawing countless photography enthusiasts to capture this serene yet awe-inspiring natural wonder.", "name": "Shinsen-numa Marsh", "transport": "About a 30-minute drive from JR Niseko Station; accessible via the Niseko All-Line Bus during summer and autumn."}, {"address": "Kabayama, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 Stars | A pristine volcanic crater lake at the foot of Mt. Yotei, named for its perfect crescent shape. Surrounded by virgin forest, the park features a trail circling the lake, making it a highly popular nature photography spot in Niseko. Vibrant green in spring, its autumn colors reflect beautifully on the emerald waters, offering breathtaking scenery. It is also a hidden gem for escaping the crowds, enjoying forest bathing, and capturing tranquil lake and mountain vistas.", "name": "Lake Hangetsu Nature Park", "transport": "About a 15-minute drive from JR Kutchan Station to the entrance parking lot."}, {"address": "Chuo-dori, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.2 Stars | A charming wooden station built in a Swiss chalet style, and one of the few train stations in Japan named directly in katakana. Giant pumpkin sculptures and unique decorations line the exterior and station plaza, making it an iconic photo landmark. Adjacent to the station is a free foot bath where visitors can relax while soaking their feet and taking photos of the retro station scenery\u2014looking especially cozy and romantic under a blanket of winter snow.", "name": "JR Niseko Station", "transport": "Take the JR Hakodate Main Line and get off at Niseko Station."}, {"address": "55 Kawanishi, Kyogoku, Abuta District, Hokkaido", "feature": "\u2b50 4.5 Stars | Selected as one of Japan\u0027s Top 100 Famous Waters, located at the eastern foot of Mt. Yotei. Snowmelt from Mt. Yotei is naturally filtered over decades before gushing continuously as pure mineral water. The park features a charming suspension bridge, moss-covered rocks, and flowing springs; when wrapped in morning mist, the crisp air makes it feel like a fairytale world. Beyond being a top photography spot, many visitors bring containers to collect the sweet, natural spring water.", "name": "Fukidashi Park", "transport": "About a 20-minute drive from JR Kutchan Station, or take a bus heading toward Kyogoku and get off at \u0027Kyogoku Meisui Park\u0027."}, {"address": "Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.5 Stars | Hirafu is Niseko\u0027s liveliest ski town. Looking down the main street\u0027s slope, majestic Mt. Yotei towers perfectly at the end of the road, creating a striking focal point. When winter snow falls, warm streetlights contrast beautifully with the colossal mountain in the background, offering a captivating blend of urban resort vibes and raw nature\u2014making it one of the most eye-catching classic photo spots on social media.", "name": "Hirafu Main Street Mt. Yotei View", "transport": "About a 15-minute bus ride from JR Kutchan Station to Hirafu Welcome Center, followed by a short walk."}, {"address": "485 Niseko, Niseko-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.6 Stars | Ride the Annupuri Gondola up to the 1,000-meter summit to enjoy an unobstructed, panoramic view of the entire Niseko Basin and magnificent Mt. Yotei directly ahead. In autumn, take in colorful foliage and the occasional dramatic sea of clouds, while winter transforms the landscape into a vast white wonderland. The gondola summit station features photo platforms and photo-op signs, offering an unobstructed 360-degree view that leaves visitors spellbound by Hokkaido\u0027s grandeur.", "name": "Niseko Annupuri Gondola Mountain Top Lookout", "transport": "About a 15-minute drive from JR Niseko Station to the Annupuri Gondola Station, then take the gondola to the top."}, {"address": "Higashiyama Onsen, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.3 Stars | Located in the heart of the Niseko Village Resort, this shopping area seamlessly blends traditional Japanese machiya architecture with modern luxury resort style. The wooden structures are blanketed in deep snow during winter, creating an intensely romantic atmosphere when illuminated at night. Surrounded by endless snowscapes and forests, it is an exceptional photo landmark combining traditional Japanese charm with an international resort ambiance.", "name": "Niseko Village Shopping \u0026 Dining Area", "transport": "About a 15-minute drive from JR Niseko Station, or take a direct resort shuttle bus."}], "name": "Popular Photo Hotspots"}}, "name": "Niseko Resort Area"}, "noboribetsu_toya": {"categories": {"cat_1": {"items": [{"address": "53-1 Naka-Noboribetsu-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.3 stars | Noboribetsu Date Jidaimura is a large cultural theme park that meticulously recreates the historical ambiance of Japan\u0027s Edo period. The buildings inside strictly follow the designs of Edo-period samurai residences, merchant shops, and traditional nagaya townhouses, reviving the bustling atmosphere of a castle town. Stepping inside feels like traveling back in time. Visitors can admire the magnificent wooden castle \u0027Noboribetsu Date Castle\u0027, enjoy thrilling ninja action shows and graceful oiran performances, and deeply experience the unique charm of traditional Japanese architectural art and history.", "name": "Noboribetsu Date Jidaimura", "transport": "From JR Noboribetsu Station, take the Donan Bus for about 10 minutes and get off at \u0027Naka-Noboribetsu\u0027 stop."}, {"address": "Gokuraku Dori Shopping Street, Noboribetsu Onsen-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.1 stars | Located in the heart of Gokuraku Dori Shopping Street in Noboribetsu Onsen, Enmado is one of the most distinctive cultural landmarks and religious symbols in Noboribetsu. This wooden hall houses a massive seated statue of King Enma (ruler of the underworld). While it usually displays a compassionate expression, during the scheduled \u0027Judgment of Hell Show\u0027, King Enma\u0027s expression instantly turns into a fierce, stern face accompanied by dynamic sound and light effects. Combining traditional architecture with religious imagery as the guardian deity of the hot spring town, it is an unmissable historical and cultural attraction when visiting Noboribetsu Onsen.", "name": "Noboribetsu Onsen Enmado", "transport": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk about 5 minutes."}, {"address": "108 Noboribetsu Onsen-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.2 stars | Perched on a small hill next to the Noboribetsu Onsen area, Yuzawa Shrine dates back to the Ansei era of the late Edo period, making it one of the oldest religious buildings in the Noboribetsu region. Dedicated primarily to the Three Gods of Pioneer Settlement and the God of Hot Springs, it has long protected the hot spring sources and the safety of local residents. Surrounded by lush greenery and a serene atmosphere, walking up the steps through stone torii gates and wooden main halls allows visitors to feel a profound sense of history and sacredness. It is also a wonderful spot in autumn to see vibrant maple leaves complementing the traditional Japanese shrine.", "name": "Yuzawa Shrine", "transport": "About an 8-minute walk from the Noboribetsu Onsen Bus Terminal to the shrine entrance staircase."}, {"address": "124 Usu-cho, Date City, Hokkaido", "feature": "\u2b50 4.5 stars | Located in Usu-cho, Date City near Lake Toya, Usu Zenkoji Temple was founded in the early Heian period (826 AD) and designated by Tokugawa Ieyasu during the Edo period as one of the \u0027Three Official Temples of Ezo\u0027. It stands as a nationally designated historic site and ancient temple of immense historical significance in Hokkaido. The temple preserves many ancient wooden main halls, bell towers, and historical artifacts that reflect centuries of historical evolution. Featuring hundreds of centuries-old cherry trees and notable trees within its grounds, it is known as the \u0027Temple of Flowers\u0027, offering an architectural landscape that seamlessly blends rich history with natural beauty.", "name": "Usu Zenkoji Temple", "transport": "About a 20-minute walk from JR Usu Station, or a 15-minute taxi ride from JR Date-Mombetsu Station."}, {"address": "Kagawa, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Situated on a cape jutting into the lake on the northern shore of Lake Toya, Ukimido Park\u0027s centerpiece is \u0027Ukimido\u0027, a two-story pagoda-style wooden structure extending into the water. Modeled after traditional Japanese temple pavilions, it houses a statue of Sho-Kannon Bodhisattva. Together with the surrounding deep blue waters of Lake Toya and Mount Yotei in the distance, it creates a breathtakingly tranquil scene steeped in Zen aesthetics. This landmark rich in historical charm and cultural atmosphere attracts countless photography enthusiasts.", "name": "Lake Toya Ukimido Park", "transport": "From JR Toya Station, take a bus to \u0027Toya Mizu-no-Eki\u0027 stop and walk about 15 minutes."}, {"address": "54 Aoba-cho, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Perched on a hill overlooking Lake Toya and Uchiura Bay (Funka Bay), Abuta Shrine dates back to 1804 (the first year of the Bunka era) and is one of the oldest shrines in the Lake Toya region. The shrine structure utilizes traditional Japanese wooden joinery techniques, exhibiting a dignified and ancient style. It is dedicated to deities of pioneer development and industrial prosperity, and is famous for being situated on a powerful energy spot (\u0027Power Spot\u0027). The Toshibetsuyama Ryudo hiking trail extending from the shrine and the Golden Luck Torii Gate make it a famous spiritual landmark combining natural landscape with historical faith.", "name": "Abuta Shrine", "transport": "About a 5-minute drive/taxi ride or a 25-minute walk from JR Toya Station."}, {"address": "142 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Located on a small hill behind the Toyako Onsen street, Toyako Onsen Shrine was built during the Taisho period and has witnessed the development of Toyako Onsen since its opening in the late Meiji period. The main hall features a simple yet solemn wooden construction, where prayers are offered for continuous hot spring flow, local prosperity, and traveler safety. Climbing the shrine\u0027s high stone stairs, visitors can look through the traditional vermilion torii gate to enjoy sweeping views of Lake Toya and Nakajima Island, making it one of the hot spring town\u0027s iconic historical and cultural landmarks.", "name": "Toyako Onsen Shrine", "transport": "About a 10-minute walk from Toyako Onsen Bus Terminal."}, {"address": "6-1-2 Katakura-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.1 stars | The Noboribetsu City Local History Museum is a historical memorial building recreating the structure of a traditional Japanese samurai lord\u0027s residence (daimyo yashiki). Designed after the annex buildings of Shiroishi Castle owned by the Katakura clan of the Sendai Domain, it commemorates the history of pioneers who migrated from Shiroishi, Miyagi Prefecture, to develop Noboribetsu during the Meiji period. Inside, it exhibits valuable documents and daily artifacts regarding the pioneer era of Noboribetsu, traditional Ainu culture, early hot spring development, and historical agriculture and forestry, making it a key venue to deeply understand the historical evolution and architectural heritage of the area.", "name": "Noboribetsu City Local History Museum", "transport": "From JR Noboribetsu Station, take a bus to \u0027Katakura-cho\u0027 stop and walk about 3 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "142-5 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Located adjacent to the Lake Toya Visitor Center, this museum meticulously documents the eruption history of Mount Usu and its impact on the surrounding environment. Through dynamic audio-visual displays, earthquake simulators, and volcanic debris exhibits, visitors can experience the awe-inspiring power of natural disasters firsthand. It is the ultimate educational spot to learn about the geological formation of Lake Toya.", "name": "Toya-Usu Volcano Science Museum", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 station and walk for about 3 minutes."}, {"address": "53-1 Nakanoboribetsu-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.4 stars | Noboribetsu Date Jidaimura is an Edo-period history and folklore village recreating classic streetscapes and samurai residences. The park features a Ninja Museum, a Ghost House, and an Edo Culture Museum, alongside thrilling ninja action shows and elegant Oiran processions, perfectly reviving traditional Japanese history, culture, and arts.", "name": "Noboribetsu Date Jidaimura", "transport": "From JR Noboribetsu Station, take the Donan Bus and get off at \u0027Noboribetsu Date Jidaimura\u0027."}, {"address": "187 Toya-cho, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Situated on the shores of Lake Toya, the Toyako Art Museum is a cultural space transformed from the former Abuta Town Hall building. It mainly showcases exquisite works by renowned sculptors and artists, along with regular contemporary art exhibitions. The front courtyard faces stunning lake and mountain views, blending art appreciation with breathtaking natural scenery in a uniquely cultural atmosphere.", "name": "Toyako Art Museum", "transport": "From JR Toya Station, take a bus to \u0027Toya Mura\u0027 station and walk for about 2 minutes."}, {"address": "224 Noboribetsu Onsen-cho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.2 stars | Located at the summit of Noboribetsu Bear Park, \u0027Yukara Village\u0027 (Yukara no Sato) is a museum celebrating the indigenous Ainu culture of Hokkaido. It faithfully recreates traditional Ainu thatched houses called \u0027Chise\u0027, displaying over 300 rare household utensils, clothing, and hunting tools, complete with live traditional craft demonstrations\u2014a site of tremendous cultural and historical value.", "name": "Noboribetsu Bear Park Ainu Culture Museum", "transport": "Take the Noboribetsu Bear Park Ropeway from Noboribetsu Onsen Street to the summit."}, {"address": "287-1 Takinocho, Sobetsu-cho, Usu-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Combining tourist information services with a volcanic disaster prevention exhibit, the Sobetsu Information Center i displays the formation history and eruption records of Mount Usu and Showa-shinzan. Through rich photo galleries, 3D models, and disaster-prevention videos, it offers an accessible introduction to the area\u0027s geological history and the wisdom of coexisting with volcanoes.", "name": "Sobetsu Information Center i Volcano Museum", "transport": "From JR Date-Mombetsu Station, take the Donan Bus bound for Sobetsu and get off at \u0027Sobetsu Yakuba-mae\u0027."}, {"address": "Lakeside area around Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | This open-air sculpture park turns the entire Lake Toya shoreline into a museum without walls. Scattered along the 43-kilometer lakeside trail are 58 contemporary sculptures created by renowned Japanese and international artists. Visitors can stroll alongside sparkling lake views while admiring uniquely shaped works of art, experiencing a perfect harmony between nature and sculpture.", "name": "Lake Toya Gurutto Sculpture Park", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 station and walk to the lakeside."}, {"address": "58 Honcho, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 3.9 stars | The Abuta Folk History Museum chronicles the pioneer history and lifestyle evolution of the Abuta region along Lake Toya. It houses a vast collection of pioneer-era farming tools, fishing gear, daily necessities, and excavated relics from the Jomon period, allowing visitors to deeply understand the local cultural history and heritage from ancient times to the present.", "name": "Abuta Folk History Museum", "transport": "About a 10-minute walk from JR Toya Station, or take a local bus to \u0027Abuta Honcho\u0027 station."}, {"address": "2-22 Chitosecho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.0 stars | Located in downtown Noboribetsu, the Noboribetsu Catholic Church features a cozy, simple European design. This historic sanctuary provides a peaceful prayer space for residents and travelers alike. With its warm wooden interior and tranquil atmosphere, it stands out as a serene spot filled with art, culture, and faith.", "name": "Noboribetsu Catholic Church", "transport": "About an 8-minute walk from JR Horobetsu Station."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Noboribetsu Onsencho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.5 stars | Noboribetsu Jigokudani (Hell Valley) is the main hot spring source and iconic symbol of Noboribetsu Onsen. Formed by a volcanic eruption about 15,000 years ago, this explosive crater traces approximately 450 meters in diameter. Countless steam vents, gushing springs, and geothermal landscapes are scattered across the park, pumping out up to 3,000 liters of hot spring water per minute. The bubbling waters and swirling steam create an awe-inspiring, hellish landscape. Walking along the well-paved boardwalks allows you to get up close to the reddish volcanic rocks smelling strongly of sulfur. At night, the boardwalks are illuminated, transforming into the enchanting and mystical \u0027Demon\u0027s Fire Pathway\u0027.", "name": "Noboribetsu Jigokudani (Hell Valley)", "transport": "From JR Noboribetsu Station, take the Donan Bus to the \u0027Noboribetsu Onsen\u0027 stop and walk about 10 minutes."}, {"address": "Noboribetsu Onsencho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.4 stars | Oyunuma Lake is a gourd-shaped volcanic crater pond created by the eruption of Mount Hiyori, measuring about 1 km in circumference and 22 meters in depth. Black sulfurous springs as hot as 130\u00b0C continuously gush from the bottom, maintaining a surface temperature of around 60\u00b0C year-round. Dense white steam and a strong sulfur scent constantly float over the lake, creating a majestic atmosphere. Surrounded by rich primeval forest, autumn brings vibrant red foliage that contrasts strikingly with the yellowish-green and blue lake waters, showcasing breathtakingly layered natural scenery.", "name": "Oyunuma Lake", "transport": "About a 20-25 minute walk along the nature trail from Noboribetsu Jigokudani, or a 5-minute drive from Noboribetsu Onsen Street."}, {"address": "Toyako-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.6 stars | Lake Toya is a nearly circular volcanic caldera lake located within Shikotsu-Toya National Park and is one of Japan\u0027s northernmost ice-free lakes. Its clear blue waters are framed by majestic peaks like Mount Yotei, Mount Usu, and Showa Shinzan. Gorgeous views await in every season: cherry blossoms in spring, lush greenery and nightly fireworks shows spanning several months in summer, vibrant autumn leaves, and snowy winter landscapes reflected on the lake. Visitors can take cruise boats out onto the lake to soak in the therapeutic embrace of nature and spectacular waterscapes.", "name": "Lake Toya", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 stop to arrive directly at the lakeside."}, {"address": "184-5 Showashinzan, Sobetsu-cho, Usu-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Mount Usu is an active volcano that erupted four times in the 20th century alone, creating a truly unique volcanic terrain. Taking the Mt. Usu Ropeway brings you smoothly to the summit in just 6 minutes. Multiple observation decks at the top offer panoramic 360-degree views of Lake Toya, the majestic Mount Yotei, and the vast waters of Funka Bay. Walking along the trail to the Outer Rim Observation Deck lets you observe steaming craters and ash landscapes up close, offering a profound sense of nature\u0027s power to both create and destroy.", "name": "Mount Usu", "transport": "From JR Toya Station, take a bus to \u0027Showa Shinzan\u0027 stop, then walk about 1 minute to the ropeway station."}, {"address": "Showashinzan, Sobetsu-cho, Usu-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Showa Shinzan is a lava dome formed by earthquakes and volcanic activity between 1943 and 1945, designated as a Special Natural Monument of Japan. Remarkably young, white steam still billows from its summit, and its bare reddish-brown rock stands out majestically against the surrounding greenery. At the foot of the mountain lies a vast lawn park and the Mimatsu Masao Memorial Hall, making it a great place for a stroll while admiring this rare \u0027living volcano\u0027 miracle pulsing with Earth\u0027s inner energy.", "name": "Showa Shinzan", "transport": "From JR Toya Station, take the Donan Bus directly to the \u0027Showa Shinzan\u0027 terminal stop."}, {"address": "Nakajima, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Nakajima is the collective name for four volcanic dome islands (Oshima, Kannonjima, Bentenjima, and Manjujima) situated in the center of Lake Toya. Visitors can take the Lake Toya Sightseeing Cruise to explore the largest island, Oshima. The island features the Lake Toya Forest Museum and several kilometers of nature trails, home to many wild Ezo sika deer and bird species. Strolling through the towering, ancient forest offers a tranquil forest bathing experience and a unique view from the heart of the lake.", "name": "Nakajima Island (Lake Toya)", "transport": "Take the \u0027Lake Toya Sightseeing Boat\u0027 from the Toyako Onsen pier and disembark at Nakajima pier."}, {"address": "3-5 Naruka, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Perched on a plateau along the northern shore of Lake Toya, Silo Observatory offers a breathtaking panoramic view of the entire lake area. From here, you can take in the sweeping curve of Lake Toya\u0027s shoreline, Nakajima Island in the center, Mt. Usu and Showa Shinzan in the background, and even Mount Yotei (known as Ezo Fuji) in the distance. Adjacent to the observatory is a souvenir shop serving rich local Hokkaido milk soft-serve ice cream, drinking yogurt, and various regional gifts, making it an essential pit stop during road trips around the lake.", "name": "Silo Observatory (Lake Toya)", "transport": "About a 20-minute drive from JR Toya Station, or take a Rusutsu-bound bus and get off at \u0027Silo Observatory\u0027 stop."}, {"address": "Noboribetsu Onsencho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.5 stars | Tucked away in Noboribetsu\u0027s primeval forest, the Oyunuma River Natural Footbath is a hidden gem. High-temperature sulfur spring water flowing from Oyunuma Lake joins the Oyunuma River, cooling down naturally along its route to create a perfectly warm natural foot bath right in the forest stream. Visitors can sit on wooden benches, dip their feet into the flowing thermal waters, and breathe in the crisp forest air filled with negative ions and subtle sulfur notes. In autumn, the valley blazes with golden and crimson leaves, providing a uniquely refreshing outdoor experience.", "name": "Oyunuma River Natural Footbath", "transport": "About a 20-minute walk from Noboribetsu Jigokudani along the Oyunuma nature trail, or a 10-minute walk from the Oyunuma parking lot."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Noboribetsu Onsencho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.5 stars | Noboribetsu Jigokudani (Hell Valley) is the most iconic attraction of Noboribetsu Onsen, formed by volcanic eruptions. Filled with fumaroles, boiling thermal springs, and volcanic vapors, a rich scent of sulfur fills the air. Walking along the wooden boardwalk, the dramatic, desolate rocks intertwined with billowing steam create a awe-inspiring, hell-like landscape. In autumn, vibrant fall foliage adds a stunning contrast, making it an absolute must-visit spot in Hokkaido.", "name": "Noboribetsu Jigokudani (Hell Valley)", "transports": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen\u0027 stop, then walk about 10 minutes."}, {"address": "Oyunuma, Noboribetsu Onsencho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.4 stars | Oyunuma is a dramatic hot spring crater lake formed by an explosive eruption, featuring a mystical surface swirling with steam. Following the stream leads to a natural footbath with wooden seating nestled in a virgin forest. Visitors can soak their feet in the warm, mineral-rich thermal stream while surrounded by nature\u2014a perfect way to relax and capture chic, aesthetically pleasing photos.", "name": "Oyunuma Lake \u0026 Natural Footbath", "transports": "Walk about 20 to 30 minutes along the walking trail from the Noboribetsu Jigokudani boardwalk."}, {"address": "3-5 Naruka, Toyako-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Perched on a high plateau along the western shore of Lake Toya, Silo Observatory offers the best panoramic photography vantage point overlooking Lake Toya, Nakajima Island, Mt. Showa-Shinzan, and Mt. Usu. Featuring eye-catching photo signboards and a helicopter tour spot, the sparkling cobalt-blue waters under the sun present picture-postcard views across all four seasons.", "name": "Lake Toya Silo Observatory", "transports": "From JR Toya Station, take the Donan Bus to \u0027Silo Observatory\u0027 stop."}, {"address": "Showa-Shinzan, Sobetsu-cho, Usu District, Hokkaido", "feature": "\u2b50 4.2 stars | Mt. Showa-Shinzan is a Special Natural Monument volcano that suddenly rose during the Showa era. Its reddish-brown slopes continue to emit white steam today, showcasing intense underground thermal activity. The vivid contrast between the lush green lawns at its base and the rugged volcanic peak makes it a prime spot for photography.", "name": "Mt. Showa-Shinzan", "transports": "From JR Toya Station, take the Donan Bus to \u0027Showa-Shinzan\u0027 stop."}, {"address": "184-5 Showa-Shinzan, Sobetsu-cho, Usu District, Hokkaido", "feature": "\u2b50 4.4 stars | A quick 6-minute ride on the Mt. Usu Ropeway takes you to the summit, offering breathtaking panoramic views of Lake Toya and Mt. Showa-Shinzan along the way. Near the summit observation deck is the stylish open-air \u0027Mt. USU TERRACE CAF\u00c9\u0027, where you can sip delicious coffee while gazing at the Ginnuma Crater and Volcano Bay\u2014a trendy spot for spectacular high-altitude photos.", "name": "Mt. Usu Ropeway", "transports": "Located next to Mt. Showa-Shinzan, about a 2-minute walk from the Showa-Shinzan Bus Stop to the ropeway station."}, {"address": "Toyako Onsen, Toyako-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | Stretching several kilometers along the shore of Lake Toya, this park features nearly 60 sculptures created by Japanese and international artists. Combining deep blue lake waters, lush greenery, and contemporary art, it creates an open-air gallery vibe. Strolling along the lakeside to hunt for and photograph unique artworks is a wildly popular activity in Lake Toya.", "name": "Lake Toya Gurutto Ukai Park (Sculpture Park)", "transports": "About a 3-minute walk from the Toyako Onsen Bus Terminal to the lakeside."}, {"address": "53-1 Nakanoboribetsucho, Noboribetsu City, Hokkaido", "feature": "\u2b50 4.3 stars | This cultural theme park faithfully recreates the townscapes and lifestyle of the Edo period, featuring traditional merchant houses, ninja trick houses, and grand samurai residences. Visitors can dress in kimono or ninja attire to snap time-traveling vintage photos while exploring historic streets. Thrilling ninja action shows and elegant Oiran performances make it a fantastic stop for photos and entertainment.", "name": "Noboribetsu Date Jidaimura Historical Village", "transports": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Date Jidaimura\u0027 stop."}, {"address": "29 Toyako Onsen, Toyako-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Board the fairytale medieval castle-shaped cruise ship \u0027Espoir\u0027 to glide across the crystal-clear waters of Lake Toya and admire Nakajima Island up close. In summer, passengers can disembark on Nakajima Island to hike nature trails through ancient woods and spot wild Ezo sika deer\u2014a magical experience blending fairytale charm with natural beauty.", "name": "Lake Toya Cruise \u0026 Nakajima Island", "transports": "About a 5-minute walk from Toyako Onsen street to the cruise pier."}], "name": "Popular Photo Spots"}}, "name": "Noboribetsu Onsen and Lake Toya"}, "otaru_canal": {"categories": {"cat_1": {"items": [{"address": "5 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Built from the Meiji to Taisho periods, these stone warehouses along the Otaru Canal served as key distribution hubs for goods during Hokkaido\u0027s development and maritime trade. Their well-preserved red brick and stone exteriors exude a strong sense of heavy industrial and port heritage. Today, many have been revitalized into specialty restaurants, craft breweries, and artisan shops. Strolling along the wooden boardwalk offers a deep glimpse into the prosperous past of what was once the \u0027Wall Street of the North\u0027, while the illuminated night views reflected on the canal water create a truly romantic atmosphere.", "name": "Otaru Canal Warehouses", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "1-11-16 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Completed in 1912, this grand Western-style modern building was designed by Kingo Tatsuno (the famous architect behind Tokyo Station) and his student Uheiji Nagano. Featuring a brick-and-stone structure in a classical style, it boasts spectacular arches and domes. The interior preserves the luxurious original banking hall and massive vault, now open to the public for free as a financial museum. Exhibits cover Otaru\u0027s history as a modern financial center, and visitors can even enjoy the interactive experience of lifting a realistic model of 100 million yen.", "name": "Bank of Japan Otaru Museum", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "1-3-6 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Built in 1927, the Former Mitsui Bank Otaru Branch is a major component of the Otaru Art Base. Its exterior features Renaissance-style classical stone pillars and granite walls, giving it a dignified and noble look. Inside, the spacious open-ceiling design is column-free, decorated with exquisite classical carvings and gold leaf accents. Beyond exhibiting historical banking facilities and vaults, the building hosts nightly indoor light and projection mapping shows blending history and art, immersing visitors in a magical interplay of light and history.", "name": "Former Mitsui Bank Otaru Branch", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "4-1 Sumiyoshicho, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | A landmark situated at the red-brick intersection of Sakaimachi Street, this historic building completed in 1912 originally served as the headquarters of Kyosei Co., Ltd. Its red brick facade with arched windows and warm wooden interior radiate a nostalgic Meiji-Taisho romantic aesthetic. Standing at the entrance is a rare Canadian-made steam clock that plays melodious steam chimes every 15 minutes. Showcasing and selling tens of thousands of exquisite music boxes, it is one of Otaru\u0027s most beloved historical landmarks.", "name": "Otaru Music Box Museum Main Hall", "transport": "Approx. 7-minute walk from JR Minami-Otaru Station"}, {"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Originally built in 1891 as the \u0027Kimura Warehouse\u0027, this iconic stone structure was used to store seafood and cargo. It retains the unique soft-stone exterior masonry and heavy wooden beam construction typical of Hokkaido\u0027s pioneer era. Repurposed into a famous glass craft hall, its cafe uniquely relies on 167 oil lamps as its sole lighting source. The elegant lighting ceremony each morning, paired with the rustic wooden scent and soft lamplight, makes it an ideal spot to experience Otaru\u0027s charming vintage ambiance.", "name": "Kitaichi Glass No. 3 Building", "transport": "Approx. 10-minute walk from JR Minami-Otaru Station"}, {"address": "3-7-8 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Built in 1906, the Former Nippon Yusen Kaisha Otaru Branch is an Important Cultural Property of Japan, showcasing the representative European Renaissance Revival architectural style of the Meiji period. Featuring a symmetrical, solid stone facade, its interior is sumptuously decorated\u2014particularly the VIP reception room, which boasts gold leaf wallpaper and intricate wood carvings reflecting Otaru\u0027s past prosperity as a major international trading port. It was also the historical venue for the boundary line negotiation conference between Japan and Russia regarding Sakhalin after the Russo-Japanese War.", "name": "Former Nippon Yusen Kaisha Otaru Branch", "transport": "Approx. 20-minute walk from JR Otaru Station"}, {"address": "1-1-8 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Taisho Glass Palace is housed inside the \u0027Former Takano Head Office\u0027 stone warehouse, built in 1902. Blending Japanese storehouse (Kura) architecture with Western stone masonry, its exterior walls showcase a rich, weathered texture built over time. The shop features glassware inheriting the superb craftsmanship of the Taisho era, embodying an elegant yet simple Japanese glass aesthetic. In addition to displaying and selling handmade glassware, a workshop behind the main building lets visitors try their hand at glassblowing and glass bead making inside a century-old historical landmark.", "name": "Taisho Glass Palace", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "1-1-5 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Built in 1912, this classical stone edifice was once the headquarters of the Former Hokkaido Bank and is now a designated historic building of Otaru City. Combining the solid feel of stone masonry with elegant classical column details, it exudes a strong sense of history. Today, the interior operates as the \u0027Otaru Bine\u0027 wine restaurant and center, leveraging the former bank\u0027s high ceilings and thick walls to create an atmospheric dining environment that serves top-tier local Hokkaido wines and fine cuisine.", "name": "Former Hokkaido Bank Head Office / Otaru Bine", "transport": "Approx. 9-minute walk from JR Otaru Station"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "2-1-20 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Housed in an old red-brick warehouse along the Otaru Canal, the museum features two main exhibition halls introducing Otaru\u0027s natural history, maritime trade pioneering history, and artifacts/models from the flourishing herring fishing era. The recreated townscapes and shop displays from the Meiji to Taisho periods evoke a sense of time travel, making it the best cultural spot to understand the canal\u0027s history and local customs.", "name": "Otaru Museum Canal Branch", "transport": "About a 10-minute walk from JR Otaru Station to the canal bank"}, {"address": "1-3-1 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Part of the Otaru Art Base, this museum occupies the former Hokkaido Takushoku Bank Otaru Branch built in 1927. It boasts a rich collection showcasing works by Japanese painting masters like Yokoyama Taikan and Kawai Gyokudo, alongside Western-style paintings by Kishida Ryusei and Takahashi Yuichi. The basement exhibits Caucasian carpets and Ukiyo-e, while upper floors seamlessly blend classic modern architectural aesthetics with precious art collections for a striking visual impact.", "name": "Nitori Museum of Art", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "1-1-5 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Housed in the repurposed Former Takahashi Warehouse, this museum is also part of the Otaru Art Base. It displays authentic stained glass windows used in 19th- to early 20th-century British churches. Depicting biblical stories, heroic legends, and Victorian craftsmanship, these works cast brilliant, mesmerizing light and colors under soft illumination, offering a tranquil and solemn spiritual experience.", "name": "Stained Glass Museum", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "6-5 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Located in the former Otaru Warehouse near the entrance of Sakaimachi Street, this is the newest major exhibition hall of the Otaru Art Base. It features a vast collection of late 19th to early 20th-century Art Nouveau and Art Deco crafts, including exquisite glassware by \u00c9mile Gall\u00e9 and the Daum Brothers, along with meticulously crafted European antique furniture and chandeliers that showcase the opulent taste of Western aristocracy.", "name": "Western Art Museum", "transport": "About an 11-minute walk from JR Otaru Station, adjacent to Otaru Canal Plaza"}, {"address": "5-27 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Situated on the bustling Sakaimachi Street, this five-story museum was modeled after Venice\u0027s Palazzo Grassi. The center of the first floor displays a full-scale 1:1 luxury Venetian gondola once used for VIP visits. The galleries showcase intricately crafted Italian Venetian glass art, aristocratic costumes, and court furniture. Visitors can even try on court dresses to create romantic Venetian-style memories.", "name": "Kitaichi Venetian Art Museum", "transport": "About a 10-minute walk from JR Minami-Otaru Station, or an 18-minute walk from JR Otaru Station"}, {"address": "1-9-5 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.0 stars | Located in the former civic agency district of Otaru, this museum presents works by modern artists with deep ties to the city, such as famous painter Zensaku Nakamura and woodblock print artist Ichiyusai Kuniyoshi. Exhibition themes cover Otaru\u0027s natural scenery, port transformations, and local humanistic history, making it a cultural sanctuary for experiencing Otaru\u0027s rich artistic legacy.", "name": "Otaru City Museum of Art", "transport": "About an 8-minute walk from JR Otaru Station"}, {"address": "1-9-5 Ironai, Otaru, Hokkaido", "feature": "\u2b50 3.9 stars | Sharing the same building with the Otaru City Museum of Art, this institution is dedicated to literary figures connected to Otaru. Highlights include manuscripts, first editions, and personal belongings of Takiji Kobayashi\u2014author of the famous proletarian novel \"The Crab Cannery Ship\"\u2014and literary giant Sei Ito. With carefully recreated vintage writing studies and historical archives, it is a must-visit pilgrimage site for literature enthusiasts.", "name": "Otaru City Museum of Literature", "transport": "About an 8-minute walk from JR Otaru Station"}, {"address": "1-21-25 Tomioka, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Perched on a hill overlooking downtown Otaru, this historical church built in 1929 blends Gothic and Gothic Revival architectural styles. Featuring a graceful spired bell tower and beautiful stained glass windows, its interior radiates a serene and solemn atmosphere as pipe organ music echoes beneath wooden vaulted ceilings. The plaza outside offers panoramic views of Otaru Port and the city, making it Otaru\u0027s premier church landmark for religious history and architectural beauty.", "name": "Tomioka Catholic Church", "transport": "About a 10-minute walk from JR Otaru Station"}], "name": "Arts \u0026 Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "5 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | The Otaru Canal Promenade is one of Hokkaido\u0027s most iconic spots where history meets nature. Stretching along the once-bustling port canal, this cobblestone pathway is lined with 24 elegant, vintage gas lamps that glow with Victorian charm at dusk, illuminating the ancient red-brick and stone warehouses across the water. Each season brings its own magic: gentle spring breezes rippling the water, lush summer greenery, golden autumn foliage, and snow-covered winter landscapes during the romantic Otaru Snow Light Path Festival. Strolling along the canal offers serene reflections, panoramic sea views of Otaru Port, and a deep sense of nostalgia from the Meiji and Taisho eras.", "name": "Otaru Canal Promenade", "transport": "About an 8-minute walk from JR Otaru Station"}, {"address": "3-6 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Located at the northern end of the Otaru Canal (North Canal), Canal Park is a tranquil green oasis filled with a relaxed atmosphere. At its center stands a grand circular fountain recreating the feel of the Meiji-era Otaru Port wharves. Behind the park sit Important Cultural Properties such as the Former Nippon Yusen Kaisha Otaru Branch building, framed by red-brick warehouses and expansive lawns to form a picture of serene elegance. Far quieter than the bustling southern section of the canal, it is a hidden gem favored by locals and savvy travelers for picnics, strolls, and watching boats drift along the North Canal.", "name": "Otaru Canal Park", "transport": "About a 20-minute walk from JR Otaru Station, or take a city bus and get off at the \u0027Unka Koen-mae\u0027 stop"}, {"address": "1-chome Ironai to 1-chome Temiya, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Part of Hokkaido\u0027s very first railway line, the Former Temiya Line has been transformed into a linear green corridor stretching 1.6 kilometers through central Otaru and near Sakaimachi Street. The green trail preserves original tracks, switches, and signals, flanked by lush trees and seasonal flowers. Visitors can stroll along the historic rails, bask in dappled sunlight filtering through the canopy, and appreciate the harmony between railway heritage and natural greenery. It is a fantastic photography spot, especially during spring blossoms and autumn foliage.", "name": "Former Temiya Line Railway Green Trail", "transport": "About a 5-minute walk from JR Otaru Station to access the green trail"}, {"address": "3-chome Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Extending into Otaru Port, Ironai Pier Park offers expansive ocean views and is a premier spot for taking in Otaru\u0027s coastal scenery. Featuring a seaside promenade and observation deck, the park provides panoramic 360-degree views of the deep blue harbor, passing ships, and the rolling mountains along the coast. Enjoy the morning glow rising over the water or golden sunsets painting the waves at dusk. Accompanied by refreshing ocean breezes, locals often fish or stroll here, soaking in the relaxing coastal atmosphere.", "name": "Ironai Pier Park", "transport": "About a 22-minute walk from JR Otaru Station, or a 5-minute walk east from the northern tip of Otaru Canal"}, {"address": "Along the coast of Chikko and Katsunaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Located near the southern extension of Sakaimachi Street, Katsunai Riverfront Park is a waterfront space near where the Katsunai River meets Otaru Port. Gentle, landscaped walking paths and flower beds line both banks. In spring, blooming cherry blossoms form a dreamy pink tunnel, while in autumn, visitors can witness the natural marvel of salmon swimming upstream to spawn. With clear river waters and rich stream vegetation, it offers a peaceful spot to unwind and connect with nature right next to the bustling commercial area.", "name": "Katsunai Riverfront Park", "transport": "About a 10-minute walk from JR Minami-Otaru Station, or a 7-minute walk from the southern end of Sakaimachi Shopping Street"}, {"address": "2-chome Temiya, Otaru, Hokkaido", "feature": "\u2b50 4.6 stars | Perched on a hill north of the Otaru Canal, Temiya Park is Otaru\u0027s premier spot for cherry blossom viewing and botanical flora. Home to around 700 Yoshino and Ezoyama cherry trees, the hillside transforms into a sea of pink every early May, contrasting brilliantly with the deep blue of Otaru Port and the canal below. The botanical garden features a rich collection of native Hokkaido plants and flowers, complete with a greenhouse and arboretum. From this elevated vantage point, visitors can enjoy sweeping panoramas of the entire canal area and Ishikari Bay.", "name": "Temiya Park \u0026 Botanical Garden", "transport": "Take a Chuo Bus from JR Otaru Station to \u0027Temiya\u0027 stop, then walk uphill for about 10 minutes"}, {"address": "2-chome Tomioka, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Situated on a hill approximately 190 meters above sea level near the foothills behind Otaru Station and the canal district, Asahi Observatory Park is surrounded by lush forests and scenic nature trails. The area is rich in wild bird species and alpine flora, offering refreshing forest walks filled with phytoncides. From the top of the observatory, visitors are rewarded with sweeping views of the Otaru Canal, Sakaimachi historic district, the curving harbor, and Ishikari Bay. At night, it transforms into a romantic vantage point overlooking the shimmering city lights, often likened to a sparkling jewel box.", "name": "Asahi Observatory Park", "transport": "About a 10-minute taxi ride or a 45-minute walk from JR Otaru Station"}, {"address": "4 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.0 stars | Directly adjoining the harbor right in front of the Otaru Canal, Otaru Port Pier 3 Seaside Greenery is an open waterfront green space combining industrial maritime history with coastal nature. Featuring spacious lawns and terraced steps near the water, visitors can relax in the ocean breeze and admire sightseeing boats and Maritime Self-Defense Force vessels docked in the port. It is also one of the prime viewing spots for the Otaru Marine Fireworks Festival, offering expansive views of open skies and ocean right next to the vibrant canal tourist zone.", "name": "Otaru Port Pier 3 Seaside Greenery", "transport": "About a 10-minute walk from JR Otaru Station, adjacent to the Otaru Canal Chuo Bridge area"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "5 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Otaru\u0027s most iconic landmark, excavated in 1923 and lined with quaint, historical red-brick warehouses. The atmosphere is uniquely romantic at dusk when 63 gas lamps light up, casting glowing reflections on the canal\u0027s surface like a step back into a dreamy nostalgic era. The Otaru Snow Light Path Festival held in winter draws countless visitors for unforgettable photos.", "name": "Otaru Canal", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "4-1 Sumiyoshicho, Otaru, Hokkaido", "feature": "\u2b50 4.5 Stars | Housed in a historic red-brick building with the world-famous steam clock standing at its entrance. Spanning three floors, the museum displays tens of thousands of exquisite music boxes ranging from classic woodwork to fine crystal glass. With melodic tunes echoing through the wood-scented hall, it is an absolute must-visit spot on Otaru\u0027s Sakaimachi Street.", "name": "Otaru Music Box Museum Main Hall", "transport": "About a 7-minute walk from JR Minami-Otaru Station"}, {"address": "4-1 Sumiyoshicho, Otaru, Hokkaido", "feature": "\u2b50 4.3 Stars | Located right in front of the Otaru Music Box Museum Main Hall, this large steam clock was crafted by a renowned Canadian clockmaker. Every 15 minutes, it releases puffs of steam and plays a charming five-tone whistle chime, drawing crowds of travelers eager to capture the moment. It\u0027s the most iconic photo hotspot at the Sakaimachi intersection.", "name": "Otaru Steam Clock", "transport": "About a 7-minute walk from JR Minami-Otaru Station"}, {"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 Stars | Renovated from a Meiji-era stone warehouse, this building retains original traces of the old freight railway tracks. Inside, the \u0027Kitaichi Hall\u0027 caf\u00e9 is illuminated by 167 traditional oil lamps, creating a magical, romantic ambience. The signature 8-layered rainbow soft-serve ice cream is also a wildly popular treat for photos.", "name": "Kitaichi Glass Sangokan", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "1-1 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.0 Stars | A charming food alley recreating Taisho-era streetscapes, featuring a central fire-watch tower observatory that offers bird\u0027s-eye views of the Otaru Canal. Packed with food stalls offering seafood bowls, fried chicken, takoyaki, and more, it exudes retro nostalgia and takes on an extra enchanting vibe when illuminated at night.", "name": "Otaru Denuki Koji", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "1-2-17 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Housed in the renovated Former Takahashi Warehouse, this museum displays authentic stained-glass windows from late 19th to early 20th-century British churches. The vibrant light filtered through the glass fills the historic space with a solemn yet magnificent artistic atmosphere\u2014a must-visit indoor photo spot for art lovers and photography enthusiasts.", "name": "Otaru Art Base Stained Glass Museum", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | A flagship Otaru location of Hokkaido\u0027s legendary confectionery brand \u0027Rokkatei,\u0027 set inside a historic stone warehouse. The second floor offers a sleek, cozy lounge serving freshly made cream puffs alongside complimentary fragrant coffee. Both the interior and exterior radiate an elegant artistic vibe, making it a favorite spot to relax, enjoy sweets, and snap photos.", "name": "Rokkatei Otaru Canal Shop", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Located right next to Rokkatei, this famous sweet shop also boasts a classic Meiji-era aesthetic. It is celebrated for its famous \u0027Yousei no Mori\u0027 Baumkuchen and the exclusive giant \u0027Yume Fushigi\u0027 cream puffs. Featuring lofty ceilings and rich stone architecture, it is a prime hub for shopping and photo-taking along Sakaimachi Street.", "name": "Kitakaro Otaru Main Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}], "name": "Popular Photo Spots"}}, "name": "Otaru Canal and Sakaimachi Street"}, "sapporo_station_odori": {"categories": {"cat_1": {"items": [{"address": "Kita 1-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | The Sapporo Clock Tower is one of the most iconic historical landmarks in downtown Sapporo. Built in 1878 (Meiji 11), it originally served as the military drill hall for the former Sapporo Agricultural College (now Hokkaido University). This two-story American-style wooden building holds immense historical value. The large clock on the roof has been chiming continuously for the citizens of Sapporo since 1881, and its clear chime was selected as one of the \u0027100 Soundscapes of Japan.\u0027 The first floor houses an exhibition room detailing the building\u0027s architectural history and the pioneering story of the college. The second floor recreates the spacious hall of the former drill hall and displays the inner workings of the American-made mechanical clock mechanism, allowing visitors to immerse themselves in a charming, nostalgic Meiji-era atmosphere.", "name": "Sapporo Clock Tower", "transport": "About a 5-minute walk from the City Hall exit of Odori Station (Subway Namboku, Tozai, and Toho Lines), or a 10-minute walk from the South Exit of JR Sapporo Station."}, {"address": "Kita 3-jo Nishi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Affectionately known by locals as the \u0027Red Brick Office,\u0027 the Former Hokkaido Government Office Building was constructed in 1888 and is an elegant Neo-Baroque red-brick structure. Built using approximately 2.5 million red bricks, it symbolizes Hokkaido\u0027s glorious pioneering history and has been designated an Important Cultural Property of Japan. Inside, visitors can explore extensive archives on Hokkaido\u0027s history, Sakhalin-related historical documents, and recreated historic rooms like the former Governor\u0027s Office. Outside, expansive and beautiful Japanese and Western gardens offer distinct seasonal views: blooming cherry blossoms in spring, lush greenery in summer, vibrant ginkgo and maple foliage in autumn, and a picturesque snowscape in winter. It is an unmissable classic landmark for taking memorable photos in Sapporo.", "name": "Former Hokkaido Government Office Building (Red Brick Office)", "transport": "About an 8-minute walk from the South Exit of JR Sapporo Station, or a 9-minute walk from Odori Station (Subway Namboku Line)."}, {"address": "Odori Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Standing tall at the eastern end of Odori Park, the 147.2-meter Sapporo TV Tower was built in 1957 and serves as one of downtown Sapporo\u0027s most striking landmarks where history meets modernity. Designed by the famous architect Tach\u016b Nait\u014d (who also designed Tokyo Tower), it has quietly watched over the city\u0027s growth for decades. Take the high-speed elevator to the 90-meter-high observation deck for a breathtaking 360-degree panoramic view of downtown Sapporo and the ever-changing seasonal scenery of Odori Park. It is particularly magnificent during the winter \u0027Sapporo Snow Festival\u0027 and \u0027White Illumination,\u0027 when you can gaze down at brilliant lights and delicate snow sculptures. The tower also houses souvenir shops and specialty restaurants, making it a must-visit spot blending historical significance with sightseeing value.", "name": "Sapporo TV Tower", "transport": "Direct access from Exit 27 of Odori Station (Subway Toho, Namboku, and Tozai Lines)."}, {"address": "Odori Nishi 13-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Located at the far western end of Odori Park (Nishi 13-chome), the Sapporo City Archive Hall was originally built in 1926 (Taisho 15) as the Sapporo Court of Appeal (High Court). This grand and solemn Neo-Romanesque building, constructed with locally quarried Sapporo soft stone and red brick, is registered as a National Tangible Cultural Property of Japan. Inside, it preserves the original courtroom structure and historical exhibition rooms, alongside a memorial hall dedicated to the famous manga artist and painter Hiroshi Ohba, as well as art gallery spaces open to citizens and local artists. The exterior\u0027s elegant arches and stone carvings, paired with serene surrounding gardens, embody the unique architectural aesthetic and rich cultural ambiance of the Taisho era.", "name": "Sapporo City Archive Hall", "transport": "About a 5-minute walk from Exit 1 of Nishi 11-Chome Station (Subway Tozai Line)."}, {"address": "Kita 2-jo Higashi 6-chome, Chuo-ku, Sapporo, Hokkaido (Inside Nagayama Memorial Park)", "feature": "\u2b50 4.3 stars | Built around 1880, the Former Nagayama Takeshiro Residence was once the private estate of Lieutenant General Takeshiro Nagayama, the second Director-General of the Hokkaido Government and commander of the Tondenhei (pioneer troops). The building\u0027s defining feature is its harmonious blend of traditional Japanese wooden residential design and Western-style architecture, showcasing the iconic \u0027eclectic Japanese-Western\u0027 (Wayo-sechou) style of the Meiji period. The Western wing features elegant window frames and green exterior walls, while the Japanese wing preserves delicate tatami rooms and peaceful garden views. Annexed with the adjacent former Mitsubishi Mining Dormitory in the early Showa period, it is now open free to the public. It also houses an atmospheric vintage cafe where visitors can enjoy food and drink while experiencing the noble aesthetic of Hokkaido\u0027s early pioneering days.", "name": "Former Nagayama Takeshiro Residence", "transport": "About an 8-minute walk from Exit 10 of Bus Center-Mae Station (Subway Tozai Line)."}, {"address": "Minami 2-jo Higashi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Established in 1878 (Meiji 11), Hokkaido Shrine Tongu is an ancient shrine located on the eastern side of downtown Sapporo\u0027s Odori commercial area, serving as an enclave (temporary shrine/sub-shrine) of the main Hokkaido Shrine. Originally built because traveling to Hokkaido Shrine in Maruyama was difficult due to deep snow in winter, it allowed citizens easy access for worship. The shrine enshrines the Three Pioneering Deities and Emperor Meiji, and is famous for blessings in matchmaking, safe childbirth, and marital harmony. A pair of stone guardian lions (Komainu) stands at the entrance; legend has it that touching them brings good interpersonal relationships and romantic luck. Quiet and rustic, it is a rare historic sanctuary of peace and spirituality in the bustling city center.", "name": "Hokkaido Shrine Tongu", "transport": "About a 3-minute walk from Exit 6 of Bus Center-Mae Station (Subway Tozai Line)."}, {"address": "Kita 7-jo Nishi 7-chome, Kita-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 stars | Built in 1880 (Meiji 13), Seikatei was constructed by the Kaitakushi (Hokkaido Development Commission) of the Meiji government as a VIP reception venue and resting place for Emperor Meiji during his inspection tour of Hokkaido. This exquisite building is compact yet elegant, seamlessly blending Japanese wooden architecture with modern Western architectural details, such as Western arched windows paired with Japanese landscaping. Situated in a quiet park north of Sapporo Station, Seikatei is surrounded by lush trees and clear streams, exuding a strong early Meiji pioneer atmosphere. The interior retains the original red star emblem of the Kaitakushi and rustic decor. Free and open to the public, it is a hidden cultural gem for learning about Sapporo\u0027s early urban development and exquisite architectural craftsmanship.", "name": "Seikatei", "transport": "About a 10-minute walk from the West Exit of JR Sapporo Station."}, {"address": "Kita 1-jo Higashi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Founded in 1904 (Meiji 37) and situated beside Soseigawa Park, the Sapporo Church of the United Church of Christ in Japan is a Gothic stone church built entirely from local \u0027Sapporo soft stone.\u0027 Featuring a distinctive pointed belfry, intricate rose windows, and heavy stone walls, its rigorous structure and majestic solemnity perfectly showcase the outstanding skill of late Meiji Western-style stone architecture. It is registered as an Important Cultural Property of Japan. The church is closely tied to the spiritual legacy of Dr. William S. Clark of Sapporo Agricultural College (the predecessor of Hokkaido University), bearing witness to the spread of Christianity during Hokkaido\u0027s pioneer era. At sunset, the stone exterior casts a deep, quiet historical atmosphere under the changing light and shadow, making it one of the most touching historic sights along the Sosei River.", "name": "Sapporo Church, United Church of Christ in Japan", "transport": "About a 3-minute walk from Bus Center-Mae Station (Subway Tozai Line), or a 7-minute walk from Odori Station."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Kita 1-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaid
