Hokkaido", "feature": "\u2b50 4.2 stars | Founded in 1902, Hokkaido Gokoku Shrine honors the Tondenhei pioneers and fallen soldiers who gave their lives for the nation during the development of Hokkaido. Set on expansive grounds surrounded by dense, lush woods, the shrine radiates a serene and solemn atmosphere. Every year in early June, it hosts the grand \u0027Hokkaido Gokoku Shrine Annual Festival,\u0027 featuring portable shrine (mikoshi) processions and vibrant street food stalls that draw crowds of local residents. The massive torii gate along the approach and the timeless shrine architecture beautifully showcase traditional Japanese aesthetic design.", "name": "Hokkaido Gokoku Shrine", "transport": "Take a bus from JR Asahikawa Station to \u0027Gokoku Jinja-mae\u0027 stop; the shrine is right outside."}, {"address": "2-1 Kaguraoka Park, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Nestled inside Kaguraoka Park south of downtown Asahikawa, Kamikawa Shrine was established in 1893 (Meiji 26) and stands as one of the oldest and grandest shrines in the region. Dedicated to the sun goddess Amaterasu and the three pioneering deities of Hokkaido, it is revered as the guardian shrine of Asahikawa. Built in classic Shinmei-zukuri architectural style, the tranquil approach is shaded by towering ancient trees. Beautiful in every season, it features vibrant cherry blossoms in spring and vivid autumn leaves in fall, making it a beloved sanctuary for local New Year visits (Hatsumode), Shichi-Go-San ceremonies, and traditional weddings.", "name": "Kamikawa Shrine", "transport": "About a 15-minute walk from JR Kaguraoka Station, or take a bus from JR Asahikawa Station to \u0027Kamikawa Jinja-bashi\u0027 stop and walk 5 minutes."}, {"address": "17-chome-migi 1-go, Miyashitadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Founded in 1899 (Meiji 32), Takasago Sake Brewery is one of Asahikawa\u0027s oldest surviving sake producers. Its iconic \u0027Meiji Storehouse\u0027 (Meiji Zoko) was built during the late Meiji period and features classic white-plastered storehouse (dozuri) architecture with a nostalgic merchant-house charm. Famous for producing the legendary sake \u0027Kokushimuso\u0027, the brewery retains traditional craft methods while offering visitors a historical tool exhibit, a retail shop, and a free tasting area. Guests can sample premium sake crafted with pure Daisetsuzan meltwater, as well as unique sake lees ice cream, all inside a century-old historic setting.", "name": "Takasago Sake Brewery Meiji Storehouse", "transport": "About a 15-minute walk or 5-minute taxi ride from JR Asahikawa Station."}, {"address": "1-33 Nagayama 2-jo 7-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | Otokoyama is a world-renowned Japanese sake brand whose museum seamlessly combines brewing history with elegant architecture. The museum displays Edo-period ukiyo-e woodblock prints by Utagawa-school masters such as Hiroshige Ando, ancient manuscripts, and antique brewing tools, reflecting nearly 350 years of sake-brewing heritage. Outside, a lovely Japanese garden displays seasonal beauty\u2014cherry blossoms in spring and natural snow storage rooms in winter. Visitors and locals alike also flock to the outdoor spring to fill their bottles with free, ultra-pure Daisetsuzan mountain water.", "name": "Otokoyama Sake Brewery Museum", "transport": "Take the Dohoku Bus from JR Asahikawa Station to \u0027Otokoyama Shuzo-mae\u0027 stop, then walk about 2 minutes."}, {"address": "3-30 Miyamae 1-jo 3-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | This unique red-brick complex originally served as the Hokkaido Government Railway\u0027s \u0027Asahikawa Locomotive Depot\u0027 (train maintenance shop and warehouse), built in 1898 (Meiji 31). Expertly restored by the city, it creatively blends century-old red brick structures with modern steel framing to form the vibrant civic activity center, CoCoDe. The exterior preserves strong Meiji and Taisho-era industrial heritage traits\u2014with time-worn brick walls towering high\u2014while the interior features art exhibition spaces, lecture halls, and a cozy caf\u00e9, exemplifying a classic blend of historic railway preservation and community revitalization.", "name": "Asahikawa Citizen Activity Center CoCoDe (Former National Railway Asahikawa Locomotive Depot)", "transport": "About a 10-minute walk from the South Exit of JR Asahikawa Station."}, {"address": "2-15 Kagura 7-jo 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Tucked inside the \u0027Freezing Point Forest\u0027 of Kaguraoka Park, this museum\u0027s warm, modern cylindrical architecture blends harmoniously into its surrounding woods. Built to honor Ayako Miura\u2014the legendary Asahikawa-born author of the famous novel \u0027Freezing Point\u0027\u2014the museum was largely funded by donations from readers across Japan. Inside, visitors can view original manuscripts, a replica of her personal study, and personal letters. Large floor-to-ceiling windows allow guests to take in the changing forest scenery while immersing themselves in literary history, creating an atmosphere steeped in warmth and culture.", "name": "Miura Ayako Literature Museum", "transport": "Take a bus from JR Asahikawa Station to \u0027Kagura 4-jo 7-chome\u0027 stop, then walk about 5 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Inside Tokiwa Park, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | Located inside the beautiful Tokiwa Park, this museum serves as Asahikawa\u0027s premier hub for art and culture. It primarily showcases woodcrafts, modern sculptures, and paintings deeply connected to Hokkaido and Asahikawa. Beyond housing exceptional local artwork, the museum frequently hosts special exhibitions blending nature with contemporary aesthetics, allowing visitors to immerse themselves in rich artistic culture amid the ever-changing seasonal greenery of the park.", "name": "Hokkaido Asahikawa Museum of Art", "transport": "Approx. 15-minute walk from JR Asahikawa Station, or take a city bus to \u0027Tokiwa Koen\u0027 stop."}, {"address": "5-jo 7-chome, Shunko, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Named after Teijiro Nakahara, a pioneer of modern Japanese sculpture born in Asahikawa, this museum is housed in a historically valuable Meiji-era red-brick Western-style building\u2014formerly the Old Army Officers\u0027 Club. The museum exhibits outstanding modern Japanese sculptures alongside Nakahara\u0027s representative masterpieces, allowing visitors to simultaneously soak in nostalgic historical architecture and the striking impact of 3D art.", "name": "Teijiro Nakahara Memorial Asahikawa Museum of Sculpture", "transport": "Take a Dohoku Bus from JR Asahikawa Station to \u0027Chokoku Bijkutsukan Iriguchi\u0027 stop, then walk about 5 minutes."}, {"address": "2-15, 7-jo 8-chome, Kagura, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Dedicated to Ayako Miura, author of the famed Japanese novel \u0027Freezing Point,\u0027 this literary museum is nestled within the poetic Mihonrin Forest. It preserves her original manuscripts, a replica of her study, and detailed exhibitions on her life\u0027s journey. Framed by towering Scots pines and fir trees, the building harmonizes seamlessly with the natural surroundings, offering a serene sanctuary to contemplate life, love, and faith.", "name": "Ayako Miura Literature Museum", "transport": "Approx. 20-minute walk from JR Asahikawa Station, or take a bus to \u0027Kagura 4-jo 8-chome\u0027 stop and walk about 5 minutes."}, {"address": "3-jo 7-chome, Kagura, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Located inside the Taisetsu Crystal Hall, this comprehensive museum offers immense educational and cultural value. It provides an in-depth look into the traditional lifestyle, unique culture, and heritage crafts of Hokkaido\u0027s indigenous Ainu people, featuring realistic full-scale house replicas. The museum also chronicles Asahikawa\u0027s rich historical evolution from ancient natural environments to modern development, making it an unmissable destination to understand the region\u0027s past and present.", "name": "Asahikawa City Museum", "transport": "Approx. 10-minute walk from the South Exit of JR Asahikawa Station."}, {"address": "Shunkocho, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | Dedicated to preserving the legacy of the Tondenhei (pioneer troops) and the Imperial Japanese Army\u0027s 7th Division, this museum displays a rich collection of artifacts and historical records from Hokkaido\u0027s pioneer era and modern military history. Knowledgeable and passionate volunteer guides bring history to life through vivid exhibits and actual equipment, giving visitors a deep appreciation of how early settlers braved harsh winters to build the thriving city of Asahikawa today.", "name": "Hokuchin Memorial Museum", "transport": "Take a bus from JR Asahikawa Station to \u0027Jieitai-mae\u0027 stop, located right at the stop."}, {"address": "1-2 Kaguraoka Park, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | A literary museum commemorating the giant of Japanese literature, Yasushi Inoue. Born in Asahikawa, Inoue gained international renown with masterpiece novels like \u0027Tun-huang\u0027 and \u0027The Roof Tile of Tempyo.\u0027 The museum showcases his prolific writing career, manuscript drafts, personal collections, and a replica of his Tokyo study. The Japanese-style architecture and serene garden scenery complement each other beautifully, making it a peaceful sanctuary for literary enthusiasts.", "name": "Yasushi Inoue Memorial Hall", "transport": "Take a bus from JR Asahikawa Station to \u0027Kaguraoka Koen\u0027 stop, then walk about 3 minutes."}, {"address": "1-10, 10-jo 2-chome, Nagayama, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Asahikawa is renowned as one of Japan\u0027s top cities for woodworking and furniture design, and the Asahikawa Design Center is the ultimate showroom for this proud heritage. It exhibits and sells exquisite creations from over 30 top local wooden furniture brands, seamlessly blending modern functional aesthetics with fine Hokkaido craftsmanship. Here, visitors can touch the warm wood grains and feel the craftsmen\u0027s ultimate devotion to natural timber and living space design.", "name": "Asahikawa Design Center", "transport": "Approx. 10-minute walk from JR Minami-Nagayama Station, or take a bus from JR Asahikawa Station to \u0027Nagayama 10-jo 2-chome\u0027 stop."}, {"address": "7-jo Dori 8-chome Migi 1, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | With a long history, Asahikawa Church is an iconic Gothic-style church in the city center. Its elegant spire and dignified exterior stand out prominently amidst the cityscape, while the interior features beautiful stained glass windows that cast colorful light patterns when sunlight filters through. Serving as a peaceful haven for local worshippers, its solemn architectural beauty and tranquil atmosphere also draw visitors interested in historic religious landmarks.", "name": "Asahikawa Church, United Church of Christ in Japan", "transport": "Approx. 12-minute walk from JR Asahikawa Station."}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kuranuma, Higashiasahikawa-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.2 stars | Adjacent to the famous Asahiyama Zoo, Asahiyama Park is one of Asahikawa\u0027s premier spots for cherry blossom and autumn foliage viewing. Located at the foot of Mount Asahi, the park is home to about 3,500 Ezo mountain cherry trees. In spring, the entire hillside turns a breathtaking shade of pink, with evening illuminations creating a magical night sakura scene. In autumn, it transforms into a stunning landscape of vibrant red leaves, offering sweeping views of downtown Asahikawa and the Daisetsuzan Mountain Range. It is the perfect place to experience the changing beauty of all four seasons.", "name": "Asahiyama Park", "transport": "Take the Asahikawa Denki K\u8ecc/Electric Railway Bus (Asahiyama Zoo Line) from JR Asahikawa Station, get off at \u0027Asahiyama Zoo\u0027 stop, and walk about 5 minutes."}, {"address": "Kaguraoka Park, Asahikawa City, Hokkaido", "feature": "\u2b50 4.3 stars | Situated alongside the Chubetsu River, Kaguraoka Park is an expansive urban park preserving Hokkaido\u0027s primeval forest ecosystem. The park contains precious century-old trees, including Sakhalin spruce, Mizunara oak, and white birch. Spring brings a blanket of wildflowers and cherry blossoms, while autumn covers the ground in golden and crimson leaves. A major highlight for visitors is spotting wild Ezo chipmunks and diverse bird species along the quiet wooden boardwalks. The park also features a campsite, wooden playground equipment, and Kaguraoka Shrine, offering a rich blending of natural and cultural charm.", "name": "Kaguraoka Park", "transport": "Take a local city bus from JR Asahikawa Station for about 10 minutes to \u0027Kaguraoka Park\u0027 stop, or walk about 15 minutes from Kaguraoka Station."}, {"address": "Tokiwa Park, Asahikawa City, Hokkaido", "feature": "\u2b50 4.2 stars | Opened in 1910, Tokiwa Park is Asahikawa\u0027s oldest park and is recognized as one of the \u0027Top 100 Urban Parks in Japan.\u0027 Located in the heart of the city, it features the spacious Chidori Pond, where visitors can rent rowboats to glide across the water while admiring weeping willows and seasonal flowers along the shore. The park also serves as a cultural hub, housing the Hokkaido Asahikawa Museum of Art and the Kawamura Kaneto Ainu Museum. From spring cherry blossoms and summer greenery to autumn leaves and winter snowscapes, Tokiwa Park provides an elegant urban oasis for locals and travelers alike.", "name": "Tokiwa Park", "transport": "About a 15-minute walk from JR Asahikawa Station, or take a city bus and get off at the \u0027Tokiwa Koen-mae\u0027 stop."}, {"address": "119-48, Nagayama 10-jo 24-chome, Asahikawa City, Hokkaido", "feature": "\u2b50 4.5 stars | Created by renowned Japanese garden designer Sayuki Ueno, Ueno Farm is a celebrated \u0027Hokkaido Style Garden\u0027 and one of Asahikawa\u0027s most famous natural attractions. Blending the relaxed romance of English gardens with Hokkaido\u0027s unique climate and flora, it features thematic areas such as \u0027Sagittarius Hill,\u0027 \u0027Birch Path,\u0027 and \u0027Mirror Border.\u0027 From spring tulips and daffodils to vibrant summer perennials, every season offers spectacular floral landscapes. The farm also houses the cozy NAYA Cafe, where visitors can enjoy afternoon tea and Hokkaido fresh milk soft-serve ice cream surrounded by delicate floral scents.", "name": "Ueno Farm", "transport": "About a 10-minute taxi ride from JR Nagayama Station, or take the Dohoku Bus (Ueno Farm Line) directly from JR Asahikawa Station."}, {"address": "Arashiyama, Etanbetsu-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.1 stars | Perched on a hill in the western outskirts of Asahikawa, Arashiyama Lookout Park is named after its striking resemblance to Kyoto\u0027s Arashiyama. Its elevated observation deck offers a stunning 360-degree panoramic view of the Asahikawa Basin, the Ishikari River junction, and the majestic Daisetsuzan Mountain Range in the distance, especially dramatic at sunrise and dusk. The park also encompasses the \u0027Northern Coniferous Forest Botanical Garden\u0027 and \u0027Northern Wild Grass Garden,\u0027 featuring hundreds of plant species native to Hokkaido\u2014making it a wonderful spot for hiking, night photography, and botanical exploration.", "name": "Arashiyama Lookout \u0026 Park", "transport": "About a 10-minute drive from JR Chikabumi Station, or a 25-minute drive from JR Asahikawa Station to the summit parking lot."}, {"address": "Riverbanks extending from Kagura 1-jo to the Toko area, Asahikawa City, Hokkaido", "feature": "\u2b50 4.3 stars | Stretching along both banks of the Chubetsu River running through downtown Asahikawa, Chubetsu River Green Space Park is a scenic ribbon park. Featuring well-maintained walking and cycling paths, it is a favorite local spot for exercise and leisurely strolls. Walking along the river offers grand vistas of flowing water framed by the snow-capped Daisetsuzan Mountains in the background. In spring, blooming cherry trees along the riverbanks combine with blue skies and distant snow peaks into a picturesque vista, while winter wraps the shores in pristine snow, revealing Hokkaido\u0027s tranquil, serene beauty.", "name": "Chubetsu River Green Space Park", "transport": "Exit from the South Exit of JR Asahikawa Station and walk directly to the Chubetsu River green space."}, {"address": "3-chome, Hanasaki-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.0 stars | Located in northern Asahikawa, Hanasaku Park is a large comprehensive park combining natural landscapes with athletic facilities. It features diverse tree species and vibrant flowerbeds, with its spring cherry blossoms and early summer European rose garden being the main highlights. The spacious grounds house the Asahikawa Hanasaku Baseball Stadium, an athletics field, and family-friendly playground areas. Strolling through the shaded tree-lined avenues offers a glimpse into the vibrant daily life and relaxed pace of Asahikawa locals, making it a great destination to escape the crowds and enjoy tranquil greenery.", "name": "Hanasaku Park", "transport": "Take a city bus (bound for Hanasaki-cho) from JR Asahikawa Station and get off at \u0027Hanasaki-cho 3-chome\u0027 or \u0027Hanasaku Koen-mae\u0027 stop."}, {"address": "27-chome, Chikabumi-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.2 stars | Nestled in the hilly terrain of northern Asahikawa, Shunkodai Park is one of the city\u0027s largest natural forest parks. Preserving rich native woodlands and natural topography, the park features miles of forest walking trails, a natural campsite, large wooden adventure playground equipment, and birdwatching areas. In autumn and winter, the hills are blanketed in dazzling shades of gold and deep crimson from maples and Japanese larches. It is an ideal spot for outdoor enthusiasts, campers, and picnickers to connect with nature and experience the forest charm of Asahikawa.", "name": "Shunkodai Park", "transport": "Take the Dohoku Bus from JR Asahikawa Station, get off at \u0027Shunkodai Park\u0027 stop, and walk about 5 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Kuranuma, Higashiasahikawa-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.6 stars | One of Japan\u0027s northernmost and most popular zoos, world-famous for its unique \u0027behavioral exhibition\u0027 concept. The zoo features thoughtfully designed transparent cylindrical glass tanks, sky tunnels, and viewing glass, allowing visitors to observe the animals\u0027 natural behaviors up close. Among the highlights, the winter-exclusive \u0027Penguin Walk\u0027 is a globally famous photo op, featuring King Penguins waddling in formation across the snow in an incredibly adorable display. Other highlights include the \u0027Seal House,\u0027 where you can watch seals swim through vertical glass tubes, the \u0027Polar Bear House,\u0027 offering up-close views of swimming polar bears, and the \u0027Wolf Forest,\u0027 where northern wolves howl. Every corner offers a fantastic opportunity to capture precious moments and take memorable photos.", "name": "Asahiyama Zoo", "transport": "Take the Asahikawa Denki K\u8ecc (Asahikawa Electric Railway) Bus from Bus Stop No. 6 outside the East Exit of JR Asahikawa Station; approx. 40 minutes direct to the Asahiyama Zoo terminal."}, {"address": "Between Miyashita-dori and 8-jo-dori, Asahikawa City, Hokkaido", "feature": "\u2b50 4.0 stars | Established in 1972, this is Japan\u0027s first permanent pedestrian shopping street. Extending 1 km from JR Asahikawa Station, the street is lined with department stores, specialty restaurants, cozy cafes, and exquisite local craft shops. Every winter, the pedestrian avenue transforms into a magical boulevard of light with \u0027Asahikawa Winter Festival\u0027 events and dazzling illuminations; in summer, it bustles with energy during open-air beer festivals and street performances. Adorned with creative sculptures and public seating, strolling here lets you experience local daily life while capturing great photos of Hokkaido\u0027s urban charm and retro streetscapes.", "name": "Heiwa Dori Shopping Park", "transport": "Located right outside the North Exit of JR Asahikawa Station."}, {"address": "4-chome-119-48 Nagayama 11-jo, Asahikawa City, Hokkaido (Inside Powers Shopping Center)", "feature": "\u2b50 4.1 stars | Bringing together 8 of Asahikawa\u0027s most iconic and famous soy sauce (shoyu) ramen shops, this is a must-visit landmark for foodies and photo enthusiasts alike. Decorated with rich Showa-era retro nostalgia, the exterior features vibrant, oversized ramen bowl installations and murals, drawing countless visitors for photo ops. Inside, there is a fun \u0027Ramen Shrine\u0027 dedicated to gods symbolizing deliciousness and good fortune. Visitors can sample rich soy sauce ramen made from a double broth of pork bone and seafood across different legendary shops. Mini-sized bowls are available so you can try multiple flavors in one trip, making it a classic spot combining culinary delight with photo fun.", "name": "Asahikawa Ramen Village", "transport": "About an 8-minute walk from JR Minami-Nagayama Station; or take a Dohoku Bus from JR Asahikawa Station to the \u0027Powers Alpha Bldg.\u0027 stop and walk from there."}, {"address": "16-chome-186-2 Nagayama-cho, Asahikawa City, Hokkaido", "feature": "\u2b50 4.4 stars | Designed by renowned garden designer Sayuki Ueno, this Hokkaido-style English garden is a highlight of the Hokkaido Garden Path. It skillfully blends English cottage gardening with Hokkaido\u0027s unique climate, creating dreamlike landscapes bursting with seasonal colors. The garden is divided into themed areas such as the \u0027Gnome\u0027s Forest,\u0027 \u0027Birch Path,\u0027 and \u0027Sagittarius Hill,\u0027 blooming with tulips, roses, lilies, and various perennials. The most famous photo spots are the \u0027Rainbow Stairs\u0027 and \u0027Sky Swing\u0027 at the top of the hill, offering sweeping panoramic views of the garden and Asahikawa\u0027s vast countryside\u2014perfect for capturing whimsical, fairytale-like photos.", "name": "Ueno Farm", "transport": "About a 15-minute walk from JR Sakuragoka Station; or take Dohoku Bus (Routes 70 or 71) from JR Asahikawa Station and get off at the \u0027Ueno Farm\u0027 stop."}, {"address": "1-3 Miyamae 1-jo, Asahikawa City, Hokkaido (Directly connected to JR Asahikawa Station South Exit)", "feature": "\u2b50 4.3 stars | A modern urban oasis adjacent to JR Asahikawa Station, stretching along the Chubetsu River and seamlessly integrating a city transit hub with natural landscapes. Designed by prominent landscape architects, the garden is home to over 300 species of native Hokkaido flora and trees that change colors dramatically with the seasons. Vast green lawns, winding boardwalks, and the grand Daisetsuzan mountain range in the background create breathtaking views, making it a hidden gem for photographers capturing snowy peaks and mirror-like pool reflections. The garden also features a stylish greenhouse cafe, where sipping coffee by floor-to-ceiling windows offers a highly popular aesthetic photo experience.", "name": "Kitasaito Garden Asahikawa", "transport": "Directly accessible from the South Exit of JR Asahikawa Station."}, {"address": "Tokiwa Park, Asahikawa City, Hokkaido", "feature": "\u2b50 4.2 stars | Opened in 1916, Tokiwa Park is Asahikawa\u0027s oldest and most iconic comprehensive urban park, selected as one of the \u0027Top 100 Urban Parks in Japan.\u0027 At its center lies the serene \u0027Hakucho (Swan) Pond,\u0027 offering picturesque lakeside scenery year-round\u2014cherry blossoms bloom in spring, while vibrant golden ginkgo and red maple leaves reflect beautifully on the water in autumn. The park houses numerous famous sculpture art pieces, alongside the Hokkaido Asahikawa Museum of Art and the Asahikawa Civic Hall, exuding a rich cultural vibe. Whether rowing a boat across the pond or strolling beneath ancient tree canopies, you can snap charming, vintage Japanese-style photos.", "name": "Tokiwa Park", "transport": "About a 15-minute walk from JR Asahikawa Station; or take a city bus and get off at the \u0027Tokiwa Kouen-mae\u0027 stop."}, {"address": "7-chome-1-33 Nagayama 2-jo, Asahikawa City, Hokkaido", "feature": "\u2b50 4.3 stars | Otokoyama is a legendary name in the world of Japanese sake, and its Brewery Museum is a popular landmark combining historical culture, sake tasting, and exquisite gardens. The museum exhibits ancient sake-brewing tools dating back to the Edo period, ukiyo-e woodblock prints, and precious historical artifacts, guiding visitors through time to appreciate the deep heritage of Japanese sake culture. The traditional Japanese garden blends dry landscape (Karesansui) and stroll-garden styles, remaining picture-perfect year-round; in winter, impressive ice fall sculptures draw crowds of photo-seekers. Visitors can also sample and snap photos with the free-flowing \u0027Longevity Spring Water,\u0027 sourced from the snowmelt of Mount Daisetsu.", "name": "Otokoyama Sake Brewery Museum", "transport": "Take a Dohoku Bus (bound for Nagayama) from JR Asahikawa Station for about 20 minutes, get off at \u0027Nagayama 2-jo 6-chome\u0027, and walk about 2 minutes."}, {"address": "2-chome-1-10 Nagayama 10-jo, Asahikawa City, Hokkaido", "feature": "\u2b50 4.4 stars | Asahikawa is renowned as the home of Japan\u0027s finest woodworking and furniture craftsmanship, and this Design Center is the flagship gallery showcasing the supreme aesthetic of \u0027Asahikawa Furniture\u0027 and modern living design. Bringing together dozens of top local woodworking brands and emerging designers, the spacious showroom features warm, textured, minimalist Nordic-style living spaces. Exquisite wooden crafts, beautifully contoured chairs, and artistic lighting design turn the entire space into an aesthetic museum, attracting design lovers and lifestyle enthusiasts for inspiration and photos. The center also houses a chic cafe and a curated shop selling stylish handcrafted wooden items.", "name": "Asahikawa Design Center", "transport": "About a 10-minute walk from JR Minami-Nagayama Station; or take a Dohoku Bus from JR Asahikawa Station and get off at \u0027Nagayama 10-jo 2-chome\u0027."}], "name": "Popular Photo Hotspots"}}, "name": "Downtown Asahikawa and Asahiyama Zoo"}, "furano_biei": {"categories": {"cat_1": {"items": [{"address": "4-Chome-1-1 Higashimachi, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.4 stars | Biei Shrine is one of Hokkaido\u0027s renowned sacred shrines, featuring architecture that showcases elegant wooden craftsmanship and traditional Japanese aesthetics. Hidden throughout the main hall are \u0027Inshin\u0027 (heart-shaped) decorative patterns, said to bring good fortune and love to those who find them. Surrounded by beautiful seasonal scenery\u2014especially stunning in autumn foliage and winter snow\u2014it is a popular landmark in the Furano-Biei area combining historical faith and architectural art.", "name": "Biei Shrine", "transport": "About a 15-minute walk or a 3-minute taxi ride from JR Biei Station"}, {"address": "Takushin, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.3 stars | Established in 1987 by master landscape photographer Shinzo Maeda, Takushinkan was converted from the abandoned Biei Town Chiyoda Elementary School building. It stands as a classic architectural landmark blending local historical school repurposing with fine art photography. The museum permanently displays iconic photographs capturing the four seasons of Biei\u0027s hills. Featuring a simple, warm wooden schoolhouse design, it is framed by a lush white birch forest trail, creating a rich artistic and historic ambiance.", "name": "Takushinkan Photography Museum", "transport": "About a 15-minute drive or taxi ride from JR Biei Station"}, {"address": "11-17 Wakamatsucho, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | Founded in the Meiji period, Furano Shrine carries deep religious and historical significance tied to the pioneering history of Furano. Its serene wooden shrine building creates a solemn atmosphere. Every summer, the Furano Shrine Annual Festival attracts many locals and tourists, showcasing rich traditional culture through its portable shrine (mikoshi) procession. Surrounded by towering ancient trees, it is a serene spot to reflect on local history and Shinto culture.", "name": "Furano Shrine", "transport": "About a 12-minute walk from JR Furano Station"}, {"address": "Nakagoryo, Furano, Hokkaido (Grounds of Shin Furano Prince Hotel)", "feature": "\u2b50 4.4 stars | Located next to the Shin Furano Prince Hotel, this magical log cabin village was supervised and designed by renowned playwright So Kuramoto, inspired by the forest elves from his writings. Interconnected by wooden boardwalks, 15 cozy log cabins hide among virgin coniferous trees, each housing handicraft shops that celebrate natural materials and traditional craftsmanship. As warm yellow lights illuminate the village at twilight, it transforms into a fairytale-like architectural hidden gem.", "name": "Ningel Terrace", "transport": "About a 10-minute bus or taxi ride from JR Furano Station"}, {"address": "Higashi 4-sen Kita 26-go, Kamifurano, Sorachi District, Hokkaido", "feature": "\u2b50 4.3 stars | Perched on the hills of Kamifurano, the Goto Sumio Museum of Art is a modern classical architectural masterpiece dedicated to displaying the works of master Japanese painter Sumio Goto. The building seamlessly blends sleek contemporary lines with traditional Japanese aesthetics, featuring large floor-to-ceiling windows offering sweeping views of the Tokachi Mountain Range. It also features a fine dining restaurant utilizing local Hokkaido ingredients, making it an elegant landmark uniting visual arts, history, and architectural design.", "name": "Goto Sumio Museum of Art", "transport": "About a 5-minute drive or taxi ride from JR Kamifurano Station"}, {"address": "2-Chome Omachi, Kamifurano, Sorachi District, Hokkaido", "feature": "\u2b50 4.1 stars | Built during the Taisho era, this historic building was once the home of Teijiro Yoshida, a key figure in Kamifurano\u0027s development. It reflects a unique \u0027Taisho Roman\u0027 architectural style that blends Western influences with traditional Japanese design. On display are farming tools, daily necessities, and historical documents from the Meiji and Taisho periods, chronicling the century-long history of Furano\u0027s transformation from wilderness to vibrant flower fields.", "name": "Kamifurano Pioneer Museum (Former Yoshida Residence)", "transport": "About a 10-minute walk from JR Kamifurano Station"}, {"address": "Miyama Pass, Kamifurano, Sorachi District, Hokkaido", "feature": "\u2b50 4.0 stars | Situated on the border between Biei and Kamifurano, Miyama Pass features an iconic giant red-and-white Ferris wheel that serves as a major landmark of the area. Riding the Ferris wheel lifts visitors hundreds of meters into the air, rewarding them with panoramic views of the Tokachi Mountain Range, vast rolling floral hills, and lavender fields\u2014a perfect blend of natural landscape and recreational architecture.", "name": "Miyama Pass Lookout \u0026 Ferris Wheel", "transport": "Take a bus from JR Biei Station or JR Kamifurano Station and get off at \u0027Miyama Toge\u0027 stop"}, {"address": "Nakagoryo, Furano, Hokkaido (Grounds of Shin Furano Prince Hotel)", "feature": "\u2b50 4.3 stars | Designed over two years by renowned landscape architect Sayuki Ueno, Kaze-no-Garden is a classic English garden attraction and the filming location of the famous Japanese TV drama of the same name. At the garden\u0027s center stands a vintage green wooden cottage and greenhouse, beautifully recreating set designs and fine antique furniture from the show. Surrounded by over 450 species of flowers, it showcases a charming harmony between European garden architecture and Furano\u0027s natural beauty.", "name": "Kaze-no-Garden \u0026 Green House", "transport": "About a 10-minute bus or taxi ride from JR Furano Station"}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "Takushin, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Takushinkan is a photography gallery established in 1987 by renowned Japanese landscape photographer Shinzo Maeda inside the renovated building of the abandoned Takushin Elementary School. Admission is free, displaying a vast collection of breathtaking photos capturing Biei\u0027s four seasons taken by Shinzo Maeda and his son Akira Maeda, including striking rainbow hills, lavender fields, and snowy landscapes. Surrounding the gallery is a dreamy white birch forest trail, lush green in summer and snow-covered in winter, making it a wonderful spot combining art appreciation with nature walks.", "name": "Takushinkan Photo Gallery", "transport": "About a 15-minute drive or taxi ride from JR Biei Station"}, {"address": "Higashi 4-sen Kita 26-go, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.3 stars | This museum is dedicated to the large-scale masterpieces of Sumio Goto, a master of modern Japanese painting (Nihonga). On display are over 130 magnificent paintings crafted using traditional techniques like gold leaf and mineral pigments. Themes range from the seasonal landscapes of Furano, Hokkaido, to famous historic temples in Kyoto and the Dunhuang Caves in China. On the second floor, \"Gotoh\u0027s Restaurant\" offers local Furano delicacies and panoramic views of the Tokachi mountain range, allowing visitors to immerse themselves in an artistic space steeped in Eastern aesthetics.", "name": "Goto Sumio Museum of Art", "transport": "About a 5-minute drive from JR Kamifurano Station, or direct via sightseeing bus"}, {"address": "Nishi 9-sen Kita 33-go, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 3.9 stars | Located inside Miyama Pass Art Park, Trick Art Museum Hokkaido is a rare large-scale indoor visual art venue in the Furano and Biei area. Utilizing light, shadows, and optical illusions of perspective, it showcases interactive 3D trick paintings featuring realistic wildlife, playful spins on famous world art, and surreal fantasy worlds. Visitors can step inside the artwork for creative photo ops, making it perfect for families and rainy days. Outside, an observation deck and a Ferris wheel offer sweeping views of Furano\u0027s vibrant flower fields and surrounding mountain peaks.", "name": "Trick Art Museum Hokkaido", "transport": "Take the town bus from JR Kamifurano Station and get off at \u0027Miyama Toge\u0027 station"}, {"address": "Rokugo Shigai, Furano-shi, Hokkaido", "feature": "\u2b50 4.1 stars | Nestled in the tranquil Rokugo area, Furano Glass Forest (Glass no Mori) is an artistic complex featuring a glass gallery, craft shops, and DIY workshops. It is most famous for its uniquely developed \u0027Hoarfrost Glass\u0027 (Juhyo Glass), crafted using a special crystallization technique that mimics the delicate, breathtaking frost and snow of Hokkaido\u0027s harsh winters. The complex sells exquisite glass jewelry, tableware, and art sculptures. Visitors can also participate in hands-on DIY experiences such as glassblowing, fusing, or sandblasting to create custom handmade souvenirs.", "name": "Furano Glass Forest", "transport": "Take the Rokugo Line Bus from JR Furano Station to \u0027Rokugo\u0027 stop, then walk for about 5 minutes"}, {"address": "Naka 5-ku, Furano-shi, Hokkaido", "feature": "\u2b50 4.4 stars | Furano Theatre Factory is a cultural facility constructed entirely of wood, initiated and designed with input from famous playwright So Kuramoto. The building blends seamlessly into Hokkaido\u0027s natural surroundings, featuring local high-quality timber that provides superb acoustics and a warm, inviting atmosphere. Hosting regular plays, concerts, lectures, and exhibitions, it serves as a creative hub for local Furano artists and theater troupes, showcasing Hokkaido\u0027s rich local culture and dramatic flair.", "name": "Furano Theatre Factory", "transport": "About a 10-minute drive or local bus ride from JR Furano Station"}, {"address": "1-8-31 Honmachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Built in 1953, Biei Christian Church is a historic stone church renowned for its architectural character. Its most striking feature is its exterior built from local tuff stone known as \u0027Biei Soft Stone\u0027, giving it a rustic, solid, yet warm and grounded texture. Standing gracefully on a quiet street corner in central Biei, its pointed tower and vintage wooden doors exude rich European charm. It attracts numerous architecture enthusiasts and photographers, serving as a distinctive landmark to experience Biei\u0027s cultural heritage.", "name": "Biei Christian Church", "transport": "About a 5-minute walk from JR Biei Station"}, {"address": "New Furano Prince Hotel Grounds, Nakafurano, Furano-shi, Hokkaido", "feature": "\u2b50 4.4 stars | Tucked deep within a quiet forest adjacent to the New Furano Prince Hotel, Forest Hour (Mori no Tokei) was originally a primary filming location for the famous Japanese drama \u0027Yasashii Jikan\u0027. Today, it has transformed into a cultural spot combining a cozy cafe and craft exhibition space. Surrounding the main building are several wooden artisan shops and galleries featuring wood carvings, stained glass, and handmade paper arts crafted from local natural materials. Here, visitors can admire warm, handcrafted artisan works amid rich aromas of coffee and wood, soaking in the serene and elegant atmosphere of forest arts.", "name": "Forest Hour \u0026 Craft Gallery", "transport": "About a 12-minute drive from JR Furano Station, or take a local bus to \u0027New Furano Prince Hotel\u0027 stop and walk about 5 minutes"}, {"address": "Misawa, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Tucked away in the rolling hills of Biei, Photo Gallery Oda is an intimate private photography gallery co-founded by photographer Mineko Orisaku and local photographers. The gallery specializes in displaying high-quality photographic works that capture the changing light, shadows, and seasons of Biei and Furano\u2014from spring\u0027s thawing earth and summer\u0027s radiant floral hills to autumn foliage and winter\u0027s stunning diamond dust phenomena. With a warm, elegant atmosphere and a small souvenir corner, it is a fantastic sanctuary for photography lovers to connect and appreciate exquisite visual art.", "name": "Photo Gallery Oda", "transport": "About a 10-minute drive or taxi ride from JR Biei Station"}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Kisen Kita 15-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Farm Tomita is Furano\u0027s most iconic lavender sightseeing farm, boasting hectares of sweeping flower fields that include the famous \u0027Irodori Field,\u0027 \u0027Hanabito Field,\u0027 and the historic \u0027Traditional Lavender Field.\u0027 Peak bloom occurs from mid to late July, when a vibrant carpet of red, yellow, white, and purple blooms rolls across the undulating hills set against the majestic Tokachi Mountain Range. Facilities include a lavender perfume workshop, Hanabito House, and popular shops serving signature lavender soft-serve ice cream and sweet melon desserts.", "name": "Farm Tomita", "transport": "About a 7-minute walk from Lavender Farm Station (seasonal temporary stop) on the JR Furano Line, or a 25-minute walk from Naka-Furano Station."}, {"address": "Shirogane, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Located in the Shirogane area of Biei Town, Shirogane Blue Pond is world-famous for its strikingly vivid, dreamy blue water and withered larch trees standing within the lake. This natural marvel occurs when aluminum from upstream Shirogane Hot Springs mixes with the Biei River, forming colloidal particles that reflect blue sunlight. The colors shift between Tiffany blue and emerald green depending on the season and weather, making it especially breathtaking during autumn foliage and winter light-ups.", "name": "Shirogane Blue Pond", "transport": "Take the Dohoku Bus (bound for Shirogane Onsen) from JR Biei Station for about 20 minutes and get off at the \u0027Shirogane Blue Pond\u0027 stop."}, {"address": "Shinsei Dai-3, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Shikisai-no-Oka is the largest sightseeing flower garden in the Biei area, spanning 15 hectares. From spring through autumn, dozens of flower species\u2014including tulips, lavender, sunflowers, and cosmos\u2014take turns blooming, forming a giant rainbow-like carpet across rolling hills. Visitors can easily tour the grounds aboard the \u0027Shikisai-go\u0027 tractor bus, rent a buggy, or visit the charming on-site alpaca farm, making it a fantastic spot for families.", "name": "Shikisai-no-Oka", "transport": "About a 25-minute walk from JR Bibaushi Station, or a 12-minute taxi ride from JR Biei Station."}, {"address": "Omachi, Biei-cho, Kamikawa-gun, Hokkaido (Northwestern hilly area of Biei)", "feature": "\u2b50 4.3 stars | Patchwork Road is a scenic route through the rolling hills of northwestern Biei, named after the quilt-like tapestry created by farmers growing alternating crops of wheat, potatoes, and sugar beets. Iconic landmarks along the drive include the \u0027Ken \u0026 Mary Tree,\u0027 \u0027Seven Stars Tree,\u0027 \u0027Parent and Child Trees,\u0027 and \u0027Hokusei-no-Oka Observatory Park.\u0027 It is a premier destination for scenic drives and cycling tours.", "name": "Patchwork Road", "transport": "Rent a bicycle (electric bikes recommended) at JR Biei Station and ride 15\u201330 minutes to reach the various spot highlights."}, {"address": "Omura Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.0 stars | Located along National Route 237 in Biei, Zerubu Hill is a charming hillside flower garden. Its name comes from a play on the Japanese words for \u0027wind\u0027 (Kaze), \u0027fragrance\u0027 (Kaoru), and \u0027fly\u0027 (Tobu). Featuring a massive circular flower bed filled with lavender, sunflowers, and salvia, visitors can zip through the fields on all-terrain buggies and enjoy panoramic views of Biei\u0027s countryside from the pyramid-shaped observation deck.", "name": "Zerubu Hill", "transport": "About a 20-minute walk or a 5-minute drive from JR Biei Station."}, {"address": "Miyama Toge, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Situated on a plateau along the border of Kamifurano and Biei, Miyama Pass offers exceptional vantage points over the region. Its expansive lavender fields create a striking contrast against the dramatic backdrop of the Tokachi Mountain Range. The area features a giant Ferris wheel offering a 360-degree panoramic view of the Furano Basin, alongside a nearby Trick Art Museum and craft hall.", "name": "Miyama Pass Lavender Garden", "transport": "About a 10-minute ride by town bus or taxi from JR Kamifurano Station."}, {"address": "Nishi 5-sen Kita 27-go, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Perched high on a hill in Kamifurano, Flower Land is one of the largest flower farms in the region. Its defining feature is a wide, sweeping panorama looking out toward the dramatic Tokachi Volcanic Range. In summer and autumn, colorful blooms cascade down the gentle slopes like a rainbow. The park offers engaging hands-on experiences, including tractor-trailer rides through the fields, crafting pressed-flower lavender sachets, and harvesting lavender or tasting fresh melon.", "name": "Flower Land Kamifurano", "transport": "About a 10-minute taxi ride from JR Kamifurano Station."}, {"address": "Shirogane, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Perched halfway up the main peak of the Tokachi Mountain Range at an elevation of 930 meters, Tokachidake Observatory is the highest viewpoint in Biei and Furano. It offers a rugged, dramatic contrast to the gentle flower fields below, featuring terrain covered in volcanic rock and lava trails from past eruptions. Visitors can view steam plumes rising from Tokachidake\u0027s vents up close. In autumn, it becomes a famous foliage destination offering sweeping views stretching from Asahikawa to Furano.", "name": "Tokachidake Observatory", "transport": "About a 35 to 40-minute ride by Dohoku Bus or taxi from JR Biei Station (road closed during winter)."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Kisen Kita 15-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Furano\u0027s most iconic flower farm in Hokkaido, world-famous for its vast, vibrant seas of flowers and purple lavender fields. From mid-to-late July each summer, the entire hillside turns into a breathtaking purple dreamland. Beyond lavender, the farm features the rainbow-like \u0027Irodori Field\u0027, where colorful blossoms like poppies, marigolds, and mint spread out like a vibrant carpet across the landscape. The farm also houses a perfume workshop, a dried flower house, and serves incredibly popular lavender soft-serve ice cream alongside related products\u2014making it an absolute must-visit photo spot when in Furano.", "name": "Farm Tomita", "transport": "About a 7-minute walk from JR Furano Line \u0027Lavender Farm Station\u0027 (seasonal temporary station), or about a 25-minute walk from \u0027Naka-Furano Station\u0027."}, {"address": "Shirogane, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A surreal pond located in Biei Town that gained global fame after being featured as a default wallpaper for Apple\u0027s Mac OS. The water contains rich natural minerals and aluminum, which refract sunlight to create a mysterious cobalt blue or emerald green hue. Withered Japanese larch and silver birch trees stand within the pond, their bare trunks reflecting off the azure water to create a serene, mystical, and fairy-tale atmosphere. Whether viewing the crystal-blue waters in summer or the snow-covered scenery with nighttime illuminations in winter, it offers breathtaking photo opportunities year-round.", "name": "Shirogane Blue Pond", "transport": "Take the Dohoku Bus \u0027Biei Shirogane Line\u0027 from JR Biei Station for about 20 minutes, get off at \u0027Shirogane Aoiike Iriguchi\u0027 (Blue Pond Entrance)."}, {"address": "Shinsei Dai-3, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Spanning a massive 15 hectares of flower fields, this is Biei\u0027s most iconic hillside flower garden. From May to October, dozens of flower varieties\u2014including tulips, sunflowers, lavender, and snapdragons\u2014weave together into vibrant floral carpets draped across rolling hills, delivering an unparalleled visual feast. The giant mascot scarecrows \u0027Kumi-chan\u0027 and \u0027Rolla-kun\u0027 are highly popular photo ops. Visitors can tour the fields aboard the retro tractor bus \u0027Shikisai-go\u0027, rent a golf cart to explore freely, or enjoy the winter season when it transforms into a fun-filled snow park.", "name": "Shikisai no Oka", "transport": "About a 25-minute walk from JR Furano Line \u0027Mibaushi Station\u0027, or a 12-minute taxi ride from JR Biei Station."}, {"address": "Nakagoryo, Furano-shi, Hokkaido (Grounds of New Furano Prince Hotel)", "feature": "\u2b50 4.2 stars | Tucked away in a tall coniferous forest next to the New Furano Prince Hotel, this romantic craft village was designed by renowned Japanese writer Sou Kuramoto. 15 charming wooden cabin shops are scattered along wooden boardwalks, selling unique handmade crafts such as glassware, woodcarvings, and leather goods. When night falls, warm amber lights illuminate the forest and boardwalks, creating a magical, fairy-tale atmosphere where forest elves might appear at any moment. It is a wildly popular evening destination for couples and photography enthusiasts.", "name": "Ningle Terrace", "transport": "Take the Lavender Bus from JR Furano Station for about 18 minutes, get off at \u0027New Furano Prince Hotel\u0027."}, {"address": "Okubo, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.0 stars | A towering poplar tree located along Biei\u0027s \u0027Patchwork Road\u0027, which rose to fame after featuring in Nissan\u0027s 1972 commercial \u0027Love Horizon\u0027 with main characters Ken and Mary. Standing solitary amidst rolling hills and sprawling farmland, this magnificent poplar tree presents an elegant yet beautifully poetic aesthetic\u2014whether contrasted against lush green fields in summer or standing tall against a pristine white snowscape in winter. It remains one of the most classic photo spots along Biei\u0027s scenic routes.", "name": "Ken \u0026 Mary Tree", "transport": "About a 15-20 minute bicycle ride, or a 5-minute taxi ride from JR Biei Station."}, {"address": "Miyama Toge, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Located at Miyama Pass on the border between Biei and Kamifurano, this spot offers magnificent sweeping panoramic views of the Furano Basin and the Tokachidake Mountain Range. Adjacent to the observation deck is a 50-meter-tall red Ferris wheel, which offers spectacular bird\u0027s-eye views of sprawling lavender fields, rolling green hills, and the majestic Daisetsuzan mountain range. The area also features a Trick Art 3D Museum, souvenir shops, and local culinary snacks, making it a versatile attraction combining natural beauty, visual entertainment, and shopping.", "name": "Miyama Pass Observation Deck", "transport": "Take a bus from JR Biei Station or JR Kamifurano Station and get off at \u0027Miyama Toge\u0027, or drive via National Route 237."}, {"address": "Okubo Kyowa, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Located on the north side of Biei\u0027s Patchwork Road, the park\u0027s most prominent landmark is its uniquely designed pyramid-shaped observation tower. Climbing to the top deck rewards visitors with unobstructed 360-degree views of Biei\u0027s iconic rolling hills, expansive wheat fields, lavender patches, and the Tokachidake Mountain Range in the background. Surrounded by lush greenery, the park features spacious lawns, a tourist information center, and local farm produce stalls. In summer, vibrant marigolds and lavender bloom in the flower beds, drawing countless visitors to capture Furano and Biei\u0027s picturesque pastoral scenery.", "name": "Hokusei no Oka Observatory Park", "transport": "About a 15-minute bicycle ride, or a 5-minute drive from JR Biei Station."}, {"address": "Mita, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.0 stars | A classic scenic hill in Biei Town named after a 1977 Japanese \u0027Mild Seven\u0027 cigarette TV commercial filmed here. Atop the hill, a neat row of Japanese larch trees planted as wind and snow barriers stands in clean, striking contrast to the surrounding rolling farmland. At sunset, the sky glows with vibrant shades of pink and orange, casting long, dramatic silhouettes of the larch trees across the golden fields to create a breathtaking scene\u2014an unmissable spot for photographers looking to capture Biei\u0027s stunning play of light and shadow.", "name": "Mild Seven Hill", "transport": "About a 10-minute drive/taxi ride, or a 25-minute electric bicycle ride from JR Biei Station."}], "name": "Popular Photo Spots"}}, "name": "Furano and Biei Flower Fields"}, "hakodate_bay": {"categories": {"cat_1": {"items": [{"address": "44 Goryokakucho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Built at the end of the Edo period, this star-shaped fortress is Japan\u0027s first Western-style citadel. It served as the historical stage for the Battle of Hakodate and was the last battlefield of Hijikata Toshizo, vice-commander of the Shinsengumi. Today, it has been converted into a public park beautiful in all four seasons, featuring nearly a thousand cherry trees in spring and the enchanting \u0027Hoshi-no-Yume\u0027 (Dream of Stars) illumination in winter. It is an exceptional landmark for experiencing nature and understanding a key turning point in modern Japanese history.", "name": "Special Historical Site Goryokaku", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station and walk for about 15 minutes."}, {"address": "14-12 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | An iconic architectural landmark in the Hakodate Bay Area, built in the late Meiji period as commercial warehouses after the port opened. Today, the red brick facades retain a strong retro port-town charm, while the interiors have been transformed into a commercial complex featuring local cuisine, delicate handmade crafts, souvenirs, and cozy cafes. Beautifully illuminated at night reflected on the harbor waters, it is a perfect spot for scenic strolls and photos.", "name": "Kanemori Red Brick Warehouse", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk for about 5 minutes."}, {"address": "11-13 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | An Important Cultural Property of Japan perched atop Motomachi Park. Built in 1910, this symmetrical wooden Western-style building is a signature Meiji-era structure. Its striking blue-gray facade accented with yellow trim is elegant and distinctive, while the interior showcases a grand banquet hall and imperial resting rooms. Visitors can rent vintage European dresses to wear while taking in panoramic views of Hakodate Port from the balcony.", "name": "Old Public Hall of Hakodate Ward", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk uphill for about 7 minutes."}, {"address": "3-13 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Japan\u0027s first Russian Orthodox church, originally founded in 1861 and rebuilt in 1916. Designated as an Important Cultural Property, its white walls and copper onion domes exhibit classic Orthodox Byzantine architecture. Its melodious bell chimes have been selected as one of the \u0027100 Soundscapes of Japan,\u0027 earning it the nickname \u0027Ding-Dong Church\u0027.", "name": "Hakodate Orthodox Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 or \u0027Suehirocho\u0027 station and walk for about 10 minutes."}, {"address": "15-30 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A historic church alongside the Orthodox Church, symbolizing the revival of Catholicism following the opening of Hakodate Port. The current cathedral was built in 1923 in Gothic style, featuring a soaring spire and an exquisite bell tower. The altar inside was a rare gift from Pope Benedict XV, creating a solemn and serene atmosphere steeped in foreign heritage.", "name": "Motomachi Roman Catholic Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk along Nijukenzaka Slope for about 10 minutes."}, {"address": "33-14 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Established when Hakodate Port opened in 1859, this building served as the British Consulate until 1934. The interior recreates the British-style consul office and living room, alongside exhibition areas showcasing Hakodate\u0027s port history. The attached English garden is stunning when roses bloom in summer, and the onsite tearoom offers an authentic English afternoon tea experience.", "name": "Old British Consulate in Hakodate", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk for about 5 minutes."}, {"address": "3-23 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | An Anglican-Episcopal church founded in 1874, with its current modernist structure completed in 1979. Its most distinctive feature is the cross-shaped roof structure, easily recognizable whether viewed from afar or above. The brown brick walls contrast beautifully with four large cross-shaped stained glass windows, adding a serene modern architectural flair to the Motomachi church district.", "name": "Hakodate St. John\u0027s Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk for about 10 minutes."}, {"address": "12-18 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | A classic Western-style building located inside Motomachi Park, built in 1909 and designated a Tangible Cultural Property of Hokkaido. Combining Western Renaissance-style columns with wooden construction, it boasts a grand appearance. The first floor serves as the Motomachi Tourist Information Center, while the second floor functions as a photography history museum showcasing precious vintage photos\u2014making it a wonderful spot to explore Hakodate\u0027s Western architecture.", "name": "Former Hokkaido Government Hakodate Branch Office", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk about 5 minutes into Motomachi Park."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "3-23 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1874 as an Anglican church, the current structure was rebuilt in 1979. Its standout architectural feature is its brown cross-shaped roof, offering a striking visual impression from above. Inside, the warm wooden structure and tea-colored stained glass windows create an elegant, peaceful atmosphere. Framed by beautiful seasonal scenery, it is an indispensable iconic landmark among the Motomachi churches.", "name": "Hakodate St. John\u0027s Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk for about 15 minutes."}, {"address": "3-8 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | The first Russian Orthodox church built in Japan, famous for its Russian-style green domes and white walls, designated as an Important Cultural Property of Japan. Its beautiful church bells are selected as one of the \u0027100 Soundscapes of Japan\u0027. The interior houses many precious Russian Byzantine-style icons, showcasing unique Eastern Orthodox artistic charm and rich historical heritage.", "name": "Hakodate Orthodox Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk for about 15 minutes."}, {"address": "15-30 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Featuring Gothic architecture, Motomachi Catholic Church is one of the oldest Catholic churches in Japan. The interior of the cathedral houses an exceptionally rare carved wooden altar gifted by Pope Benedict XV\u2014the only one of its kind in Japan. The weathercock atop its spire is a signature emblem, forming an exotic and picturesque scene alongside Motomachi\u0027s stone-paved sloping roads.", "name": "Motomachi Catholic Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station and walk for about 10 minutes."}, {"address": "11-13 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Built in 1910, this iconic Meiji-era Western-style building features striking blue-gray and bright yellow accents. Inside, lavish rooms and classical furniture once used by the Imperial family are on display. Visitors can try on vintage 19th-century European court costumes and admire the gorgeous view of Hakodate Port from the Victorian-style balcony\u2014an exceptionally popular experience.", "name": "Old Public Hall of Hakodate Ward", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk for about 7 minutes."}, {"address": "37-6 Goryokakucho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Situated next to Goryokaku Park, this museum focuses on modern art closely connected to Hokkaido and Hakodate, featuring works by renowned painter Shu Ogawara and sculptor Churyo Sato. The museum regularly hosts rich special exhibitions and workshops. With its sleek modern architecture surrounded by lush trees, it serves as a refined cultural gem in the Goryokaku area.", "name": "Hokkaido Hakodate Museum of Art", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station and walk for about 7 minutes."}, {"address": "44-1 Goryokakucho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Located in the center of Goryokaku Park, this restored building faithfully recreates the administrative office established by the Tokugawa Shogunate during the late Bakumatsu period. Built using traditional top-tier Japanese architectural craftsmanship and timber, the interior features detailed exhibits on late-Edo period open-door history and the intricate restoration process, transporting visitors back in time to experience the end of the Shogunate era.", "name": "Hakodate Magistrate\u0027s Office", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station and walk for about 15 minutes."}, {"address": "9-1 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Housed in the repurposed former Bank of Japan Hakodate Branch building, this history museum showcases folk artifacts and historical records of the Ainu and northern indigenous peoples. Highlights include exquisite traditional Ainu clothing, fishing and hunting gear, and unique everyday tools, alongside interactive experience zones where visitors can gain deep insights into the wisdom and culture of northern maritime peoples.", "name": "Hakodate City Museum of Northern Peoples", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk for about 1 minute."}, {"address": "33-14 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A historical building that played a crucial role since the opening of Hakodate Port in 1859, recreating the office and living spaces used by the British consul back in the day with a charming vintage British vibe. It features an elegant rose garden and an authentic English afternoon tea experience where visitors can savor fine black tea and pastries inside the historic Western-style residence.", "name": "Old British Consulate in Hakodate", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station and walk for about 5 minutes."}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "44 Goryokakucho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Goryokaku Park is Hakodate\u0027s most iconic historical and natural landmark. Built toward the end of the Edo period, it is world-renowned for its rare Western-style star-shaped fortress layout. The park boasts over 1,600 cherry trees; when they bloom from late April to early May, the entire star-shaped citadel transforms into a dreamlike sea of pink, drawing countless flower lovers. Summer brings vibrant greenery, autumn coats the landscape in vivid maple reds, and winter blankets everything in crisp white snow like a giant earth crystal. Visitors can stroll along the perimeter of the moat or rent a rowboat to float on the waters, taking in unique perspectives of the ancient ramparts and seasonal beauty. It is an unmatched destination to feel the historical echoes of the Battle of Hakodate alongside Hokkaido\u0027s changing seasons.", "name": "Goryokaku Park", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 stop and walk about 15 minutes."}, {"address": "Mount Hakodate, Hakodate, Hokkaido", "feature": "\u2b50 4.6 stars | Standing 334 meters tall, Mount Hakodate is a dormant volcano and the most prominent natural landmark in the Hakodate bay area. Internationally acclaimed as one of the world\u0027s top three night views, its summit offers a breathtaking glowing panorama framed by Hakodate Port to the east and the Tsugaru Strait to the west, creating a striking double-curved peninsula shape. Beyond its shimmering nightscape, Mount Hakodate is a rich natural sanctuary equipped with well-maintained hiking trails, hundreds of wild bird species, and lush floral life. Spring and summer cover the slopes in vibrant green and colorful wildflowers, making it ideal for light trekking. Looking down from the summit observatory, you get an uninterrupted view of the bay, city streets, and distant seas\u2014whether in morning mist, golden sunset, or starlight, the scenery is truly breath-taking.", "name": "Mount Hakodate", "transport": "Take the Hakodate Ropeway for a 3-minute ride directly to the summit, or walk up from the Jujigai intersection along the ropeway station."}, {"address": "12-18 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Nestled on the hillside of Mount Hakodate, Motomachi Park offers an incredible vantage point overlooking Hakodate Port and the bay area. The park is surrounded by exotic modern Western-style historical buildings, such as the Old Public Hall of Hakodate Ward and the Former Hokkaido Government Hakodate Branch Office, creating a charming atmosphere where history and nature intertw. Neatly paved cobblestone paths and lush green lawns fill the grounds, while spring cherry blossoms and colorful blooms add vibrant hues to its rich heritage backdrop. Standing on the elevated platform, visitors can admire the grand harbor view and ships coming and going. At dusk, the sunset paints the ocean gold as vintage streetlights flick on, creating an exceptionally romantic setting for a leisurely stroll or photos.", "name": "Motomachi Park", "transport": "Take the Hakodate City Tram to \u0027Suehiro-cho\u0027 stop and walk uphill for about 7 minutes."}, {"address": "15 Omachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Midori no Shima is a man-made green island located inside Hakodate Port, connected to the bay waterfront by a short causeway. It serves as a peaceful hidden sanctuary where locals and travelers go to unwind. The island features vast open lawns, sports fields, and a scenic perimeter walking path right along the water. Visitors can enjoy a 360-degree panoramic view of the tranquil bay while looking back directly at Mount Hakodate and the sloping streetscapes of Motomachi. It is also a favored spot for watching the Hakodate Ocean Fireworks Festival. Here, you can soak in the gentle ocean breeze, watch ferries and fishing boats glide past, or stretch out on the grass under the sun, escaping city noise to savor Hakodate\u0027s coastal rhythm.", "name": "Midori no Shima (Green Island)", "transport": "Take the Hakodate City Tram to \u0027Omachi\u0027 stop and walk toward the sea for about 5 minutes to cross the bridge onto the island."}, {"address": "17 Aoyagicho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Established in 1879, Hakodate Park is one of Japan\u0027s earliest modern urban parks. Situated at the southeastern foot of Mount Hakodate, it overflows with historical charm and natural scenery. The park\u0027s gently rolling terrain is home to roughly 400 cherry trees, making it a famous cherry blossom spot alongside Goryokaku each spring as blossoms reflect gracefully off vintage bridges and ponds. It features Japan\u0027s oldest municipal mini zoo as well as \u0027Kodomo-no-Kuni\u0027 (Children\u0027s Land), a retro mini amusement park home to Japan\u0027s oldest working carousel. With peaceful fountain plazas, shady tree-lined paths, and spectacular red maples in autumn, it is a versatile, welcoming park for nature, history, and family fun.", "name": "Hakodate Park", "transport": "Take the Hakodate City Tram to \u0027Aoyagi-cho\u0027 stop and walk about 3 minutes."}, {"address": "24 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Situated directly adjacent to the famous Kanemori Red Brick Warehouses and the waterfront, Nishi Hatoba Park is a beloved harborfront park. Extending out to the bay\u0027s edge, it features wide wooden boardwalks and comfortable benches, allowing visitors to get right up to the water and feel the fresh sea breeze. Unique sculptures and harbor monuments dot the grounds, offering clear views of the historic museum ship \u0027Mashu Maru\u0027 moored nearby, along with Midori no Shima and Mount Hakodate across the water. Whether admiring the bright contrast of blue sea and red brick during the day or taking in the golden twilight at dusk, it is a delightful spot to pause while exploring the bay area.", "name": "Nishi Hatoba Park", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 stop and walk about 5 minutes."}, {"address": "56 Miharashicho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Miharashi Park is a celebrated expansive natural park in Hakodate that incorporates Kosetsuen, the only garden in Hokkaido designated as a National Cultural Property. The park seamlessly blends traditional Japanese garden aesthetics with a rich forest habitat, featuring nearly 150 plant species including towering cedar groves, maples, and seasonal flowers. Every autumn, hundreds of maple trees transform into intense shades of crimson and gold, forming a enchanting \u0027autumn leaf tunnel\u0027 that comes alive during evening light-up events. Spring brings plum and cherry blossoms, summer offers cool shaded green canopy, and winter wraps the landscape in a ink-wash snow scene. Complete with a greenhouse teahouse and peaceful trails, it is an extraordinary place to immerse in nature and Japanese garden art.", "name": "Miharashi Park / Kosetsuen", "transport": "From JR Hakodate Station, take the Hakodate Bus (Route 14) for about 40 minutes and get off at \u0027Kosetsuen\u0027 stop."}, {"address": "1-11 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.0 stars | Located near the top of the Motomachi slopes right behind the Old Public Hall of Hakodate Ward, Minatogaoka Park is a quiet, hilltop oasis. Featuring leafy green lawns, a gazebo, and an elevated viewing platform, its elevated location keeps it free from big tourist crowds. It offers a tranquil place to look out over the sweeping expanse of Hakodate Bay, the Kanemori Red Brick Warehouses, and boats gliding across the water. Surrounded by lush greenery that bursts into color in spring, a cool breeze makes the park wonderfully peaceful. For travelers seeking a quiet hidden gem to enjoy private views of Hakodate Port, this is a secret natural haven.", "name": "Minatogaoka Park", "transport": "Take the Hakodate City Tram to \u0027Suehiro-cho\u0027 stop and walk up Motoi-zaka slope for about 10 minutes."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "43-9 Goryokaku-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 Stars | Goryokaku Tower is the premier vantage point for overlooking the star-shaped ruins of Goryokaku Fort. Standing at 107 meters tall, this observation tower offers stunning 360-degree panoramic views with spectacular scenery year-round: thousands of cherry blossoms form a massive pink star in spring, lush greenery fills the view in summer, vibrant foliage takes over in autumn, and winter brings a snow-covered wonderland lit up during the special \u0027Dream of Goryo Stars\u0027 event. Inside, you\u0027ll also find diorama displays detailing the history of Goryokaku and the Battle of Hakodate, gift shops, and an observation cafe, making it an iconic must-visit landmark in Hakodate.", "name": "Goryokaku Tower", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-koen-mae\u0027 station, then walk for about 15 minutes."}, {"address": "14-12 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 Stars | Standing along Hakodate Bay, the Kanemori Red Brick Warehouse stands as a historical witness to the opening of Hakodate\u0027s port. Converted from old port warehouses, these red-brick structures exude a strong sense of Meiji-era romance. The complex is divided into several areas, including \u0027Kanemori Yobinkan\u0027, \u0027Hakodate History Plaza\u0027, and \u0027BAY Hakodate\u0027, housing exquisite craft shops, dessert cafes, specialty stores, and restaurants. At nightfall, warm yellow lighting casts over the brick walls and canal waters, creating an exotic, romantic ambiance that makes it an insanely popular spot for night photography and romantic dates.", "name": "Kanemori Red Brick Warehouse", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station, then walk for about 5 minutes."}, {"address": "Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 Stars | Ranked among Japan\u0027s most beautiful slopes, Hachimanzaka is a stone-paved street leading directly down to Hakodate Port. Looking down from the top, you\u0027re treated to a lined path of trees and vintage streetlamps opening up to the deep blue Hakodate Bay and the docked Mashu Maru memorial ship, offering incredible visual depth. Famous for appearing in numerous TV commercials, movies, and dramas, it has become a classic spot for visitors to pay pilgrimage. Whether under bright blue daytime skies, at sunset, or during evening illumination, every shot looks like a postcard.", "name": "Hachimanzaka Slope", "transport": "Take the Hakodate City Tram to \u0027Suehiro-cho\u0027 station, then walk for about 1 minute."}, {"address": "11-13 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 Stars | Located on the highlands of Motomachi, the Old Public Hall of Hakodate Ward was completed in 1910 and represents a prime example of Meiji-era Western architecture. Its strikingly elegant blue-gray and bright yellow facade features colonnades and carved balconies full of colonial charm. Inside, visitors can pay to experience the \u0027Haikara Clothing Pavilion\u0027, dressing up in classical Meiji or Taisho-era dresses or hakama to pose in the grand ballroom, balconies, and retro corridors while enjoying panoramic views of Hakodate Port\u2014a true step back in time.", "name": "Old Public Hall of Hakodate Ward", "transport": "Take the Hakodate City Tram to \u0027Suehiro-cho\u0027 station, then walk for about 7 minutes."}, {"address": "12-1 Toyokawa-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 Stars | Originally the old Hakodate Post Office built in 1911, Hakodate Meijikan features exterior red-brick walls covered in lush green ivy, exuding historical aesthetic charm perfect for photos. Now converted into a multi-purpose shopping and leisure complex, the building houses a famous music box workshop, glass craft shops, and a teddy bear display area. Visitors can try their hand at DIY music box crafting, shop for exquisite Hokkaido handicrafts, or take photos in the high-ceilinged, vintage central hall while soaking up the nostalgic romance.", "name": "Hakodate Meijikan", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station, then walk for about 2 minutes."}, {"address": "3-13 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 Stars | Built in 1861, Hakodate Orthodox Church is Japan\u0027s first Eastern Orthodox church. Its elegant Byzantine Revival architecture has been designated an Important Cultural Property of Japan. Featuring crisp white walls topped with vibrant green domes and onion-shaped bell towers, it looks straight out of a fairy tale. The church bells are so distinctive that they were selected as one of the \u0027100 Soundscapes of Japan\u0027, affectionately earning the church the local nickname \u0027Gangan-dera\u0027 (Ding-Dong Temple). Views looking down from the nearby slopes or shots around the gardens make for enchanting, exotic photo opportunities with Russian flair.", "name": "Hakodate Orthodox Church", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station, then walk for about 10 minutes."}, {"address": "15 Omachi, Hakodate, Hokkaido", "feature": "\u2b50 4.1 Stars | Midori no Shima is an artificial island in Hakodate Bay connected to the mainland via Midori no Shima Bridge, making it a favorite hidden photo spot for locals and photography enthusiasts. The island features vast green lawns and coastal walking paths, providing unobstructed 360-degree panoramic views of the Kanemori Red Brick Warehouses, Mount Hakodate, and the historic Motomachi slope district. With its peaceful and relaxing atmosphere, it is an ideal spot to watch the coastal sunset over Hakodate Bay, as well as a popular venue for summer music festivals and fireworks.", "name": "Midori no Shima", "transport": "Take the Hakodate City Tram to \u0027Omachi\u0027 station, then walk for about 5 minutes."}, {"address": "Mount Hakodate, Hakodate, Hokkaido", "feature": "\u2b50 4.6 Stars | The Mount Hakodate Observatory is world-famous for its \u0027Million Dollar Night View\u0027, awarded three stars in the Michelin Green Guide Japan. Perched 334 meters above sea level at the summit of Mount Hakodate, it overlooks a unique narrow peninsula flanked by Hakodate Bay on one side and the Tsugaru Strait on the other, resembling a dazzling jewelry box. Beyond the breathtaking night lights, the Magic Hour just before sunset offers stunning photo opportunities. Equipped with outdoor observation decks, scenic restaurants, and gift shops, this is the ultimate must-visit landmark in Hakodate.", "name": "Mount Hakodate Observatory", "transport": "Take the Mount Hakodate Ropeway from \u0027Sanroku Station\u0027 for about 3 minutes to reach the summit."}], "name": "Popular Photo Spots"}}, "name": "Hakodate Bay Area and Goryokaku"}, "niseko_resort": {"categories": {"cat_1": {"items": [{"address": "57 Arishima, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | The Arishima Memorial Museum is a historical and cultural landmark dedicated to Takeo Arishima, a renowned modern Japanese novelist. Arishima once owned the expansive \u0027Arishima Farm\u0027 in this area. Guided by his idealistic vision that \u0027all farmland should belong to the farmers,\u0027 he distributed the farm to local peasants free of charge, profoundly shaping Niseko\u0027s pioneer history. The museum exhibits many of Arishima\u2019s original manuscripts, rare historical documents, and tools from the early farming era. Combining European charm with modern architectural touches, the building features a soaring tower surrounded by lovely gardens and lush greenery\u2014making it the perfect place to delve into Niseko\u2019s evolution from an agricultural village to a premier resort.", "name": "Arishima Memorial Museum", "transport": "About a 5-minute drive or a 10-minute ride on the community bus from JR Niseko Station."}, {"address": "Chuo-dori, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | JR Niseko Station is one of the few historical train stations in Japan named entirely in katakana script. Its charming building exudes the cozy atmosphere of a European mountain resort lodge. First established in 1904 (Meiji 37) as Makkari Station, it was officially renamed Niseko Station in 1968. Although renovated over time, the station retains its nostalgic wooden framework and rustic log textures, housing a classic waiting room and a cozy caf\u00e9 inside. Framed by golden autumn foliage or blanketed in deep snow during winter, this station stands as a quintessential lan
