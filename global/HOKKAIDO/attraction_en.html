o", "feature": "\u2b50 4.1 stars | The Sapporo Clock Tower is an iconic historical landmark in Hokkaido. Built in 1878 (Meiji 11), it originally served as a drill hall for the former Sapporo Agricultural College (now Hokkaido University). This two-story wooden building blends American colonial architectural styles, and its famous tower clock began operating in 1881, still chiming clearly to this day. The first floor displays the historical evolution of the clock tower and precious historical documents related to the agricultural college, while the second floor restores the hall used as an auditorium and chapel, holding immense cultural and historical value.", "name": "Sapporo Clock Tower", "transport": "About a 5-minute walk from Odori Station (Subway Toho, Namboku, or Tozai Lines), or a 10-minute walk from the South Exit of JR Sapporo Station"}, {"address": "Kita 10-jo Nishi 8-chome, Kita-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Located within the Hokkaido University campus, this comprehensive museum is housed in the former School of Science building built in 1929. It displays millions of valuable specimens and academic research achievements accumulated since the university\u0027s founding in 1876. Exhibits cover paleontology fossils (such as giant dinosaur and mammoth skeleton replicas), insect specimens, marine life, Hokkaido\u0027s indigenous Ainu culture, and pioneer history records. Admission is free, and it features a cozy cafe and souvenir shop, making it a culturally rich and highly educational attraction.", "name": "The Hokkaido University Museum", "transport": "About a 10-12 minute walk from the North Exit of JR Sapporo Station, or a 7-minute walk from Kita-12-Jo Station (Subway Namboku Line)"}, {"address": "Odori Nishi 13-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Located at the western end of Odori Park (Nishi 13-chome), the Sapporo City Archive was built in 1926 as the former Sapporo Court of Appeal. Built with Sapporo soft stone, this majestic structure is designated as a National Registered Tangible Cultural Property. The entrance still features carvings of the Lady of Justice and scales of justice. Inside, visitors can learn about Sapporo\u0027s urban development and the history of Odori Park, browse a themed gallery dedicated to famous paintings of Odori Park, and explore community exhibition spaces. The garden behind the building is also a lovely spot for seasonal flower viewing and relaxation.", "name": "Sapporo City Archive", "transport": "About a 5-minute walk from Exit 1 of Nishi-11-Chome Station (Subway Tozai Line)"}, {"address": "Kita 1-jo Nishi 6-chome 10, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1881, Catholic Kita-Ichijo Church is one of the most historic Catholic churches in Hokkaido. The current sanctuary was constructed in 1916 using local Sapporo soft stone and Gothic architectural elements, presenting a simple yet solemn stone church aesthetic. The interior is filled with a peaceful, serene atmosphere, where exquisite stained glass glows vibrantly in the sunlight, documenting the history of Western religious culture during Hokkaido\u0027s development. Located close to downtown Sapporo, it serves as a tranquil sanctuary amidst the bustling city.", "name": "Catholic Kita-Ichijo Church", "transport": "About a 7-minute walk from Odori Station (Subway Namboku or Tozai Lines)"}, {"address": "Kita 3-jo Nishi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Affectionately known as the \u0027Red Brick Office,\u0027 the Former Hokkaido Government Office Building was constructed in 1888 in an American Neo-Baroque architectural style using over 2.5 million red bricks. It stands as a symbolic landmark of Hokkaido\u0027s pioneer era. Inside, it preserves the original offices of the Hokkaido Development Commission, Karafuto historical documents, and Hokkaido history exhibition rooms, displaying valuable maps, old documents, and artifacts. The front courtyard blooms with rich seasonal flora, featuring a century-old ginkgo avenue and tulip gardens that evoke a classic European charm.", "name": "Former Hokkaido Government Office Building", "transport": "About an 8-minute walk from the South Exit of JR Sapporo Station, or an 8-minute walk from Odori Station (Subway Namboku Line)"}, {"address": "1F-2F Sapporo Community Plaza, Kita 1-jo Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Located inside the Sapporo Community Plaza, adjacent to Odori Park and the TV Tower, SCARTS is a modern cultural venue. It integrates art galleries, a multipurpose performance hall, creative studios, and an open cultural library. The center regularly hosts contemporary art exhibitions, musical performances, cultural lectures, and craft workshops, providing a vibrant platform for artistic inspiration and community engagement. With its spacious, modern design and large floor-to-ceiling windows offering city views, it is a perfect spot for art lovers and travelers to explore at a relaxed pace.", "name": "Sapporo Cultural Arts Community Center SCARTS", "transport": "Directly connected to Exit 30 of Odori Station (Subway Tozai, Namboku, or Toho Lines) (about a 2-minute walk)"}, {"address": "Kita 8-jo Nishi 7-chome, Kita-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Tucked away in a residential area northwest of Sapporo Station, Seigatei was built in 1880 (Meiji 13) as a rest house for Emperor Meiji during his tour of Hokkaido. This small wooden building artfully blends traditional Japanese architecture with Western-influenced styles from the pioneer era, featuring refined hip-and-gable roofs and Western-style arched windows. The interior retains Meiji-era decor and documents, while the outside features a beautiful Japanese garden and spring pond. Designated a Municipal Tangible Cultural Property of Sapporo, it is a wonderful destination to learn about VIP hospitality of the Meiji period while enjoying a tranquil moment.", "name": "Seigatei Historic Building", "transport": "About an 8-10 minute walk from the West or North Exit of JR Sapporo Station"}, {"address": "Minami 2-jo Higashi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 stars | Situated on the eastern extension of Odori Park, the Sapporo City Gallery has served as a core venue for promoting visual arts and showcasing local creators since opening in 1977. The gallery features multiple independent exhibition rooms presenting a rich variety of contemporary and traditional art year-round, including Nihonga (Japanese painting), Western painting, sculpture, calligraphy, photography, and crafts. Additionally, it frequently hosts art classes and lectures, creating an inspiring artistic retreat right in the bustling heart of Sapporo.", "name": "Sapporo City Gallery", "transport": "About a 3-minute walk from Exit 10 of Bus Center-Mae Station (Subway Tozai Line), or about a 12-minute walk from Odori Station"}], "name": "Arts, Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Odori Nishi 1-chome to 12-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A 1.5 km long greenbelt park stretching east to west through central Sapporo, dividing the city into north and south sections. Beautiful in all four seasons: lilacs bloom in spring, lively beer gardens set up in summer, vibrant autumn foliage peaks in fall, and winter hosts the world-famous Sapporo Snow Festival. Featuring fountains, statues, and seasonal flower beds, it is the perfect spot for locals and tourists to relax and try the famous Odori Park grilled corn.", "name": "Odori Park", "transport": "Directly accessible from Odori Station on the Namboku, Tozai, and Toho Subway Lines"}, {"address": "Kita 3-jo Nishi 8-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A historic botanical garden affiliated with Hokkaido University, established in 1886. It preserves the natural state of pre-settlement primeval forests and indigenous heritage. Spanning 13.3 hectares, it houses around 4,000 plant species, including an alpine garden, greenhouse, Northern Peoples Specimen Room, and Natural History Museum. Lushly shaded and peaceful, it serves as a serene green oasis right in the bustling city center.", "name": "Botanic Garden Hokkaido University", "transport": "About a 10-minute walk from the South Exit of JR Sapporo Station, or an 8-minute walk from Odori Subway Station"}, {"address": "Kita 3-jo Nishi 6-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Exquisite Baroque-style gardens surrounding the famous red-brick Former Hokkaido Government Office (\"Akarenga\"). The grounds feature dozens of tree and flower species, including historic ginkgo trees, cherry blossoms, and a lovely lily pond inhabited by ducks and wild birds. Breathtaking during spring cherry blossoms and autumn\u0027s golden ginkgo foliage, it is one of the most popular walking spots connecting Sapporo Station and Odori Park.", "name": "Former Hokkaido Government Office Building Gardens", "transport": "About an 8-minute walk from the South Exit of JR Sapporo Station, or a 5-minute walk from Odori Subway Station"}, {"address": "Minami 1-jo Higashi 1-chome to Kita 1-jo Higashi 1-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | An 820-meter-long waterfront park running along the Sosei River in central Sapporo. Lushly planted with flowers and trees, the park is adorned with public art pieces by renowned sculptors such as Kan Yasuda. Gentle promenades and resting benches line both banks. In spring, lilacs and seasonal flowers bloom, showcasing a harmonious blend of modern urban design and clear flowing waters.", "name": "Soseigawa Park", "transport": "Directly accessible from Exit 34 of Odori Station on the Tozai, Namboku, and Toho Subway Lines"}, {"address": "Kita 13-jo Nishi 5-chome, Kita Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Iconic natural landscapes located within the Hokkaido University campus, just north of Sapporo Station. The 380-meter ginkgo avenue features 70 ginkgo trees that turn brilliant gold from late October to early November, forming a spectacular golden tunnel. Meanwhile, the Central Lawn offers expansive greenery and soothing stream views\u2014a perfect spot to experience Hokkaido\u0027s seasonal shifts and academic charm.", "name": "Hokkaido University Ginkgo Avenue \u0026 Central Lawn", "transport": "About a 10-minute walk from the North Exit of JR Sapporo Station, or a 4-minute walk from Kita-12-Jo Subway Station on the Namboku Line"}, {"address": "Between Kita 2-jo Nishi 4-chome and Kita 3-jo Nishi 4-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | An urban tree-lined plaza situated directly in front of the main entrance of the Former Hokkaido Government Office. It features Hokkaido\u0027s oldest surviving roadside trees, the Akasumi Ginkgo. Paved with red bricks that mirror the historical building behind it, the plaza hosts seasonal outdoor flower displays, illumination shows, and cultural markets, bridging Sapporo Station and the Odori shopping district with green charm and cultural vibes.", "name": "Sapporo Kita 3-Jo Plaza (\u0027Akapla\u0027)", "transport": "About a 5-minute walk from JR Sapporo Station or Odori Subway Station"}, {"address": "Riverside near Minami 1-jo Higashi 4-chome to Minami 3-jo Higashi 4-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.0 stars | A sprawling riverside park east of the Odori commercial district, extending along the Toyohira River that runs through Sapporo. The green space features expansive lawns, cycling paths, and sports facilities. Cherry blossoms line the banks in spring, while summer brings the famous Toyohira River Fireworks Display. Visitors can enjoy grand natural views, distant glimpses of Mt. Moiwa, and the Sapporo skyline.", "name": "Toyohira River Green Space", "transport": "About a 7-minute walk from Exit 10 of Bus Center-Mae Station on the Tozai Subway Line"}, {"address": "1 Nakajimapark, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Located just a few subway minutes south of the Odori commercial area, this is one of central Sapporo\u0027s premier urban parks. Centered around Shobu Pond, it is surrounded by lush greenery and historic structures like the Hohei-kan (an Important Cultural Property) and a Japanese garden. In autumn, the reflection of fall foliage and ginkgo trees on the pond is breathtaking. Visitors can enjoy boating, strolling, and flower viewing in all seasons.", "name": "Nakajima Park", "transport": "Directly accessible from Exit 1 or 3 of Nakajima-Koen Station on the Namboku Subway Line"}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "1 Chome Odori Nishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Standing tall at the eastern end of Odori Park, this iconic 147.2-meter landmark was built in 1957. Beautifully illuminated at night, its 90-meter-high observation deck offers a 360-degree panoramic view of Odori Park\u0027s seasonal beauty and Sapporo\u0027s grid-patterned streets. It is an absolute must-visit spot for capturing nightscapes and light displays, especially during the Winter Snow Festival or Lilac Festival.", "name": "Sapporo TV Tower", "transport": "About a 1-minute walk from Exit 27 of Odori Station on the Namboku, Tozai, and Toho Subway Lines"}, {"address": "1 Chome to 12 Chome Odori Nishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Stretching 1.5 kilometers east to west through downtown Sapporo, this urban oasis divides the city into north and south. Beautiful in all four seasons, it features blooming lilacs in spring, a bustling beer garden in summer, an autumn food festival, and serves as the main venue for the world-famous Sapporo Snow Festival in winter. With picturesque fountains, sculptures, and flowerbeds, it is a beloved spot for both locals and tourists to relax and snap photos.", "name": "Odori Park", "transport": "Directly accessible upon exiting subway Odori Station"}, {"address": "2 Chome Kita 1 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 3.8 stars | Built in 1878 as a drill hall for the Sapporo Agricultural College, this is Japan\u0027s oldest surviving clock tower. It features a distinctive American frontier-style white wooden architecture, and its top clock still chimes accurately to this day. Though humorously dubbed one of \u0027Japan\u0027s Top Three Disappointing Attractions,\u0027 its rich historical atmosphere and retro charm make it a classic, photogenic landmark in Sapporo.", "name": "Sapporo Clock Tower", "transport": "About a 5-minute walk from Odori Station (City Hall Exit), or a 10-minute walk from the South Exit of JR Sapporo Station"}, {"address": "6 Chome Kita 3 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Affectionately known as the \u0027Red Brick Office,\u0027 this Neo-Baroque landmark constructed in 1888 is an Important Cultural Property of Japan. Featuring grand European classical aesthetics, its surrounding gardens bloom with lush trees and flowers. The ginkgo-lined avenue transforms into a radiant golden tunnel in autumn, while winter snow creates a fairy-tale scene, making it a favorite photo spot near Sapporo Station.", "name": "Former Hokkaido Government Office Building", "transport": "About an 8-minute walk from the South Exit of JR Sapporo Station, or a 9-minute walk from Odori Subway Station"}, {"address": "38F JR Tower, 5 Chome Kita 5 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Located on the 38th floor of JR Tower (160 meters high) with direct access from JR Sapporo Station, this is the highest indoor observation deck in downtown Sapporo. It offers an unobstructed 360-degree panoramic view; clear days reveal Ishikari Bay and Mount Teine, while night brings glowing jewel-like vistas recognized as one of \u0027Japan\u0027s New Top Three Night Views.\u0027 Uniquely, the men\u0027s restroom features a floor-to-ceiling panoramic window, creating a viral and quirky photo highlight!", "name": "JR Tower Observation Deck T38", "transport": "Directly connected to JR Sapporo Station, or about a 3-minute walk from Sapporo Station on the Namboku/Toho Subway Lines"}, {"address": "1 to 7 Chome, Minami 2 \u0026 3 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | With a history of over 150 years, this covered arcade spans 1 kilometer from 1-Chome to 7-Chome. Home to hundreds of drugstores, eateries, souvenir shops, and arcades, it offers a vibrant blend of Showa retro charm and modern energy. Cute raccoon-dog (tanuki) statues and neon lights throughout the arcade make iconic backdrops for travelers looking to capture memories in Sapporo.", "name": "Tanukikoji Shopping Street", "transport": "About a 3\u20135 minute walk from subway Odori Station or Susukino Station"}, {"address": "1, 4 Chome Kita 2 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A stylish commercial complex adjacent to the Former Hokkaido Government Office Building, renowned for its green outdoor plaza and bright, modern glass design. The 2nd-floor \u0027Observation Gallery\u0027 provides a premier elevated view overlooking the Red Brick building and the ginkgo-lined avenue. Offering lovely scenery in every season, it\u0027s a fantastic spot for dining, relaxing, and taking chic city photos.", "name": "Akarenga Terrace", "transport": "5-minute walk from JR Sapporo Station, or directly connected via the Underground Walking Space (Chi-Ka-Ho) from Namboku Line Sapporo Station"}, {"address": "20, 3 Chome Minami 2 Jonishi, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Opened in 2023 in the Odori commercial district, moyuk SAPPORO is a dynamic new complex housing the urban aquarium \u0027AOAO SAPPORO\u0027 on floors 4 through 6. Seamlessly combining digital art with marine biology, it highlights playful rockhopper penguins and mesmerizing jellyfish exhibits alongside a greenhouse-style lounge and bakery. Its stylish, high-tech aesthetic has made it an instant favorite for Instagram-worthy photos in Sapporo.", "name": "moyuk SAPPORO \u0026 AOAO SAPPORO Aquarium", "transport": "About a 3-minute walk from Odori Subway Station, or a 1-minute walk from Tanukikoji Streetcar Stop"}], "name": "Popular Photo Spots"}}, "name": "Sapporo Station and Odori Shopping District"}, "susukino_tanukikoji": {"categories": {"cat_1": {"items": [{"address": "Minami 2-jo \u0026 Minami 3-jo Nishi 1-chome to 7-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 Stars | Open since 1873 (Meiji 6), Tanukikoji Shopping Arcade is one of Hokkaido\u0027s oldest shopping streets, spanning 7 blocks covered by an all-weather arcade. Located in Tanukikoji Block 5, \u0027Tanuki Shrine\u0027 (officially Motokago Shrine) was established in 1973 to mark the arcade\u0027s 100th anniversary. It enshrines a Tanuki Jizo deity prayed to for business prosperity, safe childbirth, and good matches. Following tradition, visitors pour water over the tanuki statue and stroke different parts of its body for blessings\u2014such as touching its head for academic progress or its belly for smooth childbirth. Blending deep Showa nostalgia with modern commercial vitality, it is a must-visit landmark to experience Sapporo\u0027s local everyday culture and historical roots.", "name": "Tanuki Shrine \u0026 Tanukikoji Shopping Arcade", "transport": "Approx. 3-min walk from Sapporo Subway Namboku Line \u0027Odori Station\u0027 or \u0027Susukino Station\u0027; or take the Sapporo Streetcar and get off directly at \u0027Tanukikoji Station\u0027."}, {"address": "Minami 4-jo Nishi 3-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | Susukino is Northern Japan\u0027s largest entertainment district, with a history dating back to 1871 (Meiji 4) when the Hokkaido Development Commission established a red-light district here. Perched atop the Susukino Building at Susukino Crossing, the famous \u0027King of Blenders\u0027 NIKKA Whisky neon sign has been an iconic modern historical landmark and night-view symbol of Sapporo since 1969. The background neon colors change periodically, illuminating a vibrant sea of neon from thousands of surrounding izakayas and bars, displaying a unique architectural and cultural landscape shaped by Hokkaido\u0027s pioneering legacy.", "name": "Susukino Crossing \u0026 NIKKA Board", "transport": "Directly accessible from Exit 3 of Sapporo Subway Namboku Line \u0027Susukino Station\u0027."}, {"address": "Minami 6-jo Nishi 1-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Built in 1885 (Meiji 18), Naritasan Sapporo Betsuin Shinsoji Temple is the first branch temple of Chiba Prefecture\u0027s famous Naritasan Shinsho-ji Temple in Hokkaido, standing in a quiet corner of the bustling Susukino entertainment district. Enshrining Fudo Myoo (Acala), it has long served as a spiritual haven for local businesses and residents praying for commercial success, family safety, and traffic safety. Its simple, solemn traditional Japanese temple architecture creates a striking contrast against surrounding skyscrapers and neon lights. The temple hosts grand Goma fire rituals and Setsubun bean-scattering ceremonies during the New Year period, making it a classic landmark to explore Susukino\u0027s deep spiritual culture and pioneer history.", "name": "Naritasan Sapporo Betsuin Shinsoji Temple", "transport": "Approx. 2-min walk from Exit 6 of Sapporo Subway Toho Line \u0027Hosui-Susukino Station\u0027; or about 6-min walk from Subway Namboku Line \u0027Susukino Station\u0027."}, {"address": "Minami 7-jo Nishi 8-chome 1, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.0 Stars | Higashi Honganji Sapporo Betsuin has a deeply rooted history originating in 1870 (Meiji 3) as an administrative outpost established during the construction of the \u0027Honganji Road\u0027 by the Development Commission\u2014a vital historical turning point for the development of Sapporo and Hokkaido. The current main hall, rebuilt in 1912 (Taisho 1), is a grand, traditional pure-wooden temple structure renowned for exquisite wood carvings and listed as a key historical building of Sapporo. Situated on the southern edge of Susukino, its serene surroundings stand just across the street from the bustling nightlife, testifying to Sapporo\u0027s full transformation from wilderness to Hokkaido\u0027s political and economic heart.", "name": "Higashi Honganji Sapporo Betsuin", "transport": "Approx. 1-min walk from Sapporo Streetcar \u0027Higashi-Honganji-Mae Station\u0027; or about 10-min walk from Subway Namboku Line \u0027Susukino Station\u0027."}, {"address": "1-20 Nakajima Koen, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Built in 1880 (Meiji 13), Hoheikan was originally constructed in the Odori area by the Development Commission as a high-end Western-style hotel for foreign dignitaries. Emperors of the Meiji, Taisho, and Showa eras all stayed here. In 1958, the entire structure was relocated to Nakajima Park just south of Susukino and designated an Important Cultural Property of Japan. The building features distinctive ultramarine blue exterior walls, baroque balconies, and an interior blending Western crystal chandeliers with Japanese lacquerware and plaster reliefs. As a masterpiece of pioneer-era Western architecture and imperial hospitality history, it holds immense architectural and historical value.", "name": "Hoheikan", "transport": "Approx. 5-min walk from Exit 3 of Sapporo Subway Namboku Line \u0027Nakajima-Koen Station\u0027 (located on the south side of the Susukino area)."}, {"address": "Kita 1-jo Nishi 2-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 3.8 Stars | Officially named the \u0027Former Sapporo Agricultural College Military Drill Hall\u0027, the Sapporo Clock Tower was built in 1878 (Meiji 11) upon the suggestion of Dr. William S. Clark, Vice-Principal of the college. It is Japan\u0027s oldest surviving pendulum clock tower and a designated Important Cultural Property. This charming wooden building in the American Western style features a clock operating since 1881 that still chimes clearly on the hour. The 1st floor displays historical artifacts from the agricultural college and pioneer archives, while the 2nd floor recreates the original drill hall. Located just minutes from Tanukikoji and Odori, it is Sapporo\u0027s quintessential central historic landmark.", "name": "Sapporo Clock Tower", "transport": "Approx. 3-min walk from Exit 7 of \u0027Odori Station\u0027 on the Sapporo Subway Namboku, Tozai, or Toho Line."}, {"address": "Odori Nishi 1-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Completed in 1957 (Showa 32), the 147.2-meter Sapporo TV Tower was designed by renowned architect Tachu Naito (who also designed Tokyo Tower) and stands at the eastern tip of Odori Park, just one street north of Tanukikoji Shopping Arcade. A significant post-war landmark symbolizing Sapporo\u0027s revival and broadcasting expansion, its large electronic clock\u2014donated by Matsushita Electric in 1961\u2014has served as a daily timekeeper for citizens ever since. From the 90-meter-high observation deck, visitors can enjoy 360-degree panoramic views of Odori Park across four seasons and Susukino\u0027s glittering nightlife. Its Showa-era steel framework architectural aesthetic remains widely cherished today.", "name": "Sapporo TV Tower", "transport": "Directly accessible from Exit 27 of Sapporo Subway Toho Line \u0027Odori Station\u0027; or approx. 5-min walk from Tanukikoji 1-chome."}, {"address": "Minami 1-jo Nishi 3-chome 8, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.0 Stars | Located at the vibrant intersection between Odori and Tanukikoji, Sapporo Mitsukoshi dates back to 1932 (Showa 7) as \u0027Mitsukoshi Sapporo Store\u0027, making it one of Hokkaido\u0027s oldest modern department store structures. Its exterior preserves the grand, classical design of early Showa commercial architecture, while the iconic bronze lion statues at the entrance have served as a beloved meeting spot for generations of Sapporo locals. Sapporo Mitsukoshi not only reflects the consumer economic history of Sapporo\u0027s growth from a modern trading hub to a metropolis, but its underground concourse also connects seamlessly to the Pole Town underground street, combining historic architectural elegance with modern shopping convenience.", "name": "Sapporo Mitsukoshi", "transport": "Directly connected via underground arcade from Sapporo Subway Namboku, Tozai, and Toho Line \u0027Odori Station\u0027; or approx. 2-min walk from Tanukikoji 3-chome."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "South 3-jo West 5-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 5-chome)", "feature": "\u2b50 4.1 stars | Located in Tanukikoji 5-chome, Tanuki Shrine (also known as Tanuki Mizu Jizo) is an iconic spiritual symbol and local cultural faith center of the Tanukikoji Shopping Street. Built in 1973 to celebrate the 100th anniversary of the shopping street, this mini shrine is dedicated to the Tanuki (raccoon dog) deity, worshipped for business prosperity, family safety, and matchmaking. The cute Tanuki statue beside the shrine is famous for a unique ritual: ladling water over different parts of the statue while making a sincere wish is believed to bring corresponding blessings\u2014such as wisdom by pouring water on its head or wealth by pouring water on its belly. It is not only a charming photo spot during a shopping trip, but also a fantastic corner to experience the rich human warmth and cultural faith of Sapporo\u0027s local shopping district.", "name": "Tanuki Shrine", "transport": "About a 5-minute walk from \u0027Susukino Station\u0027 (Namboku Line) or \u0027Odori Station\u0027 (Tozai Line)"}, {"address": "Odori Nishi 1-chome to Minami 1-jo Higashi 2-chome, Chuo-ku, Sapporo, Hokkaido (Inside the underground pedestrian walkway)", "feature": "\u2b50 4.3 stars | The 500m Museum of Art is Japan\u0027s first corridor-style contemporary art museum set inside a subway connecting passage. Located in the underground walkway connecting Odori Station and Bus Center-mae Station, it is extremely close to Tanukikoji 1-chome. This 500-meter-long gallery cleverly transforms an ordinary pedestrian passage into a vibrant public art gallery, regularly featuring paintings, photography, 3D installations, and digital multimedia works by emerging local Hokkaido and international artists. Here, locals and travelers can easily appreciate high-caliber contemporary art while strolling or shopping, seamlessly blending artistic expression into daily urban exploration.", "name": "Sapporo Odyssey 500m Museum of Art", "transport": "Direct access from \u0027Odori Station\u0027 (Tozai Line) or about a 2-minute walk from Tanukikoji 1-chome"}, {"address": "Kita 1-jo Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido (Sapporo Sosei Square 1st-2nd Floor)", "feature": "\u2b50 4.4 stars | Located inside Sapporo Sosei Square, SCARTS is a modern cultural hub adjacent to Tanukikoji 1-chome and the Susukino commercial district. Featuring avant-garde geometric architectural design, the building houses high-spec multi-purpose art performance halls, professional galleries, creative studios, and an open art library lounge area. Year-round, it hosts high-quality special exhibitions, contemporary visual art shows, craft design expos, and music salons. The first floor also offers a cozy cultural space blending books and coffee, allowing visitors to feel Sapporo\u0027s vibrant modern artistic pulse in a minimalist and comfortable environment. It is an urban cultural landmark with a distinct hip, artistic vibe.", "name": "Sapporo Cultural Arts Community Center SCARTS", "transport": "Direct access from Exit 30 of \u0027Odori Station\u0027 (Namboku/Tozai Line), or about a 3-minute walk from Tanukikoji 1-chome"}, {"address": "South 2-jo Higashi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Tucked away in a quiet neighborhood just east of Tanukikoji 1-chome, Hokkaido Jingu Tongu is a downtown branch shrine of the famous Hokkaido Shrine. Built during the Meiji period, it carries the sacred atmosphere of the main shrine in Maruyama. Its most notable feature is a pair of stone Komainu (guardian lions) believed to bring blessings for matchmaking and safe childbirth. Compared to the grandeur of the main shrine, Tongu offers a warm, intimate neighborhood shrine charm, adorned with classic wooden sanctuary architecture and seasonal flowers. Many shoppers from Susukino and Tanukikoji visit this quaint, serene shrine for peace of mind and good fortune.", "name": "Hokkaido Jingu Tongu", "transport": "About a 3-minute walk from Exit 6 of \u0027Bus Center-mae Station\u0027 (Tozai Line), or about 3 minutes on foot from the east end of Tanukikoji 1-chome"}, {"address": "South 2-jo Higashi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Located near the east side of Tanukikoji, Sapporo City Gallery was established in 1977 and is one of the city\u0027s most historic and representative public art venues. The gallery features several exhibition halls and art salon spaces, providing a platform for local Hokkaido creators, art academy students, and international art groups to display visual arts, calligraphy, sculpture, and photography. Exuding an elegant Showa-era artistic charm, the spacious and well-lit interior is the perfect place to feel the original creativity and grassroots artistic energy of Hokkaido, offering a peaceful cultural sanctuary away from the bustling commercial streets.", "name": "Sapporo City Gallery", "transport": "About a 3-minute walk from Exit 10 of \u0027Bus Center-mae Station\u0027 (Tozai Line), or about an 8-minute walk from Tanukikoji 1-chome"}, {"address": "Kita 1-jo Nishi 6-chome 10, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1881, Catholic Kita-Ichijo Church is one of Hokkaido\u0027s oldest Catholic churches, located just a short walk from Odori Park and the Tanukikoji shopping area. The current sanctuary blends Gothic and classical European design elements, featuring elegant spire architecture and vibrant, colorful stained glass windows. Inside, the wooden vaulted ceiling and retro wooden pews emit a tranquil and peaceful religious atmosphere. The church also preserves valuable historical artifacts left by Meiji-era missionaries. It is both a sacred sanctuary for worship and an unmissable historic landmark for lovers of historic architecture and sacred art.", "name": "Catholic Kita-Ichijo Church", "transport": "About a 5-minute walk from Exit 1 of \u0027Odori Station\u0027 (Namboku/Tozai Line)"}, {"address": "Kita 1-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 3.8 stars | Built in 1878 as the drill hall for the former Sapporo Agricultural College (now Hokkaido University), Sapporo Clock Tower is an Important Cultural Property of Japan, located just a 7-minute walk from Tanukikoji. This pure white, American frontier-style wooden building houses a refined historical museum. The first floor presents detailed historical documents and scale models of the clock tower and Sapporo\u0027s urban development, while the second floor preserves the spacious original drill hall and displays an American-made mechanical clockwork system that has accurately kept time for over a century. Visitors can dive deep into the story of Sapporo\u0027s modernization at this classic landmark blending history, art, and architecture.", "name": "Sapporo Clock Tower", "transport": "About a 5-minute walk from Exit 7 of \u0027Odori Station\u0027 (Namboku/Tozai Line), or about a 7-minute walk north from Tanukikoji 2-chome"}, {"address": "Odori Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Located at the eastern end of Odori Park near Tanukikoji 1-chome, Sapporo TV Tower features a rich city history and architectural culture exhibition area alongside its famous observation deck. The hall displays precious historic photographs, architectural blueprints, the evolution of Sapporo\u0027s skyline since the tower\u0027s completion in 1957, and the creative design process behind the iconic mascot, \u0027TV Tower Dad\u0027 (TV-Tosan). The exhibition hall also collaborates with local artists to hold themed art exhibits and light shows, allowing visitors to enjoy panoramic city views while immersing themselves in the rich cultural history and modern design charm of this landmark.", "name": "Sapporo TV Tower Exhibition Hall", "transport": "Direct access from Exit 27 of \u0027Odori Station\u0027 (Tozai/Namboku Line), or about a 3-minute walk from Tanukikoji 1-chome"}], "name": "Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Odori Nishi 1-chome to 12-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A 1.5 km long green oasis stretching east to west across central Sapporo, just a few minutes\u0027 walk from Tanukikoji Shopping Street. It offers distinct seasonal beauty: blooming lilacs in spring, lively beer gardens in summer, vibrant golden ginkgo and red maple foliage in autumn, and the world-famous Sapporo Snow Festival in winter. Featuring fountains, statues, and beautiful flowerbeds, it is the perfect spot for locals and tourists to relax.", "name": "Odori Park", "transport": "Direct access from Odori Station (Subway Namboku, Tozai, and Toho Lines), or a 3-5 minute walk from Tanukikoji Shopping Street."}, {"address": "Minami 1-jo Nishi 1-chome to Minami 4-jo Nishi 1-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | A linear waterfront park built along the Sosei River running through central Sapporo, located right at the junction of Tanukikoji 1-chome and the east side of Susukino. Lush greenery and seasonal flowers line the walkways alongside large public artworks by sculptors like Kan Yasuda. It offers a tranquil riverside stroll right next to the bustling commercial district.", "name": "Soseigawa Park", "transport": "About a 3-minute walk from Odori Station or Susukino Station (Subway Namboku Line), located right at the eastern end of Tanukikoji 1-chome."}, {"address": "1 Nakajimapark, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Selected as one of Japan\u0027s Top 100 Urban Parks, reachable by walking south from the Susukino entertainment district. The park features the expansive Shobu Pond, the century-old historic Hohei-kan building, and a Japanese garden. It boasts cherry blossoms in spring and spectacular ginkgo avenues with autumn foliage reflections in fall, making it a wonderful oasis to escape the hustle and bustle of Susukino.", "name": "Nakajima Park", "transport": "Direct access from Nakajima-koen Station (Subway Namboku Line), or about an 8-10 minute walk from Susukino Station."}, {"address": "Near Minami 4-jo Higashi 4-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A spacious riverside park located east of Susukino, stretching along the Toyohira River that flows through the city. It features broad lawns, dedicated cycling paths, and baseball fields. In summer, it hosts Sapporo\u0027s famous Doshin-UHB Fireworks Festival. Many people enjoy walking along the riverbank on cool summer evenings to appreciate the open skies and pleasant waterfront scenery.", "name": "Toyohira River Greenery Park", "transport": "About an 8-10 minute walk from Hosui-Susukino Station (Subway Toho Line), or about a 12-minute walk from central Susukino."}, {"address": "Kita 3-jo Nishi 8-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A natural treasure trove not far from the Tanukikoji and Odori shopping districts. Established in 1886, it is the second oldest botanical garden in Japan. It preserves temperate virgin forest and houses around 4,000 plant species, including an alpine garden, an ethnobotanical garden, and greenhouses. Walking through these towering ancient trees and shaded paths feels like stepping into a deep forest, offering a rich sense of history and ecology.", "name": "Botanic Garden, Hokkaido University", "transport": "About a 10-12 minute walk from Odori Station or Sapporo Station, or a 15-minute walk from the western end of Tanukikoji."}, {"address": "Kita 3-jo Nishi 6-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A classic European-style stroll garden centered around a pond surrounding the iconic Red Brick Government Building. The garden features native Hokkaido trees and flowers, including weeping willows, cherry blossoms, ginkgo trees, and a lily pond. In autumn, the pond reflects vibrant foliage alongside the century-old red brick architecture, creating a dreamy, elegant scene that serves as a historic green landmark between Susukino and Sapporo Station.", "name": "Former Hokkaido Government Office Building Garden", "transport": "About a 5-minute walk from Odori Station, or an 8-10 minute walk from Tanukikoji 4-chome."}, {"address": "Odori Nishi 13-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A historic garden situated at the far western end of Odori Park (Odori Nishi 13-chome), near the western end of Tanukikoji. Filled with blooming roses and seasonal greenery, it perfectly complements the Taisho-era stone and red-brick building, which is designated an Important Cultural Property. In early summer, flowers blossom in abundance, creating a peaceful, elegant atmosphere in a hidden green spot free from crowds.", "name": "Sapporo City Archive Museum Garden", "transport": "About a 1-minute walk from Exit 1 of Nishi-11-Chome Station (Subway Tozai Line), or a 10-12 minute walk from Tanukikoji 7-chome."}, {"address": "Kita 1-jo Nishi 16-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | An ultimate green oasis easily accessible from the west side of Tanukikoji. Spanning several hectares, this garden features soaring ancient trees, impeccably maintained lawn carpets, and quiet modern sculptures. The vibrant autumn leaves here are breathtaking, making it a fantastic off-the-beaten-path destination for visitors seeking peace and a warm embrace of nature.", "name": "Hokkaido Governor\u0027s Official Residence Garden", "transport": "About a 5-minute walk from Exit 4 of Nishi-18-Chome Station (Subway Tozai Line), or take a bus from the western end of Odori/Tanukikoji."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Minami 4-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido (Susukino Crossing)", "feature": "\u2b50 4.5 Stars | Located at the heart of the Susukino intersection, this iconic giant signboard featuring the vivid \u0027King of Blenders\u0027 illuminates the night with brilliant neon lights. It is Susukino\u0027s most recognizable landmark and a must-snap spot for every visitor. Posing with this luminous backdrop at the corner perfectly captures the dazzling charm of Sapporo\u0027s bustling city night.", "name": "Giant NIKKA Whisky Signboard", "transport": "About a 1-minute walk from Exit 3 of Susukino Station on the Sapporo Subway Namboku Line"}, {"address": "Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 5-chome)", "feature": "\u2b50 4.2 Stars | Located in Tanukikoji 5-chome, Tanuki Shrine serves as the guardian deity of the entire shopping arcade, housing a cute statue of the Tanuki (raccoon dog) Jizo. Legend has it that touching different parts of the statue brings good fortune in business, academic success, or romantic connections. Surrounded by incense and lit by signature lanterns along the arcade, it exudes an authentic local downtown vibe combined with retro charm.", "name": "Tanuki Shrine \u0026 Tanukikoji Arcade", "transport": "About a 5-minute walk from Odori Station or Susukino Station on the Sapporo Subway Namboku Line"}, {"address": "1-1 Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Perched on the rooftop of the NORBESA shopping complex, the giant yellow Ferris wheel \u0027Noria\u0027 is a dazzling landmark against the Susukino night sky. Soaring 78 meters into the air, a ride offers a panoramic view of the bustling neon-lit nightscapes. Its striking yellow steel framework and massive structure also serve as a fantastic backdrop for ground-level photography capturing modern city streetscapes.", "name": "NORBESA Ferris Wheel (Noria)", "transport": "About a 4-minute walk from Exit 2 of Susukino Station on the Sapporo Subway Namboku Line"}, {"address": "1F Dai-4 Midori Kaikan, Minami 5-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 Stars | Tucked away in the alleys of Susukino, Ganso Sapporo Ramen Yokocho greets visitors with a retro red-and-blue neon entrance sign. This narrow lane hosts over a dozen historic miso ramen shops. Steam-filled alleyways paired with glowing Japanese lanterns create a nostalgic Showa-era food alley atmosphere, making it a fantastic photo spot for capturing Sapporo\u0027s authentic nightlife and food culture.", "name": "Ganso Sapporo Ramen Yokocho Entrance Sign", "transport": "About a 3-minute walk from Exit 3 of Susukino Station on the Sapporo Subway Namboku Line"}, {"address": "20 Minami 2-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Located at the corner of Tanukikoji 3-chome, moyuk SAPPORO is a modern landmark complex featuring sleek design and aesthetic spaces. Its upper floors house \u0027AOAO SAPPORO\u0027, an urban aquarium combining artistic lighting, minimalist tanks, and penguin exhibits. Creating a dreamlike underwater world, it is a hugely popular spot for young travelers looking to take stylish, atmospheric photos.", "name": "moyuk SAPPORO \u0026 Urban Aquarium AOAO SAPPORO", "transport": "About a 3-minute walk from Odori Station on the Sapporo Subway Namboku Line, or a 1-minute walk from Tanukikoji Station on the Sapporo Streetcar"}, {"address": "Minami 3-jo Nishi 7-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Unlike the modernized shopping sections of earlier blocks, Tanukikoji 7-chome retains a strong vintage Showa charm with wooden accents and faded steel arcade ceilings. Home to quirky bars, vintage clothing stores, and late-night eateries, the warm streetlamps cast a cinematic glow at night, making it a hidden gem for street photographers and fans of retro aesthetics.", "name": "Tanukikoji 7-Chome Retro Arcade Street", "transport": "About a 3-minute walk from Nishi-Hachichome Station on the Sapporo Streetcar, or accessible directly on foot from Tanukikoji 6-chome"}, {"address": "12-1 Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Situated at the intersection of Tanukikoji 4-chome and Ekimae-dori, MEGA Don Quijote Sapporo features a multi-story facade adorned with a giant mural of Donpen, the penguin mascot, alongside luminous 3D signage. Besides being a 24-hour shopping hot spot, its vibrant facade and bustling street corner offer a classic photo backdrop representing Sapporo\u0027s pop shopping culture.", "name": "MEGA Don Quijote Sapporo Plaza", "transport": "About a 4-minute walk from Susukino Station or Odori Station on the Sapporo Subway Namboku Line, or direct access from Tanukikoji Station on the Sapporo Streetcar"}, {"address": "Area around Minami 4-jo Nishi 3-chome to Minami 6-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | As one of Japan\u0027s top three entertainment districts, Susukino spans from Minami 4-jo to Minami 6-jo and is packed with thousands of restaurants, bars, and clubs. At night, the entire district comes alive with brilliant colorful neon signboards, light trails from traffic, and lively crowds\u2014creating a vibrant, cyberpunk-esque nightscape that photography enthusiasts shouldn\u0027t miss.", "name": "Susukino Neon Night Streetscape", "transport": "Directly accessible upon exiting Susukino Station on the Sapporo Subway Namboku Line"}], "name": "Popular Photo Spots"}}, "name": "Susukino and Tanukikoji Shopping Street"}};
        const cityName = "Hokkaido";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
