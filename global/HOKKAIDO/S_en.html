    <script>
        const schedulePool = [{"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.2 stars | Japan\u0027s oldest existing clock tower and an iconic historical landmark in Sapporo. Inside, it exhibits precious artifacts from the Kaitakushi (Development Commission) era and the fascinating mechanical inner workings of the clock.", "duration": "1 hour", "title": "Sapporo Clock Tower", "transport": "About a 10-minute walk from JR Sapporo Station, or a 5-minute walk from Odori Station on the Namboku Subway Line"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Affectionately known as the \"Red Brick Office,\" this Neo-Baroque building displays historical documents on Hokkaido\u0027s development. Its surrounding gardens offer pleasant, picturesque views year-round.", "duration": "1-2 hours", "title": "Former Hokkaido Government Office", "transport": "About an 8-minute walk from JR Sapporo Station, or a 9-minute walk from Odori Subway Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.6 stars | The chief Shinto shrine of Hokkaido, nestled in a serene environment surrounded by ancient trees. A famous spot for cherry blossom viewing in spring, it is a must-visit to experience traditional Japanese shrine culture and worship.", "duration": "1.5-2 hours", "title": "Hokkaido Shrine", "transport": "Take the Tozai Subway Line to Maruyama Koen Station, then walk for about 15 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Lined with preserved stone warehouses from the pioneer era, the canal glows with vintage gas lamps at twilight, creating a deeply romantic and nostalgic atmosphere.", "duration": "1-2 hours", "title": "Otaru Canal", "transport": "About a 10-minute walk from JR Otaru Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.4 stars | A specialty music box store housed in a heritage building, featuring a famous steam clock at the entrance and thousands of exquisitely crafted music boxes inside.", "duration": "1 hour", "title": "Otaru Music Box Museum Main Hall", "transport": "About a 7-minute walk from JR Minami-Otaru Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.6 stars | Japan\u0027s renowned Western-style star-shaped fortress. Ascend the Goryokaku Tower to admire its unique star shape from above. It is a famous historic site and a top cherry blossom viewing destination.", "duration": "2-3 hours", "title": "Hakodate Goryokaku Park", "transport": "Take the Hakodate City Tram to Goryokaku Koen-mae Station, then walk for about 15 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.3 stars | Converted from Meiji-era port warehouses, this vibrant complex combines dining, creative goods, and shopping while exuding a rich historical port-town charm.", "duration": "2 hours", "title": "Kanemori Red Brick Warehouse", "transport": "Take the Hakodate City Tram to Jujigai Station, then walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.7 stars | Awarded three stars by the Michelin Green Guide, this famous million-dollar night view features dazzling city lights framed by a unique dual-curved coastline, offering Hakodate\u0027s most breathtaking visual feast.", "duration": "2 hours", "title": "Mt. Hakodate Ropeway \u0026 Night View Observatory", "transport": "Take the Hakodate City Tram to Jujigai Station, walk about 10 minutes to the ropeway station, then take a 3-minute ropeway ride to the summit"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.6 stars | Japan\u0027s northernmost famous zoo, renowned for its unique \"behavioral exhibits\" that allow visitors to observe penguin walks and polar bears swimming up close.", "duration": "3-4 hours", "title": "Asahiyama Zoo", "transport": "About a 40-minute local bus ride from JR Asahikawa Station"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | A dramatic geothermal landscape formed by volcanic eruptions, billowing white steam and bubbling sulfur springs. Well-maintained boardwalks offer a unique perspective on this natural marvel.", "duration": "1.5-2 hours", "title": "Noboribetsu Jigokudani (Hell Valley)", "transport": "Take the Donan Bus from JR Noboribetsu Station to Noboribetsu Onsen Station, then walk for about 10 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.4 stars | A European castle-themed chocolate factory park dedicated to the famous Shiroi Koibito confectionery, where you can observe cookie production and enjoy hands-on cookie decorating workshops.", "duration": "2-3 hours", "title": "Shiroi Koibito Park", "transport": "Take the Tozai Subway Line to Miyanosawa Station, then walk for about 7 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.2 stars | An iconic landmark located at the eastern end of Odori Park. Its observation deck offers a 360-degree panoramic view of downtown Sapporo and the ever-changing seasonal beauty of Odori Park.", "duration": "1 hour", "title": "Sapporo TV Tower", "transport": "Direct access from Odori Station on the Tozai or Namboku Subway Lines"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.4 stars | A historic green oasis in central Sapporo, featuring the picture-perfect Japanese Garden and Hohei-kan, an Important Cultural Property of Japan. Picturesque views await in every season.", "duration": "1.5-2 hours", "title": "Nakajima Park", "transport": "Direct access from Nakajima-Koen Station on the Namboku Subway Line"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | Designed by famed sculptor Isamu Noguchi, the entire park is conceived as a single grand sculpture, featuring breathtaking glass pyramids and artistic rolling hills.", "duration": "2-3 hours", "title": "Moerenuma Park", "transport": "Take the Chuo Bus from Kanjodori-Higashi Station on the Toho Subway Line for about 25 minutes"}, {"category": "\ud83c\udfdb\ufe0f Sightseeing \u0026 Culture", "description": "\u2b50 4.5 stars | An open-air history museum showcasing relocated and restored buildings from all over Hokkaido dating from the Meiji to early Showa eras, recreating the daily life of pioneer times.", "duration": "3 hours", "title": "Historical Village of Hokkaido", "transport": "Take the JR Bus from JR Shin-Sapporo Station and get off at the Historical Village of Hokkaido stop"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.3 stars | Japan\u0027s only museum dedicated to beer, housed in an elegant red-brick building. It exhibits the history of Japanese beer brewing and offers beer-tasting experiences.", "duration": "1.5 hours", "title": "Sapporo Beer Museum", "transport": "About a 10-minute walk from Higashi-kuyakusho-mae Station on the Toho Subway Line"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Selected as one of Japan\u0027s New Three Major Night Views. Take the ropeway to the summit for a sweeping, breathtaking night view of Sapporo.", "duration": "2 hours", "title": "Mt. Moiwa Ropeway", "transport": "Take the Sapporo Streetcar to \"Ropeway Iriguchi\" Station, then transfer to the free shuttle bus for about 5 minutes to the ropeway station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | Hokkaido\u0027s first National Ainu Museum dedicated to indigenous culture. It passes down precious Ainu traditions through traditional dance performances and craft workshops.", "duration": "2.5 - 3 hours", "title": "Upopoy (Symbolic Space for Ethnic Harmony)", "transport": "About a 10-minute walk from JR Shiraoi Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.4 stars | One of Otaru\u0027s iconic landmarks. A 4-minute ropeway ride brings you to the summit, offering panoramic views of Otaru Port and cityscape\u2014one of Otaru\u0027s top three night views.", "duration": "1.5 - 2 hours", "title": "Otaru Tenguyama Ropeway", "transport": "About 20 minutes by Chuo Bus from JR Otaru Station to \"Tenguyama Ropeway\" Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | An open-air museum preserving and exhibiting actual Meiji-era prison buildings of Abashiri, portraying a powerful and real chapter of Hokkaido\u0027s pioneer history.", "duration": "2 - 3 hours", "title": "Abashiri Prison Museum", "transport": "About 10 minutes by Abashiri Bus from JR Abashiri Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | A theme park recreating an Edo-period townscape. Enjoy thrilling ninja shows and oiran performances, and experience strolling through historic streets in a kimono.", "duration": "2 - 3 hours", "title": "Noboribetsu Date Jidaimura", "transport": "About 15 minutes by Donan Bus from JR Noboribetsu Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.8 stars | A world-class night view awarded three stars by the Michelin Green Guide, featuring a stunning look at the iconic dual-curved bay and sparkling city lights.", "duration": "1 - 2 hours", "title": "Mt. Hakodate Observatory", "transport": "About 11 minutes by bus from JR Hakodate Station to Mt. Hakodate Ropeway Station, then a 3-minute ropeway ride to the summit"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | Ascend the observation deck for a full aerial view of the unique star-shaped fortress ruins, which transforms into a breathtaking vantage point over thousands of blooming cherry blossoms in spring.", "duration": "1 - 2 hours", "title": "Goryokaku Tower", "transport": "Take the Hakodate Streetcar to \"Goryokaku-koen-mae\" Station and walk for about 15 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.5 stars | An elegant historic red-brick building offering thousands of exquisite music boxes for sale, with a rare steam clock at the entrance that chimes every 15 minutes.", "duration": "1 - 2 hours", "title": "Otaru Music Box Museum Main Hall", "transport": "About a 7-minute walk from JR Minami-Otaru Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.6 stars | A dreamlike park combining a chocolate factory tour with European-style gardens, where you can bake your own customized chocolate cookies.", "duration": "2 - 3 hours", "title": "Shiroi Koibito Park", "transport": "Take the Sapporo Tozai Subway Line to \"Miyanosawa\" Station and walk for about 7 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.7 stars | Preserves and displays authentic Meiji-era prison structures, bringing historical inmate life back to view through realistic wax figures.", "duration": "2 - 3 hours", "title": "Abashiri Prison Museum", "transport": "About 10 minutes by Abashiri Bus (Tourist Facility Shuttle Line) from JR Abashiri Station"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b50 4.0 stars | An iconic Sapporo landmark built in 1878, recognized as Japan\u0027s oldest existing clock tower and designated an Important Cultural Property.", "duration": "1 hour", "title": "Sapporo Clock Tower", "transport": "Take the Namboku, Tozai, or Toho Subway Line to \"Odori\" Station and walk for about 5 minutes"}, {"category": "\ud83c\udfdb\ufe0f Attractions \u0026 Culture", "description": "\u2b5 onnected to JR Asahikawa Station, about a 1-minute walk"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.3 stars | A massive underground shopping arcade connecting Odori Station and Susukino Station, packed with clothing boutiques, lifestyle stores, and restaurants\u2014allowing for comfortable shopping even in rain or snow.", "duration": "2-3 hours", "title": "Sapporo Underground Street (Pole Town \u0026 Aurora Town)", "transport": "Direct access from Odori Station or Susukino Station on the Namboku, Tozai, and Toho Subway Lines"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.1 stars | Japan\u0027s first permanent pedestrian mall shopping street, lined with department stores, izakayas, and local specialty drugstores.", "duration": "1-2 hours", "title": "Asahikawa Heiwadori Shopping Park", "transport": "Right outside the North Exit of JR Asahikawa Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.4 stars | Converted from a historic complex of red brick warehouses, including Meijikan and Bay Hakodate. It offers various Hakodate specialty crafts, desserts, and souvenirs.", "duration": "2-3 hours", "title": "Hakodate Kanemori Red Brick Warehouses", "transport": "About a 5-minute walk from Jujigai Station on the Hakodate City Tram"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.2 stars | A large indoor outlet mall in Hokkaido housing numerous world-renowned international brands and local Japanese brands, offering comfortable shopping across all four seasons.", "duration": "3-4 hours", "title": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "About 50 minutes by direct bus from JR Sapporo Station, or about 30 minutes by bus from New Chitose Airport"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.3 stars | A new commercial complex integrated with the urban aquarium AOAO SAPPORO, boasting a rich variety of unique retail shops and dining choices.", "duration": "1-2 hours", "title": "moyuk SAPPORO", "transport": "About a 3-minute walk from Odori Station on the Namboku Line, directly connected to Tanukikoji 3-chome"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.5 stars | A street rich in historic charm, featuring famous souvenir shops such as Kitaichi Glass, Otaru Music Box Museum, Rokkatei, and Kitakaro.", "duration": "2-3 hours", "title": "Otaru Sakaimachi Street", "transport": "About a 10-minute walk from JR Minami-Otaru Station or Otaru Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.1 stars | A large commercial complex redeveloped on the former site of the Kaitakushi Beer Brewery, featuring a high-ceilinged glass atrium greenhouse and a charming atmosphere.", "duration": "2-3 hours", "title": "Sapporo Factory", "transport": "About a 5-minute walk from Bus Center-Mae Station on the Tozai Subway Line"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.0 stars | A large shopping mall adjacent to the Sapporo Beer Museum, featuring a hypermarket, various fashion brand shops, and family facilities, making it ideal for family visits.", "duration": "2-3 hours", "title": "Ario Sapporo Shopping Center", "transport": "About an 8-minute walk from JR Naebo Station, or about a 15-minute walk from Higashi-Kuyakusho-Mae Station on the Toho Subway Line"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.2 stars | One of Hokkaido\u0027s top three markets, famous for its \u0027Katte-don\u0027 experience where visitors select their own fresh seafood toppings for a custom rice bowl.", "duration": "1-2 hours", "title": "Kushiro Washo Market", "transport": "About a 5-minute walk from JR Kushiro Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.3 stars | Hakodate\u0027s iconic seafood market gathering hundreds of stalls selling fresh king crab, sea urchin, and scallops, alongside interactive live squid fishing.", "duration": "1-2 hours", "title": "Hakodate Morning Market", "transport": "About a 2-minute walk from JR Hakodate Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.1 stars | A historic market located in the heart of Sapporo, bringing together fresh Hokkaido seafood, fruits, vegetables, and dried goods. You can also enjoy a sumptuous kaisendon (seafood bowl) here.", "duration": "1-2 hours", "title": "Nijo Market", "transport": "About a 3-minute walk from Bus Center-mae Station on the Tozai Subway Line, or a 5-minute walk from Odori Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 3.9 stars | A representative covered arcade shopping street in downtown Obihiro, surrounded by many local souvenir shops, izakayas, and famous pork bowl (butadon) eateries.", "duration": "1-2 hours", "title": "Obihiro Hirokoji Shopping Street", "transport": "About a 5-minute walk from JR Obihiro Station"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 4.0 stars | The central street of the Noboribetsu Onsen area, steeped in hot spring town charm and lined with demon-themed souvenir shops and local snacks.", "duration": "1-2 hours", "title": "Noboribetsu Onsen Gokuraku Dori Shopping Street", "transport": "Transfer to a Donan Bus from JR Noboribetsu Station, get off at Noboribetsu Onsen Station, and walk about 3 minutes"}, {"category": "\ud83d\udecd\ufe0f Shopping \u0026 Commercial Districts", "description": "\u2b50 3.8 stars | An open-air outlet mall adjacent to New Chitose Airport, offering a wide selection of brands and a relaxed shopping en             if (cartDrawer.classList.contains('drawer-closed')) {

                mobileOverlay.classList.add('hidden');

        // Smart Route Sorting Algorithm
        function autoSortDay(day) {
            let trips = myTrip[day];
            if(trips.length < 2) {
                alert("Need at least 2 activities to sort!");
                return;
            }
            
            trips.sort((a, b) => {
                let nodeA = (a.transport || "").substring(0, 6);
                let nodeB = (b.transport || "").substring(0, 6);
                
                if (nodeA < nodeB) return -1;
                if (nodeA > nodeB) return 1;
                return 0;
            });
            
            alert(`✨ Day ${day}'s itinerary has been smartly optimized based on transit nodes!`);
            renderCart();
        }

        function scrollFilters(direction) {

            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function filterCategory(category) {

                const btn = document.getElementById(`cat-${cat}`);
                if(btn) {
                    if(cat === category) {
                        btn.className = "filter-btn-active text-xs md:text-sm px-4 py-2 rounded-full border font-bold whitespace-nowrap transition-colors shadow-sm";
                    } else {
                        btn.className = "filter-btn-inactive text-xs md:text-sm px-4 py-2 rounded-full border font-medium whitespace-nowrap transition-colors shadow-sm";

                }

        function renderPool() {

                    const title = item.title || '';

                    const filterLower = currentFilter.toLowerCase();

                    if (filterLower.includes('attraction')) {
                        if (fullText.includes('attraction') || fullText.includes('culture') || fullText.includes('history') || fullText.includes('景點') || fullText.includes('文藝') || fullText.includes('打卡')) return true;
                    }
                    if (filterLower.includes('shopping')) {
                        if (fullText.includes('shopping') || fullText.includes('market') || fullText.includes('mall') || fullText.includes('購物') || fullText.includes('商圈') || fullText.includes('市集')) return true;
                    }
                    if (filterLower.includes('dining')) {
                        if (fullText.includes('dining') || fullText.includes('cafe') || fullText.includes('restaurant') || fullText.includes('美食') || fullText.includes('咖啡') || fullText.includes('名店')) return true;
                    }
                    
                    return cat.toLowerCase().includes(filterLower);
                });
            }

            if(data.length === 0) {
                poolContainer.innerHTML = `<div class="text-center text-gray-400 py-10 font-medium md:text-lg">No data available for this category</div>`;
                return;
            }

            data.forEach((item, index) => {

                let category = activeTab === 'schedule' ? (item.category || 'Featured') : 'Intercity Transport';
                let duration = activeTab === 'schedule' ? item.duration : item.time;
                let transport = activeTab === 'schedule' ? item.transport : item.method;
                let desc = activeTab === 'schedule' ? item.description : 'Suitable for intercity or cross-border travel.';

                let catLower = category.toLowerCase();
                let badgeColor = "bg-slate-50 text-slate-600 border-slate-200";
                
                if(catLower.includes('attraction') || catLower.includes('culture') || catLower.includes('景點') || catLower.includes('文藝')) badgeColor = "bg-sky-50 text-sky-700 border-sky-200";
                if(catLower.includes('shopping') || catLower.includes('market') || catLower.includes('購物') || catLower.includes('商圈')) badgeColor = "bg-purple-50 text-purple-700 border-purple-200";
                if(catLower.includes('dining') || catLower.includes('cafe') || catLower.includes('美食') || catLower.includes('名店')) badgeColor = "bg-amber-50 text-amber-700 border-amber-200";

        function changeDay(day) {
            currentDay = parseInt(day);

        function addToTrip(type, identifier) {
            let pool = type === 'schedule' ? schedulePool : intercityPool;
            let rawItem = pool.find(i => (i.title === identifier || i.route === identifier));
            if(!rawItem) return;

            let tripItem = {
                title: type === 'schedule' ? rawItem.title : rawItem.route,
                duration: type === 'schedule' ? rawItem.duration : rawItem.time,
                transport: type === 'schedule' ? rawItem.transport : rawItem.method,
                iconColor: type === 'schedule' ? 'bg-sky-500' : 'bg-indigo-500',
                borderStyle: type === 'schedule' ? 'border-sky-100' : 'border-indigo-100'
            };

            if(myTrip[currentDay].find(t => t.title === tripItem.title)) {
                alert(`"${tripItem.title}" is already in Day ${currentDay}'s itinerary!`);
                return;
            }
            myTrip[currentDay].push(tripItem);
            
            // Mobile Interaction: Animate FAB to indicate item added
            if (window.innerWidth < 1024) {
                let fab = document.getElementById('fab-cart');
                fab.classList.add('scale-110');
                setTimeout(() => fab.classList.remove('scale-110'), 300);
            }

            renderCart();
        }

        function removeFromTrip(index) {
            myTrip[currentDay].splice(index, 1);
            renderCart();
        }

                card.innerHTML = `
                    ${line}
                    <div class="relative z-10 flex gap-4">
                        <div class="shrink-0 w-7 h-7 rounded-full ${item.iconColor} text-white flex items-center justify-center text-xs font-bold mt-1.5 shadow-sm ring-4 ring-white">
                            ${index + 1}
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="font-bold text-gray-800 text-base md:text-lg leading-tight pr-4">${item.title}</h4>
                                <button onclick="removeFromTrip(${index})" class="text-gray-300 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 rounded-lg p-2 transition-colors border border-transparent hover:border-rose-100">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            <div class="inline-flex bg-rose-50 text-rose-600 text-xs md:text-sm px-2.5 py-1 rounded-md font-bold mb-3 items-center gap-1 border border-rose-100">
                                <i class="fa-regular fa-clock"></i> ${item.duration}
                            </div>
                            <div class="text-xs md:text-sm text-gray-700 bg-slate-50 p-3.5 rounded-xl border border-slate-100 leading-snug flex items-start gap-3">
                                <span class="${item.iconColor === 'bg-sky-500' ? 'text-sky-500' : 'text-indigo-500'} mt-0.5 shrink-0 text-base">
                                    <i class="fa-solid ${item.iconColor === 'bg-sky-500' ? 'fa-location-dot' : 'fa-ship'}"></i>
                                </span>
                                <span class="font-medium">${item.transport}</span>
                            </div>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(card);
            });
        }

        window.onload = () => {
            renderPool();
        };

        // --- Trip Export & Sharing ---
        function generateTripText() {
            let text = `✈️ ${cityName} Exclusive Itinerary\n===================\n`;
            let hasAnyTrip = false;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    hasAnyTrip = true;
                    text += `\n📌 Day ${day}\n`;
                    trips.forEach((item, idx) => {
                        text += `  ${idx + 1}. ${item.title} (${item.duration})\n     👉 Transport: ${item.transport}\n`;
                    });
                }
            }
            if (!hasAnyTrip) return null;
            text += `\n✨ Generated by ${cityName} Smart Travel Planner`;
            return text;
        }

        function shareToLine() {
            let tripText = generateTripText();
            if (!tripText) { alert("No itinerary to share yet!"); return; }
            navigator.clipboard.writeText(tripText).then(() => {
                alert("📋 Itinerary copied to clipboard! Opening LINE to share...");
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            }).catch(() => {
                window.open(`https://line.me/R/msg/text/?` + encodeURIComponent(tripText), '_blank');
            });
        }

        function openPrintWindow() {
            let hasAnyTrip = false;
            for (let day = 1; day <= totalDays; day++) {
                if ((myTrip[day] || []).length > 0) { hasAnyTrip = true; break; }
            }
            if (!hasAnyTrip) { alert("No itinerary to export yet!"); return null; }

            let printWindow = window.open('', '_blank');
            let htmlContent = `
                <html>
                <head>
                    <title>${cityName} Travel Itinerary</title>
                    <style>
                        body { font-family: 'Noto Sans TC', sans-serif; padding: 20px; color: #333; line-height: 1.6; background: #fff; }
                        h1 { color: #0284c7; border-bottom: 2px solid #bae6fd; padding-bottom: 10px; text-align: center; margin-bottom: 30px; }
                        .day-page { 
                            background: #f8fafc; 
                            padding: 30px; 
                            border-radius: 16px; 
                            border: 1px solid #cbd5e1; 
                            margin-bottom: 40px; 
                            page-break-after: always;
                            break-after: page;
                        }
                        h3 { margin-top: 0; color: #0369a1; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; font-size: 1.4em; }
                        ul { padding-left: 20px; margin: 15px 0; }
                        li { margin-bottom: 15px; font-size: 1.1em; }
                        .transport { font-size: 0.95em; color: #475569; display: block; margin-top: 4px; }
                        .duration { color: #e11d48; font-weight: bold; }
                        .footer { text-align: center; color: #94a3b8; font-size: 0.9em; margin-top: 20px; }
                    </style>
                </head>
                <body>
                    <h1>✈️ ${cityName} Exclusive Travel Itinerary</h1>
            `;
            
            for (let day = 1; day <= totalDays; day++) {
                let trips = myTrip[day] || [];
                if (trips.length > 0) {
                    htmlContent += `
                        <div class="day-page">
                            <h3>📌 Day ${day}</h3>
                            <ul>
                    `;
                    trips.forEach((item) => {
                        htmlContent += `
                            <li>
                                <strong>${item.title}</strong> <span class="duration">(${item.duration})</span>
                                <span class="transport">👉 Transport: ${item.transport}</span>
                            </li>
                        `;
                    });
                    htmlContent += `</ul><div class="footer">${cityName} Smart Travel Guide • Daily Itinerary</div></div>`;
                }
            }
            htmlContent += `</body></html>`;
            
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            printWindow.focus();
            return printWindow;
        }

        function exportPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => {
                    alert("💡 Tip: In the print dialog, change 'Destination' to 'Save as PDF' to export!");
                    win.print();
                }, 500);
            }
        }

        function printPdf() {
            let win = openPrintWindow();
            if (win) {
                setTimeout(() => { win.print(); }, 500);
            }
        }
    </script>
