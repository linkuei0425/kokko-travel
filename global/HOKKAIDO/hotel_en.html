ho, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Featuring minimalist modern style and exceptional value, Guesthouse Otaru YaDo boasts a prime location near the Otaru Canal. Dorm beds are thoughtfully designed with privacy curtains, reading lights, and personal lockers for maximum comfort and security. With clean, bright bathroom facilities and a 24-hour lounge, guests can recharge anytime. It is an excellent budget-friendly choice for exploring Otaru Canal and nearby attractions.", "name": "Guesthouse Otaru YaDo", "transport": "Approx. 5-minute walk from JR Otaru Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Guesthouse%2520Otaru%2520YaDo", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520Guesthouse%2520Otaru%2520YaDo", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20Guesthouse%20Otaru%20YaDo", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Guesthouse%20Otaru%20YaDo%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1-8-12 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Otaru-An is a charming private traditional Japanese holiday home that beautifully captures the aesthetic of a historical Hokkaido merchant residence. The interior features a spacious tatami living room, tranquil wooden bedrooms, a fully equipped modern kitchen, and full bath facilities, providing complete privacy for families or groups of friends. Located within easy walking distance of Otaru Canal and Sakaimachi Street, it is ideal for soaking in Otaru\u0027s romantic vibe.", "name": "Otaru Tabi-no-Yado Otaru-An", "transport": "Approx. 7-minute walk from JR Otaru Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Otaru%2520Tabi-no-Yado%2520Otaru-An", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520Otaru%2520Tabi-no-Yado%2520Otaru-An", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20Otaru%20Tabi-no-Yado%20Otaru-An", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Otaru%20Tabi-no-Yado%20Otaru-An%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1-10 Yamadacho, Otaru, Hokkaido", "feature": "\u2b50 4.8 stars | Villa Masyu is a modern, luxury private holiday villa crafted for travelers seeking premium quality and privacy. The stylish apartment features a designer living area, high-end bedding, private bathrooms, a fully equipped gourmet kitchen, and a washing machine\u2014making it perfect for families or extended stays. Ideally located near the night views of Otaru Canal and Sakaimachi Street\u0027s glass art district, it offers an exclusive luxury living experience.", "name": "Villa Masyu Otaru Private Holiday Apartment", "transport": "Approx. 12-minute walk from JR Otaru Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Villa%2520Masyu%2520Otaru%2520Private%2520Holiday%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520Villa%2520Masyu%2520Otaru%2520Private%2520Holiday%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20Villa%20Masyu%20Otaru%20Private%20Holiday%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026d aru Canal Villa Kaisei", "transport": "Approx. 10-minute walk from JR Otaru Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Otaru%2520Canal%2520Villa%2520Kaisei", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520Otaru%2520Canal%2520Villa%2520Kaisei", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20Otaru%20Canal%20Villa%20Kaisei", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Otaru%20Canal%20Villa%20Kaisei%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Unique Apartments \u0026 Guesthouses"}}, "name": "Otaru Canal and Sakaimachi Street"}, "sapporo_station_odori": {"categories": {"cat_1": {"items": [{"address": "5 Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | An ultimate landmark luxury hotel directly connected to JR Sapporo Station, located on the upper floors of JR Tower, offering peerless panoramic views of Sapporo city. Features the natural hot spring \u0027Sky Resort Spa Sky Lounge\u0027 on the 22nd floor, allowing guests to soak while gazing down at the bustling nightscape from 100 meters above. The rooms are elegantly modern with attentive service, and the breakfast buffet uses premium local Hokkaido ingredients. It is widely considered a premier luxury choice for both business and leisure travelers.", "lat": 43.0682182, "lng": 141.3523816, "name": "JR Tower Hotel Nikko Sapporo", "transport": "Directly connected to the East Ticket Gate of JR Sapporo Station, about a 1-minute walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520JR%2520Tower%2520Hotel%2520Nikko%2520 -ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A premier landmark hotel west of Sapporo Station, renowned for spacious, comfortable rooms and exceptional dining. Offers exclusive high-floor luxury room types with sweeping views of the city skyline and lush botanical gardens. Amenities include a gym, indoor pool, and a top-notch buffet restaurant serving Hokkaido seafood and Wagyu beef\u2014the customizable seafood bowl at breakfast is a major highlight. Family-friendly features and comprehensive concierge services make it a top-rated luxury choice for families and business travelers alike.", "lat": 43.0664333, "lng": 141.3449756, "name": "Keio Plaza Hotel Sapporo", "transport": "About a 5-minute walk from the West Exit of JR Sapporo Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Keio%2520Plaza%2520Hotel%2520Sapporo", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0664333%2C141.3449756", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0664333,141.3449756", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Keio%20Plaza%20Hotel%20Sapporo%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1-2 Kita 4-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A luxury boutique hotel situated right in front of the Former Hokkaido Government Office Building (Red Brick Office), offering stunning four-season views. The design integrates Hokkaido forest and natural elements into a high-texture, modern Japanese aesthetic. Features stylish marble-accented public baths for relaxing after a long day. The breakfast is highly acclaimed by luxury travelers, serving pan-seared scallops, three-seafood bowls, and rich Hokkaido dair dern design with outstanding value. Designed around the concept of \u0027Relaxation and Refreshment,\u0027 rooms are equipped with premium mattresses and iPad room controls; select room types even feature luxury massage chairs or leg massagers to soothe travel fatigue. The ambience is elegant and comfortable, and the breakfast spread offers rich Hokkaido-style dishes along with freshly baked bread, making it a fantastic choice for guests valuing both comfort and convenience.", "name": "FORZA Hotel Sapporo Station", "transport": "Approx. 4-minute walk from JR Sapporo Station South Exit", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520FORZA%2520Hotel%2520Sapporo%2520Station", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520FORZA%2520Hotel%2520Sapporo%2520Station", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20FORZA%20Hotel%20Sapporo%20Station", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=FORZA%20Hotel%20Sapporo%20Station%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "4-1-2 Kita 7-jo Nishi, Kita-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Prime-positioned just a 1-minute walk from the North Exit of JR Sapporo Station, this is the Keikyu Group\u0027s first chain hotel in Hokkaido. The hotel features smart self-check-in and check-out kiosks for a smooth and fast process. Guest rooms feature soft, warm color tones, plush mattresses, and deep soaking tubs to ensure full relaxation. Surrounded by convenience stores and budget-friendly eateries, it offers unbeatable transit convenience for JR trains heading to Otaru or New Chitose Airport. Exceptional quality paired with budget-friendly rates makes it a top stay for business and solo travelers alike.", "lat": 43.0687269, "lng": 141.3488882, "name": "Keikyu EX Hotel Sapporo", "transport": "Approx. 1-minute walk from JR Sapporo Station North Exit", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Keikyu%2520EX%2520Hotel%2520Sapporo", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0687269%2C141.3488882", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0687269,141.3488882", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Keikyu%20EX%20Hotel%20Sapporo%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Great Value Business Hotels"}, "cat_4": {"items": [{"address": "2-1-3 Minami 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Minn Odori offers apartment-style accommodation featuring modern minimalism seamlessly blended with tech-forward design, complete with a smart automated self-check-in system and a fully equipped kitchen. The rooms are exceptionally spacious, boasting a separate living area, a large refrigerator, microwave, washer-dryer, and complete set of tableware, making it perfect for families or long-term vacationers. Excellent location within walking distance of Odori Park and Tanukikoji Shopping Street, allowing you to enjoy home-like comfort and convenience in the heart of Sapporo.", "name": "Minn Odori", "transport": "Approx. 3 mins walk from Exit 3 of Odori Station on the Namboku Subway Line", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Minn%2520Odori", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.bo  heart of Susukino. The overall design seamlessly weaves traditional Hokkaido craft culture with modern luxury. Rooms overlook the spectacular night view and neon sea of Susukino. Featuring highly refined amenities, warm wood color schemes, and gallery-like public spaces, it brings a new level of refined hospitality to the Susukino area.", "lat": 43.0551768, "lng": 141.3522398, "name": "SAPPORO STREAM HOTEL", "transport": "Directly connected to Namboku Line \u0027Susukino Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520SAPPORO%2520STREAM%2520HOTEL", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0551768%2C141.3522398", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0551768,141.3522398", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=SAPPORO%20STREAM%20HOTEL%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "5-1, Minami 2-jo Nishi 7-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | A cozy literary design hotel themed around \u0027reading into the night\u0027, located on the historic Tanukikoji Shopping Street 7-chome. The ground floor houses a 24-hour curated bookstore and cafe stocked with mystery novels and travel books, which guests can borrow to read in their rooms. Rooms feature subtle dark tones paired with warm indirect lighting, creating an ideal haven for reading and relaxation\u2014a dream retreat for book lovers and solo travelers.", "lat": 43.0567329, "lng": 141.3471005, "name": "LAMP LIGHT BOOKS HOTEL SAPPORO", "transport": "About an 8-minute walk from \u0027Odori Station\u0027 (Namboku/Tozai/Toho Lines) or \u0027Susukino Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026mar iture pieces, it combines trendy chic with home-like comfort, just steps away from the bustling Susukino shopping district.", "name": "FAV HOTEL SAPPORO SUSUKINO", "transport": "About a 3-minute walk from Exit 6 of Toho Line \u0027Hosui-Susukino Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520FAV%2520HOTEL%2520SAPPORO%2520SUSUKINO", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520FAV%2520HOTEL%2520SAPPORO%2520SUSUKINO", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20FAV%20HOTEL%20SAPPORO%20SUSUKINO", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=FAV%20HOTEL%20SAPPORO%20SUSUKINO%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26-5, Minami 2-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | A renowned design hot spring hotel located next to Tanukikoji Shopping Street 5-chome, seamlessly combining modern aesthetics with traditional Japanese hot spring culture. It features stunning, dreamlike natural hot spring baths, alongside public spaces and rooms filled with gallery-style contemporary art installations and exquisite lighting. Complete with an onsite bar and artistic restaurant, it is the ideal choice for travelers wanting to shop along Tanukikoji while enjoying hot springs and refined living.", "lat": 43.0577548, "lng": 141.3506687, "name": "La\u0027gent Stay Sapporo Odori", "transport": "About a 5-minute walk from \u0027Odori Station\u0027 or \u0027Susukino Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520La%2527gent%2520Stay%2520Sapporo%2520Odori", "b atures a warm, stylish Japanese public bath \u0027Noboribetsu no Yu\u0027 and offers connecting rooms, making it ideal for groups traveling together. The hotel boasts a minimalist wooden aesthetic and is 100% non-smoking. The lobby offers a complimentary drink corner for guests to relax, and stepping outside puts you right on the shopping street lined with drugstores, all at a very budget-friendly price.", "name": "karaksa hotel Sapporo", "transport": "About a 4-minute walk from Exit 2 of Susukino Station (Namboku Line) or a 5-minute walk from Odori Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520karaksa%2520hotel%2520Sapporo", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520karaksa%2520hotel%2520Sapporo", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20karaksa%20hotel%20Sapporo", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=karaksa%20hotel%20Sapporo%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "8-10, Minami 5-jo Nishi 2-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.3 Stars | Opened in 2022, this fresh business hotel boasts a prime location right next to Hosui-Susukino Station on the Toho Line. It features self-check-in/check-out kiosks and a smartphone digital key system for enhanced safety and efficiency. The lobby includes a generous amenity station stocked with free facial sheet masks, toiletries, and premium tea bags. Rooms offer a modern minimalist design, high-quality mattresses, and great soundproofing, making it a highly recommended choice for budget-conscious travelers.", "name": "Sotetsu Fresa Inn Sapporo-Susukino", "transport": "About a 1-minute walk from Exit 5 of Hosui-Susukino Station (Toho Line) or a 4-minute walk from Susukino Station (Namboku Line)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Sotetsu%2520Fresa%2520Inn%2520Sapporo-Susukino", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520Sotetsu%2520Fresa%2520Inn%2520Sapporo-Susukino", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20Sotetsu%20Fresa%20Inn%20Sapporo-Susukino", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Sotetsu%20Fresa%20Inn%20Sapporo-Susukino%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1, Minami 4-jo Nishi 5-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.1 Stars | Situated right at Susukino\u0027s busiest intersection next to the iconic Nikka Whiskey billboard, this is a timeless high-value hotel in Sapporo. The basement directly connects to the Sapporo Underground Pedestrian Space, protecting guests from harsh weather. Surrounded by hundreds of famous Jingisukan (grilled mutton), soup curry, and ramen spots, nightlife and dining options are endless. The breakfast buffet features fresh local Hokkaido ingredients, combined with Tokyu Group\u0027s dependable service standards.", "lat": 43.0549786, "lng": 141.351061, "name": "Sapporo Tokyu REI Hotel", "transport": "About a 1-minute walk from Exit 4 of Susukino Station (Namboku Line), directly connected via the underground shopping street", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Sapporo%2520Tokyu%2520REI%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0549786%2C141.351061", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0549786,141.351061", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Sapporo%20Tokyu%20REI%20Hotel%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "2-10, Minami 5-jo Nishi 1-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.2 Stars | Part of the international Choice Hotels brand, this property focuses on cleanliness, affordability, and high practicality. Its standout feature is the complimentary healthy breakfast buffet provided to all guests, featuring fresh waffles, signature rice balls, hot soups, and specialty coffee. The lobby features the Comfort Library Cafe, offering free afternoon welcome drinks and a curated selection of books. Rooms are fitted with patented sleep-enhancing pillows and quality mattresses, making it immensely popular among solo and business travelers.", "lat": 43.055415, "lng": 141.3570119, "name": "Comfort Hotel Sapporo Susukino", "transport": "About a 1-minute walk from Exit 7 of Hosui-Susukino Station (Toho Line) or a 5-minute walk from Susukino Station (Namboku Line)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Comfort%2520Hotel%2520Sapporo%2520Susukino", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.055415%2C141.3570119", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.055415,141.3570119", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Comfort%20Hotel%20Sapporo%20Susukino%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26-5, Minami 2-jo Nishi 5-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 Stars | Located just steps away from Tanukikoji 3-Chome and 4-Chome, this hotel seamlessly blends the affordability of a business hotel with the sophisticated feel of a boutique design hotel. It features a natural hot spring public bath \u0027Pon no Yu\u0027 styled with retro Japanese aesthetics and a central lantern setup. The hotel houses a trendy bar and restaurant, offering accommodations ranging from standard double rooms to apartment-style options with kitchenettes\u2014a top pick for travelers wanting a hot spring experience right next to the shopping district.", "lat": 43.0577548, "lng": 141.3506687, "name": "La\u0027gent Stay Sapporo Odori Hokkaido", "transport": "About a 5-minute walk from Odori Station (Namboku/Tozai Lines) or Susukino Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520La%2527gent%2520Stay%2520Sapporo%2520Odori%2520Hokkaido", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0577548%2C141.3506687", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0577548,141.3506687", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=La%27gent%20Stay%20Sapporo%20Odori%20Hokkaido%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "2-1, Minami 4-jo Nishi 1-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.2 Stars | Located along the main thoroughfare on the east side of Susukino, this is an upgraded Premium edition of the Smile Hotel brand, offering significantly elevated amenities and stylish spatial design. Rooms are elegant, bright, and feature ample power outlets and USB ports at the headboards. The breakfast buffet provides excellent value with local seafood and fresh Hokkaido farm produce. Situated very close to Hosui-Susukino Station and just minutes from Tanukikoji and central Susukino, room rates are exceptionally competitive.", "lat": 43.056525, "lng": 141.357428, "name": "Smile Hotel Premium Sapporo Susukino", "transport": "About a 1-minute walk from Exit 6 of Hosui-Susukino Station (Toho Line) or a 4-minute walk from Susukino Station (Namboku Line)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Smile%2520Hotel%2520Premium%2520Sapporo%2520Susukino", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.056525%2C141.357428", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.056525,141.357428", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Smile%20Hotel%20Premium%20Sapporo%20Susukino%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Great-Value Business Hotels"}, "cat_4": {"items": [{"address": "7-1, South 3-jo West 7-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 Stars | Located on the western extension of Tanukikoji Shopping Street, FAV HOTEL SAPPORO is ideal for families and groups. Rooms feature a modern, minimalist design equipped with a large LCD TV, washer-dryer combo, microwave, double-door refrigerator, and a kitchenette with complete cookware, allowing guests to enjoy home-like convenience on their trip. Room layouts offer combinations of bunk beds and independent double beds, accommodating up to 6 to 8 guests comfortably without feeling cramped. The hotel utilizes a convenient self-check-in system, and the first floor features a sophisticated cafe-bar serving morning coffee and providing a relaxing space. Within easy walking distance of Tanukikoji 7-Chome and the Susukino commercial district, it is surrounded by hidden local favorites like soup curry spots and izakayas\u2014making it an excellent base for experiencing local Sapporo life.", "name": "FAV HOTEL SAPPORO", "transport": "About a 7-minute walk from Odori Station or Susukino Station on the Subway Namboku Line, or a 3-minute walk from Nishi-Hatchome Station on the Sapporo Streetcar.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520FAV%2520HOTEL%2520SAPPORO", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520FAV%2520HOTEL%2520SAPPORO", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20FAV%20HOTEL%20SAPPORO", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=FAV%20HOTEL%20SAPPORO%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1-2, South 5-jo West 7-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 Stars | An all-suite apartment hotel located in the heart of the Susukino commercial district, offering ultimate luxury and comfort. All guest rooms feature extra-large layouts equipped with premium Serta mattresses, large open-air baths or luxurious jacuzzi tubs, smart appliances, and full kitchen facilities. The interior design blends modern Japanese aesthetics with European luxury, complete with an in-room washer-dryer and high-end toiletries\u2014ideal for mid-to-long stays or family trips prioritizing quality of life. Boasting a prime location, it is just a few minutes\u0027 walk to Susukino\u0027s food street and Tanukikoji. After a late-night snack, return to your room at any time to enjoy a private spa soak for an unparalleled pampering experience.", "name": "RANDOR Residential Hotel Sapporo Suites", "transport": "About a 6-minute walk from Exit 4 of Susukino Station on the Subway Namboku Line, or a 2-minute walk from Shiseikan-Shogakko-Mae Streetcar Station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520RANDOR%2520Residential%2520Hotel%2520Sapporo%2520Suites", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520RANDOR%2520Residential%2520Hotel%2520Sapporo%2520Suites", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20RANDOR%20Residential%20Hotel%20Sapporo%20Suites", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=RANDOR%20Residential%20Hotel%20Sapporo%20Suites%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "3-18, Odori Nishi 14-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | VILLA KOSHIDO ODORI is a boutique apartment hotel combining art design and e-sports entertainment concepts, located near Odori Park and Tanukikoji. Each floor of this building features a unique thematic design, including suites specially tailored for gamers with high-end PCs and professional gaming chairs, as well as stylish spaces exhibiting a contemporary gallery vibe. Every room comes with a kitchen, washer-dryer, private bathroom, and a spacious living room, offering guests exceptional privacy and freedom. The hotel adopts contactless smart check-in and maintains a quiet, elegant atmosphere\u2014perfect for trendy travelers and family gatherings looking to stay near Susukino while enjoying a peaceful retreat.", "name": "VILLA KOSHIDO ODORI", "transport": "About a 5-minute walk from Exit 1 of Nishi-11-Chome Station on the Subway Tozai Line.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520VILLA%2520KOSHIDO%2520ODORI", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520VILLA%2520KOSHIDO%2520ODORI", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20VILLA%20KOSHIDO%20ODORI", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=VILLA%20KOSHIDO%20ODORI%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26-2, South 2-jo West 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Located adjacent to Tanukikoji 5-Chome Shopping Street, Tokyu Stay Sapporo Odori is an iconic semi-apartment chain hotel in downtown Sapporo. Its standout feature is that most rooms are directly equipped with a drum-type washer-dryer, microwave, electric kettle, and humidifying air purifier; some higher-tier room types even include a kitchenette with a double-burner IH stove and dishwashing gear. Whether you want to microwave a late-night snack on a snowy day or need to wash clothes daily during an extended trip, it offers utmost convenience. A convenience store on the first floor is directly accessible, and breakfast features a lavish buffet made with local Hokkaido produce. Susukino and Odori Park are both within a few minutes\u0027 walk.", "lat": 43.0580275, "lng": 141.3507937, "name": "Tokyu Stay Sapporo Odori", "transport": "About a 3-minute walk from Odori Station (Subway Namboku/Tozai/Toho Lines), or directly accessible from the Tanukikoji 5-Chome exit.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Tokyu%2520Stay%2520Sapporo%2520Odori", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0580275%2C141.3507937", "gmap": "https://www.google.com/maps/sear 04681280"}}, {"address": "289-111, South 8-jo West 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 Stars | Designed around the core concept of a \u0027lodge campsite,\u0027 UNWIND HOTEL \u0026 BAR cleverly integrates the cozy feel of mountain camping into an urban boutique hotel. Rich wood elements and warm lighting are used throughout, while guest rooms feature BALMUDA toaster ovens, pour-over coffee sets, and stylish appliances full of trendy character. Every morning, staff deliver hot, wooden-boxed freshly baked soup breakfasts straight to your door to enjoy at your leisure. Before 10 PM, the first-floor bar hosts a complimentary craft Wine Hour, and the rooftop features an atmospheric campfire terrace\u2014offering a truly unique glamping-style stay experience in the Susukino area.", "lat": 43.0498088, "lng": 141.3523833, "name": "UNWIND HOTEL \u0026 BAR SAPPORO", "transport": "About a 4-minute walk from Exit 2 of Nakajima-Koen Station on the Subway Namboku Line, or about a 7-minute walk to central Susukino.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520UNWIND%2520HOTEL%2520%2526%2520BAR%2520SAPPORO", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0498088%2C141.3523833", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0498088,141.3523833", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=UNWIND%20HOTEL%20%26%20BAR%20SAPPORO%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "289-7, South 8-jo West 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 Stars | Ten to Ten Nakajima-koen is a hybrid design property blending hostel and boutique guesthouse vibes, located right next to the green expanses of Nakajima Park south of Susukino. The renovated former office building interior boasts an industrial-chic yet cozy Japanese aesthetic. In addition to comfortable single dorm beds for solo travelers, it offers private multi-person apartment suites with private bathrooms and cozy lounge areas. The popular 1st-floor cafe \u0026 bar acts as a vibrant gathering spot where global travelers and local residents mingle over Hokkaido craft beer and hand-drip coffee. Bicycle rental service is available, allowing you to explore Susukino, Tanukikoji, and nearby traditional markets at a relaxed pace.", "lat": 43.0503546, "lng": 141.351497, "name": "Ten to Ten Nakajima-koen", "transport": "About a 3-minute walk from Nakajima-Koen Station on the Subway Namboku Line, or just a 6-minute walk to the lively Susukino district.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520Ten%2520to%2520Ten%2520Nakajima-koen", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D43.0503546%2C141.351497", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=43.0503546,141.351497", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=Ten%20to%20Ten%20Nakajima-koen%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "South 5-jo West 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Tucked in a quiet alley near the vibrant heart of Susukino, PINN Nishi 2 Chome offers spacious, stylish apartments with a sleek Nordic design. Rooms feature large floor-to-ceiling windows for great natural light, a comfortable long sofa, and full kitchen amenities (including induction cooktops, tableware, and cooking utensils)\u2014making it perfect for travelers wanting to buy fresh Hokkaido ingredients to cook in-room. Rooms come with a private drum-type washer and dryer, and the separate wet/dry bathroom includes a large bathtub with temperature control. With no complex front desk procedures, check-in is conducted seamlessly via tablet and keypad locks, offering high privacy within a 5-minute walk of Susukino\u0027s main nightlife and Tanukikoji.", "name": "PINN Nishi 2 Chome", "transport": "About a 2-minute walk from Exit 7 of Hosui-Susukino Station on the Subway Toho Line, or a 5-minute walk from Susukino Station on the Namboku Line.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DHokkaido%2520PINN%2520Nishi%25202%2520Chome", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DHokkaido%2520PINN%2520Nishi%25202%2520Chome", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Hokkaido%20PINN%20Nishi%202%20Chome", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Hokkaido\u0026destName=PINN%20Nishi%202%20Chome%2C%20Hokkaido\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Unique Apartments \u0026 Vacation Rentals"}}, "name": "Susukino and Tanukikoji Shopping Street"}};
        const cityNameEn = "Hokkaido";
        let curDist = null, curCat = null;

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); 
            container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No data available.</div>`;
                return;
            }
            
            document.getElementById('content-area').innerHTML = items.map(item => {
                const itemName = item.name || item.title || "Hotel";
                const itemFeature = item.feature || item.description || "";
                const itemAddress = item.address || item.location || "See Map Navigation";
                const itemTransport = item.transport || item.transit || "See Map";
                
                // 保留亮點的 Google 搜尋功能
                const searchKeyword = encodeURIComponent(`${cityNameEn} ${itemName}`);
                const formattedFeature = itemFeature.replace(/(⭐\s*[\d\.]+(?:\s*Stars?|\s*星)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 🚀 直接讀取 Python 預先處理好的網址
                const mapUrl = item.urls?.gmap || `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;
                const agodaUrl = item.urls?.agoda || '#';
                const bookingUrl = item.urls?.booking || '#';
                const tripUrl = item.urls?.trip || '#';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${itemName}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Highlights</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address：</span><br>${itemAddress}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transportation：</span><br>${itemTransport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> Map Navigation
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
