 Restaurant", "transport": "About an 8-minute walk from JR Otaru Station"}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Located inside a historic stone warehouse, this cafe hosts a romantic lighting ritual every morning, kindling 167 oil lamps as it opens. Their signature handmade pancakes and extra-rich Hokkaido milk soft-serve ice cream boast a silky smooth texture and deep milky flavor. Pair them with a house-blend hot kerosene-lamp coffee\u2014where rich, bittersweet notes blend seamlessly with creamy milk. The dimly lit, flickering amber glow creates an unmatched vintage atmosphere highly praised by locals and tourists alike.", "name": "Kitaichi Glass Hall No. 3 - Kitaichi Hall Cafe", "transport": "About a 10-minute walk from JR Minami-Otaru Station, or a 20-minute walk along Sakaimachi Street from JR Otaru Station"}, {"address": "7-16 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Housed in an iconic landmark at Otaru\u0027s Fairy Tale Intersection, the 2nd-floor cafe serves freshly sliced signature Double Fromage cheesecake. The top layer features melt-in-your-mouth rare cheese mousse like light snow, resting on a rich baked cheesecake base for a delicate, multi-layered taste. Paired with a cup of exclusive hot black tea to balance the richness, and a rooftop view overlooking Otaru\u0027s streets, this is an indispensable, world-class dessert experience.", "name": "LeTAO Main Store 2F Caf\u00e9", "transport": "About a 7-minute walk from JR Minami-Otaru Station"}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Located on bustling Sakaimachi Street, the 2nd floor offers a cozy, minimalist seating area. The highlights are the store-exclusive cream puffs and \u0027Yukiyakonko\u0027 crispy biscuits. The cream puffs have a crispy shell packed with rich, sweet filling made from Hokkaido Tokachi milk and fresh cream that bursts with every bite. Purchasing a dessert comes with a complimentary hot drip coffee\u2014making its incredible value and delicious quality a constant draw for crowds.", "name": "Rokkatei Otaru Sakaimachi Store 2F Caf\u00e9", "transport": "About a 9-minute walk from JR Minami-Otaru Station"}, {"address": "1-1-2 Irifune, Otaru, Hokkaido", "feature": "\u2b50 4.0 stars | A historic and unique cafe famous for letting guests take home their beautiful souvenir ceramic mug after finishing their drink. The cafe offers freshly roasted coffee and cake sets\u2014smooth, delightfully bittersweet black coffee paired with soft chiffon cake or cheese tart. Enjoying afternoon tea by the window while taking in Sakaimachi Street offers a nostalgic ambiance full of sweet Otaru memories.", "name": "Gin no Kane Cafe No. 1", "transport": "About a 5-minute walk from JR Minami-Otaru Station"}, {"address": "5-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | The largest LeTAO store in Otaru features a bright, spacious caf\u00e9 on the 2nd floor. It highlights PATHOS-exclusive freshly made dessert platters and hot souffl\u00e9 pancakes. Cloud-light and fluffy, the pancakes melt instantly in your mouth with rich egg aromas and Tokachi fresh cream flavor. Exquisite presentation paired with melt-in-your-mouth textures makes this a pilgrimage site for dessert lovers.", "name": "LeTAO PATHOS 2F Caf\u00e9", "transport": "About a 10-minute walk from JR Minami-Otaru Station, or a 15-minute walk from JR Otaru Station"}, {"address": "3-3-21 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Tucked inside the historic Former Akai Family Warehouse along Otaru\u0027s North Canal, this cafe oozes retro-industrial vibes and classic British charm. It features fresh French press coffee, rich Hokkaido soup curry, and hot pressed sandwiches. The coffee is aromatic with a lingering finish, while the toasted sandwich features a crispy shell, soft inside, and gooey melted cheese. Tucked away from noisy crowds, its peaceful ambiance is adored by coffee connoisseurs and locals alike.", "name": "PRESS CAF\u00c9 Otaru", "transport": "About a 15-minute walk from JR Otaru Station (near the North Canal area)"}, {"address": "6-4 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | A Taisho-romantic themed Japanese-Western fusion cafe combining classic Snoopy characters with nostalgic design. Popular menu items include 3D Snoopy floating matcha lattes and Taisho-style matcha parfaits. The rich matcha offers a pleasant bittersweet profile, perfectly complemented by chewy daifuku and smooth red bean paste. Bursting with visual appeal and fantastic taste, it captivates guests of all ages.", "name": "Snoopy Cha-ya Otaru Cafe", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "5-30 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | One of Hokkaido\u0027s oldest specialty coffee roasters, this store retains charming, historic wooden decor. Their signature house-roasted single-origin pour-overs offer a deep, smooth flavor with a perfect balance of acidity and bitterness. Pair it with thick-cut butter toast or grilled cheese sandwiches that boast a crispy crust, soft interior, and mouthwatering buttery aroma. A simple yet incredibly satisfying port-town coffee brunch experience.", "name": "Otaru Kahichakan Sakaimachi Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Otaru Warehouse No.1, 5-4 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Located in a stone warehouse alongside the Otaru Canal, this local brewpub crafts authentic Otaru Beer. A massive copper brewing kettle sits at the center of the restaurant, exuding a rich German retro-industrial style. The freshly brewed German Pilsner features a dense, refreshing foam\u2014perfect when paired with golden, crispy German sausages and roasted pork knuckles that boast crispy skin, juicy meat, and a rich smoky aroma. Locals and tourists alike love sipping cold beer here while admiring the stunning canal views as the sun sets.", "name": "Otaru Warehouse No.1", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "3-16-13 Inaho, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | An iconic, legendary casual izakaya and soul food spot in Otaru. Its signature dish, \u0027Fried Half-Chicken\u0027, features an ultra-golden, crispy skin that bursts with rich juices in every bite. The meat is extremely tender, juicy, and perfectly seasoned with simple salt. The restaurant bustles with a lively and welcoming vibe, attracting food lovers who pair their chicken with ice-cold draft beer or local sake. A must-visit eatery to experience Otaru\u0027s local warmth and authentic food culture.", "name": "Wakadori Jidai Naruto Honten", "transport": "Approx. 7-minute walk from JR Otaru Station"}, {"address": "2-2-14 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Housed inside a historic Meiji-era red brick building, Bistro ISO seamlessly blends Otaru\u0027s historic charm with modern French bistro flair. The kitchen selects premium local Hokkaido ingredients, such as Shiraoi beef steaks and fresh seafood caught off Otaru\u0027s coast. Seared to perfection, the beef is fragrant outside and succulent inside, with rich, creamy fat that melts in your mouth. Paired with handpicked local Hokkaido wines, the multi-layered flavors linger wonderfully on the palate\u2014a favorite among travelers seeking refined dining and memorable ambiance.", "name": "Bistro ISO", "transport": "Approx. 8-minute walk from JR Otaru Station"}, {"address": "2-5-11 Inaho, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Celebrated as a hidden gem favored by Otaru locals, this seafood izakaya features fresh catches hand-selected daily by the owner at the market. The must-try sashimi platter is delightfully fresh and springy, with creamy sea urchin that melts instantly in your mouth, while seared salmon and sweet shrimp burst with vibrant natural flavor. The atmosphere is warm and hospitable, and guests are treated to a complimentary hot teapot soup (dobin mushi), soothing both heart and stomach with its savory broth.", "name": "Uoshima", "transport": "Approx. 5-minute walk from JR Otaru Station"}, {"address": "6-5 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.0 stars | Converted from a historic warehouse along the canal, this dining hall captures a nostalgic Showa-era streetscape inside. It gathers iconic local delicacies, including Hokkaido Jingisukan (grilled mutton), soup curry, and seafood rice bowls. The sizzling mutton on the griddle is tender with no gamey odor, opening up your appetite when dipped into the special sweet sauce. Its wide variety of food choices and atmospheric nostalgia make it a popular spot for groups and families.", "name": "Otaru Unga Shokudo", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "Inside Otaru Den-nuki Koji, 1-1 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Located in the famous retro Den-nuki Koji alley right across from the Otaru Canal, this charcoal-grill izakaya brims with Showa-era charm. It specializes in freshly grilled seafood caught near Otaru. Giant scallops sizzle over open coals in their rich juices; their tender, bouncy meat paired with creamy butter and a splash of soy sauce gives off an irresistible sweet, smoky aroma that draws in passing strolls to stop and savor authentic ocean treats.", "name": "Otaru Den-nuki Koji Eziya", "transport": "Approx. 10-minute walk from JR Otaru Station"}, {"address": "1-1-17 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | A cozy seafood eatery near the Sakaimachi Street shopping district, renowned for top-quality seafood bowls and charcoal-grilled king crab legs. Freshly caught crab legs are lightly grilled over charcoal, yielding firm, juicy meat infused with a subtle smoky aroma and natural sweetness. Though compact inside, the wall of customer notes and the host\u0027s warm hospitality embody the heartfelt charm of an authentic Otaru harbor-side bistro.", "name": "Sawasaki Suisan Sakaimachi", "transport": "Approx. 9-minute walk from JR Otaru Station"}, {"address": "1-4-15 Inaho, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | A lively food alley comprising over a dozen mini yatai (stall-style eateries), gathering Otaru\u0027s most authentic nightlife bars and regional specialties. Stalls specialize in comforting oden, skewers, and local sake. Sitting side-by-side with friendly owners and locals at intimate wooden counters, enjoying piping-hot, juicy daikon radish and fragrant yakitori paired with a crisp local sake offers a deep taste of Otaru\u0027s cozy evening hospitality.", "name": "Otaru Yataimura Renga Yokocho", "transport": "Approx. 6-minute walk from JR Otaru Station"}], "name": "Specialty Gastropubs \u0026 Regional Dishes"}, "cat_4": {"items": [{"address": "2-11-8 Inaho, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | A famous soup curry restaurant beloved by vegetarians and tourists alike, renowned for its generous \u002720 Vegetables in One Day\u0027 soup curry. Featuring premium seasonal vegetables delivered directly from local Hokkaido farmers\u2014including burdock root, pumpkin, lotus root, eggplant, and carrots\u2014each is meticulously flash-fried and steamed to achieve a lightly crispy exterior while preserving ultimate moisture and natural sweetness inside. You can choose a coconut-veggie broth base that is rich, aromatic, mildly spicy, and deeply comforting. Packed with vegetables that absorb every bit of flavor, it offers a rich and layered texture\u2014a highly acclaimed vegetarian feast you must try in Otaru.", "name": "Rojiura Curry SAMURAI. Otaru", "transport": "About a 5-minute walk from JR Otaru Station, walking towards Otaru Canal"}, {"address": "2-19-14 Inaho, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | A century-old soba restaurant housed in a historic stone building, offering various pure Hokkaido-grown soba options suitable for vegetarians. The signature Vegetable Tempura Cold Soba features locally sourced, fresh seasonal vegetables fried to order; the batter is thin, light, crisp, and non-greasy. The soba noodles are handmade from 100% Hokkaido buckwheat flour, delivering a smooth yet chewy texture with a rich, natural buckwheat aroma. The classic ambience of the old residence combined with authentic traditional craftsmanship makes it a popular pilgrimage spot for health-conscious vegetarian travelers.", "name": "Otaru Soba Yabuhan", "transport": "About a 5-minute walk from JR Otaru Station"}, {"address": "3-3-21 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | A nostalgic cafe located in an old renovated warehouse along the North Canal, serving special Indian-style plant-based vegetable spice curries. The curry sauce is entirely meat-free, slowly simmered with an array of fresh spices, onions, and tomatoes to create a thick, smooth texture with rich spice layers and natural sweet-sour notes. Paired with crispy roasted edges and tender stewed vegetables, every bite is mild and lingeringly sweet. Featuring vintage classic cars and scenic canal views inside, it is an excellent spot for plant-based food lovers to enjoy a slow afternoon.", "name": "PRESS CAFE Otaru", "transport": "About a 10-minute walk north along the canal from the Otaru Canal Chuo Bridge"}, {"address": "2-2-14 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | An upscale Western restaurant converted from a historic Meiji-era red brick warehouse, offering luxury local seasonal vegetable platters and purely plant-based curries for vegetarian gourmets. The restaurant carefully selects high-quality Hokkaido seasonal root vegetables, charcoal-grilling them using open firewood methods that highlight the dense sweetness of Hokkaido pumpkin, fluffy lightness of potatoes, and rich caramelization of onions. Crispy on the outside and tender on the inside, a touch of sea salt reveals their peak natural flavors\u2014a highly rated, stylish vegetarian option near Otaru Canal.", "name": "Otaru ISO", "transport": "About a 3-minute walk from the landmark Asakusa Bridge on Otaru Canal"}, {"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Located inside a romantic kerosene oil lamp cafe illuminated by 167 traditional oil lamps, offering various vegan-friendly traditional Japanese desserts and plant-based drinks. Highly recommended by tourists is the freshly made brown sugar soybean powder dango (mochi skewers): bouncy, chewy rice dumplings drizzled with rich, traditional brown sugar syrup and generously dusted with aromatic roasted soybean powder, offering a satisfyingly sweet bite without sticking to teeth. Pair it with a rich Tokachi red bean plant-based matcha, and immerse yourself in Otaru\u0027s unique romantic, nostalgic atmosphere under classical lantern glows.", "name": "Kitaichi Hall Cafe", "transport": "About a 10-minute walk from JR Minami-Otaru Station, located in the heart of Sakaimachi Street Shopping District"}, {"address": "4-10 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | A famous street snack shop on Sakaimachi Street specializing in all-natural, vegan handmade grilled soy sauce dango and fresh red bean dango. Made from premium steamed Hokkaido rice flour, they are slowly grilled over charcoal until the surface becomes lightly fragrant and crispy, while remaining wonderfully soft and chewy inside. Brushed with a special sweet-savory soy glaze or topped with non-cloying Tokachi red bean paste, every bite delivers an authentic Japanese snack experience highly praised by plant-based travelers worldwide.", "name": "Otaru Sakuraori-ya Dango", "transport": "About an 8-minute walk from JR Minami-Otaru Station, along Sakaimachi Street"}, {"address": "5-28 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.0 stars | A unique health cafe highlighting handmade tofu and pure soy milk desserts crafted from Hokkaido soybeans. Their popular street food, \u0027Pure Soy Milk Tofu Donuts,\u0027 contains no dairy milk; fried to a golden crisp outside, they encase a soft, marshmallow-like fluffy center with a rich soy milk fragrance and subtle natural sweetness, completely light and guilt-free. They also serve fresh, smooth unsweetened soy milk\u2014a healthy plant-based treat you shouldn\u0027t miss while strolling through Sakaimachi Street.", "name": "Otaru Soy Milk Sweets \u0026 Cafe", "transport": "About a 9-minute walk from JR Minami-Otaru Station, middle section of Sakaimachi Street"}, {"address": "1-11-15 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | An organic health restaurant near the canal featuring 100% plant-based macrobiotic set meals designed for vegans and health enthusiasts. The signature veggie plate includes organic brown rice, seasonal vegetable tempura, and a special soy protein patty. Pan-fried to a golden crisp on the outside, the patty is firm, springy, and juicy on the inside, served with a tangy homemade plum sauce. Refreshing and completely non-greasy, it receives high praise for taste and healthiness even from non-vegetarian tourists.", "name": "Organic Cafe GREEN Otaru", "transport": "About a 4-minute walk from Asakusa Bridge at Otaru Canal"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "2-15 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | A traditional fish paste snack you absolutely cannot miss when visiting Otaru! Their most popular item, the \u0027Pan-roll\u0027, wraps delicate, savory fish paste in an ultra-thin slice of bread and deep-fries it to golden perfection. Crisp on the outside and wonderfully bouncy and juicy on the inside, this ingenious blend of seafood paste and Western bread is addictively delicious. Locals and tourists alike eagerly line up for a bite.", "name": "Kamaei Kamaboko Factory Store", "transport": "About a 12-minute walk from JR Otaru Station, or a 5-minute walk along Sakaimachi Street."}, {"address": "1-1-12 Ironai, Otaru, Hokkaido (Next to Otaru Canal Plaza)", "feature": "\u2b50 4.2 stars | \u0027Panju\u0027, a signature nostalgic street snack from Otaru that dates back to the Meiji period. Featuring an ultra-thin, crispy crust with a texture somewhere between sponge cake and takoyaki, it is stuffed full of piping-hot fillings. The signature red bean paste is perfectly sweet, while custard cream, matcha, and caramel flavors are also available. Made fresh to order, the rich filling bursts with every bite\u2014making it the ultimate cozy snack to hold while strolling Sakaimachi Street.", "name": "Kawataya Main Store (Panju)", "transport": "About a 10-minute walk from JR Otaru Station, adjacent to Otaru Canal Plaza."}, {"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Located inside a charming, historic kerosene lamp warehouse, this popular ice cream spot is famous for its stunning 8-layer rainbow soft-serve ice cream. Packed with local Hokkaido flavors such as Yubari melon, Tokachi milk, matcha, strawberry, Kyoho grape, and lavender, each layer is incredibly smooth and creamy. Balancing rich dairy goodness with fruity notes, it\u2019s a total treat for both the eyes and taste buds\u2014and a picture-perfect summer dream dessert on Sakaimachi Street.", "name": "Kitaichi Glass No.3 Cafe", "transport": "About a 10-minute walk from JR Minami-Otaru Station, located in the middle of Sakaimachi Street."}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Housed in a historic building, this Rokkatei shop is known among foodies for its exclusive take-out treat, \u0027Yuki Kon Cheese\u0027. Freshly made sweet and tangy cream cheese is sandwiched between two slightly bitter, crispy cocoa biscuits\u2014creating a thrilling contrast of crunchy and silky cold textures with a shelf life of just 2 hours! Their freshly fried cream puffs are equally delightful, and purchasing sweets comes with free hot coffee, making it an exceptional value.", "name": "Rokkatei Otaru Canal Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station, located in the middle of Sakaimachi Street."}, {"address": "1-1-1 Ironai, Otaru, Hokkaido (Inside Otaru Den-nuki Koji)", "feature": "\u2b50 4.4 stars | A sensational melon soft-serve spot located inside Otaru Den-nuki Koji! Their signature treat, \u0027Santa\u0027s Beard\u0027, uses half of a premium Hokkaido Yubari melon as a bowl, topped generously with rich, pure Tokachi milk soft-serve. Digging in with a spoon reveals a heavenly pairing of silky cold ice cream and juicy, sweet melon that bursts with flavor. It is a decadent and extravagant fruit dessert you cannot miss while visiting Otaru Canal.", "name": "Popura Farm Otaru (Santa\u0027s Beard)", "transport": "About a 10-minute walk from JR Otaru Station, located at the corner of the Otaru Canal intersection."}, {"address": "1-1-1 Ironai, Otaru, Hokkaido (Inside Otaru Den-nuki Koji)", "feature": "\u2b50 4.3 stars | A famous street food stall bringing Hokkaido\u0027s iconic soul food\u2014fried half-chicken and Hokkaido-style fried chicken (Zanki)\u2014to Otaru! Using tender local chicken lightly seasoned with salt, it is fried at high temperature to achieve a paper-thin, golden crispy skin with intensely juicy, succulent meat. Served fresh and hot, each bite brings a satisfying crunch and a burst of savory flavor\u2014the ultimate street food to pair with beer or sparkling water by the canal.", "name": "Naruto-ya Otaru Den-nuki Koji Branch", "transport": "About a 10-minute walk from JR Otaru Station, inside Den-nuki Koji across from Otaru Canal."}, {"address": "7-16 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.6 stars | The flagship store of LeTAO, Otaru\u0027s king of Western confectionery. Don\u0027t miss their takeout window featuring \u0027Jersey Milk Soft Serve\u0027 and fresh slices of their famous \u0027Double Fromage Cheesecake\u0027. Made with rich Hokkaido Jersey milk and cream cheese, the soft serve is impossibly smooth and delightfully sweet, while the melt-in-your-mouth cheesecake blends velvety unbaked cheese with rich baked cheese flavors. Loved by food lovers worldwide!", "name": "LeTAO Main Store", "transport": "About a 5-minute walk from JR Minami-Otaru Station, next to Marchen Crossroads."}, {"address": "1-1-1 Ironai, Otaru, Hokkaido (Otaru Den-nuki Koji 1F)", "feature": "\u2b50 4.2 stars | A grilled seafood Yatai stall set in the retro atmosphere of Den-nuki Koji! Plump Hokkaido scallops grilled over charcoal with special soy sauce and rich butter sizzle tantalizingly, offering plump, juicy sweetness. Charcoal-grilled king crab legs and roasted Atka mackerel are also cooked to smoky perfection. Walking along the canal, the irresistible aroma of sizzling seafood will draw you in\u2014a must-try Yatai experience for seafood lovers.", "name": "Sawasaki Suisan Seafood Grill (Otaru Den-nuki Koji)", "transport": "About a 10-minute walk from JR Otaru Station, located at the landmark Otaru Canal intersection."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Otaru Canal and Sakaimachi Street"}, "sapporo_station_odori": {"categories": {"cat_1": {"items": [{"address": "4F Daimaru Fujii Central, Minami 1-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Founded in 1955, this legendary shop is widely recognized as the birthplace of Japan\u0027s miso ramen. The founder incorporated traditional miso soup concepts into ramen broth to create a unique Hokkaido flavor. The signature miso ramen features a rich, savory broth perfectly balanced with subtle heat, springy medium-thin wavy noodles, and stir-fried cabbage, onions, and minced pork. Rich in texture and brimming with nostalgic, classic flavor, it\u0027s a legendary ramen shop you simply cannot miss when visiting Sapporo.", "name": "Ajino Sanpei", "transport": "About a 1-minute walk from Exit 9 of Odori Subway Station"}, {"address": "3-1-31 Kita 2-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1961, this classic Hokkaido dairy destination famously developed the \u0027Royal Special\u0027 ice cream exclusively for the Emperor and Empress of Japan during their visit to Hokkaido. Containing 16% milkfat with absolutely no added water, this ultra-smooth ice cream offers an intensely creamy yet surprisingly refreshing flavor. Beyond the imperial ice cream, their massive parfaits and traditional Western-style sweets are beloved by locals and tourists alike, making it a true holy land for tasting premium Hokkaido dairy.", "name": "Yukijirushi Parlor Sapporo Main Store", "transport": "About a 5-minute walk from JR Sapporo Station South Exit / About a 5-minute walk from Odori Subway Station"}, {"address": "2-1-18 Kita 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | One of Hokkaido\u0027s iconic crab dining institutions, famously recognizable by the giant crab landmark on its building facade. The restaurant serves premium King crab, Snow crab, and Horsehair crab air-blinded fresh from the Sea of Okhotsk and nearby Hokkaido waters. The signature crab hot pot (Kani Suki) features a light, sweet broth and plump, springy crab meat bursting with oceanic sweetness. Finishing the meal with a rich crab paste rice porridge (Zosui) cooked in the leftover broth is an absolute highlight that draws food lovers from all around.", "name": "Sapporo Kani Honke Sapporo Station Main Store", "transport": "About a 5-minute walk from JR Sapporo Station South Exit"}, {"address": "3-17 Minami 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A century-old confectionary in the Odori district established in 1921, even featuring a natural spring water station inside for guests to sample famous Sapporo groundwater. Their decades-long bestseller, \u0027Yama Oyaji\u0027 rice crackers, offers a rich butter and egg aroma with a satisfying crunchy texture. Recent hits like \u0027Nama Yama Oyaji\u0027 and \u0027Parfait Raw Snow Cake\u0027 combine crispy biscuits with fresh cream and red bean paste, delivering a crisp yet soft delight that is pleasantly balanced\u2014making this a hugely popular spot for souvenir shopping and sweet treats.", "name": "Senshuan Main Store", "transport": "About a 3-minute walk from Odori Subway Station / Directly connected via Pole Town Underground Shopping Center"}, {"address": "B1F Nihon Seimei Sapporo Building, 4-1-1 Kita 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Founded in 1956, this legendary Hokkaido Genghis Khan (grilled mutton) restaurant pioneered the style of marinating meat in a secret sauce before grilling. Made with apples, onions, and natural spices, the secret marinade completely eliminates gamineness, leaving tender, juicy lamb with a savory-sweet flavor that pairs perfectly with rice. The surrounding cabbage and bean sprouts soak up the rich juices and sauce on the iron skillet, delivering a savory, crunchy side dish that locals have cherished since childhood.", "name": "Matsuo Genghis Khan Sapporo Ekimae Store", "transport": "Directly connected via JR Sapporo Station Underground Walkway (Chi-Ka-Ho), about a 3-minute walk"}, {"address": "B2F Le Trois, Nishi 1-chome, Odori, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A beloved Showa-era bakery famous across Sapporo and the birthplace of Hokkaido\u0027s legendary \u0027Chikuwa Bread\u0027. The fluffy, soft bread wraps around a chewy chikuwa fish cake stuffed with flavorful homemade tuna salad. One bite delivers a delicious explosion of savory, juicy flavors and fantastic textures! Freshly baking over a hundred varieties of affordable items daily, it radiates heartwarming local charm and timeless traditional flavors.", "name": "Donguri Bakery Odori Store", "transport": "Directly connected to Le Trois B2 via Exit 24 of Odori Subway Station"}, {"address": "B1F Asty 45 Building, 5-1 Kita 4-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A legendary name in Sapporo\u0027s soup curry scene, renowned for establishing its iconic status with a rich, flavorful sweet shrimp broth. Simmering thousands of fresh Hokkaido sweet shrimp daily into a concentrated essence, the soup delivers an insanely rich and aromatic shrimp flavor. Paired with crispy-on-the-outside seasonal Hokkaido vegetables and a tender, juicy whole chicken leg, every bite absorbs the spiced seafood broth for an unforgettable depth of flavor that mesmerizes locals and travelers alike.", "name": "Okushiba Shoten Ekimae Soseiji", "transport": "About a 5-minute walk from JR Sapporo Station South Exit (Asty 45 Building B1)"}, {"address": "2F Sapporo Plaza Building, 2-1-25 Kita 4-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A classic yakitori chain founded in Sapporo in 1980, serving as a beloved everyday eatery for Hokkaido office workers and locals. Using high-quality chicken from Iwate Prefecture, skewers are grilled to order over premium Binchotan charcoal. Signature chicken meatballs (Tsukune) feature a lightly charred crispy exterior and juicy meat, while pork-wrapped mochi and bacon cheese skewers are must-order staples. The complimentary warm chicken broth served upon arrival is comforting and flavorful, pairing perfectly with affordable skewers for an authentic Sapporo izakaya nightlife experience.", "name": "Kushidori Sapporo Ekimae", "transport": "About a 2-minute walk from JR Sapporo Station South Exit"}], "name": "Iconic Local Classics"}, "cat_2": {"items": [{"address": "B3F Toshin Bldg, Odori Nishi 2-Chome 5, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A wildly popular classic underground cafe at Odori Station, famous for its signature King Crab Sandwich. The toast is incredibly soft and moist, packed with juicy, succulent king crab meat and special mayonnaise. Paired with a soft egg salad sandwich half-and-half combo, every bite bursts with rich ocean flavors. Their pour-over coffee is rich and aromatic, making it the perfect spot for an authentic brunch infused with Hokkaido flavors.", "name": "Cafe Saera (\u73c8\u7432\u3068\u30b5\u30f3\u30c9\u30a4\u30c3\u30c1 \u3055\u3048\u3089)", "transport": "Directly connected to Odori Subway Station Exit 19 (B3 Floor)"}, {"address": "2F, 3-3 Kita 4-jo Nishi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Just a few minutes\u0027 walk from Sapporo Station, the 2nd-floor cafe offers an elegant and bright brunch and dessert experience. A must-order is the exclusive Freshly Baked Blueberry Pie\u2014the crust is exceptionally crispy and buttery with a satisfying crunch, paired with a perfectly sweet-and-sour blueberry filling and chilled whipped cream for rich layers of flavor. Savory dishes like special beef stew and handmade pizzas are equally impressive. Combined with free-flowing hot coffee, it\u0027s an unmissable, sophisticated brunch spot in Sapporo.", "name": "Rokkatei Sapporo Main Store Cafe", "transport": "About a 5-minute walk from JR Sapporo Station South Exit"}, {"address": "1F Frieden Bldg, Minami 1-jo Nishi 4-chome 8-2, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Tucked away in an alley near the Odori shopping district, this specialty takeaway coffee shop is famous for customized lattes using rare single-farm Hokkaido milk. Customers can choose milk with different levels of richness and sweetness to pair seamlessly with their house-roasted espresso. The microfoam is silky and dense, delivering a smooth sip full of rich, natural dairy sweetness and a pleasant coffee aftertaste\u2014a true holy grail for coffee and dairy lovers alike.", "name": "BARISTART COFFEE", "transport": "About a 2-minute walk from Odori Subway Station Exit 5"}, {"address": "1F AS Bldg, Minami 1-jo Nishi 12-chome 4-182, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A gorgeous concept store by Hokkaido\u0027s famous coffee brand MORIHICO, located near Odori Park. Filled with warm wooden accents and an artistic, hip vibe, it offers expertly house-roasted pour-over coffee and delicate handmade tarts and pies. The classic coffee is rich and smooth with a perfect balance of bitterness and sweetness, pairing wonderfully with warm, fluffy fruit tarts or seasonal quiches. Floor-to-ceiling windows offer views of Odori Park across the four seasons, making it an ideal spot for a slow-paced brunch.", "name": "Atelier Morihiko (\u30a2\u30c8\u30ea\u30a8\u30e2\u30ea\u30d2\u30b3)", "transport": "About a 1-minute walk from Nishi-11-Chome Station Exit 2 (Tozai Line)"}, {"address": "1F Hokuyo Odori Center, Odori Nishi 3-chome 7, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A popular brunch cafe located at the entrance of Odori Park, famous for its ultra-rich soft-serve ice cream and freshly baked cheese tarts. The \"Supreme Omurice\" and \"Freshly Baked Tart Set\" served during brunch are immensely popular. The cheese tart features a cookie-like crispy shell filled with a rich, semi-baked mousse-like center. Paired with a cold brew coffee or tea, it immerses you in the pure bliss of Hokkaido\u0027s finest dairy.", "name": "KINOTOYA Cafe Odori Park", "transport": "Directly connected to Odori Subway Station Exit 7"}, {"address": "1F CARTA Bldg, Minami 1-jo Higashi 2-chome 3-1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A stylish lifestyle cafe blending fashion select shop concepts with lush greenery, located east of Odori Park. The rich brunch menu features freshly toasted French toast, fresh salads, and house-special meat dishes. The signature French toast is golden and lightly caramelized on the outside, pudding-soft on the inside, drizzled with pure hazelnut maple syrup and smooth whipped cream. Spacious with a great atmosphere, it\u0027s perfect for a relaxing morning brunch.", "name": "Fabulous Cafe \u0026 Select Shop", "transport": "About a 2-minute walk from Bus Center-Mae Station Exit 3 (Tozai Line) / About a 5-minute walk from Odori Subway Station"}, {"address": "B2F Sapporo Odori Nishi 4-chome Bldg, Odori Nishi 4-chome 6-1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Operated by Ishiya, the maker of Shiroi Koibito, this cafe is located in the underground walkway connecting Sapporo Station and Odori Station. The must-try item is the signature \"Thick-Cut Souffle Pancakes\"\u2014made fresh to order, several centimeters thick, topped with Hokkaido whipped cream and special berry sauce. Fluffy like clouds, they melt in your mouth. Paired with aromatic black coffee or Hokkaido milk drinks, it\u0027s the perfect stop for a luxurious brunch or afternoon tea while shopping.", "name": "ISHIYA CAFE (Sapporo Underground Walkway Branch)", "transport": "Directly connected to Odori Subway Station underground passage / Directly connected to Chi-Ka-Ho (Sapporo Underground Pedestrian Space)"}, {"address": "1F M\u0027s Nijo Yokocho, Minami 2-jo Higashi 2-chome 7-1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | An artisanal Bean-to-Bar chocolate specialty cafe located near the Sosei River. Brunch options feature exquisite Bean-to-Bar chocolate drinks, freshly baked croissants, and toast spread with rich cocoa butter. The crispy, buttery croissant is filled with signature dark chocolate, crispy on the outside and soft inside with subtle fruity notes and a pleasantly bitter cocoa aroma. With a modern minimalist vibe, it\u0027s an unmissable brunch experience for specialty chocolate and craft coffee enthusiasts.", "name": "Saturdays Chocolate Factory \u0026 Cafe", "transport": "About a 5-minute walk from Odori Subway Station Exit 34 / About a 3-minute walk from Bus Center-Mae Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "B1F, Nippon Life Sapporo Building, 1-1 Kita 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Matsuo Jingisukan is an iconic local grilled mutton specialty restaurant in Hokkaido. Premium mutton is marinated in a secret sauce and grilled on a specially designed convex iron skillet. The piping-hot juices soak into the sweet surrounding vegetables, rendering the mutton extraordinarily tender without any gamey odor. Infused with sweet fruity and savory soy sauce aromas, it pairs perfectly with local Hokkaido draft beer, making it a favorite among both local office workers and foreign tourists.", "name": "Matsuo Jingisukan Sapporo Ekimae", "transport": "Approx. 5 min walk from JR Sapporo Station / Directly connected to Sapporo Station Underground Walkway (Namboku Line)"}, {"address": "B1F, TCS Building, 1 Kita 4-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Directly operated by a Sapporo seafood wholesaler, this specialty seafood izakaya features seasonal ocean delicacies delivered fresh from major fishing ports across Hokkaido. The classic sashimi platter includes thick-cut salmon, sweet scallops, and fresh spot prawns that melt in your mouth with natural sweetness. The lively atmosphere exudes a nostalgic Showa-era charm, perfect for pairing with Hokkaido-exclusive local sakes like \u0027Otokoyama\u0027 or \u0027Kunimare\u0027 to fully immerse in the local food culture.", "name": "Hokkaido Seafood Izakaya Sakana Isshin Sapporo Ekimae", "transport": "3 min walk from JR Sapporo Station South Exit"}, {"address": "2F, ANA Crowne Plaza Hotel Sapporo, 1 Kita 3-jo Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Located near Sapporo Station, this refined Hokkaido local cuisine restaurant and dining bar serves high-end authentic Kaiseki course meals and select local sake. It recreates iconic regional dishes such as Ishikari hot pot, Sanpei soup, and grilled Hokkaido Ichiyaboshi (overnight dried fish), using carefully chosen local organic vegetables and Furano Wagyu beef. Set in an elegant Japanese garden environment, it is the ultimate destination to experience premium traditional Hokkaido regional dishes paired with fine sake.", "name": "Unkai Hokkaido Local Cuisine", "transport": "1 min walk from Exit 21 of Sapporo Station (Toho Subway Line) / 7 min walk from JR Sapporo Station"}, {"address": "B1F, Sapporo Ekimae Godo Building, 1 Kita 4-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 stars | Directly connected to the Sapporo Station underground street, this popular dining bar is famous for its hearty, generous seafood creations. The most famous dish, the \u0027Overflowing Salmon Roe Donburi,\u0027 features staff chanting enthusiastically as they pour luscious marinated salmon roe until it overflows from the bowl. Every bite pops with juicy ocean freshness. Offering an extensive selection of beers and local sakes, it comes highly recommended for travelers seeking a lively atmosphere and authentic flavors.", "name": "Seafood Izakaya Uomasu Sapporo Ekimae", "transport": "Directly connected underground, 2 min walk from JR Sapporo Station"}, {"address": "B1F, G-DINING Sapporo, 3 Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Located near the Odori shopping district, this exquisite chicken and seafood specialty izakaya features locally raised \u0027Shintoku Free-range Chicken\u0027 and \u0027Shiretoko Chicken\u0027. The signature charcoal-grilled skewers have a golden crisp skin and tender, juicy meat inside, wonderfully enhanced by Hokkaido kelp salt. With a cozy and comfortable ambience alongside an impressive collection of local sakes and wines, it is a highly praised gathering spot for local regional cuisine.", "name": "Hokkaido Izakaya Tori Isshin Odori", "transport": "3 min walk from Odori Station or Susukino Station (Namboku Subway Line)"}, {"address": "1F, Sapporo Factory Renga-kan, 4 Kita 2-jo Higashi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Nestled inside a historic red-brick building, this dining bar inherits the brewing traditions of the Meiji-era Hokkaido Development Commission (Kaitakushi). Guests can savor unfiltered draft beer and traditionally brewed ales reminiscent of the pioneering era, boasting rich malt aromas and velvety smooth foam. Paired with local cheese platters, German sausages, and seared Hokkaido potatoes, it seamlessly merges local beer culture with delectable cuisine.", "name": "Sapporo Kaitakushi Beer Hall", "transport": "5 min walk from Bus Center-Mae Station (Tozai Subway Line) / 12 min walk from Odori shopping district"}, {"address": "3F-4F, Kantech Building, 1-1 Kita 4-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 3.9 stars | A long-established Hokkaido-themed izakaya celebrated for bringing together regional specialties from across Hokkaido. The menu encompasses Hakodate squid sashimi, Obihiro pork bowl skewers, Kushiro fried chicken (Zangi), and Furano cheese dishes. The Kushiro Zangi\u2014crispy on the outside, succulent inside, and tossed in a special sweet and sour sauce\u2014is bursting with flavor, making this the perfect gateway izakaya to explore Hokkaido\u0027s vast culinary map.", "name": "Hokkaido Dining Izakaya Kitano Kazoku Sapporo Ekimae", "transport": "2 min walk from JR Sapporo Station South Exit"}, {"address": "B1F, Togashi Building, 2 Minami 2-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Situated at the junction of Odori and Tanukikoji, this large specialty seafood izakaya is best known for its grand \u0027Funamori\u0027 (boat-shaped) sashimi platters packed with fresh daily catches like sea urchin, spot prawns, raw tuna, and scallops. Seared Hokkaido Kuroge Wagyu beef and grilled Hokke (Okhotsk Atka mackerel) are also must-try signatures. Juicy, aromatic grilled fish paired with Hokkaido rice or local sake offers the ultimate taste of a joyous northern night out.", "name": "Izakaya Funamoriya Bettei Aburi Chaya Odori", "transport": "2 min walk from Exit 36 of Odori Subway Station"}], "name": "Specialty Dining Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "South 2 West 7-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 7-chome)", "feature": "\u2b50 4.5 Stars | Located in Tanukikoji 7-chome, LOHAS is a well-known vegan and raw food concept restaurant in Sapporo. Its highlight is the raw soba noodles, which preserve nutrient value without high-heat processing. These noodles have a springier, chewier texture than regular soba, accompanied by a rich natural grain aroma. Paired with a special plant-based vegan broth and fresh pesticide-free organic vegetables, it offers a refreshing, multi-layered taste without feeling heavy. The cafe also serves dairy- and egg-free vegan cheesecakes and raw chocolate desserts that are rich, smooth, and highly praised by vegetarians, health-conscious locals, and tourists alike.", "name": "Soba Cuisine \u0026 Organic Cafe LOHAS", "transport": "Approx. 6 min walk from Odori Station or Susukino Station on the Namboku Subway Line"}, {"address": "3-1-1 South 3 West 5-chome, Chuo-ku, Sapporo, Hokkaido (Next to Tanukikoji 5-chome)", "feature": "\u2b50 4.4 Stars | The Sapporo branch of Japan\u0027s first all-vegetarian Indian restaurant chain, located near the Odori shopping district. All menu items are completely free of meat and fish, utilizing generous amounts of organic vegetables grown on their own farm alongside natural spices. Signature dishes like the Dal Mushroom Curry and Palak Paneer (vegan cheese) Curry are rich, smooth, and aromatic, featuring mild heat and deep spice complexity. Paired with freshly baked egg-free natural yeast Naan\u2014crispy outside, soft inside, with a subtly sweet wheat flavor and satisfying chew\u2014it is immensely popular among vegetarian travelers and local spice lovers.", "name": "Indian Vegetarian Restaurant Nataraj Sapporo", "transport": "Approx. 5 min walk from Odori Station on the Namboku Subway Line"}, {"address": "2-1 South 2 West 23-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 Stars | A famous vegan dining brand originating from London and Japan, the Sapporo location situated between Odori and Maruyama Park serves refined vegan cuisine free of animal products, chemical additives, and pungent roots (alliums). The signature Vegan Vegetable Tempura Set features locally harvested Hokkaido pumpkin, lotus root, and seasonal greens fried to golden perfection. The light, non-greasy batter delivers a satisfying crunch, locking in the natural sweetness and juices of the vegetables. Served with chewy organic brown rice and house-made miso soup, it provides vegetarian lovers with a warm, pure, and exquisite dining experience.", "name": "Itadaki Zen Sapporo", "transport": "Approx. 6 min walk from Nishi-18-Chome Station or Maruyama-Koen Station on the Tozai Subway Line"}, {"address": "2-10 South 9 West 2-chome, Chuo-ku, Sapporo, Hokkaido (1F MYSTAYS PREMIER Sapporo Park)", "feature": "\u2b50 4.3 Stars | Located south of the Odori commercial area, TERRA is famous for its lush, green glass-greenhouse aesthetic, creating a wonderful dining atmosphere reminiscent of eating in nature. Partnering with local Hokkaido organic farms, the restaurant offers an abundant variety of vegan and vegetarian-friendly options. The most popular item, the Plant-Based Burger, features a soy-protein patty seared to a slight char on the outside, remaining juicy and satisfyingly chewy inside with zero soy odor. Paired with crisp fresh lettuce and special plant-based cheese sauce, its impressive flavor rivals real meat burgers, captivating vegetarians and non-vegetarians alike.", "name": "Farm to Table TERRA", "transport": "Approx. 2 min walk from Exit 1 of Nakajima-Koen Station on the Namboku Subway Line"}, {"address": "1-223 South 1 West 16-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | A cozy vegetarian cafe near the west side of Odori Park, dedicated to using 100% organic plant-based ingredients and local Hokkaido produce. Its signature Organic Brown Rice \u0026 Vegetable Lunch Plate includes a variety of thoughtfully prepared seasonal vegetable side dishes, crispy fried soy-protein nuggets, and chewy, flavorful organic brown rice. The soy nuggets feature a crispy exterior and tender, savory interior, paired with a tangy-sweet signature plant sauce that stimulates the appetite. Additionally, the house-made vegan tofu cheese tart offers a dense, smooth texture with subtle hints of soy and lemon freshness\u2014an ideal choice for a relaxing vegetarian afternoon.", "name": "Organic Veggie Cafe Aoi Sora", "transport": "Approx. 7 min walk from Nishi-11-Chome Station on the Tozai Subway Line"}, {"address": "South 4 West 5-chome, Chuo-ku, Sapporo, Hokkaido (2F Miyako Dori Bldg)", "feature": "\u2b50 4.6 Stars | As one of Sapporo\u0027s most iconic soup curry establishments, Suage+ offers a vegetable soup curry featuring a purely plant-based broth crafted specifically for vegetarian dining (request the vegan/vegetarian broth option). The signature Hokkaido Vegetable Soup Curry is loaded with local specialties that are steamed then flash-fried: potatoes, sweet pumpkin, maitake mushrooms, eggplant, and grilled bell peppers. The veggies have a light charred aroma on the outside and burst with sweet juices inside. Combined with a mildly spicy, herbal curry broth, the interplay of crisp and tender textures delivers an exquisite dining treat for vegetarian travelers seeking authentic Sapporo flavors.", "name": "Soup Curry Suage+ Veggie Option", "transport": "Approx. 2 min walk from Exit 2 of Susukino Station on the Namboku Subway Line"}, {"address": "1-3 South 1 West 15-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 Stars | A modern cafe dedicated to vegan, gluten-free, and refined-sugar-free healthy eating, highly popular among women and health-conscious diners. Popular menu items such as the Vegan Superfood Acai Bowl and Fresh Raw Buddha Bowl feature abundant freshly picked organic greens, nuts, and quinoa topped with a rich homemade raw sesame dressing\u2014delivering a crisp, appetizing, highly texturized meal packed with dietary fiber. The vegan chocolate mousse cake, crafted from avocado and sugar-free cocoa, melts in your mouth with a silky, rich finish, completely redefining expectations for vegan desserts.", "name": "Holistic Bio Cafe Vegan", "transport": "Approx. 4 min walk from Exit 2 of Nishi-11-Chome Station on the Tozai Subway Line"}, {"address": "South 3 West 2-chome, Chuo-ku, Sapporo, Hokkaido (1F KT Sanjo Bldg)", "feature": "\u2b50 4.3 Stars | Located in the Odori commercial district, GAO is a stylish bistro focusing on organic vegetables and vegetarian-friendly dining. Carefully selecting naturally cultivated, pesticide-free produce from Hokkaido, the restaurant creates highly innovative plant-based dishes. The signature Vegan Soy Meat Red Wine Stew slow-simmers soy protein chunks and root vegetables until tender; the soy meat fully absorbs the sweet, rich red wine vegetable reduction, offering a soft yet bouncy texture reminiscent of hearty beef stew. Accompanied by fragrant grain rice or artisanal egg-free bread, it provides a warm, savory taste\u2014making it a wonderful spot to relax and enjoy a vegetarian dinner in Sapporo.", "name": "Organic Dining GAO", "transport": "Approx. 2 min walk from Exit 2 of Hosui-Susukino Station on the Toho Subway Line"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Odori Nishi 1-7 Chome, Chuo Ward, Sapporo, Hokkaido (Inside Odori Park)", "feature": "\u2b50 4.3 stars | The most iconic seasonal street food snack in Odori Park. Featuring specially selected Hokkaido sweet corn grilled over charcoal or a hot plate and brushed with a secret sweet-and-savory soy sauce, it emits a mouthwatering smoky aroma with rich buttery notes. Plump, juicy, and intensely sweet with a lightly charred exterior and steaming-hot center, this is a must-try snack for tourists and locals strolling through the park during spring and summer.", "name": "Odori Park Tokibi Wagon (Grilled Corn Stand)", "transport": "Directly accessible upon exiting Odori Subway Station"}, {"address": "JR Tower, JR Sapporo Station Concourse, Kita 6-jo Nishi 3-chome, Kita Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A wildly popular bakery with long queues located near the octagonal plaza of Sapporo Station. Their Gokujo Milk Soft Serve is dense, velvety, and rich with fresh dairy flavor without being overly sweet. The double-baked cheese tart features a crispy cookie-like crust filled with molten, creamy cheese. Crispy on the outside and warm and gooey inside when freshly baked, its smooth, slightly tangy cream cheese flavor is irresistible\u2014a classic grab-and-go sweet treat for travelers.", "name": "KINOTOYA BAKE JR Sapporo Station", "transport": "About a 1-minute walk from the West Gate of JR Sapporo Station"}, {"address": "B2F Le Trois, Odori Nishi 1-Chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A hugely popular bakery in Hokkaido and the birthplace of Sapporo\u0027s famous Chikuwa Tuna Bread. Soft and chewy freshly baked bread wraps around an entire bouncy chikuwa fish cake stuffed with rich, flavorful tuna salad. Savory, satisfying, and full of texture, its wallet-friendly price and creative local twist make this everyday snack the most sought-after savory takeaway item in the Odori underground mall.", "name": "DONGURI Odori Store", "transport": "Directly connected to Exit 24 of Odori Subway Station"}, {"address": "Inside Sapporo Underground Pedestrian Shopping Mall Aurora Town, Odori Nishi 2-Chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Operated by Marui Imai Department Store, this specialty market gathers authentic street food snacks and local ingredients from all over Hokkaido. The highlights are freshly fried Danshaku potato croquettes and hearty golden Berkshire pork patties. Crunchy on the outside with a satisfying crispness, they are filled with fluffy, sweet potato or savory, juicy minced pork\u2014perfect for enjoying hot cooked deli snacks while browsing.", "name": "Kita Kitchen Aurora Town", "transport": "Directly connected to Odori Subway Station, inside Aurora Town Underground Shopping Mall"}, {"address": "1-27 Kita 3-jo Nishi 2-chome, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | A popular takeaway and pub specializing in Zangi, Hokkaido\u0027s signature deep-fried chicken. Tender chicken is marinated in a secret soy sauce, ginger, and garlic blend, coated in a light batter, and flash-fried at high heat. Ultra-crispy on the outside, juicy and deeply savory on the inside, each bite bursts with hot flavor. Served in convenient takeaway cups, visitors can easily snack on the go while enjoying authentic Sapporo soul food.", "name": "Sapporo Zangi Honpo Sapporo Ekimae", "transport": "About a 4-minute walk from JR Sapporo Station South Exit / 2-minute walk from Sapporo Subway Station"}, {"address": "1F Odori Bisse, Odori Nishi 3-Chome 7, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A renowned cheese souffl\u00e9 shop originating from Hakodate, hugely acclaimed in Sapporo\u0027s Odori area. Their signature \"Cheese Omelette\" features a melt-in-your-mouth texture as delicate as a soft-cooked omelet, unleashing rich pure milk and savory cheese aromas. Conveniently packaged individually, it makes an exquisite walking sweet snack while shopping around the Odori commercial district.", "name": "PASTRY SNAFFLE\u0027S Sapporo Seigetudo", "transport": "Directly connected to Exit 7 of Odori Subway Station (Inside ODORI BISSE)"}, {"address": "B2F Sapporo Odori Nishi 4-Chome Bldg., Odori Nishi 4-Chome 614, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A flagship experience store built by the maker of Shiroi Koibito along Sapporo Underground Pedestrian Space (Chi-Ka-Ho). They serve takeaway-exclusive \"Shiroi Koibito Soft Serve Ice Cream\", blending premium Hokkaido milk with Shiroi Koibito white chocolate for an exceptionally smooth and creamy delight bursting with milk aroma and elegant chocolate sweetness. Beloved by international tourists and students alike, it is the ultimate stroll snack in the underground mall.", "name": "ISHIYA SHOP Odori Main Store", "transport": "Directly connected to Odori Subway Station, next to Sapporo Underground Pedestrian Space (Chi-Ka-Ho)"}, {"address": "1F Taiyo Seimei Sapporo Bldg., Kita 2-jo Nishi 3-Chome 1-31, Chuo Ward, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | A vintage Showa-style dessert shop carrying the rich history of Hokkaido\u0027s dairy industry. Its most iconic takeaway item is the \"Royal Special Vanilla Ice Cream,\" originally crafted exclusively for the Emperor of Japan. Boasting a high milk fat content of 16%, it delivers a remarkably rich, smooth texture filled with deep, pure dairy flavor and subtle vanilla notes\u2014a legendary classic dessert that should not be missed near Sapporo Station.", "name": "Snow Brand Parlor Sapporo Main Store", "transport": "About a 5-minute walk from JR Sapporo Station South Exit / 2-minute walk from Exit 9 of Sapporo Subway Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Sapporo Station and Odori Shopping District"}, "susukino_tanukikoji": {"categories": {"cat_1": {"items": [{"address": "Minami 4-jo Nishi 4-chome 4, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | Founded in 1954, this long-standing Hokkaido establishment is one of the most iconic traditional Jingisukan (Genghis Khan mutton BBQ) restaurants in Susukino. Using custom iron skillets and Binchotan charcoal, they serve carefully selected fresh mutton delivered daily, which is exceptionally tender with zero gamey odor. The fat sizzles enticingly on the red-hot iron grill, grilled alongside plenty of sweet onions and scallions for a juicy, flavor-packed bite. Dipped in their secret sauce refined over decades, the rich, savory-sweet flavor comes alive. Beloved by local office workers and tourists alike, long queues are a common sight.", "name": "Jingisukan Daruma 4.4", "transport": "Approx. 2-min walk from Susukino Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "Minami 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Founded in 1964 (Showa 39), Hyousetsu no Mon is the oldest king crab specialty restaurant in Susukino. Renowned for its meticulous selection of ingredients and traditional Japanese culinary craftsmanship, it offers premium full-course crab feasts featuring King Crab, Snow Crab, and Horsehair Crab. From sweet, silky crab sashimi to charcoal-grilled crab legs bursting with savory juices, and flavorful crab shabu-shabu to crab butter rice porridge (Zosui), every dish highlights the ultimate sweetness and delicate texture of the crab meat. With elegant Japanese private dining rooms and attentive service, it is the top choice for an authentic, luxury Hokkaido seafood banquet.", "name": "Hyousetsu no Mon", "transport": "Approx. 1-min walk from Hosui-Susukino Station on the Sapporo Municipal Subway Toho Line / Approx. 4-min walk from Susukino Station on the Namboku Line"}, {"address": "1F Mutsu Building, Minami 6-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 Stars | Established in 1999, Keyaki is a legendary spot representing Sapporo\u0027s rich miso ramen style. The golden broth is simmered for hours using pork bones, chicken bones, and various fresh vegetables, blended with three signature misos to create a rich yet surprisingly smooth flavor. The classic yellow, medium-thin wavy noodles are pleasantly chewy and hold the broth perfectly. Stir-fried cabbage and bean sprouts add a captivating smoky wok aroma, paired with tender, juicy chashu pork and flavorful bamboo shoots. Hearty, sweet, and complex in layers, a bowl here warms your body and soul on a cold Hokkaido night.", "name": "Nitori no Keyaki Susukino Main Store", "transport": "Approx. 3-min walk from Exit 3 of Susukino Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "2F M\u0027s Building, 7-1 Minami 2-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | Located near Tanukikoji Shopping Street, GARAKU is one of Sapporo\u0027s most famous soup curry restaurants. The soul of the dish lies in its broth\u2014a blend of Japanese bonito and kombu dashi simmered over low heat with 21 proprietary spices and secret sauces, yielding a deep, aromatic, yet refreshingly tangy taste. The signature tender chicken leg soup curry features crisp-skinned chicken cooked until fall-off-the-bone tender, accompanied by flash-fried local vegetables like sweet bell peppers, fluffy pumpkin, and eggplant. Paired with fragrant rice drizzled with lemon juice, it offers an irresistible combination of rich flavors and satisfying textures.", "name": "Soup Curry GARAKU", "transport": "Approx. 4-5 min walk from Odori Station or Susukino Station on the Sapporo Municipal Subway Namboku Line; located near Tanukikoji 2-chome"}, {"address": "Minami 3-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 3.9 Stars | Since opening in 1967 (Showa 42), Miyoshino has been an irreplaceable soul food staple for Sapporo locals. This long-standing traditional diner is best known for its classic dish, \u0027Gyoza Curry\u0027 (pan-fried dumplings over curry rice). Freshly pan-fried thin-skinned gyoza feature crispy golden bottoms and juicy pork fillings, served over rich, aromatic, slightly spicy traditional Japanese curry sauce for a delicious double treat. With incredible value for money and a cozy nostalgic atmosphere, it remains a cherished local comfort food across generations.", "name": "Miyoshino Tanukikoji Branch", "transport": "Approx. 3-min walk from Susukino Station or Odori Station on the Sapporo Municipal Subway Namboku Line, inside Tanukikoji 2-chome"}, {"address": "1024-10 Minami 7-jo Nishi 9-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Located near the Susukino commercial area, the main shop of Ebisoba Ichigen took Japan by storm with its intensely rich sweet shrimp broth, making it a legendary contemporary flagship ramen spot in Sapporo. Every day, large quantities of sweet shrimp heads are slow-simmered to extract the essence of seafood broth, enhanced with homemade shrimp oil and crunchy toasted shrimp bits for a captivating, sweet seafood flavor. The creamy, rich shrimp soup coats your choice of thick or thin noodles perfectly, while soft-boiled eggs and tender chashu elevate the dish further. A must-visit pilgrimage site for lovers of bold seafood flavors.", "name": "Ebisoba Ichigen Main Shop", "transport": "Approx. 3-min walk from Higashi-Honganji-Mae Station on the Sapporo Streetcar / Approx. 12-min walk from Susukino Subway Station"}, {"address": "1F Minami 4 Nishi 2 Building, Minami 4-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Originating in Sapporo, Kushidori is a well-established, wallet-friendly yakitori chain deeply rooted in Hokkaido culture. The restaurant insists on using fresh local Hokkaido chicken and ingredients, grilled to order over Binchotan charcoal. The classic chicken skewers feature slightly charred, crispy skins while locking in succulent juices; bacon-wrapped enoki mushrooms and pork skewers are also customer favorites. Every seated guest is welcomed with a complimentary cup of hot, delicate chicken soup. Offering fantastic food quality, unmatched value, and a vibrant local atmosphere, it is widely praised by local office workers and travelers alike.", "name": "Kushidori Chuo Honten", "transport": "Directly at Exit 2 of Hosui-Susukino Station on the Sapporo Municipal Subway Toho Line / Approx. 2-min walk from Susukino Station on the Namboku Line"}, {"address": "2F Miyako Building, Minami 4-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | Located in the heart of Susukino, Suage+ is a pioneer of Sapporo soup curry. The name \u0027Suage\u0027 means deep-frying without batter, a technique used here to flash-fry fresh local Hokkaido vegetables and meats to preserve their natural sweetness and crisp texture. The signature \u0027Shiretoko Chicken Skewer Soup Curry\u0027 uses famous Shiretoko chicken, featuring crispy skin and tender, chewy meat. Their legendary squid ink or signature onion broth base is rich, smooth, and delicately spiced. Served alongside rice mixed with red rice and barley plus a lemon wedge, its savory, tangy, and fragrant profile receives rave reviews from both locals and international tourists.", "name": "Soup Curry Suage+ Main Store", "transport": "Approx. 1-min walk from Exit 2 of Susukino Station on the Sapporo Municipal Subway Namboku Line"}], "name": "Iconic Local Establishments"}, "cat_2": {"items": [{"address": "8-2, Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Tucked away near Tanukikoji, this ultimate latte specialty shop is famous for using premium fresh milk sourced from various local farms across Hokkaido. Customers can choose their preferred milk from Tokachi, Biei, or Hakodate to pair with dark-roast espresso. Densely creamy and intensely aromatic, the rich dairy blends seamlessly with coffee oils for an exceptionally smooth texture. Compact yet stylish, it is a daily pilgrimage spot for both tourists and local coffee lovers.", "name": "BARISTART COFFEE", "transport": "Approx. 3-min walk from Susukino Station on the Sapporo Municipal Subway Namboku Line / Approx. 2-min walk from Tanukikoji Stop on the Sapporo Streetcar"}, {"address": "1-1, Minami 1-jo Higashi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | An independent Bean-to-Bar chocolate cafe located at the end of Tanukikoji 1-chome. Crafting chocolate in-house from carefully selected cacao beans worldwide, they offer unique cocoa drinks and cocoa pancakes during brunch and afternoon tea hours. The rich, non-cloying cocoa flavor paired with delicately whipped milk foam creates delightful layers of taste. Highly popular among young adults and female tourists, its sleek, modern industrial interior is also a prime photo spot.", "name": "Saturdays Chocolate Factory \u0026 Cafe", "transport": "Approx. 3-min walk from Exit 34 of Odori Station on the Sapporo Municipal Subway Toho Line / Approx. 2-min walk from Tanukikoji 1-chome"}, {"address": "11, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | An iconic retro-style cafe located within the bustling Tanukikoji Shopping Street. Featuring in-house roasted high-quality beans, their signature black coffee is deep, mellow, and leaves a wonderfully sweet aftertaste. Paired with silky cheesecake or butter toast, it showcases authentic Japanese Kissaten charm. The warm, dimly lit wooden interior provides a perfect sanctuary to unwind from shopping and soak in Hokkaido\u0027s relaxed pace.", "name": "Miyakoshiya Coffee Tanukikoji", "transport": "Approx. 1-min walk from Tanukikoji Stop on the Sapporo Streetcar / Approx. 3-min walk from Susukino Subway Station"}, {"address": "3-1, Minami 1-jo Higashi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A sophisticated brunch cafe combining lush greenery, a boutique select shop, and an arts space. The menu features exquisite French toast, fresh salad plates, and rich coffee. Highly recommended is their signature French toast\u2014golden and crispy on the outside, pudding-soft on the inside, drizzled with pure Hokkaido maple syrup and fresh whipped cream. Sweetly fragrant yet light, it is a favorite among local trendsetters and travelers alike.", "name": "FABULOUS Cafe \u0026 Shop", "transport": "Approx. 1-min walk from Exit 5 of Bus Center-Mae Station on the Sapporo Municipal Subway Tozai Line / Approx. 3-min walk from the east side of Tanukikoji 1-chome"}, {"address": "B3F Toshin Building, Minami 1-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A beloved basement cafe near Susukino and Odori famous for its extravagantly stuffed sandwiches. Their iconic combo features the King Crab Salad Sandwich paired with the Fruit Sandwich; the bread is cloud-soft, the king crab meat juicy and refreshing, while the fruit sandwich offers a perfectly balanced sweetness. Both locals and tourists gladly queue up for this unmissable Sapporo brunch classic.", "name": "Cafe Saera", "transport": "Directly connected to Exit 19 of Odori Station on the Sapporo Municipal Subway / Approx. 3-min walk from Tanukikoji 3-chome"}, {"address": "2F, 18-1, Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | A stylish dessert cafe near Tanukikoji 5-chome, famous for artful night parfaits (shime parfait) and delicate afternoon tea treats. Using high-purity Hokkaido cream and seasonal fresh fruits, they craft parfaits and pancakes that look like works of art. The creamy ice cream harmonizes with the sweet-and-sour crunch of fruit with finely calibrated sweetness, showcasing the premium flavor of Hokkaido dairy to perfection.", "name": "INITIAL Sapporo", "transport": "Approx. 2-min walk from Shiseikan-Shogakko-Mae Stop on the Sapporo Streetcar / Approx. 4-min walk from Susukino Subway Station"}, {"address": "4F Suzuran Building, Minami 4-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A whimsical ice cream cafe in the Susukino area known for its fairytale charm. Serving rich and smooth Hokkaido milk soft-serve, its unique highlight is the side of premium liqueurs provided for guests to drizzle over their ice cream, finished with hot freshly brewed coffee and homemade cookies. The sophisticated alcohol aromas blend exquisitely with pure milk flavors, making this creative spot Susukino\u0027s most popular late-night dessert cafe.", "name": "Milk Mura Softcream \u0026 Coffee", "transport": "Approx. 1-min walk from Exit 3 of Susukino Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "1F TAKARA Building, Minami 6-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Tucked away in a Susukino alley, this cozy and chic cafe serves amazing handmade souffl\u00e9 pancakes and exquisite brunch options. Made fresh to order, the signature souffl\u00e9 pancakes are cloud-soft, melt-in-your-mouth fluffy, and bursting with rich egg flavor and pure Hokkaido milk goodness. Paired with house-blended dark roast hand-drip coffee that balances bitterness and sweetness perfectly, it\u0027s a hidden gem to unwind and savor quiet moments in nightlife-filled Susukino.", "name": "ROJIURA CAFE", "transport": "Approx. 3-min walk from Susukino Station on the Sapporo Municipal Subway Namboku Line / Approx. 3-min walk from Hosui-Susukino Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1F, Capitol Building, Minami 3-jo Nishi 3-chome 1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 Stars | Famous for its ritualistic, overflowing salmon roe bowl, \u0027Tsukko-meshi\u0027! The energy is electric as staff shout \u0027Osa-sa!\u0027 while scooping glistening salmon roe onto your rice until it overflows. The salmon roe pops with rich, sweet, and savory juices, pairing perfectly with warm rice. Featuring fresh seafood delivered straight from Hokkaido fishermen, the grilled Okhotsk Atka mackerel is thick, tender, and juicy. It\u0027s a top-choice izakaya for both tourists and locals to unwind.", "name": "Seafood House Hachikyo Main Store (Umeshiya Hachikyo Honten)", "transport": "Approx. 3-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "1F, Light Building, Minami 6-jo Nishi 4-chome 1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | A classic robatayaki restaurant in the heart of Susukino, bursting with nostalgic Showa-era charm. Seated around the charcoal grill, chefs expertly roast fresh fish and seasonal vegetables delivered daily from Hakodate and Kushiro. Must-try dishes include grilled alfonsino and charcoal-grilled King Crab legs\u2014crispy on the outside while locking in tender, juicy sweetness. Pair the smoky seafood flavors with a glass of Hokkaido\u0027s local \u0027Otokoyama\u0027 sake for the ultimate northern night vibe.", "name": "Robatayaki Oosuke Main Store (Robata Oosuke Honten)", "transport": "Approx. 4-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "2F, Minami 5-jo Nishi 3-chome 1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 Stars | A lively izakaya bringing together ingredients from all across Hokkaido, beloved by young adults and travelers alike. Their famous \u0027Special Genghis Khan Grilled Mutton\u0027 uses tender, odorless lamb seared on a special skillet and served with a secret sauce for an remarkably melt-in-your-mouth feel. They also offer lavish seafood platters and thick-cut Tokachi grilled pork. Paired with ice-cold draft beer, it\u2019s the perfect spot to savor authentic Hokkaido regional specialties.", "name": "Hokkaido Shoku-Ichiba Ezoya", "transport": "Approx. 2-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "2F, Minami 5-jo Nishi 3-chome 5, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 Stars | A hidden high-end robatayaki gem tucked away in Susukino alleys, highly acclaimed by foodies. \u0027Menme\u0027 refers to Hokkaido\u0027s premium channel rockfish (Kinki). Their signature \u0027Salt-Grilled Kinki\u0027 is rich in healthy fats; slowly roasted over Binchotan charcoal, the bubbling oils infuse the delicate fish flesh, creating crisp skin and melt-in-your-mouth flesh. You can even have the fish bones turned into a flavorful soup afterward. Offering refined tastes and an exquisite atmosphere, it\u0027s a dream destination for upscale Hokkaido dining.", "name": "Robata Menme", "transport": "Approx. 3-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "B1F, Building, Minami 3-jo Nishi 2-chome 1, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | Located right next to Tanukikoji Shopping Street, this izakaya specializes in Hokkaido\u0027s famed Akkeshi oysters shipped directly from the fishing port. Enjoy oysters raw, steamed, or charcoal-grilled. The raw oysters are plump and juicy, bursting with rich, sweet, slightly briny creamy flavor with zero fishiness. Pair them with local Hokkaido sake or a crisp white wine in a lively atmosphere\u2014a perfect spot for a casual drink and snack after shopping.", "name": "Akkeshi Kakiba Tanukikoji Branch", "transport": "Approx. 4-min walk from Odori Station or Susukino Station on the Sapporo Tozai/Namboku Subway Lines"}, {"address": "3F, Green Building, Minami 4-jo Nishi 3-chome 2, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 Stars | A stylish izakaya highlighting charcoal grills and specialty Hokkaido regional dishes, featuring a modern ambiance with private booth seating options. The charcoal-grilled Shiretoko chicken skewers are highly recommended, featuring crispy skin, juicy meat, and a lovely smoky aroma. Don\u0027t miss the Hokkaido cheese potato cake\u2014crispy outside, fluffy inside, and rich with milky flavor. With dozens of Hokkaido-exclusive sakes and whiskies, it\u2019s ideal for gatherings and enjoying cozy northern nights.", "name": "Sumibi Izakaya Tenku Susukino", "transport": "Approx. 1-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "1F, No.11 Green Building, Minami 5-jo Nishi 4-chome 3, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 Stars | A high-value local favorite izakaya in Susukino\u0027s bustling district, dazzling diners with premium yet affordable seafood. The must-order 5-piece sashimi platter features thick, lush cuts of sweet salmon and tender scallops that taste fresh from the sea. Their Hokkaido fried chicken (Zangi) boasts a crispy savory crust and juicy interior. Paired with a variety of local cocktails and draft beers, it\u0027s an unmissable choice to soak in the lively local atmosphere.", "name": "Hokkaido Seafood Izakaya Sankai Susukino", "transport": "Approx. 3-min walk from Susukino Station on the Sapporo Namboku Subway Line"}, {"address": "2F, Minami 4-jo Nishi 2-chome 4, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | An elegant izakaya dedicated to charcoal-grilled dishes paired with exquisite local sakes. Must-order items include charcoal-grilled Hokkaido Wagyu and grilled Soya scallops: the Wagyu is beautifully marbled and melts instantly, while the scallops are plump, juicy, and sweet. The staff professionally recommends pairings from their curated selection of rare sakes from small Hokkaido breweries. Smoky and sake aromas harmonize beautifully for an unforgettable culinary evening in Susukino.", "name": "Charcoal Grill \u0026 Local Sake Sumitansen Susukino", "transport": "Approx. 1-min walk from Hosui-Susukino Station on the Sapporo Toho Subway Line / 3-min walk from Susukino Station on the Namboku Line"}], "name": "Specialty Izakayas \u0026 Regional Cuisine"}, "cat_4": {"items": [{"address": "Minami 2-jo Nishi 7-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 7-chome Arcade)", "feature": "\u2b50 4.4 stars | A vegan restaurant located inside Tanukikoji 7-chome Shopping Street, specializing in raw desserts and fermented organic buckwheat noodles. Their brown rice buckwheat noodles are served with a rich vegan sauce, offering a firm yet smooth texture with a natural nutty grain aroma. The most popular items are the dairy-and-egg-free vegan nut tart and raw chocolate cake, which melt in your mouth without being overly sweet\u2014a hit among plant-based foodies and health-conscious travelers.", "name": "Raw Food \u0026 Vegan Cafe LOHAS", "transport": "Approx. 7-minute walk from Subway Namboku Line \u0027Odori Station\u0027 or \u0027Susukino Station\u0027"}, {"address": "289-139 Minami 8-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Japan\u0027s first organic vegan macrobiotic restaurant, located near the bustling Susukino district. The restaurant insists on using pesticide-free organic ingredients and chemical-free grains. The signature \u0027Longevity Macrobiotic Set\u0027 includes crispy vegetable tempura, handmade tofu, and various seasonal side dishes. The tempura light batter is delightfully crunchy and non-greasy, unlocking the natural sweetness of the vegetables. Paired with multi-grain rice and custom miso soup, it warms you up completely with zero burden.", "name": "Itadaki Zen Sapporo", "transport": "Approx. 4-minute walk from Exit 2 of Subway Namboku Line \u0027Nakajima-koen Station\u0027, or an 8-minute walk from Susukino Station"}, {"address": "1F MYSTAYS PREMIER Sapporo Park, 2-2-10 Minami 9-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | A lush green restaurant located inside a hotel south of Susukino, featuring an indoor waterfall and giant plant displays. It offers an extensive vegan and vegetarian menu. Highly recommended are the vegan soy burger and organic vegetable soy curry. The soy meat patty is lightly seared to a subtle crisp, remaining juicy and bouncy, served alongside a colorful variety of fresh Hokkaido vegetables. It provides a refreshing yet satisfying dining experience in an elegant plant-filled setting.", "name": "Farm to Table TERRA", "transport": "Approx. 2-minute walk from Exit 1 of Subway Namboku Line \u0027Nakajima-koen Station\u0027, or an 8-minute walk from Susukino Station"}, {"address": "B1F, 6-1 Minami 2-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido (Next to Tanukikoji 2-chome)", "feature": "\u2b50 4.5 stars | One of Sapporo\u0027s most famous soup curry hotspots, exceptionally friendly to vegetarians. Their \u002715-Rainbow-Vegetable Soup Curry\u0027 can be customized with a vegetarian soup base. Packed with up to 15 seasonal Hokkaido vegetables like seared burdock, fried potatoes, eggplant, pumpkin, and okra, lightly flash-fried to lock in natural sweetness. The broth is rich and aromatic, while the tender veggies absorb the fragrant spices for a multi-layered flavor profile that keeps locals and tourists happily queuing up.", "name": "Soup Curry GARAKU", "transport": "1-minute walk from Exit 35 of Subway Toho Line \u0027Odori Station\u0027, or 1-minute walk from Tanukikoji 2-chome Shopping Street"}, {"address": "12-6 Minami 3-jo Nishi 1-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | A top-rated soup curry restaurant located near Susukino and Tanukikoji, famous for its rich broth simmered in a high-pressure cooker. Designed specifically for plant-based diners, the \u0027Earth Vegetable Soup Curry\u0027 features okra, lotus root, pumpkin, carrots, and more. Thanks to the unique pressure-cooking method, the carrots and potatoes become melt-in-your-mouth tender, while the lotus root retains a slight crispiness. The subtle spicy kick makes it an exquisite way for vegetarian guests to experience iconic Hokkaido cuisine.", "name": "Soup Curry Yellow", "transport": "Approx. 1-minute walk from Exit 1 of Subway Toho Line \u0027Hosui-Susukino Station\u0027, or a 2-minute walk from Tanukikoji 1-chome"}, {"address": "Minami 2-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 4-chome)", "feature": "\u2b50 4.2 stars | An authentic Indian restaurant inside Tanukikoji 4-chome Shopping Street, boasting a wide selection of vegan and plant-based Indian curries. Highlights include the \u0027Spinach \u0026 Vegan Tofu Curry\u0027 and \u0027Chickpea Spice Curry\u0027, paired with freshly baked whole wheat naan. The curry sauce is velvety and deeply aromatic, infuse
