d with layers of authentic spices, while the naan is crispy on the outside, soft inside, and full of wheat flavor. It\u0027s the ultimate plant-based option when you crave a change of flavor around Tanukikoji.", "name": "Mohan Dish Tanukikoji", "transport": "Approx. 4-minute walk from Subway Namboku Line \u0027Odori Station\u0027 or \u0027Susukino Station\u0027"}, {"address": "20 Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | \u0027Sora\u0027, a popular ramen shop in Susukino, offers a specially crafted vegetarian miso ramen to cater to plant-based travelers. The noodles are made from high-protein Hokkaido wheat, offering a delightfully springy and chewy texture. The rich broth is slow-simmered with vegetables and savory miso, topped with fragrant stir-fried bean sprouts, wood ear mushrooms, and sweet corn. The rich, smooth soup blends seamlessly with the natural vegetable sweetness, allowing vegetarian diners to enjoy authentic Sapporo ramen late at night in Susukino.", "name": "Ramen Sora Susukino Main Store", "transport": "Approx. 3-minute walk from Exit 2 of Subway Namboku Line \u0027Susukino Station\u0027, near Tanukikoji 5-chome"}, {"address": "Minami 1-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | A cozy organic health eatery located just north of Tanukikoji 5-chome, focusing on 100% plant-based and additive-free dishes. The signature dish, \u0027Meatless Soy Cutlet Brown Rice Set\u0027, features a soy cutlet fried to golden perfection\u2014crispy on the outside, tender and fragrant inside\u2014drizzled with a zesty ponzu sauce. Served alongside fragrant, chewy organic brown rice and delicate lightly pickled vegetables, it offers a refined, balanced taste profile that makes it an ideal spot for a wholesome, guilt-free lunch around Tanukikoji.", "name": "Organic \u0026 Natural Food Ninguru", "transport": "Approx. 3-minute walk from Exit 1 of Subway Namboku/Tozai Line \u0027Odori Station\u0027, near Tanukikoji 5-chome"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Pole Town Underground Shopping Street, Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.5 stars | A truly iconic street treat in Hokkaido! The moment you take a bite, the buttery, crispy pastry crust creates a sublime contrast with the rich, gooey cheese filling. Blending delicious cheeses from Hakodate and Bekkai, the filling is smooth, velvety, and perfectly balances sweet and savory flavors. Enjoy it fresh out of the oven for a warm, oozing center, or let it cool for a firm, mousse-like texture. It\u0027s a top-tier street snack loved by both tourists and locals alike.", "name": "KINOTOYA BAKE Cheese Tart Pole Town Store", "transport": "About a 3-minute walk from Odori Station or Susukino Station on the Sapporo Municipal Subway Namboku Line (connected via underground walkway)."}, {"address": "1-1, Minami 5-jo Nishi 5-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.2 stars | Hokkaido\u0027s go-to choice for grab-and-go fried chicken! Their famous jumbo fried chicken bites, known as \u0027Zangi\u0027, feature a light, crispy batter fried to golden perfection, encasing juicy and tender chicken marinated in rich soy sauce and aromatic garlic. Biting into it hot releases a burst of savory juices. Crispy on the outside and succulent on the inside, it\u0027s a must-eat refueling stop for street shoppers.", "name": "Naruto Kitchen Susukino Branch", "transport": "About a 3-minute walk from Susukino Station on the Sapporo Municipal Subway Namboku Line."}, {"address": "3F, Minami 4 Nishi 2 Building, 11-7 Minami 4-jo Nishi 2-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.3 stars | A flagship spot embodying Susukino\u0027s unique \u0027Night Parfait\u0027 culture\u2014a traditional post-drinking sweet treat. The parfaits are masterfully layered with artisanal gelato, fresh seasonal Hokkaido fruit, and silky whipped cream, offering a rich yet refreshing taste that isn\u0027t overly sweet. From tangy sorbets to deep, velvety dessert sauces at the bottom, every bite delivers a symphony of flavors. Beautifully presented like a work of art, it\u0027s immensely popular with nighttime explorers.", "name": "Night Parfait Specialty Store Parfaiteria PaL", "transport": "About a 1-minute walk from Susukino Station on the Sapporo Municipal Subway Namboku Line."}, {"address": "Tanukikoji 4-chome, 12-1 Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.0 stars | An immensely popular street snack located in the heart of the Tanukikoji Shopping Street. The takoyaki balls are fried with hot refined oil to achieve an ultra-crispy golden exterior while keeping the center soft, rich, and creamy, packed with bite-sized pieces of tender deep-sea octopus. Drizzled with signature sweet and savory sauce, rich mayonnaise, and dancing bonito flakes, they are hot, crispy, and comforting\u2014the ultimate savory snack when taking a shopping break.", "name": "Tsukiji Gindaco Tanukikoji Branch", "transport": "About a 4-minute walk from Susukino Station or Odori Station on the Sapporo Municipal Subway Namboku Line."}, {"address": "1-1 Minami 4-jo Nishi 5-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 stars | The ultimate street food hidden inside Hokkaido\u0027s legendary local convenience store chain! The \u0027HOT CHEF\u0027 counter serves freshly fried Hokkaido chicken (Zangi) and piping-hot jumbo rice balls. The chicken features a golden, crispy skin and thick, juicy meat marinated in dashi-infused savory seasoning. Warm and satisfying in your hand, it\u0027s one of Susukino\u0027s most authentic, delicious, and budget-friendly street bites.", "name": "Seicomart Hot Chef Minami 4-jo Branch", "transport": "About a 2-minute walk from Susukino Station on the Sapporo Municipal Subway Namboku Line."}, {"address": "8-2 Minami 1-jo Nishi 4-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.5 stars | The most popular spot in the Tanukikoji shopping district for specialty milk coffee and takeaway cream puffs! Customers can choose rare, single-origin fresh milk from different Hokkaido farms (such as Tokachi, Hakodate, or Biei) to blend with espresso for an exceptionally creamy and velvety latte. Pair it with their freshly baked, crispy cream puffs stuffed with rich custard cream\u2014a fragrant, delicious grab-and-go combo perfect for a stroll.", "name": "BARISTART COFFEE Sapporo", "transport": "About a 3-minute walk from Odori Station on the Sapporo Municipal Subway, near Tanukikoji 3-chome."}, {"address": "Tanukikoji 2-chome, 8-1 Minami 2-jo Nishi 2-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 stars | A boutique cocoa dessert shop located in Tanukikoji 2-chome. Specializing in house-made bean-to-bar dark chocolate soft-serve ice cream and freshly baked artisanal cookies, the soft serve boasts a silky-smooth texture with natural fruity notes and deep bittersweet chocolate flavors that are delightfully balanced. Enjoying this luxurious treat while strolling down the shopping street is an unmissable experience for chocolate lovers.", "name": "Saturdays Chocolate Stand Tanukikoji", "transport": "About a 5-minute walk from Odori Station or Susukino Station on the Sapporo Municipal Subway."}, {"address": "Tanukikoji 3-chome, 11 Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.1 stars | A popular dessert shop specializing in exquisite fruit daifuku for street snacking. Whole juicy seasonal fruits (like strawberries, cantaloupes, or grapes) and a delicate layer of low-sugar Hokkaido white bean paste are wrapped inside an ultra-thin, chewy mochi skin. Use the provided string to slice it cleanly in half, revealing a stunning cross-section. Every bite bursts with fresh fruit juice, beautifully balancing sweet and tart flavors with soft mochi texture\u2014a feast for both the eyes and the palate.", "name": "Benzaiten Fruit Daifuku Tanukikoji Branch", "transport": "About a 3-minute walk from Susukino Station on the Sapporo Municipal Subway Namboku Line."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Susukino and Tanukikoji Shopping Street"}};
        const themeHex = "#475569";
        const cityName = "Hokkaido";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
