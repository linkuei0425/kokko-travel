    <script>
        const db = {"asahikawa_zoo": {"categories": {"cat_1": {"items": [{"address": "1F 2B Nijo Bldg., 2-Jo-Dori 8-Chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 Stars | Founded in 1947, this historic Asahikawa ramen establishment has won the hearts of countless foodies with its signature shoyu (soy sauce) ramen passed down through generations. The broth is meticulously simmered from seafood (dried sardines, kelp), pork bones, and chicken bones, topped with a fragrant layer of lard that locks in the heat. Mid-thin curly noodles absorb the rich soup perfectly, paired with melt-in-your-mouth soy-marinated chashu pork and crisp bamboo shoots for a rich yet non-greasy flavor profile. The walls are covered with signatures from celebrities and tourists over decades, radiating a warm and welcoming diner vibe\u2014making it an absolute must-visit first stop for classic Asahikawa ramen.", "name": "Asahikawa Ramen Aoba Main Store", "transport": "Approx. 5-minute walk from JR Asahikawa Station"}, {"address": "5-Jo-Dori 7-Chome Migi 6, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 Stars | Founded in 1947 (Showa 22), Hachiya is one of Asahikawa\u0027s iconic soul-food ramen spots, famous for its unique \u0027charred lard\u0027 dark broth. The soup base blends rich pork bone broth with the delicate seafood flavor of dried sardines. Its most distinctive feature is the addition of burnt lard on top, conferring a bold, smoky-charred aroma. Medium-thin low-hydration wavy noodles hook onto this rich, slightly bittersweet signature broth. For lovers of intense flavors and nostalgic classic ramen, this deep-rooted, highly distinctive bowl is unforgettable.", "name": "Hachiya Gojo Main Shop", "transport": "Approx. 10-minute walk from JR Asahikawa Station"}, {"address": "4-Jo-Dori 5-Chome 1420-1, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 Stars | When it comes to Asahikawa\u0027s famed local grilled lamb \u0027Genghis Khan\u0027, Daikokuya is unarguably the premier classic establishment. They strictly select high-quality, tender raw lamb under one year old, completely free of gamey odor and bursting with juicy flavor. The signature shoulder loin is thick and plump, grilled over high heat on a cast-iron skillet. The melting fat renders down to baste the surrounding onions and scallions, turning the vegetables extraordinarily sweet as they absorb the meat juices. Dipped in the secret homemade sauce with a perfect balance of sweet, savory, and tangy notes, it drives locals and tourists crazy\u2014making every minute in line well worth it.", "name": "Daikokuya Genghis Khan Main Shop", "transport": "Approx. 10-minute walk from JR Asahikawa Station"}, {"address": "57 Alley Furarito, 5-Jo-Dori 7-Chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 Stars | Founded in 1950 (Showa 25) and tucked away in the nostalgic \u002757 Alley Furarito\u0027, Ginneko is the birthplace of Asahikawa\u0027s famed local specialty \u0027Shinkoyaki\u0027. Shinkoyaki features half a young Hokkaido chicken slowly grilled over Binchotan charcoal, achieving a lightly charred, crispy skin while keeping the meat remarkably juicy and tender. Brushed with a secret sweet-and-savory sauce aged over 70 years or simply sprinkled with salt, powerful charcoal aromas and chicken flavor explode in your mouth. Retaining a cozy Showa-era izakaya atmosphere, it\u0027s the ultimate place to soak in local food culture and enjoy a delightful drink.", "name": "Yakitori Ginneko", "transport": "Approx. 10-minute walk from JR Asahikawa Station"}, {"address": "5-Jo-Dori 8-Chome Hidari 2, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 Stars | Founded in 1939 (Showa 14), this retro Western-style diner skyrocketed in fame as a filming location for the popular Japanese drama *Solitary Gourmet*. The interior exudes a warm Showa-era nostalgia, complete with classic wooden tables and vintage signboards. Popular signature dishes include the special \u0027Goro Set\u0027 (featuring minced meat cutlet and small pork chops), remarkably tender steak coated in rich demi-glace sauce, and fragrant omurice. The fried dishes boast a crispy exterior with juicy filling inside, beautifully showcasing Japan\u0027s early fusion of Western comfort food and local flair.", "name": "Jiyuken Yoshoku Restaurant", "transport": "Approx. 9-minute walk from JR Asahikawa Station"}, {"address": "B1F Kaimono Koen 2\u30fb8 Bldg., 2-Jo-Dori 8-Chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 Stars | Michelin Bib Gourmand-recommended Baikoken was established in 1969, and its basement main store is constantly packed with eager diners. The soul of their ramen lies in a double-soup technique, blending rich land flavors (pork and chicken bones) with oceanic essence (kelp and dried sardines) for a deeply satisfying, smooth broth. Most famous are their signature jumbo bamboo shoots\u2014extra crisp and juicy\u2014paired with springy wavy noodles and tender chashu pork. Every bite bursts with seafood and pork savory goodness, solidifying its place as a classic Asahikawa ramen temple.", "name": "Baikoken Main Store", "transport": "Approx. 3-minute walk from JR Asahikawa Station"}, {"address": "1F Sasaki Bldg., 1-Jo-Dori 8-Chome 348-3, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 Stars | Founded in 1988, Ramen Santouka is relatively younger than other classic shops, but it quickly became a legendary ambassador taking Asahikawa ramen global. Its flagship main store is world-renowned for its signature Shio (Salt) Tonkotsu Ramen\u2014a silky, pearly-white pork bone broth simmered slowly for hours to achieve rich smoothness without any gamey odor. Topped with a signature pickled red plum in the center that offers a refreshingly tangy contrast. Paired with melt-in-your-mouth pork cheek chashu (Toroniku) and low-hydration medium-thin noodles that cling to the soup, it remains a bucket-list pilgrimage spot for ramen lovers worldwide.", "name": "Ramen Santouka Main Store", "transport": "Approx. 2-minute walk from JR Asahikawa Station"}, {"address": "Tokiwa-dori 3-Chome 405, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 Stars | Founded in 1929 (Showa 4), Tsuboya Honten is Asahikawa\u0027s premier traditional confectionery house, with Tokiwakan acting as its flagship store set amidst classic Japanese architecture and a tranquil garden. Its most famous creation is \u0027Kibana\u0027, a multi-time Monde Selection Gold Award-winning confection featuring crisp almond galettes filled with smooth white chocolate\u2014crispy, sweet, and capturing the romantic winter spirit of Hokkaido. The store also offers fresh Japanese wagashi and Western pastries, alongside an elegant tearoom space perfect for experiencing local confectionery heritage and purchasing souvenirs.", "name": "Tsuboya Honten Tokiwakan", "transport": "Approx. 2-minute walk from \u0027Tokiwa Koen-mae\u0027 bus stop after taking a bus from JR Asahikawa Station"}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "2-1970-1 Tokiwadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | A stylish cafe renovated from a historic traditional Japanese house, featuring its signature dessert \u0027Tokiwa-yaki\u0027 shaped like Asahikawa\u0027s iconic Asahi Bridge. Tokiwa-yaki has a crispy outer shell and a soft, chewy filling; the red bean cheese flavor comes highly recommended for its perfect sweet-and-savory balance. Pair it with a beautifully layered Uji Matcha Milk for a pleasantly bitter, non-cloying taste. Filled with nostalgic Japanese-Western fusion charm, it\u0027s a top cozy afternoon tea choice for both tourists and locals.", "name": "Fukuyoshi Cafe Asahibashi Main Store", "transport": "Take a bus from JR Asahikawa Station for about 10 minutes, get off at \u0027Tokiwa 1-chome\u0027 stop, and walk for about 2 minutes."}, {"address": "714-2 Yonehara, Higashi-Asahikawa-cho, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | A forest-themed hidden cafe near Asahiyama Zoo, surrounded by lush green woods. The cafe serves rich, house-roasted pour-over coffee and brunch dishes made with carefully selected local ingredients. The freshly toasted thick-cut toast is especially crisp on the outside and soft inside with a rich milky aroma, perfectly paired with silky scrambled eggs and homemade jam for a rich texture. The tranquil and elegant natural atmosphere is refreshing, making it an excellent spot to unwind before or after visiting the zoo.", "name": "CAFE GOOD LIFE", "transport": "About an 8-minute drive from Asahiyama Zoo, or a 30-minute drive from JR Asahikawa Station."}, {"address": "825 6-chome, 4-jodori, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | An atmospheric cafe located on a bustling street corner in downtown Asahikawa, where soft jazz music plays to create a serene and refined vibe. Highly recommended is their signature handmade Basque cheesecake, which boasts an exceptionally smooth, melt-in-your-mouth texture paired with rich dairy notes and a hint of caramel bitterness. Paired with a house-blended single-origin pour-over coffee, the warm, deep-roasted bitterness perfectly elevates the cake\u0027s sweetness, making it a favorite among dessert lovers and hipsters alike.", "name": "Switch Flavors", "transport": "About an 8-minute walk from JR Asahikawa Station."}, {"address": "1-1-7 Kaguraoka 8-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | A romantic stone-built cafe constructed with Biei soft stone, featuring a comfortable dine-in seating area. The most popular offerings are exquisite pastries baked with premium Hokkaido raw milk and flour. The freshly baked cheese tarts eaten on-site stand out with their buttery, crispy crust and rich, custard-like molten filling that balances sweet and tangy flavors. Paired with aromatic dark roast coffee or fresh milk tea, it offers pure satisfaction, making it an unmissable brunch and dessert haven in Asahikawa.", "name": "The Sun Kurato Main Store", "transport": "About a 5-minute walk from JR Kaguraoka Station, or a 10-minute drive from JR Asahikawa Station."}, {"address": "1-1-8 Toyooka 5-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | A retro warehouse-style cafe nestled in a residential area, converted from an old stone warehouse with high ceilings and a nostalgic atmosphere. The cafe carefully selects high-quality beans from around the world for in-house roasting, serving pour-over coffee that is aromatic, smooth, and full-bodied. Their brunch thick-cut butter pizza toast features bread that is crispy outside yet soft and bouncy inside, topped with melted gooey cheese and rich tomato sauce. Its savory allure draws countless foodies seeking classic Showa-era kissaten flavors.", "name": "Coffee Senmon Kura", "transport": "About a 10-minute drive from JR Asahikawa Station, or take a bus to \u0027Toyooka 4-jo 1-chome\u0027 stop and walk for about 3 minutes."}, {"address": "5-jodori 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | A Showa-style retro coffee shop located near Kaimono Koen Street, exuding a warm ambiance shaped by time. The cafe uses traditional siphon coffee makers to brew smooth, rich coffee with a lingering finish on the spot. The classic brunch set includes a freshly made thick egg sandwich\u2014golden, crispy toasted bread wrapped around warm, soft, and fluffy thick omelet that bursts with savory egg flavor upon first bite. This simple yet richly layered traditional delicacy has captured the hearts of locals and tourists alike.", "name": "Coffee-tei Jurin", "transport": "About a 10-minute walk from JR Asahikawa Station."}, {"address": "108 8-chome, 1-jodori, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | Located on the famous Heiwa Dori Kaimono Koen pedestrian street, this is an ideal spot to experience local Asahikawa breakfast culture. The classic charcoal-roasted black coffee features a unique smoky aroma and smooth aftertaste, perfectly paired with freshly made copper-plate grilled pancakes. The pancakes are crisp on the outside and soft inside, served with rich butter and maple syrup for a melt-in-your-mouth sweet treat. Enjoy a relaxing brunch while taking in the street views.", "name": "Coffee-kan Kaimono Koen Branch", "transport": "About a 3-minute walk from JR Asahikawa Station."}, {"address": "5-1-26 Higashi-Asahikawa Kita 1-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | A cozy, family-run cafe tucked away in the suburbs of Asahikawa, offering a quiet and elegant setting perfect for a slow-paced brunch. The signature brunch platter features house-made wild yeast sourdough, warm organic salad, and a juicy handmade hamburger patty. The bread is lightly toasted with a natural wheat aroma, while the meat patty is tender and succulent. Paired with a warm, sweet hot latte featuring dense and smooth foam, it is highly favored by local food lovers who value quality ingredients.", "name": "Cafe Chishin", "transport": "About a 7-minute walk from JR Higashi-Asahikawa Station."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "1404-1, 4-jo-dori 5-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Asahikawa\u0027s most iconic Genghis Khan (grilled mutton) restaurant! Featuring strictly selected, incredibly tender fresh mutton with zero gamey odor, grilled on a custom iron skillet alongside sweet onions and green onions. Juicy and flavorful with an inviting aroma, perfectly paired with their signature dipping sauce\u2014a must-try local culinary experience highly recommended by both tourists and locals.", "name": "Daikokuya Genghis Khan Main Store", "transport": "About a 10-minute walk from JR Asahikawa Station"}, {"address": "5.7 Alley Furari-to, 5-jo-dori 7-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | A historic izakaya with over 70 years of history, located inside the famous \u00275.7 Alley\u0027 (Furari-to). The signature \u0027Shinko-yaki\u0027 is a legendary Asahikawa local delicacy consisting of bone-in young chicken slow-roasted over charcoal until golden and crispy. Brushed with a decades-old secret sauce or lightly salted, the meat is exceptionally tender and juicy, pairing seamlessly with local Junmai sake.", "name": "Ginneko (Shinko-yaki)", "transport": "About an 8-minute walk from JR Asahikawa Station"}, {"address": "2-jo-dori 5-chome Hidari 7, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | A legendary Showa-era izakaya featured in the popular TV show \u0027Solitary Gourmet\u0027, brimming with warm, nostalgic wooden charm. Highlights include seasonal Hokkaido dishes and a wide selection of local sake. Offerings like marinated herring roe, charcoal-grilled Hokke (Okhotsk Atka mackerel), and specialty tamagoyaki capture authentic traditional flavors that captivate foodies.", "name": "Dokushaku Sanshiro", "transport": "About a 7-minute walk from JR Asahikawa Station"}, {"address": "3-jo-dori 7-chome Hidari 5, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1935 (Showa 10), this classic seafood and local cuisine izakaya is renowned for its ultra-fresh Hokkaido seafood. Offering extravagant sashimi platters, sea urchin nori pancakes, fresh Botan shrimp, and various stir-fried dishes made with premium ingredients around Asahikawa, its diverse menu satisfies every Hokkaido seafood craving.", "name": "Izakaya Tenkin Honten", "transport": "About a 6-minute walk from JR Asahikawa Station"}, {"address": "7-jo-dori 8-chome Migi 4, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | A highly distinctive, minimalist local offal BBQ izakaya in Asahikawa. With no printed menu, seating brings an instant mixed pork offal platter seasoned with white pepper and salt. Grilled over charcoal until incredibly aromatic, crispy, and juicy without any unpleasant odor, it pairs perfectly with chilled beer for an authentic local nightlife vibe.", "name": "Baba Hormone", "transport": "About a 15-minute walk from JR Asahikawa Station, or take a city bus to 7-jo 8-chome Stop"}, {"address": "1F Ishiguro Building, 3-jo-dori 6-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | A unique Robatayaki izakaya infused with a rugged Hokkaido hunter-and-fisherman atmosphere, featuring an open charcoal hearth. Guests can watch chefs grill seasonal Hokke mackerel, Hokkaido scallops, Tokachi Wagyu, and fresh local vegetables, served traditionally on wooden paddles for a delight of both flavor and sight.", "name": "Robata Ezo", "transport": "About a 6-minute walk from JR Asahikawa Station"}, {"address": "Midoribashi-dori, 222-1, 2-jo-dori 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | The pioneer brand of marinated Genghis Khan barbecue in Hokkaido. Unlike fresh unmarinated mutton, Matsuo marinates high-quality lamb in natural fruit juices and a special soy sauce blend, making it exceptionally tender with a subtle sweetness. Grilled alongside generous bean sprouts and cabbage that absorb the savory juices, it creates a unique, irresistible flavor that pairs wonderfully with rice.", "name": "Matsuo Genghis Khan Asahikawa Branch", "transport": "About a 4-minute walk from JR Asahikawa Station"}, {"address": "2-jo-dori 7-chome Hidari 1, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | The main store of Hokkaido\u0027s immensely popular yakitori chain, beloved by local office workers and travelers alike. Offering affordable, fresh-grilled-to-order chicken skewers, pork rolls, and shiso rolls, along with complimentary signature chicken broth. Paired with ice-cold draft beer, it is a must-visit hot spot for experiencing Asahikawa\u0027s lively night culture.", "name": "Kushidori Asahikawa Honten", "transport": "About a 5-minute walk from JR Asahikawa Station"}], "name": "Specialty Izakayas \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "5-1-6 Toyooka 13-jo, Asahikawa-shi, Hokkaido", "feature": "\u2b50 4.3 stars | A cozy eatery focusing on pesticide-free organic vegetables and brown rice dishes. The signature \u0027Organic Brown Rice \u0026 Vegetable Platter\u0027 features a chewy, satisfying texture, paired with steamed seasonal vegetables and a special sesame sauce for a light, guilt-free meal. Tourists and local vegans highly recommend the \u0027Plant-Based Curry,\u0027 rich and aromatic with the natural sweetness of fresh veggies\u2014a rare vegan food paradise in downtown Asahikawa.", "name": "Organic Cafe SARA", "transport": "Take the Asahikawa Denki Bus to the \u0027Toyooka 13-jo 4-chome\u0027 stop, then walk for about 3 minutes."}, {"address": "227-2 Higashitoshin, Higashiasahikawa-cho, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | A red-brick farmhouse cafe located near Asahiyama Zoo, centering its menu around vegetables freshly harvested from its own farm. The must-try \u0027Vegetable Tempura with Cold Soba\u0027 is crispy and non-greasy, featuring sweet, creamy sweet potatoes and pumpkins served with a sweet kelp dipping sauce that stimulates the appetite. The lush natural scenery and exquisite vegetarian meals draw countless visitors.", "name": "Farm Cafe Good Life", "transport": "About a 5-minute drive from Asahiyama Zoo, or take the Asahikawa Denki Bus \u0027Higashiasahikawa Line\u0027 to the \u0027Higashitoshin\u0027 stop and walk for 5 minutes."}, {"address": "8-chome, 2-jo-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | A Japanese-style tearoom tucked away near Kaimono Park in central Asahikawa, featuring 100% plant-based ingredients and fermented brown rice. The signature \u0027Brown Rice \u0026 Soy Protein Cutlet Set Meal\u0027 is crispy on the outside and tender inside, mimicking the texture of real meat without any grease. Paired with house-made pickles and miso soup, it offers a warm, soothing meal packed with traditional Japanese health benefits.", "name": "Suzume no An Vegetarian Brown Rice Tearoom", "transport": "About an 8-minute walk from the North Exit of JR Asahikawa Station along Heiwa-dori Kaimono Park."}, {"address": "1-15, 2-chome, Kaguraoka 8-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | A natural food restaurant focusing on seasonal whole foods, beloved by health-conscious diners. Highly recommended is the \u0027Rainbow Veggie Tofu Tart\u0027\u2014the tofu filling is smooth and velvety like mousse, perfectly balanced by a crispy, toasted natural nut crust. With a tranquil ambiance, it\u0027s an ideal spot to enjoy light afternoon tea and plant-based dishes.", "name": "Asahikawa Kokuu Cafe", "transport": "Take the JR Furano Line to \u0027Kaguraoka Station\u0027, then walk for about 10 minutes."}, {"address": "3-8, 11-chome, Kagura 4-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | A cozy bakery carefully selecting Hokkaido wheat and wild yeast to craft a variety of egg- and dairy-free vegan breads. The \u0027Dairy- \u0026 Egg-Free Whole Wheat Red Bean Bun\u0027 stands out with its chewy texture and rich wheat aroma, filled with smooth, subtly sweet red bean paste. Its pure, additive-free taste is adored by vegans and guests with dietary sensitivities alike.", "name": "Bakery Kazasuna", "transport": "About a 6-minute taxi ride from JR Asahikawa Station, or take the Dohoku Bus to the \u0027Kagura 4-jo 11-chome\u0027 stop and walk for 2 minutes."}, {"address": "1441-2, 6-chome, 4-jo-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | A trendy, hip boutique cafe serving premium oat milk lattes and handmade vegan desserts. The signature \u0027Vegan Oat Chocolate Tart\u0027 features a rich, melt-in-your-mouth texture completely free of dairy. Perfectly balanced bittersweet chocolate paired with a crisp tart shell makes it a delightful treat while exploring the city.", "name": "Switch Flavors (Vegan-Friendly Cafe)", "transport": "About a 12-minute walk from JR Asahikawa Station, located in the vibrant 4-jo-dori downtown area."}, {"address": "17-chome, Miyashita-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | An Amazake (sweet sake) shop attached to a century-old sake brewery in Asahikawa, serving non-alcoholic, sugar-free, 100% plant-based \u0027Kokusaimusou Natural Amazake\u0027 and soy milk frozen treats. The Amazake is naturally sweet, rich, and smooth with a subtle aroma of rice koji, while the silky soy milk ice cream makes for a wholesome treat that highlights local flavors while catering to vegetarian preferences.", "name": "Takasago Shuzo Meiji Storehouse Sweet Sake House", "transport": "About a 15-minute walk from JR Asahikawa Station, or a 5-minute taxi ride."}, {"address": "8-chome, 1-jo-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | A spacious retro cafe located in front of Asahikawa Station along Kaimono Park, offering special egg- and dairy-free plant-based fruit pancakes and vegan sorbet. Crisp on the outside and fluffy on the inside, the rice flour pancakes are served with fresh Hokkaido berries and plant-based whipped cream\u2014a refreshing, sweet-and-sour delight that\u0027s a must-try dessert for shoppers.", "name": "Sunroser Asahikawa", "transport": "Exit the North Exit of JR Asahikawa Station, go straight, and walk along Kaimono Park for about 3 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "1970-1 Tokiwadori 2-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Renovated from a historic building, this cafe offers Asahikawa\u0027s exclusive street walk dessert \u0027Tokiwayaki\u0027, designed to replicate the steel beam shape of Asahikawa\u0027s iconic Asahi Bridge. The outer crust combines the crispy texture of a croissant with the soft chewiness of Japanese Taiyaki, filled with Tokachi red bean paste and Uji matcha paste. Crispy on the outside, soft on the inside, and delightfully sweet, it is beloved by both tourists and local youth.", "name": "Fukuyoshi Cafe Asahibashi Main Store", "transport": "From JR Asahikawa Station, take the Chuo Bus to \u0027Tokiwa 1-chome\u0027 stop, then walk about 2 minutes."}, {"address": "2-18 Toko 8-jo 1-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | \u0027Jun Dog\u0027 is a legendary street food unique to the Asahikawa and Biei regions. Freshly fried, crispy pork cutlets or large prawns are dipped in a secret sauce, then tightly wrapped in high-quality Hokkaido glutinous rice to form a hot-dog-like stick. The glutinous rice absorbs the rich aroma of the sauce and fried food, creating a soft, chewy exterior around a crispy, flavorful filling. It\u0027s the ultimate one-handed snack to enjoy while strolling.", "name": "Pigeon-kan Asahikawa (Jun Dog)", "transport": "From JR Asahikawa Station, take a bus to \u0027Toko 8-jo 1-chome\u0027 stop, then walk about 1 minute."}, {"address": "4-jo Dori 13-chome Hidari 1, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Founded in the Showa era, this century-old local Asahikawa confectionery produces \u0027Vitamin Castella\u0027, a nostalgic childhood snack shared by Hokkaido residents. The sponge cake has a solid yet slightly dry traditional texture, bursting with rich egg aroma and honey sweetness. Lightly sweet without being cloying, it is best enjoyed authentic-style paired with a bottle of fresh Hokkaido milk.", "name": "Takahashi Seika Direct Store", "transport": "About a 15-minute walk from JR Asahikawa Station, or take a bus to \u00274-jo Dori 13-chome\u0027 stop."}, {"address": "Kuranuma, Higashi-Asahikawa-cho, Asahikawa, Hokkaido (Near the East Gate inside Asahiyama Zoo)", "feature": "\u2b50 4.0 stars | A popular snack stall located inside Asahiyama Zoo, best known for its made-to-order animal-shaped melon pan (pineapple buns) and Hokkaido fresh milk melon soft-serve ice cream. The melon pan features a golden crispy outer crust and a fluffy interior, while the soft-serve uses fresh local Biei milk to deliver a rich, velvety texture that melts in your mouth with deep milky flavor\u2014a must-try treat while exploring the zoo.", "name": "Asahiyama Zoo Central Canteen", "transport": "From JR Asahikawa Station Bus Stop No. 6, take the Asahikawa Denki Koido Bus \u0027Asahiyama Zoo Line\u0027 to the terminal stop."}, {"address": "1-1 Takasagodai 1-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | A historic confectionery store in Asahikawa, famous for its award-winning \u0027Kibana\u0027 almond wafers\u2014a top pick for on-the-go souvenirs. Featuring rich white chocolate sandwiched between two incredibly crispy almond wafer cookies, the nutty aroma blends seamlessly with the rich sweetness of white chocolate. Richly layered and crisp, it\u0027s a refined treat to grab while strolling along Heiwa Dori Kaimono Koen.", "name": "Tsuboya Sohonten Main Store", "transport": "From JR Asahikawa Station, take a bus to \u0027Takasagodai 1-chome\u0027 stop, then walk about 3 minutes."}, {"address": "5.7 Alley Furarito, 5-jo Dori 7-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Located in the retro Showa-style \u00275.7 Alley Furarito\u0027 food lane, specializing in Asahikawa\u0027s famous street food snack \u0027Shin-Ko Yaki\u0027 (grilled young chicken). Half a Hokkaido-raised chicken is grilled over high-heat Kishu Binchotan charcoal until golden and crispy on the outside, succulent and tender on the inside, then brushed with a decades-old secret sweet-and-savory sauce. The smoky charcoal aroma is finger-licking good.", "name": "Yakitori Ginneko", "transport": "About a 10-minute walk from JR Asahikawa Station North Exit into 5.7 Alley."}, {"address": "5-jo Dori 7-chome Migi 6, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Besides its famous burnt-lard shoyu ramen, Hachiya\u0027s handmade large gyoza (pan-fried dumplings) are highly recommended by locals as a delicious street snack. Pan-fried to a golden crispy bottom with a chewy wrapper, they are filled generously with cabbage and black pork. One bite releases savory, flavorful juices, leaving a lasting harmony of charred and meaty aromas.", "name": "Hachiya Gojo Main Store", "transport": "About a 9-minute walk from JR Asahikawa Station."}, {"address": "Heiwa Dori Kaimono Koen Pedestrian Street, between Miyashita-dori and 8-jo Dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Seasonal open-air food stalls located in Heiwa Dori Kaimono Koen, Japan\u0027s first pedestrian sanctuary. Stalls serve steamed Hokkaido Danshaku potatoes slathered with a thick layer of fermented butter\u2014fluffy and soft potatoes paired perfectly with melted savory butter. You\u0027ll also find incredibly sweet grilled corn, plump and juicy, offering the purest taste of Hokkaido\u0027s northern flavors.", "name": "Asahikawa Kaimono Koen Street Market Stalls", "transport": "Located right outside JR Asahikawa Station North Exit at the Kaimono Koen Pedestrian Street."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Downtown Asahikawa and Asahiyama Zoo"}, "furano_biei": {"categories": {"cat_1": {"items": [{"address": "11-8 Hinodecho, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | A legendary Furano curry landmark founded in 1974, featuring a wooden cottage exterior that looks straight out of a fairytale hunter\u0027s cabin. The restaurant is most famous for its proprietary black curry, simmered for hours to create a rich, aromatic spice profile with a deep, subtle bit of bitterness. The signature \u0027Homemade Sausage Curry\u0027 features handcrafted sausages that burst with juicy goodness when sliced\u2014crispy on the outside, dense on the inside\u2014paired with a rich, mildly spicy curry sauce and sweet local Furano rice. If you run out of curry sauce, simply bring your plate to the counter and chant the classic magic words \u0027Ruru-ruru-ruru\u0027 for a free refill, making it a beloved hit with both tourists and locals.", "name": "Yuiga Doxon", "transport": "Approx. 5 minutes walk from JR Furano Station"}, {"address": "3-22 Hinodecho, Furano, Hokkaido", "feature": "\u2b50 4.1 stars | A highly representative local cuisine restaurant in Furano, named after the black woodpecker. The star dish, \u0027Wagyu Sashimi Don\u0027, features raw Hokkaido Wagyu beef slices laid over steaming hot rice; the beautiful pink meat melts in your mouth with a rich, sweet fatty aroma\u2014truly sublime when dipped in their special sauce. Additionally, the Ishikari-style \u0027Sanzoku Nabe\u0027 (Bandit Hot Pot) features a savory miso base filled with venison, duck, chicken, and fresh local Furano vegetables, producing a sweet, comforting broth. Cozy stone walls and log interiors let guests savor land and sea delicacies while soaking in authentic northern hospitality.", "name": "Kumagera", "transport": "Approx. 5 minutes walk from JR Furano Station"}, {"address": "4-4-10 Honmachi, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.4 stars | The top-ranked Western-style long-standing restaurant in Biei, famous for its mind-blowing \u0027Ebi Ten Don\u0027 (Fried Shrimp Rice Bowl) that constantly draws crowds. Extra-large, snappy fresh prawns are coated in a special batter and fried to golden perfection, delivering a delightful crunch with firm, sweet prawn meat. Drizzled with a secret sweet-and-savory sauce passed down through generations, it is satisfying without feeling heavy and pairs seamlessly with premium local Biei rice. Bright, comfortable, and serving top-tier local flavors in every bite, it is an absolute must-visit culinary stop in Biei.", "name": "Yoshoku Junpei", "transport": "Approx. 10 minutes walk from JR Biei Station"}, {"address": "12-6 Saiwaicho, Furano, Hokkaido", "feature": "\u2b50 4.0 stars | The most iconic classic ramen spot in Furano, and a must-visit for noodle lovers traveling through the area. The signature \u0027Shinatora Black Garlic Oil Charred Soy Sauce Ramen\u0027 features a deep broth simmered for hours with pork bones and seafood, infused with house-blend black garlic oil and aromatic charred sesame oil. The dark soup is rich and full-bodied yet smooth on the throat, releasing layers of garlic and soy sauce aromas. Paired with springy medium-thick wavy noodles and melt-in-your-mouth charred pork chashu, the flavors are exceptionally complex and satisfying down to the last drop.", "name": "Shinatora", "transport": "Approx. 6 minutes walk from JR Furano Station"}, {"address": "11-15 Asahimachi, Furano, Hokkaido", "feature": "\u2b50 4.3 stars | A popular local teppanyaki hotspot that helped pioneer the famous \u0027Furano Curry Omurice\u0027. Their signature Furano Omurice showcases local farm produce, wrapping silky, soft-cooked eggs around fragrant butter fried rice, topped with a rich secret curry sauce. The creamy texture blends egg and curry aromas seamlessly. Following official local certification rules, every omurice order comes with a complimentary bottle of fresh Furano milk, whose rich flavor perfectly balances the spice of the curry. It\u0027s a supreme delicacy combining regional ingredients with master teppanyaki craft.", "name": "Teppan Masa", "transport": "Approx. 4 minutes walk from JR Furano Station"}, {"address": "1-1-7 Omachi, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.0 stars | Located right by Biei Station, this traditional local favorite specializes in officially certified \u0027Biei Curry Udon\u0027. The dish insists on using 100% Biei-grown wheat for its udon noodles, yielding a delightfully chewy texture with a rich wheat aroma, paired with a thick curry sauce stewed with local Biei vegetables and pork. The dip-style serving coats every strand of noodle in aromatic curry for a smooth, savory bite with a sweet finish. Served with a glass of fresh Biei milk and a side salad, it offers a prime experience of Biei\u0027s rich agricultural and culinary culture.", "name": "Biei Curry Udon KOERU", "transport": "Approx. 2 minutes walk from JR Biei Station"}, {"address": "Higashi 6-sen Kita 16-go, Kamifurano, Sorachi District, Hokkaido", "feature": "\u2b50 4.4 stars | Tucked away in the countryside woods of Kamifurano, this long-standing smoked meat specialty shop has used fresh Hokkaido pork and natural spices since its inception, slow-smoking meats using traditional techniques. The signature \u0027Assorted Sausage Platter\u0027 offers a variety of handcrafted sausages, bacon, and ham. Grilled crispy on the outside with juicy interiors, the meats burst with enticing wood-smoked aromas. Served with homemade French bread and fresh local vegetable soup, this rich, additive-free meal attracts discerning foodies looking for genuine northern artisanal deli tastes.", "name": "Hito (Handmade Sausage \u0026 Smoked Delis)", "transport": "Driving recommended (approx. 10 minutes drive from JR Kamifurano Station)"}, {"address": "Omura Okubo, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.3 stars | A warm log cabin Western restaurant nestled in the forest of Biei\u0027s rolling hills, widely renowned for its comforting, home-style slow-cooked dishes. The top signature favorite, \u0027Stewed Beef Tongue\u0027, is simmered until unbelievably tender\u2014soft enough to melt on your tongue. The rich red wine demi-glace sauce absorbs the essence of beef and fresh Biei seasonal vegetables, achieving a velvety balance of sweet and savory notes. Dipping toasted bread\u2014crispy outside, soft inside\u2014into the stew provides a deeply cozy and satisfying meal, elevated by the serene green woodland surroundings.", "name": "Restaurant Blanc Rouge", "transport": "Driving recommended (approx. 10 minutes drive from JR Biei Station)"}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "2156-1 Shimogoryo, Furano City, Hokkaido", "feature": "\u2b50 4.5 Stars | A wildly popular dessert cafe perched on a hill in Furano, famous for pioneering the original \u0027Furano Milk Pudding\u0027 and double-layer cheesecake. Served in charming small glass milk bottles, the pudding boasts an exceptionally silky, melt-in-your-mouth texture brimming with rich local milk flavor. The dine-in area offers freshly roasted coffee and exquisite brunch treats. Travelers can relax on the lush open-air terrace, savoring pure northern dairy treats while taking in sweeping views of the Furano Basin.", "name": "Furano Delice (House of Furano Delice / \u83d3\u5b50\u5de5\u623f \u30d5\u30e9\u30ce\u30c7\u30ea\u30b9)", "transport": "About a 10-minute taxi ride from JR Furano Station"}, {"address": "Nakagoryo, Furano City, Hokkaido (Within the grounds of New Furano Prince Hotel)", "feature": "\u2b50 4.6 Stars | A classic cafe tucked away in a mystical forest next to the New Furano Prince Hotel, famous as a shooting location for a popular Japanese TV drama. The highlights here are the hand-crank coffee grinders given to guests to grind their own beans, offering a calming experience of watching time slow down. Their signature \u0027First Snow\u0027 (Hatsuyuki) Black Forest cake pairs perfectly with hand-poured coffee for a rich, sweet-and-bitter flavor profile. Surrounded by massive trees and seasonal foliage, this cozy wooden cottage bathed in poetic window light is a favorite tranquil brunch and tea spot for travelers.", "name": "Morino Tokei Cafe (\u55ab\u8336 \u68ee\u306e\u6642\u8a08)", "transport": "Take the \u0027Lavender Bus\u0027 from JR Furano Station, get off at New Furano Prince Hotel, and walk for about 5 minutes"}, {"address": "3-4-21 Bibaushi Kita, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 Stars | A hidden artisanal bakery and cafe nestled at the edge of the forest near Bibaushi Station in Biei. The bakery strictly uses locally contracted Biei wheat and house-made natural yeast, stone-oven baked after long fermentation. Their signature brunch platter features sourdough bread with a crispy crust and soft interior, served with rich melted cheese and paired with high-quality single-origin hand-pour coffee brewed from home-roasted beans. Every bite releases the pure sweetness and subtle acidity of local wheat. The quiet, elegant wooden space attracts countless foodies seeking an exquisite brunch.", "name": "Bakery \u0026 Coffee Gosh (\u30d1\u30f3\u5de5\u623f Gosh)", "transport": "About a 5-minute walk from the exit of JR Bibaushi Station"}, {"address": "Shinsei Dai-3, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.7 Stars | Perched on a scenic hill in Biei, this minimalist aesthetic bakery cafe was converted from an abandoned elementary school. It features freshly baked French bread made with locally milled Biei wheat alongside refined European-style brunch dishes. The signature ham, cheese, and fresh vegetable brunch set features local non-toxic produce and house-made bacon. The bread is intensely aromatic\u2014crispy on the outside with a light, chewy interior. Large floor-to-ceiling windows offer rolling views of Biei\u0027s wheat field hills, delivering both visual and culinary delight.", "name": "bi.ble Bakery \u0026 Cafe (\u5317\u306e\u4e18\u5de5\u623f bi.ble)", "transport": "About a 10-minute taxi ride from JR Biei Station"}, {"address": "Murayama, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 Stars | Tucked deep inside a dense Biei forest, this fairytale-like log cabin cafe is beloved locally for its handcrafted cheese flatbreads and homemade Swiss fondue brunch. The popular signature \u0027Raclette Cheese Platter\u0027 pours hot, melted, aromatic cheese over roasted local Biei potatoes and house-made sausages. The cheese has a golden, lightly charred crust with a smooth, gooey interior, pairing wonderfully with their dark-roast coffee. Surrounded by lush forest, with cool summer breezes and vibrant autumn foliage, the atmosphere is romantic to the core.", "name": "Cafe de La Paix (\u30ab\u30d5\u30a7\u30fb\u30c9\u30fb\u30e9\u30fb\u30da)", "transport": "About a 15-minute drive or taxi ride from JR Biei Station"}, {"address": "Nakagoryo, Furano City, Hokkaido (Inside Ningle Terrace)", "feature": "\u2b50 4.4 Stars | A cozy wooden cottage cafe located at the entrance of Ningle Terrace in Furano, creating a sensation among tourists with its original signature drink, \u0027Yaki-Milk\u0027 (Baked Milk). This unique beverage features a high-temperature torched top layer of golden, fragrant caramelized cheese, sealing in cold, rich pure Furano milk beneath. Breaking through the crispy surface reveals an explosion of warm caramel aroma and cool milky goodness\u2014distinctly layered and not overly sweet. Paired with house-made ice cream waffles, it is a must-try light brunch snack when visiting Furano.", "name": "Chuchu House Baked Milk Cottage (Chuchu no Ie / \u30c1\u30e5\u30c1\u30e5\u306e\u5bb6)", "transport": "Take a bus from JR Furano Station to New Furano Prince Hotel, then walk about 3 minutes"}, {"address": "Misawa Misho, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.5 Stars | A forest log cabin cafe-restaurant near Biei\u0027s Shirogane Blue Pond, specializing in house-smoked artisanal sausage, bacon, and ham brunch platters. Using premium Hokkaido pork, the meat is slowly smoked at low temperatures over natural cherrywood. The sausages burst with juicy meat flavors and a delightful smoky aroma upon biting. Accompanied by specialty coffee brewed with local Biei hot spring water and freshly baked rye bread, it offers a high-quality, energy-boosting brunch feast for travelers visiting Shirogane Blue Pond and Mount Tokachi.", "name": "Cafe Restaurant Hobbit (\u30ab\u30d5\u30a7\u30ec\u30b9\u30c8\u30e9\u30f3 \u6b65\u4eba)", "transport": "Take a bus bound for Shirogane Onsen from JR Biei Station, get off at \u0027Misho\u0027 stop, and walk about 3 minutes"}, {"address": "1 Higashitorinuma, Furano City, Hokkaido", "feature": "\u2b50 4.5 Stars | An insanely popular open-air American-style brunch cafe situated beside vast rural flower fields in Furano. The main highlight is their extra-thick burger patty made from 100% local Furano Wagyu beef and pork blend, cooked to order and paired with thick-cut house-smoked bacon and fresh Biei vegetables. Juices burst in your mouth at first bite, while the burger bun is crispy on the outside and soft inside, absorbing all the savory flavors. Guests can enjoy freshly grilled burgers and rich cold brew coffee in the open-air seating area while taking in Hokkaido\u0027s endless countryside vistas.", "name": "Furano Burger Cafe (\u30d5\u30e9\u30ce\u30d0\u30fc\u30ac\u30fc)", "transport": "About a 10-minute drive or taxi ride from JR Furano Station"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "3-22 Hinodecho, Furano, Hokkaido", "feature": "\u2b50 4.3 stars | Furano\u0027s most unforgettable premier local cuisine restaurant. The signature Wagyu Beef Sashimi Rice Bowl features paper-thin slices of richly marbled Hokkaido Wagyu beef draped over steaming hot rice; it melts in your mouth, blending sweet beef flavors with warm rice for a silky, melt-in-your-mouth texture. Their house-made cheese tofu has a velvety, mousse-like consistency with a rich milky aroma. Built with wood and stone to resemble a rustic stone house, the interior evokes the cozy, wilderness warmth of a hunter\u0027s cabin\u2014a must-visit specialty gastropub when in Furano.", "name": "Kumagera (\u304f\u307e\u3052\u3089)", "transport": "Approx. 3 minutes walk from JR Furano Station"}, {"address": "11-8 Hinodecho, Furano, Hokkaido", "feature": "\u2b50 4.4 stars | A charming bistro specializing in rich, aromatic spice curry and homemade German sausages. Tucked away in a grove of trees, this wooden cottage bistro exudes a unique, storybook-handcrafted feel. The signature homemade sausage curry uses local Furano vegetables and over a dozen spices simmered for hours, producing a deep, spicy sauce with a delightful kick. The crisp, homemade sausage bursts with savory juices in every bite, offering a firm texture packed with smoky flavor. The lively atmosphere is enhanced by a fun secret code: say \u0027Ru-ru-ru\u0027 when ordering to get a free curry sauce refill, making it a hit among tourists and locals alike.", "name": "Yuiga Doxon (\u552f\u6211\u7368\u5c0a)", "transport": "Approx. 5 minutes walk from JR Furano Station"}, {"address": "1-19 Asahicho, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | A traditional local izakaya in Furano brimming with warm hospitality. Famous for home-style regional dishes made with carefully selected Hokkaido ingredients, a must-try is the Jingisukan (Genghis Khan grilled mutton)\u2014tender, odor-free meat sizzling on a hot iron plate with a signature savory-sweet sauce, beautifully charred outside yet juicy inside. Seafood hotpots and fresh grilled Hanasaki crab directly from the coast are equally mouthwatering. With its friendly, laid-back atmosphere and nostalgic Showa-era charm, it\u0027s the perfect spot to unwind like a local with a glass of regional sake.", "name": "Izakaya Sennari (\u5c45\u9152\u5c4b \u5343\u6210)", "transport": "Approx. 4 minutes walk from JR Furano Station"}, {"address": "4-22 Asahicho, Furano, Hokkaido", "feature": "\u2b50 4.1 stars | A local gastropub highlighting locally branded Furano pork and Bincho charcoal grilling. The Furano pork skewers and kamameshi (rice cooked in an iron pot) are top choices for seasoned foodies. Grilled over high-heat Bincho charcoal to lock in juices, the skewers are crispy on the outside, succulent and chewy inside, perfect with salt or house sauce. The seasonal Furano vegetable kamameshi features rice soaked in rich dashi broth, bursting with the sweet flavor of local vegetables in every bite. The welcoming izakaya vibe and high-quality grilled fare keep this place packed night after night.", "name": "Aburiya Yamadori (\u7099\u5c4b \u3084\u307e\u3069\u308a)", "transport": "Approx. 3 minutes walk from JR Furano Station"}, {"address": "Inside Biei Senka, 2-Chome Omachi, Biei, Kamikawa District, Hokkaido", "feature": "\u2b50 4.5 stars | A Michelin-starred French farm-to-table bistro located inside Biei Senka. The head chef masterfully highlights freshly harvested premium vegetables from Biei, showcasing their vibrant sweetness and elegance. The signature warm platter of 20 Biei seasonal vegetables offers a pure taste of crispy, naturally sweet produce in every bite, while slow-roasted Biei pork features a golden, crispy skin with tender, flavorful meat. Bright, cozy, and filled with the essence of Hokkaido\u0027s natural beauty, it is a flagship destination for innovative local eco-gastronomy.", "name": "Restaurant Asperges (\u7f8e\u745b\u6cd5\u5f0f\u9910\u9928 ASPERGES)", "transport": "Approx. 10 minutes walk from JR Biei Station"}, {"address": "Shimogoku, Furano, Hokkaido", "feature": "\u2b50 4.4 stars | A cozy, hidden-gem French bistro meticulously sourcing local Furano ingredients. The chef selects farm-fresh vegetables and Wagyu beef from the Furano and Biei regions to craft delicate, heart-warming French countryside classics. The must-try stewed Furano Wagyu beef is meltingly tender in a deep, velvety red wine reduction\u2014irresistible when paired with freshly baked bread. Their seasonal local vegetable potage is creamy and soul-soothing. With a relaxed, welcoming atmosphere and outstanding wine pairings, it attracts discerning food lovers from afar.", "name": "Bistro Le Chemin (\u4e3b\u5eda\u5c0f\u5f91\u6cd5\u5f0f\u9910\u9152\u9928)", "transport": "Approx. 10 minutes drive from JR Furano Station"}, {"address": "9-15 Asahicho, Furano, Hokkaido", "feature": "\u2b50 4.3 stars | An iconic traditional local izakaya in Furano famous for its jumbo-sized nigiri sushi. The seafood toppings are legendary for their generous proportions\u2014slices of raw fish are two to three times larger and thicker than standard sushi, overflowing with salmon roe and sea urchin. Sourced directly from Hokkaido coastal waters, the salmon is richly fatty and soft, while scallops are sweet and snappy, served over perfectly balanced sushi rice. Brimming with nostalgic vibes, a rich selection of local sake, and seafood appetizers, it\u0027s an ultimate stop to experience Hokkaido\u0027s grand seafood culture.", "name": "Fukuzushi (\u798f\u5bff\u53f8)", "transport": "Approx. 5 minutes walk from JR Furano Station"}, {"address": "3-3 Asahicho, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | A beloved local cuisine izakaya cherished by local farmers and residents alike. The signature Furano Pork Rice Bowl (Butadon) features carefully selected local pork belly flame-seared to perfection, locking in savory aromas with a sweet-and-salty glaze infused deeply into the rice. Another highlight is the Furano Cheese Croquette\u2014boasting a satisfyingly crispy crust, velvety sweet potato filling, and ooey-gooey melted cheese. Its warm, homey ambiance and excellent value offer a heart-warming taste of Hokkaido small-town dining culture.", "name": "Furano Ajidokoro Tsukishima (\u5bcc\u826f\u91ce\u5473\u8655 \u6708\u5cf6)", "transport": "Approx. 4 minutes walk from JR Furano Station"}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "1-27 Asahidori, Furano City, Hokkaido", "feature": "\u2b50 4.4 stars | A hugely popular soup curry specialty shop in Furano, offering a special \u002715 Seasonal Organic Vegetables Soup Curry\u0027 for vegetarians and vegetable lovers. The rich, multi-layered broth is simmered with abundant sweet local Hokkaido vegetables and signature spices. Paired with pumpkin, carrots, eggplant, and lotus root fried to crisp perfection on the outside and soft on the inside, it\u2019s refreshing and non-greasy, loved by both tourists and locals alike.", "name": "Furanoya Soup Curry (Furano)", "transport": "About an 8-minute walk from JR Furano Station"}, {"address": "Misawa Kyosei, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Nestled in the rolling hills of Biei, this rustic countryside caf\u00e9 specializes in vegetarian meals and artisanal bread made from carefully selected pesticide-free local vegetables. Its signature \u0027Homemade Picnic Basket Vegetable Sandwich\u0027 features freshly harvested sweet lettuce, tomatoes, and crisp cucumbers nestled inside artisanal toast that is golden-crisp on the outside and fluffy inside. Light, sweet, and bursting with natural flavor, it is a favorite among health-conscious travelers.", "name": "Cafe \u0026 Bakery Picnic (Biei)", "transport": "About a 10-minute drive from JR Biei Station"}, {"address": "Misawa Toyosumi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A soothing caf\u00e9 nestled in Biei\u2019s beautiful woodland, serving natural organic vegetarian curry and herb dishes. The signature \u0027Special Forest Vegetable Curry\u0027 is completely meat-free, made by slow-caramelizing sweet onions and simmering them with various Hokkaido root vegetables. Rich, velvety, and naturally sweet, enjoying it alongside idyllic forest views makes for one of the most relaxing vegetarian dining experiences for travelers.", "name": "Caf\u00e9 de La Paix (Biei)", "transport": "About a 15-minute drive from JR Biei Station"}, {"address": "Shimizuyama, Furano City, Hokkaido", "feature": "\u2b50 4.2 stars | Run by local Furano farmers, this charming log cabin restaurant offers a highly unique \u0027Ultimate Farm-Fresh Vegetable Set Meal\u0027. Dishes highlight pesticide-free produce picked daily from their own farm, including delightfully aromatic vegetable tempura and sweet, juicy steamed seasonal greens. Crispy and pure in flavor, it allows diners to savor the natural sweetness nurtured by Furano\u0027s rich soil.", "name": "Farm Restaurant Azekura (Furano)", "transport": "About a 5-minute drive from JR Gakuden Station or a 10-minute drive from JR Furano Station"}, {"address": "Omura Muraso, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Combining natural farming with refined French culinary techniques, this estate restaurant\u0027s \u0027Hokkaido Fresh Vegetable Salad \u0026 Wild Yeast Bread Set\u0027 is a must-order for vegetarians. Featuring over a dozen seasonal Biei vegetables paired with cold-pressed plant oil and house-made tangy fruit vinegar dressing, the salad offers vibrant textures and a delightful crunch, perfectly showcasing the premium quality of local ingredients.", "name": "Ferme La Terre Biei", "transport": "About a 5-minute drive from JR Biei Station"}, {"address": "Higashiroku Go, Furano City, Hokkaido", "feature": "\u2b50 4.1 stars | A cozy, rustic caf\u00e9 offering hidden-gem charm, with special menu items for vegetarian travelers like the \u0027Organic Vegetable Cream Gratin \u0026 Seasonal Vegetable Doria\u0027. Made with sweet Furano potatoes, corn, and rich soy milk cheese, the dish is creamy, smooth, and brimming with the natural sweetness of vegetables\u2014a truly comforting experience during chilly seasons.", "name": "Caf\u00e9 Gorota (Furano)", "transport": "Take a bus from JR Furano Station to Rokugou Station, then walk about 5 minutes"}, {"address": "Hokuto, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.6 stars | An exquisite bakery restaurant set atop a Biei hill, highlighting local malt and seasonal produce. The highly recommended \u0027Biei Farm Harvest Platter\u0027 pairs lightly charred seasonal root vegetables with freshly baked wild yeast European breads. The vegetables are caramelized and juicy, while the bread boasts a crispy crust and chewy center, making it a favorite for those seeking refined plant-based dining.", "name": "Biei Bi-ble Bakery \u0026 Restaurant", "transport": "About an 8-minute drive from JR Biei Station"}, {"address": "7-18 Suehirocho, Furano City, Hokkaido", "feature": "\u2b50 4.0 stars | A cozy curry shop in downtown Furano offering a specially crafted \u0027100% Plant-Based Mild Rainbow Vegetable Curry\u0027. Completely free of animal fats and meat, the roux base is simmered with generous amounts of Furano carrots, tomatoes, and onions, topped with vibrant bell peppers, roasted pumpkin, and shiitake mushrooms. Sweet with a gentle touch of spice, smooth, and juicy, it is a fantastic hidden-gem vegetarian option in town.", "name": "Sun Maison Curry (Furano)", "transport": "About a 6-minute walk from JR Furano Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Higashi 1-sen Kita 18-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A signature walk-and-eat dessert you cannot miss in Furano: \u0027Santa\u0027s Beard\u0027 (Santa no Hige). Half a sweet, juicy Furano cantaloupe serves as the base, topped with a generous swirl of Hokkaido pure milk and lavender soft-serve ice cream. On the first bite, the smooth, creamy soft serve fuses perfectly with the bursting sweetness of the fresh melon fruit. Cool, refreshing, and naturally fragrant, it is a top choice for summer check-ins and satisfying your taste buds on the go.", "name": "Popura Farm Nakafurano Main Store (Popura Farm Furano)", "transport": "About a 12-minute walk from JR Gakuden Station, or a 5-minute drive from JR Nakafurano Station"}, {"address": "Kisen Kita 15-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A classic street dessert held by almost every visitor at Farm Tomita. This dreamlike light-purple lavender soft serve is carefully crafted using local fresh milk and natural lavender extract. Exceptionally delicate and creamy, every bite releases an elegant floral lavender aroma balanced with rich, pure dairy flavor. Sweet without being cloying and finishing with a crisp taste, it perfectly captures Furano\u0027s iconic floral flavor and is loved by travelers worldwide.", "name": "Farm Tomita Lavender Soft Serve Stand", "transport": "About a 7-minute walk from JR Lavender Farm Station (temporary summer station)"}, {"address": "2-chome Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.2 stars | A local produce market located near Biei Station. The top walk-and-eat highlights here are the limited-edition fresh-baked \u0027Biei Corn Bread\u0027 and \u0027Biei Raw Milk Soft Serve\u0027. Made without a single drop of water, the corn bread has a crispy crust packed with juicy, sweet corn kernels that burst with extreme sweetness in every crunchy bite. Paired with soft serve made from 100% Biei fresh milk, its thick and aromatic texture showcases the top-tier, pure quality of Biei\u0027s agricultural produce.", "name": "Biei Senka Main Store Food Stand", "transport": "About a 10-minute walk from JR Biei Station"}, {"address": "Shinsei Aoi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.5 stars | A breathtaking ranch food stand hidden among rolling green hills, offering what is hailed as the purest milk soft serve and fresh milk in Hokkaido. Made from the premium milk of pasture-raised Jersey cows without artificial additives, the soft serve has a silky, velvet-like texture. Rich dairy fragrance quickly spreads across your tongue accompanied by subtle natural sweetness. Paired with the farm\u0027s crispy handmade waffle cone, it creates an unforgettable taste experience.", "name": "Biei Jersey Cow Farm", "transport": "About a 20-minute drive or taxi ride from JR Biei Station"}, {"address": "Nakagoku, Furano-shi, Hokkaido", "feature": "\u2b50 4.1 stars | A takeout gelato stand inside the Furano Cheese Factory that uses fresh, high-quality local milk as a base to create several unique signature flavors. The most eye-catching are the \u0027Cheese\u0027 and \u0027Squid Ink\u0027 gelatos. The Cheese flavor features a rich, slightly salty yet sweet cheese fragrance with a firm, smooth texture; the Squid Ink flavor carries a surprisingly unique sweet finish. Their rare flavors and creamy texture keep foodies coming back for more.", "name": "Furano Cheese Factory Gelato Parlor", "transport": "About a 10-minute drive from JR Furano Station"}, {"address": "13-1 Saiwaicho, Furano-shi, Hokkaido", "feature": "\u2b50 4.0 stars | A civic lifestyle complex market bringing together the finest local cuisine in Furano. The takeout food kiosks offer the #1 crowd favorites: \u0027Furano Wagyu Croquette\u0027 and \u0027Melting Cheese Breadsticks\u0027. Served piping hot, the croquette is fried to a golden crispness on the outside, while the inside is filled with soft, fluffy local potatoes blended with savory minced Wagyu beef. Every bite bursts with rich savory fat and sweet potato flavor, making it the perfect street snack while exploring downtown.", "name": "Furano Marche Food Kiosk", "transport": "About a 7-minute walk from JR Furano Station"}, {"address": "2156-1 Shimogoryo, Furano-shi, Hokkaido", "feature": "\u2b50 4.3 stars | The pioneer of super popular takeout desserts inspired by bottled milk, famous for its must-try \u0027Furano Milk Pudding\u0027. Made with premium Furano fresh milk and fresh eggs, then slowly steamed at low temperatures, it boasts an incredibly smooth and creamy texture that literally melts in your mouth. The bittersweet caramel sauce at the bottom perfectly balances the rich dairy aroma, creating distinct delicious layers in every spoon\u2014a highly sought-after street dessert for travelers.", "name": "Furano Delice Sweets Workshop", "transport": "About a 10-minute drive from JR Furano Station"}, {"address": "Shinsei Dai-3, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.1 stars | A snack kiosk located right at the entrance of the Shikisai no Oka flower fields. The most popular items are the freshly fried \u0027Baron Potato Croquette\u0027 and \u0027Grilled Biei Sweet Corn\u0027. The croquettes use locally contracted Baron potatoes coated in fine breadcrumbs and fried golden brown; the filling is steaming hot, creamy, and oozes natural sweetness. Enjoying this signature market snack while admiring the vast, breathtaking rainbow flower fields is a quintessential Hokkaido experience.", "name": "Shikisai no Oka Food Kiosk", "transport": "About a 10-minute drive or e-bike ride from JR Bibaushi Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Bites"}}, "name": "Furano and Biei Flower Fields"}, "hakodate_bay": {"categories": {"cat_1": {"items": [{"address": "4-5 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A historic Yoshoku (Western-style Japanese) restaurant founded in 1879 (Meiji 12). Its signature \u0027English-style Beef Curry\u0027 is rich and smooth, with a subtle spiciness and a deep spice finish that pairs wonderfully with rice absorbing the sauce. The melt-in-your-mouth beef is stewed to tender perfection. Beloved by locals and tourists alike, it is a must-visit spot to experience Hakodate\u0027s unique fusion culinary history.", "name": "Gotoken Main Store", "transport": "About a 3-minute walk from Hakodate Tram \u0027Jujigai\u0027 Station"}, {"address": "29-22 Goryokakucho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Located next to Goryokaku Park, this iconic noodle house is the ultimate representative of Hakodate shio (salt) ramen. Its soul-soothing golden broth is meticulously simmered from kelp, chicken bones, and pork bones, delivering a clear, light, and naturally sweet taste. The springy thin straight noodles absorb the broth beautifully, served with seared chashu pork and fresh scallions for an authentic Hakodate flavor in every bite.", "name": "Hakodate Menchubo Ajisai Main Store", "transport": "About a 7-minute walk from Hakodate Tram \u0027Goryokaku-Koen-Mae\u0027 Station"}, {"address": "23-18 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | A legendary fast-food chain exclusive to Hakodate, with its Bay Area main store oozing a joyful retro vibe. The must-try \u0027Chinese Chicken Burger\u0027 features freshly fried local chicken that is extraordinarily crispy on the outside and tender and juicy inside. Smothered in a signature sweet-and-sour sauce and mayonnaise, paired with crisp lettuce and fluffy buns, its incredible flavor profile and remarkable value make it a reigning favorite in Hakodate.", "name": "Lucky Pierrot Bay Area Main Store", "transport": "About a 3-minute walk from Hakodate Tram \u0027Suehirocho\u0027 Station"}, {"address": "14-11 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Hakodate\u0027s ultimate comfort food, sold inside a convenient local convenience store chain. Known for its freshly grilled \u0027Yakitori Bento\u0027 (which actually uses specially prepared pork skewers), select Hokkaido pork belly is grilled to order and brushed with a savory-sweet house sauce. Served over hot rice and seaweed with a delightfully smoky aroma, tender meat, and rich flavor, it\u0027s an indispensable taste of local tradition.", "name": "Hasegawa Store Bay Area Store", "transport": "About a 2-minute walk from Hakodate Tram \u0027Suehirocho\u0027 Station"}, {"address": "10-11 Horaicho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | A historic sukiyaki restaurant established in 1901 (Meiji 34), housed in a building full of nostalgic Showa machiya ambiance. Featuring top-tier Black Wagyu beef with exquisite marbling simmered in a secret house sauce, dipping the freshly cooked tender beef into silky raw egg creates an explosion of melt-in-your-mouth texture and rich savory sweetness. Their lunch sets offer unbelievable value and reservations are hard to come by.", "name": "Asari Honten", "transport": "About a 1-minute walk from Hakodate Tram \u0027Horaicho\u0027 Station"}, {"address": "22-1 Otemachi, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | A highly acclaimed sea urchin specialist in the Hakodate Bay area. Famous for serving pure, natural sea urchin completely free of preservatives and alum, each bite delivers a velvety texture and an unadulterated, rich ocean sweetness without any fishiness. Whether served over rice bowls or grilled, it offers foodies the peak flavor of seasonal perfection.", "name": "Uni Murakami Hakodate Main Store", "transport": "About a 5-minute walk from JR Hakodate Station, or a 3-minute walk from Hakodate Tram \u0027Shiyakusho-Mae\u0027 Station"}, {"address": "12-9 Toyokawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.0 stars | Founded in 1945 (Showa 20), this pioneer of seafood rice bowls sits beside the romantic Red Brick Warehouses in the Bay Area. The signature \u0027Original Tomoe Don\u0027 combines sweet scallops, rich salmon roe, and creamy sea urchin over fluffy rice cooked in traditional charcoal-fired pots. Every bite offers ultimate freshness and generous ocean delicacies, making it an incredible spot to taste Hakodate\u0027s port heritage.", "name": "Kikuyo Shokudo Bay Area Branch", "transport": "About a 5-minute walk from Hakodate Tram \u0027Jujigai\u0027 Station"}, {"address": "30-3 Motomachicho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A historic meat processing shop built on the heritage of German master butcher Carl Raymon, located near Motomachi\u0027s charming slopes. Sticking strictly to traditional German methods, their sausages feature a juicy, snappy bite brimming with savory meatiness and enticing smoky aromas. Served fresh in hot dogs topped with sauerkraut and mustard, the delicious layered flavors draw countless food lovers on pilgrimages here.", "name": "Hakodate Carl Raymon Motomachi Main Store", "transport": "About a 6-minute walk from Hakodate Tram \u0027Jujigai\u0027 Station"}], "name": "Famous Local Traditional Establishments"}, "cat_2": {"items": [{"address": "27-6 Goryokaku-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Situated right next to Goryokaku Park, this cafe boasts magnificent floor-to-ceiling glass windows offering abundant natural light and lush green views. Its coffee and pancake brunch are hugely popular among visitors. The standout order is the made-to-order strawberry mille-feuille paired with rich black coffee\u2014crispy pastry layers sandwiching smooth, perfectly balanced custard. Dine-in guests can also enjoy complimentary coffee service, making it an ideal spot to unwind for a relaxing morning or afternoon tea after exploring the park.", "name": "Rokkatei Goryokaku Store", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 Station, then walk about 10 minutes."}, {"address": "32-1 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1932, Misuzu is Hokkaido\u0027s oldest historic coffee roastery. The shop fills the air with the rich aroma of freshly roasted coffee, exuding a cozy, nostalgic Japanese kissaten (retro cafe) atmosphere. The signature brunch set features thick-cut buttered toast\u2014crispy on the outside and soft inside\u2014paired with pour-over single-origin coffee. Upon taking a bite, the wheat aroma and rich, slightly salted butter burst in your mouth. Additionally, their coffee soft-serve ice cream offers a wonderfully smooth, sweet-yet-bitter balance, making it a classic must-try for locals and coffee lovers alike.", "name": "Misuzu Coffee Main Store", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 Station, then walk about 3 minutes."}, {"address": "13-5 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Housed in a renovated red-brick warehouse with soaring ceilings, this cafe preserves rustic wooden beams and exposed brick walls, creating a chic yet cozy hipster vibe. They serve exquisite soup curry brunch sets alongside handcrafted pour-over coffee. The curry broth is rich, paired with sweet, crispy fresh vegetables and fluffy rice that will keep you reaching for another bite. For dessert, try their ice cream parfait layered with fresh fruit and rich whipped cream\u2014delightfully textured and refreshing, making it a favorite among young travelers.", "name": "Caf\u00e9 TUTU", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, then walk about 5 minutes."}, {"address": "1-1 Omachi, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Affectionately known as \u0027Romeroma,\u0027 this charming spot is set inside a mint-green Western-style house near the Bay Area, featuring internal decor filled with cute 50s American vintage aesthetics. The brunch sets are delicately crafted, with the signature quiche boasting a flaky crust and a rich, savory egg filling packed with ingredients. Their homemade cakes paired with beautiful latte art complement each other perfectly, offering a comforting flavor profile\u2014making it a popular secret hideaway to unwind while exploring the Bay Area.", "name": "Romantico Romantica", "transport": "Take the Hakodate City Tram to \u0027Omachi\u0027 Station, then walk about 1 minute."}, {"address": "23-15 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Converted from a Taisho-era marble warehouse, this cafe exudes classic West Coast retro vibes and is an iconic old-school American diner in the Hakodate Bay Area. The absolute must-order brunch dish is \u0027Cisco Rice\u0027\u2014fragrant butter-fried rice topped with two juicy grilled hot dogs and smothered in rich, savory meat sauce. Rich, satisfying, and flavor-packed, pairing it with an iced Americano makes for a deeply satisfying meal you won\u0027t forget.", "name": "California Baby", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, then walk about 7 minutes."}, {"address": "Inside Kanemori Yobukan, 13-9 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Located inside the Kanemori Red Brick Warehouses, this popular dessert cafe took Japan by storm with its famous \u0027Catchcakes\u0027 (souffl\u00e9 cheesecakes). Offering both standing tasting counters and seated brunch areas, guests can order set menus featuring freshly made cheesecakes alongside hot coffee. The soft-baked cheesecake melts in your mouth with a delicate, souffl\u00e9-like texture, bursting with rich milk flavor on the palate. Perfectly balanced in sweetness and not overly heavy, it pairs wonderfully with a dark roast pour-over coffee to highlight its rich profile.", "name": "Pastry Snaffle\u0027s Kanemori Store", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, then walk about 5 minutes."}, {"address": "11-5 Toyokawa-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Nestled in the Kanemori Red Brick Warehouse district, this store features comfortable indoor and outdoor seating areas perfect for enjoying the harbor breeze over brunch. The signature \u0027Mel Cheese Cake\u0027 has a snowy, melt-in-your-mouth texture brimming with the pure, rich flavors of fresh Hokkaido milk and cheese. Furthermore, their special pumpkin soft-serve ice cream pairs seamlessly with a fresh milk latte\u2014smooth, creamy, and highly recommended by travelers worldwide.", "name": "Petite Merveille Red Brick Warehouse Store", "transport": "Take the Hakodate City Tram to \u0027Uoichibadori\u0027 Station, then walk about 5 minutes."}, {"address": "4-1 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A classic Japanese kissaten near the Goryokaku shopping district, featuring warm wooden tones, cozy lighting, and mellow jazz that create a wonderfully retro ambiance. Their siphon coffee offers exceptional depth with a well-rounded aroma and lingering finish. The morning brunch sandwiches and buttered toast are top-notch\u2014soft, fluffy bread filled with thick, tender tamagoyaki (Japanese omelet) that delivers a delicious blend of rich egg and savory butter in every bite. A beloved hidden gem among locals for breakfast.", "name": "Coffee Senka Barun", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 Station, then walk about 2 minutes."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "43-9 Goryokaku-cho, Hakodate, Hokkaido (1st floor of Goryokaku Tower)", "feature": "\u2b50 4.3 stars | A renowned seasonal Japanese ryotei restaurant adjacent to Goryokaku Tower, serving local dishes. Utilizing live squid delivered directly from Hakodate\u0027s nearby waters, Funka Bay scallops, and Hokkaido Wagyu beef, the restaurant brings out the full potential of local seasonal ingredients. The must-order live squid sashimi features crystal-clear, translucent flesh with an extraordinarily springy and crunchy texture, bursting with sweetness upon the first bite. Pair it with famed local sake like \u0027Kunimare\u0027 or \u0027Otokoyama\u0027 for the ultimate Northern food and beverage pairing, highly favored by local business professionals and top foodies.", "name": "Goryokaku Shunka", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, then walk for about 10 minutes."}, {"address": "22-13 Otemachi, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A seafood-themed izakaya near the Bay Area featuring a massive live tank akin to a mini aquarium. Highlighting freshly caught and prepared King crab, horsehair crab, and squid. The charcoal-grilled King crab legs are plump and juicy, brimming with rich smoky charcoal aromas and natural ocean sweetness with a springy texture. Paired with local Hokkaido craft beer or sake in a vibrant, bustling atmosphere, this is a local specialty pub you shouldn\u0027t miss when visiting the Bay Area.", "name": "Seafood Izakaya Kaikobo", "transport": "Take the Hakodate City Tram to \u0027Shiyakusho-Mae\u0027 station, then walk about 3 minutes; or walk about 8 minutes from Kanemori Red Brick Warehouses in the Bay Area."}, {"address": "12-8 Toyokawacho, Hakodate, Hokkaido (Inside BAY Hakodate)", "feature": "\u2b50 4.1 stars | A popular Genghis Khan (Jingisukan) BBQ izakaya located within the Kanemori Red Brick Warehouse area. Featuring odorless, specially selected lamb and imported Australian lamb, grilled on custom iron skillets until golden brown. Each bite bursts with savory fat and tender, succulent meat. Paired with the house-special sweet sauce and an ice-cold Sapporo Classic draft beer, it\u0027s addictively good and one of the Bay Area\u0027s top evening gathering spots.", "name": "Hakodate Meimeitei", "transport": "Take the Hakodate City Tram to \u0027Uoiba-dori\u0027 station, then walk about 5 minutes."}, {"address": "32-15 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.0 stars | A popular local izakaya located in the bustling Goryokaku area, famous for its unbeatable value and ultra-fresh seafood. The must-try signature dish is the \u0027Seafood Treasure Box Sashimi Platter\u0027, which includes thick-cut salmon, fatty tuna belly, and fresh sea urchin\u2014melt-in-your-mouth tender and blissfully sweet. Additionally, golden crispy fried octopus legs and buttered baked potatoes with squid shiokara offer an authentic Hokkaido style of eating that is intensely savory and perfect with drinks, making it a favorite among local office workers.", "name": "Sakana Isshin Goryokaku", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, then walk about 3 minutes."}, {"address": "31-8 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | A highly-rated hidden gem of an izakaya tucked away in the alleys of Goryokaku. The master chef has deep expertise in local Hokkaido produce and Japanese sake. The signature charcoal-grilled Okhotsk Atka mackerel (Hokke) features a crispy, aromatic skin wrapping succulent, juicy fish meat that is rich in flavor without feeling greasy. Offering rare local Hakodate sake and small-farm vegetable dishes seasonally, its cozy and quiet Japanese ambiance invites guests to relax and savor the authentic flavors of Southern Hokkaido.", "name": "Izakaya Kizashi Goryokaku", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, then walk about 4 minutes."}, {"address": "8-14 Wakamatsucho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | A spacious, stylish, and cozy seafood gastropub near the Bay Area. The most iconic local dishes here are \u0027Butter-Steamed Hokkaido Giant Scallops\u0027 and \u0027Fresh Squid Nigiri Sushi\u0027. The scallops are thick and firm, soaked in rich butter and dashi broth, bursting with sweet umami flavor in every bite. Many tourists visit specifically to enjoy their seafood dishes paired with local sake, making it a great choice for exploring the Bay Area\u0027s nightlife cuisine.", "name": "Hakodate Dining Gaya", "transport": "Take the Hakodate City Tram to \u0027Hakodate-Eki-Mae\u0027 station, then walk about 2 minutes; or walk about 10 minutes to the Bay Area."}, {"address": "10-11 Horaicho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | A century-old sukiyaki specialty restaurant founded in 1901 (Meiji 34), housed in a historic Japanese building near the Bay Area in Horaicho. Using carefully selected Hokkaido Kuroge Wagyu beef paired with a secret century-old sauce and local Hokkaido scallions. Lightly poached in the pot and dipped in smooth fresh raw egg liquid, the beef melts instantly with unbelievable tenderness, harmonizing rich savory fat with sweet broth\u2014a truly iconic and historic dining experience.", "name": "Asari Honten", "transport": "Take the Hakodate City Tram to \u0027Horaicho\u0027 station, then walk about 1 minute."}, {"address": "22-11 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | A yakitori izakaya beloved by Goryokaku locals. In Hakodate, skewers uniquely include Hokkaido pork belly skewers (butakushi) grilled over high-temperature Binchotan charcoal until crisp outside, juicy inside, and infused with smoky aroma. Simple salt or house sauce elevates them into exquisite treats. Paired with a crisp Highball made from select local Hokkaido whisky, it offers a refreshing finish and stands as a top choice for experiencing Hakodate\u0027s late-night food culture.", "name": "Yakitori Kushio Goryokaku", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, then walk about 3 minutes."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "35-7 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50
