 4.3 stars | Located next to Kanemori Red Brick Warehouse, this cozy, rustic vintage caf\u00e9 offers a \u0027Special Vegetable Spiced Curry\u0027 crafted specifically for vegetarians. Slow-cooked with an abundance of fresh local organic vegetables from Hokkaido, it boasts a rich, creamy texture layered with aromatic spices\u2014completely meat-free. Paired with a smooth plant-milk latte and natural handmade desserts, it\u0027s the perfect spot for tourists to relax after strolling around the Bay Area.", "name": "Cafe TUTU", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station, approximately a 5-minute walk."}, {"address": "23-18 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | An iconic Hakodate culinary landmark, offering a \u0027Margherita Cheese \u0026 Egg Burger\u0027 and \u0027Vegetarian Curry Rice\u0027 tailored for lacto-ovo vegetarians. The burger patty is delightfully chewy, blending rich house-made cheese with fresh tomato slices for a sweet, tangy, juicy, and immensely satisfying bite. Featuring whimsical, vintage circus-themed decor, it is loved by locals and travelers worldwide\u2014a must-visit spot for vegetarians to experience local fast-food culture.", "name": "Lucky Pierrot Bay Area Main Store", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station, approximately a 3-minute walk."}, {"address": "22-2 Otemachi, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | A hipster deli caf\u00e9 near the Bay Area highlighting a \u0027Seasonal Vegetable Deli Platter\u0027 made with farm-fresh Hokkaido produce. Crisp, refreshing purple cabbage salad and grilled bell peppers offer a juicy crunch, perfectly paired with fragrant brown rice and pure plant-based baked scones for delightfully rich texture layers. With its minimalist aesthetic dining space and guilt-free plant-based concept, it\u0027s a go-to favorite for local women and vegetarian food lovers.", "name": "caf\u00e9 \u0026 d\u0027eli MARUSEN", "transport": "Take the Hakodate City Tram to \u0027Shiyakusho-mae\u0027 station, approximately a 3-minute walk."}, {"address": "14-5 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Housed in a renovated Taisho-era traditional home located at the foot of the Motomachi Bay area, serving fully vegan-friendly traditional Japanese sweets such as \u0027Shiratama Azuki Zenzai\u0027 (red bean soup with rice dumplings) and \u0027Matcha Kuzukiri\u0027 (arrowroot noodles). Freshly cooked red beans are velvety without being overly sweet, while the hand-rolled shiratama dumplings are delightfully chewy, bursting with subtle rice and matcha aromas. The warm Irori (hearth) atmosphere allows visitors to deeply feel Hakodate\u0027s rustic, nostalgic charm.", "name": "Sab\u014d Kikuizumi", "transport": "Take the Hakodate City Tram to \u0027Suehirocho\u0027 station, approximately a 6-minute walk."}, {"address": "25-13 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Located in the Goryokaku shopping district, offering a rich selection of vegan and plant-based dishes such as \u0027Chana Masala\u0027 (chickpea curry) and \u0027Palak Paneer\u0027 (spinach cheese curry). The curry is rich and velvety, infused with authentic spice aromas of cumin and coriander seeds. Served with freshly baked egg-free Roti that is wonderfully chewy with a subtle natural wheat sweetness, it is a popular pick for travelers seeking authentic vegan and meatless hot meals.", "name": "Tandoori House Goryokaku Branch", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, approximately a 3-minute walk."}, {"address": "22-9 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.6 stars | Tucked away on the hillside of the Bay Area, this stylish specialty caf\u00e9 serves pour-over single-origin coffee and 100% vegan, dairy-free, egg-free baked treats. The signature \u0027Oatmeal Scone\u0027 is crisp on the outside and soft inside, featuring natural brown sugar and crunchy nuts that achieve a sublime balance with lightly roasted pour-over coffee. The minimalist, quiet space offers distant views of Hakodate harbor, highly favored by coffee connoisseurs and plant-based food enthusiasts.", "name": "Cafe D\u0027ici", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 station, approximately an 8-minute walk."}, {"address": "31-8 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | A century-old traditional soba restaurant near Goryokaku Park, offering a dedicated vegetarian \u0027Ju-wari Vegetable Tempura Soba\u0027 crafted with pure vegetable broth. Hand-kneaded 100% buckwheat noodles offer a satisfying chew and rich nutty aroma, while piping-hot seasonal vegetable tempura is light and crispy on the outside, juicy and sweet on the inside. Featuring traditional Japanese tatami seating and authentic culinary craftsmanship, it draws visitors from home and abroad.", "name": "Yachiyoan Soba", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 station, approximately a 4-minute walk."}, {"address": "20-10 Suginamicho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | A fully plant-based health eatery near the Goryokaku area, specializing in the \u0027Organic Brown Rice Vegetable Curry Set\u0027. Made with root vegetables grown on local organic farms in Hokkaido, the slow-simmered sauce is naturally sweet and smooth. Served with fragrant, chewy ten-grain brown rice, every bite is filled with pure natural sweetness and rich dietary fiber\u2014a top choice for those seeking a light, healthy lifestyle.", "name": "Green Leaves Organic Cafe", "transport": "Take the Hakodate City Tram to \u0027Suginamicho\u0027 station, approximately a 2-minute walk."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "23-18 Suehiro-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.2 stars | A legendary street food experience you absolutely cannot miss when visiting the Hakodate Bay Area! The signature \u0027Chinese Chicken Burger\u0027 features freshly fried chicken pieces marinated in a special sweet and spicy sauce\u2014crispy on the outside, bursting with juicy flavor inside, paired with crisp ice lettuce and rich special mayo sauce for an exceptionally layered taste. The store boasts a whimsical, magical circus-themed decor. Grabbing one to eat while strolling around the bay or sitting by the harbor makes it even more enjoyable. It\u0027s a true soul food of Hakodate strongly recommended even by locals.", "name": "Lucky Pierrot Bay Area Main Store", "transport": "Approx. 3-minute walk from Hakodate City Tram \u0027Jujigai\u0027 Station"}, {"address": "Inside Kanemori Yobukan, 13-9 Suehiro-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.4 stars | The hottest grab-and-go cheesecake in the Kanemori Red Brick Warehouses area! The signature \u0027Catchcake\u0027 (cheese omelet/cheesecake) features an extraordinarily velvety, melt-in-your-mouth texture bursting with rich milk and cream cheese aroma without being overly sweet. The shop offers a standing tasting area (\u0027Catch Bar\u0027) where for just 200 yen you can enjoy a fresh mini cheesecake paired with a small cup of black coffee\u2014light, guilt-free, and the perfect treat while exploring the warehouse district.", "name": "Pastry Snaffle\u0027s Kanemori Store", "transport": "Approx. 5-minute walk from Hakodate City Tram \u0027Jujigai\u0027 Station"}, {"address": "11-5 Toyokawa-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.3 stars | A famous bite-sized cheesecake spot in Hakodate that rivals Snaffle\u0027s. Its flagship \u0027Mel Cheese\u0027 bite-sized cheesecake has an airy, souffl\u00e9-like texture that is moist and silky, gently releasing a rich dairy aroma on your palate. Additionally, the store\u0027s \u0027Onuma Yamakawa Ranch Extra Rich Milk Soft Serve\u0027 and \u0027Pumpkin Soft Serve\u0027 are absolute must-tries while strolling through the streets\u2014moderately sweet with a deep milky richness, loved by both kids and adults.", "name": "Petite Merveille Kanemori Red Brick Warehouse Store", "transport": "Approx. 5-minute walk from Hakodate City Tram \u0027Jujigai\u0027 Station"}, {"address": "23-5 Suehiro-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.1 stars | An iconic street food favorite unique to Hakodate convenience stores! Although named \u0027Yakitori Bento\u0027 (grilled chicken bento), it actually uses premium Hokkaido pork belly. Staff grill the meat fresh to order over dedicated grills, brushing on a secret savory-sweet sauce that delivers a rich smoky charcoal flavor and juicy, tender pork over fragrant seaweed-covered rice. Holding a hot bento box overflowing with savory aromas makes for an incredible value meal to take with you while exploring the bay area.", "name": "Hasegawa Store Bay Area Branch", "transport": "Approx. 3-minute walk from Hakodate City Tram \u0027Jujigai\u0027 Station"}, {"address": "3-25 Yayoi-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.5 stars | An insanely popular crepe shop tucked away in the alleyways near the Bay Area! Famous for its \u0027Fresh Whipped Cream Crepe\u0027 with an ultimate best-taste window of just 3 minutes. The crepes are made fresh to order with a pleasantly soft and chewy texture, wrapped around homemade rich (yet not overly sweet) pure whipped cream and fresh strawberries or chocolate. Every bite fills your mouth with light milky goodness and fruity sweetness. Their \u0027Strawberry Truffle Chocolates\u0027 are also a fantastic snack for strolling.", "name": "Angelique Voyage", "transport": "Approx. 3-minute walk from Hakodate City Tram \u0027Omachi\u0027 Station"}, {"address": "1F Goryokaku Tower, 43-9 Goryokaku-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.0 stars | An Italian gelato specialty shop located on the 1st floor of Goryokaku Tower, proud to use fresh milk from the Hakodate suburbs alongside high-quality local Hokkaido fruits. The gelato texture is ultra-silky and dense. The popular \u0027Hakodate Milk\u0027 flavor offers an intensely rich dairy taste, while \u0027Hokkaido Melon\u0027 and \u0027Sweet Corn\u0027 showcase the clean, natural sweetness of real ingredients. Grabbing a two-flavor cone to enjoy while strolling around Goryokaku Park after your visit is delightfully refreshing.", "name": "MILKISSIMO Goryokaku Tower Store", "transport": "Approx. 10-minute walk from Hakodate City Tram \u0027Goryokaku-koen-mae\u0027 Station"}, {"address": "9-15 Horai-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.3 stars | A historic wagashi (traditional Japanese confectionery) shop founded in 1860, located in Horai-cho near the Bay Area. The most popular street snack is the daily fresh-baked \u0027Ganso Dorayaki\u0027 (original red bean pancake). Taking a big bite reveals a fluffy, soft pancake rich with egg flavor, wrapped around plump red beans from Tokachi cooked to perfection\u2014moderately sweet and smooth on the throat. Nibbling on traditional sweets while exploring the historic streets offers a deep taste of classic Hakodate charm.", "name": "Senshoan Main Store", "transport": "Approx. 1-minute walk from Hakodate City Tram \u0027Horaicho\u0027 Station"}, {"address": "Inside Goryokaku Tower, 43-9 Goryokaku-cho, Hakodate City, Hokkaido", "feature": "\u2b50 4.2 stars | A specialty soft serve stand located at the Goryokaku Tower observation deck and 1st-floor shop. The most buzzed-about flavors here are the limited-edition \u0027Shinsengumi Shiso (Perilla) Soft Serve\u0027 and \u0027Hokkaido Extra Rich Milk Soft Serve\u0027. The Shiso flavor comes in a soft lavender-pink color, offering a pleasantly tart-sweet taste with a fresh herbal aroma that is super refreshing; the fresh milk flavor is rich, thick, and creamy. Holding a soft serve while overlooking the star-shaped fortress from the observation deck is an indispensable, delightful experience for tourists.", "name": "Goryokaku Tower Soft Serve Stand", "transport": "Approx. 10-minute walk from Hakodate City Tram \u0027Goryokaku-koen-mae\u0027 Station"}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Hakodate Bay Area and Goryokaku"}, "niseko_resort": {"categories": {"cat_1": {"items": [{"address": "431-2 Niseko, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.6 stars | Hidden away in the forest, this legendary handmade soba shop is one of Niseko\u0027s most iconic heritage establishments. The master chef freshly crafts soba noodles daily, resulting in a springy, smooth texture with a rich, nutty grain aroma. Paired with golden, freshly fried tempura that is crispy on the outside and tender inside\u2014perfectly locking in the sweet succulent flavor of the shrimp. Slurping the noodles dipped in special cold tsuyu sauce offers a refreshingly delicate taste that amazes the palate. It is an ultimate traditional delicacy that skiers and locals make an annual pilgrimage to enjoy.", "name": "Sobadokoro Rakuichi", "transport": "About a 10-minute taxi ride from JR Niseko Station, or take the Niseko United Bus to the Annupuri area."}, {"address": "191-31 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | A long-standing, famous ramen spot in the heart of Hirafu. The most popular offerings are the hearty, extravagant Gousetsu (Heavy Snow) Ramen and the Miso Butter Ramen. The broth is slow-simmered for hours using Hokkaido pork bones and kelp, creating a rich, smooth flavor without being greasy. The firm, chewy noodles soak up every bit of the savory broth. Topped with thick-cut char siu pork that is flame-seared until melt-in-your-mouth tender with a smoky aroma, enjoying a bowl here on a freezing snowy night warms both body and soul, making it a favorite among global travelers.", "name": "Niseko Ramen Tozanken", "transport": "Take a bus from JR Kutchan Station to Hirafu Intersection bus stop, then walk about 3 minutes."}, {"address": "Suiboku 1F, 191-29 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | One of Niseko\u0027s largest and most established traditional izakayas, serving an extraordinarily wide variety of authentic Hokkaido regional specialties. Their signature Jingisukan (grilled lamb) and Hokkaido Seafood Chanko Nabe (sumo stew) are wildly popular. The lavish seafood hot pot features a rich, sweet broth brimming with tender fish and vegetables, delivering delightful layers of texture. With its cozy, wood-accented Japanese decor, it is the top choice for gatherings to savor authentic local flavors.", "name": "Abucha 2nd", "transport": "Take a free shuttle or local bus from JR Kutchan Station to the Hirafu Intersection stop, then walk about 2 minutes."}, {"address": "397-5 Soga, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Established in 1989, this classic Niseko Jingisukan barbecue restaurant is famed for its premium, odor-free fresh lamb. The specially designed cast-iron grill sears the lamb to a crispy golden skin at high heat while keeping the inside tender and juicy\u2014delivering an explosion of flavor with every bite. Dip it into their secret fruit-garlic soy sauce recipe perfected over decades for a sweet-and-savory, refreshing taste. Paired with sweet locally grown onions, it is an irresistible culinary delight.", "name": "Loft Club Jingisukan", "transport": "About an 8-minute taxi ride from JR Niseko Station."}, {"address": "888-1 Soga, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A traditional local farm restaurant boasting stunning views of Mt. Yotei, specializing in fresh milk directly from Takahashi Dairy Farm and locally contracted Hokkaido vegetables. Main dishes are served alongside a semi-buffet featuring all-you-can-eat vegetables. Simple steaming and roasting bring out the astonishing natural sweetness and fluffy, velvety textures of various root vegetables. Drizzled with custom rich white cream sauce or cheese, it offers a deep dairy aroma and smooth texture. Its healthy, wholesome local flavors receive rave reviews.", "name": "Takahashi Dairy Farm PRATIVO", "transport": "About a 10-minute taxi ride from JR Niseko Station, or take the Niseko View Bus to the Takahashi Farm stop."}, {"address": "167-34 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Situated in Hirafu\u0027s historic old district, this classic family-run izakaya is helmed by a veteran local chef, radiating a nostalgic, warm Japanese ambience. A must-try item is the Hokkaido fried chicken (Zangi), featuring an ultra-crispy crust that bursts with flavorful juices into incredibly tender meat upon biting. Additionally, the thick-cut raw fish sashimi is plump and fresh, melting in your mouth with rich ocean flavors. This honest, handcrafted traditional cooking makes loyal fans out of skiers from around the world.", "name": "Kutani Traditional Izakaya", "transport": "Take a bus from JR Kutchan Station to the Hirafu Welcome Center, then walk about 6 minutes."}, {"address": "Kita 3-jo Nishi 2-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A heritage charcoal yakitori joint located in downtown Kutchan, dedicated for decades to slow-roasting locally raised chicken over premium Binchotan charcoal. The signature chicken skewers feature crispy skin and tender meat, deeply infused with smoky charcoal aromas. Brushed with a decades-perfected secret savory-sweet tare sauce, every bite is rich, flavorful, and deeply satisfying. Paired with a cold beer, it offers the most authentic local Hokkaido small-town evening atmosphere and warm hospitality.", "name": "Torimatsu Yakitori", "transport": "About a 5-minute walk from JR Kutchan Station."}, {"address": "167-58 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A classic home-style Japanese seafood restaurant upholding artisan craftsmanship, renowned for ultra-fresh ingredients and exquisite cooking techniques. Their signature seafood rice bowl (Kaisen Don) is generously heaped with Hokkaido king crab meat, salmon roe, and sea urchin\u2014where sweet, velvety sea urchin melts in your mouth and popping salmon roe infuses the fragrant rice with rich seafood oils. The pork tonkatsu is thick, crispy, and juicy. It\u0027s an unmissable destination for those seeking authentic, traditional Japanese comfort food.", "name": "Niseko Saburo", "transport": "Take a bus from JR Kutchan Station to Hirafu Station, then walk about 5 minutes."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "190-4 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Located in the heart of Hirafu, Green Farm Caf\u00e9 champions a \u0027farm-to-table\u0027 dining concept, sourcing organic ingredients from local Niseko farmers. The top brunch recommendation is their classic Eggs Benedict served on house-made sourdough bread. Cutting into the poached egg releases a rich, golden yolk that flows over crisp-yet-soft bread with a subtle, tangy sourdough aroma. Their smooth Belgian cocoa and freshly roasted lattes are morning must-haves for skiers looking to warm up. The welcoming staff and cozy wooden interior instantly make you feel at home.", "name": "Green Farm Caf\u00e9", "transport": "Take a bus from JR Kutchan Station to Hirafu Intersection stop, then walk about 3 minutes."}, {"address": "132-26 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Established for many years, Graub\u00fcnden is one of Niseko\u0027s most iconic American-style bakery cafes. It is famous for its generous handmade sandwiches and gorgeous layer cakes. Custom sandwiches feature freshly baked crisp baguettes or bacon toast stuffed with thick-cut smoked meats, fresh sweet lettuce, and rich cheese\u2014delivering a burst of savory juices and wheat aromas in every bite. For dessert, the strawberry chiffon and blueberry tart are highly recommended, featuring light, non-greasy cream and a crispy crust. A favorite spot among both local residents and skiers looking to recharge after a long day on the slopes.", "name": "Graub\u00fcnden", "transport": "About 10 minutes by taxi from JR Kutchan Station, or take the Hirafu Free Shuttle Bus to near the Konbu Onsen Entrance."}, {"address": "10, Kita 1-jo Nishi 3-chome, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Located near Kutchan Station, Sprout blends outdoor sports culture with an art exhibition space, creating a uniquely charming independent pour-over cafe in Niseko. The owner holds extremely high standards for coffee beans, offering a variety of in-house single-origin roasts with bright fruity acidity and a rich, nutty finish. Daily limited handmade cinnamon rolls feature a lightly crisp exterior and a soft, chewy interior infused with just the right amount of spice and sweet icing. Perfectly paired with a silky Cappuccino, it attracts countless tourists who love lifestyle aesthetics and outdoor activities.", "name": "Sprout Espresso \u0026 Art Space", "transport": "About a 3-minute walk from JR Kutchan Station."}, {"address": "142-1 Chuo-dori, Niseko, Abuta District, Hokkaido (In front of JR Niseko Station)", "feature": "\u2b50 4.6 stars | Situated right beside the main entrance of JR Niseko Station, Mountain Kiosk Coffee is a compact and cozy cabin-style espresso bar. Serving arguably the finest espresso and lattes in the Niseko area, it pairs carefully selected dark roast beans with premium Hokkaido fresh milk, producing an extraordinarily silky, micro-foamed milk texture packed with rich dairy sweetness and coffee finish. Beyond coffee, their handmade scones are delightfully crumbly yet moist inside, boasting a buttery aroma drizzled with a touch of local wildflower honey\u2014making it the ultimate light treat before catching a train or between exhilarating ski sessions.", "name": "Mountain Kiosk Coffee", "transport": "Located right outside JR Niseko Station."}, {"address": "888-1 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Takahashi Dairy Farm Milk Kobo is an unmissable cluster for sweets and brunch lovers visiting Niseko. Centered around farm-fresh premium milk, the bakery cafe\u0027s signature cream puffs boast an incomparably crispy shell packed with freshly injected, ultra-smooth custard cream that is rich without being overly sweet. One bite yields a delightful burst of custard! Pair it with a fresh milk latte or house-made yogurt drink while taking in the magnificent view of Mt. Yotei through the floor-to-ceiling windows for a truly satisfying sensory experience.", "name": "Takahashi Dairy Farm Milk Kobo Cafe", "transport": "About 10 minutes by car from JR Niseko Station, or take the Niseko Line bus to the Milk Kobo stop."}, {"address": "177-1 Yotei, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | ICOR NISEKO is a beauty concept cafe hidden along a natural stream on the forest edge, featuring striking architecture with expansive clear glass and warm timber accents. The brunch menu offers delicate organic plant-based meals and specialty coffee. A highlight is their French toast made with local Hokkaido blueberries and honey\u2014golden-brown on the outside and cloud-soft inside with a subtle egg aroma. Sitting on the outdoor terrace beside the stream while sipping pour-over coffee offers a luxurious, tranquil morning far away from the hustle and bustle.", "name": "ICOR NISEKO", "transport": "About 12 minutes by car from JR Niseko Station; driving is recommended."}, {"address": "190-1 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Attached to Niseko\u0027s largest flagship outdoor ski gear shop, Rhythm Base Coffee is a buzzing hub where international ski enthusiasts gather during the snow season. They serve classic Australian-style Flat Whites with deep coffee flavor and velvet-smooth microfoam. Their standout brunch platter features a nutritious avocado and poached egg toast topped with fresh rocket and pan-seared bacon for a refreshing, energy-boosting meal. The lively, international atmosphere makes it the ideal spot to fuel up before hitting the slopes.", "name": "Rhythm Base Coffee", "transport": "Located near Hirafu Intersection, about a 5-minute walk from Hirafu Bus Terminal."}, {"address": "430-1 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | Designed specifically for early risers seeking a hearty meal, Black Diamond serves generous fusion American-Japanese brunch dishes. Their classic pancake stack is fried fluffy and golden-brown, drenched in rich Canadian maple syrup, and served with crispy, savory bacon\u2014a sweet-and-savory combination that keeps you coming back for more. Their clean, bold dark-roast Americano is perfect for shaking off the morning chill. With a warm wood-burning stove and friendly service, it\u0027s one of Niseko\u0027s most popular morning energy supply stations.", "name": "Cafe\u0026Bar Black Diamond Coffee", "transport": "About 8 minutes by taxi from JR Niseko Station; located near Niseko Village."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "170-165 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.6 stars | Ezo Seafoods is one of the hottest seafood gastropubs in the Hirafu area, famous for its fresh seafood delivered daily from fishing ports all over Hokkaido. The oysters here are plump, juicy, and bursting with rich oceanic flavor, offering a tender, silky texture that pairs perfectly with a selected white wine or local craft beer. The interior blends the warmth of a Japanese izakaya with the stylish vibe of a Western seafood bar, making it a favorite among skiers and foodies worldwide. The most popular grilled seafood platter includes grilled scallops, king crab legs, and sweet Botan shrimp\u2014charred to perfection on the outside with firm, succulent meat inside, showcasing the ultimate original taste of Hokkaido seafood.", "name": "Ezo Seafoods", "transport": "Take a bus from JR Kutchan Station to \u0027Hirafu Intersection\u0027, then walk for about 3 minutes."}, {"address": "170-323 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Inspired by traditional Hokkaido barn architecture, The Barn combines warm wooden tones with sleek modern design to create an elegant yet relaxed dining ambience. The bistro specializes in French regional cuisine made with local ingredients from Yoichi and Niseko, such as Hokkaido Wagyu steak and Yoichi wine-braised local chicken. The Wagyu steak is seared to a golden crisp outside and remains beautifully pink inside, melting in your mouth with rich beef flavor and buttery richness. The bar also offers an extensive selection of Hokkaido wines and cocktails, making it the perfect spot for a romantic dinner or a luxurious nightcap after a day on the slopes.", "name": "The Barn by Yoichi", "transport": "About a 15-minute taxi ride from JR Kutchan Station, or a 5-minute walk from Hirafu town center."}, {"address": "Suiboku 1F, 191-29 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | A-Bu-Cha 2nd is an iconic and bustling izakaya gastropub in Niseko, featuring a lively atmosphere, warm wooden decor, and an impressive display of drinks. Its highlight is pairing traditional Hokkaido local cuisine with creative drinks. The must-try Hokkaido Genghis Khan (grilled mutton) and teppan dishes use tender, juicy lamb with zero gaminess, cooked with signature sauces and abundant local vegetables for a rich, flavorful experience. With over 100 varieties of sake, shochu, and umeshu, plus ice-cold draft beer paired with fragrant yakitori, guests can fully immerse themselves in the vibrant energy of Hokkaido nightlife.", "name": "A-Bu-Cha 2nd", "transport": "Take a bus from JR Kutchan Station to \u0027Hirafu Welcome Center\u0027, then walk for about 5 minutes."}, {"address": "188-24 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Bang Bang is a legendary, highly sought-after yakitori gastropub in Niseko, famous for its Binchotan-charcoal-grilled skewers and local Hokkaido delicacies. The cozy space is filled with a mouthwatering smoky aroma. Its signature chicken skewers, sourced from local contract farms, feature golden, crispy skin while keeping the meat unbelievably juicy and tender with a delicious char. Beyond yakitori, the local vegetable tempura and fresh sashimi are equally outstanding. Paired with a glass of curated Hokkaido sake, you can experience the charming magic of an authentic Japanese late-night eatery in a warm, welcoming setting.", "name": "Bang Bang Charcoal Yakitori Izakaya", "transport": "About a 12-minute taxi ride from JR Kutchan Station, located in Upper Hirafu."}, {"address": "431-2 Niseko, Niseko-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.7 stars | Located in the Annupuri area and famously praised by Anthony Bourdain, Raku Ichi Soba is a legendary dining spot that seamlessly blends traditional soba with local kaiseki cuisine. The master chef handcrafts soba noodles daily using Niseko\u0027s pristine snowmelt water and locally harvested buckwheat flour. The 100% buckwheat (ju-wari) soba boasts a satisfying firm texture and rich natural aroma, sliding down smoothly when dipped in savory bonito broth. In the evening, an exquisite local kaiseki tasting menu paired with curated local sake is served, where every dish is a work of art set inside a tranquil wooden cabin.", "name": "Raku Ichi Soba", "transport": "About a 10-minute taxi ride from JR Niseko Station."}, {"address": "888-1 Soga, Niseko-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | Located inside Takahashi Dairy Farm with panoramic views of Mount Yotei, Prativo is a charming countryside bistro highlighting seasonal Niseko vegetables and dairy products. Its lunch vegetable buffet is hugely popular, featuring veggies harvested fresh by local farmers each morning\u2014simply steamed or roasted to bring out their natural sweetness and crispness. For main courses, options include Hokkaido pork chops or cream stew; the pork is seared crispy outside and tender inside, overflowing with sweet, savory juices. Paired with Takahashi Farm\u0027s rich milk and cheese, it offers a deeply satisfying yet light meal surrounded by Hokkaido\u0027s stunning nature.", "name": "Prativo", "transport": "About an 8-minute taxi ride from JR Niseko Station, or take the Niseko Circuit Bus to Takahashi Farm Stop."}, {"address": "189-8 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.1 stars | Wild Bill\u0027s is a lively, rustic American-style gastropub with a festive vibe in Hirafu, beloved by international skiers and locals alike. It fuses American BBQ with fresh local Hokkaido ingredients, offering signature dishes like slow-roasted BBQ pork ribs and Hokkaido scallop cheese tarts. The ribs are slow-cooked at low temperatures until fall-off-the-bone tender, coated in a sweet and savory sauce that leaves you licking your fingers. Equipped with pool tables, big screens, and an open bar serving signature cocktails and draft beer, it\u0027s the ultimate place to unwind with friends after a day on the slopes.", "name": "Wild Bill\u0027s Restaurant \u0026 Bar", "transport": "Take a bus from JR Kutchan Station to Hirafu Intersection, then walk for about 4 minutes."}, {"address": "191-36 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Tatsumi is a stylish, modern Japanese gastropub that reinterprets traditional Hokkaido cuisine with refined Western presentation. Signature dishes include the Tokachi Obihiro pork rice bowl (butadon) and fresh sashimi platters. The pork bowl features premium pork belly charbroiled with a secret sauce, infusing every grain of rice with savory meat juices and crispy caramelization. The bar boasts an extensive collection of Japanese whiskies and local sake, with bartenders crafting original cocktails using Hokkaido fruits and sake based on guest preferences. Its cozy and sophisticated setting is ideal for intimate conversations and fine dining.", "name": "Tatsumi Japanese Restaurant \u0026 Bar", "transport": "About a 15-minute taxi ride from JR Kutchan Station, located in Lower Hirafu."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "388-1 Soga, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.6 stars | Tucked away in the Niseko countryside, this bagel specialty shop features handcrafted bagels made with local Hokkaido organic wheat and natural yeast. They offer a wide variety of vegan bagels boasting a delightfully crisp crust and a delightfully chewy, soft interior. Highly recommended are the \u0027Hokkaido Pumpkin Bagel\u0027 and \u0027Soy Milk Nut Spread\u0027\u2014rich in flavor yet light and guilt-free, making it the top healthy breakfast choice for vegetarian visitors to Niseko.", "name": "Seed Bagel \u0026 Coffee Company", "transport": "About 5 minutes by car or a 25-minute walk from JR Niseko Station"}, {"address": "190-4 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Located in the heart of Hirafu, this cafe adheres to a sustainable \u0027farm-to-table\u0027 concept. They offer an exceptionally rich menu tailored for vegetarians and vegans, with the \u0027Vegan Chia Seed Acai Bowl\u0027 and \u0027Plant-Based Veggie Burger\u0027 receiving rave reviews. The burger patty is juicy with a lovely grilled aroma, paired with organic lettuce and house-pickled beetroot for a rich, flavorful, non-greasy bite loved by western skiers and local vegetarians alike.", "name": "Green Farm Cafe", "transport": "About a 2-minute walk from Hirafu Intersection bus stop (accessible by bus from JR Kutchan Station)"}, {"address": "481-3 Niseko, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Enjoying piping hot, authentic spiced vegetarian curry in snowy Niseko is pure bliss. This restaurant offers dedicated vegetarian and vegan menus, featuring favorites like \u0027Chana Masala\u0027 and \u0027Palak Paneer\u0027. The chickpeas are simmered until tender and flavorful, delivering an explosion of aromatic spices paired perfectly with fresh-baked vegan naan\u2014an ideal energy boost after a day on the slopes.", "name": "Taj Mahal Niseko Annupuri", "transport": "About 10 minutes by taxi from JR Niseko Station, or take the free shuttle bus to the Niseko Annupuri Ski Resort area"}, {"address": "2F Odin Place, 190-13 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Combining a chic bar vibe with cozy cafe charm, Musu serves highly creative vegetarian and vegan dishes. Its signature \u0027Vegan Buddha Bowl\u0027 is packed with quinoa, roasted Hokkaido sweet corn, avocado, and alpine roasted seasonal veggies, drizzled with house-made sesame sauce for a fresh, rich, and well-balanced flavor profile. The relaxed atmosphere and wide range of plant-based milk lattes make it a popular spot for vegetarian travelers to unwind.", "name": "Musu Cafe \u0026 Bar", "transport": "Located on the 2nd floor of Odin Place at the Hirafu Intersection, about a 5-minute walk from Hirafu Welcome Center"}, {"address": "109-7 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Hokkaido\u0027s iconic soup curry gets a vegetarian-friendly twist at Tsubara Tsubara, featuring a pure vegetable broth and a bountiful array of fresh produce. The \u0027Special 20 Alpine Vegetables Soup Curry\u0027 includes crispy deep-fried pumpkin, lotus root, burdock root, eggplant, and carrots. Lightly crispy on the outside and tender inside, the veggies retain their natural sweetness, complemented by a refreshing, slightly spicy broth served with fragrant rice.", "name": "Soup Curry Tsubara Tsubara", "transport": "About a 10-minute taxi ride from JR Kutchan Station, or a 15-minute walk from central Hirafu"}, {"address": "167-3 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | One of Niseko\u0027s most famous wood-fired pizza joints, offering dairy-free vegan cheese substitution options. Their specially designed \u0027Vegan Veggie Delight Pizza\u0027 features a high-temperature oven-baked crust that is perfectly crispy outside and pleasantly chewy inside, topped with fresh basil, olives, bell peppers, and wild mushrooms. The savory melted plant-based cheese makes it an ultimate feast for group dining and veggie lovers.", "name": "Niseko Pizza", "transport": "About an 8-minute walk from Hirafu Welcome Center"}, {"address": "12, Kita-3-jo Nishi-1-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.6 stars | Located near Kutchan Station, this cafe is a popular hub for local hipsters and cycling enthusiasts. They offer a rich selection of oat milk and soy milk beverages, alongside limited daily batches of handmade vegan and gluten-free desserts (such as vegan oat cookies and dark chocolate brownies). The brownie features a slightly crisp exterior and a rich, fudgy center with deep bittersweet cocoa flavors\u2014the ultimate comforting afternoon treat in winter.", "name": "Sprout Niseko Cafe", "transport": "About a 3-minute walk from JR Kutchan Station"}, {"address": "126-1 Miyata, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Surrounded by lush forest in the Miyata area, this cozy log cabin cafe focuses on organic and natural cooking techniques. They serve an exquisite \u0027Seasonal Vegan Vegetable Set\u0027, featuring morning-harvested produce from local Niseko organic farms, paired with house-baked plant-based bread rolls and a rich carrot cream soup. Smooth and naturally sweet, the meal offers a soothing plant-based dining experience in an elegant, warm wooden setting.", "name": "The Green Brier", "transport": "About an 8-minute drive from JR Niseko Station"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "888-1 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.6 stars | An absolute must-visit dessert paradise in Niseko! Famous for its signature cream puffs, boasting an incredibly light and crispy shell filled with rich milk custard piped right when you order. Every bite bursts with fragrant, silky milk flavor that is perfectly sweet without being overwhelming. Their rich soft-serve ice cream is another favorite among tourists and skiers, melting in your mouth with a refreshing dairy aroma for ultimate bliss.", "name": "Takahashi Dairy Farm Niseko Milk Kobo", "transport": "About an 8-minute taxi ride from JR Niseko Station"}, {"address": "77-10 Motomachi, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | The ultimate snack hub highlighting fresh Hokkaido ingredients! The superstar here is the local Baron potato croquette\u2014fried fresh to golden perfection with an extraordinarily crispy crust and a fluffy, naturally sweet mashed potato filling inside. Paired with aromatic Hokkaido butter or grilled corn, every crunchy bite is loved by both locals and travelers.", "name": "Michi-no-Eki Niseko View Plaza Food Stalls", "transport": "About a 5-minute drive or bus ride from JR Niseko Station"}, {"address": "245-45 Nishikarakawa, Makkari, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | A legendary charcoal stone-oven bakery nestled at the foot of Mount Yotei. Looking like a cozy woodland cottage, it bakes croissants with astonishingly delicate layers\u2014shattering into flaky golden crumbs at first bite while remaining tender and infused with rich cultured butter inside. Served warm from the oven, crispy on the outside and soft within, it\u0027s a gourmet grab-and-go treat worth waking up early for.", "name": "Boulangerie JIN", "transport": "About a 15 to 20-minute drive from the Niseko Hirafu area"}, {"address": "170-136 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | A hugely popular, character-rich food truck in the Hirafu ski area, wafting irresistible spice aromas into the crisp snowy air. Their fresh, made-to-order naan features a lightly blistered crust, chewy texture, and subtle dough aroma. Dipped into piping hot, richly spiced North Indian curry, it instantly warms up hungry skiers and is a favorite among international travelers.", "name": "Taj Mahal Niseko Food Truck", "transport": "Located in the heart of Hirafu Village, about a 5-minute walk from Niseko Grand Hirafu Ski Resort"}, {"address": "34-62 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.7 stars | Niseko\u0027s acclaimed spot for fresh artisanal gelato. Crafted exclusively with premium Hokkaido milk and seasonal fresh fruits, the gelato boasts a dense, velvety texture bursting with natural fruit flavors. Popular picks like Peach and Yubari Melon melt smoothly on the palate with a clean sweetness\u2014so delicious that visitors rave about it even when eating in the winter snow!", "name": "Ruhiel Artisanal Gelato", "transport": "Take a bus from JR Kutchan Station to Hirafu Intersection, then walk about 3 minutes"}, {"address": "190-13 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | A popular crowd-favorite nestled in the Hirafu food truck hub. These handmade gyoza are pan-fried to give a golden, crispy bottom while sealing in juicy, tender Hokkaido pork. One bite explodes with scalding, flavorful broth inside a delightfully chewy wrapper. Paired with a bowl of piping hot specialty broth, it\u2019s the ultimate comforting late-night snack for a chilly winter stroll.", "name": "Niseko Sanroku Gyoza Food Truck", "transport": "Located in the Hirafu Food Truck Village, about a 2-minute walk from Hirafu Intersection"}, {"address": "428-10 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | An award-winning cheese boutique famous among foodies for its irresistible cheese soft-serve ice cream. Seamlessly blending fresh local cheese with premium Hokkaido milk, it delivers a rich, creamy texture with subtle savory and tangy notes for a complex, beautifully balanced treat. You can also pick up fresh string cheese snacks to enjoy on the go\u2014a true holy grail for cheese lovers!", "name": "Niseko Cheese Factory", "transport": "About a 7-minute drive from JR Niseko Station"}, {"address": "170-165 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Hirafu\u2019s premier seafood take-out stall, bringing world-class Hokkaido seafood right to the streets. The star offering is freshly grilled oysters\u2014plump, juicy, and bursting with rich oceanic sweetness at every bite. Their hot, velvety seafood chowder is also the ultimate winter comfort food, highly recommended by locals and travelers alike.", "name": "Ezo Seafoods Street Food Stand", "transport": "Located on Hirafu\u0027s main street, about a 3-minute walk from Hirafu Intersection"}], "name": "\ud83c\udf2d Street Food \u0026 Market Treats"}}, "name": "Niseko Resort Area"}, "noboribetsu_toya": {"categories": {"cat_1": {"items": [{"address": "29 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.1 stars | A hugely popular iconic ramen shop located on Noboribetsu Onsen Street, world-famous for its signature \"Hell Ramen.\" The Hell Ramen features a rich, spicy red miso broth\u2014deeply flavorful with complex layers of heat\u2014paired with springy Hokkaido medium-thin curly noodles that absorb the broth perfectly. Diners can customize their spice level by adding extra spoonfuls of chili, where higher heat brings richer aroma rather than just pure pain. Each bite bursts with intense miso fragrance and spicy red chili oil, accompanied by melt-in-your-mouth seared chashu pork. A must-visit destination for spicy ramen enthusiasts and tourists alike.", "name": "Ajino Daioh Noboribetsu Branch", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 3 minutes."}, {"address": "30 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | A handmade soba specialty restaurant on Noboribetsu Onsen Street steeped in traditional Japanese atmosphere. Using high-quality Hokkaido buckwheat seeds, the master chef hand-crafts fresh noodles daily, giving them an elegant, natural color. The noodles offer a firm, smooth, and delightfully chewy texture that releases a rich, nutty buckwheat aroma as you chew. Their signature \"Shrimp Tempura Soba\" features jumbo seafood fried to a light, crispy golden perfection without feeling greasy, paired with a warm, savory bonito dashi dipping sauce. It\u0027s a soul-soothing culinary highlight along the hot spring street.", "name": "Sobadokoro Fukuan", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 4 minutes."}, {"address": "50 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.0 stars | A famous seafood restaurant located at the heart of Noboribetsu Onsen Street, featuring large live fish tanks that guarantee maximum freshness prepared to order. The iconic \"Noboribetsu Enma Seafood Don\" is loaded with local Funka Bay salmon roe, sea urchin, sweet shrimp, and scallops. The sashimi is delightfully sweet, tender, and succulent, bursting with pure oceanic flavor in every bite. Additionally, the charcoal-grilled fresh oysters and seared scallops are legendary\u2014plump, juicy, and infused with an irresistible smoky flame aroma. Highly praised by hot spring gourmets and first-time visitors alike.", "name": "Onsen Ichiba", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 2 minutes."}, {"address": "36-12 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Founded in 1946 (Showa 21), this classic Western-style eatery (Yoshoku) on the shores of Lake Toya retains a charming, nostalgic retro wooden interior. Its signature Hamburg Steak has captivated diners for decades; crafted with a golden ratio of premium Hokkaido beef and pork, hand-patted and pan-seared until crispy on the outside and tenderly juicy on the inside. Drizzled with a secret dark demi-glace sauce simmered for days, every bite bursts with rich, savory juices. Paired with sweet Hokkaido white rice, it offers an unforgettable taste of old-school comforting perfection.", "name": "Restaurant Boyotei", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen Station\u0027, then walk for about 3 minutes."}, {"address": "36 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A renowned dessert and traditional light-eats shop on Toyako Onsen Street, most famous for its original creation, the \"White Red Bean Soup.\" Made from finely ground local Toyako Oofuku beans, this dessert showcases a snow-white hue, a velvety-smooth texture, and a gentle, balanced sweetness. Served warm with freshly toasted, stretch-soft mochi rice cakes, it delivers comforting sweetness in every spoonful. The shop also serves traditional dashi udon and set meals prepared with local ingredients, making it a soothing stop while strolling along the lake.", "name": "Okadaya", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen Station\u0027, then walk for about 3 minutes."}, {"address": "144 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido (Wakasaimo Honpo 2F)", "feature": "\u2b50 4.2 stars | A scenic Japanese restaurant located on the 2nd floor of Wakasaimo Honpo\u0027s main Lake Toya store, featuring floor-to-ceiling glass windows overlooking stunning views of Lake Toya and Mount Yotei. The restaurant specializes in grand Japanese set meals crafted with fresh seafood from Funka Bay and local agricultural produce. The highly popular \"Funka Bay Scallop Kamameshi\" cooks plump scallops directly with Hokkaido rice in an iron pot, allowing the rice to absorb every drop of sweet seafood essence while creating a fragrant, lightly charred crust at the bottom. Savoring premium seafood while taking in the majestic lake and mountain views offers an unrivaled feast for both eyes and palate.", "name": "Sendouan", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen Station\u0027, then walk for about 5 minutes."}, {"address": "78 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A legendary Michelin Bib Gourmand-recommended ramen shop in Lake Toya. Though small, it consistently draws a steady crowd. Their original signature \"Golden Miso Ramen\" uses a proprietary blend of three misos to create a clear, golden-hued broth that is light, naturally sweet, and beautifully layered\u2014redefining traditional miso ramen that can often be overly heavy and salty. Combined with springy medium-curly noodles and sous-vide tender chashu pork, every sip of soup and bite of noodle is wonderfully comforting. It is a true ramen masterpiece enthusiastically recommended by locals and food connoisseurs.", "name": "Ippontei", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen Station\u0027, then walk for about 4 minutes."}, {"address": "76 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.2 stars | A traditional Japanese restaurant nestled near Dai-ichi Takimotokan in Noboribetsu Onsen, renowned for its delicate kamameshi (rice cooked in an iron pot) and Japanese set meals featuring carefully selected seasonal local ingredients. The signature \"Noboribetsu Pork Kamameshi\" pairs premium local Hokkaido pork with rich dashi broth. When opened, the steaming pot releases an enticing aroma of rich pork and sweet rice. The meat is incredibly tender, juicy, and flavorful. Complemented by refreshing pickled side dishes and freshly cooked miso soup, it showcases master artisan cooking at its finest\u2014an exquisite Japanese dining experience not to be missed after relaxing in the hot springs.", "name": "Kishoan", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 6 minutes."}], "name": "Famous Local Traditional Eateries"}, "cat_2": {"items": [{"address": "127 Hanai, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A top-tier farm cafe perched on a hill by Lake Toya, boasting vast green lawns and breathtaking panoramic views of Mt. Yotei. Renowned for its ultimate handmade gelato crafted from fresh farm milk and rich lattes. Their brunch features freshly baked artisanal pizzas and cheese sandwiches crisp on the outside and soft inside, while the milk cream puffs bursting with fresh cream are a must-try walk-and-eat dessert. The large outdoor lawn features playground equipment and a cute bunny area, making it the ultimate spot to bask in the sunshine and Hokkaido\u0027s pure air.", "name": "Lake Hill Farm", "transport": "Take the Donan Bus bound for \u0027Toyako Onsen\u0027 from JR Toya Station, and get off at the \u0027Lake Hill Farm\u0027 bus stop."}, {"address": "58-1 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | A lakeside American-style brunch cafe situated right on the front line of Lake Toya, offering stunning views through large floor-to-ceiling windows. The most popular menu item is the extra-thick handmade beef burger\u2014juicy beef patties paired with rich special cheese and crispy fries, bursting with flavor in every bite. Enjoying your burger with hand-drip dark roast coffee or a fresh smoothie while soaking in the serene lakeside vibe makes it a favorite among international tourists and local youth alike.", "name": "Hydune", "transport": "About a 7-minute walk from Toyako Onsen Bus Terminal to the waterfront location."}, {"address": "40-4 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A cozy wooden-accented cafe located on the Toyako Onsen street, famous for its warm handcrafted touch and relaxing atmosphere. Brunch options include rich Hokkaido vegetable soup curry and generous salad platters, along with artisanal French toast that is golden and crispy on the outside and soft and moist on the inside. Featuring carefully selected roast beans, their pleasantly bitter-sweet lattes and specialty matcha milk are exquisite\u2014making it the perfect stop for an elegant, refined brunch after a stroll down the hot spring street.", "name": "tsumugi cafe", "transport": "About a 3-minute walk from Toyako Onsen Bus Terminal."}, {"address": "144-50 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | An elegant French-style cafe tucked away in the Toyako Onsen area. Meaning \u0027Sailboat\u0027, its name sets the tone for a peaceful, resort-like dining environment by the lake. Highly praised for its handmade seasonal fruit tarts and freshly baked pound cakes, combining crispy tart shells with fresh Hokkaido cream and seasonal fruits that aren\u0027t overly sweet. The classic combination of hot-pressed ham and cheese sandwiches with hot coffee during brunch allows guests to spend a delightful morning surrounded by relaxing background music.", "name": "Cafe la Voile", "transport": "About a 5-minute walk from Toyako Onsen Bus Terminal."}, {"address": "6 Takae, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A hidden cabin-style cafe located on the northern shore of Lake Toya, away from the bustling hot spring street in a tranquil, serene setting. The owner carefully selects local ingredients to craft home-style brunch dishes. The classic handmade butter chiffon cake is extremely soft and rich in egg flavor, pairing perfectly with freshly ground hand-pour single-origin coffee. The outdoor seating area lets you listen closely to birdsong and rustling leaves\u2014a secret gem loved by savvy travelers.", "name": "Cafe gura", "transport": "Driving is recommended (approx. 15 minutes from Toyako Onsen street); or take the lake-loop bus, get off at \u0027Takae\u0027 stop, and walk for about 4 minutes."}, {"address": "50 Noboribetsuonsen-cho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.4 stars | A stylish cafe and bar located in the heart of Noboribetsu Onsen street, boasting an American industrial aesthetic and a relaxed modern vibe. Brunch highlights include generous specialty American breakfast platters and freshly baked Belgian waffles, perfectly paired with Hokkaido maple syrup and rich espresso. Serving high-standard specialty hand-pour coffee and creamy foam lattes, it injects a dose of youthful energy and aromatic coffee into your morning in the hot spring town.", "name": "Noboribetsu Cafe\u0026Bar BASE", "transport": "About a 3-minute walk from Noboribetsu Onsen Bus Terminal, located on Gokuraku-dori Shopping Street."}, {"address": "223-9 Naka-yubetsu, Noboribetsu, Hokkaido", "feature": "\u2b50 4.1 stars | A milk experience center combining high-quality local dairy farm produce with light cafe meals, crafting delicious dishes using fresh milk from Noboribetsu. Brunch must-tries include the special aged cheese Wagyu beef burger and ultra-rich fresh cream curry rice, bursting with rich flavors. Afterwards, don\u0027t miss out on a soft-serve cone made with pure fresh milk\u2014its silky, subtle sweetness perfectly highlights the essence of Hokkaido\u0027s dairy industry, making it a highly-rated culinary stop before heading to Noboribetsu Onsen.", "name": "Noboribetsu Dairy Property", "transport": "About a 10-minute drive from JR Noboribetsu Station, or take the Donan Bus and get off at \u0027Rakunokan-mae\u0027 stop."}, {"address": "46 Noboribetsuonsen-cho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.2 stars | A traditional folk-house style Japanese coffee shop tucked away on Noboribetsu Onsen street, exuding a calm, nostalgic Showa-era charm. Their Japanese brunch and afternoon tea sets are truly unique, with signature homemade red bean matcha shiratama parfaits pairing perfectly with freshly brewed dark roast coffee. The handmade red bean toast, crispy outside with a rich filling topped with savory butter, creates a delightful sweet-and-savory harmony loved by both tourists relaxing after visiting Jigokudani and local gourmets.", "name": "Sabou Miyamoto", "transport": "About a 4-minute walk from Noboribetsu Onsen Bus Terminal, located on the slope of Gokuraku-dori Shopping Street."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "50 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.2 stars | Located in the heart of Noboribetsu Onsen Street, this venue combines a fresh seafood market with a lively bistro atmosphere. It is famous for freshly caught sea urchin rice bowls and charcoal-grilled scallops that burst with sweet, ocean-fresh juices in every bite. They also feature Noboribetsu\u0027s exclusive \u0027Enma Ramen\u0027 alongside stout brewed by a local craft brewery. The spicy broth paired with smooth noodles and rich, malty craft beer makes it a top night-gathering spot for tourists and locals after a hot spring soak.", "name": "Noboribetsu Onsen Market (Noboribetsu Onsen Ichiba)", "transport": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 3 minutes."}, {"address": "36-12 Toyako Onsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Founded in 1946, this retro bistro by Lake Toya exudes a nostalgic Showa-era wooden charm. Its signature \u0027Hokkaido Wagyu Hamburg Steak\u0027 is juicy and plump, smothered in a house demi-glace red wine sauce slow-simmered for days, yielding an incredibly tender texture and rich, savory flavor. Alongside Western-style dishes, the restaurant offers wine pairings and local Hokkaido draft beer. Its classic, elegant atmosphere makes it a beloved favorite among international travelers and local families alike.", "name": "Boyotei Restaurant", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 stop, then walk for about 5 minutes."}, {"address": "30 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.4 stars | A highly distinctive hand-pulled soba izakaya in the Noboribetsu Onsen area. Freshly made daily using carefully selected Hokkaido buckwheat flour, the soba noodles have a firm, bouncy texture and a subtle nutty aroma. In addition to soba, the evening menu features exquisite tempura and seasonal small plates\u2014crispy, non-greasy, and perfectly paired with custom dipping sauce. Enjoyed with a chilled glass of local Hokkaido sake, it is the best place to savor authentic regional flavors.", "name": "Soba-dokoro FukuAn", "transport": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 4 minutes."}, {"address": "144 Toyako Onsen, Toyako, Abuta District, Hokkaido (Wakasaimo Honpo 2F)", "feature": "\u2b50 4.1 stars | Located on the 2nd floor of Wakasaimo Honpo along the shores of Lake Toya, this scenic local restaurant and pub lets you enjoy regional cuisine while taking in stunning lake views. The \u0027Funka Bay Scallop Set Meal\u0027 paired with local sake comes highly recommended; the scallops are plump, sweet, and lightly seared for a delightful smoky aroma. Paired with a hot bowl of Funka Bay salmon miso soup, the rich flavors and breathtaking views make this a top-rated dining landmark by Lake Toya.", "name": "Shun no Aji Sendouan", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 stop, then walk for about 3 minutes."}, {"address": "60 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | A cozy izakaya tucked away in an alley off Noboribetsu Onsen Street, beloved by locals and foodies in the know. The house specialties are charcoal-grilled skewers and fresh sashimi. Chicken skewers grilled over Binchotan charcoal feature crispy skin and juicy, tender meat, elevated by just a pinch of sea salt. With warm, welcoming hosts and a curated selection of regional Hokkaido sake, guests can enjoy an authentic Noboribetsu nightlife dining experience.", "name": "Izakaya Sagara", "transport": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 5 minutes."}, {"address": "46 Toyako Onsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.0 stars | An authentic seafood izakaya on Lake Toya Onsen Street, renowned for fresh fish and live seafood delivered daily from nearby fishing ports. The signature grilled Hokke (Atka mackerel) has a crispy skin and rich, juicy flesh\u2014a perfect match for a steaming bowl of rice or local sake. Additionally, their special Hokkaido-style fried chicken \u0027Zangi\u0027 is crispy outside, tender inside, and bursting with juice, making this a vibrant gastropub full of Hokkaido charm.", "name": "Izakaya Amimoto Lake Toya", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 stop, then walk for about 4 minutes."}, {"address": "47 Toyako Onsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | A welcoming, family-style izakaya in the Lake Toya Onsen area offering a rich variety of home-cooked Hokkaido specialties and curated drinks. The \u0027Jingisukan\u0027 (grilled lamb) has no gamey smell; sliced tender and juicy, it is sizzled on an iron skillet alongside cabbage and onions, then dipped in a savory-sweet house sauce that goes wonderfully with alcohol. The warm lighting and hospitable welcome make you feel right at home, making it an excellent spot to experience local culture.", "name": "Izakaya Kiraku", "transport": "From JR Toya Station, take the Donan Bus to \u0027Toyako Onsen\u0027 stop, then walk for about 5 minutes."}, {"address": "76 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.1 stars | A cozy, warm-hearted local dining pub in the Noboribetsu Onsen area, specializing in comforting regional dishes made with carefully selected Hokkaido ingredients. Must-order specialties include grilled pork skewers and the signature baked potato with butter. Slow-steamed and roasted to perfection, the sweet and fluffy potato melts with rich Hokkaido butter in a burst of creamy deliciousness. Its inviting atmosphere and authentic fare make it a favorite late-night spot for hot spring visitors.", "name": "Izakaya Kimi", "transport": "From JR Noboribetsu Station, take the Donan Bus to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk for about 6 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "30 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | A highly rated handmade soba noodle specialty shop located on Noboribetsu Onsen Street, thoughtfully offering mixed vegetable tempura and pure vegetarian dashi soba for plant-based diners. The freshly fried tempura features an extremely light and crispy batter wrapping sweet, local seasonal Hokkaido vegetables. Paired with rich, aromatic high-altitude 100% buckwheat (ju-wari) soba noodles that are smooth and chewy with a lingering finish, it is immensely popular among international tourists and local vegetarians.", "name": "Sobadokoro Fukuya", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk about 3 minutes."}, {"address": "127 Hanawa, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | An organic farm restaurant boasting magnificent views of Mount Yotei, featuring fresh, sweet vegetables carefully harvested from their own farm. Highlights include pure vegetable and fruit cheese pizza and fresh green salad platters. The produce is crisp and sweet, while the pizza crust is crispy on the outside and soft inside. Paired with rich, freshly handcrafted gelato, this is a top-choice, highly popular spot for light vegetarian dining in the Lake Toya area.", "name": "Lake Hill Farm Restaurant", "transport": "Take the bus bound for Toyako Onsen from JR Toya Station, get off at \u0027Hanawa\u0027 stop, and you will arrive immediately."}, {"address": "85 Toyacho, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.1 stars | Located on the northern shore of Lake Toya, Mizu no Eki brings together pesticide-free organic vegetables harvested daily by local farmers. The diner thoughtfully offers vegetarians Toya\u0027s specialty red bean sticky rice, steaming hot vegetable soy sauce udon noodles, and freshly steamed sweet corn. Here you can savor the purest natural sweetness and hearty texture of Hokkaido\u0027s soil\u2014simple yet immensely satisfying.", "name": "Toya Mizu no Eki Vegetarian Diner", "transport": "Take the Donan Bus bound for \u0027Toyacho\u0027 from JR Toya Station, and get off at \u0027Mizu no Eki\u0027."}, {"address": "144 Toyako Onsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | A famous traditional confectioner in Hokkaido. Although the name contains \u0027Imo\u0027 (sweet potato), it is actually meticulously crafted from pure plant-based ingredients including Lake Toya-grown white kidney beans (Dafuku beans) and kelp. Featuring a lightly charred, crispy crust and a smooth, dense filling, it blends delicate bean aromas with a uniquely sweet and savory kelp flavor\u2014a classic dessert that vegetarian travelers strolling by Lake Toya shouldn\u0027t miss.", "name": "Wakasa Imo Honpo Toyako Main Store", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen Bus Terminal\u0027, then walk about 5 minutes."}, {"address": "128-1 Toyacho, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | A cozy Japanese wooden organic caf\u00e9 offering daily limited chef-special vegetarian curry and seasonal vegetable platters. The rice is carefully selected Hokkaido brown rice (genmai), while the rich, smooth curry sauce is infused with proprietary spices and plenty of stewed bell peppers, eggplants, and pumpkin, yielding a natural fruity sweetness. It is exceptionally popular among slow-travel enthusiasts.", "name": "Caf\u00e9 marumero", "transport": "Take a bus from JR Toya Station to \u0027Toyacho\u0027 stop, then walk about 2 minutes."}, {"address": "55 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.5 stars | Located within a century-old hot spring ryokan in Noboribetsu, offering exquisite Shojin Ryori (curated vegetarian kaiseki cuisine). The executive chef masterfully utilizes handmade sesame tofu, fresh bamboo shoots, seasonal mountain vegetables, and premium shiitake mushroom dashi stock for slow simmering. Visually stunning, rich in layered textures, and imbued with Zen elegance, it is a dream destination for those seeking the ultimate vegetarian dining experience.", "name": "Dai-ichi Takimotokan Ryokufutei Vegetarian Kaiseki", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen\u0027 stop, then walk about 5 minutes."}, {"address": "3-5 Naruka, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | A snack area at an observatory boasting panoramic views of Lake Toya and Nakajima Island, specifically offering freshly baked Hokkaido butter potatoes and sweet steamed corn for vegetarian travelers. The potatoes are remarkably soft and fluffy, melting in your mouth when paired with unsalted butter, unleashing a rich, natural sweetness. It is a must-try popular street food when passing through.", "name": "Silo Observatory Caf\u00e9", "transport": "Drive or take a sightseeing bus from JR Toya Station; arrives in about 20 minutes."}, {"address": "29 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.0 stars | A well-established restaurant in Noboribetsu famous for its Jigoku (Hell) Spicy Ramen, thoughtfully crafting a 100% plant-based oil \u0027Vegetable Miso Ramen\u0027 for vegan and lacto-ovo vegetarian guests. Featuring springy and chewy noodles, the rich soup blends deep Hokkaido miso with plenty of high-heat stir-fried cabbage and bean sprouts for a crisp, fresh sweetness\u2014allowing vegetarians to savor hot, authentic Japanese ramen with complete peace of mind.", "name": "Ajino Daioh Noboribetsu Vegetarian Onsen Ramen", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk about 2 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "144 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | A must-try grab-and-go sweet at Lake Toya, \u0027Wakasaimo\u0027 features a lightly charred outer skin infused with a savory soy sauce aroma. The filling is made from sweet white kidney bean paste combined with Hokkaido kelp fiber, recreating a dense, delicate sweet potato texture. The freshly deep-fried version, \u0027Imo-ten\u0027, is crisp on the outside, soft on the inside, warm, and rich\u2014a favorite among tourists and locals alike.", "name": "Wakasaimo Honpo Lake Toya Main Store", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "127 Hanawa, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | A highly popular farm dessert spot located in the hills of Lake Toya, crafting gelato with fresh milk squeezed daily from their own farm. The gelato is infinitely smooth and richly milky without being greasy; signature flavors like Milk and Matcha melt in your mouth. Enjoying your treat on the expansive green lawn while overlooking Lake Toya is the ultimate feast for both eyes and taste buds.", "name": "Lake Hill Farm Gelato", "transport": "Take the bus bound for Nakatoya from JR Toya Station, get off at \u0027Hanawa Shogakko-mae\u0027, then walk about 2 minutes."}, {"address": "50 Noboribetsu Onsen-cho, Noboribetsu-shi, Hokkaido", "feature": "\u2b50 4.1 stars | Located in the heart of Noboribetsu Gokuraku Dori Shopping Street, offering distinctive local snacks and freshly grilled seafood skewers. Don\u0027t miss the cooked-to-order giant Hokkaido scallops and smoky grilled corn. The scallop meat is plump and juicy, drizzled with Hokkaido butter and soy sauce, filling the street with an irresistible seared aroma\u2014a savory street food must when strolling through the hot spring town.", "name": "Noboribetsu Onsen Ichiba (Charcoal-Grilled Seafood \u0026 Snacks)", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen\u0027 terminal, then walk about 1 minute."}, {"address": "36 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | A historic dessert shop on Toyako Onsen Street, famous for its signature handmade \u0027White Bean Soup with Rice Dumplings\u0027 (Shiroi Oshiruko). The chewy rice dumplings are served in a warm, sweet white kidney bean soup with a gentle hint of milkiness\u2014wonderfully warming in winter. Summer brings cold variations and white bean paste soft-serve ice cream, offering delightfully surprising multi-layered textures.", "name": "Okada-ya Lake Toya", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 terminal, then walk about 2 minutes."}, {"address": "76 Noboribetsu Onsen-cho, Noboribetsu-shi, Hokkaido", "feature": "\u2b50 4.0 stars | A classic street food staple on Noboribetsu Onsen Street, serving piping hot, freshly steamed Onsen Manju (hot spring buns). The fluffy outer dough is steamed with brown sugar, carrying a rich cane sugar fragrance, filled with perfectly sweetened red bean paste. Bursting with flavor in every bite, it\u0027s ideal for enjoying while walking or taking home as a charming hot spring souvenir.", "name": "Dairyudo Onsen Manju", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen\u0027 terminal, then walk about 3 minutes."}, {"address": "168 Naka-noboribetsu-cho, Noboribetsu-shi, Hokkaido", "feature": "\u2b50 4.4 stars | A popular sweet spot making walking snacks with high-quality local Noboribetsu milk. The soft-serve ice cream has a high milk-fat content, resulting in a silky, rich texture brimming with fresh raw milk aroma. They also serve freshly baked cheese sticks and puddings; the savory, fragrant cheese snacks attract dairy lovers from all over.", "name": "Noboribetsu Rakunokan Direct Store (Soft Serve \u0026 Cheese Snacks)", "transport": "Take the bus from JR Noboribetsu Station to \u0027Naka-Noboribetsu\u0027 stop, then walk about 5 minutes."}, {"address": "184-5 Showa Shinzan, Sobetsu-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.0 stars | A bustling snack hub right next to the Showa Shinzan Ropeway Station. Highlights include charcoal-grilled Hokkaido golden corn brushed with a special sweet soy sauce\u2014bursting with juicy sweetness and roasted aroma\u2014and luscious cantaloupe soft-serve packed with rich fruity and creamy flavors. The ultimate walking treats while admiring Showa Shinzan and volcanic views.", "name": "Showa Shinzan Bear Ranch Snack Corner", "transport": "Take the Donan Bus from JR Toya Station and get off at \u0027Showa Shinzan\u0027 stop (right at the location)."}, {"address": "60 Noboribetsu Onsen-cho, Noboribetsu-shi, Hokkaido", "feature": "\u2b50 4.2 stars | Located on Gokuraku Dori in Noboribetsu Onsen, this shop offers fresh street sweets, with their signature \u0027Yuzu Honey Soft Serve\u0027 being a huge crowd favorite. Rich milk soft-serve is drizzled with pure, natural yuzu honey\u2014opening with sweet creamy notes followed by a tangy citrus twist. Light, non-sticky, and wonderfully layered, it\u0027s a staple treat for everyone strolling down the hot spring street.", "name": "Sugi Bee Garden Noboribetsu Store", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen\u0027 terminal, then walk about 2 minutes."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Noboribetsu Onsen and Lake Toya"}, "otaru_canal": {"categories": {"cat_1": {"items": [{"address": "1-1-1 Hanazono, Otaru City, Hokkaido", "feature": "\u2b50 4.3 stars | An iconic sushi institution in Otaru with over 80 years of history. Using premium Hokkaido rice, their perfectly seasoned vinegared rice is paired with seafood delivered fresh every morning from Otaru Port and nearby waters\u2014including sea urchin, botan shrimp, herring, and salmon roe. The airy rice melts together with the luscious raw fish in your mouth, bursting with sweet, rich flavor. The signature \u0027Ganso Hanakago Zen\u0027 bento set and sea urchin wrapped in seaweed are absolute must-try delicacies loved by both tourists and locals.", "name": "Otaru Masazushi Main Store", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "3-16-13 Inaho, Otaru City, Hokkaido", "feature": "\u2b50 4.4 stars | Established in 1952, this legendary spot serves Otaru\u0027s ultimate soul food. Its famous signature dish, \u0027Deep-Fried Half Chicken\u0027 (Wakadori Hanshin Age), features a golden, ultra-crispy skin with a satisfying crunch, yielding to incredibly tender and juicy meat beneath. A light touch of salt perfectly enhances the natural sweetness of the chicken without feeling greasy. Their unique set meals combining traditional sushi with fried chicken offer a fascinating glimpse into local culinary culture, beloved by locals and travelers alike.", "name": "Wakadori Jidai Naruto Main Store", "transport": "About a 7-minute walk from JR Otaru Station"}, {"address": "2-1 Yamada-cho, Otaru City, Hokkaido", "feature": "\u2b50 4.2 stars | Located on Otaru Sushi Street, this renowned establishment is the only sushi restaurant in Otaru with direct bidding rights at the local fishing port. This allows them to secure the finest daily catches, guaranteeing unmatched freshness. Highly recommended is the \u0027Tokujo Nigiri Set\u0027 (Premium Nigiri Combo), featuring rich fatty tuna (chutoro), snappy botan shrimp, and farm-fresh sea urchin. Served over perfectly warm vinegared rice, each piece showcases rich textures, exquisite sweetness, and true artisan dedication.", "name": "Otaru Asahi Zushi", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "1-1-17 Ironai, Otaru City, Hokkaido (Inside Otaru Denuki Koji)", "feature": "\u2b50 4.5 stars | Located right by Sakaimachi Street, this classic seafood bowl (kaisendon) joint is directly operated by a seafood wholesaler. Their signature \u0027Special Seafood Rice Bowl\u0027 is generously piled with fresh sea urchin, salmon roe, crab meat, and scallops. The fresh sea urchin\u2014free of alum additives\u2014is sweet and buttery smooth, while the salmon roe pops with rich ocean flavor and the plump scallops offer a tender bite. Cozy and infused with retro Showa-era charm, it\u2019s a favorite among true foodies.", "name": "Sawazaki Suisan Kaisenshokudo", "transport": "About a 12-minute walk from JR Otaru Station, next to the Otaru Canal intersection"}, {"address": "3-15-3 Inaho, Otaru City, Hokkaido", "feature": "\u2b50 4.6 stars | Tucked away next to the JR elevated tracks, this historic sushi restaurant earned a Michelin one-star rating. Demonstrating true master craftsmanship, the chef brushes each piece of nigiri with custom soy sauce or sprinkles fine rock salt according to the unique character of the seafood. Hokkaido Ezo abalone is meticulously braised to silky tenderness, while the local bafun sea urchin melts effortlessly. With intimate counter service and breathtaking flavor balance, this small gem is a sought-after culinary landmark that requires booking far in advance.", "name": "Ise Zushi", "transport": "About a 7-minute walk from JR Otaru Station"}, {"address": "2-5-11 Inaho, Otaru City, Hokkaido", "feature": "\u2b50 4.4 stars | Highly recommended by locals, this classic izakaya and seafood restaurant sources fresh catches daily from local markets while keeping prices amazingly affordable. The must-try \u0027Uomasa Nigiri\u0027 set is generous in portion and comes with a complimentary pot of piping-hot, rich seafood broth served teapot-style (dobin mushi). Another crowd favorite is the baked buttered potato with squid sauce\u2014fluffy potato melting with rich butter and savory squid flavor, offering incredible depth and a heartwarming taste of authentic Otaru hospitality.", "name": "Uomasa", "transport": "About a 5-minute walk from JR Otaru Station"}, {"address": "1-1-6 Inaho, Otaru City, Hokkaido", "feature": "\u2b50 4.1 stars | Situated on Otaru Sushi Street, this renowned institution has preserved classic Edomae sushi craftsmanship for decades. Selecting seasonal seafood caught near Otaru\u2014especially autumn herring and botan shrimp\u2014the sushi features plump, resilient textures and rich natural fats. The master chef shapes the vinegared rice with perfect gentle pressure so it effortlessly dissolves on your tongue. Complemented by house-made pickled ginger and savory soy sauce, every bite reflects the rich legacy of a time-honored sushi house.", "name": "Nihonbashi Otaru Main Store", "transport": "About a 9-minute walk from JR Otaru Station"}, {"address": "1-1-6 Ironai, Otaru City, Hokkaido", "feature": "\u2b50 4.2 stars | Housed in a historic 1912 stone building that was formerly the Hokkaido Bank Head Office, this famous Western-style restaurant flawlessly blends Otaru\u0027s wine culture with classic Western cuisine. The signature \u0027Hokkaido Cheese Fondue\u0027 features rich cheese made from fresh local milk, served with crispy homemade bread and sweet seasonal vegetables that leave a luscious, lingering taste. Pair it with tender, succulent red-wine beef stew\u2014where savory beef fat and subtle wine acidity blend into unforgettable flavor\u2014making it an exceptional place to experience Otaru\u0027s heritage and timeless culinary art.", "name": "Otaru Bine
