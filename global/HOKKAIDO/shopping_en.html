        const dbData = {"asahikawa_zoo": {"categories": {"cat_1": {"items": [{"address": "1704-12, 9-chome, 4-jodori, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Tsuruha-exclusive Horse Oil Moisturizing Cream, Hokkaido-exclusive LuLuLun Lavender Face Masks, Shiseido counter cosmetics value sets. Originating in Asahikawa, Hokkaido, Tsuruha Drug is a famous Japanese retail giant, making this Chuo store an iconic birthplace location. The store stocks an exceptionally complete selection of cosmetics and skincare products, ranging from luxury counter brands to affordable drugstore items. It offers comprehensive tax-free services and Chinese-speaking shopping assistance for foreign tourists, making it the top choice for drugstore shopping in Asahikawa.", "name": "Tsuruha Drug Asahikawa Chuo Store", "transport": "Approx. 8-minute walk from JR Asahikawa Station"}, {"address": "1F AEON MALL Asahikawa Ekimae, 7-chome 2-5 Miyashitadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Satsudora in-house Horse Oil Moisturizing Cream, Hokkaido Lavender Soothing Bath Salts, Ultra-Hydrating Hand Cream. Satsudora is Hokkaido\u0027s most iconic local drugstore chain. The Ekimae store features a bright, spacious layout with wide aisles perfect for shopping while wheeling luggage. The highlight here is its rich array of Hokkaido-exclusive skincare products made with local natural botanical ingredients\u2014many of which can only be bought in Hokkaido\u2014all at very wallet-friendly prices.", "name": "Satsudora Asahikawa Ekimae Store", "transport": "Directly connected to JR Asahikawa Station, approx. 1-minute walk"}, {"address": "Inside Asahikawa Tourism and Local Products Center, 8-chome 3-1 Miyashitadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: 100% Pure Horse Oil High-Moisture Essence Cream, Natural Lavender Horse Oil Hand Cream, Horse Oil High-Moisture Lip Balm. Hokkaido Jun Mayu Honpo is a renowned local natural skincare brand in Hokkaido, focusing on premium horse oil free of added fragrances and artificial colors. The Asahikawa store provides samples of various horse oil textures specifically suited for dry skin in cold climates. Its lightweight, fast-absorbing feel overturns the traditional sticky perception of horse oil, making it immensely popular among female travelers.", "name": "Hokkaido Jun Mayu Honpo Asahikawa Branch", "transport": "Approx. 1-minute walk inside JR Asahikawa Station"}, {"address": "Inside Heiwa Dori Kaimono Koen, 8-chome, 1-jodori, Asahikawa, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buy List: Natural Peppermint Essential Oil Spray, Peppermint Deep Moisture Hand Cream, Peppermint Cooling Lip Balm. Kitami Peppermint is Hokkaido\u0027s most representative century-old natural herbal brand, highly popular at its shop in Asahikawa Heiwa Dori Kaimono Koen. Using natural mint essential oils blended with moisturizing skin formulas, its products relieve dryness while delivering a refreshingly aromatic experience\u2014making them fantastic, authentic Hokkaido skincare souvenirs.", "name": "Kitami Peppermint Oil Asahikawa Counter", "transport": "Approx. 3-minute walk from JR Asahikawa Station"}, {"address": "Kaimono Koen Street, 8-chome, 2-jodori, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: TWANY limited high-moisture serum, Decort\u00e9 Liposome Moisture Serum, Local Hokkaido Sake Lees Face Wash. Operating in Asahikawa for many years as an independent cosmetics boutique, HIKARI is located on the historic Kaimono Koen pedestrian street. Beyond offering top Japanese department store brands like Shiseido and Kanebo, veteran local beauty advisors provide one-on-one skin analysis and skincare advice, attracting locals and travelers seeking personalized skincare routines.", "name": "Cosmetics House HIKARI Asahikawa", "transport": "Approx. 5-minute walk from JR Asahikawa Station"}, {"address": "7-chome 2-5 Miyashitadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: ARGELAN Organic Deep Hydration Lip Balm, BLANC WHITE Whitening Essence, Kao Steam Eye Mask Hokkaido Limited Edition. Located in the core commercial area in front of Asahikawa Station, this Matsumoto Kiyoshi brings together the most popular trendy cosmetics and Japan-exclusive health supplements. The store frequently offers exclusive discounts and store-limited collaboration cosmetics, along with a top-trending cosmetics ranking area so visitors can quickly pick up Japan\u0027s hottest seasonal makeup and skincare items.", "name": "Matsumoto Kiyoshi Asahikawa Ekimae Store", "transport": "Approx. 2-minute walk from JR Asahikawa Station"}, {"address": "2F AEON MALL Asahikawa Ekimae, 7-chome 2-5 Miyashitadori, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Hokkaido Otokoyama Sake Lees Face Mask, CANMAKE Marshmallow Finish Powder Hokkaido Limited Packaging, EXCEL Real Clothes Shadow. Located inside AEON MALL, Cosme Palette is a curated cosmetics boutique specializing in popular Japanese drugstore makeup beloved by young people. The store\u0027s tester area is spacious and well-lit, stocked with high-CP-value drugstore cosmetics, organic skincare products, and local Hokkaido-exclusive face masks, offering a fantastic shopping experience.", "name": "Cosme Palette AEON MALL Asahikawa Ekimae", "transport": "Directly connected to JR Asahikawa Station, approx. 1-minute walk"}, {"address": "East Gate Souvenir Shop inside Asahiyama Zoo, Kuranuma, Higashiasahikawa-cho, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Asahiyama Zoo Polar Bear Hydrating Sheet Mask, Hokkaido Fresh Milk Repairing Hand Cream, Penguin Limited Edition Horse Oil Lip Balm. Located in the souvenir shop inside Asahiyama Zoo, this cosmetics corner perfectly combines local Hokkaido skincare ingredients with adorable animal branding. The exclusive moisturizing creams and themed sheet masks feature ingredients like Furano lavender essential oil and Hokkaido milk extracts, packaged with cute prints of the zoo\u0027s star animals\u2014making them dreamy souvenirs that are both practical and memorable.", "name": "Asahiyama Zoo Shop Cosmetic Corner", "transport": "Take Asahikawa Electric Railway bus from JR Asahikawa Station to Asahiyama Zoo, approx. 40 minutes"}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "1-8, Toyooka 12-jo 1-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: Hokkaido-exclusive cold-weather windbreakers, professional snow-grip boots, waterproof outdoor crossbody bags. Spray is an iconic local shop in Asahikawa for outdoor gear and trendy apparel, rooted in the area for many years. The store brings together various extreme sports brands and high-performance, ultra-warm clothing designed for Hokkaido\u0027s harsh climate\u2014highly recommended by local skiers and outdoor enthusiasts.", "name": "Outdoor \u0026 Snowboard Shop Spray Asahikawa", "transport": "Take a bus from JR Asahikawa Station for about 15 minutes, get off at \u0027Toyooka 12-jo 1-chome\u0027 stop, and walk for 1 minute."}, {"address": "3-487-7 Taisetsu-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade dyed canvas tote bags, traditional Happi coats, embroidered Tairyo-batan accessories. Founded in 1907 (Meiji 40), this century-old local dye shop specializes in traditional Japanese dyed textiles. Beyond booking indigo-dyeing workshops, visitors love their handmade printed canvas bags, Japanese-style clothing, and unique accessories\u2014all infused with the warm craftsmanship of Hokkaido artisans.", "name": "Mizuno Some Koujou Asahikawa Main Store", "transport": "Take a bus from JR Asahikawa Station, get off at \u0027Taisetsu-dori 3-chome\u0027 stop, and walk for about 3 minutes."}, {"address": "1F AEON MALL Asahikawaeimae, 7-2-5 Miyashita-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.7 stars | Must-buy list: Saddle leather luxury briefcases, handmade genuine leather bi-fold wallets, horseshoe-shaped leather keychains. SOM\u00c8S SADDLE is Hokkaido\u0027s premier imperial-grade saddlery and luxury leather goods brand, featuring a shop right in front of Asahikawa Station. Incorporating master saddlery stitching techniques into stylish leather bags and accessories, their durable products develop a rich patina over time, highly praised by local connoisseurs.", "name": "SOM\u00c8S SADDLE Asahikawa Store", "transport": "Directly connected to JR Asahikawa Station, located on the 1st floor of AEON MALL Asahikawaeimae."}, {"address": "Kaimono Koen, 1-jo-dori 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | Must-buy list: Hokkaido-grade anti-slip snow boots, comfortable Japanese-made genuine leather walking shoes, high-performance waterproof tall boots. Located along Asahikawa\u0027s Heiwa-dori Shopping Park, this long-standing local shoe shop specializes in footwear designed to conquer severe cold and icy ground. Uncompromising on comfort and ice traction, it is the trusted choice for locals buying winter non-slip footwear.", "name": "Kutsu no Murata Heiwa-dori Store", "transport": "About a 5-minute walk from the North Exit of JR Asahikawa Station."}, {"address": "Kaimono Koen, 2-jo-dori 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Top-grade Japanese PORTER crossbody bags, local artisan collaboration wallets, durable business luggage. Operating locally for decades, this established bag specialty store brings together Made-in-Japan goods and high-quality domestic leather brands. From commuter totes and casual backpacks to suitcases, it has built an outstanding reputation in Asahikawa for warm, helpful service and reliable after-sales support.", "name": "Watanabe Bag Shop Asahikawa", "transport": "About a 6-minute walk from the North Exit of JR Asahikawa Station."}, {"address": "Kaimono Koen, 3-jo-dori 8-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | Must-buy list: Japanese streetwear oversized long-sleeve tees, stylishly tailored cargo pants, designer leather pouches. A boutique select store established in Asahikawa\u0027s shopping district for years, bringing in the latest domestic and international trends in casual wear and streetwear accessories. With its distinctive industrial-style decor, it is a go-to shop for young locals and stylish individuals seeking unique fashion.", "name": "JAY-PI Fashion Select Asahikawa Kaimono Koen Store", "transport": "About an 8-minute walk from the North Exit of JR Asahikawa Station."}, {"address": "1615-1, 5-jo-dori 7-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Independent designer knitwear, wool-blend scarves, handmade earrings and accessories. Moonloom is an independent fashion boutique beloved by local women in Asahikawa, focusing on fresh, natural, and sophisticated chic styles. Carefully curated by the owner, items include daily apparel from Japanese independent brands, embroidered bags, and warm, distinct accessories that stand out from mass market fashion.", "name": "Moonloom Boutique Asahikawa", "transport": "About a 12-minute walk from the North Exit of JR Asahikawa Station."}, {"address": "4-jo-dori 15-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy list: Bespoke handmade genuine leather shoes, orthopedic leather footwear, leather nourishing oil. Kajita Shoe Store is a highly regarded local treasure in Asahikawa specializing in custom leather boots and professional footwear repair. Renowned for meticulous handcrafted fitting adjustments and high-grade leather boots, many local customers come specifically to order exquisite shoes built to last for years.", "name": "Kajita Shoe Store", "transport": "Take a bus from JR Asahikawa Station, get off at \u00274-jo 15-chome\u0027 stop, and walk for 2 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "1-9, Kaguraoka 8-jo 1-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: \u0027Kurasama\u0027 soft raw chocolate cookies, apple pie, and kiln-baked cheese puffs. Housed in a renovated stone warehouse, this hugely popular local confectionery shop is one of Asahikawa\u0027s most iconic dessert brands. The flagship \u0027Kurasama\u0027 soft cookies are made with Hokkaido wheat and fermented butter, featuring a soft exterior wrapped around a rich, molten chocolate center. With a unique texture that\u0027s sweet without being cloying, it is a top-tier souvenir you cannot miss when visiting Asahikawa.", "name": "The Sun Kuramoto Main Store (The Sun \u8535\u4eba \u672c\u5e97)", "transport": "Take a bus from JR Asahikawa Station for about 10 minutes to \u0027Kaguraoka 8-jo 1-chome\u0027 bus stop; located right by the stop."}, {"address": "2182-103, Minami 6-jo Dori 19-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: \u0027Kibana\u0027 almond galettes, wood-grain Baumkuchen, and seasonal fruit tarts. Founded in 1929, Tsuboya is a legendary Asahikawa confectionery maker, and \u0027Kibana\u0027 is a flagship souvenir that has won the Monde Selection Gold Award for multiple consecutive years. Inspired by diamond dust, this treat features crispy almond galettes sandwiching rich white chocolate. The store offers an elegant forest-like atmosphere where you can watch the baking process through glass windows.", "name": "Tsuboya Sohonten Kibana no Mori (\u58fa\u5c4b\u7e3d\u672c\u5e97 \u304d\u82b1\u4e4b\u68ee)", "transport": "Take a bus from JR Asahikawa Station for about 12 minutes to \u0027Minami 6-jo Dori 18-chome\u0027 bus stop, then walk for 3 minutes."}, {"address": "1-33, Nagayama 2-jo 7-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: Otokoyama Junmai Daiginjo, Otokoyama sake chocolates, and sake lees rice crackers. Otokoyama is an internationally renowned sake brand from Asahikawa. The museum gift shop offers exclusive limited-edition sake available only on-site, along with special themed souvenirs. Highly recommended are the sake-infused chocolates and rice crackers with a rich rice aroma\u2014delightful snacks for both sake enthusiasts and non-drinkers alike.", "name": "Otokoyama Sake Brewery Museum Gift Shop (\u7537\u5c71\u9152\u9020\u8cc7\u6599\u9928 \u8ce3\u5e97)", "transport": "Take a Dohoku Bus from JR Asahikawa Station for about 20 minutes to \u0027Nagayama 2-jo 6-chome\u0027 stop, then walk for 3 minutes."}, {"address": "Kuranuma, Higashi-asahikawa-cho, Asahikawa, Hokkaido (Inside Asahiyama Zoo East Gate)", "feature": "\u2b50 4.2 stars | Must-buy list: Polar bear butter cookies, zoo-exclusive Asahikawa soy sauce ramen gift boxes, and penguin milk candies. Located inside Asahiyama Zoo, this shop specializes in themed sweets and gifts featuring the zoo\u0027s star animals. The exclusively packaged butter cookies feature adorable penguin and polar bear designs made with high-quality local Hokkaido dairy\u2014equally cute and delicious, making them ideal souvenirs for family and friends back home.", "name": "Asahiyama Zoo Club East Gate Shop (\u65ed\u5c71\u52d5\u7269\u5712\u4ff1\u6a02\u90e8 \u6771\u9580\u8ce3\u5e97)", "transport": "Take the Asahikawa Electric Railway Bus from Bus Stop No. 6 at JR Asahikawa Station for about 40 minutes to \u0027Asahiyama Zoo\u0027 stop."}, {"address": "1-15, Kaguraoka 8-jo 2-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Marusei Butter Sandwich cookies, freeze-dried strawberry white chocolates, and Yukiyakonko (frost cookies). Located in Kaguraoka, this branch of Hokkaido dessert giant Rokkatei boasts lush green surroundings and a cozy caf\u00e9 seating area. The iconic Marusei Butter Sandwich is made with 100% Hokkaido raw milk butter, premium flour, and raisins for an incredibly rich flavor\u2014a must-have delicious treat for every traveler\u0027s suitcase.", "name": "Rokkatei Kaguraoka Store (\u516d\u82b1\u4ead \u795e\u6a02\u5ca1\u5e97)", "transport": "Take a bus from JR Asahikawa Station for about 10 minutes to \u0027Kaguraoka 8-jo 2-chome\u0027 bus stop, then walk for 2 minutes."}, {"address": "418-4, Taisetsu-dori 14-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: \u0027Sanpouroku\u0027 white birch log cake (Baumkuchen), red bean butter sandwich cookies, and rich cheese tarts. Hailing from Tokachi, historic confectionery Ryugetsu has a fully stocked branch on Taisetsu-dori. Its signature \u0027Sanpouroku\u0027 Baumkuchen recreates white birch bark using milk and white chocolate; it is moist, dense, and perfectly sweet, making it a top choice souvenir to share with friends and family.", "name": "Ryugetsu Taisetsu-dori Store (\u67f3\u6708 \u65ed\u5ddd\u5927\u96ea\u901a\u5e97)", "transport": "Take a bus from JR Asahikawa Station for about 15 minutes to \u0027Taisetsu-dori 14-chome\u0027 bus stop; located right by the stop."}, {"address": "Hidari 1, 4-jo Dori 13-chome, Asahikawa, Hokkaido", "feature": "\u2b50 4.1 stars | Must-buy list: Vitamin Castella, retro honey sponge cake, and traditional Asahikawa senbei crackers. Founded in the Taisho era, Takahashi Seika is a historic local confectionery in Asahikawa whose \u0027Vitamin Castella\u0027 is a beloved soul dessert known to every household in Hokkaido. Soft and rich in nutritional value, this cake offers subtle old-school honey and egg aromas, oozing local character and nostalgic charm.", "name": "Takahashi Seika Direct Store (\u9ad8\u6a4b\u88fd\u679c \u76f4\u71df\u9580\u5e02)", "transport": "Walk about 15 minutes from JR Asahikawa Station, or take a city bus to \u00274-jo Dori 12-chome\u0027 stop and walk for 2 minutes."}, {"address": "8-3-1 Miyashita-dori, Asahikawa, Hokkaido (Inside JR Asahikawa Station)", "feature": "\u2b50 4.2 stars | Must-buy list: Famous Asahikawa ramen gift packs (Aoba/Hachiya), Asahikawa soy sauce rice crackers, and Hokkaido melon sandwich cookies. Located inside the JR Asahikawa Station concourse, this store gathers the most comprehensive collection of local specialties and souvenirs from Asahikawa and surrounding areas. Notably featuring dried noodle sets from Asahikawa\u0027s top four ramen joints and soy sauce crackers crafted from premium local rice, it offers a convenient one-stop shop for last-minute souvenir shopping before departure.", "name": "Asahikawa Station Souvenir Shop Amo (\u65ed\u5ddd\u5730\u7522\u5730\u6d88\u7269\u7522\u9928 \u963f\u7f85\u6469)", "transport": "Located inside the JR Asahikawa Station concourse, accessible immediately upon exiting the ticket gates."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "7-2-5 Miyashita-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Rokkatei liqueur candies, Asahikawa soy sauce ramen gift sets, Hokkaido-exclusive moisturizing horse oil cream. Directly connected to JR Asahikawa Station, this is the largest comprehensive shopping mall in downtown Asahikawa. The complex houses a wide variety of Japanese trendy fashion, daily lifestyle goods, and a large supermarket. For travelers visiting Asahikawa, it is extremely convenient not only for buying souvenirs, but also offers a vibrant dining street and tax-free service counters, making it the perfect spot to stock up before or after your train ride.", "name": "AEON MALL Asahikawa Ekimae", "transport": "Directly connected to JR Asahikawa Station, about a 1-minute walk"}, {"address": "8-108 1-jo-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.0 stars | Must-Buy List: Hokkaido handmade scented moisturizing cream, Junkudo limited stationery gift sets, Asahikawa fine wood craft goods. Located in the heart of the Kaimono Kouen Shopping Street, this long-standing local landmark department store has transformed into a trendy hub full of artisanal and local charm. The basement features a popular fresh food and dessert street, while the upper floors house a large bookstore and local lifestyle brands, making it a favorite among locals and travelers seeking unique, original products.", "name": "Feeeal Asahikawa", "transport": "About a 3-minute walk from JR Asahikawa Station"}, {"address": "2-1-10 Nagayama 10-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Asahikawa solid wood tableware, handmade carved wooden animal figurines, Hokkaido wood grain incense burners. As one of Japan\u0027s most iconic woodworking hubs, Asahikawa hosts this design center bringing together over 30 local independent wooden craft brands and artisan workshops. The facility displays and sells elegant lifestyle furniture, handcrafted wooden accessories, and fine crafts, making it a top-tier destination for selecting heirloom-quality local souvenirs.", "name": "Asahikawa Design Center", "transport": "About a 15-minute bus or taxi ride from JR Asahikawa Station"}, {"address": "6-1-7 Chuwa 5-jo, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: \"KIBANA\" almond galette cookies, Asahikawa handmade ceramic cups, Hokkaido mandarin orange snacks. Tsuboya is a legendary local confectionery shop in Asahikawa with a rich history. Its flagship store, RAMOTTO, seamlessly blends local culture, curated lifestyle goods, and premium traditional sweets. In addition to must-buy award-winning cookies, the store features a dedicated area for local crafts and goods, popular with tourists seeking authentic Hokkaido flavors.", "name": "Tsuboya Sohonten RAMOTTO", "transport": "About a 10-minute taxi ride from JR Asahikawa Station, or take the Engan Bus to Chuwa 5-jo 6-chome bus stop"}, {"address": "8-3-1 Miyashita-dori, Asahikawa, Hokkaido (Inside JR Asahikawa Station)", "feature": "\u2b50 4.1 stars | Must-Buy List: Otokoyama Junmai Daiginjo sake, Asahiyama Zoo limited edition wooden carvings, Asahikawa soy sauce rice crackers. Located inside JR Asahikawa Station, this specialty souvenir store gathers the most representative local agricultural products and artisanal crafts from independent brands across Asahikawa and the surrounding Daisetsuzan region. Offering a comprehensive selection focused strictly on Hokkaido products, it is an ideal spot for picking up unique regional gifts.", "name": "Asahikawa Local Products Center AMO", "transport": "Inside JR Asahikawa Station building, accessible directly from the station concourse"}, {"address": "9-50-3 1-jo-dori, Asahikawa, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Outlet-discounted down jackets, ultra-lightweight windproof folding umbrellas, Hokkaido-exclusive bear logo T-shirts. Serving as the gateway to hiking in Hokkaido\u0027s Daisetsuzan National Park, Asahikawa houses this Mont-bell flagship store with a great Factory Outlet section. Visitors can purchase end-of-season or discontinued outdoor gear, thermal apparel, and lifestyle items at attractive discount prices, making it an unmissable shopping spot for outdoor enthusiasts.", "name": "Mont-bell Club Asahikawa Store (Factory Outlet)", "transport": "About a 5-minute walk from JR Asahikawa Station"}, {"address": "23-2161-3 Midorimachi, Asahikawa, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: KALDI Hokkaido-exclusive coffee beans, discounted clearance apparel from Japanese brands, pure Hokkaido horse oil moisturizing cream. As the largest suburban shopping center in Asahikawa, this mall features dozens of Japanese fashion brand outlet shops and large affordable lifestyle stores. Compared to downtown malls, it offers a wider selection of brands and frequent major seasonal discounts, perfect for visitors looking for extensive shopping and everyday essentials.", "name": "AEON MALL Asahikawa Nishi", "transport": "About a 20-minute ride via direct bus route from JR Asahikawa Station"}, {"address": "3-7-6 Omagari Saiwai-cho, Kitahiroshima, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: BEAMS discounted trench coats, Mont-bell outdoor functional wear, adidas sneakers. As the largest all-weather indoor outlet mall in Hokkaido, this shopping paradise is a perfect stop on an itinerary connecting Asahikawa with Sapporo or New Chitose Airport. Housing over a hundred famous international and Japanese brands offering year-round discounts of 30% to 70% off, along with Hokkaido specialty food stores and a food court, it is a highly recommended shopping stop to add before or after visiting Asahikawa.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "Take a limited express train from JR Asahikawa Station to Sapporo Station, then transfer to a direct Outlet bus; or drive about 1.5 hours via the Do-O Expressway"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Downtown Asahikawa and Asahiyama Zoo"}, "furano_biei": {"categories": {"cat_1": {"items": [{"address": "Kisen Kita 15-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Farm Tomita Pure Natural Lavender Essential Oil, Special Lavender Horse Oil Hand Cream, Natural Handmade Lavender Soap. As Furano\u0027s most iconic flower estate, its self-distilled lavender essential oil and skincare products are local exclusives. Loved by tourists for their pure, natural restorative qualities.", "name": "Farm Tomita Cosmetics Shop", "transport": "About a 7-minute walk from JR Lavender Farm Station (Lavender-Batake Station)"}, {"address": "6-1 Okamachi, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Saika no Sato Exclusive Lavender Hydrating Mist, Lavender Soothing Night Cream, Floral Bath Salts. Located on a picturesque hill, Saika no Sato highlights high-quality floral water distillations with superb moisturizing and repair effects\u2014a hidden gem for botanical fragrance lovers.", "name": "Saika no Sato Lavender Beauty Shop", "transport": "About a 20-minute walk or a 5-minute taxi ride from JR Naka-Furano Station"}, {"address": "2-Chome Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Biei Red Bean Skin-Beautifying Scrub, Biei Agricultural Botanical Lip Balm, Hill Floral Body \u0026 Face Oil. In addition to premium local farm produce, Biei Senka\u0027s curated beauty section blends Biei-grown crops with botanical extracts to offer unique local skincare products reflecting Biei\u0027s rich terroir.", "name": "Biei Senka Beauty Corner", "transport": "About a 10-minute walk from JR Biei Station"}, {"address": "Mibano-toge, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Natural Gromwell \u0026 Lavender Multi-Purpose Balm, Handmade Herbal Essential Oil Soap, Lavender Facial Hydrating Gel. Cultivating dozens of flowers and herbs, Kanno Farm creates low-additive, natural skincare celebrated for its rich botanical aromas and gentle soothing properties.", "name": "Kanno Farm Herbal Cosmetics Shop", "transport": "About a 15-minute walk from JR Bibaushi Station"}, {"address": "Miyama-toge, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Miyama Pass Special Lavender Pillow Spray, Hokkaido Birch Sap Hydrating Mask, Lavender Deodorant Balm. Situated at a spot with breathtaking panoramic views of the Tokachi Mountain Range, this shop offers original skincare products formulated with Hokkaido birch sap and lavender extracts.", "name": "Miyama Pass Lavender Shop", "transport": "About a 10-minute drive or bus ride from JR Kami-Furano Station"}, {"address": "Nishi 5-sen Kita 27-go, Kamifurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Garden-Exclusive Lavender Essential Oil Shampoo, Lavender Soothing Foot Patches, Lavender Body Lotion. Set within a vast floral estate, this large shop features house-brand beauty and bath products known for their elegant, natural fragrance, making them wildly popular among domestic and international visitors alike.", "name": "Flower Land Kamifurano Beauty Shop", "transport": "About a 10-minute drive from JR Kami-Furano Station"}, {"address": "1-26 Katsuragi-cho, Furano-shi, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Liferee Hokkaido Horse Oil Moisturizing Cream, Lavender Brightening Sheet Mask, Hokkaido Premium Herbal Skincare Series. Hokkaido\u0027s flagship drugstore chain features a dedicated area at the Furano branch for regional exclusive beauty goods from Furano and Biei. Enjoy spacious, tax-free shopping.", "name": "Satsudora Furano Store", "transport": "About a 7-minute drive or local bus ride from JR Furano Station"}, {"address": "1-32 Asahi-machi, Furano-shi, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Tsuruha Exclusive Hokkaido High-Purity Horse Oil, Lavender Mosquito Repellent Patches, Ultra-Hydrating Medicated Cream. A leading Hokkaido-born drugstore chain stocking an extensive selection of cosmetics, skincare, and health supplies. It\u0027s an ideal stop to stock up on all your drugstore and local skincare essentials.", "name": "Tsuruha Drug Furano Store", "transport": "About a 5-minute walk from JR Furano Station"}], "name": "Local Iconic Beauty \u0026 Drugstore Products"}, "cat_2": {"items": [{"address": "27-4 Kitanomine-cho, Furano, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Waterproof \u0026 windproof snow jackets, professional hiking shoes, branded collab warm beanies. A hugely popular outdoor apparel store near Kitanomine Ski Resort, featuring many international and domestic Japanese polar outdoor brands. Providing professional styling advice as well as functional footwear and bags, it is a top apparel choice for locals and tourists exploring Furano\u0027s mountains or going skiing.", "name": "Rhythm Furano - Outdoor \u0026 Snow Apparel", "transport": "Approx. 10 mins by bus or taxi from JR Furano Station"}, {"address": "Nakagoryo, Furano, Hokkaido (Within New Furano Prince Hotel grounds)", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-stitched leather tote bags, carved handmade leather shoes, lavender-dyed leather coin purses. Tucked away in the cozy wooden village next to New Furano Prince Hotel, this artisan leather shop is renowned for exquisite craftsmanship. Every piece here is a unique, warm-textured, durable leather creation highly favored by travelers seeking authentic local touch.", "name": "Ninguru Terrace - Kaze no Ie Leather Craft", "transport": "Take the \u0027Lavender Bus\u0027 from JR Furano Station for about 18 mins, get off at New Furano Prince Hotel, then walk 3 mins"}, {"address": "1-30 Asahimachi, Furano, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Furano-exclusive print quick-dry T-shirts, ultra-lightweight down jackets, GORE-TEX waterproof hiking shoes. A signature store of Japan\u0027s iconic outdoor brand located in Furano, offering a rich selection of casual apparel, footwear, and bags. Highly recommended are the limited-edition tees featuring Hokkaido brown bears and Furano flower fields\u2014functional apparel with great souvenir value.", "name": "Mont-bell Furano Store", "transport": "Approx. 5 mins walk from JR Furano Station"}, {"address": "3-4 Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Biei hills exclusive embroidered canvas bags, farm-style heavy cotton work shirts, handmade suede crossbody bags. Beyond local agricultural produce, Biei Senka features an apparel selection area supporting local creators. Highlighting handmade canvas bags and minimalist clothing inspired by Biei\u0027s countryside scenery, the items boast durable fabrics and rich Hokkaido pastoral aesthetics.", "name": "Biei Senka Main Store - Apparel \u0026 Goods Corner", "transport": "Approx. 10 mins walk from JR Biei Station"}, {"address": "Misawa Kyoei, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buy List: Patchwork-design handmade leather bags, botanically-dyed linen dresses, hand-stitched leather loafers. A small independent fashion workshop located in the picturesque Biei hills. The designer infuses color inspirations from Biei\u0027s Patchwork Hills into apparel, footwear, and bags. Utilizing natural dyes and premium leather, it is beloved by hipster shoppers seeking unique independent designs.", "name": "Craft Studio Ramu Biei", "transport": "Approx. 15 mins drive or taxi ride from JR Biei Station"}, {"address": "13-1 Saiwaicho, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Lavender field series canvas bags, original Hokkaido UV-cut sun hats, locally woven linen slip-on shoes. A boutique clothing section inside the Furano Marche commercial complex, featuring casual wear and bags from independent local brands around Furano. Most items use breathable, comfortable linen and pure cotton, making them perfect to wear while strolling through flower fields in summer.", "name": "Furano Marche 2 - Lifestyle \u0026 Boutique", "transport": "Approx. 7 mins walk from JR Furano Station"}, {"address": "14-22 Kitanomine-cho, Furano, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Extreme-cold anti-slip snow boots, windproof \u0026 water-resistant functional waist packs, warm wool gloves. A curated store specializing in clothing, footwear, and bags suited for Furano\u0027s severe cold and unpredictable weather. Bringing in local Japanese warm boots and windproof gear, it offers high-quality choices whether you need winter snow boots or summer lightweight hiking backpacks.", "name": "North Snow Furano - Snow \u0026 Casual Select Shop", "transport": "Take a bus from JR Furano Station to \u0027Kitanomine Iriguchi\u0027 stop, then walk 2 mins"}, {"address": "12-1 Yamabe Kitamachi, Furano, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Handwoven wool shawls and scarves, classic handmade plant-dyed tote bags, local hand-knit shoes. A traditional studio preserving local Furano weaving techniques, specializing in clothing accessories meticulously hand-crafted stitch by stitch by master artisans. The wool products are extremely warm and soft, while the handmade fabric bags feature elegant Japanese countryside textures, making them very popular among mature women.", "name": "Furano Textile \u0026 Craft Studio", "transport": "Approx. 8 mins walk from JR Yamabe Station"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Nakagoryo, Furano, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Squid Ink Black Cheese, Fresh Furano Milk, Handmade Cheese Spread. A signature dairy processing factory in Hokkaido, using fresh local milk to create rich, smooth flavors. The facility offers samples of their uniquely developed squid ink cheese, as well as limited daily fresh cheese products, making it a must-visit local specialty spot for tourists in Furano.", "name": "Furano Cheese Factory", "transport": "About a 10-minute drive from JR Furano Station, or take the \u0027Lavender Bus\u0027 to Shin Furano Prince Hotel Stop and walk for 15 minutes."}, {"address": "Kisen Kita 15-go, Nakafurano-cho, Sorachi-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Pure Natural Lavender Essential Oil, Handmade Lavender Soap, Dried Lavender Bouquet. Located at the heart of Furano\u0027s most famous lavender fields, their world-renowned fragrance lineup is made from self-cultivated lavender, offering a light, elegant, and natural scent. These make for quintessential local original souvenirs.", "name": "Farm Tomita Shop Hanabito", "transport": "About a 7-minute walk from JR Lavender Farm Station (seasonal summer station), or a 25-minute walk from JR Naka-Furano Station."}, {"address": "3 Higashirokugo, Furano, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Haskap Berry Jam, Furano Melon Jam, Handmade Sweet Corn Jam. Upholding traditional craftsmanship with zero artificial colors or preservatives, high-quality Hokkaido fruits and crops are slow-cooked into pure jam. The venue features a tasting section with dozens of jam varieties, making it immensely popular with dessert lovers.", "name": "Furano Jam Garden", "transport": "About a 20-minute taxi or sightseeing bus ride from JR Furano Station."}, {"address": "Nakagoryo, Furano, Hokkaido (On the grounds of Shin Furano Prince Hotel)", "feature": "\u2b50 4.4 stars | Must-Buy List: Snowflake Paper-Cut Ornaments, Forest Kaleidoscopes, Handmade Wooden Branch Puppets. A fairytale-like wooden craft village nestled in a coniferous forest. Resident local artists create high-quality wooden crafts and cozy handmade items imbued with Furano\u0027s forest spirit, making them unique and collectible.", "name": "Ningle Terrace Craft Shops", "transport": "Take the \u0027Lavender Bus\u0027 from JR Furano Station and get off at Shin Furano Prince Hotel Stop."}, {"address": "Shimizuyama, Furano, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Furano Red Wine, Furano Fruity White Wine, Non-Alcoholic 100% Pure Grape Juice. Leveraging Furano\u0027s unique basin climate and fertile soil, this facility produces exceptional locally grown wines with rich, smooth flavors. Both alcoholic wines and pure grape juice are highly acclaimed local specialties.", "name": "Furano Wine Factory", "transport": "About an 8-minute drive or taxi ride from JR Furano Station."}, {"address": "13-1 Saiwaicho, Furano, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Furano-Exclusive Potato Chips, Haskap Sandwich Cookies, Furano Cream Cheese Tarts. The largest agricultural and souvenir hub in the Furano area, featuring a huge variety of processed and packaged local farm goods from Furano and surrounding regions. It is the ultimate one-stop shopping destination for tourists looking for local snacks and treats.", "name": "Furano Marche", "transport": "About a 7-minute walk from JR Furano Station."}, {"address": "3-chome Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Freeze-Dried Biei Sweet Corn Kernels, Biei Fresh Milk Pudding, Biei Wheat Rusks. A refined specialty market directly operated by JA Biei, specializing in transforming Biei\u0027s premium crops into boutique gift items. The sweet corn kernels, preserved using flash freeze-drying technology to retain their incredible sweetness, are a wildly popular snack across Japan.", "name": "Biei Senka", "transport": "About a 10-minute walk from JR Biei Station."}, {"address": "18-go Omachi, Biei-cho, Kamikawa-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Butter Cheese Sandwich Biscuits, Biei Wheat Condensed Milk Bread, Honey Double Cheese Cake. A famous nature-focused bakery hidden among the hills of Biei. Exclusively using Biei-grown wheat, Biei fresh milk, and Hokkaido fermented butter, their baked goods feature a dense, delicate texture and rich aroma\u2014highly recommended by locals and tourists alike.", "name": "Ferme La Terre Biei", "transport": "About a 5-minute drive or a 20-minute walk from JR Biei Station."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-7-6 Omagari Saiwaicho, Kitahiroshima City, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Mont-bell outdoor functional wear, classic BEAMS Japanese apparel, Nike casual sneakers. This is the top-recommended major outlet center en route to the flower fields of Furano and Biei, featuring over 170 international and popular local Japanese brands. Offering a comfortable all-weather indoor shopping environment, you can purchase outdoor sports gear and Japanese fashion brands at highly attractive discounted prices.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "Approx. 50 mins by direct bus from Sapporo Station; or approx. 30 mins by bus from New Chitose Airport."}, {"address": "13-1 Saiwaicho, Furano City, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Pure concentrated Furano grape juice, handmade Furano cheese spread, soothing lavender bath salts. A local specialty shopping complex located in central Furano City, divided into four themed pavilions. Bringing together farm-fresh top-tier agricultural products, local creative crafts, and delicious souvenirs, it is the premier spot to sample and buy authentic local flavors of Furano.", "name": "Furano Marche", "transport": "Approx. 7-minute walk from JR Furano Station."}, {"address": "Nakagoryo, Furano City, Hokkaido (Within Shin Furano Prince Hotel grounds)", "feature": "\u2b50 4.5 Stars | Must-Buy List: Handmade forest snow scene candles, snowflake paper craft lights, handcrafted wooden elf figurines. A fairytale craft shopping village tucked away in the forest of Shin Furano Prince Hotel, consisting of 15 cozy wooden cabins. Each cabin serves as an independent artisan\u0027s workshop selling one-of-a-kind handicrafts and lifestyle goods, taking on an even more magical atmosphere when illuminated at night.", "name": "Ningle Terrace", "transport": "Take the Lavender Bus from JR Furano Station for approx. 18 mins, get off at Shin Furano Prince Hotel."}, {"address": "2-Chome Omachi, Biei Town, Kamikawa District, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Biei Rusk, Biei-exclusive fresh milk, premium vacuum-dried sweet corn kernels. A complex agricultural sales center operated by the Biei Farmers Association. Set inside a sleek modern building, it features a curated selection of the highest quality local produce and processed foods. Beyond fresh fruits and vegetables, its market section offers popular Biei-exclusive treats and souvenirs.", "name": "Biei Senka", "transport": "Approx. 5-minute walk from JR Biei Station."}, {"address": "7-2-5 Miyashitadori, Asahikawa City, Hokkaido", "feature": "\u2b50 4.2 Stars | Must-Buy List: Rokkatei Marusei Butter Sandwiches, Hokkaido-exclusive snowflake makeup set, Mont-bell Asahikawa limited-edition T-shirt. The largest shopping mall near the Biei and Furano regions, directly connected to JR Asahikawa Station. Bringing together major Japanese chain stores, a large supermarket, and popular Hokkaido souvenir sections, it serves as the primary shopping and restock hub in Northern Hokkaido.", "name": "AEON MALL Asahikawa Ekimae", "transport": "Directly connected to JR Asahikawa Station."}, {"address": "Naka-Goku, Furano City, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Squid ink black cheese, Furano fresh milk gelato, handmade butter DIY kit. A specialty shop focused on fresh local Furano dairy products. It offers rare artisanal cheeses and rich dairy items hard to find elsewhere. Visitors can observe the cheese-making process through glass panels and savor freshly made artisanal gelato and pizza on site.", "name": "Furano Cheese Factory Shop", "transport": "Approx. 10 mins by taxi from JR Furano Station."}, {"address": "Shimizuyama, Furano City, Hokkaido", "feature": "\u2b50 4.1 Stars | Must-Buy List: Furano limited red wine, 100% natural additive-free grape juice, specially crafted red wine jam. A factory-direct retail shop situated on a hilltop in Furano, specializing in premium wines crafted from grapes cultivated in the area\u0027s distinct climate. Featuring a picturesque shopping environment, it offers various limited-edition wines and grape-derived products available for tasting and purchase.", "name": "Furano Winery Sales Store", "transport": "Approx. 8 mins by taxi from JR Furano Station."}, {"address": "Nakagoryo, Furano City, Hokkaido (Within Shin Furano Prince Hotel grounds)", "feature": "\u2b50 4.2 Stars | Must-Buy List: \u0027Yasashii Jikan\u0027 classic pour-over coffee cup, herbal lavender fragrance pillow, original \u0027Kita no Kuni kara\u0027 souvenirs. A classic creative shop themed around famous Japanese TV dramas like \u0027Kita no Kuni kara\u0027 (From the Northern Country) and other Furano trilogy series. The shop architecture recreates a cozy Showa-era store vibe, showcasing exclusive souvenirs and lavender crafts infused with the warmth of rural Hokkaido.", "name": "Furano Drama Kan", "transport": "Take the Lavender Bus from JR Furano Station for approx. 18 mins to Shin Furano Prince Hotel; short walk upon arrival."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Furano and Biei Flower Fields"}, "hakodate_bay": {"categories": {"cat_1": {"items": [{"address": "14-12 Suehirocho, Hakodate, Hokkaido (Inside Kanemori Red Brick Warehouse)", "feature": "\u2b50 4.6 stars | Must-buy list: Pure White Horse Oil Ultra-Moisturizing Cream, Lavender Horse Oil Body Lotion, Horse Oil Repair Lip Balm. Located inside the Kanemori Red Brick Warehouse in Hakodate, this horse oil specialty store represents one of Hokkaido\u0027s iconic natural skincare brands. Focusing on ultra-pure, fragrance-free horse oil products, its deep penetration and exceptional moisturizing effects are loved by both locals and tourists. The store offers plenty of hands-on tester samples. The lavender horse oil cream\u2014infused with essential oils from Furano\u2014absorbs quickly without feeling sticky, effectively soothing dry skin and chapping. It is an absolute must-buy souvenir when visiting the Hakodate Bay Area.", "name": "Hokkaido Horse Oil Honpo Kanemori Red Brick Warehouse Store", "transport": "Approx. 5-minute walk from Hakodate City Tram \u0027Jujigai Station\u0027"}, {"address": "12-12 Toyokawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Hokkaido Lavender Soothing Steam Eye Mask, Satsudora Exclusive Horse Oil Moisturizing Sheet Mask, Hakodate Limited Kelp Brightening Serum. Satsudora (Sapporo Drug Store) is one of Hokkaido\u0027s most iconic home-grown pharmacy chains. Designed with tourists in mind, this Bay Area branch features a spacious, bright, and stylish shopping environment with a massive \u0027Hokkaido Limited Beauty Corner\u0027. Beyond popular drugstores items trending across Japan, the best buys are its private-label skincare products infused with local ingredients, such as the high-value moisturizing line made from Gagome kelp harvested near Hakodate.", "name": "Satsudora Hakodate Bay Area Store", "transport": "Approx. 3-minute walk from Hakodate City Tram \u0027Uoiba-dori Station\u0027"}, {"address": "1F Share Star Hakodate, 24-1 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: LIPS \u0026 HIPS Hokkaido Honey Repair Hand Cream, AYURA Balancing Hydrating Essence, Hakodate Limited Botanical Cleansing Balm. Born in Hokkaido, Ains \u0026 Tulpe is a pioneer in refined Japanese beauty and drugstore retail. Located inside the Share Star landmark in Goryokaku, this branch is a beauty sanctuary for local trendsetters. Blending Hokkaido\u0027s natural botanical elements into modern cosmetics, it features independent beauty brands exclusive to or debuting in Hokkaido. The store boasts a chic interior and offers professional skin analysis, highlighting sensitive-skin products crafted from pure Hokkaido snowmelt water and local plant extracts.", "name": "Ains \u0026 Tulpe Share Star Hakodate Store", "transport": "Right outside Hakodate City Tram \u0027Goryokaku-Koen-mae Station\u0027"}, {"address": "31-8 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Tsuruha Exclusive Medihikari Medicated Brightening Cream, Hokkaido Melon Lip Balm, Premium Horse Oil Deep Moisturizing Cream. Originating in Asahikawa, Tsuruha Drug is a leading drugstore giant with decades of history in Hokkaido. This spacious flagship store near Goryokaku Park carries a comprehensive range of goods, from household medicines to high-end department store cosmetics. It features a dedicated \u0027Hokkaido Limited Beauty Gift Set Area\u0027 filled with unique local skincare items at reasonable prices with frequent discounts\u2014a top spot for both locals and tourists shopping for dermacosmetics.", "name": "Tsuruha Drug Hakodate Goryokaku Store", "transport": "Approx. 2-minute walk from Hakodate City Tram \u0027Goryokaku-Koen-mae Station\u0027"}, {"address": "13-9 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.7 stars | Must-buy list: Gagome Kelp Concentrated Hydrating Serum, Kelp Collagen Sheet Mask, Seaweed Scalp Care Treatment Balm. This unique independent boutique in Hakodate focuses on harnessing the skincare benefits of local Gagome Kelp. Rich in fucoidan and natural mucilage, this rare kelp boasts exceptional moisture-retention and skin-repairing qualities. The shop turns local marine resources into pure, additive-free premium skincare products\u2014a must-visit for clean beauty lovers seeking an authentic coastal beauty experience unique to the Bay Area.", "name": "Hakodate Gagome Kelp Beauty Shop Bay Area", "transport": "Approx. 4-minute walk from Hakodate City Tram \u0027Jujigai Station\u0027"}, {"address": "13-9 Suehirocho, Hakodate, Hokkaido (Inside Kanemori Yobukan)", "feature": "\u2b50 4.5 stars | Must-buy list: Organic Lavender Essential Oil Sleep Spray, Cold-Processed Lavender Horse Oil Soap, Hokkaido Cica Soothing Repair Cream. Set within the historic Kanemori Yobukan building, this independent boutique specializes in Hokkaido\u0027s natural herbal and traditional horse oil skincare products. Collaborating with local farms, the shop uses Furano lavender and regional botanicals to create artisanal skin treatments and home fragrances. The store fills the air with soothing herbal aromas. Its chemical-surfactant-free, cold-processed horse oil soap leaves skin feeling hydrated and soft, making it a favorite gift among visitors.", "name": "Kanemori Yobukan Lavender \u0026 Horse Oil House", "transport": "Approx. 5-minute walk from Hakodate City Tram \u0027Jujigai Station\u0027"}, {"address": "25-13 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Hokkaido Mint Refreshing Deodorant Sheets, Satsudora Hydrating Hand Cream, Hakodate Cherry Blossom Limited Sheet Mask. Located near the entrance of Goryokaku Park, this Satsudora store caters to cherry blossom viewers and tourists with its dedicated \u0027Seasonal \u0026 Hakodate Exclusive Beauty Zone\u0027. Alongside hot-selling Japanese beauty staples, the biggest highlight is the exclusive \u0027Hakodate Cherry Blossom Series\u0027 and soothing skin products made with native Hokkaido mint oil\u2014offering refreshing textures full of local charm.", "name": "Satsudora Hakodate Goryokaku Koen-mae Store", "transport": "Approx. 1-minute walk from Hakodate City Tram \u0027Goryokaku-Koen-mae Station\u0027"}, {"address": "11-5 Toyokawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.6 stars | Must-buy list: Hokkaido Sake Lees Radiant Sheet Mask, Red Brick Scented Hand Cream, Hakodate Natural Milk Moisturizing Body Lotion. Brimming with vintage port-town charm, this independent beauty and lifestyle shop is nestled in the historic Bay Area. It specializes in fermented skincare formulated with local sake lees, fresh milk, and seaweed. The owner handpicks artisanal beauty brands from across Hokkaido, featuring eco-friendly minimal packaging focused on deep hydration and gentle, anti-allergenic remedies\u2014a hidden gem for shoppers seeking one-of-a-kind local products.", "name": "Hakodate Red Brick Cosmetics \u0026 Herbal Shop", "transport": "Approx. 4-minute walk from Hakodate City Tram \u0027Uoiba-dori Station\u0027"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "Inside Kanemori Western Store, 13-9 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy items: Japanese-style cotton and linen dresses, local original canvas tote bags, handcrafted small leather card holders. Located inside the Kanemori Red Brick Warehouse, this popular select shop is a favorite among local Hakodate young women and tourists alike. The store specializes in clothing and lifestyle goods infused with Hokkaido\u0027s natural texture. Clothing is mostly made of comfortable cotton and linen, featuring simple cuts and a distinctly artsy Japanese vibe. Moreover, the original canvas bags and small leather goods created in collaboration with local artisans are truly unique\u2014a chic boutique you definitely shouldn\u0027t miss when exploring the Bay Area.", "name": "Kanemori Western Store - OZ Hakodate (OZ Kanemori Red Brick Warehouse)", "transport": "About a 15-minute walk from JR Hakodate Station, or take the Hakodate City Tram to \u0027Jujikai\u0027 stop and walk about 5 minutes"}, {"address": "11-5 Toyokawa-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.6 stars | Must-buy items: Ezo deer leather bifold wallets, hand-stitched genuine leather ankle boots, Hakodate-exclusive saddle leather keychains. Located near the Bay Area, this shop is a premier local artisan leather studio famous for strictly selecting Hokkaido Ezo deer leather and premium cowhide. Every piece in the shop is hand-stitched by skilled craftsmen; the deer leather is exceptionally soft, supple, and lightweight. The leather bags and shoes here feature refined, timeless designs that develop a beautiful patina over time\u2014a hidden treasure trove for local leather connoisseurs.", "name": "Leather Studio Third Hakodate", "transport": "Take the Hakodate City Tram to \u0027Jujikai\u0027 stop and walk about 4 minutes"}, {"address": "Inside Kanemori Western Store, 14-12 Suehiro-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy items: Hokkaido windproof wool berets, hand-woven newsboy caps, breathable anti-UV sun hats. Located in the Red Brick Warehouse area, this specialty hat boutique curates high-quality handcrafted hats from across Japan and local Hokkaido makers. From warm wool hats built to withstand Hokkaido\u0027s fierce sea breezes to casual woven hats perfect for a seaside stroll, they have it all. The friendly staff will gladly recommend the best hat based on your face shape and outfit, making it a great place to elevate your style.", "name": "Kanemori Red Brick Warehouse - Kamakura Hat Shop Hakodate", "transport": "Take the Hakodate City Tram to \u0027Jujikai\u0027 stop and walk about 5 minutes"}, {"address": "24-1 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy items: Hokkaido-exclusive heavyweight organic cotton T-shirts, lightweight multifunctional backpacks, minimalist knit cardigans. Located in the heart of the Goryokaku commercial district, SHARE STAR is a lifestyle complex combining local living and fashion. The apparel section gathers various local Japanese brands and northern designers\u0027 works, emphasizing practicality and modern minimalist style. The canvas totes and functional backpacks offered here are popular among Hakodate commuters and students for their fantastic quality.", "name": "SHARE STAR HAKODATE - Local Apparel \u0026 Select Zone", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 stop; directly adjacent to the station"}, {"address": "32-15 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 stars | Must-buy items: Northern anti-slip warm snow boots, Hokkaido wool-blend scarves, artisan handcrafted leather shoulder bags. As a long-standing local department store in Hakodate\u0027s Goryokaku district, its boutiques carefully curate many local Hokkaido clothing and leather brands. The shoe and bag section is particularly noteworthy, featuring non-slip, premium snow boots designed specifically for the northern climate alongside elegant genuine leather handbags. Combining functionality with style, it is highly favored by local regular patrons.", "name": "Marui Imai Hakodate - Hokkaido Local Designers Floor", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 stop and walk about 1 minute"}, {"address": "11-17 Toyokawa-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy items: Vintage embroidered motif bags, Hokkaido handcrafted wool shawls, artsy patchwork crossbody bags. Inside Meijikan, a repurposed former Hakodate Post Office from the Meiji era, lies a charming apparel and lifestyle boutique with nostalgic vintage appeal. It highlights warm accessories made from premium Hokkaido wool and hand-woven bags, each carrying a unique blend of Nordic warmth and Japanese lifestyle aesthetic\u2014perfect for travelers searching for one-of-a-kind fashion pieces.", "name": "Hakodate Meijikan Craft \u0026 Apparel Boutique", "transport": "Take the Hakodate City Tram to \u0027Uoiba-dori\u0027 stop and walk about 5 minutes"}, {"address": "14-6 Motomachi, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy items: Traditional indigo-dyed handwoven cotton-linen shirts, botanically dyed canvas totes, indigo pattern silk scarves. An independent artisan workshop located near the Bay Area and Motomachi slopes, committed to using natural plant dyes and traditional craftsmanship to create indigo-dyed apparel and accessories. The indigo-dyed shirts and canvas bags boast deep, elegant tones that weather gracefully over time, acquiring a unique artistic charm. It is an exclusive fashion shop deeply iconic of Hakodate.", "name": "Hakodate Indigo Dye \u0026 Apparel", "transport": "Take the Hakodate City Tram to \u0027Jujikai\u0027 stop and walk about 8 minutes"}, {"address": "25-12 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.0 stars | Must-buy items: Hokkaido winter anti-slip snow boots, Made-in-Japan genuine leather walking shoes, waterproof lightweight hiking shoes. A long-established local shoe store in the Goryokaku shopping street, Shoes Okamoto has served Hakodate for decades and deeply understands the comfort and functional footwear needs of both locals and visitors. The shop features a wide selection of Japanese-made genuine leather shoes for men and women, alongside high-traction functional footwear designed for icy terrain. Offering excellent quality at reasonable prices, it is the go-to spot for locals seeking durable, comfortable shoes.", "name": "Shoes Okamoto Goryokaku Main Store", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 stop and walk about 3 minutes"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Kanemori Yobukan, 13-9 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Catch Cakes (Cheese Omelette), Steamed Chocolate Cake. An iconic Western confectionery shop representing Hakodate, famous nationwide for its Cheese Omelette cake that is cloud-soft, light, and melts instantly in your mouth. Made with fresh Hokkaido milk and premium cheese, it is perfectly sweet without being overwhelming. The Kanemori Red Brick Warehouse branch features a standing-tasting area where you can enjoy this ultimate dessert paired with hot coffee right on the spot.", "name": "PASTRY SNAFFLE\u0027S Kanemori Yobukan Store", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, about a 5-minute walk."}, {"address": "10-18 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Bite-sized Cheesecake (Mel Cheese), Organic Pumpkin Pudding. A famous dessert shop located along the bay area, its bite-sized cheesecake won the Japanese Prime Minister\u0027s Award. It boasts an ultra-light, silky texture with a subtle milky aroma. Additionally, the pumpkin pudding made with organic pumpkins from Onuma Quasi-National Park is rich and sweet\u2014a classic souvenir that tourists visiting the bay area shouldn\u0027t miss.", "name": "Petite Merveille Suehiro Store", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, about a 5-minute walk."}, {"address": "27-6 Goryokaku-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Marusei Butter Sandwich, Freeze-Dried Strawberry White Chocolate. One of Rokkatei\u0027s flagship stores adjacent to Goryokaku Park, featuring large floor-to-ceiling windows overlooking lush green park views. It offers a full range of classic Rokkatei souvenirs. The butter sandwich\u2014crisp biscuits filled with rich Hokkaido butter and raisins\u2014is their most popular signature item, packaged elegantly as an iconic Hokkaido staple.", "name": "Rokkatei Goryokaku Store", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 Station, about a 10-minute walk."}, {"address": "4-5 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Hakodate Meiji Western-Style Curry Packs, Gotoken Classic Apple Pie. Established in 1879, the historic Western-style restaurant Gotoken features a specialty shop selling historic curry packs that let you recreate a century-old Western flavor at home. Furthermore, their classic apple pie sold on-site features a rich, sweet-and-sour filling, making it a top-selling souvenir for many years.", "name": "Gotoken Main Store Dessert \u0026 Souvenir Shop", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, about a 3-minute walk."}, {"address": "9-15 Horaicho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Original Azuki Dorayaki, Hakodate Sanpo Milk Wafers. A century-old Japanese confectionery (wagashi) shop founded in 1860, located near the Kanemori Warehouses and Horai-cho. Their Original Dorayaki features slow-cooked Hokkaido Dainagon red bean filling wrapped in aromatic pancakes. The \u0027Hakodate Sanpo\u0027 milk wafers, stamped with historical city landmarks, are delightfully retro, crunchy, and rustic.", "name": "Hakodate Senshuan Honpo Main Store (Horai-cho)", "transport": "Take the Hakodate City Tram to \u0027Horaicho\u0027 Station, about a 1-minute walk."}, {"address": "Inside Kanemori BAY Hakodate, 12-7 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: German Smoked Sausage Gift Sets, Special Bacon Jerky. A traditional meat brand founded in Hakodate by German artisan Carl Raymon, sticking strictly to traditional German craftsmanship. In addition to tasting freshly grilled sausages at the Kanemori Warehouse store, their vacuum-sealed smoked sausages and special jerky are top local savory souvenir choices.", "name": "Hakodate Carl Raymon Kanemori Bay Cruise Store", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, about a 5-minute walk."}, {"address": "1F Goryokaku Tower, 43-9 Goryokaku-cho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Goryokaku Star-Shaped Butter Cookies, Hijikata Toshizo Souvenir Chocolates. A large official souvenir shop located on the first floor of Goryokaku Tower, featuring many exclusive snacks only available at Goryokaku. The star-shaped cookies echo the unique star fort design, and combined with packaging themed around Shinsengumi Vice-Commander Toshizo Hijikata, they make excellent, memorable gifts.", "name": "Goryokaku Tower Souvenir Shop (1st Floor)", "transport": "Take the Hakodate City Tram to \u0027Goryokaku-Koen-Mae\u0027 Station, about a 7-minute walk."}, {"address": "1F Hakodate Meijikan, 11-17 Toyokawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Hakodate Milk Cheese Sticks, Hokkaido Roasted Corn Rice Crackers. Housed in a historic red-brick building converted from the former Hakodate Post Office, this shop gathers an extensive collection of local Hokkaido snacks and folk crafts. Here you can purchase local Hakodate cheese treats and Hokkaido-exclusive rice crackers\u2014shopping for souvenirs in this romantic, vintage atmosphere is a delightful experience.", "name": "Hakodate Meijikan Hokkaido Confectionery \u0026 Folk Crafts Shop", "transport": "Take the Hakodate City Tram to \u0027Jujigai\u0027 Station, about a 5-minute walk."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "32-15 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 Stars | Must-Buy List: Rokkatei Rum Raisin Sandwiches, Hakodate Wine, Hokkaido cosmetics and skincare products. As the most iconic classic department store in Hakodate\u0027s Goryokaku area, Marui Imai has carried the shopping memories of generations of locals. The basement food hall gathers Hokkaido\u0027s most comprehensive souvenir shops, while the fresh food section on B1 is an incredible spot to hunt for local ingredients. Featuring many high-end domestic Japanese brands and local Hokkaido designer boutiques, it offers attentive service and an elegant shopping environment\u2014a must-visit to experience Hakodate\u0027s classic, refined lifestyle.", "name": "Marui Imai Hakodate", "transport": "About a 1-minute walk from Hakodate City Tram \u0027Goryokaku-Koen-Mae\u0027 Station"}, {"address": "24-1 Honcho, Hakodate, Hokkaido", "feature": "\u2b50 4.2 Stars | Must-Buy List: MUJI local limited-edition snacks, locally roasted Hakodate coffee beans, Japanese wooden home goods. Located in the heart of Goryokaku, this trendy lifestyle shopping complex features a massive multi-floor MUJI store as its centerpiece. It boasts the most complete product lineup in Hokkaido, along with a community hub connecting local produce and events. Housing emerging local brands and curated select shops, it is the top destination for youth and trendy crowds seeking quality home goods and minimalist fashion.", "name": "SHARE STAR HAKODATE", "transport": "Directly outside Hakodate City Tram \u0027Goryokaku-Koen-Mae\u0027 Station"}, {"address": "14-12 Suehirocho, Hakodate, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Petite Merveille bite-sized cheesecake, red brick glass crafts, squid ink handcrafted accessories. Standing along Hakodate Port, this historic building complex features quaint red-brick warehouses converted into a shopping paradise filled with specialty shops. Bay Hakodate houses numerous independent artisan workshops, local accessory shops, and glassware studios. Here, you can find exclusive Hakodate original handicrafts and gorgeous music boxes, with the romantic harbor atmosphere enhancing your shopping experience.", "name": "Kanemori Red Brick Warehouse - Bay Hakodate", "transport": "About a 5-minute walk from Hakodate City Tram \u0027Jujigai\u0027 Station"}, {"address": "11-1 Toyokawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.0 Stars | Must-Buy List: Handmade glass music boxes, Meijikan exclusive teddy bears, Hokkaido lavender essential oil products. Housed in the former Hakodate Post Office built in 1911, this red-brick shopping hall exudes a rich, nostalgic Meiji-era vibe. The venue features glass crafts, intricate music boxes, a charming teddy bear store, and several independent counters showcasing local handcrafted goods and artwork. High-ceilinged wooden architecture intertwined with play of light makes walking through feel like traveling back in time, making it the perfect spot for memorable artisan gifts.", "name": "Hakodate Meijikan", "transport": "About a 3-minute walk from Hakodate City Tram \u0027Uoiba-dori\u0027 Station"}, {"address": "12-8 Wakamatsucho, Hakodate, Hokkaido", "feature": "\u2b50 4.1 Stars | Must-Buy List: Premium Hakodate kelp (kombu), Hakodate craft beer, squid-flavored dried seafood. Situated right next to Hakodate Station and the bay area, this modern shopping plaza features \u0027Hakodate Yokocho\u0027, a recreated retro Showa-era street. Bringing together long-established local seafood vendors, specialty general stores, and souvenir shops, visitors can purchase fresh local kelp and dried scallops while browsing craft beer and artisan accessories. Exceptionally convenient location.", "name": "HAKOVIVA Hakodate Station Mall", "transport": "About a 1-minute walk from JR Hakodate Station"}, {"address": "1-2-1 Minatomachi, Hakodate, Hokkaido", "feature": "\u2b50 3.9 Stars | Must-Buy List: Discounted Japanese brand apparel, Hokkaido natural cosmetics and skincare, bulk-size local Hokkaido snack packs. Highly popular among locals as a regional shopping center and outlet mall, Polestar brings together domestic apparel brand outlets, chain drugstores, and everyday goods shops. Offering budget-friendly prices and frequent seasonal clearance sales, it is perfect for smart shoppers seeking great-value Japanese clothing, affordable cosmetics, and bulk Hokkaido snacks.", "name": "Polestar Shopping Center", "transport": "About a 5-minute drive from JR Goryokaku Station, or take the Hakodate Bus to \u0027Polestar-mae\u0027 Station"}, {"address": "1-7-1 Mihara, Hakodate, Hokkaido", "feature": "\u2b50 4.0 Stars | Must-Buy List: Hokkaido-exclusive Shiseido skincare, discounted brand cosmetics sets, pure Hokkaido horse oil moisturizing cream. This massive MEGA store feels like a hybrid department store and outlet discount hub, serving as Hakodate\u0027s largest comprehensive discount mall. Floors cover discounted brand cosmetics clearance areas, Japanese electronics, trendy apparel, and the most extensive snack and drug section in Hakodate. Offering ultra-discounted prices for both tourists and locals, shoppers can often snag major Japanese cosmetics and exclusive sale items at up to 50% off.", "name": "MEGA Don Quijote Hakodate", "transport": "Take the Hakodate City Bus directly to \u0027Mihara 1-Chome\u0027 Station, or about an 8-minute drive from Goryokaku"}, {"address": "85-1 Ishikawacho, Hakodate, Hokkaido", "feature": "\u2b50 4.5 Stars | Must-Buy List: Hakodate exclusive original stationery, handmade Hokkaido ceramic cups, Hokkaido herbal tea gift sets. Far more than just a bookstore, this is Hakodate\u0027s premier lifestyle flagship store. The vast, light-filled space houses local Hokkaido artisan brand counters, curated home goods, cosmetics and skincare, and exquisite tableware shops. Here, you can discover unique ceramics, leather goods, and limited-edition stationery crafted by local Hokkaido artists\u2014making it a highly authentic and refined shopping destination.", "name": "Hakodate TSUTAYA BOOKS", "transport": "About a 10-minute drive from JR Goryokaku Station, or take the Hakodate Bus toward Kikyo"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Hakodate Bay Area and Goryokaku"}, "niseko_resort": {"categories": {"cat_1": {"items": [{"address": "1-10, Minami 11-jo Nishi 1-chome, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buys: Pure Hokkaido Horse Oil Moisturizing Cream, Lavender Repair Facial Masks, Hokkaido Job\u0027s Tears Lotion. As Hokkaido\u0027s largest homegrown drugstore chain, Satudora\u0027s flagship store in Kutchan Town offers an exceptionally comprehensive inventory. Catering specifically to Niseko\u0027s dry and chilly ski climate, the store features a dedicated Hokkaido cosmetics section showcasing rich, hydrating local skincare products\u2014making it the ultimate pitstop for skiers seeking skin hydration.", "name": "Satudora Kutchan", "transport": "About a 15-minute walk from JR Kutchan Station, or take a local bus and get off at Minami 11-jo Station"}, {"address": "1-11, Minami 10-jo Nishi 1-chome, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buys: Sekkisei Niseko Limited Set, Kao Megrhythm Steam Eye Masks, Kao Ultra-Moisturizing Hand Cream. Tsuruha Drug is a long-established drugstore giant in Hokkaido. This spacious and well-stocked branch in Kutchan features multilingual staff. Its cosmetics section ranges from top-tier Japanese beauty brands to local thermal water lotions developed right in Hokkaido, drawing countless ski enthusiasts to stock up.", "name": "Tsuruha Drug Kutchan", "transport": "About a 14-minute walk from JR Kutchan Station"}, {"address": "190-13 Yamada, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buys: High-Moisture Sunscreen Lotion, Niseko-Exclusive Lip Balm, Deep Repair Hand Cream. Located right in the heart of Niseko\u0027s bustling Hirafu ski village, this store is tailored for international tourists and skiers. Though boutique in size, it curates an exceptional selection of skincare specially formulated to combat harsh winds and intense snow UV rays, allowing you to conveniently pick up top-tier Japanese skincare Holy Grails right after hitting the slopes.", "name": "Satudora Niseko Hirafu", "transport": "Take the Niseko Bus from JR Kutchan Station, get off at Hirafu Intersection stop, and walk for 2 minutes"}, {"address": "888-1 Soga, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buys: Fresh Milk Handmade Moisturizing Soap, Pure Fresh Milk High-Moisture Body Lotion, Milk Essence Hand Cream. Famous for its delicious desserts, Takahashi Dairy Farm also produces a hidden-gem line of natural skincare made with fresh local Niseko milk. Free from artificial dyes and synthetic fragrances, these deeply hydrating products carry a subtle, natural milky scent\u2014making them a uniquely iconic cosmetic souvenir from Niseko.", "name": "Niseko Takahashi Dairy Farm Milk Kobo Beauty Corner", "transport": "About a 10-minute taxi ride from JR Niseko Station, or accessible via the local shuttle bus"}, {"address": "58-5 Yamada, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buys: White Peach Oolong Natural Lip Balm, Hokkaido Botanical Extract Hand Cream, Green Tea Antioxidant Mist. Created by the famous tea brand LUPICIA, this lifestyle boutique in Niseko offers exclusive skincare products enriched with tea extracts and native Hokkaido botanicals alongside exquisite teas and food. The delicate tea aromas combined with elegant packaging make this a hidden gem for visitors seeking sophisticated, natural skincare.", "name": "La Villa LUPICIA Boutique Niseko", "transport": "About a 10-minute taxi ride from JR Kutchan Station, or take the free Hirafu shuttle bus"}, {"address": "593 Yusato, Rankoshi-cho, Isoya District, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buys: Pure Niseko Thermal Water Hydrating Mist, Onsen Mineral Facial Soap, Repairing Beauty Mask. Located in the famous Niseko Kombu Onsen area, this shop features skincare formulated with local thermal spring water rich in metasilicic acid. The ultra-fine micro-molecules of the natural thermal mist absorb quickly to lock in moisture, making it an all-natural pampering holy grail especially ideal after a day on the slopes and a soak in the hot springs.", "name": "Niseko Kombu Onsen Natural Cosmetics Shop", "transport": "About a 15-minute bus or taxi ride from JR Niseko Station to the Kombu Onsen area"}, {"address": "1-3, Minami 6-jo Higashi 1-chome, Kutchan-cho, Hokkaido", "feature": "\u2b50 4.0 stars | Must-Buys: Shiseido Ultra-Moisturizing Cream, MINON Sensitive Skin Repair Mask, DHC Lip Cream. Favored by Kutchan locals and long-stay skiers alike, this drugstore chain offers budget-friendly prices and frequent local discounts. Featuring a wide array of Japanese beauty and skincare products ranging from everyday cleansing to advanced anti-aging treatments, it is an excellent option for shopping without the tourist crowds.", "name": "Drugstore Seims Kutchan", "transport": "About a 10-minute walk from JR Kutchan Station"}, {"address": "77-10 Motomachi, Niseko-cho, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buys: Mt. Yotei Spring Water Handmade Facial Soap, Hokkaido Birch Sap Moisturizing Essence, Natural Lavender Essential Oil. Roadside Station Niseko View Plaza brings together the region\u0027s most authentic local produce and crafts. Its beauty corner showcases pure natural skincare products crafted by local farmers and workshops using Mt. Yotei spring water and birch sap, overflowing with regional character and natural nourishing power.", "name": "Roadside Station Niseko View Plaza Cosmetic Corner", "transport": "Take the loop bus from JR Niseko Station and get off at Niseko View Plaza station"}], "name": "Local Signature Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "\u3012044-0080 3-9, Niseko Hirafu 1-jo 2-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Rhythm collab wind-and-snowproof jacket, Oyuki extreme-cold waterproof gloves, Niseko souvenir baseball cap. As Niseko\u0027s largest specialized ski and outdoor apparel store, it brings together local and international trendy brands designed specifically for extreme cold climates. In addition to premium gear rentals, the apparel section offers exclusive Niseko-branded cotton tees and trendy hats, making it a shopping paradise for skiers and tourists alike.", "name": "Rhythm Niseko Flagship Store (Rhythm Niseko)", "transport": "From JR Kutchan Station, take the Hirafu Free Shuttle Bus to Hirafu Intersection stop, then walk 1 minute."}, {"address": "\u3012044-0080 3-8, Niseko Hirafu 1-jo 3-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.8 stars | Must-Buy List: Custom high-end ski boot liners, Sidas professional sports shock-absorbing insoles, ultra-warm Merino wool snow socks. This store specializes in boot solutions tailored to various foot shapes to ensure ultimate walking comfort on snow. Beyond expert foot measuring and boot-fitting services, their high-performance waterproof snow boots, warm socks, and anti-slip accessories are highly favored by local instructors and travelers, dramatically enhancing your winter walking experience.", "name": "Boot Solutions Niseko", "transport": "About an 8-minute walk from the Hirafu Welcome Center bus terminal."}, {"address": "\u3012044-0080 Hirafu188 1F, 2-1, Niseko Hirafu 1-jo 2-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Phenix high-performance arctic snow jackets, iGATE exclusive warm fleece jackets, K2 lightweight waterproof backpacks. Located inside the Hirafu188 mall, this high-end outdoor apparel boutique is owned by a renowned Hokkaido department store group. Curating top functional clothing brands from Japan and Europe, it specializes in stylish outerwear that offers extreme cold protection\u2014making it the top destination for premium winter wear and high-quality travel bags and shoes.", "name": "iGATE IKEUCHI NISEKO Boutique", "transport": "Take a bus from JR Kutchan Station and get off at the Hirafu Juujikai (Hirafu Intersection) stop; right at the location."}, {"address": "\u3012044-0082 63-28 Iwaobetsu, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buy List: Gentemstick original graphic embroidered T-shirts, minimalist handmade canvas tote bags, custom handcrafted leather snow hats. Founded by legendary Japanese snowboard pioneer Taro Tamai, the store showcases quintessential Japanese artisan craftsmanship. Alongside their world-renowned handcrafted snowboards, the apparel section offers lifestyle clothing, casual hats, and refined bags infused with original artistic flair, drawing style-conscious visitors from near and far.", "name": "GENTEMSTICK Niseko Concept Store", "transport": "Approximately a 15-minute taxi ride from JR Kutchan Station."}, {"address": "\u3012044-0080 3-8, Niseko Hirafu 1-jo 5-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: TNF Gravity Niseko exclusive embroidered hoodies, high-end Gore-Tex snow jackets, ultra-lightweight warm down crossbody pouches. As the brand\u0027s iconic concept flagship store in Hokkaido, the building features a warm blend of wood and modern industrial design. Its biggest highlight is the Niseko-exclusive \u0027Gravity Exclusive\u0027 series\u2014hoodies and bags stamped with Niseko\u2019s coordinates are highly sought-after dream souvenirs for tourists.", "name": "The North Face Gravity Niseko", "transport": "Take a bus from JR Kutchan Station to Hirafu Juujikai stop, then walk about 3 minutes."}, {"address": "\u3012044-0080 Odin Place 1F, 1-11, Niseko Hirafu 1-jo 3-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Scandinavian minimalist high-end down jackets, functional lightweight waterproof crossbody bags, Merino wool knitted warm beanies. Located on the 1st floor of the Odin Place luxury shopping mall, this high-end Swedish outdoor brand is famous for its modern minimalist color palettes and premium c
