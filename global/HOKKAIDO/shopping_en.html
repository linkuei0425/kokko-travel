uts. The store features a wide range of jackets, footwear, and bags tailored for extreme weather with a stylish street-edge vibe, making it a favorite among travelers who love chic Western outdoor fashion.", "name": "Peak Performance Niseko Flagship Store", "transport": "Located inside Odin Place at the Hirafu Intersection; a 5-minute walk from Hirafu Welcome Center."}, {"address": "\u3012044-0077 132 Aza-Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Japanese street-style anti-slip snow boots, Japanese streetwear brand windproof hoodies, water-resistant street waist packs. This independent extreme sports and streetwear boutique boasts strong local flavor and is hugely popular among local riders and youth. Featuring rare Japanese indie designer apparel, graffiti-style caps, and trendy bags, it\u0027s the ultimate spot to find unique fashion pieces that stand out from the crowd.", "name": "Spray Niseko Streetwear \u0026 Extreme Sports Shop", "transport": "About a 12-minute drive or taxi ride from JR Kutchan Station."}, {"address": "\u3012044-0080 1-8, Niseko Hirafu 1-jo 3-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Niseko handcrafted leather totes, Hokkaido organic cotton-wool scarves, local designer snowflake knit sweaters. Tucked inside the famous wooden-clad hotel Ki Niseko, this refined boutique highlights fine apparel and accessories crafted by Hokkaido artisans. Featuring carefully curated handmade leather bags, natural wool textiles, and high-quality snow-country garments, the store radiates authentic Japanese aesthetic and cozy winter warmth.", "name": "Ki Niseko Boutique", "transport": "Located inside the Ki Niseko hotel lobby, right near the Hirafu Gondola boarding station."}], "name": "Popular Local Apparel, Footwear \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "888-1 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy: Freshly baked cream puffs, rich cheese tarts, Takahashi Farm drinking yogurt. Situated at the foot of Mount Yotei, Takahashi Farm Milk Kobo is Niseko\u0027s most iconic dessert and souvenir sanctuary. Using fresh milk squeezed daily right at the farm, they craft a variety of exquisite treats. The legendary fresh cream puffs feature a crispy crust filled with rich, non-greasy sweet custard (limited daily quantities). The cheese tarts blend local cheese with a subtle tartness and deep aroma, making them an absolute #1 must-try gift when visiting Niseko.", "name": "Takahashi Dairy Farm Milk Kobo (Niseko Takahashi Dairy Farm Milk Kobo)", "transport": "About a 10-minute drive from JR Niseko Station"}, {"address": "143-2 Motomachi, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy: Niseko-exclusive potato rice crackers, Mt. Yotei fresh milk caramel candies, aged Gouda cheese blocks. This roadside rest stop gathers the most comprehensive selection of local agricultural produce and exclusive snacks from Niseko and surrounding areas. Renowned for premium potatoes and dairy, the souvenir area features crisp potato crackers that preserve the farm\u0027s original natural sweetness. You\u0027ll also find numerous Niseko-exclusive Hokkaido milk caramels and artisanal cheeses\u2014perfect for picking up gifts for family and friends all at once.", "name": "Michi-no-Eki Niseko View Plaza (Roadside Station Niseko View Plaza)", "transport": "About a 5-minute drive from JR Niseko Station"}, {"address": "58-1 Kabayama, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy: Mt. Yotei pure water exclusive tea bags, Niseko-exclusive flavored black tea \u0027Anseiko\u0027, Mt. Yotei craft beer. World-renowned tea brand LUPICIA established its food R\u0026D hub and boutique in Niseko, taking advantage of Mt. Yotei\u0027s pristine spring water to craft exclusive teas and craft beers only available locally. Beautifully packaged with unique snow-country tea aromas, these make sophisticated and tasteful souvenirs.", "name": "LUPICIA Villa Niseko", "transport": "About a 10-minute drive from JR Kutchan Station"}, {"address": "425-6 Soga, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy: Momiji aged cheese, Niseko Sekkei (snow scene) Camembert, aged cheese crisps. An independent artisanal cheese factory where master cheesemakers handcraft products that have won gold awards in both national and international cheese competitions. Using fresh local Niseko milk and meticulous temperature-controlled aging, they produce Camembert as silky as snow and rich, savory Momiji cheese. The souvenir section offers ambient-temperature aged cheese crisps, which pair wonderfully with red wine or as a savory snack.", "name": "Niseko Cheese Factory (Niseko Cheese Koubou)", "transport": "About a 7-minute drive from JR Niseko Station"}, {"address": "Kita 1-jo Nishi 1-2, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy: Heavy Snow Daifuku (Gousetsu Daifuku), freshly filled crispy cream puffs, Niseko fresh milk pie. Founded in the 1950s, this legendary local confectioner holds deep heritage in Kutchan and Niseko. Inspired by Niseko\u0027s famous heavy snowfall, their best-selling \u0027Gousetsu Daifuku\u0027 features soft, chewy mochi filled with fresh local milk cream and high-quality red beans. Their freshly pipe-filled crispy mille-feuille cream puffs are a top recommendation among skiers and locals alike.", "name": "Sweets Fujii (Kashishi Fujii)", "transport": "About a 2-minute walk from JR Kutchan Station"}, {"address": "Kita 1-jo Nishi 3-10, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy: Niseko alpine house blend coffee beans, Mt. Yotei illustrated drip coffee bags, Sprout original camping mug. Located near Kutchan Station, this independent micro-roastery is a secret hub for Niseko\u0027s outdoor enthusiasts and coffee lovers. Sourcing raw beans and roasting in-house, they craft signature blends inspired by Niseko\u0027s four seasons and Mt. Yotei. The drip bags with beautiful Mt. Yotei illustrations make highly memorable, stylish coffee gifts.", "name": "Sprout Coffee Roasters", "transport": "About a 3-minute walk from JR Kutchan Station"}, {"address": "34-3 Higashiyama, Niseko, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy: Crispy baked cheese, white mold snow cheese, Niseko fresh milk cheese spreads. Tucked away in the woods, this charming specialty cheese shop is run by a former professional skier turned artisan cheesemaker. Their most popular souvenir, \u0027Crispy Baked Cheese\u0027, features fresh cheese uniquely baked into a crunchy, deeply milky snack. Their rich milk cheese spreads also make delightful gifts for pairing with toast and bread.", "name": "Niseko Fromage", "transport": "About an 8-minute drive from JR Niseko Station"}, {"address": "190-1 Yamada, Kutchan, Abuta District, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy: Niseko exclusive collab hoodies, Niseko powder snow beanies, Mt. Yotei stainless steel tumblers. While Rhythm is famous as a premier ski and snowboard flagship store, its Niseko store carries original lifestyle goods and exclusive apparel that are highly sought after by skiers and travelers across Japan. Featuring modern minimalist designs blended with Niseko powder snow elements, these high-quality, practical items make fantastic keepsakes.", "name": "Rhythm Japan Niseko Flagship Store", "transport": "About a 10-minute drive from JR Kutchan Station, located in the heart of Hirafu"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-7-6 Omagari Saiwaicho, Kitahiroshima, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: On-sale Mont-bell thermal jackets, BEAMS OUTLET discounted apparel, Salomon trail running shoes. This is Hokkaido\u0027s largest outlet mall and an unmissable stop on your way to a Niseko ski trip. Gathering dozens of international and premium Japanese outdoor sports brands, it frequently offers amazing discounts ranging from 50% to 70% off. It\u0027s the ultimate shopping paradise for visitors to gear up with top-tier snow equipment and cold-weather gear before heading to Niseko.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "About 30-40 minutes via direct highway bus from New Chitose Airport or Sapporo Station; a convenient stop along the drive to Niseko."}, {"address": "190-1 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buy List: Rhythm Niseko collaboration wool beanies, Oyuki collaboration waterproof leather ski gloves, Peak Performance technical snow outerwear. The largest and most iconic snow sports department flagship store in Niseko\u0027s Hirafu area, featuring a rich local mountain vibe. Beyond top-tier equipment rental, it boasts a massive retail area selling a comprehensive selection of high-end snow clothing and Niseko-exclusive trendy merchandise.", "name": "Rhythm Niseko Main Store", "transport": "About a 2-minute walk from Hirafu Intersection after taking a local bus from JR Kutchan Station."}, {"address": "190-13 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Niseko-exclusive pattern tumblers, Alpine Lifestyle custom mountain scented candles, high-end imported ski goggles. Located at the central Hirafu intersection, this multi-story boutique shopping complex features a modern European wooden architectural style. Housing curated high-end ski shops, upscale local lifestyle stores, and art galleries, it is the most sophisticated and stylish boutique shopping spot in the resort area.", "name": "Odin Place Niseko", "transport": "Located in the heart of the Hirafu commercial district, about a 5-minute walk from the Hirafu Welcome Center."}, {"address": "1-11 Minami 2-jo Nishi 1-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Hokkaido-exclusive Otokoyama Junmai Daiginjo sake, local Niseko May Queen potato chips, extra-rich Hokkaido cheese sticks. A major comprehensive shopping center relied upon by Kutchan locals and long-term ski guests, housing a large supermarket, clothing section, and general lifestyle counters. Here, you can buy Hokkaido agricultural specialties, local exclusive sake, and various souvenirs at budget-friendly local prices.", "name": "Lucky Supermarket \u0026 Mall Kutchan", "transport": "About a 7-minute walk from JR Kutchan Station."}, {"address": "163 Yamada, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Mont-bell Niseko region-exclusive moisture-wicking T-shirts, ultra-lightweight 800FP down jackets, Niseko-themed metallic hiking water bottles. A standalone flagship retail space built in Niseko by Japan\u0027s premier outdoor brand. Featuring highly collectible Niseko-exclusive limited-edition items, it is a must-visit gear hub for travelers who love outdoor sports and Japanese craftsmanship.", "name": "Mont-bell Niseko Store", "transport": "Take the Hirafu Line bus from JR Kutchan Station for about 10 minutes to the Grand Hirafu entrance, then a 1-minute walk."}, {"address": "77-10 Motomachi, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Niseko Cheese Factory handmade aged cheese, Takahashi Dairy Farm milk cookie gift boxes, locally produced Niseko organic melon jam. A nationally acclaimed local produce and specialty center in Japan, bringing together exclusive boutique farm brands and exquisite handmade treats from Niseko. Featuring direct-sale specialty markets and craft stalls, it is the premier choice for purchasing original Niseko food items and handicrafts.", "name": "Niseko View Plaza Roadside Station", "transport": "About a 5-minute drive from JR Niseko Station, or take the Niseko Town Shuttle Bus to View Plaza Station."}, {"address": "Inside Niseko Village, Higashiyama Onsen, Niseko-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Hokkaido hand-carved wooden bear crafts, Niseko natural essential oil hand cream, handmade wool scarves by local designers. A vibrant shopping promenade built in traditional Japanese Machiya architectural style, seamlessly blending classic design with modern boutique shops. Gathering independent craft studios by local Hokkaido artists, original clothing shops, and fragrance lifestyle boutiques, it offers an exceptionally refined shopping experience.", "name": "Niseko Village Shopping \u0026 Dining Area", "transport": "About a 10-minute drive from JR Niseko Station, or take the Midorimachi Line bus to The Green Leaf Hotel Station."}, {"address": "1-10 Kita 3-jo Higashi 4-chome, Kutchan-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Hokkaido Kin-no-Suzu melon jelly, Niseko craft beer gift sets, Yubari melon sandwich cookies. A large-scale local Hokkaido chain retail mall featuring an extensive section for Hokkaido-exclusive souvenirs and daily necessities. Craft beers from local Niseko microbreweries and local cheeses can all be purchased here in one stop at discounted direct-sale prices.", "name": "Co-op Sapporo Kutchan Store", "transport": "About a 12-minute walk or a 3-minute drive from JR Kutchan Station."}], "name": "Major Malls \u0026 Outlets"}}, "name": "Niseko Resort Area"}, "noboribetsu_toya": {"categories": {"cat_1": {"items": [{"address": "76 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Hokkaido Pure Horse Oil Moisturizing Cream, Lavender Repair Mask, Hokkaido Limited Horse Oil Hand Cream. Hokkaido\u0027s iconic local drugstore chain located on Gokuraku Dori Shopping Street in Noboribetsu. It offers a wide variety of local Hokkaido skincare products and specialty cosmetics tailored for hot spring visitors, featuring affordable prices and excellent tax-free shopping services.", "name": "Satudora Noboribetsu Onsen Store", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "60 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Noboribetsu Natural Onsen Water Hydrating Mist, Concentrated Essence Horse Oil Ointment, Sulfur Hot Spring Facial Cleanser. An independent specialty shop on Noboribetsu Onsen Street that focuses on skincare products crafted from high-quality local hot spring water and pure natural horse oil. Extremely popular among tourists seeking deep hydration and sensitive skin repair.", "name": "Yukinotani Horse Oil \u0026 Cosmetic Shop Noboribetsu", "transport": "About a 5-minute walk from Noboribetsu Onsen Bus Terminal."}, {"address": "71 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Lake Toya Beauty Onsen Sheet Masks, Organic Lavender Essential Oil, Pure Botanical Horse Oil Body Lotion. The most historic and iconic souvenir shop on Lake Toya Onsen Street featuring a dedicated, spacious area for Hokkaido cosmetics. It highlights exclusive skincare enriched with Lake Toya hot spring extracts alongside various Hokkaido-limited herbal products.", "name": "Echigoya Toyako Cosmetic \u0026 Horse Oil Shop", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 2 minutes."}, {"address": "142 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Hokkaido Horse Oil Shampoo, Collagen Hot Spring Lip Balm, Lavender Soothing Eye Mask. A local Hokkaido drugstore located in the heart of Lake Toya Onsen Street. It offers a wide selection of popular Japanese cosmetics, pharmaceuticals, and Hokkaido-exclusive skincare products. Highly convenient with tax-free discounts and Chinese-speaking staff.", "name": "Satudora Toyako Onsen Store", "transport": "About a 4-minute walk from Toyako Onsen Bus Terminal."}, {"address": "55 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Takimotokan Limited Onsen Beauty Soap, Gold Leaf Horse Oil Anti-Aging Cream, Noboribetsu Mineral Mud Exfoliating Gel. Located inside the renowned Dai-ichi Takimotokan hotel, this premium skincare section specializes in luxury products inspired by Noboribetsu\u0027s seven distinct hot spring water types. A must-visit for travelers seeking ultimate skincare pampering and exquisite gift sets.", "name": "Dai-ichi Takimotokan Yuno-ya Skincare Shop", "transport": "Take a bus from JR Noboribetsu Station to \u0027Dai-ichi Takimotokan-mae\u0027 stop; the shop is right there."}, {"address": "4-12-1 Wakakusacho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Hokkaido Hydrating Horse Oil Foot Mask, Soy Milk Beauty Body Lotion, SANA Facial Wash (Hokkaido Limited Edition). A branch of Japan\u0027s well-known Tsuruha Drug chain in the Noboribetsu area. In addition to a comprehensive selection of national pharmaceuticals, it stocks abundant local Hokkaido cosmetics and hot spring skincare items, highly trusted by locals and tourists alike.", "name": "Tsuruha Drug Noboribetsu", "transport": "About an 8-minute drive from JR Washibetsu Station, or take a local city bus to \u0027Wakakusacho\u0027 stop."}, {"address": "21 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Lake Toya Herbal Horse Oil Lotion, Natural Volcanic Mud Cleanser, Organic Lavender Sleeping Mask. An upscale beauty corner situated within the Toyako Manseikaku Hotel. It features carefully selected skincare products combining Hokkaido botanical extracts with Lake Toya hot spring essence. Its elegant packaging and exceptional moisturizing qualities make it a favorite among female travelers.", "name": "Toyako Manseikaku Beauty Corner", "transport": "Take a bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "203-1 Noboribetsu Onsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Sekisuitei Special Yuno-hana Bath Salts, Royal Jelly Horse Oil Moisturizing Cream, Hydrating Onsen Hand Cream. A specialty cosmetics shop located inside the Sekisuitei Hotel in the Oku-Yunokawa area of Noboribetsu. It highlights original and co-branded skincare crafted from Noboribetsu hot spring extracts, along with high-quality natural horse oil and pure Hokkaido botanical skincare products.", "name": "Noboribetsu Sekisuitei Yuno-hana Cosme Shop", "transport": "From Noboribetsu Onsen Bus Terminal, take the bus bound for Ashiyu (Footbath) and get off at \u0027Sekisuitei-mae\u0027 stop."}], "name": "Local Iconic Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "20-1 Kashimach\u014d, Date, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Saddle leather long wallets, premium cowhide handbags, exquisite leather keychains. As Japan\u0027s sole luxury equestrian equipment manufacturer, SOMES SADDLE operates this directly-managed store in Date City near Lake Toya, making it a true Hokkaido icon. Combining high-quality leather with masterful Japanese craftsmanship, they offer extremely durable leather goods, boots, and handbags designed to withstand severe cold\u2014a favorite among discerning locals and tasteful tourists.", "name": "SOMES SADDLE Date Shop (\u30bd\u30e1\u30b9\u30b5\u30c9\u30eb \u4f0a\u9054\u30b7\u30e7\u30c3\u30d7)", "transport": "About a 5-minute taxi ride from JR Date-Mombetsu Station, or a 20-minute drive from the Lake Toya Onsen area."}, {"address": "71 Toyakoonnsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Lake Toya exclusive graphic T-shirts, Japanese-style embroidered canvas tote bags, anime collaboration caps. Located on Lake Toya Onsen Street, this hugely popular local shop is famous not only for its world-renowned wooden swords but also for its original Hokkaido-themed T-shirts and canvas totes. Made from soft, durable pure cotton, their designs seamlessly blend local landmarks with anime pop culture trends.", "name": "Toyako Echigoya Apparel \u0026 Bags", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "60 Noboribetsuonsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Noboribetsu Red Demon original graphic T-shirts, local demon-horn embroidered warm socks, handcrafted demon lucky god leather pouches. Situated on Gokuraku-dori Shopping Street in Noboribetsu Onsen, this specialty local store features clothing and bag accessories inspired by Noboribetsu\u0027s iconic demon motifs. Carefully stitched by local workshops with high-quality fabrics, these items are rich in hot spring town charm and auspicious meaning.", "name": "Noboribetsu Oni-no-Kura Folk Craft \u0026 Apparel", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027 stop, then walk about 5 minutes."}, {"address": "59-7 Matsugaech\u014d, Date, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: FieldCore extreme cold waterproof/non-slip snow boots, 3D thermal functional jackets, lightweight windproof cold-weather pants. A high-value functional clothing and footwear store highly recommended by Hokkaido locals. Designed for severe cold and outdoor activities, its non-slip snow boots and high-insulation jackets offer outstanding performance at affordable prices\u2014the perfect place to gear up for winter when visiting Noboribetsu and Lake Toya.", "name": "Workman Plus Date Store (\u30ef\u30fc\u30af\u30de\u30f3\u30d7\u30e9\u30b9 \u4f0a\u9054\u5e97)", "transport": "About a 15-minute walk from JR Date-Mombetsu Station, or a 25-minute drive from Lake Toya or Noboribetsu."}, {"address": "38-3 Umemotoch\u014d, Date, Hokkaido", "feature": "\u2b50 4.0 stars | Must-Buy List: High-grip ice snow boots for Hokkaido winters, waterproof breathable walking shoes, lightweight fleece-lined casual cold-weather shoes. Located near Lake Toya and Noboribetsu Onsen, this large local shoe store brings together Japanese footwear brands suited for Hokkaido\u0027s climate. Featuring a dedicated section for winter slip-resistant boots, it offers durable quality and diverse choices, making it a go-to spot for locals looking for winter footwear.", "name": "Shoe Plaza Date Store (\u30b7\u30e5\u30fc\u30d7\u30e9\u30b6 \u4f0a\u9054\u5e97)", "transport": "About a 6-minute drive from JR Date-Mombetsu Station, or take the Donan Bus to \u0027Umemotoch\u014d\u0027 stop and walk about 2 minutes."}, {"address": "57-1 Umemotoch\u014d, Date, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: FIBER HEAT extra-warm thermal underwear, Hokkaido-exclusive plush socks, spacious practical canvas totes. A large chain store operated by Japan\u0027s affordable fashion giant near Noboribetsu and Lake Toya, offering a wide array of budget-friendly cold-weather apparel, footwear, and bags. Locals frequently shop here for high-value thermal wear and casual accessories, making it ideal for travelers needing extra winter gear on the fly.", "name": "Fashion Center Shimamura Date Store (\u30d5\u30a1\u30c3\u30b7\u30e7\u30f3\u30bb\u30f3\u30bf\u30fc\u3057\u307e\u3080\u3089 \u4f0a\u9054\u5e97)", "transport": "About a 7-minute taxi ride from JR Date-Mombetsu Station, or a 20-minute drive from the Lake Toya Onsen area."}, {"address": "2-3-4 Wakakusach\u014d, Shiraoi, Shiraoi District, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Ainu hand-embroidered cotton T-shirts, traditional geometric pattern canvas bags, hand-woven folk-style crossbody pouches. Located near Noboribetsu and Shiraoi, this independent workshop store specializes in clothing and bags featuring traditional Hokkaido indigenous Ainu motifs. Hand-embroidered by local artisans, the designs carry symbolic meanings of warding off evil and offering blessings, making each piece unique and culturally priceless.", "name": "Kobo Yukarabito - Ainu Craft \u0026 Apparel (\u5de5\u623f\u3086\u304b\u3089\u3073\u3068)", "transport": "About a 10-minute walk from JR Shiraoi Station, or a 25-minute drive from the Noboribetsu Onsen area."}, {"address": "53-1 Nakanoboribetsuch\u014d, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Japanese-style pattern windproof Haori coats, traditional printed Kinchaku drawstring pouches, handmade geta sandals, Japanese soft-soled boots. Set inside Noboribetsu Date Jidaimura, this historic shopping hall recreates the atmosphere of Edo-period merchant houses. It offers a variety of Haori jackets, embroidered bags, and traditional footwear blending authentic Japanese patterns with modern wearability\u2014a hit among fans of traditional Japanese fashion.", "name": "Noboribetsu Date Jidaimura Merchant House Apparel \u0026 Accessories", "transport": "Take the Donan Bus for about 8 minutes from JR Noboribetsu Station to \u0027Noboribetsu Date Jidaimura\u0027 stop, right outside."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "144 Toyakoonsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Wakasaimo (roasted sweet potato flavor bean paste pastry), Hokkaido Kintoki sweet potato cake, Toyako strawberry cookies. This is Lake Toya\u0027s most iconic century-old confectionery shop. Although its signature product is named \u0027Imo\u0027 (sweet potato), it cleverly uses Daifuku beans and kelp fibers to recreate the texture and fiber of real sweet potato. With a lightly charred, savory-sweet crust and a smooth, sweet filling, its beautifully packaged gift boxes make it an absolute top souvenir to buy when visiting Lake Toya.", "name": "\u308f\u304b\u3055\u3044\u3082\u672c\u8217 \u6d1e\u723a\u6e56\u672c\u5e97 (Wakasaimo Honpo Toyako Main Store)", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "71 Toyakoonsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Customized engraved Lake Toya wooden sword, Gintama limited-edition sweets, Hokkaido carved wooden bear souvenirs. Shot to fame because Gintoki Sakata, the protagonist of the popular anime \u0027Gintama\u0027, carries a wooden sword engraved with \u0027Toyako\u0027! The shop offers professional on-site engraving services, making it a sacred pilgrimage spot for anime fans. In addition to wooden swords, the store sells special senbei (rice crackers) stamped with the Lake Toya logo and various exclusive merchandise.", "name": "\u6d1e\u723a\u6e56 \u8d8a\u5f8c\u5c4b (Toyako Echigoya Souvenir Shop)", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 2 minutes."}, {"address": "50 Noboribetsuonsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Noboribetsu Red Demon spicy ramen pack, Noboribetsu craft beer, Hokkaido dried scallops. Located in the heart of Noboribetsu Gokuraku Street Shopping District, this market serves fresh seafood alongside a dedicated souvenir section featuring exclusive local specialties. The most popular items are the Red Demon spicy ramen and limited-edition craft beer inspired by local demon folklore, making them perfect unique gifts for friends and family.", "name": "\u767b\u5225\u6eab\u6cc9\u5e02\u5834 (Noboribetsu Onsen Ichiba)", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk about 5 minutes."}, {"address": "168 Nakanoboribetsucho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Noboribetsu rich milk pudding, aged cheddar cheese, fresh milk soft-serve ice cream. Utilizing fresh milk from premium local Noboribetsu farms, this dairy house crafts exquisite dairy products. The pudding here is incredibly rich and velvety, while the award-winning handmade cheese is a true local treasure. Although a bit far from the main hot spring street, its pure Hokkaido milk flavor makes it a must-visit spot highly recommended by foodies.", "name": "\u767b\u5225\u916a\u8fb2\u9928 (Noboribetsu Rakunokan)", "transport": "Take the Donan Bus bound for Noboribetsu Onsen from JR Noboribetsu Station, get off at \u0027Naka-Noboribetsu\u0027 stop, then walk about 10 minutes."}, {"address": "36 Toyakoonsen, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: White sweet bean soup (Shiroi Oshiruko), Toyako Onsen senbei (rice crackers), handmade yokan. This historic confectionery shop overflows with nostalgic Showa-era charm. Its signature White Sweet Bean Soup is crafted from high-quality Daifuku beans grown near Lake Toya combined with fresh Hokkaido milk, offering a smooth, comforting, and delicately sweet taste. Their hand-baked hot spring rice crackers, rich with egg aroma, are also a popular souvenir.", "name": "\u5ca1\u7530\u5c4b (Okadaya Toyako)", "transport": "Take the Donan Bus from JR Toya Station to \u0027Toyako Onsen\u0027 stop, then walk about 3 minutes."}, {"address": "183 Showashinzan, Sobetsu, Usu District, Hokkaido", "feature": "\u2b50 4.0 stars | Must-Buy List: High-purity horse oil skincare cream, \u0027Bear Caution\u0027 black pepper ramen, handcrafted wooden bear carvings. Located next to the Showa Shinzan Ropeway Station, this souvenir shop sells famous bear-themed merchandise as well as top-selling pure natural Hokkaido horse oil and bear oil skincare products known for exceptional moisturizing qualities. You\u0027ll also find exclusive snacks and gift sets featuring Hokkaido wildlife themes.", "name": "\u662d\u548c\u65b0\u5c71\u718a\u7267\u5834\u8ce3\u5e97 (Showa Shinzan Bear Ranch Souvenir Shop)", "transport": "Take the Donan Bus from JR Toya Station to \u0027Showa Shinzan\u0027 stop; the shop is right there."}, {"address": "3-5 Naruka, Toyako, Abuta District, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Silo Observatory limited handmade pudding, Hokkaido cheese cookies, ultra-rich drinkable yogurt. Located at the best viewpoint offering a panoramic view of Lake Toya, the attached souvenir shop stocks popular specialties from across Hokkaido. The absolute must-tries are the exclusive, rich handmade pudding and fresh yogurt drink available only at this observatory\u2014enjoying limited-edition treats alongside stunning lake views is a true delight.", "name": "\u30b5\u30a4\u30ed\u5c55\u671b\u53f0\u4f34\u624b\u79ae\u5e97 (Silo Observatory Souvenir Shop)", "transport": "About 20 minutes by taxi from JR Toya Station, or take a sightseeing bus and get off at \u0027Silo Observatory\u0027."}, {"address": "60 Noboribetsuonsencho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: \u0027Oni Raiden\u0027 spicy senbei, Noboribetsu Red Demon spiked club cookies, King Enma blessing charms. Located in the Noboribetsu Gokuraku Street Shopping District, this unique specialty shop focuses on Noboribetsu\u0027s demon culture. Filled with fun demon-themed decor, must-buy items include crunchy cookies shaped like the Red Demon\u0027s spiked club (kanab\u014d) and slightly spicy Oni Raiden senbei\u2014a fun souvenir rich in local tradition.", "name": "\u5927\u4fe1\u5546\u6703 \u9b3c\u89d2\u5c08\u8ce3\u5e97 (Daishin Shokai - Noboribetsu Souvenir Shop)", "transport": "Take the Donan Bus from JR Noboribetsu Station to \u0027Noboribetsu Onsen Bus Terminal\u0027, then walk about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-7-6 Omagari Saito-cho, Kitahiroshima, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted BEAMS clothing, GAP kids\u0027 wear, and Mont-bell outdoor gear. A massive shopping haven on the way to Noboribetsu and Lake Toya, this is Hokkaido\u0027s largest outlet mall. Featuring over 170 international and domestic Japanese brands, it offers tax-free shopping and incredible discounts. The spacious food court gathers famous local Hokkaido eateries, making it a one-stop destination for outdoor equipment, Japanese apparel, and souvenirs.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "About 50 minutes by direct bus from Sapporo Station, or about 30 minutes by direct bus from New Chitose Airport."}, {"address": "1-2-1 Kashiwadai Minami, Chitose, Hokkaido", "feature": "\u2b50 4.0 stars | Must-buy list: Discounted footwear at ABC-MART OUTLET, EDWIN Japanese jeans, and famous Hokkaido ramen gift sets. A spacious open-air outlet shopping plaza conveniently located near New Chitose Airport and the Noboribetsu Onsen transit route, housing dozens of Japanese and international outlet brand shops. Beyond bargain apparel and footwear, it features a Ramen Expo showcasing local Hokkaido ramen shops and a souvenir hall, making it the perfect final shopping stop before departing the Noboribetsu and Lake Toya areas.", "name": "Chitose Outlet Mall Rera", "transport": "About a 3-minute walk from JR Minami-Chitose Station."}, {"address": "2-4-32 Higashimachi, Muroran, Hokkaido", "feature": "\u2b50 4.0 stars | Must-buy list: Hokkaido-exclusive raw cream rolls, Japanese cosmetics and skincare, and locally produced farm-fresh vegetable crackers. A large comprehensive shopping center near the Noboribetsu Onsen area, serving as the top choice for locals and in-depth travelers to buy daily necessities and regional delicacies. The complex includes a large supermarket, popular clothing stores, a drugstore, and a food court. Fully stocked with reasonable prices, it\u0027s ideal for stocking up before heading to the hot spring resort.", "name": "AEON Muroran Shopping Center", "transport": "About a 5-minute walk from the East Exit of JR Higashi-Muroran Station."}, {"address": "25-1 Matsugaecho, Date, Hokkaido", "feature": "\u2b50 4.1 stars | Must-buy list: Fresh Date-produced cheese, Japanese lifestyle goods, and Hokkaido-exclusive snacks. A large comprehensive shopping center serving the Lake Toya and Date areas, offering convenient tax-free shopping services. It houses an extensive grocery supermarket, Japanese clothing, household goods, and a drugstore. Since Date City is known for its mild climate and thriving agriculture, the supermarket here offers high-quality local dairy products and agricultural souvenirs that truly reflect local life.", "name": "AEON Date Shopping Center", "transport": "About a 10-minute ride on Donan Bus from JR Date-Mombetsu Station."}, {"address": "144 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: Wakasaimo (sweet potato-style baked cake), freshly fried Imo-ten, and Onidokoro craft beer. A flagship local souvenir department store on the shores of Lake Toya, featuring a confectionery workshop, local craft brewery, and lake-view restaurant. Their signature product, \u0027Wakasaimo\u0027, recreates roasted sweet potato flavors using Daifuku beans and kelp, serving as a classic Lake Toya gift for decades. Complete with freshly made desserts and exclusive local produce, it is a must-visit for authentic Hokkaido confectioneries.", "name": "Wakasaimo Honpo Lake Toya Main Store", "transport": "About a 5-minute walk from Toyako Onsen Bus Terminal."}, {"address": "71 Toyako Onsen, Toyako-cho, Abuta-gun, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Customized wooden sword engraved with \u0027Lake Toya\u0027 (Toyako), Gintama collaboration T-shirts, and local hand-carved wooden bears. An iconic specialty craft and souvenir shop on Lake Toya Onsen Street, made famous by the anime \u0027Gintama\u0027 where the protagonist wields a wooden sword engraved with \u0027Toyako\u0027. In addition to offering on-the-spot free custom engraving on wooden swords, the shop carries anime merchandise, traditional Ainu-style wood carvings, and local lifestyle goods, attracting anime fans and travelers alike.", "name": "Toyako Echigoya", "transport": "About a 3-minute walk from Toyako Onsen Bus Terminal."}, {"address": "184-5 Showashinzan, Sobetsu-cho, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy list: Handmade lavender crystal glassware, snowflake motif accessories, and embossed glass vases. A large craft-themed store next to the Showashinzan Ropeway station specializing in exquisite Hokkaido glass craftwork and accessories. The gallery showcases thousands of glass art pieces, music boxes, and home decor meticulously crafted by local artisans. These crystal-clear creations embody elements of Hokkaido\u0027s four seasons, making them memorable keepsakes from your trip to Noboribetsu and Lake Toya.", "name": "Showashinzan Glass House", "transport": "Take the Donan Bus from JR Toya Station and get off at \u0027Showashinzan\u0027 bus stop."}, {"address": "60 Noboribetsu Onsen-cho, Noboribetsu, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Demon horn carved wooden accessories, original Noboribetsu Onsen carved wooden bears, and traditional Ainu pattern woven bags. Situated in the heart of Noboribetsu Onsen\u0027s Gokuraku-dori Shopping Street, this long-standing folk craft store represents local artisan traditions. Renowned for masterful woodcarving skills, it specializes in demon woodcarvings symbolizing Noboribetsu\u0027s guardian spirits and classic Hokkaido wooden bears. It also offers unique indigenous crafts and creative local lifestyle items that reflect rich cultural heritage.", "name": "Noboribetsu Craft Shop Daikokuya", "transport": "About a 4-minute walk from Noboribetsu Onsen Bus Terminal."}], "name": "Department Stores \u0026 Recommended Outlets"}}, "name": "Noboribetsu Onsen and Lake Toya"}, "otaru_canal": {"categories": {"cat_1": {"items": [{"address": "6-2 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Cherry Blossom Konjac Facial Soap, Otaru Limited Galaxy Crystal Facial Soap Ball, Hokkaido Melon Ultra-Moisturizing Soap. Located on the bustling Sakaimachi Street, this specialty natural facial soap shop combines natural konjac with local Hokkaido botanical extracts to create jelly-like, squishy facial soaps. The store features a trial wash area, leaving skin hydrated and supple without feeling tight. Packaged exquisitely in retro Otaru style, these make popular beauty souvenirs that combine practicality with authentic local charm.", "name": "Otaru Konjac Shabon", "transport": "About a 12-minute walk from JR Minami-Otaru Station or a 15-minute walk from JR Otaru Station, located inside the Sakaimachi Street shopping district."}, {"address": "4-10 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: 100% Pure Horse Oil Moisturizing Cream, Natural Lavender Horse Oil Hand Cream, Ultra-Moisturizing Horse Oil Lip Balm. Hokkaido\u0027s most iconic high-purity natural horse oil brand, focusing on skin-friendly formulations free of artificial fragrances. The store showcases a wide array of horse oil skincare products formulated for different skin types, perfect for combating dry climates and harsh winter chapping. Friendly staff provide professional product trials and skin consultations, making this a must-visit natural beauty boutique in Otaru.", "name": "Hokkaido Junbayu Honpo Otaru Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station, right along the main Sakaimachi shopping street."}, {"address": "5-33 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Lifetiara Hokkaido Horse Oil Facial Mask, Otaru Canal Limited Edition Steam Eye Mask, HABA Additive-Free Squalane Beauty Oil. As one of Hokkaido\u0027s largest local drugstore chains, this branch is housed in a quaint historic building along Sakaimachi Street. It features a dedicated Hokkaido-exclusive beauty \u0026 skincare zone featuring local brands and exclusive items. Its spacious shopping environment and tax-free services make it a top choice for tourists buying cosmetics and health goods.", "name": "SATUDORA Otaru Sakaimachi Shop", "transport": "About a 10-minute walk from JR Minami-Otaru Station, located in the middle section of Sakaimachi Street."}, {"address": "5-27 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buy List: 100% Natural Peppermint Oil Spray, Mint Moisturizing Lip Balm, Mint Herbal Repair Salve. Carrying on nearly a century of peppermint heritage from Kitami, Hokkaido, this signature brand is famous for its mint products, with a skincare line particularly beloved by women. Crafted with pure natural peppermint essential oil, their lip balms and refreshing skin balms carry a soothing herbal fragrance, providing a refreshing, hydrating feel that works wonders for soothing fatigue and dry skin.", "name": "Kitami Mint Products Otaru Outlet", "transport": "About a 12-minute walk from JR Otaru Station, located near the intersection of the Otaru Canal and Sakaimachi Street."}, {"address": "6-11 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Gold Leaf Ultimate Repair Horse Oil Cream, Organic Lavender Horse Oil, Horse Oil High-Moisture Repair Shampoo. A specialized local horse oil boutique deeply rooted in Otaru, dedicated to refining and modernizing traditional horse oil skincare. Their proprietary Gold Leaf Horse Oil Cream offers a luxurious texture and deep hydration, locking in moisture and smoothing fine lines. The shop ambiance is classically romantic, offering various mini sample sets perfect for gift shopping.", "name": "Otaru Bayukan Sakaimachi Main Store", "transport": "About an 11-minute walk from JR Minami-Otaru Station, situated in the prime central area of Sakaimachi Street."}, {"address": "2-17 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: SANA Nameraka Honpo Extra Rich Moisture Lotion, Hokkaido Limited Lavender Bath Salts, Shiseido Anessa Perfect UV Sunscreen Skincare Milk. A renowned Japanese drugstore chain originating in Hokkaido, this Sakaimachi store features a retro exterior that blends seamlessly with the historic neighborhood. Inside, it is stocked with everything from trending Japanese makeup and cosmeceuticals to Hokkaido-exclusive herbal skincare. With Chinese-speaking shopping assistants on hand, it offers an exceptionally convenient shopping experience.", "name": "Tsuruha Drug Otaru Sakaimachi Store", "transport": "About a 13-minute walk from JR Otaru Station, located near the start of Sakaimachi Street."}, {"address": "1-2-18 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Hokkaido Lavender Handmade Essential Oil Soap, Yoichi Sake Lees Brightening Mask, Snowmelt Water Pure Hydrating Mist. Tucked away in a historic building near the Otaru Canal, this local handmade skincare boutique uses natural Hokkaido ingredients such as lavender, sake lees, pure mineral water, and honey. Their artisanal soaps undergo a long natural curing process, producing fine, gentle lather ideal for sensitive skin and exuding the pure, natural essence of the region.", "name": "Otaru Herb \u0026 Natural Soap Shop", "transport": "About a 10-minute walk from JR Otaru Station, close to the Otaru Canal Plaza and Old Temiya Line Railway."}, {"address": "5-4 Minatomachi, Otaru, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: KOSE Hadabisei 3D Facial Mask, Hokkaido Rose Essential Oil Moisturizing Hand Cream, Curel Intensive Moisture Facial Cream. Located right next to the popular Otaru Canal tourist area, this top-tier drugstore caters to canal visitors with a vast array of cosmetics and personal care items. Beyond popular major-brand cosmetics and pharmaceuticals, the store features a dedicated Hokkaido specialty skincare section and frequently offers tourist tax-free discount sets\u2014a perfect spot to restock skincare goods while sightseeing along the canal.", "name": "Kokumin Drug Otaru Canal Store", "transport": "About an 8-minute walk from JR Otaru Station, located inside the tourist commercial complex opposite Ryugu Bridge at Otaru Canal."}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "4-11 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Classic leather saddle bag, horseshoe coin purse, vegetable-tanned leather long wallet. Originating from Akabira, Hokkaido, ITAGAKI is a top-tier Japanese handmade leather brand with an elegant directly-managed store on Otaru\u0027s Sakaimachi Street. The brand insists on using high-quality vegetable-tanned leather, meticulously hand-stitched by experienced master craftsmen. Over time, the leather develops a deeper, lustrous amber patina. The shop offers free on-site custom engraving, allowing you to personalize your leather goods with a unique name or memorable date\u2014a top-quality souvenir not to be missed when visiting Otaru.", "name": "Bags by ITAGAKI Otaru Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station, or a 15-minute walk from JR Otaru Station"}, {"address": "2-1-19 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Classic heavy canvas tote, retro shoulder canvas messenger bag, handmade canvas pencil case. Otaru Hanpu-kan is a highly distinctive local independent canvas bag boutique, carrying on Otaru\u0027s legacy as a port city with a history of needing durable canvas goods. All canvas bags in the store are stitched from high-spec thick Japanese canvas, making them wear-resistant with excellent water repellency. The style leans towards Japanese minimalist and retro hipster vibes, offering a variety of gentle, natural dyed tones. Whether it\u0027s a large-capacity daily commuter tote or a compact crossbody bag, each piece showcases a unique local handmade texture.", "name": "Otaru Hanpu-kan (Otaru Canvas Shop)", "transport": "About a 10-minute walk from JR Otaru Station, near Otaru Canal Central Bridge"}, {"address": "5-28 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade leather ankle boots, Hokkaido Ezo deer leather card holder, vintage carved leather belt. Tucked inside a historical building along Sakaimachi Street, this independent leather workshop specializes in creations made from Hokkaido\u0027s unique \u0027Ezo deer leather.\u0027 Ezo deer leather is exceptionally soft, lightweight, fine-textured, and remarkably durable. The workshop owner insists on limited handmade production, personally handling everything from footwear design and cutting to punching and stitching. The leather boots are exceptionally comfortable and snug, while the deer leather card holders and belts exude a strong Hokkaido wild-nature charm, making them hugely popular among travelers seeking uniqueness and artisanal warmth.", "name": "Otaru Leather Craft Sou", "transport": "About a 12-minute walk from JR Minami-Otaru Station"}, {"address": "7-26 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Glass bead embellished silk scarves, handmade Otaru glass brooches, Japanese-style glass hair accessories. While Kitaichi Glass is famous for its glass crafts, its dedicated fashion \u0026 accessories store seamlessly blends \u0027glass art\u0027 with \u0027Japanese fashion accessories.\u0027 The store exclusively sells handmade silk scarves, mufflers, and shawls adorned with delicate Otaru glass beads, which cast a dreamy glow when light refracts through them. Additionally, a variety of handmade brooches, hair clips, and handbag charms combining metal and glass bring Otaru\u0027s glass aesthetic into daily outfits\u2014making them fantastic choices combining fashion and souvenir value.", "name": "Kitaichi Glass Fashion \u0026 Accessories Store", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "1-25 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Retro handmade pearl handbag, vintage copper mirror pocket watch keychain, nostalgic vintage hats. Housed in a classic Taisho-era red brick building, Otaru Romankan attracts countless visitors with its nostalgic Taisho Roman style. The apparel and accessories section gathers romantic, vintage-inspired handbags, lace parasols, retro hats, and exquisite brooches. Most products are handmade, incorporating elements of glass beads, pearls, and antique metals. Browsing for accessories inside this brilliantly illuminated brick interior feels like stepping back into Otaru\u0027s prosperous and romantic golden era.", "name": "Otaru Romankan Accessories \u0026 Vintage Select Store", "transport": "About a 13-minute walk from JR Otaru Station"}, {"address": "6-10 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Hokkaido Bear print organic cotton T-shirt, Hokkaido snowflake thick knit beanie, outdoor windproof warm jacket. Natural Bicycle is a local outdoor street style brand born in Sapporo, Hokkaido, featuring a dedicated select space along Sakaimachi Street in Otaru. The brand\u0027s philosophy stems from Hokkaido\u0027s magnificent nature, crafting apparel mostly from high-quality organic cotton and functional fabrics. Graphic designs incorporate local elements like Hokkaido brown bears, snowflakes, and Ezo deer. The cozy beanies and windproof jackets in the shop are perfectly suited for Hokkaido\u0027s cold climate, highly favored by youth who love outdoor style and Japanese streetwear trends.", "name": "Natural Bicycle Otaru Select Shop", "transport": "About an 11-minute walk from JR Minami-Otaru Station"}, {"address": "1-9-8 Ironai, Otaru, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Handwoven wool shawl, Hokkaido botanical-dyed silk scarf, warm knitted wool socks. Located in an alleyway near the Otaru Canal, the \u0027Tsumugi\u0027 textile and weaving workshop is a signature local handmade fabric art studio. The workshop uses Hokkaido\u0027s seasonal flora (such as white birch bark, lavender, and wild grasses) for natural hand-dyeing, which is then woven step-by-step on traditional handlooms into cozy shawls, scarves, and wool socks. The colors display a soft, natural gradient luster, making every piece a unique work of handmade art. Wearing them provides not only great warmth, but also a comforting sense of Hokkaido\u0027s soothing nature.", "name": "Otaru Textile \u0026 Weaving Workshop Tsumugi", "transport": "About a 12-minute walk from JR Otaru Station, near Otaru Canal"}, {"address": "3-18 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Hokkaido snow anti-slip lightweight snow boots, handmade wool felt beret, Hokkaido snowproof waterproof ankle boots. This select apparel and footwear boutique, located in the core tourist area of Sakaimachi, is specially curated for Hokkaido\u0027s harsh cold and snowy conditions. The store features a curated selection of snow boots and waterproof footwear combining \u0027snow anti-slip functionality\u0027 with \u0027Japanese fashion style,\u0027 complete with retractable ice cleats for safer walking on icy roads. In addition, it brings together handmade wool felt berets and warm gloves created by local Hokkaido designers\u2014making it the ideal spot for travelers to gear up with stylish, warm protection against Otaru\u0027s cold winds.", "name": "Otaru Footwear \u0026 Hat Select Boutique", "transport": "About a 13-minute walk from JR Minami-Otaru Station"}], "name": "Popular Local Clothing, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "7-16 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.5 Stars | Must-Buy List: Double Fromage, Royal Montagne (Royal Camellia Black Tea Chocolate), Otaru Ironai Biscuits. Located at a landmark building on the Sakaimachi Street intersection, it features a free rooftop observation deck overlooking Otaru\u0027s cityscape. The signature Double Fromage cheesecake blends fresh Hokkaido cream with Italian Mascarpone for exquisite melt-in-your-mouth layers. The Royal Montagne chocolates offer elegant floral and fruity tea aromas\u2014a must-buy souvenir representing the pinnacle of Otaru sweets.", "name": "LeTAO Main Store", "transport": "About 5-7 mins walk from JR Minami-Otaru Station, or about 20 mins walk from JR Otaru Station along Sakaimachi Street"}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Marusei Butter Sandwich, Strawberry Choco, Rokko no Tsuyu (Liqueur Bonbons). Housed in an elegant converted historic stone warehouse, the first floor is a souvenir shop while the second floor offers a seating area. The signature Marusei Butter Sandwich combines 100% Hokkaido raw milk butter, rich rum raisins, and crispy biscuits\u2014an all-time favorite Hokkaido souvenir. The Strawberry Choco, featuring whole freeze-dried strawberries coated in chocolate, is both delicious and visually stunning.", "name": "Rokkatei Otaru Canal Store", "transport": "About 10 mins walk from JR Minami-Otaru Station"}, {"address": "7-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Hokkaido Kaitaku Okaki Rice Crackers (Scallop/Sweet Shrimp flavors), Yousei no Mori Baumkuchen, Yume Fushigi Giant Cream Puffs. Located in a historic stone building next to Rokkatei, this shop is famous for Kaitaku Okaki made from Hokkaido glutinous rice and local seafood like scallops and sweet shrimp. Aged over a 7-day process, they are ultra-crispy and bursting with savory umami\u2014perfect as a drink accompaniment or snack. The Yousei no Mori Baumkuchen is carefully baked with select Hokkaido ingredients for a dense, moist texture.", "name": "Kitakaro Otaru Main Store", "transport": "About 10 mins walk from JR Minami-Otaru Station"}, {"address": "5-27 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Sanporoku White Birch Baumkuchen, Anbota Red Bean Butter Sandwich Biscuits, Otaru-Exclusive Salmon Birch Cake. A long-established Hokkaido confectionery brand, Ryugetsu is famous for its Sanporoku Baumkuchen shaped like white birch bark, coated with swirled milk and white chocolate over a rich, moist cake. The Otaru branch offers a variety of beautifully packaged gift boxes at reasonable prices, making it ideal for buying in bulk to share with family and friends.", "name": "Ryugetsu Otaru Sweet Box Store", "transport": "About 12 mins walk from JR Minami-Otaru Station"}, {"address": "3-7 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Panroll (Fried Fish Paste wrapped in Bread), Cheese Hiraten Fish Cake, Freshly Fried Squid Kamaboko. Founded in 1905, this century-old kamaboko (fish cake) shop serves iconic soul food loved by Otaru locals. Their exclusive signature item, \u0027Panroll\u0027, wraps fresh fish paste in a thin slice of bread fried to golden perfection\u2014crispy on the outside, soft and savory on the inside. Vacuum-packed chilled gift boxes are available, making it the top choice for savory souvenirs to enjoy back at your hotel or take home.", "name": "Kamaei Kamaboko Main Store", "transport": "About 15 mins walk from JR Otaru Station, or about 5 mins walk from Otaru Canal"}, {"address": "4-15 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Gourmet Kombu for Tofu Soup, 7-Spice Kombu Chips, 100-Year Longevity Shredded Kombu. A highly unique local shop specializing in premium Rishiri kelp (kombu) from Hokkaido and processed kombu snacks. With the cheerful motto \u0027Eat this and live to 100!\u0027, the store offers plenty of free samples and hot kombu tea tasting. High-quality kelp is transformed into crispy savory snacks and soup stocks\u2014addictively tasty, nutritious, and healthy. It\u0027s a cherished local specialty favored by locals and foodies alike.", "name": "Rishiriya Ririan Main Store", "transport": "About 12 mins walk from JR Minami-Otaru Station"}, {"address": "1-1-12 Ironai, Otaru, Hokkaido (Inside Otaru Canal Bus Terminal)", "feature": "\u2b50 4.2 Stars | Must-Buy List: Traditional Panj\u016b Gift Box (Tokachi Red Bean, Custard, Caramel Raw Cheese flavors), Nostalgic Otaru Crispy Pancakes. Located inside the Otaru Canal Bus Terminal, Panj\u016b is an iconic traditional Otaru street snack passed down since the Meiji era, featuring a thin, crispy outer crust packed with rich fillings. In addition to enjoying them hot on the spot, you can purchase attractive souvenir boxes; a quick warm-up in the microwave or oven recreates the crisp-outside, soft-inside texture for a nostalgic taste of Otaru.", "name": "Kawataya Otaru Main Store", "transport": "About 10 mins walk from JR Otaru Station along Chuo-dori towards the canal"}, {"address": "5-22 Sakaimachi, Otaru, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: Pathos-Exclusive Strawberry Cheese Tart, Yubari Melon Double Fromage, Freshly Baked Mille-Feuille. Pathos is LeTAO\u0027s largest flagship store on Sakaimachi Street, taking its name from the Greek word for emotion and passion. Alongside classic best-sellers, it offers exclusive shop-only souvenir snacks like Yubari Melon Double Fromage and specialty biscuit gift boxes, making them highly unique and memorable gifts.", "name": "LeTAO Pathos", "transport": "About 10 mins walk from JR Minami-Otaru Station"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "11-1 Chikko, Otaru City, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Discount Japanese brand clothing, Hokkaido-exclusive general goods, trendy footwear. As the largest ocean-view shopping complex in the Otaru area, located right next to the harbor, it houses AEON Department Store, various Japanese brand outlet stores, and big-box retailers. The spacious layout offers an excellent shopping experience, making it the top multi-purpose shopping destination for daily necessities, discounted fashion, and affordable goods when traveling from downtown Otaru.", "name": "Wing Bay Otaru", "transport": "Directly connected to JR Otaru-Chikko Station, about a 1-minute walk from the exit"}, {"address": "7-26 Sakaimachi, Otaru City, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted minor-imperfection soy sauce bottles, handmade colorful glass cups, seasonal glass ornaments. A specialized glass outlet located in the Sakaimachi Street shopping district, offering Kitaichi Glass handmade glassware with minor blemishes or out-of-season items at fantastic 30% to 70% off discounts. Despite being outlet quality, the products feature exceptional craftsmanship with barely noticeable imperfections, making it a must-visit treasure trove for bargain hunters.", "name": "Kitaichi Glass Outlet", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "7-26 Sakaimachi, Otaru City, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: No-drip soy sauce bottles, double-walled colorful crystal glass cups, kerosene lamp-style ornaments. Housed in a converted historical stone warehouse, this large specialty craft department store is divided into three main shopping areas: Japanese, Western, and Crystal. Retaining original canal freight tracks and illuminated by atmospheric kerosene lamps inside, it boasts the most comprehensive collection of handmade glassware and lifestyle goods in Otaru, standing as Sakaimachi Street\u0027s most iconic local shopping landmark.", "name": "Kitaichi Glass No.3 Building", "transport": "About a 10-minute walk from JR Minami-Otaru Station"}, {"address": "4-1 Sumiyoshicho, Otaru City, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Steam clock limited-edition music boxes, Fortune Cat-shaped music boxes, customized handmade music boxes. Otaru\u0027s most famous flagship music box store features the world-renowned Steam Clock at its entrance. Housed in a historic three-story red brick building, it displays and sells over 30,000 music boxes ranging from fine wood carvings and crystal glass to vintage metal designs, making it the top choice for premium Otaru souvenirs and gifts.", "name": "Otaru Music Box Museum Main Building", "transport": "About a 5-minute walk from JR Minami-Otaru Station"}, {"address": "5-22 Sakaimachi, Otaru City, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Double Fromage Cheesecake, Black Tea Chocolate Langue de Chat, Pathos-exclusive freshly made Souffl\u00e9 Pancakes. Located at the center of the Sakaimachi Street district, this is famous confectionery brand LeTAO\u0027s expansive flagship store in Otaru. The first floor features a massive souvenir dessert shop offering a complete range of room-temperature and frozen gift sets, while the second floor houses a spacious cafe with scenic views, perfect for one-stop shopping and relaxing.", "name": "LeTAO Pathos Flagship Store", "transport": "About an 8-minute walk from JR Minami-Otaru Station"}, {"address": "1-1-8 Ironai, Otaru City, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Taisho-style Japanese glass wind chimes, handmade Kiriko glass cups, colorful glass accessories and trinkets. Located in a Meiji-era stone building along the Otaru Canal, this store preserves traditional glasscraft techniques from Japan\u0027s Taisho period. More than just a retail store, it feels like a craft exhibition center specializing in exquisite Japanese-style glassware that combines practicality with elegant artistry, beloved by visitors who appreciate fine craftsmanship.", "name": "Otaru Taisho Glass Main Shop", "transport": "About a 10-minute walk from JR Otaru Station"}, {"address": "2-1-20 Ironai, Otaru City, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Local Otaru wine/sake, dried seafood souvenirs, Otaru Canal-themed cultural creative merchandise. Located inside the Former Otaru Warehouse, this large local products shopping center is operated by the Otaru City Tourist Association. Bringing together the most comprehensive selection of local specialties from Otaru and the Shiribeshi region\u2014including locally brewed sake, famous snacks, and handmade crafts\u2014it is the ultimate venue to explore and buy authentic local produce and seafood products.", "name": "Otaru Canal Plaza (Otaru City Tourist Information and Local Products Center)", "transport": "About an 8-minute walk from JR Otaru Station"}, {"address": "3-7 Sakaimachi, Otaru City, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Freshly fried Pan-roll (breaded fish paste roll), limited-edition cheese kamaboko, assorted fish cake gift sets. A nearly century-old shop famous for fish paste products in Otaru, featuring a spacious flagship store and factory. Visitors can watch the kamaboko manufacturing process through glass windows, while the shop offers dozens of freshly fried delicious fish cakes and chilled gift boxes, attracting locals and tourists alike for a major shopping spree. It\u0027s an unmissable culinary shopping stop in Otaru.", "name": "Kamaei Kamaboko Factory \u0026 Main Store", "transport": "About a 12-minute walk from JR Otaru Station"}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Otaru Canal and Sakaimachi Street"}, "sapporo_station_odori": {"categories": {"cat_1": {"items": [{"address": "B1F Center, Sapporo Stellar Place, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy: White Tea Eau de Parfum, Sake Kasu Lotion, Savon Body Milk. Originating from Sunagawa, Hokkaido, this top-tier Japanese natural beauty brand focuses on using natural fruits, vegetables, and local botanical ingredients. Located in Stellar Place at Sapporo Station, this store exudes a minimalist, high-end aesthetic while filled with elegant natural scents. The brand\u0027s signature White Tea and Savon series offer fresh and long-lasting fragrances, while the hydrating toner made from local Hokkaido sake kasu (sake lees) is a star product for achieving radiant skin, making it immensely popular among local women and tourists alike.", "name": "SHIRO \u672d\u5e4cStellar Place\u5e97 (SHIRO Sapporo Stellar Place)", "transport": "Directly connected to JR Sapporo Station, approx. 1-minute walk"}, {"address": "3-20 Minami 2-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy: Lifetrim Bath Salt, Hokkaido Limited Horse Oil Balm, Satsudora Private Brand Fermented Whitening Mask. Satsudora (Sapporo Drugstore) is Hokkaido\u0027s leading local drugstore chain, and its flagship store in Odori is bright, spacious, and extremely well-stocked. The store features a dedicated \u0027Hokkaido Limited Cosmetics Area\u0027 showcasing exclusive skincare products enriched with local natural ingredients. Beyond popular mainstream cosmetics, you can find in-house developed skincare and pharmaceutical items available exclusively in Hokkaido, making it the top destination for discovering local beauty treasures in the Odori shopping district.", "name": "\u30b5\u30c4\u30c9\u30e9 \u672d\u5e4c\u5927\u901a\u5e97 (Satsudora Sapporo Odori Store)", "transport": "Approx. 2-minute walk from Exit 9 of Sapporo Municipal Subway Odori Station"}, {"address": "B1F APIA Underground Shopping Center, Sapporo Station, Kita 5-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Must-buy: Pure Horse Oil Cream, Lavender Horse Oil Handmade Soap, Essence Horse Oil Sheet Mask. A local Hokkaido specialty store for pure natural horse oil crafted specifically for cold, dry climates, located in the APIA underground shopping mall at Sapporo Station. Emphasizing 100% refined, high-quality pure horse oil with zero artificial fragrances or chemical additives, its texture is gentle and easily absorbed. The horse oil cream and handmade soaps infused with Furano lavender essential oil not only provide intense moisture retention but also release a soothing herbal scent\u2014a must-have miracle skincare product for combating dry autumn and winter skin.", "name": "\u5317\u6d77\u9053\u99ac\u6cb9\u672c\u8217 APIA\u5e97 (Hokkaido Horse Oil Honpo APIA)", "transport": "Directly connected to JR Sapporo Station underground mall, located inside APIA Shopping Street"}, {"address": "B1F Center, Sapporo Stellar Place, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.7 stars | Must-buy: Hokkaido Calendula All-Purpose Soothing Cream, Japanese Mint Cooling Body Mist, Japanese Mint Shampoo. Natural Island is an organic skincare brand born in Hokkaido, dedicated to using organically cultivated local botanicals as its core ingredients. Beloved by locals who prefer natural skincare, its flagship Calendula series uses calendula grown in Monbetsu, Hokkaido, offering exceptional soothing benefits for sensitive skin. Meanwhile, skincare and hair products crafted with local Japanese mint provide a refreshing cool touch, paired with charming minimalist packaging that makes them stylish and thoughtful souvenirs.", "name": "Natural Island \u672d\u5e4cStellar Place\u5e97 (Natural Island Sapporo Stellar Place)", "transport": "Directly connected to JR Sapporo Station, approx. 1-minute walk"}, {"address": "1F-2F Le Trois, Odori Nishi 1-chome 13, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy: LIPS \u0026 HIPS Hand Cream, DAZZSHOP Eyeshadow Gel, Hokkaido Kelp Ultra-Moisturizing Sheet Mask. Headquartered in Sapporo, Ainz \u0026 Tulpe is an iconic Japanese beauty mega-store. Occupying multiple floors in the Le Trois building in Odori, this store is a true beauty paradise. Clearly categorized by skin concerns and trends, it features popular domestic and international makeup, department store-grade skincare, exclusive brands, and its own private label \u0027LIPS \u0026 HIPS\u0027. It\u0027s a must-visit destination for anyone looking to stock up on trendy cosmetics and hidden local gems all in one place.", "name": "Ainz \u0026 Tulpe \u672d\u5e4c Le Trois \u5e97 (Ainz \u0026 Tulpe Sapporo Le Trois)", "transport": "Directly connected to Exit 24 of Sapporo Municipal Subway Odori Station"}, {"address": "3F East, Sapporo Stellar Place, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy: Oh! Baby Body Smoother, Echigo Camellia Moisturizing Cream, Hokkaido Haskap Berry Limited Edition Lip Balm. Specializing in natural plant-based body care and skincare, House of Rose operates a highly popular counter in the Sapporo Station complex. Its best-selling \u0027Oh! Baby\u0027 Body Smoother has won numerous beauty awards for years, leaving skin feeling silky smooth with a gentle touch. The store frequently releases limited-edition fragrances and skincare items infused with local Hokkaido ingredients (such as Haskap berries or lavender), receiving glowing reviews from both local Japanese shoppers and tourists.", "name": "House of Rose \u672d\u5e4cStellar Place\u5e97 (House of Rose Sapporo Stellar Place)", "transport": "Directly connected to JR Sapporo Station, approx. 2-minute walk"}, {"address": "3-1-41 Kita 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy: Kurashi Rhythm Derm-grade Ultra-Moisturizing Cream, Hokkaido Limited Edition Sekkisei Set, Gokujyun Sunscreen. Originating in Asahikawa, Hokkaido, Tsuruha Drug is one of Japan\u0027s largest drugstore chains. Located on Sapporo Ekimae-dori, this store offers unmatched convenience and a wide array of pharmaceuticals, cosmetics, and health supplements. Featuring a professional beauty consultation counter and stocked with Tsuruha\u0027s high-quality, cost-effective in-house brand \u0027Kurashi Rhythm,\u0027 it is an indispensable local drugstore landmark for shopping beauty and health products in Sapporo.", "name": "\u9db4\u7fbd\u85e5\u7ca7 \u672d\u5e4c\u7ad9\u524d\u901a\u5e97 (Tsuruha Drug Sapporo Ekimae-dori)", "transport": "Approx. 3-minute walk from South Exit of JR Sapporo Station / Directly connected via Sapporo Underground Pedestrian Space (Chi-Ka-Ho)"}, {"address": "1F Center, Sapporo Stellar Place, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy: Celvoke Dignified Lips, F Organics Deep Moisture Lotion, N organic Vie Enriched Lift Cream Oil. Cosme Kitchen is a select shop in Japan curated with organic and natural beauty products from around the world and local artisans, located in Sapporo Stellar Place. It carefully selects skin-friendly makeup and skincare brands made with organic botanical ingredients, including many local Hokkaido brands that highlight local natural components. With a cozy atmosphere and knowledgeable staff, it is the top shopping destination in Sapporo for clean beauty enthusiasts and those with sensitive skin.", "name": "Cosme Kitchen \u672d\u5e4cStellar Place\u5e97 (Cosme Kitchen Sapporo Stellar Place)", "transport": "Directly connected to JR Sapporo Station, approx. 1-minute walk"}], "name": "Iconic Local Cosmetics \u0026 Drugstores"}, "cat_2": {"items": [{"address": "6F, Daimaru Sapporo, Kita 5-jo Nishi 4-chome 7, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buys: Saddle leather long wallets, classic top-grain leather tote bags, handcrafted horse-head keychains. Hokkaido\u0027s only royal saddlery manufacturer transformed into a premier luxury leather brand. Renowned for its durable saddlery stitching techniques, it is beloved by local gentlemen, ladies, and leather enthusiasts alike. Crafted in Sunagawa City, Hokkaido, their leather goods offer an exceptional feel that develops a richer patina over time.", "name": "SOM\u00c8S SADDLE Daimaru Sapporo", "transport": "Directly connected to JR Sapporo Station (6th Floor, Daimaru Sapporo)"}, {"address": "2-1, Minami 2-jo Nishi 8-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.7 stars | Must-Buys: Tenkara fishing technical jackets, signature trout-print mesh tote bags, fleece-lined warm fishing hats. Born in Sapporo, Hokkaido, this top-tier outdoor streetwear brand derives its name from its local address. Fusing traditional Japanese fly fishing aesthetics with urban street style, it is a sacred spot for local fashion lovers and outdoor enthusiasts.", "name": "South2 West8 Sapporo Flagship Store", "transport": "Approx. 8-minute walk from Odori Subway Station / 2-minute walk from Nishi 8-Chome Tram Stop"}, {"address": "1F, Daiichi Kaitaku Building, Minami 3-jo Nishi 8-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.8 stars | Must-Buys: Anatomica classic slim-fit jeans, vintage French workwear jackets, Alden collaboration Shell Cordovan shoes. A landmark independent vintage and curated select shop in Sapporo, specializing in historic European vintage wear and premium men\u0027s clothing and footwear. The space exudes a rich British and French artisan ambience, perfect for refined fashion tastes.", "name": "ARCH Sapporo Main Store", "transport": "Approx. 7-minute walk from Odori Subway Station / 3-minute walk from Shiseikan Elementary School Tram Stop"}, {"address": "Center 5F, Sapporo STELLAR PLACE, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buys: Jalan Sriwijaya Goodyear welted handmade shoes, Blundstone water-repellent leather ankle boots, Made-in-Japan casual canvas sneakers. A well-known local footwear boutique located inside JR Tower, specializing in stylish yet comfortable shoes for men and women. They feature a carefully selected range of durable, slip-resistant boots ideal for walking in Hokkaido\u0027s snow and rain.", "name": "SHOE LIBRARY Sapporo STELLAR PLACE", "transport": "Directly connected to JR Sapporo Station (5th Floor, Stellar Place Center)"}, {"address": "1F, AS Building, Minami 1-jo Nishi 12-chome 4-182, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buys: Original Hokkaido linen comfy dresses, handmade wool scarves, handcrafted leather \u0026 canvas tote bags. Hidden in an alley of the Odori shopping district, this minimalist lifestyle select shop crafts its own natural handmade soaps and features comfortable natural-fabric clothing and unique bags by independent local designers from Hokkaido and Japan.", "name": "Siesta Labo.", "transport": "3-minute walk from Exit 2 of Nishi 11-Chome Station on the Sapporo Tozai Subway Line"}, {"address": "1F-2F, Minami 1-jo Nishi 3-chome 3-11, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buys: BEAMS Sapporo exclusive windproof outdoor jackets, collaboration canvas totes, casual wool scarves. An iconic Japanese select shop located near Odori Park. Spanning two spacious floors in its own building, it frequently stocks functional yet stylish down jackets, trendy shoes, and bags specifically curated for Hokkaido\u0027s harsh winter weather.", "name": "BEAMS Sapporo", "transport": "1-minute walk from Exit 17 of Odori Subway Station"}, {"address": "Center 3F, Sapporo STELLAR PLACE, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buys: DANTON French workwear warm down jackets, ORCIVAL classic striped shirts, BRADY retro canvas messenger bags. Championing the concept of \u0027Everyday Classic,\u0027 this famous Japanese select shop is adored by local youth and style-conscious professionals. It carefully curates timeless, high-quality clothing and durable bags from around the world.", "name": "Bshop Sapporo STELLAR PLACE", "transport": "Directly connected to JR Sapporo Station (3rd Floor, Stellar Place Center)"}, {"address": "Center 3F, Sapporo STELLAR PLACE, Kita 5-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buys: Bone-print embroidered souvenir jackets, smiley face patch jeans, smiley face print canvas bags. A highly iconic Japanese brand representing Kojima denim and vintage ethnic fashion. Known for its unique indigo dyeing techniques and American vintage silhouettes, the store\u0027s wild, artistic displays draw fashion lovers seeking unique treasures.", "name": "KAPITAL Sapporo STELLAR PLACE", "transport": "Directly connected to JR Sapporo Station (3rd Floor, Stellar Place Center)"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "0-1, Kita 5-jo Nishi 6-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: Marusei Butter Sandwiches, Frost Tatami Custard Pies, Freeze-dried Strawberry Chocolates. As Hokkaido\u0027s most famous local confectionery brand, the Sapporo Main Store boasts elegant decor and exclusive store-only items. The iconic Marusei Butter Sandwich is made with butter crafted from 100% raw Hokkaido milk, paired with rich raisins and white chocolate. Soft, buttery, and incredibly flavorful, it is an absolute top-rated souvenir you cannot miss when visiting Sapporo.", "name": "Rokkatei Sapporo Main Store", "transport": "Approx. 5-minute walk from the South Exit of JR Sapporo Station"}, {"address": "1-2, Kita 1-jo Nishi 5-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Yume Fushigi Custard Cream Puffs, Hokkaido Kaitaku Rice Crackers, Fairy Forest Baumkuchen. The store is housed in a renovated century-old former Hokkaido Library, filled with romantic Renaissance architectural vibes. A must-buy, the Kaitaku Rice Crackers are crafted from Hokkaido glutinous rice and seafood, featuring authentic flavors like scallop, sweet shrimp, and Esashi sockeye salmon. Savory, crispy, and addictive, they are the ultimate local snack to pair with beer.", "name": "Kitakaro Sapporo Honkan", "transport": "Approx. 5-minute walk from Exit 5 of Odori Subway Station"}, {"address": "Corner of Kita 4-jo Nishi 3-chome Intersection, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Soy Sauce Marinated Salmon Roe, Giant Seafood Rice Balls, Smoked Salmon Sticks. Hokkaido\u0027s most representative local brand for processed seafood, specializing in premium aquatic products and seafood gifts. Prime-located right in front of the station, their soy-sauce marinated salmon roe features wild salmon with plump, sweet eggs\u2014perfect for enjoying in your hotel room or taking home. Their chilled seafood rice balls are also a sought-after daily limited local delicacy.", "name": "Sato Suisan Sapporo Station Main Store", "transport": "Approx. 1-minute walk from the South Exit of JR Sapporo Station"}, {"address": "1F Odori Nishi 4 Bldg, 4-61 Nishi, Odori, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Shiroi Koibito Cookies, Mifuyu Mille-Feuille, Saqu Langue de Chat Cookies. The flagship store of famous Shiroi Koibito maker ISHIYA in the Odori shopping district. Beyond the iconic Shiroi Koibito, the trendy sub-brand Saqu Langue de Chat cookies are highly recommended, featuring flavors like Hokkaido matcha, milk, and hazelnut. Elegant packaging makes it an exquisite, high-end gift.", "name": "ISHIYA Odori Nishi 4 Store", "transport": "Directly connected via Odori Subway Station Underground Walkway"}, {"address": "1F Hokuyo Odori Center, 3-7 Nishi, Odori, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Sapporo Nougakkou Milk Cookies, Premium Baked Cheese Tarts, Super Rich Milk Soft Serve. A renowned Hokkaido confectionery shop. Their famous \u0027Sapporo Nougakkou Milk Cookies\u0027 are officially certified by Hokkaido University, baked using pure Hokkaido wheat and fresh milk. Rich in dairy flavor and melt-in-your-mouth tender, affordable and individually wrapped, they are the top choice for office souvenir treats.", "name": "Kinotoya Odori Koen Store", "transport": "Direct access from Exit 7 of Odori Subway Station"}, {"address": "4-15 Nishi, Odori, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy list: Sanpouroku White Birch Baumkuchen, Anbatasan Butter Red Bean Sandwiches, Bofurin Nut Tarts. A historic confectionery maker originating from Tokachi, Hokkaido. The iconic \u0027Sanpouroku\u0027 Baumkuchen uses white and milk chocolate to replicate the pattern of white b
