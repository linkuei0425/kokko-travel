irch bark. Crisp on the outside and moist on the inside, it offers great value and strong local flavor, winning the hearts of Hokkaido locals.", "name": "Ryugetsu Odori Store", "transport": "Approx. 2-minute walk from Odori Subway Station"}, {"address": "West Concourse, inside JR Sapporo Station, Kita 6-jo Nishi 4-chome, Kita-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Yubari Melon Pure Juice Jellies, SHINYA Furano Snow Cheese Cake, Hokkaido Limited Kaitaku Beer. Located inside Sapporo Station, this official Hokkaido specialty shop brings together the most complete collection of local products and small-farm specialties from across Hokkaido\u0027s cities and towns. You can shop for authentic regional snacks and specialties in one place without traveling around the entire island, making it the best shopping hub for tourists.", "name": "Hokkaido Dosanko Plaza Sapporo", "transport": "Directly outside the West Ticket Gate of JR Sapporo Station"}, {"address": "13-2, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo-shi, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: Northman Whipped Cream Red Bean Pie, Yama Oyaji Bear Rice Crackers, Senshuan Baumkuchen. Established in 1921, this century-old traditional confectionery store is a Sapporo staple. The signature item \u0027Northman\u0027 features Hokkaido red bean paste wrapped in dozens of flaky pie layers. The newly launched \u0027Fresh Cream Northman\u0027 incorporates rich whipped cream for an upgraded, multi-layered texture, making it a hot commodity that locals and tourists queue up to buy.", "name": "Sapporo Senshuan Main Store", "transport": "Approx. 3-minute walk via the underground walkway from Odori or Susukino Subway Station"}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-7-6 Omagari Saiwaicho, Kitahiroshima, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Out-of-season BEAMS apparel, Mont-bell extreme outdoor jackets, Le Creuset cast iron pots. As the largest outlet mall in Hokkaido, it boasts over 180 international and domestic Japanese brands. Designed as an all-weather indoor facility completely unaffected by snowy seasons, it features incredible discounts on popular Japanese fashion brands like Urban Research and United Arrows. The food court also serves renowned Freesia pork bowls and Sapporo ramen, making it an unmissable shopping sanctuary when visiting Sapporo.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "Take a direct express bus from JR Sapporo Station Bus Terminal; arrives in about 45 minutes."}, {"address": "4-7 Kita 5 Jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: SNOW CHEESE limited-edition cheese biscuits, Kitakaro Yume Fushigi cream puffs, Shiseido Hokkaido-exclusive cosmetics. Directly connected to JR Sapporo Station, this is Hokkaido\u0027s top-tier department store with the highest sales volume and most comprehensive brand lineup. The basement food hall (Depachika) is a dessert lover\u0027s paradise, drawing long queues before opening every day for seasonal limited Hokkaido cheese sweets and fresh seafood bento boxes. It\u0027s the premier destination for souvenirs and international luxury brands.", "name": "Daimaru Sapporo", "transport": "Directly connected to JR Sapporo Station, about a 1-minute walk."}, {"address": "Kita 5 Jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: SHIRO herbal moisturizing perfume, Rokkatei raisin butter sandwich cookies, Journal Standard Hokkaido exclusive collaboration jackets. Serving as the core of the JR Tower shopping complex, it gathers trendsetting fashion, lifestyle goods, and local specialty brands hugely popular among young Japanese people. A special recommendation goes to SHIRO, a renowned natural skincare brand originating from Sunagawa, Hokkaido; its elegant, minimal packaging and natural fragrances are absolute must-buy souvenirs for tourists.", "name": "Sapporo STELLA PLACE", "transport": "Directly connected to JR Sapporo Station, and directly connected to Sapporo Station on the Namboku and Toho Subway Lines."}, {"address": "Minami 1 Jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Ichijo Bikodo traditional wagashi, Hokkaido fine woodcarving crafts, Shiseido Hanatsubaki series skincare. Established in 1872, it is Hokkaido\u0027s most historic and deeply cherished homegrown department store. Divided into the Odori Building and Ichijo Building, it is deeply trusted by long-time local residents. Inside, the \u0027Dosanko Plaza\u0027 section is dedicated to showcasing local Hokkaido agricultural specialties and artisan handicrafts, offering the most authentic local products.", "name": "Marui Imai Sapporo Main Store", "transport": "Directly connected to Odori Station on the Tozai, Namboku, and Toho Subway Lines."}, {"address": "3-8 Minami 1 Jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: ROYCE\u0027 Nama Chocolate (liquor limited edition), Ryugetsu Sanpouroku Baumkuchen, Hokkaido marinating salmon roe gift boxes. Located at the prime intersection of the Odori commercial district, this classic department store brand exudes elegance and sophistication. The basement fresh food and souvenir area gathers premium desserts and fresh delicacies from across Hokkaido. Offering excellent service quality and smooth tax-refund procedures, it is highly favored by travelers seeking a refined shopping environment and top-tier gourmet food.", "name": "Sapporo Mitsukoshi", "transport": "Directly connected to Odori Station on the subway, about a 1-minute walk."}, {"address": "Kita 2 Jo Higashi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: Sapporo Kaitakushi Beer Brewery replica beer, Snow Peak outdoor gear, Hokkaido handcrafted ceramics. A massive shopping complex repurposed from Japan\u0027s oldest red-brick brewery buildings. Its signature glass atrium is filled with greenery and historical atmosphere. The center houses Hokkaido\u0027s most extensive selection of outdoor sports brands and local artisan lifestyle shops, allowing visitors to soak in the rich spirit of Hokkaido\u0027s pioneer history while shopping.", "name": "Sapporo Factory", "transport": "About a 5-minute walk from Exit 8 of Bus Center-Mae Station on the Toho Subway Line."}, {"address": "Kita 4 Jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.0 stars | Must-Buy List: Tsuboya Sohonten Nama Chocolate cookies, Hands in-store limited daily goods, Hokkaido lavender soothing essential oils. Located at the south exit of Sapporo Station, this budget-friendly, welcoming department store has operated for many years. It features a large Hands store, alongside flagship stores for UNIQLO and GU. The B1 food hall houses numerous historic local Hokkaido confectionery stalls. With its spacious layout, it\u0027s ideal for families to comfortably browse daily necessities and local treats.", "name": "Tokyu Department Store Sapporo", "transport": "About a 3-minute walk from the South Exit of JR Sapporo Station, directly connected to Sapporo Station on the Toho Subway Line."}, {"address": "3-20 Minami 2 Jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: Selected Hokkaido cheese platter, AOAO SAPPORO exclusive penguin merchandise, Rain Coffee single-origin roasted beans. Opened in 2023 as Odori Tanukikoji\u0027s newest landmark, it combines shopping, dining, and the urban aquarium AOAO SAPPORO. The facility introduces several stylish boutique shops making their Hokkaido debut along with high-quality local cafes and light bites. With underground access connecting Tanukikoji and Odori Station, it serves as a new-generation shopping hot spot blending modern fashion with local lifestyle.", "name": "moyuk SAPPORO", "transport": "About a 3-minute walk from Odori Subway Station, or directly connected via Tanukikoji Shopping Street."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Sapporo Station and Odori Shopping District"}, "susukino_tanukikoji": {"categories": {"cat_1": {"items": [{"address": "14, Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 Stars | Must-Buy List: Satudora In-House Horse Oil Moisturizing Cream, Hokkaido Lavender Soothing Mask. As Hokkaido\u0027s most iconic home-grown drugstore chain, Satudora boasts a flagship store in Tanukikoji 5-Chome. Beyond its exceptionally comprehensive stock of cosmetics and pharmaceuticals, it is best known for offering an abundance of Hokkaido-exclusive skincare products and locally developed items. The spacious, bright interior offers effortless tax-free processing and multilingual assistance, making it the top destination for tourists seeking authentic local Hokkaido beauty products.", "name": "Satudora Tanukikoji 5-Chome Store", "transport": "Approx. 3-min walk from Sapporo Streetcar \u0027Shiseikan-Shogakko-Mae Station\u0027, or 5-min walk from Subway \u0027Odori Station\u0027."}, {"address": "12, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 Stars | Must-Buy List: LuLuLun Hokkaido-Exclusive Yubari Melon Sheet Mask, Hokkaido-Exclusive Lavender Steam Eye Mask. Originating from Asahikawa, Hokkaido, Tsuruha Drug is a local giant deeply rooted in the lives of Hokkaido residents. Prime-located in Tanukikoji 3-Chome, this branch carries a complete selection of popular beauty and skincare goods. In addition to major Japanese brands, it features a massive \u0027Hokkaido Limited Beauty Zone\u0027 stocked with sheet masks, hand creams, and essential oils made from local ingredients\u2014making it a legendary hub for local beauty finds.", "name": "Tsuruha Drug Tanukikoji 3-Chome Store", "transport": "Approx. 3-min walk from Subway Namboku Line \u0027Susukino Station\u0027."}, {"address": "Minami 3-jo Nishi 5-chome, Chuo-ku, Sapporo, Hokkaido (Inside Tanukikoji 5-Chome Arcade)", "feature": "\u2b50 4.7 Stars | Must-Buy List: 100% Pure Horse Oil Ultra-Moisturizing Cream, Natural Lavender Horse Oil Hand Cream. A benchmark brand for natural Hokkaido skincare, Hokkaido Pure Horse Oil Honpo insists on high-quality local ingredients. Horse oil offers exceptional skin affinity and deep penetration, perfect for combatting dry climates. Friendly staff provide hands-on testers for all products along with expert advice on application techniques and skincare routines. Their fragrance-free natural horse oil and lavender-scented varieties are massive hits with Tanukikoji travelers.", "name": "Hokkaido Pure Horse Oil Honpo Tanukikoji Store", "transport": "Approx. 4-min walk from Subway \u0027Odori Station\u0027 or \u0027Susukino Station\u0027."}, {"address": "1-1, Minami 3-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 Stars | Must-Buy List: DAZZSHOP Single Eyeshadow, Botanical First Cleansing Oil. Headquartered in Sapporo, Ainz \u0026 Tulpe is an ultra-popular, trendy beauty concept store born in Hokkaido and beloved by Japanese women. The 2-Chome location spans two brightly lit, stylish floors packed with curated indie makeup brands and natural botanical skincare hard to find in standard drugstores. With its exclusive domestic cosmetics and high-quality drugstore lines, it\u0027s a paradise for shoppers seeking chic, trendy beauty essentials.", "name": "Ainz \u0026 Tulpe Tanukikoji 2-Chome Store", "transport": "Approx. 1-min walk from Subway Toho Line \u0027Odori Station\u0027 Exit 35."}, {"address": "12-1, Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Hokkaido Limited Lavender Hyaluronic Acid Mask, Shiseido Anessa Hokkaido Limited Set. Located in Tanukikoji 4-Chome, MEGA Don Quijote is Sapporo\u0027s largest and most comprehensive flagship shopping complex, featuring an entire floor dedicated to beauty products. The store stocks everything from budget-friendly cosmetics to rare Hokkaido-exclusive skincare. Open 24 hours, it offers supreme convenience for late-night shopping sprees, rendered even better when combining coupons with tax-free savings.", "name": "MEGA Don Quijote Sapporo Tanukikoji Beauty", "transport": "Approx. 2-min walk from Subway Namboku Line \u0027Susukino Station\u0027, or 4-min walk from \u0027Odori Station\u0027."}, {"address": "Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido (Counter inside Souvenir Shop at Tanukikoji 3-Chome)", "feature": "\u2b50 4.8 Stars | Must-Buy List: Kitami Natural Mint Oil Spray, Mint Extra-Moisturizing Lip Balm. Hailing from Kitami City, Kitami Mint Oil is Hokkaido\u0027s premier natural skincare heritage brand. This specialized partner counter in Tanukikoji showcases their full lineup of mint-extracted products. Their 100% pure distilled mint oil serves as a soothing refreshing spray, a cooling skin rub, and a natural mosquito repellent. Paired with mint lip balm and mint bath salts, these are top-tier herbal skincare essentials uniquely iconic to Hokkaido.", "name": "Kitami Mint Oil Shop Tanukikoji", "transport": "Approx. 3-min walk from Subway \u0027Susukino Station\u0027."}, {"address": "11, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 Stars | Must-Buy List: KOSE Sekkisei Hokkaido Limited Edition, SHISEIDO ELIXIR Enriched Wrinkle Cream. Located near the entrance of Tanukikoji Shopping Street, this long-established drugstore is renowned for warm hospitality and a wide selection of high-end beauty counters. It features premium Japanese brands like Shiseido, Kose, and Kanebo, along with year-round exclusive discounts and bestseller bundles for overseas visitors. A go-to spot for easily acquiring top-tier Japanese luxury cosmetics and skincare releases.", "name": "Kokumin Drug Tanukikoji Store", "transport": "Approx. 2-min walk from Subway Namboku Line \u0027Susukino Station\u0027."}, {"address": "1-7, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 Stars | Must-Buy List: Matsukiyo Argelan Organic Herbal Lip Balm, BLANC WHITE Whitening Essence. As Japan\u0027s most prominent drugstore giant, Matsumoto Kiyoshi operates a bustling two-story store in Tanukikoji 3-Chome. Alongside mainstream brand cosmetics, the main highlights are its exclusive in-house beauty brands and organic skincare lines. The modern product displays, fast restocks, and multilingual staff ensure an exceptionally smooth and pleasant shopping experience.", "name": "Matsumoto Kiyoshi Tanukikoji 3-Chome Store", "transport": "Approx. 3-min walk from Subway Namboku Line \u0027Susukino Station\u0027."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "2-1, Minami 2-jo Nishi 8-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Must-buy list: Tenkara multi-pocket utility jacket, classic mosquito net printed mesh hoodie, printed tote bag. As a brand under Japanese fashion giant Nepenthes specifically designed for Hokkaido\u0027s outdoor lifestyle, its flagship store is located right near Tanukikoji in Sapporo. The store\u0027s interior blends heavy industrial and camping aesthetic, seamlessly combining outdoor fishing wear with high-end street fashion. It is an iconic original local brand store that global fashion enthusiasts must visit when exploring the Susukino and Tanukikoji shopping districts.", "name": "South2 West8 Sapporo", "transport": "About a 6-minute walk from Sapporo Municipal Subway Tozai Line \u0027Odori Station\u0027 or \u0027Nishi 11-Chome Station\u0027, near Tanukikoji 7-chome exit."}, {"address": "1F Odori Village, Nishi 3-chome 7, Odori, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-buy list: Saddle leather luxury handbag, classic horseshoe-shaped genuine leather coin purse, hand-tanned horsehide long wallet. Hailed as the \u0027Herm\u00e8s of Japan\u0027, SOM\u00c8S SADDLE represents Hokkaido\u0027s top-tier local equestrian gear and leather craftsmanship. Shipped directly from their artisan workshop in Sunagawa, Hokkaido, the Sapporo boutique offers beautifully textured handbags and leather goods. Durable and aging with a gorgeous patina over time, it is highly favored by locals and discerning tourists seeking high-quality regional craft.", "name": "SOM\u00c8S SADDLE Sapporo", "transport": "Directly connected to Sapporo Municipal Subway \u0027Odori Station\u0027, about a 3-minute walk from Tanukikoji 3-chome."}, {"address": "1F Parade Building, 13-2, Minami 2-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Hokkaido Local Camp collaboration moisture-wicking tech T-shirt, warm camping hooded poncho, versatile outdoor crossbody bag. Originating in Hokkaido, this local select shop centers on \u0027integrating Hokkaido\u0027s grand nature into urban lifestyle\u0027 through camping and outdoor casual wear. The store features many emerging Hokkaido designer brands and exclusive collaboration items. Blending windproof/cold-resistant functionality with clean tailoring, it is a favorite among local youth who love gorpcore and outdoor fashion.", "name": "brown floor clothing Sapporo", "transport": "About a 3-minute walk from Sapporo Municipal Subway \u0027Odori Station\u0027 or \u0027Susukino Station\u0027, located next to Tanukikoji 3-chome."}, {"address": "1F Daiichi Hasegawa Building, 11-13, Minami 3-jo Nishi 8-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.7 stars | Must-buy list: Anatomica classic workwear trousers, deadstock European vintage military jacket, Arch original handmade canvas shoulder bag. Tucked away in an alley on the west side of Tanukikoji, Arch is a legendary vintage and high-quality menswear select shop in Sapporo. Rooted in Hokkaido for years, it carefully curates European vintage military wear, French workwear, and premium Japanese artisan heritage clothing, attracting countless style enthusiasts fond of American vintage and European heritage fashion.", "name": "Arch Sapporo", "transport": "About a 7-minute walk from Sapporo Municipal Subway \u0027Nishi 11-Chome Station\u0027, about a 2-minute walk from the end of Tanukikoji 7-chome."}, {"address": "B1F-2F Arche Building, 12-1, Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-buy list: Pre-owned Japanese high-end outdoor brand down jackets, discontinued street-fashion crossbody bags, near-new brand snow boots. Located at the heart of Tanukikoji 4-chome, this is a massive vintage and second-hand apparel chain store in Hokkaido. Due to Hokkaido\u0027s unique winter climate, shoppers can often uncover near-new department-store-grade cold-weather gear, polar outdoor jackets, and rare limited-edition sneakers at very attractive prices\u2014a bargain hunter\u0027s ultimate paradise.", "name": "2nd STREET Sapporo Tanukikoji", "transport": "About a 3-minute walk from Sapporo Municipal Subway \u0027Susukino Station\u0027 or \u0027Odori Station\u0027, located inside Tanukikoji 4-chome."}, {"address": "16, Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Must-buy list: Hokkaido snow-grip boots, water-repellent high-performance casual shoes, Hydro-Tech waterproof leather men\u0027s shoes. A long-standing and trusted specialty shoe store along the Tanukikoji Shopping Street. Especially during autumn and winter, the store stocks up on anti-slip spike snow boots designed specifically for Hokkaido\u0027s icy and snowy terrain alongside ultra-warm footwear. Offering a comprehensive lineup with fantastic cost-performance, it is the top choice for tourists preparing to tackle Hokkaido\u0027s severe winter conditions.", "name": "Shoe Plaza Sapporo Tanukikoji", "transport": "Directly accessible from Sapporo Underground Pedestrian Street Pole Town, or about a 3-minute walk from Subway \u0027Susukino Station\u0027, located in Tanukikoji 3-chome."}, {"address": "1F-2F Tsunotomo Sapporo Building, 1-1, Minami 2-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-buy list: FieldCore ultra-warm cold-proof jacket, ice-and-snow traction grip snow boots, high-tech waterproof hooded raincoat. A functional apparel brand taking Japan by storm due to its exceptional value for money. Its flagship store in Tanukikoji offers a vast selection of affordable outdoor casual wear, warm footwear, and bags. The snow boots and windproof/waterproof jackets are immensely popular with both locals and ski tourists. Delivering high functionality at budget-friendly prices that rival high-end brands, items here frequently spark shopping sprees.", "name": "WORKMAN Girl \u0026 WORKMAN Plus Sapporo Tanukikoji", "transport": "About a 3-minute walk from Sapporo Municipal Subway \u0027Odori Station\u0027, opposite the exit of Tanukikoji 2-chome."}, {"address": "17-2, Minami 3-jo Nishi 2-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-buy list: Nike Hokkaido-exclusive colorway retro sneakers, Danner high-cut snow outdoor boots, Puma collaboration waterproof leather sneakers. As ABC-MART\u0027s highest-tier flagship store, this location in Tanukikoji 2-chome boasts a spacious layout and comprehensive product lineup. Beyond carrying the latest sneaker releases from major international brands, it stocks a wide selection of waterproof and non-slip footwear engineered for Hokkaido\u0027s snow season alongside exclusive limited colorway gear, making it a top choice for local trendsetters and travelers alike.", "name": "ABC-MART GRAND STAGE Sapporo Tanukikoji", "transport": "About a 4-minute walk from Sapporo Municipal Subway \u0027Odori Station\u0027 or \u0027Susukino Station\u0027, located inside Tanukikoji 2-chome."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Minami 3-jo Nishi 4-chome, Chuo-ku, Sapporo, Hokkaido (Tanukikoji 4-chome)", "feature": "\u2b50 4.3 stars | Must-Buy List: Shiroi Koibito chocolate cookies, Jaga Pokkuru, Tanukikoji-exclusive carved wooden tanuki souvenirs. Located in Tanukikoji 4-chome, \"Tanukiya\" is a legendary large-scale souvenir specialty store with decades of history, easily spotted by the giant tanuki statue at the entrance. The store brings together popular snacks and exclusive products from major Hokkaido brands\u2014from Ishiya and Rokkatei to Calbee. Offering tax-free shopping, it is the top choice for tourists to buy all Hokkaido local specialties in one stop.", "name": "Tanukikoji Tanukiya", "transport": "About a 3-minute walk from Odori Station or Susukino Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "17 Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Yama Oyaji milk rice crackers, Baumkuchen, Nama Yukidaruma (fresh snowman confection). Founded in 1921, Senshuan is an iconic century-old confectionery shop in Sapporo, with its main store located near Tanukikoji 3-chome. The signature \"Yama Oyaji\" milk rice cracker features a rich pastry aroma and crisp texture, packaged with a vintage local skiing bear design. The store even features a tea area serving natural underground water, showcasing Sapporo\u0027s warm local hospitality.", "name": "Senshuan Main Store", "transport": "2-minute walk from Exit 17 of Odori Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "4-1 Odori Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Sanpouroku white birch Baumkuchen, Anbata San red bean butter sandwich cookies, Bofurin nut tart. Hailing from Obihiro in Tokachi, Ryugetsu is an immensely popular Hokkaido confectionery brand, with its Sapporo Odori store right next to the Tanukikoji shopping area. The signature \"Sanpouroku\" cleverly uses dark and white chocolate to mimic white birch bark, offering a moist and rich taste; meanwhile, \"Anbata San\" cultured butter sandwich cookies are a viral sensation across Japan. Affordable prices paired with top-tier Tokachi cultured butter make it a hit among locals and tourists alike.", "name": "Ryugetsu Sapporo Odori", "transport": "1-minute walk directly connected to the underground shopping street from Odori Station on the Sapporo Municipal Subway"}, {"address": "5-1-2 Kita 1-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.5 stars | Must-Buy List: Kaitaku Okaki rice crackers (Esashi Scallop flavor), Yumefushigi cream puffs, Yosei no Mori Baumkuchen. Transformed from a former provincial library by architect Tadao Ando, Kitakaro Sapporo Honkan is just a few minutes\u0027 walk from Tanukikoji. The store\u0027s #1 best-seller, \"Kaitaku Okaki,\" is freshly made with Hokkaido glutinous rice and seafood, delivering an irresistibly savory crunch. Additionally, the limited Yumefushigi cream puff, featuring a crispy pastry shell packed with rich fresh cream, makes this an absolute must-visit dessert and souvenir spot.", "name": "Kitakaro Sapporo Honkan", "transport": "About a 5-minute walk from Exit 5 of Odori Station on the Sapporo Municipal Subway"}, {"address": "Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido (Inside Pole Town Underground Shopping Center)", "feature": "\u2b50 4.6 stars | Must-Buy List: Freshly baked cheese tarts, Hokkaido supreme milk soft-serve ice cream, apple pie. Located in the Pole Town underground shopping street between Tanukikoji and Susukino, KINOTOYA BAKE always entices passersby with the heavenly aroma of freshly baked cheese tarts. Blending three varieties of Hokkaido cheese, the double-baked crust is ultra-crispy, enclosing a smooth and rich filling. An insanely popular snack spot for both locals and travelers, these tarts taste amazing at room temperature or chilled, and come in beautifully designed box packaging ideal for gifting.", "name": "KINOTOYA BAKE Pole Town", "transport": "Directly connected via the underground mall from Susukino Station or Odori Station on the Sapporo Municipal Subway"}, {"address": "Minami 3-jo Nishi 3-chome, Chuo-ku, Sapporo, Hokkaido (Tanukikoji 3-chome)", "feature": "\u2b50 4.1 stars | Must-Buy List: Hokkaido Yubari melon jelly, Salmon Toba (dried salmon jerky), Hokkaido-exclusive Fu-Rai-Jin instant ramen packets. Situated in Tanukikoji 3-chome, \"Hachinoki\" is a local independent souvenir shop bursting with Showa-era retro charm. Unlike standard chain stores, it stocks hidden-gem snacks and traditional dried delicacies sourced directly from local agricultural and fishery associations\u2014such as chewy dried salmon strips and various Yubari melon treats. Perfect for travelers who love treasure hunting for authentic traditional treats and savory beer snacks.", "name": "Souvenir Shop Hachinoki", "transport": "3-minute walk from Odori Station on the Sapporo Municipal Subway Namboku Line"}, {"address": "4-614 Odori Nishi, Chuo-ku, Sapporo, Hokkaido (Inside Chi-Ka-Ho Underground Walkway)", "feature": "\u2b50 4.4 stars | Must-Buy List: Shiroi Koibito chocolate cookies, Mifuyu mille-feuille, Saqu Langue de Chat cookies. Just a short walk from the Tanukikoji shopping area, this ISHIYA flagship concept store is an upscale directly-managed shop by the creator of Hokkaido\u0027s iconic \"Shiroi Koibito\". Beyond the complete selection of classic Shiroi Koibito gift boxes, it offers store-exclusive Saqu colorful Langue de Chat cookies and Mifuyu mille-feuille. The elegant, sophisticated packaging makes these products ideal high-end gifts to bring back home.", "name": "ISHIYA SHOP Sapporo Odori Nishi 4", "transport": "Directly connected to Exit 14 of the Sapporo Ekimae-dori Underground Walkway (Chi-Ka-Ho)"}, {"address": "3-3 Kita 4-jo Nishi 6-chome, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.6 stars | Must-Buy List: Marusei Butter Sandwiches, Freeze-Dried Strawberry White Chocolate Balls, Frosting Biscuit (Crispy Mocha Crisp). Located north of Susukino and Tanukikoji, Rokkatei\u0027s flagship store is an enduring legend in the Hokkaido souvenir world. Its signature \"Marusei Butter Sandwich\" combines 100% Hokkaido raw milk butter and white chocolate with flavorful raisins for an unforgettable, rich taste. The beautiful floral packaging designed by Tokachi artist Toyoshiro Oda radiates authentic Hokkaido charm, making it a foolproof top-tier gift.", "name": "Rokkatei Sapporo Honkan", "transport": "5-minute walk from the South Exit of JR Sapporo Station, or a 10-minute walk from Odori Subway Station"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "3-7-6 Omagari Saiwaicho, Kitahiroshima, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: BEAMS tailored jackets, COACH classic leather bags, Mont-bell outdoor windbreakers. The largest outlet shopping center in Hokkaido, featuring over 170 international and Japanese local brands. Divided into CLOVER MALL and MAPLE MALL, it offers an all-weather indoor shopping environment, completely weatherproof against Hokkaido\u0027s harsh winter snow. In addition to huge discounts on sports brands like adidas and NIKE, it also features local Hokkaido produce and a food court, making it a must-visit discount paradise for shopping enthusiasts traveling to Susukino.", "name": "Mitsui Outlet Park Sapporo Kitahiroshima", "transport": "Take the Namboku Subway Line from Susukino Station to Sapporo Station, then transfer to a direct bus (approx. 40 minutes); or transfer to a local route bus at Fukuzumi Subway Station (approx. 25 minutes)."}, {"address": "4-1-1 Minami 4-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: HUB3 exclusive craft beer, ROOTS BOOKS local book selections, exquisite Tokachi pork bowl (Butadon) sauce. A new landmark complex department store in Susukino opened at the end of 2023, located at the busiest corner of the Susukino intersection. Lower floors combine local food supermarkets with unique dining options, while higher floors house a cinema and a stylish hotel. Gathering a large array of Hokkaido brands and limited-edition goods, it transforms traditional Susukino nightlife into an all-day trendy shopping experience.", "name": "COCONO SUSUKINO", "transport": "Directly connected to Susukino Station on the Sapporo Municipal Subway Namboku Line via the underground walkway."}, {"address": "3-20 Minami 2-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: AOAO SAPPORO exclusive penguin merchandise, Standard Products minimalist home goods, Hokkaido handcrafted wooden crafts. Opened in 2023, this urban department store located at Tanukikoji 3-Chome focuses on lifestyle concepts blending nature with modern city living. Inside, it not only houses the urban aquarium AOAO SAPPORO, but also introduces several famous lifestyle and creative design shops making their Hokkaido debut. With ample natural lighting, it seamlessly combines the traditional energy of Tanukikoji Shopping Street with a refined shopping experience.", "name": "moyuk SAPPORO", "transport": "Approx. 3-minute walk from Odori Station (Namboku Line) or 5-minute walk from Susukino Station, directly connected to Tanukikoji 3-Chome."}, {"address": "3-3 Minami 1-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.1 stars | Must-Buy List: BAO BAO ISSEY MIYAKE designer bags, Onitsuka Tiger retro running shoes, WEGO trendy fashion. An iconic trendsetting department store located at the intersection of Tanukikoji and Odori shopping districts, featuring the latest Japanese cutting-edge fashion, independent designer brands, and anime/pop-culture specialty stores. Beyond street fashion, the B1 and B2 floors connect to Sapporo\u0027s underground shopping street, offering charming Japanese stationery shops and unique accessory boutiques highly popular among local youth and tourists alike.", "name": "Sapporo PARCO", "transport": "Approx. 1-minute walk from Sapporo Municipal Subway Odori Station, directly connected to Pole Town Underground Street."}, {"address": "Minami 3-jo Nishi 4-Chome (Tanukikoji 4-Chome), Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.4 stars | Must-Buy List: Shiroi Koibito exclusive gift sets, Rokkatei Raisin Butter Sandwiches, carved wooden Tanuki (raccoon dog) souvenir figures. Founded in 1916, this century-old select shop in Tanukikoji 4-Chome is the most iconic local souvenir specialty store. Spanning two floors, it brings together Hokkaido\u0027s most complete selection of famous snacks, limited handcrafted goods, and local spirits. The giant cute Tanuki landmark outside the entrance is a popular photo spot for tourists, and the shop offers duty-free shopping as well as helpful Chinese-speaking staff.", "name": "Hokkaido Souvenir Shop Tanukiya", "transport": "Approx. 4-minute walk from Susukino or Odori Subway Station, located inside the Tanukikoji 4-Chome arcade."}, {"address": "5-14 Minami 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Horse oil ultra-moisturizing hand cream, Hokkaido lavender essential oil steam eye masks, Lifense brightening and anti-aging serum. The flagship store of Hokkaido\u0027s most iconic local drugstore chain features a spacious, brightly lit two-story design with wide aisles perfect for pushing shopping carts. Tailored for tourists, it includes dedicated Hokkaido-exclusive skincare and local health food sections. With quick checkout service and frequent extra duty-free discounts, it\u0027s the best spot to stock up on Hokkaido-made cosmetics and health supplements.", "name": "Satudora Sapporo Drugstore Tanukikoji 5-Chome Store", "transport": "Approx. 4-minute walk from Sapporo Municipal Subway Susukino Station, located inside the Tanukikoji 5-Chome arcade."}, {"address": "2-1-1 Minami 3-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.2 stars | Must-Buy List: AYURA relaxing fragrance bath salts, LIPS \u0026 HIPS moisturizing scented hand cream, DAZZSHOP dazzling eye gloss. Born in Hokkaido, this renowned large-scale beauty and lifestyle store at Tanukikoji 2-Chome offers a vast selection of Japanese department store and drug store cosmetics. Designed like a high-end fashion boutique, it features a dedicated makeup trial area and a top-trending beauty chart section\u2014a shopping paradise for female locals and tourists looking for beauty products and lifestyle items.", "name": "Ains \u0026 Tulpe Tanukikoji 2-Chome Store", "transport": "Approx. 2-minute walk from Hosui-Susukino Station (Toho Line) or 4-minute walk from Odori Station."}, {"address": "2-11 Minami 1-jo Nishi, Chuo-ku, Sapporo, Hokkaido", "feature": "\u2b50 4.3 stars | Must-Buy List: Tokachi handmade cheese tarts, premium Hokkaido kelp gift boxes, SHISEIDO Hokkaido-exclusive skincare sets. Established in Sapporo in 1872, this heritage local department store brand in Hokkaido is situated in the heart of Odori Park near the Tanukikoji district. Comprising multiple buildings including the Odori Building and Ichijo Building, it houses top luxury brands, traditional Japanese crafts, and a famed basement food hall known as the \u0027Home of Hokkaido Delicacies.\u0027 It is the most trusted choice among locals for buying top-tier Hokkaido agricultural specialty goods and high-end gifts.", "name": "Marui Imai Sapporo Main Store", "transport": "Directly connected to Odori Subway Station (Exits 18 \u0026 19), about a 2-minute walk from Tanukikoji 2-Chome."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Susukino and Tanukikoji Shopping Street"}};
        const cityName = "Hokkaido";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
