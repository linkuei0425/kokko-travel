Chengdu 339 Tower Commercial Zone, No. 94 Mengzhuiwan Street, Chenghua District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade vegetable oil hot pot soup base, spicy dry pot seasoning packs, Shuxiang beef sauce gift sets. A specialty boutique established by the time-honored Sichuan hot pot brand \u0027Huangcheng Laoma,\u0027 allowing visitors to easily bring authentic Chengdu hot pot flavors home. With meticulously crafted soup bases and tightly sealed packaging, it is immensely popular among foodies.", "name": "Huangcheng Laoma Souvenirs (Chengdu 339 Branch)", "transport": "Take Metro Line 4 to Yushuang Road Station, then walk for about 10 minutes from the exit."}, {"address": "No. 1-3 Wangjiang Road, Wuhou District, Chengdu (Near Jiuyan Bridge \u0026 Sichuan University)", "feature": "\u2b50 4.6 stars | Must-Buy List: Signature classic Mille-Feuille (Napoleon pastry), Sichuan salt-and-pepper walnut cookies, Matcha Tiramisu. A well-known local independent bakery located near Jiuyan Bridge and the Wangjiang Campus of Sichuan University, famous far and wide for its handmade Mille-Feuille. Featuring light, crisp layers that aren\u0027t overly sweet, it comes highly recommended by locals and students alike as a baked souvenir gift.", "name": "Tisu Pastry (Jiuyan Bridge / Sichuan University Branch)", "transport": "Take Metro Line 2 to Niuwangmiao Station, then transfer to a bus or walk for about 12 minutes towards Jiuyan Bridge."}, {"address": "Dongwei Avenue, Dongjiao Memory, No. 99 Jianshe South Road, Chenghua District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Limited-edition panda postmarked postcards, Sichuan spicy hot pot stickers, 3D wooden panda puzzles. An official creative gift shop themed around Chengdu\u0027s mascot, the giant panda, filled with adorable panda-inspired merchandise. After purchasing souvenirs, visitors can stamp them with a unique panda postmark and send them off to friends and family.", "name": "Panda Post (Dongjiao Memory Theme Store)", "transport": "Take Metro Line 8 to Dongjiao Memory Station (Exit F), then walk for about 4 minutes."}, {"address": "No. 8 Siguan Road, Jinjiang District, Chengdu (Next to Jiuyan Bridge Bar Street)", "feature": "\u2b50 4.3 stars | Must-Buy List: Chengdu Sichuan peppercorn sesame cakes, Sichuan savory-spicy \u0027strange flavor\u0027 beans gift box, shadow beef strips (Dengying beef). A traditional independent Sichuan specialty store adjacent to the Jiuyan Bridge bar street, gathering a wide array of nostalgic Chengdu snacks and traditional pastries. Affordable and generously portioned, it\u0027s a great spot for tourists enjoying Jiuyan Bridge\u0027s nightlife to pick up local snacks and souvenirs.", "name": "Shule Pastry \u0026 Sichuan Specialty Shop (Jiuyan Bridge Branch)", "transport": "Take Metro Line 2 to Dongmen Bridge Station, then walk for about 12 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 88 Yinxing Road, Pidu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted Gucci wallets, discounted Armani suits, Nike running shoes on sale. This is Chengdu\u0027s most acclaimed Italian-style luxury outlet center, with architecture recreating the charm of a classical Italian town. The complex houses over 200 international luxury brands and famous trendy sportswear labels, offering year-round discounts between 30% to 70% off. It is the top choice for large-scale outlet shopping in Chengdu.", "name": "Florentia Village Chengdu Luxury Designer Outlets", "transport": "Take Metro Line 2 to Xipu Station, then transfer to Bus P40 and get off at Florentia Village Station."}, {"address": "No. 94 Mengzhuiwan Street, Chenghua District, Chengdu City", "feature": "\u2b50 4.3 stars | Must-Buy List: TV Tower limited-edition mugs, panda-themed gift sets, Sichuan spicy snack packs. A landmark shopping center located directly beneath the West Sichuan Tower, seamlessly blending fashion retail, cinemas, and vibrant nightlife. It features numerous Chengdu-exclusive cultural and creative counters as well as local food zones, allowing visitors to enjoy shopping while admiring the iconic tower.", "name": "Chengdu 339 Shopping Center", "transport": "Take Metro Line 3 or Line 4 to Second People\u0027s Hospital Station, then walk for about 12 minutes."}, {"address": "No. 8 Shuangqing Road, Chenghua District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Local designer collaboration T-shirts, exquisite Shu brocade handbags, craft tea blend creative gift boxes. Located on the East 2nd Ring Road near Eastern Suburb Memory, this super mall is massive in scale with multiple themed venues. It brings together top international brands along with numerous independent local Sichuan designer labels and trendy pop-up stores, making it a favorite shopping hot spot for young, fashionable locals.", "name": "The MixC Chengdu", "transport": "Take Metro Line 4 or Line 8 to Shuangqiaolu Station, which connects directly to the mall from the exit."}, {"address": "No. 170 Jianshe North Road Section 3, Chenghua District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Trendy designer toy blind boxes, local independent jewelry, Chengdu-flavored souvenir boxes. Located near the Eastern Suburb Memory commercial district, this trendy youth mall is centered around youthfulness, vitality, and art. Besides international fast-fashion brands, it houses many local independent streetwear shops and unique cultural creative stalls, making it perfect for young visitors looking to hunt for unique finds.", "name": "Impression City Chengdu", "transport": "Take Metro Line 8 to Shilidian Station, then walk for about 5 minutes."}, {"address": "Inside Eastern Suburb Memory Park, Zhonghuan Road Shuangdian Section, Chenghua District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage vinyl record-shaped notebooks, Eastern Suburb Memory exclusive graffiti mugs, handmade bamboo-woven handbags. An authentic local independent creative store located inside the Eastern Suburb Memory Music Park, deeply rooted in Chengdu\u0027s industrial heritage and music culture. All products are originally crafted by local Sichuan designers and artists, showcasing the modern cultural flair of Chengdu.", "name": "Fanmu Cultural \u0026 Creative Shop", "transport": "Take Metro Line 8 to Dongjiao Memory Station, then walk for about 3 minutes to enter the park."}, {"address": "No. 18 Shunjiang Road, Jiuyan Bridge, Jinjiang District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Shu embroidery panda bookmarks, exquisite double-sided embroidery table ornaments, pure silk Shu brocade coin purses. A traditional craft shop located along the Jinjiang River near Jiuyan Bridge, dedicated to preserving Sichuan\u0027s national intangible cultural heritage. Seamlessly blending traditional Shu brocade and embroidery into modern lifestyle items with incredible quality, it is a must-visit store for tourists seeking high-end souvenirs.", "name": "Shu Brocade \u0026 Embroidery Heritage Shop", "transport": "Take Metro Line 2 to Niushikou Station, then transfer to a bus or walk for about 10 minutes to reach the Jiuyan Bridge Commercial Area."}, {"address": "No. 33 Wangping Street, Chenghua District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Sichuan peppercorn-scented candles, handmade ceramic gaiwan tea bowls, Chengdu alleyway illustration postcards. Tucked away in the Wangping Street neighborhood near the TV Tower, this local independent lifestyle boutique is run by a Chengdu art collective. It focuses on original handcrafted gifts and everyday goods reflecting the slow-life culture of old Chengdu, with every item full of warm hospitality and local humor.", "name": "Shiguang Studio Independent Select Shop", "transport": "Take Metro Line 2 to Dongmen Bridge Station, exit and walk along the riverfront for about 8 minutes."}, {"address": "No. 88 Section 1 Jinhua Road, Jinjiang District, Chengdu City", "feature": "\u2b50 4.2 stars | Must-Buy List: Traditional time-honored Sichuan beef jerky gift sets, handmade Mount Qingcheng tea, premium Sichuan peppercorn oil. A comprehensive shopping plaza located in the eastern extension of Jiuyan Bridge, popular among both locals and tourists. It houses a large Sichuan specialty supermarket and direct-sale counters for famous heritage souvenir brands, making it a one-stop shop for authentic local Sichuan products.", "name": "Greenland 463 Lifestyle Plaza", "transport": "Take Metro Line 6 to Liulichang Station, then transfer to a bus for 2 stops."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jiuyan Bridge, Eastern Suburbs Memory, and the TV Tower"}, "kuanzhai_tianfu": {"categories": {"cat_1": {"items": [{"address": "No. 22 Kuan Alley, Changshun Upper Street, Qingyang District, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Pressed Duck-Egg Face Powder, Flying Apsaras Sachet, Sweet Osmanthus Solid Perfume. Xiefuchun is one of China\u0027s oldest historic traditional beauty brands, with its Kuanzhai Alley store styled in elegant ancient Jiangnan and Western Sichuan architecture. Its flagship Pressed Duck-Egg Face Powder uses natural egg powder and flower scenting techniques, yielding an ultra-fine texture with a subtle floral fragrance. It is a classic oriental natural skin-nourishing cosmetic deeply loved by fans of traditional Chinese fashion (Guochao) and retro makeup.", "name": "Xiefuchun Classical Cosmetics (Kuanzhai Alley)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk about 300 meters."}, {"address": "No. 18 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.7 Stars | Must-Buys: Queen Pien Tze Huang Pearl Cream, Pearl Brightening Cream, Reishi Whitening Serum. Pien Tze Huang blends traditional Chinese herbal formulas with modern technology into a top domestic skincare brand. Located in Zhai Alley, this experience store merges modern style with classic Chinese charm. Famous for herbal skin care, its star product\u2014Pearl Cream\u2014deeply moisturizes and soothes acne-prone skin with a gentle texture, making it a highly rated local TCM cosmetic souvenir for tourists visiting Kuanzhai Alley.", "name": "Pien Tze Huang Experience Store (Kuanzhai Alley)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk about 350 meters."}, {"address": "No. 86 Renmin South Road 1st Section, Qingyang District, Chengdu (next to Tianfu Square)", "feature": "\u2b50 4.8 Stars | Must-Buys: Sichuan Herbal Repair Facial Mask, Tianfu Pearl Whitening Powder, Notoginseng Nourishing Face Cream. De Ren Tang is a century-old pharmacy brand famous in Chengdu. Beside selling premium Chinese herbal medicines, its flagship store at Tianfu Square features a dedicated TCM cosmetics zone. Utilizing authentic Sichuan herbs, it offers gentle, non-irritating herbal skincare products and masks with rich local cultural flavor\u2014a must-visit store to experience Chengdu\u0027s traditional wellness and beauty heritage.", "name": "De Ren Tang Traditional Pharmacy (Tianfu Square)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station (Exit 15), then walk about 200 meters."}, {"address": "No. 11 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.5 Stars | Must-Buys: \u0027Chilled Boiled Water\u0027 Eau de Toilette, Sichuan Jasmine Tea Perfume, Deep Bamboo Forest Solid Perfume. Scent Library is one of China\u0027s most creative original fragrance and personal care brands. Its Kuanzhai Alley flagship store weaves memories of Chengdu life into unique scents. Exclusive perfumes like Sichuan Jasmine Tea and Deep Bamboo Forest capture elegant Shu regional charm, alongside quirky yet comforting body care items\u2014perfect for delicate, culturally rich gifts.", "name": "Scent Library (Kuanzhai Alley)", "transport": "Take Chengdu Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk about 250 meters."}, {"address": "Floor F1, Jinzhan Shopping Center, Underground Tianfu Square, Qingyang District, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Herbal Anti-Acne Gel, Donkey-hide Gelatin Beautifying Handmade Soap, Ginseng Nourishing Repair Eye Cream. Created by the century-old TCM house Tong Ren Tang in Tianfu Jinzhan Shopping Center, this experience space integrates thousand-year-old herbal philosophies into modern daily skincare. Emphasizing additive-free and herbal conditioning, its handmade donkey-hide gelatin soap and herbal eye cream are highly favored by health-conscious shoppers seeking safe ingredients and traditional skincare.", "name": "Beijing Tong Ren Tang TCM Cosmetics (Tianfu Jinzhan)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station; directly connected to Jinzhan Shopping Center from within the station."}, {"address": "B1 Floor, Jinzhan Shopping Center, No. 1 Renmin South Road 1st Section, Qingyang District, Chengdu", "feature": "\u2b50 4.4 Stars | Must-Buys: Flower Knows Velvet Lip Glaze, Judydoll 7-Color Eyeshadow Palette, Carslan Big Eyes Mascara. Located underground at Tianfu Square, this massive multi-brand store for trendy Chinese cosmetics boasts a dreamlike beauty blender wall and striking visual displays. Gathering dozens of popular domestic emerging beauty brands, it offers a fully open try-on experience. With affordable prices and huge variety, it\u0027s a paradise for young women shopping for trending makeup and beauty tools.", "name": "The Colorist (Tianfu Jinzhan Shopping Center)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station; directly connected to Jinzhan Shopping Center inside the station."}, {"address": "1F Cosmetics Zone, Far Eastern Department Store, Tianfu Square, Qingyang District, Chengdu", "feature": "\u2b50 4.5 Stars | Must-Buys: Tai Chi Youth Restoring Serum, Silky Lotus Whitening Mask, Tai Chi Mud Mask. Herborist is a pioneer in premium Chinese herbal skincare. Located inside Far Eastern Department Store at Tianfu Square, the brand draws inspiration from ancient traditional cosmetics prescriptions, utilizing modern biotechnology to extract active herbal essences. Its iconic Tai Chi and Whitening series are highly praised for gently balancing the skin, making it a top choice for luxury TCM skincare.", "name": "Herborist Counter (Tianfu Far Eastern Department Store)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station (Exit 7) for direct access."}, {"address": "B1 Floor, Baiyang Building, No. 88 Renmin South Road 1st Section, Qingyang District, Chengdu", "feature": "\u2b50 4.3 Stars | Must-Buys: Perfect Diary Animal Eyeshadow Palette, BENFU Repair Serum, VNK Setting Spray. Located in the Baiyang Building at Tianfu Square, this chain multi-brand beauty store features modern C-beauty (Guochao) makeup and emerging domestic skincare brands that have swept the nation. With a trendy, stylish ambiance, it offers a complete range of viral makeup, skincare, and beauty tools along with frequent attractive bundle deals\u2014perfect for one-stop shopping of popular Chinese cosmetics.", "name": "WOW COLOUR Guochao Cosmetics Store (Tianfu Square Store)", "transport": "Take Chengdu Metro Line 1 or 2 to Tianfu Square Station (Exit F), then walk about 150 meters."}], "name": "Representative Local Cosmetics \u0026 Beauty Pharmacies"}, "cat_2": {"items": [{"address": "No. 22 Kuan Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Shu embroidery pure silk qipao, Shu brocade 3D embroidered bag, Shu embroidery flower \u0026 bird pattern silk scarf. Located inside Kuanzhai Alley, this fashion boutique is deeply rooted in traditional Sichuan culture, seamlessly integrating national intangible cultural heritage \u0027Shu brocade\u0027 and \u0027Shu embroidery\u0027 into modern clothing design. All garments are pure handmade by experienced master embroiderers, featuring exceptional quality and unique charm. It is a top destination for locals and tourists seeking high-end Chinese-style apparel and accessories.", "name": "Shu Brocade \u0026 Shu Embroidery Qipao Fashion Boutique", "transport": "Metro Line 4 \u0027Kuanzhaixiangzi Alley Station\u0027, Exit B, approx. 3 mins walk"}, {"address": "Wenshuyan Street, Wenshufang, Qingyang District, Chengdu City (Near Tianfu Square \u0026 Luomashi Business District)", "feature": "\u2b50 4.8 stars | Must-Buy List: Ming-dynasty embroidered horse-face skirt (Mamianqun), Wei-Jin style cross-collar chiffon robe, vintage Hanfu kiss-lock purse. Originating in Chengdu and now popular nationwide, this flagship store near Tianfu Square business district offers a rich array of original Hanfu for men and women, along with exquisite shoes and bag accessories. Blending traditional tailoring with modern aesthetic styling, it boasts solid quality at affordable prices, making it hugely popular among young Hanfu enthusiasts and visitors doing period costume photography.", "name": "Chonghui Hantang Hanfu Flagship Store", "transport": "Metro Line 1 \u0027Wenshu Monastery Station\u0027, Exit K, approx. 5 mins walk"}, {"address": "No. 69 Jixiang Street, Qingyang District, Chengdu City (Near Kuanzhai Alley)", "feature": "\u2b50 4.6 stars | Must-Buy List: Chengdu limited bamboo print hoodie, American vintage heavyweight cargo pants, street-style large crossbody bag. 1807 is Chengdu\u0027s most iconic local streetwear brand, cleverly fusing the city\u0027s laid-back vibe with American retro street culture. Located near People\u0027s Park and Kuanzhai Alley, the store features an industrial decor and is a trendy pilgrimage spot for fashion-forward youth to buy exclusive Chengdu-limited items.", "name": "1807 Chengdu Local Streetwear Flagship Store", "transport": "Metro Line 4 \u0027Kuanzhaixiangzi Alley Station\u0027, Exit D, approx. 8 mins walk"}, {"address": "No. 38 Citang Street, Qingyang District, Chengdu City (Opposite People\u0027s Park)", "feature": "\u2b50 4.5 stars | Must-Buy List: Minimalist tailored designer shirt, West Sichuan bamboo-woven handbag, vintage handmade leather ankle boots. Located in the century-old Citang Street right opposite People\u0027s Park, this store brings together contemporary art and local independent designer brands. Highlighting a blend of modern minimalist aesthetics with traditional Sichuan craftsmanship, it offers unique, non-mainstream clothing and high-quality handmade shoes and bags, making it a favorite for lifestyle-conscious hipsters.", "name": "Citang Street Art \u0026 Designer Boutique", "transport": "Metro Line 2 \u0027People\u0027s Park Station\u0027, Exit B, approx. 2 mins walk"}, {"address": "No. 18 Zhai Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: 3D panda ear baseball cap, original panda motif canvas shoes, plush panda crossbody bag. Located inside the Kuanzhai Alley area, this iconic local boutique centers its design around Chengdu\u0027s mascot, the Giant Panda. Far beyond typical souvenirs, the shop redesigns panda motifs with creative street-style flair, offering adorable yet trendy clothing, hats, shoes, and bag accessories that are hugely popular among youth.", "name": "Panda House Original Apparel \u0026 Accessories Store", "transport": "Metro Line 4 \u0027Kuanzhaixiangzi Alley Station\u0027, Exit B, approx. 4 mins walk"}, {"address": "No. 16 Kuixinglou Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.3 stars | Must-Buy List: Ethnic patchwork cotton-linen dress, Sichuan bamboo-weave styled leather bag, handmade botanical-dyed scarf. Nestled in the Kuixinglou Cultural Creative District right next to Kuanzhai Alley, this boutique curates works from emerging local independent designers in Chengdu. Featuring natural linen fabrics, ethnic elements, and hand-finished genuine leather shoes and bags, it embodies the distinct slow-life aesthetic of West Sichuan\u2014a great spot to discover unique styles.", "name": "Kuixing Selection Independent Designer Boutique", "transport": "Metro Line 4 \u0027Kuanzhaixiangzi Alley Station\u0027, Exit B, approx. 7 mins walk"}, {"address": "1F, Renhe Spring Department Store, No. 118 Section 1, Renmin South Road, Qingyang District, Chengdu City (Next to Tianfu Square)", "feature": "\u2b50 4.6 stars | Must-Buy List: Mulberry silk couture printed dress, silhouette cashmere coat, high-end genuine leather handbag. Marisfrolg is a premier domestic Chinese womenswear brand with a flagship boutique counter inside Renhe Spring Department Store at Tianfu Square. Famous for luxury fabrics, exquisite tailoring, and elegant designs, it provides high-quality womenswear, shoes, and handbags. Highly recommended by Chengdu\u0027s white-collar professionals and businesswomen.", "name": "Marisfrolg Counter (Tianfu Renhe Spring)", "transport": "Metro Line 1 or Line 2 \u0027Tianfu Square Station\u0027, Exit A direct access"}, {"address": "No. 31 Kuan Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Shu embroidery wedge pumps, traditional classical embroidered kiss-lock bag, vintage leather embroidered flats. Located inside Kuanzhai Alley, this boutique specializes in combining traditional embroidery with modern shoe and bag designs. By stitching exquisite Shu embroidery patterns onto genuine leather and fabric accessories, it preserves classical romance while ensuring modern walking comfort. Many local shoppers visit specifically to pick out elegant handmade shoes to pair with Qipao or Hanfu.", "name": "Xuniangzi Traditional Embroidery Shoes \u0026 Bags Boutique", "transport": "Metro Line 4 \u0027Kuanzhaixiangzi Alley Station\u0027, Exit B, approx. 3 mins walk"}], "name": "Popular Local Apparel, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 7 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.3 stars | Must-Buy List: Zhangfei Spicy Beef Jerky, Five-Spice Beef Cubes, Sichuan Spicy Beef Strips. Zhangfei Beef is a highly representative, time-honored Sichuan meat snack brand. Staff dressed in Zhangfei Peking Opera costumes and face masks warmly welcome guests at the entrance, making it quite an eye-catcher. The beef jerky here is crafted using traditional techniques, offering a firm, pleasantly chewy texture that is richly seasoned and spicy without being harsh. Beyond classic spicy and five-spice flavors, individually wrapped souvenir gift boxes are perfect for sharing with friends and family\u2014a classic souvenir you shouldn\u0027t miss at Kuanzhai Alley.", "name": "Zhangfei Beef (Kuanzhai Alley Flagship Store)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 3 minutes."}, {"address": "No. 19 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Panda-shaped Nougat, Panda 3D Tea Bag Gift Box, Limited Edition Panda Shu Embroidery Postcards. This is China Post\u0027s first panda-themed post office in the world, seamlessly blending Chengdu\u0027s iconic panda culture with creative souvenirs. Beyond mailing postcards stamped with a unique panda postmark, their panda-themed snack gift boxes are top choices for visitors. The nougat is richly milky without sticking to your teeth, and the tea bag packaging is irresistibly cute. Beautiful, stylish packaging makes this a premier spot for souvenirs that combine great taste with memorable value.", "name": "Panda Post Office (Kuanzhai Alley Store)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 5 minutes."}, {"address": "No. 31 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Huangcheng Laoma Spicy Beef Tallow Hotpot Base, Mellow Vegetable Oil Hotpot Base, Sichuan Spicy Beef Sauce. Huangcheng Laoma is a renowned time-honored hotpot brand in Chengdu. Its specialty shop condenses authentic Sichuan hotpot flavors into portable, beautifully packaged base gift sets. The beef tallow base is rich in aroma, pleasantly spicy, and long-numbing, while the vegetable oil base is refreshingly light. Many out-of-town visitors visit specifically to take home authentic Chengdu hotpot flavors to recreate at home, making it an excellent choice for family gatherings or gifts for elders.", "name": "Huangcheng Laoma Sichuan Hotpot Base Shop (Kuanzhai Alley)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 4 minutes."}, {"address": "No. 14 Shaocheng Road, Qingyang District, Chengdu (Near People\u0027s Park)", "feature": "\u2b50 4.5 stars | Must-Buy List: Signature Salt \u0026 Pepper Walnut Pastry, Salt \u0026 Pepper Crispy Cakes, Old Chengdu Egg Yolk Pastry. Located near People\u0027s Park, this famous traditional bakery always attracts long lines of locals. Baked according to ancient methods, their walnut pastries are incredibly flaky, melt in your mouth, and offer a uniquely distinctive sweet and savory salt-and-pepper flavor. Prices are very budget-friendly with genuine ingredients, and most items come individually sealed for easy transport\u2014making it the ultimate spot to experience traditional Chengdu baking and pick up authentic local treats.", "name": "Old Chengdu Palace Walnut Pastry (People\u0027s Park Shaocheng Road Store)", "transport": "Take Metro Line 2 to People\u0027s Park Station (Exit D), then walk for about 3 minutes."}, {"address": "No. 28 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Premium Zhuyeqing Green Tea, Bitan Piaoxue Jasmine Tea, Mount Emei Xueya Special Tea Gift Set. Zhuyeqing is an iconic high-end Sichuan tea brand harvested from the high-altitude tea regions of Mount Emei. Its store in Kuanzhai Alley blends modern minimalism with classical western Sichuan architecture, offering an elegant tea-tasting atmosphere. The signature Zhuyeqing green tea features flat, straight, bright-green tender leaves that produce a clear liquor with a fresh, crisp, sweet aftertaste. Bitan Piaoxue blends high-quality green tea with double-scented jasmine flowers for a rich, lasting aroma, serving as a sophisticated, high-end gift representing Sichuan tea culture.", "name": "Zhuyeqing Tea (Kuanzhai Alley Flagship Store)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 5 minutes."}, {"address": "B1 Floor, Jinzhan Shopping Center, Underground Tianfu Square, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Authentic Pixian Doubanjiang Gift Set, Sichuan Shadow Beef Strips, Sichuan Cured Pork \u0026 Sausages. Located underground at Tianfu Square, Shuxin Specialty Shop is a one-stop shop gathering premium famous specialties from across Sichuan. The store carefully selects authentic ingredients: Pixian Doubanjiang (chili bean paste) is the soul of Sichuan cuisine with its rich savory flavor, while the paper-thin Shadow Beef Strips are crispy, spicy, and fragrant. Offering thoughtful packing and mailing services, it is extremely convenient for tourists looking to buy a complete selection of Sichuan seasonings and specialty dried foods near Tianfu Square.", "name": "Shuxin Specialty Souvenirs (Tianfu Square Store)", "transport": "Take Metro Line 1 or Line 2 to Tianfu Square Station; accessible directly from the underground commercial street upon exiting."}, {"address": "No. 22 Kuan Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Time-Honored Sanhua Double-Scented Jasmine Tea, Hand-Painted Panda Blue-and-White Gaiwan, Sichuan Mengding Ganlu Tea. Chengdu locals take their tea seriously with covered tea bowls (Gaiwan) and jasmine tea, with \u0027Sanhua\u0027 (Grade 3 Jasmine Tea) carrying the neighborhood tea-house memories of generations. This specialty tea shop sells fragrant, sweet, and palate-cleansing traditional Sanhua tea, alongside portable gaiwan tea set gift bundles and exquisitely hand-painted tea sets. It allows visitors to bring home the complete relaxed tea culture experience after exploring People\u0027s Park and Kuanzhai Alley.", "name": "Old Chengdu Sanhua Tea \u0026 Gaiwan Experience Shop (Kuanzhai Alley)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 4 minutes."}, {"address": "No. 11 Zhai Alley, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Chen Mapo Tofu Seasoning Packets, Sichuan Poached Beef Seasoning, Authentic Mapo Tofu Sauce Gift Box. As an iconic signature dish of Sichuan cuisine, Mapo Tofu originated right here in Chengdu. This specialty store seals century-old classic recipes into convenient packages, allowing home cooks to easily recreate authentic Sichuan flavors boasting the iconic seven characteristics: numbing, spicy, fresh, aromatic, piping hot, tender, and crispy. The seasoning packets come in leak-proof packaging with detailed cooking instructions\u2014making them practical and culturally distinct gifts for cooking enthusiasts or personal home use.", "name": "Chen Mapo Tofu Specialty Seasoning Shop (Kuanzhai Alley Store)", "transport": "Take Metro Line 4 to Kuanzhai Alley Station (Exit B), then walk for about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 86, Section 1, Renmin South Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Original local illustration merchandise, Hanfu (traditional clothing) accessories, ACG (Anime, Comic, Games) collaboration items. Located in the heart of Tianfu Square, this trendy department store is specifically tailored for young people and trendsetters in Chengdu. It brings together numerous local independent designer brands, anime merch shops, and Chinese-chic fashion, showcasing the vibrant and distinct personality of Chengdu\u0027s modern youth.", "name": "Tianfu Red Shopping Center", "transport": "Take Chengdu Metro Line 1 or Line 2 to \u0027Tianfu Square Station\u0027, then walk about 2 minutes from the exit."}, {"address": "No. 60 Renmin East Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Sichuan Shu brocade gift boxes, high-end skincare sets, luxury cashmere scarves. Renhe Spring is an iconic local high-end department store chain founded in Chengdu. The Rendong branch is right next to Tianfu Square, boasting a rich history and exceptional service. Alongside top international beauty and luxury brands, it features exquisite counters showcasing high-quality Sichuan handicrafts and Shu brocade, making it a favorite among locals and business travelers alike.", "name": "Renhe Spring Department Store (Rendong Branch)", "transport": "Take Chengdu Metro Line 1 or Line 2 to \u0027Tianfu Square Station\u0027, then walk along Renmin East Road for about 3 minutes."}, {"address": "No. 99, Section 3, Shuangnan Avenue, Shuangliu District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Discounted Nike sneakers, COACH designer bags, discounted classic BURBERRY trench coats. As one of Chengdu\u0027s most iconic large outlet malls, it offers very convenient transportation from the city center. Designed like a European town, it brings together over 200 world-renowned brands with year-round discounts ranging from 50% to 80% off, making it a must-visit discount shopping paradise when traveling to Chengdu.", "name": "Times Outlets Chengdu", "transport": "Take Chengdu Metro Line 3 to \u0027Shuangliu Square Station\u0027, then take a taxi for about 10 minutes."}, {"address": "No. 22 Zhai Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Panda-shaped bronze mirrors, bamboo-woven tea sets, handmade Shu embroidery silk scarves. Located within the Kuanzhai Alley scenic area, this comprehensive local culture \u0026 lifestyle space seamlessly blends traditional Chengdu culture with modern aesthetics. It showcases and sells a wide range of unique creative lifestyle goods designed by emerging Chengdu designers, exquisitely displayed and brimming with local atmosphere.", "name": "Kuanzhai Alley Cultural \u0026 Creative Flagship Store", "transport": "Take Chengdu Metro Line 4 to \u0027Kuanzhai Alley Station\u0027, Exit D, and walk for about 3 minutes."}, {"address": "No. 72 Shuhua Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.8 stars | Must-Buy List: Carved lacquer teacups/coasters, handmade carved lacquer jewelry boxes, panda-themed lacquer bookmarks. Located near People\u0027s Park and Kuanzhai Alley, this is the direct retail store of Chengdu Lacquerware Factory, which carries centuries of national intangible cultural heritage. The store displays and sells authentic handmade carved lacquer and hidden-pattern lacquerware, with each piece meticulously crafted by local master artisans, holding great collectible value.", "name": "Chengdu Lacquerware Factory Shop", "transport": "Take Chengdu Metro Line 2 to \u0027People\u0027s Park Station\u0027, then walk along Shuhua Street for about 8 minutes."}, {"address": "No. 99, Xiadong Avenue Section, Dongdajie, Jinjiang District, Chengdu City", "feature": "\u2b50 4.3 stars | Must-Buy List: Facial masks from emerging domestic brands, niche fragrance sprays, travel-sized luxury beauty samples. Famous for its warehouse industrial-style photo spot aesthetic, this beauty boutique department store carries numerous emerging C-beauty brands and global niche skincare products. Its transparent and open shopping environment attracts countless local young women, making it a popular beauty exploration spot near Tianfu Square.", "name": "HARMAY Chengdu Flagship Store", "transport": "Take Chengdu Metro Line 2 to \u0027Chunxi Road Station\u0027, then walk for about 5 minutes."}, {"address": "No. 101 Xiaonan Street, Qingyang District, Chengdu City (Near People\u0027s Park)", "feature": "\u2b50 4.6 stars | Must-Buy List: Ceramics by local independent designers, handmade scented candles, cotton and linen home fabrics. Founded locally in Chengdu, this high-end lifestyle and home goods select shop showcases homeware created by independent artisans from Chengdu and Southwest China. The interior design blends Western Sichuan architectural elements with modern minimalism, making it a hidden gem for travelers who love home decor and local design aesthetics.", "name": "YIJI Living Aesthetic Store", "transport": "Take Chengdu Metro Line 2 to \u0027People\u0027s Park Station\u0027, then walk about 6 minutes from the exit."}, {"address": "No. 68 Section 1 Renmin South Road, Yanshikou, Jinjiang District, Chengdu City", "feature": "\u2b50 4.2 stars | Must-Buy List: Specialty Sichuan tea gift sets, traditional local pastry boxes, Shu brocade craft ornaments. Located at the intersection of Tianfu Square and Yanshikou shopping district, this large comprehensive department store has been deeply rooted in Chengdu for years and is highly trusted by locals. It features a dedicated Sichuan local specialty zone as well as counters for local apparel brands, offering an extensive variety of items with excellent value for money.", "name": "Maoye Plaza (Yanshikou Branch)", "transport": "Take Chengdu Metro Line 1 or Line 2 to \u0027Tianfu Square Station\u0027, then walk along Renmin South Road for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Kuanzhai Alley, People\u0027s Park, and Tianfu Square"}, "panda_wenshu": {"categories": {"cat_1": {"items": [{"address": "No. 28 Wenshubang Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buys: Fritillaria Pearl Ointment, Herbal Body Lotion, Qibai Powder Facial Mask. Originating in Chengdu, this century-old traditional Chinese pharmacy blends ancient herbal formulas with modern skincare. Housed in a charmingly classic shop in Wenshubang, it offers a range of gentle, skin-nourishing herbal beauty products that are hugely popular among both health-conscious locals and tourists looking for natural skincare.", "name": "Derentang Pharmacy (Wenshubang Store)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 5 minutes."}, {"address": "No. 11, Zone B, Wenshubang Pedestrian Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buys: Duck Egg Pressed Powder, Xiangfei Solid Perfume Balm, Camellia Seed Hair Oil. As one of China\u0027s oldest classic cosmetics brands, Xie Fuchun is legendary for its \u0027Fragrance, Powder, and Oil.\u0027 The store features elegantly traditional porcelain and wooden packaging. Its natural duck egg face powder is gentle on skin, making this store a must-visit to experience traditional Oriental makeup.", "name": "Xie Fuchun (Wenshubang Store)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 6 minutes."}, {"address": "No. 22 Middle Section of Renmin Road Section 3, Qingyang District, Chengdu City (Near Wenshu Monastery Entrance Gate)", "feature": "\u2b50 4.7 stars | Must-Buys: Tongrentang Pearl Powder, Herbal Anti-Acne Gel, Reishi Mushroom Repairing Facial Mask. Tongrentang extends traditional Chinese medicine wisdom into cosmetics with a dedicated herbal beauty counter. Locals frequently shop here for pure, natural pearl powder to mix custom face masks, as well as daily face creams and hydrating products crafted from herbal extracts.", "name": "Beijing Tongrentang Pharmacy (Chengdu Wenshu Monastery Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 3 minutes."}, {"address": "1F, C102, Wenshubang Cultural and Creative Park, Qingyang District, Chengdu City", "feature": "\u2b50 4.8 stars | Must-Buys: Fairy Peach Blossom Loose Powder, Carved Lipstick, Silk Pressed Powder. Guided by the philosophy \u0027Eastern Makeup Nourished by Flowers,\u0027 Florasis is a wildly popular trendy Chinese cosmetics brand. Located inside the Wenshubang Cultural and Creative Park, this counter blends Shu brocade and classical garden aesthetics into its store design, offering exquisite, artwork-like makeup that excels in both style and function.", "name": "Florasis (Wenshubang Concept Counter)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 7 minutes."}, {"address": "No. 15 Jinzhu Street, Wenshubang, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buys: Chengdu Panda Limited Edition Eyeshadow Palette, Bionic Film Essence Lip Stain, Business Card Lip Tint. A specially designed experience store by the popular Chinese makeup brand Perfect Diary in Wenshubang. Inspired by Chengdu\u0027s famous giant pandas, the shop regularly launches Sichuan panda-themed limited edition products, alongside free makeup trials and value gift sets.", "name": "Perfect Diary (Wenshubang Pop-Up Experience Store)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 5 minutes."}, {"address": "No. 8 Jiangyuan Gongsuo Street, Qingyang District, Chengdu City (Diagonally opposite the Wenshu Monastery entrance)", "feature": "\u2b50 4.3 stars | Must-Buys: Sichuan Mugwort Steam Eye Masks, Taiji Gromwell Ointment, Herbal Hand Cream. Taiji Pharmaceutical is a major local drug manufacturer in Sichuan. Aside from medicines, its flagship pharmacy features medical-grade skincare and herbal soothing remedies developed using authentic Sichuan medicinal herbs\u2014offering reliable quality at budget-friendly prices.", "name": "Taiji Pharmacy (Wenshu Monastery Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 4 minutes."}, {"address": "No. 19 Jinsi Street, Qingyang District, Chengdu City (Near Wenshubang Park)", "feature": "\u2b50 4.9 stars | Must-Buys: Sichuan Bamboo Forest Solid Perfume, Kunlun Snow Fragrance Body Lotion, Oriental Botanical Hand Cream. An independent niche luxury fragrance and care brand focusing on Eastern botanical scents. The store seamlessly blends traditional Western Sichuan residential architecture with modern aesthetics, creating scents inspired by local bamboo groves and flora to produce exceptionally luxurious bath and body care products.", "name": "To Summer (Chengdu Wenshu Art Space)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 8 minutes."}, {"address": "No. 8 Zhaojuesi Heng Street, Chenghua District, Chengdu City (Along the main thoroughfare between Panda Base and Wenshu Monastery)", "feature": "\u2b50 4.6 stars | Must-Buys: Sodium Hyaluronate Repair Mask, Recombinant Collagen Serum, Herbal Soothing Cleanser. Backed by the robust medical R\u0026D background of West China Hospital of Sichuan University, this store specializes in medical-grade skincare designed for sensitive and post-procedure skin. Professional pharmacists offer personalized skin consultations, making it the top spot for local girls stocking up on dermatological-grade skincare.", "name": "Huaxi Pharmacy \u0026 Medical Skincare Store", "transport": "Take Chengdu Metro Line 3 to Zhaojuesi South Road Station (Exit A), then walk for about 6 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacy Brands"}, "cat_2": {"items": [{"address": "No. 28 Wenshuyuan Street, Wenshufang Neighborhood, Qingyang District, Chengdu City", "feature": "\u2b50 4.8 stars | Must-Buy List: Modernized Ming Dynasty Horse-Face Skirt (Mamianqun), Everyday Cotton/Linen Han-Style Clothing, Embroidered Hanfu Cloak. The original store of a nationally famous local Chengdu Hanfu brand, nestled in the quaint ancient alleys of Wenshu Monastery area. Dedicated to promoting Hanfu culture, the shop offers exquisite brocade skirts and casual daily Hanfu fusion wear. A must-visit landmark for fans of traditional Chinese fashion and Guochao (China-Chic).", "name": "Chonghui Hantang Hanfu Flagship Store", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 500m walk"}, {"address": "No. 12 Jinzhu Street, Wenshufang Neighborhood, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Shu Embroidery Silk Scarf, Double-Sided Embroidered Panda Tote Bag, Delicate Shu Embroidery Frog-Button Jacket. Located right next to Wenshu Monastery, this shop showcases intangible cultural heritage by blending Shu Embroidery\u2014one of China\u0027s four famous embroidery styles\u2014into modern clothing and accessories. Handcrafted by skilled embroiderers, the items feature intricate stitching and rich Oriental charm, perfect for daily wear or collecting.", "name": "Shu Brocade \u0026 Embroidery Cultural Boutique", "transport": "Metro Line 1 Wenshu Monastery Station Exit B, approx. 450m walk"}, {"address": "No. 36 Jiangyuangongsuo Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Naturally Plant-Dyed Cotton/Linen Long Robe, Handmade Plant-Dyed Canvas Bag, Vintage Handcrafted Multi-Layer Sole Cloth Shoes. An independent clothing boutique located along the iconic red walls outside Wenshu Monastery, beloved by locals who cherish Zen aesthetics and slow living. Featuring natural botanical dyes and pure cotton-linen fabrics, their loose-fitting, comfortable garments exude an artistic vibe, accompanied by limited-edition handcrafted bags and accessories.", "name": "Zen Linen Apparel \u0026 Craft", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 400m walk"}, {"address": "No. 55 Wenshuyuan Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Retro Embroidered Soft-Sole Women\u0027s Shoes, Men\u0027s Cotton-Linen Multi-Layer Sole Casual Shoes, Panda-Patterned Handmade Children\u0027s Shoes. A heritage time-honored shoe shop in Chengdu that adheres to traditional craftsmanship in making multi-layered cloth shoes. Breathable, sweat-absorbent, and extraordinarily comfortable, these shoes now feature modern Guochao and panda motifs, attracting both young locals and travelers.", "name": "Shuxiang Traditional Handmade Shoes", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 380m walk"}, {"address": "No. 8 Wuyuegong Street, Wenshufang Neighborhood, Qingyang District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Song Dynasty Two-Piece Ruqun, Vintage Handmade Hairpins \u0026 Sachet Pouch, Embroidered Cloud Collar Handbag. An original Hanfu and accessory store set within the ancient architecture of Wenshufang. Besides Hanfu rental experiences, visitors can purchase original custom Hanfu designs, exquisite bags, and hair ornaments. Friendly staff provide styling advice, making it a popular gathering spot for local Hanfu enthusiasts.", "name": "Yanxiangge Original Hanfu \u0026 Accessories Studio", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 480m walk"}, {"address": "No. 1 Wenshufang Neighborhood Entrance, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Panda Embroidered Baseball Cap, Giant Panda Canvas Tote Bag, 3D Plush Panda Slippers. A local original creative clothing and accessory shop tailored for panda lovers. It effortlessly combines cute panda motifs with trendy modern streetwear, casual footwear, and bags. High-quality products showcase Chengdu\u0027s unique laid-back and playful humor.", "name": "Panda House Wenshufang Flagship Store", "transport": "Metro Line 1 Wenshu Monastery Station Exit B, approx. 300m walk"}, {"address": "No. 26 Jinzhu Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Modernized Handmade Xiangyun Silk Qipao, Double-Sided Silk Floral Shawl, Vintage Pearl Frame Clasp Handbag. A long-established traditional silk and qipao shop in Chengdu, renowned for high-quality Gambiered Guangdong Silk (Xiangyun Silk) and mulberry silk fabrics. Offering custom tailoring on-site as well as off-the-rack purchases, its classic and elegant cuts cater wonderfully to women who appreciate classical Oriental elegance.", "name": "Jinhua Silk \u0026 Traditional Apparel", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 520m walk"}, {"address": "No. 18 Baixi Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Chengdu Dialect Heavyweight Printed T-Shirt, Shu Brocade Patchwork Streetwear Backpack, Bamboo-Woven Style Leather Coin Purse. An independent brand founded by young local Chengdu designers, seamlessly blending Chengdu dialect, teahouse culture, and modern street fashion. The shop carries unique clothing, hats, and backpacks that are immensely popular among trendy local youth and travelers looking for distinctive souvenirs.", "name": "Caotangke Local Streetwear Boutique", "transport": "Metro Line 1 Wenshu Monastery Station Exit K, approx. 600m walk"}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 19 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Salt \u0026 Pepper Peach Slices, Napoleon Cake, Scallion Walnut Crisps. This time-honored bakery has seen long lines daily for decades, making it the top choice for Chengdu locals buying traditional nostalgic pastries. The Salt \u0026 Pepper Peach Slices offer a perfect savory-sweet balance and crispy texture; the Napoleon Cake features rich layers at an affordable price. Both older generations and young tourists come specifically to purchase these in bulk as gifts.", "name": "Gong Ting Pastry Shop (Wenshu Monastery)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 5 minutes."}, {"address": "No. 18 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Egg Yolk Pastry, Dragon Beard Candy, Black Sesame Crisps. Located right next to the ancient Wenshu Monastery, this famous traditional Chengdu bakery is as renowned as Gong Ting Pastry Shop. The Egg Yolk Pastry has flaky, layered crusts with sweet (yet not overly rich) red bean paste and a fragrant egg yolk center. The Dragon Beard Candy melts in your mouth with an authentic Chengdu heritage touch, and its elegant packaging makes it an ideal gift.", "name": "Wen Su Yuan Bakery", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 5 minutes."}, {"address": "Inside Wenshufang Pedestrian Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Panda Commemorative Stamp Postcards, Huahua 3D Wooden Bookmarks, Panda-shaped Cookies. A creative concept store that seamlessly blends panda culture with postal services. The store provides exclusive panda postmark stamping services and sells a variety of stylish panda-themed souvenirs and delicate snacks, making it immensely popular among hipsters and tourists.", "name": "Panda Post (Wenshu Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 6 minutes."}, {"address": "No. 38 Jiangyuan Gongsuo Street, near Wenshufang, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Five-Spice Beef Jerky, Hand-Shredded Spicy Beef Strips, Dengying (Shadow-thin) Crispy Beef Shreds. An iconic time-honored beef jerky brand in Chengdu, inheriting traditional air-drying and custom spicy-and-numbing braising techniques. The jerky is wonderfully chewy, flavorful, and never dry, while the Dengying Beef is paper-thin, translucent, and crispy\u2014making it the ultimate snack to pair with traditional Chengdu tea.", "name": "Huangcheng Ba Beef Jerky (Wenshu Store)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 7 minutes."}, {"address": "Inside Chengdu Research Base of Giant Panda Breeding, No. 1375 Panda Avenue, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Celebrity Panda \u0027Huahua\u0027 Plush Toys, Panda Bamboo-shaped Chocolates, Panda Print Craft Beer. Located inside the Chengdu Research Base of Giant Panda Breeding, this official flagship store offers the latest and most complete selection of panda merchandise and specialty foods. The panda chocolates are life-like and rich in flavor, and the plushies are realistic\u2014making it an unmissable shopping spot when visiting the Panda Base.", "name": "Chengdu Panda Base Official Souvenir Store", "transport": "Take Chengdu Metro Line 3 to Panda Avenue Station, then transfer to the scenic shuttle bus or Bus Route 87."}, {"address": "Inside Wenshu Monastery Scenic Area, No. 63 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Wenshu Handmade Zen Tea Gift Set, Traditional Low-Sugar Mung Bean Cakes, Agarwood Calming Incense. Situated within the Wenshu Monastery area, this specialty gift shop focuses on refreshing Sichuan tea and monastic vegetarian pastries. The mung bean cakes are crafted using low-sugar traditional methods, yielding a cool and silky mouthfeel; the Zen Tea gift sets feature selected Sichuan high-mountain green tea and Mengding Ganlu in elegant Zen-inspired packaging, making them sophisticated gifts filled with blessings.", "name": "Wenshu Temple Zen Tea \u0026 Specialty Gift Shop", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 6 minutes into Wenshu Monastery."}, {"address": "Caoshi Street Intersection, Wenshufang, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Premium Pixian Doubanjiang (Chili Bean Paste), Sichuan Spicy Hot Pot Base, Vacuum-Packed Cold-Eaten Rabbit Snacks. A professional souvenir store bringing together famous specialty products from across Sichuan. Most popular are the Pixian Doubanjiang\u2014known as the \u0027soul of Sichuan cuisine\u0027\u2014and individually packaged spicy cold-eaten rabbit snacks, allowing travelers to easily bring authentic Sichuan spicy flavors home. The attentive staff also provides leak-proof packaging services.", "name": "Shucuifang Sichuan Specialty Souvenirs (Wenshu Branch)", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit B), then walk for about 4 minutes."}, {"address": "No. 12 Jinsi Street, Wenshufang, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Spicy Panda Bamboo Shoots Crisps, Handmade Bamboo Woven Placemats, Mount Qingcheng Cured Pork Jerky. Combining Sichuan\u0027s intangible cultural heritage of bamboo weaving with specialty bamboo shoot snacks, this boutique showcases rich Western Sichuan folk charm. Its \u0027Panda Bamboo Shoot Crisps\u0027 are made from marinated tender high-mountain bamboo shoots, offering a sour, spicy, crisp, and appetizing texture. Paired with exquisite handcrafted bamboo art, it makes a wonderful souvenir rich in both flavor and cultural heritage.", "name": "Shuyi Bamboo Craft \u0026 Bamboo Crisp Shop", "transport": "Take Chengdu Metro Line 1 to Wenshu Monastery Station (Exit K), then walk for about 8 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Near the intersection of Tianfu Avenue North Section and the City Ring Expressway, Jinniu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-buy list: Nike sneakers at up to 70% off, classic printed COACH tote bags, Max Mara wool coats. As a landmark large-scale outlet center in northern Chengdu, it features Italian castle-style architecture housing hundreds of renowned international brands and high-end local apparel. Offering incredible year-round discounts as low as 70% to 90% off, especially in the sportswear and international affordable luxury bag zones, it is an absolute bargain-hunting paradise for shopaholics.", "name": "Sasseur Outlet Chengdu", "transport": "Take Metro Line 5 to Jiudaoyan Station, then walk or take a connecting taxi."}, {"address": "No. 19 Wenshuyuan Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-buy list: Traditional salt-and-pepper walnut slices, signature Napoleon cake, rich egg yolk pastries. This is Chengdu\u0027s most famous time-honored traditional bakery, always bustling with long queues. Adhering to decades of traditional craftsmanship, their pastries feature authentic ingredients at extremely affordable prices. Rich in milky aromas and savory salt-and-pepper flavors, these pastries are beloved local treats from childhood and a classic souvenir when visiting Wenshu Monastery.", "name": "Gongting Pastry Shop (Wenshu Monastery Main Branch)", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit K) and walk for about 5 minutes."}, {"address": "Inside Wenshu Fang Block, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade double-sided Shu embroidered panda table screens, pure silk Shu brocade plant-dyed scarves, classic embroidered hanging car sachets. Located within the Wenshu Fang Historic and Cultural Block, this shop specializes in National Intangible Cultural Heritage items: \u0027Shu Brocade\u0027 and \u0027Shu Embroidery\u0027. Live demonstrations by master embroiderers vividly bring giant pandas, flowers, birds, and landscapes to life on silk. Highly artistic and collectible, these exquisite handicrafts perfectly embody Chengdu\u0027s rich cultural heritage.", "name": "Wenshu Fang - Shu Embroidery \u0026 Brocade Craft Shop", "transport": "Take Metro Line 1 to Wenshu Monastery Station (Exit K) and walk for about 3 minutes to enter Wenshu Fang." cal specialty food gift shop in the Wenshu Monastery district.", "name": "Wenshu Fang - Zhangfei Beef Flagship Store", "transport": "Take Metro Line 1 to Wenshu Monastery Station and walk for about 4 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Giant Panda Base and Wenshu Monastery"}, "wuhou_jinli": {"categories": {"cat_1": {"items": [{"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-buy list: Duck Egg Face Powder, Duck Egg Solid Perfume, Blue \u0026 White Porcelain Solid Perfume. China\u0027s century-old brand and creator of duck egg powder. Located inside Jinli Ancient Street, its antique shop decor recreates Qing Dynasty boudoir style. Featuring an elegant and lasting fragrance, it makes a traditional cosmetic souvenir rich in Oriental charm.", "name": "Xiefuchun (Jinli Branch)", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station Exit D, and walk for about 10 minutes."}, {"address": "Phase 2, Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-buy list: Pearl Cream, Pien Tze Huang Skin Brightening Cream, Herbal Anti-Acne Toothpaste. Inheriting centuries of traditional Chinese medicine classics, it integrates herbal formulas into modern skincare technology. The Jinli Experience Store offers professional skin testing and traditional herbal skincare experiences, with its iconic Pearl Cream being a hugely popular hit for brightening and moisturizing.", "name": "Pien Tze Huang Museum Experience Store (Jinli Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then transfer to Bus 57 and get off at Wuhou Shrine Station."}, {"address": "Jinli Folk Leisure Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-buy list: Carved Lipstick, Fairy Peach Blossom Powder, Blooming Love Lock Lipstick. A wildly popular Chinese
