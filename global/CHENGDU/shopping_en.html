igners in Sichuan and around the world, offering everything from textured apparel to stylish shoes and bags. It is a top recommendation for fashion lovers in the Financial City area.", "name": "HUG Concept Select Shop (in99 Store)", "transport": "Take Chengdu Metro Line 1 to Financial City Station, then walk for about 6 minutes."}, {"address": "1st Floor, Unicenter ICP, No. 300 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.9 stars | Must-Buy List: Shu embroidery peony handmade high heels, silk embroidered clutch evening bag, custom embroidered sheepskin flats. Sheme is a top-tier international original women\u0027s shoe brand born in Chengdu. It integrates \u0027Shu Embroidery\u0027\u2014a national intangible cultural heritage\u2014into modern luxury footwear and handbag design. Every pair of shoes and bag is crafted jointly by experienced traditional embroiderers and Italian footwear artisans, combining elegant Oriental aesthetics with supreme comfort. It stands as an iconic high-end cultural luxury brand in Chengdu.", "name": "Sheme Shu Embroidery Handmade Luxury Shoes Flagship Store (Gaoxin)", "transport": "Take Chengdu Metro Line 5 to Jiaozi Avenue Station, Exit A, then walk for about 3 minutes."}, {"address": "2nd Floor, Ufun Shopping Center, No. 288 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Cloud puffy crossbody bag, utility multi-pocket techwear vest, oversized graphic sweatshirt. Crying Center is a hugely popular independent streetwear brand originating from Southwest China. It shot to fame with its minimalist industrial style and functional accessories. Its signature puffy down-like crossbody bags and laptop bags are staple items among Chengdu college students and young professionals, offering exceptional value for money and stylish design.", "name": "Crying Center Streetwear \u0026 Bags (Gaoxin Store)", "transport": "Take Chengdu Metro Line 1 to Financial City Station, Exit B, then walk for about 5 minutes."}, {"address": "1st Floor, Oriental Hope Global Center, No. 500 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: 3D deconstructed dress, architectural-line women\u0027s ankle boots, handmade brass geometric bag. A3 is a local high-end independent apparel boutique in Gaoxin District, specializing in niche, unique minimalist and deconstructivist styles. The store carefully curates pieces from emerging local Chengdu designers and independent Asian brands, offering distinctive clothing, handmade leather goods, and accessories along with professional styling advice, highly favored by local fashion enthusiasts.", "name": "A3 Independent Designer Select Store", "transport": "Take Chengdu Metro Line 5 to Jiaozi Avenue Station, Exit B, then walk for about 4 minutes."}, {"address": "B1 Floor, Tianfu International Financial Center, No. 966 Tianfu Avenue North Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Chengdu city typography limited-edition T-shirt, waterproof tactical functional crossbody bag, reflective bucket hat. STREETLAB is a word-of-mouth favourite select shop among Chengdu trendsetters, specializing in popular domestic and international streetwear, shoes, bags, and designer accessories. The store boasts a futuristic sci-fi vibe and frequently hosts local street culture exhibitions and limited-edition sneaker drops. It is a must-visit spot for young tourists who love street style and unique niche bags.", "name": "STREETLAB Select Store (Gaoxin)", "transport": "Take Chengdu Metro Line 1 to Financial City Station, Exit C connects directly to the shopping street."}, {"address": "1st Floor, Fortune Year Plaza, No. 666 Jitai Road, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Niche designer patchwork wool coat, vintage leather biker bag, sterling silver hand-carved jewelry. S45 is a highly popular local multi-brand select store in Chengdu\u0027s Gaoxin District, focused on promoting high-quality, uniquely tailored apparel, shoes, and bags from local and international designers. The store offers a quiet and elegant atmosphere, stocking everything from smart business-casual outfits to stylish everyday leather bags\u2014perfectly matching the refined taste of Financial City white-collar workers and fashion aficionados.", "name": "S45 Multi-Brand Select Store (Gaoxin)", "transport": "Take Chengdu Metro Line 1 to Tianfu 3rd Street Station, Exit A, then walk for about 7 minutes."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "B1, New Century Global Center, No. 1700 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Shudaoxiang Spicy Beef, Zhang Fei Spicy Beef Jerky, Emei Xue Peach Soda. Located on B1 of Global Center, this flagship supermarket features a dedicated Sichuan specialties area, making it the top choice for snack shopping in Gaoxin. Spaciously laid out with transparent pricing, it is highly recommended to try Emei Xue\u2014a nostalgic peach soda locals grew up drinking\u2014and Shudaoxiang\u0027s individually wrapped beef jerky, which is chewy, flavorfully spicy, hygienic, long-lasting, and perfect for sharing around the office.", "name": "Freshippo (Global Center Outlet)", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station and enter Global Center directly via the underground passage."}, {"address": "1F, Area W1, Global Center, No. 1700 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Shu Embroidery Panda Handkerchiefs, Shu Brocade Panda Coin Purses, Bamboo-Woven Panda Tea Cups. Situated inside Global Center, this boutique shop specializes in transforming Sichuan\u0027s intangible cultural heritage\u2014Shu Brocade and Shu Embroidery\u2014into exquisite handmade gifts. Handkerchiefs and small purses are intricately sewn by local artisans with vivid panda motifs, serving as highly representative, portable pieces of Tianfu culture.", "name": "Tianfu Specialty \u0026 Shu Embroidery Souvenir Shop (Global Center)", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station; walk for about 5 minutes."}, {"address": "Commercial Street, Area E1, Global Center, No. 1700 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Signature Original Peanut Brittle, Black Sesame Brittle, Salt \u0026 Pepper Spicy Peanut Candy. A celebrated historic pastry brand in Sichuan known for traditional handmade brittle. Crafted using select local peanuts and maltose, their brittle is nutty, crunchy, and non-sticky. The exclusive Salt \u0026 Pepper Spicy flavor blends Sichuan numbing spice with sweet peanut aromas for a delightfully unique local treat.", "name": "Huanglaowu Peanut Brittle (Global Center Outlet)", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station and enter the Global Center lobby via Exit E1."}, {"address": "5F, MOP Shopping Center, No. 300 Jiaozi Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.8 stars | Must-Buy List: Chen Mapo Tofu Seasoning Packs, Sichuan Boiled Pork Seasoning Base, Tianfu Spicy Mapo Sauce Cans. A specialty gift counter set up by the centuries-old Chen Mapo Tofu brand inside MOP Mall on Jiaozi Avenue. These authentic Sichuan seasoning packs let you easily recreate legendary Mapo Tofu at home simply by adding tofu and minced meat\u2014an ideal present for cooking enthusiasts.", "name": "Chen Mapo Tofu Gift Box Shop (Gaoxin MOP Outlet)", "transport": "Take Chengdu Metro Line 5 to Jiaozi Avenue Station Exit C; walk for about 3 minutes."}, {"address": "B1, K Avenue, Chengdu SKP, No. 2001 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Zhuyeqing Green Tea Gift Box, Pujiang Red-Heart Dried Kiwifruit, Mount Qingcheng Cured Bacon Deluxe Gift Box. Located inside the luxury landmark SKP in Financial City, this store caters to travelers looking for high-end gifts. It gathers top-grade agricultural products and famous teas from across Sichuan, elegantly packaged. The flagship Zhuyeqing green tea\u2014boasting clear liquor and a subtle chestnut aroma\u2014is a prestigious corporate or executive souvenir.", "name": "Yipin Tianxia Sichuan Specialty Center (Financial City SKP)", "transport": "Take Chengdu Metro Line 1 or 18 to Jincheng Plaza East Station, which directly connects to the SKP underground mall."}, {"address": "Commercial Arcade, Exit C, Gaoxin Metro Station, North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Vacuum-packed Spicy Rabbit Heads, Five-Spice Duck Tongues, Spicy Chili Dip Powder Packs. Located in the Gaoxin Metro commercial arcade, this shop specializes in Chengdu cold dishes and vacuum-sealed delicacies. Chengdu\u0027s love for rabbit head is famous nationwide; braised with spices and soaked in chili oil, the meat is tender and fiery. Securely vacuum-sealed to preserve authentic flavors, they are easy to pack for flights or high-speed rail.", "name": "Chengdu Lisi Spicy Rabbit Head \u0026 Local Souvenirs (Gaoxin Metro Outlet)", "transport": "Take Chengdu Metro Line 1 to Gaoxin Station; located right inside the station\u0027s commercial street upon exit."}, {"address": "2F, Area N2, Global Center, No. 1700 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.3 stars | Must-Buy List: Dengying Shredded Beef, Sichuan Cold-Cooked Rabbit, Cold-Cooked King Oyster Mushrooms. Located inside Global Center, this casual snack store features a dedicated section for Sichuan spicy cold snacks. Highlights include paper-thin, crispy Dengying shredded beef and classic Zigong cold-cooked rabbit. Conveniently portioned into small packs, they are immensely popular among young travelers seeking spicy nibbles.", "name": "Three Squirrels \u0026 Sichuan Local Snacks (Global Center)", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station, enter Global Center, and take the escalator to 2F Area N2."}, {"address": "B1, Area W2, Global Center, No. 1700 North Section, Tianfu Avenue, Gaoxin District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Signature Salt \u0026 Pepper Walnut Pastry, Panda Egg Yolk Pastry, Traditional Sichuan Pepper Nougat. A legendary representative of classic Sichuan pastries, their freshly baked salt \u0026 pepper walnut pastry (Taosu) melts in your mouth with a savory-sweet nuance and a hint of Sichuan peppercorn. Cute panda-shaped egg yolk pastries and peppercorn nougats add creative flair, making them a favorite souvenir among tourists.", "name": "Gongting Taosu Local Pastry Store (Jiaozi Global Center Outlet)", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station and walk to the basement level of Area W2, Global Center."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1700, Tianfu Avenue North Section, Wuhou District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Shu brocade silk scarves, Panda-themed creative mugs, and Sichuan specialty Zhangfei Beef gift boxes. Known as the world\u0027s largest standalone building by floor area, this mega shopping center features an indoor beach, a movie theater, and hundreds of brand flagship stores. It offers a rich array of local Chengdu creative souvenirs and Shu embroidery crafts, making it an unmissable landmark shopping paradise in the High-Tech Zone.", "name": "New Century Global Center", "transport": "Take Chengdu Metro Line 1 to Jincheng Plaza Station; the station exit connects directly to the Global Center."}, {"address": "No. 99, Shuangnan Avenue 3rd Section, Shuangliu District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Deeply discounted Nike sneakers, classic Coach leather handbags, and Arc\u0027teryx outdoor functional jackets. Chengdu\u0027s most famous classic outlet center, located very close to the High-Tech Zone, features European-style town architecture. Housing over 200 renowned international brands, it offers year-round discounts ranging from 50% to 90% off, making it a must-visit sanctuary for shopaholics looking for discounted luxury brands and sportswear.", "name": "Times Outlets Chengdu", "transport": "Take Chengdu Metro Line 3 to Longqiaolu Station, then transfer to a bus or taxi for about 5 minutes."}, {"address": "No. 500, Jiaozi Avenue, Wuhou District, Chengdu", "feature": "\u2b50 4.8 stars | Must-Buy List: SKP Select exclusive designer apparel, high-end niche perfume sets, and Sichuan-limited co-branded luxury gift boxes. A top-tier landmark department store in the heart of Chengdu Financial City, featuring a unique design that combines a sunken park with underground luxury retail. In addition to numerous top-tier luxury brands, its curated multi-brand store, SKP Select, introduces a vast array of domestic and international independent designer creations and luxury lifestyle products.", "name": "Chengdu SKP", "transport": "Take Chengdu Metro Line 1 or Line 18 to Incubation Park Station, then walk for about 3 minutes."}, {"address": "No. 1199, Tianfu Avenue North Section, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Zhongshuge creative planners/journals, local artist co-branded scented candles, and designer handmade accessories. A high-quality shopping center in the heart of Financial City that combines art exhibitions, upscale retail, and specialty dining. It features the famous Instagrammable bookstore Zhongshuge and several pop-up shops from local Chengdu independent designers, brimming with modern urban and artistic charm.", "name": "Yintai Centre in99", "transport": "Take Chengdu Metro Line 1 to Financial City Station, then walk for about 8 minutes."}, {"address": "1F, Yintai Centre in99, No. 1199, Tianfu Avenue North Section, Wuhou District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Original solid wood coasters, local handmade ceramic tea sets, and original home fragrance sprays. The flagship space of a contemporary Chinese original furniture and lifestyle aesthetic brand, blending traditional Oriental woodworking crafts with modern minimalist design. Beyond displaying exquisite furniture, the store sells high-textured local designer tableware and home goods, perfect for collection or gifting.", "name": "FNJI (Chengdu Financial City Store)", "transport": "Take Chengdu Metro Line 1 to Financial City Station, then walk for about 8 minutes."}, {"address": "1F, Yintai Centre in99, No. 1199, Tianfu Avenue North Section, Wuhou District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Luxury cosmetics travel samples, Chinese indie makeup eyeshadow palettes, and niche perfumer fragrances. A highly representative warehouse-style beauty multi-brand store in China whose industrial-style decor attracts countless young visitors. The store curates a wide range of niche skincare and makeup brands from China and abroad, offering a vast array of deluxe samples that allow shoppers to easily try high-end beauty products at budget-friendly prices.", "name": "HARMAY Chengdu", "transport": "Take Chengdu Metro Line 1 to Financial City Station, then walk for about 8 minutes."}, {"address": "No. 300, Jiaozi Avenue, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Chengdu local streetwear original T-shirts, handmade vegetable-tanned leather coin purses, and Sichuan tea-flavored limited gift sets. A trendy shopping center located in the Financial City Jiaozi Commercial District, focusing on youth fashion and quality lifestyle. It features several local Chengdu streetwear brands, home goods stores, and refined boutique select shops, making it an excellent spot to experience Chengdu\u0027s youth culture and shopping trends.", "name": "M\u2022CUBE Chengdu", "transport": "Take Chengdu Metro Line 5 to Jiaozi Avenue Station, then walk for about 2 minutes."}, {"address": "Jiufang Shopping Center, No. 399, Fucheng Avenue West Section, Wuhou District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Chengdu Qingshen handmade bamboo-woven teacup sleeves, 3D panda culture postcards, and Sichuan specialty Tibetan tea culture gift boxes. An artistic lifestyle complex in Jiufang Shopping Center in the High-Tech Zone, combining classic reading spaces with local Sichuan handicrafts and creative products. The store features a dedicated area for local Sichuan creators, selling items rich in Chengdu\u0027s cultural essence and traditional craftsmanship, highly favored by tourists and culture enthusiasts.", "name": "Sanlian Taofen Bookstore \u0026 Local Select Store", "transport": "Take Chengdu Metro Line 1 to Gaoxin Station, then walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Hi-Tech Zone, Financial City and Global Center"}, "huanglongxi_ancient_towns": {"categories": {"cat_1": {"items": [{"address": "No. 12 Zheng Street, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buys: Chuanxiong Pearl Whitening Mask, Panax Notoginseng Herbal Anti-Wrinkle Cream, Fritillaria \u0026 Loquat Lip Balm. A century-old Sichuan pharmacy brand that seamlessly blends traditional Chinese medicine principles with modern skincare technology. Located in Huanglongxi Ancient Town, this branch retains its classic wooden apothecary decor and apothecary drawers, offering exclusive custom-blended herbal cosmetics and skincare products. The herbal face mask powder is freshly ground and formulated on the spot by experienced TCM practitioners, making it a favorite among visitors who love natural Chinese herbal skincare.", "name": "Derentang Pharmacy (Huanglongxi Ancient Town Store)", "transport": "Take Shuangliu Bus S18 to Huanglongxi Passenger Transport Station, then walk for about 8 minutes."}, {"address": "No. 45 Longshu Street, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buys: Traditional Egg-shaped Scented Powder, Osmanthus Egg-shaped Solid Perfume, Feitian Rouge. A centuries-old Chinese traditional imperial cosmetics brand featuring an independent flagship store tucked in the picturesque streets of Huanglongxi Ancient Town. Insisting on natural botanicals and ancient Oriental methods, its signature egg-shaped powder offers a fine texture infused with rich floral scents\u2014perfect for setting makeup while nourishing the skin. It is an absolute must-buy vintage cosmetic souvenir when visiting the town.", "name": "Xiefuchun Traditional Cosmetics Shop (Huanglongxi)", "transport": "Take the Huanglongxi Ancient Town Sightseeing Tram to Longshu Street Station; the shop is right there."}, {"address": "No. 88 Fuxing Street, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buys: Saffron Repairing Essence Oil, Centella Soothing Mask, Mugwort Warming Cleansing Balm. An independent specialty skincare shop nestled among ancient buildings, highlighting local Sichuan herbal extracts. The R\u0026D team combines authentic Sichuan herbs like saffron, Chuanxiong, and mugwort to create gentle skincare tailored for Asian skin. The store offers free herbal skin consultations and on-site testing. The packaging creatively incorporates Shu brocade and panda elements, making products both practical and memorable souvenirs.", "name": "Shuyun Bencao Herbal Skincare Shop", "transport": "Take Bus 541 to Huanglongxi Ancient Town Station, then walk for about 5 minutes."}, {"address": "No. 18 Ancient Street (next to Zhenjiang Tower), Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.3 stars | Must-Buys: Hemsleya Oil-Control Hydrating Lotion, Kuding Tea Anti-Acne Gel, Zhu Yeqing Anti-Oxidant Serum. A local green skincare brand that harnesses extracts from wild high-mountain plants around Mount Emei. The shop boasts a simple, fresh aesthetic filled with a subtle tea aroma. Featuring pure plant extracts with zero artificial additives, its serums and acne gels crafted from Sichuan alpine tea leaves are remarkably effective against skin trouble caused by hot, humid weather, making them widely popular among youth and tourists.", "name": "Emeishan Botanical Cosmetics (Huanglongxi)", "transport": "Take Shuangliu Bus S18B to the Huanglongxi Ancient Town Entrance, then walk for about 6 minutes."}, {"address": "No. 302, Section 2, Huanglong Avenue, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.2 stars | Must-Buys: Taiji Gromwell Root Ointment, Sweet Wormwood Soothing Spray, Herbal Rhodiola Brightening Cream. A well-known pharmacy chain across Sichuan and Chongqing with a large store in the Huanglongxi commercial area featuring a dedicated Chinese herbal cosmetics section. In addition to medical supplies, its self-developed gromwell ointment and sweet wormwood spray provide excellent soothing relief for mosquito bites and skin redness\u2014essential travel items for adapting to Sichuan\u0027s climate.", "name": "Taiji Pharmacy Herbal Beauty Counter", "transport": "Take Bus 844 to Huanglongxi Town Government Station, then walk for about 3 minutes."}, {"address": "No. 23 Chuanzumiao Street, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buys: Shu Brocade Sachet Solid Perfume, Sichuan Peppercorn Soothing Essential Oil, Hibiscus Hydrosol Moisturizing Spray. An independent experiential shop seamlessly blending Chengdu\u0027s Shu culture, traditional perfumery, and herbal cosmetics. It exclusively formulates beauty products infused with Chengdu\u0027s official city flower (hibiscus) and local Sichuan peppercorns, offering a unique fragrance and exceptional soothing and hydrating qualities. Visitors can also participate in hands-on DIY workshops to create traditional solid balm, making it a wonderful mix of shopping and cultural experience.", "name": "Haitang Chinese Herbal Perfume \u0026 Cosmetics Loft", "transport": "Take Shuangliu Bus S18 to Huanglongxi Scenic Area Entrance, then walk for about 5 minutes."}, {"address": "1st Floor, Shopping Mall, No. 218, Section 3, Huanglong Avenue, Shuangliu District, Chengdu", "feature": "\u2b50 4.1 stars | Must-Buys: Florasis Loose Powder, TIMAGE Contour Palette, Pechoin Herbal Cream. Although an international drug and beauty chain, this store features a special \u0027Guochao Beauty \u0026 Sichuan-Style Skincare Zone\u0027 tailored for tourists. It aggregates popular Chinese makeup brands and local Sichuan herbal skincare lines. Well-stocked and frequently offering discounted bundles for travelers, it\u0027s an extremely convenient spot to touch up makeup or restock supplies.", "name": "Watsons (Shuangliu Huanglongxi Commercial Area Store)", "transport": "Take Bus 541 to Section 3 of Huanglong Avenue Station, then walk for about 2 minutes."}, {"address": "No. 15 Sanjing Lane, Huanglongxi Town, Shuangliu District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buys: Poria Cocos Whitening Mask Powder, Pearl Seven-White Paste, Polygonum Multiflorum Hair-Darkening Shampoo. Hidden deep within the alleyways of Huanglongxi Ancient Town, this Chinese herbal beauty shop is run by a family of veteran TCM practitioners. Specializing in imperial whitening formulas and folk herbal cosmetics, their products are crafted entirely from finely ground natural Chinese herbs. Offering on-site trial applications and herbal scalp care products, its gentle, non-irritating quality draws many repeat customers specifically returning to purchase.", "name": "Bencaotang Traditional Beauty \u0026 Wellness Center", "transport": "Take the Huanglongxi Scenic Area Electric Cart to Sanjing Lane Station, then walk for about 1 minute."}], "name": "Local Signature Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 68 Zhenlong Street, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.8 stars | Must-Buy List: Shu brocade embroidered Hanfu, vintage crossover shirts, Shu embroidery hair accessories. Located in the core block of Huanglongxi Ancient Town, this studio focuses on blending traditional Sichuan Shu brocade with modern Hanfu design, making it extremely popular among young people who love \u0027Guochao\u0027 (China-chic) and ancient-style photography. The store offers exquisite hand-sewn Hanfu clothing and hair ornaments made from skin-friendly, breathable fabrics, adorned with embroidery patterns distinct to the Shu region.", "name": "Longxi Shu Brocade \u0026 Hanfu Studio", "transport": "Take Bus 541 to Huanglongxi Bus Station, then walk for about 8 minutes."}, {"address": "No. 12 Pedestrian Street, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Plant-dyed silk scarves, hand-woven cotton frog-button tops, loose retro wide-leg pants. This is the most popular natural fabric clothing store in the ancient town, emphasizing nature, comfort, and Zen aesthetics. All garments are dyed using natural botanical pigments with soft, soothing color tones. Both locals and travelers who value quality clothing often make a special trip here to pick out original cotton and linen pieces.", "name": "Caimianju Handmade Cotton \u0026 Linen Apparel", "transport": "Take Bus 541 or S18 to Huanglongxi Ancient Town Station, then walk for about 5 minutes."}, {"address": "No. 45 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Shu embroidery peony crossbody bags, double-sided embroidered coin purses, bamboo-woven tassel handbags. Specializing in handmade bags that incorporate Sichuan\u0027s intangible cultural heritage Shu embroidery skills, the shop offers everything from delicate clutches to spacious canvas-stitched totes. Resident embroiderers craft on-site, making every bag pattern a unique work of art\u2014perfect as a souvenir infused with Chengdu\u0027s cultural charm.", "name": "Jinxiu Huanglong Handmade Embroidered Bags", "transport": "Take Bus S18 to Huanglongxi Scenic Area Station, then walk for about 6 minutes."}, {"address": "No. 102 Huanglong Street, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage handmade ankle boots, soft cowhide loafers, genuine leather woven sandals. Located on the old street of Huanglongxi Ancient Town, the owner boasts 30 years of shoemaking experience and insists on entirely hand-cutting leather and stitching. The footwear blends vintage aesthetics with modern casual style, featuring flexible soft rubber soles and genuine leather insoles for a comfortable, blister-free fit. Highly recommended by visitors for practical, quality footwear.", "name": "Lao Pi Jiang Handcrafted Leather Shoes", "transport": "Take Bus 541 to Huanglongxi Bus Station, then walk for about 10 minutes."}, {"address": "No. 33 Xinhua Street, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Tie-dyed indigo coats, blue floral print fabric bags, hand-dyed shawls. This original local boutique features traditional botanical tie-dyeing using woad root (Isatis root). Filled with a faint botanical fragrance, the shop displays a variety of blue-and-white clothing and accessories with unique, rustic aesthetic appeal\u2014a rare artistic fashion studio in the ancient town.", "name": "Shufeng Lanyin Indigo Tie-Dye Studio", "transport": "Take Bus 541 to Huanglongxi Station, then walk for about 7 minutes."}, {"address": "No. 18 Shuimatou Street, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Multi-layered sole (Qiancengdi) Hanfu cloth shoes, embroidered women\u0027s slippers, children\u0027s tiger-head shoes. Inheriting the traditional hand-stitched multi-layer sole craft, the shoes here are breathable, sweat-absorbent, snug, and durable. Alongside traditional black Kung Fu shoes, they offer stylish women\u0027s shoes with Shu embroidery patterns and adorable children\u0027s tiger-head shoes, attracting many craft enthusiasts on the hunt for hidden gems.", "name": "Qiancengdi Traditional Cloth Shoes", "transport": "Take Bus S18 to Huanglongxi Station, then walk for about 4 minutes."}, {"address": "No. 77 Chuanxi Folk Custom Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Western Sichuan Tibetan \u0026 Qiang style vests, handmade wool shawls, rattan-leather backpacks. Blending Western Sichuan ethnic flair with modern tailoring, the shop features a rich selection of ethnic-style jackets, scarves, and signature bags. Boasting vibrant colors with a modern edge, it\u0027s a favorite spot for influencers and hipsters looking for authentic Western Sichuan fashion pieces for photos.", "name": "Chuanxi Style Ethnic Fashion Boutique", "transport": "Take Bus 541 to Huanglongxi Station, then walk for about 9 minutes."}, {"address": "No. 50 Zhenjiang Road, Huanglongxi Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Bamboo-woven tote bags, Chengdu slang embroidered canvas bags, bamboo-handle leather mini bags. This local independent designer brand cleverly combines Chengdu\u0027s famous Qingshen bamboo weaving techniques with modern canvas and leather to create lightweight, stylish signature bags. Canvas bags printed with local Sichuan slang are hugely popular among young travelers.", "name": "Zhuyun Rongcheng Bamboo \u0026 Canvas Bags", "transport": "Take Bus S18 to Huanglongxi Scenic Area Entrance Station, then walk for about 5 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 58 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-buy list: Dried One-Strand Noodle Gift Box, Traditional Handmade Sesame Cake, Sichuan Fermented Tofu. Located in the core street area of Huanglongxi Ancient Town, this souvenir shop is a must-visit after watching the performance-style noodle stretching. The store converts the town\u0027s famous noodle-making craft into easy-to-carry dried noodle gift boxes, paired with homemade spicy sauce packets so visitors can recreate this famous dish at home. Additionally, their traditionally made sesame cakes are pleasantly sweet without being greasy, making them a popular gift for all ages.", "name": "Huanglongxi One-Strand Noodle \u0026 Souvenir Shop", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 or S18K to Huanglongxi Bus Station, and walk for about 8 minutes."}, {"address": "No. 12 Pedestrian Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Jiao Cake (Pan-Fried Crispy Cake), Peanut Crispy Cake, Handmade Shu Brocade Sachet. Jiao Cake is one of Huanglongxi\u0027s most iconic traditional pastries with hundreds of years of history. This time-honored brand insists on traditional pan-frying and baking techniques, resulting in thin crusts, fragrant fillings, and a crispy texture with subtle notes of sesame and Sichuan pepper. The shop offers exquisite gift boxes, perfect for friends and family, embodying the rich folk culture of western Sichuan ancient towns.", "name": "Huanglongxi Jiao Cake Specialty Shop", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus 541 or S18 to Huanglongxi Ancient Town Station."}, {"address": "No. 88 Zheng Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-buy list: Zhangfei Air-Dried Beef, Spicy Beef Jerky, Sichuan Cured Sausage. Although Zhangfei Beef has branches across Sichuan, this flagship store in Huanglongxi combines the local Three Kingdoms cultural heritage, featuring staff dressed in traditional Zhangfei costumes welcoming guests at the door. The beef is marinated with unique Chinese herbs and spices before being air-dried. Black on the outside and red inside, the meat is firm, chewy, savory, and spicy\u2014making it the perfect snack to pair with beer or tea.", "name": "Zhangfei Beef Huanglongxi Branch", "transport": "Take Bus S18 to Huanglongxi Ancient Town Terminal, enter the scenic area, and walk along Zheng Street for about 5 minutes."}, {"address": "No. 23 Fuxing Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-buy list: Spicy Red Oil Fermented Tofu, Green Sichuan Pepper Fermented Tofu, Handmade Ginger Candy. This workshop emphasizes traditional stone-grinding techniques. Their homemade fermented tofu features a dense, cheese-like texture packed with rich fermented soybean aroma and red chili oil flavor, making it a favorite condiment among locals to mix with rice or noodles. The shop also features a transparent demonstration area where customers can watch ginger candy being stretched and sliced; the freshly made ginger candy is warm, sweet, and spicy, making it a hit among tourists.", "name": "Huanglongxi Stone-Ground Fermented Tofu Workshop", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus 541 to Huanglongxi Station, and walk for about 6 minutes."}, {"address": "No. 102 Jiangfeng Street, Jiezi Ancient Town, Chongzhou, Chengdu City", "feature": "\u2b50 4.8 stars | Must-buy list: Western Sichuan Tang Sesame Cake, Salt \u0026 Pepper Black Sesame Cake, Traditional Mung Bean Cake. Tang Sesame Cake, originating from Jiezi Ancient Town in Chongzhou near Chengdu, is a Sichuan Provincial Intangible Cultural Heritage. Renowned across ancient towns in the region, this flagship shop crafts cakes with exquisite patterns, crispy crusts, and rich fillings that are sweet without being cloying, accented by hints of Sichuan pepper and sesame aroma. With its rich history, it is a top specialty pastry you shouldn\u0027t miss when exploring Chengdu\u0027s ancient towns.", "name": "Jiezi Ancient Town Tang Sesame Cake Shop", "transport": "Take a direct shuttle bus from Chengdu Chadianzi Bus Station to Jiezi Ancient Town, then walk for about 5 minutes."}, {"address": "1st Floor, Blog Building, Luodai Ancient Town, Longquanyi District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-buy list: Portable Sad Jelly Seasoning Pack, Luodai Oil-Scalded Duck Gift Box, Shuangliu Spicy Rabbit Head Vacuum Pack. Located in Luodai, a Hakka ancient town in eastern Chengdu, this specialty shop offers signature chili sauce gift boxes for the famous street snack \u0027Sad Jelly\u0027 (Sad Jelly Noodles), allowing visitors to recreate the intensely spicy Sichuan dish at home. Additionally, their vacuum-packed oil-scalded duck\u2014crispy on the outside and tender inside\u2014is a must-buy cooked souvenir from the local ancient town area.", "name": "Luodai Sad Jelly \u0026 Souvenir Shop", "transport": "Take Metro Line 4 to Xihe Station, transfer to Bus L024 to Luodai Bus Center, and walk for about 10 minutes."}, {"address": "No. 54 Shuren Street, Anren Ancient Town, Dayi County, Chengdu City", "feature": "\u2b50 4.5 stars | Must-buy list: Daoming Bamboo-Woven Tea Set, Mengding Mountain Yellow Tea Gift Box, Handmade Brown Sugar. Combining western Sichuan bamboo weaving craftsmanship with famous Sichuan tea culture, this souvenir hall showcases tea sets and daily homewares exquisitely woven by master local artisans, blending practical function with artistic value. The paired Mengding Mountain tea leaves are of exceptional quality, making for an elegant gift that embodies Chengdu\u0027s relaxed ancient town lifestyle.", "name": "Anren Ancient Town Craft \u0026 Tea Souvenir Hall", "transport": "Take a direct tourist bus from Chengdu Xinnanmen Bus Station to Anren Ancient Town, then walk for about 7 minutes."}, {"address": "No. 35 Longxin Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.3 stars | Must-buy list: Ancient Town Premium Rattan Pepper Oil, Pixian Handmade Doubanjiang (Bean Paste) Gift Box, Cold-Served Rabbit Vacuum Pack. Shuxiangyuan is the most comprehensive specialty store for Sichuan seasonings and snacks in Huanglongxi Ancient Town. It gathers top-tier pantry staples from across Sichuan, especially authentic rattan pepper (green Sichuan pepper) oil and long-fermented doubanjiang, which are immensely popular among cooking enthusiasts. Vacuum-packed snacks such as spicy cold-served rabbit and spicy beef jerky are also bestsellers.", "name": "Huanglongxi Shuxiangyuan Souvenir Shop", "transport": "Take Metro Line 5 to Huilong Station, transfer to Bus S18 to Huanglongxi Ancient Town Station, and walk for about 4 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Middle Section of Xihanggang Avenue, Shuangliu District, Chengdu City", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted Nike sneakers, classic Coach handbags, on-sale Ermenegildo Zegna suits. Located at the intersection of Shuangliu District and Tianfu New Area, this hugely popular large outlet features Italian architectural styling. Home to over 300 renowned international and domestic brands, it offers fantastic discounts of 50% to 90% off year-round. The shopping environment is spacious and comfortable, featuring a large children\u0027s play area and a vibrant food street filled with local Chengdu delicacies. It\u0027s an ideal spot to spend half a day hunting for discounted designer items and enjoying leisure shopping.", "name": "Sasseur Outlet Chengdu", "transport": "Take Chengdu Metro Line 8 to Lianhua Station, then transfer to Bus S08 and get off at Sasseur Outlet Station."}, {"address": "No. 1, Section 3, Shuanghua Road, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Discounted Adidas jackets, Michael Kors chain bags, classic Timberland yellow boots. As an iconic, established large outlet in the southern suburbs of Chengdu and the Shuangliu area, Times Outlet brings together hundreds of top European and American luxury and sports/casual brands. Designed as an open-air European town, it frequently hosts festival promotions and gift-with-purchase events. Besides designer apparel, the mall features a dedicated Sichuan local specialty zone and rich dining choices, making it a popular shopping stop on the way to Huanglongxi Ancient Town.", "name": "Times Outlet Chengdu", "transport": "Take Chengdu Metro Line 3 to Shuangliuxi Station, then transfer to Bus 804 or take a taxi for about 10 minutes."}, {"address": "Section 2, Jinhe Road, Dongsheng Subdistrict, Shuangliu District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-Buy List: Shudao spicy beef jerky, Zhangfei Beef gift sets, Florasis Oriental face powder. This large modern shopping center is one of the most prominent commercial landmarks near Huanglongxi Ancient Town. The mall houses a large supermarket, international fast-fashion brands, cosmetics flagship stores, and a rich array of local dining spots. Visitors can enjoy a convenient, one-stop shopping experience for Sichuan\u0027s signature snacks and souvenirs at the specialty supermarket inside, all within a comfortable indoor environment.", "name": "Shuangliu Wanda Plaza", "transport": "Take Chengdu Metro Line 3 to Dongsheng Station and walk for about 8 minutes."}, {"address": "Section 2, Huayang Avenue, Huayang Subdistrict, Shuangliu District, Chengdu City", "feature": "\u2b50 4.2 stars | Must-Buy List: Puyi peanut crisp, Emei Xueya green tea, Sichuan Shu brocade handkerchiefs. Huayang Mall is a well-established local department store brand in Shuangliu Huayang and surrounding ancient town areas, deeply loved by locals and tourists alike. It features a special local agricultural product exhibition zone, highlighting authentic Chengdu heritage food brands, fine teas, and traditional handicrafts. With affordable prices and guaranteed quality, it\u0027s a great place to discover authentic Sichuan lifestyle goods and local specialties.", "name": "Huayang Mall Department Store", "transport": "Take Chengdu Metro Line 1 to Huayang Station Exit C and walk about 500 meters."}, {"address": "No. 88 Zhenlong Street, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade single-strand noodle gift sets, sesame cake, Huanglongxi stone-ground dried tofu. Located in the core area of Huanglongxi Ancient Town, this large local specialty department store offers authentic Western Sichuan products to tourists. Bringing together products from dozens of local traditional workshops, it displays freshly made snack gift boxes alongside beautifully packaged local products. The store is clean and well-kept, offering free tasting samples, making it the top choice for purchasing town-exclusive souvenirs.", "name": "Huanglongxi Local Specialty Department Mall", "transport": "Take Bus S18 from Shuangliu Bus Station to Huanglongxi Bus Station, then walk about 5 minutes into the ancient town."}, {"address": "Jinjiang Road, Huanglongxi Ancient Town Scenic Area, Shuangliu District, Chengdu City", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade double-sided embroidered silk scarves, panda-themed Shu embroidery ornaments, silk moisturizing hand cream. Situated near the ancient town, this shopping store focuses on Intangible Cultural Heritage, specializing in traditional Sichuan Shu brocade and Shu embroidery masterpieces. Beyond displaying exquisite embroidery techniques, the store sells modern lifestyle products, apparel, and beauty accessories designed by local master artisans. Blending Oriental aesthetics with contemporary fashion, every piece carries high collectible and sentimental value.", "name": "Shu Embroidery \u0026 Silk Heritage Store", "transport": "Accessible on foot within the Huanglongxi Ancient Town Scenic Area."}, {"address": "Xinjin Avenue, Wujin Subdistrict, Xinjin District, Chengdu City", "feature": "\u2b50 4.1 stars | Must-Buy List: Deng\u0027s kitchen knives, Xinjin Huanglading fish specialty seasoning packs, Shuxiang numbing-spicy hotpot base. Located in the Xinjin town area adjacent to Huanglongxi, this is a representative local comprehensive department store in southwestern Sichuan. Its offerings cover local kitchenware, specialty foods, and Western Sichuan folk lifestyle goods. The traditional handmade kitchen knives and various Sichuan cuisine seasonings sold here are highly acclaimed by foodies, making it a popular landmark for discovering local food culture and purchasing traditional household items.", "name": "Xinjin Bailun Department Store", "transport": "Take Chengdu Metro Line 10 to Wujin Station and walk for about 10 minutes."}, {"address": "Gufo Village Intersection, Huanglongxi Ancient Town, Shuangliu District, Chengdu City", "feature": "\u2b50 4.5 stars | Must-Buy List: Zhu Ye Qing premium green tea, Mengding Ganlu tea bags, unglazed ceramic teaware sets. Deeply rooted in the ancient town\u0027s long tea house tradition, this comprehensive tea cultural shopping center gathers famous Sichuan teas and exquisite teaware. It brings together fine tea directly sourced from top tea plantations across Sichuan, complete with live brewing and tasting served by professional tea masters. Beyond premium teas, it sells rustic handmade ceramic teaware and tea ceremony accessories, making it an immersive shopping destination tea lovers shouldn\u0027t miss.", "name": "Huanglongxi Tea Cultural Shopping Center", "transport": "Take the Huanglongxi Scenic Area Shuttle Bus to Gufocun Station, then walk about 3 minutes."}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Huanglongxi and Surrounding Ancient Towns"}, "jiuyanqiao_dongjiao": {"categories": {"cat_1": {"items": [{"address": "Inside Eastern Suburb Memory, No. 18 Jianshe South Roa n using essential oils extracted from native Chinese plants, infusing Oriental literary aesthetics into moisturizing skin care and personal scents. Filled with warm woody aromas, it is the top choice for unique, high-quality souvenirs.", "name": "To Summer Fragrance Space (Eastern Suburb Memory Pop-Up Store)", "transport": "Take Metro Line 8 to Eastern Suburb Memory Station, then walk for about 6 minutes."}, {"address": "Eastern Suburb Memory Cultural and Creative Park, Jianshe South Road, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Carved Lipstick, Peach Blossom Pressed Powder, Silk Loose Powder. A famous C-beauty brand inspired by the philosophy of \u0027Oriental makeup nourished by flowers.\u0027 The store design fuses classical Chinese garden aesthetics with modern fashion. Its exquisitely carved makeup products look like artworks and are immensely popular among tourists and local women alike. Staff also offer traditional Hanfu-style makeup trials infused with Chengdu flavor.", "name": "Florasis Experience Space (Eastern Suburb Memory Store)", "transport": "Take Metro Line 8 to Eastern Suburb Memory Station (Exit F), then walk directly to the store."}, {"address": "Near Yishun Street, Jiuyan Bridge, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Chuanxiong \u0026 Angelica Repair Cream, Saffron Brightening Essence, Centella Soothing Spray. Darentang is a famous century-old Traditional Chinese Medicine (TCM) pharmacy in Sichuan. Its branch in the historic Jiuyan Bridge district features a dedicated \u0027Herbal Cosmeceuticals Area.\u0027 By blending precious local Sichuan herbs with modern skincare technology, they craft herbal products tailored for sensitive skin and brightening, offering a truly authentic local TCM beauty experience.", "name": "Darentang Cosmeceuticals Department (Jiuyan Bridge Store)", "transport": "Take Metro Line 2 to Niuwangmiao Station, then walk about 10 minutes to Jiuyan Bridge."}, {"address": "Near the intersection of Wangjiang Road and Jiuyan Bridge, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Natural Pearl Whitening Ointment, Qibaisan Herbal Mask Powder, Hanfang Lip Balm. Located near Jiuyan Bridge and the Wangjiang Campus of Sichuan University, this Tongrentang branch is renowned for its rigorous TCM wellness and traditional beauty remedies. The Chinese herbal cosmetics here are made purely from ground natural herbs without chemical additives, highly recommended by local students and residents as an insider\u0027s pick for authentic skincare.", "name": "Chengdu Tongrentang (Wangjiang Sichuan University Store)", "transport": "Take Bus 19 or 34 to Jiuyan Bridge South Station, then walk for about 3 minutes."}, {"address": "1st Floor, Chengdu 339 Shopping Center, No. 94 Mengzhuiwan Street, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.2 Stars | Must-Buy List: C-Beauty 9-Color Eyeshadow Palette, Matte Lip Mud, Colored Beauty Sponge Set. Located inside the 339 Shopping Center near the TV Tower, this store features a visually striking wall made entirely of colorful beauty sponges. Bringing together hundreds of affordable yet high-quality Chinese cosmetics brands and K-beauty items, it offers extensive testers. It is a favorite shopping haven for young women stocking up on makeup before enjoying the nearby nightlife.", "name": "THE COLORIST (Chengdu 339 TV Tower Store)", "transport": "Take Metro Line 3 to near Hongxing Road Section 2, then transfer to Bus 333 to Mengzhuiwan Street Station."}, {"address": "Central Avenue, Eastern Suburb Memory Park, Jianshe South Road, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Iron Wand Mascara, Highlight \u0026 Contour Palette, Single Sweet Blush. A domestic C-beauty brand wildly popular among Gen Z and students, this concept store u0027-branded stylish baseball caps, original tailored designer dresses, and geometric leather handbags. SUEVENIR elevates urban souvenirs into high-fashion design, seamlessly incorporating text like \u0027Chengdu\u0027 and local cultural symbols into minimalist, chic clothing, footwear, and bags. Perfect for travelers seeking authentic Chengdu-inspired wearable souvenirs that are sophisticated rather than clich\u00e9.", "name": "SUEVENIR (\u6771\u90ca\u8a18\u61b6\u8a2d\u8a08\u5e2b\u54c1\u724c\u5e97) (SUEVENIR Studio Chengdu)", "transport": "Take Metro Line 8 to Dongjiao Memory Station, then walk for about 5 minutes."}, {"address": "Inside Eastern Suburb Memory Park, Chenghua District, Chengdu", "feature": "\u2b50 4.5 stars | Must-buy list: Outdoor utility multi-pocket vests, waterproof functional mini crossbody bags, and street-style graphic long-sleeve tees. MYGE is an independent designer brand focused on techwear and utility streetwear, featuring store interiors packed with sleek metallic textures. Using windproof and breathable high-tech fabrics combined with multi-pocket designs and 3D tailoring, their bags and footwear emphasize both durability and aesthetics, making it a hit among Chengdu\u0027s outdoor fashion enthusiasts.", "name": "MYGE (\u6771\u90ca\u8a18\u61b6\u6982\u5ff5\u5e97) (MYGE Concept Store)", "transport": "Take Metro Line 8 to Dongjiao Memory Station, then walk for about 6 minutes."}, {"address": "Wangping Riverside Road area near 339 TV Tower, Chenghua District, Chengdu", "feature": "\u2b50 4.4 stars | Must-buy list: Heavy embroidered vintage jackets, genuine leather retro combat boots, and ethnic-style woven crossbody bags. Tucked away in the Wangping Riverside commercial district between Jiuyan Bridge and the 339 TV Tower, this shop specializes in a unique blend of Bohemian and American wilderness styles. Featuring a curated selection of vintage leather jackets, retro boots, and artisanal leather bags, every item tells a story, making it a treasure trove for hipster vibes and vintage lovers.", "name": "\u8352\u91ce\u96c6\u53e4\u7740\u8207\u9078\u54c1\u5e97 (Wildness Vintage \u0026 Select Shop)", "transport": "Take Metro Line 4 to Second People\u0027s Hospital Station, then walk for about 10 minutes."}, {"address": "No. 94 Mengzhuiwan Street (Inside 339 TV Tower Commercial Zone), Chenghua District, Chengdu", "feature": "\u2b50 4.3 stars | Must-buy list: Independent designer deconstructed shirts, minimalist niche metal-buckle shoulder bags, and original chunky sneakers. Located near the Sichuan TV Tower 339 commercial district, this trendy boutique specializes in bringing together niche independent designer apparel, shoes, and accessories from home and abroad. Embracing an avant-garde and minimalist deconstructivist style, its premium items are rare and distinctive\u2014a massive favorite among the young nightlife crowd visiting the neighboring bar street.", "name": "UNPREDICTABLE (339\u6f6e\u724c\u8cb7\u624b\u5e97) (UNPREDICTABLE Select Shop)", "transport": "Take Metro Line 4 or 6 to Yushuang Road Station, then walk for about 8 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "No. 15 Central Avenue, Dongjiao Memory, No. 99 Jianshe South Road, Chenghua District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade panda nougat, Shu brocade pattern silk scarves, vacuum-packed cold doused rabbit. Located inside the Dongjiao Memory Park, this shop fuses traditional Chengdu Shu brocade elements with modern designs, making it a favorite among young adults and tourists. Featuring exquisitely packaged specialties rich in local charm, it\u0027s the best independent shop for picking up refined souvenirs.", "name": "Shuhui Cultural \u0026 Specialty Souvenir Shop", "transport": "Take Metro Line 8 to Dongjiao Memory Station (Exit F), then walk for about 5 minutes."}, {"address": "Inside Dongjiao Memory Park, No. 99 Jianshe South Road, Chenghua Distric
