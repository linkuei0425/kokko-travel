 by youth and tourists. The store offers a full range of trial makeup services and on-site guidance. High cost-performance and trendy shades make it a great choice for gifts or personal use.", "name": "Perfect Diary (Wuhou Life Plaza Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station Exit D, and walk along Wuhouci Street for about 5 minutes."}, {"address": "North Gate Cultural \u0026 Creative Zone, Du Fu Thatched Cottage, No. 37 Qinghua Road, Qingyang District, Chengdu City", "feature": "\u2b50 4.4 stars | Must-buy list: Herbal Body Balm, Honeysuckle Soothing Spray, Traditional Herbal Repair Handmade Soap. A unique beauty shop themed around the botanical heritage of Du Fu Thatched Cottage, focusing on natural additive-free herbal skincare. The store ambiance is fresh, with packaging adorned with classical poetry motifs, combining practical utility with rich cultural character.", "name": "Astragalus Herbal Beauty (Du Fu Thatched Cottage Cultural Store)", "transport": "Take Metro Line 4 to Caotang North Road Station Exit B, and walk for about 10 minutes."}, {"address": "No. 12 Qinghua Road, Qingyang District, Chengdu City (East side of Du Fu Thatched Cottage Scenic Area)", "feature": "\u2b50 4.6 stars | Must-buy list: Ganoderma Radiance Face Cream, Herbal Acne Gel, Ginseng Nourishing Mask. Integrating ancient herbal remedies from a century-old traditional Chinese pharmacy into modern skincare. Located in the cultural district around Du Fu Thatched Cottage, it provides gentle and nourishing domestic herbal cosmetic products, making it a favorite for health-conscious shoppers seeking natural care.", "name": "Tong Ren Tang Herbal Skincare (Qinghua Road Branch)", "transport": "Take Metro Line 4 to Caotang North Road Station, transfer to Bus 58, and get off at Caotang North Road South Station."}], "name": "Local Representative Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 25 Huanhua North Road, Qingyang District, Chengdu (Near Du Fu Thatched Cottage and Huanhuaxi Park)", "feature": "\u2b50 4.8 stars | Must-Buy List: Shu brocade pure silk long scarves, handmade double-sided Shu embroidered bags, and elegant Shu brocade Qipao accessories. Located inside the Shu Brocade and Embroidery Museum near Du Fu Thatched Cottage, this is Chengdu\u0027s most iconic exhibition and retail space for national intangible cultural heritage craftsmanship. The apparel, shoes, and bags here seamlessly blend thousand-year-old Shu brocade techniques with modern fashion. Featuring gorgeous fabric sheen and exquisite texture, it is a premier local luxury shopping destination steeped in rich cultural heritage.", "name": "Chengdu Shu Brocade and Embroidery Museum Shop", "transport": "Take Metro Line 5 to Qingyang Taoist Temple Station (Exit C) and walk for about 10 minutes."}, {"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Embroidered horse-face skirts (Mamianqun), Hanfu-style embroidered handbags, and cross-collar Ruqun sets. Founded in Chengdu, \u0027Chonghui Hantang\u0027 is a pioneering brand in China\u0027s Hanfu revival movement. Situated in the picturesque, ancient Jinli Street, the flagship store offers a vast array of traditional and modern modified Hanfu featuring tailored fits and intricate embroidery. Dressing in Hanfu to explore the historic street and taking home high-quality horse-face skirts and accessories makes for a dream souvenir from Chengdu.", "name": "Chonghui Hantang Hanfu Flagship Store", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station (Exit D) and walk for about 12 minutes."}, {"address": "No. 48, Middle Section of Jinli Ancient Street, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Shu embroidered women\u0027s cloth shoes, classic multi-layered sole flats, and children\u0027s tiger-head shoes. A traditional shoe shop deeply rooted in Chengdu for years, sticking to multi-layered pure cotton fabrics and hand-stitched sole craft. The shoes are breathable, comfortable, and infused with rich Ba-Shu folk style, featuring vivid and delicate embroidery. Local Chengdu residents and many tourists visit specifically to pick up lightweight, comfortable handmade cloth shoes as thoughtful gifts.", "name": "Bubugao Handmade Cloth Shoes Jinli Store", "transport": "Take Bus 57 or 82 to Wuhouci Station, then walk into Jinli Ancient Street."}, {"address": "No. 37 Qinghua Road, Qingyang District, Chengdu (Near the North Gate of Du Fu Thatched Cottage)", "feature": "\u2b50 4.6 stars | Must-Buy List: Song-style cotton-linen sun protection blouses, plant-dyed handmade long skirts, and bamboo-texture handbags. Located right next to the Du Fu Thatched Cottage Cultural and Creative Park, this independent designer boutique focuses on modern Chinese aesthetics. The shop infuses poetic artistic moods from Du Fu\u0027s poetry into the colors and cuts of the clothing, using premium linen, pure silk, and natural plant dyes to create effortless, elegant apparel with a scholarly charm\u2014perfect for lovers of Oriental Zen fashion.", "name": "Caotang Ji Oriental Aesthetic Boutique", "transport": "Take Metro Line 4 to Caotang North Road Station (Exit B) and walk for about 8 minutes."}, {"address": "No. 180 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Porcelain-body bamboo weaving leather tote bags, Shu embroidery floral leather coin purses, and bamboo-handle shoulder bags. Hidden near the Wuhou Shrine commercial area, this workshop exclusively combines traditional Sichuan \u0027bamboo weaving craft\u0027 with \u0027high-end leather.\u0027 Every bag is handcrafted by local master artisans, offering a unique texture that stands out, packed with local cultural creativity and high artistic value.", "name": "Shuyun Zhufeng Handmade Leather \u0026 Bamboo Bag Workshop", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then transfer to Bus 82 and get off at Wuhouci Station."}, {"address": "No. 88 Caotang East Road, Qingyang District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Gambiered Guangdong silk loose coats, handmade frog-button hair accessory pouches, and casual cotton-linen wide-leg pants. Situated along the banks of Huanhua Stream, this local apparel studio specializes in daily tea attire and modern Chinese clothing. Carefully selecting high-end fabrics like Xiangyun silk (gambiered silk) and heavy silk, the garments offer flowing, comfortable cuts that are highly favored by local hipsters and tea ceremony enthusiasts for their airy grace and premium texture.", "name": "Xiangmo Wanwan Chinese Tea Attire Studio", "transport": "Take Metro Line 5 to Qingyang Taoist Temple Station and walk for about 12 minutes."}, {"address": "No. 12 Tiyu Road, Wuhou District, Chengdu (Near Wuhou Shrine Commercial Area)", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage hand-stitched loafers, Shu embroidery mules, and handcrafted vegetable-tanned leather duffel bags. An independent brand founded by a veteran local Sichuan cobbler, emphasizing completely hand-burnished craftsmanship and top-grain cowhide leather. The studio\u0027s signature footwear subtly incorporates Shu embroidery lines on the upper or heel details, maintaining a modern, refined leather shoe silhouette while exuding delicate Oriental elegance and exceptional comfort.", "name": "A Zu Handcrafted Leather Shoes Studio", "transport": "Take Metro Line 3 to Yiguanmiao Station (Exit A) and walk for about 10 minutes."}, {"address": "No. 16 Gaoshengqiao Road, Wuhou District, Chengdu", "feature": "\u2b50 4.3 stars | Must-Buy List: Asymmetric cut designer jackets, minimalist geometric calfskin square bags, and Sichuan-style graphic tees. Located at the intersection of Gaoshengqiao and Wuhou Shrine, this modern independent multi-brand boutique gathers works from emerging local Chengdu fashion designers. The apparel here is avant-garde, sleek, and focused on clean tailored cuts, skillfully blending modern street culture with the relaxed vibe of Chengdu\u0027s slow-paced lifestyle. It is a favorite hidden gem for local trendy youth and tourists seeking unique fashion pieces.", "name": "Geometric Reconstruction Designer Boutique", "transport": "Take Metro Line 3 or Line 5 to Gaoshengqiao Station (Exit A) and walk for about 3 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Dry spicy beef jerky, five-spice beef bites, Three Kingdoms-themed Zhangfei Beef gift box. Located near the entrance of Jinli Ancient Street, staff often dress in Three Kingdoms Zhangfei costumes and traditional facial mask makeup to welcome guests, adding rich local flair. The beef jerky is marinated with traditional Sichuan spices, offering a firm, savory, and spicy flavor. It is a top traditional souvenir choice for tourists visiting the Wuhou Shrine and Jinli commercial area.", "name": "Zhangfei Beef (Jinli Branch)", "transport": "Take Metro Line 3 or 5 to Gaoshengqiao Station (Exit D), then walk about 10 minutes to Jinli Ancient Street."}, {"address": "Near No. 180 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Signature walnut pastries (Taosu), salt and pepper pastries, egg yolk crisp. A famous time-honored traditional bakery beloved by Chengdu locals, usually with long queues outside. The signature walnut pastry is incredibly crispy, rich, and perfectly sweet without being greasy. Adhering to traditional craftsmanship and affordable prices, wrapped in retro paper packaging, it is a delightful treat packed with old Chengdu memories.", "name": "Gongting Taosu (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station, then walk along Wuhouci Street for about 12 minutes after exiting."}, {"address": "Middle Section of Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade Shu embroidery silk scarves, double-sided embroidery panda ornaments, Shu embroidery sachets. Shu brocade and embroidery are national intangible cultural heritage items. This local independent cultural creative shop blends traditional embroidery techniques with modern aesthetics, offering high-quality handmade embroidery and exquisite lifestyle accessories\u2014an ideal gift rich in Sichuan cultural heritage and collectible value.", "name": "Shu Brocade \u0026 Embroidery Cultural Store (Jinli Branch)", "transport": "Take Bus 57, 82, or 334 to Wuhouci Station, then walk into Jinli Ancient Street."}, {"address": "Extension Section of Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.3 stars | Must-Buy List: Qionglai dark tea, Zhuyeqing green tea gift set, jasmine tea. Sichuan is one of the birthplaces of Chinese tea culture. Named after the romantic story of Zhu Wenjun and Sima Xiangru, Wenjun Tea Store specializes in authentic local Sichuan teas. The shop features antique decor and elegant packaging, making it a sophisticated tea gift choice for elders or friends.", "name": "Wenjun Tea (Jinli Store)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 10 minutes into Jinli Ancient Street."}, {"address": "Inside Du Fu Thatched Cottage Scenic Area, No. 37 Qinghua Road, Qingyang District, Chengdu", "feature": "\u2b50 4.7 stars | Must-Buy List: Du Fu poetry-themed tea sets, panda poet metal bookmarks, Cottage-exclusive Shu embroidery sachets. An exclusive cultural shop inside the Du Fu Thatched Cottage scenic area that fuses Tang poetry charm with modern stationery and snacks. Featuring poetic and refined product designs, these high-quality cultural gifts are cottage exclusives you won\u0027t find anywhere else.", "name": "Du Fu Thatched Cottage Cultural \u0026 Creative Store", "transport": "Take Metro Line 4 to Caotang North Road Station (Exit B), then walk about 800 meters."}, {"address": "No. 262 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.5 stars | Must-Buy List: Huangcheng Laoma clear oil hotpot base, spicy stir-fry base, Sichuan sausage gift box. A specialty souvenir shop opened by the famous time-honored Chengdu hotpot brand \u0027Huangcheng Laoma\u0027, allowing you to bring authentic Chengdu spicy hotpot bases home. Beautifully packaged, sealed, and hygienic, it\u0027s an unmissable souvenir for authentic Sichuan flavor lovers.", "name": "Huangcheng Laoma Hotpot Base Store (Wuhou Branch)", "transport": "Take Metro Line 3 to Gaoshengqiao Station (Exit D), then walk about 5 minutes along Wuhouci Street."}, {"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu", "feature": "\u2b50 4.2 stars | Must-Buy List: Blue-and-white porcelain bottled traditional yogurt, spicy Sichuan beef jerky, Sichuan specialty strange-flavor beans. A local souvenir shop full of Chengdu retro nostalgia. Its signature blue-and-white porcelain bottled old-style yogurt is rich, sweet, and tangy, and the ceramic bottle can be kept as a keepsake. The store also features a wide variety of traditional old-school Sichuan snacks.", "name": "Chengdu Memory Yogurt \u0026 Snacks (Jinli Store)", "transport": "Take Bus 82 or 335 to Wuhouci Station, then walk into Jinli Pedestrian Street."}, {"address": "No. 10 Qinghua Road, Qingyang District, Chengdu (Near Du Fu Thatched Cottage)", "feature": "\u2b50 4.4 stars | Must-Buy List: Chen Mapo Tofu secret recipe seasoning packet, Sichuan beef black bean sauce, spicy tofu curd gift box. A China Time-Honored Brand founded in the Qing Dynasty, this shop converts the iconic Sichuan dish \u0027Mapo Tofu\u0027 into convenient seasoning packets and ready-to-eat snacks, allowing visitors to easily recreate authentic spicy Sichuan flavors at home.", "name": "Chen Mapo Tofu Souvenir Shop (Du Fu Cottage Branch)", "transport": "Take Metro Line 4 to Caotang North Road Station, then walk about 10 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 99, Middle Section of Shuangnan Avenue, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted off-season Nike sneakers, Coach classic signature tote bags, Max Mara cashmere coats. Located in Shuangliu District and very close to the Wuhou Business District, Times Outlet is Chengdu\u0027s most popular discount shopping paradise, bringing together over 200 well-known international and domestic brands offering year-round discounts as low as 10% off. The open European-style architecture makes browsing exceptionally comfortable and spacious. Locals and tourists alike love to hunt for bargains here, especially sportswear and affordable luxury bags, which frequently come with extra bundle savings\u2014making it well worth a dedicated half-day visit.", "name": "Times Outlet Chengdu", "transport": "Take Metro Line 3 to \u0027Shuangliu Square Station\u0027, then transfer to a bus or taxi for about 10 minutes to arrive."}, {"address": "No. 19, West 2nd Section of 2nd Ring Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Premium Sichuan handmade silk scarves, top-tier skincare gift sets, Chengdu-exclusive panda-themed fragrances. Adjacent to Du Fu Thatched Cottage and Huanhuaxi Park, Renhe Spring Department Store (Guanghua Store) is an iconic luxury department store in western Chengdu. The interior is elegantly decorated, bringing together international top-tier cosmetics, high-end fashion, and exquisite dining. Beyond global luxury brands, it features dedicated counters showcasing Sichuan specialties and Chengdu\u0027s local fine craft gifts. Offering excellent service in a serene shopping atmosphere, it is highly favored by quality-conscious locals and discerning travelers.", "name": "Renhe Spring Department Store - Guanghua", "transport": "Take Metro Line 4 to \u0027Caotang North Road Station\u0027 and walk for about 10 minutes."}, {"address": "Inside Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Double-sided panda embroidered standing mirrors, handmade paper-cut art albums, Intangible Cultural Heritage Shu embroidery peony silk scarves. Located inside Jinli Ancient Street, this local craft shop is guided by Chengdu\u0027s Intangible Cultural Heritage master artisans, specializing in authentic Shu embroidery and traditional paper-cutting art. All embroidered pieces are hand-stitched by local embroiderers, capturing realistic panda fur details with incredible precision. Providing exquisite packaging and anti-moisture certificates, it is the best independent shop in Jinli to pick up high-end souvenirs rich in Chengdu culture.", "name": "Jinli Sanhua Cut-Paper \u0026 Shu Embroidery Shop", "transport": "Take Metro Line 3 or 5 to \u0027Gaoshengqiao Station\u0027 (Exit D), then walk for about 10 minutes."}, {"address": "Inside Du Fu Thatched Cottage Scenic Area, No. 37 Qinghua Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Du Fu poetry-themed metal bookmark gift sets, thatched cottage bamboo-woven umbrellas, cottage-shaped panda Four Treasures of the Study. Nestled inside the Du Fu Thatched Cottage scenic area, this store is one of the most artistic and culturally distinct independent shops in Chengdu. It masterfully combines Tang Dynasty poetry with modern design to create beautiful yet functional lifestyle goods. The store atmosphere is steeped in ancient charm, filled with bamboo and wood accents. Visitors can acquire exclusive, exquisite cultural products here and even experience the fun of traditional poetry rubbing prints.", "name": "Du Fu Thatched Cottage Cultural \u0026 Creative Store", "transport": "Take Metro Line 4 to \u0027Caotang North Road Station\u0027 or Line 5 to \u0027Qingyang Palace Station\u0027, then walk for about 12 minutes."}, {"address": "Entrance of No. 231 Wuhouci Street, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Zhuge Liang feather fan decorative ornaments, Three Kingdoms Chibi-style hero figure gift boxes, Sichuan Opera face-changing metal bookmarks. Located right at the entrance of Wuhou Shrine, this themed boutique is Chengdu\u0027s most famous cultural flagship store dedicated to Three Kingdoms lore. Developed entirely by local Chengdu design teams, the products blend traditional historical figures with modern trends to create wildly popular souvenirs. Transforming the deep history of Shu Han culture into fun, stylish daily goods, this is a must-visit shop after exploring Wuhou Shrine.", "name": "Wuhou Shrine Three Kingdoms Cultural Store", "transport": "Take Metro Line 3 or Line 5 to \u0027Gaoshengqiao Station\u0027, then walk for about 10 minutes."}, {"address": "No. 518 Dayue Road, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Local independent designer streetwear tees, panda-shaped cookie gift boxes, Sichuan bamboo-woven fashion handbags. Joy City Chengdu is a landmark park-style shopping complex in Wuhou District, blending landscape elements inspired by Sichuan\u0027s Huanglong into its architecture, complete with a massive rooftop garden and plaza. Beyond hosting international brands, its standout feature is its collection of local Chengdu independent designer clothing labels, lifestyle shops, and trendy Sichuan cultural stores. Extremely popular among local youth, it offers an exceptionally rich shopping, dining, and entertainment experience.", "name": "Joy City Chengdu", "transport": "Take Metro Line 7 to \u0027Shenxianshu Station\u0027 or Line 3 to \u0027Taipingyuan Station\u0027, then transfer to a bus or taxi for about 8 minutes."}, {"address": "Middle Section of Jinli Ancient Street, No. 231 Wuhouci Street, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Qingshen fine bamboo-over-porcelain tea sets, Chengdu carved lacquerware bangles, panda pattern bamboo placemats. Situated at the heart of Jinli Ancient Street, this boutique specializes in traditional Sichuan Intangible Cultural Heritage crafts, showcasing master craftsmanship in Chengdu lacquerware and Qingshen bamboo weaving. The porcelain-body bamboo weaving tightly weaves ultra-fine bamboo threads around porcelain, offering a warm tactile texture and great artistic value, while Chengdu lacquerware is famed for its radiant luster and detailed carvings. The owner enthusiastically explains the traditional crafting process. Compact and refined, these items make wonderful gifts for friends and family.", "name": "Jinli Bamboo Weaving \u0026 Lacquerware Boutique", "transport": "Take Metro Line 3 or 5 to \u0027Gaoshengqiao Station\u0027, then walk for about 12 minutes."}, {"address": "Beside Baihuatan Park, West 2nd Section of 1st Ring Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Handmade herbal essential oil soaps, Shu herbal cold-brew tea gift sets, Chengdu-style ceramic tea pets. Tucked away near Baihuatan Park and Du Fu Thatched Cottage, this local independent lifestyle boutique embodies Chengdu\u0027s relaxed, slow-paced lifestyle. It specializes in naturally grown Sichuan herbal teas, handcrafted ceramic tea sets, and skincare products infused with Western Sichuan botanical extracts. Cozy and elegant, the shop is decorated with greenery and floral arrangements\u2014making it a perfect spot after a park stroll to pick up high-quality, aromatic local lifestyle gifts.", "name": "Baihuatan Floral \u0026 Lifestyle Boutique", "transport": "Take Metro Line 5 to \u0027Qingyang Palace Station\u0027 (Exit C), then walk for about 5 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Wuhou Shrine, Jinli, and Du Fu Thatched Cottage"}};
        const cityName = "Chengdu";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
