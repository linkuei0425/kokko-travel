 Chengdu", "feature": "\u2b50 4.6 stars | Must-buy list: ZEESEA x British Museum Eyeshadow Palette, Meiking Hanfang Loose Powder, Cathy Doll Ultra-Fine Eyebrow Pencil. Famous for its spectacular rainbow makeup sponge wall, this open-concept store features over 100 global beauty brands, offering an immersive, pressure-free makeup testing and shopping experience.", "name": "THE COLORIST (Chunxi Store)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit E, and walk for about 3 minutes."}, {"address": "No. 55 Chunxi Road Pedestrian Street, Jinjiang District, Chengdu", "feature": "\u2b50 4.6 stars | Must-buy list: Zhikamei Anti-Aging Firming Cream, Qinyi Herbal Foot Bath Packs, Little Dome Essential Oil Toothpaste. A giant lifestyle and beauty store characterized by its vibrant yellow decor. Located in the heart of Chunxi Road, it features floor-to-ceiling walls of face masks and lipsticks, making it the go-to spot for affordable cosmetics, cosmeceuticals, and beauty tools.", "name": "KKV (Chunxi Road Flagship Store)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C, and walk for about 3 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacy Shops"}, "cat_2": {"items": [{"address": "1F, Ping An Finance Center, No. 99 Lower East Street Section, East Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-buys: Chengdu-exclusive panda-embroidered hoodie, heavy-duty American vintage cotton T-shirt, street graffiti baseball cap. Born in Chengdu, 1807 is one of the most iconic premier American street style brands in China\u0027s streetwear scene. Located near the Chunxi Road commercial area, its flagship store features a heavy industrial and American retro aesthetic. Renowned for heavyweight fabrics and authentic street cuts, the Chengdu location frequently releases limited-edition items featuring local elements like pandas and bamboo leaves, making it a must-visit pilgrimage site for trendsetters Li commercial district."}, {"address": "2F, East Lane, Sino-Ocean Taikoo Li Chengdu, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-buys: Chengdu-exclusive multi-pocket utility overalls, techwear waterproof hooded jacket, color-blocked canvas crossbody bag. ROARINGWILD is a pioneer among Chinese original streetwear brands. Its Taikoo Li concept store seamlessly fuses urban techwear aesthetics with modern architectural lines. The apparel emphasizes functional utility and oversized silhouettes, while shoes and bags offer both durability and trendy designs. Highly praised by local youth for its rugged yet detail-oriented vibe, it\u0027s the go-to shop for high-quality domestic streetwear.", "name": "ROARINGWILD Chengdu Taikoo Li", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station, Exit C, and walk about 6 minutes."}, {"address": "1F, East Lane, Sino-Ocean Taikoo Li Chengdu, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-buys: Melting Sadness collaboration cute bear bag, slogan-embroidered varsity jacket, Chengdu-exclusive panda T-shirt. RANDOMEVENT is an influential local streetwear brand. Its Chengdu flagship store features an impactful concept design playing with virtual and physical elements. The brand excels at blending vintage graffiti, vibrant street colors, and pop culture. Its clothes and accessory bags are full of humor and youthful energy, making it ideal for young shoppers who love playful outfits and Instagram-worthy fashion.", "name": "RANDOMEVENT Chengdu Store", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station, Exit C, and walk about 5 minutes."}, {"address": "No. 85 South Section, Chunxi Road Pedestrian Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-buys: SKATER 001 vintage chunky skate sneakers, platform dad shoes, heavy-cotton street graffiti tees. OLD ORDER is a wildly popular Chinese original footwear brand, and its Chunxi Road flagship store is constantly packed with young trendsetters trying on shoes. The store\u0027s signature chunky skate shoes and platform retro kicks are famous for exaggerated proportions, rich colorways, and comfortable fits\u2014instantly elevating any street style look.", "name": "OLD ORDER Chunxi Road Store", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station, Exit D, and walk about 2 minutes."}, {"address": "No. 15 Daci Temple Road (North side of Taikoo Li), Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-buys: BM classic labeled canvas tote bag, original funny illustration tee, retro nylon messenger bag. BADMARKET is an immensely popular lifestyle and streetwear select shop in Chengdu, located on the north side of Taikoo Li with a relaxed, humorous vibe. Its iconic colorful canvas bags and affordable original apparel are viral hits online. The store also carries creative novelty items and niche accessories. Its accessible price points and quirky hipster aesthetic attract countless local youth on the hunt for cool finds.", "name": "BADMARKET Taikoo Li", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station, Exit C, and walk about 7 minutes."}, {"address": "2F, West Lane, Sino-Ocean Taikoo Li Chengdu, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-buys: Avant-garde deconstructed dresses, dark aesthetic chain leather shoulder bags, limited-edition metallic buckle platform boots. ENG Concept Store is one of the most futuristic, avant-garde multi-brand boutiques in the Taikoo Li shopping district, featuring both global and domestic designer brands. The store design features metallic textures and sci-fi aesthetic elements. It brings together top emerging international and Chinese darkwear, Y2K fashion, and designer footwear/bags\u2014perfect for fashion mavens pursuing bold, highly personalized styles.", "name": "ENG Concept Store Chengdu", "transport": "Take Metro Line 2 or Line 3 to Chunxi Road Station, Exit C, and walk about 5 minutes."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 86 Wenwu Road, Jinjiang District, Chengdu, Sichuan Province (near Chunxi Road Commercial Area)", "feature": "\u2b50 4.6 stars | Must-Buy List: Original Salt \u0026 Pepper Walnut Pastry, Egg Yolk Pastry, Napoleon Cake. This is the most legendary traditional pastry brand in the Chunxi Road commercial area, with long queues of locals and tourists every day. Baked according to ancient methods, their walnut pastries are crispy, rich, and lingeringly fragrant. With very affordable prices, they make the perfect souvenir packed with authentic old Chengdu flavor.", "name": "Gong Ting Tao Su (Palace Walnut Pastry)", "transport": "Take Metro Line 1 or 4 to Luomashi Station, and walk for about 5 minutes from the exit."}, {"address": "No. 96 Shuqian Street, Jinjiang District, Chengdu, Sichuan Province (Chunxi Road Commercial Area)", "feature": "\u2b50 4.7 stars | Must-Buy List: Limited-edition Panda Postcards, Panda Plush Toys, Shu Embroidery Panda Bookmarks. A panda-themed creative flagship store near Chunxi Road, featuring the world\u0027s only dedicated panda postal code, \u0027610088\u0027. Packed with giant panda-designed souvenirs, you can also stamp a unique souvenir panda postmark here to mail adorable blessings straight from Chengdu.", "name": "Panda Post (Chunxi Road Store)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit E1, then walk for about 8 minutes."}, {"address": "No. 29 Chunxi Road Pedestrian Street, Jinjiang District, Chengdu, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Vacuum-packed Zhangfei Beef, Sichuan Camphor-Tea Smoked Duck, Vacuum-packed Spicy Rabbit Head. A flagship chain store specializing in classic specialties from across Sichuan, gathering Chengdu\u0027s most iconic spicy snacks. The Zhangfei Beef is particularly famous\u2014dark on the outside, tender red inside, firm, and thoroughly flavorful. Vacuum-packed tea-smoked duck and spicy rabbit head are absolute must-haves for foodies.", "name": "Shu Cui Fang Local Specialties (Chunxi Road)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C, which opens directly onto Chunxi Road Pedestrian Street."}, {"address": "B1 Floor, Sino-Ocean Taikoo Li, No. 8 Middle Shamao Street, Jinjiang District, Chengdu, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Zhu Ye Qing \u0027Lun Dao\u0027 Green Tea, Bi Tan Piao Xue Jasmine Tea, Emei Xue Ya. A representative brand of high-end famous Sichuan teas, featuring a flagship store in Taikoo Li designed with modern Oriental aesthetics. Zhu Ye Qing grows in Mount Emei\u0027s high-altitude tea regions; its leaves are flat and upright like bamboo leaves, yielding a bright, tender green liquor. Bi Tan Piao Xue fuses high-mountain green tea with fresh jasmine blossoms, creating an elegant gift imbued with floral and tea aromas.", "name": "Zhu Ye Qing Tea (Sino-Ocean Taikoo Li Store)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, which directly connects to Taikoo Li B1 Floor."}, {"address": "No. 36 Xiadongdajie Section, East Street, Jinjiang District, Chengdu, Sichuan Province (near Taikoo Li)", "feature": "\u2b50 4.4 stars | Must-Buy List: Vacuum-packed Spicy Rabbit Head, Five-Spice Rabbit Head, Cold Diced Rabbit Meat. One of Chengdu\u0027s most iconic authentic snack brands\u2014they say you haven\u0027t truly visited Chengdu without trying rabbit head! Beside freshly prepared hot items, they offer beautifully packaged vacuum gift boxes. The spicy flavor is fiery, savory, perfectly numbing, and easy to eat, making it a head-turning snack gift for social gatherings.", "name": "Shuangliu Laoma Rabbit Head (Chunxi Branch)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit B, and walk for about 6 minutes."}, {"address": "No. 79 Daci Temple Road, Jinjiang District, Chengdu, Sichuan Province (Northeast side of Taikoo Li)", "feature": "\u2b50 4.6 stars | Must-Buy List: Chen Mapo Tofu Seasoning Packets, Boiled Beef Seasoning, Authentic Pixian Broad Bean Paste. Chen Mapo Tofu is the pioneer brand of Sichuan cuisine. Its official seasoning packs perfectly recreate the classic seven flavors of the old brand: numbing, spicy, fresh, fragrant, hot, vibrant, and tender. Allowing you to recreate authentic Sichuan Mapo Tofu effortlessly at home, it\u0027s a must-buy souvenir for cooking enthusiasts and Sichuan food lovers.", "name": "Chen Mapo Tofu Seasoning Shop (Chunxi Branch)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station or Line 2 to Dongmen Bridge Station, then walk for about 7 minutes."}, {"address": "M068-M070, Sino-Ocean Taikoo Li, No. 8 Middle Shamao Street, Jinjiang District, Chengdu, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Old Chengdu Covered Bowl (Gaiwan) Tea Set, Chengdu Commemorative Stamp Booklet, Panda Bamboo Weaving Crafts. Located in the basement of Taikoo Li, Fangsuo Commune is not only a breathtaking underground temple of books, but its cultural souvenirs section also combines local traditional craftsmanship with modern design. Transforming Sichuan tea culture and bamboo weaving into elegant everyday items, it offers stylish, artistic gifts for friends and family.", "name": "Fangsuo Commune Cultural Gifts (Taikoo Li)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, and access via the entrance on Taikoo Li B1 level."}, {"address": "L7, Chengdu IFS (International Finance Square), No. 1 Section 3, Hongxing Road, Jinjiang District, Chengdu, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Huangcheng Laoma Clear Oil Hot Pot Base Gift Box, Sichuan Cured Bacon, Handmade Beef Jerky. A specialty boutique carefully crafted by Huangcheng Laoma, a famous time-honored Sichuan restaurant and hot pot brand. It seals Chengdu\u0027s proudest hot pot base into premium gift boxes. Simmered with pure vegetable oil and dozens of authentic spices, it is rich yet non-greasy. Combined with exquisite packaging, it\u0027s a top choice for upscale gifts representing Chengdu\u0027s culinary perfection.", "name": "Huangcheng Laoma Sichuan Gifts (IFS Branch)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, which directly connects to IFS Mall, then take the elevator to the 7th floor."}], "name": "Must-Buy Special Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "M054, M Floor, Sino-Ocean Taikoo Li, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buys: HARMAY exclusive canvas tote bags, luxury skincare travel sample sets, niche perfume vials. Located in Chengdu Taikoo Li, this beauty concept store features an industrial warehouse aesthetic integrated with traditional Sichuan brocade loom elements. Housing over 10,000 international and domestic independent beauty and skincare products, it attracts crowds of young shoppers. Its extensive mini-sample zone is a top target for tourists looking to haul unique beauty finds.", "name": "HARMAY Chengdu Taikoo Li", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C, and walk for about 5 minutes."}, {"address": "No. 1, Section 3, Hongxing Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.9 stars | Must-Buys: Giant panda climbing wall plushies, Goyard classic monogram totes, Chengdu IFS limited-edition tea gift sets. As Chengdu\u0027s most famous landmark department store and shopping mall, the giant climbing panda sculpture on the rooftop is a must-visit photo spot. It gathers major international luxury brands and fine dining options, offering attentive service and an exceptional shopping environment. It stands as a shopping paradise showcasing Chengdu\u0027s modern fashion and utmost prosperity.", "name": "Chengdu International Finance Square (IFS)", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C connects directly to the IFS basement level."}, {"address": "M068, M Floor, Sino-Ocean Taikoo Li, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-Buys: Sichuan embroidery-inspired notebooks, original handmade ceramic tea sets, Chengdu limited-edition woven bamboo tumblers. Located in the basement of Taikoo Li, Fangsuo feels like a subterranean archive depository, combining the concept of an underground library with modern aesthetics. Beyond books, it features local designer clothing, lifestyle goods, and art exhibitions, making it the perfect shopping destination to experience Chengdu\u0027s slow-paced, chic artistic vibe.", "name": "Fangsuo Communal Chengdu", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C, and walk for about 5 minutes into the Taikoo Li basement level."}, {"address": "No. 158 Binjiang East Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buys: Chengdu local designer tailored jackets, handmade silver rings, niche scented candles. CLAP is one of Chengdu\u0027s most iconic local boutique buyer stores, featuring an avant-garde artistic interior design. It curates high-potential independent designer brands from home and abroad. Deeply loved by local trendsetters and fashionistas, its highly unique items minimize the chance of outfit overlap, making it ideal for travelers seeking one-of-a-kind fashion pieces.", "name": "CLAP Chengdu", "transport": "Take Metro Line 3 to Xinnanmen Station and walk for about 8 minutes."}, {"address": "No. 99 Middle Section of Shuangnan Avenue, Shuangliu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buys: Discounted classic Nike sneakers, Coach signature pattern handbags, discounted Burberry trench coats. As Chengdu\u0027s most acclaimed outlet center, although located in the suburbs, it is directly accessible by metro from Chunxi Road. Designed like a charming European town, it hosts over 200 world-renowned brands offering deep year-round discounts. It\u0027s a true shopping haven for snatching up designer bargains during a visit to Chengdu.", "name": "Times Outlets Chengdu", "transport": "Take Metro Line 3 from Chunxi Road Station to Longqiaolu Station, then transfer to a short bus ride or taxi."}, {"address": "No. 9 Kejia Lane, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buys: Zhangfei Beef premium gift sets, fine Sichuan brocade silk scarves, high-end traditional skincare gift sets. As the oldest and most iconic traditional department store in the Chunxi Road commercial area, it is favored by long-time local residents and regulars. The basement supermarket and dedicated counters are well-stocked with authentic Sichuan specialties and premium products. With thoughtful service and guaranteed quality, it is an excellent destination for purchasing local regional treats and high-value goods.", "name": "Wangfujing Department Store Chunxi Road", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit D, and walk for about 3 minutes."}, {"address": "Shop 1225, 1st Floor, Sino-Ocean Taikoo Li, No. 8 Middle Shamao Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buys: Niche designer crossbody bags, playful phone lanyards, trendy printed baseball caps. LOOKNOW is a globally curated designer concept store hugely popular among Gen Z. This Taikoo Li flagship cleverly blends traditional Chengdu courtyard structures with contemporary trend art installations. Featuring a curated selection of sought-after domestic and international independent brands in versatile displays, it is a hot spot for experiencing Chengdu\u0027s cutting-edge street fashion and snagging unique accessories.", "name": "LOOKNOW Chengdu Taikoo Li Flagship Store", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit C, and walk for about 4 minutes into the Taikoo Li commercial district."}, {"address": "No. 6 Daye Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buys: Trendy oversized hoodies, limited-edition art vinyl figures, indie-style sticker packs. COSMO is a prime example of a renovated subculture trend department store popular among youth in recent years. Breaking away from traditional department store booth setups, it features numerous Chengdu street brands, avant-garde buyer shops, and subculture event spaces. Gathering the city\u0027s coolest young crowds, its style is bold and edgy, making it a must-visit shopping spot for deep-diving into local youth culture.", "name": "COSMO Chengdu", "transport": "Take Metro Line 2 or 3 to Chunxi Road Station, Exit E, and walk for about 8 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Chunxi Road, Taikoo Li and IFS"}, "dujiangyan_qingcheng": {"categories": {"cat_1": {"items": [{"address": "No. 208 Xuanhua Street, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buys: Qibai Whitening Facial Mask Powder, Ejiao Blood-Nourishing \u0026 Beauty Paste, Chuanxiong Herbal Repairing Hand Cream. As a century-old heritage brand, Tong Ren Tang\u0027s Dujiangyan branch incorporates Sichuan\u0027s rich local herbal resources. Its Traditional Chinese Medicine (TCM) cosmetics and cosmeceuticals are extremely popular among tourists\u2014especially the mask powders and herbal repair creams formulated with precious local medicinal herbs. Gentle, non-irritating, and deeply revitalizing, this is the top spot to experience herbal beauty care.", "name": "Beijing Tong Ren Tang (Dujiangyan Xuanhua Street Store)", "transport": "Take Dujiangyan City Bus Route 4 or 7, get off at \u0027Xuanhua Street Station\u0027, and walk about 100 meters."}, {"address": "No. 88 Qingcheng Mountain Road, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Must-Buys: Qingcheng Alpine Tea Polyphenol Antioxidant Mask, Qingcheng Mugwort Soothing Essential Oil, Coptis Anti-Acne Cleansing Ointment. Located at the foot of Mount Qingcheng, this local independent cosmeceutical shop combines Taoist wellness culture with Alpine botanical extracts. Their self-developed tea polyphenol and mugwort series effectively relieve travel fatigue while deeply nourishing the skin. Infused with a rich, natural herbal aroma, these make unforgettable souvenirs from Mount Qingcheng.", "name": "Qingcheng Mountain Herbal Wellness Beauty Store", "transport": "Take the Dujiangyan High-Speed Rail to Qingchengshan Station, transfer to the Qingcheng Mountain Scenic Area Shuttle Bus to \u0027Qingcheng Mountain Gate Station\u0027, and walk about 300 meters."}, {"address": "No. 45 Shuiqu Street, Guankou Sub-district, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buys: Pianzihuang Pearl Cream, Mayinglong Babao Radiant Eye Cream, Dr.Yu Skin Barrier Repairing Lotion. Taiji Group is an iconic local pharmaceutical enterprise in Sichuan, featuring a special \u0027Domestic Cosmeceuticals Section\u0027 inside its pharmacy. It imports many highly rated Chinese medical beauty brands. With professional pharmacist consultations and budget-friendly prices, it attracts locals and savvy travelers stocking up on skincare.", "name": "Taiji Pharmacy (Dujiangyan Shuiqu Outlet)", "transport": "Take Dujiangyan Bus Route 1 or 9, get off at \u0027Shuiqu Street Station\u0027, and walk about 150 meters."}, {"address": "1st Floor, RT-Mart, No. 238 Section 1 Guanjing Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Must-Buys: Pechoin Water Energy Rejuvenating Toner, Inoherb Rhodiola Brightening Essence, CHANDO Glacier Water Hydrating Mask. Located in Dujiangyan\u0027s core commercial district, this store features a dedicated \u0027Trending Chinese \u0026 Sichuan Beauty Zone\u0027 alongside international brands. It offers a wide variety of testers for domestic classic and trendy cosmetics in a bright shopping environment\u2014perfect for travelers looking for a one-stop shop for popular domestic cosmeceuticals.", "name": "Watsons (Dujiangyan RT-Mart Branch)", "transport": "Take Dujiangyan Bus Route 2 or 6 to \u0027Guanjing Road Intersection Station\u0027 for direct access."}, {"address": "No. 126 Xingfu Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buys: Yunnan Baiyao Herbal Facial Mask, Winona Soothing Repairing Cream, Jingwei Herbal Propolis Nourishing Lip Balm. As an authoritative pharmaceutical company, Sinopharm carries numerous dermatologist-approved domestic skincare brands. Its repair products, specially designed for sensitive skin and plateau climates, enjoy an excellent reputation locally. In-house pharmacists provide tailored advice based on skin type, ensuring a reassuring shopping experience.", "name": "Sinopharm Pharmacy (Dujiangyan Xingfu Road Store)", "transport": "Take Dujiangyan Bus Route 4 or 8 to \u0027Xingfu Road Intersection Station\u0027, and walk about 200 meters along Xingfu Road."}, {"address": "No. 68 Nanqiao Pedestrian Street, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buys: Chuanxiong Brightening Essence Oil, Saffron Repairing Night Cream, Ginkgo Anti-Wrinkle Eye Cream. Rooted in Sichuan\u0027s Chengdu region, this local independent boutique focuses on botanical skincare made from authentic local medicinal herbs. Product packaging artfully incorporates elements of Taoism and Shu brocade, exuding high quality and making it immensely popular among young adults who love natural ingredients and traditional aesthetic designs.", "name": "Sichuan Herbal Beauty House (Dujiangyan Branch)", "transport": "Take Dujiangyan Bus Route 1, 7, or 10 to \u0027Lidui Park Station\u0027, and walk about 500 meters to Nanqiao Pedestrian Street."}, {"address": "No. 102 Jianshe Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buys: Guangyuyuan Dingkun Dan Beauty Capsules, Traditional Gromwell Ointment, Pearl Skin-Regenerating Repair Cream. Caizhilin is a well-known time-honored pharmacy chain. Its Dujiangyan branch offers traditional beauty formulas and TCM cosmeceuticals with local regional flair. The gromwell ointment and pearl creams follow traditional recipes, proving remarkably soothing for dry skin and redness\u2014a versatile travel essential for your bag.", "name": "Caizhilin Pharmacy (Dujiangyan Jianshe Road Store)", "transport": "Take Dujiangyan Bus Route 3 or 11 to \u0027Jianshe Road Station\u0027 and you\u0027ll arrive immediately."}, {"address": "No. 312 Jiang\u0027an Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buys: Green Tea Hydrating Set, Centella Asiatica Repairing Serum, Chamomile Soothing Mist. Zhihou is a trendy botanical skincare brand wildly popular in Southwest China, featuring additive-free formulas and fresh plant extraction concepts. Located in a bustling Dujiangyan commercial district, the shop offers complimentary skin analysis and skincare trials. With wallet-friendly prices and exceptional hydrating power, its products are ideal for coping with the fickle climate of the Sichuan Basin and mountain areas.", "name": "Zhihou Botanical Beauty (Dujiangyan Exclusive Store)", "transport": "Take Dujiangyan Bus Route 5 or 12 to \u0027Jiang\u0027an Road Station\u0027 and walk about 100 meters."}], "name": "Local Representative Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 128 Xuanhua Street, Guanxian Ancient Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.8 Stars | Must-Buys: Handmade Shu embroidered silk scarves, custom modern modified cheongsams, panda-themed Hanfu accessory bags. Located inside the ancient town, this boutique is loved by local Hanfu enthusiasts and tourists alike. It beautifully blends traditional Shu embroidery craftsmanship with modern fashion design. The tailoring is remarkably refined, and the shop provides try-on services and styling advice for photo shoots\u2014making it the ultimate spot to experience local traditional textile aesthetics.", "name": "Jinxiu Shuyun Hanfu \u0026 Shu Embroidery Cheongsam Boutique", "transport": "Take Dujiangyan Bus Route 4 or 9 to Lidui Park Station, then walk about 5 minutes."}, {"address": "No. 88 Qingcheng Road, Qingchengshan Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.7 Stars | Must-Buys: Qingcheng Mountain hand-woven hemp shoes, Zen-style cotton-linen handbags, handmade woven straw sandals. Steeped in Mount Qingcheng\u0027s Taoist culture, this traditional shoe shop specializes in naturally breathable hemp and straw footwear. Local residents and hikers highly praise their lightweight, airy hemp shoes. Every item is handcrafted by veteran tailors and master weavers, exuding a rustic Taoist aesthetic of returning to nature.", "name": "Qingcheng Taoist Handmade Hemp Shoes \u0026 Weaving Workshop", "transport": "Take the Chengguan Suburban Railway to Qingchengshan Station, transfer to the Qingcheng Mountain Scenic Area Shuttle Bus to the terminus, and walk for 3 minutes."}, {"address": "No. 65 Yangliuhe Pedestrian Street, Dujiangyan City, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Hand-stitched genuine leather crossbody bags, Sichuan-style embroidered cardigans/sweaters, designer platform boots. Tucked away in an alley off the bustling Yangliuhe Pedestrian Street, this independent boutique is a favorite among local young women. It features niche designer womenswear and high-quality handmade leather bags\u2014offering unique style without the risk of outfit overlap at a fantastic price point.", "name": "Yangliuhe Alley Fashion Boutique \u0026 Leather Goods", "transport": "Take Dujiangyan Bus Route 1 to Yangliuhe Street Station and walk into the pedestrian street."}, {"address": "No. 1 Shuijie (Water Street) next to Nanqiao Bridge, Dujiangyan City, Chengdu", "feature": "\u2b50 4.9 Stars | Must-Buys: 3D panda embroidered hoodies, hand-painted panda canvas sneakers, panda-shaped leather coin purses. Located near Nanqiao Bridge, this trendy creative shop brings Chengdu\u2019s iconic giant panda motif to life. From stylish street-style panda apparel to adorable hand-painted sneakers and mini leather purses, everything is made with sturdy materials and filled with local playful charm\u2014a must-visit local boutique in Dujiangyan.", "name": "Dujiangyan Panda Creative Apparel \u0026 Accessories", "transport": "Take Bus Route 7 or 19 to Nanqiao Station, then walk about 1 minute."}, {"address": "No. 42 Xijie (West Street), Guanxian Ancient Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Handmade Qiang embroidered vests, ethnic geometric tote bags, traditional embroidered cloth shoes. As a gateway to Western Sichuan, Dujiangyan gathers rich Qiang ethnic culture. Specializing in traditional Qiang embroidery, this boutique blends vibrant ethnic colors into modern apparel and casual bags. Each piece features striking color contrasts and symbolic blessings, making them wonderful for both daily wear and collection.", "name": "Aqiang Embroidery \u0026 Ethnic Fashion Boutique", "transport": "Take Bus Route 4 to Xijiekou Station, then walk about 200 meters into West Street."}, {"address": "No. 15 Houshan Street, Qingchengshan Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.7 Stars | Must-Buys: Elegant Zen-style cotton-linen dresses, botanical indigo-dyed handmade totes, hand-woven wool shawls and scarves. Nestled at the foot of Mount Qingcheng, this tasteful lifestyle boutique uses natural cotton, linen, and botanical dye techniques for all its apparel. The loose, comfortable cuts exude subtle Oriental charm. Locals come here for high-quality loungewear, while tourists fall in love with the indigo-dyed bags.", "name": "Qingcheng Mountain Cotton Linen Lifestyle Apparel Boutique", "transport": "Take the shuttle minibus from Qingchengshan Railway Station heading to Mount Qingcheng Back Mountain Scenic Area, get off at Qingcheng Houshan Ancient Town, and walk a short distance."}, {"address": "No. 158 Xingfu Road, Dujiangyan City, Chengdu", "feature": "\u2b50 4.5 Stars | Must-Buys: Qingcheng Mountain bamboo-woven wooden clogs, breathable handmade woven straw slippers, vintage canvas backpacks. Passed down through two generations, this artisanal workshop produces traditional wooden clogs and durable canvas shoes suited for mountain and waterland terrain. The owner insists on using premium local bamboo, wood, and pure cotton canvas, providing exceptional comfort. It\u0027s a classic local store imbued with Dujiangyan\u0027s unique water-town heritage.", "name": "Shuicheng Wooden Clogs \u0026 Handmade Shoes Store", "transport": "Take Bus Route 2 or 8 to Xingfu Lukou Station, then walk about 3 minutes."}, {"address": "No. 202 Kuiguang Road, Dujiangyan City, Chengdu", "feature": "\u2b50 4.8 Stars | Must-Buys: Local designer genuine leather ankle boots, minimalist vegetable-tanned leather totes, hand-painted Shu Mountain canvas sneakers. Founded by a young local designer in Dujiangyan, this multi-brand footwear and bag shop focuses on minimalism and high-spec vegetable-tanned leather goods. Details subtly incorporate lines inspired by the Dujiangyan Irrigation System and Mount Qingcheng\u0027s landscape. Unique and durable, it\u0027s a favorite among creatives and professionals.", "name": "Guyan Impression Designer Shoes \u0026 Bags Store", "transport": "Take Bus Route 6 to Kuiguangta Park Station, then walk about 4 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "No. 42 Qingcheng Mountain Road, Qingcheng Mountain Town, Dujiangyan City, Chengdu (At the foot of Mount Qingcheng Front Mountain Scenic Area)", "feature": "\u2b50 4.7 Stars | Must-Buy List: Qingcheng Mountain Secret Cured Bacon, Cured Pork Sausage, Air-Dried Marinated Ribs. This is the most iconic time-honored cured meat shop in Qingcheng Mountain. Using traditional Taoist smoking techniques and secret spice marinades, the meat is firm with a subtle aroma of cypress branch wood. Rich yet non-greasy, it is a top-tier local specialty that almost every visitor buys to bring home for friends and family.", "name": "Qingcheng Mountain Traditional Cured Meat Shop", "transport": "Take Dujiangyan City Bus 101 to \u0027Qingcheng Mountain Scenic Area Station\u0027, then walk about 3 minutes."}, {"address": "No. 18 Xingfu Road, next to Xuanhua Gate, Guanxian Ancient Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buy List: Additive-Free Dried Red Kiwifruit, Low-Alcohol Kiwifruit Wine, Handmade Kiwifruit Jam. Dujiangyan is one of China\u0027s famous origins for kiwifruit. This shop specializes in snacks made from locally grown red kiwifruit. The dried fruit retains a natural sweet-and-sour taste, while the fruit wine offers a refreshing flavor\u2014making it a perfect agricultural souvenir.", "name": "Dujiangyan Red Kiwifruit Specialty Flagship Store", "transport": "Take Bus 4 or 9 to \u0027Xuanhuamen Station\u0027 and walk into Guanxian Ancient Town; you will see it right away."}, {"address": "No. 68 Ancient Street, Tai\u0027an Ancient Town, Qingcheng Mountain Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.8 Stars | Must-Buy List: Qingcheng Xueya Premium Green Tea, Qingcheng Kuding Tea, Taoist Health Seven-Treasure Tea Bags. Qingcheng Mountain has a long history of tea production, and Qingcheng Xueya is a famous historical tea. This flagship store offers the purest mountain-harvested tea leaves. The tea liquor is clear with a crisp, sweet aftertaste. Free tea tasting is available on-site along with elegant Taoist-style bamboo gift boxes, making it culturally refined.", "name": "Qingcheng Xueya Famous Tea Main Store", "transport": "Transfer to a scenic area express shuttle or taxi at Mount Qingcheng Front Mountain to \u0027Tai\u0027an Ancient Town, Mount Qingcheng Back Mountain\u0027, then walk about 200 meters into the ancient street."}, {"address": "No. 12 Commercial Street, next to the Mountain Gate, Qingcheng Mountain Scenic Area, Dujiangyan City, Chengdu", "feature": "\u2b50 4.5 Stars | Must-Buy List: Classic Bottled Dongtian Milk Wine, Qingcheng Mountain Taoist Fruitwood Wine, Kiwifruit Sweet Wine. Dongtian Milk Wine is one of the \u0027Four Wonders of Qingcheng\u0027. Fermented using local kiwifruit juice, Taoist medicinal herbs like Chuanxiong, and traditional wine mash, it features a rich, milky texture with fruity notes. With low alcohol content, it is an ideal keepsake wine for women and light drinkers.", "name": "Qingcheng Mountain Dongtian Milk Wine Specialty Store", "transport": "Take the intercity high-speed rail to \u0027Qingcheng Mountain Station\u0027, then transfer to the Qingcheng Mountain shuttle bus to reach the entrance gate."}, {"address": "No. 126 Xingfu Road (Guanxian Ancient Town Pedestrian Street), Dujiangyan City, Chengdu", "feature": "\u2b50 4.4 Stars | Must-Buy List: Traditional Handmade Corn Cake, Specialty Leaf-Wrapped Rice Cake (Ye\u0027er Ba), Qingcheng Tea-Flavored Cake. Hidden inside Guanxian Ancient Town, this decades-old folk bakery specializes in traditional West Sichuan rice cakes and pastries. The fresh Ye\u0027er Ba is chewy yet non-sticky with a subtle leaf aroma. Beautifully packaged gift boxes make it an authentic souvenir filled with local Western Sichuan charm.", "name": "Guanxian Ancient Town Zhao\u0027s Pastry Shop (Time-Honored Souvenirs)", "transport": "Take Bus 1, 2, or 10 to \u0027Lidui Park Station\u0027, then walk about 5 minutes into Xingfu Road Pedestrian Street."}, {"address": "No. 2 Gongyuan Road, Dujiangyan City, Chengdu (Next to the entrance of Lidui Park Scenic Area)", "feature": "\u2b50 4.8 Stars | Must-Buy List: Panda-Shaped Handmade Butter Cookies, Limited-Edition Panda Bamboo-Scented Tea Box, Panda Post Wooden Souvenir Postcards. A creative snack \u0026 gift shop combining Chengdu\u0027s iconic \u0027Panda Culture\u0027 with souvenirs. The shop sells adorable panda cookies and tea gift sets. You can even stamp them with a special commemorative postmark before mailing them out\u2014extremely popular with young travelers and families.", "name": "Panda Post (Dujiangyan Lidui Park Branch)", "transport": "Take Dujiangyan Bus 4, 7, or 9 directly to \u0027Lidui Park Station\u0027, then walk 1 minute."}, {"address": "No. 105 Ancient Street, Tai\u0027an Community, Qingcheng Mountain Town, Dujiangyan City, Chengdu", "feature": "\u2b50 4.3 Stars | Must-Buy List: Qingcheng Mountain Dried Wild Bamboo Shoots, West Sichuan Spicy Shredded Beef Jerky, Dried Wild Mushroom Pack. Located in Tai\u0027an Ancient Town on Qingcheng Back Mountain, this shop focuses on wild mountain goods from around the Qingcheng Mountain Nature Reserve and spicy Sichuan beef. The local dried wild bamboo shoots are thick, tender, and crispy\u2014perfect for stewing soup or meat. A must-buy local specialty for savvy travelers.", "name": "Tai\u0027an Ancient Town Mountain Delicacies \u0026 Local Produce Shop", "transport": "Take the scenic direct bus from Qingcheng Mountain High-Speed Railway Station directly to \u0027Tai\u0027an Ancient Town, Mount Qingcheng Back Mountain\u0027, then walk to the middle section of the ancient street."}, {"address": "No. 218 Kuiguang Road, Dujiangyan City, Chengdu (Next to Kuiguang Tower Park)", "feature": "\u2b50 4.4 Stars | Must-Buy List: Fine West Sichuan Bamboo-Woven Tea Set Gift Box, Dujiangyan Traditional Handmade Brown Sugar Blocks, Panda Embroidered Shu Brocade Coin Purse. This workshop combines national intangible cultural heritage \u0027Daoming Bamboo Weaving\u0027 craftsmanship with traditional Sichuan handmade brown sugar and dark sugar products. Here, besides beautifully packaged authentic artisan brown sugar, you can also purchase exquisite bamboo craftware, making it a highly memorable souvenir.", "name": "Kuiguang Tower West Sichuan Bamboo Weaving \u0026 Specialty Pastry Workshop", "transport": "Take Dujiangyan Bus 6 or 19 to \u0027Kuiguang Tower Park Station\u0027, then walk about 200 meters."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 37 Zhizhen Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Sunac Snow World souvenirs, western Sichuan panda plushies, ice \u0026 snow sports gear. Chengdu Sunac Mall is the largest modern shopping center and cultural tourism commercial complex in Dujiangyan, adjacent to Sunac Snow World and Water Park. The mall brings together many well-known international and domestic brands, featuring large discount outlets. It is not only the top choice for tourists to buy outdoor and skiing gear, but also incorporates local western Sichuan cultural elements. With a spacious and comfortable shopping environment, it is an indispensable one-stop shopping and leisure landmark when visiting Dujiangyan.", "name": "Chengdu Sunac Mall", "transport": "Take Dujiangyan Bus 14 or J6 and get off at \u0027Sunac Cultural Tourism City Station\u0027."}, {"address": "No. 2 Kuiguang Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Brand discount down jackets, sale sports sneakers, Shu brocade handkerchiefs. Bailun Plaza is the most iconic vintage department store in downtown Dujiangyan, serving as a central hub for locals\u0027 everyday shopping. The mall features a large Outlet discount zone offering year-round steep discounts on famous apparel and sportswear brands. Beyond chain stores, it also hosts counters with traditional Sichuan handicrafts and local souvenirs, vividly showcasing Dujiangyan\u0027s local commercial vitality and everyday lifestyle.", "name": "Dujiangyan Bailun Plaza \u0026 Outlet", "transport": "Take Dujiangyan Bus 4 or 7 and get off at \u0027Bailun Plaza Station\u0027."}, {"address": "No. 88 Qingcheng Avenue, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Qingcheng Mountain cured bacon, secret-recipe sausages, wood-smoked pork trotters. Situated at the foot of Mount Qingcheng, this uniquely charming independent local brand is highly praised by both locals and tourists. The store insists on using traditional slow pine-and-cypress wood smoking methods to craft cured meat that is rich, savory, and perfectly balanced without being greasy. All meat products are home-cured, beautifully packaged, and hygienic\u2014making them the premier choice for authentic local souvenirs representing Dujiangyan and Mount Qingcheng.", "name": "Qingcheng Mountain Cured Meat \u0026 Local Specialty Store", "transport": "Take Dujiangyan Bus 101 to \u0027Qingcheng Mountain Scenic Area Station\u0027 and walk for about 5 minutes."}, {"address": "No. 18 Xingfu Road, Dujiangyan City, Chengdu City, Sichuan Province (Inside Guanxian Ancient City)", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade bamboo-woven tea sets, Qingcheng Taoist tea, panda bamboo fiber towels. Located in the core district of Guanxian Ancient City, this featured boutique select store focuses on promoting Dujiangyan\u0027s local intangible cultural heritage and creative products. It brings together works by local Sichuan independent designers, cleverly blending traditional porcelain-wrapped bamboo weaving crafts with modern everyday goods. Featuring antique decor and refined goods rich in local character, it is a wonderful spot for picking up artistic souvenirs.", "name": "Guanxian Ancient City Shu Creative Goods Store", "transport": "Take Dujiangyan Bus 1 to \u0027Xuanhuamen Station\u0027 and walk into the ancient city."}, {"address": "No. 288 Xingfu Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Local brand custom perfumes, Shu embroidery handmade bags, signature panda gift boxes. Imix Park is one of downtown Dujiangyan\u0027s primary fashion shopping malls, seamlessly blending trendy shopping with local cultural showcases. The mall hosts various Sichuan local fashion brands and unique beauty experience shops alongside fast-fashion discount outlets. Situated near the lively Xingfu Road Pedestrian Street, it is the best place to experience Dujiangyan\u0027s modern urban vibe and shop alongside local youth.", "name": "Dujiangyan Imix Park", "transport": "Take Dujiangyan Bus 2 or 19 and get off at \u0027Xingfu Square Station\u0027."}, {"address": "No. 15 Shangjie, Tai\u0027an Ancient Town, Qingchengshan Town, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Qingcheng Kuding tea, mugwort herbal handmade soaps, tea polyphenol moisturizing cream. Tucked inside Tai\u0027an Ancient Town, this distinctive local independent experience store highlights natural herbal skincare and traditional Taoist tea rooted in Mount Qingcheng\u0027s wellness culture. Using premium tea leaves from Mount Qingcheng and native herbs, they create handmade soaps and skincare products with gentle formulas and unique fragrances, attracting many relaxing travelers looking to purchase quality local remedies.", "name": "Qingcheng Taoist Tea \u0026 Herbal Cosmetics Store", "transport": "Take the Mount Qingcheng Scenic Area Shuttle to \u0027Tai\u0027an Ancient Town Entrance\u0027 and walk for about 3 minutes."}, {"address": "1st Floor, Sunac Mall, No. 37 Zhizhen Road, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Discounted past-season Nike running shoes, Adidas outdoor windbreakers, Under Armour compression apparel. Situated inside Sunac Mall, this massive sports outlet mega store is Dujiangyan\u0027s premier hub for major international brand discounts. The spacious location offers amazing year-round deals starting from 70% off. It carries an extensive selection of outdoor gear, ski apparel, and casual footwear/clothing\u2014perfect for travelers visiting Dujiangyan who want to snap up bargains.", "name": "Dujiangyan Sunac Outlet Sports Mega Store", "transport": "Take Dujiangyan Bus 14 and get off at \u0027Sunac Cultural Tourism City Station\u0027."}, {"address": "No. 22 Nanqiao Pedestrian Street, Dujiangyan City, Chengdu City, Sichuan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Taoist Tai Chi Zen cotton-linen shirts, handmade bamboo-woven shawls, porcelain-wrapped bamboo vases. Located near Nanqiao (South Bridge), this local independent boutique for clothing and handicrafts is popular among local culture enthusiasts. It highlights original cotton-and-linen clothing inspired by Mount Qingcheng\u0027s Taoist culture, alongside exquisite traditional Dujiangyan bamboo weaving products. Every garment and craft item radiates a unique Oriental aesthetic quality\u2014well-made, unique, and truly representative of local creative flair.", "name": "Guyan Bamboo Weaving \u0026 Local Fashion Boutique", "transport": "Take Dujiangyan Bus 1 or 4 to \u0027Nanqiao Station\u0027 and walk for about 2 minutes."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dujiangyan and Mount Qingcheng"}, "gaoxin_globalcenter": {"categories": {"cat_1": {"items": [{"address": "Floor F1, K Avenue, Chengdu SKP, No. 33 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.8 Stars | Must-Buys: Radiant Hydrating Seamless Foundation Cream, Luxury Caviar Mask, Highlighter Paste. A leading Chinese luxury beauty brand founded by renowned makeup artist Mao Geping, acclaimed for formulas expertly tailored to Asian skin tones and facial bone structures. Located at Chengdu SKP in the Hi-Tech Zone, the counter offers professional one-on-one makeup consultations. Its signature foundation creams and highlighters create exquisite, sculpted, classical Oriental makeup looks, beloved by local socialites and tourists alike.", "name": "MGP Beauty (Chengdu SKP Store)", "transport": "Metro Lines 1/18 Jincheng Plaza East Station, Exit K, approx. 300m walk"}, {"address": "Floor F1, New Century Global Center, No. 1700 North Section of Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.5 Stars | Must-Buys: Judydoll 7-Color Play Palette, INTO YOU Lip Mud, Joocyee Yeast Lip Glaze. A massive beauty multi-brand store featuring hundreds of high-value trendy domestic cosmetic brands, making it a shopping paradise for young girls and students in Chengdu. Bright and trendy with a fully open tester experience, you can find all the viral domestic cosmetics and emerging skincare items trending on social media in one stop.", "name": "WOW COLOUR (Chengdu Global Center Store)", "transport": "Metro Line 1 Jincheng Plaza Station, Exit A directly connects to the Global Center"}, {"address": "Floor F1, Lotte Department Store, Global Center, No. 1700 North Section of Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.4 Stars | Must-Buys: Tai Chi Ancient Formula Youth Repair Essence, New Seven-White Whitening Mask, Freeze-Dried Essence Mask. A premium domestic skincare brand rooted in Traditional Chinese Medicine herbal wisdom, filled with a fresh, soothing herbal aroma. Its signature Tai Chi Yin-Yang Dual Effect Jelly Mask and TCM whitening mask series are perfect for shoppers seeking natural, gentle, and stress-free skin care\u2014a quintessential Han botanical skincare souvenir when visiting Chengdu.", "name": "Herborist (Chengdu Global Center Store)", "transport": "Metro Line 1 Jincheng Plaza Station, Exit A directly connects to the shopping center"}, {"address": "Floor F2, Chengdu Ufun Shopping Center, No. 300 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Carslan Black Gold Lipstick, Meikang Powder, ZEESEA British Museum Eyeshadow Palette. A famous makeup selector store viral for its rainbow beauty-blender wall and stunning decor, located in the Financial City Ufun Hub. Bringing together high-quality Chinese and emerging Asian makeup brands, it offers a pressure-free self-serve shopping environment with non-intrusive staff\u2014ideal for taking photos, testing colors, and hunting for treasures.", "name": "THE COLORIST (Chengdu Ufun Shopping Center Store)", "transport": "Metro Line 5 Jiaozi Avenue Station, Exit D, approx. 400m walk"}, {"address": "Ground Floor Commercial Store, Chutianfu, No. 88 Shujin Road, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 Stars | Must-Buys: Fritillaria Loquat Syrup, Pearl Whitening Lotion, Beauty Rose Ejiao Cake. A century-old Chinese time-honored pharmacy brand in Sichuan. Beyond authentic Chinese medicinal herbs, its branch in the Hi-Tech Zone offers in-house developed Traditional Chinese Herbal skincare and wellness items, highly prized as local secrets. Skincare creams and wellness herbal teas crafted from authentic Sichuan herbs make thoughtful health gift souvenirs for elders and best friends.", "name": "De Ren Tang Pharmacy (Hi-Tech Financial City Store)", "transport": "Metro Line 1 Financial City Station, Exit B, approx. 500m walk"}, {"address": "Floor F1, Global Center, No. 1700 North Section of Tianfu Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.3 Stars | Must-Buys: Explorer 12-Color Animal Eyeshadow Palette, Business Card Lip Stain, Bionic Film Essence Lipstick. One of China\u0027s most iconic trendy cosmetics brands. The flagship experience store at Global Center showcases the complete range of exciting new releases. Equipped with professional light-adjusted makeup mirrors and beauty artist guidance, its co-branded eyeshadow palettes with museums and wildlife funds feature exquisite packaging, making them top picks for stylish souvenirs.", "name": "Perfect Diary (Chengdu Global Center Experience Store)", "transport": "Metro Line 1 Jincheng Plaza Station, Exit A, approx. 200m walk"}, {"address": "Floor F3, Chengdu Yintai in99, No. 333 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.6 Stars | Must-Buys: Anti-Sensitizing Soothing Cream, Clear Sunscreen Lotion, Freeze-Dried Repairing Mask. China\u0027s premier dermatological-grade skincare brand specifically designed for sensitive skin. Located inside Yintai in99 in the Hi-Tech Zone, the counter provides professional skin analysis services. Containing Prinsepia Utilis oil and Purslane extract from the Yunnan plateau, its signature soothing cream provides soothing relief for seasonal sensitivity or travel-induced skin distress, earning deep trust among customers with sensitive skin.", "name": "Winona (Chengdu Yintai in99 Counter)", "transport": "Metro Line 5 Jiaozi Avenue Station, Exit A, approx. 500m walk"}, {"address": "Floor B1, K Avenue, Chengdu SKP, No. 33 Jiaozi Avenue, Hi-Tech Zone, Chengdu", "feature": "\u2b50 4.7 Stars | Must-Buys: DOCUMENTS Niche Perfumes, SkinCeuticals Phyto Corrective Gel Travel Minis, ToSummer Niche Scented Candles. A massive high-end beauty and fragrance multi-brand store blending futuristic space aesthetics with art, situated in the Chengdu SKP shopping district. Alongside luxury international travel minis, it uniquely hosts premium Chinese niche salon perfumes and lifestyle fragrance brands, delivering a luxurious and immersive beauty exploration experience.", "name": "HAYDON (Chengdu SKP Store)", "transport": "Directly connected upon exiting Metro Lines 18/1 Jincheng Plaza East Station"}], "name": "Local Iconic Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "1st Floor, New Century Global Center, No. 1700 Tianfu Avenue North Section, Gaoxin District, Chengdu", "feature": "\u2b50 4.6 stars | Must-Buy List: Chengdu Rongcheng FC co-branded
