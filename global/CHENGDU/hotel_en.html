=1\u0026query=30.6453863,104.0836134", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Shangri-La%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 4 Jianshe South Branch Road, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | A trendy boutique-luxury brand under IHG, located in the heart of the Eastern Suburb Memory Music Park. The hotel seamlessly blends industrial vintage aesthetics with modern chic design, cleverly weaving local Chengdu urban culture with contemporary art. Rooms are spacious and filled with design details, equipped with premium bath amenities and smart home systems. Surrounded by art exhibitions, live music venues, and creative shops, it\u0027s a top landmark choice for travelers seeking artistic vibes and pop culture.", "name": "voco Chengdu East Suburb Memory", "transport": "About a 5-minute walk from Exit B of East Suburb Memory Station (Metro Line 8)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520voco%2520Chengdu%2520East%2520Suburb%2520Memory", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520voco%2520Chengdu%2520East%2520Suburb%2520Memory", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20voco%20Chengdu%20East%20Suburb%20Memory", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=voco%20Chengdu%20East%20Suburb%20Memory%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 9 Binjiang Middle Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Located along the Jinjiang River near the Jiuyan Bridge commercial district, this is the flagship ultra-luxury brand of Wanda Hotels \u0026 Resorts. The hotel\u0027s design centers around \u0027New Chinese Classical Luxury\u0027, combining rich Shu culture with opulent European details. The top floor features a sky lobby and executive lounge offering panoramic views of the river and city skyline. Rooms feature top-tier massage chairs, handmade silk bedding, and smart control systems, backed by ultra-luxurious butler service.", "name": "Wanda Reign Chengdu", "transport": "About a 3-minute walk from Exit A of Jinjiang Hotel Station (Metro Line 1)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Wanda%2520Reign%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Wanda%2520Reign%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Wanda%20Reign%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Wanda%20Reign%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "Tower 3, IFS, No. 1 Section 3, Hongxing Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Perched atop Chengdu\u0027s premier downtown landmark IFS (International Finance Square), just minutes away by car from Sichuan TV Tower and Jiuyan Bridge. Designed by top international designers, the hotel exudes chic modern minimalist luxury, fusing contemporary art pieces with sophisticated lifestyle aesthetics. Rooms feature oversized floor-to-ceiling windows overlooking the vibrant city skyline and the giant outdoor panda sculpture. On-site dining spots like The Kitchen Table and The Tea Lounge are hotspots for Chengdu\u0027s elite.", "name": "Niccolo Chengdu", "transport": "Direct access to the hotel entrance from Exit C o sm with luxury spaces. Rooms feature oversized picture windows offering sweeping night views of Chengdu. Features a large indoor heated pool, full-service spa, and high-end dining options.", "lat": 30.6592725, "lng": 104.0675001, "name": "JW Marriott Hotel Chengdu", "transport": "Directly connected to the underground exit at Tianfu Square Station (Metro Line 1 or 2), about a 3-minute walk", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520JW%2520Marriott%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6592725%2C104.0675001", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6592725,104.0675001", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=JW%20Marriott%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 8 South Section of Chunxi Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Masterfully designed by world-renowned interior designer Tony Chi, located at the bustling hub east of Chunxi Road, near Jiuyan Bridge and the TV Tower cultural zone. The design blends romantic French chateau charm with classical mansion elements to create a warm, textured, and luxurious ambience. Features 8 distinct dining spots and bars, including the uniquely styled \u0027No. 8\u0027 hot pot restaurant. Guest rooms showcase warm wooden tones and refined furnishings for a cozy sky-high luxury stay.", "lat": 30.656196, "lng": 104.0741107, "name": "Grand Hyatt Chengdu", "transport": "About a 2-minute walk from Exit E1 of Chunxi Road Station (Metro Line 2 or 3)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Grand%2520Hyatt%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.656196%2C104.0741107", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.656196,104.0741107", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Grand%20Hyatt%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Luxury 5-Star \u0026 Landmark Hotels"}, "cat_2": {"items": [{"address": "F1, 339 Joy City, No. 94 Mengzhuiwan Street, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | Located next to Chengdu\u0027s landmark Sichuan Radio and Television Tower (339 Tower), this trendy design hotel features modern light luxury and high-tech aesthetics. Guest rooms offer panoramic high-altitude city views, taking in the night lights of the Jinjiang River and the tower\u0027s vibrant neons. Decorated with minimalist geometric lines and bright colors, it\u0027s popular among young travelers and design enthusiasts. Step outside straight into a lively nightlife district filled with bars and food hubs.", "name": "MiniMax Hotel Chengdu 339", "transport": "Take Chengdu Metro Line 4 to Shuangqiaolu Station, or Line 3 to Hongxingqiao Station, and walk for about 10 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520MiniMax%2520Hotel%2520Chengdu%2520339", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520MiniMax%2520Hotel%2520Chengdu%2520339", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20MiniMax%20Hotel%20Chengdu%20339", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=MiniMax%20Hotel%20Chengdu%20339%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 4 Jianshe South Branch Road, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Located in the heart of Eastern Suburb Memory Music Park, this hotel ingeniously fuses Chengdu\u0027s vintage industrial heritage with Accor\u0027s French romantic design. The exterior retains a strong red-brick industrial vibe, while the interior uses abundant artworks, textured brick walls, and sleek metallic lines to create a striking visual contrast. Tailor-made for travelers seeking cultural depth and design elegance, the surrounding area is packed with music festivals, exhibitions, and creative shops.", "name": "Grand Mercure Chengdu Eastern Suburb Memory", "transport": "Take Chengdu Metro Line 8 to Eastern Suburb Memory Station, and walk about 5 minutes from Exit B.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Grand%2520Mercure%2520Chengdu%2520Eastern%2520Suburb%2520Memory", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Grand%2520Mercure%2520Chengdu%2520Eastern%2520Suburb%2520Memory", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Grand%20Mercure%20Chengdu%20Eastern%20Suburb%20Memory", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Grand%20Mercure%20Chengdu%20Eastern%20Suburb%20Memory%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 87 East 5th Section, 1st Ring Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 Stars | Located near the vibrant Jiuyan Bridge bar street and the Jinjiang riverfront, the Atour S brand focuses on prem ng District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 Stars | Adjacent to People\u0027s Park and the Jinjiang River, this is a long-standing and highly acclaimed classic local 5-star landmark hotel in Chengdu. Following a thorough modern renovation, it seamlessly blends contemporary fashion with the aesthetic imagery of Sichuan\u0027s mountains and rivers. The 21st-floor rooftop bar and top-tier Sichuan-Cantonese restaurant are renowned citywide. Its prime location allows easy walking access to People\u0027s Park for tea and scenic views.", "lat": 30.6507641, "lng": 104.0646966, "name": "Minshan Hotel Chengdu", "transport": "Located right outside Exit A of Jinjiang Hotel Station on Metro Line 1; about a 10-minute walk to People\u0027s Park.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Minshan%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6507641%2C104.0646966", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6507641,104.0646966", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Minshan%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 8 South Section of Chunxi Road, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Located at the intersection of the core Tianfu Square and Chunxi Road commercial districts, designed by legendary designer Tony Chi to elegantly combine French mansion aesthetics with contemporary luxury residence vibes. The hotel boasts 7 distinct top-tier restaurants and bars, including the famous \u0027No. 8\u0027 Asian hot pot restaurant, offering guests an opulent feast for both taste and sight.", "lat": 30.656196, "lng": 104.0741107, "  District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Tucked away in a quiet alley near Kuanzhai Alley, Blossom House is known for its distinctive Oriental aesthetics and humanistic courtyard style. Modernizing a traditional residence, it retains tiled roofs and a central courtyard, seamlessly incorporating bamboo groves, stone steps, and tea rooms. Warm wooden tones and natural light evoke a serene, slow-paced lifestyle. Each room includes fine tea sets, inviting guests to savor Chengdu\u0027s relaxed tea culture and refined Oriental living.", "name": "Blossom House Chengdu Hexiangli", "transport": "Approx. 800m walk from Exit D of People\u0027s Park Station (Metro Line 2)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Blossom%2520House%2520Chengdu%2520Hexiangli", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Blossom%2520House%2520Chengdu%2520Hexiangli", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Blossom%20House%20Chengdu%20Hexiangli", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Blossom%20House%20Chengdu%20Hexiangli%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 61 Xi\u0027an South Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 stars | Crafted for modern youth and business travelers, this stylish hotel exudes light luxury, retro charm, and Morandi color palettes. Classic Sichuan opera masks and giant pandas are cleverly reinterpreted into contemporary art installations, alongside full smart-room voice controls and high-end audio systems. Public areas offer free afternoon tea and late-night sweet soup. Famous for warm, top-notch service, it is a highly popular boutique stay in the Kuanzhai Alley area.", "name": "Doranda V Hotel Chengdu Kuanzhai Alley", "transport": "Approx. 600m walk from Exit D of Kuanzhai Alley Station (Metro Line 4)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Doranda%2520V%2520Hotel%2520Chengdu%2520Kuanzhai%2520Alley", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Doranda%2520V%2520Hotel%2520Chengdu%2520Kuanzhai%2520Alley", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Doranda%20V%20Hotel%20Chengdu%20Kuanzhai%20Alley", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Doranda%20V%20Hotel%20Chengdu%20Kuanzhai%20Alley%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 127 Changshun Upper Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 stars | Atour\u0027s upscale S-series flagship focuses on humanistic photography and sleek modern minimalism. It features a 24-hour \u0027Bamboo Library\u0027 showcasing local history and photography. Guest rooms offer premium ultra-soft bedding and deep-relaxation pillows, complemented by floor-to-ceiling windows that flood the space with natural light. Just minutes away from Kuanzhai Alley and People\u0027s Park, its ideal location and stellar service make it a top choice for discerning travelers.", "name": "Atour S Hotel Kuanzhai Alley Chengdu", "transport": "Approx. 400m walk from Exit B of Kuanzhai Alley Station (Metro Line 4)", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Atour%2520S%2520Hotel%2520Kuanzhai%2520Alley%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0 rch/?api=1\u0026query=Chengdu%20Chengdu%20Xiangzili%20Shu%20Culture%20Loft%20Homestay", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Xiangzili%20Shu%20Culture%20Loft%20Homestay%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 88 Citang Street, Qingyang District, Chengdu City", "feature": "\u2b50 4.9 Stars | Situated right beside the scenic People\u0027s Park, this light-luxury homestay designed by a renowned artist enjoys fantastic natural light and views. Featuring elegant arched doorways, micro-cement walls, and vintage art furniture, every corner serves as a photo-worthy backdrop. The host selects fresh local ingredients daily to serve guests delicate breakfasts. A short walk takes you to the iconic Heming Tea House inside the park to experience authentic Gaiwan tea and traditional ear-cleaning culture\u2014an unbeatable location.", "name": "Chengdu People\u0027s Park Luxury Designer Homestay", "transport": "Take Metro Line 2 to \u0027People\u0027s Park Station\u0027 Exit B, and walk for about 2 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Chengdu%2520People%2527s%2520Park%2520Luxury%2520Designer%2520Homestay", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Chengdu%2520People%2527s%2520Park%2520Luxury%2520Designer%2520Homestay", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Chengdu%20People%27s%20Park%20Luxury%20Designer%20Homestay", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20People%27s%20Park%20Luxury%20Designer%20Homestay%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 18 Dongyu Street, beside Ti ourney back in time. Alongside its nostalgic atmosphere, rooms are fully equipped with modern private bathrooms, climate control, and smart lock entry for a seamless blend of heritage character and modern convenience.", "name": "Chengdu Hualou Guyun Heritage Homestay", "transport": "Take Metro Line 4 to \u0027Kuanzhai Alley Station\u0027 Exit B, and walk for about 4 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Chengdu%2520Hualou%2520Guyun%2520Heritage%2520Homestay", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Chengdu%2520Hualou%2520Guyun%2520Heritage%2520Homestay", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Chengdu%20Hualou%20Guyun%20Heritage%20Homestay", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Hualou%20Guyun%20Heritage%20Homestay%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 22 Zhai Alley, Qingyang District, Chengdu City", "feature": "\u2b50 4.6 Stars | Drawing inspiration from contemporary art galleries, Manju Art View Homestay displays works by local artists throughout its guest spaces. The open rooftop garden overlooks the grey-tiled roofs and vibrant buzz of Kuanzhai Alley below. Rooms are equipped with smart speaker setups, comfortable latex mattresses, and premium pour-over coffee gear, ensuring guests enjoy a refined, artistic lifestyle experience after a day of sightseeing.", "name": "Chengdu Kuanzhai Alley Manju Art View Homestay", "transport": "Take Metro Line 4 to \u0027Kuanzhai Alley Station\u0027 Exit B, and walk for about 3 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search% du%20Chengdu%20Tianfu%20Oasis%20Cozy%20Family%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Tianfu%20Oasis%20Cozy%20Family%20Apartment%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Homestays"}}, "name": "Kuanzhai Alley, People\u0027s Park and Tianfu Square"}, "panda_wenshu": {"categories": {"cat_1": {"items": [{"address": "No. 1998 Shulong Avenue, Xindu District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Nestled in the lush greenery of Poly Park, this is the closest international luxury 5-star landmark hotel to the Chengdu Research Base of Giant Panda Breeding. Featuring expansive landscaped gardens and an outdoor swimming pool, its overall design seamlessly blends Bashu natural scenery with modern luxury. Bright and spacious, the guest rooms come with premium bedding and private scenic balconies, allowing guests to stay close to nature. The hotel features several high-quality restaurants serving exquisite Sichuan cuisine and international buffets, alongside a water play park and children\u0027s play facilities\u2014making it a premier choice for families and panda lovers visiting Chengdu.", "name": "Crowne Plaza Chengdu Panda Garden", "transport": "Only about a 5-minute drive to the Chengdu Research Base of Giant Panda Breeding. Alternatively, take Metro Line 3 to \u0027Panda Avenue Station\u0027 and transfer to a taxi or park shuttle bus.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Crowne%2520Plaza%2520Chengdu%2520Panda%2520Garden", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Crowne%2520Plaza%2520Chengdu%2520Panda%2520Garden", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Crowne%20Plaza%20Chengdu%20Panda%20Garden", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Crowne%20Plaza%20Chengdu%20Panda%20Garden%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "Courtyard B10, Wenshufang, Qingyang District, Chengdu City, Sichuan Province (next to Wenshu Monastery)", "feature": "\u2b50 4.7 Stars | Located in the core historic zone of ancient Wenshu Monastery area (Wenshufang), this is an iconic Zen-themed luxury boutique hotel in Chengdu. Designed in a traditional Bashu courtyard layout, the interior is meticulously furnished with mahogany antiques, famous calligraphy, artwork, and ancient artifacts, creating a serene, elegant, and culturally rich atmosphere. Guests can enjoy complimentary scripture copying, tea tasting, and Zen meditation sessions to embrace tranquil beauty away from the bustle. The rooms feature classic Oriental elegance combined with modern comforts, offering a unique taste of Eastern luxury in the vibrant city.", "lat": 30.6755081, "lng": 104.0706087, "name": "Buddha Zen Hotel Chengdu", "transport": "About a 2-minute walk to Wenshu Monastery; about a 5-minute walk to Exit K of Metro Line 1 \u0027Wenshu Monastery Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Buddha%2520Zen%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6755081%2C104.0706087", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6755081,104.0706087", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Buddha%20Zen%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 168 Xiyulong Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | Standing at the intersection of Chengdu\u0027s historic old town and modern commercial district, this 5-star landmark hotel is adjacent to the renowned Wenshu Monastery scenic area. Blending modern luxury with classical Oriental elements, the rooms offer spectacular views overlooking Chengdu\u0027s historic district and skyline. Facilities include a 24-hour fitness center, refined Cantonese and Sichuan restaurants, and a spacious executive lounge. Its prime location sits directly atop a metro hub; Wenshu Monastery is a short walk away, while Metro Line 3 provides a direct connection to the Panda Base\u2014ideal for travelers seeking convenience and premium comfort.", "lat": 30.6700233, "lng": 104.0650786, "name": "Dorsett Chengdu", "transport": "Directly accessible from Exit F of \u0027Luomashi Station\u0027 (transfer hub for Metro Lines 1 and 4); an 8-10 minute walk to the Wenshu Monastery scenic area.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Dorsett%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6700233%2C104.0650786", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6700233,104.0650786", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Dorsett%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 88 Taisheng South Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 Stars | A benchmark of luxury hospitality, The St. Regis Chengdu is located in the heart of downtown\u0027s commercial center, close to the Wenshu Monastery cultural area. The hotel upholds the signature 24-hour St. Regis Butler Service, provi ptionally prestigious accommodation and dining experience.", "lat": 30.6664017, "lng": 104.0675133, "name": "The Ritz-Carlton, Chengdu", "transport": "About a 5-minute walk to \u0027Luomashi Station\u0027 (Metro Lines 1 \u0026 4); 1 stop on Metro Line 1 reaches \u0027Wenshu Monastery Station\u0027.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520The%2520Ritz-Carlton%252C%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6664017%2C104.0675133", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6664017,104.0675133", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=The%20Ritz-Carlton%2C%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 2 Tashuiqiao North Street, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Situated in the heart of Chenghua District in northeastern Chengdu, this hotel serves as an ideal luxury base between the Giant Panda Base and Wenshu Monastery. Featuring grand architecture, the interior artfully incorporates elements of Chengdu\u0027s musical culture, bamboo groves, and panda motifs. Spacious rooms feature floor-to-ceiling panoramic windows and premium audio systems. Amenities include a heated indoor pool, a 24-hour fitness center, and multiple distinct dining outlets. Its northeastern location allows swift access to the Panda Base while maintaining quick connections to downtown attractions like Wenshu Monastery.", "lat": 30.6843969, "lng": 104.0977832, "name": "Hilton Chengdu Chenghua", "transport": "Close to \u0027Qianfeng Road Station\u0027 on Metro Line 3, offering direct trains to both \u0027Panda Avenue Station\u0027 (for the Panda Base) and \u0027Wenshu Monastery S ights lush lake views and natural ecological experiences. Featuring floor-to-ceiling windows with ample natural light, guests can soak in scenic views of the lake and hills. The interior features Nordic wooden decor, equipped with high-quality private soaking tubs and premium toiletries. Bicycle rental is available for guests to enjoy morning rides to Beihu Park or to visit the Panda Base to see pandas munching on bamboo\u2014a perfect hidden retreat away from the crowds.", "name": "Panda Park Lake View Homestay Chengdu", "transport": "Take Metro Line 8 to Shilidian Station, then transfer to a taxi for about 10 minutes", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Panda%2520Park%2520Lake%2520View%2520Homestay%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Panda%2520Park%2520Lake%2520View%2520Homestay%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Panda%20Park%20Lake%20View%20Homestay%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Panda%20Park%20Lake%20View%20Homestay%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 88 Caoshi Street, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 stars | Artfully incorporating traditional Shu brocade culture and Sichuan opera elements into guestroom design, every room feels like a mini cultural museum. Nestled in a historical conservation area around Wenshu Monastery, it offers a peaceful retreat amidst urban life. The homestay features an outdoor tearoom and a Hanfu experience zone where guests can try on traditional Hanfu for photo ops in the quaint courtyard. Bedding and amenities meet luxury hotel standards, delivering a comfortable stay rich in cultural depth.", "name": "Shushui Jinguan Shu Style Homestay Wenshu Temple", "transport": "About a 5-minute walk from Exit E of Wenshu Monastery Station on Metro Line 1", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Shushui%2520Jinguan%2520Shu%2520Style%2520Homestay%2520Wenshu%2520Temple", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Shushui%2520Jinguan%2520Shu%2520Style%2520Homestay%2520Wenshu%2520Temple", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Shushui%20Jinguan%20Shu%20Style%20Homestay%20Wenshu%20Temple", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Shushui%20Jinguan%20Shu%20Style%20Homestay%20Wenshu%20Temple%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 1024 Panda Avenue, Chenghua District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.3 stars | Tailor-made for families traveling with children, located very close to the Panda Base. The apartments feature slide rooms, tent-themed rooms, and an abundance of panda plush toys, creating a magical, playful vibe. Rooms come equipped with kids\u0027 toothbrushes, baby bathtubs, and safety corner guards, ensuring a worry-free stay for parents. The surrounding area offers convenient amenities with nearby supermarkets and local diners, providing easy transit to both the Panda Base and Beihu Ecological Area.", "name": "Panda Hometown Fairy Tale Family Apartment", "transport": "Take Bus 198 or 87 to Panda Base Station, then walk for about 6 minutes", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Panda%2520Hometown%2520Fairy%2520Tale%2520Family%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Panda%2520Hometown%2520Fairy%2520Tale%2520Family%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Panda%20Hometown%20Fairy%20Tale%20Family%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Panda%20Hometown%20Fairy%20Tale%20Family%20Apartment%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Homestays"}}, "name": "Giant Panda Base and Wenshu Monastery"}, "wuhou_jinli": {"categories": {"cat_1": {"items": [{"address": "No. 80, Section 2, Renmin South Road, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | Chengdu\u0027s oldest garden-style 5-star landmark hotel, built in 1958, carries a prestigious history of hosting foreign diplomats and state guests. Situated on the banks of the Jinjiang River, the hotel features expansive lush gardens and classic European-style architecture in a prime location near the bustling Wuhou District. Guests can indulge in elegant, state-guest-level hospitality in spacious, comfortable rooms with incredible views\u2014some overlooking the illuminated river at night. The hotel offers diverse, top-tier Chinese and Western dining, including authentic Sichuan specialties and refined Hong Kong-style dim sum. Just a short drive from popular attractions like Wuhou Shrine and Jinli Ancient Street, it is the premier choice for exploring Chengdu\u0027s Three Kingdoms heritage and enjoying a luxurious stay.", "lat": 30.6519518, "lng": 104.063646, "name": "Jinjiang Hotel Chengdu", "transport": "About a 2-minute walk from Exit A of Jinjiang Hotel Station on Metro Line 1; approximately a 10-minute drive from Wuhou Shrine and Jinli Ancient Street.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Jinjiang%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6519518%2C104.063646", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6519518,104.063646", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Jinjiang%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 55, Section 2, Renmin South Road, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.5 Stars | A classic 5-star landmark hotel located along the central axis of Renmin South Road in downtown Chengdu, just across the street from Jinjiang Hotel. Minshan Hotel is renowned for blending modern luxury with local Shu culture, featuring a grand lobby infused with rich bamboo accents and Shu brocade elements. Rooms are equipped with premium bedding and smart facilities for an exceptionally comfortable sleep. The top-floor revolving restaurant and sky bar offer panoramic city views alongside breathtaking gourmet cuisine. With close proximity to the Wuhou Shrine and Jinli commercial districts, transportation and amenities are extremely convenient, offering an unforgettable luxury stay for both business travelers and sightseers.", "lat": 30.6507641, "lng": 104.0646966, "name": "Minshan Hotel Chengdu", "transport": "About a 1-minute walk from Exit B of Jinjiang Hotel Station on Metro Line 1; roughly an 8-minute taxi ride to Wuhou Shrine.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Minshan%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D30.6507641%2C104.0646966", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=30.6507641,104.0646966", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Minshan%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 21, Section 3, Renmin South Road, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 Stars | Managed by the world-renowned Ascott Group, this premier landmark serviced apartment complex sits beside the Jinjiang River in Wuhou District, offering stunning river views and convenient transport links. Ranging from one to three-bedroom luxury suites, all accommodations feature separate living rooms, fully equipped modern kitchens, and washer-dryers, combining home-like warmth with upscale living standards. Facilities include an indoor heated swimming pool, steam room, children\u0027s playroom, and a state-of-the-art gym. Getting to Wuhou Shrine, Jinli Ancient Street, or Du Fu Thatched Cottage is quick and easy, making it ideal for family travelers, long-stay guests, or luxury seekers wanting generous space and refined quality.", "name": "Somerset Riverview Chengdu", "transport": "About a 5-minute walk from Exit A of Huaxiba Station on Metro Lines 1 or 3; about 1.8 km from Wuhou Shrine.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Somerset%2520Riverview%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Somerset%2520Riverview%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Somerset%20Riverview%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Somerset%20Riverview%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 88, Caotang East Road, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.6 Stars | A luxury garden-style landmark hotel adjacent to Du Fu Thatched Cottage and Huanhuaxi Park, seamlessly blending poetic heritage with Western Sichuan garden architecture. Surrounded by lush greenery and meandering streams, it creates a serene, paradise-like ambience. Rooms showcase an elegant New Chinese aesthetic with meticulously chosen materials, complete with large scenic windows or private balconies allowing guests to enjoy seasonal views of Huanhua Stream from inside. The hotel houses a high-end Sichuan restaurant, a tranquil teahouse, and a conference center, exuding a refined scholarly atmosphere. Just steps away from Du Fu Thatched Cottage and a short drive to Wuhou Shrine and Jinli, it is a magnificent luxury choice for travelers who appreciate tranquility, cultural charm, and natural scenery.", "name": "Huanhua Jinjiang Hotel Chengdu", "transport": "About a 10-minute walk from Qingyang Taoist Temple Station or Caotang North Road Station on Metro Line 5; immediately adjacent to Du Fu Thatched Cottage and Huanhuaxi Park.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Huanhua%2520Jinjiang%2520Hotel%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Huanhua%2520Jinjiang%2520Hotel%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Huanhua%20Jinjiang%20Hotel%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Huanhua%20Jinjiang%20Hotel%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 226, Wuhouci Avenue, Wuhou District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.8 Stars | As a landmark hotel under Atour Group\u0027s premium luxury \u0027S\u0027 series, its location is unbeatable\u2014situated right in the heart of Wuhouci Avenue, just a short stroll from Wuhou Shrine and Jinli Ancient Street. The exterior and interior design capture the essence of Three Kingdoms culture and Chengdu flair, combining a modern reading space with minimalist Oriental aesthetics. Rooms feature high-tech smart amenities, premium cloud-like bedding, luxurious bath toiletries, and exceptional soundproofing. The hotel also offers complimentary late-night porridge suppers, self-service laundry, and a gym. Its thoughtful, meticulous butler-style service earns rave reviews, making it an iconic, highly acclaimed landmark boutique hotel in the Wuhou Shrine area.", "name": "Atour S Hotel Wuhou Shrine Jinli Chengdu", "transport": "About a 3-minute walk to the entrances of Wuhou Shrine and Jinli Ancient Street; about an 8-minute walk from Exit D of Gaoshengqiao Station on Metro Line 3.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Atour%2520S%2520Hotel%2520Wuhou%2520Shrine%2520Jinli%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Atour%2520S%2520Hotel%2520Wuhou%2520Shrine%2520Jinli%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Atour%20S%20Hotel%20Wuhou%20Shrine%20Jinli%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Atour%20S%20Hotel%20Wuhou%20Shrine%20Jinli%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 81, Bitieshi Street, Jinjiang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.9 Stars | An award-winning, ultra-luxurious landmark hotel created by Swire Hotels, seamlessly combining a century-old Qing Dynasty courtyard with avant-garde modern architecture. Guests enter through a beautifully preserved traditional courtyard, opening into striking geometric design and contemporary luxury. Exceptionally spacious rooms feature luxurious marble bathrooms, custom furnishings, and cutting-edge tech. Guests can savor refined Italian cuisine at TIVANO, tranquil afternoon tea at the Bitieshi Teahouse, or ultimate relaxation at MI XUN Spa. A short drive from Wuhou Shrine and Du Fu Thatched Cottage, it offers an irreplaceable sanctuary for global travelers seeking apex aesthetics and luxury.", "name": "The Temple House Chengdu", "transport": "About a 5-minute walk from Chunxi Road Station on Metro Lines 2 or 3; approximately a 15-minute drive to Wuhou Shrine and Jinli Ancient Street.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520The%2520Temple%2520House%2520Chengdu", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520The%2520Temple%2520House%2520Chengdu", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20The%20Temple%20House%20Chengdu", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=The%20Temple%20House%20Chengdu%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 269, Shuncheng Avenue, Qingyang District, Chengdu City, Sichuan Province", "feature": "\u2b50 4.7 Stars | An international 5-star luxury landmark hotel in the Tianfu Square area of downtown Chengdu, inspired by Chengdu\u0027s ancient teahouse culture and modern metropolitan flair. Soaring high above . 180 Wuhouci Street, Wuhou District, Chengdu, Sichuan Province", "feature": "\u2b50 4.4 stars | A modern light-luxury apartment offering high-floor views overlooking the lush greenery of Wuhou Shrine and the glowing night lights of Jinli. Styled in contemporary Morandi color palettes, rooms come with large two-person soaking tubs and branded voice-activated sound systems. Includes 24-hour butler service and is only a 3-minute walk to Jinli Ancient Street, perfect for travelers seeking refined urban living and supreme convenience.", "name": "Chengdu Jinli Memory View Apartment", "transport": "Approx. 700m walk from Exit D of Gaoshengqiao Station, Metro Line 3", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Chengdu%2520Jinli%2520Memory%2520View%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Chengdu%2520Jinli%2520Memory%2520View%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Chengdu%20Jinli%20Memory%20View%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Jinli%20Memory%20View%20Apartment%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 18 Huanhua North Road, Qingyang District, Chengdu, Sichuan Province", "feature": "\u2b50 4.7 stars | Tucked away in an old neighborhood near Huanhuaxi, this standalone Western Sichuan-style courtyard is surrounded by lush bamboo groves. Guest rooms preserve original wooden architectural features while integrating modern design, complete with king beds and automated smart toilets. Guests can sip tea, chat, and listen to nature in the yard at night, enjoying authentic slow-paced Chengdu living within walking distance of Du Fu Cottage and the Sichuan Museum.", "name": "Chengdu Bamboo Shadow Courtyard Homestay", "transport": "Approx. 5-minute taxi ride from Tonghuimen Station, Metro Line 2", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Chengdu%2520Bamboo%2520Shadow%2520Courtyard%2520Homestay", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Chengdu%2520Bamboo%2520Shadow%2520Courtyard%2520Homestay", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Chengdu%20Bamboo%20Shadow%20Courtyard%20Homestay", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Bamboo%20Shadow%20Courtyard%20Homestay%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "No. 8 Tongci Road, Wuhou District, Chengdu, Sichuan Province", "feature": "\u2b50 4.6 stars | A characterful homestay bursting with local Sichuan folklore charm, located right next to Wuhou Shrine Park. Decorated with Ming and Qing dynasty carved wooden furniture, traditional fabrics, and canopy carved beds, creating a delightful atmosphere like stepping back in time. Clean and neat rooms come with premium herbal tea and local treats, while helpful staff share historical stories and hidden spots around Wuhou Shrine and Jinli.", "name": "Chengdu Master Shu Ancient Charm Homestay", "transport": "Approx. 800m walk from Gaoshengqiao Station, Metro Line 3", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DChengdu%2520Chengdu%2520Master%2520Shu%2520Ancient%2520Charm%2520Homestay", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DChengdu%2520Chengdu%2520Master%2520Shu%2520Ancient%2520Charm%2520Homestay", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Chengdu%20Chengdu%20Master%20Shu%20Ancient%20Charm%20Homestay", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Chengdu\u0026destName=Chengdu%20Master%20Shu%20Ancient%20Charm%20Homestay%2C%20Chengdu\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Homestays"}}, "name": "Wuhou Shrine, Jinli, and Du Fu Thatched Cottage"}};
        const cityNameEn = "Chengdu";
        let curDist = null, curCat = null;

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); 
            container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No data available.</div>`;
                return;
            }
            
            document.getElementById('content-area').innerHTML = items.map(item => {
                const itemName = item.name || item.title || "Hotel";
                const itemFeature = item.feature || item.description || "";
                const itemAddress = item.address || item.location || "See Map Navigation";
                const itemTransport = item.transport || item.transit || "See Map";
                
                // 保留亮點的 Google 搜尋功能
                const searchKeyword = encodeURIComponent(`${cityNameEn} ${itemName}`);
                const formattedFeature = itemFeature.replace(/(⭐\s*[\d\.]+(?:\s*Stars?|\s*星)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 🚀 直接讀取 Python 預先處理好的網址
                const mapUrl = item.urls?.gmap || `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;
                const agodaUrl = item.urls?.agoda || '#';
                const bookingUrl = item.urls?.booking || '#';
                const tripUrl = item.urls?.trip || '#';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${itemName}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Highlights</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address：</span><br>${itemAddress}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transportation：</span><br>${itemTransport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> Map Navigation
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
