swept atmosphere is utterly relaxing, making it an ideal spot to refuel after swimming at Nai Harn Beach.", "name": "Bohemian Beach Cafe \u0026 Vegan Bites", "transport": "Located along the coastal road at Nai Harn Beach, just a 3-minute walk from the beach. Very convenient on foot or by scooter."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "22/9 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 Stars | A popular food stall right next to the Rawai Seafood Market, specializing in freshly caught giant cuttlefish and squid. Seared quickly over hot charcoal, the skin gets a smoky charred aroma, while every bite offers an incredibly springy, crunchy texture bursting with ocean sweetness. Served with their house-made lime Thai chili dipping sauce, the tangy, fiery flavor perfectly elevates the squid\u0027s freshness\u2014a must-grab street delicacy while strolling through the seafood market.", "name": "Rawai Market Grilled Squid Stall", "transport": "Walk along Viset Road from Rawai Beach straight into the Rawai Seafood Market."}, {"address": "Nai Harn Lake Park, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 Stars | A traditional mobile ice cream cart tucked beside Nai Harn Lake and park, handmade using fresh coconut milk. Extremely rich, smooth, and velvety, it features a natural coconut aroma and subtle milky sweetness that is refreshing without being overly sweet. Served inside a fresh half coconut shell lined with tender coconut flesh, you can customize your toppings with crunchy peanuts and sticky rice. Refreshing and richly layered, it\u0027s a local and tourist favorite during lakeside walks.", "name": "Nai Harn Lake Traditional Coconut Ice Cream", "transport": "Located along the ring road surrounding Nai Harn Lake, about a 5-minute walk from Nai Harn Beach."}, {"address": "Rawai Beachfront Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 Stars | A super popular roti pancake stall along Rawai Beach. Watch the owner deftly spin batter into paper-thin dough, fried to golden crispy perfection, and wrapped around sliced fresh bananas and egg. Drizzled generously with condensed milk and chocolate sauce, the crispy exterior hides a hot, soft, gooey center. Each bite bursts with sweet banana flavor and buttery richness\u2014the ultimate irresistible classic Thai street dessert.", "name": "Rawai Beachfront Fresh Roti Pancakes", "transport": "Walk along Rawai Beachfront Road and you will easily spot the food cart."}, {"address": "Nai Harn Beach Entry Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.7 Stars | A favorite food stall located right at the entrance of Nai Harn Beach. Made fresh to order, the green papaya salad (Som Tam) blends shredded papaya, fish sauce, lime juice, and peanuts into an appetizingly spicy, tangy, and super refreshing crunch. Paired with piping-hot Thai fried chicken that boasts a crackling crispy skin and juicy, tender meat inside, this heavenly combo is the ultimate post-swim energy refueling meal.", "name": "Nai Harn Beach Som Tam \u0026 Fried Chicken Stall", "transport": "Located near the main entrance to Nai Harn Beach, close to the parking area."}, {"address": "Rawai Local Market, Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 Stars | Located in the Rawai Local Market, this stall is famous for selecting premium fully-ripe mangoes that are silky, juicy, and exceptionally sweet. Served alongside glutinous rice steamed with rich coconut milk, the sticky rice offers a soft, chewy texture with a perfectly balanced sweet-and-salty aroma. Finished with a sprinkle of crispy mung beans for crunch, this heavenly pairing of warm sticky rice and chilled fresh mango is love at first bite.", "name": "Rawai Market Coconut Mango Sticky Rice", "transport": "Take a Songthaew and get off at Rawai Local Market."}, {"address": "Rawai Night Market Ground, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 Stars | A wildly popular grill stall at Rawai Night Market famous for its deeply marinated grilled pork skewers (Moo Ping). Sliced pork is soaked in a secret marinade of lemongrass, coriander root, palm sugar, and fish sauce, then slow-grilled over hot coals while being brushed with coconut milk. The cooked skewers achieve a tempting caramelized glaze\u2014thick, juicy, and tender\u2014infused with smoky char and savory-sweet coconut aromas. Pair with a hot bag of sticky rice for a satisfying meal.", "name": "Rawai Night Market Traditional Moo Ping (Grilled Pork Skewers)", "transport": "Located within the vendor zone of the Rawai Night Market."}, {"address": "Near Rawai Pier, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 Stars | A popular satay vendor near the seafood port, offering bite-sized pork and chicken marinated in turmeric and authentic Thai spices, grilled until golden with a hint of char. The meat is tender with a delightful chew. Dip into their thick homemade peanut sauce for a rich, silky flavor with subtle peanut sweetness, balanced perfectly by side pickled cucumber and onion vinegar sauce\u2014a favorite late-night snack for locals and travelers alike.", "name": "Rawai Seafood Port Pork \u0026 Chicken Satay", "transport": "Located in the vendor area near the entrance of Rawai Pier."}, {"address": "Wiset Road near Nai Harn Intersection, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 Stars | A historic snack stall specializing in the traditional Thai dessert \u0027Khanom Krok\u0027 (coconut puddings). Using a dimpled iron pan, the owner pours rice batter and thick coconut milk to order. Fresh off the grill, the shell is light and crispy, while the hot inside is smooth and molten like warm custard. Featuring a delightful contrast of crispy skin and creamy savory-sweet filling, options to add scallions or sweet corn make it an authentic, delicious street treat to enjoy while strolling.", "name": "Nai Harn Traditional Khanom Krok Stall", "transport": "Located near the three-way intersection on Viset Road heading towards Nai Harn Beach."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Rawai Seafood Market and Nai Harn Beach Area"}};

            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
