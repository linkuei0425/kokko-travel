ch Front, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 Stars | A down-to-earth tropical beachside bistro opening directly onto Kamala Beach, allowing guests to enjoy food and cocktails with their feet in the soft sand. It highlights fresh daily catches like river prawns and flower crabs. The signature Tom Yum Seafood Soup is rich and spicy; the springy prawn meat absorbs the delicious broth as lemongrass and kaffir lime leaf aromas burst in your mouth. Pair it with a chilled coconut cocktail for a refreshing finish. The unpretentious coastal ambiance and affordable prices make it the perfect spot to relax, watch the sea, and enjoy authentic local dishes.", "name": "Lillo Island Restaurant \u0026 Bar", "transport": "Easily accessible by walking along the Kamala Beach boardwalk; located in the middle section of the beach."}, {"address": "8/13 Moo 3, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 Stars | Situated next to Surin Beach Park, this European Italian bistro and boutique bakery radiates Mediterranean sunshine. The restaurant insists on using top-grade imported Italian ingredients. The signature handmade Parma Ham and Arugula Pizza has a crispy crust with wood-fired aroma and rich, gooey cheese, elegantly paired with classic espresso or a chilled, refreshing Aperol Spritz. With its bright, relaxed indoor and outdoor seating and freshly prepared quality light meals, it is a popular top choice for a refined lunch or evening drinks before or after enjoying the water at Surin Beach.", "name": "Bocconcino Phuket", "transport": "About a 2-minute walk from Surin Beach Park."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "84/3 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.8 stars | A cozy haven dedicated to vegan lovers, offering a wide variety of plant-based cuisine. Highly recommended are their Veggie Hummus Wrap and freshly blended Green Smoothie. The smooth, rich hummus combined with crisp organic lettuce and whole-wheat wrap provides a light, guilt-free dish with rich layers of texture. Tourists love the relaxing resort vibe and the natural, additive-free culinary concept.", "name": "Shanti Vegan Cafe Phuket", "transport": "About a 10-minute walk from Kamala Beach."}, {"address": "73/113 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.7 stars | Featuring South American-style healthy vegan acai bowls and plant-milk coffee. The signature superfood acai bowl is cool, creamy, and bursting with rich berry aromas, topped with fresh mango, banana, coconut flakes, and homemade toasted nuts. The interplay of chewiness and crunch makes it a perfect beachside refresher, highly popular among Western tourists and fitness enthusiasts.", "name": "Pura Vida Cafe Kamala", "transport": "Located right off Kamala\u0027s main road; take a songthaew to Kamala Main Street and walk for 3 minutes."}, {"address": "Kamala Beach Front, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.5 stars | A beachfront restaurant on the first line of Kamala Beach, offering an exceptionally rich selection of Thai vegetarian dishes. The \u0027Vegetarian Green Curry Tofu\u0027 comes highly recommended; firm organic tofu absorbs the fragrant green curry sauce infused with coconut milk and holy basil, served with sliced fresh bamboo shoots and Thai eggplant. Tender, savory, and mildly spicy, it pairs perfectly with rice, allowing you to savor a vegan Thai dining experience accompanied by the gentle ocean breeze.", "name": "Lillo Island Restaurant \u0026 Bar", "transport": "Walk north along the Kamala Beach promenade to arrive."}, {"address": "106/18 Moo 3, Cherngtalay, Choeng Thale, Thalang District, Phuket 83110, Thailand", "feature": "\u2b50 4.6 stars | A minimalist healthy restaurant located near Surin Beach, specializing in plant-based burgers and whole-food warm salads. The popular \u0027Vegan Tempeh Tofu Power Bowl\u0027 features grilled tempeh, pan-fried tofu, red quinoa, and roasted sweet potatoes, drizzled with a special peanut-sesame dressing. Fragrant, hearty, and satisfying, it is immensely popular among sun-seeking fitness buffs looking for high-protein plant-based meals.", "name": "The Everyday Surin", "transport": "About a 5-minute walk from the main exit of Surin Beach."}, {"address": "94/2 Moo 3, Kamala Beach Rd, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.4 stars | A highly praised, affordable local Thai vegetarian eatery specializing in traditional street snacks. The signature \u0027Vegetarian Pad Thai\u0027 uses kale, bean sprouts, shiitake mushrooms, and golden dried tofu, stir-fried over high heat to achieve an inviting wok hei flavor. The chewy noodles soak up the sweet and sour tamarind sauce and are topped with crushed peanuts, delivering an authentic taste that makes customers come back for more.", "name": "Jasmin Cafe \u0026 Vegetarian Kitchen Kamala", "transport": "Located on Kamala Beach Road near the night market area, reachable on foot."}, {"address": "333, 333/3 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.6 stars | A premier ocean-view bar located inside the InterContinental Phuket Resort in Kamala, featuring a dedicated gourmet Plant-Based menu. A must-try is the \u0027Smoked Veggie Tacos\u0027, which wraps seasoned plant-based mince, fresh guacamole, and salsa in corn tortillas for a crisp, juicy, zesty, and appetizing bite. Paired with a crafted botanical mocktail, it is the ultimate vegetarian choice for a luxurious seaside holiday.", "name": "Pine Beach Bar - InterContinental Phuket", "transport": "Located at the beachside area of the InterContinental Hotel, accessible directly by taxi or hotel shuttle."}, {"address": "73/123 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.5 stars | An authentic and cozy Italian bistro offering impressive vegetarian pizzas and pastas. The acclaimed \u0027Truffle \u0026 Wild Mushroom Veggie Thin Crust Pizza\u0027 features a wood-fired oven-baked crust that is deliciously crispy and charred at the edges yet tender in the middle, topped with fresh mixed wild mushrooms and rich vegan cheese. Its deep flavor and smooth finish attract many vegetarian pizza and pasta lovers.", "name": "Sole Mio Kamala", "transport": "Located near Kamala\u0027s central shopping district, making it easily accessible on foot or by scooter."}, {"address": "106/46 Moo 3, Surin Beach Road, Choeng Thale, Thalang District, Phuket 83110, Thailand", "feature": "\u2b50 4.7 stars | A stylish restaurant located inside Twinpalms Surin Phuket Resort, serving exquisite high-end Thai vegetarian feasts. The recommended \u0027Thai Vegetarian Lemongrass Mushroom Soup\u0027 features a rich broth simmered with fresh lemongrass, galangal, and kaffir lime leaves, combined with rare mushrooms and fresh lime juice. Zesty, spicy, and full of complex layers, it demonstrates the pinnacle of fine Thai vegetarian craftsmanship.", "name": "Oriental Spoon Surin", "transport": "Located inside the Twinpalms Resort on Surin Beach Road, about a 3-minute walk from Surin Beach."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Opposite Phuket FantaSea, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | The largest and liveliest night market in Kamala, bringing together the most authentic Southern Thai street eats. A must-try is the freshly made Thai banana roti: crispy and golden on the outside, wrapped around soft, sweet banana slices, and drizzled with rich condensed milk and chocolate hazelnut spread\u2014crispy, tender, and bursting with sweet flavor in every bite. The market also features various charcoal-grilled meat skewers that are juicy with a subtle smoky aroma, loved by both international tourists and locals.", "name": "Kamala Friday Night Market", "transport": "About a 10-minute walk from Kamala Beach, or take a songthaew to the stop opposite Phuket FantaSea."}, {"address": "Main Road, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | A vibrant local evening market open only on Wednesday and Saturday afternoons, bursting with authentic local atmosphere. The Thai coconut pancakes (Khanom Krok) here are legendary\u2014cooked to order in double-layer cast-iron pans, crisp and caramelized on the outside with a creamy, melty coconut center flavored with green onions or sweet corn. Served hot, these sweet and savory treats are utterly addictive. Many foodies come specifically to sample these authentic Southern Thai delicacies.", "name": "Kamala Wednesday \u0026 Saturday Market", "transport": "Located along the main road of Kamala; about a 3-minute Tuk-Tuk ride from Kamala Beach."}, {"address": "Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | Popular food stalls located at the entrance of Surin Beach, renowned for fresh, made-to-order green papaya salad (Som Tum) and grilled chicken skewers. The shredded green papaya is crisp and refreshing, tossed with lime juice, fish sauce, and fresh chilies for a vibrant spicy-tangy flavor kick. Paired with golden, juicy lemongrass-infused chicken skewers and sticky rice, it makes the ultimate refreshing local lunch after a beach walk.", "name": "Surin Beach Som Tum \u0026 BBQ Stalls", "transport": "Located next to the Surin Beach public parking area; easily accessible by walking along the beach promenade."}, {"address": "Kamala Beach Walkway, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | An immensely popular stall along the Kamala Beach walkway specializing in Thailand\u0027s classic street dessert, Roti. Skilled vendors stretch the dough paper-thin and pan-fry it in butter until crispy and golden. Filled with egg and fresh banana slices, and finished with a sprinkle of sugar and rich coconut condensed milk, it offers a sweet, crispy, and tropical fruit-filled treat that visitors to Kamala simply cannot miss.", "name": "Kamala Beach Banana Roti", "transport": "Located along the front section of the Kamala Beach walkway; easily spotted while walking along the beach."}, {"address": "Near Surin Plaza, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | A local market operating on Monday and Thursday afternoons, best known for its mouthwatering Thai grilled pork skewers (Moo Ping). Sliced pork shoulder is marinated with lemongrass, coriander seeds, and coconut milk, then slow-grilled over charcoal to a savory-sweet, golden charred finish. Juicy, tender, and served with a warm bag of chewy sticky rice, it is a street food staple beloved by locals and travelers alike.", "name": "Surin Monday \u0026 Thursday Market", "transport": "About an 8-minute walk from Surin Beach, or accessible by motorbike taxi."}, {"address": "Kamala Main Street, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.2 stars | A traditional Muslim-style stall on Kamala\u0027s main street, highlighting Southern Thai chicken satay and grilled beef skewers. Fresh meats are marinated in turmeric and aromatic spices before charcoal-grilling to juicy perfection with a subtle smoky char. Dipped in house-made rich peanut sauce and sweet-and-sour cucumber relish, the rich nuttiness and crisp cucumber balance each other flawlessly, making this a standout food stall in Kamala.", "name": "Kamala Halal Satay \u0026 Grill", "transport": "About a 2-minute walk from near the Kamala Mosque."}, {"address": "Near Kamala Beach Road, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | A mobile cart specializing in traditional Thai crispy crepes (Khanom Buang). The ultra-thin shells are cooked to wafer-like perfection, filled with sweet whipped meringue cream, and topped with your choice of savory shredded coconut or sweet egg yolk threads (Foi Thong). The contrast between the extra-crispy crepe and fluffy, sweet-savory filling makes for an irresistible local snack on the go.", "name": "Kamala Khanom Buang Stall", "transport": "Roams along the main commercial street near Kamala Beach; best to look around Beach Road in the afternoon."}, {"address": "Surin Beach Promenade, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | A tropical fruit and beverage stall located next to Surin Beach, renowned for freshly blended mango smoothies and authentic Thai iced tea. The mango smoothie blends ripe seasonal mangoes with a touch of condensed milk for a silky, velvet-smooth texture packed with juicy flavor. The handcrafted Thai iced tea delivers robust black tea aromas balanced with sweet condensed milk\u2014an ultra-cooling companion to enjoy while relaxing in the sea breeze.", "name": "Surin Beach Tropical Fruit \u0026 Thai Tea", "transport": "Located along the Surin Beach promenade; easily accessible on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Kamala and Surin Beach Area"}, "kata_karon": {"categories": {"cat_1": {"items": [{"address": "4/2 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 Stars | Perched on the cliffside at the southern end of Kata Beach, this decades-old staple is famous for its breathtaking ocean views and authentic Southern Thai flavors. Must-try dishes include the rich and zesty Tom Yum Seafood Soup, packed with succulent shrimp infused with lemongrass and kaffir lime aromas, and the Stir-Fried Crab in Yellow Curry, featuring sweet, tender crab meat wrapped in rich coconut milk and fluffy egg ribbons. Locals and tourists alike adore the rustic, unpretentious cooking style\u2014dining here accompanied by a ocean breeze is an absolute delight.", "name": "Kata Mama Seafood", "transport": "About a 3-minute walk from the southern section of Kata Beach to the cliffside entrance."}, {"address": "12/8 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 Stars | Tucked away on a backstreet in Karon, this legendary local eatery lacks lavish decor but attracts endless queues thanks to its decades-consistent authentic Pad Thai. The signature Chicken or Shrimp Pad Thai features chewy, perfectly cooked noodles tossed over high heat for a distinctive wok hei, balanced with crushed peanuts, fresh bean sprouts, and a squeeze of lime for a harmonious blend of sweet, sour, and savory. Their homemade slow-simmered beef noodle soup is equally rich and flavorful, making this a must-visit spot to experience authentic local Phuket food culture.", "name": "The Pad Thai Shop", "transport": "A 5-minute ride by Tuk-Tuk or scooter from Karon Beach along Patak Road heading towards the hills."}, {"address": "23/7 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.3 Stars | A storied and highly representative affordable Thai restaurant in the Kata business district, often packed during peak meal times. The Green Curry Chicken features tender meat in a thick, creamy, spicy-yet-sweet sauce that pairs perfectly with fragrant Jasmine rice. The Stir-Fried Holy Basil Pork is cooked savory, dry, and spicy, bursting with fresh basil aroma. Decades of offering generous portions at wallet-friendly prices have earned it rave reviews from global travelers.", "name": "Red Onion Restaurant", "transport": "Located in central Kata, about a 7-minute walk from the middle section of Kata Beach."}, {"address": "134 Thaweewong Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.2 Stars | Standing tall on Karon Beach Road for decades, this famous seafood establishment displays fresh daily catches at the entrance for guests to pick. Highly recommended are the Grilled Giant Tiger Prawns, boasting firm, juicy meat infused with subtle charcoal smoky flavors, served with spicy and tangy homemade green seafood dipping sauce. The Garlic and Salt \u0026 Pepper Stir-Fried Crab offers a crispy shell with sweet, tender meat. Its authentic culinary techniques and prime location make it an enduring culinary landmark on Karon Beach.", "name": "Karon Seafood Restaurant", "transport": "An easy walk along the main beachfront road (Beach Road) of Karon Beach."}, {"address": "4 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 Stars | Combining traditional Thai wooden architecture with antique decor, this classic spot feels like a Thai cultural museum nestled in hillside greenery. Specializing in traditional Southern Thai royal cuisine and home-style cooking, the signature Massaman Beef Curry is slow-cooked until melt-in-your-mouth tender, featuring a warm, sweet nuttiness from spices and peanuts. The Southern Thai Spiced Fried Fish is golden and crispy outside while juicy inside. With its charming vintage ambiance overlooking Kata Bay, it\u0027s a favorite among diners seeking refined traditional flavors.", "name": "Kampong Kata Hill", "transport": "Located on a small hill at the border of Kata and Karon; taking a taxi or Tuk-Tuk is recommended."}, {"address": "Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 Stars | A well-known family-run traditional restaurant in Karon Beach, featuring comforting home-style cooking prepared by Mama Jin herself. The must-try Pineapple Seafood Fried Rice features fragrant, distinct rice grains infused with sweet pineapple and turmeric curry notes, topped with savory pork floss and cashews for vibrant texture. The Coconut Milk Seafood Soup is smooth, perfectly balanced in spiciness and tanginess, and full of cozy homemade warmth\u2014making it a favorite among locals and regulars alike.", "name": "Mama Jin Restaurant", "transport": "Located in the bustling center of Karon Town, about an 8-minute walk from the northern end of Karon Beach."}, {"address": "98/7 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.3 Stars | A longstanding favorite in the Kata community, highly recommended by travelers from Europe and Asia alike. Using fresh local herbs and ingredients, classic dishes like Lemongrass Stir-Fried Seafood and Dry Curry Chicken are expertly stir-fried with rich aromas that linger deliciously on the palate. The Fried Spring Rolls feature an ultra-crispy shell with sweet, refreshing vegetable fillings. With warm service and consistently high-quality traditional Thai cuisine for decades, this is a solid dining spot you shouldn\u0027t miss in Kata.", "name": "Sugar \u0026 Spice Restaurant", "transport": "Situated on Kata Beach\u0027s main commercial street, just a 3-minute walk from Kata Night Market."}, {"address": "28/4 Khok Tanod Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 Stars | Tucked away in a quiet alley of Kata, this popular traditional eatery is famous for its generous portions and authentic home-style Thai dishes. The must-order Som Tam (Green Papaya Salad) is crisp, spicy, and refreshing, tossed with fragrant peanuts to whet your appetite. The Yellow Curry Seafood Pot is rich and smooth, packed with fresh, snappy seafood infused with coconut cream. Dishes are cooked to order with wonderful wok hei at reasonable prices, bringing back loyal customers time and again.", "name": "Butterfly Restaurant Kata", "transport": "About a 6-minute walk into the alley from the southern end of Kata Beach."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "24/8 Koktanod Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.7 Stars | Extremely popular at Kata Beach, this South American-inspired brunch spot specializes in fresh, healthy Acai Bowls and freshly roasted specialty coffee. Their mixed acai bowls are icy, creamy, sweet, and refreshing, topped with homemade crunchy granola and tropical fruits\u2014the perfect cool breakfast on a hot morning. With a cozy, lush green interior, it\u0027s a favorite among backpackers and surfers worldwide.", "name": "Pura Vida Cafe Phuket", "transport": "About an 8-minute walk from Kata Beach"}, {"address": "88/7 Koktanod Rd, Kata Beach, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 Stars | A popular cafe focused on organic, healthy eating. Their signature poached egg avocado toast is crispy on the outside and soft inside, pairing perfectly with a rich, smooth house latte. They source organic beans from northern Thailand, offering a smooth finish with fruity notes. Rustic wooden accents and lush plants create a relaxing vibe, making it a top pick for a leisurely breakfast in Kata.", "name": "Coffee Tribe Phuket", "transport": "About a 5-minute walk from Kata Night Market"}, {"address": "311 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 Stars | A pastel, dreamlike cafe and dessert shop located along Karon Beach, featuring giant ice cream and donut sculptures outside that are perfect for photos. Beside creamy, artisanal gelato, their freshly made waffles and cold drip coffee are widely acclaimed. Enjoying your treat in the outdoor seating area offers beautiful views of Karon Beach\u0027s azure waters.", "name": "Sweet Talk Phuket", "transport": "Located at the northern end of Karon Beach next to Centara Resort; beach is within walking distance"}, {"address": "100/77 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.8 Stars | Tucked away in an alley at Kata, this Korean minimalist-style specialty cafe is known for exquisite pour-over coffee and handcrafted cakes. The signature caramel macchiato is rich and smooth, pairing delightfully with freshly baked Basque cheesecake that melts in your mouth without being overly sweet. The serene, minimalist white space makes it a great spot to escape the hot sun.", "name": "Auntie\u0027s Coffee Kata Beach", "transport": "About a 3-minute walk after turning into the side alley from Kata Main Road"}, {"address": "186/15 Koktanod Rd, Kata Beach, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 Stars | Famous for its daily fresh-baked European bread, this brunch spot fills the air with rich aromas of wheat and butter. The popular French croissants are irresistibly crispy on the outside and soft, buttery inside. Paired with an aromatic Flat White, it offers rich, layered flavors highly praised by local expats and tourists alike.", "name": "Coast Bakery \u0026 Cafe Kata", "transport": "Located at the southern end of Kata; about a 6-minute walk from South Kata Beach"}, {"address": "399/5 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 Stars | A Karon branch of Phuket\u0027s famous trendy cafe brand, renowned for its diverse and high-quality homemade pastries. The signature coconut cake is light and fluffy, with subtle taro notes and natural coconut sweetness, making it extra refreshing alongside a cold brew. Bright, spacious, and filled with greenery, it\u2019s a beloved brunch destination in Karon.", "name": "Good Cafe Karon", "transport": "Located near Karon Roundabout; easily reached by car or scooter right next to the traffic circle"}, {"address": "28/9 Mu 2, T.Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 Stars | A unique cafe seamlessly blending artistic vibes with healthy eating, famous for colorful smoothie bowls and specialty oat lattes. The smoothie bowls have a velvety, ice-cream-like texture, topped with freshly sliced mango and nuts\u2014wholesome, delicious, and visually stunning, drawing fitness enthusiasts and aesthetic seekers alike.", "name": "The Canvas Cafe Kata", "transport": "Located along the main road in central Kata Beach, easily accessible on foot"}, {"address": "98/5 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 Stars | A highly-rated American-style brunch and specialty coffee joint in Kata, featuring hearty Full English Breakfast platters and top-notch espressos. Freshly cooked sausages, bacon, and sunny-side-up eggs are juicy and flavorful, served with toasted bread and dark roast Americano to fuel your day of water activities.", "name": "Coffee Supreme Kata", "transport": "About a 4-minute walk from Kata Beach Boulevard"}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "182 Koktanod Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.6 stars | A classic oceanfront bistro with breathtaking sea views located at the southern end of Kata Beach. Established for many years, it is renowned for exquisite Southern Thai seafood specialties and a top-tier wine collection. The signature Thai herb-grilled fish features a light, crispy skin and juicy, tender meat, served with a secret lime-chili dipping sauce that is delightfully zesty. Highly popular among visitors seeking a high-end dining ambiance and stunning sunset views.", "name": "The Boathouse Restaurant", "transport": "About a 5-minute walk from Kata Beach; or take a songthaew and get off at the southern end of Kata Beach."}, {"address": "47 Karon Road, Marina Phuket Resort, Karon Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.5 stars | A long-established local bistro perched on the cliffs at the edge of Karon Beach, surrounded by lush tropical greenery and majestic rocks. Highlight dishes include fresh Thai golden curry crab and lemongrass steamed prawns\u2014the crab meat is sweet and plump, steeped in a rich coconut-curry sauce. Paired with a signature tropical fruit cocktail from the bartender, it\u2019s a wonderful spot to enjoy sea breezes and authentic Thai flavors.", "name": "On The Rock Restaurant", "transport": "About an 8-minute walk from the southern end of Karon Beach, or take a taxi directly into Marina Phuket Resort."}, {"address": "224 Koktanod Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.4 stars | A highly popular, vibrant bistro in the Kata shopping district combining authentic traditional Thai dishes with Western cuisine. The Tom Yum Goong seafood soup here is richly tangy and spicy with succulent prawns. Coupled with live night band performances, the atmosphere is bustling and fun, drawing international travelers who love relaxing with good food and music.", "name": "Two Chefs Kata Beach", "transport": "Located on Kata\u0027s main commercial street; easily accessible on foot or by tuk-tuk."}, {"address": "98/7 Kata Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.3 stars | A cozy, beloved eatery popular with both locals and tourists, specializing in traditional home-style Thai cooking and signature beverages. The Thai green curry chicken and stir-fried pork with green chilies are highly recommended\u2014the sauces are rich and fragrant with sweet coconut milk and fresh lemongrass, perfect over steamed rice. Generous portions at reasonable prices.", "name": "Sugar \u0026 Spice Restaurant", "transport": "Located off the main Kata Beach road, about a 3-minute walk from Kata Night Market."}, {"address": "4 Koktanod Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.4 stars | A unique local cuisine restaurant filled with antique Thai decor, feeling like a tropical forest museum. Signature dishes include Southern Thai yellow curry fish fillets and lemongrass grilled chicken wings\u2014succulent, crispy, and flavorful. Paired with a special Thai iced tea or cold drink, guests can enjoy panoramic views of Kata Bay while experiencing a deeply traditional Thai feast.", "name": "Kampong Kata Hill", "transport": "Located at the entrance to Kata Hill; taking a tuk-tuk or songthaew is recommended."}, {"address": "28/2 Koktanod Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.7 stars | A top-rated hipster-style bistro in Kata, exquisitely serving regional Thai snacks and creative cocktails. The must-order Pad Thai boasts fantastic wok hei (smokiness), chewy rice noodles, and a rich layer of flavor enhanced by crushed peanuts and fresh lime juice. With a relaxed vibe and warm hospitality, it\u0027s a prime choice for evening drinks and authentic stir-fry.", "name": "Elephant No.9 Restaurant", "transport": "About a 4-minute walk from the main Kata Beach road."}, {"address": "225 Karon Road, Karon Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.4 stars | A long-standing local restaurant at the border of Karon and Kata, famed for delicate handmade Thai dishes and a cozy bar ambiance. The Pad Kra Pao (stir-fried basil pork with rice) is intensely aromatic, featuring minced pork savory with Thai basil and fish sauce, topped with a runny fried egg for wonderful texture\u2014bringing back loyal customers time and again.", "name": "The Sea Hag Restaurant", "transport": "Located on the southern road of Karon Beach; easily reachable on foot or by tuk-tuk."}, {"address": "100/35 Kata Road, Kata Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.3 stars | A fusion and Thai specialty bistro located on Kata\u0027s lively streets, featuring classic Southern Thai tribal recipes and custom cocktails. The fried lemongrass shrimp cakes are a must-try\u2014crispy golden on the outside and juicy on the inside, dipped in a memorable sweet-and-sour sauce. Romantic candlelight at night makes this a popular spot to explore Kata\u2019s nightlife and regional eats.", "name": "Spice House Kata", "transport": "Located within the Kata shopping street area, easily accessible on foot."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "16/2 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.7 stars | A premier vegan restaurant perched on the Kata hills, offering gluten-free and plant-based cuisine. Highly recommended are their \u0027Grilled Pineapple Tart\u0027 and \u0027Fresh Cold-Pressed Green Smoothie\u0027. Refreshing and wonderfully layered, fruity and herbal notes intertwine on the palate. Paired with stunning ocean views overlooking Karon Beach, it utterly captivates both tourists and health enthusiasts alike.", "name": "Santosa Vegan Restaurant", "transport": "Take a Tuk-Tuk along Patak Road towards the hilltop for about 5 minutes to arrive."}, {"address": "224 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 stars | A popular vegan spot near Kata Beach, specializing in plant-based burgers and acai bowls. A standout is the \u0027Hummus with Artisanal Flatbread\u0027\u2014the spread is silky, smooth, and aromatic, while the flatbread is crispy on the outside and soft on the inside, bursting with a rich wheat aroma. Loved by Western travelers and fitness enthusiasts alike.", "name": "Soul Vegan Cafe Kata", "transport": "Walk about 7 minutes along the main road from Kata Beach."}, {"address": "100/70 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 stars | A trendy, hipster-style cafe offering a rich selection of vegetarian dishes. The must-try \u0027Vegetarian Pad Thai (Pad Thai Jay)\u0027 features pleasantly chewy rice noodles stir-fried over high heat with pan-fried tofu cubes and a special tamarind sauce. Sweet, sour, slightly spicy, and balanced with crunchy bean sprouts for fantastic texture and flavor depth.", "name": "Karma Cafe Phuket", "transport": "Located on Kata Road, about a 3-minute walk from Kata Beach Night Market."}, {"address": "186/15 Koktanod Rd, Kata Beach, Phuket 83100", "feature": "\u2b50 4.8 stars | An exquisite little eatery focusing on vegan and raw plant-based dishes. A must-order is the \u0027Rainbow Summer Rolls\u0027\u2014vibrant purple cabbage, carrots, and avocado wrapped in translucent rice paper, served with a rich signature peanut dipping sauce. Incredibly crisp, juicy, sweet, and guilt-free.", "name": "Pure Vegan Magic Kata", "transport": "Take a Songthaew (shared truck) to the Kata Beach stop, then walk for about 5 minutes."}, {"address": "98/7 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 stars | A highly-acclaimed local eatery specializing in traditional vegetarian Thai cuisine. The recommended \u0027Vegetarian Thai Green Curry\u0027 perfectly blends rich coconut milk with authentic Thai herbs, paired with tender king oyster mushrooms and fresh eggplant. Silky smooth and perfect with rice, it\u0027s the top choice for lovers of authentic Thai vegetarian flavors.", "name": "Green Garden Restaurant Kata", "transport": "Only about a 4-minute walk from Kata Beach\u0027s main commercial street."}, {"address": "42/1 Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 stars | A traditional diner renowned for its wallet-friendly prices and diverse vegetarian menu. The \u0027Vegetarian Tom Yum Soup\u0027 is especially recommended\u2014simmered with authentic galangal and lemongrass, packed with wild mushrooms. Spicy, sour, yet pleasantly sweet and savory; the juicy mushrooms soaking up the flavorful broth make it a hit among backpackers.", "name": "Elephant No.9 Restaurant", "transport": "About a 6-minute walk from the southern end of Kata Beach."}, {"address": "190/19 Karon Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.3 stars | A welcoming vegetarian-friendly restaurant located in the Karon Beach area. The classic \u0027Vegetarian Pineapple Fried Rice\u0027 features sweet Thai pineapple served with fluffy, perfectly separated turmeric rice and cashews. Richly textured, fragrant, and hitting the perfect balance of sweet and savory, it keeps tourists coming back again and again.", "name": "Mai Thai Restaurant Karon", "transport": "About an 8-minute walk from Karon Circle."}, {"address": "27/10 Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 stars | An immensely popular budget eatery in Kata with custom vegan options. A must-try is the \u0027Stir-Fried Vegetarian Holy Basil Mushrooms\u0027\u2014wok-fried on high heat for a robust smoky wok hei, bursting with holy basil aroma. The mushrooms are savory, spicy, and satisfyingly springy, making it a highly recommended classic dish to pair with rice among locals and tourists.", "name": "Red Onion Kata", "transport": "Take a Phuket Songthaew and get off at the Kata Patak Road section to arrive directly."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Kata Road, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 stars | Located inside Kata Night Market, this roti stall is a popular snack spot for tourists. Made fresh to order by a skilled uncle, the dough is pan-fried on a griddle until golden and crispy, wrapped around sweet, ripe banana slices, and finished with a rich drizzle of condensed milk and chocolate sauce. The exterior is super crispy with a buttery aroma, while the filling is soft, gooey, and piping hot\u2014making it hard to stop eating. It\u0027s the most beloved walking dessert in the Kata area.", "name": "Kata Night Market Banana Roti", "transport": "About an 8-minute walk from Kata Beach, or take a Songthaew directly to the entrance of Kata Night Market."}, {"address": "Wat Suwan Khiri Khet, Patak Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 stars | Open on Tuesdays and Fridays at the Karon Temple Market, this grilled pork skewers and mango sticky rice stall always draws long lines. The freshly grilled pork skewers (Moo Ping) are marinated to perfection, yielding tender, juicy meat with rich smoky notes of lemongrass and coconut sugar. The accompanying mango sticky rice features fresh, sweet honey mangoes paired with chewy, fragrant sticky rice, topped with a rich, slightly salty coconut cream. The rich balance of sweet and savory flavors is simply amazing.", "name": "Karon Temple Market Mango Sticky Rice \u0026 Moo Ping", "transport": "Located inside the courtyard of Wat Karon (Karon Temple), about a 10-minute walk from Karon Beach Road."}, {"address": "Kata Beach Front Promenade, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.7 stars | Vendors hollow out a whole fresh coconut as a natural bowl, scooping in 2-3 balls of all-natural coconut milk ice cream, served with fresh coconut meat, crushed peanuts, and sticky rice. The ice cream is smooth and velvety, bursting with a refreshing and delicate natural coconut aroma without being overly sweet. Paired with crunchy peanuts and chewy coconut flesh, it offers rich layers of texture\u2014the ultimate cooling treat while strolling by the hot beach.", "name": "Kata Beach Coconut Ice Cream Stall", "transport": "Located mid-section along the Kata Beachfront Promenade, easily accessible on foot along the beach path."}, {"address": "Beach Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 stars | Liquid fresh milk is \u0027stir-fried\u0027 into delicious ice cream rolls right before your eyes on a sub-zero cold plate, making the process highly entertaining to watch. Guests can choose toppings like mango, passion fruit, or Oreo, which are deftly flattened and rolled up into pretty ice cream rolls. It has a dense yet fine texture that melts instantly in your mouth, combining fresh fruit tartness with rich milky flavor. A treat for both the eyes and taste buds, especially popular among young travelers.", "name": "Karon Plaza Thai Rolled Ice Cream", "transport": "Located along the walkway inside Karon Plaza shopping area, near Karon Beach Road."}, {"address": "Khok Tanod Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.3 stars | Specializing in freshly grilled giant prawns, squid skewers, and grilled fish, continuously brushed with a signature Thai hot and sour sauce over charcoal. The squid is chewy, sweet, and succulent, while the prawns are firm and juicy with a lightly charred aroma. Paired with a spicy green Thai seafood dipping sauce, the tangy and fiery flavor instantly awakens your taste buds\u2014an addictive snack while exploring Kata at night.", "name": "Kata Walking Street Seafood Skewers", "transport": "Located on Khok Tanod Walking Street in Kata, about a 5-minute walk from the southern end of Kata Beach."}, {"address": "Karon Beach Front Road, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.5 stars | This street stall is famous for freshly blended pure fruit shakes and authentic Thai milk tea. The popular ChaTraMue Thai Milk Tea is served with crushed ice and condensed milk, offering a rich tea flavor that is smoothly sweet without being overwhelming. The mango and passion fruit shakes contain no added sugar syrup, delivering the pure sweet and tangy taste of real fruit in a fine slush\u2014the ultimate thirst quencher after sunbathing on the beach.", "name": "Karon Beach Fruit Shake \u0026 Thai Milk Tea Stall", "transport": "Located along the Karon Beachfront Road promenade; you can spot the small cart while strolling along the beach path."}, {"address": "Kata Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.6 stars | This street noodle stall has been operating locally for years, loved by locals and seasoned travelers alike. The signature Thai boat noodle broth is simmered for hours with pork bones and aromatic spices, resulting in a rich, sweet broth infused with basil aroma. The rice noodles absorb the savory broth while staying springy and smooth, paired with tender sliced meat and handmade beef balls. Add chili powder and fish sauce to taste for an authentic Thai street food experience.", "name": "Kata Center Thai Noodle Soup Stall", "transport": "Located along the main road in Kata Center, near Kata Palm Resort."}, {"address": "Beach Rd, Karon, Mueang Phuket District, Phuket 83100", "feature": "\u2b50 4.4 stars | Khanom Krok, a traditional Thai coconut pancake snack, is freshly made in a custom griddle pan with circular molds. Crispy and golden on the outside with a creamy, semi-liquid coconut pudding inside, it bursts with flavor in one bite. Warm, aromatic coconut sweetness balances with a touch of saltiness, often topped with green onions or corn kernels for extra flavor\u2014a truly authentic traditional snack to enjoy on the go.", "name": "Karon Bazaar Khanom Krok Stall", "transport": "Located at the entrance of Karon Bazaar, easily reachable by Songthaew or on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Kata and Karon Beach Area"}, "mai_khao": {"categories": {"cat_1": {"items": [{"address": "57/7 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | A legendary eatery in Mai Khao recommended by the Michelin Bib Gourmand! Famous for its ultra-fresh local wild seafood and authentic Southern Thai cuisine. The must-try \u0027Sour and Spicy Fish Yellow Curry\u0027 features a tangy, fiery broth and tender, silky fish; the \u0027Sea Grape Salad\u0027 and \u0027Stir-fried Sea Bamboo Shoots with Garlic\u0027 are delightfully crunchy and bursting with sweet coastal flavor. Foodies and locals alike love how it preserves the purest rustic, vintage flavors alongside the unpretentious warmth of a seaside stall.", "name": "Ta Tuay Restaurant", "transport": "About a 10-minute drive from Mai Khao Beach, or a 15-minute taxi ride from Phuket International Airport."}, {"address": "71/6 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | Tucked away in the lush village of Mai Khao, Kin-Dee translates to \u0027eat well\u0027 in Thai. The signature \u0027Simmered Shrimp in Coconut Milk\u0027 is rich and smooth, perfectly blending coconut fragrance with fresh shrimp; the \u0027Stir-fried Minced Pork with Lemongrass\u0027 offers complex layers of herb aromas and subtle spiciness. Emphasizing traditional, made-to-order cooking methods, its unpretentious dining environment makes you feel like a guest at a warm, traditional Thai family table.", "name": "Kin-Dee Restaurant", "transport": "Only about a 5-minute drive from Marriott\u0027s Mai Khao Beach Resort. Renting a scooter or taking a private charter is recommended."}, {"address": "14/2 Moo 2, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 Stars | A decades-old seafood landmark situated near Sarasin Bridge at the northern tip of Mai Khao. Renowned for live seafood delivered daily by local fishermen, their signature \u0027Steamed Flower Crab\u0027 features sweet, firm meat, while the \u0027Stir-fried Black Pepper Lobster\u0027 is rich, savory, and juicy. Savoring authentic Phuket-style seafood while watching the sunset over Phang Nga Bay makes this a top choice for tourists and local family gatherings alike.", "name": "Thanoon Seafood", "transport": "Located along Route 402 right next to the cross-sea bridge, about a 20-minute drive from the airport."}, {"address": "Nai Yang Beach, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 Stars | A famous classic spot on the beachfront of Nai Yang Beach (right next to the airport area). The \u0027Yellow Curry Crab with Stir-fried Eggs\u0027 is creamy and rich, thoroughly infused with sweet crab flavor; the \u0027Thai Spicy Grilled Fish\u0027 has crisp skin and juicy meat, perfectly paired with the house-made lime seafood dipping sauce for an irresistible zesty bite. Stepping onto the sand to enjoy the ocean breeze and classic Thai dishes embodies Phuket\u0027s most relaxing old-school romance.", "name": "Phen\u0027s Restaurant", "transport": "About a 15-minute walk or a 3-minute drive from Phuket Airport to the Nai Yang beachfront."}, {"address": "22/5 Moo 1, Nai Yang Road, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.1 Stars | A beloved traditional stir-fry joint near the airport, popular among locals. Famous for generous portions and authentic Southern Phuket home-style cooking. The \u0027Stir-fried Stink Beans with Shrimp and Shrimp Paste\u0027 packs a bold aroma, perfectly balancing crunchy stink beans with sweet and spicy shrimp; the \u0027Pad Krapow Pork Rice\u0027 is brimming with wok hei and fiery flavor. Its simple open-air tin-roof setting offers an authentic local vibe, with affordable prices making it a crowd favorite.", "name": "Krua Song Pi Nong", "transport": "About a 5-minute drive from the Phuket International Airport terminal, perfect for a hearty meal before or after your flight."}, {"address": "112/5 Moo 1, Route 4026, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 Stars | A multi-generational eatery specializing in Northern and Isan (Northeastern) Thai flavors, famous for pounding green papaya salads live in traditional wooden mortars (Krok). The signature \u0027Salted Egg Som Tum\u0027 hits the ultimate balance of sweet, sour, spicy, and salty with extra crispy papaya; the \u0027Isan Grilled Pork Neck\u0027 is charred outside, tender inside, juicy and smoky. It draws endless food lovers straight off their flights to experience the explosive thrills of authentic Thai street-style zesty sauces.", "name": "Somtum 3 Krok Airport", "transport": "Located along Route 4026, the main airport road, about a 4-minute Tuk-Tuk ride from the airport."}, {"address": "Moo 4, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | A hidden gem of a traditional restaurant known to in-the-know foodies around Mai Khao. The must-order \u0027Stir-fried Chicken with Cashew Nuts\u0027 features tender chicken coated in sweet savory sauce with crunchy cashews; the \u0027Tom Yum Seafood Soup\u0027 is slow-simmered in traditional clay pots, releasing intense lemongrass and kaffir lime aromas into a rich, savory broth. The owner insists on local fresh ingredients and ancient seasoning methods, serving nostalgic flavors filled with passion.", "name": "Krua Pae San", "transport": "About an 8-minute drive from Southern Mai Khao or the airport."}, {"address": "201/3 Moo 1, Route 4026, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 Stars | A long-standing duck noodle institution in the airport area. Their signature \u0027Herbal Braised Duck Noodles\u0027 boasts a rich, sweet broth laced with subtle Chinese herbs and star anise; the duck is braised for hours until tender and flavorful, paired with springy noodles and secret chili sauce that keeps customers coming back. A beloved classic for local airport staff and visitors alike.", "name": "Heng Heng Duck Noodle Airport", "transport": "Located on the main road just 1.5 km from the airport exit, about a 3-minute drive."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "889 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | A classic brunch destination located inside Turtle Village Shopping Center in Mai Khao. The stylish wooden decor creates an immensely relaxing atmosphere. Highlights include Eggs Benedict paired with freshly grated Parmesan and rich hollandaise sauce on crispy yet tender sourdough, alongside a signature Australian-style Flat White featuring silky smooth foam and a rich nutty aroma. A favorite spot for tourists and vacationers looking to enjoy a leisurely morning in the sunshine.", "name": "The Coffee Club - Turtle Village Mai Khao", "transport": "Within walking or cycling distance to Turtle Village Shopping Center from major resorts in Mai Khao Beach."}, {"address": "333 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | A luxurious, minimalist white-themed cafe situated right on the beachfront of Mai Khao, offering stunning ocean and pool views. The popular Acai Bowl is served with fresh tropical fruit and house-baked granola, offering a refreshing and healthy option. Hand-drip coffee features single-origin beans selected from Chiang Rai in Northern Thailand, delivering bright citrus and floral notes. This stylishly designed space is a hit for influencers and travelers looking for picture-perfect moments.", "name": "SALA Phuket Beach Restaurant \u0026 Cafe", "transport": "Take a taxi or hotel shuttle along Mai Khao Beach Road directly to SALA Phuket Resort."}, {"address": "153 Moo 4, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | A hidden gem nestled in a lush rubber tree forest between the airport and Mai Khao area, offering a quiet environment like a natural forest oxygen bar. A must-try is the \u0027Thai Coconut Cold Brew\u0027, blending freshly carved coconut water with espresso for a naturally sweet beverage with subtle coconut fragrance; pair it with a freshly baked French croissant that is crispy outside and tender with distinct layers inside. Highly favored by independent travelers and local hipsters looking to escape the hustle and bustle.", "name": "Hideaway Cafe Phuket", "transport": "Self-driving is recommended, or take a Songthaew/taxi for about 10 minutes from Phuket International Airport."}, {"address": "142 Moo 1, Nai Yang Beach, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | An oceanfront cafe located right where the Phuket Airport runway meets Nai Yang Beach. The main attraction here is savoring an iced latte and Thai tea toast while watching airplanes descend low right before your eyes. The signature \u0027Thai Herb Brunch Platter\u0027 includes sausages, sunny-side-up eggs, and special Thai herb spread toast, offering a savory, aromatic, and flavor-packed start to the day.", "name": "Phen\u0027s Restaurant Bar \u0026 Coffee", "transport": "About a 15-minute walk along the beach path from Phuket International Airport, or a 5-minute Tuk-Tuk ride."}, {"address": "108/1 Moo 1, Nai Yang Beach, Mai Khao Area, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | A sea-view brunch cafe next to the national park beach, boasting unbeatable sunset and coastal views. The signature \u0027Avocado Poached Egg Toast\u0027 features rich avocado puree topped with a poached egg\u2014cutting into the runny yolk coats the crispy toast in creamy goodness. Pair it with a freshly blended mango passion fruit smoothie or a special Dirty Coffee for an amazing hot-and-cold taste experience.", "name": "Sea Almond Chill \u0026 Dine Cafe", "transport": "About an 8-minute drive along the coastal road from the southern end of Mai Khao Beach."}, {"address": "Mai Khao Beach Plane Spotting Area, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 stars | A unique open-air brunch stall located near the airplane takeoff and landing spot on Mai Khao Beach. Specializing in fresh fruit smoothies and freshly ground custom iced coffee. The piping hot \u0027Thai Coconut Waffle\u0027 comes topped with rich coconut cream and fresh coconut meat\u2014crispy outside, chewy inside, and perfectly sweet without being overwhelming. Visitors can watch planes roar overhead right from the sand while enjoying delicious snacks\u2014a double delight for sight and taste.", "name": "Plane Spotting Beachside Cafe", "transport": "Drive to Sirinat National Park parking lot, then transfer to a local beach motorcycle shuttle or walk to the venue."}, {"address": "888 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 stars | An elegant coffee corner located inside a luxury resort in Mai Khao, serving top-tier specialty baked goods and coffee. Highly recommended is the \u0027Pandan Layer Cake\u0027 paired with a custom \u0027Caramel Macchiato\u0027; the crepe cake is silky smooth with a natural pandan-taro aroma that perfectly balances the rich, bittersweet coffee. The exquisite garden setting gives every visitor a delightful sense of vacation luxury.", "name": "Anantara Mai Khao Coffee \u0026 Pastry Corner", "transport": "Located in the lobby area of Anantara Mai Khao Resort, about a 3-minute walk from Turtle Village Shopping Center."}, {"address": "211/9 Moo 6, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | A popular trendy bakery cafe in Mai Khao near the airport, filled with the rich aroma of freshly roasted coffee beans. Must-orders are the \u0027Smoked Salmon Sour Cream French Baguette\u0027 and \u0027Cold Brew Coffee\u0027. The baguette is hearty and chewy, perfectly balanced with tangy sour cream and savory smoked salmon. The cold brew, slow-dripped over 12 hours, is remarkably smooth with dark chocolate undertones\u2014making it the perfect energy pitstop before boarding or right after arriving in Phuket.", "name": "Coffee Tribe Cafe \u0026 Bakery Phuket Airport", "transport": "About a 3-minute drive from Phuket International Airport terminals; accessible by foot or taxi."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "57/7 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | A local legendary eatery recognized by the Michelin Bib Gourmand, specializing in authentic Southern Phuket cuisine and fresh seafood. Must-try dishes include sea worms and aromatic hot \u0026 sour seafood soup; the fish is tender and springy, while Southern Thailand\u0027s signature spicy sauces explode on the tongue with rich, layered textures. The welcoming, natural garden setting keeps locals and food lovers coming back for more.", "name": "Ta Tuay Restaurant", "transport": "It is recommended to take a taxi or drive a rental car from Phuket International Airport; the journey takes about 15 minutes."}, {"address": "71/6 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | A cozy, rustic local restaurant tucked away near the Mai Khao mangroves. Using daily fresh catches and local organic herbs, their signature Southern Thai yellow curry fish is rich and fiery, while the coconut milk seafood is smooth, sweet, and melts in your mouth. The relaxed outdoor atmosphere and authentic Phuket home-cooked flavors draw tourists seeking genuine local eats.", "name": "Kin-Dee Restaurant", "transport": "About a 5-minute drive from Mai Khao Beach; riding a Tuk-Tuk or driving yourself is recommended."}, {"address": "555 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 Stars | A premier Southern Thai specialty bistro located inside Renaissance Phuket Resort \u0026 Spa, offering unbeatable ocean sunset views. Signature dishes like lemongrass stir-fried shrimp and Southern Thai yellow curry crab are mildly spicy with a touch of sweetness; the crab meat is plump and juicy. Paired with handcrafted Thai tropical cocktails, it provides an ultimate feast for both eyes and palate, highly praised by discerning travelers.", "name": "Takieng Thai Restaurant (Renaissance Phuket Resort \u0026 Spa)", "transport": "Located inside Renaissance Phuket Resort \u0026 Spa on Mai Khao Beach; accessible via hotel shuttle or taxi."}, {"address": "888 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | An exquisite seafood grill and bar at Anantara Mai Khao Phuket Villas, specializing in live charcoal-grilled premium seafood and steaks. The aged steaks are crispy outside and tender inside, while the seafood platters burst with rich smoky aromas and juicy textures. Paired with a unique volcanic salt tasting and ocean breezes, it creates a romantic, luxurious dining experience.", "name": "Sea.Fire.Salt. Grill \u0026 Bar (Anantara Mai Khao)", "transport": "Located inside Anantara Mai Khao Phuket Villas, about a 15-minute taxi ride from the airport."}, {"address": "46/6 Moo 3, Thep Krasattri, Thalang District, Phuket 83110", "feature": "\u2b50 4.8 Stars | A wood-fired farm-to-table restaurant near the airport and Mai Khao area, championing green-star sustainability concepts. Adhering strictly to farm-to-table dining, all ingredients come from their own organic farm. Open-fire grilled local vegetables and fresh fish feature a captivating smoky aroma, complemented by stunning multi-layered sweet-and-sour sauces\u2014a hidden gem highly recommended by modern gourmets.", "name": "JAMPA Restaurant", "transport": "About a 10-minute drive from Phuket International Airport; taking a Grab or hiring a private car is recommended."}, {"address": "Turtle Village 889 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | A lively exotic grill and bar located inside Turtle Village at Mai Khao Beach. It serves freshly baked pizzas, charcoal-grilled ribs, and authentic local snacks combining Thai and Western styles. The ribs are melt-in-your-mouth tender with a sweet-and-savory custom sauce. Accompanied by craft beer and live music in the evening, its joyful ambiance is a hit with tourists.", "name": "Mamma Mia Grill \u0026 Bar Mai Khao", "transport": "Located inside Turtle Village Shopping Center in Mai Khao; major hotels in the Mai Khao area usually provide scheduled direct shuttle buses."}, {"address": "112 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 Stars | A long-standing local seafood bistro located beside Sarasin Bridge at the northern tip of Mai Khao. Known for freshly caught live seafood and authentic Southern Thai hot \u0026 sour fish soup; the prawns are firm and snappy, served with Southern Thailand\u0027s unique tamarind dipping sauce that stimulates the palate. Sitting by the shore enjoying local flavors while watching the sunset over the bridge makes this a top secret spot for locals.", "name": "Sarasin Seafood Restaurant", "transport": "Located at the foot of Sarasin Bridge at the northernmost tip of Phuket Island; driving a rental car or hiring a private vehicle is recommended."}, {"address": "22/8 Moo 6, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | An authentic Southern Thai eatery highly recommended by locals near Phuket Airport. Famous for its signature Southern Thai sour curry (Kang Som), the broth is richly spiced, perfectly zesty, and fiery. Served with freshly deep-fried, golden turmeric fish\u2014crispy outside and tender inside\u2014it goes amazingly well with rice, drawing countless foodies right after stepping off their flight.", "name": "Heng Heng Kang Som Restaurant", "transport": "About a 5-minute drive from Phuket International Airport, making it ideal to visit via taxi right after landing or before departing."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "71/6 Moo 5, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | Located near Mai Khao Beach, Kin Dee is renowned for promoting organic, locally sourced ingredients, offering a wide variety of traditional meat-free, dairy-free, and egg-free Thai vegetarian dishes. Highly recommended is their \u0027Vegan Thai Green Curry\u0027, slow-cooked with fresh herbs from local organic farms and rich coconut milk. Poured over steaming fragrant rice, the sauce is smooth, rich, and mildly spicy\u2014a favorite among health-conscious travelers and vegans alike.", "name": "Kin Dee Restaurant", "transport": "Recommended to take a taxi for about 15 minutes from Phuket International Airport, or ride a rental scooter along Route 402."}, {"address": "116 Moo 1, Nai Yang Beach, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | Housed in a striking black mansion inside a luxury resort at Nai Yang Beach (near the airport), this Michelin-recommended restaurant features a complete \u0027Gourmet Vegan Thai Menu\u0027. A must-try is the \u0027Vegan Pad Thai\u0027, stir-fried over high heat to achieve incredible wok hei (breath of the wok). The noodles are springy and tender, paired with crispy tofu cubes and freshly ground peanuts for a wonderfully textured, perfectly balanced sweet-and-sour taste\u2014a top-tier experience where luxury romance meets traditional Thai plant-based cuisine.", "name": "Black Ginger at The Slate", "transport": "Just about a 10-minute drive from Phuket International Airport. Accessible by booking a resort shuttle or taking a taxi."}, {"address": "555 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 Stars | Front-row luxury dining on Mai Khao Beach with front-and-center sunset views, offering a rich and high-quality vegetarian and vegan menu. The \u0027Vegan Phad Kra Pao\u0027 is outstanding, combining natural plant protein with fresh holy basil, chili, and garlic stir-fried over high heat. It delivers a captivating spicy aroma and satisfyingly chewy texture. Enjoying it with the ocean breeze and sunset glow makes for a dual feast for the palate and eyes.", "name": "Takieng at Renaissance Phuket Resort \u0026 Spa", "transport": "Located inside the Renaissance Phuket Resort \u0026 Spa on Mai Khao Beach, about 15 minutes by car from the airport. Taxis or private transfers are recommended."}, {"address": "211/3 Moo 6, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | Located just a few minutes\u0027 drive from the airport, this affordable traditional Jay Food (Thai Buddhist Vegetarian) restaurant is a beloved staple for locals and tourists alike. Their signature dish is \u0027Stir-fried Crispy Vegan Meat with Chinese Broccoli\u0027, featuring soy protein pan-fried until golden and crunchy, then stir-fried with tender Chinese broccoli. Crispy, juicy, and non-greasy, it offers an authentic local Thai vegetarian taste at a very budget-friendly price.", "name": "Heng Heng Vegetarian Restaurant Airport", "transport": "About a 12-minute walk from Phuket International Airport terminal, or a 3-minute ride by motorbike taxi."}, {"address": "888 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | An oceanfront international restaurant located inside the luxury Anantara Mai Khao Resort, crafting special \u0027Himalayan Salt Block Vegan Creations\u0027 for plant-based food lovers. A popular choice is the \u0027Grilled Organic Wild Mushrooms with Sesame Sauce\u0027, where wild mushrooms are lightly seared on a heated salt block, releasing rich earthy aromas and a natural savory touch. Paired with smooth sesame sauce, it creates an immensely elegant and refined dish.", "name": "Sea.Fire.Salt at Anantara Mai Khao Phuket Resort", "transport": "About a 15-20 minute drive from the airport, located inside Anantara Mai Khao Phuket Resort. Taking a taxi is recommended."}, {"address": "Turtle Village, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | A cozy restaurant located near Turtle Village offering customized vegan and onion/garlic-free dishes. A must-try is the \u0027Vegan Massaman Curry\u0027, blending rich pine nut and peanut aromas into coconut milk curry. Soft stewed potatoes and tender organic tofu melt in your mouth, bathed in a richly layered sauce that tastes heavenly over jasmine rice.", "name": "Sawasdee Restaurant \u0026 Bar Mai Khao", "transport": "Located around Turtle Village in the Mai Khao Beach area, within walking distance from nearby resorts and about 15 minutes from the airport."}, {"address": "117 Moo 1, Nai Yang Beach, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 Stars | An oceanfront restaurant located on the edge of Nai Yang Beach, popular among health-conscious Western travelers. Their signature \u0027Vegan Acai \u0026 Fruit Bowl\u0027 is topped with freshly sliced mango, dragon fruit, and shredded coconut over a rich, chilled acai base. Slightly sweet and pleasantly tangy, it is ultra-refreshing in warm weather\u2014the perfect guilt-free treat while relaxing by the sea.", "name": "Phen\u0027s Restaurant Buritara Nai Yang", "transport": "Situated along the beachfront road of Nai Yang Beach, just an 8-10 minute drive from Phuket International Airport."}, {"address": "231 Moo 3, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | An elegant and grand casual lounge inside the JW Marriott Resort, serving high-quality plant-based light bites and raw vegan desserts. Highly recommended is the \u0027Raw Vegan Dark Chocolate Tart\u0027, featuring a crust made from nuts and coconut oil filled with smooth, bittersweet raw vegan dark chocolate. Rich, silky, and melting seamlessly on the tongue without any heavy feeling, it is a premier choice for a luxurious afternoon teatime.", "name": "The Lounge at JW Marriott Phuket Resort \u0026 Spa", "transport": "About a 15-minute drive from Phuket International Airport, located inside the main building of JW Marriott Phuket Resort."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "82 Moo 1, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | Located in the Nai Yang Temple Night Market, this charcoal-grilled chicken skewer stall is a top favorite among locals and tourists alike. Marinated extensively with lemongrass, garlic, and Thai soy sauce, the chicken is grilled over charcoal until golden brown with a slight char, while remaining juicy and firm. Every bite bursts with smoky, sweet, and savory flavors. Paired with their homemade spicy and sour dipping sauce \u0027Nam Jim Jaew\u0027, it\u0027s addictively delicious.", "name": "Nai Yang Market Thai Grilled Chicken \u0026 Skewers Stall", "transport": "About a 5-minute taxi ride from Phuket International Airport, or a 10-minute walk from Nai Yang Beach."}, {"address": "Mai Khao Beach Road, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Extremely popular in the Mai Khao community, this roti cart serves up made-to-order pancakes grilled on a griddle until golden and crispy. Stuffed with sliced fresh bananas and drizzled with rich condensed milk and chocolate syrup, the outer layer is super crispy while the inside is warm and soft. The natural sweetness of the banana blends perfectly with the creamy condensed milk\u2014a must-try stroll dessert when visiting Mai Khao Beach.", "name": "Mai Khao Traditional Banana Roti Cart", "transport": "About a 5-minute Tuk-Tuk ride from Mai Khao Beach area hotels, or accessible by walking along the main beach road."}, {"address": "Nai Yang Beach Front Road, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | Served in a freshly halved coconut shell, this stall fills your bowl with rich, smooth pure coconut milk ice cream topped with crunchy roasted peanuts, sticky rice, and sweet corn. The ice cream melts in your mouth with a pure coconut aroma and subtle milky sweetness. Combined with crunchy peanuts and chewy sticky rice, it offers delightfully rich textures\u2014a super refreshing treat by the hot beach.", "name": "Nai Yang Beach Coconut Ice Cream Stall", "transport": "Located along the Nai Yang Beach boardwalk; about a 6-minute drive from Phuket International Airport via Route 4031."}, {"address": "4031 Road, Near Phuket International Airport, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | \u0027Khanom Krok\u0027 is a classic Thai traditional street snack. Located near the airport access road, this small stall uses special iron molds to bake these treats until the crust is golden and crispy, while the filling remains gooey and rich with coconut cream, topped with chopped scallions or sweet corn kernels. Served hot, they are crispy on the outside and soft on the inside, bursting with a sweet-savory coconut flavor loved by both locals and visitors.", "name": "Airport Road Khanom Krok Stall", "transport": "About an 8-minute walk from the Phuket International Airport terminal, or a 2-minute taxi ride."}, {"address": "Soi Mai Khao 6, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | This mobile food cart converted from a motorbike specializes in Northeastern-style (Isan) green papaya salad (Som Tum) and golden fried chicken. The shredded green papaya is unbelievably crisp, pounded fresh in a mortar to fully absorb lime juice, fish sauce, and chilies for a tantalizing spicy-sour flavor. Paired with fresh fried chicken legs that are ultra-crispy outside and tender-juicy inside, alternating bites of refreshing papaya salad and hot fried chicken creates the ultimate Thai street food combination.", "name": "Mai Khao Som Tum \u0026 Fried Chicken Cart", "transport": "About a 5-minute drive from JW Marriott Phuket Resort \u0026 Spa in Mai Khao."}, {"address": "Nai Yang Evening Market, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 stars | Operating for many years, this stall specializes in freshly fried Thai fish cakes (Tod Mun Pla) and squid balls. The fish cakes are blended with red curry paste and sliced kaffir lime leaves, fried to a bouncy golden perfection that carries a delightful herbal aroma and a gentle kick of spice. Served with a sweet-chili cucumber dipping sauce, the crisp cucumber cuts through the richness, making it an ideal grab-and-go snack while strolling the night market.", "name": "Nai Yang Night Market Tod Mun Pla \u0026 Squid Ball Stall", "transport": "About a 5-minute walk from the entrance of Sirinat (Nai Yang) National Park to the night market area."}, {"address": "Mai Khao Beach Front Trail, Mai Khao, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 stars | The owner handpicks ripe local honey mangoes daily, which are sliced into melt-in-your-mouth juicy sweet pieces. Served alongside warm sticky rice steamed in rich coconut milk, drizzled with sweet-salty coconut cream, and topped with crispy mung beans. The harmonious blend of sweet, salty, and tropical fruit flavors makes this a dream dessert for anyone visiting Mai Khao.", "name": "Mai Khao Fresh Fruit Smoothie \u0026 Mango Sticky Rice Cart", "transport": "Located along the Mai Khao Beachfront Trail, easily accessible on foot from major beach resorts."}, {"address": "65/1 Moo 1, Nai Yang Beach, Sakhu, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | A highly popular beachside seafood stall offering freshly grilled cuttlefish and seafood skewers. Quick-roasted over high-heat charcoal, the squid is irresistibly tender and bouncy with a subtle smoky aroma and ocean sweetness. Their signature green Thai seafood sauce \u0027Nam Jim Seafood\u0027\u2014made with green chilies, lime juice, and garlic\u2014delivers a punchy, tangy spice that elevates the seafood flavor.", "name": "Nai Yang Beach Grilled Squid \u0026 Seafood Skewers Stall", "transport": "Located next to the pine forest path along Nai Yang Beach; about a 7-minute taxi ride from Phuket International Airport."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Mai Khao Beach and Airport Area"}, "patong": {"categories": {"cat_1": {"items": [{"address": "188 Rat-U-Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | The #1 long-standing, budget-friendly traditional Thai restaurant in Patong Beach, highly popular among both global tourists and locals. The signature Pad Thai is delightfully chewy and packed with rich wok hei, with sweet and savory sauce coating every noodle. The stir-fried basil pork rice (Pad Kra Pao) is spicy and aromatic, perfectly complemented by a sunny-side-up egg. Sticking to home-style recipes and affordable prices for decades, this is a must-visit spot in Patong.", "name": "No.6 Restaurant", "transport": "About a 5-minute walk from Bangla Road (Patong Night Market)."}, {"address": "58 Phra Barami Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | A decades-old traditional Southern Thai restaurant located on the quiet outskirts of Patong, far from the noisy main strip. It is a hidden gem favored by local Thai families and seasoned food lovers. The rich yellow curry crab features large, sweet chunks of crab meat infused with coconut milk and intense Southern Thai spices. The Tom Yum Goong is authentically sour and spicy, loaded generously with mushrooms and fresh prawns. The atmosphere is warm, friendly, and deeply local.", "name": "Kaab Gluay Restaurant", "transport": "Recommended to take a taxi or Tuk-Tuk for about 5 minutes from the Patong Songthaew bus terminal."}, {"address": "143/6 Rat-U-Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.2 stars | The most legendary traditional Hainanese chicken rice shop in Patong, drawing crowds of foodies every morning. Fresh, high-quality chicken is slow-cooked with aromatic herbs and broth, resulting in ultra-tender meat with a delicate chicken jelly layer. The signature chicken rice features distinct, fragrant grains infused with garlic and chicken essence. Paired with house-made black bean sauce and chili sauce, it offers a rich and delicious taste that has remained unchanged for decades.", "name": "Briley Chicken Rice", "transport": "Located on the main Rat-U-Thit Road, about an 8-minute walk from Jungceylon Shopping Center."}, {"address": "135/23 Rat-U-Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.1 stars | A well-established classic family-style Thai diner known for its exceptional value and authentic traditional Thai flavors. The green curry chicken is rich and smooth with aromatic lemongrass and Thai basil, featuring tender chicken that absorbs all the rich sauce. The pineapple fried rice is served inside a whole pineapple, light and fluffy with cashews and pork floss adding delightful textures. Fast service and a lively vibe make it a classic Patong favorite.", "name": "Dang Restaurant", "transport": "Located in the commercial area near Bangla Road, about a 6-minute walk away."}, {"address": "136 Thaweewong Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.2 stars | One of the most historically iconic seafood restaurants along Patong Beach, maintaining high standards of traditional seafood cooking since the 1980s. The popular signature grilled garlic and pepper lobster features firm, succulent meat rich with butter and black pepper aromas; the steamed lemon seabass is incredibly fresh and tender, with tangy lemon juice and chili highlighting the natural sweetness of the fish. Live seafood tanks let diners choose their own fresh catch.", "name": "Savoey Seafood Restaurant", "transport": "Walkable along Patong Beach Road (Thaweewong Rd), right next to the beach area."}, {"address": "130 Thaweewong Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.0 stars | The first traditional seafood restaurant established on Patong Beach, serving as a pioneer landmark in local dining. The restaurant uses daily catches straight from local fishermen, highlighting natural flavors through traditional Thai spices and charcoal grilling. The signature grilled king prawns are sweet, juicy, and rich in roe, while the Thai crab in curry sauce is thick, spicy, and perfectly paired with rice. Fronting stunning ocean views, it delivers a rich tropical resort vibe.", "name": "Patong Seafood Restaurant", "transport": "Located in the central section of Patong Beach Road, about a 3-minute walk from Bangla Road along the beach road."}, {"address": "205/7 Rat-U-Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | A highly recommended traditional Thai and seafood restaurant in Patong, famous for its friendly service and time-honored recipes. The papaya salad (Som Tum) is crisp and juicy, masterfully balancing sour, spicy, sweet, and salty flavors with fragrant peanuts and dried shrimp. The grilled lemongrass fish features golden, crispy skin and tender, juicy meat inside. Generous portions and traditional tropical flavors make it a top dining choice for locals and regulars alike.", "name": "No.9 2nd Restaurant", "transport": "Easily accessible by walking along Phra Mettha Rd or Rat-U-Thit Rd."}, {"address": "322 Phra Barami Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | A traditional Southern Thai seafood spot perched on the rocky cliffs by Kalim Beach on the edge of Patong. Diners can sit on traditional wooden floors while taking in sweeping views of Patong Bay. The signature spicy grilled whole fish is covered in fresh Thai herbs, offering tender meat with a subtle charcoal aroma. The deep-fried shrimp cakes are firm and bouncy, filled with real shrimp meat in every bite. Rustic wooden vibes and unbeatable sea views make this local classic highly acclaimed.", "name": "Kalim Rim Lay Restaurant", "transport": "About a 3 to 5-minute drive north along Phra Barami Rd from the northern end of Patong Beach."}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "120/1 Thaweewong Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | Located along Patong Beach, this minimalist wooden-style cafe is a highly rated local favorite for brunch. The signature Eggs Benedict features crispy smoked bacon and rich homemade hollandaise sauce, perfectly oozing with golden egg yolk for an unbelievably silky texture. Their lattes are brewed from premium Southern Thai coffee beans, creating a finely velvety milk foam with rich nutty undertones. Enjoying a fresh smoothie bowl on the outdoor terrace while soaking in the gentle sea breeze and warm sunlight offers an indulgent vacation vibe, drawing countless photo-loving tourists and early risers.", "name": "Hern Coffee and Bistro", "transport": "Located on Thaweewong Road (Patong Beach Road), about a 3-minute walk from the central Patong Beach area."}, {"address": "Jungceylon Shopping Center, Unit 1105, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | Nestled inside Patong\u0027s bustling Jungceylon Shopping Center, this spot serves Australian-style all-day brunch and high-quality coffee. The hugely popular \u0027The Big Breakfast\u0027 comes in a generous portion, including pan-seared sausages, juicy grilled tomatoes, golden hash browns, and extra crispy French toast, offering rich, multi-layered flavors. Their cold brew is extracted slowly at low temperatures, leaving a smooth, sweet aftertaste with subtle cocoa notes. With comfortable air conditioning and spacious sofa seating, it is an ideal spot to recharge before shopping or escape the afternoon sun.", "name": "The Coffee Club - Jungceylon", "transport": "Located along the street side on the 1st floor of Jungceylon Shopping Center. Take a Tuk-Tuk or Songthaew and get off at Jungceylon station."}, {"address": "20/4 Phrabaramee Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.7 stars | A cozy, hipster-style cafe in northern Patong, well-known among coffee lovers for its freshly made Acai Bowls and specialty hand-drip coffee. The signature Acai Bowl is generously topped with freshly sliced bananas, strawberries, coconut flakes, and homemade toasted granola, delivering a refreshing, ice-cream-like texture that is light and guilt-free. The cafe meticulously selects high-altitude Arabica beans from Chiang Rai, Thailand, producing hand-drip coffee with bright floral and fruity acidity and a clean, sweet finish. With chic minimalist white decor and warm, welcoming service, it has become a go-to morning spot for many international travelers.", "name": "Awaken Cafe Patong", "transport": "About an 8-minute walk along Phrabaramee Road from the north end of Patong Beach, or a 3-minute taxi ride."}, {"address": "186/3 Rat U Thit 200 Pee Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.8 stars | Dedicated to exceptional coffee quality, this professional self-roasting specialty cafe is a sacred spot for local coffee connoisseurs in Patong. The menu offers a variety of single-origin beans and signature Dirty Coffee; the richness of warm milk blends seamlessly with intense espresso, creating striking visual and taste contrasts of bittersweet layers. Pair it with a freshly baked butter croissant\u2014crispy and golden on the outside with an airy, flaky interior bursting with rich buttery aroma. Its sleek, modern minimalism provides a peaceful retreat from Patong\u0027s lively hustle.", "name": "Coffee Manifesto Patong", "transport": "Located on Rat U Thit 200 Pee Road (Patong 2nd Road), about a 5-minute walk from Jungceylon Shopping Center."}, {"address": "101 Rat U Thit 200 Pee Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | Combining trendy industrial style with lush tropical
