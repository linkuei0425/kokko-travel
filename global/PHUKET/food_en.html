        const db = {"bangtao_laguna": {"categories": {"cat_1": {"items": [{"address": "Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | This decades-old Halal roti shop is the top choice for breakfast and late-night snacks among locals and in-the-know travelers. Freshly made wheat dough is cooked on a flat-top grill until golden and crispy, featuring an extraordinarily flaky exterior while retaining a chewy, aromatic bite inside. Whether you choose the classic sweet roti drizzled with sweet condensed milk and banana, or the savory roti served with rich and spicy Southern Thai curry sauce, the delicious buttery aroma and irresistible crunch will keep you coming back for more. Pair it with an authentic Thai iced tea for the ultimate local experience.", "name": "Roti Taek Cherngtalay (Bangtao Traditional Roti)", "transport": "About a 5-minute Tuk-Tuk ride from the entrance of Laguna Resort."}, {"address": "177/38 Moo 1, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | A decades-old Thai-Chinese institution famous for its rich herbal duck noodle soup. The owner slow-simmers fresh ducks daily with a secret blend of Chinese herbs until the meat is melt-in-your-mouth soft without any gamey flavor. Choose between thin rice noodles or chewy Thai egg noodles that soak up the rich, sweet, and subtly spiced broth. Loved by local families and vacationers alike, it\u0027s usually packed during lunchtime.", "name": "Goy Duck Noodle Cherngtalay", "transport": "About a 3-minute drive or scooter ride along Cherngtalay Main Road; look out for the eye-catching sign."}, {"address": "Bandon-Cherngtalay Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | Specializing in authentic Southern Thai fermented rice noodles (Khanom Chin), this spot is a top landmark to experience true local food culture. Refreshing, smooth rice noodles are drenched in rich crab yellow curry or spicy fish kidney curry, offering deep and vibrant flavors. Every order comes with a full spread of complimentary fresh local greens and pickled vegetables to balance the heat. The fiery curry combined with crisp vegetables creates a wonderful taste sensation\u2014an unmissable local delicacy in Bangtao.", "name": "Khanom Chin Pa Mai Cherngtalay", "transport": "About a 3-minute drive or scooter ride from Boat Avenue Shopping Complex."}, {"address": "Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 stars | A branch of Phuket\u0027s century-old Hokkien noodle brand, preserving three generations of charcoal wok-hei stir-frying techniques. Thick yellow noodles are tossed over intense heat with pork slices, fresh shrimp, squid, and cabbage, infusing the dish with a rich smoky flavor. A soft-boiled egg is broken into the thick sauce right before serving, creating a silky texture that perfectly coats every noodle. A quintessential Phuket specialty.", "name": "Mee Ton Poe Cherngtalay", "transport": "Located near Boat Avenue; take the free internal shuttle from Laguna Resort to the shopping area, then walk."}, {"address": "162/12 Moo 1, Bangtao Beach, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | Situated right along the stretch of Bangtao Beach, this traditional seafood restaurant has relied on fresh daily catches from local fishermen for decades. Highlights include the Thai-style steamed fish with lime, tender and tangy-spicy, as well as the stir-fried giant prawns with garlic and pepper, bursting with aroma and firm texture. Guests can dine barefoot on the sand while enjoying sunset views over the Andaman Sea\u2014a relaxed, authentic dining experience cherished by visitors.", "name": "Bangtao Seafood Restaurant", "transport": "Walkable along the southern end of Bangtao Beach, or about an 8-minute taxi ride from Laguna."}, {"address": "Srisoonthorn Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.2 stars | Beloved by local neighbors, this traditional Hainanese chicken rice spot is renowned for its masterfully poached chicken. Featuring tender juicy meat and fragrant rice cooked in chicken fat and shallots, each grain is distinct and full of natural sweetness. The highlight is the homemade soybean-garlic-chili sauce that adds a tangy, savory kick, served alongside a comforting bowl of sweet melon chicken broth. Simple, affordable, and incredibly flavorful.", "name": "Khao Man Gai Cherngtalay", "transport": "Located near Cherngtalay Traditional Market, easily accessible by car or Songthaew."}, {"address": "Cherngtalay Rd, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | Famous for its authentic Southern Thai and Isan-style flavors, this popular local eatery is best known for its freshly pounded papaya salads (Somtam). Crispy shredded green papaya is pounded in a wooden mortar with fish sauce, lime juice, palm sugar, and fresh chilies for a refreshing, spicy-sour punch. Paired with freshly grilled tender chicken legs and sticky rice, it\u0027s a favorite tropical feast for locals and travelers alike.", "name": "Somtam Kit Panang Cherngtalay", "transport": "About a 2-minute scooter ride along the main road from the Boat Avenue shopping area."}, {"address": "Bandon-Cherngtalay Rd, Thalang District, Phuket 83110", "feature": "\u2b50 4.1 stars | A classic local food stall famous for its stewed pork leg, slow-simmered for hours in a rich five-spice herbal broth. The skin and fat are braised until ultra-tender, practically melting in your mouth and loaded with gelatinous richness, while the lean meat remains tender and deeply flavorful. Served over hot rice with pickled mustard greens and a tangy chili-vinegar dip to balance the richness, every bite offers a comforting, nostalgic taste.", "name": "Khao Kha Mu Cherngtalay", "transport": "Located near Cherngtalay Post Office, very convenient to reach by car or scooter."}], "name": "Iconic Local Traditional Eateries"}, "cat_2": {"items": [{"address": "49/92 Bandon-Cherngtalay Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 Stars | This highly acclaimed sourdough bakery and specialty coffee shop is a favorite in the Bang Tao area. Tourists and local expats highly recommend their freshly made sourdough sandwiches, featuring a golden, crispy crust, a delightfully tangy natural sourdough aroma, and airy, chewy crumb. Topped with rich avocado, smoked salmon, and runny soft-boiled eggs, the flavors are exceptionally layered. Their cold brew coffee and fresh cold-pressed juices are equally impressive, while the bright, comfortable Nordic-style wooden space invites you to linger over a relaxing morning.", "name": "Bartels Craft Bread \u0026 Coffee - Bang Tao", "transport": "About a 5-minute taxi or Songthaew ride from Laguna Phuket."}, {"address": "161/1 Moo 4, Soi Layan 1, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | Tucked away between Bang Tao and Layan Beach, this tropical garden brunch restaurant centers its philosophy around supporting local craftsmanship and produce. Signature brunch dishes, such as pan-seared truffle wild mushroom toast and Thai-style omelets, offer a crispy-yet-tender texture infused with natural herbal aromas. Surrounded by lush greenery and handcrafted ceramic decor, the garden creates an immensely relaxing vacation vibe, making it a favorite among lifestyle-conscious travelers.", "name": "Project Artisans", "transport": "Self-driving is recommended, or take an 8-minute Grab ride from Bang Tao Beach."}, {"address": "49/42 Boat Avenue, Bandon-Cherngtalay Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | Located in the famous Boat Avenue shopping district, this well-established bakery and brunch spot is a local staple in Bang Tao. Their signature French croissants feature flaky, buttery layers with a soft, pillowy interior. The classic American breakfast platter comes with juicy sausages, golden hash browns, and perfectly cooked sunny-side-up eggs\u2014generous and made with fresh ingredients. Comfortable outdoor seating allows guests to enjoy a leisurely coffee under the sunshine.", "name": "Bake Phuket - Boat Avenue", "transport": "Located inside the Boat Avenue shopping area, about a 10-minute walk or a 3-minute drive from the Laguna area."}, {"address": "202 Moo 2, Bang Tao Beach, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | Situated right on the beachfront of Bang Tao, this Bohemian-style beach brunch club highlights Mediterranean and tropical light bites. Popular options include colorful Acai Bowls topped with fresh mango, berries, and nuts\u2014cool, sweet, tangy, and guilt-free. Freshly baked thin-crust pizzas and seafood salads are also full of flavor. With your feet in the sand, enjoying brunch and iced specialty coffee against the backdrop of blue skies and ocean waves, this is an iconic island spot for travelers.", "name": "The Lazy Coconut", "transport": "Located right along Bang Tao Beach; reachable by a walk along the beach or via a local beach taxi."}, {"address": "49/48 Boat Avenue, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | Created by a French chef, this Parisian-inspired brunch cafe is famous for authentic French buckwheat galettes and delicate pastries. The crisp galette crust radiates a unique nutty grain aroma, filled with ham, melted cheese, and a soft-boiled egg that oozes rich yolk at first bite. Freshly made Eggs Benedict with custom Hollandaise sauce offers a smooth, perfectly balanced flavor. The elegant Parisian cafe interior makes you feel as if you\u0027ve been transported to a street in Europe.", "name": "Little Paris Phuket", "transport": "Located in the Boat Avenue lakeside area, just an 8-minute walk from the entrance of Laguna Phuket."}, {"address": "107/1 Moo 5, Bandon-Cherngtalay Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | An upscale cafe celebrated for its moody teal, dark-toned luxury vintage decor. The specialty pour-over coffee delivers distinct, layered flavors, pairing perfectly with house-baked French crepe cakes and Thai tea chiffon cakes\u2014dense, delicate, and deliciously balanced. Brunch plates artfully fuse Thai and French elements with striking visual appeal, making it a hit with stylish photo enthusiasts and lovers of refined coffee and desserts.", "name": "Delico Decoration Coffee \u0026 Dessert", "transport": "About a 5-minute drive from Laguna Phuket, located along the main Cherngtalay road."}, {"address": "1/8 Moo 5, Bandon-Cherngtalay Rd, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 Stars | A popular brunch brand focused on hydroponic organic vegetables and healthy whole foods. Signature warm salads and fresh shrimp papaya salads highlight crisp leafy greens harvested daily from their own farm, delivering natural sweetness in every bite. Whole-wheat brunch wraps and fresh fruit smoothie bowls are rich yet refreshing, offering satisfying portions without the guilt. The bright, high-ceiling wooden space filled with greenery recharges both body and soul.", "name": "WeCaf\u00e9 Cherngtalay", "transport": "About a 3-minute drive from Boat Avenue, easily reachable by Tuk-Tuk or Grab."}, {"address": "3/15 Moo 5, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 Stars | A highly popular, minimalist specialty coffee hub in Bang Tao. Sourcing top-tier single-origin beans from Southern Thailand and around the world, their meticulous extraction crafts lattes with a silky-smooth texture and rich notes of nuts and dark chocolate. The matcha latte uses Uji-grade Japanese matcha, achieving a flawless sweet-bitter balance. Freshly baked Danish pastries are crisp outside and soft inside, making this the top morning pick for serious coffee aficionados.", "name": "Fringe Coffee Bangtao", "transport": "Located near the Bang Tao commercial area; take a Songthaew or taxi to the Cherngtalay roundabout and walk 3 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "36, 40 Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Located at the entrance of Laguna, Siam Supper Club is one of Bang Tao\u0027s most iconic celebrity-favorite bistros. Dark-wood British jazz-style decor combined with warm, muted lighting creates a sophisticated nightlife ambiance. The menu highlights premium aged steaks, delicate Italian pasta, and signature cocktails infused with Thai herbs. The must-try Grilled Ribeye Steak features a lightly charred, fragrant crust with tender, juicy meat, paired with a rich house-made black pepper sauce that leaves a lasting impression. Additionally, the Lemongrass Thai Cocktail blends local spices with top-shelf spirits, offering a refreshing, subtly spicy kick that is widely loved by Western tourists and local professionals alike.", "name": "Siam Supper Club", "transport": "About a 5-minute taxi or shuttle ride from the Laguna Resort complex, located right next to Boat Avenue shopping plaza."}, {"address": "22/8 Moo 4, Bang Tao Beach, Cherngtalay, Thalang, Phuket 83110", "feature": "\u2b50 4.5 stars | Situated along the prime coastline of Bang Tao Beach, Catch Beach Club is one of Phuket\u0027s most famous beachfront bistros. Chic white sofa seating combined with breathtaking ocean views and live DJ sets creates a vibrant atmosphere, especially during spectacular sunsets. The menu features fresh seafood platters, Mediterranean small plates, and creative Southern Thai specialties. The Grilled Phuket Lobster is highly recommended\u2014firm, succulent meat infused with a rich charcoal aroma, drizzled with a tangy Thai lime seafood sauce for a perfectly balanced flavor profile. It pairs superbly with champagne or craft cocktails, making it a huge favorite among party lovers and foodies.", "name": "Catch Beach Club", "transport": "Located along the middle stretch of Bang Tao Beach, accessible via a 7-minute beach walk or a short tuk-tuk ride from Laguna Resort."}, {"address": "99/1 Moo 3, Bang Tao Beach, Cherngtalay, Thalang, Phuket 83110", "feature": "\u2b50 4.7 stars | Situated at the southern end of Bang Tao Beach, Carpe Diem is a coastal beach club and bistro that effortlessly combines elegance with a relaxed vibe. Lush coconut groves complement refined wooden decor, serving authentic Mediterranean dishes infused with local Thai ingredients. Try the Pan-Seared Mediterranean Sea Bass with Thai Herb Sauce\u2014crispy golden skin with tender fish inside, complemented by a signature sauce made from lemongrass and kaffir lime leaves for a brilliant fusion of East and West. The outdoor seating allows guests to dine directly on the soft sand, making it a favorite secret spot for local expats and vacationers seeking a slow-paced dining experience.", "name": "Carpe Diem Beach Club Phuket", "transport": "About an 8-minute drive from Boat Avenue, near the southern end of the beach."}, {"address": "Boat Avenue, 49/42 Moo 5, Bandon-Cherngtalay Rd, Choeng Thale, Phuket 83110", "feature": "\u2b50 4.4 stars | Located in the heart of Boat Avenue, Little Paris seamlessly blends cozy French bistro vibes with warm local Thai hospitality. The restaurant offers a diverse menu ranging from classic bistro hot dishes to authentic Southern Thai bites. The highly popular French Duck Confit with Thai Spicy \u0026 Sour Sauce features potato-chip-crispy skin with melt-in-your-mouth duck meat that effortlessly falls off the bone\u2014richly aromatic without being greasy. The open-air patio lights up with string lights at night, creating a lovely breezy atmosphere that draws tourists looking to enjoy fine wine and a delightful Franco-Thai evening.", "name": "Little Paris Phuket", "transport": "Located within the Boat Avenue shopping area, easy walking distance from main Laguna hotels."}, {"address": "93/30 Moo 4, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Nestled in lush greenery between Laguna and Layan Beach, Project Artisan is a tropical garden bistro emphasizing locally sourced whole foods and handcrafted artistic flair. The open-air garden radiates a vibrant natural eco-vibe, featuring visually stunning food presentations. A customer favorite, the Slow-Braised Southern Thai Spiced Beef Brisket, features premium local beef simmered for hours with turmeric, coconut milk, and spices until melt-in-your-mouth tender, served with a rich, flavorful sauce perfect with rice. The peaceful ambiance makes it ideal for foodies looking to escape the hustle and savor authentic local dishes and craft cocktails.", "name": "Project Artisan", "transport": "Taxis or scooters recommended; about an 8-minute drive from the center of Laguna Resort."}, {"address": "118/1 Moo 3, Bandon-Cherngtalay Rd, Choeng Thale, Phuket 83110", "feature": "\u2b50 4.5 stars | Situated on a street corner in Cherngtalay, The Corner Restaurant is a cozy, highly rated local bistro serving classic authentic Thai dishes alongside casual European meals. The chef excels at turning fresh local Phuket seafood into mouthwatering specialties. Their signature Thai Green Curry with Shrimp features a rich, smooth broth infused with aromatic coconut milk and fresh basil, paired with sweet, firm, and succulent prawns. With an unpretentious, comfortable atmosphere, friendly service, reasonable prices, and authentic flavors, it remains a top-rated favorite among international tourists and local residents alike.", "name": "The Corner Restaurant Phuket", "transport": "Located along the main road of Cherngtalay, about a 10-minute walk or 3-minute drive from Laguna Shopping Center."}, {"address": "71/6 Moo 4, Srisoonthorn Road, Cherngtalay, Thalang, Phuket 83110", "feature": "\u2b50 4.6 stars | Located just outside Bang Tao\u0027s Laguna area, Kin-Dee Restaurant (\"Kin-Dee\" means \"Eat Well\" in Thai) is a tropical-style bistro specializing in authentic home-style Phuket and Southern Thai cuisine. Decorated with abundant greenery, it exudes a charming Thai countryside vibe. The Southern Thai Yellow Curry with Fish is a must-try\u2014infused with fresh turmeric and wild local herbs, offering an explosion of spicy and tangy flavors followed by the fresh sweetness of fish and complex herbal undertones. Gourmets and travelers flock here for an uncompromisingly authentic spicy feast, perfectly paired with iced Thai milk tea or a cold beer.", "name": "Kin-Dee Restaurant", "transport": "Taxis recommended; roughly a 6-minute drive from the main entrance of Laguna Resort."}, {"address": "10 Moo 4, Srisoonthorn Road, Cherngtalay, Bang Tao Beach, Phuket 83110", "feature": "\u2b50 4.4 stars | Perched beachfront at Angsana Laguna Phuket, XANA Beach Club \u0026 Bistro is a top oceanfront dining destination within the Laguna resort complex. Featuring a 35-meter oceanfront outdoor pool and stylish lounge cabanas, it serves Thai-American fusion creations and seafood BBQ. The must-try Thai Lemongrass Grilled Pork Ribs are slow-roasted after marinading in a special sauce\u2014crispy outside, tender inside, effortlessly coming off the bone with rich notes of lemongrass and caramel. Relaxing at dusk with cool ocean breezes, DJ beats, and crafted cocktails makes this a luxury experience no traveler should miss.", "name": "XANA Beach Club \u0026 Bistro", "transport": "Located inside Angsana Laguna Phuket, accessible via free Laguna resort shuttle boats or buses."}], "name": "Specialty Gastropubs \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "14/1 Moo 1, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | This is the most highly recommended fully vegan restaurant around Bang Tao Beach among minimalists and health enthusiasts. The shop focuses on gluten-free, no added sugar, and 100% plant-based ingredients. Their signature \u0027Vegan Mexican Burrito\u0027 uses a natural spinach tortilla wrapped around rich, creamy homemade guacamole, black beans, and special herb vegan cheese. Every bite offers rich, layered textures with none of the dryness associated with typical vegetarian food. In addition, their Chia Seed Fruit Smoothie Bowl has a rich and smooth base topped with crunchy house-roasted nuts and fresh mango slices, offering a refreshing sweet and sour taste that is extremely popular with Western tourists and surfers.", "name": "Pure Vegan Heaven Phuket", "transport": "It takes about 5 minutes by taxi or rented scooter from Laguna Phuket."}, {"address": "10/89 Moo 4, Bang Dao Rd, Cherngtalay, Thalang, Phuket 83110", "feature": "\u2b50 4.7 stars | This Instagrammable caf\u00e9 filled with Balinese tropical vibe is renowned for its high-quality plant-based cuisine. Highly recommended is their \u0027Special Vegan Acai Bowl\u0027, which has a texture as velvety smooth as slightly melted sorbet, paired with vanilla roasted nuts and freshly sliced tropical fruits, delivering a cool, refreshing, and rich berry sweet-and-sour flavor. Another favorite, the \u0027Egg-Free Plant Meat Burrito\u0027, uses homemade hummus and seared plant-based meat wrapped in a lightly crisped tortilla; as you bite into it, juicy flavors and rich spices explode in your mouth, making it a healthy delicious option non-negotiable for high-protein plant-based food lovers.", "name": "Boost Cafe Phuket", "transport": "Located on Bang Tao\u0027s main street, about a 10-minute walk or a 3-minute drive from the southern end of Bang Tao Beach."}, {"address": "63/102 Moo 3, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.8 stars | Famous for its fresh, artisan sourdough baked daily, this is a super trendy vegetarian brunch spot in the Laguna shopping area. The signature \u0027Grilled Mushroom \u0026 Vegan Truffle Cheese Sourdough Sandwich\u0027 boasts a super crispy crust with perfect, elastic air pockets inside, combined with high-temp roasted fragrant wild mushrooms and gooey vegan cheese, creating a warm, rich, and distinctly layered texture. Paired with a freshly made cold-pressed green detox juice, it\u0027s refreshing and cuts through any heaviness, drawing countless health-conscious travelers specifically for breakfast.", "name": "Bartels Bang Tao - Sourdough \u0026 Juice", "transport": "Located on the main road of Cherngtalay, close to Boat Avenue shopping strip; extremely convenient by car or Tuk-Tuk."}, {"address": "46/6 Moo 3, Thepkasattri, Thalang District, Phuket 83110", "feature": "\u2b50 4.8 stars | Awarded a Michelin Green Star for ultimate sustainability, though offering a diverse menu, its \u0027Organic Vegetarian Slow Charcoal-Grilled Set\u0027 is absolute heaven for vegetarian gourmets. The chef insists on using zero-mile organic vegetables harvested daily from their own farm, utilizing slow charcoal roasting techniques to draw out the natural sweetness of the ingredients. The signature \u0027Charcoal-Roasted Beetroot with Homemade Plant-Based Yogurt\u0027 features beetroot with a subtle smoky crust that is soft and juicy inside, paired with tart, smooth herbal yogurt and crunchy chopped nuts, creating a surprisingly refined flavor on the palate.", "name": "JAMPA Restaurant", "transport": "Located in the farm area northeast of Laguna Resort; it is recommended to take a hotel shuttle or ride-hailing service, about a 10-minute drive."}, {"address": "53/17 Moo 6, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Tucked away in an open-air lush garden near Bang Tao Beach, this restaurant emphasizes the perfect combination of whole foods and local spices. The crowd-favorite \u0027Thai Herb Vegan Green Curry\u0027 eschews refined sugar and chemical seasonings, using freshly ground kaffir lime leaves, galangal, and coconut milk simmered over low heat. The rich and smooth sauce coats tender organic tofu cubes and eggplant, delivering a subtle spice and sweet finish with intricate layers. Served with Thai black rice, it\u0027s satisfying yet light on the stomach\u2014a hidden vegetarian gem blending aesthetic quality and deliciousness.", "name": "Project Artisan", "transport": "About a 6-minute drive from Layan Beach or the northern end of Bang Tao Beach."}, {"address": "168/1 Moo 1, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | A renowned vegetarian brand with its own greenhouse farm in Phuket, this branch is located next to Boat Avenue in Bang Tao. Its signature \u0027DIY Large Wooden Bowl Hydroponic Salad\u0027 offers over thirty pesticide-free fresh lettuce options and plant-based toppings, served with homemade \u0027Vegan Sesame Dressing\u0027. The lettuce is incredibly crisp and juicy, crunching with every bite, paired with a rich, smooth dressing. Another popular choice, the \u0027Thai Spicy and Sour Vegan Tom Yum Soup\u0027, uses fresh mushrooms and lemongrass for flavor, resulting in a hot, sour, aromatic, and totally non-greasy broth highly praised by locals and long-term expats.", "name": "WeCafe Cherngtalay", "transport": "Located on the edge of the Boat Avenue commercial area, about a 5-minute walk from the shuttle stop inside the Laguna complex."}, {"address": "Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 stars | A cozy spot created specifically for vegans, free of any animal products. Highly recommended is their \u0027Vegan Pad Thai\u0027, made with chewy rice noodles stir-fried over high heat in a signature vegan tamarind sauce, mixed with charred, aromatic seared tofu cubes and freshly roasted crushed peanuts. The dish offers a rich texture and perfectly balanced savory, sweet, and tangy flavors. Paired with a rich, smooth \u0027Oat Milk Unsweetened Thai Milk Tea\u0027 that isn\u0027t cloying, vegans can fully enjoy authentic Thai flavors.", "name": "Soul Vegan Cafe Bangtao", "transport": "Conveniently located about a 7-minute walk from the middle section of Bang Tao Beach."}, {"address": "Boat Avenue, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Located in the Boat Avenue shopping area, renowned for high-quality vegan gluten-free baked goods and healthy bowl meals. The must-try \u0027Vegan Oasis Bowl\u0027 features a base of black rice and quinoa, topped with seared tempeh, edamame, mashed edamame, and fresh avocado. The tempeh has a lightly charred, hearty, and chewy texture, drizzled with a special extra virgin olive oil herb sauce that is refreshing, smooth, and packed with nutrition. Additionally, their vegan raw chocolate tart has a rich, velvety texture that melts in your mouth, making it a perfect guilt-free dessert.", "name": "Plant Kitchen Phuket", "transport": "Located inside the Boat Avenue shopping center; easily accessible on foot or by taking the free resort shuttle bus from major hotels in Laguna Phuket."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Bang Tao Night Market, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | This famous roti stall at Bang Tao Night Market is a popular dessert spot for both locals and tourists. Made to order, the stretched dough is fried on a flat griddle until golden and crispy, wrapped around fresh sliced banana and rich egg mixture, then generously drizzled with sweet condensed milk and rich chocolate sauce. Super crispy on the outside with a hot, smooth, and fluffy filling inside, the natural fruity aroma of banana perfectly blends with condensed milk sweetness\u2014a classic street food staple at Bang Tao Night Market.", "name": "Bang Tao Night Market Roti Stall", "transport": "Located inside Bang Tao Night Market, about a 5-minute scooter ride or Tuk-Tuk ride from Laguna Resort."}, {"address": "Bang Tao Night Market Area, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | As night falls, the irresistible aroma of coconut-infused charcoal grilling draws crowds to this barbecue stall. Pork slices marinated for hours in coconut milk, soy sauce, and coriander root are skewer-grilled over hot coals until caramelized and glistening. Exceptionally tender, springy, and juicy with every bite, it offers a sweet-savory coconut caramel flavor. Paired with a warm bag of soft Thai sticky rice, every bite is an authentic Southern Thai street delicacy.", "name": "Cherngtalay Night Market Moo Ping", "transport": "Near Cherngtalay Police Station, about an 8-minute walk from Porto de Phuket Shopping Mall."}, {"address": "Bandon-Cherngtalay Rd, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 stars | A hugely popular traditional Thai dessert stall in Tinlay Market, serving the time-honored Thai crispy crepes (Khanom Buang). Paper-thin crepes are cooked to crispy perfection, layered with fluffy meringue frosting, and topped with either sweet egg yolk threads or savory coconut shredding with chopped scallions. Crunch into the golden crust as the sweet meringue melts instantly like marshmallow\u2014this irresistible sweet and savory contrast makes it a must-try classic Thai snack.", "name": "Tinlay Market Khanom Buang", "transport": "Located inside Tinlay Market, about a 10-minute walk from the main entrance of Laguna Resort."}, {"address": "Soi Cherngtalay 14, Bang Tao Beach, Choeng Thale, Phuket 83110", "feature": "\u2b50 4.7 stars | Set up along Bang Tao Beach Road, this fresh som tum (green papaya salad) stall is an energy-boosting haven for surfers and swimmers. The vendor pounds shredded green papaya, cherry tomatoes, long beans, garlic, chilies, and fresh lime juice together in a wooden mortar, finishing with roasted peanuts and dried shrimp. Delivering an incredibly crisp, zesty, and spicy flavor profile, the papaya absorbs the savory fish sauce and tangy lime juice. Pair it with fresh cold coconut water for pure bliss.", "name": "Bang Tao Beach Road Som Tum Vendor", "transport": "Located along the southern coastal road of Bang Tao Beach; easy to spot while taking a stroll along Beach Road."}, {"address": "Canal Village Laguna Phuket, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.5 stars | A highly popular Southern Thai fried chicken stall at the Laguna Friday Night Market. The chicken is marinated in a blend of shallots, cumin, and garlic, then deep-fried at high heat until golden and crispy outside while locked with succulent juices. The highlight is the generous sprinkle of crispy fried shallots on top. Extremely crunchy with juicy, tender meat, the aromatic shallots elevate the flavor, making first-timers instant regulars.", "name": "Laguna Friday Market Hat Yai Fried Chicken", "transport": "Located within the Friday Market area at Canal Village Laguna; accessible via free Laguna shuttle service."}, {"address": "Cherngtalay Sunday Night Market, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Positioned at the center of the Sunday Night Market, this popular ice cream stall serves traditional coconut ice cream inside half a fresh coconut shell. Scoops of rich, creamy ice cream made from pure coconut milk are topped with your choice of sticky rice, peanuts, palm seeds, or jackfruit. Velvety smooth with natural coconut aroma, combined with soft toppings and fresh tender coconut meat underneath, it\u0027s a refreshing walking dessert to beat the heat.", "name": "Cherngtalay Sunday Market Coconut Ice Cream", "transport": "Near Choeng Thale town center; easily reached by taking a Tuk-Tuk to Cherngtalay Market."}, {"address": "Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.3 stars | Hidden along the streets of Bang Tao, this authentic boat noodle stall is famous locally for its rich, dark broth. Slow-cooked for hours with pork bones, Thai herbs, and sweet basil, the broth is savory, rich, and lightly spiced. Choose between thin rice noodles or broad flat noodles, topped with tender pork slices, beef balls, and crisp morning glory. Slurping the soup-infused noodles with crunchy pork cracklings offers an authentic Thai street food experience.", "name": "Bang Tao Street Boat Noodle Stall", "transport": "Located off the main road in Cherngtalay, about a 3-minute scooter ride from Porto de Phuket."}, {"address": "Porto de Phuket, Choeng Thale, Thalang District, Phuket 83110", "feature": "\u2b50 4.6 stars | Located in the open-air market section of Porto de Phuket, this dessert stall transforms classic ChaTraMue Thai milk tea into fine, fluffy snow ice. A mini mountain of Thai tea snow ice is topped with sweet condensed milk, house-made brown sugar tapioca boba, and a dollop of whipped cream. Melting in your mouth instantly with rich tea aroma and sweet backnotes, the chewy boba creates a delightful multi-textured experience for both eyes and taste buds.", "name": "Porto de Phuket Market Thai Tea Shaved Ice", "transport": "Located in the open-air market area of Porto de Phuket Shopping Mall, opposite the Laguna entrance."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Bang Tao Beach and Laguna Resort Area"}, "chalong_panwa": {"categories": {"cat_1": {"items": [{"address": "44/1 Viset Road, Moo 5, Rawai, Muang, Phuket 83130", "feature": "\u2b50 4.4 Stars | An iconic seafood institution standing strong at Chalong Pier for decades, offering direct views of the vibrant blue bay and beautiful sailboats. The signature grilled giant prawns feature firm, snappy meat served with a tangy, spicy Thai lime seafood sauce. The garlic and pepper stir-fried crab offers thick, sweet meat with an irresistible aroma. Deeply loved by local families for gatherings, it is also a classic culinary landmark for tourists before setting sail from the pier.", "name": "Kan Eang@pier Seafood Restaurant", "transport": "Take a Songthaew or taxi to Chalong Pier; it\u0027s about a 2-minute walk from there."}, {"address": "9/4 Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 Stars | A legendary local gem hidden on the edge of the Chalong mangrove forest, featuring dining areas set in thatched bamboo huts over the water. The signature stuffed grilled fish (Pla Raung) combines fish meat marinated in red curry spices stuffed back into the fish skin and charcoal-grilled\u2014crispy outside, tender inside, and packed with aromatic lemongrass and turmeric. The spicy and sour fish soup is intensely flavorful and satisfying. Its rustic setting and unmatched, bold Southern Thai flavors keep local foodies and adventurous travelers coming back for more.", "name": "Mor Mu Dong Restaurant (Traditional Southern Thai Cuisine)", "transport": "It is recommended to rent a scooter or take a Grab/Tuk-Tuk using navigation to Mor Mu Dong, located in the mangrove area east of Chalong."}, {"address": "Soi Palai 2, Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 Stars | A well-established traditional seafood spot next to Palai Beach in Chalong. Situated right on the ocean embankment, diners can enjoy gentle sea breezes and sweeping coastal views. The restaurant insists on sourcing the freshest daily catch from local fishermen. The signature steamed grouper with lime boasts extraordinarily tender meat infused with tangy lime, cilantro, and garlic broth. The Southern Thai yellow curry with crabmeat is mildly spicy, sweet, and rich in coconut milk. Affordable prices and authentic cooking make this a favorite secret kitchen among local gourmets.", "name": "Palai Seafood Restaurant", "transport": "Turn into Soi Palai from Chao Fah Tawan Tok Road and drive to the end; accessible in about 10 minutes by taxi or self-driving."}, {"address": "Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 Stars | A Chalong branch of a legendary Phuket restaurant with nearly a century of heritage, specializing in authentic Phuket Hokkien fried noodles. Thick yellow noodles soak up rich seafood broth and dark soy sauce, served with fresh shrimp, squid, sliced pork, and a soft-boiled egg. Mixing the runny egg yolk coats the noodles in a silky smooth texture, infused with savory smoky wok hei. Served with complimentary raw shallots and crunchy preserved radish, it beautifully reproduces the traditional culinary culture of Phuket\u0027s early Chinese immigrants.", "name": "Mee Ton Poe (Chalong Branch)", "transport": "Located on Chao Fah Tawan Tok Road, the main thoroughfare in Chalong; easily reachable via local buses or Songthaews passing through Chalong."}, {"address": "Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 Stars | An iconic local Halal breakfast institution in Chalong that remains wildly popular after years of operation. The signature Roti is golden and crispy on the outside, flaky and chewy on the inside. Dipped into rich, smooth beef curry or chicken curry, it blends gentle spice with creamy notes. For sweet tooths, the banana roti with condensed milk paired with a rich hot Thai milk tea is the ultimate way to experience an authentic Phuket traditional breakfast.", "name": "Roti Chaofa", "transport": "Located on the main road near Wat Chalong; riding a motorbike or taking a taxi is recommended."}, {"address": "Ao Tang Khen, Wichit, Mueang Phuket District, Phuket 83120", "feature": "\u2b50 4.2 Stars | A humble local seafood eatery nestled right along the beach of Ao Tang Khen in Cape Panwa, offering a relaxed and unpretentious atmosphere. The signature stir-fried squid with garlic and pepper is tender and snappy, boasting an appetizing char aroma from sauteed garlic. Raw marinated black tiger prawns served with a house-made seafood sauce are chilled, sweet, and fiery spicy. Free from commercial hype, this spot delivers pure Southern Thai fishing village flavor alongside warm local hospitality.", "name": "Tang Khen Seafood Restaurant", "transport": "Located in the Ao Tang Khen area of Cape Panwa; self-driving or chartering a car in advance is recommended."}, {"address": "Sakdidej Rd, Wichit, Mueang Phuket District, Phuket 83120", "feature": "\u2b50 4.3 Stars | A traditional seafood restaurant located near the tip of the Cape Panwa peninsula, offering an authentic Thai feast far from the crowds. The signature deep-fried shrimp cakes (Tod Mun Koong) are generously packed with large, bouncy shrimp pieces in a golden crispy crust. The Southern Thai specialty, stir-fried Melinjo leaves with eggs, is tender, sweet, and perfectly paired with steamed rice. Facing a calm bay, it is an ideal dining choice after visiting the Phuket Aquarium.", "name": "Laem Panwa Seafood", "transport": "About a 3-minute drive from Phuket Aquarium; accessible by Songthaew (Cape Panwa route) or taxi."}, {"address": "Soi Palai, Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.1 Stars | Compared to the polished feel of Kan Eang @pier, Kan Eang 2 preserves the unpretentious vibe, traditional flavor, and budget-friendly prices of classic local seafood stalls. Located right along Chalong Bay, its signature charcoal-grilled whole fish features crispy skin and juicy, flavorful meat. The salt-and-pepper soft-shell crab is wonderfully crispy, delivering an explosion of savory ocean flavor in every bite. Rustic wooden tables and ocean breezes create a nostalgic charm loved by locals and seasoned Thailand travelers alike.", "name": "Kan Eang 2 Seafood Restaurant", "transport": "Located seaside inside Soi Palai; accessible by taxi or motorbike."}], "name": "Authentic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "31/11 M.8 Sakdidej Road, Cape Panwa, Phuket 83000", "feature": "\u2b50 4.6 stars | Located next to Kantary Bay Hotel in Cape Panwa, this cafe is famous for its deeply relaxing ocean views and specialty espresso. The signature French toast is crispy on the outside and soft inside, drizzled with rich maple syrup and fresh berries\u2014a delightfully balanced treat you won\u0027t forget. Additionally, fresh daily crepe cakes and crispy egg tarts make it a top choice for both tourists and locals enjoying a laid-back afternoon tea.", "name": "Cafe Kantary Phuket", "transport": "About a 20-minute taxi ride from Chalong Pier to Kantary Bay Hotel Cape Panwa."}, {"address": "8/1 Moo 8, Ao Yon Beach, Wichit, Cape Panwa, Phuket 83000", "feature": "\u2b50 4.5 stars | Nestled by the tranquil Ao Yon Beach in Cape Panwa, offering an unbeatable front-row beachfront brunch experience. The signature Eggs Benedict features homemade hollandaise sauce and smoked salmon, with runny poached egg yolk melting into crispy English muffins for a smooth, rich flavor. Embraced by gentle sea breezes and fine white sand, it attracts many Western travelers seeking a lazy morning retreat.", "name": "The Cove Phuket", "transport": "About a 5-minute drive or ride following the signs to Ao Yon Beach from the main road in Cape Panwa."}, {"address": "83/13 Moo 4, Chaofa West Road, Chalong, Phuket 83130", "feature": "\u2b50 4.7 stars | Located in Chalong\u0027s bustling fitness and diving district, this popular spot focuses on healthy organic food and high-quality pour-over coffee. The signature Acai Smoothie Bowl is loaded with fresh banana slices, blueberries, oats, and homemade nut butter\u2014refreshing, tangy-sweet, and highly nutritious. Paired with a medium-roast Ethiopian specialty pour-over featuring bursting citrus notes, it\u0027s a favorite among local expats and sports enthusiasts.", "name": "Coffee Tribe Phuket", "transport": "Drive north from Chalong Circle along Chaofa West Road for about 3 minutes; look for the yellow sign."}, {"address": "10/48 Moo 5, Soi Ta-iad, Chalong, Phuket 83130", "feature": "\u2b50 4.6 stars | Situated on Chalong\u0027s famous fitness street (Soi Ta-iad), created specially for health-conscious travelers. The plant-based Rainbow Wrap uses a freshly made whole-wheat tortilla filled with fresh avocado, purple cabbage, and a secret peanut sauce\u2014crispy, juicy, and packed with flavor layers. Paired with fresh cold-pressed juice, it reenergizes your body and stands out as Chalong\u0027s most praised vegan brunch landmark.", "name": "Pure Vegan Heaven Phuket", "transport": "About an 8-minute tuk-tuk or taxi ride from Chalong Pier to the Soi Ta-iad area."}, {"address": "107/48 Moo 5, Bye Pass Road, Wichit, near Chalong, Phuket 83000", "feature": "\u2b50 4.8 stars | Located near Chalong, this cafe went viral for its lavish European classical decor in striking blue tones. The exquisite afternoon tea set includes freshly baked vanilla waffles and an array of premium handmade desserts. Crisp on the outside and soft inside, the waffles are served with fresh whipped cream and signature berry compote for a silky-sweet delight. With its elegant ambiance and visually stunning interior design, it is a must-visit luxury cafe for Instagram lovers and aesthetic seekers.", "name": "Delico Decoration Coffee \u0026 Dessert", "transport": "About a 10-minute taxi ride north from Chalong Circle along the bypass road."}, {"address": "7 Salika Rd, Rawai/Chalong border, Phuket 83130", "feature": "\u2b50 4.7 stars | Hidden in Chalong\u0027s sports community, famous for high-protein, refined-sugar-free healthy brunch options. The signature Avocado \u0026 Poached Egg Toast uses quality sourdough bread topped with thick-sliced fresh avocado and a perfectly soft-poached egg. The instant burst of rich yolk paired with creamy avocado is incredibly satisfying. Complete with a rich house-blend oat milk latte, it\u0027s the perfect post-workout refuel or energizing breakfast.", "name": "Olympic Cafe Phuket", "transport": "About a 6-minute drive south along Salika Road from Chalong Pier."}, {"address": "2/2 Moo 8, Sakdidej Road, Cape Panwa, Phuket 83000", "feature": "\u2b50 4.4 stars | Perched on the edge of a cliff in Cape Panwa, this dreamlike cafe features a charming pastel pink beach theme. The signature Thai Milk Tea Toast infuses rich Thai tea flavor into French toast, boasting a lightly charred exterior with a soft, pudding-like center and just the right amount of sweetness. Sip on signature iced coffee while enjoying an unobstructed 180-degree panorama of the Andaman Sea\u2014it\u0027s Cape Panwa\u0027s iconic Instagram-worthy spot.", "name": "Cafe Phuket View Point", "transport": "About a 5-minute drive from the tip of Cape Panwa along Sakdidej Road toward the cliffside."}, {"address": "98/5 Moo 8, Ao Yon Beach, Cape Panwa, Phuket 83000", "feature": "\u2b50 4.5 stars | Located right on the beachfront of Ao Yon Beach in Cape Panwa, combining the allure of a pink beach club with a cozy brunch cafe. The signature Lobster \u0026 Seafood Sourdough Brunch comes with homemade dressing and tender seafood\u2014sweet, refreshing, and rich in texture. Relax on beach chairs with your feet in the sand, sipping fresh pink coconut water or freshly ground coffee for a dreamy tropical island morning.", "name": "Flamingo Phuket", "transport": "About a 7-minute drive from Phuket Aquarium to the shore of Ao Yon Beach."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "44/1 Viset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | A prime oceanfront restaurant located next to Chalong Pier, famous for its ultra-fresh local Phuket seafood and Southern Thai specialties. The signature grilled giant prawns feature firm, springy meat paired with a tangy, spicy homemade lime-chili sauce, while the lemongrass grilled fish is crispy on the outside, tender inside, and bursting with herbal aromas. With a relaxed vibe and open-air oceanfront seating, it is beloved by global tourists and local foodies alike.", "name": "Kan Eang@pier Seafood Restaurant", "transport": "About a 3-minute walk from Chalong Pier."}, {"address": "8/1 Moo 8, Ao Yon Beach, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Nestled along the serene Ao Yon Beach in Cape Panwa, offering Mediterranean-Thai fusion cuisine. The signature seafood risotto absorbs rich seafood broth, delivering intense flavor with every bite; paired with crispy wood-fired pizzas and craft tropical cocktails, it is a match made in heaven. The relaxed, natural vibe and the experience of dining barefoot on the beach are hugely popular among travelers.", "name": "The Cove Phuket", "transport": "Recommended to take a scooter, Grab, or Tuk-Tuk to Ao Yon Beach."}, {"address": "88 Moo 8, Sakdidej Rd, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | A luxurious, stylish bistro located inside the high-end Sri Panwa resort, offering panoramic ocean views and stunning sunset scenery over Cape Panwa. The menu fuses refined Thai local dishes with premium grilled meats. The spiced Thai grilled lamb chops are tender, game-free, and charred to perfection, while the signature cocktails are equally impressive. The ultimate luxury ambiance and 360-degree views make it the top choice for celebrations and lavish dinners.", "name": "Baba Pool Club at Sri Panwa", "transport": "Take a shuttle or taxi from the main road in Cape Panwa directly into the Sri Panwa resort."}, {"address": "9/4 Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | A wildly popular, hidden gem Southern Thai restaurant recommended by the Michelin Bib Gourmand, located near the Chalong mangroves. The signature \u0027Pla Yood\u0027 (stuffed fish) is firm and springy, infused with stunning herb and curry aromas, while the spicy Phuket hot \u0026 sour fish soup and pepper stir-fried pork are ultimate rice-stealers. Sitting in private bamboo huts right by the mangroves offers a rustic, uniquely local dining experience.", "name": "Mor Mu Dong Restaurant", "transport": "Recommended to drive a scooter or take a taxi; turn off Chaofa East near the Chalong Circle into the mangrove lane."}, {"address": "27, 27/2 Moo 8, Sakdidej Rd, Cape Panwa, Phuket 83000", "feature": "\u2b50 4.5 stars | A classic beachfront Thai restaurant set in a restored Sino-Portuguese mansion, brimming with retro colonial charm. It specializes in refined traditional Phuket cuisine, such as rich Phuket Braised Pork (Moo Hong), slow-cooked until melt-in-your-mouth tender and savory without being greasy; and crab meat in yellow curry served with rice vermicelli, featuring a richly spiced sauce and pure, sweet crab meat.", "name": "Panwa House at Cape Panwa Hotel", "transport": "Located right on the beach inside the Cape Panwa Hotel grounds; accessible via hotel shuttle or taxi."}, {"address": "4/2 Moo 3, Chaofa Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.1 stars | A long-standing local favorite seafood eatery on Palai Beach in Chalong Bay, serving authentic, rustic Southern Thai seafood. The signature black pepper stir-fried crab offers sweet meat infused with zesty spice, while the steamed sea bass with lemon is appetizingly tangy with tender, delicate fish. Dining on the seaside wooden boardwalk while feeling the ocean breeze is affordable and brimming with authentic local Phuket life.", "name": "Palai Seafood", "transport": "Drive north from Chalong Circle to the end of Soi Palai."}, {"address": "98/5 Moo 8, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | A trendy, Instagram-worthy beach bar and restaurant at Ao Yon Beach boasting prime sunset views. It serves refined Thai fusion dishes and Western bistro bites. The signature fried soft-shell crab warm salad is crispy and refreshing, perfect when paired with a cold-brewed tropical fruit cocktail. Soothing music and dreamy pink photo spots make it a massive hit with younger travelers.", "name": "Flamingo Phuket", "transport": "Follow Sakdidej Road toward Ao Yon Beach from Cape Panwa."}, {"address": "5/2 Moo 3, Chaofa West Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | A glasshouse garden bistro connected to its own organic farm, serving healthy, delicious local Thai dishes and creative Italian eats. The signature Southern Thai herbal fried chicken is golden, crispy, juicy, and non-greasy; the organic shrimp salad features sweet, crisp veggies paired with a homemade lime-yogurt dressing that leaves a memorable aftertaste. Lush greenery surrounds the venue, making dining exceptionally relaxing and refreshing.", "name": "WeCafe Organic \u0026 Salad Chalong", "transport": "Located on Chaofa West main road, about a 5-minute drive from Wat Chalong, offering easy access."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "5/20 Moo 4, Soi Ta-iad, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.7 stars | A plant-based dining paradise near Chalong\u0027s Muay Thai Street, specializing in vegan and gluten-free healthy meals. Highly recommended are their Rainbow Fruit \u0026 Veggie Bowl and Vegan Green Curry. The rice is perfectly cooked with distinct grains, paired with a rich, aromatic coconut green curry sauce infused with fresh basil, offering a gentle kick of spice that instantly activates your palate. Tourists love the tropical garden dining environment and freshly made cold-pressed juices, making it the top choice for refueling after a workout.", "name": "Pure Vegan Cafe Chalong", "transport": "About a 10-minute drive or taxi ride from Chalong Pier, located on Soi Ta-iad (Muay Thai Street)."}, {"address": "88/87 Moo 5, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | A minimalist vegan restaurant near Chalong Bay that perfectly recreates classic Thai cuisine using 100% plant-based ingredients. The must-try Vegan Pad Thai features firm, savory dried tofu cubes soaked in a sweet and sour basil sauce, chewy rice noodles, crunchy crushed peanuts, and fresh bean sprouts, creating immensely rich layers of flavor. Free from chemical additives, it is a favorite among health-conscious Western travelers and local fitness enthusiasts.", "name": "Soul Vegan Restaurant Phuket", "transport": "Just about a 5-minute drive from Chalong Pier, accessible along Chaofa East Road."}, {"address": "99/1 Moo 4, Chao Fah West Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | A renowned top-tier raw vegan concept cafe in Phuket, dedicated to serving natural whole foods prepared without high heat. A popular dessert, the Raw Cacao Nut Tart, features a crust pressed from dates and crunchy walnuts, with a silky, rich filling bursting with natural bittersweet cacao aroma. Its visually exquisite and pure-tasting dishes draw yoga enthusiasts and wellness seekers for a dedicated visit.", "name": "Atsumi Raw Cafe", "transport": "About a 6-minute drive from Wat Chalong, located along the main Chaofa West Road."}, {"address": "41/31 Moo 1, Chao Fah East Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | A cozy and unpretentious local vegan eatery offering great-value, affordable traditional Thai vegetarian food. The signature Vegan Tom Yum soup base is rich, sour, and spicy, loaded with fresh straw mushrooms, lemongrass, and coconut milk for a smooth, sweet finish. Paired with crispy vegan fried chicken that perfectly mimics meat texture with its crunchy exterior and juicy interior. With no fancy decor, its authentic Thai flavors and warm, family-style service make it highly recommended by locals and long-term visitors.", "name": "Yo Green Vegan Restaurant", "transport": "Located on Chaofa East Road, about a 12-minute walk or a 3-minute drive from Chalong Pier."}, {"address": "39/12 Moo 4, Viset Road, Rawai, Chalong border, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | A plant-based restaurant featuring farm-to-table freshness directly from its own organic farm. Highly recommended is the Organic Avocado Quinoa Salad, featuring perfectly ripe, creamy avocado paired with crisp organic greens and a tangy passionfruit vinaigrette\u2014refreshing, non-greasy, and satisfyingly textured. The warm, simple wooden decor and lush green garden create a relaxing dining atmosphere, making it a popular veggie spot near Panwa and Chalong.", "name": "Super Green Organic \u0026 Vegan", "transport": "About a 4-minute drive from Chalong Circle toward Rawai."}, {"address": "84 Moo 8, Sakdidech Road, Wichit, Cape Panwa, Mueang Phuket District, Phuket 83120", "feature": "\u2b50 4.3 stars | Situated along the scenic coast of Cape Panwa, offering a luxurious dining experience where you can enjoy plant-based meals while admiring views of the Andaman Sea. The special Vegan Khao Soi features a rich coconut curry broth infused with turmeric, topped with crispy golden noodles and resting over soft noodles soaked in flavorful broth for a memorable contrast of textures. Stunning ocean views and creative vegan dishes make it a favorite date spot for couples and tourists.", "name": "Panwa Vegan Ocean Kitchen", "transport": "Located along the Cape Panwa coastline, about a 5-minute drive from Phuket Aquarium."}, {"address": "75/12 Moo 6, Chaofa West Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.2 stars | A traditional Thai vegetarian eatery near Wat Chalong, especially bustling during the Nine Emperor Gods Festival. The signature vegan spring rolls are fried to a golden crunch, stuffed with shredded mushrooms, cabbage, and glass noodles. Dunk them in homemade sweet and sour plum sauce for an appetite-whetting treat. Featuring a classic cafeteria-style tray system with dozens of affordable stir-fried dishes, it offers an authentic taste of local Phuket vegetarian culture.", "name": "Krua Jay Chalong", "transport": "Located diagonally opposite the entrance to Wat Chalong, just a 3-minute walk away."}, {"address": "62/15 Moo 4, Chao Fah West Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | A unique eatery blending Western fast food with gourmet vegan concepts, completely shattering the stereotype that vegan food is bland. The wildly popular Vegan Jumbo Burger features a plant-based patty, melted vegan cheese, and house-made truffle mayo. The patty is seared to juicy perfection with a rich aroma, served on a black sesame bun that is crispy outside and soft inside. Extremely popular among young tourists and Western travelers, it is an innovative highlight in the Chalong area.", "name": "Vegan Mania Phuket", "transport": "Located along Chaofa West Road near Chalong Sports Center, easily accessible by car."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "41/3 Chao Fah Tawan Tok Rd, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | Located in Chalong, this popular roti stall is famous for its made-to-order banana rotis. The golden-brown crust is fried to crisp perfection with a satisfying crunch, wrapping soft, sweet banana slices topped with a generous drizzle of condensed milk and chocolate syrup. Crispy on the outside, soft on the inside, and perfectly sweet without being cloying, it\u0027s a fantastic evening snack for both tourists and locals.", "name": "Roti Chalong Night Market", "transport": "About a 5-minute ride by tuk-tuk or songthaew from Chalong Pier."}, {"address": "Wichit, Mueang Phuket District, Phuket 83000 (Near Khao Khad Viewpoint)", "feature": "\u2b50 4.3 stars | A roadside food stall near Khao Khad Viewpoint specializing in traditional Thai charcoal-grilled pork skewers (Moo Ping) served with piping hot sticky rice. Marinated in coconut milk and aromatic spices, the pork is grilled over charcoal until light charred, tender, juicy, and rich with savory-sweet flavors. Paired with chewy sticky rice, it makes for a thoroughly satisfying treat\u2014a favorite among sunset seekers.", "name": "Khao Khad Viewpoint Moo Ping Stall", "transport": "Recommended to travel by scooter or private charter to Khao Khad Viewpoint; the stall is right next to the viewpoint parking area."}, {"address": "Ao Yon Beach, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Tucked away near secluded Ao Yon Beach, this stall serves iconic Thai mango sticky rice. Featuring ripe, sweet golden mango slices paired with soft sticky rice drenched in rich coconut cream with a hint of saltiness, it delivers a rich, smooth texture. Enjoying a freshly cracked chilled coconut along with this dessert in the sea breeze makes it a vacationer favorite.", "name": "Ao Yon Beach Mango Sticky Rice \u0026 Coconut", "transport": "About a 10-minute walk along the coastal road from Cape Panwa, or ride a scooter directly to the Ao Yon Beach entrance."}, {"address": "Chalong Pier Promenade, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.2 stars | Located near the boat launch at Chalong Pier, this street stall features fresh grilled baby squid and signature Thai green papaya salad (Som Tam). The shredded papaya is ultra-crisp, tossed with fish sauce, lime juice, and chilies for a zesty, spicy flavor kick, while the freshly grilled squid is tenderly chewy with a smoky charcoal aroma\u2014attracting many hungry island-hoppers fresh off their boat tours.", "name": "Chalong Pier Grilled Seafood \u0026 Som Tam", "transport": "Located right at the entrance of the Chalong Pier pedestrian promenade, easily accessible on foot."}, {"address": "Khao Khad Road, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | A street stall beloved by local Thais, specializing in traditional Southern Thai rice noodles (Kanom Jeen). Silky-smooth noodles are topped with a rich, spicy coconut curry fish soup, accompanied by a self-serve bar of free fresh vegetables, bean sprouts, and pickled mustard greens. An explosive hit of spice gives way to rich fish curry notes and fresh herbal flavors, offering an authentic taste of Southern Thai food culture.", "name": "Khao Khad Road Kanom Jeen Stall", "transport": "Easily spotted along the roadside when riding a scooter along the scenic coastal road from Cape Panwa toward Khao Khad Viewpoint."}, {"address": "Sakdidej Road, Wichit, Mueang Phuket District, Phuket 83000 (Cape Panwa Promenade)", "feature": "\u2b50 4.3 stars | A popular traditional dessert stall at the Cape Panwa Evening Market. Seasoned coconut sticky rice and black beans are stuffed into bamboo tubes and slow-roasted over heat, releasing a gentle bamboo aroma upon peeling. Chewy and satisfying with a hint of natural bamboo membrane flavor and rich coconut sweetness, it\u0027s a convenient hand-held snack for evening beach strolls.", "name": "Cape Panwa Evening Market Sticky Rice in Bamboo", "transport": "Located along the coastal promenade near Phuket Aquarium, easily reachable on foot."}, {"address": "Chao Fah Tawan Tok 2 Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | This cozy stall serves crispy Thai fried chicken (Gai Tod)\u2014golden, deeply marinated, juicy, and topped with irresistible crispy fried shallots. After savory chicken, diners can order rich coconut ice cream served in a halved coconut shell, packed with creamy flavor and sweet fresh coconut meat. The savory-and-sweet combo is an absolute match made in heaven.", "name": "Chalong Bay Fried Chicken \u0026 Coconut Ice Cream", "transport": "About a 3-minute scooter ride from Wat Chalong, or take a songthaew and hop off on the Chalong Bay main road."}, {"address": "51 Sakdidej Road, Cape Panwa, Wichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A popular snack stall near the aquarium, famous for its sizzled crispy seafood pancake (Hoy Tod)\u2014featuring an ultra-crispy batter filled with tender, juicy oysters and shrimp, served with sweet chili sauce. They also sell grilled Northeastern-style Thai sausages (Sai Oua) packed with aromatic herbs and a subtle spicy kick. Juicy and full of bite, it\u0027s a favorite afternoon snack for visitors exploring Cape Panwa.", "name": "Phuket Aquarium Seafood Crispy Pancake \u0026 Sai Oua", "transport": "Located in the food vendor area right across from the Phuket Aquarium entrance, easily accessible by bus or car."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Chalong Pier and Cape Panwa"}, "kamala_surin": {"categories": {"cat_1": {"items": [{"address": "86/7 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.5 Stars | As a long-standing local institution on Kamala Beach, Pond Restaurant is famous for its authentic Southern Thai flavors and freshly caught seafood. The signature Tom Yum Goong features a rich, spicy, and sour broth paired with springy giant tiger prawns and fragrant lemongrass, making it flavorful and appetizing. The Coconut Curry Chicken is tender and smooth, with a perfectly balanced sweet and savory coconut flavor. Highly loved by locals and seasoned travelers alike, its friendly home-style service and affordable prices offer the purest experience of Thai home-cooked warmth.", "name": "Pond Restaurant Kamala", "transport": "About a 5-minute walk from Kamala Beach, or take a songthaew to Kamala Main Street and walk from there."}, {"address": "73/8 Moo 3, Kamala Beach, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.4 Stars | Smile Bar \u0026 Restaurant is one of the most iconic classic Thai eateries along the Kamala coast, boasting stunning sunset ocean views. Its signature Steamed Fish with Lime uses fresh daily catch, offering delicate, sweet meat topped with a zesty sauce made from freshly squeezed lime juice, minced garlic, and bird\u0027s eye chilies. The Pad Thai features a strong wok hei (smokiness), complemented by crushed peanuts and fresh bean sprouts for rich layers of texture. Beyond the delicious food, the relaxed atmosphere with gentle sea breezes is the main reason guests keep coming back.", "name": "Smile Bar \u0026 Restaurant Kamala", "transport": "Located along the walkway at the southern end of Kamala Beach; easily accessible by walking along the beach."}, {"address": "74/1 Moo 3, Rim Hat Road, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.6 Stars | A traditional favorite run by local twin brothers for many years, this popular spot in Kamala relies on secret family recipes. The must-try Seafood Green Curry is rich and aromatic, infused with subtle basil and green pepper notes, offering a smooth texture with moderate spice. The Spicy Basil Pork Rice is an ultimate rice-pairer, with minced pork stir-fried with fresh holy basil and special dark soy sauce, releasing a smoky aroma, topped with a fried egg featuring crisp edges\u2014simple yet tantalizing for the taste buds.", "name": "Twin Brothers Restaurant Kamala", "transport": "Located on Rim Hat Road in Kamala, about a 3-minute walk from Kamala Night Market."}, {"address": "100/12 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.3 Stars | Tucked away in a lush garden, this long-standing Thai restaurant has insisted on using fresh local ingredients and traditional handmade sauces for years. The Stir-fried Crab with Yellow Curry is highly recommended; the crab meat is plump and juicy, perfectly blended with eggs, onions, and yellow curry powder to create a creamy, sweet dish that pairs amazingly with toast or white rice. The Thai Fried Spring Rolls are crispy on the outside with rich fillings, served with a special plum sauce for a delicious sweet-and-sour crunch. The warm, rustic atmosphere makes guests feel right at home as if visiting a Thai friend.", "name": "Bush Garden Kamala", "transport": "Located right off the main road in Kamala; accessible directly by private charter or tuk-tuk."}, {"address": "93/21 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.7 Stars | Blue Manao is a highly acclaimed traditional Thai restaurant in Kamala that captivates foodies with refined handmade Thai dishes and authentic flavors. Their Green Papaya Salad (Som Tum) is particularly recommended\u2014shredded papayas are finely sliced and extra crunchy, absorbing the essence of lime juice, fish sauce, palm sugar, and crushed peanuts for a perfectly balanced spicy, sour, and sweet taste. Additionally, the Roasted Duck Red Curry is superb, featuring tender duck with crispy skin bathed in rich red curry sauce infused with pineapple and lychee flavors, offering great depth of taste.", "name": "Blue Manao Kamala", "transport": "Located in the central area of Kamala town, about a 7-minute walk from Kamala Beach."}, {"address": "110/4 Moo 3, Choeng Thale, Thalang District, Phuket 83110, Thailand", "feature": "\u2b50 4.5 Stars | Located near Surin Beach, Audrey Corner is a classic long-running local establishment loved by both locals and long-term Western travelers. Its Massaman Beef Curry is legendary\u2014the beef is slow-cooked for hours until it melts in your mouth, while the curry sauce is infused with cinnamon, star anise, and peanut aromas, offering a warm and mild flavor. Another favorite, the Stir-fried Noodles with Shrimp in Mami Sauce, features chewy noodles paired with a signature spicy-and-sour sauce that keeps you craving more. The warm hospitality and authentic seasonings perfectly showcase the depth of Southern Thai cuisine.", "name": "Audrey Corner Surin", "transport": "About an 8-minute walk from Surin Beach, or take a taxi/tuk-tuk to Surin\u0027s main avenue."}, {"address": "112/1 Moo 3, Surin Beach Road, Choeng Thale, Thalang District, Phuket 83110, Thailand", "feature": "\u2b50 4.3 Stars | Situated near Surin Beach, Pla Seafood is a renowned traditional Thai seafood restaurant built on a reputation for serving daily fresh catches from the harbor. The Garlic and Salt Pepper King Prawns are highly praised\u2014high-heat stir-frying renders the shells golden and crispy while keeping the prawn meat firm, bouncy, and exceptionally sweet, bursting with rich garlic aroma. Steamed Scallops with Garlic are also a must-order, featuring plump scallop meat and savory broth. Maintaining a simple and authentic seaside restaurant charm, it is a top choice for quality, reasonably priced seafood.", "name": "Pla Seafood Surin", "transport": "About a 4-minute walk from the Surin Beach exit."}, {"address": "82/4 Moo 3, Kamala, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.4 Stars | Sweet Dream Restaurant is a cozy, family-run spot in Kamala that has operated for generations, specializing in traditional Thai home-cooked meals and authentic Southern Thai flavors. The signature Stir-fried Chicken with Lemongrass is richly aromatic, featuring tender, juicy diced chicken bursting with lemongrass and chili fragrance that whets the appetite. For dessert, the Mango Sticky Rice is an absolute must-try\u2014freshly sliced sweet juicy mango served over warm, fragrant sticky rice steamed with coconut milk, topped with crispy yellow mung beans for a delightful blend of warm and cool, sweet and savory textures.", "name": "Sweet Dream Restaurant Kamala", "transport": "About a 6-minute walk from the central area of Kamala Beach, offering convenient access."}], "name": "Local Traditional Favorites"}, "cat_2": {"items": [{"address": "333/3 Moo 3, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 Stars | A premier ocean-view brunch spot located inside the InterContinental Hotel, offering exquisite avocado toast, freshly roasted coffee, and breathtaking endless sea views. The house special cold drip coffee boasts a rich aroma, paired with soft artisanal European bread and smoked salmon for a rich layering of flavors. Highly favored by tourists for its elegant, tranquil, and luxurious resort vibe, making it the top choice for enjoying a slow morning.", "name": "Pine Beach Bar \u0026 Cafe", "transport": "Take a taxi or Songthaew to the InterContinental Resort on the north side of Kamala Beach."}, {"address": "118/19 Moo 3, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 Stars | An Ibiza-style beach club cafe whose brunch and signature chilled drinks are beloved by travelers worldwide. The cafe features made-to-order gourmet brunch platters, including soft-poached Eggs Benedict topped with rich Hollandaise sauce, where the runny yolk and crispy waffles blend into a perfectly creamy texture. Coupled with upbeat music, sunshine, and sandy beaches, it is an extremely popular landmark in the Kamala area.", "name": "Caf\u00e9 Del Mar Phuket", "transport": "Located at the northern end of Kamala Beach; rent a scooter or drive directly to the end of Beach Road."}, {"address": "110/2 Moo 3, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | A renowned boutique bakery cafe in the Surin Beach area, famous for its daily freshly baked French croissants and European sourdough bread. Its honeycomb croissant features a crispy, flaky crust and a chewy, airy interior with a rich buttery aroma. Paired with a smooth latte or hand-poured single-origin coffee, it is a favorite among local expats and food-savvy travelers.", "name": "Bake Cafe Surin", "transport": "About a 5-minute walk from Surin Beach, accessible along Surin Main Road."}, {"address": "Kamala Beach Road, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 Stars | A cozy cafe located along Kamala Beach, offering great value-for-money Thai and Western brunch options. The signature Thai Basil Pork Sandwich and Fresh Fruit Yogurt Bowl are highly recommended\u2014refreshing yet rich in flavor, where sweet and sour tropical fruits pair appetizingly with creamy yogurt. Friendly service and unbeatable ocean views give it high satisfaction ratings among tourists.", "name": "Audy Restaurant \u0026 Cafe", "transport": "Easily reachable on foot along the Kamala Beach promenade."}, {"address": "96/42 Moo 3, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.2 Stars | A family-friendly ocean-view cafe and brunch spot located next to Sunwing Resort. The omelets here are soft and smooth, filled with abundant cheese and fresh mushrooms, delivering a burst of creamy savory sweetness in every bite. Looking out onto the deep blue ocean, refreshing cold brew coffee and coconut ice cream enhance the vibrant tropical holiday feel.", "name": "Sunset Breeze Restaurant \u0026 Cafe", "transport": "Turn off the main road in Kamala toward Sunwing Resort and walk toward the beach side."}, {"address": "106/18 Moo 3, Surin Beach, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | A trendy niche cafe with a modern hip design, welcoming guests with fine pour-over coffee and high-quality healthy brunch. Highly recommended are the warm quinoa salad and shrimp quiche\u2014the quiche crust is buttery crisp while the filling is soft and wonderfully aromatic. The minimalist and elegant environment attracts many independent travelers and digital nomads to spend a relaxing afternoon here.", "name": "Mojo Cafe \u0026 Bistro Surin", "transport": "Located on the main commercial street of Surin Beach; take a taxi to the entrance of Surin Beach."}, {"address": "Kamala Beach Promenade, Kathu District, Phuket 83150", "feature": "\u2b50 4.1 Stars | The ocean-view Kamala branch of the internationally renowned coffee chain, offering consistent quality and a wide variety of all-day brunch. The classic hearty English breakfast includes pan-fried bacon, juicy sausages, and sunny-side-up eggs, alongside golden-crisp hash browns bursting with savory crunch. Featuring comfortable air-conditioned indoors and outdoor sea-view seating, it is hugely popular among families.", "name": "The Coffee Club - Kamala Beach", "transport": "Located in the bustling commercial area along Kamala Beach, easily accessible on foot."}, {"address": "Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 Stars | A hidden gem cafe right next to Kamala Beach, featuring a minimalist wooden aesthetic and open-air sea-view seating. The signature Acai Bowl is topped with fresh mango, banana, and crunchy granola, delivering a refreshing sweet-and-sour taste that is light and healthy. Paired with local coconut milk Americano, it is an ideal spot for relaxing by the ocean and capturing Instagram-worthy photos.", "name": "Soul Beach Cafe \u0026 Bar Kamala", "transport": "Walk north for about 3 minutes along the beach path from the southern end of Kamala Beach."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "118/19 Moo 3, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 Stars | A famous beach club located at the northern end of Kamala Beach, blending Balearic resort vibes with a stylish dining and lounge experience. It offers top-tier Mediterranean fusion cuisine and refined cocktails. The signature grilled seafood platter is crispy on the outside, tender on the inside, and incredibly appetizing when paired with a special lime-garlic sauce. The black truffle and wild mushroom pasta is rich and smooth, cooked to perfect al dente. As the sun sets, accompanied by upbeat electronic beats from renowned DJs and craft cocktails, it is a romantic hotspot and must-visit destination for countess Western tourists and trendy influencers coming to Phuket.", "name": "Cafe del Mar Phuket Beach Club \u0026 Bistro", "transport": "About a 10-minute walk from the center of Kamala Beach, or a 3-minute ride by Tuk-Tuk."}, {"address": "333, 333/3 Moo 3, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 Stars | Located on the front line of Kamala Beach inside InterContinental Phuket Resort, offering an exceptionally wide ocean view. The restaurant specializes in modern Mediterranean and Thai light bites alongside cocktails. The Thai herb-grilled fish comes highly recommended\u2014crispy skin, juicy and tender meat infused with a delicate aroma of lemongrass and kaffir lime leaves. Pair it with \u0027Kamala Sunset\u0027, a tropical fruit-infused cocktail that is refreshing, sweet, and tangy. Comfortable sofa loungers combined with sunset views allow diners to enjoy an incredible dining and relaxing experience amid romantic sea breezes.", "name": "Pine Beach Bar", "transport": "Located in the beachfront area of InterContinental Phuket Resort. Take a taxi directly to the resort entrance and walk to the beach."}, {"address": "15 Moo 6, Layi-Nakalay Road, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 Stars | Situated within the luxurious Andara Resort \u0026 Villas, seamlessly blending traditional Thai woodwork craftsmanship with a modern, stylish bar ambience. It specializes in refined, authentic Southern Thai cuisine and creative cocktails. The signature Massaman Beef Curry features beef slow-simmered for hours until melt-in-your-mouth tender, served in a rich, aromatic sauce with the comforting sweetness of coconut milk and spices. Paired with a custom ginger-herb cocktail, the flavors are exceptionally layered. High-quality service and an elegant poolside setting make it a favorite for vacationers seeking fine dining and a relaxed vibe.", "name": "Silk Restaurant \u0026 Bar", "transport": "Recommended to take a taxi or Grab to Andara Resort, about a 5-minute drive from Kamala Main Street."}, {"address": "18/40 Moo 6, Nakalay Road, Kamala, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 Stars | Perched on the rooftop of Cape Sienna Hotel, offering panoramic views of the stunning curved coastline of Kamala Bay and breathtaking sunsets. The bar serves high-quality Belgian beers, craft cocktails, and delicious Mediterranean-style bar bites. The classic Belgian Mussels Pot is stewed in white wine and garlic\u2014juicy, plump, and springy\u2014paired perfectly with warm, crusty artisanal bread for dipping. Not only is the food delicious, but the unbeatable night views and elevated perspective make it a top choice for romantic dates and honeymoons.", "name": "Vanilla Sky Bar \u0026 Gastro Pub", "transport": "Recommended to take a taxi to the rooftop of Cape Sienna Resort, about a 3-minute drive from the southern end of Kamala Beach."}, {"address": "5/26 Moo 3, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.7 Stars | A cozy, hidden gem of a bistro located at the border of Surin and Kamala, renowned for its top-quality grilled steaks and classic custom cocktails. Its signature Angus Ribeye Steak features a seared, aromatic crust with tender, juicy pink meat inside, delivering rich flavor in every bite. Side dishes like garlic fries and roasted seasonal vegetables are crafted with equal care. Bartenders create customized cocktails based on guest preferences, while the cozy, relaxed British-pub atmosphere and incredibly friendly service make many returning guests consider it the best dinner bar in the Phuket beach area.", "name": "Benny\u0027s Cocktails \u0026 Grill", "transport": "Located along the main road to Surin Beach; taking a Tuk-Tuk or Grab is recommended."}, {"address": "106/46 Moo 3, Surin Beach Road, Cherngtalay, Thalang District, Phuket 83110", "feature": "\u2b50 4.4 Stars | Located within Twinpalms Phuket on Surin Beach, this open-air, trendy bistro exudes a modern art gallery feel. The restaurant serves exquisite traditional Thai dishes alongside Western fusion grills. The signature Pan-Seared Yellowtail with Thai Spicy and Sour Sauce features crispy fish skin and delicate, tender meat, paired with a slightly spicy, sweet, and tangy special sauce that stimulates the appetite. The open-plan bar area with enchanting lighting hosts live jazz performances on weekends, making it immensely popular among travelers who love refined luxury.", "name": "Oriental Spoon Grill \u0026 Bar", "transport": "Located inside Twinpalms Phuket near the entrance of Surin Beach, just a 3-minute walk to the beach."}, {"address": "Kamala Bea
