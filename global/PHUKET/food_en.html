greenery, this brunch cafe serves international breakfasts and dreamy desserts. The crowd-favorite Avocado Poached Egg Toast features thick-cut sourdough smeared with rich homemade avocado mash, topped with perfectly runny poached eggs, chili threads, and crushed nuts for a juicy, refreshing bite. Their rich Matcha Latte boasts a well-balanced bittersweet flavor, making it a favorite among female guests. The bright, spacious setting is perfect for friends to unwind and enjoy a slow morning.", "name": "Cafe 101 Patong", "transport": "Easily accessible on foot or by motorbike along Rat U Thit 200 Pee Road, near the Banzaan Fresh Market area."}, {"address": "162/8-9 Phrabaramee Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | An open-air brunch spot full of resort vibes, renowned for hearty Western breakfast platters and specialty cold drinks. The \u0027American Pancake Tower\u0027 layers freshly cooked pancakes topped with rich maple syrup and fresh whipped cream\u2014crispy on the outside, soft inside, and blissfully sweet. Their special Coconut Cold Brew Coffee fuses sweet local coconut water with rich espresso for an incredibly refreshing drink. The outdoor seating lets you soak in Patong\u0027s energetic street atmosphere while enjoying your meal, making it a hit with Western travelers.", "name": "Bite Cafe \u0026 Restaurant Patong", "transport": "Located along Phrabaramee Road near northern Patong Beach, about a 2-minute motorbike ride."}, {"address": "141/5 Rat U Thit 200 Pee Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | Exuding warm Italian charm, this unique brunch bistro specializes in healthy Mediterranean breakfasts and freshly pressed Italian paninis. The signature Prosciutto \u0026 Cheese Panini is pressed to perfection with an extra crispy crust, overflowing with melted Parmesan cheese and savory prosciutto for a flavorful, mouthwatering bite. Their custom espresso blend is rich and bold, perfectly paired with fresh homemade Tiramisu. With its cozy, welcoming interior feeling just like home, it\u0027s a great spot for tourists to savor authentic Italian breakfast treats.", "name": "Sole Mio Patong Cafe \u0026 Bistro", "transport": "Located on Rat U Thit 200 Pee Road, about a 7-minute walk from Bangla Road."}, {"address": "34/46 Prachanukhro Rd, Patong, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | Tucked away in southern Patong, this charming cafe is a favorite among dessert lovers and Instagrammers alike. Highlighting Australian-style brunch and exquisite handcrafted cakes, its signature French Toast is golden-fried in egg batter and topped with fresh berries and vanilla ice cream\u2014a heavenly contrast of hot and cold. The specialty Pink Rose Latte is visually stunning, offering subtle floral and milky notes. With its dreamy pastel-pink and white decor and soothing music, it provides a quiet, sweet haven away from Patong\u0027s vibrant nightlife.", "name": "Sweet Pito Cafe \u0026 Bistro", "transport": "Located on Prachanukhro Road at the south end of Patong, about a 6-minute walk from the southern end of Patong Beach."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Phra Barami Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.3 Stars | Located near the hillside at the northern end of Patong Beach, Kaab Gluay is an authentic Southern Thai seafood bistro highly praised by locals and seasoned foodies alike. The atmosphere is casual and lively. Signature dishes include rich and spicy Southern Thai yellow curry crab, aromatic stir-fried palm hearts, and charcoal-grilled giant prawns. The sauces are layered, satisfyingly spicy and tangy, with coconut milk notes and fresh herbs bursting on the palate\u2014a perfect symphony of bold flavors and seafood sweetness.", "name": "Kaab Gluay Restaurant", "transport": "About a 5 to 8-minute ride by Tuk-Tuk or Songthaew from central Patong Beach."}, {"address": "223 Prabaramee Road, Patong Beach, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.5 Stars | Perched on the cliffs at the northern end of Patong Beach, Baan Rim Pa is a spectacular scenic bistro specializing in refined Royal Thai court cuisine alongside an extensive wine selection. Dine on classic Tom Yum seafood soup and Thai-spiced roasted duck while taking in sweeping sunset views of Patong Bay and listening to the sound of crashing waves. The dishes feature finely balanced flavors\u2014sour, spicy, sweet, and savory\u2014making it a top choice for a romantic evening and high-end traditional Thai dining.", "name": "Baan Rim Pa Patong (Royal Thai Cliffside Bistro)", "transport": "About a 15-minute walk or a 5-minute taxi ride from Patong Night Market or Bangla Road."}, {"address": "186 Rat-U-Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.4 Stars | No.6 Restaurant is an immensely popular budget-friendly local spot in Patong Beach, often drawing long queues. Their Pad Thai is packed with \u0027wok hei\u0027 (smoky wok aroma)\u2014springy rice noodles soaked in sweet, tangy, and spicy sauce, topped with fresh prawns and crushed peanuts for wonderful texture. The shrimp green curry and stir-fried basil pork rice are ultimate crowd-pleasers. Generous portions at very affordable prices make this classic diner a must-visit.", "name": "No.6 Restaurant", "transport": "Located near Jungceylon Shopping Center, about a 3-minute walk away."}, {"address": "136 Thaweewong Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.2 Stars | Situated in the heart of Patong Beach Road, Savoey Seafood is a classic establishment combining live seafood with signature Thai cocktails. Freshly caught lobster, crab, and grouper are displayed out front daily for guests to pick their preferred cooking style. The signature garlic and black pepper stir-fried lobster features firm, succulent meat infused with irresistible pepper aromas. Outdoor seating lets you sip ice-cold beer or handcrafted cocktails while enjoying the tropical ocean breeze.", "name": "Savoey Seafood Restaurant", "transport": "Located on Thaweewong Road (Beach Road), just a 2-minute walk from Bangla Road."}, {"address": "223/2 Prabaramee Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.6 Stars | Situated along the northern coastline of Patong Beach, Meg Khram is a trendy bistro fusing modern Chef\u0027s Table concepts with refined Southern Thai seafood. Boasting an unbeatable ocean-view terrace and stylish wooden design, signature dishes like crispy soft-shell crab with green mango salad offer a refreshing, sweet-and-sour crunch. Craft botanical cocktails are perfect for a tipsy evening, complemented by live music at night\u2014ideal for a relaxing and romantic night out.", "name": "Meg Khram The Chef\u0027s Table", "transport": "About a 5-minute drive from Bangla Road, or a 12-minute walk north along Beach Road."}, {"address": "10/1 Royal Palm Beach Front, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.5 Stars | Euro Thai is a cozy, home-style bistro co-operated by a Thai owner and an expat chef, serving high-quality, reasonably priced Thai favorites and European fusion dishes. Their Tom Yum seafood soup is rich and tangy, loaded with generous portions of seafood, while the Massaman beef curry is stewed until tender and infused with deep coconut milk and cumin aromas. Friendly service and consistently superb flavors make it a favorite among tourists and expats alike.", "name": "Euro Thai Restaurant", "transport": "Located in a side street off Patong Beach Front Road, about a 3-minute walk from La Flora Resort."}, {"address": "249 Prabaramee Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.3 Stars | Perched on the cliffside connecting Patong and Kalim beaches, Pan Yaah offers panoramic nighttime views of Patong Bay. Built with traditional wooden Thai pavilions, the atmosphere is serene and classic. Menu highlights include lemongrass grilled fish with crispy skin and tender meat served alongside a tangy lime dipping sauce, as well as rich red curry duck. Arriving in the late afternoon to sip signature cocktails while watching the sunset is an unforgettable experience.", "name": "Pan Yaah Thai Restaurant", "transport": "Located along the cliffside road north of Patong; recommended to take a Tuk-Tuk or taxi, about a 5-minute drive."}, {"address": "39 Thaweewong Rd, Pa Tong, Kathu District, Phuket 83150, Thailand", "feature": "\u2b50 4.4 Stars | Located on the rooftop of La Flora Resort, The Surface is one of Patong Beach\u0027s premier open-air rooftop bar-restaurants. Here, guests enjoy panoramic views of the Andaman Sea sunset and Patong\u0027s vibrant nightlife skyline. The menu features creative Thai fusion dishes and gourmet grills, such as Thai-spiced grilled ribs and steamed sea bass with lime\u2014juicy, tender, and packed with flavor. Paired with tropical fruit cocktails crafted by expert mixologists, it is the perfect destination for experiencing Patong\u0027s sophisticated night scene.", "name": "The Surface Restaurant \u0026 Bar", "transport": "Located on the rooftop of La Flora Resort in central Patong Beach Road, easily accessible on foot."}], "name": "Specialty Bistro Bars \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Phangmuang Sai Kor Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.7 stars | Located in the heart of Patong Beach, this vegan restaurant is a paradise for plant-based eaters, serving traditional 100% plant-based Thai cuisine. Their Vegan Pad Thai and Green Curry are highly recommended; the Pad Thai noodles are perfectly chewy with a distinct wok hei flavor, topped with crispy soy protein and crushed fresh peanuts for incredible texture depth. Free from added MSG and purely plant-based, it is a favorite among Western backpackers and health-conscious travelers.", "name": "Yo Green Vegan \u0026 Vegetarian Restaurant Patong", "transport": "About an 8-minute walk from Jungceylon Shopping Center."}, {"address": "Thawewong Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | A cozy cafe tucked away in an alley near Patong Beach, featuring healthy brunches and 100% vegan desserts. Their Smoothie Bowls are freshly blended using local tropical fruits and fresh coconut water, offering a creamy, ice-cream-like texture that is refreshingly cool with natural fruity aromas. The Vegan Cheeseburger is another absolute highlight\u2014the plant-based patty is seared crisp on the outside and tender inside, paired with a special vegan sauce that rivals real meat.", "name": "Soul Cafe Vegan \u0026 Vegetarian", "transport": "Walk along Patong Beach Road (Thawewong Rd) into the alley at the midpoint to reach the cafe."}, {"address": "Soi Phrabarami 3, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.8 stars | Highly rated for authentic Indian cuisine, this restaurant offers an extensive selection of traditional vegetarian dishes loved by international travelers and local vegetarians alike. The Paneer Butter Masala comes highly recommended\u2014cubes of cottage cheese melt in your mouth, saturated with rich spices and a creamy tomato sauce. Pair it with freshly baked, soft yet chewy Garlic Naan for an irresistibly aromatic feast.", "name": "Amritr Royal Indian Restaurant Patong", "transport": "About a 3-minute Tuk-Tuk ride from the northern end of Patong Beach."}, {"address": "Sai Kor Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | Hidden within the lively Banzaan Fresh Market Night Market are surprising vegetarian stalls\u2014a top choice for experiencing authentic local street food. The standout items are Pad Thai Jay (Vegan Pad Thai) and Veggie Spring Rolls. The Pad Thai noodles are light, slightly sweet, soaked in tangy-spicy sauce, and topped with crisp bean sprouts; the spring rolls are fried to a golden crunch, filled with mushrooms and glass noodles, offering a crunchy bite packed with local flavor.", "name": "Banzaan Night Market Vegetarian Stalls", "transport": "Located right behind Jungceylon Shopping Center, about a 3-minute walk away."}, {"address": "Kaza Hotel Patong, 241 Rat U Thit 200 Pee Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | Tucked inside a Patong resort, this famous Indian restaurant serves high-caliber North Indian vegetarian dishes. The signature Dal Tadka is slow-cooked to perfection, featuring a rich, velvety texture infused with elegant aromas of cumin and clarified butter. Served with crispy Papadum and fragrant basmati rice, the vibrant spices burst in your mouth for an unforgettable finish.", "name": "Navrang Mahal Indian Restaurant", "transport": "About a 10-minute walk from Bangla Road."}, {"address": "Nanai Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | A budget-friendly local Thai eatery crafted specifically for vegetarians, specializing in strict vegan (Jay) Thai food. Their Vegetarian Tom Yum soup comes highly recommended: simmered with lemongrass, kaffir lime leaves, and wild mushrooms, the hot and sour broth delivers a satisfying kick. The mushrooms absorb the rich broth, offering a juicy, plump texture that perfectly captures the spicy-sour essence of Thai cuisine without needing any fish sauce.", "name": "Tantawan Vegetarian Restaurant Patong", "transport": "About a 5-minute motorbike or Tuk-Tuk ride along Nanai Road."}, {"address": "Jungceylon Shopping Center, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | An authentic South Indian vegetarian spot located next to the shopping mall, famous for its freshly made Dosas. The signature Masala Dosa features a paper-thin, golden crispy exterior wrapped around a rich, savory spiced potato filling. Dipped in special coconut chutney and sambar, the interplay of crispy and tender textures creates an extraordinary flavor profile.", "name": "Madras Cafe Patong", "transport": "Located on the outer perimeter of the 1st floor of Jungceylon Shopping Center, exceptionally convenient to reach."}, {"address": "Prachanukhro Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | Combining refined presentation with the essence of traditional Thai cooking, this elegant vegetarian restaurant excels in every detail. Their Vegan Red Curry Coconut Tofu is particularly praised\u2014lightly fried to golden perfection on the outside while remaining silky smooth inside, coated in a rich, sweet red curry coconut sauce. Served over aromatic jasmine rice, the velvety smooth textures melt on the tongue, offering a rare high-quality plant-based dining experience in Patong.", "name": "Nirvana Plant-Based Cuisine Patong", "transport": "Located at the southern end of Patong Beach, about a 6-minute walk from Phuket Simon Cabaret."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "74, 51 Nanai Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | Located at the entrance of Banzaan Market, these night stalls feature made-to-order grilled giant prawns and massive squid as their highlight. The squid is plump and bouncy, brushed with a signature Thai hot and sour lime sauce that bursts with sweet, tangy, and spicy flavors on your palate. With a lightly charred charcoal aroma on the outside, it\u2019s the top choice for tourists seeking a nighttime seafood feast.", "name": "Banzaan Seafood Market Night Stalls", "transport": "About a 3-minute walk from the back entrance of Jungceylon Shopping Center."}, {"address": "162/51-52 Phra Barami Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.5 stars | Patong\u0027s most popular freshly made street dessert. The roti master stretches the dough paper-thin, frying it on a griddle until golden and crispy. Filled with hot sliced bananas and drizzled with rich condensed milk and chocolate syrup, it\u2019s crispy on the outside, soft inside, sweet without being overwhelming\u2014pure bliss in every bite.", "name": "Malin Plaza Banana Roti", "transport": "Take a Tuk-Tuk to the entrance of Malin Plaza; the pancake stall is about a 1-minute walk inside."}, {"address": "237/9 Rat Uthit Song Roi Pi Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.2 stars | This charcoal-grilled pork skewer stall always attracts long queues. Made with pork collar marinated in palm sugar, fish sauce, and coriander roots, the slightly charred golden exterior locks in juicy tenderness with a delightful sweet aroma. Paired with warm sticky rice, it is a budget-friendly authentic favorite for both locals and tourists.", "name": "OTOP Market Moo Ping (Thai Grilled Pork Skewers)", "transport": "Located in the food zone inside OTOP Market, about an 8-minute walk from Patong Beach Road."}, {"address": "Thaweewong Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.4 stars | Served in a freshly halved coconut shell, this creamy ice cream is made from pure coconut milk, topped with fragrant sticky rice, roasted peanuts, and coconut jelly. Smooth and refreshing, with a rich coconut flavor that isn\u0027t sweet or heavy, the combination of crunchy peanuts and chewy sticky rice provides delightful texture layers to beat the tropical heat.", "name": "Patong Beach Coconut Ice Cream", "transport": "Found along the street vendor area on Thaweewong Road (Patong Beach Road)."}, {"address": "74, 51 Nanai Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.1 stars | Stir-fried over high heat, this Pad Thai is full of flavor. The rice noodles absorb the tangy and sweet essence of tamarind sauce, cooked to chewy perfection with a rich breath of the wok. Served with fresh shrimp, dried tofu, bean sprouts, and crushed peanuts, finished with a squeeze of fresh lime juice and chili flakes\u2014it weaves together sour, sweet, spicy, and salty for the most authentic Thai street taste.", "name": "Banzaan Night Market Pad Thai", "transport": "Located in the night market square in front of Banzaan Fresh Market, directly behind Jungceylon Shopping Center."}, {"address": "162/51-52 Phra Barami Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | A traditional Thai griddle snack made from coconut milk and rice flour batter cooked in a dimpled iron pan. The edges are thin and crispy like crackers, while the center features a warm, semi-liquid melt-in-your-mouth coconut pudding. With a subtle sweet-and-savory balance topped with spring onions or sweetcorn, it\u0027s a nostalgic treat loved by many.", "name": "Malin Plaza Kanom Krok (Thai Coconut Pancakes)", "transport": "Located at a middle stall in the cooked food area of Malin Plaza."}, {"address": "237/9 Rat Uthit Song Roi Pi Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.6 stars | Freshly sliced juicy ripe mango served with warm, soft coconut sticky rice and sprinkled with crispy toasted yellow mung beans. The mango is sweet and succulent, while the sticky rice absorbs creamy, slightly salty coconut milk. Combining soft, smooth, and crunchy textures in every bite, this sweet-and-savory classic is unforgettable.", "name": "OTOP Night Market Mango Sticky Rice", "transport": "Located in the central hot food vendor area of OTOP Night Market."}, {"address": "Rat Uthit Song Roi Pi Rd, Pa Tong, Kathu District, Phuket 83150", "feature": "\u2b50 4.3 stars | A signature Thai night market delicacy. Whole fresh fish is coated in a thick layer of coarse salt and slow-grilled over charcoal. The salt shell locks in moisture, leaving the fish flesh incredibly tender, juicy, and completely odor-free once peeled. Dipped in spicy garlic green seafood sauce, its fresh flavor earns rave reviews from foodies worldwide.", "name": "Patong Night Market Salt-Grilled Fish", "transport": "Can be found along the night market stalls on Rat Uthit Song Roi Pi Road."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Patong Beach and Nightlife Area"}, "phuket_town": {"categories": {"cat_1": {"items": [{"address": "48 Dibuk Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | Housed inside a century-old Sino-French colonial mansion in Phuket Old Town, Raya Restaurant is one of the most famous and iconic Southern Thai culinary landmarks in the area. Its signature dish, \u0027Crab Meat Curry with Rice Noodles,\u0027 is a favorite among both tourists and epicures alike. Generous chunks of fresh, sweet crab meat are seamlessly blended with a rich, aromatic yellow curry, served alongside refreshing shredded coconut and fine rice vermicelli. The dish greets your palate with creamy coconut milk before delivering the fiery kick and herbal complexity characteristic of Southern Thai cuisine. Decorated with charming vintage floor tiles and antique decor, stepping inside feels like traveling back in time to the golden era of Phuket\u0027s tin mining boom.", "name": "Raya Restaurant", "transport": "About a 5-minute walk from the Phuket Thai Hua Museum in Phuket Old Town."}, {"address": "48/1 Thepkasattri Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Awarded a Michelin Bib Gourmand, One Chun Cafe \u0026 Restaurant is celebrated for its vintage hipster aesthetic and authentic Phuket homestyle traditional dishes. The restaurant\u0027s crowning glory is its \u0027Phuket Stewed Pork Belly,\u0027 a traditional home-cooked favorite simmered for hours with dark soy sauce, garlic, and pepper until the meat melts in your mouth\u2014rich without being greasy, carrying a sweet, savory soy glaze with deep garlic-pepper undertones that goes perfectly with steamed rice. Other crowd-pleasers like saut\u00e9ed stinky beans with shrimp paste and yellow curry fish soup are must-orders at every table, showcasing the unique Sino-Thai fusion food culture of Phuket Old Town.", "name": "One Chun Cafe \u0026 Restaurant", "transport": "Located near the intersection of Thepkasattri Road and Dibuk Road, about a 6-minute walk from the Phuket Old Town Clock Tower."}, {"address": "5 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | Instantly recognizable by the giant lobster landmark hanging on its exterior wall, Tu Kab Khao is a premier traditional Thai restaurant in Phuket Old Town that blends classical luxury with authentic heritage flavors. The restaurant\u0027s name means \u0027the food cupboard of yesteryear,\u0027 and its kitchen strictly adheres to century-old Southern Thai family recipes. Unmissable signature dishes include the \u0027Phuket Braised Pork Belly\u0027 and the \u0027Fiery Southern Thai Yellow Curry with Stewed Fish\u0027\u2014the sweet-and-savory sauce thoroughly coats tender pork belly for a smooth, rich taste rooted in deep spice profiles. The coconut milk stewed bamboo shoots and turmeric fried fish are also spectacular. Magnificent antique crystal chandeliers and South Seas-inspired artwork create an exceptionally elegant dining ambiance.", "name": "Tu Kab Khao Restaurant", "transport": "Located on Phangnga Road, just a 2-minute walk from The Memory at On On Hotel."}, {"address": "214, 2 Phuket Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.1 stars | Operating for decades, Mee Ton Poe is one of Phuket\u0027s most famous historic Chinese immigrant noodle shops. Its signature dish, \u0027Fried Hokkien Noodles,\u0027 features thick yellow noodles stir-fried over high heat with dark soy sauce, seafood, pork, and leafy greens, creating an irresistible wok-hei aroma before being topped off with a poached egg in the center. Break the yolk and toss it with the savory sauce\u2014the yellow noodles absorb the sweet essence of the seafood and the velvety richness of the egg yolk, rendering them chewy, silky, and fragrant. Pair it with the complimentary raw shallots and special chili powder on the table to take the flavor to the next level, making it a beloved haunt for both locals and travelers.", "name": "Mee Ton Poe Hokkien Noodles", "transport": "Ideally located right opposite the Clock Tower roundabout, within easy walking distance."}, {"address": "Soi Romanee / Yaowarat Rd intersection, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.6 stars | Apon Mae Sunee is the most legendary traditional street dessert stall in Phuket Old Town, boasting a history spanning several decades. Watching the preparation of this traditional Southern Thai snack, called Apon, is a fascinating visual spectacle: batter made from coconut milk, flour, sugar, and pandan is poured into small cast-iron pans and slowly charcoal-roasted until the edges turn golden and crispy while the center stays tender and fluffy. Take a bite, and you\u0027re greeted with an ultra-crispy crunch at the rim followed by a warm, fragrant burst of sweet, milky coconut inside. It\u0027s an unmissable, nostalgic street food classic to grab while wandering through the historic lanes of Old Town.", "name": "Apon Mae Sunee", "transport": "Located near the entrance of Yaowarat Road alley, close to Soi Romanee, easily accessible on foot."}, {"address": "26/41 Bangkok Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 stars | Founded over a century ago, Boon Rat Dim Sum is a classic morning institution where Phuket Old Town residents begin their day. Heavily influenced by Hokkien and Straits Chinese heritage, enjoying hot tea alongside dim sum for breakfast is a quintessential local tradition here. The dim sum offerings are delicate and exquisitely crafted, including shumai, har gow (shrimp dumplings), spare ribs, steamed buns, and specialty Phuket fish balls. Steaming hot baskets arrive with translucent wrappers revealing juicy, tender fillings that pair deliciously with \u0027Nam Som Gorz,\u0027 a unique local sweet-and-spicy dipping sauce. Queues of local foodies form every early morning, making this an essential stop for anyone wishing to experience an authentic Phuket breakfast.", "name": "Boon Rat Dim Sum", "transport": "About a 5-minute walk from the Clock Tower roundabout to the main branch on Bangkok Road."}, {"address": "18 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 stars | Kopitiam by Wilai is a renowned historic establishment that seamlessly blends nostalgia of a Straits Chinese \u0027Kopitiam\u0027 (coffee shop) with authentic home-style Southern Thai dishes. Outfitted with wooden tables and chairs, vintage photos, and antique decor, the restaurant oozes a charmingly retro vibe. Signatures include \u0027Southern Thai Green Curry,\u0027 \u0027Pad Thai,\u0027 and \u0027Traditional Butter Toast with Soft-Boiled Eggs.\u0027 The signature Pad Thai features springy noodles tossed with fresh prawns and crunchy crushed peanuts for a well-balanced sweet and tangy profile. Pair it with a rich, old-school iced coffee\u2014its mildly bitter yet sweet taste is incredibly refreshing, making this an ideal dining pitstop while exploring Thalang Road.", "name": "Kopitiam by Wilai", "transport": "Located directly on Thalang Road, the heart of Phuket Old Town, easily accessible on foot."}, {"address": "6 Thepkasattri Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Honored with a Michelin Bib Gourmand, Roti Taew Nam is one of the premier traditional roti shops in Phuket Old Town with decades of history. Roti here is cooked over a traditional charcoal stove, giving the flatbread a golden, crispy exterior with airy, buttery layers on the inside. The iconic order is the \u0027Crispy Roti with Sunnyside-up Egg\u0027 served alongside a bowl of rich, spicy beef or chicken curry. Dipping the crispy roti into the savory curry sauce and runny egg yolk delivers an explosion of fragrant flavor, making it a famous pilgrimage spot for locals and international visitors alike.", "name": "Roti Taew Nam", "transport": "Located at the start of Thepkasattri Road near the Thalang Road intersection, about a 3-minute walk."}], "name": "Iconic Local Heritage Eateries"}, "cat_2": {"items": [{"address": "61 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | A retro-style cafe combining an independent bookstore and art exhibition space, located on vibrant Thalang Road in Phuket Old Town. It preserves the high skylight ceiling and red brick walls of Sino-Portuguese architecture, with the rich aroma of freshly ground coffee and books lingering in the air. The store specializes in pour-over single-origin coffee that is rich and smooth, paired with freshly toasted hot-pressed sandwiches and handmade cheesecake. The cheesecake is rich, dense, and creamy with a crispy crust. Whether you are a tourist taking photos or a local hipster reading and working, you can enjoy a tranquil and comfortable brunch here.", "name": "Bookhemian", "transport": "Walk to the middle section of Thalang Road in Phuket Old Town to arrive."}, {"address": "15 Soi Romanee, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Nestled in Soi Romanee, the most colorful street in Phuket Old Town, this cafe perfectly blends traditional Sino-Portuguese architecture with modern minimalist industrial style. Focusing on specialty coffee bean roasting, its signature Dutch cold drip and cold brew nitro coffee are remarkably smooth, featuring rich floral-fruity aromas and a pleasantly subtle tart finish. For brunch, try the hot-pressed croissants and Thai-flavored pound cake\u2014the crispy-outside, soft-inside texture paired with deeply layered coffee makes first-time visitors loyal regulars. It is an exquisite gem hidden in the alleys of Old Town.", "name": "Dou Brew Coffee \u0026 Craft", "transport": "About a 1-minute walk from the entrance of Soi Romanee in Phuket Old Town."}, {"address": "121 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | A branch of the popular Chiang Mai brand GRAPH in Phuket Old Town, featuring dark wood and vintage cool-toned decor that exudes an elegant, calm minimalist aesthetic. Renowned for its creative specialty coffee mocktails, such as \u0027Graph No. 8\u0027 which blends sparkling water, juice, and espresso\u2014delivering a refreshing, charmingly bubbly and fruity taste perfect for Phuket\u0027s hot weather. During brunch, they serve special avocado toast and sourdough sandwiches with crispy crusts, soft interiors, and fresh, abundant toppings, loved by Western tourists and coffee enthusiasts alike.", "name": "GRAPH Phuket", "transport": "About a 3-minute walk along Phangnga Road."}, {"address": "27 Yaowarad Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A themed cafe inspired by the magical world of Harry Potter. With its slanted entrance and mysterious magical British decor, it feels like stepping straight into Diagon Alley. Besides serving beer at night, it is a super popular spot for brunch, coffee, and desserts during the day. The signature Butterbeer (non-alcoholic) features a rich, creamy froth with sweet caramel notes and a wonderfully complex taste. Paired with their signature Magical Black Burger or freshly baked cinnamon rolls\u2014crispy on the outside, moist and sweet inside\u2014it delivers both visual impact and delicious flavor, attracting countless tourists for photo check-ins.", "name": "Hog\u0027s Head Pub \u0026 Cafe", "transport": "Located on Yaowarat Road, about a 2-minute walk from the corner of Thalang Road."}, {"address": "8 Krabi, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | An exquisite cafe located on Krabi Road that seamlessly merges Japanese minimalist tea culture with modern cafe aesthetics. Carefully selecting Kyoto-grade Uji matcha and specially chosen local coffee beans, their freshly whisked matcha latte offers a rich, perfectly balanced bitter-sweet flavor with a smooth texture. For brunch desserts, the Japanese crepe cake and Matcha Basque cheesecake stand out\u2014a melt-in-your-mouth velvety texture accompanied by deep tea aromas, sweet without being overwhelming. The minimalist white wood-toned space offers great relaxation, making it a top choice to enjoy an elegant, slow-paced afternoon tea and brunch in Old Town.", "name": "Ryn - Premium Tea \u0026 Cafe", "transport": "Located on Krabi Road near the Thai Hua Museum, within walking distance."}, {"address": "175 Yaowarad Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Tucked away in a stunning pastel-yellow Sino-Portuguese historic mansion, this place combines European-style brunch, specialty coffee, and a Bohemian lifestyle concept store. Featuring a lush green courtyard and high-ceilinged, bright indoor spaces, the brunch menu offers healthy and delicious Acai Bowls and Eggs Benedict. The acai bowls are cool, tangy, sweet, and rich in texture, topped with fresh fruits and nuts for a healthy flavor. The signature lattes are creamy and smooth, attracting countless international travelers who love taking photos and enjoying a slow-paced lifestyle.", "name": "Endless Summer Cafe \u0026 Concept Store", "transport": "Located at the further end of Yaowarat Road, about a 5-minute walk from the core Old Town area."}, {"address": "6 Krabi, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | An independent micro-roastery themed after a vintage school classroom, seamlessly integrating old brick walls with reddish-brown wooden desks and chairs. They roast coffee beans sourced from Northern Thailand and around the world in-house, serving single-origin pour-overs praised by local coffee connoisseurs. The brunch focuses on freshly toasted Thai pandan toast and artisanal burgers; the pandan jam is sweet, fragrant, and smooth, while the toast is lightly charred outside and soft inside with distinct layers of flavor. Its unique nostalgic vibe and high-quality coffee make it a highly popular brunch spot in Phuket Old Town.", "name": "Campus Coffee Roaster", "transport": "Located at the start of Krabi Road, near the intersection with Thalang Road, within easy walking distance."}, {"address": "10 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | A retro gallery cafe steeped in Old Phuket nostalgia, preserving the original wooden doors and displaying historical photos of the Sino-Portuguese heritage house. The cafe serves traditional Thai iced coffee (Oliang) and custom Thai milk tea\u2014rich in tea aroma and pleasantly sweet. Brunch focuses on traditional Old Phuket snacks and fresh paninis; the panini crust is toasted to a delightful crunch, filled with hot, melty cheese and ham for fantastic flavor. A fantastic spot to experience the traditional atmosphere and tasty light bites of old Phuket.", "name": "Chino Cafe Gallery", "transport": "Located inside the historic street area of Thalang Road, within walking distance."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "48/1 Dibuk Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A legendary Phuket restaurant set inside a century-old Sino-Portuguese mansion. Its signature Crab Meat Yellow Curry served with rice vermicelli features sweet, generous chunks of fresh crab meat simmered in a rich, creamy coconut milk yellow curry sauce\u2014bursting with fragrant Southern Thai spices. The braised pork belly is melt-in-your-mouth tender, rich without being greasy, beautifully showcasing the fusion of Hokkien and Thai culinary heritage. A classic local staple you cannot miss when visiting Old Town.", "name": "Raya Restaurant", "transport": "About a 5-minute walk from the Phuket Old Town Clock Tower."}, {"address": "48/1 Thep Krasattri Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A popular vintage bistro honored with a Michelin Bib Gourmand, decorated with 1950s antique clocks and old-school TVs that create a rich nostalgic ambiance. Its signature Yellow Curry Crab Soup is incredibly rich, spicy, and packed with plump, sweet crab meat in every bite. Pair it with their slow-braised secret pork belly\u2014tender, juicy, and infused with savory-sweet spice essence. Accompany your meal with a cold local craft beer or cocktail for a wonderfully layered flavor experience loved by both tourists and local foodies.", "name": "One Chun Cafe \u0026 Restaurant", "transport": "Located near the intersection of Thep Krasattri Rd and Dibuk Rd, about a 4-minute walk from the Thai Hua Museum."}, {"address": "8 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Famous for the giant lobster sculpture mounted on its exterior wall, this Michelin-recommended restaurant boasts an interior styled like an elegant mansion living room. Specializing in authentic, bold Southern Thai flavors, must-try dishes include stir-fried fiery shrimp with green peppercorns and Southern Thai sour curry fish soup\u2014delivering a powerful spicy-sour punch with a distinct citrus aroma. The house-special stewed pork belly features perfectly marbled meat that melts on the tongue with rich garlic and black pepper notes. Paired with craft cocktails, it is the ultimate evening spot for enjoying top-tier local cuisine amid historic Old Town charm.", "name": "Tu Kab Khao Restaurant", "transport": "Located on Phangnga Rd, near the Memory at On On Hotel, about a 2-minute walk."}, {"address": "168/9 Dibuk Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | A unique bistro that integrates Phuket\u0027s rich tin-mining history into its interior design, featuring high-ceiling metallic industrial decor paired with dark, moody tones. It excels in fusing modern creative cuisine with traditional Southern Thai flavors. The signature spiced BBQ pork ribs are fall-off-the-bone tender, coated in a tangy, spicy-sweet glaze with a delightful smoky char. At night, enjoy live music performances along with signature cocktails crafted from local fruits and herbs\u2014a captivating feast for both the palate and senses.", "name": "Dibuka Cafe and Restaurant", "transport": "Located on the west side of Dibuk Rd. It is recommended to take a Grab or Tuk-Tuk (about a 3-minute drive from the core area of Old Town)."}, {"address": "93 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A Michelin-recommended restaurant that meticulously recreates century-old Nyonya and Peranakan home-style dishes using traditional cooking techniques. The signature Fish Otak-Otak features a silky, pudding-like texture infusing rich coconut milk and kaffir lime aromas. The turmeric herb grilled fish offers crispy skin and juicy flesh, complemented by a fragrant house-made shrimp paste sauce for an unforgettable finish. Set in an elegant retro environment with curated wines and craft beers, it is a sophisticated choice for savoring Phuket\u0027s heritage culinary flavors.", "name": "The Charm Dining Room", "transport": "Located on Dibuk Rd, about a 2-minute walk from Raya Restaurant."}, {"address": "242/2 Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Run by the family behind the legendary Raya, this fresh, hipster-style restaurant presents classic Phuket cuisine with a modern, trendy flair. Highly recommended is their spicy dip made with fried shrimp paste, served alongside a platter of fresh seasonal vegetables\u2014vibrant, fiery, and wonderfully appetizing. The crispy fried pork with garlic chips offers a satisfying crunch while sealing in juicy, savory goodness. With bright white-and-green decor and crafted beverages, guests can enjoy authentic Southern Thai home-style cooking in a cozy, uplifting setting.", "name": "Chomchan by Raya", "transport": "Located on Yaowarat Rd, about a 3-minute Tuk-Tuk ride from the core walking street of Old Town."}, {"address": "175 Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Tucked inside a stunning century-old Sino-Portuguese mansion, this French-style concept bistro seamlessly integrates a fashion boutique and chic bar. It highlights French light bites and Mediterranean-Thai fusion delicacies, such as pan-seared salmon with Thai lime sauce\u2014boasting crispy skin, juicy salmon, and a zesty sauce that perfectly cuts through the richness. Sip a handcrafted tropical fruit cocktail in the lush courtyard garden and elegantly embrace Old Town\u0027s romantic, slow-paced lifestyle.", "name": "Endless Summer", "transport": "Located on Yaowarat Rd, about a 4-minute walk from the Phuket Old Town Mansion."}, {"address": "Khao Rang Hill, Muang, Phuket 83000", "feature": "\u2b50 4.3 stars | Perched atop Khao Rang Hill next to Phuket Old Town, this iconic scenic bistro offers panoramic views of the historic town and coastline. The kitchen serves up authentic Southern Thai specialties alongside custom drinks. Signature deep-fried Southern Thai fish with green mango salad dip features a crispy exterior, tender fish, and a refreshing zesty dip; the stir-fried crab meat with curry powder is intensely aromatic, creamy, and smooth. Enjoying a cold beer or cocktail while watching the sunset give way to Old Town\u0027s evening lights makes this the top choice for breathtaking views and local culinary delights.", "name": "Tunk-Ka Cafe", "transport": "Located on top of Khao Rang Hill. It is recommended to take a Grab or private charter from Old Town (about 8 to 10 minutes drive)."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "106 Phang Nga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Located on Phang Nga Road in Phuket Old Town, this highly popular vegan restaurant seamlessly blends Western casual dining with Thai flavors. The signature vegan burger features a homemade plant-based patty paired with rich house-made nut cheese and sweet caramelized onions\u2014juicy, flavorful, and rivaling real meat with every bite. The plant-based milkshakes and vegan cheesecake are also absolute must-try desserts. Bright, cozy, and filled with lush greenery, it\u0027s a top choice for modern vegetarian dining when visiting the Old Town.", "name": "The Vegan Table", "transport": "About a 3-minute walk from the Thai Hua Museum in Phuket Old Town."}, {"address": "281 Ranong Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Located near Jui Tui Shrine, Ruamjai is a highly representative traditional Thai vegetarian buffet in Phuket Old Town. It offers dozens of freshly made Southern Thai-style vegetarian stir-fries daily, notably the vegetarian Red Curry and crispy vegetarian fried fish patties, which are packed with authentic aromas of lemongrass and kaffir lime leaves. Simply get a bowl of steamed rice and top it with your choice of dishes. Extremely budget-friendly, it is a favorite among locals and tourists looking to experience authentic Phuket vegetarian culture.", "name": "Ruamjai Vegetarian Restaurant", "transport": "Located on Ranong Road, just a 2-minute walk from Jui Tui Shrine."}, {"address": "35/3 Hongyok Utis Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Dok Bua Vegetarian Restaurant is known for its wide variety of traditional Thai and Chinese vegetarian dishes. The signature vegetarian Tom Yum soup features a rich, spicy, and sour broth loaded with mixed mushrooms and special plant-based shrimp\u2014bouncy, flavorful, and perfectly capturing the essence of classic Tom Yum. Additionally, their vegetarian Hokkien fried noodles boast a strong wok hei (breath of the wok) with a delicious savory-sweet sauce, making it a favorite lunch spot for local vegetarians.", "name": "Dok Bua Vegetarian Restaurant", "transport": "About a 5-minute drive from the Phuket Old Town Clock Tower."}, {"address": "263 Ranong Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Located on historical Ranong Road in Phuket Old Town, Tian Chai specializes in Southern Thai-style vegetarian snacks and stir-fries. The crowd favorite is the Vegetarian Green Curry Rice Noodles, where silky noodles absorb the rich coconut milk and green curry aromas, paired with tender plant-based meat slices and fresh basil. Golden crispy fried tofu and vegetarian spring rolls are must-order finger foods, offering an addictive crispy-outside, tender-inside texture.", "name": "Tian Chai Vegetarian Restaurant", "transport": "Walk west along Ranong Road, about 150 meters from Jui Tui Shrine."}, {"address": "Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 stars | This long-standing vegetarian eatery is beloved by local foodies, specializing in traditional Thai-Chinese vegetarian dishes and pastries. Their signature Vegetarian Char Siu Rice is made with natural soy protein and drizzled with a balanced savory-sweet sauce, offering a firm and flavorful bite. Daily freshly fried vegetarian taro cakes and sweet potato cakes are popular traditional snacks, golden and crispy on the outside and soft and dense inside, packed with nostalgic flavor.", "name": "Jae Aeh Vegetarian Restaurant", "transport": "Located on Yaowarat Road, about a 4-minute walk from Old Town Street Art."}, {"address": "6 Phang Nga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Yo Green is a vegan restaurant focusing on organic health, ingeniously combining traditional Thai flavors with modern wellness concepts. The signature Vegan Pad Thai uses organic brown rice noodles tossed with fresh sprouts and a special sweet-and-spicy peanut sauce\u2014stir-fried to perfection without being oily, delivering a delightfully chewy texture. They also offer fresh organic green juices and raw desserts, attracting many health-conscious Western travelers.", "name": "Yo Green Vegetarian \u0026 Vegan Restaurant", "transport": "Located on Phang Nga Road, just a 2-minute walk from the entrance of the famous Soi Romanee."}, {"address": "154 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Located on Dibuk Road in Old Town, this hip, hipster-style vegan cafe offers exquisite plant-based meals and specialty drinks. The Vegan Acai Bowl is highly recommended, featuring a silky, refreshing slush base topped with fresh sliced fruits, homemade unsweetened granola, and shredded coconut\u2014richly layered and visually stunning. Their oat milk latte and vegan gluten-free brownie are also perfect pairings for a relaxing afternoon.", "name": "Soul Stuff Vegan Cafe", "transport": "Located on Dibuk Road, about a 6-minute walk from Old Town\u0027s historical buildings."}, {"address": "Ranong Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Phuket is the birthplace of the Nine Emperor Gods Vegetarian Festival, and the area right in front of Jui Tui Shrine is the ultimate hotspot to experience authentic street-style vegetarian food. The freshly fried vegetarian balls and Thai vegetarian sausages are iconic street snacks\u2014crispy on the outside, juicy and dense inside, and irresistible when dipped in sweet chili sauce. Whether during the festival or not, local vendors around the shrine serve delicious traditional vegetarian bites year-round, allowing visitors to savor authentic, culturally rich plant-based flavors.", "name": "Jui Tui Shrine Vegetarian Food Stalls", "transport": "Located on Ranong Road around the main entrance of Jui Tui Shrine."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Soi Soon Utis, Yaowarat Road, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Ah Pon is an iconic Hokkien-style traditional street snack in Phuket. Run by Auntie Sunee, this decades-old stall serves fresh, made-to-order crepes cooked over charcoal. The edges are paper-thin and ultra-crispy, while the center remains delightfully soft and chewy, bursting with rich coconut milk and subtle sweetness. Served piping hot straight into your hand, its heavenly crispy-yet-chewy texture makes it a must-have grab-and-go treat while exploring Old Town.", "name": "Ah Pon Mae Sunee Crepes (Ah Pon Mae Sunee / \u0e02\u0e19\u0e21\u0e2d\u0e32\u0e42\u0e1b\u0e49\u0e07 \u0e41\u0e21\u0e48\u0e2a\u0e38\u0e13\u0e35)", "transport": "Turn onto Yaowarat Road from Thalang Road in Phuket Old Town; about a 3-minute walk to Soon Utis Alley."}, {"address": "16 Soi Rommanee, Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Located in the famous pink-walled Soi Rommanee, this popular artisanal ice cream shop cleverly transforms traditional Phuket desserts like \u0027O-Aew\u0027 (shaved ice jelly) and \u0027Bi Co Moi\u0027 (black sticky rice with coconut milk) into exquisite ice creams. Housed in nostalgic Sino-Portuguese architecture, it offers smooth, creamy, and uniquely local flavors presented with gorgeous vintage plating\u2014an unmissable cooling-off spot during your Old Town stroll.", "name": "Torry\u0027s Ice Cream", "transport": "Located in Soi Rommanee, about a 1-minute walk from the main section of Thalang Road."}, {"address": "Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Held every Sunday evening, the Lard Yai night market is Phuket Old Town\u0027s liveliest culinary hub. Must-try walking snacks include grilled Thai herb pork skewers, coconut pancakes (Khanom Krok), banana rotis, and freshly fried squid balls. Sip on colorful Thai beverages or fresh coconut water while strolling\u2014the sizzling aromas of sweet and spicy street eats perfectly showcase the vibrant food culture of Old Phuket Town.", "name": "Phuket Sunday Walking Street Market Food Stalls (Lard Yai)", "transport": "Located along Thalang Road in the heart of the Old Town; closed to traffic and converted into a pedestrian zone after 4:00 PM on Sundays."}, {"address": "Corner of Dibuk Rd and Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.1 stars | A decades-old open-air food court bringing together traditional Phuket street food vendors. Highly recommended is the freshly wrapped Hokkien fresh spring roll (Popiah), packed with sweet braised jicama and specialty sauce, as well as charcoal-grilled pork satay and the local herbal jelly dessert (O-Aew). Offering a delicious mix of savory dishes and refreshing treats, it\u0027s the ultimate one-stop spot for authentic heritage food.", "name": "Lock Tien Local Food Center Street Stalls (Lock Tien / \u0e25\u0e4a\u0e2d\u0e01\u0e40\u0e17\u0e35\u0e22\u0e19)", "transport": "Located at the intersection of Dibuk Rd and Yaowarat Rd, near the historic clock tower; easily accessible on foot."}, {"address": "6 Thepkasattri Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | A Michelin Bib Gourmand-recommended roti stall packed with locals and foodies every morning. Freshly fried, their iconic roti boasts a golden, crispy exterior with a satisfying crunch, while remaining delightfully chewy inside. Enjoy it dipped in rich, aromatic beef or chicken curry, or opt for the sweet version topped with egg and condensed milk for an unforgettable flavor experience.", "name": "Roti Taeq (Roti\u0e41\u0e16\u0e19\u0e49\u0e33)", "transport": "Located near the intersection of Thepkasattri Rd and Thalang Rd; about a 2-minute walk from the heart of Old Town."}, {"address": "42 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 stars | A century-old traditional Hokkien and Nyonya bakery, making it the top choice for picking up authentic local pastries while strolling Old Town. Their signature Mung Bean Pastry (Tau Sar Piah) features flaky layers filled with smooth, sweet-and-savory mung bean paste. They also offer fragrant peanut brittle and coconut cakes. Handcrafted using century-old techniques, these rich, non-sticky treats are beloved by both tourists and local elders.", "name": "Kheng-Tin Pastry Shop (\u0e23\u0e49\u0e32\u0e19\u0e40\u0e04\u0e48\u0e07\u0e15\u0e34\u0e49\u0e19)", "transport": "Located on Phangnga Road, about a 1-minute walk from The Memory at On On Hotel."}, {"address": "Satun Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | A traditional Phuket street breakfast stall specializing in Khanom Jeen (fresh rice noodles). Served with a variety of rich Southern Thai curries\u2014such as green curry, fish innards curry, and crab curry\u2014diners can customize their bowl with over a dozen fresh herbs, pickled vegetables, and boiled eggs from the self-serve bar. The noodles absorb the fiery, spicy curry perfectly, creating an appetite-whetting dish bursting with flavor.", "name": "Khanom Jeen Mae Ting (\u0e02\u0e19\u0e21\u0e08\u0e35\u0e19\u0e41\u0e21\u0e48\u0e15\u0e34\u0e48\u0e07)", "transport": "Located on Satun Road, about a 7-minute walk from the core historic area of Phuket Old Town."}, {"address": "26/41 Phakthan Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 stars | A multi-generational local breakfast spot showcasing the unique Phuket tradition of enjoying dim sum with hot tea early in the morning. Steaming bamboo baskets of fresh shumai, shrimp dumplings, steamed ribs, and pearl meatballs are wrapped thinly with generous fillings. Dipped in Phuket\u0027s signature sweet, sour, and spicy red sauce, these juicy bite-sized treats are highly praised by travelers seeking an authentic local life experience.", "name": "Boon Rat Dim Sum (\u0e1a\u0e38\u0e0d\u0e23\u0e31\u0e15\u0e19\u0e4c \u0e14\u0e34\u0e21\u0e0b\u0e33)", "transport": "Located on Phakthan Road, near the Thai Hua Museum; about a 4-minute walk from the town center."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Phuket Old Town Historical and Cultural District"}, "rawai_naiharn": {"categories": {"cat_1": {"items": [{"address": "22/9 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 stars | A long-established, famous cook-to-order spot in Rawai Seafood Market, renowned for perfectly preparing fresh seafood bought by visitors. The signature stir-fried lobster with garlic and pepper is aromatic, springy, juicy, and sweet. The Thai-style spicy and sour steamed fish features rich lemongrass and lime juice that perfectly highlight the delicate texture of the fish. Locals and international foodies alike praise its great value for money and authentic Southern Thai flavors.", "name": "Mook Dee Seafood", "transport": "About a 10-minute tuk-tuk or scooter ride from Nai Harn Beach, directly inside Rawai Seafood Market."}, {"address": "52/2 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.2 stars | Operating for decades along the Rawai coast, this iconic institution serves distinctive and authentic Southern Thai seafood. The yellow curry crab meat served with rice noodles boasts an inviting golden color, a rich coconut milk aroma, and a spicy kick. The salt-grilled giant prawns feature charred shells and firm, succulent meat. Guests can sit on oceanfront wooden chairs, feel the sea breeze, and experience the pure charm of an old Phuket fishing village.", "name": "Salaloy Seafood", "transport": "Located along the Rawai Beach coastal road near the entrance of Rawai Pier, about an 8-minute scooter ride from Nai Harn Beach."}, {"address": "Rawai Beach Front Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 stars | A traditional spot situated in the heart of Rawai Seafood Market, beloved by local food enthusiasts. Their cook-to-order stir-fried black pepper crab is unforgettable, featuring sweet, firm crab meat coated in a rich, flavorful, and peppery sauce. The Thai spicy and sour seafood soup is tangy, spicy, and packed with prawns and squid. It is a quintessential stop when visiting Rawai.", "name": "Aek Rawai Seafood", "transport": "Located in the cook-to-order section of Rawai Seafood Market, about a 2-minute walk from Rawai Pier."}, {"address": "44/1 Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 stars | A classic landmark operating on the Rawai coast since the 1990s, offering a relaxed and rustic vibe. The stir-fried clams with lemongrass are plump and infused with aromatic basil and lemongrass. The grilled squid is wonderfully chewy, perfectly paired with a signature green Thai seafood dipping sauce that is delightfully zesty. Featuring stellar sea views and timeless authentic dishes, it is a favorite among seasoned travelers and local expats.", "name": "Nikita\u0027s Beach Restaurant", "transport": "Located under the shade of trees at the southernmost tip of Rawai Beach, about a 7-minute drive from Nai Harn Beach along Route 4030."}, {"address": "Rawai Seafood Market, Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 stars | A traditional stir-fry eatery tucked away in the Rawai vendor area, famous for reasonable prices and exceptional wok skills. A must-order is the steamed scallops with garlic, featuring plump scallop meat infused with garlic aroma, sweet and juicy. The spicy stir-fried squid offers a tender yet snappy texture. It is a go-to processing choice for many foodies after buying fresh seafood, full of warm, authentic local vibe.", "name": "Khun Phaen Seafood", "transport": "Located inside Rawai Seafood Market near the fishermen\u0027s pier, easily reachable on foot."}, {"address": "10/4 Moo 2, Rawai Beach Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.1 stars | A local traditional Thai seafood restaurant built along the Rawai coastline featuring a spacious stilt platform. The signature fried fish is golden and crispy on the outside with delicate fish meat inside, served with a green mango dipping sauce that combines sweet, sour, and savory flavors. The coconut seafood soup is rich, smooth, and aromatic. Local families love gathering here to enjoy authentic Southern Thai home-style cooking and peaceful sea views.", "name": "Baan Rimlay Seafood Rawai", "transport": "Drive along Viset Road and turn left onto Rawai Beach Road; about 3 minutes away by scooter."}, {"address": "Promthep Cape, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.2 stars | Located near Rawai\u0027s famous Promthep Cape, this is a long-standing scenic restaurant. The steamed grouper with ginger features ultra-tender meat that locks in natural seafood sweetness, while the Thai stir-fried basil seafood rice is flavorful, spicy, and satisfying. Diners can relish authentic Thai cuisine while overlooking the stunning Andaman Sea sunset, making it a perfect blend of breathtaking views and traditional flavors.", "name": "Bukit Promthep Restaurant", "transport": "Head south from Nai Harn Beach along Route 4030 for about 5 minutes to reach the side of Promthep Cape Viewpoint."}, {"address": "Rawai Seafood Market, Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 stars | A highly praised traditional cook-to-order seafood spot in Rawai Seafood Market. Their salt and pepper stir-fried soft-shell crab is crispy outside and tender inside, delivering rich crab flavor and spicy seasoning. The butter-grilled lobster is firm, juicy, and fragrant. Renowned for friendly service, reasonable cooking fees, and skill in preserving natural flavors, it earns top acclaim from locals and global travelers alike.", "name": "Khun Khain Seafood Rawai", "transport": "Walk about 50 meters into the main aisle of Rawai Seafood Market to see the restaurant sign."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "14/83 Moo 1, Viset Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.7 Stars | Located in Rawai, this popular brunch spot is renowned for its focus on healthy, balanced dining. The interior features warm wood tones and lush greenery, creating the ultimate relaxing resort vibe. Tourists and expats highly recommend the signature \u0027Pink Acai Bowl\u0027\u2014cool, smooth, and bursting with sweet and tangy berry flavors, topped with fresh bananas, chia seeds, and crunchy granola for delightful layers of texture. Additionally, the \u0027Eggs Benedict with Homemade Smoked Salmon\u0027 pairs runny poached eggs with tangy Hollandaise sauce on crispy sourdough, delivering pure bliss in every bite.", "name": "Boost Cafe Phuket", "transport": "Head north along Viset Road by taxi or scooter from Rawai Seafood Market for about 5 minutes."}, {"address": "14/33 Moo 1, Nai Harn, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.6 Stars | Blending Nordic minimalism with vibrant Moroccan touches, Unni\u0027s is a hugely popular Instagrammable cafe near Nai Harn Beach. Offering a rich array of Mexican and European brunch options, its signature \u0027Mexican Avocado Tacos\u0027 are a crowd favorite\u2014soft, lightly charred corn tortillas stuffed with rich, freshly mashed guacamole and crisp salsa, offering a refreshing, lightly spiced appetite opener. Pair a \u0027Pour-Over Iced Coffee\u0027 with a warm, freshly baked cinnamon roll (crispy outside, soft inside, packed with cinnamon flavor) for the perfect afternoon treat by the sea.", "name": "Unni\u0027s Cafe Rawai", "transport": "Walk for about 10 minutes from Nai Harn Beach, or take a songthaew and get off near Nai Harn Road."}, {"address": "95/36 Moo 2, Rawai Beach Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.4 Stars | Perched along the Rawai coastline, Rustic and Blue boasts stunning ocean views and open-air garden seating. Emphasizing a farm-to-table sustainable concept, the standout \u0027Ultimate Pulled Pork Croissant\u0027 features slow-cooked, tender pulled pork inside a flaky, buttery croissant, topped with special smoky BBQ sauce and crisp coleslaw for a juicy, savory bite. Enjoying a craft cold brew and homemade pancakes in the ocean breeze offers a truly therapeutic escape.", "name": "Rustic and Blue - By The Sea", "transport": "Drive east along Rawai Beach Road; located on the oceanfront front line, easily accessible by scooter or taxi."}, {"address": "83/13 Moo 2, Viset Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.6 Stars | Coffee Tribe is a bohemian-style specialty cafe dedicated to serving organic fair-trade coffee and all-natural healthy meals. The signature \u0027Organic Espresso with Coconut Milk\u0027 is rich and smooth, infused with tropical coconut aroma and bitter-sweet coffee notes. For brunch, the \u0027Double Avocado Poached Egg Toast\u0027 is a top pick\u2014crispy rye toast topped with creamy smashed avocado, perfectly runny poached eggs, chili threads, and crushed nuts. It\u0027s crispy, rich, aromatic, and a top choice for health-conscious foodies.", "name": "Coffee Tribe Phuket", "transport": "Located on main Viset Road, about a 3-minute drive from Rawai Pier, with convenient scooter and car parking."}, {"address": "59/38 Moo 1, Sai Yuan Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.5 Stars | A long-standing premium brunch brand in Phuket, Gallery Cafe by Pinky\u0027s Rawai branch retains a cozy and elegant English countryside atmosphere. The popular \u0027Deluxe Full English Breakfast\u0027 includes pan-fried sausages, bacon, sunny-side-up eggs, mushrooms, and baked beans, served with thick toast toasted to perfection. For dessert, don\u0027t miss the \u0027Freshly Baked Blueberry French Toast\u0027\u2014golden, custard-soft bread paired with sweet-and-sour blueberry sauce and maple syrup, leaving a lingering delicious memory.", "name": "Gallery Cafe by Pinky Rawai", "transport": "Situated in an alley in the bustling Sai Yuan area, about a 7-minute scooter ride from Nai Harn Beach."}, {"address": "43/72 Moo 7, Sai Yuan Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.7 Stars | Bake Free is a bakery cafe haven in Rawai tailored for health-conscious diners and vegans, serving 100% gluten-free and refined-sugar-free menu options. The star item is the \u0027Gluten-Free Vegan Dark Chocolate Tart\u0027, featuring a crispy shell filled with rich vegan dark chocolate ganache that melts in your mouth\u2014guilt-free and satisfying. Pair it with a freshly blended \u0027Green Miracle Smoothie\u0027 for a smooth, sweet, and wholesome treat adored by healthy travelers.", "name": "Bake Free Vegan \u0026 Gluten Free Rawai", "transport": "Located along main Sai Yuan Road, easily accessible by scooter with parking right outside the entrance."}, {"address": "5/18 Moo 1, Viset Road, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.8 Stars | Combining Japanese minimalist style with modern hipster aesthetic, Cafe Sailomyen\u0027s name means \u0027cool breeze\u0027. The cafe is passionate about specialty hand-poured coffee, sourcing selected beans from Northern Thailand and around the world. The signature \u0027Japanese Matcha Latte\u0027 uses Kyoto-grade matcha powder, yielding a fine, rich texture with mellow tea aromas and creamy milk without bitterness. Pair it with homemade \u0027Cr\u00e8me Br\u00fbl\u00e9e\u0027\u2014crispy bittersweet caramel atop silky smooth custard\u2014making it a perfect spot to unwind.", "name": "Cafe Sailomyen Rawai", "transport": "Located off a side street near Viset Road; taking a Grab or riding a scooter is recommended, about a 4-minute drive from Rawai Seafood Market."}, {"address": "11/12 Moo 1, Nai Harn Beach Cliff, Rawai, Phuket 83130 Thailand", "feature": "\u2b50 4.4 Stars | Perched on the cliffside of Nai Harn Bay, this scenic cafe boasts breathtaking ocean views and the soothing sound of waves crashing against the rocks. The top recommendation is the \u0027Tropical Passion Fruit Espresso Tonic\u0027, blending refreshing passion fruit juice with intense espresso for a fizzy, thirst-quenching kick perfect for the heat. Pair it with fresh \u0027Thai Herb Grilled Chicken Quesadillas\u0027\u2014crispy flatbread packed with flavorful, juicy seasoned chicken\u2014making it a hidden gem for enjoying brunch while watching the sunset.", "name": "Nai Harn On The Rock Cafe", "transport": "Located at the end of the coastal path at the southernmost tip of Nai Harn Beach; riding a scooter or walking along the cliff trail is recommended."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "23/3 Moo 1, Vises Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.6 stars | A premier oceanfront bistro located at the northern tip of Nai Harn Beach, boasting unmatched Mediterranean-style coastal views. It specializes in a creative fusion of Mediterranean and local Thai cuisine. The signature wood-fired pizza features a crispy yet chewy crust, paired perfectly with spiced seafood skewers and a rich Southern Thai yellow curry seafood tower for a multi-layered flavor profile. Tourists love sipping signature cocktails here while taking in the golden waves at sunset, making it a highly romantic landmark bistro.", "name": "Rock Salt Oceanfront Bistro (Rock Salt Restaurant)", "transport": "Located inside The Nai Harn resort, about a 3-minute walk from Nai Harn Beach."}, {"address": "44/1 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.4 stars | A classic bistro standing on the shores of Rawai Beach for over thirty years, featuring massive ancient banyan trees and a wooden deck extending over the water. It serves authentic Southern Thai home-style dishes and Italian light bites. The must-try Thai Tom Yum Goong is spicy, sour, and full of flavor with plump, bouncy shrimp, while the deep-fried herb fish fillet is crispy outside and tender inside. Loved by long-term Western expats and locals alike, enjoying cool sea breezes with an iced signature drink offers an unmatched, laid-back vacation vibe.", "name": "Nikita\u0027s Beach Restaurant", "transport": "Take a songthaew or ride a scooter along Wiset Road to the eastern end of Rawai Beach."}, {"address": "96/6 Moo 6, Soi Laem Promthep 1, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.5 stars | A hidden gem bistro tucked away on the cliffside of the Rawai coast, offering 270-degree views of blue skies and the azure bay. The restaurant focuses on local seafood dishes and stylish signature cocktails. Top recommendations include Thai Steamed Grouper with Lemon\u2014delicate, tangy, and appetizing\u2014and Stir-Fried Squid with Lemongrass, fragrant with a delightfully snappy texture. Live music at dusk combined with mesmerizing sunsets makes this a prime spot for tourists to visit and celebrate special occasions.", "name": "Rawai View Cafe \u0026 Restaurant", "transport": "It is recommended to rent a scooter or take a Grab car to the end of Soi Laem Promthep 1."}, {"address": "Laem Promthep, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.3 stars | Perched on a high cliff at Promthep Cape (Phuket\u0027s southernmost point), this restaurant boasts the island\u0027s most spectacular sunset views. It offers authentic Southern Thai local specialties, such as the classic Southern Thai Black Pepper Stir-Fried Crab with sweet, juicy crab meat and bold spice, and the rich, smooth Yellow Curry Stewed Fish highlighting distinct local spices. After watching the stunning sunset, visitors love stopping by to enjoy traditional Thai delicacies alongside cool mountain and ocean breezes.", "name": "Promthep Cape Restaurant", "transport": "From Rawai Beach, take a taxi or ride a scooter south for about 8 minutes to the Promthep Cape parking lot, then walk a short distance."}, {"address": "52/2 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.2 stars | A long-standing local restaurant located right along the shoreline of Rawai Beach, favored by locals and foodies alike. Specializing in fresh live catch and traditional local Phuket dishes, the top recommendation is the Thai Lemongrass Grilled Whole Fish, juicy and infused with deep herbal aromas, and the Garlic Pepper Stir-Fried Flower Crab, bursting with sweet juice. Sitting casually at outdoor beachfront tables while savoring authentic dishes offers a truly grounded taste of Phuket life.", "name": "Salaloy Seafood", "transport": "Located along Rawai Beach Road (Wiset Road), just a 2-minute walk from Rawai Seafood Market."}, {"address": "Soi Viset, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.7 stars | A highly rated hidden gem bistro tucked in the inland alleys of Rawai, famous for serving some of the best handmade burgers and craft beers in all of Phuket. The chef\u0027s meticulously prepared thick-cut beef burger is bursting with juice, served on soft homemade buns with a special tamarind sauce for an amazingly rich taste profile. The relaxing, cozy outdoor garden vibe attracts many Western tourists and local expats to gather and unwind.", "name": "Green Tamarind Kitchen", "transport": "Turn into Soi Viset from Rawai Beach main road; riding a scooter or navigating via Grab is recommended."}, {"address": "19/9 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.5 stars | A stylish, creative bistro combining hydroponic farming and greenhouse concepts, focusing on organic fresh vegetables and local Thai fusion dishes. The signature Rainbow Hydroponic Salad with custom Thai lime dressing is exceptionally crisp and refreshing, while the Pan-Seared Scallop Pad Thai seamlessly blends delicate seafood with traditional street flavors. The bright, spacious concrete industrial-style space attracts many health-conscious foodies and Instagrammers.", "name": "WeCafe Rawai (Healthy Fresh Bistro)", "transport": "Drive along the main Wiset Road towards Nai Harn; located right roadside with dedicated parking available."}, {"address": "22 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130 Thailand", "feature": "\u2b50 4.3 stars | A popular local stir-fry bistro near Rawai Pier, offering great-value local seafood and authentic Thai dishes. A must-order is the Sweet \u0026 Sour Tamarind Shrimp with its thick, tangy sauce and plump, springy prawns; the Thai Stir-Fried Razor Clams with Holy Basil are packed with savory aromas, making them perfect with drinks. The energetic atmosphere and enticing wok-hei aromas make it a must-visit spot to experience Rawai\u0027s local food culture.", "name": "Aroy Seafood Rawai", "transport": "Located opposite the entrance to Rawai Beach Pier, easily accessible on foot."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "37/10 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.7 stars | A popular plant-based restaurant near the Rawai beachfront, especially loved by Western tourists and health-conscious diners. The cafe specializes in 100% plant-based vegan cuisine. Their \"Vegan Pad Thai\" is stir-fried with tofu and a special tamarind sauce; the noodles are springy with a rich, sweet-and-sour smoky flavor, topped with crispy plant-based meat bites and crushed peanuts for an incredibly rich layered texture. Additionally, their vegan cheesecake features a cashew and coconut oil base\u2014smooth, rich, and guilt-free\u2014making it a must-try healthy dessert when visiting the Rawai area.", "name": "Soul Vegan Cafe Rawai", "transport": "Head south along the main Rawai Route 4028; it is about a 3-minute drive from the Rawai Seafood Market. Easily accessible by scooter or Tuk-Tuk."}, {"address": "5/48 Moo 5, Chaofa West Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | A premium healthy restaurant with its own organic hydroponic greenhouse vegetable garden, deeply favored by local residents and long-term expats. The most popular item, the \"Two-Color Quinoa Rainbow Salad,\" features non-toxic fresh lettuce grown in-house. Crisp, juicy, and naturally sweet, it is tossed with a special passion fruit vinaigrette for a refreshing, appetite-whetting start. The menu also offers a variety of plant-based curries infused with Thai flavors\u2014the rich, fragrant green curry blends perfectly with smooth coconut milk for a truly satisfying meal.", "name": "WeCafe Organic Rawai", "transport": "Located along Chaofa West Road, about a 5-minute drive from Rawai Beach. Ample parking space is available right in front, making it extremely convenient to reach by car or scooter."}, {"address": "14/93 Moo 2, Soi Saiyuan, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | Tucked away in Rawai\u0027s Saiyuan community, this wellness macrobiotic restaurant focuses on additive-free, organic vegan cuisine. The popular \"Macrobiotic Whole Grain Energy Bowl\" combines fermented brown rice, steamed warm vegetables, tempeh, and homemade miso sauce. It boasts a rich, chewy texture, with tempeh pan-fried to a slight crispness revealing a unique nutty aroma, complemented by mild and natural seasoning. The atmosphere is exceptionally relaxed and cozy\u2014many visitors love ordering a cold-pressed unsweetened green smoothie in the afternoon to enjoy a pure, guilt-free healing moment.", "name": "Natural Efe Macrobiotic World", "transport": "Turn off Saiyuan Road onto Soi Saiyuan and go straight for about 400 meters. Taking a scooter or calling a Grab ride is recommended."}, {"address": "27/1 Moo 5, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | Situated inside the Friendship Beach Resort, this elegant vegan cafe boasts spectacular ocean views and a laid-back vibe. Highly recommended is the \"Coconut Acai Smoothie Bowl\", made with 100% natural acai puree topped with fresh sliced mango and crunchy granola\u2014chilled, refreshing, smoothly sweet-and-sour, and bursting with tropical summer vibes. Another hit is the \"Vegan Avocado Roll\", wrapping ripe avocado and shredded purple cabbage in nori seaweed for a smooth yet tenderly crisp texture, making it a low-carb light bite highly praised by international travelers.", "name": "Pure Vegan Cafe Phuket", "transport": "Located inside Friendship Beach Resort off Viset Road. Follow the signs through the resort to reach the beachfront dining area."}, {"address": "99/1 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | An attached restaurant to a well-known detox wellness retreat in Phuket, dedicated to offering raw vegan cuisine. The signature \"Raw Vegan Sicilian Lasagna\" is cleverly crafted, replacing pasta sheets with thinly sliced zucchini layered with cashew nut cheese and fresh tomato spread. Juicy, naturally sweet, and packed with nutty aroma, it completely redefines traditional Italian cuisine. Free of refined sugar and gluten, it is perfect for gourmets with high standards for healthy eating.", "name": "Atsumi Rawai Vegan Restaurant", "transport": "Located on the main Viset Road in Rawai, near the Clock Tower roundabout. The location is very easy to spot; accessible via Phuket Smart Bus or scooter."}, {"address": "81/48 Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | A hipster-style cafe blending specialty coffee with high-quality plant-based food, making it a popular hotspot for digital nomads in Rawai. Recommended is the \"Plant-Based Meat \u0026 Hummus Burger\"\u2014in-house baked aromatic bread stuffed with a thick plant-based patty and rich, velvety hummus. It\u0027s wonderfully chewy, juicy, and served with handmade sweet potato fries for maximum satisfaction. The coffee beans are locally roasted and paired with oat milk for a latte that is smooth, rich, and perfectly balanced.", "name": "Coffee Tribe Rawai", "transport": "Located along Viset Road near the Sayuan intersection. Scooter parking is available in front of the shop, making it great for a quick stop."}, {"address": "14/73 Soi Saiyuan, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.8 stars | A creative vegan spot full of tropical island flair, highly rated for its bold and diverse international plant-based flavors. Its signature \"Thai Spicy Enoki Mushroom Vegan Tacos\" feature crispy taco shells filled with pan-seared enoki mushrooms and vegan minced meat, drizzled with a special spicy-and-sour Thai sauce and coconut yogurt. It\u2019s crispy outside, tender inside, juicy, and wonderfully flavorful. The shop also offers sugar-free fruit kombucha\u2014refreshing and digestive\u2014making it a favorite among young backpackers and vegan enthusiasts.", "name": "Nalu Bar \u0026 Vegan Kitchen", "transport": "Located inside Soi Saiyuan, about a 5-minute drive from Nai Harn Beach. Renting a scooter to navigate the alleys is recommended."}, {"address": "28/4 Moo 1, Nai Harn Beach Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | A resort-style, affordable vegan cafe very close to Nai Harn Beach, offering a variety of meatless, egg-free, and dairy-free light meals and desserts. Highly recommended is the \"Vegan Banana Peanut Butter Waffles,\" made with gluten-free rice flour, baked to golden crispiness on the outside while soft and chewy inside, topped with rich sugar-free peanut butter and fresh banana slices. The sea-breeze-
