0 Thailand", "feature": "\u2b50 4.6 Stars | A premier 5-star wellness resort dedicated to holistic health and balance, sprawling over lush grounds overlooking the azure Andaman Sea. Offering comprehensive wellness detox programs, traditional Thai hydrotherapy, and nourishing wellness cuisine, every room features a private balcony with stunning ocean views for an extraordinarily relaxing escape.", "name": "Amatara Welleisure Resort", "transport": "About 15 minutes by car from Phuket Town and approximately 55 minutes from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Amatara%2520Welleisure%2520Resort", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Amatara%2520Welleisure%2520Resort", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Amatara%20Welleisure%20Resort", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Amatara%20Welleisure%20Resort%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "44/5 Moo 8, Sakdidej Road, Vichit, Muang, Phuket 83000 Thailand", "feature": "\u2b50 4.4 Stars | An international 5-star beachfront resort under the Accor Group, situated on quiet Makham Bay. Blending contemporary chic design with subtle Thai touches, it features large outdoor infinity pools, direct beach access with water sports, and engaging family entertainment, making it an excellent choice for luxury retreats and family vacations.", "lat": 7.8102185, "lng": 98.4024505, "name": "Pullman Phuket Panwa Beach Resort", "transport": "Located right on Makham Bay Beach, about a 20-minute drive from Chalong Pier and 50 minutes for airport transfers.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026 ars | A hillside luxury villa resort offering sweeping ocean views from every unit. Rooms feature private plunge pools and floor-to-ceiling panoramic windows, allowing guests to soak in the breathtaking vistas of Cape Panwa. Sophisticated contemporary decor paired with attentive butler service delivers an incomparably romantic and private getaway for couples and honeymooners.", "lat": 7.8132063, "lng": 98.3910366, "name": "Bandara Villas Phuket", "transport": "Situated along Panwa Beach, about a 1-hour drive from Phuket International Airport. Private hotel transfers and taxi services are available.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Bandara%2520Villas%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8132063%2C98.3910366", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8132063,98.3910366", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Bandara%20Villas%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "31/11 Moo 8, Sakdidej Road, Cape Panwa, Phuket 83000 Thailand", "feature": "\u2b50 4.3 Stars | A popular landmark serviced-apartment hotel along the Cape Panwa promenade, offering spacious, comfortable suites equipped with full kitchen facilities. Features a scenic rooftop infinity pool and great nearby amenities. Located within walking distance of the Phuket Aquarium and local eateries, it\u0027s a high-value choice for long-term guests and family vacations.", "lat": 7.8053126, "lng": 98.406577, "name": "Kantary Bay Hotel Phuket", "transport": "Adjacent to Phuket Aquarium and within walking distance of the waterfront promenade. About a 20-minute drive to Chalong Pier.", "urls": {"agoda": "https://tp.media/r?campaign_id=1 down the stairs straight onto the stretching golden sand. Rooms feature prime sea-view balconies where you can fall asleep to the gentle sound of waves. Complete with a saltwater pool and a cozy sun garden, it\u0027s ideal for water lovers, sunseekers, families, and long-term guests desiring a true beach getaway.", "name": "Kamala Beachfront Apartments", "transport": "About a 40-minute drive to Phuket International Airport, with direct walking access to the beach and surrounding restaurants.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Kamala%2520Beachfront%2520Apartments", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Kamala%2520Beachfront%2520Apartments", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Kamala%20Beachfront%20Apartments", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Kamala%20Beachfront%20Apartments%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Vacation Rentals"}}, "name": "Kamala and Surin Beach Area"}, "kata_karon": {"categories": {"cat_1": {"items": [{"address": "14 Kata Noi Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.8 stars | Tucked away at the quiet southern end of Kata Noi Beach, this adults-only luxury villa resort is Phuket\u0027s premier choice for honeymoons and romantic getaways. Every villa features a private infinity pool and an expansive scenic terrace overlooking the azure Andaman Sea. Rooms are designed in elegant pure white tones paired with wooden accents and soft textiles, creating an atmosphere of ultimate romance and relaxation. The resort\u0027s Serenity Spa offers world-class Thai wellness treatments, while the oceanview Seacret Restaurant serves exquisite daily breakfast for two alongside refined French and Thai cuisine. The main infinity pool seamlessly blends into the ocean horizon, making it an iconic photo spot.", "lat": 7.8031138, "lng": 98.2993158, "name": "The Shore at Katathani", "transport": "About a 60-minute drive from Phuket International Airport; approximately a 15-minute walk to downtown Kata Beach.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Shore%2520at%2520Katathani", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8031138%2C98.2993158", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8031138,98.2993158", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Shore%20at%20Katathani%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "14 Kata Noi Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 stars | Occupying a prime beachfront position along 850 meters of fine white sand at Kata Noi Beach, this is Kata\u0027s most iconic classic 5-star beach resort. Divided into the beachfront Bhuri Wing and garden Thani Wing, the resort boasts 6 swimming pools, 5 oceanview restaurants, and multiple specialty bars. Rooms feature contemporary Thai design with spacious private balconies, most offering direct views of stunning sunsets over the sea. With extensive facilities including a kids\u0027 club, fitness center, and spa, it is ideal for families and vacationers alike.", "lat": 7.8077241, "lng": 98.2993202, "name": "Katathani Phuket Beach Resort", "transport": "About a 1-hour drive from Phuket International Airport. The resort offers scheduled paid shuttle services to Phuket Town and Patong Night Market.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Katathani%2520Phuket%2520Beach%2520Resort", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8077241%2C98.2993202", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8077241,98.2993202", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Katathani%20Phuket%20Beach%20Resort%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "683 Patak Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.5 stars | Situated at the northernmost tip of Karon Beach with direct beach access, this is the area\u0027s only luxury 5-star resort featuring a massive water park. Designed in charming Sino-Portuguese colonial architecture, its pink facades blend elegantly between lush green hills and blue ocean waters. The highlight is the expansive water park featuring a lazy river, waterfalls, and waterslides\u2014a favorite for families. Rooms and suites face the Andaman Sea, with select units offering private plunge pools or jacuzzi tubs, alongside the top-tier Spa Cenvaree for ultimate adult relaxation.", "lat": 7.8577398, "lng": 98.2906613, "name": "Centara Grand Beach Resort Phuket", "transport": "About a 10 to 15-minute walk to downtown Karon Beach; approximately a 50-minute drive from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Centara%2520Grand%2520Beach%2520Resort%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8577398%2C98.2906613", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8577398,98.2906613", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Centara%20Grand%20Beach%20Resort%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "14A Luang Phor Chuan Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 stars | Perched on a gentle hillside behind Karon Beach, this 5-star resort tucked inside a tropical jungle is renowned for its tranquil nature and modern luxury. Scattered across the property are 5 distinct swimming pools (including rooftop panoramic pools and swim-up bar pools), ensuring every guest finds their ultimate spot to unwind. Accommodation consists of standalone or semi-detached villas and spacious rooms featuring warm wooden tones, floor-to-ceiling windows, and balconies facing lush green valleys or pool views. A free scheduled shuttle to Karon Beach balances privacy with convenience.", "name": "Mandarava Resort and Spa, Karon Beach", "transport": "The resort provides a free scheduled shuttle to Karon Beach (about a 3-minute ride); roughly a 50-minute drive from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Mandarava%2520Resort%2520and%2520Spa%252C%2520Karon%2520Beach", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Mandarava%2520Resort%2520and%2520Spa%252C%2520Karon%2520Beach", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Mandarava%20Resort%20and%20Spa%2C%20Karon%20Beach", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Mandarava%20Resort%20and%20Spa%2C%20Karon%20Beach%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "29 Soi Karon Nui, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.5 stars | Located on a secluded private cove (Karon Noi Beach) north of Karon Beach, offering exclusive access to pristine white sands free from crowds. The hotel features one of Phuket\u0027s largest outdoor pools alongside extensive water sports and sports facilities, including tennis courts, squash courts, mini-golf, and a professional diving center. Rooms blend traditional Thai decor with modern amenities, most opening onto balconies overlooking the sea or landscaped pools. With 10 dining venues ranging from Italian and Japanese to authentic Thai, it serves as the ultimate all-in-one resort landmark.", "lat": 7.8662715, "lng": 98.2829613, "name": "Le M\u00e9ridien Phuket Beach Resort", "transport": "Just a 10-minute drive to Patong\u0027s night market area, 5 minutes to Karon town center, and about 50 minutes to the airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Le%2520M%25C3%25A9ridien%2520Phuket%2520Beach%2520Resort", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8662715%2C98.2829613", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8662715,98.2829613", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Le%20M%C3%A9ridien%20Phuket%20Beach%20Resort%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "255 Soi Khoktanod, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.4 stars | Standing for \u0027Stay in Style\u0027, this boutique 5-star resort is designed for modern travelers seeking fashion, aesthetics, and lifestyle. Perched on a hill at the southern end of Kata Beach, it features a breathtaking rooftop infinity pool overlooking all of Kata Bay and dazzling sunsets over the Andaman Sea. Rooms display geometric lines and sleek modern aesthetics, complete with high-end bedding and smart amenities. The oceanview restaurant and Sunset Bar are premier evening spots for cocktails, lights, and music, attracting influencers and young couples alike.", "lat": 7.8127379, "lng": 98.29999, "name": "The SIS Kata Phuket", "transport": "A 5 to 8-minute walk to Kata Beach; private transfers to Phuket International Airport can be arranged by the hotel (about a 60-minute drive).", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520SIS%2520Kata%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8127379%2C98.29999", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8127379,98.29999", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20SIS%20Kata%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "509 Patak Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.5 stars | Situated in a prime spot right across the street from Karon Beach\u0027s stretching golden sands. Surrounded by lush tropical greenery and manicured gardens, the resort creates a tranquil sanctuary atmosphere. Accommodation includes refined Thai-style villas and main building luxury rooms, with select villas offering private pools and outdoor rainforest gardens. Highlights include the complimentary daily \u0027Chocolate Hour\u0027 served in the lobby every afternoon, expansive refreshing pools, and a top-tier spa center\u2014perfect for refined leisure seekers and family travelers.", "name": "M\u00f6venpick Resort \u0026 Spa Karon Beach Phuket", "transport": "Karon Beach is right across the street; surrounded by abundant restaurants and shops. Approximately 50 minutes by car from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520M%25C3%25B6venpick%2520Resort%2520%2526%2520Spa%2520Karon%2520Beach%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520M%25C3%25B6venpick%2520Resort%2520%2526%2520Spa%2520Karon%2520Beach%2520Phuket", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20M%C3%B6venpick%20Resort%20%26%20Spa%20Karon%20Beach%20Phuket", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=M%C3%B6venpick%20Resort%20%26%20Spa%20Karon%20Beach%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "4/2 Laem Son Rd, Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.4 stars | Perched on a green hill nestled between Kata and Karon beaches, offering fantastic dual-bay vistas and peaceful surroundings. This 5-star resort features warm, refined modern Thai style and a multi-tiered scenic pool with a swim-up bar surrounded by lush greenery. Exceptionally spacious rooms all feature private balconies with mountain or pool views. Amenities include the Little VIPs Kids Club, In Balance Spa, and En Vogue restaurant serving global cuisine. Just a few minutes\u0027 walk to Kata Beach, it perfectly combines tranquil elegance with convenient beach access.", "lat": 7.8259192, "lng": 98.2950034, "name": "Novotel Phuket Kata Avista Resort and Spa", "transport": "About a 5-minute walk to Kata Beach; a 10-minute walk to Karon Beach; approximately a 55-minute drive from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u00 tak Soi 14, Karon, Muang, Phuket 83100 Thailand", "feature": "\u2b50 4.3 Stars | A well-known resort suite apartment located halfway up the Kata hillside, offering breathtaking panoramic mountain and ocean views. Each suite is equipped with a full kitchen, a spacious living room, and a large private balcony, making it ideal for medium-to-long-term holidays or family trips. Facilities include a signature mountain-view infinity pool, a wellness center, and a yoga pavilion. Set in a quiet and elegant environment, it is just a 5-minute drive from vibrant Kata Beach, with free scheduled shuttle services provided.", "lat": 7.8191677, "lng": 98.3128984, "name": "Kata Ocean View Residences", "transport": "About a 5-minute drive to Kata Beach. Renting a scooter or taking the apartment\u0027s scheduled shuttle service is recommended.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Kata%2520Ocean%2520View%2520Residences", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8191677%2C98.3128984", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8191677,98.3128984", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Kata%20Ocean%20View%20Residences%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "39 Kata-Saii Road, Karon, Muang, Phuket 83100 Thailand", "feature": "\u2b50 4.6 Stars | A luxury residential rental apartment perched on Kata Hill, featuring sophisticated modern design and stunning 180-degree sunset views over the Andaman Sea. Each unit boasts an expansive floor plan, an open-concept gourmet kitchen, and panoramic floor-to-ceiling windows; select units even include a private outdoor pool. Amenities include an infinity ocean-view pool, a fitness center, and 24-hour security, making it the premier choice for travelers seeking high-end privacy.", "name": "The Heights Kata Beach Condominium", "transport": "About a 12-minute walk or a 3-minute Tuk-Tuk ride from Kata Beach.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Heights%2520Kata%2520Beach%2520Condominium", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520The%2520Heights%2520Kata%2520Beach%2520Condominium", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20The%20Heights%20Kata%20Beach%20Condominium", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Heights%20Kata%20Beach%20Condominium%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "202/88 Patak Road, Karon Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.2 Stars | An exquisite hillside condominium near Karon Beach, seamlessly blending traditional Thai style with modern residential comfort. The bright units come fully equipped with kitchen facilities and private balconies overlooking the beautiful Karon coastline. Surrounded by lush tropical greenery, the complex features a two-tier outdoor swimming pool and a sunken pool bar. It offers a relaxed, laid-back vibe\u2014perfect for travelers looking to escape the hustle and bustle while staying close to the beach.", "lat": 7.8332212, "lng": 98.300157, "name": "Karon Butterfly Condominium", "transport": "About a 15-minute walk to Karon Beach, or just a 4-minute ride by taxi or Tuk-Tuk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Karon%2520Butterfly%2520Condominium", "booking": "https://tp.media/r?campaign_id=84\u0026ma tled in a quiet lane behind Kata Beach. The rooms are spacious, sparkling clean, and feature a kitchenette and private balcony, making them popular with long-term guests and budget travelers. Excellent neighborhood amenities with convenience stores, Thai massage shops, and local street food within walking distance. Friendly, hospitable staff provide warm local travel tips.", "name": "Baan Nueng Kata Apartment", "transport": "Located about 700 meters from Kata Beach, roughly a 9-minute walk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Baan%2520Nueng%2520Kata%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Baan%2520Nueng%2520Kata%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Baan%20Nueng%20Kata%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Baan%20Nueng%20Kata%20Apartment%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "98/43 Kata Road, Karon, Muang, Phuket 83100 Thailand", "feature": "\u2b50 4.5 Stars | A cozy guesthouse featuring Japanese-inspired minimalist decor, renowned for its warm wooden tones and friendly, welcoming service. The rooms are bright, spotless, and cozy, fitted with comfortable beds and a charming sitting area. The host enthusiastically assists guests with itinerary planning and vehicle rentals. Located just a short walk from Kata Beach and surrounded by international eateries and local night markets, it\u0027s ideal for hipsters and backpackers looking to immerse themselves in local life.", "name": "Simple House Kata Beach", "transport": "Only a 5 to 7-minute walk to Kata Beach.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Simple%2520House%2520Kata%2520Beach", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Simple%2520House%2520Kata%2520Beach", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Simple%20House%20Kata%20Beach", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Simple%20House%20Kata%20Beach%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "3 Saii Road, Kata Beach, Karon, Muang, Phuket 83100 Thailand", "feature": "\u2b50 4.7 Stars | An upscale garden residence perched on the hill between Kata Beach and Kata Noi Beach, offering magnificent sea views surrounded by lush private gardens. Each apartment features exceptionally spacious living areas, elegant Southeast Asian d\u00e9cor, and modern appliances. The property includes two outdoor pools and a fitness center. Located in a tranquil environment within easy walking distance to both beaches, it is the premier rental choice for families and groups traveling together in Phuket.", "name": "Kata Garden Residences", "transport": "Just a 5 to 8-minute walk to both Kata Beach and Kata Noi Beach.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Kata%2520Garden%2520Residences", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Kata%2520Garden%2520Residences", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Kata%20Garden%20Residences", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Kata%20Garden%20Residences%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "480/3 Patak Road, Karon Beach, Phuket 83100 Thailand", "feature": "\u2b50 4.0 Stars | A charming boutique guesthouse along Karon Beach Road, just steps away from pristine white sands. Rooms feature a blend of colorful Thai accents and modern minimalist style, with select rooms boasting balconies offering street or sea views. The ground floor houses a cozy caf\u00e9 serving delicious freshly made breakfasts and specialty coffees. Ideally located near night markets and seafood restaurants, it is a great value base for enjoying the sun and culinary scene at Karon Beach.", "name": "Karon Beach Walk Boutique Guesthouse", "transport": "Only about 150 meters from Karon Beach, less than a 2-minute walk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Karon%2520Beach%2520Walk%2520Boutique%2520Guesthouse", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Karon%2520Beach%2520Walk%2520Boutique%2520Guesthouse", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Karon%20Beach%20Walk%20Boutique%20Guesthouse", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Karon%20Beach%20Walk%20Boutique%20Guesthouse%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Guesthouses"}}, "name": "Kata and Karon Beach Area"}, "mai_khao": {"categories": {"cat_1": {"items": [{"address": "888 Moo 3, Mai Khao, Thalang, Phuket 83110, Thailand", "feature": "\u2b50 4.7 stars | Nestled on the northern end of Mai Khao Beach adjacent to Sirinat National Park, this resort features traditional Thai stilt-house architecture built around a picturesque lagoon. All accommodations are luxurious private pool villas, offering the ultimat rtments surrounded by dense tropical foliage. Interiors combine rich Thai wooden decor with modern amenities, private balconies, and an outdoor swimming pool. The atmosphere is quiet and relaxed, far away from city noise, making it ideal for independent travelers and families looking for privacy and nature immersion.", "name": "Villa 409 Resort \u0026 Apartments", "transport": "About a 5-minute drive from Phuket International Airport. Shuttle service can be booked with the resort.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Villa%2520409%2520Resort%2520%2526%2520Apartments", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Villa%2520409%2520Resort%2520%2526%2520Apartments", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Villa%20409%20Resort%20%26%20Apartments", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Villa%20409%20Resort%20%26%20Apartments%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "168 Moo 3, Mai Khao, Thalang District, Phuket 83110, Thailand", "feature": "\u2b50 4.5 stars | A resort-style apartment centered around sea breezes and a laid-back vibe, close to Mai Khao Beach and the water park. Rooms come fully equipped with home appliances, a microwave, and a large refrigerator, offering a spacious living room and comfortable bedrooms. The community features a large landscaped pool and gym with a relaxed tropical vibe, popular among international travelers looking for long-term winter stays and quiet beach getaways.", "name": "Mai Khao Ocean Breeze Apartment", "transport": "About a 15-minute drive from Phuket International Airport. Taking a taxi or renting a car is recommended.", "urls": {"agoda": "https://tp.media/r?cam ng Andaman Sea, offering stunning sunset views over Patong Bay. Designed in sophisticated traditional Thai style, the resort boasts multiple scenic infinity pools, a world-class Thai SPA center, and diverse international dining options. Frequent shuttle services to town make this an ideal luxury getaway for travelers seeking panoramic ocean views and deep relaxation.", "lat": 7.9082459, "lng": 98.2970762, "name": "Diamond Cliff Resort \u0026 Spa", "transport": "About a 5-minute drive to central Patong; the resort provides a free shuttle bus to and from Jungceylon Shopping Center.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Diamond%2520Cliff%2520Resort%2520%2526%2520Spa", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.9082459%2C98.2970762", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.9082459,98.2970762", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Diamond%20Cliff%20Resort%20%26%20Spa%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "190 Thaweewong Road, Patong Beach, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.4 Stars | One of the largest 5-star resorts at the northern end of Patong Beach, separated from golden sands by just a coastal road. The property boasts four massive outdoor pools, a bowling alley, fitness center, kids\u0027 club, and multiple international restaurants. With spacious rooms and comprehensive facilities, it is a top choice for family vacations and travelers seeking a full-service resort experience.", "lat": 7.9032991, "lng": 98.2982039, "name": "Phuket Graceland Resort \u0026 Spa", "transport": "Located on the northern stretch of Beach Road, steps away from the sand, and about a 15-minute walk from Bangla Road walking street.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Phuket%2520Graceland%2520Resort%2520%2526%2520Spa", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.9032991%2C98.2982039", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.9032991,98.2982039", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Phuket%20Graceland%20Resort%20%26%20Spa%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1 Soi Rat-U-Thit 200 Pee 2, Patong, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.5 Stars | A boutique 5-star hotel under Accor, tucked away quietly in a serene alley within the bustling heart of Patong. The design seamlessly blends modern chic with Thai elegance, featuring rooms centered around a huge turquoise pool and swim-up bar. It also houses a famous French bakery and a high-end spa. Excellent location\u2014both the beach and nightlife are easily reachable on foot.", "lat": 7.8882476, "lng": 98.2966057, "name": "Grand Mercure Phuket Patong", "transport": "Only about a 6-minute walk to Jungceylon Shopping Center, and around an 8-minute walk to Bangla Road.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Grand%2520Mercure%2520Phuket%2520Patong", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8882476%2C98.2966057", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8882476,98.2966057", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Grand%20Mercure%20Phuket%20Patong%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "39 Thaweewong Road, Patong Beach, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.5 Stars | One of the very few luxury 5-star boutique resorts located directly on the beachfront in central Patong, allowing direct access to the sea in just a few steps. Featuring sleek contemporary design, pool-access rooms, and lavish private pool villas, its rooftop oceanfront venue \u0027The Surface\u0027 is a famous hotspot for sunset views and seafood BBQs. A stylish haven tailored for beach lovers and nightlife enthusiasts.", "lat": 7.8955578, "lng": 98.2954925, "name": "La Flora Resort Patong", "transport": "Situated right in the heart of Beach Road, just a 2-minute walk to Bangla Road walking street.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520La%2520Flora%2520Resort%2520Patong", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8955578%2C98.2954925", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8955578,98.2954925", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=La%20Flora%20Resort%20Patong%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "117 Nanai Road, Patong, Kathu, Phuket 83150, Thailand", "feature": "\u2b50 4.6 Stars | A 5-star luxury eco-resort under IHG\u0027s Vignette Collection, characterized by warm wooden tones and sustainable architecture. Tucked into the lush tropical hillside of Patong, it offers ultra-private pool villas and Instagrammable treetop pools. It delivers a serene, Bali-esque jungle luxury vibe while maintaining quick, easy access to Patong\u0027s vibrancy.", "name": "Dinso Resort \u0026 Villas Phuket, Vignette Collection", "transport": "About a 5-minute dr  Night Market.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Sino%20House%20Phuket%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Sino%20House%20Phuket%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Design Hotels"}, "cat_3": {"items": [{"address": "19 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | As Phuket\u0027s oldest hotel, this building preserves a rich Sino-Portuguese retro architectural style and famously served as a filming location for the movie \u0027The Beach\u0027. Carefully modernized inside, it blends antique furniture details with comfortable contemporary amenities. Perfectly located right in the heart of Phuket Old Town, it offers budget-friendly prices and high standards of cleanliness\u2014making it a fantastic choice combining historical cultural experience with great value for business travelers.", "lat": 7.8838094, "lng": 98.3885438, "name": "The Memory at On On Hotel", "transport": "Take the Airport Bus from Phuket International Airport to the Phuket Town terminal, then walk for about 7 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Memory%2520at%2520On%2520On%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8838094%2C98.3885438", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8838094,98.3885438", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Memory%20at%20On%20On%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1 Hospital Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Located next to the iconic roundabout in the heart of Phuket Old Town, this international chain business hotel offers high standards of service and modern facilities. Spacious, bright rooms come with large work desks and high-speed internet. On-site facilities include an outdoor pool, a 24-hour gym, and fully equipped business meeting rooms. It offers exceptional value for travelers who prioritize stay quality, efficient business needs, and easy access to Old Town strolls.", "lat": 7.8808182, "lng": 98.393037, "name": "Courtyard by Marriott Phuket Town", "transport": "Take the Phuket Airport Express Bus to Clock Tower Station; the hotel is located right next to the roundabout.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Courtyard%2520by%2520Marriott%2520Phuket%2520Town", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8808182%2C98.393037", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8808182,98.393037", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Courtyard%20by%20Marriott%20Phuket%20Town%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "3 Soi Phutorn, Bangkok Rd, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | A digital nomad and business-oriented hotel featuring a sleek black-and-white minimalist design, ideal for remote workers and budget-conscious business travelers. The lobby doubles as an open co-working space offering high-speed Wi-Fi, along with complimentary coffee and snacks. Rooms are chic and functional with extremely comfortable mattresses, located just a few minutes\u0027 walk from the lively Old Town streets for both peace and convenience.", "name": "Blu Monkey Hub and Hotel Phuket", "transport": "Take a Songthaew or taxi from Phuket Bus Terminal 1, taking about 5 minutes to arrive.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Blu%2520Monkey%2520Hub%2520and%2520Hotel%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Blu%2520Monkey%2520Hub%2520and%2520Hotel%2520Phuket", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Blu%20Monkey%20Hub%20and%20Hotel%20Phuket", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Blu%20Monkey%20Hub%20and%20Hotel%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "258/7 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.2 stars | Located near the historic Old Town and local shopping malls, this vibrant design hotel offers highly competitive, affordable rates. Rooms are decorated in sweet macaron pastels, brightly lit, immaculate, and equipped with a dedicated workspace. Friendly staff and complimentary bicycle rentals make it easy for both business and leisure guests to explore the charming alleys of Old Town.", "name": "The Tint at Phuket Town Hotel", "transport": "Just a 3-minute walk from Dibuk Road to the Sunday Walking Street Market, and about 45 minutes by taxi from the airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Tint%2520at%2520Phuket%2520Town%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520The%2520Tint%2520at%2520Phuket%2520Town%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20The%20Tint%20at%20Phuket%20Town%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Tint%20at%20Phuket%20Town%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1 Montri Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.2 stars | Artfully blending classical Chinese and Portuguese aesthetics, this modern business hotel offers exceptionally spacious rooms featuring large work desks and comfortable sofa lounging areas\u2014perfect for extended business trips or remote work. It features a relaxing spa center and an on-site specialty restaurant at affordable rates, just steps away from the famous Old Town weekend walking street market.", "name": "Sino House Phuket Hotel", "transport": "Right next to Phuket Bus Terminal 1, about a 6-minute walk after getting off.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Sino%20House%20Phuket%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Sino%20House%20Phuket%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "42 Montri Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.1 stars | A classic landmark business hotel in Phuket Town, boasting elegant and traditional decor throughout its architecture and rooms. Facilities include large banquet/meeting halls, a Cantonese dim sum restaurant, and an outdoor swimming pool. While it carries a touch of retro charm, it is well-maintained with professional service and highly competitive rates\u2014ideal for business travelers seeking a quiet work environment and high value.", "lat": 7.8820588, "lng": 98.3921964, "name": "Pearl Hotel Phuket", "transport": "Located in the heart of the Montri Road commercial area; take the Airport Bus to Phuket Town Terminal, then walk about 5 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Pearl%2520Hotel%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8820588%2C98.3921964", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8820588,98.3921964", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Pearl%20Hotel%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26 Phuket Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | A boutique business hotel exuding a fresh, white French Colonial style, ideally situated on a main street in Old Town\u0027s historic district. Featuring a boutique setting with a limited number of quiet, elegant rooms, it offers a cozy outdoor garden pool and a delightful breakfast. Rooms are fully equipped with modern business facilities and complimentary high-speed internet, making it a top choice for quality, privacy, and value.", "name": "Casa Blanca Boutique Hotel Phuket", "transport": "Only a 2-minute walk from the Thai Hua Museum in Phuket Old Town; easily accessible directly by taxi from the airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Casa%2520Blanca%2520Boutique%2520Hotel%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Casa%2520Blanca%2520Boutique%2520Hotel%2520Phuket", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Casa%20Blanca%20Boutique%20Hotel%20Phuket", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Casa%20Blanca%20Boutique%20Hotel%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "154 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.2 stars | A long-established high-rise business hotel strategically located in central Phuket Town, featuring large convention and exhibition spaces, a full fitness center, and multiple themed restaurants. High-floor rooms offer magnificent panoramic views of Phuket Old Town and distant mountains. Adjacent to the bus terminal and Old Town shopping district, it offers unrivaled transit convenience and professional business services\u2014an ideal choice for those seeking comprehensive facilities on a reasonable budget.", "name": "Royal Phuket City Hotel", "transport": "Located directly opposite Phuket Bus Terminal 1, just a 1-minute walk after exiting the station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Royal%2520Phuket%2520City%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Royal%2520Phuket%2520City%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Royal%20Phuket%20City%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Royal%20Phuket%20City%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Great-Value Business Hotels"}, "cat_4": {"items": [{"address": "19 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 Stars | Located on Phang Nga Road in the heart of Phuket Old Town, this Sino-Portuguese heritage building constructed in 1929 is Phuket\u0027s oldest hotel and famously featured in the movie \u0027The Beach\u0027. Beautifully renovated, it preserves carved wooden doors, open-air courtyards, and retro floor tiles while blending in modern comforts. The spacious, warm rooms are filled with nostalgic Nanyang charm, inviting guests on a time-traveling journey back to Phuket\u0027s golden 1930s era. With warm service and an unbeatable location, it remains a top choice for experiencing Old Town culture.", "lat": 7.8838094, "lng": 98.3885438, "name": "The Memory at On On Hotel", "transport": "Take the Airport Bus from Phuket International Airport to the Phuket Old Town terminal, followed by a 5-minute walk; or take a Grab ride for about 45 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Memory%2520at%2520On%2520On%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8838094%2C98.3885438", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8838094,98.3885438", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Memory%20at%20On%20On%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "15 Soi Romanee, Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 Stars | Situated in the iconic Soi Romanee of Phuket Old Town, this pastel-hued Sino-Portuguese building radiates a dreamy ambiance. The guesthouse retains antique wooden staircases, vintage shutters, and delicate wall murals while incorporating vibrant color designs. Rooms are sleek, clean, and equipped with modern amenities, featuring balconies that overlook the colorful historic street. Downstairs, popular cafes, artisan shops, and the Sunday Lard Yai Night Market are just steps away, making it ideal for photography lovers and cultural explorers.", "name": "The Rommanee Classic Guesthouse", "transport": "About an 8-minute walk from the Old Phuket Bus Terminal; approximately a 50-minute taxi ride from Phuket International Airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Rommanee%2520Classic%2520Guesthouse", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520The%2520Rommanee%2520Classic%2520Guesthouse", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20The%20Rommanee%20Classic%20Guesthouse", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Rommanee%20Classic%20Guesthouse%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "43 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 Stars | Housed in a century-old mansion formerly owned by a tin mining tycoon family, this property seamlessly combines an antique museum, art gallery, and boutique hotel. Inside, priceless antique furniture, historic photographs, and artworks are displayed alongside a lush Nanyang-style central courtyard and atrium. Rooms showcase refined vintage elegance with intricate wood-carved beds and retro decor. Freshly made Southern Thai breakfasts are served daily, and the hospitable hosts warmly share local history, delivering an unparalleled, high-quality stay.", "lat": 7.8837798, "lng": 98.389406, "name": "Woo Gallery \u0026 Boutique Hotel", "transport": "Located near the Phuket Old Town Clock Tower, a 6-minute walk from the Old Town Bus Terminal; around 45 minutes by car from the airport.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Woo%2520Gallery%2520%2526%2520Boutique%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8837798%2C98.389406", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8837798,98.389406", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Woo%20Gallery%20%26%20Boutique%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26 Montri Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 Stars | Tucked away in the heart of Old Town, this French Colonial-style boutique hotel features all-white architecture and a charming courtyard pool, creating an elegant and peaceful retreat. Rooms blend romantic European modern aesthetics with Sino-Portuguese elements, featuring bright lighting and comfortable bedding for total relaxation. Guests can enjoy a small outdoor plunge pool, sun terrace, and exquisite Western breakfast. Despite its central location near historic halls and old streets, it remains quiet and tranquil, making it perfect for couples or travelers seeking niche boutique stays.", "name": "Casa Blanca Boutique Hotel", "transport": "Located on the east side of Phuket Old Town, just a 3-minute walk from Phuket Bus Terminal 1, offering extremely convenient access.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Casa%2520Blanca%2520Boutique%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Casa%2520Blanca%2520Boutique%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Casa%20Blanca%20Boutique%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Casa%20Blanca%20Boutique%20Hotel%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "125 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 Stars | Balancing sleek modern design with vintage aesthetics, this apartment-style guesthouse is situated in the prime area of Old Town. Meticulously converted from a traditional shophouse, it retains original red brick walls and high ceilings while adding a modern kitchenette, living room sofa area, and premium bathroom facilities. Spacious suites make it ideal for families or long-term independent travelers. Surrounded by renowned local eateries, including Michelin Bib Gourmand spots, guests can fully immerse themselves in Old Town\u0027s relaxed pace of life.", "name": "Baan 125 Stay Phuket Old Town", "transport": "Located on Thalang Road in the historic district; approximately a 7-minute walk from the Old Phuket Bus Terminal.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Baan%2520125%2520Stay%2520Phuket%2520Old%2520Town", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Baan%2520125%2520Stay%2520Phuket%2520Old%2520Town", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Baan%20125%20Stay%20Phuket%20Old%20Town", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Baan%20125%20Stay%20Phuket%20Old%20Town%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "154/1 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 Stars | Shunli Hotel offers a fresh stay blending modern minimalism with traditional Old Town elements. Its architectural design incorporates sunlit open courtyards, lush greenery, and industrial concrete aesthetics, creating a bright and relaxing space. Rooms are spotless with ultra-comfortable mattresses, offering excellent privacy and a quiet environment. The communal area provides complimentary coffee and tea, while friendly staff are eager to offer deep local travel recommendations. Highly cost-effective, it is a favorite among young backpackers and trendy travelers.", "name": "Shunli Hotel \u0026 Guesthouse", "transport": "Situated on Dibuk Road, about a 10-minute walk from Phuket Old Town Bus Terminal and just a 4-minute walk to the Old Town Night Market.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Shunli%2520Hotel%2520%2526%2520Guesthouse", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Shunli%2520Hotel%2520%2526%2520Guesthouse", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Shunli%20Hotel%20%26%20Guesthouse", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Shunli%20Hotel%20%26%20Guesthouse%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "99 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 Stars | Located on bustling Thalang Road in the heart of Old Town, this warm, family-run guesthouse perfectly preserves the traditional narrow-and-deep Sino-Portuguese shophouse architecture. Stepping inside reveals homey warmth and nostalgic wooden decor adorned with vintage household artifacts and historic photos. Rooms are cozy, comfortable, and spotlessly clean. Best of all, it opens right onto the Sunday Walking Street Night Market (Lard Yai), letting guests step outside to enjoy street food and live performances\u2014an ideal base for experiencing local vibrancy.", "lat": 7.8848259, "lng": 98.3896878, "name": "99 Oldtown Boutique Guesthouse", "transport": "Located right in the middle of Thalang Road Walking Street, about a 6-minute walk from the Old Phuket Bus Terminal.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%252099%2520Oldtown%2520Boutique%2520Guesthouse", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8848259%2C98.3896878", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8848259,98.3896878", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=99%20Oldtown%20Boutique%20Guesthouse%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1/1 Montri Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.1 Stars | Combining modern Chinese style with rich Sino-Portuguese historic charm, Sino House offers spacious apartment suites and double rooms. Guest rooms feature solid dark-wood furniture, elegant lighting, large windows, kitchenettes, and private balconies, providing home-like comfort. The property also features an onsite Thai massage center and a tranquil courtyard garden, perfect for unwinding after exploring the Old Town. Positioned near the edge of the historic area, it offers a quiet night\u0027s sleep while remaining within easy walking distance of cultural landmarks.", "name": "Sino House Phuket Hotel \u0026 Apartment", "transport": "Located near central Phuket Town, just 300 meters from the Old Phuket Bus Station, a quick 4-minute walk away.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel%2520%2526%2520Apartment", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DPhuket%2520Sino%2520House%2520Phuket%2520Hotel%2520%2526%2520Apartment", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Phuket%20Sino%20House%20Phuket%20Hotel%20%26%20Apartment", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Sino%20House%20Phuket%20Hotel%20%26%20Apartment%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Guesthouses"}}, "name": "Phuket Old Town Historic District"}, "rawai_naiharn": {"categories": {"cat_1": {"items": [{"address": "23/3 Moo 1, Vises Road, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.6 stars | A premier luxury landmark resort nestled on the hillside at the northern end of Nai Harn Beach, formerly the renowned Royal Phuket Yacht Club. All rooms and suites feature extra-large private balconies with dedicated daybeds, allowing guests to enjoy uninterrupted, front-row views of Nai Harn Bay\u2014voted one of Asia\u2019s most beautiful beaches. The resort features rooftop open-air bars, Rock Salt and Reflections, offering unmatched sunset sea views, alongside private beach service, a top-tier spa, and an infinity pool. It is the ultimate choice for luxury and romance.", "lat": 7.7785208, "lng": 98.3022569, "name": "The Nai Harn", "transport": "Approximately a 70-minute drive from Phuket International Airport; the hotel also offers premium private transfer services.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520The%2520Nai%2520Harn", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.7785208%2C98.3022569", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.7785208,98.3022569", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=The%20Nai%20Harn%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "11/5 Moo 1, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.5 stars | A luxury 5-star resort secluded on a hillside next to Nai Harn Beach, surrounded by serene and lush greenery. Combining modern aesthetics with Thai elegance, the resort offers spacious scenic rooms and private pool villas. Facilities include multiple stunning outdoor pools, dedicated kids\u0027 waterslides, a full-service spa, and an elevated scenic restaurant. Located just steps from Nai Harn Beach, guests can easily stroll down to enjoy the fine white sand and clear blue waters, making it a popular choice for families and couples.", "lat": 7.7799555, "lng": 98.3079481, "name": "Sunsuri Phuket", "transport": "Just a 5-minute walk to Nai Harn Beach; approximately an 8-minute drive to Rawai Seafood Market.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Sunsuri%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.7799555%2C98.3079481", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.7799555,98.3079481", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Sunsuri%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "15/28 Moo 1, Soi Naya, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.4 stars | A flagship 5-star resort under the world-renowned brand, located right next to lagoon views and Nai Harn Beach. The design seamlessly blends modern chic with a tropical oasis vibe, featuring multiple lagoon-style pools, a top-tier spa, and several international dining venues. Rooms are elegantly appointed with high-quality bedding and modern technology amenities, creating a sophisticated luxury atmosphere ideal for travelers seeking high-end comfort and a relaxed vacation pace.", "lat": 7.7832764, "lng": 98.3118447, "name": "Wyndham Grand Nai Harn Beach Phuket", "transport": "Located about 800 meters from Nai Harn Beach, with the hotel offering free scheduled shuttle services to and from the beach.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Wyndham%2520Grand%2520Nai%2520Harn%2520Beach%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.7832764%2C98.3118447", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.7832764,98.3118447", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Wyndham%20Grand%20Nai%20Harn%20Beach%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "14/11 Moo 5, Vises Road, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.3 stars | A luxury beachfront resort on the eastern coast of Rawai, formerly Serenity Resort. Overlooking mesmerizing Chalong Bay ocean views with a private beach area, it offers diverse accommodations ranging from stylish deluxe rooms to beachfront penthouses with private pools. Guests can enjoy signature cocktails by the sea-view infinity pool or relax at the spa. The resort effortlessly blends modern digital nomad community culture with luxury comfort, creating a vibrant yet relaxed atmosphere.", "lat": 7.8010512, "lng": 98.3366548, "name": "Selina Serenity Rawai Phuket", "transport": "A 5-minute drive to Rawai Seafood Market and about a 25-minute drive to Phuket Old Town.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DPhuket%2520Selina%2520Serenity%2520Rawai%2520Phuket", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D7.8010512%2C98.3366548", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=7.8010512,98.3366548", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Phuket\u0026destName=Selina%20Serenity%20Rawai%20Phuket%2C%20Phuket\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "56/80 Moo 4, Chaofa Road, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.6 stars | A modern 5-star lifestyle resort centered around health, fitness, and luxury living. It features StayFit, one of Southern Thailand\u0027s premier fitness centers, a professional Muay Thai ring, and the distinctive luxury Japanese-style Stay Spa. The resort houses three large outdoor pools and two high-end dining restaurants, with rooms featuring minimalist yet refined design. Ideal for health-conscious travelers seeking wellness, active fitness, and sophisticated relaxation.", "lat             catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No data available.</div>`;
                return;
            }
            
            document.getElementById('content-area').innerHTML = items.map(item => {
                const itemName = item.name || item.title || "Hotel";
                const itemFeature = item.feature || item.description || "";
                const itemAddress = item.address || item.location || "See Map Navigation";
                const itemTransport = item.transport || item.transit || "See Map";
                
                // 保留亮點的 Google 搜尋功能
                const searchKeyword = encodeURIComponent(`${cityNameEn} ${itemName}`);
                const formattedFeature = itemFeature.replace(/(⭐\s*[\d\.]+(?:\s*Stars?|\s*星)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 🚀 直接讀取 Python 預先處理好的網址
                const mapUrl = item.urls?.gmap || `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;
                const agodaUrl = item.urls?.agoda || '#';
                const bookingUrl = item.urls?.booking || '#';
                const tripUrl = item.urls?.trip || '#';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${itemName}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Highlights</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address：</span><br>${itemAddress}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transportation：</span><br>${itemTransport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> Map Navigation
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
   
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">

    </footer>
</body>
