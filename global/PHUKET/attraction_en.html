e street are lined with Sino-Portuguese shophouses painted in pastel shades of pink, yellow, and sky blue, now housing cozy cafes and creative boutique shops\u2014making it a top spot for photography and soaking up retro vibes.", "name": "Soi Romanee Historic Buildings", "transport": "Connecting Thalang Road and Dibuk Road; simply turn off the main Thalang Road walking street to enter."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "28 Krabi Road, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Formerly Phuket\u0027s first Chinese school established in 1934, this building is a classic Grade II Sino-Portuguese heritage architecture. The museum provides detailed exhibits illustrating the history of Hokkien Chinese immigrants settling and developing Phuket during the 19th-century tin mining boom. Exhibits cover historical mining techniques, daily household artifacts, traditional Chinese wedding customs, and Baba-Nyonya culinary culture. The high-ceiling atrium and elegant arcades offer great photography opportunities, making it the premier history museum to explore Phuket\u0027s rich heritage and the evolution of Old Town.", "name": "Phuket Thai Hua Museum", "transport": "Located on Krabi Road in Phuket Old Town, about a 5-minute walk from the Old Town Clock Tower."}, {"address": "Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | Located in the heart of Phuket Old Town, this striking yellow classic building was formerly the Phuket branch of Standard Chartered Bank. It has been repurposed into a dedicated museum showcasing local Peranakan (Baba-Nyonya) culture. Interactive multimedia and rare historical artifacts illustrate the unique lifestyle, exquisite traditional attire, and architectural aesthetics born from the blending of Chinese and Thai cultures. Preserving delicate late 19th-century arches and colonnades, it is one of Old Town\u0027s most popular cultural landmarks for photos.", "name": "Phuket Baba Museum", "transport": "Located at the intersection of Phangnga Road and Phuket Road, right next to the iconic Old Town Clock Tower."}, {"address": "98 Krabi Road, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 stars | Built in 1903, Baan Chinpracha is Phuket\u0027s first grand Sino-Portuguese private mansion, now partially open to the public as a private museum. Maintained by descendants of a tin mining tycoon, the interior preserves imported European pattern tiles, Italian marble floors, intricately carved Chinese rosewood furniture, and family heirloom antiques from over a century ago. The open-air courtyard garden and vintage kitchen offer a glimpse into the luxurious lifestyle of a prominent family, making it a popular filming location for TV shows and wedding photography.", "name": "Baan Chinpracha House Museum", "transport": "Located on the west side of Krabi Road, about a 3-minute walk west along Krabi Road from the Thai Hua Museum."}, {"address": "Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.6 stars | This private history museum was converted from a century-old traditional Chinese pharmacy. Inside, it preserves authentic century-old wooden apothecary cabinets, traditional herb grinding tools, hand-copied medical manuscripts passed down through generations, and vintage photographs. The warm and welcoming host shares stories about the history of traditional medicine in Old Town and early immigrant life. Filled with nostalgic charm and the soothing aroma of dried herbs, visiting feels like stepping back in time to last century\u0027s Phuket.", "name": "Moh Seng Historic House Museum", "transport": "Located on Yaowarat Road in Phuket Old Town, about a 4-minute walk from the main walking street."}, {"address": "Montri Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.0 stars | Housed in a historic 1930s post office building, this museum displays the century-long evolution of Thailand\u0027s postal service on Phuket Island. On display are rare vintage stamps, antique mailboxes, telegraph equipment, and historic postman vehicles. Beyond static historical exhibits, an active postal counter allows visitors to purchase commemorative stamps and postcards featuring Sino-Portuguese architecture, complete with a unique souvenir postmark to send to friends and family.", "name": "Phuket Philatelic Museum", "transport": "Located on Montri Road, just a 2-minute walk from the Old Phuket Bus Terminal."}, {"address": "43 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.7 stars | Meticulously restored from a century-old heritage house, this private gallery and museum was originally the residence of the prominent local Woo family shop. It houses a vast collection of valuable folk antiques, antique gramophones, clocks, traditional pewterware, and handcrafted items. The beautifully designed exhibition space seamlessly blends traditional Sino-Portuguese architecture with contemporary visual art. After exploring, visitors can enjoy delicate tea and refreshments at the vintage ground-floor cafe, immersing themselves in Old Town\u0027s artistic elegance.", "name": "Woo Gallery and Museum", "transport": "Located on Phangnga Road, about a 3-minute walk east along Phangnga Road from the Old Town Clock Tower."}, {"address": "12/1 Phattana Road, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Serving as the main place of worship for local Catholics in Phuket, this church features an elegant white and light yellow exterior blending Western classical Catholic design with tropical Nanyang touches. The serene interior features beautifully carved altars and stained glass windows, reflecting the harmonious co-existence of diverse religious cultures in Old Town. Peaceful and quiet compared to the bustling tourist streets, it is a serene cultural landmark to appreciate art and faith.", "name": "Sacred Heart Church Phuket", "transport": "Located on Phattana Road, approximately a 10-minute walk from Soi Romanee."}, {"address": "130/1 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.2 stars | Located in Old Town, this interactive exhibition space combines visual arts with modern creative fun. Featuring over 100 large 3D murals and paintings created using trompe-l\u0027\u0153il technique, the exhibits range from parodies of famous classical paintings to adventure scenes and local Thai cultural elements. Visitors can step into the artwork to pose and capture fun, visually striking photos, making it a fantastic, engaging experience for families and art lovers alike.", "name": "Phuket Trickeye Museum", "transport": "Located near the intersection of Phangnga Road and Montri Road, about a 4-minute walk from the Old Town Clock Tower."}], "name": "Arts \u0026 Cultural Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Talad Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | An iconic green park located in the heart of Phuket Old Town, best known for the giant golden sea dragon fountain statue (Hai Leng Ong) standing as a guardian of the town. Built to celebrate Queen Sirikit\u0027s 72nd birthday, the park features lush green lawns and smooth walking paths, making it an ideal spot to stroll and relax after exploring the Sino-Portuguese arcade architecture. In the cool evening breeze, local residents gather here to exercise and relax, reflecting a unique blend of nature and local culture.", "name": "72nd Anniversary Queen Sirikit Park", "transport": "Located at the junction of Dibuk Road and the Thai Hua Museum in Phuket Old Town, easily accessible on foot from the town center."}, {"address": "Khao Rang Hill, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.6 stars | Situated atop Khao Rang Hill northwest of Phuket Old Town, this is the premier natural viewpoint offering sweeping views of the old town streets and the azure coastline in the distance. Shaded by ancient, towering trees, the park features a modern observation platform extending into the canopy, cozy pavilions, and fitness trails. Wild monkeys can often be seen frolicking through the trees. It is a magnificent spot to catch crimson sunsets and twinkling night vistas, complete with several scenic hilltop restaurants for a relaxed evening.", "name": "Khao Rang Hill Viewpoint Park", "transport": "A 10-minute ride up the winding mountain road via Tuk-Tuk, taxi, or scooter from central Phuket Old Town."}, {"address": "Chao Fah Tawan Tok Rd, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 stars | As the largest municipal green park in Phuket Town, located just a few minutes\u0027 drive from Old Town, this park centers around a vast lake surrounded by lush woods, tropical gardens, and several kilometers of walking and cycling trails. Rich in local wildlife, visitors can spot water birds and monitor lizards. Equipped with children\u0027s play areas and outdoor fitness equipment, it attracts many locals for morning and evening workouts\u2014making it a perfect park to experience the slow-paced local lifestyle.", "name": "Suan Luang Rama IX Park Phuket", "transport": "Drive or ride a scooter southwest from Phuket Old Town for about 5 minutes."}, {"address": "Phuket Rd, Talad Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.2 stars | Located in the Saphan Hin coastal area extending from Phuket Old Town, this park features a well-preserved, extensive mangrove wetland ecosystem. A winding wooden boardwalk meanders through the mangrove canopy and marshland, allowing visitors to closely observe fiddler crabs, mudskippers, and various migratory birds and waterfowl. Fresh-aired and pleasantly cool, it is an educational and wild eco-sanctuary right near the old town.", "name": "Saphan Hin Mangrove Park", "transport": "Head straight south along Phuket Road from Phuket Old Town; it takes about an 8-minute drive."}, {"address": "Saphan Hin, Talad Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.1 stars | Situated directly along the Andaman Sea coast, Saphan Hin Park is a favorite seaside retreat for Phuket Old Town residents. The park boasts coastal tree-lined paths, expansive lawns, and soaring coconut palms, offering sweeping views of the blue ocean and bay. In the late afternoon and evening, the lawns fill with families picnicking and people exercising. Near the park entrance, a shrine dedicated to the Nine Emperor Gods and a monument commemorating tin mining history seamlessly blend natural beauty with local cultural heritage.", "name": "Saphan Hin Seaside Park", "transport": "A 7 to 10-minute drive or scooter ride south from Phuket Old Town."}, {"address": "Soi Vachira, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 stars | Nestled on the slopes of Khao Rang Hill, this nature trail and forest park offers a quieter, cooler hiking retreat compared to the mountain-top viewpoint. Dense tropical foliage forms a natural canopy over the trails, filling the air with fresh forest phytoncides. Dotted with outdoor workout stations and rest pavilions along the way, it\u0027s perfect for outdoor enthusiasts looking to escape urban hustle and immerse themselves in nature.", "name": "Khao Rang Nature Trail \u0026 Fitness Park", "transport": "A 15-minute walk from Phuket Old Town to the trailhead at the foot of the hill, or take a short ride directly to the mid-mountain trailhead."}, {"address": "28 Krabi Rd, Talad Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 stars | Tucked inside the Thai Hua Museum, this central courtyard oasis seamlessly blends Sino-Portuguese heritage architecture with tropical landscape design. Lush tropical flora and ancient trees complement the weathered red-brick walls. Not only is it a microcosm of Old Town\u0027s history and Chinese immigrant culture, but its serene and elegant courtyard atmosphere also offers a peaceful green space for a relaxing break and great photos while exploring the town.", "name": "Thai Hua Museum Garden \u0026 Courtyard", "transport": "Located on Krabi Road in Phuket Old Town, easily accessible on foot from any of the main streets."}, {"address": "Phangnga Rd, Talad Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 stars | Hidden deep in an alley of Phuket Old Town, Sang Tham Shrine is a historic and quiet Chinese temple featuring a compact Hokkien-style courtyard garden. Lush greenery enhances the intricately carved traditional temple architecture, while small bridges, flowing water, and stone sculptures create a tranquil and harmonious ambiance\u2014a rare peaceful oasis and cultural gem amid the bustling town streets.", "name": "Sang Tham Shrine Courtyard \u0026 Green Space", "transport": "Tucked inside an alley off Phangnga Road in Phuket Old Town, just a 3-minute walk from the Old Town Clock Tower."}], "name": "Nature \u0026 Parks"}, "cat_4": {"items": [{"address": "Soi Romanee, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.6 Stars | Soi Romanee is one of the most romantic and historic alleys in Phuket Old Town. Once a bustling red-light district and gambling den, it has been transformed into a vibrant lane filled with colorful Sino-Portuguese architecture. Pastel pink, sky blue, and bright yellow shophouses line the street, adorned with lush greenery and vintage lamps, creating picture-perfect photo spots at every step. Home to charming cafes, artisanal ice cream shops, and boutique craft stores, the sunlit brick alley exudes a relaxed, slow-paced French-Southeast Asian charm in the afternoon.", "name": "Soi Romanee", "transport": "Easily accessible on foot from Thalang Road in Phuket Old Town."}, {"address": "28 Krabi Road, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.4 Stars | Built in 1911, this elegant two-story Baroque-style Chinese building was originally Phuket\u0027s first Chinese language school, Thai Hua School. Today, the museum exhibits rich artifacts depicting Chinese migration, tin mining history, and the blending of Chinese and Thai cultures. The architecture features grand arches, intricately carved pillars, and a classic central atrium courtyard. White walls contrasting with dark wooden shutters make it a marvelous backdrop for capturing historic charm and architectural elegance. Interactive multimedia and rare historical photographs vividly tell the inspiring story of Chinese immigrants establishing roots in Phuket.", "name": "Phuket Thaihua Museum", "transport": "Located on Krabi Road, about a 5-minute walk from Soi Romanee."}, {"address": "Intersection of Phang Nga Road and Phuket Road, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 Stars | Located at the intersection of Phang Nga Road and Phuket Road, this clock tower is one of Phuket Old Town\u0027s most iconic landmarks. Featuring pastel yellow walls with white trim, this colonial-style structure originally housed a police station and the Standard Chartered Bank. The elegant four-story clock tower stands proudly at the corner, exuding classic European nostalgia. It is an essential first stop for visitors; whether photographing its architectural details under the clear blue sky or catching its warm retro glow at dusk, you\u0027re guaranteed stylish, exotic shots.", "name": "Old Phuket Police Station Clock Tower", "transport": "Located at the central intersection of Old Town; accessible on foot or via songthaew to central Phuket Old Town."}, {"address": "72/1 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 Stars | Tucked away in a narrow alley along Phang Nga Road, the Shrine of the Serene Light is a century-old Hokkien-style Taoist temple built in 1889 by a local Hokkien family. Dedicated to the deity Dingguang Ancient Buddha, this temple boasts exquisitely carved wooden beams, swept-up eaves, dragon pillars, and vibrant murals of exceptional craftsmanship despite its modest size. Passing through the grand archway at the alley entrance into the tranquil courtyard feels like stepping back in time. It is a peaceful hidden gem for soaking in heritage and taking quiet cultural photos.", "name": "Shrine of the Serene Light (Teng Kong Tong)", "transport": "Walk west along Phang Nga Road from the Old Police Station Clock Tower for about 3 minutes, and look for the decorative archway on the side of the road."}, {"address": "19 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.5 Stars | Built in 1929, this historic hotel is Phuket\u0027s oldest and famously featured in the opening scenes of Leonardo DiCaprio\u0027s classic movie \u0027The Beach\u0027. Beautifully restored, it showcases glamorous Sino-Portuguese architecture. Stepping into the high-ceilinged lobby, vintage leather sofas, antique telephones, old typewriters, and patterned floor tiles blend seamlessly to create a dramatic retro cinematic ambiance. Even non-guests frequently stop by to snap photos in the lobby and charming porch, immersing themselves in old-world Nanyang luxury.", "name": "The Memory at On On Hotel", "transport": "Located on Phang Nga Road, just a few steps from the Shrine of the Serene Light, easily reached on foot."}, {"address": "Thalang Rd, Dibuk Rd, and Phang Nga Rd, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.6 Stars | Scattered across the vibrant streets and alleys of Old Town (such as Thalang Rd, Dibuk Rd, and Phang Nga Rd), these murals represent Phuket\u0027s most lively cultural attractions. Created by renowned Thai street artists alongside local creators, the artwork blends traditional Phuket delicacies (like Ang Ku Kueh and local sweets), festive customs, daily life of early Chinese settlers, and playful characters like the three-eyed rabbit Mardi. Visitors can go on a scavenger hunt through colorful historic lanes, snapping photos of these vivid and whimsical pieces along the way.", "name": "Phuket Old Town Street Art", "transport": "Spread throughout the historic center of Phuket Old Town; best explored on a leisurely walking tour."}, {"address": "Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.7 Stars | Every Sunday evening, Thalang Road in the heart of Old Town transforms into the bustling Lard Yai Walking Street night market. Colorful fairy lights illuminate the century-old Sino-Portuguese buildings lining the street. The market features over a hundred stalls offering authentic Southern Thai street food, handmade local crafts, live acoustic music, and street performances. Seamlessly blending historical heritage with vibrant night market energy, lantern-draped streets lined with illuminated shophouses make this an unmissable Sunday night event.", "name": "Lard Yai Phuket Sunday Walking Street", "transport": "Held every Sunday from 16:00 to 22:00 along Thalang Road; take a taxi or songthaew to the Old Town entrance and explore on foot."}, {"address": "98 Krabi Road, Talat Nuea, Mueang Phuket District, Phuket 83000, Thailand", "feature": "\u2b50 4.3 Stars | Built in 1903, Baan Chinpracha is Phuket\u0027s first Sino-Portuguese historic private mansion, lovingly preserved and still inhabited by descendants of the original family. This two-story estate features a rare central open-air courtyard, imported Italian patterned floor tiles, intricately carved wooden shutters, and living halls adorned with century-old antique furniture. Sections of the mansion are open to visitors, where you can rent traditional Baba/Yaya attire for photo ops and immerse yourself in the luxurious lifestyle of a 20th-century tin mining tycoon.", "name": "Baan Chinpracha Mansion", "transport": "Located on the western end of Krabi Road, approximately a 3 to 5-minute walk west from the Thaihua Museum."}], "name": "Popular Photo Spots"}}, "name": "Phuket Old Town Historic Cultural District"}, "rawai_naiharn": {"categories": {"cat_1": {"items": [{"address": "Promthep Cape, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 Stars | Built in 1996 to commemorate the 50th anniversary of King Rama IX\u0027s accession to the throne, the Kanchanaphisek Lighthouse sits atop Promthep Cape. This magnificent structure houses a small historical museum displaying lighthouse history and nautical equipment inside, while its top floor offers breathtaking panoramic views of the Andaman Sea and surrounding islands.", "name": "Kanchanaphisek Lighthouse (Golden Jubilee Lighthouse)", "transport": "About a 10-minute drive south from Rawai Beach via Route 4024. A large public parking area is available."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 Stars | Situated by the shores of Nai Harn Lagoon, this quaint Thai temple serves as the spiritual center for local residents and fishermen. Housing revered Buddha statues, the temple boasts a peaceful and elegant atmosphere rich in traditional Theravada Buddhist architecture and authentic local heritage.", "name": "Wat Nai Harn", "transport": "Located next to the lagoon just behind Nai Harn Beach, about a 3-minute walk from the beach."}, {"address": "Promthep Cape, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 Stars | Perched at the tip of Promthep Cape, this shrine dedicated to Lord Brahma (Four-Faced Buddha) is surrounded by thousands of colorful wooden elephant carvings donated by worshippers fulfilling vows. It is one of Phuket\u0027s most legendary and culturally significant spiritual landmarks, steeped in traditional Thai religious aura.", "name": "Promthep Cape Brahma Shrine", "transport": "Upon reaching Promthep Cape Park via Route 4024, follow the stone stairs up to the highest viewing platform."}, {"address": "Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.1 Stars | This is the oldest settlement of Phuket\u0027s indigenous Sea Gypsies (Chao Le), preserving centuries of sea-faring traditional lifestyles and simple wooden stilt house architecture. A visit here offers deep insight into local maritime culture and indigenous history.", "name": "Rawai Sea Gypsy Cultural Village", "transport": "Located on the east side of Rawai Pier, a 3-minute walk east along the beach trail from the Rawai Seafood Market."}, {"address": "Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 Stars | An important historic temple near the entrance to the Rawai district, Wat Sawang Arom has long grown alongside the local community. Featuring elegant Southern Thai traditional architecture, its golden pagoda and intricately carved eaves hold great artistic value, making it an insightful landmark for exploring local spiritual history.", "name": "Wat Sawang Arom", "transport": "Drive along Wiset Main Road toward Rawai Beach; the temple is located on the right side of the road, easily accessible by car or scooter."}, {"address": "Rawai Pier, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.2 Stars | Situated at the start of the Rawai Pier jetty, this ancient traditional shrine honors the guardian deities of local fishermen and Sea Gypsies. It encapsulates decades of the fishing port\u0027s history and maritime evolution, decorated with burning incense and traditional offerings.", "name": "Rawai Pier Spirit Shrine", "transport": "Walk to the entrance of Rawai Pier at the center of Rawai Beach."}, {"address": "4233 Tambon Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 Stars | Despite its name, Karon Viewpoint is geographically located on the hill north of Nai Harn Beach. Built decades ago, this classic wooden Thai pavilion is one of Phuket\u0027s oldest and most iconic landmarks, offering famous sweeping views of the three crescent bays: Kata Noi, Kata Yai, and Karon.", "name": "Karon Viewpoint Pavilion", "transport": "About an 8-minute drive or scooter ride north from Nai Harn Beach along mountain road Route 4233 to reach the summit."}, {"address": "Krating Cape, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 Stars | Tucked away on the steep cliffside southwest of Nai Harn Beach, this ancient coastal shrine was a vital landmark where early seafarers and locals prayed for safe voyages. Simple in structure yet rich in history, it is set against dramatic ocean cliffs offering high historical and adventure value.", "name": "Laem Krating Coastal Shrine", "transport": "Start from the trail near Baan Krating Resort by Nai Harn Beach and hike along the coastal cliff trail for about 35 minutes."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "12/2 Moo 2, Viset Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.1 Stars | Located near Rawai Beach, the Phuket Seashell Museum houses an extensive collection of rare seashells from Thailand and around the world. The museum features giant precious pearls, seashell fossils dating back millions of years, and a colorful array of marine life specimens. With educational and artistic exhibits alongside delicate craft displays, it is a wonderful spot to learn about marine ecology and admire natural visual arts.", "name": "Phuket Seashell Museum", "transport": "Drive north along Viset Road from Rawai Beach for about 5 minutes to arrive."}, {"address": "Moo 1, Nai Harn Lake Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.4 Stars | Situated between the scenic Nai Harn Lake and Nai Harn Beach, Wat Nai Harn is a historic and revered local spiritual center in Rawai. The temple combines classic Thai Buddhist architecture, featuring magnificent golden roofs and elegant Buddha statues that exude solemn tranquility surrounded by lush green hills and waters. The morning chants of monks and peaceful temple vibes offer visitors a serene spiritual and cultural haven.", "name": "Wat Nai Harn", "transport": "Turn onto the Wiset Road extension near Nai Harn Lake; easily accessible on foot from Nai Harn Beach."}, {"address": "Soi Rawai 2, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.6 Stars | Tucked away in the alleys of Rawai, Phuket Art Village is a creative community formed by local artists. It is filled with imaginative, colorful murals, handmade wood carvings, recycled metal art installations, and several independent galleries and workshops. Strolling through the village, visitors can chat with resident artists, watch live painting sessions, and soak in the free-spirited bohemian vibe\u2014a truly unique hidden cultural gem in southern Phuket.", "name": "Phuket Art Village", "transport": "Turn into Soi Rawai 2 from the main road of Rawai Beach; taking a scooter or Tuk-Tuk is recommended."}, {"address": "Moo 2, Viset Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.3 Stars | Located along a key intersection of Viset Road and Sai Yuan Road, Wat Sawang Arom is a central hub for daily life and religious activities among locals. Inside, a stately golden Buddha statue is enshrined, while delicate murals depicting the life of Buddha and Thai folklore adorn the main hall, showcasing high artistic value. Quiet and rarely disturbed by large tour groups, it offers an authentic glimpse into local Thai Buddhist culture and sacred visual art.", "name": "Wat Sawang Arom", "transport": "Located near the intersection of Viset Road and Sai Yuan Road; the prominent temple entrance is visible when driving or riding along Viset Road."}, {"address": "Promthep Cape, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.7 Stars | Located at Promthep Cape, the southernmost point of Phuket Island, this Brahma Shrine (Four-Faced Buddha Shrine) is surrounded by hundreds of carved wooden elephant statues donated by devotees, creating a striking religious art landscape. Beyond being a sacred place for locals and tourists to pray for peace and good fortune, its elevated location commands breathtaking sunset views over the Andaman Sea, perfectly combining spiritual heritage with natural splendor.", "name": "Promthep Cape Shrine", "transport": "Head south from Rawai Beach along Route 4024 to the end at Promthep Cape Viewpoint parking lot, then walk up to the top."}, {"address": "Rawai Beach, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.0 Stars | Located next to the Rawai Seafood Market, the Moken Cultural Centre is dedicated to showcasing the rich history and traditional lifestyle of Phuket\u0027s indigenous \"Sea Gypsies\" (Moken/Chao Ley). The center exhibits handcrafted wooden boats, unique fishing tools, handicrafts, and historic photographs and documents documenting their way of life. Visiting provides deep insight into the cultural heritage and traditional crafts of this maritime community.", "name": "Rawai Moken Cultural Centre", "transport": "Located inside the Moken Village on the east side of Rawai Beach, adjacent to the Rawai Seafood Market; reachable on foot."}, {"address": "Sai Yuan Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.2 Stars | Wat Sai Yuan is a charming community Thai temple located in the Sai Yuan area, known for its distinctive architectural craftsmanship and tranquil environment. The main hall boasts exquisitely carved doors, a graceful golden stupa, and intricate traditional Buddhist murals. It also serves as a key gathering place for local festivals and cultural events, reflecting the tight-knit spiritual connection of southern Thai communities.", "name": "Wat Sai Yuan", "transport": "Located along Sai Yuan Road between Viset Road and Nai Harn Lake; easily accessible by scooter or car."}, {"address": "Viset Road, Rawai, Muang, Phuket 83130 Thailand", "feature": "\u2b50 4.5 Stars | Baan Batik Rawai Art Studio is an iconic space for traditional craft displays and creation in the Rawai area. It preserves the traditional batik art technique of southern Thailand, featuring a collection of brightly colored and intricately patterned handmade fabric art and garments. Visitors can admire master craftsmanship and participate in DIY workshops to create their own custom batik artwork, experiencing the unique charm of local visual arts.", "name": "Baan Batik Rawai Art Studio", "transport": "Located along Viset Road near Rawai Beach; accessible by songthaew or scooter."}], "name": "Arts, Museums \u0026 Temples"}, "cat_3": {"items": [{"address": "Nai Harn Beach, Rawai, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.7 Stars | Located at the southernmost tip of Phuket, Nai Harn Beach is framed by lush green hills, featuring powdery soft white sand and crystal-clear turquoise waters. Considerably quieter and more serene than bustling Patong Beach, it is a favorite coastal getaway among locals and expats alike. During the dry season (November to April), the sea is exceptionally calm, perfect for swimming and sunbathing, while the rainy season brings ideal waves that attract keen surfers. Right behind the beach lies a vast freshwater lagoon park, offering a pure and breathtaking natural coastal ecosystem.", "name": "Nai Harn Beach", "transport": "Take a blue Songthaew, the Phuket Smart Bus, or drive/rent a vehicle from Phuket Town or Patong Beach. Head south along Highway 4028 for about 30 to 40 minutes to arrive."}, {"address": "Rawai, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 Stars | Situated at the southernmost tip of Phuket, Promthep Cape is Thailand\u0027s most famous and iconic spot for watching sunsets. It boasts dramatic cliff top topography and endless views of the Andaman Sea. As the sun dips, the sky bursts into breathtaking gradients of gold, crimson, and vibrant purple. At the top of the cape stands a lighthouse commemorating King Rama IX\u0027s Golden Jubilee alongside a revered shrine to Lord Ganesha. Adventurous visitors can also follow a steep path down to the very edge of the headland to feel the majestic power of waves crashing against dark coastal rocks.", "name": "Promthep Cape Viewpoint", "transport": "From Nai Harn Beach or Rawai Beach, drive south along Viset Road (Highway 4024) for about 5 to 10 minutes to reach the large free parking area."}, {"address": "Rawai, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.5 Stars | Yanui Beach is a cozy, hidden cove nestled between Promthep Cape and the Windmill Viewpoint, famed for its crystal-clear waters, vibrant coral reefs, and dramatic volcanic rock formations. Gentle waves make it ideal for snorkeling, stand-up paddleboarding (SUP), and kayaking; you can easily paddle over to the uninhabited Koh Man island just offshore. Framed by lush green hills on both sides with a fine sand spit in the center, it offers a warm, relaxed vibe, making it a fantastic off-the-beaten-path sanctuary away from the crowds.", "name": "Yanui Beach", "transport": "Located along coastal Highway 4024 between Promthep Cape and Windmill Viewpoint. Riding a scooter or hiring a private driver is recommended; limited roadside parking is available for cars and bikes."}, {"address": "Rawai, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 Stars | Perched high on a hill between Nai Harn and Yanui beaches, this viewpoint takes its name from the prominent white wind turbine standing atop the peak. It provides a spectacular 360-degree panoramic vista overlooking the double bays of Yanui Beach, uninhabited Koh Man offshore, and the sweeping shoreline of Nai Harn Beach. Less crowded and more laid-back than Promthep Cape, it is a favorite takeoff spot for paragliders, creating picture-perfect scenes of colorful parachutes soaring against the azure sky.", "name": "Windmill Viewpoint", "transport": "Drive up the mountain road from Nai Harn Beach toward Promthep Cape for about 3 minutes. Signs along the route are clear, and vehicles can park right next to the viewing platform."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.2 Stars | Steeped in history and rich in local fishing village charm, Rawai Beach features hundreds of brightly painted traditional long-tail boats moored along its expansive shoreline, creating a classic tropical seascape. While the sand and waters are not ideal for swimming, the shore is lined with a broad, tree-shaded promenade perfect for strolls and sea-gazing. It serves as the primary launching hub for long-tail boat trips to nearby islands (such as Racha Island and Coral Island) and sits right next to the famous Rawai Seafood Market.", "name": "Rawai Beach", "transport": "Take the Phuket Smart Bus from Phuket Town directly to its final stop at Rawai Beach. If driving, head south along main Highway 4024 to the very end of the road."}, {"address": "Rawai, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.4 Stars | Situated right behind Nai Harn Beach, Nai Harn Lake is a large freshwater lagoon park featuring a lush green island in its center, equipped with outdoor gym gear and a tree-lined loop trail. It is a favored hub for locals and expats for morning jogs, leisurely walks, and cycling. The tranquil lakeside environment shelters various tropical birds, and at sunset, the mirror-like water reflects surrounding palms and hills, showcasing the unique ecosystem where fresh water meets the sea at Phuket\u0027s southern tip.", "name": "Nai Harn Lake", "transport": "Located directly behind Nai Harn Beach and easily accessible on foot from the shore. If driving, there is a perimeter road with convenient parking spots surrounding the lake."}, {"address": "Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.5 Stars | Ao Sane Beach is a secretive rocky beach hidden at the base of the mountain below The Nai Harn resort, reached by passing through a covered tunnel beneath the hotel structure. Consisting of three small coves, its seabed is dotted with granite boulders and rocky reefs with minimal wave action, attracting abundant tropical fish and marine life. Renowned as a hidden haven for shore diving and snorkeling, it remains rustic and uncommercialized, allowing visitors to fully immerse themselves in natural tranquility.", "name": "Ao Sane Beach", "transport": "Upon reaching Nai Harn Beach, follow the road along the bottom of The Nai Harn resort, drive through the tunnel underneath the hotel building, and continue along the narrow paved road for about 500 meters."}, {"address": "Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.6 Stars | Black Rock Viewpoint is the most dramatic and adventurous hidden vantage point in southern Phuket. Perched high on a ridge, it features a massive dark rock sitting right on the cliff edge, offering unobstructed, sweeping panoramas of Promthep Cape, Yanui Beach, Nai Harn Beach, and distant islands in the Andaman Sea. Reaching this spot involves navigating an unpaved forest trail followed by a steep 15-minute hike, rewarding adventurous souls with breathtaking 360-degree views unmatched by standard lookouts.", "name": "Black Rock Viewpoint (Pa Hin Dam)", "transport": "Drive or ride a sturdy vehicle/scooter toward the dirt road near the entrance to Nui Beach. Park at the trail base and hike up the steep path for about 15 to 20 minutes to reach the peak."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 Stars | Located at the southernmost tip of Phuket, Promthep Cape is the island\u0027s most famous sunset viewing spot. It boasts an magnificent panoramic vista, offering sweeping, unobstructed views of the Andaman Sea. Every evening, crowds gather around the hilltop lighthouse and viewing deck to watch the sun paint the sky in a dreamlike blend of golden orange and purple-crimson. The area also features a sacred Four-Faced Buddha shrine surrounded by carved wooden elephants and the Promthep Lighthouse Museum showcasing Royal Thai Navy history, making it a top pick for romantic photos and scenic memories.", "name": "Promthep Cape Viewpoint", "transport": "Drive south from Rawai Beach along Route 4024 for about 10 minutes. Renting a scooter or hiring a private vehicle is recommended; free parking is available on-site."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.7 Stars | Nestled between Promthep Cape and Nai Harn Beach, Windmill Viewpoint is named after the towering white wind turbine perched atop the hill. Positioned slightly higher than Promthep Cape with fewer crowds, it offers a wider, breathtaking perspective over Ya Nui Beach and Nai Harn Beach. It is a favorite spot among photography enthusiasts capturing sunsets and paragliders. As the sun sets, sailboats anchored on the shimmering golden water create effortlessly photogenic, magazine-cover-quality scenery.", "name": "Windmill Viewpoint", "transport": "From Nai Harn Beach, ride a scooter toward Promthep Cape for 3 to 5 minutes and follow the signs up the hill to Windmill Viewpoint."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 Stars | Ya Nui Beach is a charming, crescent-shaped pocket beach nestled between Promthep Cape and Windmill Viewpoint. Featuring exceptionally clear waters framed by dramatic rocky outcrops, it\u0027s ideal for capturing wild, natural landscape photography. It is also a prime location in Phuket for transparent clear-kayaking and snorkeling. You can rent a kayak to paddle out toward neighboring Koh Man island, or pose on the seaside boulders against a backdrop of vibrant turquoise waters.", "name": "Ya Nui Beach", "transport": "Located right off Route 4024, about a 2-minute drive down from Promthep Cape. Limited roadside parking for cars and scooters is available."}, {"address": "Nai Harn Beach, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 Stars | Renowned as one of Phuket\u0027s most beautiful and pristine beaches, Nai Harn Beach boasts a multi-hundred-meter stretch of fine white sand and crystal-clear waters. Framed by lush green hills on both sides, the ocean remains calm during the dry season\u2014ideal for swimming and sunbathing\u2014while attracting surfers in the monsoon season. Lined with trendy coconut stands and laid-back beach bars, whether you\u0027re relaxing on a beach lounge chair or taking a sunset walk along the shoreline, you\u0027ll immerse yourself in pure, relaxed island vibes.", "name": "Nai Harn Beach", "transport": "Take a Songthaew (shared truck) bound for Rawai/Nai Harn from Phuket Town directly to the beach terminal, or ride a scooter from Rawai Beach in about 8 minutes."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 Stars | Ao Sane Beach is a secret bay tucked away in a corner near Nai Harn Beach, accessible via a small underpass beneath The Nai Harn hotel. Made up of three small rocky coves filled with massive black boulders and dense tree canopy, it offers a wild, adventure-filled atmosphere. Highly popular among creators and travelers seeking off-the-beaten-path aesthetic spots, its dramatic sea-eroded rocks and clear waters provide fantastic photo backgrounds, while serving as one of southern Phuket\u0027s best shore-diving and snorkeling havens.", "name": "Ao Sane Beach", "transport": "Head to the far left end of Nai Harn Beach, follow the small lane under The Nai Harn hotel, and continue for about 800 meters. Visiting by scooter is recommended."}, {"address": "Karon, Mueang Phuket District, Phuket 83100, Thailand", "feature": "\u2b50 4.7 Stars | Black Rock Viewpoint is a viral hidden gem perched high in the jungle above the coastline. Sitting atop a colossal black rock formation, it rewards visitors with an astonishing 360-degree, unobstructed panoramic view. Standing on the rock face, you can look down over Nai Harn Beach, Ya Nui Beach, Promthep Cape, and scattered Andaman islands. Reaching it requires navigating an unpaved dirt track followed by a 15-minute uphill hike, but the breathtaking vista at the summit makes it a must-visit for adventure and photography lovers.", "name": "Black Rock Viewpoint (Pa Hin Dam)", "transport": "Head to the dirt road trail junction near Karon Viewpoint, ride an off-road scooter or 4WD vehicle to the trailhead parking spot, and hike up for 15 to 20 minutes."}, {"address": "22/9 4024, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 Stars | Rawai Seafood Market is a lively hub for experiencing authentic southern Thai maritime culture and fresh seafood. The classic photo moment here features colorful traditional wooden longtail boats resting along the shore against blue skies and clear sea waters. On one side lies the vibrant seafood market, while on the other extends the long Rawai Pier, perfect for scenic strolls out over the ocean to shoot photos with incredible depth and perspective. In the late afternoon, locals gather to fish and walk, offering a wonderful glimpse into local coastal life.", "name": "Rawai Seafood Market \u0026 Pier", "transport": "Located along Route 4024 on Rawai Beach. Reachable directly by Songthaew or taxi from Phuket Town; public parking is available nearby."}, {"address": "Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 Stars | Nai Harn Lake is a sprawling lagoon park located directly behind Nai Harn Beach, featuring a central island connected to the land by a white bridge. With its serene and leafy setting, it is a popular spot for locals and visitors to jog, walk, and cycle. The calm lake mirrors the blue sky and green hills; during soft morning or late afternoon light, it is ideal for capturing fresh, lifestyle landscape photos. The central island includes shaded pavilions and a children\u0027s playground, offering a peaceful, relaxing resort pace.", "name": "Nai Harn Lake Park", "transport": "Located right behind Nai Harn Beach, a 2-minute walk to the lakeside. A ring road with ample parking surrounds the lake."}], "name": "Popular Instagrammable Spots"}}, "name": "Rawai Seafood Market and Nai Harn Beach Area"}};

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
