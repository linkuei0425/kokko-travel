rom Phuket and Southern Thai tropical fruits. Featuring no artificial coloring and exquisite moisture-proof packaging, it is highly favored by independent travelers.", "name": "Phuket Paradise Fruits \u0026 Souvenirs Patong", "transport": "Walk along Patong Beach Road (Thaweewong Rd), located near Patong Tower."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "181, Rat-U-Thit 200 Pee Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.4 stars | Must-buy list: Mistine Wings Powder, Tao Kae Noi Seaweed, ChaTraMue Thai Tea Leaves. The most central flagship shopping complex in Patong Beach, bringing together Big C Supercenter, Robinson Department Store, and various international brands. It is also an excellent spot to beat the heat and enjoy delicious food. The outdoor courtyard features a captivating water fountain show on the hour, making it the top choice for first-time visitors to Phuket looking for a major shopping spree.", "name": "Jungceylon Shopping Center", "transport": "Located at the intersection of Patong songthaews and shuttle buses. About an 8-minute walk from Patong Beach, or take a Tuk-Tuk to Rat-U-Thit Road."}, {"address": "198/9 Rat-U-Thit 200 Pee Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.5 stars | Must-buy list: HARNN Scented Hand Cream, Jim Thompson Thai Silk Scarves, SNAILWHITE Whitening Cream. Located directly opposite Jungceylon, focusing on mid-to-high-end international brands and top local Thai designer brands. The mall features dedicated zones for Thai fashion and premium fragrances. The shopping environment is bright, stylish, and comfortably spacious, with direct VAT refund processing available at counters upon reaching the required spending limit\u2014offering exceptional quality.", "name": "Central Patong", "transport": "Walk diagonally across from the entrance of Bangla Road, or take the Patong island-loop songthaew and get off at the Central Patong stop."}, {"address": "888/1 Moo 2, Koh Kaew, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.1 stars | Must-buy list: Classic Levi\u0027s Jeans, Wacoal Lingerie, Nike Sportswear \u0026 Sneakers. The largest French European-style outlet village in Phuket. Although it is about a 30-minute drive from Patong, it is well worth a visit for bargain hunting. Housing over 300 international and local Thai sportswear and casual brands, it offers unbeatable discounts of 30% to 70% off year-round, making it ideal for a half-day shopping excursion.", "name": "Premium Outlet Phuket", "transport": "Recommended to take a taxi or Grab from Patong Beach; the drive takes about 30 to 35 minutes."}, {"address": "124/11 Beach Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.2 stars | Must-buy list: Quiksilver Surf Shorts, Pure Coconut Oil Handmade Soap, Thai Woven Beach Bags. A semi-open-air beachfront shopping mall on Patong Beach Road featuring ultra-modern architecture. It houses numerous water sports brands and independent local Thai beachwear boutiques. The atmosphere becomes vibrant once the lights turn on, allowing you to enjoy stunning Andaman Sea sunsets and night views while shopping.", "name": "Banana Walk Shopping Mall", "transport": "Easily reachable on foot along Beach Road; located near the exit of Soi Bangla Walking Street."}, {"address": "Rat-U-Thit 200 Pee Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.0 stars | Must-buy list: OTOP-certified Natural Latex Pillows, Thai Essential Oil Handmade Soaps, Handmade Batik Beach Towels. A unique shopping zone backed by the Thai government\u0027s \u0027One Tambon One Product\u0027 (OTOP) initiative, specializing in high-quality local specialty produce and handicrafts from Phuket and various Thai provinces. Prices are more budget-friendly than big department stores, and you can buy authentic local traditional crafts rich in regional charm and souvenir value.", "name": "OTOP Shopping Paradise Patong", "transport": "Located on the southern section of Rat-U-Thit Road in Patong, about a 3-minute walk from Hard Rock Cafe."}, {"address": "Bangla Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 3.9 stars | Must-buy list: Poy-Sian Inhalers, Thai Tropical Floral Shirts, Hand-carved Coconut Shell Accessories. An established department plaza adjacent to the nightlife hub of Bangla Road, famous for its high-value affordable local goods and discount zones. The first floor features many Thai cosmetics and souvenir shops, while the second floor is a discount outlet for local apparel, making it a great landmark for budget treasure hunting.", "name": "Ocean Plaza Bangla Patong", "transport": "Located in the middle section of Bangla Road Walking Street, about a 3-minute walk from the Patong Beach entrance."}, {"address": "162/51-52 Rat-U-Thit 200 Pee Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.3 stars | Must-buy list: Handmade Genuine Leather Sandals, Herbal Massage Essential Oils, Thai Elephant Print Pants. A hybrid shopping complex combining a covered roof mall with a local creative market, featuring many boutique shops by local designers in permanent storefronts. Here, you can buy high-quality Thai leather goods, handcrafted fragrances, and tropical fashion wear at very affordable prices.", "name": "Malin Plaza Patong", "transport": "Located at the southernmost end of Patong Beach, about 5 minutes by Tuk-Tuk from Jungceylon, or a 15-minute walk south along Rat-U-Thit Road."}, {"address": "Sai Kor Road, Patong, Kathu, Phuket 83150", "feature": "\u2b50 4.1 stars | Must-buy list: Herbal Body Scrubs, Dried Monthong Durian, Handmade Elephant Keychains. A multi-story shopping complex located behind Jungceylon. The second floor and the rear section of the first floor host numerous shops selling local daily necessities, dried goods, and souvenirs. Most store owners are Phuket locals, offering a wide variety of items with flexible pricing\u2014a great place to experience local market culture and shop for unique souvenirs.", "name": "Banzaan Shopping Complex", "transport": "Located opposite the back entrance of Jungceylon Shopping Center; accessible by walking along Sai Kor Road."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Patong Beach and Nightlife Area"}, "phuket_town": {"categories": {"cat_1": {"items": [{"address": "112/1 Dibuk Rd, Tambon Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.8 stars | Must-Buy List: Natural Lemongrass Mosquito Repellent Spray, Handmade Essential Oil Body Lotion, Royal Thai Soothing Massage Oil. Founded in Phuket, this premier local aromatherapy and fragrance brand focuses on 100% pure, natural, handmade products. Filled with rich herbal aromas, the store is a favorite among international tourists. With affordable prices and exceptional quality, it\u0027s a must-visit local fragrance and cosmetics sanctuary in Old Town.", "name": "Lemongrass House Phuket Old Town", "transport": "About a 5-minute walk from Thalang Road to the Dibuk Road store."}, {"address": "Phuket Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buy List: Wat Pho Herbal Balm, Siang Pure Oil Roll-on, Ya Hom Powder (Five Pagodas Brand). This century-old pharmacy witnessed the glorious tin-mining era of Phuket Old Town, offering an extensive selection of traditional Thai herbs and household medicines. The friendly staff kindly explain the benefits of various ointments. Prices are significantly cheaper than at the airport or tourist spots, making it the top choice for purchasing traditional Thai remedies.", "name": "Seng Ho Pharmacy Phuket", "transport": "Located near the Phuket Old Town Clock Tower roundabout, about a 3-minute walk."}, {"address": "41 Thalang Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Must-Buy List: Mistine 3D Eyebrow Pencil, Beauty Buffet Milk Whitening Facial Foam, Cathy Doll Ultra Light Sunscreen. Located right on Thalang Road in the heart of Old Town, this shop blends seamlessly into a Sino-Portuguese building exterior. It features a dedicated section for bestselling local Thai cosmetics, allowing you to buy popular affordable Thai makeup and skincare in one stop. They frequently offer tourist-friendly promotions like Buy 1 Get 1 Free.", "name": "Watsons Thalang Road Old Town", "transport": "Located in the center of the Thalang Road pedestrian area, easily reachable on foot from anywhere in Old Town."}, {"address": "Phangnga Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buy List: Boots Cucumber Moisturizing Cream, Soap \u0026 Glory Body Scrub, SNAIL WHITE Whitening Cream. The famous British pharmacy chain\u0027s branch in Phuket Old Town carries popular local Thai skincare products alongside international brands. The store often offers tax refund services and exclusive tourist discounts, with staff who communicate fluently in English.", "name": "Boots Old Town Phuket", "transport": "Located on Phang Nga Road, about a 2-minute walk from The Memory at On On Hotel."}, {"address": "74 Dibuk Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Must-Buy List: Secret Recipe Handmade Gromwell Balm, Thai Wild Turmeric Brightening Face Cream, Royal Snake Oil Soothing Spray. A three-generation traditional Thai-Chinese herbal pharmacy exuding a classic old-world charm. Combining traditional Thai herbs with modern beauty concepts, they have developed various natural, additive-free skin care ointments. Especially effective for soothing sunburnt skin and insect bites, it is highly recommended by locals and savvy travelers alike.", "name": "Kheng Tin Pharmacy \u0026 Herbal Shop", "transport": "Exit Soi Romanee, turn left onto Dibuk Road, and you will arrive immediately."}, {"address": "Yaowarat Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buy List: Tropical Floral Body Cologne Spray, Natural Keratin Hair Serum, Vitamin C Brightening Antioxidant Serum. Known as Thailand\u0027s version of The Body Shop, this beloved national brand specializes in natural plant extract skincare products. Located on the edge of Old Town\u0027s shopping district, it offers a wide variety of delightful scents at great prices. The body sprays and hair serums are must-stock beauty holy grails for visitors to Thailand.", "name": "Oriental Princess Phuket Old Town", "transport": "Located on Yaowarat Road, about a 6-minute walk to the center of Old Town."}, {"address": "Ratsada Rd, Tambon Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Must-Buy List: Scentio Milk Plus Whitening Body Lotion, Q10 Milky Facial Cream, Mixed Berry Hydrating Lip Mask. A wildly popular, sweet-themed Thai beauty chain styled like a cozy kitchen. It specializes in skincare products infused with premium milk protein and fruit extracts. Gentle on the skin with rich, delicious scents and irresistible price points, it\u0027s the perfect spot for buying treats for yourself and gifts for friends.", "name": "Beauty Buffet Phuket Old Town", "transport": "Located on Ratsada Road, about a 4-minute walk from the Phuket Museum area."}, {"address": "Krabi Rd, Tambon Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Must-Buy List: 4U2 Heart-Engraved Matte Blush, Mistine 24H Cover All Powder, Cathy Doll Thai Vintage Lip Tint. A boutique store bringing together Thailand\u0027s hottest affordable makeup brands. Featuring 4U2\u2014often dubbed Thailand\u0027s 3CE\u2014it offers a complete shade range and stylish packaging that tempts you to collect every shade! Frequent bundle discounts for tourists make this a true shopping paradise for makeup lovers in Old Town.", "name": "4U2 \u0026 Local Beauty Select Store Old Town", "transport": "Located on Krabi Road, about a 3-minute walk from Phuket Thai Hua Museum."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "175 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buys: French Bohemian dresses, handmade straw resort bags, designer jewelry. Housed in a charming historic yellow Sino-Portuguese building on Dibuk Road in Phuket Old Town, Endless Summer is a boutique concept store combining fashion, lifestyle goods, and a caf\u00e9. It features stylish apparel that blends French casual luxury with a local Thai resort aesthetic. Made mostly from lightweight, breathable pure cotton and linen, the high-quality clothing is perfect for tropical island getaways, making it a top choice for fashionable travelers seeking unique outfits.", "name": "Endless Summer Phuket", "transport": "About a 5-minute walk from the famous Old Town Clock Tower landmark."}, {"address": "99 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Must-Buys: Traditional Phuket hand-dyed Batik sarongs, ancient Thai handwoven silk scarves, vintage ethnic motif tote bags. As one of the oldest traditional textile and clothing shops in Phuket Old Town, the owner is dedicated to collecting and promoting classic Southeast Asian fabrics. The store features Batik fabrics and traditional attire rich in Thai-Malay and Chinese-Thai cultural fusion. Each hand-painted, hand-dyed pattern by skilled artisans is one-of-a-kind, beloved by travelers who appreciate heritage crafts and unique textured fabrics.", "name": "Ban Boran Textiles", "transport": "Located on historic Thalang Road in the heritage district; easily accessible on foot."}, {"address": "52 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buys: Original graphic street tees, Old Town limited-edition cotton canvas totes, embroidered streetwear bucket hats. Located in the heart of Old Town, Campus Store is a streetwear boutique highly recommended by local youth. Combining Thai independent designer brands with trendy urban style, it offers limited-edition tees and accessories incorporating Phuket Old Town architecture and heritage motifs. Featuring durable, breathable fabrics and highly creative designs, it\u2019s a great treasure trove for trendy and indie style enthusiasts.", "name": "Campus Store Phuket", "transport": "Located on Thalang Road Walking Street, close to the heart of the Sunday Lard Yai Night Market."}, {"address": "43 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buys: Hand-embroidered linen resort shirts, exquisite handcrafted Thai leather shoes, unique metal designer earrings. Located on Phangnga Road, Woo is housed in a renovated historic home that seamlessly combines an art gallery with a curated boutique space. Focusing on handcrafted apparel and accessories by top local Thai designers, the clothing uses natural dyes and materials with minimalist designs rich in artisanal detail. The fine leather footwear and woven bags showcase strong Eastern aesthetics and artistic refinement.", "name": "Woo Craft \u0026 Boutique Shop", "transport": "Located on Phangnga Road, near The Memory at On On Hotel; easily reachable on foot."}, {"address": "18 Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Must-Buys: Thai cotton-linen relaxed dresses, handmade genuine leather clutches, tropical-style woven sandals. Soul Made is an independent designer boutique hidden in the alleys of Old Town, built around the philosophy of \u0027infusing soul into daily fashion.\u0027 It showcases a wide selection of cotton and linen apparel, shoes, and bags created by emerging local Thai designers. The style leans towards natural, comfortable, and effortless resort wear\u2014with unique cuts and high breathability that keep you elegant and trendy in Phuket\u0027s heat.", "name": "Soul Made Phuket", "transport": "Located on Yaowarat Road, about a 3-minute walk from the Phuket Old Town central roundabout."}, {"address": "2 Ranong Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buys: Vintage-style printed shirts, handmade geometric woven shoulder bags, handcrafted Thai leather coin purses. Known not only for its famous eats, Phuketique also features a lifestyle clothing space beloved by local trendsetters. The boutique carefully selects apparel, shoes, and bags from independent Thai artisan brands, blending American retro vibes with Thai street culture. Their geometric woven bags and handmade leather items are produced in limited quantities, making them highly collectible and stylish.", "name": "Phuketique Craft \u0026 Lifestyle", "transport": "Located next to the Ranong Road Fountain Roundabout, extremely convenient to reach."}, {"address": "316 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Must-Buys: Tropical pattern printed maxi dresses, handmade fringed straw bags, premium handcrafted leather sandals. Located on Dibuk Road, Tantitium is a hybrid fashion venue that elevates historic Sino-Portuguese architecture to its aesthetic peak. The boutique offers high-end Thai island resort wear, ranging from glamorous printed maxis to exquisite handmade straw totes and leather sandals. With bold colors and distinct tailoring that blend perfectly with Old Town\u0027s vintage backdrop, it\u0027s an ultimate shopping destination for premium resort wardrobe staples.", "name": "Tantitium Lifestyle \u0026 Fashion Boutique", "transport": "Located on Dibuk Road near the Indochine home fragrance shop; easily reachable on foot."}, {"address": "38 Krabi Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Must-Buys: Bohemian linen fringed cardigans, retro woven bamboo bucket bags, handmade woven genuine leather slides. Located on Krabi Road, this boutique is a hit among travelers loving tropical island fashion. It specializes in resort wear and accessories, offering everything from light, breezy linen dresses to beautifully crafted bamboo and leather bags. The shop features handcrafted woven footwear and bags made by Southern Thai artisans, showcasing great quality and artisanal charm.", "name": "Island Paradise Boutique", "transport": "Located on Krabi Road, near Thai Hua Museum, about a 2-minute walk."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "161 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional Hokkien mung bean pastry, peanut candy (Gong Tang), and crispy sesame rolls (Lau Hua). With over a century of history, this iconic historic bakery in Phuket preserves ancestral Hokkien baking crafts. Their mung bean pastries feature flaky, layered crusts with a savory-sweet filling, making them a top choice souvenir loved by locals for holidays and afternoon tea.", "name": "Keng Tin Bakery", "transport": "Located on Phangnga Road in Phuket Old Town, about a 3-minute walk from Ya Mueang Mosque."}, {"address": "16 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buy List: Secret-recipe herbal tea bags, natural Thai green balm, and herbal wellness sachets. Established in 1917, this is the oldest Chinese herbal pharmacy in Phuket Old Town. Exuding a rich vintage apothecary ambiance, it attracts many visitors seeking natural herbal skincare products and tea packs featuring nostalgic packaging with deep cultural charm.", "name": "Nguan Choon Tong Herb Shop", "transport": "Located in the middle section of Thalang Road, an easy walk right in the heart of the Old Town historic district."}, {"address": "40/1 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Must-Buy List: Hand-roasted cashews, Tom Yum flavored fish crackers, and Southern Thai shrimp paste. Pornthip is one of Phuket\u0027s premier souvenir brands, featuring a store designed in Sino-Portuguese architecture. Offering a wide array of packaged snacks made from local Phuket ingredients, their flavored cashews and crispy dried fish are highly recommended for bulk gifting.", "name": "Pornthip Phuket Old Town", "transport": "Located in the Thalang Road walking street area, close to famous street art murals."}, {"address": "17 Yaowarat Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade rattan bags, printed linen dresses, and signature scented candles. Housed in a beautifully preserved century-old yellow Sino-Portuguese mansion, this concept store seamlessly merges specialty coffee with local artisanal design. Featuring apparel, home goods, and stylish bags from boutique Thai designers, it\u0027s the ultimate spot for high-end, unique gifts.", "name": "Endless Summer Concept Store", "transport": "Located on Yaowarat Road, about a 4-minute walk from the Old Town Clock Tower."}, {"address": "63 Dibuk Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Must-Buy List: Hand-dyed batik shirts, handmade batik silk scarves, and ocean-themed batik canvas bags. Batik is an iconic traditional textile art of Southern Thailand and Phuket. This studio showcases hand-painted fabrics and garments created by local artisans, featuring ocean motifs and tropical floral patterns that render every piece a unique work of art.", "name": "Phuket Batik Studio", "transport": "Located on Dibuk Road, about a 4-minute walk from the Thai Hua Museum."}, {"address": "61 Thalang Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buy List: Phuket heritage building postcards, locally roasted coffee beans, and original printed tote bags. A vibrant independent bookstore and cafe loved by youth and art enthusiasts alike. The shop sells art prints, vintage postcards created by local artists, and specially curated coffee beans from Northern and Southern Thailand\u2014making perfect memorable keepsakes.", "name": "Bookhemian (2521)", "transport": "Located on Thalang Road Walking Street, right next to popular street art graffiti walls and historic architecture."}, {"address": "43 Phangnga Rd, Talat Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Southern Thai ceramic tea sets, specialty herbal tea bags, and natural plant-dyed handkerchiefs. Tucked inside an antique gallery hotel, this sophisticated boutique shop displays exquisite Thai handicrafts and local original products. With elegantly packaged ceramics and herbal tea blends, it\u0027s highly praised by lifestyle lovers looking for refined gifts.", "name": "Woo Gallery \u0026 Boutique Shop", "transport": "Located on Phangnga Road, on the same street as the famous landmark The Memory at On On Hotel."}, {"address": "98 Krabi Rd, Talat Nuea, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Hokkien cashew cookies, crunchy peanut brittle, and pineapple coconut tartlets. This cozy traditional confectionery holds the culinary memories of Phuket\u0027s older generations. Baked using classic methods, their cashew cookies are wonderfully fragrant and flaky. Paired with signature peanut candy and pineapple tarts, they showcase authentic Peranakan dessert flavors.", "name": "A-Ma Traditional Phuket Sweets", "transport": "Located on Krabi Road, just a 2-minute walk from the Thai Hua Museum."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "888, 888/1 Moo 2, Koh Kaew, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Must-Buy List: Rip Curl swimwear and water sports gear, Levi\u0027s classic jeans, and discounted Nike sneakers. This is Phuket\u0027s largest open-air European-style outlet mall, located about a 15-minute drive from Phuket Old Town. Built in the charm of a European village, the expansive complex houses over 300 international and Thai brands. Enjoy year-round discounts from 30% up to 70%, especially on water sports gear and casual outdoor wear. It\u0027s the top choice for bargain hunting in Phuket.", "name": "Premium Outlet Phuket", "transport": "About a 15-minute Grab or taxi ride from Phuket Old Town"}, {"address": "2/2 Dibuk Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 stars | Must-Buy List: Thai creative woven straw bags, natural botanical essential oils, and local designer printed tote bags. Located in the heart of Phuket Old Town, this modern lifestyle mall seamlessly blends trendy spaces with local culture. Alongside home-grown Thai original brands and independent designer boutiques, it hosts creative craft markets on weekends. With a relaxed vibe and comfortable air conditioning, it\u0027s a great spot to beat the heat while shopping for exquisite artistic souvenirs.", "name": "Limelight Avenue Phuket", "transport": "Located on Dibuk Road in Phuket Old Town, about a 3-minute walk from the town center"}, {"address": "36 Tilok Uthit 1 Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.1 stars | Must-Buy List: Mistine cosmetics, Wacoal comfortable underwear, and ChaTraMue Thai tea gift sets. As a long-standing local department store chain near Phuket Old Town, Robinson Ocean is deeply integrated into the daily lives of local residents. The floors feature a wide array of local cosmetics, affordable apparel, and home goods. Prices are budget-friendly with frequent promotions, while the basement and supermarket make it easy to stock up on high-quality Thai specialties and local snacks.", "name": "Robinson Ocean Phuket", "transport": "About an 8-minute walk from Phuket Old Town Clock Tower, or take a songthaew"}, {"address": "199 Moo 4, Vichitsongkram Rd, Vichit, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.6 stars | Must-Buy List: Good Goods woven bags, Jim Thompson premium Thai silk scarves, and Elephant Poopoopaper eco-friendly notebooks. Located just a few minutes drive from Old Town, this is Phuket\u0027s most luxurious and expansive flagship shopping destination. Its Floresta wing features \u0027Tales of Thailand\u0027, a dedicated zone showcasing traditional craft and modern aesthetics, packed with top-tier local brands, handmade designs, and premium souvenirs. Perfect for travelers seeking luxury goods and authentic local crafts under one roof.", "name": "Central Phuket Floresta", "transport": "About a 10-minute ride via blue songthaew or Grab from Phuket Old Town"}, {"address": "17 Yaowarat Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buy List: French resort-style cotton dresses, handmade bohemian sea urchin earrings, and printed tablecloths. Housed in a century-old Sino-Portuguese mansion on Yaowarat Road, this lifestyle boutique blends a curated shop with a cozy caf\u00e9. It offers a selection of island-style apparel, artisan jewelry, and home decor from independent Thai and international designers. Stunning vintage decor and impeccable taste make it an iconic shopping destination in Old Town.", "name": "Endless Summer Phuket", "transport": "Located on Yaowarat Road in Old Town, about a 2-minute walk from Thai Hua Museum"}, {"address": "20 Thalang Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.4 stars | Must-Buy List: Southern Thai handcrafted lacquerware, hand-embroidered linen shirts, and traditional Sino-Portuguese painted ceramic tea sets. Located on famous Thalang Road, this is one of Phuket Old Town\u0027s most charming cultural boutique stores. Step inside this repurposed heritage shophouse to feel transported back in time. Featuring curated Southern Thai handicrafts, handwoven textiles, and fine vintage furniture, every item carries rich historical character, making it a favorite for lovers of unique crafts and cultural gifts.", "name": "China Inn Vintage \u0026 Lifestyle", "transport": "Located on Thalang Road Walking Street in Phuket Old Town"}, {"address": "69 Dibuk Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.5 stars | Must-Buy List: Master hand-painted batik shirts, vibrant hand-dyed beach towels, and traditional pattern tote bags. Batik is a signature textile craft of Southern Thailand and Phuket. This long-established boutique shop focuses on promoting local handmade batik fabrics and clothing. Every item is hand-dyed by local artisans featuring vibrant island colors and oceanic motifs. These one-of-a-kind designs offer an unmissable cultural shopping experience in Old Town.", "name": "Phuket Batik Heritage Shop", "transport": "Located on Dibuk Road in Old Town, about a 1-minute walk from Limelight Avenue"}, {"address": "Ong Sim Phai Rd, Talad Yai, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.2 stars | Must-Buy List: Thai herbal balms and green ointments, Southern Thai handwoven rattan fruit baskets, and natural citronella mosquito repellent. Bustling with everyday local life, this general goods and crafts pavilion is a primary spot for Phuket locals to buy daily necessities and traditional household items. It gathers regional herbal remedies, rattan crafts, and affordable specialties at very budget-friendly prices. A must-visit to experience authentic local market culture and bargain hunting.", "name": "Kaset Market Craft \u0026 Souvenir Pavilion", "transport": "Located on Ong Sim Phai Road in Old Town, about a 4-minute walk from Robinson Department Store"}], "name": "Shopping Malls \u0026 Outlets"}}, "name": "Phuket Old Town Historical and Cultural District"}, "rawai_naiharn": {"categories": {"cat_1": {"items": [{"address": "28/46 Moo 1, Viset Road, Rawai, Muang, Phuket 83130, Thailand", "feature": "\u2b50 4.7 Stars | Must-Buy List: Natural Lemongrass Mosquito Repellent Spray, Handmade Herbal Essential Oil Soap, Thai Turmeric Massage Oil. This is Phuket\u0027s most iconic homegrown brand for all-natural aromatherapy and herbal cosmetics, dedicated to handcrafted goods and pure plant extracts. This cozy, nature-inspired Rawai branch is a go-to spot for long-term expat residents and locals alike to stock up on skincare and home fragrances. Their natural aloe vera gel for after-sun relief is also extremely popular.", "name": "Lemongrass House (Rawai)", "transport": "About a 5-minute drive or scooter ride from Rawai Seafood Market."}, {"address": "Saiyuan Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 Stars | Must-Buy List: Boots Cucumber Facial Wash, Boots Ingredients Collagen Lip Balm, Soap \u0026 Glory Body Scrub. Located conveniently in Rawai\u0027s bustling Saiyuan area, this well-known drugstore chain offers popular international and Thai beauty products alongside high-value in-house skincare lines. It is the top choice for tourists vacationing in Rawai and Nai Harn to pick up daily skincare essentials and sun protection.", "name": "Boots (Saiyuan Rawai Branch)", "transport": "Take a Grab ride or ride a scooter to the middle section of Saiyuan Main Road."}, {"address": "Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 Stars | Must-Buy List: Siang Pure Oil, Yanhee Herbal Balm, Counterpain Warm Analgesic Cream. A local Rawai pharmacy trusted by locals and Western tourists alike, featuring friendly pharmacists who speak basic English. The store is fully stocked with Thailand\u0027s most popular herbal balms, sunscreens, skincare, and health supplements at affordable prices\u2014allowing you to easily get everything you need without making a trip to distant shopping malls.", "name": "Rawai Health Pharmacy", "transport": "Located diagonally opposite the entrance of Rawai Seafood Market, about a 3-minute walk away."}, {"address": "Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.2 Stars | Must-Buy List: Mistine 3D Eyebrow Pencil, Cathy Doll Sunscreen, Snake Brand Cooling Powder. Situated in the Fisherman Way commercial area in Rawai, this bright and spacious Watsons offers a comprehensive selection of popular local Thai cosmetics and skincare. Many makeup lovers come here specifically to stock up on sweat-proof and waterproof products from brands like Mistine and Cathy Doll, which are perfectly suited for tropical island weather.", "name": "Watsons (Fisherman Way Rawai)", "transport": "Drive along Wiset Main Road toward Rawai Beach; it is located inside the shopping complex."}, {"address": "Saiyuan Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 Stars | Must-Buy List: Pure Cold-Pressed Virgin Coconut Oil, Butterfly Pea Hair Care Shampoo, Traditional Thai Herbal Compress Packs. An independent local herbal beauty shop in Rawai specializing in natural skincare products made in Phuket and Southern Thailand. The shop highly recommends its premium cold-pressed coconut oil and soothing herbal balms for after-sun care, making it a favorite among health-conscious travelers.", "name": "Phuket Thai Herb \u0026 Beauty (Rawai)", "transport": "Located on the busy Saiyuan commercial street; riding a scooter is recommended."}, {"address": "Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.1 Stars | Must-Buy List: SRICHAND Translucent Powder, Beauty Buffet Milk Facial Foam, Madame Heng Herbal Soap. Located inside the Lotus\u0027s supermarket in Rawai, this pharmacy counter offers fast restocking and fair prices, making it a great spot for mainstream Thai beauty classics. SRICHAND translucent powder is ideal for Phuket\u0027s hot and humid climate, offering exceptional oil control and setting power at a bargain price.", "name": "Lotus\u0027s Go Fresh Pharmacy (Rawai)", "transport": "Located along Wiset Road, with convenient parking available for both cars and scooters."}, {"address": "Nai Harn Beach Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 Stars | Must-Buy List: Pure Organic Aloe Vera After-Sun Gel, Thai Turmeric Brightening Face Cream, Organic Coconut Hand Cream. A charming independent boutique right next to Nai Harn Beach, offering high-quality natural after-sun care and beauty products for beachgoers. Their organic aloe vera gel contains zero artificial fragrances and quickly calms sun-exposed skin, earning top reviews around the Nai Harn Beach area.", "name": "Nai Harn Organic \u0026 Beauty Care", "transport": "About a 5-minute walk from Nai Harn Beach Park."}, {"address": "41/8 Saiyuan Rd, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 Stars | Must-Buy List: Wu Ta Ointment, Takabb Anti-Cough Pills (Five Centipedes Brand), Royal Jelly Moisturizing Essence Cream. Situated in the heart of the Saiyuan community, this longstanding local pharmacy and beauty shop offers a wide array of local Thai cosmetics and traditional household remedies. Featuring transparent pricing and friendly service, it\u0027s a fantastic spot for Rawai locals and independent travelers to hunt for traditional Thai cosmetics and balms.", "name": "Saiyuan Local Pharmacy \u0026 Beauty", "transport": "Located in the middle section of Saiyuan Road; easily accessible by Tuk-Tuk or scooter."}], "name": "Signature Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "28/12 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 stars | Must-buy list: Handmade genuine leather slippers, vegetable-tanned leather crossbody bags, woven leather bracelets. A long-established handmade leather goods shop located on Rawai\u0027s main road, specializing in handcrafted genuine leather footwear, bags, and accessories. The owner personally selects premium leather. Each pair of slippers and bag carries strong Southern Thai handicraft traits\u2014extremely comfortable, durable, and highly favored by Western tourists and locals who appreciate quality style.", "name": "Kim\u0027s Leather \u0026 Shoes Rawai", "transport": "About an 8-minute walk from Rawai Seafood Market, or take a Songthaew and get off along Viset Road."}, {"address": "43/5 Moo 2, Rawai Beach Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 stars | Must-buy list: Traditional Southern Thai hand-painted batik scarves, tropical botanical print beach dresses, pure cotton beach totes. Dedicated to promoting Southern Thailand\u0027s unique batik art, this shop offers clothing and bags made from natural dyes and pure cotton. Featuring vibrant island colors and floral motifs, the garments are lightweight and breathable\u2014the perfect wardrobe choice for taking Instagram-worthy photos at Nai Harn Beach.", "name": "Rawai Batik \u0026 Island Wear", "transport": "Located along Rawai Beach Road, about a 3-minute walk from Rawai Pier."}, {"address": "14/83 Moo 1, Nai Harn Beach Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.7 stars | Must-buy list: Embroidered Bohemian dresses, fringed straw shoulder bags, handmade shell-decorated flat sandals. A charming boutique near Nai Harn Beach featuring a fresh, romantic bohemian resort style. The shop curates apparel and handmade bags from local independent designers, ranging from beautifully hand-painted linen dresses to elegant handmade sandals\u2014a must-visit quality shop when visiting Nai Harn Beach.", "name": "Nai Harn Boho Beach Boutique", "transport": "About a 5-minute walk from the entrance of Nai Harn Beach, or accessible by scooter."}, {"address": "55/12 Sai Yuan Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.4 stars | Must-buy list: Solid-color cotton-linen resort pants, large-capacity bamboo woven totes, lightweight rattan slippers. Located in the Sai Yuan shopping area, this cozy shop is known for its simple, natural style, specializing in high-quality pure cotton and linen apparel perfect for Phuket\u0027s hot and humid weather. The store offers a wide variety of affordable, high-quality woven bags, making loyal customers out of many Thai locals and expats residing long-term in Rawai.", "name": "Sai Yuan Natural Linen \u0026 Woven Bags", "transport": "Located on the main Sai Yuan Road; riding a scooter or taking a taxi is recommended."}, {"address": "100/1 Moo 2, Rawai Sea Gypsy Village, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.3 stars | Must-buy list: Round rattan crossbody bags, starfish shell anklets, ethnic embroidered tote bags. A unique craft shop located near Rawai Sea Gypsy Village, capturing the vibrant marine culture of Southern Thailand. Using natural rattan, seagrass, and seashells, they create handcrafted artisan bags and resort-style accessories. Each woven bag features a unique texture, eye-catching style, and great souvenir value, making it a wonderful spot for gift shopping.", "name": "Gypsy Sea Style Crafts \u0026 Bags", "transport": "Located inside the Sea Gypsy Village next to the Rawai Seafood Market; easily reachable on foot."}, {"address": "9/3 Moo 6, Ya Nui Beach Area, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.5 stars | Must-buy list: UV-protection rash guards, handmade crochet bikinis, waterproof beach bags. Situated right next to the cozy Ya Nui Beach, this shop caters to sun-seeking water sports enthusiasts with trendy beachwear. Beyond stylish rash guards and bikinis, they offer chic, highly waterproof beach bags and sandals, letting you stay fashionable whether snorkeling or kayaking.", "name": "Ya Nui Beach \u0026 Surf Lifestyle Shop", "transport": "About a 2-minute walk from the Ya Nui Beach parking lot."}, {"address": "22/9 Wiset Road, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.6 stars | Must-buy list: Oversized brim sun straw hats, hand-painted canvas totes, leather lace-up beach sandals. The local hub for straw hats and tote bags in Rawai, this shop features various sun hats and bags skillfully woven by Phuket artisans. The hats are durable and come in diverse designs adorned with colorful ribbons or feathers, combining practical sun protection with high-fashion photo appeal\u2014a must-visit shopping spot on the Rawai coast.", "name": "Southern Thai Straw Hats \u0026 Bags Rawai", "transport": "Located along Wiset Road near Rawai Bay; taking a Tuk-Tuk or riding a scooter is recommended."}, {"address": "39/21 Moo 1, Soi Saiyuan, Rawai, Mueang Phuket District, Phuket 83130, Thailand", "feature": "\u2b50 4.8 stars | Must-buy list: Custom-fitted genuine leather sandals, vintage leather shoulder bags, Thai print wallets. Operating for many years, this independent workshop is renowned for its exquisite handcrafted shoe craftsmanship. Customers can select leather colors and fit options on-site to create custom leather sandals. The shop also offers high-quality leather handbags and small leather goods at prices far lower than chain department stores\u2014highly recommended by local patrons.", "name": "Rawai Handcrafted Sandals \u0026 Vintage Leather", "transport": "Located inside Soi Saiyuan; recommended to arrive using navigation via scooter or taxi."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | Must-Buy List: Thai spicy dried squid, natural sea salt, handmade shrimp crackers. Located inside the Rawai Seafood Market, besides fresh seafood cooked to order, the dry goods stalls here are a treasure trove for local finds! Vendors sell dried squid and seafood snacks dried in-house by local fishermen. Spicy, flavorful, and preserving the authentic taste of the Andaman Sea, they make highly representative local gifts.", "name": "Rawai Seafood Market Local Souvenir Stalls", "transport": "Take a songthaew or tuk-tuk from Nai Harn Beach; takes about 5 minutes to reach the Rawai harbor area."}, {"address": "58/2 Moo 4, Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | Must-Buy List: South Sea pearl necklaces, mother-of-pearl jewelry boxes, handmade pearl earrings. Rawai is famous for cultivating high-quality pearls. Run by a long-standing local pearl-farming family, this store offers certified high-end pearl jewelry and exquisite mother-of-pearl crafts\u2014a premium, memorable souvenir for elders or personal collections.", "name": "Phuket Pearl Art Gallery Rawai", "transport": "Drive along the main Wiset Road toward Rawai Beach; located on the left side of the road."}, {"address": "14/2 Moo 2, Palai 2, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.7 stars | Must-Buy List: Chalong Bay pure sugarcane rum, Thai lemongrass-infused rum, handmade rum-flavored chocolates. Located near the border of Rawai and Chalong, this rum is crafted from 100% organic Thai sugarcane using traditional French distillation techniques. Featuring rich tropical fruity aromas and fresh herbal notes, it is a top-tier signature Phuket souvenir.", "name": "Chalong Bay Rum Distillery Shop", "transport": "Drive or ride north along the main road from Rawai Beach for about 10 minutes."}, {"address": "12/9 Moo 2, Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade natural shell jewelry boxes, natural sea salt body scrubs, handmade shell wind chimes. The museum\u0027s specialty gift shop collects various ocean crafts from Rawai and the Andaman Sea. Polished by local artisans, every piece radiates rich tropical island charm.", "name": "Phuket Seashell Museum Shop Rawai", "transport": "Located next to the main road at Rawai Beach, about a 3-minute drive from Rawai Pier."}, {"address": "43/10 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | Must-Buy List: Tom Yum flavored cashew nuts, butter-roasted cashew nuts, Thai lemongrass spicy cashew nuts. Phuket is one of Thailand\u0027s main cashew-producing regions. This independent classic shop in Rawai offers freshly roasted, locally packaged premium cashew nuts that are plump and ultra-crispy. The Tom Yum flavor is an addictive, must-buy snack for travelers!", "name": "Phuket Cashew Nut Local Shop Rawai", "transport": "About a 7-minute drive from Nai Harn Beach via Route 4030 onto Wiset Road."}, {"address": "52/12 Wiset Rd, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.2 stars | Must-Buy List: Tao Kae Noi seaweed snacks, Bento spicy squid sheets, ChaTraMue Thai milk tea mix. Supercheap is an ultra-budget local supermarket chain unique to Phuket. The Rawai branch has a comprehensive inventory where you can buy popular Thai snacks, instant noodles, and spreads all at authentic local wholesale prices\u2014a high-value spot to stock up on souvenirs.", "name": "Supercheap Rawai Branch", "transport": "Located on main Wiset Road; ride a songthaew to the Rawai area to spot the prominent yellow sign with red lettering."}, {"address": "Nai Harn Beach Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | Must-Buy List: Cold-pressed extra virgin natural coconut oil, handwoven beach bags, natural lemongrass mosquito repellent balm. Nestled beside the lake at Nai Harn Beach, this independent boutique highlights pure natural skincare and handmade creative crafts produced in Phuket. Chemical-free coconut oil and essential oil balms are extremely popular island keepsakes among international tourists.", "name": "Nai Harn Beach Local Craft \u0026 Coconut Shop", "transport": "Within walking distance from the Nai Harn Beach lakeside commercial area, or a 1-minute scooter ride from the beach."}, {"address": "Wiset Rd, Rawai Pier Area, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 stars | Must-Buy List: Authentic Thai green curry paste, hand-carved wooden sea turtle ornaments, dried shrimp paste blocks. Located at the entrance of the Sea Gypsy village in Rawai, this shop is run by indigenous locals, offering custom sun-dried spice pastes and traditional wooden handicrafts. Unique in flavor, purchases directly support the local indigenous community\u0027s development.", "name": "Rawai Chao Ley Spice \u0026 Local Handicraft Shop", "transport": "Located at the entrance to the Sea Gypsy Village on the right side of Rawai Pier, within walking distance."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "888/1 Moo 2, Koh Kaew, Mueang Phuket District, Phuket 83000", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Nike/Adidas sneakers, Levi\u0027s classic jeans, Triumph lingerie. As Phuket\u0027s largest French country-style outlet mall, it features over 300 renowned international and local Thai brands offering incredible discounts starting at up to 70% off. The spacious and comfortable open-air layout makes it a great spot to hunt for affordable, high-quality casual wear and sports gear.", "name": "Premium Outlet Phuket", "transport": "Take a taxi or private charter from Rawai Seafood Port heading north along Route 4024 for about 35 minutes."}, {"address": "Moo 1, Chao Fah West Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.4 stars | Must-Buy List: Mistine cosmetics, Handyman Thai fragrances, Taokaenoi seaweed gift boxes. Newly opened in 2023, this is the closest large department complex to Rawai and Nai Harn beaches. Featuring a semi-open tropical resort architectural design, it boasts a large supermarket and local Thai brand counters on the second floor, making it the top landmark for Southern Phuket residents and tourists to pick up daily supplies and souvenirs.", "name": "Robinson Lifestyle Chalong", "transport": "About a 12-minute drive north along Route 4024 from Rawai Seafood Port."}, {"address": "61/10 Moo 1, Chaofa Road, Chalong, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.2 stars | Must-Buy List: Villa Market imported artisan cheeses, Thai handmade organic dried fruits, Phuket craft beer. A refined lifestyle shopping plaza located on a key thoroughfare north of Rawai, featuring the famous upscale supermarket Villa Market. Besides home goods, it gathers local independent design shops and specialty imported food stores, making it a favorite spot among expats and long-term vacationers living near Rawai and Nai Harn beaches.", "name": "HomePro Village \u0026 Villa Market Chalong", "transport": "Take a Songthaew or taxi north from Rawai Seafood Port for about 10 minutes; located near Chalong Circle."}, {"address": "Rawai Beach Promenade, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.1 stars | Must-Buy List: Phuket natural saltwater pearl necklaces, handmade seashell jewelry boxes, Thai woven beach bags. A local specialty shopping street adjacent to the Rawai Seafood Pier, operated by Sea Gypsies and local artisans. Renowned for direct-from-source Phuket pearl jewelry and handcrafted ocean-themed crafts, prices are much more budget-friendly than big department stores, allowing you to pick up unique souvenirs full of Southern Phuket charm.", "name": "Rawai Handicraft \u0026 Pearl Market", "transport": "Located within the Rawai Seafood Market pedestrian area, easily accessible on foot."}, {"address": "1/20 Moo 6, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.6 stars | Must-Buy List: Natural lemongrass mosquito repellent, Thai Kaffir lime essential oil, Blue Chamomile handmade soap. Founded in Phuket, this premier Thai handcrafted all-natural aromatherapy brand features a Rawai store with a cozy, tropical green vibe. All products are handmade using 100% pure plant ingredients without artificial chemical additives; its mosquito repellents and essential oils are absolute star products that global travelers stock up on when visiting Phuket.", "name": "Lemongrass House Rawai Flagship Store", "transport": "Walk north along Viset Road from Rawai Seafood Port for about 8 minutes, or drive for 2 minutes."}, {"address": "58/2 Moo 6, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.5 stars | Must-Buy List: Designer cultured pearl rings, mother-of-pearl skincare products, pearl shell ornaments. As Phuket\u0027s most iconic local pearl brand, it houses a large professional showroom and gallery in Rawai. It demonstrates the entire journey from saltwater pearl farming to delicate crafting. On-site, you can purchase award-winning jewelry and natural beauty skincare products guaranteed in quality, making it the finest destination for purchasing high-end local Phuket gifts.", "name": "Phuket Pearl Art Factory (Rawai)", "transport": "About a 4-minute drive north from Rawai Seafood Port."}, {"address": "14/83 Moo 1, Saiyuan Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.3 stars | Must-Buy List: Thai linen resort dresses, pure cold-pressed coconut oil, handmade straw sun hats. A local artisan boutique hub near Nai Harn Beach featuring independent Thai designer brands based in Southern Phuket. Focused on sustainability and natural chic, it offers tropical linen clothing, handmade bamboo-woven bags, and organic skincare in a laid-back, artsy atmosphere.", "name": "Phuket Organic \u0026 Crafts Bazaar Rawai", "transport": "About a 5-minute Tuk-Tuk ride from Nai Harn Beach, located within the Saiyuan commercial strip."}, {"address": "42/3 Moo 2, Viset Road, Rawai, Mueang Phuket District, Phuket 83130", "feature": "\u2b50 4.0 stars | Must-Buy List: Thai elephant print pants, professional sun-protective rashguards, printed waterproof beach bags. Located along the Rawai beachfront promenade, this local outlet store specializes in affordable water sports gear and signature Thai resort wear. Offering year-round deals on beachwear and swimwear in a vast variety of styles, it is a budget-friendly spot to gear up and grab photo-ready outfits before heading to Nai Harn Beach.", "name": "Fisherman\u0027s Outlet \u0026 Beachwear Rawai", "transport": "Located along the main Rawai Beach Road near Rawai Pier, about a 3-minute walk."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Rawai Seafood Port and Nai Harn Beach Area"}};
        const cityName = "Phuket";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
