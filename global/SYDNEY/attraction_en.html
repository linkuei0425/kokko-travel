g a modest yet solemn aesthetic. Beyond its immense architectural value, the church served as the spiritual and social anchor of the local community in the 19th century. Surrounded by lush greenery and historic terrace houses, it forms one of the most charming historic streetscapes in Surry Hills.", "name": "St Michael\u0027s Anglican Church, Surry Hills", "transport": "Take bus 333, 352, or 396 to Flinders St near Albion St stop."}, {"address": "Albion St, Surry Hills NSW 2010", "feature": "\u2b50 4.4 stars | Albion Street in Surry Hills boasts one of the most concentrated and iconic displays of Victorian-era terrace houses in Sydney. Constructed in the mid-to-late 19th century, these historic homes feature delicate iron lace balconies, steep pitched roofs, and intricate ornamental facades, capturing the residential architectural essence of Sydney\u0027s Victorian boom. A walk along Albion Street reveals a rich spectrum of architecture, from grand three-story terraces to modest workers\u0027 cottages, immersing visitors in Surry Hills\u0027 deep historical heritage.", "name": "Albion Street Heritage Terraces", "transport": "About a 6-minute walk from Central Station (Chalmers Street exit) to the start of Albion Street."}, {"address": "222 King St, Newtown NSW 2042", "feature": "\u2b50 4.2 stars | Built in 1885 and situated in Newtown\u0027s bustling King Street commercial district, the Old Newtown Courthouse is a sandstone heritage landmark blending Classical and Classical Revival architectural styles. Designed by Colonial Government Architect James Barnet, the exterior features grand portico columns and symmetrical classical lines, embodying the majesty and elegance of Victorian-era judicial institutions. Now a heritage-listed building standing side-by-side with historic shopfronts, it remains one of King Street\u0027s most iconic civic landmarks.", "name": "Old Newtown Courthouse", "transport": "About a 3-minute walk from Newtown Station along King Street."}], "name": "Historical Landmarks \u0026 Architecture"}, "cat_2": {"items": [{"address": "2 Raper St, Surry Hills NSW 2010", "feature": "\u2b50 4.7 stars | Tucked away in a Surry Hills lane, this museum was the living and creative space of renowned Australian avant-garde artist Brett Whiteley in his later years. It faithfully preserves his former studio, unfinished works, art books, and personal vinyl record collection. Rich in artistic atmosphere and personal flair, it\u0027s an unmissable cultural landmark to understand Australian modern art trends and the artist\u0027s inner world.", "name": "Brett Whiteley Studio", "transport": "Take the Sydney Light Rail Line L2 or L3 to Central Station, then walk for about 8 minutes."}, {"address": "189 Church St, Newtown NSW 2042", "feature": "\u2b50 4.6 stars | Built in the 1870s, this Neo-Gothic historic building sits on the border of Newtown and Camperdown, surrounded by a historic cemetery and century-old trees. Inside, exquisite stained-glass windows, an antique pipe organ, and grand wooden roof beams create a solemn atmosphere. Bursting with historical and architectural value, it\u0027s a fantastic spot to explore Sydney\u0027s early colonial religious culture.", "name": "St Stephen\u0027s Anglican Church", "transport": "Take the train to Newtown Station, walk along King Street for about 7 minutes, and turn onto Church Street."}, {"address": "16/106 Foster St, Surry Hills NSW 2010", "feature": "\u2b50 4.5 stars | Located on the top floor of a trendy Surry Hills neighborhood, this art space was launched by independent creators to showcase contemporary graffiti art, street illustration, design, and emerging visual arts. With its minimalist yet vibrant aesthetic, the gallery regularly hosts exhibitions and book launches, making it a benchmark hub to experience Sydney\u0027s youth subculture and cutting-edge contemporary art.", "name": "China Heights Gallery", "transport": "Walk about 5 minutes from Central Station to reach Foste f history and culture.", "name": "St James\u0027 Church", "transport": "Take the train to St James Station, located right outside the exit."}], "name": "Art Museums \u0026 Churches"}, "cat_3": {"items": [{"address": "Mrs Macquaries Rd, Sydney NSW 2000, Australia", "feature": "\u2b50 4.7 stars | Established in 1816, the Royal Botanic Garden is one of Australia\u0027s oldest scientific institutions, located right next to Sydney Harbour and the Sydney Opera House. Covering around 30 hectares, the garden houses thousands of plant species from around the world across themed areas like the Rose Garden, Fernery, and Succulent Garden. Its most famous spot is \u0027Mrs Macquarie\u0027s Chair,\u0027 where you can capture the iconic side-by-side view of the Sydney Opera House and Harbour Bridge. The vast green lawns make it a top choice for locals and tourists alike to enjoy picnics, exercise, and stunning ocean vistas.", "name": "Royal Botanic Garden Sydney", "transport": "Take the train or light rail to Circular Quay Station, then walk for about 10 minutes."}, {"address": "Elizabeth St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 stars | Hyde Park is Australia\u0027s oldest public park, situated right in the heart of downtown Sydney, seamlessly separating the commercial and shopping districts. Large fig trees line the tree-shaded avenues, forming a lush natural canopy. At the southern end, the Anzac Memorial exudes a solemn atmosphere, while the northern end houses the famous neoclassical Archibald Fountain, attracting countless visitors for photos. Whether you\u0027re an office worker on a lunch break or a traveler visiting from afar, it\u0027s the perfect place to enjoy a tranquil escape amidst the city hustle.", "name": "Hyde Park", "transport": "Take the train to St James Station or Museum Station; the park is right outside the exit."}, {"address": "Art Gallery Rd, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 stars | The Domain is a vast open-air green space adjacent to the Royal Botanic Garden and the Art Gallery of New South Wales. Historically the private domain of the Governor, it is now Sydney\u0027s premier venue for major outdoor cultural events, large concerts, and New Year\u0027s Eve celebrations. Its sweeping lawns are perfect for morning runs, throwing a frisbee, or simply basking in the sun. From the park\u0027s elevated spots, you can look out over the Sydney skyline and the beautiful harbor, showcasing a harmonious blend of nature and urban life.", "name": "The Domain", "transport": "Take the train to St James Station or Martin Place Station, then walk for about 10 minutes."}, {"address": "Hickson Rd, Barangaroo NSW 2000, Australia", "feature": "\u2b50 4.7 stars | Barangaroo Reserve is one of central Sydney\u0027s most impressive urban renewal projects, transforming an old industrial container terminal into a 6-hectare foreshore park. The park features over 75,000 native New South Wales plants and tens of thousands of Sydney sandstone blocks creating a magnificent coastline path. Strolling along the trail offers 360-degree panoramic waterfront views of the Sydney Harbour Bridge and the western harbor area. It\u0027s also an exceptional spot to watch the sunset, seamlessly blending rich Indigenous cultural history with modern sustainable design.", "name": "Barangaroo Reserve", "transport": "Take the train or ferry to Wynyard Station or Barangaroo Wharf, then walk for about 10 minutes via the Wynyard Walk."}, {"address": "Pier Street, Harbour St, Darling Harbour NSW 2000, Australia", "feature": "\u2b50 4.5 stars | Situated at the southern end of Darling Harbour, the Chinese Garden of Friendship is a classic Ming Dynasty-style Jiangnan garden built to celebrate the sister-city relationship between Sydney and Guangzhou. Meticulously designed by landscape architects from Guangzhou, it perfectly integrates mountains, waters, pavilions, winding bridges, waterfalls, unique rock formations, and exotic plants. Stepping inside feels like traveling back to ancient China. You can stroll along bamboo pathways and lotus ponds, watch swimming koi fish, and enjoy authentic Chinese tea and snacks at the garden\u0027s teahouse\u2014a wonderfully quiet, oriental-style oasis right in the city center.", "name": "Chinese Garden of Friendship", "transport": "Take the light rail to Exhibition Centre Station, or walk about 8 minutes from Town Hall Station."}, {"address": "11 Harbour St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.5 stars | Located in the bustling heart of Darling Harbour, Tumbalong Park derives its name from the Indigenous word meaning \u0027place where seafood is found.\u0027 This modern urban park boasts expansive flat lawns, a large outdoor event stage, and a massive children\u0027s playground that kids adore. The playground comes equipped with water play features, extra-long slides, and climbing nets, making it a popular spot for family fun. Surrounded by various restaurants and shopping centers, it perfectly combines natural leisure with urban entertainment amenities.", "name": "Tumbalong Park", "transport": "Take the light rail to Convention Station or Exhibition Centre Station, then walk for about 3 minutes."}, {"address": "York St \u0026 Margaret St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.1 stars | Situated in the core of Sydney\u0027s financial district, Wynyard Park is an exquisite and historic urban oasis. Surrounded by soaring modern skyscrapers and historic heritage buildings, the park offers large mature trees and benches, making it a great spot for local office workers to unwind during lunch or for business people to take a brief rest. A bronze statue of Dr. John Dunmore Lang stands at the center of the park, and Wynyard Station beneath it is one of Sydney\u0027s busiest transport hubs, presenting a unique landscape where high-rises intersect with historic green spaces.", "name": "Wynyard Park", "transport": "Take the train or bus to Wynyard Station; the park is right outside the exit."}, {"address": "Eddy Ave, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.0 stars | Located directly north of Sydney\u0027s Central Station, Belmore Park serves as a major gateway green space at the southern end of the city center. Featuring century-old giant fig trees and lush green lawns, the park offers a spacious outdoor retreat for commuters and local residents. It frequently serves as a venue for cultural festivals, farmers\u0027 markets, and community events. Situated right next to vibrant Chinatown and bustling shopping streets, it presents a dynamic and inclusive urban oasis.", "name": "Belmore Park", "transport": "Take the train, light rail, or bus to Central Station; the park is directly across from the exit."}], "name": "Natural Scenery \u0026 Parks"}, "cat_4": {"items": [{"address": "Angel Place, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 Stars | Tucked away in a quiet alleyway in downtown Sydney, the \u0027Forgotten Songs\u0027 art installation features 180 old birdcages suspended in mid-air. As you walk into this peaceful lane, you\u0027ll hear the calls of 50 native bird species that once inhabited Sydney but are now extinct or endangered, with different bird songs played for day and night. This spot is not only a visually striking and romantic Instagram photo hot spot, but it also conveys a profound message of environmental conservation. When lit up at night, it becomes truly magical and poetic.", "name": "Angel Place - \u0027Forgotten Songs\u0027 Birdcage Art Installation", "transport": "Take the Light Rail to City Centre station or train to Wynyard Station, then walk for about 3 minutes."}, {"address": "455 George St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.7 Stars | Hailed by famous British designer Pierre Cardin as \u0027the most beautiful shopping center in the world,\u0027 this late 19th-century Romanesque Revival building occupies an entire city block. Inside, you\u0027ll find exquisite stained glass windows, vintage floor tiles, ornate wrought-iron staircases, and two massive grand clocks (The Royal Clock and The Great Australian Clock). Whether taking photos under the vibrant stained glass, strolling through vintage corridors, or enjoying English High Tea in the Tiffany Blue tearoom, every snapshot captures elegant British classical charm. It is an absolute must-visit landmark in Sydney\u0027s city center.", "name": "Queen Victoria Building (QVB)", "transport": "Take the train to Town Hall Station and walk directly into the QVB via the underground concourse."}, {"address": "412-414 George St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 Stars | Opened in 1891, The Strand Arcade is Sydney\u0027s last remaining authentic Victorian-era shopping arcade, exuding rich classical Victorian luxury. The arcade features a towering glass ceiling, intricate geometric tile flooring, dark timber storefronts, and ornate cast-iron railings. As sunlight streams through the high glass roof, playing with light and shadow, it feels like stepping back in time to 19th-century Europe. Home to many local Australian independent designer brands and artisanal boutiques, it\u0027s a dream spot for art lovers and photography enthusiasts seeking classic British aesthetics.", "name": "The Strand Arcade", "transport": "Take the Light Rail or train to Town Hall Station and walk north along George Street for about 4 minutes."}, {"address": "St Marys Rd, Sydney NSW 2000, Australia", "feature": "\u2b50 4.8 Stars | Located on the eastern side of Hyde Park, St Mary\u0027s Cathedral is the largest Catholic church in Australia. Built in the Gothic Revival style, its twin spires stand tall and grand. Constructed from sandstone, the interior features majestic soaring vaults and vibrant stained glass windows that filter light onto the floors, creating a sacred and romantic atmosphere. The plaza and reflecting pool in front of the cathedral are photographer favorites for capturing stunning reflections of the building, making it a popular hot spot for wedding photos and social media check-ins.", "name": "St Mary\u0027s Cathedral", "transport": "Take the train to St James Station or Museum Station, then walk through Hyde Park for about 3 to 5 minutes."}, {"address": "Hyde Park North, Prince Albert Rd, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 Stars | Situated at the northern end of Sydney\u0027s Hyde Park, the Archibald Fountain is Australia\u0027s finest French Neoclassical sculpture fountain. Commemorating the alliance between Australia and France in WWI, it features a central bronze statue of the Greek god Apollo, surrounded by water-spouting mythical beasts and dragons. Set against the backdrop of St Mary\u0027s Cathedral\u0027s twin spires, the splashing water and classical sculptures look magnificent against the blue sky and green trees, making it one of the most romantic French-style photo spots in Sydney.", "name": "Archibald Fountain, Hyde Park", "transport": "Take the train to St James Station; the northern end of Hyde Park is right outside the exit."}, {"address": "1 Shakespeare Pl, Sydney NSW 2000, Australia", "feature": "\u2b50 4.7 Stars | Established in 1826, the State Library of New South Wales is Australia\u0027s oldest library, with its classical Mitchell Reading Room being a beloved photo spot. The reading room boasts a soaring glass dome ceiling, three tiers of surrounding classical bookshelves, and walls lined with leather-bound antique books, exuding a distinct Hogwarts magic academy vibe. Bathed in soft natural light, the library exudes quiet elegance, drawing many visitors who love the vintage dark academia aesthetic for photos.", "name": "State Library of New South Wales - Mitchell Reading Room", "transport": "Take the train to Martin Place Station, then walk for about 4 minutes."}, {"address": "Martin Pl, Sydney NSW 2000, Australia", "feature": "\u2b50 4.5 Stars | Known as the \u0027Heart of Sydney,\u0027 Martin Place is a vibrant pedestrian plaza spanning the central business district. It brings together grand sandstone heritage buildings, including the former General Post Office (GPO) Building and the Commonwealth Bank Building, blending classical grandeur with a modern urban feel. Martin Place has served as a filming location for Hollywood blockbusters such as \u0027The Matrix\u0027. During Christmas, Sydney\u0027s largest and most radiant Christmas tree lights up the plaza, drawing crowds of locals and tourists to soak in the festive atmosphere.", "name": "Martin Place", "transport": "Take the train to Martin Place Station for direct access to the plaza center."}, {"address": "500 George St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.5 Stars | Located on George Street in Sydney\u0027s CBD, The Grounds of the City is the downtown sister venue of the famous Instagram-favorite cafe, The Grounds of Alexandria. Transporting guests to a vintage 1920s Parisian bistro and historic railway station, the restaurant features exquisite wood carvings, brass accents, antique bookshelves, and plush leather booths. Baristas brew specialty coffee on-site, while beautifully plated dishes and desserts look like works of art. Every corner offers a prime backdrop for stunning, high-end Instagram photos.", "name": "The Grounds of the City", "transport": "Take the train to Town Hall Station and walk about 2 minutes along George Street. Located in the basement level of The Galeries shopping center."}], "name": "Top Instagrammable Spots"}}, "name": "Sydney City Centre and Shopping District"}};
        const cityName = "Sydney";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
