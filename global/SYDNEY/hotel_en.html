80"}}, {"address": "242 Arden Street, Coogee NSW 2034, Australia", "feature": "\u2b50 4.4 stars | Located directly opposite Coogee Beach, another famous eastern suburbs beach, this iconic 5-star resort hotel offers breathtaking 180-degree South Pacific ocean views. The hotel boasts first-class leisure facilities, including an ocean-view outdoor pool, several upscale dining venues, and the oceanfront bar Shutters. Spacious and bright rooms feature modern coastal design, with most offering private ocean-view balconies. Guests can step right onto the sand or easily join the famous Bondi to Coogee Coastal Walk.", "name": "Crowne Plaza Coogee Beach", "transport": "Take Bus 350 or 374 from Sydney CBD or Bondi Junction Station and get off at the Arden St near Coogee Beach stop.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Crowne%2520Plaza%2520Coogee%2520Beach", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Crowne%2520Plaza%2520Coogee%2520Beach", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Crowne%20Plaza%20Coogee%20Beach", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Crowne%20Plaza%20Coogee%20Beach%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "97 Grafton Street, Bondi Junction NSW 2022, Australia", "feature": "\u2b50 4.5 stars | A standout landmark at the eastern suburbs transport hub, Meriton Suites offers high-floor ultra-luxurious suites with sweeping views of the Sydney Harbour Bridge, Opera House, or Bondi Beach. Featuring exceptionally spacious suites equipped with full gourmet kitchens, laundry facilities, and expansive floor-to-ceiling windows, the property also includes an indoor heated pool, spa, and modern fitness center. Located directly above Westfield Shopping Centre and the train station, convenience is unmatched.", "name": "Meriton Suites Bondi Junction", "transport": "Take the T4 Eastern Suburbs train to Bondi Junction Station and walk about 1 minute after exiting.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Meriton%2520Suites%2520Bondi%2520Junction", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Meriton%2520Suites%2520Bondi%2520Junction", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Meriton%20Suites%20Bondi%20Junction", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Meriton%20Suites%20Bondi%20Junction%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "69-73 Hall Street, Bondi Beach NSW 2026, Australia", "feature": "\u2b50 4.3 stars | Located on Hall Street, Bondi Beach\u0027s bustling dining and fashion avenue, this luxury apartment hotel combines stylish elegance with everyday convenience. It features a beautiful sunlit courtyard pool and relaxation lounge, with rooms designed in sleek modern Australian style, complete with full kitchens and living areas. Situated right above acclaimed sourdough bakeries, specialty cafes, and boutiques, it lets guests immerse themselves in the refined coastal lifestyle of Sydney\u0027s eastern suburbs.", "lat": -33.8897256, "lng": 151.2718424, "name": "Adina Apartment Hotel Bondi Beach Sydney", "transport": "Take Bus 333 from Sydney CBD to the Hall St near Glenayr Ave stop, then walk about 1 minute.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Adina%2520Apartment%2520Hotel%2520Bondi%2520  | Located right next to the World Square Shopping Centre near Sydney Chinatown, this is an iconic luxury hotel in the area. Rooms are spacious and elegant, equipped with signature Dream Beds and modern technology. The hotel features a stylish lounge bar and a 24-hour fitness center. Downstairs is the shopping mall and Chinatown food precinct, offering ultimate convenience and connectivity.", "lat": -33.8767065, "lng": 151.2073638, "name": "Rydges World Square Sydney", "transport": "About a 2-minute walk from Chinatown Station on Light Rail L2/L3 lines, and about a 7-minute walk from Central Station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Rydges%2520World%2520Square%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8767065%2C151.2073638", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8767065,151.2073638", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Rydges%20World%20Square%20Sydney%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Luxury 5-Star \u0026 Landmark Hotels"}, "cat_2": {"items": [{"address": "412 Pitt Street, Haymarket, Sydney NSW 2000", "feature": "\u2b50 4.4 stars | Built in 1929 in the heart of Chinatown, Hotel Morris was originally a classic Italianate-style building, meticulously restored into a stylish boutique hotel under Accor\u0027s Handwritten Collection. The entire hotel blends rich Italian vintage charm with modern aesthetics. Rooms feature warm brass accents, plush velvet headboards, and elegant marble bathrooms. The onsite Bar Morris is a sophisticated Italian bar and eatery serving exceptional cocktails and local dishes\u2014perfect for travelers who love vintage aesthetics and refined quality.", "name" laimed timber, brass accents, and lush greenery. Each guest room is appointed with handcrafted Japanese ceramic cups, Aesop toiletries, and a curated vinyl record player, with balconies framed by unique semi-outdoor wooden screening. Downstairs houses the highly popular Paramount Coffee Project and a subterranean vintage cinema, exuding a rich artistic vibe.", "name": "Paramount House Hotel", "transport": "About a 6-minute walk from Central Station East Exit.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Paramount%2520House%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Paramount%2520House%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Paramount%20House%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Paramount%20House%20Hotel%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1 Kensington Street, Chippendale, Sydney NSW 2008", "feature": "\u2b50 4.5 stars | Created by combining the former Carlton \u0026 United Breweries site with a classic heritage pub, The Old Clare Hotel is a renowned industrial-chic design hotel under the Unlisted Collection. The design retains exposed brickwork, vintage staircases, and soaring ceilings, artfully paired with contemporary art lighting and vintage furnishings. The rooftop features an atmospheric open-air pool and bar overlooking city night views. Rooms are exceptionally spacious and characterful, brimming with rich Australian industrial history and avant-garde style.", "name": "The Old Clare Hotel", "transport": "About a 6-minute walk from Central Station West Exit, adjacent to Central Park Mall.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520The%2520Old%2520Clare%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520The%2520Old%2520Clare%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20The%20Old%20Clare%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=The%20Old%20Clare%20Hotel%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "47-53 Wentworth Avenue, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | The renowned American hipster hotel brand Ace Hotel\u0027s first southern hemisphere outpost is located in a historic former warehouse building near Central Station and Chinatown. Designed by the acclaimed Flack Studio, the aesthetics draw inspiration from warm Australian earth tones and contemporary art. Rooms feature turntable record players, D\u0027Angelico guitars, and custom textiles. The rooftop restaurant and bar, Kiln, offers sweeping views of the Sydney skyline, while the lobby cafe and communal spaces serve as a bustling social hub for local creatives and tastemakers.", "lat": -33.8788467, "lng": 151.2099659, "name": "Ace Hotel Sydney", "transport": "About a 5-minute walk from Central Station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Ace%2520Hotel%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8788467%2C151.2099659", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8788467,151.2099659", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Ace%20Hotel%20Sydney acious open-plan living room, high-quality sound system, and a gourmet kitchen, it is the perfect base for experiencing Sydney\u0027s arts scene and harbour charm.", "name": "Walsh Bay Waterfront Suites", "transport": "About a 12-minute walk from Circular Quay Station, or direct via Bus 311.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Walsh%2520Bay%2520Waterfront%2520Suites", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Walsh%2520Bay%2520Waterfront%2520Suites", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Walsh%20Bay%20Waterfront%20Suites", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Walsh%20Bay%20Waterfront%20Suites%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}], "name": "Boutique Apartments \u0026 Holiday Rentals"}}, "name": "Circular Quay and The Rocks"}, "darling_harbour_barangaroo": {"categories": {"cat_1": {"items": [{"address": "1 Barangaroo Ave, Barangaroo NSW 2000, Australia", "feature": "\u2b50 4.6 stars | Located along the Barangaroo waterfront, Crown Towers Sydney is Sydney\u0027s most iconic new luxury landmark. This 75-story petal-shaped skyscraper offers unparalleled dual views of the Sydney Opera House and the Sydney Harbour Bridge. Rooms feature panoramic floor-to-ceiling windows, opulent marble bathrooms, and state-of-the-art smart climate and lighting controls. The hotel features an infinity pool, a world-class spa, and premier dining options including the renowned Japanese restaurant Nobu and Italian restaurant Woodcut, delivering an ultra-luxurious hospitality experience.", "name": "Crown Towers Sydney", "transport": "About an 8-minute walk from Wynyard Station, or a 3-minute walk from Barangaroo Wharf after taki ent hotel offers seamless connectivity to Sydney Harbour ferry networks and vibrant waterfront scenes. Featuring stylish, minimalist studio, one-, and two-bedroom apartments with full modern kitchens, private laundry facilities, and private balconies, guests can enjoy tranquil views of ferries gliding across the bay. Convenient step-out access to the wharf and dining precinct makes it ideal for both business and leisure coastal stays.", "name": "Quest Manly", "transport": "Cross the street upon exiting Manly Wharf; under a 1-minute walk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Quest%2520Manly", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Quest%2520Manly", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Quest%20Manly", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Quest%20Manly%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "2 Queens Parade, Newport NSW 2106", "feature": "\u2b50 4.1 stars | A landmark boutique resort nestled along the tranquil shores of Pittwater on Sydney\u0027s Northern Beaches, renowned for breathtaking blue-water views and a private jetty. Elegantly appointed rooms feature private water-view balconies overlooking moored yachts and stunning sunsets. Facilities include an outdoor swimming pool, spa, and waterfront dining and event venues. Located just steps from the iconic venue \u0027The Newport\u0027, it\u0027s an ideal refuge for scenic serenity and coastal elegance.", "name": "Metro Mirage Hotel Newport", "transport": "From Wynyard Station in Sydney CBD, take the B1 express bus to Mona Vale, then transfer to bus 199 to Newport, followed by a 5-minute walk.", "urls": {"agoda": "https://tp.media/r?camp y", "transport": "Exit Manly Ferry Wharf, walk along The Corso pedestrian street to the beach, turn left, and walk for about 6 minutes total.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Curling%2520Wave%2520Oceanfront%2520Apartments%2520Manly", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Curling%2520Wave%2520Oceanfront%2520Apartments%2520Manly", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Curling%20Wave%20Oceanfront%20Apartments%20Manly", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Curling%20Wave%20Oceanfront%20Apartments%20Manly%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "1 Oceanic Esplanade, Manly NSW 2095, Australia", "feature": "\u2b50 4.3 stars | Located along the middle section of Manly Beach, offering stylish high-rise oceanview suites and resort-style amenities. The property features a heated swimming pool, sauna, and dedicated BBQ area. The rooms are spacious, well-ventilated, and equipped with washer/dryer facilities and a full kitchen. A short walk brings you to the famous Corso shopping street and fine seafood restaurants, making it an excellent choice for families or friends vacationing on the Northern Beaches.", "name": "Manly Ocean Royal Apartments", "transport": "About a 7-minute walk from Manly Ferry Wharf, or take bus 161 and get off near Marine Parade.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Manly%2520Ocean%2520Royal%2520Apartments", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.h outique hotel was converted from the heritage-listed 1930s Paramount Pictures Australian headquarters. The architecture seamlessly blends industrial brickwork, luxurious timber details, and lush greenery. Each room features a luxurious wooden soaking tub and locally curated items. Downstairs, you\u0027ll find Sydney\u0027s top Paramount Coffee Project cafe and an independent art house cinema, making it a premier choice for culturally rich accommodation.", "name": "Paramount House Hotel", "transport": "About a 7-minute walk from Central Station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Paramount%2520House%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Paramount%2520House%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Paramount%20House%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Paramount%20House%20Hotel%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "47-53 Wentworth Ave, Surry Hills NSW 2010", "feature": "\u2b50 4.4 Stars | The Southern Hemisphere\u0027s first location for the world-renowned stylish brand Ace Hotel, standing on the historic site of a former Surry Hills pottery factory. Designed by the acclaimed Flack Studio, the interior artfully incorporates Australian Indigenous culture color palettes, vinyl record players, and warm timber tones. The top floor houses the fine-dining restaurant Kiln and an open-air rooftop bar offering panoramic views of Surry Hills and the Sydney skyline, creating an exquisite luxury vibe where vintage charm meets contemporary fashion.", "lat": -33.8788467, "lng": 151.2099659, "name": "Ace Hotel Sydney", "transport": "About a 5-minute walk from Central St s, and natural botanical toiletries. The rooftop houses the lush Paramount Recreation Club fitness space, while the ground floor is home to Sydney\u0027s famed Paramount Coffee Project specialty caf\u00e9, offering guests an immersive stay defined by artistic elegance and relaxed luxury.", "name": "Paramount House Hotel", "transport": "Take Sydney Light Rail L2 or L3 to Surry Hills Station, then walk about 5 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Paramount%2520House%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520Paramount%2520House%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20Paramount%20House%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Paramount%20House%20Hotel%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "21 Little Albion St, Surry Hills NSW 2010, Australia", "feature": "\u2b50 4.6 stars | Tucked away in a quiet lane in Surry Hills, Crystalbrook Albion is a former 1900s convent beautifully transformed into a boutique hotel combining \u002770s glam nostalgia with modern minimalism. The hotel is filled with contemporary artwork and designer furnishings, featuring a cozy Honesty Bar and a scenic rooftop garden terrace. Embracing sustainable luxury, it offers paperless services and recycled amenities throughout, making it an ideal choice for travelers seeking privacy and high-end design.", "lat": -33.8827881, "lng": 151.2117341, "name": "Crystalbrook Albion", "transport": "About a 7-minute walk from Central Station\u0027s East Exit.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftex }}, {"address": "52-60 Enmore Rd, Newtown NSW 2042, Australia", "feature": "\u2b50 4.2 stars | Located in the heart of Newtown\u2014a neighborhood known for rock \u0027n\u0027 roll and independent art\u2014The Urban Newtown features a bold industrial style accented by vibrant street art. Exposed brick walls, metal piping, and concrete finishes perfectly echo the local street culture around King Street. Rooms are spacious and equipped with modern kitchenettes. Every evening, the hotel hosts a complimentary craft beer and wine tasting hour, allowing travelers from around the world to mingle and experience Newtown\u0027s unique bohemian vibe.", "lat": -33.8987957, "lng": 151.176325, "name": "The Urban Newtown", "transport": "Take the train to Newtown Station and walk about 3 minutes from the exit.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520The%2520Urban%2520Newtown", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8987957%2C151.176325", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8987957,151.176325", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=The%20Urban%20Newtown%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "19 Australia St, Camperdown NSW 2050, Australia", "feature": "\u2b50 4.4 stars | Bordering Newtown and Camperdown, The Collectionist Hotel turns the traditional hotel check-in concept on its head. Partnering with dozens of Australian local artists and interior designers, this boutique hotel created 39 completely unique art-themed rooms. Upon check-in, guests can personally choose their available room for the night. Ranging from sleek minimalism and vintage retro to bold colorful abstract designs, each room feels like an independent gallery exhibition, adding delightful surprises to every Sydney trip.", "name": "The Collectionist Hotel", "transport": "Take bus 412, 422, or 423 to King St Near Australia St stop, then walk about 3 minutes.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520The%2520Collectionist%2520Hotel", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520The%2520Collectionist%2520Hotel", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=Sydney%20The%20Collectionist%20Hotel", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=The%20Collectionist%20Hotel%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "285 Crown St, Surry Hills NSW 2010, Australia", "feature": "\u2b50 4.4 stars | Located near vibrant Crown Street in Surry Hills, ADGE is renowned for its bold pop-art style featuring vivid colors and geometric patterns. Offering guest rooms and multi-bedroom apartment suites equipped with full gourmet kitchens, private balconies, and open-plan living areas, it is ideal for families and extended stays. Surrounded by top Sydney dining spots and independent cafes, guests can enjoy avant-garde design while easily exploring Sydney\u0027s iconic foodie lifestyle.", "name": "ADGE Hotel \u0026 Residences", "transport": "Take bus 304, 343, or 352 to Crown St Near Campbell St stop, then walk about 1 minute.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520ADGE%2520Hotel%2520%2526%2520Residences", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3DSydney%2520ADGE%2 "address": "49 Market St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.5 stars | Meticulously converted from historic Gothic buildings and a former department store, QT Sydney showcases an exquisite blend of vintage and modern artistic styles. The hotel features bold color palettes, dramatic lighting, and avant-garde artwork. A famous highlight is its interactive elevator music, which automatically plays corresponding lyrics based on the number of passengers. Rooms feature luxurious beds, lavish bathrooms, and personalized mini-bars. Located just steps from the Queen Victoria Building (QVB) and Sydney Tower, it is the top choice for travelers seeking ultimate design flair and trendy experiences.", "lat": -33.8709373, "lng": 151.2076595, "name": "QT Sydney", "transport": "Take the light rail to QVB Station or the train to Town Hall Station; it is about a 2-minute walk.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520QT%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8709373%2C151.2076595", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8709373,151.2076595", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=QT%20Sydney%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "339 Pitt St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.6 stars | Lovingly restored from the historic 1930s Water Board headquarters, this hotel showcases a rich Art Deco style. The lobby features striking carmine pillars and soaring ceilings, seamlessly blending heritage charm with modern sophistication. Guests enjoy a complimentary daily evening Social Hour, designer bikes for rent, a rooftop pool, and the top-tier restaurant Luke\u0027s Kitchen. Rooms are spacious with high-end detailing, and its pet-friendly policy is a standout feature.", "lat": -33.8751735, "lng": 151.2077432, "name": "Kimpton Margot Sydney", "transport": "A 3-minute walk from either Town Hall Station or Museum Station.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Kimpton%2520Margot%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8751735%2C151.2077432", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8751735,151.2077432", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Kimpton%20Margot%20Sydney%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "26 Clarence St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.5 stars | Located directly above Wynyard Station, Little National Hotel centers its design on minimalist Japanese aesthetics and high-tech convenience. Embracing the concept of \u0027compact space, big luxury,\u0027 rooms feature custom, ultra-comfortable Super King beds, floor-to-ceiling window views, and high-end bathroom amenities. The hotel rooftop boasts an atmospheric lounge and bar area, providing a tranquil urban sanctuary perfect for business and leisure travelers alike.", "lat": -33.8656847, "lng": 151.2050555, "name": "Little National Hotel Sydney", "transport": "Directly connected to Wynyard Station; a 1-minute walk after exiting the train or light rail.", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Little%2520National%2520Hotel%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3 el operated by the YWCA right next to Hyde Park, where all profits support social community programs. Newly renovated with vibrant, bright decor, it offers premium business rooms at incredibly competitive rates. Equipped with free high-speed Wi-Fi and sleek writing desks, it\u0027s situated in a quiet location just a short walk from downtown shopping\u2014a high-value stay filled with positive impact.", "lat": -33.8773313, "lng": 151.2116286, "name": "Song Hotel Sydney", "transport": "3-minute walk to Museum Train Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Song%2520Hotel%2520Sydney", "booking": "https://tp.media/r?campaign_id=84\u0026marker=720742\u0026p=2076\u0026trs=176211\u0026u=https%3A//www.booking.com/searchresults.zh-tw.html%3Fss%3D-33.8773313%2C151.2116286", "gmap": "https://www.google.com/maps/search/?api=1\u0026query=-33.8773313,151.2116286", "trip": "https://tw.trip.com/hotels/list?flexType=1\u0026fixedDate=0\u0026cityName=Sydney\u0026destName=Song%20Hotel%20Sydney%2C%20Sydney\u0026Allianceid=7913725\u0026SID=304681280"}}, {"address": "165 Phillip St, Sydney NSW 2000", "feature": "\u2b50 4.2 Stars | Situated in Martin Place in the heart of Sydney, close to major law firms, financial institutions, and embassies. The hotel offers refined rooms blending chic style with business functionality, complete with kitchenette facilities like microwaves and mini-fridges for long-term travelers. Friendly, efficient service makes its pricing highly competitive for such a prime location.", "name": "Mercure Sydney Martin Place", "transport": "3-minute walk to Martin Place Train Station", "urls": {"agoda": "https://tp.media/r?campaign_id=104\u0026marker=720742\u0026p=2854\u0026trs=176211\u0026u=https%3A//www.agoda.com/search%3Ftext%3DSydney%2520Mercure%2520Sydney%2520Martin%2520Place", "booking": "https://tp.media/r?campaign_id=84\u0026marker=72074         const cityNameEn = "Sydney";
        let curDist = null, curCat = null;

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); 
            container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No data available.</div>`;
                return;
            }
            
            document.getElementById('content-area').innerHTML = items.map(item => {
                const itemName = item.name || item.title || "Hotel";
                const itemFeature = item.feature || item.description || "";
                const itemAddress = item.address || item.location || "See Map Navigation";
                const itemTransport = item.transport || item.transit || "See Map";
                
                // 保留亮點的 Google 搜尋功能
                const searchKeyword = encodeURIComponent(`${cityNameEn} ${itemName}`);
                const formattedFeature = itemFeature.replace(/(⭐\s*[\d\.]+(?:\s*Stars?|\s*星)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 🚀 直接讀取 Python 預先處理好的網址
                const mapUrl = item.urls?.gmap || `https://www.google.com/maps/search/?api=1&query=${searchKeyword}`;
                const agodaUrl = item.urls?.agoda || '#';
                const bookingUrl = item.urls?.booking || '#';
                const tripUrl = item.urls?.trip || '#';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${itemName}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Highlights</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address：</span><br>${itemAddress}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transportation：</span><br>${itemTransport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> Map Navigation
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
