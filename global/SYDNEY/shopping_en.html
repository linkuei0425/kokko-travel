ing it a wonderful hidden gem for exotic gifts.", "name": "Jarern Chai Asian Grocer", "transport": "Walk for about 5 minutes along Pitt St from Sydney Central Station."}, {"address": "605 George St, Haymarket NSW 2000", "feature": "\u2b50 4.5 stars | Must-buy list: Handmade Hungarian chimney cakes (K\u00fcrt\u0151skal\u00e1cs), slab nut chocolate cakes, house-roasted coffee beans. This charming independent dessert shop is famous for fresh-made Hungarian chimney cakes, along with an array of exquisite takeaway baked treats and coffee beans. Crispy on the outside and soft within, dusted with cinnamon sugar or crushed nuts, chimney cakes are a wildly popular local sweet treat presented in lovely takeaway boxes.", "name": "K\u00fcrt\u0151sh Haymarket", "transport": "Take the Light Rail to Chinatown station and walk for about 2 minutes."}, {"address": "710 George St, Haymarket NSW 2000", "feature": "\u2b50 4.6 stars | Must-buy list: Lucas\u0027 Papaw Ointment, Blackmores Vitamin E Cream, Swisse High Strength Cranberry capsules. Situated in the heart of Chinatown on George St, this massive discount chemist chain is the top pick for travelers worldwide to buy holy-grail Aussie skincare and health snacks. With a hugely comprehensive range and massive discounts, you can easily grab papaw ointment, hand cream, or vitamin gummies all in one go at friendly prices.", "name": "Chemist Warehouse Haymarket", "transport": "Take the Light Rail to Chinatown station; it\u0027s right there when you step off."}], "name": "Must-Buy Unique Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "9-13 Hay St, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.4 stars | Must-Buy List: TK Maxx discounted designer bags, Bonds essential Australian underwear, Paddy\u0027s Market souvenirs. Located in the heart of Chinatown, this four-story complex combines powerhouse outlet stalls with a traditional local market. Beloved by locals and tourists alike, it\u0027s the perfect spot to hunt for designer bargains while soaking in authentic Sydney vibes.", "name": "Market City Shopping Centre", "transport": "Take the Sydney Light Rail (L2/L3) to Capitol Square Station and walk for 2 minutes."}, {"address": "Level 1, Market City, 9-13 Hay St, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.3 stars | Must-Buy List: Discounted Calvin Klein underwear sets, classic Ralph Lauren Polo shirts, Australian organic hand creams. As one of Sydney city center\u0027s most iconic designer outlet stores, it features a treasure-hunt style layout. Every day, off-season luxury items, fashion apparel, and lifestyle goods from major department stores are stocked at incredible 70% to 90% discounts, making it a go-to sanctuary for locals looking to bag big brands on a budget.", "name": "TK Maxx Market City", "transport": "Walk about 8 minutes from Central Station, or take the light rail to Capitol Square Station."}, {"address": "9-13 Hay St, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.1 stars | Must-Buy List: Australian opal silver jewelry, pure wool scarves, koala plush toy sets. A historic local indoor market located on the ground level of Market City. Home to hundreds of local vendors, it offers the most comprehensive and affordable selection of Australian souvenirs, native handicrafts, and fresh fruits, making it a top choice for experiencing local Sydney culture and shopping for gifts.", "name": "Paddy\u0027s Markets Haymarket", "transport": "Walk about 8 minutes from Central Station, or take the light rail directly to Paddy\u0027s Markets Station."}, {"address": "28 Broadway, Chippendale NSW 2008, Australia", "feature": "\u2b50 4.5 stars | Must-Buy List: Daiso everyday lifestyle goods, Shortstop specialty craft coffee beans, budget-friendly Woolworths Australian snacks. Located right next to Central Station, this green architectural landmark designed by world-class architects features lush vertical gardens on its facade. The interior blends Sydney\u0027s local creative brands, Japanese-style boutiques, and a vibrant food court, showcasing a unique mix of modern trends and sustainable ecology.", "name": "Central Park Mall", "transport": "Walk about 5 minutes from the West Exit of Central Station."}, {"address": "Shop RB12, Central Park Mall, 28 Broadway, Chippendale NSW 2008, Australia", "feature": "\u2b50 4.6 stars | Must-Buy List: Sydney illustrator collab T-shirts, original animal-print tote bags, handmade ceramic mugs. An independent creative brand originating from Sydney that serves as a platform for local artists. Playful and artistic, the shop features clothing, bags, and lifestyle items adorned with unique original patterns, making it the ultimate independent shop for one-of-a-kind creative gifts.", "name": "Monsterthreads Central Park Mall", "transport": "Walk 5 minutes from Central Station to Level 1 of Central Park Mall."}, {"address": "1 Bay St, Glebe NSW 2037, Australia", "feature": "\u2b50 4.5 stars | Must-Buy List: Mecca Max Australia-exclusive makeup palettes, Cotton On loungewear, stylish affordable homeware from Kmart. A large shopping center near Central Station catering primarily to local university students and residents. Instead of high-end luxury brands, it houses an extensive collection of local Australian budget-friendly brands and flagship stores, offering a genuine taste of everyday Sydney shopping.", "name": "Broadway Sydney", "transport": "Take bus 431, 433, or 422 from Central Station bus interchange for about 5 minutes and get off at Railway Square Station."}, {"address": "68 Dixon St, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.7 stars | Must-Buy List: Classic short premium wool sheepskin boots, waterproof non-slip fluffy house slippers, premium Australian wool insoles. Located in the heart of Chinatown, this well-known local boot store uses 100% top-grade Australian twin-face sheepskin. Friendly bilingual service, superb quality, and fair prices make it the go-to spot for authentic Australian sheepskin boots.", "name": "Ugg Express - Haymarket", "transport": "Located on Dixon Street pedestrian mall in Chinatown, about a 3-minute walk from Chinatown Light Rail Station."}, {"address": "3/405-411 Sussex St, Haymarket NSW 2000, Australia", "feature": "\u2b50 4.4 stars | Must-Buy List: Independent designer blind box figures, cute stationery sets, bestselling Japanese and Korean moisturizing face masks. An independent pop-lifestyle boutique deeply rooted in Sydney\u0027s Chinatown for decades, holding shared memories for local youth and international students. Though compact, it is filled with the latest Asian trend lifestyle goods, cute stationery, and skincare products, vibrant with local commercial character.", "name": "Morning Glory Haymarket", "transport": "About a 2-minute walk from Chinatown Light Rail Station to the Sussex St storefront."}], "name": "Major Shopping Malls \u0026 Outlets"}}, "name": "Chinatown and Central Station"}, "circular_quay_rocks": {"categories": {"cat_1": {"items": [{"address": "Shop 1, 15 Young St, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-buys: Resurrection Aromatique Hand Wash, Parsley Seed Anti-Oxidant Serum, Lucent Facial Concentrate. A luxury skincare brand originating from Melbourne, famed for its minimalist aesthetics. This branch in Quay Quarter Lanes features striking contemporary architecture combining warm timber tones with concrete. Providing attentive, personalized consultations and trial experiences, it is a must-visit destination for lovers of botanical skincare and fine fragrances.", "name": "Aesop (Aesop Quay Quarter)", "transport": "About a 3-minute walk from Circular Quay Station."}, {"address": "Shop G12, Gateway Sydney, 1 Macquarie Pl, Sydney NSW 2000", "feature": "\u2b50 4.4 stars | Must-buys: Rosewater Balancing Mist, Rose Hand Cream, Rare Rose Serum. A premium botanical skincare brand sourced from an organic farm in Adelaide, South Australia, focusing on pure, natural ingredients. Lo mprehensive inventory\u2014the perfect spot for budget-friendly Aussie skincare staples like Lucas\u0027 Papaw, Sukin, and Natio.", "name": "Priceline Pharmacy Circular Quay", "transport": "Located inside Customs House at Circular Quay, just a 1-minute walk from the station exit."}, {"address": "38-42 Bridge St, Sydney NSW 2000", "feature": "\u2b50 4.3 stars | Must-buys: Blackmores Vitamin E Cream, Bio-Oil Skincare Oil, Goat Soap. Australia\u0027s largest and most discounted pharmacy chain, with this Bridge Street store situated just a stone\u0027s throw from Circular Quay. Famous for heavy discounts on popular Australian health supplements and chemist cosmetics, making it extremely popular among independent travelers.", "name": "Chemist Warehouse Bridge Street", "transport": "Walk along Loftus St from Circular Quay Station for about 5 minutes to reach the Bridge St intersection."}, {"address": "Gateway Sydney, Shop G10, 1 Macquarie Pl, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-buys: MECCA COSMETICA To Save Face Sunscreen, Lanolips Ointment, Frank Body Coffee Scrub. MECCA is Australia\u0027s largest high-end multi-brand beauty retailer, often referred to as the Australian Sephora. In addition to global prestige brands, it strongly champions trending local Australian labels like Lanolips and Frank Body, offering top-tier quality and modern style.", "name": "MECCA (MECCA Gateway Sydney)", "transport": "A 2-minute walk from Circular Quay Station into the Gateway shopping center."}, {"address": "Shop 3, Circular Quay Station, Alfred St, Sydney NSW 2000", "feature": "\u2b50 4.2 stars | Must-buys: Ego QV Intensive Body Cream, Dermal Therapy Lip Balm, Propolis Toothpaste. Centrally located right at the Circular Quay transport hub, this independent community pharmacy is frequently visited by local commuters and travelers. It stocks dermatologist-recommended gentle skincare products suitable for sensitive skin, with friendly staff offering expert skincare advice tailored to the local climate.", "name": "City Life Pharmacy Circular Quay", "transport": "Located on the ground floor concourse of Circular Quay Railway Station, right outside the turnstiles."}], "name": "Iconic Local Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "138 George St, The Rocks NSW 2000", "feature": "\u2b50 4.7 stars | Must-Buy List: Craftsman classic Chelsea handcrafted leather boots, Drover genuine leather belt, Australian wool jackets. Founded in 1932, this iconic Australian national treasure footwear brand is famous worldwide for its Chelsea boots seamlessly crafted from a single piece of leather. Located in a historic building in The Rocks, this flagship store embodies rugged Australian heritage and exquisite craftsmanship. Durable yet stylish, these boots are an essential classic for Sydney locals.", "name": "R.M. Williams The Rocks Flagship Store", "transport": "About a 5-minute walk from Light Rail L2/L3 \u0027Circular Quay\u0027 station"}, {"address": "39 George St, The Rocks NSW 2000", "feature": "\u2b50 4.6 stars | Must-Buy List: Cashmere knitwear, minimalist linen shirts, premium silk scarves. Founded in Sydney in 2004, this high-end apparel brand advocates understated luxury and ultimate comfort. Using organic and sustainable materials, the store offers minimalist clothing with soft textures and modern tailoring. Its elegant and simple design style is immensely popular among Sydney\u0027s urban elite.", "name": "Jac+ Jack The Rocks Boutique", "transport": "About a 6-minute walk from Circular Quay Station"}, {"address": "10 Argyle St, The Rocks NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Italian pure linen swim shorts, casual resort-style printed shirts, organic cotton-blend beach towels. Originating from Sydney\u0027s Bondi Beach, this leisure-luxury clothing brand focuses on a relaxed yet refined resort aesthetic. Set in historic The Rocks, its pure linen products are breathable, skin-friendly, and sleekly tailored, perfectly capturing Sydney\u0027s sun-soaked coastal resort lifestyle.", "name": "Venroy The Rocks Concept Store", "transport": "About a 7-minute walk from Circular Quay Station"}, {"address": "Shop G09, Gateway, 1 Macquarie Pl, Sydney NSW 2000", "feature": "\u2b50 4.4 stars | Must-Buy List: Margot leather crossbody tote, printed silk scarves, vintage leather cardholders. Established in 1938, Oroton is Australia\u0027s most iconic heritage luxury leather goods and fashion accessories brand. Combining chic, modern design with soft, high-quality leather at accessible prices, it is a go-to choice for Sydney women for both work and casual style.", "name": "Oroton Circular Quay", "transport": "Located inside the Gateway building right opposite Circular Quay Station exit"}, {"address": "1/2-4 Argyle St, The Rocks NSW 2000", "feature": "\u2b50 4.3 stars | Must-Buy List: Premium baby alpaca wool scarves, warm alpaca shawls, handmade alpaca plush toys. Located on historic Argyle Street in The Rocks, this shop specializes in high-quality Australian alpaca wool products. Lighter, warmer, and non-itchy compared to standard wool, the clothing and accessories here boast exceptional quality and local design/manufacturing, making it a warm and charming local boutique.", "name": "Australian Alpaca Centre", "transport": "About a 6-minute walk from Circular Quay Station"}, {"address": "9-15 Young St, Sydney NSW 2000", "feature": "\u2b50 4.8 stars | Must-Buy List: Ethereal floral lace dresses, luxury resort bikinis, embroidered linen jumpsuits. Founded in Sydney by sisters Nicky and Simone Zimmermann, this internationally renowned luxury women\u0027s fashion brand is world-famous for its romantic vibrant prints, intricate lace detailing, and high-end resort aesthetic. Its designs are beloved by international stars and fashion influencers alike.", "name": "Zimmermann Quay Quarter", "transport": "About a 3-minute walk from Circular Quay Station"}, {"address": "18 Loftus St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Sharply tailored blazers, chic party dresses, sustainable leather clutches. Founded in Sydney by three sisters, this contemporary womenswear brand is committed to ethical manufacturing and sustainable fashion. Known for bold geometric tailoring, vibrant colors, and premium fabrics, it perfectly embodies the independent, confident style of modern Sydney women.", "name": "Manning Cartell Quay Quarter", "transport": "About a 3-minute walk from Circular Quay Station"}, {"address": "135 George St, The Rocks NSW 2000", "feature": "\u2b50 4.2 stars | Must-Buy List: Classic twinface sheepskin short boots, warm sheepskin slippers, cozy wool gloves. A must-visit sheepskin boot shop when in Australia! This boutique in The Rocks exclusively uses premium 100% Australian Twinface Sheepskin. Featuring soft, comfortable soles that are breathable yet warm, it guarantees authentic Australian-made high-quality sheepskin boots.", "name": "UGG Australia The Rocks", "transport": "About a 5-minute walk from Circular Quay Light Rail Station"}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Shop 10, The Rocks Centre, 4a Argyle St, The Rocks NSW 2000", "feature": "\u2b50 4.6 stars | Must-buy list: Aussie Mix Candy, Koala Candy (Koala-shaped handmade hard candy), Fruit Slice Lollies. Located in an arcade in The Rocks, this ultra-popular handmade candy store allows customers to watch candy artisans masterfully pull and shape massive blocks of candy into delicate, patterned mini hard candies. Specializing in vibrant, iconic hand-crafted hard candies with a sweet and crunchy texture, these treats make delightful, cute souvenirs to share with friends and family back home.", "name": "Sticky (The Rocks)", "transport": "About a 6-minute walk from Circular Quay Light Rail Station (L2/L3 lines)."}, {"address": "George St \u0026 Playfair St, The Rocks NSW 2000", "feature": "\u2b50 4.5 stars | Must-buy list: Eucalyptus Honey, Handmade Soy Candles, Aboriginal Art Prints. Held every weekend, The Rocks Markets is one of Sydney\u0027s most iconic local markets, gathering hundreds of independent Australian creators and small farm stalls. Bursting with an artistic atmosphere and human warmth, you can find handmade jewelry and lifestyle goods, as well as sample local snacks and natural sauces. It is an ideal spot to hunt for unique Sydney keepsakes.", "name": "The Rocks Markets", "transport": "About a 5-minute walk from Circular Quay Station."}, {"address": "7 Staffords Ln, The Rocks NSW 2000", "feature": "\u2b50 4.6 stars | Must-buy list: Homemade Jam, Handmade Tea Cosy, Organic Loose Leaf Tea. Tucked inside a historic building in The Rocks, this tea room is famous for its traditional English afternoon tea and fresh, warm scones. In addition to dine-in service, the shop sells adorable hand-knitted tea cosies made by local artisans alongside house-made jams. These warm, retro items and exclusive tea packs make perfect, characterful souvenirs for tea enthusiasts.", "name": "The Tea Cosy", "transport": "About a 7-minute walk from Circular Quay; turn off Playfair St into the lane to reach the shop."}, {"address": "65 George St, The Rocks NSW 2000", "feature": "\u2b50 4.4 stars | Must-buy list: Pure Alpaca Scarf, Alpaca Plush Toy, Alpaca Shawl. Situated in the heart of The Rocks, the Australian Alpaca Centre specializes in premium textiles and accessories made from 100% high-grade Australian alpaca fleece. Alpaca wool is warmer than traditional wool and exceptionally soft without itchy fibers. Their plush alpaca toys are immensely popular with visitors, while the exquisite scarves and shawls serve as luxurious top-tier gifts for elders or personal indulgence.", "name": "Australian Alpaca Centre", "transport": "Take the bus to Bridge St Near George St station, then walk about 3 minutes."}, {"address": "Shop 4, Watermans Quay, Barangaroo / Near Circular Quay NSW 2000", "feature": cular Quay Light Rail Station (L2/L3)."}, {"address": "1 Hickson Rd, The Rocks NSW 2000", "feature": "\u2b50 4.7 stars | Must-buy list: Ken Done Sydney Harbour Silk Scarf, Art Postcard Set, Sydney Opera House Canvas Bag. Ken Done is a celebrated Australian artist famous for his vibrant, bold, and energetic depictions of Sydney Harbour, the Opera House, and the Great Barrier Reef. Located in The Rocks, his combined gallery and gift shop sells merchandise featuring his iconic artwork\u2014ranging from premium silk scarves and canvas totes to art books and stationery\u2014making for memorable souvenirs rich in Sydney\u0027s culture and artistic heritage.", "name": "Ken Done Gallery \u0026 Shop", "transport": "About a 6-minute walk from Circular Quay Wharves."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "19 Roseby St, Drummoyne NSW 2047, Australia", "feature": "\u2b50 4.3 stars | Must-Buy List: Oroton classic genuine leather bags, Peter Alexander signature Australian sleepwear, Tommy Hilfiger discounted apparel. This is Sydney\u0027s most famous waterfront outlet centre, easily accessible via water taxi or direct ferry from Circular Quay. It houses over 140 renowned international and Australian local brands offering discounts up to 70% off. Beyond buying iconic premium Australian leather goods from Oroton and famous sleepwear from Peter Alexander at ultra-affordable prices, you can enjoy stunning views of Sydney Harbour while shopping, making it an unmissable shopping paradise in Sydney.", "name": "Birkenhead Point Brand Outlet Centre", "transport": "Take the direct Shopper Hopper ferry from Wharf 6 at Circular Quay; takes about 20 minutes."}, {"address": "1 Alfred St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.2 stars | Must-Buy List: Jurlique Rose Hand Cream, T2 Australia-exclusive tea bag sets, Haigh\u0027s Chocolates handmade filled chocolates. Located in the heart of Circular Quay, this modern complex shopping plaza brings together many iconic Australian local brands and exquisite lifestyle goods. It is not only a top choice for tourists to buy souvenirs, but also a popular shopping spot for local office workers. With abundant local cosmetics and food counters on the ground and basement levels, it allows visitors to easily buy authentic Sydney gifts all in one stop before or after boarding a harbour cruise.", "name": "Gateway Sydney", "transport": "Just a 1-minute walk after exiting Circular Quay Station."}, {"address": "17 Playfair St, The Rocks NSW 2000, Australia", "feature": "\u2b50 4.4 stars | Must-Buy List: Ugg Express 100% premium sheepskin snow boots, Fine Day Australian original botanical print canvas bags, Southern Wild Co local scented candles. Tucked inside the historic sandstone buildings of The Rocks, this is an independent shopping arcade showcasing the charm of Sydney\u0027s local creators and homegrown brands. Unlike standardized major retail chains, it brings together many independent Australian designers offering apparel, handmade leather goods, and specialty skincare products. The heritage ambiance among brick and stone makes shopping rich with history, making it a fantastic destination to find unique Sydney souvenirs.", "name": "The Rocks Centre", "transport": "About a 5-minute walk from Circular Quay Station."}, {"address": "273 George St, Sydney NSW 2000, Australia", "feature": "\u2b50 4.1 stars | Must-Buy List: Aesop Resurrection Aromatique Hand Wash, Crumpler durable backpacks, Woolworths Australian propolis and black spread. Located near the intersection of Circular Quay and Wynyard, MetCentre is a versatile shopping center combining boutique shopping and everyday local essentials. It houses many high-end Australian skincare and lifestyle chain stores along with a large supermarket. Uncrowded compared to tourist zones, it allows visitors to shop precisely and comfortably like a local Sydneysider for Australia\u0027s famous supplements, skincare products, and original designer bags.", "name": "MetCentre Shopping Centre", "transport": "About a 6-minute walk from Circular Quay, or directly connected to Wynyard Station."}, {"address": "7-27 Circular Quay W, The Rocks NSW 2000, Australia", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-painted harbour mugs by local Australian artists, hand-stitched pebbled leather tote bags, fine Australian opal jewelry. Housed in converted 19th-century sandstone warehouses, Campbell\u0027s Stores sits right on the waterfront of The Rocks. Blending historic architectural heritage with modern high-end luxury, it features curated independent art galleries, craft shops, and upscale souvenir boutiques. Visitors can purchase crafts and exclusive jewelry created by top Australian artisans while taking in panoramic views of the Sydney Opera House and Harbour Bridge.", "name": "Campbell\u0027s Stores Retail Hub", "transport": "About a 6-minute walk along the waterfront from the west side of Circular Quay."}, {"address": "139 George St, The Rocks NSW 2000, Australia", "feature": "\u2b50 4.7 stars | Must-Buy List: Craftsman handmade Chelsea boots, pebbled leather printed belts, Australian Outback style cotton equestrian shirts. R.M. Williams is Australia\u0027s most iconic century-old national heritage brand for leather goods and apparel. This flagship store in The Rocks feels like a mini Australian Outback leather museum, with all products crafted from premium Australian leather. The store displays signature seamless whole-piece leather boots and provides on-site care and custom consultation services, serving as a shopping benchmark rich in local heritage and luxury quality.", "name": "R.M. Williams The Rocks Flagship Store", "transport": "About a 4-minute walk from Circular Quay."}, {"address": "Corner of Playfair St and Argyle St, The Rocks NSW 2000, Australia", "feature": "\u2b50 4.3 stars | Must-Buy List: Downunder UGG pure wool customized slippers, organic eucalyptus essential oil imalism with Sydney street casual. If you\u0027re looking for stylish shoes, bags, and clothing with exceptional texture and originality, don\u0027t miss this boutique select shop.", "name": "Somedays Independent Designer Select Shop (Somedays Surry Hills)", "transport": "Take light rail L2/L3 to Surry Hills Station, then walk for about 5 minutes."}], "name": "Popular Local Apparel, Shoe \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "3/294 King St, Newtown NSW 2042", "feature": "\u2b50 4.6 stars | Must-Buy List: Sydney-exclusive pattern handmade hard candies, Lemon Myrtle flavored candies, colorful mixed fruit candies. Located on the main strip of Newtown, this handmade candy store is a local legend. Candy artisans put on live performances daily, pulling molten sugar and shaping it with incredible skill into candies adorned with intricate patterns and lettering. The shop offers hard candies infused with native Australian botanical flavors and Sydney landmark designs. They are sweet, non-sticky, beautifully packaged, and make for a visually and tastefully delightful souvenir for friends and family.", "name": "Sticky Handmade Candy (Sticky Newtown)", "transport": "Take the train to Newtown Station, then walk for about 3 minutes."}, {"address": "60-64 Reservoir St, Surry Hills NSW 2010", "feature": "\u2b50 4.5 stars | Must-Buy List: Single O classic Reservoir blend coffee beans, specialty single-origin drip bags, brand-exclusive eco-friendly coffee cups. Surry Hills is the heartland of Sydney\u0027s specialty coffee scene, and Single O is a flagship brand driving Australia\u0027s third-wave coffee movement. The coffee beans here come from sustainable farms worldwide and are carefully roasted in-house to unlock rich floral and fruity aromas with a smooth mouthfeel. Coffee lovers travel here specifically to buy the freshest roasts and sleekly designed merchandise, allowing you to easily recreate Sydney\u0027s authentic specialty coffee taste at home.", "name": "Single O Specialty Coffee Beans (Single O Surry Hills)", "transport": "Take the train to Central Station, exit via Chalmers St, and walk for about 5 minutes."}, {"address": "118 Devonshire St, Surry Hills NSW 2010", "feature": "\u2b50 4.6 stars | Must-Buy List: Australian passionfruit truffle chocolates, macadamia dark chocolate tarts, handmade soft candy gift boxes. Adora is a renowned local artisan handmade chocolate shop in Sydney, located on Devonshire Street in Surry Hills. They stick to using fresh cream and premium ingredients without artificial preservatives or coloring. Their highlights include exquisite truffles infused with local Australian fruits like passionfruit and macadamia nuts. Buying a box as a gift demonstrates elevated taste while letting the recipient savor the freshness and richness of Australia in every bite.", "name": "Adora Handmade Chocolates Surry Hills", "transport": "Take the light rail to Surry Hills Station, then walk for about 2 minutes."}, {"address": "210 Australia St, Newtown NSW 2042", "feature": "\u2b50 4.6 stars | Must-Buy List: Canned Mar-tin-i cocktail, curated smoked sardine tins, Continental original design canvas tote bag. Located in Newtown, Continental Deli seamlessly blends a classic delicatessen with a vintage bar. Famous across Sydney for their proprietary house-canned cocktails and premium canned seafood, their shelves are packed with visually striking sealed tins\u2014from classic Martinis and Manhattans to carefully selected seafood preserved in oil. Beyond their charming retro packaging, these are easily the coolest and most talk-worthy gourmet souvenirs in Sydney.", "name": "Continental Deli Bar Bistro", "transport": "Take the train to Newtown Station, turn onto Australia St from King St, and walk for about 4 minutes."}, {"address": "269 King St, Newtown NSW 2042", "feature": "\u2b50 4.4 stars | Must-Buy List: Melbourne Breakfast tea, Australian botanical blend teas, colorful designer tea gift sets. While T2 has stores across Australia, the Newtown branch perfectly captures the area\u0027s unique, whimsical, and artistic vibe. The store is filled with hundreds of uniquely flavored loose-leaf teas and beautiful teaware, complete with an in-store tasting station. Quintessentially Australian picks include Melbourne Breakfast black tea infused with vanilla and mango aromas, as well as blend teas featuring native Australian ingredients. The stylish packaging makes them top-choice gifts.", "name": "T2 Tea Newtown Flagship Store", "transport": "Take the train to Newtown Station, exit and walk for about 2 minutes."}, {"address": "221 King St, Newtown NSW 2042", "feature": "\u2b50 4.5 stars | Must-Buy List: Native Australian animal illustrated socks, local artist print insulated water bottles, original canvas crossbody bags. Monsterthreads is an Australian independent creative brand that collaborates with local young illustrators to transform playful, whimsical artwork into everyday lifestyle goods and snack packaging. The Newtown store radiates an artistic, indie vibe. Their kangaroo, koala, and wombat illustrated products break away from conventional tourist souvenir clich\u00e9s\u2014they are stylish, high-quality, and serve as a delightful haven for picking up cute creative gifts.", "name": "Monsterthreads Original Illustration \u0026 Gift Shop (Monsterthreads Newtown)", "transport": "Take the train to Newtown Station, then walk for about 3 minutes."}, {"address": "4/490 Crown St, Surry Hills NSW 2010", "feature": "\u2b50 4.3 stars | Must-Buy List: Tasmanian Leatherwood Honey, Australian natural macadamia handmade cookies, local artisan nut spreads. Maloneys Grocer is a go-to boutique grocery store for Surry Hills locals, specializing in carefully selected small-batch produce and premium snacks from across Australia. Here you can find limited-edition wild Tasmanian honey, handcrafted low-temperature roasted macadamia cookies, and organic Australian herbal teas unavailable in major supermarkets. It\u0027s the ultimate shopping spot if you\u0027re looking for authentic, high-quality Australian gourmet snacks.", "name": "Maloneys Grocer Fine Foods (Maloneys Grocer Surry Hills)", "transport": "Take the light rail to Crown St Station, or take Bus 304 to Crown St at Campbell St Station and walk for 1 minute."}, {"address": "287-289 King St, Newtown NSW 2042", "feature": "\u2b50 4.3 stars | Must-Buy List: Australian wild eucalyptus organic honey, pure natural macadamia nut oil, local herbal skincare lip balms. Situated in Newtown, Dr Earth is a long-established local organic health food and specialty gift store. It offers a vast selection of certified organic health snacks, premium nuts, pure honey, and natural herbal skincare products from Australia. Their wild eucalyptus honey and pure plant-based balms are additive-free and hugely popular among health-conscious locals and savvy travelers\u2014making them ideal healthy souvenirs to bring home for family and friends.", "name": "Dr Earth Organic Food \u0026 Health", "transport": "Take the train to Newtown Station, then walk for about 2 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "19 Roseby St, Drummoyne NSW 2047", "feature": "\u2b50 4.4 stars | Must-Buy List: Nike sneakers, Oroton genuine leather handbags, Kathmandu windproof \u0026 cold-weather jackets. As Sydney\u0027s most iconic waterfront outlet center, it sits right on the bay and features over 120 discount stores of top international and Australian brands. Here, you can snag deals of 30% to 70% off on Australia\u0027s iconic leather brand Oroton and major sports brands. When you get tired of shopping, relax with a coffee and the sea breeze at one of the harbor-view restaurants.", "name": "Birkenhead Point Brand Outlet", "transport": "Take bus 500X or 501 to the Victoria Rd near Park Ave stop, then walk about 5 minutes."}, {"address": "3-5 Underwood Rd, Homebush NSW 2140", "feature": "\u2b50 4.3 stars | Must-Buy List: Calvin Klein classic underwear series, Polo Ralph Lauren embroidered casual shirts, Tommy Hilfiger hoodies. Sydney\u0027s largest and most comprehensive indoor outlet shopping center, spanning two floors packed with international luxury labels and affordable sportswear brands. With huge discount areas, it is a must-visit shopping paradise for bargain hunters looking for clothes, designer bags, and footwear.", "name": "DFO Homebush", "transport": "Take the train from Sydney Central Station to Strathfield Station, then transfer to bus 525 or 526 directly to DFO Homebush."}, {"address": "256 Crown St, Surry Hills NSW 2010", "feature": "\u2b50 4.5 stars | Must-Buy List: Acne Studios wool scarves, Incu in-house brand original T-shirts, Maison Kitsun\u00e9 fox knitwear. Located in the heart of Surry Hills\u0027 fashion district, Incu is a highly influential independent fashion boutique selector in Australia. The store features curated pieces from trendy emerging global designers and high-quality Australian brands. With its minimalist, contemporary interior, it\u0027s the top choice for local fashionistas and youth trendsetters seeking unique personal styles.", "name": "Incu Surry Hills Flagship Store", "transport": "Take light rail line L2 or L3 to Surry Hills stop, then walk about 6 minutes along Crown Street."}, {"address": "323 King St, Newtown NSW 2042", "feature": "\u2b50 4.6 stars | Must-Buy List: Cotton T-shirts by local Australian illustrators, cute animal art print insulated water bottles, original design waterproof canvas bags. This local design brand concept store captures Newtown\u0027s unique hipster and subculture vibe. Partnering with young Australian artists and illustrators, it prints playful, humorous artwork featuring local flora and fauna onto clothing, stationery, and home goods. It\u0027s a great spot to pick up distinctively Sydney souvenirs that you won\u0027t easily see elsewhere.", "name": "Monsterthreads Newtown", "transport": "Take train line T2 or T3 to Newtown Station, exit and walk about 3 minutes along King Street."}, {"address": "503 Crown St, Surry Hills NSW 2010", "feature": "\u2b50 4.5 stars | Must-Buy List: Maison Louis Marie perfume oil rollers, YMC London design tote bags, handcrafted jewelry from niche Australian brands. Founded by a travel and design-loving couple, this independent boutique on Crown Street offers a carefully curated selection of niche designer apparel and lifestyle accessories from Europe, Japan, and Australia. The shop provides a warm, tasteful shopping atmosphere, perfect for finding unique treasures if you want to avoid mass-market chain store fashion.", "name": "The Standard Store Surry Hills", "transport": "Take bus 304 or 352 to Crown St near Albion St stop, then walk about 2 minutes."}, {"address": "317 King St, Newtown NSW 2042", "feature": "\u2b50 4.4 stars | Must-Buy List: 80s vintage American leather jackets, classic pre-owned Levi\u0027s jeans, vintage rock band graphic tees. Newtown is the hub of Sydney\u0027s vintage culture, and Cream on King is a large, wildly popular vintage clothing emporium in the area. Featuring thousands of carefully cleaned and selected pre-loved clothes, leather boots, and accessories\u2014ranging from classic American casual to street punk\u2014it\u0027s a sanctuary for retro fashion lovers.", "name": "Cream on King Newtown", "transport": "Take the train to Newtown Station, exit and walk about 3 minutes along King Street."}, {"address": "134-140 Campbell St, Surry Hills NSW 2010", "feature": "\u2b50 4.7 stars | Must-Buy List: Handcrafted pastel porcelain mugs, minimalist two-tone ceramic plates, natural botanical scented candles. Mud Australia is an internationally acclaimed Australian handcrafted luxury porcelain brand, with its headquarters and studio based in Sydney. Located in Surry Hills, this flagship store showcases the brand\u0027s elegant, romantic, minimalist aesthetic. All porcelain items are handmade by Sydney artisans using pigmented porcelain clay, offering a warm touch and subtle soft hues\u2014making them sophisticated home decor must-haves.", "name": "Mud Australia Surry Hills", "transport": "Take light rail line L2 or L3 to Surry Hills stop, then walk about 5 minutes."}, {"address": "1 Bay St, Glebe NSW 2037", "feature": "\u2b50 4.3 stars | Must-Buy List: Bondi Sands Australian sunscreen, Cotton On casual affordable apparel, Kmart stylish home decor items. Conveniently located near Newtown and Surry Hills, Broadway Shopping Centre is one of Sydney inner-city\u0027s most comprehensive major shopping malls. Housing Australia\u0027s supermarket giants Coles and Woolworths, alongside everyday Australian staples like Kmart, Target, and Cotton On, it\u0027s the ideal spot to experience local everyday shopping, buy Australian beauty essentials, and pick up budget clothing.", "name": "Broadway Shopping Centre", "transport": "About a 12-minute walk from Sydney Central Station, or take bus 422, 423, or 426 to Broadway Shopping Centre stop."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Newtown and Surry Hills"}, "sydney_cbd": {"categories": {"cat_1": {"items": [{"address": "Shop 71, Ground Floor, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-Buy List: Resurrection Aromatique Hand Balm, Protective Lip Balm, Reverence Aromatique Hand Wash. Founded in Melbourne, Aesop is Australia\u0027s proudest luxury botanical skincare brand. The branch inside the Strand Arcade seamlessly blends the classical aesthetic of Australian heritage architecture with the brand\u0027s signature minimalist industrial style. Offering attentive one-on-one skin consultations and testing, its hand balms and body washes exude natural herbal and woody aromas with exceptional texture, making them a top-tier choice for gifts or personal use.", "name": "Aesop Strand Arcade", "transport": "Take the Sydney Light Rail to QVB Station, then walk for about 2 minutes."}, {"address": "249 Pitt St, Sydney NSW 2000", "feature": "\u2b50 4.3 stars | Must-Buy List: Lucas\u0027 Papaw Ointment, Blackmores Vitamin E Cream, Goat Soap Natural Goat Soap. As Australia\u0027s largest discount pharmacy chain, this is a must-visit shopping haven for tourists looking for budget beauty products and supplements. It stocks countless classic Australian brands at highly competitive prices. The versatile Papaw Ointment and the famous Blackmores Vitamin E Cream (popularly known as \u0027Bingbing Cream\u0027) are hot items often bought by the crate, allowing you to pick up all your local Aussie souvenirs in one stop.", "name": "Chemist Warehouse Pitt Street Mall", "transport": "Take the train to Town Hall Station, exit via Pitt Street, and walk for about 3 minutes."}, {"address": "Shop 26-28, Lower Ground Floor, QVB, 455 George St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Rosewater Balancing Mist, Rose Hand Cream, Nutri-Define Supreme Restorative Rich Cream. Originating from pristine farms in Adelaide, South Australia, Jurlique is synonymous with Australian organic botanical skincare. The store inside QVB boasts elegant decor filled with natural floral fragrances. The brand\u0027s signature Rosewater Mist uses organically grown rose extracts for incredible hydrating and soothing effects, while its hand cream offers a rich, non-greasy texture\u2014making it an indispensable local luxury skincare experience in Sydney.", "name": "Jurlique Queen Victoria Building", "transport": "Take the train or Light Rail to Town Hall Station, which connects directly to the QVB underground arcade within a short walk."}, {"address": "Shop 91-93, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.7 stars | Must-Buy List: MECCA COSMETICA To Save Face SPF50+ Sunscreen, MECCA MAX Matte Lipstick, LUMA Illuminating Moisturizer. MECCA is Australia\u0027s premier native beauty boutique chain, often dubbed the Australian version of Sephora. The Strand Arcade location offers a carefully curated selection featuring global hit brands alongside popular house labels MECCA COSMETICA and MECCA MAX, which are beloved by Australian women. In particular, their high-performance sunscreen is lightweight and non-greasy\u2014perfect for the intense Australian sun.", "name": "MECCA Strand Arcade", "transport": "Take the Sydney Light Rail to QVB Station, then walk for about 2 minutes."}, {"address": "Shop 60, Lower Ground Floor, QVB, 455 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-Buy List: Buzz Off Outdoor Spray, Chakra Essential Oil Blends, Organic Lavender Hydrosol. Perfect Potion is a local Australian organic aromatherapy and botanical skincare brand committed to using 100% certified natural ingredients. The shop has a warm, relaxing atmosphere staffed by knowledgeable aromatherapists. The best-selling Buzz Off mosquito spray uses essential oils like lemongrass, delivering a gentle, non-irritating formula essential for Aussie outdoor activities. Their essential oils also make wonderful healing gifts.", "name": "Perfect Potion Queen Victoria Building", "transport": "Take the train to Town Hall Station and connect directly to the QVB underground arcade, then walk for about 2 minutes."}, {"address": "Shop 1, 120 Pitt St, Sydney NSW 2000", "feature": "\u2b50 4.7 stars | Must-Buy List: COSMOS Certified Organic Hand Cream, Rosehip Oil Hydrating Mask, Signature Blend Essential Oil. Founded on the Mornington Peninsula, Endota Spa is Australia\u0027s most iconic domestic spa and organic skincare brand. The Martin Place branch offers luxurious SPA services alongside a full showcase of COSMOS-certified organic skincare products. Featuring native Australian botanical extracts, elegant packaging, and relaxing natural scents, these products are a dream choice for natural beauty enthusiasts.", "name": "Endota Spa Martin Place", "transport": "Take the train to Martin Place Station, then walk for about 2 minutes."}, {"address": "World Square Shopping Centre, Shop 9.02, 644 George St, Sydney NSW 2000", "feature": "\u2b50 4.2 stars | Must-Buy List: Nude by Nature Natural Mineral Cover, Sukin Original Hydrating Mist Toner, Swisse Beauty Collagen Glow Liquid. Priceline is a favorite pharmacy chain among Australian women for beauty and personal care, renowned for affordability and great value. The spacious World Square branch houses many local Aussie organic and budget makeup/skincare brands, such as Nude by Nature (known for non-toxic mineral makeup) and Sukin (focused on minimal natural ingredients)\u2014a fantastic spot to discover affordable Aussie beauty gems.", "name": "Priceline Pharmacy World Square", "transport": "Take the Light Rail to World Square Station, or walk for about 5 minutes from Town Hall Station."}, {"address": "86-108 Castlereagh St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Ultra Violette Queen Screen SPF 50+ Luminising Skinscreen, KORA Organics Noni Glow Face Oil, Ego QV Intensive Cream. As Australia\u0027s oldest upscale department store, David Jones\u0027 Elizabeth Street flagship features a Beauty Hall packed with a complete collection of Australian luxury and indie beauty brands. Here, you can explore KORA Organics (founded by Australian supermodel Miranda Kerr) and global rising sun care star Ultra Violette. Counters offer professional service and tourist tax refund services.", "name": "David Jones Beauty Hall Elizabeth Street", "transport": "Take the train to Museum Station or St James Station, then walk for about 3 minutes."}], "name": "Iconic Local Beauty \u0026 Pharmacy Brands"}, "cat_2": {"items": [{"address": "Shop 112, Level 1, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 Stars | Must-Buy List: Floral silk dresses, romantic lace swimwear, resort-style woven straw bags. Founded by Australian sisters, this renowned luxury resort-wear brand is globally famous for its exquisite lace craftsmanship, romantic floral prints, and precise tailoring. The store in The Strand Arcade exudes refined elegance, making it a must-visit for lovers of high-end Australian designer womenswear.", "name": "Zimmermann (Strand Arcade)", "transport": "Take the light rail to QVB Station, then walk for about 2 minutes."}, {"address": "389 George St, Sydney NSW 2000", "feature": "\u2b50 4.7 Stars | Must-Buy List: Craftsman Chelsea leather boots, reversible genuine leather belts, classic leather conditioner. Founded in 1932, this iconic Australian heritage leather brand is best known for its Chelsea boots handcrafted from a single piece of leather. Durable and full of refined texture, they are a wardrobe staple for locals and business professionals alike. The store offers professional fitting and leather care advice.", "name": "R.M. Williams (George Street)", "transport": "Take the train to Town Hall Station and walk along George St for about 3 minutes."}, {"address": "Shop 2042, Level 2, Westfield Sydney, Market St, Sydney NSW 2000", "feature": "\u2b50 4.3 Stars | Must-Buy List: Bold patterned print dresses, colorful raincoats, artist collaboration knitwear. As one of Australia\u0027s most iconic local streetwear and fashion brands, Gorman is beloved by young locals for its vibrant colors, bold geometric prints, and artist collaborations. Lively and packed with personality, it is perfect for fashion lovers seeking unique, one-of-a-kind statement pieces.", "name": "Gorman (Westfield Sydney)", "transport": "Take the train to Town Hall Station and walk to Westfield Shopping Centre via the underground walkway."}, {"address": "Shop 103, Level 1, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.5 Stars | Must-Buy List: Architecturally tailored dresses, knit cutout tops, boned corset belts. Founded by a top Sydney-born international designer, Dion Lee took the fashion world by storm with its architectural tailoring, avant-garde cutouts, and minimalist, sultry style. The flagship boutique in The Strand Arcade beautifully reflects the brand\u0027s sleek interior design and is highly revered by modern fashion enthusiasts.", "name": "Dion Lee (Strand Arcade)", "transport": "Take the light rail to QVB Station and walk for about 2 minutes."}, {"address": "Shop 108, Level 1, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.4 Stars | Must-Buy List: Sequin party evening gowns, sustainable organic cotton blazers, minimalist metallic clutches. Founded by three sisters, this Australian womenswear brand is committed to sustainable fashion and local production. Its designs blend a strong modern edge with feminine elegance. Whether it\u2019s elevated workwear or glamorous party dresses, it perfectly embodies the sharp, confident style of Sydney women.", "name": "Manning Cartell (Strand Arcade)", "transport": "Take the light rail to QVB Station and enter Level 1 of The Strand Arcade."}, {"address": "Shop 33, Ground Floor, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 Stars | Must-Buy List: Handcrafted leather briefcases, Australian-made wallets, lightweight leather travel folios. Established in 1975, this heritage Australian family-owned leather goods store specializes in high-quality handcrafted leather bags and accessories. The boutique curates works from top local Australian artisans alongside select European leather items. Finely crafted and durable, it is the top choice for Sydney professionals seeking premium leather gear.", "name": "Hunt Leather (Strand Arcade)", "transport": "Take the light rail to QVB Station and walk about 2 minutes to the ground floor of The Strand Arcade."}, {"address": "Shop 88, Level 1, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.5 Stars | Must-Buy List: Premium cashmere knits, casual pure linen shirts, comfortable Modal cotton T-shirts. Originating in Sydney, this minimalist fashion brand is renowned for its premium natural fabrics such as cashmere, linen, and fine cotton. Clean, understated tailoring paired with ultra-comfortable tactile feel perfectly encapsulates Sydney\u2019s laid-back yet effortlessly stylish lifestyle.", "name": "Jac+ Jack (Strand Arcade)", "transport": "Take the light rail to QVB Station and walk for about 2 minutes."}, {"address": "Shop 24, Ground Floor, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 Stars | Must-Buy List: Bohemian print silk kaftans, hand-painted crystal-embellished tunics, printed silk scarves. Founded by Sydney designer Camilla Franks, the brand is renowned for its rich bohemian style, hand-painted artistic prints, and intricate crystal embellishments. Its signature printed silk kaftans are a resort-wear staple for celebrities, radiating vibrant Australian sunshine, beaches, and luxury getaway vibes.", "name": "Camilla (Strand Arcade)", "transport": "Take the light rail to QVB Station and walk about 2 minutes to the Ground Floor of The Strand Arcade."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Shop 1, The Strand Arcade, 412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.7 stars | Must-buy list: Milk Macadamia Chocolates, Chocolate Frogs, Raspberry Dark Chocolate Block. Haigh\u0027s is Australia\u0027s oldest family-owned artisanal chocolate brand, featuring a charming vintage store located inside The Strand Arcade. Their chocolates are made from premium cocoa beans roasted locally in Australia. The Milk Macadamia Chocolate offers a rich, smooth texture with a distinct nutty aroma, making it highly iconic, while the cute Chocolate Frogs are a classic souvenir choice.", "name": "Haigh\u0027s Chocolates Strand Arcade", "transport": "Take the train/metro to Town Hall Station, then walk along George Street for about 5 minutes to reach The Strand Arcade entrance."}, {"address": "Shop 18, Lower Ground, QVB, 455 George St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-buy list: Melbourne Breakfast Tea, Gorgeous Geisha Green Tea, signature tea tasting gift sets. T2 is Australia\u0027s most iconic trendy tea brand, and its QVB store features colorful tea tins and sleek, modern teaware. The Melbourne Breakfast Tea boasts a rich vanilla aroma, perfect for making milk tea, while the Gorgeous Geisha Green Tea blends fruity peach and floral rose notes. Beautifully packaged, it makes a stylish gift for friends and family.", "name": "T2 Tea QVB", "transport": "Take the train/metro to Town Hall Station and follow the underground walkway directly to the QVB Lower Ground arcade."}, {"address": "Shop 60, Ground Floor, QVB, 455 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-buy list: Macadamia Dark Chocolate, Salted Caramel Truffles, Hot Chocolate Powder Gift Sets. Originating from Melbourne, Koko Black specializes in premium artisanal chocolates using high-quality local Australian ingredients. Their Macadamia Dark Chocolate perfectly blends crunchy native macadamia nuts with rich dark chocolate, while the Salted Caramel Truffles offer a delightfully layered flavor. Featuring elegant, high-end packaging, it\u0027s a must-visit for travelers seeking refined sweets.", "name": "Koko Black QVB", "transport": "Take the train/metro to Town Hall Station and walk directly into the Ground Floor shopping area of the QVB."}, {"address": "9-13 Hay St, Haymarket NSW 2000", "feature": "\u2b50 4.2 stars | Must-buy list: Kangaroo leather coin purses, carved wooden boomerangs, koala plush toy sets. Paddy\u0027s Markets is a bargain souvenir and keepsake paradise in downtown Sydney. Home to hundreds of stalls, it offers everything from Indigenous-style boomerangs and kangaroo leather goods to adorable koala keychains. Compared to department stores, the prices here are highly competitive with an extensive variety, making it the ultimate spot for bulk buying and picking out small gifts.", "name": "Paddy\u0027s Markets Haymarket", "transport": "Take the Sydney Light Rail L2 or L3 line to Paddy\u0027s Markets station, then walk about 1 minute upon exiting."}, {"address": "Shop 62, Lower Ground, QVB, 455 George St, Sydney NSW 2000", "feature": "\u2b50 4.8 stars | Must-buy list: Pure Eucalyptus Essential Oil, Relax Lavender Pillow Mist, Tea Tree Balm. Perfect Potion is a renowned Australian certified organic aromatherapy brand dedicated to using pure plant extracts. Their eucalyptus oil is carefully extracted from native Australian leaves, delivering a cooling and soothing effect. The Relax Lavender Pillow Mist is a lifesaver for unwinding while traveling. Their compact, elegant skincare and essential oil sets make wonderful gifts with a distinct Australian touch.", "name": "Perfect Potion QVB", "transport": "Take the train/metro to Town Hall Station and access the QVB Lower Ground store directly via the underground concourse."}, {"address": "1/1 Macquarie Pl, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-buy list: Penfolds Bin 389 Cabernet Shiraz, Hunter Valley Semillon, Four Pillars Gin. Located in downtown Sydney, this premier wine flagship store brings together top wines from across Australian regions. Friendly, professional sommeliers provide expert recommendations. Whether you are looking for world-famous Penfolds wines, unique white wines from the nearby Hunter Valley, or booming Australian craft gins, you can find them all here with complete bubble-wrap and protective packaging services.", "name": "The Australian Wine Centre", "transport": "Take the metro or train to Circular Quay Station, then walk about 3 minutes to arrive."}, {"address": "Cnr Park \u0026 George St, Sydney NSW 2000", "feature": "\u2b50 4.4 stars | Must-buy list: Tim Tam Double Coat Biscuits, Red Rock Deli Sea Salt \u0026 Black Pepper Potato Chips, Lucas\u0027 Papaw Ointment. Located opposite Town Hall, this Woolworths is the ultimate shopping hub for affordable local Australian snacks and everyday essentials. It features a dedicated souvenir section where famous Tim Tam biscuits are frequently on sale. Classic Papaw ointment and Red Rock Deli chips are top choices for bulk buying, offering incredible convenience and a full selection.", "name": "Woolworths Town Hall", "transport": "Take the train/metro to Town Hall Station and exit via George Street directly to the store entrance."}, {"address": "Shop 26, Ground Floor, The Galeries, 500 George St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-buy list: Signature Strawberry Watermelon Cake, Lemon Meringue Tart, house-roasted specialty coffee beans. A famous Sydney bakery that took the world by storm with its world-renowned Strawberry Watermelon Cake. At the CBD store, besides tasting the cake infused with fresh watermelon and delicate rose aroma, you can also purchase beautifully packaged house-roasted specialty coffee beans and limited-edition merchandise\u2014a delicious souvenir experience you shouldn\u0027t miss when visiting Sydney.", "name": "Black Star Pastry CBD", "transport": "Take the train/metro to Town Hall Station and walk 2 minutes via The Galeries shopping center connection."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "455 George St, Sydney NSW 2000", "feature": "\u2b50 4.7 stars | Must-Buy List: Haigh\u0027s Chocolates premium handmade chocolates, Royal Doulton bone china tableware, Kookai local quality womenswear. Built in 1898, the Queen Victoria Building (QVB) is Sydney\u0027s most iconic Romanesque Revival historic building, featuring magnificent stained glass windows, classic arches, and two giant Royal Clocks. Not only a historic landmark, it is also a premier luxury shopping destination for locals and tourists alike, featuring a curated selection of high-end Australian brands and unique independent boutiques.", "name": "Queen Victoria Building (QVB)", "transport": "Take the Sydney Train to Town Hall Station or take the Sydney Light Rail to QVB Station."}, {"address": "412-414 George St, Sydney NSW 2000", "feature": "\u2b50 4.6 stars | Must-Buy List: R.M. Williams handcrafted leather boots, Dion Lee designer womenswear, Aesop botanical skincare. Located next to Pitt Street Mall, The Strand Arcade opened in 1891 and is Sydney\u0027s only remaining original Victorian-era shopping arcade. Housing top Australian independent designer brands, high-end jewelry stores, and traditional bespoke tailors, it exudes a rich vintage British charm, making it the best place to find unique Australian designer clothing and high-quality leather goods.", "name": "The Strand Arcade", "transport": "Take the train to Town Hall Station or St James Station and walk about 5 minutes."}, {"address": "86-108 Castlereagh St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Jurlique rose hand cream, Glasshouse Fragrances scented candles, Sass \u0026 Bide local designer apparel. David Jones is Australia\u0027s oldest department store. Its flagship store on Elizabeth Street has undergone a multi-million-dollar renovation, showcasing an ultra-luxurious shopping space. Bringing together world-class luxury brands, Australia\u0027s most comprehensive selection of skincare and fashion, plus a high-end underground food hall, it is a favorite among Sydney trendsetters.", "name": "David Jones Elizabeth Street Flagship", "transport": "Take the train to St James Station (2-minute walk) or Town Hall Station (4-minute walk)."}, {"address": "19 Roseby St, Drummoyne NSW 2047", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted Oroton fine leather bags, Bonds local breathable cotton underwear, Peter Alexander discounted fun sleepwear. Situated on Sydney Harbour, Birkenhead Point is the closest and most popular brand outlet to the city center, featuring over 140 discount brand stores. The highlight here is getting 30% to 70% off iconic Australian luxury leather goods brand Oroton, Bonds, and major international sportswear brands, all while enjoying panoramic harbor marina views as you shop.", "name": "Birkenhead Point Brand Outlet", "transport": "Take bus 500X or 501 from Town Hall in the city center (approx. 15 minutes), or take the Shopper Hopper ferry directly from Circular Quay."}, {"address": "436 George St, Sydney NSW 2000", "feature": "\u2b50 4.3 stars | Must-Buy List: Lucas\u0027 Papaw Ointment value sets, Country Road local casual lifestyle wear, T2 signature Australian organic teas. Myer is Australia\u0027s largest department store chain, and its multi-story flagship store in Sydney CBD offers an exceptionally rich array of merchandise. In addition to various international beauty brands, it is the best destination for purchasing Australian lifestyle goods, local fashion brands (such as Country Road, Manning Cartell), and specialty tea gift sets, widely favored by local families and tourists.", "name": "Myer Sydney Flagship", "transport": "Take the train to Town Hall Station and enter directly via the underground concourse."}, {"address": "3-5 Underwood Rd, Homebush NSW 2140", "feature": "\u2b50 4.3 stars | Must-Buy List: UGG Australia local sheepskin boots, Cotton On discounted casual wear, Coach discounted designer leather goods. DFO Homebush is Sydney\u0027s largest factory outlet with the most complete brand offering, featuring nearly 100 domestic and international fashion and sports brands. Aside from incredible shopping discounts (often up to 80% off), it is a shopping paradise for tourists seeking high-quality Australian-made UGG sheepskin boots and affordable trendy apparel.", "name": "DFO Homebush Outlet", "transport": "Take the train from Sydney Central Station to Strathfield Station, then transfer to bus 525 or 526."}, {"address": "Corner Pitt St Mall and Market St, Sydney NSW 2000", "feature": "\u2b50 4.5 stars | Must-Buy List: Zimmermann romantic Australian resort dresses, Mecca Cosmetica exclusive beauty sets, Camilla printed silk resort wear. Located in the heart of Sydney CBD and directly connected to Sydney Tower, Westfield Sydney is a modern shopping center bringing together top international luxury goods and Australia\u0027s most iconic designer brands. The dedicated sections for Australian beauty and fashion designers are highly recommended for acquiring top-tier local designs all in one place.", "name": "Westfield Sydney", "transport": "Take the train to Town Hall Station or St James Station, walking about 3 minutes to the Pitt Street Mall precinct."}, {"address": "197 Pitt St, Sydney NSW 2000", "feature": "\u2b50 4.2 stars | Must-Buy List: Culture Kings exclusive streetwear caps and apparel, Witchery minimalist Australian urban womenswear, General Pants Co. trendy denim. Nestled between George Street and Pitt Street Mall, MidCity is the ultimate shopping hub for Sydney\u0027s youth and streetwear enthusiasts. It houses Australia\u0027s largest Culture Kings flagship store\u2014complete with live DJs and exclusive drops\u2014making it the perfect place to immerse yourself in Sydney\u0027s local street style culture.", "name": "MidCity Shopping Centre", "transport": "Take the train to Town Hall Station (4-minute walk) or the light rail to QVB Station (2-minute walk)."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Sydney City Centre and Shopping District"}};
        const cityName = "Sydney";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
