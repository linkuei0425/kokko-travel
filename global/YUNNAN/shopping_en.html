an Baiyao Herbal Sheet Mask, Tibetan Herbal Foot Bath Soaks, Herbal Soothing Balm. Yixingtang is Yunnan\u0027s largest local pharmacy chain. The Dukezong flagship store features a dedicated section showcasing Yunnan Baiyao Group\u0027s Chinese herbal moisturizing masks and local Tibetan beauty products, offering guaranteed quality and transparent prices.", "name": "Yixingtang Pharmacy Dukezong Flagship Store", "transport": "Take Shangri-La Bus Line 1 to Xiangbala Square Station, then walk about 100 meters."}, {"address": "No. 18 Chicika Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buys: Alpine Snow Lotus Brightening Mask, Saffron Lip Balm, Tibetan Herbal Aromatherapy Body Oil. This independent cosmetics shop blends local Shangri-La Tibetan cultural elements with modern skincare concepts. The products feature exquisite traditional Tibetan-style packaging, making them both highly practical and great as travel souvenirs or gifts.", "name": "Sacred Land Tibetan Herbal Beauty Shop", "transport": "Walk to Moonlight Square in Dukezong Ancient Town, then walk about 150 meters along Chicika Street."}, {"address": "No. 42 Heping Road, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buys: Matsutake Radiance Serum, Alpine Green Tea Soothing Gel, Plateau Sea Buckthorn Hand Cream. A local beauty shop focusing on extracts from plants unique to the Yunnan plateau, it cleverly uses rare natural ingredients like matsutake mushrooms and alpine sea buckthorn to formulate skincare. The products have fine textures and showcase authentic Shangri-La charm.", "name": "Shangri-La Alpine Botanical Cosmetics", "transport": "Take Bus Line 3 and get off at Heping Lu Zhongduan (Middle Section of Heping Road) Station, then walk a short distance."}], "name": "Local Signature Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 32 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Traditional Pulu shawls, handcrafted Tibetan embroidered robes, Pulu wool handbags. Helmmed by experienced local Tibetan tailors, this shop is famous for its handwoven Pulu fabrics rich in Shangri-La flair. All garments use natural wool dyeing and hand-weaving techniques, seamlessly blending the spacious grandiosity of traditional Tibetan attire with modern everyday wear habits. Highly popular among tourists seeking unique local style clothing.", "name": "Kawagebo Tibetan Garment Workshop", "transport": "Take Shangri-La Bus Route 1 to Ancient Town Parking Lot Station, then walk for about 5 minutes."}, {"address": "No. 15 Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Colorful ethnic woven crossbody bags, plateau felt boots, leather-stitched Tibetan embroidered backpacks. This cozy, handcrafted footwear and bag specialty shop is run by Ah-Jia, who combines traditional Tibetan woven stripes with modern practical bag designs. The woven shoes feature breathable yet warm plateau wool, while the bags offer durability and striking visual uniqueness\u2014making it a highly recommended creative shopping spot for young travelers in the ancient town.", "name": "Ah-Jia Handwoven Shoes \u0026 Bags Studio", "transport": "Take Shangri-La Bus Route 3 to Beimen Bus Station, then walk for about 3 minutes."}, {"address": "No. 68 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Tibetan Pulu cashmere scarves, handwoven Pulu coats, colorful yarn fabric bags. Pulu is an iconic handwoven woolen fabric of Yunnan\u0027s Tibetan region, and this gallery is dedicated to preserving and promoting this intangible cultural heritage. By refining the traditionally heavier Pulu into lightweight, trendy modern coats and scarves, they offer superb cold-weather protection combined with an aura of high-end ethnic luxury.", "name": "Shangri-La Pulu Handcrafted Fabrics \u0026 Apparel", "transport": "Walk to Moonlight Square in Dukezong Ancient Town, then head toward Cangfang Street for about 200 meters."}, {"address": "No. 8, West Side of Moonlight Square, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Handcrafted engraved cowhide crossbody bags, Tibetan silver clasp wallets, Pulu-stitched totes. This studio perfectly combines rugged plateau yak leather with intricate Tibetan silver carving craftsmanship. Every bag in the store is entirely hand-stitched and polished. Over time, the leather develops a natural vintage patina that, paired with unique decorative Tibetan silver buckles, showcases a captivating blend of plateau ruggedness and refined artisanal charm.", "name": "Zangyun Leather \u0026 Silver Artisanal Bags", "transport": "Take Shangri-La Bus Route 1 or 2 to Moonlight Square Station, then walk for 1 minute."}, {"address": "No. 45 Chilang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Fleece-lined Tibetan embroidered hoodies, Tibetan totem windbreakers, cargo-style embroidered jogger pants. Highly recommended by local young Tibetans, this trendy streetwear brand fuses American workwear aesthetics with ancient Tibetan calligraphy and the Eight Auspicious Symbols. The thick, windproof, and warm fabrics are perfectly tailored for plateau climate wear while being exceptionally photo-worthy for social media.", "name": "Snowland Eagle Tibetan Streetwear", "transport": "Walk about 400 meters from the Giant Prayer Wheel at Guishan Temple in Dukezong Ancient Town."}, {"address": "No. 1, Block A, Commercial Street, Ganden Sumtseling Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Luxurious yak cashmere shawls, handcrafted embroidered knee-high leather boots, elegant ethnic suede bags. Located in the commercial area surrounding the Ganden Sumtseling Monastery scenic area, this shop specializes in top-tier plateau yak cashmere and goat cashmere products. Yak cashmere provides greater warmth than standard wool and boasts an extraordinarily soft texture. The handcrafted boots and suede bags are infused with rich Tibetan Esoteric Buddhist artistic elements, offering superior quality and high collectible value.", "name": "Songtsam Handcrafted Cashmere \u0026 Footwear", "transport": "Take Shangri-La Bus Route 3 directly to Sumtseling Monastery Scenic Area Station, then walk through the Visitor Center commercial area."}, {"address": "No. 12 Pijiangpo, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Modified luxurious Tibetan maxi dresses, woven Tibetan pattern headpieces, embroidered ankle boots. As one of the largest ethnic clothing boutiques in the ancient town, this gallery not only provides high-end Tibetan costume photo rental services but also designs and sells modified everyday Tibetan women\u0027s clothing, footwear, and bags. The exquisitely crafted embroidered ankle boots and woven headpieces make it a premier destination for women looking for distinctive apparel in Shangri-La.", "name": "Blue Moon Valley Ethnic Attire \u0026 Accessories", "transport": "Walk about 3 minutes from Sifang Street in Dukezong Ancient Town."}, {"address": "No. 28 Yajie Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Handmade Tibetan leather boots, vintage cowhide briefcases, artisanal waist bags. Owned by a third-generation Tibetan leather craftsman, this studio insists on using traditional vegetable-tanned leather and hand-stitching to craft both traditional boots and modern leather accessories. Specially designed to be cold-proof, waterproof, and ideal for high-altitude mountain walking, these boots earn high praise from travelers for their durability and rugged style.", "name": "Plateau Fashion Leather \u0026 Footwear Studio", "transport": "Take Shangri-La Bus Route 2 to Ancient Town South Gate Station, then walk for about 6 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 32 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Air-dried yak jerky, handmade highland barley shortbread, extra-rich butter tea bags. A long-established local specialty shop located near Sifang Street in Dukezong Ancient Town, beloved by local Tibetan residents and tourists alike. The shop strictly selects high-altitude Shangri-La yak meat, using traditional Tibetan air-drying and spice-marinating techniques. The beef jerky is rich, aromatic, and chewy; the highland barley shortbread is crispy and delicious. Paired with extra-rich butter tea bags, it\u0027s the best souvenir to bring home and relive authentic Tibetan flavors.", "name": "Amama Tibetan Specialty Shop", "transport": "Take Shangri-La Bus Line 1 to the Ancient Town Parking Lot Stop, then walk for about 5 minutes."}, {"address": "No. 68 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Plateau saffron, dried wild matsutake slices, alpine black wolfberries. An authoritative shop specializing in precious high-altitude medicinal herbs and mountain treasures from Diqing Tibetan Autonomous Prefecture. All products are harvested from snow-capped mountains above 3,000 meters in altitude. The saffron stigmas are vibrant red and of supreme quality; the dried matsutake slices yield a rich, flavorful broth when steeped. The shop owners carefully explain the brewing, stewing, and therapeutic uses of Tibetan herbs to customers.", "name": "Kawagebo Tibetan Herbal Shop", "transport": "Take Shangri-La Bus Line 3 to Moonlight Square Stop, then walk for about 3 minutes."}, {"address": "No. 15 Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Nixi black pottery earthenware pots, hand-carved Tibetan wooden bowls, lacquered teacups. Nixi black pottery crafting techniques are listed as a National Intangible Cultural Heritage. This workshop specializes in black pottery and wooden vessels handcrafted by master artisans. Black pottery pots preserve the original flavors of ingredients when cooking, while the handmade wooden bowls are coated with natural lacquer and intricately carved with Tibetan patterns\u2014offering both high practical utility and artistic collectible value.", "name": "Nixi Black Pottery \u0026 Tibetan Woodcraft Shop", "transport": "Take Shangri-La Bus Line 1 to Beimen Street Intersection Stop, then walk for about 2 minutes."}, {"address": "No. 24 Chilangshuo Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Hand-painted miniature Thangka pendants, natural herbal Tibetan handmade incense, turquoise silver jewelry. Tucked away in an alley of the ancient town, this art workshop features resident local artists demonstrating exquisite Thangka painting techniques on-site. Visitors can purchase delicate miniature hand-painted Thangka charms as personal protective amulets. The shop\u0027s custom natural herbal incense is ground from various alpine herbs, exuding a serene cypress aroma when burned.", "name": "Snowland Thangka Art \u0026 Craft Workshop", "transport": "Take Shangri-La Bus Line 3 to Moonlight Square Stop, then walk along the ancient town\u0027s cobblestone path for about 6 minutes."}, {"address": "No. 18 Pijiangpo, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Craft highland barley beer, yak milk candy, high-fiber highland barley biscuits. A gift brand store that modernizes and creatively packages Shangri-La\u0027s traditional crop, highland barley. The store\u0027s top-rated craft highland barley beer features a unique, refreshing malt flavor, while the yak milk candy is rich and non-sticky. The product packaging blends modern fashion with traditional Tibetan elements, making it a top choice for gifts to younger friends and family.", "name": "Highland Barley Specialty Center", "transport": "Take Shangri-La Bus Line 1 to Ancient Town South Gate Stop, then walk for about 4 minutes."}, {"address": "No. 88 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Pure hand-woven yak wool shawls, patterned Tibetan scarves, handmade wool felt bags. A textile specialty shop where products are handcrafted by local Tibetan women in Shangri-La, strictly selecting high-altitude yak wool and sheep wool as raw materials. The woven products offer exceptional cold resistance and a soft, cozy feel. The shawl designs incorporate traditional Tibetan geometric totems and vibrant colors, seamlessly combining warmth with stylish aesthetics for photos.", "name": "Jixiang Tibetan Weaving Workshop", "transport": "Take Shangri-La Bus Line 1 to Ancient Town Parking Lot Stop, then walk for about 6 minutes."}, {"address": "Cultural Shop beside the Main Hall, Songzanlin Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Songzanlin Monastery-blessed Vajra knots, holy handmade cypress incense, Bodhi seed prayer beads. Located inside the Ganden Sumtseling Monastery scenic area, this cultural shop offers various auspicious artifacts and gifts blessed by temple prayers. The handmade cypress incense offers a pure, calming fragrance, while carrying a blessed Vajra knot symbolizes safety and auspiciousness\u2014making these meaningful souvenirs after visiting this \u0027Little Potala Palace\u0027.", "name": "Songzanlin Monastery Cultural \u0026 Incense Shop", "transport": "Take Shangri-La Bus Line 3 directly to the terminus at Songzanlin Monastery, then walk into the main hall area of the temple."}, {"address": "No. 102 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Highland multi-flower honey, dried morel mushrooms, wild boletus mushrooms. Partnering directly with local Tibetan farmers around Shangri-La, this shop gathers wild mountain delicacies from high-altitude, pollution-free forests. The alpine honey features fine crystallization with a subtle wildflower aroma, while the dried morels and boletus mushrooms are deeply aromatic and of superior quality\u2014making them premium ingredients for brewing nourishing chicken soup and gourmet dishes back home.", "name": "Snow Mountain Honey \u0026 Wild Mushroom Shop", "transport": "Take Shangri-La Bus Line 3 to Moonlight Square Stop, then walk for about 5 minutes."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "No. 1 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Tibetan medicine/incense sachets, Nimu handmade incense sticks, dried wild Matsutake \u0026 mushrooms packs. Dukezong Flower Alley is the most iconic comprehensive commercial plaza in the ancient town, blending Tibetan architectural aesthetics with a modern shopping experience. It brings together numerous local original design brands from Yunnan as well as workshops of traditional intangible cultural heritage artisans. Visitors can buy the most authentic Tibetan incense and dried wild mushrooms in a spacious and comfortable environment, making it a must-visit shopping landmark in Dukezong Ancient Town.", "name": "Dukezong Flower Alley Commercial Plaza", "transport": "From downtown Shangri-La, take Mini-Bus Line 1 or Line 3, get off at \u0027Dukezong Ancient Town Station\u0027, and walk for about 3 minutes."}, {"address": "Near the intersection of Changzheng Avenue and Huancheng East Road, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Hand-painted mini Thangkas, Tibetan silver Ghau box jewelry, traditional handmade wool felt hats. This outlet center focuses on Tibetan handicrafts and cultural creations from Diqing Prefecture, offering high-quality Tibetan art products at factory-direct and wholesale discount prices. The venue features a live creation area for Thangka artists, allowing customers to acquire exquisite hand-painted Thangkas and various Tibetan silver jewelry at 30% to 50% off traditional retail prices. It is a top treasure-hunting spot for savvy travelers.", "name": "Shangri-La Thangka Art \u0026 Crafts Outlet Center", "transport": "Take Shangri-La Bus Line 2 to \u0027Changzheng Avenue East Station\u0027, then walk for about 5 minutes."}, {"address": "No. 188 Kangzhu Avenue, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Dried wild plateau Matsutake slices, saffron gift boxes, yak milk cheese sticks. This is the largest specialty plateau discount outlet mall in Shangri-La, bringing together dozens of well-known agricultural and local specialty brands from across the prefecture. Offering direct factory discount prices without middleman markups, it is a great value for purchasing high-quality dried Matsutake slices, wild mushrooms, saffron, and other souvenirs. With officially certified quality, it is highly favored by both tourists and locals.", "name": "Shangri-La Plateau Specialty Outlet Mall", "transport": "It is recommended to take a taxi (about a 10-minute drive from Dukezong Ancient Town) or take Bus Line 1 to \u0027Prefectural Hospital Station\u0027 and walk for 7 minutes."}, {"address": "No. 238 Changzheng Road, next to Tancheng Square, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Yunnan plateau yak beef jerky, hand-woven Tibetan scarves, plateau snow tea. Times Square is one of the largest modern comprehensive shopping centers in downtown Shangri-La, featuring large chain supermarkets and local brand counters on the top and underground floors. Perfectly combining modern trendy fashion with local Yunnan souvenirs, it is an excellent spot to stock up on plateau travel gear and pick up authentic delicacies like yak jerky.", "name": "Shangri-La Times Square", "transport": "Take Shangri-La Bus Line 1, 3, or 5 to \u0027Tancheng Square Station\u0027, and you will arrive immediately."}, {"address": "No. 45 Heping Road, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Traditional handmade Tibetan clothing, yak wool shawls, hand-crafted Tibetan wooden bowls. The Nationalities Trading Department Store is a historic, state-owned style department store in Shangri-La that has served as a central place for local Tibetan residents to purchase daily necessities and traditional attire for decades. Brimming with authentic local life, you can buy genuine handmade yak wool blankets, Tibetan robes, and wooden bowls here at reasonable prices with authentic designs, reflecting a unique ethnic character.", "name": "Shangri-La Nationalities Trading Department Store", "transport": "Walk about 12 minutes from Moonlight Plaza in Dukezong Ancient Town, or take Bus Line 1 to \u0027Nationalities Trading Department Store Station\u0027."}, {"address": "Zone B, Tourist Center Commercial Street, Songzanlin Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Songzanlin Temple blessed prayer bead bracelets, handmade Tibetan copper bells, plant-dyed Tibetan cloth handbags. Located in the commercial area outside the Songzanlin Monastery scenic area, this cultural outlet is operated by a local cultural cooperative, specializing in creative art products and traditional handicrafts related to Tibetan Buddhist culture. Most items offer scenic area discount prices, featuring exquisite quality and rich symbolic blessings, making it the top choice for picking up cultural souvenirs after visiting Songzanlin Monastery.", "name": "Songzanlin Tibetan Cultural Creative Outlet", "transport": "Take Bus Line 3 from downtown Shangri-La directly to \u0027Songzanlin Monastery Scenic Area Terminal Station\u0027, then walk inside the Tourist Center Commercial Street."}, {"address": "No. 99 Chicika Street, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.1 stars | Must-Buy List: Handmade Tibetan copper teapots, high-altitude outdoor cold-proof clothing, handmade plateau botanical soaps. Jinzuo Shopping Plaza is a comprehensive mall combining shopping, dining, and leisure, housing many local Yunnan outdoor brands and plateau craft shops. Tailored to the plateau climate, the cold-proof functional clothing in the mall offers great value, and shoppers can also find exquisite handmade copperware and local artisan soaps, meeting all one-stop shopping needs.", "name": "Jinzuo Shopping Plaza", "transport": "Walk about 8 minutes from the North Gate of Dukezong Ancient Town, or take Bus Line 2 to \u0027Chicika Street Station\u0027."}, {"address": "Intersection of Kangzhu Avenue and Changzheng Avenue, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.0 stars | Must-Buy List: Shangri-La plateau red wine, black highland barley biscuits, Shangri-La highland barley beer. Better One is a well-known local large supermarket shopping mall in Diqing Prefecture, famous for its rich selection of plateau foods and local specialty sections. Prices are affordable and clearly labeled; tourists can conveniently purchase locally produced highland barley beer, plateau red wine, and various Tibetan snack foods all in one place, making it a sanctuary for bulk specialty shopping before returning home.", "name": "Better One Shopping Mall", "transport": "Take Bus Line 1 or Line 4 to \u0027Kangzhu Avenue Station\u0027, and walk for about 2 minutes."}], "name": "Shopping Malls \u0026 Outlets"}}, "name": "Shangri-La Dukezong and Songzanlin Monastery"}, "tengchong_heshun": {"categories": {"cat_1": {"items": [{"address": "No. 12 Shuitou Lane, Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Caiziji Alpine Botanical Facial Mask, Yunnan Baiyao Steam Eye Mask, Caiziji Freeze-Dried Powder Essence. Yunnan Baiyao is Yunnan\u0027s most iconic century-old pharmaceutical brand. This flagship store combines traditional Chinese herbal tech with modern cosmeceuticals in a classic, elegant setting. Tourists love the Caiziji mask series, made entirely from Yunnan alpine plant extracts without preservatives\u2014extremely sensitive-skin friendly. A top-tier pharmacy choice for both gifts and personal use.", "name": "Yunnan Baiyao Flagship Experience Store (Heshun Ancient Town)", "transport": "Walk into Heshun Ancient Town Scenic Area; easily accessible near Shuitou Lane."}, {"address": "No. A3, Shopping Plaza, Visitor Center, Hot Sea Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Deep Cleansing Volcanic Hot Spring Mud Mask, Hot Sea Metasilicic Acid Hot Spring Hydrating Spray, Volcanic Ash Particle Exfoliating Handmade Soap. Harnessing Tengchong\u0027s unique volcanic hot spring geology, this store transforms mineral-rich volcanic mud and hot spring water into skincare products. The mud mask effectively absorbs pore impurities, while the spring water spray quickly soothes and calms the skin. Highly unique and effective, it\u0027s a must-visit local specialty skincare spot in Tengchong.", "name": "Tengchong Volcanic \u0026 Hot Sea Mineral Skincare Flagship Store", "transport": "Take Tengchong Bus Route 2 to Rehai Scenic Area Station, then walk into the Shopping Plaza."}, {"address": "No. 22 Lijia Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Dendrobium Orchid Youth Preserving Essence Serum, Purple Ganoderma Anti-Wrinkle \u0026 Firming Cream, Gaoligong Mountain Camellia Body Oil. DR.PLANT focuses on Yunnan alpine plant skincare, co-developed with the Kunming Institute of Botany, Chinese Academy of Sciences. The store is fresh and comfortable, offering free skin tests and product trials. The Dendrobium Orchid series is immensely popular for its refreshing texture and deep hydration, showcasing the charm of Yunnan\u0027s herbal beauty tech.", "name": "DR.PLANT Alpine Botanical Cosmetics Store (Heshun Ancient Town Branch)", "transport": "Walkable within Heshun Ancient Town."}, {"address": "No. 18 Liujia Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Cold-Pressed Wild Camellia Seed Carrier Oil, Plateau Gaoligong Cedar Compound Essential Oil, Handmade Pressed Wild Rose Lip Balm. A charming boutique aromatherapy shop in the ancient town focused on wild plant extracts from the Gaoligong Mountain Nature Reserve. They use low-temperature cold-pressing for camellia oil, which is deeply moisturizing yet non-greasy\u2014loved by clean beauty fans. The shop also offers DIY experiences for custom essential oil blending and lipstick crafting.", "name": "Gaoligong Herbal Aromatherapy \u0026 Handmade Cosmetics Workshop", "transport": "About an 8-minute walk within Heshun Ancient Town Scenic Area."}, {"address": "Next to Jia Clan Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Yunnan Olive Radiance Repair Hand Cream, Herbal Soothing Foot Bath Essential Oil Packs, Universal Ziyun Repair Ointment. Baicaotang evolved from a traditional herbal apothecary into a modern botanical beauty shop. It utilizes unique local Yunnan medicinal ingredients\u2014such as Yunnan olive, Panax notoginseng, and Paris polyphylla\u2014to formulate natural skincare. The olive hand cream is rich in Vitamin C for excellent skin repair, while the foot bath packs are perfect for relaxing legs after hot spring baths.", "name": "Heshun Baicaotang Dian Herbal Skincare Shop", "transport": "Walk along the main street of Heshun Ancient Town to the Jia Clan Ancestral Hall."}, {"address": "No. 68 Cunjiawan, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Tengchong Volcanic Ash Deep Purifying Handmade Soap, Dian Hong Tea Polyphenol Antioxidant Lip Balm, Alpine Honeysuckle Soothing Hydrosol. A cozy independent craft beauty studio loved by hipsters. The owner combines Tengchong\u0027s natural volcanic ash with famous Yunnan teas and botanicals to craft additive-free products. The volcanic ash soap offers deep cleansing without drying, while the naturally tinted Dian Hong black tea lip balm provides moisture and a healthy glow\u2014a warm, handcrafted gift to take home.", "name": "Suxin Herbal Handmade Cosmetics Studio", "transport": "Walkable within the Cunjiawan area of Heshun Ancient Town."}, {"address": "Zone B, 1F, Century Golden Resources Shopping Center, Tengyue Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Panax Notoginseng Revitalizing \u0026 Firming Serum, Paris Polyphylla Anti-Acne Repair Gel, Sweet Wormwood Soothing Lotion. Dian Cao Liu Wei is a modern local cosmeceutical brand extracting active ingredients from traditional Yunnan herbs like Notoginseng, Paris polyphylla, and Dendrobium. The Paris polyphylla acne gel is super effective for soothing skin sensitivities caused by temperature changes and breakouts, making it a popular item for tourists to stock up on.", "name": "Dian Cao Liu Wei Herbal Beauty Store (Tengchong Century Golden Resources Branch)", "transport": "Take Tengchong Bus Route 6 or 11 to Century Golden Resources Shopping Center Station."}, {"address": "No. 1 Wild Duck Lake Shore, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Alpine Rose Hydrating Petal Toner, Mohong Rose Essential Oil Mask, Yunnan Snow Lotus Ultimate Repair Cream. Leveraging Yunnan\u0027s reputation as a Kingdom of Flowers, Huayu Diannan specializes in botanical floral skincare. Designed like a cozy indoor garden, the store displays rose and snow lotus skincare ranges. The Rose Petal Toner contains visible real petals, leaving skin hydrated, radiant, and gently scented\u2014an iconic store representing Yunnan\u0027s floral beauty aesthetic.", "name": "Huayu Diannan Botanical Cosmetics Flagship Store", "transport": "Walk along the Wild Duck Lake lakeside trail in Heshun Ancient Town."}], "name": "Local Signature Beauty \u0026 Cosmetics Stores"}, "cat_2": {"items": [{"address": "No. 45 Shuitang Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade botanical indigo-dyed scarves, ancient town printed canvas bags, ethnic linen maxi dresses. Tucked away in the alleys of Heshun Ancient Town, this craft studio adheres to traditional plant-based indigo dyeing methods. Every piece of clothing and handbag features a unique blue-and-white gradient pattern. Filled with a soothing natural herbal scent, it is a favorite spot among trendy travelers seeking stylish handmade bags and scarves that look stunning in photos.", "name": "Heshun Indigo Dye \u0026 Handmade Cloth Studio", "transport": "Take Tengchong Bus Route 6 to Heshun Ancient Town Station, then walk for about 8 minutes."}, {"address": "Group 9, Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Tengchong hand-woven rattan handbags, handmade straw sandals, retro bamboo backpacks. Boasting a rich history of rattan weaving, Tengchong\u0027s traditional Yunnan craftsmanship is seamlessly blended into modern shoe and bag designs here. The hand-woven totes are sturdy yet lightweight, while the breathable straw sandals are a summer essential for strolling through the ancient town or visiting hot springs.", "name": "Tengchong Rattan \u0026 Straw Woven Crafts", "transport": "Walkable within Heshun Ancient Town, located near Heshun Library."}, {"address": "Near Liu Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Hand-embroidered multi-layered sole cloth shoes, ethnic soft-soled slippers, vintage frog-button shoes. Carrying on generations of western Yunnan shoemaking heritage, this workshop specializes in pure cotton hand-stitched multi-layered sole cloth shoes. Breathable, sweat-absorbent, and incredibly comfortable, they are perfect for walking along Heshun\u0027s cobblestone streets. The exquisite hand-embroidered ethnic patterns beautifully merge tradition with contemporary aesthetic trends.", "name": "Frontier Town Handmade Cloth Shoes", "transport": "Walkable within Heshun Ancient Town Scenic Area."}, {"address": "Next to Cun Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Vintage vegetable-tanned leather handbags, caravan-style genuine leather ankle boots, handmade leather belts. Inspired by the ancient Tea Horse Road caravan culture, this shop uses carefully selected premium cowhide to handcraft shoes and leather goods. The leather bags are sturdy and develop a beautiful patina over time, while the caravan boots are durable with a rugged appeal\u2014a hidden gem for lovers of vintage heritage and workwear aesthetics.", "name": "West Yunnan Caravan Leather Workshop", "transport": "Walkable within Heshun Ancient Town Scenic Area."}, {"address": "Inside Jia Ancestral Hall Alley, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade Achang brocade shawls, unique ethnic vests, brocade patchwork backpacks. Located near Achang ethnic settlements, this shop features vibrant, uniquely patterned Achang brocade products. By applying traditional weaving techniques to modern clothing and shoulder bags, they offer durable items rich in symbolic blessings\u2014a high-quality apparel boutique showcasing authentic Yunnan heritage.", "name": "Achang Brocade \u0026 Modern Apparel", "transport": "About a 10-minute walk from the entrance of Heshun Ancient Town Scenic Area."}, {"address": "No. 2 Dashu Yamiao Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Zen-style loose cotton-linen maxi dresses, traditional slant-front/double-breasted tops, portable cotton-linen tote bags. Focusing on natural, comfy, Zen-inspired linen apparel, the color palette centers around earth tones, deep plant-dyed greens, and indigo. The soft, breathable texture is ideal for Tengchong\u0027s spring-like plateau climate, making it the top wardrobe choice for travelers pursuing a slow-paced lifestyle.", "name": "Tengchong Cotton \u0026 Linen Apparel Studio", "transport": "Walkable within Heshun Ancient Town."}, {"address": "Shop B-03, Entrance Service Area, Volcanic Thermal Sea Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Non-slip waterproof hot spring slippers, lightweight waterproof tote bags, casual sun-protection shawls/jackets. Situated near the Tengchong Volcanic Thermal Sea Scenic Area, this store provides essential gear for hot spring bathing and outdoor excursions. Offering durable anti-slip rubber shoes and sleek waterproof organizer bags, it is the perfect spot to gear up before visiting the Thermal Sea area.", "name": "Hot Sea Springs Resort Footwear \u0026 Bags", "transport": "Take Tengchong Bus Route 2 to Rehai Scenic Area Terminus, then walk for about 2 minutes."}, {"address": "No. 12 Lijia Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Jade clasp ethnic totes, leather-patchwork embroidered bags, delicate tassel crossbody bags. Combining Tengchong\u0027s famous jade elements with traditional ethnic textile art, these bags feature genuine local jade accents on clasps or zipper pulls, complemented by tassels and unique hand-embroidered patterns. This stylish crossover design makes their handbags a popular choice for gifts or memorable personal keepsakes.", "name": "Jade Edge Ethnic Handmade Bags", "transport": "Walkable within Heshun Ancient Town."}], "name": "Popular Local Apparel, Footwear \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Handmade Pine Pollen Cakes, Red Bean Pine Pollen Pastries, Tengchong Wild Honey. A highly representative time-honored bakery in Heshun Ancient Town. Using wild Masson pine pollen from Gaoligong Mountain and red bean paste, these cakes are steamed to produce a soft, dense texture that is sweet without being cloying, accompanied by a subtle pine aroma. It is the most popular traditional ancient-method pastry in the area.", "name": "Heshun Zhang\u0027s Pine Pollen Cake Shop", "transport": "Walkable within Heshun Ancient Town Scenic Area, near the Liu Family Ancestral Hall"}, {"address": "Gaoligong Mountain Tea Expo Garden, Qixiong National Highway, Northern Suburbs of Tengyue Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Gaoligong Mountain Organic Green Tea, Ecological Pu\u0027er Tea Cakes, Camellia Seed Skincare Oil. Located at the foot of Gaoligong Mountain, this specialty shop offers an immersive tea culture experience. Featuring carefully selected leaves from high-altitude organic tea gardens, the brewed tea is clear with a sweet finish. Skincare products and tea oil pressed from local tea seeds are also very popular gifts.", "name": "Gaoligong Mountain Tea Expo Garden Shop", "transport": "Take Tengchong Bus Route 6 to Chaboyuan (Tea Expo Garden) Station"}, {"address": "Next to Cun Family Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Cun Family Handmade Snow Silver Tea Sets, Jadeite Ping\u0027an Kou (Peace Buckles), Burmese Jadeite Bangles. Tengchong is renowned as the \u0027First City of Jadeite.\u0027 The Cun family has inherited silver-smithing and jade-inlay craftsmanship for centuries. All silver items are handcrafted with high purity and paired with natural jadeite carvings, making them valuable local treasures for collectors and gift-givers.", "name": "Heshun Cun\u0027s Jade \u0026 Silver Workshop", "transport": "Walk to the Cun Family Ancestral Hall area in Heshun Ancient Town"}, {"address": "Inside the Visitor Center, Rehai Scenic Area, Qingshui Township, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Volcanic Hot Spring Mineral Soap, Rehai Spring Hydrating Facial Mist, Volcanic Mud Deep Cleansing Mask. A beauty shop featuring skincare products crafted from the unique volcanic minerals and natural geothermal resources of Tengchong Rehai (Thermal Sea). These skin-friendly items are rich in trace elements, making them exclusive must-buy souvenirs after visiting the Rehai Scenic Area.", "name": "Tengchong Rehai Volcanic Hot Spring Beauty Shop", "transport": "Take Tengchong Bus Route 2 directly to the Rehai Scenic Area Terminal, then walk to the Visitor Center"}, {"address": "By Yeya Lake, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Hand-woven Rattan Handbags, Folk Woven Tea Coasters, Compact Rattan Cutlery Caddies. Tengchong\u0027s rattan weaving craft has a long history. Made from high-quality wild rattan harvested from Gaoligong Mountain, each item is entirely hand-woven through multiple steps. Durable with a charming western Yunnan rustic feel, these products are widely loved by hipsters and lifestyle decor enthusiasts.", "name": "Heshun Bamboo \u0026 Rattan Craft Shop", "transport": "Walk along the shore of Yeya (Wild Duck) Lake in Heshun Ancient Town"}, {"address": "No. 12 Dajiangjun Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Spicy Cured Air-Dried Beef (Ganba), Dry Tengchong Handmade Ersi Rice Noodles, Canned Fried Wild Ganba Mushrooms. A flagship souvenir store specializing in western Yunnan and Tengchong delicacies. Featuring air-dried beef made from local high-mountain yellow cattle and the famous local Ersi, it allows visitors to relive authentic Tengchong flavors at home.", "name": "Yunwei Ji Tengchong Local Food Specialty Store", "transport": "Walk into Dajiangjun Lane in Heshun Ancient Town"}, {"address": "No. 1 Amber Street, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Natural Fossil Amber (Inclusion) Pendants, Blood Amber Bracelets, Silver-Set Amber Brooches. Bordering Myanmar, Tengchong has historically been the main distribution center for Burmese amber. The shop offers genuine natural Burmese amber certified by authoritative institutions, featuring warm textures and rich colors, making them highly memorable keepsakes.", "name": "Tengchong Amber \u0026 Gem Pavilion", "transport": "Walk to the entrance of Amber Street in Heshun Ancient Town"}, {"address": "Near Yuanlong Pavilion, Shuidui Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Hand-Painted Floral Oil-Paper Umbrellas, Mini Decorative Bamboo Umbrellas, Classical Tung Oil Bamboo Fans. Originating from the century-old umbrella-making craft of Yingyang Village in Tengchong, these umbrellas are handcrafted using bark paper, tung oil, and natural bamboo. Hand-painted with traditional motifs like plum blossoms, orchids, bamboo, chrysanthemums, or Heshun scenery, they serve as both practical rainwear and elegant Oriental handicrafts.", "name": "Yingyang Traditional Oil-Paper Umbrella Heshun Branch", "transport": "Walk to the Shuidui Scenic Area in Heshun Ancient Town"}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 1 Century Golden Resources Avenue, Tengyue Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted international brand sneakers, discounted Tengchong jade jewelry, Yunnan Pu\u0027er tea gift boxes. As the largest outlet center in Tengchong, it brings together past-season outlet stores for internationally renowned sportswear brands like Nike and Adidas, with discounts as low as 70% off. The mall also features special sale zones for local Yunnan crafts and jewelry, allowing visitors to purchase exquisite jade and local gift boxes at incredible values\u2014a fantastic spot to stock up and score designer bargains.", "name": "Tengchong Century Golden Resources Outlet Mall", "transport": "Take Tengchong Bus Route 6 or 13 to Century Square Station, then walk for about 2 minutes."}, {"address": "No. 1 Century Golden Resources Avenue, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Yunnan herbal moisturizing hand cream, local dried wild mushroom gift boxes, traditional brown sugar blocks. This is the most modern comprehensive department store in downtown Tengchong, featuring a large supermarket chain, movie theater, and brand apparel. For tourists, the \u0027Yunnan Specialty Zone\u0027 on the first floor and inside the supermarket offers an extremely comprehensive selection\u2014from skincare products to local agricultural specialties\u2014in a bright and comfortable shopping environment.", "name": "Tengchong Century Golden Resources Shopping Center", "transport": "Take Tengchong Bus Route 6 directly to Century Golden Resources Shopping Center Station."}, {"address": "Next to Ai Siqi\u0027s Former Residence, Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Natural jadeite bangles, Burmese jade carving pendants, border amber rings. Located in the heart of Heshun Ancient Town, this is an iconic independent jewelry department store. Known historically as the \u0027First Town of Jadeite\u0027, Tengchong\u0027s reputation shines here\u2014all gemstones come with official national inspection certificates, featuring transparent pricing and exquisite craftsmanship, making it a favorite for jade lovers visiting the ancient town.", "name": "Heshun Jade Craft Department Store", "transport": "About a 10-minute walk from the main entrance of Heshun Ancient Town Scenic Area."}, {"address": "Intersection of Rehai Road and Feicui Road, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: High-ice jadeite pendants, Huanglong jade tea set ornaments, specialty amber bracelets. A large commercial mall bringing together hundreds of local Tengchong jade workshops and homegrown retail brands, reflecting Tengchong\u0027s long history of border trade. Beyond high-end gemstone jewelry, there are budget-friendly trinkets, making it a hub to experience Tengchong\u0027s jade culture and pick up local handcrafted souvenirs.", "name": "Tengchong Jade City Shopping Plaza", "transport": "Take Tengchong Bus Route 2 or 4 and get off at Jade City Station."}, {"address": "No. 12 Shuitang Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Hand-woven rattan chairs, hand-woven rattan picnic bags, exquisite rattan tea coasters. Inheriting centuries-old Tengchong traditional rattan weaving techniques, this is the most famous independent local craft shop in Heshun Ancient Town. All products are hand-woven by local master artisans using high-quality local vines. Tough, breathable, and boasting a rustic charm, this shop is an iconic local lifestyle goods store.", "name": "Heshun Zhang Family Rattan Craft Shop", "transport": "Stroll through Heshun Ancient Town to Shuitang Lane to reach the shop."}, {"address": "Near the Liu Family Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Traditionally handmade Xuan paper, hand-painted oil-paper umbrellas, plant-dyed cotton and linen scarves. A local specialty shop dedicated to promoting and selling Tengchong\u0027s national intangible cultural heritage\u2014\u0027Jietou Traditional Handmade Xuan Paper\u0027\u2014and related handicrafts. The paper here is resilient and famously long-lasting; the shop has developed it into Four Treasures of the Study gift sets and modern creative cultural merchandise, brimming with cultural heritage and collectible value.", "name": "Tengchong Jietou Xuan Paper \u0026 Crafts Shop", "transport": "About a 5-minute walk from the Ancestral Hall Area in Heshun Ancient Town."}, {"address": "No. 168 Feicui Road, Tengyue Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Burmese blood amber necklaces, natural insect amber display stones, handmade amber essential oil soaps. Adjacent to Myanmar, Tengchong is one of Southeast Asia\u0027s largest distribution hubs for amber. This flagship store specializes in high-quality natural Burmese amber, offering everything from priceless collector-grade carvings to accessible amber skincare products and accessories, highly regarded for its top quality.", "name": "Tengchong Amber Pavilion Flagship Store", "transport": "Take Tengchong Bus Route 1 to Feicui Intersection Station, then walk for about 3 minutes."}, {"address": "Shopping Area next to the Visitor Center, Volcanic Geothermal \u0026 Thermal Sea Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: High-mountain volcanic Oolong tea gift boxes, Heshun earthen pot specialty seasoning packs, Tengchong sliced pork special sauce. A comprehensive specialty shopping mall located on the outskirts of the Volcanic Geothermal \u0026 Thermal Sea Scenic Area, featuring unique teas nurtured by Tengchong\u0027s geothermal climate and local delicacies. The store offers one-stop tasting samples and on-site packaging and shipping services, making it super convenient for travelers to take home authentic Tengchong flavors.", "name": "Tengchong Thermal Sea Specialty \u0026 Tea Mall", "transport": "Take the Tengchong Thermal Sea Scenic Area Express Bus to the terminal stop at the Visitor Center."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Tengchong Heshun Ancient Town and Volcanic Thermal Sea"}, "xishuangbanna_gaozhuang": {"categories": {"cat_1": {"items": [{"address": "No. 101, Building 5, Jingliang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Dai Herbal Anti-Mosquito Balm, Snake Gallbladder Antibacterial Ointment, Dai Herbal Moisturizing Cream. Dai Yao Tang is a highly representative traditional Dai pharmacy that has been deeply rooted in Xishuangbanna for many years. Its best-selling anti-mosquito balm is brewed with pure natural lemongrass and secret herbal recipes, making it perfect for mosquito prevention and relief in tropical regions. The snake gallbladder antibacterial ointment is loved by those struggling with skin issues in hot, humid climates. Preserving authentic Dai medicinal concepts while integrating traditional herbs with modern cosmetics, it attracts many savvy tourists looking to stock up.", "name": "Dai Yao Tang Herbal Pharmacy", "transport": "Take Jinghong City Bus Line 4 to Gaozhuang Xishuangjing Station, then walk for about 5 minutes."}, {"address": "1st Floor, Building 12, Jingkuang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Dianhong Kangwang Lotion, Yunnan Baiyao Band-Aids, Dai Panax Notoginseng Essence Cream. Yixintang is Yunnan Province\u0027s largest local chain pharmacy and cosmetics retailer. Its Gaozhuang Xishuangjing branch features a dedicated zone for Xishuangbanna specialties and Dai herbal skincare. Tourists can buy the full line of Yunnan Baiyao herbal cosmetics and unique local repair creams all in one place. With professional service and guaranteed authentic products, its self-branded and exclusive plant-based skincare lines offer great value for money, making it a convenient choice when visiting Jinghong.", "name": "Yixintang Pharmacy Gaozhuang Branch", "transport": "Take a sightseeing electric cart within Gaozhuang directly to Jingkuang Village, or walk about 8 minutes from the main gate of Gaozhuang."}, {"address": "No. 102, Area A, Commercial Street, Water Splashing Square, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Miracle Botanical Facial Sheet Masks, Toothpaste Repair Gift Set, Panax Notoginseng Herbal Body Oil. As Yunnan\u0027s most iconic heritage domestic brand, Yunnan Baiyao established this flagship store at Water Splashing Square in Jinghong, integrating beauty, skincare, and wellness experiences. The flagship line of all-plant \u0027Miracle Botanical\u0027 facial masks utilizes advanced freeze-drying technology to preserve the active ingredients of Yunnan\u0027s alpine plants\u2014additive-free and intensely soothing. Featuring an elegant and upscale ambience, free skin testing, and herbal product sampling on-site, it is the top choice for purchasing high-end local Yunnan beauty gifts.", "name": "Yunnan Baiyao Flagship Experience Store", "transport": "Take Bus Line 1 or Line 2 to Water Splashing Square Station, and walk a short distance."}, {"address": "No. 28, Main Street of Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Thai Mistine Sunscreen, Traditional Dai Lemongrass Essential Oil, Natural Aloe Vera Soothing Gel. Combining traditional Xishuangbanna Dai herbal oils with tropical sun protection cosmetics imported from neighboring Thailand, this boutique is a unique beauty shop in the Gaozhuang Night Market area. It offers a wide variety of tropical sunscreens and after-sun repair products, especially its house-made traditional lemongrass essential oil, which smells pleasant while providing excellent mosquito repellent and soothing benefits. Waterproof and sweatproof Thai makeup imported directly is also a must-buy for ladies before doing Dai costume photoshoot experiences.", "name": "Gaozhuang Dai-Thai Cosmetics Impression Store", "transport": "Located in the core area of the Starlight Night Market; visible right behind the Shwedagon Pagoda market stall area."}, {"address": "No. 15 Menghai Road, Jiangbei Subdistrict, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Green Herbal Balm, Yunnan Pu\u0027er Tea Polyphenol Sheet Mask, Plant Antibacterial Spray. Jianzhijia is a famous large pharmacy and drugstore chain in Yunnan that combines medicines with cosmeceuticals. The Jinghong branch specifically introduces many masks and skincare items extracted from Yunnan\u0027s authentic herbs like Pu\u0027er tea polyphenols and wild Dendrobium orchid. The herbal balm sold here is highly effective for insect bites and skin itching in tropical climates, while the tea polyphenol masks offer excellent antioxidant benefits, highly favored by ingredient-conscious tourists. Prices are clearly labeled, with frequent discounts.", "name": "Jianzhijia Pharmacy Jinghong Branch", "transport": "Take Bus Line 3 to Jiangbei Farmers Market Station, then walk for about 3 minutes."}, {"address": "Shop 108, 1st Floor, Peacock City, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Dai Style Face Paint Cream, Coconut Oil Highlighter Balm, Dai Fragrance Hydrating Setting Spray. This studio is a favorite insider shopping spot for local photographers and makeup artists in Gaozhuang Xishuangjing, specializing in long-lasting and ethnic-style makeup suitable for Xishuangbanna\u0027s hot and humid climate. Its custom-formulated face paint cream features rich pigments that are waterproof and sweatproof, perfect for Dai costume photoshoots. The coconut oil highlighter balm is made from locally cold-pressed coconut oil, creating a natural tropical dewy look, making it hugely popular among young female tourists.", "name": "Starlight Night Market Dai Color Cosmetics Studio", "transport": "Walk to the Gaozhuang Peacock City Commercial Area and take the elevator/escalator to the 1st-floor commercial street."}, {"address": "Shop 1055, 1st Floor, Wanda Plaza, Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Dai Orchid Anti-Aging Serum, Wild Honey Lip Mask, Natural Agarwood Solid Perfume. Rainforest Botanical is an original local beauty brand leveraging Xishuangbanna\u0027s rich tropical plant resources. Collaborating with local botanical research institutes, it develops pure natural skincare formulated with local Dendrobium orchid, tropical wild honey, and agarwood. The orchid serum delivers extraordinary hydration and firming effects with a refreshing, non-sticky texture, while the agarwood solid perfume boasts a uniquely elegant and long-lasting aroma\u2014a creative cultural cosmetic item showcasing the essence of Xishuangbanna\u0027s rainforest.", "name": "Rainforest Botanical Beauty Shop", "transport": "Take City Bus Line 7 to Wanda Plaza Station, enter the first floor of the mall to locate it."}, {"address": "No. 12 Folklore Street, Baixiang Lake Park, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Dai Secret Soothing Green Herbal Balm, Tropical Wild Plantain Hydrating Cream, Turmeric Brightening Body Scrub. Located in downtown Jinghong, this center specializes in promoting skincare products derived from Dai medicine, one of Yunnan\u0027s four major ethnic traditional medicines. Products are developed according to the balance theory of the four Dai medicinal elements (Wind, Fire, Water, Earth). The plantain hydrating cream deeply locks in moisture and is excellent for after-sun care, while the turmeric scrub gently exfoliates and brightens skin complexion. Visitors can buy authentic Dai herbal cosmetics here and also experience traditional Dai herbal aromatherapy and hand care treatments.", "name": "Jinghong Dai Medicine \u0026 Skincare Center", "transport": "Take City Bus Line 5 to Baixiang Lake Station, then walk about 200 meters along the lakeside."}], "name": "Local Signature Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "Building 13, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Hand-embroidered Dai tube skirts, signature Dai brocade shoulder bags, exquisite metal waist chains. Highly representative of Gaozhuang Xishuangjing, this specialty boutique offers traditional Dai attire alongside modern tailored ethnic clothing. Featuring premium fabrics and meticulous embroidery, it is a favorite spot for travelers seeking high-quality outfits for photo shoots and resort vacations.", "name": "Dai Li Dai Ethnic Clothing Workshop", "transport": "Take the Gaozhuang Scenic Area sightseeing tram, get off at Jingliang Zhai, and walk for about 2 minutes."}, {"address": "Inside Starlight Night Market Commercial Area, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Handwoven straw/rattan bags, Dai brocade embroidered tote bags, ethnic wide-brim rattan hats. Specializing in traditional Xishuangbanna Dai brocade and handwoven bamboo/rattan bags, all items are meticulously crafted by local Dai women. Each bag features unique patterns and color schemes, combining practical utility with rich Southeast Asian ethnic flair, making it a hit among bohemian art lovers.", "name": "Dai Impression Handwoven Crafts \u0026 Bags", "transport": "Take Jinghong Bus Route 1 to Gaozhuang Xishuangjing Station, then walk into the heart of Starlight Night Market."}, {"address": "No. 102 Xuanwei Avenue (near Water Splashing Square), Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Modern slim-fit Dai cropped blouses, Hani embroidered jackets, Blang brocade shawls. Seamlessly blending traditional ethnic motifs (Dai, Hani) and tailoring with modern fashion, this local original brand offers figure-flattering cuts and highly breathable fabrics, making it a well-known local fashion staple in Xishuangbanna.", "name": "Nanda Traditional Ethnic Garments Flagship Store", "transport": "Take Jinghong Bus Route 2 or 4 to Water Splashing Square Station, then walk about 300 meters."}, {"address": "Building 2, Jingkuang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-carved genuine leather sandals, ethnic embroidered leather crossbody bags, handcrafted leather slippers. Featuring handcrafted leather footwear and accessories that combine tropical Southeast Asian style with local ethnic patterns. Each item is hand-polished and stitched using soft, breathable leather, offering comfortable wear perfectly suited for the tropical rainforest climate.", "name": "Rainforest Leather \u0026 Shoe Workshop", "transport": "Take the internal Gaozhuang Scenic Area electric shuttle car to Jingkuang Zhai Station."}, {"address": "Next to the intersection of Jingde Road and Menghai Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Plant-dyed linen long dresses, ethnic printed wide-leg pants, handwoven hemp rope shoes. Located in the bustling downtown area of Jinghong, this boutique features natural plant-dyed, high-quality pure cotton and linen apparel. With a fresh and elegant design aesthetic that balances tropical Banna resort vibes with everyday wearability, it is tremendously popular among female shoppers.", "name": "Dai Style Linen \u0026 Cotton Boutique", "transport": "Take Jinghong Bus Route 3 to Jingde Road Intersection Station, then walk 150 meters."}, {"address": "Next to Gaozhuang Scenic Area Entrance, Binjiang Main Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Traditional Dai bridal filigree headwear, embroidered trim jackets, handcrafted beaded ethnic bags. Specializing in traditional attire and heavy handcrafted silver tassel accessories of the Dai and Jino ethnic groups. It is a go-to shop for both tourists and travel photo studios seeking authentic ethnic accessories and exquisite gowns, boasting a remarkably rich inventory.", "name": "Lancang River Ethnic Jewelry \u0026 Garment Shop", "transport": "Take Jinghong Bus Route 1 or the Garden Shuttle Line to Gaozhuang Main Gate Station."}, {"address": "50 meters west of Manting Park Entrance, Manting Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Resort-style handcrafted tassel sandals, Dai brocade patchwork tote bags, printed sun-protection oversized shawls. Located right next to Manting Park, this store curates handmade footwear and clothing from several independent local designers in Banna. Highlight items combine traditional Dai brocade fabrics with trendy cloth bags and casual shoes, offering great artistic flair and souvenir value.", "name": "Manting Town Original Clothing \u0026 Handcrafted Shoes", "transport": "Take Jinghong Bus Route 3 directly to Manting Park Station, then walk for about 1 minute."}, {"address": "First Row Shops, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Dai-style embroidered cloth shoes, spacious Southeast Asian straw totes, beaded beach sandals. A top-rated brick-and-mortar stall inside Gaozhuang Starlight Night Market, famous for its varied and affordable ethnic embroidered shoes and woven straw bags. High quality and overflowing with tropical resort vibes, it\u0027s an ideal spot for gifts, shoes, and bag accessories.", "name": "Gaozhuang Handcrafted Straw Bags \u0026 Embroidered Shoes Shop", "transport": "Take the complimentary Gaozhuang Scenic Area shuttle vehicle directly to the entrance of Starlight Night Market."}], "name": "Popular Local Clothing, Shoes \u0026 Bag Stores"}, "cat_3": {"items": [{"address": "Building 1, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy items: Tamarind cake (tamarind pie), Wild passion fruit cake, Yunnan specialty fruit strips. Maoduoli is a highly iconic time-honored local brand in Xishuangbanna. Using premium tamarinds, they craft sweet, sour, chewy, non-sticky tamarind cakes. Decorated in vibrant Dai style, this flagship store offers exclusive flavors and exquisite gift boxes, making it an essential snack stop for souvenirs before leaving Banna.", "name": "Maoduoli Souvenir Flagship Store", "transport": "Take the Gaozhuang sightseeing shuttle to Jingliang Zhai, or walk about 5 minutes from Starlight Night Market."}, {"address": "No. 8, Jingkuang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy items: Dai-style hand-shredded beef jerky (Ganba), Lemongrass grilled fish seasoning packs, Banna handmade bamboo rice grain packs. Dedicated to preserving authentic Dai flavors, this store carefully selects local yellow cattle beef to make chewy jerky infused with aromatic spices. They have also transformed hard-to-transport specialty Dai dishes into vacuum-sealed packs and custom spice mixes, letting tourists easily recreate Dai flavors at home.", "name": "Dai Wei Yuan Sheng \u00b7 Xishuangbanna Specialty Store", "transport": "Walk behind the Shwedagon Pagoda in Gaozhuang Xishuangjing and enter the Jingkuang Zhai block."}, {"address": "Jingfa Zhai, Peacock Avenue, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-buy items: Xishuangbanna ancient tree raw Pu\u0027er tea cakes, Rainforest black tea mini Tuocha, Dai paper-wrapped specialty tea gifts. As Xishuangbanna is one of the origins of tea trees in the world, the Rainforest Ancient Tree Tea brand is dedicated to protecting and promoting deep-mountain ancient tea trees. The store features a charming antique ambiance with professional tea-tasting services. Their tea cakes wrapped in classic handmade Dai cotton paper preserve traditional craftsmanship while displaying rich ethnic flavor, making them top-tier gifts for elders or tea enthusiasts.", "name": "Rainforest Ancient Tree Tea \u00b7 Gaozhuang Experience Center", "transport": "Take a Jinghong city bus to the Gaozhuang Xishuangjing Main Gate and walk for about 3 minutes."}, {"address": "No. 102, Main Street, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy items: Freeze-dried jackfruit, Pure handmade dried mangoes, Passion fruit concentrate. A highly popular local tropical fruit gift shop in Jinghong, this store refrains from excessive preservatives to preserve the authentic flavors of Xishuangbanna\u0027s tropical fruits. The top-selling freeze-dried jackfruit is delightfully crispy, while the handmade dried mango offers thick, naturally sweet and sour flesh. Wrapped in vibrant Dai pattern packaging, these treats are perfect for sharing with family and friends.", "name": "Dai Guo Fang \u00b7 Tropical Dried Fruit Souvenirs", "transport": "Located directly in the core area of Gaozhuang Starlight Night Market, easily accessible on foot."}, {"address": "Next to Water Splashing Square, No. 118 Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy items: High-altitude Arabica coffee beans, Coffee blossom honey, Cold brew concentrate packs. The high-altitude mountains of Xishuangbanna are ideal for growing premium Arabica coffee (small granule coffee). This experience center gathers selected coffee beans from across Banna\u0027s producing regions. Professional baristas brew and explain the coffees on-site. Visitors can purchase freshly roasted beans featuring tropical fruit and nutty notes, as well as unique coffee blossom honey. Exquisitely packaged, it is a must-buy souvenir representing modern Yunnan coffee culture.", "name": "Yunnan Arabica Coffee Experience Center", "transport": "Take Jinghong City Bus Route 1 or 2 to Water Splashing Square Station, then walk for about 200 meters."}, {"address": "Intersection of Menghai Road and Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-buy items: Canned wild oil-fried boletus mushrooms, Crispy matsutake chips, Dai-style Nanmi dipping sauce seasoning. Yunnan is famous for wild mushrooms, and this specialty gift shop in downtown Jinghong focuses on Banna mountain delicacies and Dai condiments. The must-buy canned boletus is rich and fragrant whether tossed with noodles or used in stir-fries. They also offer specially formulated Dai dipping powder, allowing visitors to easily recreate Banna\u0027s appetizing sour and spicy night market flavors at home.", "name": "Impression Banna \u00b7 Mountain Delicacies \u0026 Specialties", "transport": "Take the bus to Menghai Road Intersection Station and walk about 150 meters."}, {"address": "Room 101, Building 2, Jingdai Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy items: Dai sticky rice crispy candy (Paoba), Banana chips, Traditional Dai brown sugar cakes. Dai Xiang Yuan is a deeply established local food producer in Xishuangbanna, specializing in traditional Dai snacks and pastries. Their crispy sticky rice candy is delightfully crunchy with rich rice and coconut aromas, while the banana chips are made from local dwarf bananas, offering a perfectly balanced sweetness. Reasonably priced and generously portioned, they offer authentic local charm.", "name": "Dai Xiang Yuan \u00b7 Local Specialty Flagship Store", "transport": "Located inside Gaozhuang Xishuangjing; recommended to take the Gaozhuang sightseeing tram and get off at Jingdai Zhai Station."}, {"address": "No. 35 Manting Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province (Near the exit of Manting Park)", "feature": "\u2b50 4.7 stars | Must-buy items: Macadamia nuts in Dai brocade packaging, Dai brocade cultural snack packs, Traditional brown sugar ginger tea. Located near the exit of Manting Park\u2014an iconic attraction in Jinghong\u2014this cultural souvenir store blends intangible heritage Dai brocade art with local specialties. The locally grown macadamia nuts are highly recommended for their rich, buttery crunch. The elegant packaging features geometric Dai brocade designs, making them wonderfully high-quality gifts and keepsakes.", "name": "Manting Park \u00b7 Dai Cultural \u0026 Creative Souvenir Shop", "transport": "Take Jinghong City Bus Route 3 to Manting Park Station and walk straight to the park exit."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "Inside Sunac Xishuangbanna Resort, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Dai-inspired cultural \u0026 creative jewelry, dried Yunnan wild mushrooms, and Yunnan small-arabica coffee beans. Sunac Mall is one of the largest and newest comprehensive shopping centers in Jinghong City, featuring trendy fashion, specialty dining, a cinema, and a large supermarket. The architecture uniquely combines traditional Dai stilt-house roofs with modern steel structures, reflecting strong local heritage. Besides international brands, the basement supermarket and cultural creative section showcase high-quality local agricultural specialties and unique handmade goods\u2014making it a top-tier choice for rainy days or escaping the afternoon heat.", "name": "Sunac Mall Jinghong", "transport": "Take Jinghong Bus Route 2 or 3 to Sunac Mall Station, or take a taxi from Gaozhuang Xishuangjing (approx. 15 minutes)."}, {"address": "Near the intersection of Xuanwei Avenue and Menghai Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Discounted past-season Nike sneakers, Adidas casual wear, and Dai-style printed summer resort shirts. This is one of the most popular outlet centers in downtown Jinghong, Xishuangbanna, featuring steep discounts on major international sports and casual brands. Offering year-round discounts ranging from 30% to 70% off, it\u0027s ideal for stocking up on outdoor gear or lightweight clothing before heading out to tropical rainforest attractions. Alongside top international labels, it also hosts curated local Yunnan activewear counters, making it a favorite shopping haunt for value-seeking tourists and local youth.", "name": "Capital Outlets Jinghong Plaza", "transport": "Take Bus Route 1 or 4 to Water Splashing Square Station, then walk for about 3 minutes."}, {"address": "No. 76 Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Maoduoli tamarind cake, handwoven Dai rattan bags, and mini Pu\u0027er tea cakes. Located in the traditional heart of Jinghong City, Water Splashing Square Shopping Mall is a classic landmark shopping department store. Brimming with vibrant local everyday atmosphere, the basement supermarket is the ultimate spot to buy regional specialties at transparent and affordable prices. The second and third floors feature numerous summer apparel and ethnic accessory boutiques designed by local Yunnan creators, highly favored by travelers looking to experience local culture and pick up souvenirs.", "name": "Water Splashing Square Shopping Mall", "transport": "Take Bus Route 1, 2, or 4 directly to Water Splashing Square Station."}, {"address": "Cultural \u0026 Creative District behind Jinghong Golden Pagoda, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Handwritten Dai-script blessing Bodhi leaves, handmade Dai brocade embroidered bags, and essential oil aromatherapy candles. This cultural department store embodies the landmark charm of Gaozhuang Xishuangjing, themed around Dai spiritual traditions and Golden Pagoda culture. The store carefully selects original works crafted by local Xishuangbanna artisans, ranging from plant-dyed textiles and exquisite Dai brocade accessories to herbal home fragrances infused with tropical scents. Combining Southeast Asian pagoda aesthetics with modern minimalist design, it stands out as the most elegant, representative local independent shop in the Gaozhuang business district.", "name": "Gaozhuang Pagoda Cultural \u0026 Creative Department Store", "transport": "Walk approximately 5 minutes from the main gate of Gaozhuang Xishuangjing to Golden Pagoda Square."}, {"address": "No. 2 Menghai Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.2 stars | Must-Buy List: Local Yunnan skincare cosmetics, Dai herbal plant shampoos, and dried tropical fruits. New Century Plaza is a classic department store in downtown Jinghong that has grown alongside generations of locals. The mall hosts a wide array of local Yunnan beauty and lifestyle brands, especially skincare products featuring Dai herbal extracts, which are immensely popular with female shoppers. While the building holds a sense of history, its wide product variety and budget-friendly prices offer an authentic glimpse into the daily shopping life of Xishuangbanna residents.", "name": "New Century Shopping Plaza", "transport": "Take Bus Route 1 or 3 to New Century Plaza Station."}, {"address": "Room 101, Building 12, Jingxing Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Hand-dyed Dai tube skirts (sinh), hand-carved tropical ivory nut jewelry, and aromatic Dai bamboo rice boxes. This shop is a hallmark local boutique in Gaozhuang Xishuangjing, specializing in the crossover between traditional Dai craftsmanship and contemporary fashion. The store owner collaborates directly with artisans across various Dai villages in Xishuangbanna, offering unique hand-dyed cotton-linen apparel, woodcarving art, and natural woven bamboo containers. Every item boasts distinct textures and handmade warmth, making it a treasure trove for travelers seeking authentic, non-generic souvenirs.", "name": "Dai Village Market \u0026 Fashion Store", "transport": "Located within the Gaozhuang Xishuangjing scenic area; recommended to walk through the main strip of the Starlight Night Market."}, {"address": "No. 1 Wanda Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Yunnan local brand Pu\u0027er tea gift sets, Xishuangbanna lemongrass essential oil, and ethnic-style designer straw hats. This modern, large-scale commercial complex brings together dining, entertainment, and brand shopping under one roof. The mall features a dedicated \u0027Banna Intangible Cultural Heritage District,\u0027 bringing in award-winning local independent design brands and traditional local legacy shops. Visitors can comfortably shop in an air-conditioned environment while browsing premium Pu\u0027er teas, aromatic oils, and island-style tropical resort fashion.", "name": "Wanda Plaza Xishuangbanna", "transport": "Take Bus Route 7 or 10 to Wanda Plaza Station, or take a taxi (approx. 10 minutes)."}, {"address": "Inside Manting Town, next to Manting Park, Manting Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Dai herbal botanical hydrating masks, handmade herbal essential oil soaps, and retro Dai woven tote baskets. Located near the famous Manting Park, this independent lifestyle shop blends traditional Xishuangbanna botanical crafts with modern cosmetics. The store\u0027s in-house brand highlights skincare products infused with tropical botanical extracts (such as water lily, lemongrass, and Dai medicinal herbs), completely free of synthetic fragrances. It also sells beautifully designed handwoven bags and bamboo household items in an elegant, cozy setting\u2014attracting many design enthusiasts and natural skincare lovers.", "name": "Mantingshicheng Dai Lifestyle \u0026 Cosmetics Store", "transport": "Take Bus Route 3 to Manting Park Station, then walk approximately 200 meters."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Gaozhuang Xishuangjing and Jinghong, Xishuangbanna"}, "yulong_shuhe": {"categories": {"cat_1": {"items": [{"address": "No. 15 Qinglong Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Alpine Snow Lotus Repair Cream, Rhodiola Antioxidant Essence, Handmade Tibetan Herbal Anti-Chapping Ointment. Located inside Shuhe Ancient Town, this long-established pharmacy and skincare shop combines local Yunnan herbs with Tibetan medicinal culture to craft skincare specifically designed for dry plateau conditions and intense UV radiation. Their Snow Lotus Repair Cream combines pure snow mountain water with wild snow lotus extract, offering exceptional hydration and restorative power. Extremely popular among snow mountain visitors, it\u0027s the ultimate souvenir to combat high-altitude climate conditions.", "name": "Shuhe Baicaotang Herbal Skincare \u0026 Pharmacy", "transport": "Take Lijiang Bus No. 6 to Shuhe Ancient Town Station, then walk about 5 minutes."}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Notoginseng Deep Cleansing Soap, Dendrobium High-Moisture Gel, Yunnan Paris Polyphylla Anti-Acne Cream. Diancao Liuwei is a well-known local Yunnan beauty brand derived from authentic herbs, infusing precious Chinese medicinal ingredients unique to Yunnan\u2014like Panax Notoginseng and Dendrobium\u2014into daily skincare. The handcrafted soap leaves skin moisturized without feeling tight, while the Dendrobium gel is a lifesaver for soothing post-sun skin in summer. Free from added synthetic fragrances, it demonstrates the purest power of botanical ingredients.", "name": "Diancao Liuwei Herbal Cosmetics", "transport": "Walk for about 8 minutes from the South Gate entrance of Shuhe Ancient Town."}, {"address": "Intersection of Jiuding Longtan, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Yunnan Baiyao Ca Zhiji Botanical Facial Masks, Herbal Steam Eye Masks, Notoginseng Firming \u0026 Anti-Wrinkle Hand Cream. As Yunnan\u0027s most iconic century-old pharmaceutical brand, this experience store translates traditional Chinese medicine health concepts into stylish beauty and cosmeceutical products. The Ca Zhiji pure plant-extract facial masks contain no preservatives and deliver remarkable deep repair results; the warm eye masks feature a subtle Yunnan black tea fragrance to ease travel fatigue. It is a top-tier Chinese \u0027Guochao\u0027 brand you cannot miss in Yunnan.", "name": "Yunnan Baiyao Life Experience Store - Shuhe", "transport": "Take a taxi to Shuhe North Gate, enter the ancient town, and walk for about 3 minutes."}, {"address": "No. 108 Xueshan Road, Shuhe Street, Yulong Naxi Autonomous County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Alpine Snow Lotus Glowing Face Oil, Saffron Repairing Lip Balm,
