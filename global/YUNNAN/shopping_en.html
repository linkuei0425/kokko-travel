Yak Milk Ultra-Moisturizing Body Lotion. Located near the visitor center area at the foot of Yulong Snow Mountain along the access road to Shuhe Ancient Town, this independent store focuses on pure skincare products extracted from high-altitude polar-like flora. The store\u0027s exclusive Snow Lotus Essential Oil features fine molecules that absorb quickly, making it exceptionally effective for repairing UV damage and severe dryness. Meanwhile, the yak milk hand creams and body lotions feature a rich milky aroma and deep hydration.", "name": "Snow Mountain Sacred Herb Skincare", "transport": "Recommended to drive or take the Yulong Snow Mountain Bus Line to Xueshan Xiaozhen (Snow Mountain Town) Station."}, {"address": "No. 22 Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Alpine Truffle Firming \u0026 Anti-Wrinkle Skincare Set, Dian Qing Tea Oil-Control Ampoule, Snow Lotus Alpine Plant Sleeping Mask. As a famous Chinese skincare brand specializing in alpine plant ingredients, its products are co-developed with the Kunming Institute of Botany, Chinese Academy of Sciences. Located in the core commercial hub of Shuhe Ancient Town, the store offers professional skin analysis and trial services. Their Truffle and Snow Lotus series capitalize on active botanical compounds from pollution-free, high-altitude Yunnan, yielding gentle formulas with outstanding results\u2014a local tech-infused beauty destination.", "name": "Botanical Doctor - Shuhe Branch", "transport": "Once you reach Sifang Street in Shuhe Ancient Town, walk for 1 minute to spot the prominent sign."}, {"address": "No. 48 Renli Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Western Yunnan Damask Rose Essential Oil, Alpine Wild Lavender Sleep-Aid Essential Oil, Cold-Pressed Yak Milk Processed Soap. Filled with rich floral scents, this independent artisanal workshop carefully selects organically grown local flowers and pure plant oils for low-temperature cold processing. The signature rose oil originates from flower fields in Dali and Lijiang with high purity, while handcrafted soaps are infused with wild honey and high-altitude yak milk. They offer a rich, silky lather, and every bar features unique patterns and natural herbal fragrances.", "name": "Huacaoji Handcrafted Soap \u0026 Oils", "transport": "Enter through the West Gate of Shuhe Ancient Town and walk for about 6 minutes into Renli Lane."}, {"address": "No. 88 Shuhe Road, Shuhe Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Sweet Wormwood Soothing Herbal Balm, Poria Cocos Pure Brightening Powder, Yunnan Lithospermum Anti-Chapping Cream. Yixintang is Yunnan\u0027s largest and most trusted local pharmacy chain. This branch in Shuhe Ancient Town features a special section dedicated to \u0027Yunnan Herbal Cosmetics \u0026 Health Products\u0027. Visitors can buy authentic skincare products derived from traditional Yunnan herbs at very affordable prices\u2014for instance, Lithospermum cream is exceptionally effective against dry, sensitive skin. It is a popular spot for locals and savvy travelers to stock up.", "name": "Yixintang Pharmacy Beauty \u0026 Health - Shuhe", "transport": "Take Bus No. 11 to Shuhe Lukou Station and walk for about 2 minutes."}, {"address": "No. 3 Songyun Village, Shuhe Ancient Town, Yulong Naxi Autonomous County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Saffron Brightening Serum, Highland Barley Exfoliating Scrub, Alpine Tibetan Herbal Foot Soak Packs. Located at the foot of the snow mountain, this specialty Tibetan herbal beauty store converts classic remedies from ancient Tibetan medical texts into modern skincare products. Its Saffron Brightening Serum effectively improves dullness and high-altitude redness, while the Highland Barley Scrub utilizes natural crop grains for gentle exfoliation. Rich in Tibetan cultural ambience, the staff enthusiastically introduce the unique history of Tibetan medicine skincare.", "name": "Zangyuan Bencao Tibetan Herbal Beauty", "transport": "Walk to the Songyun Village area of Shuhe Ancient Town, or take a taxi directly to the Songyun Intersection."}], "name": "Local Signature Beauty \u0026 Cosmetics"}, "cat_2": {"items": [{"address": "No. 24 Qinglong Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy items: Handcrafted vegetable-tanned leather tote bags, vintage genuine leather keychains, hand-stitched wallets. Shuhe Ancient Town has long been known as the \u0027Hometown of Cobblers.\u0027 This shop inherits centuries-old leather crafting techniques from the Ancient Tea Horse Road. All leather goods in the shop are hand-buffed and hand-stitched by local master cobblers using premium top-grain cowhide, offering a durable texture rich with a sense of history. Locals highly recommend their handmade leather bags, which develop a unique patina over time\u2014making this a truly iconic craft shop in Shuhe, Lijiang.", "name": "Shuhe Cobbler History \u0026 Leather Shop", "transport": "Take Bus 11 to Shuhe Lukou Station, then walk about 10 minutes to Qinglong Street."}, {"address": "No. 5 Songyun Village Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy items: Oriental Zen cotton-linen dresses, handmade tie-dye linen scarves, ethnic embroidered jackets. This boutique specializes in combining traditional Naxi textile arts with modern cotton and linen clothing tailoring, making it a favorite among lovers of natural, casual fashion. The linen clothing is breathable and comfortable, perfect for photos under Yunnan\u0027s high-altitude sunshine. The welcoming staff will introduce the story and Naxi totem meanings behind each garment, making this a very popular independent original boutique in Shuhe.", "name": "Naxi Linen Art Clothing Boutique", "transport": "Take Bus 6 to Shuhe Shangcun Station and walk about 5 minutes."}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-buy items: Retro Ancient Tea Horse Road handcrafted leather boots, genuine leather crossbody messenger bags, hand-carved leather belts. Inspired by the caravan culture of the Ancient Tea Horse Road in Yunnan, the owner designs leather boots and bags filled with rugged, vintage aesthetic appeal. The shop is filled with a rich leather scent and a rugged vintage vibe; every pair of boots is handmade and reinforced, making them durable and stylishly reflecting Yunnan\u0027s wild nature and intricate craftsmanship.", "name": "Ganma Ren Leather Craft House", "transport": "Take Bus 11 to the main entrance of Shuhe Ancient Town, then walk through Sifang Street to Feihua Chushui (approx. 8 minutes)."}, {"address": "No. 18 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.9 stars | Must-buy items: Plant-dyed indigo silk shawls, handmade tie-dye canvas bags, natural indigo-dyed linen clothing. Lanxu is a signature local botanical dye brand in Yunnan that insists on using natural plant dyes like Isatis root. The studio displays richly layered indigo womenswear and scarves, as well as exquisite tie-dye tote bags. Every piece features a unique blue-and-white pattern, exuding an elegant natural vibe infused with Dali and Lijiang ethnic charm.", "name": "Lanxu Indigo Dyeing Clothing \u0026 Bag Studio", "transport": "Walk for about 6 minutes from the North Gate entrance of Shuhe Ancient Town to Longquan Road."}, {"address": "No. 12, East Side of Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy items: Mosuo woven colorful wool shawls, hand-woven ethnic crossbody bags, vintage multi-layer cloth-soled shoes. This shop brings in traditional hand-weaving techniques of the Mosuo people from Northwestern Yunnan, crafted entirely by local women. The vibrant wool shawls and totem fabric bags feature bold, artistic color blocking that is warm, cozy, and perfect for styling in photos. The handmade cloth shoes are lightweight and sturdy, making them ideal footwear for exploring the ancient town.", "name": "Mosuo Weaving \u0026 Handmade Bag Studio", "transport": "Take Bus 5 or 11 to Shuhe Ancient Town Station, then walk to Sifang Street."}, {"address": "No. 8 Yanliu Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-buy items: Modernized Naxi \u0027Seven Stars\u0027 cape coats, embroidered sheepskin purses, ethnic print fringe scarves. Transforming the inspiration of the traditional Naxi \u0027Seven Stars\u0027 (Pi Xing Dai Yue) sheepskin cape into modern fashionable womenswear and coats, this store preserves cultural symbols while offering exceptional tailoring quality. Their intricate embroidered sheepskin backpacks are must-buy souvenirs for travelers in Shuhe.", "name": "Yunxiang Yishang Naxi Ethnic Wear", "transport": "Enter through the South Gate of Shuhe Ancient Town and walk along Yanliu Road for about 4 minutes."}, {"address": "No. 15 Shangcun, Kaiwen Community, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy items: Minimalist hand-stitched leather bifold wallets, snow mountain silhouette leather totes, handmade braided leather bracelets. Located in an art village on the outskirts of Shuhe at the foot of Jade Dragon Snow Mountain, this workshop is run by independent designers who love the mountains. The product style focuses on minimalist quality, embossing snow mountain lines onto thick leather\u2014understated yet deeply memorable, making it popular among hipsters and backpackers.", "name": "Snow Mountain Handmade Leather Workshop", "transport": "It is recommended to take a taxi or rent a bicycle to Shangcun Art Community."}, {"address": "No. 31 Dingye Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy items: Dongba script hand-painted leather box bags, hand-embroidered cloth shoes, Yunnan ethnic totem backpacks. Bringing together creative works from young local designers in Yunnan, this shop features ancient Naxi Dongba script and traditional embroidery patterns painted on modern bags and handcrafted shoes. The designs are both fashionable and unique, ensuring you won\u0027t clash with mainstream brands\u2014a true treasure trove for distinctive accessories.", "name": "Xiu Se Yunnan Designer Shoes \u0026 Bags", "transport": "Walk from the Shuhe Ancient Town main gate parking lot along Dingye Street for about 5 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 1 Qinglong Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-buy list: Freshly baked classic rose cakes, lavender flower cakes, and Yunnan ham flower cakes. As Yunnan\u0027s most famous flower cake brand, its branch in Shuhe Ancient Town offers live baking on-site. Filled with high-quality edible roses from Shangri-La and Dali, these cakes feature a flaky crust and rich floral aroma\u2014a classic souvenir you simply cannot miss in Lijiang.", "name": "Jiahua Flower Cake", "transport": "Take Lijiang City Bus No. 11 to Shuhe Intersection (Shuhe Lukou) Station, then walk for about 8 minutes."}, {"address": "No. 12 Jiuding Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy list: Sterling snowflake silver bangles, nine-dragon filigree silver cups, and handmade silver teapots. A time-honored local brand specializing in snowflake silver with guaranteed quality. The store offers live silversmithing demonstrations. Naxi silver craftsmanship has a long history, and high-purity snowflake silver boasts delicate snowflake-like textures, making it both practical and collectible.", "name": "Baisuifang Silverware", "transport": "Walk about 5 minutes from the North Gate entrance of Shuhe Ancient Town."}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy list: Alpine wild snow tea, premium air-dried yak jerky, and organic dried maca slices. Located in Shuhe Ancient Town at the foot of the snow mountain, this specialty souvenir store focuses on natural, pollution-free ingredients from the Yunnan Plateau. Its snow tea is harvested from high altitudes on Jade Dragon Snow Mountain, delivering a sweet aftertaste and refreshing heat-clearing qualities; the yak jerky is chewy, flavorful, and richly seasoned.", "name": "Yunxueli Native Souvenir Shop", "transport": "Walk to Feihua Chushui Square in Shuhe Ancient Town, where you will see the eye-catching sign."}, {"address": "No. 15 Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy list: Dongba pictograph handmade bookmarks, pressed flower notebooks, and hand-drawn pictograph postcards. Showcasing the thousand-year-old Naxi handmade papermaking craft using the bark of Wikstroemia plants from Jade Dragon Snow Mountain, this paper is insect-proof and famously durable for centuries. The shop creatively combines traditional pictographs with modern creative snacks and grocery packaging, making it a souvenir of great cultural significance.", "name": "Dongba Paper Workshop", "transport": "Located on the west side of the main square after entering Shuhe Sifang Street."}, {"address": "No. 26 Songyuncun Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy list: Ancient-tree raw Pu\u0027er tea cakes, premium Dianhong pine needle black tea, and mandarin-stuffed Pu\u0027er tea (Xiaoqinggan). Tucked away in a quiet alley of Shuhe Ancient Town, this traditional tea house is run by an owner knowledgeable in the histories of Yunnan\u0027s famous tea mountains. Free tasting is offered, allowing guests to savor rich, sweet ancient-tree Pu\u0027er and honey-scented black tea\u2014an excellent spot for selecting high-quality tea gifts.", "name": "Jingshui Huakai Tea House", "transport": "Enter from the East Gate of Shuhe Ancient Town and walk along Songyun Village for about 6 minutes."}, {"address": "No. 38 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-buy list: Vacuum-packed Naxi cured ribs, secret-recipe cured pork, and wild mushroom hot pot soup bases. Lijiang\u0027s most famous delicacy, cured pork ribs, is meticulously seasoned and vacuum-sealed so travelers can take this authentic flavor home. Paired with the store\u0027s custom wild mushroom broth base, you can easily recreate a genuine Naxi-style hot pot at home.", "name": "Lijiang Apo Cured Ribs Souvenir Store", "transport": "Located on Longquan Road in Shuhe Ancient Town, about a 3-minute walk near Qinglong Bridge."}, {"address": "No. 18 Zhonghe Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy list: Dried wild black porcini, premium morels, and assorted wild mushroom soup packs. Yunnan is known as the Kingdom of Wild Mushrooms, and this shop specializes in dried mushrooms sourced from the mountains around Jade Dragon Snow Mountain. All products are meticulously hand-selected and low-temperature dried to lock in their rich, savory umami flavors\u2014an ultimate ingredient for soups and cooking.", "name": "Shanhaihui Dried Wild Mushroom Store", "transport": "Walk about 4 minutes from the Shuhe Ancient Town Headquarters Parking Lot."}, {"address": "Zone A, Shopping Mall, Tourist Service Center, Jade Dragon Snow Mountain Scenic Area, Yulong Naxi Autonomous County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy list: Hand-shredded spicy yak beef jerky strips, plateau yak milk candies, and freeze-dried wild blueberries. Specially tailored for travelers, this snack store offers a variety of small-packaged plateau treats. The yak beef comes from yaks raised in high-altitude pastures around Jade Dragon Snow Mountain, roasted with proprietary spices to yield a savory, chewy texture\u2014perfect for sharing with family and friends.", "name": "Snow Mountain Pasture Yak Snacks Store", "transport": "Located inside the Tourist Service Center of Jade Dragon Snow Mountain Scenic Area; easily accessible by taking the Snow Mountain Shuttle Bus."}], "name": "Must-Buy Souvenirs \u0026 Specialty Snacks"}, "cat_4": {"items": [{"address": "No. 1 Jiahe Road, Yulong Naxi Autonomous County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Deep end-of-season discounted Nike sneakers, Camids windproof outdoor jackets, and local handmade Lijiang plateau wool shawls. This is the largest modern discount outlet center in the Lijiang and Jade Dragon Snow Mountain area, bringing together famous international sports/outdoor brands and local traditional clothing. The outlet frequently offers fantastic discounts of 50% to 70% off, making it especially popular with tourists heading up Jade Dragon Snow Mountain to stock up on great value warm outdoor gear and casual footwear.", "name": "Lijiang Jiahe Outlet Shopping Center", "transport": "Take Lijiang Bus Line 11 or 19 to \u0027Jiahecheng Station\u0027; or take a taxi for about 15 minutes from Shuhe Ancient Town."}, {"address": "Snow Mountain Art Town, Shuhe Street, Gucheng District, Lijiang City, Yunnan Province (Adjacent to the East Gate of Shuhe Ancient Town)", "feature": "\u2b50 4.6 Stars | Must-Buy List: Hand-dyed botanical cotton-linen scarves, Naxi Dongba script carved wood ornaments, and Yunnan plateau organic herbal tea bags. Located adjacent to Shuhe Ancient Town, this multi-functional cultural and creative commercial hub was designed by famous architects, blending traditional Naxi residential styles with modern architectural aesthetics. Featuring numerous local independent designer brands and curated art shops, it stands as an iconic trendy shopping landmark where locals and hipsters love to hunt for unique souvenirs.", "name": "Lijiang Snow Mountain Art Town Commercial Plaza", "transport": "Walk east for about 8 minutes from the main gate of Shuhe Ancient Town."}, {"address": "Core Section, Feihua Chushui Scenic Area, Shuhe Ancient Town, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Hand-hammered Snowflake silver jewelry, Naxi hand-woven wool blankets, and Yunnan wild black truffle spread gift boxes. Situated in the vibrant waterscape heart of Shuhe Ancient Town, this large open-air shopping plaza connects multiple antique Naxi courtyards. It brings together historic Yunnan brands and specialty boutiques, offering tourists a one-stop shop for traditional Yunnan handicrafts and premium plateau ingredients. At night, surrounded by flowing streams and glowing lights, it is a magnificent place for shopping and strolling.", "name": "Shuhe Feihua Chushui Commercial Center", "transport": "After entering Shuhe Ancient Town, walk to the central Feihua Chushui waterscape area."}, {"address": "Inside the Visitor Service Center Lobby, Jade Dragon Snow Mountain Scenic Area, Yulong Naxi Autonomous County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 Stars | Must-Buy List: Jade Dragon Snow Mountain limited-edition thermal jackets, high-purity portable oxygen canisters, and metal Naxi Dongba script commemorative medals. Located at the entrance of Jade Dragon Snow Mountain Scenic Area, this official large comprehensive department store provides visiting tourists with complete climbing equipment and souvenirs. Beyond cold-weather apparel and oxygen supplies, it exclusively sells officially licensed mountain-themed merchandise with reliable quality and transparent pricing, making it an essential official stop before summiting.", "name": "Jade Dragon Snow Mountain Visitor Center Shopping Department Store", "transport": "Take the Snow Mountain Express Bus (Line 101) from downtown Lijiang or Shuhe Ancient Town to the terminus \u0027Snow Mountain Visitor Center Station\u0027."}, {"address": "No. 35 Side Street near Qinglong Bridge, Shuhe Ancient Town, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Handmade Dongba bark paper bookmark sets, Naxi hand-embroidered backpacks, and highland saffron moisturizing serum oil. This independent cultural department store focuses on Naxi intangible cultural heritage. It fully displays and sells journals and lamps made using traditional Dongba papermaking techniques, as well as colorful tapestries hand-woven by local women. Dedicated to preserving regional craftsmanship, its products possess profound cultural depth and souvenir value, making it immensely popular with foreign tourists and culture lovers.", "name": "Shuhe Dongba Paper \u0026 Tapestry Cultural Department Store", "transport": "Walk west for about 150 meters from the famous Qinglong Bridge in Shuhe Ancient Town."}, {"address": "Intersection of Xianghe Road and Minzhu South Road, Yulong County, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Local Yunnan \u0027Maoduoli\u0027 tamarind candy gift boxes, Yunnan Baiyao herbal skincare sets, and highland wild Pu\u0027er tea cakes. Located at the intersection of Yulong County and the Old Town, this large local department store is highly popular among residents. It houses a spacious Yunnan specialty supermarket and local clothing counters, offering affordable prices and a complete range of goods. Travelers looking to avoid tourist area markups and buy authentic local snacks and daily supplies flock here for major shopping.", "name": "Lijiang Xianghe Commercial Department Store", "transport": "Take Bus Line 8 or 11 to \u0027Xianghe Commercial Plaza Station\u0027."}, {"address": "Next to the entrance of Jiuding Longtan Park, Shuhe Ancient Town, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Hand-hammered brass tea sets, Yunnan Dianhong premium honey-aroma black tea, and natural herbal essential oil handmade soaps. Situated near Jiuding Longtan (Nine Dragon Pool), the water source of Shuhe, this unique lifestyle store highlights the slow-living aesthetics of the Yunnan plateau. It brings together creations from independent artisans across Yunnan, ranging from ceramics and brassware to custom herbal tea blends. With a quiet, pleasant shopping environment and exquisite gift packaging service, it is a hidden gem for high-quality souvenirs and lifestyle goods.", "name": "Shuhe Jiuding Longtan Cultural Lifestyle Department", "transport": "Walk upstream along the creek for about 600 meters from Sifang Street in Shuhe Ancient Town to Jiuding Longtan."}, {"address": "No. 12, East Side of Sifang Street, Shuhe Ancient Town, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: 999 Snowflake Silver hand-hammered bangles, Yunnan wild Ganba mushroom gift sets, and freeze-dried Yunnan olive snacks. Located in the center of Shuhe Ancient Town, this flagship specialty store combines Yunnan\u0027s famous Snowflake Silver craft workshop with a specialized market for dried wild plateau mushrooms. The store features a professional silver crafting demonstration area and a mushroom quality inspection area. All silver items come with official inspection certificates guaranteeing top quality, making it an iconic store to experience and purchase Yunnan\u0027s famed local products.", "name": "Shuhe Highland Specialty \u0026 Silverwork Flagship Store", "transport": "Walk to the central \u0027Sifang Street\u0027 area of Shuhe Ancient Town."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jade Dragon Snow Mountain and Shuhe Ancient Town"}};
        const cityName = "Yunnan";
        let curDist = null, curCat = null;
        const contentArea = document.getElementById('content-area');

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            Object.keys(dbData).forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                document.getElementById('district-buttons').appendChild(b);
            });
            if(Object.keys(dbData).length > 0) selectDist(Object.keys(dbData)[0], document.getElementById('district-buttons').children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(document.getElementById('district-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active shadow-md';
            document.getElementById('category-buttons').classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            const container = document.getElementById('category-buttons'); container.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No recommendations available for this category.</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【修改】：讓正則可以匹配 "4.5 Stars" 這種英文寫法
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+\s*(?:星|Stars?)[\s\w|]*)/gi, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See map Navigation'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> Open Map Navigation
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">
