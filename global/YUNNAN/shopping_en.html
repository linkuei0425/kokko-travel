etic charm and practical value.", "name": "Ashima Botanical Soap Workshop", "transport": "Walk along the Honglong Well water feature street for about 400 meters to spot the wooden sign."}, {"address": "No. 1 Lvyu Road, South Gate, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Yunnan Rose Hand Cream, Jasmine Lip Balm, Lavender Soothing Mist. While Jiahua is famous for its flower cakes, its botanical beauty line is equally distinctive and local. The shop incorporates food-grade flower extracts into beauty formulations. Their hand creams have a subtle, natural floral scent and ultra-hydrating feel, wrapped in sweet floral packaging that makes for highly popular souvenirs.", "name": "Jiahua Botanical Cosmetics \u0026 Essential Oils", "transport": "Walk 1 minute from the Visitor Center at South Gate of Dali Ancient Town."}, {"address": "No. 302 Yuer Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Wild Tea Seed Cleansing Oil, Mugwort Warming Essential Oil, Sweet Wormwood Repair Lotion. Tucked away in a quiet alley of the Ancient Town, this workshop specializes in hand-extracted products made from wild herbs harvested from Mt. Cangshan. Owned by a descendant of a local herbalist lineage, the shop offers tailored skincare advice. The Wild Tea Seed Cleansing Oil is lightweight and emulsifies rapidly\u2014a hidden local holy-grail product highly recommended by seasoned backpackers.", "name": "Cangshan Pure Herbal Workshop", "transport": "Take Ancient Town Bus C2 to Yuer Road Intersection Stop, then walk about 150 meters."}, {"address": "No. 18 Pingzang Lane, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Fo-Ti (Polygonum Multiflorum) Hair Care Soap, Yunnan Bamboo Leaf Refreshing Cleansing Foam, Fig Nourishing Body Lotion. Originating from a well-known local Yunnan herbal cosmeceutical brand, this studio applies traditional Chinese herbal remedies to scalp and skin care. They offer live scalp assessments and herbal hair washing experiences. Their Fo-Ti Hair Soap is especially favored by urban travelers dealing with hair loss thanks to its gentle, natural ingredients.", "name": "Dianhong Herbal Care \u0026 Skincare House", "transport": "Turn into Pingzang Lane from Guangwu Road in the Ancient Town and walk for about 3 minutes."}], "name": "Iconic Local Beauty \u0026 Cosmeceuticals"}, "cat_2": {"items": [{"address": "No. 236, Upper Section of Renmin Road, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Traditional tie-dye cotton/linen scarves, handmade indigo tote bags, Bai totem indigo maxi skirts. Lanxu is an iconic local artisan apparel brand that blends traditional Bai tie-dye techniques with modern clothing design. Visitors can not only purchase high-quality cotton and linen clothes and bags dyed with natural plants like Isatis root, but also experience the pure botanical dye aroma and delicate touch. It is a cultural shopping spot you must not miss when visiting Dali.", "name": "Lanxu Indigo Dyeing \u0026 Apparel", "transport": "Take the Dali Old Town Sightseeing Bus to the Renmin Road Intersection stop, then walk for about 5 minutes."}, {"address": "No. 188, Renmin Road, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Modernized Bai cotton/linen dresses, handmade embroidered shoulder bags, vintage frog-button tea clothing. This independent designer shop in the Old Town is immensely popular among hipsters and female tourists, specializing in minimalist, natural cotton-linen styles fused with ethnic elements. The clothing is lightweight, comfortable, and flowy\u2014perfect for taking photos along Erhai Lake. Many local artists and long-term expats in Dali are regulars here.", "name": "Suyi Muxin Ethnic Clothing Boutique", "transport": "Enter Renmin Road on foot from the Erhai Gate of Dali Old Town and go straight for about 300 meters."}, {"address": "No. 120, Fuxing Road, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Bai handmade embroidered shoes, traditional tie-dye backpacks, handwoven homespun shawls. Dali Cloth Craft Workshop is known for upholding traditional craftsmanship, showcasing cloth shoes and bags handcrafted by senior local artisans. The shoes are exquisite, durable, and packed with Western Yunnan charm, while the bags combine practical storage with traditional totem designs, making them great shopping choices for both utility and local souvenir value.", "name": "Dali Cloth Craft Workshop", "transport": "Take Dali Old Town Bus Line 1 to South Gate Station, then walk about 400 meters along Fuxing Road."}, {"address": "No. 15, Honglongjing Scenic Area, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Multi-layered sole ethnic embroidered ankle boots, vintage handmade cloth shoes, plant-dyed linen slippers. This specialty shoe store focuses on innovating traditional handmade footwear by combining classic multi-layered soles with modern comfortable insoles. Styles range from elegant traditional ethnic embroidery to modern minimalist linen casual shoes. They are comfortable and unique, highly favored by tourists who value both style and comfort.", "name": "Bubu Shenghua Handmade Shoes", "transport": "Take the Old Town electric shuttle to Honglongjing Station, then walk along the waterscape trail for about 2 minutes."}, {"address": "No. 205, Middle Section of Renmin Road, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Bohemian-style large shawls, handmade leather \u0026 linen crossbody bags, designer patchwork maxi dresses. Located in the middle section of Renmin Road, this designer boutique combines Dali\u0027s free-spirited, romantic atmosphere with original clothing designs. Products are select and limited in quantity, emphasizing unique and non-replicated styles, making it a treasure-hunting haven for tourists seeking a distinctive look.", "name": "Yunduan Manyan Designer Boutique", "transport": "Walk about 8 minutes from the Foreigner Street intersection in the center of the Old Town to the middle section of Renmin Road."}, {"address": "Middle Section of Haijie Street, Shuanglang Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Resort-style fringed shawl dresses, handmade woven straw hats, Western Yunnan totem fanny packs. Situated in Shuanglang Ancient Town by Erhai Lake, this specialty clothing shop caters to travelers wanting exotic and ethnic outfit accessories for vacation photo-ops around the lake. The woven straw hats and fringed dresses offer sun protection while being visually striking, making it a great spot to pick up resortwear after exploring Erhai Lake.", "name": "Erhai Style Handmade Apparel", "transport": "Take the Erhai Lake tour bus or a taxi from Dali Old Town to Shuanglang Ancient Town, then walk for about 5 minutes after entering Haijie Street."}, {"address": "No. 88, Yeyu Road, Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Silver-embellished wool coats, Bai totem handbags, handmade brocade scarves. Named after the respectful Bai honorifics for men and women (\u0027A Hei Ge\u0027 and \u0027A Bai Jie\u0027), this shop specializes in clothing, shoes, and bags blending traditional Bai brocade weaving techniques with modern casual styles. They insist on using high-quality natural materials, and the brocade patterns on the handbags are entirely hand-woven by local women, offering high artistic value and local character.", "name": "A Hei Ge \u0026 A Bai Jie Ethnic Fashion", "transport": "Take the Old Town Outer Ring Bus to Yeyu Road Intersection station, then walk for about 3 minutes."}, {"address": "No. 54, Lower Section of Yangren Street (Foreigner Street), Dali Old Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Indigo-dyed cotton/linen sun-protective shirts, handmade woven canvas bags, plant-dyed handkerchief and shoe set. Tucked away in an alley of Dali Old Town, this courtyard-style handmade clothing shop boasts an elegant and tranquil atmosphere. The clothes are dyed using traditional plant indigo, featuring natural textures free of chemical coatings. The loose and comfortable fit perfectly aligns with Dali\u0027s slow-paced lifestyle, letting you bring home a piece of Dali\u0027s sunshine and blue skies.", "name": "Tie-Dye Courtyard \u0026 Linen Handmade", "transport": "Walk to the lower section of Yangren Street; the sign board is visible near the intersection with Bo\u0027ai Road."}], "name": "Popular Local Clothing, Shoe \u0026 Bag Shops"}, "cat_3": {"items": [{"address": "No. 178 Fuxing Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Classic freshly baked rose flower cakes, Yunnan ham \u0026 rose cakes, taro flower cakes. A highly representative flower cake chain brand in Yunnan. Made with edible double-petal roses, these cakes are freshly baked on-site with an irresistible aroma. The outer crust is delightfully flaky, while the filling is richly fragrant and sweet, making it the top choice for a classic souvenir from Dali, Yunnan.", "name": "Jiahua Flower Cakes (Dali Ancient Town Branch)", "transport": "Take the Dali Ancient Town Sightseeing Bus to Fuxing Road and walk a short distance."}, {"address": "No. 230 Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Freshly grilled rose milk fans, handmade fried milk fan crisps, concentrated milk fan spread. The most iconic traditional dairy product of the Bai people in Dali. Made from pure milk coagulated and stretched into thin fan-shaped sheets, it boasts a rich milk flavor with a subtle tang. Whether grilled on the spot with rose jam or bought dry to fry at home, it offers an exceptionally unique flavor.", "name": "Zhao\u0027s Dali Milk Fan", "transport": "Walk to the middle section of Renmin Road inside Dali Ancient Town."}, {"address": "No. 45 Foreigner Street (Yangren Street), Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Classic premium Tuocha gift set, Rose Black Tea Tuocha, Songhe Tannian compressed Pu\u0027er tea. With a history of over a century, Xiaguan Tuocha represents Dali\u0027s rich tea culture. The uniquely bowl-shaped compressed tea is easy to carry and store. The brewed tea is bright red-amber with a long-lasting, mellow aroma, making it a sophisticated gift.", "name": "Xiaguan Tuocha Flagship Store (Dali Ancient Town)", "transport": "Take the ancient town sightseeing shuttle to the entrance of Foreigner Street, then walk about 3 minutes."}, {"address": "No. 88 Main Street, Shuanglang Ancient Town, Shuanglang Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade carved plums, milk vetch honey drunk plums, crispy dried plums. A traditional handmade specialty around Dali\u0027s Erhai Lake. Carved plums are prepared by delicately carving patterns into green plum flesh, removing the pit, and pickling them. Crisp, sweet, sour, and fruity, it is an authentic Bai snack bursting with local flavor.", "name": "Shuanglang Time-Honored Dali Carved Plum Specialty Shop", "transport": "Take the Erhai Lake Ring Road East Tourist Line Bus to Shuanglang Ancient Town Station and walk to the shop."}, {"address": "No. 67 Bo\u0027ai Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade Termitomyces mushroom oil cans, Ganba mushroom oil, mixed dried wild mushroom packs. Yunnan is renowned as the kingdom of wild mushrooms. This store specializes in fried mushroom cans and dried mushrooms harvested from Dali\u0027s high mountains. They add an intense umami flavor whether mixed with noodles, rice, or stir-fries.", "name": "Junxiangyuan Wild Mushroom Specialty Store", "transport": "Take Bus Route 8 from Dali urban area to Ancient Town West Gate Station, then walk for 5 minutes."}, {"address": "No. 290 Fuxing Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Freshly baked mini Yunnan ham pastries, flower waffles, buckwheat Sachima. A century-old Yunnan pastry brand. Their Yunnan ham pastry is highly recommended, featuring savory Xuanwei ham filling that perfectly blends sweet and savory flavors without being greasy. Beautifully packaged, it\u0027s ideal for gifting to friends and family.", "name": "Panxiangji Yunnan Pastry Shop (Dali Branch)", "transport": "Take the ancient town sightseeing shuttle and get off at the south section of Fuxing Road."}, {"address": "No. 112 Yuer Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Ouya Dali pure milk, plateau original yogurt, flower-flavored yogurt. A dairy brand local Dali residents have grown up drinking. Sourced from premium high-altitude pastures around Erhai Lake, the milk is exceptionally rich and creamy, making it a must-try local specialty beverage and treat for tourists.", "name": "Ouya Dairy Specialty Direct Store", "transport": "Take Dali Bus Route 4 to Yuer Road Intersection Station, then walk for 1 minute."}, {"address": "Along Yunnan-Tibet Highway, Zhoucheng Village, Xizhou Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: White tea in tie-dye motif gift box, Isatis root plant-dyed tea bags, Bai Three-Course Tea gift box. Located in Zhoucheng\u2014the famous home of tie-dye north of Erhai Lake\u2014this workshop combines traditional Bai tie-dye textile art with Dali\u0027s Three-Course Tea (Bitter Tea, Sweet Tea, Aftertaste Tea). The exquisite packaging is imbued with rich Bai cultural heritage.", "name": "Zhoucheng Tie-dye Souvenir \u0026 Specialty Tea Snack Workshop", "transport": "Take a minibus heading from Dali to Xizhou or Eryuan, and get off at Zhoucheng Village Entrance."}], "name": "Must-Buy Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 2 Jianshe East Road, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Discounted off-season Nike sneakers, classic Adidas casual jackets, local Yunnan Pu\u0027er tea gift boxes. As one of the largest comprehensive modern shopping malls in Dali, it features a spacious brand outlet zone hosting well-known international and domestic sportswear and casual brands, with year-round discounts as low as 30% to 50% off. The shopping environment is spacious and comfortable. In addition to brand clearance sales, it also includes local specialty boutiques and dining areas, making it a top landmark in Dali for stocking up on daily necessities or bargaining for discounted brands.", "name": "Dali Taiye International Plaza Outlet Zone", "transport": "Take Dali city bus No. 8 or 21 and get off at \u0027Taiye International Plaza Station\u0027."}, {"address": "No. 17 Renmin Street, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Dried Yunnan wild mushroom gift boxes, Dali Pu\u0027er tea cakes, Jiahua flower cakes. Kunbaida is one of Yunnan\u0027s most iconic time-honored local department store leaders. This Dali branch combines a traditional department store with local specialty merchandise zones. The basement supermarket and specialty counters offer authentic Yunnan local specialties, ranging from premium Pu\u0027er tea to artisanal wild mushrooms. With a wide variety of fully guaranteed high-quality products, it is the most trusted department store for both locals and tourists purchasing local brands.", "name": "Kunbaida Dali Shopping Center", "transport": "Take Bus No. 1 or 7 to \u0027Kunbaida Shopping Center Station\u0027 and walk for 1 minute."}, {"address": "No. 56 Cangping Street, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade independent designer woven bags, vintage botanical-dyed scarves, hand-painted Dali postcards. Converted from a 1970s abandoned textile factory, this area has become the most iconic cluster for independent design and folk arts in Dali Ancient Town. It gathers dozens of independent shops run by local Dali artists and craftspeople. Filled with a hipster vintage vibe, it displays and sells unique handicrafts, independent publications, and lifestyle goods, perfectly embodying Dali\u0027s free-spirited and romantic cultural style.", "name": "Dali Bed Sheet Factory Art District", "transport": "Walkable within Dali Ancient Town; about a 5-minute walk from the middle section of Renmin Road."}, {"address": "No. 168 Fuxing Road, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Bai ethnic group snow silver filigree dragon bangles, handmade sterling silver tea sets, sterling silver Nine Palaces and Eight Trigrams pendants. The silverware craft of Heqing in Dali, Yunnan, is nationally renowned. Cun Yin Jiang is an iconic, time-honored local brand of traditional handcrafted silverware in Dali. Spanning a spacious area akin to a silverware museum, the flagship store boasts an extensive display. All silver jewelry and crafts in the store are handcrafted by Bai artisans, offering exceptional quality with national inspection certificates, making them wildly popular among tourists and silverware collectors.", "name": "Cun Yin Jiang Silver Flagship Store", "transport": "Walk straight along Fuxing Road Pedestrian Street in Dali Ancient Town to arrive."}, {"address": "Beside Dali-Lijiang Highway, Zhoucheng Village, Xizhou Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 stars | Must-Buy List: Isatis root natural botanical-dyed square scarves, hand-dyed cushion covers, tie-dyed linen dresses. Lanxu is a flagship local brand representing the transformation of Zhoucheng\u0027s traditional tie-dye craft into modern lifestyle aesthetics. The shop displays exquisitely crafted botanical-dyed textiles and everyday items colored with indigo wood (Isatis root), free of chemical additives. Beyond purchasing high-quality designer apparel and home textiles, visitors can also experience traditional tie-dye crafting hands-on, making it an essential brand store to immerse yourself in Bai textile culture.", "name": "Lanxu Ancient Tie-Dye Boutique", "transport": "Take a shuttle or express bus bound for Eryuan from Dali Ancient Town and get off at \u0027Zhoucheng Station\u0027."}, {"address": "Intersection of Binhai Avenue and Manjiang Road, Manjiang Subdistrict, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Yunnan ethnic-style designer jewelry, Miniso co-branded stationery, local flavor snack gift packs. A large modern shopping mall located in the coastal new district near Erhai Lake, serving as the core of the Haidong commercial area in Dali. The mall features many well-known domestic and international apparel and lifestyle chain brands, along with a flagship market for Yunnan local specialties and a modern cinema. Bright, clean, and spacious, it\u0027s a great spot to enjoy modern shopping convenience and lakeside leisure.", "name": "Dali Aegean Sea Shopping Park", "transport": "Take Dali city bus No. 26 or 30 to \u0027Aegean Sea Shopping Park Station\u0027."}, {"address": "No. 16 Bo\u0027ai Road, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade ceramic tea cups, Dali herbal essential oil handmade soaps, independent design ethnic shawls. Four Seasons Market is a lifestyle concept boutique created jointly by Dali\u0027s local independent artisans and relocated creators. It brings together local original handicrafts, independent brand clothing, handmade fragrances, and organic produce. The store atmosphere is relaxed and natural, perfectly reflecting the casual and creative soul of Dali\u0027s slow living, making it an ideal place to hunt for unique souvenirs.", "name": "Four Seasons Market Cultural \u0026 Creative Boutique", "transport": "Walk along Bo\u0027ai Road near the Honglongjing section inside Dali Ancient Town."}, {"address": "No. 12 Binhai Avenue, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Off-season FILA sports jackets, discounted PUMA running shoes, local brand deer velvet warm scarves. Located near Dali Erhai Harbor, this dedicated outlet center focuses on clearance sales for international and domestic clothing and outdoor sports gear. Offering year-round discounts between 20% and 60% off, it attracts many tourists who love outdoor sports and casual wear. The shopping center also includes rest areas and local snack bars with fully functional facilities.", "name": "Dali Harbor Outlet Center", "transport": "Take bus No. 13 or 21 to \u0027Dali Port Station\u0027 and walk for about 3 minutes."}], "name": "Large Department Stores \u0026 Recommended Outlets"}}, "name": "Dali Ancient Town and Erhai Lake Scenic Area"}, "jianshui_ancient_town": {"categories": {"cat_1": {"items": [{"address": "No. 188 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buys: Botanical Pure All-Plant Face Masks, Yunnan Baiyao Repairing Toothpaste, Herbal Soothing Aerosol Spray. As the flagship store of Yunnan\u0027s most famous heritage pharmaceutical brand, it sells traditional Yunnan Baiyao medicines alongside its wildly popular \u0027Botanical Pure\u0027 natural herbal cosmetics line. Blending rare Yunnan plateau botanical extracts into modern skincare, these additive-free products offer deep repair, making this a top healthy beauty shopping stop in Jianshui Ancient Town.", "name": "Yunnan Baiyao Pharmacy", "transport": "Walk to the middle section of Lin\u0027an Road in Jianshui Ancient Town."}, {"address": "No. 128 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buys: Wenshan Panax Notoginseng Powder, Pearl Whitening Face Cream, Herbal Mosquito Repellent Sachets. Located on historic Lin\u0027an Old Street, this century-old traditional pharmacy seamlessly blends into the ancient town with its classic architectural style. Offering authentic local Chinese medicinal herbs and traditional skincare products, the knowledgeable staff provides customized herbal advice based on your skin type and health. Ground high-grade Panax Notoginseng powder and herbal whitening products are top tourist favorites.", "name": "Century-Old Tongrentang Pharmacy", "transport": "Take the Jianshui Ancient Town sightseeing shuttle to Lin\u0027an Road Stop, then walk for about 2 minutes."}, {"address": "No. 112 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buys: Yunnan Red Rose Essential Oil Soap, Crimson Rose Hydrosol, Purple Pottery Solid Perfume Balm. An independent boutique uniquely combining Jianshui\u0027s famous purple pottery culture with local flower essential oils. They handcraft cold-process soaps using indigenous plateau roses, lavender, and natural oils, ensuring a gentle, non-irritating wash. Their signature solid perfume balms housed in handmade Jianshui purple pottery jars make beautiful, practical souvenirs.", "name": "Jianshui Ancient Town Botanical Soap Workshop", "transport": "Walk to Hanlin Street near Jianshui Confucius Temple; look for the charming wooden storefront sign."}, {"address": "No. 45 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buys: Kangwang Scalp Treatment Tonic, Herbal Antibacterial Ointment, Yunnan Olive Repairing Moisture Cream. Dianhong Pharmaceuticals is a famous Yunnan-based dermatological brand. This experience center specializes in herbal scalp care and targeted skin repair solutions. Featuring gentle yet highly effective skincare and hair products infused with wild Yunnan botanical extracts, many travelers come specifically to stock up on their signature repair creams.", "name": "Dianhong Kangwang Herbal Skincare Center", "transport": "About a 3-minute walk from the main entrance of Zhu Family Garden."}, {"address": "No. 88 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buys: Fresh Flower Honey Lip Balm, Royal Jelly Anti-Wrinkle Serum, Rose Petal Hydrating Mist. Capitalizing on Yunnan\u0027s ideal natural greenhouse environment and rich nectar sources, Lao Dian Huang crafts natural skincare products derived from bee farming. Free from artificial chemical colorants, their lip balms and serums feature concentrated natural propolis and honey extracts, delivering deep hydration perfect for dry seasons.", "name": "Lao Dian Huang Bee \u0026 Flower Skincare Center", "transport": "Located on Yinghui Road Pedestrian Street, right opposite Chaoyang Tower."}, {"address": "No. 32 Hongjing Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buys: \u0027Seven Whites\u0027 Traditional Whitening Mask Powder, Chinese Herbal Foot Bath Sachets, Agarwood Calming Essential Oil. Highly recommended by locals and travelers alike, this store specializes in Traditional Chinese Medicine (TCM) skincare. Following inherited classic remedies, the owner finely grinds herbs like Angelica dahurica and Atractylodes into delicate mask powders, demonstrating custom blending on-site. Immersed in soothing herbal aromas, this natural, weightless skincare experience offers a wonderful taste of ancient TCM beauty.", "name": "Qingnangji Herbal Beauty \u0026 Traditional Wellness Center", "transport": "About a 5-minute walk from the Ancient Well Cluster on Dajing Street."}, {"address": "No. 15 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buys: Yunnan Panax Notoginseng Pain Relieving Ointment, Herbal Soothing Balm, Plateau Snow Lotus Hydrating Mask. Yixin Tang is one of Yunnan\u0027s largest pharmacy chains. The Ancient Town branch features a dedicated \u0027Yunnan Local Specialties \u0026 Cosmetics Section\u0027. Offering an extensive selection\u2014from traditional herbal balms to cutting-edge plant-based face masks\u2014it regularly runs promotions and guarantees top-notch quality.", "name": "Yixin Tang Pharmacy", "transport": "Adjacent to Jianshui Confucius Temple Plaza, an easy short walk."}, {"address": "No. 204 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buys: Yunnan Plateau Rose Hand Cream, Plant Extract Hydrating Mask, Cooling Mint Anti-Itch Ointment. A renowned Yunnan pharmacy and beauty chain, Jianzhijia supplies verified pharmaceuticals alongside a wide array of premium local botanical skincare and personal care items. Affordable prices and friendly, knowledgeable staff make it an excellent stop for daily travel skincare essentials and souvenirs.", "name": "Jianzhijia Pharmacy", "transport": "Walk along the main Lin\u0027an Road; located in the heart of the ancient town\u0027s commercial district."}], "name": "Iconic Local Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 158 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (near Chaoyang Tower)", "feature": "\u2b50 4.6 stars | Must-Buy List: Handmade botanical-dyed linen scarves, Yi ethnic plant-dyed canvas tote bags, indigo-dyed cotton-linen relaxed shirts. Located on Lin\u0027an Ancient Street, this boutique focuses on traditional Yunnan plant dyeing crafts, with all products hand-dyed by local artisans. The serene blue tones of botanical dyeing and the natural texture of cotton and linen are highly sought after by artistic and eco-conscious travelers. Every pattern is a unique piece of art.", "name": "Jianshui Indigo Dyeing \u0026 Linen Studio", "transport": "About a 5-minute walk from Chaoyang Tower in Jianshui"}, {"address": "No. 88 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (next to Zhu Family Garden)", "feature": "\u2b50 4.5 stars | Must-Buy List: Handmade Yi embroidered women\u0027s shoes, ethnic totem crossbody bags, delicate ethnic headwear. Located near Zhu Family Garden, this exquisite specialty shop combines local Jianshui Yi embroidery techniques with modern bag and shoe designs. Vibrant needlework showcases the unique aesthetics of Yunnan\u0027s ethnic minorities. The hand-stitched cloth shoes made by local women are breathable and comfortable, making them a highly popular unique souvenir for tourists.", "name": "Jianshui Ethnic Embroidery \u0026 Fabric Goods", "transport": "Take the Jianshui Ancient Town Sightseeing Mini-Train or walk to the entrance of Zhu Family Garden"}, {"address": "No. 220 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (near Yinghui Gate)", "feature": "\u2b50 4.7 stars | Must-Buy List: Retro hand-stitched genuine leather ankle boots, vegetable-tanned leather tote bags, carved leather coin purses. One of the few workshops on the old street that insists on entirely hand-stitched leatherwork. The owner uses premium top-grain cowhide and vegetable-tanned leather combined with traditional Yunnan carved patterns. The boots and bags have a warm, refined texture that develops a charming vintage patina over time, making them a favorite among travelers seeking durability and fine craftsmanship.", "name": "Lin\u0027an Handcrafted Leather \u0026 Shoes", "transport": "About a 3-minute walk from Yinghui Gate"}, {"address": "Intersection of Hanlin Road and Guangci Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Modernized Yi print maxi skirts, ethnic embroidered shawls, tasseled frog-button tops. This clothing store specializes in \u0027modernized ethnic fashion,\u0027 fusing traditional Yunnan minority motifs with contemporary tailoring. Wearing these eye-catching outfits makes for perfect photo ops against the ancient town\u0027s red walls and historic alleys. The lightweight fabrics are a hit among female visitors.", "name": "Yunshang Huarong Ethnic Clothing", "transport": "Walk to the eastern section of Hanlin Road"}, {"address": "No. 102 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (diagonally opposite Chaoyang Tower)", "feature": "\u2b50 4.3 stars | Must-Buy List: Undyed cotton-linen long-sleeve shirts, loose linen wide-leg trousers, straw sun resort hats. Focusing on a minimalist and natural lifestyle aesthetic, this cotton and linen boutique offers comfortable, breathable menswear and womenswear. Jianshui\u0027s pleasant climate makes strolling along ancient cobblestone paths in these relaxed garments exceptionally comfortable. Many artistic travelers visit specifically to pick up a few outfits infused with Zen and slow-living vibes.", "name": "Qingmu Cotton \u0026 Linen Wear", "transport": "About a 2-minute walk from Chaoyang Tower Square"}, {"address": "No. 45 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Yi floral sea embroidered shoulder bags, vintage kiss-lock metal frame purses, hand-painted totem fabric bags. Specializing in handcrafted embroidered bags of various sizes and styles, this store displays a wide array of handmade embroidery by women from Jianshui and surrounding regions. From compact crossbody bags to spacious daily totes, the stitching is dense and the rich color palettes embody Yunnan\u0027s vibrant local folk culture.", "name": "Xiuse Jianshui Embroidered Bags", "transport": "Take the ancient town electric cart, get off at Yinghui Road Stop, and walk for 1 minute"}, {"address": "No. 126 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Traditional handmade multi-layer cloth-soled shoes, Hanfu-style embroidered shoes, woven straw non-slip sandals. A multi-generational local shoe shop preserving the classic traditional shoemaking craftsmanship of southern Yunnan. The cloth soles are layered and hand-stitched with cotton, making them exceptionally soft, breathable, and sweat-absorbent. It is a top choice for older locals as well as young people who love Hanfu and modern Chinese vintage style (Guochao).", "name": "Diannan Traditional Cloth Shoes", "transport": "About a 6-minute walk from Jianshui Confucius Temple"}, {"address": "No. 18 Wenmiao Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (near Jianshui Confucius Temple entrance)", "feature": "\u2b50 4.2 stars | Must-Buy List: Patchwork geometric handbags, botanical-dyed round purses, ethnic drawstring pouches. Located near the Confucius Temple, this fabric specialty shop focuses on creative patchwork designs using local traditional handwoven fabrics and fabric remnants. Each handmade bag exudes a warm handcrafted feel and unique geometric visual appeal. Offering high cost-performance and unique designs, it is very popular among independent travelers.", "name": "Gucheng Fengyun Cloth Handbags", "transport": "Walk to the right side of the main entrance of Jianshui Confucius Temple"}], "name": "Popular Local Clothing \u0026 Accessories Shops"}, "cat_3": {"items": [{"address": "No. 128 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Traditional Jianshui purple pottery steam pot, hand-carved and filled master teacups. Located on Lin\u0027an Road in Jianshui Ancient Town, Tao Cha Ju is a time-honored purple pottery shop handed down over decades. Jianshui purple pottery is ranked among China\u0027s Four Famous Potteries. The steam pots here feature an unglazed polished technique, feeling as warm and smooth as jade, locking in the purest chicken broth sweetness when steaming. Master artisans demonstrate the unique \u0027incised carving and color filling\u0027 traditional craftsmanship on-site, making this the top choice for souvenirs with both artistic collection and practical value.", "name": "Tao Cha Ju Purple Pottery Workshop", "transport": "Take the Jianshui Ancient Town Sightseeing Bus to \u0027Lin\u0027an Road Station\u0027, then walk for about 2 minutes."}, {"address": "No. 88 Hanlin Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Traditional Bird\u0027s Nest Pastry, handmade Lion Cakes, traditional Peanut Crisp. Located in the core commercial area of Jianshui Ancient Town, Shizikou Bakery holds childhood memories for generations of locals. The most popular item, \u0027Bird\u0027s Nest Pastry\u0027, doesn\u0027t actually contain bird\u0027s nest, but earned its name due to its tender, flaky layers delicate as bird\u0027s nests. All pastries are hand-baked using traditional methods\u2014sweet without being greasy, rich with old-school wheat fragrance. The nostalgic vintage packaging makes them perfect gifts for elders and friends.", "name": "Shizikou Traditional Bakery", "transport": "About a 3-minute walk from the Zhu Family Garden scenic area."}, {"address": "No. 215 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Vacuum-packed Jianshui small tofu, secret Jianshui dipping chili powder \u0026 savory spicy sauce. Jianshui roasted tofu is famous nationwide, and Yao\u0027s is one of the most prestigious old tofu shops on Lin\u0027an Old Street. To let tourists take this delicacy home, they offer specially sterilized, vacuum-packed small tofu paired with their secret dry chili dip and spicy sauce. At home, simply heat it up in a skillet or air fryer to recreate the crispy, fragrant bean flavor straight from the street stalls of Jianshui.", "name": "Yao\u0027s Roasted Tofu Specialty Shop", "transport": "Walk to the middle section of Lin\u0027an Road in Jianshui Ancient Town; the eye-catching sign is easily visible."}, {"address": "Next to Zhu Family Garden, No. 16 Hanlin Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Jianshui ancient architecture wood-carved notebooks, Southern Yunnan hand-drawn postcard sets, Jianshui purple pottery tea pets. Situated next to the famous Zhu Family Garden (\u0027Grand View Garden of the Southwest Border\u0027), this store seamlessly blends Jianshui\u0027s historical heritage with modern creative flair. It offers wood-carved stationery inspired by the intricate architecture of the Zhu Family Garden, alongside hand-drawn postcards depicting Chaoyang Tower and Shuanglong Bridge. Elegant and trendy, it\u0027s a must-visit souvenir spot for artsy travelers.", "name": "Zhu Family Garden Cultural \u0026 Creative Shop", "transport": "Take the Ancient Town Tour Bus to \u0027Zhu Family Garden Station\u0027."}, {"address": "No. 302 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Canned pickled Caoya (grass sprouts), canned wild Ganba fungus oil, dried Yunnan porcini mushrooms. Caoya is a unique aquatic vegetable found only in Jianshui, ivory-white in appearance, crisp and sweet in taste. This specialty shop pickles fresh local Caoya using proprietary techniques to preserve its tender crunch. Additionally, it offers premium dried wild Ganba fungus and porcini harvested from Yunnan\u0027s mountains with clear pricing\u2014a top choice for foodies seeking authentic wild delicacies of Southern Yunnan.", "name": "Lin\u0027an Old Street Caoya \u0026 Local Specialty Shop", "transport": "Located on the main pedestrian street of Lin\u0027an Old Street, towards Chaoyang Tower."}, {"address": "No. 45 Hongjing Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Jianshui purple pottery tea storage caddy, high-mountain Yunnan Ripe Pu-erh tea cakes. Xiangmanju is a boutique establishment combining purple pottery craft and premium Pu-erh tea sales. Jianshui purple pottery is breathable yet waterproof, making it the ideal container for aging Pu-erh. The shop pairs carefully selected tea cakes from Xishuangbanna and Lincang high-altitude tea regions with hand-thrown pottery tea caddies crafted by local masters. Elegant gift packaging makes it highly favored by tea connoisseurs and luxury gift buyers.", "name": "Xiangmanju Purple Pottery \u0026 Tea Workshop", "transport": "Walk towards the intersection of Hongjing Street and Lin\u0027an Road; about 3 minutes on foot."}, {"address": "No. 1 Zitao Street, Wanyao Village, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 Stars | Must-Buy List: Handcrafted \u0027can tie\u0027 (distressed inlay) style purple pottery tasting cups, marble-grained purple pottery Xishi teapots. Fuyuan Art Shop is synonymous with high-end purple pottery in Jianshui. It specializes in modern, contemporary artistic pottery\u2014notably its original distressed inlay technique and natural metallic luster veins formed during firing, making every piece one-of-a-kind. Staff warmly explain the firing process and teapot seasoning techniques. Though prices are higher than average, the artistic and sentimental value is exceptional.", "name": "Fuyuan Purple Pottery Art Shop", "transport": "Take a taxi or Ancient Town Special Bus Line to \u0027Zitao Street Entrance\u0027."}, {"address": "No. 180 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Imperial secret recipe Pu-erh tea paste, Rose Pu-erh instant tea cubes. This time-honored shop specializes in Pu-erh tea paste crafted using Qing Dynasty royal court tribute methods. Tea paste is an essence extracted and concentrated from premium Pu-erh tea leaves through dozens of steps; it dissolves instantly in water, making it extremely portable and easy to brew. Smooth, rich, and aged, they also offer a specialty flavor blended with Yunnan double-red roses. Packaged in elegant tin boxes, it\u0027s a high-end gift combining health benefits with imperial luxury.", "name": "Diannan Century Tea Paste House", "transport": "Walk along Lin\u0027an Road from Chaoyang Tower for about 5 minutes."}], "name": "Must-Buy Specialty Souvenirs \u0026 Snacks"}, "cat_4": {"items": [{"address": "No. 128 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-buy list: Dried Jianshui grass sprouts (Caoya), Jianshui purple pottery teapots, Premium Dianhong black tea. Carrying decades of history, this local department store sits at the heart of Lin\u0027an Old Street and is Jianshui\u0027s most iconic heritage department store. It retains a quaint, classic shopping atmosphere while housing numerous specialty counters featuring Honghe Prefecture products. Known for fair prices and reliable quality, it is highly favored by locals and seasoned foodies alike.", "name": "Lin\u0027an Department Store", "transport": "Take Jianshui Ancient City Sightseeing Bus Route 1 to \u0027Chaoyang Tower Station\u0027, then walk about 3 minutes."}, {"address": "Intersection of Guangci Road and Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-buy list: Discounted Li-Ning sneakers, ANTA outdoor windproof jackets, Bosideng lightweight down jackets. As the largest outlet center around Jianshui, this plaza gathers off-season discount stores for numerous well-known domestic and international brands. The environment is spacious and comfortable, with year-round discounts ranging from 50% to 80% off. It is the top choice for bargain hunters looking for quality sportswear and outdoor apparel during their trip to Jianshui.", "name": "Guangci Lake Outlet Shopping Plaza", "transport": "Take Jianshui Bus Route 12 to \u0027Guangci Lake Park Station\u0027, then walk about 5 minutes."}, {"address": "No. 1 Zitao Street, Wanyao Village, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy list: Jianshui steam pot chicken pots, hand-engraved and filled purple pottery cups, local Southern Yunnan ancient tree Pu\u0027er tea cakes. Deeply rooted in Jianshui\u0027s thousand-year-old purple pottery culture, this shopping center brings together dozens of renowned local master potters and independent artisan workshops. Featuring a rich collection of fine purple pottery, tea leaves, and teaware, every piece boasts unique engraved calligraphy or artwork, making it the ultimate destination for purchasing authentic Jianshui cultural handicrafts.", "name": "Jianshui Zitao Street Craft Shopping Mall", "transport": "Take Bus Route 9 to \u0027Zitao Street Station\u0027, and walk directly to the mall entrance."}, {"address": "Intersection of Jianmin Road and Yongtong Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.2 stars | Must-buy list: Yunnan dried wild mushroom gift sets, Dai-style lemongrass grilled fish seasoning packs, locally designed linen scarves. Located at the junction of Jianshui Ancient City\u0027s old and new districts, this large comprehensive shopping center features a hypermarket, branded clothing boutiques, and local specialty flagship stores. Bright and clean with complete facilities, it is a great spot to shop for Yunnan specialty foods and everyday casual wear.", "name": "Changtai Plaza Shopping Center", "transport": "Take Jianshui Bus Route 3 or 7 to \u0027Changtai Plaza Station\u0027."}, {"address": "No. 45 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province (Diagonally opposite Zhu Family Garden)", "feature": "\u2b50 4.5 stars | Must-buy list: Handmade embroidered tiger-head shoes, artisanal Jianshui fermented tofu gift sets, handmade bamboo tea baskets. Situated next to the famous Zhu Family Garden, this mall specializes in traditional handicrafts and specialty delicacies from Jianshui and Honghe Prefecture. It offers traditional embroidery and everyday items crafted by veteran local artisans, exuding rich Southern Yunnan ethnic charm, making it a must-visit spot for souvenirs.", "name": "Hanlin Specialty Cultural Mall", "transport": "Located on Hanlin Street inside Jianshui Ancient City near the Zhu Family Garden area; accessible easily on foot."}, {"address": "Next to Chaoyang Tower, East Gate, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.1 stars | Must-buy list: Handmade Hani silver bracelets, Yunnan Wenshan Panax notoginseng powder, handcrafted cloth shoes. Located beside Chaoyang Tower, this traditional commercial city is the most popular market-style department store on Jianshui Old Street. It houses numerous local shops specializing in Yunnan ethnic minority jewelry and herbal specialty products. Offering great value for money, it lets visitors experience an authentic old-street shopping atmosphere.", "name": "Chaoyang Tower Ethnic Commercial City", "transport": "Take the Ancient City Sightseeing Shuttle to \u0027Chaoyang Tower Terminus\u0027, then walk about 1 minute."}, {"address": "No. 110 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.0 stars | Must-buy list: Boxed Jianshui dried grilled tofu, Yunnan local botanical hand creams, Yi-style totem canvas bags. Located near the Jianshui Ancient City commercial area, this daily lifestyle mall is popular among locals. It features apparel, cosmetics, and local snack stalls. In particular, the local botanical skincare products and ethnic totem canvas bags offer excellent quality and high cost-performance, making them very popular with young travelers.", "name": "Jianshui Central Shopping Plaza", "transport": "Take Bus Route 1 or 4 to \u0027Yinghui Road Middle Station\u0027, then walk about 2 minutes."}, {"address": "No. 208 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.1 stars | Must-buy list: Yunnan-style beef jerky, traditionally made rose sugar, Honghe jar-sealed yellow wine. Guangxing Commercial Mall is a historic complex along Lin\u0027an Old Street, housing a high concentration of wholesale clothing stores and local specialty shops operating for decades. The beef jerky and traditional rose sugar are handcrafted by local heritage brands with excellent flavor and affordable prices, making it perfect for buying bulk souvenirs.", "name": "Guangxing Commercial Mall", "transport": "Walk along Lin\u0027an Ancient Street near the Xiaogui Lake scenic area, or take the Ancient City electric cart to \u0027Lin\u0027an Road Middle Station\u0027."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Jianshui Ancient City and Lin\u0027an Old Street"}, "kunming_center": {"categories": {"cat_1": {"items": [{"address": "No. 108 Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: PureMild Alpine Botanical Freeze-Dried Facial Mask, Yunnan Baiyao Toothpaste Gift Set, Pain Relieving Aerosol \u0026 Capsules. As Yunnan\u0027s most iconic century-old pharmaceutical brand, this flagship store seamlessly combines Traditional Chinese Medicine with modern biomedicine. Beyond classic remedies for bumps and bruises, their herbal skincare brand \u0027PureMild\u0027 (Caiziji) has recently gained immense popularity among young shoppers and tourists. The store also offers professional TCM consultations and skin analysis services.", "name": "Yunnan Baiyao Flagship Pharmacy", "transport": "Take Metro Line 3 to Wuyi Road Station (Exit B), then walk about 500 meters."}, {"address": "No. 28 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Premium Wenshan Notoginseng Powder, Zhaotong Gastrodia Slices, Yunnan Wild Paris Polyphylla Herbal Anti-Acne Cream. Yixingtang is Yunnan\u0027s leading and most historic pharmacy chain. Located near the scenic Green Lake, this branch boasts a rich selection of authentic local medicinal herbs and wellness herbal cosmetics. Prices are transparent and clearly labeled, and the staff are deeply knowledgeable about the skincare benefits of Yunnan herbs, making it the top choice for purchasing local pharmacy cosmetics.", "name": "Yixingtang Pharmacy (Cuihu Branch)", "transport": "Take Bus 139 or 101 to Cuihu Park Station, then walk about 100 meters."}, {"address": "No. 88 Nanping Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Alpine Dendrobium Orchid Youth Activating Serum, Purple Reishi Multi-Effect Anti-Aging Cream, Snow Lotus Brightening Mask. DR.PLANT champions the concept of \u0027Alpine Botanicals for Pure Skincare\u0027, sourcing ingredients primarily from high-altitude cultivation bases in Yunnan. The store features a fresh, elegant decor infused with a natural botanical vibe. Its Dendrobium Orchid hydrating and anti-aging series is considered a must-stock iconic beauty item by countless visitors to Kunming.", "name": "DR.PLANT (Nanping Pedestrian Street Store)", "transport": "Take Metro Line 2 to Dongfeng Square Station (Exit H), then walk about 400 meters."}, {"address": "B1, Shuncheng Shopping Center, No. 11 Dongfeng West Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Yunnan Herbal Foot Soak Bags, Plateau Vanishing Cream Moisturizer, Shangri-La Saffron Essence. Jianzhijia is a well-known healthcare pharmacy brand deeply rooted in Yunnan, blending features of modern drugstores with traditional pharmacies. Alongside standard medicines, it offers a dedicated area for Yunnan specialty herbal skincare\u2014featuring botanical foot soaks and hand creams. Its high cost-performance ratio and attentive service are beloved by both locals and tourists.", "name": "Jianzhijia Pharmacy (Shuncheng Branch)", "transport": "Take Metro Line 3 to Wuyi Road Station (Exit A) for direct access to Shuncheng Shopping Center."}, {"address": "1F, Kunming Parkson Shopping Center, No. 6 Sanshi Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Tai Chi Sun \u0026 Moon Renewal Essence, Herbal Whitening Mask, Freeze-Dried Revitalizing Repair Essence. Herborist is a flagship Chinese premium herbal beauty brand tha cent to scenic Green Lake Park (Cuihu), this established direct-sale store specializes in mountain delicacies and local specialties from across Yunnan. Their dried wild mushrooms are of top quality with transparent pricing, earning the trust of quality-conscious tourists and locals alike.", "name": "Yunnan Local Specialty Store (Cuihu Branch)", "transport": "Take Bus 100 or 139 to \u0027Cuihu Nan Lu\u0027 Stop, then walk about 1 minute."}, {"address": "No. 38 Qianwang Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Try List: Maoduoli Tamarind Cake, Individually Wrapped Xuanwei Ham Slices, Dali Handmade Milk Fan Cheese. Located on Qianwang Street in the Old Town, this specialty snack shop gathers addictive local snacks featuring ethnic minority flavors. Offering generous taste-testing, it\u0027s perfect for buying individually wrapped souvenirs to share at the office.", "name": "Fuhua Authentic Yunnan Specialties (Kunming Old Street Branch)", "transport": "Take Metro Line 3 to Wuyi Road Station (Exit C), then walk about 5 minutes into Kunming Old Street."}, {"address": "No. 26 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Try List: Little Green Mandarin Pu\u0027er Tea, Sticky Rice Scented Pu\u0027er Tea Fossil, Rose Pu\u0027er Tea Bags. Nestled along the shores of Green Lake, this independent tea cultural space focuses on converting traditional Pu\u0027er tea into stylish, convenient travel souvenirs. The packaging blends Yunnan ethnic motifs with creative design, making it a hit among hipster travelers and visitors seeking sophisticated gift sets.", "name": "Lao Lin Hao Pu\u0027er Tea Souvenir Store (Cuihu Branch)", "transport": "Take Bus 133 to \u0027Cuihu Gongyuan\u0027 Stop, then walk about 2 minutes."}, {"address": "1st Floor, Zhengyi Square Shopping Center, Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Try List: ode Experience Store", "transport": "About a 3-minute walk from Sifang Street"}, {"address": "Near the intersection of Minzhu Road and the Ancient Town Entrance, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Wenshan Notoginseng Powder, Zhaotong Gastrodia Slices, Yunnan Baiyao Aerosol. Yunnan\u0027s largest local pharmacy chain. Beyond pharmaceuticals, it features a rich selection of local cosmeceuticals and authentic traditional herbs. If you\u0027re looking for guaranteed quality alpine herbs, Dongba specialty skincare ointments, or altitude sickness remedies, this is the most trusted shopping choice for locals and tourists alike.", "name": "Yixin Chain Pharmacy (Dayan Ancient Town Store)", "transport": "Located at the West Gate of the Ancient Town (junction of Nanmen Street and Minzhu Road); take a bus to Guchengkou Station and walk right over"}, {"address": "No. 45, Zhongyi Lane, Guangyi Street, beside Mu Fu Palace, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Naxi Herbal Soothing Lithospermum Ointment, Alpine Snow Tea Beauty Tea, Saffron Moisturizing Repair Cream. A unique local pharmacy that delves deep into traditional Naxi herbal wisdom, combining Dongba plant pharmacology with modern skincare. Owned by a veteran Traditional Chinese Medicine family, it offers affordable natural herbal ointments and traditional Chinese skincare products, highlighting rich ethnic cosmeceutical traditions.", "name": "Baicaotang Naxi Ethnic Medicine Pharmacy", "transport": "About 200 meters walk from the exit of Mu Fu Palace Scenic Area"}, {"address": "No. 88, Cuiwen Section, Xinhua Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Snow Mountain Cold Fragrance Handmade Soap, Saffron Nourishing Moisturizing Soap, Pu\u0027er Tea Polyphenol Antioxidant Cleansing Soap. An exquisite boutique specializing in cold-process handmade soaps and alpine botanical oil skincare products. It blends Yunnan specialties such as Pu\u0027er tea, plateau honey, and precious snow mountain herbs. Leaves skin moisturized without feeling tight. The packaging features Dongba pictographs, making it elegant and culturally rich.", "name": "Naxi Handmade Soap \u0026 Oils", "transport": "Adjacent to Bar Street; about an 8-minute walk from the Big Water Wheels"}, {"address": "No. 22, Baisuifang Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Camellia Repair Essential Oil, Camellia Anti-Wrinkle Eye Cream, Camellia Moisturizing Lip Balm. A high-end botanical beauty brand focused on skin repair powered by alpine camellia seed oil. Yunnan is one of the primary origins of premium camellia flowers. Its signature facial oil is renowned for repairing dry skin and anti-aging with a lightweight, easily absorbed texture\u2014a top star product to combat the dry, cold plateau climate.", "name": "Lin Qingxuan Camellia Oil Specialty Store (Dayan Store)", "transport": "About a 100-meter walk from Baisui Bridge"}, {"address": "No. 68, Dongdajie (East Street), Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Tong Ren Tang Herbal Whitening Facial Mask, Pearl Powder Nourishing Cream, Wild Alpine Cordyceps. A distinctive branch of the century-old Chinese pharmaceutical brand in Lijiang, seamlessly combining traditional Chinese medicine cosmetics with authentic Yunnan herbs. Offering a wide range of herbal creams and Chinese medicine repair masks with guaranteed quality, it is the premier destination for high-end cosmeceuticals and wellness herbs.", "name": "Beijing Tong Ren Tang Flagship Store (Lijiang Ancient Town Branch)", "transport": "Enter Dongdajie from the Big Water Wheels and walk about 300 meters"}], "name": "Local Iconic Cosmetics \u0026 Pharmacies"}, "cat_2": {"items": [{"address": "No. 32 Qixing Street, Sifang Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-Buy List: Handmade Mosuo rainbow shawls, botanical-dyed cotton/linen scarves, ethnic jacquard shoulder bags. This classic shop showcases the traditional hand-weaving skills of the Mosuo people. You can often see elderly weavers operating ancient wooden looms on-site. The signature Mosuo shawls feature rich, vibrant colors typical of Northwest Yunnan with a warm, delicate texture\u2014an essential styling accessory for tourists taking photos in the Ancient Town, highly favored by hipsters and female shoppers.", "name": "Mosuo Handwoven Textile Workshop", "transport": "About a 3-minute walk from Sifang Street in the Ancient Town."}, {"address": "No. 56 Upper Xingren Section, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Indigo tie-dyed maxi dresses, handmade plant-dyed cotton/linen wide-leg trousers, traditional woodblock-dyed tote bags. A local fashion brand emphasizing natural and eco-friendly concepts, all garments are hand tie-dyed using native Lijiang plants (such as woad root and sappanwood). The clothing style is steeped in Zen and vintage charm, offering comfortable, breathable cuts that capture the unique rustic beauty of Yunnan\u0027s nature.", "name": "Suyi Plant-Dyed Linen \u0026 Clothing Studio", "transport": "About a 10-minute walk from the Big Water Wheels at the North Gate of the Ancient Town, along Wuyi Street."}, {"address": "No. 12 Lower Bayi Section, Qiyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Must-Buy List: Dongba hand-carved leather backpacks, vintage handmade leather ankle boots, hand-carved leather belts. Combining unique Yunnan Dongba totem hieroglyphs with premium top-grain cowhide, every item here is meticulously handcrafted and carved by local veteran artisans. The leather boots and backpacks are remarkably durable, developing a charming patina over time, making them high-value local craft collectibles.", "name": "Dongba Leather Carving \u0026 Shoes Shop", "transport": "Walk along Qiyi Street to the intersection near Chongren Lane."}, {"address": "No. 88 Upper Huangshan Section, Xinhua Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Exquisitely embroidered Naxi cloth shoes, hand-stitched embroidered scarves, silver-button embroidered vests. A native boutique dedicated to preserving Yunnan\u0027s multi-ethnic embroidery heritage. The shop incorporates traditional Naxi and Bai patterns into modern clothing, shoe, and bag designs. The footwear features lightweight, soft soles that are easy to walk in, paired with intricate floral embroidery\u2014perfect for travelers seeking an authentic ethnic look.", "name": "Yunxiu Ethnic Embroidery Wear Store", "transport": "Walk along Xinhua Street toward Sifang Street for about 5 minutes."}, {"address": "No. 45 Zhongyi Lane, Guangyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Must-Buy List: Flowy resort maxi dresses, solid-color linen shirts for men and women, handcrafted woven straw bags. A must-visit store for tourists doing travel photography shoots in Lijiang. The shop specializes in light, breathable pure cotton and linen garments, predominantly in earth tones and white. The designs are simple and elegant with an ethereal quality in photos, easily creating a relaxed, bohemian traveler style when paired with woven bags.", "name": "Manbu Lijiang Cotton \u0026 Linen Boutique", "transport": "Located near the entrance of Zhongyi Market, about a 4-minute walk."}, {"address": "No. 18 Wangjiazhuang Lane, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-Buy List: Modernized Tibetan wool coats, handmade frog-button Puluo vests, Tibetan totem handbags. An independent fashion boutique that blends Tibetan handwoven Puluo wool fabric with modern fashion design. Products are both warm for cold weather and stylish, with exquisite attention to detail in frog buttons and contrast trims\u2014ideal for shoppers looking for refined quality and unique ethnic style.", "name": "Amala Tibetan \u0026 Ethnic Fashion Store", "transport": "Turn into Wangjiazhuang Lane from Wuyi Street and walk for about 2 minutes."}, {"address": "No. 30 Xingwen Lane, Qiyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-Buy List: Ancient Tea Horse Road style layered cloth shoes, handcrafted leather dad sneakers, ethnic canvas crossbody bags. Inspired by the ancient caravan culture along the Tea Horse Road, this shop focuses on durable, comfortable, and rustic footwear and canvas bags. Products combine traditional multi-layered cloth soles with modern shock-absorbing insoles, making them suitable for strolling along Lijiang\u0027s cobblestone streets.", "name": "Caravan Handcrafted Shoe Workshop", "transport": "Walk along Qiyi Street into Xingwen Lane for about 100 meters."}, {"address": "No. 15 Yuanjie Section, Guangyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-Buy List: Tasseled hemp rope shoulder bags, ethnic beaded tote bags, retro bamboo woven handbags. A women\u0027s handbag shop focusing on natural hemp rope and woven bamboo materials. Combining Yunnan minority weaving techniques with modern casual designs, the owner creates unique and sturdy bags. They pair seamlessly with ethnic maxi dresses or everyday casual wear.", "name": "Yundan Fengqing Handwoven Bags Studio", "transport": "Walk from Sifang Street toward Mu Mansion for about 6 minutes."}], "name": "Popular Local Apparel, Shoes \u0026 Bags Shops"}, "cat_3": {"items": [{"address": "No. 1 Guanjiekou, Qiyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Freshly Baked Classic Rose Pastry, Rose Nougat, Yunnan Ham \u0026 Flower Pastry. A time-honored Yunnan bakery brand located in the heart of Dayan Old Town. Famous for using local Yunnan double-petal red roses as filling, freshly baked daily. Crisp crust with a rich floral aroma\u2014nearly every visitor leaves Lijiang carrying a bag of these top-tier souvenirs.", "name": "Jiahua Flower Pastry", "transport": "Walk to Sifang Street in Dayan Old Town, then walk along Qiyi Street for about 3 minutes."}, {"address": "No. 55 Xingren Upper Section, Wuyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Yunnan Ham Flower Pastry, Truffle Flower Pastry, Pine Nut \u0026 Yunnan Ham Pastry. A century-old traditional Yunnan bakery famous across China. Their Yunnan ham pastry uses premium Xuanwei ham, offering a delightful sweet and savory balance. The special truffle flower pastry adds rich layers of flavor, elegantly packaged in rustic style\u2014perfect for gifting friends and family.", "name": "Pan Xiang Ji", "transport": "Walk along Wuyi Street in Dayan Old Town for about 5 minutes."}, {"address": "No. 28 Sifang Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buy List: Handmade Snowflake Silver Teacup, S999 Pure Silver Bagua Bracelet, Carved Black Silver Necklace. The Naxi people have a long silver-smithing history, and Baisuifang is one of the most famous silver brands in Lijiang Old Town. Featuring high-purity (99.9%) Snowflake Silver with exquisite craftsmanship and authoritative certificates of authenticity, it serves as a quality benchmark in the Old Town.", "name": "Baisuifang Silver Jewelry", "transport": "Located next to Sifang Street Square in the very center of Dayan Old Town; easily accessible on foot."}, {"address": "No. 32 Zhongyi Lane, Guangyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buy List: Sticky Rice Scented Pu\u0027er Mini Tuocha, Iceland Ancient Tree Pu\u0027er Tea Cake, Rose Pu\u0027er Gift Set. A traditional tea house hidden in the alleyways of Dayan Old Town, run by a warm and welcoming grandmama (\u0027Apo\u0027). Guests can sample Pu\u0027er teas of various vintages on site. The sticky rice scented mini tuocha boasts a unique herbal aroma, smooth taste, and transparent, fair pricing.", "name": "Apo Qing Pu\u0027er Tea House", "transport": "About a 4-minute walk from Mu Palace; enter Zhongyi Lane to find it."}, {"address": "No. 12 Guangbi Lane, Guangyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 Stars | Must-Buy List: Secret-Recipe Air-Dried Yak Jerky, Dried Wild Porcini Mushrooms, Yunnan Premium Dried Matsutake. Bringing together top-quality mountain delicacies and cured meats from high-altitude Yunnan. The yak jerky is pleasantly chewy and richly spiced, while the dried wild mushrooms are premium ingredients for savory soups. Packaging and shipping services are available, highly praised by tourists.", "name": "Mufu 18 Villages Local Specialty Shop", "transport": "Located about a 2-minute walk from the exit of Mu Palace Scenic Area."}, {"address": "No. 18 Wenzhi Lane, Wuyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.9 Stars | Must-Buy List: Handmade Dongba Floral Bookmarks, Hand-Painted Dongba Hieroglyphic Lanterns, Dongba Paper-Wrapped Yunnan High-Mountain Tea Bags. Dongba paper is a thousand-year-old \u0027living fossil\u0027 handmade paper of the Naxi people, known for its durability and moth resistance. This workshop showcases traditional papermaking while creatively pairing Dongba paper with local tea and creative gifts\u2014offering rich cultural value.", "name": "Jingshui Huakai Naxi Handmade Dongba Paper Workshop", "transport": "About a 6-minute walk from the entrance of Wuyi Street."}, {"address": "No. 68 Cuiwen Section, Xinhua Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buy List: Premium Dianhong Golden Needle Black Tea, Fengqing Ancient Tree Black Tea, Classic Yunnan Black Tea Mini Gold Tins. A specialty shop dedicated to Yunnan\u0027s iconic black tea, \u0027Dianhong\u0027. Features an elegant atmosphere and complimentary tea tasting. The Golden Needle black tea features plump tea buds with prominent golden tips; once brewed, it yields a vibrant red color and rich honey aroma\u2014an elegant choice for gifts.", "name": "Dianhong Impression Yunnan Black Tea House", "transport": "Near the Old Town Bar Street area; walk along Xinhua Street to reach it."}, {"address": "No. 42 Bayi Lower Section, Qiyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buy List: Dali Carved Plum Wine, Lijiang Traditional Green Plum Wine, Secret-Recipe Carved Dried Plums. Lijiang\u0027s local climate is ideal for growing green plums. This winery adheres to traditional methods to brew fruit wines, harmoniously blending fruity and floral aromas into a smooth, sweet-and-sour taste with moderate alcohol content. They also sell handmade carved dried plums\u2014a mouth-watering snack full of Northwest Yunnan flavor.", "name": "Heji Meizijing Traditional Plum Wine House", "transport": "Walk south along Qiyi Street to Bayi Lower Section to arrive."}], "name": "Must-Buy Souvenirs \u0026 Local Snacks"}, "cat_4": {"items": [{"address": "No. 238 Minzhu Road, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy list: Discounted Nike sneakers, Adidas hoodies, Li-Ning outdoor windproof jackets. Located in the core downtown area of Lijiang near Dayan Old Town, this Outlet is the largest brand discount shopping center in the area. Bringing together numerous international and domestic sports and casual brands, discounts often range from 50% to 70% off. It is the top choice for tourists to stock up on high-quality outdoor gear and casual wear before heading to Jade Dragon Snow Mountain.", "name": "Lijiang International Shopping Plaza Outlet", "transport": "Take Bus No. 1, 11, or 28 to \u0027Shi Baihuo Dalou Station\u0027 (City Department Store Station) and walk for about 3 minutes."}, {"address": "Intersection of Xianghe Road and Changshui Road, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | Must-buy list: Yunnan dried wild mushroom gift boxes, Dai-style shredded beef jerky, Yunnan flower cakes. A large, modern comprehensive shopping plaza located near the South Gate of Dayan Old Town, combining department stores, large supermarkets, and chain restaurants. The fresh food supermarket inside sells authentic local Yunnan agricultural specialties and wild mushrooms at more affordable and transparent prices than shops inside the Old Town. It is ideal for a one-stop souvenir shopping trip before leaving Lijiang.", "name": "Lijiang Xianghe Commercial Plaza", "transport": "Walk about 10 minutes from the South Gate of Dayan Old Town, or take Bus No. 4 to \u0027Xianghe Guangchang Station\u0027 (Xianghe Plaza)."}, {"address": "Qixing Street Pedestrian District, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.2 stars | Must-buy list: Ethnic pattern printed shawls, Yunnan handmade cloth shoes, Naxi totem silver jewelry. Qixing Street is a traditional local commercial center and shopping street in Lijiang, adjacent to the west side of Dayan Old Town. It gathers numerous local department stores and boutique fashion shops, including original design stores rich in Naxi cultural elements. Here, you can find high-quality western Yunnan specialty apparel and lifestyle goods at very affordable prices.", "name": "Lijiang Qixing Street Shopping Plaza", "transport": "Walk about 12 minutes from the Big Water Wheel entrance of Dayan Old Town to reach the Qixing Street entrance."}, {"address": "No. 71 Minzhu Road, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.1 stars | Must-buy list: Dianhong black tea gift sets, natural handmade wool shawls, authentic Pu\u0027er tea cakes. A time-honored comprehensive department store in Lijiang trusted by locals. The mall houses sections for clothing, shoes, bags, cosmetics, and Yunnan local specialties with strict quality control. The famous Yunnan tea section features several local tea factories, offering excellent quality and reasonably priced authentic Dianhong black tea and Pu\u0027er tea.", "name": "Lijiang Baixin Shopping Mall", "transport": "Take Bus No. 2 or 3 to \u0027Guchengkou Station\u0027 (Old Town Entrance Station) and walk for about 5 minutes."}, {"address": "Next to Sifang Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Must-buy list: Handmade Snowflake Silver bracelets, Naxi Bagua silver amulets, 999 pure silver tea sets. Baisuifang is an iconic local heritage silver jewelry brand in Yunnan, featuring a large flagship store in the heart of Dayan Old Town. The store showcases impressive Snowflake Silver crafts, all certified for purity with official certificates. The handcrafted Naxi totem bracelets and pure silver tea sets are highly collectible Lijiang specialties.", "name": "Baisuifang Silverware Dayan Flagship Store", "transport": "Located in the core Sifang Street area of Dayan Old Town, accessible on foot."}, {"address": "No. 32 Wenzhi Lane, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy list: Dongba pictograph handmade linen bags, plant tie-dye scarves, Naxi-style geometric woven blankets. This is an original independent handmade textile boutique deeply rooted in Lijiang. The brand seamlessly blends traditional Dongba pictographs with modern fashion, utilizing natural plant dyes and traditional hand-weaving techniques. The woven bags and cotton-linen scarves are steeped in northwest Yunnan ethnic aesthetics, making them unique, high-quality choices for shopping.", "name": "Ameize Dongba Textile Life Hall", "transport": "Walk along Wuyi Street in Dayan Old Town to Wenzhi Lane to reach the destination."}, {"address": "Shuangshi Section, Xinhua Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Must-buy list: Yunnan Paris polyphylla repairing facial masks, plateau snow mountain rose mists, freeze-dried matsutake serums. A high-end local botanical skincare experience store created by Yunnan Baiyao Group. It formulates skincare products leveraging unique Yunnan alpine plants (such as Paris polyphylla, Panax notoginseng, and Prinsepia). Designed with an Asian Zen aesthetic, it offers skin analysis and exclusive high-altitude repair lines, making it popular among ingredient-conscious female visitors.", "name": "Cai Zhi Ji Botanical Skincare Store", "transport": "Walk about 6 minutes along Xinhua Street from the Big Water Wheel entrance of Dayan Old Town."}, {"address": "No. 18 Chongren Lane, Qiyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Must-buy list: Hand-carved Dongba wooden plaque pendants, ancient tree Pu\u0027er stuffed green mandarin tea (Xiaoqinggan), handmade wood-fired ceramic tea cups. Nestled deep in the alleyways of the Old Town, this independent local craft studio perfectly combines Naxi Dongba woodcarving traditions with Pu\u0027er tea culture. The owner is a local artisan who carves wood on-site. The hand-carved plaques and single-origin ancient tree teas sold here are limited-edition handcrafted items that showcase Lijiang\u0027s rich cultural atmosphere.", "name": "Jingshui Huakai Dongba Woodcarving \u0026 Tea Hall", "transport": "Walk along Qiyi Street into Chongren Lane for about 8 minutes to arrive."}], "name": "Major Department Stores \u0026 Recommended Outlets"}}, "name": "Dayan Old Town, Lijiang"}, "shangri_la": {"categories": {"cat_1": {"items": [{"address": "No. 168 Changzheng Avenue, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Must-Buys: Snow Lotus Hydrating \u0026 Repair Cream, Saffron Essential Oil Repair Liquid, Rhodiola Antioxidant Serum. Run by the local official Tibetan Medicine Hospital, this pharmacy is an authoritative landmark for Tibetan medicine and herbal skincare. Combining traditional Tibetan medicine with modern extraction techniques, all products are immensely popular with travelers seeking natural ingredients and high-performance skin repair.", "name": "Diqing Tibetan Medicine Hospital Pharmacy", "transport": "Take Shangri-La Bus Line 1 to Zangyiyuan (Tibetan Medicine Hospital) Station."}, {"address": "No. 34 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Must-Buys: Handmade Yak Milk Soap, Alpine Highland Barley Radiance Sheet Mask, Wild Lavender Essential Oil. Located in Dukezong Ancient Town, this workshop specializes in skincare made from wild Diqing plateau plants and natural ingredients. Its rich Yak Milk Soap deeply nourishes skin stressed by dry high-altitude climates, making it one of the most representative boutique shops in the ancient town.", "name": "Dukezong Ancient Town Herbal Skincare Workshop", "transport": "Walk to the Prayer Wheel Square in Dukezong Ancient Town, then walk for about 3 minutes."}, {"address": "No. 7, Zone B, Commercial Area, Sumtseling Monastery Scenic Spot, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Must-Buys: Tibetan Herbal Hand Cream, Snow Mountain Holy Water Facial Mist, Cordyceps Scalp Nourishing Essence. Located right next to the Sumtseling Monastery scenic area, this shop offers skincare made from pristine snow mountain plants around the monastery. The hand cream absorbs quickly and provides intense hydration, making this a high-quality specialty skincare spot you shouldn\u0027t miss when visiting the monastery.", "name": "Sumtseling Monastery Tibetan Herbal Cosmetics Center", "transport": "Take Bus Line 3 to the terminal stop at Sumtseling Monastery Scenic Area; located right outside the scenic shopping zone."}, {"address": "No. 12 Beilang, Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Must-Buys: Plateau Wild Honey Lip Balm, Saffron Anti-Wrinkle Moisturizing Balm, Wild Rose Repairing Essential Oil. Founded by a local Tibetan artisan, this workshop emphasizes cold-process handmade soap infused with wild high-altitude Diqing botanicals. Gentle in texture with an elegant alpine herbal scent, it is highly recommended by craft enthusiasts and travel bloggers.", "name": "Shangri-La Snow Mountain Herbal Soap Workshop", "transport": "Enter through the North Gate of Dukezong Ancient Town and walk about 200 meters along Jinlong Street."}, {"address": "No. 25 Tuanjie Road, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Must-Buys: Saffron Soothing Ointment, Alpine Sun Protection Herbal Repair Cream, Rhodiola Revitalizing Toner. As a long-standing pharmacy in Shangri-La, besides selling authentic Tibetan medicinal ingredients, its recently launched herbal suncare and repair skincare series have earned wide acclaim for effectively countering strong UV rays and high-altitude skin cracking.", "name": "Yikang Tibetan Pharmacy \u0026 Skincare", "transport": "Take Shangri-La Bus Line 2 or 4 and get off at Tuanjie Lukou (Tuanjie Road Intersection) Station."}, {"address": "No. 88 Xiangbala Avenue, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 Stars | Must-Buys: Yunn
