 Mountain, featuring wild mushrooms and black goat meat. It showcases fresh wild mushrooms harvested from the snow mountain (matsutake, porcini, bamboo fungus) simmered together with tender black goat meat. The broth is exceptionally sweet and savory without any gamey odor; the goat meat with skin is soft and springy, while the mushrooms are silky with a distinct forest aroma. Embodying the essence of the Western Yunnan plateau, this nourishing hotpot has earned stellar reviews.", "name": "Xueshan Jinsha Black Goat \u0026 Wild Mushroom Hotpot (\u96ea\u5c71\u91d1\u6c99\u00b7\u9ed1\u5c71\u7f8a\u8207\u91ce\u751f\u83cc\u706b\u934b)", "transport": "Take the Snow Mountain Express Bus to Jade Dragon Snow Mountain Visitor Service Center and walk for about 3 minutes."}, {"address": "Next to Longquan Temple, Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | A traditional decades-old snack joint beside Longquan Temple in Shuhe Ancient Town, famous for Lijiang\u0027s unique \u0027Chickpea Jelly\u0027 and \u0027Shuifeng Cake\u0027. Pan-fried on a griddle, the chickpea jelly develops a crispy outer crust while remaining soft and dense inside, drizzled with chili oil, Sichuan pepper oil, and garlic juice for incredible flavor. Handcrafted using ancient grinding methods for decades, this slightly spicy and tangy delicacy is a must-try classic Naxi street food experience.", "name": "Longquan Snacks - Naxi Chickpea Jelly (\u9f8d\u6cc9\u5c0f\u5403\u00b7\u7d0d\u897f\u96de\u8c46\u6dbc\u7c89)", "transport": "Walk along Longquan Road towards Longquan Temple inside Shuhe Ancient Town; about 5 minutes on foot."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 43 Dingye Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Perched on a high rooftop in the heart of Shuhe Ancient Town, this cafe offers panoramic views of the majestic Jade Dragon Snow Mountain and the town\u0027s tiled roofs. Specializing in freshly ground Yunnan Arabica coffee and exquisite handmade brunch, their classic \u0027Snow Mountain Special Latte\u0027 is velvety smooth with rich nutty and chocolate notes. Paired with freshly baked French toast and fresh plateau berries, it offers a crispy outside, soft inside, and balanced sweetness. A favorite spot for tourists and local youth to spend a relaxing afternoon amidst blue skies, white clouds, and snow-capped peaks.", "name": "Manyue Terrace View Cafe", "transport": "Take Lijiang City Bus No. 6 to Shuhe Ancient Town North Gate Station, then walk for about 6 minutes."}, {"address": "Dongkang Village, Shuhe Community, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province (Inside Wilderness Kingdom)", "feature": "\u2b50 4.6 stars | Set within a fairytale fantasy park created by artists, this cafe uses magical wooden cabins and whimsical upcycled installation art as its backdrop, making it a highly talked-about brunch spot. Must-try menu items include the \u0027Yunnan Plateau Strawberry Pour-Over\u0027 and \u0027Signature Strawberry Cold Brew\u0027, made with local fresh strawberries and select coffee beans. The sweet and tart fruity aromas meld seamlessly with the coffee\u0027s rich bitterness, perfectly complemented by handmade strawberry cheesecake with a fine, smooth texture. Its unique artistic vibe and photogenic spots draw countless influencers and trendy travelers.", "name": "Wilderness Kingdom Strawberry Cafe", "transport": "Recommended to take a 5-minute taxi ride from Shuhe Ancient Town directly to Wilderness Kingdom."}, {"address": "No. 18 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Tucked away deep in the cobblestone lanes of Shuhe Ancient Town, this Naxi-style courtyard cafe is filled with blooming flowers and bathed in warm sunlight, creating a cozy, time-standing-still vibe. The \u0027Brown Sugar Boba Arabica Coffee\u0027 combines local brown sugar with espresso, offering a smooth, velvety taste with deep caramel aromas. For brunch, the innovative \u0027Naxi-Style Eggs Benedict\u0027 fuses local cured bacon with custom Hollandaise sauce, bursting with rich yolk flavor that leaves a lasting impression. The cozy courtyard seating lets travelers fully embrace Lijiang\u0027s uniquely slow pace of life.", "name": "Floating Clouds Sun Cafe", "transport": "Walk to Sifang Street in Shuhe Ancient Town, then head toward Longquan Road for about 3 minutes."}, {"address": "No. 22 Qinglong Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Featuring a Japanese minimalist design with warm wooden tones and lush greenery, this tranquil cafe sits away from the noisy main streets. Its proud signature, \u0027Sparkling Cold Brew\u0027, uses micro-lot single-origin Yunnan beans with refreshing citrus and floral notes\u2014perfect for a sunny afternoon on the plateau. The brunch platter offers generous avocado poached egg toast and pan-seared smoked sausage with crispy bread and fresh ingredients. Friendly service and top-notch food quality make this a hidden gem on many independent travelers\u0027 brunch lists.", "name": "Lu Bie Cafe \u0026 Brunch", "transport": "Walk north along Qinglong Bridge in Shuhe Ancient Town for about 5 minutes."}, {"address": "No. 5 Songyun Village Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Located on the edge of Shuhe Ancient Town, this airy glasshouse cafe allows sunlight to flood every corner. Its specialty \u0027Rose Honey Latte\u0027 blends local organic edible rose jam with pure natural plateau honey, yielding elegant floral notes and gentle sweetness topped with cloud-like microfoam. The \u0027All-Day Snow Mountain Big Breakfast\u0027 comes with freshly toasted sourdough, bacon, scrambled eggs, and a fresh salad\u2014hearty, balanced, and wholesome. Guests can sip premium coffee and relish delicious food while gazing at the snow-capped mountain through large glass windows for ultimate relaxation.", "name": "Time Gap Sunshine Cafe", "transport": "Take a mini sightseeing shuttle or walk about 10 minutes from the main gate of Shuhe Ancient Town."}, {"address": "Beside Xueshan Road (towards Baisha), Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Boasting an incredible location and breathtaking views, this viral brunch cafe features an unobstructed panoramic vista of Jade Dragon Snow Mountain. The signature \u0027Snow Top Oat Latte\u0027 is crowned with stiff, velvety cream foam resembling snow-capped peaks, offering rich nutty notes over a smoky espresso base. Made to order, the \u0027American Souffl\u00e9 Pancakes\u0027 are cloud-light, airy, and melt-in-your-mouth soft with rich egg flavor. Panoramic windows and outdoor terrace seating are wildly popular, making it the top choice for enjoying brunch with a view.", "name": "Snow Mountain Living Room Cafe", "transport": "About an 8-minute drive or taxi ride from Shuhe Ancient Town."}, {"address": "No. 1 Zhonghe Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A popular cultural hub seamlessly blending an independent bookstore, slow-post postcards, and brunch cafe, situated on the old street of Shuhe Ancient Town. The \u0027Cloud Osmanthus Latte\u0027 combines local sweet osmanthus syrup with espresso, delivering a smooth, gently sweet floral flavor. For light brunch, the \u0027Croque Madame\u0027 is baked to golden crisp perfection, featuring oozing melted cheese and ham. Surrounded by books and friendly resident cats, travelers seeking artistic flair and a laid-back pace can easily spend an entire day reading and sipping fine coffee.", "name": "Cat\u0027s Sky City Cafe", "transport": "Walk to Zhonghe Road in Shuhe Ancient Town; the prominent sign is easy to spot."}, {"address": "No. 36 Renli Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Dedicated to promoting and roasting local Yunnan Arabica coffee beans, this specialty cafe is housed in a classic Naxi wooden building. Offering single-origin pour-over experiences, the must-try \u0027Baoshan Arabica Syphon Coffee\u0027 features alluring notes of dark chocolate and wine-like acidity with a smooth, lingering sweet aftertaste. For brunch, the \u0027Handmade Tartary Buckwheat Crispy Waffle\u0027 brings out local grain flavors\u2014crispy on the outside, soft on the inside, and irresistible when drizzled with wild Yunnan honey. Professional brewing techniques and insightful coffee culture introductions make it a hit among coffee aficionados and immersive travelers.", "name": "Yunnan Arabica Coffee Experience Shop", "transport": "Enter from the South Gate of Shuhe Ancient Town and walk for about 4 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 23 Qinglong Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located in Shuhe Ancient Town, combining Naxi wooden architectural style with a modern bistro atmosphere. The must-order Naxi Cured Ribs Hot Pot features a rich, savory broth with firm, chewy ribs infused with deep cured and smoked aromas. Paired with locally brewed peach wine or highland barley beer, it offers a pleasantly sweet and slightly tipsy experience highly popular among tourists and hipsters.", "name": "Fushi Bistro \u0026 Bar", "transport": "About an 8-minute walk from the main entrance of Shuhe Ancient Town"}, {"address": "Next to Shuhe Central Primary School, Renhe Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | An ultra-popular local restaurant in Shuhe Ancient Town, decorated with rich ethnic styles of Western Yunnan. The signature \u0027Steam Pot Chicken\u0027 features a clear, pure broth with tender, juicy chicken subtly infused with herbal aromas. The \u0027Stir-Fried Beef with Wild Mushrooms\u0027 uses local wild mushrooms, offering a silky, fresh texture with earthy mountain aromas\u2014a top choice for an authentic Yunnan culinary experience.", "name": "Prince of Western Yunnan - Shuhe Branch", "transport": "Take Bus 111 to Shuhe Ancient Town Station, then walk for about 10 minutes"}, {"address": "No. 45 Songyun Village, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Famous for traditional copper-pot rice and local Naxi dishes. The signature \u0027Copper-Pot Small-Pot Rice\u0027 features rice grains infused with the rich aromas of diced ham and potatoes, complete with a crispy, fragrant bottom crust. Paired with appetizing, spicy-and-sour black tofu pudding with a silky smooth texture, it is highly praised by both locals and travelers.", "name": "Xiaoguofan Naxi Restaurant - Shuhe Branch", "transport": "Located in the central area of Shuhe Ancient Town, about a 5-minute walk from Sifang Street"}, {"address": "No. 12 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A unique bistro combining traditional hand-ground stone-mill tofu with a folk music bar atmosphere. The signature \u0027Stone-Ground Tofu\u0027 melts in your mouth, bursting with rich soy fragrance and natural sweetness, complemented by a special Yunnan spicy dipping sauce for extra flavor. At night, resident singers perform folk tunes, creating a cozy, relaxing vibe perfect for enjoying custom Yunnan craft beer.", "name": "Xitian Tofu Village \u0026 Folk Bistro", "transport": "About a 6-minute walk from the North Gate entrance of Shuhe Ancient Town"}, {"address": "Mid-level, Dongkang Group 6, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A scenic bistro perched halfway up the hill, offering panoramic views of Jade Dragon Snow Mountain. It specializes in creative Western Yunnan fusion cuisine and exquisite cocktails. Try \u0027Shuixing Yanghua\u0027 (Ottelia acuminata), a unique Lijiang aquatic plant dish that is crisp, refreshing, and aromatic with garlic. Pair it with signature cocktails crafted from local high-altitude plum wine for a delightfully sweet and tart taste while enjoying the sunset over the snow mountain.", "name": "Banshan Yin Bistro", "transport": "Recommended to take a taxi to the Shuhe Mid-Mountain Parking Lot, then walk for 3 minutes"}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A long-established local Naxi home-style restaurant featuring a charming, rustic courtyard atmosphere. The classic \u0027Naxi Grilled Fish\u0027 features crispy skin coated with chili powder and cilantro, while the tender, juicy meat is free of any earthy taste. \u0027Chuigan\u0027 (seasoned pork liver) is a signature cold starter offering a unique spicy, crisp, and chewy texture, highly praised by fans of authentic Yunnan cuisine.", "name": "Cucha Danfan Naxi Cuisine", "transport": "Located in the Feihua Chushui water landscape area, easily accessible on foot"}, {"address": "Next to Jiuding Longtan (Dragon Pool), Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A romantic bistro by the stream, adorned with lush flowers and wooden decor. The signature dish, \u0027Stir-Fried Chicken with Sour Papaya\u0027, combines Dali sour papaya with free-range chicken for a tangy, spicy, and savory flavor profile with springy chicken meat. After your meal, order an aromatic Yunnan Arabica coffee cocktail and enjoy soulful live folk music for a relaxing taste of Lijiang\u0027s slow-paced life.", "name": "Jingshui Huakai Folk Music Bistro", "transport": "About a 3-minute walk from the Jiuding Longtan Scenic Area"}, {"address": "By Xueshan Road toward Baisha, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | A traditional Naxi courtyard restaurant nestled near the foot of Jade Dragon Snow Mountain, featuring a serene and elegant setting. Its specialty \u0027Wild Mushroom \u0026 Free-Range Chicken Hot Pot\u0027 is slow-simmered with wild hazel mushrooms, matsutake, and free-range chicken from the snow mountain. The broth is exceptionally savory, the chicken is smooth and tender, and the mushrooms burst with earthy aromas\u2014making it the ultimate comfort meal after exploring the mountain.", "name": "Xueshan Xiaoji Naxi Courtyard Restaurant", "transport": "Recommended to drive or take a 15-minute ride from the Jade Dragon Snow Mountain Scenic Area"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 23 Qinglong Road, Longquan Community, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A cozy vegetarian restaurant nestled in Shuhe Ancient Town, specializing in local Yunnan organic vegetables and wild mushroom dishes. The signature \u0027Truffle \u0026 Wild Mushroom Vegetarian Tofu\u0027 is highly recommended\u2014the tofu is pan-fried to a golden crisp on the outside while remaining silky smooth inside. Paired with a rich truffle and wild mushroom sauce, every bite releases a fresh, forest-like aroma. Both tourists and local plant-based food lovers are captivated by its refined seasoning and peaceful courtyard setting.", "name": "Shuhe Yiyezhou Vegetarian Restaurant", "transport": "Take Lijiang City Bus No. 11 to Shuhe Intersection Station, then walk about 10 minutes into Shuhe Ancient Town near Qinglong Bridge."}, {"address": "Building F, Haligu, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | This Zen-inspired vegetarian restaurant is famous for its fusion creative plant-based dishes. The \u0027Yunnan Gastrodia Vegetarian Hot Pot\u0027 is the house signature, with a broth simmered for hours using alpine herbs and fresh mushrooms, yielding a sweet, deeply soothing flavor. Freshly picked wild wood ear and bamboo fungus soak up the rich broth, offering a delightfully crisp and juicy texture. Its quaint, rustic wooden architecture draws countless visitors seeking a quiet escape.", "name": "Suwei Pingsheng Vegetarian Restaurant", "transport": "Take a taxi directly to the entrance of Haligu in Shuhe Ancient Town, then walk along the pedestrian street for about 3 minutes."}, {"address": "No. 25 Songyun Village, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Boasting a prime location with distant views of Jade Dragon Snow Mountain, this restaurant offers refined vegan set meals infused with plateau flavors. The \u0027Snow Mountain Bamboo Fungus \u0026 Wild Mushroom Pot\u0027 features wild porcini and bamboo fungus harvested from the foot of the snow mountain; the mushrooms are delightfully chewy with a rich, earthy aroma, while the broth is clear, oil-free, and lingering in flavor. The breathtaking scenery paired with pure, natural cuisine makes it an ideal relaxing stop en route to the snow mountain.", "name": "Jingxin Vegetarian Scenic Restaurant", "transport": "Ride a bicycle or take an electric cart for about 8 minutes from the center of Shuhe Ancient Town to reach the Songyun Village scenic area."}, {"address": "Next to Jiuding Longtan (Nine Dragons Pool), Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Embracing a \u0027farm-to-table\u0027 concept, this ancient town vegetarian hot pot spot serves fresh vegetables delivered daily from nearby farms. The \u0027Morel Mushroom Vegetarian Broth Pot\u0027 is light and refreshing, while the handmade vegetarian shiitake mushroom balls are springy and juicy, bursting with rich mushroom flavor upon every bite. Its charming, rustic courtyard atmosphere allows diners to enjoy healthy food while savoring the slow-paced town life.", "name": "Shuhe Countryside Vegetarian Hot Pot", "transport": "Walk to the entrance of Jiuding Longtan Scenic Area in Shuhe Ancient Town, then follow the stream trail for about 2 minutes."}, {"address": "No. 45 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Combining tea art with exquisite plant-based cuisine, this refined eatery is a favorite among hipsters and vegetarian enthusiasts. The \u0027Black Truffle Fried Plateau Red Rice\u0027 is a must-try dish\u2014the red rice grains are distinct, chewy, and tossed with premium black truffle sauce and finely diced local seasonal vegetables, offering rich layers of flavor and a gentle crunch in every bite. The warm wooden decor and soothing zither music create a deeply relaxing ambiance.", "name": "Jingju Vegetarian Life House", "transport": "Walk along Longquan Road, the main street of Shuhe Ancient Town; pass Sifang Street and head north for about 150 meters."}, {"address": "Xueshan Road, Baisha Town (near Jade Dragon Snow Mountain Tourist Center), Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.9 Stars | A highly-rated vegetarian restaurant located on the main road to Jade Dragon Snow Mountain, specializing in various alpine wild mushroom dishes. The \u0027All-Mushroom Nourishing Clear Broth Pot\u0027 features carefully selected chanterelles, Cat\u0027s Head mushrooms, and matsutake. The broth is warm, gentle, and naturally sweet, while the mushrooms vary in texture\u2014some silky smooth, others meaty and firm\u2014creating an ultimate mountain feast. Generous portions and authentic ingredients make it a top choice for travelers looking to recharge.", "name": "Snow Mountain Wild Mushroom Vegetarian Restaurant", "transport": "It is recommended to drive or hire a private car to Jade Dragon Snow Mountain; drive along Xueshan Expressway to the Baisha Town section, and the restaurant is prominently located along the road."}, {"address": "No. 12 East Side of Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 Stars | A specialty restaurant that transforms traditional Naxi culinary culture into full vegan feasts. The \u0027Naxi Vegetarian Baba \u0026 Grilled Tofu\u0027 is an unmissable snack combo: the vegetarian baba flatbread is crispy outside and soft inside with a rich wheat aroma, while the charcoal-grilled tofu has a delicate crisp skin and a creamy, burst-in-your-mouth center. Dusted with special Yunnan spicy dry dip powder, it delivers an unforgettable taste.", "name": "Naxi Yuan Vegetarian Tea Restaurant", "transport": "Enter Sifang Street, the core area of Shuhe Ancient Town; it is a very obvious landmark and easily accessible on foot."}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A chic little eatery serving modern fusion vegetarian dishes and healthy salad light meals. The \u0027Cabbage \u0026 Wild Mushroom Vegetarian Spring Rolls\u0027 feature paper-thin, golden-fried crispy wrappers that crunch satisfyingly with every bite, stuffed with juicy stir-fried wild mushrooms and sweet cabbage. Served with a custom sweet-and-sour tomato dipping sauce, it is refreshing, appetizing, and completely non-greasy. Highly praised by young tourists and international travelers.", "name": "Bodhi Vegetarian Light Meal House", "transport": "Navigate to the \u0027Feihua Chushui\u0027 waterscape area in Shuhe Ancient Town; the restaurant is located on the ground floor of an ancient building along the waterfront promenade."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Next to Feihua Chushui Attraction, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Bursting Tofu (Baojiang Tofu) is one of the most charming street snacks in Shuhe Ancient Town. Freshly pan-fried with a crisp, golden exterior, the moment you bite through it, rich and tender tofu juice bursts into your mouth like warm soy milk. Paired with special seasonings such as chili powder, fish mint, green onions, and Sichuan pepper oil, its spicy, savory, and tender texture is completely irresistible. Both tourists and locals highly praise this dual taste experience of \u0027crispy outside, tender inside, savory and juicy.\u0027", "name": "Feihua Chushui Stuffed Tofu (Feihua Chushui Baojiang Tofu)", "transport": "Walk to the Feihua Chushui Scenic Area in Shuhe Ancient Town to arrive."}, {"address": "No. 16 Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Lijiang Baba is a traditional Naxi flatbread snack available in both sweet and savory flavors. The sweet version is filled with sesame, peanuts, and sugar, while the savory version blends diced ham and green onions. Pan-fried to golden perfection, the outer layer is flaky and crispy with distinct layers, offering a rich wheat aroma and satisfying chew. Easily held in hand to eat while walking, it is an essential snack while exploring the cobblestone paths of the ancient town.", "name": "Shuhe Traditional Lijiang Baba", "transport": "Take Bus No. 6 to Shuhe Ancient Town Station, then walk into Sifang Street."}, {"address": "Qinglong Bridgehead, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Jidou bean jelly is made from ground wild chickpea flour unique to Lijiang, giving it a dark green color. It can be served cold-tossed or pan-fried hot. The pan-fried version has a lightly charred, crispy skin while keeping a smooth, springy texture inside. Dressed with special chili oil, garlic water, and vinegar, it is appetizingly sour and spicy with a subtle nutty bean aroma. Its unique herbal hint and crisp bite make it an excellent street snack to beat summer heat or satisfy winter cravings.", "name": "Uncle He Jidou Bean Jelly", "transport": "Walk to the side of Qinglong Bridge in Shuhe Ancient Town to spot the stall."}, {"address": "No. 41 Songyun Village, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Grilled Milk Cheese (Rushan) is one of Yunnan\u0027s most iconic dairy street foods. Paper-thin sheets of milk cheese are gently roasted over charcoal until slightly golden and bubbling, spread with sweet rose jam, and rolled onto a bamboo skewer. Richly milky, it combines a stretchy cheese texture with a crisp outer edge. The sweet and tangy rose jam perfectly cuts through the richness of the milk, making it a big hit among female visitors and children.", "name": "Yunxueli Grilled Milk Cheese (Kao Rushan)", "transport": "Walk for about 8 minutes from the main entrance of Shuhe Ancient Town."}, {"address": "Entrance of Xueshan Road, Shuhe Sub-district, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | A popular snack stall located at the junction between the Jade Dragon Snow Mountain service area and Shuhe Ancient Town. Premium high-altitude free-range yak meat is cut into thick, generous cubes and charcoal-grilled on the spot, sizzled with rendering fat. Firm and chewy in texture, seasoned with authentic Yunnan cumin, chili powder, and cilantro, every bite bursts with pure meaty flavor and smoky charred aroma\u2014a piping-hot energy booster after exploring the Snow Mountain.", "name": "Snow Mountain Yak Meat Skewers", "transport": "Recommended to take a taxi or the Snow Mountain Express Bus and get off at Shuhe Xueshan Road Intersection."}, {"address": "East side of Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.9 stars | The most famous representative of fresh-baked Yunnan rose cakes. Fresh out of the oven, the flaky pastry falls apart in delicate, buttery layers around a sweet filling made from freshly picked edible rose petals. As you bite into it, a wave of natural floral aroma and honey sweetness bursts forth. Its soft, chewy texture with crisp petal bits elevates it far above mass-produced factory versions, making it an essential stroll-and-eat snack.", "name": "Jiahua Flower Cake (Shuhe Store)", "transport": "Walk to Sifang Street in the center of Shuhe Ancient Town to find the store."}, {"address": "Jiuding Longtan Intersection, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | Yunnan people\u0027s deep love for potatoes is fully displayed in this bowl of fried potatoes. Using high-starch small potatoes grown at high altitudes, they are deep-fried until golden and crispy outside while remaining soft and fluffy inside. Tossed with fish mint, fermented bean curd sauce, special spicy powder, scallions, and cilantro, it delivers a savory, spicy, and numbing crunch. This iconic local street snack combines authentic regional seasoning with rich potato flavor.", "name": "Yunwei Highland Crispy Fried Potatoes", "transport": "Walk towards the Jiuding Longtan Scenic Area entrance for about 3 minutes to spot the stall."}, {"address": "No. 12 Longquan Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Freshly caught tiny fish and shrimp are mixed into a special batter and deep-fried to order into large, golden crispy patties. Hot out of the fryer, they are intensely crunchy\u2014even the small fish bones and shrimp shells crunch easily. Deliciously savory with subtle hints of seaweed, ginger, and scallion, dusted lightly with pepper salt and chili powder, their irresistible crunch and rich flavor keep you coming back for more. A uniquely popular market fried treat.", "name": "Erhai Small Fish \u0026 Shrimp Cake", "transport": "Walk along Longquan Road in Shuhe Ancient Town to reach."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Jade Dragon Snow Mountain and Shuhe Ancient Town"}};
        const themeHex = "#064e3b";
        const cityName = "Yunnan";
        const badgeColors = ["bg-amber-100 text-amber-800 border-amber-400", "bg-sky-100 text-sky-800 border-sky-400", "bg-rose-100 text-rose-800 border-rose-400", "bg-green-100 text-green-800 border-green-400", "bg-indigo-100 text-indigo-800 border-indigo-400", "bg-pink-100 text-pink-800 border-pink-400"];
        let currentRegion = "", currentCategory = "";
        const regionContainer = document.getElementById('region-buttons'), categoryContainer = document.getElementById('category-buttons'), categorySection = document.getElementById('category-section'), contentArea = document.getElementById('content-area');

        // 新增平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function initRegions() {
            Object.keys(db).forEach(key => {
                const btn = document.createElement('button');
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.innerText = db[key].name;
                btn.onclick = () => selectRegion(key, btn);
                regionContainer.appendChild(btn);
            });
            if (Object.keys(db).length > 0) regionContainer.children[0].click();
        }

        function selectRegion(regionKey, clickedBtn) {
            currentRegion = regionKey;
            Array.from(regionContainer.children).forEach(btn => {
                btn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border border-gray-300 bg-white text-gray-700 font-medium md:font-bold transition-colors shadow-sm text-sm md:text-base";
                btn.style.backgroundColor = ""; // 清除背景色
                btn.style.color = ""; // 清除文字色
            });
            clickedBtn.className = "whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border text-white font-medium md:font-bold shadow-md text-sm md:text-base";
            clickedBtn.style.backgroundColor = themeHex;
            clickedBtn.style.borderColor = themeHex;
            
            categorySection.classList.remove('hidden'); categorySection.classList.add('fade-in');
            renderCategories();
        }

        function renderCategories() {
            categoryContainer.innerHTML = '';
            const categoriesObj = db[currentRegion]?.categories || {};
            Object.keys(categoriesObj).forEach((catKey, index) => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-full border transition-all font-medium text-sm md:text-base ${badgeColors[index % badgeColors.length]} opacity-70 hover:opacity-100`;
                btn.innerText = categoriesObj[catKey].name || catKey;
                btn.onclick = () => selectCategory(catKey, btn);
                categoryContainer.appendChild(btn);
            });
            if (Object.keys(categoriesObj).length > 0) selectCategory(Object.keys(categoriesObj)[0], categoryContainer.children[0]);
        }

        function selectCategory(catKey, clickedBtn) {
            currentCategory = catKey;
            Array.from(categoryContainer.children).forEach(btn => { btn.classList.remove('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); btn.style.opacity = "0.6"; });
            clickedBtn.classList.add('ring-2', 'ring-offset-2', 'shadow-md', 'scale-105'); clickedBtn.style.opacity = "1";
            renderContent();
        }

        function renderContent() {
            contentArea.innerHTML = '';
            const items = (db[currentRegion]?.categories[currentCategory]?.items || []);
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 fade-in"><p class="text-lg md:text-xl">No recommendations available for this category.</p></div>`; return;
            }
            items.forEach((item, index) => {
                const encodedQuery = encodeURIComponent(`${item.name} ${cityName}`);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
                
                // 將特徵描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-sky-100 overflow-hidden flex flex-col fade-in hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1.5";
                card.style.animationDelay = `${index * 0.08}s`;

                card.innerHTML = `
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 leading-tight mb-3">${item.name}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-5 leading-relaxed tracking-wide"><span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">Recommended</span>${formattedFeature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-snug font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapsUrl}" target="_blank" class="w-full flex items-center justify-center gap-2 btn-nav text-white py-3 md:py-4 rounded-xl font-bold text-sm md:text-base transition-colors shadow-sm hover:shadow-md">
                            <i class="fa-solid fa-location-arrow"></i> Open Map Navigation
                        </a>
                    </div>
                `;
                contentArea.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', initRegions);
    </script>
