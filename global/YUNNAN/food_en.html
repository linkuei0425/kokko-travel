nt deeply loved by older generations of locals in Dali Ancient Town, serving dishes that preserve pure, authentic flavors. The classic Bai sour and spicy fish and yellow catfish soups are vibrant, rich, and spicy, featuring melt-in-your-mouth fish; yellow catfish stewed with tofu absorbs all the savory broth. The fried crisp pork skin (Shengpi style) is a unique traditional delicacy\u2014roasted pork skin that is crispy, savory, and perfectly balanced when paired with a special dipping sauce.", "name": "Yiheng Restaurant", "transport": "Walk south along Bo\u0027ai Road from Cangshan Gate of Dali Ancient Town for about 8 minutes."}, {"address": "No. 56 Fu\u0027an Lane, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | An iconic restaurant that perfectly blends Jin Yong\u0027s martial arts culture (\u0027Demi-Gods and Semi-Devils\u0027) with traditional Bai cuisine. The rich, ancient-style decor immerses diners into a wuxia world. The signature Duan\u0027s Immortal Chicken is slow-cooked for hours until the meat and bones are fall-apart juicy and deeply flavorful. Paired with hand-shredded cabbage and stir-fried beef with wild mushrooms, it offers rich textures and intense Yunnan highland aromas\u2014a feast for both the eyes and palate.", "name": "Duan Gongzi Theme Restaurant", "transport": "Take an electric shuttle inside Dali Ancient Town to near Foreigner Street, then walk for about 3 minutes."}, {"address": "No. 198 Upper Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A low-key yet highly acclaimed local spot in Dali Ancient Town for traditional breakfasts and snacks, specializing in traditional stewed pork Ersi (rice noodles) and braised pork rice noodles. The broth is simmered for hours with pork bones and secret spices, resulting in a rich, savory flavor. The stewed pork is exceptionally tender and melt-in-your-mouth soft, while the chewy Ersi noodles absorb the rich broth for a wonderfully smooth texture\u2014a local favorite to start the day.", "name": "Yufen Local Snack Restaurant", "transport": "Located on Upper Renmin Road in Dali Ancient Town, about a 5-minute walk from the West Gate (Cangshan Gate)."}, {"address": "Middle Section of Zhengyi Road, Xizhou Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A time-honored restaurant passing down generations of traditional Bai cooking techniques, renowned for authentic Bai Three-Course Tea, traditional Xizhou Baba (flatbread), and stir-fried sea-vegetable flowers with ham. Harvested fresh from Erhai Lake, sea-vegetable flowers offer a crisp and sweet taste that pairs perfectly with savory Xuanwei ham. The Xizhou Baba features a golden, flaky crust and savory, tender filling, representing local food culture at its finest.", "name": "Xinghuacun Bai Restaurant", "transport": "Take the Xizhou Ancient Town dedicated shuttle from Dali Ancient Town to Xizhou Zhengyi Road, then walk for about 3 minutes."}, {"address": "Next to Ethnic Culture Square, Shuanglang Street, Shuanglang Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | A renowned traditional fish restaurant located in Shuanglang Ancient Town by Erhai Lake, specializing in freshly prepared local lake fish. The famous Shuanglang Sour and Spicy Fish uses local papaya sour soup and Dali papaya vinegar. The fish meat is exceedingly tender, tangy, spicy, and leaves a pleasant lingering sweetness. Tofu and glass noodles absorb the flavorful broth, offering a delightful meal. Enjoying it at the lakeside outdoor seating combines stunning views with authentic traditional flavors.", "name": "Shuanglang Sour and Spicy Fish Restaurant", "transport": "Take the Erhai Lake Sightseeing Bus from Dali Ancient Town, get off at Shuanglang Ancient Town Station, and walk for about 5 minutes."}, {"address": "No. 412 Fuxing Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | A long-standing traditional local restaurant in Dali Ancient Town, deeply loved by local families and food lovers. Classic dishes include stir-fried preserved pork with tree shoots and Dali Clay Pot Stew. The stew is slow-cooked in traditional copper pots, packed with meatballs, crispy pork, mountain delicacies, and various vegetables in a rich broth. The traditional fried Rushan is crispy, delicious, and bursting with milky fragrance, embodying the essence of Bai family banquet cuisine.", "name": "Dehua Traditional Restaurant", "transport": "Walk along Fuxing Road, the main street of Dali Ancient Town; it is located near the intersection of Honglongjing Water Street."}], "name": "Famous Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 207 Yeyu Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A benchmark brunch spot combining ingredients directly from Dali\u0027s local organic farms. Their signature avocado sourdough toast paired with a fresh soft-boiled egg is smooth and rich in layers; the crispy bread aroma and velvety egg yolk weave together beautifully. Filled with lush greenery and local highland charm, it attracts countless visitors who love healthy light bites and a slow-paced lifestyle.", "name": "Chaimiduo Farm Restaurant \u0026 Cafe", "transport": "Take the Dali Ancient Town sightseeing bus and get off at Yeyu Road Intersection, then walk for about 3 minutes."}, {"address": "No. 302 Lower Section of Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | An iconic shop that infuses local Bai ethnic flavors into specialty coffee. Must-try signature drinks are the \u0027Rushan (Milk Fan) Latte\u0027 and \u0027Plum Cold Brew\u0027. Combining the milky aroma of traditional grilled milk fans with sweet and tangy plum jam, the first sip offers dense milk foam and rich espresso, followed by an explosion of unique Western Yunnan flavor\u2014an extraordinary and memorable taste experience.", "name": "Tang Coffee Dali", "transport": "Enter Renmin Road from Erhaimen Gate in Dali Ancient Town, then walk downhill along Renmin Road for about 5 minutes."}, {"address": "No. 54 Guangwu Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | An immensely popular Japanese retro-style brunch cafe in the Ancient Town. Known for fresh-made souffl\u00e9 pancakes and Eggs Benedict. The pancakes are cloud-light, melt-in-your-mouth soft, carrying rich egg aromas balanced by sweet and tangy fresh strawberries; slice into the Eggs Benedict to release golden yolk over savory smoked salmon, making it a true morning favorite for foodies.", "name": "Yishao Bakery \u0026 Brunch", "transport": "Enter on foot from Cangshanmen Gate in Dali Ancient Town, and walk along Honglong Well to the Guangwu Road intersection."}, {"address": "No. 180 Bo\u0027ai Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 stars | A professional cafe dedicated to roasting specialty coffee beans sourced locally in Yunnan. Offering single-origin pour-overs from Baoshan and Pu\u0027er, each cup presents bright tropical fruit acidity and a subtle red wine finish, clean on the palate with a lingering sweet aftertaste. With its minimalist industrial decor and attentive baristas, it is enthusiastically praised by coffee enthusiasts and local youth.", "name": "Fugong Coffee", "transport": "Take Bus C2 to Bo\u0027ai Road Intersection Stop in Dali Ancient Town, then walk for about 2 minutes."}, {"address": "No. 128 Upper Section of Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A cozy Japanese-style wooden cafe hidden in the alleys of the Ancient Town. Their popular cinnamon rolls feature a slightly crispy crust and a soft, moist center, creating a perfect match with black coffee. The signature \u0027Erhai Dawn\u0027 blends oat milk with light-roast beans for a smooth, warm taste\u2014a delightful spot to read quietly or enjoy a leisurely afternoon in Dali.", "name": "Akiyama Coffee", "transport": "Walk into Renmin Road from Cangshanmen Gate in the Ancient Town; walk up the upper section for about 6 minutes to spot the wooden sign."}, {"address": "No. 88 Foreigner Street (Yangren Street), Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | A landmark American-style cafe in Dali Ancient Town offering great people-watching views. The signature \u0027Dali Iced Coffee\u0027 blends locally roasted espresso with fresh coconut water\u2014refreshing, sweet, and palate-cleansing. Paired with house-baked, rich and dense cheesecake, it perfectly fulfills every traveler\u0027s dream of a wonderful afternoon tea.", "name": "Dali Coffee Co.", "transport": "Located in the heart of Foreigner Street in the center of the Ancient Town, easily accessible on foot."}, {"address": "Ranyi Lane, Chengbei Village, Xizhou Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A poetic cafe located by the wheat fields in Xizhou Ancient Town, boasting breathtaking pastoral views. The signature \u0027Wheat Wave Special\u0027 features roasted malt aroma smooth fresh milk\u2014one sip lets you feel the fresh fragrance of the countryside. Paired with a sweet version of Xizhou Baba (crispy on the outside, soft inside), it offers an exquisite blend of literary atmosphere, Bai rural scenery, and fine coffee.", "name": "Pessoa Cafe Xizhou", "transport": "Take a shuttle bus from Dali Ancient Town to Xizhou Ancient Town, then transfer to a scenic electric sightseeing car to reach the edge of the wheat fields."}, {"address": "No. 45 Shuanglang Hai Street, Main Street, Shuanglang Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | A front-row oceanfront brunch cafe built right beside Erhai Lake. Highlights include the \u0027Sea View Americano\u0027 and \u0027French Toast Platter\u0027. The toast is seared to golden perfection outside while pudding-soft inside, drizzled with pure maple syrup and fresh blueberries for a rich, juicy texture. Guests can savor exquisite meals while admiring stunning views of Erhai Lake and Cangshan Mountain\u2014a dream destination for photos.", "name": "Sea Book Cafe Shuanglang", "transport": "Take the Erhai Lake Ring sightseeing bus from Dali Ancient Town to Shuanglang Ancient Town Station, then walk along Hai Street for about 8 minutes."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Near the intersection of Renmin Road and Yuer Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Stepping into the restaurant feels like traveling back in time into Jin Yong\u0027s \u0027Demi-Gods and Semi-Devils\u0027 wuxia universe. The signature \u0027Duan Family Wild Mushroom Steamed Chicken\u0027 features an incredibly delicious soup base with tender, melt-in-your-mouth chicken infused with the rich, earthy umami of high-altitude wild mushrooms. The \u0027Dali Slate-Grilled Pork\u0027 is crispy on the outside and juicy on the inside, bursting with special spices and pork fat aroma. Perfectly blending wuxia romance with authentic Bai ethnic ingredients, it is a favorite among both tourists and local youth.", "name": "Duan Gong Zi - Jin Yong Wuxia Theme Restaurant", "transport": "Take the Dali Ancient Town sightseeing shuttle to Renmin Road Intersection Station, then walk for about 3 minutes."}, {"address": "No. 204 Yeyu Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Focusing on organic farm-to-table dining, this spot transforms traditional Bai flavors into exquisite modern bistro cuisine. The \u0027Sour and Spicy Erhai Lake Fish\u0027 uses fresh daily catch paired with house-pickled sour bamboo shoots and tree tomatoes. The broth is appetizingly tangy and spicy, while the tender fish carries a refreshing natural fruit acidity; pair it with their homemade purple rice wine for a sweet, smooth finish. The garden-style natural environment lets diners relax and fully enjoy Dali\u0027s laid-back vibe.", "name": "Chaimiduo Farm Restaurant", "transport": "Walk or ride an e-bike inside Dali Ancient Town to the middle section of Yeyu Road."}, {"address": "Haijie Street, Shuanglang Scenic Area, Shuanglang Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Boasting front-row, stunning views of Erhai Lake, this exquisite bistro fuses local Yunnan specialties with Western bistro dishes. The \u0027Yunnan Wild Black Truffle \u0026 Black Pork Pasta\u0027 offers a rich, aromatic experience with springy noodles, where the unique fragrance of black truffle weaves seamlessly with savory black pork fat. At night, order a cocktail crafted with Dali Eryuan plum wine as a base, and enjoy a gentle buzz accompanied by the lake breeze and waves\u2014the ultimate romantic choice for couples and young travelers.", "name": "Tang Cafe \u0026 Bistro (Erhai Lake View)", "transport": "Take the Erhai Ring Bus or hire a private car from Dali Ancient Town to Shuanglang Ancient Town, then walk into Haijie Street for about 5 minutes."}, {"address": "Next to Caicun Pier Wetland Park, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located on the shores of Erhai Lake, this minimalist bistro features live folk singers at night, creating an incredible atmosphere. The \u0027Bai Specialty Dali Rushan \u0026 Grilled Pork Platter\u0027 is uniquely local; the golden, crispy Rushan (fried milk fan cheese) bursts with a rich dairy aroma and crunch, leaving a sweet milky aftertaste. Paired with spicy, juicy grilled pork belly and a locally crafted rose mint cocktail, it hits a perfect balance between richness and refreshing light notes, drawing many hipsters and music lovers.", "name": "Erhai Wake Up - Seaview Music Bistro", "transport": "Take Bus C2 from the East Gate of Dali Ancient Town to the Caicun Pier terminus, then walk for about 6 minutes."}, {"address": "No. 88, Lower Section of Foreigner Street, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | A highly acclaimed local restaurant in Dali Ancient Town featuring quaint courtyard scenery. The \u0027Snow Mountain Spring Tofu\u0027 uses premium local soybeans and spring water; fried to a light golden crisp on the outside and silky soft like tofu pudding inside, dipped in secret spicy sauce, it bursts with soybean and chili aromas. The \u0027Stir-fried Eggs with Water Cabbage Flowers\u0027 uses an aquatic plant unique to Erhai Lake, offering a crisp, tender, and naturally sweet taste. A top-tier feast not to be missed for experiencing authentic Yunnan cuisine.", "name": "Yunxueli Restaurant (Dali Branch)", "transport": "Walk to the middle section of Foreigner Street (Yangren Street) in Dali Ancient Town, near the Foreigner Street archway."}, {"address": "No. 302, Lower Section of Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | A popular hot spot to experience traditional Dali slate grill and Bai ethnic flavors. The \u0027Cangshan Wild Mushroom Slate Grill\u0027 uses natural shale heated to sizzle fresh matsutake, porcini, and fragrant pork belly. The mushrooms absorb the savory meat juices, rendering them tender, juicy, and crisp. Paired with house-made dipping sauces (spicy and sour), it delivers rich, multi-layered tastes. The warm, lively atmosphere of sitting around the stone grill is loved by friends and family gatherings.", "name": "Friends Dali Stone Grill \u0026 Bai Cuisine", "transport": "Walk along Renmin Road in Dali Ancient Town towards Erhai Gate for about 8 minutes."}, {"address": "No. 58 Guangwu Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | A cozy bistro combining traditional Yiliang roast duck techniques with home-style Bai dishes. The \u0027Dali Herb Crispy Roast Duck\u0027 uses local paddy-field ducks, marinated in special herbs and roasted in a hanging oven; the duck skin turns golden and crunchy while the meat stays tender, juicy, and subtly fragrant with natural herbs. The restaurant also offers a wide variety of Yunnan craft beers and fruit wines\u2014pairing crisp roast duck with slightly sweet and tart Diaomei plum wine is an absolute delight praised by local foodies.", "name": "Lucky Duck - Dali Local Restaurant", "transport": "Walk within Dali Ancient Town to Guangwu Road, near the intersection with Yuer Road."}, {"address": "Near Three Pagodas Scenic Area, Cangshan Avenue, Dali Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | A serene and elegant private scenic bistro nestled by tea plantations at the foot of Mount Cangshan. The \u0027Tea-Fragrant Cured Beef\u0027 stir-fries local Dali plateau cured beef with high-mountain green tea; the meat is dry, savory, and chewy, becoming more fragrant with every bite while the fresh tea cuts through the richness. The \u0027Solomon\u0027s Seal \u0026 Wild Mushroom Duck Soup\u0027 is sweet and nourishing, with wild mushroom umami deeply infused into the broth. Enjoy the traditional Bai Three-Course Tea (bitter first, sweet second, reflective aftertaste) after your meal for a deep cultural and culinary experience.", "name": "Mo Cui Tea House \u0026 Bai Private Cuisine", "transport": "Taking a taxi or chartering a car to Cangshan Avenue near Chongsheng Temple Three Pagodas Scenic Area is recommended."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Jizhao Temple, Southern Slope of Shengying Peak, Cangshan Mountain, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Known as China\u0027s most beautiful nunnery, Jizhao Temple is equally famous for its delicious vegetarian meals. The dishes focus on freshly picked local seasonal vegetables and soy products. The broths are naturally sweet, and the dishes are refreshing without being greasy. Highlights include the signature mixed vegetarian dish and braised shiitake mushroom rice, where every grain absorbs the rich earthy aroma of mushrooms with a subtle hint of wood-fired smoke. Eating here offers a taste of the purest natural flavors, making it a favorite among both tourists and locals alike.", "name": "Jizhao Temple Vegetarian Buffet", "transport": "Take the Gantong Cableway to the halfway station and walk for about 20 minutes, or take a taxi from Dali Ancient Town to Gantong Temple parking lot and hike up the mountain."}, {"address": "Near the intersection of Renmin Road and Bo\u0027ai Road, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | A unique vegetarian hot pot featuring a rich, reddish broth infused with Tibetan tea that releases a delicate tea fragrance. Dipping Dali\u2019s signature fresh wild mushrooms, tofu skin, and high-altitude seasonal greens into the broth renders them tender, flavorful, and richly layered. The restaurant boasts an elegant, Zen-inspired traditional ambiance. Paired with house-made sesame sauce and chili paste, it offers a refreshing yet warming meal that is hugely popular for healthy dining in the ancient town.", "name": "Yi Ye Yi Shi Jie Tibetan Tea Vegetarian Hot Pot", "transport": "Walkable within Dali Ancient Town, or take the ancient town sightseeing shuttle and get off at the Renmin Road intersection."}, {"address": "Inside Chongsheng Temple Three Pagodas Scenic Area, Northern Suburbs of Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Located inside the iconic Chongsheng Temple Three Pagodas scenic area, this restaurant strictly uses natural organic ingredients and fresh mountain spring water. Highly recommended are the vegetarian \u0027lion\u0027s head\u0027 meatballs and wild mushroom soup. The meatball has a firm yet tender bite that absorbs the savory mushroom broth, melting in your mouth with a delightful sweet aftertaste. Prepared with low oil and salt to preserve natural flavors, it is the perfect serene spot to enjoy a meal after exploring the ancient temple.", "name": "Chongsheng Temple Three Pagodas Vegetarian Restaurant", "transport": "Take Dali City Bus Three Pagodas Special Line or Bus No. 19 to Chongsheng Temple Three Pagodas Station."}, {"address": "Middle Section of Yuer Road, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Offers an abundant and affordable vegetarian buffet with dozens of stir-fried dishes, dim sum, soups, and local Dali snacks. The freshly fried vegetarian spring rolls and dumplings are praised for their thin wrappers, generous fillings, and delightfully crispy skin that pairs amazingly with custom Yunnan dipping sauces. Bright and clean, its exceptional value for money and comforting home-cooked taste draw large crowds of backpackers and hipsters alike.", "name": "Yi Su Yi Tian Tang Vegetarian Buffet", "transport": "Take the Dali Ancient Town sightseeing shuttle to Yuer Road Station, or reach on foot within the ancient town."}, {"address": "Inside Wuwei Temple, Eastern Slope of Lanfeng Peak, Cangshan Mountain, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Tucked away deep in Cangshan Mountain, Wuwei Temple serves vegetarian meals that preserve the most traditional Dali temple flavor. Cooked in large wood-fired cauldrons, the mixed vegetables and tofu soup carry a subtle smoky aroma. The tofu is soft and dense, while the vegetables remain sweet, crisp, and fresh. Free from heavy seasonings, the pure fragrance of fresh ingredients and natural sweet spring water provides a spiritual and culinary cleansing in a tranquil mountain setting.", "name": "Wuwei Temple Vegetarian Meal", "transport": "Take a taxi from Dali Ancient Town to the foot of Wuwei Temple hill, then hike up the walking trail for about 30 minutes."}, {"address": "Lower Section of Foreigner Street (Yangren Street), Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 Stars | This elegant restaurant is renowned for creative vegetarian cuisine, artfully blending traditional Yunnan ingredients with modern culinary techniques. The signature \u0027Truffle \u0026 Wild Mushroom Pot\u0027 uses premium local wild mushrooms cooked in a rich, flavorful broth with a delightfully springy texture. The \u0027Rainbow Vegetarian Rice Noodles\u0027 are crafted with natural vegetable juices, presenting vibrant colors and a smooth, refreshing taste. Its stylish ambiance and exquisite presentation make it a hit among young foodies and international travelers.", "name": "Su Xin Xuan Vegetarian Restaurant", "transport": "Walkable within the Foreigner Street pedestrian area in Dali Ancient Town."}, {"address": "Guangwu Road, Dali Ancient Town, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Focusing on an organic and healthy concept, this cozy local diner sources fresh organic vegetables daily from Dali\u0027s farmers\u0027 markets. Highlights include the \u0027Yunnan Specialty Tofu Feast\u0027 and \u0027Stir-Fried Wild Fir Mushrooms\u0027. The tofu is crispy on the outside, tender inside, and bursting with rich soy aroma, while the savory fir mushrooms offer a satisfyingly layered flavor that rivals meat dishes. With its homey atmosphere and wholesome cooking, it is a comforting haven for health-conscious diners in Dali.", "name": "Jingxin Vegetarian Restaurant", "transport": "About a 10-minute walk from the South Gate of Dali Ancient Town."}, {"address": "Near Caicun Pier, Huanhai West Road, Erhai Lake, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Blending garden views with Zen-inspired vegetarian fare, this charming spot serves delicate set meals and afternoon tea. The standout \u0027Bamboo Fungus \u0026 Wild Mushroom Soup\u0027 features fresh bamboo fungus and high-altitude mushrooms in a light, flavorful broth, leaving the bamboo fungus crisp, juicy, and steeped in flavor. Paired with handmade vegetarian Yunnan ham mooncakes and white tea, it offers an elegant dining experience\u2014perfect for unwinding and savoring tranquil cuisine after admiring Erhai Lake.", "name": "Xintian Huakai Vegetarian Restaurant", "transport": "Take Dali City Bus C2 to Caicun Pier Terminal, then walk for about 5 minutes."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 198 Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Located near Honglong Well in Dali Ancient Town, this famous eatery is synonymous with cold rice noodles for countless tourists and locals alike. Made from high-quality rice batter, the noodles are smooth, chewy, refreshing, and never sticky. The shredded chicken is tender and deeply seasoned, topped with rich peanut sauce, specially blended flavored vinegar, and secret red chili oil, then sprinkled with crispy crushed peanuts and pickled vegetables. The first bite offers the dense aroma of peanut sauce, followed by a kick of refreshing sour and spicy flavors. The perfect blend of sweet, sour, spicy, and numbing elements creates a wonderfully layered taste. A bowl of these noodles is extremely appetite-stimulating on a hot day\u2014an absolute must-try classic street food while strolling through the ancient town.", "name": "Zai Hui Shou Cold Chicken Rice Noodles", "transport": "Take the Dali Ancient Town Sightseeing Bus to Renmin Road Intersection Station, then walk about 3 minutes."}, {"address": "No. 118 Fuxing Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Rushan (milk fan) is a unique traditional dairy product of the Bai ethnic group, and long queues are always seen at this historic stall on Fuxing Road. The stall owner gently roasts paper-thin rhombus-shaped rushan over charcoal. As it heats up, the cheese softens, expands, and emits a rich milky aroma, before being spread with Dali\u0027s signature highland rose jam and quickly rolled into a stick. Biting into it reveals a slightly crispy exterior and a stringy, wonderfully chewy cheese interior, combining rich hot milk aroma with the sweet fragrance of rose jam. The sweet and savory interplay with multi-layered textures makes it the perfect handheld walking snack while exploring Dali Ancient Town.", "name": "Yang\u0027s Charcoal Grilled Rushan (Cheese Fan)", "transport": "Walk to the Fuxing Road pedestrian street section of Dali Ancient Town, near the Foreigner Street (Yangren Street) intersection."}, {"address": "Next to Sifang Square, Xizhou Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Xizhou Baba is a traditional wheat-flour flatbread of the Bai people in Dali. This small stall insists on using the traditional technique of baking with heat simultaneously from both above and below using charcoal. The baba comes in two flavors: sweet (red bean paste and rose) and savory (fresh minced pork and scallions). Fresh out of the oven, the crust turns golden yellow. The layered crisping technique makes the outer crust extraordinarily crispy with an audible crunch at first bite, while the inside remains soft and springy. The savory version bursts with rich meat juice and scallion aroma, while the sweet version is delicate, smooth, and non-sticky. This crispy-on-the-outside, soft-on-the-inside, juicy texture makes it a favorite street snack for both tourists and locals.", "name": "Xizhou Crispy Baba", "transport": "Take the Xizhou Minibus Line from Dali Ancient Town to Xizhou Ancient Town, then walk to Sifang Square."}, {"address": "Stall at the entrance of Foreigner Street (Yangren Street), Huguo Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Erkuai is an iconic rice-based snack in Dali, made by steaming and pounding high-quality rice. The vendor slow-roasts thin, round erkuai sheets over smokeless charcoal until the surface turns lightly charred and puffed. Customers can choose from spicy sauce, sweet bean sauce, or peanut sauce, which is then wrapped around freshly grilled Yunnan Dali sausage, fried dough sticks (youtiao), pickled vegetables, and cilantro, then rolled into a cylinder. The exterior is aromatic, chewy, soft, and elastic, while the inside combines juicy grilled sausage with crispy fried dough. A burst of mixed sauces in the mouth creates a delightful mix of savory, sweet, sour, and spicy flavors, making it a top choice for locals\u0027 breakfast or late-night snacks.", "name": "Charcoal Baked Erkuai with Sausage", "transport": "Take Ancient Town Bus Line 1 to Yangren Street Station, then walk about 2 minutes."}, {"address": "Intersection of Bo\u0027ai Road and Renmin Road, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Baojiang Tofu (Lava Tofu) is an authentic Yunnan specialty snack. This small stall grills pieces of tender white tofu on a high-temperature stone plate until both sides turn golden and crisp. The magic lies in its outer skin, which is grilled to a golden crispiness, while the inside retains a molten, pudding-like liquid center. Taking a hot bite explodes rich soybean aroma in your mouth, enhanced by a generous sprinkle of custom Yunnan dipping powder (charred chili powder, Sichuan pepper powder, crushed peanuts, houttuynia cordata, and chopped scallions). Crispy outside and silky inside, numbingly spicy and savory, it delivers an astonishing taste experience beloved by spice lovers and food enthusiasts.", "name": "Stone Plate Grilled Lava Tofu (Baojiang Tofu)", "transport": "Walk to the central area of Dali Ancient Town; it is located right at the intersection of Bo\u0027ai Road and Renmin Road."}, {"address": "Stall along Erhai Ecological Corridor, Huanhai East Road, Shuanglang Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Located along the Erhai Shuanglang Ecological Corridor, this fresh deep-fried snack stall uses live small shrimp and fish caught fresh daily from Erhai Lake. Fresh small shrimp are mixed with a thin batter, chopped scallions, and signature Yunnan spices, then ladled into bubbling hot oil to fry until golden and crispy. Served hot, the fried shrimp cakes are incredibly fragrant and crispy; the shells are fried soft enough to eat whole, while the shrimp meat is fresh, sweet, and completely free of fishiness. Finished with a light dusting of pepper salt and custom chili powder, it balances sweet, savory, and spicy flavors\u2014an irresistible seafood street snack to grab while biking or walking along Erhai Lake.", "name": "Erhai Deep-Fried Lake Shrimp \u0026 Fish Cake", "transport": "Walk from Shuanglang Ancient Town to the Erhai Ecological Corridor, and you will find it along the coastal boardwalk."}, {"address": "March Street Market Area, Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | \u0027Diaomei\u0027 (carved plum), a specialty of Eryuan in Dali, is crafted using traditional Bai techniques by carving intricate patterns into green plums and pickling them with honey. This market stall ingeniously infuses the sweet-and-sour fruity aroma of carved plums into authentic Yunnan pickled chicken feet. Marinated for hours, the boneless chicken feet are chewy and springy, absorbing rich, sour-spicy juices infused with plum aroma in every bite. The initial taste brings the refreshing sweet-sour flavor of green plums and honey, followed by the mild spice of wild mountain peppers and the chewy texture of chicken feet. Refreshing, appetizing, and rich in flavors, it is wildly popular among tourists as a walking snack or a late-night drinking bite.", "name": "Diaomei Pickled Chicken Feet \u0026 Dali Sour \u0026 Spicy Plums", "transport": "Take the Ancient Town Sightseeing Bus to March Street Intersection, then walk into the market snack area."}, {"address": "No. 88 Foreigner Street (Yangren Street), Dali Ancient Town, Dali City, Dali Bai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.2 stars | Combining Yunnan\u0027s famous wild mushrooms with modern creative desserts, this viral street snack stall breaks all boundaries of traditional sweets. The vendor extracts essences from black truffles and matsutake mushrooms, blending them into rich fresh milk to create unique matsutake ice cream, served with locally grown sweet peach jelly and crunchy crushed nuts. The ice cream has a smooth and velvety texture: the first taste reveals rich milkiness, followed by elegant, subtle woody notes of matsutake. Sweet without being cloying, it creates a striking contrast with the chewy, refreshing peach jelly at the bottom. This unique yet surprising flavor draws countless young tourists seeking a novel culinary experience to check in and post online.", "name": "Yunnan Wild Mushroom Ice Cream \u0026 Peach Jelly", "transport": "Walk to the middle section of Foreigner Street (Yangren Street) in Dali Ancient Town, near the Bar Street entrance."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dali Ancient Town and Erhai Lake Scenic Area"}, "jianshui_ancient_town": {"categories": {"cat_1": {"items": [{"address": "No. 145 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | As the most iconic state-owned heritage restaurant in Jianshui Ancient Town, it has preserved unchanged traditional Southern Yunnan flavors for decades. The signature Steam Pot Chicken is cooked for several hours in Jianshui\u0027s unique purple pottery steam pot. The chicken soup is golden, clear, and exceptionally delicious, with tender, springy meat carrying subtle herbal notes. Another must-order is the stir-fried grass sprouts (caoya), which are extremely crisp and juicy, offering a sweet bite that showcases the ultimate appeal of this \u0027ivory vegetable\u0027. The nostalgic ambiance and authentic craft of this establishment draw countless food lovers.", "name": "Lin\u0027an Restaurant", "transport": "Take the Jianshui Ancient Town sightseeing shuttle to the mid-section of Lin\u0027an Road, then walk for about 2 minutes."}, {"address": "No. 42 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Located inside a traditional ancient courtyard on Hanlin Street, Xiangmanlou is renowned for its refined home-style Ancient Town dishes and antique dining atmosphere. The grilled tofu here features a golden, crispy exterior with a smooth, delicate curd-like center. Paired with special dry chili powder and fermented bean curd dip, it delivers distinct layers of salty, spicy, and savory flavors. The Steam Pot Chicken and stir-fried sliced pork with grass sprouts are equally outstanding\u2014the chicken melts in your mouth while the crisp grass sprouts cut through any richness. It is a top choice for tourists seeking authentic Jianshui traditional cuisine.", "name": "Xiangmanlou Restaurant", "transport": "About a 3-minute walk from Zhujia Garden Scenic Spot."}, {"address": "Next to Daban Well, West Gate, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Located next to the famous West Gate Daban Well, this historic tofu workshop uses centuries-old ancient well water to craft its tofu. The freshly made Daban bean curd melts in your mouth, bursting with an immensely rich and sweet soy flavor that tastes divine whether paired with simple syrup or savory sauces. The freshly cooked crispy-crust tofu is golden outside and soft inside, releasing a rich aroma with every bite. Featured on \u0027A Bite of China\u0027, this spot is not only a tourist favorite but a cherished childhood memory for locals.", "name": "Banjing Tofu Workshop", "transport": "Take a taxi from West Gate Chaoyang Tower or walk about 15 minutes to Daban Well."}, {"address": "Near Yinghui Road, Ximen Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | A traditional roast tofu stall near the West Gate of Jianshui Ancient Town that has stuck to slow charcoal grilling for decades. The small corn-grain-shaped tofu pieces puff up like ping-pong balls on the iron grate, yielding a crispy exterior and a hollow, tender, creamy interior. The owner\u0027s unique traditional method of tallying tofu using corn kernels is delightful to watch. Dipped in house-made sauce (including spicy chili powder, crushed peanuts, and fermented bean curd), the rich, savory, and spicy flavor is utterly addictive.", "name": "Yaojia Roast Tofu", "transport": "Walk to the west side of Chaoyang Tower on Lin\u0027an Road, then head toward West Gate for about 5 minutes."}, {"address": "No. 264 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | This heritage restaurant perfectly combines Jianshui\u0027s national intangible cultural heritage\u2014purple pottery\u2014with its famous steam pot chicken. The shop carefully selects local free-range chickens and adds no water at all, relying entirely on steam condensing inside the purple pottery pot to form the broth. The chicken soup is pure and clear, topped with a glistening golden layer, tasting immensely sweet and satisfying with a lingering finish. The chicken meat is fall-apart tender. The elegant traditional ambiance and exquisitely flavorful soup leave countless visitors enchanted.", "name": "Wangyuelou Purple Pottery Steam Pot Chicken", "transport": "Located in the core area of Lin\u0027an Old Street, about an 8-minute walk from Chaoyang Tower."}, {"address": "Next to Zhujia Garden, Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 Stars | A beloved local shop specializing in Jianshui\u0027s signature grass sprout rice noodles. The rich broth is slow-simmered for hours using pork bones and free-range old hens, resulting in a deep, flavorful soup that is rich yet non-greasy. Slices of ivory-white grass sprouts blanket the bowl, offering an exceptionally crisp and sweet texture that pairs delightfully with smooth, springy Jianshui rice noodles and tender meat slices. Every bite showcases the wonderful interplay of grass sprouts and broth, making it a fantastic choice to experience Jianshui\u0027s breakfast culture.", "name": "Old Lin\u0027an Caoya Rice Noodle Shop", "transport": "Walk to diagonally opposite the main entrance of Zhujia Garden."}, {"address": "No. 17 Hongjing Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Tucked away in a quiet alley of the ancient town, this courtyard house restaurant serves authentic traditional Jianshui home-style cuisine. Its signature dish, \u0027Stir-fried Sliced Pork Kidney with Grass Sprouts,\u0027 balances crisp grass sprouts with tender pork kidney, cooked with masterful heat control. The roast duck features a golden, crispy skin and juicy meat, enhanced further when paired with special plum sauce. Surrounded by greenery in an elegant, rustic traditional courtyard, diners can savor authentic Yunnan delicacies while soaking in the rich historical ambiance.", "name": "Mokezhan Traditional Restaurant", "transport": "Turn onto Hongjing Street from Hanlin Street and walk for about 3 minutes to spot the sign."}, {"address": "Near Shizikou, Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | A century-old establishment located near Shizikou in the ancient town, famed for its traditional charcoal-hung roast duck. Premium Southern Yunnan spotty ducks are marinated with special spices and slowly roasted over charcoal. The skin turns an enticing jujube red\u2014crisp and flavorful\u2014while the meat is rich, firm, and infused with charcoal aroma. Paired with the secret sweet-and-sour spicy dipping sauce, it effectively cuts through the richness and enhances the duck\u0027s natural sweetness. It is a traditional staple bought by locals during holidays and for entertaining guests.", "name": "Shizikou Old Roast Duck Restaurant", "transport": "Take the Ancient Town sightseeing shuttle to Shizikou Station, then walk for about 1 minute."}], "name": "Iconic Local Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 23 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Set within a traditional courtyard building in Jianshui Ancient Town, this cafe seamlessly blends Southern Yunnan residential charm with a modern art gallery atmosphere. It is a favorite among tourists and young locals for enjoying a pour-over Yunnan Arabica coffee paired with freshly baked small tofu waffles and Yunnan-style brunch light bites. The pour-over coffee features a well-balanced sweet and sour flavor profile with rich fruity and nutty undertones. Surrounded by lush greenery in an antique courtyard, it\u0027s the perfect spot to soak in the slow-paced charm of Lin\u0027an Old Street.", "name": "Lin\u0027an Story Cafe", "transport": "About a 3-minute walk to Chaoyang Tower."}, {"address": "No. 45 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A unique brunch cafe that deeply integrates Jianshui\u0027s national intangible cultural heritage\u2014Purple Pottery\u2014with specialty coffee. All coffee cups used in the shop are handcrafted by local pottery masters, with thick clay walls that perfectly trap the warmth and aroma of the coffee. Recommended signature pairing: \u0027Purple Pottery Pour-Over Arabica\u0027 with custom \u0027Yunnan Rose Basque Cheesecake\u0027. Smooth and creamy, the subtle bitterness of the coffee blends delightfully with elegant rose notes, creating a rich layered flavor highly praised by trendy youth.", "name": "Jianshui Purple Pottery Time Cafe", "transport": "About a 5-minute walk from Zhu Family Garden."}, {"address": "No. 18 Hongjing Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Hidden inside a beautifully carved ancient house down the alleys of Lin\u0027an Old Street, this cafe preserves a century-old traditional courtyard and carved wooden windows. It serves exquisite East-meets-West brunch options, such as the \u0027Yunnan Ham \u0026 Cheese Croissant\u0027 paired with a \u0027Vanilla Latte\u0027. The croissant features a golden, crispy crust filled with rich, savory Xuanwei ham, complemented by a silky, velvety latte foam. Tucked away from the busy streets, dining under the central courtyard pavilion offers pure tranquil poetry.", "name": "Poetic Dwelling Courtyard Cafe", "transport": "Take the Ancient Town sightseeing minibus, get off at Hongjing Street intersection, and walk for 2 minutes."}, {"address": "No. 8 Alleyway next to Daban Well, Ximen, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | An independent cafe inspired by the pristine well water culture of Jianshui\u0027s famous Daban Well. The shop carefully selects high-altitude Arabica beans from Baoshan and Pu\u0027er, Yunnan, skillfully roasting them for cold drips and specialty drinks. The must-try \u0027Ancient Well Specialty Cold Brew\u0027 is crisp and refreshing, featuring citrus notes and a sweet wine-like fermented undertone. Paired with their homemade \u0027Rubing (Goat Cheese) Sandwich\u0027, the sweet and savory cheesy textures create an unforgettable taste highly popular with young travelers.", "name": "Ancient Well Fate Coffee", "transport": "Just a 1-minute walk from Ximen Daban Well."}, {"address": "No. 152 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Exuding a nostalgic vintage vibe, this cafe is filled with old-fashioned radios and antique photographs, freezing time as if decades ago in ancient Lin\u0027an. Brunch offerings include \u0027Yunnan Brown Sugar Latte\u0027 and \u0027Whole Wheat Avocado Smoked Chicken Toast\u0027. The latte is topped with traditionally brewed Yunnan brown sugar, torched to form a crispy caramelized crust that offers an initial sweet aroma followed by smooth, robust espresso\u2014fun, distinct, and authentic.", "name": "Time \u0026 Era Independent Cafe", "transport": "About an 8-minute walk from Chaoyang Tower in Jianshui Ancient Town."}, {"address": "No. 88 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Renowned for its daily fresh-baked European sourdough breads and freshly ground coffee, this cozy spot is one of the few high-quality brunch eateries in the ancient town. The signature \u0027Yunnan Wild Mushroom Quiche\u0027 features a golden, crispy crust filled with local wild mushrooms and savory custard for a remarkably tender, delicious bite. Pair it with an \u0027Oat Milk Dirty Coffee\u0027 to experience the satisfying clash of hot coffee crema and cold rich oat milk.", "name": "Stroll Lin\u0027an Bakery \u0026 Cafe", "transport": "Located near Yinghui Gate, about a 4-minute walk."}, {"address": "2nd Floor, Intersection of Guilin Street and Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Perched on the second floor of a corner intersection in the ancient town, this scenic cafe features large wooden-framed windows overlooking the bustling crowds and cobblestone streets of Lin\u0027an Old Street. Highlights include the smooth \u0027Flat White\u0027 and the \u0027Handmade Flower Cake Brunch Platter\u0027. Served warm, the fresh flower cakes have flaky, layered crusts packed with edible fresh rose petals\u2014aromatic, delicately sweet, and satisfying.", "name": "Corner Meet Cafe", "transport": "About a 3-minute walk to the main entrance of Zhu Family Garden."}, {"address": "No. 12 Guandimiao Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | A concept light-bite cafe blending local Yunnan Pu\u0027er tea culture, solid wood craftsmanship, and specialty coffee. Brunch highlights include the \u0027Pu\u0027er Tea Infused Latte\u0027 and the \u0027Yunnan Peach Yogurt Bowl\u0027. The latte ingeniously combines the earthy richness of aged Pu\u0027er tea with roasted espresso notes, leaving a pleasant lingering sweet finish. The yogurt bowl is topped with fresh local fruits and nuts, offering a tangy, refreshing, and healthy treat popular with female travelers.", "name": "Yun Cha Ka Wood Art \u0026 Coffee", "transport": "About a 2-minute walk from Guandi Temple."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "No. 273 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Housed in a century-old historic building on Lin\u0027an Road in Jianshui Ancient Town, this classic restaurant preserves the Ming and Qing courtyard architecture. A must-try dish here is the \u0027Steam Pot Chicken,\u0027 slow-cooked in traditional Jianshui purple pottery, yielding a clear, sweet broth and tender, flavorful chicken. Pair it with the unique \u0027Saut\u00e9ed Pork Slices with Grass Sprouts\u0027\u2014crisp like bamboo shoots but even sweeter. The restaurant also serves local house-made peach blossom wine and bayberry wine, offering a visual and culinary feast in an antique courtyard that is loved by both tourists and local family gatherings.", "name": "Xiangmanlou Restaurant", "transport": "Walk to the middle section of Lin\u0027an Road in Jianshui Ancient Town; located about 500 meters from Chaoyang Tower."}, {"address": "Next to Chaoyang Tower, Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Bursting with southern Yunnan charm, this bistro seamlessly weaves Jianshui\u0027s historical stories into its culinary creations. The signature \u0027Jianshui Grilled Tofu\u0027 is crispy on the outside, soft inside, rich in soy flavor, and served with a custom dipping sauce for layered flavors. The \u0027Steam Pot Grass Sprout Fish\u0027 combines fresh fish with local wild herbs, resulting in a rich and savory broth. In the evening, savor house-made glutinous rice wine and green plum wine with a delightful sweet-sour kick. Enhanced by antique decor and atmospheric lighting, it\u0027s a top choice for tourists seeking an authentic local dining and drinking culture.", "name": "Lin\u0027an Story Restaurant", "transport": "Take the Jianshui Ancient Town Sightseeing Shuttle to Chaoyang Tower Station, then walk for about 2 minutes."}, {"address": "No. 78 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Converted from a historical residence, this local restaurant offers an elegant atmosphere imbued with traditional southern Yunnan courtyard charm. Signature highlights include \u0027Purple Pottery Steam Pot Spare Ribs\u0027 and \u0027Glutinous Rice Sausage.\u0027 The ribs are tender, juicy, and subtly infused with the earthy aroma of purple clay. The restaurant also serves various traditional home-brewed local fruit wines, smooth and sweet on the palate. It is an exceptional spot to savor Jianshui\u0027s slow-paced lifestyle and authentic private home cooking.", "name": "Yao Family Courtyard Restaurant", "transport": "About a 3-minute walk from Zhu Family Garden."}, {"address": "No. 12 Jianmin Alley, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A cozy private bistro blending a lush floral courtyard with exquisite local cuisine, creating a romantic and relaxing setting. The signature \u0027Stir-fried Wild Mushrooms with Cured Pork\u0027 features wild mountain mushrooms from Yunnan, perfectly balanced with savory local cured bacon. The \u0027Jianshui Purple Pottery Steam Pot Fish\u0027 is tender, smooth, and flavorful. At night, it transforms into a charming tavern serving signature cocktails infused with local Yunnan fruits and house-brewed craft beers, making it a huge hit among young travelers.", "name": "Garden Courtyard Bistro", "transport": "Located in an alley of Jianshui Ancient Town; recommended to walk about 5 minutes in from Hanlin Street."}, {"address": "No. 310 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A specialty restaurant dedicated to elevating Jianshui\u0027s signature local ingredient\u2014\u0027grass sprouts\u0027\u2014to perfection. The flagship \u0027Stir-fried Grass Sprouts\u0027 is exceptionally crisp, juicy, and naturally sweet, locally praised as \u0027ivory vegetable.\u0027 Pair it with classic \u0027Jianshui Roast Duck,\u0027 featuring crispy skin, tender meat, and rich aromatic fat, served alongside sweet bean sauce and salt-and-pepper mix. Guests also enjoy a complimentary glass of aromatic house-brewed rose sweet wine, highly praised by locals and food enthusiasts alike.", "name": "Grass Sprout Maiden Local Cuisine", "transport": "Walk to near the intersection of Lin\u0027an Road and Hanlin Street."}, {"address": "No. 15 Hongjing Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | This long-standing local eatery is famous for authentic Jianshui purple pottery steam pot chicken. Made without adding a single drop of water, the pure and rich chicken broth is formed entirely from condensed steam. Using local free-range chicken, the meat remains tender and juicy, while the soup is exceptionally sweet and savory. Refreshing options like \u0027Papaya Seed Jelly Water\u0027 and \u0027Local Rice Wine\u0027 serve as perfect palate cleansers. Excellent value and authentic flavor make this a top choice for experiencing classic Yunnan cuisine.", "name": "Weizhiyuan Steam Pot Chicken Restaurant", "transport": "About an 8-minute walk from Jianshui Confucius Temple."}, {"address": "No. 16 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Adjacent to the famous Zhu Family Garden, this upscale venue offers traditional southern Yunnan royal court recipes and private local specialties. The signature \u0027Stewed Pig\u0027s Trotter with Rutabaga\u0027 features a rich, savory soup and tender, collagen-packed trotters. The \u0027Yunnan-style Stir-fried Pork\u0027 is savory, spicy, and perfectly paired with steamed rice. Recreating the affluent dining ambiance of the late Qing and early Republican eras, the kitchen offers fine tea and liquor pairings featuring ancient-tree tea and sorghum Baijiu for a culturally immersive dining experience.", "name": "Zhu Family Garden Private Kitchen", "transport": "Take the Ancient Town Tourist Bus Line to Zhu Family Garden Station."}, {"address": "No. 88 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A popular restaurant seamlessly blending a trendy bistro atmosphere with traditional southern Yunnan cuisine. A must-try highlight is the \u0027Baojiang Tofu\u0027 (Juicy Stuffed Tofu), pan-fried golden and crispy on the outside while remaining silky and molten on the inside, bursting with rich soybean flavor in every bite. Pair it with aromatic \u0027Dried Mushroom Fried Rice.\u0027 The restaurant also features a bar offering low-proof specialty cocktails crafted with high-mountain Yunnan honey, roses, and corn liquor. Stylish plating and a relaxed vibe make it a nighttime hotspot in the ancient town.", "name": "Yishaodian Local Restaurant", "transport": "Located about 300 meters from Yinghui Gate of the Ancient Town; approximately a 4-minute walk."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 58 Hanlin Street, Lin\u0027an Town, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Located in the heart of Jianshui Ancient Town, this vegetarian hall is famous for its exceptionally high-value vegetarian buffet. The restaurant carefully selects local wild mushrooms, high-mountain seasonal vegetables, and premium tofu to prepare dozens of distinct plant-based delicacies. Highly recommended are the \u0027Stir-fried Wild Fir Mushrooms\u0027 and \u0027Steamed Mixed Grains\u0027, which offer crisp, sweet, and layered flavors. Both locals and tourists love dining here to experience pure, guilt-free local vegetarian cuisine.", "name": "Xiangman Ting Vegetarian Restaurant (Jianshui)", "transport": "Take the Jianshui Ancient Town sightseeing train to Lin\u0027an Station, then walk for about 8 minutes."}, {"address": "No. 128 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Situated next to Lin\u0027an Old Street, this elegant vegetarian restaurant is steeped in a serene Zen ambiance. The menu highlights refined vegetarian adaptations of traditional Jianshui roasted tofu and elephant grass shoots (Caoya). The signature \u0027Stir-fried Jianshui Grass Shoots\u0027 is incredibly crisp, tender, and sweet\u2014as refreshing as a peach\u2014while the \u0027Zen Roasted Tofu\u0027 boasts a crispy exterior and a silky, tofu-pudding-like interior. Served with special spicy dipping powder, it delights many visiting tourists.", "name": "Lin\u0027an Fu Vegetarian House", "transport": "Walk to the central section of Lin\u0027an Old Street, located about 350 meters west of Chaoyang Tower."}, {"address": "No. 16 Hanlin Street (Next to Zhu Family Garden), Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Adjacent to the Qing Dynasty Zhu Family Garden, the dining setting feels like being inside a classical garden. The restaurant refuses to use synthetic mock meats, relying entirely on natural ingredients. The \u0027Traditional Steam Pot Vegetarian Soup\u0027 is a must-try, slow-cooked in Jianshui purple pottery steam pots with wild mushrooms and bamboo fungus. The broth is sweet, flavorful, and richly refreshing, while the tender bamboo fungus absorbs every drop of the savory essence\u2014a favorite among health-conscious foodies and cultural travelers.", "name": "Zhu Family Garden Vegetarian Restaurant", "transport": "Walk for about 5 minutes along Hanlin Street from Chaoyang Tower."}, {"address": "No. 22 Wenmiao Road, Lin\u0027an Town, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A quiet vegetarian eatery near the Jianshui Confucius Temple scenic area, dedicated to promoting healthy and nourishing plant-based food. Its signature \u0027Vegetarian Rice Noodles\u0027 features noodles made with premium local Jianshui well water, paired with a rich mushroom broth and fresh seasonal vegetables. The soup is savory and smooth, while the noodles are delightfully springy. The crispy \u0027Vegetarian Spring Rolls\u0027, stuffed with shredded grass shoots and wood ear mushrooms, offer distinct textures, making it a beloved dining spot for local seniors.", "name": "Confucius Temple Suxin Zhai", "transport": "Take Jianshui Bus Route 1 to \u0027Wenmiao Station\u0027, then walk for about 3 minutes."}, {"address": "No. 18 Guangci Road (Guangci Lakefront), Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Built along the lakefront, this vegetarian tea house offers a dual experience combining Jianshui purple pottery tea arts with refined vegetarian dishes. The \u0027Wild Mushroom Vegetarian Hotpot\u0027 features prized mushrooms like boletes and morels cooked in a rich, sweet broth. The mushrooms are silky yet chewy with a unique earthy fragrance. Guests can savor healthy vegetarian food while admiring the views of Guangci Lake, making it a top choice for tourists seeking relaxation.", "name": "Guangci Lake Vegetarian \u0026 Tea House", "transport": "Take a taxi for about 5 minutes from the Ancient Town area to reach the Guangci Lake Scenic Area."}, {"address": "Adjacent to Chaoyang Tower Scenic Area, Chaoyang Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A long-standing local shop specializing in pure vegetarian Jianshui roasted tofu, located right beneath the ancient Chaoyang Tower city gate. The shop insists on using natural well water to curdle the tofu and roasts it over pure charcoal. Fresh out of the grill, the roasted tofu is golden and crispy on the outside, soft, porous, and rich in soybean aroma on the inside. Dipped into vegan spicy dry dip or sweet sauce, the juicy, slightly spicy burst of flavor is irresistibly addictive\u2014a must-try traditional snack when strolling through the ancient town.", "name": "Chaoyang Tower Vegetarian Tofu Shop", "transport": "Located right next to Chaoyang Tower at the East Gate of Jianshui Ancient Town; easily accessible on foot."}, {"address": "No. 89 Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A warm and welcoming budget vegetarian restaurant specializing in affordable local Yunnan vegetarian dishes. The signature \u0027Matsutake Fried Rice\u0027 features distinct, fragrant grains infused with the rich, unique umami of matsutake mushrooms. The \u0027Hot and Sour Vegetarian Konjac\u0027 offers a springy, refreshing texture that stimulates the appetite. Its exceptional value for money and authentic ingredients attract numerous backpackers and locals alike.", "name": "Miaoyin Vegetarian Restaurant", "transport": "Walk east along Yinghui Road from Chaoyang Tower for about 6 minutes."}, {"address": "No. 45 Guilin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A trendy light vegetarian cafe that blends indie-chic vibes with local Yunnan ingredients. Its original \u0027Grass Shoot Vegetarian Dumplings\u0027 feature thin, springy skins stuffed with Jianshui local grass shoots, shiitake mushrooms, and tofu; taking a bite releases a sweet, refreshing juice that fills the mouth. The \u0027Special Purple Rice Eight-Treasure Rice\u0027 is delightfully sweet without being cloying, with aromatic, soft sticky rice. With its elegant environment and creative plant-based dishes, this cafe has become a highly rated Instagram-worthy hotspot.", "name": "Qingxin Vegetarian Cafe", "transport": "Walk to Guilin Street within the ancient town, located near the Jianshui Ancient Well Cluster."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 76 Lin\u0027an Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Crispy on the outside, silky soft inside, bursting with rich soybean flavor! This is the most iconic soul street food of Jianshui Ancient Town. Artisans flip and grill the tofu over a small charcoal stove on the spot. The outer skin turns golden and crispy, slightly puffing up like a mini pillow, while the inside remains as soft and tender as silken tofu pudding. Dipped in special dry chili powder or savory dipping sauce, a burst of spicy, rich flavor explodes in your mouth. Locals and tourists alike love sitting around low stools to eat them hot off the grill, immersing themselves in the vibrant local atmosphere.", "name": "Xiangmanlou Charcoal Roasted Tofu", "transport": "Located in the heart of Lin\u0027an Old Street, reachable on foot."}, {"address": "Middle Section of Lin\u0027an Road Pedestrian Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Refreshing, cooling, and delightfully sweet without being cloying! Papaya Jelly (Moguashui) is Jianshui\u0027s most beloved traditional street dessert. Made by rubbing natural shoofly seeds until they set into a translucent jelly, it is served in a bowl topped with rich brown sugar syrup, toasted sesame seeds, crushed hawthorn, and rose syrup. Exceptionally silky and melt-in-your-mouth, it carries subtle rose notes and a pleasant tart-sweet balance. Having a bowl after a long warm stroll in the ancient town instantly quenches thirst and cools you down, making it a hit among tourists.", "name": "Lin\u0027an Old Street Papaya Jelly Stall", "transport": "Walk along Lin\u0027an Old Street towards Chaoyang Tower to easily spot the street stalls."}, {"address": "Next to Ximen Big Well (end of Hanlin Street), Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Silky smooth, tender, and refreshing! Jianshui Ancient Town is famous for its high-quality spring well water. Located near the Ximen Big Well, this stall insists on freshly grinding and steaming tofu pudding every day using pure spring water. Snow-white and curd-like, its texture is much finer and denser than ordinary tofu pudding, packed with a rich natural soybean aroma. You can choose sweet (with brown sugar ginger syrup) or savory (with chili oil, chopped scallions, crushed peanuts, and pickled mustard tuber). This pure, nostalgic flavor makes it an unmissable morning or afternoon snack in the traditional market.", "name": "Ximen Well Water Tofu Pudding Stall", "transport": "Walk along Hanlin Street from Chaoyang Tower for about 15 minutes to reach Ximen Big Well."}, {"address": "No. 42 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 Stars | Crispy, sweet, and melt-in-your-mouth! Lion Cake (Shizigao) is a century-old traditional pastry specialty of Jianshui. Handcrafted from high-quality glutinous rice and maltose, it is deep-fried until golden and fluffy before being pressed into shape\u2014earning its name from its surface texture resembling a lion\u0027s mane. Extremely crunchy yet tender, delightfully sweet without sticking to your teeth, it carries a rich aroma of glutinous rice and malt. Perfect as a stroll snack or a souvenir while exploring the old town, loved by both adults and children.", "name": "Traditional Jianshui Lion Cake Shop", "transport": "Located near the exit of Zhu Family Garden on Hanlin Street, accessible on foot."}, {"address": "Intersection of Lin\u0027an Road and Yinghui Road, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | Crispy outside, fluffy inside, rich and creamy! Yunnan locals have a special love for potatoes. This street stall slow-roasts whole small unpeeled potatoes over a charcoal grill until the skin turns charred and crackled. Gently peel it open to reveal piping-hot, mashed-potato-like flesh, then roll it in customized Yunnan spice powder (a mix of chili dip powder, Sichuan pepper powder, fermented tofu juice, and chopped scallions). The complex layers of savory, spicy, and numbing flavors make it addictively delicious.", "name": "Lin\u0027an Old Street Roasted Potatoes", "transport": "Take the Jianshui Ancient Town Sightseeing Tram to Chaoyang Tower Station, then walk for 3 minutes."}, {"address": "Next to Xinjie Small Farmers\u0027 Market, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | Fresh, tender, crunchy, and naturally sweet broth! Grass sprouts (Caoya) are an aquatic plant unique to Jianshui, resembling ivory tusks and tasting even sweeter and more tender than bamboo shoot tips. This famous market stall simmers freshly sliced grass sprouts in piping-hot chicken broth, paired with silky, springy Jianshui specialty rice noodles. The grass sprouts are crisp, fiberless, and juicy, blending perfectly with the rich, non-greasy broth. It is an exclusive street food delicacy that every visitor to Jianshui must try.", "name": "Jianshui Delicious Caoya Rice Noodle Stall", "transport": "Located at the entrance of the small farmers\u0027 market near the East Gate of the Ancient Town, reachable on foot."}, {"address": "No. 108 Hanlin Street, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Crispy skin, tender meat, juicy and flavorful! Traditional Jianshui roast duck is slow-roasted over charcoal in a hanging oven, yielding a beautiful jujube-red skin that is rich in oil and crackles with every bite. The duck meat is juicy, firm, and entirely game-free. The vendor thoughtfully chops it into bite-sized pieces, served with homemade Sichuan pepper salt and sour plum dipping sauce. Grab a bag to eat as you walk\u2014the mouthwatering aroma makes it an irresistible night snack while strolling the old street.", "name": "Hanlin Roasted Duck Stall", "transport": "Walk along Hanlin Street to find it directly opposite the entrance to Zhu Family Garden."}, {"address": "Vendor Area by Chaoyang Tower Square, Jianshui County, Honghe Hani and Yi Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.2 Stars | Soft, chewy, and rich in rice aroma! Bowl Ear Cake (Wan\u0027er Gao) gets its name from its resemblance to small bowls or wood ear fungus. It is a traditional steamed rice cake of Jianshui. Fermented rice batter is poured into small bowls and steamed, creating a lovely honeycomb pattern on top with a bouncy texture and a subtle sweet fermented rice fragrance. Purple Rice Cake is stuffed with red bean paste or sesame filling, offering a dense and comforting texture. Delightfully sweet and steaming hot, the comforting aroma makes passersby unable to resist grabbing a skewer to taste.", "name": "Bowl Cake \u0026 Purple Rice Cake Stall", "transport": "Located on the square in front of Chaoyang Tower facing the old street, reachable on foot."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Jianshui Ancient Town and Lin\u0027an Old Street"}, "kunming_center": {"categories": {"cat_1": {"items": [{"address": "No. 67 Baoshan Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 stars | Founded in 1906, Jianxin Yuan is Kunming\u0027s most iconic century-old restaurant renowned for Crossing-the-Bridge Rice Noodles. Its signature traditional broth is rich and naturally sweet, slow-simmered for hours using free-range old hens and pork marrow bones, topped with a thick layer of piping-hot chicken oil to seal in the heat. Quail eggs, thinly sliced raw meats, shredded chicken, and fresh rice noodles are added sequentially to cook in the boiling soup. The noodles are silky smooth with a delightful chew. Paired with thin Xuanwei ham slices and rich broth, every sip delivers a mouthful of savory goodness, making it a beloved choice for both locals and tourists.", "name": "Jianxin Yuan - Baoshan Street Flagship Store", "transport": "Take Metro Line 2 to Dongfeng Square Station, exit and walk about 500 meters."}, {"address": "Inside Jinma Biji Archway, Sanshi Street, Jinbi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | Deyi Lou is a famous time-honored Yunnan cuisine restaurant in Kunming that revives the classic essence of Qing Dynasty local dishes. The must-order \u0027Steam Pot Chicken\u0027 is steamed in a Jianshui purple clay pot without adding a single drop of water; the broth is created entirely from condensed steam, yielding tender, juicy chicken and an exceptionally flavorful, crystal-clear soup. Paired with \u0027Yiliang Roast Duck\u0027 featuring crispy skin and succulent meat, it offers rich layers of texture and irresistible aroma\u2014a quintessential cultural establishment for authentic traditional Yunnan dining.", "name": "Deyi Lou Traditional Yunnan Cuisine", "transport": "Take Metro Line 3 to Wuyi Road Station Exit B, walk about 600 meters."}, {"address": "No. 39 Huguo Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Tucked away in an alley in downtown Kunming, this decades-old eatery is well known for authentic traditional Kunming snacks. Its signature \u0027Potted Rice Noodles\u0027 (Guan Guan Mi Xian) are simmered in a small earthenware pot with a rich, specially spiced broth\u2014piping hot, spicy, and packed with savory goodness that coats every chewy strand. Pair it with \u0027Tofu Pudding Rice Noodles\u0027 (Douhua Mi Xian) and freshly baked \u0027Flaky Meat Buns\u0027 (Posu Bao)\u2014flaky, layered pastry filled with savory minced meat\u2014a nostalgic taste locals have cherished since childhood.", "name": "Yunping Flavor Snacks", "transport": "Take Metro Line 2 to Dongfeng Square Station Exit H, walk about 450 meters."}, {"address": "No. 89 Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 stars | Founded during the Guangxu reign of the Qing Dynasty, Jiqing Xiang is a legendary century-old bakery and the creator of Kunming\u0027s classic \u0027Hard-Crust Yunnan Ham Mooncake\u0027. The classic mooncake features a buttery, crispy pastry stuffed with cured Xuanwei ham and honeyed fruits, striking a perfect balance between sweet and savory. Their freshly baked Rose Pastries are equally popular, filled with premium Yunnan edible roses that deliver a rich floral aroma with perfectly balanced sweetness\u2014a must-buy traditional souvenir shop for travelers.", "name": "Jiqing Xiang Century-Old Bakery", "transport": "Take Metro Line 3 to Wuyi Road Station Exit A, walk about 350 meters."}, {"address": "Intersection of Baoshan Street and Nantong Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.3 stars | Fuhua Yuan is a renowned long-standing establishment specializing in Crossing-the-Bridge Rice Noodles and classic Yunnan cuisine. Its traditional soup base is clear yet rich, slow-simmered with pork bones for hours, and served with tender fish slices, Xuanwei ham, and fresh chives. The noodles are fine, smooth, and slide down effortlessly. Every morning, locals young and old gather here for a steaming bowl of noodles paired with crispy fried pork rinds and braised delicacies to experience Kunming\u0027s most authentic and lively morning food culture.", "name": "Fuhua Yuan Restaurant", "transport": "Take Metro Line 3 to Wuyi Road Station Exit B, walk about 400 meters."}, {"address": "Near the intersection of Wenhua Alley and Wenlin Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | Located in the artistic Green Lake commercial area, Hu Jiu Snacks is a popular institution preserving traditional Southern Yunnan flavors. Their star dish, \u0027Tofu Pudding Rice Noodles\u0027, features silky fresh tofu curds layered over warm rice noodles, topped with signature preserved vegetable sauce, crushed peanuts, and spicy chili oil. When tossed together, it delivers a rich, savory, and spicy kick with a velvety texture. Their sweet-and-sour \u0027Yuxi Cold Rice Noodles\u0027 are also delightfully refreshing, highly rated by Yunnan University students and Green Lake tourists alike.", "name": "Hu Jiu Snacks - Green Lake Branch", "transport": "Take Bus 139 to Wenhua Xiang Station, get off and walk about 100 meters."}, {"address": "Inside Green Lake Hotel, No. 2 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 stars | Situated on the shores of Green Lake, Cuihu Xuan at Green Lake Hotel is a prestigious, historic establishment known for high-end Yunnan dining. The restaurant specializes in sophisticated, upscale interpretations of traditional Yunnan dishes, such as \u0027Matsutake Steam Pot Chicken\u0027, \u0027Stir-fried Black Pork with Wild Mushrooms\u0027, and \u0027Yunnan-Style Steamed Fish with Turnips\u0027. The Steam Pot Chicken uses local free-range chicken and top-tier Shangri-La matsutake mushrooms, yielding a sweet, savory broth and tender meat. Combined with scenic lakeside views, it is a must-visit destination for an exquisite culinary experience.", "name": "Cuihu Xuan - Green Lake Hotel", "transport": "Take Bus 101 or 139 to Cuihu Park Station, walk about 200 meters."}, {"address": "No. 128 Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Dian Wei Guan is a historic landmark restaurant in central Kunming dedicated to preserving authentic local Kunming flavors. Its famous dish, \u0027Gold Ribbon Wild Mushroom Steam Pot Chicken\u0027, features a clear, naturally sweet broth infused with the earthy aroma of wild mushrooms. The \u0027Stir-fried Goat Milk Cheese with Ham\u0027 pairs tender Shilin goat cheese with savory Xuanwei ham in a quick stir-fry, creating a rich interplay of milky softness and savory depth. It remains a firm favorite among old Kunming locals and foodies seeking authentic regional flavors.", "name": "Dian Wei Guan - Zhengyi Road Branch", "transport": "Take Metro Line 3 to Wuyi Road Station Exit A, walk about 300 meters."}], "name": "Local Iconic Traditional Restaurants"}, "cat_2": {"items": [{"address": "No. 76 Wenhua Alley, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 stars | Located in Wenhua Alley near Green Lake, this iconic American-style brunch spot and cafe is a classic in Kunming. The Mexican burritos and Full English breakfast are generously portioned, paired perfectly with local Yunnan small-arabica coffee boasting rich, nutty, and cocoa aromas. With its relaxed, easygoing vibe, it is popular among expats and local college students alike\u2014a perfect spot to enjoy a sunlit, slow-paced afternoon.", "name": "Salvador\u0027s Coffee House", "transport": "Take Metro Line 5 to Huashan South Road Station, then walk for about 10 minutes."}, {"address": "No. 3 Guangzong Alley, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 stars | Tucked away in Guangzong Alley, an old street near Green Lake, this cafe is renovated from a century-old residence. It retains the classic wooden structure and open patio of historic southern Yunnan architecture, brimming with nostalgic charm. Its signature hand-poured Yunnan small-arabica coffee offers a delightfully subtle acidity with fresh floral and fruity notes and a sweet finish. Paired with freshly baked handmade chiffon cake and a special brunch platter with crispy-yet-soft toast, it is a must-visit hip spot for tourists.", "name": "Guangzong No. 3 Courtyard Cafe", "transport": "Take Bus 139 to Green Lake South Road (Cuihu Nan Lu) Station, then walk for about 3 minutes."}, {"address": "No. 52-12 Wenhua Alley, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | A cultural landmark in Wenhua Alley within the Green Lake area, combining an independent bookstore with a specialty coffee shop. The coffee uses select coffee beans from Baoshan, Yunnan; the signature \u0027Rose Latte\u0027 blends the sweet fragrance of local edible roses with silky milk foam for a rich, layered taste. Brunch includes freshly pressed hot panini and handmade yogurt. The quiet, artistic atmosphere attracts many visitors who love reading and enjoying slow coffee time.", "name": "Wheatfield Bookstore \u0026 Cafe", "transport": "Take Metro Line 4 to Yunda West Road Station, transfer to a bus to Green Lake East Gate Station, then walk for about 5 minutes."}, {"address": "No. 186 Qianju Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 stars | Located on Qianju Street near Green Lake, this is a cozy Japanese-style brunch cafe. The popular \u0027Avocado Bacon Eggs Benedict\u0027 features smooth poached eggs that break open over crispy toast, creating a rich and delicate flavor texture. Paired with a fresh dark-roast latte, the subtle coffee bitterness and milky aroma blend perfectly, making it a favorite among female patrons and young couples.", "name": "Asuka \u0026 Guitar Cafe", "transport": "Take Metro Line 5 to Huashan South Road Station (Exit C), then walk for about 12 minutes."}, {"address": "No. 200 Wenlin Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 stars | A minimalist industrial specialty coffee shop near Green Lake Park, featuring self-roasted Yunnan single-origin beans and creative coffee drinks. Highly recommended is its signature \u0027Sweet Fermented Rice Specialty Coffee\u0027, combining traditional Yunnan sweet fermented rice with cold brew coffee for a velvety texture with a subtly sweet, alcoholic hint that is refreshing. The French garlic butter soft European bread served for brunch is crispy outside and soft inside with an intoxicating aroma\u2014a hidden gem for true coffee connoisseurs.",
