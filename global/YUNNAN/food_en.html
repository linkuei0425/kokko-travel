 "name": "Wisdom Tooth Coffee", "transport": "Take Bus 139 or Z5 to Green Lake South Road Station, then walk for about 4 minutes."}, {"address": "No. 16 Green Lake South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | Nestled near Green Lake, this vintage nostalgic cafe features wooden decor paired nicely with a lush green courtyard. Hand-poured coffees feature premium beans from Pu\u0027er and Baoshan in Yunnan, delivering a smooth, warm mouthfeel with notes of dark chocolate and citrus. The light brunch option \u0027Smoked Salmon Sour Cream Croissant\u0027 is flaky, crispy, and deliciously layered\u2014highly recommended for locals and tourists alike to spend a lazy afternoon.", "name": "Nianhu Cafe", "transport": "Take Bus 100 or 101 to Green Lake Park Station, then walk for about 2 minutes."}, {"address": "Inside Shida Wenhua Alley, Wenlin Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 stars | Located in the Wenlin Street business district, this studio-grade cafe is famous for professional hand-poured coffee and exquisite American brunch. The creative \u0027Yunnan Pu\u0027er Cold Brew Coffee\u0027 infuses local tea notes with select small-arabica beans, creating a smooth flavor with a long-lasting sweet aftertaste. Paired with freshly made \u0027American Pancake Stack with Vanilla Ice Cream\u0027, the hot pancakes melt together with cold ice cream for a delightful hot-and-cold contrast.", "name": "Daydream Cafe Studio", "transport": "Take Metro Line 5 to Huashan South Road Station, then walk for about 15 minutes."}, {"address": "No. 128 Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Located near the junction of Zhengyi Square and Green Lake in central Kunming, this spot boldly fuses local Yunnan high-mountain Pu\u0027er tea with small-arabica coffee. The signature \u0027Dianhong Black Tea Latte\u0027 achieves a perfect balance between tea and coffee aromas, topped with silky, slightly sweet milk foam. Brunch items like \u0027Yunnan Flower Pastry with Handmade Oatmeal Bowl\u0027 showcase local Yunnan characteristics while satisfying healthy light-eating preferences, attracting countless tourists.", "name": "Pucha \u0026 Coffee", "transport": "Take Metro Line 3 to Wuyi Road Station (Exit A), then walk for about 6 minutes."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "No. 7 Zhonglieci Alley, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Nestled in a century-old Qing Dynasty courtyard building near Green Lake, Shiping Guild Hall showcases exquisite Yunnan culinary craftsmanship within a rustic, historic ambiance. Seamlessly blending traditional local flavors with guild hall heritage, its signature Shiping Tofu is crispy on the outside, tender inside, and rich in soybean aroma. The corn cakes (Baogu Baba) and stir-fried wild mushrooms with pork are absolute must-tries for both tourists and local foodies. Dining here feels like stepping back in time\u2014a true gem for gourmets seeking rich cultural roots and authentic taste.", "name": "Shiping Guild Hall", "transport": "Take Kunming Metro Line 5 to Huashan South Road Station, then walk for about 8 minutes."}, {"address": "No. 117 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Adjacent to Green Lake Park, this upscale bistro is renowned for fusing traditional Yunnan cuisine with modern fine dining. The restaurant boasts an elegant, lush green setting, paired with a curated menu of signature cocktails and fine wines to perfectly complement the refined local dishes. Specialties like Black Truffle Wild Mushroom Stewed Chicken and Lemongrass Grilled Fish feature rich, delicious layers of flavor, making it ideal for relaxed evening drinks or business banquets.", "name": "Cui Fu Restaurant", "transport": "Take Bus 139 or 101 to Cuihu South Road Station, then walk for about 2 minutes."}, {"address": "No. 94 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Fuzhaolou is a renowned time-honored local restaurant in Kunming. Its classic Steam Pot Chicken is slow-simmered in purple clay pots without adding a single drop of water, relying entirely on condensed steam to create a golden, sweet broth with tender, juicy chicken. Additionally, their Yiliang Roast Duck and Camphor Tea Duck are highly praised, making this the top choice to experience authentic traditional Kunming home-style and banquet dishes.", "name": "Fuzhaolou Steam Pot Chicken", "transport": "Take Metro Line 3 to Wuyi Road Station, then transfer to a bus or walk for about 12 minutes to Cuihu South Road."}, {"address": "No. 3 Guangzong Alley, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Tucked away in Guangzong Alley next to Wenlin Street near Green Lake, this hip bistro is housed in a renovated century-old residence. It features innovative Yunnan cuisine paired with local fruit wines and craft beers. The signature Mint Beef Dices are savory, spicy, numbingly rich, and delightfully chewy\u2014pairing uniquely well with house-made sour papaya wine, making it a favorite among young diners and independent travelers.", "name": "Guangzong No.3 Courtyard Bistro", "transport": "Take Bus 85 or 139 to Wenlin Street Station, then walk into Guangzong Alley for about 3 minutes."}, {"address": "No. 8 Liuying Road, Guandu District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 Stars | A nostalgic local restaurant themed around the history of the Yunnan-Vietnam Railway, featuring numerous French-style railway artifacts and vintage photos. The menu presents classic Yunnan dishes and French-Yunnan fusion creations, such as Golden Tofu Pudding, Signature Money Tree, and Ganba Mushroom Fried Rice. Rich in flavor and aroma, it offers a wonderful mix of historical sentiment and delicious local food.", "name": "1910 South Railway Station Restaurant", "transport": "Take Metro Line 2 to Huancheng South Road Station, then walk for about 10 minutes."}, {"address": "No. 163 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Situated by Green Lake, this restaurant combines the culinary essence of Yunnan\u0027s diverse ethnic minorities with folk-style cocktails. Specialty dishes include Dai-style Ghost Chicken, Colorful Yunnan Platter, and house-brewed rice wine. Featuring vibrant, appetizing sour and spicy flavors, dining here immerses guests in warm ethnic minority culture and a welcoming atmosphere.", "name": "Zui Yunnan Folklife Restaurant", "transport": "Take Bus 100 or 101 to Green Lake Park Station, then walk for about 3 minutes."}, {"address": "No. 26 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Built right along Green Lake, this scenic local restaurant and bistro boasts breathtaking lakeside views. The culinary team masterfully cooks fresh local ingredients like wild mushrooms and Erhai Ottelia (sea vegetable). The signature Stir-fried Ottelia with Ham is crisp and refreshing. Paired with fine Yunnan red wine or craft cocktails, it is an exquisite location to enjoy dusk over Green Lake and a refined dinner.", "name": "Haiqi No.1 Yunnan Restaurant", "transport": "Take Metro Line 5 to Huashan South Road Station, then walk for about 10 minutes."}, {"address": "No. 12 Wenhua Alley, Wenlin Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.3 Stars | Located at the intersection of Wenlin Street and the Green Lake shopping district, this private kitchen bistro offers a cozy, elegant, and artistic atmosphere. Combining traditional Yunnan stir-fries with modern bistro style, their specialty Spicy Dried Beef pairs wonderfully with house-brewed plum wine. Offering rich, layered flavors, it is a popular night spot to unwind with friends.", "name": "Manju Cuihu Bistro", "transport": "Take Bus 85 or 139 to Wenlin Street Station, then walk for about 2 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Inside Yuantong Temple, No. 44 Yuantong Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 stars | Located next to the famous ancient Yuantong Temple in Kunming, this restaurant is renowned for its centuries-old Buddhist vegetarian cuisine. Its signature vegetarian Crossing-the-Bridge Rice Noodles and mixed vegetable soup base are incredibly delicious. The noodles are smooth and chewy, while the rich broth\u2014simmered for hours with various mushrooms and soy products\u2014is light, sweet, and wonderfully layered. The tranquil atmosphere attracts countless tourists and local devotees seeking authentic Yunnan vegetarian culture and mindful dining.", "name": "\u5713\u901a\u5bfa\u7d20\u9f4b\u9928 (Yuantong Temple Vegetarian Restaurant)", "transport": "Take Metro Line 2 to Yuantongshan Station, then walk for about 8 minutes."}, {"address": "No. 16 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 stars | Adjacent to Green Lake Park, this restaurant enjoys an unbeatable view of the lake. It specializes in refined, Zen-inspired elevated vegetarian cuisine, with highlights such as the \u0027Wild Mushroom Vegetarian Steak\u0027 and \u0027Matsutake Vegetarian Soup\u0027. Crispy on the outside and stuffed with rich, juicy wild mushrooms on the inside, every bite bursts with fresh mountain flavors and multi-layered textures. With artistic dish presentation and stunning views of Green Lake, it is the top choice for dates and slow-living experiences.", "name": "\u96f2\u6c34\u79aa\u5fc3\u89c0\u666f\u7d20\u98df (Yunshui Chanxin Vegetarian Restaurant)", "transport": "Take Bus 139 or Z5 to Cuihu Park Station, then walk for about 2 minutes."}, {"address": "No. 102 Huashan West Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | A representative modern healthy vegetarian brand in Kunming, emphasizing natural flavors and wholesome eating. The signature \u0027Black Truffle \u0026 Wild Mushroom Fried Rice\u0027 features distinct grains infused with rich earthy aromas, offering a light, fluffy texture with rich layers. The \u0027Vegetarian Hot and Sour Soup\u0027 is refreshingly tangy and smooth. By infusing precious local Yunnan wild mushrooms into modern plant-based cuisine, it has won the hearts of young foodies and foreign tourists alike.", "name": "\u4e00\u8449\u5b50\u852c\u98df\u9928 (Yi Ye Zi Vegetarian Restaurant)", "transport": "Take Metro Line 3 to Wuyi Road Station, then walk for about 10 minutes."}, {"address": "No. 170 Renmin Middle Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.3 stars | A great-value vegetarian buffet located in a bustling downtown area, offering over 50 exquisite dishes. Highly recommended are the handmade \u0027Vegetarian Roast Duck\u0027 and \u0027Freshly Cooked Vegetarian Rice Noodles\u0027. The roast duck features a crispy skin and tender, chewy interior, paired delightfully with custom sweet bean sauce. Affordable and satisfying with endless variety, it is a favorite canteen for local office workers and travelers looking for authentic everyday vegetarian meals.", "name": "\u7d20\u9999\u6e90\u7d20\u98df\u81ea\u52a9\u9910\u5ef3 (Suxiangyuan Vegetarian Buffet)", "transport": "Take Metro Line 3 to Wuyi Road Station (Exit A), then walk for about 5 minutes."}, {"address": "No. 132 Wenlin Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 stars | Located near the historic Cuihu cultural district, this restaurant is known for its classical wooden decor and health-focused herbal vegetarian dishes. The signature \u0027Stewed Lily \u0026 Morel Mushroom Soup\u0027 has a clear, sweet broth, with mushrooms soaked in rich flavors to become tender and juicy. The \u0027Hand-Shredded Vegetarian Beef\u0027, made from mushroom stems crafted through special pressing and roasting techniques, is delightfully chewy with a rich, spicy, and aromatic fennel kick. Its distinct local flavors leave even non-vegetarians thoroughly impressed.", "name": "\u83e9\u63d0\u7d20\u81b3\u990a\u751f\u9928 (Puti Vegetarian Restaurant)", "transport": "Take Bus 139 to Wenlin Street Station, then walk for about 3 minutes."}, {"address": "No. 82 Cuihu North Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 stars | An elegant restaurant that seamlessly blends Yunnan Pu\u0027er tea culture with refined vegetarian dining. The crowd-favorite \u0027Pu\u0027er Tea Fragrant Tofu\u0027 is crispy on the outside and silky soft inside, melting in your mouth with lingering tea notes. The \u0027Vegetarian Wild Mushroom Hot Pot\u0027 features a broth simmered from alpine mushrooms, yielding a savory, smooth base that turns wonderfully sweet when fresh veggies are cooked in it. Its peaceful garden environment makes it a highly praised culinary haven hidden in the Green Lake commercial area.", "name": "\u975c\u4e4b\u7d20\u98df\u8336\u85dd\u9928 (Jingzhi Vegetarian \u0026 Tea House)", "transport": "Take Bus 100 or 101 to Cuihu North Road Station, then walk for about 4 minutes."}, {"address": "No. 48 Qianwang Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 stars | A unique vegetarian restaurant featuring Southeast Asian Thai flavors integrated with local Yunnan herbs. The signature \u0027Thai Tom Yum Vegetarian Soup\u0027 is tangy, spicy, and aromatic, infused with vibrant lemongrass and kaffir lime leaves, paired with custom plant-based seafood and thick mushrooms for an appetizing, multi-textured bowl. The \u0027Lemongrass Vegetarian Chicken Strips\u0027 are golden and crispy outside with a tender, solid texture inside. Its unique flavor profile draws crowds of vegetarian foodies craving bold, Southeast Asian cuisine.", "name": "\u852c\u5409\u6cf0\u7570\u570b\u7d20\u98df\u9910\u5ef3 (Shujitai Thai Vegetarian Restaurant)", "transport": "Take Metro Line 3 to Wuyi Road Station, then walk for about 6 minutes to reach the Kunming Old Town area."}, {"address": "No. 12 Guangfutai, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.2 stars | An authentic traditional eatery specializing in Yunnan vegetarian street snacks, beloved by local neighborhood regulars. The must-try \u0027Vegetarian Tofu Pudding Rice Noodles\u0027 combines rich, smooth fresh tofu pudding with springy rice noodles, drizzled with special chili oil and crunchy crushed peanuts for a dense, tangy, spicy, and flavorful bite. Additionally, the \u0027Vegetarian Erkuai\u0027 (rice cake) is grilled to a subtle crispy char on the outside, wrapping a sweet and savory sesame sauce inside for a soft, chewy texture. It is the ultimate one-stop spot to savor local Yunnan street-food snacks.", "name": "\u6e05\u5fc3\u7d20\u98df\u5c0f\u5403\u9928 (Qingxin Vegetarian Noodle House)", "transport": "Take Metro Line 3 to Wuyi Road Station, then walk for about 8 minutes to enter the Old Town area."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Kunming Old Street, Guanghua Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Charcoal-grilled to a golden, crispy puffed sphere, opening to reveal a silky, tender center like tofu pudding infused with rich fermented soy aroma. Served with a signature dipping sauce (cilantro, chili powder, and fish mint) that offers a savory, spicy, tangy punch. It is one of the most popular street snacks in Kunming Old Street market\u2014locals and tourists alike love gathering around the charcoal grill to eat them hot off the fire.", "name": "Jianshui Grilled Tofu - Kunming Old Street Branch", "transport": "Metro Line 3, Wuyi Road Station Exit 3, approx. 5 mins walk"}, {"address": "Near No. 16 Cuihu South Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Potato chunks fried crisp on the outside and tender inside in high-temperature oil, yielding a soft, savory-spicy bite. Offers over a dozen seasoning mixes like spicy-numb, garlic, tomato, and fish mint. Coated thoroughly in aromatic spice powder, every bite bursts with flavor. A classic street food around Cuihu Park, and a must-buy stroll snack for students and sightseers.", "name": "Yunnan Specialty Fried Potatoes - Cuihu Branch", "transport": "Bus 133 to Cuihu South Road Stop, approx. 2 mins walk"}, {"address": "Stall in the middle section of Nanping Pedestrian Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Crafted from local Yunnan goat milk, this rubing cheese is grilled over charcoal until lightly golden and charred. It has a springy, chewy texture and a rich milky aroma. Brushed with special sweet bean sauce or sprinkled with sweet-and-savory salt and pepper, it delivers a delightful blend of sweet and savory flavors packed with ethnic flair. A hugely popular grab-and-go sweet snack on Nanping Pedestrian Street.", "name": "Wang\u0027s Traditional Grilled Rubing (Goat Cheese)", "transport": "Metro Line 1/2, Dongfeng Square Station Exit H2, approx. 6 mins walk"}, {"address": "Beside East Gate of Cuihu Park, Huashan West Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.8 Stars | A refreshing traditional street dessert made from rubbing wild papaya seeds into a silky, clear jelly with a texture like pudding. Combined with \u0027rice shrimp\u0027\u2014chewy, silky, shrimp-shaped drops made from rice batter. Drizzled with rich brown sugar syrup, sesame seeds, and rose sugar, it is sweet without being greasy\u2014the ultimate cooling treat when exploring the Cuihu commercial area in hot summer.", "name": "Traditional Papaya Jelly \u0026 Rice Shrimp (Mi Liang Xia)", "transport": "Bus 100 to Cuihu East Gate Stop, right at the stop"}, {"address": "No. 128 Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.6 Stars | The bun dough is repeatedly kneaded and layered with oil, resulting in distinct, buttery flaky layers that become incredibly soft yet elastic when steamed. The signature \u0027sweet ham filling\u0027 combines diced cured ham, winter mushrooms, and sugar, delivering a fragrant sweet-and-savory bite where savory fat and rich meat aroma burst in your mouth. A quintessential traditional Kunming breakfast and street food bite.", "name": "Kunming Old Brand Pusu Bun (Flaky Layered Bun)", "transport": "Metro Line 3, Wuyi Road Station Exit B, approx. 4 mins walk"}, {"address": "Market stall at the intersection of Renmin Middle Road and Zhengyi Road, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.4 Stars | Flatbread pan-baked on high heat until golden and crispy, filled with sesame seeds, crushed peanuts, and black sugar. Served fresh off the griddle, the exterior is crunchy and hot steam escapes as warm, liquid brown sugar flows out alongside intense roasted peanut and sesame aromas. Hearty and satisfying, it\u0027s a traditional pastry packed with local color sold at Kunming street market stalls.", "name": "Traditional Handmade Guandu Baba", "transport": "Metro Line 3, Wuyi Road Station Exit A, approx. 3 mins walk"}, {"address": "Near No. 57 Baoshan Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Local Yunnan small yellow pears slow-stewed and roasted in custom earthenware jars with red dates, goji berries, and rock sugar. The pear flesh melts in your mouth\u2014soft and tender\u2014while the broth is rich, sweet, and lightly infused with herbal and roasted aromas. Grabbing a jar during autumn or winter while strolling Nanping Commercial District warms the stomach and soothes the lungs, making it immensely popular with women and tourists.", "name": "Yunnan Ancient Style Roasted Pear", "transport": "Metro Line 1/2, Dongfeng Square Station Exit D, approx. 5 mins walk"}, {"address": "No. 186 Qianju Street, Wuhua District, Kunming City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Premium yellow split peas are ground and simmered into a thick, smooth, golden pea porridge (Xidoufen), drizzled with spicy chili oil, minced garlic, ginger juice, cilantro, and crushed peanuts. Crispy, freshly fried deep-fried dough sticks (Youtiao) are cut into bites and dipped into the hot porridge, soaking up the nutty pea soup and spicy sauce for a soft-yet-crispy texture. A wildly popular local breakfast and street snack near Cuihu.", "name": "Yunnan Pea Jelly \u0026 Xidoufen Vendor", "transport": "Bus 139 to Qianju Street Stop, approx. 1 min walk"}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Downtown Kunming and Green Lake Commercial District"}, "lijiang_dayan": {"categories": {"cat_1": {"items": [{"address": "No. 107 Zhongyi Lane, Guangyi Street, near Mufu Palace, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Yunxueli is an iconic old-established restaurant featuring traditional Naxi cuisine inside Dayan Old Town. The signature \u0027Steam Pot Chicken\u0027 boasts a clear, sweet, and delicious broth with tender, fall-off-the-bone chicken, while the \u0027Snow Mountain Fish\u0027 offers silky, delicate meat paired with an exceptional house sauce. Selecting fresh local ingredients and combining ancient stewing techniques with traditional seasonings, every dish offers rich, layered flavors beloved by locals and travelers alike.", "name": "Yunxueli Restaurant", "transport": "Walk to the area near Mufu Palace in Dayan Old Town, then follow the signs along Zhongyi Lane on Guangyi Street for about 2 minutes."}, {"address": "No. 88 Upper Xingren Section, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A classic eatery holding delicious memories for countless travelers, famous for authentic traditional Naxi snacks. Their classic \u0027Chickpea Jelly\u0027 can be served pan-fried or cold; pan-fried to a golden crisp outside and soft, chewy inside, drizzled with a secret spicy-sour sauce that awakens the palate. The \u0027Naxi Baba\u0027 pancake is multi-layered, crispy outside and soft inside. With rich, authentic flavors and budget-friendly prices, this is a must-visit for exploring local traditions.", "name": "88 Snack Bar", "transport": "Walk along Wuyi Street from Sifang Square in the Old Town for about 8 minutes."}, {"address": "No. 1-3 Zhenxing Lane, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Lijiang\u0027s most iconic restaurant for traditional cured rib hotpot. Made using traditional Naxi salt-cured and air-dried methods, the cured ribs are slow-simmered for hours into a rich, savory, and sweet broth. The meat is firm and flavorful, becoming more fragrant with every bite. Paired with local wild mushrooms and fresh vegetables that soak up the essence of the soup, this warm and hearty feast turns first-timers into lifelong fans.", "name": "A Po Cured Ribs", "transport": "Walk from Sifang Square to the entrance of Zhenxing Lane on Wuyi Street."}, {"address": "No. 32 East Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | A classic dining establishment combining the culinary essence of Western Yunnan\u0027s ethnic minorities. The \u0027Shuifu Fried Milk\u0027 is crispy on the outside and creamy inside, sweetly fragrant without being overly rich. The signature \u0027Caravan Chicken\u0027 is stir-fried with unique local spices, delivering tender, juicy meat packed with spicy and aromatic flavors. The restaurant immerses guests in traditional Naxi culture, loved by travelers for its exquisite plating and authentic tastes.", "name": "Prince of Western Yunnan Restaurant", "transport": "Enter East Street from the Big Water Wheels entrance of the Old Town and walk straight for about 300 meters."}, {"address": "No. 60 Xinkai Lane, Guangyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | A traditional Naxi home-cooking restaurant hidden in the alleys of Dayan Old Town. The signature \u0027Naxi Roasted Pork\u0027 uses premium pork belly marinated in special sauce and charcoal-grilled, served over a bed of crispy mint leaves to create a savory, crispy, non-greasy bite. The fragrant \u0027Water Braised Chicken\u0027 is another favorite. Its unpretentious, comforting flavors offer a genuine taste of Naxi home hospitality.", "name": "He Shu Shi Fu Naxi Restaurant", "transport": "Enter Xinkai Lane from Guangyi Street and walk for about 5 minutes."}, {"address": "Traditional Snack Area, Zhongyi Market, Changshui Road, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | A traditional street stall inside Zhongyi Market on the edge of the Old Town, serving a nostalgic comfort food local residents grew up with. Made from Lijiang\u0027s unique chickpea flour, the fresh pan-fried chickpea jelly features a golden crispy exterior and tofu-soft center. Seasoned with garlic water, chili oil, and cilantro, its savory and spicy profile captures the authentic spirit of local street food.", "name": "Zhongyi Market Chickpea Jelly Stall", "transport": "Walk to the entrance of Zhongyi Market near the South Gate of Dayan Old Town and head inside into the snack stall area."}, {"address": "No. 10 Chongren Lane, Qiyi Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A long-standing destination for traditional Naxi clay-pot beef hotpot. Fresh beef is minced into tender bits (\u0027Zhazha\u0027) and slow-simmered in a rich broth with secret red oil and aromatic spices. The minced beef melts in your mouth, perfectly complemented by chewy offal and fresh wild greens. Ladling the savory, mildly spicy broth over hot rice creates an unforgettable meal\u2014a classic hotpot experience every food enthusiast must try.", "name": "Zhazha Beef Naxi Hotpot", "transport": "Walk along Qiyi Street into Chongren Lane for about 3 minutes to find the restaurant."}, {"address": "No. 38 Cuiwen Section, Xinhua Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | A highly popular classic shop for traditional Yunnan Crossing-the-Bridge Rice Noodles in Dayan Old Town. The scalding broth is slow-boiled for hours using free-range chicken and pork bones, resulting in a sweet, rich, and deeply savory soup base. Paper-thin raw meat slices, quail eggs, and fresh greens are cooked right in the hot soup before slurpable, springy rice noodles are added, perfectly capturing the authentic Yunnan tradition.", "name": "Dudu Crossing-the-Bridge Rice Noodles", "transport": "Walk along Xinhua Street (Bar Street) to the Cuiwen Section to arrive."}], "name": "Traditional Local Classics"}, "cat_2": {"items": [{"address": "No. 50, Upper Huangshan Section, Xinhua Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located in a Naxi wooden building tucked away in the ancient town\u0027s alleys, this caf\u00e9 is famous for its unique Yunnan small-grain coffee and house-roasted brunch. The signature pour-over coffee offers rich nutty notes and a fruity, sweet-and-sour acidity, perfectly balanced with freshly baked, crispy tiramisu or croissants. Tourists and local youths love sitting on the second-floor balcony to look down at the cobblestone streets of the ancient town and Jade Dragon Snow Mountain in the distance, soaking in the sun on a lazy morning.", "name": "Baima Qingchen Coffee", "transport": "Walk to Sifang Street in Dayan Ancient Town, then walk along the upper Huangshan slope for about 8 minutes."}, {"address": "No. 32, Wenzhi Lane, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A themed caf\u00e9 inspired by \u0027Wamao\u0027 (Roof Tile Cat), a local intangible cultural heritage of Yunnan, blending traditional Naxi elements with modern minimalist industrial style. The cold brew Yunnan small-grain coffee is smooth and refreshing, featuring subtle citrus notes and a dark chocolate finish. Pair it with their signature freshly made avocado smoked chicken toast brunch\u2014crispy on the outside, soft inside, packed with savory flavor. It\u0027s a favorite among hipsters and travel enthusiasts for its rich culture and fantastic photo-worthy views.", "name": "Wamao Coffee", "transport": "About a 10-minute walk from the Big Water Wheel at the Ancient Town\u0027s North Gate to Wenzhi Lane on Wuyi Street."}, {"address": "No. 78, Zhongyi Lane, Guangyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Tucked away in a quiet alley of Dayan Ancient Town, this independent specialty coffee shop focuses on house-roasted single-origin coffees and exquisite French brunch. The signature Rose Latte features Yunnan edible rose jam, yielding a rich milky texture with an elegant floral aroma. Paired with freshly baked American pancakes\u2014golden and crispy on the outside, moist and fluffy inside\u2014served with fresh fruit, it is the top choice to recharge your morning. The minimalist wooden decor lets you escape the hustle and bustle to embrace slow living.", "name": "Shuren Coffee", "transport": "Close to Zhongyi Market; about a 5-minute walk from the entrance of Zhongyi Lane."}, {"address": "No. 15, Lower Bayi Section, Qiyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A rare nostalgic caf\u00e9 in the ancient town featuring a unique combination of natural rock and old timber structures. Highly recommended are the Yunnan Highland Special Coffee and Full English Breakfast set\u2014juicy and aromatic sausages served with tender sunny-side-up eggs and baked beans for rich layers of flavor. The coffee uses medium-dark roast beans, delivering a deep, sweet aftertaste with balanced bitterness. Beyond generous portions, its quaint and elegant courtyard attracts countless tourists to stop and take photos.", "name": "Stone Rock Coffee", "transport": "Enter from the Ancient Town\u0027s South Gate and walk along Qiyi Street for about 7 minutes."}, {"address": "No. 22, Upper Xingren Section, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A brunch caf\u00e9 brimming with lush greenery and Naxi courtyard style. The popular \u0027Yunnan Wild Mushroom Cheese Panini\u0027 is hot-pressed to be crispy outside and soft inside, with rich melted cheese wrapping around aromatic local wild mushrooms for a savory burst of flavor in every bite. Pair it with a steaming hot oat milk latte that is rich and fragrant. The courtyard space, filled with floral aromas, allows guests to enjoy ultimate relaxation in the morning sunlight.", "name": "Yimu Caotang Coffee", "transport": "Turn into the alley from the signpost at the Xingren section of Wuyi Street and walk for about 3 minutes."}, {"address": "No. 68, West Huangshan Section, Xinhua Street, Lion Mountain Summit, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A popular open-air brunch spot with an exceptional rooftop viewing platform. The signature brunch platter features freshly fried bacon, French toast, and a fresh salad. The French toast is seared to a golden crisp, dusted with powdered sugar, and drizzled with maple syrup\u2014crisp on the outside, tender inside, and pleasantly sweet. Paired with a cold brew Americano, its bright acidity is cool and refreshing. On a clear day, sitting in the rooftop garden while enjoying delicious food and overlooking the ancient town\u0027s tiled rooftops makes it a trendy social media hotspot.", "name": "Sunlight City Coffee \u0026 Brunch", "transport": "Walk uphill from Sifang Street along the Lion Mountain trail for about 12 minutes to reach the rooftop shop."}, {"address": "No. 12, Xinkai Lane, Guangyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 Stars | A classic caf\u00e9 converted from a historic Naxi timber courtyard, filled with the aroma of aged wood and roasted coffee beans. Specialty desserts and brunch combine local ingredients, such as fragrant butter pancakes and Yunnan high-mountain cold brew coffee. The pancakes are crispy at the edges and cloud-soft at the center, served with savory custom butter for rich layers. Its unique old-building charm and warm, friendly service make it a peaceful morning haven for young travelers and international tourists.", "name": "Mulou Coffee House", "transport": "About a 4-minute walk from the exit of Mufu Palace scenic area."}, {"address": "No. 89, Cuiwen Section, Xinhua Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A combo caf\u00e9 and brunch spot blending retro artistic vibes with exquisite bakery goods. Highly recommended is their fresh-baked Eggs Benedict Toast: cutting into the poached egg releases a rich golden yolk over smoked salmon and crispy toast, delivering a smooth, velvety taste with a hint of tangy Hollandaise sauce. Paired with a Flat White crafted from premium local estate beans, topped with silky microfoam. With melodious music playing, it is an unbeatable choice for a relaxed morning.", "name": "Time Story Coffee \u0026 Bakery", "transport": "About a 6-minute walk along the Xinhua Street riverside path from the Big Water Wheel."}], "name": "Popular Coffee \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 81 Chongren Lane, Qiyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Decorated with strong Naxi and Ancient Tea Horse Road cultural elements, this is a must-visit specialty restaurant in Dayan Ancient Town. The signature \u0027Dali Mubang Sour \u0026 Spicy Fish\u0027 features tender, smooth fish in an appetite-inducing sour and spicy broth; the \u0027Hand-Pulled Rice\u0027 combines purple rice, roast chicken, and various unique Yunnan dipping sauces, delivering rich layers in every bite. Highly praised by both tourists and locals for its exquisite presentation and authentic flavors.", "name": "Dian Xi Wang Zi Yunnan Cuisine (Dian Xi Wang Zi Restaurant)", "transport": "About a 10-minute walk from the South Gate of the Ancient Town"}, {"address": "No. 167 Zhongyi Lane, Guangyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A highly acclaimed local restaurant in Lijiang Ancient Town with an elegant garden style rich in Yunnan charm. Highlights include the \u0027Snow Mountain Fish,\u0027 featuring delicate, smooth, and naturally sweet meat, and the \u0027Secret Recipe Snow Mountain Black Pork,\u0027 with crispy skin, tender meat, and a rich aroma. Every dish showcases the natural flavors of Yunnan ingredients, making it extremely popular among visitors.", "name": "Yunxueli Restaurant", "transport": "About an 8-minute walk from the entrance of Zhongyi Market"}, {"address": "No. 16 Upper Xingren Section, Wuyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A traditional Naxi cured rib hotpot restaurant passed down for generations. The ribs are cured and air-dried to yield a rich savory flavor, while the broth is simmered into a milky white, delicious soup. The ribs are chewy yet juicy, perfectly paired with the flavorful broth and fresh seasonal vegetables for a savory, rich meal. Strongly recommended by locals and food lovers in the ancient town.", "name": "A Po Cured Pork Ribs Restaurant", "transport": "About a 6-minute walk along the cobblestone path from the entrance of Wuyi Street"}, {"address": "No. 45 Upper Huangshan Section, Xinhua Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Tucked away in the alleys of the ancient town, this quaint restaurant serves authentic Naxi home-cooked dishes. The signature \u0027Naxi Grilled Fish\u0027 has crispy skin and tender flesh, dusted with special spices and crushed peanuts for an irresistible aroma; the \u0027Water-Sprouted Vegetables\u0027 are refreshingly sour and spicy. The cozy historic architecture and friendly service make it a highly praised dining hot spot.", "name": "Naxi Ya Ge Local Specialty Restaurant", "transport": "About a 7-minute walk from Sifang Street toward the Huangshan Section"}, {"address": "No. 78 Cuiwen Section, Xinhua Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A bistro that perfectly blends the vibe of an ancient town folk music bar with Yunnan culinary specialties. It serves special \u0027Peach Blossom Wine\u0027 and \u0027Saut\u00e9ed Pork with Wild Mushrooms\u0027; the wine is sweet and smooth, perfectly complementing the savory, crisp wild mushrooms. Accompanied by soothing live music performances at night, the atmosphere is romantic and charming, making it a favorite evening hangout for young travelers.", "name": "Taohuayuan Bistro", "transport": "About a 5-minute walk along the water canal alley from Bar Street"}, {"address": "No. 12 Lower Bayi Section, Qiyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 Stars | Famous for its unique minced beef hotpot, where fresh minced beef is cooked with indigenous Yunnan high-mountain herbs. The spicy, aromatic beef broth paired with tender, juicy minced beef is insanely delicious when poured over rice. With its folklore-inspired decor and enthusiastic service, it is a haven for foodies who love bold, rich flavors.", "name": "Zha Zha Beef Pot Bistro", "transport": "About a 4-minute walk from Shiluo Bridge"}, {"address": "No. 88 Wenzhi Lane, Wuyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Specializing in Dai ethnic cuisine inspired by Xishuangbanna, Yunnan, offering a unique dining style. The signature \u0027Dai-Style Lemongrass Grilled Fish\u0027 is richly seasoned with a fresh herbal aroma, while the \u0027Hand-Tossed Sour \u0026 Spicy Chicken\u0027 is tantalizingly tangy and springy. Overall, the flavors are fresh, zesty, and refreshing, loved by tourists who enjoy Southeast Asian and Yunnan ethnic culinary styles.", "name": "No. 88 Banana Leaf Dai Bistro", "transport": "About a 5-minute walk along Wenzhi Lane off Wuyi Street"}, {"address": "No. 55 Zhongyi Lane, Guangyi Street, Dayan Subdistrict, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A well-reputed hidden gem located in a quiet alley of the ancient town, known for authentic Naxi cuisine at great value. The \u0027Naxi Roasted Pork\u0027 features crispy-skinned pork belly that is flavorful without being greasy, paired perfectly with house-made chili powder; the \u0027Steam Pot Chicken\u0027 offers a clear, sweet broth with tender, slow-simmered chicken. Affordable prices and authentic flavors make it unforgettable for many travelers.", "name": "Little Chef Naxi Restaurant", "transport": "About a 6-minute walk from Zhongyi Market"}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 58, Bayi Lower Section, Qiyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | A Zen-inspired vegetarian restaurant nestled in Dayan Ancient Town, offering a serene and elegant ambiance. It specializes in local fresh wild mushrooms and organic vegetable dishes from Yunnan. The \u0027Truffle \u0026 Wild Mushroom Pot\u0027 comes highly recommended; its rich, sweet broth and tender, springy mushrooms are paired with secret herb seasonings, bringing rich layers of flavor to vegetarian cuisine. Highly popular among both domestic and international tourists as well as local vegetarian enthusiasts.", "name": "Jingshui Huakai Vegetarian Restaurant", "transport": "About an 8-minute walk from the South Gate of the Ancient Town"}, {"address": "No. 32, Xingren Upper Section, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Situated in a quaint, traditional Naxi-style courtyard, this restaurant serves exquisite global vegetarian cuisine and traditional Naxi-style vegetarian pastries. Popular signature dishes include the \u0027Five-Color Veggie Assortment\u0027 and \u0027Handcrafted Tofu Cutlet\u0027\u2014crispy on the outside, soft on the inside, wonderfully layered, and never greasy. With a cozy and relaxing atmosphere, it is perfect for enjoying an elegant and healthy vegetarian lunch while a soft breeze sweeps through the courtyard.", "name": "Yiyezhou Vegetarian Restaurant", "transport": "About a 10-minute walk from Sifang Street near the North Gate of the Ancient Town"}, {"address": "No. 15, Huangshan Upper Section, Xinhua Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A self-service vegetarian canteen renowned for its affordable prices and cozy, home-cooked flavors. It offers over twenty freshly stir-fried seasonal vegetables, various soy products, and nourishing soups daily. Don\u0027t miss the local \u0027Alpine Potato Stir-fried with Mock Meat\u0027 and \u0027Wild Mushroom Rice Noodle Soup\u0027\u2014the noodles are smooth and springy with a refreshing broth that leaves a sweet aftertaste. The ultimate choice for budget travelers looking for a healthy, satisfying meal.", "name": "Xile Vegetarian Canteen", "transport": "About a 5-minute walk from the entrance of Lion Mountain Park"}, {"address": "No. 22, Zhongyi Lane, Guangyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | Located near the historic Mu Fu Mansion, this restaurant seamlessly blends traditional Naxi culinary culture with modern healthy vegetarian dining. The specialty dish \u0027Slow-Simmered Lion\u0027s Mane Mushroom with Bamboo Shoots\u0027 features meaty, hearty mushrooms soaked in rich, savory broth. Paired with fragrant custom \u0027Purple Rice\u0027, it leaves an unforgettable aftertaste.", "name": "Suxin Xiangjie Vegetarian Restaurant", "transport": "About a 3-minute walk from the main gate of Mu Fu Mansion"}, {"address": "No. 88, Jishan Lane, Xinyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | A fusion venue combining Yunnan Pu\u0027er tea arts with nourishing vegetarian cuisine. Highly recommended dishes include \u0027Tea-Fragrant Mock Chicken\u0027 and \u0027Hot \u0026 Sour Mock Fish in Golden Broth\u0027, expertly crafted from natural konjac and tofu. They feature remarkably realistic textures infused with subtle notes of Pu\u0027er tea, creating an appetizing hot-and-sour profile beloved by young tourists who enjoy modern vegetarian cuisine.", "name": "Jingxinyuan Vegetarian \u0026 Tea House", "transport": "About a 6-minute walk from Sifang Street"}, {"address": "No. 108, Minzhu Road, near the Big Water Wheels at North Gate, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | Specializing in a 100% natural, additive-free vegetarian wild mushroom hotpot. Selecting premium Yunnan plateau wild mushrooms like boletus, morels, and chanterelles, they simmer a lauded golden broth. Dipping fresh seasonal greens and handmade konjac into the broth yields tender, juicy, crisp mushrooms packed with umami. A top pick to warm the body and stomach during autumn and winter visits to Dayan Ancient Town.", "name": "Putiyuan Vegetarian Restaurant", "transport": "About a 4-minute walk from the Big Water Wheels landmark"}, {"address": "No. 45, Xingwen Lane, Qiyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Hidden deep in a quiet alley inside a two-story building, this restaurant offers distant views of Jade Dragon Snow Mountain from its rooftop terrace. Highlights include the \u0027Steamed Mock Chicken\u0027 and \u0027Pan-Fried Tofu Cakes\u0027\u2014golden and crispy on the outside with rich soy aromas and subtle Sichuan pepper hints inside. Enjoying this crisp-yet-soft texture alongside views of the ancient town provides a unique dining experience.", "name": "Yunshui Chanxin Vegetarian Restaurant", "transport": "About a 7-minute walk along Qiyi Street from Sifang Street"}, {"address": "No. 12, Wenming Lane, Wuyi Street, Dayan Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | A trendy, hipster-style small vegetarian kitchen featuring creative East-meets-West fusion plant-based dishes. Popular signatures are the \u0027Black Truffle Wild Mushroom Pasta\u0027 and \u0027Baked Veggie Spring Rolls\u0027. The paper-thin, crispy wrappers encase abundant shredded veggies and mushrooms; dipped in custom sweet chili sauce, they offer a refreshingly crispy and juicy bite highly favored by young women and international travelers.", "name": "Sansheng Youxing Vegetarian Kitchen", "transport": "About a 5-minute walk from the entrance of Wuyi Street"}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Inside Zhongyi Market, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | An immensely popular snack stall tucked inside Zhongyi Market in Lijiang Old Town. Chunks of local plateau potatoes are deep-fried until golden and crispy on the outside while remaining soft and fluffy inside. They are seasoned with special chili powder, Sichuan pepper, scallions, and sliced fish mint (Houttuynia cordata). Spicy, fragrant, crisp, and tender, every bite releases a delicious burst of potato starch and uniquely Yunnan spices. It\u0027s a classic grab-and-go snack loved by both tourists and locals exploring the market.", "name": "Zhongyi Market Grandma\u0027s Fried Potatoes", "transport": "Walk to the South Gate of Dayan Old Town, enter Zhongyi Market, and you\u0027ll find it right inside."}, {"address": "No. 88 Xingren Upper Section, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A long-standing eatery on Wuyi Street serving traditional Naxi snacks. Their signature Jidou Jelly (Chickpea Jelly) is silky and springy, tossed in a mouthwatering sour-and-spicy sauce topped with crushed peanuts. The Naxi Grilled Fish boasts a crispy skin and tender, savory meat. Loved by foodies for preserving authentic Naxi home-cooked flavors, every dish delivers a rich taste of western Yunnan rustic culture\u2014an affordable culinary must-try in Dayan Old Town.", "name": "No. 88 Snack Bar", "transport": "Walk along Wuyi Street in Dayan Old Town for about 8 minutes."}, {"address": "No. 15 Xingren Upper Section, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | A trendy fried snack and bakery shop popular in the Old Town. Their signature Baojiang Tofu (Lava Tofu) is deep-fried at high temperatures to achieve a crispy shell with a silky, velvety center that bursts with juice in one bite. Freshly baked flower pastries and cinnamon rolls are equally praised. The contrast between crispy and tender texture paired with custom dipping seasonings draws crowds of young visitors daily.", "name": "Ding Ding Fried Snacks", "transport": "Walk about 5 minutes from Sifang Street toward Wuyi Street."}, {"address": "Beside the Water Well, Zhongyi Market, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | Tucked beside the water well in Zhongyi Market, this stall is hailed as one of the most authentic Baojiang Tofu spots in Dayan Old Town. Slow-grilled on a griddle until slightly charred and golden, the exterior turns delicately crispy while the inside remains molten and creamy. Biting into it releases steam and rich soybean aroma, which pairs perfectly with Yunnan dry chili dip for a savory, spicy, and fragrant treat highly recommended by locals.", "name": "Zhongyi Shuijing Baojiang Tofu", "transport": "Enter Zhongyi Market from the South Gate of Dayan Old Town and walk toward the central water well area."}, {"address": "No. 1-2 Zhenxing Lane, Wuyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.4 stars | A historic handcrafted yogurt shop in Dayan Old Town. Their signature Red Bean Yogurt and Red Bean Double-Skin Milk feature a rich, thick texture. The smooth, velvety, tangy yogurt is layered with soft, sweet stewed red beans and fresh honey syrup, offering a sweet and tangy contrast. A bowl of refreshing cold yogurt is perfect for refreshing yourself while wandering the old town\u2014a favorite dessert among tourists.", "name": "A\u0027an Yogurt", "transport": "Walk about 4 minutes from Sifang Street along Wuyi Street."}, {"address": "No. 6 Sifang Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.2 stars | A traditional flatbread stand located near Sifang Street in the heart of the Old Town. Lijiang Baba comes in both sweet and savory flavors, made by layering local high-quality wheat flour with refined lard and frying until golden and flaky. Rich in layers, the sweet version is filled with aromatic sesame sugar, while the savory version features savory minced ham. Crispy, chewy, and rich without being greasy, it is the best way to experience traditional Naxi pastry culture.", "name": "Sifang Street Traditional Lijiang Baba", "transport": "Located right beside the Sifang Street Square in the heart of Dayan Old Town."}, {"address": "At the entrance of Zhongyi Market, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A highly praised stall in the market serving traditional Yunnan roasted Erkuai (rice cake crepe). Thick rice cakes made from high-quality rice are charcoal-roasted until puffed up with a crispy skin, brushed with custom sesame sauce and spicy chili paste, then rolled around fried dough sticks (youtiao), pickles, and cilantro. Chewy, crispy, and packed with flavor, this savory street snack is steeped in authentic local life, perfect for breakfast or an afternoon snack.", "name": "Zhongyi Market Ah Xiang Roasted Erkuai", "transport": "Walk to the main entrance of Zhongyi Market to find the stall."}, {"address": "Next to Guanmen Inn, Qiyi Street, Dayan Old Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.3 stars | A classic food stall specializing in Rubing, a traditional goat milk cheese from northwestern Yunnan. Thickly sliced fresh goat cheese is charcoal-grilled until soft and golden with bubbling crusts, then brushed with rich wild honey or sprinkled with salt and pepper. Creamy and full of milky flavor with a melty cheese pull and smoky aroma, its perfectly balanced savory and sweet notes amaze first-timers and food connoisseurs alike.", "name": "Sheng\u0027ai Naxi Roasted Milk Cheese", "transport": "Walk along Qiyi Street toward Mu Mansion to easily find it."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Dayan Ancient Town, Lijiang"}, "shangri_la": {"categories": {"cat_1": {"items": [{"address": "No. 23 Chilanglang, Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located in Dukezong Ancient Town, this Tibetan earthenware hot pot restaurant is an iconic local institution. The classic yak meat hot pot is slow-simmered in custom local copper pots, creating a rich, savory broth. Thick slices of fresh yak meat melt in your mouth, tender with natural savory flavors. Paired with rich butter tea and highland barley cakes that are crispy outside and soft inside, it offers a deeply satisfying and cozy dining experience beloved by local Tibetans and tourists worldwide.", "name": "Silent Night Tibetan Hot Pot", "transport": "About a 5-minute walk from Moonlight Square in Dukezong Ancient Town."}, {"address": "No. 28 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Passed down through generations, this traditional Tibetan restaurant features authentic Tibetan decor. Their signature hand-pulled mutton and roasted yak ribs have crisp, fragrant skins and juicy, tender meat with zero gaminess. Paired with traditional Tibetan yogurt drizzled with honey\u2014rich, creamy, and sweet-sour\u2014it offers wonderfully layered flavors, making it an excellent spot for an authentic Tibetan feast.", "name": "Talo Tibetan Restaurant", "transport": "About a 3-minute walk from Sifang Street in the Ancient Town."}, {"address": "No. 30 Chilang, Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | An award-winning classic Tibetan restaurant. Its signature Tibetan matsutake mushroom and free-range chicken hot pot features wild Shangri-La matsutake mushrooms and plateau chicken, producing an exceptionally sweet and velvety broth. The unique earthy aroma of matsutake pairs exquisitely with tender chicken; dipping torn highland barley bread into the broth creates an unforgettable feast showcasing Yunnan-Tibetan culinary heritage.", "name": "Minzhulamu Tibetan Restaurant", "transport": "Located inside Dukezong Ancient Town, about a 4-minute walk to Guishan Park."}, {"address": "No. 12 Chilanglang, Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | A beloved local establishment fusing Naxi cured pork ribs with Tibetan yak meat. The cured ribs are time-honored, firm, savory, and rich with marrow flavor. Stewed alongside freshly sliced yak meat, the broth grows richer with every simmer. Dipped into their special chili dip, each bite delivers spicy, savory, and rich flavors that leave you craving more.", "name": "Shunshuizhou Yak Meat \u0026 Cured Ribs Hotpot", "transport": "About a 2-minute walk from the North Gate entrance of Dukezong Ancient Town."}, {"address": "No. 3 Pijiang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | A legendary, poetic classic Tibetan restaurant with interior decor steeped in Tibetan Buddhist culture. The signature Tibetan roasted ribs are crispy on the outside and juicy inside; the sweet tea is smooth and perfectly balanced, while fried highland barley noodles offer a rich, nutty aroma. Dining here amid folk music and traditional Tibetan murals is a visual and culinary delight.", "name": "Makye Ame Tibetan Restaurant", "transport": "About a 3-minute walk from below the Ancient Town Prayer Wheel."}, {"address": "No. 15 Zhonggang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | A hidden classic favorite frequented by locals, famous for affordable and authentic home-style Tibetan dishes. Must-orders include springy, savory Tibetan sausages that pair wonderfully with fried barley buns, and freshly churned salted butter tea. With its velvety blend of rich milk and tea aromas, it is the top local choice to beat the highland cold.", "name": "Xile Tibetan Restaurant", "transport": "About a 6-minute walk from the South Gate of Dukezong Ancient Town."}, {"address": "No. 88 Songzan Road, outside Sumtseling Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Located near Ganden Sumtseling Monastery, this traditional restaurant is highly praised by tourists and pilgrims alike. Their signature highland barley yak meat steamed buns have thin wrappers filled with juicy, flavorful meat that bursts with every bite. Paired with traditional Tibetan beef noodle soup with springy noodles in rich bone broth, it is the perfect spot for authentic highland cuisine after visiting the monastery.", "name": "Remei Tibetan Cuisine", "transport": "Take Shangri-La Bus Route 3 to Sumtseling Monastery Station, then walk for about 3 minutes."}, {"address": "Intersection of Jiantang Road and Changzheng Avenue, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | An established restaurant famous for recreating grand Tibetan royal feasts and vibrant cultural experiences. Here, guests can feast on traditional whole roasted lamb and specialty matsutake yak meat banquets. The roasted lamb features crispy skin, succulent meat, and rich aroma, perfectly enhanced by custom plateau spice chili powder. Paired with exquisite Tibetan desserts and homemade barley wine, guests experience true Tibetan hospitality alongside world-class food.", "name": "King of Tibet Restaurant", "transport": "Located at the eastern entrance of Dukezong Ancient Town; reachable directly by taxi or short walk."}], "name": "Local Iconic Restaurants"}, "cat_2": {"items": [{"address": "No. 16 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A famous caf\u00e9 located inside Dukezong Ancient Town, renowned for its special yak milk latte and handmade highland barley bread. The coffee is rich and silky smooth, perfectly blending bold espresso with rich plateau yak milk for a warm, subtly sweet flavor. Visitors love sitting by the second-floor window, savoring a freshly baked, crispy highland barley croissant while overlooking the cobblestone streets below and soaking in the sunny, relaxed highland vibe.", "name": "Flying Birds Cafe", "transport": "Walk directly to Jinlong Street in Dukezong Ancient Town"}, {"address": "No. 34 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Co-managed by foreign and local owners, this classic American and Tibetan brunch spot is a favorite among international backpackers. They serve generous hearty Full English breakfasts, yak meat burgers, and handmade pies. The house-special butter coffee offers a complex, aromatic flavor profile that quickly replenishes your energy in the high altitude. Decorated in a vintage travel style with a warm atmosphere, it\u0027s the perfect launching pad to fuel up before exploring the ancient town.", "name": "The Compass Cafe \u0026 Restaurant", "transport": "About a 5-minute walk from Moonlight Square in Dukezong Ancient Town"}, {"address": "Nishi Village, next to Songzanlin Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Rich in Tibetan culture and artistic charm, this caf\u00e9 is located near the Songzanlin Monastery scenic area. It features freshly ground Yunnan Arabica coffee paired with Tibetan highland barley waffles\u2014crispy on the outside, soft on the inside, with a unique nutty grain aroma that pairs perfectly with wild honey. Soothing Tibetan music plays inside, while a cozy fireplace and exquisite Mani stone displays allow guests to peacefully enjoy the high-altitude tranquility and aromatic coffee.", "name": "Silent Holy Stones Cafe", "transport": "Take Bus No. 3 to Songzanlin Monastery Station, then walk about 8 minutes"}, {"address": "Next to Moonlight Square, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Located next to Moonlight Square in Dukezong Ancient Town, boasting a fantastic open-air terrace with distant views of the world\u0027s largest prayer wheel. The caf\u00e9 highlights its signature Yak Milk Caramel Macchiato and handmade cheesecake, which features a velvety texture that melts in your mouth with subtle tangy milk notes and sweet caramel aroma. Whether grabbing a hot baked brunch in the morning or basking in the afternoon sun, it\u2019s one of the most popular scenic caf\u00e9 choices in town.", "name": "Bhakhor Cafe", "transport": "Walk directly to Moonlight Square in Dukezong Ancient Town"}, {"address": "No. 68 Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A beloved independent bakery caf\u00e9 in Dukezong Ancient Town popular among both locals and tourists, baking fresh European breads and specialty Tibetan pastries every morning. Highly recommended are the signature Highland Barley Yogurt Tart and pour-over Yunnan specialty coffee. The tart is smooth, sweet, and tangy, perfectly balanced by the fruity notes of pour-over coffee. With its clean and cozy decor, tables fill up fast during brunch hours, making it a top pick for authentic plateau desserts and premium coffee.", "name": "Sunline Bakery \u0026 Cafe", "transport": "About a 3-minute walk from the North Gate entrance of Dukezong Ancient Town"}, {"address": "Inside Songtsam Linka Retreat, Kena Village, Songzanlin Monastery, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.9 stars | A high-end scenic cafe inside the Songtsam Linka Retreat, directly facing majestic panoramic views of Songzanlin Monastery. It offers exquisite Tibetan-British brunch and afternoon tea sets for two, featuring handmade yak cheese tarts, highland barley cakes, and signature plateau snow chrysanthemum coffee. The coffee offers distinct layers with elegant floral notes. With top-tier service and breathtaking sacred monastery views, guests can enjoy an unparalleled luxury plateau brunch experience.", "name": "Songtsam Linka Lounge \u0026 Cafe", "transport": "Recommended to take a taxi or hotel private transfer directly to Songtsam Linka Retreat"}, {"address": "No. 12 Chicika Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Named after Yunnan\u0027s sacred snow mountain, this popular culture caf\u00e9 is steeped in hiking culture and Tibetan vibes. Highlights include espressos brewed from Yunnan Baoshan and Pu\u0027er beans, along with freshly made plateau yak milk tiramisu. The tiramisu is rich and moist, blending liquor aroma and smooth yak milk into a delightful treat. The welcoming owner often shares Shangri-La hiking tips with guests, making it a wonderful spot to relax and recharge in the morning.", "name": "Kawa Kharpo Cafe", "transport": "Walk directly to Chicika Street in Dukezong Ancient Town"}, {"address": "No. 10 Asalang, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | An innovative independent shop focused on blending traditional Tibetan culinary elements into modern coffee creations. The standout item is their signature \u0027Plateau Tibetan Snow Yak Latte\u0027, topped with fine foam and crunchy highland barley bits for a rich, delightfully textured drink. Brunch options include freshly baked yak meat pizza and Tibetan sweet tea. Highly favored by young travelers and photography enthusiasts, its cozy wooden interior makes for great photos.", "name": "Yak Coffee Shop", "transport": "About a 6-minute walk from Guishan Park in Dukezong Ancient Town"}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "No. 12 Jinding Lane, Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Located inside Dukezong Ancient Town, this famous spot is renowned for its traditional ancient-method cured rib hotpot. Carefully selected local plateau black pork ribs are wind-dried and cured for months, yielding a rich, savory broth with a unique cured flavor and tender, juicy meat. Paired with local wild mushrooms and fresh highland vegetables, it offers a perfect balance of savory and sweet. The piping hot broth is ideal for warding off the cold plateau nights, making it a highly recommended comforting feast for both tourists and locals.", "name": "Amama Cured Ribs Hotpot", "transport": "About a 5-minute walk from the North Gate of Dukezong Ancient Town."}, {"address": "No. 15 Jinding Lane, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Combining traditional Tibetan flavors with a modern bistro vibe, this unique venue features warm wooden decor rich in Tibetan cultural accents. The signature pan-seared yak steak is crispy on the outside and tenderly juicy on the inside. Signature highland barley craft beer and barley cocktails are table must-haves, offering a subtle grain aroma with a refreshing sweetness. Paired with soothing traditional music, it\u0027s a favorite spot for travelers to enjoy a relaxed, slightly tipsy evening.", "name": "Talo Tibetan Restaurant \u0026 Bar", "transport": "Located in the core area of Dukezong Ancient Town, about a 3-minute walk from Guishan Park."}, {"address": "No. 3 Pijiangpo, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A well-known bistro steeped in classic Tibetan culture, adorned with traditional handicrafts and books. The specialty dish, \u0027Hot Stone Roasted Yak Beef\u0027, uses high-temperature pebbles to sear in the juices, delivering a wonderfully springy texture with a subtle smoky aroma. Pair it with warm, rich sweet butter tea or home-brewed highland barley wine for a smooth, cozy meal. With its elegant, relaxed ambiance, food lovers flock here to experience authentic Tibetan food culture and slow living.", "name": "Makye Ame Tibetan Restaurant \u0026 Bar", "transport": "About a 4-minute walk from Moonlight Square in the ancient town."}, {"address": "No. 34 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | A top-rated local restaurant acclaimed for its generous portions and friendly service. The must-order \u0027Tibetan Chieftain Roast Meat\u0027 uses local Tibetan fragrant pork, featuring crispy skin, tender meat, and rich flavor without being greasy. The \u0027Highland Barley Pancake with Yogurt\u0027 is an astonishing dessert pair\u2014crispy outside, soft inside pancakes dipped in thick, slightly tart handmade highland yogurt. Its affordable prices and authentic local flavors keep this house packed.", "name": "Flying Pig Tibetan Restaurant", "transport": "About a 6-minute walk after entering from the South Gate of Dukezong Ancient Town."}, {"address": "No. 18 Chilangshuo Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Tucked away in an alley, this cozy late-night spot seamlessly blends traditional Tibetan cuisine with a modern bar vibe. The signature \u0027Tibetan Yak Beef Hotpot\u0027 features a sweet, clear broth with thick, chewy sliced yak meat served with special Tibetan chili sauce for a spicy, mouth-watering kick. Complement your late-night mood with a glass of house-brewed wild strawberry barley wine, where fruity notes merge smoothly with grain aromas. Its quiet, romantic setting makes it a sanctuary for night owls.", "name": "Silent Night Tibetan Bistro", "transport": "About a 4-minute walk from Sifang Street in the ancient town."}, {"address": "No. 22 Cuolang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A unique bistro with a retro, hipster vibe that is beloved by independent travelers. A hit dish is the \u0027Tibetan Matsutake Steamed Buns\u0027, stuffed thin-skinned dough with local wild matsutake mushrooms and juicy minced meat, bursting with earthy aroma and broth in every bite. Pair it with a cup of freshly churned savory butter tea\u2014its rich milky and tea aroma slides smoothly down your throat for a memorable taste combo.", "name": "Shunshui Zhou Tibetan Bistro", "transport": "Located inside Dukezong Ancient Town, about a 3-minute walk from Sifang Street."}, {"address": "No. 68 Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A long-established local favorite famous for its lavish \u0027Copper Pot Chieftain Feast\u0027. The traditional copper pot is packed with thick slices of yak meat, fragrant Tibetan pork, handmade meatballs, and mountain vegetables. Slow-simmered to perfection, the broth becomes incredibly flavorful and rich while the meat turns melt-in-your-mouth tender. Great prices and massive portions make this the top choice to experience hearty Tibetan feast culture.", "name": "Yintong Local Tibetan Hotpot Bistro", "transport": "Located near the North Gate of Dukezong Ancient Town, about a 2-minute walk."}, {"address": "No. 1 Shangmao Street, Sumtseling Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A scenic bistro adjacent to the Ganden Sumtseling Monastery scenic area, offering views of the magnificent monastery complex while you dine. The signature \u0027Pan-Fried Butter Ginseng Fruit Rice\u0027 stir-fries local potentilla (ginseng fruit) with rice, butter, and sugar, yielding a deliciously sweet, aromatic, and pleasantly chewy texture. The \u0027Tibetan Yogurt Ginseng Fruit Salad\u0027 is equally refreshing. Serving refined Tibetan pour-over coffee and custom barley drinks, it\u0027s an ideal resting stop after touring the monastery.", "name": "Sumtseling Snow Mountain Tibetan Bistro", "transport": "Take Shangri-La Bus No. 3 to Sumtseling Monastery Station, then walk for about 3 minutes."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 54 Jinlong Street, Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A popular vegetarian restaurant near Dukezong Ancient Town, focusing on healthy vegetarian dishes made with fresh ingredients from the Tibetan plateau. Their signature \u0027Matsutake \u0026 Wild Mushroom Hot Pot\u0027 is particularly famous, featuring a sweet, flavorful broth and chewy wild mushrooms with subtle high-mountain earthy aromas. The \u0027Highland Barley Vegetarian Pancake\u0027 is crispy on the outside, soft on the inside, and rich in wheat aroma. Both tourists and local monks adore its tranquil ambiance and wholesome, natural flavors.", "name": "Jingxin Vegetarian Restaurant (\u975c\u5fc3\u7d20\u81b3)", "transport": "Take Shangri-La Bus Route 1 to \u0027Gucheng Beimen (Ancient Town North Gate) Station\u0027, then walk for about 3 minutes."}, {"address": "No. 12 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | An exquisite restaurant combining Tibetan flair with modern plant-based cuisine. The signature \u0027Tibetan Vegetarian Pilaf\u0027 uses alpine red rice seasoned with various vegetables, offering distinct grains and rich flavor layers. The \u0027Hand-Shredded Vegetarian Beef\u0027 is made from soy protein baked with local Tibetan spices, resulting in a chewy, pleasantly spicy, and remarkably realistic texture. Its warm wooden Tibetan decor and guilt-free healthy flavors attract plant-based food lovers from all around.", "name": "Zang Su Ge Vegetarian Restaurant (\u85cf\u7d20\u95a3\u852c\u98df\u9910\u5ef3)", "transport": "About a 5-minute walk from Moonlight Square in Dukezong Ancient Town."}, {"address": "No. 10 Commercial Street, next to the entrance of Sumtseling Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Located near Sumtseling Monastery, this is a top dining choice for visitors after exploring the temple. Embracing a healthy low-oil, low-salt culinary philosophy, their \u0027Highland Morel Stewed Tofu\u0027 features rich broth with tofu that absorbs the essence of mushrooms, melting in your mouth with incredible sweetness. The \u0027Highland Barley Sweet Ferment\u0027 is pleasantly sweet and sour, chewy with a hint of floral wine aroma\u2014a refreshing traditional Tibetan dessert. The peaceful, serene atmosphere and soul-soothing dishes bring complete relaxation to body and mind.", "name": "Bodhi Heart Vegetarian Restaurant (\u83e9\u63d0\u5fc3\u852c\u98df\u990a\u751f\u9928)", "transport": "Take Shangri-La Bus Route 3 to \u0027Songzanlin Temple Scenic Area Station\u0027, then walk for about 2 minutes."}, {"address": "No. 38 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Housed inside a traditional building in Dukezong Ancient Town, this spot is famous for authentic vegetarian Tibetan snacks. The \u0027Crispy Fried Veggie Buns\u0027 feature a golden, crunchy crust stuffed with highland cabbage and wild mushrooms that burst with flavor in every bite. The \u0027Vegetarian Butter Tea\u0027 uses plant oils to recreate the rich, milky, savory-sweet flavor of traditional yak butter tea, smoothly warming your stomach. Cozy tatami seating and warm hospitality offer travelers a uniquely cozy high-altitude welcome.", "name": "Snowland Vegetarian Restaurant (\u96ea\u57df\u7d20\u98df\u9928)", "transport": "About a 4-minute walk from the Giant Prayer Wheel in Guishan Park."}, {"address": "No. 5 East Side of Moonlight Square, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | An affordable vegetarian restaurant right next to Moonlight Square, beloved by backpackers and locals alike. Their signature \u0027Highland Wild Herb Fried Rice\u0027 pairs seasonal wild greens with fragrant rice, producing fluffy grains with a refreshing forest herbal aroma. The \u0027Hot and Sour Vegetarian Pickle Noodle Soup\u0027 is appetizingly tangy with springy glass noodles, providing ultimate satisfaction in the chilly plateau weather. With a commitment to pollution-free ingredients, it offers comforting, honest flavors at friendly prices.", "name": "Yuanqi Vegetarian Restaurant (\u7de3\u8d77\u7d20\u98df\u9928)", "transport": "Walk to the east side of Moonlight Square in Dukezong Ancient Town."}, {"address": "No. 22, Group 1, Songzanlin Village, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Located around Sumtseling Monastery, offering a wide variety of vegetarian meals. Highly recommended is the \u0027Roasted Tibetan Potatoes\u0027, featuring crispy skins and fluffy, velvety interiors dusted with signature chili and cumin powders. The \u0027Auspicious Vegetarian Hot Pot\u0027 comes with high-altitude cold-water tofu and assorted wild mountain greens served in a light, non-greasy broth. The solemn and elegant atmosphere makes it an ideal spot to experience Tibetan Buddhist culture alongside nourishing plant-based dining.", "name": "Foguang Vegetarian House (\u4f5b\u5149\u7d20\u81b3\u623f)", "transport": "Take Bus Route 3 to \u0027Songzanlin Temple Station\u0027, then walk for about 6 minutes."}, {"address": "No. 18 Pijiangpo, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | A cozy bistro tucked away in the flagstone alleys of Dukezong Ancient Town. The signature \u0027Black Truffle Vegetarian Fried Noodles\u0027 seamlessly pairs luxurious black truffle sauce with chewy noodles for a rich, aromatic, and velvety texture. The \u0027Pan-Fried Tibetan Veggie Flatbread\u0027 is crispy on the outside with a savory, milk-flavored plant-based filling, making it popular among young travelers. Soothing Buddhist chants play softly inside, allowing guests to immerse themselves in the unhurried pace of the ancient town.", "name": "Jingzong Vegetarian Bistro (\u6de8\u5b97\u7d20\u98df\u5c0f\u9928)", "transport": "About a 3-minute walk from Sifang Street in the Ancient Town."}, {"address": "No. 88 Chicika Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | A fusion cafe combining light bites with Tibetan vegetarian cuisine. Their specialty \u0027Matsutake \u0026 Wild Mushroom Veggie Pizza\u0027 features a thin, crispy crust loaded with fresh matsutake slices and custom vegan cheese, delivering a rich mushroom aroma and gooey bite every time. The \u0027Highland Red Bean Sweet Soup\u0027 is silky, soft, mildly sweet, and deeply warming. Decorated with lush greenery and artistic vibes, it is a fabulous spot for taking photos and enjoying innovative plant-based meals.", "name": "Green Oasis Vegetarian Cafe (\u7da0\u91ce\u4ed9\u8e64\u852c\u98df\u9910\u5ef3)", "transport": "About a 5-minute walk from the South Gate of the Ancient Town."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 12 Jinlong Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Located at the entrance of Dukezong Ancient Town, this small stall is a must-buy snack for visitors exploring the historic streets. Freshly baked, the highland barley cake features a golden, crispy crust with a subtle nutty grain aroma and natural sweetness inside. Dense yet delightfully chewy, every bite offers the pure grain flavor of highland barley. Locals especially love pairing it with a hot cup of butter tea on chilly mornings or afternoons; the rich dairy aroma blends perfectly with the warm barley cake, making it the ultimate street food to warm your stomach and combat altitude sickness.", "name": "Ama Hot Barley Cake", "transport": "Walk directly to the entrance of Jinlong Street in Dukezong Ancient Town."}, {"address": "Stall next to No. 18 Sifang Square, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | This bustling stall near Sifang Square carefully selects local highland yak beef, marinates it with secret Tibetan spices and cumin, and grills it sizzling over hot charcoal. One bite reveals a lightly charred exterior, followed by juicy, delightfully chewy meat bursting with rich savory flavors and a hint of spicy kick. As dusk falls, many tourists enjoy these skewers while watching the Guozhuang dance at Sifang Square, fully soaking in the vibrant street night market atmosphere of Shangri-La.", "name": "Dukezong Charcoal Grilled Yak Meat Skewers", "transport": "About a 3-minute walk to Sifang Square from the iconic Giant Prayer Wheel in Dukezong Ancient Town."}, {"address": "No. 35 Beimen Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | An incredibly popular handcrafted yogurt stall in Dukezong Ancient Town, fermented from pure highland yak milk. The yogurt has a thick, custard-like texture topped with a precious layer of yellow cream skin, offering an exceptionally smooth and velvety mouthfeel. Since natural yak yogurt is quite tart, the stall drizzles it with wild honey and whit
