e sugar. The sweet and sour flavor interplay is heavenly, leaving a long-lasting milky fragrance that turns first-time visitors into loyal fans.", "name": "Silent Night Tibetan Handcrafted Yak Yogurt", "transport": "About a 5-minute walk from the North Gate Parking Lot of the Ancient Town."}, {"address": "No. 68 Cangfang Street, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Combining Yunnan culinary traditions with highland flavors, this street stall uses specially made small tofu from Shiping and Jianshui, roasting them on a charcoal grill until puffed up and golden. The exterior is crispy and fragrant, while the inside remains silken and molten like tofu pudding. Biting into one causes it to burst in your mouth, releasing a rich soybean aroma. Served with signature chili powder and dipping sauces, it delivers a spicy, savory kick\u2014a favorite afternoon snack for locals and evening treat for tourists.", "name": "Shangri-La Ancient Town Bursting Grilled Tofu", "transport": "Walk to the middle section of Cangfang Street in Dukezong Ancient Town."}, {"address": "No. 22 Chilang Road, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.3 stars | Naizha (cheese curd) is a precious byproduct of traditional Tibetan butter making. This stall kneads the cheese curd with a bit of flour and honey before grilling it fresh to order. Hot off the grill, the cake emits a rich fermented dairy aroma with a gentle sweet-and-sour note. The outer layer is lightly crisp, while the inside has a unique, pleasantly chewy texture that grows more fragrant as you chew. It\u0027s a one-of-a-kind traditional dairy snack loved by travelers seeking authentic Tibetan flavors.", "name": "Tibetan Roasted Naizha Cheese Cake", "transport": "About a 4-minute walk from Moonlight Square."}, {"address": "No. 5 Commercial Street, Outside Sumtseling Monastery Scenic Area, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Shangri-La is famous for its wild matsutake mushrooms. This roadside steamer stall chops fresh, precious matsutake and blends it into savory yak meat fillings to make large Tibetan steamed buns. The fluffy, fermented dough absorbs all the delicious juices; with one bite, the matsutake broth explodes on your palate, bringing a unique alpine forest aroma combined with rich yak beef flavor. Getting top-tier matsutake delicacy at such an affordable price makes it a highly rated snack before visiting Sumtseling Monastery.", "name": "Jixiang Matsutake \u0026 Tibetan Bun Stall", "transport": "Take Shangri-La Bus Route 3 to Sumtseling Monastery Station, then walk for about 2 minutes."}, {"address": "No. 15 Yamenlang Road, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Potatoes are the heart and soul of Yunnan street food. This stall uses yellow-fleshed potatoes grown at high altitudes in Shangri-La, cut into thick strips or chunks, and fried fresh to order. Golden and crispy on the outside, the inside is soft and fluffy like mashed potatoes. After frying, they are tossed with signature Danshan chili powder, fresh herbs, scallions, and secret sauce. Spicy, savory, and addictively crisp, it\u0027s a go-to street snack for locals and travelers alike.", "name": "Highland Spicy Fried Potato Stall", "transport": "Walk near the Ancient Jiming Temple in Dukezong Ancient Town to find the stall."}, {"address": "No. 8 Pijiangpo, Dukezong Ancient Town, Shangri-La City, Diqing Tibetan Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | Shangri-La\u0027s dry, cold climate is ideal for producing traditional air-dried meat. Located in the ancient town market, this small stall displays rows of hanging dried yak meat, freshly sliced thin or shredded to order. The meat boasts a deep red color with clear grain, offering a firm, savory chew without any gamey odor. As you chew, it releases the natural sweetness and robust wild flavor of the meat\u2014perfect for snacking on the go or taking along as a high-energy energy boost.", "name": "Tibetan Air-dried Yak Meat Slice Stall", "transport": "About a 2-minute walk from the entrance of Pijiangpo in Dukezong Ancient Town."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Shangri-La Dukezong and Songzanlin Monastery"}, "tengchong_heshun": {"categories": {"cat_1": {"items": [{"address": "Near Shuisheng Temple, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located near Shuisheng Temple in Heshun Ancient Town, this legendary century-old restaurant is an iconic local institution. The must-try item is Tengchong\u0027s traditional \u0027Earthenware Pot\u0027 (Tuguozi), slow-simmered in a volcanic clay pot. The rich, savory broth is layered with golden crispy pork, handmade egg rolls, taro, and greens, bursting with rich flavors in every bite. Their Stewed Native Chicken with Ginkgo Nuts is also a masterpiece\u2014tender chicken paired with the delicate bittersweetness of ginkgo, loved by both gourmets and locals.", "name": "Heshun Renjia Restaurant", "transport": "After entering Heshun Ancient Town, walk along the main street for about 8 minutes."}, {"address": "Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Featured on the renowned documentary A Bite of China, this famous traditional eatery is tucked away in an alley of Heshun Ancient Town. The signature Xi Dou Fen (dilute pea porridge) is made from premium yellow peas slow-cooked to a silky, melt-in-your-mouth smoothness. Paired with freshly fried golden crispy Youtiao (churros) or grilled chewy Erkuai (rice cakes), and topped with crushed peanuts, signature chili oil, garlic water, and fresh cilantro, it offers an explosion of savory, spicy, sour, and nutty flavors. It\u0027s Tengchong\u0027s most iconic breakfast snack.", "name": "Cundama Xidoufen (Aunt Cun\u0027s Pea Porridge)", "transport": "About a 5-minute walk from Heshun Library in Heshun Ancient Town."}, {"address": "By Wild Duck Lake, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Built right by the water in a century-old traditional courtyard house, this restaurant offers delightful dining accompanied by scenic views of Wild Duck Lake. Their signature dish is Tengchong\u0027s legendary \u0027Da Jiu Jia\u0027 (stir-fried Erkuai rice cakes), where soft yet chewy rice slices are wok-fried over high heat with cured ham, chicken, eggs, and tomatoes, infused with smoky wok hei and a perfect savory-sour balance. The Herb Grilled Fish is another favorite\u2014crispy on the outside, tender inside, and bursting with uniquely local Yunnan herbal aromas.", "name": "Jinshuiloutai Restaurant", "transport": "Easily accessible by walking along the Lake Ring Road in Heshun Ancient Town."}, {"address": "Next to Jia Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Brimming with Overseas Chinese nostalgic charm, this long-standing restaurant features classic Tengchong architectural style. The signature \u0027Gan Ma Rou\u0027 (Caravaneer\u0027s Stewed Pork) revives the rich culinary tradition of the ancient Tea Horse Road\u2014thick, succulent pork slow-braised in a secret sauce until melt-in-your-mouth tender, savory and spicy. Pair it with the refreshing \u0027Stir-fried Pork with Palm Buds\u0027 (Zongbao Chaorou), featuring tender, slightly bitter yet sweet palm flowers that highlight authentic Western Yunnan mountain delicacies.", "name": "Qiaoxiangcun Restaurant", "transport": "Take the electric shuttle bus from the entrance of Heshun Ancient Town to Jia Ancestral Hall, then walk for about 2 minutes."}, {"address": "Next to the Visitor Center, Volcano Hot Sea Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Located within the Hot Sea Geothermal Park, this iconic eatery cooks its dishes using natural geothermal boiling water. The steaming broth is slow-boiled for hours with hen chicken and pork bones for incredible richness. Fresh ingredients\u2014such as thin slices of local Ersi rice noodles, sliced meat, quail eggs, and chives\u2014are added sequentially into the piping-hot soup. Chewy, smooth, and naturally sweet, it offers an essential immersive culinary ritual when visiting Rehai.", "name": "Rehai Dagunguo Ersi Restaurant", "transport": "Take the dedicated bus route from downtown Tengchong to Hot Sea Scenic Area and get off at the final stop."}, {"address": "Opposite Liu Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | Passed down through generations in Heshun Ancient Town, this classic establishment is renowned for sticking to traditional hand-stirred pea paste methods. The pea porridge is served warm and silky, drizzled with house-made chili oil, sesame oil, and roasted chili powder for an irresistible aroma. Their unique signature \u0027Xi Dou Fen Baba\u0027 dips freshly roasted glutinous rice cakes into hot pea porridge, perfectly combining sticky chewiness with velvety smooth soup. A daily favorite among local neighborhood regulars.", "name": "Zhangji Hexianghua Xidoufen", "transport": "Located in the core area of Heshun Ancient Town\u0027s main street, easily accessible on foot."}, {"address": "Datankan Section, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 Stars | A decades-old favorite serving home-style Western Yunnan dishes, deeply loved by local families and foodies alike. The house specialty \u0027Huangmen Chicken\u0027 (Yellow Braised Chicken) uses free-range local chicken cooked in a rich, spicy, garlicky sauce\u2014tender yet chewy, and incredible over steamed rice. For dessert, the \u0027Songhua Gao\u0027 (Pine Pollen Cake) made with natural pine pollen and sweet red bean paste melts effortlessly in the mouth with a delicate floral aroma, full of nostalgic rustic charm.", "name": "Laojia Traditional Restaurant", "transport": "About a 6-minute walk from Ai Siqi\u0027s Former Residence in Heshun."}, {"address": "No. 20, Shuisheng Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A renowned restaurant specializing in \u0027Tuguozi\u0027 (Volcanic Earthenware Hot Pot), an intangible cultural heritage item of Tengchong. Crafted from local volcanic clay and heated with charcoal, the pot simmers tender bamboo shoots, taro, and greens at the bottom, topped with golden crispy pork and handmade egg rolls. The rich broth absorbs all the ingredients\u0027 essence, tasting savory, clear, and ungreasy. The soaked pork pieces become soft yet juicy\u2014the absolute best way to experience traditional Tengchong feast-style dining.", "name": "Fushun Sanhe Tuguozi Restaurant", "transport": "About a 10-minute walk from the main gate of Heshun Ancient Town."}], "name": "Local Iconic Heritage Restaurants"}, "cat_2": {"items": [{"address": "Near Shuisheng Temple, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 Stars | A trendy and famous bookshop cafe perched on the high alleys of Heshun Ancient Town, boasting striking architectural design and play of light. Famous for hand-poured Yunnan Arabica coffee and signature cold brews, paired with freshly made American brunch and artisanal spread toast. The coffee features a smooth body with subtle natural notes of citrus and nuts, making it a beloved haven for hipster travelers and readers looking to savor a tranquil morning.", "name": "An Zhi Ru Su Book \u0026 Cafe", "transport": "About a 15-minute walk from the main gate of Heshun Ancient Town; head uphill along the cobblestone path toward Shuisheng Temple."}, {"address": "Shizilu Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A vintage-style cafe tucked beside a quaint small bridge and stream in Heshun Ancient Town, filled with retro antiques and lush greenery. Serves exquisite English brunch platters, fresh vegetable sandwiches, and handmade Basque cheesecake. The signature Yunnan Arabica latte is rich and velvety, perfectly balancing roasted coffee bitterness with a touch of brown sugar sweet notes. Sitting by the river, sipping your morning brew while watching local women wash vegetables by the stream offers an authentic taste of local life.", "name": "Time Cafe", "transport": "Walk along the river for about 8 minutes from Heshun Library in Heshun Ancient Town."}, {"address": "By Wild Duck Lake, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Featuring the best lake view in Heshun Ancient Town, this scenic cafe sits right beside Wild Duck Lake with sweeping panoramic vistas. Offers creative fusion brunches using local ingredients, such as Yunnan sausage egg crepes and avocado baked egg toast, paired with house-roasted Baoshan Arabica coffee. The coffee boasts bright fruity acidity and a distinct red wine finish. Relax on the outdoor terrace with a hearty brunch while watching wild ducks glide across the water.", "name": "Wild Duck Lake Cafe", "transport": "Take the sightseeing shuttle cart inside the ancient town to Wild Duck Lake Stop, then walk for 2 minutes."}, {"address": "Beside Liu Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A popular spot among young travelers, blending minimalist industrial style with Heshun\u0027s traditional wooden architecture. Renowned for freshly toasted sourdough sandwiches, Eggs Benedict, signature ice drip coffee, and osmanthus lattes. The osmanthus latte carries a subtle floral fragrance that is smooth and refreshing, complementing the rich, savory Hollandaise sauce of the Benedict\u2014a satisfying way to recharge your morning energy.", "name": "Seize the Day Coffee", "transport": "A 3-minute walk from Liu Ancestral Hall, located in an alley off the main pedestrian street."}, {"address": "Jia Ancestral Hall Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | Housed in a century-old traditional courtyard, this cafe exudes historic charm surrounded by lush gardens and quiet spaces. Serves American country-style brunches alongside single-origin specialty pour-overs and signature drinks like rose lattes. The rose latte blends locally crafted edible rose syrup with smooth espresso for an elegant floral flavor. Paired with crispy French fries and juicy beef burgers, it\u0027s a top pick for Instagram-worthy moments and lazy morning retreats.", "name": "Shi Guang Courtyard Cafe \u0026 Brunch", "transport": "About a 10-minute walk from Heshun Ancient Town parking lot; follow the signposts into the lane."}, {"address": "Opposite Cun Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 Stars | Located right next to the Ancient Banyan Tree Square, this cozy coffee shop preserves the relaxed, laid-back vibe of the old streets. The house favorites include freshly ground Baoshan Americanos and roasted Rubing (local goat milk cheese) sandwiches, cleverly fusing Western brunch with local Yunnan flavors. The coffee offers a balanced bittersweet aroma, while the Rubing sandwich is delightfully crispy and creamy\u2014an unforgettable spot to experience Tengchong\u0027s coffee scene and local culture.", "name": "Under the Banyan Tree Cafe", "transport": "A 5-minute walk from the entrance of Heshun Ancient Town to Ancient Banyan Tree Square."}, {"address": "No. 1 Lijia Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A professional specialty cafe focused on Yunnan bean roasting and custom brews, located on a pleasant second-floor balcony with great views. Offers silky Flat Whites, cold brews, and freshly made French toast brunch. The Flat White features silky microfoam highlighting chocolate and nutty undertones of local beans, while the golden French toast is crispy outside, tender inside, and drizzled with sweet maple syrup\u2014a highly recommended spot by local coffee aficionados.", "name": "Heshun No. 1 Specialty Coffee", "transport": "About a 6-minute walk from Heshun Zongbing Mansion; follow the street signs along Lijia Lane."}, {"address": "Next to the entrance of Tengchong Volcano National Geopark, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A nature-themed cafe located near the Volcano and Geothermal Heat Scenic Area, offering scenic distant views of the volcanic cluster. Serves energizing brunch platters, whole-wheat nut sandwiches, and a signature \u0027Volcano Ash\u0027 charcoal latte. The charcoal latte is visually stunning with a subtle sweet, roasted aroma, while the wholesome sandwiches served with fresh fruit and yogurt provide the perfect morning recharge before hiking volcanoes or soaking in hot springs.", "name": "Volcano Thermal Landscape Cafe \u0026 Brunch", "transport": "Take the direct Volcano Scenic Area tourist bus or a taxi from Tengchong downtown; takes about 30 minutes to reach the park gate."}], "name": "Popular Cafes \u0026 Brunch Spots"}, "cat_3": {"items": [{"address": "Next to the Small Bridge at the Crossroads, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 Stars | Located in the heart of Heshun Ancient Town, this must-visit restaurant offers authentic Tengchong flavors. The signature \u0027Tengchong Da Jiu Jia\u0027 (stir-fried Erkuai rice cakes) is sliced thin and evenly, soft yet chewy with a rich wok hei aroma, wok-tossed with eggs, tomatoes, and sliced meat for a savory, mildly spicy, and sweet-and-sour flavor profile. The classic \u0027Copper Pot Kohlrabi Fish\u0027 features a fresh, tangy, and spicy broth with tender, melt-in-your-mouth fish. Preserving an ancient courtyard style, the setting is quaint and cozy, highly recommended by both tourists and locals.", "name": "Chef Cun \u00b7 Yunnan Local Cuisine (Cun Da Chu Yunnan Local Cuisine)", "transport": "About an 8-minute walk from the main gate of Heshun Ancient Town."}, {"address": "Shuitou Village, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A popular ancient town restaurant passing down generations of home-cooked recipes, touching diners with authentic nostalgic flavors. The star dish is the \u0027Clay Pot Stew\u0027 (Tu Guo Zi), slow-cooked in traditional earthenware filled with pork bone broth, taro, crispy fried pork, egg rolls, and wild mushrooms. The broth is rich and fragrant, with ingredients fully absorbing the savory essences. Additionally, the \u0027Stir-fried Palm Flower Bud with Pork\u0027 offers a slightly bitter yet sweet finish\u2014a unique West Yunnan specialty ideal for tasting local wild plant ingredients.", "name": "Lao Heshun \u00b7 Mama\u0027s Cuisine (Lao Heshun Mama Cuisine)", "transport": "Take the ancient town sightseeing shuttle to Shuitou Village Station, then walk for about 3 minutes."}, {"address": "Near Liu Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 Stars | Set inside a century-old traditional West Yunnan quadrangle courtyard, offering a dining atmosphere rich in history and cultural heritage. The classic dish \u0027Caravan Pork\u0027 (Gan Ma Rou) uses well-marbled pork belly marinated with local spices and slow-roasted, yielding a rich, savory, and irresistibly aromatic bite without feeling greasy. Pair it with crisp-outside-soft-inside deep-fried dough sticks dipped in \u0027Xi Dou Fen\u0027 (smooth pea porridge)\u2014drizzled with chili oil and garlic juice for rich, distinct layers of flavor, making for a superb local dining experience.", "name": "Zhang Family Courtyard \u00b7 Taste of Mama (Zhang Family Courtyard Restaurant)", "transport": "About a 2-minute walk from Liu Ancestral Hall in Heshun Ancient Town."}, {"address": "Beside Shuanghong Bridge, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A classic time-honored local eatery near Shuanghong Bridge in Heshun, built along the waterfront with stellar views. Highly recommended is the \u0027Stewed Free-range Chicken with Ginkgo Nuts\u0027, slow-simmered for hours using high-quality ginkgo nuts from Gudong Ginkgo Village and local free-range chicken. The golden broth is rich, the chicken tender and juicy, and the ginkgo nuts soft and subtly sweet. For dessert, the \u0027Pine Pollen Cake\u0027 melts in your mouth with a delicate pine aroma, making it a favorite among women and family travelers.", "name": "Daqiaojia \u00b7 Heshun Renjia Restaurant (Daqiaojia Heshun Renjia Restaurant)", "transport": "Enter through the front gate of Heshun Ancient Town and cross Shuanghong Bridge to arrive."}, {"address": "Wild Duck Lake Shore, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.9 Stars | A scenic local private kitchen located on the banks of Heshun Wild Duck Lake, allowing guests to dine while taking in lake and mountain views with playing wild ducks. The specialty is the \u0027Wild Mushroom Free-range Chicken Hot Pot\u0027, combining handpicked high-altitude wild bolete, chanterelles, and dictyophora mushrooms with rich chicken broth. The soup is exquisitely flavorful with deep mushroom aromas, while the mushrooms are tender and crisp. The elegant garden decor and private rooms make it ideal for family gatherings or romantic dates.", "name": "Wild Duck Lake Mountain View Private Kitchen (Yeyahu Banshan Private Kitchen)", "transport": "About a 5-minute walk along the lakeside trail of Wild Duck Lake."}, {"address": "Middle Section of Bar Street, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 Stars | A unique spot blending traditional West Yunnan ingredients with modern bistro style, complete with live singers in the evening for a relaxed atmosphere. The \u0027Yunnan Wild Mushroom Pizza\u0027 comes highly recommended; the rich creamy cheese blends seamlessly with roasted wild mushroom aromas on a crispy yet soft crust. Pair it with house-brewed \u0027Papaya Wine\u0027 or \u0027Bayberry Cocktail\u0027, sweet-and-sour and smooth with subtle fruity aromas\u2014the top choice for unwinding with a drink in Heshun Ancient Town at night.", "name": "Wizard of Oz \u00b7 Music Bistro \u0026 Yunnan Cuisine (Oz Music Bistro \u0026 Yunnan Cuisine)", "transport": "Directly accessible on foot along Bar Street in Heshun Ancient Town."}, {"address": "Longquan Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 Stars | A quaint local restaurant near Longquan Temple, famous for traditional West Yunnan Caravan (Ma Bang) cuisine. The signature \u0027Caravan Roasted Pork\u0027 features crispy skin and tender meat, perfectly complemented by a spicy, aromatic dipping sauce. The \u0027Stir-fried Ersi Rice Noodles with Pickled Vegetables\u0027 pairs springy rice noodles with local fermented greens for a tangy, appetizing kick. Friendly service and generous portions make it a hit among backpackers and travelers seeking authentic, rustic local flavors.", "name": "Longquan Songheju \u00b7 Traditional Restaurant (Longquan Songheju Restaurant)", "transport": "About a 3-minute walk from Longquan Temple."}, {"address": "Diagonally Opposite Jia Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 Stars | A cozy bistro specializing in refined West Yunnan creative local dishes, tastefully elevating traditional recipes. The signature \u0027Spicy Mint Beef\u0027 features locally raised sliced yellow beef stir-fried over high heat with fresh mint leaves; the beef is tender and juicy, while the mint\u2019s refreshing herbal aroma cuts through rich flavors for an astonishing taste profile. The \u0027Copper Pot Potato Rice\u0027 pairs crispy rice crust with velvety potato cubes and cured pork bits\u2014fragrant, perfectly seasoned grains that will leave you craving bowl after bowl.", "name": "Chef Niu Niu \u00b7 Local Bistro (Niu Niu Da Chu Local Bistro)", "transport": "Walk to Jia Ancestral Hall to find the restaurant nearby."}], "name": "Specialty Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "No. 38 Lijia Alley, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Hidden in the cobblestone alleyways of Heshun Ancient Town, this famous vegetarian restaurant specializes in meat-free dishes made with local Yunnan wild mushrooms and organic vegetables. The \u0027Truffle Wild Mushroom Pot\u0027 is highly recommended\u2014seasonally harvested wild mushrooms slow-simmered in a rich, savory broth, offering a smooth yet chewy texture infused with a unique earthy and woody aroma. The tranquil, Zen-inspired antique ambiance makes it a favorite among health-conscious travelers and local vegetarians.", "name": "Heshun Suxin Zhai Vegetarian Restaurant", "transport": "About a 10-minute walk from the main entrance of Heshun Ancient Town."}, {"address": "No. 12 Shuiguan Road, Heshun Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | Famous for its affordable and diverse vegetarian buffet, this restaurant is a popular refueling stop for travelers exploring the ancient town. It offers over 30 vegetarian dishes made from local ingredients, with the \u0027Vegetarian Dali Ersi\u0027 (shredded rice cakes) and \u0027Crispy Vegetarian Cutlet\u0027 being crowd favorites. The Ersi has a delightfully chewy, smooth texture paired with a custom spicy mushroom sauce that is aromatic and rich in flavor. Warm service and a cozy, homelike atmosphere give guests a heartfelt, welcoming experience.", "name": "Cixinyuan Vegetarian Restaurant", "transport": "Take Tengchong Bus Route 6 to Heshun Ancient Town Station, then walk for about 5 minutes."}, {"address": "Inside the alley between Jia Clan and Cun Clan Ancestral Halls, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 stars | Located next to the iconic Cun Clan Ancestral Hall, this restaurant blends overseas Chinese heritage with traditional Buddhist vegetarian cuisine. The \u0027Stir-fried Bamboo Shoots with Wild Wood Ear Mushrooms\u0027 offers a tender, crisp texture with natural sweet notes, while the \u0027Tofu Meatball Soup\u0027 uses delicate, spring-water tofu that melts in your mouth. Many visitors stay after exploring the ancestral hall to savor this refined, elegant meal steeped in ancient charm.", "name": "Cun Clan Ancestral Hall Vegetarian Dining", "transport": "Accessible via walking tour in Heshun Ancient Town, located adjacent to the Cun Clan Ancestral Hall attraction."}, {"address": "No. 2 Dashuya Pond, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | Situated beside Dashuya Pond in Heshun, offering stunning waterfront and ancient town views, this exquisite establishment seamlessly combines creative plant-based dishes with Yunnan high-mountain tea art. The signature \u0027Stir-fried Lily Bulbs with Gingko Nuts\u0027 uses fresh local lily bulbs\u2014sweet and crisp\u2014and gingko, creating a multi-layered taste profile with a subtly bitter yet sweet finish. The classy wooden decor and soothing guqin music make it a popular photo spot for foodies seeking spiritual serenity and high-end plant-based dining.", "name": "Yunshui Chanxin Vegetarian \u0026 Tea House", "transport": "About an 8-minute walk from the Former Residence of Ai Siqi in Heshun Ancient Town."}, {"address": "Street-front shop at the central intersection of Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.3 stars | A highly reputable traditional vegetarian eatery locally, insisting on zero artificial additives to showcase the natural flavors of ingredients. The signature \u0027Vegetarian Steamed Mushroom Buns\u0027 feature a fluffy, bouncy dough packed with diced mushrooms and cabbage, bursting with aromatic juices upon every bite. Paired with a bowl of piping hot, creamy \u0027Red Bean and Peanut Congee,\u0027 it provides a deeply comforting and heartwarming meal. With budget-friendly prices, it is a top choice for breakfast and light meals among locals and backpackers.", "name": "Yixin Vegetarian Restaurant", "transport": "Walk to the main intersection in the center of Heshun Ancient Town; the prominent sign is easily visible."}, {"address": "Next to Rehai Banquet Restaurant inside Rehai Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | Located inside the Tengchong Volcanic Rehai Scenic Area, this restaurant highlights wellness plant-based cuisine steamed using natural geothermal steam. The famous \u0027Geothermal Steamed Mixed Vegetables\u0027 cooks sweet potatoes, corn, taro, and wild mountain vegetables over geothermal vents, locking in pure flavors and natural sweetness for a soft, light, and guilt-free treat. Enjoying wholesome geothermal-cooked food while taking a hot spring bath is a top-tier luxury experience not to be missed in Rehai.", "name": "Rehai Hot Springs Wellness Vegetarian Restaurant", "transport": "Take the Rehai Bus Line from downtown Tengchong directly to the entrance gate of Rehai Scenic Area, then transfer to a scenic shuttle bus."}, {"address": "No. 168 Tengyao Road, Heshun Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.2 stars | A wellness vegetarian restaurant specializing in Yunnan ethnic minority flavors, infusing Dai and Bai culinary traditions into plant-based dishes. The specialty \u0027Braised Vegetarian Chicken with Sour Papaya\u0027 utilizes locally grown sour papaya and soy products; the savory-sour profile is appetizing, while the vegetarian chicken absorbs the bright tangy broth for a chewy, satisfying bite that goes wonderfully with rice. Its cozy dining atmosphere and creative modern vegetarian dishes are highly popular among young diners and tourists.", "name": "Yuansu Wellness Vegetarian Restaurant", "transport": "Take a bus to Tengyao Intersection Station, then walk for about 3 minutes."}, {"address": "Near the Tourist Bus Station on the outer perimeter of Heshun Scenic Area, Heshun Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.1 stars | A popular vegetarian restaurant near the outer perimeter of Heshun Ancient Town, known for its extensive menu of mock-meat dishes and Yunnan wild herbs. The must-order \u0027Black Truffle Vegetarian Fried Rice\u0027 features distinct grains tossed with rich wok hei, coated in the intense aroma of black truffle and mixed with crunchy wild veggies for a delicious, savory taste. The spacious, brightly lit dining area is perfect for group gatherings or family trips enjoying a wholesome, guilt-free meal.", "name": "Jingxin Vegetarian Restaurant", "transport": "Located beside the Heshun Scenic Area Visitor Center, extremely convenient via taxi or scenic shuttle bus."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "Near the intersection of Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.8 stars | An iconic walking dessert you absolutely cannot miss when visiting Heshun Ancient Town! Layered with wild pine pollen, mung bean flour, and special red bean paste, the bright yellow outer layer of pine pollen carries a subtle natural pine and woody aroma. The texture is dense, fine, melt-in-your-mouth, and nicely balanced without being overly sweet. The soft, mildly sweet red bean paste blends perfectly with the fragrant pine pollen\u2014an absolute favorite top-pick snack served on bamboo skewers to enjoy while exploring the town.", "name": "Aunt Cun\u0027s Pine Flower Cake (Cun Da Ma)", "transport": "Walk into Heshun Ancient Town Scenic Area; located near the entrance of the Century-Old Market Street."}, {"address": "Shuixi Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.7 stars | A highly iconic morning market snack in Tengchong. High-quality peas are slow-simmered for hours into a thick, smooth, bright yellow porridge. It is served topped with chopped scallions, garlic water, Sichuan pepper oil, signature chili oil, and crispy deep-fried dough stick bits or toasted Erkuai (rice cake) crumbs. Smooth and velvety on the palate, a burst of spicy, savory, and aromatic flavors explodes on your tongue. Loved by locals and tourists alike as a nourishing breakfast treat.", "name": "Mother\u0027s Taste - Cun\u0027s Pea Porridge (Cun Shi Xi Dou Fen)", "transport": "Walk about 5 minutes along Shuixi Lane in Heshun Ancient Town."}, {"address": "Snack Stall Area next to the Big Boiling Pot, Hot Sea Scenic Area, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Located at the heart of the Tengchong Volcanic Hot Sea Scenic Area, these snacks are cooked right on the spot using natural geothermal steam reaching over 96\u00b0C. Eggs are bundled in woven straw bags and slowly steamed over steam vents near the Big Boiling Pot; the egg whites become springy and tender, while the rich yolks feature a hint of natural mineral sweetness. Paired with soft, aromatic steam-cooked peanuts, it\u0027s a signature geothermal treat to enjoy while admiring the geothermal wonders.", "name": "Thermal Sea Big Boiling Pot Geothermal Steam Snacks Stall", "transport": "Take the Hot Sea Scenic Area sightseeing shuttle bus and get off at the Big Boiling Pot Stop."}, {"address": "Near Liu Family Ancestral Hall, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | A traditional handcrafted stall passed down through generations. Premium pine pollen harvested in spring coats a chewy layer of glutinous rice and red bean paste underneath. Biting into it, you first experience the dry lightness and unique floral-woody aroma of the pine pollen, followed by soft, bouncy rice cake and sweet red bean filling. Refreshing and non-sticky, it is a beloved traditional handmade dessert tucked away in Heshun\u0027s alleyways.", "name": "Aunt Lin\u0027s Ancient Handcrafted Pine Flower Cake (Lin Da Ma)", "transport": "Walk about 8 minutes from the main gate of Heshun Ancient Town toward the Liu Family Ancestral Hall."}, {"address": "Century-Old Market Street, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | One of the most enticing freshly roasted snacks on the streets of the market and ancient town! Round rice cakes (Erkuai) made from premium rice are slow-grilled over charcoal until puffed and crispy. The exterior becomes lightly charred and crunchy while remaining chewy inside. Slathered with savory fermented bean curd sauce, sesame paste, or spicy chili sauce, then wrapped around a fried dough stick or sausage, it offers a crispy, soft, savory, and spicy delight perfect for eating on the go.", "name": "Old Tengchong Roasted Baba \u0026 Erkuai Stall", "transport": "Located in the morning market section of the Century-Old Market Street in Heshun Ancient Town; accessible on foot."}, {"address": "Snack Street, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.4 stars | A unique wild delicacy native to Tengchong! \u0027Zongbao Mi\u0027 (palm tree flower buds) closely resemble fish roe in appearance. Fresh palm flower buds are stir-fried over high heat with cured bacon and fermented pickled chili. Crispy in texture, it has a signature slight bitterness followed by a sweet aftertaste\u2014rustic and full of Yunnan frontier flavor. Locals praise it for its heat-clearing properties, making it a must-try wild vegetable dish for visiting foodies.", "name": "Tengchong Palm Flower Sprouts Stir-Fry Stall", "transport": "Walk to the snack market area along Wild Duck Lake in Heshun Ancient Town."}, {"address": "Night Market Stalls near Shuanghong Bridge, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.5 stars | A delightful street snack infused with Dai ethnic flavors of Western Yunnan! Hand-flipped roti pancakes are fried to a golden crisp upon ordering, filled with fresh banana slices and rich condensed milk\u2014crispy outside, tender inside, sweet and rich. Pair it with zesty passion fruit pickled chicken feet, which are crunchy, tangy, and zesty. This sweet and spicy duo is a favorite late-night snack for young visitors strolling through the town at night.", "name": "Heshun Dai-Style Roti Pancake \u0026 Pickled Chicken Feet Stall", "transport": "Walk to the night market area around the Shuanghong Bridge landmark in Heshun Ancient Town."}, {"address": "No. 12 Lijia Lane, Heshun Ancient Town, Tengchong City, Baoshan City, Yunnan Province", "feature": "\u2b50 4.6 stars | Tucked in the ancient town\u0027s alleys, this time-honored stall seamlessly pairs piping-hot, thick pea porridge with freshly grilled rice cakes (baba). The rich, nutty porridge is poured over warm, chewy rice cakes, topped with crushed peanuts, cilantro, and fragrant Sichuan pepper oil. Smooth yet delightfully chewy, the harmony of pea and rice aromas lingers on the palate, earning high praise from locals and photography enthusiasts alike.", "name": "Zhang\u0027s Pea Porridge \u0026 Roasted Baba (Zhang Ji)", "transport": "Enter Heshun Ancient Town and walk about 300 meters along Lijia Lane."}], "name": "\ud83c\udf2d Street Food \u0026 Market Delicacies"}}, "name": "Tengchong Heshun Ancient Town and Volcano and Thermal Sea"}, "xishuangbanna_gaozhuang": {"categories": {"cat_1": {"items": [{"address": "Next to Manting Park, Manting Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | A highly representative iconic Dai restaurant in Xishuangbanna, Yunnan, loved by locals and tourists alike for years. The house specialties include authentic Dai Peacock Feasts and hand-eaten rice. The Lemongrass Grilled Fish is a must-try\u2014crispy on the outside, tender on the inside, infused with rich lemongrass and Dai spices. The Pineapple Sticky Rice is sweet, fragrant, and wonderfully chewy. With an ambiance full of traditional Dai wooden house charm, it\u0027s the top choice for experiencing Dai culinary culture.", "name": "\u66fc\u98db\u9f8d\u767d\u5854\u50a3\u5473\u9910\u5ef3 (Manfeilong Baita Dai Restaurant)", "transport": "Recommended to take a taxi or bus to Manting Park Station, then walk about 300 meters."}, {"address": "Building 1, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | An ultra-popular traditional Dai restaurant located in Gaozhuang Xishuangjing, famous for cooking with fresh local ingredients and secret spices. The signature \u0027Ghost Chicken\u0027 (shredded chicken tossed with litsea cubeba and local chili) is sour, spicy, and refreshing, stimulating the appetite with every bite. The Nanmi platter pairs crispy pork rinds and fresh seasonal vegetables with tomato dip for rich layers of flavor. Featuring an elegant and romantic setting, it comes highly recommended by food lovers.", "name": "\u54c6\u54c6\u54e9\u50a3\u5473\u9910\u5ef3 (Duoduoli Dai Restaurant)", "transport": "Accessible by walking or taking a sightseeing electric shuttle within Gaozhuang Xishuangjing."}, {"address": "Near the intersection of Menghai Road and Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | A hidden gem of a traditional brand in downtown Jinghong, popular among locals for family gatherings and hosting guests. The Bamboo Rice infuses rich bamboo fragrance into sweet, sticky rice. The Bursting Tofu features a crispy charred exterior with a silky, custard-like interior, served with a special dipping sauce that will amaze your palate. Bursting with local charm, it perfectly showcases traditional Dai flavor.", "name": "\u5583\u5462\u6eab\u50a3\u5473\u9910\u5ef3 (Nanniwen Dai Restaurant)", "transport": "Take Bus 1 or 2 to Zhou Nongken Hospital Station, then walk about 200 meters."}, {"address": "No. 18 Manting Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | A renowned multi-generational Dai restaurant that emphasizes authentic flavors with signature sour and spicy profiles. The classic Sour Bamboo Shoot Beef features tangy bamboo shoots paired with tender beef, perfect with rice; while the Menghai Roasted Chicken has crispy skin, juicy meat, and is delightful when dipped in dry chili powder. A local classic strongly recommended by returning customers.", "name": "\u50a3\u9109\u4eba\u5bb6\u50a3\u5473\u9928 (Daixiang Renjia Dai Restaurant)", "transport": "Take a taxi directly to Manting Road, or take a bus to Manting Park Station and walk for 5 minutes."}, {"address": "Building 16, Jingkuang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | An exotic traditional institution full of border flair in Xishuangbanna, blending Burmese and Southeast Asian traditional flavors. The signature Burmese Oil Noodles feature springy noodles tossed in custom curry sauce and crispy onions, packed with aroma. The Tea Leaf Salad offers a rich, crunchy texture infused with tea leaf and nutty aromas. A must-visit destination for Southeast Asian food enthusiasts.", "name": "\u8036\u5fb7\u7d0d\u7dec\u7538\u9910\u5ef3 (Yedena Burmese Restaurant)", "transport": "Located inside Jingkuang Zhai, Gaozhuang Xishuangjing; easily reached on foot or by electric park shuttle."}, {"address": "Mandou Road Intersection, Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | A grand local establishment famous for traditional Dai royal palace banquets, housed in a courtyard building with grand palace aesthetics. It offers the most comprehensive traditional Dai banquets, including famous Roasted Suckling Pig, Lemongrass Roasted Chicken, and Five-Color Glutinous Rice. The suckling pig skin is as crispy as potato chips while the meat remains tender and juicy. Served with a custom sour and spicy dip, it delivers an unforgettable taste\u2014the best choice to experience royal Dai banqueting etiquette.", "name": "\u50a3\u738b\u5e9c\u5927\u9662\u9910\u5ef3 (Dai King Palace Restaurant)", "transport": "Take a bus to Mandou Lukou Station, or take an 8-minute taxi ride from Gaozhuang Xishuangjing."}, {"address": "Intersection of Zhuangxi Road and Mengle Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | A popular snack shop among local youth and seasoned foodies, specializing in pounded traditional Dai dishes and sour-spicy snacks. The signature Pounded Chicken Feet are tangy and spicy, wonderfully tender yet chewy, infused with refreshing lemon and garlic notes. The Pounded Dried Beef is savory and delightfully chewy\u2014an excellent appetizer paired with drinks that showcases the unique Dai pounding culinary art.", "name": "\u9177\u5108\u50a3\u5473\u7f8e\u98df\u5e97 (Kukuai Dai Restaurant)", "transport": "Take Bus 3 or 5 to Water Splashing Square Station, then walk about 400 meters."}, {"address": "Building 5, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | An immensely popular classic restaurant in Gaozhuang Xishuangjing, insisting on using all-natural Dai herbs and traditional woven bamboo tableware. The Herb Roasted Pork Ribs are well-marinated and slow-roasted over charcoal until fragrant on the outside and tender inside. Pair them with a bowl of rich, sweet Lemongrass Chicken Soup, which is soothing and aromatic\u2014perfectly capturing the essence of traditional Xishuangbanna cuisine.", "name": "\u8001\u50a3\u5bb6\u50a3\u5473\u9928 (Lao Dai Jia Dai Restaurant)", "transport": "Walk or ride a shared e-scooter within Gaozhuang Xishuangjing."}], "name": "Local Traditional Institutions"}, "cat_2": {"items": [{"address": "Jingliang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | Brimming with Southeast Asian tropical vibes, this trendy instagrammable cafe is a top choice for brunch in Jinghong. Its signature Dai-style Lemongrass Latte pairs perfectly with the Coconut Pandan Toast. The unique herbal fragrance of lemongrass blends seamlessly into rich milk foam for a smooth sip with subtle herbal sweetness. Accompanied by freshly toasted bread\u2014crisp outside and soft inside, spread with rich coconut cream and pandan jam\u2014it offers an amazingly layered texture. Lush tropical greenery fills the cafe, creating a lazy, cozy ambiance that is hugely popular among tourists looking for social media photos and relaxation.", "name": "Nan Nan Coffee", "transport": "Take Jinghong City Bus No. 1 to Gaozhuang Xishuangjing Station, then walk for about 5 minutes."}, {"address": "Building 16, Jingkuang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Hidden in an alley of Gaozhuang Xishuangjing, this cozy cafe features several cute, gentle cats that keep you company while you sip your coffee. Its specialty drink, \u0027Lao Iced Coffee,\u0027 comes served in a bag filled with crushed ice; the strong, bittersweet coffee blends with rich condensed milk, delivering a refreshing, rich, and invigorating taste that is never overly sweet. Pair it with freshly made tropical fruit waffles\u2014crispy outside, soft inside, topped with fresh passion fruit and mango\u2014making it a perfect spot for afternoon relaxation.", "name": "Cat \u0026 Coffee Cafe", "transport": "It is recommended to ride a shared e-scooter directly into Jingkuang Village, or walk for about 8 minutes from the Starlight Night Market."}, {"address": "Floating Market Area, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Located near the Floating Market at Starlight Night Market, this trendy overwater cafe offers incredible waterfront views. Its signature \u0027Thai Coconut Pour-Over Coffee\u0027 combines freshly ground dark-roast coffee with fresh coconut water and rich coconut cream. It opens with rich, bittersweet coffee aromas followed by bursts of sweet coconut and velvety milk, creating a silky and distinct flavor profile. Served with an exquisite Dai-style pastry brunch platter featuring soft, chewy crusts and balanced sweetness, it is a favorite among young travelers and photography enthusiasts.", "name": "Wanzai Shuizhongyang Thai Coffee", "transport": "Walk to the central Floating Market area of Gaozhuang Xishuangjing Starlight Night Market."}, {"address": "Building 1, Jingfa Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | An innovative cafe that seamlessly blends Xishuangbanna\u0027s famed Pu\u0027er tea culture with modern specialty coffee. Their signature \u0027Pu\u0027er Tea Coffee Blend\u0027 infuses premium Lao Banzhang Pu\u0027er tea liquor with selected coffee beans. The sip begins with the light acidity and fruity notes of coffee, followed by the distinctive aged aroma and lingering sweetness of Pu\u0027er tea, yielding a smooth finish. For brunch, they serve a healthy salad platter with local Dai nuts and dried fruits\u2014refreshing and light, making it a beloved spot for foodies seeking health-conscious and unique flavors.", "name": "Rainforest Lao Banzhang Pu\u0027er Coffee", "transport": "Take a taxi directly to the entrance of Jingfa Village in Gaozhuang Xishuangjing, then walk for about 2 minutes."}, {"address": "Building 5, Jingde Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Brimming with Vietnamese and Thai resort vibes, this brunch cafe is famous for its stunning aesthetics and authentic flavors. The signature \u0027Vietnamese Drip Coffee\u0027 uses dark-roasted Robusta beans dripping slowly onto sweet condensed milk at the bottom, creating an intensely aromatic and bittersweet brew. Pair it with fresh \u0027Thai Banana Pancakes\u0027\u2014golden crisp crepes wrapped around tender, sweet banana slices, drizzled with condensed milk and chocolate syrup. Crispy outside and soft inside, it has become a hot spot for Instagram-worthy snaps and enjoying a slow morning.", "name": "Chujian Southeast Asian Brunch \u0026 Coffee", "transport": "Walk for about 6 minutes from the main gate of Gaozhuang to reach Jingde Village."}, {"address": "Next to the Riverside Night Market, Binjiang Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Situated right along the Lancang River, this scenic brunch cafe boasts unbeatable river views and stunning sunset vistas. Highly recommended is the \u0027Tropical Passion Fruit Cold Brew Coffee,\u0027 featuring slow, cold-extracted coffee infused with freshly cut passion fruit pulp and a splash of sparkling water. Slightly sweet and tart with dancing bubbles on your tongue, it is immensely refreshing. Pair it with the rich \u0027American Overnight Brunch Platter\u0027\u2014featuring pan-fried bacon, sunny-side-up eggs, sourdough artisan bread, and roasted tomatoes\u2014offering a robust meal to enjoy alongside gentle river breezes and breathtaking scenery.", "name": "Lancang River Sunset Cafe", "transport": "Take Bus No. 2 to Binjiang Road Station, then walk along the riverside boardwalk for about 3 minutes."}, {"address": "Near the intersection of Mengmao Road and Xuanwei Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | A charming specialty coffee shop honoring traditional Dai baking and brewing techniques. The \u0027Dai-style Roasted Rice Coffee\u0027 is exceptionally unique: fragrant toasted Dai aromatic rice is ground and infused into espresso, giving off an irresistible nutty, toasted grain aroma combined with rich milk notes, resulting in a dense, subtly textured finish. Their brunch platter features authentic Dai sticky rice and freshly baked jackfruit tarts\u2014crispy crusts packed with sweet fruit filling that is delightful without being cloying, showcasing truly authentic Xishuangbanna flavor.", "name": "Dai Lao Coffee \u0026 Bakery", "transport": "Take City Bus No. 3 or No. 4 to Mengmao Intersection Station, then walk for 1 minute."}, {"address": "Building 3, Jinglan Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 stars | A creative concept cafe themed around the conservation of wild Asian elephants in Xishuangbanna, decorated with natural, rustic charm. The crowd-favorite signatures are the \u0027Elephant Trunk Matcha Latte\u0027 and the \u0027Gourmet Tropical Nut Brunch.\u0027 The latte uses premium matcha powder and fresh milk, topped with delicate latte art for a smooth, velvety texture infused with gentle tea sweetness. The brunch platter features fresh local nuts, wild wildflower honey, and homemade yogurt, balancing tart and sweet flavors into a multi-layered, health-conscious dish loved by families and young travelers alike.", "name": "Wild Elephant Valley Theme Cafe", "transport": "It is recommended to take a sightseeing shuttle to Gaozhuang Jinglan Village, or ride a shared bike."}], "name": "Popular Cafes \u0026 Brunch"}, "cat_3": {"items": [{"address": "Building 1, Jingkuang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | This restaurant is a highly iconic traditional Dai flavor spot in Xishuangbanna, located inside Gaozhuang Xishuangjing. The interior decoration is rich in Dai style, with wooden structures and handcrafted textiles creating a warm atmosphere. The signature Hand-Pulled Rice (Shouzhua Fan) is served on banana leaves, bringing together classic dishes like lemongrass grilled fish, jackfruit rice, Ghost Chicken (spicy shredded chicken), and beef with sour bamboo shoots. The grilled fish has a crispy skin while the tender meat is infused with the unique aroma of lemongrass and wild herbs; the jackfruit rice is pleasantly sweet and chewy. Both locals and tourists love the authentic sour and spicy flavors here, making it a top choice to experience traditional Dai craftsmanship.", "name": "Manfeilong Baitai Dai Restaurant", "transport": "Take the Gaozhuang scenic area sightseeing car and get off at Jingkuang Zhai, or walk for about 5 minutes from Starlight Night Market."}, {"address": "No. 101, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Chonburi is an immensely popular, viral Thai specialty bistro in downtown Jinghong, featuring minimalist resort-style decor with an elegant and artistic vibe. It combines traditional Thai cuisine with local Xishuangbanna ingredients. Must-try signature dishes include the rich and zesty \u0027Tom Yum Goong\u0027 with fresh, springy seafood, and the \u0027Butter Curry Shrimp\u0027 with its velvety sauce paired with special flatbread. As night falls, the restaurant transitions into a cocktail bar, serving refreshing custom cocktails infused with passionfruit, lemongrass, and awamori, making it a favorite among young tourists and local foodies alike.", "name": "Chonburi Thai Bistro", "transport": "About 10 minutes by taxi from Jinghong city center, or walk from within Gaozhuang Xishuangjing."}, {"address": "Building 10, Jinglan Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Situated along the Lancang River in Gaozhuang Xishuangjing, Kumeng Bistro \u0026 Bar perfectly blends Dai flavors with modern bar culture. The restaurant features outdoor seating where guests can enjoy food while taking in river views and night market lights. Specialty dishes include \u0027Dai-style Lemongrass Roast Chicken\u0027, featuring golden crispy skin and juicy meat with herbal notes, and \u0027Stir-fried Beef with Sour Bamboo Shoots\u0027, appetizingly tangy with a mild kick. Their custom cocktails incorporate local Xishuangbanna Arabica coffee and tropical fruits, creating rich layers of flavor\u2014a fantastic place in Gaozhuang to enjoy romantic nightlife and local food.", "name": "Kumeng Dai Style Bistro \u0026 Bar", "transport": "Walk to the Lancang River section of Gaozhuang Xishuangjing, adjacent to the riverside area of Starlight Night Market."}, {"address": "Manting Road Section, near Water Splashing Square, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Duoduoli is an authentic Dai restaurant highly praised by locals for its traditional ancient-method recipes. Decorated with woven bamboo and fresh flowers, the interior exudes a natural rustic charm. Must-try recommendations include the \u0027Nanmi Platter\u0027\u2014dip fresh crisp vegetables into special tomato nanmi and peanut nanmi sauces for a refreshing local bite; and \u0027River Fish Cooked with Sour Bamboo Shoots\u0027, boasting a tangy, flavorful broth and tender fish. The dishes preserve the classic Dai taste profile of sour, spicy, aromatic, and crispy, leaving a lasting impression.", "name": "Duoduoli Dai Restaurant", "transport": "Take Jinghong Bus Route 1 to Water Splashing Square Station, then walk about 300 meters."}, {"address": "Building 3, Jingfa Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Located in the core commercial area of Gaozhuang Xishuangjing, Owl Bistro \u0026 Bar features a tropical rainforest design theme filled with lush greenery and atmospheric lighting. The restaurant specializes in local Thai dishes paired with creative craft drinks. Popular menu items include \u0027Spicy Stir-fried Crab\u0027, with fresh, firm meat coated in rich spices, perfect with rice; and \u0027Thai Steamed Fish with Lemon\u0027, tender fish steeped in a refreshing zesty lemon and cilantro broth. Live music performances fill the night, accompanied by tropical fruit cocktails\u2014a lively, upbeat venue ideal for gatherings and late-night snacks.", "name": "Owl Bistro \u0026 Bar", "transport": "Located within Gaozhuang; take the scenic electric sightseeing car directly or walk for about 8 minutes from the main Gaozhuang entrance."}, {"address": "Building 12, Jingkuang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | Renowned across the city for its visually stunning and delicious \u0027Dai Peacock Feast\u0027, Daixiangyuan serves local specialty dishes arranged in an exquisite peacock-shaped platter across a large table. The feast includes lemongrass grilled pork belly, pineapple sticky purple rice, Dai shredded chicken, crispy pork skin, and various tropical fruits, offering rich diversity and cultural flair. Prepared with authentic flavors and accompanied by flavorful dipping sauces that are both zesty and refreshing, it is ideal for family trips or group dining, making it a hugely popular photo spot for visitors.", "name": "Daixiangyuan Peacock Feast Restaurant", "transport": "Walk inside Gaozhuang Xishuangjing or take the park sightseeing shuttle to the Jingkuang Zhai area."}, {"address": "Building 5, Jingliang Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Gulu Gulu is a unique bistro fusing Southeast Asian flavors with Southern Yunnan local cuisine, featuring a relaxed Southeast Asian island resort atmosphere. Favorite dishes include \u0027Vietnamese Beef Pho\u0027, with a deeply flavorful broth simmered for hours, and \u0027Laotian Street-Style BBQ\u0027, highly aromatic when paired with a spicy, tangy dipping sauce. The bistro offers a selection of craft beers and signature tropical fruit cocktails. The cozy, lively vibe paired with delicate fusion dishes makes it a favorite spot for tourists seeking light meals and casual drinks.", "name": "Gulu Gulu Southeast Asian Bistro", "transport": "Located at Jingliang Zhai in Gaozhuang Xishuangjing; about a 6-minute walk from Shwedagon Pagoda Square."}, {"address": "Riverside Storefront, Building 1, Jinglan Zhai, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Combining traditional Dai banquet cuisine with a modern cozy bistro setting, Yaha Dai is located right on the front line of the Lancang River night view. The decor seamlessly blends modern industrial chic with Dai bamboo weaving art. The signature \u0027Specialty Banana Leaf Charcoal-Roasted Fish\u0027 is cooked inside wrapped banana leaves, resulting in juicy fish tenderly infused with wild herbs and leaf aroma, while the \u0027Thai Seafood Tower\u0027 is lavishly fresh. At night, exclusive cocktails infused with Yunnan specialty tea leaves and tropical fruits are served\u2014allowing guests to immerse themselves in Xishuangbanna\u0027s captivating nights while enjoying Dai flavors by the river.", "name": "Yaha Dai Peacock Feast \u0026 Bistro", "transport": "Walk to the Riverside Avenue in Gaozhuang Xishuangjing, near the riverside area of Ganbai Street."}], "name": "Featured Bistros \u0026 Local Cuisine"}, "cat_4": {"items": [{"address": "Building 15, Jingliang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 Stars | Located in Gaozhuang Xishuangjing, this vegetarian restaurant is famous for its exquisite Dai-style vegetarian dishes. The signature \u0027Dai-Style Hand-Pulled Rice (Vegetarian Version)\u0027 pairs purple rice and Thai fragrant rice with various grilled vegetarian meats, lemongrass fried mushrooms, and sweet \u0026 sour pickles, offering rich layers of flavor that are refreshingly tangy, spicy, and completely non-greasy. Locals and tourists alike highly recommend its refreshing bamboo tube rice and herb-roasted coconut. The dining environment is filled with Zen tranquility and Southeast Asian charm.", "name": "Bore Vegetarian Restaurant", "transport": "Take the Gaozhuang sightseeing vehicle, get off at Jingliang Village Station, and walk for about 2 minutes."}, {"address": "Room 101, Building 7, Jingkuang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | Specializing in Yunnan wild mushroom vegetarian hotpot and Dai-style vegetarian dim sum, its signature \u0027Wild Mushroom Broth\u0027 is simmered for hours, delivering a sweet, delicious, and umami-rich flavor. Paired with freshly picked Yunnan plateau wild vegetables and handmade vegetarian meatballs, the texture is smooth, tender, and infused with a rich mushroom aroma. The restaurant\u0027s lemongrass grilled mock fish is expertly crafted from soy products\u2014crispy on the outside and juicy on the inside, recreating the signature tangy and spicy flavor of traditional Dai-style grilled fish, highly favored by vegetarians and foodies alike.", "name": "Yiye Puti Vegetarian Restaurant", "transport": "Walk for about 5 minutes from Starlight Night Market, or take a taxi to the entrance of Jingkuang Village."}, {"address": "No. 22, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Perfectly blending traditional Dai family flavors with pure plant-based ingredients, the must-try \u0027Dai-Style Tangy \u0026 Spicy Green Papaya Salad\u0027 is refreshing, crispy, and infused with vibrant lime and cilantro aromas. The \u0027Baojiang Tofu\u0027 (bursting tofu) is pan-fried until crispy on the outside and tender inside; dipped in a special Dai spicy vegetarian sauce, every bite offers a harmony of rich soybean aroma and spicy notes. The interior features extensive bamboo woven decorations, making it a highly photogenic spot.", "name": "Dai Vegetarian Experience Restaurant", "transport": "Walk to the core area of Starlight Night Market, located near the walkway behind the Shwedagon Pagoda."}, {"address": "2nd Floor, Commercial Street, Water Splashing Square, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.4 Stars | A highly budget-friendly vegetarian buffet in downtown Jinghong, offering over 50 varieties of local Yunnan vegetarian dishes, tropical fruits, and specialty desserts. The \u0027Steamed Flower Rice\u0027 and \u0027Vegetarian Glutinous Rice Chicken\u0027 are particularly praised for their chewy, springy texture with a subtle natural plant fragrance. The fried potato chunks are crispy outside, soft inside, and bursting with flavor. Affordable and made with fresh ingredients, it is a daily favorite for many locals and backpackers.", "name": "Cixinyuan Vegetarian Buffet", "transport": "Take Jinghong City Bus Line 1 or 2 to Water Splashing Square Station, then walk for about 3 minutes."}, {"address": "No. 45 Menghai Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 Stars | A premium vegetarian restaurant focusing on wellness and healthy concepts. The specialty dish \u0027Stir-fried Wild Mushrooms with Lily Bulbs\u0027 is crisp, tender, sweet, and perfectly preserves the natural, savory flavor of the mushrooms. The \u0027Coconut Yellow Curry Mock Chicken\u0027 is rich and smooth, featuring a unique Southeast Asian coconut milk aroma with a subtle spicy kick that pairs irresistibly with flatbread. With a quiet and warm ambiance, it\u0027s a great spot to escape the hustle and bustle to enjoy a serene vegetarian dinner.", "name": "Jingxinlian Vegetarian Restaurant", "transport": "Take Bus Line 4 to Middle Section of Menghai Road Station, then walk about 150 meters."}, {"address": "Room 102, Building 8, Jingde Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Located in Jingde Village, Gaozhuang, this restaurant combines Zen philosophy from Theravada Buddhist culture with Xishuangbanna\u0027s rich plant resources. The recommended \u0027Steamed Mock Ribs with Lemongrass\u0027 are made from high-quality Lion\u0027s Mane mushroom, thoroughly absorbing the refreshing aroma of lemongrass and lemon leaves; the texture is firm, chewy, and juicy just like real meat. Additionally, the \u0027Dai Pineapple Rice\u0027 is sweet, tangy, and sticky, filled with rich tropical fruit aromas that are hugely popular among women and kids.", "name": "Chanyue Vegetarian Restaurant", "transport": "Take the park battery cart at the entrance of Gaozhuang Xishuangjing to Jingde Village, then walk for 1 minute."}, {"address": "Room 112, Building 3, Jinjie Commercial Street, Wanda Plaza, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 Stars | A vegetarian hotpot restaurant featuring individual mini hotpots. Its exclusive \u0027Matsutake \u0026 Bamboo Fungus Broth\u0027 is clear yet amazingly sweet and savory. Cooking various wild mountain vegetables and handmade bamboo fungus paste in it yields a crisp, fresh, and tender taste. The signature vegetarian dipping sauce blends Yunnan chili with coriander sesame oil, adding a mild spice and savory flavor that perfectly enhances the sweetness of the vegetables. Tourists rave about its high-quality wild mushroom platter.", "name": "Bodhi Heart Vegetarian Hotpot", "transport": "Take Bus Line 7 to Wanda Plaza Station, enter Jinjie Commercial Street, and walk for about 2 minutes."}, {"address": "No. 28 Jinglan Avenue, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 Stars | Focusing on Yunnan specialty mountain delicacies and wild mushroom vegetarian cuisine, the popular \u0027Ganba Mushroom Fried Rice\u0027 offers a delightful aroma with distinct rice grains and the unique savory taste of the mushrooms, making it dry-fried, fragrant, and satisfying to chew. The \u0027Stir-fried Fresh Bamboo Shoots with Green Sichuan Pepper\u0027 is crisp, tender, spicy, and numbing, stimulating the appetite. The restaurant insists on getting fresh mushrooms and wild vegetables directly supplied from mountain areas daily, ensuring maximum sweetness and freshness, highly recommended by health-conscious food lovers.", "name": "Yunwei Wild Mushroom Vegetarian Restaurant", "transport": "Take Bus Line 3 to Jinglan Avenue Station, then walk about 200 meters after getting off."}], "name": "\ud83c\udf31 Vegetarian"}, "cat_5": {"items": [{"address": "No. 109, Building 1, Jingkuang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.8 stars | A highly popular Dai dessert shop in Gaozhuang, Xishuangbanna. Its signature dish, \u0027Coconut Paoluda\u0027, dips crispy toasted rusk in rich, sweet coconut milk, layered with shredded coconut, purple rice, and sago. Every bite offers a rich interplay of soft and crispy textures accompanied by a refreshing coconut aroma. The \u0027Lemongrass Roast Chicken\u0027 and \u0027Mango Sticky Rice\u0027 are also must-try items, loved by both tourists and local youth.", "name": "Wantai Dai Dessert \u0026 Snacks", "transport": "Take the Gaozhuang Scenic Area sightseeing tram to Jingkuang Village Station, then walk for about 2 minutes."}, {"address": "Main Avenue Stalls, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | The most iconic grab-and-go drink in Starlight Night Market, served in a bag for an authentic Southeast Asian vibe. Freshly extracted espresso made from dark-roasted Lao coffee beans is mixed with generous portions of condensed and evaporated milk over crushed ice. It offers a rich bittersweet balance with a velvety, milky texture and an icy rush\u2014perfect for cutting through the night market heat and savory BBQ.", "name": "Starlight Night Market \u00b7 Lao Iced Coffee", "transport": "Take the Gaozhuang sightseeing shuttle to the Great Golden Stupa Square, then walk into Starlight Night Market to spot the iconic bagged coffee stalls."}, {"address": "Food Area, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | A quintessential traditional cold dish in Xishuangbanna. Vendors place cooked and chilled chicken feet into a wooden mortar, adding fresh lime juice, bird\u0027s eye chilies, garlic, and cilantro, vigorously pounding them so the flavors fully penetrate the meat. Crispy, springy, and chewy, it has a sour, spicy, and herb-infused flavor profile\u2014an indispensable palate cleanser while exploring the night market.", "name": "Starlight Night Market \u00b7 Dai Pounded Chicken Feet \u0026 Cold Salad", "transport": "Located inside Starlight Night Market in Gaozhuang Xishuangjing; you\u0027ll easily spot the queuing stalls while strolling through the market."}, {"address": "Night Market BBQ Stalls near Jingliang Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.7 stars | The soul of Dai-style barbecue. Fresh tilapia is butterfly-cut and stuffed with lemongrass, cilantro, green onions, ginger, garlic, and Dai spices, then clamped with bamboo strips and slow-roasted over charcoal. The skin turns wonderfully crispy and aromatic, while the flesh inside remains miraculously tender and juicy, bursting with refreshing citrus notes of lemongrass and smoky char in every bite.", "name": "Gaozhuang Xishuangjing \u00b7 Dai Lemongrass Grilled Fish", "transport": "Take the scenic tram to near Jingliang Village in Gaozhuang Xishuangjing, then walk directly to the central BBQ stall area."}, {"address": "Snack Area, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Vendors stretch dough paper-thin right before your eyes, crisping it to a golden brown on a flat-top grill wrapped around sliced fresh bananas and egg. Drizzled with condensed milk and chocolate syrup before serving, the hot crust is incredibly crispy while the inside is soft, sweet, and warm\u2014an insanely popular market sweet treat.", "name": "Starlight Night Market \u00b7 Thai Banana Roti", "transport": "Walk to the central snack section of Starlight Night Market in Gaozhuang Xishuangjing to find it."}, {"address": "Inside Riverside Night Market, Binjiang Road, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Made with local free-range chickens, marinated in special Dai herbal spices and slow-roasted over charcoal. The skin is paper-thin and delightfully crispy, while the meat remains firm and juicy. Served alongside fragrant sticky rice naturally dyed purple, yellow, and white with plant extracts, it is traditionally eaten by hand\u2014shaping the rice into balls to dip into chicken juices and spicy dipping sauces for a rich, authentic local experience.", "name": "Riverside Night Market \u00b7 Menghai Roast Chicken \u0026 Three-Color Sticky Rice", "transport": "Take Jinghong City Bus No. 2 to Jiangbian Night Market Station, or walk for about 8 minutes from Water-Splashing Square."}, {"address": "Traditional Snack Stalls, Starlight Night Market, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.6 stars | Steamed inside a hollowed-out fresh whole pineapple filled with purple sticky rice, regular rice, goji berries, and a hint of rock sugar. The rice is delightfully chewy and infused with the sweet and tangy juice of the pineapple. The Bamboo Rice offers a subtle bamboo fragrance wrapped in a thin inner bamboo membrane, delivering a chewy and elastic bite.", "name": "Starlight Night Market \u00b7 Pineapple Purple Sticky Rice \u0026 Bamboo Rice", "transport": "Located in the core stall area of Gaozhuang Starlight Night Market, easily accessible on foot."}, {"address": "Around Building 1, Jingfa Village, Gaozhuang Xishuangjing, Jinghong City, Xishuangbanna Dai Autonomous Prefecture, Yunnan Province", "feature": "\u2b50 4.5 stars | Made fresh to order using local coconuts. The coconut jelly has a soft, silky texture reminiscent of silken tofu, melting in your mouth with pure natural coconut sweetness. These stalls also serve freshly made Paoluda and coconut sago soup; the fusion of crushed ice and creamy milk offers the ultimate refreshing indulgence on a hot Yunnan night.", "name": "Gaozhuang Xishuangjing \u00b7 Dai Paoluda \u0026 Fresh Coconut Jelly Stalls", "transport": "Take the Gaozhuang sightseeing shuttle to Jingfa Village Station, then walk about 100 meters."}], "name": "\ud83c\udf2d Street Food \u0026 Market Eats"}}, "name": "Xishuangbanna Gaozhuang Xishuangjing and Jinghong"}, "yulong_shuhe": {"categories": {"cat_1": {"items": [{"address": "Next to Xishanting, Xingming Village, Kaiwen Community, Shuhe Street, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | A legendary local restaurant in Shuhe Ancient Town famous for its cured rib hotpot. Using expertly cured plateau pork ribs, tomatoes, chive flowers, and special broth, they simmer up a rich, golden soup base. The cured ribs are firm, chewy, savory, and flavorful, with wonderfully crispy cartilage. Paired with the house-special spicy dipping sauce, it offers a multi-layered taste profile of sour, spicy, savory, and aromatic flavors. Its authentic Naxi traditional hearth pot style and generous portions win top praise from both tourists and locals.", "name": "Fushuitang Naxi Cured Rib Hotpot (\u6d6e\u6c34\u5802\u00b7\u7d0d\u897f\u81d8\u6392\u9aa8)", "transport": "About an 8-minute walk from the South Gate (main entrance) of Shuhe Ancient Town."}, {"address": "Near Qinglong Bridge, Qinglong Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | Tucked away in the quaint alleys of Shuhe Ancient Town, this celebrated traditional Naxi private kitchen is famous for preserving authentic old Lijiang home-style dishes. The signature Naxi Grilled Fish boasts a crispy, spicy skin with tender, juicy meat infused with special spice sauce. The Pickled Vegetables Stir-fried Pork is appetite-whetting and sour-spicy, perfect when paired with chewy plateau rice. Set in an antique Naxi courtyard, its cozy homey vibe and authentic flavors make it a top choice for exploring local food culture.", "name": "Cucha Danfan Naxi Home Cooking (\u7c97\u8336\u6de1\u98ef\u00b7\u7d0d\u897f\u79c1\u623f\u83dc)", "transport": "Take Bus 11 to Shuhe Ancient Town Station, then walk into the town for about 10 minutes."}, {"address": "Next to Feihua Chushui Scenic Area, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.8 stars | An iconic Yunnan restaurant in Shuhe Ancient Town that flawlessly combines traditional Naxi food culture with refined culinary art. The signature Wild Mushroom Steam Pot Chicken uses traditional purple pottery steam pots to extract pure chicken essence; the clear broth bursts with mushroom aroma and chicken sweetness, and the chicken is melt-in-your-mouth tender. Paired with classic dishes like Hand-pulled Pork and Fried Beef with Mint, every bite showcases the natural flavors of Yunnan\u0027s wild mushrooms and plateau ingredients.", "name": "Dianxi Wangzi Heritage Yunnan Cuisine (\u6ec7\u897f\u738b\u5b50\u00b7\u50b3\u627f\u96f2\u5357\u83dc)", "transport": "Walk to Feihua Chushui, a core attraction in Shuhe Ancient Town, where you will see the prominent sign."}, {"address": "Songyun Village, Shuhe Street, Gucheng District, Lijiang City, Yunnan Province (Near Shuhe North Gate)", "feature": "\u2b50 4.5 stars | Located at the intersection of Shuhe Ancient Town and the foot of Jade Dragon Snow Mountain, this famed traditional hotpot restaurant preserves the Naxi hearth dining tradition. Free-range plateau chickens are slow-simmered for hours in mountain spring water, creating a milky white, rich, and fragrant broth with juicy, flavorful meat. Served with locally harvested wild morels and seasonal vegetables, it offers a delicious, sweet flavor profile\u2014a highly praised spot to recharge after visiting the Snow Mountain.", "name": "Naxi Renjia Snow Mountain Free-Range Chicken Hotpot (\u7d0d\u897f\u4eba\u5bb6\u00b7\u96ea\u5c71\u571f\u96de\u934b)", "transport": "Taxi or driving is recommended; about a 5-minute drive from Shuhe Ancient Town North Gate."}, {"address": "Core Area of Sifang Street, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.6 stars | A long-standing local favorite in Shuhe Ancient Town, renowned for its distinctive Naxi BBQ Pork and cured pork liver feast. The pork belly is marinated in special spices and charcoal-roasted to crispy-skinned, tender perfection that is rich without being overly greasy. Enjoying it wrapped with fresh mint leaves adds a refreshing touch. The dining environment retains a traditional Naxi courtyard feel, offering generous and authentic portions that capture the warm banquet spirit of local townspeople.", "name": "Hetianju Naxi Traditional Restaurant (\u79be\u7530\u5c45\u00b7\u7d0d\u897f\u50b3\u7d71\u98a8\u5473\u9928)", "transport": "Walk to Sifang Street Square in Shuhe Ancient Town to easily locate it."}, {"address": "Zhonghe Road, Shuhe Ancient Town, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.7 stars | A legendary spot in Shuhe Ancient Town famous for traditional small-pot rice noodles. Each order is individually cooked in custom Naxi copper pots with pickled greens, minced pork, and rich soup broth. The smooth, chewy plateau rice noodles thoroughly absorb the tangy, spicy broth, serving up piping hot and mouthwatering flavor. Enhanced by signature chili sauces and dips, this dish is not only a breakfast/brunch pilgrimage for tourists but also a nostalgic favorite locals grew up eating.", "name": "Xiaoguo Laolao Naxi Copper Pot Rice Noodles (\u5c0f\u934b\u8001\u8001\u00b7\u7d0d\u897f\u9285\u934b\u7c73\u7dda)", "transport": "About a 6-minute walk from the South Gate entrance of Shuhe Ancient Town."}, {"address": "Commercial Area near Jade Dragon Snow Mountain Visitor Service Center, Gucheng District, Lijiang City, Yunnan Province", "feature": "\u2b50 4.5 stars | A classic hotpot restaurant near the gateway of Jade Dragon Snow
