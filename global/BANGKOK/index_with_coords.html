            curDist = k;
            Array.from(districtContainer.children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active transition-colors duration-200 shadow-md';
            categoryContainer.classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            categoryContainer.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                categoryContainer.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], categoryContainer.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(categoryContainer.children).forEach(btn => btn.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200');
            b.className = 'px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active transition-colors duration-200 shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">此分類目前無資料</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                let mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cityName + ' ' + item.name)}`;

                 // 如果資料中有爬到的經緯度，改用座標來導航，精準度 100%
                if (item.lat && item.lng) {
                mapUrl = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
                }
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                // 1. 提取括號內的英文名稱
                let englishNameMatch = item.name.match(/\(([^)]+)\)|（([^）]+）)/);
                let englishName = englishNameMatch ? (englishNameMatch[1] || englishNameMatch[2]) : '';

                // 2. 提取乾淨的中文飯店名稱
                let cleanHotelName = item.name.split('(')[0].split('（')[0].split('-')[0].trim();
                cleanHotelName = cleanHotelName.replace(/酒店|飯店|大酒店/g, '').trim();

                let hotelOnlyName = cleanHotelName;
                if (hotelOnlyName.startsWith(cityName)) {
                    hotelOnlyName = hotelOnlyName.substring(cityName.length).trim();
                }

                // 3. 建立各訂房網目標網址
                const bestSearchTerm = englishName ? englishName : hotelOnlyName;
                const searchFullQuery = `${cityName} ${hotelOnlyName}`;
                const agodaTargetUrl = `https://www.agoda.com/search?text=${encodeURIComponent(searchFullQuery)}`;
                
                // ⭐ Booking 維持原樣不變
                const bookingTargetUrl = `https://www.booking.com/searchresults.zh-tw.html?ss=${encodeURIComponent(cleanHotelName)}`;
                
                // ⭐ 【強制修正英文城市名稱空格與後綴】確保為 "Hong Kong" 並加上 ", China"
                let fixedCityNameEn = cityNameEn;
                if (cityNameEn.replace(/\s+/g, '').toLowerCase() === 'hongkong') {
                    fixedCityNameEn = 'Hong Kong';
                }

                let tripDestName = englishName ? `${englishName}, ${fixedCityNameEn}` : `${hotelOnlyName}, ${fixedCityNameEn}`;
                if (fixedCityNameEn.toLowerCase() === 'hong kong' && !tripDestName.toLowerCase().includes('china')) {
                    tripDestName += ', China';
                }

                const tripAffiliateUrl = `https://tw.trip.com/hotels/list?flexType=1&fixedDate=0&cityName=${encodeURIComponent(fixedCityNameEn)}&destName=${encodeURIComponent(tripDestName)}&Allianceid=7913725&SID=298418583`;

                // 4. 透過 encodeURIComponent 將 Agoda 與 Booking 目標網址打包進 tp.media 分潤轉址中
                const agodaAffiliateUrl = `https://tp.media/r?campaign_id=104&marker=720742&p=2854&trs=520492&u=${encodeURIComponent(agodaTargetUrl)}`;
                const bookingAffiliateUrl = `https://tp.media/r?campaign_id=84&marker=720742&p=2076&trs=520492&u=${encodeURIComponent(bookingTargetUrl)}`;

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">住宿特色</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 詳細地址：</span><br>${item.address || '詳見導航'}<br><br>
                                <span class="font-bold text-rose-600">🚇 自由行交通：</span><br>${item.transport || '請參考地圖'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto flex flex-col gap-2">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center py-2.5 rounded-xl shadow-sm text-sm font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-1"></i> 地圖導航
                        </a>
                        
                        <div class="grid grid-cols-3 gap-2 mt-1">
                            <a href="${agodaAffiliateUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 transition-colors">
                                Agoda
                            </a>
                            <a href="${bookingAffiliateUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-indigo-800 hover:bg-indigo-900 transition-colors">
                                Booking
                            </a>
                            <a href="${tripAffiliateUrl}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-center py-2 rounded-lg shadow-sm text-xs font-bold text-white bg-sky-500 hover:bg-sky-600 transition-colors">
                                Trip.com
                            </a>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
    <footer class="text-center py-8 text-gray-400 text-sm md:text-base px-4">

    </footer>
</body>
