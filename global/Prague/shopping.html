a8\u662f\u4e00\u500b\u503c\u5f97\u4fe1\u8cf4\u7684\u9078\u64c7\u3002\u5b83\u5c07\u82f1\u502b\u98a8\u60c5\u5e36\u5230\u4e86\u5e03\u62c9\u683c\u7684\u4e2d\u5fc3\u3002", "name": "\u99ac\u838e\u767e\u8ca8 (Marks \u0026 Spencer)", "transport": "\u642d\u4e58\u5730\u9435C\u7dda\u81f3Muzeum\u7ad9\u6216M\u016fstek\u7ad9\uff0c\u6b65\u884c\u7d045-10\u5206\u9418\u3002\u5f9e\u9ad8\u5821\u7ad9\u642d\u4e58\u5730\u9435C\u7dda\u7d042-3\u7ad9\u3002"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 832/19, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1\u661f | H\u0026M\u5728\u5e03\u62c9\u683c\u74e6\u8328\u62c9\u592b\u5ee3\u5834\u64c1\u6709\u4e00\u5bb6\u5927\u578b\u65d7\u8266\u5e97\uff0c\u662f\u5168\u7403\u77e5\u540d\u7684\u5feb\u6642\u5c1a\u54c1\u724c\uff0c\u4ee5\u5176\u7dca\u8ddf\u6f6e\u6d41\u7684\u8a2d\u8a08\u3001\u5be6\u60e0\u7684\u50f9\u683c\u548c\u591a\u6a23\u5316\u7684\u5546\u54c1\u7cfb\u5217\u800c\u53d7\u5230\u5e74\u8f15\u4eba\u7684\u8ffd\u6367\u3002\u9019\u88e1\u63d0\u4f9b\u7537\u58eb\u3001\u5973\u58eb\u3001\u9752\u5c11\u5e74\u548c\u5152\u7ae5\u7684\u670d\u88dd\u3001\u914d\u98fe\u4ee5\u53ca\u90e8\u5206\u5bb6\u5c45\u7528\u54c1\u3002\u5e97\u5167\u7a7a\u9593\u5bec\u655e\uff0c\u5546\u54c1\u66f4\u65b0\u901f\u5ea6\u5feb\uff0c\u8b93\u9867\u5ba2\u7e3d\u80fd\u627e\u5230\u6700\u65b0\u7684\u6d41\u884c\u8da8\u52e2\u3002\u7121\u8ad6\u60a8\u662f\u60f3\u70ba\u8863\u6ae5\u6dfb\u7f6e\u65b0\u88dd\uff0c\u9084\u662f\u5c0b\u627e\u6642\u5c1a\u914d\u98fe\uff0cH\u0026M\u90fd\u80fd\u63d0\u4f9b\u8c50\u5bcc\u7684\u9078\u64c7\u3002\u5176\u5145\u6eff\u6d3b\u529b\u7684\u8cfc\u7269\u6c1b\u570d\u548c\u4fbf\u6377\u7684\u5730\u7406\u4f4d\u7f6e\uff0c\u4f7f\u5176\u6210\u70ba\u5e03\u62c9\u683c\u5e02\u4e2d\u5fc3\u4e0d\u53ef\u932f\u904e\u7684\u6642\u5c1a\u64da\u9ede\u3002", "name": "H\u0026M (H\u0026M V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "\u642d\u4e58\u5730\u9435C\u7dda\u81f3Muzeum\u7ad9\u6216M\u016fstek\u7ad9\uff0c\u6b65\u884c\u7d045-10\u5206\u9418\u3002\u5f9e\u9ad8\u5821\u7ad9\u642d\u4e58\u5730\u9435C\u7dda\u7d042-3\u7ad9\u3002"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 807/64, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2\u661f | Zara\u4f5c\u70ba\u5168\u7403\u9818\u5148\u7684\u5feb\u6642\u5c1a\u54c1\u724c\uff0c\u5728\u5e03\u62c9\u683c\u74e6\u8328\u62c9\u592b\u5ee3\u5834\u4e5f\u8a2d\u6709\u5927\u578b\u9580\u5e97\u3002\u5b83\u4ee5\u5176\u5feb\u901f\u97ff\u61c9\u6642\u5c1a\u6f6e\u6d41\u3001\u9ad8\u54c1\u8cea\u7684\u8a2d\u8a08\u548c\u76f8\u5c0d\u89aa\u6c11\u7684\u50f9\u683c\u800c\u805e\u540d\u3002\u5e97\u5167\u5546\u54c1\u6db5\u84cb\u4e86\u7537\u58eb\u3001\u5973\u58eb\u548c\u5152\u7ae5\u7684\u670d\u88dd\u3001\u978b\u5c65\u53ca\u914d\u98fe\uff0c\u98a8\u683c\u591a\u6a23\uff0c\u5f9e\u7d93\u5178\u6b3e\u5230\u524d\u885b\u8a2d\u8a08\u61c9\u6709\u76e1\u6709\u3002Zara\u7684\u5546\u54c1\u66f4\u65b0\u983b\u7387\u6975\u9ad8\uff0c\u5e7e\u4e4e\u6bcf\u9031\u90fd\u6709\u65b0\u54c1\u4e0a\u67b6\uff0c\u78ba\u4fdd\u9867\u5ba2\u7e3d\u80fd\u8cb7\u5230\u6700\u65b0\u9bae\u7684\u6642\u5c1a\u55ae\u54c1\u3002\u5176\u73fe\u4ee3\u5316\u7684\u5e97\u92ea\u8a2d\u8a08\u548c\u9ad8\u6548\u7684\u8cfc\u7269\u6d41\u7a0b\uff0c\u70ba\u9867\u5ba2\u63d0\u4f9b\u4e86\u4fbf\u6377\u6109\u6085\u7684\u8cfc\u7269\u9ad4\u9a57\u3002\u5c0d\u65bc\u8ffd\u6c42\u6642\u5c1a\u3001\u6ce8\u91cd\u54c1\u8cea\u7684\u8cfc\u7269\u8005\u4f86\u8aaa\uff0cZara\u662f\u74e6\u8328\u62c9\u592b\u5ee3\u5834\u4e0a\u7684\u4e00\u500b\u91cd\u8981\u9078\u64c7\u3002", "name": "Zara (Zara V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "\u642d\u4e58\u5730\u9435C\u7dda\u81f3Muzeum\u7ad9\u6216M\u016fstek\u7ad9\uff0c\u6b65\u884c\u7d045-10\u5206\u9418\u3002\u5f9e\u9ad8\u5821\u7ad9\u642d\u4e58\u5730\u9435C\u7dda\u7d042-3\u7ad9\u3002"}], "name": "\u767e\u8ca8\u8207\u6d41\u884c\u6f6e\u724c"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};
        const districtContainer = document.getElementById('district-buttons');
        const categoryContainer = document.getElementById('category-buttons');
        const contentArea = document.getElementById('content-area');
        const cityName = "\u5e03\u62c9\u683c";
        let curDist = null, curCat = null;

        // 新增左右平滑滾動功能
        function scrollContainer(id, direction) {
            const container = document.getElementById(id);
            const scrollAmount = 250;
            container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function init() {
            const keys = Object.keys(dbData);
            keys.forEach(k => {
                let b = document.createElement('button');
                b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm';
                b.innerText = dbData[k].name;
                b.onclick = () => selectDist(k, b);
                districtContainer.appendChild(b);
            });
            if(keys.length > 0) selectDist(keys[0], districtContainer.children[0]);
        }

        function selectDist(k, b) {
            curDist = k;
            Array.from(districtContainer.children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-inactive transition-colors duration-200 shadow-sm');
            b.className = 'whitespace-nowrap px-4 py-2.5 md:px-6 md:py-3 rounded-xl font-bold text-sm md:text-base border area-btn-active transition-colors duration-200 shadow-md';
            categoryContainer.classList.remove('hidden');
            renderCats();
        }

        function renderCats() {
            categoryContainer.innerHTML = '';
            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 防止文字被折行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                categoryContainer.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], categoryContainer.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(categoryContainer.children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200');
            // 補上 whitespace-nowrap
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active transition-colors duration-200 shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) {
                contentArea.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">此分類目前無推薦資料</div>`;
                return;
            }
            contentArea.innerHTML = items.map(item => {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}`;
                
                // 【保留】：將伴手禮/購物特色描述中的星級轉為可點擊查評價的超連結
                const searchKeyword = encodeURIComponent(`${cityName} ${item.name}`);
                const formattedFeature = item.feature.replace(/(⭐\s*[\d\.]+星[\s\w|]*)/g, `<a href="https://www.google.com/search?q=${searchKeyword}" target="_blank" class="text-sky-600 font-bold hover:underline inline-flex items-center gap-1 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">$1 <i class="fa-solid fa-external-link-alt text-[10px]"></i></a>`);

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">
                            <span class="font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded mr-1">推薦必買</span>${formattedFeature}
                        </p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 詳細地址：</span><br>${item.address || '詳見導航'}<br><br>
                                <span class="font-bold text-rose-600">🚇 自由行交通：</span><br>${item.transport || '請參考地圖'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="w-full flex items-center justify-center px-4 py-3 md:py-4 border border-transparent rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors">
                            <i class="fa-solid fa-map-location-dot mr-2"></i> 開啟地圖導航
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
