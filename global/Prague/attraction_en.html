top and enjoy breathtaking 360-degree views of Prague\u0027s city center from multiple observation decks, including Prague Castle, Old Town Square, and Wenceslas Square. The tower also houses a restaurant, cafe, and a small museum, making it a unique landmark that combines history, sightseeing, and gastronomy.", "name": "Jind\u0159i\u0161sk\u00e1 Tower", "transport": "Metro Line A/C Muzeum station; Metro Line B N\u00e1m\u011bst\u00ed Republiky station; Trams 3, 5, 9, 14, 24 Jind\u0159i\u0161sk\u00e1 stop"}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1 61, 116 02 Nov\u00e9 M\u011bsto, Prague 1, Czechia", "feature": "\u2b50 4.4 stars | Lucerna Palace is a magnificent Art Nouveau complex near Wenceslas Square in Prague\u0027s New Town, built by the Havel family in the early 20th century. It houses a concert hall, cinema, cafes, shops, and the famous \u0027inverted St. Wenceslas\u0027 sculpture. Designed by V\u00e1clav Havel\u0027s grandfather, this building is one of the pioneers of modern Prague architecture and a significant center for Czech cultural and social life. Its interior is lavishly decorated, especially the main concert hall, known for its excellent acoustics and unique atmosphere. The most striking artwork within the palace is a satirical sculpture by David \u010cern\u00fd, which inverts the traditional equestrian image of St. Wenceslas, hanging upside down beneath the arcade, making it a popular photo spot.", "name": "Lucerna Palace", "transport": "Metro Line A M\u016fstek station; Trams 3, 9, 14, 24 Vodi\u010dkova stop"}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m. 68, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The National Museum is one of the largest and oldest museums in the Czech Republic, majestically situated at the top of Wenceslas Square. This Neo-Renaissance building is a work of art in itself, housing a rich collection of natural history, science, art, and historical artifacts, spanning everything from paleontology to the development of the Czech nation. After extensive renovations, the museum\u0027s modern exhibition spaces seamlessly blend with its classical architecture, offering visitors an immersive learning experience. Ascend to the dome\u0027s observation deck for breathtaking panoramic views of Prague, making it an excellent starting point for understanding Czech culture and history.", "name": "National Museum (N\u00e1rodn\u00ed muzeum)", "transport": "Take Metro Line A or C to \u0027Muzeum\u0027 station; or take several tram lines to \u0027Muzeum\u0027 station."}, {"address": "Pansk\u00e1 7, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.2 stars | The Mucha Museum is the world\u0027s only museum dedicated exclusively to the works of Art Nouveau master Alphonse Mucha. Located in the heart of Prague\u0027s New Town, it showcases a curated selection of Mucha\u0027s posters, decorative panels, oil paintings, drawings, and personal items from his periods in Paris and Prague. The museum offers a detailed insight into the Czech artist\u0027s unique style and profound influence on the Art Nouveau movement, allowing visitors to discover how he incorporated Slavic national elements into his opulent and poetic works, experiencing the eternal charm of his art.", "name": "Mucha Museum (Mucha Museum)", "transport": "Take Metro Line A to \u0027M\u016fstek\u0027 station or Metro Line B to \u0027N\u00e1m\u011bst\u00ed Republiky\u0027 station; or take several tram lines."}, {"address": "Jungmannovo n\u00e1m. 753/18, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Church of Our Lady of the Snows is an impressive Gothic church in Prague\u0027s New Town, founded by Charles IV in the 14th century. Originally planned to be Prague\u0027s largest church, only the towering presbytery was ultimately completed. Nevertheless, it boasts one of Prague\u0027s highest vaults, with a grand and solemn interior. The church is renowned for its magnificent Baroque altar and exquisite stained-glass windows, serving as a perfect example of Gothic architecture harmoniously combined with Baroque decorative art. It offers a tranquil sanctuary, allowing visitors to experience the weight of history and the solemnity of faith amidst the bustling city.", "name": "Church of Our Lady of the Snows (Kostel Panny Marie Sn\u011b\u017en\u00e9)", "transport": "Take Metro Line A to \u0027M\u016fstek\u0027 station; or take several tram lines to \u0027Vodi\u010dkova\u0027 or \u0027Lazarsk\u00e1\u0027 station."}, {"address": "Karlovo n\u00e1m. 9, 120 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.6 stars | The Church of St. Ignatius is one of the most magnificent Baroque buildings on Prague\u0027s Charles Square, part of the former Jesuit College. This church is renowned for its spectacular facade, exquisite stucco decorations, and rich frescoes, standing as an outstanding example of 17th-century Czech Baroque art. The interior is lavishly adorned, with a lifelike statue of St. Ignatius on the main altar and breathtaking trompe l\u0027oeil paintings on the ceiling, creating a sacred and solemn atmosphere. It is not only a place of worship but also a treasure trove for art enthusiasts exploring the Baroque style.", "name": "Church of St. Ignatius (Kostel svat\u00e9ho Ign\u00e1ce)", "transport": "Take Metro Line B to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station; or take several tram lines to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station."}, {"address": "Vy\u0161ehradsk\u00e1 49/1, 128 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.5 stars | The Emmaus Monastery is a historic Benedictine monastery established by Charles IV in the 14th century. It is renowned for its unique architectural style, particularly the two modernist spires added during post-WWII reconstruction, which create a striking contrast with the original Gothic structure, making it distinctive on Prague\u0027s skyline. The monastery\u0027s interior preserves valuable medieval frescoes and has played a significant cultural role throughout history. It is not only a religious site but also a must-visit for architecture enthusiasts and historians exploring Prague\u0027s diverse past.", "name": "Emmaus Monastery (Emauzy Kl\u00e1\u0161ter)", "transport": "Take Metro Line B to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station; or take several tram lines to \u0027Mor\u00e1\u0148\u0027 station."}, {"address": "Resslova 9a, 120 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.7 stars | The Church of Saints Cyril and Methodius is an Orthodox cathedral renowned for its heroic history during World War II. It served as the final hiding place for the Czech paratroopers who assassinated Nazi official Reinhard Heydrich during \u0027Operation Anthropoid\u0027. The church\u0027s crypt has now been converted into the \u0027Operation Anthropoid Memorial\u0027, detailing this tragic history of resistance and displaying the paratroopers\u0027 personal belongings and related artifacts. This church is not only an important religious site but also a historical museum carrying national memory and the spirit of heroism, reminding people not to forget history.", "name": "Church of Saints Cyril and Methodius (Chr\u00e1m svat\u00fdch Cyrila a Metod\u011bje)", "transport": "Take Metro Line B to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station; or take several tram lines to \u0027Jir\u00e1skovo n\u00e1m\u011bst\u00ed\u0027 or \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station."}, {"address": "Karlovo n\u00e1m. 1/23, 120 00 Nov\u00e9 M\u011bsto, Praha 2, Czechia", "feature": "\u2b50 4.3 stars | The New Town Hall, located on Charles Square, is a Gothic building steeped in history. It served not only as the administrative center of Prague\u0027s New Town but also as the site of the First Defenestration of Prague in 1419, marking the beginning of the Hussite Wars. The Town Hall\u0027s tower is its prominent feature, and visitors can ascend to the top for magnificent views of Charles Square and the surrounding New Town. The interior sometimes hosts art exhibitions and cultural events, making it an important landmark that combines history, architecture, and culture.", "name": "New Town Hall (Novom\u011bstsk\u00e1 radnice)", "transport": "Take Metro Line B to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station; or take several tram lines to \u0027Karlovo n\u00e1m\u011bst\u00ed\u0027 station."}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1, 110 00 Nov\u00e9 M\u011bsto, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Church of St. Stephen is one of the oldest parish churches in Prague\u0027s New Town, with a history dating back to the 12th century. This Gothic church is renowned for its robust stone structure and towering bell tower, which houses one of Prague\u0027s oldest bells. While its interior may not be as ornate as other Baroque churches, it exudes a rustic yet solemn atmosphere, preserving valuable medieval frescoes and sculptures. It stands as a witness to Prague\u0027s historical transformations, offering a unique visiting experience for those seeking tranquility and a sense of history.", "name": "Church of St. Stephen (Kostel svat\u00e9ho \u0160t\u011bp\u00e1na)", "transport": "Take Metro Line A or C to \u0027Muzeum\u0027 station; or take several tram lines to \u0027Vodi\u010dkova\u0027 or \u0027\u0160t\u011bp\u00e1nsk\u00e1\u0027 station."}], "name": "Art Museums and Churches"}, "cat_3": {"items": [{"address": "Vodi\u010dkova 699/18, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | The Franciscan Garden is a hidden oasis of tranquility in the heart of Prague\u0027s New Town, located behind Wenceslas Square, offering a perfect escape from the city\u0027s hustle and bustle. This historic garden, originally belonging to the Franciscan monastery, is now open to the public and is renowned for its meticulously manicured flowerbeds, rose gardens, fruit trees, and herb gardens. Benches are provided for visitors to rest, and a central fountain and sculptures add an artistic touch. Both locals and tourists enjoy strolling, reading, or simply savoring a moment of peace here. The garden\u0027s entrance is cleverly tucked away between several busy streets, and once inside, you\u0027ll be captivated by its unique atmosphere, as if time slows down.", "name": "Franciscan Garden (Franti\u0161k\u00e1nsk\u00e1 zahrada)", "transport": "Metro lines A, B to M\u016fstek station; Trams 3, 5, 6, 9, 14, 24 to V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed station"}, {"address": "Karlovo n\u00e1m\u011bst\u00ed, 120 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Charles Square is one of Prague\u0027s largest squares, with its central area designed as a vast and beautiful park. This park is not only a vital green lung for the New Town but also a popular spot for citizens\u0027 leisure and recreation. The park features many historic trees, meticulously designed flowerbeds, and wide lawns, perfect for walks, picnics, or enjoying the sunshine. Sculptures of several prominent Czech historical figures, such as Karel Havl\u00ed\u010dek Borovsk\u00fd and V\u00edt\u011bzslav H\u00e1lek, are scattered throughout the park, adding a cultural touch. Additionally, the park includes a small fountain and a children\u0027s play area, making it an excellent choice for family outings. Its convenient location and pleasant environment make it a rare urban oasis in the New Town.", "name": "Charles Square Park (Park na Karlov\u011b n\u00e1m\u011bst\u00ed)", "transport": "Metro line B to Karlovo n\u00e1m\u011bst\u00ed station; Trams 2, 3, 4, 6, 10, 14, 16, 18, 22, 23, 24 to Karlovo n\u00e1m\u011bst\u00ed station"}, {"address": "Na Slupi 16, 128 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | This botanical garden, part of the Charles University Faculty of Science, is one of Prague\u0027s oldest and most respected botanical gardens. It serves not only as a place for scientific research and education but is also open to the public, showcasing a rich diversity of plant species from around the world. The garden is divided into outdoor gardens and several greenhouses. The outdoor gardens feature various hardy plants, medicinal plants, and ornamental plants, displaying different beauties with the changing seasons. The greenhouses house tropical and subtropical plants, including orchids, cacti, and carnivorous plants, offering visitors an opportunity to explore an exotic plant world. With its tranquil environment, it\u0027s an ideal destination for plant enthusiasts and visitors seeking peace, allowing people to experience the wonder and diversity of nature even in the city center.", "name": "Botanical Garden of Charles University Faculty of Science (Botanick\u00e1 zahrada P\u0159\u00edrodov\u011bdeck\u00e9 fakulty Univerzity Karlovy)", "transport": "Trams 3, 14, 18, 24 to Botanick\u00e1 zahrada station"}, {"address": "Slovansk\u00fd ostrov 226, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Slavic Island, also known as \u017dof\u00edn Island, is a beautiful island on the Vltava River, located on the New Town riverfront. This island is famous for its elegant \u017dof\u00edn Palace, surrounded by a meticulously manicured park. The park features wide lawns, ancient trees, and flowerbeds, providing an excellent place for relaxation. Visitors can stroll here, admire the scenery along both banks of the Vltava River, and gaze at Prague Castle in the distance. The island also has a children\u0027s playground and boat rental services, making it a popular destination for families and couples. \u017dof\u00edn Palace itself is an important cultural center, frequently hosting concerts, balls, and exhibitions. The entire island exudes a classical and romantic atmosphere, making it an indispensable part of Prague\u0027s urban landscape.", "name": "Slavic Island (Slovansk\u00fd ostrov / \u017dof\u00edn)", "transport": "Trams 2, 9, 17, 18, 22, 23 to N\u00e1rodn\u00ed divadlo station, then walk across the bridge"}, {"address": "St\u0159eleck\u00fd ostrov, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | Shooter\u0027s Island is another charming island on the Vltava River, situated between the New Town and Lesser Town, connected by bridges near Charles Bridge and the National Theatre. This island is known for its lush greenery and tranquil atmosphere, offering a rare natural space in the heart of Prague. The island features wide lawns, shaded benches, and a small open-air amphitheater, which often hosts concerts and cultural events in the summer. Visitors can enjoy picnics here or simply sit by the river, admiring the Vltava\u0027s scenery and the historic buildings along its banks. From the island, you can enjoy magnificent panoramic views of Charles Bridge and Prague Castle, making it an ideal spot for photography enthusiasts. Shooter\u0027s Island provides a perfect sanctuary away from the city\u0027s hustle and bustle, allowing one to relax and unwind in nature.", "name": "Shooter\u0027s Island (St\u0159eleck\u00fd ostrov)", "transport": "Trams 2, 9, 17, 18, 22, 23 to N\u00e1rodn\u00ed divadlo station, then walk across the bridge"}, {"address": "D\u011btsk\u00fd ostrov, 150 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Children\u0027s Island is an island park on the Vltava River specifically designed for children and families, located on the New Town riverfront. Although named \u0027Children\u0027s Island,\u0027 its lush green environment and riverside scenery also attract many adults. The island features multiple modern playgrounds, including climbing frames, slides, sandpits, and water features, ensuring children can play to their heart\u0027s content. In addition to play facilities, the island also has wide lawns and shaded areas for parents to rest and relax. Along the riverbanks, visitors can enjoy the beautiful views of the Vltava River and the cityscapes on the opposite bank. Children\u0027s Island is a vibrant and joyful place, providing a safe and fun outdoor activity space for families in Prague, allowing children to grow up amidst nature.", "name": "Children\u0027s Island (D\u011btsk\u00fd ostrov)", "transport": "Trams 9, 12, 15, 20 to Arbesovo n\u00e1m\u011bst\u00ed station, then walk across the bridge"}, {"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed 1980/42, 120 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 3.9 stars | Z\u00edtkovy Gardens is a small park on the Vltava River embankment in Prague\u0027s New Town, located near the famous \u0027Dancing House.\u0027 Although not large, this park boasts an excellent location, offering a superb vantage point for enjoying river views and cityscapes. The park features neatly trimmed lawns, flowerbeds, and some trees, providing a resting place for local residents and visitors. Guests can sit on the benches here, enjoy the river breeze, watch boats traverse the Vltava, and gaze at the buildings on the opposite bank. Z\u00edtkovy Gardens is a simple yet pleasant urban green space, perfect for a brief stop to soak in the relaxed riverside atmosphere of Prague, especially on sunny days, it\u0027s a great spot to unwind.", "name": "Z\u00edtkovy Gardens (Z\u00edtkovy sady)", "transport": "Trams 2, 3, 17, 18 to Jir\u00e1skovo n\u00e1m\u011bst\u00ed station"}, {"address": "Lannova 2061/10, 110 00 Nov\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 3.8 stars | Lannova Park is a relatively small but well-maintained urban park in Prague\u0027s New Town, located on the east bank of the Vltava River, near the Florenc district. This park is known for its simple design and tranquil atmosphere, providing an important green space for the surrounding office buildings and residential areas. The park features wide lawns, shady trees, and some flowerbeds, making it an ideal spot for local residents to take a lunch break, stroll, or walk their dogs. While it doesn\u0027t boast as many facilities as other large parks, its tidy environment and convenient location make it a popular resting spot in urban life. Lannova Park demonstrates that even small urban green spaces can bring a touch of freshness and tranquility to busy city life.", "name": "Lannova Park (Lannova Park)", "transport": "Metro lines B, C to Florenc station; Trams 3, 8, 24 to B\u00edl\u00e1 labu\u0165 station"}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "Ra\u0161\u00ednovo n\u00e1b\u0159e\u017e\u00ed 80, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.5 stars | This deconstructivist building, designed by Frank Gehry, is famous for its unique \u0027Fred and Ginger\u0027 shape, resembling a pair of dancers gracefully moving on the Vltava River bank. It breaks away from Prague\u0027s traditional Baroque, Gothic, and Art Nouveau styles, becoming an iconic landmark of modern architecture. Visitors can enjoy food and drinks at the Ginger \u0026 Fred restaurant or the glass-roofed bar on the top floor, while overlooking the magnificent views of Prague Castle and the Vltava River. Its irregular curves and glass facade display ever-changing charm under different lighting, making it an excellent spot for photography enthusiasts to capture Prague\u0027s modern face.", "name": "\u8df3\u821e\u7684\u623f\u5b50 (Dancing House / Tan\u010d\u00edc\u00ed d\u016fm)", "transport": "Metro Line B, Karlovo n\u00e1m\u011bst\u00ed station, approximately a 5-minute walk; Tram 17 or 3, Jir\u00e1skovo n\u00e1m\u011bst\u00ed station."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | As the heart of Prague\u0027s New Town, Wenceslas Square is not only the site of many significant historical events but also a hub of modern commerce and culture. The square is long and lined with magnificent buildings, shops, restaurants, and hotels. At its upper end stands the equestrian statue of St. Wenceslas and the National Museum, forming a classic Prague scene. Whether it\u0027s the bustling crowds during the day or the brilliantly lit spectacle at night, it offers rich material for photography. This place has witnessed the changes in Czech history, and a stroll through it allows you to feel the city\u0027s unique pulse.", "name": "\u74e6\u8328\u62c9\u592b\u5ee3\u5834 (Wenceslas Square / V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Metro Line A or C, Muzeum station; Metro Line A or B, M\u016fstek station; served by multiple tram lines."}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m\u011bst\u00ed 68, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Situated at the top of Wenceslas Square, the National Museum\u0027s Neo-Renaissance main building is a work of art in itself. Its grand facade, exquisite sculptures, and massive dome make it one of Prague\u0027s most representative buildings. Whether viewed from the square below or overlooking the square from inside the museum, you can capture stunning photos. Especially at sunset, when the sunlight bathes the building, its golden glow makes it appear even more solemn and magnificent. While the museum also houses rich collections of natural sciences and historical artifacts, the splendor of its exterior architecture alone makes it a popular photo spot.", "name": "\u570b\u5bb6\u535a\u7269\u9928 (National Museum / N\u00e1rodn\u00ed muzeum)", "transport": "Metro Line A or C, Muzeum station."}, {"address": "Jeruzal\u00e9msk\u00e1 7, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | This Jubilee Synagogue, located on the edge of the New Town, is renowned for its stunning blend of Moorish Revival and Art Nouveau styles. Its vibrant colors, intricate mosaics, and opulent interior decoration make it one of Prague\u0027s most beautiful and unique religious buildings. The exterior features interwoven red brick and white stone, adorned with blue and gold accents, shimmering under the sunlight \u2013 an ideal spot for photographers to capture exotic charm and architectural details. The interior is even more resplendent, with stained-glass windows and complex geometric patterns that are dazzling to behold, making it a must-visit to experience Prague\u0027s diverse cultural history.", "name": "\u5343\u79a7\u7336\u592a\u6703\u5802 (Jubilee Synagogue / Jeruzal\u00e9msk\u00e1 synagoga)", "transport": "Metro Line B or C, Florenc station, approximately a 10-minute walk; Tram 3, 5, or 9, Masarykovo n\u00e1dra\u017e\u00ed station."}, {"address": "\u0160t\u011bp\u00e1nsk\u00e1 61, 116 02 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | Hidden within the Lucerna Palace near Wenceslas Square, this passage is famous for its unique art installations. The most striking is undoubtedly David \u010cern\u00fd\u0027s sculpture: an upside-down equestrian statue of St. Wenceslas. This work, full of irony and visual impact, attracts countless visitors who stop to take photos. The passage itself is imbued with Art Nouveau charm, with high vaulted ceilings and exquisite decorations, creating a nostalgic yet mysterious atmosphere. It\u0027s not only a great place for photos but also a unique space to experience Prague\u0027s artistic spirit.", "name": "\u76e7\u7b56\u723e\u7d0d\u5bae\u6bbf\u901a\u9053 (Lucerna Palace Passage / Pas\u00e1\u017e Lucerna)", "transport": "Metro Line A or B, M\u016fstek station, approximately a 2-minute walk; multiple tram lines, Vodi\u010dkova station."}, {"address": "Wilsonova 300/8, 120 00 Nov\u00e9 M\u011bsto, Praha 2", "feature": "\u2b50 4.0 stars | Prague Main Railway Station is not just a transport hub; its historic \u0027Fantova Hall\u0027 (Fantova budova) is a treasure of Art Nouveau architecture. Designed by Josef Fanta, this hall boasts magnificent vaulted ceilings, exquisite stained glass, sculptures, and frescoes, exuding a rich fin-de-si\u00e8cle ambiance. Although the modern part of the station is underground, this well-preserved old hall remains a paradise for photography enthusiasts. It showcases Prague\u0027s artistic and engineering achievements in the early 20th century, providing an excellent backdrop for capturing the city\u0027s elegant historical face.", "name": "\u5e03\u62c9\u683c\u4e2d\u592e\u8eca\u7ad9 (Prague Main Railway Station / Praha hlavn\u00ed n\u00e1dra\u017e\u00ed)", "transport": "Metro Line C, Hlavn\u00ed n\u00e1dra\u017e\u00ed station; multiple tram lines, Hlavn\u00ed n\u00e1dra\u017e\u00ed station."}, {"address": "N\u00e1rodn\u00ed 2, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | Situated on the banks of the Vltava River, the National Theatre is a symbol of Czech national revival and one of Prague\u0027s most magnificent Neo-Renaissance buildings. Its golden roof, exquisite sculptures and frescoes, and prime riverside location make it an extremely popular photography spot. Whether from the opposite bank, Charles Bridge, or the square in front of the theatre, you can capture its solemn and splendid grandeur. Especially at sunset or when the lights come on at night, the theatre\u0027s reflection in the water is breathtakingly beautiful, providing an excellent backdrop to showcase Prague\u0027s romantic atmosphere.", "name": "\u570b\u5bb6\u5287\u9662 (National Theatre / N\u00e1rodn\u00ed divadlo)", "transport": "Metro Line B, N\u00e1rodn\u00ed t\u0159\u00edda station, approximately a 5-minute walk; Tram 2, 9, 17, 18, or 22, N\u00e1rodn\u00ed divadlo station."}, {"address": "Jungmannovo n\u00e1m\u011bst\u00ed 753/18, 110 00 Nov\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.2 stars | This church, located in the heart of the New Town, remains impressive despite its grand architectural plans never being fully realized. It boasts Prague\u0027s highest church nave, with soaring vaults and a simple Gothic style, creating a solemn and serene atmosphere. The church\u0027s opulent Baroque altar provides an interesting contrast to its Gothic structure. The surrounding courtyard and monastery ruins also offer a tranquil space away from the city\u0027s hustle and bustle, providing a unique perspective to capture the beauty of Prague\u0027s history and religious architecture. Its tall windows and the effect of light penetration offer excellent conditions for photography.", "name": "\u96ea\u4e4b\u8056\u6bcd\u6559\u5802 (Church of Our Lady of the Snows / Kostel Panny Marie Sn\u011b\u017en\u00e9)", "transport": "Metro Line A or B, M\u016fstek station, approximately a 3-minute walk; Tram 3, 9, 14, or 24, Vodi\u010dkova station."}], "name": "Popular Photo Spots"}}, "name": "\u65b0\u57ce\u5340 (Nov\u00e9 M\u011bsto)"}, "old_town": {"categories": {"cat_1": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Prague\u0027s Old Town Square is one of Europe\u0027s most beautiful and historically significant squares, serving as the heart of Prague since the 12th century. The square is surrounded by a variety of historical buildings, including the magnificent Church of Our Lady before T\u00fdn, the Baroque St. Nicholas Church, and the famous Old Town Hall with its Astronomical Clock. It has been the site of important markets, celebrations, and historical events. Visitors can enjoy street performers, sample local delicacies, and soak in Prague\u0027s rich cultural atmosphere. In the center of the square stands a monument to the reformer Jan Hus, symbolizing the spirit of the Czech nation. Whether by day or night, Old Town Square exudes a captivating charm, making it an excellent starting point for exploring Prague\u0027s history.", "name": "Old Town Square (Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take a tram to Starom\u011bstsk\u00e1 station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 1, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | The Prague Astronomical Clock is one of the oldest and still-operating astronomical clocks in the world, installed in 1410. It is located on the southern wall of the Old Town Hall and consists of three main components: the astronomical dial, which displays the positions of the sun and moon in the sky along with various astronomical details; \u0027The Walk of the Apostles,\u0027 a mechanical spectacle where the Twelve Apostles and other moving sculptures appear on the hour; and a calendar dial representing the months. This precise mechanical masterpiece is not only a time indicator but also an astonishing testament to medieval science and craftsmanship. Every hour on the hour, thousands of tourists gather below the clock tower to watch the procession of the apostles and experience its unique historical charm.", "name": "Prague Astronomical Clock (Pra\u017esk\u00fd orloj)", "transport": "Located in Old Town Square, Metro Line A, Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 1/3, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Old Town Hall is one of the most iconic building complexes in Prague\u0027s Old Town Square, with its history dating back to 1338 when it served as the administrative center for Prague\u0027s Old Town. The Town Hall consists of multiple Gothic and Renaissance buildings, with its towering Gothic spire being the most striking feature. Visitors can ascend the tower to enjoy panoramic views of the entire Old Town Square and Prague. The famous Astronomical Clock is embedded in its southern wall. Inside, the Town Hall boasts opulent council chambers, historic halls, and cellars, showcasing Prague\u0027s rich history and culture. This building is not only a symbol of power but also an important testament to the daily life of Prague\u0027s citizens.", "name": "Old Town Hall (Starom\u011bstsk\u00e1 radnice)", "transport": "Located in Old Town Square, Metro Line A, Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 604, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | The Church of Our Lady before T\u00fdn is one of the most prominent landmarks in Prague\u0027s Old Town Square, with its twin spires soaring into the sky, becoming a symbol of Prague\u0027s skyline. This magnificent Gothic church began construction in the 14th century and took several centuries to complete, blending Gothic and Baroque architectural elements. The church\u0027s interior is lavishly decorated, featuring exquisite altars, sculptures, and an organ, with the tombstone of astronomer Tycho Brahe being among its most famous features. The Church of Our Lady before T\u00fdn is not only an important religious site but also a treasure trove of Prague\u0027s history and art. Its mysterious and solemn exterior appears even more enchanting under night lights, making it a must-visit attraction for photography enthusiasts and history buffs.", "name": "Church of Our Lady before T\u00fdn (T\u00fdnsk\u00fd chr\u00e1m)", "transport": "Located on the east side of Old Town Square, Metro Line A, Starom\u011bstsk\u00e1 station, about a 7-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | St. Nicholas Church in Old Town Square is a stunning Baroque building, distinct from the church of the same name in Lesser Town. This church is renowned for its elegant white facade and green dome. It was built in the 18th century and designed by the famous Baroque architect Kili\u00e1n Ign\u00e1c Dientzenhofer. The interior of the church is lavishly decorated, featuring magnificent frescoes, sculptures, and crystal chandeliers, creating a solemn and sacred atmosphere. Its massive organ is one of the largest in Europe, and concerts are frequently held here. This church is an outstanding example of Prague\u0027s Baroque art, showcasing the exquisite craftsmanship and rich artistic imagination of its time.", "name": "St. Nicholas Church (Kostel svat\u00e9ho Mikul\u00e1\u0161e)", "transport": "Located at the northwest corner of Old Town Square, Metro Line A, Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Charles Bridge is one of Prague\u0027s most iconic landmarks, spanning the Vltava River and connecting the Old Town with Lesser Town. This historic stone bridge began construction in 1357, commissioned by Charles IV, and took several centuries to complete. Along both sides of the bridge stand 30 exquisite Baroque statues, with the statue of St. John of Nepomuk being the most famous. The bridge is always bustling with artists, musicians, and vendors, creating a lively atmosphere. From the bridge, one can enjoy magnificent views of Prague Castle, the Church of Our Lady before T\u00fdn, and the Vltava River. Charles Bridge is not only an important transportation hub but also a symbol of Prague\u0027s history and romance.", "name": "Charles Bridge (Karl\u016fv most)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, about a 10-minute walk; or take a tram to Karlovy l\u00e1zn\u011b station."}, {"address": "Na P\u0159\u00edkop\u011b 859/12, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Powder Tower is the eastern entrance to Prague\u0027s Old Town and one of Prague\u0027s most famous Gothic city gates. It was built in 1475, initially as a fortification for the Royal Court, and later used as a gunpowder storage facility in the 17th century, hence its name. This towering black Gothic tower, whose exterior design was inspired by the Old Town Bridge Tower of Charles Bridge, is adorned with exquisite sculptures and coats of arms. Visitors can climb to the top of the tower to enjoy magnificent views of Prague\u0027s city center and surrounding buildings, especially in stark contrast to the adjacent Municipal House. The Powder Tower marks the beginning of Prague\u0027s Royal Route, witnessing many historical moments of royal coronation processions.", "name": "Powder Tower (Pra\u0161n\u00e1 br\u00e1na)", "transport": "Metro Line B, N\u00e1m\u011bst\u00ed Republiky station, about a 1-minute walk; or take a tram to N\u00e1m\u011bst\u00ed Republiky station."}, {"address": "Ovocn\u00fd trh 19, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The House at the Black Madonna is a unique example of Cubist architecture in Prague and indeed worldwide, built in 1911-1912 and designed by Czech architect Josef Go\u010d\u00e1r. This building is renowned for its distinctive geometric shapes, sharp angles, and innovative spatial layout, perfectly applying Cubist art principles to architectural design. The building\u0027s name originates from a Baroque statue of the Black Madonna located on its corner. Today, the building houses the Museum of Czech Cubism and a famous Cubist caf\u00e9, \u0027Grand Caf\u00e9 Orient,\u0027 allowing visitors to appreciate architectural art while experiencing a unique historical atmosphere. It is a shining jewel in Prague\u0027s modern architectural history.", "name": "House at the Black Madonna (D\u016fm U \u010cern\u00e9 Matky Bo\u017e\u00ed)", "transport": "Metro Line A, M\u016fstek station, about a 5-minute walk; or take a tram to N\u00e1m\u011bst\u00ed Republiky station, about a 5-minute walk."}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.7 stars | The Church of Our Lady before T\u00fdn is one of the most striking landmarks in Prague\u0027s Old Town Square, with its Gothic twin spires soaring into the sky, full o medieval clock has faithfully kept time since 1410, and every hour, the procession of the Twelve Apostles\u0027 figures appears, with chimes echoing across the square, drawing countless visitors. The Town Hall itself blends Gothic and Renaissance styles, housing historical exhibitions and an observation tower. Ascending the tower offers a magnificent panoramic view of Old Town Square. It is a perfect blend of Prague\u0027s history, science, and art, and a symbol of the city\u0027s spirit.", "name": "Old Town Hall with Astronomical Clock", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 3-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, about a 3-minute walk."}, {"address": "Mari\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed 5, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | The Klementinum is Prague\u0027s second-largest architectural complex, after Prague Castle. Formerly a Jesuit university, it now houses the Czech National Library. Its most famous feature is the Baroque Library Hall, acclaimed as one of the world\u0027s most beautiful libraries, boasting astonishing frescoes, globes, and ancient books. Additionally, the complex includes the Church of St. Salvator, the Mirror Chapel, and an Astronomical Tower offering magnificent views of Prague. Strolling through it feels like traveling through time, immersing oneself in a rich academic and artistic atmosphere.", "name": "Klementinum", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take tram 17 or 18 to Karlovy l\u00e1zn\u011b station, about a 2-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 12, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.4 stars | Kinsk\u00fd Palace, located at the northeast corner of Old Town Square, is a magnificent Rococo palace, distinctive with its pink and white facade. Once a noble residence, it now forms part of the National Gallery Prague, primarily hosting temporary art exhibitions covering various forms from classical to modern. Its exquisite architectural details and interior decoration are themselves works of art, offering visitors an elegant venue to appreciate world-class artworks while experiencing the former splendor of Prague\u0027s aristocratic life.", "name": "Kinsk\u00fd Palace, National Gallery Prague", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, about a 5-minute walk."}, {"address": "U Star\u00e9 \u0161koly 141/1, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.5 stars | The Jewish Museum in Prague is not a single building but a complex comprising several historic synagogues, the Old Jewish Cemetery, and ceremonial halls located in the Jewish Quarter (Josefov). It meticulously documents centuries of history, culture, and tragedy of Prague\u0027s Jewish community, housing a vast collection of precious artifacts, manuscripts, and artworks. Visitors can explore the Pinkas Synagogue, Spanish Synagogue, Old-New Synagogue, and more, gaining deep insight into the rise, fall, and resilience of the Jewish people in Prague. It is a profound and moving journey through human history.", "name": "Jewish Museum in Prague", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 5-10 minute walk, as attractions are scattered throughout the Jewish Quarter."}, {"address": "Mal\u00e1 \u0160tupartsk\u00e1 635/6, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.6 stars | St. James\u0027s Church is a magnificent Baroque church in Prague\u0027s Old Town, renowned for its exceptional acoustics and Europe\u0027s third-largest organ. The church\u0027s interior is lavishly decorated, featuring breathtaking frescoes, sculptures, and altars, particularly the statue of St. James on the main altar. Organ concerts and classical music performances are frequently held here, allowing visitors to experience a powerful musical feast while admiring exquisite art. The church also holds a legend about the \u0027cursed hand,\u0027 adding a touch of mystery.", "name": "St. James\u0027s Church", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 7-minute walk; or take tram 17 or 18 to Dlouh\u00e1 t\u0159\u00edda station, about a 5-minute walk."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m\u011bst\u00ed 605/13, 110 00 Star\u00e9 M\u011bsto, Praha 1", "feature": "\u2b50 4.3 stars | The House at the Stone Bell is a unique Gothic building on Old Town Square, named for the stone bell embedded in its facade. This building\u0027s history dates back to the 13th century and is considered one of Prague\u0027s oldest stone houses, once serving as a residence for Bohemian kings. Today, it is part of the Prague City Gallery, primarily hosting contemporary art exhibitions and cultural events. Visitors can not only admire its unique Gothic architectural details but also immerse themselves in a modern art atmosphere, experiencing a dialogue between history and contemporary times.", "name": "House at the Stone Bell", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, about a 4-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, about a 4-minute walk."}], "name": "Art Museums and Churches"}, "cat_3": {"items": [{"address": "Ane\u017esk\u00e1 12, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Gardens of the Convent of St. Agnes are a hidden oasis in the northern part of the Old Town, located within the historic convent complex. These meticulously maintained gardens offer a tranquil retreat from the city\u0027s hustle and bustle. Visitors can stroll through manicured lawns, admire seasonal flowers and ancient trees, and soak in the medieval monastic atmosphere. Modern sculptures are also scattered throughout the gardens, creating an interesting contrast with the ancient architecture. It\u0027s an ideal place for contemplation, relaxation, or simply enjoying a moment of peace, while also admiring the magnificent Gothic architecture of the convent.", "name": "Gardens of the Convent of St. Agnes", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 10-15 minutes; or take Tram 17 to \u0027Pr\u00e1vnick\u00e1 fakulta\u0027 stop, then walk for about 5 minutes."}, {"address": "Mari\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.0 stars | Mari\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed, located in the heart of the Old Town next to the Clementinum and the Prague Municipal Library, is a verdant city square. Tall trees and seasonal flowerbeds adorn the center of the square, along with comfortable benches, providing a relaxing spot for visitors and locals alike. Despite being surrounded by important historical buildings, the square\u0027s green space creates a peaceful atmosphere, making it an ideal place for a short break, reading, or observing city life. It also serves as a convenient gateway to other Old Town attractions, offering a moment of natural respite.", "name": "Mari\u00e1nsk\u00e9 n\u00e1m\u011bst\u00ed", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 3 minutes."}, {"address": "Anensk\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Anensk\u00e9 n\u00e1m\u011bst\u00ed is a charming and secluded small square in the Old Town, located near Charles Bridge and known for its historic St. Anne\u0027s Church. Although not large, the square is shaded by trees and features benches, offering a quiet corner away from the crowds. The atmosphere here is very pleasant, making it an excellent spot for a stroll, a short rest, or enjoying a moment of tranquility. The surrounding buildings are rich in history, complementing the central green space and creating a unique Prague charm. Many visitors pause here to experience the serene beauty of the Old Town.", "name": "Anensk\u00e9 n\u00e1m\u011bst\u00ed", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 7-10 minutes; or walk for about 5 minutes from the Old Town side of Charles Bridge."}, {"address": "Na Franti\u0161ku, 110 00 Praha 1, Czechia", "feature": "\u2b50 3.8 stars | Na Franti\u0161ku is a relatively understated yet green area located in the northeastern part of the Old Town, near the Vltava River. It features several small lawns, trees, and benches, providing a space for local residents and a few visitors to relax. Although not a traditional park, its open green spaces are particularly valuable amidst the dense architecture of the Old Town. Visitors can experience the daily life of Prague here, enjoy views of the riverside, or find a moment of peace under the shade of trees. This area is also passed on the way to the Gardens of the Convent of St. Agnes.", "name": "Na Franti\u0161ku Green Area", "transport": "Take Tram 17 to \u0027Pr\u00e1vnick\u00e1 fakulta\u0027 stop, then walk for about 3 minutes."}, {"address": "Smetanovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Smetanovo n\u00e1b\u0159e\u017e\u00ed is one of the most famous riverside promenades in the Old Town along the Vltava River. Although primarily a pedestrian walkway, it is lined with rows of trees and numerous benches, offering an excellent \"natural scenery\" experience. Here, one can not only admire the flowing beauty of the Vltava River but also take in the magnificent views of Prague Castle, Charles Bridge, and the Lesser Town. In the evening, the sunset casting its glow on the river and ancient buildings is particularly enchanting. Visitors can stroll, jog, or sit on a bench to enjoy the river breeze and soak in Prague\u0027s unique romantic atmosphere.", "name": "Smetanovo n\u00e1b\u0159e\u017e\u00ed", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 5-7 minutes; or take Tram 17 or 18 to \u0027Karlovy l\u00e1zn\u011b\u0027 stop."}, {"address": "Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.4 stars | Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed is another scenic riverside promenade in the northern part of the Old Town along the Vltava River, named after the famous Czech composer Dvo\u0159\u00e1k. This promenade is wider than Smetanovo n\u00e1b\u0159e\u017e\u00ed, also lined with trees, and offers unobstructed river views. From here, visitors can admire Letn\u00e1 Park on the opposite bank, Prague Castle, and boats cruising along the river. The atmosphere here is relatively more tranquil, making it an ideal place for a walk, a jog, or simply enjoying the riverside scenery. Especially on sunny days, with the river sparkling and lush greenery on both banks, it\u0027s a wonderful spot to experience Prague\u0027s natural charm.", "name": "Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 5-10 minutes; or take Tram 17 to \u0027Pr\u00e1vnick\u00e1 fakulta\u0027 stop."}, {"address": "N\u00e1m\u011bst\u00ed Franze Kafky, 110 00 Praha 1, Czechia", "feature": "\u2b50 3.9 stars | N\u00e1m\u011bst\u00ed Franze Kafky (Franz Kafka Square) is a small yet historically significant square located on the edge of the Old Town\u0027s Jewish Quarter. The center of the square features a few trees and some greenery, adding a touch of life to this historic area. While not a large park, its green elements combined with the surrounding historical buildings (including the vicinity of Kafka\u0027s birthplace) create a unique atmosphere. Visitors can pause here briefly to soak in the ambiance of this literary giant\u0027s hometown, while also enjoying a moment of greenery and tranquility. It also serves as a convenient starting point for various attractions in the Jewish Quarter.", "name": "N\u00e1m\u011bst\u00ed Franze Kafky", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 3-5 minutes."}, {"address": "K\u0159i\u017eovnick\u00e9 n\u00e1m\u011bst\u00ed, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.1 stars | K\u0159i\u017eovnick\u00e9 n\u00e1m\u011bst\u00ed (Knights of the Cross Square) is one of Prague\u0027s most famous squares, located at the entrance to Charles Bridge in the Old Town. Although primarily a transport hub and tourist spot, the square is adorned with several tall trees and seasonal flowerbeds, bringing a touch of greenery to the bustling area. These green elements complement the magnificent surrounding buildings, including the Church of St. Francis of Assisi, the Charles Bridge Tower, and the Clementinum, providing a visual balance. Visitors can rest on the benches here, admire the historical architecture, feel the breeze from the Vltava River, and enjoy a moment of natural ambiance. It is an important green node in the Old Town and an excellent spot to appreciate Prague\u0027s landmarks.", "name": "K\u0159i\u017eovnick\u00e9 n\u00e1m\u011bst\u00ed Green Area", "transport": "Take Metro Line A to \u0027Starom\u011bstsk\u00e1\u0027 station, then walk for about 5 minutes; or take Tram 17 or 18 to \u0027Karlovy l\u00e1zn\u011b\u0027 stop."}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "Starom\u011bstsk\u00e9 n\u00e1m., 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.8 stars | Prague\u0027s Old Town Square is one of Europe\u0027s most beautiful and historically significant squares, surrounded by stunning Gothic, Renaissance, and Baroque architecture. It\u0027s not only the best place to watch the Astronomical Clock show but also offers excellent views of the T\u00fdn Church\u0027s twin spires and St. Nicholas Church\u0027s magnificent dome. The square frequently hosts markets, concerts, and festivals, bustling with life and energy day and night, making it a must-visit to capture the essence of Prague. Its rich historical layers and diverse architectural styles make every corner a perfect photographic backdrop, especially during the Christmas markets when it\u0027s truly breathtaking.", "name": "Old Town Square", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m. 1, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | Located on the southern wall of the Old Town Hall, the Prague Astronomical Clock is one of the world\u0027s oldest and still-operating astronomical clocks. Its intricate mechanical workings and the hourly \u0027Walk of the Apostles\u0027 show attract countless visitors. This clock not only tells time but also displays the positions of the sun and moon, as well as various astronomical information. Its ornate Gothic sculptures and complex dial make it one of Prague\u0027s most iconic landmarks. Visitors can climb the Old Town Hall tower to overlook the entire Old Town Square and the Astronomical Clock from above, capturing its unique charm.", "name": "Prague Astronomical Clock", "transport": "Located in Old Town Square, take Metro Line A to Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.9 stars | Charles Bridge is Prague\u0027s most iconic landmark, spanning the Vltava River and connecting the Old Town and Lesser Town. This historic stone bridge is flanked by 30 exquisite Baroque statues, with the most famous being the statue of St. John of Nepomuk. Early morning or late evening, when crowds are thinner, is the best time to capture the beauty of Prague Castle, the Vltava River, and the bridge\u0027s sculptures. Street performers, painters, and souvenir stalls on the bridge also add a unique Bohemian flair, making it an unmissable spot for photography enthusiasts.", "name": "Charles Bridge", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approximately 8 minutes walk; or take tram lines 17, 18 to Karlovy l\u00e1zn\u011b station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m., 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | With its towering Gothic twin spires, the Church of Our Lady before T\u00fdn is one of the most striking buildings in Prague\u0027s Old Town Square. Dating back to the 14th century, its unique black spires and rich interior decoration make it a masterpiece of Gothic architecture. Whether admiring its grand exterior from Old Town Square or its mysterious silhouette under night lights, T\u00fdn Church offers excellent photographic opportunities. The church houses many precious artworks and historical artifacts, and while not always open for tours, its external visual impact is awe-inspiring.", "name": "Church of Our Lady before T\u00fdn", "transport": "Located in Old Town Square, take Metro Line A to Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Na P\u0159\u00edkop\u011b 859/20, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | The Powder Tower is the eastern entrance to Prague\u0027s Old Town and the starting point of the Royal Route. This magnificent Gothic city gate, built in the 15th century, was once used as a gunpowder storage facility, hence its name. Its dark exterior and intricate carvings make it one of Prague\u0027s most representative Gothic buildings. Visitors can climb to the top of the tower for panoramic views of the Old and New Towns, making it an excellent spot for cityscapes and capturing the historical atmosphere. The Powder Tower stands in striking contrast to the adjacent Municipal House, showcasing Prague\u0027s architectural styles from different eras.", "name": "Powder Tower", "transport": "Metro Line B, N\u00e1m\u011bst\u00ed Republiky station, approximately 1 minute walk; or take tram lines 5, 8, 14, 26 to N\u00e1m\u011bst\u00ed Republiky station."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Czechia", "feature": "\u2b50 4.4 stars | Located in the Jewish Quarter, the Old Jewish Cemetery is one of Europe\u0027s most unique and ancient Jewish cemeteries. Due to limited space, gravestones are layered up to 12 deep, creating a distinctive and solemn landscape. Many famous rabbis and scholars are buried here, with each tombstone carrying a rich historical story. The cemetery\u0027s tranquil and solemn atmosphere makes it an excellent place to capture the historical and cultural depth of Prague\u0027s Jewish community. Its unique visual appeal and historical weight make it a popular choice for photography enthusiasts exploring another side of Prague.", "name": "Old Jewish Cemetery", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approximately 10 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Starom\u011bstsk\u00e9 n\u00e1m., 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | St. Nicholas Church, located in Old Town Square, is an impressive Baroque building whose green dome and white facade stand out prominently in the square. The church\u0027s interior is lavishly decorated with exquisite frescoes, sculptures, and a massive organ, making it a prime example of Prague\u0027s Baroque art. It is not only an important religious site but also frequently hosts classical music concerts, offering visitors a unique cultural experience with its excellent acoustics and grand spatial feel. Photographs from various angles of the square can capture its magnificent architectural details and harmony with its surroundings.", "name": "St. Nicholas Church", "transport": "Located in Old Town Square, take Metro Line A to Starom\u011bstsk\u00e1 station, approximately 5 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}, {"address": "Du\u0161n\u00ed, 110 00 Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | This unique monument is located at the intersection of the Jewish Quarter and the Old Town, dedicated to Prague\u0027s most famous literary figure, Franz Kafka. Created by Czech artist Jaroslav R\u00f3na, the sculpture depicts a headless man in a suit riding on the shoulders of another hollow suit, inspired by Kafka\u0027s novel \u0027Description of a Struggle\u0027. Its abstract and philosophical design makes it a visually striking piece of modern art, attracting many visitors for photos. It is not only a pilgrimage site for Kafka fans but also an excellent choice for exploring the intersection of modern art and literature in Prague.", "name": "Franz Kafka Monument", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approximately 7 minutes walk; or take tram lines 17, 18 to Starom\u011bstsk\u00e1 station."}], "name": "Popular Photo Spots"}}, "name": "\u8001\u57ce\u5340 (Star\u00e9 M\u011bsto)"}, "vinohrady_zizkov": {"categories": {"cat_1": {"items": [{"address": "Mahlerovy sady 2699/1, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.3 stars | An iconic landmark on Prague\u0027s skyline, the \u017di\u017ekov Television Tower is renowned for its unique ultra-modernist design, conceived by architects V\u00e1clav Aulick\u00fd and Ji\u0159\u00ed Koz\u00e1k and completed in 1992. Standing at 216 meters, it\u0027s not only Prague\u0027s tallest building but also widely discussed and noticed for the controversial \u0027Crawling Babies\u0027 sculptures by artist David \u010cern\u00fd adorning its exterior. Visitors can take a high-speed elevator to the observation deck, offering panoramic views of Prague from 93 meters up, including the Old Town, Prague Castle, and the Vltava River. The tower also houses a fine-dining restaurant and a luxury suite, providing a unique accommodation experience. More than just a communication facility, it\u0027s an urban landmark blending art and engineering, representing the experimental spirit of post-communist Czech architecture.", "name": "\u017di\u017ekov Television Tower (\u017di\u017ekovsk\u00e1 televizn\u00ed v\u011b\u017e)", "transport": "Metro Line A, Ji\u0159\u00edho z Pod\u011bbrad station, approximately a 10-minute walk; Tram lines 9, 15, Perunova stop, approximately a 5-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Located in Prague\u0027s Vinohrady district, this Roman Catholic church was designed by the renowned Slovenian architect Jo\u017ee Ple\u010dnik and completed in 1932. It is celebrated as one of the most significant Czech religious buildings of the 20th century, distinguished by its unique modernist style and clean lines. The church\u0027s facade features a massive circular window, housing a seven-meter-tall bronze statue of Jesus, symbolizing the Sacred Heart. Its bell tower rises 42 meters, topped by a huge transparent clock, one of the largest in Central Europe. The interior space is minimalist yet solemn, with light streaming through large windows, creating a serene atmosphere. The church\u0027s design draws inspiration from ancient Egyptian and early Christian architecture, blending classical and modern elements, making it a jewel in Prague\u0027s architectural history.", "name": "Church of the Most Sacred Heart of Our Lord (Kostel Nejsv\u011bt\u011bj\u0161\u00edho Srdce P\u00e1n\u011b)", "transport": "Metro Line A, Ji\u0159\u00edho z Pod\u011bbrad station, direct access upon exit; Tram lines 11, 13, Ji\u0159\u00edho z Pod\u011bbrad stop."}, {"address": "U Pam\u00e1tn\u00edku 1900, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.6 stars | Perched atop V\u00edtkov Hill in the \u017di\u017ekov district, this magnificent national monument was built to commemorate Czechoslovakia\u0027s independence and the heroic deeds of the Czech Legions. Constructed between 1929 and 1933, it is famous for its colossal equestrian statue of Jan \u017di\u017eka, a Hussite war hero, which is one of the largest bronze equestrian statues in the world. The monument\u0027s interior houses a museum, a Hall of Honor, and the tomb of the Czech presidents. From the monument\u0027s rooftop, visitors can enjoy breathtaking panoramic views of Prague, especially the Old Town and Prague Castle. It serves not only as a historical testament but also as an important cultural center, frequently hosting exhibitions and events that allow visitors to delve into the history and spirit of the Czech nation.", "name": "V\u00edtkov National Monument (N\u00e1rodn\u00ed pam\u00e1tn\u00edk na V\u00edtkov\u011b)", "transport": "Bus line 207, U Pam\u00e1tn\u00edku stop; Tram lines 1, 3, 5, 9, 15, 26, Husineck\u00e1 stop, approximately a 15-minute uphill walk."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru 1450/7, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Located in the heart of Prague\u0027s Vinohrady district, the Vinohrady Theatre is a magnificent Art Nouveau building completed in 1907. Designed by architect Alois Bal\u0161\u00e1nek, its opulent exterior and exquisite interior decorations make it one of Prague\u0027s most beautiful theaters. The facade is adorned with intricate sculptures and reliefs, while the interior boasts luxurious auditoriums, marble staircases, and delicate frescoes. Since its completion, it has been a crucial venue for Czech dramatic arts, staging countless classic plays and modern works. The theatre is not only a center for performing arts but also a stunning architectural masterpiece in itself, representing the cultural prosperity and architectural style of early 20th-century Prague.", "name": "Vinohrady Theatre (Vinohradsk\u00e9 divadlo)", "transport": "Metro Line A, N\u00e1m\u011bst\u00ed M\u00edru station, direct access upon exit; Tram lines 4, 10, 13, 16, 22, N\u00e1m\u011bst\u00ed M\u00edru stop."}, {"address": "Korunn\u00ed 1098/68, 101 00 Praha 10-Vinohrady, Czechia", "feature": "\u2b50 4.2 stars | This historic water tower in Prague\u0027s Vinohrady district, built in 1888, stands as an important testament to the development of Prague\u0027s urban infrastructure in the late 19th century. Designed in the Neo-Renaissance style, the tower rises 40 meters, its robust brickwork and elegant architectural details making it stand out in the surrounding residential area. It once served as a crucial facility for supplying drinking water to the Vinohrady district. Although no longer used for its original function, it is preserved as an important industrial heritage site and architectural landmark. The tower\u0027s design not only considered practicality but also incorporated aesthetic elements, demonstrating the importance engineers and architects of the time placed on urban aesthetics. It serves as a reminder of Prague\u0027s historical transformation during its modernization process.", "name": "Vinohrady Water Tower (Vinohradsk\u00e1 vod\u00e1rna)", "transport": "Tram lines 10, 16, Perunova stop, approximately a 5-minute walk; Metro Line A, Flora station, approximately a 10-minute walk."}, {"address": "Fibichova 16, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.0 stars | The Old Jewish Cemetery in \u017di\u017ekov is Prague\u0027s second oldest Jewish cemetery, with a history dating back to the 17th century. This tranquil burial ground was established after the plague outbreak in Prague in 1680, serving as an extension to the Old Town Jewish Cemetery. Within the cemetery are thousands of ancient tombstones, many tilted or covered by vegetation, creating a unique and solemn atmosphere. Many influential members of Prague\u0027s Jewish community, including renowned rabbis and scholars, are buried here. The cemetery\u0027s design and preservation reflect Judaism\u0027s unique concepts of death and remembrance. Although less widely known than the Old Town Jewish Cemetery, it offers an opportunity to delve deeper into Prague\u0027s Jewish history and culture, making it a lesser-known historical treasure within the city.", "name": "Old Jewish Cemetery \u017di\u017ekov (Star\u00fd \u017eidovsk\u00fd h\u0159bitov \u017di\u017ekov)", "transport": "Tram lines 9, 15, 26, Lipansk\u00e1 stop, approximately a 5-minute walk; Bus lines 133, 175, 207, Tachovsk\u00e9 n\u00e1m\u011bst\u00ed stop."}, {"address": "Kubel\u00edkova 1548/27, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.3 stars | Located in Prague\u0027s \u017di\u017ekov district, Akropolis Palace is a historic building originally constructed in 1927 as a multi-functional cultural center. This building is renowned for its distinctive Art Deco style, with both its exterior and interior designs imbued with the artistic spirit of that era. Historically, it served as a cinema, theater, and dance hall, witnessing Prague\u0027s cultural transformations. Today, Akropolis Palace has transformed into a vibrant modern cultural hub, known for its avant-garde concerts, theatrical performances, and art exhibitions. It is not only a cultural landmark of the \u017di\u017ekov district but also a significant component of Prague\u0027s independent art scene, attracting tourists and locals seeking alternative cultural experiences.", "name": "Akropolis Palace (Pal\u00e1c Akropolis)", "transport": "Tram lines 5, 9, 15, 26, Lipansk\u00e1 stop, approximately a 3-minute walk; Metro Line A, Ji\u0159\u00edho z Pod\u011bbrad station, approximately a 10-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Situated on Peace Square (N\u00e1m\u011bst\u00ed M\u00edru) in Prague\u0027s Vinohrady district, the Church of St. Ludmila is an impressive Neo-Gothic edifice completed in 1892. Designed by architect Josef Mocker, this church is renowned for its towering twin spires, exquisite rose window, and rich sculptural ornamentation. The interior is lavishly decorated, featuring delicate stained-glass windows, frescoes, and altars, creating a solemn and sacred atmosphere. It is one of Prague\u0027s most significant Gothic Revival buildings and a visual focal point of Peace Square. Annually during the Christmas season, the square in front of the church hosts a famous Christmas market, making it a beloved gathering place for locals and tourists alike. This church is not only a place of worship but also an outstanding representative of Prague\u0027s architectural art.", "name": "Church of St. Ludmila (Kostel svat\u00e9 Ludmily)", "transport": "Metro Line A, N\u00e1m\u011bst\u00ed M\u00edru station, direct access upon exit; Tram lines 4, 10, 13, 16, 22, N\u00e1m\u011bst\u00ed M\u00edru stop."}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Designed by Slovenian architect Jo\u017ee Ple\u010dnik, this church in Prague\u0027s Renaissance district is one of the most outstanding religious buildings of 20th-century Czechia. Its unique modernist style, a massive bell tower housing Europe\u0027s largest clock, and a simple yet solemn interior design make it a must-visit for architecture enthusiasts. The church\u0027s interior is brightly lit, and the altar is minimalist yet powerful, creating a serene atmosphere. It is not only a house of worship but also a paradigm of modern architectural art, hailed as one of Prague\u0027s most beautiful modern churches.", "name": "Church of the Most Sacred Heart of Our Lord", "transport": "Metro Line A, Ji\u0159\u00edho z Pod\u011bbrad station; Trams 10, 16, Ji\u0159\u00edho z Pod\u011bbrad station."}, {"address": "N\u00e1m\u011bst
