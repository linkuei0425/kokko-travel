          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Staroměstské náměstí 604, 110 00 Praha 1, Czechia"

      },

        "@type": "ListItem",

          "address": {
            "@type": "PostalAddress",

ity to enjoy peaceful greenery within a historic setting. It is usually combined with a visit to Lobkowicz Palace, allowing visitors to appreciate art while also experiencing the natural beauty of the Prague Castle District.", "name": "Lobkowicz Garden", "transport": "Walk from Prague Castle\u0027s Third Courtyard to Lobkowicz Palace."}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 3, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | The Ledeburg Garden is the largest and most magnificent of the Baroque terraced gardens below Prague Castle, part of the \u0027Terraced Gardens below Prague Castle\u0027. It is renowned for its spectacular tiered design, exquisite sculptures, fountains, and frescoes. The garden ascends in layers along the hillside, with each level offering different views and perspectives, ultimately leading to a grand pavilion from which you can overlook a magnificent panorama of the entire Lesser Town, Charles Bridge, and the Vltava River. Its design is imbued with the essence of Baroque art, making it a paradise for photographers and a romantic spot for couples to stroll. The garden is meticulously maintained, showcasing the pinnacle of 18th-century garden art.", "name": "Ledeburg Garden", "transport": "Take tram 22 to \u0027Malostransk\u00e1\u0027 stop, then walk for about 5 minutes."}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 14, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Small F\u00fcrstenberg Garden is another sparkling gem among the terraced gardens below Prague Castle, adjacent to the Ledeburg Garden. Although smaller in scale, this Baroque-style garden is no less exquisite in its design and the views it offers. The garden also features a terraced layout, with neatly trimmed hedges, sculptures, fountains, and an elegant pavilion. From different levels of the garden, visitors can enjoy captivating views of Prague Castle, St. Nicholas Church, and the Vltava River. It offers a more private a ame": "St. George\u0027s Basilica", "transport": "Located within the Prague Castle complex. Enter through the main castle entrance and follow the signs."}, {"address": "Ji\u0159sk\u00e1 3, 119 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.7 stars | Lobkowicz Palace is the only privately owned palace within Prague Castle, now open to the public as a museum. It not only houses centuries of precious artworks, musical instruments, and manuscripts from the Lobkowicz family but is also renowned for the magnificent panoramic views offered from its terrace. From the palace\u0027s cafe or terrace, you can overlook the entire Lesser Town of Prague, Charles Bridge, and the Vltava River, making it an excellent spot for capturing the city skyline and panoramic views of the castle district. Its elegant interior decor and rich historical collections also provide diverse material for photography.", "name": "Lobkowicz Palace", "transport": "Located within the Prague Castle complex. Enter through the eastern castle entrance and follow the signs."}, {"address": "Hrad\u010dany, 119 00 Praha 1, Czechia (Located on the south side of the castle)", "feature": "\u2b50 4.6 stars | The Southern Gardens of Prague Castle consist of several interconnected gardens, including the Garden of Paradise, the Ramparts Garden, and the Bastion Garden. They stretch along the southern slope of the castle, offering stunning panoramic views of the city. Here you\u0027ll find manicured lawns, fountains, sculptures, and observation decks, making it an ideal place to escape the hustle and bustle and enjoy tranquility. From different angles within the gardens, you can capture the side view of St. Vitus Cathedral, the red rooftops of the Lesser Town, and the distant Charles Bridge, making it a popular spot for classic Prague postcard photos. It is especially beautiful in spring and summer when the flowers are in full bloom.", "name": "Southern Gardens of Prague Castle", "transport": "Direct access from within the castle complex, or walk up the stairs near Malostransk\u00e1 Metro Station."}, {"address": "Hrad\u010dansk\u00e9 n\u00e1m., 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.5 stars | Castle Square is a spacious square in front of the main entrance of Prague Castle, surrounded by many magnificent historical buildings such as the Archbishop\u0027s Palace and the Schwarzenberg Palace. It is not only the essential path to enter the castle but also the best spot for photographing the castle\u0027s frontal panorama and the changing of the guard ceremony. The Marian Column in the center of the square and the surrounding Baroque buildings together form a magnificent tableau. Whether in the tranquility of the early morning or the bustling activity of the day, Castle Square offers diverse photographic angles to capture the majestic grandeur of Prague Castle and the exquisite details of the surrounding architecture.", "name": "Castle Square", "transport": "Take tram 22 to Pra\u017esk\u00fd hrad or Poho\u0159elec station. The square is a short walk from there."}, {"address": "Strahovsk\u00e9 n\u00e1dvo\u0159\u00ed 1/132, 118 00 Praha 1-Hrad\u010dany, Czechia", "feature": "\u2b50 4.9 stars | Strahov Monastery Library is renowned as one of the most beautiful libraries in the world. Its Philosophical Hall and Theological Hall are famous for their magnificent frescoes, exquisite wooden bookshelves, and hundreds of thousands of ancient books. Although entry to the interior of the library requires a fee and direct access to the bookshelves is usually not permitted, photographing its spectacular interior from the doorway is enough to leave one in awe. The ceiling frescoes in the Philosophical Hall depict the development of human knowledge, while the Theological Hall is filled with Baroque religious art. This is a perfect example of the harmonious blend of scholarly atmosphere and art, a dream destination for all book lovers and photographers.", "name": "Strahov Monastery Library", "transport": "Take tram 22 or 23 to Poho\u0159elec station, then walk for about 5 minutes."}], "name": "Popular Photo Spots"}}, "name": "\u57ce\u5821\u5340 (Hrad\u010dany)"}, "jewish_quarter": {"categories": {"cat_1": {"items": [{"address": "\u0160irok\u00e1 3, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Prague\u0027s Old Jewish Cemetery is one of Europe\u0027s oldest and most unique Jewish burial grounds, with a history dating back to the 15th century. Due to limited space, gravestones are layered up to 12 deep, with an estimated over 100,000 people buried here. The tombstones vary in shape, many bearing symbolic motifs, reflecting centuries of resilience and culture within the Jewish community. It is not only a testament to history but also a place filled with mystery and solemnity, attracting countless visitors to experience its unique historical depth.", "name": "Old Jewish Cemetery", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "\u010cerven\u00e1 2, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Old-New Synagogue is the oldest active synagogue in Europe and a central landmark of Prague\u0027s Jewish Quarter. Built in the late 13th century, it is renowned for its early Gothic architectural style and has served as the religious heart of Prague\u0027s Jewish community for centuries. Legend has it that the remains of the Golem of Prague are hidden in its attic, adding to its mystique. Still in active use today, this synagogue is a living testament to Jewish faith and history, with an interior that is simple yet solemn, imbued with a profound sense of history.", "name": "Old-New Synagogue / Staronov\u00e1 synagoga", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "\u0160irok\u00e1 3, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Pinkas Synagogue, built in the 16th century, is now renowned as a memorial to the Czech Jewish victims of World War II. Its walls are densely inscribed with the handwritten names of nearly 80,000 Czech and Moravian Jews who perished in the Holocaust, each name representing a lost life, creating a deeply moving experience. The upper floor displays drawings by children from the Terez\u00edn concentration camp, works that record the tragic life in the camp from an innocent perspective, serving as incredibly precious and poignant historical testimonies.", "name": "Pinkas Synagogue / Pinkasova synagoga", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "V\u011bze\u0148sk\u00e1 1, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | The Spanish Synagogue is one of the most magnificent synagogues in Prague\u0027s Jewish Quarter, renowned for its unique Moorish Revival architectural style and exquisite interior decoration. The synagogue\u0027s interior is filled with gilding, stained glass, and geometric patterns, showcasing breathtaking artistic beauty. Built in the late 19th century, replacing an older synagogue, it now primarily serves as a museum and concert venue, presenting the history and culture of Czech Jews, particularly attracting countless visitors with its spectacular interior.", "name": "Spanish Synagogue / \u0160pan\u011blsk\u00e1 synagoga", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 7 minutes walk; Trams 17, 18, Pr\u00e1vnick\u00e1 fakulta station, approx. 3 minutes walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Klausen Synagogue is the largest synagogue in Prague\u0027s Jewish Quarter, built in the late 17th century in an early Baroque style. It once served as the religious center of the Jewish community and the seat of the Jewish Brotherhood. Today, the synagogue houses a permanent exhibition of the Jewish Museum, focusing on Jewish traditions and customs, including Jewish holidays, life cycle rituals, and Jewish doctrine. Its spacious interior and rich exhibits offer visitors an opportunity to delve deep into Jewish culture and history.", "name": "Klausen Synagogue / Klausov\u00e1 synagoga", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "Maiselova 10, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.2 stars | The Maisel Synagogue was originally built in the late 16th century by Mordecai Maisel, a leader of the Prague Jewish community, in a Renaissance style. Despite undergoing fires and reconstructions, the current synagogue exhibits a Neo-Gothic style. It is now part of the Jewish Museum, showcasing the history of Czech Jews from the 10th to the 18th century, including precious artifacts, manuscripts, and artworks. The synagogue\u0027s exhibition is presented through interactive multimedia, allowing visitors to vividly experience the rich history of the Jewish community.", "name": "Maisel Synagogue / Maiselova synagoga", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "Maiselova 18, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Jewish Town Hall is the administrative center of Prague\u0027s Jewish Quarter, built in the 16th century and reconstructed in Baroque style in the 18th century. It is famous for its unique double-faced clock tower: one with traditional Roman numerals, and the other with Hebrew numerals, whose hands turn counter-clockwise, symbolizing the reading direction of Hebrew. This building is not only the political and cultural hub of the Jewish community but also a symbol of its autonomy, and it continues to serve as the headquarters of the Prague Jewish community today.", "name": "Jewish Town Hall / \u017didovsk\u00e1 radnice", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, Josefov, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Ceremonial Hall, located next to the Old Jewish Cemetery, was built in the early 20th century in a Neo-Renaissance style and once served as the headquarters of the Jewish Burial Society (Chevra Kadisha). It is now part of the Jewish Museum, showcasing Jewish burial customs and traditions, as well as the history of the Prague Jewish community. Through artifacts, photographs, and texts, the exhibition details the unique Jewish understanding of death, mourning, and remembrance, offering visitors an opportunity to learn about an important aspect of the Jewish life cycle.", "name": "Ceremonial Hall / Ob\u0159adn\u00ed s\u00ed\u0148", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk; Trams 17, 18, Starom\u011bstsk\u00e1 station, approx. 5 minutes walk."}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "\u010cerven\u00e1 2, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Old-New Synagogue is Europe\u0027s oldest active synagogue, with a history dating back to the late 13th century. This Gothic building is renowned for its unique double-nave design and ancient legends, including the tale that the Golem of Prague is hidden in its attic. It stands as a central symbol of Prague\u0027s Jewish Quarter, witnessing centuries of the Jewish community\u0027s rise, fall, and resilience. The synagogue\u0027s interior is solemn and dignified, with simple stone walls and soaring arches creating a sacred atmosphere. It is an important place of worship for Jews and a must-visit for tourists seeking to understand Jewish history and faith. Its architecture is a work of art in itself, blending medieval craftsmanship with the essence of Jewish culture, making it one of the most revered landmarks in Prague\u0027s Jewish Quarter.", "name": "Old-New Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 5-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 5-minute walk."}, {"address": "V\u011bze\u0148sk\u00e1 1, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | The Spanish Synagogue is the most opulent synagogue in Prague\u0027s Jewish Quarter, with its stunning Moorish Revival architectural style. The interior is lavishly decorated with dazzling golden geometric patterns, exquisite stucco carvings, and stained-glass windows, creating an atmosphere reminiscent of an oriental palace. Built in the late 19th century, this synagogue symbolizes the wealth and artistic taste of the Jewish community. Beyond its breathtaking architectural beauty, the Spanish Synagogue also houses a permanent exhibition on the history of Jews in Bohemia from the 18th century to the present day, showcasing the community\u0027s development and contributions in modern society. It is not only a place of worship but also a museum displaying Jewish art and history, making it one of Prague\u0027s most popular attractions.", "name": "Spanish Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 7-minute walk; or take tram 17 or 18 to Pr\u00e1vnick\u00e1 fakulta station, then a 3-minute walk."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Pinkas Synagogue is a deeply moving memorial in Prague\u0027s Jewish Quarter, now serving as a memorial to Holocaust victims. Its walls are densely inscribed with the handwritten names, birth dates, and death dates of nearly 80,000 Bohemian and Moravian Jews murdered by the Nazis during World War II, each entry bearing the weight of a lost life, inspiring profound reverence. The synagogue\u0027s second floor displays drawings by children from the Terez\u00edn concentration camp; these works, full of childlike innocence yet tinged with sadness, silently narrate that dark period of history. The Pinkas Synagogue is not merely a synagogue but a living historical testament, reminding people not to forget history and to cherish peace. It is an essential part of the Jewish Museum in Prague, attracting countless visitors annually for remembrance and reflection.", "name": "Pinkas Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 6-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 6-minute walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Klausen Synagogue is the largest and only Baroque-style synagogue in Prague\u0027s Jewish Quarter. Built in the late 17th century, it replaced several smaller synagogues destroyed in the great fire of 1689. Today, the Klausen Synagogue, as part of the Jewish Museum in Prague, houses a permanent exhibition on Jewish traditions and customs. Visitors can delve into Jewish daily life, holiday celebrations, life cycle rituals (such as circumcision, bar/bat mitzvah, weddings, and funerals), and Jewish law and scriptures. The synagogue\u0027s interior is beautifully decorated, with tall arches and an ornate Ark of the Covenant showcasing the charm of Baroque art. It is an excellent place to understand Jewish culture and religious practices, and an unmissable cultural attraction within Prague\u0027s Jewish Quarter.", "name": "Klausen Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 7-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 7-minute walk."}, {"address": "Maiselova 10, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Maisel Synagogue was originally built by Mordecai Maisel, mayor of the Jewish Quarter, in the late 16th century, and was once the most magnificent Renaissance-style building in Prague\u0027s Jewish Quarter. Despite undergoing multiple fires and reconstructions, the current Maisel Synagogue exhibits a Neo-Gothic style and, as part of the Jewish Museum in Prague, hosts exhibitions on the history of Jews in Bohemia and Moravia. The exhibition utilizes modern technology, such as interactive touchscreens and projections, to vividly narrate the development of the Jewish community from the 10th to the late 18th century, including their cultural, social, and political life. The synagogue also houses many precious Jewish artifacts and artworks, making it an excellent starting point for understanding the rich history of Prague\u0027s Jewish Quarter.", "name": "Maisel Synagogue", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 5-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 5-minute walk."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | The Old Jewish Cemetery is one of Europe\u0027s oldest and most unique Jewish cemeteries, with a history dating back to the 15th century. Due to the restriction of Jews to the confined Jewish Quarter and the inability to expand the cemetery, gravestones are layered upon layers, up to 12 deep, with an estimated over 100,000 people buried here. The densely packed, uneven gravestones create a mysterious and solemn landscape, seemingly narrating centuries of tumultuous history. Many famous Jewish scholars and rabbis are buried here, including the legendary Rabbi Loew and Mordecai Maisel. The cemetery is part of the Jewish Museum in Prague, an important place for understanding Jewish life, faith, and history, and an outdoor museum rich in historical significance and artistic atmosphere.", "name": "Old Jewish Cemetery", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 6-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 6-minute walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Jewish Ceremonial Hall once served as the headquarters of the Prague Jewish Burial Society, built in the early 20th century in Neo-Romanesque style. This building now functions as part of the Jewish Museum in Prague, dedicated to showcasing Jewish burial customs, rituals, and the history of the Jewish Burial Society. Through artifacts, photographs, and textual introductions, the exhibition elaborates on Jewish perspectives on death, purification rituals, funeral processes, and ways of commemorating the deceased. It offers a unique perspective for visitors to understand the profound philosophy and traditions surrounding the end of life in Jewish culture. The architecture of the Ceremonial Hall itself is also worth seeing; its distinctive style complements the surrounding Jewish Quarter buildings, making it an important component for exploring the depth of Jewish culture.", "name": "Jewish Ceremonial Hall", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 7-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 7-minute walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3a, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | The Robert Guttmann Gallery is a modern art gallery under the Jewish Museum in Prague, named after the Czech Jewish painter Robert Guttmann. Located in the heart of the Jewish Quarter, the gallery regularly hosts various temporary exhibitions covering Jewish art, history, culture, and works by contemporary artists. These exhibitions often delve into different facets of Jewish culture, from historical events to contemporary issues, offering visitors a unique opportunity to understand the development of Jewish art and culture. The gallery\u0027s exhibition themes are diverse, ranging from reinterpretations of traditional Jewish art to artistic reflections on contemporary social phenomena, making it an unmissable art space for art lovers and cultural explorers within the Jewish Quarter.", "name": "Robert Guttmann Gallery", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then a 7-minute walk; or take tram 17 or 18 to Starom\u011bstsk\u00e1 station, then a 7-minute walk."}], "name": "Art and Cultural Museums and Synagogues"}, "cat_3": {"items": [{"address": "\u0160irok\u00e1 3, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.7 stars | The most unique and historic outdoor space in Prague\u0027s Jewish Quarter, this cemetery is famous for its densely packed, layered tombstones. For centuries, due to limited space, graves were continually stacked, creating a unique landscape up to 12 layers high. Ancient trees and vines grow freely among the gravestones, creating an atmosphere that is both solemn and naturally wild. It is one of Europe\u0027s oldest and best-preserved Jewish cemeteries. Walking through it feels like stepping back in time, experiencing the weight of history and the cycle of life. It\u0027s a rare place of tranquility and reflection in the city.", "name": "Old Jewish Cemetery", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5-minute walk; Tram lines 17, 18, Starom\u011bstsk\u00e1 station, approx. 5-minute walk."}, {"address": "Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.5 stars | An elegant embankment stretching along the Vltava River, Dvo\u0159\u00e1k Embankment is a picturesque promenade at the border of Prague\u0027s Jewish Quarter and Old Town. Shaded by lush trees, it offers excellent views of Prague Castle, Charles Bridge, and boats on the river. The fresh river breeze makes it an ideal place to escape the city\u0027s hustle and bustle and enjoy nature. Whether for a morning jog, an evening stroll, or simply sitting on a bench to admire the river and mountain scenery, one can feel Prague\u0027s unique romance and tranquility.", "name": "Dvo\u0159\u00e1k Embankment (Dvo\u0159\u00e1kovo n\u00e1b\u0159e\u017e\u00ed)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 7-minute walk; Tram lines 17, 18, Pr\u00e1vnick\u00e1 fakulta station, approx. 2-minute walk."}, {"address": "Pa\u0159\u00ed\u017esk\u00e1, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.6 stars | Hailed as Prague\u0027s most luxurious street, Pa\u0159\u00ed\u017esk\u00e1 Street is not only a hub for high-end boutiques but also boasts tall, lush trees lining its sides, adding a unique natural charm to this avenue. The street\u0027s design is inspired by Parisian boulevards, with wide sidewalks and neatly arranged trees creating an open and elegant sense of space. Strolling along, even without shopping, one can enjoy the visual pleasure and comfortable atmosphere provided by this \u0027urban green corridor,\u0027 experiencing the perfect blend of Prague\u0027s Art Nouveau architecture and natural elements.", "name": "Paris Street (Pa\u0159\u00ed\u017esk\u00e1 ulice)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 3-minute walk; Tram lines 17, 18, Starom\u011bstsk\u00e1 station, approx. 3-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Jana Palacha, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.4 stars | Located on the edge of the Jewish Quarter, right next to the Vltava River, Jan Palach Square is a spacious and important public area. The square features green spaces and trees in its center, surrounded by significant buildings such as the Rudolfinum and the Faculty of Arts of Charles University. It is not only a center for cultural activities but also offers an open vista with distant views of Prague Castle and the river. It\u0027s a place in the city that combines historical significance with natural beauty, offering respite. The trees and open space in the square provide visitors with an opportunity to relax and feel the city\u0027s pulse.", "name": "Jan Palach Square (N\u00e1m\u011bst\u00ed Jana Palacha)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5-minute walk; Tram lines 17, 18, Starom\u011bstsk\u00e1 station, approx. 5-minute walk."}, {"address": "N\u00e1m\u011bst\u00ed Franze Kafky, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.0 stars | Located deep within the Jewish Quarter, near the Jewish Town Hall and the Old New Synagogue, Franz Kafka Square is a relatively small and more secluded square. It features a few trees and benches, offering a quiet resting space away from the hustle and bustle of main thoroughfares. Named after Prague\u0027s most famous writer, Kafka, this square, though modest in size, carries a rich historical and cultural atmosphere, making it an ideal spot to experience the daily ambiance of the Jewish Quarter and enjoy a moment of tranquility.", "name": "Franz Kafka Square (N\u00e1m\u011bst\u00ed Franze Kafky)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 8-minute walk; Tram lines 17, 18, Starom\u011bstsk\u00e1 station, approx. 8-minute walk."}, {"address": "\u010cech\u016fv most, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.3 stars | \u010cech\u016fv Bridge is an important bridge connecting the Jewish Quarter with Lesser Town. From the bridge, one can enjoy the most magnificent natural scenery of the Vltava River. Standing in the middle of the bridge, to the west, you can see a grand panoramic view of Prague Castle, and to the east, the Rudolfinum and the architectural complex of the Jewish Quarter. The river flows beneath your feet, with lush trees and historic buildings on both banks reflecting each other, making it an excellent spot for capturing city panoramas and feeling the vitality of the river. In the early morning or evening, with soft light, the scenery is particularly enchanting, making it a must-visit spot to experience the natural beauty of Prague\u0027s riverside.", "name": "Vltava River Views from \u010cech\u016fv Bridge", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 10-minute walk; Tram lines 17, 18, Pr\u00e1vnick\u00e1 fakulta station, approx. 3-minute walk."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.1 stars | The Jewish Museum complex in the Jewish Quarter comprises multiple synagogues and buildings, often featuring small, tranquil courtyards or green spaces between or within them. For example, these hidden green spaces can be found between the Pinkas Synagogue and the Old Jewish Cemetery, or near the Klausen Synagogue. These courtyards are typically planted with trees and flowers, offering a place for quiet contemplation away from the crowds, providing a unique experience of natural greenery amidst the historical atmosphere of the Jewish Quarter. Though small, they are peaceful oases in the city\u0027s hustle and bustle.", "name": "Courtyard of the Jewish Museum Complex", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 5-minute walk; Tram lines 17, 18, Starom\u011bstsk\u00e1 station, approx. 5-minute walk."}, {"address": "V\u011bze\u0148sk\u00e1 1, 110 00 Praha 1-Star\u00e9 M\u011bsto, Czechia", "feature": "\u2b50 4.2 stars | Located next to the magnificent Spanish Synagogue, this small yet exquisite green space adds a touch of life to the surrounding historic buildings. It features several benches and well-maintained trees and shrubs, making it an ideal spot for visitors to rest after touring the synagogue or while strolling through the Jewish Quarter, enjoying a moment of tranquility. Although not a large park, its presence provides a visual buffer and natural accent to the dense urban landscape, allowing people to find a touch of natural solace amidst history and culture.", "name": "Green Space near the Spanish Synagogue", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, approx. 8-minute walk; Tram lines 17, 18, Pr\u00e1vnick\u00e1 fakulta station, approx. 5-minute walk."}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | One of the most unique and unforgettable attractions in Prague\u0027s Jewish Quarter, with over 12,000 gravestones stacked layer upon layer, bearing witness to centuries of history and resilience of the Jewish community. The gravestones are densely packed, some stacked up to 12 layers high, creating a surreal and solemn atmosphere. It\u0027s an excellent spot for photography enthusiasts to capture the sense of historical vicissitude. Strolling through, one can almost hear the whispers of time and feel the profound weight of history.", "name": "\u8001\u7336\u592a\u516c\u5893 (Old Jewish Cemetery)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "V\u011bze\u0148sk\u00e1 1, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Renowned as one of Europe\u0027s most beautiful synagogues, its Moorish Revival architectural style is breathtaking. The interior decoration is exceptionally lavish, with resplendent geometric patterns, exquisite carvings, and stained-glass windows, all showcasing masterful craftsmanship. Sunlight streaming through the stained glass bathes the entire space in a mysterious and sacred glow, making it a must-visit photo spot for photographers and art lovers. Classical music concerts are also frequently held here, offering visitors an ultimate visual and auditory experience.", "name": "\u897f\u73ed\u7259\u7336\u592a\u6703\u5802 (Spanish Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 7 minutes."}, {"address": "\u010cerven\u00e1 2, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | This is the oldest synagogue in Europe still in use, built in the late 13th century, imbued with legendary tales and a mysterious atmosphere. Its Gothic architectural style is simple yet solemn, and while the interior space isn\u0027t opulent, it\u0027s rich with historical depth. Legend has it that Prague\u0027s Golem is hidden here, adding a touch of mystique. As a central landmark of the Jewish Quarter, it is not only a house of worship but also a witness to history, a must-visit to experience the profound heritage of Prague\u0027s Jewish community.", "name": "\u8001\u65b0\u7336\u592a\u6703\u5802 (Old-New Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "\u0160irok\u00e1 3, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.4 stars | This synagogue now serves as a memorial to the Czech Jewish victims of World War II, with the names, birth dates, and death dates of nearly 80,000 victims meticulously handwritten on its walls, creating an incredibly moving scene. It is not only a historical site but also a place for profound reflection on war and humanity. The synagogue also exhibits children\u0027s drawings from the Terez\u00edn concentration camp, which, from an innocent perspective, record those dark years, making them deeply touching.", "name": "\u5e73\u5361\u65af\u7336\u592a\u6703\u5802 (Pinkas Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "Maiselova 10, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Built by Mordecai Maisel, Mayor of the Jewish Quarter, in the late 16th century, it was originally in Renaissance style and later rebuilt multiple times, now exhibiting a Neo-Gothic style. Today, as part of the Jewish Museum, it displays a rich collection of Jewish historical artifacts, religious ceremonial objects, and silver, narrating the development of Prague\u0027s Jewish community. Its spacious interior and beautifully arranged exhibits make it an excellent place to delve into Jewish culture and history.", "name": "\u9081\u585e\u723e\u7336\u592a\u6703\u5802 (Maisel Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 6 minutes."}, {"address": "U Star\u00e9ho h\u0159bitova 3A, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.3 stars | This is the largest synagogue in Prague\u0027s Jewish Quarter, built in the late 17th century, renowned for its Baroque interior decoration. The synagogue houses a vast collection of exhibits on Jewish traditions, customs, and festivals, including Jewish weddings, circumcision ceremonies, Shabbat, and Passover, vividly portraying Jewish daily life and faith. Its exquisite ceiling frescoes and wood carvings also make it an art space worth savoring.", "name": "\u514b\u52de\u68ee\u7336\u592a\u6703\u5802 (Klausen Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 5 minutes."}, {"address": "Du\u0161n\u00ed, 110 00 Josefov, Praha 1, Czechia (near Spanish Synagogue)", "feature": "\u2b50 4.5 stars | This unique sculpture, located near the Spanish Synagogue, was created by artist Jaroslav R\u00f3na in 2003 to commemorate Franz Kafka, Prague\u0027s most famous literary giant. The sculpture depicts Kafka riding on the shoulders of a headless man in a suit, full of surrealism and symbolism, perfectly embodying the absurdity and loneliness found in Kafka\u0027s works. It is a popular photo spot for literature enthusiasts and art photographers, prompting deep thought.", "name": "\u6cd5\u862d\u8332\u00b7\u5361\u592b\u5361\u7d00\u5ff5\u7891 (Franz Kafka Monument)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 7 minutes."}, {"address": "Maiselova 18, 110 00 Josefov, Praha 1, Czechia", "feature": "\u2b50 4.2 stars | The Jewish Town Hall is the administrative center of the Jewish Quarter, its most prominent feature being a tower with two clocks at the top, one of which has hands that move counter-clockwise, displaying Hebrew time, making it highly distinctive. The High Synagogue, located next to the Town Hall, was built in the 16th century and is known for its soaring arched ceiling and rich interior decoration, having once served as a private synagogue for Town Hall councilors. These two buildings together form an iconic landmark of the Jewish Quarter, crucial for understanding the history of the Jewish community\u0027s self-governance.", "name": "\u7336\u592a\u5e02\u653f\u5ef3\u8207\u9ad8\u7336\u592a\u6703\u5802 (Jewish Town Hall \u0026 High Synagogue)", "transport": "Take Metro Line A to Starom\u011bstsk\u00e1 station, then walk for about 6 minutes."}], "name": "Popular Photo Spots"}}, "name": "\u7336\u592a\u5340 (Josefov)"}, "lesser_town": {"categories": {"cat_1": {"items": [{"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | One of Prague\u0027s most iconic landmarks, spanning the Vltava River and connecting the Lesser Town with the Old Town. This medieval stone bridge, commissioned by Charles IV, began construction in 1357 and took centuries to complete. It is adorned with 30 exquisite Baroque statues, the most famous being that of St. John of Nepomuk. A stroll across the bridge offers not only magnificent views of both riverbanks but also a unique atmosphere created by street artists, painters, and souvenir vendors. Early mornings or evenings, when the crowds are thinner, are the best times to capture Prague\u0027s enchanting scenery. This bridge is not just a thoroughfare but a living historical museum, witnessing centuries of Prague\u0027s rise and fall.", "name": "Charles Bridge (Karl\u016fv most)", "transport": "Metro Line A, Starom\u011bstsk\u00e1 station, about a 5-minute walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 5-10 minute walk."}, {"address": "Malostransk\u00e9 n\u00e1m., 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Hailed as one of Prague\u0027s most magnificent Baroque buildings, located in the heart of Lesser Town Square. This church was designed by the renowned architects Christoph Dientzenhofer and his son Kilian Ignaz Dientzenhofer, completed in the mid-18th century. Its massive green dome and bell tower are prominent features of the Lesser Town skyline. The interior is lavishly decorated with astonishing frescoes, sculptures, and murals, especially the vast and awe-inspiring \u0027Apotheosis of St. Nicholas\u0027 fresco on the dome. Mozart once played the organ here, and its acoustics are still praised as world-class. The church is not only a place of worship but also a masterpiece of Baroque art, showcasing the artistic pinnacle of Bohemia at the time.", "name": "St. Nicholas Church (Chr\u00e1m svat\u00e9ho Mikul\u00e1\u0161e)", "transport": "Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station; the church is located in the center of the square."}, {"address": "Letensk\u00e1 123/4, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.6 stars | Located next to Wallenstein Palace, this is one of Prague\u0027s most beautiful and well-preserved Baroque gardens. Built in the 17th century by Duke Albrecht von Wallenstein, it was designed to rival the Royal Garden of Prague Castle. The garden features intricate geometric flowerbeds, meticulously trimmed hedges, fountains, an artificial grotto, and a grand drip wall. The central Hercules Fountain and a series of bronze sculpture replicas (originals are in Sweden) are particularly striking. Concerts and cultural events are often held here in the summer. A stroll through the garden feels like a journey back to the Renaissance and Baroque eras, offering a glimpse into aristocratic luxury and artistic taste.", "name": "Wallenstein Garden (Vald\u0161tejnsk\u00e1 zahrada)", "transport": "Metro Line A, Malostransk\u00e1 station, about a 2-minute walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e1 station."}, {"address": "Mosteck\u00e1 279/1, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.5 stars | One of the two bridge towers at the Lesser Town end of Charles Bridge, serving as an iconic gateway to the Lesser Town. The taller tower is a Gothic structure built in the 15th century, adorned with statues of Charles IV and Wenceslas IV, as well as the Bohemian coat of arms. Visitors can climb to the top for panoramic views of Charles Bridge, the Vltava River, the Lesser Town, and Prague Castle in the distance \u2013 an excellent spot for capturing Prague\u0027s skyline. The shorter, Romanesque bridge tower is even older, dating back to the 12th century. The two towers are connected by an archway, together forming a unique historical landmark of Prague.", "name": "Lesser Town Bridge Tower (Malostransk\u00e1 mosteck\u00e1 v\u011b\u017e)", "transport": "Located at the Lesser Town end of Charles Bridge. Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 5-minute walk."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.3 stars | Located near Kampa Island in the Lesser Town, this graffiti wall originally served as a canvas for young people to express their dissatisfaction and desire for peace during the communist era in the 1980s. After John Lennon\u0027s assassination, his portrait, Beatles lyrics, and anti-war slogans began appearing on the wall, transforming it into a symbol of freedom, peace, and love. Despite authorities repeatedly painting over it, the graffiti always reappeared. Today, it\u0027s a constantly evolving artwork, attracting visitors from around the world who leave their own marks and messages. This wall is not just an artistic display but also a testament to a unique period in Prague\u0027s history, representing the younger generation\u0027s yearning for freedom and democracy.", "name": "Lennon Wall (Lennonova ze\u010f)", "transport": "Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 5-7 minute walk."}, {"address": "Kampa, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.5 stars | Surrounded by the Vltava River and its tributary, the Devil\u0027s Stream (\u010certovka), Kampa Island is often called \u0027Prague\u0027s Venice.\u0027 This charming island boasts picturesque canals, ancient mills (including the famous \u0027Grand Prior\u0027s Mill\u0027 water wheel), lush parks, and historic buildings. The island also houses the Kampa Museum, showcasing Central European modern art. Stroll along its cobblestone paths, admire the colorful riverside houses and tranquil waterways, and experience a relaxed atmosphere distinctly different from Prague\u0027s city center. Kampa Island is not only a great place to unwind but its unique geographical location and historical background also make it an indispensable part of the Lesser Town.", "name": "Kampa Island (Kampa)", "transport": "Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 5-10 minute walk to reach it."}, {"address": "Josefsk\u00e1 8/1, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.4 stars | Located in the heart of the Lesser Town, this is a historic Augustinian monastery church with a history dating back to the 13th century. Although originally Gothic, it has been rebuilt multiple times and now showcases a magnificent Baroque style. The church\u0027s interior is exquisitely decorated, featuring Karel \u0160kr\u00e9ta\u0027s famous painting \u0027The Martyrdom of St. Thomas\u0027 and a replica of Peter Paul Rubens\u0027 \u0027The Martyrdom of St. Augustine.\u0027 Its elaborate altars and rich artworks make it a must-visit for Baroque art enthusiasts. The church\u0027s serene atmosphere, contrasting with its grand architecture, offers a space for contemplation and art appreciation.", "name": "St. Thomas Church (Kostel svat\u00e9ho Tom\u00e1\u0161e)", "transport": "Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 3-5 minute walk."}, {"address": "Karmelitsk\u00e1 373/25, 118 00 Mal\u00e1 Strana, Czechia", "feature": "\u2b50 4.7 stars | Hailed as one of Prague\u0027s most beautiful Baroque gardens, nestled in the heart of the Lesser Town, hidden behind a palace. This terraced garden, built in the early 18th century and designed by the renowned architect Franti\u0161ek Maxmili\u00e1n Ka\u0148ka, is famous for its exquisite Baroque sculptures, frescoes, and unique geometric layout. The garden is divided into three levels, each offering different views and perspectives. From the highest point, you can overlook the red rooftops of the Lesser Town, the dome of St. Nicholas Church, and Prague Castle in the distance \u2013 a truly breathtaking panorama. The garden also features an ornate pavilion and an artificial grotto, serving as a perfect example of art and nature in harmony.", "name": "Vrtba Garden (Vrtbovsk\u00e1 zahrada)", "transport": "Take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, about a 3-minute walk."}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | St. Nicholas Church in Prague\u0027s Lesser Town is a masterpiece of European Baroque architecture, built over several decades by three generations of the renowned Dientzenhofer family of architects. Its magnificent green dome and bell tower are iconic elements of the Prague skyline. The church\u0027s interior is lavishly decorated, boasting stunning frescoes, sculptures, and murals, notably Karel \u0160kr\u00e9ta\u0027s \u0027Miracle of St. Nicholas\u0027 and Johann Lucas Kracker\u0027s \u0027Glory of St. Nicholas\u0027. The church\u0027s organ was once played by Mozart and is still used for concerts today. This church is not merely a place of worship but a sanctuary of Baroque art and architecture, where its exquisite details and solemn atmosphere allow every visitor to feel the weight of history and the splendor of art.", "name": "St. Nicholas Church (Mal\u00e1 Strana)", "transport": "Tram lines 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop; Metro Line A to Malostransk\u00e1 station, then approximately a 5-7 minute walk."}, {"address": "Karmelitsk\u00e1 9, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | The Church of Our Lady Victorious is an important Baroque church in Prague\u0027s Lesser Town, renowned for housing the globally famous \u0027Infant Jesus of Prague\u0027 statue. This small wax figure is believed to possess miraculous powers, attracting pilgrims from all over the world. The Infant Jesus statue owns dozens of exquisite outfits, which are changed according to holidays and seasons, with the garments themselves being works of art. The church\u0027s interior is lavishly decorated, with altars and frescoes showcasing a superb Baroque art style. Beyond its religious significance, it\u0027s an excellent place to experience Czech Catholic culture and artistic ambiance. The church also features an Infant Jesus Museum, displaying outfits and offerings from around the world, narrating its rich history and legendary stories.", "name": "Church of Our Lady Victorious and the Infant Jesus of Prague", "transport": "Tram lines 12, 15, 20, 22, 23 to Hellichova stop, then approximately a 2-minute walk."}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 4, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Wallenstein Palace is one of the most magnificent Baroque palaces in Prague\u0027s Lesser Town, once the residence of Duke Albrecht von Wallenstein, a hero of the Thirty Years\u0027 War. The palace itself is a prime example of early Baroque architecture, with luxurious interiors, and now houses the Czech Senate, with some areas open to the public. However, its most captivating part is the expansive and exquisite Wallenstein Garden. This Italian-style geometric garden is filled with sculptures, fountains, artificial grottoes, and a massive drip wall (Grotto) adorned with stalactite-like decorations. The Sala Terrena in the center of the garden is an open hall with beautiful frescoes, often hosting concerts and cultural events. Strolling through it feels like being in an open-air art museum, experiencing the luxury and artistic ambiance of the Baroque era.", "name": "Wallenstein Palace and Garden", "transport": "Metro Line A to Malostransk\u00e1 station, then approximately a 2-minute walk; Tram lines 12, 15, 20, 22, 23 to Malostransk\u00e1 stop."}, {"address": "Letensk\u00e1 10, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.4 stars | St. Thomas Church is another historic Baroque church in Prague\u0027s Lesser Town, originally built in the 13th century and later rebuilt in its current Baroque style in the 18th century by the renowned architect Kilian Ignaz Dientzenhofer. The church\u0027s interior is richly decorated, featuring impressive altarpieces, most notably Rubens\u0027 \u0027Martyrdom of St. Thomas\u0027 and \u0027St. Augustine\u0027, created for the Augustinian monastery. The church\u0027s dome and ceiling frescoes also hold immense artistic value, showcasing the essence of Baroque art. The atmosphere here is relatively peaceful, making it an ideal place to escape the hustle and bustle and immerse oneself in art and history. The church also houses a monastery, with a history dating back to the Middle Ages, adding further layers of cultural depth to this edifice.", "name": "St. Thomas Church", "transport": "Metro Line A to Malostransk\u00e1 station, then approximately a 5-minute walk; Tram lines 12, 15, 20, 22, 23 to Malostransk\u00e1 stop."}, {"address": "Ji\u0159sk\u00e1 3, 119 00 Praha 1, Czechia (within Prague Castle complex)", "feature": "\u2b50 4.5 stars | Lobkowicz Palace, located within the Prague Castle complex but accessible from the Lesser Town side, is the only privately owned building within Prague Castle. It houses a precious collection of art and historical artifacts accumulated by the Lobkowicz family over eight centuries, including original scores by Beethoven and Mozart, paintings by masters such as Canaletto and Vel\u00e1zquez, exquisite decorative arts, military artifacts, and royal portraits. The palace\u0027s interior is lavishly decorated, with each exhibition hall narrating the family\u0027s history and European cultural changes. Visitors can delve into the stories behind these collections through an audio guide and enjoy magnificent views of Prague from the palace\u0027s caf\u00e9. This palace is not just a museum but a window into Czech noble life and European art history.", "name": "Lobkowicz Palace", "transport": "Metro Line A to Malostransk\u00e1 station, then approximately a 15-minute uphill walk; Tram line 22 to Poho\u0159elec stop, then approximately a 10-minute downhill walk."}, {"address": "U Sovov\u00fdch ml\u00fdn\u016f 2, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Museum Kampa is located on Kampa Island by the Vltava River, a museum dedicated to Central European modern art. It houses significant works by Franti\u0161ek Kupka, a pioneer of Czech abstract art, and Otto Gutfreund, a Czech Cubist sculptor, as well as works by artists from the Czech Republic, Poland, Hungary, and former Yugoslavia. The museum building itself is a converted historic mill, with its modern design creating an interesting contrast with the surrounding natural environment and historical architecture. The lawn outside the museum also displays many large sculptures, including the famous \u0027Giant Babies\u0027 sculptures, offering visitors a unique artistic experience. This is not only a paradise for art lovers but also an excellent place to experience Prague\u0027s modern art scene.", "name": "Museum Kampa", "transport": "Tram lines 12, 15, 20, 22, 23 to Hellichova stop, then approximately a 5-minute walk."}, {"address": "Karmelitsk\u00e1 25, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Vrtba Garden is one of the most beautiful and best-preserved Baroque gardens in Prague\u0027s Lesser Town, listed as a UNESCO World Heritage site. This hidden terraced garden was designed by the renowned architect Franti\u0161ek Maxmili\u00e1n Ka\u0148ka and adorned with sculptures by Matthias Bernard Braun and frescoes by V\u00e1clav Vav\u0159inec Reiner. The garden\u0027s design cleverly utilizes the hillside terrain, with cascading terraces, exquisite fountains, sculptures, and meticulously trimmed greenery, collectively creating a harmonious and artistic space. From the highest point of the garden, one can overlook magnificent views of Prague Castle, St. Nicholas Church, and the entire Lesser Town. It is not merely a place of rest but a living Baroque work of art.", "name": "Vrtba Garden", "transport": "Tram lines 12, 15, 20, 22, 23 to Hellichova stop, then approximately a 2-minute walk."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed 13, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | Lichtenstein Palace is a magnificent Baroque palace located on the Lesser Town Square in Prague, with a history dating back to the 17th century. This palace is renowned for its spectacular facade and exquisite interior decorations, and it once served as the residence of the Liechtenstein family. Today, it primarily functions as a teaching building and concert hall for the Music Faculty of the Academy of Performing Arts in Prague. Although its interior is not frequently open to the public, its value as an architectural work of art is undeniable. The palace\u0027s concert hall is famous for its excellent acoustics, often hosting classical music concerts and cultural events, adding brilliance to Prague\u0027s artistic life. Its grand exterior and historical background make it an unmissable architectural landmark on the Lesser Town Square.", "name": "Lichtenstein Palace", "transport": "Tram lines 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed stop; Metro Line A to Malostransk\u00e1 station, then approximately a 5-7 minute walk."}], "name": "Art Museums and Churches"}, "cat_3": {"items": [{"address": "Letensk\u00e1 10, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Wallenstein Garden is a magnificent Baroque garden located in Prague\u0027s Lesser Town, part of the Wallenstein Palace complex. This 17th-century masterpiece is renowned for its exquisite geometric patterns, meticulously trimmed hedges, spectacular fountains, sculptures, and a grand grotto. The Hercules Fountain and Salamander Fountain in the garden\u0027s center are iconic landmarks, while peacocks freely roaming add an unexpected delight for visitors. It\u0027s not only an ideal place for walks and relaxation, but also frequently hosts concerts and cultural events in summer, allowing visitors to enjoy art in a historical ambiance. Its design, inspired by Italian Renaissance gardens, makes it one of Central Europe\u0027s most beautiful Baroque gardens, offering a tranquil oasis away from the city\u0027s hustle and bustle.", "name": "Wallenstein Garden", "transport": "Metro Line A Malostransk\u00e1 station; Tram lines 12, 15, 20, 22 Malostransk\u00e1 station"}, {"address": "Pet\u0159\u00ednsk\u00e9 sady, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Pet\u0159\u00edn Hill is a large hill located west of Prague\u0027s Lesser Town, one of the city\u0027s largest green lungs, offering magnificent panoramic views of the city. This hill not only boasts dense forests and scenic walking trails but also encompasses several famous attractions such as the Pet\u0159\u00edn Lookout Tower, Rose Garden, Mirror Maze, and Strahov Monastery. Visitors can choose to take the funicular railway for an easy ascent or hike up along winding paths, enjoying different perspectives of the city along the way. The Rose Garden at the summit bursts with fragrant blooms in spring and summer, making it a popular spot for couples and family picnics. Pet\u0159\u00edn Hill is an excellent destination for Prague residents and tourists to connect with nature and enjoy outdoor activities, with its diverse landscapes and recreational facilities making it an indispensable natural treasure of the Lesser Town.", "name": "Pet\u0159\u00edn Hill", "transport": "Take the Pet\u0159\u00edn Funicular from \u00dajezd station; Tram lines 9, 12, 15, 20, 22 \u00dajezd station"}, {"address": "Karmelitsk\u00e1 25, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Vrtba Garden is one of Prague\u0027s most exquisite Baroque terraced gardens, celebrated as one of Central Europe\u0027s most beautiful Baroque gardens. It is cleverly built into the hillside, divided into three terraces, each boasting unique designs and breathtaking views. The garden is renowned for its opulent sculptures, fountains, frescoes, and meticulously manicured greenery, crafted by famous architects and artists. From the highest viewing terrace, visitors can overlook the red-tiled roofs of Lesser Town, the dome of St. Nicholas Church, and Prague Castle in the distance, creating a picturesque scene. Although not large in area, its rich artistic details and tranquil atmosphere make it a hidden gem, offering a unique and unforgettable sensory experience, ideal for photography enthusiasts and visitors seeking a moment of peace.", "name": "Vrtba Garden", "transport": "Tram lines 12, 15, 20, 22 Hellichova or Malostransk\u00e9 n\u00e1m\u011bst\u00ed station"}, {"address": "Na Kamp\u011b 8b, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Kampa Island, surrounded by the Vltava River and its tributary, the Devil\u0027s Stream (\u010certovka), is known as \u0027Prague\u0027s Venice.\u0027 This picturesque island is a tranquil corner of the Lesser Town, featuring lush parks, historic mills, art installations, and charming riverside scenery. One of the island\u0027s most famous landmarks is the \u0027Kampa Museum,\u0027 showcasing modern art, while the surrounding park is a popular spot for locals and visitors to stroll, picnic, and relax. The colorful houses and watermills along the banks of the Devil\u0027s Stream create a unique romantic atmosphere, and the watermill beneath Charles Bridge adds historical charm. With its leisurely pace and poetic scenery, Kampa Island offers a haven away from the city\u0027s hustle and bustle.", "name": "Kampa Island", "transport": "Accessible by foot from Charles Bridge; Tram lines 12, 15, 20, 22 Hellichova station"}, {"address": "U Lu\u017eick\u00e9ho semin\u00e1\u0159e 17, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Vojanovy Sady is one of Prague\u0027s oldest gardens, located in the heart of the Lesser Town, right next to Charles Bridge. This hidden oasis, once a monastery\u0027s orchard and vegetable garden, has now become a peaceful public park. The garden features tall fruit trees, manicured lawns, a small pond, and a Baroque-style Chapel of St. Joseph. Most notably, peacocks freely roam the garden, their elegant presence adding vibrant color to this green space. Vojanovy Sady is a perfect retreat where visitors can temporarily escape the city\u0027s hustle and bustle, enjoying moments of peace and beauty. Its unique historical background and tranquil atmosphere make it an unmissable secret garden in the Lesser Town.", "name": "Vojanovy Sady", "transport": "Metro Line A Malostransk\u00e1 station; Tram lines 12, 15, 20, 22 Malostransk\u00e1 station"}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 3, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Ledebour Garden is the largest and most spectacular of the series of palace gardens below Prague Castle, and part of the United Palace Gardens (Palace Gardens below Prague Castle). This Baroque terraced garden is renowned for its exquisite design, magnificent fountains, and sculptures, ascending in layers along the hillside, offering stunning views of the city and the castle. Garden features include a grand pavilion, a terrace with a Neptune fountain, and meticulously trimmed hedges and flowerbeds. Visitors can stroll along winding paths, admiring views from different heights, and experiencing the luxury and elegance of 17th-century aristocratic life. Ledebour Garden is not only a masterpiece of architecture and horticultural art but also an excellent spot for panoramic views of Prague, especially beautiful at sunset.", "name": "Ledebour Garden", "transport": "Metro Line A Malostransk\u00e1 station; Tram lines 12, 15, 20, 22 Malostransk\u00e1 station"}, {"address": "Vald\u0161tejnsk\u00e9 n\u00e1m\u011bst\u00ed 1, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Small F\u00fcrstenberg Garden is a smaller but equally charming part of the palace garden complex below Prague Castle, adjacent to Ledebour Garden. This Baroque terraced garden attracts visitors with its exquisite design and unique charm. The garden features elegant pavilions, fountains, sculptures, and meticulously trimmed hedges, with each terrace offering a different perspective, allowing visitors to admire magnificent views of the Lesser Town and the Vltava River. Although its scale is not as grand as other large gardens, the beauty of its details and tranquil atmosphere make Small F\u00fcrstenberg Garden a perfect hidden corner. Visitors can find a moment of peace here, immerse themselves in the historical ambiance, and simultaneously enjoy one of Prague\u0027s most beautiful panoramic views. It is an exemplary combination of natural beauty and superb horticultural art.", "name": "Small F\u00fcrstenberg Garden", "transport": "Metro Line A Malostransk\u00e1 station; Tram lines 12, 15, 20, 22 Malostransk\u00e1 station"}, {"address": "\u00dajezd 40, 118 00 Mal\u00e1 Strana, Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Seminary Garden is a vast and scenic area at the foot of Pet\u0159\u00edn Hill, once the vineyards and orchards of Strahov Monastery. Today, it has become an open public park, known for its abundant fruit trees (especially cherry trees), wide lawns, and winding paths. Every spring, when the cherry blossoms are in full bloom, the entire garden transforms into a pink sea, attracting countless visitors for viewing and picnics. It\u0027s not only a great place to enjoy natural scenery but also offers excellent vantage points overlooking the Lesser Town and Prague Castle. The garden also has many benches for visitors to rest, making it an ideal spot for walks, jogging, or simply enjoying the sun. With its tranquil atmosphere and seasonal beauty, Seminary Garden adds a unique pastoral charm to the Lesser Town.", "name": "Seminary Garden", "transport": "Take the Pet\u0159\u00edn Funicular from \u00dajezd station; Walk up Pet\u0159\u00edn Hill"}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "Karl\u016fv most, 110 00 Praha 1, Czechia", "feature": "\u2b50 4.8 stars | Charles Bridge is one of Prague\u0027s most iconic landmarks, and admiring it from the Lesser Town (Mal\u00e1 Strana) side offers a unique charm. Here, you can not only get up close to the exquisite Baroque sculptures on the bridge, such as the statue of St. John of Nepomuk, but also take in the magnificent views of the Vltava River, Prague Castle, and the Old Town. Early morning or twilight, when the light is soft, is the best time to capture stunning photos. The bridge tower itself is also a worthwhile viewpoint to climb; from the top, you\u0027ll have panoramic views of the entire Lesser Town\u0027s red-tiled roofs and winding streets, making it an unmissable photo spot for photographers and tourists alike.", "name": "Charles Bridge (Lesser Town Side)", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 5 minutes walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Located in the heart of Lesser Town Square, St. Nicholas Church is one of Central Europe\u0027s most outstanding Baroque buildings. Its magnificent green dome and towering bell tower are breathtaking from any angle. The church interior is even more opulent, adorned with splendid frescoes, sculptures, and a massive organ, with every detail showcasing the pinnacle of 18th-century Baroque art. Sunlight streaming through the stained-glass windows adds a sacred glow to the interior, making it an excellent spot for capturing architectural beauty and religious art. Climbing the bell tower offers enchanting panoramic views of the Lesser Town.", "name": "St. Nicholas Church", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 5 minutes walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station."}, {"address": "Velkop\u0159evorsk\u00e9 n\u00e1m\u011bst\u00ed, 100 00 Praha 1, Czechia", "feature": "\u2b50 4.3 stars | The Lennon Wall is a graffiti wall brimming with color and historical significance. Since the 1980s, it has been a symbol of peace, love, and freedom. The constantly changing graffiti, lyrics, and messages on the wall attract visitors from all over the world to leave their mark or take photos. This is not only a place to commemorate John Lennon but also a platform for expressing the ideals and rebellious spirit of the younger generation. Its vibrant colors and rich patterns make it a visually striking photo spot, with every picture imbued with a sense of story and artistic flair.", "name": "Lennon Wall", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 10 minutes walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station, then walk."}, {"address": "Malostransk\u00e9 n\u00e1m\u011bst\u00ed, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Lesser Town Square is the heart of Prague\u0027s Lesser Town, surrounded by St. Nicholas Church and numerous historic palaces and townhouses. The Plague Column and fountain in the center of the square add a sense of historical gravitas to this vibrant space. It\u0027s not only an excellent spot to admire Baroque architecture but also a great place to soak in the local atmosphere. The square is lined with many cafes and restaurants where visitors can sit outdoors, enjoy a meal, and watch the passersby and surrounding buildings, making it an ideal place to experience Prague\u0027s unique charm.", "name": "Lesser Town Square (Malostransk\u00e9 n\u00e1m\u011bst\u00ed)", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 5 minutes walk; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e9 n\u00e1m\u011bst\u00ed station."}, {"address": "Letensk\u00e1 123/4, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.7 stars | Wallenstein Garden is one of Prague\u0027s most beautiful Baroque gardens, part of the Wallenstein Palace (now home to the Czech Senate). The garden features meticulously trimmed hedges, exquisite sculptures, fountains, an artificial grotto, and a grand loggia. Most notably, peacocks roam freely throughout the garden, adding vibrant color to this tranquil oasis. The architecture and natural landscape blend perfectly here, making it an ideal spot for capturing elegant scenic photos and enjoying moments of serenity, especially in spring and summer when the flowers are in full bloom and truly stunning.", "name": "Wallenstein Garden", "transport": "Metro Line A to Malostransk\u00e1 station, direct exit; or take trams 12, 15, 20, 22, 23 to Malostransk\u00e1 station."}, {"address": "Na Kamp\u011b 501/8, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Kampa Island is known as \u0027Prague\u0027s Venice,\u0027 nestled between the Vltava River and the Devil\u0027s Stream (\u010certovka). This picturesque islet is famous for its tranquil atmosphere, old mills, water wheels, and unique art installations. The island is shaded by lush trees and boasts many charming cafes and art galleries. Popular photo spots include the \u0027Water Goblin\u0027 sculpture by the Devil\u0027s Stream and the \u0027Babies\u0027 sculptures created by artist David \u010cern\u00fd. From Kampa Island, you can also enjoy captivating views of Charles Bridge and the Old Town, making it an excellent place for a stroll, relaxation, and capturing romantic photos.", "name": "Kampa Island", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 10 minutes walk; or directly accessible from the Lesser Town side of Charles Bridge."}, {"address": "Pet\u0159\u00ednsk\u00e9 sady 633, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.6 stars | Pet\u0159\u00edn Lookout Tower, located atop Pet\u0159\u00edn Hill, is Prague\u0027s \u0027Little Eiffel Tower.\u0027 Although not on the flat ground of the Lesser Town, it\u0027s easily accessible from Mal\u00e1 Strana via funicular. Climbing to the top of the tower offers a 360-degree panoramic view of Prague, including Prague Castle, Charles Bridge, the Old Town, the red-tiled roofs of the Lesser Town, and distant mountains. Whether by day or night, the views here are breathtaking, making it an excellent spot for capturing city panoramas and spectacular sunsets. The surrounding Pet\u0159\u00edn Park is also a great place for walks and picnics.", "name": "Pet\u0159\u00edn Lookout Tower", "transport": "Take the Pet\u0159\u00edn Funicular from \u00dajezd station up the hill (\u00dajezd station is accessible by trams 9, 12, 15, 20, 22, 23); or walk up the hill from Mal\u00e1 Strana."}, {"address": "Nerudova, 118 00 Praha 1, Czechia", "feature": "\u2b50 4.5 stars | Nerudova Street is a historic cobblestone street leading from Lesser Town Square to Prague Castle. This street is famous for its well-preserved Baroque architecture and unique \u0027house signs.\u0027 Before house numbers were established, each building had its own distinctive emblem, such as \u0027House of the Three Fiddles\u0027 or \u0027House of the Red Lion,\u0027 which are still clearly visible today. Lined with boutiques, art galleries, and restaurants, a stroll here feels like stepping back centuries into old Prague. The street is quite steep, but the scenery and historical ambiance along the way are absolutely worth exploring, making it a popular spot for photographing Prague\u0027s ancient streetscapes and characteristic buildings.", "name": "Nerudova Street", "transport": "Metro Line A to Malostransk\u00e1 station, approximately 10-15 minutes walk; or walk uphill from the Lesser Town side of Charles Bridge."}], "name": "Popular Photo Spots"}}, "name": "\u5c0f\u57ce\u5340 (Mal\u00e1 Strana)"}, "new_town": {"categories": {"cat_1": {"items": [{"address": "V\u00e1clavsk\u00e9 n\u00e1m., 110 00 Nov\u00e9 M\u011bsto, Prague 1, Czechia", "feature": "\u2b50 4.5 stars | The vibrant heart of Prague\u0027s New Town, Wenceslas Square is not only a commercial and cultural hub but also a silent witness to countless pivotal events in Czech history. This long, tree-lined boulevard is flanked by magnificent buildings, including the National Museum and numerous boutiques, hotels, and restaurants. At the top of the square stands the equestrian statue of St. Wenceslas, symbolizing the patron saint of the Czech Republic. From the proclamation of Czechoslovakia\u0027s independence to the peaceful demonstrations of the Velvet Revolution, Wenceslas Square carries the nation\u0027s memories and hopes, making it an indispensable stop for understanding modern Czech history. Its lively atmosphere attracts both tourists and locals, day and night.", "name": "Wenceslas Square", "transport": "Metro Line A/C Muzeum station; Metro Line A M\u016fstek station; served by multiple tram lines"}, {"address": "V\u00e1clavsk\u00e9 n\u00e1m. 68, 110 00 Nov\u00e9 M\u011bsto, Prague 1, Czechia", "feature": "\u2b50 4.6 stars | Perched at the top of Wenceslas Square, the National Museum is one of the largest and oldest museums in the Czech Republic. Its grand Neo-Renaissance main building, designed by Josef Schulz, opened in 1891. The museum houses vast collections spanning natural sciences, history, art, and music, narrating the rich cultural heritage and natural history of the Czech lands. From its towering dome and exquisite facade to its opulent interior decorations and spacious exhibition halls, the National Museum is an architectural masterpiece in itself. It serves not only as a temple of knowledge but also as a prominent feature of Prague\u0027s skyline, offering visitors a deep insight into the Czech national spirit.", "name": "National Museum", "transport": "Metro Line A/C Muzeum station; multiple tram lines"}, {"address": "Jir\u00e1skovo n\u00e1m. 6, 120 00 Nov\u00e9 M\u011bsto, Prague 2, Czechia", "feature": "\u2b50 4.4 stars | The Dancing House, also known as \u0027Fred and Ginger,\u0027 is a highly recognizable modern building on the Vltava River embankment in Prague\u0027s New Town. Co-designed by Croatian-Czech architect Vlado Miluni\u0107 and Canadian-American architect Frank Gehry, it was completed in 1996. This building is famous for its unique deconstructivist style, with two towers symbolizing a pair of dancers: one glass tower representing the female dancer Ginger, and the other stone tower representing the male dancer Fred, seemingly dancing gracefully by the river. It breaks away from the strictness of traditional Prague architecture, injecting modern artistic vitality into the city\u0027s landscape, and has become one of Prague\u0027s most popular photo spots. The top floor features a restaurant and an observation deck, offering beautiful views of the Vltava River and Prague Castle.", "name": "Dancing House", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed station; Trams 17, 14, 2 Jir\u00e1skovo n\u00e1m\u011bst\u00ed stop"}, {"address": "Karlovo n\u00e1m., 120 00 Nov\u00e9 M\u011bsto, Prague 2, Czechia", "feature": "\u2b50 4.3 stars | Charles Square is the largest square in Prague\u0027s New Town and one of the largest medieval squares in Europe, established by Charles IV in 1348. It once served as the administrative center of the New Town, surrounded by many important historical buildings, including the New Town Hall, St. Ignatius Church, and Faust House. At the center of the square is a beautiful park, shaded by trees and featuring fountains and sculptures, making it a popular spot for locals to relax. Despite its grand scale, Charles Square exudes a tranquil atmosphere, contrasting with the hustle and bustle of Wenceslas Square. It has witnessed centuries of Prague\u0027s historical changes and is an ideal starting point for exploring the historical fabric of the New Town.", "name": "Charles Square", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed station; multiple tram lines"}, {"address": "Karlovo n\u00e1m. 1/23, 120 00 Nov\u00e9 M\u011bsto, Prague 2, Czechia", "feature": "\u2b50 4.2 stars | Situated in Charles Square, the New Town Hall is one of the oldest buildings in Prague\u0027s New Town, with its history dating back to the 14th century. This Gothic edifice is renowned for its towering spire and exquisite facade, having served as the administrative center of the New Town and the birthplace of the Prague citizens\u0027 uprising during the Hussite Wars. The Town Hall\u0027s tower offers magnificent panoramic views of the city, making it an excellent spot to overlook Charles Square and its surroundings. Despite numerous reconstructions and renovations, it retains its original historical charm, standing as a living testament to Prague\u0027s rich history. Today, it is primarily used for cultural events, weddings, and conferences, continuing its role as an important public space in the New Town.", "name": "New Town Hall", "transport": "Metro Line B Karlovo n\u00e1m\u011bst\u00ed station; Trams 3, 6, 10, 16, 18, 22 Karlovo n\u00e1m\u011bst\u00ed stop"}, {"address": "Jungmannovo n\u00e1m. 753/18, 110 00 Nov\u00e9 M\u011bsto, Prague 1, Czechia", "feature": "\u2b50 4.3 stars | The Church of Our Lady of the Snows, located in Prague\u0027s New Town near Wenceslas Square, is a Gothic church founded by Charles IV in 1347. Although its original grand design was never fully realized, the church remains impressive with its soaring vaults and immense nave, boasting one of the highest vaults in Prague. The interior is richly decorated, featuring Baroque altars and exquisite frescoes, exuding a solemn and tranquil atmosphere. It played a significant role in the Hussite Wars and has undergone several historical transformations. Today, it serves as an active place of worship while also attracting visitors for its unique architectural style and historical significance.", "name": "Church of Our Lady of the Snows", "transport": "Metro Line A/B M\u016fstek station; Trams 3, 9, 14, 24 Vodi\u010dkova stop"}, {"address": "Jind\u0159i\u0161sk\u00e1 970/33, 110 00 Nov\u00e9 M\u011bsto, Prague 1, Czechia", "feature": "\u2b50 4.5 stars | Jind\u0159i\u0161sk\u00e1 Tower, also known as the Bell Tower of St. Henry and St. Kunhuta Church, is a freestanding Gothic bell tower in Prague\u0027s New Town, soaring 65 meters high, making it the tallest freestanding bell tower in Prague. Built in the 15th century, it was originally part of the Church of St. Henry and St. Kunhuta, but the tower was preserved after the church\u0027s demolition in the 17th century. The tower features an elevator, allowing visitors to ascend to the
