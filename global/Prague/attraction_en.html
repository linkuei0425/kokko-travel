le artistic treasure to explore.", "name": "Church of St. Procopius", "transport": "Trams 9, 15, Lipansk\u00e1 station, then about a 5-minute walk."}, {"address": "Mahlerovy sady 2699/1, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.4 stars | The \u017di\u017ekov Television Tower is one of Prague\u0027s most controversial yet unique modern buildings. This 216-meter-tall tower is famous for its futuristic design and the \u0027Babies\u0027 sculptures created by Czech artist David \u010cern\u00fd, which add a peculiar artistic touch to the tower. Inside, there\u0027s an observation deck, restaurant, and bar, offering a 360-degree panoramic view of Prague, making it an excellent spot to admire cityscapes and modern art. It is not just a communication facility but also an urban landmark that blends art and tourism.", "name": "\u017di\u017ekov Television Tower", "transport": "Metro Line A, Ji\u0159\u00edho z Pod\u011bbrad station, then about a 10-15 minute walk; Trams 9, 15, Perunova station, then about a 5-7 minute walk."}, {"address": "\u010cajkovsk\u00e9ho 12/12, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.5 stars | The Atrium na \u017di\u017ekov\u011b Cultural Center is a vibrant cultural and artistic space housed within a meticulously restored Baroque church. It regularly hosts classical music concerts, jazz performances, art exhibitions, and theatrical productions, offering rich cultural experiences for locals and visitors alike. The center retains the original solemn atmosphere of the church while incorporating modern facilities, making it a unique and charming artistic sanctuary. Here, you can immerse yourself in an elegant artistic ambiance and enjoy high-quality cultural events.", "name": "Atrium na \u017di\u017ekov\u011b Cultural Center", "transport": "Trams 9, 15, Lipansk\u00e1 station, then about a 3-minute walk."}], "name": "Art Museums and Churches"}, "cat_3": {"items": [{"address": "Riegrovy sady 28, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.6 stars | Riegrovy Sady is one of the most popular parks in Prague\u0027s Vinohrady and \u017di\u017ekov districts, renowned for its magnificent panoramic city views, especially from its western side, offering charming vistas of Prague Castle, Lesser Town, and Old Town. This expansive park is an ideal place for locals and visitors to relax, featuring wide lawns, winding paths, and lush groves. The park hosts a famous outdoor beer garden where, during warmer months, people can enjoy cold beer and local delicacies while admiring beautiful sunsets. Additionally, the park includes a children\u0027s playground, sports facilities, and a small stadium, providing a variety of activities for visitors of all ages. Whether for a morning run, a picnic, a stroll, or simply a place to unwind, Riegrovy Sady offers a perfect urban oasis.", "name": "Riegrovy Sady", "transport": "Take Metro Line A to \u0027Ji\u0159\u00edho z Pod\u011bbrad\u0027 station, or Trams 10, 16 to \u0027Perunova\u0027 station, then walk approximately 5-10 minutes to arrive."}, {"address": "U Havl\u00ed\u010dkov\u00fdch sad\u016f 1, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.7 stars | Havli\u010dkovy Sady, also known as Gr\u00e9bovka Park, is one of Prague\u0027s most beautiful English-style parks, famous for its unique vineyard, romantic grotto, and the Neo-Renaissance Gr\u00e9bovka Villa. This expansive park features manicured gardens, picturesque lakes and waterfalls, and winding paths, perfect for leisurely strolls. One of its most striking features is one of Prague\u0027s oldest vineyards, which hosts a wine harvest festival every autumn. Visitors can sample local wines at the pavilion next to the vineyard while enjoying city views. Additionally, the park boasts an exquisite grotto, adorned with artificial stalactites and sculptures, creating a mysterious and romantic atmosphere. The Gr\u00e9bovka Villa itself is an architectural masterpiece, and its surroundings make it a popular venue for weddings and various events.", "name": "Havli\u010dkovy Sady / Gr\u00e9bovka Park", "transport": "Take Metro Line A to \u0027N\u00e1m\u011bst\u00ed M\u00edru\u0027 station, then transfer to Trams 7, 22 to \u0027Jana Masaryka\u0027 station, and walk approximately 5 minutes to arrive."}, {"address": "Mahlerovy sady 1, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.3 stars | Mahlerovy Sady is a modern park surrounding Prague\u0027s iconic \u017di\u017ekov Television Tower. This park is known for its unique art installations and contemporary landscape design, complementing the tower\u0027s futuristic style. The most famous feature within the park is Czech artist David \u010cern\u00fd\u0027s \u0027Babies\u0027 sculptures \u2013 giant, faceless infants climbing the tower\u0027s pillars, with some also scattered across the park\u0027s lawns, adding a surreal touch. Mahlerovy Sady offers a tranquil green space where visitors can relax in the city center while enjoying spectacular views of the television tower. The park has comfortable benches and well-maintained lawns, making it a great spot for a picnic or reading. Although not large, its unique artistic atmosphere and central location make it a worthwhile attraction in the \u017di\u017ekov district.", "name": "Mahlerovy Sady / \u017di\u017ekov Television Tower Park", "transport": "Take Metro Line A to \u0027Ji\u0159\u00edho z Pod\u011bbrad\u0027 station, and walk approximately 5 minutes to arrive."}, {"address": "V\u00edtkovsk\u00e1 13, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.5 stars | Paruk\u00e1\u0159ka Park is an expansive and popular park in the \u017di\u017ekov district, situated on a small hill and renowned for its excellent panoramic views of Prague. From the park\u0027s elevated position, visitors can enjoy magnificent vistas of iconic landmarks such as Prague Castle, Old Town, Lesser Town, and the \u017di\u017ekov Television Tower. This park is a popular spot for locals engaging in outdoor activities, including jogging, walking, dog walking, and picnicking. The park features wide lawns, lush groves, and winding paths, offering a tranquil environment away from the city\u0027s hustle and bustle. Additionally, the park includes a children\u0027s playground and a small beer garden, providing convenience for families and friends gathering. Paruk\u00e1\u0159ka Park\u0027s natural beauty and open spaces make it a perfect urban escape, allowing visitors to enjoy nature while immersing themselves in Prague\u0027s historical and cultural atmosphere.", "name": "Paruk\u00e1\u0159ka Park", "transport": "Take Metro Line A to \u0027Flora\u0027 station, then transfer to Trams 9, 15 to \u0027Ol\u0161ansk\u00e9 n\u00e1m\u011bst\u00ed\u0027 station, and walk approximately 10 minutes to arrive."}, {"address": "U Pam\u00e1tn\u00edku 1900, 130 00 Praha 3-\u017di\u017ekov, Czechia", "feature": "\u2b50 4.6 stars | V\u00edtkov Hill is a significant historical landmark and expansive urban park in Prague\u0027s \u017di\u017ekov district, known for its National Monument and the colossal equestrian statue of Jan \u017di\u017eka. This hill not only carries rich historical significance but also offers an excellent vantage point for panoramic views of Prague. The park features manicured lawns, wide pathways, and lush groves, providing ample space for visitors to stroll, jog, or picnic. From the summit, one can overlook Prague Castle, Old Town, New Town, and the surrounding \u017di\u017ekov district, offering breathtaking scenery. The National Monument itself is a magnificent building, housing a museum and exhibitions that narrate Czech history. V\u00edtkov Hill combines history, culture, and natural beauty, making it a comprehensive attraction for both learning history and enjoying outdoor activities.", "name": "V\u00edtkov Hill", "transport": "Take Trams 1, 9, 15 to \u0027Husineck\u00e1\u0027 station, and walk approximately 10-15 minutes to reach the summit."}, {"address": "Sady Svatopluka \u010cecha, 120 00 Praha 2-Vinohrady, Czechia", "feature": "\u2b50 4.2 stars | Sady Svatopluka \u010cecha is an elegant and tranquil small park located in the heart of Prague\u0027s Vinohrady district. Named after the Czech poet Svatopluk \u010cech, a statue commemorating him stands at its center. The park features a simple yet refined design with manicured lawns, carefully arranged flowerbeds, and tall trees, providing an ideal resting place for surrounding residents. A beautiful fountain is a prominent feature within the park, offering a touch of coolness during hot summer days. Although not large, its elegant atmosphere and central location make it a popular meeting point and relaxation spot. Whether for a short break, reading, or simply enjoying a moment of peace, Sady Svatopluka \u010cecha offers a pleasant urban oasis.", "name": "Sady Svatopluka \u010cecha", "transport": "Take Metro Line A to \u0027Ji\u0159\u00edho z Pod\u011bbrad\u0027 station, and walk approximately 5 minutes to arrive."}, {"address": "Heroldovy sady, 101 00 Praha 10-Vr\u0161ovice, Czechia", "feature": "\u2b50 4.1 stars | Heroldovy Sady is a charming and tranquil park located on the edge of Prague\u0027s Vinohrady district, offering local residents a green haven away from the city\u0027s hustle and bustle. This park is known for its beautiful flowerbeds, manicured lawns, and mature trees, creating a pleasant environment for strolling and relaxation. The park features a children\u0027s playground, making it an ideal spot for families with kids. While Heroldovy Sady may not be as expansive as some larger parks, its refined design and maintenance give it a unique charm. The park\u0027s benches are perfect spots for enjoying the sun, reading a book, or simply observing daily life. It is a typical neighborhood park, showcasing the elegance and practicality of Prague\u0027s urban green spaces, providing a peaceful oasis amidst busy city life.", "name": "Heroldovy Sady", "transport": "Take Trams 4, 7, 22 to \u0027Rusk\u00e1\u0027 station, and walk approximately 2 minutes to arrive."}, {"address": "Sady Brat\u0159\u00ed \u010capk\u016f, 101 00 Praha 10-Vr\u0161ovice, Czechia", "feature": "\u2b50 4.3 stars | Sady Brat\u0159\u00ed \u010capk\u016f is a tranquil and historic park located near Prague\u0027s Vinohrady district, named in honor of the famous Czech writers, brothers Karel \u010capek and Josef \u010capek. This elegantly designed park features wide lawns, tall trees, and meticulously maintained flowerbeds, providing an ideal place for visitors to relax. The park includes children\u0027s play facilities, making it a popular choice for families with kids. The atmosphere of Sady Brat\u0159\u00ed \u010capk\u016f is very pleasant, making it a preferred spot for local residents to stroll, jog, or enjoy outdoor time. Benches are distributed throughout the park, allowing people to sit, rest, and appreciate the surrounding greenery. This is a typical European city park, combining natural beauty with cultural commemorative significance, adding a touch of green and historical color to urban life.", "name": "Sady Brat\u0159\u00ed \u010capk\u016f", "transport": "Take Trams 4, 7, 22 to \u0027Rusk\u00e1\u0027 station, and walk approximately 5 minutes to arrive."}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "Mahlerovy sady 2699/1, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.2 stars | This unique television tower is one of the most controversial yet eye-catching modern buildings in Prague\u0027s skyline, designed by architect V\u00e1clav Oliver Desler. It\u0027s famous for its towering structure and the \u0027Crawling Babies\u0027 sculptures attached to its exterior, bronze infants created by Czech artist David \u010cern\u00fd, which add a touch of surreal humor to the otherwise serious architecture. Visitors can take an elevator to the observation deck for breathtaking panoramic views of Prague, day or night, making it an excellent spot for photography enthusiasts to capture cityscapes. The tower also houses a restaurant and cafe, offering a comfortable dining experience with superb views, making it a must-visit to experience Prague\u0027s modern face.", "name": "\u017di\u017ekov Television Tower", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 10 minutes; or take a tram to Lipansk\u00e1 or Ol\u0161ansk\u00e9 n\u00e1m\u011bst\u00ed station."}, {"address": "Riegrovy sady 28, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Riegrovy Sady Park is one of Prague\u0027s most popular parks, renowned for its magnificent sunset views. From viewpoints within the park, visitors can enjoy stunning panoramic vistas of Prague Castle, Lesser Town, and Old Town, especially in the evening when the setting sun bathes the entire city in golden hues, making it an ideal spot for photographers to capture romantic moments. The park features expansive lawns, winding paths, and a lively beer garden, serving as a great place for locals and tourists to relax, picnic, or enjoy outdoor activities. Whether strolling, jogging, or simply sitting to admire the scenery, here you can experience Prague\u0027s leisurely charm and beauty.", "name": "Riegrovy Sady Park", "transport": "Take a tram to Italsk\u00e1 or Vinohradsk\u00e1 tr\u017enice station; or take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, then walk for about 15 minutes."}, {"address": "N\u00e1m\u011bst\u00ed Ji\u0159\u00edho z Pod\u011bbrad, 130 00 Praha 3-Vinohrady", "feature": "\u2b50 4.6 stars | Located in Ji\u0159\u00edho z Pod\u011bbrad Square, this church is a masterpiece by Slovenian architect Jo\u017ee Ple\u010dnik, renowned for its unique Modernist style. The church\u0027s exterior is simple yet grand, with a massive circular clock as its most prominent feature, hailed as the largest church clock in Central Europe. The interior design is equally stunning, filled with light and a sense of space, distinctly different from traditional Gothic or Baroque churches. It is one of Prague\u0027s most beautiful and architecturally significant modern religious buildings. Whether admiring its unique form from the outside or stepping inside to experience its serene atmosphere, it offers an unforgettable experience and is a popular spot for many photographers.", "name": "Church of the Most Sacred Heart of Our Lord", "transport": "Take Metro Line A to Ji\u0159\u00edho z Pod\u011bbrad station, exit directly."}, {"address": "Havl\u00ed\u010dkovy sady 2188, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.7 stars | Havl\u00ed\u010dkovy Sady, also known as Gr\u00e9bovka Park, is one of Prague\u0027s most beautiful English parks, incorporating elements of Renaissance style. The park boasts one of Prague\u0027s oldest vineyards, hosting a grape harvest festival every autumn. It also features a charming artificial grotto and a magnificent Neo-Renaissance Gr\u00f6be Villa. Stroll along the winding paths, admire the meticulously manicured gardens, fountains, and sculptures, and soak in its unique romantic atmosphere. Whether for a family picnic, a romantic walk, or simply enjoying the beauty of nature, this is an excellent choice, and its rich landscape offers endless possibilities for photography.", "name": "Havl\u00ed\u010dkovy Sady / Gr\u00e9bovka Park", "transport": "Take a tram to Krymsk\u00e1 or Jana Masaryka station; or take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru station, then walk for about 15 minutes."}, {"address": "U Pam\u00e1tn\u00edku 1900, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | This magnificent national monument is situated atop V\u00edtkov Hill, built to commemorate significant events and figures in Czech history. Most notably, in front of the monument stands the colossal equestrian statue of Jan \u017di\u017eka, a legendary general from the Hussite Wars, considered one of the largest equestrian statues in the world. From the monument\u0027s observation platform, visitors can enjoy breathtaking panoramic views of Prague, including the Old Town, New Town, and Prague Castle, making it an excellent spot for capturing cityscapes and sunsets. The monument also houses a museum detailing the history of the Czech Republic, making it an ideal photo spot that combines historical culture with stunning scenery.", "name": "National Monument on V\u00edtkov Hill", "transport": "Take a tram to Husineck\u00e1 or Viktoria \u017di\u017ekov station, then walk for about 10-15 minutes; or take a bus to U Pam\u00e1tn\u00edku station."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.5 stars | N\u00e1m\u011bst\u00ed M\u00edru (Peace Square) is the heart of Prague\u0027s Vinohrady district, famous for its magnificent Church of St. Ludmila. This Neo-Gothic church, with its twin spires and exquisite facade, is the square\u0027s focal point, especially during Christmas when a lively Christmas market is held, adorned with dazzling lights and a festive atmosphere, making it an excellent spot for festive photos. The square is surrounded by historic buildings, including the beautiful Vinohrady Theatre, creating an elegant and vibrant urban ambiance. Whether admiring its architectural beauty by day or experiencing its unique charm by night, N\u00e1m\u011bst\u00ed M\u00edru is a worthwhile photo spot.", "name": "N\u00e1m\u011bst\u00ed M\u00edru", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru station, exit directly; or take a tram to N\u00e1m\u011bst\u00ed M\u00edru station."}, {"address": "Vinohradsk\u00e1 1835/153, 130 00 Praha 3-\u017di\u017ekov", "feature": "\u2b50 4.5 stars | Ol\u0161any Cemetery is one of Prague\u0027s largest and most significant cemeteries, and a unique photo spot rich in history and artistic atmosphere. It is the final resting place for many famous Czech historical figures, including writers, artists, and politicians. The cemetery contains tens of thousands of tombstones, many featuring exquisite sculptures and architectural designs, ranging from Art Nouveau to Gothic, showcasing the artistic styles of different eras. Stroll among the ancient gravestones, feel its serene and solemn atmosphere, as if traveling through time. The autumn colors here are particularly captivating, with fallen leaves complementing the old gravestones, offering unique photographic subjects for enthusiasts.", "name": "Ol\u0161any Cemetery", "transport": "Take a tram to Ol\u0161ansk\u00e9 h\u0159bitovy or \u017delivsk\u00e9ho station; or take Metro Line A to \u017delivsk\u00e9ho station."}, {"address": "N\u00e1m\u011bst\u00ed M\u00edru 7, 120 00 Praha 2-Vinohrady", "feature": "\u2b50 4.6 stars | Vinohradsk\u00e9 divadlo (Vinohrady Theatre) is one of Prague\u0027s most magnificent and beautiful theatre buildings, located next to N\u00e1m\u011bst\u00ed M\u00edru. This Art Nouveau building, completed in 1907, boasts a splendid facade, exquisite sculptures, and elegant interior decorations that are truly breathtaking. The theatre is not only an important cultural institution but also a landmark in the Vinohrady district. Its unique architectural style makes it a popular spot for photography enthusiasts to capture the beauty of Prague\u0027s architecture. Whether admiring its external grandeur or having the opportunity to enter and watch a performance, one can feel the artistic ambiance and historical charm emanating from this theatre.", "name": "Vinohradsk\u00e9 divadlo", "transport": "Take Metro Line A to N\u00e1m\u011bst\u00ed M\u00edru station, exit directly; or take a tram to N\u00e1m\u011bst\u00ed M\u00edru station."}], "name": "Popular Photo Spots"}}, "name": "\u8461\u8404\u9152\u838a\u5340\u8207\u9f4a\u8332\u79d1\u592b (Vinohrady \u0026 \u017di\u017ekov)"}, "vysehrad": {"categories": {"cat_1": {"items": [{"address": "\u0160tulcova 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | This magnificent Gothic cathedral is the most prominent landmark in the Vy\u0161ehrad area, with its twin spires soaring into the sky, forming a vital part of Prague\u0027s skyline. The church\u0027s interior is lavishly decorated, featuring exquisite frescoes, stained-glass windows, and Art Nouveau embellishments, particularly renowned for its spectacular altar and statue of the Virgin Mary. It is not only a place of worship but also a treasure trove of Czech art and history, bearing witness to centuries of dynastic rise and fall and cultural shifts. The surrounding square and gardens also offer excellent spaces for relaxation and scenic views, making it a must-visit for tourists.", "name": "Basilica of St. Peter and St. Paul", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "\u0160tulcova 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.6 stars | Adjacent to the Basilica of St. Peter and St. Paul, Vy\u0161ehrad Cemetery is the final resting place for Czech national elites, hailed as the \u0027Pantheon of Czech National Glory.\u0027 It is the burial site of numerous famous Czech composers, writers, artists, and scientists, such as Dvo\u0159\u00e1k, Smetana, and Mucha. The cemetery itself is an open-air sculpture park, with beautifully designed, artistic tombstones. The most striking among them is the \u0027Slav\u00edn\u0027 communal tomb, commemorating individuals who made outstanding contributions to the nation. A stroll through here allows visitors not only to feel the weight of history but also to appreciate unique funerary art.", "name": "Vy\u0161ehrad Cemetery", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | The Rotunda of St. Martin is one of Prague\u0027s oldest surviving Romanesque buildings, with its history dating back to the second half of the 11th century. This small yet sturdy circular church is renowned for its unique architectural style and long history. It originally served as the parish church of Vy\u0161ehrad Castle, later used as a gunpowder magazine, warehouse, and even a residence, but eventually restored to its religious purpose. The rotunda\u0027s brickwork and simple interior decoration showcase the characteristics of early medieval architecture, serving as a living fossil for understanding Prague\u0027s millennium-long history.", "name": "Rotunda of St. Martin", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | Vy\u0161ehrad\u0027s magnificent walls stand as powerful testament to its role as a medieval royal fortress. These sturdy fortifications encircle the entire Vy\u0161ehrad area, offering excellent walking paths and panoramic views of the Vltava River and Prague. The walls\u0027 history dates back to the 10th century, and they were continuously reinforced and expanded over subsequent centuries, particularly during the Baroque period. Strolling atop the walls, visitors can imagine the scene of ancient guards patrolling and grasp the strategic importance of this ancient stronghold.", "name": "Vy\u0161ehrad Walls and Fortifications", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10 minutes to reach the wall entrance; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | The Vy\u0161ehrad Casemates are a fascinating part of Vy\u0161ehrad\u0027s defensive system, consisting of a series of intricate underground passages and halls, primarily built during the Baroque period in the 17th century. These subterranean spaces were originally used for storing supplies, ammunition, and served as shelters and strategic passages for soldiers. Visitors can join guided tours to explore these dark and mysterious underground tunnels and learn about Vy\u0161ehrad\u0027s significant role in military history. One of the halls also displays replicas of original Baroque sculptures from Vy\u0161ehrad Park, offering visitors a unique historical experience.", "name": "Vy\u0161ehrad Casemates", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 3.9 stars | Libu\u0161e\u0027s Bath is not an actual bath but a mysterious stone remnant on the edge of the Vy\u0161ehrad cliff, closely linked to ancient Czech legends. According to folklore, this was where the ancient Duchess Libu\u0161e prophesied Prague\u0027s future glory and where she cast her unfaithful lover into the Vltava River. Although its true purpose and historical origin remain a mystery, this site has become a unique historical landmark in the Vy\u0161ehrad area due to its romantic yet slightly tragic legend. It offers an opportunity to ponder the intertwining of Czech myth and history, while also enjoying magnificent views of the Vltava River.", "name": "Libu\u0161e\u0027s Bath", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 15-20 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.0 stars | The Remains of the Old Vy\u0161ehrad Palace stand as a silent testament to Vy\u0161ehrad\u0027s role as the residence of early Czech monarchs. Although most of the palace buildings no longer exist, archaeological excavations have revealed its grand scale and significant historical importance. This was once the home of P\u0159emyslid dynasty kings, including Vratislaus II, the first King of Bohemia. Visitors can learn about its history from the information boards around the site and imagine scenes of royal life from days gone by. These surviving foundations and walls serve as a reminder of Vy\u0161ehrad\u0027s central position in the history of Prague and the entire Czech Republic.", "name": "Remains of the Old Vy\u0161ehrad Palace", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.2 stars | Leopold Gate is one of Vy\u0161ehrad\u0027s most magnificent and best-preserved Baroque city gates, built in the late 17th century and a crucial part of Vy\u0161ehrad\u0027s defensive system. This gate is renowned for its exquisite sculptural decorations and sturdy structure. The sculptures above the gate depict the Habsburg coat of arms and military themes, showcasing the imperial power of the time. It is one of the main entrances to the core area of Vy\u0161ehrad, and passing through this gate feels like stepping back in time into Prague\u0027s ancient history.", "name": "Leopold Gate (Leopoldova br\u00e1na)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 15 minutes; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank."}], "name": "Historical Landmarks and Architecture"}, "cat_2": {"items": [{"address": "\u0160tulcova 1000/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | The most magnificent landmark in the Vy\u0161ehrad district, this Neo-Gothic basilica proudly stands with its twin spires, forming a prominent part of the Prague skyline. Its interior is lavishly decorated with exquisite frescoes, stained-glass windows, and sculptures, narrating Czech history and religious stories. Particularly noteworthy are its spectacular stained glass, and the windows of the Chapel of the Virgin Mary designed by Alfons Mucha. The church is not only a religious center but also a masterpiece of art and architecture, with a history dating back to the 11th century. After multiple reconstructions and expansions, it presents its current splendid appearance. Visitors can experience a solemn atmosphere here, admire the superb craftsmanship, and learn about the legendary stories of Czech royalty and saints.", "name": "Basilica of St. Peter and St. Paul", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | The Rotunda of St. Martin is the oldest surviving Romanesque building in Prague, with its history dating back to the second half of the 11th century. This small yet sturdy circular church is renowned for its unique architectural style and long history. Although its interior is usually not open to the public, its exterior red brick structure and simple lines are an artwork in themselves, bearing witness to Prague\u0027s millennia of changes. It was once used as a warehouse and even as a gunpowder magazine during the Napoleonic Wars, but it ultimately survived, becoming a living fossil of Vy\u0161ehrad\u0027s history. Visitors can admire this ancient building while strolling through Vy\u0161ehrad, imagining its role throughout history.", "name": "Rotunda of St. Martin", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 15-minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located within the Vy\u0161ehrad walls."}, {"address": "\u0160tulcova 1000/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.8 stars | Vy\u0161ehrad Cemetery is not just a resting place, but also an open-air sculpture museum and a symbol of the Czech national spirit. Many great figures in Czech history are buried here, including composers Dvo\u0159\u00e1k and Smetana, writer Karel \u010capek, and artist Mucha, among others. The gravestones are exquisitely designed, many of them sculptural works created by renowned artists, each full of stories and artistic value. Strolling through, visitors can feel a solemn and peaceful atmosphere, while appreciating a rich variety of artistic expressions and understanding the profound heritage of Czech culture. This is a unique place to commemorate ancestors and experience the fusion of history and art.", "name": "Vy\u0161ehrad Cemetery", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located next to the Basilica of St. Peter and St. Paul."}, {"address": "\u0160tulcova 1000/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | Slav\u00edn is the most representative monument in Vy\u0161ehrad Cemetery, known as the \u0027Pantheon\u0027 of the Czech Republic. This magnificent tomb was built at the end of the 19th century to commemorate artists, scientists, and politicians who made outstanding contributions to the Czech nation. Above it stands a colossal sculpture symbolizing \u0027The Glory of the Homeland\u0027. Slav\u00edn is not only an important historical site but also a beautiful work of art in itself, combining Neo-Renaissance and Art Nouveau styles. Visitors can pay tribute to the heroes of the Czech nation here, feel a strong sense of national pride, and admire its solemn and symbolic architecture and sculpture.", "name": "Slav\u00edn", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located within Vy\u0161ehrad Cemetery."}, {"address": "V Pevnosti 160/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.0 stars | Galerie Vy\u0161ehrad is located within the Vy\u0161ehrad district and is a space dedicated to contemporary art exhibitions. It utilizes Vy\u0161ehrad\u0027s historical atmosphere to offer visitors a unique platform for appreciating the dialogue between modern art and historical heritage. The gallery regularly changes exhibitions, showcasing works in various forms such as painting, sculpture, and photography by Czech and international artists. Visiting Galerie Vy\u0161ehrad not only enriches one\u0027s understanding of Czech art but also allows visitors to experience the vitality and innovation of art within Vy\u0161ehrad\u0027s ancient walls. This is a cultural venue that perfectly combines past and present, tradition and modernity.", "name": "Galerie Vy\u0161ehrad", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located within the Vy\u0161ehrad district; the exact location may vary depending on the exhibition, usually within historical buildings."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | Muzeum Vy\u0161ehrad offers an in-depth introduction to the rich history of the Vy\u0161ehrad district, from prehistoric times to the modern era. The museum\u0027s exhibits cover archaeological finds, historical documents, models, and interactive displays, detailing Vy\u0161ehrad\u0027s significance as the seat of early Czech dukes and kings, and its evolution as a religious, political, and cultural center. Through the exhibitions, visitors can learn about Vy\u0161ehrad\u0027s legendary stories, including the legend of St. Wenceslas, the constructions by Charles IV, and its role in the Czech National Revival. This is an excellent place to understand the deep historical and cultural background of the Vy\u0161ehrad district, providing visitors with a comprehensive knowledge perspective.", "name": "Muzeum Vy\u0161ehrad", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located within the Vy\u0161ehrad district, usually near the Brick Gate (Ciheln\u00e1 br\u00e1na)."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | The Vy\u0161ehrad Casemates are part of the 17th-century Baroque fortifications, consisting of a series of intricate underground passages. Visitors can explore these dark and mysterious tunnels, feeling the weight of history. At the end of the casemates is Gorlice Hall, a massive underground space where some of the original Baroque statues from Charles Bridge are preserved. These statues were replaced with replicas due to age and weather erosion, while the originals are carefully preserved and displayed here. Thus, Gorlice Hall is not only a historical site but also a unique art exhibition space, allowing visitors to admire these precious Baroque art masterpieces up close.", "name": "Vy\u0161ehrad Casemates and Gorlice Hall", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. The entrance is located near the Brick Gate (Ciheln\u00e1 br\u00e1na) in the Vy\u0161ehrad district."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 3.9 stars | The Chapel of St. Ludmila is a small and tranquil religious building located within the Vy\u0161ehrad district, close to the main Basilica of St. Peter and St. Paul. Although not as grand as the basilica, it carries significant religious meaning, commemorating the first Czech saint \u2013 St. Ludmila. The chapel\u0027s interior is usually simply decorated, but its historical atmosphere and function as a place of prayer make it an indispensable part of Vy\u0161ehrad. Visitors can find a moment of peace here, experience the historical legacy of early Czech Christianity, and appreciate the simple beauty of this small chapel. It represents another facet of Vy\u0161ehrad\u0027s rich religious history.", "name": "Chapel of St. Ludmila", "transport": "Metro Line C to Vy\u0161ehrad station, then about a 10-15 minute walk; or take trams 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill. Located within the Vy\u0161ehrad district, near the Basilica of St. Peter and St. Paul."}], "name": "Art Museums and Churches"}, "cat_3": {"items": [{"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | Vy\u0161ehrad Park is the core green space of Prague\u0027s Vy\u0161ehrad district, covering a vast area with neatly manicured lawns, ancient trees, winding paths, and numerous breathtaking viewpoints. It\u0027s not only an ideal spot for locals to stroll, picnic, and relax, but also an excellent place for visitors to experience historical ambiance and natural beauty. Scattered throughout the park are many sculptures, including statues of figures from Czech mythology, adding an artistic touch to this tranquil oasis. As you wander, you can gaze upon the Vltava River, Prague Castle, and the city skyline, feeling the passage of time and the weight of history. With its fresh air and elegant environment, it\u0027s the perfect choice to escape the city\u0027s hustle and bustle and enjoy a moment of serenity.", "name": "Vy\u0161ehrad Park (Vy\u0161ehradsk\u00e9 sady)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes to reach it; or take tram lines 3, 7, 17, 21 to V\u00fdto\u0148 station, then walk uphill along the riverbank for about 15-20 minutes."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (located within Vy\u0161ehrad Park, near the Basilica of St. Peter and St. Paul)", "feature": "\u2b50 4.8 stars | Located on the edge of the Vy\u0161ehrad district, this viewpoint offers one of Prague\u0027s most magnificent vistas. From here, you can enjoy an unobstructed view of the winding Vltava River, the elegant silhouette of Charles Bridge, and the majestic Prague Castle complex in the distance. Especially at sunset, when the setting sun bathes the castle in golden hues and the river shimmers, the scenery is picturesque and enchanting. There are safety railings and ample space for visitors to take photos or simply admire the view. Whether by day or night, this viewpoint is the best spot to capture Prague\u0027s classic scenery and a popular choice for romantic dates.", "name": "Vltava River and Prague Castle Viewpoint (Vyhl\u00eddka na Vltavu a Pra\u017esk\u00fd hrad)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes into Vy\u0161ehrad Park, and follow the signs to find the viewpoint."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (located within Vy\u0161ehrad Park, near the Rotunda of St. Martin)", "feature": "\u2b50 4.5 stars | Karlach Gardens is a relatively hidden and tranquil corner within the Vy\u0161ehrad district, known for its exquisite horticultural design and historical sculptures. Named after the Czech historian and writer Karlach, the garden is shaded by lush trees and adorned with vibrant flowers, offering a retreat from the bustling crowds. Within the garden stands a monument commemorating Czech national heroes. The benches here are ideal for relaxing, reading, or contemplation. Despite its modest size, its unique atmosphere and beautiful scenery make it an unmissable natural attraction within Vy\u0161ehrad, especially suitable for visitors who appreciate peace and a sense of history.", "name": "Karlach Gardens (Karlachovy sady)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes into Vy\u0161ehrad Park, and follow the signs to find it."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (located within Vy\u0161ehrad Park, near the Basilica of St. Peter and St. Paul)", "feature": "\u2b50 4.4 stars | \u0160tulc Gardens is another charming small garden within the Vy\u0161ehrad district, located right next to the Basilica of St. Peter and St. Paul. This garden attracts visitors with its beautiful scenery and tranquil atmosphere. Various flowers and shrubs are planted here, offering different color variations throughout the seasons. Its design is simple yet elegant, providing several benches for visitors to enjoy a moment of peace and natural beauty after visiting the cathedral. The garden\u0027s excellent location allows for appreciation of the cathedral\u0027s magnificent architecture from various angles, making it an ideal spot for photography enthusiasts to capture panoramic views of the church.", "name": "\u0160tulc Gardens (\u0160tulcovy sady)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes into Vy\u0161ehrad Park, and follow the signs to find it."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (south side of Vy\u0161ehrad district, along the riverbank)", "feature": "\u2b50 4.6 stars | Vy\u0161ehrad Rock is one of the most prominent natural landmarks in Prague\u0027s Vy\u0161ehrad district. This steep cliff stands proudly on the banks of the Vltava River, providing a natural defense for Vy\u0161ehrad. From the top of the rock, the views are incredibly magnificent, offering not only a panoramic sight of the expansive river but also distant views of Prague\u0027s cityscape. The rock itself is steeped in legend; it is said that Princess Libu\u0161e from Czech mythology once prophesied Prague\u0027s glory here. Strolling along the paths at the edge of the rock, you can feel the awe-inspiring power of nature and the weight of history. The open vista here makes it an excellent spot to admire Prague\u0027s full panorama and appreciate its unique geographical location.", "name": "Vy\u0161ehrad Rock (Vy\u0161ehradsk\u00e1 sk\u00e1la)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes to the Vy\u0161ehrad district, and follow the city walls to reach the rock area."}, {"address": "K rotund\u011b 10, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | Although a cemetery, Vy\u0161ehrad Cemetery is renowned as one of Prague\u0027s most beautiful green spaces due to its unique artistic atmosphere and garden landscape. It is the final resting place for many prominent figures of the Czech nation, including composer Dvo\u0159\u00e1k, Mucha, and other artists, writers, and scientists. The cemetery is shaded by lush trees, adorned with blooming flowers, and features exquisitely designed tombstones, many of which are works of art themselves. Strolling through, one can not only feel the weight of history but also appreciate the delicate horticulture and sculptural art. It is a tranquil and solemn place, offering a unique perspective to understand Czech culture and history, as well as an elegant space suitable for contemplation and relaxation.", "name": "Vy\u0161ehrad Cemetery (Vy\u0161ehradsk\u00fd h\u0159bitov)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes into the Vy\u0161ehrad district; the cemetery is located next to the Basilica of St. Peter and St. Paul."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (located below Vy\u0161ehrad Rock, near the Vltava River)", "feature": "\u2b50 3.9 stars | Libu\u0161e\u0027s Bath is a legendary spot beneath Vy\u0161ehrad Rock, said to be where the ancient Czech Princess Libu\u0161e bathed. It is a naturally formed rock cave or depression, imbued with mystery and ancient legends. Although it might appear as an unassuming rock formation today, the historical stories and mythological tales behind it make it a fascinating natural attraction within the Vy\u0161ehrad district. Visitors can find it on the path below Vy\u0161ehrad Rock, experiencing the ancient charm and rich folklore of this land. It serves as a reminder that this area offers not only magnificent scenery but also deep cultural heritage.", "name": "Libu\u0161e\u0027s Bath (Libu\u0161ina l\u00e1ze\u0148)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes to the Vy\u0161ehrad district, and then follow the path below Vy\u0161ehrad Rock to find it."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia (encircling the Vy\u0161ehrad district)", "feature": "\u2b50 4.6 stars | Strolling along Vy\u0161ehrad\u0027s ancient walls is an experience in itself, offering a chance to enjoy natural scenery. These historic walls are not just defensive fortifications but also provide an excellent scenic walkway. From the walls, you can enjoy 360-degree views of Prague\u0027s cityscape, including the Vltava River, surrounding residential areas, distant hills, and the green spaces within Vy\u0161ehrad. The path is lined with lush greenery, and the air is fresh, making it an ideal place for outdoor activities, walking, or jogging. The wall walkway is well-maintained, safe, and comfortable, allowing visitors to immerse themselves in history while fully enjoying Prague\u0027s natural beauty and expansive views.", "name": "Vy\u0161ehrad Walls Walkway (Vy\u0161ehradsk\u00e9 hradby)", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes to the Vy\u0161ehrad district; the wall walkway encircles the entire area."}], "name": "Natural Scenery and Parks"}, "cat_4": {"items": [{"address": "\u0160tulcova 100/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.7 stars | The most magnificent Gothic architecture in Prague\u0027s Vy\u0161ehrad district, its twin spires stand out prominently in the city skyline. The church\u0027s interior is lavishly decorated with exquisite frescoes, stained-glass windows, and a breathtaking altar. Especially when sunlight streams through the stained glass, the interplay of light and shadow creates a sacred and solemn atmosphere, making it an excellent spot for photography enthusiasts to capture light and color. The square in front of the church often features street performers, adding a lively touch.", "name": "Basilica of St. Peter and St. Paul", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10-15 minutes to reach it. Alternatively, take tram lines 3, 7, 17, or 21 to V\u00fdto\u0148 station, then walk uphill."}, {"address": "K rotund\u011b 1000/1, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.8 stars | This historic cemetery is the final resting place for many famous Czech artists, writers, musicians, and scientists. The gravestones are exquisitely designed and full of artistic flair, with the most striking being the \u0027Slav\u00edn\u0027 communal tomb, a magnificent Neo-Renaissance monument commemorating great figures of the Czech nation. Strolling through it, you can not only feel the weight and glory of history but also appreciate unique cemetery art, making it a peaceful and story-filled photo spot.", "name": "Vy\u0161ehrad Cemetery and Slav\u00edn", "transport": "Located next to the Basilica of St. Peter and St. Paul, it can be visited together with the church."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.6 stars | Strolling along the ancient walls of Vy\u0161ehrad, you can overlook magnificent views of the Vltava River, Prague Castle, Lesser Town, and New Town from multiple angles. The panoramic views here are excellent, allowing for stunning city skyline photos whether it\u0027s day or evening. Especially at sunset, when the golden glow bathes Prague, it\u0027s a prime time for photographers. The walls themselves are steeped in history, making for an excellent backdrop.", "name": "Vy\u0161ehrad Walls and Viewpoints", "transport": "There are multiple viewpoints within the Vy\u0161ehrad complex, accessible by following the paths."}, {"address": "K rotund\u011b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.4 stars | The Rotunda of St. Martin is the oldest and best-preserved Romanesque rotunda in Prague, with its history dating back to the 11th century. This small yet unique building, with its rounded shape and red roof, looks particularly charming amidst the lush greenery of Vy\u0161ehrad Park. Although its interior is not often open, its rustic exterior and the surrounding tranquil atmosphere make it a photo spot rich in historical charm, especially suitable for capturing its unique architectural style.", "name": "Rotunda of St. Martin", "transport": "Located near Vy\u0161ehrad Cemetery, accessible on foot."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.0 stars | These three broken stone columns stand within Vy\u0161ehrad Park, their origin shrouded in mysterious legends. It is said that the devil once tried to prevent the construction of the Vy\u0161ehrad church and brought these columns from Rome, but ultimately failed and smashed them here. Regardless of the truth of the legend, these unique columns themselves possess a strong visual impact, making them an excellent photo spot for creative shots and exploring historical tales.", "name": "Devil\u0027s Column", "transport": "Located within the Vy\u0161ehrad complex, accessible on foot."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 3.8 stars | These stone ruins, located on the cliff edge on the south side of Vy\u0161ehrad, are said to be where the legendary Duchess Libu\u0161e leaped into the Vltava River. Although only remnants remain, its unique geographical location and the ancient legend behind it make it a photo spot full of romance and mystery. From here, you can overlook the river and feel the vicissitudes of history, making it a place for profound and evocative photos.", "name": "Libu\u0161e\u0027s Bath Ruins", "transport": "Follow the paths within the Vy\u0161ehrad complex towards the south side to reach it."}, {"address": "V Pevnosti, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.5 stars | Vy\u0161ehrad Park is dotted with several groups of monumental sculptures created by the renowned Czech sculptor Josef Myslbek, depicting legendary Czech heroes such as Libu\u0161e and P\u0159emysl. These imposing sculptures are not only artistic masterpieces but also add a rich cultural atmosphere to the park. They serve as excellent photo backdrops, imbuing pictures with a sense of story and historical depth.", "name": "Statues in Vy\u0161ehrad Park", "transport": "Located within the Vy\u0161ehrad complex, discover them along the park paths."}, {"address": "V Pevnosti 159/5b, 128 00 Praha 2-Vy\u0161ehrad, Czechia", "feature": "\u2b50 4.3 stars | The Brick Gate is one of the main entrances to Vy\u0161ehrad, built in the early 19th century as part of its fortifications. This Neo-Classical gate, with its sturdy brick and stone structure and arched passage, exudes an ancient and solemn atmosphere. It serves as a gateway to Vy\u0161ehrad\u0027s historic area and is an excellent photo spot for capturing the grandeur of the entrance. Inside, it also houses the entrance to the Vy\u0161ehrad casemates and a visitor center, combining functionality with aesthetic appeal.", "name": "Ciheln\u00e1 br\u00e1na / Brick Gate", "transport": "Take Metro Line C to Vy\u0161ehrad station, then walk for about 10 minutes to reach this gate."}], "name": "Popular Photo Spots"}}, "name": "\u9ad8\u5821\u5340 (Vy\u0161ehrad)"}};

            const catKeys = Object.keys(dbData[curDist].categories || {});
            catKeys.forEach(c => {
                let b = document.createElement('button');
                // 補上 whitespace-nowrap 讓按鈕不換行
                b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive transition-colors duration-200';
                b.innerText = dbData[curDist].categories[c].name;
                b.onclick = () => selectCat(c, b);
                container.appendChild(b);
            });
            if(catKeys.length > 0) selectCat(catKeys[0], container.children[0]);
        }

        function selectCat(c, b) {
            curCat = c;
            Array.from(document.getElementById('category-buttons').children).forEach(btn => btn.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-inactive');
            // 補上 whitespace-nowrap 讓按鈕不換行
            b.className = 'whitespace-nowrap px-4 py-2 md:px-5 md:py-2.5 rounded-lg font-bold text-[13px] md:text-sm border cat-btn-active shadow-sm';
            renderItems();
        }

        function renderItems() {
            let items = dbData[curDist]?.categories[curCat]?.items || [];
            if(items.length === 0) { document.getElementById('content-area').innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 md:text-lg">No attractions available in this category.</div>`; return; }
            document.getElementById('content-area').innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between hover:shadow-xl transition-all duration-300 fade-in">
                    <div class="p-6 md:p-8 flex-grow">
                        <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-3">${item.name}</h3>
                        <p class="text-sm md:text-base text-gray-700 leading-relaxed mb-5">${item.feature}</p>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-start gap-3 border border-slate-100">
                            <p class="text-sm md:text-base text-gray-600 leading-tight font-medium">
                                <span class="font-bold text-sky-800">📌 Address:</span><br>${item.address || 'See Map'}<br><br>
                                <span class="font-bold text-rose-600">🚇 Transport:</span><br>${item.transport || 'See Map'}
                            </p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 md:px-8 md:pb-8 mt-auto">
                        <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name + ' ' + cityName)}" target="_blank" class="w-full flex items-center justify-center py-3 md:py-4 rounded-xl shadow-sm text-sm md:text-base font-bold text-white bg-sky-600 hover:bg-sky-700 transition-colors"><i class="fa-solid fa-map-location-dot mr-2"></i> Open Map</a>
                    </div>
                </div>
            `).join('');
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
